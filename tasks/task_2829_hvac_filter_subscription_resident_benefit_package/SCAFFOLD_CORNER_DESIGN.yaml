      - name: higher_priority_error_wins_when_two_validation_rules_are_violated
        claim_type: priority_ordering
        grounds: [validations.priority_17, validations.priority_18]
        distinguishing_aspect: "Both the entitlement rule and the coverage-window rule are violated by the same submission, and only the lower-numbered priority's error_id may surface."
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / entitlement_priority_17_beats_coverage_window_priority_18_on_claim_submit"
          rationale: "The difficulty instance already forces a simultaneous double violation on POST /claims and pins the response to priority 17's ERR_ENTITLEMENT_INACTIVE, then relaxes the entitlement to prove priority 18's ERR_OUTSIDE_COVERAGE_WINDOW was latent all along. A separate breadth test of the same ordering rule would assert the identical response body."

      - name: property_state_check_outranks_the_fiscal_check_on_activation
        claim_type: priority_conflict
        grounds: [validations.priority_8, validations.priority_30]
        distinguishing_aspect: "A suspended property whose balance also exceeds the credit limit must return the state error, not the 402."
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / property_state_priority_8_beats_credit_limit_priority_30_on_activate"
          rationale: "The difficulty instance constructs exactly this P versus P+22 collision on POST /subscriptions/{id}/activate, asserts ERR_PROPERTY_NOT_ACTIVE, then reactivates the property to show the 402 emerge from underneath. Duplicating it here would add no distinct coverage."

      - name: activation_blocked_when_the_bound_sku_is_discontinued
        claim_type: cross_entity_validation
        grounds: [validations.priority_19, errors.ERR_SKU_DISCONTINUED]
        distinguishing_aspect: "The subscription and property are both faultless; the only defect is the status of the FilterSku the subscription was bound to at creation time."
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / shipment_scheduling_blocked_by_discontinued_filtersku_state"
          rationale: "The difficulty instance already drives priority 19 from both of its declared applies_to endpoints, including the case where the SKU is discontinued AFTER the subscription bound to it, and additionally proves the gate lifts when the SKU is reactivated. A breadth-level repeat would exercise the same rule with a strictly weaker setup."

  - section: endpoints
    instances:

      - name: logical_clock_default_and_repointing_drive_every_temporal_read
        claim_type: action_endpoint
        grounds: [endpoints.POST_clock_set_current_utc, calculations.first_month_fee_cents, state_machines.Subscription.PENDING_SETUP_to_ACTIVE]
        distinguishing_aspect: "This is the only endpoint that mutates nothing yet changes the outcome of later writes: before it is ever called the server must read exactly 2026-08-01T00:00:00Z (never wall time), and after one call the identical activation payload produces a different activated_at, a different first_month_fee_cents and a different first shipment date."
        test_recipe:
          setup:
