          - entities.CertifyingOfficial.fields.status
          - entities.CertifyingOfficial.fields.official_level
        distinguishing_aspect: "The X-User-ID must resolve to a CertifyingOfficial row (unknown id gives ERR_OFFICIAL_NOT_REGISTERED), that row must be ACTIVE (a deactivated official gives ERR_OFFICIAL_INACTIVE), and its official_level must match the claimed role in both directions — an SCO acting as SupervisorySCO and a SUPERVISORY acting as SchoolCertifyingOfficial both give ERR_OFFICIAL_LEVEL_MISMATCH — while the two correctly paired identities succeed."
