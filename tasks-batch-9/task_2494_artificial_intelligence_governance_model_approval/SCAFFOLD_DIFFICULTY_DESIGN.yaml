  - rule_id: boundary_precision_check
    instances:

      - name: bias_metric_and_sample_size_exactly_on_their_thresholds
        grounds: "calculations.eval_threshold_profile decides PASSED/FAILED with two independent >= comparisons: observed_metric_value >= required_metric_threshold AND sample_size >= required_sample_size. For a HIGH-tier use case those are 0.80 (a 2-decimal ratio) and 1000 (an integer count), and a value exactly equal to either threshold must pass."
        distinguishing_aspect: "two DIFFERENT metrics of different kinds tested on the same call - a fixed-precision ratio and an integer count - on the endpoint POST /test-evaluations/{id}/complete. The recipe walks each threshold from exactly-on to one unit below (0.8000 vs 0.7999, 1000 vs 999) and shows the AND means either miss alone flips the verdict. The use case is also parked exactly on the HIGH tier band edge (score 70) so the thresholds themselves sit on a boundary."
        test_recipe:
          setup: "Register and approve a first-party asset, then create a use case that scores exactly 70 - the lowest HIGH-tier score - from CONSEQUENTIAL impact, HUMAN_ON_LOOP autonomy, INTERNAL sensitivity, reach 100000 and no listed jurisdictions (40 + 18 + 6 + 6 + 0). Classify it, pin a binding, and plan three BIAS evaluations in adjacent windows. HIGH-tier BIAS threshold is 0.80 with MIN_SAMPLE_SIZE 1000."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "In-House Platform", model_name: "ih-triage", model_version: "1.0.0", hosting: "ON_PREM", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bp_asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Grievance triage at exactly the HIGH band edge", business_unit: "People", description: "routes staff grievances with a reviewer watching", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "CONSEQUENTIAL", jurisdictions: [], deployed_headcount_reach: 100000}, as: Requester, as_user_id: "usr_req_1", captures: {bp_uc: "$.data.id", bp_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${bp_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bp_v2: "$.data.version", bp_score: "$.data.risk_score", bp_tier: "$.data.risk_tier"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${bp_asset}", expected_use_case_version: "${bp_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bp_bind: "$.data.id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${bp_uc}", model_binding_id: "${bp_bind}", eval_type: "BIAS", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bp_e_on: "$.data.id", bp_thr: "$.data.required_metric_threshold", bp_minn: "$.data.required_sample_size"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${bp_uc}", model_binding_id: "${bp_bind}", eval_type: "BIAS", window_start_at: "2026-08-03T00:00:00Z", window_end_at: "2026-08-04T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bp_e_ratio_low: "$.data.id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${bp_uc}", model_binding_id: "${bp_bind}", eval_type: "BIAS", window_start_at: "2026-08-04T00:00:00Z", window_end_at: "2026-08-05T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bp_e_sample_low: "$.data.id"}}
          trigger:
            - {call: "POST /test-evaluations/{id}/complete", payload: {worst_group_parity_ratio: 0.8000, sample_size: 1000}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bp_on_status: "$.data.status"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {worst_group_parity_ratio: 0.7999, sample_size: 1000}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bp_ratio_low_status: "$.data.status"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {worst_group_parity_ratio: 0.8000, sample_size: 999}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bp_sample_low_status: "$.data.status"}}
          assert:
            - "the use case sits exactly on the band edge: risk_score == 70 and risk_tier == HIGH (69 would have been LIMITED)"
            - "all three evaluations were stamped with required_metric_name == worst_group_parity_ratio, required_metric_threshold == 0.80 and required_sample_size == 1000"
            - "evaluation one, exactly on both thresholds, is PASSED - both comparisons are >= and neither boundary value is treated as a miss"
            - "evaluation two, ratio 0.7999 with sample 1000, is FAILED - one ten-thousandth below the threshold is enough, so the ratio must not be rounded to two decimals before comparison"
            - "evaluation three, ratio exactly 0.8000 with sample 999, is FAILED - the sample-size arm of the AND fails on its own"
            - "each evaluation's observed_metric_value equals the submitted ratio exactly as supplied (0.8000, 0.7999, 0.8000)"
            - "after the sequence UseCase.safety_flag == true, because the last BIAS run to complete FAILED; UseCase.status == CHANGES_REQUESTED, moved there by the first FAILED run"
            - "no ERR_INVALID_REQUEST is raised for the fourth-decimal ratio - the metric accepts more precision than the threshold declares"

      - name: incident_containment_deadline_at_the_exact_second
        grounds: "SM MonitoringIncident forks OPEN -> CONTAINED on now <= containment_deadline_at and OPEN -> ESCALATED on now > containment_deadline_at, where the deadline comes from calculations.incident_containment_deadline as detected_at + ceil(CONTAINMENT_BASE_HOURS * TIER_SPEED_FACTOR) hours. The comparison is inclusive on the deadline instant itself."
        distinguishing_aspect: "a DIFFERENT metric kind - an instant on the logical clock, compared to the second, rather than a ratio or a row count - and a DIFFERENT endpoint (POST /monitoring-incidents/{id}/contain). The boundary is also crossed by moving the clock rather than by changing a payload number, and being one second late changes the resulting STATE rather than a stored verdict field."
        test_recipe:
          setup: "Approve the short-chain LIMITED use case (first-party asset, no jurisdictions, one PASSED BIAS run, two gates cleared) so final_risk_tier is LIMITED and TIER_SPEED_FACTOR is 1.0. Then file two SEV2 incidents with the same detected_at of 2026-08-01T00:00:00Z, giving both a containment_deadline_at of 2026-08-02T00:00:00Z (24 base hours * 1.0)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "In-House Platform", model_name: "ih-roster", model_version: "0.9.0", hosting: "INTERNAL", modality: "TABULAR", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Shift roster optimiser", business_unit: "Operations", description: "proposes weekly shift rosters with supervisor sign-off", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {ct_uc: "$.data.id", ct_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ct_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${ct_asset}", expected_use_case_version: "${ct_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_bind: "$.data.id"}}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_v3: "$.data.version"}}
            - {call: "POST /use-cases/{id}/oversight-designs", payload: {review_mode: "SAMPLED", sample_pct: 100, escalation_sla_hours: 0, reviewer_role: "BusinessReviewer", override_capability: true, expected_use_case_version: "${ct_v3}"}, as: Requester, as_user_id: "usr_req_1", captures: {ct_od: "$.data.id"}}
            - {call: "POST /oversight-designs/{id}/decide", payload: {decision: "APPROVE"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${ct_uc}", model_binding_id: "${ct_bind}", eval_type: "BIAS", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_e1: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {worst_group_parity_ratio: 0.7500, sample_size: 400}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_g_priv: "$.data[0].id", ct_g_biz: "$.data[1].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "no personal data in scope"}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "value case accepted"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_v_ready: "$.data.version"}}
            - {call: "POST /use-cases/{id}/approve", payload: {expected_use_case_version: "${ct_v_ready}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_tier: "$.data.final_risk_tier"}}
            - {call: "POST /monitoring-incidents", payload: {use_case_id: "${ct_uc}", severity: "SEV2", category: "DRIFT", detected_at: "2026-08-01T00:00:00Z", summary: "roster quality drifted after a shift-pattern change", reported_to_regulator: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_i_on: "$.data.id", ct_hours: "$.data.containment_hours", ct_deadline: "$.data.containment_deadline_at"}}
            - {call: "POST /monitoring-incidents", payload: {use_case_id: "${ct_uc}", severity: "SEV2", category: "DRIFT", detected_at: "2026-08-01T00:00:00Z", summary: "second drift signal on the same model", reported_to_regulator: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ct_i_late: "$.data.id"}}
          trigger:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-02T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /monitoring-incidents/{id}/contain", payload: {reported_to_regulator: false}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {ct_on_status: "$.data.status"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-02T00:00:01Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /monitoring-incidents/{id}/contain", payload: {reported_to_regulator: false}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {ct_late_status: "$.data.status"}}
          assert:
            - "both incidents were stamped containment_hours == 24 (ceil(24 * TIER_SPEED_FACTOR[LIMITED] 1.0)) and containment_deadline_at == 2026-08-02T00:00:00Z, computed from detected_at"
            - "the first contain, at now exactly equal to the deadline, yields status == CONTAINED with contained_at == 2026-08-02T00:00:00Z - the comparison is now <= deadline, inclusive"
            - "the second contain, one second later at 2026-08-02T00:00:01Z, yields status == ESCALATED with contained_at == null - a single second past the deadline changes the target state"
            - "both calls return HTTP 200: being late is a different state, not an error"
            - "the deadline was NOT recomputed from the current clock - had it been, the second incident would also have been containable"
            - "UseCase.monitoring_posture == WATCH: one unresolved incident remains (the ESCALATED one) and no SEV1 exists, so the posture branch is the count branch"
            - "UseCase.status is still APPROVED - a SEV2 pair never reaches the IMPAIRED posture that would suspend the approval"
            - "GET /inventory-summary reports open_incident_count == 1, counting the ESCALATED incident and not the CONTAINED one"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: security_gate_clear_depends_on_evaluation_row_status
        grounds: "SM ReviewGate's IN_REVIEW -> CLEARED row carries a gate-type-specific precondition: when gate_type == SECURITY there must EXIST a TestEvaluation on the use case with eval_type SECURITY_REDTEAM and status == PASSED, otherwise ERR_REQUIRED_EVALUATION_MISSING (validations priority 23). The gate's own state is legal for the transition; what blocks it is the state of a row in a different entity that the request never mentions."
        distinguishing_aspect: "entity pair (ReviewGate, TestEvaluation). The dependency is on STATUS and not on existence - a SECURITY_REDTEAM evaluation that exists but ended FAILED leaves the gate just as blocked - so the recipe distinguishes 'no row', 'wrong-status row' and 'right-status row' in one walk. The blocking row also belongs to a sibling child of the same parent, not to an ancestor."
        test_recipe:
          setup: "Approve a first-party asset, create the HIGH-tier use case that scores exactly 70 (CONSEQUENTIAL, HUMAN_ON_LOOP, INTERNAL, reach 100000, no jurisdictions), classify it so all four gates exist, pin a binding, and open the SECURITY gate. No evaluation exists yet."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "In-House Platform", model_name: "ih-triage", model_version: "1.0.0", hosting: "ON_PREM", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {xs_asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Grievance triage assistant", business_unit: "People", description: "routes staff grievances with a reviewer watching", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "CONSEQUENTIAL", jurisdictions: [], deployed_headcount_reach: 100000}, as: Requester, as_user_id: "usr_req_1", captures: {xs_uc: "$.data.id", xs_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${xs_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {xs_v2: "$.data.version", xs_tier: "$.data.risk_tier"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${xs_asset}", expected_use_case_version: "${xs_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {xs_bind: "$.data.id"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {gate_type: "SECURITY"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {xs_g_sec: "$.data[0].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: SecurityReviewer, as_user_id: "usr_sec_1"}
          trigger:
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "attempting to clear with no red-team evidence"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {xs_err_none: "$.data.error_id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${xs_uc}", model_binding_id: "${xs_bind}", eval_type: "SECURITY_REDTEAM", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {xs_ev_bad: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {adversarial_pass_rate: 0.9000, sample_size: 1000}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {xs_bad_status: "$.data.status"}}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "attempting to clear on a failed red-team"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {xs_err_failed: "$.data.error_id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${xs_uc}", model_binding_id: "${xs_bind}", eval_type: "SECURITY_REDTEAM", window_start_at: "2026-08-03T00:00:00Z", window_end_at: "2026-08-04T00:00:00Z"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {xs_ev_good: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {adversarial_pass_rate: 0.9600, sample_size: 1000}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {xs_good_status: "$.data.status"}}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "red-team passed at 0.96"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {xs_gate_status: "$.data.status"}}
          assert:
            - "with no evaluation row at all, the clear returns HTTP 422 with error_id == ERR_REQUIRED_EVALUATION_MISSING, and the gate is still IN_REVIEW"
            - "the first evaluation is FAILED: HIGH-tier SECURITY_REDTEAM requires adversarial_pass_rate >= 0.95 and 0.9000 misses it"
            - "with a SECURITY_REDTEAM row that EXISTS but is FAILED, the clear returns the same HTTP 422 ERR_REQUIRED_EVALUATION_MISSING - existence is not the dependency, PASSED status is"
            - "the second evaluation is PASSED at 0.9600 with sample_size 1000 == MIN_SAMPLE_SIZE[HIGH]"
            - "the third clear now returns HTTP 200 with gate status == CLEARED, cleared_by_user_id == usr_sec_1 and debt_before_clear == 0.00"
            - "nothing about the SECURITY gate changed between the second and third clear attempts - only a row in TestEvaluation did"
            - "the FAILED SECURITY_REDTEAM run did not set UseCase.safety_flag (that is BIAS-only) but did move UseCase.status to CHANGES_REQUESTED, which is why the gate clear had to remain legal from a CHANGES_REQUESTED parent"
            - "the LEGAL, PRIVACY and BUSINESS gates are untouched and still PENDING - the dependency is scoped to the SECURITY gate type"

      - name: binding_creation_depends_on_model_asset_status
        grounds: "validations priority 30 (ERR_MODEL_ASSET_NOT_APPROVED_FOR_USE) requires the ModelAsset referenced in the body of POST /use-cases/{id}/model-bindings to be in status APPROVED_FOR_USE. The UseCase side of the request is perfectly valid; the write is refused because of the state of the asset row named in the body, and the same request succeeds unchanged once the asset moves."
        distinguishing_aspect: "a DIFFERENT entity pair (ModelBinding, ModelAsset) and a different direction of dependency: here the blocking row is named in the request body rather than discovered by traversal, and the blocked operation is a CREATE rather than a state transition. The instance also pins that the rejected create is a true no-op on the parent's optimistic-concurrency version, so the identical expected_use_case_version can be replayed."
        test_recipe:
          setup: "Register a first-party asset and leave it in REGISTERED. Create and classify a LIMITED-tier use case (MATERIAL, HUMAN_ON_LOOP, INTERNAL, reach 5000, no jurisdictions -> 51) and capture the post-classify UseCase.version."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "In-House Platform", model_name: "ih-roster", model_version: "0.9.0", hosting: "INTERNAL", modality: "TABULAR", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {xb_asset: "$.data.id", xb_asset_status: "$.data.status", xb_asset_v1: "$.data.version"}}
            - {call: "POST /use-cases", payload: {title: "Shift roster optimiser", business_unit: "Operations", description: "proposes weekly shift rosters with supervisor sign-off", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {xb_uc: "$.data.id", xb_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${xb_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {xb_v2: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${xb_asset}", expected_use_case_version: "${xb_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {xb_err: "$.data.error_id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {xb_asset_v2: "$.data.version", xb_asset_status2: "$.data.status"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${xb_asset}", expected_use_case_version: "${xb_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {xb_bind: "$.data.id", xb_pinned: "$.data.pinned_model_version"}}
          assert:
            - "the first create returns HTTP 422 with error_id == ERR_MODEL_ASSET_NOT_APPROVED_FOR_USE while the asset is REGISTERED"
            - "the rejected create is a complete no-op: GET /use-cases/{xb_uc}/model-bindings returns 0 rows, ModelAsset.active_binding_count == 0, and UseCase.version is unchanged"
            - "approve-for-use needed no vendor assessment because is_third_party == false, and it moves the asset to APPROVED_FOR_USE while incrementing its version from 1 to 2"
            - "the second create is byte-identical to the first, including the same expected_use_case_version, and now returns HTTP 201 - the only thing that changed is the asset's status"
            - "the new ModelBinding has status PINNED and pinned_model_version == 2, snapshotting the asset version at pin time rather than the asset's model_version string"
            - "ModelAsset.active_binding_count == 1 after the successful create"
            - "priority 30 is a business_referential check, not an existence check: the asset id resolved fine both times, so ERR_MODEL_ASSET_NOT_FOUND must never be returned here"

  - rule_id: resource_temporal_overlap
    instances:

      - name: evaluation_windows_half_open_on_shared_model_asset
        grounds: "validations priority 36 (ERR_EVALUATION_WINDOW_CONFLICT) and calculations.window_conflict_detection define the evaluation window as HALF-OPEN [window_start_at, window_end_at) over the resource ModelAsset - reached through model_binding_id - with the candidate set restricted to statuses PLANNED, PASSED and FAILED."
        distinguishing_aspect: "half-open interval semantics, so touching windows are LEGAL, and the contended resource is the ModelAsset's test capacity - shared across use cases, so two different use cases bound to the same asset compete for the same timeline. The second instance uses closed intervals on a per-jurisdiction notice slot instead, where touching is illegal."
        test_recipe:
          setup: "Approve one first-party asset and bind TWO different LIMITED-tier use cases to it, so the asset carries two PINNED bindings owned by different use cases. Plan one BIAS evaluation on use case A occupying [2026-08-02T00:00:00Z, 2026-08-03T00:00:00Z)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "In-House Platform", model_name: "ih-shared", model_version: "2.1.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Roster optimiser A", business_unit: "Operations", description: "first consumer of the shared model", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {tw_uc_a: "$.data.id", tw_a_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${tw_a_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_a_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${tw_asset}", expected_use_case_version: "${tw_a_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_bind_a: "$.data.id"}}
            - {call: "POST /use-cases", payload: {title: "Roster optimiser B", business_unit: "Logistics", description: "second consumer of the same shared model", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {tw_uc_b: "$.data.id", tw_b_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${tw_b_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_b_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${tw_asset}", expected_use_case_version: "${tw_b_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_bind_b: "$.data.id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${tw_uc_a}", model_binding_id: "${tw_bind_a}", eval_type: "BIAS", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_e1: "$.data.id"}}
          trigger:
            - {call: "POST /test-evaluations", payload: {use_case_id: "${tw_uc_a}", model_binding_id: "${tw_bind_a}", eval_type: "ROBUSTNESS", window_start_at: "2026-08-03T00:00:00Z", window_end_at: "2026-08-04T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_e2: "$.data.id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${tw_uc_a}", model_binding_id: "${tw_bind_a}", eval_type: "HALLUCINATION", window_start_at: "2026-08-02T12:00:00Z", window_end_at: "2026-08-02T18:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_err_inside: "$.data.error_id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${tw_uc_a}", model_binding_id: "${tw_bind_a}", eval_type: "HALLUCINATION", window_start_at: "2026-08-01T12:00:00Z", window_end_at: "2026-08-02T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_e3: "$.data.id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${tw_uc_b}", model_binding_id: "${tw_bind_b}", eval_type: "BIAS", window_start_at: "2026-08-03T06:00:00Z", window_end_at: "2026-08-03T12:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_err_cross: "$.data.error_id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${tw_uc_b}", model_binding_id: "${tw_bind_b}", eval_type: "BIAS", window_start_at: "2026-08-04T00:00:00Z", window_end_at: "2026-08-05T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {tw_e4: "$.data.id"}}
          assert:
            - "the window starting exactly when the existing one ends, [08-03T00:00:00Z, 08-04T00:00:00Z), is ACCEPTED with HTTP 201 - half-open intervals permit adjacency, and an implementation using closed comparisons wrongly rejects it"
            - "the window strictly inside the existing one, [08-02T12:00:00Z, 08-02T18:00:00Z), is REJECTED with HTTP 409 and error_id == ERR_EVALUATION_WINDOW_CONFLICT - containment counts as overlap in both directions"
            - "the window ending exactly when the existing one starts, [08-01T12:00:00Z, 08-02T00:00:00Z), is ACCEPTED with HTTP 201 - adjacency is symmetric"
            - "the window [08-03T06:00:00Z, 08-03T12:00:00Z) requested on use case B is REJECTED with HTTP 409 ERR_EVALUATION_WINDOW_CONFLICT even though use case B has no evaluations of its own: the contended resource is the shared ModelAsset, reached through model_binding_id, not the use case"
            - "the window [08-04T00:00:00Z, 08-05T00:00:00Z) on use case B is ACCEPTED, confirming B is not blocked wholesale"
            - "eval_type is irrelevant to the conflict: a HALLUCINATION window collided with a BIAS window and a BIAS window collided with a ROBUSTNESS window"
            - "GET /test-evaluations?model_binding_id={tw_bind_a} returns exactly 3 rows and GET /test-evaluations?model_binding_id={tw_bind_b} returns exactly 1"
            - "all rejected creates are no-ops - no PLANNED row is left behind to poison later window checks"

      - name: disclosure_notice_windows_closed_with_quiet_buffer_per_jurisdiction
        grounds: "validations priority 35 (ERR_DISCLOSURE_WINDOW_CONFLICT) and calculations.window_conflict_detection define the notice window as a CLOSED interval [effective_from, effective_to] on the resource key (use_case_id, notice_type, jurisdiction), and additionally forbid a new window starting within DISCLOSURE_QUIET_BUFFER_DAYS = 7 days of an existing window's end. Only PUBLISHED notices occupy the slot."
        distinguishing_aspect: "the opposite interval semantics from the first instance - CLOSED, so touching windows collide, plus a 7-day quiet buffer that pushes the earliest legal start well past the existing end. The resource is also a different KIND: a statutory notice slot keyed by a (notice_type, jurisdiction) pair rather than a physical model asset, so two windows that are identical in time do not compete when either key component differs."
        test_recipe:
          setup: "Create one use case (it need not be classified - notices are publishable from DRAFT) and publish one AUTOMATED_DECISION_NOTICE for the EU over the closed window [2026-09-01T00:00:00Z, 2026-09-30T00:00:00Z]. With a 7-day quiet buffer, the earliest legal start for the next EU automated-decision notice is 2026-10-08T00:00:00Z."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Applicant screening notices", business_unit: "Talent", description: "screens applications with an automated first pass", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: ["EU", "UK"], deployed_headcount_reach: 8000}, as: Requester, as_user_id: "usr_req_1", captures: {dn_uc: "$.data.id"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "EU", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn_n1: "$.data.id"}}
          trigger:
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "EU", effective_from: "2026-09-30T00:00:00Z", effective_to: "2026-10-05T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn_err_touch: "$.data.error_id"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "EU", effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-10-31T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn_err_buffer: "$.data.error_id"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "EU", effective_from: "2026-10-07T00:00:00Z", effective_to: "2026-10-31T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn_err_edge: "$.data.error_id"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "EU", effective_from: "2026-10-08T00:00:00Z", effective_to: "2026-10-31T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn_n4: "$.data.id"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "UK", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z", locale_count: 1}, as: Requester, as_user_id: "usr_req_1", captures: {dn_n5: "$.data.id"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "USER_FACING_AI_DISCLOSURE", jurisdiction: "EU", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn_n6: "$.data.id"}}
            - {call: "POST /disclosure-notices/{id}/withdraw", payload: {}, as: Requester, as_user_id: "usr_req_1", captures: {dn_n1_status: "$.data.status"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "EU", effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-10-31T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn_n7: "$.data.id"}}
          assert:
            - "the window starting exactly at the existing window's end, 2026-09-30T00:00:00Z, is REJECTED with HTTP 409 ERR_DISCLOSURE_WINDOW_CONFLICT - closed intervals make touching an overlap, the exact opposite of the evaluation-window rule"
            - "the window starting 2026-10-01T00:00:00Z, one day clear of the existing end, is REJECTED with the same error - the 7-day quiet buffer, not the raw interval, is what bites"
            - "the window starting exactly 2026-10-07T00:00:00Z, seven days after the existing end, is still REJECTED: the buffer comparison is new.effective_from <= existing.effective_to + 7 days and it is inclusive"
            - "the window starting 2026-10-08T00:00:00Z is ACCEPTED with HTTP 201 - it is the earliest legal start, so the buffer is exactly 7 days and not 6 or 8"
            - "the UK notice over the IDENTICAL window as the EU one is ACCEPTED - the resource key includes jurisdiction"
            - "the EU USER_FACING_AI_DISCLOSURE over the IDENTICAL window as the EU automated-decision notice is ACCEPTED - the resource key also includes notice_type"
            - "withdrawing the original notice frees its slot: republishing the previously rejected [2026-10-01T00:00:00Z, 2026-10-31T00:00:00Z] EU window then succeeds with HTTP 201, because only PUBLISHED rows are candidates"
            - "after the sequence GET /use-cases/{dn_uc}/disclosure-notices?status=PUBLISHED returns exactly 4 rows and the withdrawn row carries withdrawn_at == 2026-08-01T00:00:00Z"

  - rule_id: compensating_invariant
    instances:

      - name: approve_and_revoke_conserve_portfolio_headcount_reach
        grounds: "calculations.inventory_conserved_quantities states INVARIANT R: ledger_reach_balance == portfolio_approved_reach at all times, with the forward APPROVAL_GRANTED entry (+deployed_headcount_reach) compensated exactly by APPROVAL_REVOKED (-deployed_headcount_reach), and with suspension and reinstatement contributing reach_delta 0 because SUSPENDED is inside INVENTORY_STATUSES."
        distinguishing_aspect: "the conserved quantity is an INTEGER headcount reach spanning the whole portfolio, and the compensating pair is separated by an unrelated suspend/reinstate excursion that must provably not perturb it. The forward and reverse operations are different endpoints on the same aggregate (approve / revoke)."
        test_recipe:
          setup: "Approve the short-chain LIMITED use case (first-party asset, no jurisdictions, one PASSED BIAS run, PRIVACY and BUSINESS gates cleared) with deployed_headcount_reach 5000, and read the inventory summary immediately after approval."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "In-House Platform", model_name: "ih-roster", model_version: "0.9.0", hosting: "INTERNAL", modality: "TABULAR", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Shift roster optimiser", business_unit: "Operations", description: "proposes weekly shift rosters with supervisor sign-off", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {ci_uc: "$.data.id", ci_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ci_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${ci_asset}", expected_use_case_version: "${ci_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_bind: "$.data.id"}}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_v3: "$.data.version"}}
            - {call: "POST /use-cases/{id}/oversight-designs", payload: {review_mode: "SAMPLED", sample_pct: 100, escalation_sla_hours: 0, reviewer_role: "BusinessReviewer", override_capability: true, expected_use_case_version: "${ci_v3}"}, as: Requester, as_user_id: "usr_req_1", captures: {ci_od: "$.data.id"}}
            - {call: "POST /oversight-designs/{id}/decide", payload: {decision: "APPROVE"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${ci_uc}", model_binding_id: "${ci_bind}", eval_type: "BIAS", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_e1: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {worst_group_parity_ratio: 0.7500, sample_size: 400}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_g_priv: "$.data[0].id", ci_g_biz: "$.data[1].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "no personal data in scope"}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "value case accepted"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_v_ready: "$.data.version"}}
            - {call: "POST /use-cases/{id}/approve", payload: {expected_use_case_version: "${ci_v_ready}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_tier: "$.data.final_risk_tier"}}
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_reach_after_approve: "$.data.portfolio_approved_reach", ci_bal_after_approve: "$.data.ledger_reach_balance"}}
          trigger:
            - {call: "POST /monitoring-incidents", payload: {use_case_id: "${ci_uc}", severity: "SEV1", category: "HARMFUL_OUTPUT", detected_at: "2026-08-01T00:00:00Z", summary: "premium shifts withheld from part-time staff", reported_to_regulator: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_inc: "$.data.id"}}
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_reach_suspended: "$.data.portfolio_approved_reach", ci_bal_suspended: "$.data.ledger_reach_balance"}}
            - {call: "POST /monitoring-incidents/{id}/contain", payload: {reported_to_regulator: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /monitoring-incidents/{id}/resolve", payload: {reported_to_regulator: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_reach_reinstated: "$.data.portfolio_approved_reach", ci_bal_reinstated: "$.data.ledger_reach_balance"}}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_v_now: "$.data.version"}}
            - {call: "POST /use-cases/{id}/revoke", payload: {revocation_reason: "PROGRAMME_CANCELLED"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ci_reach_final: "$.data.portfolio_approved_reach", ci_bal_final: "$.data.ledger_reach_balance"}}
          assert:
            - "immediately after approval: portfolio_approved_reach == 5000, ledger_reach_balance == 5000, inventory_count == 1"
            - "after the SEV1 report suspends the use case: portfolio_approved_reach is STILL 5000 and ledger_reach_balance is STILL 5000, because SUSPENDED is inside INVENTORY_STATUSES and APPROVAL_SUSPENDED carries reach_delta 0"
            - "after contain and resolve reinstate the approval: portfolio_approved_reach is STILL 5000 and ledger_reach_balance is STILL 5000 - APPROVAL_REINSTATED also carries reach_delta 0, so the excursion is exactly neutral"
            - "the reinstatement really happened: UseCase.status == APPROVED, monitoring_posture == HEALTHY, and the ModelBinding is back to PINNED with superseded_reason null"
            - "after the revoke: portfolio_approved_reach == 0 and ledger_reach_balance == 0 - the compensating pair sums to exactly zero with no residue"
            - "the ledger holds exactly one APPROVAL_GRANTED (reach_delta +5000), one APPROVAL_SUSPENDED (0), one APPROVAL_REINSTATED (0), one APPROVAL_REVOKED (reach_delta -5000) and one BINDING_RETIRED (0)"
            - "INVARIANT R holds at all four observation points: ledger_reach_balance == portfolio_approved_reach every time"
            - "the asset is NOT restricted by the revoke because is_third_party == false, which proves the reach invariant does not depend on the asset-side hop"
            - "portfolio_approved_reach_high_tier is 0 at every observation point, since final_risk_tier is LIMITED - the high-tier total is a strict subset and must not drift either"

      - name: gate_clear_and_reopen_conserve_control_debt_to_the_cent
        grounds: "calculations.inventory_conserved_quantities states INVARIANT D: for any gate the pair (clear, reopen) is debt-neutral - control_debt_index_total returns to its exact pre-clear cent value and the summed ledger debt_delta for the use case returns to 0.00, because clear records debt_delta = -debt_before_clear and reopen records debt_delta = +debt_before_clear from the same stored field. Gate VOIDing is explicitly NOT compensating."
        distinguishing_aspect: "a DIFFERENT conserved quantity - a 2-decimal debt index rather than an integer headcount - conserved across a different operation pair (clear / reopen) on a different entity (ReviewGate), and the instance additionally pins the NEGATIVE case: an operation that changes the quantity while appending no compensating ledger entry, which distinguishes a genuine invariant from a coincidence."
        test_recipe:
          setup: "Set up the HIGH-tier use case with a third-party grade-B asset and a PINNED binding so that the LEGAL gate is actually clearable, classify it, then open the LEGAL gate and issue two conditions: control_debt_index == 1.35 (1.35 * 2/3 * 1.5). The other three gates stay PENDING with 0.00 debt, so control_debt_index_total is 1.35."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Northwind AI", model_name: "nw-adjudicate", model_version: "3.2.0", hosting: "VENDOR_API", modality: "TEXT", is_third_party: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cd_asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/vendor-assessments", payload: {vendor_name: "Northwind AI", training_data_provenance: "DOCUMENTED_MIXED", output_rights: "LICENSE_WITH_RESTRICTIONS", retention_days: 60, retention_opt_out: true, subprocessors_disclosed: true}, as: LegalReviewer, as_user_id: "usr_legal_1", captures: {cd_va: "$.data.id"}}
            - {call: "POST /vendor-assessments/{id}/decide", payload: {decision: "ACCEPT", terms_variant: "CONSERVATIVE_LEGAL"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Benefits eligibility adjudication assistant", business_unit: "Claims", description: "drafts eligibility determinations for adjudicator sign-off", affects_individuals: true, decision_autonomy: "HUMAN_ON_LOOP", data_sensitivity: "INTERNAL", individual_impact: "CONSEQUENTIAL", jurisdictions: ["EU", "UK"], deployed_headcount_reach: 12000}, as: Requester, as_user_id: "usr_req_1", captures: {cd_uc: "$.data.id", cd_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${cd_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cd_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${cd_asset}", expected_use_case_version: "${cd_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cd_bind: "$.data.id"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {gate_type: "LEGAL"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cd_g_legal: "$.data[0].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: LegalReviewer, as_user_id: "usr_legal_1"}
            - {call: "POST /review-gates/{id}/issue-conditions", payload: {conditions: ["obtain written output-rights assignment", "add the Article 50 notice text"]}, as: LegalReviewer, as_user_id: "usr_legal_1", captures: {cd_debt_before: "$.data.control_debt_index"}}
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cd_total_before: "$.data.control_debt_index_total", cd_bal_before: "$.data.ledger_debt_balance"}}
          trigger:
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "assignment letter received, notice text added"}, as: LegalReviewer, as_user_id: "usr_legal_1", captures: {cd_debt_cleared: "$.data.control_debt_index", cd_debt_before_clear: "$.data.debt_before_clear"}}
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cd_total_cleared: "$.data.control_debt_index_total", cd_bal_cleared: "$.data.ledger_debt_balance"}}
            - {call: "POST /review-gates/{id}/reopen", payload: {decision_note: "the assignment letter was unsigned"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cd_debt_reopened: "$.data.control_debt_index"}}
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cd_total_reopened: "$.data.control_debt_index_total", cd_bal_reopened: "$.data.ledger_debt_balance"}}
            - {call: "PATCH /use-cases/{id}", payload: {deployed_headcount_reach: 9000}, as: Requester, as_user_id: "usr_req_1", captures: {cd_uc_status: "$.data.status"}}
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {cd_total_voided: "$.data.control_debt_index_total", cd_bal_voided: "$.data.ledger_debt_balance"}}
          assert:
            - "before the trigger: LEGAL gate control_debt_index == 1.35, control_debt_index_total == 1.35, ledger_debt_balance == 0.00"
            - "after the clear: gate control_debt_index == 0.00, debt_before_clear == 1.35, control_debt_index_total == 0.00, ledger_debt_balance == -1.35, and one GATE_CLEARED entry exists with debt_delta == -1.35"
            - "after the reopen: gate control_debt_index == 1.35 restored EXACTLY from debt_before_clear, control_debt_index_total == 1.35 (identical to the pre-clear cent, no 1.34 or 1.36), and ledger_debt_balance == 0.00"
            - "the GATE_REOPENED entry carries debt_delta == +1.35, the exact negation of the GATE_CLEARED entry, so INVARIANT D closes at 0.00"
            - "the clear/reopen pair changed cleared_gate_count from 0 to 1 and back to 0 - the compensation covers the counter too"
            - "the reopen restored open_condition_count to the value implied by debt_before_clear even though the conditions array was not re-supplied"
            - "the negative case: the PATCH voids every gate, so control_debt_index_total drops to 0.00 while ledger_debt_balance STAYS at 0.00 - voiding is deliberately uncompensated and appends no ledger entry, which is why INVARIANT D is stated over the clear/reopen pair only"
            - "after the PATCH the use case is DRAFT with classification_stale == true, and GET /use-cases/{cd_uc}/review-gates shows all four gates VOIDED with control_debt_index 0.00"
