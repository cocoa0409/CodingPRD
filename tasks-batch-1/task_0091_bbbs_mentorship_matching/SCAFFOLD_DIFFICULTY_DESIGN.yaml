            - "Volunteer.${v_id}.active_match_count after finalize == 0"
            - "Volunteer.${v_id}.status after finalize == ELIGIBLE"

      - name: child_offered_proposal_count_conserved_across_propose_decline
        grounds:
          - state_machines.Child.WAITLISTED_to_PROPOSED
          - state_machines.MatchProposal.OFFERED_to_DECLINED
          - state_machines.Child.PROPOSED_to_WAITLISTED
