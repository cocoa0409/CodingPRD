            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "PA Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { pa12_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "PB Corp", party_type: "PETITIONER" }
