      - name: preclearance_approval_requires_open_window
        grounds:
          - state_machines.PreclearanceRequest.SUBMITTED_to_APPROVED
          - state_machines.TradingWindow.SCHEDULED_to_OPEN
          - validations[priority=52]
          - errors[ERR_TRADING_WINDOW_CLOSED]
          - calculations.preclearance_validity
          - entities.TradingWindow.fields.close_at
        distinguishing_aspect: |
          A different entity pair from the tranche/cycle gate: PreclearanceRequest ->
          TradingWindow, and the blocking condition is the window's half-open tradeable
          interval rather than a status enum - with the window still flagged OPEN, a clock
          of 2026-01-20T00:00:01Z (one second past close_at) refuses the APPROVE with
          ERR_TRADING_WINDOW_CLOSED, while the same call at 2026-01-10T10:00:00Z approves
          and stamps valid_until 2026-01-15T10:00:00.000Z.
        test_recipe:
          setup:
            - "EquityPlan 'Plan N Interval' ACTIVE."
            - "TradingWindow FY2026-Q1 in status OPEN over [2026-01-05T00:00:00Z, 2026-01-20T00:00:00Z) with no aggregate_share_cap."
            - "Participant 'Nia Clock' ACTIVE with insider_status DESIGNATED_INSIDER and no TradingPlan."
            - "One PreclearanceRequest for 400 shares, SELL, intended_trade_date 2026-01-15, SUBMITTED by the participant at clock 2026-01-06T10:00:00Z."
            - "Logical clock then moved to 2026-01-20T00:00:01Z - one second past the window's close_at - while the window row still reads OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-06T10:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan N Interval", total_authorized_shares: 1000000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Nia Clock", employee_number: "E-2882-14", home_country_code: "US", home_state_code: "VA", hire_date: "2014-07-07", birth_date: "1981-08-28", insider_status: "DESIGNATED_INSIDER" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-01-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w1_id: $.data.id }
            - call: "POST /trading-windows/${w1_id}/status"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /preclearance-requests"
              payload: { participant_id: "${p_id}", window_id: "${w1_id}", transaction_type: "SELL", requested_shares: 400, intended_trade_date: "2026-01-15" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-20T00:00:01Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /preclearance-requests/${pc_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Attempt past close_at." }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { past_close_error: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-10T10:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /preclearance-requests/${pc_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Cleared inside the window." }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - "${past_close_error} == ERR_TRADING_WINDOW_CLOSED with HTTP 409"
            - "immediately after the refusal PreclearanceRequest.${pc_id}.status == SUBMITTED, PreclearanceRequest.${pc_id}.valid_until is null and TradingWindow.${w1_id}.approved_shares_cumulative == 0"
            - "TradingWindow.${w1_id}.status == OPEN throughout (the refusal is driven by the clock against close_at, not by the status flag)"
            - "PreclearanceRequest.${pc_id}.status == APPROVED"
            - "PreclearanceRequest.${pc_id}.decided_at == 2026-01-10T10:00:00.000Z"
            - "PreclearanceRequest.${pc_id}.valid_until == 2026-01-15T10:00:00.000Z"
            - "TradingWindow.${w1_id}.approved_shares_cumulative == 400"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: mobility_assignment_inclusive_date_overlap
        grounds:
          - validations[priority=58]
          - errors[ERR_ASSIGNMENT_PERIOD_OVERLAP]
          - entities.MobilityAssignment.fields.start_date
          - entities.MobilityAssignment.fields.end_date
          - endpoints[POST /mobility-assignments]
        distinguishing_aspect: |
          The contended resource is a single Participant's workday calendar and the interval
          semantics are fully closed [start_date, end_date]: a new assignment starting
          exactly on an existing assignment's end_date (2026-03-05) collides with
          ERR_ASSIGNMENT_PERIOD_OVERLAP, and only a start_date of 2026-03-06 is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T09:00:00Z."
            - "Participant 'Mia Move' ACTIVE with exactly one MobilityAssignment: US-CA 2026-01-06..2026-03-05 at 4500 bps with 40 workdays."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /participants"
              payload: { full_name: "Mia Move", employee_number: "E-2882-15", home_country_code: "US", home_state_code: "CA", hire_date: "2019-03-11", birth_date: "1989-04-02" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "US-CA", tax_rate_bps: 4500, start_date: "2026-01-06", end_date: "2026-03-05", workdays: 40 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { a_ca_id: $.data.id }
          trigger:
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "US-NY", tax_rate_bps: 4484, start_date: "2026-03-05", end_date: "2026-04-30", workdays: 38 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { touching_error: $.data.error_id }
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "US-TX", tax_rate_bps: 0, start_date: "2026-02-01", end_date: "2026-02-10", workdays: 7 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { contained_error: $.data.error_id }
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "US-NY", tax_rate_bps: 4484, start_date: "2026-03-06", end_date: "2026-04-30", workdays: 38 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { a_ny_id: $.data.id }
          assert:
            - "${touching_error} == ERR_ASSIGNMENT_PERIOD_OVERLAP with HTTP 409"
            - "${contained_error} == ERR_ASSIGNMENT_PERIOD_OVERLAP with HTTP 409"
            - "the accepted US-NY assignment returns 201 with MobilityAssignment.${a_ny_id}.start_date == 2026-03-06"
            - "GET /participants/${p_id}/mobility-assignments returns total_count == 2"
            - "MobilityAssignment.${a_ca_id}.end_date == 2026-03-05 (unchanged by the two refusals)"
            - "no MobilityAssignment row exists with jurisdiction_code US-TX"

      - name: trading_window_half_open_plus_buffer
        grounds:
          - validations[priority=59]
          - validations[priority=60]
          - errors[ERR_TRADING_WINDOW_OVERLAP]
          - errors[ERR_TRADING_WINDOW_BUFFER_VIOLATION]
          - entities.TradingWindow.fields.open_at
          - entities.TradingWindow.fields.close_at
        distinguishing_aspect: |
          A different resource entity (EquityPlan's window calendar rather than a
          Participant's) with the opposite endpoint geometry: window intervals are half-open
          [open_at, close_at), so a new window opening exactly at the incumbent's close_at
          does NOT overlap and is instead refused by the separate 48-hour buffer rule
          (ERR_TRADING_WINDOW_BUFFER_VIOLATION), an interior open_at is refused by
          ERR_TRADING_WINDOW_OVERLAP, and open_at exactly 48 hours after close_at is
          accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-02T09:00:00Z; EquityPlan 'Plan O Calendar' ACTIVE."
            - "Exactly one TradingWindow FY2026-Q1 in status SCHEDULED over [2026-01-05T00:00:00Z, 2026-03-31T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-02T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan O Calendar", total_authorized_shares: 1000000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q2A", open_at: "2026-03-31T00:00:00Z", close_at: "2026-04-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { buffer_error: $.data.error_id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q2B", open_at: "2026-03-30T00:00:00Z", close_at: "2026-04-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { overlap_error: $.data.error_id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q2", open_at: "2026-04-02T00:00:00Z", close_at: "2026-04-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w2_id: $.data.id }
          assert:
            - "${buffer_error} == ERR_TRADING_WINDOW_BUFFER_VIOLATION with HTTP 409 (the shared instant is not an overlap under half-open semantics)"
            - "${buffer_error} != ERR_TRADING_WINDOW_OVERLAP"
            - "${overlap_error} == ERR_TRADING_WINDOW_OVERLAP with HTTP 409 (priority 59 wins over the buffer rule at priority 60)"
            - "TradingWindow.${w2_id}.open_at == 2026-04-02T00:00:00.000Z and TradingWindow.${w2_id}.status == SCHEDULED"
            - "GET /equity-plans/${plan_id}/trading-windows returns total_count == 2"
            - "no TradingWindow row exists with quarter_label FY2026-Q2A or FY2026-Q2B"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: grant_cancel_restores_plan_reserve_identity
        grounds:
          - state_machines.Grant.PENDING_APPROVAL_to_CANCELLED
          - calculations.share_reserve_ledger
          - calculations.fungible_weighted_shares
          - calculations.burn_rate_variants
          - entities.ApprovalAuthority.fields.consumed_shares
          - entities.EquityPlan.fields.shares_returned_cumulative
        distinguishing_aspect: |
          The conserved quantities are the plan-level share pool and the delegation's
          aggregate capacity: cancelling a DELEGATED-approved grant returns exactly the
          15000 weighted shares it consumed, restoring available_reserve_shares to 500000
          and the identity available + committed - returned == total_authorized, and pulling
          the authority back from EXHAUSTED to ACTIVE with remaining_shares 15000 - while
          gross_burn_rate_bps deliberately stays at 1 because gross burn is never unwound.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-16T10:00:00Z; EquityPlan 'Plan P Conserve' ACTIVE with 500000 authorized shares, 200000000 common shares outstanding, burn_rate_limit_bps 500, fungible_ratio_full_value_bps 15000, low_reserve_threshold_bps 0."
            - "ApprovalAuthority DELEGATED_OFFICER for delegate_user_id officer-1, ACTIVE, effective 2026-01-01..2026-12-31, per_grant_share_cap 15000 and aggregate_share_cap 15000 (both exactly equal to the grant's weighted shares, so the caps bind at equality)."
            - "Participant 'Pat Pool' ACTIVE, NON_INSIDER."
            - "One RSU Grant of 10000 target shares with a single TIME tranche of 10000 shares, APPROVED on the DELEGATED path by officer-1; weighted_reserve_shares 15000, plan available_reserve_shares 485000, authority EXHAUSTED with remaining_shares 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-16T10:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan P Conserve", total_authorized_shares: 500000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /approval-authorities"
              payload: { plan_id: "${plan_id}", authority_type: "DELEGATED_OFFICER", delegate_user_id: "officer-1", per_grant_share_cap: 15000, aggregate_share_cap: 15000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: BoardMember
              as_user_id: "board-1"
              captures: { auth_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Pat Pool", employee_number: "E-2882-16", home_country_code: "US", home_state_code: "MN", hire_date: "2020-06-01", birth_date: "1993-02-12" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "RSU", target_shares: 10000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2027-02-16", target_shares: 10000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/approve"
              payload: { approval_path: "DELEGATED", authority_id: "${auth_id}" }
              as: DelegatedOfficer
              as_user_id: "officer-1"
            - call: "GET /equity-plans/${plan_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { available_after_approve: $.data.available_reserve_shares }
            - call: "GET /approval-authorities/${auth_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { auth_status_after_approve: $.data.status, auth_remaining_after_approve: $.data.remaining_shares }
          trigger:
            - call: "POST /grants/${g_id}/cancel"
              payload: { cancel_reason: "DUPLICATE_AWARD" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "${available_after_approve} == 485000"
            - "${auth_status_after_approve} == EXHAUSTED"
            - "${auth_remaining_after_approve} == 0"
            - "Grant.${g_id}.status == CANCELLED"
            - "Grant.${g_id}.weighted_reserve_shares == 0"
            - "Grant.${g_id}.outstanding_shares == 0"
            - "VestingTranche.${t1_id}.status == FORFEITED"
            - "EquityPlan.${plan_id}.shares_committed_cumulative == 15000"
            - "EquityPlan.${plan_id}.shares_returned_cumulative == 15000"
            - "EquityPlan.${plan_id}.available_reserve_shares == 500000"
            - "EquityPlan.${plan_id}.available_reserve_shares + EquityPlan.${plan_id}.shares_committed_cumulative - EquityPlan.${plan_id}.shares_returned_cumulative == 500000"
            - "EquityPlan.${plan_id}.fiscal_year_gross_granted_shares == 15000 and EquityPlan.${plan_id}.fiscal_year_returned_shares == 15000"
            - "EquityPlan.${plan_id}.gross_burn_rate_bps == 1 and EquityPlan.${plan_id}.net_burn_rate_bps == 0"
            - "ApprovalAuthority.${auth_id}.consumed_shares == 0"
            - "ApprovalAuthority.${auth_id}.remaining_shares == 15000"
            - "ApprovalAuthority.${auth_id}.status == ACTIVE"

      - name: settlement_reverse_restores_share_split_and_tax_zero
        grounds:
          - state_machines.VestingEvent.SETTLED_to_REVERSED
          - state_machines.VestingTranche.SETTLED_to_VESTED
          - calculations.withholding_mechanics
          - calculations.mobility_tax_allocation
          - entities.VestingEvent.fields.net_shares_delivered
          - entities.VestingEvent.fields.total_tax_cents
          - entities.Grant.fields.outstanding_shares
        distinguishing_aspect: |
          A different conserved quantity from the plan-level share pool: the per-event share
          split and tax ledger. Reversing a SETTLED event returns the 400 withheld shares to
          net_shares_delivered (restoring the identity gross_shares == 1000 ==
          net_shares_delivered with shares_withheld and shares_sold both 0), zeroes
          total_tax_cents and blended_rate_bps, deletes both TaxAllocation rows, and puts
          Grant.outstanding_shares back to 1000 while weighted_reserve_shares stays at 1500.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T09:00:00Z; EquityPlan 'Plan Q Reverse' ACTIVE with 1000000 authorized shares, 200000000 common shares outstanding, burn_rate_limit_bps 500, fungible_ratio_full_value_bps 15000, low_reserve_threshold_bps 0."
            - "TradingWindow FY2026-Q1 OPEN over [2026-01-05T00:00:00Z, 2026-03-31T00:00:00Z) so the grant issues with grant_date 2026-01-05."
            - "Participant 'Ray Undo' ACTIVE, NON_INSIDER (no TransactionReport is minted, so the reversal has no report to delete)."
            - "One RSU Grant of 1000 shares, GRANTED, with a single TIME tranche of 1000 shares scheduled 2026-07-01; weighted_reserve_shares 1500."
            - "One MobilityAssignment US-CA 2026-01-06..2026-06-30 at 4000 bps with 250 workdays."
            - "Clock advanced to 2026-07-01T12:00:00Z; the tranche vested at fmv_per_share_cents 5000 with withholding_method SHARE_WITHHOLD, taxes allocated (total_tax_cents 2000000) and the event SETTLED with shares_withheld 400 and net_shares_delivered 600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan Q Reverse", total_authorized_shares: 1000000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Ray Undo", employee_number: "E-2882-17", home_country_code: "US", home_state_code: "CA", hire_date: "2021-02-01", birth_date: "1990-09-09" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w1_id: $.data.id }
            - call: "POST /trading-windows/${w1_id}/status"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "RSU", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2026-07-01", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/approve"
              payload: { approval_path: "BOARD" }
              as: BoardMember
              as_user_id: "board-1"
            - call: "POST /grants/${g_id}/issue"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "US-CA", tax_rate_bps: 4000, start_date: "2026-01-06", end_date: "2026-06-30", workdays: 250 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /vesting-tranches/${t1_id}/vest"
              payload: { fmv_per_share_cents: 5000, withholding_method: "SHARE_WITHHOLD" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /vesting-events/${ev_id}/allocate-taxes"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /vesting-events/${ev_id}/settle"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { withheld_after_settle: $.data.shares_withheld, net_after_settle: $.data.net_shares_delivered }
          trigger:
            - call: "POST /vesting-events/${ev_id}/reverse"
              payload: { reversal_reason: "MISSTATED_FMV" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "${withheld_after_settle} == 400 and ${net_after_settle} == 600"
            - "VestingEvent.${ev_id}.settlement_status == REVERSED"
            - "VestingEvent.${ev_id}.reversal_reason == MISSTATED_FMV"
            - "VestingEvent.${ev_id}.tax_status == PENDING_ALLOCATION"
            - "VestingEvent.${ev_id}.shares_withheld == 0"
            - "VestingEvent.${ev_id}.shares_sold == 0"
            - "VestingEvent.${ev_id}.net_shares_delivered == 1000"
            - "VestingEvent.${ev_id}.residual_cash_cents == 0"
            - "VestingEvent.${ev_id}.cash_due_cents == 0"
            - "VestingEvent.${ev_id}.total_tax_cents == 0"
            - "VestingEvent.${ev_id}.blended_rate_bps == 0"
            - "VestingEvent.${ev_id}.gross_shares == 1000 == net_shares_delivered + shares_withheld + shares_sold"
            - "GET /vesting-events/${ev_id}/tax-allocations returns total_count == 0"
            - "VestingTranche.${t1_id}.status == VESTED and VestingTranche.${t1_id}.shares == 1000"
            - "Grant.${g_id}.outstanding_shares == 1000"
            - "Grant.${g_id}.weighted_reserve_shares == 1500"
            - "EquityPlan.${plan_id}.shares_committed_cumulative == 1500 and EquityPlan.${plan_id}.shares_returned_cumulative == 0"
            - "GET /participants/${p_id}/transaction-reports returns total_count == 0"
