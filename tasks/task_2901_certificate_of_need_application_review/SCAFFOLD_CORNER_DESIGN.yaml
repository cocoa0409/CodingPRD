            - "BatchingCycle.${cycle_id}.projected_patient_days == 30112.5000"
            - "BatchingCycle.${cycle_id}.provisional_required_beds == 110.0000"
            - "BatchingCycle.${cycle_id}.selected_target_occupancy_rate == 0.85"
            - "BatchingCycle.${cycle_id}.required_beds_final == 98 (ceil(30112.5000 / 310.25) = ceil(97.0524...))"
            - "${new_unmet} == 28 and BatchingCycle.${cycle_id}.unallocated_bed_need == 28"
            - "a follow-up GET /batching-cycles/${cycle_id}/need-analysis reports formula_pin_stale false"

