# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_3126
# §1.9 Coverage Index for Non-Difficulty Tests (breadth probe)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: family_create_returns_defaults_and_system_fields
        claim_type: creation_and_system_fields
        grounds: [entities.Family, endpoints.POST_/api/families]
        distinguishing_aspect: "A family created with the five required inputs returns 201 with system-minted id/created_at/updated_at, version 1, and no client-supplied system fields."
        test_recipe:
          setup: ["Logical clock at default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Family.${fam_id}.version == 1 and id, created_at, updated_at are non-null"
            - "Family.${fam_id}.distance_miles == 120"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: room_get_retrieval_round_trips_configuration
        claim_type: retrieval
        grounds: [entities.Room, 'endpoints.GET_/api/rooms/{id}']
        distinguishing_aspect: "Every Room configuration field round-trips through GET exactly as posted, with status AVAILABLE and occupied false."
        test_recipe:
          setup: ["Hospital and house exist."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
          trigger:
            - call: "GET /api/rooms/${room_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
          assert:
            - "Room.${room_id}.room_number == \"101\" and bed_count == 2 and occupancy_limit == 2"
            - "Room.${room_id}.status == AVAILABLE and occupied == false"
            - "Room.${room_id}.house_id == ${house_id}"

      - name: hospital_referrals_list_paginates_with_total_count
        claim_type: listing
        grounds: ['endpoints.GET_/api/hospitals/{id}/referrals', response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "With three referrals on file, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the final row with has_more false."
        test_recipe:
          setup: ["Hospital with three families and three PENDING referrals."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Aaa", primary_contact_name: "A Aaa", home_city: "Riverton", distance_miles: 60, child_patient_name: "Kid Aaa" }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Bbb", primary_contact_name: "B Bbb", home_city: "Riverton", distance_miles: 70, child_patient_name: "Kid Bbb" }
              as: ProgramAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Ccc", primary_contact_name: "C Ccc", home_city: "Riverton", distance_miles: 80, child_patient_name: "Kid Ccc" }
              as: ProgramAdmin
              captures: { fc_id: $.data.id }
            - call: "POST /api/referrals"
              payload: { family_id: "${fa_id}", hospital_id: "${hosp_id}", treating_unit: "Ward A", care_type: "INPATIENT", acuity_level: "LOW", attending_clinician: "Dr. Rao" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
            - call: "POST /api/referrals"
              payload: { family_id: "${fb_id}", hospital_id: "${hosp_id}", treating_unit: "Ward B", care_type: "OUTPATIENT", acuity_level: "LOW", attending_clinician: "Dr. Rao" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
            - call: "POST /api/referrals"
              payload: { family_id: "${fc_id}", hospital_id: "${hosp_id}", treating_unit: "Ward C", care_type: "INPATIENT", acuity_level: "HIGH", attending_clinician: "Dr. Rao" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
          trigger:
            - call: "GET /api/hospitals/${hosp_id}/referrals"
              payload: { limit: 2, offset: 0 }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
          assert:
            - "the response status is 200 and response_type is array with exactly 2 rows, total_count == 3, has_more == true"
            - "repeating with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "omitting limit and offset defaults to limit 10, offset 0 and returns all 3 rows"

      - name: referral_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ['endpoints.GET_/api/referrals/{id}', errors.ERR_NOT_FOUND, 'validations[priority=3]']
        distinguishing_aspect: "A syntactically valid but unallocated referral id yields the error envelope with data.error_id ERR_NOT_FOUND and a populated meta block."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/referrals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == ERR_NOT_FOUND"
            - "response_type == error and meta.api_request_id is present (error envelope shape)"

      - name: house_create_missing_name_rejected
        claim_type: required_fields
        grounds: [entities.House.fields.name, errors.ERR_INVALID_REQUEST, 'validations[priority=0]']
        distinguishing_aspect: "Omitting the required name field on POST /api/houses fails with ERR_INVALID_REQUEST before any other validation."
        test_recipe:
          setup: ["One hospital exists."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
          trigger:
            - call: "POST /api/houses"
              payload: { city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: stay_request_extra_field_rejected
        claim_type: computed_fields
        grounds: [entities.StayRequest.fields.provisional_score, 'validations[priority=0]']
        distinguishing_aspect: "Client-supplied computed fields are not accepted: posting provisional_score in the create body is an unknown-field ERR_INVALID_REQUEST, so the client cannot forge its priority."
        test_recipe:
          setup: ["Hospital, house, family, and a PENDING referral exist."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Ward A", care_type: "INPATIENT", acuity_level: "LOW", attending_clinician: "Dr. Rao" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 5, self_reported_acuity: "LOW", expected_family_version: "${fam_v}", provisional_score: 99.99 }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST (unknown field provisional_score)"

      - name: illness_screening_immutable_event_without_version
        claim_type: immutability
        grounds: [entities.IllnessScreening]
        distinguishing_aspect: "IllnessScreening declares common_fields: false — its response carries id and created_at but no version and no updated_at, and the API exposes no update endpoint for it."
        test_recipe:
          setup: ["An ACTIVE stay exists (checked in at the default clock 2026-09-01)."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 3, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /api/stay-requests/${sr_id}/offer"
              payload: { room_id: "${room_id}" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { sr_v: $.data.version }
            - call: "POST /api/stay-requests/${sr_id}/respond"
              payload: { decision: "ACCEPT", expected_stay_request_version: "${sr_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
            - call: "POST /api/stay-requests/${sr_id}/check-in"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { stay_id: $.data.id }
          trigger:
            - call: "POST /api/stays/${stay_id}/screenings"
              payload: { temperature_tenths_c: 370, symptom_count: 0 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { sc_id: $.data.id }
          assert:
            - "IllnessScreening.${sc_id} response has id and created_at but no version key and no updated_at key"
            - "IllnessScreening.${sc_id}.notes == \"\" (default applied when omitted)"
            - "IllnessScreening.${sc_id}.result == PASS and screened_at is non-null"

      - name: guest_on_unknown_stay_not_found
        claim_type: parent_relationships
        grounds: [entities.GuestRegistration.fields.stay_id, errors.ERR_NOT_FOUND]
        distinguishing_aspect: "Guest registration under a non-existent stay id fails existence validation left-to-right with ERR_NOT_FOUND before any house-rule check runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/stays/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/guests"
              payload: { guest_name: "Uncle Ray", relationship: "uncle", is_overnight: true }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: referral_initial_state_pending
        claim_type: initial_state
        grounds: [state_machines.Referral]
        distinguishing_aspect: "A freshly created referral starts PENDING with verified_at and valid_until null until verification stamps them."
        test_recipe:
          setup: ["Hospital and family exist."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
          assert:
            - "Referral.${ref_id}.status == PENDING"
            - "Referral.${ref_id}.verified_at is null and valid_until is null"
            - "Referral.${ref_id}.created_by_user_id == \"${hosp_id}\""

      - name: verify_revoked_referral_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Referral.VERIFIED_to_REVOKED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "REVOKED is terminal: verifying a revoked referral fails ERR_INVALID_STATE and stamps nothing."
        test_recipe:
          setup: ["A referral VERIFIED then REVOKED."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/referrals/${ref_id}/revoke"
              payload: {}
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
          trigger:
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-2"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Referral.${ref_id}.status remains REVOKED"

      - name: cancel_fulfilled_request_rejected
        claim_type: invalid_transition
        grounds: [state_machines.StayRequest]
        distinguishing_aspect: "FULFILLED is terminal for assignment_status: cancelling a request after check-in fails ERR_INVALID_STATE and leaves the stay untouched."
        test_recipe:
          setup: ["A request checked in (FULFILLED) with an ACTIVE stay."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 3, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /api/stay-requests/${sr_id}/offer"
              payload: { room_id: "${room_id}" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { sr_v: $.data.version }
            - call: "POST /api/stay-requests/${sr_id}/respond"
              payload: { decision: "ACCEPT", expected_stay_request_version: "${sr_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
            - call: "POST /api/stay-requests/${sr_id}/check-in"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { stay_id: $.data.id }
          trigger:
            - call: "POST /api/stay-requests/${sr_id}/cancel"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "StayRequest.${sr_id}.assignment_status remains FULFILLED and Stay.${stay_id}.status remains ACTIVE"

      - name: room_maintenance_cycle_roundtrip
        claim_type: valid_transition
        grounds: [state_machines.Room.AVAILABLE_to_MAINTENANCE, state_machines.Room.MAINTENANCE_to_AVAILABLE]
        distinguishing_aspect: "Room cycles AVAILABLE -> MAINTENANCE -> AVAILABLE with house availability counts falling then recovering."
        test_recipe:
          setup: ["House with one AVAILABLE room."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /api/rooms/${room_id}/set-status"
              payload: { target_status: "MAINTENANCE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/rooms/${room_id}/set-status"
              payload: { target_status: "AVAILABLE" }
              as: HouseManager
              as_user_id: "hm-1"
          assert:
            - "after MAINTENANCE: Room.${room_id}.status == MAINTENANCE and House.${house_id}.available_room_count == 0 and posture == FULL (no AVAILABLE rooms)"
            - "after AVAILABLE: Room.${room_id}.status == AVAILABLE and House.${house_id}.available_room_count == 1 and posture == OPEN"

      - name: meal_shift_claimed_to_open_cycle
        claim_type: valid_transition
        grounds: [state_machines.MealShift.CLAIMED_to_OPEN]
        distinguishing_aspect: "Cancelling a CLAIMED shift loops it back to OPEN with the claim cleared, letting a different group claim the same shift afterwards."
        test_recipe:
          setup: ["House with a LUNCH shift on 2026-09-08; two volunteer groups G1 and G2 both certified through 2026-09-10; G1 has claimed the shift."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/meal-shifts"
              payload: { shift_date: "2026-09-08", meal_type: "LUNCH", servings_planned: 20 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { shift_id: $.data.id }
            - call: "POST /api/volunteer-groups"
              payload: { group_name: "Rotary Chefs", contact_email: "chefs@rotary.org" }
              as: VolunteerCoordinator
              as_user_id: "vc-1"
              captures: { g1_id: $.data.id }
            - call: "POST /api/volunteer-groups"
              payload: { group_name: "Lions Cooks", contact_email: "cooks@lions.org" }
              as: VolunteerCoordinator
              as_user_id: "vc-1"
              captures: { g2_id: $.data.id }
            - call: "POST /api/volunteer-groups/${g1_id}/certify"
              payload: { certified_until: "2026-09-10" }
              as: ProgramAdmin
            - call: "POST /api/volunteer-groups/${g2_id}/certify"
              payload: { certified_until: "2026-09-10" }
              as: ProgramAdmin
            - call: "POST /api/meal-shifts/${shift_id}/claim"
              payload: { volunteer_group_id: "${g1_id}" }
              as: VolunteerCoordinator
              as_user_id: "vc-1"
          trigger:
            - call: "POST /api/meal-shifts/${shift_id}/cancel"
              payload: {}
              as: VolunteerCoordinator
              as_user_id: "vc-1"
            - call: "POST /api/meal-shifts/${shift_id}/claim"
              payload: { volunteer_group_id: "${g2_id}" }
              as: VolunteerCoordinator
              as_user_id: "vc-1"
          assert:
            - "after cancel: MealShift.${shift_id}.status == OPEN and claimed_by_group_id is null"
            - "after re-claim: MealShift.${shift_id}.status == CLAIMED and claimed_by_group_id == ${g2_id}"

      - name: checkout_departs_registered_guests
        claim_type: cascade_down
        grounds: [state_machines.GuestRegistration, state_machines.Stay.CHECKED_OUT]
        distinguishing_aspect: "Stay check-out cascades down: every REGISTERED guest on the stay flips to DEPARTED."
        test_recipe:
