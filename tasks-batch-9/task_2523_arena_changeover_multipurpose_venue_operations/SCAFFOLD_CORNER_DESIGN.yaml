        distinguishing_aspect: "With two CONFIRMED bookings totalling 8000 kg and one DRAFT booking of 9000 kg overlapping the clock, the venue's stored rigging_committed_load_kg reads exactly 3000.00 — only the CONFIRMED booking whose closed interval contains 2026-09-10T01:00:00Z is counted."
