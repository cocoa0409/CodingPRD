              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Idem Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
