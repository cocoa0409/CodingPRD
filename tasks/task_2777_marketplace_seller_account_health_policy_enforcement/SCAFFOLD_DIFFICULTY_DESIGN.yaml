              as: Anonymous
              captures: { s1_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s1_id}", policy_rule_id: "${rule_rp}", reporter_type: "REGULATOR", evidence_reference: "EV-JU-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", decision_note: "Unapproved therapeutic claims on a restricted supplement." }
