          - state_machines.EditorialPanelMeeting.PUBLIC_COMMENT_OPEN_to_SCHEDULED
          - entities.EditorialPanelMeeting.fields.public_comment_open_at
        distinguishing_aspect: |
          An empty-collection edge rather than a numeric threshold: the reversals
          endpoint succeeds only while zero PublicComment rows are recorded at
          the meeting, so 0 comments reverses the window while 1 comment blocks
          the same call through the distinct ERR_INVALID_STATE error.
