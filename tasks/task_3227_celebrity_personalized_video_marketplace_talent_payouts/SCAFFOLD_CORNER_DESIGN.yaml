        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /marketplace/talents"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (http 401)"
