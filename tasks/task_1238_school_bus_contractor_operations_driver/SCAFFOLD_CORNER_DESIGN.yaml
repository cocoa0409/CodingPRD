            - { call: "POST /busops/districts", payload: { name: "D-SM12", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-S12", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Sm12", license_number: "L242", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BS12", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sd1: $.data.id } }
            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { a1: "$.data[0].id" } }
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
          trigger:
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (second confirm is not a no-op)"
            - "Assignment.${a1}.status == CONFIRMED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: charter_quote_provisional_value
        claim_type: correct_result
        grounds:
          - calculations.charter_quote_price
        distinguishing_aspect: "Provisional quote uses estimates only: floor(50 x 12000 / 10) + 100 x 250 = 60000 + 25000 = 85000 cents; quote_valid_until is clock + 72h."
        test_recipe:
          setup: ["ACTIVE contract (hourly 12000, per-mile 250); charter REQUESTED at default clock"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-CALC1", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-CA1", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/charter-trips", payload: { contract_id: "${c_id}", purpose: "Quote check", trip_date: "2026-06-10", pickup_minute: 600, return_minute: 900, estimated_hours_x10: 50, estimated_miles: 100, passenger_count: 20 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { ch: $.data.id } }
          trigger:
            - { call: "POST /busops/charter-trips/${ch}/quote", payload: {}, as: ContractorOps, captures: { q: $.data.quote_price_cents, vu: $.data.quote_valid_until } }
          assert:
            - "${q} == 85000"
            - "${vu} == 2026-05-04T00:00:00Z (default clock 2026-05-01 + 72h)"
      - name: charter_final_price_with_overage
        claim_type: correct_result
        grounds:
          - calculations.charter_quote_price
        distinguishing_aspect: "FINAL variant on completion: floor(60 x 12000 / 10) + 110 x 250 + floor(10 x 12000 x 125 / 1000) = 72000 + 27500 + 15000 = 114500; diverges from the 85000 provisional quote on the same trip."
        test_recipe:
          setup: ["ACTIVE contract; charter APPROVED and SCHEDULED with bus; started"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-CALC2", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-CA2", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BC2", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/charter-trips", payload: { contract_id: "${c_id}", purpose: "Overage trip", trip_date: "2026-06-10", pickup_minute: 600, return_minute: 900, estimated_hours_x10: 50, estimated_miles: 100, passenger_count: 20 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { ch: $.data.id } }
            - { call: "POST /busops/charter-trips/${ch}/quote", payload: {}, as: ContractorOps, captures: { ch_v: $.data.version } }
            - { call: "POST /busops/charter-trips/${ch}/approve", payload: { expected_charter_trip_version: "${ch_v}", deposit_cents: 50000 }, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/charter-trips/${ch}/schedule", payload: { assigned_bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/charter-trips/${ch}/start", payload: {}, as: ContractorOps }
          trigger:
            - { call: "POST /busops/charter-trips/${ch}/complete", payload: { actual_hours_x10: 60, actual_miles: 110 }, as: ContractorOps, captures: { fp: $.data.final_price_cents, st: $.data.status } }
            - { call: "GET /busops/buses/${b_id}", as: FleetManager, captures: { odo: $.data.odometer_miles } }
          assert:
            - "${fp} == 114500 (actuals plus 1.25x overage on 1.0 excess hour)"
            - "${st} == COMPLETED"
            - "${odo} == 110 (odometer advanced by actual_miles)"
            - "CharterTrip.${ch}.quote_price_cents == 85000 (provisional preserved; final diverges by 29500)"
      - name: on_time_performance_tiers
        claim_type: correct_result
        grounds:
          - calculations.on_time_performance
          - endpoints."GET /busops/service-days/{id}/district-report"
        distinguishing_aspect: "On-time percentage uses a 5-minute grace: pickups at 425 (planned 420) count on-time, 490 (planned 480) are 5 minutes late; 1 of 2 on time -> on_time_pct_x100 == 5000 -> tier DEFICIENT; student_minutes_late == 50."
        test_recipe:
          setup: ["full dispatch chain: two routes (420-480, 480-540), same driver, both COMPLETED on day 2026-06-01; ridership reports with first pickups 425 and 490"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-CALC3", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-CA3", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R2", school_site: "Lincoln", am_start_minute: 480, am_end_minute: 540, student_count: 10 }, as: ContractorOps }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Calc3", license_number: "L250", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BC3", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sd1: $.data.id } }
            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { a1: "$.data[0].id", a2: "$.data[1].id" } }
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${a2}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${a1}/start", payload: {}, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${a1}/complete", payload: { actual_start_minute: 425, actual_end_minute: 480, actual_miles: 55 }, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${a2}/start", payload: {}, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${a2}/complete", payload: { actual_start_minute: 490, actual_end_minute: 545, actual_miles: 55 }, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/ridership-reports", payload: { assignment_id: "${a1}", service_day_id: "${sd1}", boardings: 40, alightings: 40, first_pickup_actual_minute: 425, last_dropoff_actual_minute: 478 }, as: ContractorOps, captures: { rep1: $.data.id } }
            - { call: "POST /busops/ridership-reports", payload: { assignment_id: "${a2}", service_day_id: "${sd1}", boardings: 10, alightings: 10, first_pickup_actual_minute: 490, last_dropoff_actual_minute: 545 }, as: ContractorOps, captures: { rep2: $.data.id } }
          trigger:
            - { call: "GET /busops/service-days/${sd1}/district-report", as: DistrictAdmin, as_user_id: "${d_id}", captures: { pct: $.data.on_time_pct_x100, tier: $.data.on_time_tier, tb: $.data.total_boardings, sml: $.data.total_student_minutes_late, sla: $.data.sla_breached_incidents } }
          assert:
            - "RidershipReport.${rep1}.on_time == true (425 - 420 - 5 grace = 0 late)"
            - "RidershipReport.${rep2}.minutes_late == 5 and student_minutes_late == 50 (5 x 10 boardings)"
            - "${pct} == 5000 and ${tier} == DEFICIENT (below 9000)"
            - "${tb} == 50 and ${sml} == 50"
            - "${sla} == 0"
      - name: driver_safety_minutes_excluded_from_eligibility
        claim_type: input_set_filtering
        grounds:
          - calculations.training_eligibility
        distinguishing_aspect: "SAFETY-category minutes are excluded from both eligibility aggregates: a driver with 2300 BEHIND_WHEEL + 200 SAFETY (sum 2500 > 2400) still fails SCHEDULE_TEST."
        test_recipe:
          setup: ["district; driver in TRAINING with 2300 BW + 200 SAFETY + 1200 CLASSROOM minutes"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-CALC4", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Safe", license_number: "L251", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2300, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "SAFETY", minutes: 200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-03" }, as: HRRecruiter }
          trigger:
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_TRAINING_HOURS_INSUFFICIENT (SAFETY minutes do not substitute)"
            - "Driver.${dr_id}.behind_wheel_minutes == 2300"
      - name: district_outstanding_reconciliation
        claim_type: correct_result
        grounds:
