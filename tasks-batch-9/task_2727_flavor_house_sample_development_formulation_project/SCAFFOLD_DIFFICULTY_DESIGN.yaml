              as: Flavorist
              captures: { f4: $.data.id, f4_count: $.data.component_count, f4_total: $.data.total_weight_pct }
          trigger:
            - call: "POST /formulas/${f4}/cost"
              payload: {}
              as: Flavorist
              captures: { err: $.data.error_id }
          assert:
            - "${f4_count} == 0 and ${f4_total} == 0.0000 at creation"
            - "${err} == ERR_FORMULA_NO_COMPONENTS with HTTP 422"
            - "${err} != ERR_WEIGHT_SUM_INVALID (priority 61 precedes priority 62)"
            - "Formula.${f4}.status is still DRAFT and bench_cost_per_kg_cents is null (not 0)"
            - "Formula.${f4}.bench_cost_in_use_cents_per_tonne is null and cost_stale is false"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: lot_release_requires_its_formula_to_still_be_approved
        grounds:
          - validations[priority=42]
          - errors.ERR_FORMULA_NOT_APPROVED
          - state_machines.Formula.APPROVED_to_SUPERSEDED
          - state_machines.SampleLot.HELD_to_RELEASED
          - concurrency_rules[formula-revision-stale-parent]
        distinguishing_aspect: |
          Entity pair SampleLot -> Formula. The lot itself is in a perfectly legal
          from-state for release (qc PASSED, disposition HELD), and nothing about the
          lot changed; the request must fail purely because a revision moved its
          Formula from APPROVED to SUPERSEDED. The error is the cross-entity guard
