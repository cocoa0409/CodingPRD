              as: NetworkEngineer
              captures: { probe_id: $.data.id }

            - call: "POST /methodology-documents"
              payload: { doc_code: "MTH-2026-A", version_label: "v1.0", methodology_url: "https://isp.example/methodology/v1.0", peak_hours_start_utc_hour: 19, peak_hours_end_utc_hour: 23, min_samples_required: 4, max_run_duration_days: 7 }
              as: NetworkEngineer
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /methodology-documents/${doc_id}/publish"
