            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T08:30:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat1: $.data.id, lot1: $.data.production_lot_id }
            - { call: "POST /api/batches/${bat1}/complete-mix", payload: {}, as: BatchOperator }
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat1}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 10, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run1: $.data.id }
            - { call: "POST /api/packaging-runs/${run1}/complete", payload: {}, as: BatchOperator }
            - call: "POST /api/production-lots/${lot1}/cure-tests"
              payload: { method: "FULL", specimens: [13.0, 12.5, 12.4, 12.3, 12.6] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t1: $.data.id }
            - { call: "POST /api/cure-tests/${t1}/accept", payload: {}, as: QAManager, as_user_id: "qm-1" }
            - { call: "POST /api/production-lots/${lot1}/release", payload: {}, as: QAManager, as_user_id: "qm-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-06-01T08:00:00Z", mix_end_at: "2026-06-01T08:30:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat2: $.data.id, lot2: $.data.production_lot_id }
            - { call: "POST /api/batches/${bat2}/complete-mix", payload: {}, as: BatchOperator }
            - call: "POST /api/packaging-runs"
