# ============================================================================
# SCAFFOLD.yaml — §1.0 through §1.7
# Task 2714: Emergency Medical Dispatch Protocol Quality Assurance
# ============================================================================

scenario: |
  Generate task harder than expert level!

  2714. Emergency Medical Dispatch Protocol Quality Assurance (emergency communications center):
  protocol compliance review with random and targeted call sampling by call type, scoring across
  case entry, key questions, pre-arrival instructions and final coding, determinant code accuracy
  affecting response mode and resource assignment, feedback delivery to dispatchers with coaching
  plans and remediation training, high-risk case review including cardiac arrest recognition and
  dispatcher-assisted resuscitation performance, accreditation compliance requirements with
  compliance percentage thresholds, protocol version updates, retraining and go-live coordination,
  aggregate reporting to the medical director and oversight committee

domain_name: emergency-medical-dispatch-qa

# All resource collections are top-level siblings (flat + selective sub-resource nesting);
# there is no single owning resource, so the API prefix is the service root.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - version_pinning_on_approval

  entity_topology: graph
  # graph: CallRecord × SamplingPeriod meet in Review (junction with its own lifecycle);
  # ProtocolVersion is referenced from four unrelated aggregates (Dispatcher certification,
  # Review pinning, RetrainingSession curriculum, ProtocolRollout); CoachingPlan points back
  # at the Review that produced it, closing a cycle Review -> CoachingPlan -> Dispatcher -> Review.

  state_machine_shape: cyclic
  # Review is cyclic (SELECTED -> SCORED -> DISPUTED -> SELECTED, bounded by max_rebuttal_rounds);
  # Dispatcher and ProtocolRollout each carry two independent state dimensions;
  # HighRiskCaseReview branches (SENTINEL_EVENT | COACHING_ONLY) then rejoins at CLOSED;
  # CoachingPlan cycles IN_PROGRESS -> VERIFIED -> IN_PROGRESS on session cancellation.

  relationship_patterns:
    - one_to_many
    - many_to_many        # SamplingPeriod <-> CallRecord through Review
    - cross_aggregate     # CoachingPlan.source_review_id crosses the sampling aggregate
    - polymorphic: false

  role_model: segregation_of_duties
  # QaReviewer scores, QaSupervisor finalizes, and the same X-User-ID may not do both on one
  # Review; MedicalDirector alone approves protocol versions and signs off high-risk cases.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:
  - name: AuditProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: display name of the emergency communications center QA program
      - name: accreditation_body
        type: enum
        source: input
        description: accrediting authority the program reports to
        constraints: "one of {IAED, NAED_LOCAL, STATE_OEMS}"
      - name: target_compliance_pct
        type: number
        source: input
        description: minimum compliance percentage required for accreditation
        default: 90.0
        constraints: "1 decimal place; 0.0 < value <= 100.0"
      - name: watch_floor_pct
        type: number
        source: input
        description: compliance percentage floor separating WATCH from PROBATION posture
        default: 80.0
        constraints: "1 decimal place; 0.0 <= value < target_compliance_pct"
      - name: high_risk_target_pct
        type: number
        source: input
        description: minimum high-risk (DA-CPR) pass percentage required for accreditation
        default: 85.0
        constraints: "1 decimal place; 0.0 < value <= 100.0"
      - name: review_deadline_days
        type: integer
        source: input
        description: days after Review.created_at within which a Review must be finalized
        default: 30
        constraints: ">= 1"
      - name: rebuttal_window_days
        type: integer
        source: input
        description: days after Review.scored_at within which a dispatcher may file a rebuttal
        default: 14
        constraints: ">= 1"
      - name: max_rebuttal_rounds
        type: integer
        source: input
        description: maximum number of rebuttals a single Review may accumulate
        default: 2
        constraints: "0 <= value <= 3"
      - name: escalated_sample_floor
        type: integer
        source: input
        description: minimum target_sample_count for periods opened while the program is AT_RISK
        default: 25
        constraints: ">= 1"
      - name: hours_owed_restriction_threshold
        type: number
        source: input
        description: remediation_hours_owed above which a dispatcher's privilege is RESTRICTED
        default: 6.0
        constraints: "1 decimal place; >= 0.0"
      - name: accreditation_status
        type: enum
        source: computed
        description: derived from the most recent SUBMITTED AccreditationReport (see calculations.program_accreditation_status)
        constraints: "one of {SETUP, ACCREDITED, AT_RISK}; SETUP until the first report is submitted"
      - name: latest_compliance_pct
        type: number
        source: computed
        description: compliance_pct of the most recent SUBMITTED AccreditationReport; null when none
        default: null
      - name: submitted_report_count
        type: integer
        source: computed
        description: count of AccreditationReport rows for this program with status == SUBMITTED
        default: 0
      - name: sentinel_event_count
        type: integer
        source: computed
        description: count of HighRiskCaseReview rows with status == SENTINEL_EVENT whose Review.status != VOIDED, across the program
        default: 0

  - name: ProtocolVersion
    parent: AuditProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> AuditProgram.id; owning QA program"
      - name: protocol_family
        type: enum
        source: input
        description: card set family this version belongs to; overlap is checked per family
        constraints: "one of {MPDS_CARDSET, LOCAL_CARDSET}"
      - name: version_label
        type: string
        source: input
        description: human label such as "v13.2"
        constraints: "unique per (program_id, protocol_family)"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive lower bound of the interval during which this version governs calls
      - name: effective_to
        type: datetime
        source: input
        description: exclusive upper bound of the governing interval; null means open-ended (+infinity)
        default: null
      - name: case_entry_weight
        type: number
        source: input
        description: weight of the case-entry section in the accreditation-weighted composite
        constraints: "4 decimal places; 0.0000 <= value <= 1.0000"
      - name: key_questions_weight
        type: number
        source: input
        description: weight of the key-questions section
        constraints: "4 decimal places; 0.0000 <= value <= 1.0000"
      - name: pre_arrival_weight
        type: number
        source: input
        description: weight of the pre-arrival-instructions section
        constraints: "4 decimal places; 0.0000 <= value <= 1.0000"
      - name: final_coding_weight
        type: number
        source: input
        description: weight of the final-coding section; the four weights must sum to exactly 1.0000
        constraints: "4 decimal places; case_entry + key_questions + pre_arrival + final_coding == 1.0000"
      - name: status
        type: enum
        source: system
        description: lifecycle state (see state_machines.ProtocolVersion)
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED, ACTIVE, SUPERSEDED}"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the MedicalDirector who approved this version; null while DRAFT
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant at which the version became ACTIVE via rollout go-live
        default: null
      - name: superseded_at
        type: datetime
        source: system
        description: logical-clock instant at which a newer version displaced this one
        default: null

  - name: ProtocolRollout
    parent: ProtocolVersion
    common_fields: true
    fields:
      - name: protocol_version_id
        type: string
        source: input
        description: "FK -> ProtocolVersion.id; the version this rollout puts into force"
      - name: scheduled_golive_at
        type: datetime
        source: input
        description: earliest logical-clock instant at which go-live may be executed
      - name: target_dispatcher_count
        type: integer
        source: input
        description: number of dispatchers that must be certified on the version before go-live
        constraints: ">= 1"
      - name: required_training_hours
        type: number
        source: input
        description: retraining hours the program expects per dispatcher for this rollout
        default: 2.0
        constraints: "1 decimal place; >= 0.0"
      - name: trained_dispatcher_count
        type: integer
        source: computed
        description: count of Dispatcher rows in the version's program with certification_status == CERTIFIED and certified_protocol_version_id == protocol_version_id
        default: 0
      - name: training_status
        type: enum
        source: computed
        description: retraining dimension, derived from trained_dispatcher_count (see calculations.rollout_training_rollup)
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, IN_PROGRESS, COMPLETE}; independent of golive_status"
      - name: golive_status
        type: enum
        source: system
        description: go-live dimension, advanced only by POST /protocol-rollouts/{id}/go-live
        default: SCHEDULED
        constraints: "one of {SCHEDULED, LIVE}; independent of training_status"
      - name: went_live_at
        type: datetime
        source: system
        description: logical-clock instant the rollout went live
        default: null

  - name: Dispatcher
    parent: AuditProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> AuditProgram.id; employing QA program"
      - name: employee_code
        type: string
        source: input
        description: center-issued dispatcher code
        constraints: "unique per program_id"
      - name: full_name
        type: string
        source: input
        description: dispatcher name shown on coaching paperwork
      - name: hire_date
        type: datetime
        source: input
        description: date of hire, used only for reporting
        default: null
      - name: certified_protocol_version_id
        type: string
        source: system
        description: "FK -> ProtocolVersion.id; version the dispatcher is currently certified on; null until the first certify call"
        default: null
      - name: certification_status
        type: enum
        source: system
        description: certification dimension (see state_machines.Dispatcher)
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, CERTIFIED, LAPSED}"
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent successful certification
        default: null
      - name: reviewed_case_count
        type: integer
        source: computed
        description: count of Review rows with this dispatcher_id and status == FINALIZED
        default: 0
      - name: compliance_points_total
        type: number
        source: computed
        description: conserved ledger — sum of final_composite_score over the dispatcher's FINALIZED reviews, 1 decimal place
        default: 0.0
      - name: compliance_pct
        type: number
        source: computed
        description: compliance_points_total / reviewed_case_count, 1 decimal place; null when reviewed_case_count == 0
        default: null
      - name: compliance_posture
        type: enum
        source: computed
        description: threshold-derived posture (see calculations.dispatcher_compliance_rollup)
        default: UNRATED
        constraints: "one of {UNRATED, GOOD, WATCH, PROBATION}"
      - name: remediation_hours_owed
        type: number
        source: computed
        description: conserved ledger — unmet required hours across the dispatcher's open coaching plans, 2 decimal places
        default: 0.00
      - name: sentinel_event_count
        type: integer
        source: computed
        description: count of HighRiskCaseReview rows with status == SENTINEL_EVENT on this dispatcher's non-VOIDED reviews
        default: 0
      - name: dispatch_privilege
        type: enum
        source: computed
        description: privilege dimension derived from the two ledgers plus certification_status (see calculations.dispatch_privilege_derivation)
        default: FULL
        constraints: "one of {FULL, RESTRICTED, SUSPENDED}"

  - name: CallRecord
    parent: Dispatcher
    common_fields: true
    fields:
      - name: dispatcher_id
        type: string
        source: input
        description: "FK -> Dispatcher.id; the EMD who handled the call"
      - name: call_reference
        type: string
        source: input
        description: CAD incident reference; the deterministic tie-break key for sample ordering
        constraints: "globally unique; ASCII, compared with plain string ordering"
      - name: call_type
        type: enum
        source: input
        description: chief-complaint bucket used for sampling by call type
        constraints: "one of {CARDIAC_ARREST, CHEST_PAIN, BREATHING_PROBLEM, TRAUMA, UNCONSCIOUS}"
      - name: received_at
        type: datetime
        source: input
        description: instant the call was answered; must not be after the logical clock
      - name: dispatched_determinant_code
        type: string
        source: input
        description: determinant code the dispatcher actually assigned, e.g. "10-C-1"
        constraints: "matches ^[0-9]{1,2}-[OABCDE]-[0-9]{1,2}$"
      - name: dispatched_priority_rank
        type: integer
        source: computed
        description: numeric rank of the dispatched code's level letter (see calculations.determinant_code_decoding)
        constraints: "1 for O, 2 for A, 3 for B, 4 for C, 5 for D, 6 for E"
      - name: response_mode_assigned
        type: enum
        source: computed
        description: response mode implied by the dispatched code
        constraints: "HOT when level letter in {D, E}, otherwise COLD"
      - name: resource_assigned
        type: enum
        source: computed
        description: resource tier implied by the dispatched code
        constraints: "ALS when level letter in {C, D, E}, otherwise BLS"
      - name: cardiac_arrest_confirmed
        type: boolean
        source: input
        description: outcome data — whether the patient was in arrest
        default: false
      - name: bystander_cpr_in_progress
        type: boolean
        source: input
        description: whether bystander compressions were already underway when the call connected; re-weights the DA-CPR index
        default: false
      - name: status
        type: enum
        source: system
        description: INGESTED until a non-VOIDED Review references the call, then SELECTED
        default: INGESTED
        constraints: "one of {INGESTED, SELECTED}"

  - name: SamplingPeriod
    parent: AuditProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> AuditProgram.id; owning QA program"
      - name: call_type
        type: enum
        source: input
        description: the single call type this period samples
        constraints: "one of {CARDIAC_ARREST, CHEST_PAIN, BREATHING_PROBLEM, TRAUMA, UNCONSCIOUS}"
      - name: period_start
        type: datetime
        source: input
        description: inclusive lower bound of the sampled call window
      - name: period_end
        type: datetime
        source: input
        description: exclusive upper bound of the sampled call window
        constraints: "period_end > period_start; window is half-open [period_start, period_end)"
      - name: sampling_mode
        type: enum
        source: input
        description: which selection endpoints this period accepts
        constraints: "one of {RANDOM, TARGETED, MIXED}; RANDOM accepts only draw-random-sample, TARGETED only target-review, MIXED both"
      - name: target_sample_count
        type: integer
        source: input
        description: number of cases the period must select before it can be closed
        constraints: ">= 1"
      - name: selected_review_count
        type: integer
        source: computed
        description: conserved ledger — count of Review rows for this period with status != VOIDED
        default: 0
      - name: finalized_review_count
        type: integer
        source: computed
        description: count of Review rows for this period with status == FINALIZED
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle state (see state_machines.SamplingPeriod)
        default: OPEN
        constraints: "one of {OPEN, CLOSED, LOCKED}"
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the period was closed
        default: null
      - name: locked_at
        type: datetime
        source: system
        description: logical-clock instant an accreditation submission locked the period
        default: null

  - name: Review
    parent: SamplingPeriod
    common_fields: true
    fields:
      - name: sampling_period_id
        type: string
        source: input
        description: "FK -> SamplingPeriod.id; the period that selected this case"
      - name: call_record_id
        type: string
        source: input
        description: "FK -> CallRecord.id; the sampled call"
      - name: dispatcher_id
        type: string
        source: computed
        description: "FK -> Dispatcher.id; copied from the CallRecord at selection time"
      - name: protocol_version_id
        type: string
        source: computed
        description: "FK -> ProtocolVersion.id; version pinned at selection time (see calculations.protocol_version_pinning); section weights are read from this row forever after"
      - name: selection_mode
        type: enum
        source: system
        description: RANDOM when produced by draw-random-sample, TARGETED when produced by target-review
        constraints: "one of {RANDOM, TARGETED}"
      - name: selection_reason
        type: enum
        source: input
        description: documented justification; SYSTEMATIC_DRAW is stamped by the random draw
        constraints: "one of {COMPLAINT, HIGH_RISK_OUTCOME, SENTINEL_FLAG, NEW_HIRE_AUDIT, SYSTEMATIC_DRAW}"
      - name: high_risk
        type: boolean
        source: computed
        description: true when call_type == CARDIAC_ARREST, or CallRecord.cardiac_arrest_confirmed, or the dispatched code's level letter is E
        default: false
      - name: status
        type: enum
        source: system
        description: lifecycle state (see state_machines.Review)
        default: SELECTED
        constraints: "one of {SELECTED, SCORED, DISPUTED, FINALIZED, VOIDED}"
      - name: current_sheet_round
        type: integer
        source: computed
        description: highest sheet_round among this review's ScoreSheet rows; 0 when none exist; the sheet with this round is "the current sheet"
        default: 0
      - name: provisional_composite_score
        type: number
        source: computed
        description: unweighted section mean of the current sheet, 1 decimal place; null while SELECTED
        default: null
      - name: pre_penalty_composite_score
        type: number
        source: computed
        description: accreditation-weighted composite before the determinant penalty, 1 decimal place; written at finalize
        default: null
      - name: determinant_accuracy
        type: enum
        source: computed
        description: accuracy class copied from the current sheet at finalize
        default: null
        constraints: "one of {ACCURATE, MINOR_MISCODE, OVER_TRIAGE, UNDER_TRIAGE} or null before finalize"
      - name: penalty_points
        type: number
        source: computed
        description: determinant penalty subtracted at finalize, 1 decimal place
        default: null
      - name: final_composite_score
        type: number
        source: computed
        description: pre_penalty_composite_score minus penalty_points, floored at 0.0, 1 decimal place; null unless FINALIZED
        default: null
      - name: compliant
        type: boolean
        source: computed
        description: final_composite_score >= AuditProgram.target_compliance_pct; null unless FINALIZED
        default: null
      - name: rebuttal_round_count
        type: integer
        source: computed
        description: count of Rebuttal rows on this review, regardless of decision
        default: 0
      - name: scored_at
        type: datetime
        source: system
        description: logical-clock instant of the current sheet's submission; reset to null when a rebuttal is UPHELD
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: logical-clock instant of finalization; the timestamp accreditation windows filter on
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant of voiding
        default: null
      - name: void_reason
        type: enum
        source: input
        description: documented reason for voiding; PERIOD_LOCKED is stamped by the lock cascade
        default: null
        constraints: "one of {AUDIO_UNAVAILABLE, WRONG_DISPATCHER, DUPLICATE_CASE, PERIOD_LOCKED} or null"

  - name: ScoreSheet
    parent: Review
    common_fields: false
    fields:
      - name: review_id
        type: string
        source: input
        description: "FK -> Review.id; the review this sheet scores"
      - name: sheet_round
        type: integer
        source: system
        description: Review.current_sheet_round + 1 at submission time; sheets are append-only and never mutated
        constraints: ">= 1; unique per review_id"
      - name: case_entry_points_earned
        type: integer
        source: input
        description: points earned on the case-entry section
        constraints: ">= 0 and <= case_entry_points_possible"
      - name: case_entry_points_possible
        type: integer
        source: input
        description: points available on the case-entry section; 0 means the section is not applicable
        constraints: ">= 0"
      - name: key_questions_points_earned
        type: integer
        source: input
        description: points earned on the key-questions section
        constraints: ">= 0 and <= key_questions_points_possible"
      - name: key_questions_points_possible
        type: integer
        source: input
        description: points available on the key-questions section; 0 means not applicable
        constraints: ">= 0"
      - name: pre_arrival_points_earned
        type: integer
        source: input
        description: points earned on the pre-arrival-instructions section
        constraints: ">= 0 and <= pre_arrival_points_possible"
      - name: pre_arrival_points_possible
        type: integer
        source: input
        description: points available on the pre-arrival-instructions section; 0 means not applicable
        constraints: ">= 0"
      - name: final_coding_points_earned
        type: integer
        source: input
        description: points earned on the final-coding section
        constraints: ">= 0 and <= final_coding_points_possible"
      - name: final_coding_points_possible
        type: integer
        source: input
        description: points available on the final-coding section; 0 means not applicable
        constraints: ">= 0"
      - name: case_entry_pct
        type: number
        source: computed
        description: 100 * earned / possible rounded to 2 decimals; exactly 100.00 when possible == 0
      - name: key_questions_pct
        type: number
        source: computed
        description: 100 * earned / possible rounded to 2 decimals; exactly 100.00 when possible == 0
      - name: pre_arrival_pct
        type: number
        source: computed
        description: 100 * earned / possible rounded to 2 decimals; exactly 100.00 when possible == 0
      - name: final_coding_pct
        type: number
        source: computed
        description: 100 * earned / possible rounded to 2 decimals; exactly 100.00 when possible == 0
      - name: provisional_composite_score
        type: number
        source: computed
        description: arithmetic mean of the four rounded section percentages, rounded to 1 decimal
      - name: reviewer_determinant_code
        type: string
        source: input
        description: determinant code the reviewer judges correct for this call
        constraints: "matches ^[0-9]{1,2}-[OABCDE]-[0-9]{1,2}$"
      - name: reviewer_priority_rank
        type: integer
        source: computed
        description: numeric rank of the reviewer code's level letter, same mapping as CallRecord.dispatched_priority_rank
      - name: reviewer_response_mode
        type: enum
        source: computed
        description: response mode implied by the reviewer code
        constraints: "one of {HOT, COLD}"
      - name: reviewer_resource
        type: enum
        source: computed
        description: resource tier implied by the reviewer code
        constraints: "one of {ALS, BLS}"
      - name: response_mode_deviation
        type: boolean
        source: computed
        description: reviewer_response_mode != CallRecord.response_mode_assigned
      - name: resource_deviation
        type: boolean
        source: computed
        description: reviewer_resource != CallRecord.resource_assigned
      - name: determinant_accuracy
        type: enum
        source: computed
        description: accuracy class of the dispatched code against the reviewer code (see calculations.determinant_accuracy_classification)
        constraints: "one of {ACCURATE, MINOR_MISCODE, OVER_TRIAGE, UNDER_TRIAGE}"
      - name: reviewer_notes
        type: string
        source: input
        description: free-text QA narrative
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the QaReviewer who submitted the sheet; the segregation-of-duties comparand at finalize

  - name: Rebuttal
    parent: Review
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: input
        description: "FK -> Review.id; the disputed review"
      - name: round_index
        type: integer
        source: system
        description: Review.rebuttal_round_count + 1 at submission time
        constraints: ">= 1; unique per review_id"
      - name: grounds_category
        type: enum
        source: input
        description: dispatcher's stated grounds
        constraints: "one of {SCORING_DISPUTE, DETERMINANT_DISPUTE, PROTOCOL_AMBIGUITY, AUDIO_QUALITY}"
      - name: narrative
        type: string
        source: input
        description: dispatcher's written argument
      - name: status
        type: enum
        source: system
        description: lifecycle state (see state_machines.Rebuttal)
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UPHELD, REJECTED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the filing dispatcher; always equals Review.dispatcher_id
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the QaSupervisor who decided the rebuttal
        default: null
      - name: decision_notes
        type: string
        source: input
        description: supervisor's rationale, supplied on the decide call
        default: null

  - name: HighRiskCaseReview
    parent: Review
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: input
        description: "FK -> Review.id; the high-risk review under clinical scrutiny"
        constraints: "at most one HighRiskCaseReview per review_id"
      - name: outcome_category
        type: enum
        source: input
        description: patient outcome recorded by the reviewer
        constraints: "one of {ROSC_FIELD, ROSC_HOSPITAL, NO_ROSC, NOT_ARREST}"
      - name: cardiac_arrest_recognized
        type: boolean
        source: input
        description: whether the dispatcher recognised arrest during case entry; supplied on score-dacpr
        default: null
      - name: recognition_time_sec
        type: integer
        source: input
        description: seconds from call answer to arrest recognition; supplied on score-dacpr
        default: null
        constraints: ">= 0"
      - name: time_to_first_compression_sec
        type: integer
        source: input
        description: seconds from call answer to first bystander compression; supplied on score-dacpr
        default: null
        constraints: ">= 0"
      - name: dacpr_instructions_delivered
        type: boolean
        source: input
        description: whether dispatcher-assisted CPR instructions were read; supplied on score-dacpr
        default: null
      - name: compressions_coached
        type: boolean
        source: input
        description: whether the dispatcher coached compression tempo; supplied on score-dacpr
        default: null
      - name: compression_compliant
        type: boolean
        source: computed
        description: time_to_first_compression_sec <= COMPRESSION_LIMIT_SEC (120); exactly 120 is compliant
        default: null
      - name: dacpr_index
        type: number
        source: computed
        description: dispatcher-assisted resuscitation performance index, 1 decimal place (see calculations.dacpr_performance_index)
        default: null
      - name: dacpr_pass
        type: boolean
        source: computed
        description: dacpr_index >= HIGH_RISK_PASS_INDEX (75.0)
        default: null
      - name: classification
        type: enum
        source: input
        description: medical-director classification supplied on sign-off; drives divergent side-effect sets
        default: null
        constraints: "one of {SENTINEL_EVENT, COACHING_ONLY} or null before sign-off"
      - name: status
        type: enum
        source: system
        description: lifecycle state (see state_machines.HighRiskCaseReview)
        default: PENDING
        constraints: "one of {PENDING, DACPR_SCORED, SENTINEL_EVENT, COACHING_ONLY, CLOSED}"
      - name: signed_off_by_user_id
        type: string
        source: system
        description: X-User-ID of the signing MedicalDirector
        default: null
      - name: signed_off_at
        type: datetime
        source: system
        description: logical-clock instant of sign-off
        default: null
      - name: director_notes
        type: string
        source: input
        description: medical-director narrative supplied on sign-off
        default: null

  - name: CoachingPlan
    parent: Dispatcher
    common_fields: true
    fields:
      - name: dispatcher_id
        type: string
        source: input
        description: "FK -> Dispatcher.id; the coached dispatcher"
      - name: source_review_id
        type: string
        source: input
        description: "FK -> Review.id; set by the cascade to the review whose finalization or sign-off produced an AUTO plan, and optionally supplied on POST /coaching-plans when a supervisor attaches a MANUAL plan to the review that prompted it; null when omitted"
        default: null
        constraints: "at most one plan per (dispatcher_id, source_review_id) with source_review_id not null; a create that collides with an existing AUTO plan on that key is refused with ERR_DUPLICATE_COACHING_PLAN"
      - name: origin
        type: enum
        source: system
        description: AUTO when created by a cascade, MANUAL when created through POST /coaching-plans
        constraints: "one of {AUTO, MANUAL}"
      - name: severity
        type: enum
        source: input
        description: coaching severity; supplied by the supervisor for MANUAL plans, derived by calculations.auto_coaching_plan_upsert for AUTO plans
        constraints: "one of {ADVISORY, STANDARD, CRITICAL}"
      - name: severity_rank
        type: integer
        source: computed
        description: 1 for ADVISORY, 2 for STANDARD, 3 for CRITICAL; an AUTO upsert only ever raises this
      - name: focus_area
        type: enum
        source: input
        description: protocol area the coaching targets
        constraints: "one of {CASE_ENTRY, KEY_QUESTIONS, PRE_ARRIVAL_INSTRUCTIONS, FINAL_CODING, DETERMINANT_CODING, DACPR}"
      - name: required_hours
        type: number
        source: computed
        description: remediation hours implied by severity — ADVISORY 2.0, STANDARD 4.0, CRITICAL 8.0 — 1 decimal place
      - name: credited_hours
        type: number
        source: computed
        description: sum of duration_hours over this plan's RetrainingSession rows with status == COMPLETED, 2 decimal places
        default: 0.00
      - name: status
        type: enum
        source: system
        description: lifecycle state (see state_machines.CoachingPlan)
        default: ASSIGNED
        constraints: "one of {ASSIGNED, IN_PROGRESS, VERIFIED, SUSPENDED, CANCELLED}"
      - name: closure_reason
        type: enum
        source: system
        description: why a CANCELLED plan was closed
        default: null
        constraints: "one of {SUPERSEDED, SOURCE_VOIDED} or null"
      - name: due_at
        type: datetime
        source: input
        description: date the remediation is expected to be complete; reporting only
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant credited_hours first reached required_hours
        default: null

  - name: RetrainingSession
    parent: CoachingPlan
    common_fields: true
    fields:
      - name: coaching_plan_id
        type: string
        source: input
        description: "FK -> CoachingPlan.id; the plan this session credits"
      - name: protocol_version_id
        type: string
        source: input
        description: "FK -> ProtocolVersion.id; curriculum version taught in the session"
      - name: starts_at
        type: datetime
        source: input
        description: session start instant
      - name: ends_at
        type: datetime
        source: input
        description: session end instant
        constraints: "ends_at > starts_at"
      - name: modality
        type: enum
        source: input
        description: delivery format
        constraints: "one of {CLASSROOM, SIMULATION, ONLINE, ONE_ON_ONE}"
      - name: duration_hours
        type: number
        source: computed
        description: (ends_at - starts_at) expressed in hours, rounded to 2 decimals
      - name: status
        type: enum
        source: system
        description: lifecycle state (see state_machines.RetrainingSession)
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
      - name: attendance_confirmed
        type: boolean
        source: input
        description: supervisor attestation supplied on complete
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: free-text cancellation reason supplied on cancel
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of completion
        default: null

  - name: AccreditationReport
    parent: AuditProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> AuditProgram.id; reported program"
      - name: window_start
        type: datetime
        source: input
        description: inclusive lower bound on Review.finalized_at
      - name: window_end
        type: datetime
        source: input
        description: exclusive upper bound on Review.finalized_at
        constraints: "window_end > window_start; window is half-open [window_start, window_end)"
      - name: variant
        type: enum
        source: input
        description: which aggregation the report uses
        constraints: "one of {CASE_WEIGHTED, DISPATCHER_EQUAL_WEIGHT}"
      - name: review_count
        type: integer
        source: computed
        description: number of FINALIZED reviews inside the window for this program
      - name: compliant_review_count
        type: integer
        source: computed
        description: number of those reviews with compliant == true
      - name: dispatcher_count
        type: integer
        source: computed
        description: number of distinct dispatchers contributing at least one in-window FINALIZED review
      - name: compliance_pct
        type: number
        source: computed
        description: variant-dependent compliance percentage, 1 decimal place (see calculations.accreditation_compliance_percentage)
      - name: high_risk_review_count
        type: integer
        source: computed
        description: number of in-window FINALIZED reviews with high_risk == true
      - name: high_risk_pass_count
        type: integer
        source: computed
        description: number of those whose HighRiskCaseReview has dacpr_pass == true
      - name: high_risk_compliance_pct
        type: number
        source: computed
        description: 100 * high_risk_pass_count / high_risk_review_count, 1 decimal place; null when high_risk_review_count == 0
        default: null
      - name: threshold_met
        type: boolean
        source: computed
        description: compliance_pct >= program.target_compliance_pct AND (high_risk_compliance_pct is null OR >= program.high_risk_target_pct)
      - name: status
        type: enum
        source: system
        description: lifecycle state (see state_machines.AccreditationReport)
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED}"
      - name: submitted_to
        type: enum
        source: input
        description: recipient supplied on submit
        default: null
        constraints: "one of {MEDICAL_DIRECTOR, OVERSIGHT_COMMITTEE} or null while DRAFT"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of submission
        default: null

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:
  - entity: Review
    initial_state: SELECTED
    terminal_states: [VOIDED]
    note: |
      Cyclic machine. SELECTED -> SCORED -> DISPUTED -> SELECTED is a real loop, bounded by
      AuditProgram.max_rebuttal_rounds through Review.rebuttal_round_count. SCORED -> SCORED is the
      supersede self-loop guarded by OCC on Review.version (see concurrency_rules).
    transitions:
      - from: SELECTED
        to: SCORED
        trigger: "POST /reviews/{id}/scores"
        actor: QaReviewer
        preconditions:
          - "review.status == SELECTED"
          - "review.sampling_period.status != LOCKED"
          - "payload.expected_review_version == review.version (OCC)"
          - "every section's points_earned <= points_possible"
          - "payload.reviewer_determinant_code matches the determinant-code regex"
        side_effects:
          - "creates ScoreSheet with sheet_round = review.current_sheet_round + 1 and submitted_by_user_id = X-User-ID"
          - "computes the sheet's four section percentages (2 dp) and determinant_accuracy against CallRecord.dispatched_determinant_code"
          - "sets review.current_sheet_round = sheet.sheet_round"
          - "sets review.provisional_composite_score = sheet.provisional_composite_score (calculations.review_composite_score variant section_unweighted_mean)"
          - "sets review.scored_at = logical clock"
          - "increments Review.version by 1"
      - from: SCORED
        to: SCORED
        trigger: "POST /reviews/{id}/scores (re-score; supersede self-loop)"
        actor: QaReviewer
        preconditions:
          - "review.status == SCORED"
          - "review.sampling_period.status != LOCKED (a frozen work-product review can no longer be re-scored; rejected with ERR_PERIOD_LOCKED)"
          - "no Rebuttal on this review has status == SUBMITTED"
          - "payload.expected_review_version == review.version (OCC; a stale value is rejected with ERR_STALE_REVIEW_VERSION)"
        side_effects:
          - "appends a new ScoreSheet with sheet_round = review.current_sheet_round + 1; earlier sheets are never mutated"
          - "review.current_sheet_round and review.provisional_composite_score are re-derived from the new sheet"
          - "sets review.scored_at = logical clock"
          - "increments Review.version by 1"
      - from: SCORED
        to: DISPUTED
        trigger: "POST /reviews/{id}/rebuttals"
        actor: Dispatcher
        preconditions:
          - "review.status == SCORED"
          - "X-User-ID == review.dispatcher_id"
          - "review.rebuttal_round_count < review.sampling_period.program.max_rebuttal_rounds"
          - "logical clock <= review.scored_at + program.rebuttal_window_days (inclusive)"
        side_effects:
          - "creates Rebuttal with round_index = review.rebuttal_round_count + 1 and status SUBMITTED"
          - "sets review.rebuttal_round_count = round_index"
          - "increments Review.version by 1"
      - from: DISPUTED
        to: SELECTED
        trigger: "POST /rebuttals/{id}/decide with decision == UPHELD"
        actor: QaSupervisor
        preconditions:
          - "rebuttal.status == SUBMITTED"
          - "review.status == DISPUTED"
        side_effects:
          - "sets rebuttal.status = UPHELD and decided_by_user_id = X-User-ID"
          - "clears review.provisional_composite_score to null and review.scored_at to null (the review must be re-scored)"
          - "review.current_sheet_round is left unchanged; the invalidated sheet stays in the append-only audit log"
          - "increments Review.version by 1"
      - from: DISPUTED
        to: SCORED
        trigger: "POST /rebuttals/{id}/decide with decision == REJECTED"
        actor: QaSupervisor
        preconditions:
          - "rebuttal.status == SUBMITTED"
          - "review.status == DISPUTED"
        side_effects:
          - "sets rebuttal.status = REJECTED and decided_by_user_id = X-User-ID"
          - "review.provisional_composite_score and review.scored_at are preserved (the existing sheet stands)"
          - "increments Review.version by 1"
      - from: SCORED
        to: FINALIZED
        trigger: "POST /reviews/{id}/finalize"
        actor: QaSupervisor
        preconditions:
          - "review.status == SCORED"
          - "X-User-ID != current ScoreSheet.submitted_by_user_id (segregation of duties)"
          - "review.sampling_period.status != LOCKED"
          - "if review.high_risk then a HighRiskCaseReview exists on this review with status in {SENTINEL_EVENT, COACHING_ONLY}"
          - "logical clock <= review.created_at + program.review_deadline_days (inclusive)"
        side_effects:
          - "CASCADE A link 1 — computes pre_penalty_composite_score (calculations.review_composite_score variant accreditation_weighted_composite), determinant_accuracy, penalty_points (calculations.determinant_accuracy_penalty), final_composite_score, compliant; sets finalized_at = logical clock; increments Review.version"
          - "sets sampling_period.finalized_review_count = count of FINALIZED reviews in the period"
          - "if a HighRiskCaseReview exists on this review with status in {SENTINEL_EVENT, COACHING_ONLY} it transitions to CLOSED (fork-join rejoin)"
          - "CASCADE A link 2 — because this review is now FINALIZED, Dispatcher.reviewed_case_count / compliance_points_total / compliance_pct are recomputed (calculations.dispatcher_compliance_rollup)"
          - "CASCADE A link 3 — because compliance_pct changed, Dispatcher.compliance_posture is re-derived; if it lands on PROBATION or WATCH (or determinant_accuracy == UNDER_TRIAGE) calculations.auto_coaching_plan_upsert creates or upgrades the AUTO CoachingPlan keyed (dispatcher_id, source_review_id)"
          - "CASCADE A link 4 — because that plan now carries required_hours, Dispatcher.remediation_hours_owed is recomputed"
          - "CASCADE A link 5 — because remediation_hours_owed changed, Dispatcher.dispatch_privilege is re-derived and becomes RESTRICTED once it exceeds program.hours_owed_restriction_threshold"
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /reviews/{id}/void"
        actor: QaSupervisor
        preconditions:
          - "review.status == FINALIZED"
          - "review.sampling_period.status != LOCKED"
        side_effects:
          - "CASCADE D link 1 — sets status VOIDED, voided_at = logical clock, void_reason = payload.void_reason; clears final_composite_score, pre_penalty_composite_score, penalty_points, determinant_accuracy, compliant to null; increments Review.version"
          - "sets call_record.status = INGESTED and recomputes sampling_period.selected_review_count and finalized_review_count"
          - "CASCADE D link 2 — because the review left FINALIZED, Dispatcher.reviewed_case_count / compliance_points_total / compliance_pct / compliance_posture are recomputed (compensating: the point ledger returns to its pre-finalize value exactly)"
          - "CASCADE D link 3 — because the source review is voided, every CoachingPlan with origin == AUTO and source_review_id == review.id and status in {ASSIGNED, IN_PROGRESS, SUSPENDED} becomes CANCELLED with closure_reason = SOURCE_VOIDED"
          - "CASCADE D link 4 — because those plans left the open set, Dispatcher.remediation_hours_owed is recomputed and Dispatcher.dispatch_privilege is re-derived (returning to FULL when both ledgers are clear)"
          - "if a HighRiskCaseReview exists on this review, Dispatcher.sentinel_event_count and AuditProgram.sentinel_event_count are recomputed (VOIDED reviews are excluded)"
      - from: SELECTED
        to: VOIDED
        trigger: "POST /reviews/{id}/void, or the lock cascade from POST /accreditation-reports/{id}/submit"
        actor: QaSupervisor | system
        preconditions:
          - "review.status == SELECTED"
        side_effects:
          - "sets status VOIDED, voided_at, void_reason (PERIOD_LOCKED when the lock cascade drives it)"
          - "sets call_record.status = INGESTED and decrements sampling_period.selected_review_count (sample-slot conservation)"
          - "no ledger effects: the review never contributed compliance points"
      - from: SCORED
        to: VOIDED
        trigger: "POST /reviews/{id}/void (manual only — the period-lock cascade never voids a SCORED review)"
        actor: QaSupervisor
        preconditions:
          - "review.status == SCORED"
        side_effects:
          - "sets status VOIDED, voided_at, void_reason; clears provisional_composite_score to null"
          - "sets call_record.status = INGESTED and decrements sampling_period.selected_review_count"
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /reviews/{id}/void (manual only — the period-lock cascade never voids a DISPUTED review)"
        actor: QaSupervisor
        preconditions:
          - "review.status == DISPUTED"
        side_effects:
          - "sets status VOIDED, voided_at, void_reason"
          - "every Rebuttal on the review with status == SUBMITTED stays SUBMITTED but is no longer decidable (its review is terminal)"
          - "sets call_record.status = INGESTED and decrements sampling_period.selected_review_count"

  - entity: Rebuttal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UPHELD
        trigger: "POST /rebuttals/{id}/decide with decision == UPHELD"
        actor: QaSupervisor
        preconditions:
          - "rebuttal.status == SUBMITTED"
          - "rebuttal.review.status == DISPUTED"
        side_effects:
          - "drives Review DISPUTED -> SELECTED (see state_machines.Review.DISPUTED_to_SELECTED)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rebuttals/{id}/decide with decision == REJECTED"
        actor: QaSupervisor
        preconditions:
          - "rebuttal.status == SUBMITTED"
          - "rebuttal.review.status == DISPUTED"
        side_effects:
          - "drives Review DISPUTED -> SCORED (see state_machines.Review.DISPUTED_to_SCORED)"

  - entity: SamplingPeriod
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /sampling-periods/{id}/close"
        actor: QaSupervisor
        preconditions:
          - "period.status == OPEN"
          - "period.selected_review_count >= period.target_sample_count (accreditation sampling quota; exactly equal passes)"
        side_effects:
          - "sets status CLOSED and closed_at = logical clock"
          - "no further case selection is accepted; reviews already selected remain scorable and finalizable"
          - "increments SamplingPeriod.version by 1"
      - from: CLOSED
        to: LOCKED
        trigger: "system — CASCADE C from POST /accreditation-reports/{id}/submit"
        actor: system
        preconditions:
          - "period.status == CLOSED"
          - "[period.period_start, period.period_end) overlaps [report.window_start, report.window_end)"
        side_effects:
          - "sets status LOCKED and locked_at = logical clock"
          - "CASCADE C link 3 — because the period is LOCKED, every Review of the period whose status is exactly SELECTED is VOIDED with void_reason = PERIOD_LOCKED; reviews already in SCORED or DISPUTED are deliberately preserved as audit work product and are simply frozen — any later score submission or finalization against them fails with ERR_PERIOD_LOCKED"
          - "CASCADE C link 4 — because those reviews are VOIDED, each linked CallRecord returns to status INGESTED and selected_review_count is recomputed"

  - entity: ProtocolVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /protocol-versions/{id}/approve"
        actor: MedicalDirector
        preconditions:
          - "version.status == DRAFT"
          - "the four section weights sum to exactly 1.0000"
          - "[effective_from, effective_to) does not overlap the interval of any other ProtocolVersion in the same (program_id, protocol_family) whose status is in {APPROVED, ACTIVE, SUPERSEDED} — half-open geometry, so touching endpoints do not collide; effective_to == null is +infinity"
        side_effects:
          - "sets status APPROVED and approved_by_user_id = X-User-ID"
          - "the version becomes eligible for Review protocol pinning and for RetrainingSession curricula"
          - "increments ProtocolVersion.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "system — CASCADE B link 1 from POST /protocol-rollouts/{id}/go-live"
        actor: system
        preconditions:
          - "version.status == APPROVED"
          - "the driving rollout has training_status == COMPLETE and golive_status == SCHEDULED"
        side_effects:
          - "sets status ACTIVE and activated_at = logical clock"
          - "CASCADE B link 2 — because a new version is ACTIVE, the previously ACTIVE version of the same (program_id, protocol_family) transitions ACTIVE -> SUPERSEDED"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — CASCADE B link 2, when another version of the same family becomes ACTIVE"
        actor: system
        preconditions:
          - "version.status == ACTIVE"
          - "a different version of the same (program_id, protocol_family) has just become ACTIVE"
        side_effects:
          - "sets status SUPERSEDED and superseded_at = logical clock; effective_to is left as declared"
          - "CASCADE B link 3 — because this version is SUPERSEDED, every Dispatcher with certified_protocol_version_id == this version and certification_status == CERTIFIED transitions CERTIFIED -> LAPSED"
          - "CASCADE B link 5 — because those dispatchers are no longer CERTIFIED, every ProtocolRollout on this version recomputes trained_dispatcher_count and its training_status regresses (COMPLETE -> NOT_STARTED when the count reaches zero)"

  - entity: ProtocolRollout
    initial_state: "TRAINING_NOT_STARTED + GOLIVE_SCHEDULED"
    terminal_states: [GOLIVE_LIVE]
    note: |
      Two independent state dimensions on one row. `training_status` (NOT_STARTED / IN_PROGRESS /
      COMPLETE) is derived from dispatcher certifications and may move in both directions;
      `golive_status` (SCHEDULED / LIVE) is advanced only by the go-live endpoint and is one-way.
      The go-live transition is guarded by the training dimension, but the training dimension never
      reads the go-live dimension.
    transitions:
      - from: TRAINING_NOT_STARTED
        to: TRAINING_IN_PROGRESS
        trigger: "system — POST /dispatchers/{id}/certify raises trained_dispatcher_count above 0 but below target"
        actor: system
        preconditions:
          - "0 < trained_dispatcher_count < target_dispatcher_count"
        side_effects:
          - "sets training_status = IN_PROGRESS; golive_status is untouched"
      - from: TRAINING_IN_PROGRESS
        to: TRAINING_COMPLETE
        trigger: "system — POST /dispatchers/{id}/certify raises trained_dispatcher_count to the target"
        actor: system
        preconditions:
          - "trained_dispatcher_count >= target_dispatcher_count (exactly equal is enough)"
        side_effects:
          - "sets training_status = COMPLETE; the go-live guard is now satisfiable"
      - from: TRAINING_COMPLETE
        to: TRAINING_NOT_STARTED
        trigger: "system — CASCADE B link 5, when the version is SUPERSEDED and every certification lapses"
        actor: system
        preconditions:
          - "trained_dispatcher_count == 0 after recomputation"
        side_effects:
          - "sets training_status = NOT_STARTED even when golive_status is already LIVE (the dimensions are independent)"
      - from: GOLIVE_SCHEDULED
        to: GOLIVE_LIVE
        trigger: "POST /protocol-rollouts/{id}/go-live"
        actor: ProgramAdmin
        preconditions:
          - "golive_status == SCHEDULED"
          - "training_status == COMPLETE"
          - "logical clock >= scheduled_golive_at"
          - "the rollout's ProtocolVersion.status == APPROVED"
        side_effects:
          - "sets golive_status = LIVE and went_live_at = logical clock; increments ProtocolRollout.version"
          - "CASCADE B link 1 — drives ProtocolVersion APPROVED -> ACTIVE, which in turn supersedes the prior ACTIVE version (link 2), lapses its certified dispatchers (link 3), suspends their open coaching plans and re-derives their privilege (link 4), and regresses the superseded version's rollout training_status (link 5)"

  - entity: Dispatcher
    initial_state: "PROVISIONAL + PRIVILEGE_FULL"
    terminal_states: []
    note: |
      Two independent dimensions. `certification_status` cycles PROVISIONAL -> CERTIFIED -> LAPSED
      -> CERTIFIED. `dispatch_privilege` is fully derived (calculations.dispatch_privilege_derivation)
      from remediation_hours_owed, certification_status and sentinel_event_count, so it is re-evaluated
      after every mutation that touches any of those three inputs.
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /dispatchers/{id}/certify"
        actor: ProgramAdmin
        preconditions:
          - "target ProtocolVersion.status in {APPROVED, ACTIVE}"
          - "target ProtocolVersion.program_id == dispatcher.program_id"
        side_effects:
          - "sets certified_protocol_version_id, certification_status = CERTIFIED, certified_at = logical clock; increments Dispatcher.version"
          - "every ProtocolRollout on the target version recomputes trained_dispatcher_count and training_status (bubble-up)"
          - "re-derives dispatch_privilege"
      - from: LAPSED
        to: CERTIFIED
        trigger: "POST /dispatchers/{id}/certify (re-certification on the newer version)"
        actor: ProgramAdmin
        preconditions:
          - "target ProtocolVersion.status in {APPROVED, ACTIVE}"
          - "target ProtocolVersion.program_id == dispatcher.program_id"
        side_effects:
          - "sets certified_protocol_version_id to the new version and certification_status = CERTIFIED"
          - "every CoachingPlan of this dispatcher with status == SUSPENDED returns to IN_PROGRESS when credited_hours > 0.00, otherwise to ASSIGNED"
          - "recomputes rollout training counters on both the old and the new version, then re-derives dispatch_privilege"
      - from: CERTIFIED
        to: LAPSED
        trigger: "system — CASCADE B link 3, when the certified version becomes SUPERSEDED"
        actor: system
        preconditions:
          - "certification_status == CERTIFIED"
          - "certified_protocol_version_id just transitioned to SUPERSEDED"
        side_effects:
          - "sets certification_status = LAPSED; certified_protocol_version_id is retained for audit"
          - "CASCADE B link 4 — because certification lapsed, every CoachingPlan of this dispatcher in {ASSIGNED, IN_PROGRESS} becomes SUSPENDED, and dispatch_privilege is re-derived to RESTRICTED"
      - from: PRIVILEGE_FULL
        to: PRIVILEGE_RESTRICTED
        trigger: "system — any recomputation of the two ledgers or of certification_status"
        actor: system
        preconditions:
          - "remediation_hours_owed > program.hours_owed_restriction_threshold, OR certification_status == LAPSED, OR sentinel_event_count == 1"
          - "sentinel_event_count < 2"
        side_effects:
          - "sets dispatch_privilege = RESTRICTED; the dispatcher's calls stay sampleable"
      - from: PRIVILEGE_RESTRICTED
        to: PRIVILEGE_SUSPENDED
        trigger: "system — a second SENTINEL_EVENT sign-off on this dispatcher's reviews"
        actor: system
        preconditions:
          - "sentinel_event_count >= 2"
        side_effects:
          - "sets dispatch_privilege = SUSPENDED; the dispatcher's INGESTED calls are excluded from the random-draw candidate pool"
      - from: PRIVILEGE_RESTRICTED
        to: PRIVILEGE_FULL
        trigger: "system — CASCADE D link 4, or a coaching plan reaching VERIFIED"
        actor: system
        preconditions:
          - "remediation_hours_owed <= program.hours_owed_restriction_threshold"
          - "certification_status != LAPSED"
          - "sentinel_event_count == 0"
        side_effects:
          - "sets dispatch_privilege = FULL"

  - entity: HighRiskCaseReview
    initial_state: PENDING
    terminal_states: [CLOSED]
    note: |
      Branching fork-join: DACPR_SCORED forks into SENTINEL_EVENT or COACHING_ONLY with disjoint
      side-effect sets, and both branches rejoin at CLOSED when the parent Review is finalized.
    transitions:
      - from: PENDING
        to: DACPR_SCORED
        trigger: "POST /high-risk-reviews/{id}/score-dacpr"
        actor: QaReviewer
        preconditions:
          - "hrcr.status == PENDING"
          - "the parent Review.status in {SELECTED, SCORED}"
        side_effects:
          - "stores the five DA-CPR observations, computes compression_compliant, dacpr_index (calculations.dacpr_performance_index) and dacpr_pass"
          - "increments HighRiskCaseReview.version by 1"
      - from: DACPR_SCORED
        to: SENTINEL_EVENT
        trigger: "POST /high-risk-reviews/{id}/sign-off with classification == SENTINEL_EVENT"
        actor: MedicalDirector
        preconditions:
          - "hrcr.status == DACPR_SCORED"
          - "payload.classification == SENTINEL_EVENT"
        side_effects:
          - "sets classification, signed_off_by_user_id, signed_off_at"
          - "branch-exclusive: calculations.auto_coaching_plan_upsert creates or upgrades a CRITICAL AUTO CoachingPlan (8.0 hours, focus_area DACPR) keyed (dispatcher_id, review_id)"
          - "branch-exclusive: recomputes Dispatcher.sentinel_event_count and AuditProgram.sentinel_event_count"
          - "because both the hours ledger and sentinel count changed, Dispatcher.remediation_hours_owed and dispatch_privilege are re-derived"
      - from: DACPR_SCORED
        to: COACHING_ONLY
        trigger: "POST /high-risk-reviews/{id}/sign-off with classification == COACHING_ONLY"
        actor: MedicalDirector
        preconditions:
          - "hrcr.status == DACPR_SCORED"
          - "payload.classification == COACHING_ONLY"
          - "hrcr.dacpr_index >= SENTINEL_INDEX_FLOOR (50.0) — below the floor the classification must be SENTINEL_EVENT"
        side_effects:
          - "sets classification, signed_off_by_user_id, signed_off_at"
          - "branch-exclusive: an ADVISORY AUTO CoachingPlan (2.0 hours, focus_area DACPR) is upserted only when dacpr_pass == false; when dacpr_pass == true no plan is created"
          - "branch-exclusive: sentinel counters are NOT touched and dispatch_privilege is unaffected by this branch"
      - from: SENTINEL_EVENT
        to: CLOSED
        trigger: "system — the parent Review is finalized"
        actor: system
        preconditions:
          - "parent Review.status transitions to FINALIZED"
        side_effects:
          - "sets status CLOSED (fork-join rejoin); no further clinical edits are accepted"
      - from: COACHING_ONLY
        to: CLOSED
        trigger: "system — the parent Review is finalized"
        actor: system
        preconditions:
          - "parent Review.status transitions to FINALIZED"
        side_effects:
          - "sets status CLOSED (fork-join rejoin)"

  - entity: CoachingPlan
    initial_state: ASSIGNED
    terminal_states: [CANCELLED]
    note: |
      Cyclic: IN_PROGRESS -> VERIFIED -> IN_PROGRESS whenever a completed session is cancelled and
      credited_hours falls back below required_hours. SUSPENDED is entered and left by certification
      cascades.
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /coaching-plans/{id}/retraining-sessions"
        actor: QaSupervisor
        preconditions:
          - "plan.status == ASSIGNED"
        side_effects:
          - "creates the RetrainingSession and sets plan.status = IN_PROGRESS; increments CoachingPlan.version"
      - from: IN_PROGRESS
        to: VERIFIED
        trigger: "system — POST /retraining-sessions/{id}/complete brings credited_hours to required_hours"
        actor: system
        preconditions:
          - "plan.credited_hours >= plan.required_hours after the completion (exactly equal is enough)"
        side_effects:
          - "sets status VERIFIED and verified_at = logical clock"
          - "because the plan left the open set, Dispatcher.remediation_hours_owed is recomputed and dispatch_privilege is re-derived"
      - from: VERIFIED
        to: IN_PROGRESS
        trigger: "system — POST /retraining-sessions/{id}/cancel removes credit from a VERIFIED plan"
        actor: system
        preconditions:
          - "plan.credited_hours < plan.required_hours after the cancellation"
        side_effects:
          - "sets status IN_PROGRESS and verified_at = null (compensating: the hours ledger returns to its pre-completion value exactly)"
          - "recomputes Dispatcher.remediation_hours_owed and re-derives dispatch_privilege"
      - from: ASSIGNED
        to: SUSPENDED
        trigger: "system — CASCADE B link 4, when the dispatcher's certification lapses"
        actor: system
        preconditions:
          - "plan.status == ASSIGNED"
          - "dispatcher.certification_status just became LAPSED"
        side_effects:
          - "sets status SUSPENDED; the plan's unmet hours stay in remediation_hours_owed"
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "system — CASCADE B link 4, when the dispatcher's certification lapses"
        actor: system
        preconditions:
          - "plan.status == IN_PROGRESS"
          - "dispatcher.certification_status just became LAPSED"
        side_effects:
          - "sets status SUSPENDED; no session may be scheduled or completed while suspended"
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "system — re-certification of the dispatcher on the newer version"
        actor: system
        preconditions:
          - "plan.credited_hours > 0.00"
        side_effects:
          - "sets status IN_PROGRESS"
      - from: SUSPENDED
        to: ASSIGNED
        trigger: "system — re-certification of the dispatcher on the newer version"
        actor: system
        preconditions:
          - "plan.credited_hours == 0.00"
        side_effects:
          - "sets status ASSIGNED"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system — CASCADE D link 3 (source review voided) or supersede by a MANUAL plan"
        actor: system
        preconditions:
          - "plan.status == ASSIGNED"
        side_effects:
          - "sets status CANCELLED and closure_reason (SOURCE_VOIDED or SUPERSEDED)"
          - "recomputes Dispatcher.remediation_hours_owed and re-derives dispatch_privilege"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system — CASCADE D link 3 (source review voided) or supersede by a MANUAL plan"
        actor: system
        preconditions:
          - "plan.status == IN_PROGRESS"
        side_effects:
          - "sets status CANCELLED and closure_reason; SCHEDULED sessions on the plan are left untouched but can no longer be completed"
          - "recomputes Dispatcher.remediation_hours_owed and re-derives dispatch_privilege"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "system — supersede by a MANUAL plan for the same dispatcher"
        actor: system
        preconditions:
          - "plan.status == SUSPENDED"
        side_effects:
          - "sets status CANCELLED and closure_reason = SUPERSEDED"
          - "recomputes Dispatcher.remediation_hours_owed and re-derives dispatch_privilege"

  - entity: RetrainingSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /retraining-sessions/{id}/complete"
        actor: QaSupervisor
        preconditions:
          - "session.status == SCHEDULED"
          - "session.coaching_plan.status in {ASSIGNED, IN_PROGRESS}"
          - "payload.attendance_confirmed == true"
          - "logical clock >= session.ends_at"
        side_effects:
          - "sets status COMPLETED, completed_at = logical clock; increments RetrainingSession.version"
          - "credits duration_hours to plan.credited_hours; the plan may bubble up to VERIFIED"
          - "recomputes Dispatcher.remediation_hours_owed and re-derives dispatch_privilege"
      - from: COMPLETED
        to: CANCELLED
        trigger: "POST /retraining-sessions/{id}/cancel"
        actor: QaSupervisor
        preconditions:
          - "session.status == COMPLETED"
        side_effects:
          - "sets status CANCELLED and cancel_reason; completed_at is cleared to null"
          - "removes duration_hours from plan.credited_hours (compensating action); a VERIFIED plan reverts to IN_PROGRESS"
          - "recomputes Dispatcher.remediation_hours_owed and re-derives dispatch_privilege"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /retraining-sessions/{id}/cancel"
        actor: QaSupervisor
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "sets status CANCELLED and cancel_reason; credited_hours was never incremented so no ledger change occurs"
          - "the cancelled window is released and no longer participates in buffered overlap detection"

  - entity: AccreditationReport
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation-reports/{id}/submit"
        actor: AccreditationOfficer
        preconditions:
          - "report.status == DRAFT"
        side_effects:
          - "CASCADE C link 1 — sets status SUBMITTED, submitted_to = payload.submitted_to, submitted_at = logical clock; increments AccreditationReport.version"
          - "CASCADE C link 2 — because a report is now SUBMITTED, AuditProgram.submitted_report_count, latest_compliance_pct and accreditation_status are recomputed, and every CLOSED SamplingPeriod whose window overlaps the report window transitions CLOSED -> LOCKED"
          - "CASCADE C links 3-4 — because those periods are LOCKED, their reviews still in status SELECTED are VOIDED with void_reason = PERIOD_LOCKED and the underlying calls return to INGESTED; SCORED and DISPUTED reviews are frozen instead of voided"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================

concurrency_rules:
  - rule_id: score-sheet-supersede-stale-review
    parent_entity: Review
    write_endpoint: "POST /reviews/{id}/scores"
    occ_field: "expected_review_version"
    description: |
      Submitting a score sheet against a Review whose version has advanced since the client last
      read it is rejected. Re-scoring is legitimately repeatable — a second sheet supersedes the
      previous one as the current sheet under state_machines.Review.SCORED_to_SCORED — so the write
      cannot be rejected by any state precondition; the stale-version check is what protects the
      reviewer from overwriting a sheet, a rebuttal decision, or a cascade they never observed.
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412

  - rule_id: coaching-plan-create-stale-dispatcher
    parent_entity: Dispatcher
    write_endpoint: "POST /coaching-plans"
    occ_field: "expected_dispatcher_version"
    description: |
      Creating a MANUAL CoachingPlan against a Dispatcher whose version has advanced since the
      client last read it is rejected. A MANUAL plan legitimately supersedes the dispatcher's other
      open plans (cancelling them with closure_reason = SUPERSEDED), so the operation stays valid on
      repetition and no state precondition can catch a writer working from a stale view of the
      dispatcher's ledgers.
    error_id: ERR_STALE_DISPATCHER_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules
# ============================================================================

calculations:
  - name: determinant_code_decoding
    trigger: "on POST /dispatchers/{id}/call-records (dispatched_determinant_code) and on POST /reviews/{id}/scores (reviewer_determinant_code)"
    algorithm: threshold
    formula: |
      # A determinant code has the shape <chief_complaint>-<level>-<suffix>, e.g. "9-E-1".
      # Only the middle level letter carries dispatch semantics.
      level = the single character between the first and second hyphen
      priority_rank = PRIORITY_RANK[level]        # O=1, A=2, B=3, C=4, D=5, E=6
      response_mode = "HOT" if level in {"D", "E"} else "COLD"
      resource      = "ALS" if level in {"C", "D", "E"} else "BLS"
      # priority_rank orders codes by clinical acuity: rank 6 (E, ECHO) is the most acute.
    input_set: "the single code string on the row being written; no other entity participates"
    constants:
      PRIORITY_RANK: { O: 1, A: 2, B: 3, C: 4, D: 5, E: 6 }
      HOT_LEVELS: [D, E]
      ALS_LEVELS: [C, D, E]
    precision: "integer ranks; enum strings for mode and resource"

  - name: determinant_accuracy_classification
    trigger: "on POST /reviews/{id}/scores, comparing the reviewer's code to CallRecord.dispatched_determinant_code"
    algorithm: threshold
    formula: |
      d = CallRecord.dispatched_determinant_code            # what the dispatcher assigned live
      r = ScoreSheet.reviewer_determinant_code              # what the QA reviewer determined was correct
      d_rank, d_mode, d_res = determinant_code_decoding(d)
      r_rank, r_mode, r_res = determinant_code_decoding(r)
      response_mode_deviation = (r_mode != d_mode)
      resource_deviation      = (r_res  != d_res)
      if r == d:
          determinant_accuracy = "ACCURATE"
      elif not response_mode_deviation and not resource_deviation:
          # different code, but the dispatch consequences were identical
          determinant_accuracy = "MINOR_MISCODE"
      elif r_rank > d_rank:
          # the correct code was MORE acute than the one dispatched: the call was under-triaged
          determinant_accuracy = "UNDER_TRIAGE"
      else:
          # r_rank < d_rank with a deviation: the call was sent hotter/heavier than needed
          determinant_accuracy = "OVER_TRIAGE"
    input_set: "exactly two code strings: the review's CallRecord.dispatched_determinant_code and the current ScoreSheet.reviewer_determinant_code"
    constants:
      ACCURACY_CLASSES: [ACCURATE, MINOR_MISCODE, OVER_TRIAGE, UNDER_TRIAGE]
    precision: "enum string; no arithmetic"

  - name: review_composite_score
    trigger: "variant section_unweighted_mean on POST /reviews/{id}/scores (writes ScoreSheet.provisional_composite_score and Review.provisional_composite_score); variant accreditation_weighted_composite on POST /reviews/{id}/finalize (writes Review.pre_penalty_composite_score)"
    algorithm: weighted_scoring
    formula: |
      # Step 1 — per-section percentage, ALWAYS rounded to 2 dp before any aggregation.
      # This rounding order is pinned: round each section first, then combine. Summing raw
      # fractions and rounding once at the end produces a different final score.
      for s in [case_entry, key_questions, pre_arrival, final_coding]:
          if s.points_possible == 0:
              s.pct = 100.00                      # a section that does not apply to this call type
          else:                                   # (e.g. no pre-arrival instructions indicated)
              s.pct = round_half_up(100 * s.points_earned / s.points_possible, 2)

      # Step 2 — combine the four rounded section percentages, then round to 1 dp.
      # VARIANT section_unweighted_mean (provisional, reviewer-facing):
      raw = (case_entry.pct + key_questions.pct + pre_arrival.pct + final_coding.pct) / 4
      provisional_composite_score = round_half_up(raw, 1)

      # VARIANT accreditation_weighted_composite (final, accreditation-facing):
      w = the ProtocolVersion pinned on the Review (Review.protocol_version_id)
      raw = (case_entry.pct    * w.case_entry_weight
           + key_questions.pct * w.key_questions_weight
           + pre_arrival.pct   * w.pre_arrival_weight
           + final_coding.pct  * w.final_coding_weight)
      pre_penalty_composite_score = round_half_up(raw, 1)
    input_set: "the four (points_earned, points_possible) pairs on the Review's CURRENT ScoreSheet — the one whose sheet_round == Review.current_sheet_round; superseded sheets are excluded. Weights come from the ProtocolVersion pinned at selection time, not from the program's currently ACTIVE version."
    constants:
      SECTION_PCT_DP: 2
      COMPOSITE_DP: 1
      ROUNDING: round_half_up
      NA_SECTION_PCT: 100.00
    precision: "section percentages 2 dp round_half_up; composite scores 1 dp round_half_up; the section rounding happens BEFORE the weighted sum"
    variants:
      - name: section_unweighted_mean
        when: "on every score submission — the provisional score shown to the reviewer and the dispatcher during the rebuttal window"
        difference: "each of the four sections contributes exactly 1/4, regardless of the pinned ProtocolVersion's weights; no determinant penalty is applied"
      - name: accreditation_weighted_composite
        when: "on finalization — the score that enters the dispatcher ledger and every accreditation report"
        difference: "sections are weighted by the pinned ProtocolVersion's four weight fields (default 0.20 / 0.35 / 0.30 / 0.15), so key-question and pre-arrival failures dominate; the result is then reduced by determinant_accuracy_penalty"

  - name: determinant_accuracy_penalty
    trigger: "on POST /reviews/{id}/finalize, immediately after review_composite_score variant accreditation_weighted_composite has written pre_penalty_composite_score"
    algorithm: tiered_pricing
    formula: |
      # The evaluation order below is pinned and is NOT interchangeable: the tier multiplier is
      # selected from the PRE-penalty score, and the penalty is then subtracted from that same
      # pre-penalty score. Selecting the tier from the post-penalty score (or subtracting before
      # tiering) yields a different final_composite_score for the same inputs.
      base = PENALTY_BASE[determinant_accuracy]            # ACCURATE 0.0 .. UNDER_TRIAGE 10.0

      if   pre_penalty_composite_score >= HIGH_TIER_FLOOR:  tier = "HIGH"   # >= 90.0
      elif pre_penalty_composite_score >= MID_TIER_FLOOR:   tier = "MID"    # >= 75.0
      else:                                                 tier = "LOW"

      penalty_points = round_half_up(base * TIER_MULTIPLIER[tier], 1)
      final_composite_score = round_half_up(
          max(SCORE_FLOOR, pre_penalty_composite_score - penalty_points), 1)
      compliant = (final_composite_score >= program.target_compliance_pct)
    input_set: "the Review's own pre_penalty_composite_score and determinant_accuracy, plus AuditProgram.target_compliance_pct reached through SamplingPeriod.program_id"
    constants:
      PENALTY_BASE: { ACCURATE: 0.0, MINOR_MISCODE: 2.0, OVER_TRIAGE: 5.0, UNDER_TRIAGE: 10.0 }
      TIER_MULTIPLIER: { HIGH: 1.5, MID: 1.0, LOW: 0.5 }
      HIGH_TIER_FLOOR: 90.0
      MID_TIER_FLOOR: 75.0
      SCORE_FLOOR: 0.0
    precision: "penalty_points and final_composite_score 1 dp round_half_up; the tier is chosen from the pre-penalty score, never from the post-penalty score"

  - name: dacpr_performance_index
    trigger: "on POST /high-risk-reviews/{id}/score-dacpr"
    algorithm: weighted_scoring
    formula: |
      if cardiac_arrest_recognized == false:
          compression_compliant = false
          dacpr_index = 0.0                    # nothing downstream can earn credit
          dacpr_pass  = false
          return

      # (1) recognition sub-score — degrades linearly to zero at the 90 s limit
      recognition_sub = 100.0 * max(0, RECOGNITION_LIMIT_SEC - recognition_time_sec)
                              / RECOGNITION_LIMIT_SEC

      # (2) compression sub-score — no credit is lost inside the 30 s floor, then degrades
      #     linearly to zero at the 120 s limit
      t = time_to_first_compression_sec
      compression_compliant = (t <= COMPRESSION_LIMIT_SEC)
      span = COMPRESSION_LIMIT_SEC - COMPRESSION_FLOOR_SEC          # 90
      compression_sub = 100.0 * min(span, max(0, COMPRESSION_LIMIT_SEC - t)) / span

      # (3) instruction sub-score — delivery and coaching are separate observations
      instruction_sub = (60.0 if dacpr_instructions_delivered else 0.0) \
                      + (40.0 if compressions_coached else 0.0)

      # (4) weights depend on whether a bystander was already compressing when the call landed:
      #     when CPR is already in progress the dispatcher's recognition speed matters more and
      #     the time-to-first-compression matters less.
      w = BYSTANDER_WEIGHTS if CallRecord.bystander_cpr_in_progress else SOLO_WEIGHTS

      raw = (recognition_sub  * w.recognition
           + compression_sub  * w.compression
           + instruction_sub  * w.instruction) / 100.0
      dacpr_index = round_half_up(raw, 1)

      # (5) a late first compression caps the index no matter how good the rest was
      if compression_compliant == false:
          dacpr_index = min(dacpr_index, LATE_COMPRESSION_CAP)

      dacpr_pass = (dacpr_index >= HIGH_RISK_PASS_INDEX)
    input_set: "the five observations stored on this HighRiskCaseReview plus CallRecord.bystander_cpr_in_progress reached through Review.call_record_id"
    constants:
      RECOGNITION_LIMIT_SEC: 90
      COMPRESSION_LIMIT_SEC: 120
      COMPRESSION_FLOOR_SEC: 30
      SOLO_WEIGHTS: { recognition: 40, compression: 45, instruction: 15 }
      BYSTANDER_WEIGHTS: { recognition: 55, compression: 30, instruction: 15 }
      INSTRUCTION_DELIVERED_POINTS: 60.0
      COMPRESSION_COACHED_POINTS: 40.0
      LATE_COMPRESSION_CAP: 50.0
      HIGH_RISK_PASS_INDEX: 75.0
      SENTINEL_INDEX_FLOOR: 50.0
    precision: "sub-scores kept unrounded; dacpr_index 1 dp round_half_up, then the late-compression cap is applied to the rounded value"

  - name: dispatcher_compliance_rollup
    trigger: "on POST /reviews/{id}/finalize and on POST /reviews/{id}/void (full recompute, never an incremental delta)"
    algorithm: aggregation
    formula: |
      pool = Reviews where dispatcher_id == this dispatcher AND status == FINALIZED
      reviewed_case_count    = count(pool)
      compliance_points_total = round_half_up(sum(r.final_composite_score for r in pool), 1)
      if reviewed_case_count == 0:
          compliance_pct = null
          compliance_posture = "UNRATED"
      else:
          compliance_pct = round_half_up(compliance_points_total / reviewed_case_count, 1)
          if   compliance_pct >= program.target_compliance_pct: compliance_posture = "GOOD"
          elif compliance_pct >= program.watch_floor_pct:       compliance_posture = "WATCH"
          else:                                                 compliance_posture = "PROBATION"
      sentinel_event_count = count(HighRiskCaseReview h where
          h.review.dispatcher_id == this dispatcher
          AND h.review.status != "VOIDED"
          AND h.classification == "SENTINEL_EVENT")
      # Sentinel counting deliberately does NOT wait for finalization: a signed-off sentinel event
      # restricts the dispatcher immediately. Only voiding the underlying review removes it.
    input_set: "compliance figures use only Reviews in status FINALIZED (SELECTED / SCORED / DISPUTED / VOIDED reviews are excluded); sentinel counting instead uses every HighRiskCaseReview classified SENTINEL_EVENT whose Review is not VOIDED, so a sentinel event counts from sign-off onward"
    constants:
      POINTS_DP: 1
      PCT_DP: 1
    precision: "compliance_points_total and compliance_pct 1 dp round_half_up; compliance_pct is null (not 0.0) when reviewed_case_count == 0, and the posture is then UNRATED"

  - name: dispatch_privilege_derivation
    trigger: "after every recomputation of Dispatcher.remediation_hours_owed, Dispatcher.certification_status, or Dispatcher.sentinel_event_count"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top-down; the first matching clause wins.
      if   sentinel_event_count >= SUSPENSION_SENTINEL_COUNT:        dispatch_privilege = "SUSPENDED"
      elif remediation_hours_owed > program.hours_owed_restriction_threshold:
                                                                     dispatch_privilege = "RESTRICTED"
      elif certification_status == "LAPSED":                         dispatch_privilege = "RESTRICTED"
      elif sentinel_event_count >= 1:                                dispatch_privilege = "RESTRICTED"
      else:                                                          dispatch_privilege = "FULL"
    input_set: "three fields of the single Dispatcher row plus AuditProgram.hours_owed_restriction_threshold"
    constants:
      SUSPENSION_SENTINEL_COUNT: 2
    precision: "enum string; the hours comparison is strictly greater-than, so owed exactly equal to the threshold leaves the dispatcher FULL"

  - name: remediation_hours_ledger
    trigger: "on POST /reviews/{id}/finalize, POST /reviews/{id}/void, POST /high-risk-reviews/{id}/sign-off, POST /coaching-plans, POST /retraining-sessions/{id}/complete, POST /retraining-sessions/{id}/cancel, and POST /dispatchers/{id}/certify"
    algorithm: aggregation
    formula: |
      open_plans = CoachingPlans where dispatcher_id == this dispatcher
                   AND status in {ASSIGNED, IN_PROGRESS, SUSPENDED}
      remediation_hours_owed = round_half_up(
          sum(max(0.00, p.required_hours - p.credited_hours) for p in open_plans), 2)
      # VERIFIED and CANCELLED plans contribute nothing. Over-credit on one plan never offsets
      # another plan's shortfall, because each term is floored at 0.00 before summation.
    input_set: "CoachingPlans of this dispatcher in status ASSIGNED, IN_PROGRESS or SUSPENDED; VERIFIED and CANCELLED plans are excluded"
    constants:
      HOURS_DP: 2
      PER_PLAN_FLOOR: 0.00
    precision: "2 dp round_half_up, per-plan shortfall floored at 0.00 before summation"

  - name: coaching_plan_credited_hours
    trigger: "on POST /retraining-sessions/{id}/complete (add) and POST /retraining-sessions/{id}/cancel (remove)"
    algorithm: aggregation
    formula: |
      credited_hours = round_half_up(
          sum(s.duration_hours for s in RetrainingSessions
              where s.coaching_plan_id == plan.id AND s.status == "COMPLETED"), 2)
      # Full recompute over the COMPLETED set, so cancelling a completed session returns the
      # ledger to exactly its pre-completion value with no drift.
    input_set: "RetrainingSessions of the plan whose status == COMPLETED; SCHEDULED and CANCELLED sessions are excluded"
    constants:
      HOURS_DP: 2
    precision: "2 dp round_half_up"

  - name: session_duration_hours
    trigger: "on POST /coaching-plans/{id}/retraining-sessions"
    algorithm: aggregation
    formula: |
      duration_hours = round_half_up((ends_at - starts_at) in seconds / 3600.0, 2)
    input_set: "the two timestamps on the session row"
    constants:
      SECONDS_PER_HOUR: 3600
      HOURS_DP: 2
    precision: "2 dp round_half_up"

  - name: auto_coaching_plan_upsert
    trigger: "on POST /reviews/{id}/finalize (from the review's posture and determinant accuracy) and on POST /high-risk-reviews/{id}/sign-off (from the classification and DA-CPR result)"
    algorithm: waterfall_allocation
    formula: |
      # Severity is selected by the first matching clause; the clauses are ordered most-severe first.
      if determinant_accuracy == "UNDER_TRIAGE" or hrcr.classification == "SENTINEL_EVENT":
          severity, focus = "CRITICAL", ("DETERMINANT_CODING" if determinant_accuracy == "UNDER_TRIAGE" else "DACPR")
      elif dispatcher.compliance_posture == "PROBATION":
          severity, focus = "STANDARD", weakest_section_focus
      elif dispatcher.compliance_posture == "WATCH":
          severity, focus = "ADVISORY", weakest_section_focus
      elif hrcr.classification == "COACHING_ONLY" and hrcr.dacpr_pass == false:
          severity, focus = "ADVISORY", "DACPR"
      else:
          return                                      # no plan is created

      # weakest_section_focus: of the current ScoreSheet's four section percentages, the LOWEST;
      # tie-break by the fixed section order case_entry, key_questions, pre_arrival, final_coding,
      # mapping to CASE_ENTRY, KEY_QUESTIONS, PRE_ARRIVAL_INSTRUCTIONS, FINAL_CODING.

      # Upsert keyed on (dispatcher_id, source_review_id). At most one AUTO plan exists per key.
      existing = CoachingPlan where dispatcher_id == d.id AND source_review_id == review.id
                 AND origin == "AUTO" AND status in {ASSIGNED, IN_PROGRESS, SUSPENDED, VERIFIED}
      if existing is null:
          create CoachingPlan(origin="AUTO", severity=severity, severity_rank=SEVERITY_RANK[severity],
                              focus_area=focus, required_hours=REQUIRED_HOURS[severity],
                              credited_hours=0.00, status="ASSIGNED",
                              due_at = clock + AUTO_PLAN_DUE_DAYS days)
      elif SEVERITY_RANK[severity] > existing.severity_rank:
          # ratchet upward only: severity, severity_rank, focus_area and required_hours are raised;
          # credited_hours, status and due_at are preserved
          existing.severity, existing.severity_rank = severity, SEVERITY_RANK[severity]
          existing.focus_area, existing.required_hours = focus, REQUIRED_HOURS[severity]
      # else: the existing plan already carries equal or higher severity — nothing changes
    input_set: "the finalized Review's determinant_accuracy and current ScoreSheet section percentages, the Dispatcher's freshly recomputed compliance_posture, and (on sign-off) the HighRiskCaseReview classification / dacpr_pass"
    constants:
      SEVERITY_RANK: { ADVISORY: 1, STANDARD: 2, CRITICAL: 3 }
      REQUIRED_HOURS: { ADVISORY: 2.0, STANDARD: 4.0, CRITICAL: 8.0 }
      AUTO_PLAN_DUE_DAYS: 30
    precision: "required_hours 1 dp as declared; severity_rank integer; the upsert never lowers severity_rank"

  - name: accreditation_compliance_percentage
    trigger: "on POST /audit-programs/{id}/accreditation-reports"
    algorithm: aggregation
    formula: |
      pool = Reviews r where r.status == "FINALIZED"
             AND r.dispatcher.program_id == program.id
             AND window_start <= r.finalized_at < window_end        # half-open
      if pool is empty: reject with ERR_NO_FINALIZED_REVIEWS_IN_WINDOW

      review_count           = count(pool)
      compliant_review_count = count(r in pool where r.compliant == true)
      dispatcher_count       = count(distinct r.dispatcher_id for r in pool)

      # VARIANT case_weighted — every reviewed case counts once, so a dispatcher with many
      # sampled calls dominates the program figure.
      compliance_pct = round_half_up(100.0 * compliant_review_count / review_count, 1)

      # VARIANT dispatcher_equal_weight — each dispatcher's own compliant-rate is computed
      # UNROUNDED, and the program figure is the plain mean of those rates, rounded once at
      # the end. Every dispatcher counts equally regardless of how many of their calls were
      # sampled, which can invert the verdict relative to case_weighted (Simpson's paradox).
      per_dispatcher = [ count(compliant of d) / count(all of d) for d in distinct dispatchers ]
      compliance_pct = round_half_up(100.0 * sum(per_dispatcher) / dispatcher_count, 1)

      # High-risk sub-figure — identical in both variants.
      hr_pool = [ r in pool where r.high_risk == true ]
      high_risk_review_count = count(hr_pool)
      high_risk_pass_count   = count(h.dacpr_pass == true for the HighRiskCaseReview of r in hr_pool)
      high_risk_compliance_pct = null if high_risk_review_count == 0
                                 else round_half_up(100.0 * high_risk_pass_count / high_risk_review_count, 1)
      threshold_met = (compliance_pct >= program.target_compliance_pct)
                      AND (high_risk_compliance_pct is null
                           OR high_risk_compliance_pct >= program.high_risk_target_pct)
    input_set: "Reviews in status FINALIZED whose finalized_at falls in the half-open window [window_start, window_end) and whose dispatcher belongs to this program; VOIDED reviews are excluded even when they were finalized earlier in the window"
    constants:
      PCT_DP: 1
      ROUNDING: round_half_up
    precision: "1 dp round_half_up; in dispatcher_equal_weight the per-dispatcher rates stay unrounded and only the final mean is rounded"
    variants:
      - name: case_weighted
        when: "variant == CASE_WEIGHTED — the figure the accrediting body audits"
        difference: "one vote per finalized review, so the program percentage is compliant_review_count / review_count"
      - name: dispatcher_equal_weight
        when: "variant == DISPATCHER_EQUAL_WEIGHT — the figure the oversight committee reviews for staffing equity"
        difference: "one vote per dispatcher: each dispatcher's unrounded compliant-rate is averaged, so a heavily-sampled weak dispatcher no longer dominates and threshold_met can flip relative to case_weighted on identical data"

  - name: program_accreditation_status
    trigger: "on POST /accreditation-reports/{id}/submit"
    algorithm: threshold
    formula: |
      submitted = AccreditationReports of the program where status == "SUBMITTED"
      submitted_report_count = count(submitted)
      if submitted_report_count == 0:
          latest_compliance_pct = null
          accreditation_status  = "SETUP"
      else:
          latest = the submitted report with the greatest window_end,
                   tie-broken by the greatest created_at, then by the greatest submitted_at
          latest_compliance_pct = latest.compliance_pct
          accreditation_status  = "ACCREDITED" if latest.threshold_met else "AT_RISK"
      sentinel_event_count = count(HighRiskCaseReview h where h.classification == "SENTINEL_EVENT"
                                   AND h.review.status != "VOIDED"
                                   AND h.review.dispatcher.program_id == program.id)
    input_set: "AccreditationReports of the program in status SUBMITTED (DRAFT reports are excluded); the selector is greatest window_end, tie-broken by greatest created_at then greatest submitted_at — never by id"
    constants:
      INITIAL_STATUS: SETUP
    precision: "latest_compliance_pct copied verbatim from the winning report (already 1 dp)"

  - name: protocol_version_pinning
    trigger: "on POST /sampling-periods/{id}/draw-random-sample and POST /sampling-periods/{id}/target-review, for every Review created"
    algorithm: interval_merge
    formula: |
      candidates = ProtocolVersions v where
          v.program_id == period.program_id
          AND v.protocol_family == "MPDS_CARDSET"
          AND v.status in {APPROVED, ACTIVE, SUPERSEDED}
          AND v.effective_from <= call_record.received_at
          AND (v.effective_to is null OR call_record.received_at < v.effective_to)   # half-open
      if candidates is empty: reject with ERR_NO_PROTOCOL_VERSION_IN_FORCE
      # §1.4 priority 60 guarantees the family's approved windows never overlap, so at most one
      # candidate can match; the pinned version is that single row.
      Review.protocol_version_id = the single candidate
    input_set: "ProtocolVersions of the period's program in the MPDS_CARDSET family with status in {APPROVED, ACTIVE, SUPERSEDED}; DRAFT versions never pin"
    constants:
      PINNING_FAMILY: MPDS_CARDSET
    precision: "half-open interval containment on CallRecord.received_at; the pin is frozen at selection time and is never re-pointed when a newer version later goes live"

  - name: systematic_sample_selection
    trigger: "on POST /sampling-periods/{id}/draw-random-sample"
    algorithm: chronological
    formula: |
      # A deterministic systematic draw — the audit standard's "random" sample, reproducible for
      # the accrediting body. No random number generator and no id-based ordering participate.
      pool = CallRecords c where
          c.dispatcher.program_id == period.program_id
          AND c.call_type == period.call_type
          AND c.status == "INGESTED"
          AND period.period_start <= c.received_at < period.period_end        # half-open
          AND c.dispatcher.dispatch_privilege != "SUSPENDED"
      pool = pool ordered by (received_at ASC, call_reference ASC)   # call_reference is globally unique
      if pool is empty: reject with ERR_NO_ELIGIBLE_CALLS

      remaining_quota = period.target_sample_count - period.selected_review_count
      if remaining_quota <= 0: reject with ERR_SAMPLE_QUOTA_FILLED
      n = min(requested_count, remaining_quota, len(pool))
      k = max(1, floor(len(pool) / requested_count))                # sampling interval
      indices = [ (i * k) for i in 0.. while (i * k) < len(pool) ][:n]
      # When the stride runs off the end before n items are collected, the remainder is taken
      # from the still-unselected head of the ordered pool in the same (received_at, call_reference)
      # order, so exactly n reviews are always created when len(pool) >= n.
      for each selected call: create Review(selection_mode="RANDOM",
                                           selection_reason="SYSTEMATIC_DRAW",
                                           high_risk = (call.call_type == "CARDIAC_ARREST"),
                                           protocol_version_id = protocol_version_pinning(call),
                                           status="SELECTED")
                              and set call.status = "SELECTED"
      period.selected_review_count += n
    input_set: "CallRecords in status INGESTED of the period's program and call_type whose received_at lies in the half-open period window, excluding calls of dispatchers whose dispatch_privilege == SUSPENDED"
    constants:
      MIN_STRIDE: 1
      HIGH_RISK_CALL_TYPES: [CARDIAC_ARREST]
    precision: "integer arithmetic; ordering is (received_at ASC, call_reference ASC) and the stride is floor(pool_size / requested_count) with a floor of 1"

  - name: rollout_training_rollup
    trigger: "on POST /dispatchers/{id}/certify and on the CASCADE B certification-lapse sweep"
    algorithm: aggregation
    formula: |
      trained_dispatcher_count = count(Dispatcher d where
          d.certified_protocol_version_id == rollout.protocol_version_id
          AND d.certification_status == "CERTIFIED")
      if   trained_dispatcher_count == 0:                                training_status = "NOT_STARTED"
      elif trained_dispatcher_count >= rollout.target_dispatcher_count:  training_status = "COMPLETE"
      else:                                                             training_status = "IN_PROGRESS"
    input_set: "Dispatchers whose certified_protocol_version_id equals the rollout's version AND whose certification_status == CERTIFIED; PROVISIONAL and LAPSED dispatchers are excluded"
    constants:
      NOT_STARTED_COUNT: 0
    precision: "integer count; the COMPLETE comparison is >=, so hitting the target exactly is complete"

  - name: sampling_period_counters
    trigger: "on POST /sampling-periods/{id}/draw-random-sample, POST /sampling-periods/{id}/target-review, POST /reviews/{id}/finalize and POST /reviews/{id}/void"
    algorithm: aggregation
    formula: |
      selected_review_count  = count(Review r where r.sampling_period_id == period.id
                                     AND r.status in {SELECTED, SCORED, DISPUTED, FINALIZED})
      finalized_review_count = count(Review r where r.sampling_period_id == period.id
                                     AND r.status == "FINALIZED")
      # VOIDED reviews leave both counters, which is what returns a consumed sample slot to the
      # quota (sample-slot conservation).
    input_set: "Reviews of the period; VOIDED reviews are excluded from both counters"
    constants: {}
    precision: "integer counts, always a full recompute"

# ============================================================================
# §1.4 Validation Rules (evaluated in ascending priority; the first violated rule wins)
# ============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 10
    category: business_constraint
    check: "the request body parses, every required input field is present, every field has the declared type, every enum field carries a declared member, numeric fields are within range (points_earned >= 0, points_possible >= 0, points_earned <= points_possible, recognition_time_sec >= 0, time_to_first_compression_sec >= 0, target_sample_count >= 1, requested_count >= 1, target_dispatcher_count >= 1, required_training_hours > 0, hours thresholds >= 0), and every declared datetime parses as ISO-8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 12
    category: business_constraint
    check: "limit is an integer in [1, 200] and offset is an integer >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 14
    category: business_constraint
    check: "every determinant code matches ^[0-9]{1,2}-[OABCDE]-[0-9]{1,2}$ — a two-part-hyphenated code, a lowercase level letter, or a level letter outside {O,A,B,C,D,E} is rejected"
    error_id: ERR_INVALID_DETERMINANT_CODE
    http_status: 422
    applies_to: "POST /dispatchers/{id}/call-records, POST /reviews/{id}/scores"

  - priority: 16
    category: business_constraint
    check: "AuditProgram thresholds satisfy 0.0 < watch_floor_pct < target_compliance_pct <= 100.0 and 0.0 < high_risk_target_pct <= 100.0"
    error_id: ERR_INVALID_THRESHOLD_CONFIG
    http_status: 422
    applies_to: "POST /audit-programs"

  - priority: 18
    category: business_constraint
    check: "case_entry_weight + key_questions_weight + pre_arrival_weight + final_coding_weight == 1.0000 exactly at 4 dp, and each weight is >= 0.0000"
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /audit-programs/{id}/protocol-versions"

  - priority: 20
    category: existence
    check: "every id in the request path exists, validated left to right"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_PROTOCOL_VERSION_NOT_FOUND | ERR_ROLLOUT_NOT_FOUND | ERR_DISPATCHER_NOT_FOUND | ERR_SAMPLING_PERIOD_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_REBUTTAL_NOT_FOUND | ERR_HIGH_RISK_REVIEW_NOT_FOUND | ERR_COACHING_PLAN_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 22
    category: existence
    check: "every id supplied in the request body exists (program_id, protocol_version_id, dispatcher_id, call_record_id, source_review_id)"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_PROTOCOL_VERSION_NOT_FOUND | ERR_DISPATCHER_NOT_FOUND | ERR_CALL_RECORD_NOT_FOUND | ERR_REVIEW_NOT_FOUND"
    http_status: 404
    applies_to: "POST /dispatchers, POST /dispatchers/{id}/certify, POST /sampling-periods/{id}/target-review, POST /coaching-plans, POST /coaching-plans/{id}/retraining-sessions"

  - priority: 25
    category: auth
    check: "when the acting role is Dispatcher, X-User-ID equals the dispatcher_id of the Review being rebutted"
    error_id: ERR_NOT_CASE_OWNER
    http_status: 403
    applies_to: "POST /reviews/{id}/rebuttals"

  - priority: 30
    category: auth
    check: "the finalizing X-User-ID differs from the submitted_by_user_id of the Review's current ScoreSheet (segregation of duties: a reviewer may not finalize their own sheet)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reviews/{id}/finalize"

  - priority: 35
    category: state
    check: "expected_review_version equals Review.version"
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412
    applies_to: "POST /reviews/{id}/scores"

  - priority: 36
    category: state
    check: "expected_dispatcher_version equals Dispatcher.version"
    error_id: ERR_STALE_DISPATCHER_VERSION
    http_status: 412
    applies_to: "POST /coaching-plans"

  - priority: 40
    category: state
    check: "the target resource is in a state that permits the requested transition, per §1.2"
    error_id: "ERR_REVIEW_NOT_SCORABLE | ERR_REVIEW_NOT_DISPUTABLE | ERR_REVIEW_NOT_FINALIZABLE | ERR_REVIEW_ALREADY_VOIDED | ERR_PERIOD_NOT_OPEN | ERR_PERIOD_LOCKED | ERR_VERSION_NOT_APPROVABLE | ERR_ROLLOUT_NOT_LIVEABLE | ERR_HRCR_NOT_SCORABLE | ERR_HRCR_NOT_SIGNABLE | ERR_REBUTTAL_ALREADY_DECIDED | ERR_PLAN_NOT_OPEN | ERR_SESSION_NOT_CANCELLABLE | ERR_SESSION_NOT_COMPLETABLE | ERR_REPORT_ALREADY_SUBMITTED"
    http_status: 409
    applies_to: "all state-changing POST endpoints"

  - priority: 45
    category: business_referential
    check: "cross-aggregate scope agreement: a certified ProtocolVersion belongs to the dispatcher's program; a targeted CallRecord's dispatcher belongs to the period's program; a RetrainingSession's ProtocolVersion belongs to the dispatcher's program; a report window belongs to the program in the path"
    error_id: ERR_PROGRAM_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /dispatchers/{id}/certify, POST /sampling-periods/{id}/target-review, POST /coaching-plans/{id}/retraining-sessions"

  - priority: 46
    category: business_referential
    check: "a targeted CallRecord's call_type equals the SamplingPeriod's call_type"
    error_id: ERR_CALL_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /sampling-periods/{id}/target-review"

  - priority: 50
    category: business_referential
    check: "the referenced ProtocolVersion is usable for the requested purpose: status in {APPROVED, ACTIVE} to certify a dispatcher; status in {APPROVED, ACTIVE} to serve as a retraining curriculum; a version in force (status in {APPROVED, ACTIVE, SUPERSEDED} whose half-open window contains the call's received_at) must exist before a Review can be created"
    error_id: "ERR_VERSION_NOT_CERTIFIABLE | ERR_CURRICULUM_VERSION_NOT_TRAINABLE | ERR_NO_PROTOCOL_VERSION_IN_FORCE"
    http_status: 409
    applies_to: "POST /dispatchers/{id}/certify, POST /coaching-plans/{id}/retraining-sessions, POST /sampling-periods/{id}/draw-random-sample, POST /sampling-periods/{id}/target-review"

  - priority: 55
    category: business_safety
    check: "a high_risk Review cannot be finalized until its HighRiskCaseReview has been signed off (status in {SENTINEL_EVENT, COACHING_ONLY}); and a HighRiskCaseReview whose dacpr_index < SENTINEL_INDEX_FLOOR (50.0) cannot be signed off as COACHING_ONLY"
    error_id: "ERR_HIGH_RISK_SIGN_OFF_REQUIRED | ERR_SENTINEL_CLASSIFICATION_REQUIRED"
    http_status: 422
    applies_to: "POST /reviews/{id}/finalize, POST /high-risk-reviews/{id}/sign-off"

  - priority: 60
    category: business_constraint
    check: "resource-window exclusivity: a ProtocolVersion's [effective_from, effective_to) must not overlap the interval of any other version of the same (program_id, protocol_family) already in {APPROVED, ACTIVE, SUPERSEDED} — half-open, so touching endpoints are legal; and a RetrainingSession's [starts_at - BUFFER, ends_at + BUFFER] must not overlap another SCHEDULED or COMPLETED session of the same dispatcher, where BUFFER is 45 minutes and the comparison is closed, so back-to-back sessions DO collide"
    error_id: "ERR_PROTOCOL_WINDOW_OVERLAP | ERR_SESSION_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /protocol-versions/{id}/approve, POST /coaching-plans/{id}/retraining-sessions"

  - priority: 62
    category: business_temporal
    check: "the go-live window is open: the logical clock is at or after ProtocolRollout.scheduled_golive_at"
    error_id: ERR_GOLIVE_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /protocol-rollouts/{id}/go-live"

  - priority: 65
    category: business_temporal
    check: "temporal envelopes: a CallRecord's received_at is not after the logical clock; a targeted CallRecord's received_at lies in the period's half-open window; a rebuttal arrives no later than Review.scored_at + program.rebuttal_window_days; a finalization arrives no later than Review.created_at + program.review_deadline_days; ends_at > starts_at on a session; period_end > period_start; window_end > window_start on a report; effective_to is null or > effective_from"
    error_id: "ERR_CALL_RECEIVED_IN_FUTURE | ERR_CALL_OUTSIDE_PERIOD | ERR_REBUTTAL_WINDOW_CLOSED | ERR_REVIEW_DEADLINE_PASSED | ERR_INVALID_TIME_WINDOW | ERR_REPORT_WINDOW_INVALID"
    http_status: 422
    applies_to: "POST /dispatchers/{id}/call-records, POST /audit-programs/{id}/sampling-periods, POST /audit-programs/{id}/protocol-versions, POST /sampling-periods/{id}/target-review, POST /reviews/{id}/rebuttals, POST /reviews/{id}/finalize, POST /coaching-plans/{id}/retraining-sessions, POST /audit-programs/{id}/accreditation-reports"

  - priority: 70
    category: business_constraint
    check: "uniqueness and cardinality: call_reference is globally unique; employee_code is unique within a program; at most one HighRiskCaseReview per Review; at most one AUTO CoachingPlan per (dispatcher_id, source_review_id); a CallRecord already in status SELECTED cannot be targeted again; TARGETED selection is refused on a period whose sampling_mode == RANDOM and random draw is refused on a period whose sampling_mode == TARGETED; a Review's rebuttal_round_count must be below program.max_rebuttal_rounds"
    error_id: "ERR_DUPLICATE_CALL_REFERENCE | ERR_DUPLICATE_EMPLOYEE_CODE | ERR_DUPLICATE_HIGH_RISK_REVIEW | ERR_DUPLICATE_COACHING_PLAN | ERR_CALL_ALREADY_SELECTED | ERR_SAMPLING_MODE_MISMATCH | ERR_REBUTTAL_ROUNDS_EXHAUSTED"
    http_status: 409
    applies_to: "POST /dispatchers, POST /dispatchers/{id}/call-records, POST /sampling-periods/{id}/draw-random-sample, POST /sampling-periods/{id}/target-review, POST /reviews/{id}/rebuttals, POST /reviews/{id}/high-risk-reviews, POST /coaching-plans"

  - priority: 75
    category: business_fiscal
    check: "quota and readiness gates: a period's selected_review_count must be below target_sample_count before another case is selected, and at or above it before the period may close; a rollout's training_status must be COMPLETE before go-live; a period whose dispatcher under review has compliance_posture == PROBATION requires target_sample_count >= program.escalated_sample_floor before that period may be closed"
    error_id: "ERR_SAMPLE_QUOTA_FILLED | ERR_SAMPLE_QUOTA_NOT_MET | ERR_TRAINING_INCOMPLETE | ERR_ESCALATED_SAMPLING_REQUIRED"
    http_status: 422
    applies_to: "POST /sampling-periods/{id}/draw-random-sample, POST /sampling-periods/{id}/target-review, POST /sampling-periods/{id}/close, POST /protocol-rollouts/{id}/go-live"

  - priority: 80
    category: business_fiscal
    check: "aggregate source sets are non-empty: the systematic-draw candidate pool has at least one eligible CallRecord, and a report window contains at least one FINALIZED Review"
    error_id: "ERR_NO_ELIGIBLE_CALLS | ERR_NO_FINALIZED_REVIEWS_IN_WINDOW"
    http_status: 422
    applies_to: "POST /sampling-periods/{id}/draw-random-sample, POST /audit-programs/{id}/accreditation-reports"

# ============================================================================
# §1.5 API Endpoints (45: 18 reads, 27 writes)
# ============================================================================

endpoints:
  # --- AuditProgram -------------------------------------------------------
  - method: POST
    path: "/audit-programs"
    description: "Create a QA program with its accreditation thresholds. accreditation_status starts at SETUP and latest_compliance_pct at null."
    roles: [ProgramAdmin]
    code: 201
    input: [name, accreditation_body, "target_compliance_pct?", "watch_floor_pct?", "high_risk_target_pct?", "review_deadline_days?", "rebuttal_window_days?", "max_rebuttal_rounds?", "escalated_sample_floor?", "hours_owed_restriction_threshold?"]
    output: AuditProgram
    side_effects: ["initializes accreditation_status = SETUP, latest_compliance_pct = null, submitted_report_count = 0, sentinel_event_count = 0"]

  - method: GET
    path: "/audit-programs/{id}"
    description: "Read one QA program, including its recomputed accreditation roll-ups."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, AccreditationOfficer]
    code: 200
    input: []
    output: AuditProgram
    side_effects: []

  # --- ProtocolVersion ----------------------------------------------------
  - method: POST
    path: "/audit-programs/{id}/protocol-versions"
    description: "Register a DRAFT protocol version with its four section weights (which must sum to 1.0000) and its half-open effective window."
    roles: [ProgramAdmin]
    code: 201
    input: [protocol_family, version_label, effective_from, "effective_to?", case_entry_weight, key_questions_weight, pre_arrival_weight, final_coding_weight]
    output: ProtocolVersion
    side_effects: ["status = DRAFT; no window-overlap check yet (that runs at approval)"]

  - method: GET
    path: "/audit-programs/{id}/protocol-versions"
    description: "List a program's protocol versions (reverse-reachability for ProtocolVersion.program_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, AccreditationOfficer]
    code: 200
    input: ["status?", "protocol_family?", "limit?", "offset?"]
    output: ProtocolVersion[]
    side_effects: []

  - method: GET
    path: "/protocol-versions/{id}"
    description: "Read one protocol version."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, AccreditationOfficer]
    code: 200
    input: []
    output: ProtocolVersion
    side_effects: []

  - method: POST
    path: "/protocol-versions/{id}/approve"
    description: "Medical-director approval: DRAFT -> APPROVED after the family window-overlap check."
    roles: [MedicalDirector]
    code: 200
    input: ["approval_note?"]
    output: ProtocolVersion
    side_effects: ["status = APPROVED, approved_by_user_id = X-User-ID; the version becomes pinnable and certifiable"]

  # --- ProtocolRollout ----------------------------------------------------
  - method: POST
    path: "/protocol-versions/{id}/rollouts"
    description: "Schedule the go-live of a protocol version with a retraining target headcount."
    roles: [ProgramAdmin]
    code: 201
    input: [scheduled_golive_at, target_dispatcher_count, "required_training_hours?"]
    output: ProtocolRollout
    side_effects: ["training_status = NOT_STARTED (or IN_PROGRESS/COMPLETE if dispatchers are already certified on the version), golive_status = SCHEDULED"]

  - method: GET
    path: "/protocol-versions/{id}/rollouts"
    description: "List the rollouts of a protocol version (reverse-reachability for ProtocolRollout.protocol_version_id)."
    roles: [ProgramAdmin, QaSupervisor, MedicalDirector]
    code: 200
    input: ["golive_status?", "limit?", "offset?"]
    output: ProtocolRollout[]
    side_effects: []

  - method: GET
    path: "/protocol-versions/{id}/retraining-sessions"
    description: "List every retraining session taught on this curriculum version (reverse-reachability for RetrainingSession.protocol_version_id)."
    roles: [ProgramAdmin, QaSupervisor, MedicalDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RetrainingSession[]
    side_effects: []

  - method: POST
    path: "/protocol-rollouts/{id}/go-live"
    description: "Put a rollout live. Requires training_status COMPLETE and the clock at or after scheduled_golive_at. Drives CASCADE B."
    roles: [ProgramAdmin]
    code: 200
    input: ["golive_note?"]
    output: ProtocolRollout
    side_effects: ["golive_status = LIVE, went_live_at set; ProtocolVersion APPROVED -> ACTIVE; the prior ACTIVE version of the family -> SUPERSEDED; its CERTIFIED dispatchers -> LAPSED with privilege re-derived; their open CoachingPlans -> SUSPENDED; the superseded version's rollout training_status regresses"]

  # --- Dispatcher ---------------------------------------------------------
  - method: POST
    path: "/dispatchers"
    description: "Enroll a dispatcher in a QA program. employee_code must be unique within the program."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, employee_code, full_name, "hire_date?"]
    output: Dispatcher
    side_effects: ["certification_status = PROVISIONAL, dispatch_privilege = FULL, compliance_posture = UNRATED, compliance_pct = null, both ledgers zeroed"]

  - method: GET
    path: "/dispatchers/{id}"
    description: "Read one dispatcher including compliance_pct, compliance_posture, remediation_hours_owed and dispatch_privilege."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, AccreditationOfficer, Dispatcher]
    code: 200
    input: []
    output: Dispatcher
    side_effects: []

  - method: GET
    path: "/dispatchers"
    description: "List dispatchers with filters (reverse-reachability for Dispatcher.program_id and Dispatcher.certified_protocol_version_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, AccreditationOfficer]
    code: 200
    input: ["program_id?", "certified_protocol_version_id?", "compliance_posture?", "dispatch_privilege?", "certification_status?", "limit?", "offset?"]
    output: Dispatcher[]
    side_effects: []

  - method: POST
    path: "/dispatchers/{id}/certify"
    description: "Certify (or re-certify) a dispatcher on an APPROVED or ACTIVE protocol version."
    roles: [ProgramAdmin]
    code: 200
    input: [protocol_version_id, "certified_at?"]
    output: Dispatcher
    side_effects: ["certification_status = CERTIFIED, certified_protocol_version_id and certified_at set; rollout_training_rollup recomputed on the old and new version; SUSPENDED CoachingPlans reopened; dispatch_privilege re-derived"]

  # --- CallRecord ---------------------------------------------------------
  - method: POST
    path: "/dispatchers/{id}/call-records"
    description: "Ingest a handled call with its dispatched determinant code. received_at may not be in the future relative to the logical clock."
    roles: [ProgramAdmin]
    code: 201
    input: [call_reference, call_type, received_at, dispatched_determinant_code, "cardiac_arrest_confirmed?", "bystander_cpr_in_progress?"]
    output: CallRecord
    side_effects: ["decodes the determinant code into dispatched_priority_rank, response_mode_assigned and resource_assigned; status = INGESTED"]

  - method: GET
    path: "/dispatchers/{id}/call-records"
    description: "List a dispatcher's calls (reverse-reachability for CallRecord.dispatcher_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector]
    code: 200
    input: ["call_type?", "status?", "limit?", "offset?"]
    output: CallRecord[]
    side_effects: []

  # --- SamplingPeriod -----------------------------------------------------
  - method: POST
    path: "/audit-programs/{id}/sampling-periods"
    description: "Open a sampling period for one call type over a half-open date window with a target sample count."
    roles: [QaSupervisor]
    code: 201
    input: [call_type, period_start, period_end, sampling_mode, target_sample_count]
    output: SamplingPeriod
    side_effects: ["status = OPEN, both review counters zeroed"]

  - method: GET
    path: "/audit-programs/{id}/sampling-periods"
    description: "List a program's sampling periods (reverse-reachability for SamplingPeriod.program_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, AccreditationOfficer]
    code: 200
    input: ["status?", "call_type?", "limit?", "offset?"]
    output: SamplingPeriod[]
    side_effects: []

  - method: POST
    path: "/sampling-periods/{id}/draw-random-sample"
    description: "Run the deterministic systematic draw over the period's eligible calls and create one Review per selected call."
    roles: [QaSupervisor]
    code: 201
    input: [requested_count]
    output: Review[]
    side_effects: ["calculations.systematic_sample_selection selects calls by (received_at ASC, call_reference ASC) at stride floor(pool/requested_count); each Review pins its ProtocolVersion; selected CallRecords move INGESTED -> SELECTED; period.selected_review_count updated"]

  - method: POST
    path: "/sampling-periods/{id}/target-review"
    description: "Targeted selection of one specific call into the period, with an audit reason."
    roles: [QaSupervisor, QaReviewer]
    code: 201
    input: [call_record_id, selection_reason]
    output: Review
    side_effects: ["creates one Review with selection_mode = TARGETED and the pinned ProtocolVersion; high_risk = true when the call_type is CARDIAC_ARREST; CallRecord -> SELECTED; period.selected_review_count incremented"]

  - method: POST
    path: "/sampling-periods/{id}/close"
    description: "Close a period once its sample quota is met. Closing blocks further selection but not scoring or finalization."
    roles: [QaSupervisor]
    code: 200
    input: ["closing_note?"]
    output: SamplingPeriod
    side_effects: ["status = CLOSED, closed_at set"]

  # --- Review -------------------------------------------------------------
  - method: GET
    path: "/reviews/{id}"
    description: "Read one review including provisional, pre-penalty and final composite scores and its current version (the OCC comparand for scoring)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, AccreditationOfficer, Dispatcher]
    code: 200
    input: []
    output: Review
    side_effects: []

  - method: GET
    path: "/reviews"
    description: "List reviews with filters (reverse-reachability for Review.sampling_period_id, Review.call_record_id, Review.dispatcher_id and Review.protocol_version_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, AccreditationOfficer]
    code: 200
    input: ["sampling_period_id?", "call_record_id?", "dispatcher_id?", "protocol_version_id?", "status?", "high_risk?", "limit?", "offset?"]
    output: Review[]
    side_effects: []

  - method: POST
    path: "/reviews/{id}/scores"
    description: "Submit a score sheet. Append-only: each submission creates a new sheet round and supersedes the previous one as the current sheet. OCC-guarded on Review.version."
    roles: [QaReviewer]
    code: 201
    input: [expected_review_version, case_entry_points_earned, case_entry_points_possible, key_questions_points_earned, key_questions_points_possible, pre_arrival_points_earned, pre_arrival_points_possible, final_coding_points_earned, final_coding_points_possible, reviewer_determinant_code, "reviewer_notes?"]
    output: ScoreSheet
    side_effects: ["computes the four section percentages and provisional_composite_score (variant section_unweighted_mean), the reviewer code decoding, the two deviation flags and determinant_accuracy; sets Review.current_sheet_round, provisional_composite_score, scored_at; Review -> SCORED; Review.version incremented"]

  - method: GET
    path: "/reviews/{id}/score-sheets"
    description: "List a review's score sheets in append order (reverse-reachability for ScoreSheet.review_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: ScoreSheet[]
    side_effects: []

  - method: POST
    path: "/reviews/{id}/rebuttals"
    description: "Dispatcher disputes the current score. Allowed only by the case owner, inside the rebuttal window, while rounds remain."
    roles: [Dispatcher]
    code: 201
    input: [grounds_category, narrative]
    output: Rebuttal
    side_effects: ["Review SCORED -> DISPUTED; rebuttal_round_count incremented; Review.version incremented"]

  - method: GET
    path: "/reviews/{id}/rebuttals"
    description: "List a review's rebuttals (reverse-reachability for Rebuttal.review_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Rebuttal[]
    side_effects: []

  - method: POST
    path: "/rebuttals/{id}/decide"
    description: "Adjudicate a rebuttal. UPHELD sends the review back to SELECTED for re-scoring (the cycle); REJECTED restores SCORED."
    roles: [QaSupervisor]
    code: 200
    input: [decision, "decision_notes?"]
    output: Rebuttal
    side_effects: ["on UPHELD: Review -> SELECTED with provisional_composite_score and scored_at cleared to null; on REJECTED: Review -> SCORED with its score preserved; Review.version incremented"]

  - method: POST
    path: "/reviews/{id}/finalize"
    description: "Finalize a scored review. Segregation of duties: the finalizer may not be the reviewer who submitted the current sheet. Drives CASCADE A."
    roles: [QaSupervisor]
    code: 200
    input: ["finalization_note?"]
    output: Review
    side_effects: ["computes pre_penalty_composite_score (variant accreditation_weighted_composite), penalty_points, final_composite_score and compliant; status = FINALIZED; HighRiskCaseReview -> CLOSED; dispatcher_compliance_rollup, auto_coaching_plan_upsert, remediation_hours_ledger and dispatch_privilege_derivation all re-run; period counters updated"]

  - method: POST
    path: "/reviews/{id}/void"
    description: "Void a review (bad audio, wrong dispatcher, duplicate case). From FINALIZED this is the compensating action that reverses CASCADE A."
    roles: [QaSupervisor]
    code: 200
    input: [void_reason]
    output: Review
    side_effects: ["status = VOIDED and the scoring fields cleared; CallRecord returns to INGESTED; period counters recomputed; the AUTO CoachingPlan is CANCELLED with closure_reason SOURCE_VOIDED; dispatcher ledgers, posture and privilege recomputed"]

  # --- HighRiskCaseReview -------------------------------------------------
  - method: POST
    path: "/reviews/{id}/high-risk-reviews"
    description: "Open the clinical high-risk record for a review (cardiac-arrest recognition and DA-CPR). At most one per review."
    roles: [QaReviewer]
    code: 201
    input: [outcome_category]
    output: HighRiskCaseReview
    side_effects: ["status = PENDING; the parent Review can no longer be finalized until this record is signed off"]

  - method: GET
    path: "/reviews/{id}/high-risk-reviews"
    description: "List the review's high-risk record (0 or 1 element; reverse-reachability for HighRiskCaseReview.review_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, AccreditationOfficer]
    code: 200
    input: ["status?"]
    output: HighRiskCaseReview[]
    side_effects: []

  - method: POST
    path: "/high-risk-reviews/{id}/score-dacpr"
    description: "Record the DA-CPR observations and compute the performance index."
    roles: [QaReviewer]
    code: 200
    input: [cardiac_arrest_recognized, recognition_time_sec, time_to_first_compression_sec, dacpr_instructions_delivered, compressions_coached]
    output: HighRiskCaseReview
    side_effects: ["computes compression_compliant, dacpr_index (calculations.dacpr_performance_index) and dacpr_pass; status = DACPR_SCORED"]

  - method: POST
    path: "/high-risk-reviews/{id}/sign-off"
    description: "Medical-director classification of the high-risk case. SENTINEL_EVENT and COACHING_ONLY carry disjoint side effects."
    roles: [MedicalDirector]
    code: 200
    input: [classification, "director_notes?"]
    output: HighRiskCaseReview
    side_effects: ["status and classification set with signed_off_by_user_id / signed_off_at; SENTINEL_EVENT raises the sentinel counters and upserts a CRITICAL DACPR CoachingPlan; COACHING_ONLY upserts an ADVISORY plan only when dacpr_pass == false and never touches the sentinel counters; the dispatcher's hours ledger and privilege are re-derived"]

  # --- CoachingPlan -------------------------------------------------------
  - method: POST
    path: "/coaching-plans"
    description: "Create a MANUAL coaching plan for a dispatcher. OCC-guarded on Dispatcher.version; supersedes the dispatcher's other open plans."
    roles: [QaSupervisor]
    code: 201
    input: [dispatcher_id, expected_dispatcher_version, severity, focus_area, "due_at?", "source_review_id?"]
    output: CoachingPlan
    side_effects: ["origin = MANUAL, status = ASSIGNED, required_hours from the severity table, credited_hours 0.00; the dispatcher's other open plans are CANCELLED with closure_reason SUPERSEDED; remediation_hours_owed and dispatch_privilege recomputed; Dispatcher.version incremented"]

  - method: GET
    path: "/coaching-plans/{id}"
    description: "Read one coaching plan including credited_hours and status."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, Dispatcher]
    code: 200
    input: []
    output: CoachingPlan
    side_effects: []

  - method: GET
    path: "/coaching-plans"
    description: "List coaching plans with filters (reverse-reachability for CoachingPlan.dispatcher_id and CoachingPlan.source_review_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector]
    code: 200
    input: ["dispatcher_id?", "source_review_id?", "status?", "severity?", "origin?", "limit?", "offset?"]
    output: CoachingPlan[]
    side_effects: []

  # --- RetrainingSession --------------------------------------------------
  - method: POST
    path: "/coaching-plans/{id}/retraining-sessions"
    description: "Schedule a retraining session on an APPROVED or ACTIVE curriculum version. The dispatcher's sessions may not collide inside a 45-minute buffer."
    roles: [QaSupervisor]
    code: 201
    input: [protocol_version_id, starts_at, ends_at, modality]
    output: RetrainingSession
    side_effects: ["computes duration_hours; status = SCHEDULED; the plan moves ASSIGNED -> IN_PROGRESS"]

  - method: GET
    path: "/coaching-plans/{id}/retraining-sessions"
    description: "List a plan's sessions (reverse-reachability for RetrainingSession.coaching_plan_id)."
    roles: [ProgramAdmin, QaSupervisor, QaReviewer, MedicalDirector, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RetrainingSession[]
    side_effects: []

  - method: POST
    path: "/retraining-sessions/{id}/complete"
    description: "Mark an ended session complete and credit its hours to the plan."
    roles: [QaSupervisor]
    code: 200
    input: [attendance_confirmed]
    output: RetrainingSession
    side_effects: ["status = COMPLETED, completed_at set; plan.credited_hours recomputed and the plan may bubble up to VERIFIED; dispatcher remediation_hours_owed and dispatch_privilege recomputed"]

  - method: POST
    path: "/retraining-sessions/{id}/cancel"
    description: "Cancel a scheduled or already-completed session. Cancelling a completed session removes its credit (compensating action)."
    roles: [QaSupervisor]
    code: 200
    input: [cancel_reason]
    output: RetrainingSession
    side_effects: ["status = CANCELLED, completed_at cleared; plan.credited_hours recomputed; a VERIFIED plan reverts to IN_PROGRESS; dispatcher remediation_hours_owed and dispatch_privilege recomputed"]

  # --- AccreditationReport ------------------------------------------------
  - method: POST
    path: "/audit-programs/{id}/accreditation-reports"
    description: "Build a DRAFT accreditation report over a half-open finalization window in one of the two aggregation variants."
    roles: [AccreditationOfficer]
    code: 201
    input: [window_start, window_end, variant]
    output: AccreditationReport
    side_effects: ["calculations.accreditation_compliance_percentage populates review_count, compliant_review_count, dispatcher_count, compliance_pct, the three high-risk fields and threshold_met; status = DRAFT"]

  - method: GET
    path: "/audit-programs/{id}/accreditation-reports"
    description: "List a program's accreditation reports (reverse-reachability for AccreditationReport.program_id)."
    roles: [ProgramAdmin, QaSupervisor, MedicalDirector, AccreditationOfficer]
    code: 200
    input: ["status?", "variant?", "limit?", "offset?"]
    output: AccreditationReport[]
    side_effects: []

  - method: POST
    path: "/accreditation-reports/{id}/submit"
    description: "Submit the report to the medical director or the oversight committee. Drives CASCADE C, which locks the overlapping closed periods."
    roles: [AccreditationOfficer]
    code: 200
    input: [submitted_to]
    output: AccreditationReport
    side_effects: ["status = SUBMITTED with submitted_to / submitted_at; program submitted_report_count, latest_compliance_pct and accreditation_status recomputed; overlapping CLOSED SamplingPeriods -> LOCKED; their still-SELECTED Reviews -> VOIDED with void_reason PERIOD_LOCKED and the underlying CallRecords return to INGESTED; SCORED and DISPUTED reviews of a locked period are frozen (further scoring or finalization fails with ERR_PERIOD_LOCKED)"]

  # --- Test-driving endpoint ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window and expiry rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the server reads that default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["no entity is mutated; all subsequent temporal evaluations use the new instant"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================

errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_CASE_OWNER
    http: 403
    condition: "a Dispatcher submits a rebuttal on a Review whose dispatcher_id is not their own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID finalizing a review equals the submitted_by_user_id of that review's current ScoreSheet"

  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, a type is wrong, an enum value is undeclared, or a numeric field is out of range (including points_earned > points_possible)"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 200] or offset negative"
  - id: ERR_INVALID_DETERMINANT_CODE
    http: 422
    condition: "a determinant code does not match ^[0-9]{1,2}-[OABCDE]-[0-9]{1,2}$"
  - id: ERR_INVALID_THRESHOLD_CONFIG
    http: 422
    condition: "program thresholds violate 0.0 < watch_floor_pct < target_compliance_pct <= 100.0 or 0.0 < high_risk_target_pct <= 100.0"
  - id: ERR_WEIGHTS_NOT_NORMALIZED
    http: 422
    condition: "the four protocol section weights do not sum to exactly 1.0000, or one of them is negative"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "ends_at <= starts_at on a session, period_end <= period_start on a sampling period, or effective_to <= effective_from on a protocol version"

  # existence
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no AuditProgram with the supplied id"
  - id: ERR_PROTOCOL_VERSION_NOT_FOUND
    http: 404
    condition: "no ProtocolVersion with the supplied id"
  - id: ERR_ROLLOUT_NOT_FOUND
    http: 404
    condition: "no ProtocolRollout with the supplied id"
  - id: ERR_DISPATCHER_NOT_FOUND
    http: 404
    condition: "no Dispatcher with the supplied id"
  - id: ERR_CALL_RECORD_NOT_FOUND
    http: 404
    condition: "no CallRecord with the supplied id"
  - id: ERR_SAMPLING_PERIOD_NOT_FOUND
    http: 404
    condition: "no SamplingPeriod with the supplied id"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "no Review with the supplied id"
  - id: ERR_REBUTTAL_NOT_FOUND
    http: 404
    condition: "no Rebuttal with the supplied id"
  - id: ERR_HIGH_RISK_REVIEW_NOT_FOUND
    http: 404
    condition: "no HighRiskCaseReview with the supplied id"
  - id: ERR_COACHING_PLAN_NOT_FOUND
    http: 404
    condition: "no CoachingPlan with the supplied id"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "no RetrainingSession with the supplied id"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "no AccreditationReport with the supplied id"

  # optimistic concurrency
  - id: ERR_STALE_REVIEW_VERSION
    http: 412
    condition: "expected_review_version does not equal the Review's current version"
  - id: ERR_STALE_DISPATCHER_VERSION
    http: 412
    condition: "expected_dispatcher_version does not equal the Dispatcher's current version"

  # state
  - id: ERR_REVIEW_NOT_SCORABLE
    http: 409
    condition: "a score sheet is submitted against a Review that is not in SELECTED or SCORED, or that has an undecided rebuttal"
  - id: ERR_REVIEW_NOT_DISPUTABLE
    http: 409
    condition: "a rebuttal is submitted against a Review that is not in SCORED"
  - id: ERR_REVIEW_NOT_FINALIZABLE
    http: 409
    condition: "finalization is attempted on a Review that is not in SCORED"
  - id: ERR_REVIEW_ALREADY_VOIDED
    http: 409
    condition: "any mutation is attempted on a Review already in VOIDED"
  - id: ERR_PERIOD_NOT_OPEN
    http: 409
    condition: "case selection or closing is attempted on a SamplingPeriod that is not in OPEN"
  - id: ERR_PERIOD_LOCKED
    http: 409
    condition: "scoring or finalization is attempted inside a SamplingPeriod already in LOCKED"
  - id: ERR_VERSION_NOT_APPROVABLE
    http: 409
    condition: "approval is attempted on a ProtocolVersion that is not in DRAFT"
  - id: ERR_ROLLOUT_NOT_LIVEABLE
    http: 409
    condition: "go-live is attempted on a ProtocolRollout whose golive_status is already LIVE, or whose ProtocolVersion is not APPROVED"
  - id: ERR_HRCR_NOT_SCORABLE
    http: 409
    condition: "DA-CPR scoring is attempted on a HighRiskCaseReview that is not in PENDING"
  - id: ERR_HRCR_NOT_SIGNABLE
    http: 409
    condition: "sign-off is attempted on a HighRiskCaseReview that is not in DACPR_SCORED"
  - id: ERR_REBUTTAL_ALREADY_DECIDED
    http: 409
    condition: "a decision is submitted on a Rebuttal already in UPHELD or REJECTED"
  - id: ERR_PLAN_NOT_OPEN
    http: 409
    condition: "a session is scheduled on a CoachingPlan in VERIFIED, SUSPENDED or CANCELLED"
  - id: ERR_SESSION_NOT_COMPLETABLE
    http: 409
    condition: "completion is attempted on a RetrainingSession that is not in SCHEDULED"
  - id: ERR_SESSION_NOT_CANCELLABLE
    http: 409
    condition: "cancellation is attempted on a RetrainingSession already in CANCELLED"
  - id: ERR_REPORT_ALREADY_SUBMITTED
    http: 409
    condition: "submission is attempted on an AccreditationReport already in SUBMITTED"

  # referential / scope
  - id: ERR_PROGRAM_SCOPE_MISMATCH
    http: 409
    condition: "a referenced ProtocolVersion, CallRecord or Dispatcher belongs to a different AuditProgram than the operation's program"
  - id: ERR_CALL_TYPE_MISMATCH
    http: 409
    condition: "a targeted CallRecord's call_type differs from the SamplingPeriod's call_type"
  - id: ERR_VERSION_NOT_CERTIFIABLE
    http: 409
    condition: "certification references a ProtocolVersion whose status is not APPROVED or ACTIVE"
  - id: ERR_CURRICULUM_VERSION_NOT_TRAINABLE
    http: 409
    condition: "a retraining session references a ProtocolVersion whose status is not APPROVED or ACTIVE"
  - id: ERR_NO_PROTOCOL_VERSION_IN_FORCE
    http: 409
    condition: "no MPDS_CARDSET ProtocolVersion in {APPROVED, ACTIVE, SUPERSEDED} has a half-open effective window containing the call's received_at"

  # safety
  - id: ERR_HIGH_RISK_SIGN_OFF_REQUIRED
    http: 422
    condition: "a high_risk Review is finalized while its HighRiskCaseReview is still PENDING or DACPR_SCORED"
  - id: ERR_SENTINEL_CLASSIFICATION_REQUIRED
    http: 422
    condition: "a HighRiskCaseReview with dacpr_index below 50.0 is signed off as COACHING_ONLY"

  # temporal / overlap
  - id: ERR_PROTOCOL_WINDOW_OVERLAP
    http: 409
    condition: "approving a ProtocolVersion whose half-open effective window overlaps another APPROVED, ACTIVE or SUPERSEDED version of the same program and protocol family"
  - id: ERR_SESSION_WINDOW_OVERLAP
    http: 409
    condition: "a new session's window, expanded by the 45-minute buffer on both sides, overlaps another SCHEDULED or COMPLETED session of the same dispatcher"
  - id: ERR_GOLIVE_WINDOW_NOT_OPEN
    http: 422
    condition: "go-live is attempted while the logical clock is before scheduled_golive_at"
  - id: ERR_CALL_RECEIVED_IN_FUTURE
    http: 422
    condition: "an ingested call's received_at is after the logical clock"
  - id: ERR_CALL_OUTSIDE_PERIOD
    http: 422
    condition: "a targeted CallRecord's received_at falls outside the period's half-open window"
  - id: ERR_REBUTTAL_WINDOW_CLOSED
    http: 422
    condition: "a rebuttal arrives after Review.scored_at plus program.rebuttal_window_days"
  - id: ERR_REVIEW_DEADLINE_PASSED
    http: 422
    condition: "finalization arrives after Review.created_at plus program.review_deadline_days"
  - id: ERR_REPORT_WINDOW_INVALID
    http: 422
    condition: "an accreditation report's window_end is not strictly after its window_start"

  # uniqueness / cardinality
  - id: ERR_DUPLICATE_CALL_REFERENCE
    http: 409
    condition: "a CallRecord with the same call_reference already exists"
  - id: ERR_DUPLICATE_EMPLOYEE_CODE
    http: 409
    condition: "a Dispatcher with the same employee_code already exists in the program"
  - id: ERR_DUPLICATE_HIGH_RISK_REVIEW
    http: 409
    condition: "the Review already has a HighRiskCaseReview"
  - id: ERR_DUPLICATE_COACHING_PLAN
    http: 409
    condition: "an AUTO CoachingPlan already exists for the (dispatcher_id, source_review_id) pair being created"
  - id: ERR_CALL_ALREADY_SELECTED
    http: 409
    condition: "the targeted CallRecord is already in status SELECTED"
  - id: ERR_SAMPLING_MODE_MISMATCH
    http: 409
    condition: "a random draw is requested on a TARGETED-only period, or a targeted selection on a RANDOM-only period"
  - id: ERR_REBUTTAL_ROUNDS_EXHAUSTED
    http: 409
    condition: "Review.rebuttal_round_count has reached program.max_rebuttal_rounds"

  # quota / readiness
  - id: ERR_SAMPLE_QUOTA_FILLED
    http: 422
    condition: "selected_review_count has already reached target_sample_count"
  - id: ERR_SAMPLE_QUOTA_NOT_MET
    http: 422
    condition: "a period is closed while selected_review_count is below target_sample_count"
  - id: ERR_ESCALATED_SAMPLING_REQUIRED
    http: 422
    condition: "a period covering a dispatcher whose compliance_posture is PROBATION is closed while target_sample_count is below program.escalated_sample_floor"
  - id: ERR_TRAINING_INCOMPLETE
    http: 422
    condition: "go-live is attempted while the rollout's training_status is not COMPLETE"

  # empty aggregates
  - id: ERR_NO_ELIGIBLE_CALLS
    http: 422
    condition: "the systematic-draw candidate pool is empty"
  - id: ERR_NO_FINALIZED_REVIEWS_IN_WINDOW
    http: 422
    condition: "an accreditation report window contains no FINALIZED Review of the program"

# ============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# ============================================================================

roles:
  - name: ProgramAdmin
    description: "Communications-center administrator: configures the QA program, registers protocol versions and rollouts, enrolls and certifies dispatchers, ingests call records, and owns the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /audit-programs"
      - "POST /audit-programs/{id}/protocol-versions"
      - "POST /protocol-versions/{id}/rollouts"
      - "POST /protocol-rollouts/{id}/go-live"
      - "POST /dispatchers"
      - "POST /dispatchers/{id}/certify"
      - "POST /dispatchers/{id}/call-records"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /audit-programs/{id}"
      - "GET /audit-programs/{id}/protocol-versions"
      - "GET /audit-programs/{id}/sampling-periods"
