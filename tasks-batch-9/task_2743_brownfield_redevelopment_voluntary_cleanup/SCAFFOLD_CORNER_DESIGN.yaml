            - "RemedialActionPlan.${plan_id}.status == 'APPROVED' and SiteControl.${ctl_id}.status == 'APPROVED'"

      - name: corner_liability_protection_parallel_dimensions
        claim_type: valid_transition
        grounds:
          - state_machines.LiabilityProtection.state_dimensions
        excluded_because:
          difficulty_instance: non_linear_state_machine / liability_protection_parallel_dimensions_advance_independently
          rationale: "The §1.8 instance already drives inquiry_state and obligation_state independently and asserts the derived bfpp_status for each combination."

      - name: corner_assessment_phase_revision_cycle_and_rejection
        claim_type: idempotency
        grounds:
          - state_machines.AssessmentPhase.REVISION_REQUESTED_to_SUBMITTED
          - validations[38].ERR_ASSESSMENT_REVISION_LIMIT
        excluded_because:
          difficulty_instance: non_linear_state_machine / assessment_phase_revision_cycle_terminates_in_rejection
          rationale: "The §1.8 instance walks the full DRAFT -> SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED loop three times and asserts the terminal REJECTED plus the fourth-submit refusal."

      - name: corner_plan_fork_join_branches
        claim_type: valid_transition
        grounds:
          - state_machines.RemedialActionPlan.SUBMITTED_to_UNDER_TECHNICAL_REVIEW
          - validations[13].ERR_JOIN_NOT_SATISFIED
        excluded_because:
          difficulty_instance: non_linear_state_machine / remedial_action_plan_fork_join_branches_advance_independently
          rationale: "The §1.8 instance asserts each branch advancing alone, the join refusal, and the join satisfaction in both orders."

      - name: corner_exceedance_cascade_down_the_site
        claim_type: cascade_down
        grounds:
          - state_machines.SiteControl.OPERATING_to_IMPAIRED
          - state_machines.NoFurtherActionLetter.ISSUED_to_REVOKED
          - state_machines.FundingAward.AWARDED_to_RESCINDED
        excluded_because:
          difficulty_instance: transitive_cascade / monitoring_exceedance_impairs_control_revokes_letter_rescinds_awards
          rationale: "The §1.8 instance verifies the four-level cascade end-to-end from the monitoring result through control, site posture, letter revocation and award rescission."

      - name: corner_void_certification_compensation
        claim_type: compensation
        grounds:
          - state_machines.ContinuingObligation.SATISFIED_to_AT_RISK
          - state_machines.ContinuingObligation.SATISFIED_to_CURRENT
        excluded_because:
          difficulty_instance: compensating_invariant / void_certification_conserves_obligation_weight_total
          rationale: "The §1.8 instance asserts the full reversal of every side effect of the certification with no drift in the weight partition."

  # ===========================================================================
  # §1.3 Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: design_estimate_correct_result_on_plan_submit
        claim_type: correct_result
        grounds:
          - calculations.remediation_cost_estimate
          - endpoints[POST /remedial-action-plans/{id}/submit].side_effects
        distinguishing_aspect: "The DESIGN variant on submit produces direct_cost_cents 89,787,402, escalation_cents 11,313,213 (linear 0.042 x 3 years, not compounded), contingency_cents 10,110,062 at the FULL tier 0.10, oversight_cents capped at 4,000,000 rather than the uncapped 7,228,694, and total_estimate_cents 115,210,677."
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED enrollment, the DRAFT plan carrying the six pinned cost lines with years_to_construction_start 3, and the PROPOSED vapour-mitigation control."
            - "The basis phase is the PHASE_II with delineation_confidence FULL and max_exceedance_factor 4.80."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_clock_dec
            - *c_p2
            - *c_p2fa
            - *c_p2fb
            - *c_p2fc
            - *c_p2sub
            - *c_p2app
            - *c_g1
            - *c_g2
            - *c_enr
            - *c_elig
            - *c_plan
            - *c_ctl
          trigger:
            - *c_plansub
          assert:
            - "RemedialActionPlan.${plan_id}.direct_cost_cents == 89787402 (per-line rounded values 433062 + 865562 + 54062500 + 18610003 + 11571875 + 4244400)"
            - "RemedialActionPlan.${plan_id}.escalation_cents == 11313213 (round_half_up(89787402 * 0.042 * 3) — linear escalation, not (1.042^3 - 1))"
            - "RemedialActionPlan.${plan_id}.contingency_pct == 0.10 and contingency_cents == 10110062 (round_half_up((89787402 + 11313213) * 0.10) = round_half_up(10110061.5))"
            - "RemedialActionPlan.${plan_id}.oversight_cents == 4000000 — the OVERSIGHT_CAP_CENTS binds because round_half_up(111210677 * 0.065) == 7228694 exceeds it"
            - "RemedialActionPlan.${plan_id}.total_estimate_cents == 115210677 == 89787402 + 11313213 + 10110062 + 4000000"
            - "RemedialActionPlan.${plan_id}.total_funding_need_cents == 115210677 (no policy bound yet, so no premium component)"

      - name: contingency_tier_reads_only_the_basis_assessment_phase
        claim_type: input_set_filtering
        grounds:
          - calculations.remediation_cost_estimate.input_set
          - calculations.remediation_cost_estimate.constants.CONTINGENCY_TIER
          - calculations.remediation_cost_estimate.constants.CONTINGENCY_EXCEEDANCE_THRESHOLD
        distinguishing_aspect: "The site carries two APPROVED phases: the PHASE_I with delineation_confidence SCREENING (tier 0.35) and max_exceedance_factor 96.00 (adder 0.05 would apply), and the PHASE_II with FULL (tier 0.10) and max_exceedance_factor 4.80 (no adder). basis_assessment_phase_id names the PHASE_II, so contingency_pct must be 0.10 — not 0.40 and not any max/blend across the site's phases."
        test_recipe:
          setup:
            - "Same prefix as the DESIGN correct-result case: PHASE_I APPROVED with the 96.00 exceedance, PHASE_II APPROVED with FULL confidence, plan basis = PHASE_II."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_clock_dec
            - *c_p2
            - *c_p2fa
            - *c_p2fb
            - *c_p2fc
            - *c_p2sub
            - *c_p2app
            - *c_g1
            - *c_g2
            - *c_enr
            - *c_elig
            - *c_plan
            - *c_ctl
          trigger:
            - *c_plansub
          assert:
            - "AssessmentPhase.${p1_id}.delineation_confidence == 'SCREENING' and max_exceedance_factor == 96.00; AssessmentPhase.${p2_id}.delineation_confidence == 'FULL' and max_exceedance_factor == 4.80"
            - "RemedialActionPlan.${plan_id}.basis_assessment_phase_id == ${p2_id}"
            - "RemedialActionPlan.${plan_id}.contingency_pct == 0.10 (not 0.35, not 0.40)"
            - "RemedialActionPlan.${plan_id}.total_estimate_cents == 115210677 — an implementation that read the PHASE_I tier plus adder would report 145540861"

      - name: underwriting_variant_is_selected_only_by_the_quote_endpoint
        claim_type: variant_selection
        grounds:
          - calculations.remediation_cost_estimate.trigger
          - calculations.remediation_cost_estimate.variants
          - endpoints[POST /cost-cap-policies].side_effects
        distinguishing_aspect: "Quoting a policy writes the UNDERWRITING figure to CostCapPolicy.underwriting_estimate_cents (139,803,445, using 5 escalation years and the 0.25 contingency floor) and must leave RemedialActionPlan.total_estimate_cents at its DESIGN value 115,210,677 — the plan's field is never overwritten with the underwriting number."
        test_recipe:
          setup:
            - "Shared prefix through the APPROVED plan (DESIGN total_estimate_cents 115,210,677)."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_clock_dec
            - *c_p2
            - *c_p2fa
            - *c_p2fb
            - *c_p2fc
            - *c_p2sub
            - *c_p2app
            - *c_g1
            - *c_g2
            - *c_enr
            - *c_elig
            - *c_plan
            - *c_ctl
            - *c_plansub
            - *c_plantech
            - *c_planpcc
            - *c_planapp
          trigger:
            - &c_quote
              call: "POST /cost-cap-policies"
              payload:
                remedial_action_plan_id: "${plan_id}"
                insurer_party_id: "${insurer_id}"
                policy_reference: "CCP-2743-A1"
                term_years: 5
                expected_remedial_action_plan_version: "${plan_v_appr}"
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
          assert:
            - "CostCapPolicy.${pol_id}.underwriting_estimate_cents == 139803445 (escalation 18855354 at 5 years, contingency 27160689 at the 0.25 floor, oversight 4000000 capped)"
            - "CostCapPolicy.${pol_id}.attachment_point_cents == 153783790 and buffer_layer_cents == 13980345"
            - "CostCapPolicy.${pol_id}.limit_cents == 50000000 (round_half_up(139803445 * 0.30) == 41941034, ceiled to the 10,000,000-cent step)"
            - "CostCapPolicy.${pol_id}.rate_applied == 0.055 and premium_cents == 2832500"
            - "CostCapPolicy.${pol_id}.status == 'QUOTED' and bound_at == null"
            - "RemedialActionPlan.${plan_id}.total_estimate_cents == 115210677 (unchanged) and total_funding_need_cents == 115210677 (the premium is not folded in until bind)"

      - name: bind_reconciles_funding_need_with_the_bound_premium
        claim_type: reconciliation
        grounds:
          - calculations.cost_cap_premium.formula
          - endpoints[POST /cost-cap-policies/{id}/bind].side_effects
          - entities.RemedialActionPlan.fields.total_funding_need_cents
        distinguishing_aspect: "total_funding_need_cents moves from 115,210,677 to 118,043,177 on bind and the delta is exactly premium_cents 2,832,500 — the premium is derived from the PRE-premium underwriting estimate, so folding the need back into the limit would not reproduce this figure."
        test_recipe:
          setup:
            - "Shared prefix through the APPROVED plan and one QUOTED policy priced at premium_cents 2,832,500."
