            - { call: "GET /library-network/book-items?batch_id=${batch}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
          assert:
            - "Before the third complaint: box.listing_posture == FLAGGED with upheld_complaints_90d == 2 (captured ${pre_posture})"
            - "After the third resolve UPHELD: box.listing_posture == DELISTED and box.upheld_complaints_90d == 3 while charter_status remains ACTIVE"
            - "Recall cascade: all 4 Allocations of run ${run} have status == CANCELLED (they were DISPATCHED)"
