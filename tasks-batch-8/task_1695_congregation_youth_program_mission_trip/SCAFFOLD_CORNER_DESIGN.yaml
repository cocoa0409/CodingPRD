            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p3}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-3", captures: {reg3: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg3}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T12:00:00Z"}, as: Guardian, as_user_id: "guardian-3", captures: {cf3a: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg3}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T12:01:00Z", medical_notes: "n"}, as: Guardian, as_user_id: "guardian-3", captures: {cf3b: $.data.id} }
