              payload: { email: "rt1b@x.com", full_name: "RT1 B", size_code: 22 }
              as: Anonymous
              captures: { custB: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Stylist D", specialties: ["ADAPTIVE"], buffer_minutes: 15 }
              as: StoreManager
              captures: { spec_id: $.data.id }
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z" }
              as: Customer
              as_user_id: "${custA}"
              captures: { a_first: $.data.id }
            - call: "POST /appointments/${a_first}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-05T11:10:00Z", end_at: "2026-07-05T11:40:00Z" }
              as: Customer
              as_user_id: "${custB}"
              captures: { a_second: $.data.id }
          trigger:
            - call: "POST /appointments/${a_second}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SPECIALIST_UNAVAILABLE"
            - "StylingAppointment.${a_second}.status == REQUESTED"

      - name: customer_halfopen_double_booking_rejected
        grounds:
          - calculations.specialist_buffer_overlap
          - state_machines.StylingAppointment.REQUESTED_to_CONFIRMED
          - entities.StylingAppointment.fields.customer_id
          - errors[ERR_CUSTOMER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Customer resource, UNBUFFERED half-open [start,end) intersection: one customer
          holds a confirmed 10:00-11:00 slot with specialist 1 and requests 10:30-11:30
