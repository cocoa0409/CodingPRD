scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: employee_creation_defaults_and_system_fields_input_ignored
        claim_type: creation
        grounds: [entities.Employee]
        distinguishing_aspect: "Creating an employee applies system defaults (fraud_strikes 0, risk_score 0, employment_status ACTIVE, referral_suspended false, version 1) and ignores client-supplied id/version/created_at."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z", id: "11111111-1111-1111-1111-111111111111", version: 99 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          assert:
            - "Response 201 with server-minted id != the client-supplied value"
            - "fraud_strikes == 0, risk_score == 0, employment_status == ACTIVE, referral_suspended == false, version == 1"
            - "tenure_days == 212 at the default clock 2026-08-01T00:00:00Z"

      - name: employee_missing_required_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Employee, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field email on employee creation yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: employee_invalid_job_level_returns_invalid_enum
        claim_type: type_constraints
        grounds: [entities.Employee.fields.job_level, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "job_level 'CEO' is not a declared enum member; creation yields 400 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "CEO", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ENUM and http status 400"

      - name: employee_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Employee, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but absent employee UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /erp/employees/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: candidate_cooldown_until_computed_from_prior_application
        claim_type: computed_fields
        grounds: [entities.Candidate.fields.cooldown_until, calculations.candidate_cooldown]
        distinguishing_aspect: "prior_application_at 2026-02-01T00:00:00Z with the default 6-month cooldown yields cooldown_until 2026-08-01T00:00:00Z; global_status stays AVAILABLE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /erp/candidates"
              payload: { full_name: "Cool Cand", email: "cool@x.com", prior_application_at: "2026-02-01T00:00:00Z" }
              as: TalentAdmin
              captures: { cand_id: $.data.id, cd: $.data.cooldown_until, gs: $.data.global_status }
          assert:
            - "cooldown_until == 2026-08-01T00:00:00Z (6 calendar months)"
            - "global_status == AVAILABLE and last_terminal_outcome_at == 2026-02-01T00:00:00Z"

      - name: requisition_open_referral_count_computed
        claim_type: computed_fields
        grounds: [entities.JobRequisition.fields.open_referral_count]
        distinguishing_aspect: "open_referral_count tracks non-terminal referrals: 2 after two submissions, back to 1 after one withdraws."
        test_recipe:
          setup: ["Default policy ACTIVE; eligible referrer; OPEN IC requisition; two referrals for two candidates"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC", openings: 5 }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id }
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c2@x.com", candidate_full_name: "C Two" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_2: $.data.id }
          trigger:
            - call: "GET /erp/job-requisitions/${req_id}"
              as: TalentAdmin
              captures: { cnt_2: $.data.open_referral_count }
            - call: "POST /erp/referrals/${ref_1}/withdraw"
              as: Employee
              as_user_id: "${emp_a}"
            - call: "GET /erp/job-requisitions/${req_id}"
              as: TalentAdmin
              captures: { cnt_1: $.data.open_referral_count }
          assert:
            - "open_referral_count == 2 after two submissions"
            - "open_referral_count == 1 after one withdrawal (WITHDRAWN is terminal)"

      - name: referral_event_append_only_immutable_log
        claim_type: immutability
        grounds: [entities.ReferralEvent]
        distinguishing_aspect: "ReferralEvent has common_fields false (no version, no update endpoints); each transition appends exactly one entry with from/to states."
        test_recipe:
          setup: ["Default policy ACTIVE; eligible referrer; OPEN IC requisition; one referral reviewed"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id }
            - call: "POST /erp/referrals/${ref_1}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
          trigger:
            - call: "GET /erp/referrals/${ref_1}/events"
              as: Recruiter
          assert:
            - "Exactly 2 events: SUBMIT (null -> SUBMITTED) then REVIEW (SUBMITTED -> UNDER_REVIEW)"
            - "Event entries expose id and created_at but no version field (append-only, common_fields false)"
            - "actor_user_id on SUBMIT == ${emp_a} and on REVIEW == ${rec_id}"

      - name: tax_profile_upsert_reverts_verified_on_update
        claim_type: valid_transition
        grounds: [entities.TaxProfile, state_machines.TaxProfile.VERIFIED_to_SUBMITTED]
        distinguishing_aspect: "The 1:1 tax profile upserts (no duplicate rows); updating a VERIFIED profile re-opens verification (status SUBMITTED) while preserving ytd fields."
        test_recipe:
          setup: ["Employee exists"]
          setup_api_calls:
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
          trigger:
            - call: "PUT /erp/employees/${emp_a}/tax-profile"
              payload: { filing_status: "SINGLE", withholding_method: "FLAT", ytd_carryover_cents: 1000 }
              as: Employee
              as_user_id: "${emp_a}"
            - call: "POST /erp/employees/${emp_a}/tax-profile/verify"
              as: PayrollProcessor
            - call: "PUT /erp/employees/${emp_a}/tax-profile"
              payload: { filing_status: "MARRIED", withholding_method: "AGGREGATE" }
              as: Employee
              as_user_id: "${emp_a}"
            - call: "GET /erp/employees/${emp_a}/tax-profile"
              as: PayrollProcessor
          assert:
            - "GET returns an array of length 1 (1:1 upsert, no duplicate TaxProfile rows)"
            - "After the second PUT: status == SUBMITTED (re-opened), filing_status == MARRIED, withholding_method == AGGREGATE"
            - "ytd_carryover_cents reset to 0 (default) because the update omitted it"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: referral_advance_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Referral, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "advance to_state=SCREENING is only defined from QUALIFIED; from SUBMITTED it fails with 409 ERR_INVALID_STATE and no event is appended."
        test_recipe:
          setup: ["Default policy ACTIVE; eligible referrer; OPEN IC requisition; one SUBMITTED referral"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id }
          trigger:
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Referral.${ref_1}.status remains SUBMITTED and its event log still holds exactly 1 entry (SUBMIT)"

      - name: referral_withdraw_from_completed_returns_already_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.Referral, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "COMPLETED is terminal; withdraw from COMPLETED fails with 409 ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["Default policy ACTIVE; IC referral hired 2026-08-01; clock advanced to 2027-01-28 and swept so the referral is COMPLETED"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id }
            - call: "POST /erp/referrals/${ref_1}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_1}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /erp/_ops/evaluate"
              as: TalentAdmin
          trigger:
            - call: "POST /erp/referrals/${ref_1}/withdraw"
              as: Employee
              as_user_id: "${emp_a}"
              captures: { err: $.data.error_id }
          assert:
            - "Referral was COMPLETED before the trigger"
            - "error_id == ERR_ALREADY_TERMINAL (409); status remains COMPLETED"

      - name: milestone_double_approve_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.BonusMilestone.EARNED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approve is defined only from EARNED; the second approve of the same milestone fails with 409 ERR_INVALID_STATE (idempotency-by-state)."
        test_recipe:
          setup: ["Default policy ACTIVE; IC referral hired; HIRE milestone approved once"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "PUT /erp/employees/${emp_a}/tax-profile"
              payload: { filing_status: "SINGLE", withholding_method: "FLAT" }
              as: Employee
              as_user_id: "${emp_a}"
            - call: "POST /erp/employees/${emp_a}/tax-profile/verify"
              as: PayrollProcessor
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id }
            - call: "POST /erp/referrals/${ref_1}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_1}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "GET /erp/milestones"
              payload: { referral_id: "${ref_1}", kind: "HIRE" }
              as: PayrollProcessor
              captures: { ms_1: "$.data[0].id" }
            - call: "POST /erp/milestones/${ms_1}/approve"
              as: PayrollProcessor
          trigger:
            - call: "POST /erp/milestones/${ms_1}/approve"
              as: PayrollProcessor
              captures: { err: $.data.error_id }
          assert:
            - "Second approve: error_id == ERR_INVALID_STATE (409); milestone remains APPROVED with withholding_cents == 9900"

      - name: batch_add_after_seal_returns_batch_not_open
        claim_type: precondition_enforcement
        grounds: [state_machines.PayrollBatch.OPEN_to_SEALED, "errors[ERR_BATCH_NOT_OPEN]"]
        distinguishing_aspect: "Attaching a milestone to a SEALED batch fails with ERR_BATCH_NOT_OPEN; the batch version is unchanged by the failed call."
        test_recipe:
          setup: ["Default policy ACTIVE; IC referral hired and HIRE milestone APPROVED; batch created then SEALED"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "PUT /erp/employees/${emp_a}/tax-profile"
              payload: { filing_status: "SINGLE", withholding_method: "FLAT" }
              as: Employee
              as_user_id: "${emp_a}"
            - call: "POST /erp/employees/${emp_a}/tax-profile/verify"
              as: PayrollProcessor
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id }
            - call: "POST /erp/referrals/${ref_1}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "SCREENING" }
