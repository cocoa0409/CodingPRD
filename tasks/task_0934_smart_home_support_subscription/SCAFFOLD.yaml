  - method: GET
    path: "/smart-home-support/surveys/{id}"
    description: "Read one satisfaction survey."
    roles: [PlatformAdmin, SupportAgent, Owner]
    code: 200
    input: []
    output: SatisfactionSurvey
    side_effects: []

  - method: GET
    path: "/smart-home-support/service-credits"
    description: "List service credits, filterable by household, subscription or ticket."
    roles: [PlatformAdmin, BillingAdmin, SupportAgent, Owner]
    code: 200
    input: ["household_id?", "subscription_id?", "ticket_id?", "limit?", "offset?"]
    output: ServiceCredit[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/service-credits/{id}"
