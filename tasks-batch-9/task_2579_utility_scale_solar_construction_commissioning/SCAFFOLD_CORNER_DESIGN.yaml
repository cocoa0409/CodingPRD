          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Ledger Sync Flat", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, yzv: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 60, pallets: 100, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${yzv}" }
              as: ProcurementCoordinator
              captures: { dlv: $.data.id }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { res0: $.data.reserved_pallets, avail0: $.data.available_pallets, v1: $.data.version }
          trigger:
            - call: "POST /solar/deliveries/${dlv}/receipt"
              payload: { received_unit_qty: 60, damaged_unit_qty: 4, inspection_note: "glass breakage across four pallets" }
              as: ProcurementCoordinator
              captures: { st: $.data.status, dr: $.data.damage_ratio, acc: $.data.accepted_unit_qty }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { res1: $.data.reserved_pallets, avail1: $.data.available_pallets, v2: $.data.version }
          assert:
            - "${res0} == 100 and ${avail0} == 0 before the receipt"
            - "${dr} == 0.0667 (round_half_up(4 / 60, 4)) and ${st} == REJECTED because 0.0667 > MAX_DAMAGE_RATIO"
            - "${acc} == 0"
            - "${res1} == 0 and ${avail1} == 100 — the ancestor ledger was resynchronized in the same request, and 100 == 0 + 100 still holds"
            - "${v2} == ${v1} + 1 — the release is a versioned write on the zone"

