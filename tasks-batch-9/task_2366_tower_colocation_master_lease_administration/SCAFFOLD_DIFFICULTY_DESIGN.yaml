      - name: empty_finding_set_audit_finalize_yields_zero_total
        metric: "EquipmentAudit.retroactive_billing_total_cents over an empty input set (zero OPEN findings)"
        endpoint: "POST /tower-colo/equipment-audits/{id}/finalize"
        grounds:
          - calculations.retroactive_unauthorized_billing
          - state_machines.EquipmentAudit.IN_PROGRESS_to_FINALIZED
          - entities.EquipmentAudit.fields.retroactive_billing_total_cents
        distinguishing_aspect: |
          A third metric at the degenerate end of its range: the aggregation is taken over an
          EMPTY collection. Finalizing a clean walk-down must still succeed, write a total of 0
          rather than null, and leave every tenant untouched — no balance moves, no credit flip,
          no privilege change. Implementations that guard the cascade on "at least one finding"
          typically either reject the call or leave the total unset.
