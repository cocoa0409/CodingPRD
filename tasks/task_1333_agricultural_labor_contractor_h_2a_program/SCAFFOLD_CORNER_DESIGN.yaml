            - "st1 == DEBARRED (refresh before 2027-08-01 is a no-op 200)"
            - "st2 == ACTIVE at exactly debarment_ends_on (inclusive reinstatement boundary) and debarment_ends_on cleared to null"
            - "st3 == SUBMITTED after reinstatement"

