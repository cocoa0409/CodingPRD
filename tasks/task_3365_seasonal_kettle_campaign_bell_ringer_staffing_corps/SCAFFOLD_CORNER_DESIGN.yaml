        distinguishing_aspect: |
          With one DEPOSITED collection of 70000, one still-SUBMITTED collection of 50000 and one
          ATTRIBUTED gift of 25000, the campaign total is 95000 — the SUBMITTED collection is
          excluded by the status filter, proving the input set is filtered rather than summed over
          every row.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z"
            - "one ACTIVE campaign and one ACTIVE kettle location"
            - "collection A counted 70000 and DEPOSITED; collection B counted 50000 and left SUBMITTED"
            - "one DigitalGiving of 25000 ATTRIBUTED to the location"
