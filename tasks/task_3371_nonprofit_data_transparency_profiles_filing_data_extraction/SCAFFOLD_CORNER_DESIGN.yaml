          assert:
            - "DataLicense.${lic_id}.status == EXPIRED"
            - "Organization.${o_id}.active_license_count == 0"
            - "GET /nonprofits/organizations/${o_id}/licenses?status=ACTIVE returns 0 rows"

  # ===========================================================================
  - section: calculations
    instances:

      - name: extract_field_applies_the_usd_thousands_unit_multiplier
        claim_type: Constants Applied
        grounds:
          - calculations.extract_field_normalization
          - entities.ExtractedField.fields.raw_format
        distinguishing_aspect: "The same raw digits normalize to different cents per raw_format: 12.5 USD_THOUSANDS is 1250000 cents while 12.5 USD_MILLIONS is 1250000000 cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with one filing."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
          trigger:
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "12.5", raw_format: "USD_THOUSANDS", is_revenue_component: true }, { line_code: "PROGREV", raw_value: "12.5", raw_format: "USD_MILLIONS", is_revenue_component: true }, { line_code: "CONTRIB", raw_value: "12.5", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/filings/${f_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
          assert:
            - "the TOTREV field normalized_value_cents == 1250000"
            - "the PROGREV field normalized_value_cents == 1250000000"
            - "the CONTRIB field normalized_value_cents == 1250"
            - "Filing.${f_id}.total_revenue_cents == 1251251250"
            - "Filing.${f_id}.extraction_confidence_pct == 92.0 — the mean of 92.0 (USD_THOUSANDS), 85.0 (USD_MILLIONS) and 99.0 (USD_WHOLE)"

      - name: extract_field_rounds_half_up_away_from_zero_at_an_exact_half_cent
        claim_type: Precision
        grounds:
          - calculations.extract_field_normalization
          - entities.ExtractedField.fields.normalized_value_cents
        distinguishing_aspect: "An exact .5 cent rounds away from zero: 0.125 USD_WHOLE is 12.5 cents and must round to 13, not 12."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with one filing."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
          trigger:
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "0.125", raw_format: "USD_WHOLE", is_revenue_component: true }, { line_code: "PROGREV", raw_value: "0.135", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/filings/${f_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
          assert:
            - "the TOTREV field normalized_value_cents == 13 — 12.5 rounds half up"
            - "the PROGREV field normalized_value_cents == 14 — 13.5 rounds half up"
            - "Filing.${f_id}.total_revenue_cents == 27"
            - "the sum-then-round counterfactual round_half_up(12.5 + 13.5) == 26 is NOT the stored value"

      - name: filing_revenue_excludes_pending_and_conflict_lines
        claim_type: Input Set Filtering
        grounds:
          - calculations.filing_total_revenue_normalized_cents
          - calculations.filing_total_revenue_normalized_cents.input_set
        distinguishing_aspect: "Only NORMALIZED and CORRECTED revenue lines enter the sum; a PENDING line that was never normalized and a CONFLICT duplicate contribute nothing even though they are revenue components."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with one filing carrying one clean TOTREV line and one duplicate TOTREV pair."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "1000.00", raw_format: "USD_WHOLE", is_revenue_component: true }, { line_code: "PROGREV", raw_value: "500.00", raw_format: "USD_WHOLE", is_revenue_component: true }, { line_code: "PROGREV", raw_value: "700.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
          trigger:
            - call: "POST /nonprofits/filings/${f_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
          assert:
            - "Filing.${f_id}.total_revenue_cents == 100000 — only the unique TOTREV line counts"
            - "the two PROGREV lines both have normalization_status CONFLICT and null normalized_value_cents"
            - "Filing.${f_id}.extracted_field_count == 3 but only 1 line entered the sum"

      - name: organization_total_revenue_ignores_superseded_and_non_normalized_filings
        claim_type: Input Set Filtering
        grounds:
          - calculations.organization_total_revenue_cents
          - entities.Organization.fields.latest_filing_tax_year
        distinguishing_aspect: "The aggregate sums only filings with status NORMALIZED and superseded_by_revision_number null, so a SUPERSEDED revision and a RECEIVED revision both contribute zero and latest_filing_tax_year tracks only the included set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with a NORMALIZED 2025 filing worth 100000 cents, plus a 2024 FORM_990_EZ filing still in RECEIVED."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - *c_extract
            - *c_normalize
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { o_v2: "$.data.version" }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990_EZ", form_version_year: 2023, tax_year: 2024, coverage_start: "2024-01-01T00:00:00Z", coverage_end: "2024-12-31T00:00:00Z", source: "ORG_UPLOAD", expected_organization_version: "${o_v2}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { f_ez: "$.data.id" }
          trigger:
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          assert:
            - "Organization.${o_id}.total_revenue_cents == 100000 — the RECEIVED 2024 filing contributes nothing"
            - "Organization.${o_id}.latest_filing_tax_year == 2025"
            - "Filing.${f_ez}.status == RECEIVED and total_revenue_cents == 0"

      - name: provisional_completeness_leadership_and_governance_dimensions_score_zero_without_officers
        claim_type: Correct Result
        grounds:
          - calculations.provisional_completeness_score
          - entities.Organization.fields.provisional_completeness_score
        distinguishing_aspect: "With three non-officer, non-independent leadership rows the LEADERSHIP and GOVERNANCE dimensions both score 0.0, so the provisional score is 25 rather than the 55 a naive row-count reading would produce."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DRAFT organization with one PUBLIC program carrying subject code B82 and three PUBLIC leadership rows that are neither officers nor independent."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Nils Berg", office_title: "Advisor", service_start: "2024-01-01T00:00:00Z", is_officer: false, is_independent: false, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${o_id}"
            - call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Ora Finch", office_title: "Counsel", service_start: "2024-01-01T00:00:00Z", is_officer: false, is_independent: false, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${o_id}"
            - call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Pia Lund", office_title: "Historian", service_start: "2024-01-01T00:00:00Z", is_officer: false, is_independent: false, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${o_id}"
          trigger:
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          assert:
            - "Organization.${o_id}.provisional_completeness_score == 25 — PROGRAMS 0.15 + MISSION 0.10 only"
            - "Organization.${o_id}.disclosure_pct == 0.4500 — PROGRAMS 0.15 + LEADERSHIP 0.20 + MISSION 0.10, with GOVERNANCE at 0.0 because no row is an officer and none is independent"
            - "Organization.${o_id}.verification_level == SELF_REPORTED so profile_completeness_score == provisional_completeness_score"

      - name: disclosure_pct_governance_dimension_needs_an_independent_public_officer
        claim_type: Correct Result
        grounds:
          - calculations.disclosure_pct
          - entities.Organization.fields.disclosure_pct
        distinguishing_aspect: "The GOVERNANCE disclosure dimension scores 0.5 for any officer but only 1.0 for an officer who is both independent and PUBLIC, so flipping is_independent moves disclosure_pct by exactly 0.05."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DRAFT organization with one PUBLIC program, one PUBLIC officer who is not independent, and a mission statement plus NTEE code."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Quinn Alder", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: false, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { chair: "$.data.id" }
          trigger:
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { pct_before: "$.data.disclosure_pct" }
            - call: "POST /nonprofits/organizations/${o_id}/leadership-members"
              payload: { full_name: "Rex Amari", office_title: "Audit Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${o_id}"
          assert:
            - "pct_before == 0.5000 — PROGRAMS 0.15 + LEADERSHIP 0.20 + MISSION 0.10 + GOVERNANCE 0.5*0.10"
            - "GET /nonprofits/organizations/${o_id} now reports disclosure_pct == 0.5500"
            - "the delta is exactly 0.0500, the GOVERNANCE weight 0.10 times the 0.5 step"

      - name: license_platform_tier_pays_the_base_fee_below_its_included_records
        claim_type: Constants Applied
        grounds:
