        distinguishing_aspect: |
          true_up_cents is the closure of the whole year:
          paid 4,000,000 + settlement burden 306,000 - accrued 2,135,304
          = 2,170,696. The same plan settled with an empty ledger trues up to
          4,306,000, so the figure proves the posted accrual (itself
