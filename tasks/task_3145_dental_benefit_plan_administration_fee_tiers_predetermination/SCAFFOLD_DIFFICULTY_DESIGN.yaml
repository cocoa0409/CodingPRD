              captures: { max_post: "$.data[0].annual_max_used_cents" }
          assert:
            - "immediately after adjudication the accumulator's annual_max_used_cents == 4000 (floor(8000*50/100))"
            - "after ADJUDICATED -> VOID the accumulator's annual_max_used_cents == 0 — identical to its pre-claim value (invariant restored)"
            - "Claim.status == VOID and total_plan_pay_cents remains recorded on the claim but no longer contributes to the accumulator"

      - name: void_of_second_claim_restores_deductible_to_first_claims_level
        grounds:
          - calculations.annual_max_accumulator
          - state_machines.Claim.PAID_to_VOID
          - entities.BenefitAccumulator.fields.deductible_met_cents
        distinguishing_aspect: |
          Conserved quantity = BenefitAccumulator.deductible_met_cents
          (distinct from annual_max_used_cents). Two claims draw the
          deductible 10000 then 5000 against a 15000 deductible; voiding the
          second claim must restore deductible_met_cents to exactly the first
          claim's 10000 — not to zero, not to 15000.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan: deductible 15000, max 150000, prev 100 / basic 80 / major 50, no waiting, ABP off; PPO provider; schedule D2391 BASIC 10000 ACTIVE; subscriber effective 2026-01-01."
            - "Claim 1 (D2391 submitted 10000) adjudicated + PAID: deductible_met 10000, plan 0."
            - "Claim 2 (D2391 submitted 10000) adjudicated + PAID: deductible_met 15000, plan 4000."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-CI2", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 15000, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567805", legal_name: "Smile Dental 16", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2391", allowed_cents: 10000, category: "BASIC", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-CI2", full_name: "Quinn Prime", date_of_birth: "1977-07-07T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2391", tooth_number: "19", submitted_amount_cents: 10000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_1: $.data.id }
            - call: "POST /dental/claims/${claim_1}/pay"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-03-01T00:00:00Z", received_date: "2026-03-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2391", tooth_number: "20", submitted_amount_cents: 10000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_2: $.data.id }
            - call: "POST /dental/claims/${claim_2}/pay"
              payload: {}
              as: ClaimsExaminer
              captures: { claim_2_v: $.data.version }
          trigger:
            - call: "POST /dental/claims/${claim_2}/void"
              payload: { expected_claim_version: "${claim_2_v}" }
              as: ClaimsExaminer
            - call: "GET /dental/subscribers/${sub_id}/accumulators"
              payload: {}
              as: ClaimsExaminer
              captures: { ded_post: "$.data[0].deductible_met_cents", max_post: "$.data[0].annual_max_used_cents" }
          assert:
            - "after voiding claim 2: deductible_met_cents == 10000 (claim 1's draw survives; claim 2's 5000 is reversed)"
            - "annual_max_used_cents == 0 (claim 1 paid 0 because its entire allowed amount went to deductible; claim 2's 4000 reversed)"
            - "claim 1 remains PAID — voiding claim 2 does not disturb it"
