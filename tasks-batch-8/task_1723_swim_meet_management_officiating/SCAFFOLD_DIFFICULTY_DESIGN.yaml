            - { call: "POST /officials", payload: { meet_id: "${meet_s}", full_name: "Ref S", lsc_membership_id: "LSC-RS", certifications: ["REFEREE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_sr: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_s}", full_name: "Jud S", lsc_membership_id: "LSC-JS", certifications: ["STROKE_TURN_JUDGE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_sj: "$.data.id" } }
            - { call: "POST /events/${ev_s}/official-assignments", payload: { official_id: "${off_sr}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_sr: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_sr}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_sr}" }
            - { call: "POST /events/${ev_s}/official-assignments", payload: { official_id: "${off_sj}", role_on_deck: "STROKE_TURN_JUDGE" }, as: MeetDirector, captures: { oa_sj: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_sj}/confirm", payload: {}, as: DeckOfficial, as_user_id: "${off_sj}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_s}/close-entries", payload: {}, as: MeetDirector, captures: { meet_s_v: "$.data.version" } }
            - { call: "POST /meets/${meet_s}/seed", payload: { expected_meet_version: "${meet_s_v}" }, as: MeetDirector }
            - { call: "POST /events/${ev_s}/start", payload: {}, as: MeetDirector, captures: { ev_s_v: "$.data.version" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_sa}" }, as: Any, captures: { lane_sa: "$.data[0].id" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_sb}" }, as: Any, captures: { lane_sb: "$.data[0].id" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_sc}" }, as: Any, captures: { lane_sc: "$.data[0].id" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_sd}" }, as: Any, captures: { lane_sd: "$.data[0].id" } }
            - { call: "POST /lane-assignments/${lane_sa}/readings", payload: { pad_cs: 2490, backup1_cs: 2495, backup2_cs: 2497 }, as: TimingOperator }
            - { call: "POST /lane-assignments/${lane_sb}/readings", payload: { pad_cs: 2500, backup1_cs: 2505, backup2_cs: 2507 }, as: TimingOperator }
            - { call: "POST /lane-assignments/${lane_sc}/readings", payload: { pad_cs: 2500, backup1_cs: 2505, backup2_cs: 2507 }, as: TimingOperator }
            - { call: "POST /lane-assignments/${lane_sd}/readings", payload: { pad_cs: 2510, backup1_cs: 2514, backup2_cs: 2516 }, as: TimingOperator }
            - { call: "POST /meets", payload: { meet_name: "MT", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z", scoring_tie_policy: "TOP" }, as: MeetDirector, captures: { meet_t: "$.data.id" } }
            - { call: "POST /meets/${meet_t}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_t}", team_code: "TOP", team_name: "Topville" }, as: MeetDirector, captures: { team_t: "$.data.id" } }
