              captures: { v6a_id: $.data.id }
            - call: "POST /api-versions/${v6a_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products/${p6_id}/versions"
              payload: { semver: "1.1.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v6b_id: $.data.id }
            - call: "POST /api-versions/${v6b_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products/${p6_id}/versions"
              payload: { semver: "1.2.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v6c_id: $.data.id }
            - call: "POST /api-versions/${v6c_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /api-versions/${v6a_id}/announce-deprecation"
              payload: { notice_days: 60 }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-versions/${v6b_id}/announce-deprecation"
              payload: { notice_days: 60 }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-versions/${v6c_id}/announce-deprecation"
              payload: { notice_days: 60 }
              as: PlatformAdmin
              as_user_id: "adm-1"
          assert:
            - "the first announcement -> 200 with ApiVersion.${v6a_id}.lifecycle_state == DEPRECATION_ANNOUNCED and sunset_at == 2026-09-30T00:00:00Z"
            - "the second announcement -> 200 with ApiVersion.${v6b_id}.lifecycle_state == DEPRECATION_ANNOUNCED and sunset_at == 2026-09-30T00:00:00Z"
            - "the third announcement -> 422 ERR_DEPRECATION_WINDOW_FULL (NOT ERR_NOTICE_PERIOD_TOO_SHORT)"
            - "ApiVersion.${v6c_id}.lifecycle_state == GENERAL_AVAILABILITY with sunset_at == null and required_notice_days == null"
            - "GET /api-products/${p6_id}/versions?lifecycle_state=DEPRECATION_ANNOUNCED returns exactly two versions, total_count == 2"
            - "after the clock reaches 2026-09-30T00:00:00Z and a checkpoint sunsets both announced versions, the same third announcement is accepted"

