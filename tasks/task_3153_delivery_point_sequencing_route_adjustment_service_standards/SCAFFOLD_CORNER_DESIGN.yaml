              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0003200", full_name: "Liv Ames", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C293", assigned_carrier_id: "${car_id}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "9 Ratio St", city: "Culver City", state_code: "CA", zip11: "902300103201", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { p_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points/${p_id}/activate"
              payload: { route_id: "${route_id}" }
              as: AddressManagementSpecialist
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/scan-events"
              payload: { delivery_point_id: "${p_id}", carrier_id: "${car_id}", scan_code: "DELIVERED", scan_datetime: "2026-08-31T10:00:00Z", gps_within_geofence: false }
              as: Carrier
              as_user_id: "${car_id}"
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/scan-events"
              payload: { delivery_point_id: "${p_id}", carrier_id: "${car_id}", scan_code: "DELIVERED", scan_datetime: "2026-09-01T10:00:00Z", gps_within_geofence: true }
              as: Carrier
              as_user_id: "${car_id}"
          trigger:
            - call: "GET /api/delivery-units/${unit_id}/scan-compliance"
              payload: { week_start: "2026-08-31" }
              as: RouteSupervisor
          assert:
            - "the two recorded scans give total_scans == 2, compliant_scans == 1, compliance_rate == 0.5, meets_target == false"
            - "a boundary run with 50 scans where 49 are compliant yields compliance_rate == 0.98 and meets_target == true (>= at equality), while 48 of 50 yields 0.96 and false"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_rejected_before_anything
        claim_type: Violation → Error
        grounds:
          - validations.priority_1_auth
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID fails 401 ERR_UNAUTHENTICATED even when the path ids do not exist — auth (priority 1) precedes existence (priority 3)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/delivery-units/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status 401 with error_id == ERR_UNAUTHENTICATED (not 404)"

      - name: forbidden_role_denied_on_exclusive_endpoint
        claim_type: Violation → Error
        grounds:
          - validations.priority_2_auth
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "A CustomerServiceRep attempting to create a delivery point (AMS-exclusive) gets 403 ERR_FORBIDDEN — role denial is checked after authentication and before body validation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit DU33 exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU33", office_name: "RBAC Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "1 Denied St", city: "Culver City", state_code: "CA", zip11: "902300103301", point_kind: "RESIDENTIAL" }
              as: CustomerServiceRep
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_FORBIDDEN"
            - "no point created (list returns 0 rows)"

      - name: body_fk_reference_not_found
        claim_type: Violation → Error
        grounds:
          - validations.priority_4_existence
          - errors.ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid unit create pointing at a nonexistent delivery_office_facility_id fails 422 ERR_REFERENCE_NOT_FOUND — body FKs are a different error class (422) from path misses (404)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU34", office_name: "Orphan Station", delivery_office_facility_id: "00000000-0000-0000-0000-000000000000", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id == ERR_REFERENCE_NOT_FOUND"

      - name: coa_temporary_end_date_window_enforced
        claim_type: Violation → Error
        grounds:
          - validations.priority_10_business_temporal
          - errors.ERR_TEMPORAL_WINDOW
        distinguishing_aspect: "A TEMPORARY COA with end_date exactly begin+364 days is accepted; begin+365 is rejected — the one-day boundary on the longest legal temporary forward."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit DU35 with OCCUPIED point."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
