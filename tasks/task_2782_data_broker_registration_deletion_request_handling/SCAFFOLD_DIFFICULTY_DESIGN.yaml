# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2782 — Data Broker Registration & Deletion Request Handling
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every instance grounds in
# elements already declared in SCAFFOLD.yaml §1.1-§1.7; deleting this file
# leaves the declared behaviour identical.
#
# Every monetary and score literal in an `assert:` below was produced by
# executing the corresponding §1.3 `formula:` against its `constants:` in
# Python with Decimal ROUND_HALF_UP — none is an estimate.
#
# Clock convention: every chain sets the logical clock to 2026-09-01T00:00:00Z
# as its first call, so the scaffold's 2026-08-01T00:00:00Z startup default is
# never relied on implicitly.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: filing_fee_provisional_at_submit_versus_final_at_acceptance
        grounds:
          - calculations.filing_fee_assessment
          - entities.Registration.fields.provisional_filing_fee_cents
          - entities.Registration.fields.final_filing_fee_cents
          - entities.Registration.fields.charged_fee_cents
          - entities.Registration.fields.coverage_days
          - entities.DataBroker.fields.fee_credit_cents
          - entities.DataBroker.fields.fee_paid_cents
          - state_machines.Registration.DRAFT_to_SUBMITTED
          - state_machines.Registration.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Fiscal domain on Registration: the PROVISIONAL_AT_SUBMIT variant charges the
          un-prorated full-year assessment 65225 while FINAL_AT_ACCEPTANCE prorates the
          same disclosure set by 181/365 to 32344, and the 23693-cent difference is
          settled back from DataBroker.fee_paid_cents into fee_credit_cents at acceptance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One DataBroker operating in CA with 500000 cents of filing-fee credit deposited."
            - "One CA Registration covering [2026-09-01, 2027-03-01) — exactly 181 whole days."
            - "All six disclosure categories present, each with content of at least 40 characters; the SENSITIVE_CATEGORIES and MINORS_DATA items carry covers_sensitive_categories true so their surcharges are multiplied by 1.35 to 8100 and 10125."
            - "The filing has been SUBMITTED, so provisional_filing_fee_cents is already frozen at 65225."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Northgate Data Cooperative", primary_contact_email: "compliance@northgate.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Aggregates consumer purchase and location signals into advertising audience segments." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California data broker registry filing covering purchase and location audience data.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Public records, loyalty programme partners and licensed survey panels supply the source data.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "RECIPIENTS", content: "Advertising networks, analytics vendors and credit marketing affiliates receive the segments.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "RETENTION", content: "Records are retained for thirty-six months after the last verified engagement event.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "OPT_OUT_MECHANISM", content: "Consumers opt out through the web portal, the state platform or a recognised GPC signal.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SENSITIVE_CATEGORIES", content: "Precise geolocation and health inference categories are held under explicit consent only.", covers_sensitive_categories: true }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "MINORS_DATA", content: "No records knowingly relating to consumers under sixteen years of age are collected.", covers_sensitive_categories: true }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_id}"
          trigger:
            - call: "POST /registrations/${reg_id}/accept"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Registration.${reg_id}.status == ACCEPTED"
            - "Registration.${reg_id}.coverage_days == 181"
            - "Registration.${reg_id}.disclosure_completeness_score == 100.00"
            - "Registration.${reg_id}.provisional_filing_fee_cents == 65225"
            - "Registration.${reg_id}.final_filing_fee_cents == 32344"
            - "Registration.${reg_id}.charged_fee_cents == 32344"
            - "Registration.${reg_id}.final_filing_fee_cents != Registration.${reg_id}.provisional_filing_fee_cents"
            - "DataBroker.${broker_id}.fee_paid_cents == 32344"
            - "DataBroker.${broker_id}.fee_credit_cents == 467656"
            - "DataBroker.${broker_id}.fee_deposited_cents == 500000"
            - "DataBroker.${broker_id}.registry_standing == COMPLIANT"
            - "DataBroker.${broker_id}.delinquent_since == null"

      - name: identity_assurance_platform_asserted_floor_versus_fraud_weighted
        grounds:
          - calculations.identity_assurance_score
          - entities.VerificationAttempt.fields.variant_applied
          - entities.VerificationAttempt.fields.raw_score
          - entities.VerificationAttempt.fields.assurance_score
          - entities.VerificationAttempt.fields.outcome
          - entities.DeletionRequest.fields.intake_channel
          - state_machines.DeletionRequest.RECEIVED_to_VERIFICATION_PENDING
        distinguishing_aspect: |
          Risk domain on VerificationAttempt: byte-identical evidence (PLATFORM_ASSERTION,
          zero evidence points, document_quality_score 0, an assertion reference present)
          scores 70.00 and PASSES on a STATE_PLATFORM request because the PLATFORM_ASSERTED
          floor applies, and 25.00 and FAILS on a DIRECT_PORTAL request under FRAUD_WEIGHTED
          — the variant is selected by the parent request's intake_channel, not by the attempt.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One DataBroker with two consumer records, neither carrying sensitive categories."
            - "Consumer A has an open DeletionRequest with intake_channel STATE_PLATFORM; Consumer B has an open DeletionRequest with intake_channel DIRECT_PORTAL. Both are in RECEIVED and neither has any prior attempt, so failed_attempt_count is 0 on both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Northgate Data Cooperative", primary_contact_email: "compliance@northgate.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Aggregates consumer purchase and location signals into advertising audience segments." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:aaaa1111aaaa1111", state_code: "CA", source_label: "LOYALTY_PARTNER_A", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_a_id: $.data.id, consumer_a_v: $.data.version }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:bbbb2222bbbb2222", state_code: "CA", source_label: "LOYALTY_PARTNER_A", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_b_id: $.data.id, consumer_b_v: $.data.version }
            - call: "POST /deletion-requests"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_a_id}", intake_channel: "STATE_PLATFORM", requested_scope: "DELETE_ALL", expected_consumer_version: "${consumer_a_v}" }
              as: StatePlatform
              captures: { req_a_id: $.data.id }
            - call: "POST /deletion-requests"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_b_id}", intake_channel: "DIRECT_PORTAL", requested_scope: "DELETE_ALL", expected_consumer_version: "${consumer_b_v}" }
              as: IntakeAgent
              captures: { req_b_id: $.data.id }
          trigger:
            - call: "POST /deletion-requests/${req_a_id}/verification-attempts"
              payload: { method: "PLATFORM_ASSERTION", evidence_points_count: 0, document_quality_score: 0, platform_assertion_reference: "CA-DELETE-PLATFORM-2026-000771" }
              as: StatePlatform
              captures: { att_a_id: $.data.id }
            - call: "POST /deletion-requests/${req_b_id}/verification-attempts"
              payload: { method: "PLATFORM_ASSERTION", evidence_points_count: 0, document_quality_score: 0, platform_assertion_reference: "CA-DELETE-PLATFORM-2026-000771" }
              as: IntakeAgent
              captures: { att_b_id: $.data.id }
          assert:
            - "VerificationAttempt.${att_a_id}.variant_applied == PLATFORM_ASSERTED"
            - "VerificationAttempt.${att_a_id}.raw_score == 25.00"
            - "VerificationAttempt.${att_a_id}.fraud_penalty_applied == 0.00"
            - "VerificationAttempt.${att_a_id}.assurance_score == 70.00"
            - "VerificationAttempt.${att_a_id}.outcome == PASS"
            - "VerificationAttempt.${att_b_id}.variant_applied == FRAUD_WEIGHTED"
            - "VerificationAttempt.${att_b_id}.raw_score == 25.00"
            - "VerificationAttempt.${att_b_id}.assurance_score == 25.00"
            - "VerificationAttempt.${att_b_id}.outcome == FAIL"
            - "DeletionRequest.${req_a_id}.identity_assurance_score == 70.00"
            - "DeletionRequest.${req_a_id}.failed_attempt_count == 0"
            - "DeletionRequest.${req_b_id}.identity_assurance_score == 25.00"
            - "DeletionRequest.${req_b_id}.failed_attempt_count == 1"
            - "DeletionRequest.${req_a_id}.status == VERIFICATION_PENDING"
            - "DeletionRequest.${req_b_id}.status == VERIFICATION_PENDING"

  - rule_id: combinatorial_formula
    instances:
      - name: filing_fee_nested_rounding_order_aggregate_then_prorate
        grounds:
          - calculations.filing_fee_assessment
          - entities.DisclosureItem.fields.surcharge_cents
          - entities.DisclosureItem.fields.covers_sensitive_categories
          - entities.Registration.fields.final_filing_fee_cents
          - entities.Registration.fields.coverage_days
          - state_machines.Registration.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Nested-rounding mode: the FINAL_AT_ACCEPTANCE variant sums the six already-rounded
          per-category surcharges with the base, prorates the aggregate by 120/365 and rounds
          exactly once, yielding 21444; prorating and rounding each of the seven components
          separately and then summing yields 21445, so the single-cent gap falsifies any
          implementation that reorders the rounding step.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One DataBroker operating in CA with 500000 cents of filing-fee credit."
            - "One CA Registration covering [2026-09-01, 2026-12-30) — exactly 120 whole days."
            - "All six disclosure categories present with content of at least 40 characters; SENSITIVE_CATEGORIES and MINORS_DATA carry covers_sensitive_categories true, so their per-item surcharges round to 8100 and 10125 and the surcharge total is 25225."
            - "The filing is SUBMITTED with provisional_filing_fee_cents frozen at 65225."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Harborline Audience Data", primary_contact_email: "filings@harborline.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Licenses inferred household attributes to retail and insurance marketers." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2026-12-30T00:00:00Z", business_description: "Short-period California registry filing for the inferred household attribute business.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Public records, loyalty programme partners and licensed survey panels supply the source data.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { disc_sources_id: $.data.id }
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "RECIPIENTS", content: "Advertising networks, analytics vendors and credit marketing affiliates receive the segments.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "RETENTION", content: "Records are retained for thirty-six months after the last verified engagement event.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "OPT_OUT_MECHANISM", content: "Consumers opt out through the web portal, the state platform or a recognised GPC signal.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SENSITIVE_CATEGORIES", content: "Precise geolocation and health inference categories are held under explicit consent only.", covers_sensitive_categories: true }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { disc_sensitive_id: $.data.id }
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "MINORS_DATA", content: "No records knowingly relating to consumers under sixteen years of age are collected.", covers_sensitive_categories: true }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { disc_minors_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_id}"
          trigger:
            - call: "POST /registrations/${reg_id}/accept"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Registration.${reg_id}.coverage_days == 120"
            - "DisclosureItem.${disc_sources_id}.surcharge_cents == 1500"
            - "DisclosureItem.${disc_sensitive_id}.surcharge_cents == 8100"
            - "DisclosureItem.${disc_minors_id}.surcharge_cents == 10125"
            - "Registration.${reg_id}.provisional_filing_fee_cents == 65225"
            - "Registration.${reg_id}.final_filing_fee_cents == 21444"
            - "Registration.${reg_id}.final_filing_fee_cents != 21445"
            - "Registration.${reg_id}.charged_fee_cents == 21444"
            - "DataBroker.${broker_id}.fee_paid_cents == 21444"
            - "DataBroker.${broker_id}.fee_credit_cents == 478556"

      - name: regulator_adequacy_penalty_keyed_on_evidence_not_adequacy
        grounds:
          - calculations.regulator_response_adequacy
          - entities.RegulatorInquiry.fields.evidence_score
          - entities.RegulatorInquiry.fields.deficiency_penalty
          - entities.RegulatorInquiry.fields.late_response_penalty
          - entities.RegulatorInquiry.fields.adequacy_score
          - entities.RegulatorInquiry.fields.coverage_bonus_applied
          - entities.RegulatorInquiry.fields.cited_event_count
          - state_machines.RegulatorInquiry.OPEN_to_RESPONDED
          - entities.DataBroker.fields.open_breach_count
        distinguishing_aspect: |
          Circular-looking-but-pinned mode: the deficiency tier table spans the same 0..100
          band as adequacy_score, but step 2 reads the step-1 evidence_score exactly once.
          Four cited events with no mandatory-type coverage give evidence 60.00, penalty 8.00
          and adequacy 52.00; re-keying the tier on adequacy_score (or iterating to a fixed
          point) lands on 40.00, so the two readings are distinguishable by a single number.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One DataBroker whose audit trail already contains BROKER_REGISTERED, FEE_DEPOSITED, REGISTRATION_CREATED and DISCLOSURE_ADDED events and none of DELETION_REQUEST_RECEIVED, DELETION_EXECUTED or SUPPRESSION_CREATED, so the coverage bonus cannot apply."
            - "One OPEN RegulatorInquiry with response_due_at 2026-10-01T00:00:00Z, so the response is not late."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Cedarvale Consumer Insights", primary_contact_email: "regulatory@cedarvale.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Sells household demographic and purchase propensity attributes to retail marketers." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California data broker registry filing for household demographic attribute sales.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Public records, loyalty programme partners and licensed survey panels supply the source data.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /regulator-inquiries"
              payload: { broker_id: "${broker_id}", scope_note: "Produce evidence of your deletion request handling for the current registration period.", response_due_at: "2026-10-01T00:00:00Z" }
              as: Regulator
              captures: { inquiry_id: $.data.id }
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "BROKER_REGISTERED" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { ae_registered_id: "$.data[0].id" }
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "FEE_DEPOSITED" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { ae_fee_id: "$.data[0].id" }
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "REGISTRATION_CREATED" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { ae_regcreated_id: "$.data[0].id" }
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "DISCLOSURE_ADDED" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { ae_disclosure_id: "$.data[0].id" }
          trigger:
            - call: "POST /regulator-inquiries/${inquiry_id}/respond"
              payload: { cited_audit_event_ids: ["${ae_registered_id}", "${ae_fee_id}", "${ae_regcreated_id}", "${ae_disclosure_id}"] }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
          assert:
            - "RegulatorInquiry.${inquiry_id}.cited_event_count == 4"
            - "RegulatorInquiry.${inquiry_id}.coverage_bonus_applied == false"
            - "RegulatorInquiry.${inquiry_id}.evidence_score == 60.00"
            - "RegulatorInquiry.${inquiry_id}.deficiency_penalty == 8.00"
            - "RegulatorInquiry.${inquiry_id}.late_response_penalty == 0.00"
            - "RegulatorInquiry.${inquiry_id}.adequacy_score == 52.00"
            - "RegulatorInquiry.${inquiry_id}.adequacy_score != 40.00"
            - "RegulatorInquiry.${inquiry_id}.adequacy_verdict == DEFICIENT"
            - "RegulatorInquiry.${inquiry_id}.status == RESPONDED"
            - "RegulatorInquiry.${inquiry_id}.responded_at == 2026-09-01T00:00:00Z"
            - "DataBroker.${broker_id}.open_breach_count == 1"
            - "DataBroker.${broker_id}.registry_standing == DELINQUENT"

  - rule_id: non_linear_state_machine
    instances:
      - name: registration_reject_to_draft_revision_cycle_reassesses_both_fee_variants
        grounds:
          - state_machines.Registration.SUBMITTED_to_REJECTED
          - state_machines.Registration.REJECTED_to_DRAFT
          - state_machines.Registration.DRAFT_to_SUBMITTED
          - state_machines.Registration.SUBMITTED_to_ACCEPTED
          - entities.Registration.fields.revision_count
          - entities.Registration.fields.rejection_reason_code
          - calculations.filing_fee_assessment
        distinguishing_aspect: |
          Cycle shape on Registration.status: REJECTED is re-entrant into DRAFT via the
          disclosure endpoint, so the path DRAFT -> SUBMITTED -> REJECTED -> DRAFT ->
          SUBMITTED -> ACCEPTED visits SUBMITTED twice, increments revision_count to exactly 1,
          clears rejection_reason_code back to null, and re-assesses both fee variants over
          the enlarged five-item disclosure set (47000 -> 55100 provisional, 27324 final).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One DataBroker operating in CA with 500000 cents of filing-fee credit."
            - "One CA Registration covering [2026-09-01, 2027-03-01) with the four required disclosures at full content length, so disclosure_completeness_score is exactly 80.00."
            - "The filing was SUBMITTED (provisional 47000 charged) and then REJECTED with FEE_DISPUTE, which refunded the charge, so status is REJECTED, charged_fee_cents 0, fee_credit_cents 500000 and fee_paid_cents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Ridgeway Identity Graph", primary_contact_email: "filings@ridgeway.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Maintains a cross-device identity graph licensed to advertising measurement vendors." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing for the cross-device identity graph business line.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Public records, loyalty programme partners and licensed survey panels supply the source data.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
