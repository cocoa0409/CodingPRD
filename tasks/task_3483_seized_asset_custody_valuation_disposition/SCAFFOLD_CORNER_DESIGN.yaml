              as: BogusRole
              as_user_id: "nobody"
              captures: { auth_err: $.data.error_id }
          assert:
            - "the response status is 401 and auth_err == ERR_UNAUTHENTICATED"

      - name: claimant_cannot_create_valuation
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
          - roles.Appraiser
        distinguishing_aspect: "POST /custody/valuations is exclusive to Appraiser; a Claimant carrying a fully-valid payload (including a correct OCC version) is rejected 403 ERR_FORBIDDEN and no valuation is created."
        test_recipe:
          setup:
            - "One case; one asset (version 1)."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1021", judicial_district: "D. Colo.", forfeiture_type: "CIVIL", lead_agency_code: "USMS" }
