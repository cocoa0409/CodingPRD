            - "error_id == ERR_COB_CONFIG_INVALID"

      - name: plan_with_coinsurance_over_100_returns_invalid_plan_config
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors.ERR_INVALID_PLAN_CONFIG
        distinguishing_aspect: "preventive_coinsurance_pct=150 lies outside [0,100] — plan creation rejected 422 ERR_INVALID_PLAN_CONFIG."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Empty database."
          setup_api_calls:
