  - rule_id: cross_entity_state_dependency
    instances:
      - name: faire_day_sales_gated_by_season_posture
        grounds:
          - state_machines.FaireDay.SCHEDULED_to_OPEN_FOR_SALES
          - calculations.readiness_posture
          - errors[ERR_SEASON_POSTURE_BLOCKED]
        distinguishing_aspect: |
          Entity pair FaireDay -> Season: open-sales is valid only when the Season's derived
          readiness_posture is not BLOCKED; a single PENDING BUILD-phase BuildTask blocks it,
          completing the task unblocks it. Distinct pair from the booth-permit instance.
        test_recipe:
          setup:
            - "Season BUILD (volunteer_min_hours 0) with one BUILD-phase task PENDING (posture BLOCKED); day 06-06 SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Gated Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /build-tasks", payload: { season_id: "${s_id}", phase: "BUILD", name: "Erect main stage" }, as: FaireOperator, captures: { bt1: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator, captures: { err: $.data.error_id } }
            - { call: "POST /build-tasks/${bt1}/advance", payload: { to: "IN_PROGRESS" }, as: FaireOperator }
            - { call: "POST /build-tasks/${bt1}/advance", payload: { to: "DONE" }, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator, captures: { day_st: $.data.status } }
          assert:
            - "open-sales with a PENDING BUILD task returns ERR_SEASON_POSTURE_BLOCKED (posture BLOCKED)"
            - "After task DONE (posture READY): open-sales succeeds, FaireDay.status == OPEN_FOR_SALES"

      - name: booth_confirm_gated_by_food_permit
        grounds:
          - state_machines.BoothAssignment.RESERVED_to_CONFIRMED
          - state_machines.FoodPermit.APPLIED_to_ISSUED
          - errors[ERR_FOOD_PERMIT_NOT_ISSUED]
        distinguishing_aspect: |
          Entity pair BoothAssignment -> FoodPermit: a FOOD vendor's booth can confirm only when
          the same application holds an ISSUED unexpired permit; before issue it is rejected,
          after issue it succeeds. Distinct pair from the FaireDay -> Season instance.
        test_recipe:
          setup:
            - "Season BUILD (volunteer_min_hours 0); FOOD vendor JURIED_IN; booth F-09 STANDARD 80sqft RESERVED (provisional 12800); permit not yet applied for"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Health Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /vendors", payload: { business_name: "Ye Olde Pizza", category: "FOOD" }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 80, requested_location_tier: "STANDARD" }, as: Vendor, as_user_id: "${v_id}", captures: { a_id: $.data.id } }
            - { call: "POST /vendor-applications/${a_id}/decide", payload: { craft_score: 8, authenticity_score: 9, safety_score: 8, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /booth-assignments", payload: { application_id: "${a_id}", booth_site: "F-09", residency_start_date: "2026-06-06T00:00:00Z", residency_end_date: "2026-06-21T00:00:00Z" }, as: VendorCoordinator, captures: { b_id: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /booth-assignments/${b_id}/confirm", payload: {}, as: Vendor, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
            - { call: "POST /food-permits", payload: { application_id: "${a_id}" }, as: Vendor, as_user_id: "${v_id}", captures: { fp_id: $.data.id } }
            - { call: "POST /food-permits/${fp_id}/inspect", payload: { outcome: "PASSED" }, as: VendorCoordinator, captures: { fp_st: $.data.status } }
            - { call: "POST /booth-assignments/${b_id}/confirm", payload: {}, as: Vendor, as_user_id: "${v_id}", captures: { b_st: $.data.status } }
          assert:
            - "Confirm without permit returns ERR_FOOD_PERMIT_NOT_ISSUED"
            - "After inspect PASSED: FoodPermit.status == ISSUED"
            - "Second confirm succeeds: BoothAssignment.status == CONFIRMED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: rehearsal_stage_buffered_overlap
        grounds:
          - errors[ERR_REHEARSAL_OVERLAP]
          - entities.RehearsalSlot.fields.stage_name
        distinguishing_aspect: |
          Interval semantics: half-open datetimes WITH a 15-minute trailing turnover buffer on
          the stage resource — a slot starting 10 minutes after the previous slot's end still
          conflicts; one starting exactly at end+15min does not. Distinct semantics and resource
          from the booth-site instance.
        test_recipe:
          setup:
            - "Season PLANNING (volunteer_min_hours 0); contract ACCEPTED; slot MAIN 09:00-10:00 SCHEDULED (occupies [09:00, 10:15))"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Stage Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /performers", payload: { stage_name: "The Fire Sisters", act_type: "ACROBATICS", base_day_rate_cents: 15000 }, as: CastDirector, captures: { p_id: $.data.id } }
            - { call: "POST /cast-contracts", payload: { season_id: "${s_id}", performer_id: "${p_id}", offered_day_rate_cents: 15000, guaranteed_days: 2, weather_pay_pct: 0.5, required_rehearsal_hours: 6 }, as: CastDirector, captures: { c_id: $.data.id } }
            - { call: "POST /cast-contracts/${c_id}/offer", payload: {}, as: CastDirector }
            - { call: "POST /cast-contracts/${c_id}/accept", payload: {}, as: Performer, as_user_id: "${p_id}" }
            - { call: "POST /rehearsal-slots", payload: { contract_id: "${c_id}", stage_name: "MAIN", start_time: "2026-05-10T09:00:00Z", end_time: "2026-05-10T10:00:00Z" }, as: CastDirector, captures: { rs1: $.data.id } }
          trigger:
            - { call: "POST /rehearsal-slots", payload: { contract_id: "${c_id}", stage_name: "MAIN", start_time: "2026-05-10T10:10:00Z", end_time: "2026-05-10T11:00:00Z" }, as: CastDirector, captures: { err: $.data.error_id } }
            - { call: "POST /rehearsal-slots", payload: { contract_id: "${c_id}", stage_name: "MAIN", start_time: "2026-05-10T10:15:00Z", end_time: "2026-05-10T11:15:00Z" }, as: CastDirector, captures: { rs2_st: $.data.status } }
          assert:
            - "Slot starting 10:10 (inside the 15-minute turnover buffer of the 09:00-10:00 slot) rejected with ERR_REHEARSAL_OVERLAP"
            - "Slot starting exactly 10:15 (end + buffer boundary) accepted, status SCHEDULED"

      - name: booth_site_unbuffered_adjacency
        grounds:
          - errors[ERR_BOOTH_OVERLAP]
          - entities.BoothAssignment.fields.booth_site
        distinguishing_aspect: |
          Interval semantics: half-open residency date intervals with ZERO buffer on the
          booth-site resource — a residency starting exactly at another's end date is allowed,
          one overlapping by a single day conflicts. Distinct semantics (no buffer,
          date-granular) and resource (booth site) from the rehearsal-stage instance.
        test_recipe:
          setup:
            - "Season PLANNING (volunteer_min_hours 0); three artisan vendors JURIED_IN; booth B-07 residency [06-06, 06-20) RESERVED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Booth Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /vendors", payload: { business_name: "Cloak & Dagger", category: "ARTISAN" }, as: VendorCoordinator, captures: { v1: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Henna Heralds", category: "ARTISAN" }, as: VendorCoordinator, captures: { v2: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Wand Wrights", category: "ARTISAN" }, as: VendorCoordinator, captures: { v3: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${v1}", captures: { a1: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${v2}", captures: { a2: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${v3}", captures: { a3: $.data.id } }
            - { call: "POST /vendor-applications/${a1}/decide", payload: { craft_score: 8, authenticity_score: 8, safety_score: 8, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /vendor-applications/${a2}/decide", payload: { craft_score: 7, authenticity_score: 7, safety_score: 7, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /vendor-applications/${a3}/decide", payload: { craft_score: 6, authenticity_score: 6, safety_score: 6, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /booth-assignments", payload: { application_id: "${a1}", booth_site: "B-07", residency_start_date: "2026-06-06T00:00:00Z", residency_end_date: "2026-06-20T00:00:00Z" }, as: VendorCoordinator, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /booth-assignments", payload: { application_id: "${a2}", booth_site: "B-07", residency_start_date: "2026-06-20T00:00:00Z", residency_end_date: "2026-06-27T00:00:00Z" }, as: VendorCoordinator, captures: { b2_st: $.data.status } }
            - { call: "POST /booth-assignments", payload: { application_id: "${a3}", booth_site: "B-07", residency_start_date: "2026-06-19T00:00:00Z", residency_end_date: "2026-06-28T00:00:00Z" }, as: VendorCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent residency [06-20, 06-27) starting exactly at the existing end date accepted (zero buffer), status RESERVED"
            - "Residency [06-19, 06-28) overlapping by one day rejected with ERR_BOOTH_OVERLAP"

  - rule_id: compensating_invariant
    instances:
      - name: outstanding_admissions_conserved_across_cancel_and_redeem
        grounds:
          - calculations.outstanding_admissions_invariant
          - state_machines.Ticket.VALID_to_RAINCHECKED
          - state_machines.RainCheck.ISSUED_to_REDEEMED
        distinguishing_aspect: |
          Conserved quantity: admission count. Each weather cancellation converts VALID tickets
          1:1 into ISSUED rain checks and each redemption converts one ISSUED check back into one
          VALID ticket, so Season.outstanding_admissions is invariant across both waves.
          Distinct conserved quantity (count) from the money-cents instance.
        test_recipe:
          setup:
            - "Season BUILD (capacity 500, grace 14, volunteer_min_hours 0); days 06-06 and 06-13 OPEN_FOR_SALES"
            - "Two DAY orders on 06-06 PAID: qty3 (buyer ga) + qty2 (buyer gb) -> outstanding_admissions 5"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Conservation Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-13T00:00:00Z" }, as: FaireOperator, captures: { d2: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d2}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 3, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "ga@x.com", captures: { oa: $.data.id } }
            - { call: "POST /ticket-orders/${oa}/pay", payload: {}, as: Guest, as_user_id: "ga@x.com" }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 2, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "gb@x.com", captures: { ob: $.data.id } }
            - { call: "POST /ticket-orders/${ob}/pay", payload: {}, as: Guest, as_user_id: "gb@x.com" }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { oa_before: $.data.outstanding_admissions } }
          trigger:
            - { call: "POST /faire-days/${d1}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { oa_mid: $.data.outstanding_admissions } }
            - { call: "GET /tickets", payload: { order_id: "${oa}" }, as: Any, captures: { ta1: "$.data[0].id", ta2: "$.data[1].id" } }
            - { call: "GET /rain-checks", payload: { ticket_id: "${ta1}" }, as: Any, captures: { rc1: "$.data[0].id" } }
            - { call: "GET /rain-checks", payload: { ticket_id: "${ta2}" }, as: Any, captures: { rc2: "$.data[0].id" } }
            - { call: "POST /rain-checks/${rc1}/redeem", payload: { target_faire_day_id: "${d2}" }, as: Guest, as_user_id: "ga@x.com" }
            - { call: "POST /rain-checks/${rc2}/redeem", payload: { target_faire_day_id: "${d2}" }, as: Guest, as_user_id: "ga@x.com" }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { oa_after: $.data.outstanding_admissions } }
          assert:
            - "Before cancel: outstanding_admissions == 5 (5 VALID tickets, 0 ISSUED checks)"
            - "After cancel: outstanding_admissions == 5 (0 VALID on the cancelled day, 5 ISSUED checks — 1:1 conversion conserves the count)"
            - "After 2 redemptions: outstanding_admissions == 5 (2 new VALID + 3 ISSUED — redeem pair conserves the count)"

      - name: refund_money_invariant_retained_plus_refunded
        grounds:
          - calculations.refund_money_invariant
          - entities.TicketOrder.fields.retained_cents
          - errors[ERR_REFUND_EXCEEDS_PAID]
        distinguishing_aspect: |
          Conserved quantity: money cents. Every partial or full refund keeps
          refunded_cents + retained_cents == total_cents; the final overshooting refund is
          rejected. Distinct conserved quantity (cents) from the admission-count instance.
        test_recipe:
          setup:
            - "Season BUILD (group_min_size 10, volunteer_min_hours 0); day 06-06 OPEN_FOR_SALES; GROUP order qty10 unit 3000 PAID (total 27000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Refund Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "GROUP", quantity: 10, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-ref@x.com", captures: { o1: $.data.id } }
            - { call: "POST /ticket-orders/${o1}/pay", payload: {}, as: Guest, as_user_id: "g-ref@x.com" }
          trigger:
            - { call: "POST /ticket-orders/${o1}/refund", payload: { refund_cents: 5000 }, as: GateAgent, captures: { rf1: $.data.refunded_cents, rt1: $.data.retained_cents, ps1: $.data.payment_status } }
            - { call: "POST /ticket-orders/${o1}/refund", payload: { refund_cents: 22000 }, as: GateAgent, captures: { rf2: $.data.refunded_cents, rt2: $.data.retained_cents, ps2: $.data.payment_status } }
            - { call: "POST /ticket-orders/${o1}/refund", payload: { refund_cents: 1 }, as: GateAgent, captures: { err: $.data.error_id } }
          assert:
            - "After refund 5000: refunded_cents == 5000, retained_cents == 22000, payment_status == PARTIALLY_REFUNDED (5000 + 22000 == 27000 == total_cents)"
            - "After refund 22000: refunded_cents == 27000, retained_cents == 0, payment_status == REFUNDED (27000 + 0 == 27000)"
            - "Further refund of 1 cent rejected with ERR_REFUND_EXCEEDS_PAID"
