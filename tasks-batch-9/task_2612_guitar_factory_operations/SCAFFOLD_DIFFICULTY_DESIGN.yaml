          trigger: "Carry the order to SERIALIZED: POST /build-orders/${bo1}/start-assembly as Luthier (capture the returned version), POST /storage-rooms/${fb1}/climate-readings rh_pct 50.0 temp_c 21.0 as FinishTech, POST /finish-runs (${bo1}, ${fb1}, NITRO, coat_count 8, that version) as FinishTech, POST /finish-runs/{run}/complete-spray as FinishTech, POST /_clock/set_current_utc 2026-08-16T00:00:00Z, POST /finish-runs/{run}/buff then /complete as FinishTech, POST /build-orders/${bo1}/fretwork then /setup as Luthier, POST /build-orders/${bo1}/setup-inspections as Luthier lu-eve, POST /setup-inspections/{insp}/measure with action_mm_treble 1.70, action_mm_bass 2.10, relief_mm 0.20, intonation_cents_max 4.8 as lu-eve, POST /setup-inspections/{insp}/sign as QualityInspector qi-frank, POST /build-orders/${bo1}/assign-serial as CustomShopCoordinator csc-bob. Then POST /export-shipments with build_order_id ${bo1} and destination_country_code JP as ComplianceOfficer co-hank, POST /export-shipments/{ship}/attach-docs with cites_permit_number CITES-RE-9002 as co-hank, and POST /tonewood-lots/${lot1}/reject with reason PERMIT_WITHDRAWN as ComplianceOfficer co-alice. Finally POST /export-shipments/{ship}/release as ComplianceOfficer co-gina"
