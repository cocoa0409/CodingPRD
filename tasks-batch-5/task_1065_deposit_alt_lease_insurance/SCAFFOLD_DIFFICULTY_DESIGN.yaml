      - name: policy_lapsed_reinstatement_loop_returns_to_active
        grounds:
          - state_machines.Policy.ACTIVE_to_LAPSED
          - state_machines.Policy.LAPSED_to_ACTIVE
        distinguishing_aspect: |
          Policy exhibits a cyclic shape on a different entity than Claim: ACTIVE -> LAPSED ->
          ACTIVE is a legal reinstatement loop triggered by paying the overdue invoice, not a
          forward-only pipeline toward CANCELLED/EXPIRED.
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA), CA StateComplianceRule, and an ACTIVE Policy (first invoice paid) exist."
