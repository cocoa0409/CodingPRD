scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: booking_quote_vs_final_settlement_overstay_delta
        grounds:
          - calculations.booking_quote_amount
          - calculations.final_settlement_amount
          - state_machines.Booking.CHECKED_IN_to_CHECKED_OUT
          - entities.Booking.fields.quoted_amount_cents
          - entities.Booking.fields.final_amount_cents
        distinguishing_aspect: >-
          Booking-domain dual variant: provisional quoted_amount_cents (800) is frozen at
          creation while final_amount_cents (2000) recomputes from actual checkout incl.
          overstay, so final != quoted for the SAME booking.
        test_recipe:
          setup:
            - "Host H with a LISTED Spot S (base_hourly_cents=400, grace=15min), zone DT-01, availability covering April 2026."
            - "Driver D funded to 5000 cents; clock at 2026-04-08T09:00Z (Wednesday)."
            - "Booking B HOURLY [2026-04-08T10:00Z, 12:00Z), quoted 800, SETTLED, checked in at 10:00."
            - "Clock advanced to 2026-04-08T13:30Z (75 min past end+grace=12:15)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h1@x.com", display_name: "H1", payout_account_ref: "pa_1" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d1@x.com", display_name: "D1" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /drivers/${d1}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d1}"
            - call: "POST /spots"
              payload: { host_id: "${h1}", title: "S", zone_code: "DT-01", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z", overstay_grace_minutes: 15 }
              as: Host
              as_user_id: "${h1}"
              captures: { s1: $.data.id, s1v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings"
              payload: { spot_id: "${s1}", driver_id: "${d1}", rate_kind: "HOURLY", start_at: "2026-04-08T10:00:00Z", end_at: "2026-04-08T12:00:00Z", expected_spot_version: "${s1v}" }
              as: Driver
              as_user_id: "${d1}"
              captures: { b1: $.data.id, q1: $.data.quoted_amount_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b1}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${d1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T13:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${b1}/check-out"
              payload: {}
              as: Driver
              as_user_id: "${d1}"
              captures: { fin: $.data.final_amount_cents }
          assert:
            - "Booking.${b1}.quoted_amount_cents == 800"
            - "Booking.${b1}.final_amount_cents == 2000"
            - "Booking.${b1}.final_amount_cents != Booking.${b1}.quoted_amount_cents"

      - name: provisional_vs_confirmed_violation_points_escalation
        grounds:
          - calculations.confirmed_violation_points
          - entities.Driver.fields.provisional_violation_points
          - entities.Driver.fields.violation_points
          - state_machines.ViolationRecord.OPEN_to_CONFIRMED
        distinguishing_aspect: >-
          Driver-domain dual variant: provisional_violation_points uses escalation_bps fixed at
          10000 (no escalation), while confirmed violation_points applies +25%/prior-confirmed, so
          a record with 1 prior CONFIRMED yields provisional 4 but confirmed 5 on the SAME driver.
        test_recipe:
          setup:
            - "Driver D2 with one already-CONFIRMED ViolationRecord (so prior_confirmed=1 for the next)."
            - "A second OPEN ViolationRecord VR2 (violation_kind=UNAUTHORIZED_GATE w=2, base_points=2) on D2."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h2@x.com", display_name: "H2", payout_account_ref: "pa_2" }
              as: Anonymous
              captures: { h2: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d2@x.com", display_name: "D2" }
              as: Anonymous
              captures: { d2: $.data.id }
            - call: "POST /drivers/${d2}/wallet/topup"
              payload: { amount_cents: 10000 }
              as: Driver
              as_user_id: "${d2}"
            - call: "POST /spots"
              payload: { host_id: "${h2}", title: "S2", zone_code: "Z2", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h2}"
              captures: { s2: $.data.id, s2v: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${s2}", driver_id: "${d2}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T11:00:00Z", expected_spot_version: "${s2v}" }
              as: Driver
              as_user_id: "${d2}"
              captures: { b2: $.data.id }
            - call: "POST /violations"
              payload: { booking_id: "${b2}", violation_kind: "OVERSTAY", base_points: 3 }
              as: Host
              as_user_id: "${h2}"
              captures: { vr1: $.data.id }
            - call: "POST /violations/${vr1}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /violations"
              payload: { booking_id: "${b2}", violation_kind: "UNAUTHORIZED_GATE", base_points: 2 }
              as: Host
              as_user_id: "${h2}"
              captures: { vr2: $.data.id }
          trigger:
            - call: "GET /drivers/${d2}"
              payload: {}
              as: Driver
              as_user_id: "${d2}"
              captures: { prov_before: $.data.provisional_violation_points }
            - call: "POST /violations/${vr2}/confirm"
              payload: {}
              as: PlatformAdmin
              captures: { assessed2: $.data.assessed_points }
          assert:
            - "ViolationRecord.${vr2}.assessed_points == 5"
            - "Driver.${d2}.violation_points == 8"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_hourly_surge_weekday_three_input_nonlinear
        grounds:
          - calculations.booking_quote_amount
          - entities.PricingEvent.fields.surge_multiplier_bps
          - entities.Booking.fields.quoted_amount_cents
        distinguishing_aspect: >-
          Mode (a): >=3 inputs with non-linear interaction — duration units (ceil to 3 hours) x
          base_hourly (400) x surge (25000 bps) x weekend (neutral on weekday) yields 3000, not a
          linear sum.
        test_recipe:
          setup:
            - "Spot S3 base_hourly_cents=400 in zone DT-01; ACTIVE PricingEvent surge 25000 bps covering 2026-04-08."
            - "Driver D3 funded 5000; clock 2026-04-08T09:00Z (Wed)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h3@x.com", display_name: "H3", payout_account_ref: "pa_3" }
              as: Anonymous
              captures: { h3: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d3@x.com", display_name: "D3" }
              as: Anonymous
              captures: { d3: $.data.id }
            - call: "POST /drivers/${d3}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d3}"
            - call: "POST /spots"
              payload: { host_id: "${h3}", title: "S3", zone_code: "DT-01", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h3}"
              captures: { s3: $.data.id, s3v: $.data.version }
            - call: "POST /pricing-events"
              payload: { zone_code: "DT-01", window_start: "2026-04-08T00:00:00Z", window_end: "2026-04-09T00:00:00Z", surge_multiplier_bps: 25000 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings"
              payload: { spot_id: "${s3}", driver_id: "${d3}", rate_kind: "HOURLY", start_at: "2026-04-08T10:00:00Z", end_at: "2026-04-08T13:00:00Z", expected_spot_version: "${s3v}" }
              as: Driver
              as_user_id: "${d3}"
              captures: { b3: $.data.id, q3: $.data.quoted_amount_cents }
          assert:
            - "Booking.${b3}.quoted_amount_cents == 3000"

      - name: host_payout_per_line_rounding_order_pinned
        grounds:
          - calculations.host_payout_amount
          - entities.Host.fields.platform_fee_bps
          - entities.Host.fields.lifetime_payout_cents
          - entities.PayoutLedgerEntry.fields.amount_cents
        distinguishing_aspect: >-
          Mode (b): nested rounding where order matters — two EARNINGs of gross 830 at fee 1500
          bps rounded PER booking (125 each -> net 705 each -> lifetime 1410) differs from
          sum-then-round (gross 1660, fee 249 -> 1411). The pinned per-line order yields 1410.
        test_recipe:
          setup:
            - "Host H4 with platform_fee_bps=1500 and a Spot S4 with base_hourly_cents=830."
            - "Driver D4 funded 5000; two 1-hour HOURLY bookings each quoted 830, both checked in and checked out on time (no overstay)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h4@x.com", display_name: "H4", payout_account_ref: "pa_4", platform_fee_bps: 1500 }
              as: Anonymous
              captures: { h4: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d4@x.com", display_name: "D4" }
              as: Anonymous
              captures: { d4: $.data.id }
            - call: "POST /drivers/${d4}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d4}"
            - call: "POST /spots"
              payload: { host_id: "${h4}", title: "S4", zone_code: "Z4", base_hourly_cents: 830, base_daily_cents: 20000, monthly_flat_cents: 200000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z", overstay_grace_minutes: 15 }
              as: Host
              as_user_id: "${h4}"
              captures: { s4: $.data.id, s4v: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${s4}", driver_id: "${d4}", rate_kind: "HOURLY", start_at: "2026-04-08T10:00:00Z", end_at: "2026-04-08T11:00:00Z", expected_spot_version: "${s4v}" }
              as: Driver
              as_user_id: "${d4}"
              captures: { b4a: $.data.id }
            - call: "GET /spots/${s4}"
              payload: {}
              as: Host
              as_user_id: "${h4}"
              captures: { s4v2: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${s4}", driver_id: "${d4}", rate_kind: "HOURLY", start_at: "2026-04-08T11:00:00Z", end_at: "2026-04-08T12:00:00Z", expected_spot_version: "${s4v2}" }
              as: Driver
              as_user_id: "${d4}"
              captures: { b4b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b4a}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${d4}"
            - call: "POST /bookings/${b4a}/check-out"
              payload: {}
              as: Driver
              as_user_id: "${d4}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b4b}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${d4}"
            - call: "POST /bookings/${b4b}/check-out"
              payload: {}
              as: Driver
              as_user_id: "${d4}"
          trigger:
            - call: "GET /hosts/${h4}"
              payload: {}
              as: Host
              as_user_id: "${h4}"
              captures: { lifetime: $.data.lifetime_payout_cents }
          assert:
            - "Host.${h4}.lifetime_payout_cents == 1410"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_dimensions_occupancy_vs_settlement
        grounds:
          - state_machines.Booking.RESERVED_to_CHECKED_IN
          - state_machines.Booking.CHECKED_IN_to_CHECKED_OUT
          - entities.Booking.fields.occupancy_status
          - entities.Booking.fields.settlement_status
        distinguishing_aspect: >-
          Booking carries two independent state axes: settlement_status reaches SETTLED at
          creation and stays SETTLED through CHECKED_IN and CHECKED_OUT, while occupancy_status
          advances RESERVED->CHECKED_IN->CHECKED_OUT — the two dimensions move on different triggers.
        test_recipe:
          setup:
            - "Driver D5 funded; Spot S5; Booking B5 created (SETTLED), checked in, checked out on time."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h5@x.com", display_name: "H5", payout_account_ref: "pa_5" }
              as: Anonymous
              captures: { h5: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d5@x.com", display_name: "D5" }
              as: Anonymous
              captures: { d5: $.data.id }
            - call: "POST /drivers/${d5}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d5}"
            - call: "POST /spots"
              payload: { host_id: "${h5}", title: "S5", zone_code: "Z5", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z", overstay_grace_minutes: 15 }
              as: Host
              as_user_id: "${h5}"
              captures: { s5: $.data.id, s5v: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${s5}", driver_id: "${d5}", rate_kind: "HOURLY", start_at: "2026-04-08T10:00:00Z", end_at: "2026-04-08T11:00:00Z", expected_spot_version: "${s5v}" }
              as: Driver
              as_user_id: "${d5}"
              captures: { b5: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b5}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${d5}"
              captures: { occ_in: $.data.occupancy_status, set_in: $.data.settlement_status }
          trigger:
            - call: "POST /bookings/${b5}/check-out"
              payload: {}
              as: Driver
              as_user_id: "${d5}"
              captures: { occ_out: $.data.occupancy_status, set_out: $.data.settlement_status }
          assert:
            - "Booking.${b5}.occupancy_status == CHECKED_OUT"
            - "Booking.${b5}.settlement_status == SETTLED"

      - name: transfer_offer_branching_pending_to_three_terminals
        grounds:
          - state_machines.TransferOffer.PENDING_to_ACCEPTED
          - state_machines.TransferOffer.PENDING_to_DECLINED
          - state_machines.TransferOffer.PENDING_to_WITHDRAWN
          - entities.TransferOffer.fields.status
        distinguishing_aspect: >-
          TransferOffer is branching: from PENDING it forks to one of three terminals
          {ACCEPTED, DECLINED, WITHDRAWN}; a DECLINE drives PENDING->DECLINED with no booking
          reassignment (distinct side-effect set from ACCEPT), proving divergent branches.
        test_recipe:
          setup:
            - "Booking B6 held by Driver D6a; a PENDING TransferOffer to D6b created before start."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h6@x.com", display_name: "H6", payout_account_ref: "pa_6" }
              as: Anonymous
              captures: { h6: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d6a@x.com", display_name: "D6a" }
              as: Anonymous
              captures: { d6a: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d6b@x.com", display_name: "D6b" }
              as: Anonymous
              captures: { d6b: $.data.id }
            - call: "POST /drivers/${d6a}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d6a}"
            - call: "POST /spots"
              payload: { host_id: "${h6}", title: "S6", zone_code: "Z6", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h6}"
              captures: { s6: $.data.id, s6v: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${s6}", driver_id: "${d6a}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T11:00:00Z", expected_spot_version: "${s6v}" }
              as: Driver
              as_user_id: "${d6a}"
              captures: { b6: $.data.id, b6v: $.data.version }
            - call: "POST /transfer-offers"
              payload: { booking_id: "${b6}", to_driver_id: "${d6b}", expected_booking_version: "${b6v}" }
              as: Driver
              as_user_id: "${d6a}"
              captures: { off6: $.data.id }
          trigger:
            - call: "POST /transfer-offers/${off6}/decline"
              payload: {}
              as: Driver
              as_user_id: "${d6b}"
              captures: { off6_status: $.data.status }
          assert:
            - "TransferOffer.${off6}.status == DECLINED"
            - "Booking.${b6}.driver_id == ${d6a}"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_violation_suspends_driver_autocancels_and_refunds_depth4
        grounds:
          - state_machines.ViolationRecord.OPEN_to_CONFIRMED
          - calculations.confirmed_violation_points
          - calculations.driver_standing_tier
          - calculations.refund_amount
          - entities.Driver.fields.standing_tier
          - entities.Booking.fields.occupancy_status
        distinguishing_aspect: >-
          Depth-4 chain from a ViolationRecord confirm: confirm -> Driver.violation_points becomes
          12 -> standing_tier recomputes to SUSPENDED -> the driver's RESERVED Booking auto-cancels
          to CANCELLED -> that auto-cancel credits the full refund (800) to the driver wallet; each
          link is caused by the prior.
        test_recipe:
          setup:
            - "Driver D7 funded 5000, has a RESERVED Booking B7 quoted 800 (lead >7d so full refund), and an OPEN ViolationRecord VR7 (NO_SHOW w=3, base_points=4 -> assessed 12)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h7@x.com", display_name: "H7", payout_account_ref: "pa_7" }
              as: Anonymous
              captures: { h7: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d7@x.com", display_name: "D7" }
              as: Anonymous
              captures: { d7: $.data.id }
            - call: "POST /drivers/${d7}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d7}"
            - call: "POST /spots"
              payload: { host_id: "${h7}", title: "S7", zone_code: "Z7", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-06-01T00:00:00Z" }
              as: Host
              as_user_id: "${h7}"
              captures: { s7: $.data.id, s7v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings"
              payload: { spot_id: "${s7}", driver_id: "${d7}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T11:00:00Z", expected_spot_version: "${s7v}" }
              as: Driver
              as_user_id: "${d7}"
              captures: { b7: $.data.id }
            - call: "POST /violations"
              payload: { booking_id: "${b7}", violation_kind: "NO_SHOW", base_points: 4 }
              as: Host
              as_user_id: "${h7}"
              captures: { vr7: $.data.id }
          trigger:
            - call: "POST /violations/${vr7}/confirm"
              payload: {}
              as: PlatformAdmin
              captures: { tier_after: $.data.status }
          assert:
            - "Driver.${d7}.violation_points == 12"
            - "Driver.${d7}.standing_tier == SUSPENDED"
            - "Booking.${b7}.occupancy_status == CANCELLED"
            - "Booking.${b7}.settlement_status == REFUNDED"
            - "Driver.${d7}.wallet_balance_cents == 5000"

      - name: checkout_overstay_autologs_violation_sets_provisional_depth3
        grounds:
          - state_machines.Booking.CHECKED_IN_to_CHECKED_OUT
          - calculations.final_settlement_amount
          - calculations.confirmed_violation_points
          - entities.Driver.fields.provisional_violation_points
        distinguishing_aspect: >-
          Depth-3 chain from a checkout: check-out -> final_settlement_amount detects overstay ->
          an OVERSTAY ViolationRecord is auto-logged (status OPEN) -> that record creation raises
          Driver.provisional_violation_points; a different trigger than the confirm cascade.
        test_recipe:
          setup:
            - "Driver D8 funded 5000; Booking B8 HOURLY [10:00,11:00) quoted 400, checked in; clock advanced to 12:30 (overstay)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h8@x.com", display_name: "H8", payout_account_ref: "pa_8" }
              as: Anonymous
              captures: { h8: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d8@x.com", display_name: "D8" }
              as: Anonymous
              captures: { d8: $.data.id }
            - call: "POST /drivers/${d8}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d8}"
            - call: "POST /spots"
              payload: { host_id: "${h8}", title: "S8", zone_code: "Z8", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z", overstay_grace_minutes: 15 }
              as: Host
              as_user_id: "${h8}"
