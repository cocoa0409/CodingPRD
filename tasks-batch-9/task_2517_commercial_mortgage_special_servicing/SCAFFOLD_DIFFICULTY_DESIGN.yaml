  - rule_id: combinatorial_formula
    instances:
      - name: servicing_standard_required_margin_nested_max_three_way_branch
        grounds:
          - calculations.servicing_standard_analysis
          - entities.BorrowerRequest.fields.servicing_standard_margin_usd
          - entities.BorrowerRequest.fields.servicing_standard_conclusion
          - endpoints[POST /special-servicing/borrower-requests/{id}/analysis]
        distinguishing_aspect: |
          Mode (a) — nested/composed conditional. The required margin is
          max(50000, round(0.005 * principal, 2)) and BOTH branches must be able to win, so the
          same margin figure produces opposite conclusions depending on which branch dominates:
          a 60,000.00 margin on a 19,500,000.00 loan is NOT_MET (the relative branch demands
          97,500.00) while a 6,000.00 margin on a 1,000,000.00 loan is also NOT_MET (the absolute
          floor demands 50,000.00 even though the relative branch would only demand 5,000.00).
          An implementation that keeps only one branch passes exactly one of the two.
        test_recipe:
          setup:
            - "One trust. Three loans, all transferred to special servicing on a bankruptcy event."
            - "Loan BIG1 and loan BIG2 both carry current_principal_balance_usd 19,500,000.00; loan SMALL carries 1,000,000.00."
            - "One MODIFICATION borrower request per loan, each with the 25,000.00 modification deposit floor, each moved to UNDER_ANALYSIS."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-M1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-BIG1", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_big1_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-BIG2", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_big2_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-SMALL", original_balance_usd: 1100000, current_principal_balance_usd: 1000000, note_rate_pct: 6.25, monthly_debt_service_usd: 6500, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 1400000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_small_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_big1_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_big2_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_small_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_big1_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_big2_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_small_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_big1_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 25000, requested_terms_note: "rate relief to 4.50% for 24 months", proposed_rate_pct: 4.5 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { req_big1_id: "$.data.id" }
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_big2_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 25000, requested_terms_note: "rate relief to 4.50% for 24 months", proposed_rate_pct: 4.5 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { req_big2_id: "$.data.id" }
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_small_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 25000, requested_terms_note: "rate relief to 5.00% for 24 months", proposed_rate_pct: 5.0 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { req_small_id: "$.data.id" }
            - call: "POST /special-servicing/borrower-requests/${req_big1_id}/status"
              payload: { to_status: "UNDER_ANALYSIS" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/borrower-requests/${req_big2_id}/status"
              payload: { to_status: "UNDER_ANALYSIS" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/borrower-requests/${req_small_id}/status"
              payload: { to_status: "UNDER_ANALYSIS" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
          trigger:
            - call: "POST /special-servicing/borrower-requests/${req_big1_id}/analysis"
              payload: { npv_recovery_with_request_usd: 21597500, npv_recovery_without_request_usd: 21500000, analysis_discount_rate_pct: 9.5 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { big1_margin: "$.data.servicing_standard_margin_usd", big1_conclusion: "$.data.servicing_standard_conclusion" }
            - call: "POST /special-servicing/borrower-requests/${req_big2_id}/analysis"
              payload: { npv_recovery_with_request_usd: 21560000, npv_recovery_without_request_usd: 21500000, analysis_discount_rate_pct: 9.5 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { big2_margin: "$.data.servicing_standard_margin_usd", big2_conclusion: "$.data.servicing_standard_conclusion" }
            - call: "POST /special-servicing/borrower-requests/${req_small_id}/analysis"
              payload: { npv_recovery_with_request_usd: 1006000, npv_recovery_without_request_usd: 1000000, analysis_discount_rate_pct: 9.5 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { small_margin: "$.data.servicing_standard_margin_usd", small_conclusion: "$.data.servicing_standard_conclusion" }
          assert:
            - "BorrowerRequest.${req_big1_id}.servicing_standard_margin_usd == 97500.00"
            - "BorrowerRequest.${req_big1_id}.servicing_standard_conclusion == SERVICING_STANDARD_MET"
            - "BorrowerRequest.${req_big2_id}.servicing_standard_margin_usd == 60000.00"
            - "BorrowerRequest.${req_big2_id}.servicing_standard_conclusion == SERVICING_STANDARD_NOT_MET"
            - "BorrowerRequest.${req_small_id}.servicing_standard_margin_usd == 6000.00"
            - "BorrowerRequest.${req_small_id}.servicing_standard_conclusion == SERVICING_STANDARD_NOT_MET"
            - "The 60,000.00 margin is rejected while the 97,500.00 margin on the identical balance is accepted, so the relative branch is live"
            - "The 6,000.00 margin is rejected even though 0.005 * 1000000 == 5000.00, so the absolute floor branch is live"

      - name: npv_per_period_rounding_before_summation_one_cent_divergence
        grounds:
          - calculations.workout_alternative_npv
          - entities.WorkoutAlternative.fields.discounted_pv_usd
          - entities.WorkoutAlternative.fields.npv_usd
          - state_machines.WorkoutPlan.DRAFT_to_SCORED
        distinguishing_aspect: |
          Mode (b) — order-sensitive accumulation. Each discounted period is rounded to two decimals
          BEFORE the periods are summed, which is observable: rounding the four MODIFICATION periods
          first yields 821,917.81 + 792,310.42 + 761,653.85 + 5,965,384.26 = 8,341,266.34 and an NPV
          of 8,221,266.34, whereas summing at full precision and rounding once yields 8,221,266.33.
          The single cent is the whole point — the two orders are not interchangeable.
        test_recipe:
          setup:
            - "One trust, one loan (current_principal_balance_usd 10,000,000.00) transferred to special servicing on a certified imminent default."
            - "A WorkoutPlan with npv_basis CONTRACTUAL and discount_rate_pct 9.5."
            - "A single MODIFICATION alternative with 120,000.00 upfront cost and cash flows [(1, 900000), (2, 950000), (3, 1000000), (4, 8576200)]."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-P1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-P01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2028-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "IMMINENT_DEFAULT", occurred_on: "2026-07-20T00:00:00Z", evidence_note: "borrower certified imminent default", imminent_default_certified: true }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "GET /special-servicing/loans/${loan_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { loan_version: "$.data.version" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 9.5, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 900000 }, { period_index: 2, amount_usd: 950000 }, { period_index: 3, amount_usd: 1000000 }, { period_index: 4, amount_usd: 8576200 }], upfront_cost_usd: 120000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_id: "$.data.id" }
          trigger:
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "SCORED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "GET /special-servicing/workout-alternatives/${alt_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { pv: "$.data.discounted_pv_usd", npv: "$.data.npv_usd" }
          assert:
            - "WorkoutAlternative.${alt_id}.discounted_pv_usd == 8341266.34"
            - "WorkoutAlternative.${alt_id}.npv_usd == 8221266.34"
            - "WorkoutAlternative.${alt_id}.npv_usd != 8221266.33 — the sum-then-round order is wrong by one cent"
            - "WorkoutAlternative.${alt_id}.rank == 1 and WorkoutAlternative.${alt_id}.status == SCORED"
            - "WorkoutPlan.${plan_id}.status == SCORED and WorkoutPlan.${plan_id}.recommended_alternative_id == ${alt_id}"

      - name: liquidation_fee_base_pinned_to_gross_not_net_proceeds
        grounds:
          - calculations.liquidation_proceeds_waterfall
          - calculations.advance_interest_accrual
          - entities.FeeAccrual.fields.basis_amount_usd
          - state_machines.Loan.IN_WORKOUT_to_LIQUIDATED
          - entities.Trust.fields.excess_liquidation_proceeds_usd
        distinguishing_aspect: |
          Mode (c) — a self-referential-looking dependency broken by a pinned base. The liquidation
          fee is a percentage of proceeds and is itself deducted from proceeds, so the base must be
          pinned to GROSS: 1% of 7,000,000.00 is 70,000.00 and available proceeds are exactly
          6,510,000.00. Charging the fee on net proceeds (7,000,000 - 420,000 = 6,580,000) would
          yield 65,800.00 and cascade a 4,200.00 error into principal recovery and realized loss.
        test_recipe:
          setup:
            - "One trust with liquidation_fee_rate_pct 1.0, advance_interest_rate_pct 5.0 and an 8,000,000.00 original controlling class balance."
            - "One loan with current_principal_balance_usd 10,000,000.00 and accrued_unpaid_interest_usd 250,000.00, transferred to special servicing."
            - "Two advances: a 200,000.00 tax and insurance advance dated 2026-02-01 and a 150,000.00 property protection advance dated 2026-04-01."
