        claim_type: cross_entity
        grounds:
          - state_machines.ProgressReport.DUE_to_DELINQUENT
          - calculations.applicant_grant_ledger
        excluded_because:
          difficulty_instance: transitive_cascade / reporting_sweep_cascade_report_to_ledger_to_suspension_to_disaster
          rationale: "That §1.8 instance asserts the DUE -> DELINQUENT sweep raising delinquent_report_count, suspending drawdowns and refreshing Disaster.suspended_applicant_count."

