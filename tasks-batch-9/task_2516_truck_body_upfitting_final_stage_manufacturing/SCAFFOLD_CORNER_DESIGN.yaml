  # =========================================================================
  # 8. From Cross-Cutting Complexity Layers — active layers of §1.0:
  #    optimistic_concurrency, cascading_side_effects,
  #    dual_variant_calculation, derived_field_reconciliation
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: certification_create_rejects_a_stale_upfit_order_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.certification-create-stale-order
          - endpoints.POST_/upfit/weight-certifications
          - validations.priority_100_ERR_STALE_UPFIT_ORDER_VERSION
        distinguishing_aspect: |
          The first §1.2.1 rule guards the certification writer against a body-mount or engineering
          change that landed between the engineer reading the order and stamping the weights. The
          version the client must echo is the PARENT order's, not the certification's, and the check
          sits at priority 100 — below every business rule — so a request that is BOTH stale and
          otherwise invalid must report the business error first. Version must also advance on every
          write to the order, including writes made through child routes.
        test_recipe:
          setup:
            - "An allocated CUSTOMER_SPECIFIC order whose version is captured immediately after creation, then bumped twice by a body-mount patch and by submit-engineering."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
