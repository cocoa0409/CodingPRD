# =============================================================================
# SCAFFOLD — task_3153_delivery_point_sequencing_route_adjustment_service_standards
#
# Delivery Point Sequencing, Route Adjustment & Service Standards
# (United States Postal Service)
#
# Sections §1.0–§1.7 only. §1.8 (scaffold_difficulty_design) lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 (scaffold_corner_design) lives in
# SCAFFOLD_CORNER_DESIGN.yaml. Neither key appears here.
# =============================================================================

scenario: |
  Delivery Point Sequencing, Route Adjustment & Service Standards (United States
  Postal Service): delivery point file maintenance with new construction,
  address changes and vacancy tracking, carrier route line-of-travel sequencing
  and case setup for letters and flats, route evaluation and adjustment based on
  volume counts and street time with carrier consultation, mail class service
  standards computed from origin and destination processing facilities,
  mandatory delivery to every address regardless of volume with universal
  service obligations, seasonal volume surges and auxiliary assistance
  assignment, forwarding, hold mail and change-of-address processing across
  systems, delivery scan compliance and customer inquiry resolution.

domain_name: delivery-point-sequencing-route-adjustment-service-standards
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # USO + consultation + segregation of duties + immutable audit trail of evaluations
  secondary_archetype: workflow_orchestration # evaluation → consultation → adjustment pipeline with branching re-collection loops
  complexity_layers:
    - optimistic_concurrency                  # OCC on CarrierRoute.version, ProcessingFacility.version, DeliveryUnit.version
    - cascading_side_effects                  # adjustment approval → sequence renumber → case slot recompute → carrier shift
    - dual_variant_calculation                # street-time: actual vs modeled; service standard: contiguous vs non-contiguous
    - rate_threshold_triggers                 # vacancy 90-day flip; auxiliary 30-minute overrun trigger; 98% scan compliance
    - scheduled_deferred_actions              # COA begin/end dates; hold mail windows; adjustment effective_date
  entity_topology: hybrid                     # DeliveryUnit → CarrierRoute tree, with cross-cutting FKs to ProcessingFacility / DeliveryPoint
  state_machine_shape: cyclic                 # evaluation re-collection loop, inquiry reopen loop, vacancy ↔ occupancy cycles, parallel COA dimensions
  relationship_patterns:
    - one_to_many        # DeliveryUnit → CarrierRoute → RouteSequenceEntry
    - many_to_many       # CarrierRoute ↔ ProcessingFacility via ServiceStandardRule; DeliveryPoint ↔ CarrierRoute (reassignable)
    - self_referential   # ChangeOfAddress supersedes a prior ChangeOfAddress (chain)
    - cross_aggregate    # RouteEvaluation references DeliveryPoint vacancy snapshots across the route aggregate
  role_model: segregation_of_duties           # evaluator (RouteSupervisor) may not approve own adjustment (Postmaster approves); AMS maintains addresses, supervisor sequences routes
  consistency_model: immediate                # all cascades atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ProcessingFacility
    parent: null
    common_fields: true
    fields:
      - { name: facility_code, type: string, source: input, description: "3-letter plant code, unique system-wide", constraints: "unique across all ProcessingFacility rows; ^[A-Z]{3}$" }
      - { name: facility_type, type: enum, source: input, description: "P_AND_DC | S_AND_DC | NDC | ANEX", constraints: "one of the four enum members" }
      - { name: region_class, type: enum, source: input, description: "CONTIGUOUS | NON_CONTIGUOUS — drives the service-standard variant selector", constraints: "enum" }
      - { name: dispatch_cutoff_local, type: string, source: input, description: "Daily critical entry time in facility local time, HH:MM 24h", constraints: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
      - { name: operating_days, type: array, source: input, description: "Days of week the facility processes mail", constraints: "subset of [MON,TUE,WED,THU,FRI,SAT,SUN]; must be non-empty" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DECOMMISSIONED", constraints: "enum" }

  - name: DeliveryUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Finance number / unit code, unique system-wide", constraints: "unique across all DeliveryUnit rows" }
      - { name: office_name, type: string, source: input, description: "Station or post office name" }
      - { name: delivery_office_facility_id, type: string, source: input, description: "FK -> ProcessingFacility.id; the plant whose service standards govern outbound origin computation for this unit", constraints: "must reference an ACTIVE ProcessingFacility at creation" }
      - { name: case_slot_count_per_route, type: integer, source: input, description: "Physical letter/flat case slots available per route in this unit", constraints: ">= 4 and <= 1000" }
      - { name: universal_service_obligation, type: boolean, source: system, default: true, description: "USO flag — always true for every delivery unit; mandatory delivery to every active address regardless of volume. Immutable once set." }
      - { name: scan_compliance_target, type: number, source: input, default: 0.98, description: "Required fraction of delivery scans with valid GPS/stop match, per reporting week", constraints: "0.5 <= value <= 1.0; stored to 4 decimal places" }
      - { name: active_route_count, type: integer, source: computed, description: "Count of CarrierRoute rows for this unit with status in {STANDARD, UNDER_EVALUATION, UNDER_ADJUSTMENT}" }

  - name: DeliveryPoint
    parent: DeliveryUnit
    common_fields: true
    fields:
      - { name: active_route_id, type: string, source: system, description: "FK -> CarrierRoute.id; route currently casing this point, null while UNDER_CONSTRUCTION" }
      - { name: occupancy_status, type: enum, source: system, default: "UNDER_CONSTRUCTION", description: "UNDER_CONSTRUCTION | OCCUPIED | VACANT | SEASONAL | DISCONTINUED", constraints: "enum" }
      - { name: delivery_unit_id, type: string, source: system, description: "FK -> DeliveryUnit.id; owning unit from the creation path" }
      - { name: address_line1, type: string, source: input, description: "Street address line 1" }
      - { name: city, type: string, source: input, description: "City name" }
      - { name: state_code, type: string, source: input, description: "2-letter state code", constraints: "^[A-Z]{2}$" }
      - { name: zip11, type: string, source: input, description: "11-digit delivery-point barcode key (ZIP+4+2), unique system-wide", constraints: "unique; ^[0-9]{11}$" }
      - { name: point_kind, type: enum, source: input, description: "RESIDENTIAL | BUSINESS | CENTRALIZED | PO_BOX", constraints: "enum" }
      - { name: occupancy_status, type: enum, source: system, default: "UNDER_CONSTRUCTION", description: "UNDER_CONSTRUCTION | OCCUPIED | VACANT | SEASONAL | DISCONTINUED", constraints: "enum" }
      - { name: vacant_since_date, type: string, source: system, description: "Date (YYYY-MM-DD) occupancy first flipped to VACANT in the current streak; null when not VACANT" }
      - { name: vacancy_days, type: integer, source: computed, description: "Consecutive days in VACANT status as of current logical date; 0 when not VACANT" }
      - { name: is_deliverable, type: boolean, source: computed, description: "true when occupancy_status in {OCCUPIED, SEASONAL, VACANT with vacancy_days < 90}; false for UNDER_CONSTRUCTION, DISCONTINUED, and VACANT with vacancy_days >= 90. Non-deliverable does not mean unserved: USO still requires forwarding and hold-mail processing for the address" }
      - { name: delivery_restriction, type: enum, source: input, default: "NONE", description: "NONE | BUSINESS_ONLY_HOURS | GATED_CODE_ON_FILE | NO_SECURE_LOCATION", constraints: "enum" }

  - name: Carrier
    parent: DeliveryUnit
    common_fields: true
    fields:
      - { name: delivery_unit_id, type: string, source: system, description: "FK -> DeliveryUnit.id; home unit" }
      - { name: employee_id, type: string, source: input, description: "EIN, unique system-wide", constraints: "unique; ^E[0-9]{7}$" }
      - { name: full_name, type: string, source: input, description: "Carrier display name" }
      - { name: carrier_class, type: enum, source: input, description: "REGULAR | CITY_ASSISTANT | RURAL | AUXILIARY", constraints: "enum" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | ON_ROUTE | DETAILED | INACTIVE", constraints: "enum" }

  - name: CarrierRoute
    parent: DeliveryUnit
    common_fields: true
    fields:
      - { name: delivery_unit_id, type: string, source: system, description: "FK -> DeliveryUnit.id; owning unit" }
      - { name: route_code, type: string, source: input, description: "e.g. C012; unique within the unit", constraints: "unique per delivery_unit_id" }
      - { name: assigned_carrier_id, type: string, source: input, description: "FK -> Carrier.id; regular carrier on the assignment", constraints: "must reference a Carrier of this unit whose status is not INACTIVE" }
      - { name: route_type, type: enum, source: input, description: "CITY | RURAL | HIGHWAY_CONTRACT", constraints: "enum" }
      - { name: status, type: enum, source: system, default: "STANDARD", description: "STANDARD | UNDER_EVALUATION | UNDER_ADJUSTMENT | SUSPENDED (transitional lock — routes may be reactivated to STANDARD with a different carrier)", constraints: "enum" }
      - { name: base_evaluated_minutes, type: integer, source: system, default: 480, description: "Contractual 8-hour baseline, in minutes, against which over/under burden is judged", constraints: "fixed 480" }
      - { name: current_evaluated_minutes, type: integer, source: computed, description: "Most recent evaluation result (modeled variant) adopted by an APPROVED RouteAdjustment; equals base_evaluated_minutes until first adjustment" }
      - { name: active_delivery_point_count, type: integer, source: computed, description: "Count of DeliveryPoint rows with active_route_id == this route and occupancy_status in {OCCUPIED, SEASONAL}" }
      - { name: under_evaluation_since, type: datetime, source: system, description: "Timestamp the route entered UNDER_EVALUATION; null otherwise" }
      - { name: auxiliary_relief_minutes, type: integer, source: computed, default: 0, description: "Sum of approved-but-not-completed AuxiliaryAssignment.scheduled_minutes for this route" }

  - name: RouteSequenceEntry
    parent: CarrierRoute
    common_fields: true
    fields:
      - { name: carrier_route_id, type: string, source: system, description: "FK -> CarrierRoute.id" }
      - { name: delivery_point_id, type: string, source: input, description: "FK -> DeliveryPoint.id", constraints: "point must be deliverable-eligible (occupancy in {OCCUPIED, SEASONAL, VACANT}) and assigned to this route" }
      - { name: line_of_travel_order, type: integer, source: input, description: "1-based sequence position in line-of-travel; unique within the route", constraints: ">= 1; unique per carrier_route_id; no gaps allowed after a commit (must be a permutation of 1..N)" }
      - { name: case_slot_letters, type: integer, source: computed, description: "Derived letter case slot index = line_of_travel_order mapped into case geometry; see calculation case_setup_mapping" }
      - { name: case_slot_flats, type: integer, source: computed, description: "Derived flat case slot index; see calculation case_setup_mapping" }
      - { name: delivery_order_group, type: enum, source: input, default: "PARK_LOOP", description: "PARK_LOOP | MOUNTED | WALKING | DISMOUNT", constraints: "enum" }

  - name: RouteEvaluation
    parent: CarrierRoute
    common_fields: true
    fields:
      - { name: carrier_route_id, type: string, source: system, description: "FK -> CarrierRoute.id" }
      - { name: evaluation_kind, type: enum, source: input, description: "FULL_COUNT | MINI_SURVEY | SPECIAL_INSPECTION", constraints: "enum" }
      - { name: count_week_start, type: string, source: input, description: "First day of the 6-day mail count, YYYY-MM-DD", constraints: "must be a Saturday (count weeks run Sat–Fri)" }
      - { name: letters_count_total, type: integer, source: input, description: "Total letters cased across the count week", constraints: ">= 0" }
      - { name: flats_count_total, type: integer, source: input, description: "Total flats cased across the count week", constraints: ">= 0" }
      - { name: parcels_count_total, type: integer, source: input, description: "Total parcels delivered across the count week", constraints: ">= 0" }
      - { name: actual_street_minutes_total, type: integer, source: input, description: "Observed street time across count week, in minutes", constraints: ">= 0" }
      - { name: office_minutes_total, type: integer, source: input, description: "Observed office time across count week, in minutes", constraints: ">= 0" }
      - { name: modeled_street_minutes_total, type: integer, source: computed, description: "Modeled street time per calculation modeled_street_time (dual variant vs actual)" }
      - { name: evaluated_daily_minutes, type: integer, source: computed, description: "Round-half-up of (office_minutes_total + adopted_street_minutes_total) / 6; adopted street time = min(actual, modeled) when carrier disputes actual (consultation outcome DISPUTED), otherwise actual" }
      - { name: consultation_outcome, type: enum, source: system, default: "PENDING", description: "PENDING | CONCURRED | DISPUTED | WAIVED", constraints: "enum" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED → DATA_COLLECTION → CONSULTATION_SCHEDULED → CONSULTED → CLOSED_ADOPTED | CLOSED_REJECTED; CONSULTED → DATA_COLLECTION allowed once (re-collection loop)", constraints: "enum" }
      - { name: recollection_used, type: boolean, source: system, default: false, description: "True once the CONSULTED → DATA_COLLECTION loop has fired; prevents a second loop" }

  - name: RouteAdjustment
    parent: RouteEvaluation
    common_fields: true
    fields:
      - { name: route_evaluation_id, type: string, source: system, description: "FK -> RouteEvaluation.id" }
      - { name: proposed_evaluated_minutes, type: integer, source: input, description: "Proposed new daily evaluated minutes for the route", constraints: ">= 240 and <= 600" }
      - { name: points_transferred_out, type: array, source: input, description: "Array of { delivery_point_id, to_route_id } moves; may be empty", constraints: "every to_route must belong to the same delivery_unit_id; no point may move to SUSPENDED route" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → SUBMITTED → APPROVED | REJECTED; APPROVED → EFFECTIVE (on effective_date); DRAFT → WITHDRAWN", constraints: "enum" }
      - { name: effective_date, type: string, source: input, description: "Date the adjustment takes effect; must be >= 7 days after approval date", constraints: "YYYY-MM-DD" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of the approving Postmaster; recorded for segregation-of-duties audit (may not equal the submitting supervisor's id)" }
      - { name: submitter_user_id, type: string, source: system, description: "X-User-ID of the RouteSupervisor who submitted" }

  - name: AuxiliaryAssignment
    parent: CarrierRoute
    common_fields: true
    fields:
      - { name: carrier_route_id, type: string, source: system, description: "FK -> CarrierRoute.id" }
      - { name: helper_carrier_id, type: string, source: input, description: "FK -> Carrier.id; must be carrier_class AUXILIARY or CITY_ASSISTANT of the same unit", constraints: "helper may not equal the route's assigned_carrier_id" }
      - { name: service_date, type: string, source: input, description: "Date assistance is performed, YYYY-MM-DD" }
      - { name: scheduled_minutes, type: integer, source: computed, description: "Per calculation auxiliary_assistance_minutes from projected overrun; not client-supplied" }
      - { name: projected_overrun_minutes, type: integer, source: input, description: "Supervisor-projected minutes the route will exceed base_evaluated_minutes on service_date", constraints: ">= 30 (below 30 no assistance is authorized — boundary >= 30)" }
      - { name: seasonal_surge_flag, type: boolean, source: input, default: false, description: "True when requested under the seasonal surge program (Nov 15 – Jan 2 logical window)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED → APPROVED → ACTIVE → COMPLETED; ACTIVE → CURTAILED; REQUESTED → DENIED", constraints: "enum" }

  - name: ChangeOfAddress
    parent: DeliveryUnit
    common_fields: true
    fields:
      - { name: delivery_unit_id, type: string, source: system, description: "FK -> DeliveryUnit.id; originating unit of the OLD address" }
      - { name: old_delivery_point_id, type: string, source: input, description: "FK -> DeliveryPoint.id; address mail is forwarded FROM" }
      - { name: new_address_line1, type: string, source: input, description: "Forwarding destination street line" }
      - { name: new_city, type: string, source: input, description: "Forwarding destination city" }
      - { name: new_state_code, type: string, source: input, description: "Forwarding destination state", constraints: "^[A-Z]{2}$" }
      - { name: new_zip11, type: string, source: input, description: "Forwarding destination ZIP+4+2 (may be outside this unit)", constraints: "^[0-9]{11}$" }
      - { name: move_kind, type: enum, source: input, description: "INDIVIDUAL | FAMILY | BUSINESS", constraints: "enum" }
      - { name: move_type, type: enum, source: input, description: "PERMANENT | TEMPORARY", constraints: "enum" }
      - { name: begin_date, type: string, source: input, description: "First forwarding day, YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Last forwarding day; required and <= begin_date + 364 days for TEMPORARY; null for PERMANENT (system enforces 12-month forwarding for most classes)", constraints: "TEMPORARY: required, begin_date < end_date <= begin_date + 364 days" }
      - { name: supersedes_coa_id, type: string, source: input, description: "FK -> ChangeOfAddress.id; prior COA on the same old address this order replaces (self-referential chain)", constraints: "referenced COA must share old_delivery_point_id and be in {ACTIVE, PENDING}" }
      - { name: forwarding_status, type: enum, source: system, default: "PENDING", description: "Parallel dimension 1: PENDING → ACTIVE → EXPIRED; ACTIVE → SUSPENDED → ACTIVE; any non-terminal → CANCELLED", constraints: "enum" }
      - { name: validation_status, type: enum, source: system, default: "UNVERIFIED", description: "Parallel dimension 2: UNVERIFIED → VERIFIED | REJECTED; independent of forwarding_status", constraints: "enum" }

  - name: HoldMail
    parent: DeliveryUnit
    common_fields: true
    fields:
      - { name: delivery_unit_id, type: string, source: system, description: "FK -> DeliveryUnit.id" }
      - { name: delivery_point_id, type: string, source: input, description: "FK -> DeliveryPoint.id; address under hold" }
      - { name: hold_start_date, type: string, source: input, description: "First day mail is held, YYYY-MM-DD", constraints: ">= current logical date" }
      - { name: hold_end_date, type: string, source: input, description: "Last day mail is held, YYYY-MM-DD", constraints: "hold_start_date <= hold_end_date <= hold_start_date + 30 days" }
      - { name: disposition, type: enum, source: input, description: "ACCUMULATE_DELIVER_ON_END | CARRIER_PICKUP", constraints: "enum" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED → ACTIVE → EXPIRED | COMPLETED; SCHEDULED → CANCELLED; ACTIVE → CANCELLED (early release)", constraints: "enum" }

  - name: ServiceStandardRule
    parent: ProcessingFacility
    common_fields: true
    fields:
      - { name: origin_facility_id, type: string, source: system, description: "FK -> ProcessingFacility.id; from creation path" }
      - { name: dest_facility_id, type: string, source: input, description: "FK -> ProcessingFacility.id; destination plant", constraints: "must differ from origin_facility_id; both facilities ACTIVE" }
      - { name: mail_class, type: enum, source: input, description: "FIRST_CLASS | PRIORITY | GROUND_ADVANTAGE | PERIODICALS | MARKETING", constraints: "enum" }
      - { name: service_days, type: integer, source: input, description: "Committed delivery days origin-to-destination for CONTIGUOUS pairs", constraints: ">= 1 and <= 7" }
      - { name: non_contiguous_extra_days, type: integer, source: input, default: 2, description: "Additional days added when either endpoint facility has region_class NON_CONTIGUOUS (dual-variant delta)", constraints: ">= 0 and <= 10" }
      - { name: effective_from, type: string, source: input, description: "Date rule takes effect, YYYY-MM-DD" }
      - { name: effective_to, type: string, source: input, description: "Date rule ceases to apply (inclusive); null = open-ended", constraints: "when non-null must be >= effective_from; rules for the same (origin,dest,mail_class) must not have overlapping [effective_from, effective_to] windows (end-adjacency allowed: effective_to == next.effective_from is a CONFLICT, must be < )" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED → ACTIVE (auto on effective_from ≤ current date) → RETIRED (only from ACTIVE)", constraints: "enum" }

  - name: ServiceStandardQuery
    parent: null
    common_fields: false
    fields:
      - { name: origin_facility_id, type: string, source: input, description: "FK -> ProcessingFacility.id" }
      - { name: dest_facility_id, type: string, source: input, description: "FK -> ProcessingFacility.id" }
      - { name: mail_class, type: enum, source: input, description: "Mail class queried" }
      - { name: acceptance_date, type: string, source: input, description: "Date of acceptance at origin, YYYY-MM-DD" }
      - { name: acceptance_time_local, type: string, source: input, description: "Time of acceptance at origin facility local time, HH:MM", constraints: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
      - { name: committed_delivery_date, type: string, source: computed, description: "Per calculation service_standard_delivery_date" }
      - { name: committed_service_days, type: integer, source: computed, description: "Adopted service days actually used (base or non-contiguous variant)" }
      - { name: variant_used, type: enum, source: computed, description: "CONTIGUOUS | NON_CONTIGUOUS — which dual variant fired" }

  - name: DeliveryScanEvent
    parent: CarrierRoute
    common_fields: false
    fields:
      - { name: carrier_route_id, type: string, source: system, description: "FK -> CarrierRoute.id" }
      - { name: delivery_point_id, type: string, source: input, description: "FK -> DeliveryPoint.id; scan stop" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; scanning carrier" }
      - { name: scan_code, type: enum, source: input, description: "DELIVERED | ATTEMPTED_NO_ACCESS | VACANT_CONFIRMED | FORWARDED | HELD_AT_OFFICE | REFUSED", constraints: "enum" }
      - { name: scan_datetime, type: string, source: input, description: "ISO8601 UTC timestamp of the scan" }
      - { name: gps_within_geofence, type: boolean, source: input, description: "True when device GPS is within the delivery point geofence" }
      - { name: is_compliant, type: boolean, source: computed, description: "true when gps_within_geofence is true AND scan_code is consistent with the point's occupancy_status (see validation scan_consistency)" }

  - name: CustomerInquiry
    parent: DeliveryUnit
    common_fields: true
    fields:
      - { name: delivery_unit_id, type: string, source: system, description: "FK -> DeliveryUnit.id" }
      - { name: delivery_point_id, type: string, source: input, description: "FK -> DeliveryPoint.id the inquiry concerns" }
      - { name: related_scan_event_id, type: string, source: input, description: "FK -> DeliveryScanEvent.id; optional link to a specific scan", constraints: "nullable" }
      - { name: inquiry_kind, type: enum, source: input, description: "MISSING_MAIL | LATE_DELIVERY | WRONG_DELIVERY | HOLD_NOT_HONORED | FORWARD_NOT_RECEIVED", constraints: "enum" }
      - { name: opened_by_channel, type: enum, source: input, description: "PHONE | WEB | WALK_IN", constraints: "enum" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN → INVESTIGATING → RESOLVED; RESOLVED → OPEN (reopen within 14 days, cyclic); any non-terminal → CLOSED_ABANDONED (system, after 30 days without activity)", constraints: "enum" }
      - { name: resolution_code, type: enum, source: input, description: "FOUND_AND_DELIVERED | SENDER_CONTACTED | FORWARD_CONFIRMED | NO_ERROR_FOUND; required when resolving", constraints: "enum; required on resolve" }
      - { name: sla_due_datetime, type: datetime, source: computed, description: "OPEN timestamp + 3 business days per DeliveryUnit operating calendar (approximated: + 3 * 24h skipping SUN)" }
      - { name: reopened_count, type: integer, source: system, default: 0, description: "Number of RESOLVED → OPEN loops; max 2 — a third resolve locks the inquiry (RESOLVED_FINAL enforced by guard)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: DeliveryPoint
    initial_state: UNDER_CONSTRUCTION
    terminal_states: [DISCONTINUED]
    state_field: occupancy_status
    transitions:
      - from: UNDER_CONSTRUCTION
        to: OCCUPIED
        trigger: "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/activate"
        actor: AddressManagementSpecialist
        preconditions:
          - "occupancy_status == UNDER_CONSTRUCTION"
          - "point must have been assigned a route via a sequence entry OR activation assigns active_route_id from payload route_id whose unit matches"
        side_effects:
          - "active_route_id set from payload route_id"
          - "CarrierRoute.active_delivery_point_count recomputed (+1)"
          - "increments DeliveryPoint.version by 1"
      - from: OCCUPIED
        to: VACANT
        trigger: "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/mark-vacant"
        actor: Carrier
        preconditions:
          - "occupancy_status == OCCUPIED"
          - "no ACTIVE HoldMail with disposition CARRIER_PICKUP for this point (ERR_HOLD_ACTIVE)"
        side_effects:
          - "vacant_since_date := current logical date"
          - "CarrierRoute.active_delivery_point_count recomputed (-1)"
          - "is_deliverable recomputed"
          - "increments DeliveryPoint.version by 1"
      - from: VACANT
        to: OCCUPIED
        trigger: "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/mark-occupied"
        actor: AddressManagementSpecialist
        preconditions:
          - "occupancy_status == VACANT"
        side_effects:
          - "vacant_since_date := null"
          - "CarrierRoute.active_delivery_point_count recomputed (+1)"
          - "if vacancy_days at flip >= 90 AND a RouteEvaluation is INITIATED on the route: evaluation remains valid but flagged for recount note"
          - "increments DeliveryPoint.version by 1"
      - from: OCCUPIED
        to: SEASONAL
        trigger: "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/mark-seasonal"
        actor: AddressManagementSpecialist
        preconditions: ["occupancy_status == OCCUPIED"]
        side_effects: ["increments DeliveryPoint.version by 1"]
      - from: SEASONAL
        to: OCCUPIED
        trigger: "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/mark-occupied"
        actor: AddressManagementSpecialist
        preconditions: ["occupancy_status == SEASONAL"]
        side_effects: ["increments DeliveryPoint.version by 1"]
      - from: VACANT
        to: DISCONTINUED
        trigger: "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/discontinue"
        actor: AddressManagementSpecialist
        preconditions:
          - "occupancy_status == VACANT"
          - "vacancy_days >= 90 (strict boundary: == 90 qualifies)"
          - "no ACTIVE ChangeOfAddress with old_delivery_point_id == this point (ERR_FORWARD_ACTIVE)"
        side_effects:
          - "any RouteSequenceEntry for this point is removed and the route re-sequenced (renumber cascade)"
          - "CarrierRoute.active_delivery_point_count recomputed"
          - "pending CustomerInquiry rows for this point stay OPEN (USO inquiry obligation survives point)"
          - "increments DeliveryPoint.version by 1"

  - entity: CarrierRoute
    initial_state: STANDARD
    terminal_states: []
    state_field: status
    note: "SUSPENDED is a transitional lock, not terminal — reactivate returns the route to STANDARD with a replacement carrier."
    transitions:
      - from: STANDARD
        to: UNDER_EVALUATION
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations (creation of RouteEvaluation)"
        actor: RouteSupervisor
        preconditions:
          - "status == STANDARD"
          - "no other RouteEvaluation for this route with status not in {CLOSED_ADOPTED, CLOSED_REJECTED}"
        side_effects:
          - "under_evaluation_since := now"
          - "increments CarrierRoute.version by 1"
      - from: UNDER_EVALUATION
        to: UNDER_ADJUSTMENT
        trigger: "system (automatic when a RouteAdjustment reaches APPROVED for this route's evaluation)"
        actor: system
        preconditions: []
        side_effects:
          - "increments CarrierRoute.version by 1"
      - from: UNDER_ADJUSTMENT
        to: STANDARD
        trigger: "system (automatic on effective_date when the APPROVED adjustment goes EFFECTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "current_evaluated_minutes := RouteAdjustment.proposed_evaluated_minutes"
          - "under_evaluation_since := null"
          - "RouteEvaluation.status := CLOSED_ADOPTED"
          - "points_transferred_out applied: each point's active_route_id moved, both routes' active_delivery_point_count recomputed, both routes' sequence entries renumbered (renumber cascade)"
          - "increments CarrierRoute.version by 1"
      - from: UNDER_EVALUATION
        to: STANDARD
        trigger: "system (automatic when the open RouteEvaluation is CLOSED_REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "under_evaluation_since := null"
          - "increments CarrierRoute.version by 1"
      - from: STANDARD
        to: SUSPENDED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/suspend"
        actor: Postmaster
        preconditions:
          - "status == STANDARD"
          - "active_delivery_point_count == 0 (every point must be re-homed first — USO forbids stranding addresses)"
        side_effects:
          - "open AuxiliaryAssignment rows (REQUESTED/APPROVED/ACTIVE) → CURTAILED"
          - "increments CarrierRoute.version by 1"
      - from: SUSPENDED
        to: STANDARD
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/reactivate"
        actor: Postmaster
        preconditions:
          - "status == SUSPENDED"
          - "payload assigned_carrier_id references an AVAILABLE carrier of the unit (the prior carrier may have been detailed)"
        side_effects:
          - "assigned_carrier_id := payload value"
          - "increments CarrierRoute.version by 1"

  - entity: RouteEvaluation
    initial_state: INITIATED
    terminal_states: [CLOSED_ADOPTED, CLOSED_REJECTED]
    state_field: status
    transitions:
      - from: INITIATED
        to: DATA_COLLECTION
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/begin-count"
        actor: RouteSupervisor
        preconditions:
          - "status == INITIATED"
          - "count_week_start must be >= 14 days in the future relative to current logical date (scheduling lead time) when kind == FULL_COUNT"
        side_effects: ["increments RouteEvaluation.version by 1"]
      - from: DATA_COLLECTION
        to: CONSULTATION_SCHEDULED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/submit-counts"
        actor: RouteSupervisor
        preconditions:
          - "status == DATA_COLLECTION"
          - "all six count inputs (letters/flats/parcels/actual street/office) provided as non-negative integers"
        side_effects:
          - "modeled_street_minutes_total computed (calculation modeled_street_time)"
          - "increments RouteEvaluation.version by 1"
      - from: CONSULTATION_SCHEDULED
        to: CONSULTED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/record-consultation"
        actor: RouteSupervisor
        preconditions:
          - "status == CONSULTATION_SCHEDULED"
          - "payload consultation_outcome in {CONCURRED, DISPUTED, WAIVED}"
        side_effects:
          - "consultation_outcome := payload value"
          - "evaluated_daily_minutes computed (adopted street time = min(actual, modeled) when DISPUTED, else actual)"
          - "increments RouteEvaluation.version by 1"
      - from: CONSULTED
        to: DATA_COLLECTION
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/order-recollection"
        actor: Postmaster
        preconditions:
          - "status == CONSULTED"
          - "consultation_outcome == DISPUTED"
          - "recollection_used == false (loop may fire at most once)"
        side_effects:
          - "recollection_used := true"
          - "count inputs zeroed for re-entry"
          - "increments RouteEvaluation.version by 1"
      - from: CONSULTED
        to: CLOSED_REJECTED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/close-rejected"
        actor: RouteSupervisor
        preconditions:
          - "status == CONSULTED"
          - "no RouteAdjustment for this evaluation with status in {DRAFT, SUBMITTED, APPROVED}"
        side_effects:
          - "CarrierRoute.status := STANDARD (bubble-up), under_evaluation_since := null"
          - "increments RouteEvaluation.version by 1"
      - from: CONSULTED
        to: CLOSED_ADOPTED
        trigger: "system (automatic when this evaluation's RouteAdjustment goes EFFECTIVE)"
        actor: system
        preconditions: []
        side_effects: ["increments RouteEvaluation.version by 1"]

  - entity: RouteAdjustment
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, REJECTED, WITHDRAWN]
    state_field: status
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/adjustments/{adjId}/submit"
        actor: RouteSupervisor
        preconditions:
          - "status == DRAFT"
          - "parent RouteEvaluation.status == CONSULTED"
          - "submitter_user_id := X-User-ID (segregation: this id may not later approve)"
        side_effects: ["increments RouteAdjustment.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/adjustments/{adjId}/approve"
        actor: Postmaster
        preconditions:
          - "status == SUBMITTED"
          - "approver X-User-ID != submitter_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "effective_date >= current logical date + 7 days"
        side_effects:
          - "approver_user_id := X-User-ID"
          - "CarrierRoute.status := UNDER_ADJUSTMENT (bubble-up)"
          - "increments RouteAdjustment.version by 1"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "system (automatic when logical date reaches effective_date — see POST /api/_clock/set_current_utc driving)"
        actor: system
        preconditions: []
        side_effects:
          - "full adopt cascade on CarrierRoute (see CarrierRoute UNDER_ADJUSTMENT → STANDARD): point transfers, renumber cascade, current_evaluated_minutes update, evaluation CLOSED_ADOPTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/adjustments/{adjId}/reject"
        actor: Postmaster
        preconditions:
          - "status == SUBMITTED"
          - "approver X-User-ID != submitter_user_id"
        side_effects:
          - "parent RouteEvaluation remains CONSULTED (a replacement DRAFT adjustment may be created)"
          - "increments RouteAdjustment.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/adjustments/{adjId}/withdraw"
        actor: RouteSupervisor
        preconditions: ["status == DRAFT"]
        side_effects: ["increments RouteAdjustment.version by 1"]

  - entity: ChangeOfAddress
    initial_state: PENDING
    terminal_states: [EXPIRED, CANCELLED]
    state_field: forwarding_status
    parallel_dimension: validation_status (UNVERIFIED → VERIFIED | REJECTED, independent axis)
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (automatic on logical date == begin_date) OR POST /api/delivery-units/{unitId}/coas/{coaId}/activate-now for same-day activation"
        actor: system
        preconditions:
          - "forwarding_status == PENDING"
          - "validation_status == VERIFIED (COA may not activate while UNVERIFIED)"
          - "no other ACTIVE COA for the same old_delivery_point_id (ERR_FORWARD_OVERLAP) unless that COA is the supersedes_coa_id target, which is auto-CANCELLED by this activation"
        side_effects:
          - "superseded COA (if any) forwarding_status := CANCELLED"
          - "overlapping ACTIVE HoldMail on the point with hold window intersecting [begin_date, end_date] → HoldMail stays ACTIVE but forwarding takes precedence (mail forwards; hold is annotated — modeled as side-effect flag only)"
          - "increments ChangeOfAddress.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/delivery-units/{unitId}/coas/{coaId}/suspend"
        actor: CustomerServiceRep
        preconditions:
          - "forwarding_status == ACTIVE"
        side_effects: ["increments ChangeOfAddress.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/delivery-units/{unitId}/coas/{coaId}/resume"
        actor: CustomerServiceRep
        preconditions:
          - "forwarding_status == SUSPENDED"
          - "current logical date <= end_date when move_type == TEMPORARY (cannot resume past end)"
        side_effects: ["increments ChangeOfAddress.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical date > end_date for TEMPORARY; for PERMANENT, 12 months after begin_date)"
        actor: system
        preconditions: []
        side_effects: ["increments ChangeOfAddress.version by 1"]
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/delivery-units/{unitId}/coas/{coaId}/cancel"
        actor: CustomerServiceRep
        preconditions: ["forwarding_status in {PENDING, ACTIVE, SUSPENDED}"]
        side_effects: ["increments ChangeOfAddress.version by 1"]
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /api/delivery-units/{unitId}/coas/{coaId}/verify"
        actor: CustomerServiceRep
        preconditions: ["validation_status == UNVERIFIED"]
        side_effects: ["increments ChangeOfAddress.version by 1"]
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /api/delivery-units/{unitId}/coas/{coaId}/reject-validation"
        actor: CustomerServiceRep
        preconditions: ["validation_status == UNVERIFIED"]
        side_effects: ["increments ChangeOfAddress.version by 1"]

  - entity: HoldMail
    initial_state: SCHEDULED
    terminal_states: [EXPIRED, COMPLETED, CANCELLED]
    state_field: status
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (automatic on logical date == hold_start_date)"
        actor: system
        preconditions:
          - "no overlapping ACTIVE/scheduled HoldMail on the same point (ERR_HOLD_OVERLAP — half-open window [start, end+1))"
        side_effects: ["increments HoldMail.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic on logical date > hold_end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "if disposition == ACCUMULATE_DELIVER_ON_END: a delivery action is implied (modeled; no further state)"
          - "increments HoldMail.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/delivery-units/{unitId}/holds/{holdId}/complete-early"
        actor: Carrier
        preconditions:
          - "status == ACTIVE"
          - "disposition == CARRIER_PICKUP implies customer pickup scan not required (informational)"
        side_effects: ["increments HoldMail.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/delivery-units/{unitId}/holds/{holdId}/cancel"
        actor: CustomerServiceRep
        preconditions: ["status in {SCHEDULED, ACTIVE}"]
        side_effects: ["increments HoldMail.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/delivery-units/{unitId}/holds/{holdId}/cancel"
        actor: CustomerServiceRep
        preconditions: ["status in {SCHEDULED, ACTIVE}"]
        side_effects: ["increments HoldMail.version by 1"]

  - entity: AuxiliaryAssignment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CURTAILED, DENIED]
    state_field: status
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/auxiliary-assignments/{auxId}/approve"
        actor: Postmaster
        preconditions:
          - "status == REQUESTED"
          - "helper_carrier_id != route.assigned_carrier_id"
          - "helper Carrier.status != INACTIVE"
          - "seasonal_surge_flag == false OR current logical date within [Nov 15, Jan 2] window"
        side_effects:
          - "scheduled_minutes computed (calculation auxiliary_assistance_minutes)"
          - "CarrierRoute.auxiliary_relief_minutes += scheduled_minutes"
          - "increments AuxiliaryAssignment.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/auxiliary-assignments/{auxId}/deny"
        actor: Postmaster
        preconditions: ["status == REQUESTED"]
        side_effects: ["increments AuxiliaryAssignment.version by 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "system (automatic on logical date == service_date)"
        actor: system
        preconditions: []
        side_effects: ["helper Carrier.status := ON_ROUTE for the day (transient flag; not separately persisted)"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/auxiliary-assignments/{auxId}/complete"
        actor: RouteSupervisor
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "CarrierRoute.auxiliary_relief_minutes -= scheduled_minutes"
          - "increments AuxiliaryAssignment.version by 1"
      - from: ACTIVE
        to: CURTAILED
        trigger: "POST /api/delivery-units/{unitId}/routes/{routeId}/auxiliary-assignments/{auxId}/curtail OR system (route suspended)"
        actor: RouteSupervisor
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "CarrierRoute.auxiliary_relief_minutes -= scheduled_minutes"
          - "increments AuxiliaryAssignment.version by 1"

  - entity: CustomerInquiry
    initial_state: OPEN
    terminal_states: [CLOSED_ABANDONED, RESOLVED_FINAL, RESOLVED]
    state_field: status
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /api/delivery-units/{unitId}/inquiries/{inquiryId}/begin-investigation"
        actor: CustomerServiceRep
        preconditions: ["status == OPEN"]
        side_effects: ["increments CustomerInquiry.version by 1"]
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /api/delivery-units/{unitId}/inquiries/{inquiryId}/resolve"
        actor: CustomerServiceRep
        preconditions:
          - "status == INVESTIGATING"
          - "resolution_code provided"
          - "reopened_count < 2, else transitions to RESOLVED_FINAL instead (guard on loop count)"
        side_effects: ["increments CustomerInquiry.version by 1"]
      - from: INVESTIGATING
        to: RESOLVED_FINAL
        trigger: "POST /api/delivery-units/{unitId}/inquiries/{inquiryId}/resolve (when reopened_count >= 2)"
        actor: CustomerServiceRep
        preconditions:
          - "status == INVESTIGATING"
          - "resolution_code provided"
          - "reopened_count >= 2"
        side_effects: ["increments CustomerInquiry.version by 1"]
      - from: RESOLVED
        to: OPEN
        trigger: "POST /api/delivery-units/{unitId}/inquiries/{inquiryId}/reopen"
        actor: CustomerServiceRep
        preconditions:
          - "status == RESOLVED"
          - "current logical datetime <= resolved timestamp + 14 days (reopen window)"
        side_effects:
          - "reopened_count += 1"
          - "increments CustomerInquiry.version by 1"
      - from: OPEN
        to: CLOSED_ABANDONED
        trigger: "system (automatic after 30 days with no status change)"
        actor: system
        preconditions: []
        side_effects: ["increments CustomerInquiry.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: sequence-reorder-stale-route
    parent_entity: CarrierRoute
    write_endpoint: "POST /api/delivery-units/{unitId}/routes/{routeId}/sequence-entries"
    occ_field: "expected_route_version"
    description: |
      Replacing a route's full line-of-travel sequence against a CarrierRoute whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has just committed a new sequence
      (which legitimately supersedes the client's intended ordering) and the
      current writer's view of the route is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: evaluation-create-stale-route
    parent_entity: CarrierRoute
    write_endpoint: "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations"
    occ_field: "expected_route_version"
    description: |
      Opening a RouteEvaluation against a CarrierRoute whose version has advanced
      since the client last observed it is rejected. Creating an evaluation is a
      superseding declaration about the route's current state; a stale base means
      the client evaluated an out-of-date picture of point counts and times.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rule-create-stale-facility
    parent_entity: ProcessingFacility
    write_endpoint: "POST /api/processing-facilities/{facilityId}/service-standard-rules"
    occ_field: "expected_facility_version"
    description: |
      Creating a ServiceStandardRule against an origin ProcessingFacility whose
      version has advanced since the client last observed it is rejected; a
      concurrently landed rule change (retirement or new overlapping window)
      legitimately supersedes the client's intended window arithmetic.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: service_standard_delivery_date
    trigger: "POST /api/service-standard-queries (computed read; result persisted on the ServiceStandardQuery row)"
    algorithm: forward_looking
    formula: |
      1. Rule selection: pick ServiceStandardRule rows with origin_facility_id == query.origin,
         dest_facility_id == query.dest, mail_class == query.mail_class,
         status in {SCHEDULED, ACTIVE}, and effective_from <= acceptance_date AND
         (effective_to IS NULL OR effective_to >= acceptance_date).
         Exactly one must match; zero -> ERR_NO_SERVICE_RULE; more than one ->
         ERR_RULE_OVERLAP_CONFLICT (should be impossible — creation validates non-overlap).
      2. Variant selection (DUAL VARIANT):
         variant = NON_CONTIGUOUS if origin.region_class == NON_CONTIGUOUS
                   OR dest.region_class == NON_CONTIGUOUS else CONTIGUOUS.
         committed_service_days = rule.service_days + (variant == NON_CONTIGUOUS ? rule.non_contiguous_extra_days : 0)
      3. Cutoff handling: if acceptance_time_local > origin.dispatch_cutoff_local,
         acceptance is treated as occurring on the NEXT origin operating day
         (advance acceptance_date by one day, then skip forward to next day in
         origin.operating_days).
      4. Date roll: starting from the (possibly advanced) acceptance_date, count
         committed_service_days days forward, counting only days that are in
         origin.operating_days (non-operating days are skipped and do not consume
         service days). Sundays NEVER count even if listed in operating_days
         (except mail_class == PRIORITY, where Sunday counts for CONTIGUOUS variant only).
      5. committed_delivery_date = the day on which the count completes.
    input_set: "ServiceStandardRule rows for the (origin, dest, mail_class) triple in {SCHEDULED, ACTIVE} covering acceptance_date; origin/dest ProcessingFacility rows"
    constants:
      MAX_SERVICE_DAYS: 7
      NON_CONTIGUOUS_CAP: 10
    precision: "dates exact to the day; no rounding"
    variants:
      - name: CONTIGUOUS
        when: "both endpoint facilities have region_class CONTIGUOUS"
        difference: "uses rule.service_days as-is; Sunday counts only for PRIORITY"
      - name: NON_CONTIGUOUS
        when: "either endpoint facility has region_class NON_CONTIGUOUS"
        difference: "adds rule.non_contiguous_extra_days to service_days; Sunday never counts regardless of mail_class"

  - name: modeled_street_time
    trigger: "RouteEvaluation DATA_COLLECTION → CONSULTATION_SCHEDULED (submit-counts)"
    algorithm: weighted_scoring
    formula: |
      Per count-week totals, computed in EXACTLY this order with per-step rounding:
      casing_minutes   = round_half_up(letters_count_total / 18.0, 2)   # 18 letters per minute casing rate
                       + round_half_up(flats_count_total   / 8.0,  2)   # 8 flats per minute casing rate
      pull_down_minutes= round_half_up((letters_count_total + flats_count_total) / 70.0, 2)
      street_base      = round_half_up(parcels_count_total * 2.5, 2)    # 2.5 minutes per parcel stop
      # combinatorial mode (a): >= 3 inputs with tiered, non-linear interaction
      volume_tier = 0
      if letters_count_total + flats_count_total >= 12000: volume_tier = 2
      elif letters_count_total + flats_count_total >= 6000: volume_tier = 1
      tier_factor = [1.00, 0.97, 0.94][volume_tier]   # larger volumes amortize fixed street cost
      modeled_street_minutes_total =
          round_half_up( (street_base + casing_minutes * 0.62 + pull_down_minutes) * tier_factor, 0 )
      # rounding order is FIXED: every division rounded to 2dp half-up FIRST,
      # then the weighted sum, then the final round to integer half-up.
      # Reordering (sum-then-round) yields a different integer and is incorrect.
    input_set: "The six count inputs on the RouteEvaluation (letters, flats, parcels)"
    constants:
      LETTER_CASING_RATE: 18.0
      FLAT_CASING_RATE: 8.0
      PULLDOWN_RATE: 70.0
      PARCEL_STOP_MINUTES: 2.5
      TIER1_THRESHOLD: 6000
      TIER2_THRESHOLD: 12000
      TIER_FACTORS: [1.00, 0.97, 0.94]
    precision: "intermediate 2 decimal places round_half_up; final integer round_half_up"

  - name: evaluated_daily_minutes
    trigger: "RouteEvaluation CONSULTATION_SCHEDULED → CONSULTED (record-consultation)"
    algorithm: aggregation
    formula: |
      # DUAL VARIANT: adopted street time depends on consultation outcome
      if consultation_outcome == DISPUTED:
          adopted_street = min(actual_street_minutes_total, modeled_street_minutes_total)
      else:
          adopted_street = actual_street_minutes_total
      evaluated_daily_minutes = round_half_up( (office_minutes_total + adopted_street) / 6, 0 )
      # Variants produce different integers whenever modeled < actual and outcome
      # is DISPUTED vs CONCURRED — the dual-variant divergence point.
    input_set: "office_minutes_total, actual_street_minutes_total, modeled_street_minutes_total, consultation_outcome"
    precision: "integer minutes, round_half_up"
    variants:
      - name: actual_street_adopted
        when: "consultation_outcome in {CONCURRED, WAIVED}"
        difference: "uses actual_street_minutes_total"
      - name: disputed_street_floored
        when: "consultation_outcome == DISPUTED"
        difference: "uses min(actual, modeled) — carrier-favorable floor"

  - name: auxiliary_assistance_minutes
    trigger: "AuxiliaryAssignment REQUESTED → APPROVED (approve)"
    algorithm: threshold
    formula: |
      # combinatorial mode (a): 4 inputs, tiered + conditional branch on seasonal flag
      base = projected_overrun_minutes
      if base < 30: reject ERR_OVERRUN_BELOW_THRESHOLD (hard floor, >= 30 qualifies)
      assistance = base
      if seasonal_surge_flag == true:
          assistance = round_half_up(base * 1.25, 0)     # surge uplift
      if route.current_evaluated_minutes > route.base_evaluated_minutes:
          assistance = assistance + 15                    # already-overburdened route gets fixed kicker
      scheduled_minutes = min(assistance, 240)            # hard cap 4 hours per assignment
    input_set: "projected_overrun_minutes, seasonal_surge_flag, route.current_evaluated_minutes, route.base_evaluated_minutes"
    constants:
      MIN_OVERRUN_MINUTES: 30
      SURGE_MULTIPLIER: 1.25
      OVERBURDEN_KICKER: 15
      MAX_ASSISTANCE_MINUTES: 240
    precision: "integer minutes, round_half_up"

  - name: vacancy_days_and_flip
    trigger: "any logical-date change (POST /api/_clock/set_current_utc) and on DeliveryPoint read"
    algorithm: chronological
    formula: |
      if occupancy_status == VACANT and vacant_since_date is not null:
          vacancy_days = (current_logical_date - vacant_since_date).days   # both inclusive-exclusive: difference in calendar days
      else:
          vacancy_days = 0
      is_deliverable = occupancy_status in {OCCUPIED, SEASONAL}
                       OR (occupancy_status == VACANT AND vacancy_days < 90)
      # Boundary: vacancy_days == 90 makes is_deliverable FALSE (>= 90 excludes).
      # DISCONTINUED requires vacancy_days >= 90 (== 90 qualifies). These two
      # thresholds share the same boundary with opposite inclusivity semantics.
    input_set: "DeliveryPoint occupancy_status, vacant_since_date, current logical date"
    constants:
      VACANCY_DISCONTINUE_THRESHOLD_DAYS: 90
    precision: "integer days"

  - name: case_setup_mapping
    trigger: "RouteSequenceEntry create / full-sequence replace (recompute for every entry of the route)"
    algorithm: constraint_propagation
    formula: |
      For a route with N entries (line_of_travel_order 1..N) and unit case slot
      count S = delivery_unit.case_slot_count_per_route:
      # combinatorial mode (b): NESTED ROUNDING — order pinned
      letters_per_row = 6                                    # physical case: 6 slots per row
      case_slot_letters(entry) = 1 + floor((entry.line_of_travel_order - 1) / 2)      # odd/even pair share a letter slot row side
      case_slot_flats(entry)   = 1 + floor((entry.line_of_travel_order - 1) / 3)      # flats: 3 LOT positions per flat slot
      if case_slot_letters(entry) > S OR case_slot_flats(entry) > S:
          reject commit with ERR_CASE_CAPACITY_EXCEEDED
      # computing letters first vs flats first does not commute when capacity
      # check triggers mid-commit; the scaffold pins: validate ALL letters slots
      # for the whole route FIRST, then ALL flats slots, then commit atomically.
    input_set: "all RouteSequenceEntry rows of the route, delivery_unit.case_slot_count_per_route"
    constants:
      LETTERS_PER_LOT_PAIR: 2
      FLATS_PER_LOT_TRIPLE: 3
    precision: "integer slot indexes, floor division"

  - name: scan_compliance_rate
    trigger: "GET /api/delivery-units/{unitId}/scan-compliance (weekly computed read)"
    algorithm: aggregation
    formula: |
      week of interest = [week_start, week_start + 7 days) half-open
      total = count(DeliveryScanEvent rows for routes of this unit with scan_datetime in window)
      compliant = count(rows where is_compliant == true)
      compliance_rate = total == 0 ? 1.0 : round_half_up(compliant / total, 4)
      meets_target = compliance_rate >= delivery_unit.scan_compliance_target
      # Boundary: rate EXACTLY equal to target (e.g. 0.9800 vs target 0.98) PASSES (>=).
      # Empty-week default of 1.0 (not 0.0) is a pinned policy choice.
    input_set: "DeliveryScanEvent rows for the unit's routes in the half-open week window"
    precision: "4 decimal places, round_half_up"

  - name: renumber_cascade_order
    trigger: "any sequence commit that removes or inserts entries (point discontinue, adjustment transfer, full replace)"
    algorithm: chronological
    formula: |
      After any mutation that changes the set of entries on a route, entries are
      renumbered to a contiguous 1..N permutation. The renumber preserves the
      relative order supplied by the caller (for replace) or the prior relative
      order (for removals). When an insertion payload leaves positions ambiguous
      (a removal), survivors keep ascending line_of_travel_order order; when two
      entries were created at the same position in a replace payload the request
      is rejected (ERR_SEQUENCE_DUPLICATE_POSITION) — never resolved by id.
      For transfers between two routes under an adjustment EFFECTIVE cascade,
      the donor route is renumbered BEFORE the receiving route (pinned order),
      and within the receiving route incoming points are appended in ascending
      order of their prior line_of_travel_order on the donor route; ties are
      broken by the point's created_at ASC (never by id).
    input_set: "RouteSequenceEntry rows of affected routes"
    precision: "integer positions"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for all non-Anonymous endpoints"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id exists, left-to-right (unit → point/route/evaluation/adjustment/hold/coa/inquiry), and belongs to its declared parent"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"
  - priority: 4
    category: existence
    check: "Body-supplied FK references (route_id, delivery_point_id, helper_carrier_id, dest_facility_id, supersedes_coa_id, related_scan_event_id) exist"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "endpoints with body FKs"
  - priority: 5
    category: state
    check: "Target resource in the required state for the transition (all state-machine preconditions keyed on the entity's own status fields)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_*_version body field (where §1.2.1 declares one) equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST sequence-entries, POST evaluations, POST service-standard-rules"
  - priority: 7
    category: business_safety
    check: "USO: no operation may leave an is_deliverable DeliveryPoint without a route assignment; route suspend requires active_delivery_point_count == 0; universal_service_obligation flag is immutable and always true"
    error_id: ERR_USO_VIOLATION
    http_status: 422
    applies_to: "route suspend, point discontinue, adjustment approve"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: RouteAdjustment approve/reject actor X-User-ID != submitter_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "adjustment approve / reject"
  - priority: 9
    category: business_referential
    check: "Cross-entity state gates: evaluation create requires route STANDARD; adjustment submit requires evaluation CONSULTED; COA activate requires validation_status VERIFIED; auxiliary approve requires helper not INACTIVE"
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "evaluation create, adjustment submit, coa activate, auxiliary approve"
  - priority: 10
    category: business_temporal
    check: "Temporal windows: TEMPORARY COA end_date within begin+364 days; HoldMail window <= 30 days and start >= today; adjustment effective_date >= approval + 7 days; FULL_COUNT count_week_start >= today + 14 and a Saturday; seasonal_surge_flag only within Nov 15 – Jan 2"
    error_id: ERR_TEMPORAL_WINDOW
    http_status: 422
    applies_to: "coa create, hold create, adjustment approve, evaluation begin-count, auxiliary approve"
  - priority: 11
    category: business_temporal
    check: "Overlap: ServiceStandardRule windows for same (origin,dest,mail_class) must not overlap (end-adjacency == conflict); ACTIVE COA per old point unique; HoldMail half-open windows per point must not intersect"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "rule create, coa activate, hold create"
  - priority: 12
    category: business_constraint
    check: "Sequence integrity: replace payload positions are a permutation of 1..N with no duplicates (ERR_SEQUENCE_DUPLICATE_POSITION); point must belong to the route and be deliverable-eligible"
    error_id: ERR_SEQUENCE_INVALID
    http_status: 422
    applies_to: "sequence-entries replace"
  - priority: 13
    category: business_constraint
    check: "Case capacity: computed case_slot_letters / case_slot_flats for every entry <= case_slot_count_per_route"
    error_id: ERR_CASE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "sequence-entries replace"
  - priority: 14
    category: business_constraint
    check: "Numeric ranges: counts >= 0; service_days 1..7; non_contiguous_extra_days 0..10; proposed_evaluated_minutes 240..600; scan_compliance_target 0.5..1.0"
    error_id: ERR_RANGE_VIOLATION
    http_status: 422
    applies_to: "create/update endpoints with numeric inputs"
  - priority: 15
    category: business_fiscal
    check: "Auxiliary thresholds: projected_overrun_minutes >= 30; scheduled_minutes capped at 240 (computed, never over cap); vacancy-based discontinue requires vacancy_days >= 90"
    error_id: ERR_OVERRUN_BELOW_THRESHOLD
    http_status: 422
    applies_to: "auxiliary create, point discontinue"
  - priority: 16
    category: business_fiscal
    check: "No service rule covering (origin, dest, mail_class, acceptance_date)"
    error_id: ERR_NO_SERVICE_RULE
    http_status: 422
    applies_to: "service-standard-queries"
  - priority: 17
    category: business_constraint
    check: "Uniqueness: facility_code, unit_code, zip11, employee_id, route_code-per-unit unique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "create endpoints"
  - priority: 18
    category: business_constraint
    check: "Required fields present and well-formed (regex formats, enum membership, date formats)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 19
    category: business_referential
    check: "Consultation loop guard: order-recollection only from CONSULTED with outcome DISPUTED and recollection_used == false"
    error_id: ERR_RECOLLECTION_EXHAUSTED
    http_status: 409
    applies_to: "order-recollection"
  - priority: 20
    category: state
    check: "Terminal-state lockdown (evaluated with priority-5 state semantics: a terminal source state yields ERR_ALREADY_TERMINAL rather than the generic ERR_INVALID_STATE): no transitions from DISCONTINUED (point), EXPIRED/CANCELLED (coa), EFFECTIVE/REJECTED/WITHDRAWN (adjustment), CLOSED_* (evaluation), CLOSED_ABANDONED/RESOLVED_FINAL (inquiry), COMPLETED/CURTAILED/DENIED (auxiliary), RETIRED (service rule), EXPIRED/COMPLETED/CANCELLED (hold mail)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (startup default; never falls back to wall-clock). Fires all date-driven system transitions: COA PENDING→ACTIVE / ACTIVE→EXPIRED, HoldMail SCHEDULED→ACTIVE / ACTIVE→EXPIRED, adjustment APPROVED→EFFECTIVE cascade, auxiliary APPROVED→ACTIVE, inquiry auto-abandon, vacancy recomputation."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, transitions_fired: integer }"
    side_effects: ["all date-driven system transitions listed in the description"]

  # --- ProcessingFacility ---
  - method: POST
    path: "/api/processing-facilities"
    description: "Create a processing facility"
    roles: [ServiceStandardsAdmin]
    code: 201
    input: [facility_code, facility_type, region_class, dispatch_cutoff_local, operating_days]
    output: ProcessingFacility
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/api/processing-facilities/{facilityId}"
    description: "Get a processing facility"
    roles: [ServiceStandardsAdmin, PlatformAdmin, RouteSupervisor, Postmaster, CustomerServiceRep]
    code: 200
    input: []
    output: ProcessingFacility
    side_effects: []

  - method: GET
    path: "/api/processing-facilities"
    description: "List processing facilities with pagination and optional filters"
    roles: [ServiceStandardsAdmin, PlatformAdmin, RouteSupervisor, Postmaster, CustomerServiceRep]
    code: 200
    input: ["region_class?", "status?", "limit?", "offset?"]
    output: "ProcessingFacility[]"
    side_effects: []

  - method: POST
    path: "/api/processing-facilities/{facilityId}/service-standard-rules"
    description: "Create a service standard rule with this facility as origin. OCC-guarded on the facility's version."
    roles: [ServiceStandardsAdmin]
    code: 201
    input: [dest_facility_id, mail_class, service_days, "non_contiguous_extra_days?", effective_from, "effective_to?", expected_facility_version]
    output: ServiceStandardRule
    side_effects:
      - "status := SCHEDULED (ACTIVE once effective_from <= current date)"
      - "overlap check against existing rules for (origin, dest, mail_class)"
      - "increments ProcessingFacility.version by 1"

  - method: GET
    path: "/api/processing-facilities/{facilityId}/service-standard-rules"
    description: "List rules whose origin is this facility (FK reverse-reachability for ServiceStandardRule.origin_facility_id)"
    roles: [ServiceStandardsAdmin, PlatformAdmin, RouteSupervisor, Postmaster, CustomerServiceRep]
    code: 200
    input: ["mail_class?", "status?", "origin_facility_id?", "dest_facility_id?", "limit?", "offset?"]
    output: "ServiceStandardRule[]"
    side_effects: []

  - method: GET
    path: "/api/processing-facilities/{facilityId}/service-standard-rules/{ruleId}"
    description: "Get a single service standard rule scoped to its origin facility"
    roles: [ServiceStandardsAdmin, PlatformAdmin, RouteSupervisor, Postmaster, CustomerServiceRep]
    code: 200
    input: []
    output: ServiceStandardRule
    side_effects: []

  - method: POST
    path: "/api/service-standard-rules/{ruleId}/retire"
    description: "Retire a rule (sets effective_to = current logical date - 1, status RETIRED)"
    roles: [ServiceStandardsAdmin]
    code: 200
    input: []
    output: ServiceStandardRule
    side_effects: ["status := RETIRED; effective_to := current date - 1"]

  # --- ServiceStandardQuery (computed read) ---
  - method: POST
    path: "/api/service-standard-queries"
    description: "Compute the committed delivery date for an origin/dest/class/acceptance tuple; persists the query row"
    roles: [ServiceStandardsAdmin, CustomerServiceRep, RouteSupervisor, Postmaster, PlatformAdmin]
    code: 201
    input: [origin_facility_id, dest_facility_id, mail_class, acceptance_date, acceptance_time_local]
    output: ServiceStandardQuery
    side_effects: ["runs calculation service_standard_delivery_date"]

  - method: GET
    path: "/api/service-standard-queries/{queryId}"
    description: "Get a previously computed query"
    roles: [ServiceStandardsAdmin, CustomerServiceRep, RouteSupervisor, Postmaster, PlatformAdmin]
    code: 200
    input: []
    output: ServiceStandardQuery
    side_effects: []

  - method: GET
    path: "/api/service-standard-queries"
    description: "List computed service standard queries (filtered-list FK reverse-reachability for origin/dest facility references)"
    roles: [ServiceStandardsAdmin, CustomerServiceRep, RouteSupervisor, Postmaster, PlatformAdmin]
    code: 200
    input: ["origin_facility_id?", "dest_facility_id?", "mail_class?", "limit?", "offset?"]
    output: "ServiceStandardQuery[]"
    side_effects: []

  # --- DeliveryUnit ---
  - method: POST
    path: "/api/delivery-units"
    description: "Create a delivery unit"
    roles: [PlatformAdmin]
    code: 201
    input: [unit_code, office_name, delivery_office_facility_id, case_slot_count_per_route, "scan_compliance_target?"]
    output: DeliveryUnit
    side_effects: ["universal_service_obligation := true (immutable)", "active_route_count := 0"]

  - method: GET
    path: "/api/delivery-units/{unitId}"
    description: "Get a delivery unit"
    roles: [PlatformAdmin, Postmaster, RouteSupervisor, AddressManagementSpecialist, CustomerServiceRep, Carrier]
    code: 200
    input: []
    output: DeliveryUnit
    side_effects: []

  - method: GET
    path: "/api/delivery-units"
    description: "List delivery units"
    roles: [PlatformAdmin, Postmaster, RouteSupervisor, AddressManagementSpecialist, CustomerServiceRep]
    code: 200
    input: ["delivery_office_facility_id?", "limit?", "offset?"]
    output: "DeliveryUnit[]"
    side_effects: []

  # --- DeliveryPoint ---
  - method: POST
    path: "/api/delivery-units/{unitId}/delivery-points"
    description: "Create a delivery point (new construction enters UNDER_CONSTRUCTION)"
    roles: [AddressManagementSpecialist]
    code: 201
    input: [address_line1, city, state_code, zip11, point_kind, "delivery_restriction?"]
    output: DeliveryPoint
    side_effects: ["occupancy_status := UNDER_CONSTRUCTION", "active_route_id := null", "vacancy_days := 0"]

  - method: GET
    path: "/api/delivery-units/{unitId}/delivery-points/{pointId}"
    description: "Get a delivery point"
    roles: [AddressManagementSpecialist, RouteSupervisor, Postmaster, CustomerServiceRep, Carrier, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryPoint
    side_effects: ["vacancy_days recomputed against current logical date"]

  - method: GET
    path: "/api/delivery-units/{unitId}/delivery-points"
    description: "List points of a unit (FK reverse-reachability for DeliveryPoint.delivery_unit_id); filterable"
    roles: [AddressManagementSpecialist, RouteSupervisor, Postmaster, CustomerServiceRep, Carrier, PlatformAdmin]
    code: 200
    input: ["occupancy_status?", "active_route_id?", "delivery_unit_id?", "is_deliverable?", "limit?", "offset?"]
    output: "DeliveryPoint[]"
    side_effects: []

  - method: POST
    path: "/api/delivery-units/{unitId}/delivery-points/{pointId}/activate"
    description: "Activate a new-construction point onto a route (UNDER_CONSTRUCTION → OCCUPIED)"
    roles: [AddressManagementSpecialist]
    code: 200
    input: [route_id]
    output: DeliveryPoint
    side_effects:
      - "active_route_id := route_id"
      - "CarrierRoute.active_delivery_point_count += 1"
      - "a RouteSequenceEntry is appended at position N+1 on the target route and case slots recomputed"

  - method: POST
    path: "/api/delivery-units/{unitId}/delivery-points/{pointId}/mark-vacant"
    description: "Carrier marks an occupied point vacant (OCCUPIED → VACANT)"
    roles: [Carrier]
    code: 200
    input: []
    output: DeliveryPoint
    side_effects:
      - "vacant_since_date := current logical date"
      - "CarrierRoute.active_delivery_point_count -= 1"
      - "is_deliverable recomputed"

  - method: POST
    path: "/api/delivery-units/{unitId}/delivery-points/{pointId}/mark-occupied"
    description: "Point returns to occupancy (VACANT|SEASONAL → OCCUPIED)"
    roles: [AddressManagementSpecialist]
    code: 200
    input: []
    output: DeliveryPoint
    side_effects:
      - "vacant_since_date := null"
      - "CarrierRoute.active_delivery_point_count += 1 (when flipping from VACANT)"

  - method: POST
    path: "/api/delivery-units/{unitId}/delivery-points/{pointId}/mark-seasonal"
    description: "Mark an occupied point seasonal (OCCUPIED → SEASONAL)"
    roles: [AddressManagementSpecialist]
    code: 200
    input: []
    output: DeliveryPoint
    side_effects: []

  - method: POST
    path: "/api/delivery-units/{unitId}/delivery-points/{pointId}/discontinue"
    description: "Discontinue a long-vacant point (VACANT → DISCONTINUED; requires vacancy_days >= 90)"
    roles: [AddressManagementSpecialist]
    code: 200
    input: []
    output: DeliveryPoint
    side_effects:
      - "RouteSequenceEntry removed; route renumbered (renumber_cascade_order)"
      - "CarrierRoute.active_delivery_point_count recomputed"

  # --- Carrier ---
  - method: POST
    path: "/api/delivery-units/{unitId}/carriers"
    description: "Create a carrier at the unit"
    roles: [Postmaster]
    code: 201
    input: [employee_id, full_name, carrier_class]
    output: Carrier
    side_effects: ["status := AVAILABLE"]

  - method: GET
    path: "/api/delivery-units/{unitId}/carriers/{carrierId}"
    description: "Get a carrier"
    roles: [Postmaster, RouteSupervisor, PlatformAdmin, Carrier]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/api/delivery-units/{unitId}/carriers"
    description: "List carriers of a unit (FK reverse-reachability for Carrier.delivery_unit_id)"
    roles: [Postmaster, RouteSupervisor, PlatformAdmin]
    code: 200
    input: ["carrier_class?", "status?", "delivery_unit_id?", "limit?", "offset?"]
    output: "Carrier[]"
    side_effects: []

  # --- CarrierRoute ---
  - method: POST
    path: "/api/delivery-units/{unitId}/routes"
    description: "Create a carrier route"
    roles: [RouteSupervisor]
    code: 201
    input: [route_code, assigned_carrier_id, route_type]
    output: CarrierRoute
    side_effects:
      - "status := STANDARD; current_evaluated_minutes := 480; auxiliary_relief_minutes := 0"
      - "DeliveryUnit.active_route_count += 1"

  - method: GET
    path: "/api/delivery-units/{unitId}/routes/{routeId}"
    description: "Get a route"
    roles: [RouteSupervisor, Postmaster, AddressManagementSpecialist, CustomerServiceRep, Carrier, PlatformAdmin]
    code: 200
    input: []
    output: CarrierRoute
    side_effects: []

  - method: GET
    path: "/api/delivery-units/{unitId}/routes"
    description: "List routes of a unit (FK reverse-reachability for CarrierRoute.delivery_unit_id)"
    roles: [RouteSupervisor, Postmaster, AddressManagementSpecialist, CustomerServiceRep, PlatformAdmin]
    code: 200
    input: ["status?", "delivery_unit_id?", "assigned_carrier_id?", "limit?", "offset?"]
    output: "CarrierRoute[]"
    side_effects: []

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/suspend"
    description: "Suspend an emptied route (STANDARD → SUSPENDED; requires zero active points)"
    roles: [Postmaster]
    code: 200
    input: []
    output: CarrierRoute
    side_effects:
      - "open AuxiliaryAssignment rows → CURTAILED; auxiliary_relief_minutes := 0"
      - "DeliveryUnit.active_route_count -= 1"

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/reactivate"
    description: "Reactivate a suspended route with a replacement carrier (SUSPENDED → STANDARD)"
    roles: [Postmaster]
    code: 200
    input: [assigned_carrier_id]
    output: CarrierRoute
    side_effects:
      - "assigned_carrier_id := payload value"
      - "DeliveryUnit.active_route_count += 1"

  # --- RouteSequenceEntry ---
  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/sequence-entries"
    description: "Replace the full line-of-travel sequence for the route (atomic permutation commit). OCC-guarded on route version."
    roles: [RouteSupervisor]
    code: 200
    input: [expected_route_version, entries]
    output: "RouteSequenceEntry[]"
    side_effects:
      - "entries validated as permutation of 1..N (ERR_SEQUENCE_DUPLICATE_POSITION on duplicates)"
      - "case_slot_letters / case_slot_flats recomputed for every entry (case_setup_mapping)"
      - "capacity check ERR_CASE_CAPACITY_EXCEEDED (all letters slots first, then flats)"
      - "each entry's delivery_point.active_route_id synced to this route"
      - "increments CarrierRoute.version by 1"

  - method: GET
    path: "/api/delivery-units/{unitId}/routes/{routeId}/sequence-entries"
    description: "List sequence entries of a route ordered by line_of_travel_order (FK reverse-reachability for RouteSequenceEntry.carrier_route_id)"
    roles: [RouteSupervisor, Postmaster, AddressManagementSpecialist, Carrier, PlatformAdmin]
    code: 200
    input: ["carrier_route_id?", "delivery_point_id?", "limit?", "offset?"]
    output: "RouteSequenceEntry[]"
    side_effects: []

  # --- RouteEvaluation / RouteAdjustment ---
  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations"
    description: "Open a route evaluation (route STANDARD → UNDER_EVALUATION). OCC-guarded on route version."
    roles: [RouteSupervisor]
    code: 201
    input: [evaluation_kind, count_week_start, expected_route_version]
    output: RouteEvaluation
    side_effects:
      - "CarrierRoute.status := UNDER_EVALUATION; under_evaluation_since := now"
      - "status := INITIATED; consultation_outcome := PENDING; recollection_used := false"
      - "increments CarrierRoute.version by 1"

  - method: GET
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}"
    description: "Get an evaluation"
    roles: [RouteSupervisor, Postmaster, PlatformAdmin]
    code: 200
    input: []
    output: RouteEvaluation
    side_effects: []

  - method: GET
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations"
    description: "List evaluations of a route (FK reverse-reachability for RouteEvaluation.carrier_route_id)"
    roles: [RouteSupervisor, Postmaster, PlatformAdmin]
    code: 200
    input: ["status?", "carrier_route_id?", "limit?", "offset?"]
    output: "RouteEvaluation[]"
    side_effects: []

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/begin-count"
    description: "INITIATED → DATA_COLLECTION"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: RouteEvaluation
    side_effects: ["lead-time validation for FULL_COUNT"]

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/submit-counts"
    description: "DATA_COLLECTION → CONSULTATION_SCHEDULED; computes modeled street time"
    roles: [RouteSupervisor]
    code: 200
    input: [letters_count_total, flats_count_total, parcels_count_total, actual_street_minutes_total, office_minutes_total]
    output: RouteEvaluation
    side_effects: ["modeled_street_minutes_total computed (modeled_street_time)"]

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/record-consultation"
    description: "CONSULTATION_SCHEDULED → CONSULTED; computes evaluated_daily_minutes"
    roles: [RouteSupervisor]
    code: 200
    input: [consultation_outcome]
    output: RouteEvaluation
    side_effects: ["evaluated_daily_minutes computed (evaluated_daily_minutes)"]

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/order-recollection"
    description: "CONSULTED → DATA_COLLECTION re-collection loop (once only, on DISPUTED)"
    roles: [Postmaster]
    code: 200
    input: []
    output: RouteEvaluation
    side_effects: ["recollection_used := true", "count inputs zeroed"]

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/close-rejected"
    description: "CONSULTED → CLOSED_REJECTED; route bubbles back to STANDARD"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: RouteEvaluation
    side_effects: ["CarrierRoute.status := STANDARD; under_evaluation_since := null"]

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/adjustments"
    description: "Create a DRAFT adjustment on a CONSULTED evaluation"
    roles: [RouteSupervisor]
    code: 201
    input: [proposed_evaluated_minutes, points_transferred_out, effective_date]
    output: RouteAdjustment
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/adjustments"
    description: "List adjustments of an evaluation (FK reverse-reachability for RouteAdjustment.route_evaluation_id)"
    roles: [RouteSupervisor, Postmaster, PlatformAdmin]
    code: 200
    input: ["status?", "route_evaluation_id?", "limit?", "offset?"]
    output: "RouteAdjustment[]"
    side_effects: []

  - method: GET
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/adjustments/{adjId}"
    description: "Get an adjustment"
    roles: [RouteSupervisor, Postmaster, PlatformAdmin]
    code: 200
    input: []
    output: RouteAdjustment
    side_effects: []

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/adjustments/{adjId}/submit"
    description: "DRAFT → SUBMITTED; records submitter_user_id for segregation of duties"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: RouteAdjustment
    side_effects: ["submitter_user_id := X-User-ID"]

  - method: POST
    path: "/api/delivery-units/{unitId}/routes/{routeId}/evaluations/{evalId}/adjustments/{adjId}/approve"
    description: "SUBMITTED → APPROVED; segregation-of-duties enforced; route → UNDER_ADJUSTMENT"
    roles: [Postmaster]
    code: 200
    input: []
    output: RouteAdjustment
    side_effects:
