endpoints:
  - { method: POST, path: "/deposit-products", description: "Create a deposit product (config)", roles: [OperationsAdmin], code: 201, input: [product_code, product_class, term_months, tier_application, rate_cap_bp, allows_promos, allows_exceptions], output: DepositProduct, side_effects: [] }
  - { method: GET, path: "/deposit-products", description: "List products", roles: [OperationsAdmin, PricingAnalyst, PricingCommittee, BranchBanker], code: 200, input: ["product_class?", "limit?", "offset?"], output: "DepositProduct[]", side_effects: [] }

  - { method: POST, path: "/rate-sheets", description: "Create a DRAFT rate sheet with embedded tiers; auto-creates RepricingCycle for the (product, market) pair if absent (default cadence 30 days)", roles: [PricingAnalyst], code: 201, input: [product_id, market_code, effective_date, "end_date?", disclosure_lead_days, margin_floor_bp, "source_scan_id?", tiers], output: RateSheet, side_effects: ["sheet_version assigned; total_projected_balance_cents computed; RepricingCycle auto-created if missing"] }
  - { method: GET, path: "/rate-sheets", description: "List rate sheets with filters", roles: [PricingAnalyst, PricingCommittee, BranchBanker, ComplianceOfficer], code: 200, input: ["product_id?", "market_code?", "status?", "supersedes_sheet_id?", "source_scan_id?", "limit?", "offset?"], output: "RateSheet[]", side_effects: [] }
  - { method: GET, path: "/rate-sheets/{id}", description: "Get one rate sheet", roles: [PricingAnalyst, PricingCommittee, BranchBanker, ComplianceOfficer], code: 200, input: [], output: RateSheet, side_effects: [] }
  - { method: PATCH, path: "/rate-sheets/{id}", description: "Edit a DRAFT sheet (OCC-guarded); tiers replaced wholesale when provided", roles: [PricingAnalyst], code: 200, input: [expected_sheet_version, "disclosure_lead_days?", "margin_floor_bp?", "effective_date?", "end_date?", "tiers?"], output: RateSheet, side_effects: ["increments RateSheet.version by 1; total_projected_balance_cents recomputed"] }
  - { method: POST, path: "/rate-sheets/{id}/submit", description: "DRAFT -> COMMITTEE_REVIEW (margin gate)", roles: [PricingAnalyst], code: 200, input: [], output: RateSheet, side_effects: ["increments RateSheet.version by 1"] }
  - { method: POST, path: "/rate-sheets/{id}/review-decision", description: "Committee APPROVE or RETURN (return routes: COMMITTEE_REVIEW->DRAFT, APPROVED->COMMITTEE_REVIEW, SCHEDULED->APPROVED with deployment/notice cleanup)", roles: [PricingCommittee], code: 200, input: [decision, "reason?"], output: RateSheet, side_effects: ["increments RateSheet.version by 1; RETURN from SCHEDULED deletes PENDING/FAILED deployments and PENDING notices"] }
  - { method: POST, path: "/rate-sheets/{id}/schedule", description: "APPROVED -> SCHEDULED; overlap check; creates 4 deployments + 4 PRE_CHANGE notices", roles: [PricingAnalyst], code: 200, input: [], output: RateSheet, side_effects: ["increments RateSheet.version by 1; creates RateDeployment x4 (PENDING); creates DisclosureNotice x4 (PRE_CHANGE, PENDING)"] }
  - { method: POST, path: "/rate-sheets/{id}/activate", description: "SCHEDULED -> EFFECTIVE; runs the supersession/repricing/notice cascade", roles: [PricingAnalyst], code: 200, input: [], output: RateSheet, side_effects: ["increments RateSheet.version by 1; supersedes prior EFFECTIVE sheet; reprices variable accounts; grandfatheres term accounts; creates RATE_CHANGE_ADVERSE notices for drops >= 10 bp; advances RepricingCycle; scan -> ACTIONED; pending exceptions on old sheet -> REBASE_REQUIRED"] }
  - { method: POST, path: "/rate-sheets/{id}/retire", description: "DRAFT/EFFECTIVE/SUPERSEDED -> RETIRED when no accounts reference the sheet", roles: [PricingCommittee], code: 200, input: [], output: RateSheet, side_effects: ["increments RateSheet.version by 1"] }
  - { method: GET, path: "/rate-sheets/{id}/margin-analysis", description: "Computed margin read; variant FORWARD_LOOKING (default) or REALIZED_BOOK", roles: [PricingAnalyst, PricingCommittee, TreasuryOfficer], code: 200, input: ["variant?"], output: "{ variant: string, weighted_rate_bp: integer, funding_cost_bp: integer, margin_bp: integer, margin_floor_bp: integer, passes_floor: boolean }", side_effects: [] }

  - { method: GET, path: "/rate-deployments", description: "List deployment rows", roles: [PricingAnalyst, ChannelOperator, ComplianceOfficer], code: 200, input: ["sheet_id?", "channel?", "status?", "limit?", "offset?"], output: "RateDeployment[]", side_effects: [] }
  - { method: GET, path: "/rate-deployments/{id}", description: "Get one deployment", roles: [PricingAnalyst, ChannelOperator, ComplianceOfficer], code: 200, input: [], output: RateDeployment, side_effects: [] }
  - { method: POST, path: "/rate-deployments/{id}/execution", description: "DEPLOY (PENDING/FAILED -> DEPLOYED) or MARK_FAILED (PENDING -> FAILED)", roles: [ChannelOperator], code: 200, input: [action], output: RateDeployment, side_effects: [] }

  - { method: POST, path: "/competitor-rate-scans", description: "Upload a competitor rate scan with embedded entries", roles: [PricingAnalyst], code: 201, input: [market_code, scan_date, source_name, entries], output: CompetitorRateScan, side_effects: [] }
  - { method: GET, path: "/competitor-rate-scans", description: "List scans", roles: [PricingAnalyst, PricingCommittee], code: 200, input: ["market_code?", "status?", "limit?", "offset?"], output: "CompetitorRateScan[]", side_effects: [] }
  - { method: GET, path: "/competitor-rate-scans/{id}", description: "Get one scan", roles: [PricingAnalyst, PricingCommittee], code: 200, input: [], output: CompetitorRateScan, side_effects: [] }
