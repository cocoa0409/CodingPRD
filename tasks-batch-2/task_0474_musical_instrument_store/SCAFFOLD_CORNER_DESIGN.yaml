          trigger:
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c2}", inventory_unit_id: "${u}", plan: "RENTAL" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_RESERVATION_MISMATCH"
            - "InventoryUnit.${u}.status == RESERVED"

      - name: deposit_insufficient_excluded
        claim_type: Violation to Error
        grounds: ["validations[priority=10]", "errors[ERR_DEPOSIT_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / deposit_exactly_meets_required_boundary
          rationale: "The exact-boundary accept and its one-cent-below reject are the focus of the named §1.8 boundary instance."

      - name: credit_too_low_excluded
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", "errors[ERR_CREDIT_TOO_LOW]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / financing_approve_depends_on_customer_credit
          rationale: "The credit-score gate on approval is the core of the named §1.8 cross-entity instance."

