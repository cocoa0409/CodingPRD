# =============================================================================
# task_0794 — Self-Storage Lien Auction Marketplace (StorageTreasures style)
# Difficulty: Expert
# =============================================================================

scenario: |
  Self-Storage Lien Auction Marketplace (StorageTreasures style): defaulted-unit
  lien process & notice, auction listing (online/onsite) & bidding, buyer
  registration & deposit, winning & cleanout deadline, payment & sales-tax,
  surplus/overage to tenant, facility settlement, dispute

domain_name: storage-lien-auction
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel        # Sale carries parallel payment_status x cleanout_status; Dispute is cyclic; Auction branches at close
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                       # Dispute references either a Sale or a Settlement
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: state_code, type: string, source: input, description: "US state code, used only for auditing (tax rate is pinned per-facility)" }
      - { name: sales_tax_rate_bps, type: integer, source: input, description: "Sales-tax rate in basis points (e.g. 800 = 8.00%) applied to buyer's taxable amount" }
      - { name: facility_fee_bps, type: integer, source: input, description: "Facility auction commission in basis points, taken from hammer proceeds in the settlement waterfall" }
      - { name: recovery_balance_cents, type: integer, source: computed, default: 0, description: "Running total credited to the facility: lien_recovered + facility_fee + buyer_premium from finalized settlements, plus forfeited buyer deposits; reduced when a settlement is reversed" }

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: full_name, type: string, source: input, description: "Tenant full name" }
      - { name: email, type: string, source: input, description: "Tenant contact email" }
      - { name: access_status, type: enum, source: computed, default: "ACTIVE", description: "ACTIVE | REVOKED — flips to REVOKED when the tenant's unit lien matures" }
      - { name: surplus_balance_cents, type: integer, source: computed, default: 0, description: "Overage owed to the tenant, credited when a settlement is finalized; reversed if that settlement is reversed via an upheld dispute" }

  - name: StorageUnit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id" }
      - { name: unit_number, type: string, source: input, description: "Human-readable unit label" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Monthly rent; daily accrual = round_half_up(monthly_rent_cents / 30)" }
      - { name: past_due_balance_cents, type: integer, source: system, default: 0, description: "Rent already in arrears at notice time; supplied when the lien notice is created; zeroed on cure" }
      - { name: status, type: enum, source: system, default: "RENTED", description: "RENTED | LIEN_NOTICED | LIEN_MATURED | IN_AUCTION | SOLD | CLEARED" }
      - { name: lien_amount_provisional_cents, type: integer, source: computed, default: 0, description: "Provisional lien pinned at notice creation (accrues rent through cure_deadline)" }
      - { name: lien_amount_final_cents, type: integer, source: computed, default: 0, description: "Final lien pinned at maturation (accrues rent through the maturation instant)" }

  - name: LienNotice
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> StorageUnit.id" }
      - { name: notice_sent_at, type: datetime, source: system, description: "Logical-clock instant the notice was created" }
      - { name: cure_deadline, type: datetime, source: computed, description: "notice_sent_at + CURE_DAYS (14 days); tenant may cure at or before this instant" }
      - { name: lien_amount_cents, type: integer, source: computed, description: "Provisional amount at creation; recomputed to the final amount at maturation" }
      - { name: status, type: enum, source: system, default: "SENT", description: "SENT | CURED | MATURED | WITHDRAWN" }

  - name: Auction
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> StorageUnit.id" }
      - { name: mode, type: enum, source: input, description: "ONLINE | ONSITE" }
      - { name: start_at, type: datetime, source: input, description: "Bidding-open instant (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Bidding-close instant; window is half-open [start_at, end_at)" }
      - { name: reserve_cents, type: integer, source: input, description: "Minimum acceptable hammer price; below reserve at close = no sale" }
      - { name: min_increment_cents, type: integer, source: input, description: "Minimum raise over the current high bid" }
      - { name: high_bid_cents, type: integer, source: computed, default: 0, description: "Amount of the current ACTIVE high bid; 0 when no ACTIVE bids" }
      - { name: high_bid_id, type: string, source: computed, description: "Bid.id of the current high bid; null when none" }
      - { name: min_next_bid_cents, type: integer, source: computed, description: "reserve_cents when high_bid_cents == 0, else high_bid_cents + min_increment_cents" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | LIVE | CLOSED | CANCELLED | SETTLED" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Buyer full name" }
      - { name: email, type: string, source: input, description: "Buyer contact email" }
      - { name: status, type: enum, source: system, default: "REGISTERED", description: "REGISTERED | SUSPENDED — suspended on cleanout/payment forfeiture" }
      - { name: deposit_available_cents, type: integer, source: computed, default: 0, description: "Un-held deposit funds; must be >= DEPOSIT_REQUIRED_CENTS to place a bid" }
      - { name: deposit_held_cents, type: integer, source: computed, default: 0, description: "Deposit held against an open winning Sale; released on payment/refund, forfeited on default" }
      - { name: deposit_forfeited_cents, type: integer, source: computed, default: 0, description: "Cumulative deposit lost to forfeitures" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: input, description: "FK -> Auction.id" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount" }
      - { name: placed_at, type: datetime, source: system, description: "Logical-clock instant the bid was placed; tie-break key for high-bid selection" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | OUTBID | WINNING | LOST | RETRACTED" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: input, description: "FK -> Auction.id" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id" }
      - { name: winning_amount_cents, type: integer, source: computed, description: "Hammer price = auction.high_bid_cents at close" }
      - { name: buyer_premium_cents, type: integer, source: computed, description: "round_half_up(winning_amount_cents * BUYER_PREMIUM_BPS / 10000)" }
      - { name: sales_tax_cents, type: integer, source: computed, description: "round_half_up((winning_amount_cents + buyer_premium_cents) * facility.sales_tax_rate_bps / 10000)" }
      - { name: total_due_cents, type: integer, source: computed, description: "winning_amount_cents + buyer_premium_cents + sales_tax_cents" }
      - { name: estimated_surplus_cents, type: integer, source: computed, description: "Surplus projected at close using the PROVISIONAL lien" }
      - { name: payment_deadline, type: datetime, source: computed, description: "created_at + PAYMENT_WINDOW_HOURS (48h)" }
      - { name: cleanout_deadline, type: datetime, source: computed, description: "created_at + CLEANOUT_DAYS (3 days)" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | PAID | REFUNDED | FORFEITED (independent axis)" }
      - { name: cleanout_status, type: enum, source: system, default: "PENDING", description: "PENDING | COMPLETED | OVERDUE | VOIDED (independent axis)" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id" }
      - { name: gross_proceeds_cents, type: integer, source: computed, description: "Hammer price distributed by the waterfall = sale.winning_amount_cents" }
      - { name: lien_recovered_cents, type: integer, source: computed, description: "Waterfall bucket 1 = min(gross_proceeds_cents, unit.lien_amount_final_cents)" }
      - { name: facility_fee_cents, type: integer, source: computed, description: "Waterfall bucket 2 = min(round_half_up(gross_proceeds_cents * facility.facility_fee_bps / 10000), gross_proceeds_cents - lien_recovered_cents)" }
      - { name: surplus_cents, type: integer, source: computed, description: "Waterfall bucket 3 = gross_proceeds_cents - lien_recovered_cents - facility_fee_cents (overage to tenant)" }
      - { name: status, type: enum, source: system, default: "FINALIZED", description: "FINALIZED | REVERSED" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: input, description: "SALE | SETTLEMENT" }
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id (present when subject_type=SALE)" }
      - { name: settlement_id, type: string, source: input, description: "FK -> Settlement.id (present when subject_type=SETTLEMENT)" }
      - { name: raised_by, type: enum, source: input, description: "TENANT | BUYER" }
      - { name: reason, type: string, source: input, description: "Free-text dispute reason" }
      - { name: resolution, type: enum, source: computed, description: "UPHELD | DENIED — null until resolved" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | UNDER_REVIEW | NEEDS_INFO | UPHELD | DENIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StorageUnit
    initial_state: RENTED
    terminal_states: [CLEARED]
    transitions:
      - from: RENTED
        to: LIEN_NOTICED
        trigger: "POST /units/{unit_id}/lien-notices"
        actor: FacilityOperator
        preconditions:
          - "unit.status == RENTED"
          - "past_due_balance_cents > 0 (ERR_VALIDATION)"
        side_effects:
          - "creates LienNotice (status=SENT), notice_sent_at = clock now, cure_deadline = notice_sent_at + 14 days"
          - "sets unit.past_due_balance_cents = past_due_balance_cents"
          - "computes lien_amount_provisional_cents (calculation lien_amount, PROVISIONAL variant); LienNotice.lien_amount_cents = provisional"

      - from: LIEN_NOTICED
        to: RENTED
        trigger: "POST /units/{unit_id}/cure"
        actor: Tenant
        preconditions:
          - "unit.status == LIEN_NOTICED"
          - "the unit's SENT LienNotice exists and clock now <= LienNotice.cure_deadline (ERR_CURE_WINDOW_CLOSED)"
        side_effects:
          - "LienNotice.status SENT -> CURED"
          - "unit.past_due_balance_cents = 0"

      - from: LIEN_NOTICED
        to: LIEN_MATURED
        trigger: "POST /lien-notices/{lien_notice_id}/mature"
        actor: FacilityOperator
        preconditions:
          - "LienNotice.status == SENT"
          - "clock now > LienNotice.cure_deadline (ERR_MATURE_TOO_EARLY)"
        side_effects:
          - "LienNotice.status SENT -> MATURED"
          - "unit.status LIEN_NOTICED -> LIEN_MATURED"
          - "computes lien_amount_final_cents (calculation lien_amount, FINAL variant); LienNotice.lien_amount_cents = final"
          - "cross-entity cascade: Tenant.access_status ACTIVE -> REVOKED"

      - from: LIEN_MATURED
        to: IN_AUCTION
        trigger: "POST /auctions/{auction_id}/open"
        actor: FacilityOperator
        preconditions:
          - "unit.status == LIEN_MATURED (a unit may hold several SCHEDULED auctions but only one may be opened; the second open sees unit != LIEN_MATURED -> ERR_INVALID_STATE)"
        side_effects:
          - "unit.status LIEN_MATURED -> IN_AUCTION"
        note: "Scheduling (POST /auctions) does NOT flip the unit; the unit stays LIEN_MATURED so overlapping-window scheduling can be rejected. The flip happens on open."

      - from: IN_AUCTION
        to: SOLD
        trigger: "system, on POST /auctions/{auction_id}/close with a winning bid"
        actor: system
        preconditions:
          - "auction has >= 1 ACTIVE bid and high_bid_cents >= reserve_cents"
        side_effects:
          - "creates Sale (payment_status=UNPAID, cleanout_status=PENDING)"
          - "unit.status IN_AUCTION -> SOLD"

      - from: IN_AUCTION
        to: LIEN_MATURED
        trigger: "system, on POST /auctions/{auction_id}/close with no qualifying bid"
        actor: system
        preconditions:
          - "auction has 0 ACTIVE bids OR high_bid_cents < reserve_cents"
        side_effects:
          - "no Sale created; unit.status IN_AUCTION -> LIEN_MATURED (eligible for re-listing)"

      - from: SOLD
        to: CLEARED
        trigger: "POST /sales/{sale_id}/cleanout"
        actor: Buyer
        preconditions:
          - "Sale.payment_status == PAID (ERR_SALE_NOT_PAID)"
          - "Sale.cleanout_status == PENDING"
        side_effects:
          - "Sale.cleanout_status PENDING -> COMPLETED"
          - "unit.status SOLD -> CLEARED"

  - entity: LienNotice
    initial_state: SENT
    terminal_states: [CURED, MATURED, WITHDRAWN]
    transitions:
      - from: SENT
        to: CURED
        trigger: "POST /units/{unit_id}/cure"
        actor: Tenant
        preconditions: ["clock now <= cure_deadline"]
        side_effects: ["see StorageUnit LIEN_NOTICED -> RENTED"]
      - from: SENT
        to: MATURED
        trigger: "POST /lien-notices/{lien_notice_id}/mature"
        actor: FacilityOperator
        preconditions: ["clock now > cure_deadline"]
        side_effects: ["lien_amount_cents recomputed to FINAL variant; see StorageUnit LIEN_NOTICED -> LIEN_MATURED"]

  - entity: Auction
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, SETTLED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /auctions/{auction_id}/open"
        actor: FacilityOperator
        preconditions:
          - "auction.status == SCHEDULED"
          - "unit.status == LIEN_MATURED (ERR_INVALID_STATE if another auction already opened this unit)"
          - "clock now >= start_at (ERR_OPEN_TOO_EARLY)"
        side_effects:
          - "auction.status SCHEDULED -> LIVE"
          - "unit.status LIEN_MATURED -> IN_AUCTION"
          - "increments Auction.version by 1"

      - from: LIVE
        to: CLOSED
        trigger: "POST /auctions/{auction_id}/close"
        actor: FacilityOperator
        preconditions:
          - "auction.status == LIVE"
          - "clock now >= end_at (ERR_AUCTION_NOT_ENDED)"
        side_effects:
          - "high-bid selection over ACTIVE bids (calculation high_bid_selection)"
          - "branch A (>=1 ACTIVE bid AND high_bid_cents >= reserve_cents): winning Bid ACTIVE -> WINNING; all other ACTIVE bids ACTIVE -> LOST; creates Sale; computes buyer_premium/sales_tax/total_due/estimated_surplus/payment_deadline/cleanout_deadline; holds DEPOSIT_REQUIRED_CENTS on winning buyer (deposit_available_cents -= 20000, deposit_held_cents += 20000); unit -> SOLD"
          - "branch B (0 ACTIVE bids OR high_bid_cents < reserve_cents): all ACTIVE bids -> LOST; no Sale; unit IN_AUCTION -> LIEN_MATURED"
          - "increments Auction.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (out-of-scope admin cancel; listed for terminal completeness)"
        actor: system
        preconditions: []
        side_effects: ["unit IN_AUCTION -> LIEN_MATURED"]

      - from: CLOSED
        to: SETTLED
        trigger: "system, on POST /sales/{sale_id}/pay (settlement finalized)"
        actor: system
        preconditions: ["a Sale for this auction reached payment_status=PAID"]
        side_effects: ["auction.status CLOSED -> SETTLED"]

  - entity: Bid
    initial_state: ACTIVE
    terminal_states: [LOST, RETRACTED, OUTBID]
    transitions:
      - from: ACTIVE
        to: OUTBID
        trigger: "system, on a later qualifying POST /auctions/{auction_id}/bids"
        actor: system
        preconditions: ["this bid is the current high bid and a new ACTIVE bid clears min_next_bid_cents"]
        side_effects: ["auction.high_bid_cents/high_bid_id point at the new bid"]
      - from: ACTIVE
        to: WINNING
        trigger: "system, on POST /auctions/{auction_id}/close (branch A)"
        actor: system
        preconditions: ["this bid is the high bid and high_bid_cents >= reserve_cents"]
        side_effects: ["Sale created for this bid's buyer"]
      - from: ACTIVE
        to: LOST
        trigger: "system, on POST /auctions/{auction_id}/close"
        actor: system
        preconditions: ["this bid is ACTIVE but not the winning bid, or branch B"]
        side_effects: []
      - from: ACTIVE
        to: RETRACTED
        trigger: "POST /bids/{bid_id}/retract"
        actor: Buyer
        preconditions: ["bid.status == ACTIVE", "auction.status == LIVE"]
        side_effects: ["if this was the high bid, auction re-selects high bid over remaining ACTIVE bids (0 -> high_bid_cents resets to 0)"]

  - entity: Sale
    note: "Parallel state dimensions — payment_status and cleanout_status evolve independently on the same row."
    initial_state: "payment_status=UNPAID, cleanout_status=PENDING"
    terminal_states: ["payment_status in {REFUNDED, FORFEITED}", "cleanout_status in {COMPLETED, VOIDED}"]
    transitions:
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: "POST /sales/{sale_id}/pay"
        actor: Buyer
        preconditions:
          - "payment_status == UNPAID"
          - "clock now <= payment_deadline (ERR_PAYMENT_WINDOW_EXPIRED)"
          - "cross-entity: Buyer.status != SUSPENDED (ERR_BUYER_SUSPENDED)"
        side_effects:
          - "payment_status UNPAID -> PAID"
          - "releases buyer deposit hold (deposit_held_cents -= 20000, deposit_available_cents += 20000)"
          - "cascade: creates + finalizes Settlement (calculation surplus_distribution, FINAL variant)"
          - "cascade: Settlement finalize credits Tenant.surplus_balance_cents += surplus_cents AND Facility.recovery_balance_cents += lien_recovered_cents + facility_fee_cents + buyer_premium_cents"
          - "auction CLOSED -> SETTLED"

      - from: "payment_status=UNPAID"
        to: "payment_status=FORFEITED"
        trigger: "POST /sales/{sale_id}/forfeit"
        actor: FacilityOperator
        preconditions:
          - "payment_status == UNPAID"
          - "clock now > payment_deadline"
        side_effects:
          - "payment_status UNPAID -> FORFEITED; cleanout_status PENDING -> VOIDED"
          - "cascade: buyer deposit hold HELD -> forfeited (deposit_held_cents -= 20000, deposit_forfeited_cents += 20000)"
          - "cascade: Facility.recovery_balance_cents += 20000 (forfeited deposit)"
          - "unit SOLD -> LIEN_MATURED; Buyer.status REGISTERED -> SUSPENDED"

      - from: "payment_status=PAID"
        to: "payment_status=REFUNDED"
        trigger: "system, on POST /disputes/{dispute_id}/resolve (UPHOLD, subject_type=SALE)"
        actor: system
        preconditions: ["an UPHELD dispute names this Sale"]
        side_effects:
          - "payment_status PAID -> REFUNDED"

      - from: "cleanout_status=PENDING"
        to: "cleanout_status=COMPLETED"
        trigger: "POST /sales/{sale_id}/cleanout"
        actor: Buyer
        preconditions: ["payment_status == PAID", "cleanout_status == PENDING"]
        side_effects: ["unit SOLD -> CLEARED"]

      - from: "cleanout_status=PENDING"
        to: "cleanout_status=OVERDUE"
        trigger: "POST /sales/{sale_id}/forfeit"
        actor: FacilityOperator
        preconditions: ["cleanout_status == PENDING", "clock now > cleanout_deadline"]
        note: "Alternate forfeit path when the buyer paid but never cleaned out; sets cleanout_status PENDING -> OVERDUE (see forfeit precondition variant)."
        side_effects: []

  - entity: Settlement
    initial_state: FINALIZED
    terminal_states: [REVERSED]
    transitions:
      - from: FINALIZED
        to: REVERSED
        trigger: "system, on POST /disputes/{dispute_id}/resolve (UPHOLD, subject_type=SETTLEMENT)"
        actor: system
        preconditions: ["an UPHELD dispute names this Settlement"]
        side_effects:
          - "compensation: Tenant.surplus_balance_cents -= surplus_cents"
          - "compensation: Facility.recovery_balance_cents -= (lien_recovered_cents + facility_fee_cents + buyer_premium_cents)"
          - "invariant proceeds identity restored: gross_proceeds_cents == lien_recovered_cents + facility_fee_cents + surplus_cents still holds on the reversed record"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{dispute_id}/review"
        actor: PlatformAdmin
        preconditions: ["dispute.status == OPEN"]
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /disputes/{dispute_id}/request-info"
        actor: PlatformAdmin
        preconditions: ["dispute.status == UNDER_REVIEW"]
        side_effects: []
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /disputes/{dispute_id}/provide-info"
        actor: "Tenant | Buyer"
        preconditions: ["dispute.status == NEEDS_INFO"]
        side_effects: []
        note: "Cycle: UNDER_REVIEW <-> NEEDS_INFO may repeat any number of rounds."
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /disputes/{dispute_id}/resolve (decision=UPHOLD)"
        actor: PlatformAdmin
        preconditions: ["dispute.status == UNDER_REVIEW"]
        side_effects:
          - "resolution = UPHELD"
          - "if subject_type=SETTLEMENT: Settlement FINALIZED -> REVERSED (see Settlement machine)"
          - "if subject_type=SALE: Sale payment_status PAID -> REFUNDED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /disputes/{dispute_id}/resolve (decision=DENY)"
        actor: PlatformAdmin
        preconditions: ["dispute.status == UNDER_REVIEW"]
        side_effects: ["resolution = DENIED"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: bid-supersede-stale-auction
    parent_entity: Auction
    write_endpoint: "POST /auctions/{auction_id}/bids"
    occ_field: "expected_auction_version"
    description: |
      Placing a Bid against an Auction whose version has advanced since the
      client last observed it is rejected. A prior bid legitimately superseded
      the high bid (bumping the auction's high_bid_cents and version); the
      current writer's view of the auction — and therefore the min_next_bid it
      computed — is stale, so the create is refused on the stale version rather
      than silently racing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lien_amount
    trigger: "PROVISIONAL on POST /units/{unit_id}/lien-notices; FINAL on POST /lien-notices/{lien_notice_id}/mature"
    algorithm: threshold
    formula: |
      daily_rent = round_half_up(unit.monthly_rent_cents / 30)
      accrued_rent = daily_rent * days_accrued
      lien_amount = unit.past_due_balance_cents + accrued_rent + LATE_FEE_CENTS + LIEN_ADMIN_FEE_CENTS
    input_set: "The single defaulted unit and its SENT LienNotice."
    constants:
      CURE_DAYS: 14
      LATE_FEE_CENTS: 5000
      LIEN_ADMIN_FEE_CENTS: 10000
    precision: "integer cents, round_half_up on the daily_rent division only"
    variants:
      - name: PROVISIONAL
        when: "at notice creation (writes unit.lien_amount_provisional_cents)"
        difference: "days_accrued = CURE_DAYS (14); projects accrual through cure_deadline"
      - name: FINAL
        when: "at maturation (writes unit.lien_amount_final_cents)"
        difference: "days_accrued = floor((maturation_instant - notice_sent_at) / 1 day); actual elapsed days, which exceed 14 whenever maturation happens after the cure deadline"

  - name: surplus_distribution
    trigger: "ESTIMATED on POST /auctions/{auction_id}/close (branch A); FINAL on POST /sales/{sale_id}/pay (Settlement finalize)"
    algorithm: waterfall_allocation
    formula: |
      gross = sale.winning_amount_cents
      lien_recovered = min(gross, lien_input)
      facility_fee   = min(round_half_up(gross * facility.facility_fee_bps / 10000), gross - lien_recovered)
      surplus        = gross - lien_recovered - facility_fee     # floored at 0 by construction
      # buckets are filled strictly in order lien -> facility_fee -> surplus
    input_set: "One Sale, its Auction's unit lien figure, and the facility fee rate."
    constants: {}
    precision: "integer cents; round_half_up on the facility_fee percentage only"
    variants:
      - name: ESTIMATED
        when: "displayed at auction close as sale.estimated_surplus_cents"
        difference: "lien_input = unit.lien_amount_provisional_cents"
      - name: FINAL
        when: "persisted on the Settlement at payment"
        difference: "lien_input = unit.lien_amount_final_cents (>= provisional, so FINAL surplus <= ESTIMATED surplus)"

  - name: sale_charges
    trigger: "on POST /auctions/{auction_id}/close (branch A), when the Sale is created"
    algorithm: tiered_pricing
    formula: |
      # rounding ORDER is pinned: round each component to whole cents in this
      # exact sequence, never 'sum-then-round'.
      buyer_premium = round_half_up(winning_amount_cents * BUYER_PREMIUM_BPS / 10000)   # step 1
      sales_tax     = round_half_up((winning_amount_cents + buyer_premium) * facility.sales_tax_rate_bps / 10000)  # step 2, taxes the premium-inclusive base
      total_due     = winning_amount_cents + buyer_premium + sales_tax                  # step 3
    input_set: "One Sale and its facility's sales_tax_rate_bps."
    constants:
      BUYER_PREMIUM_BPS: 1500
    precision: "integer cents, round_half_up; premium rounded BEFORE it enters the tax base (round-per-component then sum, not sum-then-round)"

  - name: high_bid_selection
    trigger: "on every POST /auctions/{auction_id}/bids and POST /bids/{bid_id}/retract, and at close"
    algorithm: aggregation
    formula: |
      candidates = { Bid : bid.auction_id == auction.id AND bid.status == ACTIVE }
      if candidates is empty: high_bid_cents = 0, high_bid_id = null
      else: high = argmax(amount_cents); tie-break earliest placed_at (created_at ASC); NEVER by id
      min_next_bid_cents = reserve_cents if high_bid_cents == 0 else high_bid_cents + min_increment_cents
    input_set: "ACTIVE bids on the auction."
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Role permitted for this operation per RBAC; entity_backed role's X-User-ID matches the owning FK of the target resource", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "Every id in the path exists (left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 4, category: business_constraint, check: "Pagination limit in [1,100] and offset >= 0", error_id: ERR_PAGINATION_INVALID, http_status: 422, applies_to: "all list endpoints" }
  - { priority: 5, category: business_constraint, check: "Body required fields present, enums valid, integers non-negative", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all POST" }
  - { priority: 6, category: state, check: "Target resource is in a state that permits the transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 7, category: state, check: "Auction must be LIVE to accept a bid", error_id: ERR_AUCTION_NOT_LIVE, http_status: 409, applies_to: "POST /auctions/{auction_id}/bids" }
  - { priority: 8, category: state, check: "OCC: expected_auction_version must equal auction.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /auctions/{auction_id}/bids" }
  - { priority: 9, category: business_referential, check: "Scheduling an auction requires unit.status == LIEN_MATURED", error_id: ERR_UNIT_NOT_MATURED, http_status: 409, applies_to: "POST /auctions" }
  - { priority: 10, category: business_referential, check: "Paying a Sale requires the buyer's Buyer.status != SUSPENDED", error_id: ERR_BUYER_SUSPENDED, http_status: 409, applies_to: "POST /sales/{sale_id}/pay" }
  - { priority: 11, category: business_referential, check: "Cleanout requires Sale.payment_status == PAID", error_id: ERR_SALE_NOT_PAID, http_status: 409, applies_to: "POST /sales/{sale_id}/cleanout" }
  - { priority: 12, category: business_temporal, check: "Auction window valid: end_at > start_at and start_at >= clock now", error_id: ERR_INVALID_AUCTION_WINDOW, http_status: 422, applies_to: "POST /auctions" }
  - { priority: 13, category: business_temporal, check: "A Unit may not have two auctions whose half-open [start_at, end_at) windows overlap", error_id: ERR_AUCTION_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /auctions" }
  - { priority: 14, category: business_temporal, check: "Two ONSITE auctions at the same facility (unit.facility_id) must be >= 120 minutes apart edge-to-edge (closed interval + buffer)", error_id: ERR_ONSITE_SLOT_CONFLICT, http_status: 409, applies_to: "POST /auctions" }
  - { priority: 15, category: business_temporal, check: "Opening requires clock now >= start_at", error_id: ERR_OPEN_TOO_EARLY, http_status: 409, applies_to: "POST /auctions/{auction_id}/open" }
  - { priority: 16, category: business_temporal, check: "Closing requires clock now >= end_at", error_id: ERR_AUCTION_NOT_ENDED, http_status: 409, applies_to: "POST /auctions/{auction_id}/close" }
  - { priority: 17, category: business_temporal, check: "Cure requires clock now <= LienNotice.cure_deadline", error_id: ERR_CURE_WINDOW_CLOSED, http_status: 409, applies_to: "POST /units/{unit_id}/cure" }
  - { priority: 18, category: business_temporal, check: "Maturation requires clock now > LienNotice.cure_deadline", error_id: ERR_MATURE_TOO_EARLY, http_status: 409, applies_to: "POST /lien-notices/{lien_notice_id}/mature" }
  - { priority: 19, category: business_temporal, check: "Payment requires clock now <= Sale.payment_deadline", error_id: ERR_PAYMENT_WINDOW_EXPIRED, http_status: 409, applies_to: "POST /sales/{sale_id}/pay" }
  - { priority: 20, category: business_constraint, check: "A buyer who already holds the high bid may not bid against themselves", error_id: ERR_ALREADY_HIGH_BIDDER, http_status: 409, applies_to: "POST /auctions/{auction_id}/bids" }
  - { priority: 21, category: business_fiscal, check: "Bidder deposit_available_cents >= DEPOSIT_REQUIRED_CENTS (20000)", error_id: ERR_INSUFFICIENT_DEPOSIT, http_status: 402, applies_to: "POST /auctions/{auction_id}/bids" }
  - { priority: 22, category: business_fiscal, check: "Bid amount_cents >= auction.min_next_bid_cents", error_id: ERR_BID_TOO_LOW, http_status: 409, applies_to: "POST /auctions/{auction_id}/bids" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Facility ---
  - { method: POST, path: "/facilities", description: "Create a facility", roles: [PlatformAdmin], code: 201, input: [name, state_code, sales_tax_rate_bps, facility_fee_bps], output: Facility, side_effects: ["recovery_balance_cents=0"] }
  - { method: GET, path: "/facilities/{facility_id}", description: "Get a facility", roles: [PlatformAdmin, FacilityOperator, Buyer, Tenant], code: 200, input: [], output: Facility, side_effects: [] }
  - { method: GET, path: "/facilities/{id}/tenants", description: "List tenants of a facility (reverse Tenant.facility_id)", roles: [PlatformAdmin, FacilityOperator], code: 200, input: ["limit?", "offset?"], output: "Tenant[]", side_effects: [] }

  # --- Tenant ---
  - { method: POST, path: "/tenants", description: "Register a tenant", roles: [PlatformAdmin], code: 201, input: [facility_id, full_name, email], output: Tenant, side_effects: ["access_status=ACTIVE, surplus_balance_cents=0"] }
  - { method: GET, path: "/tenants/{tenant_id}", description: "Get a tenant", roles: [PlatformAdmin, FacilityOperator, Tenant], code: 200, input: [], output: Tenant, side_effects: [] }

  # --- StorageUnit ---
  - { method: POST, path: "/units", description: "Create a storage unit", roles: [PlatformAdmin], code: 201, input: [facility_id, tenant_id, unit_number, monthly_rent_cents], output: StorageUnit, side_effects: ["status=RENTED"] }
  - { method: GET, path: "/units/{unit_id}", description: "Get a storage unit", roles: [PlatformAdmin, FacilityOperator, Tenant], code: 200, input: [], output: StorageUnit, side_effects: [] }
  - { method: GET, path: "/units", description: "List units (reverse StorageUnit.facility_id and StorageUnit.tenant_id)", roles: [PlatformAdmin, FacilityOperator, Tenant], code: 200, input: ["facility_id?", "tenant_id?", "status?", "limit?", "offset?"], output: "StorageUnit[]", side_effects: [] }
  - { method: POST, path: "/units/{unit_id}/lien-notices", description: "Declare a lien and send notice (RENTED -> LIEN_NOTICED)", roles: [FacilityOperator], code: 201, input: [past_due_balance_cents], output: LienNotice, side_effects: ["creates LienNotice SENT; sets unit.past_due_balance_cents; computes lien_amount_provisional_cents"] }
  - { method: POST, path: "/units/{unit_id}/cure", description: "Tenant cures the default (LIEN_NOTICED -> RENTED)", roles: [Tenant], code: 200, input: [], output: StorageUnit, side_effects: ["LienNotice -> CURED; past_due_balance_cents=0"] }

  # --- LienNotice ---
  - { method: GET, path: "/lien-notices/{lien_notice_id}", description: "Get a lien notice", roles: [PlatformAdmin, FacilityOperator, Tenant], code: 200, input: [], output: LienNotice, side_effects: [] }
  - { method: GET, path: "/units/{id}/lien-notices", description: "List a unit's lien notices (reverse LienNotice.unit_id)", roles: [PlatformAdmin, FacilityOperator, Tenant], code: 200, input: ["limit?", "offset?"], output: "LienNotice[]", side_effects: [] }
  - { method: POST, path: "/lien-notices/{lien_notice_id}/mature", description: "Mature the lien after the cure window (LIEN_NOTICED -> LIEN_MATURED)", roles: [FacilityOperator], code: 200, input: [], output: LienNotice, side_effects: ["LienNotice -> MATURED; unit -> LIEN_MATURED; computes lien_amount_final_cents; Tenant.access_status -> REVOKED"] }

  # --- Auction ---
  - { method: POST, path: "/auctions", description: "Schedule an auction for a matured unit (unit stays LIEN_MATURED until open)", roles: [FacilityOperator], code: 201, input: [unit_id, mode, start_at, end_at, reserve_cents, min_increment_cents], output: Auction, side_effects: ["status=SCHEDULED; validates window, per-unit overlap, and onsite facility buffer"] }
  - { method: GET, path: "/auctions/{auction_id}", description: "Get an auction", roles: [PlatformAdmin, FacilityOperator, Buyer, Tenant], code: 200, input: [], output: Auction, side_effects: [] }
  - { method: GET, path: "/units/{id}/auctions", description: "List a unit's auctions (reverse Auction.unit_id)", roles: [PlatformAdmin, FacilityOperator, Buyer, Tenant], code: 200, input: ["limit?", "offset?"], output: "Auction[]", side_effects: [] }
  - { method: POST, path: "/auctions/{auction_id}/open", description: "Open bidding (SCHEDULED -> LIVE; unit LIEN_MATURED -> IN_AUCTION)", roles: [FacilityOperator], code: 200, input: [], output: Auction, side_effects: ["status -> LIVE; unit -> IN_AUCTION; increments Auction.version by 1"] }
  - { method: POST, path: "/auctions/{auction_id}/close", description: "Close bidding and settle the outcome (LIVE -> CLOSED)", roles: [FacilityOperator], code: 200, input: [], output: Auction, side_effects: ["high-bid selection; branch A creates Sale + holds buyer deposit + unit SOLD; branch B unit -> LIEN_MATURED; increments Auction.version by 1"] }
  - { method: POST, path: "/auctions/{auction_id}/bids", description: "Place a bid (OCC on auction version)", roles: [Buyer], code: 201, input: [buyer_id, amount_cents, expected_auction_version], output: Bid, side_effects: ["previous high bid -> OUTBID; recompute high_bid_cents/high_bid_id/min_next_bid_cents; increments Auction.version by 1"] }

  # --- Bid ---
  - { method: GET, path: "/bids/{bid_id}", description: "Get a bid", roles: [PlatformAdmin, FacilityOperator, Buyer], code: 200, input: [], output: Bid, side_effects: [] }
  - { method: GET, path: "/bids", description: "List bids (reverse Bid.auction_id and Bid.buyer_id)", roles: [PlatformAdmin, FacilityOperator, Buyer], code: 200, input: ["auction_id?", "buyer_id?", "status?", "limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: POST, path: "/bids/{bid_id}/retract", description: "Retract an ACTIVE bid", roles: [Buyer], code: 200, input: [], output: Bid, side_effects: ["status -> RETRACTED; auction re-selects high bid"] }

  # --- Buyer ---
  - { method: POST, path: "/buyers", description: "Register a buyer", roles: [PlatformAdmin], code: 201, input: [full_name, email], output: Buyer, side_effects: ["status=REGISTERED; deposit fields=0"] }
  - { method: GET, path: "/buyers/{buyer_id}", description: "Get a buyer", roles: [PlatformAdmin, FacilityOperator, Buyer], code: 200, input: [], output: Buyer, side_effects: [] }
  - { method: POST, path: "/buyers/{buyer_id}/fund-deposit", description: "Add funds to the buyer's deposit", roles: [Buyer], code: 200, input: [amount_cents], output: Buyer, side_effects: ["deposit_available_cents += amount_cents"] }

  # --- Sale ---
  - { method: GET, path: "/sales/{sale_id}", description: "Get a sale", roles: [PlatformAdmin, FacilityOperator, Buyer, Tenant], code: 200, input: [], output: Sale, side_effects: [] }
  - { method: GET, path: "/sales", description: "List sales (reverse Sale.auction_id and Sale.buyer_id)", roles: [PlatformAdmin, FacilityOperator, Buyer, Tenant], code: 200, input: ["auction_id?", "buyer_id?", "limit?", "offset?"], output: "Sale[]", side_effects: [] }
  - { method: POST, path: "/sales/{sale_id}/pay", description: "Buyer pays total_due; finalizes settlement (payment_status -> PAID)", roles: [Buyer], code: 200, input: [], output: Sale, side_effects: ["payment_status -> PAID; releases deposit hold; creates+finalizes Settlement; credits tenant surplus + facility recovery; auction -> SETTLED"] }
  - { method: POST, path: "/sales/{sale_id}/cleanout", description: "Buyer reports the unit cleaned out (cleanout_status -> COMPLETED)", roles: [Buyer], code: 200, input: [], output: Sale, side_effects: ["cleanout_status -> COMPLETED; unit -> CLEARED"] }
  - { method: POST, path: "/sales/{sale_id}/forfeit", description: "Facility forfeits a sale past its payment deadline", roles: [FacilityOperator], code: 200, input: [], output: Sale, side_effects: ["payment_status -> FORFEITED; cleanout_status -> VOIDED; deposit forfeited to facility; unit -> LIEN_MATURED; buyer -> SUSPENDED"] }

  # --- Settlement ---
  - { method: GET, path: "/settlements/{settlement_id}", description: "Get a settlement", roles: [PlatformAdmin, FacilityOperator, Buyer, Tenant], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: GET, path: "/sales/{id}/settlement", description: "Get the settlement for a sale (reverse Settlement.sale_id; array of 0 or 1)", roles: [PlatformAdmin, FacilityOperator, Buyer, Tenant], code: 200, input: [], output: "Settlement[]", side_effects: [] }

  # --- Dispute ---
  - { method: POST, path: "/disputes", description: "Raise a dispute against a Sale or a Settlement", roles: [Tenant, Buyer], code: 201, input: [subject_type, "sale_id?", "settlement_id?", raised_by, reason], output: Dispute, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/disputes/{dispute_id}", description: "Get a dispute", roles: [PlatformAdmin, FacilityOperator, Buyer, Tenant], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: GET, path: "/disputes", description: "List disputes (reverse Dispute.sale_id and Dispute.settlement_id)", roles: [PlatformAdmin, FacilityOperator, Buyer, Tenant], code: 200, input: ["sale_id?", "settlement_id?", "status?", "limit?", "offset?"], output: "Dispute[]", side_effects: [] }
  - { method: POST, path: "/disputes/{dispute_id}/review", description: "Begin review (OPEN -> UNDER_REVIEW)", roles: [PlatformAdmin], code: 200, input: [], output: Dispute, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/disputes/{dispute_id}/request-info", description: "Request more info (UNDER_REVIEW -> NEEDS_INFO)", roles: [PlatformAdmin], code: 200, input: [], output: Dispute, side_effects: ["status -> NEEDS_INFO"] }
  - { method: POST, path: "/disputes/{dispute_id}/provide-info", description: "Raiser supplies info (NEEDS_INFO -> UNDER_REVIEW)", roles: [Tenant, Buyer], code: 200, input: [note], output: Dispute, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/disputes/{dispute_id}/resolve", description: "Resolve (UNDER_REVIEW -> UPHELD|DENIED)", roles: [PlatformAdmin], code: 200, input: [decision], output: Dispute, side_effects: ["resolution set; UPHOLD reverses settlement or refunds sale per subject_type"] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced to to_iso8601"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or entity_backed X-User-ID does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id does not resolve" }
  - { id: ERR_PAGINATION_INVALID, http: 422, condition: "limit outside [1,100] or offset < 0" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required body field, bad enum, or negative integer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_auction_version does not equal auction.version" }
  - { id: ERR_UNIT_NOT_MATURED, http: 409, condition: "Scheduling an auction for a unit whose status is not LIEN_MATURED" }
  - { id: ERR_INVALID_AUCTION_WINDOW, http: 422, condition: "end_at <= start_at or start_at < clock now" }
  - { id: ERR_AUCTION_WINDOW_CONFLICT, http: 409, condition: "New auction's [start_at, end_at) overlaps an existing SCHEDULED/LIVE auction on the same unit" }
  - { id: ERR_ONSITE_SLOT_CONFLICT, http: 409, condition: "Two ONSITE auctions at the same facility are within 120 minutes edge-to-edge" }
  - { id: ERR_AUCTION_NOT_LIVE, http: 409, condition: "Bid placed on an auction that is not LIVE" }
  - { id: ERR_ALREADY_HIGH_BIDDER, http: 409, condition: "Buyer who already holds the high bid bids again" }
  - { id: ERR_INSUFFICIENT_DEPOSIT, http: 402, condition: "Bidder deposit_available_cents < 20000" }
  - { id: ERR_BID_TOO_LOW, http: 409, condition: "amount_cents < auction.min_next_bid_cents" }
  - { id: ERR_OPEN_TOO_EARLY, http: 409, condition: "Opening before start_at" }
  - { id: ERR_AUCTION_NOT_ENDED, http: 409, condition: "Closing before end_at" }
  - { id: ERR_CURE_WINDOW_CLOSED, http: 409, condition: "Cure attempted after cure_deadline" }
  - { id: ERR_MATURE_TOO_EARLY, http: 409, condition: "Maturation attempted at or before cure_deadline" }
  - { id: ERR_BUYER_SUSPENDED, http: 409, condition: "Paying a sale while the buyer is SUSPENDED" }
  - { id: ERR_SALE_NOT_PAID, http: 409, condition: "Cleanout attempted before the sale is PAID" }
  - { id: ERR_PAYMENT_WINDOW_EXPIRED, http: 409, condition: "Payment attempted after payment_deadline" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Marketplace operator: onboards facilities/tenants/units/buyers, drives the logical clock, adjudicates disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /facilities"
      - "POST /tenants"
      - "POST /units"
      - "POST /buyers"
      - "POST /_clock/set_current_utc"
      - "POST /disputes/{dispute_id}/review"
      - "POST /disputes/{dispute_id}/request-info"
      - "POST /disputes/{dispute_id}/resolve"
    shared_operations:
      - "GET (all read endpoints)"

  - name: FacilityOperator
    description: "Acts as a Facility; owns the lien-to-auction pipeline for that facility's units. X-User-ID == Facility.id; a unit is owned iff unit.facility_id == X-User-ID."
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /units/{unit_id}/lien-notices"
      - "POST /lien-notices/{lien_notice_id}/mature"
      - "POST /auctions"
      - "POST /auctions/{auction_id}/open"
      - "POST /auctions/{auction_id}/close"
      - "POST /sales/{sale_id}/forfeit"
    shared_operations:
      - "GET (facility-scoped read endpoints)"

  - name: Buyer
    description: "Acts as a Buyer. X-User-ID == Buyer.id; bids/pays/cleans out only its own resources."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /buyers/{buyer_id}/fund-deposit"
      - "POST /auctions/{auction_id}/bids"
      - "POST /bids/{bid_id}/retract"
      - "POST /sales/{sale_id}/pay"
      - "POST /sales/{sale_id}/cleanout"
    shared_operations:
      - "POST /disputes (raised_by=BUYER)"
      - "POST /disputes/{dispute_id}/provide-info"
      - "GET (own read endpoints)"

  - name: Tenant
    description: "Acts as a Tenant. X-User-ID == Tenant.id; cures own unit, claims surplus, raises disputes."
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /units/{unit_id}/cure"
    shared_operations:
      - "POST /disputes (raised_by=TENANT)"
      - "POST /disputes/{dispute_id}/provide-info"
      - "GET (own read endpoints)"
