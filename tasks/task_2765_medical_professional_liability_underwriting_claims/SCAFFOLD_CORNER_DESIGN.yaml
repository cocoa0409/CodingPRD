      - name: hammer_split_correct_result_is_covered_by_the_difficulty_design
        claim_type: correct_result
        grounds:
          - calculations.settlement_insured_share
        excluded_because:
          difficulty_instance: hammer_exposure_caps_before_excess_split
          rationale: "That instance computes capped_exposure, excess and the 0.50 insured share from pinned inputs and asserts every intermediate, which is the correct-result claim for settlement_insured_share."

      - name: reserve_rounding_precision_is_covered_by_the_difficulty_design
        claim_type: precision
        grounds:
          - calculations.reserve_adequacy_ratio
        excluded_because:
          difficulty_instance: required_reserve_rounds_each_claim_before_summing
          rationale: "That instance pins per-claim rounding before summation and proves the total differs from rounding the sum, which is the precision claim for the reserve aggregation."

      - name: admin_fee_tiering_is_covered_by_the_difficulty_design
        claim_type: tiered_pricing
        grounds:
          - calculations.claims_made_step_premium
        excluded_because:
          difficulty_instance: admin_fee_tier_keyed_on_premium_net_not_on_term_total
          rationale: "The tier boundary is straddled there with a premium_net just under and just over 25000.00, proving the tier is keyed on premium_net rather than term_total."

      - name: coverage_window_adjacency_is_covered_by_the_difficulty_design
        claim_type: interval_merge
        grounds:
          - calculations.coverage_trigger_resolution
        excluded_because:
          difficulty_instance: adjacent_term_periods_pass_while_a_straddling_third_term_conflicts
          rationale: "Adjacent half-open term periods, a shared endpoint and a straddling period are all exercised there, which is the interval-adjacency claim."

      - name: risk_variant_divergence_is_covered_by_the_difficulty_design
        claim_type: variant_divergence
        grounds:
          - calculations.insured_risk_classification.variants
        excluded_because:
          difficulty_instance: risk_classification_snapshot_versus_renewal_prospective_band_divergence
          rationale: "Both variants are run over identical data there and the renewal lands in a higher band than the insured's own snapshot, with both scores asserted."

      - name: incurred_variant_reconciliation_is_covered_by_the_difficulty_design
        claim_type: reconciliation
        grounds:
          - calculations.claim_incurred_loss.variants
        excluded_because:
          difficulty_instance: claim_incurred_case_versus_actuarial_delta_after_expense_payment
          rationale: "The delta between case_incurred and actuarial_incurred is asserted before and after an expense payment, which is the variant-switch reconciliation claim."

