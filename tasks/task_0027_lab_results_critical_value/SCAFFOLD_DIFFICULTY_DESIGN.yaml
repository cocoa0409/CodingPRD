  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: result_amendment_cycle_released_amended_released_chain
        grounds:
          - state_machines.Result.transitions.PROVISIONAL_to_RELEASED
          - state_machines.Result.transitions.RELEASED_to_AMENDED
          - entities.Result.fields.amended_from_result_id
          - entities.Result.fields.status
        distinguishing_aspect: |
          Result's state machine is cyclic-with-shadow: RELEASED -> AMENDED creates a NEW Result row
          in status=RELEASED whose amended_from_result_id points back to the prior row, forming a
          self-referential FK chain. Same row never re-enters RELEASED; the new row is a fresh
          Result entering RELEASED. The shape is cyclic in entity TYPE (Result→Result), not linear
          A→B→C→D pipeline. Operates on Result entity.
        test_recipe:
          setup:
            - "Clock pinned to 2026-05-28T08:00:00Z"
            - "A LabOrder in status=RESULTED with one originally-RELEASED Result res_orig (numeric_value=4.20, criticality=NORMAL)"
