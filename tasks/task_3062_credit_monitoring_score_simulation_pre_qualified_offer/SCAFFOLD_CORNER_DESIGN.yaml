              as: Consumer
              captures: { is_id: $.data.id }
          assert:
            - "Consumer.${is_id} has no status field other than the monitoring posture, which reads ENROLLED at creation"
            - "score_version == 0 before the first pull, so no BureauSnapshot exists yet"
            - "monitoring_consent_at is null, so the pull precondition is not yet satisfied"

      - name: closing_a_consumer_with_open_referrals_is_refused
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Consumer.ACTIVE_to_CLOSED
          - errors.ERR_CONSUMER_HAS_OPEN_REFERRAL
        distinguishing_aspect: "The ACTIVE → CLOSED edge is guarded by a different-state machine's rows, so a consumer holding a SENT referral cannot be closed even though its own row is a valid source status."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with a rendered offer, a sealed consent and one SENT referral."]
          setup_api_calls:
            - *k_clock
