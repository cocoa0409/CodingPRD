            - "Deal.${deal_id}.escrow_refunded_cents == 0"
      - name: standard_crud_landowner_patch_toggles_suppression_and_reads_back
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /lease-buyouts/landowners/{id}]
          - endpoints[GET /lease-buyouts/landowners/{id}]
          - entities.Landowner.fields.outreach_status
          - response_envelope.common_fields
        distinguishing_aspect: |
          PATCH is a partial update whose declared side effect is reversible: suppress_outreach true forces
          outreach_status to DO_NOT_CONTACT and bumps version to 2, the GET reads back exactly that, and a
          second PATCH that sets suppress_outreach false together with a new contact_email restores the
          progression-derived NEW (there are no offers) while keeping the new email and reaching version 3 —
          so suppression is an override layer, not a destructive write.
        test_recipe:
          setup:
            - "One landowner in outreach_status NEW with contact_email owner@hollis.example and version 1."
            - "The landowner has no deals or offers, so the progression-derived status is NEW."
          setup_api_calls:
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
          trigger:
            - { call: "PATCH /lease-buyouts/landowners/${lo_id}", payload: { suppress_outreach: true }, as: AcquisitionAnalyst, captures: { status_suppressed: $.data.outreach_status, v_suppressed: $.data.version } }
            - { call: "GET /lease-buyouts/landowners/${lo_id}", payload: {}, as: ServicingAgent, captures: { read_status: $.data.outreach_status, read_email: $.data.contact_email } }
            - { call: "PATCH /lease-buyouts/landowners/${lo_id}", payload: { contact_email: "estate@hollis.example", suppress_outreach: false }, as: PlatformAdmin }
          assert:
            - "${status_suppressed} == DO_NOT_CONTACT"
            - "${v_suppressed} == 2"
            - "${read_status} == DO_NOT_CONTACT"
            - "${read_email} == owner@hollis.example"
            - "Landowner.${lo_id}.outreach_status == NEW"
            - "Landowner.${lo_id}.contact_email == estate@hollis.example"
            - "Landowner.${lo_id}.version == 3"
            - "Landowner.${lo_id}.open_dispute_count == 0"
      - name: action_endpoint_holdover_status_change_repoints_the_score_and_stales_the_valuation
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /lease-buyouts/carrier-tenancies/{id}/status]
          - endpoints[GET /lease-buyouts/lease-streams/{id}/tenancies]
