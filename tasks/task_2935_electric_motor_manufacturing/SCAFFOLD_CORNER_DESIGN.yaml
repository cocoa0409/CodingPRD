      - name: superseded_performance_test_cannot_record_and_cannot_back_a_nameplate
        claim_type: invalid_transitions
        grounds:
          - state_machines.PerformanceTest.SCHEDULED_to_SUPERSEDED
          - validations[priority=34]
          - errors[ERR_INVALID_PERFORMANCE_TEST_STATE]
          - calculations.test_cell_capacity_ledger
        distinguishing_aspect: |
          SUPERSEDED is reached by a SYSTEM event — scheduling a re-test on the same work order —
          not by any endpoint of its own. Once superseded, the old test must refuse `record` and
          must also be refused as a nameplate's cited test, while the replacement test does both
          successfully in the same chain. The cell ledger proves the superseded reservation was
          released rather than double-counted.
        test_recipe:
          setup:
            - "Standard EU-2019-1781-IE3-4P; distributor; design D1 RELEASED; order for 12 EU units CONFIRMED."
