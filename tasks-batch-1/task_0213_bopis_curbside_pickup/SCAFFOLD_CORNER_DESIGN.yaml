        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules.inventory-restock-stale-inventory"
          - "errors[ERR_STALE_INVENTORY_VERSION]"
          - "endpoints"
        distinguishing_aspect: "Restock with a stale expected_inventory_version (one behind the current) returns 412 ERR_STALE_INVENTORY_VERSION; the correct version succeeds and bumps version."
        test_recipe:
          setup: ["StoreInventory created at version 1; one restock advances it to version 2"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
