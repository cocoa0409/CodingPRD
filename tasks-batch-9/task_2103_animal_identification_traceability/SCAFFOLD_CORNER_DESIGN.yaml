            - call: "POST /device-suppliers/${sup_pv}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_pv_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_pv}", premises_id: "${ppv}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_pv_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_pv}"
              captures: { lot_pv: $.data.id }
            - call: "POST /tag-lots/${lot_pv}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-04-28", birth_premises_id: "${ppv}" }
