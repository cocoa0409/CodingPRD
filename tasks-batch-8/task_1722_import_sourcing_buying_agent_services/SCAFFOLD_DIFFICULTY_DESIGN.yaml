            - call: "POST /sourcing/purchase-orders/${po0_id}/shipments"
              payload: { shipped_qty: 450, vessel_ref: "V0" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { sh0_id: "$.data.id" }
            - call: "POST /sourcing/shipments/${sh0_id}/handover-documents"
              payload: { doc_refs: ["BL-0"] }
