              as: PlatformAdmin
              captures: { e_period: $.data.error_id }
            - call: "POST /enforcement/compliance-reports/00000000-0000-4000-8000-000000000015/transition"
              payload: { target_state: "ACCEPTED" }
              as: ComplianceMonitor
              as_user_id: "cm-1"
              captures: { e_report: $.data.error_id }
            - call: "POST /enforcement/violation-penalties/00000000-0000-4000-8000-000000000016/transition"
              payload: { target_state: "WAIVED" }
              as: ComplianceMonitor
              as_user_id: "cm-1"
              captures: { e_penalty: $.data.error_id }
            - call: "POST /enforcement/refund-checks/00000000-0000-4000-8000-000000000017/transition"
              payload: { target_state: "CASHED" }
              as: DisbursementOfficer
              as_user_id: "do-1"
              captures: { e_check: $.data.error_id }
          assert:
            - "e_parent_inv == ERR_INVESTIGATION_NOT_FOUND (parent resolved first)"
            - "e_parent_order == ERR_CONSENT_ORDER_NOT_FOUND"
            - "e_parent_fund == ERR_REDRESS_FUND_NOT_FOUND"
            - "e_cid == ERR_CID_NOT_FOUND"
            - "e_period == ERR_COMMENT_PERIOD_NOT_FOUND"
            - "e_report == ERR_COMPLIANCE_REPORT_NOT_FOUND"
            - "e_penalty == ERR_VIOLATION_PENALTY_NOT_FOUND"
            - "e_check == ERR_REFUND_CHECK_NOT_FOUND"
            - "every one of the eight responses is a 404 with the fixed error envelope"

