            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 6.000, lime_pct: 1.000 }
              as: PlantAdmin
              as_user_id: "admin-001"
