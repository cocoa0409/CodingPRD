            - "adopting plan B's scenario returns HTTP 409 with error_id == \"ERR_INVENTORY_SET_INCOMPLETE\" - two of the four required inventory types have no certified dataset at all"
            - "after certifying plan B's DEMOGRAPHIC dataset the SAME adoption still returns ERR_INVENTORY_SET_INCOMPLETE - the check needs all four of DEMOGRAPHIC, HOUSING, EMPLOYMENT and LAND_USE, so a partial repair does not open the gate"
            - "plan B still reports adopted_scenario_id == null and compliance_posture == \"CAPACITY_HOLD\" after both refusals"

      - name: content_readiness_and_wrong_phase_error_sweep
        claim_type: error_triggerability
        grounds:
          - errors[ERR_ELEMENT_HAS_NO_POLICIES]
          - errors[ERR_REVIEW_NOT_DRAFT]
          - errors[ERR_PLAN_NOT_SUBMITTED]
          - errors[ERR_PLAN_NOT_CERTIFIED]
          - validations.priority_73_content_readiness
        distinguishing_aspect: |
          Four ids that all fire on a plan that has barely started, which makes them the cheapest
          probes in the catalogue and therefore the easiest to leave untested. Each one pins a
          different flavour of "too early". ERR_ELEMENT_HAS_NO_POLICIES is a content check that
          rides on a DEFAULTED field: policy_count is optional and defaults to 0, so an element
          created with no policy_count at all cannot be submitted for review - the guard is
          policy_count >= 1, and an implementation that only rejects a negative or absent value
          lets the empty element through. ERR_REVIEW_NOT_DRAFT is the write-lock that closes a
          review's alternative set at circulation: after the document is public, the alternatives it
          circulated may not change, so both a third alternative and a second circulate call are
          refused with the same id. ERR_PLAN_NOT_SUBMITTED and ERR_PLAN_NOT_CERTIFIED are the two
          phase gates a caller hits when skipping the workflow entirely - recording a state
          determination on a plan that was never submitted, and scheduling a commission hearing on a
          plan the state has not certified. The pair matters because the hearing gate is the one
          that must NOT be confused with ERR_COMMISSION_RECOMMENDATION_REQUIRED: on a DRAFTING plan
          even a COMMISSION hearing is refused, and the id is the plan-certification one.
        test_recipe:
          setup:
            - "One DRAFTING plan, one element created with no policy_count supplied, and one DRAFT environmental review with exactly MIN_ALTERNATIVES (2) alternatives."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id, pu_st: $.data.status }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "PARKS", title: "Parks Element", draft_body: "Narrative only, no numbered policies yet." }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el: $.data.id, el_pc: $.data.policy_count }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "ND", title: "Horizon 2045 Negative Declaration" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { rev: $.data.id }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${rev}", label: "Alternative A", traffic_vmt_index: 42, ghg_index: 44, habitat_index: 40, water_index: 46 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_a: $.data.id }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${rev}", label: "Alternative B", traffic_vmt_index: 58, ghg_index: 56, habitat_index: 54, water_index: 52 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_b: $.data.id }
          trigger:
            - call: "POST /planning/plan-elements/${el}/submit-review"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_nopol: $.data.error_id }
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { policy_count: 1 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_pc2: $.data.policy_count }
            - call: "POST /planning/plan-elements/${el}/submit-review"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_st2: $.data.status }
            - call: "POST /planning/environmental-reviews/${rev}/circulate"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { rev_st: $.data.status, rev_days: $.data.comment_period_days }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${rev}", label: "Alternative C - late arrival", traffic_vmt_index: 30, ghg_index: 30, habitat_index: 30, water_index: 30 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { e_late: $.data.error_id }
            - call: "POST /planning/environmental-reviews/${rev}/circulate"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { e_recirc: $.data.error_id }
            - call: "POST /planning/plan-updates/${pu}/state-determination"
              payload: { determination: "CERTIFIED", findings: "Nothing was ever submitted." }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { e_notsub: $.data.error_id }
            - call: "POST /planning/hearings"
              payload: { plan_update_id: "${pu}", body_type: "COMMISSION", scheduled_start: "2026-10-05T18:00:00Z", scheduled_end: "2026-10-05T21:00:00Z", notice_published_at: "2026-09-20T18:00:00Z" }
              as: CommissionClerk
              as_user_id: "clerk-1"
              captures: { e_notcert: $.data.error_id }
            - call: "GET /planning/environmental-reviews/${rev}/plan-alternatives"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
            - call: "GET /planning/plan-updates/${pu}/hearings"
              as: CommissionClerk
              as_user_id: "clerk-1"
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningDirector
              as_user_id: "director-1"
          assert:
            - "the element was created with policy_count == 0 by DEFAULT (the field was omitted), and submitting it for review returns HTTP 409 with error_id == \"ERR_ELEMENT_HAS_NO_POLICIES\""
            - "after a PATCH raising policy_count to 1 the identical submit-review succeeds and the element reaches status \"IN_REVIEW\" - the boundary is >= 1, so a single policy is enough"
            - "circulation succeeds with status \"CIRCULATED\" and comment_period_days == 30 (the ND value, not the 45-day EIR value)"
            - "adding a third alternative to the CIRCULATED review returns HTTP 409 with error_id == \"ERR_REVIEW_NOT_DRAFT\" - the alternative set is frozen once the document is public"
            - "a second circulate call returns HTTP 409 with the same error_id, \"ERR_REVIEW_NOT_DRAFT\": circulation is not idempotent, and the id names the review's state rather than a generic conflict"
            - "recording a state determination on the DRAFTING plan returns HTTP 409 with error_id == \"ERR_PLAN_NOT_SUBMITTED\""
            - "scheduling a COMMISSION hearing on the DRAFTING plan returns HTTP 409 with error_id == \"ERR_PLAN_NOT_CERTIFIED\" - NOT ERR_COMMISSION_RECOMMENDATION_REQUIRED, which is reserved for a COUNCIL body on a plan that is merely STATE_CERTIFIED"
            - "the review still reports alternative_count == 2 and the list returns total_count == 2; the plan's hearing list returns total_count == 0"
            - "the plan is still status == \"DRAFTING\" with state_review_status == \"NOT_SUBMITTED\" and state_findings == null - the refused determination wrote nothing"

      - name: certified_plan_hearing_lifecycle_error_sweep
        claim_type: error_triggerability
        grounds:
          - errors[ERR_NOTICE_PERIOD_TOO_SHORT]
          - errors[ERR_HEARING_NOT_YET_STARTED]
          - errors[ERR_HEARING_NOT_SCHEDULED]
          - errors[ERR_HEARING_NOT_OPEN]
          - errors[ERR_ENVIRONMENTAL_REVIEW_NOT_CERTIFIED]
          - errors[ERR_PLAN_NOT_RECOMMENDED]
          - state_machines.Hearing
          - state_machines.PlanUpdate.COMMISSION_RECOMMENDED_to_DRAFTING
        distinguishing_aspect: |
          Six ids in the catalogue are unreachable until a plan is actually STATE_CERTIFIED, which is
          why they are the ones most likely to ship untested. This instance pays the setup cost once
          and then walks the hearing calendar from scheduling to denial.
          The two that no other instance can reach are the interesting ones.
          ERR_ENVIRONMENTAL_REVIEW_NOT_CERTIFIED needs a plan that got past state submission on a
          merely CIRCULATED review - which is legal, submission only requires CIRCULATED - and then
          tries to record a RECOMMEND, which requires CERTIFIED. So the same review is simultaneously
          good enough for the state and not good enough for the commission, and an implementation
          that uses one status set for both gates fails one of them.
          ERR_PLAN_NOT_RECOMMENDED is even narrower: a COUNCIL hearing may only be SCHEDULED while
          the plan is COMMISSION_RECOMMENDED, so the only way to hold an OPEN council hearing on a
          plan that is not recommended is to open two of them and let a DENY on the first demote the
          plan back to DRAFTING underneath the second. The ADOPT that follows must return
          ERR_PLAN_NOT_RECOMMENDED (priority 50) and not ERR_PLAN_POSTURE_BLOCKED (priority 61),
          even though the demotion cascade also left the posture at CONSISTENCY_HOLD - two
          violations, and the state check wins.
          The remaining four pin the notice-period arithmetic at exactly HEARING_NOTICE_DAYS,
          the clock gate on opening, the non-idempotency of open, and the fact that a CONTINUED or
          RECOMMENDED hearing is terminal so any further outcome is ERR_HEARING_NOT_OPEN.
        test_recipe:
          setup:
            - "The clock stays at its default 2026-08-01T00:00:00Z until the trigger sequence moves it."
            - "One plan driven all the way to STATE_CERTIFIED: four certified inventories, an adopted TREND scenario (pool 11700), all five elements APPROVED, four housing allocations that leave shortfall 0, one consistency link created and reconciled, a completed workshop giving equity_share_pct 40.0, and an EIR that is CIRCULATED but NOT certified."
            - "compliance_posture is CLEAR at the end of setup, so hearings may be scheduled and opened."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { i_dem: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "HOUSING", vintage_year: 2025, record_count: 900 }
