  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: adjudication_cascades_correction_to_story_to_newsroom_posture
        grounds:
          - state_machines.CorrectionRequest.INVESTIGATING_to_ADJUDICATED
          - state_machines.Story.UNDER_INQUIRY_to_CORRECTED
          - calculations.correction_severity_score
          - calculations.newsroom_standards_posture
          - entities.Story.fields.severe_correction_count
          - entities.Newsroom.fields.open_high_severity_count
          - entities.Newsroom.fields.standards_posture
        distinguishing_aspect: |
          Trigger is a correction adjudication and the chain is four links deep: CorrectionRequest becomes
          ADJUDICATED with band SEVERE (1) -> Story.severe_correction_count becomes 1 and standards_status
          becomes CORRECTED (2) -> Newsroom.open_high_severity_count becomes 1 (3) -> Newsroom.standards_posture
          leaves OPEN for HEIGHTENED because the threshold is 1 (4).
        test_recipe:
          setup:
            - "Newsroom with high_severity_open_threshold 1, so a single high-severity case reaches HEIGHTENED and two reach LOCKDOWN"
            - "A DRAFT story owned by the reporter, standards_status UNDER_INQUIRY because a correction request exists"
            - "The correction request is INVESTIGATING and the desk has verified an IDENTIFICATION error affecting a named subject with verified_reach 150000"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger", correction_response_sla_hours: 72, high_severity_open_threshold: 1, required_module_codes: ["SOURCING"] }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
