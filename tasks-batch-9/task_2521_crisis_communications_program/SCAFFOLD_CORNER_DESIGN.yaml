      - name: corner_calculation_variant_divergence_on_same_data
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: dual_variant_reputation_delta_raw_vs_adjusted
          rationale: "Both reputation_delta variants are computed from one identical review snapshot there and asserted to differ (-7.30 vs -4.73), which is the divergence claim."

      - name: corner_calculation_variant_switch_reconciliation
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: dual_variant_incident_severity_provisional_vs_final
          rationale: "That instance walks severity_basis from PROVISIONAL to FINAL over the same signal set and asserts the tier and score change on the switch, i.e. the reconciliation delta."

      - name: corner_threshold_algorithm_boundary_triplet
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: boundary_escalation_score_at_exactly_seventy_on_escalate
          rationale: "The ESCALATION_THRESHOLD boundary (exactly 70.00 passes, 69.00 fails) is already pinned on both sides there."

      - name: corner_decay_function_ready_threshold_boundary
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: boundary_material_readiness_ready_at_exactly_sixty_on_sweep
          rationale: "READY_THRESHOLD at exactly 60.00 (16 days READY vs 17 days STALE) is covered by that boundary instance."

      - name: corner_weighted_scoring_rounding_does_not_drift
        claim_type: Precision
        excluded_because:
          difficulty_instance: combinatorial_stakeholder_reach_index_nested_rounding_mode_b
          rationale: "Per-notice rounding before summation (3.03 rather than 3.02) is exactly the accumulation-drift claim for stakeholder_reach_index."

      - name: corner_tiered_rate_keyed_on_pre_fee_subtotal
        claim_type: Constants Applied
        excluded_because:
          difficulty_instance: combinatorial_containment_priority_band_of_pre_fee_subtotal_mode_c
          rationale: "The band-of-the-pre-fee-subtotal evaluation order (base 52.50 keeps the LOW rate although the 55.13 total sits in MEDIUM) is asserted there."

      - name: corner_chronological_input_set_ordering
        claim_type: Input Set Filtering
        excluded_because:
          difficulty_instance: dual_variant_incident_severity_provisional_vs_final
          rationale: "The final variant's detected_at ordering and its ESCALATED-only candidate set are both exercised by that instance."

      - name: corner_interval_recompute_shortens_window_retroactively
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: cascade_escalation_reshortens_sla_and_latches_breach
          rationale: "That cascade re-derives holding_statement_due_at off the unchanged activated_at after a tier change, which is the interval claim for this calculation."

      - name: corner_aggregation_ledger_reconciles_after_reversal
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: compensating_open_approval_task_count_submit_then_withdraw
          rationale: "The 0 -> 2 -> 0 ledger round trip proves the aggregation is recomputed from scratch rather than patched."

      - name: corner_signal_score_clamped_at_upper_bound
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: combinatorial_signal_escalation_score_enum_matrix_mode_a
          rationale: "The min(100.00, ...) clamp is one of the three arms of that mode-(a) instance."

