        claim_type: derived_field_reconciliation
        grounds: [entities.Account.fields.outstanding_balance_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_then_late_deliver_outstanding_equals_fee_total
          rationale: "Outstanding-balance reconciliation across invoice + late-delivery delta is asserted by the named §1.8 instance."

      - name: cascade_dispute_resolve_refund_chain_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_RESOLVED]
        excluded_because:
          difficulty_instance: transitive_cascade / dispute_resolve_refund_chain_depth3
          rationale: "The multi-level resolve cascade (approved -> refunded/payment -> report amend) is asserted by the named §1.8 instance."

