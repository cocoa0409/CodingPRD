          trigger:
            - { call: "POST /dairy/orders/${o2}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { o2_status: "$.data.fulfillment_status" } }
            - { call: "POST /dairy/orders/${o3}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { err: "$.data.error_id" } }
          assert:
            - "o2_status == CONFIRMED (gap exactly 15 minutes == buffer, allowed)"
            - "err == ERR_DOCK_WINDOW_CONFLICT (gap of 14 minutes before O1's 08:00 start violates the 15-minute buffer)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: crate_drop_pickup_conservation
        grounds:
          - calculations.crate_ledger
          - entities.Store.fields.crate_balance
          - errors[ERR_INSUFFICIENT_CRATE_BALANCE]
        distinguishing_aspect: |
          Conserved quantity = physical crate count: a delivery DROP of 7
          followed by a backhaul PICKUP of 7 returns crate_balance to its
          initial value 0 (balance = SUM(DROP) - SUM(PICKUP) + SUM(ADJUSTMENT)),
          and an 8th pickup is rejected. Companion instance conserves monetary
          AR instead.
        test_recipe:
          setup:
            - "Distributor, ACTIVE route, store S1 crate_deposit_cents=400 (credit_limit 100000000), driver, product PL 250c units_per_case 1"
            - "Order O1 of 7 units DELIVERED 2026-08-10 -> auto DROP of 7 crates"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist R", license_number: "LIC-R-1" }
              as: TerritoryManager
              captures: { d1: $.data.id }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-R", name: "Route R", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: $.data.id }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-R", name: "Store R", credit_limit_cents: 100000000, crate_deposit_cents: 400 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: $.data.id }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "BUTTER-10", name: "Butter", units_per_case: 1, shelf_life_days: 60, regulated: false, list_price_cents: 250 }
              as: TerritoryManager
              captures: { pl: $.data.id }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Rae Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: $.data.id }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 1000, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 7 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - { call: "POST /dairy/orders/${o1}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T04:30:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/trips/${t1}/temperature-readings"
              payload: { recorded_at: "2026-08-10T04:30:00Z", temp_tenths_f: 380, zone: "BOX" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /dairy/trips/${t1}/depart", payload: {}, as: RouteDriver, as_user_id: "${dr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/orders/${o1}/deliver"
              payload: { delivered_lines: [{ product_id: "${pl}", delivered_units: 7, scanned_code_date: "2026-09-01" }] }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "GET /dairy/stores/${s1}", as: Any, captures: { bal_after_drop: "$.data.crate_balance", liab_after_drop: "$.data.deposit_liability_cents" } }
          trigger:
            - call: "POST /dairy/stores/${s1}/crate-transactions"
              payload: { kind: "PICKUP", crate_count: 7, note: "backhaul empties" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "GET /dairy/stores/${s1}", as: Any, captures: { bal_after_pickup: "$.data.crate_balance", liab_after_pickup: "$.data.deposit_liability_cents" } }
            - call: "POST /dairy/stores/${s1}/crate-transactions"
              payload: { kind: "PICKUP", crate_count: 1 }
              as: RouteDriver
              as_user_id: "${dr1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "bal_after_drop == 7 and liab_after_drop == 2800 (7 x 400)"
            - "bal_after_pickup == 0 and liab_after_pickup == 0 (invariant: 0 + 7 - 7 == 0, no drift)"
            - "err == ERR_INSUFFICIENT_CRATE_BALANCE (balance may reach exactly 0 but never go negative)"

      - name: credit_apply_void_restores_invoice
        grounds:
          - state_machines.CreditMemo
          - entities.Invoice.fields.amount_due_cents
          - errors[ERR_CREDIT_MEMO_NOT_VOIDABLE]
        distinguishing_aspect: |
          Conserved quantity = monetary AR: applying a 500c slice of a credit
          memo to an OPEN invoice drives amount_due 500 -> 0 (SETTLED), and the
          compensating VOID restores amount_due to exactly 500 and reopens the
          invoice — a different conserved quantity than physical crates.
        test_recipe:
          setup:
            - "Distributor, ACTIVE route (basis ORIGINAL), store S1 (credit_limit 100000000), driver; regulated product P1 (218.770c under period 2026-08 PROVISIONAL base 2100/35/60 diesel 299) and non-regulated PL 250c"
            - "Order OA (10 units P1) DELIVERED -> INV_A total 2188; order OB (2 units PL) DELIVERED -> INV_B total 500"
            - "INV_A fully paid (2188) -> SETTLED"
            - "Return on OA: 4 units OUT_OF_CODE (clock 2026-08-30, code 2026-08-25) -> credit 875; approved -> memo auto-applies 500 to oldest OPEN invoice INV_B (own invoice not OPEN), memo PARTIALLY_APPLIED with remaining 375; INV_B SETTLED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist S", license_number: "LIC-S-1" }
              as: TerritoryManager
              captures: { d1: $.data.id }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-S", name: "Route S", service_weekdays: ["MON"], credit_price_basis: "ORIGINAL" }
              as: TerritoryManager
              captures: { r1: $.data.id }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-S", name: "Store S", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: $.data.id }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "MILK-GAL-5", name: "Whole Milk Gal", units_per_case: 1, shelf_life_days: 14, regulated: true, weight_lbs_per_unit: 8.6, margin_cents_per_unit: 30 }
              as: TerritoryManager
              captures: { p1: $.data.id }
            - call: "POST /dairy/products"
              payload: { sku: "BUTTER-11", name: "Butter", units_per_case: 1, shelf_life_days: 60, regulated: false, list_price_cents: 250 }
              as: TerritoryManager
              captures: { pl: $.data.id }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Sam Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: $.data.id }
            - call: "POST /dairy/pricing-periods"
              payload: { month: "2026-08" }
              as: MarketAdministrator
              captures: { per1: $.data.id }
            - { call: "GET /dairy/pricing-periods/${per1}", as: Any, captures: { per1_v: "$.data.version" } }
            - call: "POST /dairy/pricing-periods/${per1}/announcements"
              payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2100, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${per1_v}" }
              as: MarketAdministrator
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 1000, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${p1}", quantity_units: 10 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { oa: $.data.id }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 2 }], delivery_window_start: "2026-08-10T08:45:00Z", delivery_window_end: "2026-08-10T09:15:00Z" }
              as: DistributorOwner
