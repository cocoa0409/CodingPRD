      - name: module_operations_require_the_right_module_state
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors.ERR_INVALID_MODULE_STATE
          - state_machines.Module
        distinguishing_aspect: |
          Priority 19 carries a different permitted SET per operation, and the two
          sets are not nested: pixel-test accepts {MANUFACTURED, REWORK} while
          calibrate accepts {PIXEL_TESTED, REWORK}. So calibrating a brand-new
          MANUFACTURED module and re-pixel-testing an already PIXEL_TESTED module
          are both 409s, and REWORK is the only state both operations accept.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel and one freshly created module ${m} in MANUFACTURED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-STATE" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m: $.data.id }
          trigger:
            - call: "POST /modules/${m}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { err_early: $.data.error_id }
            - call: "POST /modules/${m}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { err_again: $.data.error_id }
          assert:
            - "trigger call 1 -> 409 with ${err_early} == 'ERR_INVALID_MODULE_STATE'   # MANUFACTURED is not in the calibrate set"
            - "after trigger call 1: Module.${m}.measured_brightness_nits is null and rework_cycles == 0   # a refused calibration stores nothing"
            - "trigger call 2 -> 200: Module.${m}.module_state == PIXEL_TESTED"
            - "trigger call 3 -> 409 with ${err_again} == 'ERR_INVALID_MODULE_STATE'   # PIXEL_TESTED is not in the pixel-test set"
            - "Module.${m}.rework_cycles == 0   # a refused re-test is not a rework failure"

      - name: crew_region_must_match_the_project_site
