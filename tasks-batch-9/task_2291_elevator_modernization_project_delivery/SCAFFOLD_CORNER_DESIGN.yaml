        claim_type: computed_read
        grounds:
          - endpoints[GET /projects/{project_id}/posture]
          - calculations.project_downtime_posture
        distinguishing_aspect: "The posture read is pure derivation: on a project with two cars, no outage and no staging hold it must report OPEN / 0 / 0 / 0, and groups_below_floor counts groups, not cars."
        test_recipe:
          setup:
            - "One project with one group (min_cars_in_service 1) holding two cars, no surveys, no holds, no windows."
