              captures: { w1_id: $.data.id }
            - call: "GET /de-novo/vendor-contracts/${vc_id}"
              payload: {}
              as: CharterCounsel
              captures: { vc_v2: $.data.version }
            - call: "POST /de-novo/conversion-windows"
              payload: { vendor_contract_id: "${vc_id}", expected_vendor_contract_version: "${vc_v2}", window_start_utc: "2026-09-03T08:00:00Z", window_end_utc: "2026-09-04T08:00:00Z" }
              as: CharterCounsel
              captures: { w2_id: $.data.id }
          trigger:
            - call: "POST /de-novo/vendor-contracts/${vc_id}/advance"
              payload: { target_status: "TERMINATED" }
              as: CharterCounsel
          assert:
            - "the call returns 200"
            - "VendorContract.${vc_id}.status == TERMINATED"
            - "ConversionWindow.${w1_id}.status == CANCELLED"
            - "ConversionWindow.${w2_id}.status == CANCELLED"
            - "VendorContract.${vc_id}.active_window_count == 0"
            - "ConversionWindow.${w1_id}.duration_hours == 24.00 (unchanged by the cancellation)"
            - "OrganizingGroup.${g_id}.stage == ORGANIZING"
