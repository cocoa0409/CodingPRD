              as_user_id: "principal-a"
          trigger:
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-09-10" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { mu_err: $.data.error_id }
          assert:
            - "mu_err == \"ERR_DUPLICATE_MEETING_YEAR\""

      - name: complaint_invalid_enum_rejected
