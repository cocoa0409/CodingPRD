            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "AGG_CC_100", discount_kind: "PROMOTIONAL", stacking_class: "CAP_CONTRIBUTING", discount_bps: 100, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { v006_r3_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${v006_r3_id}/activate"
              payload: {}
              as: BenefitsAdmin
