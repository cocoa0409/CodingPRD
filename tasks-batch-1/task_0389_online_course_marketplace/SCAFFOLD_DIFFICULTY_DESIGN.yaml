          trigger:
            - call: "POST /lesson-completions"
              payload: { enrollment_id: "${enr_id}", lesson_id: "${lesson_id}", correct_answers: 7 }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { passed: $.data.passed, score: $.data.score_pct }
          assert:
            - "LessonCompletion.score_pct == 0.7 and passed == true (7/10 >= 0.70 inclusive)"
            - "had correct_answers been 6 (0.60) the completion would have passed == false"

      - name: coupon_valid_until_exclusive_boundary_on_enroll
        grounds:
          - validations[priority=6]
          - entities.Coupon.fields.valid_until
          - errors[ERR_COUPON_NOT_REDEEMABLE]
        distinguishing_aspect: |
          Temporal exclusive-boundary on a DIFFERENT endpoint (POST /courses/{id}/enroll)
          and a DIFFERENT metric (interval endpoint, not a numeric score): with clock set
          exactly to coupon.valid_until, redemption is rejected because valid_until is
          exclusive (now < valid_until required), so now == valid_until fails.
        test_recipe:
          setup:
            - "PUBLISHED course; ACTIVE coupon valid_from 2026-01-01, valid_until 2026-07-01; clock set exactly to 2026-07-01T00:00:00Z; learner."
          setup_api_calls:
