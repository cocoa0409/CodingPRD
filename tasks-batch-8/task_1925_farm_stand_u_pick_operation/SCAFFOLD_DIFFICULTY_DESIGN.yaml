          - state_machines.Field.OPEN_to_PICKED_OUT
          - errors[ERR_FIELD_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair VisitSession x Field: enter-field is a transition ON the
          session whose validity depends on the FIELD's state; a sibling
          session's weigh-out flips the field to PICKED_OUT and thereby blocks
          this session's entry even though the session itself is untouched.
        test_recipe:
          setup:
            - "Weekday 2026-08-04; field estimated 20 oz OPEN; window capacity 30 OPEN"
            - "Session S (party 1, containers 4, paid 1450, CHECKED_IN, never entered); session S2 (paid 1450, FIELD_ACTIVE)"
