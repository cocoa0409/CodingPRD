          - calculations.plan_comparison_score
          - calculations.formulary_drug_annual_cost
        distinguishing_aspect: "POST /plan-comparisons returns an inline aggregate — candidate_plan_count, recommended_plan_id, recommended_composite_score and a ranked_plans array — rather than a Plan entity, so the computed score and ranking are observable only through this endpoint and not through GET /plans."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain plus a second plan from a second carrier, both in the member's service area."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - &cc_carrier_b
              call: "POST /carriers"
              payload: { legal_name: "Bluebonnet Secure Advantage", naic_number: "60212", contract_type: "CONTRACTED", initial_commission_rate_pct: 0.20, renewal_commission_rate_pct: 0.10, chargeback_clawback_pct: 0.25, ack_expected_within_days: 5, effectuation_expected_within_days: 30 }
