            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_a}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /assignments/${asg_a}/check-ins", payload: {}, as: EscortOperator, as_user_id: "${esc_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_a}/deliver", payload: {}, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Job B silo", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-12T09:00:00Z", window_end_at: "2026-08-12T12:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 60, planned_entry_at: "2026-08-12T09:00:00Z", planned_exit_at: "2026-08-12T12:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_b: $.data.id } }
            - { call: "GET /jobs/${job_b}/legs", payload: {}, as: Dispatcher, captures: { leg_b: "$.data[0].id" } }
            - { call: "POST /jobs/${job_b}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_b}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_b}/permits", payload: { permit_number: "TX-P-7", valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-08-14T00:00:00Z" }, as: Dispatcher, captures: { permit_b: $.data.id } }
            - { call: "POST /permits/${permit_b}/issue", payload: {}, as: Dispatcher }
