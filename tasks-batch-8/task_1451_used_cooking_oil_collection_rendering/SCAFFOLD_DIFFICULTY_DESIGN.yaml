scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_divergence
        grounds:
          - calculations.settlement_line_amount
          - calculations.pickup_net_gallons
          - calculations.provisional_index_price
          - calculations.final_index_price
        distinguishing_aspect: |
          Settlement-domain dual variant: identical pickup data yields
          provisional_total_cents == 16560 (field-moisture grade B 0.90 x latest-week quote 100)
          but final_total_cents == 13230 (lab grade C 0.75 x period-average quote 105); the two
          variants price the same physical pickup differently.
        test_recipe:
          setup:
            - "Customer with ACTIVE REBATE contract (index YG_CBI, floor 50, cap 150, term 2026-07-01..2027-07-01), one container cap 1200 est 200"
            - "Truck cap 2000; manifest service_date 2026-08-05 dispatched; visit completed pump 200.00 field moisture 8.0"
            - "Quotes published: w2026-07-27 @140 (decoy), w2026-08-03 @100, w2026-08-10 @110"
            - "Sample graded lab moisture 16.0 / impurity 1.0 -> grade C"
            - "Logical clock 2026-08-15; settlement period [2026-08-01, 2026-08-15)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Diner One", site_address: "1 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 1200, est_fill_rate_gal_per_week: 200, lock_code: "LK1" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-1", tank_capacity_gallons: 2000 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/route-manifests/${man}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${v1}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v1}/complete", payload: { pump_gallons: 200.00, field_moisture_pct: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - call: "POST /api/pickup-visits/${v1}/samples"
              payload: {}
              as: Driver
              as_user_id: "drv-1"
              captures: { smp: $.data.id }
            - { call: "POST /api/quality-samples/${smp}/submit", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/quality-samples/${smp}/grade", payload: { lab_moisture_pct: 16.0, lab_impurity_pct: 1.0 }, as: PlantOperator }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-07-27", price_cents_per_gal: 140 }
              as: BillingAnalyst
              captures: { q0: $.data.id }
            - { call: "POST /api/market-index-quotes/${q0}/publish", payload: {}, as: BillingAnalyst }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-08-03", price_cents_per_gal: 100 }
              as: BillingAnalyst
              captures: { q1: $.data.id }
            - { call: "POST /api/market-index-quotes/${q1}/publish", payload: {}, as: BillingAnalyst }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-08-10", price_cents_per_gal: 110 }
              as: BillingAnalyst
              captures: { q2: $.data.id }
            - { call: "POST /api/market-index-quotes/${q2}/publish", payload: {}, as: BillingAnalyst }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/settlements/generate"
              payload: { customer_id: "${cust}", period_start: "2026-08-01", period_end: "2026-08-15" }
              as: BillingAnalyst
              captures: { stl: $.data.id }
          trigger:
            - { call: "POST /api/settlements/${stl}/finalize", payload: {}, as: BillingAnalyst }
          assert:
            - "Settlement.${stl}.provisional_total_cents == 16560 (net 184.00 gal x rate 90 = clamp(100 x 0.90))"
            - "Settlement.${stl}.final_total_cents == 13230 (net 168.00 gal x rate 78.75 = clamp(105 x 0.75))"
            - "Settlement.${stl}.provisional_total_cents != Settlement.${stl}.final_total_cents"
            - "the single SettlementLine has variant FINAL and rate_cents_per_gal == 78.75 after finalize"

      - name: batch_estimated_vs_metered_yield_divergence
        grounds:
          - calculations.batch_yield
          - state_machines.ProcessingBatch.INTAKE_to_PROCESSED
        distinguishing_aspect: |
          ProcessingBatch-domain dual variant (different entity domain than the Settlement instance):
          est_yield_gallons is formula-derived (1000.00 x (1 - 10.00/100) x 0.92 == 828.00) while the
          same batch's metered actual_output_gallons is 850.00 — estimated and metered yields diverge.
        test_recipe:
          setup:
            - "Customer with ACTIVE REBATE contract, container cap 1200 est 1000, truck cap 2000"
            - "Manifest 2026-08-05 dispatched (start_level 0); visit completed pump 1000.00 field moisture 10.0; manifest completed and reconciled end 1000 spill 0"
            - "No samples graded (effective moisture falls back to field moisture 10.0)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Diner Two", site_address: "2 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 1200, est_fill_rate_gal_per_week: 1000, lock_code: "LK2" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-2", tank_capacity_gallons: 2000 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/route-manifests/${man}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${v1}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v1}/complete", payload: { pump_gallons: 1000.00, field_moisture_pct: 10.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/route-manifests/${man}/complete", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/route-manifests/${man}/reconcile", payload: { end_level_gallons: 1000, spill_loss_gallons: 0 }, as: RouteDispatcher }
          trigger:
            - call: "POST /api/processing-batches"
              payload: { manifest_id: "${man}", input_gallons: 1000 }
              as: PlantOperator
              captures: { bat: $.data.id }
            - { call: "POST /api/processing-batches/${bat}/process", payload: { actual_output_gallons: 850 }, as: PlantOperator }
          assert:
            - "ProcessingBatch.${bat}.weighted_moisture_pct == 10.00"
            - "ProcessingBatch.${bat}.est_yield_gallons == 828.00 (formula estimate)"
            - "ProcessingBatch.${bat}.actual_output_gallons == 850 (metered)"
            - "ProcessingBatch.${bat}.yield_rate == 0.85"
            - "est_yield_gallons != actual_output_gallons (divergence 22.00 gallons)"

  - rule_id: combinatorial_formula
    instances:
      - name: service_fee_overage_and_rebate_cap_clamp
        grounds:
          - calculations.settlement_line_amount
          - calculations.final_index_price
        distinguishing_aspect: |
          Mode (a) combinatorial: pricing_mode branch with nested min/max — SERVICE_FEE line is
          -(2500 + 40 x max(0, 168.00 - 150)) == -3220 while the REBATE line hits the cap clamp
          min(120, max(50, 200 x 0.75)) == 120 -> 84.00 x 120 == 10080; >=3 inputs interact non-linearly.
        test_recipe:
          setup:
            - "Customer A with ACTIVE SERVICE_FEE contract (index YG_A, fee 2500, overage_threshold 150, overage_rate 40); its pickup nets 168.00 gal after lab moisture 16.0"
            - "Customer B with ACTIVE REBATE contract (index YG_B, floor 50, cap 120); its pickup nets 84.00 gal after lab moisture 16.0; quote YG_B w2026-08-03 @200 published (period average 200 -> raw rate 150 -> clamped to cap 120)"
            - "Both settlements over period [2026-08-01, 2026-08-15) finalized at clock 2026-08-15"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Fee House", site_address: "3 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { custA: $.data.id }
            - call: "POST /api/customers/${custA}/contracts"
              payload: { pricing_mode: SERVICE_FEE, index_code: YG_A, term_start: "2026-07-01", term_end: "2027-07-01", service_fee_cents: 2500, overage_threshold_gal: 150, overage_rate_cents_per_gal: 40 }
              as: FieldOpsManager
              captures: { conA: $.data.id }
            - { call: "POST /api/contracts/${conA}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${custA}/containers"
              payload: { capacity_gallons: 500, est_fill_rate_gal_per_week: 200, lock_code: "LKA" }
              as: FieldOpsManager
              captures: { ctnA: $.data.id }
            - call: "POST /api/customers"
              payload: { name: "Rebate House", site_address: "4 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { custB: $.data.id }
            - call: "POST /api/customers/${custB}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_B, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 120 }
              as: FieldOpsManager
              captures: { conB: $.data.id }
            - { call: "POST /api/contracts/${conB}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${custB}/containers"
              payload: { capacity_gallons: 500, est_fill_rate_gal_per_week: 200, lock_code: "LKB" }
              as: FieldOpsManager
              captures: { ctnB: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-3", tank_capacity_gallons: 2000 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctnA}", "${ctnB}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/containers/${ctnA}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { vA: "$.data[0].id" }
            - call: "GET /api/containers/${ctnB}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { vB: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${vA}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${vA}/complete", payload: { pump_gallons: 200.00, field_moisture_pct: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${vB}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${vB}/complete", payload: { pump_gallons: 100.00, field_moisture_pct: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - call: "POST /api/pickup-visits/${vA}/samples"
              payload: {}
              as: Driver
              as_user_id: "drv-1"
              captures: { smpA: $.data.id }
            - { call: "POST /api/quality-samples/${smpA}/submit", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/quality-samples/${smpA}/grade", payload: { lab_moisture_pct: 16.0, lab_impurity_pct: 1.0 }, as: PlantOperator }
            - call: "POST /api/pickup-visits/${vB}/samples"
              payload: {}
              as: Driver
              as_user_id: "drv-1"
              captures: { smpB: $.data.id }
            - { call: "POST /api/quality-samples/${smpB}/submit", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/quality-samples/${smpB}/grade", payload: { lab_moisture_pct: 16.0, lab_impurity_pct: 1.0 }, as: PlantOperator }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_A, week_start: "2026-08-03", price_cents_per_gal: 100 }
              as: BillingAnalyst
              captures: { qA: $.data.id }
            - { call: "POST /api/market-index-quotes/${qA}/publish", payload: {}, as: BillingAnalyst }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_B, week_start: "2026-08-03", price_cents_per_gal: 200 }
              as: BillingAnalyst
              captures: { qB: $.data.id }
            - { call: "POST /api/market-index-quotes/${qB}/publish", payload: {}, as: BillingAnalyst }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/settlements/generate"
              payload: { customer_id: "${custA}", period_start: "2026-08-01", period_end: "2026-08-15" }
              as: BillingAnalyst
              captures: { stlA: $.data.id }
            - { call: "POST /api/settlements/${stlA}/finalize", payload: {}, as: BillingAnalyst }
            - call: "POST /api/settlements/generate"
              payload: { customer_id: "${custB}", period_start: "2026-08-01", period_end: "2026-08-15" }
              as: BillingAnalyst
              captures: { stlB: $.data.id }
            - { call: "POST /api/settlements/${stlB}/finalize", payload: {}, as: BillingAnalyst }
          trigger:
            - call: "GET /api/settlements/${stlA}/lines"
              payload: {}
              as: BillingAnalyst
              captures: { lineA_amt: "$.data[0].line_amount_cents" }
            - call: "GET /api/settlements/${stlB}/lines"
              payload: {}
              as: BillingAnalyst
              captures: { lineB_amt: "$.data[0].line_amount_cents", lineB_rate: "$.data[0].rate_cents_per_gal" }
          assert:
            - "Settlement.${stlA} single line line_amount_cents == -3220 (=-(2500 + 40 x max(0, 168.00 - 150)))"
            - "Settlement.${stlB} single line rate_cents_per_gal == 120 (cap clamped from raw 150) and line_amount_cents == 10080 (= 84.00 x 120)"
            - "Settlement.${stlB}.final_total_cents == 10080"

      - name: per_line_rounding_before_sum
        grounds:
          - calculations.settlement_total
          - calculations.settlement_line_amount
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode than instance 1's mode (a)): the scaffold pins
          round-per-line-then-sum — lines 71.5 -> 72 and 143.5 -> 144 give provisional_total_cents == 216,
          whereas sum-then-round would give round(215.0) == 215; the one-cent delta is the assertion.
        test_recipe:
          setup:
            - "Customer with ACTIVE REBATE contract (index YG_CBI, floor == cap == 10 forcing rate 10 regardless of index)"
            - "Two containers (cap 50, est 10); manifest 2026-08-05 with both stops; visits completed pump 7.15 and 14.35, field moisture 0.0 (field grade A, factor 1.00)"
            - "Quote YG_CBI w2026-08-03 @5 published; clock 2026-08-15; period [2026-08-01, 2026-08-15)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Rounding House", site_address: "5 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 10, cap_cents_per_gal: 10 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 50, est_fill_rate_gal_per_week: 10, lock_code: "LKR1" }
              as: FieldOpsManager
              captures: { ctn1: $.data.id }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 50, est_fill_rate_gal_per_week: 10, lock_code: "LKR2" }
              as: FieldOpsManager
              captures: { ctn2: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-4", tank_capacity_gallons: 100 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn1}", "${ctn2}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/containers/${ctn1}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - call: "GET /api/containers/${ctn2}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v2: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${v1}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v1}/complete", payload: { pump_gallons: 7.15, field_moisture_pct: 0.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v2}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v2}/complete", payload: { pump_gallons: 14.35, field_moisture_pct: 0.0 }, as: Driver, as_user_id: "drv-1" }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-08-03", price_cents_per_gal: 5 }
              as: BillingAnalyst
              captures: { q: $.data.id }
            - { call: "POST /api/market-index-quotes/${q}/publish", payload: {}, as: BillingAnalyst }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - call: "POST /api/settlements/generate"
              payload: { customer_id: "${cust}", period_start: "2026-08-01", period_end: "2026-08-15" }
              as: BillingAnalyst
              captures: { stl: $.data.id }
          assert:
            - "Settlement.${stl}.provisional_total_cents == 216 (72 + 144, per-line half-up rounding then sum)"
            - "provisional_total_cents != 215 (sum-then-round of 71.5 + 143.5 = 215.0 would be one cent less)"
            - "settlement has exactly 2 SettlementLine rows with line_amount_cents 72 and 144"

  - rule_id: non_linear_state_machine
    instances:
      - name: contract_renewal_offer_cycle
        grounds:
          - state_machines.Contract.ACTIVE_to_RENEWAL_OFFERED
          - state_machines.Contract.RENEWAL_OFFERED_to_ACTIVE
        distinguishing_aspect: |
          Contract machine is cyclic: ACTIVE -> RENEWAL_OFFERED -> ACTIVE loops twice in one lifecycle —
          an accept replaces term_end with the offered bound (2027-12-31), a later reject returns to
          ACTIVE with the term unchanged; each lap increments version.
        test_recipe:
          setup:
            - "Customer with contract term [2026-01-01, 2026-12-31) activated at clock 2026-08-02 (version 2 after activation)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Cycle House", site_address: "6 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-01-01", term_end: "2026-12-31", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
          trigger:
            - call: "POST /api/contracts/${con}/offer-renewal"
              payload: { new_term_start: "2027-01-01", new_term_end: "2027-12-31" }
              as: FieldOpsManager
            - call: "POST /api/contracts/${con}/respond-renewal"
              payload: { accept: true }
              as: CustomerContact
              as_user_id: "${cust}"
              captures: { after_accept_status: $.data.status, after_accept_term_end: $.data.term_end }
            - call: "POST /api/contracts/${con}/offer-renewal"
              payload: { new_term_start: "2028-01-01", new_term_end: "2028-12-31" }
              as: FieldOpsManager
            - call: "POST /api/contracts/${con}/respond-renewal"
              payload: { accept: false }
              as: CustomerContact
              as_user_id: "${cust}"
              captures: { after_reject_status: $.data.status, after_reject_term_end: $.data.term_end, final_v: $.data.version }
          assert:
            - "Contract.${con}.status after accept == ACTIVE and term_end == 2027-12-31 (offered term adopted)"
            - "Contract.${con}.status after reject == ACTIVE and term_end still == 2027-12-31 (rejection restores pre-offer state, does not apply the 2028 offer)"
            - "Contract.${con}.version == 6 (create 1, activate 2, offer 3, accept 4, offer 5, reject 6)"

      - name: complaint_reopen_recurrence_cycle
        grounds:
          - state_machines.Complaint.RESOLVED_to_REOPENED
          - state_machines.Complaint.RESOLVED_to_CLOSED
        distinguishing_aspect: |
          Complaint machine is cyclic on a different entity than Contract: RESOLVED -> REOPENED ->
          INVESTIGATING -> RESOLVED loops (reopen_count increments), and the cycle terminates only when
          the 7-day reopen window lapses and lazy auto-close lands CLOSED.
        test_recipe:
          setup:
            - "Customer (PROSPECT is fine — no contract needed) with an ODOR complaint filed at clock 2026-08-02"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Smelly House", site_address: "7 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/complaints"
              payload: { customer_id: "${cust}", category: ODOR, severity: LOW, note: "odor at fence line" }
              as: CustomerContact
              as_user_id: "${cust}"
              captures: { cmp: $.data.id }
            - { call: "POST /api/complaints/${cmp}/investigate", payload: {}, as: FieldOpsManager }
            - { call: "POST /api/complaints/${cmp}/resolve", payload: { resolution_note: "deodorized" }, as: FieldOpsManager }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/complaints/${cmp}/reopen"
              payload: { note: "smell returned" }
              as: CustomerContact
              as_user_id: "${cust}"
              captures: { reopen_status: $.data.status, rc: $.data.reopen_count }
            - { call: "POST /api/complaints/${cmp}/investigate", payload: {}, as: FieldOpsManager }
            - { call: "POST /api/complaints/${cmp}/resolve", payload: { resolution_note: "replaced lid gasket" }, as: FieldOpsManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemAdmin }
            - call: "GET /api/customers/${cust}/complaints"
              payload: {}
              as: FieldOpsManager
              captures: { final_status: "$.data[0].status" }
          assert:
            - "Complaint.${cmp}.status after reopen == REOPENED and reopen_count == 1"
            - "after second resolve and clock advance past resolved_at + 7 days, GET returns status == CLOSED (lazy auto-close)"
            - "the full loop RESOLVED -> REOPENED -> INVESTIGATING -> RESOLVED -> CLOSED was traversed on one complaint"

  - rule_id: transitive_cascade
    instances:
      - name: theft_confirm_lock_skip_suspend_cascade
        grounds:
          - state_machines.TheftIncident.REPORTED_to_CONFIRMED
          - state_machines.Container.ACTIVE_to_LOCKED
          - state_machines.PickupVisit.SCHEDULED_to_SKIPPED
          - calculations.missed_pickup_aggregation
        distinguishing_aspect: |
          Depth-4 chain from theft confirm: incident CONFIRMED mutates Container (ACTIVE->LOCKED), the
          lock itself mutates the container's SCHEDULED visits (->SKIPPED), each skip recomputes the
          Customer.missed_pickup_count, and the count crossing threshold 3 mutates Customer
          (ACTIVE->SUSPENDED) — each hop is caused by the previous hop, not by the original call.
        test_recipe:
          setup:
            - "Customer ACTIVE with contract, one container (cap 300, est 100) ACTIVE"
            - "Three manifests on 2026-08-03/04/05 (same truck, distinct dates) each with the container as sole stop, all DISPATCHED; three visits SCHEDULED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Cascade House", site_address: "8 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 300, est_fill_rate_gal_per_week: 100, lock_code: "LKC" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-5", tank_capacity_gallons: 500 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-03", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man1: $.data.id }
            - { call: "POST /api/route-manifests/${man1}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-04", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man2: $.data.id }
            - { call: "POST /api/route-manifests/${man2}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man3: $.data.id }
            - { call: "POST /api/route-manifests/${man3}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "POST /api/theft-incidents"
              payload: { container_id: "${ctn}", evidence_note: "lock cut, oil drained" }
              as: FieldOpsManager
              captures: { thf: $.data.id }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/theft-incidents/${thf}/confirm", payload: {}, as: FieldOpsManager }
            - call: "GET /api/containers/${ctn}"
              payload: {}
              as: FieldOpsManager
              captures: { ctn_status: $.data.status }
            - call: "GET /api/customers/${cust}"
              payload: {}
              as: FieldOpsManager
              captures: { cust_status: $.data.status, missed: $.data.missed_pickup_count }
          assert:
            - "Container.${ctn}.status == LOCKED (hop 1)"
            - "all 3 PickupVisits of container ${ctn} have status == SKIPPED with skipped_at set (hop 2)"
            - "Customer.${cust}.missed_pickup_count == 3 (hop 3: 3 skips inside the trailing 90-day window)"
            - "Customer.${cust}.status == SUSPENDED (hop 4: count >= MISSED_PICKUP_SUSPEND_THRESHOLD)"

      - name: index_publish_provisional_recompute_cascade
        grounds:
          - state_machines.MarketIndexQuote.DRAFT_to_PUBLISHED
          - calculations.provisional_index_price
          - calculations.settlement_total
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (quote publish, not theft confirm): publish mutates
          the PROVISIONAL Settlement (recompute hop 1), and the settlement's recompute mutates its
          SettlementLine rows (rate 90 -> 150, amount 16560 -> 27600, hop 2); provisional_total_cents
          moves 16560 -> 27600 without any direct settlement write.
        test_recipe:
          setup:
            - "As settlement_provisional_vs_final_divergence but only quote w2026-08-03 @100 published before generate"
            - "PROVISIONAL settlement over [2026-08-01, 2026-08-15) with one line: net 184.00 x clamp(100 x 0.90) = 16560"
