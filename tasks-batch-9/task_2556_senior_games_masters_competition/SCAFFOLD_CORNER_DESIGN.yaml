          setup:
            - "Standard fixture in REGISTRATION_OPEN with one 60-64 event and one athlete created before the deadline; then the clock is set to 2026-08-26T00:00:00Z, after registration_deadline_utc 2026-08-25T23:59:59Z, and no ops-run is called so the edition status is untouched."
