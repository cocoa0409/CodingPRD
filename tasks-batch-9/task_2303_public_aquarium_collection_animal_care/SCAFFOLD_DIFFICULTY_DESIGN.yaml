      - call: POST /aquarium/specimens/${spec_id}/exhibit-placements
        payload: {exhibit_id: '${ex_id}', expected_exhibit_version: '${ex_v2}'}
        as: AquaristTechnician
        captures: {u1: $.data.disposition_status}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: ComplianceDirector
        captures: {ex_v3: $.data.version}
      - call: PATCH /aquarium/exhibits/${ex_id}
        payload: {bioload_capacity_units: 19, expected_exhibit_version: '${ex_v3}'}
        as: ComplianceDirector
        captures: {p2: $.data.posture, u2: $.data.bioload_utilization_pct, ex_v4: $.data.version}
      - call: PATCH /aquarium/exhibits/${ex_id}
        payload: {bioload_capacity_units: 18, expected_exhibit_version: '${ex_v4}'}
        as: ComplianceDirector
        captures: {p3: $.data.posture, u3: $.data.bioload_utilization_pct, ex_v5: $.data.version}
      - call: PATCH /aquarium/exhibits/${ex_id}
        payload: {bioload_capacity_units: 20, expected_exhibit_version: '${ex_v5}'}
        as: ComplianceDirector
        captures: {p4: $.data.posture, u4: $.data.bioload_utilization_pct}
      assert:
      - 'after the placement: occupied_bioload_units == 19.00, bioload_utilization_pct == 95.00, posture == OPEN and last_posture_reason == null — exactly 95.00 is NOT pressure'
      - 'capacity 19: bioload_utilization_pct == 100.00, posture == RESTRICTED, last_posture_reason == ''BIOLOAD_PRESSURE'''
      - 'capacity 18: 19.00 / 18.00 * 100 == 105.5555... -> bioload_utilization_pct == 105.56 (round_half_up, not 105.55), posture still RESTRICTED'
      - 'capacity 20 again: bioload_utilization_pct == 95.00, posture back to OPEN and last_posture_reason == null'
      - occupied_bioload_units stays 19.00 across all three PATCH calls — re-capacitating never touches the numerator
      - each PATCH increments Exhibit.version by exactly 1, so reusing the stale ${ex_v3} on the second PATCH would return 412 ERR_STALE_EXHIBIT_VERSION
