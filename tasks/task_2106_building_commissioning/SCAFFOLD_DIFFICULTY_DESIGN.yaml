  - rule_id: resource_temporal_overlap
    instances:

      - name: witness_window_closed_buffered_interval_blocks_touching_window
        grounds:
          - calculations.witness_window_occupancy
          - validations[priority=19]
          - errors[ERR_WITNESS_WINDOW_CONFLICT]
          - entities.CxProject.fields.witness_capacity
        distinguishing_aspect: |
          The occupied resource is CxProject.witness_capacity and the geometry is
          a CLOSED interval widened by a 60-minute mobilisation buffer on both
          ends, so a window starting exactly at an occupant's buffered end
          collides; one extra second of separation makes it legal.
        test_recipe:
          setup:
            - "Project P has witness_capacity 1 and an APPROVED CxPlan pinning R1."
            - "EquipmentUnit E1 and E2 are both STARTED_UP with VERIFIED checklists."
            - "FunctionalTest FT1 on E1 is SCHEDULED for 2026-09-10T09:00Z..11:00Z, i.e. buffered 08:00..12:00 inclusive."
