  # ===========================================================================
  # Cross-cutting complexity layers (§0 complexity_profile.complexity_layers)
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: occ_stale_enrollment_version_blocks_the_plan_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-enrollment]
          - errors[ERR_STALE_ENROLLMENT_VERSION]
          - validations[14]
        distinguishing_aspect: "The eligibility decision bumps VcpEnrollment.version, so a client holding the pre-decision version is rejected with HTTP 412 ERR_STALE_ENROLLMENT_VERSION even though no state precondition is violated; replaying the identical body with the post-decision version returns 201."
        test_recipe:
          setup:
            - "Shared prefix through both APPROVED phases and both cleanup goals."
            - "The enrollment is created (arriving in ELIGIBILITY_REVIEW) and its version is read before the eligibility decision, then the decision is issued."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_clock_dec
            - *c_p2
            - *c_p2fa
            - *c_p2fb
            - *c_p2fc
            - *c_p2sub
            - *c_p2app
            - *c_g1
            - *c_g2
            - *c_enr
            - call: "GET /vcp-enrollments/${enr_id}"
              payload: {}
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { enr_v_pre: $.data.version }
            - *c_elig
          trigger:
            - call: "POST /remedial-action-plans"
              payload:
                vcp_enrollment_id: "${enr_id}"
                site_id: "${site_id}"
                remedy_narrative: "Excavation, groundwater treatment and vapour mitigation filed against a stale enrollment view."
                basis_assessment_phase_id: "${p2_id}"
                years_to_construction_start: 3
                cost_lines: *C_LINES
                expected_vcp_enrollment_version: "${enr_v_pre}"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { occ_enr_err: $.data.error_id }
            - *c_plan
          assert:
            - "VcpEnrollment.${enr_id}.status == 'ELIGIBILITY_REVIEW' when ${enr_v_pre} is read, and 'ENROLLED' after the decision with ${enr_v1} == ${enr_v_pre} + 1"
            - "the stale create returns HTTP 412 with error_id ${occ_enr_err} == 'ERR_STALE_ENROLLMENT_VERSION' and creates no RemedialActionPlan"
            - "GET /remedial-action-plans?vcp_enrollment_id=${enr_id} returns total_count == 0 immediately after the rejection"
            - "the identical body carrying ${enr_v1} returns HTTP 201 with RemedialActionPlan.${plan_id}.total_estimate_cents == 115210677"
            - "VcpEnrollment.${enr_id}.version is unchanged by the rejected create — a 412 is not a write"

      - name: occ_stale_plan_version_blocks_the_cost_cap_quote
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[policy-quote-stale-plan]
          - errors[ERR_STALE_PLAN_VERSION]
          - validations[14]
        distinguishing_aspect: "The plan's version is bumped by a cascade the underwriter never issued — the first passing control certification bubbles the enrollment to IMPLEMENTATION and increments RemedialActionPlan.version — so a quote carrying the approval-time version returns HTTP 412 ERR_STALE_PLAN_VERSION, and re-reading the plan first makes the identical quote succeed at underwriting_estimate_cents 139,803,445."
        test_recipe:
          setup:
            - "Shared prefix through the APPROVED plan (version captured at approval), then the clock moved to 2027-01-15 and the first PASS certification filed, which bumps the plan version through the enrollment cascade."
            - "The plan is then re-read to obtain its current version."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_clock_dec
            - *c_p2
            - *c_p2fa
            - *c_p2fb
            - *c_p2fc
            - *c_p2sub
            - *c_p2app
            - *c_g1
            - *c_g2
            - *c_enr
            - *c_elig
            - *c_plan
            - *c_ctl
            - *c_plansub
            - *c_plantech
            - *c_planpcc
            - *c_planapp
            - *c_clock_2701
            - *c_ctl_pass
            - call: "GET /remedial-action-plans/${plan_id}"
              payload: {}
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { plan_v_now: $.data.version }
          trigger:
            - call: "POST /cost-cap-policies"
              payload:
                remedial_action_plan_id: "${plan_id}"
                insurer_party_id: "${insurer_id}"
                policy_reference: "CCP-2743-STALE"
                term_years: 5
                expected_remedial_action_plan_version: "${plan_v_appr}"
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { occ_plan_err: $.data.error_id }
            - &c_quote_fresh
              call: "POST /cost-cap-policies"
              payload:
                remedial_action_plan_id: "${plan_id}"
                insurer_party_id: "${insurer_id}"
                policy_reference: "CCP-2743-FRESH"
                term_years: 5
                expected_remedial_action_plan_version: "${plan_v_now}"
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { pol_fresh_id: $.data.id }
          assert:
            - "${plan_v_now} == ${plan_v_appr} + 1 — the PASS certification's enrollment cascade incremented the plan version"
            - "the stale quote returns HTTP 412 with error_id ${occ_plan_err} == 'ERR_STALE_PLAN_VERSION' and creates no CostCapPolicy"
            - "GET /cost-cap-policies?remedial_action_plan_id=${plan_id} returns total_count == 0 after the rejection"
            - "the fresh quote returns HTTP 201 with CostCapPolicy.${pol_fresh_id}.underwriting_estimate_cents == 139803445, attachment_point_cents == 153783790, limit_cents == 50000000, rate_applied == 0.055 and premium_cents == 2832500"
            - "RemedialActionPlan.${plan_id}.version increments once more on the accepted quote and total_funding_need_cents is still 115210677 (unchanged until bind)"

      - name: ops_run_checkpoint_is_the_only_channel_that_stales_an_inquiry
        claim_type: ops_run_checkpoint
        grounds:
          - state_machines.LiabilityProtection.AAI_COMPLETE_to_AAI_STALE
          - endpoints[POST /compliance-sweeps]
          - calculations.bfpp_compliance.constants.AAI_VALIDITY_DAYS
        distinguishing_aspect: "aai_expires_on 2027-07-20 does not stale the inquiry by itself: the protection stays AAI_COMPLETE with bfpp_status NOT_ESTABLISHED-on-acquisition-grounds only until an ops run passes an as_of_date beyond it, at which point stale_inquiry_count reports 1; a second sweep one day later reports stale_inquiry_count 0 because AAI_STALE is no longer AAI_COMPLETE."
        test_recipe:
          setup:
            - "Clock 2026-08-01; a redeveloper, a consultant and a second site left UNDER_CONTRACT (planned_acquisition_date 2026-11-01, never acquired)."
            - "A liability protection on that site, an APPROVED PHASE_I with aai_report_date 2026-07-20, and the inquiry accepted so aai_expires_on becomes 2027-07-20."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_site_nocommit
            - *c_protB
            - &c_p1nc
              call: "POST /assessment-phases"
              payload:
                site_id: "${site_nc_id}"
                consultant_party_id: "${consult_id}"
                phase_type: PHASE_I
                field_start_date: "2026-06-05"
                field_end_date: "2026-07-12"
                delineation_confidence: SCREENING
                aai_report_date: "2026-07-20"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { p1nc_id: $.data.id }
            - &c_p1ncf
              call: "POST /assessment-phases/${p1nc_id}/contaminant-findings"
              payload:
                contaminant_code: "LEAD"
                media: SOIL
                sample_location_code: "SB-01"
                max_concentration_ugl: 900.0
                screening_level_ugl: 400.0
                delineated: false
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &c_p1ncsub
              call: "POST /assessment-phases/${p1nc_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &c_p1ncapp
              call: "POST /assessment-phases/${p1nc_id}/review"
              payload: { decision: APPROVE, review_comment: "Records review accepted for the tannery parcel." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &c_inq_nc
              call: "POST /liability-protections/${protB_id}/inquiry-completion"
              payload: { aai_phase_id: "${p1nc_id}" }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &c_clock_2707
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-21T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - &c_sweep_2707
              call: "POST /compliance-sweeps"
              payload: { as_of_date: "2027-07-21", site_id: "${site_nc_id}" }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { stale1: $.data.stale_inquiry_count, frozen1: $.data.frozen_site_count }
            - call: "POST /compliance-sweeps"
              payload: { as_of_date: "2027-07-22", site_id: "${site_nc_id}" }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { stale2: $.data.stale_inquiry_count }
          assert:
            - "before the sweep LiabilityProtection.${protB_id}.inquiry_state == 'AAI_COMPLETE' with aai_report_date == '2026-07-20' and aai_expires_on == '2027-07-20', even though the logical clock already reads 2027-07-21"
            - "the first sweep returns HTTP 200 with stale_inquiry_count ${stale1} == 1, lapsed_count == 0, forfeited_protection_count == 0 and frozen_site_count ${frozen1} == 0"
            - "LiabilityProtection.${protB_id}.inquiry_state == 'AAI_STALE' with bfpp_status == 'NOT_ESTABLISHED' and its version incremented by exactly 1"
            - "Site.${site_nc_id}.acquisition_status == 'UNDER_CONTRACT' — the transition's precondition, and the reason an ACQUIRED site is never staled by the sweep"
            - "the second sweep returns stale_inquiry_count ${stale2} == 0 and leaves inquiry_state 'AAI_STALE' with the version unchanged — the ops run is idempotent once the dimension has moved"

      - name: corner_layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / monitoring_exceedance_impairs_control_revokes_letter_rescinds_awards
          rationale: "The §1.8 instance walks the deepest chain in the scaffold end-to-end (result -> control -> site posture -> enrollment -> letter -> funding awards) and pins the ordering, and its sibling lapsed_reasonable_steps_forfeits_defence_and_freezes_site covers the second cascade root."

      - name: corner_layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_estimate_design_vs_underwriting_basis_diverge
          rationale: "The §1.8 instance computes both variants from identical cost_lines (115,210,677 vs 139,803,445) and pins the delta, and cleanup_goal_restricted_vs_unrestricted_basis_diverge does the same for the second dual-variant rule."

  # ===========================================================================
  # Consistency model (§0 complexity_profile.consistency_model == immediate)
  # ===========================================================================
  - section: consistency model
    instances:

      - name: every_cascade_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /remedial-action-plans/{id}/approve]
          - state_machines.SiteControl.PROPOSED_to_APPROVED
          - state_machines.VcpEnrollment.REMEDY_APPROVED
        distinguishing_aspect: "A single approval mutates four aggregates, and every one of them is readable at its final value in the very next request with no settling step: the response body itself carries the plan's terminal figures, and the control, enrollment and site reads agree immediately — there is no eventual-consistency window anywhere in the API."
        test_recipe:
          setup:
            - "Shared prefix through the plan's public-comment closure, with the PROPOSED control attached."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_clock_dec
            - *c_p2
            - *c_p2fa
            - *c_p2fb
            - *c_p2fc
            - *c_p2sub
            - *c_p2app
            - *c_g1
            - *c_g2
            - *c_enr
            - *c_elig
            - *c_plan
            - *c_ctl
            - *c_plansub
            - *c_plantech
            - *c_planpcc
          trigger:
            - *c_planapp
            - call: "GET /site-controls/${ctl_id}"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - call: "GET /vcp-enrollments/${enr_id}"
              payload: {}
              as: Redeveloper
              as_user_id: "${redev_id}"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Redeveloper
              as_user_id: "${redev_id}"
            - call: "GET /remedial-action-plans/${plan_id}"
              payload: {}
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          assert:
            - "the approve response body itself reports status 'APPROVED', approved_by_user_id 'reviewer-alpha', approved_at '2026-12-10T00:00:00Z', technical_review_state 'PASSED', public_comment_state 'CLOSED' and total_estimate_cents 115210677 — no field is left null for a later pass"
            - "the immediately following GET /site-controls/${ctl_id} reports status 'APPROVED' and next_certification_due_on '2027-04-01' (coverage_from 2027-01-01 + 90 days)"
            - "the immediately following GET /vcp-enrollments/${enr_id} reports status 'REMEDY_APPROVED' with reverted_completion_count 0"
            - "the immediately following GET /sites/${site_id} reports cleanup_posture 'OPEN' and impaired_control_count 0"
            - "the re-read of the plan is byte-identical to the approve response body, including pinned_cleanup_goal_versions and every derived cost figure"
            - "no endpoint in §1.5 requires a second call, a delay or a refresh trigger to observe a cascaded value"
