          setup:
            - "Clock at 2026-08-01T00:00:00Z. MaterialSpecification AB-CA-17 with max_retests 1 and retest_window_days 30."
            - "Two MaterialLots P and Q, each with one FAILing POTENCY result of 80.0 recorded at 2026-08-01T00:00:00Z, so both carry first_oos_at 2026-08-01T00:00:00.000Z and retest_count 0."
