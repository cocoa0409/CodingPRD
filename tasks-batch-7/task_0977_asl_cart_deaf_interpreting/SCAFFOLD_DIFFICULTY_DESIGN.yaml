          trigger:
            - { call: "POST /invoices/generate", payload: { assignment_id: "${asg1}" }, as: BillingClerk, captures: { err_gen: $.data.error_id } }
            - { call: "GET /requests/${req1}", payload: {}, as: Any }
            - { call: "POST /encounters/${enc1}/verify", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "GET /requests/${req1}", payload: {}, as: Any }
            - { call: "POST /invoices/generate", payload: { assignment_id: "${asg1}" }, as: BillingClerk, captures: { inv1: $.data.id } }
          assert:
            - "First generate error_id == ERR_ENCOUNTER_NOT_VERIFIED (409)"
            - "Pre-verify: Request.${req1}.status == IN_PROGRESS (assignment COMPLETED alone does not complete the request)"
            - "Post-verify: Request.${req1}.status == COMPLETED (cross-entity bubble)"
            - "Second generate succeeds: Invoice.${inv1}.issue_status == DRAFT and subtotal_cents == 24840"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: availability_window_half_open_adjacency
        grounds:
          - validations[priority=11]
          - entities.AvailabilityWindow.fields.start_at
        distinguishing_aspect: |
          Pairwise half-open interval semantics on the AvailabilityWindow resource: a new
          window whose start TOUCHES an existing window's end (12:00 after 09:00-12:00) is
          accepted, while one overlapping by a single minute (11:59 start) is rejected with
          ERR_AVAILABILITY_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Interpreter i1 exists with one availability window 2026-06-01T09:00:00Z - 12:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /interpreters"
              payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }
              as: PlatformAdmin
              captures: { i1: $.data.id }
            - call: "POST /interpreters/${i1}/availability-windows"
              payload: { start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T12:00:00Z", modalities: ["ASL_ONSITE"] }
              as: Interpreter
              as_user_id: "${i1}"
          trigger:
            - { call: "POST /interpreters/${i1}/availability-windows", payload: { start_at: "2026-06-01T12:00:00Z", end_at: "2026-06-01T15:00:00Z", modalities: ["ASL_ONSITE"] }, as: Interpreter, as_user_id: "${i1}", captures: { w2: $.data.id } }
            - { call: "POST /interpreters/${i1}/availability-windows", payload: { start_at: "2026-06-01T11:59:00Z", end_at: "2026-06-01T13:00:00Z", modalities: ["ASL_ONSITE"] }, as: Interpreter, as_user_id: "${i1}", captures: { err_olap: $.data.error_id } }
            - { call: "GET /interpreters/${i1}/availability-windows", payload: {}, as: Any }
          assert:
            - "Adjacent window 12:00-15:00 accepted (201): AvailabilityWindow.${w2} exists (half-open: touching endpoints do not overlap)"
            - "Overlapping window 11:59-13:00 rejected with error_id == ERR_AVAILABILITY_WINDOW_OVERLAP (409)"
            - "GET availability-windows returns exactly 2 rows"

      - name: vri_aggregate_capacity_third_allowed_fourth_rejected
        grounds:
          - calculations.vri_capacity_check
