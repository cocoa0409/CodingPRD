scenario: |
  981. Pet-Waste Removal & Yard Service (route): subscription & yard-size/pet-count
  pricing, route & scheduled visit, sanitize/deodorize add-on, HOA/multifamily
  common-area, skip/vacation, gate-access & pet-safety, per-visit billing,
  satisfaction

domain_name: pet-waste-removal
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Login + billing email; unique across Customers" }
      - { name: phone, type: string, source: input, description: "Primary contact phone E.164" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", default: "ACTIVE", constraints: "Enum {ACTIVE, SUSPENDED, CLOSED}" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Running account credit; debited by Invoice finalization, credited by ServiceCredit issuance. Starts at 0." }
      - { name: lifetime_visits_completed, type: integer, source: computed, description: "Count of Visits in COMPLETED state linked to any of the customer's Subscriptions" }
      - { name: satisfaction_rolling_avg, type: number, source: computed, description: "Rolling weighted satisfaction score across the customer's SatisfactionReports (see satisfaction_rolling_score calculation); null when no reports" }

  - name: Yard
    parent: Customer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner" }
      - { name: address_line1, type: string, source: input, description: "Street address" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state" }
      - { name: postal_code, type: string, source: input, description: "ZIP" }
      - { name: yard_size_sqft, type: integer, source: input, description: "Serviceable area in square feet; >0; drives tier", constraints: "1..200000" }
      - { name: pet_count, type: integer, source: input, description: "Number of dogs regularly using yard; drives tier", constraints: "0..20" }
      - { name: is_multifamily_common_area, type: boolean, source: input, default: false, description: "HOA / multifamily shared space flag; changes pricing formula branch" }
      - { name: hoa_account_code, type: string, source: input, description: "Required iff is_multifamily_common_area; references managing HOA billing account" }
      - { name: service_region_code, type: string, source: input, description: "Routing region used by ServiceRoute selector" }

  - name: PropertyAccessProfile
    parent: Yard
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: yard_id, type: string, source: input, description: "FK -> Yard.id (1:1 with Yard)" }
      - { name: gate_access_code, type: string, source: input, description: "Gate/combo code; encrypted at rest" }
      - { name: gate_instructions, type: string, source: input, description: "Free-form tech instructions" }
      - { name: pet_on_premises, type: boolean, source: input, description: "True if dog(s) likely present during visit; drives pet-safety precheck" }
      - { name: pet_aggression_flag, type: enum, source: input, default: "NONE", description: "NONE | CAUTION | AGGRESSIVE; AGGRESSIVE forces tech safety ack on Visit", constraints: "Enum {NONE, CAUTION, AGGRESSIVE}" }
      - { name: access_status, type: enum, source: system, description: "VERIFICATION_PENDING | VERIFIED | SUSPENDED", default: "VERIFICATION_PENDING", constraints: "Enum {VERIFICATION_PENDING, VERIFIED, SUSPENDED}" }
      - { name: suspension_reason, type: string, source: system, description: "Reason text when access_status transitions to SUSPENDED; null otherwise" }

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: plan_code, type: string, source: input, description: "Unique plan code (e.g. RES_WEEKLY_1, HOA_DAILY)" }
      - { name: display_name, type: string, source: input, description: "Human-readable name" }
      - { name: visit_frequency, type: enum, source: input, description: "WEEKLY | BIWEEKLY | TWICE_WEEKLY | DAILY", constraints: "Enum {WEEKLY, BIWEEKLY, TWICE_WEEKLY, DAILY}" }
      - { name: applies_to_multifamily, type: boolean, source: input, description: "If true this plan is only usable by HOA common-area yards" }
      - { name: base_monthly_fee_cents, type: integer, source: input, description: "Base monthly fee before size/pet adjustments", constraints: ">= 0" }
      - { name: yard_tier_thresholds, type: array, source: input, description: "Ascending sqft thresholds defining tiers; e.g. [2000, 5000, 10000] yields 4 tiers" }
      - { name: yard_tier_surcharges_cents, type: array, source: input, description: "Per-tier monthly surcharge in cents, parallel to yard_tier_thresholds (+1 implicit top tier)" }
      - { name: pet_tier_thresholds, type: array, source: input, description: "Ascending pet_count thresholds defining pet tiers; e.g. [1, 3, 5]" }
      - { name: pet_tier_surcharges_cents, type: array, source: input, description: "Per-tier monthly surcharge in cents" }
      - { name: multifamily_multiplier_bp, type: integer, source: input, default: 10000, description: "Basis-points multiplier applied to (base+tiers) when is_multifamily_common_area; 10000 = 1.00x" }
      - { name: plan_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED", constraints: "Enum {ACTIVE, RETIRED}" }

  - name: ServiceAddon
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: addon_code, type: string, source: input, description: "Unique code (SANITIZE, DEODORIZE)" }
      - { name: display_name, type: string, source: input, description: "Human name" }
      - { name: price_cents_per_visit, type: integer, source: input, description: "Flat per-visit price when applied", constraints: ">= 0" }
      - { name: addon_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED", constraints: "Enum {ACTIVE, RETIRED}" }

  - name: Subscription
    parent: Customer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: yard_id, type: string, source: input, description: "FK -> Yard.id; must belong to same customer" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | PAUSED | CANCELLED", constraints: "Enum {DRAFT, ACTIVE, PAUSED, CANCELLED}" }
      - { name: started_on, type: datetime, source: system, description: "Date subscription first entered ACTIVE" }
      - { name: next_billing_anchor_date, type: datetime, source: computed, description: "Date of next monthly billing anchor (ISO day)" }
      - { name: monthly_fee_cents_snapshot, type: integer, source: computed, description: "Last computed monthly fee (see monthly_subscription_fee calculation); refreshed on Yard/Plan changes" }
      - { name: pending_plan_change_id, type: string, source: system, description: "FK -> SubscriptionPlan.id; staged plan switch effective next anchor; null when none" }
      - { name: plan_change_effective_date, type: datetime, source: system, description: "Date staged plan change becomes effective" }

  - name: ServiceRoute
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: route_code, type: string, source: input, description: "Unique route code per service_date" }
      - { name: service_date, type: datetime, source: input, description: "Calendar date the route runs (UTC midnight)" }
      - { name: service_region_code, type: string, source: input, description: "Region served by this route" }
      - { name: assigned_technician_id, type: string, source: input, description: "FK -> Technician.id; null while unassigned" }
      - { name: max_visit_capacity, type: integer, source: input, description: "Max visits this route can hold", constraints: ">= 1" }
      - { name: committed_visit_count, type: integer, source: computed, description: "Current count of Visits in {SCHEDULED, EN_ROUTE, ON_SITE} on this route" }
      - { name: route_load_factor_bp, type: integer, source: computed, description: "committed_visit_count * 10000 / max_visit_capacity; integer floor" }
      - { name: route_status, type: enum, source: system, default: "PLANNED", description: "PLANNED | PUBLISHED | IN_PROGRESS | CLOSED", constraints: "Enum {PLANNED, PUBLISHED, IN_PROGRESS, CLOSED}" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: full_name, type: string, source: input, description: "Tech name" }
      - { name: employee_code, type: string, source: input, description: "Unique employee code" }
      - { name: certified_for_aggressive_pets, type: boolean, source: input, default: false, description: "Permits taking visits where pet_aggression_flag=AGGRESSIVE" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive techs cannot be assigned new visits" }

  - name: VacationWindow
    parent: Subscription
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive first skipped service day (UTC midnight)" }
      - { name: end_date, type: datetime, source: input, description: "Inclusive last skipped service day (UTC midnight)" }
      - { name: skip_reason, type: enum, source: input, description: "VACATION | WEATHER_HOLD | CUSTOMER_REQUEST | HOA_DIRECTIVE", constraints: "Enum {VACATION, WEATHER_HOLD, CUSTOMER_REQUEST, HOA_DIRECTIVE}" }
      - { name: window_status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | APPLIED | CANCELLED", constraints: "Enum {SCHEDULED, APPLIED, CANCELLED}" }

  - name: Visit
    parent: Subscription
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: service_route_id, type: string, source: input, description: "FK -> ServiceRoute.id; may be null while pending route assignment" }
      - { name: scheduled_date, type: datetime, source: input, description: "Scheduled service day (UTC midnight)" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Earliest permitted arrival time (ISO)" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "Latest permitted arrival time (ISO); > window_start" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | EN_ROUTE | ON_SITE | COMPLETED | SKIPPED | MISSED | CANCELLED", constraints: "Enum {SCHEDULED, EN_ROUTE, ON_SITE, COMPLETED, SKIPPED, MISSED, CANCELLED}" }
      - { name: skip_source, type: enum, source: system, description: "VACATION | CUSTOMER_REQUEST | TECH_CANNOT_ACCESS | PET_SAFETY | OTHER; set when status=SKIPPED", constraints: "Enum {VACATION, CUSTOMER_REQUEST, TECH_CANNOT_ACCESS, PET_SAFETY, OTHER}" }
      - { name: addon_ids, type: array, source: input, description: "Array of ServiceAddon ids attached to this visit" }
      - { name: tech_safety_ack_at, type: datetime, source: system, description: "Timestamp when technician acknowledged pet-aggression safety; required before ON_SITE when yard pet_aggression_flag != NONE" }
      - { name: provisional_visit_charge_cents, type: integer, source: computed, description: "Forward-looking per-visit estimate at schedule time (see per_visit_charge)" }
      - { name: final_visit_charge_cents, type: integer, source: computed, description: "Finalized per-visit charge after completion/skip outcome (see per_visit_charge FINAL variant); null until finalized" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp of transition into COMPLETED" }
      - { name: invoiced_at, type: datetime, source: system, description: "Timestamp when this Visit was bound onto an InvoiceLineItem; null until billed" }

  - name: Invoice
    parent: Customer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: billing_period_start, type: datetime, source: input, description: "Inclusive period start (UTC midnight)" }
      - { name: billing_period_end, type: datetime, source: input, description: "Exclusive period end (UTC midnight)" }
      - { name: invoice_status, type: enum, source: system, default: "OPEN", description: "OPEN | FINALIZED | PAID | DISPUTED | RESOLVED", constraints: "Enum {OPEN, FINALIZED, PAID, DISPUTED, RESOLVED}" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of InvoiceLineItem.line_total_cents" }
      - { name: credits_applied_cents, type: integer, source: computed, description: "Credits absorbed from Customer.credit_balance_cents at finalize time" }
      - { name: total_due_cents, type: integer, source: computed, description: "subtotal_cents - credits_applied_cents; floor 0" }
      - { name: finalized_at, type: datetime, source: system, description: "Timestamp of OPEN -> FINALIZED transition" }

  - name: InvoiceLineItem
    parent: Invoice
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: visit_id, type: string, source: system, description: "FK -> Visit.id (unique per invoice); null for non-visit lines" }
      - { name: line_type, type: enum, source: system, description: "SUBSCRIPTION_FEE_PRORATED | VISIT_CHARGE | ADDON_CHARGE | VACATION_CREDIT | SATISFACTION_CREDIT | ADJUSTMENT", constraints: "Enum {SUBSCRIPTION_FEE_PRORATED, VISIT_CHARGE, ADDON_CHARGE, VACATION_CREDIT, SATISFACTION_CREDIT, ADJUSTMENT}" }
      - { name: description, type: string, source: input, description: "Human readable line label" }
      - { name: quantity, type: integer, source: input, description: "Units (visits, addon applications, days)", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit price in cents (may be negative for credits)" }
      - { name: line_total_cents, type: integer, source: computed, description: "quantity * unit_price_cents" }
      - { name: applied_addon_id, type: string, source: system, description: "FK -> ServiceAddon.id when line_type=ADDON_CHARGE; null otherwise" }

  - name: SatisfactionReport
    parent: Customer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id the report refers to" }
      - { name: rating, type: integer, source: input, description: "1..5 star rating", constraints: "1..5" }
      - { name: issue_category, type: enum, source: input, description: "MISSED_SPOT | LATE_ARRIVAL | GATE_ISSUE | PET_SAFETY | BILLING | OTHER", constraints: "Enum {MISSED_SPOT, LATE_ARRIVAL, GATE_ISSUE, PET_SAFETY, BILLING, OTHER}" }
      - { name: report_status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | UNDER_REVIEW | RESOLVED | ESCALATED", constraints: "Enum {SUBMITTED, UNDER_REVIEW, RESOLVED, ESCALATED}" }
      - { name: resolution_credit_cents, type: integer, source: system, description: "Credit granted on resolution (may be 0); posted to Customer.credit_balance_cents" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp of transition to RESOLVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/subscriptions/{id}/activate"
        actor: Customer
        preconditions:
          - "Yard.property_access_profile.access_status == VERIFIED (ERR_ACCESS_NOT_VERIFIED)"
          - "SubscriptionPlan referenced by plan_id has plan_status == ACTIVE (ERR_PLAN_RETIRED)"
          - "Yard is_multifamily_common_area agrees with plan.applies_to_multifamily (ERR_PLAN_SCOPE_MISMATCH)"
          - "Customer.account_status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "started_on := current_utc"
          - "next_billing_anchor_date := calendar-anchored first day of next month"
          - "monthly_fee_cents_snapshot := monthly_subscription_fee(subscription) (FORWARD_LOOKING variant)"
          - "Cascade: generate initial Visit sequence for current period according to plan.visit_frequency, each Visit.status=SCHEDULED"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/subscriptions/{id}/pause"
        actor: Customer
        preconditions:
          - "No Visit for this Subscription is in EN_ROUTE or ON_SITE (ERR_VISIT_IN_FLIGHT)"
        side_effects:
          - "Cascade down: all Visits in SCHEDULED on this Subscription with scheduled_date > today -> CANCELLED with skip_source=CUSTOMER_REQUEST"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/subscriptions/{id}/resume"
        actor: Customer
        preconditions:
          - "PropertyAccessProfile.access_status == VERIFIED (ERR_ACCESS_NOT_VERIFIED)"
          - "Customer.account_status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "Cascade: generate fresh Visit sequence for remainder of current period (forward-looking variant)"

      - from: [ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "Cascade down: all non-terminal Visits on this Subscription -> CANCELLED (skip_source=CUSTOMER_REQUEST)"
          - "If pending_plan_change_id is set, clear it and clear plan_change_effective_date"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /api/visits/{id}/depart"
        actor: Technician
        preconditions:
          - "Visit.service_route_id is non-null (ERR_ROUTE_NOT_ASSIGNED)"
          - "ServiceRoute.route_status == IN_PROGRESS (ERR_ROUTE_NOT_IN_PROGRESS)"
          - "ServiceRoute.assigned_technician_id == acting technician id (ERR_ROUTE_TECH_MISMATCH)"
        side_effects: []

      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /api/visits/{id}/arrive"
        actor: Technician
        preconditions:
          - "If Yard.property_access_profile.pet_aggression_flag in {CAUTION, AGGRESSIVE}, Visit.tech_safety_ack_at must be non-null (ERR_PET_SAFETY_ACK_REQUIRED)"
          - "If pet_aggression_flag == AGGRESSIVE, acting Technician.certified_for_aggressive_pets must be true (ERR_TECH_NOT_CERTIFIED_AGGRESSIVE)"
        side_effects: []

      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /api/visits/{id}/complete"
        actor: Technician
        preconditions: []
        side_effects:
          - "completed_at := current_utc"
          - "final_visit_charge_cents := per_visit_charge(FINAL variant)"
          - "Customer.lifetime_visits_completed += 1"
          - "Cascade: Customer.satisfaction_rolling_avg recompute (satisfaction_rolling_score)"
          - "Bubble up: when all Visits on parent ServiceRoute reach terminal state, route transitions IN_PROGRESS -> CLOSED"

      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /api/visits/{id}/skip"
        actor: Customer
        preconditions:
          - "scheduled_date is strictly after today (ERR_TOO_LATE_TO_SKIP)"
          - "Visit must not be on a route already IN_PROGRESS (ERR_ROUTE_LOCKED)"
        side_effects:
          - "skip_source := CUSTOMER_REQUEST"
          - "final_visit_charge_cents := 0"
          - "Bubble up: ServiceRoute.committed_visit_count -= 1; route_load_factor_bp recompute"
          - "Cascade: posting vacation_skip_credit on the OPEN Invoice covering scheduled_date if subscription.status == ACTIVE at skip time"

      - from: SCHEDULED
        to: SKIPPED
        trigger: "system (vacation window applied by VacationWindowApplier)"
        actor: system
        preconditions:
          - "An APPLIED VacationWindow on the same Subscription covers scheduled_date"
        side_effects:
          - "skip_source := VACATION"
          - "final_visit_charge_cents := 0"
          - "ServiceRoute.committed_visit_count -= 1; route_load_factor_bp recompute"
          - "Cascade: VACATION_CREDIT line on the Invoice covering the skipped date (vacation_skip_credit calc)"

      - from: SCHEDULED
        to: MISSED
        trigger: "system (end-of-day sweep when technician never arrived)"
        actor: system
        preconditions:
          - "current_utc > scheduled_window_end"
        side_effects:
          - "skip_source := OTHER"
          - "final_visit_charge_cents := 0"
          - "ServiceRoute.committed_visit_count -= 1; route_load_factor_bp recompute"
          - "Cascade: SATISFACTION_CREDIT line auto-posted on OPEN invoice (flat good-will credit)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from Subscription PAUSED/CANCELLED) or POST /api/visits/{id}/cancel by Customer"
        actor: system
        preconditions: []
        side_effects:
          - "ServiceRoute.committed_visit_count -= 1; route_load_factor_bp recompute"

  - entity: ServiceRoute
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: PUBLISHED
        trigger: "POST /api/service-routes/{id}/publish"
        actor: OperationsManager
        preconditions:
          - "assigned_technician_id is non-null (ERR_TECH_REQUIRED)"
          - "assigned Technician.active == true (ERR_TECH_INACTIVE)"
          - "committed_visit_count >= 1 (ERR_EMPTY_ROUTE)"
        side_effects: []

      - from: PUBLISHED
        to: IN_PROGRESS
        trigger: "POST /api/service-routes/{id}/start"
        actor: Technician
        preconditions:
          - "acting technician id == assigned_technician_id (ERR_ROUTE_TECH_MISMATCH)"
          - "current_utc date == service_date (ERR_ROUTE_WRONG_DAY)"
        side_effects: []

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "system (auto-close when every Visit on route is in a terminal state) or POST /api/service-routes/{id}/close"
        actor: system
        preconditions:
          - "All Visits on route are in {COMPLETED, SKIPPED, MISSED, CANCELLED}"
        side_effects: []

      - from: PUBLISHED
        to: PLANNED
        trigger: "POST /api/service-routes/{id}/unpublish"
        actor: OperationsManager
        preconditions:
          - "No Visit on route is in EN_ROUTE or ON_SITE"
        side_effects: []

  - entity: PropertyAccessProfile
    initial_state: VERIFICATION_PENDING
    terminal_states: []
    transitions:
      - from: VERIFICATION_PENDING
        to: VERIFIED
        trigger: "POST /api/property-access-profiles/{id}/verify"
        actor: OperationsManager
        preconditions:
          - "gate_access_code is non-empty (ERR_GATE_CODE_REQUIRED)"
        side_effects: []

      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /api/property-access-profiles/{id}/suspend"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "suspension_reason := payload.reason"
          - "Cross-entity: any Subscription on the owning Yard currently ACTIVE -> remains ACTIVE but new Visit scheduling is blocked by ERR_ACCESS_NOT_VERIFIED on activate/resume"

      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /api/property-access-profiles/{id}/verify"
        actor: OperationsManager
        preconditions:
          - "gate_access_code is non-empty"
        side_effects:
          - "suspension_reason := null"

      - from: VERIFIED
        to: VERIFICATION_PENDING
        trigger: "POST /api/property-access-profiles/{id}/require-reverification"
        actor: OperationsManager
        preconditions: []
        side_effects: []

  - entity: VacationWindow
    initial_state: SCHEDULED
    terminal_states: [APPLIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: APPLIED
        trigger: "system (VacationWindowApplier cron at window.start_date 00:00Z)"
        actor: system
        preconditions:
          - "Subscription.status in {ACTIVE, PAUSED} at apply time"
        side_effects:
          - "Cascade: all Visits on this Subscription with scheduled_date in [start_date, end_date] and status == SCHEDULED transition to SKIPPED with skip_source=VACATION (each hop fires the Visit.SCHEDULED_to_SKIPPED side-effects, including the VACATION_CREDIT invoice line)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/vacation-windows/{id}/cancel"
        actor: Customer
        preconditions:
          - "current_utc < start_date (ERR_WINDOW_ALREADY_STARTED)"
        side_effects: []

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, RESOLVED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /api/invoices/{id}/finalize"
        actor: BillingAdmin
        preconditions:
          - "billing_period_end <= current_utc (ERR_PERIOD_NOT_CLOSED)"
        side_effects:
          - "subtotal_cents := sum(InvoiceLineItem.line_total_cents)"
          - "credits_applied_cents := min(Customer.credit_balance_cents, subtotal_cents)"
          - "total_due_cents := subtotal_cents - credits_applied_cents"
          - "Customer.credit_balance_cents -= credits_applied_cents"
          - "finalized_at := current_utc"

      - from: FINALIZED
        to: PAID
        trigger: "POST /api/invoices/{id}/record-payment"
        actor: BillingAdmin
        preconditions:
          - "payload.amount_cents == total_due_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects: []

      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /api/invoices/{id}/dispute"
        actor: Customer
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /api/invoices/{id}/resolve-dispute"
        actor: BillingAdmin
        preconditions:
          - "payload.resolution_credit_cents >= 0"
        side_effects:
          - "If resolution_credit_cents > 0: post SATISFACTION_CREDIT line to the NEXT OPEN invoice (or create one) and credit Customer.credit_balance_cents by resolution_credit_cents"

  - entity: SatisfactionReport
    initial_state: SUBMITTED
    terminal_states: [RESOLVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/satisfaction-reports/{id}/begin-review"
        actor: OperationsManager
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /api/satisfaction-reports/{id}/resolve"
        actor: OperationsManager
        preconditions:
          - "payload.resolution_credit_cents >= 0"
        side_effects:
          - "resolved_at := current_utc"
          - "resolution_credit_cents := payload.resolution_credit_cents"
          - "Customer.credit_balance_cents += resolution_credit_cents"
          - "Customer.satisfaction_rolling_avg recompute (satisfaction_rolling_score)"

      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /api/satisfaction-reports/{id}/escalate"
        actor: OperationsManager
        preconditions: []
        side_effects: []

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /api/satisfaction-reports/{id}/resolve"
        actor: BillingAdmin
        preconditions:
          - "payload.resolution_credit_cents >= 0"
        side_effects:
          - "resolved_at := current_utc"
          - "resolution_credit_cents := payload.resolution_credit_cents"
          - "Customer.credit_balance_cents += resolution_credit_cents"
          - "Customer.satisfaction_rolling_avg recompute"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-plan-change-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /api/subscriptions/{id}/plan-change"
    occ_field: "expected_subscription_version"
    description: |
      Staging a plan change against a Subscription whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer has just
      activated, paused, or staged a different plan on the same Subscription and the current
      writer's view of the Subscription is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: invoice-finalize-stale-version
    parent_entity: Invoice
    write_endpoint: "POST /api/invoices/{id}/finalize"
    occ_field: "expected_invoice_version"
    description: |
      Finalizing an Invoice whose version has advanced since the client last read it is
      rejected. Captures the case where a VacationWindow application or a satisfaction
      resolution has posted new InvoiceLineItems onto this Invoice between the client's
      read and its finalize request.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_subscription_fee
    trigger: "On Subscription.activate, on Yard.yard_size_sqft/pet_count change while Subscription ACTIVE, on SubscriptionPlan change staged"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs with non-linear interaction
      base = plan.base_monthly_fee_cents
      yard_tier_idx = count(t for t in plan.yard_tier_thresholds if yard.yard_size_sqft >= t)   # 0..len(thresholds)
      yard_surcharge = plan.yard_tier_surcharges_cents[yard_tier_idx]                          # arrays have len(thresholds)+1 entries
      pet_tier_idx = count(t for t in plan.pet_tier_thresholds if yard.pet_count >= t)
      pet_surcharge = plan.pet_tier_surcharges_cents[pet_tier_idx]
      subtotal = base + yard_surcharge + pet_surcharge
      if yard.is_multifamily_common_area:
          fee = round_half_up(subtotal * plan.multifamily_multiplier_bp / 10000)
      else:
          fee = subtotal
      return fee
    input_set: "Yard referenced by Subscription.yard_id; SubscriptionPlan referenced by Subscription.plan_id (or pending_plan_change_id once effective)"
    constants:
      MULTIFAMILY_BASE_BP: 10000
    precision: "integer cents; final multifamily rounding is round_half_up to whole cents"
    variants:
      - name: FORWARD_LOOKING
        when: "Computed at activate/resume time and stored on monthly_fee_cents_snapshot"
        difference: "Uses the CURRENT yard_size_sqft and pet_count on Yard as of computation time"
      - name: RECONCILED
        when: "Computed at Invoice.finalize to produce the SUBSCRIPTION_FEE_PRORATED line for the period"
        difference: "Re-reads Yard at finalize time and prorates by days-active-in-period / days-in-period using round_half_up per day"

  - name: per_visit_charge
    trigger: "On Visit.schedule (PROVISIONAL), on Visit COMPLETED/SKIPPED/MISSED (FINAL)"
    algorithm: forward_looking
    formula: |
      # Mode (c): circular-looking — fee is derived from monthly_fee, but addons alter the
      # effective visit count used to amortize. Evaluation order is pinned below.
      # 1. Estimate number of scheduled visits in the billing period from plan.visit_frequency
      #    (WEEKLY=4.33, BIWEEKLY=2.17, TWICE_WEEKLY=8.67, DAILY=30) — pinned as AVG_VISITS_PER_MONTH.
      # 2. base_per_visit = round_half_up(monthly_fee_cents_snapshot / AVG_VISITS_PER_MONTH)
      # 3. addon_total = sum(price_cents_per_visit for each addon_id in visit.addon_ids)
      #    if both SANITIZE and DEODORIZE present, apply bundle_discount_bp to the sum of those two only.
      # 4. provisional_charge = base_per_visit + addon_total
    input_set: "Subscription.monthly_fee_cents_snapshot; Visit.addon_ids resolved against ServiceAddon where addon_status == ACTIVE"
    constants:
      AVG_VISITS_PER_MONTH_WEEKLY: 4.33
      AVG_VISITS_PER_MONTH_BIWEEKLY: 2.17
      AVG_VISITS_PER_MONTH_TWICE_WEEKLY: 8.67
      AVG_VISITS_PER_MONTH_DAILY: 30
      BUNDLE_SANITIZE_DEODORIZE_DISCOUNT_BP: 1500
    precision: "integer cents; round_half_up at every step (step 2 then step 3 then step 4)"
    variants:
      - name: PROVISIONAL
        when: "Computed at schedule time and stored on provisional_visit_charge_cents"
        difference: "Uses the addons present on the Visit row at schedule time; assumes visit will be COMPLETED"
      - name: FINAL
        when: "Computed at COMPLETED/SKIPPED/MISSED and stored on final_visit_charge_cents"
        difference: "For COMPLETED, recomputes using the CURRENT addons (addons added after scheduling are included). For SKIPPED/MISSED, returns 0 regardless of addons."

  - name: vacation_skip_credit
    trigger: "When VacationWindow transitions SCHEDULED -> APPLIED, for each Visit that becomes SKIPPED"
    algorithm: waterfall_allocation
    formula: |
      # Mode (b): nested rounding where order matters — pinned as round-per-visit-then-sum
      # 1. credit_per_visit = round_half_up(subscription.monthly_fee_cents_snapshot / AVG_VISITS_PER_MONTH[plan.visit_frequency])
      # 2. For each SKIPPED Visit: post one VACATION_CREDIT InvoiceLineItem with quantity=1, unit_price_cents=-credit_per_visit
      # 3. Waterfall: apply to the Invoice covering the Visit.scheduled_date if one is OPEN;
      #    else create a new OPEN Invoice for that period; else (no OPEN invoice creatable because prior FINALIZED) post to NEXT OPEN invoice.
      # 4. Sum of all VACATION_CREDIT lines is bounded above by total_due of their host invoice (no over-credit; remainder posts to NEXT OPEN invoice).
    input_set: "Subscription.monthly_fee_cents_snapshot; SubscriptionPlan.visit_frequency; all Visits on the Subscription whose scheduled_date ∈ [start_date, end_date] AND status transitioned to SKIPPED in this apply pass"
    constants:
      MAX_CREDIT_PER_INVOICE_BP: 10000
    precision: "integer cents; per-line rounding is round_half_up BEFORE aggregation (round-per-line, NOT sum-then-round)"

  - name: route_load_factor_bp
    trigger: "On Visit create/cancel/skip/complete/miss, on ServiceRoute.max_visit_capacity update"
    algorithm: constraint_propagation
    formula: |
      # Route load is computed bottom-up from Visit state. Recomputed on every Visit mutation.
      committed = count(v for v in route.visits if v.status in {SCHEDULED, EN_ROUTE, ON_SITE})
      route.committed_visit_count = committed
      route.route_load_factor_bp = floor(committed * 10000 / route.max_visit_capacity)
      # Constraint: when load_factor_bp >= 10000, further Visit assignments to this route are rejected with ERR_ROUTE_AT_CAPACITY
    input_set: "All Visits with service_route_id == route.id AND status in {SCHEDULED, EN_ROUTE, ON_SITE}"
    constants:
      FULL_LOAD_BP: 10000
    precision: "integer basis points; floor division"

  - name: satisfaction_rolling_score
    trigger: "On SatisfactionReport create / resolve, on Visit COMPLETED (decay tick)"
    algorithm: decay_function
    formula: |
      # Rolling weighted satisfaction with exponential decay by report age.
      # weight_i = 0.9 ^ (days_since_report_i.created_at)   (step decay per day, NOT continuous)
      # score = sum(rating_i * weight_i) / sum(weight_i)
      # Special: a RESOLVED report's contribution is reset to 5.0 (the resolution is treated as a fresh perfect interaction)
      # Empty set (no reports) -> satisfaction_rolling_avg is null
    input_set: "All SatisfactionReports with customer_id == customer.id (any report_status)"
    constants:
      DECAY_PER_DAY: 0.9
      RESOLVED_RESET_RATING: 5.0
    precision: "2 decimal places, round_half_up at the final division only"

  - name: addon_bundle_pricing
    trigger: "When computing Visit addon_total"
    algorithm: aggregation
    formula: |
      # Bundle SANITIZE + DEODORIZE together to get a discount on the SUM of those two
      addons = [a for a in visit.addon_ids]
      sanitize_price = ServiceAddon[SANITIZE].price_cents_per_visit if SANITIZE in addons else 0
      deodorize_price = ServiceAddon[DEODORIZE].price_cents_per_visit if DEODORIZE in addons else 0
      other_total = sum(price for other addons)
      if sanitize_price > 0 AND deodorize_price > 0:
          bundle_pair = round_half_up((sanitize_price + deodorize_price) * (10000 - BUNDLE_SANITIZE_DEODORIZE_DISCOUNT_BP) / 10000)
      else:
          bundle_pair = sanitize_price + deodorize_price
      addon_total = bundle_pair + other_total
    input_set: "Visit.addon_ids resolved against ACTIVE ServiceAddons"
    constants:
      BUNDLE_SANITIZE_DEODORIZE_DISCOUNT_BP: 1500
    precision: "integer cents; round_half_up once on the bundle pair sum"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.5 roles[]"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-parameter id resolves to an existing entity, evaluated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every FK id in the request body (customer_id, yard_id, plan_id, addon_ids[*], service_route_id, visit_id) resolves to an existing entity"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all"

  - priority: 5
    category: state
    check: "Entity-bearing state machine transition is valid from the entity's current state per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "Customer.account_status == ACTIVE for any state-mutating action taken by the Customer role"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/subscriptions, POST /api/subscriptions/{id}/activate, POST /api/subscriptions/{id}/pause, POST /api/subscriptions/{id}/resume, POST /api/subscriptions/{id}/cancel, POST /api/vacation-windows, POST /api/visits/{id}/skip, POST /api/satisfaction-reports"

  - priority: 7
    category: business_safety
    check: "Subscription activation/resume requires PropertyAccessProfile.access_status == VERIFIED on the linked Yard"
    error_id: ERR_ACCESS_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /api/subscriptions/{id}/activate, POST /api/subscriptions/{id}/resume"

  - priority: 8
    category: business_safety
    check: "Visit arrival requires tech_safety_ack_at when yard pet_aggression_flag != NONE; requires certified_for_aggressive_pets when flag == AGGRESSIVE"
    error_id: ERR_PET_SAFETY_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /api/visits/{id}/arrive"

  - priority: 9
    category: business_safety
    check: "Yard creation requires hoa_account_code iff is_multifamily_common_area == true"
    error_id: ERR_HOA_CODE_REQUIRED
    http_status: 422
    applies_to: "POST /api/yards, PUT /api/yards/{id}"

  - priority: 10
    category: business_constraint
    check: "Plan scope must match Yard scope: SubscriptionPlan.applies_to_multifamily must equal Yard.is_multifamily_common_area"
    error_id: ERR_PLAN_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /api/subscriptions, POST /api/subscriptions/{id}/plan-change, POST /api/subscriptions/{id}/activate"

  - priority: 11
    category: business_constraint
    check: "Yard referenced by Subscription must belong to Subscription.customer_id"
    error_id: ERR_YARD_OWNERSHIP_MISMATCH
    http_status: 422
    applies_to: "POST /api/subscriptions"

  - priority: 12
    category: business_constraint
    check: "VacationWindow start_date <= end_date AND start_date >= current date (no retroactive windows)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /api/vacation-windows"

  - priority: 13
    category: business_temporal
    check: "VacationWindow date range must not overlap any other SCHEDULED or APPLIED VacationWindow on the same Subscription (closed-interval overlap)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/vacation-windows"

  - priority: 14
    category: business_temporal
    check: "Visit.scheduled_window_start < scheduled_window_end AND scheduled_window_end - scheduled_window_start >= 30 minutes"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /api/visits"

  - priority: 15
    category: business_temporal
    check: "New Visit on a route must not have scheduled_window overlapping an existing visit on the SAME ROUTE with buffer: (existing.window_start - 15min, existing.window_end + 15min) — half-open intersection"
    error_id: ERR_VISIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/visits, POST /api/visits/{id}/assign-route"

  - priority: 16
    category: business_constraint
    check: "ServiceRoute.route_load_factor_bp must remain < 10000 after adding the visit (rejects the assignment that would cross 10000)"
    error_id: ERR_ROUTE_AT_CAPACITY
    http_status: 409
    applies_to: "POST /api/visits, POST /api/visits/{id}/assign-route"

  - priority: 17
    category: business_fiscal
    check: "Invoice finalize requires billing_period_end <= current_utc"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /api/invoices/{id}/finalize"

  - priority: 18
    category: business_fiscal
    check: "Payment amount must exactly equal total_due_cents (no overpayment, no underpayment)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /api/invoices/{id}/record-payment"

  - priority: 19
    category: business_fiscal
    check: "SatisfactionReport resolution_credit_cents >= 0 AND <= 100000 (max single-resolution credit $1000)"
    error_id: ERR_CREDIT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /api/satisfaction-reports/{id}/resolve, POST /api/invoices/{id}/resolve-dispute"

  - priority: 20
    category: business_referential
    check: "Visit cannot be scheduled for a Subscription in CANCELLED status, or for a Yard whose PropertyAccessProfile.access_status != VERIFIED at schedule time"
    error_id: ERR_SUBSCRIPTION_NOT_SERVICEABLE
    http_status: 422
    applies_to: "POST /api/visits"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Customers -----
  - method: POST
    path: "/api/customers"
    description: "Register a new customer (OperationsManager onboards)"
    roles: [OperationsManager]
    code: 201
    input: [full_name, email, phone]
    output: Customer
    side_effects: ["Customer.account_status=ACTIVE, credit_balance_cents=0"]

  - method: GET
    path: "/api/customers/{id}"
    description: "Fetch single customer"
    roles: [OperationsManager, BillingAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/api/customers"
    description: "List customers"
    roles: [OperationsManager, BillingAdmin]
    code: 200
    input: ["limit?", "offset?", "email?"]
    output: Customer[]
    side_effects: []

  # ----- Yards -----
  - method: POST
    path: "/api/yards"
    description: "Add a serviceable yard for a customer"
    roles: [OperationsManager, Customer]
    code: 201
    input: [customer_id, address_line1, city, state_code, postal_code, yard_size_sqft, pet_count, "is_multifamily_common_area?", "hoa_account_code?", service_region_code]
    output: Yard
    side_effects: ["Cascades: any ACTIVE Subscription referencing this Yard recomputes monthly_fee_cents_snapshot (monthly_subscription_fee FORWARD_LOOKING)"]

  - method: GET
    path: "/api/yards/{id}"
    description: "Fetch yard"
    roles: [OperationsManager, Customer, Technician]
    code: 200
    input: []
    output: Yard
    side_effects: []

  - method: GET
    path: "/api/yards"
    description: "List yards (filterable)"
    roles: [OperationsManager, Customer, Technician]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "service_region_code?"]
    output: Yard[]
    side_effects: []

  - method: PUT
    path: "/api/yards/{id}"
    description: "Update yard size/pet count (recomputes subscription fee)"
    roles: [OperationsManager, Customer]
    code: 200
    input: ["yard_size_sqft?", "pet_count?", "is_multifamily_common_area?", "hoa_account_code?", "service_region_code?"]
    output: Yard
    side_effects: ["Cascade: monthly_fee_cents_snapshot recompute on any ACTIVE Subscription for this Yard"]

  # ----- PropertyAccessProfile -----
  - method: POST
    path: "/api/yards/{id}/access-profile"
    description: "Create 1:1 access profile for a yard"
    roles: [OperationsManager, Customer]
    code: 201
    input: [gate_access_code, gate_instructions, pet_on_premises, "pet_aggression_flag?"]
    output: PropertyAccessProfile
    side_effects: []

  - method: GET
    path: "/api/yards/{id}/access-profile"
    description: "Get the yard's access profile (array of 0 or 1)"
    roles: [OperationsManager, Customer, Technician]
    code: 200
    input: []
    output: PropertyAccessProfile[]
    side_effects: []

  - method: GET
    path: "/api/property-access-profiles"
    description: "Filtered list of access profiles"
    roles: [OperationsManager, Customer, Technician]
    code: 200
    input: ["limit?", "offset?", "yard_id?"]
    output: PropertyAccessProfile[]
    side_effects: []

  - method: POST
    path: "/api/property-access-profiles/{id}/verify"
    description: "Mark profile VERIFIED"
    roles: [OperationsManager]
    code: 200
    input: []
    output: PropertyAccessProfile
    side_effects: []

  - method: POST
    path: "/api/property-access-profiles/{id}/suspend"
    description: "Suspend access (gate broken, pet incident)"
    roles: [OperationsManager]
    code: 200
    input: [reason]
    output: PropertyAccessProfile
    side_effects: []

  - method: POST
    path: "/api/property-access-profiles/{id}/require-reverification"
    description: "Force profile back to VERIFICATION_PENDING"
    roles: [OperationsManager]
    code: 200
    input: []
    output: PropertyAccessProfile
    side_effects: []

  # ----- SubscriptionPlans -----
  - method: POST
    path: "/api/subscription-plans"
    description: "Define a new plan"
    roles: [OperationsManager]
    code: 201
    input: [plan_code, display_name, visit_frequency, applies_to_multifamily, base_monthly_fee_cents, yard_tier_thresholds, yard_tier_surcharges_cents, pet_tier_thresholds, pet_tier_surcharges_cents, "multifamily_multiplier_bp?"]
    output: SubscriptionPlan
    side_effects: []

  - method: GET
    path: "/api/subscription-plans"
    description: "List plans"
    roles: [OperationsManager, Customer, BillingAdmin]
    code: 200
    input: ["limit?", "offset?", "plan_status?"]
    output: SubscriptionPlan[]
    side_effects: []

  - method: GET
    path: "/api/subscription-plans/{id}"
    description: "Get one plan"
    roles: [OperationsManager, Customer, BillingAdmin]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []

  # ----- ServiceAddons -----
  - method: POST
    path: "/api/service-addons"
    description: "Define addon (SANITIZE / DEODORIZE)"
    roles: [OperationsManager]
    code: 201
    input: [addon_code, display_name, price_cents_per_visit]
    output: ServiceAddon
    side_effects: []

  - method: GET
    path: "/api/service-addons"
    description: "List addons"
    roles: [OperationsManager, Customer, BillingAdmin, Technician]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceAddon[]
    side_effects: []

  # ----- Subscriptions -----
  - method: POST
    path: "/api/subscriptions"
    description: "Create subscription (status=DRAFT)"
    roles: [OperationsManager, Customer]
    code: 201
    input: [customer_id, yard_id, plan_id]
    output: Subscription
    side_effects: []

  - method: GET
    path: "/api/subscriptions/{id}"
    description: "Get subscription"
    roles: [OperationsManager, Customer, BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/api/subscriptions"
    description: "List subscriptions"
    roles: [OperationsManager, Customer, BillingAdmin]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "yard_id?", "plan_id?", "pending_plan_change_id?", "status?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/api/subscriptions/{id}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Computes monthly_fee_cents_snapshot", "Generates initial Visit sequence", "increments Subscription.version by 1"]

  - method: POST
    path: "/api/subscriptions/{id}/pause"
    description: "ACTIVE -> PAUSED"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Cancels future SCHEDULED visits"]

  - method: POST
    path: "/api/subscriptions/{id}/resume"
    description: "PAUSED -> ACTIVE"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Generates fresh visits for remainder of period"]

  - method: POST
    path: "/api/subscriptions/{id}/cancel"
    description: "ACTIVE|PAUSED -> CANCELLED"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Cancels all non-terminal visits", "Clears pending_plan_change_id"]

  - method: POST
    path: "/api/subscriptions/{id}/plan-change"
    description: "Stage a plan change (OCC-guarded)"
    roles: [Customer]
    code: 200
    input: [new_plan_id, expected_subscription_version]
    output: Subscription
    side_effects: ["Sets pending_plan_change_id and plan_change_effective_date", "increments Subscription.version by 1"]

  # ----- Technicians -----
  - method: POST
    path: "/api/technicians"
    description: "Onboard a technician"
    roles: [OperationsManager]
    code: 201
    input: [full_name, employee_code, "certified_for_aggressive_pets?"]
    output: Technician
    side_effects: []

  - method: GET
    path: "/api/technicians/{id}"
    description: "Get a technician"
    roles: [OperationsManager, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # ----- ServiceRoutes -----
  - method: POST
    path: "/api/service-routes"
    description: "Plan a route for a service date"
    roles: [OperationsManager]
    code: 201
    input: [route_code, service_date, service_region_code, "assigned_technician_id?", max_visit_capacity]
    output: ServiceRoute
    side_effects: []

  - method: GET
    path: "/api/service-routes/{id}"
    description: "Get route"
    roles: [OperationsManager, Technician, BillingAdmin]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: []

  - method: GET
    path: "/api/service-routes"
    description: "List routes"
    roles: [OperationsManager, Technician, BillingAdmin]
    code: 200
    input: ["limit?", "offset?", "service_date?", "service_region_code?", "route_status?", "assigned_technician_id?"]
    output: ServiceRoute[]
    side_effects: []

  - method: GET
    path: "/api/service-routes/{id}/visits"
    description: "Visits assigned to a route"
    roles: [OperationsManager, Technician, BillingAdmin]
    code: 200
    input: []
    output: Visit[]
    side_effects: []

  - method: POST
    path: "/api/service-routes/{id}/publish"
    description: "PLANNED -> PUBLISHED"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: []

  - method: POST
    path: "/api/service-routes/{id}/unpublish"
    description: "PUBLISHED -> PLANNED"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: []

  - method: POST
    path: "/api/service-routes/{id}/start"
    description: "PUBLISHED -> IN_PROGRESS"
    roles: [Technician]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: []

  - method: POST
    path: "/api/service-routes/{id}/close"
    description: "IN_PROGRESS -> CLOSED (manual override)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: []

  # ----- Visits -----
  - method: POST
    path: "/api/visits"
    description: "Schedule a new visit on a subscription"
    roles: [OperationsManager, Customer]
    code: 201
    input: [subscription_id, scheduled_date, scheduled_window_start, scheduled_window_end, "service_route_id?", "addon_ids?"]
    output: Visit
    side_effects: ["provisional_visit_charge_cents := per_visit_charge PROVISIONAL", "if route assigned: route.committed_visit_count += 1; route.route_load_factor_bp recompute"]

  - method: GET
    path: "/api/visits/{id}"
    description: "Get visit"
    roles: [OperationsManager, Customer, Technician, BillingAdmin]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: GET
    path: "/api/visits"
    description: "List visits"
    roles: [OperationsManager, Customer, Technician, BillingAdmin]
    code: 200
    input: ["limit?", "offset?", "subscription_id?", "service_route_id?", "status?", "scheduled_date?"]
    output: Visit[]
    side_effects: []

  - method: POST
    path: "/api/visits/{id}/assign-route"
    description: "Assign or reassign a visit's route"
    roles: [OperationsManager]
    code: 200
    input: [service_route_id]
    output: Visit
    side_effects: ["Decrement old route counters; increment new route counters; recompute both route_load_factor_bp"]

  - method: POST
    path: "/api/visits/{id}/depart"
    description: "SCHEDULED -> EN_ROUTE"
    roles: [Technician]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/api/visits/{id}/ack-safety"
    description: "Record tech_safety_ack_at before arrive"
    roles: [Technician]
    code: 200
    input: []
    output: Visit
    side_effects: ["tech_safety_ack_at := current_utc"]

  - method: POST
    path: "/api/visits/{id}/arrive"
    description: "EN_ROUTE -> ON_SITE"
    roles: [Technician]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/api/visits/{id}/complete"
    description: "ON_SITE -> COMPLETED"
    roles: [Technician]
    code: 200
    input: []
    output: Visit
    side_effects: ["final_visit_charge_cents := per_visit_charge FINAL", "Customer.lifetime_visits_completed += 1", "satisfaction_rolling_avg recompute"]

  - method: POST
    path: "/api/visits/{id}/skip"
    description: "Customer-initiated skip of a future SCHEDULED visit"
    roles: [Customer]
    code: 200
    input: []
    output: Visit
    side_effects: ["skip_source := CUSTOMER_REQUEST", "final_visit_charge_cents := 0", "post vacation_skip_credit to OPEN invoice"]

  - method: POST
    path: "/api/visits/{id}/cancel"
    description: "Cancel a SCHEDULED visit"
    roles: [Customer, OperationsManager]
    code: 200
    input: []
    output: Visit
    side_effects: ["ServiceRoute counters updated"]

  # ----- VacationWindows -----
  - method: POST
    path: "/api/vacation-windows"
    description: "Schedule a vacation/skip window on a subscription"
    roles: [Customer, OperationsManager]
    code: 201
    input: [subscription_id, start_date, end_date, skip_reason]
    output: VacationWindow
    side_effects: []

  - method: GET
    path: "/api/vacation-windows/{id}"
    description: "Get vacation window"
    roles: [Customer, OperationsManager]
    code: 200
    input: []
    output: VacationWindow
    side_effects: []

  - method: GET
    path: "/api/subscriptions/{id}/vacation-windows"
    description: "List vacation windows for a subscription"
    roles: [Customer, OperationsManager]
    code: 200
    input: []
    output: VacationWindow[]
    side_effects: []

  - method: POST
    path: "/api/vacation-windows/{id}/cancel"
    description: "Cancel a future vacation window"
    roles: [Customer, OperationsManager]
    code: 200
    input: []
    output: VacationWindow
    side_effects: []

  # ----- Invoices -----
  - method: POST
    path: "/api/invoices"
    description: "Open a new billing invoice for a customer and period"
    roles: [BillingAdmin]
    code: 201
    input: [customer_id, billing_period_start, billing_period_end]
    output: Invoice
    side_effects: []

  - method: GET
    path: "/api/invoices/{id}"
    description: "Get invoice"
    roles: [BillingAdmin, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/api/invoices"
    description: "List invoices"
    roles: [BillingAdmin, Customer]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "invoice_status?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/api/invoices/{id}/line-items"
    description: "Line items on an invoice"
    roles: [BillingAdmin, Customer]
    code: 200
    input: []
    output: InvoiceLineItem[]
    side_effects: []

  - method: GET
    path: "/api/invoice-line-items"
    description: "Filtered list of invoice line items across invoices"
    roles: [BillingAdmin, Customer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "invoice_id?", "visit_id?", "applied_addon_id?", "line_type?"]
    output: InvoiceLineItem[]
    side_effects: []

  - method: GET
    path: "/api/invoice-line-items/{id}"
    description: "Get a single invoice line item by id"
    roles: [BillingAdmin, Customer, OperationsManager]
    code: 200
    input: []
    output: InvoiceLineItem
    side_effects: []

  - method: POST
    path: "/api/invoices/{id}/finalize"
    description: "OPEN -> FINALIZED (OCC-guarded)"
    roles: [BillingAdmin]
    code: 200
    input: [expected_invoice_version]
    output: Invoice
    side_effects: ["credits_applied_cents := min(Customer.credit_balance_cents, subtotal_cents)", "Customer.credit_balance_cents -= credits_applied_cents", "increments Invoice.version by 1"]

  - method: POST
    path: "/api/invoices/{id}/record-payment"
    description: "FINALIZED -> PAID"
    roles: [BillingAdmin]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: []

  - method: POST
    path: "/api/invoices/{id}/dispute"
    description: "FINALIZED -> DISPUTED"
    roles: [Customer]
    code: 200
    input: [reason]
    output: Invoice
    side_effects: []

  - method: POST
    path: "/api/invoices/{id}/resolve-dispute"
    description: "DISPUTED -> RESOLVED"
    roles: [BillingAdmin]
    code: 200
    input: [resolution_credit_cents]
    output: Invoice
    side_effects: ["Customer.credit_balance_cents += resolution_credit_cents"]

  # ----- SatisfactionReports -----
  - method: POST
    path: "/api/satisfaction-reports"
    description: "Customer files a satisfaction report on a completed visit"
    roles: [Customer]
    code: 201
    input: [customer_id, visit_id, rating, issue_category]
    output: SatisfactionReport
    side_effects: ["Customer.satisfaction_rolling_avg recompute"]

  - method: GET
    path: "/api/satisfaction-reports/{id}"
    description: "Get a report"
    roles: [OperationsManager, BillingAdmin, Customer]
    code: 200
    input: []
    output: SatisfactionReport
    side_effects: []

  - method: GET
    path: "/api/satisfaction-reports"
    description: "List reports"
    roles: [OperationsManager, BillingAdmin, Customer]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "visit_id?", "report_status?"]
    output: SatisfactionReport[]
    side_effects: []

  - method: POST
    path: "/api/satisfaction-reports/{id}/begin-review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [OperationsManager]
    code: 200
    input: []
    output: SatisfactionReport
    side_effects: []

  - method: POST
    path: "/api/satisfaction-reports/{id}/escalate"
    description: "UNDER_REVIEW -> ESCALATED"
    roles: [OperationsManager]
    code: 200
    input: []
    output: SatisfactionReport
    side_effects: []

  - method: POST
    path: "/api/satisfaction-reports/{id}/resolve"
    description: "UNDER_REVIEW|ESCALATED -> RESOLVED (credits customer)"
    roles: [OperationsManager, BillingAdmin]
    code: 200
    input: [resolution_credit_cents]
    output: SatisfactionReport
    side_effects: ["Customer.credit_balance_cents += resolution_credit_cents", "Customer.satisfaction_rolling_avg recompute"]

  # ----- Test-driving (clock) -----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default time is 2026-05-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and does NOT fall back to wall-clock."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  - method: POST
    path: "/api/_system/vacation-window-applier/run"
    description: "Test-driving: synchronously run the VacationWindowApplier over all SCHEDULED VacationWindows with start_date <= current_utc"
    roles: [OperationsManager]
    code: 200
    input: []
    output: "{ applied_window_ids: string[] }"
    side_effects: ["Transitions each due VacationWindow SCHEDULED -> APPLIED with the cascade declared in §1.2"]

  - method: POST
    path: "/api/_system/end-of-day-sweep/run"
    description: "Test-driving: synchronously run the missed-visit sweep for the current date"
    roles: [OperationsManager]
    code: 200
    input: []
    output: "{ missed_visit_ids: string[] }"
    side_effects: ["Transitions SCHEDULED visits past their window to MISSED per §1.2"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role lacks permission for endpoint per §1.5" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body FK does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine transition invalid from current state" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Customer.account_status != ACTIVE" }
  - { id: ERR_ACCESS_NOT_VERIFIED, http: 422, condition: "PropertyAccessProfile.access_status != VERIFIED when required" }
  - { id: ERR_PET_SAFETY_ACK_REQUIRED, http: 422, condition: "tech_safety_ack_at missing while pet_aggression_flag != NONE" }
  - { id: ERR_TECH_NOT_CERTIFIED_AGGRESSIVE, http: 422, condition: "Technician lacks aggressive-pet certification" }
  - { id: ERR_HOA_CODE_REQUIRED, http: 422, condition: "is_multifamily_common_area true but hoa_account_code missing" }
  - { id: ERR_PLAN_SCOPE_MISMATCH, http: 422, condition: "Plan applies_to_multifamily disagrees with Yard.is_multifamily_common_area" }
  - { id: ERR_PLAN_RETIRED, http: 422, condition: "SubscriptionPlan.plan_status != ACTIVE" }
  - { id: ERR_YARD_OWNERSHIP_MISMATCH, http: 422, condition: "Subscription.yard_id does not belong to Subscription.customer_id" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "VacationWindow start > end or retroactive" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "VacationWindow overlaps another SCHEDULED/APPLIED window on same Subscription" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "scheduled_window_start >= scheduled_window_end or < 30min duration" }
  - { id: ERR_VISIT_WINDOW_CONFLICT, http: 409, condition: "Visit window overlaps another visit on the same route with 15-min buffer" }
  - { id: ERR_ROUTE_AT_CAPACITY, http: 409, condition: "Adding visit would push route_load_factor_bp to >= 10000" }
  - { id: ERR_ROUTE_NOT_ASSIGNED, http: 422, condition: "Visit.depart attempted without service_route_id" }
  - { id: ERR_ROUTE_NOT_IN_PROGRESS, http: 409, condition: "Visit.depart requires route IN_PROGRESS" }
  - { id: ERR_ROUTE_TECH_MISMATCH, http: 403, condition: "Acting technician != route.assigned_technician_id" }
  - { id: ERR_ROUTE_WRONG_DAY, http: 409, condition: "Route start attempted on a date != service_date" }
  - { id: ERR_ROUTE_LOCKED, http: 409, condition: "Operation forbidden while route IN_PROGRESS" }
  - { id: ERR_TECH_REQUIRED, http: 422, condition: "Route publish requires assigned_technician_id" }
  - { id: ERR_TECH_INACTIVE, http: 422, condition: "Assigned technician is inactive" }
  - { id: ERR_EMPTY_ROUTE, http: 422, condition: "Route publish requires >= 1 committed visit" }
  - { id: ERR_TOO_LATE_TO_SKIP, http: 409, condition: "Visit.scheduled_date is not strictly after today" }
  - { id: ERR_VISIT_IN_FLIGHT, http: 409, condition: "Subscription pause attempted while a visit is EN_ROUTE or ON_SITE" }
  - { id: ERR_WINDOW_ALREADY_STARTED, http: 409, condition: "VacationWindow cancel attempted at or after start_date" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 422, condition: "Invoice finalize before billing_period_end" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment does not equal total_due_cents" }
  - { id: ERR_CREDIT_OUT_OF_RANGE, http: 422, condition: "resolution_credit_cents < 0 or > 100000" }
  - { id: ERR_SUBSCRIPTION_NOT_SERVICEABLE, http: 422, condition: "Subscription CANCELLED or access not verified at schedule time" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing / wrong type / malformed body" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End customer who owns yards and subscriptions"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/subscriptions/{id}/activate"
      - "POST /api/subscriptions/{id}/pause"
      - "POST /api/subscriptions/{id}/resume"
      - "POST /api/subscriptions/{id}/cancel"
      - "POST /api/subscriptions/{id}/plan-change"
      - "POST /api/visits/{id}/skip"
      - "POST /api/satisfaction-reports"
      - "POST /api/invoices/{id}/dispute"
    shared_operations:
      - "GET /api/customers/{id}"
      - "POST /api/yards"
      - "PUT /api/yards/{id}"
      - "GET /api/yards"
      - "GET /api/yards/{id}"
      - "POST /api/yards/{yard_id}/access-profile"
      - "GET /api/yards/{yard_id}/access-profile"
      - "GET /api/subscriptions"
      - "GET /api/subscriptions/{id}"
      - "POST /api/subscriptions"
      - "GET /api/subscription-plans"
      - "GET /api/subscription-plans/{id}"
      - "GET /api/service-addons"
      - "POST /api/visits"
      - "GET /api/visits"
      - "GET /api/visits/{id}"
      - "POST /api/visits/{id}/cancel"
      - "POST /api/vacation-windows"
      - "GET /api/vacation-windows/{id}"
      - "GET /api/subscriptions/{id}/vacation-windows"
      - "POST /api/vacation-windows/{id}/cancel"
      - "GET /api/invoices"
