  # ---------------------------------------------------------------------------
  # Guide section 6 - Errors (every catalog entry must be triggerable)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: registry_reads_with_unknown_ids_return_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TERM_NOT_FOUND]
          - errors[ERR_DEGREE_PROGRAM_NOT_FOUND]
          - errors[ERR_COURSE_NOT_FOUND]
          - errors[ERR_APPLICABILITY_RULE_NOT_FOUND]
        distinguishing_aspect: "Each registry read resolves its own path id and returns its own 404 code - ERR_TERM_NOT_FOUND, ERR_DEGREE_PROGRAM_NOT_FOUND, ERR_COURSE_NOT_FOUND and ERR_APPLICABILITY_RULE_NOT_FOUND respectively - never a shared generic 404."
        test_recipe:
          setup:
            - "The database holds no Term, DegreeProgram, Course or DegreeApplicabilityRule rows with the queried ids."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "GET /athletics/terms/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: Registrar
            - call: "GET /athletics/degree-programs/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: Registrar
            - call: "GET /athletics/courses/00000000-0000-0000-0000-000000000003"
              payload: {}
              as: Registrar
            - call: "GET /athletics/degree-applicability-rules/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: Registrar
          assert:
            - "The terms read is HTTP 404 with data.error_id == ERR_TERM_NOT_FOUND"
            - "The degree-programs read is HTTP 404 with data.error_id == ERR_DEGREE_PROGRAM_NOT_FOUND"
            - "The courses read is HTTP 404 with data.error_id == ERR_COURSE_NOT_FOUND"
            - "The degree-applicability-rules read is HTTP 404 with data.error_id == ERR_APPLICABILITY_RULE_NOT_FOUND"
            - "Every one of the four responses carries response_type == error with meta.api_request_id present"

      - name: student_record_reads_with_unknown_ids_return_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STUDENT_ATHLETE_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
          - errors[ERR_COMPLIANCE_INCIDENT_NOT_FOUND]
        distinguishing_aspect: "The academic-record reads each return their own 404 code, and the student read does so under an operational role so that the priority-3 ERR_NOT_OWN_RECORD ownership rule never masks the resolution failure."
        test_recipe:
          setup:
            - "The database holds no StudentAthlete, EligibilityCertification, EligibilityAppeal or ComplianceIncident rows with the queried ids."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "GET /athletics/student-athletes/00000000-0000-0000-0000-000000000005"
              payload: {}
              as: Registrar
            - call: "GET /athletics/certifications/00000000-0000-0000-0000-000000000006"
              payload: {}
              as: CertificationOfficer
            - call: "GET /athletics/appeals/00000000-0000-0000-0000-000000000007"
              payload: {}
              as: AppealsCommittee
            - call: "GET /athletics/compliance-incidents/00000000-0000-0000-0000-000000000008"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "The student-athletes read is HTTP 404 with data.error_id == ERR_STUDENT_ATHLETE_NOT_FOUND"
            - "The certifications read is HTTP 404 with data.error_id == ERR_CERTIFICATION_NOT_FOUND"
            - "The appeals read is HTTP 404 with data.error_id == ERR_APPEAL_NOT_FOUND"
            - "The compliance-incidents read is HTTP 404 with data.error_id == ERR_COMPLIANCE_INCIDENT_NOT_FOUND"

      - name: support_and_travel_reads_with_unknown_ids_return_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TUTOR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_SUPPORT_SESSION_NOT_FOUND]
          - errors[ERR_COMPETITION_EVENT_NOT_FOUND]
          - errors[ERR_MISSED_CLASS_REQUEST_NOT_FOUND]
        distinguishing_aspect: "The support and travel reads each surface their own 404 code, confirming that the four leaf entities are addressable resources with distinct error identities."
        test_recipe:
          setup:
            - "The database holds no TutorAssignment, SupportSession, CompetitionEvent or MissedClassRequest rows with the queried ids."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "GET /athletics/tutor-assignments/00000000-0000-0000-0000-000000000009"
              payload: {}
              as: LearningSpecialist
            - call: "GET /athletics/support-sessions/00000000-0000-0000-0000-000000000010"
              payload: {}
              as: LearningSpecialist
            - call: "GET /athletics/competition-events/00000000-0000-0000-0000-000000000011"
              payload: {}
              as: AthleticsOperations
            - call: "GET /athletics/missed-class-requests/00000000-0000-0000-0000-000000000012"
              payload: {}
              as: AcademicAdvisor
          assert:
            - "The tutor-assignments read is HTTP 404 with data.error_id == ERR_TUTOR_ASSIGNMENT_NOT_FOUND"
            - "The support-sessions read is HTTP 404 with data.error_id == ERR_SUPPORT_SESSION_NOT_FOUND"
            - "The competition-events read is HTTP 404 with data.error_id == ERR_COMPETITION_EVENT_NOT_FOUND"
            - "The missed-class-requests read is HTTP 404 with data.error_id == ERR_MISSED_CLASS_REQUEST_NOT_FOUND"

      - name: apr_close_with_earlier_term_open_returns_409
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APR_PRIOR_TERM_OPEN]
          - validations[priority=9]
          - calculations.apr_points_award.trigger
        distinguishing_aspect: "APR reporting is strictly chronological: closing the term_index 2 term while the term_index 1 term is still OPEN returns 409 ERR_APR_PRIOR_TERM_OPEN even though the clock is past both end dates."
        test_recipe:
          setup:
            - "2026FA (term_index 1) and 2027SP (term_index 2) both exist with apr_status OPEN and the clock stands at 2027-06-01T00:00:00Z, past both end dates."
          setup_api_calls:
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/terms"
              payload: { code: "2027SP", term_index: 2, term_type: "SPRING", catalog_year: 2027, start_date: "2027-01-11T00:00:00Z", end_date: "2027-05-14T00:00:00Z" }
              as: Registrar
              captures: { term2_id: $.data.id }
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /athletics/terms/${term2_id}/apr-close"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "The response is HTTP 409 with data.error_id == ERR_APR_PRIOR_TERM_OPEN"
            - "Term.${term2_id}.apr_status == OPEN and squad_apr is null"
            - "Term.${term1_id}.apr_status == OPEN - the refused call closed nothing"

      - name: duplicate_applicability_rule_triple_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_APPLICABILITY_RULE]
          - validations[priority=14]
          - entities.DegreeApplicabilityRule.constraints
        distinguishing_aspect: "The uniqueness key is (degree_program_id, course_id, effective_catalog_year) alone, so a second rule for the same triple is rejected with 409 even when it carries a different applicability value, and the stored row keeps its original CORE classification."
        test_recipe:
          setup:
            - "DegreeProgram DP57 and course PHIL-050 exist and a CORE rule for effective_catalog_year 2026 has already been created."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/degree-programs"
              payload: { code: "DP57", name: "Philosophy", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { dp57_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "PHIL", course_number: "050", title: "Logic Workshop", credit_hours: 6.00, instructor_user_id: "instr_phil_1" }
              as: Registrar
              captures: { phil_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp57_id}", course_id: "${phil_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
              captures: { rule57_id: $.data.id }
          trigger:
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp57_id}", course_id: "${phil_id}", effective_catalog_year: 2026, applicability: "ELECTIVE" }
              as: Registrar
          assert:
            - "The response is HTTP 409 with data.error_id == ERR_DUPLICATE_APPLICABILITY_RULE"
            - "DegreeApplicabilityRule.${rule57_id}.applicability == CORE and max_countable_credits is null"
            - "GET /athletics/degree-applicability-rules with degree_program_id ${dp57_id} returns total_count == 1"
            - "A rule for the same program and course with effective_catalog_year 2027 would be accepted, proving the year is part of the key"

      - name: grant_relief_exceeding_request_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RELIEF_EXCEEDS_REQUEST]
          - state_machines.EligibilityAppeal.transitions.COMMITTEE_REVIEW_to_GRANTED
          - entities.EligibilityAppeal.fields.granted_credit_relief
        distinguishing_aspect: "The GRANT precondition granted_credit_relief <= requested_credit_relief is violated by 10.00 against a 6.00 request, so the appeal stays in COMMITTEE_REVIEW with granted_credit_relief unwritten and the certification stays DENIED."
        test_recipe:
          setup:
            - "Student S58 has no declared major; an INITIAL certification for 2026FA was submitted by adv_1, denied by co_decider and is therefore DENIED."
            - "Appeal A58 (PROGRESS_WAIVER, requested_credit_relief 6.00) was submitted by adv_1 and opened for review by ac_1, so it is in COMMITTEE_REVIEW."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fiftyeight", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s58_id: $.data.id }
            - call: "GET /athletics/student-athletes/${s58_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s58_v: $.data.version }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s58_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s58_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert58_id: $.data.id }
            - call: "POST /athletics/certifications/${cert58_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
            - call: "POST /athletics/certifications/${cert58_id}/status"
              payload: { action: "DENY" }
              as: CertificationOfficer
              as_user_id: "co_decider"
            - call: "POST /athletics/appeals"
              payload: { certification_id: "${cert58_id}", appeal_type: "PROGRESS_WAIVER", rationale: "Documented medical hardship during the entry term.", requested_credit_relief: 6.00 }
              as: AcademicAdvisor
              as_user_id: "adv_1"
              captures: { ap58_id: $.data.id }
            - call: "POST /athletics/appeals/${ap58_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
            - call: "POST /athletics/appeals/${ap58_id}/status"
              payload: { action: "OPEN_REVIEW" }
              as: AppealsCommittee
              as_user_id: "ac_1"
          trigger:
            - call: "POST /athletics/appeals/${ap58_id}/status"
              payload: { action: "GRANT", granted_credit_relief: 10.00 }
              as: AppealsCommittee
              as_user_id: "ac_2"
          assert:
            - "The response is HTTP 422 with data.error_id == ERR_RELIEF_EXCEEDS_REQUEST"
            - "EligibilityAppeal.${ap58_id}.status == COMMITTEE_REVIEW, round_number == 1 and granted_credit_relief is null"
            - "EligibilityAppeal.${ap58_id}.decided_by_user_id is null and decided_at is null"
            - "EligibilityCertification.${cert58_id}.status == DENIED and credit_relief_applied == 0.00"
            - "StudentAthlete.${s58_id}.eligibility_state == NOT_CERTIFIED - no declared transition leads from NOT_CERTIFIED to INELIGIBLE"

      - name: appeal_against_certified_certification_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPEAL_NOT_ELIGIBLE]
          - validations[priority=10]
          - state_machines.EligibilityCertification.transitions.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: "An appeal requires something to except: with the linked certification in CERTIFIED the creation returns 422 ERR_APPEAL_NOT_ELIGIBLE and no EligibilityAppeal row is written."
        test_recipe:
          setup:
            - "Student S59 declared DP59 (total_required_credits 60.00) and completed KINE-200 (12.00 credits, CORE rule for catalog 2026) with grade B, so cumulative_gpa is 3.00 and the benchmark passes."
            - "An INITIAL certification for 2026FA was requested by co_requester, submitted by adv_1 and certified by co_decider, so it is CERTIFIED."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "DP59", name: "Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { dp59_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "200", title: "Exercise Physiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp59_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
