            Hop 3: the enrollment now has funding_status CLAWED_BACK (academic_status stays PASSED)
            and GET /tax-ledger-entries?enrollment_id=${enrollment_id}&entry_type=REVERSAL returns
            total_count 1 with benefit_cents -69333, excluded_cents -69333 and
            imputed_income_cents 0 - the prorated principal, not the full 104000.
            Hop 4: GET /employees/${employee_id} shows cap_disbursed_cents 0,
            cap_clawback_hold_cents 104000, cap_available_cents 696000 (unchanged, because the
            full disbursed amount moved from disbursed into the hold),
            taxable_excluded_cents_ytd 34667 (104000 - 69333), imputed_income_cents_ytd 0 and
            open_repayment_balance_cents 69333; GET /employers/${employer_id} shows
            total_disbursed_cents 0 and total_admin_fee_cents 5200 (the admin fee is not reversed).

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_listing_state_error_outranks_exhausted_annual_cap
        grounds: >-
          §1.4 orders ERR_LISTING_NOT_CURATED at priority 21 (category state) and
          ERR_ANNUAL_CAP_EXCEEDED at priority 44 (category business_fiscal), and both are checked by
          POST /enrollments. An employer whose annual cap is exactly exhausted AND whose listing has
          been suspended violates both, so the response distinguishes an implementation that walks
          the priority list from one that checks funding capacity first (the more natural business
          reading, since cap exhaustion is the "real" blocker).
        distinguishing_aspect: >-
          Pairs the state category against the business_fiscal category. The paired instance pairs
          business_safety against business_temporal - a different error-category pair with no
          overlap in either member.
        test_recipe:
          setup: >-
            Harborview Municipal Services with a DIRECT_BILL policy whose annual_cap_cents is
            exactly 120000, one eligible employee, and two curated listings (A and B) at 30000 per
            credit from the same ACTIVE agreement. A four-credit enrollment on listing A reserves
            exactly 120000, driving cap_available_cents to 0; a control attempt on the still-curated
            listing B then proves the cap rule fires on its own; finally listing A is suspended so
            both rules are live on the same request.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload:
                legal_name: "Harborview Municipal Services"
                benefit_admin_contact_email: "benefits@harborview-muni.example"
                fiscal_year_start_month: 1
              as: PlatformAdmin
              captures: { employer_id: "$.data.id" }
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-01-01"
                effective_to: "2027-01-01"
                min_tenure_months: 0
                min_weekly_hours: 0
                eligible_job_families: ["CORPORATE"]
                annual_cap_cents: 120000
                funding_model: "DIRECT_BILL"
                reimbursement_pct: 1.00
                max_concurrent_credits: 30
                drop_window_days: 7
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /benefit-policies/${policy_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /employers/${employer_id}/employees"
              payload:
                full_name: "Grace Lindqvist"
                work_email: "grace.lindqvist@harborview-muni.example"
                hire_date: "2025-06-01"
                weekly_hours: 40
                job_family: "CORPORATE"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_id: "$.data.id" }
            - call: "POST /schools"
              payload:
                legal_name: "Tidewater State College"
                state_code: "VA"
                contact_email: "partners@tidewater-state.example"
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /schools/${school_id}/programs"
              payload:
                name: "Certificate in Public Administration"
                credential_type: "CERTIFICATE"
                skill_track: "BUSINESS_ADMIN"
                list_tuition_per_credit_cents: 40000
                total_credits: 12
                term_length_weeks: 10
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { program_a_id: "$.data.id" }
            - call: "POST /schools/${school_id}/programs"
              payload:
                name: "Certificate in Civic Data Analytics"
                credential_type: "CERTIFICATE"
                skill_track: "DATA_ANALYTICS"
                list_tuition_per_credit_cents: 40000
                total_credits: 12
                term_length_weeks: 10
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { program_b_id: "$.data.id" }
            - call: "POST /partner-agreements"
              payload:
                school_id: "${school_id}"
                employer_id: "${employer_id}"
                negotiated_discount_pct: 0.25
                direct_bill_enabled: true
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
              as: PlatformAdmin
              captures: { agreement_id: "$.data.id" }
            - call: "POST /partner-agreements/${agreement_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { agreement_version_1: "$.data.version" }
            - call: "POST /catalog-listings"
              payload:
                employer_id: "${employer_id}"
                program_id: "${program_a_id}"
                agreement_id: "${agreement_id}"
                expected_agreement_version: "${agreement_version_1}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { listing_a_id: "$.data.id" }
            - call: "GET /partner-agreements/${agreement_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { agreement_version_2: "$.data.version" }
            - call: "POST /catalog-listings"
              payload:
                employer_id: "${employer_id}"
                program_id: "${program_b_id}"
                agreement_id: "${agreement_id}"
                expected_agreement_version: "${agreement_version_2}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { listing_b_id: "$.data.id" }
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version_1: "$.data.version" }
            - call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_a_id}"
                term_code: "2026-FA"
                term_start_date: "2026-09-01"
                term_end_date: "2026-12-15"
                credits: 4
                expected_employee_version: "${employee_version_1}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { enrollment_1_id: "$.data.id" }
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version_2: "$.data.version", cap_available_after_first: "$.data.cap_available_cents" }
            - call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_b_id}"
                term_code: "2026-WI"
                term_start_date: "2026-12-20"
                term_end_date: "2027-03-20"
                credits: 1
                expected_employee_version: "${employee_version_2}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { cap_only_error_id: "$.data.error_id" }
            - call: "POST /catalog-listings/${listing_a_id}/suspend"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
          trigger: >-
            POST /enrollments for 1 credit of the now-SUSPENDED listing A in term 2026-WI
            (2026-12-20 to 2027-03-20), using expected_employee_version ${employee_version_2}
          assert: >-
            The first enrollment reserves exactly the whole pool (4 credits * 30000 = 120000), so
            the follow-up read shows cap_reserved_cents 120000 and cap_available_cents 0. The
            control attempt on the still-CURATED listing B is rejected with 422 and error_id
            ERR_ANNUAL_CAP_EXCEEDED, proving the priority-44 rule is genuinely live. After
            listing A is suspended, the trigger - which violates the very same cap rule as well as
            the listing-state rule - is rejected with 409 and error_id ERR_LISTING_NOT_CURATED,
            because priority 21 is evaluated before priority 44. No Enrollment row is created by
            either rejected call: GET /enrollments?employee_id=${employee_id} still returns
            total_count 1.

      - name: tenure_shortfall_outranks_concurrent_credit_overlap
        grounds: >-
          §1.4 orders ERR_EMPLOYEE_TENURE_NOT_MET at priority 33 (category business_safety) and
          ERR_CONCURRENT_CREDIT_LIMIT at priority 37 (category business_temporal), and both are
          checked by POST /enrollments. Activating a successor policy that raises
          min_tenure_months to 36 turns a previously eligible employee INELIGIBLE_TENURE while an
          existing six-credit enrollment is still open, so a four-credit request that overlaps that
          enrollment by a single day breaks the 9-credit concurrency ceiling AND the tenure floor at
          once.
        distinguishing_aspect: >-
          Pairs business_safety (a per-employee eligibility floor) against business_temporal (an
          interval-overlap capacity ceiling) - neither category appears in the paired instance,
          which pairs state against business_fiscal.
        test_recipe:
          setup: >-
            Cobalt Grocers Alliance with policy P1 covering [2026-07-01, 2026-09-01) at
            min_tenure_months 6, under which the employee (hired 2025-01-15) enrols for 6 credits in
            term 2026-FA (2026-09-01 to 2026-12-15). Successor policy P2 covering
            [2026-09-01, 2027-09-01) is drafted and activated with min_tenure_months 36 and
            max_concurrent_credits 9; the clock then moves to 2026-09-05, where P2 governs.
          setup_api_calls:
            - *a_clock
            - call: "POST /employers"
              payload:
                legal_name: "Cobalt Grocers Alliance"
                benefit_admin_contact_email: "benefits@cobalt-grocers.example"
                fiscal_year_start_month: 1
              as: PlatformAdmin
              captures: { employer_id: "$.data.id" }
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-07-01"
                effective_to: "2026-09-01"
                min_tenure_months: 6
                min_weekly_hours: 20
                eligible_job_families: ["RETAIL_FRONTLINE", "OPERATIONS"]
                annual_cap_cents: 2000000
                funding_model: "REIMBURSEMENT"
                reimbursement_pct: 0.60
                max_concurrent_credits: 9
                drop_window_days: 14
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_1_id: "$.data.id" }
            - call: "POST /benefit-policies/${policy_1_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - *a_employee
            - *a_school
            - *a_program
            - *a_agreement
            - *a_activate_agreement
            - *a_listing
            - *a_read_employee
            - call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_id}"
                term_code: "2026-FA"
                term_start_date: "2026-09-01"
                term_end_date: "2026-12-15"
                credits: 6
                expected_employee_version: "${employee_version}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { enrollment_1_id: "$.data.id", reserved_1_cents: "$.data.employer_reserved_cents" }
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-09-01"
                effective_to: "2027-09-01"
                min_tenure_months: 36
                min_weekly_hours: 20
                eligible_job_families: ["RETAIL_FRONTLINE", "OPERATIONS"]
                annual_cap_cents: 2000000
                funding_model: "REIMBURSEMENT"
                reimbursement_pct: 0.60
                max_concurrent_credits: 9
                drop_window_days: 14
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_2_id: "$.data.id" }
            - call: "POST /benefit-policies/${policy_2_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version_2: "$.data.version", eligibility_under_p2: "$.data.eligibility_status" }
          trigger: >-
            POST /enrollments for 4 credits of the same listing in term 2026-WI
            (2026-12-15 to 2027-03-30), which shares exactly one day with the open 6-credit
            enrollment, using expected_employee_version ${employee_version_2}
          assert: >-
            Under P1 the first enrollment succeeded with gross_tuition_cents 184512 (30752 * 6) and
            employer_reserved_cents 110707 (round_half_up(184512 * 0.60) = 110707.2 -> 110707), and
            its policy_id is ${policy_1_id} (pinned at creation, not repointed when P2 activates).
            Both policies are ACTIVE with adjacent half-open windows, so activating P2 does not
            raise ERR_POLICY_PERIOD_OVERLAP. After the clock moves to 2026-09-05 the employee reads
            eligibility_status INELIGIBLE_TENURE (tenure_months 19 < 36 under the now-governing P2).
            The trigger violates priority 33 and priority 37 simultaneously - the requested term
            [2026-12-15, 2027-03-30] shares the closed-interval endpoint 2026-12-15 with
            [2026-09-01, 2026-12-15], so 6 + 4 = 10 credits exceed max_concurrent_credits 9 - and
            the response is 422 with error_id ERR_EMPLOYEE_TENURE_NOT_MET, not
            ERR_CONCURRENT_CREDIT_LIMIT (also 422). (The isolated priority-37 control lives in
            employee_concurrent_credit_ceiling_counts_shared_end_day.) No second Enrollment is
            created and cap_reserved_cents stays 110707.

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: section_127_exclusion_limit_at_limit_versus_first_cent_beyond
        grounds: >-
          §1.4 tax_exclusion_split caps annual exclusion at TAX_EXCLUSION_LIMIT_CENTS 525000, with
          everything above the remaining room becoming imputed income. A first disbursement of
          exactly 525000 must produce excluded_cents 525000 and imputed_income_cents 0 (an
          off-by-one comparison using > instead of >= flips this), and the very next disbursement -
          made when remaining room is exactly 0 - must be imputed in full.
        distinguishing_aspect: >-
          Metric: the annual §127 exclusion ceiling in cents, probed through
          POST /tuition-invoices/{id}/pay. The paired instance probes a completely different
          metric - the zero-denominator boundary of the utilization rates - through
          GET /employers/{id}/utilization-report.
        test_recipe:
          setup: >-
            The Beacon fixture: a DIRECT_BILL employer with a 1000000 cap and a 52500-per-credit
            listing. Enrollment E1 takes 10 credits for exactly 525000 cents and its invoice is
            approved and paid, landing exactly on the exclusion limit; enrollment E2 takes 1 credit
            for 52500 cents and its invoice is approved but not yet paid.
          setup_api_calls:
            - *b_clock
            - *b_employer
            - *b_policy
            - *b_activate_policy
            - *b_employee
            - *b_school
            - *b_program
            - *b_agreement
            - *b_activate_agreement
            - *b_listing
            - *b_read_emp1
            - *b_enroll1
            - *b_confirm1
            - *b_invoices1
            - *b_approve1
            - *b_pay1
            - *b_read_emp2
            - *b_enroll2
            - *b_confirm2
            - *b_invoices2
            - *b_approve2
          trigger: "POST /tuition-invoices/${invoice_2_id}/pay"
          assert: >-
            At the limit: after paying invoice 1 the BENEFIT TaxLedgerEntry for
            ${enrollment_1_id} has benefit_cents 525000, excluded_cents 525000 and
            imputed_income_cents 0 (525000 is not above the 525000 ceiling), and
            GET /employees/${employee_id} shows taxable_excluded_cents_ytd 525000,
            imputed_income_cents_ytd 0 and cap_available_cents 422500
            (1000000 - 52500 reserved - 525000 disbursed).
            One cent of room beyond: the trigger's disbursement of 52500 finds remaining room
            max(0, 525000 - 525000) = 0, so the new BENEFIT entry has benefit_cents 52500,
            excluded_cents 0 and imputed_income_cents 52500, and the employee then reads
            taxable_excluded_cents_ytd 525000, imputed_income_cents_ytd 52500,
            cap_disbursed_cents 577500 and cap_available_cents 422500 (the reserve simply converted
            to a disbursement). GET /employers/${employer_id} shows total_disbursed_cents 577500
            and total_imputed_income_cents 52500, and
            GET /tax-ledger-entries?employee_id=${employee_id}&tax_year=2026 returns total_count 2.

      - name: utilization_report_zero_denominator_boundaries
        grounds: >-
          §1.4 employer_utilization_report short-circuits three separate quotients to 0.0 when
          their denominator is empty (eligible_employee_count, closed enrollments,
          participating_employee_count) and cost_per_completion_cents to 0 when there are no
          completions. The same endpoint must therefore return 0.0/0 - never an error and never
          null - at three successive population sizes, and must jump to exactly 1.0 the moment a
          denominator becomes 1 while a different quotient is still empty.
        distinguishing_aspect: >-
          Metric: the zero-denominator boundary of the four utilization quotients, probed through
          GET /employers/{id}/utilization-report. The paired instance probes the §127 cent ceiling
          through POST /tuition-invoices/{id}/pay - a different metric on a different endpoint.
        test_recipe:
          setup: >-
            The Beacon employer with its ACTIVE DIRECT_BILL policy, read three times: with no
            employees at all, with one eligible employee and no enrollments, and finally with one
            REGISTERED 10-credit enrollment that has neither closed nor disbursed anything.
          setup_api_calls:
            - *b_clock
            - *b_employer
            - *b_policy
            - *b_activate_policy
            - call: "GET /employers/${employer_id}/utilization-report"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { empty_participation_rate: "$.data.participation_rate", empty_eligible_count: "$.data.eligible_employee_count" }
            - *b_employee
            - call: "GET /employers/${employer_id}/utilization-report"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { staffed_participation_rate: "$.data.participation_rate" }
            - *b_school
            - *b_program
            - *b_agreement
            - *b_activate_agreement
            - *b_listing
            - *b_read_emp1
            - *b_enroll1
          trigger: "GET /employers/${employer_id}/utilization-report a third time"
          assert: >-
            Phase 1 (no employees) returns 200 with plan_year 2026, eligible_employee_count 0,
            participating_employee_count 0, participation_rate 0.0, completion_rate 0.0,
            retention_rate 0.0, skill_attainment_count 0, total_employer_disbursed_cents 0,
            total_imputed_income_cents 0 and cost_per_completion_cents 0 - all four quotients
            short-circuited rather than dividing by zero.
            Phase 2 (one eligible employee, no enrollments) returns eligible_employee_count 1,
            participating_employee_count 0 and participation_rate 0.0 (a live denominator with an
            empty numerator), with completion_rate and retention_rate still 0.0 because their own
            denominators are empty.
            Phase 3 (the trigger, one REGISTERED enrollment) returns eligible_employee_count 1,
            participating_employee_count 1, participation_rate 1.0 and retention_rate 1.0, while
            completion_rate stays 0.0 because no enrollment has reached a terminal academic_status,
            skill_attainment_count is 0, total_employer_disbursed_cents is 0 (the enrollment is
            RESERVED, not SETTLED) and cost_per_completion_cents is 0 - so a naive
            "closed = scope" implementation that reports completion_rate 0.0 by luck in phase 1 is
            caught here by the still-zero completion_rate against a participation_rate of 1.0.

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: catalog_listing_creation_gated_by_partner_agreement_lifecycle
        grounds: >-
          §1.4 priority 29 makes POST /catalog-listings legal only while the referenced
          PartnerAgreement has status == ACTIVE, and §1.2 PartnerAgreement.terminate cascades into
          suspending the listings it produced. The listing entity therefore has no independent
          existence rule: the identical request body succeeds or fails purely on the state of a
          different entity, and it must fail on BOTH sides of ACTIVE (before activation and after
          termination), which a naive "agreement exists" check cannot reproduce.
        distinguishing_aspect: >-
          Entity pair CatalogListing -> PartnerAgreement (a curation record depending on a
          commercial contract's lifecycle). The paired instance uses the entity pair
          ReimbursementClaim -> Enrollment/AcademicOutcome, sharing neither member.
        test_recipe:
          setup: >-
            One employer, one school with two programs, and one PartnerAgreement that starts in
            PENDING. A listing is attempted while PENDING, the agreement is then activated and the
            same listing succeeds, and finally the agreement is terminated.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload:
                legal_name: "Meridian Freight Lines"
                benefit_admin_contact_email: "benefits@meridian-freight.example"
                fiscal_year_start_month: 1
              as: PlatformAdmin
              captures: { employer_id: "$.data.id" }
            - call: "POST /schools"
              payload:
                legal_name: "Great Lakes Institute"
                state_code: "MI"
                contact_email: "partners@greatlakes-inst.example"
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /schools/${school_id}/programs"
              payload:
                name: "Associate of Logistics Technology"
                credential_type: "ASSOCIATE"
                skill_track: "SUPPLY_CHAIN"
                list_tuition_per_credit_cents: 36000
                total_credits: 60
                term_length_weeks: 15
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { program_a_id: "$.data.id" }
            - call: "POST /schools/${school_id}/programs"
              payload:
                name: "Certificate in Fleet Data Systems"
                credential_type: "CERTIFICATE"
                skill_track: "DATA_ANALYTICS"
                list_tuition_per_credit_cents: 36000
                total_credits: 12
                term_length_weeks: 10
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { program_b_id: "$.data.id" }
            - call: "POST /partner-agreements"
              payload:
                school_id: "${school_id}"
                employer_id: "${employer_id}"
                negotiated_discount_pct: 0.25
                direct_bill_enabled: true
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
              as: PlatformAdmin
              captures: { agreement_id: "$.data.id", agreement_version_pending: "$.data.version" }
            - call: "POST /catalog-listings"
              payload:
                employer_id: "${employer_id}"
                program_id: "${program_a_id}"
                agreement_id: "${agreement_id}"
                expected_agreement_version: "${agreement_version_pending}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { pending_error_id: "$.data.error_id" }
            - call: "POST /partner-agreements/${agreement_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { agreement_version_active: "$.data.version" }
            - call: "POST /catalog-listings"
              payload:
                employer_id: "${employer_id}"
                program_id: "${program_a_id}"
                agreement_id: "${agreement_id}"
                expected_agreement_version: "${agreement_version_active}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { listing_a_id: "$.data.id", listing_a_rate: "$.data.negotiated_tuition_per_credit_cents" }
            - call: "POST /partner-agreements/${agreement_id}/terminate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { agreement_version_terminated: "$.data.version" }
          trigger: >-
            POST /catalog-listings for program B against the now-TERMINATED agreement, using
            expected_agreement_version ${agreement_version_terminated}
          assert: >-
            While the agreement is PENDING the listing request is rejected with 409 and error_id
            ERR_AGREEMENT_NOT_ACTIVE, and GET /catalog-listings?employer_id=${employer_id} returns
            total_count 0. After POST /partner-agreements/{id}/activate the byte-identical body
            succeeds with 201, approval_source CATALOG, status CURATED and
            negotiated_tuition_per_credit_cents 27000 (36000 * 0.75). Termination flips the
            agreement to TERMINATED with terminated_on 2026-08-01 and cascades into listing A, which
            GET /catalog-listings/${listing_a_id} now reports as status SUSPENDED. The trigger -
            differing from the successful call only in program_id - is rejected with 409 and
            error_id ERR_AGREEMENT_NOT_ACTIVE, so GET /catalog-listings?employer_id=${employer_id}
            still returns total_count 1. The same body therefore fails, succeeds and fails again
            purely as a function of the other entity's state.

      - name: reimbursement_claim_gated_by_enrollment_outcome_state
        grounds: >-
          §1.4 priority 23 requires Enrollment.academic_status == PASSED before a
          ReimbursementClaim may be filed, and priority 30 additionally requires the enrollment's
          latest AcademicOutcome to be PASSED with grade_points >= policy.min_passing_grade_points.
          The claim's admissibility is thus a function of two other entities' states, and the
          grade floor is enforced when the outcome is posted, so a sub-threshold "PASSED" outcome
          can never exist to open the claim path.
        distinguishing_aspect: >-
          Entity pair ReimbursementClaim -> Enrollment/AcademicOutcome (a money request depending
          on an academic result). The paired instance uses CatalogListing -> PartnerAgreement, a
          disjoint pair, and gates on a contract lifecycle rather than on a graded outcome.
        test_recipe:
          setup: >-
            The Northwind fixture with a confirmed 3-credit reimbursement enrollment
            (min_passing_grade_points defaults to 2.00). A claim is attempted while the enrollment
            is still IN_PROGRESS, then a PASSED outcome with grade_points 1.80 is attempted, and
            finally a PASSED outcome with grade_points 2.50 is posted.
          setup_api_calls:
            - *a_clock
            - *a_employer
            - *a_policy
            - *a_activate_policy
            - *a_employee
            - *a_school
            - *a_program
            - *a_agreement
            - *a_activate_agreement
            - *a_listing
            - *a_read_employee
            - *a_enroll3
            - *a_confirm3
            - call: "POST /enrollments/${enrollment_id}/reimbursement-claims"
              payload:
                amount_requested_cents: 92256
                receipt_reference: "CSU-2026FA-DOKAFOR-EARLY"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { in_progress_error_id: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enrollments/${enrollment_id}/academic-outcomes"
              payload:
                term_code: "2026-FA"
                completion_status: "PASSED"
                credits_earned: 3
                grade_points: 1.80
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { sub_threshold_error_id: "$.data.error_id" }
            - call: "POST /enrollments/${enrollment_id}/academic-outcomes"
              payload:
                term_code: "2026-FA"
                completion_status: "PASSED"
                credits_earned: 3
                grade_points: 2.50
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { outcome_id: "$.data.id" }
          trigger: >-
            POST /enrollments/${enrollment_id}/reimbursement-claims for
            amount_requested_cents 92256
          assert: >-
            While the enrollment is IN_PROGRESS the claim is rejected with 409 and error_id
            ERR_ENROLLMENT_INVALID_ACADEMIC_STATE, and
            GET /enrollments/${enrollment_id}/reimbursement-claims returns total_count 0. The
            sub-threshold outcome (PASSED with grade_points 1.80 < min_passing_grade_points 2.00)
            is rejected with 422 and error_id ERR_ACADEMIC_PROGRESS_NOT_MET, and
            GET /enrollments/${enrollment_id}/academic-outcomes still returns total_count 0 while
            academic_status stays IN_PROGRESS. Posting PASSED with grade_points 2.50 returns 201
            and flips academic_status to PASSED with credits_earned 3 (funding_status stays
            RESERVED). Only then does the trigger succeed with 201, status SUBMITTED and
            amount_requested_cents 92256; approving it would pay 55354 rather than 64579 because
            2.50 < GRADE_BONUS_MIN_POINTS 3.50, showing the counterpart outcome drives both
            admissibility and amount.

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: benefit_policy_half_open_windows_allow_adjacency_reject_one_day_overlap
        grounds: >-
          §1.4 priority 36 defines the policy timeline with HALF-OPEN intervals
          [effective_from, effective_to) and states explicitly that touching endpoints
          (a.effective_to == b.effective_from) do not intersect. A successor policy starting on the
          incumbent's effective_to must therefore activate, while one starting a single day earlier
          must be rejected - an implementation using closed intervals fails the first case and one
          using strict inequality on dates fails the second.
        distinguishing_aspect: >-
          Interval semantics: HALF-OPEN windows with mutual exclusion (at most one policy may cover
          any instant), on the BenefitPolicy resource. The paired instance uses CLOSED intervals
          with an AGGREGATE capacity ceiling (several intervals may overlap until their credit sum
          exceeds a limit) on the Employee resource - different semantics, different entity.
        test_recipe:
          setup: >-
            Northwind Retail Group with policy P1 ACTIVE over [2026-07-01, 2027-07-01), plus two
            further drafts: P2 over [2027-07-01, 2028-07-01), which begins exactly where P1 ends,
            and P3 over [2027-06-30, 2027-07-01), which overlaps P1's final day.
          setup_api_calls:
            - *a_clock
            - *a_employer
            - *a_policy
            - *a_activate_policy
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2027-07-01"
                effective_to: "2028-07-01"
                min_tenure_months: 6
                min_weekly_hours: 20
                eligible_job_families: ["RETAIL_FRONTLINE", "OPERATIONS"]
                annual_cap_cents: 650000
                funding_model: "REIMBURSEMENT"
                reimbursement_pct: 0.60
                max_concurrent_credits: 9
                drop_window_days: 14
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_2_id: "$.data.id" }
            - call: "POST /benefit-policies/${policy_2_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_2_status: "$.data.status" }
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2027-06-30"
                effective_to: "2027-07-01"
                min_tenure_months: 6
                min_weekly_hours: 20
                eligible_job_families: ["RETAIL_FRONTLINE"]
                annual_cap_cents: 100000
                funding_model: "REIMBURSEMENT"
                reimbursement_pct: 0.60
                max_concurrent_credits: 9
                drop_window_days: 14
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_3_id: "$.data.id" }
          trigger: "POST /benefit-policies/${policy_3_id}/activate"
          assert: >-
            P2 activates with 200 and status ACTIVE even though its effective_from 2027-07-01 equals
            P1's effective_to, because [2026-07-01, 2027-07-01) and [2027-07-01, 2028-07-01) share no
            instant; GET /employers/${employer_id}/benefit-policies?status=ACTIVE then returns
            total_count 2. The trigger is rejected with 409 and error_id ERR_POLICY_PERIOD_OVERLAP
            because [2027-06-30, 2027-07-01) intersects P1 on the single day 2027-06-30 - even
            though it merely touches P2 at 2027-07-01. Afterwards
            GET /employers/${employer_id}/benefit-policies?status=DRAFT returns total_count 1
            (P3 is still DRAFT) and the ACTIVE list is still total_count 2.

      - name: employee_concurrent_credit_ceiling_counts_shared_end_day
        grounds: >-
          §1.4 priority 37 defines enrollment terms as CLOSED intervals
          [term_start_date, term_end_date] where "a single shared day counts as an intersection",
          and caps the SUM of credits over intersecting enrollments at
          policy.max_concurrent_credits (9). Two enrollments of 6 and 4 credits are each
          individually legal, so only the aggregate over the overlap set can reject the second, and
          the overlap in question is exactly one day.
        distinguishing_aspect: >-
          Interval semantics: CLOSED intervals with an AGGREGATE capacity ceiling that tolerates
          overlap up to a credit sum, on the Employee resource. The paired instance uses HALF-OPEN
          intervals with strict mutual exclusion on the BenefitPolicy resource.
        test_recipe:
          setup: >-
            The Northwind fixture (max_concurrent_credits 9). A 6-credit enrollment occupies
            [2026-09-01, 2026-12-15]; a 4-credit request for [2026-12-15, 2027-03-30] is then
            attempted, sharing exactly the day 2026-12-15.
          setup_api_calls:
            - *a_clock
            - *a_employer
            - *a_policy
            - *a_activate_policy
            - *a_employee
            - *a_school
            - *a_program
            - *a_agreement
            - *a_activate_agreement
            - *a_listing
            - *a_read_employee
            - call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_id}"
                term_code: "2026-FA"
                term_start_date: "2026-09-01"
                term_end_date: "2026-12-15"
                credits: 6
                expected_employee_version: "${employee_version}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { enrollment_1_id: "$.data.id" }
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version_2: "$.data.version" }
            - call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_id}"
                term_code: "2026-WI"
                term_start_date: "2026-12-15"
                term_end_date: "2027-03-30"
                credits: 4
                expected_employee_version: "${employee_version_2}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { overlap_error_id: "$.data.error_id" }
          trigger: >-
            POST /enrollments for the same 4 credits shifted one day later, term_start_date
            2026-12-16 and term_end_date 2027-03-30, using expected_employee_version
            ${employee_version_2}
          assert: >-
            The first enrollment succeeds with credits 6, gross_tuition_cents 184512 and
            employer_reserved_cents 110707. The 2026-12-15 request is rejected with 422 and
            error_id ERR_CONCURRENT_CREDIT_LIMIT because the closed intervals
            [2026-09-01, 2026-12-15] and [2026-12-15, 2027-03-30] share the day 2026-12-15, making
            the concurrent sum 6 + 4 = 10 > 9; 4 credits alone would have been legal, so only the
            aggregate can explain the rejection. The trigger, identical except that its interval
            starts at 2026-12-16 and therefore intersects nothing, succeeds with 201,
            gross_tuition_cents 123008 (30752 * 4) and employer_reserved_cents 73805
            (round_half_up(123008 * 0.60) = 73804.8 -> 73805);
            GET /enrollments?employee_id=${employee_id} then returns total_count 2 and
            GET /employees/${employee_id} shows cap_reserved_cents 184512 (110707 + 73805) and
            cap_available_cents 415488.

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: annual_cap_pool_identity_restored_exactly_by_in_window_withdrawal
        grounds: >-
          §1.4 annual_cap_ledger pins the conserved identity
          annual_cap_cents == cap_available_cents + cap_reserved_cents + cap_disbursed_cents
          + cap_clawback_hold_cents, and §1.2 makes a withdrawal on or before drop_deadline_date
          move funding_status RESERVED -> RELEASED with the reserve excluded from the ledger. The
          withdrawal is therefore a pure compensation: the pool must return to its exact
          pre-enrollment composition, with no residue in any of the four buckets and no
          RepaymentObligation.
        distinguishing_aspect: >-
          Conserved quantity: the four-bucket annual cap pool
          (cap = available + reserved + disbursed + clawback_hold), measured on the Employee. The
          paired instance conserves a per-obligation money identity
          (principal = paid + waived + balance), a different quantity on a different entity.
        test_recipe:
          setup: >-
            The Northwind fixture with a 3-credit enrollment created on 2026-08-01, giving
            drop_deadline_date 2026-09-15; the clock is then advanced to 2026-09-10, still inside
            the 14-day drop window.
          setup_api_calls:
            - *a_clock
            - *a_employer
            - *a_policy
            - *a_activate_policy
            - *a_employee
            - *a_school
            - *a_program
            - *a_agreement
            - *a_activate_agreement
            - *a_listing
            - *a_read_employee
            - *a_enroll3
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { available_after_reserve: "$.data.cap_available_cents", reserved_after_reserve: "$.data.cap_reserved_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger: "POST /enrollments/${enrollment_id}/withdraw"
          assert: >-
            The identity holds at all three observation points with annual_cap_cents 600000:
            before the enrollment 600000 == 600000 + 0 + 0 + 0; after it
            600000 == 544646 + 55354 + 0 + 0 (the reserve is round_half_up(92256 * 0.60) = 55354);
            after the trigger 600000 == 600000 + 0 + 0 + 0 again - cap_available_cents is exactly
            600000, not 599999 or 600001, so no rounding residue survives the round trip. The
            withdrawn enrollment reads academic_status WITHDRAWN, funding_status RELEASED,
            employer_reserved_cents 55354 retained for audit, employer_disbursed_cents 0 and
            employee_share_cents 92256; GET /enrollments/${enrollment_id}/academic-outcomes returns
            total_count 1 with completion_status WITHDRAWN, grade_points null, credits_earned 0 and
            posted_by_role SYSTEM; GET /enrollments/${enrollment_id}/repayment-obligations returns
            total_count 0 (2026-09-10 <= drop_deadline_date 2026-09-15) and
            GET /tax-ledger-entries?enrollment_id=${enrollment_id} returns total_count 0 - nothing
            was ever disbursed, so there is nothing to reverse.

      - name: repayment_obligation_principal_conserved_across_partial_payment_and_waiver
        grounds: >-
          §1.4 repayment_assessment pins the per-obligation identity
          principal_cents == paid_cents + waived_cents + balance_cents, and §1.2 splits the two ways
          of discharging a balance: a payment increases paid_cents (and, when the balance reaches
          zero, releases the cap clawback hold) while a waiver moves the remaining balance into
          waived_cents and deliberately KEEPS the hold. Both discharge paths must preserve the
          identity exactly, and the prorated principal 69333 is odd enough that any drift shows up.
        distinguishing_aspect: >-
          Conserved quantity: the per-obligation money identity
          (principal = paid + waived + balance) on RepaymentObligation, whose two compensating paths
          differ in their cap-hold treatment. The paired instance conserves the employee-level
          four-bucket annual cap pool - a different quantity on a different entity.
        test_recipe:
          setup: >-
            The Lakeshore fixture through the 2026-09-01 termination, which leaves one
            EARLY_DEPARTURE obligation with principal_cents 69333 in status ASSESSED and
            cap_clawback_hold_cents 104000. A partial payment of 20000 cents is then made.
          setup_api_calls:
            - *c_clock
            - *c_employer
            - *c_policy
            - *c_activate_policy
            - *c_employee
            - *c_school
            - *c_program
            - *c_agreement
            - *c_activate_agreement
            - *c_listing
            - *c_read_employee
            - *c_enroll
            - *c_confirm
            - *c_clock_settle
            - *c_outcome
            - *c_claim
            - *c_decide
            - *c_clock_terminate
            - call: "PATCH /employees/${employee_id}"
              payload: { employment_status: "TERMINATED", termination_date: "2026-09-01" }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "GET /enrollments/${enrollment_id}/repayment-obligations"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { obligation_id: "$.data[0].id", assessed_principal: "$.data[0].principal_cents" }
            - call: "POST /repayment-obligations/${obligation_id}/payments"
              payload: { amount_cents: 20000 }
              as: Employee
              as_user_id: "${employee_id}"
              captures: { balance_after_payment: "$.data.balance_cents" }
          trigger: "POST /repayment-obligations/${obligation_id}/waive"
          assert: >-
            The identity principal_cents == paid_cents + waived_cents + balance_cents holds at
            every step with principal_cents 69333 (round_half_up(104000 * 8 / 12)): at assessment
            69333 == 0 + 0 + 69333 with status ASSESSED; after the 20000 payment
            69333 == 20000 + 0 + 49333 with status PARTIALLY_PAID and
            Employee.open_repayment_balance_cents 49333, while cap_clawback_hold_cents stays 104000
            and cap_available_cents stays 696000 because a balance remains; after the trigger
            69333 == 20000 + 49333 + 0 with status WAIVED, balance_cents 0 and
            Employee.open_repayment_balance_cents 0. The waiver path is the compensating one that
            does NOT restore capacity: cap_clawback_hold_cents remains 104000 and
            cap_available_cents remains 696000 (a full payment would instead have released the hold
            and raised cap_available_cents to 800000). The tax ledger is untouched by both
            discharge paths - GET /tax-ledger-entries?employee_id=${employee_id}&tax_year=2026
            still returns total_count 2 and taxable_excluded_cents_ytd is still 34667.
