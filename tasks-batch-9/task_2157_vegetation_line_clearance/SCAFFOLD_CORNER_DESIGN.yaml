            - call: "POST /vm/customer-notifications/${cn_id}/respond"
              payload: { response: "REFUSED" }
              as: CustomerAdvocate
            - call: "POST /vm/customer-notifications/${cn_id}/escalate"
              payload: {}
              as: CustomerAdvocate
          trigger:
            - call: "POST /vm/customer-notifications/${cn_id}/finalize-refusal"
              payload: {}
              as: CustomerAdvocate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_UNAUTHORIZED"
            - "CustomerNotification.${cn_id}.status == ESCALATED"
            - "CustomerNotification.${cn_id}.refusal_round == 2"
            - "WorkOrder.${wo_id}.refusal_blocked_unit_count == 0"

      - name: corner_missing_auth_header_returns_unauthenticated
        claim_type: peer_roles
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "A request that carries neither X-User-Role nor X-User-ID returns 401 ERR_UNAUTHENTICATED, ahead of the 404 the unknown circuit id would otherwise produce."
        test_recipe:
          setup:
            - "Empty database; the request deliberately omits both auth headers."
          setup_api_calls:
            []
          trigger:
            - call: "GET /vm/circuits/00000000-0000-4000-8000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "error_id == ERR_UNAUTHENTICATED"
            - "error_id != ERR_CIRCUIT_NOT_FOUND"


