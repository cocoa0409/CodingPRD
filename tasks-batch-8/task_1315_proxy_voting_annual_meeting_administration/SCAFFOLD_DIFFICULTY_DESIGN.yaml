              payload: { to_iso8601: "2026-09-15T16:00:00Z" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/convene"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/conclude"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-challenges"
              payload: { meeting_id: "${m_id}", vote_instruction_id: "${v1_id}", reason: "Chain-of-custody question" }
              as: InspectorOfElection
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /proxy/inspector-certifications"
              payload: { meeting_id: "${m_id}" }
              as: InspectorOfElection
              as_user_id: "insp-1"
              captures: { blocked_err: $.data.error_id }
            - call: "POST /proxy/vote-challenges/${ch_id}/adjudicate"
              payload: { ruling: "OVERRULED", resolution_note: "Chain of custody intact" }
              as: InspectorOfElection
            - call: "POST /proxy/inspector-certifications"
              payload: { meeting_id: "${m_id}" }
              as: InspectorOfElection
              as_user_id: "insp-1"
              captures: { cert_id: $.data.id, cert_status: $.data.status, cert_quorum: $.data.final_quorum_met }
          assert:
            - "while challenge OPEN: error_id == ERR_UNRESOLVED_CHALLENGES"
            - "after OVERRULED adjudication: creation succeeds, status == DRAFT, final_quorum_met == true"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: platform_session_half_open_overlap_adjacency_allowed
        grounds:
          - entities.MeetingPlatformSession.fields.start_at
          - entities.MeetingPlatformSession.fields.end_at
          - errors[ERR_SESSION_OVERLAP]
        distinguishing_aspect: |
          Resource: the meeting's virtual platform. Interval semantics: half-open
          [start_at, end_at) — a session ending at 14:00 and another starting at 14:00 do
          NOT collide, but a session starting at 14:30 while one runs until 15:00 does.
        test_recipe:
          setup:
            - "VIRTUAL meeting exists (mode VIRTUAL makes sessions bookable)"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Omicron AB", ticker: "OMI", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /proxy/platform-sessions"
              payload: { meeting_id: "${m_id}", session_type: "LIVE", start_at: "2026-09-15T14:00:00Z", end_at: "2026-09-15T15:00:00Z" }
              as: ProxyAdministrator
              captures: { s1_id: $.data.id }
            - call: "POST /proxy/platform-sessions"
              payload: { meeting_id: "${m_id}", session_type: "REHEARSAL", start_at: "2026-09-15T13:00:00Z", end_at: "2026-09-15T14:00:00Z" }
              as: ProxyAdministrator
              captures: { s2_id: $.data.id }
            - call: "POST /proxy/platform-sessions"
              payload: { meeting_id: "${m_id}", session_type: "REHEARSAL", start_at: "2026-09-15T14:30:00Z", end_at: "2026-09-15T15:30:00Z" }
              as: ProxyAdministrator
              captures: { overlap_err: $.data.error_id }
          assert:
            - "session 14:00-15:00 created (201)"
            - "adjacent session 13:00-14:00 created (201) — touching endpoints allowed under half-open semantics"
            - "overlapping session 14:30-15:30 rejected with error_id == ERR_SESSION_OVERLAP"

      - name: solicitation_campaign_buffer_gap_required
        grounds:
          - entities.SolicitationCampaign.fields.soliciting_party
          - entities.SolicitationCampaign.fields.start_at
          - errors[ERR_CAMPAIGN_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource: the meeting's shareholder contact list. Different interval semantics from
          the session instance: same-party campaign windows are closed intervals with a
          mandatory 24-hour buffer — a second campaign by the same party starting 8h after
          the first ends is rejected, and even touching (gap == 0) is disallowed; only a
          gap >= 24h passes. Different parties may overlap freely.
        test_recipe:
          setup:
            - "CONTESTED meeting exists"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Pi BV", ticker: "PI", meeting_type: "CONTESTED", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /proxy/solicitation-campaigns"
              payload: { meeting_id: "${m_id}", soliciting_party: "dissident", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T12:00:00Z" }
              as: ProxyAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /proxy/solicitation-campaigns"
              payload: { meeting_id: "${m_id}", soliciting_party: "dissident", start_at: "2026-09-01T20:00:00Z", end_at: "2026-09-01T21:00:00Z" }
              as: ProxyAdministrator
              captures: { buffer_err: $.data.error_id }
            - call: "POST /proxy/solicitation-campaigns"
              payload: { meeting_id: "${m_id}", soliciting_party: "issuer", start_at: "2026-09-01T20:00:00Z", end_at: "2026-09-01T21:00:00Z" }
              as: ProxyAdministrator
              captures: { c3_id: $.data.id }
            - call: "POST /proxy/solicitation-campaigns"
              payload: { meeting_id: "${m_id}", soliciting_party: "dissident", start_at: "2026-09-02T12:00:00Z", end_at: "2026-09-02T13:00:00Z" }
              as: ProxyAdministrator
              captures: { c4_id: $.data.id }
          assert:
            - "first dissident campaign created (201)"
            - "same-party campaign with 8h gap rejected: error_id == ERR_CAMPAIGN_WINDOW_OVERLAP"
            - "different-party campaign in the same window created (201)"
            - "same-party campaign with gap exactly 24h created (201) — buffer comparison is >= 24h inclusive"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: revoke_then_identical_revote_restores_tabulation_totals
        grounds:
          - state_machines.VoteInstruction.VALIDATED_to_REVOKED
          - calculations.weighted_tabulation
          - calculations.quorum_calculation
        distinguishing_aspect: |
          Conserved quantity: the proposal's weighted vote totals and the meeting's
          shares_present. Revoke followed by an identical re-vote must leave for_votes and
          shares_present exactly as before the revoke — no drift from the round trip.
        test_recipe:
          setup:
            - "ANNUAL meeting VOTING_OPEN, outstanding_shares 10000, quorum_threshold_pct 0.5"
            - "a1 6000 COMMON has a VALIDATED FOR vote on p1 (for_votes 6000, shares_present 6000)"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Rho SA", ticker: "RHO", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /proxy/vote-instructions/${v1_id}/revoke"
              payload: {}
              as: Shareholder
              as_user_id: "${a1_id}"
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { v2_id: $.data.id, v2_status: $.data.status }
          assert:
            - "GET /proxy/proposals/${p1_id}/tabulation shows for_votes == 6000 (identical to pre-revoke)"
            - "GET /proxy/meetings/${m_id}/quorum?variant=PROVISIONAL shows shares_present == 6000 (identical to pre-revoke)"
            - "v1 status == REVOKED and v2 status == VALIDATED"
            - "GET /proxy/vote-instructions?meeting_id=${m_id}&account_id=${a1_id}&status=VALIDATED returns exactly 1 record"

      - name: preference_roundtrip_regeneration_restores_distribution_set
        grounds:
          - calculations.householding_grouping
          - state_machines.MaterialDistribution.ACTIVE_to_SUPERSEDED
          - entities.ShareholderAccount.fields.delivery_preference
        distinguishing_aspect: |
          Conserved quantity: the set of ACTIVE distribution packages — count and total
          covered shares. A delivery-preference change MAIL-channel -> E_DELIVERY -> back,
          each followed by regeneration, must restore the original householded package set:
          same package count and same covered shares, proving supersede+regenerate is a true
          compensating pair with no package leakage.
        test_recipe:
          setup:
            - "ANNUAL meeting RECORD_DATE_LOCKED; a1 3000 COMMON and a2 2000 COMMON share address_key ADDR-1 with NOTICE_AND_ACCESS; a3 1000 COMMON uses E_DELIVERY"
            - "one proposal exists so generation is allowed"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Sigma plc", ticker: "SIG", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Household A", account_number: "A-1001", share_class: "COMMON", shares_held: 3000, address_key: "ADDR-1", delivery_preference: "NOTICE_AND_ACCESS" }
              as: TransferAgent
              captures: { a1_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Household B", account_number: "A-1002", share_class: "COMMON", shares_held: 2000, address_key: "ADDR-1", delivery_preference: "NOTICE_AND_ACCESS" }
              as: TransferAgent
              captures: { a2_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Solo C", account_number: "A-1003", share_class: "COMMON", shares_held: 1000, delivery_preference: "E_DELIVERY", email: "c@example.com" }
              as: TransferAgent
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
              captures: { gen1_hh_shares: "$.data[0].covered_shares" }
          trigger:
            - call: "PATCH /proxy/shareholder-accounts/${a2_id}"
              payload: { delivery_preference: "E_DELIVERY" }
              as: TransferAgent
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "PATCH /proxy/shareholder-accounts/${a2_id}"
              payload: { delivery_preference: "NOTICE_AND_ACCESS" }
              as: TransferAgent
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
          assert:
            - "first generation: $.data[0].covered_shares == 5000 (household package covers a1+a2) and exactly 2 ACTIVE packages exist (household + a3)"
            - "after a2 -> E_DELIVERY and regeneration: exactly 3 ACTIVE packages exist"
            - "after a2 -> NOTICE_AND_ACCESS and regeneration: exactly 2 ACTIVE packages exist again"
            - "GET /proxy/material-distributions?meeting_id=${m_id}&status=ACTIVE sums covered_shares == 6000, identical to the initial generation (conserved)"
