# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# ACO Attribution & Shared Savings Settlement
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_agreement_period_applies_defaults
        claim_type: defaults
        grounds: ["entities.AgreementPeriod"]
        distinguishing_aspect: "A period created with the five required inputs starts in SETUP with version 1 and server-minted id/created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-E1", aco_name: "E1", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "TWO_SIDED" }, as: AcoAdministrator, captures: { p_id: $.data.id, p_status: $.data.status, p_v: $.data.version } }
          trigger: []
          assert:
            - "p_status == 'SETUP'"
            - "p_v == 1"
            - "p_id is a non-null UUID"

      - name: get_period_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent period id returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /aco/agreement-periods/00000000-0000-4000-8000-000000000000", as: AcoAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_RESOURCE_NOT_FOUND' (HTTP 404)"

      - name: beneficiary_flag_defaults_applied
        claim_type: defaults
        grounds: ["entities.Beneficiary.fields.dual_eligible", "entities.Beneficiary.fields.esrd"]
        distinguishing_aspect: "Omitting dual_eligible/disabled/esrd on create yields false for all three risk flags."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-E2", birth_year: 1985 }, as: AcoAdministrator, captures: { d: $.data.dual_eligible, dis: $.data.disabled, es: $.data.esrd } }
          trigger: []
          assert:
            - "d == false AND dis == false AND es == false"

      - name: data_sharing_election_has_no_version_field
        claim_type: immutability
        grounds: ["entities.DataSharingElection"]
        distinguishing_aspect: "DataSharingElection is common_fields:false — list items expose id and created_at but no version or updated_at (append-only event)."
        test_recipe:
          setup: ["one beneficiary with one OPT_OUT election"]
          setup_api_calls:
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-E3", birth_year: 1975 }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/beneficiaries/${b1}/data-sharing-elections", payload: { direction: "OPT_OUT", effective_date: "2026-02-01" }, as: AcoAdministrator }
          trigger:
            - { call: "GET /aco/beneficiaries/${b1}/data-sharing-elections", as: AcoAdministrator, captures: { el_id: "$.data[0].id", el_dir: "$.data[0].direction" } }
          assert:
            - "el_dir == 'OPT_OUT' AND el_id is non-null"
            - "the election object has NO 'version' and NO 'updated_at' key"

      - name: beneficiary_create_extra_field_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "An unknown request-body field is rejected with ERR_INVALID_REQUEST rather than silently ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-E4", birth_year: 1985, nickname: "x" }, as: AcoAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST' (HTTP 400)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: claim_double_adjudicate_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ClaimLine.RECEIVED_to_ADJUDICATED", "errors[ERR_CLAIM_INVALID_STATE]"]
        distinguishing_aspect: "Adjudicating an already-ADJUDICATED claim fails with ERR_CLAIM_INVALID_STATE; no version bump on failure."
        test_recipe:
          setup: ["OPEN period; one adjudicated claim"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-S1", aco_name: "S1", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-S1", birth_year: 1980 }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", service_date: "2026-03-01", allowed_amount_cents: 5000, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
          trigger:
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CLAIM_INVALID_STATE'"

      - name: claim_voided_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ClaimLine"]
        distinguishing_aspect: "VOIDED is terminal: both adjudicate and void on a VOIDED claim fail with ERR_CLAIM_INVALID_STATE."
        test_recipe:
          setup: ["OPEN period; one claim adjudicated then voided"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-S2", aco_name: "S2", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-S2", birth_year: 1980 }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", service_date: "2026-03-01", allowed_amount_cents: 5000, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c1}/void", payload: { reason: "dup" }, as: ClaimsProcessor }
          trigger:
            - { call: "POST /aco/claims/${c1}/void", payload: { reason: "again" }, as: ClaimsProcessor, captures: { err1: $.data.error_id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == 'ERR_CLAIM_INVALID_STATE' AND err2 == 'ERR_CLAIM_INVALID_STATE'"

      - name: score_review_after_validated_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.QualityScore", "errors[ERR_SCORE_INVALID_STATE]"]
        distinguishing_aspect: "VALIDATED is terminal for the review endpoint: a second review fails with ERR_SCORE_INVALID_STATE."
        test_recipe:
          setup: ["OPEN period; score M1 VALIDATED"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-S3", aco_name: "S3", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/quality-scores", payload: { agreement_period_id: "${p1}", measure_code: "M1", numerator: 3, denominator: 4, max_points: 10 }, as: QualityReporter, as_user_id: "qr-1", captures: { qs1: $.data.id } }
            - { call: "POST /aco/quality-scores/${qs1}/review", payload: { outcome: "VALIDATED" }, as: QualityAuditor, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /aco/quality-scores/${qs1}/review", payload: { outcome: "REJECTED" }, as: QualityAuditor, as_user_id: "qa-1", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_SCORE_INVALID_STATE'"

      - name: appeal_decide_from_rebuttal_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Appeal", "errors[ERR_APPEAL_INVALID_STATE]"]
        distinguishing_aspect: "decide requires UNDER_REVIEW: while the appeal sits in REBUTTAL the officer cannot decide — ERR_APPEAL_INVALID_STATE."
        test_recipe:
          setup: ["locked period with FINAL record; appeal filed and rebutted once (status REBUTTAL)"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-S4", aco_name: "S4", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 10000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-S4", birth_year: 1980 }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator }
            - { call: "POST /aco/agreement-periods/${p1}/lock-assignment", payload: {}, as: AcoAdministrator }
            - { call: "GET /aco/attribution-records?beneficiary_id=${b1}", as: AcoAdministrator, captures: { rec1: "$.data[0].id" } }
            - { call: "POST /aco/appeals", payload: { agreement_period_id: "${p1}", subject_type: "ATTRIBUTION", subject_id: "${rec1}", grounds: "g" }, as: ParticipantRepresentative, as_user_id: "${pa}", captures: { ap1: $.data.id } }
            - { call: "POST /aco/appeals/${ap1}/rebuttals", payload: { memo: "m" }, as: ParticipantRepresentative, as_user_id: "${pa}" }
          trigger:
            - { call: "POST /aco/appeals/${ap1}/decide", payload: { outcome: "UPHELD" }, as: AppealsOfficer, as_user_id: "ao-1", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_APPEAL_INVALID_STATE'  (REBUTTAL must first be resumed to UNDER_REVIEW)"

      - name: benchmark_recreate_supersedes_prior_active
        claim_type: side_effect_execution
        grounds: ["state_machines.Benchmark.ACTIVE_to_SUPERSEDED"]
        distinguishing_aspect: "Creating a second PROVISIONAL benchmark supersedes the first: prior ACTIVE -> SUPERSEDED, only the newest is ACTIVE."
        test_recipe:
          setup: ["locked period with one FINAL attribution record (benchmark inputs in place)"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-S5", aco_name: "S5", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 10000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-S5", birth_year: 1960, dual_eligible: true, disabled: true }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator }
            - { call: "POST /aco/agreement-periods/${p1}/lock-assignment", payload: {}, as: AcoAdministrator }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v2: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/benchmarks", payload: { variant: "PROVISIONAL", expected_agreement_period_version: "${p1_v2}" }, as: AcoAdministrator, captures: { bm1: $.data.id } }
          trigger:
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v3: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/benchmarks", payload: { variant: "PROVISIONAL", expected_agreement_period_version: "${p1_v3}" }, as: AcoAdministrator, captures: { bm2: $.data.id, bm2_status: $.data.status } }
            - { call: "GET /aco/benchmarks/${bm1}", as: AcoAdministrator, captures: { bm1_status: $.data.status } }
          assert:
            - "bm2_status == 'ACTIVE' AND bm1_status == 'SUPERSEDED'"

      - name: distribution_double_approve_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DistributionLine.PENDING_to_APPROVED", "errors[ERR_DISTRIBUTION_INVALID_STATE]"]
        distinguishing_aspect: "Approving an already-APPROVED line fails with ERR_DISTRIBUTION_INVALID_STATE."
        test_recipe:
          setup: ["LITE period: settlement FINAL with one PENDING line, then approved once"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-S6", aco_name: "S6", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 10000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-S6", birth_year: 1960, dual_eligible: true, disabled: true }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator }
            - { call: "POST /aco/agreement-periods/${p1}/lock-assignment", payload: {}, as: AcoAdministrator }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v2: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/benchmarks", payload: { variant: "FINAL", expected_agreement_period_version: "${p1_v2}" }, as: AcoAdministrator }
            - { call: "POST /aco/quality-scores", payload: { agreement_period_id: "${p1}", measure_code: "M1", numerator: 3, denominator: 4, max_points: 10 }, as: QualityReporter, as_user_id: "qr-1", captures: { qs1: $.data.id } }
            - { call: "POST /aco/quality-scores/${qs1}/review", payload: { outcome: "VALIDATED" }, as: QualityAuditor, as_user_id: "qa-1" }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v3: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/settlements", payload: { expected_agreement_period_version: "${p1_v3}" }, as: SettlementActuary, as_user_id: "sa-1", captures: { st1: $.data.id } }
            - { call: "POST /aco/settlements/${st1}/finalize", payload: {}, as: SettlementActuary, as_user_id: "sa-1" }
            - { call: "POST /aco/settlements/${st1}/distribution-runs", payload: {}, as: SettlementActuary, as_user_id: "sa-1" }
            - { call: "GET /aco/distribution-lines?settlement_id=${st1}", as: SettlementActuary, captures: { ln: "$.data[0].id" } }
            - { call: "POST /aco/distribution-lines/${ln}/approve", payload: {}, as: DistributionApprover, as_user_id: "da-1" }
          trigger:
            - { call: "POST /aco/distribution-lines/${ln}/approve", payload: {}, as: DistributionApprover, as_user_id: "da-1", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_DISTRIBUTION_INVALID_STATE'"

      - name: period_double_open_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.AgreementPeriod", "errors[ERR_PERIOD_NOT_OPEN]"]
        distinguishing_aspect: "Opening an already-OPEN period fails with ERR_PERIOD_NOT_OPEN (transition exists only from SETUP)."
        test_recipe:
          setup: ["period already OPEN"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-S7", aco_name: "S7", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
          trigger:
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_PERIOD_NOT_OPEN'"

      - name: lock_assignment_cascades_records_and_runs
        claim_type: side_effect_execution
        grounds: ["state_machines.AgreementPeriod.OPEN_to_ASSIGNMENT_LOCKED"]
        distinguishing_aspect: "lock-assignment cascades down: PROVISIONAL records become FINAL and COMPLETED runs become LOCKED, atomically with the period transition."
        test_recipe:
          setup: ["OPEN period with one RETROSPECTIVE run producing one PROVISIONAL record"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-S8", aco_name: "S8", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 10000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-S8", birth_year: 1980 }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator, captures: { run1: $.data.id } }
            - { call: "GET /aco/attribution-records?alignment_run_id=${run1}", as: AcoAdministrator, captures: { rec_pre: "$.data[0].status" } }
          trigger:
            - { call: "POST /aco/agreement-periods/${p1}/lock-assignment", payload: {}, as: AcoAdministrator, captures: { p_status: $.data.status } }
            - { call: "GET /aco/attribution-records?alignment_run_id=${run1}", as: AcoAdministrator, captures: { rec_post: "$.data[0].status" } }
            - { call: "GET /aco/alignment-runs/${run1}", as: AcoAdministrator, captures: { run_post: $.data.status } }
          assert:
            - "rec_pre == 'PROVISIONAL'"
            - "p_status == 'ASSIGNMENT_LOCKED' AND rec_post == 'FINAL' AND run_post == 'LOCKED'"

      - name: pay_last_line_bubbles_settlement_and_period
        claim_type: side_effect_execution
        grounds: ["state_machines.DistributionLine.APPROVED_to_PAID", "state_machines.Settlement.FINAL_to_SETTLED", "state_machines.AgreementPeriod"]
        distinguishing_aspect: "Bubble-up chain: paying the final outstanding line flips the settlement FINAL -> SETTLED and the period ASSIGNMENT_LOCKED -> SETTLED in the same request scope."
        test_recipe:
          setup: ["LITE period: settlement FINAL, single distribution line APPROVED"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-S9", aco_name: "S9", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 10000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-S9", birth_year: 1960, dual_eligible: true, disabled: true }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator }
            - { call: "POST /aco/agreement-periods/${p1}/lock-assignment", payload: {}, as: AcoAdministrator }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v2: $.data.version } }
