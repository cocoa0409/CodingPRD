            - call: "POST /exhibit-projects/${proj}/artifact-cases"
              payload: { zone_id: "${zone1}", case_code: "C-EARLY", objective_code: "OBJ-STRATA", security_tier: "BASIC", target_rh_pct: 50.0, rh_tolerance_pct: 5.0, target_lux: 100.0, uv_microwatt_per_lumen: 20.0, interior_l_cm: 100.0, interior_w_cm: 50.0, interior_h_cm: 50.0, air_exchanges_per_day: 0.5 }
              as: Curator
              as_user_id: cur-01
              captures: { f3: $.data.error_id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { ph1: $.data.phase }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "INTERPRETIVE" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { f4: $.data.error_id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
