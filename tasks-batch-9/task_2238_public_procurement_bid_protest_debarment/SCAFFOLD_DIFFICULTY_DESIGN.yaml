      - name: bid_responsiveness_and_responsibility_dimensions_advance_independently
        grounds:
          - state_machines.Bid.UNREVIEWED_to_RESPONSIVE
          - state_machines.Bid.NOT_REVIEWED_to_NONRESPONSIBLE
          - state_machines.Bid.NOT_REVIEWED_to_RESPONSIBLE
          - entities.Bid.fields.responsiveness_status
          - entities.Bid.fields.responsibility_status
          - calculations.apparent_low_bidder_selection
        distinguishing_aspect: |
          Non-linearity here is PARALLEL state dimensions on Bid, not a cycle: B4 ends at
          the combined state (RESPONSIVE, NONRESPONSIBLE) — a pair no single linear chain
          could produce — while the apparent low bidder walks from B4 to B5 without B4's
          responsiveness_status ever changing and without the Solicitation leaving
          EVALUATION.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "two Vendors V6 and V7, both ELIGIBLE with debarment_strike_count 0"
            - "one Solicitation S5 with estimated_value_cents 100000000, no addenda, issued by U-OFFICER-1"
            - "Bid B4 from V6 at total_price_cents 100000000 and Bid B5 from V7 at total_price_cents 100000001"
            - "S5 advanced to BIDS_OPENED at 2026-08-27T00:00:00Z, so apparent_low_bid_id is B4 (100000000 < 100000001)"
            - "B4 determined RESPONSIVE by U-OFFICER-1, which also fires the Solicitation BIDS_OPENED to EVALUATION auto-transition"
            - "B5 determined RESPONSIVE by U-OFFICER-1"
