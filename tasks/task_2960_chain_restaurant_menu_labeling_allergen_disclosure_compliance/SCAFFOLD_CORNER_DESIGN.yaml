      - name: recipe_draft_to_analysis_pending_loop_is_cyclic
        claim_type: cyclic
        grounds: [state_machines.Recipe.transitions.ANALYSIS_PENDING_to_DRAFT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / recipe_revision_loop_and_supersede_restore_cycle
          rationale: "That instance drives the DRAFT <-> ANALYSIS_PENDING loop and the APPROVED -> SUPERSEDED -> APPROVED restoration cycle end to end, which is the cyclic-shape claim for Recipe."

      - name: menu_board_dimensions_change_independently
        claim_type: parallel
        grounds: [state_machines.MenuBoard.publication_status, state_machines.MenuBoard.calorie_compliance_status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / menu_board_two_dimensions_advance_independently
          rationale: "That instance asserts the combined state of the two independent MenuBoard state fields after each move, which is exactly the parallel-shape claim."

      - name: permanent_closure_cascades_down_to_boards_and_listings
        claim_type: cascade_down
        grounds: [state_machines.Establishment.transitions.OPERATING_to_PERMANENTLY_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / permanent_closure_cascade_unit_to_board_to_item_to_brand
          rationale: "That instance replays all four hops of the closure cascade - boards WITHDRAWN, listings REMOVED, item de-staled, brand counters and posture recomputed - in created_at ASC order."

      - name: certification_cascades_across_aggregates_to_the_brand
        claim_type: cross_entity
        grounds: [state_machines.Recipe.transitions.ANALYSIS_PENDING_to_APPROVED]
        excluded_because:
          difficulty_instance: transitive_cascade / certification_cascade_recipe_to_item_to_board_to_brand
          rationale: "That instance asserts each hop of the recipe -> item -> listing/board -> brand chain, including the conditional hop that only fires when the item enters RELABEL_REQUIRED."

      - name: penalty_assessment_syncs_the_establishment_and_jurisdiction_ledgers
        claim_type: ledger_sync
        grounds: [state_machines.EnforcementAction.transitions.ESCALATED_to_PENALTY_ASSESSED]
        excluded_because:
          difficulty_instance: compensating_invariant / rescind_penalty_restores_both_money_ledgers_exactly
          rationale: "That instance asserts both ancestor ledgers before and after the assessment and again after the rescission, reconciling them to exact cent values."

      - name: withdrawal_compensates_every_certification_side_effect
        claim_type: compensation
        grounds: [state_machines.Recipe.transitions.APPROVED_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: compensating_invariant / withdraw_certification_restores_the_reprint_obligation_ledger
          rationale: "That instance replays all four compensation hops and asserts no drift, including that reprint_count is NOT incremented."

      - name: board_publication_is_a_guarded_transition_on_another_aggregate
        claim_type: guarded_transitions
        grounds: [state_machines.MenuBoard.publication_status.transitions.DRAFT_to_PUBLISHED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / board_publication_gated_on_disclosure_packet_status
          rationale: "That instance shows the same publish call failing and then succeeding purely because a DisclosurePacket on another aggregate changed state."

