              captures: { r3_id: $.data.id }
          assert:
            - "after trigger[0]: HTTP status == 409"
            - "after trigger[0]: error_id == ERR_DUPLICATE_INSPECTION_WINDOW"
            - "after trigger[1]: HTTP status == 409"
