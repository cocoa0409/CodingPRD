            - "Exchange.${ex_id}.compliance_posture == IDENTIFIED"

      - name: empty_candidate_set_finalize_rejected
        grounds:
          - state_machines.Identification.DRAFT_to_FINALIZED
          - calculations.aggregate_identified_fmv
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint/metric: finalizing an identification
