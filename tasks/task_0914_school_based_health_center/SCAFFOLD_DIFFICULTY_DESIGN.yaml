            - "Five VALID doses on file: HEPB 1 on 2025-09-01, HEPB 2 on 2025-09-25, HEPB 3 on 2025-11-16, MMR 1 on 2025-10-01, MMR 2 on 2025-10-29, so immunization_compliance_status == COMPLIANT."
            - "One SPORTS_PHYSICAL visit IN_PROGRESS carrying an ACTIVE clearance with outcome CLEARED."
