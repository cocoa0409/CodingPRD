              as_user_id: "agent-01"
              captures: { st: $.data.status }
            - call: "POST /travel-expenses/${tx}/approve"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { err: $.data.error_id }
          assert:
            - "the rejection returns 200 with status REJECTED and reimbursable_cents null"
            - "engagement.travel_reimbursable_cents is still 0"
            - "the later approval returns 409 ERR_TRAVEL_EXPENSE_STATE_INVALID and the receipt stays REJECTED"

