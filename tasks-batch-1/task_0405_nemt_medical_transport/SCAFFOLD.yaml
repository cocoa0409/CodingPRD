    input: []
    output: Leg
    side_effects: ["picked_up_at stamped; dwell_minutes computed for will-call returns"]

  - method: POST
    path: "/legs/{id}/dropoff"
    description: "Member dropped off (PICKED_UP->DROPPED_OFF); records odometer; may complete trip"
    roles: [Driver]
    code: 200
    input: [odometer_loaded_miles]
    output: Leg
    side_effects: ["dropped_off_at stamped; odometer recorded; all-legs-dropped completes trip"]

  - method: POST
    path: "/legs/{id}/no-show"
    description: "Driver marks member no-show (OUTBOUND ARRIVED->NO_SHOW)"
    roles: [Driver]
    code: 200
    input: []
    output: Leg
    side_effects: ["trip IN_PROGRESS->NO_SHOW; RETURN leg cancelled; member strike incremented; possible auto-suspend"]

  # ---- StandingOrder ----
  - method: POST
    path: "/standing-orders"
    description: "Create a recurring StandingOrder (status ACTIVE)"
    roles: [Coordinator]
    code: 201
    input: [member_id, modality, level_of_service, weekday_mask, appointment_time_utc, scheduled_loaded_miles]
    output: StandingOrder
    side_effects: ["status=ACTIVE, horizon_through=null"]

  - method: GET
    path: "/standing-orders/{id}"
    description: "Get a StandingOrder"
    roles: [Coordinator]
    code: 200
    input: []
    output: StandingOrder
    side_effects: []

  - method: POST
    path: "/standing-orders/{id}/generate"
    description: "Roll the horizon forward, creating DRAFT trips per weekday mask (idempotent)"
    roles: [Coordinator]
    code: 200
    input: [generate_from, generate_through]
    output: StandingOrder
    side_effects: ["DRAFT TripRequests created for matching weekdays; horizon_through advanced"]

  - method: POST
    path: "/standing-orders/{id}/pause"
    description: "Pause generation (ACTIVE->PAUSED)"
    roles: [Coordinator]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status=PAUSED"]

  - method: POST
    path: "/standing-orders/{id}/resume"
    description: "Resume generation (PAUSED->ACTIVE)"
    roles: [Coordinator]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status=ACTIVE"]

  # ---- Claim / Encounter ----
  - method: POST
    path: "/claims"
    description: "Broker submits a Claim for a COMPLETED trip (UNBILLED->CLAIMED)"
    roles: [Broker]
    code: 201
    input: [trip_id]
    output: Claim
    side_effects: ["Claim SUBMITTED; trip.claimed_cost_cents computed; billing_status->CLAIMED"]

  - method: GET
    path: "/claims/{id}"
    description: "Get a Claim"
    roles: [Coordinator, Broker, Auditor]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/encounters"
    description: "Auditor captures an Encounter for a CLAIMED trip (CLAIMED->ENCOUNTERED)"
    roles: [Auditor]
    code: 201
    input: [trip_id]
    output: Encounter
    side_effects: ["Encounter OPEN; trip.encounter_cost_cents computed; billing_status->ENCOUNTERED"]

  - method: GET
    path: "/encounters/{id}"
    description: "Get an Encounter"
    roles: [Coordinator, Auditor]
    code: 200
    input: []
    output: Encounter
    side_effects: []

  # ---- Test-driving endpoints (/_ namespace) ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving)"
    roles: [Coordinator]
    code: 200
    input: [now_utc]
    output: null
    side_effects: ["server clock set to now_utc for subsequent timestamp stamping and eligibility recompute"]

  - method: POST
    path: "/_geo/county_distance"
    description: "Seed a symmetric county-to-county dead-head distance (test-driving)"
    roles: [Coordinator]
    code: 200
    input: [county_a, county_b, miles]
    output: null
    side_effects: ["COUNTY_DISTANCE_MILES[county_a][county_b]=miles (and the symmetric entry)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a recognized role"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this operation per RBAC matrix"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A resource id in the path does not exist"

  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "A foreign-key id in the request body references a non-existent resource"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, or enum/numeric value outside the declared domain"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state from which the requested transition is defined"

  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting Driver is not the trip's assigned_driver_id, or acting Broker is not the trip's assigned_broker_id"

  - id: ERR_MEMBER_INELIGIBLE
    http: 409
    condition: "Member eligibility_status is not ELIGIBLE when scheduling or assigning"

  - id: ERR_LOS_NOT_AUTHORIZED
    http: 409
    condition: "Trip modality exceeds member.mobility_level, or covering span level_of_service rank below requested_level_of_service rank, or no covering span at appointment_at"

  - id: ERR_MODALITY_MISMATCH
    http: 409
    condition: "Selected broker/driver modality below trip.modality, or broker does not cover member.home_county"

  - id: ERR_NO_BROKER_AVAILABLE
    http: 409
    condition: "No candidate (Broker, Driver) pair satisfies the selection policy"

  - id: ERR_ASSIGNMENT_EXISTS
    http: 409
    condition: "Trip already has an ACTIVE Assignment"

  - id: ERR_LEG_SEQUENCE_VIOLATION
    http: 409
    condition: "Will-call RETURN leg readied/departed before its OUTBOUND leg is DROPPED_OFF, or trip not IN_PROGRESS"

  - id: ERR_RECON_INCOMPLETE
    http: 409
    condition: "Reconcile attempted without both a SUBMITTED Claim and an OPEN Encounter, or duplicate claim/encounter for a trip"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_trip_version does not match the trip's current version (OCC) on assign"

  - id: ERR_DEPENDENCY_EXISTS
    http: 409
    condition: "Member terminate blocked by an in-flight ASSIGNED/IN_PROGRESS trip"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Coordinator
    description: "Intake/eligibility/scheduling operator; manages members, spans, brokers, rate schedules, trip lifecycle up to scheduling, standing orders, will-call readiness."
    identity: "opaque"
    exclusive_operations:
      - "POST /members — create member"
      - "POST /members/{id}/eligibility/recompute — recompute eligibility"
      - "POST /members/{id}/terminate — terminate member"
      - "POST /eligibility-spans — append span"
      - "POST /eligibility-spans/{id}/void — void span"
      - "POST /brokers — create broker"
      - "POST /brokers/{id}/suspend, /reinstate — broker availability"
      - "POST /rate-schedules — create rate row"
      - "POST /trips — create trip"
      - "POST /trips/{id}/schedule — schedule trip"
      - "POST /trips/{id}/cancel — cancel trip"
      - "POST /legs/{id}/ready, /cancel-ready — will-call readiness"
      - "POST /standing-orders, /generate, /pause, /resume — standing orders"
      - "POST /_clock/set, /_geo/county_distance — test-driving"

  - name: Broker
    description: "Transportation provider network; creates drivers, assigns trips, submits claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /drivers — create driver"
      - "POST /drivers/{id}/offline, /online — driver availability"
      - "POST /trips/{id}/assign — assign broker+driver"
      - "POST /claims — submit claim"

  - name: Driver
    description: "Field driver executing legs; entity-backed by a Driver row, must be the trip's assigned_driver_id to act on its legs."
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /legs/{id}/depart, /arrive, /pickup, /dropoff, /no-show — leg execution"

  - name: Auditor
    description: "Claim/encounter reconciliation; captures encounters and reconciles."
    identity: "opaque"
    exclusive_operations:
      - "POST /encounters — capture encounter"
      - "POST /trips/{id}/reconcile, /reconcile/override — reconciliation"

  - name: Shared
    description: "Read operations shared across roles (each GET lists the roles permitted in §1.5)."
    identity: "opaque"
    shared_operations:
      - "GET /members/{id}, /members/{id}/eligibility-spans, /members/{id}/trips, /members/{id}/standing-orders"
      - "GET /brokers/{id}, /brokers/{id}/drivers"
      - "GET /drivers/{id}, /rate-schedules/{id}"
      - "GET /trips/{id}, /trips/{id}/legs, /trips/{id}/assignments, /trips/{id}/claims, /trips/{id}/encounters"
      - "GET /legs/{id}, /claims/{id}, /encounters/{id}"
