  # =================================================================
  # Section: cross_cutting_layers
  # =================================================================
  - section: cross_cutting_layers
    instances:
      - name: flight_confirm_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[flight-confirm-stale-campaign]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Confirm of flight A bumps Campaign.version; a confirm of flight B carrying the pre-A version is rejected 412 ERR_STALE_VERSION; re-reading and retrying with the fresh version succeeds."
        test_recipe:
          setup: ["campaign APPROVED with two HELD flights A (F1) and B (F2), both 2026-08-10..2026-09-06; advertiser limit 90000000"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-002", structure_code: "ST-002", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f2: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/permits", payload: { face_id: "${f2}", permit_number: "P-002", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "GET /api/faces/${f2}", payload: {}, as: SalesPlanner, captures: { f2_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { flA: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f2}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f2_v}" }, as: SalesPlanner, captures: { flB: $.data.id } }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "APPROVED" }, as: SalesManager }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /api/flights/${flA}/confirm", payload: { expected_campaign_version: "${cv}" }, as: SalesPlanner, captures: { a_status: $.data.status } }
            - { call: "POST /api/flights/${flB}/confirm", payload: { expected_campaign_version: "${cv}" }, as: SalesPlanner, captures: { err: $.data.error_id } }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { cv2: $.data.version } }
            - { call: "POST /api/flights/${flB}/confirm", payload: { expected_campaign_version: "${cv2}" }, as: SalesPlanner, captures: { b_status: $.data.status } }
          assert:
            - "Confirm A succeeds (status BOOKED) and advances Campaign.version"
            - "Confirm B with the stale version: error_id == ERR_STALE_VERSION (http 412); B stays HELD"
            - "Confirm B with the fresh version succeeds: status == BOOKED"
      - name: rate_card_occ_stale_update_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rate-card-update-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT /api/rate-cards/{id} with a superseded expected_rate_card_version is rejected 412; the current version then succeeds."
        test_recipe:
          setup: ["DRAFT rate card created (version captured)"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
          trigger:
            - { call: "PUT /api/rate-cards/${rc}", payload: { base_weekly_cents: 210000, expected_rate_card_version: "${rc_v}" }, as: InventoryManager, captures: { rc_v2: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { base_weekly_cents: 220000, expected_rate_card_version: "${rc_v}" }, as: InventoryManager, captures: { err: $.data.error_id } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { base_weekly_cents: 220000, expected_rate_card_version: "${rc_v2}" }, as: InventoryManager, captures: { base_after: $.data.base_weekly_cents } }
          assert:
            - "First update (matching version) succeeds and increments version"
            - "Second update with the stale version: error_id == ERR_STALE_VERSION (http 412)"
            - "Retry with the fresh version succeeds: base_weekly_cents == 220000"
      - name: flight_create_occ_stale_face_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[flight-create-stale-face]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A face mutation (traffic re-survey) between quote and booking invalidates the quote: POST /api/flights with the pre-mutation expected_face_version is rejected 412; re-reading the face and retrying succeeds."
        test_recipe:
          setup: ["card PUBLISHED; static face F1 with permit; face version captured; then PUT /api/faces/{id} bumps the version via daily_traffic_count update"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "PUT /api/faces/${f1}", payload: { daily_traffic_count: 310000 }, as: InventoryManager }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
          trigger:
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { err: $.data.error_id } }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v2: $.data.version } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v2}" }, as: SalesPlanner, captures: { fl: $.data.id, fl_status: $.data.status } }
          assert:
            - "Stale create: error_id == ERR_STALE_VERSION (http 412)"
            - "Create with fresh version succeeds: status == HELD"
      - name: estimated_impressions_recomputed_on_traffic_update
        claim_type: derived_field_reconciliation
        grounds: [calculations.estimated_impressions, entities.Flight.fields.estimated_impressions]
        distinguishing_aspect: "Derived-field reconciliation: PUT /api/faces/{id} changing daily_traffic_count 300000 -> 100000 recomputes HELD-flight estimated_impressions immediately from 9408000 to 3136000 (recompute set limited to {HELD, BOOKED, ART_CLEARED})."
        test_recipe:
          setup: ["HELD flight 2026-08-10..2026-09-06 on illuminated static F1 (300000 traffic)"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
