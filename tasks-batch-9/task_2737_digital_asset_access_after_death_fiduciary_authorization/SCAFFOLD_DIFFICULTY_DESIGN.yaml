      - name: deduction_cap_tier_switches_at_exactly_five_hundred_thousand_gross_cents
        grounds:
          - calculations.estate_valuation_rollup
          - calculations.asset_appraised_value
          - entities.ValuationRun.fields.deduction_cap_cents
          - entities.Platform.fields.transfer_fee_cents
          - concurrency_rules.valuation-run-create-stale-estate
        distinguishing_aspect: |
          The tier is keyed on GROSS and the upper bound of tier 1 is EXCLUSIVE: a one-cent change in
          Platform.transfer_fee_cents moves gross from 500000 to 499999 and therefore drops
          deduction_cap_cents from 150000 to 25000, which changes admin_deduction_cents from 30000 to
          25000 and RAISES taxable_value_cents from 470000 to 474999 even though the estate got
          poorer — an implementation that tiers on the post-deduction value or uses <= cannot
          reproduce both runs.
