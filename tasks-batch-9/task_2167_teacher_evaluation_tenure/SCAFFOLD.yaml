scenario: "desgin task harder than expert level.!!!!2167. Teacher Evaluation & Tenure Progression (district HR/evaluation office): evaluation cycle (formal/informal observation) scheduling, rubric scoring & evidence artifact collection, student-growth measure weighting & composite rating, improvement plan trigger & remediation timeline, tenure eligibility years & recommendation, dispute/appeal & union grievance interface, evaluator certification & calibration, rating distribution reporting"
domain_name: teacher-evaluation-tenure
api_prefix: "/"

complexity_profile:
  difficulty_level: expert
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat peer entities linked by foreign keys; no nesting deeper than one
    sub-resource segment. Non-linearity is concentrated in three places:
    Observation carries a SUBMITTED -> RETURNED -> SCORED revision loop,
    EvaluationCycle carries two independent state dimensions (`status` and
    `dispute_state`) that advance on unrelated triggers, and Evaluator
    certification cycles CERTIFIED -> SUSPENDED -> CERTIFIED through
    calibration outcomes. Segregation of duties is enforced twice: the appeal
    panelist may not be an evaluator who submitted an observation in the cycle
    under appeal, and the tenure decider may not be the tenure recommender.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: EvaluationPolicy
    parent: null
    common_fields: true
    description: "District evaluation policy for one school year. Configuration entity: every constant used by scoring, remediation, tenure and calibration is read from the policy row bound to the cycle, never from a global default."
    fields:
      - name: school_year
        type: string
        source: input
        description: "School year label, format YYYY-YYYY (e.g. 2026-2027)."
      - name: observation_weight_pct
        type: number
        source: input
        default: 60
        description: "Share of the composite carried by the observation component when a growth component exists."
        constraints: "0 <= value <= 100; observation_weight_pct + growth_weight_pct must equal 100"
      - name: growth_weight_pct
        type: number
        source: input
        default: 40
        description: "Share of the composite carried by the student-growth component when a growth component exists."
        constraints: "0 <= value <= 100"
      - name: planning_weight_pct
        type: number
        source: input
        default: 22
        description: "Rubric domain weight for PLANNING, in percent."
      - name: environment_weight_pct
        type: number
        source: input
        default: 23
        description: "Rubric domain weight for ENVIRONMENT, in percent."
      - name: instruction_weight_pct
        type: number
        source: input
        default: 33
        description: "Rubric domain weight for INSTRUCTION, in percent."
      - name: professionalism_weight_pct
        type: number
        source: input
        default: 22
        description: "Rubric domain weight for PROFESSIONALISM, in percent. The four domain weights must sum to 100."
      - name: required_formal_count
        type: integer
        source: input
        default: 2
        description: "Formal observations a cycle must carry; shortfalls are floored at MISSING_OBSERVATION_FLOOR in the FINAL composite variant only."
        constraints: ">= 1"
      - name: required_informal_count
        type: integer
        source: input
        default: 1
        description: "Informal observations a cycle must carry; shortfalls are floored at MISSING_OBSERVATION_FLOOR in the FINAL composite variant only."
        constraints: ">= 0"
      - name: unannounced_multiplier
        type: number
        source: input
        default: 1.10
        description: "Per-domain multiplier applied to an unannounced FORMAL observation's domain contribution before the 2-decimal rounding step."
      - name: informal_cap
        type: number
        source: input
        default: 3.50
        description: "Ceiling applied to an INFORMAL observation's weighted_score."
      - name: highly_effective_threshold
        type: number
        source: input
        default: 3.50
        description: "Composite at or above this value bands as HIGHLY_EFFECTIVE."
      - name: effective_threshold
        type: number
        source: input
        default: 2.50
        description: "Composite at or above this value (and below highly_effective_threshold) bands as EFFECTIVE."
      - name: developing_threshold
        type: number
        source: input
        default: 1.50
        description: "Composite at or above this value (and below effective_threshold) bands as DEVELOPING; below it bands as INEFFECTIVE."
      - name: evidence_min_artifacts
        type: integer
        source: input
        default: 2
        description: "Attached evidence artifacts a cycle needs to avoid the evidence-sufficiency penalty."
      - name: remediation_days
        type: integer
        source: input
        default: 90
        description: "Calendar days from improvement-plan start to its due_at."
      - name: max_plan_extension_days
        type: integer
        source: input
        default: 45
        description: "Cumulative extension days a single improvement plan may absorb."
      - name: appeal_window_days
        type: integer
        source: input
        default: 15
        description: "Calendar days after finalization during which the educator may file an appeal."
      - name: tenure_required_years
        type: integer
        source: input
        default: 3
        description: "Completed service years required before a tenure recommendation is permitted (>= comparison)."
      - name: tenure_min_consecutive_effective
        type: integer
        source: input
        default: 2
        description: "Consecutive most-recent finalized cycles rated EFFECTIVE or HIGHLY_EFFECTIVE required before a tenure recommendation is permitted (>= comparison)."
      - name: min_days_between_formals
        type: integer
        source: input
        default: 10
        description: "Minimum separation, in whole days, between the scheduled_start instants of two FORMAL observations on the same educator (strict < comparison rejects)."
      - name: calibration_drift_tolerance
        type: number
        source: input
        default: 0.50
        description: "Maximum deviation, and maximum rolling drift, an evaluator may carry and still be certified (<= comparison passes)."
      - name: calibration_max_consecutive_failures
        type: integer
        source: input
        default: 2
        description: "Consecutive failed calibration reviews that suspend an evaluator (>= comparison suspends)."
      - name: observation_stipend_cents
        type: integer
        source: input
        default: 12500
        description: "Stipend committed against the educator's school budget when a FORMAL observation is submitted; an INFORMAL observation commits INFORMAL_STIPEND_RATIO of it."

  - name: School
    parent: null
    common_fields: true
    description: "A building whose evaluation budget funds observation stipends and whose educators form a rating-distribution population."
    fields:
      - name: name
        type: string
        source: input
        description: "Building name."
      - name: code
        type: string
        source: input
        description: "Short building code, unique across the district."
      - name: level
        type: enum
        source: input
        description: "Grade band of the building."
        constraints: "one of ELEMENTARY, MIDDLE, HIGH"
      - name: evaluation_budget_allocated_cents
        type: integer
        source: input
        default: 100000
        description: "Total stipend budget allocated to this building for the year."
        constraints: ">= 0"
      - name: evaluation_budget_committed_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Observation.stipend_cents over observations whose cycle's educator belongs to this school and whose status is SUBMITTED or ACCEPTED."
      - name: evaluation_budget_remaining_cents
        type: integer
        source: computed
        default: 100000
        description: "evaluation_budget_allocated_cents minus evaluation_budget_committed_cents."

  - name: Educator
    parent: null
    common_fields: true
    description: "A teacher being evaluated. Backing entity for the Teacher role."
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the building whose evaluation budget funds this educator's observations."
      - name: employee_number
        type: string
        source: input
        description: "District employee number; unique across all educators."
      - name: full_name
        type: string
        source: input
        description: "Educator name."
      - name: service_start_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) on which continuous district service began."
      - name: tenure_status
        type: enum
        source: system
        default: PROBATIONARY
        description: "Tenure progression state."
        constraints: "one of PROBATIONARY, RECOMMENDED, TENURED, DENIED, NON_RENEWED"
      - name: completed_service_years
        type: integer
        source: computed
        default: 0
        description: "floor((logical clock date - service_start_date) in days / DAYS_PER_SERVICE_YEAR); recomputed on every read of the educator and on every tenure endpoint."
      - name: consecutive_effective_years
        type: integer
        source: computed
        default: 0
        description: "Length of the trailing run of this educator's FINALIZED or CLOSED cycles, ordered by school_year ASC then created_at ASC, whose composite_rating is EFFECTIVE or HIGHLY_EFFECTIVE, counted backwards from the most recent one."
      - name: tenure_track_hold
        type: boolean
        source: computed
        default: false
        description: "True while at least one ImprovementPlan of this educator is ACTIVE or EXTENDED."
      - name: last_composite_rating
        type: enum
        source: system
        default: null
        description: "composite_rating of the educator's most recent FINALIZED or CLOSED cycle by school_year ASC then created_at ASC; null before any finalization."
        constraints: "one of INEFFECTIVE, DEVELOPING, EFFECTIVE, HIGHLY_EFFECTIVE, or null"
      - name: tenure_recommended_by_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the HrAdmin operator who issued the tenure recommendation; compared against the decider's X-User-ID to enforce segregation of duties. Not a foreign key."

  - name: Evaluator
    parent: null
    common_fields: true
    description: "A principal or assistant principal who observes, scores and may sit on an appeal panel. Backing entity for the Evaluator and AppealPanelist roles."
    fields:
      - name: full_name
        type: string
        source: input
        description: "Evaluator name."
      - name: certification_status
        type: enum
        source: system
        default: PROVISIONAL
        description: "Evaluator certification state driven exclusively by calibration outcomes."
        constraints: "one of PROVISIONAL, CERTIFIED, SUSPENDED"
      - name: certification_expires_on
        type: string
        source: system
        default: null
        description: "ISO 8601 date; set to the logical clock date plus CERTIFICATION_TERM_DAYS whenever the evaluator enters CERTIFIED. Null while PROVISIONAL or SUSPENDED."
      - name: consecutive_failed_calibrations
        type: integer
        source: computed
        default: 0
        description: "Count of calibration reviews decided FAIL since the most recent PASS; reset to 0 by any PASS."
      - name: passed_calibration_count
        type: integer
        source: computed
        default: 0
        description: "Lifetime count of calibration reviews decided PASS."
      - name: calibration_drift_rolling
        type: number
        source: computed
        default: 0
        description: "ROLLING variant of evaluator drift: mean deviation over the most recent CALIBRATION_ROLLING_WINDOW decided reviews, 2 decimals."
      - name: calibration_drift_anchor
        type: number
        source: computed
        default: 0
        description: "ANCHOR variant of evaluator drift: deviation of the single most recent decided review, 2 decimals."

  - name: EvaluationCycle
    parent: null
    common_fields: true
    description: "One educator's evaluation for one school year. Carries two independent state dimensions: `status` (scheduling through closure) and `dispute_state` (appeal and grievance progression)."
    fields:
      - name: educator_id
        type: string
        source: input
        description: "FK -> Educator.id; the educator being evaluated."
      - name: policy_id
        type: string
        source: input
        description: "FK -> EvaluationPolicy.id; the policy row every constant in this cycle's arithmetic is read from."
      - name: school_year
        type: string
        source: input
        description: "School year label, format YYYY-YYYY."
      - name: cycle_type
        type: enum
        source: input
        default: COMPREHENSIVE
        description: "Evaluation track for this cycle."
        constraints: "one of COMPREHENSIVE, FOCUSED"
      - name: status
        type: enum
        source: system
        default: SCHEDULING
        description: "Primary state dimension."
        constraints: "one of SCHEDULING, SCORING, SUBMITTED, FINALIZED, CLOSED"
      - name: dispute_state
        type: enum
        source: system
        default: NONE
        description: "Secondary, independent state dimension tracking appeal and grievance progression."
        constraints: "one of NONE, APPEALED, APPEAL_RESOLVED, GRIEVED, GRIEVANCE_RESOLVED"
      - name: completed_formal_count
        type: integer
        source: computed
        default: 0
        description: "Count of this cycle's observations with observation_type FORMAL and status in {SUBMITTED, ACCEPTED}."
      - name: completed_informal_count
        type: integer
        source: computed
        default: 0
        description: "Count of this cycle's observations with observation_type INFORMAL and status in {SUBMITTED, ACCEPTED}."
      - name: evidence_artifact_count
        type: integer
        source: computed
        default: 0
        description: "Sum of Observation.evidence_count over this cycle's observations whose status is not VOIDED."
      - name: observation_component
        type: number
        source: computed
        default: null
        description: "Blended formal/informal observation score, 4 decimals; null until at least one observation is counted."
      - name: growth_component
        type: number
        source: computed
        default: null
        description: "Reliability-adjusted student-growth index, 4 decimals; null when the cycle has no CERTIFIED growth measure."
      - name: evidence_adjustment
        type: number
        source: computed
        default: 0
        description: "Evidence-sufficiency adjustment applied only by the FINAL composite variant; always 0 for the PROVISIONAL variant."
      - name: composite_score
        type: number
        source: computed
        default: null
        description: "Composite rating score, 2 decimals; null before the cycle is submitted."
      - name: composite_rating
        type: enum
        source: computed
        default: null
        description: "Band of composite_score."
        constraints: "one of INEFFECTIVE, DEVELOPING, EFFECTIVE, HIGHLY_EFFECTIVE, or null"
      - name: composite_variant
        type: enum
        source: computed
        default: null
        description: "Which composite algorithm produced composite_score."
        constraints: "one of PROVISIONAL, FINAL, or null"
      - name: finalized_at
        type: datetime
        source: system
        default: null
        description: "Logical clock instant at which the cycle entered FINALIZED; cleared when an appeal remand or a sustained grievance reverts the cycle to SCORING."
      - name: appeal_deadline
        type: datetime
        source: computed
        default: null
        description: "finalized_at plus policy.appeal_window_days; cleared alongside finalized_at."

  - name: Observation
    parent: null
    common_fields: true
    description: "A single classroom observation inside an evaluation cycle. Carries a SUBMITTED -> RETURNED -> SCORED revision loop."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> EvaluationCycle.id; the cycle this observation scores."
      - name: evaluator_id
        type: string
        source: input
        description: "FK -> Evaluator.id; the evaluator who conducts and scores this observation."
      - name: observation_type
        type: enum
        source: input
        description: "Observation kind."
        constraints: "one of FORMAL, INFORMAL"
      - name: announced
        type: boolean
        source: input
        default: true
        description: "False marks an unannounced observation; only an unannounced FORMAL observation earns the policy's unannounced_multiplier."
      - name: scheduled_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the observation window; interval occupation on the evaluator is half-open [scheduled_start, scheduled_end)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the observation window; must be strictly after scheduled_start."
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Observation lifecycle state."
        constraints: "one of SCHEDULED, CONDUCTED, SCORED, SUBMITTED, RETURNED, ACCEPTED, VOIDED"
      - name: scored_domain_count
        type: integer
        source: computed
        default: 0
        description: "Count of distinct domain_code values currently recorded as RubricScore rows for this observation; the observation reaches SCORED at 4."
      - name: weighted_score
        type: number
        source: computed
        default: null
        description: "Observation weighted score, 2 decimals; null until the fourth domain is scored."
      - name: evidence_count
        type: integer
        source: computed
        default: 0
        description: "Count of this observation's EvidenceArtifact rows with status ATTACHED."
      - name: stipend_cents
        type: integer
        source: computed
        default: 0
        description: "Stipend currently committed against the school budget for this observation; set on submit, reset to 0 on return or void."
      - name: return_count
        type: integer
        source: computed
        default: 0
        description: "Number of times this observation has been returned for rescoring."
      - name: return_reason
        type: string
        source: system
        default: null
        description: "Reason text supplied by the most recent return."
      - name: void_reason
        type: string
        source: system
        default: null
        description: "Reason text supplied on void; the literal EVALUATOR_SUSPENDED when the void was cascaded by an evaluator suspension."

  - name: RubricScore
    parent: null
    common_fields: true
    description: "One rubric domain score for one observation. Re-posting a domain supersedes the prior row for that domain."
    fields:
      - name: observation_id
        type: string
        source: input
        description: "FK -> Observation.id; the observation this domain score belongs to."
      - name: domain_code
        type: enum
        source: input
        description: "Rubric domain."
        constraints: "one of PLANNING, ENVIRONMENT, INSTRUCTION, PROFESSIONALISM"
      - name: raw_score
        type: integer
        source: input
        description: "Domain rating on the district four-point scale."
        constraints: "integer, 1 <= raw_score <= 4"
      - name: weighted_contribution
        type: number
        source: computed
        description: "round_half_up(raw_score * domain_weight_pct * factor / 100, 2) where factor is the unannounced multiplier when applicable, else 1.00."
      - name: superseded
        type: boolean
        source: computed
        default: false
        description: "True once a later RubricScore for the same observation and domain_code replaces this row; superseded rows never enter any arithmetic."
      - name: observation_version_after
        type: integer
        source: computed
        description: "Observation.version immediately after this score was recorded; lets a client chain OCC-guarded scoring calls without an intervening read."

  - name: EvidenceArtifact
    parent: null
    common_fields: true
    description: "An artifact attached to an observation as evidence. Attaching and withdrawing are exact compensating actions on the evidence ledger."
    fields:
      - name: observation_id
        type: string
        source: input
        description: "FK -> Observation.id; the observation this artifact evidences."
      - name: artifact_type
        type: enum
        source: input
        description: "Artifact kind."
        constraints: "one of LESSON_PLAN, STUDENT_WORK, REFLECTION, VIDEO"
      - name: title
        type: string
        source: input
        description: "Short artifact title."
      - name: status
        type: enum
        source: system
        default: ATTACHED
        description: "Artifact ledger state."
        constraints: "one of ATTACHED, WITHDRAWN"
      - name: submitted_by_role
        type: enum
        source: system
        description: "Role that attached the artifact, taken from X-User-Role at attach time."
        constraints: "one of EVALUATOR, TEACHER"

  - name: GrowthMeasure
    parent: null
    common_fields: true
    description: "A student-growth measure reported against a cycle. Only CERTIFIED measures enter the growth component."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> EvaluationCycle.id; the cycle this measure scores."
      - name: measure_code
        type: enum
        source: input
        description: "Growth measure family."
        constraints: "one of STATE_ASSESSMENT, SLO, SCHOOLWIDE"
      - name: index_value
        type: number
        source: input
        description: "Growth index on the district four-point scale."
        constraints: "1.00 <= index_value <= 4.00, at most 2 decimals"
      - name: coverage_pct
        type: number
        source: input
        description: "Share of the educator's roster this measure covers, in percent."
        constraints: "0 < coverage_pct <= 100"
      - name: status
        type: enum
        source: system
        default: REPORTED
        description: "Measure state; only CERTIFIED measures are summed by the growth component."
        constraints: "one of REPORTED, CERTIFIED, EXCLUDED"
      - name: cycle_version_after
        type: integer
        source: computed
        description: "EvaluationCycle.version immediately after this measure was recorded; lets a client chain OCC-guarded measure calls without an intervening read."

  - name: ImprovementPlan
    parent: null
    common_fields: true
    description: "Remediation plan triggered by an INEFFECTIVE final rating. Self-referential: a failed first plan spawns an escalated successor."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> EvaluationCycle.id; the cycle whose final rating triggered this plan."
      - name: educator_id
        type: string
        source: input
        description: "FK -> Educator.id; the educator under remediation."
      - name: prior_plan_id
        type: string
        source: system
        default: null
        description: "FK -> ImprovementPlan.id; the failed plan this plan escalates from. Null for a first plan."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Plan lifecycle state."
        constraints: "one of ACTIVE, EXTENDED, COMPLETED_SUCCESS, COMPLETED_FAIL, VOIDED"
      - name: trigger_reason
        type: enum
        source: computed
        description: "Why the plan exists."
        constraints: "one of INEFFECTIVE_RATING, PRIOR_PLAN_FAILED"
      - name: started_at
        type: datetime
        source: system
        description: "Logical clock instant at which the plan was created."
      - name: due_at
        type: datetime
        source: computed
        description: "started_at plus policy.remediation_days, advanced by every accepted extension."
      - name: extension_days_used
        type: integer
        source: computed
        default: 0
        description: "Cumulative extension days granted to this plan."
      - name: escalation_level
        type: integer
        source: computed
        default: 1
        description: "1 for a first plan, 2 for a plan whose prior_plan_id is set."

  - name: Appeal
    parent: null
    common_fields: true
    description: "An educator's challenge to a finalized rating, decided by an appeal panelist who did not evaluate the cycle."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> EvaluationCycle.id; the finalized cycle under appeal."
      - name: educator_id
        type: string
        source: system
        description: "FK -> Educator.id; copied from the cycle at filing time."
      - name: grounds
        type: enum
        source: input
        description: "Basis of the appeal."
        constraints: "one of PROCEDURAL, EVIDENTIARY, SCORING"
      - name: statement
        type: string
        source: input
        description: "Educator's written statement."
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Appeal state; the three decided states carry divergent side-effect sets."
        constraints: "one of FILED, UNDER_REVIEW, UPHELD, MODIFIED, REMANDED"
      - name: panelist_evaluator_id
        type: string
        source: system
        default: null
        description: "FK -> Evaluator.id; set to the reviewing panelist's X-User-ID when the appeal enters UNDER_REVIEW."
      - name: adjusted_composite
        type: number
        source: system
        default: null
        description: "Replacement composite supplied with a MODIFIED decision; null otherwise."
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical clock instant of the decision."

  - name: Grievance
    parent: null
    common_fields: true
    description: "A union grievance filed after the internal appeal remedy is exhausted (appeal UPHELD)."
    fields:
      - name: appeal_id
        type: string
        source: input
        description: "FK -> Appeal.id; the exhausted appeal this grievance escalates."
      - name: educator_id
        type: string
        source: system
        description: "FK -> Educator.id; copied from the appeal at filing time."
      - name: article_code
        type: enum
        source: input
        description: "Contract article invoked."
        constraints: "one of ART_12_EVALUATION, ART_14_DISCIPLINE"
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Grievance state."
        constraints: "one of FILED, SUSTAINED, DENIED, WITHDRAWN"
      - name: remedy
        type: enum
        source: system
        default: NONE
        description: "Remedy applied by a sustained grievance."
        constraints: "one of NONE, RATING_VACATED, PLAN_VOIDED"

  - name: CalibrationReview
    parent: null
    common_fields: true
    description: "A blind re-score of an anchor lesson used to certify and re-certify evaluators."
    fields:
      - name: evaluator_id
        type: string
        source: input
        description: "FK -> Evaluator.id; the evaluator being calibrated."
      - name: anchor_lesson_code
        type: string
        source: input
        description: "District anchor-lesson identifier; free text, not a foreign key."
      - name: anchor_score
        type: number
        source: input
        description: "Master-scorer consensus weighted score for the anchor lesson."
        constraints: "1.00 <= anchor_score <= 4.00"
      - name: evaluator_score
        type: number
        source: input
        description: "The evaluator's independent weighted score for the same anchor lesson."
        constraints: "1.00 <= evaluator_score <= 4.00"
      - name: deviation
        type: number
        source: computed
        description: "round_half_up(abs(evaluator_score - anchor_score), 2); computed at creation."
      - name: outcome
        type: enum
        source: system
        default: PENDING
        description: "Review outcome, decided against policy.calibration_drift_tolerance."
        constraints: "one of PENDING, PASS, FAIL"
      - name: sequence_index
        type: integer
        source: computed
        description: "1-based position of this review among the evaluator's decided reviews, ordered by created_at ASC."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Observation
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, VOIDED]
    shape: "cyclic — SCORED -> SUBMITTED -> RETURNED -> SCORED revision loop"
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /observations/{id}/conduct"
        actor: Evaluator
        preconditions:
          - "X-User-ID equals Observation.evaluator_id"
          - "Evaluator.certification_status == CERTIFIED"
          - "logical clock date <= Evaluator.certification_expires_on"
          - "EvaluationCycle.status IN {SCHEDULING, SCORING}"
          - "EvaluationCycle.dispute_state == NONE"
        side_effects:
          - "if EvaluationCycle.status == SCHEDULING then EvaluationCycle.status := SCORING (bubble up)"
          - "increments EvaluationCycle.version by 1 when the cycle status changes"
      - from: CONDUCTED
        to: SCORED
        trigger: "system — the fourth distinct domain_code is recorded via POST /observations/{id}/rubric-scores"
        actor: system
        preconditions:
          - "scored_domain_count reaches 4 after this rubric score is applied"
        side_effects:
          - "recompute Observation.weighted_score per calculations.observation_weighted_score"
          - "increments Observation.version by 1"
      - from: RETURNED
        to: SCORED
        trigger: "system — any POST /observations/{id}/rubric-scores against a RETURNED observation (all four domains already exist, so the replacement immediately completes the rubric)"
        actor: system
        preconditions:
          - "scored_domain_count == 4 after the replacing score is applied"
        side_effects:
          - "prior RubricScore for the same domain_code has superseded := true"
          - "recompute Observation.weighted_score per calculations.observation_weighted_score"
          - "increments Observation.version by 1"
        note: "This is the return leg of the revision loop; return_count is preserved."
      - from: SCORED
        to: SUBMITTED
        trigger: "POST /observations/{id}/submit"
        actor: Evaluator
        preconditions:
          - "X-User-ID equals Observation.evaluator_id"
          - "Observation.scored_domain_count == 4 (implied by the SCORED from-state; an observation with fewer than four domains is still CONDUCTED and is rejected by the state check)"
          - "EvaluationCycle.status IN {SCHEDULING, SCORING}"
          - "EvaluationCycle.dispute_state == NONE"
          - "School.evaluation_budget_committed_cents + this observation's stipend <= School.evaluation_budget_allocated_cents"
        side_effects:
          - "Observation.stipend_cents := policy.observation_stipend_cents for FORMAL, else round_half_up(policy.observation_stipend_cents * INFORMAL_STIPEND_RATIO, 0)"
          - "School.evaluation_budget_committed_cents += Observation.stipend_cents; School.evaluation_budget_remaining_cents recomputed (ledger sync)"
          - "EvaluationCycle.completed_formal_count / completed_informal_count recomputed"
          - "EvaluationCycle.evidence_artifact_count recomputed"
          - "recompute EvaluationCycle.observation_component per calculations.cycle_observation_component"
          - "increments EvaluationCycle.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /observations/{id}/return"
        actor: HrAdmin
        preconditions:
          - "EvaluationCycle.status IN {SCHEDULING, SCORING}"
          - "EvaluationCycle.dispute_state == NONE"
        side_effects:
          - "Observation.return_count += 1; Observation.return_reason := request return_reason"
          - "School.evaluation_budget_committed_cents -= Observation.stipend_cents; Observation.stipend_cents := 0 (compensation)"
          - "EvaluationCycle.completed_formal_count / completed_informal_count recomputed"
          - "recompute EvaluationCycle.observation_component per calculations.cycle_observation_component"
          - "increments EvaluationCycle.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /observations/{id}/accept"
        actor: HrAdmin
        preconditions:
          - "EvaluationCycle.status IN {SCHEDULING, SCORING, SUBMITTED}"
        side_effects:
          - "no ledger movement; the stipend and cycle counters already reflect this observation"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /observations/{id}/void, or system cascade when the observation's evaluator enters SUSPENDED"
        actor: HrAdmin | system
        preconditions:
          - "EvaluationCycle.status != CLOSED"
        side_effects:
          - "Observation.void_reason := request void_reason, or the literal EVALUATOR_SUSPENDED for the cascade"
          - "if no observation of the cycle remains in {CONDUCTED, SCORED, SUBMITTED, RETURNED, ACCEPTED} then EvaluationCycle.status := SCHEDULING when it was SCORING (bubble up)"
          - "increments EvaluationCycle.version by 1 when the cycle status changes"
      - from: CONDUCTED
        to: VOIDED
        trigger: "POST /observations/{id}/void, or system cascade when the observation's evaluator enters SUSPENDED"
        actor: HrAdmin | system
        preconditions:
          - "EvaluationCycle.status != CLOSED"
        side_effects:
          - "same as the SCHEDULED -> VOIDED cascade, including the SCORING -> SCHEDULING bubble-up"
      - from: SCORED
        to: VOIDED
        trigger: "POST /observations/{id}/void, or system cascade when the observation's evaluator enters SUSPENDED"
        actor: HrAdmin | system
        preconditions:
          - "EvaluationCycle.status != CLOSED"
        side_effects:
          - "same as the SCHEDULED -> VOIDED cascade, including the SCORING -> SCHEDULING bubble-up"
      - from: RETURNED
        to: VOIDED
        trigger: "POST /observations/{id}/void, or system cascade when the observation's evaluator enters SUSPENDED"
        actor: HrAdmin | system
        preconditions:
          - "EvaluationCycle.status != CLOSED"
        side_effects:
          - "same as the SCHEDULED -> VOIDED cascade, including the SCORING -> SCHEDULING bubble-up"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /observations/{id}/void"
        actor: HrAdmin
        preconditions:
          - "EvaluationCycle.status != CLOSED"
        side_effects:
          - "School.evaluation_budget_committed_cents -= Observation.stipend_cents; Observation.stipend_cents := 0 (compensation)"
          - "EvaluationCycle.evidence_artifact_count recomputed (a voided observation's artifacts leave the cycle ledger)"
          - "EvaluationCycle.completed_formal_count / completed_informal_count recomputed"
          - "recompute EvaluationCycle.observation_component per calculations.cycle_observation_component"
          - "if no observation of the cycle remains in {CONDUCTED, SCORED, SUBMITTED, RETURNED, ACCEPTED} then EvaluationCycle.status := SCHEDULING when it was SCORING"
          - "increments EvaluationCycle.version by 1"
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /observations/{id}/void"
        actor: HrAdmin
        preconditions:
          - "EvaluationCycle.status != CLOSED"
        side_effects:
          - "same compensation set as the SUBMITTED -> VOIDED transition"

  - entity: EvaluationCycle
    dimension: status
    initial_state: SCHEDULING
    terminal_states: [CLOSED]
    shape: "compound + revertible — status is driven by child observation states and can be pushed backwards by an appeal remand or a sustained grievance; it advances independently of the dispute_state dimension"
    transitions:
      - from: SCHEDULING
        to: SCORING
        trigger: "system — the cycle's first observation reaches CONDUCTED"
        actor: system
        preconditions:
          - "at least one observation of the cycle is in {CONDUCTED, SCORED, SUBMITTED, RETURNED, ACCEPTED}"
        side_effects:
          - "increments EvaluationCycle.version by 1"
      - from: SCORING
        to: SCHEDULING
        trigger: "system — the last observation of the cycle in {CONDUCTED, SCORED, SUBMITTED, RETURNED, ACCEPTED} is voided"
        actor: system
        preconditions:
          - "no observation of the cycle remains in {CONDUCTED, SCORED, SUBMITTED, RETURNED, ACCEPTED}"
        side_effects:
          - "EvaluationCycle.observation_component := null when completed_formal_count and completed_informal_count are both 0"
          - "increments EvaluationCycle.version by 1"
      - from: SCORING
        to: SUBMITTED
        trigger: "POST /evaluation-cycles/{id}/submit"
        actor: Evaluator | HrAdmin
        preconditions:
          - "completed_formal_count >= 1"
          - "no observation of the cycle is in {SCHEDULED, CONDUCTED, SCORED, RETURNED}"
          - "EvaluationCycle.dispute_state == NONE"
        side_effects:
          - "recompute EvaluationCycle.growth_component per calculations.cycle_growth_component"
          - "compute composite_score via calculations.cycle_composite_score variant PROVISIONAL; composite_variant := PROVISIONAL; evidence_adjustment := 0"
          - "composite_rating := band(composite_score)"
          - "increments EvaluationCycle.version by 1"
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /evaluation-cycles/{id}/finalize"
        actor: HrAdmin
        preconditions:
          - "EvaluationCycle.composite_variant == PROVISIONAL"
          - "no observation of the cycle is in {SCHEDULED, CONDUCTED, SCORED, RETURNED}"
          - "EvaluationCycle.dispute_state == NONE"
        side_effects:
          - "compute composite_score via calculations.cycle_composite_score variant FINAL, then apply calculations.evidence_sufficiency_adjustment; composite_variant := FINAL"
          - "composite_rating := band(composite_score after adjustment)"
          - "finalized_at := logical clock; appeal_deadline := finalized_at + policy.appeal_window_days"
          - "Educator.last_composite_rating and Educator.consecutive_effective_years recomputed per calculations.educator_tenure_eligibility"
          - "if composite_rating == INEFFECTIVE then create ImprovementPlan(status ACTIVE, trigger_reason INEFFECTIVE_RATING, escalation_level 1) — that plan creation sets Educator.tenure_track_hold := true"
          - "increments EvaluationCycle.version by 1"
      - from: FINALIZED
        to: SCORING
        trigger: "system — POST /appeals/{id}/decide with outcome REMANDED, or POST /grievances/{id}/decide with outcome SUSTAIN and remedy RATING_VACATED"
        actor: system
        preconditions:
          - "EvaluationCycle.status == FINALIZED"
        side_effects:
          - "composite_score, composite_rating, composite_variant, evidence_adjustment, finalized_at and appeal_deadline are all cleared (evidence_adjustment := 0)"
          - "every ImprovementPlan of this cycle in {ACTIVE, EXTENDED} transitions to VOIDED (cascade)"
          - "increments EvaluationCycle.version by 1"
      - from: FINALIZED
        to: CLOSED
        trigger: "POST /evaluation-cycles/{id}/close"
        actor: HrAdmin
        preconditions:
          - "logical clock is strictly after EvaluationCycle.appeal_deadline"
          - "EvaluationCycle.dispute_state IN {NONE, APPEAL_RESOLVED, GRIEVANCE_RESOLVED}"
        side_effects:
          - "increments EvaluationCycle.version by 1"

  - entity: EvaluationCycle
    dimension: dispute_state
    initial_state: NONE
    terminal_states: [GRIEVANCE_RESOLVED]
    shape: "parallel dimension — advances on appeal and grievance triggers only, independently of the status dimension; a cycle may sit at status SCORING with dispute_state APPEAL_RESOLVED"
    transitions:
      - from: NONE
        to: APPEALED
        trigger: "POST /appeals"
        actor: Teacher
        preconditions:
          - "EvaluationCycle.status == FINALIZED"
          - "logical clock <= EvaluationCycle.appeal_deadline"
        side_effects:
          - "increments EvaluationCycle.version by 1"
      - from: APPEALED
        to: APPEAL_RESOLVED
        trigger: "POST /appeals/{id}/decide (any outcome)"
        actor: AppealPanelist
        preconditions:
          - "Appeal.status == UNDER_REVIEW"
        side_effects:
          - "increments EvaluationCycle.version by 1"
      - from: APPEAL_RESOLVED
        to: GRIEVED
        trigger: "POST /grievances"
        actor: UnionRep
        preconditions:
          - "Appeal.status == UPHELD"
        side_effects:
          - "increments EvaluationCycle.version by 1"
      - from: GRIEVED
        to: GRIEVANCE_RESOLVED
        trigger: "POST /grievances/{id}/decide (any outcome)"
        actor: HrAdmin | UnionRep
        preconditions:
          - "Grievance.status == FILED"
        side_effects:
          - "increments EvaluationCycle.version by 1"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, MODIFIED, REMANDED]
    shape: "branching fork — one review state forks into three decided states with disjoint side-effect sets"
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/review"
        actor: AppealPanelist
        preconditions:
          - "the acting Evaluator (X-User-ID) has certification_status == CERTIFIED"
          - "the acting Evaluator is not the evaluator_id of any observation of the appealed cycle whose status is in {SUBMITTED, ACCEPTED} (segregation of duties)"
        side_effects:
          - "Appeal.panelist_evaluator_id := X-User-ID"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /appeals/{id}/decide with outcome UPHELD"
        actor: AppealPanelist
        preconditions:
          - "X-User-ID equals Appeal.panelist_evaluator_id"
        side_effects:
          - "Appeal.decided_at := logical clock"
          - "EvaluationCycle.dispute_state := APPEAL_RESOLVED; the rating stands unchanged"
      - from: UNDER_REVIEW
        to: MODIFIED
        trigger: "POST /appeals/{id}/decide with outcome MODIFIED and adjusted_composite"
        actor: AppealPanelist
        preconditions:
          - "X-User-ID equals Appeal.panelist_evaluator_id"
          - "adjusted_composite is present and 1.00 <= adjusted_composite <= 4.00"
        side_effects:
          - "Appeal.adjusted_composite := request adjusted_composite; Appeal.decided_at := logical clock"
          - "EvaluationCycle.composite_score := adjusted_composite; composite_rating := band(adjusted_composite); dispute_state := APPEAL_RESOLVED"
          - "that cycle mutation recomputes Educator.last_composite_rating and Educator.consecutive_effective_years"
          - "if the new composite_rating != INEFFECTIVE then every ImprovementPlan of the cycle in {ACTIVE, EXTENDED} transitions to VOIDED, and that voiding sets Educator.tenure_track_hold := false"
          - "increments EvaluationCycle.version by 1"
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /appeals/{id}/decide with outcome REMANDED"
        actor: AppealPanelist
        preconditions:
          - "X-User-ID equals Appeal.panelist_evaluator_id"
        side_effects:
          - "Appeal.decided_at := logical clock"
          - "EvaluationCycle.dispute_state := APPEAL_RESOLVED and EvaluationCycle.status := SCORING (the FINALIZED -> SCORING transition), clearing composite_score, composite_rating, composite_variant, evidence_adjustment, finalized_at and appeal_deadline"
          - "that cycle reversion transitions every ImprovementPlan of the cycle in {ACTIVE, EXTENDED} to VOIDED"
          - "that plan voiding sets Educator.tenure_track_hold := false and recomputes Educator.consecutive_effective_years and Educator.last_composite_rating"
          - "increments EvaluationCycle.version by 1"

  - entity: ImprovementPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED_SUCCESS, COMPLETED_FAIL, VOIDED]
    shape: "branching with a self-referential escalation edge"
    transitions:
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /improvement-plans/{id}/extend"
        actor: HrAdmin
        preconditions:
          - "logical clock <= ImprovementPlan.due_at"
          - "extension_days_used + additional_days <= policy.max_plan_extension_days"
        side_effects:
          - "due_at += additional_days; extension_days_used += additional_days"
          - "increments ImprovementPlan.version by 1"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /improvement-plans/{id}/extend (further extension inside the cumulative cap)"
        actor: HrAdmin
        preconditions:
          - "logical clock <= ImprovementPlan.due_at"
          - "extension_days_used + additional_days <= policy.max_plan_extension_days"
        side_effects:
          - "due_at += additional_days; extension_days_used += additional_days"
          - "increments ImprovementPlan.version by 1"
      - from: ACTIVE
        to: COMPLETED_SUCCESS
        trigger: "POST /improvement-plans/{id}/close with outcome SUCCESS"
        actor: HrAdmin
        preconditions:
          - "logical clock <= ImprovementPlan.due_at"
        side_effects:
          - "Educator.tenure_track_hold := false when no other plan of the educator remains in {ACTIVE, EXTENDED}"
      - from: EXTENDED
        to: COMPLETED_SUCCESS
        trigger: "POST /improvement-plans/{id}/close with outcome SUCCESS"
        actor: HrAdmin
        preconditions:
          - "logical clock <= ImprovementPlan.due_at"
        side_effects:
          - "Educator.tenure_track_hold := false when no other plan of the educator remains in {ACTIVE, EXTENDED}"
      - from: ACTIVE
        to: COMPLETED_FAIL
        trigger: "POST /improvement-plans/{id}/close with outcome FAIL"
        actor: HrAdmin
        preconditions:
          - "logical clock <= ImprovementPlan.due_at"
        side_effects:
          - "if escalation_level == 1 then create a successor ImprovementPlan(prior_plan_id := this plan, escalation_level 2, trigger_reason PRIOR_PLAN_FAILED, status ACTIVE, started_at := logical clock, due_at := started_at + policy.remediation_days) and Educator.tenure_track_hold stays true"
          - "if escalation_level == 2 then Educator.tenure_status := NON_RENEWED and Educator.tenure_track_hold := false"
      - from: EXTENDED
        to: COMPLETED_FAIL
        trigger: "POST /improvement-plans/{id}/close with outcome FAIL"
        actor: HrAdmin
        preconditions:
          - "logical clock <= ImprovementPlan.due_at"
        side_effects:
          - "same escalation branch as the ACTIVE -> COMPLETED_FAIL transition"
      - from: ACTIVE
        to: VOIDED
        trigger: "system — appeal decided MODIFIED to a non-INEFFECTIVE rating or REMANDED, or grievance sustained with remedy PLAN_VOIDED or RATING_VACATED"
        actor: system
        preconditions:
          - "the plan's cycle is being reverted or re-rated"
        side_effects:
          - "Educator.tenure_track_hold := false when no other plan of the educator remains in {ACTIVE, EXTENDED}"
          - "Educator.consecutive_effective_years recomputed"
      - from: EXTENDED
        to: VOIDED
        trigger: "system — appeal decided MODIFIED to a non-INEFFECTIVE rating or REMANDED, or grievance sustained with remedy PLAN_VOIDED or RATING_VACATED"
        actor: system
        preconditions:
          - "the plan's cycle is being reverted or re-rated"
        side_effects:
          - "same as the ACTIVE -> VOIDED transition"

  - entity: Evaluator
    dimension: certification_status
    initial_state: PROVISIONAL
    terminal_states: []
    shape: "cyclic — CERTIFIED -> SUSPENDED -> CERTIFIED through calibration outcomes"
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /calibration-reviews/{id}/decide resolving to PASS"
        actor: HrAdmin
        preconditions:
          - "CalibrationReview.deviation <= policy.calibration_drift_tolerance"
          - "the recomputed Evaluator.calibration_drift_rolling <= policy.calibration_drift_tolerance"
        side_effects:
          - "certification_expires_on := logical clock date + CERTIFICATION_TERM_DAYS"
          - "consecutive_failed_calibrations := 0; passed_calibration_count += 1"
      - from: PROVISIONAL
        to: PROVISIONAL
        trigger: "POST /calibration-reviews/{id}/decide resolving to PASS while the rolling drift is still above tolerance, or resolving to FAIL below the suspension threshold"
        actor: HrAdmin
        preconditions:
          - "the recomputed Evaluator.calibration_drift_rolling > policy.calibration_drift_tolerance, or consecutive_failed_calibrations < policy.calibration_max_consecutive_failures"
        side_effects:
          - "drift variants recomputed; failure counter updated; certification_status unchanged"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /calibration-reviews/{id}/decide resolving to FAIL"
        actor: HrAdmin
        preconditions:
          - "Evaluator.consecutive_failed_calibrations reaches policy.calibration_max_consecutive_failures after this review"
        side_effects:
          - "certification_expires_on := null"
          - "every Observation of this evaluator in {SCHEDULED, CONDUCTED, SCORED, RETURNED} transitions to VOIDED with void_reason EVALUATOR_SUSPENDED (cascade)"
          - "each such voiding bubbles its cycle from SCORING back to SCHEDULING when no observation of that cycle remains in {CONDUCTED, SCORED, SUBMITTED, RETURNED, ACCEPTED}"
      - from: CERTIFIED
        to: CERTIFIED
        trigger: "POST /calibration-reviews/{id}/decide resolving to PASS or to a FAIL below the suspension threshold"
        actor: HrAdmin
        preconditions:
          - "Evaluator.consecutive_failed_calibrations < policy.calibration_max_consecutive_failures after this review"
        side_effects:
          - "drift variants recomputed; certification_expires_on refreshed only on PASS"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /calibration-reviews/{id}/decide resolving to PASS"
        actor: HrAdmin
        preconditions:
          - "CalibrationReview.deviation <= policy.calibration_drift_tolerance"
          - "the recomputed Evaluator.calibration_drift_rolling <= policy.calibration_drift_tolerance"
        side_effects:
          - "consecutive_failed_calibrations := 0; passed_calibration_count += 1"
          - "certification_expires_on := logical clock date + CERTIFICATION_TERM_DAYS"
      - from: SUSPENDED
        to: SUSPENDED
        trigger: "POST /calibration-reviews/{id}/decide resolving to FAIL, or to PASS while the rolling drift is still above tolerance"
        actor: HrAdmin
        preconditions:
          - "the recomputed Evaluator.calibration_drift_rolling > policy.calibration_drift_tolerance, or the review resolves FAIL"
        side_effects:
          - "drift variants recomputed; failure counter updated"

  - entity: Educator
    dimension: tenure_status
    initial_state: PROBATIONARY
    terminal_states: [TENURED, DENIED, NON_RENEWED]
    shape: "branching — recommendation forks into grant or denial; non-renewal is reachable directly"
    transitions:
      - from: PROBATIONARY
        to: RECOMMENDED
        trigger: "POST /educators/{id}/tenure-recommendation with recommendation RECOMMEND"
        actor: HrAdmin
        preconditions:
          - "Educator.completed_service_years >= policy.tenure_required_years"
          - "Educator.consecutive_effective_years >= policy.tenure_min_consecutive_effective"
          - "Educator.tenure_track_hold == false"
        side_effects:
          - "Educator.tenure_recommended_by_user_id := X-User-ID"
        note: "The policy consulted is the one bound to the educator's most recent cycle by school_year ASC then created_at ASC."
      - from: PROBATIONARY
        to: NON_RENEWED
        trigger: "POST /educators/{id}/tenure-recommendation with recommendation NON_RENEW, or system cascade when a level-2 improvement plan closes FAIL"
        actor: HrAdmin | system
        preconditions:
          - "Educator.last_composite_rating IN {INEFFECTIVE, DEVELOPING} for the operator-initiated path"
        side_effects:
          - "Educator.tenure_track_hold := false"
      - from: RECOMMENDED
        to: TENURED
        trigger: "POST /educators/{id}/tenure-decision with decision GRANT"
        actor: HrAdmin
        preconditions:
          - "X-User-ID differs from Educator.tenure_recommended_by_user_id (segregation of duties)"
        side_effects: []
      - from: RECOMMENDED
        to: DENIED
        trigger: "POST /educators/{id}/tenure-decision with decision DENY"
        actor: HrAdmin
        preconditions:
          - "X-User-ID differs from Educator.tenure_recommended_by_user_id (segregation of duties)"
        side_effects: []

  - entity: Grievance
    initial_state: FILED
    terminal_states: [SUSTAINED, DENIED, WITHDRAWN]
    shape: "branching — three terminal outcomes with divergent remedies"
    transitions:
      - from: FILED
        to: SUSTAINED
        trigger: "POST /grievances/{id}/decide with outcome SUSTAIN"
        actor: HrAdmin
        preconditions:
          - "Grievance.status == FILED"
        side_effects:
          - "Grievance.remedy := request remedy (RATING_VACATED or PLAN_VOIDED)"
          - "EvaluationCycle.dispute_state := GRIEVANCE_RESOLVED"
          - "if remedy == RATING_VACATED then the cycle takes its FINALIZED -> SCORING transition, which cascades every ACTIVE or EXTENDED ImprovementPlan of the cycle to VOIDED, which in turn clears Educator.tenure_track_hold"
          - "if remedy == PLAN_VOIDED then every ImprovementPlan of the cycle in {ACTIVE, EXTENDED} transitions to VOIDED, which clears Educator.tenure_track_hold; the rating stands"
      - from: FILED
        to: DENIED
        trigger: "POST /grievances/{id}/decide with outcome DENY"
        actor: HrAdmin
        preconditions:
          - "Grievance.status == FILED"
        side_effects:
          - "Grievance.remedy stays NONE; EvaluationCycle.dispute_state := GRIEVANCE_RESOLVED"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /grievances/{id}/decide with outcome WITHDRAW"
        actor: UnionRep
        preconditions:
          - "Grievance.status == FILED"
        side_effects:
          - "Grievance.remedy stays NONE; EvaluationCycle.dispute_state := GRIEVANCE_RESOLVED"

  - entity: GrowthMeasure
    initial_state: REPORTED
    terminal_states: [CERTIFIED, EXCLUDED]
    shape: "linear fork"
    transitions:
      - from: REPORTED
        to: CERTIFIED
        trigger: "POST /growth-measures/{id}/certify"
        actor: HrAdmin
        preconditions:
          - "EvaluationCycle.status IN {SCHEDULING, SCORING}"
        side_effects:
          - "recompute EvaluationCycle.growth_component per calculations.cycle_growth_component"
          - "increments EvaluationCycle.version by 1"
      - from: REPORTED
        to: EXCLUDED
        trigger: "system — a later GrowthMeasure with the same measure_code is created for the same cycle and supersedes this one"
        actor: system
        preconditions:
          - "an existing REPORTED or CERTIFIED measure of the cycle shares the new measure's measure_code"
        side_effects:
          - "recompute EvaluationCycle.growth_component per calculations.cycle_growth_component"
      - from: CERTIFIED
        to: EXCLUDED
        trigger: "system — a later GrowthMeasure with the same measure_code is created for the same cycle and supersedes this one"
        actor: system
        preconditions:
          - "an existing CERTIFIED measure of the cycle shares the new measure's measure_code"
        side_effects:
          - "recompute EvaluationCycle.growth_component per calculations.cycle_growth_component"

  - entity: EvidenceArtifact
    initial_state: ATTACHED
    terminal_states: [WITHDRAWN]
    shape: "linear with an exact compensating edge"
    transitions:
      - from: ATTACHED
        to: WITHDRAWN
        trigger: "POST /evidence-artifacts/{id}/withdraw"
        actor: Evaluator | Teacher
        preconditions:
          - "Observation.status != VOIDED"
          - "EvaluationCycle.status IN {SCHEDULING, SCORING, SUBMITTED}"
        side_effects:
          - "Observation.evidence_count -= 1"
          - "EvaluationCycle.evidence_artifact_count recomputed (ledger sync)"
          - "increments EvaluationCycle.version by 1"

  - entity: CalibrationReview
    initial_state: PENDING
    terminal_states: [PASS, FAIL]
    shape: "threshold fork"
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /calibration-reviews/{id}/decide when deviation <= policy.calibration_drift_tolerance"
        actor: HrAdmin
        preconditions:
          - "CalibrationReview.outcome == PENDING"
        side_effects:
          - "sequence_index assigned; Evaluator drift variants recomputed per calculations.evaluator_calibration_drift"
          - "Evaluator.consecutive_failed_calibrations := 0; passed_calibration_count += 1; certification transitions per the Evaluator machine"
      - from: PENDING
        to: FAIL
        trigger: "POST /calibration-reviews/{id}/decide when deviation > policy.calibration_drift_tolerance"
        actor: HrAdmin
        preconditions:
          - "CalibrationReview.outcome == PENDING"
        side_effects:
          - "sequence_index assigned; Evaluator drift variants recomputed per calculations.evaluator_calibration_drift"
          - "Evaluator.consecutive_failed_calibrations += 1; certification transitions per the Evaluator machine, including the suspension cascade"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: rubric-score-create-stale-observation
    parent_entity: Observation
    write_endpoint: "POST /observations/{id}/rubric-scores"
    occ_field: "expected_observation_version"
    description: |
      Recording a rubric domain score against an Observation whose version has
      advanced since the client last observed it is rejected. Posting a domain
      that already carries a score legitimately supersedes the earlier row, so
      the write itself is a valid product operation; the stale-version check is
      the only thing that distinguishes a client scoring from a current view
      from a client scoring from a superseded one.
    error_id: ERR_STALE_OBSERVATION_VERSION
    http_status: 412

  - rule_id: growth-measure-create-stale-cycle
    parent_entity: EvaluationCycle
    write_endpoint: "POST /growth-measures"
    occ_field: "expected_cycle_version"
    description: |
      Reporting a GrowthMeasure against an EvaluationCycle whose version has
      advanced since the client last observed it is rejected. A new measure
      sharing an existing measure_code legitimately supersedes the earlier one
      and shifts the growth component, so the second write is a valid product
      operation and only the stale-version check separates a current view from
      a superseded one.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

  - rule_id: plan-extend-stale-plan
    parent_entity: ImprovementPlan
    write_endpoint: "POST /improvement-plans/{id}/extend"
    occ_field: "expected_plan_version"
    description: |
      Extending an ImprovementPlan whose version has advanced since the client
      last observed it is rejected. Extensions are cumulative and a second
      extension is a legitimate operation on its own, so the stale-version
      check is what prevents an operator from granting days against a due date
      that has already moved.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: observation_weighted_score
    trigger: "Observation transitions CONDUCTED -> SCORED or RETURNED -> SCORED (the fourth distinct domain is recorded via POST /observations/{id}/rubric-scores)"
    algorithm: weighted_scoring
    formula: |
      DOMAIN_ORDER = [PLANNING, ENVIRONMENT, INSTRUCTION, PROFESSIONALISM]   # fixed evaluation order
      weight(PLANNING)        = policy.planning_weight_pct
      weight(ENVIRONMENT)     = policy.environment_weight_pct
      weight(INSTRUCTION)     = policy.instruction_weight_pct
      weight(PROFESSIONALISM) = policy.professionalism_weight_pct

      factor = policy.unannounced_multiplier
                 if observation.observation_type == FORMAL and observation.announced == false
                 else 1.00

      # ROUNDING ORDER IS PINNED: round EACH domain contribution to 2 decimals
      # FIRST, then sum the four rounded contributions. The sum is NOT rounded
      # again. "Sum the unrounded contributions and round once" is the WRONG
      # order and produces a different cent in the common case.
      for d in DOMAIN_ORDER:
          contribution[d] = round_half_up(raw_score[d] * weight(d) * factor / 100, 2)
          # persisted as RubricScore.weighted_contribution
      base = contribution[PLANNING] + contribution[ENVIRONMENT]
           + contribution[INSTRUCTION] + contribution[PROFESSIONALISM]

      cap = policy.informal_cap if observation.observation_type == INFORMAL else SCORE_CEILING
      observation.weighted_score = min(base, cap)
    input_set: "Exactly the four non-superseded RubricScore rows of this observation, one per domain_code. Superseded rows are excluded."
    constants:
      SCORE_CEILING: 4.00
    precision: "Each domain contribution is 2 decimal places, round_half_up; the summed base and weighted_score carry those same 2 decimals with no further rounding."
    worked_example: |
      raw PLANNING=3 ENVIRONMENT=2 INSTRUCTION=4 PROFESSIONALISM=3, FORMAL, announced=false,
      weights 22/23/33/22, factor 1.10:
        0.73 + 0.51 + 1.45 + 0.73 = 3.42   (per-domain rounding, the pinned order)
        the forbidden order (sum 3.10 unrounded, then *1.10, then round) yields 3.41

  - name: cycle_observation_component
    trigger: "Observation enters or leaves {SUBMITTED, ACCEPTED} (submit, return, accept, void), and during POST /evaluation-cycles/{id}/submit and POST /evaluation-cycles/{id}/finalize"
    algorithm: aggregation
    formula: |
      counted = observations of the cycle with status IN {SUBMITTED, ACCEPTED}
      formals   = [o in counted where o.observation_type == FORMAL]   ordered by created_at ASC
      informals = [o in counted where o.observation_type == INFORMAL] ordered by created_at ASC

      # Only the earliest required_count observations of each kind score the
      # cycle; later ones are recorded but do not enter the average.
      taken_formals   = first policy.required_formal_count   entries of formals
      taken_informals = first policy.required_informal_count entries of informals

      formal_pool   = [o.weighted_score for o in taken_formals]
      informal_pool = [o.weighted_score for o in taken_informals]

      # variant FINAL only: pad each pool up to its required count with the floor
      if variant == FINAL:
          formal_pool   += [MISSING_OBSERVATION_FLOOR] * max(0, policy.required_formal_count   - len(formal_pool))
          informal_pool += [MISSING_OBSERVATION_FLOOR] * max(0, policy.required_informal_count - len(informal_pool))

      formal_avg   = round_half_up(mean(formal_pool), 4)   if formal_pool   else null
      informal_avg = round_half_up(mean(informal_pool), 4) if informal_pool else null

      if formal_avg is null and informal_avg is null: observation_component = null
      elif informal_avg is null:                      observation_component = formal_avg
      elif formal_avg is null:                        observation_component = informal_avg
      else: observation_component = round_half_up(FORMAL_SHARE * formal_avg + INFORMAL_SHARE * informal_avg, 4)
    input_set: "Observations of the cycle whose status is SUBMITTED or ACCEPTED; SCHEDULED, CONDUCTED, SCORED, RETURNED and VOIDED observations are excluded. Selection inside each kind is by created_at ASC; ties are impossible because created_at carries three fractional digits and is server-minted per row."
    constants:
      FORMAL_SHARE: 0.75
      INFORMAL_SHARE: 0.25
      MISSING_OBSERVATION_FLOOR: 1.00
    precision: "4 decimal places, round_half_up, on formal_avg, informal_avg and observation_component."

  - name: cycle_growth_component
    trigger: "POST /growth-measures, POST /growth-measures/{id}/certify, POST /evaluation-cycles/{id}/submit and POST /evaluation-cycles/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      certified = growth measures of the cycle with status == CERTIFIED
      if certified is empty:
          growth_component = null            # the cycle is growth-EXEMPT
      else:
          coverage_total = sum(m.coverage_pct for m in certified)
          weighted_index = sum(m.index_value * m.coverage_pct for m in certified) / coverage_total
          reliability    = max(RELIABILITY_FLOOR, min(1.00, min(coverage_total, 100) / 100))
          growth_component = round_half_up(1.00 + (weighted_index - 1.00) * reliability, 4)
    input_set: "GrowthMeasure rows of the cycle whose status is CERTIFIED. REPORTED and EXCLUDED measures never enter the sum."
    constants:
      RELIABILITY_FLOOR: 0.60
    precision: "4 decimal places, round_half_up. weighted_index is carried unrounded into the reliability blend."
    worked_example: |
      certified = [(index 3.2, coverage 50), (index 2.4, coverage 30)]
      coverage_total 80; weighted_index (160 + 72)/80 = 2.9; reliability max(0.60, min(1.00, 0.80)) = 0.80
      growth_component = 1.00 + 1.9 * 0.80 = 2.5200

  - name: cycle_composite_score
    trigger: "POST /evaluation-cycles/{id}/submit runs the PROVISIONAL variant; POST /evaluation-cycles/{id}/finalize runs the FINAL variant"
    algorithm: weighted_scoring
    formula: |
      ow = policy.observation_weight_pct / 100
      gw = policy.growth_weight_pct / 100
      oc = cycle_observation_component evaluated under this variant
      gc = cycle_growth_component

      # weight renormalisation: a null component is not scored as zero, it is
      # removed and the surviving component carries the whole composite.
      if gc is null and oc is null: raw = null
      elif gc is null:              raw = oc
      elif oc is null:              raw = gc
      else:                         raw = oc * ow + gc * gw

      composite_pre = round_half_up(raw, 2)
    input_set: "The cycle's counted observations and CERTIFIED growth measures, as filtered by cycle_observation_component and cycle_growth_component."
    constants:
      MISSING_OBSERVATION_FLOOR: 1.00
    precision: "2 decimal places, round_half_up, applied once to raw."
    variants:
      - name: PROVISIONAL
        when: "POST /evaluation-cycles/{id}/submit; sets composite_variant = PROVISIONAL"
        difference: "cycle_observation_component runs WITHOUT floor padding — a cycle short of its required observation counts is scored on what it actually has, and evidence_sufficiency_adjustment is not applied (evidence_adjustment stays 0.00). composite_score = composite_pre."
      - name: FINAL
        when: "POST /evaluation-cycles/{id}/finalize; sets composite_variant = FINAL"
        difference: "cycle_observation_component pads each pool up to its required count with MISSING_OBSERVATION_FLOOR, and evidence_sufficiency_adjustment is then applied on top of composite_pre. Identical stored observations and growth measures therefore yield a different composite_score under the two variants."
    worked_example: |
      required_formal_count 2, required_informal_count 1; one FORMAL weighted 3.33, one INFORMAL weighted 3.00;
      one CERTIFIED growth measure index 3.00 coverage 100 (growth_component 3.0000); weights 60/40.
        PROVISIONAL: formal_avg 3.3300, informal_avg 3.0000, oc 3.2475, raw 3.1485 -> composite 3.15
        FINAL:       formal_pool [3.33, 1.00] -> 2.1650, informal 3.0000, oc 2.3738, raw 2.62428 -> composite_pre 2.62

  - name: evidence_sufficiency_adjustment
    trigger: "POST /evaluation-cycles/{id}/finalize, immediately after the FINAL composite_pre is computed and before composite_rating is assigned"
    algorithm: threshold
    formula: |
      band(x) = HIGHLY_EFFECTIVE if x >= policy.highly_effective_threshold
                EFFECTIVE        if x >= policy.effective_threshold
                DEVELOPING       if x >= policy.developing_threshold
                INEFFECTIVE      otherwise

      # EVALUATION ORDER IS PINNED. The adjustment is keyed on the band of the
      # PRE-adjustment composite; the stored composite_rating is keyed on the
      # band of the POST-adjustment composite. The two bands may differ, and
      # the adjustment is never recomputed against the post-adjustment band.
      pre_band = band(composite_pre)
      if cycle.evidence_artifact_count >= policy.evidence_min_artifacts:
          evidence_adjustment = EVIDENCE_BONUS  if pre_band IN {DEVELOPING, INEFFECTIVE} else 0.00
      else:
          evidence_adjustment = EVIDENCE_PENALTY if pre_band IN {EFFECTIVE, HIGHLY_EFFECTIVE} else 0.00

      composite_score  = round_half_up(min(SCORE_CEILING, max(SCORE_FLOOR, composite_pre + evidence_adjustment)), 2)
      composite_rating = band(composite_score)
    input_set: "cycle.evidence_artifact_count, which counts ATTACHED EvidenceArtifact rows across the cycle's observations whose status is not VOIDED."
    constants:
      EVIDENCE_BONUS: 0.05
      EVIDENCE_PENALTY: -0.10
      SCORE_FLOOR: 1.00
      SCORE_CEILING: 4.00
    precision: "2 decimal places, round_half_up, applied once after the adjustment."
    worked_example: |
      composite_pre 2.55 with 1 attached artifact and evidence_min_artifacts 2:
        pre_band EFFECTIVE -> evidence_adjustment -0.10 -> composite_score 2.45 -> composite_rating DEVELOPING.
      The same cycle with 2 attached artifacts: adjustment 0.00 -> 2.55 -> EFFECTIVE.

  - name: evaluator_calibration_drift
    trigger: "POST /calibration-reviews/{id}/decide, after the review's own outcome is resolved"
    algorithm: aggregation
    formula: |
      decided = calibration reviews of the evaluator with outcome IN {PASS, FAIL},
                ordered by created_at ASC
      window  = the last CALIBRATION_ROLLING_WINDOW entries of decided (all of them when fewer exist)

      calibration_drift_rolling = round_half_up(mean(r.deviation for r in window), 2)
      calibration_drift_anchor  = the deviation of the single last entry of decided

      # Certification consults the ROLLING variant only. An evaluator whose most
      # recent review is perfect but whose window still averages above tolerance
      # stays uncertified.
      review.outcome = PASS if review.deviation <= policy.calibration_drift_tolerance else FAIL
    input_set: "CalibrationReview rows of the evaluator whose outcome is PASS or FAIL, ordered by created_at ASC; PENDING reviews are excluded."
    constants:
      CALIBRATION_ROLLING_WINDOW: 3
      CERTIFICATION_TERM_DAYS: 365
    precision: "2 decimal places, round_half_up, on both variants; deviation itself is 2 decimals."
    variants:
      - name: ROLLING
        when: "always computed; the value certification decisions are taken against"
        difference: "Mean deviation over the last 3 decided reviews. Deviations 1.00 then 0.10 give 0.55."
      - name: ANCHOR
        when: "always computed; reported for evaluator coaching, never consulted by certification"
        difference: "Deviation of the most recent decided review only. The same two reviews give 0.10 — below tolerance while ROLLING is above it, so the evaluator is NOT certified."

  - name: educator_tenure_eligibility
    trigger: "POST /evaluation-cycles/{id}/finalize (recompute), the appeal MODIFIED and REMANDED cascades (recompute), and evaluated as a precondition by POST /educators/{id}/tenure-recommendation"
    algorithm: threshold
    formula: |
      completed_service_years = floor((logical_clock_date - educator.service_start_date) in whole days
                                      / DAYS_PER_SERVICE_YEAR)

      history = cycles of the educator with status IN {FINALIZED, CLOSED},
                ordered by school_year ASC then created_at ASC
      consecutive_effective_years = length of the longest trailing run of `history`
                whose composite_rating IN {EFFECTIVE, HIGHLY_EFFECTIVE}
                (count backwards from the last entry, stop at the first entry that is not)
      last_composite_rating = composite_rating of the last entry of `history`, or null when empty

      eligible = completed_service_years    >= policy.tenure_required_years
             and consecutive_effective_years >= policy.tenure_min_consecutive_effective
             and educator.tenure_track_hold == false
    input_set: "EvaluationCycle rows of the educator whose status is FINALIZED or CLOSED. SCHEDULING, SCORING and SUBMITTED cycles never contribute."
    constants:
      DAYS_PER_SERVICE_YEAR: 365
    precision: "Integer years; both comparisons are >= so an educator at exactly tenure_required_years is eligible."
    worked_example: |
      service_start_date 2023-08-02 with the logical clock at 2026-08-01T00:00:00Z is 1095 days,
      floor(1095/365) = 3 completed service years -> eligible at tenure_required_years 3.
      One day earlier (1094 days) yields 2 and is not eligible.

  - name: school_evaluation_budget
    trigger: "Observation enters SUBMITTED (commit) and leaves SUBMITTED or ACCEPTED via return or void (release)"
    algorithm: aggregation
    formula: |
      stipend(o) = policy.observation_stipend_cents                                 if o.observation_type == FORMAL
                   round_half_up(policy.observation_stipend_cents * INFORMAL_STIPEND_RATIO, 0) if o.observation_type == INFORMAL

      # INVARIANT, evaluated over the whole school at all times:
      school.evaluation_budget_committed_cents
          == sum(o.stipend_cents for o in Observations
                 where o.cycle.educator.school_id == school.id
                   and o.status IN {SUBMITTED, ACCEPTED})
      school.evaluation_budget_remaining_cents
          == school.evaluation_budget_allocated_cents - school.evaluation_budget_committed_cents
    input_set: "Observations whose cycle's educator belongs to the school and whose status is SUBMITTED or ACCEPTED. Every other status contributes 0 and carries stipend_cents == 0."
    constants:
      INFORMAL_STIPEND_RATIO: 0.4
    precision: "Integer cents; the informal stipend rounds half-up to the whole cent."

  - name: rating_distribution_report
    trigger: "GET /reports/rating-distribution"
    algorithm: aggregation
    formula: |
      population = cycles with status IN {FINALIZED, CLOSED} and school_year == query school_year,
                   further restricted to cycles whose educator.school_id == query school_id when supplied
      total_count = len(population)
      for each band b in [INEFFECTIVE, DEVELOPING, EFFECTIVE, HIGHLY_EFFECTIVE]:
          count[b] = number of population cycles with composite_rating == b
          pct[b]   = 0.00 if total_count == 0 else round_half_up(count[b] * 100 / total_count, 2)
      outlier_flag = pct[HIGHLY_EFFECTIVE] > DISTRIBUTION_OUTLIER_PCT     # strict >
    input_set: "EvaluationCycle rows with status FINALIZED or CLOSED for the requested school_year. SUBMITTED cycles carrying a PROVISIONAL composite are excluded."
    constants:
      DISTRIBUTION_OUTLIER_PCT: 35.00
    precision: "Percentages carry 2 decimal places, round_half_up; an empty population yields four 0.00 percentages, total_count 0 and outlier_flag false."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body fields are present, correctly typed, inside their declared ranges and enum members (raw_score 1..4 integer, index_value 1.00..4.00, coverage_pct in (0,100], scheduled_end strictly after scheduled_start, adjusted_composite 1.00..4.00, the four domain weights summing to 100, observation_weight_pct + growth_weight_pct == 100)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "every resource named in the path and every foreign key in the body exists, validated left-to-right in the path then in the body field order declared by the endpoint's input"
    error_id: "ERR_EDUCATOR_NOT_FOUND | ERR_EVALUATOR_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: auth
    check: "for an entity_backed role, X-User-ID equals the resource's owning foreign key — Teacher acts only on cycles, observations, artifacts and appeals of its own Educator; Evaluator acts only on observations whose evaluator_id it is"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /observations, POST /observations/{id}/conduct, POST /observations/{id}/submit, POST /observations/{id}/evidence-artifacts, POST /evidence-artifacts/{id}/withdraw, POST /appeals"

  - priority: 6
    category: auth
    check: "segregation of duties — the appeal panelist is not an evaluator who submitted an observation of the appealed cycle, and the tenure decider's X-User-ID differs from Educator.tenure_recommended_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{id}/review, POST /educators/{id}/tenure-decision"

  - priority: 7
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_OBSERVATION_VERSION | ERR_STALE_CYCLE_VERSION | ERR_STALE_PLAN_VERSION"
    http_status: 412
    applies_to: "POST /observations/{id}/rubric-scores, POST /growth-measures, POST /improvement-plans/{id}/extend"

  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2, including the parent cycle's status and dispute_state guards"
    error_id: "ERR_OBSERVATION_STATE_INVALID | ERR_CYCLE_STATE_INVALID | ERR_PLAN_STATE_INVALID | ERR_APPEAL_STATE_INVALID | ERR_GRIEVANCE_STATE_INVALID | ERR_TENURE_STATE_INVALID"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_referential
    check: "employee_number is unique across all educators"
    error_id: ERR_DUPLICATE_EMPLOYEE_NUMBER
    http_status: 409
    applies_to: "POST /educators"

  - priority: 10
    category: business_safety
    check: "the evaluator named by the operation has certification_status == CERTIFIED"
    error_id: ERR_EVALUATOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /observations, POST /observations/{id}/conduct, POST /appeals/{id}/review"

  - priority: 11
    category: business_safety
    check: "the logical clock date is on or before the evaluator's certification_expires_on"
    error_id: ERR_EVALUATOR_CERTIFICATION_LAPSED
    http_status: 422
    applies_to: "POST /observations, POST /observations/{id}/conduct"

  - priority: 12
    category: state
    check: "the cycle's dispute_state permits the operation (scoring-side writes require dispute_state == NONE)"
    error_id: ERR_DISPUTE_IN_PROGRESS
    http_status: 409
    applies_to: "POST /observations, POST /observations/{id}/conduct, POST /observations/{id}/submit, POST /observations/{id}/return, POST /evaluation-cycles/{id}/submit, POST /evaluation-cycles/{id}/finalize"

  - priority: 13
    category: business_temporal
    check: "the requested [scheduled_start, scheduled_end) window does not intersect any non-VOIDED observation window of the same evaluator; adjacency (one window's end equal to the other's start) is permitted"
    error_id: ERR_EVALUATOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /observations"

  - priority: 14
    category: business_temporal
    check: "for a FORMAL observation, no non-VOIDED FORMAL observation of the same educator (across every cycle of that educator) has a scheduled_start closer than policy.min_days_between_formals whole days; the comparison is strict, so exactly min_days_between_formals days apart is permitted"
    error_id: ERR_FORMAL_SPACING_VIOLATION
    http_status: 409
    applies_to: "POST /observations"

  - priority: 15
    category: business_temporal
    check: "the logical clock is on or before the cycle's appeal_deadline"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appeals"

  - priority: 16
    category: business_temporal
    check: "the logical clock is strictly after the cycle's appeal_deadline"
    error_id: ERR_CLOSE_BEFORE_APPEAL_DEADLINE
    http_status: 422
    applies_to: "POST /evaluation-cycles/{id}/close"

  - priority: 17
    category: business_temporal
    check: "the logical clock is on or before the plan's due_at"
    error_id: ERR_PLAN_PAST_DUE
    http_status: 422
    applies_to: "POST /improvement-plans/{id}/extend, POST /improvement-plans/{id}/close"

  - priority: 19
    category: business_constraint
    check: "no observation of the cycle is left in SCHEDULED, CONDUCTED, SCORED or RETURNED, and completed_formal_count >= 1"
    error_id: ERR_CYCLE_OBSERVATIONS_PENDING
    http_status: 422
    applies_to: "POST /evaluation-cycles/{id}/submit, POST /evaluation-cycles/{id}/finalize"

  - priority: 20
    category: business_referential
    check: "a grievance may only be filed once the internal remedy is exhausted — the referenced appeal is in status UPHELD"
    error_id: ERR_APPEAL_NOT_EXHAUSTED
    http_status: 422
    applies_to: "POST /grievances"

  - priority: 21
    category: business_constraint
    check: "extension_days_used + additional_days does not exceed policy.max_plan_extension_days"
    error_id: ERR_PLAN_EXTENSION_LIMIT
    http_status: 422
    applies_to: "POST /improvement-plans/{id}/extend"

  - priority: 22
    category: business_constraint
    check: "tenure eligibility per calculations.educator_tenure_eligibility — completed_service_years, consecutive_effective_years and the improvement-plan hold"
    error_id: ERR_TENURE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /educators/{id}/tenure-recommendation"

  - priority: 23
    category: business_fiscal
    check: "School.evaluation_budget_committed_cents plus the observation's stipend does not exceed School.evaluation_budget_allocated_cents"
    error_id: ERR_EVALUATION_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /observations/{id}/submit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- policy & school ---
  - method: POST
    path: "/evaluation-policies"
    description: "Create the evaluation policy for a school year. Every omitted field takes its declared default."
    roles: [HrAdmin]
    code: 201
    input: ["school_year", "observation_weight_pct?", "growth_weight_pct?", "planning_weight_pct?", "environment_weight_pct?", "instruction_weight_pct?", "professionalism_weight_pct?", "required_formal_count?", "required_informal_count?", "unannounced_multiplier?", "informal_cap?", "highly_effective_threshold?", "effective_threshold?", "developing_threshold?", "evidence_min_artifacts?", "remediation_days?", "max_plan_extension_days?", "appeal_window_days?", "tenure_required_years?", "tenure_min_consecutive_effective?", "min_days_between_formals?", "calibration_drift_tolerance?", "calibration_max_consecutive_failures?", "observation_stipend_cents?"]
    output: EvaluationPolicy
    side_effects: []

  - method: GET
    path: "/evaluation-policies/{id}"
    description: "Read one policy."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist, UnionRep]
    code: 200
    input: []
    output: EvaluationPolicy
    side_effects: []

  - method: POST
    path: "/schools"
    description: "Create a building and its evaluation stipend budget."
    roles: [HrAdmin]
    code: 201
    input: ["name", "code", "level", "evaluation_budget_allocated_cents?"]
    output: School
    side_effects: []

  - method: GET
    path: "/schools/{id}"
    description: "Read one building, including its committed and remaining stipend budget."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist, UnionRep]
    code: 200
    input: []
    output: School
    side_effects: []

  # --- educators ---
  - method: POST
    path: "/educators"
    description: "Register an educator against a building."
    roles: [HrAdmin]
    code: 201
    input: ["school_id", "employee_number", "full_name", "service_start_date"]
    output: Educator
    side_effects: ["completed_service_years computed against the logical clock"]

  - method: GET
    path: "/educators/{id}"
    description: "Read one educator, with completed_service_years, consecutive_effective_years and tenure_track_hold recomputed against the logical clock."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist, UnionRep]
    code: 200
    input: []
    output: Educator
    side_effects: []

  - method: GET
    path: "/educators"
    description: "List educators, optionally filtered by building or tenure status. Reverse-reachability channel for Educator.school_id."
    roles: [HrAdmin, Evaluator, AppealPanelist, UnionRep]
    code: 200
    input: ["school_id?", "tenure_status?", "limit?", "offset?"]
    output: Educator[]
    side_effects: []

  - method: POST
    path: "/educators/{id}/tenure-recommendation"
    description: "Issue a tenure recommendation or a non-renewal for a probationary educator."
    roles: [HrAdmin]
    code: 200
    input: ["recommendation"]
    output: Educator
    side_effects:
      - "RECOMMEND: tenure_status PROBATIONARY -> RECOMMENDED and tenure_recommended_by_user_id := X-User-ID"
      - "NON_RENEW: tenure_status PROBATIONARY -> NON_RENEWED and tenure_track_hold := false"

  - method: POST
    path: "/educators/{id}/tenure-decision"
    description: "Grant or deny tenure to a recommended educator. The deciding operator must differ from the recommending operator."
    roles: [HrAdmin]
    code: 200
    input: ["decision"]
    output: Educator
    side_effects: ["tenure_status RECOMMENDED -> TENURED or DENIED"]

  # --- evaluators & calibration ---
  - method: POST
    path: "/evaluators"
    description: "Register an evaluator. New evaluators start PROVISIONAL and cannot schedule or conduct observations until a calibration review certifies them."
    roles: [HrAdmin]
    code: 201
    input: ["full_name"]
    output: Evaluator
    side_effects: []

  - method: GET
    path: "/evaluators/{id}"
    description: "Read one evaluator, including both calibration drift variants."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist, UnionRep]
    code: 200
    input: []
    output: Evaluator
    side_effects: []

  - method: POST
    path: "/calibration-reviews"
    description: "Record a blind anchor-lesson re-score for an evaluator. Creation computes deviation and leaves the review PENDING."
    roles: [HrAdmin]
    code: 201
    input: ["evaluator_id", "anchor_lesson_code", "anchor_score", "evaluator_score"]
    output: CalibrationReview
    side_effects: ["deviation computed as round_half_up(abs(evaluator_score - anchor_score), 2)"]

  - method: GET
    path: "/evaluators/{id}/calibration-reviews"
    description: "List an evaluator's calibration reviews, ordered by created_at ASC. Reverse-reachability channel for CalibrationReview.evaluator_id."
    roles: [HrAdmin, Evaluator, AppealPanelist]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: CalibrationReview[]
    side_effects: []

  - method: POST
    path: "/calibration-reviews/{id}/decide"
    description: "Resolve a pending calibration review against the policy tolerance and apply the certification consequences."
    roles: [HrAdmin]
    code: 200
    input: ["policy_id"]
    output: CalibrationReview
    side_effects:
      - "outcome := PASS when deviation <= policy.calibration_drift_tolerance, else FAIL; sequence_index assigned"
      - "Evaluator.calibration_drift_rolling and calibration_drift_anchor recomputed per calculations.evaluator_calibration_drift"
      - "Evaluator certification transitions per the Evaluator state machine, including the SUSPENDED cascade that voids the evaluator's non-terminal observations and bubbles their cycles from SCORING back to SCHEDULING"

  # --- cycles ---
  - method: POST
    path: "/evaluation-cycles"
    description: "Open an evaluation cycle for an educator under a policy."
    roles: [HrAdmin]
    code: 201
    input: ["educator_id", "policy_id", "school_year", "cycle_type?"]
    output: EvaluationCycle
    side_effects: []

  - method: GET
    path: "/evaluation-cycles/{id}"
    description: "Read one cycle, including both state dimensions, all component scores and the current version for OCC."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist, UnionRep]
    code: 200
    input: []
    output: EvaluationCycle
    side_effects: []

  - method: GET
    path: "/evaluation-cycles"
    description: "List cycles with filters. Reverse-reachability channel for EvaluationCycle.educator_id and EvaluationCycle.policy_id."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist, UnionRep]
    code: 200
    input: ["educator_id?", "policy_id?", "school_year?", "status?", "dispute_state?", "limit?", "offset?"]
    output: EvaluationCycle[]
    side_effects: []

  - method: POST
    path: "/evaluation-cycles/{id}/submit"
    description: "Submit the cycle for review, computing the PROVISIONAL composite from the observations actually counted."
    roles: [Evaluator, HrAdmin]
    code: 200
    input: []
    output: EvaluationCycle
    side_effects:
      - "growth_component recomputed; composite_score computed under variant PROVISIONAL; composite_variant := PROVISIONAL; evidence_adjustment := 0.00"
      - "status SCORING -> SUBMITTED"

  - method: POST
    path: "/evaluation-cycles/{id}/finalize"
    description: "Finalize the cycle, computing the FINAL composite with missing-observation flooring and the evidence-sufficiency adjustment."
    roles: [HrAdmin]
    code: 200
    input: []
    output: EvaluationCycle
    side_effects:
      - "composite recomputed under variant FINAL then adjusted per calculations.evidence_sufficiency_adjustment; composite_variant := FINAL"
      - "finalized_at and appeal_deadline set; Educator.last_composite_rating and consecutive_effective_years recomputed"
      - "an INEFFECTIVE rating creates an ACTIVE ImprovementPlan, which sets Educator.tenure_track_hold := true"

  - method: POST
    path: "/evaluation-cycles/{id}/close"
    description: "Close a finalized cycle after its appeal window has strictly elapsed."
    roles: [HrAdmin]
    code: 200
    input: []
    output: EvaluationCycle
    side_effects: ["status FINALIZED -> CLOSED"]

  # --- observations ---
  - method: POST
    path: "/observations"
    description: "Schedule an observation window for an evaluator against a cycle."
    roles: [Evaluator, HrAdmin]
    code: 201
    input: ["cycle_id", "evaluator_id", "observation_type", "scheduled_start", "scheduled_end", "announced?"]
    output: Observation
    side_effects: []

  - method: GET
    path: "/observations/{id}"
    description: "Read one observation, including weighted_score, evidence_count, stipend_cents and the current version for OCC."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist, UnionRep]
    code: 200
    input: []
    output: Observation
    side_effects: []

  - method: GET
    path: "/observations"
    description: "List observations with filters. Reverse-reachability channel for Observation.cycle_id and Observation.evaluator_id."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist, UnionRep]
    code: 200
    input: ["cycle_id?", "evaluator_id?", "status?", "observation_type?", "limit?", "offset?"]
    output: Observation[]
    side_effects: []

  - method: POST
    path: "/observations/{id}/conduct"
    description: "Mark a scheduled observation as conducted. Requires a currently certified, unexpired evaluator."
    roles: [Evaluator]
    code: 200
    input: []
    output: Observation
    side_effects: ["status SCHEDULED -> CONDUCTED", "the cycle bubbles SCHEDULING -> SCORING on the first conducted observation"]

  - method: POST
    path: "/observations/{id}/rubric-scores"
    description: "Record or replace one rubric domain score. Guarded by the observation's version; the response carries the observation's version after the write so a client can chain the next score."
    roles: [Evaluator]
    code: 201
    input: ["domain_code", "raw_score", "expected_observation_version"]
    output: RubricScore
    side_effects:
      - "any prior RubricScore for the same observation and domain_code is marked superseded"
      - "weighted_contribution computed; scored_domain_count refreshed"
      - "the observation transitions CONDUCTED -> SCORED or RETURNED -> SCORED once four domains are present, recomputing weighted_score"
      - "increments Observation.version by 1"

  - method: GET
    path: "/observations/{id}/rubric-scores"
    description: "List an observation's rubric scores, superseded rows included. Reverse-reachability channel for RubricScore.observation_id."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist]
    code: 200
    input: ["domain_code?", "limit?", "offset?"]
    output: RubricScore[]
    side_effects: []

  - method: POST
    path: "/observations/{id}/evidence-artifacts"
    description: "Attach an evidence artifact to an observation. Both the observing evaluator and the observed teacher may attach."
    roles: [Evaluator, Teacher]
    code: 201
    input: ["artifact_type", "title"]
    output: EvidenceArtifact
    side_effects:
      - "Observation.evidence_count += 1"
      - "EvaluationCycle.evidence_artifact_count recomputed; increments EvaluationCycle.version by 1"

  - method: GET
    path: "/observations/{id}/evidence-artifacts"
    description: "List an observation's artifacts. Reverse-reachability channel for EvidenceArtifact.observation_id."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EvidenceArtifact[]
    side_effects: []

  - method: POST
    path: "/evidence-artifacts/{id}/withdraw"
    description: "Withdraw an attached artifact — the exact compensating action for an attach."
    roles: [Evaluator, Teacher]
    code: 200
    input: []
    output: EvidenceArtifact
    side_effects:
      - "status ATTACHED -> WITHDRAWN; Observation.evidence_count -= 1"
      - "EvaluationCycle.evidence_artifact_count recomputed; increments EvaluationCycle.version by 1"

  - method: POST
    path: "/observations/{id}/submit"
    description: "Submit a fully scored observation, committing its stipend against the school budget."
    roles: [Evaluator]
    code: 200
    input: []
    output: Observation
    side_effects:
      - "status SCORED -> SUBMITTED; stipend_cents committed per calculations.school_evaluation_budget"
      - "School committed and remaining budget updated; cycle counters and observation_component recomputed"

  - method: POST
    path: "/observations/{id}/return"
    description: "Return a submitted observation for rescoring, releasing its stipend."
    roles: [HrAdmin]
    code: 200
    input: ["return_reason"]
    output: Observation
    side_effects:
      - "status SUBMITTED -> RETURNED; return_count += 1; stipend released"
      - "cycle counters and observation_component recomputed"

  - method: POST
    path: "/observations/{id}/accept"
    description: "Accept a submitted observation as final for the cycle."
    roles: [HrAdmin]
    code: 200
    input: []
    output: Observation
    side_effects: ["status SUBMITTED -> ACCEPTED; no ledger movement"]

  - method: POST
    path: "/observations/{id}/void"
    description: "Void an observation, releasing any committed stipend and detaching its evidence from the cycle ledger."
    roles: [HrAdmin]
    code: 200
    input: ["void_reason"]
    output: Observation
    side_effects:
      - "status -> VOIDED; stipend released and stipend_cents := 0"
      - "cycle counters, evidence_artifact_count and observation_component recomputed; the cycle may bubble SCORING -> SCHEDULING"

  # --- growth measures ---
  - method: POST
    path: "/growth-measures"
    description: "Report a student-growth measure against a cycle. Guarded by the cycle's version; the response carries the cycle's version after the write."
    roles: [HrAdmin]
    code: 201
    input: ["cycle_id", "measure_code", "index_value", "coverage_pct", "expected_cycle_version"]
    output: GrowthMeasure
    side_effects:
      - "any existing measure of the cycle with the same measure_code transitions to EXCLUDED"
      - "growth_component recomputed; increments EvaluationCycle.version by 1"

  - method: GET
    path: "/evaluation-cycles/{id}/growth-measures"
    description: "List a cycle's growth measures. Reverse-reachability channel for GrowthMeasure.cycle_id."
    roles: [HrAdmin, Evaluator, Teacher, AppealPanelist, UnionRep]
    code: 200
    input: ["status?", "measure_code?", "limit?", "offset?"]
    output: GrowthMeasure[]
    side_effects: []

  - method: POST
    path: "/growth-measures/{id}/certify"
    description: "Certify a reported growth measure so that it enters the growth component."
    roles: [HrAdmin]
    code: 200
    input: []
    output: GrowthMeasure
    side_effects: ["status REPORTED -> CERTIFIED; growth_component recomputed; increments EvaluationCycle.version by 1"]

  # --- improvement plans ---
  - method: GET
    path: "/improvement-plans/{id}"
    description: "Read one improvement plan, including due_at, extension_days_used, escalation_level and the current version for OCC."
    roles: [HrAdmin, Teacher, UnionRep, Evaluator]
    code: 200
    input: []
    output: ImprovementPlan
    side_effects: []

  - method: GET
    path: "/improvement-plans"
    description: "List improvement plans with filters. Reverse-reachability channel for ImprovementPlan.cycle_id, ImprovementPlan.educator_id and the self-referential ImprovementPlan.prior_plan_id. Ordered by created_at ASC."
    roles: [HrAdmin, Teacher, UnionRep, Evaluator]
    code: 200
    input: ["cycle_id?", "educator_id?", "prior_plan_id?", "status?", "limit?", "offset?"]
    output: ImprovementPlan[]
    side_effects: []

  - method: POST
    path: "/improvement-plans/{id}/extend"
    description: "Extend a plan's remediation deadline inside the cumulative policy cap. Guarded by the plan's version."
    roles: [HrAdmin]
    code: 200
    input: ["additional_days", "expected_plan_version"]
    output: ImprovementPlan
    side_effects:
      - "status -> EXTENDED; due_at advanced; extension_days_used increased"
      - "increments ImprovementPlan.version by 1"

  - method: POST
    path: "/improvement-plans/{id}/close"
    description: "Close a plan as successful or failed. A failed first plan spawns an escalated successor; a failed escalated plan non-renews the educator."
    roles: [HrAdmin]
    code: 200
    input: ["outcome"]
    output: ImprovementPlan
    side_effects:
      - "SUCCESS: status -> COMPLETED_SUCCESS; Educator.tenure_track_hold cleared when no other plan is open"
      - "FAIL at escalation_level 1: status -> COMPLETED_FAIL and a successor plan is created with prior_plan_id set"
      - "FAIL at escalation_level 2: status -> COMPLETED_FAIL and Educator.tenure_status -> NON_RENEWED"

  # --- appeals ---
  - method: POST
    path: "/appeals"
    description: "File an appeal against a finalized rating inside the appeal window."
    roles: [Teacher]
    code: 201
    input: ["cycle_id", "grounds", "statement"]
    output: Appeal
    side_effects: ["EvaluationCycle.dispute_state NONE -> APPEALED; increments EvaluationCycle.version by 1"]

  - method: GET
    path: "/appeals/{id}"
    description: "Read one appeal."
    roles: [HrAdmin, Teacher, AppealPanelist, UnionRep, Evaluator]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/appeals"
    description: "List appeals with filters. Reverse-reachability channel for Appeal.cycle_id, Appeal.educator_id and Appeal.panelist_evaluator_id."
    roles: [HrAdmin, Teacher, AppealPanelist, UnionRep, Evaluator]
    code: 200
    input: ["cycle_id?", "educator_id?", "panelist_evaluator_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/appeals/{id}/review"
    description: "Open review of a filed appeal. The acting panelist must be certified and must not have evaluated the cycle."
    roles: [AppealPanelist]
    code: 200
    input: []
    output: Appeal
    side_effects: ["status FILED -> UNDER_REVIEW; panelist_evaluator_id := X-User-ID"]

  - method: POST
    path: "/appeals/{id}/decide"
    description: "Decide an appeal under review. UPHELD leaves the rating alone; MODIFIED replaces the composite; REMANDED reverts the cycle to SCORING."
    roles: [AppealPanelist]
    code: 200
    input: ["outcome", "adjusted_composite?"]
    output: Appeal
    side_effects:
      - "status UNDER_REVIEW -> UPHELD | MODIFIED | REMANDED with the divergent side-effect sets declared in §1.2"
      - "EvaluationCycle.dispute_state APPEALED -> APPEAL_RESOLVED; increments EvaluationCycle.version by 1"

  # --- grievances ---
  - method: POST
    path: "/grievances"
    description: "File a union grievance once the internal appeal remedy is exhausted."
    roles: [UnionRep]
    code: 201
    input: ["appeal_id", "article_code"]
    output: Grievance
    side_effects: ["EvaluationCycle.dispute_state APPEAL_RESOLVED -> GRIEVED; increments EvaluationCycle.version by 1"]

  - method: GET
    path: "/grievances/{id}"
    description: "Read one grievance."
    roles: [HrAdmin, UnionRep, Teacher]
    code: 200
    input: []
    output: Grievance
    side_effects: []

  - method: GET
    path: "/grievances"
    description: "List grievances with filters. Reverse-reachability channel for Grievance.appeal_id and Grievance.educator_id."
    roles: [HrAdmin, UnionRep, Teacher]
    code: 200
    input: ["appeal_id?", "educator_id?", "status?", "limit?", "offset?"]
    output: Grievance[]
    side_effects: []

  - method: POST
    path: "/grievances/{id}/decide"
    description: "Sustain, deny or withdraw a filed grievance. SUSTAIN applies the requested remedy."
    roles: [HrAdmin, UnionRep]
    code: 200
    input: ["outcome", "remedy?"]
    output: Grievance
    side_effects:
      - "status FILED -> SUSTAINED | DENIED | WITHDRAWN; EvaluationCycle.dispute_state GRIEVED -> GRIEVANCE_RESOLVED"
      - "SUSTAIN with RATING_VACATED reverts the cycle FINALIZED -> SCORING and cascades plan voiding; SUSTAIN with PLAN_VOIDED voids the plans only"

  # --- reporting ---
  - method: GET
    path: "/reports/rating-distribution"
    description: "Rating distribution over the finalized and closed cycles of a school year, optionally scoped to one building."
    roles: [HrAdmin, UnionRep]
    code: 200
    input: ["school_year", "school_id?"]
    output: { school_year: string, school_id: string, total_count: integer, ineffective_count: integer, developing_count: integer, effective_count: integer, highly_effective_count: integer, ineffective_pct: number, developing_pct: number, effective_pct: number, highly_effective_pct: number, outlier_flag: boolean }
    side_effects: []

  # --- test-driving surface ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, expiry, service-year and window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [HrAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["subsequent completed_service_years, due_at, appeal_deadline and certification-expiry comparisons read the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource whose owning foreign key is not its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the appeal panelist evaluated the cycle under appeal, or the tenure decider is the tenure recommender"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, mistyped, outside its declared range, or not an enum member"
  - id: ERR_EDUCATOR_NOT_FOUND
    http: 404
    condition: "the referenced educator does not exist"
  - id: ERR_EVALUATOR_NOT_FOUND
    http: 404
    condition: "the referenced evaluator does not exist"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "the referenced evaluation cycle does not exist"
  - id: ERR_OBSERVATION_NOT_FOUND
    http: 404
    condition: "the referenced observation does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "the referenced improvement plan does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "the referenced appeal does not exist"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a referenced school, policy, growth measure, evidence artifact, grievance or calibration review does not exist"
  - id: ERR_DUPLICATE_EMPLOYEE_NUMBER
    http: 409
    condition: "an educator already exists with the requested employee_number"
  - id: ERR_STALE_OBSERVATION_VERSION
    http: 412
    condition: "expected_observation_version does not equal the observation's current version"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal the cycle's current version"
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not equal the improvement plan's current version"
  - id: ERR_OBSERVATION_STATE_INVALID
    http: 409
    condition: "the observation is not in a state from which the requested transition is declared"
  - id: ERR_CYCLE_STATE_INVALID
    http: 409
    condition: "the cycle is not in a status from which the requested transition is declared"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "the improvement plan is not in a state from which the requested transition is declared"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "the appeal is not in a state from which the requested transition is declared"
  - id: ERR_GRIEVANCE_STATE_INVALID
    http: 409
    condition: "the grievance is not FILED when a decision is attempted"
  - id: ERR_TENURE_STATE_INVALID
    http: 409
    condition: "the educator's tenure_status does not permit the requested recommendation or decision"
  - id: ERR_DISPUTE_IN_PROGRESS
    http: 409
    condition: "a scoring-side write is attempted while the cycle's dispute_state is not NONE"
  - id: ERR_EVALUATOR_NOT_CERTIFIED
    http: 422
    condition: "the evaluator's certification_status is PROVISIONAL or SUSPENDED"
  - id: ERR_EVALUATOR_CERTIFICATION_LAPSED
    http: 422
    condition: "the logical clock date is after the evaluator's certification_expires_on"
  - id: ERR_EVALUATOR_WINDOW_CONFLICT
    http: 409
    condition: "the requested window intersects another non-VOIDED observation window of the same evaluator"
  - id: ERR_FORMAL_SPACING_VIOLATION
    http: 409
    condition: "a FORMAL observation starts closer than policy.min_days_between_formals whole days to another non-VOIDED FORMAL observation of the same educator"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "an appeal is filed after the cycle's appeal_deadline"
  - id: ERR_CLOSE_BEFORE_APPEAL_DEADLINE
    http: 422
    condition: "a cycle is closed on or before its appeal_deadline"
  - id: ERR_PLAN_PAST_DUE
    http: 422
    condition: "an improvement plan is extended or closed after its due_at"
  - id: ERR_CYCLE_OBSERVATIONS_PENDING
    http: 422
    condition: "a cycle is submitted or finalized while an observation is still SCHEDULED, CONDUCTED, SCORED or RETURNED, or with completed_formal_count == 0"
  - id: ERR_APPEAL_NOT_EXHAUSTED
    http: 422
    condition: "a grievance is filed against an appeal that is not UPHELD"
  - id: ERR_PLAN_EXTENSION_LIMIT
    http: 422
    condition: "extension_days_used plus additional_days exceeds policy.max_plan_extension_days"
  - id: ERR_TENURE_NOT_ELIGIBLE
    http: 422
    condition: "completed_service_years, consecutive_effective_years or the improvement-plan hold blocks the tenure recommendation"
  - id: ERR_EVALUATION_BUDGET_EXCEEDED
    http: 402
    condition: "committing the observation's stipend would push the school's committed budget above its allocation"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HrAdmin
    description: "District HR / evaluation office operator. Owns configuration, cycle lifecycle, observation adjudication, calibration decisions, remediation and tenure."
    identity: opaque
    exclusive_operations:
      - "POST /evaluation-policies"
      - "POST /schools"
      - "POST /educators"
      - "POST /evaluators"
      - "POST /calibration-reviews"
      - "POST /calibration-reviews/{id}/decide"
      - "POST /evaluation-cycles"
      - "POST /evaluation-cycles/{id}/finalize"
      - "POST /evaluation-cycles/{id}/close"
      - "POST /observations/{id}/return"
      - "POST /observations/{id}/accept"
      - "POST /observations/{id}/void"
      - "POST /growth-measures"
      - "POST /growth-measures/{id}/certify"
      - "POST /improvement-plans/{id}/extend"
      - "POST /improvement-plans/{id}/close"
      - "POST /educators/{id}/tenure-recommendation"
      - "POST /educators/{id}/tenure-decision"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /observations (shared with Evaluator)"
      - "POST /evaluation-cycles/{id}/submit (shared with Evaluator)"
      - "POST /grievances/{id}/decide (shared with UnionRep)"
      - "all GET reads"
    notes: "Two HrAdmin operators are distinguished only by X-User-ID; the tenure segregation-of-duties rule compares those ids."

  - name: Evaluator
    description: "Principal or assistant principal who schedules, conducts, scores and submits observations for cycles they are assigned to."
    identity: "entity_backed:Evaluator"
    exclusive_operations:
      - "POST /observations/{id}/conduct"
      - "POST /observations/{id}/rubric-scores"
      - "POST /observations/{id}/submit"
    shared_operations:
      - "POST /observations (shared with HrAdmin)"
      - "POST /evaluation-cycles/{id}/submit (shared with HrAdmin)"
      - "POST /observations/{id}/evidence-artifacts (shared with Teacher)"
      - "POST /evidence-artifacts/{id}/withdraw (shared with Teacher)"
    notes: "X-User-ID must equal Observation.evaluator_id for every observation-scoped write."

  - name: Teacher
    description: "The educator being evaluated. May contribute evidence and file an appeal against their own finalized rating."
    identity: "entity_backed:Educator"
    exclusive_operations:
      - "POST /appeals"
    shared_operations:
      - "POST /observations/{id}/evidence-artifacts (shared with Evaluator)"
      - "POST /evidence-artifacts/{id}/withdraw (shared with Evaluator)"
      - "GET reads of their own educator, cycles, observations, artifacts, plans, appeals and grievances"
    notes: "X-User-ID must equal the Educator id reached through the resource's cycle."

  - name: AppealPanelist
    description: "A certified evaluator seconded to an appeal panel. Reviews and decides appeals on cycles they did not evaluate."
    identity: "entity_backed:Evaluator"
    exclusive_operations:
      - "POST /appeals/{id}/review"
      - "POST /appeals/{id}/decide"
    shared_operations:
      - "GET reads of educators, evaluators, cycles, observations, rubric scores, artifacts and appeals"
    notes: "X-User-ID is an Evaluator id. Segregation of duties forbids acting on a cycle where that evaluator submitted an observation."

  - name: UnionRep
    description: "Union representative who files and withdraws grievances on behalf of educators."
    identity: opaque
    exclusive_operations:
      - "POST /grievances"
    shared_operations:
      - "POST /grievances/{id}/decide (shared with HrAdmin; UnionRep may only issue WITHDRAW)"
      - "GET reads of educators, cycles, plans, appeals, grievances and the rating-distribution report"
    notes: "Operational identity only; never compared against a persisted entity id."
