          assert:
            - "response.meta.api_request_id present"
            - "response.response_type == 'object'"
            - "response.data.id == ${project_id}"

      - name: put_talent_occ_version_conflict
        claim_type: cross_cutting_occ
        grounds: ["concurrency_rules[talent-roster-update-stale-version]"]
        distinguishing_aspect: "PUT /api/talents/{id} with stale expected_talent_version returns ERR_STALE_VERSION 412"
        test_recipe:
          setup: ["talent created (version=1); update once (version=2)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { t_id: $.data.id, t_v1: $.data.version }
            - call: "PUT /api/talents/${t_id}"
              payload: { stage_name: "Vox2", expected_talent_version: "${t_v1}" }
              as: CastingDirector
          trigger:
            - call: "PUT /api/talents/${t_id}"
              payload: { stage_name: "Vox3", expected_talent_version: "${t_v1}" }
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "http_status == 412"

      - name: project_cancel_occ_version_conflict
        claim_type: cross_cutting_occ
        grounds: ["concurrency_rules[project-cancel-stale-version]"]
        distinguishing_aspect: "POST /projects/{id}/cancel with stale expected_project_version returns ERR_STALE_VERSION"
        test_recipe:
          setup: ["project created (version=1); open_casting bumps version to 2"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id, p_v1: $.data.version }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /api/projects/${project_id}/cancel"
              payload: { expected_project_version: "${p_v1}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"

