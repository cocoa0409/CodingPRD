      - name: expiry_sweep_cascades_domain_subscription_addon
        grounds:
          - calculations.domain_expiry_sweep
          - state_machines.Domain.lifecycle_status.ACTIVE_to_EXPIRED
          - state_machines.HostingSubscription.ACTIVE_to_SUSPENDED
          - state_machines.AddOn.ACTIVE_to_SUSPENDED
