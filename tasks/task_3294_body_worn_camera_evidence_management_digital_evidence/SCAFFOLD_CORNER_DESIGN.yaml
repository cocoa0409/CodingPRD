# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3294_body_worn_camera_evidence_management_digital_evidence
# Breadth probe over the §1.1–§1.7 surface; §1.8-covered corners appear as
# excluded_because stubs. Every chain replays against the scaffold's own
# §1.2/§1.4/§1.6. Clock pinned at 2026-09-01T00:00:00Z in every chain that
# touches time. Valid fixture hashes are exactly 64 lowercase [0-9a-f] chars;
# any other char is a declared integrity mismatch.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: agency_create_returns_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.Agency
          - endpoints.POST_/agencies
          - response_envelope
        distinguishing_aspect: "Creating an agency with only a name returns 201 with response_type object, default timezone UTC, storage_used_bytes 0, storage_posture OK, version 1, and system-stamped id/created_at/updated_at — none of the computed fields accept client input."
        test_recipe:
          setup:
            - "Empty database; logical clock at default 2026-09-01T00:00:00Z (no set call needed)."
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          assert:
            - "status 201 and response_type == object"
            - "Agency.${ag}.timezone == UTC and storage_used_bytes == 0 and storage_posture == OK and version == 1"
            - "data carries non-null id, created_at, updated_at; meta.api_request_id present"

      - name: officer_required_fields_missing_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Officer
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST officers without rank (a required input field with no default) is rejected 422 ERR_VALIDATION before any officer row is created."
        test_recipe:
          setup:
            - "Agency exists."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-1", full_name: "Ana Ruiz" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 422 and err == ERR_VALIDATION"

      - name: recording_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/agencies/{agencyId}/recordings
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two recordings uploaded, limit=1&offset=0 returns 1 row, total_count 2, has_more true; offset=1 returns the second row with has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup:
            - "Agency with ACTIVE policy (tagging true, rate 0). Officer with assigned device; two ACTIVE INCIDENT recordings uploaded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:01:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
          trigger:
            - call: "GET /agencies/recordings?agency_id=${ag}&limit=1&offset=0"
              payload: {}
              as: Supervisor
          assert:
            - "response_type == array and data has 1 entry; meta pagination: total_count == 2 and has_more == true"

      - name: get_recording_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/agencies/{agencyId}/recordings/{recordingId}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but nonexistent recording UUID returns 404 ERR_NOT_FOUND — not a 500 and not an empty object."
        test_recipe:
          setup:
            - "Agency exists."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "GET /agencies/${ag}/recordings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RecordsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "status 404 and err == ERR_NOT_FOUND"

      - name: device_serial_uniqueness_scoped_per_agency
        claim_type: Type Constraints
        grounds:
          - entities.Device.fields.serial_number
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Registering two devices with serial SN-1 in the same agency fails the second with 422 ERR_VALIDATION, while the same serial in a DIFFERENT agency succeeds — uniqueness is agency-scoped, not global."
        test_recipe:
          setup:
            - "Two agencies A and B; device SN-1 registered in A."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { aga: $.data.id }
            - call: "POST /agencies"
              payload: { name: "County SO" }
              as: AgencyAdmin
              captures: { agb: $.data.id }
            - call: "POST /agencies/${aga}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
          trigger:
            - call: "POST /agencies/${aga}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /agencies/${agb}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { devb: $.data.id }
          assert:
            - "duplicate-in-A: status 422, err == ERR_VALIDATION"
            - "same-serial-in-B: status 201 and Device.${devb}.serial_number == SN-1"

      - name: audit_log_entry_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.AuditLogEntry
          - entities.CustodyEvent
        distinguishing_aspect: "AuditLogEntry and CustodyEvent carry common_fields false (no version/updated_at) and the §1.5 surface exposes no PUT/PATCH/DELETE for them — the audit trail and custody chain are append-only; any update attempt has no matching route and returns 404."
        test_recipe:
          setup:
            - "Agency exists; one audit-producing action has run (agency creation)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "GET /agencies/audit-log/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 404 and err == ERR_NOT_FOUND (the append-only log exposes read-only access; mutation verbs have no route and arbitrary ids never resolve)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: recording_upload_initial_state_and_terminal_purge_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Recording
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A PURGED recording rejects every further transition: categorize, reverify, mark-reviewed all return 409 ERR_INVALID_STATE (or 404 where the implementation treats purged rows as gone — the pinned contract is ERR_INVALID_STATE because PURGED recordings remain queryable for audit)."
        test_recipe:
          setup:
            - "Agency with ACTIVE policy (tagging true, rate 0); officer with assigned device; one ACTIVE INCIDENT recording; clock advanced 200 days; retention run executed (recording PURGED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rec: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/retention/run"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "PATCH /agencies/${ag}/recordings/${rec}/categorize"
              payload: { category: "ARREST" }
              as: Officer
              as_user_id: "${officer}"
              captures: { err: $.data.error_id }
          assert:
            - "status 409 and err == ERR_INVALID_STATE"
            - "Recording.${rec}.upload_status == PURGED still"

      - name: case_reopen_cycle_under_review_to_open_then_resubmit
        claim_type: Valid Transition
        grounds:
          - state_machines.CaseEntity.UNDER_REVIEW_to_OPEN
          - state_machines.CaseEntity.OPEN_to_UNDER_REVIEW
        distinguishing_aspect: "The reopen loop UNDER_REVIEW -> OPEN -> UNDER_REWORK -> UNDER_REVIEW works repeatedly: after reopen, evidence can be added (link requires OPEN) and the case re-submits — proving OPEN is re-enterable, not one-shot."
        test_recipe:
          setup:
            - "Agency with ACTIVE policy (tagging true, rate 0); officer with assigned device; two ACTIVE recordings; case with recording A linked and submitted (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { ra: $.data.id }
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:01:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rb: $.data.id }
            - call: "POST /agencies/${ag}/cases"
              payload: { case_number: "CN-1", title: "Case One", lead_officer_id: "${officer}" }
              as: Officer
              as_user_id: "${officer}"
              captures: { cs: $.data.id }
            - call: "POST /agencies/${ag}/cases/${cs}/evidence"
              payload: { recording_id: "${ra}" }
              as: Officer
              as_user_id: "${officer}"
            - call: "POST /agencies/${ag}/cases/${cs}/submit-review"
              payload: {}
              as: Officer
              as_user_id: "${officer}"
          trigger:
            - call: "POST /agencies/${ag}/cases/${cs}/reopen"
              payload: {}
              as: Supervisor
              as_user_id: "${officer}"
            - call: "POST /agencies/${ag}/cases/${cs}/evidence"
              payload: { recording_id: "${rb}" }
              as: Officer
              as_user_id: "${officer}"
            - call: "POST /agencies/${ag}/cases/${cs}/submit-review"
              payload: {}
              as: Officer
              as_user_id: "${officer}"
          assert:
            - "after reopen CaseEntity.${cs}.status == OPEN"
            - "link of recording B succeeds only in OPEN — evidence_count == 2 after the link"
            - "final resubmit: CaseEntity.${cs}.status == UNDER_REVIEW"

      - name: invalid_transition_close_from_open_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CaseEntity
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Case close from OPEN (skipping UNDER_REVIEW) is not in the transition table — rejected 409 ERR_INVALID_STATE even when the case has linked, fully-reviewed evidence."
        test_recipe:
          setup:
            - "Agency with ACTIVE policy (tagging true, rate 0); officer with assigned device; one ACTIVE recording linked to an OPEN case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rec: $.data.id }
            - call: "POST /agencies/${ag}/cases"
              payload: { case_number: "CN-1", title: "Case One", lead_officer_id: "${officer}" }
              as: Officer
              as_user_id: "${officer}"
              captures: { cs: $.data.id }
            - call: "POST /agencies/${ag}/cases/${cs}/evidence"
              payload: { recording_id: "${rec}" }
              as: Officer
              as_user_id: "${officer}"
          trigger:
            - call: "POST /agencies/${ag}/cases/${cs}/close"
              payload: {}
              as: Supervisor
              as_user_id: "${officer}"
              captures: { err: $.data.error_id }
          assert:
            - "status 409 and err == ERR_INVALID_STATE"
            - "CaseEntity.${cs}.status == OPEN still"

      - name: redaction_release_side_effects_write_custody_and_audit
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RedactionJob.APPROVED_to_RELEASED
          - entities.CustodyEvent
          - entities.AuditLogEntry
        distinguishing_aspect: "Releasing an APPROVED redaction job writes BOTH a CustodyEvent REDACTION_RELEASED on the recording AND an AuditLogEntry REDACTION_RELEASED on the agency log — both side effects fire, not just the status flip."
        test_recipe:
          setup:
            - "Agency with ACTIVE policy (tagging true, rate 0); officer with assigned device; one ACTIVE recording; redaction job driven QUEUED -> IN_PROGRESS -> SUBMITTED -> APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 600, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rec: $.data.id }
            - call: "POST /agencies/${ag}/recordings/${rec}/redaction-jobs"
              payload: { request_reference: "PRR-1", scope_face: true, scope_audio: false, passes: "SINGLE_PASS" }
              as: RecordsOfficer
              captures: { job: $.data.id }
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/start"
              payload: {}
              as: RedactionTechnician
              as_user_id: "tech-1"
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/submit"
              payload: { actual_minutes: 25 }
              as: RedactionTechnician
              as_user_id: "tech-1"
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/approve"
              payload: {}
              as: RecordsOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/release"
              payload: {}
              as: RecordsOfficer
              as_user_id: "ro-1"
            - call: "GET /agencies/${ag}/recordings/${rec}/custody-events"
              payload: {}
              as: RecordsOfficer
            - call: "GET /agencies/audit-log?agency_id=${ag}&action=REDACTION_RELEASED"
              payload: {}
              as: RecordsOfficer
          assert:
            - "RedactionJob.${job}.status == RELEASED"
            - "custody-events list contains an entry with event_type == REDACTION_RELEASED"
            - "audit-log list contains an entry with action == REDACTION_RELEASED and entity_id == ${job} or ${rec}"

      - name: idempotent_double_revoke_second_call_fails
        claim_type: Idempotency
        grounds:
          - state_machines.ShareGrant.ACTIVE_to_REVOKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Revoking the same grant twice: first call succeeds (ACTIVE -> REVOKED), second call returns 409 ERR_INVALID_STATE — the action is not silently idempotent; the state machine owns the duplicate detection."
        test_recipe:
          setup:
            - "Agency with ACTIVE policy; officer with assigned device; one ACTIVE recording linked to a CLOSED case; one ACTIVE share grant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rec: $.data.id }
            - call: "POST /agencies/${ag}/cases"
              payload: { case_number: "CN-1", title: "Case One", lead_officer_id: "${officer}" }
              as: Officer
              as_user_id: "${officer}"
              captures: { cs: $.data.id }
            - call: "POST /agencies/${ag}/cases/${cs}/evidence"
              payload: { recording_id: "${rec}" }
              as: Officer
              as_user_id: "${officer}"
            - call: "POST /agencies/${ag}/cases/${cs}/submit-review"
              payload: {}
              as: Officer
              as_user_id: "${officer}"
