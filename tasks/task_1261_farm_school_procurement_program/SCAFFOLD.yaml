scenario: |
  1261. Farm-to-School Procurement Program (district farm-to-school program):
  local product definition & geographic preference, forecast of menu need &
  grower planting agreement, food-safety/insurance requirement for small farms,
  delivery scheduling to school kitchens, invoicing & reimbursement claim
  compliance, taste test & menu adoption cycle, seasonality gap & substitution,
  program reporting & grant match

domain_name: farm-school-procurement
api_prefix: /f2s

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - conditional_feature_flags
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FKs via body/fields)
# =============================================================================
entities:
  - name: ProgramYear
    parent: null
    common_fields: true
    fields:
      - { name: school_year_label, type: string, source: input, description: "Human label, e.g. 2026-27" }
      - { name: start_date, type: string, source: input, description: "ISO date; week 1 begins here (YYYY-MM-DD)" }
      - { name: end_date, type: string, source: input, description: "ISO date; must be after start_date and cover 52 weeks" }
      - { name: local_radius_miles, type: integer, source: input, description: "Farms at distance <= radius are local-eligible; must be >= 25" }
      - { name: preference_model, type: enum, source: input, default: LINEAR, description: "LINEAR | TIERED; selects preference_points variant (feature flag)" }
      - { name: grant_award_cents, type: integer, source: input, description: "State grant award pool in cents (>= 0)" }
      - { name: local_spend_target_pct, type: number, source: input, description: "Reporting target, e.g. 30 means 30.00%" }
      - { name: grant_drawn_cents, type: integer, source: computed, default: 0, description: "Sum of total_awarded_cents over claims in RECONCILED (minus REVERSED)" }
      - { name: grant_remaining_cents, type: integer, source: computed, description: "= grant_award_cents - grant_drawn_cents (conserved, see calculations)" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED" }

  - name: Farm
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Farm legal name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: distance_miles_to_hub, type: integer, source: input, description: "Road miles from district hub; >= 0" }
      - { name: acres, type: number, source: input, description: "Farmed acreage; > 0; <= 500 is a small farm" }
      - { name: is_small_farm, type: boolean, source: computed, description: "= acres <= 500 (SMALL_FARM_MAX_ACRES)" }
      - { name: required_insurance_cents, type: integer, source: computed, description: "= 500000 if is_small_farm else 1000000" }
      - { name: compliance_posture, type: enum, source: computed, description: "COMPLIANT | NON_COMPLIANT; derived from ComplianceDocuments vs a reference date (see calculations.farm_compliance_posture)" }
      - { name: status, type: enum, source: system, description: "APPLIED | APPROVED | SUSPENDED (cycle APPROVED<->SUSPENDED)" }

  - name: ComplianceDocument
    parent: null
    common_fields: true
    fields:
      - { name: farm_id, type: string, source: input, description: "FK -> Farm.id; owning farm" }
      - { name: doc_type, type: enum, source: input, description: "SAFETY_CERT | LIABILITY_INSURANCE" }
      - { name: issuer, type: string, source: input, description: "Issuing body / insurer" }
      - { name: coverage_cents, type: integer, source: input, description: "Liability coverage; required iff doc_type == LIABILITY_INSURANCE" , default: null}
      - { name: effective_on, type: string, source: input, description: "ISO date coverage begins (inclusive)" }
      - { name: expires_on, type: string, source: input, description: "ISO date coverage ends (inclusive); must be > effective_on" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED (clock sweep) | REVOKED (auditor)" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product name, e.g. Roma Tomato" }
      - { name: category, type: enum, source: input, description: "PRODUCE | DAIRY | PROTEIN | GRAIN" }
      - { name: unit, type: enum, source: input, description: "LB | CASE | GALLON | DOZEN" }
      - { name: season_start_week, type: integer, source: input, description: "1..52; season window start (inclusive); wraparound allowed" }
      - { name: season_end_week, type: integer, source: input, description: "1..52; season window end (inclusive); start==end means single week" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

  - name: FarmProductOffering
    parent: null
    common_fields: true
    fields:
      - { name: farm_id, type: string, source: input, description: "FK -> Farm.id; offering farm" }
      - { name: program_year_id, type: string, source: input, description: "FK -> ProgramYear.id; offerings are per-year" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: price_cents_per_unit, type: integer, source: input, description: "> 0" }
      - { name: max_weekly_quantity, type: integer, source: input, description: "> 0" }
      - { name: harvest_start_week, type: integer, source: input, description: "1..52; must be inside product season window" }
      - { name: harvest_end_week, type: integer, source: input, description: "1..52; wraparound allowed mirroring season" }
      - { name: is_local_eligible, type: boolean, source: computed, description: "= farm.distance_miles_to_hub <= program_year.local_radius_miles (pinned at creation)" }
      - { name: preference_points, type: integer, source: computed, description: "Geographic preference score per calculations.preference_points (pinned at creation)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VERIFIED | REJECTED | SUSPENDED | WITHDRAWN" }

  - name: MenuForecastLine
    parent: null
    common_fields: true
    fields:
      - { name: program_year_id, type: string, source: input, description: "FK -> ProgramYear.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: week_number, type: integer, source: input, description: "1..52" }
      - { name: planned_quantity, type: integer, source: input, description: ">= 1; planned units needed district-wide that week" }
      - { name: reserved_quantity, type: integer, source: computed, description: "Sum of committed_quantity over covering agreements (calculations.forecast_coverage)" }
      - { name: uncovered_quantity, type: integer, source: computed, description: "= max(0, planned_quantity - reserved_quantity)" }

  - name: Kitchen
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School kitchen name" }

  - name: ReceivingWindow
    parent: null
    common_fields: false
    fields:
      - { name: kitchen_id, type: string, source: input, description: "FK -> Kitchen.id" }
      - { name: weekday, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN" }
      - { name: start_minute, type: integer, source: input, description: "Minute of day 0..1439; half-open interval start" }
      - { name: end_minute, type: integer, source: input, description: "1..1440; half-open interval end; must be > start_minute" }
      - { name: capacity_deliveries, type: integer, source: input, description: ">= 1; max deliveries sharing this window on one date" }

  - name: PlantingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: program_year_id, type: string, source: input, description: "FK -> ProgramYear.id; must equal offering's year" }
      - { name: offering_id, type: string, source: input, description: "FK -> FarmProductOffering.id; must be VERIFIED" }
      - { name: committed_quantity, type: integer, source: input, description: ">= 1; units the grower commits to deliver over the window" }
      - { name: harvest_start_week, type: integer, source: input, description: "1..52; must be inside offering harvest window" }
      - { name: harvest_end_week, type: integer, source: input, description: "1..52; inside offering harvest window" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Pinned from offering.price_cents_per_unit at creation (version-pinned on approval)" }
      - { name: local_eligible, type: boolean, source: computed, description: "Pinned from offering.is_local_eligible at creation; governs claim reimbursability" }
      - { name: delivered_quantity, type: integer, source: computed, default: 0, description: "Sum of accepted_quantity over ACCEPTED deliveries (calculations.delivered_aggregation)" }
      - { name: remaining_quantity, type: integer, source: computed, description: "= committed_quantity - delivered_quantity while active; 0 in terminal states" }
      - { name: released_quantity, type: integer, source: computed, default: 0, description: "Set to committed - delivered on CANCELLED/BREACHED; 0 otherwise" }
      - { name: status, type: enum, source: system, description: "PROPOSED | SIGNED | AMENDMENT_PROPOSED | FULFILLING | COMPLETED | BREACHED | CANCELLED" }

  - name: AgreementAmendment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> PlantingAgreement.id (path parameter)" }
      - { name: proposed_by_role, type: enum, source: system, description: "FarmManager | DistrictProgramAdmin; from X-User-Role at creation" }
      - { name: new_committed_quantity, type: integer, source: input, default: null, description: ">= delivered_quantity if present" }
      - { name: new_unit_price_cents, type: integer, source: input, default: null, description: "> 0 if present; at least one new_* field required" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | REJECTED | SUPERSEDED" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> PlantingAgreement.id" }
      - { name: kitchen_id, type: string, source: input, description: "FK -> Kitchen.id; receiving kitchen" }
      - { name: window_id, type: string, source: input, description: "FK -> ReceivingWindow.id; must belong to kitchen and match weekday(delivery_date)" }
      - { name: delivery_date, type: string, source: input, description: "ISO date within the program year; >= current clock date" }
      - { name: quantity, type: integer, source: input, description: ">= 1; must fit agreement's uncommitted remainder" }
      - { name: week_number, type: integer, source: computed, description: "= floor((delivery_date - year.start_date)/7) + 1" }
      - { name: accepted_quantity, type: integer, source: system, default: null, description: "Set on ACCEPTED resolution; 1..quantity" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Required on reject" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | ACCEPTED | REJECTED | DISPUTED | CLOSED_REJECTED | CANCELLED | NO_SHOW" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: farm_id, type: string, source: computed, description: "FK -> Farm.id; derived from delivery.agreement.offering.farm_id" }
      - { name: delivery_id, type: string, source: input, description: "FK -> Delivery.id; unique - one invoice per delivery" }
      - { name: agreement_id, type: string, source: computed, description: "FK -> PlantingAgreement.id; derived from delivery" }
      - { name: invoice_number, type: string, source: input, description: "Unique per farm" }
      - { name: quantity_billed, type: integer, source: computed, description: "= delivery.accepted_quantity at creation" }
      - { name: unit_price_cents, type: integer, source: computed, description: "= agreement.unit_price_cents" }
      - { name: subtotal_cents, type: integer, source: computed, description: "= quantity_billed * unit_price_cents" }
      - { name: incentive_credit_cents, type: integer, source: computed, description: "Geographic incentive per calculations.invoice_pricing" }
      - { name: total_cents, type: integer, source: computed, description: "= subtotal_cents + incentive_credit_cents" }
      - { name: farm_compliant_at_delivery, type: boolean, source: computed, description: "Snapshot: farm posture evaluated at delivery.delivery_date (audit trail)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID captured at approve (segregation-of-duties anchor)" }
      - { name: paid_at, type: string, source: system, default: null, description: "Logical clock timestamp at pay" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | PAID | VOIDED" }

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - { name: program_year_id, type: string, source: input, description: "FK -> ProgramYear.id" }
      - { name: period_month, type: string, source: input, description: "YYYY-MM; must overlap the program year" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID at submit" }
      - { name: total_claimed_cents, type: integer, source: computed, default: 0, description: "Sum of line.claimed_amount_cents over all lines" }
      - { name: total_awarded_cents, type: integer, source: computed, default: 0, description: "Sum of line awarded (claimed - disallowed for DISALLOWED; claimed for ALLOWED; 0 for PENDING)" }
      - { name: match_provisional_cents, type: integer, source: computed, default: 0, description: "Sum of round_half_up(claimed * 0.5) per line (calculations.match_credit, provisional variant)" }
      - { name: match_final_cents, type: integer, source: computed, default: null, description: "Sum of round_half_up(awarded * 0.5) per line; null until claim leaves UNDER_REVIEW" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | UNDER_REVIEW | AWARDED | PARTIALLY_AWARDED | REJECTED | RECONCILED | REVERSED" }

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> ReimbursementClaim.id (path parameter)" }
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; globally unique across lines" }
      - { name: claimed_amount_cents, type: integer, source: computed, description: "= invoice.total_cents at line creation (snapshot)" }
      - { name: audit_status, type: enum, source: system, description: "PENDING | ALLOWED | DISALLOWED" }
      - { name: disallowed_amount_cents, type: integer, source: input, default: 0, description: "On disallow: 1..claimed_amount_cents" }
      - { name: disallowance_reason, type: string, source: input, default: null, description: "Required on disallow" }

  - name: SubstitutionRequest
    parent: null
    common_fields: true
    fields:
      - { name: forecast_line_id, type: string, source: input, description: "FK -> MenuForecastLine.id; must have uncovered_quantity > 0" }
      - { name: substitute_product_id, type: string, source: input, description: "FK -> Product.id; must differ from the forecast line's product" }
      - { name: quantity, type: integer, source: input, description: ">= 1 and <= forecast_line.uncovered_quantity" }
      - { name: reason, type: enum, source: input, description: "SEASONALITY_GAP | SUPPLY_SHORTFALL | QUALITY_FAILURE" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProgramYear
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /f2s/program-years/{id}/open"
        actor: DistrictProgramAdmin
        preconditions: ["status == DRAFT (ERR_PROGRAM_YEAR_NOT_DRAFT)"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /f2s/program-years/{id}/close"
        actor: DistrictProgramAdmin
        preconditions:
          - "status == OPEN (ERR_PROGRAM_YEAR_NOT_OPEN)"
          - "No ReimbursementClaim of this year in {OPEN, SUBMITTED, UNDER_REVIEW} (ERR_CLAIMS_UNRESOLVED)"
        side_effects: []

  - entity: Farm
    initial_state: APPLIED
    terminal_states: []
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /f2s/farms/{id}/approve"
        actor: DistrictProgramAdmin
        preconditions:
          - "status == APPLIED (ERR_FARM_NOT_APPLIED)"
          - "Compliance complete at current clock date: >= 1 ACTIVE SAFETY_CERT with effective_on <= today <= expires_on AND >= 1 ACTIVE LIABILITY_INSURANCE with coverage_cents >= required_insurance_cents and effective_on <= today <= expires_on (ERR_FARM_COMPLIANCE_INCOMPLETE)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /f2s/farms/{id}/suspend"
        actor: DistrictProgramAdmin | StateGrantAuditor
        preconditions: ["status == APPROVED (ERR_FARM_NOT_APPROVED)"]
        side_effects:
          - "FarmProductOffering of this farm in VERIFIED -> SUSPENDED (link 1)"
          - "Each PlantingAgreement whose offering was just SUSPENDED and that is in {SIGNED, AMENDMENT_PROPOSED, FULFILLING} -> BREACHED; released_quantity = committed_quantity - delivered_quantity; remaining_quantity = 0 (link 2)"
          - "Each such agreement's PROPOSED AgreementAmendments -> REJECTED (link 2b)"
          - "Each Delivery of a just-BREACHED agreement in SCHEDULED -> CANCELLED; CHECKED_IN deliveries are untouched (link 3)"
          - "Each Invoice in DRAFT belonging to a just-BREACHED agreement -> VOIDED (link 4)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /f2s/farms/{id}/reinstate"
        actor: DistrictProgramAdmin
        preconditions:
          - "status == SUSPENDED (ERR_FARM_NOT_SUSPENDED)"
          - "compliance_posture at current clock date == COMPLIANT (ERR_FARM_NOT_COMPLIANT)"
        side_effects:
          - "FarmProductOffering of this farm in SUSPENDED -> VERIFIED"
          - "BREACHED agreements are NOT resurrected (terminal)"

  - entity: ComplianceDocument
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /f2s/_clock/set_current_utc sweep: expires_on < current date)"
        actor: system
        preconditions: []
        side_effects: ["Farm.compliance_posture recomputes on next read (derived field)"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /f2s/compliance-documents/{id}/revoke"
        actor: StateGrantAuditor
        preconditions: ["status == ACTIVE (ERR_DOCUMENT_NOT_ACTIVE)"]
        side_effects: []

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /f2s/products/{id}/discontinue"
        actor: DistrictProgramAdmin
        preconditions: ["status == ACTIVE (ERR_PRODUCT_NOT_ACTIVE)"]
        side_effects: ["Existing offerings/agreements are unaffected"]

  - entity: FarmProductOffering
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /f2s/offerings/{id}/submit"
        actor: FarmManager
        preconditions:
          - "status == DRAFT (ERR_OFFERING_NOT_SUBMITTABLE)"
          - "farm.status == APPROVED (ERR_FARM_NOT_APPROVED)"
        side_effects: []
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /f2s/offerings/{id}/verify"
        actor: DistrictProgramAdmin
        preconditions:
          - "status == SUBMITTED (ERR_OFFERING_NOT_VERIFIABLE)"
          - "farm.status == APPROVED (ERR_FARM_NOT_APPROVED)"
          - "farm.compliance_posture at current clock date == COMPLIANT (ERR_FARM_NOT_COMPLIANT)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /f2s/offerings/{id}/reject"
        actor: DistrictProgramAdmin
        preconditions: ["status == SUBMITTED (ERR_OFFERING_NOT_VERIFIABLE)"]
        side_effects: []
      - from: VERIFIED
        to: SUSPENDED
        trigger: "system (Farm APPROVED -> SUSPENDED cascade)"
        actor: system
        preconditions: []
        side_effects: ["PlantingAgreements referencing this offering breach (see Farm.suspend)"]
      - from: SUSPENDED
        to: VERIFIED
        trigger: "system (Farm SUSPENDED -> APPROVED cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /f2s/offerings/{id}/withdraw"
        actor: FarmManager
        preconditions: ["status in {DRAFT, SUBMITTED, VERIFIED} (ERR_OFFERING_NOT_WITHDRAWABLE)"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /f2s/offerings/{id}/withdraw"
        actor: FarmManager
        preconditions: ["status in {DRAFT, SUBMITTED, VERIFIED} (ERR_OFFERING_NOT_WITHDRAWABLE)"]
        side_effects: []
      - from: VERIFIED
        to: WITHDRAWN
        trigger: "POST /f2s/offerings/{id}/withdraw"
        actor: FarmManager
        preconditions:
          - "status in {DRAFT, SUBMITTED, VERIFIED} (ERR_OFFERING_NOT_WITHDRAWABLE)"
          - "No PlantingAgreement referencing this offering in {PROPOSED, SIGNED, AMENDMENT_PROPOSED, FULFILLING} (ERR_OFFERING_HAS_ACTIVE_AGREEMENTS)"
        side_effects: []

  - entity: PlantingAgreement
    initial_state: PROPOSED
    terminal_states: [COMPLETED, BREACHED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: SIGNED
        trigger: "POST /f2s/planting-agreements/{id}/sign"
        actor: FarmManager
        preconditions:
          - "status == PROPOSED (ERR_AGREEMENT_NOT_PROPOSED)"
          - "offering.status == VERIFIED (ERR_OFFERING_NOT_VERIFIED)"
          - "farm.status == APPROVED (ERR_FARM_NOT_APPROVED)"
        side_effects: ["increments PlantingAgreement.version by 1"]
      - from: SIGNED
        to: FULFILLING
        trigger: "system (first Delivery for this agreement is created)"
        actor: system
        preconditions: []
        side_effects: ["increments PlantingAgreement.version by 1"]
      - from: SIGNED
        to: AMENDMENT_PROPOSED
        trigger: "system (POST /f2s/planting-agreements/{id}/amendments succeeds)"
        actor: system
        preconditions: []
        side_effects: ["increments PlantingAgreement.version by 1"]
      - from: FULFILLING
        to: AMENDMENT_PROPOSED
        trigger: "system (POST /f2s/planting-agreements/{id}/amendments succeeds; new_committed_quantity must be >= delivered_quantity)"
        actor: system
        preconditions: []
        side_effects: ["increments PlantingAgreement.version by 1"]
      - from: AMENDMENT_PROPOSED
        to: SIGNED
        trigger: "system (amendment ACCEPTED: apply new values; or amendment REJECTED: terms unchanged; returns to FULFILLING instead when the agreement has any deliveries)"
        actor: system
        preconditions: []
        side_effects:
          - "On accept: committed_quantity and/or unit_price_cents replaced by amendment values"
          - "Return state: FULFILLING if >= 1 delivery exists for the agreement, else SIGNED"
          - "increments PlantingAgreement.version by 1"
      - from: FULFILLING
        to: COMPLETED
        trigger: "system (delivery accept/resolve makes delivered_quantity == committed_quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SIGNED
        to: BREACHED
        trigger: "system (clock sweep: current week > harvest_end_week AND delivered_quantity < committed_quantity; OR farm suspension cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "released_quantity = committed_quantity - delivered_quantity; remaining_quantity = 0"
          - "Deliveries of this agreement in SCHEDULED -> CANCELLED"
          - "Invoices of this agreement in DRAFT -> VOIDED"
          - "increments PlantingAgreement.version by 1"
      - from: AMENDMENT_PROPOSED
        to: BREACHED
        trigger: "system (clock sweep or farm suspension cascade; pending PROPOSED amendments -> REJECTED first)"
        actor: system
        preconditions: []
        side_effects: ["Same side effects as SIGNED -> BREACHED"]
      - from: FULFILLING
        to: BREACHED
        trigger: "system (clock sweep or farm suspension cascade)"
        actor: system
        preconditions: []
        side_effects: ["Same side effects as SIGNED -> BREACHED"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /f2s/planting-agreements/{id}/cancel"
        actor: DistrictProgramAdmin | FarmManager
        preconditions: ["status in {PROPOSED, SIGNED, AMENDMENT_PROPOSED} (ERR_AGREEMENT_NOT_CANCELLABLE)"]
        side_effects:
          - "released_quantity = committed_quantity - delivered_quantity; remaining_quantity = 0"
          - "PROPOSED amendments -> REJECTED; SCHEDULED deliveries -> CANCELLED (none can exist pre-FULFILLING)"
      - from: SIGNED
        to: CANCELLED
        trigger: "POST /f2s/planting-agreements/{id}/cancel"
        actor: DistrictProgramAdmin | FarmManager
        preconditions: ["status in {PROPOSED, SIGNED, AMENDMENT_PROPOSED} (ERR_AGREEMENT_NOT_CANCELLABLE)"]
        side_effects: ["Same side effects as PROPOSED -> CANCELLED"]
      - from: AMENDMENT_PROPOSED
        to: CANCELLED
        trigger: "POST /f2s/planting-agreements/{id}/cancel"
        actor: DistrictProgramAdmin | FarmManager
        preconditions: ["status in {PROPOSED, SIGNED, AMENDMENT_PROPOSED} (ERR_AGREEMENT_NOT_CANCELLABLE)"]
        side_effects: ["Same side effects as PROPOSED -> CANCELLED"]

  - entity: AgreementAmendment
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /f2s/agreement-amendments/{id}/accept"
        actor: "counterparty role (DistrictProgramAdmin if proposed_by_role == FarmManager, else FarmManager of owning farm; ERR_NOT_COUNTERPARTY)"
        preconditions:
          - "status == PROPOSED (ERR_AMENDMENT_NOT_OPEN)"
          - "agreement.status == AMENDMENT_PROPOSED (ERR_AGREEMENT_NOT_AMENDABLE)"
        side_effects: ["Agreement terms applied; agreement -> SIGNED (or FULFILLING when deliveries exist)"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /f2s/agreement-amendments/{id}/reject"
        actor: "counterparty role (ERR_NOT_COUNTERPARTY)"
        preconditions: ["status == PROPOSED (ERR_AMENDMENT_NOT_OPEN)"]
        side_effects: ["Agreement -> SIGNED (or FULFILLING when deliveries exist)"]
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (a newer amendment is created on the same agreement)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Delivery
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, CLOSED_REJECTED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /f2s/deliveries/{id}/check-in"
        actor: KitchenManager
        preconditions: ["status == SCHEDULED (ERR_DELIVERY_NOT_SCHEDULED)"]
        side_effects: []
      - from: CHECKED_IN
        to: ACCEPTED
        trigger: "POST /f2s/deliveries/{id}/accept"
        actor: KitchenManager
        preconditions:
          - "status == CHECKED_IN (ERR_DELIVERY_NOT_CHECKED_IN)"
          - "1 <= accepted_quantity <= quantity (ERR_ACCEPTED_QUANTITY_OUT_OF_RANGE)"
        side_effects:
          - "accepted_quantity set"
          - "agreement.delivered_quantity recomputed (calculations.delivered_aggregation)"
          - "if delivered_quantity == committed_quantity: agreement -> COMPLETED"
      - from: CHECKED_IN
        to: REJECTED
        trigger: "POST /f2s/deliveries/{id}/reject"
        actor: KitchenManager
        preconditions: ["status == CHECKED_IN (ERR_DELIVERY_NOT_CHECKED_IN)"]
        side_effects: ["rejection_reason stored; agreement.delivered_quantity unchanged"]
      - from: REJECTED
        to: DISPUTED
        trigger: "POST /f2s/deliveries/{id}/dispute"
        actor: FarmManager
        preconditions: ["status == REJECTED (ERR_DELIVERY_NOT_REJECTED)"]
        side_effects: []
      - from: DISPUTED
        to: ACCEPTED
        trigger: "POST /f2s/deliveries/{id}/resolve-dispute with resolution=ACCEPTED"
        actor: DistrictProgramAdmin
        preconditions:
          - "status == DISPUTED (ERR_DELIVERY_NOT_DISPUTED)"
          - "1 <= accepted_quantity <= quantity (ERR_ACCEPTED_QUANTITY_OUT_OF_RANGE)"
        side_effects: ["Same side effects as CHECKED_IN -> ACCEPTED"]
      - from: DISPUTED
        to: CLOSED_REJECTED
        trigger: "POST /f2s/deliveries/{id}/resolve-dispute with resolution=CLOSED_REJECTED"
        actor: DistrictProgramAdmin
        preconditions: ["status == DISPUTED (ERR_DELIVERY_NOT_DISPUTED)"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /f2s/deliveries/{id}/cancel OR system (agreement BREACHED/CANCELLED cascade)"
        actor: FarmManager | system
        preconditions: ["status == SCHEDULED (ERR_DELIVERY_NOT_SCHEDULED)"]
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (clock sweep: delivery_date < current date while still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /f2s/invoices/{id}/submit"
        actor: FarmManager
        preconditions:
          - "status == DRAFT (ERR_INVOICE_NOT_SUBMITTABLE)"
          - "farm.status == APPROVED (ERR_FARM_NOT_APPROVED)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /f2s/invoices/{id}/approve"
        actor: DistrictProgramAdmin
        preconditions: ["status == SUBMITTED (ERR_INVOICE_NOT_APPROVABLE)"]
        side_effects: ["approved_by_user_id = X-User-ID of approver"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /f2s/invoices/{id}/reject"
        actor: DistrictProgramAdmin
        preconditions: ["status == SUBMITTED (ERR_INVOICE_NOT_APPROVABLE)"]
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /f2s/invoices/{id}/revise"
        actor: FarmManager
        preconditions: ["status == REJECTED (ERR_INVOICE_NOT_REVISABLE)"]
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /f2s/invoices/{id}/pay"
        actor: DistrictProgramAdmin
        preconditions: ["status == APPROVED (ERR_INVOICE_NOT_PAYABLE)"]
        side_effects: ["paid_at = current logical clock timestamp"]
      - from: DRAFT
        to: VOIDED
        trigger: "system (agreement BREACHED cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReimbursementClaim
    initial_state: OPEN
    terminal_states: [RECONCILED, REJECTED, REVERSED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /f2s/reimbursement-claims/{id}/submit"
        actor: ClaimsCoordinator
        preconditions:
          - "status == OPEN (ERR_CLAIM_NOT_OPEN)"
          - ">= 1 ClaimLine (ERR_CLAIM_EMPTY)"
          - "Segregation of duties: X-User-ID != approved_by_user_id of every line's invoice (ERR_SOD_VIOLATION)"
        side_effects: ["submitted_by_user_id = X-User-ID"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /f2s/reimbursement-claims/{id}/start-review"
        actor: StateGrantAuditor
        preconditions: ["status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "system (last PENDING ClaimLine adjudicated and all lines ALLOWED)"
        actor: system
        preconditions: []
        side_effects: ["match_final_cents computed (calculations.match_credit, final variant)"]
      - from: UNDER_REVIEW
        to: PARTIALLY_AWARDED
        trigger: "system (last PENDING line adjudicated, some DISALLOWED, total_awarded_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["match_final_cents computed"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (last PENDING line adjudicated and total_awarded_cents == 0)"
        actor: system
        preconditions: []
        side_effects: ["match_final_cents computed (== 0)"]
      - from: AWARDED
        to: RECONCILED
        trigger: "POST /f2s/reimbursement-claims/{id}/reconcile"
        actor: StateGrantAuditor
        preconditions:
          - "status in {AWARDED, PARTIALLY_AWARDED} (ERR_CLAIM_NOT_AWARDED)"
          - "total_awarded_cents <= program_year.grant_remaining_cents (ERR_GRANT_EXHAUSTED)"
        side_effects: ["program_year.grant_drawn_cents += total_awarded_cents; grant_remaining_cents -= total_awarded_cents"]
      - from: PARTIALLY_AWARDED
        to: RECONCILED
        trigger: "POST /f2s/reimbursement-claims/{id}/reconcile"
        actor: StateGrantAuditor
        preconditions: ["Same as AWARDED -> RECONCILED"]
        side_effects: ["Same as AWARDED -> RECONCILED"]
      - from: RECONCILED
        to: REVERSED
        trigger: "POST /f2s/reimbursement-claims/{id}/reverse"
        actor: StateGrantAuditor
        preconditions: ["status == RECONCILED (ERR_CLAIM_NOT_RECONCILED)"]
        side_effects: ["program_year.grant_drawn_cents -= total_awarded_cents; grant_remaining_cents += total_awarded_cents (compensating action)"]

  - entity: ClaimLine
    initial_state: PENDING
    terminal_states: [ALLOWED, DISALLOWED]
    transitions:
      - from: PENDING
        to: ALLOWED
        trigger: "POST /f2s/claim-lines/{id}/allow"
        actor: StateGrantAuditor
        preconditions:
          - "claim.status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "audit_status == PENDING (ERR_CLAIM_LINE_NOT_PENDING)"
        side_effects:
          - "claim totals recompute (total_awarded_cents += claimed_amount_cents)"
          - "if no PENDING lines remain: claim auto-transitions per derived rule (AWARDED/PARTIALLY_AWARDED/REJECTED)"
      - from: PENDING
        to: DISALLOWED
        trigger: "POST /f2s/claim-lines/{id}/disallow"
        actor: StateGrantAuditor
        preconditions:
          - "claim.status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "audit_status == PENDING (ERR_CLAIM_LINE_NOT_PENDING)"
          - "1 <= disallowed_amount_cents <= claimed_amount_cents (ERR_DISALLOWANCE_OUT_OF_RANGE)"
        side_effects:
          - "claim totals recompute (total_awarded_cents += claimed - disallowed)"
          - "if no PENDING lines remain: claim auto-transitions per derived rule"

  - entity: SubstitutionRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /f2s/substitution-requests/{id}/approve"
        actor: StateGrantAuditor
        preconditions:
          - "status == REQUESTED (ERR_SUBSTITUTION_NOT_PENDING)"
          - "Substitution cap re-check at approval (calculations.substitution_cap; ERR_SUBSTITUTION_CAP_EXCEEDED)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "POST /f2s/substitution-requests/{id}/deny"
        actor: StateGrantAuditor
        preconditions: ["status == REQUESTED (ERR_SUBSTITUTION_NOT_PENDING)"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; see SKILL.md filter)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-propose-stale-agreement
    parent_entity: PlantingAgreement
    write_endpoint: "POST /f2s/planting-agreements/{id}/amendments"
    occ_field: expected_agreement_version
    description: |
      Creating an AgreementAmendment against a PlantingAgreement whose version
      has advanced since the client last observed it is rejected. A newer
      amendment legitimately supersedes the prior PROPOSED one, so the writer
      holding a stale version of the agreement must re-read before proposing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-line-add-stale-claim
    parent_entity: ReimbursementClaim
    write_endpoint: "POST /f2s/reimbursement-claims/{id}/lines"
    occ_field: expected_claim_version
    description: |
      Adding a ClaimLine to an OPEN ReimbursementClaim whose version has
      advanced since the client last observed it is rejected. Each line add
      legitimately mutates the claim (totals and version), so a writer holding
      a stale claim version must re-read before adding another line.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: preference_points
    trigger: "FarmProductOffering creation (result pinned on the offering)"
    algorithm: tiered_pricing
    formula: |
      Inputs: d = farm.distance_miles_to_hub, R = program_year.local_radius_miles,
              model = program_year.preference_model.
      If d > R: is_local_eligible = false, preference_points = 0.
      Else is_local_eligible = true and:
        LINEAR: points = 100 - d                      (d == 0 -> 100; d == R -> 100 - R)
        TIERED: d <= 25 -> 100
                25 < d <= 50 -> 75
                50 < d <= 100 -> 50
                100 < d <= R -> 25
      The two models are two valid readings of "geographic preference" and give
      different points for the same (d, R): e.g. d=30, R=100 -> LINEAR 70 vs TIERED 75.
    input_set: "The offering's farm and program year at creation time"
    constants: { TIER1_MILES: 25, TIER2_MILES: 50, TIER3_MILES: 100 }
    precision: "integer points; no rounding"
    variants:
      - name: LINEAR
        when: "program_year.preference_model == LINEAR"
        difference: "points = 100 - d (continuous)"
      - name: TIERED
        when: "program_year.preference_model == TIERED"
        difference: "points from fixed bands 25/50/100/R (step function)"

  - name: forecast_coverage
    trigger: "Read of MenuForecastLine; after agreement create/sign/amend-accept/cancel/breach"
    algorithm: forward_looking
    formula: |
      covering(a, w) = a.product == line.product AND week w inside
        [a.harvest_start_week .. a.harvest_end_week] inclusive; wraparound:
        if start <= end then start <= w <= end else w >= start OR w <= end.
      Input set: PlantingAgreements of line.program_year with
        status IN {SIGNED, AMENDMENT_PROPOSED, FULFILLING}
        (PROPOSED, CANCELLED, BREACHED, COMPLETED are EXCLUDED).
      reserved_quantity  = SUM(committed_quantity of covering agreements)
      uncovered_quantity = max(0, planned_quantity - reserved_quantity)
      Boundary: reserved == planned  =>  uncovered == 0 (equality is covered).
    input_set: "Agreements status IN {SIGNED, AMENDMENT_PROPOSED, FULFILLING} covering line.week_number"
    constants: {}
    precision: "integer units"

  - name: invoice_pricing
    trigger: "Invoice creation (values pinned on the invoice)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is PINNED (circular-looking dependency made explicit):
      (1) subtotal_cents = quantity_billed * unit_price_cents
          (quantity_billed = delivery.accepted_quantity snapshot; unit_price_cents
           = agreement.unit_price_cents pinned at agreement creation)
      (2) incentive tier: ytd_local_cents = SUM(subtotal_cents) over this farm's
          invoices with status IN {APPROVED, PAID} for the same program year whose
          agreement.local_eligible is true, EXCLUDING the invoice being created.
          rate = 0.02 if ytd_local_cents < 1000000
               = 0.03 if ytd_local_cents < 5000000
               = 0.05 otherwise
      (3) incentive_credit_cents = agreement.local_eligible
            ? round_half_up(subtotal_cents * rate) : 0
      (4) total_cents = subtotal_cents + incentive_credit_cents
      The tier is decided by YTD EXCLUDING the current invoice; a threshold
      crossed BY the current invoice does not change its own rate.
    input_set: "Farm's invoices status IN {APPROVED, PAID}, same program year, local-eligible agreements only"
    constants: { TIER1_CAP_CENTS: 1000000, TIER2_CAP_CENTS: 5000000, RATE1: 0.02, RATE2: 0.03, RATE3: 0.05 }
    precision: "integer cents; round_half_up at step (3) only"

  - name: match_credit
    trigger: "Provisional: on ClaimLine add/remove. Final: when claim leaves UNDER_REVIEW (last line adjudicated)"
    algorithm: aggregation
    formula: |
      MATCH_RATE = 0.5 (district documents $0.50 match per grant $1.00).
      Rounding order is PINNED: round per line, THEN sum.
      match_provisional_cents = SUM over lines of round_half_up(line.claimed_amount_cents * 0.5)
      match_final_cents       = SUM over lines of round_half_up(line_awarded * 0.5)
        where line_awarded = claimed for ALLOWED, claimed - disallowed for DISALLOWED.
      Per-line rounding then summing differs from sum-then-round:
      claimed 153 and 255 -> 77 + 128 = 205 vs round(408 * 0.5) = 204.
      Program-report rollup: match_provisional = SUM over all claims of the year;
      match_final = SUM over claims past UNDER_REVIEW (others contribute 0).
    input_set: "All ClaimLines of the claim (provisional); adjudicated lines (final)"
    constants: { MATCH_RATE: 0.5 }
    precision: "integer cents; round_half_up per line BEFORE summation"
    variants:
      - name: provisional
        when: "claim in OPEN/SUBMITTED/UNDER_REVIEW (pre-audit, claimed basis)"
        difference: "uses claimed_amount_cents; ignores disallowances"
      - name: final
        when: "claim reached AWARDED/PARTIALLY_AWARDED/REJECTED (post-audit)"
        difference: "uses awarded basis (claimed - disallowed); null before adjudication completes"

  - name: delivered_aggregation
    trigger: "Delivery accept; dispute resolve with resolution=ACCEPTED"
    algorithm: chronological
    formula: |
      delivered_quantity = SUM(accepted_quantity) over the agreement's deliveries
      with status == ACCEPTED, processed in order delivery_date ASC with
      created_at ASC as tie-break (the sum is order-insensitive; the order is
      pinned so the completion check below is deterministic).
      Completion: after each acceptance, if delivered_quantity == committed_quantity
      the agreement -> COMPLETED (>= can never overshoot because scheduling caps
      quantity at committed - delivered - already-scheduled).
    input_set: "Deliveries of the agreement with status == ACCEPTED"
    constants: {}
    precision: "integer units"

  - name: insurance_minimum
    trigger: "Farm approval; ComplianceDocument creation with doc_type == LIABILITY_INSURANCE; posture evaluation"
    algorithm: threshold
    formula: |
      required_insurance_cents = 500000  if farm.acres <= 500  (is_small_farm)
                               = 1000000 if farm.acres >  500
      Boundary: acres == 500 exactly is a SMALL farm (500000 required).
      A policy with coverage_cents == required_insurance_cents SATISFIES the
      minimum (>=, not >).
    input_set: "The farm's acres"
    constants: { SMALL_FARM_MAX_ACRES: 500, SMALL_MIN_CENTS: 500000, LARGE_MIN_CENTS: 1000000 }
    precision: "integer cents"

  - name: local_spend_share
    trigger: "GET /f2s/program-years/{id}/report"
    algorithm: aggregation
    formula: |
      Two variants over the SAME invoices of the program year:
      ACCRUAL: include invoices status IN {DRAFT, SUBMITTED, APPROVED, PAID}
               whose delivery.delivery_date falls in report month;
               value = subtotal_cents.
      CASH:    include invoices status == PAID whose paid_at falls in report
               month; value = subtotal_cents.
      local_*  = same sum restricted to agreements with local_eligible == true.
      share_pct = total == 0 ? 0.00 : round_half_up(100.0 * local / total, 2)
      meets_target: share_pct >= program_year.local_spend_target_pct (>= counts).
      A delivery accepted in August but paid in September lands in the August
      accrual column and the September cash column - different months, different
      totals, same underlying data.
    input_set: "Invoices of the program year (VOIDED excluded), joined to deliveries and agreements"
    constants: {}
    precision: "share_pct 2 decimal places, round_half_up"
    variants:
      - name: ACCRUAL
        when: "always computed (delivery-date basis)"
        difference: "keys on delivery.delivery_date; includes unpaid invoices"
      - name: CASH
        when: "always computed (payment-date basis)"
        difference: "keys on paid_at; includes only PAID invoices"

  - name: substitution_cap
    trigger: "SubstitutionRequest creation and approval (re-checked at approval)"
    algorithm: threshold
    formula: |
      product_planned = SUM(planned_quantity) over the forecast lines of the
        request's product in the request's program year.
      cap_quantity = floor(0.20 * product_planned)
      approved_so_far = SUM(quantity) over APPROVED SubstitutionRequests of the
        same product and year (any forecast line).
      Approval allowed iff approved_so_far + this.quantity <= cap_quantity.
      Boundary: landing exactly ON the cap is allowed (<=).
    input_set: "Forecast lines + APPROVED substitution requests, same product and program year"
    constants: { CAP_RATE: 0.20 }
    precision: "integer units; floor for the cap"

  - name: farm_compliance_posture
    trigger: "Read of Farm; farm approve/reinstate; offering verify; delivery scheduling; invoice creation (snapshot at delivery_date)"
    algorithm: constraint_propagation
    formula: |
      posture(ref_date) = COMPLIANT iff farm.status == APPROVED AND
        EXISTS ComplianceDocument of farm with doc_type == SAFETY_CERT,
          status == ACTIVE, effective_on <= ref_date <= expires_on AND
        EXISTS ComplianceDocument of farm with doc_type == LIABILITY_INSURANCE,
          status == ACTIVE, effective_on <= ref_date <= expires_on,
          coverage_cents >= required_insurance_cents
      else NON_COMPLIANT.
      ref_date = current clock date for gating; = delivery.delivery_date for the
      invoice's farm_compliant_at_delivery audit snapshot.
    input_set: "Farm's ComplianceDocuments (EXPIRED/REVOKED excluded)"
    constants: {}
    precision: "date granularity (inclusive both ends)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is a declared role; request body required fields present and well-typed (ERR_INVALID_REQUEST), including conditionally required fields (ERR_COVERAGE_REQUIRED when doc_type == LIABILITY_INSURANCE lacks coverage_cents)", error_id: "ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER / ERR_INVALID_REQUEST / ERR_COVERAGE_REQUIRED", http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per RBAC", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids exist, validated left-to-right; then body FK ids exist", error_id: "ERR_*_NOT_FOUND (per resource)", http_status: 404, applies_to: "all" }
  - { priority: 4, category: auth, check: "Entity-backed ownership: FarmManager acts only on own farm's resources; KitchenManager only on own kitchen; amendment accept/reject only by counterparty", error_id: "ERR_RESOURCE_OWNERSHIP / ERR_NOT_COUNTERPARTY", http_status: 403, applies_to: "role-scoped write endpoints" }
  - { priority: 5, category: state, check: "Program year is OPEN for child creation (offerings, forecast lines, agreements, claims, substitutions)", error_id: ERR_PROGRAM_YEAR_NOT_OPEN, http_status: 409, applies_to: "POST /f2s/offerings, /f2s/forecast-lines, /f2s/planting-agreements, /f2s/reimbursement-claims, /f2s/substitution-requests" }
  - { priority: 6, category: state, check: "Target resource state precondition for the operation (per state_machines), including state-gated creations: offering create requires farm APPROVED and product ACTIVE; agreement create requires offering VERIFIED; invoice create requires delivery ACCEPTED", error_id: "ERR_* state family (e.g. ERR_AGREEMENT_NOT_ACTIVE, ERR_OFFERING_NOT_VERIFIED, ERR_FARM_NOT_APPROVED, ERR_PRODUCT_NOT_ACTIVE, ERR_DELIVERY_NOT_ACCEPTED)", http_status: 409, applies_to: "all action/transition endpoints and POST /f2s/offerings, /f2s/planting-agreements, /f2s/deliveries, /f2s/invoices" }
  - { priority: 7, category: business_safety, check: "Farm compliance: approve requires complete docs; verify/delivery scheduling require posture COMPLIANT; insurance coverage >= required_insurance_cents", error_id: "ERR_FARM_COMPLIANCE_INCOMPLETE / ERR_FARM_NOT_COMPLIANT / ERR_COVERAGE_BELOW_MINIMUM", http_status: 422, applies_to: "farm approve, offering verify, POST /f2s/deliveries, POST /f2s/compliance-documents" }
  - { priority: 8, category: business_referential, check: "Cross-resource coherence: agreement year == offering year; window belongs to kitchen; window weekday == weekday(delivery_date); substitution product != line product; claim line farm_compliant_at_delivery snapshot", error_id: "ERR_OFFERING_YEAR_MISMATCH / ERR_WINDOW_KITCHEN_MISMATCH / ERR_WINDOW_WEEKDAY_MISMATCH / ERR_SAME_PRODUCT_SUBSTITUTION / ERR_LINE_FARM_NONCOMPLIANT", http_status: 422, applies_to: "POST /f2s/planting-agreements, /f2s/deliveries, /f2s/substitution-requests, claim lines" }
  - { priority: 9, category: business_temporal, check: "Temporal windows: doc date range; harvest window inside season; agreement window inside offering window; delivery week inside agreement window and date not in past; claim period overlaps year; invoice delivery month == claim period; clock monotonic", error_id: "ERR_INVALID_DATE_RANGE / ERR_HARVEST_WINDOW_OUTSIDE_SEASON / ERR_AGREEMENT_WINDOW_OUTSIDE_OFFERING / ERR_DELIVERY_OUTSIDE_HARVEST_WINDOW / ERR_DELIVERY_DATE_IN_PAST / ERR_PERIOD_OUTSIDE_YEAR / ERR_INVOICE_OUTSIDE_PERIOD / ERR_CLOCK_REGRESSION", http_status: "400 for shape, 409 for window conflicts", applies_to: "dated resources" }
  - { priority: 10, category: business_constraint, check: "Uniqueness/capacity/caps: forecast line unique (year,product,week); invoice_number unique per farm; one invoice per delivery; invoice on at most one claim line; window half-open overlap; window aggregate capacity; positive seasonality gap; substitution gap and cap; claim non-empty; offering withdraw guard; amendment fields and floor; segregation of duties; quantity within uncommitted remainder", error_id: "ERR_FORECAST_LINE_EXISTS / ERR_DUPLICATE_INVOICE_NUMBER / ERR_INVOICE_EXISTS_FOR_DELIVERY / ERR_INVOICE_ALREADY_CLAIMED / ERR_WINDOW_OVERLAP / ERR_WINDOW_CAPACITY_FULL / ERR_WINDOW_IN_USE / ERR_NO_SEASONALITY_GAP / ERR_SUBSTITUTION_EXCEEDS_GAP / ERR_SUBSTITUTION_CAP_EXCEEDED / ERR_CLAIM_EMPTY / ERR_OFFERING_HAS_ACTIVE_AGREEMENTS / ERR_AMENDMENT_EMPTY / ERR_AMENDMENT_BELOW_DELIVERED / ERR_SOD_VIOLATION (403) / ERR_QUANTITY_EXCEEDS_REMAINING / ERR_ACCEPTED_QUANTITY_OUT_OF_RANGE (422) / ERR_DISALLOWANCE_OUT_OF_RANGE (422) / ERR_LINE_NOT_LOCAL", http_status: 409, applies_to: "creation and action endpoints as listed" }
  - { priority: 11, category: business_fiscal, check: "Fiscal limits: agreement commitment within uncovered forecast; claim award within grant_remaining", error_id: "ERR_COMMITMENT_EXCEEDS_UNCOVERED / ERR_GRANT_EXHAUSTED", http_status: 402, applies_to: "POST /f2s/planting-agreements, claim reconcile" }
  - { priority: 12, category: state, check: "OCC: expected_<parent>_version matches current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /f2s/planting-agreements/{id}/amendments, POST /f2s/reimbursement-claims/{id}/lines" }

# =============================================================================
# 1.5 API Endpoint Table
