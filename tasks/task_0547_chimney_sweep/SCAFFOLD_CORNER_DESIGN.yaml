              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", cadence_months: 12, expected_chimney_version: "${chim_v}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_CHIMNEY_VERSION"
            - "http_status == 412"

      - name: occ_success_supersedes_prior_reminder
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reminder-supersede-stale-chimney]", state_machines.ReminderSchedule.ACTIVE_to_DEACTIVATED]
        distinguishing_aspect: "Creating a second reminder with the fresh chimney version (2) succeeds and supersedes the prior one, which becomes DEACTIVATED while the new one is ACTIVE."
        test_recipe:
          setup: ["A chimney with one ACTIVE reminder (chimney at version 2, re-read for the fresh version)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Lu Ledge", service_address: "48 Hearth Ln", phone: "555-0229" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id, chim_v: $.data.version }
            - call: "POST /reminder-schedules"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", cadence_months: 12, expected_chimney_version: "${chim_v}" }
              as: Dispatcher
              captures: { rem1_id: $.data.id }
            - call: "GET /chimneys/${chim_id}"
              payload: {}
              as: Dispatcher
              captures: { chim_v2: $.data.version }
          trigger:
            - call: "POST /reminder-schedules"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", cadence_months: 6, expected_chimney_version: "${chim_v2}" }
              as: Dispatcher
              captures: { rem2_id: $.data.id }
          assert:
            - "ReminderSchedule.${rem1_id}.status == DEACTIVATED"
            - "ReminderSchedule.${rem2_id}.status == ACTIVE"

