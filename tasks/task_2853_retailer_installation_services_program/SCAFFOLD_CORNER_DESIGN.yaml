            - "METRO-06 requires a FLOORING permit at any size (permit_unit_threshold 0), requires inspection, and has labor_complexity_multiplier 1.00; the FLOOR-QUICK category is BY_JURISDICTION with measurement_required false, rate 425, minimum 150.00 and deposit_pct 0.30."
            - "A 420.00-unit project therefore quotes 171020 with deposit 51306; the permit is applied for and issued with permit_fee_cents 25000; a delivery promises 2026-08-20T09:00 and the window opens 2026-08-21T09:00, giving exactly 24 hours of slack."
            - "The installer is licensed, insured and background-checked in METRO-06; the clock is stepped to 2026-08-21T09:30 to start and to 2026-08-21T17:00 to complete, with completed_at 2026-08-21T16:45 inside the window."
            - "With no COMPLETED measurement and measurement_required false, FINAL falls back to estimated_units, so final_labor_cents is 171020, total_due_cents is 171020 + 25000 = 196020, deposit_applied_cents is 51306 and balance_due_cents is 144714."
