            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100, overflow_daily_surcharge_cents: 400, remittance_grace_days: 20 }
