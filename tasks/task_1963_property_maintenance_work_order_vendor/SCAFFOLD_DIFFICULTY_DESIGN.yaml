              payload: { event_type: "BILL" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state, priority 6) — NOT ERR_CHARGEBACK_LINES_REQUIRED (business_fiscal, priority 20), although line_items is also missing"
            - "HTTP status == 409"

      - name: signoff_beats_photos_on_complete
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - errors[ERR_RESIDENT_SIGNOFF_REQUIRED]
          - errors[ERR_COMPLETION_PHOTOS_REQUIRED]
        distinguishing_aspect: |
          Category pair (business_safety, business_constraint): a completion with
          resident_signoff == false AND an empty photo_urls array violates both
          rules; the sign-off rule (safety, priority 18) outranks the photo rule
          (constraint, priority 19).
        test_recipe:
          setup:
