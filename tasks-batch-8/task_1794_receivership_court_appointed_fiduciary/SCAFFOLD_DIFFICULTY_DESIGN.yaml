# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Receivership & Court-Appointed Fiduciary Administration
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and is replayable from empty-DB via §1.5 endpoints only.
# Logical clock default is 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: secured_claim_estimated_vs_realized_collateral
        grounds:
          - calculations.claim_priority_determination
          - entities.Claim.fields.secured_allowed_cents
          - entities.Claim.fields.general_allowed_cents
          - state_machines.Asset.IDENTIFIED_to_LIQUIDATED
        distinguishing_aspect: |
          Dual variant on the CLAIM entity domain: two identical SECURED claims
          (same filed amount, same estimated collateral) are bifurcated with
          different collateral bases — claim X determined while its collateral is
          IDENTIFIED (estimated variant: 80000) versus claim Y determined after
          its collateral liquidated below estimate (realized variant: 60000) —
          shifting 20000 from the SECURED bucket to the GENERAL deficiency bucket.
        test_recipe:
          setup:
            - "Case ACTIVE with authority_limit_cents 500000; clock at default 2026-08-01"
            - "Asset X IDENTIFIED estimated 80000; Asset Y IDENTIFIED estimated 80000"
            - "Claim X SECURED filed 100000 against Asset X; Claim Y SECURED filed 100000 against Asset Y"
            - "Claim X determined before any liquidation; Asset Y then liquidated at 60000; Claim Y determined after"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2001", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Warehouse X", asset_class: REAL_PROPERTY, estimated_value_cents: 80000 }
              as: Receiver
              captures: { asset_x: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Warehouse Y", asset_class: REAL_PROPERTY, estimated_value_cents: 80000 }
              as: Receiver
              captures: { asset_y: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Bank X", creditor_type: SECURED, filed_amount_cents: 100000, collateral_asset_id: "${asset_x}" }
              as: Creditor
              captures: { claim_x: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Bank Y", creditor_type: SECURED, filed_amount_cents: 100000, collateral_asset_id: "${asset_y}" }
              as: Creditor
              captures: { claim_y: $.data.id }
            - call: "POST /v1/claims/${claim_x}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 100000 }
              as: Receiver
            - call: "POST /v1/assets/${asset_y}/liquidate"
              payload: { liquidation_value_cents: 60000 }
              as: Receiver
          trigger:
            - call: "POST /v1/claims/${claim_y}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 100000 }
              as: Receiver
            - call: "GET /v1/claims/${claim_x}"
              as: Receiver
              captures: { x_sec: $.data.secured_allowed_cents, x_gen: $.data.general_allowed_cents }
            - call: "GET /v1/claims/${claim_y}"
              as: Receiver
              captures: { y_sec: $.data.secured_allowed_cents, y_gen: $.data.general_allowed_cents }
          assert:
            - "Claim ${claim_x} (estimated variant): secured_allowed_cents == 80000, general_allowed_cents == 20000"
            - "Claim ${claim_y} (realized variant): secured_allowed_cents == 60000, general_allowed_cents == 40000"
            - "${x_sec} == 80000 and ${y_sec} == 60000 and ${x_sec} != ${y_sec}"
            - "Both claims conserve filed dollars: secured + general == 100000 for each"

      - name: fee_lodestar_vs_contingent_percentage
        grounds:
          - calculations.fee_request_calculation
          - entities.FeeApplication.fields.requested_amount_cents
          - entities.Engagement.fields.fee_arrangement
        distinguishing_aspect: |
          Dual variant on the FEEAPPLICATION entity domain: the same professional
          work priced two court-accepted ways diverges — an HOURLY engagement's
          lodestar (10.0 hours x 20000 = 200000) versus a CONTINGENT engagement's
          percentage of recovery (0.10 x 3000000 = 300000) — different requested
          amounts from the two valid approaches.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default"
            - "Engagement H: COUNSEL, HOURLY, rate 20000, APPROVED"
            - "Engagement C: ACCOUNTANT, CONTINGENT, contingency_pct 0.10, APPROVED"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2002", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 5000000 }
              as: Receiver
              captures: { eng_h: $.data.id }
            - call: "POST /v1/engagements/${eng_h}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "A. Accountant", firm_name: "Acct LLC", role_type: ACCOUNTANT, fee_arrangement: CONTINGENT, contingency_pct: 0.10, fee_cap_cents: 5000000 }
              as: Receiver
              captures: { eng_c: $.data.id }
            - call: "POST /v1/engagements/${eng_c}/decide"
              payload: { decision: APPROVE }
              as: Court
          trigger:
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_h}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", time_entries: [ { hours: 10.0, rate_cents: 20000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { req_h: $.data.requested_amount_cents }
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_c}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", recovery_basis_cents: 3000000, expenses_cents: 0 }
              as: Receiver
              captures: { req_c: $.data.requested_amount_cents }
          assert:
            - "HOURLY lodestar: ${req_h} == 200000"
            - "CONTINGENT percentage: ${req_c} == 300000"
            - "${req_h} != ${req_c} — the two valid approaches diverge"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_class_pro_rata_with_remainder_sweep
        grounds:
          - calculations.distribution_waterfall
          - entities.DistributionPayment.fields.scheduled_amount_cents
          - entities.DistributionPayment.fields.priority_class
        distinguishing_aspect: |
          Mode (a) combinatorial: the waterfall combines >= 3 inputs (pool,
          reserve, per-class bucket totals) with nested min() per class and
          tiered class selection, then a floor + deterministic remainder sweep
          (bucket DESC, claim created_at ASC) — the GENERAL class pool of 405000
          splits 20000/485000/300000 into floors 10062/244006/150931 and the
          single leftover cent goes to the largest bucket (485000), making the
          wage claimant's general payment 244007, not 244006.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default; cash 2080000 (assets liquidated 80000 + 2000000)"
            - "Claims all ALLOWED: C1 SECURED filed 100000 (collateral realized 80000 -> secured 80000, general 20000); C2 PRIORITY_WAGE filed 2000000 (priority 1515000, general 485000); C3 GENERAL_UNSECURED 300000; C4 INVESTOR 500000"
            - "Plan FILED with reserve_cents 80000 -> pool 2000000"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2003", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Warehouse", asset_class: REAL_PROPERTY, estimated_value_cents: 80000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 2000000 }
              as: Receiver
              captures: { a2: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 80000 }
              as: Receiver
            - call: "POST /v1/assets/${a2}/liquidate"
              payload: { liquidation_value_cents: 2000000 }
              as: Receiver
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Secured Bank", creditor_type: SECURED, filed_amount_cents: 100000, collateral_asset_id: "${a1}" }
              as: Creditor
              captures: { c1: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Wage Claimant", creditor_type: PRIORITY_WAGE, filed_amount_cents: 2000000 }
              as: Creditor
              captures: { c2: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Trade Supplier", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 300000 }
              as: Creditor
              captures: { c3: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Investor I", creditor_type: INVESTOR, filed_amount_cents: 500000 }
              as: Creditor
              captures: { c4: $.data.id }
            - call: "POST /v1/claims/${c1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 100000 }
              as: Receiver
            - call: "POST /v1/claims/${c2}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 2000000 }
              as: Receiver
            - call: "POST /v1/claims/${c3}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 300000 }
              as: Receiver
            - call: "POST /v1/claims/${c4}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 500000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 80000 }
              as: Receiver
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: APPROVE }
              as: Court
              captures: { plan_status: $.data.status }
            - call: "GET /v1/claims/${c1}/payments"
              as: Receiver
              captures: { p1_sec: "$.data[0].scheduled_amount_cents", p1_gen: "$.data[1].scheduled_amount_cents" }
            - call: "GET /v1/claims/${c2}/payments"
              as: Receiver
              captures: { p2_pri: "$.data[0].scheduled_amount_cents", p2_gen: "$.data[1].scheduled_amount_cents" }
            - call: "GET /v1/claims/${c3}/payments"
              as: Receiver
              captures: { p3_gen: "$.data[0].scheduled_amount_cents" }
            - call: "GET /v1/claims/${c4}/payments"
              as: Receiver
          assert:
            - "Plan ${plan_id} status == APPROVED"
            - "SECURED class paid in full: ${p1_sec} == 80000"
            - "PRIORITY class paid in full (capped): ${p2_pri} == 1515000"
            - "GENERAL pro-rata floors: ${p1_gen} == 10062, ${p3_gen} == 150931"
            - "Remainder cent swept to the largest GENERAL bucket: ${p2_gen} == 244007 (not 244006)"
            - "INVESTOR class gets no rows: GET /v1/claims/${c4}/payments returns an empty list"
            - "Sum of all scheduled payments == 2000000 == pool"

      - name: fee_per_entry_rounding_before_sum
        grounds:
          - calculations.fee_request_calculation
          - entities.FeeApplication.fields.time_entries
          - entities.FeeApplication.fields.requested_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-entry-THEN-sum
          (round_half_up each time-entry line to whole cents before summing).
          Entries 2.5 x 33333 = 83332.5 and 2.5 x 13333 = 33332.5 round to
          83333 + 33333 = 116666; the alternative sum-then-round gives 116665.
          With expenses 5000 the pinned order yields requested 121666, not 121665.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default"
            - "Engagement COUNSEL HOURLY APPROVED, fee_cap 5000000"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2004", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 5000000 }
              as: Receiver
              captures: { eng_id: $.data.id }
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Court
          trigger:
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", time_entries: [ { hours: 2.5, rate_cents: 33333 }, { hours: 2.5, rate_cents: 13333 } ], expenses_cents: 5000 }
              as: Receiver
              captures: { req: $.data.requested_amount_cents }
          assert:
            - "${req} == 121666 — per-entry rounding (83333 + 33333 + 5000)"
            - "${req} != 121665 — the sum-then-round order is NOT used"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_reconsideration_cycle
        grounds:
          - state_machines.Claim.FILED_to_ALLOWED
          - state_machines.Claim.ALLOWED_to_FILED
          - state_machines.Claim.DISALLOWED_to_FILED
        distinguishing_aspect: |
          Cyclic machine on the CLAIM entity: a claim loops
          FILED -> ALLOWED -> FILED -> DISALLOWED -> FILED -> ALLOWED, with
          allowed_amount_cents and class buckets cleared to null on each
          reconsider and recomputed on each re-determination — a non-linear
          cycle, not a pipeline.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default"
            - "Claim GENERAL_UNSECURED filed 40000"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2005", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Cycle Creditor", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 40000 }
              as: Creditor
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /v1/claims/${cid}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 40000 }
              as: Receiver
              captures: { st1: $.data.status, g1: $.data.general_allowed_cents }
            - call: "POST /v1/claims/${cid}/reconsider"
              payload: {}
              as: Court
              captures: { st2: $.data.status, a2: $.data.allowed_amount_cents }
            - call: "POST /v1/claims/${cid}/determine"
              payload: { determination: DISALLOWED }
              as: Receiver
              captures: { st3: $.data.status }
            - call: "POST /v1/claims/${cid}/reconsider"
              payload: {}
              as: Court
              captures: { st4: $.data.status }
            - call: "POST /v1/claims/${cid}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 30000 }
              as: Receiver
              captures: { st5: $.data.status, g5: $.data.general_allowed_cents }
          assert:
            - "${st1} == ALLOWED and ${g1} == 40000"
            - "${st2} == FILED and ${a2} is null (buckets cleared on reconsider)"
            - "${st3} == DISALLOWED"
            - "${st4} == FILED (loop closes)"
            - "${st5} == ALLOWED and ${g5} == 30000 (re-determination recomputes buckets)"

      - name: distribution_plan_reject_amend_cycle
        grounds:
          - state_machines.DistributionPlan.FILED_to_REJECTED
          - state_machines.DistributionPlan.REJECTED_to_FILED
          - state_machines.DistributionPlan.FILED_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on the DISTRIBUTIONPLAN entity (different entity than
          the claim cycle): FILED -> REJECTED -> (amend) -> FILED -> APPROVED —
          the reject/amend loop closes a negotiation cycle with the court and
          re-pins the pool snapshot on re-filing.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default; cash 200000 from one liquidated asset"
            - "One GENERAL_UNSECURED claim ALLOWED 100000"
            - "Plan FILED with reserve_cents 0 (pool snapshot 200000)"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2006", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 200000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 200000 }
              as: Receiver
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Trade Supplier", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 100000 }
              as: Creditor
              captures: { c1: $.data.id }
            - call: "POST /v1/claims/${c1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 100000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { plan_id: $.data.id, snap0: $.data.pool_snapshot_cents }
          trigger:
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: REJECT }
              as: Court
              captures: { st1: $.data.status }
            - call: "POST /v1/distribution-plans/${plan_id}/amend"
              payload: {}
              as: Receiver
              captures: { st2: $.data.status, snap1: $.data.pool_snapshot_cents }
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: APPROVE }
              as: Court
              captures: { st3: $.data.status }
            - call: "GET /v1/claims/${c1}/payments"
              as: Receiver
              captures: { pay_amt: "$.data[0].scheduled_amount_cents" }
          assert:
            - "${st1} == REJECTED"
            - "${st2} == FILED and ${snap1} == 200000 (pool re-pinned on amend)"
            - "${st3} == APPROVED (cycle completed)"
            - "${pay_amt} == 100000 (general class covered in full by pool 200000)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: plan_approval_case_to_payment_generation
        grounds:
          - state_machines.DistributionPlan.FILED_to_APPROVED
          - state_machines.Case.ACTIVE_to_DISTRIBUTING
          - entities.DistributionPayment.fields.plan_id
        distinguishing_aspect: |
          Depth-3 cascade from trigger POST /v1/distribution-plans/{id}/decide
          (APPROVE): (A) plan FILED -> APPROVED with final waterfall; the
          approval itself moves (B) the case ACTIVE -> DISTRIBUTING; the case's
          entry into DISTRIBUTING then materializes (C) DistributionPayment rows
          in SCHEDULED status — each link caused by the previous link, and the
          payment rows did not exist before the case transitioned.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default; cash 150000 from one liquidated asset"
            - "Claim G GENERAL_UNSECURED ALLOWED 90000; claim I INVESTOR ALLOWED 500000"
            - "Plan FILED with reserve_cents 0 (pool 150000)"
            - "Before approval: plan's payment list is empty and case is ACTIVE"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2007", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 150000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 150000 }
              as: Receiver
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Trade Supplier", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 90000 }
              as: Creditor
              captures: { cg: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Investor I", creditor_type: INVESTOR, filed_amount_cents: 500000 }
              as: Creditor
              captures: { ci: $.data.id }
            - call: "POST /v1/claims/${cg}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 90000 }
              as: Receiver
            - call: "POST /v1/claims/${ci}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 500000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { plan_id: $.data.id }
            - call: "GET /v1/distribution-plans/${plan_id}/payments"
              as: Receiver
          trigger:
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: APPROVE }
              as: Court
              captures: { plan_status: $.data.status }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { case_status: $.data.status }
            - call: "GET /v1/claims/${cg}/payments"
              as: Receiver
              captures: { g_amt: "$.data[0].scheduled_amount_cents", g_st: "$.data[0].status" }
            - call: "GET /v1/claims/${ci}/payments"
              as: Receiver
              captures: { i_amt: "$.data[0].scheduled_amount_cents" }
          assert:
            - "Link A: ${plan_status} == APPROVED"
            - "Link B: ${case_status} == DISTRIBUTING (caused by the approval)"
            - "Link C: payment rows materialized on the case's entry to DISTRIBUTING — claim G row ${g_amt} == 90000 with status ${g_st} == SCHEDULED; claim I row ${i_amt} == 60000 (pro-rata of remaining pool 60000)"
            - "Pre-cascade check: the plan's payment list returned 0 rows before the decide call"

      - name: claim_reconsider_totals_to_plan_withdrawal
        grounds:
          - state_machines.Claim.ALLOWED_to_FILED
          - entities.Case.fields.allowed_claims_total_cents
          - state_machines.DistributionPlan.FILED_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger — POST /v1/claims/{id}/reconsider:
          (A) claim ALLOWED -> FILED clearing its buckets; that clearing makes
          (B) the case's allowed_claims_total_cents drop by 300000; the total's
          change then forces (C) the case's FILED plan to auto-WITHDRAWN because
          the plan's premise (determined claim totals) is stale.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default"
            - "Three GENERAL claims all ALLOWED at filed amounts 100000 + 200000 + 300000 (allowed total 600000)"
            - "Plan FILED with reserve_cents 0"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2008", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor One", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 100000 }
              as: Creditor
              captures: { c1: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor Two", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 200000 }
              as: Creditor
              captures: { c2: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor Three", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 300000 }
              as: Creditor
              captures: { c3: $.data.id }
            - call: "POST /v1/claims/${c1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 100000 }
              as: Receiver
            - call: "POST /v1/claims/${c2}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 200000 }
              as: Receiver
            - call: "POST /v1/claims/${c3}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 300000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { plan_id: $.data.id }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { tot_before: $.data.allowed_claims_total_cents }
          trigger:
            - call: "POST /v1/claims/${c3}/reconsider"
              payload: {}
              as: Court
              captures: { c3_status: $.data.status, c3_allowed: $.data.allowed_amount_cents }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { tot_after: $.data.allowed_claims_total_cents }
            - call: "GET /v1/distribution-plans/${plan_id}"
              as: Receiver
              captures: { plan_status: $.data.status }
          assert:
            - "Link A: ${c3_status} == FILED and ${c3_allowed} is null"
            - "Link B: ${tot_before} == 600000 and ${tot_after} == 300000 (drop caused by the reconsideration)"
            - "Link C: ${plan_status} == WITHDRAWN (caused by the total's change)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fee_pay_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_ESTATE_FUNDS]
        distinguishing_aspect: |
          Error-category pair STATE vs BUSINESS_FISCAL: a second pay on an
          already-PAID fee application violates both the own-state precondition
          (application is PAID, priority 6) and the fiscal floor (cash 0 <
          approved 100000, priority 12) — the state error ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default; cash exactly 100000"
            - "Engagement COUNSEL HOURLY APPROVED, cap 1000000"
            - "Fee application for 100000 APPROVED at 100000, then PAID (cash -> 0)"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2009", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 100000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 100000 }
              as: Receiver
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 1000000 }
              as: Receiver
              captures: { eng_id: $.data.id }
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", time_entries: [ { hours: 1.0, rate_cents: 100000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { fid: $.data.id }
            - call: "POST /v1/fee-applications/${fid}/decide"
              payload: { decision: APPROVE, approved_amount_cents: 100000 }
              as: Court
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { v1: $.data.version }
            - call: "POST /v1/fee-applications/${fid}/pay"
              payload: { expected_case_version: "${v1}" }
              as: Receiver
              captures: { pay_st: $.data.status }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { v2: $.data.version, cash_after: $.data.cash_on_hand_cents }
          trigger:
            - call: "POST /v1/fee-applications/${fid}/pay"
              payload: { expected_case_version: "${v2}" }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "First pay succeeded: ${pay_st} == PAID and ${cash_after} == 0"
            - "Second pay carries a FRESH OCC version (${v2}), so it passes priority 5 and reaches the failing checks"
            - "${err} == ERR_INVALID_STATE — the priority-6 state error beats the priority-12 fiscal error (cash 0 < 100000 would otherwise yield ERR_INSUFFICIENT_ESTATE_FUNDS)"

      - name: plan_create_temporal_beats_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_STATUS_REPORT_OVERDUE]
          - errors[ERR_PLAN_ALREADY_OPEN]
        distinguishing_aspect: |
          Error-category pair BUSINESS_TEMPORAL vs BUSINESS_CONSTRAINT (a
          different pair than state-vs-fiscal): creating a second plan while a
          periodic report is overdue violates both the overdue gate (priority 9)
          and the one-open-plan constraint (priority 10) — the temporal error
          ERR_STATUS_REPORT_OVERDUE wins.
        test_recipe:
          setup:
            - "Case ACTIVE with appointment 2026-08-01 and 30-day reporting interval; one claim ALLOWED 50000; first plan FILED"
            - "Clock advanced to 2026-09-15 with no status reports filed -> report_overdue true (now > 2026-08-31)"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2010", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Trade Supplier", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 50000 }
              as: Creditor
              captures: { c1: $.data.id }
            - call: "POST /v1/claims/${c1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 50000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { plan1: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STATUS_REPORT_OVERDUE — priority-9 temporal gate beats priority-10 ERR_PLAN_ALREADY_OPEN, even though plan ${plan1} is still FILED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: authority_limit_exact_equality_no_approval
        grounds:
          - validations[priority=8]
          - entities.Case.fields.authority_limit_cents
          - errors[ERR_AUTHORIZATION_REQUIRED]
        distinguishing_aspect: |
          Boundary on a MONETARY threshold via POST /v1/assets/{id}/liquidate:
          court approval is required only when estimated_value_cents is STRICTLY
          greater than authority_limit_cents — an asset estimated at exactly
          500000 (== limit) liquidates with no authorization, while 500001
          (> limit) is rejected with ERR_AUTHORIZATION_REQUIRED.
        test_recipe:
          setup:
            - "Case ACTIVE, authority_limit_cents 500000; clock at default"
            - "Asset A1 estimated 500000 (exactly the limit); Asset A2 estimated 500001 (one cent over)"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2011", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "At-limit asset", asset_class: EQUIPMENT, estimated_value_cents: 500000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Over-limit asset", asset_class: EQUIPMENT, estimated_value_cents: 500001 }
              as: Receiver
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 400000 }
              as: Receiver
              captures: { st1: $.data.status }
            - call: "POST /v1/assets/${a2}/liquidate"
              payload: { liquidation_value_cents: 400000 }
              as: Receiver
              captures: { err2: $.data.error_id }
          assert:
            - "${st1} == LIQUIDATED — estimated == limit requires NO approval"
            - "${err2} == ERR_AUTHORIZATION_REQUIRED — estimated one cent over the limit does"

      - name: bar_date_exact_timestamp_accepted
        grounds:
          - validations[priority=9]
          - entities.Case.fields.bar_date
          - entities.Claim.fields.filed_at
          - errors[ERR_CLAIM_BARRED]
        distinguishing_aspect: |
          Boundary on a DATETIME deadline via POST /v1/claims (a different
          metric and endpoint than the monetary authority limit): the bar date
          is INCLUSIVE — a claim filed at exactly 2026-09-01T00:00:00Z is
          timely, while one second later (2026-09-01T00:00:01Z) is barred.
        test_recipe:
          setup:
            - "Case ACTIVE, bar_date 2026-09-01T00:00:00Z"
            - "Logical clock set to exactly the bar date, then advanced by one second"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2012", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Timely Creditor", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 10000 }
              as: Creditor
              captures: { st1: $.data.status, filed1: $.data.filed_at }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: SystemAdmin
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Late Creditor", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 10000 }
              as: Creditor
              captures: { err2: $.data.error_id }
          assert:
            - "${st1} == FILED and ${filed1} == 2026-09-01T00:00:00Z — filed_at == bar_date is timely (inclusive)"
            - "${err2} == ERR_CLAIM_BARRED — one second past the bar date is barred"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fee_application_requires_approved_engagement
        grounds:
          - validations[priority=7]
          - state_machines.Engagement.PROPOSED_to_APPROVED
          - entities.FeeApplication.fields.engagement_id
          - errors[ERR_ENGAGEMENT_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair FEEAPPLICATION -> ENGAGEMENT: a fee application can only
          be created (into FILED) while its engagement is APPROVED; against a
          PROPOSED engagement creation fails with ERR_ENGAGEMENT_NOT_APPROVED,
          and after the court approves the engagement the identical create
          succeeds.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default"
            - "Engagement COUNSEL HOURLY in PROPOSED (not yet decided by the court)"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2013", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 1000000 }
              as: Receiver
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", time_entries: [ { hours: 1.0, rate_cents: 20000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { err1: $.data.error_id }
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", time_entries: [ { hours: 1.0, rate_cents: 20000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { st2: $.data.status }
          assert:
            - "${err1} == ERR_ENGAGEMENT_NOT_APPROVED while the engagement is PROPOSED"
            - "${st2} == FILED after the court approves the engagement — identical payload, cross-entity gate now satisfied"

      - name: discharge_requires_accepted_final_report
        grounds:
          - state_machines.Case.DISTRIBUTING_to_DISCHARGED
          - validations[priority=10]
          - errors[ERR_DISCHARGE_BLOCKED]
        distinguishing_aspect: |
          Entity pair CASE -> STATUSREPORT (a different pair than
          FeeApplication -> Engagement): discharge is blocked by
          ERR_DISCHARGE_BLOCKED when every other aggregate precondition holds
          (plan EXECUTED, claims determined, assets terminal, cash 0) but no
          FINAL report is ACCEPTED; filing and accepting the FINAL report then
          unblocks the identical discharge call.
        test_recipe:
          setup:
            - "Case with cash 50000, one GENERAL claim ALLOWED 50000, plan APPROVED (pool 50000, one payment 50000)"
            - "The single payment PAID -> plan EXECUTED, cash 0, case DISTRIBUTING"
            - "No FINAL report filed yet"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2014", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 50000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 50000 }
              as: Receiver
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Trade Supplier", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 50000 }
              as: Creditor
              captures: { c1: $.data.id }
            - call: "POST /v1/claims/${c1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 50000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { plan_id: $.data.id }
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "GET /v1/claims/${c1}/payments"
              as: Receiver
              captures: { pay_id: "$.data[0].id" }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { cv: $.data.version }
            - call: "POST /v1/distribution-payments/${pay_id}/pay"
              payload: { expected_case_version: "${cv}" }
              as: Receiver
              captures: { pay_st: $.data.status }
          trigger:
            - call: "POST /v1/cases/${case_id}/discharge"
              payload: {}
              as: Court
              captures: { err1: $.data.error_id }
            - call: "POST /v1/status-reports"
              payload: { case_id: "${case_id}", report_type: FINAL, period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", narrative: "Final accounting: all assets liquidated, all allowed claims paid in full." }
              as: Receiver
              captures: { rep_id: $.data.id }
            - call: "POST /v1/status-reports/${rep_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "POST /v1/cases/${case_id}/discharge"
              payload: {}
              as: Court
              captures: { case_st: $.data.status }
          assert:
            - "Payment executed: ${pay_st} == PAID (plan bubble-up to EXECUTED, cash 0)"
            - "${err1} == ERR_DISCHARGE_BLOCKED — sole unmet precondition is the missing ACCEPTED FINAL report"
            - "${case_st} == DISCHARGED after the FINAL report is filed and accepted"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: fee_application_period_overlap_half_open
        grounds:
          - validations[priority=10]
          - entities.FeeApplication.fields.period_start
          - entities.FeeApplication.fields.period_end
          - errors[ERR_FEE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: free-form HALF-OPEN non-overlap on the ENGAGEMENT
          resource — [2026-08-15, 2026-09-15) intersecting an existing
          [2026-08-01, 2026-08-31) application is rejected
          (ERR_FEE_PERIOD_OVERLAP), while the adjacent [2026-08-31, 2026-09-30)
          is accepted and gaps are permitted.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default"
            - "Engagement COUNSEL HOURLY APPROVED with one FILED application covering [2026-08-01, 2026-08-31)"
