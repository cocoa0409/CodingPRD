scaffold_corner_design:
  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: product_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Product]
        distinguishing_aspect: "Client-injected id/version are ignored; server mints a UUID id, sets version 1, and stamps created_at from the logical clock."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T10:00:00Z; one packaging component exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T10:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 1000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku_code: "TRUFFLE-24", name: "Truffle 24pc", product_type: "SEASONAL", brand: "OWN", base_price_cents: 1000, unit_weight_grams: 240, shelf_life_days: 180, packaging_component_id: "${pkg_id}", id: "00000000-0000-0000-0000-000000000000", version: 99 }
              as: ProductionPlanner
              captures: { prod_id: $.data.id, prod_v: $.data.version, prod_created: $.data.created_at }
          assert:
            - "response version == 1 (injected 99 ignored)"
            - "response id != 00000000-0000-0000-0000-000000000000 (server-minted UUID)"
            - "response created_at == 2026-08-15T10:00:00Z (logical clock stamp)"

      - name: product_missing_required_sku_rejected
        claim_type: required_fields
        grounds: [entities.Product.fields.sku_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field sku_code yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One packaging component exists"
          setup_api_calls:
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 1000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { name: "No SKU", product_type: "STANDARD", brand: "OWN", base_price_cents: 100, unit_weight_grams: 10, shelf_life_days: 90, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /products returns an empty list (nothing persisted)"

      - name: product_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Product, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: gift_component_cycle_rejected
        claim_type: type_constraint
        grounds: [entities.GiftComponent, "errors[ERR_GIFT_CYCLE]"]
        distinguishing_aspect: "The gift-set graph must stay acyclic: a transitive back-edge (G2 contains G1 while G1 contains G2) and a self-loop are both rejected with ERR_GIFT_CYCLE."
        test_recipe:
          setup:
            - "Products G1, G2 (both GIFT_SET) and CX (STANDARD); G1 already contains CX and G2"
          setup_api_calls:
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 1000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "G1", name: "Gift 1", product_type: "GIFT_SET", brand: "OWN", base_price_cents: 5000, unit_weight_grams: 500, shelf_life_days: 120, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { g1: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "G2", name: "Gift 2", product_type: "GIFT_SET", brand: "OWN", base_price_cents: 3000, unit_weight_grams: 300, shelf_life_days: 120, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { g2: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "CX", name: "Component X", product_type: "STANDARD", brand: "OWN", base_price_cents: 300, unit_weight_grams: 50, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { cx: $.data.id }
            - call: "POST /gift-components"
              payload: { gift_product_id: "${g1}", component_product_id: "${cx}", qty_per_set: 1 }
              as: ProductionPlanner
            - call: "POST /gift-components"
              payload: { gift_product_id: "${g1}", component_product_id: "${g2}", qty_per_set: 1 }
              as: ProductionPlanner
          trigger:
            - call: "POST /gift-components"
              payload: { gift_product_id: "${g2}", component_product_id: "${g1}", qty_per_set: 1 }
              as: ProductionPlanner
              captures: { err_cycle: $.data.error_id }
            - call: "POST /gift-components"
              payload: { gift_product_id: "${g1}", component_product_id: "${g1}", qty_per_set: 1 }
              as: ProductionPlanner
              captures: { err_self: $.data.error_id }
          assert:
            - "back-edge G2<-G1 rejected: error_id == ERR_GIFT_CYCLE with HTTP 422"
            - "self-loop G1<-G1 rejected: error_id == ERR_GIFT_CYCLE with HTTP 422"
            - "GET /products/${g2}/gift-components shows only the original forward edges"

      - name: gift_component_immutable_no_version
        claim_type: immutability
        grounds: [entities.GiftComponent]
        distinguishing_aspect: "GiftComponent has common_fields: false — its create response carries id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "Products GS (GIFT_SET) and CX (STANDARD) exist"
          setup_api_calls:
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 1000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "GS", name: "Gift Set", product_type: "GIFT_SET", brand: "OWN", base_price_cents: 5000, unit_weight_grams: 700, shelf_life_days: 120, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { gs: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "CX", name: "Component X", product_type: "STANDARD", brand: "OWN", base_price_cents: 300, unit_weight_grams: 50, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { cx: $.data.id }
          trigger:
            - call: "POST /gift-components"
              payload: { gift_product_id: "${gs}", component_product_id: "${cx}", qty_per_set: 2 }
              as: ProductionPlanner
              captures: { gc_id: $.data.id }
          assert:
            - "response contains id and created_at"
            - "response contains no version key and no updated_at key (common_fields: false)"
            - "GET /products/${gs}/gift-components returns the row with qty_per_set == 2"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: run_created_initial_state_planned
        claim_type: initial_state
        grounds: [state_machines.ProductionRun, calculations.packaging_requirement]
        distinguishing_aspect: "A newly created run starts in PLANNED with its packaging reservation already applied (500 units -> 50 components)."
        test_recipe:
          setup:
            - "BASE window PUBLISHED; product/recipe/line exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "NOVELTY", name: "Novelty", product_type: "STANDARD", brand: "OWN", base_price_cents: 800, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Novelty mass", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /seasonal-windows"
              payload: { season_code: "BASE", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 5000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
          trigger:
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 500, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id, run_status: $.data.status, run_rsv: $.data.packaging_reserved_qty }
            - call: "GET /packaging-components"
              payload: {}
              as: ProductionPlanner
              captures: { comp_rsv: "$.data[0].qty_reserved" }
          assert:
            - "ProductionRun.${run_id}.status == PLANNED (initial state)"
            - "ProductionRun.${run_id}.packaging_reserved_qty == 50 (ceil(500/10))"
            - "ProductionRun.${run_id}.expected_output_units is null (STANDARD run)"
            - "PackagingComponent qty_reserved == 50 immediately after creation"

      - name: run_complete_from_planned_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ProductionRun, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete is only declared from IN_PROGRESS; from PLANNED it fails with ERR_INVALID_STATE and no lot is created."
        test_recipe:
          setup:
            - "BASE window PUBLISHED; a PLANNED run exists (line need not be prepared since the transition is rejected before gating)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "NOVELTY", name: "Novelty", product_type: "STANDARD", brand: "OWN", base_price_cents: 800, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Novelty mass", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /seasonal-windows"
              payload: { season_code: "BASE", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 5000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 500, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /production-runs/${run_id}/complete"
              payload: { actual_cook_temp_c: 85, actual_temper_exit_c: 29, output_units: 500 }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "GET /production-runs/${run_id} still shows status PLANNED and created_lot_id null"

      - name: run_cancel_from_completed_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.ProductionRun, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: cancel from COMPLETED fails with ERR_INVALID_STATE; packaging consumption is not reversed."
        test_recipe:
          setup:
            - "BASE window; line prepared with STAR mold; run completed with output 500 (packaging 50 consumed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "NOVELTY", name: "Novelty", product_type: "STANDARD", brand: "OWN", base_price_cents: 800, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Novelty mass", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /molds"
              payload: { shape_code: "STAR", cavity_count: 60 }
              as: ProductionPlanner
              captures: { mold_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /seasonal-windows"
              payload: { season_code: "BASE", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 5000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "SHAPE_ONLY", to_mold_id: "${mold_id}", expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_id: $.data.id }
            - call: "POST /changeovers/${ch_id}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_id}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 500, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/start"
              payload: {}
              as: LineOperator
            - call: "POST /production-runs/${run_id}/complete"
              payload: { actual_cook_temp_c: 85, actual_temper_exit_c: 29, output_units: 500 }
              as: LineOperator
          trigger:
            - call: "POST /production-runs/${run_id}/cancel"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "GET /packaging-components"
              payload: {}
              as: ProductionPlanner
              captures: { comp_onhand: "$.data[0].qty_on_hand", comp_rsv: "$.data[0].qty_reserved" }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 (terminal lockdown)"
            - "ProductionRun.${run_id}.status remains COMPLETED"
            - "component qty_on_hand == 99950 and qty_reserved == 0 (consumption not reversed by the rejected cancel)"

      - name: changeover_lifecycle_installs_mold_and_clearance
        claim_type: side_effect_execution
        grounds: [state_machines.Changeover, state_machines.ProductionLine, state_machines.Mold]
        distinguishing_aspect: "Full changeover pipeline: SHAPE_ONLY installs the mold and leaves cleared_allergens at []; a following ALLERGEN_WASH sets cleared_allergens to its target set."
        test_recipe:
          setup:
            - "LINE-1 exists (no mold, cleared []); mold STAR is AVAILABLE"
          setup_api_calls:
            - call: "POST /molds"
              payload: { shape_code: "STAR", cavity_count: 60 }
              as: ProductionPlanner
              captures: { mold_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
          trigger:
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "SHAPE_ONLY", to_mold_id: "${mold_id}", expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_1: $.data.id }
            - call: "POST /changeovers/${ch_1}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_1}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "GET /production-lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_st: $.data.status, line_mold: $.data.current_mold_id, line_clr: $.data.cleared_allergens, line_v2: $.data.version }
            - call: "GET /molds"
              payload: { shape_code: "STAR" }
              as: ProductionPlanner
              captures: { mold_st: "$.data[0].status" }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "ALLERGEN_WASH", target_allergens: ["MILK"], expected_line_version: "${line_v2}" }
              as: LineOperator
              captures: { ch_2: $.data.id }
            - call: "POST /changeovers/${ch_2}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_2}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "GET /production-lines/${line_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "after SHAPE_ONLY release: line status AVAILABLE, current_mold_id == ${mold_id}, cleared_allergens == []"
            - "mold STAR status == INSTALLED"
            - "after ALLERGEN_WASH release: line cleared_allergens == [MILK] and status AVAILABLE"
            - "both changeovers end in status RELEASED"

      - name: hold_disposition_from_terminal_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.QualityHold, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RELEASED hold is terminal: a second disposition (SCRAP) fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "BASE window; line prepared; ACTIVE lot of 100 units with an OPEN BLOOM hold (affected 1, rate 1.00)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "NOVELTY", name: "Novelty", product_type: "STANDARD", brand: "OWN", base_price_cents: 800, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Novelty mass", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /molds"
              payload: { shape_code: "STAR", cavity_count: 60 }
              as: ProductionPlanner
              captures: { mold_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /seasonal-windows"
              payload: { season_code: "BASE", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 5000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "SHAPE_ONLY", to_mold_id: "${mold_id}", expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_id: $.data.id }
            - call: "POST /changeovers/${ch_id}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_id}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /production-runs"
