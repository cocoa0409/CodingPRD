      - name: publishing_a_superseding_privacy_rule_stales_the_mapping_and_opens_an_impact_assessment
        claim_type: Cascade down
        grounds:
          - state_machines.GuidelineRule.transitions.EFFECTIVE_to_SUPERSEDED
          - endpoints.POST_/guideline-rules/{id}/publish.side_effects
          - state_machines.ImpactAssessment.initial_state
          - calculations.impact_severity
        distinguishing_aspect: "One publish call re-points the PASSED mapping at the new rule, marks it STALE with staled_by_rule_id, opens exactly one OPEN ImpactAssessment with remediation_deadline_at = 2026-08-01T00:00:00Z + 30*24h = 2026-08-31T00:00:00Z and impact_severity 4.00, and halves the index from 100.00 to 50.00."
