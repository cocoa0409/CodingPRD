  - method: POST
    path: "/accounts/{id}/activate"
    description: "Move an ONBOARDING account to ACTIVE"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["status = ACTIVE", "increments Account.version by 1"]

  - method: POST
    path: "/accounts/{id}/credit-hold"
    description: "Place an ACTIVE account on credit hold"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Account
    side_effects: ["status = CREDIT_HOLD", "increments Account.version by 1"]

  - method: POST
    path: "/accounts/{id}/payments"
