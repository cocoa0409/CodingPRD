          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "A 404, a 422 and a 403 all return response_type \"error\" with data carrying exactly error_id and message and a meta block holding api_request_id and api_request_timestamp — the error envelope is uniform across error classes and never leaks a partial entity body."
