            - "all three responses are HTTP 409"
            - "DemoEvent.${event_id}.version == ${v_cancelled}"
            - "DemoEvent.${event_id}.allocated_sample_cases == 0"
            - "GET /cancellation-credits?demo_event_id=${event_id} -> data has exactly 0 rows"

      - name: repeating_submit_on_an_already_submitted_event_is_rejected
        claim_type: idempotency
