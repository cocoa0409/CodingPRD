  # ===========================================================================
  # Section: cross-cutting complexity layers (§0.2)
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_grower_version_on_patch
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[grower-profile-stale-version]"
          - "errors[ERR_STALE_GROWER_VERSION]"
        distinguishing_aspect: "PATCH /growers/{id} with stale expected_grower_version returns 412; matching version succeeds and increments version by 1."
        test_recipe:
          setup: ["Grower at version v after creation; one PATCH bumps to v+1; a second PATCH with old v fails"]
          setup_api_calls:
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 100, base_fee_cents: 0, overage_rate_cents_per_acre: 100, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 30 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "OCC2Farms", contact_email: "occ2@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id, v0: $.data.version }
            # First PATCH (succeeds, bumps version)
            - call: "PATCH /ag-drone/growers/${grower_id}"
              payload: { liability_coverage_cents: 60000000, expected_grower_version: "${v0}" }
              as: OpsAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "PATCH /ag-drone/growers/${grower_id}"
              payload: { liability_coverage_cents: 70000000, expected_grower_version: "${v0}" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_GROWER_VERSION"
            - "GET /growers/${grower_id} -> version == ${v1} and liability_coverage_cents == 60000000 (unchanged by failed PATCH)"

      - name: clock_sweep_expires_authorization
        claim_type: scheduled_deferred_actions
        grounds: [state_machines.AirspaceAuthorization.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "Setting current_utc past effective_until transitions authorization ACTIVE -> EXPIRED."
        test_recipe:
          setup: ["Authorization effective 2026-06-02T00:00Z to 2026-06-03T00:00Z, ACTIVE"]
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 100, base_fee_cents: 0, overage_rate_cents_per_acre: 100, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 30 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "CSFarms", contact_email: "cs@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "B", insurance_policy_no: "POL-CS" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/airspace-authorizations"
              payload: { field_id: "${field_id}", authorization_ref: "LAANC-EXP", max_altitude_ft: 400, effective_from: "2026-06-02T00:00:00Z", effective_until: "2026-06-03T00:00:00Z" }
              as: OpsAdmin
              captures: { auth_id: $.data.id, auth_status_initial: $.data.status }
          trigger:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:01Z" }
              as: OpsAdmin
            - call: "GET /ag-drone/airspace-authorizations/${auth_id}"
              payload: {}
              as: OpsAdmin
              captures: { auth_status: $.data.status }
          assert:
            - "auth_status_initial == ACTIVE"
            - "auth_status == EXPIRED"

