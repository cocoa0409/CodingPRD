  - rule_id: transitive_cascade
    instances:
      - name: escalation_freeze_suspend_cancel_four_hop_chain
        grounds:
          - state_machines.CompetitorContact.UNDER_REVIEW_to_ESCALATED
          - state_machines.BusinessUnit.RESTRICTED_to_FROZEN
          - state_machines.AssociationParticipation.ACTIVE_to_SUSPENDED
          - state_machines.MeetingAttendance.PLANNED_to_CANCELLED
          - calculations.business_unit_posture
        distinguishing_aspect: |
          DEPTH-4 chain originating at the contact-escalation transition:
          escalating the contact raises exposure_points (hop 1), which alone
          drives posture into FROZEN (hop 2), which alone suspends the unit's
          ACTIVE participation (hop 3), which alone cancels that participation's
          future PLANNED attendance (hop 4). Each hop is caused by the previous
          hop, never directly by the escalation call.
        test_recipe:
          setup:
            - "BusinessUnit with exposure_budget_points 200, review_minutes_budget 480 and manual_exposure_adjustment_points 45.00, so posture is RESTRICTED before the trigger."
            - "A PRICING employee with current training and clearance GRANTED."
            - "An APPROVED TIER_1_LOW association with competitor_density_pct 0 (review load 30) and an ACTIVE participation reserving 30 minutes."
            - "One PLANNED MeetingAttendance for a meeting that starts on 2026-09-10, well after the clock's 2026-08-01 default."
            - "One CompetitorContact charged 20.00 sitting in UNDER_REVIEW; exposure_points therefore 65.00."
