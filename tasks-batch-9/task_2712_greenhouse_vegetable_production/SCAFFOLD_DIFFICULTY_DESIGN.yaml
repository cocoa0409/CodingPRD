            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Sera Vos", skill: "SCOUT", hourly_rate_usd: 21.00, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_scout: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Tomas Reyn", skill: "SCOUT", hourly_rate_usd: 26.00, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_coord: $.data.id }
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", observed_at: "2026-08-05T08:00:00Z", pest_code: "WHITEFLY", plants_inspected: 60, pest_count_per_plant: 0.800 }
              as: IPMScout
              as_user_id: "${w_scout}"
              captures: { obs1: $.data.id }
            - call: "POST /bio-control-releases"
              payload: { zone_id: "${zone_a}", observation_id: "${obs1}", agent_code: "ENCARSIA", planned_release_count: 6000, planned_release_date: "2026-08-06" }
              as: IPMScout
              as_user_id: "${w_scout}"
              captures: { rel1: $.data.id }
