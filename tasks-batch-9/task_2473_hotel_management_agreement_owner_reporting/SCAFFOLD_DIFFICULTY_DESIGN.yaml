            - "hop 3 — exactly one CashDistribution exists for ${pkg4a}: status CALCULATED, available_cash_cents == 6000000, wc_restoration_cents == 0, base_fee_paid_cents == 1787500, reserve_contribution_cents == 2200001, owner_priority_paid_cents == 1000000, incentive_fee_paid_cents == 1012499, residual_to_owner_cents == 0"
            - "hop 3 — CashDistribution.${dist4a}.shortfall_cents == 1158754 (total demand 7158754 less the 6000000 of available cash)"
            - "hop 4 — exactly one WorkingCapitalCall exists for ${agr4a}: reason == DISTRIBUTION_SHORTFALL, amount_cents == 1158754, auto_created == true, status == REQUESTED, due_date_utc == 2026-08-16T00:00:00Z"
