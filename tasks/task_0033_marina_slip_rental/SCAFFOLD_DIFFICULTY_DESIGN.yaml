          business_temporal — different category pair than the first
          instance.
        test_recipe:
          setup:
            - "Marina HMJ; Slip with liveaboard_allowed=false; existing RESERVED lease occupies 2026-09-01..2026-09-10 on that slip; Tenant TX (NOT approved for liveaboard) attempts to reserve same slip same window with is_liveaboard=true."
