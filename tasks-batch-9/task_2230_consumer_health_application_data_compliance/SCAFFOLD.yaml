  - method: GET
    path: "/health-data/geofence-zones"
    description: "Lists geofence zones, filterable by product"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["app_product_id?", "prohibition_rule?", "limit?", "offset?"]
    output: GeofenceZone[]
    side_effects: []

  - method: POST
