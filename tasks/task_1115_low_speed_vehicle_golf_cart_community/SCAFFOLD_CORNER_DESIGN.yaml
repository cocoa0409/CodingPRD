            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H WIN", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-WIN", slot_count: 2, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
          trigger:
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T10:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION with http 400"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_registrations_filtered_by_vehicle_id
        claim_type: retrieval
        grounds: [endpoints]
        distinguishing_aspect: "FK reverse-reachability: GET /api/registrations?vehicle_id=X returns exactly the registrations of vehicle X (1 of 2 here), proving the filtered-list form works."
        test_recipe:
          setup: ["holder with two vehicles, one DRAFT registration each"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-FK" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H FK", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v1: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v2: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v1}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v2}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
