            - "${obs2_pub} == 20 drives consecutive_breach_count_standard to ESCALATION_BREACH_COUNT_REQUIRED (2), so exactly one ticket is created; ${tk_reason} == WAIT_THRESHOLD_BREACH and ${tk_scope} == STANDARD"
            - "${tk_ack_state} == ACKNOWLEDGED and ${tk_ack_by} == ${sup_id}; posture stayed ELEVATED because an ACKNOWLEDGED ticket still counts as open"
            - "${tk_res_state} == RESOLVED_LANE_OPENED with ${tk_res_lane} == ${lane_id} and ${tk_res_div} == null"
            - "${div_total_after_lane} == 0 — the LANE_OPENED branch must not touch diverted_pax_total"
            - "${posture_after_lane} == NORMAL — open_escalation_count fell to 0 and no lane is OUT_OF_SERVICE, so ELEVATED -> NORMAL fired"

