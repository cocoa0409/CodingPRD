# =============================================================================
# SCAFFOLD.yaml — §1.0–§1.7 seed tables
# Task: task_2703_packaging_artwork_development_approval
# Difficulty band: Expert+ (deliberately above the §0.4 Expert row: the scenario
# needs 12 tightly-coupled entity types to express brief → artwork version →
# parallel/sequential review routing → proof/press-check → plate ordering →
# obsolescence runout → error-escape cost recovery as ONE coupled ledger.)
# =============================================================================
scenario: |
  Generate task harder than expert level!

  2703. Packaging Artwork Development & Approval (consumer brand packaging operations): brief creation with regulatory requirements, marketing claims and structural specifications, design routing through brand, legal, regulatory and quality reviewers with parallel and sequential steps, mandatory element verification including net contents, ingredient statements, allergens and codes, version control with change tracking and reason-for-change documentation, printer proof review with color standards, substrate approval and press check attendance, plate ordering, obsolescence management and inventory runout coordination for changing artwork, multi-language and multi-market variant management, error escape investigation and cost recovery from printers

domain_name: packaging-artwork-development-approval

# Flat/graph topology: every collection is a top-level path (`/briefs`,
# `/artwork-versions`, `/printer-proofs`, …). There is no single owning
# aggregate root in the URL, so the api_prefix is the empty string.
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: graph
  # ArtworkVersion.supersedes_version_id is self-referential (revision chain);
  # ArtworkVersion.claim_ids is a many-to-many library reference into
  # MarketingClaim; PrinterProof / PlateOrder / ErrorEscape each bridge the
  # ArtworkVersion aggregate and the Printer aggregate (cross_aggregate).

  state_machine_shape: cyclic
  # ArtworkVersion is cyclic (DRAFT → ELEMENTS_VERIFIED → IN_REVIEW →
  # REVISION_REQUESTED → DRAFT, and OBSOLETE → OBSOLETE_PENDING on reversal);
  # PrinterProof carries three independent state dimensions (color_status ×
  # substrate_status × press_check_status) whose product derives proof_state;
  # ReviewRoute is compound (status derived from its ReviewTask children);
  # ReviewTask is branching (APPROVED | CONDITIONAL | REJECTED | SKIPPED);
  # ErrorEscape is cyclic (RECOVERY_CLAIMED → DISPUTED → ROOT_CAUSE_ASSIGNED).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # A ReviewTask may not be decided by the X-User-ID that authored the
  # ArtworkVersion, nor by an X-User-ID that already decided another task on
  # the same ReviewRoute. Discipline↔role binding is exact (BRAND task needs
  # BrandReviewer, LEGAL needs LegalReviewer, …).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Brief
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: Stock-keeping-unit code the packaging artwork is developed for.
        constraints: "4-32 chars; unique across all Brief rows (case-sensitive)"
      - name: product_name
        type: string
        source: input
        description: Consumer-facing product name printed on pack.
        constraints: "3-120 chars"
      - name: regulatory_scheme
        type: enum
        source: input
        description: Labelling regime that governs mandatory element verification.
        constraints: "one of FDA_FOOD, EU_FIC, HEALTH_CANADA"
      - name: market_codes
        type: array
        source: input
        description: ISO 3166-1 alpha-2 market codes this brief covers.
        constraints: "1-6 entries, uppercase, unique; drives the multi-market penalty in mandatory_element_compliance_score"
      - name: language_codes
        type: array
        source: input
        description: BCP-47 primary language subtags that must appear on pack across the brief.
        constraints: "1-6 entries, lowercase, unique"
      - name: required_element_codes
        type: array
        source: input
        description: Mandatory elements each ArtworkVersion of this brief must satisfy.
        constraints: "1-7 unique entries from {NET_CONTENTS, INGREDIENT_STATEMENT, ALLERGEN_STATEMENT, DATE_CODE_ZONE, BARCODE, RECYCLING_MARK, ADDRESS_BLOCK}"
      - name: structural_spec
        type: object
        source: input
        description: "Structural specification: { component_type, dimensions_mm: { l, w, h }, substrate_class, print_process }."
        constraints: "component_type in {CARTON, LABEL, FILM, SHIPPER}; print_process in {OFFSET, FLEXO, GRAVURE, DIGITAL}"
      - name: net_contents_declaration
        type: object
        source: input
        description: "Authoritative net contents every ArtworkVersion must reproduce: { metric_value, metric_uom, us_value|null, us_uom|null }."
        constraints: "metric_value > 0; metric_uom in {G, KG, ML, L}; us_uom in {OZ, LB, FLOZ} when us_value is non-null"
      - name: status
        type: enum
        source: system
        description: Brief lifecycle state.
        default: DRAFT
        constraints: "one of DRAFT, APPROVED, REJECTED"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryReviewer that approved the brief; null while DRAFT.
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant the brief reached APPROVED; null otherwise.
      - name: review_note
        type: string
        source: system
        description: Note supplied with the approve/reject decision; null while DRAFT.
      - name: asset_count
        type: integer
        source: computed
        description: Count of ArtworkAsset rows whose artwork_asset.brief_id equals this brief's id.
        default: 0

  - name: MarketingClaim
    parent: null
    common_fields: true
    fields:
      - name: claim_code
        type: string
        source: input
        description: Claim library identifier; NOT unique on its own — see cleared-interval uniqueness below.
        constraints: "3-40 chars uppercase/dash"
      - name: claim_text
        type: string
        source: input
        description: Verbatim on-pack claim wording.
        constraints: "3-300 chars"
      - name: claim_type
        type: enum
        source: input
        description: Regulatory taxonomy of the claim.
        constraints: "one of NUTRIENT_CONTENT, STRUCTURE_FUNCTION, ORGANIC, FREE_FROM, SUSTAINABILITY"
      - name: market_code
        type: string
        source: input
        description: Single ISO 3166-1 alpha-2 market this clearance row applies to.
        constraints: "uppercase, 2 chars"
      - name: substantiation_ref
        type: string
        source: input
        description: Dossier reference substantiating the claim.
        constraints: "3-80 chars"
      - name: legal_status
        type: enum
        source: system
        description: Clearance state set by the LegalReviewer's clearance decision.
        default: DRAFT
        constraints: "one of DRAFT, CLEARED, REJECTED"
      - name: cleared_from_utc
        type: datetime
        source: system
        description: Inclusive start of the clearance window; null unless legal_status == CLEARED.
      - name: cleared_until_utc
        type: datetime
        source: system
        description: Exclusive end of the clearance window; null unless legal_status == CLEARED.
      - name: rejection_reason
        type: string
        source: system
        description: Reason recorded when legal_status becomes REJECTED.
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the LegalReviewer that recorded the clearance decision.
      - name: usage_count
        type: integer
        source: computed
        description: Count of ArtworkVersion rows whose claim_ids array contains this claim's id.
        default: 0

  - name: ArtworkAsset
    parent: Brief
    common_fields: true
    fields:
      - name: brief_id
        type: string
        source: input
        description: FK -> Brief.id; the brief this market/component variant realises.
      - name: market_code
        type: string
        source: input
        description: The single market this asset serves.
        constraints: "must be a member of Brief.market_codes; unique per (brief_id, market_code, component_type)"
      - name: language_codes
        type: array
        source: input
        description: Languages printed on this variant; drives the language penalty in mandatory_element_compliance_score.
        constraints: "1-6 unique entries, each a member of Brief.language_codes"
      - name: component_type
        type: enum
        source: input
        description: Packaging component this asset represents.
        constraints: "one of CARTON, LABEL, FILM, SHIPPER"
      - name: substrate_class
        type: enum
        source: input
        description: Substrate family the artwork is printed on; selects the color tolerance row.
        constraints: "one of COATED_PAPER, UNCOATED_PAPER, FILM, METALLIZED"
      - name: brand_critical_color
        type: boolean
        source: input
        description: True when the asset carries brand-critical color, tightening proof tolerance and forcing a press check.
        default: false
      - name: plate_budget_cents
        type: integer
        source: input
        description: Cap on the sum of ORDERED PlateOrder.cost_cents for this asset.
        constraints: ">= 0"
      - name: standard_unit_cost_cents
        type: integer
        source: computed
        description: STANDARD_UNIT_COST_CENTS[component_type]; the per-unit cost used by recovery and changeover math.
      - name: obsolescence_state
        type: enum
        source: system
        description: Obsolescence posture of the asset, advanced only by cascades.
        default: ACTIVE
        constraints: "one of ACTIVE, SUPERSEDE_PENDING, SUPERSEDED"
      - name: current_approved_version_id
        type: string
        source: system
        description: FK -> ArtworkVersion.id; the most recently APPROVED version of this asset, null until the first approval.
      - name: version_counter
        type: integer
        source: system
        description: Monotonic counter; the next ArtworkVersion.version_no equals version_counter + 1.
        default: 0
      - name: committed_plate_cost_cents
        type: integer
        source: computed
        description: "Conserved ledger: sum of PlateOrder.cost_cents over PlateOrder rows whose artwork_version_id belongs to this asset and whose status == ORDERED."
        default: 0
      - name: obsolete_units_total
        type: integer
        source: computed
        description: "Conserved ledger: sum of InventoryRunout.units_scrapped over runouts of this asset whose state == SCRAPPED."
        default: 0
      - name: changeover_cost_committed_cents
        type: integer
        source: computed
        description: "Conserved ledger: sum of InventoryRunout.total_changeover_cost_cents over runouts of this asset whose state == SCRAPPED."
        default: 0

  - name: ArtworkVersion
    parent: ArtworkAsset
    common_fields: true
    fields:
      - name: artwork_asset_id
        type: string
        source: input
        description: FK -> ArtworkAsset.id; owning market/component variant.
      - name: version_no
        type: integer
        source: system
        description: Sequential revision number within the asset, taken from ArtworkAsset.version_counter + 1.
      - name: supersedes_version_id
        type: string
        source: input
        description: FK -> ArtworkVersion.id; self-referential pointer to the version this revision is intended to replace. Null on the first version.
        constraints: "when non-null, must belong to the same artwork_asset_id"
      - name: author_user_id
        type: string
        source: system
        description: X-User-ID of the PackagingCoordinator that created this version; the segregation-of-duties subject.
      - name: reason_for_change_code
        type: enum
        source: input
        description: Change-control reason recorded for the revision.
        constraints: "one of NEW_LAUNCH, REGULATORY_UPDATE, CLAIM_CHANGE, MARKETING_REFRESH, PRINTER_CHANGE, ERROR_CORRECTION"
      - name: change_description
        type: string
        source: input
        description: Free-text reason-for-change documentation.
        constraints: "10-500 chars"
      - name: mandatory_elements
        type: object
        source: input
        description: "Artwork element payload verified by mandatory_element_compliance_score: { net_contents: { metric_value, metric_uom, us_value|null, us_uom|null }, ingredient_statement: { text, descending_order }, allergen_statement: { text, allergen_emphasis }, date_code_zone: { zone_mm2, position }, barcode: { gtin14 }, recycling_mark: { present }, address_block: { text } }."
      - name: claim_ids
        type: array
        source: input
        description: Array of MarketingClaim id values used on this artwork (library references, validated at submit and frozen at approval).
        default: []
        constraints: "0-8 unique entries; each must be an existing MarketingClaim id"
      - name: state
        type: enum
        source: system
        description: Version lifecycle state (cyclic; see §1.2).
        default: DRAFT
        constraints: "one of DRAFT, ELEMENTS_VERIFIED, IN_REVIEW, REVISION_REQUESTED, APPROVED, RELEASED_TO_PRINT, OBSOLETE_PENDING, OBSOLETE"
      - name: revision_cycle_count
        type: integer
        source: system
        description: Number of times this version has returned from review as REVISION_REQUESTED; gates re-submission at 3.
        default: 0
      - name: route_count
        type: integer
        source: system
        description: Number of ReviewRoute rows created for this version; next route_no equals route_count + 1.
        default: 0
      - name: check_run_no
        type: integer
        source: system
        description: Number of completed mandatory-element verification runs; ElementCheck rows carry the run they belong to.
        default: 0
      - name: compliance_score
        type: number
        source: computed
        description: Output of mandatory_element_compliance_score for the latest check run, one decimal place; null before the first run.
      - name: failed_element_count
        type: integer
        source: computed
        description: Count of ElementCheck rows for check_run_no whose result == FAIL.
        default: 0
      - name: waived_element_count
        type: integer
        source: computed
        description: Count of ElementCheck rows for check_run_no whose result == WAIVED.
        default: 0
      - name: requires_reverification
        type: boolean
        source: system
        description: Set true when the approving route carried at least one CONDITIONAL decision; blocks release-to-print until a fresh verification run clears it.
        default: false
      - name: open_condition_codes
        type: array
        source: system
        description: Condition codes appended by CONDITIONAL review decisions, in decision chronological order.
        default: []
      - name: pinned_claim_snapshot
        type: array
        source: system
        description: "Frozen at approval: [{ marketing_claim_id, claim_code, cleared_until_utc }] for every claim_ids entry. Re-validated at release-to-print (version pinning)."
        default: []
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant the version reached APPROVED.
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant the version reached RELEASED_TO_PRINT.
      - name: obsoleted_at
        type: datetime
        source: system
        description: Logical-clock instant the version reached OBSOLETE; cleared on runout disposition reversal.

  - name: ElementCheck
    parent: ArtworkVersion
    common_fields: true
    fields:
      - name: artwork_version_id
        type: string
        source: input
        description: FK -> ArtworkVersion.id; the version this element verdict belongs to.
      - name: element_code
        type: enum
        source: system
        description: Mandatory element evaluated; one row per Brief.required_element_codes entry per run.
        constraints: "one of NET_CONTENTS, INGREDIENT_STATEMENT, ALLERGEN_STATEMENT, DATE_CODE_ZONE, BARCODE, RECYCLING_MARK, ADDRESS_BLOCK"
      - name: severity
        type: enum
        source: system
        description: Severity class of the element, fixed by ELEMENT_SEVERITY.
        constraints: "one of CRITICAL, MAJOR, MINOR"
      - name: result
        type: enum
        source: system
        description: Verdict of the verification run, or WAIVED once a RegulatoryReviewer waives a FAIL.
        default: PASS
        constraints: "one of PASS, FAIL, WAIVED"
      - name: detail
        type: string
        source: system
        description: Human-readable explanation of the verdict (which sub-rule failed).
      - name: deduction_points
        type: number
        source: computed
        description: "Pre-scheme-factor deduction: ELEMENT_SEVERITY_WEIGHT[severity] when result == FAIL, half of it when WAIVED, 0.0 when PASS."
        default: 0.0
      - name: check_run_no
        type: integer
        source: system
        description: ArtworkVersion.check_run_no this row was produced by; rows from earlier runs are deleted when a new run executes.
      - name: waived_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryReviewer that waived this check; null unless result == WAIVED.
      - name: waiver_justification
        type: string
        source: system
        description: Justification recorded with the waiver; null unless result == WAIVED.

  - name: ReviewRoute
    parent: ArtworkVersion
    common_fields: true
    fields:
      - name: artwork_version_id
        type: string
        source: input
        description: FK -> ArtworkVersion.id; the version under review on this routing pass.
      - name: route_no
        type: integer
        source: system
        description: Sequential routing pass number for the version (1 for the first submit, 2 after a revision, ...).
      - name: status
        type: enum
        source: system
        description: Compound status derived from this route's ReviewTask children by route_stage_resolution.
        default: PENDING
        constraints: "one of PENDING, IN_PROGRESS, COMPLETE_APPROVED, COMPLETE_REJECTED"
      - name: current_stage_no
        type: integer
        source: system
        description: Stage currently open for decisions; 1 while stage 1 is unresolved, then 2, then 3.
        default: 1
      - name: stage_plan
        type: array
        source: system
        description: "Frozen routing plan: [{ stage_no: 1, mode: PARALLEL, disciplines: [BRAND, REGULATORY] }, { stage_no: 2, mode: SEQUENTIAL, disciplines: [LEGAL] }, { stage_no: 3, mode: SEQUENTIAL, disciplines: [QUALITY] }]."
      - name: conditional_count
        type: integer
        source: computed
        description: Count of this route's ReviewTask rows whose decision == CONDITIONAL.
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the route reached COMPLETE_APPROVED or COMPLETE_REJECTED.

  - name: ReviewTask
    parent: ReviewRoute
    common_fields: true
    fields:
      - name: review_route_id
        type: string
        source: input
        description: FK -> ReviewRoute.id; the routing pass this task belongs to.
      - name: discipline
        type: enum
        source: system
        description: Reviewing discipline; binds the task to exactly one reviewer role.
        constraints: "one of BRAND, LEGAL, REGULATORY, QUALITY"
      - name: mode
        type: enum
        source: system
        description: PARALLEL for stage-1 tasks (both decidable in any order), SEQUENTIAL for stages 2 and 3.
        constraints: "one of PARALLEL, SEQUENTIAL"
      - name: stage_no
        type: integer
        source: system
        description: Stage index from the route's stage_plan.
      - name: is_active
        type: boolean
        source: system
        description: True once the task's stage is the route's current_stage_no; decisions on inactive tasks are rejected.
        default: false
      - name: decision
        type: enum
        source: system
        description: Reviewer verdict, or SKIPPED when a sibling rejection closes the route.
        default: PENDING
        constraints: "one of PENDING, APPROVED, REJECTED, CONDITIONAL, SKIPPED"
      - name: condition_code
        type: string
        source: system
        description: Condition attached to a CONDITIONAL decision; null otherwise.
      - name: comment
        type: string
        source: system
        description: Reviewer comment; mandatory for REJECTED decisions.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID that decided this task; compared against ArtworkVersion.author_user_id and sibling tasks for segregation of duties.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant the decision was recorded.

  - name: Printer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Print vendor name.
        constraints: "3-80 chars; unique across all Printer rows"
      - name: color_standard
        type: enum
        source: input
        description: Color management standard the vendor prints to; selects the delta-E tolerance table row.
        constraints: "one of G7_MASTER, ISO12647"
      - name: certified_substrates
        type: array
        source: input
        description: Substrate classes the vendor is certified to print; a proof on an uncertified substrate is rejected.
        constraints: "1-4 unique entries from {COATED_PAPER, UNCOATED_PAPER, FILM, METALLIZED}"
      - name: recovery_liability_cap_cents
        type: integer
        source: input
        description: Contractual ceiling on cost recovery per error escape.
        constraints: ">= 0"
      - name: certification_status
        type: enum
        source: system
        description: Vendor standing; PROBATION blocks new plate orders.
        default: CERTIFIED
        constraints: "one of CERTIFIED, PROBATION"
      - name: performance_score
        type: number
        source: system
        description: Vendor scorecard, one decimal place; drops by performance_penalty_points on each settled escape and triggers PROBATION strictly below PRINTER_PROBATION_SCORE (70.0).
        default: 100.0
        constraints: "0.0 <= performance_score <= 100.0"
      - name: recovery_balance_cents
        type: integer
        source: computed
        description: "Conserved ledger: sum of ErrorEscape.final_recovery_cents over this printer's escapes whose state == SETTLED."
        default: 0
      - name: escape_count
        type: integer
        source: computed
        description: Count of ErrorEscape rows whose printer_id equals this printer's id.
        default: 0

  - name: PrinterProof
    parent: ArtworkVersion
    common_fields: true
    fields:
      - name: artwork_version_id
        type: string
        source: input
        description: FK -> ArtworkVersion.id; the version proofed.
      - name: printer_id
        type: string
        source: input
        description: FK -> Printer.id; the vendor that pulled the proof.
      - name: proof_no
        type: integer
        source: system
        description: Sequential proof number within the artwork version.
      - name: substrate_code
        type: enum
        source: input
        description: Substrate the proof was pulled on; must appear in Printer.certified_substrates.
        constraints: "one of COATED_PAPER, UNCOATED_PAPER, FILM, METALLIZED"
      - name: color_status
        type: enum
        source: system
        description: "Dimension 1 of 3: color verdict against the effective delta-E tolerance."
        default: COLOR_PENDING
        constraints: "one of COLOR_PENDING, COLOR_PASS, COLOR_FAIL"
      - name: substrate_status
        type: enum
        source: system
        description: "Dimension 2 of 3: substrate approval verdict, independent of color."
        default: SUBSTRATE_PENDING
        constraints: "one of SUBSTRATE_PENDING, SUBSTRATE_APPROVED, SUBSTRATE_REJECTED"
      - name: press_check_status
        type: enum
        source: system
        description: "Dimension 3 of 3: press-check attendance track; initialised NOT_REQUIRED or PRESS_CHECK_REQUIRED from press_check_required."
        constraints: "one of NOT_REQUIRED, PRESS_CHECK_REQUIRED, PRESS_CHECK_SCHEDULED, PRESS_CHECK_ATTENDED"
      - name: press_check_required
        type: boolean
        source: computed
        description: True when ArtworkAsset.brand_critical_color is true OR substrate_code == FILM; fixed at proof creation.
      - name: press_line_code
        type: string
        source: system
        description: Press line the check is booked on; the overlap resource key together with printer_id.
      - name: press_check_start_utc
        type: datetime
        source: system
        description: Inclusive start of the booked press-check window.
      - name: press_check_end_utc
        type: datetime
        source: system
        description: Exclusive end of the booked press-check window.
      - name: attended_by_user_id
        type: string
        source: system
        description: X-User-ID recorded as attending the press check; null while only scheduled.
      - name: measured_delta_e_max
        type: number
        source: system
        description: Maximum measured delta-E reported by the QualityReviewer, two decimal places.
      - name: effective_tolerance
        type: number
        source: computed
        description: DELTA_E_TOLERANCE[color_standard][substrate_code] minus BRAND_CRITICAL_TIGHTENING when the asset is brand-critical; one decimal place.
      - name: proof_state
        type: enum
        source: computed
        description: Derived product of the three dimensions per proof_state_resolution.
        default: PROOF_IN_REVIEW
        constraints: "one of PROOF_IN_REVIEW, PROOF_APPROVED, PROOF_REJECTED"
      - name: requires_recheck
        type: boolean
        source: system
        description: Set true by the printer-probation cascade for proofs not yet PROOF_APPROVED.
        default: false
      - name: proof_note
        type: string
        source: system
        description: Free-text note supplied by the printer at proof submission.

  - name: PlateOrder
    parent: ArtworkVersion
    common_fields: true
    fields:
      - name: artwork_version_id
        type: string
        source: input
        description: FK -> ArtworkVersion.id; the version the plates are cut for.
      - name: printer_id
        type: string
        source: input
        description: FK -> Printer.id; the vendor cutting the plates.
      - name: printer_proof_id
        type: string
        source: input
        description: FK -> PrinterProof.id; the approved proof that authorises plate making.
      - name: plate_set_count
        type: integer
        source: input
        description: Number of plates in the set; drives the marginal tier ladder.
        constraints: "1 <= plate_set_count <= 24"
      - name: expedite
        type: boolean
        source: input
        description: When true adds EXPEDITE_PCT of the pre-expedite subtotal.
        default: false
      - name: plate_subtotal_cents
        type: integer
        source: computed
        description: Marginal-tier plate charge from plate_order_cost.
      - name: setup_fee_cents
        type: integer
        source: computed
        description: PLATE_SETUP_FEE_SMALL_CENTS or PLATE_SETUP_FEE_LARGE_CENTS depending on plate_set_count.
      - name: expedite_fee_cents
        type: integer
        source: computed
        description: Expedite surcharge from plate_order_cost; 0 when expedite is false.
        default: 0
      - name: cost_cents
        type: integer
        source: computed
        description: plate_subtotal_cents + setup_fee_cents + expedite_fee_cents; the amount charged to ArtworkAsset.committed_plate_cost_cents.
      - name: status
        type: enum
        source: system
        description: Order state.
        default: ORDERED
        constraints: "one of ORDERED, CANCELLED"
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded on cancellation, or "SUPERSEDED_BY_NEW_ARTWORK" when auto-cancelled by the obsolescence cascade.
      - name: cancelled_at
        type: datetime
        source: system
        description: Logical-clock instant the order was cancelled.
      - name: auto_cancelled
        type: boolean
        source: system
        description: True when cancellation came from the obsolescence cascade rather than an operator call.
        default: false

  - name: InventoryRunout
    parent: ArtworkAsset
    common_fields: true
    fields:
      - name: artwork_asset_id
        type: string
        source: input
        description: FK -> ArtworkAsset.id; the asset whose old artwork is being run out.
      - name: obsolete_version_id
        type: string
        source: input
        description: FK -> ArtworkVersion.id; the OBSOLETE_PENDING version whose printed stock is being depleted.
      - name: on_hand_qty
        type: integer
        source: input
        description: Units of old-artwork stock on hand at runout_start_utc.
        constraints: ">= 0"
      - name: weekly_usage_qty
        type: integer
        source: input
        description: Planned weekly depletion rate used by the FORWARD_LOOKING projection.
        constraints: ">= 0; must be >= 1 whenever on_hand_qty > 0"
      - name: runout_start_utc
        type: datetime
        source: input
        description: Start instant of the runout window; the FORWARD_LOOKING projection counts whole weeks from this date.
      - name: depletion_records
        type: array
        source: system
        description: "Appended actuals: [{ week_start_utc, units_consumed }] consumed in ascending week_start_utc order by the CHRONOLOGICAL variant."
        default: []
      - name: projected_runout_date
        type: string
        source: computed
        description: FORWARD_LOOKING runout date (YYYY-MM-DD) from runout_projection.
      - name: actual_runout_date
        type: string
        source: computed
        description: CHRONOLOGICAL runout date (YYYY-MM-DD) from runout_projection; null until the first depletion record is appended (except the zero-stock case).
      - name: remaining_qty
        type: integer
        source: computed
        description: on_hand_qty minus the sum of depletion_records[].units_consumed, floored at 0.
      - name: trailing_avg_usage_qty
        type: integer
        source: computed
        description: Rounded mean of the last min(3, count) depletion records, floored at 1; null when depletion_records is empty.
      - name: state
        type: enum
        source: system
        description: Runout lifecycle state.
        default: PLANNED
        constraints: "one of PLANNED, MONITORING, RUNOUT_COMPLETE, SCRAPPED"
      - name: disposition
        type: enum
        source: system
        description: Operator disposition of the residual stock; null until decided, and cleared again by a reversal.
        constraints: "one of RUNOUT, SCRAP"
      - name: units_scrapped
        type: integer
        source: system
        description: Units written off under a SCRAP disposition.
        default: 0
      - name: units_reworked
        type: integer
        source: system
        description: Units relabelled rather than destroyed under a SCRAP disposition.
        default: 0
      - name: material_writeoff_cents
        type: integer
        source: computed
        description: units_scrapped * ArtworkAsset.standard_unit_cost_cents.
        default: 0
      - name: relabel_cost_cents
        type: integer
        source: computed
        description: units_reworked * REWORK_UNIT_CENTS.
        default: 0
      - name: changeover_base_cents
        type: integer
        source: computed
        description: material_writeoff_cents + relabel_cost_cents; the tier key for the expedite surcharge.
        default: 0
      - name: changeover_expedite_cents
        type: integer
        source: computed
        description: Expedite surcharge from changeover_writeoff_cost, keyed on changeover_base_cents (never on the total).
        default: 0
      - name: total_changeover_cost_cents
        type: integer
        source: computed
        description: changeover_base_cents + changeover_expedite_cents; the amount added to ArtworkAsset.changeover_cost_committed_cents.
        default: 0
      - name: reversal_count
        type: integer
        source: system
        description: Number of disposition reversals applied to this runout.
        default: 0

  - name: ErrorEscape
    parent: ArtworkVersion
    common_fields: true
    fields:
      - name: artwork_version_id
        type: string
        source: input
        description: FK -> ArtworkVersion.id; the released version whose printed pack carried the defect.
      - name: printer_id
        type: string
        source: input
        description: FK -> Printer.id; the vendor that printed the defective pack.
      - name: defect_code
        type: enum
        source: input
        description: Classified defect found in the field.
        constraints: "one of WRONG_ALLERGEN, MISSING_NET_CONTENTS, WRONG_LANGUAGE_VARIANT, COLOR_OUT_OF_TOLERANCE, WRONG_DATE_CODE, OLD_ARTWORK_USED"
      - name: discovered_stage
        type: enum
        source: input
        description: Where the escape was caught; sets the investigation fee and the vendor scorecard penalty.
        constraints: "one of PRESS, PACKING, DISTRIBUTION, MARKET"
      - name: units_affected
        type: integer
        source: input
        description: Units of defective pack in scope.
        constraints: ">= 1"
      - name: discovery_note
        type: string
        source: system
        description: Note captured at escape creation.
      - name: state
        type: enum
        source: system
        description: Investigation and recovery state (cyclic through DISPUTED).
        default: OPEN
        constraints: "one of OPEN, ROOT_CAUSE_ASSIGNED, RECOVERY_CLAIMED, DISPUTED, SETTLED, WRITTEN_OFF"
      - name: root_cause_party
        type: enum
        source: system
        description: Party found responsible; SHARED splits by printer_share_pct.
        constraints: "one of PRINTER, BRAND, AGENCY, SHARED"
      - name: printer_share_pct
        type: number
        source: system
        description: Fraction of each cost line recoverable from the printer, two decimal places.
        constraints: "0.00 <= printer_share_pct <= 1.00; must equal 1.00 when root_cause_party == PRINTER and 0.00 when root_cause_party in {BRAND, AGENCY}"
      - name: investigation_note
        type: string
        source: system
        description: Investigation finding recorded with the root-cause assignment.
      - name: investigation_fee_cents
        type: integer
        source: computed
        description: INVESTIGATION_FEE_LATE_CENTS when discovered_stage in {DISTRIBUTION, MARKET}, else INVESTIGATION_FEE_EARLY_CENTS.
      - name: provisional_recovery_cents
        type: integer
        source: computed
        description: PROVISIONAL variant of cost_recovery_amount, computed when the recovery claim is raised.
      - name: final_recovery_cents
        type: integer
        source: computed
        description: FINAL variant of cost_recovery_amount, computed at settlement from actual invoices.
      - name: recovery_variance_cents
        type: integer
        source: computed
        description: final_recovery_cents - provisional_recovery_cents; null until settlement.
      - name: liability_cap_applied
        type: boolean
        source: system
        description: True when the PROVISIONAL sum was clamped by Printer.recovery_liability_cap_cents.
        default: false
      - name: actual_reprint_cost_cents
        type: integer
        source: system
        description: Actual reprint invoice supplied at settlement.
      - name: actual_scrap_cost_cents
        type: integer
        source: system
        description: Actual scrap/destruction invoice supplied at settlement.
      - name: actual_expedite_freight_cents
        type: integer
        source: system
        description: Actual expedited freight invoice supplied at settlement.
      - name: resolution
        type: enum
        source: system
        description: Terminal disposition of the claim.
        constraints: "one of SETTLED, WRITTEN_OFF"
      - name: dispute_reason
        type: string
        source: system
        description: Reason the printer disputed the claimed recovery.
      - name: dispute_count
        type: integer
        source: system
        description: Number of times the printer has disputed a recovery claim on this escape.
        default: 0
      - name: performance_penalty_points
        type: number
        source: computed
        description: Scorecard penalty applied to Printer.performance_score at settlement, one decimal place.
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant the escape reached SETTLED or WRITTEN_OFF.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Brief
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /briefs/{id}/decision with decision == APPROVED"
        actor: RegulatoryReviewer
        preconditions:
          - "brief.status == DRAFT"
          - "brief.required_element_codes has at least 1 entry"
          - "brief.net_contents_declaration.metric_value > 0"
        side_effects:
          - "set brief.approved_by_user_id = X-User-ID, brief.approved_at = current logical clock, brief.review_note = payload review_note (null when omitted)"
          - "refresh brief.updated_at and increment brief.version by 1"
        note: "Assets and versions may be drafted under a DRAFT brief; only ArtworkVersion submit is gated on APPROVED."
      - from: DRAFT
        to: REJECTED
        trigger: "POST /briefs/{id}/decision with decision == REJECTED"
        actor: RegulatoryReviewer
        preconditions:
          - "brief.status == DRAFT"
          - "payload review_note is present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "set brief.review_note, brief.approved_by_user_id = X-User-ID, brief.approved_at = current logical clock"
          - "refresh brief.updated_at and increment brief.version by 1"

  - entity: MarketingClaim
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: CLEARED
        trigger: "POST /marketing-claims/{id}/clearance with decision == CLEARED"
        actor: LegalReviewer
        preconditions:
          - "claim.legal_status == DRAFT"
          - "payload cleared_from_utc and cleared_until_utc are both present and cleared_from_utc < cleared_until_utc (else ERR_INVALID_REQUEST)"
          - "no other MarketingClaim row with the same claim_code AND the same market_code AND legal_status == CLEARED has a clearance window that intersects [cleared_from_utc, cleared_until_utc) under half-open interval arithmetic (else ERR_CLAIM_CLEARANCE_OVERLAP)"
        side_effects:
          - "set claim.legal_status = CLEARED, claim.cleared_from_utc, claim.cleared_until_utc, claim.cleared_by_user_id = X-User-ID"
          - "refresh claim.updated_at and increment claim.version by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /marketing-claims/{id}/clearance with decision == REJECTED"
        actor: LegalReviewer
        preconditions:
          - "claim.legal_status == DRAFT"
          - "payload rejection_reason is present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "set claim.legal_status = REJECTED, claim.rejection_reason, claim.cleared_by_user_id = X-User-ID"
          - "refresh claim.updated_at and increment claim.version by 1"
      - from: CLEARED
        to: REJECTED
        trigger: "POST /marketing-claims/{id}/clearance with decision == REJECTED (clearance withdrawal)"
        actor: LegalReviewer
        preconditions:
          - "claim.legal_status == CLEARED"
          - "payload rejection_reason is present and non-empty"
        side_effects:
          - "set claim.legal_status = REJECTED, claim.rejection_reason; retain cleared_from_utc / cleared_until_utc for audit"
          - "refresh claim.updated_at and increment claim.version by 1"
        note: "Withdrawal frees the (claim_code, market_code) interval for a fresh CLEARED row: overlap detection only considers legal_status == CLEARED rows."

  - entity: ArtworkAsset
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUPERSEDE_PENDING
        trigger: "system — link 3 of the approval cascade: an ArtworkVersion of this asset reaches APPROVED while asset.current_approved_version_id is already non-null"
        actor: system
        preconditions:
          - "asset.current_approved_version_id is non-null before the new approval (first-ever approval leaves the asset ACTIVE)"
        side_effects:
          - "set asset.current_approved_version_id = the newly approved version id"
          - "this mutation is itself the trigger for link 4: the previously approved version transitions APPROVED|RELEASED_TO_PRINT -> OBSOLETE_PENDING"
      - from: SUPERSEDED
        to: SUPERSEDE_PENDING
        trigger: "system — a further ArtworkVersion of this asset reaches APPROVED, or a runout disposition reversal re-opens the prior obsolescence"
        actor: system
        preconditions:
          - "asset.obsolescence_state == SUPERSEDED"
        side_effects:
          - "set asset.current_approved_version_id = the newly approved version id when the trigger is an approval"
          - "on reversal, restore the reversed runout's obsolete version to OBSOLETE_PENDING"
      - from: SUPERSEDE_PENDING
        to: SUPERSEDED
        trigger: "system — an InventoryRunout of this asset reaches RUNOUT_COMPLETE or SCRAPPED"
        actor: system
        preconditions:
          - "asset.obsolescence_state == SUPERSEDE_PENDING"
          - "the runout's obsolete_version_id points at a version in OBSOLETE_PENDING"
        side_effects:
          - "the obsolete version transitions OBSOLETE_PENDING -> OBSOLETE"
          - "refresh asset.updated_at and increment asset.version by 1"

  - entity: ArtworkVersion
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ELEMENTS_VERIFIED
        trigger: "POST /artwork-versions/{id}/verify-elements"
        actor: PackagingCoordinator
        preconditions:
          - "version.state == DRAFT"
          - "the owning asset's obsolescence_state != SUPERSEDED (else ERR_VERSION_STATE_INVALID)"
        side_effects:
          - "delete every ElementCheck row of this version whose check_run_no < version.check_run_no + 1, then increment version.check_run_no by 1"
          - "create exactly one ElementCheck row per Brief.required_element_codes entry with severity from ELEMENT_SEVERITY, result PASS or FAIL per the element sub-rules, and deduction_points per mandatory_element_compliance_score"
          - "recompute version.compliance_score, version.failed_element_count, version.waived_element_count (waived count resets to 0 on a fresh run)"
          - "set version.state = ELEMENTS_VERIFIED; refresh updated_at; increment version.version by 1"
      - from: ELEMENTS_VERIFIED
        to: ELEMENTS_VERIFIED
        trigger: "POST /artwork-versions/{id}/verify-elements (re-run after a PATCH edit)"
        actor: PackagingCoordinator
        preconditions:
          - "version.state == ELEMENTS_VERIFIED"
        side_effects:
          - "same as the DRAFT -> ELEMENTS_VERIFIED run: prior-run ElementCheck rows are deleted, a fresh run is written, and compliance_score / failed_element_count / waived_element_count are recomputed"
      - from: ELEMENTS_VERIFIED
        to: IN_REVIEW
        trigger: "POST /artwork-versions/{id}/submit"
        actor: PackagingCoordinator
        preconditions:
          - "version.state == ELEMENTS_VERIFIED (else ERR_VERSION_STATE_INVALID)"
          - "the owning asset's Brief.status == APPROVED (else ERR_BRIEF_NOT_APPROVED)"
          - "version.revision_cycle_count < REVISION_CYCLE_CAP (else ERR_REVISION_CYCLE_CAP_EXCEEDED)"
          - "no ElementCheck row of the current check_run_no has result == FAIL (else ERR_MANDATORY_ELEMENT_FAILED)"
          - "version.compliance_score >= COMPLIANCE_SCORE_FLOOR (else ERR_COMPLIANCE_SCORE_BELOW_THRESHOLD)"
          - "every claim_ids entry resolves to a MarketingClaim with legal_status == CLEARED (else ERR_CLAIM_NOT_CLEARED), market_code == asset.market_code (else ERR_CLAIM_MARKET_MISMATCH), and cleared_from_utc <= current logical clock < cleared_until_utc (else ERR_CLAIM_CLEARANCE_EXPIRED)"
        side_effects:
          - "increment version.route_count by 1 and create a ReviewRoute with route_no = version.route_count, status PENDING, current_stage_no 1 and the frozen three-stage stage_plan"
          - "create four ReviewTask rows from stage_plan — stage 1 PARALLEL {BRAND, REGULATORY}, stage 2 SEQUENTIAL {LEGAL}, stage 3 SEQUENTIAL {QUALITY} — with is_active true only for stage 1"
          - "the new route immediately transitions PENDING -> IN_PROGRESS in the same request"
          - "set version.state = IN_REVIEW; refresh updated_at; increment version.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "system — link 2 of the approval cascade: this version's ReviewRoute reaches COMPLETE_APPROVED"
        actor: system
        preconditions:
          - "version.state == IN_REVIEW"
          - "route.status == COMPLETE_APPROVED"
        side_effects:
          - "set version.approved_at = current logical clock"
          - "freeze version.pinned_claim_snapshot as one entry { marketing_claim_id, claim_code, cleared_until_utc } per claim_ids entry, in claim_ids order"
          - "set version.requires_reverification = true when route.conditional_count > 0, else leave it false"
          - "this mutation is itself the trigger for link 3: the owning ArtworkAsset's current_approved_version_id is repointed at this version and, when it was already non-null, the asset transitions ACTIVE|SUPERSEDED -> SUPERSEDE_PENDING"
          - "refresh updated_at; increment version.version by 1"
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "system — this version's ReviewRoute reaches COMPLETE_REJECTED"
        actor: system
        preconditions:
          - "version.state == IN_REVIEW"
          - "route.status == COMPLETE_REJECTED"
        side_effects:
          - "increment version.revision_cycle_count by 1"
          - "refresh updated_at; increment version.version by 1"
      - from: REVISION_REQUESTED
        to: REVISION_REQUESTED
        trigger: "POST /artwork-versions/{id}/verify-elements (re-verification of a rejected version, before it is re-opened for edit)"
        actor: PackagingCoordinator
        preconditions:
          - "version.state == REVISION_REQUESTED"
        side_effects:
          - "prior-run ElementCheck rows are deleted, a fresh run is written, compliance_score / failed_element_count / waived_element_count are recomputed"
          - "version.state is unchanged — re-verification does not clear the revision"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /artwork-versions/{id}/revise"
        actor: PackagingCoordinator
        preconditions:
          - "version.state == REVISION_REQUESTED"
          - "version.revision_cycle_count < REVISION_CYCLE_CAP (else ERR_REVISION_CYCLE_CAP_EXCEEDED)"
        side_effects:
          - "set version.state = DRAFT; append nothing to ElementCheck (rows survive until the next verification run)"
          - "refresh updated_at; increment version.version by 1"
        note: "Closes the revision cycle DRAFT -> ELEMENTS_VERIFIED -> IN_REVIEW -> REVISION_REQUESTED -> DRAFT."
      - from: APPROVED
        to: APPROVED
        trigger: "POST /artwork-versions/{id}/verify-elements (conditional-approval re-verification)"
        actor: PackagingCoordinator
        preconditions:
          - "version.state == APPROVED"
          - "version.requires_reverification == true (else ERR_VERSION_STATE_INVALID)"
        side_effects:
          - "fresh verification run as above, then set version.requires_reverification = false"
          - "refresh updated_at; increment version.version by 1"
      - from: APPROVED
        to: RELEASED_TO_PRINT
        trigger: "POST /artwork-versions/{id}/release-to-print"
        actor: PackagingCoordinator
        preconditions:
          - "version.state == APPROVED (else ERR_VERSION_STATE_INVALID)"
          - "version.requires_reverification == false (else ERR_REVERIFICATION_REQUIRED)"
          - "every pinned_claim_snapshot entry still satisfies cleared_until_utc > current logical clock (else ERR_CLAIM_CLEARANCE_EXPIRED)"
          - "at least one PrinterProof of this version has proof_state == PROOF_APPROVED (else ERR_PROOF_NOT_APPROVED)"
        side_effects:
          - "set version.released_at = current logical clock"
          - "refresh updated_at; increment version.version by 1"
      - from: APPROVED
        to: OBSOLETE_PENDING
        trigger: "system — link 4 of the approval cascade: the owning asset moved to SUPERSEDE_PENDING and this version is the superseded one"
        actor: system
        preconditions:
          - "version.state == APPROVED"
          - "asset.obsolescence_state == SUPERSEDE_PENDING and asset.current_approved_version_id != version.id"
        side_effects:
          - "every PlateOrder of this version whose status == ORDERED transitions ORDERED -> CANCELLED with auto_cancelled = true and cancel_reason = SUPERSEDED_BY_NEW_ARTWORK (conditional cascade: CANCELLED orders are untouched)"
          - "for each such cancellation, debit ArtworkAsset.committed_plate_cost_cents by exactly that order's cost_cents"
          - "refresh updated_at; increment version.version by 1"
      - from: RELEASED_TO_PRINT
        to: OBSOLETE_PENDING
        trigger: "system — link 4 of the approval cascade applied to a released version"
        actor: system
        preconditions:
          - "version.state == RELEASED_TO_PRINT"
          - "asset.obsolescence_state == SUPERSEDE_PENDING and asset.current_approved_version_id != version.id"
        side_effects:
          - "identical to APPROVED -> OBSOLETE_PENDING: ORDERED PlateOrders auto-cancel and committed_plate_cost_cents is debited by each cancelled order's cost_cents"
      - from: OBSOLETE_PENDING
        to: OBSOLETE
        trigger: "system — an InventoryRunout whose obsolete_version_id is this version reaches RUNOUT_COMPLETE or SCRAPPED"
        actor: system
        preconditions:
          - "version.state == OBSOLETE_PENDING"
        side_effects:
          - "set version.obsoleted_at = current logical clock"
          - "the owning asset transitions SUPERSEDE_PENDING -> SUPERSEDED"
          - "refresh updated_at; increment version.version by 1"
      - from: OBSOLETE
        to: OBSOLETE_PENDING
        trigger: "system — POST /inventory-runouts/{id}/disposition-reversal on the runout that obsoleted this version"
        actor: system
        preconditions:
          - "version.state == OBSOLETE"
          - "the reversed runout's state == SCRAPPED"
        side_effects:
          - "clear version.obsoleted_at to null"
          - "the owning asset transitions SUPERSEDED -> SUPERSEDE_PENDING"
          - "refresh updated_at; increment version.version by 1"
    note: "No absorbing state: OBSOLETE is reversible through a runout disposition reversal, which is why terminal_states is empty."

  - entity: ReviewRoute
    initial_state: PENDING
    terminal_states: [COMPLETE_APPROVED, COMPLETE_REJECTED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "system — inside the same POST /artwork-versions/{id}/submit request that created the route"
        actor: system
        preconditions:
          - "route.status == PENDING"
          - "the route's stage-1 ReviewTask rows exist"
        side_effects:
          - "set is_active = true on every stage-1 ReviewTask; leave stage-2 and stage-3 tasks with is_active false"
          - "set route.current_stage_no = 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "system — link 1 of the approval cascade: a ReviewTask decision resolves the current stage as APPROVED while current_stage_no < 3"
        actor: system
        preconditions:
          - "route_stage_resolution(route, route.current_stage_no) == APPROVED"
          - "route.current_stage_no < 3"
        side_effects:
          - "increment route.current_stage_no by 1 and set is_active = true on every ReviewTask of the new current stage"
          - "recompute route.conditional_count"
          - "refresh route.updated_at; increment route.version by 1"
      - from: IN_PROGRESS
        to: COMPLETE_APPROVED
        trigger: "system — link 1 of the approval cascade: a ReviewTask decision resolves stage 3 as APPROVED"
        actor: system
        preconditions:
          - "route.current_stage_no == 3"
          - "route_stage_resolution(route, 3) == APPROVED"
        side_effects:
          - "set route.completed_at = current logical clock and recompute route.conditional_count"
          - "this mutation is itself the trigger for link 2: the routed ArtworkVersion transitions IN_REVIEW -> APPROVED"
          - "refresh route.updated_at; increment route.version by 1"
      - from: IN_PROGRESS
        to: COMPLETE_REJECTED
        trigger: "system — a ReviewTask decision resolves the current stage as REJECTED"
        actor: system
        preconditions:
          - "route_stage_resolution(route, route.current_stage_no) == REJECTED"
        side_effects:
          - "every ReviewTask of this route whose decision == PENDING transitions PENDING -> SKIPPED (all stages, including inactive later stages)"
          - "set route.completed_at = current logical clock"
          - "this mutation is itself the trigger for the rejection branch: the routed ArtworkVersion transitions IN_REVIEW -> REVISION_REQUESTED and its revision_cycle_count increments"
          - "refresh route.updated_at; increment route.version by 1"

  - entity: ReviewTask
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, CONDITIONAL, SKIPPED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /review-tasks/{id}/decision with decision == APPROVED"
        actor: "BrandReviewer | LegalReviewer | RegulatoryReviewer | QualityReviewer (must match task.discipline)"
        preconditions:
          - "task.decision == PENDING (else ERR_TASK_ALREADY_DECIDED)"
          - "task.is_active == true and task.stage_no == route.current_stage_no (else ERR_ROUTE_STAGE_NOT_ACTIVE)"
          - "route.status == IN_PROGRESS"
          - "the acting X-User-Role is the role bound to task.discipline (else ERR_UNAUTHORIZED)"
          - "X-User-ID != the routed ArtworkVersion.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "no other ReviewTask of the same route already carries decided_by_user_id == X-User-ID (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "set task.decision = APPROVED, task.decided_by_user_id = X-User-ID, task.decided_at = current logical clock, task.comment = payload comment"
          - "re-evaluate route_stage_resolution for task.stage_no; when it resolves APPROVED the route advances (IN_PROGRESS -> IN_PROGRESS) or completes (IN_PROGRESS -> COMPLETE_APPROVED)"
          - "refresh task.updated_at; increment task.version by 1"
      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /review-tasks/{id}/decision with decision == CONDITIONAL"
        actor: "BrandReviewer | LegalReviewer | RegulatoryReviewer | QualityReviewer (must match task.discipline)"
        preconditions:
          - "same preconditions as PENDING -> APPROVED"
          - "payload condition_code is present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "set task.decision = CONDITIONAL, task.condition_code, task.decided_by_user_id, task.decided_at"
          - "append condition_code to the routed ArtworkVersion.open_condition_codes (decision chronological order) and increment route.conditional_count"
          - "counts as approving for route_stage_resolution, so the stage can still resolve APPROVED"
          - "refresh task.updated_at; increment task.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /review-tasks/{id}/decision with decision == REJECTED"
        actor: "BrandReviewer | LegalReviewer | RegulatoryReviewer | QualityReviewer (must match task.discipline)"
        preconditions:
          - "same preconditions as PENDING -> APPROVED"
          - "payload comment is present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "set task.decision = REJECTED, task.comment, task.decided_by_user_id, task.decided_at"
          - "route_stage_resolution for the stage resolves REJECTED, driving route IN_PROGRESS -> COMPLETE_REJECTED"
          - "refresh task.updated_at; increment task.version by 1"
      - from: PENDING
        to: SKIPPED
        trigger: "system — the owning ReviewRoute reached COMPLETE_REJECTED"
        actor: system
        preconditions:
          - "task.decision == PENDING"
          - "route.status == COMPLETE_REJECTED"
        side_effects:
          - "set task.decision = SKIPPED, task.is_active = false; decided_by_user_id stays null"
          - "refresh task.updated_at; increment task.version by 1"

  - entity: PrinterProof
    initial_state: PROOF_IN_REVIEW
    terminal_states: [PROOF_APPROVED, PROOF_REJECTED]
    transitions:
      - from: PROOF_IN_REVIEW
        to: PROOF_IN_REVIEW
        trigger: "POST /printer-proofs/{id}/color-decision or POST /printer-proofs/{id}/substrate-decision or POST /printer-proofs/{id}/press-check that resolves one dimension while another dimension is still pending"
        actor: QualityReviewer
        preconditions:
          - "proof.proof_state == PROOF_IN_REVIEW"
          - "for color-decision: proof.color_status == COLOR_PENDING (else ERR_PROOF_DIMENSION_ALREADY_DECIDED)"
          - "for substrate-decision: proof.substrate_status == SUBSTRATE_PENDING (else ERR_PROOF_DIMENSION_ALREADY_DECIDED)"
          - "for press-check: proof.press_check_status in {PRESS_CHECK_REQUIRED, PRESS_CHECK_SCHEDULED} (else ERR_PRESS_CHECK_NOT_REQUIRED)"
        side_effects:
          - "color-decision: set measured_delta_e_max, effective_tolerance and color_status = COLOR_PASS | COLOR_FAIL per proof_color_tolerance_verdict"
          - "substrate-decision: set substrate_status = SUBSTRATE_APPROVED | SUBSTRATE_REJECTED"
          - "press-check: set press_line_code, press_check_start_utc, press_check_end_utc; press_check_status = PRESS_CHECK_ATTENDED when attended_by_user_id is supplied, else PRESS_CHECK_SCHEDULED"
          - "recompute proof.proof_state by proof_state_resolution; it stays PROOF_IN_REVIEW while any dimension is unresolved"
          - "refresh proof.updated_at; increment proof.version by 1"
        note: "The three dimensions are independent: color and substrate may be decided in either order and the press-check track advances on its own."
      - from: PROOF_IN_REVIEW
        to: PROOF_APPROVED
        trigger: "the dimension decision that leaves color_status == COLOR_PASS AND substrate_status == SUBSTRATE_APPROVED AND press_check_status in {NOT_REQUIRED, PRESS_CHECK_ATTENDED}"
        actor: QualityReviewer
        preconditions:
          - "proof.proof_state == PROOF_IN_REVIEW"
          - "the dimension being decided is still pending per the rules above"
        side_effects:
          - "proof.proof_state = PROOF_APPROVED (derived); the proof becomes usable as a PlateOrder authorisation"
          - "refresh proof.updated_at; increment proof.version by 1"
      - from: PROOF_IN_REVIEW
        to: PROOF_REJECTED
        trigger: "the dimension decision that sets color_status == COLOR_FAIL or substrate_status == SUBSTRATE_REJECTED"
        actor: QualityReviewer
        preconditions:
          - "proof.proof_state == PROOF_IN_REVIEW"
        side_effects:
          - "proof.proof_state = PROOF_REJECTED (derived); remaining pending dimensions stay pending and are no longer decidable (ERR_PROOF_STATE_INVALID)"
          - "refresh proof.updated_at; increment proof.version by 1"

  - entity: PlateOrder
    initial_state: ORDERED
    terminal_states: [CANCELLED]
    transitions:
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /plate-orders/{id}/cancel"
        actor: PackagingCoordinator
        preconditions:
          - "order.status == ORDERED (else ERR_PLATE_ORDER_NOT_CANCELLABLE)"
          - "payload cancel_reason is present and non-empty"
        side_effects:
          - "set order.status = CANCELLED, order.cancel_reason, order.cancelled_at = current logical clock, order.auto_cancelled = false"
          - "debit ArtworkAsset.committed_plate_cost_cents by exactly order.cost_cents (compensating action: order.cost_cents itself is never rewritten)"
          - "refresh order.updated_at and asset.updated_at; increment both versions by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "system — the plate order's ArtworkVersion transitioned to OBSOLETE_PENDING under the approval cascade"
        actor: system
        preconditions:
          - "order.status == ORDERED"
          - "version.state == OBSOLETE_PENDING"
        side_effects:
          - "set order.status = CANCELLED, order.auto_cancelled = true, order.cancel_reason = SUPERSEDED_BY_NEW_ARTWORK, order.cancelled_at = current logical clock"
          - "debit ArtworkAsset.committed_plate_cost_cents by exactly order.cost_cents"

  - entity: InventoryRunout
    initial_state: PLANNED
    terminal_states: [RUNOUT_COMPLETE]
    transitions:
      - from: PLANNED
        to: RUNOUT_COMPLETE
        trigger: "POST /inventory-runouts with on_hand_qty == 0 (zero-stock boundary, resolved inside the create request)"
        actor: PackagingCoordinator
        preconditions:
          - "on_hand_qty == 0"
        side_effects:
          - "set projected_runout_date = actual_runout_date = the calendar date of runout_start_utc, remaining_qty = 0, units_scrapped = 0, units_reworked = 0, disposition = RUNOUT, all changeover money fields 0"
          - "the obsolete version transitions OBSOLETE_PENDING -> OBSOLETE and the owning asset transitions SUPERSEDE_PENDING -> SUPERSEDED"
      - from: PLANNED
        to: MONITORING
        trigger: "POST /inventory-runouts/{id}/depletion-records"
        actor: PackagingCoordinator
        preconditions:
          - "runout.state == PLANNED"
          - "every record's week_start_utc is strictly greater than the week_start_utc of every already-stored record (else ERR_DEPLETION_RECORD_OUT_OF_ORDER)"
        side_effects:
          - "append the records to depletion_records; recompute remaining_qty, trailing_avg_usage_qty and actual_runout_date via the CHRONOLOGICAL variant of runout_projection"
          - "set runout.state = MONITORING; refresh updated_at; increment version by 1"
      - from: MONITORING
        to: MONITORING
        trigger: "POST /inventory-runouts/{id}/depletion-records (further weeks)"
        actor: PackagingCoordinator
        preconditions:
          - "runout.state == MONITORING"
          - "every record's week_start_utc is strictly greater than the week_start_utc of every already-stored record"
        side_effects:
          - "same recomputation as PLANNED -> MONITORING"
      - from: MONITORING
        to: RUNOUT_COMPLETE
        trigger: "POST /inventory-runouts/{id}/disposition with disposition == RUNOUT"
        actor: PackagingCoordinator
        preconditions:
          - "runout.state in {PLANNED, MONITORING} (else ERR_RUNOUT_STATE_INVALID)"
          - "runout.remaining_qty == 0 (else ERR_UNIT_CONSERVATION_VIOLATION)"
        side_effects:
          - "set disposition = RUNOUT, units_scrapped = 0, units_reworked = 0"
          - "the obsolete version transitions OBSOLETE_PENDING -> OBSOLETE and the asset transitions SUPERSEDE_PENDING -> SUPERSEDED"
          - "refresh updated_at; increment version by 1"
      - from: MONITORING
        to: SCRAPPED
        trigger: "POST /inventory-runouts/{id}/disposition with disposition == SCRAP"
        actor: PackagingCoordinator
        preconditions:
          - "runout.state in {PLANNED, MONITORING} (else ERR_RUNOUT_STATE_INVALID)"
          - "units_scrapped + units_reworked == runout.remaining_qty exactly (else ERR_UNIT_CONSERVATION_VIOLATION)"
        side_effects:
          - "set disposition = SCRAP, units_scrapped, units_reworked and compute material_writeoff_cents, relabel_cost_cents, changeover_base_cents, changeover_expedite_cents, total_changeover_cost_cents via changeover_writeoff_cost"
          - "credit ArtworkAsset.obsolete_units_total by units_scrapped and ArtworkAsset.changeover_cost_committed_cents by total_changeover_cost_cents"
          - "the obsolete version transitions OBSOLETE_PENDING -> OBSOLETE and the asset transitions SUPERSEDE_PENDING -> SUPERSEDED"
          - "refresh updated_at; increment version by 1"
      - from: PLANNED
        to: SCRAPPED
        trigger: "POST /inventory-runouts/{id}/disposition with disposition == SCRAP before any depletion record was appended"
        actor: PackagingCoordinator
        preconditions:
          - "runout.state == PLANNED (else ERR_RUNOUT_STATE_INVALID)"
          - "units_scrapped + units_reworked == runout.remaining_qty exactly, which for a PLANNED runout equals on_hand_qty (else ERR_UNIT_CONSERVATION_VIOLATION)"
        side_effects:
          - "identical to MONITORING -> SCRAPPED: changeover_writeoff_cost is evaluated, both asset ledgers are credited, and the obsolescence cascade advances (version OBSOLETE_PENDING -> OBSOLETE, asset SUPERSEDE_PENDING -> SUPERSEDED)"
      - from: SCRAPPED
        to: MONITORING
        trigger: "POST /inventory-runouts/{id}/disposition-reversal"
        actor: PlatformAdmin
        preconditions:
          - "runout.state == SCRAPPED (else ERR_RUNOUT_STATE_INVALID)"
        side_effects:
          - "debit ArtworkAsset.obsolete_units_total by exactly the units_scrapped being reversed and ArtworkAsset.changeover_cost_committed_cents by exactly total_changeover_cost_cents"
          - "reset disposition = null, units_scrapped = 0, units_reworked = 0 and every changeover money field to 0; increment reversal_count by 1"
          - "the obsolete version transitions OBSOLETE -> OBSOLETE_PENDING and the asset transitions SUPERSEDED -> SUPERSEDE_PENDING"
          - "refresh updated_at; increment version by 1"
        note: "Compensating action: on_hand_qty and depletion_records are never rewritten, so on_hand_qty == remaining_qty + sum(depletion_records[].units_consumed) holds before and after."

  - entity: ErrorEscape
    initial_state: OPEN
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: ROOT_CAUSE_ASSIGNED
        trigger: "POST /error-escapes/{id}/root-cause"
        actor: QualityReviewer
        preconditions:
          - "escape.state == OPEN (else ERR_ESCAPE_STATE_INVALID)"
          - "printer_share_pct == 1.00 when root_cause_party == PRINTER, == 0.00 when root_cause_party in {BRAND, AGENCY}, and 0.00 < printer_share_pct < 1.00 when SHARED (else ERR_SHARE_INCONSISTENT_WITH_PARTY)"
        side_effects:
          - "set root_cause_party, printer_share_pct, investigation_note"
          - "refresh updated_at; increment escape.version by 1"
      - from: DISPUTED
        to: ROOT_CAUSE_ASSIGNED
        trigger: "POST /error-escapes/{id}/root-cause (revised apportionment after a printer dispute)"
        actor: QualityReviewer
        preconditions:
          - "escape.state == DISPUTED"
          - "same share/party consistency rule as from OPEN"
        side_effects:
          - "overwrite root_cause_party, printer_share_pct, investigation_note; clear provisional_recovery_cents and liability_cap_applied back to null/false"
          - "refresh updated_at; increment escape.version by 1"
        note: "Closes the escape cycle ROOT_CAUSE_ASSIGNED -> RECOVERY_CLAIMED -> DISPUTED -> ROOT_CAUSE_ASSIGNED."
      - from: ROOT_CAUSE_ASSIGNED
        to: RECOVERY_CLAIMED
        trigger: "POST /error-escapes/{id}/recovery-claim"
        actor: QualityReviewer
        preconditions:
          - "escape.state == ROOT_CAUSE_ASSIGNED (else ERR_ESCAPE_STATE_INVALID)"
          - "payload expected_error_escape_version == escape.version (else ERR_STALE_ESCAPE_VERSION, 412)"
        side_effects:
          - "compute provisional_recovery_cents via the PROVISIONAL variant of cost_recovery_amount and set liability_cap_applied when the cap clamped the sum"
          - "refresh updated_at; increment escape.version by 1"
      - from: RECOVERY_CLAIMED
        to: DISPUTED
        trigger: "POST /error-escapes/{id}/dispute"
        actor: PrinterRep
        preconditions:
          - "escape.state == RECOVERY_CLAIMED (else ERR_ESCAPE_STATE_INVALID)"
          - "X-User-ID == escape.printer_id (else ERR_PRINTER_IDENTITY_MISMATCH)"
          - "payload dispute_reason is present and non-empty"
        side_effects:
          - "set dispute_reason and increment dispute_count by 1"
          - "refresh updated_at; increment escape.version by 1"
      - from: RECOVERY_CLAIMED
        to: SETTLED
        trigger: "POST /error-escapes/{id}/settle with resolution == SETTLED"
        actor: PlatformAdmin
        preconditions:
          - "escape.state == RECOVERY_CLAIMED (else ERR_ESCAPE_STATE_INVALID)"
          - "actual_reprint_cost_cents, actual_scrap_cost_cents and actual_expedite_freight_cents are all present and >= 0 (else ERR_INVALID_REQUEST)"
          - "the FINAL per-line sum before clamping is <= Printer.recovery_liability_cap_cents (else ERR_RECOVERY_EXCEEDS_LIABILITY_CAP)"
        side_effects:
          - "store the three actual invoice amounts; compute final_recovery_cents via the FINAL variant of cost_recovery_amount and recovery_variance_cents = final_recovery_cents - provisional_recovery_cents"
          - "set resolution = SETTLED, settled_at = current logical clock"
          - "credit Printer.recovery_balance_cents by final_recovery_cents and subtract performance_penalty_points from Printer.performance_score (this is cascade link 2)"
          - "that Printer.performance_score mutation is itself the trigger for link 3: when the new score < PRINTER_PROBATION_SCORE the printer transitions CERTIFIED -> PROBATION, and that probation mutation is the trigger for link 4: every PrinterProof of that printer whose proof_state != PROOF_APPROVED gets requires_recheck = true"
          - "refresh updated_at; increment escape.version by 1"
      - from: RECOVERY_CLAIMED
        to: WRITTEN_OFF
        trigger: "POST /error-escapes/{id}/settle with resolution == WRITTEN_OFF"
        actor: PlatformAdmin
        preconditions:
          - "escape.state == RECOVERY_CLAIMED"
        side_effects:
          - "set final_recovery_cents = 0, recovery_variance_cents = 0 - provisional_recovery_cents, resolution = WRITTEN_OFF, settled_at = current logical clock"
          - "Printer.recovery_balance_cents and Printer.performance_score are left unchanged"
          - "refresh updated_at; increment escape.version by 1"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /error-escapes/{id}/settle with resolution == WRITTEN_OFF (abandoning a disputed claim)"
        actor: PlatformAdmin
        preconditions:
          - "escape.state == DISPUTED"
        side_effects:
          - "set final_recovery_cents = 0, recovery_variance_cents = 0 - provisional_recovery_cents (null-safe: 0 when no claim was raised), resolution = WRITTEN_OFF, settled_at = current logical clock"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: version-create-stale-asset
    parent_entity: ArtworkAsset
    write_endpoint: "POST /artwork-assets/{id}/versions"
    occ_field: "expected_artwork_asset_version"
    description: |
      Creating a new ArtworkVersion against an ArtworkAsset whose version has
      advanced since the client last read it is rejected. A newly created
      version legitimately becomes the asset's newest revision (it bumps
      version_counter and may carry supersedes_version_id), so a second create
      from a stale view of the asset would silently chain onto a revision the
      author never saw. The check is a stale-version comparison against
      ArtworkAsset.version, not a timing rule.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412
  - rule_id: recovery-claim-stale-escape
    parent_entity: ErrorEscape
    write_endpoint: "POST /error-escapes/{id}/recovery-claim"
    occ_field: "expected_error_escape_version"
    description: |
      Raising a recovery claim against an ErrorEscape whose version has advanced
      since the client last read it is rejected. A revised root-cause
      apportionment legitimately supersedes the prior provisional amount, so a
      claim computed from a stale apportionment view would bill the printer on
      withdrawn shares. Resolved by comparing the supplied
      expected_error_escape_version against ErrorEscape.version.
    error_id: ERR_STALE_ESCAPE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: mandatory_element_compliance_score
    trigger: "POST /artwork-versions/{id}/verify-elements (every run) and POST /element-checks/{id}/waiver (recompute after a FAIL is waived)"
    algorithm: weighted_scoring
    formula: |
      # ---- step 1: one ElementCheck row per required element, in the fixed
      #      ELEMENT_ORDER below (never in Brief.required_element_codes input
      #      order, so the result cannot depend on request ordering) ----
      elements = [c for c in ELEMENT_ORDER if c in Brief.required_element_codes]
      for code in elements:
          severity = ELEMENT_SEVERITY[code]
          payload  = ArtworkVersion.mandatory_elements[code_to_key(code)]   # null when absent
          if payload is null:
              result = FAIL; detail = "ELEMENT_ABSENT"
          else:
              result = PASS if ELEMENT_PREDICATE[code](payload, Brief.regulatory_scheme) else FAIL
              detail = "OK" if result == PASS else ELEMENT_FAIL_DETAIL[code]
          emit ElementCheck(element_code=code, severity=severity, result=result,
                            detail=detail, check_run_no=ArtworkVersion.check_run_no)

      # ELEMENT_PREDICATE (all evaluated against ArtworkVersion.mandatory_elements):
      #   NET_CONTENTS        : net_contents.metric_value > 0
      #                         AND net_contents.metric_uom is a non-empty string
      #                         AND (Brief.regulatory_scheme != "FDA_FOOD"
      #                              OR (net_contents.us_value > 0
      #                                  AND net_contents.us_uom is a non-empty string))
      #   INGREDIENT_STATEMENT: len(ingredient_statement.text) >= 10
      #                         AND ingredient_statement.descending_order == true
      #   ALLERGEN_STATEMENT  : len(allergen_statement.text) >= 3
      #                         AND allergen_statement.allergen_emphasis == true
      #   DATE_CODE_ZONE      : date_code_zone.zone_mm2 >= 150
      #                         AND date_code_zone.position is a non-empty string
      #   BARCODE             : barcode.gtin14 matches ^[0-9]{14}$
      #   RECYCLING_MARK      : recycling_mark.present == true
      #   ADDRESS_BLOCK       : len(address_block.text) >= 15

      # ---- step 2: per-row deduction (WAIVED rows survive from earlier runs
      #      only when the waiver endpoint recomputes; a fresh verify-elements
      #      run deletes prior rows, so WAIVED reverts to a fresh verdict) ----
      for row in ElementCheck where check_run_no == ArtworkVersion.check_run_no:
          if   row.result == FAIL:   row.deduction_points = ELEMENT_SEVERITY_WEIGHT[row.severity]
          elif row.result == WAIVED: row.deduction_points = ELEMENT_SEVERITY_WEIGHT[row.severity] * WAIVED_WEIGHT_FACTOR
          else:                      row.deduction_points = 0.0

      # ---- step 3: four independent inputs combine, with the rounding order
      #      pinned: scheme scaling rounds to 2dp FIRST, variant penalties are
      #      added AFTER, and the final score rounds to 1dp LAST ----
      deduction_sum   = sum(row.deduction_points for row in rows)            # input 1: element verdicts
      scaled          = round_half_up(deduction_sum * SCHEME_FACTOR[Brief.regulatory_scheme], 2)   # input 2: scheme
      market_penalty  = MARKET_PENALTY_POINTS   * max(0, count(Brief.market_codes) - 1)            # input 3: market breadth
      language_penalty= LANGUAGE_PENALTY_POINTS * max(0, count(ArtworkAsset.language_codes) - 2)   # input 4: language breadth
      total_penalty   = scaled + market_penalty + language_penalty
      compliance_score= min(100.0, max(0.0, round_half_up(100.0 - total_penalty, 1)))

      failed_element_count  = count(rows where result == FAIL)
      waived_element_count  = count(rows where result == WAIVED)
    input_set: |
      Exactly the ElementCheck rows whose artwork_version_id == the version under
      verification AND check_run_no == ArtworkVersion.check_run_no (the run just
      executed). Rows from earlier runs are deleted by the new run and never enter
      the sum. Brief is reached through ArtworkVersion.artwork_asset_id ->
      ArtworkAsset.brief_id; ArtworkAsset.language_codes is the asset's own array,
      not the brief's.
    constants:
      ELEMENT_ORDER: [NET_CONTENTS, INGREDIENT_STATEMENT, ALLERGEN_STATEMENT, DATE_CODE_ZONE, BARCODE, RECYCLING_MARK, ADDRESS_BLOCK]
      ELEMENT_SEVERITY:
        NET_CONTENTS: CRITICAL
        INGREDIENT_STATEMENT: CRITICAL
        ALLERGEN_STATEMENT: CRITICAL
        DATE_CODE_ZONE: MAJOR
        BARCODE: MAJOR
        RECYCLING_MARK: MINOR
        ADDRESS_BLOCK: MINOR
      ELEMENT_SEVERITY_WEIGHT: { CRITICAL: 25, MAJOR: 10, MINOR: 4 }
      WAIVED_WEIGHT_FACTOR: 0.5
      SCHEME_FACTOR: { FDA_FOOD: 1.00, EU_FIC: 1.10, HEALTH_CANADA: 1.05 }
      MARKET_PENALTY_POINTS: 2.5
      LANGUAGE_PENALTY_POINTS: 1.5
      COMPLIANCE_SCORE_FLOOR: 70.0
      REVISION_CYCLE_CAP: 3
    precision: "deduction_points and the scheme-scaled subtotal to 2 decimal places, round_half_up; compliance_score to 1 decimal place, round_half_up, then clamped into [0.0, 100.0]"

  - name: proof_color_tolerance_verdict
    trigger: "POST /printer-proofs/{id}/color-decision"
    algorithm: threshold
    formula: |
      base_tolerance      = DELTA_E_TOLERANCE[Printer.color_standard][PrinterProof.substrate_code]
      tightening          = BRAND_CRITICAL_TIGHTENING if ArtworkAsset.brand_critical_color else 0.0
      effective_tolerance = round_half_up(base_tolerance - tightening, 1)
      color_status        = COLOR_PASS if measured_delta_e_max <= effective_tolerance else COLOR_FAIL
    input_set: |
      Printer is reached through PrinterProof.printer_id; ArtworkAsset through
      PrinterProof.artwork_version_id -> ArtworkVersion.artwork_asset_id. Only the
      single proof named in the path is affected; sibling proofs of the same
      version are untouched.
    constants:
      DELTA_E_TOLERANCE:
        G7_MASTER: { COATED_PAPER: 2.0, UNCOATED_PAPER: 3.0, FILM: 3.5, METALLIZED: 4.0 }
        ISO12647:  { COATED_PAPER: 2.5, UNCOATED_PAPER: 3.5, FILM: 4.0, METALLIZED: 4.5 }
      BRAND_CRITICAL_TIGHTENING: 0.5
    precision: "measured_delta_e_max carries 2 decimal places as supplied; effective_tolerance is 1 decimal place; the comparison is inclusive (<=), so a measurement exactly equal to the tolerance is a COLOR_PASS"

  - name: proof_state_resolution
    trigger: "every PrinterProof dimension write: POST /printer-proofs/{id}/color-decision, POST /printer-proofs/{id}/substrate-decision, POST /printer-proofs/{id}/press-check"
    algorithm: constraint_propagation
    formula: |
      if color_status == COLOR_FAIL or substrate_status == SUBSTRATE_REJECTED:
          proof_state = PROOF_REJECTED
      elif color_status == COLOR_PASS
           and substrate_status == SUBSTRATE_APPROVED
           and press_check_status in {NOT_REQUIRED, PRESS_CHECK_ATTENDED}:
          proof_state = PROOF_APPROVED
      else:
          proof_state = PROOF_IN_REVIEW
    input_set: |
      The three dimension fields of the single PrinterProof named in the path.
      The rejecting clause is evaluated first, so a COLOR_FAIL fixes
      PROOF_REJECTED even while substrate_status is still SUBSTRATE_PENDING.
    constants:
      PRESS_CHECK_SATISFIED_STATES: [NOT_REQUIRED, PRESS_CHECK_ATTENDED]
      PRESS_CHECK_BUFFER_MINUTES: 120
    precision: "not applicable — enum derivation"

  - name: route_stage_resolution
    trigger: "POST /review-tasks/{id}/decision (re-derived for the deciding task's stage on every decision)"
    algorithm: aggregation
    formula: |
      stage_tasks = ReviewTask where review_route_id == route.id and stage_no == n
      if any(t.decision == REJECTED for t in stage_tasks):
          return REJECTED
      if every t in stage_tasks has t.decision in APPROVING_DECISIONS:
          return APPROVED
      return PENDING

      # route-level consequences of the stage verdict
      if verdict == REJECTED:  route.status = COMPLETE_REJECTED
      elif verdict == APPROVED and route.current_stage_no < FINAL_STAGE_NO:
          route.current_stage_no = route.current_stage_no + 1
      elif verdict == APPROVED and route.current_stage_no == FINAL_STAGE_NO:
          route.status = COMPLETE_APPROVED
      route.conditional_count = count(ReviewTask where review_route_id == route.id
                                      and decision == CONDITIONAL)
    input_set: |
      Only the ReviewTask rows of the same review_route_id whose stage_no equals
      the stage being resolved. Tasks of other stages — including already-decided
      earlier stages and not-yet-active later stages — are excluded. SKIPPED rows
      cannot appear during resolution because SKIPPED is only written after the
      route is already COMPLETE_REJECTED.
    constants:
      APPROVING_DECISIONS: [APPROVED, CONDITIONAL]
      FINAL_STAGE_NO: 3
      STAGE_PLAN:
        - { stage_no: 1, mode: PARALLEL,   disciplines: [BRAND, REGULATORY] }
        - { stage_no: 2, mode: SEQUENTIAL, disciplines: [LEGAL] }
        - { stage_no: 3, mode: SEQUENTIAL, disciplines: [QUALITY] }
    precision: "not applicable — enum derivation over integer counts"

  - name: plate_order_cost
    trigger: "POST /plate-orders"
    algorithm: tiered_pricing
    formula: |
      # marginal ladder: each plate is priced at the rate of the band it lands in
      band_1 = min(plate_set_count, 4)                       * PLATE_RATE_1_CENTS
      band_2 = max(0, min(plate_set_count, 8) - 4)           * PLATE_RATE_2_CENTS
      band_3 = max(0, plate_set_count - 8)                   * PLATE_RATE_3_CENTS
      plate_subtotal_cents = band_1 + band_2 + band_3

      setup_fee_cents = PLATE_SETUP_FEE_SMALL_CENTS if plate_set_count <= 8
                        else PLATE_SETUP_FEE_LARGE_CENTS

      # the expedite surcharge is keyed on plates + setup, and is itself never
      # re-fed into the tier selection
      expedite_fee_cents = round_half_up((plate_subtotal_cents + setup_fee_cents) * EXPEDITE_PCT, 0)
                           if expedite else 0

      cost_cents = plate_subtotal_cents + setup_fee_cents + expedite_fee_cents
    input_set: |
      Only the plate_set_count and expedite flag of the order being created. The
      budget check compares (ArtworkAsset.committed_plate_cost_cents + cost_cents)
      against ArtworkAsset.plate_budget_cents, where
      committed_plate_cost_cents sums PlateOrder.cost_cents over orders of this
      asset whose status == ORDERED (CANCELLED orders excluded).
    constants:
      PLATE_RATE_1_CENTS: 18000
      PLATE_RATE_2_CENTS: 15500
      PLATE_RATE_3_CENTS: 13000
      PLATE_SETUP_FEE_SMALL_CENTS: 60000
      PLATE_SETUP_FEE_LARGE_CENTS: 90000
      EXPEDITE_PCT: 0.25
    precision: "integer cents throughout; the single rounding step is the expedite surcharge, round_half_up to 0 decimal places"

  - name: cost_recovery_amount
    trigger: "POST /error-escapes/{id}/recovery-claim (PROVISIONAL variant) and POST /error-escapes/{id}/settle with resolution == SETTLED (FINAL variant)"
    algorithm: aggregation
    formula: |
      # investigation fee is fixed by where the escape was caught
      investigation_fee_cents = INVESTIGATION_FEE_LATE_CENTS
                                if ErrorEscape.discovered_stage in LATE_DISCOVERY_STAGES
                                else INVESTIGATION_FEE_EARLY_CENTS

      # RECOVERY_LINE_ORDER is fixed: [reprint, scrap, freight, investigation].
      # Rounding is applied PER LINE, in that order, and the rounded per-line
      # amounts are then summed. Summing the raw lines and rounding once at the
      # end is a DIFFERENT (and wrong) result.
      lines = variant_lines(variant)                      # see variants below
      per_line_recoverable = [ round_half_up(amount * ErrorEscape.printer_share_pct, 0)
                               for amount in lines ]      # evaluated in RECOVERY_LINE_ORDER
      gross_recoverable = sum(per_line_recoverable)

      cap = Printer.recovery_liability_cap_cents
      if variant == PROVISIONAL:
          provisional_recovery_cents = min(gross_recoverable, cap)
          liability_cap_applied      = (gross_recoverable > cap)
      else:  # FINAL
          # the cap is NOT silently clamped at settlement — an over-cap final
          # claim is rejected by validations[priority=56] so the apportionment
          # can be revised through the DISPUTED -> ROOT_CAUSE_ASSIGNED cycle
          final_recovery_cents    = gross_recoverable
          recovery_variance_cents = final_recovery_cents - provisional_recovery_cents
    input_set: |
      Exactly one ErrorEscape (the one named in the path) plus its Printer via
      ErrorEscape.printer_id and its ArtworkAsset via
      ErrorEscape.artwork_version_id -> ArtworkVersion.artwork_asset_id. No other
      escape of the same printer or version enters the sum; the printer-level
      roll-up lives in Printer.recovery_balance_cents and is a separate
      SETTLED-only aggregation.
    constants:
      RECOVERY_LINE_ORDER: [reprint, scrap, expedite_freight, investigation]
      STANDARD_UNIT_COST_CENTS: { CARTON: 42, LABEL: 9, FILM: 15, SHIPPER: 120 }
      SCRAP_HANDLING_CENTS: 7
      INVESTIGATION_FEE_EARLY_CENTS: 60000
      INVESTIGATION_FEE_LATE_CENTS: 150000
      LATE_DISCOVERY_STAGES: [DISTRIBUTION, MARKET]
    precision: "integer cents; round_half_up to 0 decimal places applied independently to each of the four lines in RECOVERY_LINE_ORDER before summation (never once on the raw total)"
    variants:
      - name: PROVISIONAL
        when: "POST /error-escapes/{id}/recovery-claim — no printer invoices exist yet, so the exposure is estimated from the standard unit cost"
        difference: |
          lines = [ ErrorEscape.units_affected * ArtworkAsset.standard_unit_cost_cents,   # estimated reprint
                    ErrorEscape.units_affected * SCRAP_HANDLING_CENTS,                    # estimated scrap handling
                    0,                                                                    # no freight estimate exists pre-settlement
                    investigation_fee_cents ]
          The result is CLAMPED to Printer.recovery_liability_cap_cents and sets
          liability_cap_applied.
      - name: FINAL
        when: "POST /error-escapes/{id}/settle with resolution == SETTLED — the three actual printer invoices are supplied on the request"
        difference: |
          lines = [ ErrorEscape.actual_reprint_cost_cents,
                    ErrorEscape.actual_scrap_cost_cents,
                    ErrorEscape.actual_expedite_freight_cents,   # a real line here, always 0 in PROVISIONAL
                    investigation_fee_cents ]
          The result is NOT clamped — exceeding the cap raises
          ERR_RECOVERY_EXCEEDS_LIABILITY_CAP instead — and it additionally writes
          recovery_variance_cents against the provisional figure.

  - name: runout_projection
    trigger: "POST /inventory-runouts (both variants), POST /inventory-runouts/{id}/depletion-records (CHRONOLOGICAL variant re-run), POST /inventory-runouts/{id}/disposition-reversal (CHRONOLOGICAL variant unchanged, money fields cleared)"
    algorithm: chronological
    formula: |
      # ---- FORWARD_LOOKING: planned burn-down, ignores actuals entirely ----
      if on_hand_qty == 0:
          projected_weeks        = 0
          projected_runout_date  = date_of(runout_start_utc)
      else:
          projected_weeks        = ceil(on_hand_qty / weekly_usage_qty)
          projected_runout_date  = date_of(runout_start_utc) + (7 * projected_weeks) days

      # ---- CHRONOLOGICAL: replay the actual depletion records in ascending
      #      week_start_utc order (the only permitted processing order) ----
      remaining = on_hand_qty
      actual_runout_date = null
      for rec in depletion_records ordered by rec.week_start_utc ASC:
          remaining = remaining - rec.units_consumed
          if remaining <= 0:
              remaining = 0
              actual_runout_date = date_of(rec.week_start_utc) + 7 days
              break
      remaining_qty = max(0, remaining)

      if depletion_records is empty:
          trailing_avg_usage_qty = null
      else:
          tail = last min(3, count(depletion_records)) records in ascending week_start_utc order
          trailing_avg_usage_qty = max(1, round_half_up(sum(r.units_consumed for r in tail) / count(tail), 0))

      if actual_runout_date is null and depletion_records is non-empty:
          # still stock left: extrapolate from the trailing average, anchored on
          # the week AFTER the last recorded week
          extra_weeks        = ceil(remaining_qty / trailing_avg_usage_qty)
          anchor             = date_of(last_record.week_start_utc) + 7 days
          actual_runout_date = anchor + (7 * extra_weeks) days
    input_set: |
      One InventoryRunout row. FORWARD_LOOKING reads only on_hand_qty,
      weekly_usage_qty and runout_start_utc — never depletion_records.
      CHRONOLOGICAL reads only on_hand_qty and depletion_records — never
      weekly_usage_qty. Records are always replayed in ascending week_start_utc
      order regardless of the order they were appended in; the append endpoint
      additionally rejects a record whose week_start_utc is not strictly greater
      than every stored record's, so the stored array is already sorted.
    constants:
      WEEK_LENGTH_DAYS: 7
      TRAILING_WINDOW_RECORDS: 3
      MIN_TRAILING_AVG_QTY: 1
    precision: "integer units; trailing_avg_usage_qty round_half_up to 0 decimal places then floored at MIN_TRAILING_AVG_QTY; week counts use ceil; dates are calendar dates rendered YYYY-MM-DD"
    variants:
      - name: FORWARD_LOOKING
        when: "always recomputed at POST /inventory-runouts; written to projected_runout_date and never revised afterwards"
        difference: |
          Uses the PLANNED weekly_usage_qty and whole-week ceilings from
          runout_start_utc. Blind to every depletion record, so it stays fixed
          for the life of the runout even as actuals diverge.
      - name: CHRONOLOGICAL
        when: "recomputed on every POST /inventory-runouts/{id}/depletion-records; written to actual_runout_date, remaining_qty and trailing_avg_usage_qty"
        difference: |
          Replays the ACTUAL consumed units week by week, so the depletion date
          is driven by observed burn plus a trailing-3-week extrapolation rather
          than the plan rate. For identical stock it yields a different date
          whenever actual weekly consumption differs from weekly_usage_qty.

  - name: changeover_writeoff_cost
    trigger: "POST /inventory-runouts/{id}/disposition with disposition == SCRAP"
    algorithm: threshold
    formula: |
      material_writeoff_cents = units_scrapped * ArtworkAsset.standard_unit_cost_cents
      relabel_cost_cents      = units_reworked * REWORK_UNIT_CENTS
      changeover_base_cents   = material_writeoff_cents + relabel_cost_cents

      # The tier is selected on changeover_base_cents — the PRE-surcharge figure.
      # It is never re-selected on total_changeover_cost_cents, which would make
      # the formula circular (the surcharge is part of the total it would key on).
      if   changeover_base_cents <  CHANGEOVER_TIER_1_CEILING_CENTS: tier_pct = CHANGEOVER_PCT_TIER_1
      elif changeover_base_cents <  CHANGEOVER_TIER_2_CEILING_CENTS: tier_pct = CHANGEOVER_PCT_TIER_2
      else:                                                          tier_pct = CHANGEOVER_PCT_TIER_3

      changeover_expedite_cents   = round_half_up(changeover_base_cents * tier_pct, 0)
      total_changeover_cost_cents = changeover_base_cents + changeover_expedite_cents
    input_set: |
      One InventoryRunout row plus ArtworkAsset.standard_unit_cost_cents reached
      via InventoryRunout.artwork_asset_id. units_scrapped + units_reworked must
      already equal remaining_qty (enforced by validations[priority=51]), so the
      two cost lines partition the residual stock exactly once.
    constants:
      REWORK_UNIT_CENTS: 18
      CHANGEOVER_TIER_1_CEILING_CENTS: 500000
      CHANGEOVER_TIER_2_CEILING_CENTS: 2000000
      CHANGEOVER_PCT_TIER_1: 0.05
      CHANGEOVER_PCT_TIER_2: 0.08
      CHANGEOVER_PCT_TIER_3: 0.12
    precision: "integer cents; the single rounding step is the surcharge, round_half_up to 0 decimal places; tier boundaries are exclusive-upper (a base of exactly 500000 falls in tier 2)"

  - name: printer_performance_penalty
    trigger: "POST /error-escapes/{id}/settle with resolution == SETTLED"
    algorithm: threshold
    formula: |
      raw = PENALTY_POINTS_PER_1000_UNITS * (ErrorEscape.units_affected / 1000)
            + ESCAPE_STAGE_PENALTY_POINTS[ErrorEscape.discovered_stage]
      performance_penalty_points = min(PENALTY_CAP_POINTS, round_half_up(raw, 1))

      new_score = max(0.0, round_half_up(Printer.performance_score - performance_penalty_points, 1))
      Printer.performance_score = new_score
      if new_score < PRINTER_PROBATION_SCORE:
          Printer.certification_status = PROBATION
    input_set: |
      One ErrorEscape (the one being settled) and its Printer via
      ErrorEscape.printer_id. WRITTEN_OFF settlements compute no penalty and
      leave Printer.performance_score untouched.
    constants:
      PENALTY_POINTS_PER_1000_UNITS: 2.0
      ESCAPE_STAGE_PENALTY_POINTS: { PRESS: 2.0, PACKING: 4.0, DISTRIBUTION: 8.0, MARKET: 10.0 }
      PENALTY_CAP_POINTS: 40.0
      PRINTER_PROBATION_SCORE: 70.0
    precision: "one decimal place, round_half_up, for both the penalty and the resulting performance_score; the PROBATION comparison is strict (<), so a score of exactly 70.0 stays CERTIFIED"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated row decides the response)
# =============================================================================
validations:

  # ---- 1-2: authentication / coarse authorization ----------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # ---- 3-14: existence, resolved left-to-right along the path then the body --
  - priority: 3
    category: existence
    check: "every brief id referenced by the path or by a brief_id body field resolves to a Brief row"
    error_id: ERR_BRIEF_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /briefs/{id}, POST /briefs/{id}/decision, POST /artwork-assets, GET /artwork-assets?brief_id"
  - priority: 4
    category: existence
    check: "every marketing claim id referenced by the path or by a claim_ids entry resolves to a MarketingClaim row"
    error_id: ERR_MARKETING_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /marketing-claims/{id}, POST /marketing-claims/{id}/clearance, POST /artwork-assets/{id}/versions, PATCH /artwork-versions/{id}"
  - priority: 5
    category: existence
    check: "every artwork asset id referenced by the path or by an artwork_asset_id body field resolves to an ArtworkAsset row"
    error_id: ERR_ARTWORK_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "GET /artwork-assets/{id}, POST /artwork-assets/{id}/versions, POST /inventory-runouts, GET /artwork-versions?artwork_asset_id, GET /inventory-runouts?artwork_asset_id"
  - priority: 6
    category: existence
    check: "every artwork version id referenced by the path, by artwork_version_id, by supersedes_version_id, by obsolete_version_id or by current_approved_version_id resolves to an ArtworkVersion row"
    error_id: ERR_ARTWORK_VERSION_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /artwork-versions/{id}, all POST /artwork-versions/{id}/*, POST /printer-proofs, POST /plate-orders, POST /inventory-runouts, POST /error-escapes, every filtered list taking an artwork_version_id / supersedes_version_id / obsolete_version_id / current_approved_version_id query field"
  - priority: 7
    category: existence
    check: "the element check id in the path resolves to an ElementCheck row"
    error_id: ERR_ELEMENT_CHECK_NOT_FOUND
    http_status: 404
    applies_to: "GET /element-checks/{id}, POST /element-checks/{id}/waiver"
  - priority: 8
    category: existence
    check: "the review route id in the path or in a review_route_id query field resolves to a ReviewRoute row"
    error_id: ERR_REVIEW_ROUTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /review-routes/{id}, GET /review-tasks?review_route_id"
  - priority: 9
    category: existence
    check: "the review task id in the path resolves to a ReviewTask row"
    error_id: ERR_REVIEW_TASK_NOT_FOUND
    http_status: 404
    applies_to: "GET /review-tasks/{id}, POST /review-tasks/{id}/decision"
  - priority: 10
    category: existence
    check: "every printer id referenced by the path or by a printer_id body/query field resolves to a Printer row"
    error_id: ERR_PRINTER_NOT_FOUND
    http_status: 404
    applies_to: "GET /printers/{id}, POST /printer-proofs, POST /plate-orders, POST /error-escapes, GET /printer-proofs?printer_id, GET /plate-orders?printer_id, GET /error-escapes?printer_id"
  - priority: 11
    category: existence
    check: "every printer proof id referenced by the path or by a printer_proof_id body/query field resolves to a PrinterProof row"
    error_id: ERR_PRINTER_PROOF_NOT_FOUND
    http_status: 404
    applies_to: "GET /printer-proofs/{id}, all POST /printer-proofs/{id}/*, POST /plate-orders, GET /plate-orders?printer_proof_id"
  - priority: 12
    category: existence
    check: "the plate order id in the path resolves to a PlateOrder row"
    error_id: ERR_PLATE_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /plate-orders/{id}, POST /plate-orders/{id}/cancel"
  - priority: 13
    category: existence
    check: "the inventory runout id in the path resolves to an InventoryRunout row"
    error_id: ERR_INVENTORY_RUNOUT_NOT_FOUND
    http_status: 404
    applies_to: "GET /inventory-runouts/{id}, all POST /inventory-runouts/{id}/*"
  - priority: 14
    category: existence
    check: "the error escape id in the path resolves to an ErrorEscape row"
    error_id: ERR_ERROR_ESCAPE_NOT_FOUND
    http_status: 404
    applies_to: "GET /error-escapes/{id}, all POST /error-escapes/{id}/*"

  # ---- 15-16: identity-level authorization (needs the resource loaded) -------
  - priority: 15
    category: auth
    check: "when X-User-Role == PrinterRep, X-User-ID equals the printer_id of the resource being acted on (PrinterProof.printer_id on proof creation, ErrorEscape.printer_id on dispute)"
    error_id: ERR_PRINTER_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /printer-proofs, POST /error-escapes/{id}/dispute"
  - priority: 16
    category: auth
    check: "the deciding X-User-ID is neither the routed ArtworkVersion.author_user_id nor an X-User-ID already recorded in decided_by_user_id on any ReviewTask of the same ReviewRoute"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /review-tasks/{id}/decision"

  # ---- 17-20: request schema and uniqueness ---------------------------------
  - priority: 17
    category: business_constraint
    check: "every required input field of the called endpoint is present, every enum value is a declared member, every numeric field satisfies its §1.1 constraints (ranges, array sizes, string lengths, regex), datetimes parse as ISO 8601 UTC, and no unknown field is supplied; endpoint-specific conditional requirements are included (comment on a REJECTED decision, condition_code on a CONDITIONAL decision, cancel_reason on a cancel, the three actual invoice amounts on a SETTLED settlement, units_scrapped and units_reworked on a SCRAP disposition, press_check_end_utc strictly after press_check_start_utc, cleared_until_utc strictly after cleared_from_utc)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 18
    category: business_constraint
    check: "Brief.sku_code is not already used by another Brief row (case-sensitive exact match)"
    error_id: ERR_DUPLICATE_SKU_CODE
    http_status: 409
    applies_to: "POST /briefs"
  - priority: 19
    category: business_constraint
    check: "Printer.name is not already used by another Printer row"
    error_id: ERR_DUPLICATE_PRINTER_NAME
    http_status: 409
    applies_to: "POST /printers"
  - priority: 20
    category: business_constraint
    check: "no existing ArtworkAsset shares the same (brief_id, market_code, component_type) triple"
    error_id: ERR_DUPLICATE_ASSET_VARIANT
    http_status: 409
    applies_to: "POST /artwork-assets"

  # ---- 21-22: optimistic concurrency (§1.2.1) -------------------------------
  - priority: 21
    category: business_constraint
    check: "expected_artwork_asset_version equals the current ArtworkAsset.version"
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412
    applies_to: "POST /artwork-assets/{id}/versions"
  - priority: 22
    category: business_constraint
    check: "expected_error_escape_version equals the current ErrorEscape.version"
    error_id: ERR_STALE_ESCAPE_VERSION
    http_status: 412
    applies_to: "POST /error-escapes/{id}/recovery-claim"

  # ---- 23-35: state preconditions ------------------------------------------
  - priority: 23
    category: state
    check: "Brief.status == DRAFT for edits and for the approve/reject decision"
    error_id: ERR_BRIEF_STATE_INVALID
    http_status: 409
    applies_to: "PATCH /briefs/{id}, POST /briefs/{id}/decision"
  - priority: 24
    category: state
    check: "the referenced ArtworkVersion is in a state the called operation admits — DRAFT or ELEMENTS_VERIFIED or REVISION_REQUESTED or APPROVED (with requires_reverification true) for verify-elements; ELEMENTS_VERIFIED for submit; REVISION_REQUESTED for revise; APPROVED for release-to-print; DRAFT or REVISION_REQUESTED for PATCH; APPROVED or RELEASED_TO_PRINT for POST /printer-proofs and POST /plate-orders; RELEASED_TO_PRINT or OBSOLETE_PENDING or OBSOLETE for POST /error-escapes; OBSOLETE_PENDING for the obsolete_version_id of POST /inventory-runouts — and, for verify-elements / PATCH / submit, the owning asset's obsolescence_state != SUPERSEDED"
    error_id: ERR_VERSION_STATE_INVALID
    http_status: 409
    applies_to: "PATCH /artwork-versions/{id}, POST /artwork-versions/{id}/verify-elements, POST /artwork-versions/{id}/revise, POST /artwork-versions/{id}/submit, POST /artwork-versions/{id}/release-to-print, POST /printer-proofs, POST /plate-orders, POST /inventory-runouts, POST /error-escapes"
  - priority: 25
    category: state
    check: "MarketingClaim.legal_status == DRAFT or CLEARED for a clearance decision; REJECTED is terminal"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /marketing-claims/{id}/clearance"
  - priority: 26
    category: state
    check: "ElementCheck.result == FAIL and the row belongs to the owning version's current check_run_no"
    error_id: ERR_ELEMENT_CHECK_NOT_FAILED
    http_status: 409
    applies_to: "POST /element-checks/{id}/waiver"
  - priority: 27
    category: state
    check: "ReviewTask.is_active == true, ReviewTask.stage_no == ReviewRoute.current_stage_no, and ReviewRoute.status == IN_PROGRESS"
    error_id: ERR_ROUTE_STAGE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /review-tasks/{id}/decision"
  - priority: 28
    category: state
    check: "ReviewTask.decision == PENDING"
    error_id: ERR_TASK_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /review-tasks/{id}/decision"
  - priority: 29
    category: state
    check: "PrinterProof.proof_state == PROOF_IN_REVIEW (a PROOF_APPROVED or PROOF_REJECTED proof accepts no further dimension writes)"
    error_id: ERR_PROOF_STATE_INVALID
    http_status: 409
    applies_to: "POST /printer-proofs/{id}/color-decision, POST /printer-proofs/{id}/substrate-decision, POST /printer-proofs/{id}/press-check"
  - priority: 30
    category: state
    check: "the specific dimension being written is still pending — color_status == COLOR_PENDING for a color decision, substrate_status == SUBSTRATE_PENDING for a substrate decision"
    error_id: ERR_PROOF_DIMENSION_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /printer-proofs/{id}/color-decision, POST /printer-proofs/{id}/substrate-decision"
  - priority: 31
    category: state
    check: "PrinterProof.press_check_status is PRESS_CHECK_REQUIRED or PRESS_CHECK_SCHEDULED (a NOT_REQUIRED or already-ATTENDED track accepts no press-check write)"
    error_id: ERR_PRESS_CHECK_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /printer-proofs/{id}/press-check"
  - priority: 32
    category: state
    check: "PlateOrder.status == ORDERED"
    error_id: ERR_PLATE_ORDER_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /plate-orders/{id}/cancel"
  - priority: 33
    category: state
    check: "InventoryRunout.state is PLANNED or MONITORING for depletion-records and disposition, and SCRAPPED for disposition-reversal"
    error_id: ERR_RUNOUT_STATE_INVALID
    http_status: 409
    applies_to: "POST /inventory-runouts/{id}/depletion-records, POST /inventory-runouts/{id}/disposition, POST /inventory-runouts/{id}/disposition-reversal"
  - priority: 34
    category: state
    check: "ErrorEscape.state is OPEN or DISPUTED for root-cause, ROOT_CAUSE_ASSIGNED for recovery-claim, RECOVERY_CLAIMED for dispute, and RECOVERY_CLAIMED or DISPUTED for settle"
    error_id: ERR_ESCAPE_STATE_INVALID
    http_status: 409
    applies_to: "POST /error-escapes/{id}/root-cause, POST /error-escapes/{id}/recovery-claim, POST /error-escapes/{id}/dispute, POST /error-escapes/{id}/settle"
  - priority: 35
    category: state
    check: "the Brief reached through ArtworkVersion.artwork_asset_id -> ArtworkAsset.brief_id has status == APPROVED"
    error_id: ERR_BRIEF_NOT_APPROVED
    http_status: 409
    applies_to: "POST /artwork-versions/{id}/submit"

  # ---- 36-41: regulatory / compliance safety (ahead of every other business rule) ----
  - priority: 36
    category: business_safety
    check: "no ElementCheck row of the version's current check_run_no has result == FAIL"
    error_id: ERR_MANDATORY_ELEMENT_FAILED
    http_status: 422
    applies_to: "POST /artwork-versions/{id}/submit"
  - priority: 37
    category: business_safety
    check: "ArtworkVersion.compliance_score >= COMPLIANCE_SCORE_FLOOR (70.0, inclusive)"
    error_id: ERR_COMPLIANCE_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /artwork-versions/{id}/submit"
  - priority: 38
    category: business_safety
    check: "every ArtworkVersion.claim_ids entry resolves to a MarketingClaim whose legal_status == CLEARED"
    error_id: ERR_CLAIM_NOT_CLEARED
    http_status: 422
    applies_to: "POST /artwork-versions/{id}/submit"
  - priority: 39
    category: business_safety
    check: "at submit, every claim satisfies cleared_from_utc <= current logical clock < cleared_until_utc; at release-to-print, every pinned_claim_snapshot entry satisfies cleared_until_utc > current logical clock"
    error_id: ERR_CLAIM_CLEARANCE_EXPIRED
    http_status: 422
    applies_to: "POST /artwork-versions/{id}/submit, POST /artwork-versions/{id}/release-to-print"
  - priority: 40
    category: business_safety
    check: "ArtworkVersion.requires_reverification == false (conditional approvals must be re-verified before plates are released)"
    error_id: ERR_REVERIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /artwork-versions/{id}/release-to-print"
  - priority: 41
    category: business_safety
    check: "ArtworkVersion.revision_cycle_count < REVISION_CYCLE_CAP (3)"
    error_id: ERR_REVISION_CYCLE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /artwork-versions/{id}/submit, POST /artwork-versions/{id}/revise"

  # ---- 42-46: referential coherence between related rows -------------------
  - priority: 42
    category: business_referential
    check: "ArtworkAsset.market_code is a member of the parent Brief.market_codes array"
    error_id: ERR_MARKET_CODE_NOT_IN_BRIEF
    http_status: 422
    applies_to: "POST /artwork-assets"
  - priority: 43
    category: business_referential
    check: "every ArtworkAsset.language_codes entry is a member of the parent Brief.language_codes array"
    error_id: ERR_LANGUAGE_CODE_NOT_IN_BRIEF
    http_status: 422
    applies_to: "POST /artwork-assets"
  - priority: 44
    category: business_referential
    check: "every claim referenced by claim_ids has market_code == the owning ArtworkAsset.market_code"
    error_id: ERR_CLAIM_MARKET_MISMATCH
    http_status: 422
    applies_to: "POST /artwork-versions/{id}/submit"
  - priority: 45
    category: business_referential
    check: "when supersedes_version_id is non-null it names an ArtworkVersion whose artwork_asset_id equals the asset the new version is created under"
    error_id: ERR_SUPERSEDES_VERSION_MISMATCH
    http_status: 422
    applies_to: "POST /artwork-assets/{id}/versions"
  - priority: 46
    category: business_referential
    check: "PrinterProof.artwork_version_id equals the plate order's artwork_version_id AND PrinterProof.printer_id equals the plate order's printer_id"
    error_id: ERR_PROOF_VERSION_MISMATCH
    http_status: 422
    applies_to: "POST /plate-orders"

  # ---- 47-51: constraint satisfaction --------------------------------------
  - priority: 47
    category: business_constraint
    check: "PrinterProof.substrate_code is a member of Printer.certified_substrates"
    error_id: ERR_SUBSTRATE_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /printer-proofs"
  - priority: 48
    category: business_constraint
    check: "Printer.certification_status == CERTIFIED"
    error_id: ERR_PRINTER_ON_PROBATION
    http_status: 422
    applies_to: "POST /printer-proofs, POST /plate-orders"
  - priority: 49
    category: business_constraint
    check: "the referenced PrinterProof.proof_state == PROOF_APPROVED for a plate order, and at least one PrinterProof of the version has proof_state == PROOF_APPROVED for release-to-print"
    error_id: ERR_PROOF_NOT_APPROVED
    http_status: 422
    applies_to: "POST /plate-orders, POST /artwork-versions/{id}/release-to-print"
  - priority: 50
    category: business_constraint
    check: "printer_share_pct == 1.00 when root_cause_party == PRINTER, == 0.00 when root_cause_party is BRAND or AGENCY, and strictly between 0.00 and 1.00 when root_cause_party == SHARED"
    error_id: ERR_SHARE_INCONSISTENT_WITH_PARTY
    http_status: 422
    applies_to: "POST /error-escapes/{id}/root-cause"
  - priority: 51
    category: business_constraint
    check: "for a SCRAP disposition, units_scrapped + units_reworked == InventoryRunout.remaining_qty exactly; for a RUNOUT disposition, InventoryRunout.remaining_qty == 0"
    error_id: ERR_UNIT_CONSERVATION_VIOLATION
    http_status: 422
    applies_to: "POST /inventory-runouts/{id}/disposition"

  # ---- 52-54: temporal conflicts ------------------------------------------
  - priority: 52
    category: business_temporal
    check: "the requested [press_check_start_utc, press_check_end_utc) window, widened by PRESS_CHECK_BUFFER_MINUTES (120) on BOTH sides, does not overlap the equally-widened window of any other PrinterProof sharing the same (printer_id, press_line_code) whose press_check_status is PRESS_CHECK_SCHEDULED or PRESS_CHECK_ATTENDED; the comparison is half-open, so touching endpoints separated by at least the buffer are permitted"
    error_id: ERR_PRESS_CHECK_OVERLAP
    http_status: 409
    applies_to: "POST /printer-proofs/{id}/press-check"
  - priority: 53
    category: business_temporal
    check: "the requested [cleared_from_utc, cleared_until_utc) clearance interval does not overlap the interval of any other MarketingClaim with the same (claim_code, market_code) whose legal_status == CLEARED; the comparison is pure half-open with NO buffer, so an interval starting exactly at another's cleared_until_utc is accepted"
    error_id: ERR_CLAIM_CLEARANCE_OVERLAP
    http_status: 409
    applies_to: "POST /marketing-claims/{id}/clearance"
  - priority: 54
    category: business_temporal
    check: "within the submitted records array, week_start_utc values are strictly ascending, and every submitted week_start_utc is strictly greater than the maximum week_start_utc already stored in InventoryRunout.depletion_records"
    error_id: ERR_DEPLETION_RECORD_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /inventory-runouts/{id}/depletion-records"

  # ---- 55-56: fiscal ceilings (last, per the domain's safety-before-money order) ----
  - priority: 55
    category: business_fiscal
    check: "ArtworkAsset.committed_plate_cost_cents + the new order's cost_cents <= ArtworkAsset.plate_budget_cents"
    error_id: ERR_PLATE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /plate-orders"
  - priority: 56
    category: business_fiscal
    check: "the FINAL variant's pre-clamp gross_recoverable <= Printer.recovery_liability_cap_cents (the PROVISIONAL variant clamps instead of erroring)"
    error_id: ERR_RECOVERY_EXCEEDS_LIABILITY_CAP
    http_status: 422
    applies_to: "POST /error-escapes/{id}/settle"

# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is "" — every path below is absolute.
# Read endpoints are open to all seven roles; each entity collection exposes a
# single GET /<collection>/{id} (the reverse-reachability segment anchor) plus a
# GET /<collection> filtered list carrying every FK field of that entity as an
# optional query input.
# =============================================================================
endpoints:

  # ---- test-driving: logical clock -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every *_at / *_utc comparison in §1.2-§1.4 reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock advances (or rewinds) to to_iso8601; no entity is mutated"]

  # ---- Brief ---------------------------------------------------------------
  - method: POST
    path: "/briefs"
    description: "Creates a packaging brief with its regulatory scheme, market/language coverage, mandatory element list, structural specification and authoritative net contents."
    roles: [PackagingCoordinator]
    code: 201
    input: [sku_code, product_name, regulatory_scheme, market_codes, language_codes, required_element_codes, structural_spec, net_contents_declaration]
    output: Brief
    side_effects: ["Brief created with status DRAFT, asset_count 0, version 1"]
  - method: GET
    path: "/briefs/{id}"
    description: "Reads one brief including its computed asset_count."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: Brief
    side_effects: []
  - method: GET
    path: "/briefs"
    description: "Lists briefs, newest first by created_at DESC, with optional status filter."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Brief[]
    side_effects: []
  - method: PATCH
    path: "/briefs/{id}"
    description: "Edits a DRAFT brief's coverage, element list, structural spec or net contents."
    roles: [PackagingCoordinator]
    code: 200
    input: ["product_name?", "market_codes?", "language_codes?", "required_element_codes?", "structural_spec?", "net_contents_declaration?"]
    output: Brief
    side_effects: ["fields overwritten; refresh updated_at; increment Brief.version by 1"]
  - method: POST
    path: "/briefs/{id}/decision"
    description: "Regulatory approve/reject decision on a DRAFT brief; approval is the precondition every artwork submission is gated on. decision is one of APPROVED, REJECTED."
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision, review_note]
    output: Brief
    side_effects: ["Brief.status becomes APPROVED or REJECTED", "approved_by_user_id and approved_at set on approval", "review_note stored", "increment Brief.version by 1"]

  # ---- MarketingClaim ------------------------------------------------------
  - method: POST
    path: "/marketing-claims"
    description: "Registers an on-pack marketing claim in the claim library for one market."
    roles: [PackagingCoordinator]
    code: 201
    input: [claim_code, claim_text, claim_type, market_code, substantiation_ref]
    output: MarketingClaim
    side_effects: ["MarketingClaim created with legal_status DRAFT, usage_count 0, version 1"]
  - method: GET
    path: "/marketing-claims/{id}"
    description: "Reads one marketing claim including its clearance interval and computed usage_count."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: MarketingClaim
    side_effects: []
  - method: GET
    path: "/marketing-claims"
    description: "Lists marketing claims, created_at ASC, filterable by claim_code, market_code and legal_status."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["claim_code?", "market_code?", "legal_status?", "limit?", "offset?"]
    output: MarketingClaim[]
    side_effects: []
  - method: POST
    path: "/marketing-claims/{id}/clearance"
    description: "Legal clearance decision on a claim. CLEARED requires a half-open [cleared_from_utc, cleared_until_utc) interval that does not overlap another CLEARED claim with the same (claim_code, market_code); REJECTED requires a rejection_reason and is terminal. decision is one of CLEARED, REJECTED."
    roles: [LegalReviewer]
    code: 200
    input: [decision, "cleared_from_utc?", "cleared_until_utc?", "rejection_reason?"]
    output: MarketingClaim
    side_effects: ["legal_status becomes CLEARED or REJECTED", "clearance interval and cleared_by_user_id stored on CLEARED", "rejection_reason stored on REJECTED", "increment MarketingClaim.version by 1"]

  # ---- ArtworkAsset -------------------------------------------------------
  - method: POST
    path: "/artwork-assets"
    description: "Creates one market/component artwork variant under a brief. The (brief_id, market_code, component_type) triple is unique; market_code and language_codes must be subsets of the brief's coverage."
    roles: [PackagingCoordinator]
    code: 201
    input: [brief_id, market_code, language_codes, component_type, substrate_class, "brand_critical_color?", plate_budget_cents]
    output: ArtworkAsset
    side_effects: ["ArtworkAsset created with obsolescence_state ACTIVE, version_counter 0, all three ledgers 0, standard_unit_cost_cents computed from STANDARD_UNIT_COST_CENTS[component_type]", "parent Brief.asset_count recomputed"]
  - method: GET
    path: "/artwork-assets/{id}"
    description: "Reads one artwork asset including the three conserved ledgers and current_approved_version_id."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: ArtworkAsset
    side_effects: []
  - method: GET
    path: "/artwork-assets"
    description: "Lists artwork assets, created_at ASC. Reverse-reachability list for Brief.id (brief_id) and for ArtworkVersion.id (current_approved_version_id)."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["brief_id?", "current_approved_version_id?", "market_code?", "obsolescence_state?", "limit?", "offset?"]
    output: ArtworkAsset[]
    side_effects: []

  # ---- ArtworkVersion ----------------------------------------------------
  - method: POST
    path: "/artwork-assets/{id}/versions"
    description: "Creates the next ArtworkVersion of an asset. OCC-guarded on the parent asset: expected_artwork_asset_version must equal the asset's current version, because a new version legitimately supersedes the prior revision."
    roles: [PackagingCoordinator]
    code: 201
    input: [expected_artwork_asset_version, reason_for_change_code, change_description, mandatory_elements, "claim_ids?", "supersedes_version_id?"]
    output: ArtworkVersion
    side_effects: ["increment ArtworkAsset.version_counter by 1 and set the new version's version_no to it", "increments ArtworkAsset.version by 1", "ArtworkVersion created in DRAFT with author_user_id = X-User-ID, check_run_no 0, revision_cycle_count 0, route_count 0"]
  - method: GET
    path: "/artwork-versions/{id}"
    description: "Reads one artwork version including compliance_score, failed/waived element counts, open_condition_codes and pinned_claim_snapshot."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: ArtworkVersion
    side_effects: []
  - method: GET
    path: "/artwork-versions"
    description: "Lists artwork versions, version_no ASC. Reverse-reachability list for ArtworkAsset.id (artwork_asset_id) and for the self-referential revision chain (supersedes_version_id)."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["artwork_asset_id?", "supersedes_version_id?", "state?", "limit?", "offset?"]
    output: ArtworkVersion[]
    side_effects: []
  - method: PATCH
    path: "/artwork-versions/{id}"
    description: "Edits a DRAFT or REVISION_REQUESTED version's artwork payload and change documentation. Does not re-run verification and does not change state."
    roles: [PackagingCoordinator]
    code: 200
    input: ["mandatory_elements?", "claim_ids?", "reason_for_change_code?", "change_description?"]
    output: ArtworkVersion
    side_effects: ["fields overwritten; refresh updated_at; increment ArtworkVersion.version by 1", "compliance_score is NOT recomputed until the next verify-elements run"]
  - method: POST
    path: "/artwork-versions/{id}/verify-elements"
    description: "Runs mandatory element verification. Deletes the prior run's ElementCheck rows, writes one row per Brief.required_element_codes entry, and recomputes compliance_score / failed_element_count / waived_element_count. Callable from DRAFT (advances to ELEMENTS_VERIFIED), from ELEMENTS_VERIFIED or REVISION_REQUESTED (state unchanged), and from APPROVED when requires_reverification is true (clears the flag)."
    roles: [PackagingCoordinator]
    code: 200
    input: ["verification_note?"]
    output: ArtworkVersion
    side_effects: ["increment check_run_no by 1", "ElementCheck rows of prior runs deleted, fresh rows created", "compliance_score, failed_element_count, waived_element_count recomputed by mandatory_element_compliance_score", "state DRAFT -> ELEMENTS_VERIFIED, or unchanged from ELEMENTS_VERIFIED / REVISION_REQUESTED / APPROVED", "requires_reverification cleared when called from APPROVED", "increment ArtworkVersion.version by 1"]
  - method: POST
    path: "/artwork-versions/{id}/revise"
    description: "Re-opens a REVISION_REQUESTED version for edit, closing the revision cycle back to DRAFT. Blocked once revision_cycle_count reaches REVISION_CYCLE_CAP (3)."
    roles: [PackagingCoordinator]
    code: 200
    input: ["revise_note?"]
    output: ArtworkVersion
    side_effects: ["state REVISION_REQUESTED -> DRAFT", "increment ArtworkVersion.version by 1"]
  - method: POST
    path: "/artwork-versions/{id}/submit"
    description: "Submits an ELEMENTS_VERIFIED version into review. Creates a ReviewRoute plus its four ReviewTask rows and immediately opens stage 1."
    roles: [PackagingCoordinator]
    code: 200
    input: ["submit_note?"]
    output: ArtworkVersion
    side_effects: ["increment route_count by 1", "ReviewRoute created (PENDING, then IN_PROGRESS in the same request) with the frozen three-stage stage_plan", "four ReviewTask rows created; the two stage-1 rows get is_active true", "state ELEMENTS_VERIFIED -> IN_REVIEW", "increment ArtworkVersion.version by 1"]
  - method: POST
    path: "/artwork-versions/{id}/release-to-print"
    description: "Releases an APPROVED version to print. Requires requires_reverification false, every pinned claim still inside its clearance window, and at least one PROOF_APPROVED PrinterProof."
    roles: [PackagingCoordinator]
    code: 200
    input: ["release_note?"]
    output: ArtworkVersion
    side_effects: ["state APPROVED -> RELEASED_TO_PRINT", "released_at set to the current logical clock", "increment ArtworkVersion.version by 1"]

  # ---- ElementCheck ------------------------------------------------------
  - method: GET
    path: "/element-checks/{id}"
    description: "Reads one mandatory-element verdict row including its deduction_points and check_run_no."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: ElementCheck
    side_effects: []
  - method: GET
    path: "/element-checks"
    description: "Lists element checks in ELEMENT_ORDER. Reverse-reachability list for ArtworkVersion.id (artwork_version_id)."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["artwork_version_id?", "check_run_no?", "result?", "limit?", "offset?"]
    output: ElementCheck[]
    side_effects: []
  - method: POST
    path: "/element-checks/{id}/waiver"
    description: "Regulatory waiver of a FAILED mandatory-element verdict. Halves the row's deduction rather than clearing it, so the compliance score still carries the residue."
    roles: [RegulatoryReviewer]
    code: 200
    input: [waiver_justification]
    output: ElementCheck
    side_effects: ["result FAIL -> WAIVED, waived_by_user_id and waiver_justification stored", "deduction_points halved to ELEMENT_SEVERITY_WEIGHT[severity] * WAIVED_WEIGHT_FACTOR", "owning ArtworkVersion.compliance_score, failed_element_count and waived_element_count recomputed by mandatory_element_compliance_score", "increment ElementCheck.version and ArtworkVersion.version by 1 each"]

  # ---- ReviewRoute / ReviewTask ------------------------------------------
  - method: GET
    path: "/review-routes/{id}"
    description: "Reads one routing pass including current_stage_no, stage_plan and conditional_count."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: ReviewRoute
    side_effects: []
  - method: GET
    path: "/review-routes"
    description: "Lists routing passes, route_no ASC. Reverse-reachability list for ArtworkVersion.id (artwork_version_id)."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["artwork_version_id?", "status?", "limit?", "offset?"]
    output: ReviewRoute[]
    side_effects: []
  - method: GET
    path: "/review-tasks/{id}"
    description: "Reads one review task including discipline, mode, stage_no, is_active and decision."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: ReviewTask
    side_effects: []
  - method: GET
    path: "/review-tasks"
    description: "Lists review tasks, stage_no ASC then created_at ASC. Reverse-reachability list for ReviewRoute.id (review_route_id); this is the only discovery channel for the cascade-created tasks."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["review_route_id?", "discipline?", "stage_no?", "decision?", "limit?", "offset?"]
    output: ReviewTask[]
    side_effects: []
  - method: POST
    path: "/review-tasks/{id}/decision"
    description: "Records a reviewer verdict on an active task. The acting role must equal the task's discipline binding, and segregation of duties forbids both the version's author and any user who already decided a sibling task on the same route. decision is one of APPROVED, REJECTED, CONDITIONAL."
    roles: [BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer]
    code: 200
    input: [decision, "comment?", "condition_code?"]
    output: ReviewTask
    side_effects: ["decision, decided_by_user_id and decided_at recorded", "CONDITIONAL appends condition_code to ArtworkVersion.open_condition_codes and bumps ReviewRoute.conditional_count", "route_stage_resolution re-derived: the route advances a stage, completes APPROVED, or completes REJECTED (skipping every PENDING sibling)", "on COMPLETE_APPROVED the version transitions IN_REVIEW -> APPROVED, pins its claim snapshot, and the asset/prior-version/plate-order obsolescence cascade fires", "on COMPLETE_REJECTED the version transitions IN_REVIEW -> REVISION_REQUESTED and revision_cycle_count increments", "increment ReviewTask.version by 1 (and the version/route/asset versions touched by the cascade)"]

  # ---- Printer ----------------------------------------------------------
  - method: POST
    path: "/printers"
    description: "Onboards a print vendor with its colour standard, certified substrates and contractual recovery liability cap."
    roles: [PlatformAdmin]
    code: 201
    input: [name, color_standard, certified_substrates, recovery_liability_cap_cents]
    output: Printer
    side_effects: ["Printer created CERTIFIED with performance_score 100.0, recovery_balance_cents 0, escape_count 0, version 1"]
  - method: GET
    path: "/printers/{id}"
    description: "Reads one printer including certification_status, performance_score and the recovery ledger."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: Printer
    side_effects: []
  - method: GET
    path: "/printers"
    description: "Lists printers, name ASC, filterable by certification_status."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["certification_status?", "limit?", "offset?"]
    output: Printer[]
    side_effects: []

  # ---- PrinterProof -----------------------------------------------------
  - method: POST
    path: "/printer-proofs"
    description: "The print vendor submits a proof for an APPROVED or RELEASED_TO_PRINT version. press_check_required is fixed at creation (true when the asset is brand-critical or the substrate is FILM) and initialises the press-check dimension to PRESS_CHECK_REQUIRED, otherwise NOT_REQUIRED."
    roles: [PrinterRep]
    code: 201
    input: [artwork_version_id, printer_id, substrate_code, "proof_note?"]
    output: PrinterProof
    side_effects: ["PrinterProof created with proof_no = count of existing proofs of the version + 1", "color_status COLOR_PENDING, substrate_status SUBSTRATE_PENDING, proof_state PROOF_IN_REVIEW", "press_check_required and press_check_status computed", "effective_tolerance computed by proof_color_tolerance_verdict from the printer's colour standard, the substrate and the asset's brand_critical_color flag"]
  - method: GET
    path: "/printer-proofs/{id}"
    description: "Reads one proof including all three dimension statuses, the derived proof_state, effective_tolerance and requires_recheck."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: PrinterProof
    side_effects: []
  - method: GET
    path: "/printer-proofs"
    description: "Lists printer proofs, proof_no ASC. Reverse-reachability list for ArtworkVersion.id (artwork_version_id) and Printer.id (printer_id)."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["artwork_version_id?", "printer_id?", "proof_state?", "requires_recheck?", "limit?", "offset?"]
    output: PrinterProof[]
    side_effects: []
  - method: POST
    path: "/printer-proofs/{id}/color-decision"
    description: "Records the measured maximum delta-E and resolves the colour dimension. The comparison against effective_tolerance is inclusive, so a measurement exactly equal to the tolerance is a COLOR_PASS."
    roles: [QualityReviewer]
    code: 200
    input: [measured_delta_e_max]
    output: PrinterProof
    side_effects: ["measured_delta_e_max stored; color_status set to COLOR_PASS or COLOR_FAIL by proof_color_tolerance_verdict", "proof_state re-derived by proof_state_resolution", "increment PrinterProof.version by 1"]
  - method: POST
    path: "/printer-proofs/{id}/substrate-decision"
    description: "Resolves the substrate dimension independently of colour and of the press-check track. decision is one of SUBSTRATE_APPROVED, SUBSTRATE_REJECTED."
    roles: [QualityReviewer]
    code: 200
    input: [decision]
    output: PrinterProof
    side_effects: ["substrate_status set to SUBSTRATE_APPROVED or SUBSTRATE_REJECTED", "proof_state re-derived by proof_state_resolution", "increment PrinterProof.version by 1"]
  - method: POST
    path: "/printer-proofs/{id}/press-check"
    description: "Books (and optionally records attendance at) a press check on a named press line. The half-open window is widened by PRESS_CHECK_BUFFER_MINUTES (120) on both sides and must not overlap any other SCHEDULED or ATTENDED window on the same (printer_id, press_line_code). Omitting attended_by_user_id leaves the track at PRESS_CHECK_SCHEDULED."
    roles: [QualityReviewer]
    code: 200
    input: [press_line_code, press_check_start_utc, press_check_end_utc, "attended_by_user_id?"]
    output: PrinterProof
    side_effects: ["press_line_code and the window stored", "press_check_status set to PRESS_CHECK_ATTENDED when attended_by_user_id is supplied, else PRESS_CHECK_SCHEDULED", "proof_state re-derived by proof_state_resolution", "increment PrinterProof.version by 1"]

  # ---- PlateOrder -------------------------------------------------------
  - method: POST
    path: "/plate-orders"
    description: "Orders a plate set against a PROOF_APPROVED proof of the same version and printer. Cost is the marginal tier ladder plus a size-dependent setup fee plus an optional expedite surcharge, and is charged to the asset's committed_plate_cost_cents ledger."
    roles: [PackagingCoordinator]
    code: 201
    input: [artwork_version_id, printer_id, printer_proof_id, plate_set_count, "expedite?"]
    output: PlateOrder
    side_effects: ["plate_subtotal_cents, setup_fee_cents, expedite_fee_cents and cost_cents computed by plate_order_cost", "PlateOrder created with status ORDERED", "credit ArtworkAsset.committed_plate_cost_cents by cost_cents and increment ArtworkAsset.version by 1"]
  - method: GET
    path: "/plate-orders/{id}"
    description: "Reads one plate order including its cost breakdown and cancellation metadata."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: PlateOrder
    side_effects: []
  - method: GET
    path: "/plate-orders"
    description: "Lists plate orders, created_at ASC. Reverse-reachability list for ArtworkVersion.id (artwork_version_id), Printer.id (printer_id) and PrinterProof.id (printer_proof_id); the only discovery channel for orders auto-cancelled by the obsolescence cascade."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["artwork_version_id?", "printer_id?", "printer_proof_id?", "status?", "auto_cancelled?", "limit?", "offset?"]
    output: PlateOrder[]
    side_effects: []
  - method: POST
    path: "/plate-orders/{id}/cancel"
    description: "Cancels an ORDERED plate set. Compensating action: the asset ledger is debited by exactly the order's stored cost_cents; cost_cents itself is never rewritten."
    roles: [PackagingCoordinator]
    code: 200
    input: [cancel_reason]
    output: PlateOrder
    side_effects: ["status ORDERED -> CANCELLED with auto_cancelled false, cancel_reason and cancelled_at stored", "debit ArtworkAsset.committed_plate_cost_cents by exactly cost_cents and increment ArtworkAsset.version by 1", "increment PlateOrder.version by 1"]

  # ---- InventoryRunout --------------------------------------------------
  - method: POST
    path: "/inventory-runouts"
    description: "Opens runout coordination for an OBSOLETE_PENDING version's printed stock. Computes the FORWARD_LOOKING projection immediately; an on_hand_qty of exactly 0 resolves the runout to RUNOUT_COMPLETE inside this request and completes the obsolescence cascade."
    roles: [PackagingCoordinator]
    code: 201
    input: [artwork_asset_id, obsolete_version_id, on_hand_qty, weekly_usage_qty, runout_start_utc]
    output: InventoryRunout
    side_effects: ["InventoryRunout created in PLANNED with empty depletion_records and remaining_qty = on_hand_qty", "projected_runout_date computed by the FORWARD_LOOKING variant of runout_projection", "when on_hand_qty == 0: state PLANNED -> RUNOUT_COMPLETE, disposition RUNOUT, actual_runout_date = projected_runout_date, and the version OBSOLETE_PENDING -> OBSOLETE plus asset SUPERSEDE_PENDING -> SUPERSEDED cascade fires"]
  - method: GET
    path: "/inventory-runouts/{id}"
    description: "Reads one runout including both projection variants, remaining_qty, trailing_avg_usage_qty and the changeover cost breakdown."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: InventoryRunout
    side_effects: []
  - method: GET
    path: "/inventory-runouts"
    description: "Lists inventory runouts, created_at ASC. Reverse-reachability list for ArtworkAsset.id (artwork_asset_id) and ArtworkVersion.id (obsolete_version_id)."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["artwork_asset_id?", "obsolete_version_id?", "state?", "disposition?", "limit?", "offset?"]
    output: InventoryRunout[]
    side_effects: []
  - method: POST
    path: "/inventory-runouts/{id}/depletion-records"
    description: "Appends one or more weekly actuals. week_start_utc values must be strictly ascending within the batch and strictly greater than every stored record, so the array is replayed in a single deterministic chronological order. records is an array of { week_start_utc, units_consumed } objects with at least one entry."
    roles: [PackagingCoordinator]
    code: 200
    input: [records]
    output: InventoryRunout
    side_effects: ["records appended to depletion_records", "remaining_qty, trailing_avg_usage_qty and actual_runout_date recomputed by the CHRONOLOGICAL variant of runout_projection (projected_runout_date is never revised)", "state PLANNED -> MONITORING on the first append", "increment InventoryRunout.version by 1"]
  - method: POST
    path: "/inventory-runouts/{id}/disposition"
    description: "Dispositions the residual stock. RUNOUT requires remaining_qty == 0; SCRAP requires units_scrapped + units_reworked == remaining_qty exactly and computes the changeover write-off."
    roles: [PackagingCoordinator]
    code: 200
    input: [disposition, "units_scrapped?", "units_reworked?"]
    output: InventoryRunout
    side_effects: ["state -> RUNOUT_COMPLETE (RUNOUT) or SCRAPPED (SCRAP)", "on SCRAP: material_writeoff_cents, relabel_cost_cents, changeover_base_cents, changeover_expedite_cents and total_changeover_cost_cents computed by changeover_writeoff_cost", "on SCRAP: credit ArtworkAsset.obsolete_units_total by units_scrapped and ArtworkAsset.changeover_cost_committed_cents by total_changeover_cost_cents", "the obsolete version transitions OBSOLETE_PENDING -> OBSOLETE and the asset SUPERSEDE_PENDING -> SUPERSEDED", "increment InventoryRunout.version and ArtworkAsset.version by 1 each"]
  - method: POST
    path: "/inventory-runouts/{id}/disposition-reversal"
    description: "Reverses a SCRAPPED disposition. Compensating action: both asset ledgers are debited by exactly the amounts the disposition credited, the runout returns to MONITORING, and the obsolescence cascade is unwound one step (version OBSOLETE -> OBSOLETE_PENDING, asset SUPERSEDED -> SUPERSEDE_PENDING). on_hand_qty and depletion_records are never rewritten, so on_hand_qty == remaining_qty + sum(depletion_records[].units_consumed) holds before and after."
    roles: [PlatformAdmin]
    code: 200
    input: [reversal_reason]
    output: InventoryRunout
    side_effects: ["debit ArtworkAsset.obsolete_units_total by exactly units_scrapped and ArtworkAsset.changeover_cost_committed_cents by exactly total_changeover_cost_cents", "disposition cleared to null, units_scrapped and units_reworked reset to 0, every changeover money field reset to 0, reversal_count incremented", "state SCRAPPED -> MONITORING", "version OBSOLETE -> OBSOLETE_PENDING with obsoleted_at cleared; asset SUPERSEDED -> SUPERSEDE_PENDING", "increment InventoryRunout.version, ArtworkVersion.version and ArtworkAsset.version by 1 each"]

  # ---- ErrorEscape ------------------------------------------------------
  - method: POST
    path: "/error-escapes"
    description: "Opens an error-escape investigation against a printed version and the printer that produced it. The investigation fee is fixed by discovered_stage at creation."
    roles: [QualityReviewer]
    code: 201
    input: [artwork_version_id, printer_id, defect_code, discovered_stage, units_affected, "discovery_note?"]
    output: ErrorEscape
    side_effects: ["ErrorEscape created in OPEN with investigation_fee_cents from LATE/EARLY discovery stage", "Printer.escape_count recomputed and Printer.version incremented by 1"]
  - method: GET
    path: "/error-escapes/{id}"
    description: "Reads one escape including apportionment, both recovery variants, the variance and the cap flag."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: []
    output: ErrorEscape
    side_effects: []
  - method: GET
    path: "/error-escapes"
    description: "Lists error escapes, created_at ASC. Reverse-reachability list for ArtworkVersion.id (artwork_version_id) and Printer.id (printer_id)."
    roles: [PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep, PlatformAdmin]
    code: 200
    input: ["artwork_version_id?", "printer_id?", "state?", "root_cause_party?", "limit?", "offset?"]
    output: ErrorEscape[]
    side_effects: []
  - method: POST
    path: "/error-escapes/{id}/root-cause"
    description: "Records (or, from DISPUTED, revises) the root-cause apportionment. printer_share_pct must be consistent with root_cause_party."
    roles: [QualityReviewer]
    code: 200
    input: [root_cause_party, printer_share_pct, investigation_note]
    output: ErrorEscape
    side_effects: ["root_cause_party, printer_share_pct and investigation_note stored", "state OPEN -> ROOT_CAUSE_ASSIGNED, or DISPUTED -> ROOT_CAUSE_ASSIGNED with provisional_recovery_cents and liability_cap_applied cleared", "increment ErrorEscape.version by 1"]
  - method: POST
    path: "/error-escapes/{id}/recovery-claim"
    description: "Raises the provisional recovery claim against the printer. OCC-guarded on the escape itself: expected_error_escape_version must equal the escape's current version, because a revised apportionment legitimately supersedes the prior claim basis."
    roles: [QualityReviewer]
    code: 200
    input: [expected_error_escape_version]
    output: ErrorEscape
    side_effects: ["provisional_recovery_cents computed by the PROVISIONAL variant of cost_recovery_amount and clamped to Printer.recovery_liability_cap_cents", "liability_cap_applied set when the clamp bound", "state ROOT_CAUSE_ASSIGNED -> RECOVERY_CLAIMED", "increment ErrorEscape.version by 1"]
  - method: POST
    path: "/error-escapes/{id}/dispute"
    description: "The printer disputes a raised claim, returning the escape to apportionment. Only the printer named on the escape may call this."
    roles: [PrinterRep]
    code: 200
    input: [dispute_reason]
    output: ErrorEscape
    side_effects: ["dispute_reason stored and dispute_count incremented", "state RECOVERY_CLAIMED -> DISPUTED", "increment ErrorEscape.version by 1"]
  - method: POST
    path: "/error-escapes/{id}/settle"
    description: "Settles or writes off the escape. A SETTLED resolution requires the three actual invoice amounts, computes the FINAL recovery variant, posts it to the printer ledger and applies the vendor scorecard penalty; WRITTEN_OFF recovers nothing and leaves the scorecard untouched."
    roles: [PlatformAdmin]
    code: 200
    input: [resolution, "actual_reprint_cost_cents?", "actual_scrap_cost_cents?", "actual_expedite_freight_cents?", "settlement_note?"]
    output: ErrorEscape
    side_effects: ["on SETTLED: the three actuals stored, final_recovery_cents computed by the FINAL variant of cost_recovery_amount, recovery_variance_cents = final - provisional", "on SETTLED: credit Printer.recovery_balance_cents by final_recovery_cents and subtract performance_penalty_points (from printer_performance_penalty) from Printer.performance_score", "on SETTLED: Printer CERTIFIED -> PROBATION when the new performance_score < PRINTER_PROBATION_SCORE, which in turn sets requires_recheck = true on every PrinterProof of that printer whose proof_state != PROOF_APPROVED", "on WRITTEN_OFF: final_recovery_cents 0, recovery_variance_cents = 0 - provisional_recovery_cents, printer ledger and scorecard untouched", "state -> SETTLED or WRITTEN_OFF with settled_at and resolution stored", "increment ErrorEscape.version by 1 (and Printer.version plus each touched PrinterProof.version on SETTLED)"]

# =============================================================================
# §1.6 Error Code Catalog (one entry per §1.4 row, same order)
# =============================================================================
errors:

  # ---- authentication / authorization ----
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the seven roles in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles, or a reviewer role does not match the ReviewTask.discipline binding (BRAND->BrandReviewer, LEGAL->LegalReviewer, REGULATORY->RegulatoryReviewer, QUALITY->QualityReviewer)"
  - id: ERR_PRINTER_IDENTITY_MISMATCH
    http: 403
    condition: "X-User-Role == PrinterRep but X-User-ID differs from the printer_id of the proof being submitted or the escape being disputed"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the deciding X-User-ID authored the routed ArtworkVersion, or already decided another ReviewTask on the same ReviewRoute"

  # ---- existence ----
  - id: ERR_BRIEF_NOT_FOUND
    http: 404
    condition: "no Brief row for the supplied brief id"
  - id: ERR_MARKETING_CLAIM_NOT_FOUND
    http: 404
    condition: "no MarketingClaim row for a supplied claim id (path or claim_ids entry)"
  - id: ERR_ARTWORK_ASSET_NOT_FOUND
    http: 404
    condition: "no ArtworkAsset row for the supplied artwork asset id"
  - id: ERR_ARTWORK_VERSION_NOT_FOUND
    http: 404
    condition: "no ArtworkVersion row for a supplied version id (path, artwork_version_id, supersedes_version_id, obsolete_version_id or current_approved_version_id)"
  - id: ERR_ELEMENT_CHECK_NOT_FOUND
    http: 404
    condition: "no ElementCheck row for the supplied element check id"
  - id: ERR_REVIEW_ROUTE_NOT_FOUND
    http: 404
    condition: "no ReviewRoute row for the supplied route id"
  - id: ERR_REVIEW_TASK_NOT_FOUND
    http: 404
    condition: "no ReviewTask row for the supplied task id"
  - id: ERR_PRINTER_NOT_FOUND
    http: 404
    condition: "no Printer row for the supplied printer id"
  - id: ERR_PRINTER_PROOF_NOT_FOUND
    http: 404
    condition: "no PrinterProof row for the supplied proof id"
  - id: ERR_PLATE_ORDER_NOT_FOUND
    http: 404
    condition: "no PlateOrder row for the supplied plate order id"
  - id: ERR_INVENTORY_RUNOUT_NOT_FOUND
    http: 404
    condition: "no InventoryRunout row for the supplied runout id"
  - id: ERR_ERROR_ESCAPE_NOT_FOUND
    http: 404
    condition: "no ErrorEscape row for the supplied escape id"

  # ---- request schema and uniqueness ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is absent, an enum value is not a declared member, a numeric/array/string constraint from §1.1 is violated, a datetime does not parse, an unknown field is supplied, or an endpoint-specific conditional field is missing (comment on REJECTED, condition_code on CONDITIONAL, cancel_reason on cancel, the three actuals on a SETTLED settlement, units_scrapped/units_reworked on a SCRAP disposition, end strictly after start on a press-check or clearance window)"
  - id: ERR_DUPLICATE_SKU_CODE
    http: 409
    condition: "another Brief already carries the supplied sku_code"
  - id: ERR_DUPLICATE_PRINTER_NAME
    http: 409
    condition: "another Printer already carries the supplied name"
  - id: ERR_DUPLICATE_ASSET_VARIANT
    http: 409
    condition: "another ArtworkAsset already exists for the same (brief_id, market_code, component_type) triple"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_ASSET_VERSION
    http: 412
    condition: "expected_artwork_asset_version does not equal the ArtworkAsset's current version at POST /artwork-assets/{id}/versions"
  - id: ERR_STALE_ESCAPE_VERSION
    http: 412
    condition: "expected_error_escape_version does not equal the ErrorEscape's current version at POST /error-escapes/{id}/recovery-claim"

  # ---- state preconditions ----
  - id: ERR_BRIEF_STATE_INVALID
    http: 409
    condition: "a brief edit or approve/reject decision was attempted on a Brief whose status is not DRAFT"
  - id: ERR_VERSION_STATE_INVALID
    http: 409
    condition: "the referenced ArtworkVersion is not in a state the called operation admits (see validations[priority=24]), or its owning asset is already SUPERSEDED"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "a clearance decision was attempted on a MarketingClaim whose legal_status is REJECTED"
  - id: ERR_ELEMENT_CHECK_NOT_FAILED
    http: 409
    condition: "a waiver was attempted on an ElementCheck whose result is not FAIL, or on a row belonging to a superseded check run"
  - id: ERR_ROUTE_STAGE_NOT_ACTIVE
    http: 409
    condition: "the ReviewTask's stage is not the route's current_stage_no, is_active is false, or the route is no longer IN_PROGRESS"
  - id: ERR_TASK_ALREADY_DECIDED
    http: 409
    condition: "the ReviewTask's decision is not PENDING"
  - id: ERR_PROOF_STATE_INVALID
    http: 409
    condition: "a dimension write was attempted on a PrinterProof whose proof_state is PROOF_APPROVED or PROOF_REJECTED"
  - id: ERR_PROOF_DIMENSION_ALREADY_DECIDED
    http: 409
    condition: "a colour decision on a proof whose color_status is not COLOR_PENDING, or a substrate decision on a proof whose substrate_status is not SUBSTRATE_PENDING"
  - id: ERR_PRESS_CHECK_NOT_REQUIRED
    http: 409
    condition: "a press-check write on a proof whose press_check_status is NOT_REQUIRED or already PRESS_CHECK_ATTENDED"
  - id: ERR_PLATE_ORDER_NOT_CANCELLABLE
    http: 409
    condition: "a cancel was attempted on a PlateOrder whose status is already CANCELLED"
  - id: ERR_RUNOUT_STATE_INVALID
    http: 409
    condition: "depletion records or a disposition were attempted on a runout that is not PLANNED or MONITORING, or a reversal on a runout that is not SCRAPPED"
  - id: ERR_ESCAPE_STATE_INVALID
    http: 409
    condition: "the escape operation does not match the escape's state (root-cause needs OPEN or DISPUTED, recovery-claim needs ROOT_CAUSE_ASSIGNED, dispute needs RECOVERY_CLAIMED, settle needs RECOVERY_CLAIMED or DISPUTED)"
  - id: ERR_BRIEF_NOT_APPROVED
    http: 409
    condition: "submit was attempted while the owning Brief's status is DRAFT or REJECTED"

  # ---- regulatory / compliance safety ----
  - id: ERR_MANDATORY_ELEMENT_FAILED
    http: 422
    condition: "submit was attempted while at least one ElementCheck row of the current check_run_no has result FAIL"
  - id: ERR_COMPLIANCE_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "submit was attempted while ArtworkVersion.compliance_score is strictly below COMPLIANCE_SCORE_FLOOR (70.0)"
  - id: ERR_CLAIM_NOT_CLEARED
    http: 422
    condition: "submit was attempted while a claim_ids entry resolves to a MarketingClaim whose legal_status is DRAFT or REJECTED"
  - id: ERR_CLAIM_CLEARANCE_EXPIRED
    http: 422
    condition: "at submit the logical clock is outside a claim's half-open [cleared_from_utc, cleared_until_utc) window, or at release-to-print a pinned_claim_snapshot entry's cleared_until_utc is at or before the logical clock"
  - id: ERR_REVERIFICATION_REQUIRED
    http: 422
    condition: "release-to-print was attempted while ArtworkVersion.requires_reverification is true (an approval carried at least one CONDITIONAL decision)"
  - id: ERR_REVISION_CYCLE_CAP_EXCEEDED
    http: 422
    condition: "submit or revise was attempted while ArtworkVersion.revision_cycle_count has reached REVISION_CYCLE_CAP (3)"

  # ---- referential coherence ----
  - id: ERR_MARKET_CODE_NOT_IN_BRIEF
    http: 422
    condition: "ArtworkAsset.market_code is not a member of the parent Brief.market_codes"
  - id: ERR_LANGUAGE_CODE_NOT_IN_BRIEF
    http: 422
    condition: "an ArtworkAsset.language_codes entry is not a member of the parent Brief.language_codes"
  - id: ERR_CLAIM_MARKET_MISMATCH
    http: 422
    condition: "a claim referenced by claim_ids has a market_code different from the owning ArtworkAsset.market_code"
  - id: ERR_SUPERSEDES_VERSION_MISMATCH
    http: 422
    condition: "supersedes_version_id names a version belonging to a different ArtworkAsset"
  - id: ERR_PROOF_VERSION_MISMATCH
    http: 422
    condition: "the plate order's printer_proof_id names a proof whose artwork_version_id or printer_id differs from the order's own"

  # ---- constraint satisfaction ----
  - id: ERR_SUBSTRATE_NOT_CERTIFIED
    http: 422
    condition: "the proof's substrate_code is not a member of Printer.certified_substrates"
  - id: ERR_PRINTER_ON_PROBATION
    http: 422
    condition: "a proof submission or plate order names a Printer whose certification_status is PROBATION"
  - id: ERR_PROOF_NOT_APPROVED
    http: 422
    condition: "the plate order's referenced proof is not PROOF_APPROVED, or release-to-print found no PROOF_APPROVED proof for the version"
  - id: ERR_SHARE_INCONSISTENT_WITH_PARTY
    http: 422
    condition: "printer_share_pct contradicts root_cause_party (not 1.00 for PRINTER, not 0.00 for BRAND or AGENCY, not strictly inside (0.00, 1.00) for SHARED)"
  - id: ERR_UNIT_CONSERVATION_VIOLATION
    http: 422
    condition: "a SCRAP disposition where units_scrapped + units_reworked != remaining_qty, or a RUNOUT disposition where remaining_qty != 0"

  # ---- temporal conflicts ----
  - id: ERR_PRESS_CHECK_OVERLAP
    http: 409
    condition: "the buffer-widened press-check window collides with another SCHEDULED or ATTENDED window on the same (printer_id, press_line_code)"
  - id: ERR_CLAIM_CLEARANCE_OVERLAP
    http: 409
    condition: "the requested clearance interval overlaps that of another CLEARED MarketingClaim with the same (claim_code, market_code)"
  - id: ERR_DEPLETION_RECORD_OUT_OF_ORDER
    http: 409
    condition: "a submitted week_start_utc is not strictly greater than the previous submitted record's, or not strictly greater than every stored record's"

  # ---- fiscal ceilings ----
  - id: ERR_PLATE_BUDGET_EXCEEDED
    http: 422
    condition: "committed_plate_cost_cents + the new order's cost_cents exceeds ArtworkAsset.plate_budget_cents"
  - id: ERR_RECOVERY_EXCEEDS_LIABILITY_CAP
    http: 422
    condition: "the FINAL recovery variant's pre-clamp gross_recoverable exceeds Printer.recovery_liability_cap_cents at settlement"

# =============================================================================
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: PackagingCoordinator
    description: "Owns the artwork pipeline: briefs, claim registration, assets, versions, element verification, submission, release, plate ordering and runout coordination."
    identity: opaque
    exclusive_operations:
      - "POST /briefs"
      - "PATCH /briefs/{id}"
      - "POST /marketing-claims"
      - "POST /artwork-assets"
      - "POST /artwork-assets/{id}/versions"
      - "PATCH /artwork-versions/{id}"
      - "POST /artwork-versions/{id}/verify-elements"
      - "POST /artwork-versions/{id}/revise"
      - "POST /artwork-versions/{id}/submit"
      - "POST /artwork-versions/{id}/release-to-print"
      - "POST /plate-orders"
      - "POST /plate-orders/{id}/cancel"
      - "POST /inventory-runouts"
      - "POST /inventory-runouts/{id}/depletion-records"
      - "POST /inventory-runouts/{id}/disposition"
    shared_operations:
      - "every GET endpoint"
    note: "The X-User-ID that creates a version is stored as ArtworkVersion.author_user_id and is barred from deciding any ReviewTask on that version's routes."

  - name: BrandReviewer
    description: "Decides BRAND-discipline review tasks (stage 1, parallel with REGULATORY)."
    identity: opaque
    exclusive_operations:
      - "POST /review-tasks/{id}/decision on a task whose discipline == BRAND"
    shared_operations:
      - "POST /review-tasks/{id}/decision (the endpoint itself is shared across the four reviewer roles; the discipline binding is what makes each decision exclusive)"
      - "every GET endpoint"

  - name: LegalReviewer
    description: "Clears or rejects marketing claims and decides LEGAL-discipline review tasks (stage 2)."
    identity: opaque
    exclusive_operations:
      - "POST /marketing-claims/{id}/clearance"
      - "POST /review-tasks/{id}/decision on a task whose discipline == LEGAL"
    shared_operations:
      - "POST /review-tasks/{id}/decision"
      - "every GET endpoint"

  - name: RegulatoryReviewer
    description: "Approves or rejects briefs, waives failed mandatory-element verdicts, and decides REGULATORY-discipline review tasks (stage 1)."
    identity: opaque
    exclusive_operations:
      - "POST /briefs/{id}/decision"
      - "POST /element-checks/{id}/waiver"
      - "POST /review-tasks/{id}/decision on a task whose discipline == REGULATORY"
    shared_operations:
      - "POST /review-tasks/{id}/decision"
      - "every GET endpoint"

  - name: QualityReviewer
    description: "Owns proof verdicts (colour, substrate, press-check attendance), opens error escapes, assigns root cause and raises recovery claims, and decides QUALITY-discipline review tasks (stage 3)."
    identity: opaque
    exclusive_operations:
      - "POST /printer-proofs/{id}/color-decision"
      - "POST /printer-proofs/{id}/substrate-decision"
      - "POST /printer-proofs/{id}/press-check"
      - "POST /error-escapes"
      - "POST /error-escapes/{id}/root-cause"
      - "POST /error-escapes/{id}/recovery-claim"
      - "POST /review-tasks/{id}/decision on a task whose discipline == QUALITY"
    shared_operations:
      - "POST /review-tasks/{id}/decision"
      - "every GET endpoint"

  - name: PrinterRep
    description: "Acts on behalf of one print vendor: submits proofs and disputes recovery claims raised against that vendor."
    identity: "entity_backed:Printer"
    exclusive_operations:
      - "POST /printer-proofs"
      - "POST /error-escapes/{id}/dispute"
    shared_operations:
      - "every GET endpoint"
    note: "X-User-ID MUST equal the id of a Printer row; the server compares it against PrinterProof.printer_id at proof submission and ErrorEscape.printer_id at dispute."

  - name: PlatformAdmin
    description: "Operational role: onboards printers, settles or writes off escapes, reverses scrap dispositions and controls the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /printers"
      - "POST /error-escapes/{id}/settle"
      - "POST /inventory-runouts/{id}/disposition-reversal"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
    note: "PlatformAdmin is NOT a hierarchical override: it cannot create briefs, decide review tasks, waive element checks or submit proofs."
