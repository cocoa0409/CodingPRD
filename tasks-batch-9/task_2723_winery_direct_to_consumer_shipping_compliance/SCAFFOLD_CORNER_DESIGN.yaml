      - name: a_second_enrollment_for_the_same_program_supersedes_the_first
        claim_type: cross_entity
        grounds:
          - state_machines.CarrierEnrollment.APPROVED_to_SUSPENDED
          - concurrency_rules.expected_winery_version
          - endpoints.POST_/dtc/carrier-enrollments
        distinguishing_aspect: |
          Creating a second enrollment for the same (winery_id, carrier_program_id) is a system
          supersede: the incumbent APPROVED row is pushed to SUSPENDED so at most one approved enrollment per
          pair survives, and the winery's version increments because the cascade touched it. The new row starts
          PENDING, so immediately after the supersede the winery has NO approved enrollment at all.
        test_recipe:
