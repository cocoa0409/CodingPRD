              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-09-01T14:30:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
          trigger:
            - call: "POST /seasons"
              payload: { label: "S2", start_date: "2026-09-01", end_date: "2026-12-01", multiplier_bps: 11200 }
              as: OpsAdmin
              captures: { s2: $.data.id }
            - call: "POST /seasons"
              payload: { label: "S3", start_date: "2026-08-31", end_date: "2026-10-01", multiplier_bps: 10000 }
              as: OpsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { per_seat: $.data.quoted_per_seat_cents, season_ref: $.data.season_id }
          assert:
            - "S2 created (adjacent start == S1 end is legal under half-open semantics) — captured s2 is a UUID"
            - "trigger capture err == ERR_SEASON_OVERLAP (one-day-early start collides with S1)"
            - "trigger capture per_seat == 28000 and season_ref == ${s2} (2026-09-01 belongs to S2 at 11200 bps: round_half_up(25000*1.12); S1's end_date is exclusive)"

      - name: aircraft_turn_buffer_vs_pilot_adjacency_semantics
        grounds:
          - calculations.turn_window
          - validations[priority=20]
          - validations[priority=21]
          - errors[ERR_AIRCRAFT_TURN_CONFLICT]
        distinguishing_aspect: |
          Different interval semantics on a different resource (Aircraft vs Season): the
          aircraft occupation is BUFFER-EXTENDED half-open [dep, arr + 15) so an 08:40
          departure after an 08:25 arrival is legal but 08:39 is not, while the pilot
          occupation is PLAIN half-open [dep, arr) so the same pilot may depart at exactly
          08:25 on another aircraft.
        test_recipe:
          setup:
            - "Route R1 SHORT 25 min (turn 15); aircraft A1, A2; pilots P1, P2"
            - "F1: A1 + P1 dep 2026-08-03T08:00:00Z, arrival 08:25"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { a1: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N2", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { a2: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { p1: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat Two", certificate_no: "C2" }
              as: OpsAdmin
              captures: { p2: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${a1}", pilot_id: "${p1}", scheduled_departure_utc: "2026-08-03T08:00:00Z" }
              as: Dispatcher
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${a1}", pilot_id: "${p2}", scheduled_departure_utc: "2026-08-03T08:39:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${a1}", pilot_id: "${p2}", scheduled_departure_utc: "2026-08-03T08:40:00Z" }
              as: Dispatcher
              captures: { f2: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${a2}", pilot_id: "${p1}", scheduled_departure_utc: "2026-08-03T08:25:00Z" }
              as: Dispatcher
              captures: { f3: $.data.id }
          assert:
            - "trigger capture err == ERR_AIRCRAFT_TURN_CONFLICT (08:39 < 08:25 + 15 min buffer)"
            - "A1 departure at exactly 08:40 succeeded — captured f2 is a UUID (buffer-extended half-open end is allowed)"
            - "P1 departing on A2 at exactly 08:25 (== F1 arrival) succeeded — captured f3 is a UUID (plain half-open pilot semantics, no buffer)"

  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_across_hold_and_cancel
        grounds:
          - entities.Flight.fields.seats_booked
          - entities.Flight.fields.seats_available
          - state_machines.Booking.HELD_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: SEAT COUNT. For every prefix of the action sequence,
          seats_booked + seats_available == aircraft.seat_capacity (4); a pair of HELD creates
          followed by their compensating cancels returns the flight to exactly (0 booked,
          4 available) with zero drift.
        test_recipe:
          setup:
            - "Flight on a 4-seat aircraft, dep 2026-08-03T14:00:00Z; no season"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - call: "GET /flights/${flight_id}"
              as: BookingAgent
              captures: { sb0: $.data.seats_booked, sa0: $.data.seats_available }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 100 }, { full_name: "P1", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { b1: $.data.id }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "B", contact_email: "b@x.com", passengers: [ { full_name: "P2", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { b2: $.data.id }
            - call: "GET /flights/${flight_id}"
              as: BookingAgent
              captures: { sb1: $.data.seats_booked, sa1: $.data.seats_available }
          trigger:
            - { call: "POST /bookings/${b2}/events", payload: { event_type: "CANCEL" }, as: BookingAgent }
            - call: "GET /flights/${flight_id}"
              as: BookingAgent
              captures: { sb2: $.data.seats_booked, sa2: $.data.seats_available }
            - { call: "POST /bookings/${b1}/events", payload: { event_type: "CANCEL" }, as: BookingAgent }
            - call: "GET /flights/${flight_id}"
              as: BookingAgent
              captures: { sb3: $.data.seats_booked, sa3: $.data.seats_available }
          assert:
            - "setup captures: (sb0, sa0) == (0, 4); (sb1, sa1) == (3, 1) after two HELD bookings — HELD consumes seats"
            - "sb0 + sa0 == 4 and sb1 + sa1 == 4 (invariant holds after the forward actions)"
            - "trigger captures: (sb2, sa2) == (2, 2) and (sb3, sa3) == (0, 4) — compensating cancels restore the conserved seat count with zero drift"

      - name: payment_conservation_across_mid_window_cancel
        grounds:
          - calculations.cancellation_settlement
          - entities.Booking.fields.paid_cents
          - entities.Booking.fields.refunded_card_cents
          - entities.Booking.fields.retained_fee_cents
          - entities.Booking.fields.credited_cents
        distinguishing_aspect: |
          Conserved quantity: PAYMENT CENTS (different quantity from seats). A cancel 1380
          minutes before departure splits paid_cents == 30000 into refunded_card 27000 +
          retained_fee 3000 + credited 0; the three buckets always sum back to the original
          payment.
        test_recipe:
          setup:
            - "Season PEAK [2026-06-01, 2026-09-01) 12000 bps; route base 25000; flight dep Tuesday 2026-08-18T11:00:00Z"
            - "Booking 1 passenger quoted 30000 and CONFIRMED at card 30000; logical clock 2026-08-17T12:00:00Z (Monday)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T12:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /seasons"
              payload: { label: "PEAK", start_date: "2026-06-01", end_date: "2026-09-01", multiplier_bps: 12000 }
              as: OpsAdmin
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-18T11:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { b1: $.data.id, quote: $.data.quoted_total_cents }
            - { call: "POST /bookings/${b1}/confirm", payload: { card_amount_cents: 30000 }, as: BookingAgent }
          trigger:
            - call: "POST /bookings/${b1}/events"
              payload: { event_type: "CANCEL" }
              as: BookingAgent
              captures: { refunded: $.data.refunded_card_cents, fee: $.data.retained_fee_cents, credited: $.data.credited_cents, paid: $.data.paid_cents, st: $.data.status }
          assert:
            - "setup capture quote == 30000 (25000 * 1.20 PEAK, base load tier, weekday)"
            - "minutes until departure at cancel == 1380 -> mid tier [120, 1440): 10% fee"
            - "trigger capture refunded == 27000 (30000 - round_half_up(30000*0.10))"
            - "trigger capture fee == 3000 and credited == 0"
            - "trigger capture paid == 30000 and refunded + fee + credited == paid (conserved to the cent)"
            - "trigger capture st == CANCELLED"
