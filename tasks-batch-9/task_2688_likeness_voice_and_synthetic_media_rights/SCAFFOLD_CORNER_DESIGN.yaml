              payload: {}
              as: LicenseeProducer
              as_user_id: "lic-001"
            - call: "GET /consent-grants/${g_id}"
              payload: {}
              as: RightsAdministrator
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
            - call: "GET /compensation-entries?consent_grant_id=${g_id}"
              payload: {}
              as: RightsAdministrator
            - call: "GET /usage-licenses?generated_performance_id=${p3_id}"
              payload: {}
              as: LicenseeProducer
              as_user_id: "lic-001"
          assert:
            - "trigger call 1 shows open_license_count 2 and r_v2 == r_v0 + 2, the settled state after two accepted issuances"
            - "trigger call 2 -> 422 with data.error_id == \"ERR_REPLICA_OVERLAP_CAP_EXCEEDED\": both live windows overlap the requested one and the cap is 2"
            - "trigger call 3 shows open_license_count still 2 and version still r_v2 — the refused write did not increment the counter it would have incremented on success, and did not bump the version either"
            - "trigger call 4 shows total_compensation_cents 1425000 = INITIAL_CREATION 300000 + three PER_USE_PROVISIONAL rows of 225000 (675000) + two PER_USE_FINAL rows of 225000 (450000), i.e. exactly the sum of the SIX surviving entries and no seventh row for the refused license"
            - "trigger call 5 shows lifetime_compensation_cents equal to that same 1425000"
            - "trigger call 6 returns 6 entries: one INITIAL_CREATION, three PER_USE_PROVISIONAL and two PER_USE_FINAL, with no REVERSAL and no orphan row from the refusal"
            - "trigger call 7 returns total_count == 0: the third performance still has no license, so the refusal was atomic across all five rows the write would have touched"
