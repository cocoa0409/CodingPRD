# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3192_baggage_handling_system_operations_bag_tracking
#
# 9 rule blocks x 2+ instances = 19 instances. Each instance is a test
# prototype the unit-test-generator transcribes verbatim; every ${var} below
# is bound by a captures: block on an earlier line of the SAME instance.
#
# Reference data chain shared by every instance (spelled out per instance so
# each is independently executable):
#   clock 2026-09-01T07:00:00Z; station SEA sorter_capacity_bags 60;
#   airline DL max_excess_weight_lb 50, excess_weight_fee_cents 7500,
#   compensation_cap_cents 300000, interline_agreement_active true;
#   make-up area MA-3 capacity_slots 2 buffer_minutes 15; lane EDS-2;
#   flight DL1423 dep 2026-09-01T15:00:00Z (open 13:00, close 14:15);
#   flight DL1788 dep 2026-09-01T17:30:00Z (open 15:30, close 16:45).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: report_reopen_restores_delivered_liability
        grounds:
          - state_machines.MishandledReport.COMPENSATED_to_REOPENED
          - state_machines.MishandledReport.DELIVERED_to_COMPENSATED
          - calculations.mishandled_final_liability
          - calculations.mishandled_compensation_offer
          - entities.Station.fields.open_liability_cents
        distinguishing_aspect: "The conservative quantity is a balance-sheet sum of REPORT-SIDE stock: reopening a COMPENSATED report must return station.open_liability_cents to exactly the value it held while the report was DELIVERED (18750), because the compensating edge resets compensation_settled_cents to 0 and the PROVISIONAL_HAIRCUT branch takes over again."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA (capacity 60) with one make-up area MA-3 (2 slots, buffer 15) and lane EDS-2"
            - "airline DL with max_excess_weight_lb 50, compensation_cap_cents 300000"
            - "flight DL1423 departs 2026-09-01T15:00:00Z; bag B1 is DELIVERED with a DAMAGED report holding compensation_offer_cents 25000"
            - "the report has an APPROVED claim and (after the setup chain) status COMPENSATED with compensation_settled_cents 18750"
            - "station SEA open_liability_cents is 0 and settled_liability_cents is 18750"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/makeup-areas"
              payload: { station_id: "${st}", code: "MA-3", capacity_slots: 2, buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ma: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { bag: $.data.id }
            - call: "POST /baggage/bags/${bag}/special-items"
              payload: { item_type: "OVERSIZE", declared_value_cents: 50000 }
              as: AcceptanceAgent
            - call: "POST /baggage/bags/${bag}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
              captures: { bag_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:40:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/bags/${bag}/assign-makeup"
              payload: { expected_bag_version: "${bag_v}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:00:00Z", makeup_interval_minutes: 120 }
              as: SortationAgent
            - call: "POST /baggage/bags/${bag}/load"
              payload: {}
              as: LoadAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T14:05:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations/${st}/run_ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /baggage/flights/${f1}/depart"
              payload: {}
              as: PlatformAdmin
            - call: "POST /baggage/bags/${bag}/deliver"
              payload: {}
              as: LoadAgent
            - call: "POST /baggage/reports"
              payload: { bag_id: "${bag}", station_id: "${st}", report_type: "DAMAGED" }
              as: BaggageServiceAgent
              captures: { rep: $.data.id, rep_v0: $.data.version }
            - call: "POST /baggage/reports/${rep}/investigate"
              payload: {}
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/arrange-delivery"
              payload: { delivery_method: "COURIER", scheduled_utc: "2026-09-01T14:00:00Z" }
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/mark-delivered"
              payload: {}
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/claims"
              payload: { requested_amount_cents: 25000 }
              as: BaggageServiceAgent
              captures: { clm: $.data.id }
            - call: "POST /baggage/claims/${clm}/decide"
              payload: { decision: "APPROVED", approved_amount_cents: 25000 }
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/compensate"
              payload: {}
              as: BaggageServiceAgent
              captures: { rep_v_compensated: $.data.version }
          trigger:
            - call: "POST /baggage/reports/${rep}/reopen"
              payload: { expected_report_version: "${rep_v_compensated}" }
              as: BaggageServiceAgent
              captures: { rep_v_reopened: $.data.version }
          assert:
            - "MishandledReport.${rep}.status == REOPENED"
            - "MishandledReport.${rep}.compensation_settled_cents == 0"
            - "MishandledReport.${rep}.approved_cents == 0"
            - "MishandledReport.${rep}.final_liability_cents == 18750"
            - "MishandledReport.${rep}.claim_status == FILED"
            - "Station.${st}.open_liability_cents == 18750 (the value it held while the report was DELIVERED)"
            - "Station.${st}.settled_liability_cents == 0"
            - "MishandledReport.${rep}.version == ${rep_v_reopened} and ${rep_v_reopened} == ${rep_v_compensated} + 1"
            - "re-settling (claim decide APPROVED at 25000 then compensate) restores final_liability_cents == 18750 and leaves open_liability_cents back at 0"

      - name: post_compensate_reopen_restores_paid_claim_charge
        grounds:
          - state_machines.MishandledReport.COMPENSATED_to_REOPENED
          - state_machines.MishandledReport.DELIVERED_to_COMPENSATED
          - calculations.handling_charge
          - entities.Bag.fields.handling_charge_cents
          - entities.Bag.fields.outage_context
        distinguishing_aspect: "The conserved quantity is a per-Bag running CHARGE total, a different kind from the report-side stock balance: the compensate-and-reopen round trip must leave the bag's total recorded charge (final_liability_cents + handling_charge_cents) at exactly 4600, the value it held before the payout, with zero drift."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with make-up area MA-3 (2 slots) and lane EDS-2; airline DL"
            - "station SEA outage declared and still active, so the excess-weight fee takes the HOLD variant (0)"
            - "flight DL1423 departs 2026-09-01T15:00:00Z; bag B1 (declared 52 lb, 20x14x16, one OVERSIZE item declared 50000) is DELIVERED at clock 13:40"
            - "bag B1 handling_charge_cents is 4600 (FINAL variant) and its DAMAGED report holds compensation_offer_cents 25000 with an APPROVED claim, status COMPENSATED, compensation_settled_cents 18750"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/makeup-areas"
              payload: { station_id: "${st}", code: "MA-3", capacity_slots: 2, buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ma: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/stations/${st}/outage"
              payload: {}
              as: PlatformAdmin
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 52, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { bag: $.data.id }
            - call: "POST /baggage/bags/${bag}/special-items"
              payload: { item_type: "OVERSIZE", declared_value_cents: 50000 }
              as: AcceptanceAgent
            - call: "POST /baggage/bags/${bag}/weigh"
              payload: { scale_weight_lb: 52.4 }
              as: AcceptanceAgent
              captures: { bag_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:40:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/bags/${bag}/assign-makeup"
              payload: { expected_bag_version: "${bag_v}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:00:00Z", makeup_interval_minutes: 120 }
              as: SortationAgent
            - call: "POST /baggage/bags/${bag}/load"
              payload: {}
              as: LoadAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T14:05:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations/${st}/run_ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /baggage/flights/${f1}/depart"
              payload: {}
              as: PlatformAdmin
            - call: "POST /baggage/bags/${bag}/deliver"
              payload: {}
              as: LoadAgent
            - call: "POST /baggage/reports"
              payload: { bag_id: "${bag}", station_id: "${st}", report_type: "DAMAGED", anomaly_note: "reclaim belt damage" }
              as: BaggageServiceAgent
              captures: { rep: $.data.id }
            - call: "POST /baggage/reports/${rep}/investigate"
              payload: {}
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/arrange-delivery"
              payload: { delivery_method: "COURIER", scheduled_utc: "2026-09-01T14:00:00Z" }
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/mark-delivered"
              payload: {}
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/claims"
              payload: { requested_amount_cents: 25000 }
              as: BaggageServiceAgent
              captures: { clm: $.data.id }
            - call: "POST /baggage/claims/${clm}/decide"
              payload: { decision: "APPROVED", approved_amount_cents: 25000 }
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/compensate"
              payload: {}
              as: BaggageServiceAgent
              captures: { rep_v_compensated: $.data.version }
          trigger:
            - call: "POST /baggage/reports/${rep}/reopen"
              payload: { expected_report_version: "${rep_v_compensated}" }
              as: BaggageServiceAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/reports/${rep}/investigate"
              payload: {}
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/arrange-delivery"
              payload: { delivery_method: "PASSENGER_PICKUP", scheduled_utc: "2026-09-01T09:00:00Z" }
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/mark-delivered"
              payload: {}
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/claims"
              payload: { requested_amount_cents: 25000 }
              as: BaggageServiceAgent
              captures: { clm2: $.data.id }
            - call: "POST /baggage/claims/${clm2}/decide"
              payload: { decision: "APPROVED", approved_amount_cents: 25000 }
              as: BaggageServiceAgent
            - call: "POST /baggage/reports/${rep}/compensate"
              payload: {}
              as: BaggageServiceAgent
              captures: { rep_after: $.data.version }
          assert:
            - "Bag.${bag}.handling_charge_cents == 4600 both before the first payout and after the second"
            - "MishandledReport.${rep}.status == COMPENSATED and compensation_settled_cents == 18750"
            - "MishandledReport.${rep}.final_liability_cents == 18750"
            - "the bag's total recorded charge after the round trip is 4600 + 0 == 4600, identical to the pre-payout total of 4600 + 0"
            - "Bag.${bag}.excess_weight_fee_cents == 0 (the HOLD variant, still frozen because the station outage never cleared)"
            - "Station.${st}.open_liability_cents == 0 and settled_liability_cents == 18750"
            - "MishandledReport.${rep}.version == ${rep_after} and every one of the four report transitions advanced it by exactly 1"

      - name: deliver_offload_returns_makeup_slot_to_ledger
        grounds:
          - state_machines.Bag.LOADED_to_OFFLOADED
          - state_machines.Bag.LOADED_to_DELIVERED
          - calculations.makeup_area_occupancy
          - entities.MakeupArea.fields.released_slots
        distinguishing_aspect: "The conserved quantity is a resource-capacity LEDGER rather than any money or charge total: the make-up area's slot ledger occupied_slots + released_slots must be identical before a load and after the load-plus-offload round trip, and the free_slots value must be restored exactly."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with one make-up area MA-3 of 2 slots and buffer 15; airline DL; lane EDS-2"
            - "flight DL1423 departs 2026-09-01T15:00:00Z; bag B1 48 lb, 20x14x16, DOMESTIC, no special items"
            - "clock advanced to 2026-09-01T13:40:00Z: bag B1 is IN_MAKEUP holding a slot in MA-3, so occupied_slots is 1 and released_slots is 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/makeup-areas"
              payload: { station_id: "${st}", code: "MA-3", capacity_slots: 2, buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ma: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Okafor, Ben", passenger_ref: "PNR4M1T", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { bag: $.data.id }
            - call: "POST /baggage/bags/${bag}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
              captures: { bag_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:40:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/bags/${bag}/assign-makeup"
              payload: { expected_bag_version: "${bag_v}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:40:00Z", makeup_interval_minutes: 120 }
              as: SortationAgent
          trigger:
            - call: "POST /baggage/bags/${bag}/load"
              payload: {}
              as: LoadAgent
            - call: "POST /baggage/bags/${bag}/offload"
              payload: {}
              as: LoadAgent
          assert:
            - "before the trigger: MakeupArea.${ma}.occupied_slots == 1, released_slots == 0, free_slots == 1"
            - "after load: MakeupArea.${ma}.occupied_slots == 0, released_slots == 1, free_slots == 2"
            - "Bag.${bag}.custody_status == OFFLOADED and makeup_area_id is still ${ma}"
            - "the slot ledger occupied_slots + released_slots == 1 both before and after, so nothing drifted"
            - "MakeupArea.${ma}.free_slots == 2, identical to its value before bag B1 was ever assigned"
            - "Station.${st}.posture == OPEN (the total of 2 slots has 2 free, above ceil(0.15*2) == 1)"

      - name: alarm_clear_does_not_release_the_bag_from_custody
        grounds:
          - state_machines.Bag.ACCEPTED_to_HELD
          - state_machines.Bag.HELD_to_ACCEPTED
          - calculations.station_active_bag_count
          - entities.Bag.fields.screening_status
        distinguishing_aspect: "The conserved quantity is the station's active-bag POPULATION: clearing an in-line alarm in place must not drop station.active_bag_count, because the bag stays in HELD custody until a second weigh re-inducts it — the population returns to exactly 0 only after that re-induction and the bag's later departure."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with sorter_capacity_bags 60, make-up area MA-3, lane EDS-2; airline DL"
            - "station SEA outage declared so the HELD -> ACCEPTED weigh path is permitted"
            - "flight DL1423 departs 2026-09-01T15:00:00Z; bag B1 48 lb is weighed clean at clock 07:10, then an alarmed screening window is opened on lane EDS-2 with alarm_code EDS_ALARM_A1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/stations/${st}/outage"
              payload: {}
              as: PlatformAdmin
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Okafor, Ben", passenger_ref: "PNR4M1T", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { bag: $.data.id }
            - call: "POST /baggage/bags/${bag}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${bag}", lane_id: "${lane}", start_utc: "2026-09-01T07:20:00Z", alarm_code: "EDS_ALARM_A1" }
              as: Screener
              captures: { se: $.data.id }
          trigger:
            - call: "POST /baggage/screenings/${se}/resolve"
              payload: { outcome: "CLEARED" }
              as: Screener
              captures: { bag_v: $.data.version }
            - call: "POST /baggage/bags/${bag}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
              captures: { bag_v2: $.data.version }
          assert:
            - "after the alarm fires: Bag.${bag}.custody_status == HELD, screening_status == ALARMED, Station.${st}.active_bag_count == 1"
            - "after resolve CLEARED: Bag.${bag}.screening_status == CLEARED but Bag.${bag}.custody_status is STILL HELD (the bag is not returned to custody by the clear)"
            - "Station.${st}.active_bag_count == 1 after the clear — identical to its value before, because HELD bags remain in the active population"
            - "after the second weigh: Bag.${bag}.custody_status == ACCEPTED and screening_status == IN_LINE"
            - "Station.${st}.active_bag_count == 1 and ${bag_v2} == ${bag_v} + 1"
            - "a third weigh from ACCEPTED is rejected with ERR_INVALID_STATE, leaving active_bag_count at 1"
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: excess_weight_fee_flips_with_station_outage
        grounds:
          - calculations.excess_weight_fee
          - state_machines.Bag.ACCEPTED_to_SCREENING
          - state_machines.Bag.HELD_to_ACCEPTED
          - entities.Bag.fields.excess_weight_fee_cents
        distinguishing_aspect: "Two fees for identical BAG data (52.4 lb against a 50 lb threshold): the CURRENT variant charges 7500 cents, the HOLD variant charges 0, and the variant is selected purely by station.outage_active — the Bag is the same entity whose accept-time fee is being read back by a screener, so the two readings should agree and do not."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA (capacity 60), lane EDS-2, flight DL1423 departs 15:00; airline DL threshold 50 lb"
            - "bag B1 declared 52 lb, 20x14x16, DOMESTIC, no special items, flight DL1423"
            - "no outage is active at the first weigh"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
