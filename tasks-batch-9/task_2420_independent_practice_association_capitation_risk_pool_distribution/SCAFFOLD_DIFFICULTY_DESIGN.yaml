  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: assignment_half_open_adjacency_allowed_then_overlap_rejected
        resource_entity: MemberAssignment
        interval_semantics: "half-open [effective_date, term_date) per enrollee — an open-ended ACTIVE row has term_date null and extends to positive infinity"
        grounds:
          - validations.priority_18_ERR_ASSIGNMENT_PERIOD_OVERLAP
          - entities.MemberAssignment.fields.effective_date
          - entities.MemberAssignment.fields.term_date
          - errors.ERR_ASSIGNMENT_PERIOD_OVERLAP
        distinguishing_aspect: |
          Resource entity MemberAssignment, HALF-OPEN interval semantics scoped
          per enrollee: because the predecessor's interval excludes its own
          term_date instant, a successor starting at exactly that instant is
          ADJACENT and legal. The very same effective_date then collides with
          that successor's open-ended interval. The contrast between the two
          identical dates — one accepted, one rejected — is what proves the
          half-open reading.
        test_recipe:
          setup:
            - "Agreement AGR_HO is ACTIVE with max_panel_size 5; physician PHO is ACTIVE with panel_status OPEN."
            - "Enrollee EHO has coverage_start_date 2026-01-01T00:00:00Z and one assignment A1 with effective_date 2026-01-01T00:00:00Z, TERMINATED at logical clock 2026-07-01T00:00:00Z so term_date is exactly 2026-07-01T00:00:00Z."
            - "Logical clock is 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Half Open Health", payer_tax_id: "94-1800018", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_ho: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_ho}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_ho}/physicians"
              payload: { npi: "1800000001", full_name: "Hana Oyelaran", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_ho: "$.data.id" }
            - call: "POST /ipa/physicians/${p_ho}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_ho}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_ho}/enrollees"
              payload: { external_member_id: "HO-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_ho: "$.data.id", e_ho_v0: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_ho}", physician_id: "${p_ho}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_ho_v0}" }
              as: NetworkManager
              captures: { a_ho1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: NetworkManager
            - call: "POST /ipa/member-assignments/${a_ho1}/state"
              payload: { to_state: "TERMINATED" }
              as: NetworkManager
            - call: "GET /ipa/enrollees/${e_ho}"
              as: NetworkManager
              captures: { e_ho_v1: "$.data.version" }
          trigger:
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_ho}", physician_id: "${p_ho}", effective_date: "2026-07-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_ho_v1}" }
              as: NetworkManager
              captures: { a_ho2: "$.data.id" }
            - call: "GET /ipa/enrollees/${e_ho}"
              as: NetworkManager
              captures: { e_ho_v2: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_ho}", physician_id: "${p_ho}", effective_date: "2026-07-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_ho_v2}" }
              as: NetworkManager
              captures: { overlap_error: "$.data.error_id" }
          assert:
            - "MemberAssignment.${a_ho1}.status == \"TERMINATED\" and term_date == \"2026-07-01T00:00:00Z\""
            - "call 1 returns HTTP 201 — an effective_date equal to the predecessor's term_date is adjacent, not overlapping"
            - "MemberAssignment.${a_ho2}.status == \"ACTIVE\" and effective_date == \"2026-07-01T00:00:00Z\" and term_date == null"
            - "call 3 returns HTTP 409 and ${overlap_error} == \"ERR_ASSIGNMENT_PERIOD_OVERLAP\" — the identical date now collides with the open-ended row"
            - "PhysicianMember.${p_ho}.panel_size == 1 and DelegationAgreement.${agr_ho}.total_assigned_members == 1 after all three calls"
            - "GET /ipa/member-assignments filtered by enrollee_id ${e_ho} returns exactly 2 rows"

      - name: pool_year_closed_interval_shared_endpoint_collides
        resource_entity: RiskPool
        interval_semantics: "fully CLOSED [pool_year_start, pool_year_end] per (agreement, pool_type) — both endpoints are inside the interval, so touching endpoints collide"
        grounds:
          - validations.priority_19_ERR_POOL_PERIOD_OVERLAP
          - entities.RiskPool.fields.pool_year_start
          - entities.RiskPool.fields.pool_year_end
          - entities.RiskPool.fields.settlement_due_date
          - errors.ERR_POOL_PERIOD_OVERLAP
        distinguishing_aspect: |
          Different resource entity (RiskPool) and the OPPOSITE interval
          semantics from the assignment instance: pool years are fully CLOSED,
          so a new pool starting at exactly the incumbent's pool_year_end
          instant collides, whereas the identical arrangement on
          MemberAssignment would have been legal adjacency. Overlap is also
          scoped per pool_type, so the same colliding window is accepted for the
          other pool type, and the two types then receive different settlement
          lags (180 vs 270 days).
        test_recipe:
          setup:
            - "Agreement AGR_PY is ACTIVE."
            - "One PROFESSIONAL RiskPool covers 2026-01-01T00:00:00Z through 2026-12-31T23:59:59Z."
            - "Logical clock is 2026-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Pool Year Health", payer_tax_id: "94-1900019", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_py: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_py}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_py}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_py1: "$.data.id" }
          trigger:
            - call: "POST /ipa/delegation-agreements/${agr_py}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-12-31T23:59:59Z", pool_year_end: "2027-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_overlap_error: "$.data.error_id" }
            - call: "POST /ipa/delegation-agreements/${agr_py}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2027-01-01T00:00:00Z", pool_year_end: "2027-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_py2: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_py}/risk-pools"
              payload: { pool_type: "INSTITUTIONAL", pool_year_start: "2026-12-31T23:59:59Z", pool_year_end: "2027-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_py3: "$.data.id" }
          assert:
            - "RiskPool.${pool_py1}.settlement_due_date == \"2027-06-29T23:59:59Z\" (pool_year_end plus 180 days for PROFESSIONAL)"
            - "call 1 returns HTTP 409 and ${pool_overlap_error} == \"ERR_POOL_PERIOD_OVERLAP\" — sharing only the 2026-12-31T23:59:59Z instant is enough, because the interval is closed at both ends"
            - "call 2 returns HTTP 201 — starting one second later at 2027-01-01T00:00:00Z is disjoint"
            - "RiskPool.${pool_py2}.settlement_due_date == \"2028-06-28T23:59:59Z\""
            - "call 3 returns HTTP 201 — the SAME colliding window is legal for INSTITUTIONAL because overlap is scoped per pool_type"
            - "RiskPool.${pool_py3}.settlement_due_date == \"2028-09-26T23:59:59Z\" (pool_year_end plus 270 days for INSTITUTIONAL)"
            - "GET /ipa/delegation-agreements/${agr_py}/risk-pools returns exactly 3 rows, all in status \"ACCUMULATING\""

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: remittance_dispute_restores_accrued_capitation_cents
        conserved_quantity: "DelegationAgreement.accrued_capitation_cents — a MONEY quantity in cents"
        invariant_formula: "accrued_capitation_cents == SUM over CapitationRemittance rows of this agreement with status IN {RECONCILED, POSTED} of (expected_capitation_cents + retro_adjustment_cents)"
        grounds:
          - state_machines.EnrollmentFile.PARSED_to_RECONCILED
          - state_machines.EnrollmentFile.RECONCILED_to_DISPUTED
          - entities.DelegationAgreement.fields.accrued_capitation_cents
          - calculations.capitation_posture_derivation
        distinguishing_aspect: |
          Conserved quantity type: MONEY (cents accrued to the agreement). The
          RECONCILED accrual of 86275 cents and the DISPUTED reversal of the
          same 86275 cents must cancel to the cent, and the invariant is stated
          as an explicit sum over remittances in {RECONCILED, POSTED} — the
          disputed remittance drops out of the sum rather than being deleted.
          Different quantity type from the count invariant below, and the
          compensating action is a dispute on a financial document rather than a
          rejection of a network operation.
        test_recipe:
          setup:
            - "Agreement AGR_CM is ACTIVE with base_pmpm_cents 30000, MEMBER_MONTHS_PRORATED, quality_withhold_bps 700, professional 6000 / institutional 4000 bps, max_panel_size 10."
            - "The fixture II roster is in place: R1 (31 covered July days), R2 (16 days from 2026-07-16) and R3 (10 days, assignment TERMINATED at 2026-07-11)."
            - "The 2026-07 EnrollmentFile is PARSED with three MATCHED rows claiming 80081 cents in total, and accrued_capitation_cents is still 0."
            - "Logical clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Compensating Money Health", payer_tax_id: "94-2000020", delegation_scope: "FULL_RISK", base_pmpm_cents: 30000, reconciliation_method: "MEMBER_MONTHS_PRORATED", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 10, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_cm: "$.data.id", agr_cm_accrued_before: "$.data.accrued_capitation_cents" }
            - call: "POST /ipa/delegation-agreements/${agr_cm}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_cm}/physicians"
              payload: { npi: "2000000011", full_name: "Camila Moreau", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_cm: "$.data.id" }
            - call: "POST /ipa/physicians/${p_cm}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_cm}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_cm}/enrollees"
              payload: { external_member_id: "CM-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 12500, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_cm1: "$.data.id", e_cm1_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_cm1}", physician_id: "${p_cm}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_cm1_v}" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_cm}/enrollees"
              payload: { external_member_id: "CM-0002", age_band: "SENIOR", benefit_tier: "HMO_PLUS", risk_score_bps: 20000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_cm2: "$.data.id", e_cm2_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_cm2}", physician_id: "${p_cm}", effective_date: "2026-07-16T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_cm2_v}" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_cm}/enrollees"
              payload: { external_member_id: "CM-0003", age_band: "PEDIATRIC", benefit_tier: "HMO", risk_score_bps: 3000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_cm3: "$.data.id", e_cm3_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_cm3}", physician_id: "${p_cm}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_cm3_v}" }
              as: NetworkManager
              captures: { a_cm3: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-11T00:00:00Z" }
              as: NetworkManager
            - call: "POST /ipa/member-assignments/${a_cm3}/state"
              payload: { to_state: "TERMINATED" }
              as: NetworkManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_cm}/enrollment-files"
              payload: { coverage_month: "2026-07", payer_file_reference: "PFR-CM-2026-07" }
              as: IpaAdmin
              captures: { file_cm: "$.data.id" }
            - call: "POST /ipa/enrollment-files/${file_cm}/rows"
              payload: { external_member_id: "CM-0001", physician_npi: "2000000011", row_action: "ADD", claimed_capitation_cents: 37500, effective_date: "2026-07-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_cm}/rows"
              payload: { external_member_id: "CM-0002", physician_npi: "2000000011", row_action: "ADD", claimed_capitation_cents: 40000, effective_date: "2026-07-16T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_cm}/rows"
              payload: { external_member_id: "CM-0003", physician_npi: "2000000011", row_action: "TERM", claimed_capitation_cents: 2581, effective_date: "2026-07-11T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_cm}/state"
              payload: { to_state: "PARSED" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/enrollment-files/${file_cm}/state"
              payload: { to_state: "RECONCILED" }
              as: IpaAdmin
            - call: "GET /ipa/enrollment-files/${file_cm}/remittances"
              payload: { limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { rem_cm: "$.data[0].id" }
            - call: "GET /ipa/delegation-agreements/${agr_cm}"
              as: IpaAdmin
              captures: { agr_cm_accrued_mid: "$.data.accrued_capitation_cents" }
            - call: "POST /ipa/enrollment-files/${file_cm}/state"
              payload: { to_state: "DISPUTED", dispute_reason: "The mid-month add on CM-0002 was prorated rather than paid in full" }
              as: PayerRepresentative
              as_user_id: "${agr_cm}"
          assert:
            - "${agr_cm_accrued_before} == 0 — the agreement starts with nothing accrued"
            - "${agr_cm_accrued_mid} == 86275 — exactly the remittance's expected_capitation_cents plus retro_adjustment_cents (0)"
            - "CapitationRemittance.${rem_cm}.expected_capitation_cents == 86275 and retro_adjustment_cents == 0"
            - "after call 4 DelegationAgreement.${agr_cm}.accrued_capitation_cents == 0 — the reversal is exact, not 86274 and not 86276"
            - "after call 4 EnrollmentFile.${file_cm}.status == \"DISPUTED\" and CapitationRemittance.${rem_cm}.status == \"DISPUTED\""
            - "after call 4 DelegationAgreement.${agr_cm}.capitation_posture == \"WITHHELD\""
            - "after call 4 DelegationAgreement.${agr_cm}.withheld_balance_cents == 0 — nothing was ever POSTED, so the withhold ledger never moved"
            - "the invariant holds at every step: accrued_capitation_cents == sum of (expected_capitation_cents + retro_adjustment_cents) over remittances of ${agr_cm} in status RECONCILED or POSTED"

      - name: transfer_rejection_preserves_total_assigned_members_count
        conserved_quantity: "DelegationAgreement.total_assigned_members and PhysicianMember.panel_size — COUNT quantities of ACTIVE assignment rows"
        invariant_formula: "total_assigned_members == COUNT of MemberAssignment rows of this agreement with status == ACTIVE, and each PhysicianMember.panel_size == COUNT of that physician's MemberAssignment rows with status == ACTIVE"
        grounds:
          - state_machines.MemberAssignment.ACTIVE_to_TRANSFER_PROPOSED
          - state_machines.MemberAssignment.TRANSFER_PROPOSED_to_ACTIVE
          - entities.DelegationAgreement.fields.total_assigned_members
          - entities.PhysicianMember.fields.panel_size
          - roles.PhysicianUser
        distinguishing_aspect: |
          Conserved quantity type: COUNT of rows, not money. The proposal moves
          the assignment out of ACTIVE and therefore decrements both counters;
          the target physician's rejection restores both to their exact
          pre-proposal values. The deliberately NON-conserved field is
          panel_status, which stays CLOSED_TO_NEW instead of returning to OPEN —
          so the test proves the compensation is scoped to the counted quantity
          and does not blanket-restore the whole row.
        test_recipe:
          setup:
            - "Agreement AGR_CC is ACTIVE with max_panel_size 5."
            - "Physicians PCC1 and PCC2 are both credential_status ACTIVE with panel_status OPEN."
            - "Enrollee ECC holds one ACTIVE assignment on PCC1, so total_assigned_members is 1, PCC1.panel_size is 1 and PCC2.panel_size is 0."
            - "Logical clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Compensating Count Health", payer_tax_id: "94-2100021", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_cc: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_cc}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_cc}/physicians"
              payload: { npi: "2100000001", full_name: "Cyrus Ndlovu", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_cc1: "$.data.id" }
            - call: "POST /ipa/physicians/${p_cc1}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_cc1}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_cc}/physicians"
              payload: { npi: "2100000002", full_name: "Clara Nwosu", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_cc2: "$.data.id" }
            - call: "POST /ipa/physicians/${p_cc2}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_cc2}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_cc}/enrollees"
              payload: { external_member_id: "CC-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_cc: "$.data.id", e_cc_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_cc}", physician_id: "${p_cc1}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_cc_v}" }
              as: NetworkManager
              captures: { a_cc: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkManager
            - call: "GET /ipa/delegation-agreements/${agr_cc}"
              as: NetworkManager
              captures: { total_before: "$.data.total_assigned_members" }
            - call: "GET /ipa/physicians/${p_cc1}"
              as: NetworkManager
              captures: { p_cc1_size_before: "$.data.panel_size", p_cc1_panel_before: "$.data.panel_status" }
          trigger:
            - call: "POST /ipa/member-assignments/${a_cc}/state"
              payload: { to_state: "TRANSFER_PROPOSED", to_physician_id: "${p_cc2}", transfer_effective_date: "2026-09-01T00:00:00Z" }
              as: NetworkManager
            - call: "GET /ipa/delegation-agreements/${agr_cc}"
              as: NetworkManager
              captures: { total_mid: "$.data.total_assigned_members" }
            - call: "POST /ipa/member-assignments/${a_cc}/state"
              payload: { to_state: "ACTIVE" }
              as: PhysicianUser
              as_user_id: "${p_cc2}"
          assert:
            - "${total_before} == 1 and ${p_cc1_size_before} == 1 and ${p_cc1_panel_before} == \"OPEN\""
            - "after call 1 MemberAssignment.${a_cc}.status == \"TRANSFER_PROPOSED\" and pending_to_physician_id == \"${p_cc2}\""
            - "after call 1 ${total_mid} == 0 and PhysicianMember.${p_cc1}.panel_size == 0 and PhysicianMember.${p_cc1}.panel_status == \"TRANSFER_PENDING\""
            - "after call 1 PhysicianMember.${p_cc2}.panel_size == 0 — the proposal does not pre-credit the target"
            - "after call 3 MemberAssignment.${a_cc}.status == \"ACTIVE\" and pending_to_physician_id == null and term_date == null"
            - "after call 3 DelegationAgreement.${agr_cc}.total_assigned_members == 1 — restored to exactly ${total_before}"
            - "after call 3 PhysicianMember.${p_cc1}.panel_size == 1 — restored to exactly ${p_cc1_size_before}"
            - "after call 3 PhysicianMember.${p_cc2}.panel_size == 0"
            - "after call 3 PhysicianMember.${p_cc1}.panel_status == \"CLOSED_TO_NEW\", NOT \"OPEN\" — panel_status is deliberately not part of the conserved quantity"
            - "the invariant holds at every step: total_assigned_members == count of MemberAssignment rows of ${agr_cc} with status == ACTIVE"
