        distinguishing_aspect: "decision=ISSUE on an APPLIED warehouse with sufficient bond and net worth sets license_state LICENSED, stamps licensed_by_user_id reg-001, and flips operational_posture from CLOSED to OPEN in the same response."
        test_recipe:
