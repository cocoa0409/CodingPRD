# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Every instance grounds exclusively in elements declared in SCAFFOLD.yaml
# (§1.1-§1.7). Deleting this file leaves the scaffold's declared behaviour
# identical; it only makes coverage harder to audit.
#
# Every numeric literal in an `assert:` line below was produced by executing the
# corresponding §1.3 formula with Decimal ROUND_HALF_UP against the pinned
# fixture inputs -- none is an estimate.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 - Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_payout_versus_vs_guarantee_plus_backend
        grounds:
          - calculations.artist_payout
          - entities.ShowBooking.fields.agreed_deal_type
          - entities.Settlement.fields.artist_payout_cents
          - entities.Settlement.fields.net_pool_cents
          - state_machines.Settlement.DRAFT_to_PENDING_APPROVAL
        distinguishing_aspect: |
          This dual variant lives in the money domain on Settlement: two shows with
          byte-identical adjusted_gross_cents (10679468), zero sponsorship and zero rider
          cost settle to artist_payout_cents 12500000 under VERSUS but 14352548 under
          GUARANTEE_PLUS_BACKEND, a divergence of exactly 1852548 cents driven only by
          ShowBooking.agreed_deal_type.
        test_recipe:
          setup:
            - "Fair edition 2026 running 2026-08-20..2026-08-30, gate admission 1500, talent budget cap 40000000, refund reserve 15000000, ATTENDANCE_WEIGHTED."
            - "One stage with slot_soft_cap 4 so posture never interferes."
            - "Two artists of different genres on the same agent's roster, booked three days apart on that stage."
            - "Offer 1 is VERSUS, offer 2 is GUARANTEE_PLUS_BACKEND; every other deal term is identical (guarantee 12500000, split 0.85, breakeven 6000000)."
            - "Each show carries one RESERVED scale (face 6295, facility 400, allotment 2000, unbundled) and sells exactly 1800 units ONLINE before doors."
            - "Each advance is pushed into review by one zero-cost LIGHTING line and completed with both that line and the seed STAGING line APPROVED, so approved_rider_cost_cents stays 0 on both shows."
            - "Both shows are marked performed and settled on the FINAL basis with merch_gross_cents 900000 sold by the ARTIST."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar1: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Nine Volt Sermon", genre: "ROCK", audience_segment: "YOUNG_ADULT", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar2: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar1}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of1: "$.data.id" }
            - call: "POST /grandstand/offers/${of1}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of1}/accept"
              payload: {}
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/show-bookings"
              payload: { offer_id: "${of1}" }
              as: TalentBuyer
              captures: { bk1: "$.data[0].id" }
            - call: "GET /grandstand/production-advances"
              payload: { booking_id: "${bk1}" }
              as: ProductionManager
              captures: { adv1: "$.data[0].id" }
            - call: "GET /grandstand/production-advances/${adv1}/rider-items"
              payload: {}
              as: ProductionManager
              captures: { seed1: "$.data[0].id" }
            - call: "POST /grandstand/production-advances/${adv1}/rider-items"
