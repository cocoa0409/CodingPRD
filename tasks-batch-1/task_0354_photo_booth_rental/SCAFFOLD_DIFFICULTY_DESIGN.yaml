            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk1_id: $.data.id }
            - call: "POST /bookings/${bk1_id}/add-ons"
              payload: { add_on_id: "${att_addon_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk1_id}/payments"
              payload: { kind: "DEPOSIT", amount: 350.00 }
              as: FinanceClerk
            - call: "POST /bookings/${bk1_id}/confirm"
              payload: { expected_booth_version: "${booth1_v}" }
              as: OperationsManager
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-13T00:30:00Z", event_end: "2026-09-13T02:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk2_id: $.data.id }
            - call: "POST /bookings/${bk2_id}/add-ons"
              payload: { add_on_id: "${att_addon_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk2_id}/payments"
              payload: { kind: "DEPOSIT", amount: 350.00 }
              as: FinanceClerk
          trigger:
            - call: "POST /bookings/${bk2_id}/confirm"
              payload: { expected_booth_version: "${booth2_v}" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_ATTENDANT_AVAILABLE"
            - "HTTP status == 409"
            - "Booking.${bk2_id}.schedule_status == DRAFT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_money_conservation
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Booking.DEPOSIT_PAID_to_REFUNDED
          - entities.Booking.fields.amount_paid
          - entities.Booking.fields.amount_refunded
          - calculations.cancellation_refund
        distinguishing_aspect: |
          Conserved quantity = money. After a full-refund cancel (60+ day tier), the invariant
          net_cash_held == amount_paid - amount_refunded must equal 0 (493.13 in, 493.13 out): the REFUND
          compensating action leaves no operator cash and no customer debt.
        test_recipe:
          setup:
            - "Premium booking deposit 493.13 paid, CONFIRMED; clock 90 days before event so full refund tier applies; cancel then REFUND issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
