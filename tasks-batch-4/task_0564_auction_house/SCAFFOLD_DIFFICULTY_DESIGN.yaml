          trigger:
            - call: "GET /invoices?bidder_id=${bd}&auction_id=${au}"
              payload: {}
              as: AuctionStaff
              captures: { prem_sub: "$.data[0].premium_subtotal_cents", hammer_sub: "$.data[0].hammer_subtotal_cents", total: "$.data[0].total_due_cents" }
          assert:
            - "${prem_sub} == 50000"
            - "${hammer_sub} == 200002"
            - "${total} == 250002"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nl_invoice_parallel_payment_and_fulfillment
        grounds:
          - state_machines.Invoice.payment_UNPAID_to_PAID
          - state_machines.Invoice.fulfillment_PENDING_to_READY
          - entities.Invoice.fields.fulfillment_status
        distinguishing_aspect: "On one Invoice, paying to PAID leaves fulfillment_status at PENDING, and readying to READY leaves payment_status at PAID — the two axes advance independently on the same row."
        test_recipe:
          setup:
            - "Clock 2026-06-10. A lot (reserve 0, starting 200000) is hammered at 300000, creating an Invoice (total 375000, UNPAID, PENDING)."
