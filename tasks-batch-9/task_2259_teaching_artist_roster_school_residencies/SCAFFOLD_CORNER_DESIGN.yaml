      - name: shape_check_precedes_body_reference_resolution_on_session_create
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_TEACHING_ARTIST_NOT_FOUND]
        distinguishing_aspect: "One request violates BOTH rules (bad session_type enum AND an unresolvable assigned_artist_id); priority 4 must win with a 400, and only after the enum is corrected does the same unknown id surface as a 404 — an implementation resolving ids first reports the 404 in both cases."
        test_recipe:
          setup:
            - "A school and a DRAFT residency; no artist row is ever created, so the artist id in the body cannot resolve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
            - call: "POST /residencies"
              payload: { school_partner_id: "${s1_id}", title: "Story in Motion", discipline: "DANCE", grade_band: "G3_5", contracted_session_count: 10, session_length_minutes: 60, budget_cents: 200000, collaboration_expectation: "OBSERVE", required_strands: ["CREATING"], term_start_date: "2026-09-08", term_end_date: "2026-12-18", enrolled_student_count: 48 }
              as: ProgramDirector
              captures: { r1_id: $.data.id }
            - call: "GET /residencies/${r1_id}"
              payload: {}
              as: RosterCoordinator
              captures: { rv_1: $.data.version }
          trigger:
            - call: "POST /sessions"
              payload: { residency_id: "${r1_id}", assigned_artist_id: "00000000-0000-4000-8000-0000000000aa", session_date: "2026-09-15", start_time: "09:00", end_time: "10:00", session_type: "SPECIAL", expected_residency_version: "${rv_1}" }
              as: RosterCoordinator
              captures: { err_shape: $.data.error_id }
            - call: "POST /sessions"
              payload: { residency_id: "${r1_id}", assigned_artist_id: "00000000-0000-4000-8000-0000000000aa", session_date: "2026-09-15", start_time: "09:00", end_time: "10:00", session_type: "REGULAR", expected_residency_version: "${rv_1}" }
              as: RosterCoordinator
              captures: { err_ref: $.data.error_id }
          assert:
            - "${err_shape} == ERR_INVALID_REQUEST"
            - "HTTP status == 400 on the first attempt"
