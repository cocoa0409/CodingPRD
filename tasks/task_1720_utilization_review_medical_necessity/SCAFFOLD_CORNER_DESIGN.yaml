            - "certified_inpatient_day_count == 3 and certified_observation_day_count == 3 (intervals keep their level tags)"
            - "AuthorizationRequest.${auth_a} remains APPROVED (supersede only clears SUBMITTED/PENDED)"
      - name: review_due_at_chronological_anchor
        claim_type: constants_applied
        grounds: [calculations.concurrent_review_cadence_schedule]
        distinguishing_aspect: "The cadence anchor moves chronologically: review 2's deadline is computed from review 1's decided_at (2026-08-03T09:00:00Z + 48h), not from the original approval."
        test_recipe:
          setup: ["auth approved at 2026-08-02T12:00:00Z; review 1 created and decided APPROVE at 2026-08-03T09:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
