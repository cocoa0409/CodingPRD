      - name: notice_announced_inside_the_forty_five_day_period_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=58]
          - errors.ERR_NOTICE_PERIOD_TOO_SHORT
        distinguishing_aspect: "MIN_NOTICE_DAYS is measured at announcement against the logical clock: with the clock at 2026-08-01T00:00:00Z an effective_at of 2026-09-14T00:00:00Z (44 days) is refused with 422 ERR_NOTICE_PERIOD_TOO_SHORT while exactly 2026-09-15T00:00:00Z (45 days) is announced."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. Two PENDING_APPROVAL BENEFIT_REMOVAL notices, one effective 2026-09-14 and one effective 2026-09-15."
