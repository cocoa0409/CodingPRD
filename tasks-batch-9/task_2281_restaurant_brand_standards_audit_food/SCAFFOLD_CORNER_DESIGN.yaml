scaffold_corner_design:
  - section: entities
    instances:
    - name: brand_create_returns_persisted_and_computed_fields
      claim_type: creation
      grounds:
      - entities.Brand
      - endpoints.POST /brands
      distinguishing_aspect: A brand is creatable from an empty database with only name, brand_code and the mix floor; every computed field must come back seeded, not absent.
      test_recipe:
        setup:
        - Empty database
        - Logical clock at 2026-08-01T00:00:00Z
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-01T00:00:00Z'}
          as: BrandAdmin
        trigger:
        - call: POST /brands
          payload: {name: Skewer House, brand_code: SKWR, unannounced_min_ratio_pct: 55}
          as: BrandAdmin
          captures: {bid: $.data.id, bv: $.data.version, bidx: $.data.brand_risk_index, btier: $.data.brand_risk_tier, blc: $.data.location_count, bdc: $.data.default_location_count, bratio: $.data.unannounced_min_ratio_pct}
        assert:
        - HTTP 201 with response_type 'object'
        - ${bv} == 1, ${bidx} == 0.00, ${btier} == 'BASELINE', ${blc} == 0, ${bdc} == 0, ${bratio} == 55
        - ${bid} is a bare UUID with no type prefix, and created_at / updated_at are present
    - name: location_retrieval_returns_stored_and_computed_fields
      claim_type: retrieval
      grounds:
      - entities.Location
      - endpoints.GET /locations/{id}
      distinguishing_aspect: A freshly created location must read back with its input fields intact and every derived compliance field at its documented seed value, not null.
      test_recipe:
        setup:
        - Brand SKWR with franchisee Northline Foods LLC
        - Location SKWR-014 in MIDWEST just created
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-01T00:00:00Z'}
          as: BrandAdmin
        - call: POST /brands
          payload: {name: Skewer House, brand_code: SKWR, unannounced_min_ratio_pct: 40}
          as: BrandAdmin
          captures: {brand_id: $.data.id, brand_v: $.data.version}
        - call: POST /franchisees
          payload: {brand_id: '${brand_id}', legal_name: Northline Foods LLC, contact_email: ops@northline.test, agreement_signed_at: '2025-03-01T00:00:00Z'}
          as: BrandAdmin
          captures: {fr_id: $.data.id}
        - call: POST /locations
          payload: {brand_id: '${brand_id}', franchisee_id: '${fr_id}', store_number: SKWR-014, region_code: MIDWEST}
          as: BrandAdmin
          captures: {loc_id: $.data.id}
        trigger:
        - call: GET /locations/${loc_id}
          payload: {}
          as: BrandAdmin
          captures: {sn: $.data.store_number, rc: $.data.region_code, ss: $.data.standing_score, lg: $.data.latest_grade, oc: $.data.open_corrective_action_count, rv: $.data.repeat_violation_count, el: $.data.escalation_level,
            fs: $.data.franchise_agreement_status, cp: $.data.cure_period_started_at}
        assert:
        - ${sn} == 'SKWR-014' and ${rc} == 'MIDWEST'
        - ${ss} == 0.00, ${lg} is null, ${oc} == 0, ${rv} == 0, ${el} == 0
        - ${fs} == 'GOOD_STANDING' and ${cp} is null
    - name: location_listing_filters_by_region_and_paginates
      claim_type: listing
      grounds:
      - entities.Location
      - endpoints.GET /locations
      distinguishing_aspect: The filtered list must combine brand_id and region_code with limit/offset and report total_count over the filtered set, not over the whole table.
      test_recipe:
        setup:
        - 'Brand SKWR with one franchisee and three locations: SKWR-014 MIDWEST, SKWR-015 MIDWEST, SKWR-016 WEST'
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-01T00:00:00Z'}
          as: BrandAdmin
        - call: POST /brands
          payload: {name: Skewer House, brand_code: SKWR, unannounced_min_ratio_pct: 40}
          as: BrandAdmin
          captures: {brand_id: $.data.id, brand_v: $.data.version}
        - call: POST /franchisees
          payload: {brand_id: '${brand_id}', legal_name: Northline Foods LLC, contact_email: ops@northline.test, agreement_signed_at: '2025-03-01T00:00:00Z'}
          as: BrandAdmin
          captures: {fr_id: $.data.id}
        - call: POST /locations
          payload: {brand_id: '${brand_id}', franchisee_id: '${fr_id}', store_number: SKWR-014, region_code: MIDWEST}
          as: BrandAdmin
          captures: {loc_id: $.data.id}
        - call: POST /locations
          payload: {brand_id: '${brand_id}', franchisee_id: '${fr_id}', store_number: SKWR-015, region_code: MIDWEST}
          as: BrandAdmin
          captures: {loc2_id: $.data.id}
        - call: POST /locations
          payload: {brand_id: '${brand_id}', franchisee_id: '${fr_id}', store_number: SKWR-016, region_code: WEST}
          as: BrandAdmin
          captures: {loc3_id: $.data.id}
        trigger:
        - call: GET /locations
          payload: {brand_id: '${brand_id}', region_code: MIDWEST, limit: 1, offset: 0}
          as: BrandAdmin
          captures: {first_id: '$.data[0].id'}
        - call: GET /locations
          payload: {brand_id: '${brand_id}', region_code: MIDWEST, limit: 1, offset: 1}
          as: BrandAdmin
          captures: {second_id: '$.data[0].id'}
        assert:
        - 'page 1: response_type ''array'', 1 row, total_count == 2, has_more == true'
        - 'page 2: 1 row, total_count == 2, has_more == false'
        - ${first_id} == ${loc_id} and ${second_id} == ${loc2_id} (created_at ASC ordering, never id ordering)
        - the WEST location ${loc3_id} appears in neither page
    - name: unknown_path_ids_return_the_matching_not_found_error
      claim_type: not_found
      grounds:
      - validations.priority_3
      - errors.ERR_VISIT_NOT_FOUND
      - errors.ERR_LOCATION_NOT_FOUND
      - errors.ERR_DISPUTE_NOT_FOUND
      - errors.ERR_CORRECTIVE_ACTION_NOT_FOUND
      - errors.ERR_SCORED_ITEM_NOT_FOUND
      - errors.ERR_HEALTH_INSPECTION_NOT_FOUND
      - errors.ERR_AUDITOR_NOT_FOUND
      - errors.ERR_RUBRIC_VERSION_NOT_FOUND
      - errors.ERR_BRAND_NOT_FOUND
      - errors.ERR_FRANCHISEE_NOT_FOUND
      distinguishing_aspect: Priority 3 must resolve the path parameter to its own entity's error_id - a single generic 404 for every route fails this, and so does returning 200 with an empty body.
      test_recipe:
        setup:
        - Brand SKWR with a franchisee and a location exist, so the database is not empty
        - The UUID 00000000-0000-4000-8000-000000000999 belongs to no row of any entity
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-01T00:00:00Z'}
          as: BrandAdmin
        - call: POST /brands
          payload: {name: Skewer House, brand_code: SKWR, unannounced_min_ratio_pct: 40}
          as: BrandAdmin
          captures: {brand_id: $.data.id, brand_v: $.data.version}
        - call: POST /franchisees
          payload: {brand_id: '${brand_id}', legal_name: Northline Foods LLC, contact_email: ops@northline.test, agreement_signed_at: '2025-03-01T00:00:00Z'}
          as: BrandAdmin
          captures: {fr_id: $.data.id}
        - call: POST /locations
          payload: {brand_id: '${brand_id}', franchisee_id: '${fr_id}', store_number: SKWR-014, region_code: MIDWEST}
          as: BrandAdmin
          captures: {loc_id: $.data.id}
        trigger:
        - call: GET /audit-visits/00000000-0000-4000-8000-000000000999
          payload: {}
          as: BrandAdmin
          captures: {e_visit: $.data.error_id}
        - call: GET /locations/00000000-0000-4000-8000-000000000999
          payload: {}
          as: BrandAdmin
          captures: {e_loc: $.data.error_id}
        - call: GET /disputes/00000000-0000-4000-8000-000000000999
          payload: {}
          as: BrandAdmin
          captures: {e_disp: $.data.error_id}
        - call: GET /corrective-actions/00000000-0000-4000-8000-000000000999
          payload: {}
          as: BrandAdmin
          captures: {e_ca: $.data.error_id}
        - call: GET /scored-items/00000000-0000-4000-8000-000000000999
          payload: {}
          as: BrandAdmin
          captures: {e_si: $.data.error_id}
        - call: GET /health-inspections/00000000-0000-4000-8000-000000000999
          payload: {}
          as: ComplianceIntegrator
          captures: {e_hi: $.data.error_id}
        - call: GET /auditors/00000000-0000-4000-8000-000000000999
          payload: {}
          as: BrandAdmin
          captures: {e_aud: $.data.error_id}
        - call: GET /rubric-versions/00000000-0000-4000-8000-000000000999
          payload: {}
          as: BrandAdmin
          captures: {e_rv: $.data.error_id}
        - call: GET /brands/00000000-0000-4000-8000-000000000999
          payload: {}
          as: BrandAdmin
          captures: {e_brand: $.data.error_id}
        - call: GET /franchisees/00000000-0000-4000-8000-000000000999
          payload: {}
          as: BrandAdmin
          captures: {e_fr: $.data.error_id}
        assert:
        - ${e_visit} == 'ERR_VISIT_NOT_FOUND', ${e_loc} == 'ERR_LOCATION_NOT_FOUND', ${e_disp} == 'ERR_DISPUTE_NOT_FOUND'
        - ${e_ca} == 'ERR_CORRECTIVE_ACTION_NOT_FOUND', ${e_si} == 'ERR_SCORED_ITEM_NOT_FOUND', ${e_hi} == 'ERR_HEALTH_INSPECTION_NOT_FOUND'
        - ${e_aud} == 'ERR_AUDITOR_NOT_FOUND', ${e_rv} == 'ERR_RUBRIC_VERSION_NOT_FOUND', ${e_brand} == 'ERR_BRAND_NOT_FOUND', ${e_fr} == 'ERR_FRANCHISEE_NOT_FOUND'
        - every response is HTTP 404 with response_type 'error'
    - name: rubric_item_create_missing_required_fields_returns_invalid_request
      claim_type: required_fields
      grounds:
      - entities.RubricItem
      - validations.priority_6
      - errors.ERR_INVALID_REQUEST
      distinguishing_aspect: display_order, section and max_points are input-sourced with no default, so omitting any of them is a 422 before any uniqueness or arithmetic check runs.
      test_recipe:
        setup:
        - Brand SKWR with DRAFT rubric version RV-2026.1
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-01T00:00:00Z'}
          as: BrandAdmin
        - call: POST /brands
          payload: {name: Skewer House, brand_code: SKWR, unannounced_min_ratio_pct: 40}
          as: BrandAdmin
          captures: {brand_id: $.data.id, brand_v: $.data.version}
        - call: POST /franchisees
          payload: {brand_id: '${brand_id}', legal_name: Northline Foods LLC, contact_email: ops@northline.test, agreement_signed_at: '2025-03-01T00:00:00Z'}
          as: BrandAdmin
          captures: {fr_id: $.data.id}
        - call: POST /locations
          payload: {brand_id: '${brand_id}', franchisee_id: '${fr_id}', store_number: SKWR-014, region_code: MIDWEST}
          as: BrandAdmin
          captures: {loc_id: $.data.id}
        - call: POST /auditors
          payload: {full_name: Dana Reyes, employee_code: AUD-101}
          as: BrandAdmin
          captures: {aud_id: $.data.id}
        - call: POST /auditors/${aud_id}/certify
          payload: {}
          as: BrandAdmin
        - call: POST /rubric-versions
          payload: {brand_id: '${brand_id}', version_label: RV-2026.1, effective_from: '2026-07-01T00:00:00Z', total_points: 100, expected_brand_version: '${brand_v}'}
          as: BrandAdmin
          captures: {rv_id: $.data.id}
        trigger:
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FS-1, section: FOOD_SAFETY, max_points: 30}
          as: BrandAdmin
          captures: {e_order: $.data.error_id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FS-1, max_points: 30, display_order: 1}
          as: BrandAdmin
          captures: {e_section: $.data.error_id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FS-1, section: FOOD_SAFETY, display_order: 1}
          as: BrandAdmin
          captures: {e_points: $.data.error_id}
        assert:
        - ${e_order} == ${e_section} == ${e_points} == 'ERR_INVALID_REQUEST' with HTTP 400
        - GET /rubric-versions/${rv_id}/rubric-items returns 0 rows
        - GET /rubric-versions/${rv_id} still reports item_count 0 and critical_item_count 0
    - name: brand_and_rubric_item_defaults_apply_when_fields_are_omitted
      claim_type: defaults
      grounds:
      - entities.Brand.fields.unannounced_min_ratio_pct
      - entities.RubricItem.fields.is_critical
      distinguishing_aspect: 'Two input fields carry declared defaults: Brand.unannounced_min_ratio_pct 40 and RubricItem.is_critical false. Omission must apply the default rather than storing null, because
        both feed later rules (the mix floor and the penalty ladder).'
      test_recipe:
        setup:
        - Empty database
        - Logical clock at 2026-08-01T00:00:00Z
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-01T00:00:00Z'}
          as: BrandAdmin
        trigger:
        - call: POST /brands
          payload: {name: Skewer House, brand_code: SKWR}
          as: BrandAdmin
          captures: {bid: $.data.id, bv: $.data.version, bratio: $.data.unannounced_min_ratio_pct}
        - call: POST /rubric-versions
          payload: {brand_id: '${bid}', version_label: RV-2026.1, effective_from: '2026-07-01T00:00:00Z', total_points: 100, expected_brand_version: '${bv}'}
          as: BrandAdmin
          captures: {rvid: $.data.id}
        - call: POST /rubric-versions/${rvid}/rubric-items
          payload: {item_code: BS-1, section: BRAND_STANDARDS, max_points: 15, display_order: 1}
          as: BrandAdmin
          captures: {crit_flag: $.data.is_critical}
        assert:
        - ${bratio} == 40 (the declared default, not null and not 0)
        - ${crit_flag} == false
        - GET /rubric-versions/${rvid} reports item_count 1 and critical_item_count 0
    - name: announced_notice_hours_is_computed_at_creation_from_the_logical_clock
      claim_type: computed_fields
      grounds:
      - entities.AuditVisit.fields.announced_notice_hours
      - endpoints.POST /audit-visits
      distinguishing_aspect: 'announced_notice_hours is computed, not supplied: it is scheduled_start_at minus the logical clock at creation time, pinned once and never recomputed when the clock later advances.'
      test_recipe:
        setup:
        - Brand SKWR with unannounced_min_ratio_pct 0 so an ANNOUNCED first visit clears the mix floor
        - PUBLISHED six-item rubric RV-2026.1 and CERTIFIED auditor Dana Reyes
        - Logical clock at 2026-08-01T00:00:00Z
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-01T00:00:00Z'}
          as: BrandAdmin
        - call: POST /brands
          payload: {name: Skewer House, brand_code: SKWR, unannounced_min_ratio_pct: 0}
          as: BrandAdmin
          captures: {brand_id: $.data.id, brand_v: $.data.version}
        - call: POST /franchisees
          payload: {brand_id: '${brand_id}', legal_name: Northline Foods LLC, contact_email: ops@northline.test, agreement_signed_at: '2025-03-01T00:00:00Z'}
          as: BrandAdmin
          captures: {fr_id: $.data.id}
        - call: POST /locations
          payload: {brand_id: '${brand_id}', franchisee_id: '${fr_id}', store_number: SKWR-014, region_code: MIDWEST}
          as: BrandAdmin
          captures: {loc_id: $.data.id}
        - call: POST /auditors
          payload: {full_name: Dana Reyes, employee_code: AUD-101}
          as: BrandAdmin
          captures: {aud_id: $.data.id}
        - call: POST /auditors/${aud_id}/certify
          payload: {}
          as: BrandAdmin
        - call: POST /rubric-versions
          payload: {brand_id: '${brand_id}', version_label: RV-2026.1, effective_from: '2026-07-01T00:00:00Z', total_points: 100, expected_brand_version: '${brand_v}'}
          as: BrandAdmin
          captures: {rv_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FS-1, section: FOOD_SAFETY, max_points: 30, is_critical: true, display_order: 1}
          as: BrandAdmin
          captures: {fs1_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FS-2, section: FOOD_SAFETY, max_points: 20, is_critical: true, display_order: 2}
          as: BrandAdmin
          captures: {fs2_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: BS-1, section: BRAND_STANDARDS, max_points: 15, is_critical: false, display_order: 3}
          as: BrandAdmin
          captures: {bs1_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: BS-2, section: BRAND_STANDARDS, max_points: 15, is_critical: false, display_order: 4}
          as: BrandAdmin
          captures: {bs2_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FC-1, section: FACILITY, max_points: 12, is_critical: false, display_order: 5}
          as: BrandAdmin
          captures: {fc1_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FC-2, section: FACILITY, max_points: 8, is_critical: false, display_order: 6}
          as: BrandAdmin
          captures: {fc2_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/publish
          payload: {}
          as: BrandAdmin
          captures: {rv_status: $.data.status}
        trigger:
        - call: POST /audit-visits
          payload: {location_id: '${loc_id}', auditor_id: '${aud_id}', rubric_version_id: '${rv_id}', visit_type: ANNOUNCED, scheduled_start_at: '2026-08-06T09:00:00Z', scheduled_end_at: '2026-08-06T13:00:00Z'}
          as: BrandAdmin
          captures: {vid: $.data.id, notice: $.data.announced_notice_hours, vstat: $.data.status}
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-04T00:00:00Z'}
          as: BrandAdmin
        - call: GET /audit-visits/${vid}
          payload: {}
          as: BrandAdmin
          captures: {notice2: $.data.announced_notice_hours}
        assert:
        - ${notice} == 129.00 (2026-08-01T00:00:00Z to 2026-08-06T09:00:00Z, so the 72-hour notice floor is cleared)
        - ${vstat} == 'SCHEDULED'
        - ${notice2} == 129.00 after the clock advances to 2026-08-04 - the value is pinned at creation
    - name: evidence_photo_uploaded_by_role_is_assigned_by_the_server
      claim_type: system_fields
      grounds:
      - entities.EvidencePhoto.fields.uploaded_by_role
      - endpoints.POST /evidence-photos
      distinguishing_aspect: 'uploaded_by_role is system-sourced: it is taken from the acting role header and is not accepted from the body, so the same payload posted by an Auditor and by a Franchisee must
        produce different stored values.'
      test_recipe:
