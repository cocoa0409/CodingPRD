      - name: perquisite_tier_read_before_rollup_across_two_closes
        grounds:
          - calculations.perquisite_allocation
          - calculations.trip_security_cost
          - entities.Executive.fields.annual_disclosed_perquisite_cents
          - entities.Executive.fields.business_borne_security_cents
          - entities.Trip.fields.perquisite_rate_applied
          - state_machines.Trip.DEGRADED_to_CLOSED
          - endpoints.GET_/exec-protection/executives/{id}/perquisite-disclosure
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency resolved by a pinned order. The tier
          rate is keyed on Executive.annual_disclosed_perquisite_cents, which this very
          close then increases. Trip A (EXEC_PERQUISITE, rate 1.00) lifts the annual
          figure to 4000000. Trip B (PRORATA, total 30000000) must read prior == 4000000
          in STEP 1 -> tier 0.10 -> taxable 3000000. An implementation that reads the
          tier after STEP 5 sees 34000000 >= PERQUISITE_TIER_TOP_AT and applies 0.40,
          yielding 12000000; one that uses the post-trip gross for the tier but the
          pre-trip figure nowhere lands on neither number. Distinct from the mode (a)
          and mode (b) instances above: no non-linear term and no intermediate rounding
          is involved, only read/write ordering across two closes.
