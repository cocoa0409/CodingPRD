          A single OPEN_CERTIFICATION call is checked against all five declared side effects at once:
          the status moves to CERTIFICATION_OPEN, BOTH BLOCKED officer certifications flip to ELIGIBLE
          (each bumping its own version to 2), certification_coverage_pct is recomputed to 100.00, the
          BREACHED sweep runs but changes nothing because the only open milestone (FILING, ending
