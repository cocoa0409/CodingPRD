# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /dealer-agreements"
    occ_field: expected_dealer_version
    description: |
      Creating a DealerAgreement against a Dealer whose version has advanced
      since the client last read it is rejected. This captures the case where
      another writer has just created an agreement for the same territory and
      product family, which legitimately supersedes the prior representation
      under §1.2, and the current writer's view of the dealer is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: parts-commitment-create-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /parts-commitments"
    occ_field: expected_dealer_version
    description: |
      Creating a PartsCommitment against a Dealer whose version has advanced
      since the client last read it is rejected. This captures the case where
      another writer has just created a commitment for the same product family,
      which legitimately supersedes the prior stocking mandate under §1.3, and
      the current writer's view of the dealer is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: review-create-stale-agreement
    parent_entity: DealerAgreement
    write_endpoint: "POST /performance-reviews"
    occ_field: expected_dealeragreement_version
    description: |
      Creating a PerformanceReview against a DealerAgreement whose version has
      advanced since the client last read it is rejected. This captures the case
      where another writer has just opened a review for the same period, which
      legitimately supersedes the prior review under §1.2, and the current
      writer's view of the agreement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412