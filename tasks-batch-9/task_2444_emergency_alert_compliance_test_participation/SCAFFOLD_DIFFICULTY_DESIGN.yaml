            - "compliance_score == 90.00 == 100.00 - 0 (missing 0) - 0 (silent 0) - 0 (no revalidation) - 10.00 (1 breached outage)"
            - "compliance_posture == COMPLIANT — the band test is 'score >= COMPLIANT_MIN_SCORE 90.00', inclusive at exactly 90.00"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: assignment_create_requires_the_referenced_device_to_be_ready
        grounds:
          - "§1.6 ERR_DEVICE_NOT_READY (409): 'POST /monitoring-assignments or reinstate references a device whose status is not READY'"
          - "§1.2 state_machines.EASDevice REGISTERED -> REGISTERED (a readiness flag false) and REGISTERED -> READY (both flags true)"
          - "§1.5 POST /eas-devices/{id}/readiness-check input [self_test_passed, firmware_current]"
        distinguishing_aspect: "The MonitoringAssignment write is gated on a state that lives on a different entity: the identical body is rejected with ERR_DEVICE_NOT_READY while dev1 is REGISTERED, still rejected after a half-passing readiness check (self_test_passed true / firmware_current false leaves it REGISTERED), and only succeeds once the device itself reaches READY."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring PEP, activated; station KWEA registered."
            - "Device dev1 created and therefore REGISTERED with readiness_check_passed false; no readiness check has run yet."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
          trigger:
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { err_registered: "$.data.error_id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: false }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { err_half_check: "$.data.error_id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv2: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv2}" }
              captures: { ma1: "$.data.id" }
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "first attempt: ${err_registered} == 'ERR_DEVICE_NOT_READY' with HTTP 409, and no MonitoringAssignment row exists"
            - "the failed write did not bump Station.version — ${sv1} is still current, which is why the second attempt can reuse it"
            - "half-passing readiness check: dev1 stays status == REGISTERED with readiness_check_passed == false, but last_readiness_check_at IS written"
            - "second attempt: ${err_half_check} == 'ERR_DEVICE_NOT_READY' — one true flag is not enough"
            - "after the both-flags-true check: dev1.status == READY and readiness_check_passed == true"
            - "third attempt returns 201 with status == ACTIVE, counts_toward_required_sources == true, superseded_assignment_id == null"
            - "compliance-summary now reports accessible_source_count == 1, missing_source_count == 0, compliance_score == 100.00, compliance_posture == COMPLIANT (the create is a Station recompute event that also lifted the posture out of PROVISIONING)"

      - name: filing_blocked_by_station_posture_then_allowed_after_posture_recovers
        grounds:
          - "§1.4 priority 8 and §1.6 ERR_FILINGS_SUSPENDED (422): 'POST /filing-records while the owning station's compliance_posture is SUSPENDED_FILINGS'"
          - "§1.3 calculations.station_compliance_score phase 1 silence sweep with SILENCE_MAX_DAYS 8 and SILENT_ASSIGNMENT_DEDUCTION 10.00"
          - "§1.2 state_machines.MonitoringAssignment ACTIVE -> SILENT (sweep) and SILENT -> ACTIVE (record-receipt)"
          - "§1.5 POST /monitoring-assignments/{id}/record-receipt side effects"
        distinguishing_aspect: "The filing is blocked by a derived state two entities away (Station.compliance_posture, itself derived from MonitoringAssignment silence) rather than by anything on the TestEvent: the station is driven to SUSPENDED_FILINGS at 70.00 WITHOUT losing required-source coverage, and a single record-receipt that lifts the score to 80.00/WATCH makes the identical filing body succeed."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring only PEP, activated; station KWEA; dev1 READY."
            - "Four assignments on dev1: ma1 PEP/WXPEP (the only required one) plus ma2 SATELLITE/WXSAT, ma3 LP1/WXLP1, ma4 LP2/WXLP2 — all created at 2026-08-01T00:00:00Z."
