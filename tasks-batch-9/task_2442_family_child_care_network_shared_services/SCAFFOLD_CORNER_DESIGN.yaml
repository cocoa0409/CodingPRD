            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 1, absent_days: 0 }], expected_contract_version: "${cv}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /fccn/subsidy-claims/${cl1}/submit"
              as: Provider
              as_user_id: "${p1}"
              captures: { prov: $.data.provisional_amount_cents }
            - call: "POST /fccn/subsidy-claims/${cl1}/advance"
              as: FiscalOfficer
              captures: { adv: $.data.advance_paid_cents }
            - call: "POST /fccn/subsidy-claims/${cl1}/reconcile"
              as: FiscalOfficer
              captures: { fin: $.data.final_amount_cents, delta: $.data.settlement_delta_cents }
          assert:
            - "${prov} == 4503"
            - "${adv} == 3602 (floor of 3602.4, not 3603)"
            - "${fin} == 4503"
            - "${delta} == 901 (not 900)"
            - "SubsidyContract.${c1}.claimed_amount_cents == 4503"

      - name: remittance_waterfall_fills_first_claim_then_partially_fills_second
