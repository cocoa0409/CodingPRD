  - section: calculations
    instances:
      - name: labor_charge_overtime_kink_at_eight_hours
        claim_type: threshold_boundary
        grounds: [calculations.labor_charge, entities.LaborTicket.fields.charge_cents]
        distinguishing_aspect: "HOURLY variant constant OT_THRESHOLD_HOURS == 8: at exactly 8h no overtime applies (8 * 20.00 = 16000 cents); at 10h the marginal 2h are rated 1.5x (160 + 2*20*1.5 = 220.00 -> 22000 cents). Distinct from §1.8's variant-divergence test, which used 6h and never crossed the kink."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; lot ACCEPTED (100 @ 10.00, defect 0)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
          trigger:
            - { call: "POST /market/labor-tickets", payload: { purchase_lot_id: "${lot}", ticket_type: "HOURLY", work_date: "2026-05-01", hours: 8, hourly_rate: 20.00 }, as: Receiver, captures: { c8: "$.data.charge_cents" } }
            - { call: "POST /market/labor-tickets", payload: { purchase_lot_id: "${lot}", ticket_type: "HOURLY", work_date: "2026-05-01", hours: 10, hourly_rate: 20.00 }, as: Receiver, captures: { c10: "$.data.charge_cents" } }
          assert:
            - "8h ticket charge_cents == 16000 (exactly at the OT threshold: no 1.5x component)"
            - "10h ticket charge_cents == 22000 (8*20.00 + 2*20.00*1.5 = 220.00)"
            - "the marginal hour past 8 costs 3000 cents/hr, not 2000 — the kink is observable"

      - name: credit_memo_amount_prorated_from_adjusted_cost
        claim_type: correct_result
        grounds: [entities.CreditMemo.fields.amount_cents, calculations.lot_payable_reconciliation]
        distinguishing_aspect: "Memo formula round_half_up(adjusted_cost_cents * quantity / quantity_units): lot 100 units @ 10.00 with defect 0 (adjusted 100000) shrunk by 3 units yields exactly 3000, and payable drops to 97000 — a proration case §1.8's 10-of-100 shrink (8500) never exercised."
