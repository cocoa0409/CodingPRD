# =============================================================================
# PRD Benchmark Scaffold — Crowdsourced Petition & Civic Advocacy (Change.org style)
# Difficulty band: Expert
# =============================================================================

scenario: |
  750. Crowdsourced Petition & Civic Advocacy (Change.org style): petition creation &
  target/decision-maker, signature collection & verification, share/campaign & milestone,
  comment/update & delivery, representative-lookup & contact, victory/closure,
  donation/promotion, moderation

domain_name: petition-civic-advocacy
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture-driven gating       # petition moderation_status gates signing/promotion/commenting
  complexity_layers:
    - rate_threshold_triggers                       # signature milestones + goal crossing
    - cascading_side_effects                        # withdrawal refund chain, target-unreachable meeting chain
    - dual_variant_calculation                      # provisional vs official signature tally; gross vs net funds
    - optimistic_concurrency                        # Petition.version guards target supersede
    - derived_field_reconciliation                  # verified_signature_count / funds_raised_cents kept consistent

  entity_topology: flat                             # peer top-level collections joined by FK, no nested URL ownership
  state_machine_shape: cyclic                       # petition moderation revision loop + comment branch/return
  relationship_patterns:
    - one_to_many                                   # petition -> signatures / comments / donations
    - cross_aggregate                               # delivery-meeting references petition AND target; donation references campaign AND user
    - polymorphic: false
  role_model: peer_roles                            # Member owns content; Moderator owns moderation; Admin owns directory/payments
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: User
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email; unique", constraints: "unique, case-insensitive" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: jurisdiction, type: string, source: input, description: "Civic district code the user belongs to (e.g. US-CA-12); matched against petition.eligible_jurisdiction" }
      - { name: role_hint, type: enum, source: input, description: "Advisory only; actual authorization comes from X-User-Role header", default: "MEMBER", constraints: "MEMBER" }

  - name: Petition
    parent: null
    common_fields: true
    fields:
      - { name: author_user_id, type: string, source: input, description: "FK -> User.id; the Member who created and owns this petition" }
      - { name: title, type: string, source: input, description: "Petition title" }
      - { name: summary, type: string, source: input, description: "Short summary" }
      - { name: body, type: string, source: input, description: "Full petition text" }
      - { name: category, type: enum, source: input, description: "Topic category", constraints: "ENVIRONMENT | POLITICS | HEALTH | EDUCATION | OTHER" }
      - { name: goal, type: integer, source: input, description: "Target number of VERIFIED signatures", constraints: ">= 1" }
      - { name: eligible_jurisdiction, type: string, source: input, description: "If set, only signers whose User.jurisdiction equals this value may sign; null = open to all", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: "DRAFT", constraints: "DRAFT | UNDER_REVIEW | CHANGES_REQUESTED | PUBLISHED | CLOSED_VICTORY | CLOSED_WITHDRAWN | REMOVED" }
      - { name: moderation_status, type: enum, source: computed, description: "Derived moderation posture: PENDING until first review, APPROVED once PUBLISHED, BLOCKED when REMOVED", default: "PENDING", constraints: "PENDING | APPROVED | BLOCKED" }
      - { name: verified_signature_count, type: integer, source: computed, description: "COUNT(Signature WHERE petition_id=self AND status=VERIFIED); official tally", default: 0 }
      - { name: pending_signature_count, type: integer, source: computed, description: "COUNT(Signature WHERE petition_id=self AND status=PENDING_VERIFICATION)", default: 0 }
      - { name: goal_reached, type: boolean, source: computed, description: "verified_signature_count >= goal (>= boundary)", default: false }
      - { name: milestone_thresholds, type: array, source: computed, description: "Signature milestone thresholds fixed at publish time (see milestone_ladder calc)", default: [] }
      - { name: milestones_reached, type: array, source: computed, description: "Subset of milestone_thresholds already met by verified_signature_count", default: [] }
      - { name: approved_comment_count, type: integer, source: computed, description: "COUNT(Comment WHERE petition_id=self AND comment_type=COMMENT AND status=APPROVED)", default: 0 }
      - { name: delivered_meeting_count, type: integer, source: computed, description: "COUNT(DeliveryMeeting WHERE petition_id=self AND status=DELIVERED)", default: 0 }
      - { name: published_at, type: datetime, source: system, description: "Set when first transitioned to PUBLISHED", default: null }

  - name: Target
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id; the petition this decision-maker is the target of" }
      - { name: representative_id, type: string, source: input, description: "FK -> Representative.id; optional link to a directory entry", default: null }
      - { name: name, type: string, source: input, description: "Decision-maker name" }
      - { name: title, type: string, source: input, description: "Decision-maker office title" }
      - { name: office, type: string, source: input, description: "Governing body / office" }
      - { name: status, type: enum, source: system, description: "ACTIVE = current target; SUPERSEDED = replaced by a newer target; UNREACHABLE = deactivated", default: "ACTIVE", constraints: "ACTIVE | SUPERSEDED | UNREACHABLE" }

  - name: Representative
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Elected official name" }
      - { name: office, type: string, source: input, description: "Office held" }
      - { name: jurisdiction, type: string, source: input, description: "District code served (e.g. US-CA-12); lookup key" }
      - { name: contact_email, type: string, source: input, description: "Official contact email" }

  - name: Signature
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id; petition being signed" }
      - { name: signer_user_id, type: string, source: input, description: "FK -> User.id; the Member signing" }
      - { name: public_comment, type: string, source: input, description: "Optional reason shown publicly", default: null }
      - { name: verification_token, type: string, source: system, description: "Server-issued token the signer submits to confirm the signature" }
      - { name: status, type: enum, source: system, description: "Verification lifecycle", default: "PENDING_VERIFICATION", constraints: "PENDING_VERIFICATION | VERIFIED | REJECTED | REVOKED" }

  - name: Comment
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id" }
      - { name: author_user_id, type: string, source: input, description: "FK -> User.id; author of the comment or update" }
      - { name: comment_type, type: enum, source: input, description: "COMMENT = signer discussion (moderated); UPDATE = author progress update (auto-approved, deliverable)", default: "COMMENT", constraints: "COMMENT | UPDATE" }
      - { name: body, type: string, source: input, description: "Comment/update text" }
      - { name: status, type: enum, source: system, description: "Moderation lifecycle", default: "PENDING", constraints: "PENDING | APPROVED | REJECTED | FLAGGED | REMOVED" }
      - { name: delivered, type: boolean, source: system, description: "UPDATE-type only: whether the update was pushed to signers", default: false }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id; 1:1 fundraising campaign for the petition" }
      - { name: goal_cents, type: integer, source: input, description: "Fundraising goal in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE accepts donations; SUSPENDED blocks new donations; CLOSED is terminal (set on petition closure)", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: gross_pledged_cents, type: integer, source: computed, description: "SUM(Donation.amount_cents WHERE status IN {PENDING, SETTLED}); provisional variant", default: 0 }
      - { name: funds_raised_cents, type: integer, source: computed, description: "Net settled funds = SUM(net_to_campaign_cents for SETTLED donations) - SUM(net_to_campaign_cents for REFUNDED donations); official variant", default: 0 }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign receiving the donation" }
      - { name: donor_user_id, type: string, source: input, description: "FK -> User.id; the donating Member" }
      - { name: amount_cents, type: integer, source: input, description: "Gross donation in cents", constraints: ">= 100" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "round_half_up(amount_cents * PLATFORM_FEE_PCT) + FIXED_FEE_CENTS (see donation_fee_split)", default: 0 }
      - { name: net_to_campaign_cents, type: integer, source: computed, description: "amount_cents - platform_fee_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "Payment lifecycle", default: "PENDING", constraints: "PENDING | SETTLED | REFUNDED | FAILED" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id; petition being featured" }
      - { name: purchaser_user_id, type: string, source: input, description: "FK -> User.id; Member who bought the promotion" }
      - { name: category, type: enum, source: system, description: "Copied from petition.category at creation; slot pool key", constraints: "ENVIRONMENT | POLITICS | HEALTH | EDUCATION | OTHER" }
      - { name: placement_tier, type: enum, source: input, description: "Featured placement level", constraints: "STANDARD | PREMIUM | SPOTLIGHT" }
      - { name: window_start, type: datetime, source: input, description: "Half-open feature window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open feature window end (exclusive); must be > window_start" }
      - { name: duration_days, type: integer, source: computed, description: "ceil((window_end - window_start) / 86400s); used by promotion_price", default: 0 }
      - { name: price_cents, type: integer, source: computed, description: "Computed promotion price (see promotion_price)", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED = paid & booked; ACTIVE = live in window; CANCELLED = refunded before/at cancel; COMPLETED = window elapsed", default: "SCHEDULED", constraints: "SCHEDULED | ACTIVE | CANCELLED | COMPLETED" }

  - name: DeliveryMeeting
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id; petition being delivered" }
      - { name: target_id, type: string, source: input, description: "FK -> Target.id; decision-maker the delivery is scheduled with" }
      - { name: window_start, type: datetime, source: input, description: "Meeting start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Meeting end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "Scheduling lifecycle", default: "REQUESTED", constraints: "REQUESTED | CONFIRMED | DELIVERED | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Petition
    initial_state: DRAFT
    terminal_states: [CLOSED_VICTORY, CLOSED_WITHDRAWN, REMOVED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /petitions/{id}/submit"
        actor: Member
        preconditions:
          - "Caller is the petition author (author_user_id == X-User-ID)"
          - "Petition has an ACTIVE Target (a decision-maker has been set)"
        side_effects: []
      - from: CHANGES_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /petitions/{id}/submit"
        actor: Member
        preconditions:
          - "Caller is the petition author"
        side_effects: []
        note: "Revision loop — author resubmits after addressing moderator feedback (cyclic)."
      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /petitions/{id}/moderate (decision=APPROVE)"
        actor: Moderator
        preconditions: []
        side_effects:
          - "moderation_status = APPROVED"
          - "published_at set to current clock time (only if previously null)"
          - "milestone_thresholds fixed via milestone_ladder calc"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /petitions/{id}/moderate (decision=REQUEST_CHANGES)"
        actor: Moderator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REMOVED
        trigger: "POST /petitions/{id}/moderate (decision=REMOVE)"
        actor: Moderator
        preconditions: []
        side_effects:
          - "moderation_status = BLOCKED"
      - from: PUBLISHED
        to: REMOVED
        trigger: "POST /petitions/{id}/moderate (decision=REMOVE)"
        actor: Moderator
        preconditions: []
        side_effects:
          - "moderation_status = BLOCKED"
      - from: PUBLISHED
        to: CLOSED_VICTORY
        trigger: "POST /petitions/{id}/close (outcome=VICTORY)"
        actor: Member
        preconditions:
          - "Caller is the petition author"
          - "verified_signature_count > 0 (else ERR_NO_VERIFIED_SIGNATURES)"
          - "delivered_meeting_count >= 1 (else ERR_NO_DELIVERY)"
        side_effects:
          - "If a Campaign exists for this petition and is not CLOSED: Campaign -> CLOSED (see closure_refund_cascade)"
      - from: PUBLISHED
        to: CLOSED_WITHDRAWN
        trigger: "POST /petitions/{id}/close (outcome=WITHDRAWN)"
        actor: Member
        preconditions:
          - "Caller is the petition author"
        side_effects:
          - "All Signature in PENDING_VERIFICATION for this petition -> REJECTED"
          - "If a Campaign exists and is not CLOSED: Campaign -> CLOSED (cascade link 1 of closure_refund_cascade)"

  - entity: Target
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, UNREACHABLE]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /petitions/{id}/target (a newer Target is created)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Auto-fired when a replacement Target is created for the same petition (supersede)."
      - from: ACTIVE
        to: UNREACHABLE
        trigger: "POST /targets/{id}/deactivate"
        actor: Admin
        preconditions: []
        side_effects:
          - "All DeliveryMeeting for this target in {REQUESTED, CONFIRMED} -> CANCELLED (cascade link 1 of target_unreachable_cascade)"

  - entity: Signature
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /signatures/{id}/verify"
        actor: Member
        preconditions:
          - "Submitted verification_token matches the signature's token (else ERR_INVALID_VERIFICATION_TOKEN)"
          - "Parent Petition.status == PUBLISHED (else ERR_PETITION_NOT_PUBLISHED)"
        side_effects:
          - "Petition.verified_signature_count incremented by 1; goal_reached and milestones_reached recomputed"
          - "Petition.pending_signature_count decremented by 1"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /signatures/{id}/revoke  OR  petition WITHDRAWN cascade"
        actor: Moderator
        preconditions: []
        side_effects:
          - "Petition.pending_signature_count decremented by 1"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /signatures/{id}/revoke"
        actor: Moderator
        preconditions: []
        side_effects:
          - "Petition.verified_signature_count decremented by 1; goal_reached recomputed (cascade link of signature_revoke_cascade)"

  - entity: Comment
    initial_state: PENDING
    terminal_states: [REJECTED, REMOVED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /comments/{id}/moderate (decision=APPROVE)"
        actor: Moderator
        preconditions:
          - "comment_type == COMMENT"
        side_effects:
          - "Petition.approved_comment_count incremented by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /comments/{id}/moderate (decision=REJECT)"
        actor: Moderator
        preconditions:
          - "comment_type == COMMENT"
        side_effects: []
      - from: APPROVED
        to: FLAGGED
        trigger: "POST /comments/{id}/flag"
        actor: Member
        preconditions: []
        side_effects:
          - "Petition.approved_comment_count decremented by 1"
      - from: FLAGGED
        to: APPROVED
        trigger: "POST /comments/{id}/moderate (decision=DISMISS)"
        actor: Moderator
        preconditions: []
        side_effects:
          - "Petition.approved_comment_count incremented by 1"
        note: "Branch return — dismissed flags restore the comment (divergent side-effect vs REMOVE)."
      - from: FLAGGED
        to: REMOVED
        trigger: "POST /comments/{id}/moderate (decision=REMOVE)"
        actor: Moderator
        preconditions: []
        side_effects: []
        note: "Divergent branch — REMOVE does NOT restore the count (comment already decremented at FLAG)."

  - entity: Campaign
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /campaigns/{id}/moderate (action=SUSPEND)"
        actor: Moderator
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /campaigns/{id}/moderate (action=REACTIVATE)"
        actor: Moderator
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "petition close cascade (VICTORY or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "All Donation for this campaign in PENDING -> REFUNDED (cascade link 2 of closure_refund_cascade)"
      - from: SUSPENDED
        to: CLOSED
        trigger: "petition close cascade (VICTORY or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "All Donation for this campaign in PENDING -> REFUNDED (cascade link 2 of closure_refund_cascade)"

  - entity: Donation
    initial_state: PENDING
    terminal_states: [SETTLED, REFUNDED, FAILED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /donations/{id}/transition (to_status=SETTLED)"
        actor: Admin
        preconditions:
          - "Campaign.status != CLOSED"
        side_effects:
          - "platform_fee_cents and net_to_campaign_cents computed via donation_fee_split"
          - "Campaign.funds_raised_cents increased by this donation's net_to_campaign_cents"
      - from: PENDING
        to: FAILED
        trigger: "POST /donations/{id}/transition (to_status=FAILED)"
        actor: Admin
        preconditions: []
        side_effects: []
      - from: PENDING
        to: REFUNDED
        trigger: "campaign CLOSED cascade"
        actor: system
        preconditions: []
        side_effects: []
        note: "Pending donations at closure are voided; they never settled so funds_raised_cents is unaffected."
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /donations/{id}/transition (to_status=REFUNDED)"
        actor: Admin
        preconditions: []
        side_effects:
          - "Campaign.funds_raised_cents decreased by this donation's net_to_campaign_cents (cascade link 3 / compensating action)"

  - entity: Promotion
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system clock reaches window_start (observed on read/ops)"
        actor: system
        preconditions:
          - "current clock >= window_start"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /promotions/{id}/cancel"
        actor: Member
        preconditions:
          - "Caller is the purchaser (purchaser_user_id == X-User-ID)"
          - "current clock < window_start"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system clock reaches window_end (observed on read/ops)"
        actor: system
        preconditions:
          - "current clock >= window_end"
        side_effects: []

  - entity: DeliveryMeeting
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /delivery-meetings/{id}/transition (to_status=CONFIRMED)"
        actor: Admin
        preconditions:
          - "Target.status == ACTIVE (else ERR_TARGET_UNREACHABLE)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /delivery-meetings/{id}/transition (to_status=CANCELLED)  OR  target_unreachable_cascade"
        actor: Member
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /delivery-meetings/{id}/transition (to_status=DELIVERED)"
        actor: Member
        preconditions:
          - "Caller is the petition author"
          - "Target.status == ACTIVE (else ERR_TARGET_UNREACHABLE)"
        side_effects:
          - "Petition.delivered_meeting_count incremented by 1 (enables VICTORY closure)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /delivery-meetings/{id}/transition (to_status=CANCELLED)  OR  target_unreachable_cascade"
        actor: Member
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: target-supersede-stale-petition
    parent_entity: Petition
    write_endpoint: "POST /petitions/{id}/target"
    occ_field: "expected_petition_version"
    description: |
      Setting a petition's decision-maker creates a new Target that supersedes the
      prior ACTIVE Target. A create whose expected_petition_version no longer equals
      the petition's current version is rejected: this captures the case where another
      writer has already replaced the target (legitimately superseding the prior one)
      and the current writer's view of the petition is stale.
    error_id: ERR_STALE_PETITION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: signature_tally
    trigger: "Signature verify/revoke, and petition read"
    algorithm: aggregation
    formula: |
      # Dual-variant tally on the Petition domain.
      verified_signature_count = COUNT(Signature s WHERE s.petition_id = P.id AND s.status = VERIFIED)
      pending_signature_count  = COUNT(Signature s WHERE s.petition_id = P.id AND s.status = PENDING_VERIFICATION)
    input_set: "Signatures of the petition, filtered by status; REJECTED and REVOKED excluded from both counts."
    precision: "integer counts, exact"
    variants:
      - name: official_verified
        when: "goal_reached, milestones, victory eligibility, public headline number"
        difference: "counts only status=VERIFIED"
      - name: provisional_pending_included
        when: "author dashboard 'signatures awaiting confirmation' figure"
        difference: "verified + pending; a PENDING signature inflates this variant but not the official one"

  - name: campaign_funds
    trigger: "Donation settle/refund, and campaign read"
    algorithm: aggregation
    formula: |
      # Dual-variant tally on the Campaign domain (different entity domain from signature_tally).
      gross_pledged_cents = SUM(d.amount_cents FOR Donation d WHERE d.campaign_id = C.id AND d.status IN {PENDING, SETTLED})
      funds_raised_cents  = SUM(d.net_to_campaign_cents FOR d WHERE d.status = SETTLED)
                          - SUM(d.net_to_campaign_cents FOR d WHERE d.status = REFUNDED)
    input_set: "Donations of the campaign; gross uses {PENDING, SETTLED}; net uses SETTLED minus REFUNDED."
    precision: "integer cents, exact"
    variants:
      - name: gross_pledged
        when: "campaign progress bar / optimistic total"
        difference: "includes PENDING (un-captured) donations at full gross amount, no fee deducted"
      - name: net_settled
        when: "withdrawable balance / official raised total"
        difference: "only SETTLED, net of per-donation platform fee, and reversed by REFUND"

  - name: promotion_price
    trigger: "POST /promotions (Promotion creation)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs (tier, duration, category) with nested min/max clamp.
      duration_days = ceil((window_end - window_start) / 86400 seconds)   # half-open interval, ceil to whole days
      raw = BASE_RATE_CENTS[placement_tier] * duration_days * CATEGORY_DEMAND[petition.category]
      clamped = min(max(raw, MIN_PRICE_CENTS), MAX_PRICE_CENTS)
      price_cents = round_half_up(clamped) + LISTING_FEE_CENTS
      # Evaluation order is pinned: clamp BEFORE adding LISTING_FEE_CENTS, so the fee is never clamped away.
    input_set: "The single Promotion being created; placement_tier and duration from the request, category copied from the petition."
    constants:
      BASE_RATE_CENTS: { STANDARD: 5000, PREMIUM: 12000, SPOTLIGHT: 25000 }
      CATEGORY_DEMAND: { ENVIRONMENT: 1.5, POLITICS: 2.0, HEALTH: 1.2, EDUCATION: 1.0, OTHER: 1.0 }
      MIN_PRICE_CENTS: 5000
      MAX_PRICE_CENTS: 200000
      LISTING_FEE_CENTS: 1500
    precision: "integer cents, round_half_up on the clamped subtotal before adding the flat listing fee"

  - name: donation_fee_split
    trigger: "Donation PENDING -> SETTLED"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): rounding order is pinned — round the fee PER DONATION, then sum nets.
      # Per donation:
      platform_fee_cents   = round_half_up(amount_cents * PLATFORM_FEE_PCT) + FIXED_FEE_CENTS
      net_to_campaign_cents = amount_cents - platform_fee_cents
      # Campaign roll-up (pinned order): SUM of the per-donation (already-rounded) net_to_campaign_cents.
      # It is NOT computed as round_half_up(SUM(amount)*PCT) — summing then rounding gives different cents.
      Campaign.funds_raised_cents += net_to_campaign_cents   # on each SETTLE
    input_set: "The single Donation being settled; the campaign roll-up sums per-donation rounded nets."
    constants:
      PLATFORM_FEE_PCT: 0.029
      FIXED_FEE_CENTS: 30
    precision: "integer cents, round_half_up applied to the percentage fee of EACH donation before summing"

  - name: milestone_ladder
    trigger: "Petition UNDER_REVIEW -> PUBLISHED (first publish)"
    algorithm: threshold
    formula: |
      # Fix the signature milestone ladder at publish time from the goal.
      candidates = [100, ceil(goal / 2), goal]              # ceil(goal/2) pinned (round up)
      milestone_thresholds = sorted(unique([c for c in candidates if 1 <= c <= goal]))
      # On each verify/revoke:
      milestones_reached = [t for t in milestone_thresholds if verified_signature_count >= t]   # >= boundary
      goal_reached = (verified_signature_count >= goal)                                          # >= boundary
    input_set: "petition.goal at publish; verified_signature_count on each recompute."
    constants:
      DEFAULT_FIRST_MILESTONE: 100
    precision: "integer thresholds; ceil on goal/2"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /users and GET reads open to Guest"
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND (per entity)"
    http_status: 404
    applies_to: "all id-bearing paths"
  - priority: 4
    category: business_referential
    check: "Ownership: for Member-owned mutations the acting X-User-ID equals the resource's owner FK (author_user_id / signer_user_id / purchaser_user_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "petition edit/submit/close/target/updates, signature verify, promotion cancel, delivery deliver"
  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in allowed set, integers within declared constraints, window_end > window_start"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH with a body"
  - priority: 6
    category: state
    check: "OCC: expected_petition_version equals Petition.version"
    error_id: ERR_STALE_PETITION_VERSION
    http_status: 412
    applies_to: "PATCH /petitions/{id}, POST /petitions/{id}/target"
  - priority: 7
    category: state
    check: "Target resource is in a legal state for the requested transition (generic invalid-from)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: state
    check: "Signing/verifying requires the parent Petition.status == PUBLISHED"
    error_id: ERR_PETITION_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /petitions/{id}/signatures, POST /signatures/{id}/verify"
  - priority: 9
    category: business_safety
    check: "Petition is promotable/commentable: moderation_status == APPROVED and status == PUBLISHED"
    error_id: ERR_PETITION_NOT_PROMOTABLE
    http_status: 403
    applies_to: "POST /promotions"
  - priority: 10
    category: business_safety
    check: "Comment is in a moderatable state and type for the requested moderation decision"
    error_id: ERR_CONTENT_NOT_MODERATABLE
    http_status: 409
    applies_to: "POST /comments/{id}/moderate"
  - priority: 11
    category: business_referential
    check: "If petition.eligible_jurisdiction is set, signer User.jurisdiction must equal it"
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /petitions/{id}/signatures"
  - priority: 12
    category: business_referential
    check: "Verification token submitted equals the signature's issued token"
    error_id: ERR_INVALID_VERIFICATION_TOKEN
    http_status: 422
    applies_to: "POST /signatures/{id}/verify"
  - priority: 13
    category: business_referential
    check: "Scheduling a delivery meeting requires the referenced Target.status == ACTIVE"
    error_id: ERR_TARGET_UNREACHABLE
    http_status: 409
    applies_to: "POST /delivery-meetings"
  - priority: 14
    category: business_temporal
    check: "Promotion window does not exceed the category's concurrent featured-slot capacity (PROMO_SLOTS_PER_CATEGORY = 2). Overlap is computed on the half-open interval [window_start, window_end); a window that abuts another exactly (touching endpoints) does NOT overlap. Aggregate rule: reject only when 2 or more other SCHEDULED/ACTIVE promotions in the same category already overlap the requested window."
    error_id: ERR_PROMO_SLOT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /promotions"
  - priority: 15
    category: business_temporal
    check: "Delivery meeting window must not fall within BUFFER_MINUTES = 15 of an existing REQUESTED/CONFIRMED meeting on the SAME target. Single-occupancy: a target may hold at most one live meeting, and consecutive meetings need a >= 15-minute gap (gap measured between the earlier window_end and the later window_start). Windows are half-open [window_start, window_end)."
    error_id: ERR_MEETING_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-meetings"
  - priority: 16
    category: business_constraint
    check: "A user may hold at most one non-terminal (PENDING_VERIFICATION or VERIFIED) signature per petition"
    error_id: ERR_DUPLICATE_SIGNATURE
    http_status: 409
    applies_to: "POST /petitions/{id}/signatures"
  - priority: 17
    category: business_constraint
    check: "VICTORY closure requires verified_signature_count > 0 (checked first, ERR_NO_VERIFIED_SIGNATURES) and delivered_meeting_count >= 1 (checked second, ERR_NO_DELIVERY)"
    error_id: "ERR_NO_VERIFIED_SIGNATURES / ERR_NO_DELIVERY"
    http_status: 422
    applies_to: "POST /petitions/{id}/close (outcome=VICTORY)"
  - priority: 18
    category: business_fiscal
    check: "Donations only accepted when Campaign.status == ACTIVE"
    error_id: ERR_CAMPAIGN_SUSPENDED
    http_status: 409
    applies_to: "POST /campaigns/{id}/donations"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Users ----
  - { method: POST, path: "/users", description: "Register a user account", roles: [Guest], code: 201, input: [email, full_name, jurisdiction], output: User, side_effects: ["role_hint defaults to MEMBER"] }
  - { method: GET,  path: "/users/{id}", description: "Get a user", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: User, side_effects: [] }

  # ---- Petitions ----
  - { method: POST, path: "/petitions", description: "Create a petition (DRAFT)", roles: [Member], code: 201, input: [title, summary, body, category, goal, "eligible_jurisdiction?"], output: Petition, side_effects: ["status=DRAFT", "author_user_id = X-User-ID", "moderation_status=PENDING"] }
  - { method: GET,  path: "/petitions/{id}", description: "Get a petition", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: Petition, side_effects: [] }
  - { method: GET,  path: "/petitions", description: "List/filter petitions", roles: [Guest, Member, Moderator, Admin], code: 200, input: ["author_user_id?", "category?", "status?", "limit?", "offset?"], output: "Petition[]", side_effects: [] }
  - { method: PATCH, path: "/petitions/{id}", description: "Edit petition (DRAFT or CHANGES_REQUESTED only)", roles: [Member], code: 200, input: ["title?", "summary?", "body?", "goal?", "eligible_jurisdiction?", expected_petition_version], output: Petition, side_effects: ["increments Petition.version by 1"] }
  - { method: POST, path: "/petitions/{id}/submit", description: "Submit for review (DRAFT/CHANGES_REQUESTED -> UNDER_REVIEW)", roles: [Member], code: 200, input: [], output: Petition, side_effects: ["Petition state transition"] }
  - { method: POST, path: "/petitions/{id}/moderate", description: "Moderator decision on a petition", roles: [Moderator], code: 200, input: [decision, "note?"], output: Petition, side_effects: ["Petition state transition per decision", "sets moderation_status, published_at, milestone_thresholds on APPROVE"] }
  - { method: POST, path: "/petitions/{id}/close", description: "Author closes petition (VICTORY or WITHDRAWN)", roles: [Member], code: 200, input: [outcome], output: Petition, side_effects: ["closure_refund_cascade or withdrawal cascade"] }
  - { method: POST, path: "/petitions/{id}/target", description: "Set/replace the petition's decision-maker (supersede, OCC-guarded)", roles: [Member], code: 201, input: [name, title, office, "representative_id?", expected_petition_version], output: Target, side_effects: ["prior ACTIVE Target -> SUPERSEDED", "increments Petition.version by 1"] }

  # ---- Targets ----
  - { method: GET,  path: "/targets/{id}", description: "Get a target", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: Target, side_effects: [] }
  - { method: GET,  path: "/targets", description: "List/filter targets", roles: [Guest, Member, Moderator, Admin], code: 200, input: ["petition_id?", "representative_id?", "status?", "limit?", "offset?"], output: "Target[]", side_effects: [] }
  - { method: POST, path: "/targets/{id}/deactivate", description: "Mark a target UNREACHABLE (cancels its meetings)", roles: [Admin], code: 200, input: [], output: Target, side_effects: ["target_unreachable_cascade"] }

  # ---- Representatives (directory / lookup) ----
  - { method: POST, path: "/representatives", description: "Add a directory entry", roles: [Admin], code: 201, input: [full_name, office, jurisdiction, contact_email], output: Representative, side_effects: [] }
  - { method: GET,  path: "/representatives/{id}", description: "Get a representative", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: Representative, side_effects: [] }
  - { method: GET,  path: "/representatives", description: "Lookup representatives by jurisdiction/office", roles: [Guest, Member, Moderator, Admin], code: 200, input: ["jurisdiction?", "office?", "limit?", "offset?"], output: "Representative[]", side_effects: [] }

  # ---- Signatures ----
  - { method: POST, path: "/petitions/{id}/signatures", description: "Sign a petition (creates PENDING_VERIFICATION signature)", roles: [Member], code: 201, input: ["public_comment?"], output: Signature, side_effects: ["signer_user_id = X-User-ID", "verification_token issued", "Petition.pending_signature_count += 1"] }
  - { method: GET,  path: "/signatures/{id}", description: "Get a signature", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: Signature, side_effects: [] }
  - { method: GET,  path: "/signatures", description: "List/filter signatures", roles: [Guest, Member, Moderator, Admin], code: 200, input: ["petition_id?", "signer_user_id?", "status?", "limit?", "offset?"], output: "Signature[]", side_effects: [] }
  - { method: POST, path: "/signatures/{id}/verify", description: "Confirm a signature with its token", roles: [Member], code: 200, input: [verification_token], output: Signature, side_effects: ["Signature -> VERIFIED", "signature_tally + milestone_ladder recompute on Petition"] }
  - { method: POST, path: "/signatures/{id}/revoke", description: "Moderator revokes/rejects a signature (fraud)", roles: [Moderator], code: 200, input: ["reason?"], output: Signature, side_effects: ["Signature -> REVOKED or REJECTED", "signature_revoke_cascade"] }

  # ---- Comments & Updates ----
  - { method: POST, path: "/petitions/{id}/comments", description: "Post a comment (COMMENT->PENDING) or author update (UPDATE->APPROVED)", roles: [Member], code: 201, input: [body, "comment_type?"], output: Comment, side_effects: ["author_user_id = X-User-ID", "UPDATE type auto-APPROVED and requires caller be petition author"] }
  - { method: GET,  path: "/comments/{id}", description: "Get a comment/update", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: Comment, side_effects: [] }
  - { method: GET,  path: "/comments", description: "List/filter comments/updates", roles: [Guest, Member, Moderator, Admin], code: 200, input: ["petition_id?", "author_user_id?", "comment_type?", "status?", "limit?", "offset?"], output: "Comment[]", side_effects: [] }
  - { method: POST, path: "/comments/{id}/moderate", description: "Moderate a COMMENT (APPROVE/REJECT/DISMISS/REMOVE)", roles: [Moderator], code: 200, input: [decision], output: Comment, side_effects: ["Comment state transition; approved_comment_count adjust"] }
  - { method: POST, path: "/comments/{id}/flag", description: "Flag an APPROVED comment", roles: [Member], code: 200, input: ["reason?"], output: Comment, side_effects: ["Comment APPROVED -> FLAGGED; approved_comment_count -= 1"] }
  - { method: POST, path: "/comments/{id}/deliver", description: "Mark an APPROVED UPDATE delivered to signers", roles: [Member], code: 200, input: [], output: Comment, side_effects: ["delivered = true (UPDATE type, author only)"] }

  # ---- Campaign & Donations ----
  - { method: POST, path: "/petitions/{id}/campaign", description: "Create the petition's fundraising campaign (1:1)", roles: [Member], code: 201, input: [goal_cents], output: Campaign, side_effects: ["status=ACTIVE"] }
  - { method: GET,  path: "/campaigns/{id}", description: "Get a campaign", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: GET,  path: "/campaigns", description: "List/filter campaigns", roles: [Guest, Member, Moderator, Admin], code: 200, input: ["petition_id?", "status?", "limit?", "offset?"], output: "Campaign[]", side_effects: [] }
  - { method: POST, path: "/campaigns/{id}/moderate", description: "Suspend or reactivate a campaign", roles: [Moderator], code: 200, input: [action], output: Campaign, side_effects: ["Campaign state transition"] }
  - { method: POST, path: "/campaigns/{id}/donations", description: "Donate to a campaign (PENDING)", roles: [Member], code: 201, input: [amount_cents], output: Donation, side_effects: ["donor_user_id = X-User-ID", "gross_pledged_cents recompute"] }
  - { method: GET,  path: "/donations/{id}", description: "Get a donation", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: Donation, side_effects: [] }
  - { method: GET,  path: "/donations", description: "List/filter donations", roles: [Guest, Member, Moderator, Admin], code: 200, input: ["campaign_id?", "donor_user_id?", "status?", "limit?", "offset?"], output: "Donation[]", side_effects: [] }
  - { method: POST, path: "/donations/{id}/transition", description: "Payment transition (SETTLED/FAILED/REFUNDED)", roles: [Admin], code: 200, input: [to_status], output: Donation, side_effects: ["donation_fee_split on SETTLE; campaign_funds recompute"] }

  # ---- Promotions ----
  - { method: POST, path: "/promotions", description: "Buy a featured promotion slot for a petition", roles: [Member], code: 201, input: [petition_id, placement_tier, window_start, window_end], output: Promotion, side_effects: ["purchaser_user_id = X-User-ID", "category copied from petition", "promotion_price computed", "status=SCHEDULED"] }
  - { method: GET,  path: "/promotions/{id}", description: "Get a promotion", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: Promotion, side_effects: [] }
  - { method: GET,  path: "/promotions", description: "List/filter promotions", roles: [Guest, Member, Moderator, Admin], code: 200, input: ["petition_id?", "purchaser_user_id?", "category?", "status?", "limit?", "offset?"], output: "Promotion[]", side_effects: [] }
  - { method: POST, path: "/promotions/{id}/cancel", description: "Cancel a SCHEDULED promotion before its window (refund)", roles: [Member], code: 200, input: [], output: Promotion, side_effects: ["status=CANCELLED"] }

  # ---- Delivery Meetings ----
  - { method: POST, path: "/delivery-meetings", description: "Schedule a delivery meeting with a target", roles: [Member], code: 201, input: [petition_id, target_id, window_start, window_end], output: DeliveryMeeting, side_effects: ["status=REQUESTED"] }
  - { method: GET,  path: "/delivery-meetings/{id}", description: "Get a delivery meeting", roles: [Guest, Member, Moderator, Admin], code: 200, input: [], output: DeliveryMeeting, side_effects: [] }
  - { method: GET,  path: "/delivery-meetings", description: "List/filter delivery meetings", roles: [Guest, Member, Moderator, Admin], code: 200, input: ["petition_id?", "target_id?", "status?", "limit?", "offset?"], output: "DeliveryMeeting[]", side_effects: [] }
  - { method: POST, path: "/delivery-meetings/{id}/transition", description: "Advance a meeting (CONFIRMED/DELIVERED/CANCELLED)", roles: [Member, Admin], code: 200, input: [to_status], output: DeliveryMeeting, side_effects: ["state transition; delivered_meeting_count += 1 on DELIVERED"] }

  # ---- Test-driving ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z (before any set call the clock reads exactly this default, never real wall-clock).", roles: [Admin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced; promotion SCHEDULED/ACTIVE/COMPLETED derived on read"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers on a protected endpoint" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range integer, window_end <= window_start" }
  - { id: ERR_USER_NOT_FOUND, http: 404, condition: "Referenced user id does not exist" }
  - { id: ERR_PETITION_NOT_FOUND, http: 404, condition: "Referenced petition id does not exist" }
  - { id: ERR_TARGET_NOT_FOUND, http: 404, condition: "Referenced target id does not exist" }
  - { id: ERR_REPRESENTATIVE_NOT_FOUND, http: 404, condition: "Referenced representative id does not exist" }
  - { id: ERR_SIGNATURE_NOT_FOUND, http: 404, condition: "Referenced signature id does not exist" }
  - { id: ERR_COMMENT_NOT_FOUND, http: 404, condition: "Referenced comment id does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "Referenced campaign id does not exist" }
  - { id: ERR_DONATION_NOT_FOUND, http: 404, condition: "Referenced donation id does not exist" }
  - { id: ERR_PROMOTION_NOT_FOUND, http: 404, condition: "Referenced promotion id does not exist" }
  - { id: ERR_MEETING_NOT_FOUND, http: 404, condition: "Referenced delivery meeting id does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member acting on a resource they do not own (author/signer/purchaser mismatch)" }
  - { id: ERR_STALE_PETITION_VERSION, http: 412, condition: "expected_petition_version != Petition.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not legal from the resource's current state" }
  - { id: ERR_PETITION_NOT_PUBLISHED, http: 409, condition: "Signing or verifying requires the petition to be PUBLISHED" }
  - { id: ERR_PETITION_NOT_PROMOTABLE, http: 403, condition: "Petition is not APPROVED/PUBLISHED and cannot be promoted" }
  - { id: ERR_CONTENT_NOT_MODERATABLE, http: 409, condition: "Comment is not in a moderatable state/type for the decision" }
  - { id: ERR_JURISDICTION_MISMATCH, http: 422, condition: "Signer jurisdiction does not match petition.eligible_jurisdiction" }
  - { id: ERR_INVALID_VERIFICATION_TOKEN, http: 422, condition: "Submitted verification token does not match" }
  - { id: ERR_PROMO_SLOT_UNAVAILABLE, http: 409, condition: "Category's concurrent featured-slot capacity exceeded for the requested window" }
  - { id: ERR_MEETING_CONFLICT, http: 409, condition: "Meeting window collides (within buffer) with an existing meeting on the target" }
  - { id: ERR_TARGET_UNREACHABLE, http: 409, condition: "Target is UNREACHABLE; cannot confirm/deliver" }
  - { id: ERR_DUPLICATE_SIGNATURE, http: 409, condition: "User already holds a non-terminal signature on the petition" }
  - { id: ERR_NO_VERIFIED_SIGNATURES, http: 422, condition: "VICTORY closure attempted with zero verified signatures" }
  - { id: ERR_NO_DELIVERY, http: 422, condition: "VICTORY closure attempted with no DELIVERED meeting" }
  - { id: ERR_CAMPAIGN_SUSPENDED, http: 409, condition: "Donation attempted while campaign is SUSPENDED or CLOSED" }
  - { id: ERR_PROMO_NOT_CANCELLABLE, http: 409, condition: "Promotion cannot be cancelled (not SCHEDULED or window already started)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Guest
    description: "Unauthenticated visitor / self-registration. Can register and read public resources."
    identity: "opaque"
    exclusive_operations:
      - "POST /users — register account"
    shared_operations:
      - "GET reads of petitions, signatures, comments, campaigns, donations, promotions, targets, representatives, delivery-meetings, users"
  - name: Member
    description: "Registered user; authors petitions, signs, comments, donates, promotes, schedules deliveries. Owns their content."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /petitions — create petition"
      - "PATCH /petitions/{id} — edit own petition"
      - "POST /petitions/{id}/submit — submit own petition"
      - "POST /petitions/{id}/close — close own petition"
      - "POST /petitions/{id}/target — set own petition's target"
      - "POST /petitions/{id}/signatures — sign"
      - "POST /signatures/{id}/verify — confirm own signature"
      - "POST /petitions/{id}/comments — comment / post update"
      - "POST /comments/{id}/flag — flag a comment"
      - "POST /comments/{id}/deliver — deliver own update"
      - "POST /petitions/{id}/campaign — create own campaign"
      - "POST /campaigns/{id}/donations — donate"
      - "POST /promotions — buy promotion"
      - "POST /promotions/{id}/cancel — cancel own promotion"
      - "POST /delivery-meetings — schedule delivery"
    shared_operations:
      - "POST /delivery-meetings/{id}/transition — DELIVERED/CANCELLED (author) shared with Admin"
      - "GET reads (all public)"
  - name: Moderator
    description: "Content moderator; reviews petitions, moderates comments, revokes fraudulent signatures, suspends campaigns."
    identity: "opaque"
    exclusive_operations:
      - "POST /petitions/{id}/moderate — approve/request-changes/remove"
      - "POST /signatures/{id}/revoke — revoke/reject a signature"
      - "POST /comments/{id}/moderate — approve/reject/dismiss/remove"
      - "POST /campaigns/{id}/moderate — suspend/reactivate"
    shared_operations:
      - "GET reads (all public)"
  - name: Admin
    description: "Platform operator; manages the representative directory, target reachability, payment settlement/refunds, delivery confirmations, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /representatives — manage directory"
      - "POST /targets/{id}/deactivate — mark target unreachable"
      - "POST /donations/{id}/transition — settle/fail/refund payments"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /delivery-meetings/{id}/transition — CONFIRMED/CANCELLED shared with Member"
      - "GET reads (all public)"

# =============================================================================
# Named cascade chains (referenced by §1.2 side_effects; documented for PRD)
# =============================================================================
cascades:
  closure_refund_cascade:
    origin: "POST /petitions/{id}/close (VICTORY or WITHDRAWN), depth 3"
    chain:
      - "link1: Petition -> CLOSED_VICTORY/CLOSED_WITHDRAWN mutates the petition's Campaign: Campaign -> CLOSED"
      - "link2: Campaign -> CLOSED mutates each PENDING Donation: Donation -> REFUNDED"
      - "link3: each Donation -> REFUNDED recomputes Campaign.funds_raised_cents (net_settled variant); a PENDING donation had zero settled net, so funds_raised_cents is conserved"
    note: "The observable depth-3 money chain; PENDING donations contribute 0 net so funds_raised_cents stays put, and any SETTLED donation refunded here reverses its net exactly (compensating_invariant)."
  target_unreachable_cascade:
    origin: "POST /targets/{id}/deactivate, depth 2"
    chain:
      - "link1: Target -> UNREACHABLE mutates each {REQUESTED, CONFIRMED} DeliveryMeeting for the target: DeliveryMeeting -> CANCELLED"
      - "link2: a DeliveryMeeting that was DELIVERED is terminal and untouched, so Petition.delivered_meeting_count is unchanged; cancelled non-delivered meetings never contributed to it"
  signature_revoke_cascade:
    origin: "POST /signatures/{id}/revoke on a VERIFIED signature, depth 2"
    chain:
      - "link1: Signature VERIFIED -> REVOKED mutates Petition.verified_signature_count (-1)"
      - "link2: the decremented count recomputes Petition.goal_reached and milestones_reached"
