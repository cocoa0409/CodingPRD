        distinguishing_aspect: "The outcome window is [period_start, period_end): a referral completed exactly at period_end is EXCLUDED while one completed at period_start is INCLUDED."
        test_recipe:
          setup:
            - "Two clients each with REFERRAL_SHARE consent and a case; two orgs; r1 completed at clock 2026-08-01T00:00:00Z (== period_start), r2 completed at clock 2026-09-01T00:00:00Z (== period_end)"
