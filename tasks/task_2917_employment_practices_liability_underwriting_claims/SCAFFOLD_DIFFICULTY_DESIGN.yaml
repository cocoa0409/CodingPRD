      - name: panel_candidate_pool_empties_at_capacity_one
        grounds:
          - calculations.panel_firm_selection
          - validations[priority=21]
          - errors.ERR_NO_ELIGIBLE_PANEL_FIRM
          - entities.DefensePanelFirm.fields.capacity_open_matters
          - endpoints["POST /epli/claims/{claim_id}/defense-assignments"]
        distinguishing_aspect: |
          Metric: the CARDINALITY of the auto-selection candidate pool as it crosses from
          one to zero, exercised on `POST /epli/claims/{claim_id}/defense-assignments` —
          a different metric and a different endpoint from the exposure-score threshold.
          Only one firm covers CA and its capacity_open_matters is 1; a second matter
          whose engagement window overlaps the first leaves an empty pool and must
          return ERR_NO_ELIGIBLE_PANEL_FIRM, while an engagement window starting exactly
          at the incumbent matter's engagement_to leaves the pool at cardinality one and
          succeeds. An implementation that counts capacity globally instead of over the
          overlapping window rejects the second, disjoint request too.
        test_recipe:
          setup:
            - "Chain P (CA T4 / TX T2, ACTIVE RatePlan, 'Northgate Retail Group', policy ACTIVE for [2026-08-01, 2027-08-01)) but with only ONE panel firm on the panel: 'Harbor Coast Counsel LLP' (LOCAL, CA only, 70000 / 43000 / 16000, capacity_open_matters 1)."
