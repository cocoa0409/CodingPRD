          The listing filters are independent and combinable: movement_status DELIVERED selects only LOAD_CRD1,
          while pay_status UNPAID selects LOAD_CRD2 and LOAD_CRD3 - the delivered load has already moved to
          ACCRUED, so a handler that treated the two axes as one field returns the wrong partition. The read of
          a well-formed but unknown UUID must be ERR_LOAD_NOT_FOUND at 404 rather than an empty 200.
