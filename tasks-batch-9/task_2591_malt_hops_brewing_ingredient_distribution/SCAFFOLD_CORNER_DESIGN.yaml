          trigger:
            - call: "POST /sales-orders/${mm_o_id}/lines"
              payload: { item_type: "HOP", quantity: 1000, uom: "LB", allocation_source: "CONTRACT", hop_variety_id: "${mm_citra_id}", hop_contract_id: "${mm_k_id}" }
              as: AllocationManager
              captures: { mm_err: $.data.error_id }
          assert:
            - "HTTP 422 with ${mm_err} == ERR_CONTRACT_BREWER_MISMATCH"
            - "SalesOrder.${mm_o_id}.line_count == 0 and HopContract.${mm_k_id}.committed_lbs == 0"
            - "the same call made by the Brewer role with X-User-ID == ${mm_a_id} returns 403 ERR_BREWER_SCOPE_VIOLATION instead, because priority 6 outranks priority 8"
            - "repeating the call with brewer B's own DRAFT order succeeds, proving the refusal is about ownership and not about the contract itself"

      - name: line_reference_must_match_the_declared_item_type
