            - "EducationAward.${edu_a}.status == EXPIRED after the late attempt (deadline-passed side effect of the p24 check)"
            - "EducationAward.${edu_a}.remaining_balance_cents == 739500 (no debit; the first use was only PENDING_APPROVAL)"
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_activation_gated_on_check
        grounds:
          - state_machines.MemberEnrollment.PENDING_CHECKS_to_ACTIVE
          - state_machines.CriminalHistoryCheck.PENDING_to_CLEARED
          - validations[priority=10]
        distinguishing_aspect: "Entity pair MemberEnrollment x CriminalHistoryCheck: an enrollment created while the check is PENDING sits in PENDING_CHECKS and rejects hour entries with ERR_ENROLLMENT_NOT_ACTIVE; only the check's adjudication to CLEARED auto-activates the enrollment and fills the slot."
        test_recipe:
          setup:
            - "Award ACTIVE with 2 FULL_TIME slots. Member A registered; check initiated but NO component results recorded yet; enrollment created (PENDING_CHECKS)."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - *d_app_2ft_4m
            - *d_submit
