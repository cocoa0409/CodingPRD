      - name: grade_change_gap_inclusive_against_computed_transition_minutes
        grounds:
          - validations.priority_64
          - errors.ERR_TRANSITION_GAP_TOO_SHORT
          - calculations.grade_change_transition_waste
          - calculations.grade_change_transition_waste.variants.sequence_direction
          - entities.GradeChange.fields.transition_minutes
          - validations.priority_38
        distinguishing_aspect: |
          Interval semantics: the resource is the IDLE GAP between two run windows, and the
          required length is itself computed (waste tonnage -> minutes -> plus the machine buffer),
          with the comparison inclusive. On PM2 the TL_140 -> MED_112 transition runs down the
          rank order, so UPSEQUENCE_MULT lifts the waste from 2.500 to 2.875 tons and the required
