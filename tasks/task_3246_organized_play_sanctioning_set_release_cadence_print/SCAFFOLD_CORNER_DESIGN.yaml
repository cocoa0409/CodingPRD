# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3246_organized_play_sanctioning_set_release_cadence_print
#
# Breadth probe. Enumerates every testable claim the §1.1–§1.7 surface declares
# that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that
# §1.8 already covers appear as `excluded_because:` stubs with no test_recipe.
# Sections and claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: store_creation_applies_system_defaults_and_mints_identity
        claim_type: Creation
        grounds:
          - entities.Store.fields.status
          - entities.Store.fields.reporting_tier
          - entities.Store.fields.tp_balance
        distinguishing_aspect: "A store posted with only name, region_code and the two capacities comes back 201 with status ACTIVE, reporting_tier STANDARD, tp_balance 0, reporting_violation_points 0, version 1 and server-minted id / created_at / updated_at."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/stores"
              payload: { name: "Portland Play Lab", region_code: "US-NORTH", daily_event_capacity: 4, event_space_capacity: 6 }
              as: OpsAdmin
              captures: { store_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Store.${store_id}.status == ACTIVE and Store.${store_id}.reporting_tier == STANDARD"
            - "Store.${store_id}.tp_balance == 0 and Store.${store_id}.reporting_violation_points == 0"
            - "Store.${store_id}.version == 1"
            - "Store.${store_id}.name == \"Portland Play Lab\" and Store.${store_id}.region_code == \"US-NORTH\""
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: set_release_round_trips_through_the_collection_read
        claim_type: Retrieval
        grounds:
          - entities.SetRelease.fields.prerelease_start_date
          - entities.SetRelease.fields.street_date
          - endpoints.GET_/op/set-releases
        distinguishing_aspect: "Every SetRelease field round-trips unchanged through GET /op/set-releases, including the prerelease weekend bounds and the street date, and the release starts in ANNOUNCED."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/set-releases"
              payload: { set_code: "RT1", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
          trigger:
            - call: "GET /op/set-releases"
              payload: { limit: 10, offset: 0 }
              as: Judge
          assert:
            - "the response is an array containing exactly one SetRelease whose id is ${set_id}"
            - "that row reports set_code \"RT1\", prerelease_end_date \"2026-09-13T23:59:59Z\" and street_date \"2026-09-18T00:00:00Z\""
            - "that row reports status ANNOUNCED before the clock ever reaches the prerelease window"

      - name: store_get_on_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/op/event-applications/{id}
        distinguishing_aspect: "Reading a resource under a well-formed but absent UUID returns the 404 error envelope with ERR_NOT_FOUND rather than an empty success body."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "GET /op/event-applications/11111111-2222-4333-8444-555555555555"
              as: Judge
              captures: { eid: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "${eid} == \"ERR_NOT_FOUND\""
            - "the error envelope carries a non-empty message field"

      - name: event_application_creation_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.EventApplication.fields.format_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting format_code from POST /op/event-applications is a request-shape failure at priority 3 and returns 400 ERR_INVALID_REQUEST before any existence or state check runs."
        test_recipe:
          setup:
            - "One store, one set release and one FIXED format exist."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Portland Play Lab", region_code: "US-NORTH", daily_event_capacity: 4, event_space_capacity: 6 }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /op/set-releases"
              payload: { set_code: "RT2", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
          trigger:
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "the response status is 400 and ${eid} == \"ERR_INVALID_REQUEST\""
            - "no EventApplication row was created: GET /op/event-applications with store_id ${store_id} reports total_count 0"

      - name: event_application_listing_reports_pagination_metadata
        claim_type: Listing
        grounds:
          - endpoints.GET_/op/event-applications
          - response_envelope.pagination_fields
        distinguishing_aspect: "The filtered list endpoint honours limit and offset and reports total_count for the full filtered set, so total_count exceeds the page length while has_more reflects the remaining rows."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one FIXED format, three LOCAL applications on three different calendar days."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Portland Play Lab", region_code: "US-NORTH", daily_event_capacity: 4, event_space_capacity: 6 }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /op/set-releases"
              payload: { set_code: "RT3", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-27T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-28T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
          trigger:
            - call: "GET /op/event-applications"
              payload: { store_id: "${store_id}", limit: 2, offset: 0 }
              as: Judge
          assert:
            - "the response status is 200 and response_type is array"
            - "data has exactly 2 rows while total_count == 3 and has_more == true"
            - "every returned row reports store_id ${store_id} and tier LOCAL"
            - "the response echoes limit 2 and offset 0"

      - name: store_derived_tp_balance_matches_open_allocation_remaining
        claim_type: Computed Fields
        grounds:
          - entities.Store.fields.tp_balance
          - calculations.prize_pool_remaining
          - entities.PrizeAllocation.fields.remaining_tp
        distinguishing_aspect: "Store.tp_balance is a cross-entity derived field: after a 25-point draw on a 96-point CHAMPIONSHIP pool it reads 71, and it moves again the moment a compensating void restores the points."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one FIXED format, one CHAMPIONSHIP application approved with six redeemed DIGITAL codes and an AVAILABLE DIGITAL invitation, giving base_tp 120."
            - "One PROPOSED distribution of 25 points on that pool."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Portland Play Lab", region_code: "US-NORTH", daily_event_capacity: 4, event_space_capacity: 6 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "RT4", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "CHAMPIONSHIP", scheduled_date: "2026-10-03T18:00:00Z", expected_headcount: 60 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM-0", code_kind: "DIGITAL", event_application_id: "${app_id}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM-1", code_kind: "DIGITAL", event_application_id: "${app_id}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM-2", code_kind: "DIGITAL", event_application_id: "${app_id}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM-3", code_kind: "DIGITAL", event_application_id: "${app_id}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM-4", code_kind: "DIGITAL", event_application_id: "${app_id}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM-5", code_kind: "DIGITAL", event_application_id: "${app_id}" }
              as: OpsAdmin
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "CHM-1", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "CHM-2", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "CHM-3", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "CHM-4", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "CHM-5", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/prize-distributions"
              payload: { prize_allocation_id: "${alloc_id}", recipient_ref: "PLAYER-25", quantity: 25 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /op/prize-distributions/${dist_id}/transition"
              payload: { action: "PASS" }
              as: OpsAdmin
            - call: "GET /op/stores"
              payload: { limit: 10, offset: 0 }
              as: OpsAdmin
          assert:
            - "PrizeAllocation.${alloc_id}.base_tp == 120 and PrizeAllocation.${alloc_id}.remaining_tp == 95"
            - "the listed Store ${store_id} reports tp_balance == 95, matching remaining_tp exactly"
            - "Store.${store_id}.reporting_violation_points == 0 because no enforcement case exists"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: event_application_starts_submitted_and_rejects_double_approval
        claim_type: Initial State
        grounds:
          - state_machines.EventApplication.status.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A freshly posted application is SUBMITTED with prizing_report_status NOT_DUE, and a second APPROVE from APPROVED is rejected with ERR_INVALID_STATE without creating a second pool."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one FIXED format, one LOCAL application just posted."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Portland Play Lab", region_code: "US-NORTH", daily_event_capacity: 4, event_space_capacity: 6 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "RT5", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
          trigger:
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "the fresh application reported status SUBMITTED and prizing_report_status NOT_DUE before approval"
            - "the response status is 409 and ${eid} == \"ERR_INVALID_STATE\""
            - "EventApplication.${app_id}.prize_allocation_id is still ${alloc_id}, so no second pool was created"

      - name: denied_application_is_terminal_against_later_approval
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.EventApplication.transitions.SUBMITTED_to_DENIED
          - entities.EventApplication.fields.status
        distinguishing_aspect: "DENIED is in terminal_states, so no forward transition out of it is available and a later APPROVE attempt on the same row is refused."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one FIXED format, one QUALIFIER application denied in setup."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Portland Play Lab", region_code: "US-NORTH", daily_event_capacity: 4, event_space_capacity: 6 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "RT6", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "QUALIFIER", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 30 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "DENY" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "the response status is 409 and ${eid} == \"ERR_INVALID_STATE\""
            - "EventApplication.${app_id}.status == DENIED and EventApplication.${app_id}.prize_allocation_id is null"
            - "no PrizeAllocation exists for ${app_id}: GET /op/prize-allocations filtered by event_application_id ${app_id} reports total_count 0"

      - name: set_release_cannot_move_from_prerelease_straight_to_retired
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SetRelease.status.PRERELEASE_to_RELEASED
          - state_machines.SetRelease.transitions.RELEASED_to_RETIRED
        distinguishing_aspect: "RETIRE requires status RELEASED, so issuing it while the release is still PRERELEASE is refused and the release stays in its cadence position."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-12T12:00:00Z, inside the prerelease weekend, so the release sits at PRERELEASE."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/set-releases"
              payload: { set_code: "RT7", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T12:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/set-releases/${set_id}/transition"
              payload: { action: "RETIRE" }
              as: OpsAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "the response status is 409 and ${eid} == \"ERR_INVALID_STATE\""
            - "SetRelease.${set_id}.status == PRERELEASE"
            - "advancing the clock to 2026-09-18T00:00:00Z makes the same RETIRE call succeed because RELEASED has been reached in between"

      - name: allocation_order_denied_when_print_run_exhausted
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AllocationOrder.transitions.PENDING_to_DENIED
          - errors[ERR_PRINT_RUN_EXHAUSTED]
        distinguishing_aspect: "Two different failures from the same endpoint: DENY succeeds only once units_available is exactly 0, and APPROVE on the same row fails with ERR_PRINT_RUN_EXHAUSTED while units are still positive but insufficient."
        test_recipe:
          setup:
            - "One store, one set release, one COLLECTOR_BOOSTER configuration with print_run_units 10, and two PENDING allocation orders of 8 units each."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Portland Play Lab", region_code: "US-NORTH", daily_event_capacity: 4, event_space_capacity: 6 }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /op/set-releases"
              payload: { set_code: "RT8", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/product-configurations"
              payload: { set_release_id: "${set_id}", configuration_kind: "COLLECTOR_BOOSTER", pack_count: 12, print_run_units: 10 }
              as: OpsAdmin
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "POST /op/allocation-orders"
              payload: { distributor_name: "Cascade Distribution", product_configuration_id: "${cfg_id}", quantity: 8 }
              as: Distributor
              captures: { ord_a: $.data.id }
            - call: "POST /op/allocation-orders"
