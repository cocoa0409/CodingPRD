              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a18_id: "$.data.id" }
            - call: "GET /allotments/${c_a18_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_a18_ver: "$.data.version" }
          trigger:
            - call: "POST /permit-decisions"
              payload: { decision_type: "STOCKING_ADJUSTMENT", allotment_id: "${c_a18_id}", expected_allotment_version: "${c_a18_ver}", nepa_level: "CX", adjustment_pct: 0.2, effective_date: "2026-09-01" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_d1_id: "$.data.id" }
          assert:
