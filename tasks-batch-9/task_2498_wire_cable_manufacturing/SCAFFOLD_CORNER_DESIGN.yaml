      - name: rod_lot_and_sku_lists_filter_on_status_metal_and_dependency
        claim_type: standard_crud
        grounds:
          - endpoints[GET /rod-purchase-lots]
          - endpoints[GET /catalog-products]
          - state_machines.RodPurchaseLot.transitions.RECEIVED_to_CONSUMED
        distinguishing_aspect: "Both list endpoints filter on a COMPUTED status, so the filter result changes without anyone writing to the filtered field: exhausting a rod lot to remaining_lbs 0.00 moves it out of the status=RECEIVED page by itself, and releasing a SKU moves it out of status=DRAFT."
