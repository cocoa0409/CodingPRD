# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2323 — Public Charging Network Reliability & Uptime Compliance
#
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every numeric literal in an `assert:` line below was produced by executing the
# corresponding §1.3 `formula:` with its declared `constants:` as code.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — Dual-variant calculations across DIFFERENT entity domains
  #   instance 1: minutes / UptimeReport domain
  #   instance 2: money  / CustomerComplaint domain
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: uptime_provisional_and_final_variants_diverge_on_identical_outage_rows
        grounds:
          - calculations.station_uptime_percentage
          - state_machines.UptimeReport.transitions.DRAFT_to_PROVISIONAL
          - state_machines.UptimeReport.transitions.PROVISIONAL_to_FINAL
          - entities.UptimeReport.fields.methodology
          - entities.UptimeReport.fields.uptime_pct
          - entities.UptimeReport.fields.excluded_minutes
          - endpoints[POST /uptime-reports/{uptime_report_id}/compute-provisional]
          - endpoints[POST /uptime-reports/{uptime_report_id}/finalize]
        distinguishing_aspect: |
          This instance is the MINUTES/UptimeReport domain of dual-variant logic: over one
          identical row set (T = 86400 port-minutes, E = 1440 excluded, D = 720 billable) the
          PROVISIONAL variant keeps E in the denominator and yields 97.50 while the FINAL
          variant removes E from the denominator and yields 99.15 — a 1.65 percentage-point
          divergence produced purely by the denominator choice.
        test_recipe:
          setup:
            - "Logical clock walked from 2026-05-01T00:00:00Z forward to 2026-07-15T00:00:00Z."
            - "HostSite HS-UP-1 with agreement_status EXECUTED, power_upgrade_status ENERGIZED, parking_enforcement_mode TOWING_ENFORCED, committed_service_capacity_kw 800.00, access_hours_mode TWENTY_FOUR_SEVEN."
            - "Station ST-UP-1 (DCFC_150, declared_port_count 2, corridor_designated false) in status OPERATIONAL, payment_interop_score 100.00, installed_power_kw 300.00."
            - "Two ChargingPorts DS-UP-1 and DS-UP-2, both created at 2026-05-01T00:00:00Z (i.e. at or before period_start), both terminal_certification_status CERTIFIED, both service_state IN_SERVICE."
            - "OutageEvent A on DS-UP-1: MINOR, detected_at 2026-06-05T00:00:00Z, cleared_at 2026-06-06T00:00:00Z (1440 minutes), state EXCLUDED with excluded_cause_claim UTILITY_OUTAGE."
            - "OutageEvent B on DS-UP-2: MINOR, detected_at 2026-06-10T00:00:00Z, cleared_at 2026-06-10T12:00:00Z (720 minutes), state RESOLVED (never excluded)."
            - "UptimeReport for ST-UP-1 over the CLOSED period 2026-06-01T00:00:00Z .. 2026-07-01T00:00:00Z (43200 minutes) in state DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-UP-1", host_org_name: "Riverside Retail LLC", committed_service_capacity_kw: 800.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-UP-1", power_class: "DCFC_150", declared_port_count: 2, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-UP-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "NACS", rated_power_kw: 150.00, dispenser_serial: "DS-UP-2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p2_id: $.data.id }
            - call: "POST /charging-ports/${p1_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /charging-ports/${p2_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            # ---- OutageEvent A: 1440 minutes, later EXCLUDED --------------------
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-05T02:00:00Z" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p1_id}", fault_code: "OCPP-UTIL-01", fault_class: "MINOR", detected_at: "2026-06-05T00:00:00Z", excluded_cause_claim: "UTILITY_OUTAGE" }
              as: NetworkOperator
              captures: { oa_id: $.data.id }
            - call: "POST /outage-events/${oa_id}/classify"
              payload: { fault_class: "MINOR", excluded_cause_claim: "UTILITY_OUTAGE" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${oa_id}", port_id: "${p1_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-06-05T01:00:00Z", window_end_at: "2026-06-05T23:00:00Z" }
              as: NetworkOperator
              captures: { da_id: $.data.id }
            - call: "POST /maintenance-dispatches/${da_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /maintenance-dispatches/${da_id}/progress"
              payload: { event: "ARRIVE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-06T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches/${da_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /outage-events/${oa_id}/exclusion-actions"
              payload: { action: "REQUEST", excluded_cause_claim: "UTILITY_OUTAGE" }
              as: NetworkOperator
            - call: "POST /outage-events/${oa_id}/exclusion-actions"
              payload: { action: "APPROVE" }
              as: ComplianceAuditor
            # ---- OutageEvent B: 720 minutes, stays RESOLVED ---------------------
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-10T02:00:00Z" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p2_id}", fault_code: "OCPP-COMM-07", fault_class: "MINOR", detected_at: "2026-06-10T00:00:00Z" }
              as: NetworkOperator
              captures: { ob_id: $.data.id }
            - call: "POST /outage-events/${ob_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${ob_id}", port_id: "${p2_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-06-10T01:00:00Z", window_end_at: "2026-06-10T11:00:00Z" }
              as: NetworkOperator
              captures: { db_id: $.data.id }
            - call: "POST /maintenance-dispatches/${db_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /maintenance-dispatches/${db_id}/progress"
              payload: { event: "ARRIVE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-10T12:00:00Z" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches/${db_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            # ---- reporting period ------------------------------------------------
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: NetworkOperator
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /uptime-reports/${rp_id}/compute-provisional"
              payload: {}
              as: NetworkOperator
            - call: "POST /uptime-reports/${rp_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "after compute-provisional: UptimeReport.${rp_id}.state == PROVISIONAL"
            - "after compute-provisional: UptimeReport.${rp_id}.methodology == PROVISIONAL"
            - "after compute-provisional: UptimeReport.${rp_id}.eligible_port_count == 2"
            - "after compute-provisional: UptimeReport.${rp_id}.total_port_minutes == 86400"
            - "after compute-provisional: UptimeReport.${rp_id}.excluded_minutes == 1440"
            - "after compute-provisional: UptimeReport.${rp_id}.billable_downtime_minutes == 720"
            - "after compute-provisional: UptimeReport.${rp_id}.uptime_pct == 97.50"
            - "after finalize: UptimeReport.${rp_id}.state == FINAL"
            - "after finalize: UptimeReport.${rp_id}.methodology == FINAL"
            - "after finalize: UptimeReport.${rp_id}.uptime_pct == 99.15"
            - "after finalize: UptimeReport.${rp_id}.excluded_minutes == 1440 (unchanged — only the denominator changed)"
            - "after finalize: UptimeReport.${rp_id}.total_port_minutes == 86400 (unchanged)"
            - "after finalize: UptimeReport.${rp_id}.finalized_by_user_id == \"auditor-1\""
            - "Station.${st_id}.gross_downtime_minutes_lifetime == 2160"
            - "Station.${st_id}.excluded_downtime_minutes_lifetime == 1440"
            - "Station.${st_id}.billable_downtime_minutes_lifetime == 720"

      - name: session_refund_energy_prorated_and_goodwill_variants_diverge_on_identical_sessions
        grounds:
          - calculations.session_refund_amount
          - state_machines.CustomerComplaint.transitions.NONE_to_REQUESTED
          - entities.CustomerComplaint.fields.refund_basis
          - entities.CustomerComplaint.fields.refund_amount_cents
          - entities.CustomerComplaint.fields.retained_amount_cents
          - endpoints[POST /customer-complaints/{complaint_id}/refund-requests]
        distinguishing_aspect: |
          This instance is the MONEY/CustomerComplaint domain of dual-variant logic — a
          different entity domain from the UptimeReport minutes variant: two complaints
          carrying byte-identical session fields (1850 cents charged, 12.500 kWh at 48
          cents/kWh, 250 cents idle fee) yield refund_amount_cents 1000 under
          ENERGY_PRORATED and 1850 under FULL_SESSION_GOODWILL, because the prorated basis
          subtracts both the 600-cent energy component and the idle fee while goodwill
          subtracts neither.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T12:00:00Z."
            - "HostSite HS-RF-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-RF-1 (DCFC_150, declared_port_count 1) in status SUSPENDED with suspension_source AUTOMATIC, payment_interop_score 100.00."
            - "ChargingPort DS-RF-1 CERTIFIED, service_state OUT_OF_SERVICE (a CRITICAL fault is open on it)."
            - "OutageEvent CRITICAL on DS-RF-1, detected_at 2026-06-20T09:00:00Z, cleared_at null, state DETECTED."
            - "Two CustomerComplaints C1 and C2 on that port, both state TRIAGED and linked to the CRITICAL outage, both with session_started_at 2026-06-20T09:30:00Z, session_ended_at 2026-06-20T10:00:00Z, session_energy_kwh 12.500, session_price_per_kwh_cents 48, session_idle_fee_cents 250, session_charged_cents 1850, refund_state NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-20T08:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-RF-1", host_org_name: "Beacon Plaza Holdings", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-RF-1", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-RF-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-20T12:00:00Z" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-CRIT-02", fault_class: "CRITICAL", detected_at: "2026-06-20T09:00:00Z" }
              as: NetworkOperator
              captures: { oc_id: $.data.id }
            - call: "POST /customer-complaints"
              payload: { station_id: "${st_id}", port_id: "${p_id}", complaint_type: "SESSION_FAILED", session_started_at: "2026-06-20T09:30:00Z", session_ended_at: "2026-06-20T10:00:00Z", session_energy_kwh: 12.500, session_price_per_kwh_cents: 48, session_charged_cents: 1850, session_idle_fee_cents: 250 }
              as: CustomerSupportAgent
              captures: { c1_id: $.data.id }
            - call: "POST /customer-complaints/${c1_id}/triage"
              payload: { disposition: "LINK_OUTAGE", linked_outage_event_id: "${oc_id}" }
              as: CustomerSupportAgent
            - call: "POST /customer-complaints"
              payload: { station_id: "${st_id}", port_id: "${p_id}", complaint_type: "SESSION_FAILED", session_started_at: "2026-06-20T09:30:00Z", session_ended_at: "2026-06-20T10:00:00Z", session_energy_kwh: 12.500, session_price_per_kwh_cents: 48, session_charged_cents: 1850, session_idle_fee_cents: 250 }
              as: CustomerSupportAgent
              captures: { c2_id: $.data.id }
            - call: "POST /customer-complaints/${c2_id}/triage"
              payload: { disposition: "LINK_OUTAGE", linked_outage_event_id: "${oc_id}" }
              as: CustomerSupportAgent
          trigger:
            - call: "POST /customer-complaints/${c1_id}/refund-requests"
              payload: { refund_basis: "ENERGY_PRORATED" }
              as: CustomerSupportAgent
            - call: "POST /customer-complaints/${c2_id}/refund-requests"
              payload: { refund_basis: "FULL_SESSION_GOODWILL" }
              as: CustomerSupportAgent
          assert:
            - "CustomerComplaint.${c1_id}.refund_basis == ENERGY_PRORATED"
            - "CustomerComplaint.${c1_id}.refund_amount_cents == 1000"
            - "CustomerComplaint.${c1_id}.retained_amount_cents == 850"
            - "CustomerComplaint.${c1_id}.refund_state == REQUESTED"
            - "CustomerComplaint.${c2_id}.refund_basis == FULL_SESSION_GOODWILL"
            - "CustomerComplaint.${c2_id}.refund_amount_cents == 1850"
            - "CustomerComplaint.${c2_id}.retained_amount_cents == 0"
            - "CustomerComplaint.${c2_id}.refund_state == REQUESTED"
            - "CustomerComplaint.${c1_id}.refund_amount_cents != CustomerComplaint.${c2_id}.refund_amount_cents over byte-identical session inputs"
            - "CustomerComplaint.${c1_id}.state == TRIAGED and CustomerComplaint.${c2_id}.state == TRIAGED (the refund dimension moved independently of the triage dimension)"

  # ===========================================================================
  # RULE 2 — Combinatorial formulas across DIFFERENT modes
  #   instance 1: mode (a) nested min/max + conditional branches, >=3 inputs
  #   instance 2: mode (b) pinned per-line-item rounding order
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: dispatch_deadline_mode_a_nested_min_max_then_restricted_access_window_push
        grounds:
          - calculations.dispatch_response_deadline
          - entities.MaintenanceDispatch.fields.response_deadline_at
          - entities.Station.fields.corridor_designated
          - entities.HostSite.fields.access_hours_mode
          - entities.HostSite.fields.access_open_minute
          - endpoints[POST /maintenance-dispatches]
        distinguishing_aspect: |
          Mode (a): four independent inputs interact non-linearly — fault_class MAJOR (720
          base) x POWER_CLASS_FACTOR[DCFC_350] (0.50) = 360, minus CORRIDOR_TIGHTEN_MINUTES
          (60) = 300, clamped by the nested min(4320, max(120, 300)) = 300, then pushed
          forward by the RESTRICTED access window (naive 2026-06-11T01:00:00Z falls before
          access_open_minute 360, so the deadline lands on 2026-06-11T06:00:00Z instead).
          No rounding-order and no circular dependency is involved, which is what separates
          this instance from the mode (b) instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-10T21:00:00Z."
            - "HostSite HS-DL-1 EXECUTED / ENERGIZED / SIGNAGE_ONLY, committed_service_capacity_kw 1200.00, access_hours_mode RESTRICTED with access_open_minute 360 and access_close_minute 1320."
            - "Station ST-DL-1 (DCFC_350, declared_port_count 1, corridor_designated true) in status SUSPENDED (suspension_source AUTOMATIC), payment_interop_score 100.00."
            - "ChargingPort DS-DL-1 CERTIFIED, service_state OUT_OF_SERVICE."
            - "OutageEvent MAJOR on DS-DL-1 with detected_at 2026-06-10T20:00:00Z, state CLASSIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-DL-1", host_org_name: "Northgate Mall Trust", committed_service_capacity_kw: 1200.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "SIGNAGE_ONLY", access_hours_mode: "RESTRICTED", access_open_minute: 360, access_close_minute: 1320 }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-DL-1", power_class: "DCFC_350", declared_port_count: 1, corridor_designated: true }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "NACS", rated_power_kw: 350.00, dispenser_serial: "DS-DL-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_3_0" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-10T21:00:00Z" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-06-10T20:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MAJOR" }
              as: NetworkOperator
          trigger:
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-hv-1", technician_certification_class: "DCFC_HV", window_start_at: "2026-06-10T22:00:00Z", window_end_at: "2026-06-11T08:00:00Z" }
              as: NetworkOperator
              captures: { d_id: $.data.id }
          assert:
            - "MaintenanceDispatch.${d_id}.response_deadline_at == \"2026-06-11T06:00:00Z\""
            - "MaintenanceDispatch.${d_id}.response_deadline_at != \"2026-06-11T01:00:00Z\" (the un-pushed naive deadline)"
            - "MaintenanceDispatch.${d_id}.state == CREATED"
            - "MaintenanceDispatch.${d_id}.arrived_at == null and MaintenanceDispatch.${d_id}.response_met == null"
            - "OutageEvent.${o_id}.state == DISPATCHED"
            - "ChargingPort.${p_id}.maintenance_state == DISPATCH_PENDING"

      - name: claim_withhold_mode_b_rounds_each_line_item_before_summing
        grounds:
          - calculations.reimbursement_payable_amount
          - state_machines.ReimbursementClaim.transitions.PENDING_to_REVIEW
          - state_machines.ReimbursementClaim.transitions.REVIEW_to_WITHHELD
          - entities.ReimbursementClaim.fields.line_items
          - entities.ReimbursementClaim.fields.withheld_amount_cents
          - entities.ReimbursementClaim.fields.approved_amount_cents
          - endpoints[POST /reimbursement-claims/{claim_id}/decision]
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-line-item-THEN-sum. Three line items of 1005
          cents at withhold_rate 0.10 give round_half_up(100.5) = 101 three times = 303
          withheld and 2712 approved; the forbidden sum-then-round order would give
          round_half_up(301.5) = 302 withheld and 2713 approved. The divergence is exactly
          one cent, so only the pinned rounding order can produce the asserted figures. No
          nested min/max chain and no circular dependency is exercised here, which separates
          this instance from the mode (a) instance.
        test_recipe:
          setup:
            - "Logical clock walked from 2026-05-01T00:00:00Z to 2026-07-15T00:00:00Z."
            - "HostSite HS-WH-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-WH-1 (DCFC_150, declared_port_count 1) OPERATIONAL, payment_interop_score 100.00."
            - "One ChargingPort DS-WH-1 created 2026-05-01T00:00:00Z, CERTIFIED, IN_SERVICE."
            - "One MINOR OutageEvent, detected_at 2026-06-05T00:00:00Z, cleared_at 2026-06-06T00:00:00Z (1440 minutes), state RESOLVED, never excluded."
