              payload: { stage: "DESIGN_CRITIQUE", verdict: "APPROVE", notes: "approved at critique by dual-1" }
              as: DesignCritiqueReviewer
              as_user_id: "dual-1"
              captures: { gate_state: $.data.resulting_proposal_state }
            - call: "GET /design-system/contribution-proposals/${prop_id}"
              payload: {}
              as: DesignSystemLead
              captures: { critique_user: $.data.design_critique_reviewer_user_id, eng_user_before: $.data.engineering_reviewer_user_id }
          trigger:
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
