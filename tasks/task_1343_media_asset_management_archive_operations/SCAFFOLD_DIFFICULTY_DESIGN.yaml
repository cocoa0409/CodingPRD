              as: RightsManager
          trigger:
            - call: "POST /archive/retrieval-requests"
              payload: { asset_id: "${asset_id}", requester_id: "${staff_id}", purpose: "BROADCAST", requested_delivery_by: "2026-09-01T00:00:00Z" }
              as: Requester
              as_user_id: "${staff_id}"
              captures: { err: $.data.error_id }
          assert:
