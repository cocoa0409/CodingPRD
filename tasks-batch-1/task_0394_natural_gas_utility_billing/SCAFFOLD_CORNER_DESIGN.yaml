  # ===========================================================================
  # SECTION 4 — Validations (violation->error for each rule, satisfaction->pass,
  #   priority ordering, cross-entity, temporal, conditional).
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_rate_schedule_code_returns_duplicate
        claim_type: Violation to Error
        grounds:
          - validations[priority=5]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Creating a second RateSchedule with an existing code returns ERR_DUPLICATE (409)."
        test_recipe:
          setup:
            - "A RateSchedule with code RES-DUP already exists."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RES-DUP", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
