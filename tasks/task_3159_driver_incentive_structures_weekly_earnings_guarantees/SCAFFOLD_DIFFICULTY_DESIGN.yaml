              captures: { drv2: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "BONUS_ZONE", title: "Z", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], geo_cell_id: "cellA", zone_multiplier_bps: 15000, capacity: 1 }
              as: IncentiveOps
