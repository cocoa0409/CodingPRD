      - name: envelope_knee_evaluation_order_weight_then_limit
        mode: c
        grounds:
          - calculations.calculate_balance_chain
          - entities.Aircraft.fields.tow_knee_weight_kg
          - entities.Aircraft.fields.tow_aft_knee_adjust_pct_mac
          - validations.priority_30
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency. The aft %MAC limit depends on
          takeoff_weight_kg, %MAC itself is derived from index AND weight, and the
          envelope verdict compares the two. The scaffold pins the order
          weights -> %MAC -> knee-adjusted limit -> verdict, which makes the
          outcome non-monotone in %MAC: plan A at mac_tow_pct 26.51 with
          takeoff_weight_kg 61352.00 is REFUSED (knee applies, effective aft limit
          26.5) while plan B, further aft at mac_tow_pct 27.98 with
          takeoff_weight_kg 59680.00, is ACCEPTED (knee does not apply, aft limit
          28.0). Evaluating the limit before the weight, or comparing %MAC against
          the unadjusted 28.0, flips both verdicts.
