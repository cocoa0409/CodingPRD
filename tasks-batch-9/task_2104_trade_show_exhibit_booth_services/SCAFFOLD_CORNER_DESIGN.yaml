  - name: occ_stale_warehouse_version_rejects_second_crate_checkin
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[crate-checkin-stale-warehouse]
    - errors[ERR_STALE_WAREHOUSE_VERSION]
    - endpoints[POST /crates/{id}/warehouse-check-in]
    distinguishing_aspect: The first check-in advances Warehouse.version and committed_cwt to 13, so a second check-in still carrying the version captured before the first is refused with ERR_STALE_WAREHOUSE_VERSION at HTTP 412 and committed_cwt stays
      13.
    test_recipe:
      setup:
