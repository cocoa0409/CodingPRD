              captures: { c2_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${c1_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${c2_id}", package_code: "PKG_BIRTH", edd: "2026-09-01" }
              as: IntakeCoordinator
              captures: { e2_id: $.data.id }
            - call: "POST /birth-center/rooms"
              payload: { name: "Garden Suite", turnover_minutes: 30 }
              as: CenterAdmin
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /birth-center/bookings"
              payload: { episode_id: "${e1_id}", room_id: "${room_id}", starts_at: "2026-01-02T00:00:00Z", ends_at: "2026-01-02T06:00:00Z", expected_room_version: "${room_v0}" }
              as: CenterAdmin
              captures: { bk1_id: $.data.id }
