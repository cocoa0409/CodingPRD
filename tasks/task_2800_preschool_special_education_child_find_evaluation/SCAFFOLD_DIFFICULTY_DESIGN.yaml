        grounds:
          - calculations.referral_age_and_pathway
          - validations[priority=17]
          - errors.ERR_AGE_INELIGIBLE
          - entities.Referral.fields.age_months_at_referral
        distinguishing_aspect: |
          AGE_MIN_MONTHS is an inclusive lower bound on the whole_months
          computation: a child born 2023-11-01 is exactly 33 months old on the
          2026-08-01 clock and the referral is created, while a child born
          2023-12-01 is 32 months old and the identical request is refused with
          ERR_AGE_INELIGIBLE and no Referral row.
