              as: ReceivingClerk
            - call: "POST /tsdf/containers"
              payload: { manifest_line_id: "${line1_id}", storage_unit_id: "${unit_id}", container_type: "DRUM_55G", capacity_kg: 200.0, net_weight_kg: 190.0, accumulation_start_date: "2026-08-01T00:00:00Z", label_waste_codes: ["D001"], label_hazard_class: "3", label_accumulation_start_marked: true }
              as: ReceivingClerk
          assert:
            - "195.0 kg placement: status == 422 and data.error_id == ERR_CONTAINER_OVERFILLED"
            - "190.0 kg placement: status == 201 and fill_fraction == 0.95"
            - "StorageUnit.${unit_id}.container_count == 1"
            - "StorageUnit.${unit_id}.stored_kg == 190.0"
            - "ManifestLine.${line1_id}.allocated_container_mass_kg == 190.0"

      - name: manifest_line_referencing_a_draft_profile_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=14]
          - errors[ERR_PROFILE_NOT_APPROVED]
        distinguishing_aspect: |
          A profile that never reached approval is refused at manifest creation with 409, and this rule
          is deliberately distinct from the expiry rule one rung lower: DRAFT is "not approved", while a
          lapsed recertification carries status EXPIRED and earns ERR_PROFILE_EXPIRED instead.
        test_recipe:
          setup:
            - "Facility, generator and a profile still in DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tsdf/generators"
