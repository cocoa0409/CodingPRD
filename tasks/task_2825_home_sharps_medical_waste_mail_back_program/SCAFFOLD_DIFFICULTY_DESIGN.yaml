          assert:
            - "Kit.${kit1}.status == VOIDED"
            - "Kit.${kit1}.void_reason == \"patient changed therapy\""
            - "Kit.${kit1}.provisional_cost_cents == 1465"
            - "SponsorshipProgram.${prog_np}.reserved_cents == 0"
            - "SponsorshipProgram.${prog_np}.committed_cents == 0"
            - "SponsorshipProgram.${prog_np}.available_cents == 500000"
            - "SponsorshipProgram.${prog_np}.funding_ceiling_cents == 500000"
            - "SponsorshipProgram.${prog_np}.status == ACTIVE"
            - "Enrollment.${enr_d}.kits_issued == 0"
            - "GET /sharps/ledger-entries?sponsorship_program_id=${prog_np} returns exactly 2 entries in sequence_no ASC: (sequence_no 1, RESERVATION, amount_cents +1465, reserved_after_cents 1465, available_after_cents 498535), (sequence_no 2, RESERVATION_RELEASE, amount_cents -1465, reserved_after_cents 0, available_after_cents 500000)"
            - "GET /sharps/ledger-entries?kit_id=${kit1} returns total_count 2 and the two amount_cents values sum to 0"

      - name: return_to_patient_remediation_restores_facility_pending_intake_units
        grounds:
          - calculations.facility_intake_occupancy
          - state_machines.NonConformanceEvent.CUSTOMER_NOTIFIED_to_RESOLVED
          - state_machines.Kit.RECEIVED_to_RETURNED_TO_PATIENT
          - entities.TreatmentFacility.fields.pending_intake_units
          - entities.Shipment.fields.custody_units
        distinguishing_aspect: |
          The compensated quantity is PHYSICAL CUSTODY, not money, and the compensation is deliberately
          PARTIAL: mailing the rejected container back to the patient must subtract exactly the
          custody_units that activation added (69 -> 0) and kill the label, yet the kit is still alive,
          so the 1465-cent reservation must NOT be released and committed_cents must stay 0. An
          implementation that treats every unwind as a full rollback wrongly frees the money too;
          one that only advances the event status leaves the facility permanently over-booked.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Baseline CA state rule (CONDITIONALLY_EXEMPT, so RETURN_TO_PATIENT is legal, 72-hour notification deadline), PS-A spec, CA-TF-0001 facility (1000-unit capacity), NovaPen MANUFACTURER program NPD-2026 (500000 ceiling, 6000 allowance), Dana Reyes with a 30-day / 5-kit ACTIVE enrollment."
            - "Kit 1 sealed at 69 units / 1400 g and its label activated, which booked 69 pending intake units at CA-TF-0001 (0 -> 69)."
            - "The parcel is DELIVERED, screened NON_CONFORMING with reason LOOSE_SHARPS_IN_BOX (weight 45, still below the 60 suspend threshold) and the customer notified by EMAIL, so the event is CUSTOMER_NOTIFIED and the 69 units are still booked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "CONDITIONALLY_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3, requires_state_manifest: false, notification_deadline_hours: 72 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/packaging-specs"
              payload: { spec_code: "PS-A", un_specification_code: "UN 4G/X7.5/S/26", postal_service: "USPS_PARCEL_SELECT_MAILBACK", hazard_class: "UN3291_SHARPS_ONLY", max_gross_weight_grams: 6800, allowed_container_sizes: ["ONE_QUART", "TWO_GALLON", "THREE_GALLON"], requires_absorbent: false, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { ps_a: $.data.id }
            - call: "POST /sharps/treatment-facilities"
              payload: { name: "Bay Area Sharps Treatment", state_rule_id: "${sr_ca}", permit_number: "CA-TF-0001", accepted_hazard_classes: ["UN3291_SHARPS_ONLY", "UN3291_REGULATED_MEDICAL_WASTE"], daily_intake_capacity_units: 1000, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { tf_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "NovaPen Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@novapen.example", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { sp_np: $.data.id }
            - call: "POST /sharps/sponsors/${sp_np}/programs"
              payload: { program_code: "NPD-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 6000 }
              as: ProgramAdmin
              captures: { prog_np: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 14, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog_np}", cadence_days: 30, kits_authorized: 5 }
              as: ProgramAdmin
              captures: { enr_d: $.data.id }
            - call: "POST /sharps/enrollments/${enr_d}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_d}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_np}"
              captures: { enr_dv: $.data.version }
            - call: "POST /sharps/enrollments/${enr_d}/kits"
              payload: { expected_enrollment_version: "${enr_dv}" }
              as: ProgramAdmin
              captures: { kit1: $.data.id }
            - call: "POST /sharps/kits/${kit1}/acknowledge-receipt"
              payload: {}
              as: Patient
              as_user_id: "${pat_d}"
            - call: "POST /sharps/kits/${kit1}/seal"
              payload: { fill_units: 69, sealed_gross_weight_grams: 1400 }
              as: Patient
              as_user_id: "${pat_d}"
            - call: "POST /sharps/kits/${kit1}/return-labels"
              payload: { packaging_spec_id: "${ps_a}" }
              as: LogisticsCoordinator
              captures: { lbl1: $.data.id }
            - call: "POST /sharps/return-labels/${lbl1}/activate"
              payload: { treatment_facility_id: "${tf_ca}", scheduled_intake_date: "2026-08-10", declared_gross_weight_grams: 1400 }
              as: LogisticsCoordinator
              captures: { shp1: $.data.id }
            - call: "POST /sharps/shipments/${shp1}/transport-events"
              payload: { event_type: "IN_TRANSIT" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp1}/transport-events"
              payload: { event_type: "DELIVERED" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp1}/conformance-screening"
              payload: { outcome: "NON_CONFORMING", observed_gross_weight_grams: 1520, reason_code: "LOOSE_SHARPS_IN_BOX" }
              as: IntakeTechnician
              as_user_id: "tech-01"
            - call: "GET /sharps/shipments/${shp1}/non-conformance-events"
              payload: {}
              as: IntakeTechnician
              as_user_id: "tech-01"
              captures: { nce1: "$.data[0].id" }
            - call: "POST /sharps/non-conformance-events/${nce1}/notify-customer"
              payload: { notification_channel: "EMAIL" }
              as: IntakeTechnician
              as_user_id: "tech-01"
          trigger:
            - call: "POST /sharps/non-conformance-events/${nce1}/remediate"
              payload: { remediation_action: "RETURN_TO_PATIENT" }
              as: IntakeTechnician
              as_user_id: "tech-01"
          assert:
            - "TreatmentFacility.${tf_ca}.pending_intake_units == 0"
            - "TreatmentFacility.${tf_ca}.destroyed_units_total == 0"
            - "TreatmentFacility.${tf_ca}.certificates_issued_count == 0"
            - "Shipment.${shp1}.custody_units == 69"
            - "Shipment.${shp1}.transport_status == DELIVERED"
            - "Shipment.${shp1}.conformance_status == REMEDIATED"
            - "Kit.${kit1}.status == RETURNED_TO_PATIENT"
            - "Kit.${kit1}.fill_units == 69"
            - "ReturnLabel.${lbl1}.status == VOIDED"
            - "ReturnLabel.${lbl1}.voided_at == \"2026-08-01T00:00:00Z\""
            - "NonConformanceEvent.${nce1}.status == RESOLVED"
            - "NonConformanceEvent.${nce1}.remediation_action == RETURN_TO_PATIENT"
            - "SponsorshipProgram.${prog_np}.reserved_cents == 1465"
            - "SponsorshipProgram.${prog_np}.committed_cents == 0"
            - "SponsorshipProgram.${prog_np}.available_cents == 498535"
            - "GET /sharps/ledger-entries?sponsorship_program_id=${prog_np} returns total_count 1"
            - "Patient.${pat_d}.screening_risk_score == 45"
            - "Patient.${pat_d}.status == ENROLLED"
