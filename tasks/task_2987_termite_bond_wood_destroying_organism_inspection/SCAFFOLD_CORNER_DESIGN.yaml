          trigger:
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins4}", applicator_id: "${insa}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_PROPERTY_MISMATCH"
            - "neither ERR_INSPECTION_NOT_FOUND nor ERR_PROPERTY_NOT_FOUND is returned: both ids resolve"
            - "no plan row is created and Inspection.${ins4} keeps status GRAPHED with its version unchanged"

  # =========================================================================
  - section: state_machines
    instances:
      - name: inspector_licence_suspend_and_reactivate_closes_the_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Inspector
          - complexity_profile.state_machine_shape
          - endpoints[POST /inspectors/{id}/license-status]
        distinguishing_aspect: >-
          The ACTIVE -> SUSPENDED -> ACTIVE loop run twice on one row: status returns to its initial
          value while version keeps climbing (1 -> 2 -> 3 -> 4 -> 5), which is what makes the shape
          cyclic rather than linear.
        test_recipe:
          setup:
            - "One ACTIVE inspector with an unexpired licence."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
          trigger:
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "SUSPENDED" }
              as: ComplianceOfficer
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "SUSPENDED" }
              as: ComplianceOfficer
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "ACTIVE" }
              as: ComplianceOfficer
          assert:
            - "each call returns HTTP 200 with the requested status"
            - "after the fourth call status == ACTIVE and version == 5 — the loop is repeatable and every hop is a write"
            - "license_expires_on is still '2029-06-30' and ce_credits is still 0: a suspend/reactivate pair does not touch the licence facts"
            - "the SUSPENDED -> ACTIVE hop succeeded only because license_expires_on is still on or after the clock date"

      - name: expired_licence_reinstatement_requires_future_expiry_and_eight_ce_credits
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Inspector[EXPIRED -> ACTIVE]
          - validations[priority=93]
          - errors.ERR_LICENSE_REINSTATEMENT_UNMET
        distinguishing_aspect: >-
          Both preconditions of the EXPIRED -> ACTIVE hop are violated one at a time on the same
          row: an unmet CE balance and a non-future expiry date each produce
          ERR_LICENSE_REINSTATEMENT_UNMET (422), and only the third attempt — which fixes both —
          reactivates the licence and adopts the supplied values.
        test_recipe:
          setup:
            - "One inspector with ce_credits 4 that has been moved to EXPIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2026-09-30", ce_credits: 4 }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "EXPIRED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "ACTIVE", license_expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { e_ce: $.data.error_id }
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "ACTIVE", license_expires_on: "2026-08-01", ce_credits: 8 }
              as: ComplianceOfficer
              captures: { e_date: $.data.error_id }
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "ACTIVE", license_expires_on: "2027-06-30", ce_credits: 8 }
              as: ComplianceOfficer
          assert:
            - "attempt 1 returns 422 ERR_LICENSE_REINSTATEMENT_UNMET: the effective credit count falls back to the stored 4, which is below 8"
            - "attempt 2 returns 422 ERR_LICENSE_REINSTATEMENT_UNMET: 2026-08-01 equals the clock date and the rule demands STRICTLY after"
            - "after both failures status is still EXPIRED and version is still 2 — a refused transition writes nothing"
            - "attempt 3 returns 200 with status ACTIVE, license_expires_on '2027-06-30', ce_credits 8 and version 3"

      - name: inspector_cannot_move_from_suspended_to_expired
        claim_type: invalid_transitions
        grounds:
          - state_machines.Inspector
          - validations[priority=80]
          - errors.ERR_INVALID_INSPECTOR_STATE
        distinguishing_aspect: >-
          SUSPENDED -> EXPIRED is not a declared transition even though both states exist and both
          are reachable from ACTIVE; the target-state rule refuses it with 409 rather than silently
          overwriting status.
        test_recipe:
          setup:
            - "One inspector moved to SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "SUSPENDED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "EXPIRED" }
              as: ComplianceOfficer
              captures: { e: $.data.error_id }
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "SUSPENDED" }
              as: ComplianceOfficer
              captures: { e2: $.data.error_id }
          assert:
            - "both attempts return 409 ERR_INVALID_INSPECTOR_STATE"
            - "SUSPENDED -> SUSPENDED is refused as well: a self-transition is only legal where §1.2 declares one (Bond ACTIVE -> ACTIVE, BaitStation ACTIVE_HIT -> ACTIVE_HIT)"
            - "GET /inspectors/${insb} still reports status SUSPENDED with version 2"

      - name: graph_complete_recomputes_rollups_and_the_property_ledger
        claim_type: side_effect_execution
        grounds:
          - state_machines.Inspection[DRAFT -> GRAPHED]
          - calculations.conducive_condition_ledger
          - endpoints[POST /inspections/{id}/graph-complete]
        distinguishing_aspect: >-
          Four graph cells whose two CONDUCIVE_CONDITION rows share one conducive_code: the
          inspection rollup counts ROWS (conducive_condition_count 2) while the property ledger
          counts DISTINCT codes (total_conducive_condition_count 1), so an implementation that uses
          one number for both fails.
        test_recipe:
          setup:
            - "P1 with a DRAFT INITIAL inspection owned by insb."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A1", conducive_code: "EXCESS_MOISTURE" }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "B2", conducive_code: "EXCESS_MOISTURE" }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "C3", organism: "FUNGUS", severity: 2, damage_estimate_usd: 1200.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "ACTIVE_INFESTATION", grid_ref: "D4", organism: "SUBTERRANEAN_TERMITE", severity: 3 }
              as: FieldInspector
              as_user_id: "${insb}"
          trigger:
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "GET /properties/${p1}"
              payload: {}
              as: BranchManager
          assert:
            - "HTTP 200 with status GRAPHED, graph_completed_at == 2026-08-01T00:00:00.000Z and version == 2"
            - "findings_count == 4, conducive_condition_count == 2 (two ROWS), active_infestation_found == true, damage_estimate_total_usd == 1200.00"
            - "no_findings_attested == false: the body omitted it and there were findings to sign"
            - "the property read shows total_conducive_condition_count == 1 (DISTINCT codes: only EXCESS_MOISTURE), waived 0, open 1"
            - "Property.active_infestation_on_record == true, propagated from the newly GRAPHED graph"
            - "the DAMAGE and ACTIVE_INFESTATION cells contribute nothing to any conducive counter"

      - name: superseding_a_graph_cascades_into_voiding_its_wdo_report
        claim_type: side_effect_execution
        grounds:
          - state_machines.Inspection[GRAPHED -> SUPERSEDED]
          - state_machines.WdoReport[ISSUED -> VOID]
          - endpoints[POST /inspections]
        distinguishing_aspect: >-
          A two-hop cascade whose second hop is caused by the first, not by the request: creating a
          RENEWAL graph that supersedes the REAL_ESTATE graph retires that graph AND voids the
          already-ISSUED statutory report transcribed from it, while the newly created inspection
          stays DRAFT.
        test_recipe:
          setup:
            - "P1 with a GRAPHED REAL_ESTATE inspection and an ISSUED FL WDO report on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "REAL_ESTATE", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z", closing_date: "2026-08-20" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { insre: $.data.id }
            - call: "POST /inspections/${insre}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /wdo-reports"
              payload: { inspection_id: "${insre}", form_code: "FL_DACS_13645" }
              as: ComplianceOfficer
              captures: { rep1: $.data.id }
            - call: "POST /wdo-reports/${rep1}/issue"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "RENEWAL", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T15:00:00Z", supersedes_inspection_id: "${insre}" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins2: $.data.id }
            - call: "GET /inspections/${insre}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /wdo-reports/${rep1}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the new inspection is created 201 with status DRAFT, sequence_no 2 and supersedes_inspection_id ${insre}"
            - "hop 1: ${insre} is now SUPERSEDED with version 3 (create -> graph-complete -> supersede)"
            - "hop 2: ${rep1} is now VOID with version 3, and its issued_at / turnaround_hours / sla_breached are left exactly as they were at issuance"
            - "GET /wdo-reports filtered by inspection_id ${insre} still returns the row — voiding is a status change, not a delete"
            - "the property's conducive ledger is recomputed from the property's latest GRAPHED inspection, which after the cascade is none, so all three counters read 0"

      - name: superseded_inspection_rejects_findings_and_graph_complete
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Inspection.terminal_states
          - validations[priority=80]
          - errors.ERR_INVALID_INSPECTION_STATE
        distinguishing_aspect: >-
          SUPERSEDED is the only terminal state in the Inspection machine, and it is reachable from
          DRAFT as well as GRAPHED; a never-signed draft that has been retired must refuse both of
          its former operations with 409 rather than accepting late cells.
        test_recipe:
          setup:
            - "P1 with a DRAFT INITIAL inspection that is then retired by a REINSTATEMENT graph."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "REINSTATEMENT", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T15:00:00Z", supersedes_inspection_id: "${ins1}" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins2: $.data.id }
          trigger:
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A1", conducive_code: "FAULTY_GRADE" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e_find: $.data.error_id }
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e_sign: $.data.error_id }
          assert:
            - "both calls return 409 ERR_INVALID_INSPECTION_STATE"
            - "${ins1} keeps status SUPERSEDED, findings_count 0 and version 2 — nothing was written"
            - "GET /inspections/${ins1}/findings returns total_count 0"
            - "the still-DRAFT ${ins2} is unaffected and can still be signed"

      - name: graph_complete_twice_returns_409_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines.Inspection[DRAFT -> GRAPHED]
          - validations[priority=80]
          - errors.ERR_INVALID_INSPECTION_STATE
        distinguishing_aspect: >-
          Signing a graph is a one-shot transition, not an idempotent upsert: the replay must fail
          with 409 and must NOT re-stamp graph_completed_at or re-run the property-ledger recompute,
          which a naive "set status = GRAPHED" implementation would do silently.
        test_recipe:
          setup:
            - "P1 with a DRAFT INITIAL inspection carrying one conducive cell."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A1", conducive_code: "WOOD_TO_GROUND" }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e: $.data.error_id }
            - call: "GET /inspections/${ins1}"
              payload: {}
              as: BranchManager
          assert:
