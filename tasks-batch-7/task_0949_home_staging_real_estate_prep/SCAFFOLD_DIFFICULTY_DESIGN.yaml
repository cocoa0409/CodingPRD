      - name: project_workflow_and_payment_axes_advance_independently
        grounds:
          - state_machines.Project.workflow_state
          - state_machines.Project.payment_state
          - entities.Project.fields.workflow_state
          - entities.Project.fields.payment_state
        distinguishing_aspect: |
          PARALLEL STATE DIMENSIONS on one row: on the canonical project, workflow_state
          reaches STAGED while payment_state is still only DEPOSIT_HELD, and collecting the
          deposit earlier moved payment_state without touching workflow_state — two axes on
          the SAME Project entity that neither block nor drag each other.
        test_recipe:
          setup:
            - "The canonical VACANT project, installed and complete at 2026-06-10T09:00:00Z."
          setup_api_calls: *v_staged
