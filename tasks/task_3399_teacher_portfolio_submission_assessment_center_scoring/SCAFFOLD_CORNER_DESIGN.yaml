  - section: cross-cutting complexity layers
    instances:
      - name: selector_least_loaded_then_earliest_calibrated
        claim_type: Selector determinism
        grounds:
          - calculations.assessor_selector
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Selector policy without a requester-supplied assessor: eligibility filter (ACTIVE, district mismatch excluded, no existing read) then ranking open_assignment_count ASC picks the unloaded assessor; when counts tie, calibrated_at ASC (earlier calibration) breaks the tie — never random ids."
        test_recipe:
          setup:
            - "Cycle NB-2027 OPEN; candidate A (D-100) ELIGIBLE with P1/P2/P3 submissions all SCORING."
            - "Assessor RA (D-900) ACTIVE, calibrated_at 2027-01-10; assessor RB (D-901) ACTIVE, calibrated_at 2027-01-11 (activated one day later)."
            - "RA holds one open ASSIGNED read on P1 (open_assignment_count 1); RB has 0."
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_bench
            - &c_ra_new
              call: "POST /assessors"
              payload: { full_name: "Reader A", email: "ra@x.com", home_district_code: "D-900" }
