            - { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${ply}", artistic_excellence: 5, work_sample_quality: 5, career_impact: 5, public_value: 5, comments: "Also should never be recorded." }, as: Panelist, as_user_id: "${ply}", captures: { err_p90: "$.data.error_id" } }
          assert:
            - "plx violates both P75 (BLOCKING conflict) and P90 (not seated on app1's panel) and receives 409 ERR_CONFLICT_BLOCKS_REVIEW"
            - "ply violates only P90 and receives 409 ERR_PANELIST_NOT_ON_PANEL for a byte-identical request shape"
            - "No Review row exists for app1 with panelist_id plx or ply afterwards"
            - "Application.valid_review_count stays 0 and panel pan2.assigned_application_count stays 0"

      - name: cycle_state_p70_outranks_deadline_p80_which_outranks_duplicate_p85
        grounds:
          - validations[priority=70]
          - validations[priority=80]
          - validations[priority=85]
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          The same second application from the same artist must report
          ERR_DUPLICATE_APPLICATION before the deadline, ERR_APPLICATION_DEADLINE_PASSED after
          it, and ERR_CYCLE_STATE_INVALID once the cycle is CLOSED, walking three priority
          bands from one unchanged request; any implementation that checks uniqueness first
          collapses all three outcomes to the duplicate error.
        test_recipe:
          setup:
            - "CycleMain OPEN with app1 already SUBMITTED at clock 2026-09-01"
            - "A second DRAFT application app1b for the same artist and cycle carries two valid MANUSCRIPT_PAGES samples, so the P85 work-sample rule is satisfied"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
