  - rule_id: resource_temporal_overlap
    instances:
      - name: facility_capacity_uses_peak_overlap_and_admits_adjacent_handoffs
        grounds:
          - calculations.facility_overlap_exposure
          - validations[priority=110].ERR_FACILITY_CAPACITY_EXCEEDED
          - entities.StorageFacility.fields.aggregate_capacity_cents
          - entities.TemporaryStorageAssignment.fields.stored_value_cents
        distinguishing_aspect: |
          Shared resource: a StorageFacility's aggregate capacity, contended for by
          TemporaryStorageAssignment windows. Interval semantics: plain half-open [start, end)
          overlap with no buffer, so a hand-off whose window_start equals the incumbent's
          window_end is admissible even though the two stored values (300000000 + 400000000)
          are together well over the 500000000 capacity. Only genuinely overlapping windows
          aggregate, the test is on peak simultaneous exposure rather than on any sum of rows,
          it rejects strictly above capacity (500000001 fails, 500000000 passes), and RELEASED
          rows drop out of the peak so a previously refused window becomes admissible.
        test_recipe:
          setup:
            - "FX-A policy IN_FORCE, term 2026-09-01 to 2027-06-30, adjusted_completion 2027-06-01, with a TEMPORARY_STORAGE part of 400000000."
            - "One ACTIVE SPRINKLERED facility, 42.5 miles out, aggregate_capacity_cents 500000000."
            - "The coverage schedule also carries a MATERIALS_ON_SITE part of 1000000000, which the DRAFT -> QUOTED transition requires; it contributes to no asserted figure here."
