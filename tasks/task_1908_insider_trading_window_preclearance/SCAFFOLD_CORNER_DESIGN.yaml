        claim_type: input_set_filtering
        grounds: [calculations.sweep_recompute, state_machines.Attestation.ASSIGNED_to_OVERDUE]
        distinguishing_aspect: "The sweep flips only ASSIGNED attestations with due_date < now: the 2026-08-02 attestation goes OVERDUE while the 2026-12-31 attestation stays ASSIGNED at the same sweep."
        test_recipe:
