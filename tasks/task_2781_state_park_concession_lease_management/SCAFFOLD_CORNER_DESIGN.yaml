      - name: guarded_transition_prospectus_issue_reads_the_opportunity_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.Prospectus.DRAFT_to_ISSUED
          - validations[priority=12]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / prospectus_issue_blocked_by_opportunity_not_yet_approved
          rationale: "That §1.8 instance is exactly the guarded-transition claim: DRAFT -> ISSUED is refused with ERR_OPPORTUNITY_NOT_APPROVED because the parent opportunity is only ANALYSIS_COMPLETE, and it asserts both entities' end states."

      - name: cascade_down_lease_expiry_unwinds_improvements_and_plans
        claim_type: cascade_down
        grounds:
          - endpoints.POST_/leases/{id}/expire
          - calculations.unamortized_improvement_value
        excluded_because:
          difficulty_instance: combinatorial_formula / transfer_settlement_charges_admin_fee_on_gross_before_offsets
          rationale: "That §1.8 instance drives POST /leases/{id}/expire and asserts the full downward cascade — the COMPLETED improvement's unamortized_value_cents of 15,375,000, its COMPENSABLE landing state, and the APPROVED operating plan becoming SUPERSEDED — before continuing into close-out."

      - name: cross_entity_bond_exhaustion_adjusts_the_lease
        claim_type: cross_entity
        grounds:
          - state_machines.PerformanceBond.ACTIVE_to_INSUFFICIENT
          - state_machines.Lease.compliance_status.DEFICIENT_to_DEFAULT
        excluded_because:
          difficulty_instance: transitive_cascade / bond_draw_cascades_default_termination_and_asset_unwind
          rationale: "That §1.8 instance changes PerformanceBond and asserts the resulting Lease compliance_status DEFAULT, contract_status TERMINATED_DEFAULT and both dependent collections' end states."

      - name: compensation_withdrawing_audit_findings_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.AuditEngagement.FINAL_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / lease_fee_ledger_conserved_when_audit_findings_are_withdrawn
          rationale: "That §1.8 instance asserts every reversed side effect of the finalize cascade — reports, both reconciliations, the system-issued notice, the lease balance and compliance_status — with no drift."

