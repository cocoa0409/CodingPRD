              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk: $.data.id }
            - call: "PUT /tech-checks/${chk}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf: $.data.id }
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "Pat P", contract_type: PRINCIPAL, weekly_salary_cents: 800000 }
              as: CompanyManager
              captures: { cm: $.data.id }
            - call: "PUT /cast/${cm}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "POST /stops/${stop_id}/per-diems"
              payload: { cast_member_id: "${cm}", days_present: 7, travel_days: 0 }
              as: CompanyManager
              captures: { pd: $.data.id }
          trigger:
            - call: "PUT /stops/${stop_id}"
              payload: { status: CANCELLED }
              as: TourManager
              captures: { e1: $.data.error_id }
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: FLY_LINES, required_value: 10 }
              as: Producer
              captures: { e2: $.data.error_id }
            - call: "PUT /performances/${perf}"
              payload: { status: PLAYED, gross_cents: 100 }
              as: TourManager
              captures: { e3: $.data.error_id }
            - call: "PUT /per-diems/${pd}"
              payload: { status: PAID }
              as: Treasurer
              captures: { e4: $.data.error_id }
            - call: "POST /venues"
              payload: { name: "V2", city: "Boston", stage_width_ft: 40, fly_capacity_lines: 20, power_amps: 300, crew_available: 10 }
              as: CompanyManager
              captures: { e5: $.data.error_id }
            - call: "POST /tours"
              payload: { name: "Tour Z", budget_total_cents: 1000, capitalization_cents: 1000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Treasurer
              captures: { e6: $.data.error_id }
          assert:
            - "TourManager attempting CANCELLED (Producer-only transition) -> 403 ERR_FORBIDDEN"
            - "Producer attempting tech-check create (TourManager-only) -> 403 ERR_FORBIDDEN"
            - "TourManager attempting PLAYED (Treasurer-only) -> 403 ERR_FORBIDDEN"
            - "Treasurer attempting per-diem pay (CompanyManager-only) -> 403 ERR_FORBIDDEN"
            - "CompanyManager attempting venue create (Producer-only) -> 403 ERR_FORBIDDEN"
            - "Treasurer attempting tour create (Producer-only) -> 403 ERR_FORBIDDEN"

      - name: rbac_missing_auth_header_returns_unauthenticated
        claim_type: role_deny
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A missing or unrecognized X-User-Role fails at priority 1 with 401 before role authorization."
        test_recipe:
          setup: ["One tour exists"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id }
          trigger:
            - call: "GET /tours/${tour_id}"
              as: ""
              captures: { e1: $.data.error_id }
            - call: "GET /tours/${tour_id}"
              as: "Nobody"
              captures: { e2: $.data.error_id }
          assert:
            - "Missing role header -> 401 ERR_UNAUTHENTICATED"
            - "Unknown role 'Nobody' -> 401 ERR_UNAUTHENTICATED"

      - name: sod_pay_same_user_rejected
        claim_type: role_deny
        grounds: ["validations[priority=2]", "errors[ERR_SOD_APPROVE_PAY]", roles]
        distinguishing_aspect: "Segregation of duties second leg: the user who approved a settlement cannot pay it; a different authorized user can."
        test_recipe:
          setup: ["Closed stop; settlement SUBMITTED by trs-1 and APPROVED by prod-1"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk: $.data.id }
            - call: "PUT /tech-checks/${chk}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf: $.data.id }
            - call: "PUT /performances/${perf}"
              payload: { status: PLAYED, gross_cents: 750000 }
              as: Treasurer
            - call: "GET /stops/${stop_id}/settlement"
              as: Producer
              captures: { s_id: "$.data[0].id" }
            - call: "PUT /settlements/${s_id}"
              payload: { audited_gross_cents: 6000000, taxes_cents: 300000, levies_cents: 200000 }
              as: Treasurer
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
            - call: "PUT /settlements/${s_id}"
              payload: { status: APPROVED }
              as: Producer
              as_user_id: prod-1
          trigger:
            - call: "PUT /settlements/${s_id}"
              payload: { status: PAID }
              as: Producer
              as_user_id: prod-1
              captures: { err: $.data.error_id }
            - call: "PUT /settlements/${s_id}"
              payload: { status: PAID }
              as: Treasurer
              as_user_id: trs-1
              captures: { st: $.data.status }
          assert:
            - "Pay by approver prod-1 -> 403 ERR_SOD_APPROVE_PAY"
            - "Pay by a different authorized user (trs-1 != prod-1) -> 200, status PAID"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stop_create_stale_tour_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[stop-create-stale-tour]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential stop creates: the second, still carrying the pre-first-create tour version, is rejected 412; re-reading the tour and resubmitting succeeds. A rejected create must not advance the version."
        test_recipe:
          setup: ["Tour created (version 1 observed); stop 1 created (tour advances to version 2)"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v1: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v1}" }
              as: TourManager
              captures: { stop1: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-15", play_week_end: "2026-09-20", load_in_date: "2026-09-14", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v1}" }
              as: TourManager
              captures: { err: $.data.error_id }
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { tour_v2: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-15", play_week_end: "2026-09-20", load_in_date: "2026-09-14", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v2}" }
              as: TourManager
              captures: { stop2: $.data.id }
          assert:
            - "Create with stale expected_tour_version (1 after the tour moved to 2) -> 412 ERR_STALE_VERSION"
            - "Re-read shows version 2 (the rejected create advanced nothing)"
            - "Retry with the fresh version succeeds (201)"

      - name: occ_stop_amend_stale_stop_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[stop-amend-stale-stop]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential amends on a CONTRACTED stop: the second, carrying the pre-first-amend stop version, is rejected 412 while the first commit stands."
        test_recipe:
          setup: ["Stop CONTRACTED with guarantee 4,000,000; version observed after the contract transition"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
              captures: { stop_v2: $.data.version }
          trigger:
            - call: "POST /stops/${stop_id}/amend"
              payload: { expected_stop_version: "${stop_v2}", guarantee_cents: 4500000 }
              as: Producer
              captures: { g_after: $.data.guarantee_cents }
            - call: "POST /stops/${stop_id}/amend"
              payload: { expected_stop_version: "${stop_v2}", guarantee_cents: 5000000 }
              as: Producer
              captures: { err: $.data.error_id }
            - call: "GET /stops/${stop_id}"
              as: Producer
              captures: { g_final: $.data.guarantee_cents }
          assert:
            - "First amend succeeds: guarantee_cents == 4500000"
            - "Second amend with the same (now stale) expected_stop_version -> 412 ERR_STALE_VERSION"
            - "Stored guarantee stays 4500000 (loser's write never lands)"

      - name: layer_cascading_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.InjuryEvent, state_machines.CoverageAssignment]
        excluded_because:
          difficulty_instance: injury_coverage_exposure_cascade
          rationale: "N-level cascade asserted end-to-end with per-hop reads in §1.8 (also tech_fail_certification_revocation_cascade)."
      - name: layer_dual_variant_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.calc_per_diem, calculations.calc_provisional_settlement_estimate]
        excluded_because:
          difficulty_instance: per_diem_full_week_vs_actual_days
          rationale: "Both variants produce pinned distinct literals in §1.8."
      - name: layer_rate_threshold_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: [calculations.calc_licensor_royalty, calculations.calc_crew_call_pay]
        excluded_because:
          difficulty_instance: royalty_tier_threshold_exact
          rationale: "Tier and OT boundaries asserted at exact values in §1.8 (also crew_overtime_exact_eight_hours)."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_covered_by_difficulty
        claim_type: immediate
        grounds: [state_machines.InjuryEvent]
        excluded_because:
          difficulty_instance: injury_coverage_exposure_cascade
          rationale: "All cascade effects are read back via GET immediately after the trigger POST in the §1.8 instance; no delay or reconciliation pass is permitted."
