              captures: { err_id: $.data.error_id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "NETWORKED", state_code: "NY", tax_id: "626-26-2626", primary_owner_name: "Dealer Networked", dealer_firm_code: "DLR200" }
              as: DealerOperations
