scenario: |
  Hot-N-Ready Forecast Production & Pickup Portal Operations (Little Caesars): forecast-driven pre-made pizza production by daypart with hold-time discard rules, portal pickup where mobile orders are placed in heated self-service lockers with code release, balance between made-ahead inventory and made-to-order tickets, discard and waste tracking against a target percentage of production, promotional price point discipline with limited customization to protect speed, dough and cheese production standards in store with proofing schedules, crew station assignment with a small footprint kitchen, event and sports-day demand spikes and pre-order handling

domain_name: hot-n-ready-forecast-production-pickup-portal
api_prefix: ""

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  difficulty_target: beyond_expert
  rationale: |
    Quota/allocation core: a finite warming-rack capacity per daypart and a finite
    heated-locker-slot pool are competed for by made-ahead production, portal
    standard orders, and portal pre-orders. Temporal windowing overlays: dough
    proofing windows with min/max floors, hold-time expiry, pickup-code windows,
    daypart activation windows, crew-shift overlap (half-open) vs demand-event
    overlap (closed) interval semantics. Dual-variant calculations on two
    different entity domains (daypart demand forecast; store-day waste
    percentage). Threshold trigger: waste_pct_standard >= WASTE_TARGET_PCT flips
    every active daypart's derived posture to RESTRICTED, gating child writes.

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: StoreDay
    parent: null
    common_fields: true
    fields:
      - { name: business_date, type: string, source: input, description: "Business date YYYY-MM-DD (UTC); unique across StoreDay rows" }
      - { name: status, type: enum, source: system, description: "PLANNING | OPEN | CLOSED | RECONCILED" }
      - { name: produced_units, type: integer, source: computed, default: 0, description: "Total pizza units racked across all production runs of this store day" }
      - { name: sold_units, type: integer, source: computed, default: 0, description: "Hold units that reached SOLD status" }
      - { name: discarded_units, type: integer, source: computed, default: 0, description: "Hold units that reached DISCARDED status" }
      - { name: donated_units, type: integer, source: computed, default: 0, description: "Subset of discarded_units logged with donated=true" }
      - { name: waste_pct_standard, type: number, source: computed, description: "round_half_up(discarded_units / produced_units * 100, 2); 0.0 when produced_units == 0" }
      - { name: waste_pct_net, type: number, source: computed, description: "round_half_up((discarded_units - donated_units) / produced_units * 100, 2); 0.0 when produced_units == 0" }

  - name: Daypart
    parent: null
    common_fields: true
    fields:
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id; owning store day" }
      - { name: label, type: enum, source: input, description: "LUNCH | DINNER | LATE_NIGHT" }
      - { name: window_start_minute, type: integer, source: input, description: "Minutes after business_date 00:00Z; >= 0" }
      - { name: window_end_minute, type: integer, source: input, description: "Minutes after business_date 00:00Z; must be > window_start_minute" }
      - { name: rack_capacity, type: integer, source: input, description: "Max units simultaneously in HOLDING+ALLOCATED for this daypart; >= 1" }
      - { name: base_demand_units, type: integer, source: input, description: "Baseline forecast demand in pizza units before event multipliers; >= 0" }
      - { name: preorder_reserved_units, type: integer, source: computed, default: 0, description: "Units reserved by PAID PORTAL_PREORDER orders promising this daypart while it is PLANNED" }
      - { name: forecast_units_provisional, type: integer, source: computed, description: "Forward-looking forecast: base x max(1, sum of multipliers of overlapping events in status SCHEDULED or ACTIVE)" }
      - { name: forecast_units_final, type: integer, source: computed, description: "Chronological forecast computed at daypart close: base x max(1, sum of multipliers of overlapping events in status ACTIVE or ENDED); null until close" }
      - { name: made_ahead_target, type: integer, source: computed, description: "max(0, min(rack_capacity, round_half_up(forecast_units_provisional * MADE_AHEAD_RATIO)) - preorder_reserved_units)" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | RESTRICTED; RESTRICTED iff parent StoreDay.waste_pct_standard >= WASTE_TARGET_PCT" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | CLOSED" }

  - name: DemandEvent
    parent: null
    common_fields: true
    fields:
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id" }
      - { name: name, type: string, source: input, description: "Event name, e.g. 'Friday night football'" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive event window start (closed interval)" }
      - { name: window_end_at, type: datetime, source: input, description: "Inclusive event window end (closed interval); must be >= window_start_at" }
      - { name: demand_multiplier, type: number, source: input, description: "Additive demand multiplier contribution; > 0" }
      - { name: cancelled, type: boolean, source: system, default: false, description: "Set true by cancel endpoint" }
      - { name: status, type: enum, source: computed, description: "CANCELLED if cancelled; else SCHEDULED if clock < window_start_at; ACTIVE if window_start_at <= clock <= window_end_at; ENDED if clock > window_end_at" }

  - name: DoughBatch
    parent: null
    common_fields: true
    fields:
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id" }
      - { name: size_units, type: integer, source: input, description: "Pizza units this batch can support; >= 1" }
      - { name: remaining_units, type: integer, source: computed, description: "Initialized to size_units; decremented by start-baking; batch DEPLETED at 0" }
      - { name: status, type: enum, source: system, description: "MIXING | PROOFING | PROOFED | DEPLETED | EXPIRED" }
      - { name: mixing_started_at, type: datetime, source: system, description: "Clock value at creation" }
      - { name: proofing_started_at, type: datetime, source: system, description: "Clock value at MIXING -> PROOFING advance" }
      - { name: proofed_at, type: datetime, source: system, description: "Clock value at PROOFING -> PROOFED advance" }

  - name: CheeseBatch
    parent: null
    common_fields: true
    fields:
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id" }
      - { name: size_units, type: integer, source: input, description: "Pizza units this cheese prep supports; >= 1" }
      - { name: remaining_units, type: integer, source: computed, description: "Initialized to size_units; decremented by start-baking; batch DEPLETED at 0" }
      - { name: status, type: enum, source: system, description: "PREPPING | RESTING | READY | DEPLETED" }
      - { name: prepped_at, type: datetime, source: system, description: "Clock value at creation" }
      - { name: ready_at, type: datetime, source: system, description: "Clock value at RESTING -> READY advance" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique product SKU" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: list_price_cents, type: integer, source: input, description: "Standard unit price in cents; >= 1" }
      - { name: promo_price_cents, type: integer, source: input, description: "Promotional price point in cents; optional; when present must be < list_price_cents" }
      - { name: customization_allowed, type: boolean, source: input, default: false, description: "Whether customized lines are permitted for this product" }
      - { name: promo_locked, type: boolean, source: computed, default: false, description: "True while any OPEN StoreDay has a Daypart with a non-CLOSED ProductionRun referencing this product; locks promo_price_cents edits" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: daypart_id, type: string, source: input, description: "FK -> Daypart.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: dough_batch_id, type: string, source: input, description: "FK -> DoughBatch.id; consumed at start-baking" }
      - { name: cheese_batch_id, type: string, source: input, description: "FK -> CheeseBatch.id; consumed at start-baking" }
      - { name: quantity, type: integer, source: input, description: "Units to bake; >= 1" }
      - { name: status, type: enum, source: system, description: "PLANNED | BAKING | HOLDING | CLOSED" }
      - { name: baked_at, type: datetime, source: system, description: "Clock value at start-baking" }
      - { name: racked_at, type: datetime, source: system, description: "Clock value at rack transition" }
      - { name: units_available, type: integer, source: computed, description: "Hold units of this run in HOLDING status" }

  - name: HoldUnit
    parent: null
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: input, description: "FK -> ProductionRun.id" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; denormalized from the run at rack time" }
      - { name: status, type: enum, source: system, description: "HOLDING | ALLOCATED | SOLD | DISCARDED" }
      - { name: racked_at, type: datetime, source: system, description: "Clock value when racked" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "racked_at + HOLD_MINUTES; a unit is expired when clock >= hold_expires_at (inclusive boundary)" }
      - { name: allocated_order_id, type: string, source: system, description: "FK -> Order.id; set on allocation, cleared on release" }
      - { name: discarded_reason, type: enum, source: system, description: "HOLD_EXPIRED | DAMAGED | QUALITY | NO_SHOW; set when DISCARDED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id" }
      - { name: daypart_id, type: string, source: input, description: "FK -> Daypart.id; promised daypart" }
      - { name: locker_slot_id, type: string, source: system, description: "FK -> LockerSlot.id; assigned at mark-ready for PORTAL kinds" }
      - { name: customer_id, type: string, source: input, description: "Opaque customer identifier; for role Customer, X-User-ID must equal this value on order-scoped calls" }
      - { name: kind, type: enum, source: input, description: "PORTAL_STANDARD | PORTAL_PREORDER | COUNTER" }
      - { name: lines, type: array, source: input, description: "Array of {product_id, quantity, customized}; quantity >= 1; product_id references Product.id" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line subtotals per order_pricing calculation" }
      - { name: portal_fee_cents, type: integer, source: computed, description: "Sum of per-line round_half_up(line_subtotal * PORTAL_FEE_RATE); 0 for COUNTER kind" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + portal_fee_cents" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED (parallel dimension 1)" }
      - { name: fulfillment_status, type: enum, source: system, description: "PLACED | IN_PREPARATION | READY | PICKED_UP | CANCELLED | EXPIRED_NO_SHOW (parallel dimension 2)" }
      - { name: made_ahead_units, type: integer, source: computed, default: 0, description: "Units satisfied from hold inventory at start-preparation" }
      - { name: made_to_order_units, type: integer, source: computed, default: 0, description: "Units baked to order at start-preparation" }
      - { name: pickup_code, type: string, source: system, description: "6-digit code minted at mark-ready (PORTAL kinds)" }
      - { name: code_expires_at, type: datetime, source: computed, description: "ready_at + CODE_WINDOW_MINUTES; claim valid while clock <= code_expires_at (inclusive boundary)" }
      - { name: ready_at, type: datetime, source: system, description: "Clock value at mark-ready" }

  - name: LockerSlot
    parent: null
    common_fields: true
    fields:
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id" }
      - { name: slot_number, type: integer, source: input, description: "Sequential slot number within the store day; >= 1; unique per store day" }
      - { name: status, type: enum, source: system, description: "IDLE | OCCUPIED | CLEANING (cyclic: IDLE -> OCCUPIED -> CLEANING -> IDLE)" }
      - { name: current_order_id, type: string, source: system, description: "FK -> Order.id; set while OCCUPIED" }
      - { name: occupied_at, type: datetime, source: system, description: "Clock value when OCCUPIED" }
      - { name: cleaning_started_at, type: datetime, source: system, description: "Clock value when CLEANING began" }

  - name: WasteLog
    parent: null
    common_fields: false
    fields:
      - { name: store_day_id, type: string, source: system, description: "FK -> StoreDay.id" }
      - { name: daypart_id, type: string, source: system, description: "FK -> Daypart.id; daypart of the discarded run" }
      - { name: hold_unit_id, type: string, source: system, description: "FK -> HoldUnit.id" }
      - { name: quantity, type: integer, source: system, description: "Always 1 per log row (one row per discarded unit)" }
      - { name: reason, type: enum, source: system, description: "HOLD_EXPIRED | DAMAGED | QUALITY | NO_SHOW" }
      - { name: donated, type: boolean, source: input, default: false, description: "True when the discarded unit was donated (reduces waste_pct_net only)" }
      - { name: logged_at, type: datetime, source: system, description: "Clock value at discard" }

  - name: CrewShift
    parent: null
    common_fields: true
    fields:
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id" }
      - { name: crew_member_id, type: string, source: input, description: "Opaque crew member identifier" }
      - { name: station, type: enum, source: input, description: "OVEN | CUT_TABLE | LOCKER_BAY | DOUGH_PREP" }
      - { name: start_minute, type: integer, source: input, description: "Minutes after business_date 00:00Z; >= 0" }
      - { name: end_minute, type: integer, source: input, description: "Minutes after business_date 00:00Z; must be > start_minute" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ENDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: StoreDay
    initial_state: PLANNING
    terminal_states: [RECONCILED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: POST /store-days/{dayId}/open
        actor: StoreManager
        preconditions:
          - "At least one Daypart exists for this store day with status PLANNED (ERR_NO_DAYPARTS_DEFINED)"
        side_effects:
          - "status → OPEN; version +1"

      - from: OPEN
        to: CLOSED
        trigger: POST /store-days/{dayId}/close
        actor: StoreManager
        preconditions:
          - "Every Daypart of this store day has status CLOSED (ERR_DAYPARTS_STILL_ACTIVE)"
          - "No LockerSlot of this store day has status OCCUPIED (ERR_LOCKER_SLOTS_OCCUPIED)"
        side_effects:
          - "status → CLOSED; version +1"
          - "Every HoldUnit of this store day in status HOLDING → DISCARDED with discarded_reason=HOLD_EXPIRED; one WasteLog row per unit (donated=false); StoreDay.discarded_units and waste fields recomputed"

      - from: CLOSED
        to: RECONCILED
        trigger: POST /store-days/{dayId}/reconcile
        actor: StoreManager
        preconditions: []
        side_effects:
          - "waste_pct_standard and waste_pct_net recomputed once and frozen; version +1"

  - entity: Daypart
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "system (auto-activation when the logical clock reaches window_start_minute while parent StoreDay.status == OPEN)"
        actor: system
        preconditions:
          - "StoreDay.status == OPEN"
          - "clock minute-of-day >= window_start_minute and < window_end_minute"
        side_effects:
          - "status → ACTIVE; version +1"
          - "Each PORTAL_PREORDER Order (PAID, PLACED) promising this daypart is re-evaluated for ready: it transitions to READY as if start-preparation and mark-ready fired, allocating locker slots (ERR_NO_LOCKER_AVAILABLE would apply if capacity ran out — see cross-entity rule)"

      - from: ACTIVE
        to: CLOSED
        trigger: POST /dayparts/{daypartId}/close
        actor: ShiftLead
        preconditions:
          - "No ProductionRun of this daypart in status BAKING (ERR_RUNS_IN_PROGRESS)"
        side_effects:
          - "status → CLOSED; version +1"
          - "Compute forecast_units_final (chronological variant) and freeze it"
          - "Every HoldUnit of this daypart in status HOLDING → DISCARDED with discarded_reason=HOLD_EXPIRED; one WasteLog row per unit (donated=false)"
          - "StoreDay.discarded_units += count; waste_pct_standard / waste_pct_net recomputed on parent (version +1)"
          - "PAID PORTAL_PREORDER Orders promising this daypart that are not yet READY or PICKED_UP → fulfillment_status EXPIRED_NO_SHOW and payment_status REFUNDED; their locker slots (if OCCUPIED for them) → CLEANING"

  - entity: DemandEvent
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /demand-events/{eventId}/cancel
        actor: StoreManager
        preconditions:
          - "DemandEvent.status == SCHEDULED (clock < window_start_at; else ERR_EVENT_NOT_CANCELLABLE)"
        side_effects:
          - "cancelled=true; status → CANCELLED; version +1"
          - "Every PLANNED or ACTIVE Daypart of the same StoreDay whose [window_start_minute, window_end_minute] intersects the event window: forecast_units_provisional recomputed (event removed from the inclusion set), made_ahead_target recomputed"

  - entity: DoughBatch
    initial_state: MIXING
    terminal_states: [DEPLETED, EXPIRED]
    transitions:
      - from: MIXING
        to: PROOFING
        trigger: POST /dough-batches/{batchId}/advance
        actor: CrewMember
        preconditions:
          - "DoughBatch.status == MIXING (ERR_BATCH_STATE)"
        side_effects:
          - "proofing_started_at = clock; version +1"

      - from: PROOFING
        to: PROOFED
        trigger: POST /dough-batches/{batchId}/advance
        actor: CrewMember
        preconditions:
          - "DoughBatch.status == PROOFING (ERR_BATCH_STATE)"
          - "clock >= proofing_started_at + PROOF_MIN_MINUTES (ERR_PROOF_NOT_READY)"
        side_effects:
          - "proofed_at = clock; version +1"

      - from: PROOFED
        to: DEPLETED
        trigger: "system (auto when remaining_units reaches 0 via start-baking consumption)"
        actor: system
        preconditions:
          - "remaining_units == 0"
        side_effects: []

      - from: PROOFED
        to: EXPIRED
        trigger: "system (auto-expiry sweep when clock >= proofed_at + PROOF_MAX_MINUTES)"
        actor: system
        preconditions: []
        side_effects:
          - "status → EXPIRED; remaining_units frozen (unusable)"
          - "version +1"

  - entity: CheeseBatch
    initial_state: PREPPING
    terminal_states: [DEPLETED]
    transitions:
      - from: PREPPING
        to: RESTING
        trigger: POST /cheese-batches/{batchId}/advance
        actor: CrewMember
        preconditions:
          - "CheeseBatch.status == PREPPING (ERR_BATCH_STATE)"
        side_effects:
          - "version +1"

      - from: RESTING
        to: READY
        trigger: POST /cheese-batches/{batchId}/advance
        actor: CrewMember
        preconditions:
          - "CheeseBatch.status == RESTING (ERR_BATCH_STATE)"
          - "clock >= prepped_at + CHEESE_REST_MINUTES (ERR_CHEESE_NOT_READY)"
        side_effects:
          - "ready_at = clock; version +1"

      - from: READY
        to: DEPLETED
        trigger: "system (auto when remaining_units reaches 0 via start-baking consumption)"
        actor: system
        preconditions:
          - "remaining_units == 0"
        side_effects: []

  - entity: ProductionRun
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: BAKING
        trigger: POST /production-runs/{runId}/start-baking
        actor: CrewMember
        preconditions:
          - "ProductionRun.status == PLANNED (ERR_INVALID_STATE)"
          - "Daypart.status == ACTIVE (ERR_DAYPART_NOT_ACTIVE)"
          - "DoughBatch.status == PROOFED and DoughBatch.remaining_units >= quantity (ERR_DOUGH_UNAVAILABLE)"
          - "CheeseBatch.status == READY and CheeseBatch.remaining_units >= quantity (ERR_CHEESE_UNAVAILABLE)"
          - "Product.promo price discipline: this run references a valid product (existence)"
        side_effects:
          - "DoughBatch.remaining_units -= quantity (auto DEPLETED at 0)"
          - "CheeseBatch.remaining_units -= quantity (auto DEPLETED at 0)"
          - "baked_at = clock; version +1"

      - from: BAKING
        to: HOLDING
        trigger: POST /production-runs/{runId}/rack
        actor: CrewMember
        preconditions:
          - "ProductionRun.status == BAKING (ERR_INVALID_STATE)"
          - "Daypart.status == ACTIVE (ERR_DAYPART_NOT_ACTIVE)"
          - "Rack occupancy (count of HOLDING + ALLOCATED HoldUnits of this daypart) + quantity <= Daypart.rack_capacity (ERR_RACK_CAPACITY_EXCEEDED)"
        side_effects:
          - "Create exactly `quantity` HoldUnit rows, status=HOLDING, racked_at=clock, hold_expires_at=clock+HOLD_MINUTES, product_id denormalized from the run"
          - "ProductionRun.units_available = quantity; racked_at = clock; version +1"
          - "StoreDay.produced_units += quantity (parent version +1); waste_pct_standard / waste_pct_net recomputed"

      - from: HOLDING
        to: CLOSED
        trigger: "system (auto when units_available == 0 — all units ALLOCATED, SOLD, or DISCARDED)"
        actor: system
        preconditions:
          - "units_available == 0"
        side_effects: []

  - entity: HoldUnit
    initial_state: HOLDING
    terminal_states: [SOLD, DISCARDED]
    transitions:
      - from: HOLDING
        to: ALLOCATED
        trigger: "system (during POST /orders/{orderId}/start-preparation hold-pull allocation)"
        actor: system
        preconditions:
          - "Order's Daypart matches the HoldUnit's run's daypart"
          - "clock < hold_expires_at (strictly before expiry — boundary clock == hold_expires_at is expired)"
        side_effects:
          - "allocated_order_id = order id; version +1"
          - "ProductionRun.units_available -= 1 (auto CLOSED at 0)"

      - from: ALLOCATED
        to: SOLD
        trigger: "system (when the allocating Order reaches mark-ready)"
        actor: system
        preconditions: []
        side_effects:
          - "StoreDay.sold_units += 1 per unit; parent counters recomputed"

      - from: ALLOCATED
        to: HOLDING
        trigger: "system (order release on cancel/expire when the allocating Order never reached READY)"
        actor: system
        preconditions: []
        side_effects:
          - "allocated_order_id cleared; version +1"
          - "ProductionRun.units_available += 1 (reopens the run from CLOSED only if run status still HOLDING-side eligible; a CLOSED run stays CLOSED)"
          - "On release, if clock >= hold_expires_at the unit does NOT return to HOLDING — it goes directly to DISCARDED (HOLD_EXPIRED) with WasteLog"

      - from: HOLDING
        to: DISCARDED
        trigger: "system (expiry sweep: clock >= hold_expires_at) OR POST /hold-units/{unitId}/discard with reason DAMAGED|QUALITY"
        actor: "system | ShiftLead"
        preconditions:
          - "Manual discard: HoldUnit.status == HOLDING (ERR_INVALID_STATE) and reason in {DAMAGED, QUALITY} (ERR_INVALID_DISCARD_REASON)"
        side_effects:
          - "discarded_reason set; version +1"
          - "Append WasteLog row (donated flag from input on manual discard; false for sweeps)"
          - "StoreDay.discarded_units += 1; donated_units += 1 iff donated; waste_pct_standard / waste_pct_net recomputed (parent version +1)"
          - "ProductionRun.units_available -= 1 (auto CLOSED at 0)"

  - entity: Order
    initial_state: "PLACED / UNPAID (parallel dimensions: payment_status UNPAID; fulfillment_status PLACED)"
    terminal_states: ["PICKED_UP | CANCELLED | EXPIRED_NO_SHOW (fulfillment)", "PAID | REFUNDED (payment)"]
    transitions:
      # --- payment dimension ---
      - from: "payment UNPAID"
        to: "payment PAID"
        trigger: POST /orders/{orderId}/pay
        actor: Customer
        preconditions:
          - "payment_status == UNPAID (ERR_INVALID_STATE)"
          - "fulfillment_status == PLACED (ERR_INVALID_STATE — no payment after preparation began)"
        side_effects:
          - "payment_status → PAID; version +1"
          - "If kind == PORTAL_PREORDER and promised Daypart.status == PLANNED: Daypart.preorder_reserved_units += total line quantity, then Daypart.made_ahead_target recomputed (daypart version +1)"

      - from: "payment PAID"
        to: "payment REFUNDED"
        trigger: "system (companion of fulfillment cancel/expire transitions)"
        actor: system
        preconditions: []
        side_effects: []

      # --- fulfillment dimension ---
      - from: "fulfillment PLACED"
        to: "fulfillment IN_PREPARATION"
        trigger: POST /orders/{orderId}/start-preparation
        actor: CrewMember
        preconditions:
          - "fulfillment_status == PLACED (ERR_INVALID_STATE)"
          - "kind != PORTAL_PREORDER OR promised Daypart.status == ACTIVE (ERR_PREORDER_DAYPART_NOT_ACTIVE)"
          - "payment_status == PAID OR kind == COUNTER (ERR_ORDER_NOT_PAID)"
          - "If parent Daypart.posture == RESTRICTED: the whole request is rejected (ERR_DAYPART_RESTRICTED) before any partial allocation"
        side_effects:
          - "Hold-pull allocation per order allocation algorithm: allocate up to (line quantity - (1 if customized else 0)) fresh units per line from matching-product HOLDING HoldUnits in the same daypart, chosen by earliest racked_at, tie-break created_at; remainder per line is made-to-order"
          - "made_ahead_units / made_to_order_units recorded"
          - "Each allocated HoldUnit → ALLOCATED; each source ProductionRun.units_available decremented (auto CLOSED at 0)"
          - "version +1"

      - from: "fulfillment IN_PREPARATION"
        to: "fulfillment READY"
        trigger: POST /orders/{orderId}/mark-ready
        actor: CrewMember
        preconditions:
          - "fulfillment_status == IN_PREPARATION (ERR_INVALID_STATE)"
          - "For PORTAL kinds: an IDLE LockerSlot exists in the same StoreDay (ERR_NO_LOCKER_AVAILABLE)"
        side_effects:
          - "PORTAL kinds: lowest slot_number IDLE slot → OCCUPIED with current_order_id, occupied_at = clock; pickup_code minted (6-digit, unique among codes whose code_expires_at >= clock in this store day); code_expires_at = clock + CODE_WINDOW_MINUTES; ready_at = clock"
          - "COUNTER kind: ready_at = clock; no locker, no code"
          - "All ALLOCATED HoldUnits of this order → SOLD; StoreDay.sold_units += count"
          - "version +1"

      - from: "fulfillment READY"
        to: "fulfillment PICKED_UP"
        trigger: POST /orders/{orderId}/claim
        actor: Customer
        preconditions:
          - "kind is PORTAL_STANDARD or PORTAL_PREORDER (ERR_NOT_PORTAL_ORDER)"
          - "fulfillment_status == READY (ERR_INVALID_STATE)"
          - "pickup_code matches (ERR_PICKUP_CODE_INVALID)"
          - "clock <= code_expires_at (ERR_PICKUP_CODE_EXPIRED)"
        side_effects:
          - "LockerSlot → CLEANING (cleaning_started_at = clock); slot auto → IDLE after CLEAN_MINUTES via sweep"
          - "version +1"

      - from: "fulfillment PLACED or IN_PREPARATION"
        to: "fulfillment CANCELLED"
        trigger: POST /orders/{orderId}/cancel
        actor: Customer
        preconditions:
          - "fulfillment_status in {PLACED, IN_PREPARATION} (ERR_INVALID_STATE)"
        side_effects:
          - "If payment_status == PAID → REFUNDED"
          - "If kind == PORTAL_PREORDER and the order had been PAID while its Daypart was PLANNED (reservation consumed): Daypart.preorder_reserved_units -= total line quantity; made_ahead_target recomputed"
          - "Allocated HoldUnits of this order → released per HoldUnit ALLOCATED→HOLDING rule (fresh) or → DISCARDED (expired at release)"
          - "version +1"

      - from: "fulfillment READY"
        to: "fulfillment EXPIRED_NO_SHOW"
        trigger: "system (no-show sweep when clock > code_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status PAID → REFUNDED"
          - "Each unit of the order is appended to WasteLog with reason=NO_SHOW (one row per unit, donated=false); StoreDay.discarded_units += count; waste fields recomputed (these units were already counted in sold_units at READY — they remain counted as sold AND as discarded; produced_units is unchanged)"
          - "LockerSlot → CLEANING; auto → IDLE after CLEAN_MINUTES"

  - entity: LockerSlot
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: OCCUPIED
        trigger: "system (at Order mark-ready)"
        actor: system
        preconditions:
          - "LockerSlot.status == IDLE"
        side_effects:
          - "current_order_id set; occupied_at = clock; version +1"

      - from: OCCUPIED
        to: CLEANING
        trigger: "system (order PICKED_UP claim, EXPIRED_NO_SHOW sweep, or daypart-close preorder expiry)"
        actor: system
        preconditions: []
        side_effects:
          - "cleaning_started_at = clock; current_order_id kept for audit; version +1"

      - from: CLEANING
        to: IDLE
        trigger: "system (auto when clock >= cleaning_started_at + CLEAN_MINUTES)"
        actor: system
        preconditions: []
        side_effects:
          - "current_order_id cleared; version +1"

  - entity: CrewShift
    initial_state: SCHEDULED
    terminal_states: [ENDED]
    transitions:
      - from: SCHEDULED
        to: ENDED
        trigger: POST /crew-shifts/{shiftId}/end
        actor: ShiftLead
        preconditions:
          - "CrewShift.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "version +1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: daypart-update-stale-version
    parent_entity: Daypart
    write_endpoint: "PUT /dayparts/{daypartId}"
    occ_field: "expected_daypart_version"
    description: |
      Updating a Daypart (window, capacity, base demand) with an
      expected_daypart_version that no longer matches the server's current
      version is rejected. This captures the case where another writer has just
      updated the daypart (or a system side effect such as a preorder
      reservation bump advanced the version) and the current writer's view of
      the daypart is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: storeday-update-stale-version
    parent_entity: StoreDay
    write_endpoint: "PUT /store-days/{dayId}"
    occ_field: "expected_store_day_version"
    description: |
      Updating a StoreDay with an expected_store_day_version that no longer
      matches the server's current version is rejected: another mutation (for
      example a production run racking units, which bumps produced_units and
      the parent version) has advanced the day since the client last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: daypart_forecast
    trigger: "Daypart create/read; recomputed when a DemandEvent for the same StoreDay is created or cancelled; final variant computed once at Daypart close"
    algorithm: forward_looking
    formula: |
      # provisional (forward-looking):
      overlapping = DemandEvents e of the same StoreDay with e.cancelled == false
                    and e.status in {SCHEDULED, ACTIVE}
                    and e.window_start_at <= daypart_end_instant
                    and daypart_start_instant <= e.window_end_at   (closed-interval overlap)
      M = max(1.0, sum(e.demand_multiplier for e in overlapping))
      forecast_units_provisional = round_half_up(base_demand_units * M)
      # final (chronological, at close):
      overlapping_final = DemandEvents e with e.cancelled == false
                    and e.status in {ACTIVE, ENDED}
                    and same closed-interval overlap predicate
      M_f = max(1.0, sum(e.demand_multiplier for e in overlapping_final))
      forecast_units_final = round_half_up(base_demand_units * M_f)
    input_set: "DemandEvents of the same StoreDay; status filter differs per variant"
    constants:
      MULTIPLIER_FLOOR: 1.0
    precision: "integer units, round_half_up"
    variants:
      - name: provisional
        when: "Daypart status PLANNED or ACTIVE"
        difference: "Includes SCHEDULED events (events whose window has not started yet); excludes ENDED events"
      - name: final
        when: "Daypart close"
        difference: "Includes only events in ACTIVE or ENDED status at close time; a SCHEDULED (not yet started) event is excluded, so the same event set can yield a different forecast than the provisional value"

  - name: made_ahead_target
    trigger: "Recomputed whenever forecast_units_provisional or preorder_reserved_units changes (daypart create, event create/cancel, preorder pay/cancel)"
    algorithm: threshold
    formula: |
      made_ahead_target = max(0, min(rack_capacity,
        round_half_up(forecast_units_provisional * MADE_AHEAD_RATIO)) - preorder_reserved_units)
    input_set: "The owning Daypart row"
    constants:
      MADE_AHEAD_RATIO: 0.6
    precision: "integer units, round_half_up"
    note: "Reservation units are subtracted AFTER the capacity clamp; result floored at 0"

  - name: order_pricing
    trigger: "POST /orders (computed at creation; frozen thereafter)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round per line first, then sum. Sum-then-round
      # is forbidden and produces different cents.
      for each line:
        unit_price = promo_price_cents if (product.promo_price_cents present AND NOT line.customized)
                     else list_price_cents
        line_subtotal = unit_price * line.quantity
        if kind in {PORTAL_STANDARD, PORTAL_PREORDER}:
          line_fee = round_half_up(line_subtotal * PORTAL_FEE_RATE)
        else:
          line_fee = 0
      subtotal_cents = sum(line_subtotal)
      portal_fee_cents = sum(line_fee)        # per-line fees summed AFTER per-line rounding
      total_cents = subtotal_cents + portal_fee_cents
    input_set: "Order.lines with referenced Product rows"
    constants:
      PORTAL_FEE_RATE: 0.05
    precision: "integer cents, round_half_up per line"

  - name: waste_pct
    trigger: "Every HoldUnit discard (manual, expiry sweep, daypart close, store-day close, no-show); frozen at StoreDay reconcile"
    algorithm: aggregation
    formula: |
      waste_pct_standard = if produced_units == 0 then 0.0
                           else round_half_up(discarded_units / produced_units * 100, 2)
      waste_pct_net      = if produced_units == 0 then 0.0
                           else round_half_up((discarded_units - donated_units) / produced_units * 100, 2)
      # posture trigger (threshold): a Daypart's posture is RESTRICTED iff the
      # parent StoreDay.waste_pct_standard >= WASTE_TARGET_PCT, else NORMAL.
      # Boundary is INCLUSIVE: waste_pct_standard == WASTE_TARGET_PCT exactly flips posture.
    input_set: "StoreDay counters (produced_units, discarded_units, donated_units)"
    constants:
      WASTE_TARGET_PCT: 5.0
      HOLD_MINUTES: 30
      CODE_WINDOW_MINUTES: 45
      CLEAN_MINUTES: 15
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard
        when: "Posture gating and store reporting"
        difference: "Counts every discarded unit including donated ones"
      - name: net
        when: "Waste-performance reporting only (never gates posture)"
        difference: "Subtracts donated_units from the numerator, so identical raw waste data yields a lower percentage than the standard variant"

  - name: hold_pull_allocation
    trigger: "POST /orders/{orderId}/start-preparation"
    algorithm: waterfall_allocation
    formula: |
      for each order line (in request order):
        desired_from_hold = line.quantity - (1 if line.customized else 0)
        pool = HoldUnits with status == HOLDING,
               product_id == line.product_id,
               run's daypart_id == order.daypart_id,
               clock < hold_expires_at
        sort pool by racked_at ASC, tie-break created_at ASC
        take min(desired_from_hold, len(pool)) units -> ALLOCATED to this order
        made_to_order for this line = line.quantity - allocated_count
      # Boundary: a line with quantity == 1 and customized == true takes
      # desired_from_hold == 0 units from hold — the whole line is made-to-order.
      # A zero-length pool yields allocation 0 with no error (silent fallback to
      # made-to-order); ERR_NO_LOCKER_AVAILABLE is NOT raised here.
    input_set: "HOLDING, unexpired, same-daypart, same-product HoldUnits"
    precision: "integer units"

  - name: dough_proof_window
    trigger: "POST /dough-batches/{id}/advance (PROOFING -> PROOFED) and batch expiry sweep"
    algorithm: threshold
    formula: |
      may_mark_proofed  = clock >= proofing_started_at + PROOF_MIN_MINUTES   (inclusive lower bound)
      expired           = clock >= proofed_at + PROOF_MAX_MINUTES            (inclusive upper bound -> EXPIRED)
      usable for baking = status == PROOFED and not expired
    constants:
      PROOF_MIN_MINUTES: 120
      PROOF_MAX_MINUTES: 240
    precision: "minute precision on the logical clock"

  - name: locker_slot_selection
    trigger: "POST /orders/{orderId}/mark-ready (PORTAL kinds)"
    algorithm: aggregation
    formula: |
      pool = LockerSlots of the order's StoreDay with status == IDLE
      if pool empty: reject ERR_NO_LOCKER_AVAILABLE
      winner = min(pool, key = slot_number ASC)     # deterministic; id never consulted
      winner -> OCCUPIED for this order
    input_set: "IDLE LockerSlots of the same StoreDay"
    precision: "n/a"

  - name: crew_shift_conflict
    trigger: "POST /crew-shifts"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: [start_minute, end_minute).
      conflict(candidate, existing) =
        existing.status == SCHEDULED
        and existing.crew_member_id == candidate.crew_member_id
        and candidate.start_minute < existing.end_minute
        and existing.start_minute < candidate.end_minute
      # Back-to-back shifts (candidate.start == existing.end) do NOT conflict.
    input_set: "CrewShifts of the same StoreDay with matching crew_member_id and status SCHEDULED"
    precision: "integer minutes"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must have permission for this operation; for role Customer on order-scoped endpoints, X-User-ID must equal Order.customer_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Resource ids in path and body must exist, validated left-to-right (path first)"
    error_id: "ERR_STORE_DAY_NOT_FOUND | ERR_DAYPART_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PRODUCTION_RUN_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_LOCKER_SLOT_NOT_FOUND | ERR_CREW_SHIFT_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_HOLD_UNIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 4
    category: state
    check: "Target resource must be in the correct state for this operation (per state machine preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 5
    category: state
    check: "start-preparation: promised Daypart.posture must be NORMAL (RESTRICTED posture from waste breach gates all child order preparation)"
    error_id: ERR_DAYPART_RESTRICTED
    http_status: 409
    applies_to: "POST /orders/{orderId}/start-preparation"

  - priority: 6
    category: business_safety
    check: "Daypart create: no overlapping daypart window within the same StoreDay (half-open [start,end) overlap, any label)"
    error_id: ERR_DAYPART_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /store-days/{dayId}/dayparts"

  - priority: 7
    category: business_safety
    check: "DemandEvent create: no other non-cancelled DemandEvent of the same StoreDay may have a closed-interval intersection with the candidate window (adjacency window_end == other.window_start DOES intersect under closed semantics)"
    error_id: ERR_EVENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /store-days/{dayId}/demand-events"

  - priority: 8
    category: business_safety
    check: "CrewShift create: crew member must not have a conflicting SCHEDULED shift (half-open overlap; back-to-back allowed); small-footprint rule: at most one SCHEDULED shift per station may cover any minute of the candidate window"
    error_id: ERR_SHIFT_CONFLICT
    http_status: 409
    applies_to: "POST /store-days/{dayId}/crew-shifts"

  - priority: 9
    category: business_safety
    check: "Dough proof window: advance to PROOFED requires clock >= proofing_started_at + 120; cheese advance to READY requires clock >= prepped_at + 30"
    error_id: "ERR_PROOF_NOT_READY | ERR_CHEESE_NOT_READY"
    http_status: 409
    applies_to: "POST /dough-batches/{id}/advance, POST /cheese-batches/{id}/advance"

  - priority: 10
    category: business_safety
    check: "start-baking: dough batch PROOFED with remaining >= quantity; cheese batch READY with remaining >= quantity"
    error_id: "ERR_DOUGH_UNAVAILABLE | ERR_CHEESE_UNAVAILABLE"
    http_status: 409
    applies_to: "POST /production-runs/{id}/start-baking"

  - priority: 11
    category: business_fiscal
    check: "Product create/update: promo_price_cents, when present, must be < list_price_cents (promotional price point discipline)"
    error_id: ERR_PROMO_PRICE_INVALID
    http_status: 422
    applies_to: "POST /products, PUT /products/{id}"

  - priority: 12
    category: business_fiscal
    check: "promo_price_cents may not be created, changed, or removed while Product.promo_locked is true (an OPEN StoreDay has a non-CLOSED ProductionRun of this product)"
    error_id: ERR_PROMO_PRICE_LOCKED
    http_status: 409
    applies_to: "PUT /products/{id}"

  - priority: 13
    category: business_constraint
    check: "Order create: for each line with customized == true, the referenced Product.customization_allowed must be true (limited customization to protect speed)"
    error_id: ERR_CUSTOMIZATION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /orders"

  - priority: 14
    category: business_constraint
    check: "Order create: kind == PORTAL_PREORDER requires the promised Daypart.status == PLANNED; kinds PORTAL_STANDARD and COUNTER require Daypart.status == ACTIVE"
    error_id: "ERR_PREORDER_DAYPART_NOT_PLANNED | ERR_DAYPART_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /orders"

  - priority: 15
    category: business_constraint
    check: "rack: rack occupancy of the daypart + run quantity <= daypart.rack_capacity"
    error_id: ERR_RACK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /production-runs/{id}/rack"

  - priority: 16
    category: business_constraint
    check: "mark-ready (PORTAL kinds): an IDLE LockerSlot must exist in the order's StoreDay"
    error_id: ERR_NO_LOCKER_AVAILABLE
    http_status: 409
    applies_to: "POST /orders/{orderId}/mark-ready"

  - priority: 17
    category: business_temporal
    check: "claim: pickup_code must match and clock <= code_expires_at (inclusive)"
    error_id: "ERR_PICKUP_CODE_INVALID | ERR_PICKUP_CODE_EXPIRED"
    http_status: 409
    applies_to: "POST /orders/{orderId}/claim"

  - priority: 18
    category: business_referential
    check: "PUT /dayparts/{id} and PUT /store-days/{id} require expected_*_version equal to the current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /dayparts/{daypartId}, PUT /store-days/{dayId}"

  - priority: 19
    category: business_referential
    check: "StoreDay.business_date unique; Product.sku unique; LockerSlot.slot_number unique per StoreDay"
    error_id: "ERR_DUPLICATE_BUSINESS_DATE | ERR_DUPLICATE_SKU | ERR_DUPLICATE_SLOT_NUMBER"
    http_status: 409
    applies_to: "POST /store-days, POST /products, POST /store-days/{dayId}/locker-slots"

  - priority: 20
    category: business_constraint
    check: "Field shape/range: window_end_minute > window_start_minute; quantity >= 1; demand_multiplier > 0; discount fields non-negative"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary ISO8601 UTC instant. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z (startup default; never falls back to wall-clock). All daypart windows, proofing windows, hold expiry, pickup-code windows, event status, and sweeps evaluate against this clock."
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Run all clock-driven sweeps at the new instant: dough EXPIRED; HoldUnit HOLDING expiry -> DISCARDED (HOLD_EXPIRED); no-show READY -> EXPIRED_NO_SHOW when clock > code_expires_at; LockerSlot CLEANING -> IDLE; DemandEvent status recompute; Daypart auto-activation PLANNED -> ACTIVE when window reached and StoreDay OPEN"

  # --- StoreDay ---
  - method: POST
    path: "/store-days"
    description: "Create a store day"
    roles: [StoreManager]
    code: 201
    input: [business_date]
    output: StoreDay
    side_effects: ["counters initialized to 0; status PLANNING"]

  - method: GET
    path: "/store-days"
    description: "List store days"
    roles: [StoreManager, ShiftLead, CrewMember, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "StoreDay[]"
    side_effects: []

  - method: GET
    path: "/store-days/{dayId}"
    description: "Get a store day"
    roles: [StoreManager, ShiftLead, CrewMember, Customer]
    code: 200
    input: []
    output: StoreDay
    side_effects: []

  - method: PUT
    path: "/store-days/{dayId}"
    description: "Update a store day (business_date) with OCC"
    roles: [StoreManager]
    code: 200
    input: ["business_date?", expected_store_day_version]
    output: StoreDay
    side_effects: ["increments StoreDay.version by 1"]

  - method: POST
    path: "/store-days/{dayId}/open"
    description: "Open the store day"
    roles: [StoreManager]
    code: 200
    input: []
    output: StoreDay
    side_effects: ["status PLANNING -> OPEN; daypart auto-activation sweep may fire immediately"]

  - method: POST
    path: "/store-days/{dayId}/close"
    description: "Close the store day; discards all remaining HOLDING units"
    roles: [StoreManager]
    code: 200
    input: []
    output: StoreDay
    side_effects: ["status OPEN -> CLOSED; all HOLDING units DISCARDED with WasteLog rows"]

  - method: POST
    path: "/store-days/{dayId}/reconcile"
    description: "Reconcile (freeze waste figures)"
    roles: [StoreManager]
    code: 200
    input: []
    output: StoreDay
    side_effects: ["status CLOSED -> RECONCILED"]

  - method: GET
    path: "/store-days/{dayId}/waste-report"
    description: "Waste report for a store day"
    roles: [StoreManager, ShiftLead]
    code: 200
    input: []
    output: { store_day_id: string, produced_units: integer, sold_units: integer, discarded_units: integer, donated_units: integer, waste_pct_standard: number, waste_pct_net: number, waste_target_pct: number, target_breached: boolean }
    side_effects: []

  # --- Daypart ---
  - method: POST
    path: "/store-days/{dayId}/dayparts"
    description: "Create a daypart within a store day"
    roles: [StoreManager]
    code: 201
    input: [label, window_start_minute, window_end_minute, rack_capacity, base_demand_units]
    output: Daypart
    side_effects: ["forecast_units_provisional and made_ahead_target computed"]

  - method: GET
    path: "/store-days/{dayId}/dayparts"
    description: "List dayparts of a store day"
    roles: [StoreManager, ShiftLead, CrewMember, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Daypart[]"
    side_effects: []

  - method: GET
    path: "/dayparts/{daypartId}"
    description: "Get a daypart"
    roles: [StoreManager, ShiftLead, CrewMember, Customer]
    code: 200
    input: []
    output: Daypart
    side_effects: []

  - method: PUT
    path: "/dayparts/{daypartId}"
    description: "Update a daypart (window minutes, rack_capacity, base_demand_units) with OCC; only while PLANNED"
    roles: [StoreManager]
    code: 200
    input: ["window_start_minute?", "window_end_minute?", "rack_capacity?", "base_demand_units?", expected_daypart_version]
    output: Daypart
    side_effects: ["increments Daypart.version by 1; forecast and made_ahead_target recomputed"]

  - method: POST
    path: "/dayparts/{daypartId}/close"
    description: "Close a daypart: freeze final forecast, discard remaining hold units, expire outstanding preorders"
    roles: [ShiftLead]
    code: 200
    input: []
    output: Daypart
    side_effects: ["status ACTIVE -> CLOSED; forecast_units_final frozen; HOLDING units discarded; outstanding PAID preorders EXPIRED_NO_SHOW + REFUNDED"]

  # --- DemandEvent ---
  - method: POST
    path: "/store-days/{dayId}/demand-events"
    description: "Create a demand event (sports day, local event spike)"
    roles: [StoreManager]
    code: 201
    input: [name, window_start_at, window_end_at, demand_multiplier]
    output: DemandEvent
    side_effects: ["overlapping dayparts' forecast_units_provisional and made_ahead_target recomputed"]

  - method: GET
    path: "/store-days/{dayId}/demand-events"
    description: "List demand events of a store day"
    roles: [StoreManager, ShiftLead, CrewMember]
    code: 200
    input: ["limit?", "offset?", "store_day_id?"]
    output: "DemandEvent[]"
    side_effects: []

  - method: GET
    path: "/demand-events/{eventId}"
    description: "Get a demand event"
    roles: [StoreManager, ShiftLead, CrewMember]
    code: 200
    input: []
    output: DemandEvent
    side_effects: []

  - method: POST
    path: "/demand-events/{eventId}/cancel"
    description: "Cancel a SCHEDULED demand event"
    roles: [StoreManager]
    code: 200
    input: []
    output: DemandEvent
    side_effects: ["status -> CANCELLED; overlapping dayparts' forecasts recomputed without this event"]

  # --- DoughBatch / CheeseBatch ---
