      - name: station_listing_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /stations
          - response_envelope.pagination_fields
          - entities.Station.fields.safety_posture
        distinguishing_aspect: |
          The list envelope's total_count counts the FILTERED set, not the table: three stations
          exist, two of which are still RESTRICTED at birth, so limit/offset paging and the
          safety_posture filter compose rather than conflict.
        test_recipe:
          setup:
            - "Three stations under one agreement; only STN-E12A is given a HIGH vessel, so it alone reaches OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E12", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E12A", name: "Station A", nozzle_count: 2, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_a: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E12B", name: "Station B", nozzle_count: 2, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_b: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E12C", name: "Station C", nozzle_count: 2, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_c: "$.data.id" }
            - call: "POST /stations/${st_a}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_a: "$.data.id" }
          trigger:
            - call: "GET /stations"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { page1: "$.data" }
            - call: "GET /stations"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
              captures: { page2: "$.data" }
            - call: "GET /stations"
              payload: { safety_posture: "RESTRICTED", limit: 10, offset: 0 }
              as: PlatformAdmin
              captures: { restricted: "$.data" }
            - call: "GET /stations"
              payload: { funding_agreement_id: "${fa_id}", limit: 10, offset: 101 }
              as: PlatformAdmin
              captures: { page4: "$.data" }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"
            - "the RESTRICTED filter returns exactly ${st_b} and ${st_c} with total_count == 2 (${st_a} is OPEN)"
            - "the fourth call is accepted (offset 101 is legal; only limit is bounded to [1,100]) and returns 0 rows with total_count == 3 and has_more == false"

      - name: station_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET /stations/{id}
        excluded_because:
          difficulty_instance: boundary_precision_check / high_bank_deliverable_exactly_at_min_keeps_posture_open
          rationale: |
            That instance reads GET /stations/{id} twice around the boundary draw and asserts the
            stored input fields alongside every recomputed aggregate, which is strictly stronger
            than a plain round-trip retrieval claim.

  # ===========================================================================
  - section: state_machines
    instances:
      - name: safety_event_clear_without_acknowledge_returns_invalid_state_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.SafetyEvent.OPEN_to_ACKNOWLEDGED
          - state_machines.SafetyEvent.ACKNOWLEDGED_to_CLEARED
          - validations[priority=80]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          §1.2 declares no OPEN -> CLEARED edge: acknowledgement is mandatory, so clearing an OPEN
          event is refused at priority 80 and the event keeps status OPEN with cleared_at still null
          (a MINOR OVERPRESSURE event is used so the station posture never enters the picture).
        test_recipe:
          setup:
            - "Station STN-S1 with one HIGH 600 L vessel at 950.00 bar (posture OPEN)."
            - "One OPEN SafetyEvent of kind OVERPRESSURE, severity MINOR — neither a freezing nor a restricting condition."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-S1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-S1", name: "Event Station S1", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /safety-events"
              payload: { station_id: "${st_id}", kind: "OVERPRESSURE", severity: "MINOR", affected_nozzle_count: 0, detected_by: "OPERATOR_ROUND" }
              as: SafetyOfficer
              as_user_id: "SO-1"
              captures: { ev_id: "$.data.id" }
          trigger:
            - call: "POST /safety-events/${ev_id}/clear"
              payload: { corrective_action: "Reseated relief valve" }
              as: SafetyOfficer
              as_user_id: "SO-2"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "SafetyEvent.${ev_id}.status == OPEN"
            - "SafetyEvent.${ev_id}.cleared_at is null and cleared_by_user_id is null and corrective_action is null"
            - "Station.${st_id}.safety_posture == OPEN throughout (a MINOR OVERPRESSURE event neither freezes nor restricts)"

      - name: safety_event_acknowledged_twice_returns_invalid_state_transition
        claim_type: idempotency
        grounds:
          - state_machines.SafetyEvent.OPEN_to_ACKNOWLEDGED
          - entities.SafetyEvent.fields.acknowledged_at
          - validations[priority=80]
        distinguishing_aspect: |
          Acknowledgement is not idempotent by design: the second call is rejected at priority 80
          rather than returning the same 200, and acknowledged_at keeps its FIRST value even after
          the clock has moved, proving the timestamp is not re-stamped.
        test_recipe:
          setup:
            - "Station STN-S2 with one OPEN MINOR OVERPRESSURE SafetyEvent, clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-S2", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-S2", name: "Event Station S2", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /safety-events"
              payload: { station_id: "${st_id}", kind: "OVERPRESSURE", severity: "MINOR", affected_nozzle_count: 0, detected_by: "SENSOR" }
              as: SafetyOfficer
              as_user_id: "SO-1"
              captures: { ev_id: "$.data.id" }
            - call: "POST /safety-events/${ev_id}/acknowledge"
              payload: {}
              as: SafetyOfficer
              as_user_id: "SO-2"
              captures: { ack_at: "$.data.acknowledged_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /safety-events/${ev_id}/acknowledge"
              payload: {}
              as: SafetyOfficer
              as_user_id: "SO-2"
              captures: { err: "$.data.error_id" }
          assert:
            - "First acknowledge: HTTP 200, status == ACKNOWLEDGED, ${ack_at} == 2026-08-01T00:00:00Z"
            - "Second acknowledge: HTTP 409 with ${err} == ERR_INVALID_STATE_TRANSITION"
            - "SafetyEvent.${ev_id}.status == ACKNOWLEDGED"
            - "SafetyEvent.${ev_id}.acknowledged_at == 2026-08-01T00:00:00Z (NOT re-stamped to 04:00:00Z)"

      - name: quarantined_delivery_cannot_be_rescheduled_or_offloaded
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Delivery.ARRIVED_to_QUARANTINED
          - state_machines.Delivery.terminal_states
          - validations[priority=80]
        distinguishing_aspect: |
          QUARANTINED is terminal while REJECTED is not, even though both come from the same
          /reject endpoint: the reject_reason PURITY_FAIL routes the branch to the terminal state,
          so neither reschedule nor offload is available afterwards and reschedule_count stays 0.
        test_recipe:
          setup:
            - "Station STN-S3 with a LOW 5000 L vessel at 300.00 bar and two current EMERGENCY_RESPONSE certifications."
            - "One PRODUCED lot (release is unnecessary because the delivery is rejected, not accepted)."
            - "Delivery of 100.000 kg TUBE_TRAILER, window [2026-08-02T00:00:00Z, 2026-08-02T06:00:00Z), arrived at 2026-08-02T01:00:00Z, then rejected with PURITY_FAIL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-S3", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-S3", name: "Quarantine Yard", nozzle_count: 2, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H35", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-S3-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-S3-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /production-assets"
              payload: { asset_code: "PA-S3-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-S3-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 50.000, hourly_matched_renewable_pct: 50.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-S3-1", mass_kg: 300.000, energy_consumed_kwh: 15600.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_id: "$.data.id" }
            - call: "POST /deliveries"
              payload: { station_id: "${st_id}", production_lot_id: "${lot_id}", receiving_vessel_id: "${v_low}", mode: "TUBE_TRAILER", planned_kg: 100.000, window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", departed_at: "2026-08-01T12:00:00Z", trailer_water_volume_l: 2500.0, trailer_final_pressure_bar: 210.00 }
              as: LogisticsDispatcher
              captures: { del_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deliveries/${del_id}/arrive"
              payload: {}
              as: LogisticsDispatcher
            - call: "POST /deliveries/${del_id}/reject"
              payload: { reject_reason: "PURITY_FAIL" }
              as: StationOperator
              as_user_id: "${st_id}"
          trigger:
            - call: "POST /deliveries/${del_id}/reschedule"
              payload: { window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-03T06:00:00Z" }
              as: LogisticsDispatcher
              captures: { err_resched: "$.data.error_id" }
            - call: "POST /deliveries/${del_id}/offload"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { err_offload: "$.data.error_id" }
          assert:
            - "Both triggers return HTTP 409 with ERR_INVALID_STATE_TRANSITION (${err_resched} and ${err_offload})"
            - "Delivery.${del_id}.status == QUARANTINED"
            - "Delivery.${del_id}.reschedule_count == 0"
            - "Delivery.${del_id}.window_start == 2026-08-02T00:00:00Z (unchanged)"
            - "Station.${st_id}.inbound_planned_kg == 0.000 (a QUARANTINED delivery has left the inbound set)"
            - "Station.${st_id}.onsite_inventory_kg == 120.000 (opening balance only; nothing was received)"

      - name: delivery_third_reschedule_rejected_at_max_reschedules
        claim_type: cyclic
        grounds:
          - state_machines.Delivery.REJECTED_to_SCHEDULED
          - calculations.operational_thresholds.MAX_RESCHEDULES
          - validations[priority=250]
          - errors[ERR_RESCHEDULE_LIMIT_REACHED]
        distinguishing_aspect: |
          The Delivery cycle SCHEDULED -> ARRIVED -> REJECTED -> SCHEDULED is bounded, not endless:
          reschedule_count is the loop counter and the THIRD reschedule attempt is refused at
          priority 250 while the row stays parked in REJECTED — the loop terminates by error, not
          by an automatic terminal transition.
        test_recipe:
          setup:
            - "Station STN-S4 with one LOW 5000 L vessel, offload_bay_count 1 and two current responder certifications."
            - "One PRODUCED lot; one 100.000 kg TUBE_TRAILER delivery in window W1 [2026-08-02T00:00:00Z, 2026-08-02T06:00:00Z)."
            - "Each cycle: move the clock inside the current window, arrive, reject with DOCUMENTATION, then reschedule into the next day's window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-S4", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
