      - name: refund_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVOICE_NOT_REFUNDABLE]
          - errors[ERR_REFUND_WINDOW_EXPIRED]
        distinguishing_aspect: |
          state (invoice not PAID, pri 6) vs business_temporal (refund window expired, pri 9). An
          already-REFUNDED invoice re-refunded after the window closed returns ERR_INVOICE_NOT_REFUNDABLE
          (state wins). Pair: state vs temporal — different from the referential/fiscal pair above.
        test_recipe:
          setup:
