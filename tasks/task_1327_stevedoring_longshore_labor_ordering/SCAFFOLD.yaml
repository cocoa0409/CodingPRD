  # --- GangOrder ---
  - method: POST
    path: "/api/gang-orders"
    description: "Place a gang order on a shift (created directly in PLACED)"
    roles: [StevedoreSuperintendent]
    code: 201
    input: [shift_window_id, gang_type, required_classification, required_headcount, required_equipment_type, required_equipment_count]
    output: GangOrder
    side_effects: ["status=PLACED", "filled_headcount=0, offered_count=0, assigned_equipment_ok=false"]
  - method: GET
    path: "/api/gang-orders"
    description: "List gang orders (FK reverse-reachability for GangOrder.shift_window_id)"
    roles: [StevedoreAdmin, StevedoreSuperintendent, LaborHallDispatcher, GangForeman, ClaimsAdjuster, PayrollClerk, BillingClerk]
    code: 200
    input: ["shift_window_id?", "status?", "limit?", "offset?"]
    output: GangOrder[]
    side_effects: []
  - method: GET
    path: "/api/gang-orders/{id}"
    description: "Get a gang order"
    roles: [StevedoreAdmin, StevedoreSuperintendent, LaborHallDispatcher, GangForeman, ClaimsAdjuster, PayrollClerk, BillingClerk]
    code: 200
    input: []
    output: GangOrder
    side_effects: []
  - method: PATCH
    path: "/api/gang-orders/{id}"
    description: "Amend headcount / equipment requirement (PLACED/DISPATCHING/SHORT_MANNED/MANNED only); reducing below filled triggers the amendment bump waterfall; OCC-guarded"
    roles: [StevedoreSuperintendent]
    code: 200
    input: ["required_headcount?", "required_equipment_count?", expected_gang_order_version]
    output: GangOrder
    side_effects:
      - "Increments GangOrder.version by 1"
      - "If new required_headcount < filled_headcount: bump least-senior CHECKED_IN/WORKING assignments (seniority_rank_at_dispatch DESC, tie created_at DESC) until filled == required; amendment bumps do NOT auto-offer"
      - "Outstanding OFFERED assignments are NOT cancelled by an amendment (they are bounced later at check-in via ERR_GANG_FULL when the gang is already full)"
      - "Manning status recomputed (MANNED may regress to DISPATCHING)"
  - method: POST
    path: "/api/gang-orders/{id}/cancel"
    description: "Cancel a gang order from any non-terminal state"
    roles: [StevedoreSuperintendent]
    code: 200
    input: []
    output: GangOrder
    side_effects: ["status -> CANCELLED", "non-terminal assignments -> CANCELLED", "RESERVED/ACTIVE equipment assignments -> RELEASED, units freed"]
  - method: POST
    path: "/api/gang-orders/{id}/start-work"
    description: "Start work (MANNED/SHORT_MANNED -> WORKING) or resume (SUSPENDED -> WORKING)"
    roles: [GangForeman]
    code: 200
    input: []
    output: GangOrder
    side_effects: ["status -> WORKING", "CHECKED_IN assignments -> WORKING", "RESERVED equipment assignments -> ACTIVE"]
  - method: POST
    path: "/api/gang-orders/{id}/complete"
    description: "Complete a WORKING gang order; computes MPH and bonus; bubbles up to shift close"
    roles: [GangForeman]
    code: 200
    input: []
    output: GangOrder
    side_effects:
      - "status -> COMPLETED"
      - "CHECKED_IN/WORKING assignments -> COMPLETED; OFFERED -> CANCELLED"
      - "RESERVED/ACTIVE equipment assignments -> RELEASED; units freed"
      - "actual_mph, bonus_eligible, bonus_pool_cents, bonus_per_worker_cents computed"
      - "ShiftWindow -> CLOSED when all sibling gang orders terminal"
  - method: POST
    path: "/api/gang-orders/{id}/dispatch-batch"
    description: "Run labor-hall dispatch selection for open slots; OCC-guarded; optional forced worker list"
    roles: [LaborHallDispatcher]
    code: 200
    input: [expected_gang_order_version, "worker_ids?"]
    output: GangOrder
    side_effects:
      - "Create OFFERED DispatchAssignments per calculation dispatch_selection"
      - "Manning status transitions PLACED->DISPATCHING / ->SHORT_MANNED / ->MANNED per filled_headcount derivation"
      - "Increments GangOrder.version by 1"
