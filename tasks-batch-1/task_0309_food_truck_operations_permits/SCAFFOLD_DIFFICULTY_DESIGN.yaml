    instances:
      - name: reservation_fee_balance_net_zero_on_full_refund_cancel
        grounds:
          - calculations.reservation_fee_balance
          - state_machines.Booking.RESERVED_to_CANCELLED
          - entities.OperatorTruck.fields.reservation_fee_balance_cents
        distinguishing_aspect: "Conserved quantity = truck.reservation_fee_balance_cents (cents): a create (debit +2500) paired with its compensating early cancel (full refund -2500) returns the balance to its pre-create value (0), pinned as sum(active fees) - sum(refunds)."
        test_recipe:
          setup:
            - "An OPERABLE truck with reservation_fee_balance_cents=0; it books a 2500-fee spot far in the future (well before cutoff), then cancels before the cutoff for a full refund."
          setup_api_calls:
