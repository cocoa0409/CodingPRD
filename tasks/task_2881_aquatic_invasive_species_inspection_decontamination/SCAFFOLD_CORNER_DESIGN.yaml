          - endpoints.POST_/inspection-records/{id}/screening
          - errors.ERR_STALE_WATERCRAFT_VERSION
        distinguishing_aspect: "The declared rule's own write endpoint and occ_field: a re-screen replaying the version the client read before the FIRST screening is refused 412, the same call with the version read after it succeeds, and every accepted screening advances Watercraft.version by exactly one - so the vessel row, not the record, is the concurrency anchor."
        test_recipe:
          setup:
            - "The standard station on a CLEAN LOW water body; one vessel screened once already."
            - "wc_v1 is the vessel version as created; wc_v2 is the version after the first screening."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Nilan Reservoir", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "LOW", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Nilan Ramp", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true }
