          trigger:
            - call: "GET /institutions/${co_inst_id}"
              as: ReceivershipTrustee
              captures: { co_ver1: $.data.version }
            - call: "POST /institutions/${co_inst_id}/dividend-distributions"
              payload: { priority_class: "INSURED_SUBROGATION", declared_rate_bps: 100, expected_institution_version: "${co_ver1}" }
              as: ReceivershipTrustee
              captures: { co_sub_round: $.data.id }
            - call: "POST /dividend-distributions/${co_sub_round}/settle"
              as: ReceivershipTrustee
            - call: "GET /institutions/${co_inst_id}"
              as: ReceivershipTrustee
              captures: { co_ver2: $.data.version }
            - call: "POST /institutions/${co_inst_id}/dividend-distributions"
              payload: { priority_class: "GENERAL_UNSECURED", declared_rate_bps: 1000, expected_institution_version: "${co_ver2}" }
              as: ReceivershipTrustee
              captures: { co_gu_round: $.data.id }
            - call: "POST /dividend-distributions/${co_gu_round}/settle"
              as: ReceivershipTrustee
            - call: "GET /institutions/${co_inst_id}"
              as: ReceivershipTrustee
