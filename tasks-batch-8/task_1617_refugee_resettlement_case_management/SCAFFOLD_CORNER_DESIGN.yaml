scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, computed/system fields, required
  # fields, not-found, immutability, conditional seeding.
  # ===========================================================================
  - section: entities
    instances:
      - name: case_create_defaults
        claim_type: creation_defaults
        grounds:
          - entities.Case.fields.status
          - entities.Case.fields.airport_pickup_completed
          - entities.Case.fields.open_transfer_id
          - calculations.case_posture
        distinguishing_aspect: "A fresh case is PRE_ARRIVAL with airport_pickup_completed false, open_transfer_id and actual_arrival_date null, version 1, and posture ON_TRACK (no benchmarks exist yet)."
        test_recipe:
          setup:
            - "Empty database; default logical clock 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_number: "CASE-EN1", agency_affiliate_code: "AFF-01", household_size: 3, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id, case_status: $.data.status, case_version: $.data.version }
            - call: "GET /cases/${case_id}"
              as: CaseManager
              captures: { case_posture: $.data.posture, case_topics: $.data.topics_completed }
          assert:
            - "create response: status == 'PRE_ARRIVAL', airport_pickup_completed == false, actual_arrival_date == null, open_transfer_id == null, version == 1"
            - "GET /cases/${case_id}: posture == 'ON_TRACK' (zero benchmarks) and topics_completed == []"

      - name: case_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "Reading a never-registered case id yields the error envelope with ERR_NOT_FOUND and http 404."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_NOT_FOUND' with http 404"

      - name: member_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.HouseholdMember.fields.date_of_birth
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /members without the required date_of_birth field is rejected with ERR_VALIDATION (400) before any state or business check."
        test_recipe:
          setup:
            - "Case CASE-EN3 exists (PRE_ARRIVAL)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-EN3", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { case_id: "${case_id}", full_name: "No Dob", relationship: "CHILD", work_eligible: false }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_VALIDATION' with http 400"

      - name: member_create_after_arrival_rejected
        claim_type: state_precondition
        grounds:
          - entities.HouseholdMember.fields.case_id
          - state_machines.Case.PRE_ARRIVAL_to_ARRIVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Household composition is locked at arrival: adding a member to an ARRIVED case fails with ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Case CASE-EN4 (household_size 1), READY 0-bedroom housing, arrived 2026-08-10"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-EN4", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "300 Juniper St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
          trigger:
            - call: "POST /members"
              payload: { case_id: "${case_id}", full_name: "Late Member", date_of_birth: "2000-01-01", relationship: "OTHER_RELATIVE", work_eligible: true }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE' with http 409"

      - name: casenote_immutable_shape
        claim_type: immutability
        grounds:
          - entities.CaseNote
        distinguishing_aspect: "CaseNote is declared common_fields: false (append-only): its response carries id and created_at but no updated_at and no version, and no update/delete endpoint exists in §1.5."
        test_recipe:
          setup:
            - "Case CASE-EN5 exists (PRE_ARRIVAL)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-EN5", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", note_type: "GENERAL", body: "Arrival notification received" }
              as: CaseManager
              captures: { note_id: $.data.id }
          assert:
            - "response data contains id, created_at, case_id, note_type, body, author_role == 'CASE_MANAGER'"
            - "response data does NOT contain updated_at or version keys (common_fields: false)"

      - name: case_create_duplicate_number_rejected
        claim_type: uniqueness
        grounds:
          - entities.Case.fields.case_number
          - errors[ERR_DUPLICATE_CASE_NUMBER]
        distinguishing_aspect: "case_number is globally unique: re-registering the same number fails with ERR_DUPLICATE_CASE_NUMBER (409)."
        test_recipe:
          setup:
            - "Case CASE-EN6 already registered"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-EN6", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
          trigger:
            - call: "POST /cases"
              payload: { case_number: "CASE-EN6", agency_affiliate_code: "AFF-02", household_size: 2, scheduled_arrival_date: "2026-08-11" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_DUPLICATE_CASE_NUMBER' with http 409"

      - name: case_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Case.fields.status
        distinguishing_aspect: "Client-supplied system/computed fields in the create payload are ignored: status stays PRE_ARRIVAL and version stays 1 even when the payload injects status ARRIVED and version 99."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_number: "CASE-EN7", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10", status: "ARRIVED", version: 99 }
              as: CaseManager
              captures: { case_id: $.data.id, case_status: $.data.status, case_version: $.data.version }
          assert:
            - "response status == 'PRE_ARRIVAL' and version == 1 (injected status/version ignored)"

      - name: benchmark_conditional_seeding
        claim_type: computed_fields
        grounds:
          - calculations.benchmark_due_schedule
          - state_machines.Case.PRE_ARRIVAL_to_ARRIVED
          - entities.HouseholdMember.fields.school_age_at_arrival
        distinguishing_aspect: "The seeded benchmark set depends on household composition at arrival: a case whose only member is a school-age child gets 6 benchmarks (with SCHOOL_ENROLLMENT, without EMPLOYMENT_PLAN); a case with no members gets exactly the 5 base benchmarks."
        test_recipe:
          setup:
            - "Case CASE-EN8A (household_size 2) with one CHILD member (dob 2016-05-20, work_eligible false), READY 1-bedroom housing, arrived 2026-08-10"
            - "Case CASE-EN8B (household_size 1) with no members, READY 0-bedroom housing, arrived 2026-08-10"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-EN8A", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_a: $.data.id }
            - call: "POST /members"
              payload: { case_id: "${case_a}", full_name: "Child A", date_of_birth: "2016-05-20", relationship: "CHILD", work_eligible: false }
              as: CaseManager
            - call: "POST /housing-units"
              payload: { address: "310 Redwood St", bedrooms: 1 }
              as: HousingCoordinator
              captures: { unit_a: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_a}", housing_unit_id: "${unit_a}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_a: $.data.id }
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_a}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "POST /cases"
              payload: { case_number: "CASE-EN8B", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_b: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "320 Redwood St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_b: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_b}", housing_unit_id: "${unit_b}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_b: $.data.id }
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_b}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
          trigger:
            - call: "GET /cases/${case_a}/benchmarks"
              as: CaseManager
            - call: "GET /cases/${case_b}/benchmarks"
              as: CaseManager
          assert:
            - "case A: exactly 6 benchmarks; service_type set == {HOME_VISIT, HEALTH_SCREENING, SSN_APPLICATION, BENEFITS_ENROLLMENT, CULTURAL_ORIENTATION, SCHOOL_ENROLLMENT}"
            - "case A: no benchmark with service_type == 'EMPLOYMENT_PLAN' (no work-eligible adult member)"
            - "case B: exactly 5 benchmarks; service_type set == {HOME_VISIT, HEALTH_SCREENING, SSN_APPLICATION, BENEFITS_ENROLLMENT, CULTURAL_ORIENTATION}"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, repeat
  # triggers. (Valid transitions and cascades are covered by §1.8.)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: case_arrive_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Case.PRE_ARRIVAL_to_ARRIVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ARRIVED has no arrive transition: a second POST /cases/{id}/arrive is rejected with ERR_INVALID_STATE and does not re-seed benchmarks."
        test_recipe:
          setup:
            - "Case CASE-SM1 (household_size 1), READY 0-bedroom housing, arrived 2026-08-10"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-SM1", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "330 Sequoia St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
          trigger:
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-11" }
              as: CaseManager
              captures: { err: $.data.error_id }
            - call: "GET /cases/${case_id}"
              as: CaseManager
              captures: { case_status: $.data.status, case_arrival: $.data.actual_arrival_date }
            - call: "GET /cases/${case_id}/benchmarks"
              as: CaseManager
          assert:
            - "second arrive: error_id == 'ERR_INVALID_STATE' with http 409"
            - "Case.${case_id}.actual_arrival_date == '2026-08-10' (first arrival preserved, not overwritten)"
            - "benchmark list still has exactly 5 items (no re-seeding)"

      - name: application_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BenefitApplication
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "APPROVED is terminal: any further transition (DENIED) on an APPROVED BenefitApplication fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Case CASE-SM2 with one work-eligible adult member, READY 0-bedroom housing, arrived 2026-08-10; an SSN application FILED then APPROVED"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-SM2", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /members"
              payload: { case_id: "${case_id}", full_name: "Adult S", date_of_birth: "1990-01-01", relationship: "PRINCIPAL", work_eligible: true }
              as: CaseManager
              captures: { member_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "340 Magnolia St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "POST /benefit-applications"
              payload: { case_id: "${case_id}", member_id: "${member_id}", benefit_type: "SSN" }
              as: CaseManager
              captures: { app_id: $.data.id }
            - call: "POST /benefit-applications/${app_id}/transition"
              payload: { to_status: "FILED" }
              as: CaseManager
            - call: "POST /benefit-applications/${app_id}/transition"
              payload: { to_status: "APPROVED" }
              as: CaseManager
              captures: { app_status: $.data.status }
          trigger:
            - call: "POST /benefit-applications/${app_id}/transition"
              payload: { to_status: "DENIED" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "application reached 'APPROVED' before the trigger"
            - "DENIED attempt on APPROVED: error_id == 'ERR_INVALID_STATE' with http 409"

      - name: application_invalid_skip_draft_to_approved
        claim_type: invalid_transition
        grounds:
          - state_machines.BenefitApplication
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DRAFT has no direct edge to APPROVED: skipping FILED fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Case CASE-SM3 with one work-eligible adult member, READY 0-bedroom housing, arrived 2026-08-10; an SSN application in DRAFT"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-SM3", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /members"
              payload: { case_id: "${case_id}", full_name: "Adult K", date_of_birth: "1990-01-01", relationship: "PRINCIPAL", work_eligible: true }
              as: CaseManager
              captures: { member_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "350 Cypress St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "POST /benefit-applications"
              payload: { case_id: "${case_id}", member_id: "${member_id}", benefit_type: "SSN" }
              as: CaseManager
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /benefit-applications/${app_id}/transition"
              payload: { to_status: "APPROVED" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE' with http 409 (DRAFT -> APPROVED is not a declared edge)"

      - name: transfer_respond_twice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CaseTransfer.INITIATED_to_REJECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REJECTED is terminal: responding a second time to an already-responded transfer fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Case CASE-SM4 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10; transfer INITIATED then responded REJECTED"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-SM4", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "360 Tamarack St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
