          - entities.DesignProject.fields.fundraising_deadline
          - state_machines.FundraisingPledge
        distinguishing_aspect: "With fundraising_deadline 2026-08-10, collecting on 2026-08-10 succeeds and moves funds_collected_cents, while the sibling pledge collected on 2026-08-11 is refused 409 and stays PLEDGED - the deadline is inclusive and is evaluated at collect time, not at pledge time."
        test_recipe:
          setup:
            - "Logical clock set to 2026-08-01T00:00:00Z; project 'Deadline Fund Park' created with fundraising_deadline 2026-08-10 (no standard, model or quote is needed: this rule reads only the project and the pledge)."
            - "Two PLEDGED pledges of 25000 each, both pledged_at 2026-08-01."
          setup_api_calls:
            - call: "POST /playground/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ManufacturerAdmin
