          assert:
            - "Order.${order_id}.status == CLOSED and points_earned == 0"
            - "Customer.${cust_id}.points_balance == 0"

      - name: grade_capped_at_open_box_for_assembled_goods
        claim_type: Correct Result
        grounds:
          - calculations.return_refund
          - entities.ReturnLine.fields.effective_condition_grade
        distinguishing_aspect: "A return line graded LIKE_NEW but declared ASSEMBLED is auto-capped: effective_condition_grade OPEN_BOX, refund 850 (1000 x 0.85) instead of 1000, and no restock — the assembly state silently demotes the grade."
        test_recipe:
