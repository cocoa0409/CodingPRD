              payload: { full_name: "Cora Cog", email: "cora@x.com", membership_tier: "STANDARD", date_of_birth: "1958-08-08" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/members/${m}/record-items"
              payload: { item_kind: "CONDITION", condition_kind: "COGNITIVE", label: "TBI", detail: "memory", severity: "HIGH", provider_document_ref: "doc-tbi" }
              as: Member
              as_user_id: "${m}"
              captures: { it: $.data.id }
            - call: "GET /medical-id/members/${m}/record-items/${it}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${t}/resolve"
              payload: { decision: "APPROVE", decision_note: "ok" }
              as: RecordVerifier
              as_user_id: "rv-1"
          trigger:
            - call: "GET /medical-id/members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { mv: $.data.version }
            - call: "POST /medical-id/members/${m}/record-items/${it}/supersede"
              payload: { replacement_label: "TBI resolved", replacement_detail: "updated", provider_document_ref: "doc-tbi2", expected_member_version: "${mv}" }
              as: Member
              as_user_id: "${m}"
          assert:
            - "after verify, has_cognitive_condition was true"
            - "after supersede, Member.${m}.has_cognitive_condition == false (the only cognitive item left VERIFIED; the replacement is PENDING_VERIFICATION with the GENERAL default condition_kind — the recomputation counts only VERIFIED COGNITIVE items)"

