              captures: { fo_fuel: $.data.fuel_discount_cents_per_gal, fo_season: $.data.season_qualifying_points, fo_coupon: $.data.feed_coupon_cents, fo_elig: $.data.eligible }
          assert:
            - "fo_season == 999 (200 + 400 + round_half_up(199.5 x 2)=399)"
            - "fo_fuel == 5 (floor(999/500) == 1 step; the 499-point remainder is discarded)"
            - "fo_coupon == 0 (tier still NEIGHBOR) and fo_elig == true (fuel discount alone suffices)"

      - name: weighted_finalize_redeem_points_capped_at_zero_floor
        claim_type: Correct Result
        grounds:
          - calculations.weighted_sale_final_price
        distinguishing_aspect: "redeem_points greater than the raw price floors the final at 0 (never negative): redeeming 5000 points against a 3050-cent sale yields final_total_cents 0 and a REDEMPTION entry of -5000."
        test_recipe:
          setup:
            - "WINTER_HEATING store; account with 5000 points (one OTHER accrual of 500000 cents); FEED_BULK sale DRUM gross 100 provisional; clock 2026-09-20T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T10:00:00Z" }
              as: RegionalAdmin
            - call: "POST /stores"
              payload: { store_name: "Winter Store", region_code: "MT-WEST" }
              as: RegionalAdmin
              captures: { rf_store: $.data.id, rf_v0: $.data.version }
            - call: "POST /season-campaigns"
              payload: { store_id: "${rf_store}", season: "WINTER_HEATING", planogram_map: "w1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { rf_camp: $.data.id }
            - call: "POST /season-campaigns/${rf_camp}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${rf_camp}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${rf_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${rf_camp}/activate"
              payload: { expected_store_version: "${rf_v0}" }
              as: RegionalAdmin
            - *k_account_create
            - call: "POST /loyalty-accounts/${c_acct_id}/ledger-entries"
              payload: { entry_type: "ACCRUAL", store_id: "${rf_store}", base_amount_cents: 500000, earn_context: "OTHER" }
              as: StoreAssociate
            - call: "POST /weighted-sales"
              payload: { store_id: "${rf_store}", sale_kind: "FEED_BULK", container_class: "DRUM", gross_weight_lbs: 100, loyalty_account_id: "${c_acct_id}" }
              as: StoreAssociate
              captures: { rf_sale: $.data.id }
          trigger:
            - call: "POST /weighted-sales/${rf_sale}/finalize"
              payload: { measured_tare_lbs: 20, redeem_points: 5000 }
              as: StoreAssociate
              captures: { rf_final: $.data.final_total_cents, rf_redeemed: $.data.points_redeemed }
            - call: "GET /loyalty-accounts/${c_acct_id}"
              payload: {}
              as: StoreAssociate
              captures: { rf_balance: $.data.points_balance, rf_tier: $.data.tier }
          assert:
            - "rf_final == 0 (2700 - 5000 floored at 0) and rf_redeemed == 5000"
            - "rf_balance == 0 (5000 accrued - 5000 redeemed; the ACCRUAL on a 0-cent net posts 0 points)"
            - "rf_tier == RANCH_HAND (redemption does not count against tier: qualifying stays 5000)"

