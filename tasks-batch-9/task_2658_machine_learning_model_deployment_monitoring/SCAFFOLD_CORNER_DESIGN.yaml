              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
              captures: { v1_due: $.data.revalidation_due_at }
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 100.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se1_id: $.data.id, se1_v: $.data.version }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se1_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-12-31T00:00:00Z", expected_serving_endpoint_version: "${se1_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d1_id: $.data.id }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
            - call: "POST /_ops/revalidation-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { created: $.data.created_count }
            - call: "GET /revalidation-tasks"
              payload: { model_version_id: "${v1_id}", status: "DUE" }
              as: ModelApprover
              as_user_id: "u_appr_2"
              captures: { rt_id: "$.data[0].id" }
            - call: "POST /revalidation-tasks/${rt_id}/disposition"
              payload: { action: "START_REVIEW" }
              as: ModelApprover
              as_user_id: "u_appr_2"
              captures: { rt_state: $.data.status, rt_reviewer: $.data.reviewer_user_id }
          trigger:
            - call: "POST /revalidation-tasks/${rt_id}/disposition"
              payload: { action: "FAIL", findings: "calibration drifted outside the approved envelope" }
              as: ModelApprover
              as_user_id: "u_appr_2"
              captures: { fail_state: $.data.status, fail_at: $.data.decided_at }
            - call: "GET /model-versions/${v1_id}"
              payload: {}
              as: ModelApprover
              as_user_id: "u_appr_2"
              captures: { v_state: $.data.approval_state, v_reason: $.data.blocked_reason }
            - call: "GET /deployments/${d1_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d_state: $.data.rollout_state, d_traffic: $.data.traffic_pct }
            - call: "GET /serving-endpoints/${se1_id}"
