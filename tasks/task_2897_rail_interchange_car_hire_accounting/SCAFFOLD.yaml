# =============================================================================
# PRD Benchmark Scaffold — Task 2897
# Rail Interchange & Car Hire Accounting (railroad car accounting department)
# =============================================================================

scenario: "2897. Rail Interchange & Car Hire Accounting (railroad car accounting department): interchange event capture at junctions with timestamps and car ownership identification, car hire rate application by car type with time and mileage components, reclaim rules for cars held due to bad order, embargo or customer detention, empty car routing obligations and reverse-route rules affecting liability, car hire reconciliation between railroads with dispute exchange and settlement cycles, repair billing under industry rules with responsibility determination between handling lines, foreign car balances, per-diem exposure and fleet utilization management, data quality corrections for missed interchange events"

domain_name: rail-interchange-car-hire-accounting
api_prefix: /car-hire

# -----------------------------------------------------------------------------
# Table 0: Complexity Profile (SKILL.md §0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: ledger_reconciliation
  secondary_archetype: event_sourcing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Thirteen peer entities linked purely by foreign keys. No entity is nested in
    another's URL path: every collection hangs directly off /car-hire (e.g.
    /car-hire/hire-movements, /car-hire/reclaim-claims), and parent/child
    navigation happens through filtered list endpoints, never through nesting.
    InterchangeEvent.corrects_event_id makes the event log self-referential.

  state_machine_shape: cyclic
  state_machine_shape_note: |
    Dispute runs a genuine negotiation loop OPEN -> COUNTERED -> OPEN with an
    alternating actor and a hard round cap; RepairBill loops SUBMITTED ->
    SUBMITTED through counter-billing; SettlementCycle loops SETTLED ->
    REOPENED -> COMPUTED. Car carries three independent parallel state
    dimensions (custody / mechanical / routing) on one row.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  role_model_note: |
    Three hard segregation rules: the road that files a ReclaimClaim may never
    decide it (only against_road_id may allow/disallow); the road that files a
    CorrectionRequest may never confirm it (only counterparty_road_id may);
    inside a Dispute the right to act alternates strictly between respondent
    (state OPEN) and filer (state COUNTERED). A settlement statement is
    computed and exchanged by the payee road but settled by the payer road.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# Table 1.0: Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# Global constants shared by §1.3 calculations and §1.4 validations
# -----------------------------------------------------------------------------
global_constants:
  LATE_REPORT_LIMIT_HOURS: 168
  CORRECTION_CONFIRM_WINDOW_HOURS: 72
  MIN_RECLAIM_HOURS: 24
  RECLAIM_FILING_WINDOW_DAYS: 60
  DETENTION_SPLIT_PCT: 0.5
  REVERSE_ROUTE_PENALTY_PCT: 0.25
  REPAIR_LABOR_RATE_CENTS_PER_HOUR: 9500
  REPAIR_HANDLING_FEE_PCT: 0.075
  REPAIR_PREAUTH_THRESHOLD_CENTS: 150000
  FEE_TIER_BREAK_CENTS: 500000
  FEE_TIER1_PCT: 0.005
  FEE_TIER2_PCT: 0.0035
  MAX_DISPUTE_ROUNDS: 3
  MAX_COUNTER_BILL_ROUNDS: 2
  DISPUTE_WINDOW_DAYS: 30
  REOPEN_WINDOW_DAYS: 30
  PROJECTION_HORIZON_HOURS: 72
  DEFAULT_PER_DIEM_CREDIT_LIMIT_CENTS: 100000000
  SERVER_START_CLOCK_UTC: "2026-08-01T00:00:00Z"

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:

  - name: Railroad
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: reporting_mark
        type: string
        source: input
        description: "Industry reporting mark, 2-4 uppercase letters (e.g. BNRR)."
        constraints: "unique across all Railroads; ^[A-Z]{2,4}$"
      - name: name
        type: string
        source: input
        description: "Legal carrier name."
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Operating status; a SUSPENDED road may not appear on either side of a new InterchangeEvent."
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: per_diem_credit_limit_cents
        type: integer
        source: input
        default: 100000000
        description: "Ceiling on this road's snapshot per-diem exposure; a receipt that would reach or pass it is refused."
        constraints: ">= 0"
      - name: foreign_car_balance
        type: integer
        source: computed
        description: "COUNT of CarHireMovement rows with handling_road_id = this.id AND status = OPEN AND owner_road_id != this.id."
      - name: per_diem_exposure_cents
        type: integer
        source: computed
        description: "SNAPSHOT variant of calculations.per_diem_exposure evaluated at the current logical clock."
      - name: owned_car_count
        type: integer
        source: computed
        description: "COUNT of Car rows with owner_road_id = this.id."

  - name: Junction
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: junction_code
        type: string
        source: input
        description: "Interchange point code (e.g. JCT-CHI)."
        constraints: "unique across all Junctions"
      - name: name
        type: string
        source: input
        description: "Human-readable junction name."
      - name: road_a_id
        type: string
        source: input
        description: "FK -> Railroad.id; first of the two carriers physically connected at this junction."
      - name: road_b_id
        type: string
        source: input
        description: "FK -> Railroad.id; second connected carrier; MUST differ from road_a_id."
      - name: status
        type: enum
        source: input
        default: OPEN
        description: "OPEN accepts interchange; CLOSED refuses every InterchangeEvent at this junction."
        constraints: "one of {OPEN, CLOSED}"

  - name: CarType
    parent: null
    common_fields: false
    entity_kind: configuration
    immutability_note: "Rate configuration is immutable: no update endpoint, no version field. A rate change is expressed by registering a new CarType."
    fields:
      - name: car_type_code
        type: string
        source: input
        description: "AAR-style mechanical designation (e.g. XM, GS, FBC)."
        constraints: "unique across all CarTypes"
      - name: description
        type: string
        source: input
        description: "Plain-language car description."
      - name: time_component_mode
        type: enum
        source: input
        description: "Selects which time formula branch applies in calculations.hire_time_component."
        constraints: "one of {PER_DIEM, HOURLY}"
      - name: free_time_hours
        type: integer
        source: input
        default: 0
        description: "Hours of custody excluded from the chargeable base before any rate is applied."
        constraints: ">= 0"
      - name: per_diem_rate_cents
        type: integer
        source: input
        default: 0
        description: "Rate per chargeable day for days 1..tier2_threshold_days (PER_DIEM mode)."
        constraints: ">= 0"
      - name: tier2_threshold_days
        type: integer
        source: input
        default: 5
        description: "Number of chargeable days billed at per_diem_rate_cents before the escalated rate begins."
        constraints: ">= 1"
      - name: tier2_per_diem_rate_cents
        type: integer
        source: input
        default: 0
        description: "Escalated incentive rate for every chargeable day beyond tier2_threshold_days."
        constraints: ">= 0"
      - name: hourly_rate_cents
        type: integer
        source: input
        default: 0
        description: "Rate per chargeable hour (HOURLY mode only)."
        constraints: ">= 0"
      - name: mileage_rate_millicents_per_mile
        type: integer
        source: input
        default: 0
        description: "Mileage rate in millicents (1/1000 cent) per mile; deliberately finer than the cent so per-line rounding is observable."
        constraints: ">= 0"
      - name: loaded_mileage_only
        type: boolean
        source: input
        default: true
        description: "When true, mileage accrues only on movements whose load_status is LOADED."

  - name: Car
    parent: null
    common_fields: true
    entity_kind: resource
    parallel_dimensions_note: |
      Car carries three independent state dimensions on one row:
      custody_status, mechanical_status and routing_status. No transition on
      one dimension constrains the value of another; they are advanced by
      disjoint sets of triggers (see state_machines.Car).
    fields:
      - name: car_mark
        type: string
        source: input
        description: "Reporting mark plus car number (e.g. 'BNRR 100001')."
        constraints: "unique across all Cars"
      - name: car_type_id
        type: string
        source: input
        description: "FK -> CarType.id; pins every rate used for this car."
      - name: owner_road_id
        type: string
        source: input
        description: "FK -> Railroad.id; the car owner, i.e. the road that receives car hire."
      - name: current_handling_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; road holding custody right now, equal to the handling_road_id of the car's single OPEN CarHireMovement."
      - name: custody_status
        type: enum
        source: system
        default: ON_HOME_ROAD
        description: "Dimension 1. ON_HOME_ROAD when current_handling_road_id = owner_road_id, else ON_FOREIGN_ROAD."
        constraints: "one of {ON_HOME_ROAD, ON_FOREIGN_ROAD}"
      - name: mechanical_status
        type: enum
        source: system
        default: SERVICEABLE
        description: "Dimension 2. Advanced by bad-order reports, interchange rejections, repair-bill submission and repair settlement."
        constraints: "one of {SERVICEABLE, BAD_ORDER, UNDER_REPAIR}"
      - name: routing_status
        type: enum
        source: system
        default: NO_OBLIGATION
        description: "Dimension 3. Tracks the empty-car return obligation and its reverse-route outcome."
        constraints: "one of {NO_OBLIGATION, OBLIGATION_ACTIVE, OBLIGATION_MET, OBLIGATION_VIOLATED}"
      - name: prescribed_return_junction_id
        type: string
        source: system
        description: "FK -> Junction.id; nullable; junction at which the empty car must be returned to the owner while routing_status = OBLIGATION_ACTIVE."
      - name: obligation_issued_at
        type: datetime
        source: system
        description: "Nullable; instant the current empty-routing obligation was issued."
      - name: obligation_due_at
        type: datetime
        source: system
        description: "Nullable; instant after which an unmet obligation is treated as violated at the next delivery evaluation."
      - name: bad_order_since
        type: datetime
        source: system
        description: "Nullable; instant the current bad-order condition was reported or discovered at interchange."
      - name: bad_order_cleared_at
        type: datetime
        source: system
        description: "Nullable; instant the most recent bad-order condition was cleared."
      - name: cumulative_mileage
        type: integer
        source: computed
        description: "SUM of (end_odometer_miles - start_odometer_miles) over CarHireMovement rows for this car with status = CLOSED and end_odometer_miles IS NOT NULL."

  - name: InterchangeEvent
    parent: null
    common_fields: false
    entity_kind: event
    append_only_note: |
      Append-only log. Only `status` is ever rewritten, and only by an applied
      CorrectionRequest (RECORDED -> SUPERSEDED for TIMESTAMP_AMEND, RECORDED ->
      VOID for ERRONEOUS_EVENT_VOID). There is no update endpoint and no
      version field.
    fields:
      - name: car_id
        type: string
        source: input
        description: "FK -> Car.id; the car changing hands."
      - name: junction_id
        type: string
        source: input
        description: "FK -> Junction.id; the interchange point."
      - name: event_type
        type: enum
        source: input
        description: "INTERCHANGE_DELIVERY transfers custody; INTERCHANGE_REJECTION does not."
        constraints: "one of {INTERCHANGE_DELIVERY, INTERCHANGE_REJECTION}"
      - name: delivering_road_id
        type: string
        source: input
        description: "FK -> Railroad.id; road offering the car; MUST equal Car.current_handling_road_id."
      - name: receiving_road_id
        type: string
        source: input
        description: "FK -> Railroad.id; road taking the car on an INTERCHANGE_DELIVERY, refusing it on an INTERCHANGE_REJECTION."
      - name: interchange_at
        type: datetime
        source: input
        description: "Instant of the handoff; the boundary timestamp of both the closing and the opening CarHireMovement."
      - name: odometer_miles
        type: integer
        source: input
        description: "Car odometer reading at the handoff; drives the mileage component of the closing movement."
        constraints: ">= 0; monotonically non-decreasing across a car's RECORDED events"
      - name: load_status
        type: enum
        source: input
        description: "Load state of the car at the handoff."
        constraints: "one of {LOADED, EMPTY}"
      - name: corrects_event_id
        type: string
        source: system
        description: "FK -> InterchangeEvent.id; nullable; self-reference set when this event was minted by an applied TIMESTAMP_AMEND correction to supersede the referenced event."
      - name: recorded_by_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; acting railroad of the InterchangeClerk who captured the event, or filed_by_road_id when source = CORRECTION_APPLY."
      - name: status
        type: enum
        source: system
        default: RECORDED
        description: "RECORDED events drive custody; SUPERSEDED and VOID events are retained for audit and ignored by every calculation."
        constraints: "one of {RECORDED, SUPERSEDED, VOID}"
      - name: source
        type: enum
        source: system
        default: CLERK_CAPTURE
        description: "CLERK_CAPTURE for POST /car-hire/interchange-events; CORRECTION_APPLY for events minted by an applied CorrectionRequest."
        constraints: "one of {CLERK_CAPTURE, CORRECTION_APPLY}"

  - name: CarHireMovement
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: car_id
        type: string
        source: system
        description: "FK -> Car.id; the car under custody during this segment."
      - name: handling_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; road holding the car for this segment, i.e. the road that owes car hire."
      - name: owner_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; car owner at segment open, i.e. the road that receives car hire. Denormalised so settlement membership never has to join through Car."
      - name: received_event_id
        type: string
        source: system
        description: "FK -> InterchangeEvent.id; nullable; event that opened this segment. NULL only for the bootstrap segment minted by POST /car-hire/cars."
      - name: delivered_event_id
        type: string
        source: system
        description: "FK -> InterchangeEvent.id; nullable while status = OPEN; event that closed this segment."
      - name: settlement_cycle_id
        type: string
        source: system
        description: "FK -> SettlementCycle.id; nullable; stamped when a cycle compute or settle first admits this movement as a line."
      - name: start_at
        type: datetime
        source: system
        description: "Segment start; equals received_event.interchange_at, or the logical clock at car registration for the bootstrap segment."
      - name: end_at
        type: datetime
        source: system
        description: "Nullable while OPEN; equals delivered_event.interchange_at."
      - name: load_status
        type: enum
        source: system
        default: EMPTY
        description: "Load state at segment open, copied from received_event.load_status (EMPTY for the bootstrap segment)."
        constraints: "one of {LOADED, EMPTY}"
      - name: start_odometer_miles
        type: integer
        source: system
        description: "Odometer at segment open; 0 for the bootstrap segment."
      - name: end_odometer_miles
        type: integer
        source: system
        description: "Nullable while OPEN; odometer at segment close."
      - name: hire_liable
        type: boolean
        source: system
        description: "TRUE when handling_road_id != owner_road_id. A FALSE segment accrues no time component, no mileage component and no penalty."
      - name: chargeable_hours
        type: number
        source: computed
        description: "Output of calculations.hire_time_component; hours remaining after free time, 3 decimal places."
      - name: chargeable_days
        type: integer
        source: computed
        description: "Output of calculations.hire_time_component; ceil(chargeable_hours / 24); 0 in HOURLY mode."
      - name: time_component_cents
        type: integer
        source: computed
        description: "Output of calculations.hire_time_component."
      - name: mileage_component_cents
        type: integer
        source: computed
        description: "Output of calculations.hire_mileage_component."
      - name: gross_hire_cents
        type: integer
        source: computed
        description: "time_component_cents + mileage_component_cents."
      - name: reclaim_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.reclaim_credit_allocation; total credit granted by ALLOWED ReclaimClaims on this movement."
      - name: reverse_route_penalty_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.reverse_route_penalty; non-zero only after this movement's handling road violated an empty-car routing obligation."
      - name: net_hire_cents
        type: integer
        source: computed
        description: "gross_hire_cents - reclaim_credit_cents + reverse_route_penalty_cents."
      - name: adjusted_net_hire_cents
        type: integer
        source: computed
        description: "Equals net_hire_cents until a Dispute citing this movement reaches ACCEPTED, after which it equals that dispute's resolution_amount_cents."
      - name: bad_order_from
        type: datetime
        source: system
        description: "Nullable; instant a bad-order condition was stamped onto this segment, either by POST /car-hire/cars/{car_id}/bad-order-report or by an INTERCHANGE_REJECTION."
      - name: bad_order_to
        type: datetime
        source: system
        description: "Nullable; instant the stamped bad-order condition ended (release to service, repair settlement, or segment close)."
      - name: reclaim_locked
        type: boolean
        source: system
        default: false
        description: "TRUE once this segment's handling road violated an empty-car routing obligation; no ReclaimClaim may be filed against a locked segment."
      - name: recompute_count
        type: integer
        source: system
        default: 0
        description: "Number of times an applied CorrectionRequest has rewritten this segment's boundaries or amounts."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN while the handling road still holds the car; CLOSED once a delivery event ends it; VOID when an applied correction removes the segment entirely."
        constraints: "one of {OPEN, CLOSED, VOID}"

  - name: ReclaimClaim
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: movement_id
        type: string
        source: input
        description: "FK -> CarHireMovement.id; the CLOSED segment whose time component is being reclaimed."
      - name: filed_by_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; equals movement.handling_road_id and the acting CarHireAccountant's railroad."
      - name: against_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; equals movement.owner_road_id; the only road permitted to allow or disallow the claim."
      - name: supporting_embargo_id
        type: string
        source: input
        description: "FK -> EmbargoOrder.id; nullable; required when reason = EMBARGO."
      - name: reason
        type: enum
        source: input
        description: "Ground for withholding car hire for the claimed window."
        constraints: "one of {BAD_ORDER, EMBARGO, CUSTOMER_DETENTION}"
      - name: window_from
        type: datetime
        source: input
        description: "Inclusive start of the reclaimed window."
      - name: window_to
        type: datetime
        source: input
        description: "Exclusive end of the reclaimed window; the pair is a half-open interval [window_from, window_to)."
      - name: detention_notified_at
        type: datetime
        source: input
        description: "Nullable; required when reason = CUSTOMER_DETENTION; instant the consignee was notified, MUST fall inside [window_from, window_to)."
      - name: claimed_hours
        type: number
        source: computed
        description: "(window_to - window_from) expressed in hours, 3 decimal places."
      - name: allowed_hours
        type: number
        source: computed
        description: "Nullable until decided; equals claimed_hours unless the allow call supplies a smaller allowed_hours override."
      - name: split_pct_applied
        type: number
        source: computed
        description: "1.0 for BAD_ORDER and EMBARGO; DETENTION_SPLIT_PCT (0.5) for CUSTOMER_DETENTION."
      - name: credit_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.reclaim_credit_amount; 0 until the claim reaches ALLOWED."
      - name: status
        type: enum
        source: system
        default: FILED
        description: "FILED on creation; ALLOWED or DISALLOWED by the owner road; WITHDRAWN by the filer."
        constraints: "one of {FILED, ALLOWED, DISALLOWED, WITHDRAWN}"
      - name: disallow_reason
        type: string
        source: system
        description: "Nullable; free text on manual disallowance, or the literal 'SUPPORTING_EVENT_VOIDED' when a correction cascade disallows the claim."
      - name: withdraw_reason
        type: string
        source: input
        description: "Nullable; supplied by the filer on withdrawal."
      - name: decided_at
        type: datetime
        source: system
        description: "Nullable; logical clock at the allow, disallow or withdraw call."

  - name: EmbargoOrder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: issuing_road_id
        type: string
        source: input
        description: "FK -> Railroad.id; road that declares the embargo; MUST be road_a_id or road_b_id of junction_id."
      - name: junction_id
        type: string
        source: input
        description: "FK -> Junction.id; junction the embargo closes to the scoped car types."
      - name: car_type_id
        type: string
        source: input
        description: "FK -> CarType.id; nullable; NULL embargoes every car type at the junction."
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the embargo."
      - name: effective_to
        type: datetime
        source: input
        description: "Inclusive end of the embargo; the pair is a CLOSED interval [effective_from, effective_to]."
      - name: reason
        type: string
        source: input
        description: "Operating reason cited for the embargo."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE on creation; LIFTED once the issuing road lifts it. A LIFTED order still supports reclaims for windows before lifted_at."
        constraints: "one of {ACTIVE, LIFTED}"
      - name: lifted_at
        type: datetime
        source: input
        description: "Nullable; instant supplied on lift; afterwards the order supports no window at or after this instant."

  - name: RepairBill
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: car_id
        type: string
        source: input
        description: "FK -> Car.id; the repaired car."
      - name: discovery_event_id
        type: string
        source: input
        description: "FK -> InterchangeEvent.id; the RECORDED interchange event at which the defect was discovered; MUST reference the same car_id."
      - name: billing_road_id
        type: string
        source: input
        description: "FK -> Railroad.id; road that performed the repair and issues the bill; equals the acting RepairBillingAgent's railroad."
      - name: responsible_road_id
        type: string
        source: computed
        description: "FK -> Railroad.id; output of calculations.repair_responsibility_determination; the road that owes the bill."
      - name: settlement_cycle_id
        type: string
        source: system
        description: "FK -> SettlementCycle.id; nullable; stamped when a cycle compute or settle first admits this bill as a line."
      - name: defect_code
        type: string
        source: input
        description: "Industry defect code (e.g. 'DEF-1204')."
      - name: defect_class
        type: enum
        source: input
        description: "Selects the responsibility rule per calculations.repair_responsibility_determination: NORMAL_WEAR and OWNER_APPLIANCE_DEFECT use OWNER_RESPONSIBILITY_RULE; HANDLING_DAMAGE uses HANDLING_LINE_RULE."
        constraints: "one of {HANDLING_DAMAGE, NORMAL_WEAR, OWNER_APPLIANCE_DEFECT}"
      - name: defect_occurred_at
        type: datetime
        source: input
        description: "Instant the defect is deemed to have arisen; also the month key for settlement-cycle membership of this bill."
      - name: labor_hours
        type: number
        source: input
        description: "Labor hours claimed, 2 decimal places."
        constraints: ">= 0"
      - name: material_cents
        type: integer
        source: input
        description: "Material cost in cents."
        constraints: ">= 0; labor_hours and material_cents MUST NOT both be zero"
      - name: pre_authorization_reference
        type: string
        source: input
        description: "Nullable; mandatory once total_cents exceeds REPAIR_PREAUTH_THRESHOLD_CENTS."
      - name: labor_cents
        type: integer
        source: computed
        description: "round_half_up(labor_hours * REPAIR_LABOR_RATE_CENTS_PER_HOUR)."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "labor_cents + material_cents."
      - name: handling_fee_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * REPAIR_HANDLING_FEE_PCT) when responsible_road_id != billing_road_id, else 0."
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + handling_fee_cents."
      - name: responsibility_rule_applied
        type: enum
        source: computed
        description: "Which variant of calculations.repair_responsibility_determination produced responsible_road_id."
        constraints: "one of {HANDLING_LINE_RULE, OWNER_RESPONSIBILITY_RULE}"
      - name: counter_bill_round
        type: integer
        source: system
        default: 0
        description: "Number of counter-billings applied; capped by MAX_COUNTER_BILL_ROUNDS."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT on creation; SUBMITTED once issued to the responsible road; ACCEPTED or REJECTED by that road; SETTLED by the clearinghouse."
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED, SETTLED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Nullable; logical clock at the most recent submit or counter-bill."
      - name: accepted_at
        type: datetime
        source: system
        description: "Nullable; logical clock at acceptance."
      - name: settled_at
        type: datetime
        source: system
        description: "Nullable; logical clock at settlement."
      - name: rejected_at
        type: datetime
        source: system
        description: "Nullable; logical clock at rejection by the responsible road."
      - name: last_counter_at
        type: datetime
        source: system
        description: "Nullable; logical clock at the most recent counter-billing."

  - name: SettlementCycle
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: payer_road_id
        type: string
        source: input
        description: "FK -> Railroad.id; the handling road being billed; MUST differ from payee_road_id."
      - name: payee_road_id
        type: string
        source: input
        description: "FK -> Railroad.id; the car-owning road being paid; also the only road permitted to compute and exchange the statement."
      - name: period_month
        type: string
        source: input
        description: "Accounting month in YYYY-MM. period_start = first instant of the month (UTC); period_end = first instant of the following month (UTC), exclusive."
        constraints: "^[0-9]{4}-(0[1-9]|1[0-2])$; (payer_road_id, payee_road_id, period_month) is unique"
      - name: period_start_at
        type: datetime
        source: computed
        description: "First instant of period_month in UTC, inclusive. Derived from period_month at creation; referred to as period_start in Table 1.3."
      - name: period_end_at
        type: datetime
        source: computed
        description: "First instant of the month after period_month in UTC, exclusive. Compute is refused with ERR_PERIOD_NOT_ENDED (422) while the logical clock is before it. Referred to as period_end in Table 1.3."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Cycle lifecycle; see state_machines.SettlementCycle."
        constraints: "one of {OPEN, COMPUTED, EXCHANGED, SETTLED, REOPENED, ARCHIVED}"
      - name: variant_applied
        type: enum
        source: computed
        description: "Nullable; which variant of calculations.settlement_statement produced the current money fields."
        constraints: "one of {AS_REPORTED, RECONCILED}"
      - name: gross_hire_cents
        type: integer
        source: computed
        default: 0
        description: "SUM of gross_hire_cents over the member CarHireMovement lines of the applied variant."
      - name: reclaim_credit_cents
        type: integer
        source: computed
        default: 0
        description: "SUM of reclaim_credit_cents over the member CarHireMovement lines."
      - name: penalty_cents
        type: integer
        source: computed
        default: 0
        description: "SUM of reverse_route_penalty_cents over the member CarHireMovement lines."
      - name: repair_charge_cents
        type: integer
        source: computed
        default: 0
        description: "SUM of total_cents over the member RepairBill lines."
      - name: dispute_adjustment_cents
        type: integer
        source: computed
        default: 0
        description: "SUM of (adjusted_net_hire_cents - net_hire_cents) over member movements, i.e. the signed effect of every ACCEPTED Dispute on this cycle."
      - name: pre_fee_net_cents
        type: integer
        source: computed
        default: 0
        description: "gross_hire_cents - reclaim_credit_cents + penalty_cents + repair_charge_cents + dispute_adjustment_cents. Evaluated BEFORE the clearinghouse fee."
      - name: clearinghouse_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.clearinghouse_fee; its tier is keyed on pre_fee_net_cents, never on net_settlement_cents."
      - name: net_settlement_cents
        type: integer
        source: computed
        default: 0
        description: "pre_fee_net_cents - clearinghouse_fee_cents; the amount the payer road remits to the payee road."
      - name: as_reported_net_cents
        type: integer
        source: computed
        description: "Nullable; net_settlement_cents produced by the most recent AS_REPORTED evaluation; retained after a RECONCILED evaluation overwrites the live fields."
      - name: reconciled_net_cents
        type: integer
        source: computed
        description: "Nullable; net_settlement_cents produced by the most recent RECONCILED evaluation."
      - name: movement_line_count
        type: integer
        source: computed
        default: 0
        description: "COUNT of member CarHireMovement lines of the applied variant."
      - name: computed_at
        type: datetime
        source: system
        description: "Nullable; logical clock at the most recent compute."
      - name: exchanged_at
        type: datetime
        source: system
        description: "Nullable; logical clock at exchange; starts the DISPUTE_WINDOW_DAYS clock."
      - name: dispute_deadline_at
        type: datetime
        source: computed
        description: "Nullable; exchanged_at + DISPUTE_WINDOW_DAYS days. A dispute filed after this instant is refused with ERR_DISPUTE_WINDOW_EXPIRED."
      - name: settled_at
        type: datetime
        source: system
        description: "Nullable; logical clock at settle; starts the REOPEN_WINDOW_DAYS clock."
      - name: reopen_deadline_at
        type: datetime
        source: computed
        description: "Nullable; settled_at + REOPEN_WINDOW_DAYS days. Reopen is refused after it with ERR_REOPEN_WINDOW_EXPIRED; archive is refused before it with ERR_REOPEN_WINDOW_STILL_OPEN."
      - name: reopened_at
        type: datetime
        source: system
        description: "Nullable; logical clock at the most recent reopen."
      - name: archived_at
        type: datetime
        source: system
        description: "Nullable; logical clock at archive."
      - name: reopen_count
        type: integer
        source: system
        default: 0
        description: "Number of times this cycle has been reopened after settlement."
      - name: reopen_reason
        type: string
        source: input
        description: "Nullable; reason supplied on the most recent reopen."

  - name: Dispute
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: settlement_cycle_id
        type: string
        source: input
        description: "FK -> SettlementCycle.id; the EXCHANGED cycle whose line is contested."
      - name: movement_id
        type: string
        source: input
        description: "FK -> CarHireMovement.id; nullable; exactly one of movement_id and repair_bill_id MUST be supplied."
      - name: repair_bill_id
        type: string
        source: input
        description: "FK -> RepairBill.id; nullable; exactly one of movement_id and repair_bill_id MUST be supplied."
      - name: filed_by_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; acting CarHireAccountant's railroad; MUST be payer_road_id or payee_road_id of the cycle."
      - name: respondent_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; the other party of the cycle; the only road permitted to act while status = OPEN."
      - name: dispute_reason
        type: enum
        source: input
        description: "Category of the objection."
        constraints: "one of {HIRE_RATE_MISAPPLIED, MILEAGE_DISCREPANCY, RECLAIM_DENIED_IMPROPERLY, REPAIR_RESPONSIBILITY, DUPLICATE_CHARGE}"
      - name: subject_net_at_filing_cents
        type: integer
        source: system
        description: "Snapshot of the subject's net amount when the dispute was filed: movement.net_hire_cents or repair_bill.total_cents."
      - name: disputed_amount_cents
        type: integer
        source: input
        description: "Amount the filer asserts the line should be."
        constraints: ">= 0 and <= subject_net_at_filing_cents"
      - name: counter_amount_cents
        type: integer
        source: input
        description: "Nullable; amount proposed by the most recent counter."
      - name: resolution_amount_cents
        type: integer
        source: computed
        description: "Nullable until ACCEPTED; disputed_amount_cents when accepted from OPEN, counter_amount_cents when accepted from COUNTERED."
      - name: round_number
        type: integer
        source: system
        default: 0
        description: "Counters applied so far; a counter that would push it above MAX_DISPUTE_ROUNDS is refused."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Negotiation state; see state_machines.Dispute."
        constraints: "one of {OPEN, COUNTERED, ACCEPTED, WITHDRAWN}"
      - name: counter_note
        type: string
        source: input
        description: "Nullable; free text supplied with a counter."
      - name: withdraw_reason
        type: string
        source: input
        description: "Nullable; free text supplied by the filer on withdrawal."
      - name: last_action_at
        type: datetime
        source: system
        description: "Nullable; logical clock at the most recent counter."
      - name: resolved_at
        type: datetime
        source: system
        description: "Nullable; logical clock at acceptance or withdrawal."

  - name: CorrectionRequest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: car_id
        type: string
        source: input
        description: "FK -> Car.id; the car whose event history is being corrected."
      - name: junction_id
        type: string
        source: input
        description: "FK -> Junction.id; nullable; required for MISSED_EVENT_INSERT, ignored otherwise."
      - name: filed_by_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; acting InterchangeClerk's railroad; the only road (besides ClearinghouseAdmin) permitted to apply the request."
      - name: counterparty_road_id
        type: string
        source: input
        description: "FK -> Railroad.id; the other road to the corrected handoff; the only road permitted to confirm or reject."
      - name: target_event_id
        type: string
        source: input
        description: "FK -> InterchangeEvent.id; nullable; required for TIMESTAMP_AMEND and ERRONEOUS_EVENT_VOID, forbidden for MISSED_EVENT_INSERT."
      - name: resulting_event_id
        type: string
        source: system
        description: "FK -> InterchangeEvent.id; nullable; the event minted when a MISSED_EVENT_INSERT or TIMESTAMP_AMEND is applied."
      - name: correction_type
        type: enum
        source: input
        description: "Which data-quality repair is requested."
        constraints: "one of {MISSED_EVENT_INSERT, TIMESTAMP_AMEND, ERRONEOUS_EVENT_VOID}"
      - name: direction
        type: enum
        source: input
        description: "Nullable; required for MISSED_EVENT_INSERT; FILER_DELIVERS means delivering_road_id = filed_by_road_id and receiving_road_id = counterparty_road_id, FILER_RECEIVES is the mirror."
        constraints: "one of {FILER_DELIVERS, FILER_RECEIVES}"
      - name: proposed_interchange_at
        type: datetime
        source: input
        description: "Nullable; required for MISSED_EVENT_INSERT and TIMESTAMP_AMEND; the corrected handoff instant."
      - name: proposed_odometer_miles
        type: integer
        source: input
        description: "Nullable; required for MISSED_EVENT_INSERT; odometer of the reconstructed event."
      - name: proposed_load_status
        type: enum
        source: input
        description: "Nullable; required for MISSED_EVENT_INSERT."
        constraints: "one of {LOADED, EMPTY}"
      - name: filing_note
        type: string
        source: input
        description: "Nullable; clerk's explanation."
      - name: confirm_deadline_at
        type: datetime
        source: system
        description: "created_at + CORRECTION_CONFIRM_WINDOW_HOURS (72h). A confirm at exactly this instant is still accepted."
      - name: confirmed_at
        type: datetime
        source: system
        description: "Nullable; logical clock at confirmation."
      - name: applied_at
        type: datetime
        source: system
        description: "Nullable; logical clock at application."
      - name: rejected_at
        type: datetime
        source: system
        description: "Nullable; logical clock at rejection."
      - name: expired_at
        type: datetime
        source: system
        description: "Nullable; logical clock at the expire-due sweep that expired the request."
      - name: rejection_reason
        type: string
        source: input
        description: "Nullable; supplied by the counterparty on rejection."
      - name: status
        type: enum
        source: system
        default: FILED
        description: "FILED -> CONFIRMED -> APPLIED, or FILED -> REJECTED, or FILED -> EXPIRED via the sweep."
        constraints: "one of {FILED, CONFIRMED, APPLIED, REJECTED, EXPIRED}"

  - name: HireLedgerEntry
    parent: null
    common_fields: false
    entity_kind: event
    append_only_note: |
      Immutable double-entry line. Never updated, never deleted; every reversal
      is a new entry with the opposite sign. There is no create endpoint: rows
      are minted only by settlement, reclaim, dispute and correction cascades.
    fields:
      - name: settlement_cycle_id
        type: string
        source: system
        description: "FK -> SettlementCycle.id; the cycle whose running total this entry belongs to."
      - name: movement_id
        type: string
        source: system
        description: "FK -> CarHireMovement.id; nullable; set on HIRE_CHARGE and CORRECTION_ADJUSTMENT entries."
      - name: repair_bill_id
        type: string
        source: system
        description: "FK -> RepairBill.id; nullable; set on REPAIR_CHARGE entries."
      - name: reclaim_claim_id
        type: string
        source: system
        description: "FK -> ReclaimClaim.id; nullable; set on RECLAIM_CREDIT and RECLAIM_REVERSAL entries."
      - name: dispute_id
        type: string
        source: system
        description: "FK -> Dispute.id; nullable; set on DISPUTE_ADJUSTMENT entries."
      - name: entry_type
        type: enum
        source: system
        description: "Which cascade minted the entry."
        constraints: "one of {HIRE_CHARGE, REPAIR_CHARGE, RECLAIM_CREDIT, RECLAIM_REVERSAL, CORRECTION_ADJUSTMENT, DISPUTE_ADJUSTMENT, RECOMPUTE_REVERSAL, SETTLEMENT_PAYMENT}"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed cents from the payer road's perspective: positive increases what the payer owes the payee, negative decreases it."
      - name: debit_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; the road whose balance the entry charges (the cycle's payer_road_id)."
      - name: credit_road_id
        type: string
        source: system
        description: "FK -> Railroad.id; the road whose balance the entry credits (the cycle's payee_road_id)."
      - name: effective_at
        type: datetime
        source: system
        description: "Logical clock at the mutation that minted the entry."
      - name: memo
        type: string
        source: system
        description: "Machine-generated audit note naming the triggering endpoint."

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Car — PARALLEL DIMENSIONS: three independent axes on one row.
  # ---------------------------------------------------------------------------
  - entity: Car
    shape: parallel
    initial_state: "custody_status=ON_HOME_ROAD; mechanical_status=SERVICEABLE; routing_status=NO_OBLIGATION"
    initial_state_note: |
      A car registered with initial_handling_road_id != owner_road_id starts at
      custody_status=ON_FOREIGN_ROAD instead; the other two dimensions always
      start at SERVICEABLE and NO_OBLIGATION regardless.
    terminal_states: []
    dimensions:
      custody: [ON_HOME_ROAD, ON_FOREIGN_ROAD]
      mechanical: [SERVICEABLE, BAD_ORDER, UNDER_REPAIR]
      routing: [NO_OBLIGATION, OBLIGATION_ACTIVE, OBLIGATION_MET, OBLIGATION_VIOLATED]
    independence_note: |
      No transition below reads or writes a dimension other than its own,
      except that the routing evaluation on an INTERCHANGE_DELIVERY reads the
      event's junction_id and load_status (not another Car dimension). A car
      can therefore be ON_FOREIGN_ROAD + UNDER_REPAIR + OBLIGATION_VIOLATED
      simultaneously, and clearing the mechanical dimension leaves the custody
      and routing dimensions untouched.
    transitions:

      - from: ON_HOME_ROAD
        to: ON_FOREIGN_ROAD
        dimension: custody
        trigger: "POST /car-hire/interchange-events with event_type = INTERCHANGE_DELIVERY where receiving_road_id != Car.owner_road_id"
        actor: InterchangeClerk
        preconditions:
          - "Car.mechanical_status != BAD_ORDER"
          - "delivering_road_id == Car.current_handling_road_id"
        side_effects:
          - "Car.current_handling_road_id := receiving_road_id"
          - "the car's OPEN CarHireMovement transitions OPEN -> CLOSED"
          - "a new CarHireMovement is minted with handling_road_id = receiving_road_id, hire_liable = true"
        note: "custody_status is always derived as (current_handling_road_id == owner_road_id ? ON_HOME_ROAD : ON_FOREIGN_ROAD)."

      - from: ON_FOREIGN_ROAD
        to: ON_HOME_ROAD
        dimension: custody
        trigger: "POST /car-hire/interchange-events with event_type = INTERCHANGE_DELIVERY where receiving_road_id == Car.owner_road_id"
        actor: InterchangeClerk
        preconditions:
          - "Car.mechanical_status != BAD_ORDER"
          - "delivering_road_id == Car.current_handling_road_id"
        side_effects:
          - "Car.current_handling_road_id := owner_road_id"
          - "the car's OPEN CarHireMovement transitions OPEN -> CLOSED"
          - "a new CarHireMovement is minted with handling_road_id = owner_road_id, hire_liable = false"

      - from: ON_FOREIGN_ROAD
        to: ON_FOREIGN_ROAD
        dimension: custody
        trigger: "POST /car-hire/interchange-events with event_type = INTERCHANGE_DELIVERY between two foreign roads"
        actor: InterchangeClerk
        preconditions:
          - "Car.mechanical_status != BAD_ORDER"
          - "receiving_road_id != Car.owner_road_id"
        side_effects:
          - "Car.current_handling_road_id := receiving_road_id"
          - "the car's OPEN CarHireMovement transitions OPEN -> CLOSED; a new hire_liable movement opens for the receiving road"

      - from: SERVICEABLE
        to: BAD_ORDER
        dimension: mechanical
        trigger: "POST /car-hire/cars/{car_id}/bad-order-report"
        actor: InterchangeClerk
        preconditions:
          - "Car.mechanical_status == SERVICEABLE"
          - "acting railroad == Car.current_handling_road_id"
          - "reported_at <= logical clock now AND reported_at >= the car's OPEN CarHireMovement.start_at"
        side_effects:
          - "Car.bad_order_since := reported_at"
          - "CASCADE L1->L2: because the mechanical dimension changed, the car's OPEN CarHireMovement is stamped bad_order_from := reported_at, bad_order_to := null, and CarHireMovement.version is incremented"
          - "CASCADE L2->L3: because that movement now carries an open bad-order stamp, any FILED ReclaimClaim on the same movement with reason = BAD_ORDER is re-validated against the widened window"

      - from: SERVICEABLE
        to: BAD_ORDER
        dimension: mechanical
        trigger: "POST /car-hire/interchange-events with event_type = INTERCHANGE_REJECTION"
        actor: InterchangeClerk
        preconditions:
          - "delivering_road_id == Car.current_handling_road_id"
          - "receiving_road_id is the other connected road of junction_id"
        side_effects:
          - "Car.bad_order_since := interchange_at"
          - "custody does NOT change: no movement is closed and none is opened"
          - "CASCADE L1->L2: the delivering road's OPEN CarHireMovement is stamped bad_order_from := interchange_at when its bad_order_from is currently NULL, bad_order_to := null"
        note: "Distinct trigger from the bad-order-report path; this is the receiving road refusing the car at the junction."

      - from: BAD_ORDER
        to: SERVICEABLE
        dimension: mechanical
        trigger: "POST /car-hire/cars/{car_id}/release-to-service"
        actor: InterchangeClerk
        preconditions:
          - "Car.mechanical_status in {BAD_ORDER, UNDER_REPAIR}"
          - "acting railroad == Car.current_handling_road_id"
          - "released_at <= logical clock now AND released_at > Car.bad_order_since"
        side_effects:
          - "Car.bad_order_since := null; Car.bad_order_cleared_at := released_at"
          - "CASCADE L1->L2: the car's CarHireMovement whose bad_order_from IS NOT NULL AND bad_order_to IS NULL is stamped bad_order_to := released_at"

      - from: BAD_ORDER
        to: UNDER_REPAIR
        dimension: mechanical
        trigger: "POST /car-hire/repair-bills/{bill_id}/submit"
        actor: RepairBillingAgent
        preconditions:
          - "Car.mechanical_status == BAD_ORDER"
          - "RepairBill.status == DRAFT"
        side_effects:
          - "RepairBill.status := SUBMITTED; RepairBill.submitted_at := logical clock now"

      - from: UNDER_REPAIR
        to: SERVICEABLE
        dimension: mechanical
        trigger: "POST /car-hire/repair-bills/{bill_id}/settle"
        actor: ClearinghouseAdmin
        preconditions:
          - "RepairBill.status == ACCEPTED"
          - "Car.mechanical_status == UNDER_REPAIR"
        side_effects:
          - "Car.bad_order_since := null; Car.bad_order_cleared_at := logical clock now"
          - "CASCADE L1->L2: the car's CarHireMovement with an open bad-order stamp is stamped bad_order_to := logical clock now"

      - from: UNDER_REPAIR
        to: SERVICEABLE
        dimension: mechanical
        trigger: "POST /car-hire/cars/{car_id}/release-to-service"
        actor: InterchangeClerk
        preconditions:
          - "Car.mechanical_status == UNDER_REPAIR"
          - "acting railroad == Car.current_handling_road_id"
        side_effects:
          - "same as the BAD_ORDER -> SERVICEABLE release path"

      - from: NO_OBLIGATION
        to: OBLIGATION_ACTIVE
        dimension: routing
        trigger: "POST /car-hire/cars/{car_id}/empty-routing-obligation"
        actor: FleetOwner
        preconditions:
          - "Car.routing_status in {NO_OBLIGATION, OBLIGATION_MET}"
          - "acting railroad == Car.owner_road_id"
          - "prescribed_return_junction_id references a Junction with status = OPEN having Car.owner_road_id as road_a_id or road_b_id"
          - "issued_at <= logical clock now < due_at"
        side_effects:
          - "Car.prescribed_return_junction_id := prescribed_return_junction_id; Car.obligation_issued_at := issued_at; Car.obligation_due_at := due_at"

      - from: OBLIGATION_MET
        to: OBLIGATION_ACTIVE
        dimension: routing
        trigger: "POST /car-hire/cars/{car_id}/empty-routing-obligation"
        actor: FleetOwner
        preconditions:
          - "Car.routing_status == OBLIGATION_MET"
        side_effects:
          - "same as NO_OBLIGATION -> OBLIGATION_ACTIVE; a new obligation supersedes the satisfied one"
        note: "Cyclic edge on the routing dimension: a car can be re-obligated after a compliant return."

      - from: OBLIGATION_ACTIVE
        to: OBLIGATION_MET
        dimension: routing
        trigger: "POST /car-hire/interchange-events with event_type = INTERCHANGE_DELIVERY, load_status = EMPTY, junction_id == Car.prescribed_return_junction_id, receiving_road_id == Car.owner_road_id, interchange_at <= Car.obligation_due_at"
        actor: system
        preconditions:
          - "Car.routing_status == OBLIGATION_ACTIVE"
        side_effects:
          - "Car.prescribed_return_junction_id, obligation_issued_at and obligation_due_at are cleared to null"

      - from: OBLIGATION_ACTIVE
        to: OBLIGATION_VIOLATED
        dimension: routing
        trigger: "POST /car-hire/interchange-events with event_type = INTERCHANGE_DELIVERY and load_status = EMPTY where junction_id != Car.prescribed_return_junction_id OR receiving_road_id != Car.owner_road_id OR interchange_at > Car.obligation_due_at"
        actor: system
        preconditions:
          - "Car.routing_status == OBLIGATION_ACTIVE"
        side_effects:
          - "CASCADE L1->L2: because routing_status became OBLIGATION_VIOLATED, the CarHireMovement this delivery just CLOSED (the violating handling road's segment) is charged reverse_route_penalty_cents per calculations.reverse_route_penalty and has reclaim_locked := true; its net_hire_cents is recomputed and its version incremented"
          - "CASCADE L2->L3: because that movement's net_hire_cents changed, if it already carries a settlement_cycle_id whose cycle status is in {COMPUTED, EXCHANGED} a CORRECTION_ADJUSTMENT HireLedgerEntry of amount (new_net - old_net) is minted and the cycle money fields are recomputed per calculations.settlement_statement; a SETTLED cycle transitions SETTLED -> REOPENED first"
          - "CASCADE L3->L4: because the cycle totals changed, payer_road.per_diem_exposure_cents and payee_road.foreign_car_balance are refreshed"
        note: "Reverse-route liability shift: the violating road loses all reclaim rights on the segment it just ended and pays a penalty on top of gross hire."

  # ---------------------------------------------------------------------------
  # InterchangeEvent — append-only log with correction-driven invalidation.
  # ---------------------------------------------------------------------------
  - entity: InterchangeEvent
    shape: linear
    initial_state: RECORDED
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "POST /car-hire/correction-requests/{correction_request_id}/apply where correction_type = TIMESTAMP_AMEND and target_event_id = this event"
        actor: system
        preconditions:
          - "InterchangeEvent.status == RECORDED"
          - "the movements bounded by this event are not stamped with a settlement_cycle_id whose cycle status is ARCHIVED"
        side_effects:
          - "a replacement InterchangeEvent is minted with source = CORRECTION_APPLY, corrects_event_id = this event's id, interchange_at = proposed_interchange_at and every other field copied from this event"
          - "CASCADE: the movement boundaries this event defined are rewritten (see state_machines.CorrectionRequest.CONFIRMED_to_APPLIED)"
      - from: RECORDED
        to: VOID
        trigger: "POST /car-hire/correction-requests/{correction_request_id}/apply where correction_type = ERRONEOUS_EVENT_VOID and target_event_id = this event"
        actor: system
        preconditions:
          - "InterchangeEvent.status == RECORDED"
          - "InterchangeEvent.event_type == INTERCHANGE_REJECTION"
        side_effects:
          - "CASCADE: the bad-order stamp this event wrote is erased and every downstream reclaim is unwound (see state_machines.CorrectionRequest.CONFIRMED_to_APPLIED)"

  # ---------------------------------------------------------------------------
  # CarHireMovement — the custody segment that carries the money.
  # ---------------------------------------------------------------------------
  - entity: CarHireMovement
    shape: linear
    initial_state: OPEN
    terminal_states: [VOID]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /car-hire/interchange-events with event_type = INTERCHANGE_DELIVERY for this movement's car"
        actor: system
        preconditions:
          - "CarHireMovement.status == OPEN"
          - "event.interchange_at > CarHireMovement.start_at"
          - "event.odometer_miles >= CarHireMovement.start_odometer_miles"
        side_effects:
          - "end_at := event.interchange_at; delivered_event_id := event.id; end_odometer_miles := event.odometer_miles"
          - "chargeable_hours, chargeable_days and time_component_cents := calculations.hire_time_component"
          - "mileage_component_cents := calculations.hire_mileage_component"
          - "gross_hire_cents := time_component_cents + mileage_component_cents; net_hire_cents := gross_hire_cents - reclaim_credit_cents + reverse_route_penalty_cents; adjusted_net_hire_cents := net_hire_cents"
          - "bad_order_to := end_at when bad_order_from IS NOT NULL AND bad_order_to IS NULL"
          - "handling_road.per_diem_exposure_cents and owner_road.foreign_car_balance are refreshed"
      - from: OPEN
        to: VOID
        trigger: "POST /car-hire/correction-requests/{correction_request_id}/apply where a MISSED_EVENT_INSERT reconstructs a handoff that makes this zero-length segment impossible (start_at == the reconstructed interchange_at)"
        actor: system
        preconditions:
          - "CarHireMovement.status == OPEN"
          - "CarHireMovement.start_at == proposed_interchange_at"
        side_effects:
          - "status := VOID; the segment is excluded from every calculation and from every settlement cycle"
      - from: CLOSED
        to: VOID
        trigger: "POST /car-hire/correction-requests/{correction_request_id}/apply where an ERRONEOUS_EVENT_VOID removes the event that opened this segment"
        actor: system
        preconditions:
          - "CarHireMovement.status == CLOSED"
          - "CarHireMovement.settlement_cycle_id IS NULL OR that cycle's status != ARCHIVED"
        side_effects:
          - "status := VOID; any HIRE_CHARGE entry already minted for the segment is reversed by a CORRECTION_ADJUSTMENT entry of the opposite amount"

  # ---------------------------------------------------------------------------
  # ReclaimClaim — filed by the handling road, decided by the owner road.
  # ---------------------------------------------------------------------------
  - entity: ReclaimClaim
    shape: branching
    initial_state: FILED
    terminal_states: [DISALLOWED, WITHDRAWN]
    transitions:
      - from: FILED
        to: ALLOWED
        trigger: "POST /car-hire/reclaim-claims/{claim_id}/allow"
        actor: CarHireAccountant
        preconditions:
          - "ReclaimClaim.status == FILED"
          - "acting railroad == ReclaimClaim.against_road_id (segregation of duties: never the filer)"
          - "the movement's settlement cycle, if stamped, is not ARCHIVED"
          - "allowed_hours, when supplied, is > 0 and <= claimed_hours"
        side_effects:
          - "allowed_hours := supplied value or claimed_hours; credit_cents := calculations.reclaim_credit_amount; decided_at := logical clock now"
          - "CASCADE L1->L2: because the claim reached ALLOWED, the parent CarHireMovement's reclaim_credit_cents is re-derived by calculations.reclaim_credit_allocation, net_hire_cents and adjusted_net_hire_cents are recomputed, and CarHireMovement.version is incremented"
          - "CASCADE L2->L3: because the movement's net changed, a RECLAIM_CREDIT HireLedgerEntry of amount (-credit_cents) is minted when the movement carries a settlement_cycle_id, and that cycle's money fields are recomputed per calculations.settlement_statement (a SETTLED cycle first transitions SETTLED -> REOPENED)"
          - "CASCADE L3->L4: because the cycle totals changed, payer_road.per_diem_exposure_cents is refreshed"
      - from: FILED
        to: DISALLOWED
        trigger: "POST /car-hire/reclaim-claims/{claim_id}/disallow"
        actor: CarHireAccountant
        preconditions:
          - "ReclaimClaim.status == FILED"
          - "acting railroad == ReclaimClaim.against_road_id"
        side_effects:
          - "disallow_reason := supplied reason; decided_at := logical clock now; credit_cents stays 0"
          - "no ledger entry is minted and no cycle total changes"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /car-hire/reclaim-claims/{claim_id}/withdraw"
        actor: CarHireAccountant
        preconditions:
          - "ReclaimClaim.status == FILED"
          - "acting railroad == ReclaimClaim.filed_by_road_id"
        side_effects:
          - "withdraw_reason := supplied reason; decided_at := logical clock now"
      - from: ALLOWED
        to: WITHDRAWN
        trigger: "POST /car-hire/reclaim-claims/{claim_id}/withdraw"
        actor: CarHireAccountant
        preconditions:
          - "ReclaimClaim.status == ALLOWED"
          - "acting railroad == ReclaimClaim.filed_by_road_id"
          - "the movement's settlement cycle, if stamped, is not ARCHIVED"
        side_effects:
          - "COMPENSATION L1: withdraw_reason := supplied reason; credit_cents := 0"
          - "COMPENSATION L2: the parent CarHireMovement's reclaim_credit_cents is re-derived, net_hire_cents restored, version incremented"
          - "COMPENSATION L3: a RECLAIM_REVERSAL HireLedgerEntry of amount (+the credit just removed) is minted and the cycle money fields are recomputed, restoring pre_fee_net_cents and clearinghouse_fee_cents to their pre-allow values exactly"
      - from: ALLOWED
        to: DISALLOWED
        trigger: "POST /car-hire/correction-requests/{correction_request_id}/apply where an ERRONEOUS_EVENT_VOID erases the bad-order stamp this claim relied on"
        actor: system
        preconditions:
          - "ReclaimClaim.status == ALLOWED AND ReclaimClaim.reason == BAD_ORDER"
          - "the voided event's interchange_at == the movement's bad_order_from"
        side_effects:
          - "disallow_reason := 'SUPPORTING_EVENT_VOIDED'; credit_cents := 0"
          - "the same L2/L3 unwinding as the ALLOWED -> WITHDRAWN edge, but with entry_type CORRECTION_ADJUSTMENT instead of RECLAIM_REVERSAL"

  # ---------------------------------------------------------------------------
  # EmbargoOrder
  # ---------------------------------------------------------------------------
  - entity: EmbargoOrder
    shape: linear
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /car-hire/embargo-orders/{embargo_id}/lift"
        actor: InterchangeClerk
        preconditions:
          - "EmbargoOrder.status == ACTIVE"
          - "acting railroad == EmbargoOrder.issuing_road_id"
          - "effective_from <= lifted_at <= logical clock now"
        side_effects:
          - "status := LIFTED; lifted_at := supplied instant"
          - "the order still supports a ReclaimClaim window that ends at or before lifted_at, and supports none that extends beyond it"

  # ---------------------------------------------------------------------------
  # RepairBill — cyclic counter-bill negotiation capped by MAX_COUNTER_BILL_ROUNDS.
  # ---------------------------------------------------------------------------
  - entity: RepairBill
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /car-hire/repair-bills/{repair_bill_id}/submit"
        actor: RepairBillingAgent
        preconditions:
          - "RepairBill.status == DRAFT"
          - "acting railroad == RepairBill.billing_road_id"
          - "labor_hours > 0 AND material_cents >= 0"
          - "when total_cents > REPAIR_PREAUTH_THRESHOLD_CENTS, RepairBill.pre_authorization_reference is non-empty"
        side_effects:
          - "responsible_road_id and responsibility_rule_applied := calculations.repair_responsibility_determination"
          - "labor_cents, handling_fee_cents and total_cents := calculations.repair_bill_amount"
          - "submitted_at := logical clock now; counter_bill_round stays 0"
          - "CASCADE: Car.mechanical_status BAD_ORDER -> UNDER_REPAIR"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /car-hire/repair-bills/{repair_bill_id}/counter-bill"
        actor: RepairBillingAgent
        preconditions:
          - "RepairBill.status == SUBMITTED"
          - "acting railroad == RepairBill.responsible_road_id (the road being billed, never the biller)"
          - "RepairBill.counter_bill_round < MAX_COUNTER_BILL_ROUNDS"
          - "0 < counter_total_cents < RepairBill.total_cents"
        side_effects:
          - "counter_bill_round := counter_bill_round + 1; total_cents := counter_total_cents; last_counter_at := logical clock now"
          - "status stays SUBMITTED — this is the self-loop of the negotiation"
        note: "Cyclic self-edge. The MAX_COUNTER_BILL_ROUNDS-th counter is the last one accepted; the next attempt is ERR_COUNTER_BILL_ROUNDS_EXHAUSTED (409)."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /car-hire/repair-bills/{repair_bill_id}/accept"
        actor: RepairBillingAgent
        preconditions:
          - "RepairBill.status == SUBMITTED"
          - "acting railroad == RepairBill.responsible_road_id"
        side_effects:
          - "accepted_at := logical clock now"
          - "a REPAIR_CHARGE HireLedgerEntry of amount total_cents is minted against responsible_road_id"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /car-hire/repair-bills/{repair_bill_id}/counter-bill with counter_total_cents omitted and reject = true"
        actor: RepairBillingAgent
        preconditions:
          - "RepairBill.status == SUBMITTED"
          - "acting railroad == RepairBill.responsible_road_id"
        side_effects:
          - "rejected_at := logical clock now; no ledger entry is minted; the car stays UNDER_REPAIR"
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /car-hire/repair-bills/{repair_bill_id}/settle"
        actor: ClearinghouseAdmin
        preconditions:
          - "RepairBill.status == ACCEPTED"
        side_effects:
          - "settled_at := logical clock now"
          - "CASCADE: Car.mechanical_status UNDER_REPAIR -> SERVICEABLE and the open bad-order stamp on the car's current movement is closed"

  # ---------------------------------------------------------------------------
  # SettlementCycle — cyclic: SETTLED can be reopened and recomputed.
  # ---------------------------------------------------------------------------
  - entity: SettlementCycle
    shape: cyclic
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: COMPUTED
        trigger: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/compute"
        actor: CarHireAccountant
        preconditions:
          - "SettlementCycle.status == OPEN"
          - "acting railroad == SettlementCycle.payee_road_id"
          - "logical clock now >= SettlementCycle.period_end"
        side_effects:
          - "every CLOSED CarHireMovement with handling_road_id = payer_road_id, owner_road_id = payee_road_id and end_at in [period_start, period_end) that carries no settlement_cycle_id is stamped settlement_cycle_id := this cycle and a HIRE_CHARGE HireLedgerEntry is minted for its net_hire_cents"
          - "every ACCEPTED RepairBill between the same two roads accepted in the window is stamped and mints a REPAIR_CHARGE entry"
          - "gross_hire_cents, reclaim_credit_cents, repair_charge_cents, pre_fee_net_cents, clearinghouse_fee_cents and net_settlement_cents := calculations.settlement_statement (variant AS_REPORTED)"
          - "computed_at := logical clock now; version is incremented"
      - from: COMPUTED
        to: EXCHANGED
        trigger: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/exchange"
        actor: CarHireAccountant
        preconditions:
          - "SettlementCycle.status == COMPUTED"
          - "acting railroad == SettlementCycle.payee_road_id"
        side_effects:
          - "exchanged_at := logical clock now; dispute_deadline_at := exchanged_at + DISPUTE_WINDOW_DAYS days; version is incremented"
          - "the cycle becomes the only legal dispute subject container: POST /car-hire/disputes is rejected with ERR_CYCLE_NOT_EXCHANGED before this point"
      - from: EXCHANGED
        to: SETTLED
        trigger: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/settle"
        actor: CarHireAccountant
        preconditions:
          - "SettlementCycle.status == EXCHANGED"
          - "acting railroad == SettlementCycle.payer_road_id (the paying road closes the cycle; the payee never can)"
          - "GUARD (cross-entity): no Dispute with settlement_cycle_id = this cycle is in status OPEN or COUNTERED"
          - "payer_road.per_diem_exposure_cents - net_settlement_cents <= payer_road.per_diem_credit_limit_cents is not required; the credit-limit check applies at compute time"
        side_effects:
          - "settled_at := logical clock now; reopen_deadline_at := settled_at + REOPEN_WINDOW_DAYS days"
          - "a SETTLEMENT_PAYMENT HireLedgerEntry of amount (-net_settlement_cents) is minted; payer_road.per_diem_exposure_cents is reduced by net_settlement_cents"
      - from: SETTLED
        to: REOPENED
        trigger: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/reopen"
        actor: ClearinghouseAdmin
        preconditions:
          - "SettlementCycle.status == SETTLED"
          - "logical clock now <= SettlementCycle.reopen_deadline_at"
        side_effects:
          - "reopened_at := logical clock now; reopen_count := reopen_count + 1; version is incremented"
          - "the SETTLEMENT_PAYMENT entry is reversed by a CORRECTION_ADJUSTMENT entry of the opposite amount and payer_road.per_diem_exposure_cents is restored"
        note: "Also reached automatically as a cascade when an allow/withdraw/correction changes a movement already stamped into a SETTLED cycle."
      - from: REOPENED
        to: COMPUTED
        trigger: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/compute"
        actor: CarHireAccountant
        preconditions:
          - "SettlementCycle.status == REOPENED"
          - "acting railroad == SettlementCycle.payee_road_id"
        side_effects:
          - "the same recomputation as OPEN -> COMPUTED, but movements already stamped with this settlement_cycle_id are re-read at their current adjusted_net_hire_cents rather than re-stamped"
          - "computed_at := logical clock now"
        note: "This is the loop edge: OPEN -> COMPUTED -> EXCHANGED -> SETTLED -> REOPENED -> COMPUTED -> ... Only ARCHIVED is terminal."
      - from: SETTLED
        to: ARCHIVED
        trigger: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/archive"
        actor: ClearinghouseAdmin
        preconditions:
          - "SettlementCycle.status == SETTLED"
          - "logical clock now > SettlementCycle.reopen_deadline_at"
        side_effects:
          - "archived_at := logical clock now"
          - "every movement, reclaim, repair bill and ledger entry stamped with this cycle becomes immutable; later mutation attempts return ERR_CYCLE_ARCHIVED_IMMUTABLE (409)"

  # ---------------------------------------------------------------------------
  # Dispute — cyclic with alternating turn-taking, capped by MAX_DISPUTE_ROUNDS.
  # ---------------------------------------------------------------------------
  - entity: Dispute
    shape: cyclic
    initial_state: OPEN
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: COUNTERED
        trigger: "POST /car-hire/disputes/{dispute_id}/counter"
        actor: CarHireAccountant
        preconditions:
          - "Dispute.status == OPEN"
          - "TURN RULE: acting railroad == Dispute.respondent_road_id — in OPEN it is the respondent's move"
          - "Dispute.round_number < MAX_DISPUTE_ROUNDS"
          - "0 <= counter_amount_cents <= Dispute.disputed_amount_cents"
        side_effects:
          - "round_number := round_number + 1; Dispute.counter_amount_cents := the body's counter_amount_cents; last_action_at := logical clock now; version is incremented"
      - from: COUNTERED
        to: OPEN
        trigger: "POST /car-hire/disputes/{dispute_id}/counter"
        actor: CarHireAccountant
        preconditions:
          - "Dispute.status == COUNTERED"
          - "TURN RULE: acting railroad == Dispute.filed_by_road_id — in COUNTERED it is the filer's move; the respondent countering twice in a row is ERR_DISPUTE_TURN_VIOLATION (403)"
          - "Dispute.round_number < MAX_DISPUTE_ROUNDS"
          - "Dispute.counter_amount_cents (the standing offer) <= the body's counter_amount_cents <= Dispute.disputed_amount_cents — the filer may only walk the offer up"
        side_effects:
          - "round_number := round_number + 1; Dispute.counter_amount_cents := the body's counter_amount_cents; last_action_at := logical clock now; version is incremented"
        note: "The OPEN <-> COUNTERED pair is the negotiation cycle; the actor alternates by state, so the state itself encodes whose turn it is."
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /car-hire/disputes/{dispute_id}/accept"
        actor: CarHireAccountant
        preconditions:
          - "Dispute.status == OPEN"
          - "acting railroad == Dispute.respondent_road_id"
        side_effects:
          - "resolution_amount_cents := Dispute.counter_amount_cents when counter_amount_cents IS NOT NULL else Dispute.disputed_amount_cents; resolved_at := logical clock now"
          - "CASCADE: the disputed CarHireMovement's adjusted_net_hire_cents := net_hire_cents - resolution_amount_cents; a DISPUTE_ADJUSTMENT HireLedgerEntry of (-resolution_amount_cents) is minted; the cycle's money fields are recomputed under variant RECONCILED"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /car-hire/disputes/{dispute_id}/accept"
        actor: CarHireAccountant
        preconditions:
          - "Dispute.status == COUNTERED"
          - "acting railroad == Dispute.filed_by_road_id"
        side_effects:
          - "same as OPEN -> ACCEPTED, settling at the standing counter_amount_cents"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /car-hire/disputes/{dispute_id}/withdraw"
        actor: CarHireAccountant
        preconditions:
          - "Dispute.status == OPEN"
          - "acting railroad == Dispute.filed_by_road_id"
        side_effects:
          - "resolution_amount_cents := 0; resolved_at := logical clock now; no ledger entry is minted"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /car-hire/disputes/{dispute_id}/withdraw"
        actor: CarHireAccountant
        preconditions:
          - "Dispute.status == COUNTERED"
          - "acting railroad == Dispute.filed_by_road_id"
        side_effects:
          - "resolution_amount_cents := 0; resolved_at := logical clock now"

  # ---------------------------------------------------------------------------
  # CorrectionRequest — data-quality repair of the interchange log.
  # ---------------------------------------------------------------------------
  - entity: CorrectionRequest
    shape: branching
    initial_state: FILED
    terminal_states: [APPLIED, REJECTED, EXPIRED]
    transitions:
      - from: FILED
        to: CONFIRMED
        trigger: "POST /car-hire/correction-requests/{correction_request_id}/confirm"
        actor: InterchangeClerk
        preconditions:
          - "CorrectionRequest.status == FILED"
          - "acting railroad == CorrectionRequest.counterparty_road_id (never the filer: the other road at the junction must agree the log was wrong)"
          - "logical clock now <= CorrectionRequest.created_at + CORRECTION_CONFIRM_WINDOW_HOURS hours"
        side_effects:
          - "confirmed_at := logical clock now"
      - from: FILED
        to: REJECTED
        trigger: "POST /car-hire/correction-requests/{correction_request_id}/reject"
        actor: InterchangeClerk
        preconditions:
          - "CorrectionRequest.status == FILED"
          - "acting railroad == CorrectionRequest.counterparty_road_id"
        side_effects:
          - "rejection_reason := supplied reason; rejected_at := logical clock now"
      - from: FILED
        to: EXPIRED
        trigger: "POST /car-hire/correction-requests/expire-due"
        actor: ClearinghouseAdmin
        preconditions:
          - "CorrectionRequest.status == FILED"
          - "logical clock now > CorrectionRequest.created_at + CORRECTION_CONFIRM_WINDOW_HOURS hours"
        side_effects:
          - "expired_at := logical clock now; the request can never be confirmed or applied afterwards"
        note: "Sweep endpoint: every FILED request past its window expires in one call, in created_at ASC order."
      - from: CONFIRMED
        to: APPLIED
        trigger: "POST /car-hire/correction-requests/{correction_request_id}/apply"
        actor: InterchangeClerk
        preconditions:
          - "CorrectionRequest.status == CONFIRMED"
          - "acting railroad == CorrectionRequest.filed_by_road_id OR role == ClearinghouseAdmin"
          - "no movement touched by the correction carries a settlement_cycle_id whose cycle status is ARCHIVED"
        side_effects:
          - "CASCADE L1: applied_at := logical clock now; for MISSED_EVENT_INSERT a new InterchangeEvent with source = CORRECTION_APPLY is minted; for TIMESTAMP_AMEND the target event goes RECORDED -> SUPERSEDED and a replacement event is minted; for ERRONEOUS_EVENT_VOID the target event goes RECORDED -> VOID"
          - "CASCADE L2: the affected CarHireMovement boundaries are rewritten — start_at/end_at re-derived from the surviving RECORDED events in interchange_at ASC order (ties broken by created_at ASC), zero-length segments transitioning OPEN -> VOID; an ERRONEOUS_EVENT_VOID of an INTERCHANGE_REJECTION clears bad_order_from/bad_order_to on the movement it stamped"
          - "CASCADE L3: every affected movement's chargeable_hours, time_component_cents, mileage_component_cents, gross_hire_cents and net_hire_cents are recomputed and its version incremented"
          - "CASCADE L4: any ALLOWED ReclaimClaim whose supporting bad-order stamp disappeared transitions ALLOWED -> DISALLOWED with disallow_reason = 'SUPPORTING_EVENT_VOIDED' and its credit is removed from the movement"
          - "CASCADE L5: for every affected movement already stamped into a cycle, a CORRECTION_ADJUSTMENT HireLedgerEntry of (new_net - old_net) is minted, the cycle recomputes its money fields (SETTLED -> REOPENED first), and both railroads' per_diem_exposure_cents and foreign_car_balance are refreshed"

# =============================================================================
# Table 1.2.1: Concurrency Rules (write-write conflict is OCC-only)
# =============================================================================
concurrency_rules:
  - rule_id: dispute-file-stale-cycle
    parent_entity: SettlementCycle
    child_entity: Dispute
    write_endpoint: "POST /car-hire/disputes"
    occ_field: expected_cycle_version
    version_source: "SettlementCycle.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    rule: |
      Filing a dispute requires the caller to echo the SettlementCycle.version it read from the
      exchanged statement as expected_cycle_version. If SettlementCycle.version has moved on
      (because the payee recomputed the cycle, or a cascade reopened it) the request is rejected
      with ERR_STALE_VERSION (412) and no Dispute row is created. On success the cycle's version
      is incremented by 1, so a second submission of the same request body also fails with
      ERR_STALE_VERSION — the caller must re-read the statement between filings.
    ordering_note: |
      The version check runs at priority 10 in Table 1.4 — after authentication, path existence,
      request shape, body-FK existence and party membership, and before every state and business
      rule. A caller with both a stale expected_cycle_version and a subject that is not in the
      cycle therefore receives ERR_STALE_VERSION, not ERR_DISPUTE_SUBJECT_NOT_IN_CYCLE.

  - rule_id: reclaim-file-stale-movement
    parent_entity: CarHireMovement
    child_entity: ReclaimClaim
    write_endpoint: "POST /car-hire/reclaim-claims"
    occ_field: expected_movement_version
    version_source: "CarHireMovement.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    rule: |
      Filing a reclaim requires the caller to echo the CarHireMovement.version it read as
      expected_movement_version. Every mutation of the segment — closing it, stamping a
      bad-order window, allowing or withdrawing another reclaim, applying a correction,
      charging a reverse-route penalty — increments CarHireMovement.version, so a claim
      computed against a stale view of the segment is rejected with ERR_STALE_VERSION (412)
      and nothing is written. On success the movement's version is incremented by 1.
    ordering_note: |
      Same priority-10 placement. A stale expected_movement_version outranks
      ERR_MOVEMENT_NOT_CLOSED, ERR_RECLAIM_WINDOW_OUTSIDE_MOVEMENT and
      ERR_RECLAIM_WINDOW_OVERLAP.

# =============================================================================
# Table 1.3: Calculation Rules
# =============================================================================
calculations:

  - name: hire_time_component
    algorithm_type: tiered_pricing
    applies_to: "CarHireMovement.chargeable_hours, chargeable_days, time_component_cents"
    trigger: "computed when a CarHireMovement transitions OPEN -> CLOSED, and recomputed whenever a correction rewrites its start_at or end_at"
    input_set: "the movement itself plus its car's CarType configuration row"
    constants: [free_time_hours, per_diem_rate_cents, tier2_threshold_days, tier2_per_diem_rate_cents, hourly_rate_cents]
    formula: |
      Step 1 (elapsed):  elapsed_hours = (end_at - start_at) in hours, exact, expressed with
                         two decimal places.
      Step 2 (free time): chargeable_hours = max(0, elapsed_hours - CarType.free_time_hours).
                         A movement entirely inside free time yields chargeable_hours = 0 and
                         time_component_cents = 0 — it is still a member line of the cycle.
      Step 3 (mode branch on CarType.time_component_mode):
        MODE PER_DIEM:
          chargeable_days = ceil(chargeable_hours / 24)          # any part of a day is a day
          tier1_days = min(chargeable_days, CarType.tier2_threshold_days)
          tier2_days = max(0, chargeable_days - CarType.tier2_threshold_days)
          time_component_cents = tier1_days * CarType.per_diem_rate_cents
                              + tier2_days * CarType.tier2_per_diem_rate_cents
          The tier is MARGINAL: only the days beyond tier2_threshold_days are charged at the
          escalated rate; the first tier2_threshold_days always bill at per_diem_rate_cents.
        MODE HOURLY:
          chargeable_days = null
          time_component_cents = round_half_up(chargeable_hours * CarType.hourly_rate_cents)
      Step 4: the result is an integer number of cents; no per-movement floor or cap applies.
    precision: "elapsed_hours and chargeable_hours to 2 decimal places; cents are integers; ROUND_HALF_UP at the single rounding point named in each branch"
    ordering_note: |
      The three steps are not commutative. Free time is deducted from HOURS before the
      ceiling to days, so a 76.00-hour movement with 4 free hours bills 3 days
      (ceil(72/24) = 3), not 4 days (ceil(76/24) = 4 would be the wrong order).
    worked_example: |
      CarType XM: PER_DIEM, free_time_hours 4, per_diem_rate_cents 2350,
      tier2_threshold_days 2, tier2_per_diem_rate_cents 3100.
      start_at 2026-08-26T06:00:00Z, end_at 2026-08-29T10:00:00Z
        elapsed_hours 76.00 -> chargeable_hours 72.00 -> chargeable_days 3
        tier1_days 2 -> 4700; tier2_days 1 -> 3100; time_component_cents = 7800.
      start_at 2026-08-27T00:00:00Z, end_at 2026-08-28T12:00:00Z
        elapsed_hours 36.00 -> chargeable_hours 32.00 -> chargeable_days 2
        tier1_days 2 -> 4700; tier2_days 0; time_component_cents = 4700.

  - name: hire_mileage_component
    algorithm_type: aggregation
    applies_to: "CarHireMovement.mileage_component_cents"
    trigger: "computed with hire_time_component when a movement closes or is recomputed"
    input_set: "the movement's own odometer delta; for the settlement roll-up, every member movement line of the cycle"
    constants: [mileage_rate_millicents_per_mile, loaded_mileage_only]
    formula: |
      Step 1 (per movement):
        segment_miles = end_odometer_miles - start_odometer_miles      # never negative
        billable_miles = 0 when CarType.loaded_mileage_only is true AND movement.load_status
                         is EMPTY, else segment_miles
        mileage_component_cents = round_half_up(
            billable_miles * CarType.mileage_rate_millicents_per_mile / 1000 )
      Step 2 (roll-up): the cycle's mileage total is the SUM of the already-rounded
        per-movement mileage_component_cents values.
    precision: "millicents divided by 1000 then ROUND_HALF_UP to whole cents, ONCE PER MOVEMENT"
    ordering_note: |
      ROUND-PER-LINE-THEN-SUM is normative, and it is observably different from
      sum-then-round. With mileage_rate_millicents_per_mile = 2350:
        415 miles -> 975.25 cents -> 975;  227 miles -> 533.45 cents -> 533;  sum = 1508.
        Summing first: 642 miles -> 1508.70 cents -> 1509.
      The cycle total must be 1508. An implementation that accumulates exact millicents
      across lines and rounds at the end is wrong by one cent here.
    worked_example: |
      loaded movement, 415 miles -> 975 cents.
      empty movement of a loaded_mileage_only car type, 190 miles -> 0 cents.

  - name: clearinghouse_fee
    algorithm_type: threshold
    applies_to: "SettlementCycle.clearinghouse_fee_cents"
    trigger: "computed inside settlement_statement on every compute of a cycle"
    input_set: "the single scalar SettlementCycle.pre_fee_net_cents produced by settlement_statement step 5"
    constants: [FEE_TIER_BREAK_CENTS, FEE_TIER1_PCT, FEE_TIER2_PCT]
    formula: |
      basis = abs(pre_fee_net_cents)
      rate  = FEE_TIER1_PCT when basis <= FEE_TIER_BREAK_CENTS else FEE_TIER2_PCT
      clearinghouse_fee_cents = round_half_up(basis * rate)
      The chosen rate applies to the WHOLE basis — this is a flat selected rate, not a
      marginal ladder, so the fee curve steps DOWN as the basis crosses the break.
    precision: "ROUND_HALF_UP to whole cents; the rate is never blended"
    ordering_note: |
      The fee is keyed on pre_fee_net_cents — the net BEFORE the fee — never on
      net_settlement_cents. Feeding the post-fee figure back in would be circular and
      would produce a different tier for any basis just above the break.
    boundary_note: |
      basis 499999 -> 2500 (round_half_up(2499.995) = 2500)
      basis 500000 -> 2500 (exactly at the break, still tier 1)
      basis 500001 -> 1750 (round_half_up(1750.0035) = 1750) — one cent more basis,
                      750 cents less fee.
    worked_example: |
      18708 -> tier 1 -> round_half_up(93.54) = 94
      14008 -> tier 1 -> round_half_up(70.04) = 70
       8035 -> tier 1 -> round_half_up(40.175) = 40
       3906 -> tier 1 -> round_half_up(19.53) = 20

  - name: reclaim_credit_amount
    algorithm_type: threshold
    applies_to: "ReclaimClaim.claimed_hours, allowed_hours, split_pct_applied, credit_cents"
    trigger: "claimed_hours at POST /car-hire/reclaim-claims; credit_cents when the claim reaches ALLOWED"
    input_set: "the claim's window, its parent CarHireMovement and, for reason = EMBARGO, the supporting EmbargoOrder"
    constants: [MIN_RECLAIM_HOURS, DETENTION_SPLIT_PCT]
    formula: |
      Step 1: claimed_hours = (window_to - window_from) in hours, half-open [window_from,
              window_to). Must be >= MIN_RECLAIM_HOURS or the filing is refused.
      Step 2: effective_hours = allowed_hours when the deciding road supplied one, else
              claimed_hours.
      Step 3 (reason branch, split_pct_applied):
              BAD_ORDER          -> 1.0
              EMBARGO            -> 1.0
              CUSTOMER_DETENTION -> DETENTION_SPLIT_PCT (the two roads share the cost of a
                                    shipper holding the car)
      Step 4: raw_credit = round_half_up( movement.time_component_cents * effective_hours
                                          / movement.chargeable_hours * split_pct_applied )
      Step 5: credit_cents = min(raw_credit, movement.time_component_cents)
              The credit is pro-rated against the TIME component only; mileage is never
              reclaimable.
    precision: "hours to 2 decimal places; ROUND_HALF_UP once, at step 4"
    ordering_note: |
      The split percentage multiplies inside the single rounding of step 4; splitting a
      rounded full credit in half is a different number.
    worked_example: |
      movement time_component_cents 7800, chargeable_hours 72.00, BAD_ORDER window 36.00 h
        -> round_half_up(7800 * 36 / 72 * 1.0) = 3900
      movement time_component_cents 7800, chargeable_hours 68.00, BAD_ORDER window 36.00 h
        -> round_half_up(7800 * 36 / 68 * 1.0) = round_half_up(4129.41) = 4129
      movement time_component_cents 4700, chargeable_hours 32.00, EMBARGO window 26.00 h
        -> round_half_up(4700 * 26 / 32 * 1.0) = round_half_up(3818.75) = 3819
      movement time_component_cents 7800, chargeable_hours 72.00, CUSTOMER_DETENTION 30.00 h
        -> round_half_up(7800 * 30 / 72 * 0.5) = round_half_up(1625.00) = 1625

  - name: reclaim_credit_allocation
    algorithm_type: waterfall_allocation
    applies_to: "CarHireMovement.reclaim_credit_cents, net_hire_cents, adjusted_net_hire_cents"
    trigger: "re-derived whenever any ReclaimClaim on the movement enters or leaves ALLOWED"
    input_set: "every ReclaimClaim on the movement with status = ALLOWED"
    constants: []
    formula: |
      Step 1 (ordering — deterministic, never by id):
        order the ALLOWED claims by window_from ASC, then by created_at ASC, then by
        claimed_hours DESC. No random or identifier-derived tiebreak is permitted.
      Step 2 (waterfall): remaining = movement.time_component_cents; running = 0.
        For each claim in order:
          take = min(claim.credit_cents, remaining)
          running += take; remaining -= take
        The first claim in the order fills before the second; a claim reached with
        remaining = 0 contributes nothing, and its own credit_cents field is left untouched
        (the cap lives on the movement, not on the claim).
      Step 3: reclaim_credit_cents = running
      Step 4: net_hire_cents = gross_hire_cents - reclaim_credit_cents
                             + reverse_route_penalty_cents
      Step 5: adjusted_net_hire_cents = net_hire_cents when no Dispute citing this movement
              is ACCEPTED, else net_hire_cents - that dispute's resolution_amount_cents.
      Removing a claim from ALLOWED re-runs the whole waterfall from step 1, so the
      movement returns to exactly its previous reclaim_credit_cents with no drift.
    precision: "integer cents only; no rounding occurs in this rule"
    ordering_note: "The waterfall order is by window, not by amount — a later-window larger claim can be the one that is clipped."
    worked_example: |
      time_component_cents 7800; ALLOWED claims of 3900 (window_from 2026-08-27T00:00:00Z)
      and 4129 (window_from 2026-08-28T00:00:00Z):
        first takes 3900 (remaining 3900), second takes min(4129, 3900) = 3900
        -> reclaim_credit_cents = 7800, and net_hire_cents = gross - 7800.

  - name: reverse_route_penalty
    algorithm_type: threshold
    applies_to: "CarHireMovement.reverse_route_penalty_cents"
    trigger: "when a delivery event drives Car.routing_status OBLIGATION_ACTIVE -> OBLIGATION_VIOLATED"
    input_set: "the CarHireMovement that the violating delivery closed"
    constants: [REVERSE_ROUTE_PENALTY_PCT]
    formula: |
      reverse_route_penalty_cents = round_half_up( movement.time_component_cents
                                                   * REVERSE_ROUTE_PENALTY_PCT )
      and movement.reclaim_locked := true, which permanently bars new reclaim filings
      against the segment (ERR_MOVEMENT_RECLAIM_LOCKED) and does not disturb reclaims
      already ALLOWED.
      The penalty is added, not subtracted, in net_hire_cents: the road that violated the
      reverse-route rule owes hire plus the penalty.
    precision: "ROUND_HALF_UP to whole cents"
    worked_example: |
      time_component_cents 7800 -> round_half_up(1950.00) = 1950
      a movement with gross 7800 and no reclaims therefore nets 9750.

  - name: repair_responsibility_determination
    algorithm_type: chronological
    applies_to: "RepairBill.responsible_road_id, responsibility_rule_applied"
    trigger: "computed at POST /car-hire/repair-bills/{repair_bill_id}/submit"
    input_set: "the car's CarHireMovement rows ordered by start_at ASC (ties by created_at ASC), plus RepairBill.defect_class and defect_occurred_at"
    variants:
      - name: HANDLING_LINE_RULE
        applies_when: "RepairBill.defect_class == HANDLING_DAMAGE"
        rule: |
          The responsible road is the road that HELD the car when the damage occurred:
          scan the car's movements in start_at ASC order and select the one whose
          [start_at, end_at) half-open interval contains defect_occurred_at (an OPEN
          movement is treated as extending to the logical clock now); responsible_road_id
          = that movement.handling_road_id. If no movement covers the instant, the submit
          is refused with ERR_NO_CUSTODY_AT_DEFECT_TIME (422).
      - name: OWNER_RESPONSIBILITY_RULE
        applies_when: "RepairBill.defect_class in {NORMAL_WEAR, OWNER_APPLIANCE_DEFECT}"
        rule: |
          Custody is irrelevant: responsible_road_id = Car.owner_road_id, because ordinary
          wear and owner-supplied appliances stay with the owner however far the car has
          travelled.
    divergence_note: |
      The two variants read the SAME movement history and the same defect_occurred_at and
      pick DIFFERENT roads. Holding every other field constant and flipping defect_class
      from HANDLING_DAMAGE to NORMAL_WEAR moves responsible_road_id from the handling road
      to the owner road, and — because handling_fee applies only when the responsible road
      is not the billing road — also changes total_cents.
    precision: "n/a; the output is an identifier plus the rule name"

  - name: repair_bill_amount
    algorithm_type: aggregation
    applies_to: "RepairBill.labor_cents, subtotal_cents, handling_fee_cents, total_cents"
    trigger: "computed at submit, after repair_responsibility_determination has fixed responsible_road_id"
    input_set: "the bill's own labor_hours and material_cents"
    constants: [REPAIR_LABOR_RATE_CENTS_PER_HOUR, REPAIR_HANDLING_FEE_PCT, REPAIR_PREAUTH_THRESHOLD_CENTS]
    formula: |
      Step 1: labor_cents = round_half_up(labor_hours * REPAIR_LABOR_RATE_CENTS_PER_HOUR)
      Step 2: subtotal_cents = labor_cents + material_cents
      Step 3: handling_fee_cents = round_half_up(subtotal_cents * REPAIR_HANDLING_FEE_PCT)
              when responsible_road_id != billing_road_id, else 0. A road repairing its own
              car bills no handling fee.
      Step 4: total_cents = subtotal_cents + handling_fee_cents
      Step 5 (gate): when total_cents > REPAIR_PREAUTH_THRESHOLD_CENTS and
              pre_authorization_reference is null or empty, the submit is refused with
              ERR_REPAIR_PREAUTH_REQUIRED (422) and nothing is persisted. The gate reads
              the fee-inclusive total, so a bill can clear the threshold on the handling
              fee alone.
    precision: "ROUND_HALF_UP at steps 1 and 3 independently"
    worked_example: |
      labor_hours 3.5, material_cents 12000, responsible != billing:
        labor 33250; subtotal 45250; handling fee round_half_up(3393.75) = 3394;
        total 48644.
      the same bill where responsible == billing: handling fee 0; total 45250.
      labor_hours 0, material_cents 465116, responsible != billing:
        subtotal 465116; fee round_half_up(34883.70) = 34884; total 500000.

  - name: settlement_statement
    algorithm_type: aggregation
    applies_to: "SettlementCycle.gross_hire_cents, reclaim_credit_cents, penalty_cents, repair_charge_cents, dispute_adjustment_cents, pre_fee_net_cents, clearinghouse_fee_cents, net_settlement_cents, movement_line_count, variant_applied"
    trigger: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/compute, and every cascade that changes a member line"
    input_set: |
      member movements: CarHireMovement rows with status = CLOSED, handling_road_id =
      cycle.payer_road_id, owner_road_id = cycle.payee_road_id, hire_liable = true and
      end_at in [period_start, period_end). VOID movements and OPEN movements are excluded
      however much hire they have accrued.
      member repair bills: RepairBill rows with status in {ACCEPTED, SETTLED},
      billing_road_id = cycle.payee_road_id, responsible_road_id = cycle.payer_road_id and
      accepted_at in [period_start, period_end).
    constants: [FEE_TIER_BREAK_CENTS, FEE_TIER1_PCT, FEE_TIER2_PCT]
    variants:
      - name: AS_REPORTED
        applies_when: "the default for compute, and the only variant used while no Dispute on this cycle has reached ACCEPTED"
        rule: |
          movement_net(m) = m.net_hire_cents — the figure as originally reported by the
          handling road, ignoring every dispute outcome.
      - name: RECONCILED
        applies_when: "at least one Dispute with this settlement_cycle_id is ACCEPTED; also selectable explicitly on GET /car-hire/settlement-cycles/{id}/statement?variant=RECONCILED"
        rule: |
          movement_net(m) = m.adjusted_net_hire_cents — the figure after accepted dispute
          resolutions are applied, and dispute_adjustment_cents accumulates the negative
          sum of those resolutions.
    formula: |
      Step 1: gross_hire_cents      = SUM over member movements of gross_hire_cents
      Step 2: reclaim_credit_cents  = SUM over member movements of reclaim_credit_cents
      Step 3: penalty_cents         = SUM over member movements of reverse_route_penalty_cents
      Step 4: repair_charge_cents   = SUM over member repair bills of total_cents
              dispute_adjustment_cents = SUM over member movements of
                                         (adjusted_net_hire_cents - net_hire_cents)
                                         under RECONCILED, else 0
      Step 5: pre_fee_net_cents     = SUM over member movements of movement_net(m)
                                    + repair_charge_cents
              which is identically gross_hire_cents - reclaim_credit_cents + penalty_cents
                                    + repair_charge_cents + dispute_adjustment_cents
      Step 6: clearinghouse_fee_cents = calculations.clearinghouse_fee(pre_fee_net_cents)
      Step 7: net_settlement_cents  = pre_fee_net_cents - clearinghouse_fee_cents
      Step 8: movement_line_count   = COUNT of member movements
              variant_applied       = the variant used; as_reported_net_cents and
              reconciled_net_cents each retain the most recent value of their own variant.
      Movements are visited in end_at ASC order, ties broken by created_at ASC, so the
      statement is reproducible; because every per-line figure is already an integer, the
      order affects only the printed line sequence, never the totals.
    precision: "integer cents throughout; the only rounding is inside clearinghouse_fee"
    worked_example: |
      three member movements with net_hire_cents 8775, 5233 and 4700 and no repair bills:
        AS_REPORTED  -> pre_fee_net 18708, fee 94, net_settlement 18614
      after a Dispute on the 4700 line is ACCEPTED at its full 4700:
        RECONCILED   -> dispute_adjustment -4700, pre_fee_net 14008, fee 70,
                        net_settlement 13938
      the switch therefore moves the remittance by 4676 cents, which is not 4700 —
      the fee tier is re-evaluated on the new basis.

  - name: per_diem_exposure
    algorithm_type: forward_looking
    applies_to: "Railroad.per_diem_exposure_cents and the GET /car-hire/railroads/{railroad_id}/exposure projection"
    trigger: "refreshed on every movement close, reclaim decision, correction apply and cycle settle; evaluated on demand by the exposure read"
    input_set: "every CarHireMovement with handling_road_id = this railroad, hire_liable = true and status in {OPEN, CLOSED}, minus the amounts already remitted through SETTLED cycles"
    constants: [PROJECTION_HORIZON_HOURS, DEFAULT_PER_DIEM_CREDIT_LIMIT_CENTS]
    variants:
      - name: SNAPSHOT
        applies_when: "the default; also the variant that maintains Railroad.per_diem_exposure_cents"
        rule: |
          For a CLOSED movement, take net_hire_cents as it stands.
          For an OPEN movement, accrue it as if it closed at the logical clock now:
          run hire_time_component with end_at = now and add mileage 0 (no delivery odometer
          has been reported yet).
          Subtract net_settlement_cents of every SETTLED cycle in which the railroad is the
          payer.
      - name: PROJECTED
        applies_when: "GET /car-hire/railroads/{railroad_id}/exposure?variant=PROJECTED"
        rule: |
          Identical, except every OPEN movement accrues to
          (logical clock now + PROJECTION_HORIZON_HOURS hours). CLOSED movements and the
          settled subtraction are unchanged, so the two variants differ by exactly the
          extra accrual on the OPEN set.
    formula: |
      exposure = SUM over the input set of variant_accrual(m)
               - SUM over SETTLED cycles where payer_road_id = this railroad of
                 net_settlement_cents
      credit_headroom_cents = per_diem_credit_limit_cents - exposure, and a compute that
      would drive headroom negative is refused with
      ERR_PER_DIEM_CREDIT_LIMIT_EXCEEDED (402).
    precision: "integer cents; each OPEN movement is rounded by hire_time_component before summing"
    worked_example: |
      one OPEN movement, start_at 2026-08-30T00:00:00Z, CarType XM, clock now
      2026-09-02T00:00:00Z:
        SNAPSHOT  -> elapsed 72.00, chargeable 68.00, 3 days -> 7800
        PROJECTED -> accrues to 2026-09-05T00:00:00Z: elapsed 144.00, chargeable 140.00,
                     6 days -> 2*2350 + 4*3100 = 17100
      the projection is more than double the snapshot because the escalated tier2 rate
      dominates the extra three days.

  - name: fleet_utilization
    algorithm_type: aggregation
    applies_to: "Railroad.owned_car_count and the utilization figures on GET /car-hire/railroads/{railroad_id}/exposure"
    trigger: "evaluated on demand by the exposure read"
    input_set: "every Car with owner_road_id = this railroad"
    constants: []
    formula: |
      owned_car_count      = COUNT of owned cars
      on_foreign_count     = COUNT of owned cars with custody_status = ON_FOREIGN_ROAD
      bad_order_count      = COUNT of owned cars with mechanical_status in
                             {BAD_ORDER, UNDER_REPAIR}
      serviceable_foreign  = COUNT of owned cars with custody_status = ON_FOREIGN_ROAD AND
                             mechanical_status = SERVICEABLE
      utilization_pct      = 0.00 when owned_car_count = 0, else
                             round_half_up(100 * serviceable_foreign / owned_car_count, 2)
      The empty fleet yields 0.00 and never an error or a null.
    precision: "utilization_pct to exactly 2 decimal places, ROUND_HALF_UP"
    worked_example: |
      7 owned cars, 3 of them ON_FOREIGN_ROAD and SERVICEABLE:
        round_half_up(100 * 3 / 7, 2) = round_half_up(42.857..., 2) = 42.86
      0 owned cars: utilization_pct = 0.00

# =============================================================================
# Table 1.4: Ordered Validation Rules
# Evaluated strictly in ascending priority. The FIRST violated rule determines the
# response; later violations are never reported, even when several hold at once.
# =============================================================================
validations:

  - priority: 1
    category: authentication
    applies_to: "every endpoint except POST /car-hire/_clock/set_current_utc"
    rule: "X-User-Role must be present and non-empty. A missing or empty header is unauthenticated."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401

  - priority: 2
    category: authentication
    applies_to: "every endpoint except POST /car-hire/_clock/set_current_utc"
    rule: "X-User-Role must name one of the five roles in Table 1.7."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401

  - priority: 3
    category: authorization
    applies_to: "every endpoint except POST /car-hire/_clock/set_current_utc"
    rule: "The supplied role must appear in the endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403

  - priority: 4
    category: authorization
    applies_to: "every endpoint whose role is entity_backed (all roles except ClearinghouseAdmin)"
    rule: "X-User-ID must be present and must resolve to an existing Railroad. A missing header, or one naming an unknown railroad, fails here — before any path lookup."
    error_id: ERR_ACTING_RAILROAD_UNKNOWN
    http_status: 403

  - priority: 5
    category: path_existence
    applies_to: "every endpoint carrying a path parameter"
    rule: "Each {id} path segment must resolve to an existing row of its entity, checked left to right. The error names the entity that failed: ERR_RAILROAD_NOT_FOUND, ERR_JUNCTION_NOT_FOUND, ERR_CAR_TYPE_NOT_FOUND, ERR_CAR_NOT_FOUND, ERR_INTERCHANGE_EVENT_NOT_FOUND, ERR_MOVEMENT_NOT_FOUND, ERR_RECLAIM_CLAIM_NOT_FOUND, ERR_EMBARGO_ORDER_NOT_FOUND, ERR_REPAIR_BILL_NOT_FOUND, ERR_SETTLEMENT_CYCLE_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_CORRECTION_REQUEST_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404

  - priority: 6
    category: request_shape
    applies_to: "every write endpoint"
    rule: "Every required field of the endpoint's input contract must be present, of the declared JSON type, and within its declared numeric or string bounds. Integers presented as strings, negative cents where the field is non-negative, malformed ISO-8601 instants and unparseable bodies all land here. Fields marked system or computed in Table 1.1 are ignored when supplied, never rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 400

  - priority: 7
    category: request_shape
    applies_to: "every write endpoint carrying an enum input"
    rule: "Every enum-typed input must be a member of its declared value set (event_type, load_status, reason, defect_class, correction_type, direction, dispute_reason, variant, status filters)."
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422

  - priority: 8
    category: referential
    applies_to: "every write endpoint carrying a foreign key in its body"
    rule: "Each body foreign key must resolve to an existing row, using the same ERR_<ENTITY>_NOT_FOUND catalogue as priority 5. Body-FK existence is checked AFTER shape and enum validity, so a body with both a bad enum and a dangling FK reports ERR_INVALID_ENUM_VALUE."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404

  - priority: 9
    category: authorization
    applies_to: "every endpoint that reads or mutates a resource scoped to particular railroads"
    rule: "The acting railroad must be a party to the resource: for a CarHireMovement, one of {handling_road_id, owner_road_id}; for a SettlementCycle, one of {payer_road_id, payee_road_id}; for a ReclaimClaim, Dispute, RepairBill or CorrectionRequest, one of the two roads named on the row; for a Car, its owner or its current handling road; for a HireLedgerEntry, one of {debit_road_id, credit_road_id}. ClearinghouseAdmin is a party to everything. A non-party gets this error whether or not the requested action would be legal for a party."
    error_id: ERR_NOT_A_PARTY_TO_RESOURCE
    http_status: 403

  - priority: 10
    category: occ
    applies_to: "POST /car-hire/disputes, POST /car-hire/reclaim-claims"
    rule: "The declared optimistic-concurrency field of Table 1.2.1 (expected_cycle_version, expected_movement_version) must equal the parent's current version. This runs before every state and business rule, so a stale version outranks all of them."
    error_id: ERR_STALE_VERSION
    http_status: 412

  - priority: 11
    category: state
    applies_to: "every transition endpoint EXCEPT the two that carry their own dedicated state gate at priorities 15 and 16 (POST /car-hire/correction-requests/{correction_request_id}/apply and POST /car-hire/repair-bills/{repair_bill_id}/accept, .../counter-bill)"
    rule: "The target resource's current status must be a legal from-state for the requested transition per Table 1.2. Re-issuing a transition that already ran, or driving a terminal row, fails here. The two endpoints named in applies_to are excluded so that their more specific errors at priorities 15 and 16 are the ones reported; every other transition endpoint reports this error."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409

  - priority: 12
    category: state
    applies_to: "POST /car-hire/reclaim-claims"
    rule: "The parent CarHireMovement must have status = CLOSED. Hire cannot be reclaimed against a segment that is still accruing, and never against a VOID segment."
    error_id: ERR_MOVEMENT_NOT_CLOSED
    http_status: 409

  - priority: 13
    category: state
    applies_to: "POST /car-hire/disputes"
    rule: "The parent SettlementCycle must have status = EXCHANGED. A cycle that is only COMPUTED has not yet been served on the counterparty, and a SETTLED or REOPENED cycle is past the dispute stage."
    error_id: ERR_CYCLE_NOT_EXCHANGED
    http_status: 409

  - priority: 14
    category: state
    applies_to: "POST /car-hire/reclaim-claims, the allow/disallow/withdraw actions, POST /car-hire/correction-requests/{correction_request_id}/apply, POST /car-hire/settlement-cycles/{settlement_cycle_id}/reopen"
    rule: "No resource touched by the write may belong to a SettlementCycle with status = ARCHIVED. An archived cycle and everything stamped into it are frozen."
    error_id: ERR_CYCLE_ARCHIVED_IMMUTABLE
    http_status: 409

  - priority: 15
    category: state
    applies_to: "POST /car-hire/correction-requests/{correction_request_id}/apply"
    rule: "The CorrectionRequest must have status = CONFIRMED. A FILED, REJECTED or EXPIRED request cannot be applied."
    error_id: ERR_CORRECTION_NOT_CONFIRMED
    http_status: 409

  - priority: 16
    category: state
    applies_to: "POST /car-hire/repair-bills/{repair_bill_id}/accept, .../counter-bill"
    rule: "The RepairBill must have status = SUBMITTED."
    error_id: ERR_REPAIR_BILL_NOT_SUBMITTED
    http_status: 409

  - priority: 17
    category: business_state
    applies_to: "POST /car-hire/interchange-events with event_type = INTERCHANGE_DELIVERY"
    rule: "The car's mechanical_status must not be BAD_ORDER or UNDER_REPAIR. A bad-ordered car cannot be handed to another road until it is released to service."
    error_id: ERR_CAR_BAD_ORDER_NOT_INTERCHANGEABLE
    http_status: 422

  - priority: 18
    category: business_state
    applies_to: "every write endpoint whose acting or referenced railroad participates in the outcome"
    rule: "Every Railroad named on the write — acting road, delivering road, receiving road, payer, payee, owner — must have status = ACTIVE. A SUSPENDED road can read but neither move cars nor settle."
    error_id: ERR_RAILROAD_SUSPENDED
    http_status: 422

  - priority: 19
    category: business_state
    applies_to: "POST /car-hire/interchange-events, POST /car-hire/cars/{car_id}/empty-routing-obligation"
    rule: "The referenced Junction must have status = OPEN."
    error_id: ERR_JUNCTION_CLOSED
    http_status: 422

  - priority: 20
    category: business_state
    applies_to: "POST /car-hire/repair-bills, POST /car-hire/cars/{car_id}/release-to-service"
    rule: "The Car must currently be BAD_ORDER (for a repair bill) or BAD_ORDER/UNDER_REPAIR (for a release). A serviceable car has nothing to repair or release."
    error_id: ERR_CAR_NOT_BAD_ORDERED
    http_status: 422

  - priority: 21
    category: business_referential
    applies_to: "POST /car-hire/embargo-orders"
    rule: "issuing_road_id must equal the acting railroad AND must be one of the junction's two roads. A road cannot file an embargo in another road's name, and a road that is not party to the junction has no standing to embargo traffic there."
    error_id: ERR_EMBARGO_SELF_ISSUED
    http_status: 422

  - priority: 22
    category: business_referential
    applies_to: "POST /car-hire/interchange-events"
    rule: "delivering_road_id and receiving_road_id must be the two distinct roads of the junction: {delivering_road_id, receiving_road_id} == {junction.road_a_id, junction.road_b_id}."
    error_id: ERR_ROADS_NOT_CONNECTED_AT_JUNCTION
    http_status: 422

  - priority: 23
    category: business_referential
    applies_to: "POST /car-hire/interchange-events"
    rule: "delivering_road_id must equal Car.current_handling_road_id. A road cannot deliver a car it does not hold."
    error_id: ERR_DELIVERING_ROAD_NOT_IN_CUSTODY
    http_status: 422

  - priority: 24
    category: business_referential
    applies_to: "POST /car-hire/disputes"
    rule: "The dispute subject must belong to the cycle: the referenced movement_id must carry settlement_cycle_id = the referenced cycle, or the referenced repair_bill_id must carry settlement_cycle_id = the referenced cycle."
    error_id: ERR_DISPUTE_SUBJECT_NOT_IN_CYCLE
    http_status: 422

  - priority: 25
    category: business_referential
    applies_to: "POST /car-hire/disputes"
    rule: "Exactly one of movement_id and repair_bill_id must be supplied. Supplying both, or neither, leaves the subject ambiguous."
    error_id: ERR_DISPUTE_SUBJECT_AMBIGUOUS
    http_status: 422

  - priority: 26
    category: business_referential
    applies_to: "POST /car-hire/reclaim-claims"
    rule: "The claim must be evidenced. reason = BAD_ORDER requires the movement's bad_order_from to be non-null; reason = EMBARGO requires supporting_embargo_id to be supplied; reason = CUSTOMER_DETENTION requires detention_notified_at to be supplied."
    error_id: ERR_RECLAIM_EVIDENCE_MISSING
    http_status: 422

  - priority: 27
    category: business_referential
    applies_to: "POST /car-hire/reclaim-claims with reason = EMBARGO"
    rule: "The supporting EmbargoOrder must cover the claim: its car_type_id must equal the car's car_type_id, its junction_id must be the junction of the movement's opening or closing event, and [window_from, window_to) must lie inside [effective_from, effective_to] — for a LIFTED order, inside [effective_from, min(effective_to, lifted_at)]."
    error_id: ERR_EMBARGO_DOES_NOT_COVER_WINDOW
    http_status: 422

  - priority: 28
    category: business_referential
    applies_to: "POST /car-hire/correction-requests"
    rule: "correction_type = ERRONEOUS_EVENT_VOID requires target_event_id to name a RECORDED InterchangeEvent with event_type = INTERCHANGE_REJECTION; correction_type = TIMESTAMP_AMEND requires a RECORDED target event; correction_type = MISSED_EVENT_INSERT requires target_event_id to be absent."
    error_id: ERR_CORRECTION_TARGET_NOT_VOIDABLE
    http_status: 422

  - priority: 29
    category: business_referential
    applies_to: "POST /car-hire/repair-bills/{repair_bill_id}/submit with defect_class = HANDLING_DAMAGE"
    rule: "Some CarHireMovement of the car must cover defect_occurred_at in its half-open [start_at, end_at) interval (an OPEN movement extends to the logical clock now). Without a covering segment the handling-line rule has no road to name."
    error_id: ERR_NO_CUSTODY_AT_DEFECT_TIME
    http_status: 422

  - priority: 30
    category: business_temporal
    applies_to: "POST /car-hire/interchange-events, POST /car-hire/cars/{car_id}/bad-order-report, POST /car-hire/cars/{car_id}/release-to-service, POST /car-hire/embargo-orders/{embargo_order_id}/lift"
    rule: "No supplied instant may be after the logical clock now. The interchange log cannot be written ahead of the clock."
    error_id: ERR_EVENT_IN_FUTURE
    http_status: 422

  - priority: 31
    category: business_temporal
    applies_to: "POST /car-hire/interchange-events"
    rule: "interchange_at must be within LATE_REPORT_LIMIT_HOURS hours of the logical clock now: now - interchange_at <= LATE_REPORT_LIMIT_HOURS hours. An older handoff can only enter the log through a confirmed CorrectionRequest of type MISSED_EVENT_INSERT, which bypasses this rule. The boundary is inclusive — exactly LATE_REPORT_LIMIT_HOURS old is still accepted."
    error_id: ERR_LATE_EVENT_REQUIRES_CORRECTION
    http_status: 422

  - priority: 32
    category: business_temporal
    applies_to: "POST /car-hire/interchange-events"
    rule: "interchange_at must be strictly greater than the interchange_at of the car's latest RECORDED event, and odometer_miles must be greater than or equal to that event's odometer_miles. Direct capture is append-only in time; out-of-order insertion is a correction, not a capture."
    error_id: ERR_EVENT_OUT_OF_SEQUENCE
    http_status: 422

  - priority: 33
    category: business_temporal
    applies_to: "POST /car-hire/reclaim-claims"
    rule: "[window_from, window_to) must lie inside the parent movement's [start_at, end_at): window_from >= start_at and window_to <= end_at."
    error_id: ERR_RECLAIM_WINDOW_OUTSIDE_MOVEMENT
    http_status: 422

  - priority: 34
    category: business_temporal
    applies_to: "POST /car-hire/reclaim-claims"
    rule: "The filing must be inside the industry window: logical clock now <= movement.end_at + RECLAIM_FILING_WINDOW_DAYS days."
    error_id: ERR_RECLAIM_FILING_WINDOW_EXPIRED
    http_status: 422

  - priority: 35
    category: business_temporal
    applies_to: "POST /car-hire/correction-requests/{correction_request_id}/confirm"
    rule: "logical clock now must be at or before created_at + CORRECTION_CONFIRM_WINDOW_HOURS hours (the row's confirm_deadline_at). The boundary is inclusive."
    error_id: ERR_CORRECTION_CONFIRM_WINDOW_EXPIRED
    http_status: 422

  - priority: 36
    category: business_temporal
    applies_to: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/compute"
    rule: "logical clock now must be at or after period_end_at. A month cannot be settled while it is still running."
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 422

  - priority: 37
    category: business_temporal
    applies_to: "POST /car-hire/disputes"
    rule: "logical clock now must be at or before the cycle's dispute_deadline_at (exchanged_at + DISPUTE_WINDOW_DAYS days). Inclusive boundary."
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 422

  - priority: 38
    category: business_temporal
    applies_to: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/reopen"
    rule: "logical clock now must be at or before reopen_deadline_at (settled_at + REOPEN_WINDOW_DAYS days). Inclusive boundary."
    error_id: ERR_REOPEN_WINDOW_EXPIRED
    http_status: 422

  - priority: 39
    category: business_temporal
    applies_to: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/archive"
    rule: "logical clock now must be strictly after reopen_deadline_at. Archiving while the cycle can still be reopened is refused."
    error_id: ERR_REOPEN_WINDOW_STILL_OPEN
    http_status: 422

  - priority: 40
    category: business_temporal
    applies_to: "POST /car-hire/reclaim-claims, POST /car-hire/embargo-orders, POST /car-hire/cars/{car_id}/empty-routing-obligation, POST /car-hire/correction-requests"
    rule: "Every supplied interval must be strictly ordered: window_from < window_to, effective_from < effective_to, issued_at < due_at."
    error_id: ERR_INVALID_INTERVAL
    http_status: 422

  - priority: 41
    category: business_temporal
    applies_to: "POST /car-hire/reclaim-claims"
    rule: "claimed_hours must be at least MIN_RECLAIM_HOURS. The boundary is inclusive: exactly MIN_RECLAIM_HOURS is claimable, one minute less is not."
    error_id: ERR_RECLAIM_WINDOW_TOO_SHORT
    http_status: 422

  - priority: 42
    category: resource_overlap
    applies_to: "POST /car-hire/reclaim-claims"
    rule: "The new [window_from, window_to) must not overlap the window of any existing ReclaimClaim on the same movement with status in {FILED, ALLOWED}. Windows are HALF-OPEN, so a claim ending exactly when another begins does not overlap and is accepted; one minute of true intersection is refused. DISALLOWED and WITHDRAWN claims free their window for re-filing."
    error_id: ERR_RECLAIM_WINDOW_OVERLAP
    http_status: 409

  - priority: 43
    category: resource_overlap
    applies_to: "POST /car-hire/embargo-orders"
    rule: "An ACTIVE EmbargoOrder for the same (junction_id, car_type_id) must not exist whose CLOSED interval [effective_from, effective_to] intersects the new one, nor may the new interval start within MIN_RECLAIM_HOURS hours of an existing order's effective_to. Embargo intervals are inclusive at both ends AND carry a mandatory MIN_RECLAIM_HOURS-hour cooling gap, so touching endpoints conflict here even though touching reclaim endpoints do not."
    error_id: ERR_EMBARGO_WINDOW_CONFLICT
    http_status: 409

  - priority: 44
    category: business_state
    applies_to: "POST /car-hire/reclaim-claims"
    rule: "The parent CarHireMovement must have reclaim_locked = false. A reverse-route violation permanently locks the segment against new reclaims."
    error_id: ERR_MOVEMENT_RECLAIM_LOCKED
    http_status: 422

  - priority: 45
    category: uniqueness
    applies_to: "POST /car-hire/railroads, /car-types, /junctions, /cars, /settlement-cycles, /disputes"
    rule: "Declared uniqueness must hold: Railroad.reporting_mark; CarType.car_type_code; Junction.junction_code; Car.car_mark; (payer_road_id, payee_road_id, period_month) on SettlementCycle; and at most one non-terminal Dispute per (settlement_cycle_id, subject)."
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409

  - priority: 46
    category: business_capacity
    applies_to: "POST /car-hire/disputes/{dispute_id}/counter"
    rule: "Dispute.round_number must be strictly less than MAX_DISPUTE_ROUNDS. The MAX_DISPUTE_ROUNDS-th counter succeeds; the next one is refused."
    error_id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http_status: 409

  - priority: 47
    category: business_capacity
    applies_to: "POST /car-hire/repair-bills/{repair_bill_id}/counter-bill"
    rule: "RepairBill.counter_bill_round must be strictly less than MAX_COUNTER_BILL_ROUNDS."
    error_id: ERR_COUNTER_BILL_ROUNDS_EXHAUSTED
    http_status: 409

  - priority: 48
    category: business_capacity
    applies_to: "POST /car-hire/repair-bills/{repair_bill_id}/submit"
    rule: "When the computed total_cents exceeds REPAIR_PREAUTH_THRESHOLD_CENTS, pre_authorization_reference must be present and non-empty. The gate reads the fee-inclusive total, so the handling fee alone can push a bill over the line."
    error_id: ERR_REPAIR_PREAUTH_REQUIRED
    http_status: 422

  - priority: 49
    category: cross_entity_state
    applies_to: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/settle"
    rule: "No Dispute with settlement_cycle_id = this cycle may be in status OPEN or COUNTERED. Every dispute must be ACCEPTED or WITHDRAWN before the payer may remit."
    error_id: ERR_OPEN_DISPUTES_BLOCK_SETTLEMENT
    http_status: 409

  - priority: 50
    category: segregation_of_duties
    applies_to: "POST /car-hire/correction-requests/{correction_request_id}/confirm, .../reject"
    rule: "The acting railroad must equal CorrectionRequest.counterparty_road_id. The road that filed a correction can never confirm or reject its own filing."
    error_id: ERR_CORRECTION_CONFIRM_NOT_COUNTERPARTY
    http_status: 403

  - priority: 51
    category: segregation_of_duties
    applies_to: "POST /car-hire/reclaim-claims/{reclaim_claim_id}/allow, .../disallow"
    rule: "The acting railroad must equal ReclaimClaim.against_road_id — the owner road that would fund the credit. The filer cannot decide its own claim. Symmetrically, .../withdraw requires the acting railroad to equal filed_by_road_id."
    error_id: ERR_RECLAIM_DECISION_NOT_OWNER_ROAD
    http_status: 403

  - priority: 52
    category: segregation_of_duties
    applies_to: "POST /car-hire/disputes/{dispute_id}/counter, .../accept, .../withdraw"
    rule: "Whose move it is depends on the state: in OPEN only respondent_road_id may counter or accept and only filed_by_road_id may withdraw; in COUNTERED only filed_by_road_id may counter, accept or withdraw. A party acting out of turn is refused even though it is a party to the cycle."
    error_id: ERR_DISPUTE_TURN_VIOLATION
    http_status: 403

  - priority: 53
    category: business_fiscal
    applies_to: "POST /car-hire/settlement-cycles/{settlement_cycle_id}/compute"
    rule: "After computation, payer_road.per_diem_exposure_cents must not exceed payer_road.per_diem_credit_limit_cents. A compute that would breach the limit is refused and the cycle stays OPEN or REOPENED."
    error_id: ERR_PER_DIEM_CREDIT_LIMIT_EXCEEDED
    http_status: 402

  - priority: 54
    category: business_fiscal
    applies_to: "POST /car-hire/disputes"
    rule: "disputed_amount_cents must be greater than 0 and no greater than the subject's own value at filing: the movement's net_hire_cents, or the repair bill's total_cents."
    error_id: ERR_DISPUTED_AMOUNT_EXCEEDS_SUBJECT
    http_status: 422

  - priority: 55
    category: business_fiscal
    applies_to: "POST /car-hire/disputes/{dispute_id}/counter"
    rule: "counter_amount_cents must be within range for the direction of the move: from OPEN, 0 <= counter_amount_cents <= disputed_amount_cents; from COUNTERED, the standing counter_amount_cents <= the new counter_amount_cents <= disputed_amount_cents."
    error_id: ERR_COUNTER_AMOUNT_OUT_OF_RANGE
    http_status: 422

  - priority: 56
    category: business_fiscal
    applies_to: "POST /car-hire/repair-bills/{repair_bill_id}/counter-bill"
    rule: "Unless reject = true, counter_total_cents must be present and must satisfy 0 < counter_total_cents < the bill's current total_cents. A counter that is absent, zero, negative, or at-or-above the standing total is not a counter-offer. (The labor_hours >= 0 / material_cents >= 0 / not-both-zero bounds on the DRAFT row are declared in Table 1.1 and enforced at priority 6 on POST /car-hire/repair-bills, so submit itself has no amount to re-check.)"
    error_id: ERR_REPAIR_AMOUNT_INVALID
    http_status: 422

# =============================================================================
# Table 1.5: API Endpoints
# Every business path is namespaced under api_prefix /car-hire. The single
# test-driving endpoint lives outside it under the /_ namespace.
# =============================================================================
endpoints:

  # --- test-driving: logical clock -------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Sets the server's logical UTC clock, which is the ONLY source of 'now' for every deadline, window, accrual and expiry rule. Before the first call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time. Time may be moved forward or backward; moving it backward does not undo anything already written."
    roles: [ClearinghouseAdmin]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock is set to current_utc; no business row is touched"
    status_code: 200

  # --- Railroad --------------------------------------------------------------
  - method: POST
    path: /car-hire/railroads
    description: "Registers a railroad in the interchange clearinghouse."
    roles: [ClearinghouseAdmin]
    input: [reporting_mark, name, "status?", "per_diem_credit_limit_cents?"]
    output: Railroad
    side_effects:
      - "creates the Railroad with foreign_car_balance 0, per_diem_exposure_cents 0, owned_car_count 0 and version 1"
    status_code: 201

  - method: GET
    path: /car-hire/railroads/{railroad_id}
    description: "Reads one railroad including its live foreign_car_balance and per_diem_exposure_cents."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: Railroad
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/railroads
    description: "Lists railroads."
    roles: [ClearinghouseAdmin, CarHireAccountant]
    input: ["status?", "reporting_mark?", "limit?", "offset?"]
    output: Railroad[]
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/railroads/{railroad_id}/exposure
    description: "Computed read: per-diem exposure and fleet-utilization figures for one railroad. variant selects SNAPSHOT (default) or PROJECTED per calculations.per_diem_exposure; the utilization block comes from calculations.fleet_utilization."
    roles: [ClearinghouseAdmin, CarHireAccountant, FleetOwner]
    input: ["variant?"]
    output: "{ railroad_id: string, variant_applied: string, exposure_cents: integer, open_movement_count: integer, closed_unsettled_cents: integer, settled_paid_cents: integer, credit_limit_cents: integer, credit_headroom_cents: integer, owned_car_count: integer, on_foreign_count: integer, bad_order_count: integer, serviceable_foreign_count: integer, utilization_pct: number, foreign_car_balance: integer }"
    side_effects: []
    status_code: 200

  # --- CarType ---------------------------------------------------------------
  - method: POST
    path: /car-hire/car-types
    description: "Registers a car type carrying the whole hire rate configuration. Immutable once created (common_fields false, no version, no update endpoint)."
    roles: [ClearinghouseAdmin]
    input: [car_type_code, description, time_component_mode, "free_time_hours?", "per_diem_rate_cents?", "tier2_threshold_days?", "tier2_per_diem_rate_cents?", "hourly_rate_cents?", "mileage_rate_millicents_per_mile?", "loaded_mileage_only?"]
    output: CarType
    side_effects:
      - "creates the immutable CarType rate row"
    status_code: 201

  - method: GET
    path: /car-hire/car-types/{car_type_id}
    description: "Reads one car type and its rate configuration."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: CarType
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/car-types
    description: "Lists car types."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["car_type_code?", "time_component_mode?", "limit?", "offset?"]
    output: CarType[]
    side_effects: []
    status_code: 200

  # --- Junction --------------------------------------------------------------
  - method: POST
    path: /car-hire/junctions
    description: "Registers an interchange point between exactly two railroads."
    roles: [ClearinghouseAdmin]
    input: [junction_code, name, road_a_id, road_b_id, "status?"]
    output: Junction
    side_effects:
      - "creates the Junction; road_a_id and road_b_id must be distinct existing railroads"
    status_code: 201

  - method: GET
    path: /car-hire/junctions/{junction_id}
    description: "Reads one junction."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: Junction
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/junctions
    description: "Lists junctions, optionally restricted to those touching a given road."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["road_a_id?", "road_b_id?", "status?", "junction_code?", "limit?", "offset?"]
    output: Junction[]
    side_effects: []
    status_code: 200

  # --- Car -------------------------------------------------------------------
  - method: POST
    path: /car-hire/cars
    description: "Registers a car into the owner road's fleet. The acting railroad must be owner_road_id."
    roles: [FleetOwner]
    input: [car_mark, car_type_id, owner_road_id, "initial_handling_road_id?"]
    output: Car
    side_effects:
      - "creates the Car at mechanical_status SERVICEABLE, routing_status NO_OBLIGATION and custody_status derived from initial_handling_road_id (default owner_road_id)"
      - "opens the car's first CarHireMovement at start_at = the logical clock now with handling_road_id = current_handling_road_id and hire_liable = (current_handling_road_id != owner_road_id)"
      - "increments owner_road.owned_car_count"
    status_code: 201

  - method: GET
    path: /car-hire/cars/{car_id}
    description: "Reads one car with all three of its parallel status dimensions."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: Car
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/cars
    description: "Lists cars with filters on every dimension and on each foreign key."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["owner_road_id?", "current_handling_road_id?", "car_type_id?", "prescribed_return_junction_id?", "custody_status?", "mechanical_status?", "routing_status?", "car_mark?", "limit?", "offset?"]
    output: Car[]
    side_effects: []
    status_code: 200

  - method: POST
    path: /car-hire/cars/{car_id}/bad-order-report
    description: "The holding road reports the car mechanically defective. Drives the mechanical dimension SERVICEABLE -> BAD_ORDER and stamps the open hire segment so the time can later be reclaimed."
    roles: [InterchangeClerk]
    input: [reported_at, defect_code, "defect_note?"]
    output: Car
    side_effects:
      - "Car.mechanical_status := BAD_ORDER; Car.bad_order_since := reported_at; Car.version is incremented"
      - "the car's OPEN CarHireMovement is stamped bad_order_from := reported_at, bad_order_to := null, and its version is incremented"
    status_code: 200

  - method: POST
    path: /car-hire/cars/{car_id}/release-to-service
    description: "The holding road returns the car to service from BAD_ORDER or UNDER_REPAIR and closes the open bad-order stamp."
    roles: [InterchangeClerk]
    input: [released_at, "release_note?"]
    output: Car
    side_effects:
      - "Car.mechanical_status := SERVICEABLE; bad_order_since := null; bad_order_cleared_at := released_at; version is incremented"
      - "the movement carrying an open bad-order stamp is stamped bad_order_to := released_at and its version is incremented"
    status_code: 200

  - method: POST
    path: /car-hire/cars/{car_id}/empty-routing-obligation
    description: "The owner road prescribes where and by when the empty car must be returned. Drives the routing dimension to OBLIGATION_ACTIVE; a car already OBLIGATION_MET can be re-obligated."
    roles: [FleetOwner]
    input: [prescribed_return_junction_id, issued_at, due_at]
    output: Car
    side_effects:
      - "Car.routing_status := OBLIGATION_ACTIVE; prescribed_return_junction_id, obligation_issued_at and obligation_due_at are set; version is incremented"
      - "the custody and mechanical dimensions are not read and not written"
    status_code: 200

  # --- InterchangeEvent ------------------------------------------------------
  - method: POST
    path: /car-hire/interchange-events
    description: "Captures an interchange event at a junction. This is the append-only spine of the whole system: an INTERCHANGE_DELIVERY closes the delivering road's hire segment and opens the receiving road's, while an INTERCHANGE_REJECTION leaves custody alone and bad-orders the car. The acting railroad must be the delivering or the receiving road."
    roles: [InterchangeClerk]
    input: [car_id, junction_id, event_type, delivering_road_id, receiving_road_id, interchange_at, odometer_miles, load_status]
    output: InterchangeEvent
    side_effects:
      - "creates the immutable InterchangeEvent at status RECORDED with source CLERK_CAPTURE and recorded_by_road_id = the acting railroad"
      - "for INTERCHANGE_DELIVERY: closes the car's OPEN CarHireMovement (computing chargeable_hours, chargeable_days, time_component_cents, mileage_component_cents, gross_hire_cents, net_hire_cents and adjusted_net_hire_cents), mints the receiving road's new OPEN movement, updates Car.current_handling_road_id and custody_status, and increments Car.version"
      - "for INTERCHANGE_DELIVERY with load_status EMPTY on a car at OBLIGATION_ACTIVE: evaluates the reverse-route rule, moving the routing dimension to OBLIGATION_MET or to OBLIGATION_VIOLATED; a violation charges reverse_route_penalty_cents on the just-closed movement, sets its reclaim_locked = true and cascades into any cycle already holding that movement"
      - "for INTERCHANGE_REJECTION: moves the mechanical dimension to BAD_ORDER, stamps bad_order_from on the delivering road's OPEN movement and changes no custody"
      - "refreshes both railroads' per_diem_exposure_cents, foreign_car_balance and the owner's owned-fleet counters"
    status_code: 201

  - method: GET
    path: /car-hire/interchange-events/{interchange_event_id}
    description: "Reads one interchange event, including its status (RECORDED, SUPERSEDED or VOID) and corrects_event_id chain link."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: InterchangeEvent
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/interchange-events
    description: "Lists interchange events in interchange_at ASC order (ties by created_at ASC), with a filter for every foreign key so a correction chain can be walked forwards and backwards."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["car_id?", "junction_id?", "delivering_road_id?", "receiving_road_id?", "recorded_by_road_id?", "corrects_event_id?", "event_type?", "status?", "source?", "interchange_at_from?", "interchange_at_to?", "limit?", "offset?"]
    output: InterchangeEvent[]
    side_effects: []
    status_code: 200

  # --- CarHireMovement (system-created; read-only surface) -------------------
  - method: GET
    path: /car-hire/hire-movements/{movement_id}
    description: "Reads one hire segment with its full money breakdown and its version, which is the OCC token required to file a reclaim against it."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: CarHireMovement
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/hire-movements
    description: "Lists hire segments in end_at ASC order (OPEN segments last, ordered by start_at ASC, ties by created_at ASC), filterable by every foreign key and by the settlement window."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["car_id?", "handling_road_id?", "owner_road_id?", "received_event_id?", "delivered_event_id?", "settlement_cycle_id?", "status?", "hire_liable?", "reclaim_locked?", "end_at_from?", "end_at_to?", "limit?", "offset?"]
    output: CarHireMovement[]
    side_effects: []
    status_code: 200

  # --- ReclaimClaim ----------------------------------------------------------
  - method: POST
    path: /car-hire/reclaim-claims
    description: "The handling road files a reclaim against a CLOSED hire segment, asking the owner road to credit the time the car was unusable. expected_movement_version is the OCC token read from the segment; the claim window is half-open [window_from, window_to)."
    roles: [CarHireAccountant]
    input: [movement_id, reason, window_from, window_to, expected_movement_version, "supporting_embargo_id?", "detention_notified_at?", "filing_note?"]
    output: ReclaimClaim
    side_effects:
      - "creates the ReclaimClaim at status FILED with filed_by_road_id = movement.handling_road_id, against_road_id = movement.owner_road_id and claimed_hours per calculations.reclaim_credit_amount step 1"
      - "increments CarHireMovement.version by 1"
    status_code: 201

  - method: GET
    path: /car-hire/reclaim-claims/{reclaim_claim_id}
    description: "Reads one reclaim claim with its decision fields."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: ReclaimClaim
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/reclaim-claims
    description: "Lists reclaim claims in window_from ASC order (ties by created_at ASC), which is exactly the waterfall order of calculations.reclaim_credit_allocation."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["movement_id?", "filed_by_road_id?", "against_road_id?", "supporting_embargo_id?", "reason?", "status?", "limit?", "offset?"]
    output: ReclaimClaim[]
    side_effects: []
    status_code: 200

  - method: POST
    path: /car-hire/reclaim-claims/{reclaim_claim_id}/allow
    description: "The owner road allows the claim, in full or for fewer hours than claimed. Segregation of duties: only against_road_id may call this."
    roles: [CarHireAccountant]
    input: ["allowed_hours?", "decision_note?"]
    output: ReclaimClaim
    side_effects:
      - "ReclaimClaim.status := ALLOWED; allowed_hours, split_pct_applied and credit_cents per calculations.reclaim_credit_amount; decided_at := the logical clock now"
      - "re-derives the parent movement's reclaim_credit_cents, net_hire_cents and adjusted_net_hire_cents per calculations.reclaim_credit_allocation and increments its version"
      - "when the movement is already stamped into a cycle: mints a RECLAIM_CREDIT HireLedgerEntry, recomputes the cycle per calculations.settlement_statement (a SETTLED cycle first transitions to REOPENED) and refreshes both railroads' derived money fields"
    status_code: 200

  - method: POST
    path: /car-hire/reclaim-claims/{reclaim_claim_id}/disallow
    description: "The owner road refuses the claim. No money moves."
    roles: [CarHireAccountant]
    input: [disallow_reason]
    output: ReclaimClaim
    side_effects:
      - "ReclaimClaim.status := DISALLOWED; disallow_reason and decided_at are set; credit_cents stays 0 and no ledger entry is minted"
    status_code: 200

  - method: POST
    path: /car-hire/reclaim-claims/{reclaim_claim_id}/withdraw
    description: "The filing road withdraws its own claim, from FILED or from ALLOWED. Withdrawing an ALLOWED claim is the compensating transaction that must restore every derived figure exactly."
    roles: [CarHireAccountant]
    input: [withdraw_reason]
    output: ReclaimClaim
    side_effects:
      - "ReclaimClaim.status := WITHDRAWN; credit_cents := 0; withdraw_reason and decided_at are set"
      - "re-runs calculations.reclaim_credit_allocation on the parent movement and increments its version"
      - "when a credit had reached a cycle: mints a RECLAIM_REVERSAL HireLedgerEntry of the exact amount removed and recomputes the cycle, restoring pre_fee_net_cents and clearinghouse_fee_cents to their pre-allow values"
    status_code: 200

  # --- EmbargoOrder ----------------------------------------------------------
  - method: POST
    path: /car-hire/embargo-orders
    description: "A road embargoes a car type at a junction for a closed interval [effective_from, effective_to]. An embargo is the evidence a reclaim of reason EMBARGO must cite."
    roles: [InterchangeClerk]
    input: [issuing_road_id, junction_id, car_type_id, effective_from, effective_to, reason]
    output: EmbargoOrder
    side_effects:
      - "creates the EmbargoOrder at status ACTIVE"
    status_code: 201

  - method: GET
    path: /car-hire/embargo-orders/{embargo_order_id}
    description: "Reads one embargo order."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: EmbargoOrder
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/embargo-orders
    description: "Lists embargo orders in effective_from ASC order (ties by created_at ASC)."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["issuing_road_id?", "junction_id?", "car_type_id?", "status?", "effective_from_from?", "effective_to_to?", "limit?", "offset?"]
    output: EmbargoOrder[]
    side_effects: []
    status_code: 200

  - method: POST
    path: /car-hire/embargo-orders/{embargo_order_id}/lift
    description: "The issuing road lifts its embargo early. Coverage for reclaim purposes shrinks to [effective_from, min(effective_to, lifted_at)]."
    roles: [InterchangeClerk]
    input: [lifted_at]
    output: EmbargoOrder
    side_effects:
      - "EmbargoOrder.status := LIFTED; lifted_at is set; already-ALLOWED reclaims are not disturbed"
    status_code: 200

  # --- RepairBill ------------------------------------------------------------
  - method: POST
    path: /car-hire/repair-bills
    description: "The repairing road drafts a repair bill against a bad-ordered car under industry rules. Responsibility is not decided here — it is computed at submit."
    roles: [RepairBillingAgent]
    input: [car_id, billing_road_id, defect_code, defect_class, defect_occurred_at, labor_hours, material_cents, "discovery_event_id?", "pre_authorization_reference?"]
    output: RepairBill
    side_effects:
      - "creates the RepairBill at status DRAFT with responsible_road_id, labor_cents, subtotal_cents, handling_fee_cents and total_cents all null"
    status_code: 201

  - method: GET
    path: /car-hire/repair-bills/{repair_bill_id}
    description: "Reads one repair bill including responsible_road_id and responsibility_rule_applied once submitted."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: RepairBill
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/repair-bills
    description: "Lists repair bills in created_at ASC order."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["car_id?", "discovery_event_id?", "billing_road_id?", "responsible_road_id?", "settlement_cycle_id?", "status?", "defect_class?", "limit?", "offset?"]
    output: RepairBill[]
    side_effects: []
    status_code: 200

  - method: POST
    path: /car-hire/repair-bills/{repair_bill_id}/submit
    description: "Issues the bill to the responsible road. This is where calculations.repair_responsibility_determination picks the variant from defect_class and where calculations.repair_bill_amount prices the bill."
    roles: [RepairBillingAgent]
    input: []
    output: RepairBill
    side_effects:
      - "responsible_road_id and responsibility_rule_applied per calculations.repair_responsibility_determination"
      - "labor_cents, subtotal_cents, handling_fee_cents and total_cents per calculations.repair_bill_amount"
      - "RepairBill.status := SUBMITTED; submitted_at := the logical clock now; Car.mechanical_status BAD_ORDER -> UNDER_REPAIR"
    status_code: 200

  - method: POST
    path: /car-hire/repair-bills/{repair_bill_id}/counter-bill
    description: "The responsible road disputes the amount at the bill level. Supplying counter_total_cents keeps the bill SUBMITTED and increments counter_bill_round (self-loop); supplying reject = true ends the negotiation at REJECTED."
    roles: [RepairBillingAgent]
    input: ["counter_total_cents?", "reject?", "counter_note?"]
    output: RepairBill
    side_effects:
      - "with counter_total_cents: total_cents := counter_total_cents; counter_bill_round := counter_bill_round + 1; last_counter_at := the logical clock now; status stays SUBMITTED"
      - "with reject = true: status := REJECTED; rejected_at is set; the car stays UNDER_REPAIR"
    status_code: 200

  - method: POST
    path: /car-hire/repair-bills/{repair_bill_id}/accept
    description: "The responsible road accepts the bill at its current total."
    roles: [RepairBillingAgent]
    input: []
    output: RepairBill
    side_effects:
      - "RepairBill.status := ACCEPTED; accepted_at := the logical clock now"
      - "mints a REPAIR_CHARGE HireLedgerEntry of total_cents debiting responsible_road_id and crediting billing_road_id"
    status_code: 200

  - method: POST
    path: /car-hire/repair-bills/{repair_bill_id}/settle
    description: "The clearinghouse settles the accepted bill and returns the car to service."
    roles: [ClearinghouseAdmin]
    input: []
    output: RepairBill
    side_effects:
      - "RepairBill.status := SETTLED; settled_at := the logical clock now"
      - "Car.mechanical_status UNDER_REPAIR -> SERVICEABLE, bad_order_since := null, bad_order_cleared_at := now, and the open bad-order stamp on the car's current movement is closed"
    status_code: 200

  # --- SettlementCycle -------------------------------------------------------
  - method: POST
    path: /car-hire/settlement-cycles
    description: "Opens a monthly reconciliation cycle between one payer road and one payee road. period_start_at and period_end_at are derived from period_month."
    roles: [CarHireAccountant]
    input: [payer_road_id, payee_road_id, period_month]
    output: SettlementCycle
    side_effects:
      - "creates the SettlementCycle at status OPEN with every money field 0 and version 1"
    status_code: 201

  - method: GET
    path: /car-hire/settlement-cycles/{settlement_cycle_id}
    description: "Reads one cycle with its money fields and its version, which is the OCC token required to file a dispute against it."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: SettlementCycle
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/settlement-cycles
    description: "Lists settlement cycles in period_month ASC order (ties by created_at ASC)."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["payer_road_id?", "payee_road_id?", "period_month?", "status?", "limit?", "offset?"]
    output: SettlementCycle[]
    side_effects: []
    status_code: 200

  - method: POST
    path: /car-hire/settlement-cycles/{settlement_cycle_id}/compute
    description: "The payee road computes (or recomputes) the statement per calculations.settlement_statement. Legal from OPEN and from REOPENED; refused before period_end_at."
    roles: [CarHireAccountant]
    input: ["variant?"]
    output: SettlementCycle
    side_effects:
      - "stamps every qualifying CLOSED movement and ACCEPTED repair bill with settlement_cycle_id and mints their HIRE_CHARGE and REPAIR_CHARGE ledger entries (already-stamped members are re-read, not re-stamped)"
      - "sets gross_hire_cents, reclaim_credit_cents, penalty_cents, repair_charge_cents, dispute_adjustment_cents, pre_fee_net_cents, clearinghouse_fee_cents, net_settlement_cents, movement_line_count, variant_applied, as_reported_net_cents and reconciled_net_cents"
      - "status := COMPUTED; computed_at := the logical clock now; version is incremented"
      - "refuses with ERR_PER_DIEM_CREDIT_LIMIT_EXCEEDED when the result would push the payer past its credit limit"
    status_code: 200

  - method: POST
    path: /car-hire/settlement-cycles/{settlement_cycle_id}/exchange
    description: "The payee road serves the computed statement on the payer road, opening the dispute window."
    roles: [CarHireAccountant]
    input: []
    output: SettlementCycle
    side_effects:
      - "status := EXCHANGED; exchanged_at := the logical clock now; dispute_deadline_at := exchanged_at + DISPUTE_WINDOW_DAYS days; version is incremented"
    status_code: 200

  - method: POST
    path: /car-hire/settlement-cycles/{settlement_cycle_id}/settle
    description: "The payer road remits and closes the cycle. Blocked while any dispute on the cycle is still OPEN or COUNTERED."
    roles: [CarHireAccountant]
    input: []
    output: SettlementCycle
    side_effects:
      - "status := SETTLED; settled_at := the logical clock now; reopen_deadline_at := settled_at + REOPEN_WINDOW_DAYS days; version is incremented"
      - "mints a SETTLEMENT_PAYMENT HireLedgerEntry of -net_settlement_cents and reduces payer_road.per_diem_exposure_cents by net_settlement_cents"
    status_code: 200

  - method: POST
    path: /car-hire/settlement-cycles/{settlement_cycle_id}/reopen
    description: "The clearinghouse reopens a settled cycle inside the reopen window so it can be recomputed. This is the loop edge of the cycle's state machine."
    roles: [ClearinghouseAdmin]
    input: [reopen_reason]
    output: SettlementCycle
    side_effects:
      - "status := REOPENED; reopened_at := the logical clock now; reopen_count := reopen_count + 1; version is incremented"
      - "reverses the SETTLEMENT_PAYMENT entry with a CORRECTION_ADJUSTMENT entry of the opposite amount and restores payer_road.per_diem_exposure_cents"
    status_code: 200

  - method: POST
    path: /car-hire/settlement-cycles/{settlement_cycle_id}/archive
    description: "The clearinghouse freezes a settled cycle once its reopen window has fully elapsed. Everything stamped into the cycle becomes immutable."
    roles: [ClearinghouseAdmin]
    input: []
    output: SettlementCycle
    side_effects:
      - "status := ARCHIVED; archived_at := the logical clock now; version is incremented"
      - "every later write touching a member movement, reclaim, repair bill or ledger entry is refused with ERR_CYCLE_ARCHIVED_IMMUTABLE"
    status_code: 200

  - method: GET
    path: /car-hire/settlement-cycles/{settlement_cycle_id}/statement
    description: "Computed read: the reconciliation statement. variant selects AS_REPORTED (default) or RECONCILED per calculations.settlement_statement without mutating the cycle, so the two variants can be compared side by side."
    roles: [ClearinghouseAdmin, CarHireAccountant]
    input: ["variant?"]
    output: "{ settlement_cycle_id: string, variant_applied: string, payer_road_id: string, payee_road_id: string, period_month: string, movement_line_count: integer, gross_hire_cents: integer, reclaim_credit_cents: integer, penalty_cents: integer, repair_charge_cents: integer, dispute_adjustment_cents: integer, pre_fee_net_cents: integer, clearinghouse_fee_cents: integer, net_settlement_cents: integer, included_movement_ids: string[], included_repair_bill_ids: string[] }"
    side_effects: []
    status_code: 200

  # --- Dispute ---------------------------------------------------------------
  - method: POST
    path: /car-hire/disputes
    description: "The payer road disputes one line of an exchanged statement — either a hire segment or a repair bill, never both. expected_cycle_version is the OCC token read from the cycle."
    roles: [CarHireAccountant]
    input: [settlement_cycle_id, dispute_reason, disputed_amount_cents, expected_cycle_version, "movement_id?", "repair_bill_id?", "filing_note?"]
    output: Dispute
    side_effects:
      - "creates the Dispute at status OPEN with round_number 0, filed_by_road_id = cycle.payer_road_id, respondent_road_id = cycle.payee_road_id and subject_net_at_filing_cents snapshotted from the subject"
      - "increments SettlementCycle.version by 1"
    status_code: 201

  - method: GET
    path: /car-hire/disputes/{dispute_id}
    description: "Reads one dispute, whose status also encodes whose turn it is: OPEN means the respondent moves next, COUNTERED means the filer does."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: Dispute
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/disputes
    description: "Lists disputes in created_at ASC order."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["settlement_cycle_id?", "movement_id?", "repair_bill_id?", "filed_by_road_id?", "respondent_road_id?", "status?", "dispute_reason?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
    status_code: 200

  - method: POST
    path: /car-hire/disputes/{dispute_id}/counter
    description: "Makes the next move in the negotiation. Legal only for the party whose turn the current state names, and only while round_number is below MAX_DISPUTE_ROUNDS."
    roles: [CarHireAccountant]
    input: [counter_amount_cents, "counter_note?"]
    output: Dispute
    side_effects:
      - "status flips OPEN -> COUNTERED or COUNTERED -> OPEN; round_number := round_number + 1; counter_amount_cents := the supplied value; last_action_at := the logical clock now; version is incremented"
    status_code: 200

  - method: POST
    path: /car-hire/disputes/{dispute_id}/accept
    description: "The party whose turn it is accepts the standing amount, ending the negotiation and moving money."
    roles: [CarHireAccountant]
    input: []
    output: Dispute
    side_effects:
      - "status := ACCEPTED; resolution_amount_cents := counter_amount_cents when a counter stands, else disputed_amount_cents; resolved_at := the logical clock now"
      - "sets the subject movement's adjusted_net_hire_cents := net_hire_cents - resolution_amount_cents, mints a DISPUTE_ADJUSTMENT HireLedgerEntry of -resolution_amount_cents and recomputes the cycle under variant RECONCILED"
    status_code: 200

  - method: POST
    path: /car-hire/disputes/{dispute_id}/withdraw
    description: "The filer abandons the dispute. No money moves and the statement stands AS_REPORTED."
    roles: [CarHireAccountant]
    input: [withdraw_reason]
    output: Dispute
    side_effects:
      - "status := WITHDRAWN; resolution_amount_cents := 0; resolved_at := the logical clock now; no ledger entry is minted"
    status_code: 200

  # --- CorrectionRequest -----------------------------------------------------
  - method: POST
    path: /car-hire/correction-requests
    description: "Files a data-quality correction against the interchange log: MISSED_EVENT_INSERT reconstructs a handoff nobody recorded, TIMESTAMP_AMEND moves a recorded instant, ERRONEOUS_EVENT_VOID erases a rejection that never happened. Filing does nothing on its own; the counterparty road must confirm and then it must be applied."
    roles: [InterchangeClerk]
    input: [car_id, junction_id, counterparty_road_id, correction_type, "target_event_id?", "direction?", "proposed_interchange_at?", "proposed_odometer_miles?", "proposed_load_status?", "filing_note?"]
    output: CorrectionRequest
    side_effects:
      - "creates the CorrectionRequest at status FILED with filed_by_road_id = the acting railroad and confirm_deadline_at := created_at + CORRECTION_CONFIRM_WINDOW_HOURS hours"
    status_code: 201

  - method: GET
    path: /car-hire/correction-requests/{correction_request_id}
    description: "Reads one correction request, including resulting_event_id once applied."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: []
    output: CorrectionRequest
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/correction-requests
    description: "Lists correction requests in created_at ASC order."
    roles: [ClearinghouseAdmin, InterchangeClerk, CarHireAccountant, RepairBillingAgent, FleetOwner]
    input: ["car_id?", "junction_id?", "filed_by_road_id?", "counterparty_road_id?", "target_event_id?", "resulting_event_id?", "correction_type?", "status?", "limit?", "offset?"]
    output: CorrectionRequest[]
    side_effects: []
    status_code: 200

  - method: POST
    path: /car-hire/correction-requests/{correction_request_id}/confirm
    description: "The counterparty road at the junction agrees the log was wrong. Only counterparty_road_id may call this, and only inside the confirm window."
    roles: [InterchangeClerk]
    input: ["confirm_note?"]
    output: CorrectionRequest
    side_effects:
      - "status := CONFIRMED; confirmed_at := the logical clock now"
    status_code: 200

  - method: POST
    path: /car-hire/correction-requests/{correction_request_id}/reject
    description: "The counterparty road refuses the correction. The log stands as captured."
    roles: [InterchangeClerk]
    input: [rejection_reason]
    output: CorrectionRequest
    side_effects:
      - "status := REJECTED; rejection_reason and rejected_at are set"
    status_code: 200

  - method: POST
    path: /car-hire/correction-requests/{correction_request_id}/apply
    description: "Applies a confirmed correction. This is the deepest cascade in the system: it rewrites the event log, then the movement boundaries, then the movement money, then any reclaim whose evidence disappeared, then the ledger and the affected cycles, then both railroads' derived balances."
    roles: [InterchangeClerk, ClearinghouseAdmin]
    input: []
    output: CorrectionRequest
    side_effects:
      - "L1 event log: mints, supersedes or voids the target InterchangeEvent and records resulting_event_id"
      - "L2 movement boundaries: re-derives start_at/end_at from the surviving RECORDED events, voids zero-length segments and clears bad_order_from/bad_order_to erased by a void"
      - "L3 movement money: recomputes chargeable_hours, time_component_cents, mileage_component_cents, gross_hire_cents and net_hire_cents on every affected segment and increments each version"
      - "L4 reclaims: any ALLOWED ReclaimClaim whose supporting stamp disappeared becomes DISALLOWED with disallow_reason SUPPORTING_EVENT_VOIDED and its credit is removed"
      - "L5 ledger and cycles: mints CORRECTION_ADJUSTMENT entries for the deltas, recomputes each affected SettlementCycle (transitioning SETTLED -> REOPENED first) and refreshes per_diem_exposure_cents and foreign_car_balance on both roads"
      - "status := APPLIED; applied_at := the logical clock now"
    status_code: 200

  - method: POST
    path: /car-hire/correction-requests/expire-due
    description: "Sweep: expires every FILED correction request whose confirm window has elapsed, processed in created_at ASC order. Idempotent — a second call with no newly due requests expires 0."
    roles: [ClearinghouseAdmin]
    input: []
    output: "{ expired_count: integer, expired_correction_request_ids: string[], evaluated_at: string }"
    side_effects:
      - "each due request moves FILED -> EXPIRED with expired_at := the logical clock now; requests already CONFIRMED, APPLIED, REJECTED or EXPIRED are untouched"
    status_code: 200

  # --- HireLedgerEntry (append-only, read-only surface) ----------------------
  - method: GET
    path: /car-hire/ledger-entries/{hire_ledger_entry_id}
    description: "Reads one immutable ledger entry."
    roles: [ClearinghouseAdmin, CarHireAccountant]
    input: []
    output: HireLedgerEntry
    side_effects: []
    status_code: 200

  - method: GET
    path: /car-hire/ledger-entries
    description: "Lists ledger entries in effective_at ASC order (ties by created_at ASC), filterable by every foreign key. This is the audit surface on which the money-conservation invariant is checked."
    roles: [ClearinghouseAdmin, CarHireAccountant]
    input: ["settlement_cycle_id?", "movement_id?", "repair_bill_id?", "reclaim_claim_id?", "dispute_id?", "debit_road_id?", "credit_road_id?", "entry_type?", "effective_at_from?", "effective_at_to?", "limit?", "offset?"]
    output: HireLedgerEntry[]
    side_effects: []
    status_code: 200

