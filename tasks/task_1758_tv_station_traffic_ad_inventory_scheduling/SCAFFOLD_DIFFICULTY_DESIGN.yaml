            - call: "POST /traffic/spots/${mg18_id}/place"
              payload: { avail_unit_id: "${unit18c_id}", expected_avail_unit_version: "${unit18c_v0}" }
              as: TrafficManager
          assert:
            - "before preempt: U18a.booked_commercial_seconds == 30, U18c == 0, week total == 30"
            - "after preempt alone: U18a.booked_commercial_seconds == 0, week total == 0 (forward action decrements)"
            - "after make-good placement: U18c.booked_commercial_seconds == 30, week total == 30 == pre-preempt total — the compensating pair conserves week booked seconds"
            - "Spot.${spot18_id}.status == PREEMPTED; Spot.${mg18_id}.status == SCHEDULED"
