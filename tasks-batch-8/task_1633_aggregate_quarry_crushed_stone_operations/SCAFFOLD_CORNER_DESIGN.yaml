# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Aggregate Quarry & Crushed-Stone Operations
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# §1.8-covered corners appear as excluded_because stubs. Default logical
# clock: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section 1: Entities (creation, defaults, computed/system fields, enums,
  # required fields, not-found, FK integrity, uniqueness, computed reads)
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: site_create_computed_defaults
        claim_type: creation_defaults
        grounds: [entities.QuarrySite.fields.posture, entities.QuarrySite.fields.bond_adequacy]
        distinguishing_aspect: "A freshly created site starts OPERATING with zeroed acreage/bond aggregates and ADEQUATE coverage (no disturbance yet)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
          assert:
            - "QuarrySite.${site}.posture == OPERATING and bond_adequacy == ADEQUATE"
            - "disturbed_acres == 0, bond_required_usd == 0, bond_posted_usd == 0, version == 1"

      - name: site_create_posture_input_ignored
        claim_type: computed_field_input_ignored
        grounds: [entities.QuarrySite.fields.posture]
        distinguishing_aspect: "Client-supplied posture in the create body is ignored; the computed value OPERATING is returned."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000, posture: "SUSPENDED" }, as: QuarryAdmin, captures: { site: $.data.id } }
          assert:
            - "QuarrySite.${site}.posture == OPERATING (client input ignored)"
            - "QuarrySite.${site}.id is a server-minted UUID with no type prefix"

      - name: bench_get_unknown_id_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent bench id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /benches/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_NOT_FOUND (http 404)"

      - name: bench_create_missing_required_acreage_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Bench.fields.acreage, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field acreage yields 400 ERR_INVALID_REQUEST before any state or FK logic."
        test_recipe:
          setup: ["one site"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
          trigger:
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400 }, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_INVALID_REQUEST (http 400)"

      - name: spec_create_invalid_enum_category_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ProductSpec.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category 'BOULDER' is outside the declared enum {COARSE, FINE, RIPRAP} and is rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /product-specs", payload: { spec_code: "X-1", category: "BOULDER", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_INVALID_REQUEST (http 400)"

      - name: bench_create_unknown_site_fk_returns_not_found
        claim_type: parent_relationship_fk_integrity
        grounds: [entities.Bench.fields.site_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body FK that does not resolve is a 404 existence failure, not a 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /benches", payload: { site_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_NOT_FOUND (http 404)"

      - name: muckpile_auto_created_and_reverse_discoverable
        claim_type: creation_via_cascade
        grounds: [state_machines.ShotPlan.LOADED_to_FIRED, entities.Muckpile.fields.shot_plan_id]
        distinguishing_aspect: "Firing creates the muckpile (no POST /muckpiles exists); it is discoverable only via GET /muckpiles?shot_plan_id with design tonnage copied."
        test_recipe:
          setup:
            - "Site OPERATING (bond 100000); bench RELEASED; plan FIRED at clock 2026-08-01T10:00:00Z with current TASK_TRAINING"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "BENCH-1400", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /training-records", payload: { miner_name: "Blaster One", miner_user_id: "bf-1", course_type: "TASK_TRAINING", completed_on: "2026-01-15" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /shot-plans/${plan}/start-drilling", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/complete-drilling", payload: { drilled_hole_count: 20 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/load", payload: { loaded_explosive_lbs: 1000 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/fire", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
          trigger:
            - { call: "GET /muckpiles", payload: { shot_plan_id: "${plan}" }, as: SiteManager, as_user_id: "sm-1", captures: { mp: "$.data[0].id" } }
          assert:
            - "GET /muckpiles?shot_plan_id=${plan} returns exactly 1 item"
            - "Muckpile.${mp}.estimated_tons == 3792.6 and remaining_tons == 3792.6 and status == OPEN"

      - name: stockpile_unique_per_site_spec_rejected
        claim_type: uniqueness_constraint
        grounds: [entities.Stockpile.fields.site_id, "errors[ERR_STOCKPILE_EXISTS]"]
        distinguishing_aspect: "A second stockpile for the same (site_id, product_spec_id) pair is rejected; a different spec at the same site is fine."
        test_recipe:
          setup: ["site; two specs; one existing stockpile for spec A"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { specA: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "FINE-1", category: "FINE", gradation_bands: [ { sieve: "No4", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 9.00 }, as: QuarryAdmin, captures: { specB: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${specA}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id } }
          trigger:
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${specA}", capacity_tons: 3000 }, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${specB}", capacity_tons: 3000 }, as: SiteManager, captures: { pileB: $.data.id } }
          assert:
            - "duplicate (site, specA) rejected with ERR_STOCKPILE_EXISTS (http 409)"
            - "(site, specB) succeeds — uniqueness is scoped to the pair"

      - name: training_record_expiry_computed
        claim_type: computed_fields
        grounds: [entities.TrainingRecord.fields.expires_on, calculations.training_currency]
        distinguishing_aspect: "expires_on is computed as completed_on + 12 months and is_current compares it against the logical clock (inclusive)."
        test_recipe:
          setup: ["empty DB; default clock 2026-08-01"]
          setup_api_calls: []
          trigger:
            - { call: "POST /training-records", payload: { miner_name: "Blaster One", miner_user_id: "bf-1", course_type: "TASK_TRAINING", completed_on: "2025-08-01" }, as: SafetyOfficer, as_user_id: "so-1", captures: { tr: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: QuarryAdmin }
            - { call: "GET /training-records/${tr}", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
          assert:
            - "TrainingRecord.${tr}.expires_on == 2026-08-01 (completed_on + 12 months)"
            - "at clock 2026-08-01 is_current == true (inclusive boundary); after advancing to 2026-08-02 is_current == false"

      - name: gradation_result_computed_at_create
        claim_type: computed_fields
        grounds: [entities.GradationTest.fields.result, calculations.gradation_result]
        distinguishing_aspect: "result is computed at creation from the spec bands and is immutable through REPORTED; out-of-band measurements yield FAIL before any confirm."
        test_recipe:
          setup: ["site; spec A57 band 1.5in [90,100]; stockpile"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id } }
          trigger:
            - { call: "POST /gradation-tests", payload: { stockpile_id: "${pile}", sampled_at: "2026-08-01T06:00:00Z", sieve_results: [ { sieve: "1.5in", pct_passing: 95 } ] }, as: QCTechnician, as_user_id: "qc-1", captures: { t1: $.data.id } }
            - { call: "POST /gradation-tests", payload: { stockpile_id: "${pile}", sampled_at: "2026-08-01T07:00:00Z", sieve_results: [ { sieve: "1.5in", pct_passing: 85 } ] }, as: QCTechnician, as_user_id: "qc-1", captures: { t2: $.data.id } }
          assert:
            - "GradationTest.${t1}.result == PASS and status == REPORTED (result known pre-confirm)"
            - "GradationTest.${t2}.result == FAIL (85 < min_pct 90)"

  # ---------------------------------------------------------------------------
  # Section 2: State Machines (initial states, invalid-from rejection,
  # terminal lockdown, auto-transitions, side-effect execution, guards)
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: entities_initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.Bench, state_machines.ShotPlan, state_machines.SalesOrder, state_machines.TruckQueueEntry]
        distinguishing_aspect: "Bench starts PLANNED, ShotPlan DRAFT, SalesOrder QUOTED (prices_pinned false), TruckQueueEntry QUEUED — verified from create responses."
        test_recipe:
          setup: ["site; spec; zone"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
          trigger:
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 30 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe: $.data.id } }
          assert:
            - "Bench.${bench}.status == PLANNED; ShotPlan.${plan}.status == DRAFT"
            - "SalesOrder.${ord}.status == QUOTED and prices_pinned == false and fulfilled_tons == 0"
            - "TruckQueueEntry.${qe}.status == QUEUED and scale_ticket_id == null"

      - name: shotplan_fire_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShotPlan, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FIRE from DRAFT skips four states; the machine rejects with ERR_INVALID_STATE and no muckpile is created."
        test_recipe:
          setup: ["site; bench (unreleased is fine — state check on the plan fires first)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
          trigger:
            - { call: "POST /shot-plans/${plan}/fire", payload: {}, as: BlastForeman, as_user_id: "bf-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_INVALID_STATE (http 409)"
            - "ShotPlan.${plan}.status stays DRAFT; GET /muckpiles?shot_plan_id=${plan} returns 0 items"

      - name: ticket_weighout_requires_entry_at_scale_out
        claim_type: guarded_transition
        grounds: [state_machines.ScaleTicket.OPEN_to_COMPLETED, state_machines.TruckQueueEntry.LOADING_to_AT_SCALE_OUT]
        distinguishing_aspect: "Weigh-out is guarded by the linked queue entry's state: from LOADING (begin-scale-out never called) it fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "full ticketing chain through weigh-in (ticket OPEN, entry LOADING); begin-scale-out intentionally skipped"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 200.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 100 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt: $.data.id } }
          trigger:
            - { call: "POST /scale-tickets/${tkt}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_INVALID_STATE (http 409) — entry is LOADING, not AT_SCALE_OUT"
            - "ScaleTicket.${tkt}.status stays OPEN"

      - name: terminal_lockdown_reclaimed_bench_cannot_transition
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Bench]
        distinguishing_aspect: "RECLAIMED is terminal: every further transition (/hold shown) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["site OPERATING (bond 200000); bench released -> mined out -> reclamation -> reclaimed"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 200000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /benches/${bench}/mark-mined-out", payload: {}, as: SiteManager }
            - { call: "POST /benches/${bench}/start-reclamation", payload: {}, as: SiteManager }
            - { call: "POST /benches/${bench}/complete-reclamation", payload: {}, as: SiteManager }
          trigger:
            - { call: "POST /benches/${bench}/hold", payload: { reason: "GEOTECH" }, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "Bench.${bench}.status == RECLAIMED before the trigger"
            - "trigger error_id == ERR_INVALID_STATE (http 409); bench stays RECLAIMED"

      - name: terminal_lockdown_voided_ticket_cannot_void_twice
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ScaleTicket]
        distinguishing_aspect: "VOIDED is terminal for tickets: a second /void fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["full ticketing chain; ticket COMPLETED then VOIDED"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 200.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 100 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
