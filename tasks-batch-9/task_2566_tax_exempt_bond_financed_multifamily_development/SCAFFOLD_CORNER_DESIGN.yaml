  - section: errors
    instances:
      - name: missing_role_header_is_unauthenticated_and_a_foreign_sponsor_is_not_the_resource_owner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority=10]
          - validations[priority=30]
          - roles.Developer
          - endpoints[GET /projects/{id}]
          - endpoints[POST /unit-restrictions]
        distinguishing_aspect: |
          Two distinct 4xx families that are easy to conflate. A request with no
          X-User-Role at all is 401 ERR_UNAUTHENTICATED and never reaches the
          project row - it does not become 403 or 404. A request whose role IS
          Developer but whose X-User-ID is a different sponsor is 403
          ERR_NOT_RESOURCE_OWNER rather than ERR_FORBIDDEN_ROLE, because the role
          is in the endpoint's list and only the ownership scope fails. The same
          confinement applies to project creation: filing a project under another
          sponsor's developer_id is refused even though the caller is a legitimate
          Developer.
        test_recipe:
          setup:
            - "Two registered sponsors: Harborview Partners and Sound Ridge Homes."
            - "Harborview owns one four-unit project; Sound Ridge owns nothing."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev1: $.data.id }
            - call: "POST /developers"
              payload: { name: "Sound Ridge Homes", tax_id: "81-1000002", contact_email: "ops@soundridge.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev2: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev1}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev1}"
              captures: { proj1: $.data.id }
          trigger:
            - call: "GET /projects/${proj1}"
              payload: {}
              as: Anonymous
              as_user_id: ""
              captures: { err_auth: $.data.error_id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj1}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev2}"
              captures: { err_owner: $.data.error_id }
            - call: "POST /projects"
              payload: { developer_id: "${dev1}", name: "Poached Filing", total_units: 2, total_floor_space_sqft: 1600, land_cost_cents: 10000000, depreciable_basis_cents: 90000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev2}"
              captures: { err_owner2: $.data.error_id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj1}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev1}"
              captures: { unit_id: $.data.id }
          assert:
            - "the header-less read returns HTTP 401 and captured err_auth == 'ERR_UNAUTHENTICATED' - not 403 and not 404, and the project is never disclosed"
            - "the foreign designation returns HTTP 403 and captured err_owner == 'ERR_NOT_RESOURCE_OWNER' (the role Developer is allowed on the endpoint; only the ownership scope fails)"
            - "the poached filing returns HTTP 403 and captured err_owner2 == 'ERR_NOT_RESOURCE_OWNER'"
            - "Project.${proj1}.designated_unit_count == 1 after the last call: only the owner's designation persisted"
            - "Developer.${dev2}.active_project_count == 0 - no project row was created for the foreign sponsor"
            - "the owner's designation returns HTTP 201 and UnitRestriction.${unit_id}.restricted_rent_cents == 109500"

      - name: bond_lifecycle_errors_cover_replayed_issuance_arbitrage_and_weak_occupancy
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BOND_ISSUE_STATE_INVALID]
          - errors[ERR_NEGATIVE_ARBITRAGE_ALLOWANCE_EXCEEDED]
          - errors[ERR_OCCUPANCY_BELOW_STABILIZATION]
          - validations[priority=113]
          - validations[priority=115]
          - calculations.negative_arbitrage_cost
          - calculations.debt_service_coverage_ratio
        distinguishing_aspect: |
          A wide 800 bps spread (bond 1000 over investment 200) makes the carrying
          cost the binding constraint: a single 181-day draw of the whole par
          accrues 200,000,000 * 800 bps * 181/360 = 8,044,444, more than double the
          4,000,000 allowance, so funding is refused while the draw stays APPROVED
          and undrawn_cents stays at par. A shorter 30-day draw then funds at
          1,333,333 and construction starts. The conversion probe isolates the
          second threshold: coverage passes at 12000 bps but the weakest month has
          only 3 of 4 units occupied - 7500 bps against the 9000 bps floor - so the
          refusal must be ERR_OCCUPANCY_BELOW_STABILIZATION and not the coverage
          error. Replaying the issue trigger on an ISSUED bond covers the third code.
        test_recipe:
          setup:
            - "CF chain through issuance but priced at bond_yield_bps 1000 and investment_yield_bps 200, so the spread is 800 bps; par is still 200,000,000 and the negative-arbitrage allowance 4,000,000."
            - "No draws exist yet and the project is FINANCED."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "202", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /regulatory-agreements"
              payload: { project_id: "${proj_id}", set_aside_election: "MIN_40_60", compliance_period_years: 15, extended_use_years: 30, recording_county: "King" }
              as: Developer
              as_user_id: "${dev_id}"
