            - { call: "GET /spirit-store/vendors/00000000-0000-0000-0000-000000000000", payload: {}, as: Treasurer, captures: { e1: $.data.error_id } }
            - { call: "GET /spirit-store/product-variants/00000000-0000-0000-0000-000000000000", payload: {}, as: Treasurer, captures: { e2: $.data.error_id } }
            - { call: "GET /spirit-store/seasonal-drops/00000000-0000-0000-0000-000000000000", payload: {}, as: Treasurer, captures: { e3: $.data.error_id } }
            - { call: "GET /spirit-store/purchase-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: Treasurer, captures: { e4: $.data.error_id } }
