# =============================================================================
# Task 1910 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x >= 2 instances = 21 instances.
# All arithmetic in assert: lines was executed against the §1.3 formulas.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dock_settlement_provisional_vs_final
        grounds:
          - calculations.dock_line_settlement
          - calculations.yield_processing
          - entities.LandingLine.fields.provisional_amount_cents
          - entities.LandingLine.fields.final_amount_cents
        distinguishing_aspect: |
          Dual-variant settlement on the DockTicket/LandingLine domain: identical landed
          weight (100.00 kg) prices at 120000 cents provisionally (declared GRADE_A quote
          x raw weight, no yield) but 82935 cents finally (assessed GRADE_B quote x
          yield-adjusted 87.30 kg). Paired with freight_provisional_vs_final, which lives
          on the Shipment domain — a different entity domain as §0.5 Rule 1 requires.
        test_recipe:
          setup:
            - "Species COD with PUBLISHED quotes GRADE_A=1200 and GRADE_B=950 cents/kg for 2026-08-01"
            - "Ticket LANDED 2026-08-01T06:00:00Z with one line: 100.00 kg declared GRADE_A"
            - "Assessment finalized: assessed GRADE_B, yield 0.90, processing WHOLE -> processed 87.30 kg"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30, is_import: false, requires_cites: false }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { qa_id: $.data.id } }
            - { call: "POST /market-quotes/${qa_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager, captures: { sp_v2: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_B", quote_date: "2026-08-01", price_per_kg_cents: 950 }, as: OperationsManager, captures: { qb_id: $.data.id } }
            - { call: "POST /market-quotes/${qb_id}/publish", payload: { expected_species_version: "${sp_v2}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 100.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_B", yield_pct: 0.90 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
          trigger:
            - { call: "GET /landing-lines/${l_id}", payload: {}, as: OperationsManager }
            - { call: "GET /dock-tickets/${t_id}", payload: {}, as: OperationsManager }
          assert:
            - "LandingLine.${l_id}.provisional_amount_cents == 120000"
            - "LandingLine.${l_id}.processed_weight_kg == 87.30"
            - "LandingLine.${l_id}.final_amount_cents == 82935"
            - "DockTicket.${t_id}.provisional_total_cents == 120000"
            - "DockTicket.${t_id}.final_total_cents == 82935"
            - "provisional variant (120000) != final variant (82935) for identical landed weight"

      - name: freight_provisional_vs_final
        grounds:
          - calculations.freight_charge
          - entities.Shipment.fields.provisional_freight_cents
          - entities.Shipment.fields.final_freight_cents
          - state_machines.Shipment.QUOTED_to_BOOKED
          - state_machines.Shipment.BOOKED_to_TENDERED
        distinguishing_aspect: |
          Dual-variant freight on the Shipment domain: provisional at BOOKED prices
          chargeable = booked_weight (16.70 kg, no dimensional term) at 11006 cents;
          final at TENDERED reprices chargeable = max(actual 12.00, dimensional 8.35)
          = 12.00 kg at 9901 cents. Entity domain (Shipment logistics) differs from
          dock_settlement_provisional_vs_final (DockTicket fiscal).
        test_recipe:
          setup:
            - "Species COD GRADE_A quote 1200 PUBLISHED for 2026-08-01; customer credit 1000000"
            - "Order CONFIRMED with one line 10.00 kg COD GRADE_A (total 12000)"
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { qa_id: $.data.id } }
            - { call: "POST /market-quotes/${qa_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 10.00 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager }
            - { call: "POST /shipments", payload: { sales_order_id: "${o_id}", mode: "AIR", flight_number: "FL100", flight_date: "2026-08-03", booked_weight_kg: 16.70, temp_zone: "CHILLED" }, as: LogisticsCoordinator, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /shipments/${sh_id}/book", payload: {}, as: LogisticsCoordinator, captures: { prov: $.data.provisional_freight_cents } }
            - { call: "POST /shipments/${sh_id}/tender", payload: { actual_weight_kg: 12.00, volume_m3: 0.05 }, as: LogisticsCoordinator, captures: { fin: $.data.final_freight_cents } }
          assert:
            - "Shipment.${sh_id}.provisional_freight_cents == 11006 (chargeable 16.70 -> subtotal 10344, 5% tier -> 9827, fuel 1179)"
            - "Shipment.${sh_id}.final_freight_cents == 9901 (chargeable max(12.00, 8.35)=12.00 -> subtotal 8840, no tier, fuel 1061)"
            - "Shipment.${sh_id}.chargeable_weight_kg == 12.00 after tender"
            - "provisional 11006 != final 9901 for the same shipment"

  - rule_id: combinatorial_formula
    instances:
      - name: yield_processing_grade_and_processing_interaction
        grounds:
          - calculations.yield_processing
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — processed weight multiplies
          landed weight by yield AND a grade-conditional factor (A 1.00 / B 0.97 / C 0.92)
          AND a processing-type factor (WHOLE 1.00 / FILLETED 0.85), capped by min(., landed).
          100.00 kg x 0.80 x 0.92 (GRADE_C) x 0.85 (FILLETED) = 62.56 kg.
        test_recipe:
          setup:
            - "Species COD with PUBLISHED GRADE_A=1200 and GRADE_C=700 quotes for 2026-08-01"
            - "Ticket LANDED; line 100.00 kg declared GRADE_A, processing_type FILLETED"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { qa_id: $.data.id } }
            - { call: "POST /market-quotes/${qa_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager, captures: { sp_v2: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_C", quote_date: "2026-08-01", price_per_kg_cents: 700 }, as: OperationsManager, captures: { qc_id: $.data.id } }
            - { call: "POST /market-quotes/${qc_id}/publish", payload: { expected_species_version: "${sp_v2}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 100.00, processing_type: "FILLETED", expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_C", yield_pct: 0.80 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
          trigger:
            - { call: "GET /landing-lines/${l_id}", payload: {}, as: OperationsManager }
          assert:
            - "LandingLine.${l_id}.processed_weight_kg == 62.56"
            - "LandingLine.${l_id}.final_amount_cents == 43792 (62.56 x 700)"
            - "Changing only assessed_grade to GRADE_B would give 65.96 kg (grade-conditional factor is non-linear input), and the min() cap binds when yield x factors exceed 1"

      - name: order_pricing_per_line_rounding_then_sum
        grounds:
          - calculations.order_line_pricing
          - calculations.latest_published_quote
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — each line rounds to integer cents
          BEFORE summation. Price 999 cents/kg, discount 0.10: line1 1.55 kg -> 1394,
          line2 2.55 kg -> 2293, total 3687. The forbidden sum-then-round order gives
          3686 — one cent different, so the pin is observable.
        test_recipe:
          setup:
            - "Species HADDOCK GRADE_A quote 999 PUBLISHED for 2026-08-01"
            - "Customer with discount_pct 0.10 and credit_limit 1000000"
            - "Order with two lines: 1.55 kg and 2.55 kg HADDOCK GRADE_A"
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "HADDOCK", common_name: "Haddock", labeling_name: "Haddock", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 999 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000, discount_pct: 0.10 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 1.55 }, as: Customer, as_user_id: "${c_id}", captures: { ol1_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 2.55 }, as: Customer, as_user_id: "${c_id}", captures: { ol2_id: $.data.id } }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager }
          assert:
            - "OrderLine.${ol1_id}.line_total_cents == 1394 (round_half_up(1.55 x 999 x 0.9) = round_half_up(1393.605))"
            - "OrderLine.${ol2_id}.line_total_cents == 2293 (round_half_up(2292.705))"
            - "SalesOrder.${o_id}.total_cents == 3687 (sum of rounded lines; sum-then-round would be 3686)"
            - "OrderLine.${ol1_id}.unit_price_cents == 999 (locked at confirm)"

      - name: freight_tier_keyed_on_prediscount_subtotal
        grounds:
          - calculations.freight_charge
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — the 5%
          discount tier is keyed on the PRE-discount subtotal, and fuel is computed on
          the POST-discount value. TRUCK 55.00 kg: subtotal 10200 (>= 10000 tier even
          though discounted 9690 falls below it), fuel 1163 on 9690 (not 1224 on 10200),
          total 10853. Any other order yields 10440 or 10924.
        test_recipe:
          setup:
            - "Species COD GRADE_A quote 1200 PUBLISHED; customer credit 1000000; CONFIRMED order (1.00 kg line)"
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 1.00 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager }
            - { call: "POST /shipments", payload: { sales_order_id: "${o_id}", mode: "TRUCK", booked_weight_kg: 55.00, temp_zone: "FROZEN" }, as: LogisticsCoordinator, captures: { sh_id: $.data.id } }
            - { call: "POST /shipments/${sh_id}/book", payload: {}, as: LogisticsCoordinator }
          trigger:
            - { call: "POST /shipments/${sh_id}/tender", payload: { actual_weight_kg: 55.00, volume_m3: 0.00 }, as: LogisticsCoordinator }
          assert:
            - "Shipment.${sh_id}.final_freight_cents == 10853"
            - "Subtotal 2500 + 55.00 x 140 = 10200 >= 10000 so the 5% tier applies even though discounted 9690 < 10000"
            - "Fuel 1163 = round_half_up(9690 x 0.12); fuel-on-subtotal would give 1224 and is forbidden"

  - rule_id: non_linear_state_machine
    instances:
      - name: dock_ticket_regrade_cycle
        grounds:
          - state_machines.DockTicket.GRADED_to_LANDED
          - state_machines.GradeAssessment.FINAL_to_SUPERSEDED
          - entities.DockTicket.fields.regrade_count
        distinguishing_aspect: |
          Cyclic machine on DockTicket: GRADED -> LANDED -> GRADED -> LANDED -> GRADED
          with a hard loop bound (regrade_count cap 2 — the third request fails with
          ERR_REGRADE_LIMIT_EXCEEDED), and each reversal supersedes FINAL assessments and
          recalls derived lots. Non-linear shape on DockTicket; sibling instances cover
          InventoryLot (parallel dims) and ImportDocument (cycle) — different entities.
        test_recipe:
          setup:
            - "Species COD GRADE_A quote 1200 PUBLISHED for 2026-08-01"
            - "Ticket reached GRADED via one line 50.00 kg + FINAL assessment (GRADE_A, yield 1.00)"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 50.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga1_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga1_id}/finalize", payload: {}, as: GradingInspector }
          trigger:
            - { call: "POST /dock-tickets/${t_id}/request-regrade", payload: {}, as: DockBuyer, captures: { t_after1: $.data.status } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga2_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga2_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "POST /dock-tickets/${t_id}/request-regrade", payload: {}, as: DockBuyer }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga3_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga3_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "POST /dock-tickets/${t_id}/request-regrade", payload: {}, as: DockBuyer, captures: { err: $.data.error_id } }
          assert:
            - "After first regrade: DockTicket.${t_id}.status == LANDED and regrade_count == 1"
            - "GradeAssessment.${ga1_id}.status == SUPERSEDED after first regrade"
            - "InventoryLot created by first finalize has lifecycle_status == RECALLED after first regrade"
            - "After second finalize cycle: DockTicket.${t_id}.status == GRADED and regrade_count == 2"
            - "Third request-regrade returns ERR_REGRADE_LIMIT_EXCEEDED (409) and ticket stays GRADED"

      - name: inventory_lot_parallel_hold_and_lifecycle
        grounds:
          - state_machines.InventoryLot
          - entities.InventoryLot.fields.hold_status
          - entities.InventoryLot.fields.lifecycle_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity: hold_status (CLEAR -> ON_HOLD -> CLEAR)
          evolves independently of lifecycle_status (ACTIVE throughout) — placing and
          releasing a hold never touches lifecycle, and a subsequent freeze mutates
          storage/expires while both dimensions keep their values. Different entity from
          DockTicket (cycle) and ImportDocument (cycle).
        test_recipe:
          setup:
            - "Species COD GRADE_A quote 1200 PUBLISHED; ticket GRADED with lot of 50.00 kg (yield 1.00)"
            - "Inspection hold placed on the lot by officer off_1"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
