              as: TournamentDirector
              captures: { e_enum: $.data.error_id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "NEG", kind: "INDIVIDUAL", price_cents: -1, player_slots: 1 }
              as: TournamentDirector
