          - endpoints[POST /extrusion-lines/{id}/clear-capability-flags]
          - calculations.line_posture
        distinguishing_aspect: "The compensation is deliberately partial: clearing the counters re-derives posture to OPEN, but the BLOCKED run and the QUARANTINED rolls the freeze produced are NOT restored, so the side effect is applied conditionally on current state only."
        test_recipe:
          setup:
            - "line L-NF FROZEN after two INCAPABLE runs, with RUN-NF-C BLOCKED and rolls 1 and 2 QUARANTINED"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - &a_runA_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-A", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T06:00:00Z", scheduled_end: "2026-08-05T14:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { runA: "$.data.id" } }
            - &a_runA_start { call: "POST /extrusion-runs/${runA}/start", payload: {}, as: ExtrusionOperator }
            - &a_gA_37 { call: "POST /extrusion-runs/${runA}/gauge-readings", payload: { thickness_micron: 37.0 }, as: ExtrusionOperator }
            - &a_gA_43 { call: "POST /extrusion-runs/${runA}/gauge-readings", payload: { thickness_micron: 43.0 }, as: ExtrusionOperator }
            - &a_gA_40 { call: "POST /extrusion-runs/${runA}/gauge-readings", payload: { thickness_micron: 40.0 }, as: ExtrusionOperator }
            - *a_gA_40
            - *a_gA_40
            - &a_roll_a { call: "POST /film-rolls", payload: { extrusion_run_id: "${runA}", roll_number: 1, net_kg: 100.0 }, as: ExtrusionOperator, captures: { roll_a: "$.data.id" } }
            - &a_runA_comp { call: "POST /extrusion-runs/${runA}/complete", payload: { gross_output_kg: 500.0, scrap_kg: 100.0 }, as: ExtrusionOperator }
            - *a_clock_d1_1500
            - &a_runC_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-C", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-06T06:00:00Z", scheduled_end: "2026-08-06T14:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { runC: "$.data.id" } }
            - &a_runB_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-B", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T15:00:00Z", scheduled_end: "2026-08-05T20:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { runB: "$.data.id" } }
            - &a_runB_start { call: "POST /extrusion-runs/${runB}/start", payload: {}, as: ExtrusionOperator }
            - &a_gB_37 { call: "POST /extrusion-runs/${runB}/gauge-readings", payload: { thickness_micron: 37.0 }, as: ExtrusionOperator }
            - &a_gB_43 { call: "POST /extrusion-runs/${runB}/gauge-readings", payload: { thickness_micron: 43.0 }, as: ExtrusionOperator }
            - &a_gB_40 { call: "POST /extrusion-runs/${runB}/gauge-readings", payload: { thickness_micron: 40.0 }, as: ExtrusionOperator }
            - *a_gB_40
            - *a_gB_40
            - &a_roll_b { call: "POST /film-rolls", payload: { extrusion_run_id: "${runB}", roll_number: 2, net_kg: 100.0 }, as: ExtrusionOperator, captures: { roll_b: "$.data.id" } }
            - &a_runB_comp { call: "POST /extrusion-runs/${runB}/complete", payload: { gross_output_kg: 500.0, scrap_kg: 100.0 }, as: ExtrusionOperator }
          trigger:
            - { call: "POST /extrusion-lines/${line_nf}/clear-capability-flags", payload: {}, as: QualityManager, as_user_id: "u-qm-1" }
          assert:
            - "before the call: ExtrusionLine.${line_nf}.posture == FROZEN and incapable_run_count == 2"
            - "POST /extrusion-lines/${line_nf}/clear-capability-flags -> 200"
            - "ExtrusionLine.${line_nf}.incapable_run_count == 0, active_hold_count == 0, revoked_dossier_count == 0, posture == OPEN"
            - "ExtrusionRun.${runC}.status == BLOCKED (still blocked)"
            - "FilmRoll.${roll_a}.status == QUARANTINED and FilmRoll.${roll_b}.status == QUARANTINED (still quarantined)"
      - name: cyclic_hold_resume_loop_terminates_on_the_hold_ceiling
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ExtrusionRun.HELD_to_RUNNING
        excluded_because:
          difficulty_instance: non_linear_state_machine / run_hold_resume_cycle_bounded_by_max_run_holds
          rationale: "The loop and its termination condition are the subject of the named 1.8 instance."
      - name: guarded_transition_requires_a_second_entity_in_a_specific_state
        claim_type: guarded_transitions
        grounds:
          - complexity_profile.state_machine_shape
          - validations[priority=10]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / print_job_creation_requires_film_roll_released
          rationale: "The guard on a different entity is asserted as the failure and success path of the named 1.8 instance."
      - name: cascade_down_from_a_frozen_line_to_its_runs_and_rolls
        claim_type: cascade_down
        grounds:
          - state_machines.ExtrusionLine.posture.RESTRICTED_to_FROZEN
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_incapable_run_freezes_line_blocks_run_and_supersedes_recipe
          rationale: "The six-hop downward cascade is the whole subject of the named 1.8 instance."
      - name: ledger_sync_from_run_completion_to_the_regrind_pool
        claim_type: ledger_sync
        grounds:
          - calculations.pool_mass_balance
          - state_machines.ExtrusionRun.RUNNING_to_COMPLETED
        excluded_because:
          difficulty_instance: dual_variant_calc / recycled_content_nominal_versus_as_built_diverge
          rationale: "Pool ledger and run-level derived masses are reconciled before and after in the named 1.8 instance."
      - name: compensation_of_a_regrind_draw_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - endpoints[POST /regrind-transactions/{id}/reverse]
        excluded_because:
          difficulty_instance: compensating_invariant / regrind_reversal_restores_pool_mass_invariant
          rationale: "The named 1.8 instance asserts the full before/after reconciliation with no drift."
      - name: independent_state_dimensions_advance_without_coupling_on_a_print_job
        claim_type: parallel
        grounds:
          - state_machines.PrintJob.registration_state
          - state_machines.PrintJob.color_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / print_job_registration_and_color_dimensions_advance_independently
          rationale: "The three independent PrintJob state dimensions are the subject of the named 1.8 instance."
  - section: calculations
    instances:
      - name: single_component_recipe_derives_every_blend_metric
        claim_type: correct_result
        grounds:
          - calculations.blend_composition_totals
          - calculations.blend_cost_and_density
          - calculations.blend_property_indices
        distinguishing_aspect: "One 100.000 % LL-1001 component exercises every branch of the blend formula at once with no regrind, no additive and no HDPE, so both min() factors are 1.000 and the additive boost is 1.000."
        test_recipe:
          setup:
            - "DRAFT recipe R-NF-0 for the non-food product P-NF-1 with no components yet"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_r0_new
          trigger:
            - { call: "POST /blend-recipes/${r0}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 100.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
          assert:
            - "POST /blend-recipes/${r0}/components -> 201"
            - "BlendRecipe.${r0}.total_weight_pct == 100.000, regrind_pct == 0.000, additive_pct == 0.000"
            - "BlendRecipe.${r0}.blended_cost_per_kg == 1.45 and blended_density_kg_m3 == 918.00"
            - "BlendRecipe.${r0}.strength_index == 42.00 (42.0 * min(1.000, 1.000) * 1.000)"
            - "BlendRecipe.${r0}.clarity_index == 80.00 (100.00 - 2.500 * 8.0)"
            - "BlendRecipe.${r0}.slip_index == 30.00 ((0.600 - 0.420) / 0.600 * 100)"
            - "BlendRecipe.${r0}.barrier_layer_present == false and food_contact_eligible == true"
            - "BlendRecipe.${r0}.regrind_cap_pct == 35.000 and virgin_pcr_pct == 0.000"
      - name: a_completed_run_no_longer_occupies_its_line_window
        claim_type: input_set_filtering
        grounds:
          - calculations.line_occupancy_conflict
          - errors[ERR_LINE_WINDOW_CONFLICT]
        distinguishing_aspect: "The occupancy input set is restricted to runs in SCHEDULED, RUNNING or HELD; once RUN-NF-1 reaches COMPLETED its 06:00-14:00 window is no longer an obstacle, so a fully enclosed new window is accepted rather than rejected."
        test_recipe:
          setup:
            - "RUN-NF-1 COMPLETED on line L-NF over 06:00-14:00 with Cpk 4.000 (line posture OPEN)"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_run1_new
            - *a_run1_start
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_roll1
            - *a_run1_comp
          trigger:
            - { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-E", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T07:00:00Z", scheduled_end: "2026-08-05T13:00:00Z", target_output_kg: 300.0 }, as: ExtrusionOperator, captures: { runE: "$.data.id" } }
          assert:
            - "ExtrusionRun.${run1}.status == COMPLETED and gauge_capability_state == CAPABLE"
            - "ExtrusionLine.${line_nf}.posture == OPEN"
            - "POST /extrusion-runs -> 201 (no ERR_LINE_WINDOW_CONFLICT) and ExtrusionRun.${runE}.status == SCHEDULED"
            - "GET /extrusion-runs filtered by line_id ${line_nf} returns total_count 2"
      - name: regrind_cap_band_uses_the_declared_threshold_and_delta_constants
        claim_type: constants_applied
        grounds:
          - calculations.regrind_cap_evaluation
          - global_constants
          - entities.BlendRecipe.fields.regrind_cap_pct
        distinguishing_aspect: "A 50/50 LL-1001 / PC-7007 blend puts virgin_pcr_pct at 50.000, which is above the HIGH threshold of 20.0, so the base non-food cap of 35.0 is reduced by the HIGH delta of 5.0 to exactly 30.000 - the MID delta of 2.0 is not applied."
        test_recipe:
          setup:
            - "DRAFT recipe R-NF-6 for P-NF-1 with LL-1001 at 50.000 % already added"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - &a_g_pc { call: "POST /resin-grades", payload: { grade_code: "PC-7007", material_class: "VIRGIN_RESIN", polymer_family: "LLDPE", melt_index: 1.2, density_kg_m3: 920.0, food_contact_approved: false, pcr_content_pct: 100.0, cost_per_kg: 1.1, dart_impact_index: 30.0, haze_index: 30.0, cof_index: 0.55, seal_initiation_temp_c: 108.0, is_barrier: false }, as: PlantAdmin, captures: { g_pc: "$.data.id" } }
            - &a_r6_new { call: "POST /blend-recipes", payload: { recipe_code: "R-NF-6", product_id: "${p_nf}", process_type: "BLOWN", layer_count: 1 }, as: BlendEngineer, captures: { r6: "$.data.id" } }
            - &a_r6_c1 { call: "POST /blend-recipes/${r6}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 50.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
          trigger:
            - { call: "POST /blend-recipes/${r6}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 50.0, resin_grade_id: "${g_pc}" }, as: BlendEngineer }
          assert:
            - "POST /blend-recipes/${r6}/components -> 201"
            - "BlendRecipe.${r6}.virgin_pcr_pct == 50.000 and regrind_cap_pct == 30.000"
            - "BlendRecipe.${r6}.blended_cost_per_kg == 1.28 and blended_density_kg_m3 == 919.00"
            - "BlendRecipe.${r6}.strength_index == 36.00, clarity_index == 52.50, slip_index == 19.17"
            - "BlendRecipe.${r6}.nominal_recycled_content_pct == 50.000"
      - name: the_provisional_seal_variant_is_written_on_append_and_the_final_variant_stays_null
        claim_type: variant_selection
        grounds:
          - calculations.seal_strength_qualification.variants
          - entities.BagLot.fields.seal_provisional_verdict
          - entities.BagLot.fields.seal_final_verdict
        distinguishing_aspect: "The provisional variant is recomputed on every append and fires as soon as the third first-pass specimen lands (mean 21.00 < spec 22.0 -> FAIL), while the final variant - which would have said CONDITIONAL on the same three rows - is not written until finalize-tests."
        test_recipe:
          setup:
            - "lot BL-1 in TESTING for P-FD-1 (min_bottom_seal_n_per_15mm 22.0) with specimens 1 and 2 at 22.0"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_fd
            - *a_g_ll
            - *a_g_ev
            - *a_g_ti
            - *a_g_ad
            - *a_line_fd
            - *a_pool_fd
            - *a_press1
            - *a_r1_new
            - *a_r1_c1
            - *a_r1_c2
            - *a_r1_c3
            - *a_r1_c4
            - *a_r1_c5
            - *a_r1_sub
            - *a_r1_app
            - *a_runfd_new
            - *a_runfd_start
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - *a_rollfd
            - *a_roll2
            - *a_roll3
            - *a_runfd_comp
            - *a_rollfd_rel
            - *a_roll2_rel
            - *a_plate1
            - *a_plate1_mount
            - *a_pj1
            - *a_pj1_reg
            - *a_pj1_col
            - *a_pj1_sp
            - *a_pj1_cmp
            - *a_bl1
            - &a_bl1_s1_22 { call: "POST /bag-lots/${bl1}/seal-tests", payload: { specimen_index: 1, measured_n_per_15mm: 22.0 }, as: ConvertingOperator, as_user_id: "u-co-1" }
            - &a_bl1_s2_22 { call: "POST /bag-lots/${bl1}/seal-tests", payload: { specimen_index: 2, measured_n_per_15mm: 22.0 }, as: ConvertingOperator, as_user_id: "u-co-1" }
          trigger:
            - { call: "POST /bag-lots/${bl1}/seal-tests", payload: { specimen_index: 3, measured_n_per_15mm: 19.0 }, as: ConvertingOperator, as_user_id: "u-co-1" }
          assert:
