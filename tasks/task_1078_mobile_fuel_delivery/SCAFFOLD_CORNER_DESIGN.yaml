# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_1078_mobile_fuel_delivery — Expert
# Breadth probe: every testable §1.1-§1.7 claim not already carried by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_customer_returns_common_fields
        claim_type: Creation
        grounds:
          - "entities.Customer"
        distinguishing_aspect: "POST /customers with name/email/customer_type returns 201 with server-minted id, created_at, version=1, status=ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Nora", email: "nora@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cid: $.data.id, ver: $.data.version, st: $.data.status }
          assert:
            - "Customer.${cid}.status == ACTIVE"
            - "Customer.${cid}.version == 1"
            - "response.http_status == 201"

      - name: get_customer_not_found
        claim_type: Not Found
        grounds:
          - "entities.Customer"
          - "errors[ERR_CUSTOMER_NOT_FOUND]"
        distinguishing_aspect: "GET /customers/{id} for a non-existent UUID returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CUSTOMER_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_order_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "entities.DeliveryOrder"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /orders missing requested_gallons returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["REGULAR/ZONE_A price 419 effective 2026-04-01; individual customer with a REGULAR vehicle."]
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Otto", email: "otto@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Up", fuel_type: "REGULAR", tank_capacity_gallons: 40 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "no gallons", delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.http_status == 400"

      - name: order_fuel_type_copied_from_vehicle_computed
        claim_type: Computed Fields
        grounds:
          - "entities.DeliveryOrder.fields.fuel_type"
        distinguishing_aspect: "DeliveryOrder.fuel_type is computed from Vehicle.fuel_type (DIESEL vehicle -> order.fuel_type == DIESEL), not taken from any request field."
        test_recipe:
          setup: ["DIESEL/ZONE_A price 459 effective 2026-04-01; individual customer with a DIESEL vehicle tank 100 level 0."]
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "DIESEL", zone: "ZONE_A", price_per_gallon_cents: 459, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Pat", email: "pat@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Ram", fuel_type: "DIESEL", tank_capacity_gallons: 100, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "Diesel Ln", requested_gallons: 10, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id, ft: $.data.fuel_type }
          assert:
            - "DeliveryOrder.${ord_id}.fuel_type == DIESEL"

      - name: vehicle_default_fuel_level_zero
        claim_type: Defaults
        grounds:
          - "entities.Vehicle.fields.current_fuel_level_gallons"
        distinguishing_aspect: "Omitting current_fuel_level_gallons on POST /vehicles applies default 0."
        test_recipe:
          setup: ["Individual customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Quin", email: "quin@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Polo", fuel_type: "REGULAR", tank_capacity_gallons: 40 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
          assert:
            - "Vehicle.${veh_id}.current_fuel_level_gallons == 0"
            - "Vehicle.${veh_id}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: pause_already_paused_membership_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Membership.ACTIVE_to_PAUSED"
          - "errors[ERR_INVALID_MEMBERSHIP_STATE]"
        distinguishing_aspect: "Pausing a membership already in PAUSED returns ERR_INVALID_MEMBERSHIP_STATE (409); no state change."
        test_recipe:
          setup: ["Individual customer with an ACTIVE membership that has been paused once."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Rex", email: "rex@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /memberships"
              payload: { customer_id: "${cust_id}", tier: "BASIC", monthly_fee_cents: 1999, included_deliveries: 2 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /memberships/${mem_id}/pause"
              payload: {}
              as: Member
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /memberships/${mem_id}/pause"
              payload: {}
              as: Member
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_MEMBERSHIP_STATE"
            - "Membership.${mem_id}.status == PAUSED"

      - name: deliver_from_scheduled_invalid_order_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.DeliveryOrder.ARRIVED_to_DELIVERED"
          - "errors[ERR_INVALID_ORDER_STATE]"
        distinguishing_aspect: "Delivering an order still in SCHEDULED (never routed/arrived) returns ERR_INVALID_ORDER_STATE (409)."
        test_recipe:
          setup: ["REGULAR/ZONE_A price 419; individual customer, REGULAR vehicle; one SCHEDULED order (never routed)."]
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Sam", email: "sam@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Bora", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "Sched St", requested_gallons: 5, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T10:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/deliver"
              payload: { dispensed_gallons: 5 }
              as: Driver
              as_user_id: "driver-x"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_ORDER_STATE"
            - "DeliveryOrder.${ord_id}.status == SCHEDULED"

      - name: cancel_delivered_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.DeliveryOrder"
          - "errors[ERR_INVALID_ORDER_STATE]"
        distinguishing_aspect: "Cancelling a DELIVERED (terminal) order returns ERR_INVALID_ORDER_STATE (409); DELIVERED has no outbound transitions."
        test_recipe:
          setup: ["REGULAR/ZONE_A price 419; individual customer + REGULAR vehicle; order driven fully to DELIVERED via a route."]
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Tia", email: "tia@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Ibiza", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /trucks"
              payload: { plate: "TRK-T", home_zone: "ZONE_A" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/compartments"
              payload: { fuel_type: "REGULAR", gallons_capacity: 200, gallons_onboard: 100 }
              as: PlatformAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /routes"
              payload: { truck_id: "${truck_id}", assigned_driver_id: "driver-t", zone: "ZONE_A", window_start: "2026-05-02T06:00:00Z", window_end: "2026-05-02T20:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "Term St", requested_gallons: 5, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T10:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/assign-route"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /orders/${ord_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "driver-t"
            - call: "POST /orders/${ord_id}/deliver"
              payload: { dispensed_gallons: 5 }
              as: Driver
              as_user_id: "driver-t"
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_ORDER_STATE"
            - "DeliveryOrder.${ord_id}.status == DELIVERED"

      - name: membership_renew_charge_success_rolls_period
        claim_type: Valid Transition
        grounds:
          - "state_machines.Membership.ACTIVE_to_ACTIVE"
          - "entities.Membership.fields.deliveries_used_this_period"
        distinguishing_aspect: "renew-charge SUCCEEDED at/after period end advances current_period_start and resets deliveries_used_this_period to 0; status stays ACTIVE."
        test_recipe:
          setup: ["Individual customer, ACTIVE membership created at default clock (period_end 2026-05-31); clock advanced to 2026-06-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Uwe", email: "uwe@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /memberships"
              payload: { customer_id: "${cust_id}", tier: "PLUS", monthly_fee_cents: 3999, included_deliveries: 5 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /memberships/${mem_id}/renew-charge"
              payload: { outcome: "SUCCEEDED" }
              as: BillingOfficer
              captures: { st: $.data.status }
          assert:
            - "Membership.${mem_id}.status == ACTIVE"
            - "Membership.${mem_id}.deliveries_used_this_period == 0"

      - name: membership_renew_charge_failed_goes_past_due
        claim_type: Valid Transition
        grounds:
          - "state_machines.Membership.ACTIVE_to_PAST_DUE"
        distinguishing_aspect: "renew-charge FAILED at/after period end moves membership ACTIVE -> PAST_DUE."
        test_recipe:
          setup: ["Individual customer, ACTIVE membership; clock advanced past period end to 2026-06-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Val", email: "val@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /memberships"
              payload: { customer_id: "${cust_id}", tier: "PLUS", monthly_fee_cents: 3999, included_deliveries: 5 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /memberships/${mem_id}/renew-charge"
              payload: { outcome: "FAILED" }
              as: BillingOfficer
              captures: { st: $.data.status }
          assert:
            - "Membership.${mem_id}.status == PAST_DUE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: fuel_price_selection_latest_effective_wins
        claim_type: Correct Result
        grounds:
          - "calculations.current_fuel_price_selection"
          - "entities.DeliveryOrder.fields.locked_price_per_gallon_cents"
        distinguishing_aspect: "With REGULAR/ZONE_A prices 419 (eff 2026-04-01) and 429 (eff 2026-04-20), an order at clock 2026-05-01 locks the later 429."
        test_recipe:
          setup: ["Two REGULAR/ZONE_A prices posted (419 eff 2026-04-01, 429 eff 2026-04-20); clock default 2026-05-01; individual customer + REGULAR vehicle tank 40 level 0."]
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 429, effective_date: "2026-04-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Wes", email: "wes@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Arteon", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "Price St", requested_gallons: 10, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "DeliveryOrder.${ord_id}.locked_price_per_gallon_cents == 429"
            - "DeliveryOrder.${ord_id}.estimated_fuel_cost_cents == 4290"

      - name: no_fuel_price_available_rejects_order
        claim_type: Input Set Filtering
        grounds:
          - "calculations.current_fuel_price_selection"
          - "errors[ERR_NO_FUEL_PRICE_AVAILABLE]"
        distinguishing_aspect: "An order whose only matching price has effective_date AFTER the clock (2026-06-01 > 2026-05-01) finds an empty candidate set -> ERR_NO_FUEL_PRICE_AVAILABLE (422)."
        test_recipe:
          setup: ["REGULAR/ZONE_A price 419 effective 2026-06-01 (future); clock default 2026-05-01; individual customer + REGULAR vehicle."]
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Xan", email: "xan@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "T-Cross", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "NoPrice St", requested_gallons: 10, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_FUEL_PRICE_AVAILABLE"
            - "response.http_status == 422"

      - name: non_member_addon_full_price_no_discount
        claim_type: Correct Result
        grounds:
          - "calculations.addon_charged_price"
          - "entities.AddOnService.fields.charged_price_cents"
        distinguishing_aspect: "A per-fill (non-member) order's CAR_WASH add-on is charged the full 1595 (no 10% member discount)."
        test_recipe:
          setup: ["REGULAR/ZONE_A price 419; individual customer WITHOUT membership; REGULAR vehicle; one per-fill SCHEDULED order."]
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Yas", email: "yas@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Taos", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "Wash St", requested_gallons: 8, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/addons"
              payload: { addon_type: "CAR_WASH" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { addon_id: $.data.id }
          assert:
            - "AddOnService.${addon_id}.charged_price_cents == 1595"
            - "DeliveryOrder.${ord_id}.addon_total_cents == 1595"

      - name: dispense_exceeds_requested_rejected
        claim_type: Correct Result
        grounds:
          - "calculations.order_fuel_cost"
          - "errors[ERR_DISPENSE_EXCEEDS_REQUESTED]"
        distinguishing_aspect: "Delivering with dispensed_gallons (9) greater than requested_gallons (8) returns ERR_DISPENSE_EXCEEDS_REQUESTED (422)."
        test_recipe:
          setup: ["REGULAR/ZONE_A price 419; individual customer + REGULAR vehicle tank 40 level 0; order (8 gal) driven to ARRIVED."]
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Zed", email: "zed@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Tiguan", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /trucks"
              payload: { plate: "TRK-Z", home_zone: "ZONE_A" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/compartments"
              payload: { fuel_type: "REGULAR", gallons_capacity: 200, gallons_onboard: 100 }
              as: PlatformAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /routes"
              payload: { truck_id: "${truck_id}", assigned_driver_id: "driver-z", zone: "ZONE_A", window_start: "2026-05-02T06:00:00Z", window_end: "2026-05-02T20:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "Disp St", requested_gallons: 8, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/assign-route"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /orders/${ord_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "driver-z"
          trigger:
            - call: "POST /orders/${ord_id}/deliver"
              payload: { dispensed_gallons: 9 }
              as: Driver
