            - *cd2_pm3
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
          trigger:
            - call: "POST /molds/${mold}/complete-service"
              payload: { service_note: "nothing was serviced" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds/${mold}/retire"
              payload: { retire_reason: "cavity crack" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/abort"
              payload: { abort_reason: "MOLD_SERVICE_DUE" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molds/${mold}/retire"
              payload: { retire_reason: "cavity crack" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds/${mold}/service-hold"
              payload: { hold_note: "too late" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-T3R", product_model_id: "${pm3}", size_class: "TANDEM", cavity_count: 1, nominal_charge_kg: 30.000, service_interval_cycles: 10, replaces_mold_id: "${mold}" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-1R", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 24.000, service_interval_cycles: 10, replaces_mold_id: "${mold}" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { moldr: $.data.id }
          assert:
            - "the complete-service returns status 409 with data.error_id 'ERR_MOLD_NOT_AVAILABLE' and Mold.${mold}.status is still 'AVAILABLE' with version 1"
            - "the first retire returns status 409 with data.error_id 'ERR_MOLD_HAS_ACTIVE_CYCLES', not 'ERR_MOLD_NOT_AVAILABLE', because the status itself was retireable"
            - "the abort returns status 200 with MoldingCycle.${cyc}.status 'ABORTED' and Mold.${mold}.status 'AVAILABLE'"
            - "the second retire returns status 200 with Mold.${mold}.status 'RETIRED'"
            - "the service-hold on the RETIRED mould returns status 409 with data.error_id 'ERR_MOLD_NOT_AVAILABLE'"
            - "the MLD-CD-T3R create returns status 422 with data.error_id 'ERR_INVALID_MOLD_REPLACEMENT' because ${mold} belongs to PM-CD-KM, not PM-CD-T3"
            - "the MLD-CD-1R create returns status 201 with replaces_mold_id == ${mold}, status 'AVAILABLE' and cycles_since_service 0"
            - "GET /molds?replaces_mold_id=${mold} returns total_count 1 with the single id ${moldr}"

      - name: err_warranty_intake_and_storage_axis_family_with_the_3_00_mm_boundary
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNIT_NOT_DELIVERED
          - errors.ERR_DEFORMATION_BELOW_THRESHOLD
          - errors.ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED
          - errors.ERR_STORAGE_REVIEW_ALREADY_DONE
          - errors.ERR_STORAGE_FINDING_NOT_WAIVABLE
