            - "VolunteerShift.${sh_b}.status == OPEN (unchanged)"

      # --- #2: buffer-extended overlap on an otherwise non-overlapping interval ---
      - name: shift_overlap_only_via_setup_buffer
        grounds:
          - state_machines.VolunteerShift.OPEN_to_BOOKED
          - validations[priority=11]
          - errors[ERR_SHIFT_OVERLAP]
