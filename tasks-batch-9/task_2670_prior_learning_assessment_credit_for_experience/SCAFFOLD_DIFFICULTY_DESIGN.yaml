  - rule_id: non_linear_state_machine
    instances:
      - name: portfolio_revision_cycle_reenters_submitted_twice_then_limit_blocks
        grounds:
          - state_machines.Portfolio.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Portfolio.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.PlaClaim.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.PlaClaim.REVISION_REQUESTED_to_SUBMITTED
          - entities.PlaClaim.fields.revision_round
          - entities.FeeInvoice.fields.recompute_count
          - validations[priority=33]
        distinguishing_aspect: |
          Both PlaClaim.assessment_status and Portfolio.status re-enter a state
          they already occupied — SUBMITTED -> REVISION_REQUESTED -> SUBMITTED —
          and the loop is bounded by revision_round rather than by the state
          itself, so the third request-revision from the SAME SUBMITTED state that
          twice accepted it is refused with ERR_REVISION_LIMIT_REACHED while the
          claim stays SUBMITTED and the reservation of 6 credits never moves.
        test_recipe:
          setup:
            - "Program BSCS; Course CS150 (6 credits, LOWER, CS) with OC1 weight_bp 8000 and OC2 weight_bp 2000."
            - "Student S-1001 MATRICULATED with a PORTFOLIO claim for CS150 carrying 2 artifacts, submitted once."
            - "The claim has already completed two full revision cycles, so revision_round is 2 and both the claim and its portfolio are back in SUBMITTED."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
