errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: missing or invalid X-User-Role
- id: ERR_UNAUTHORIZED
  http: 403
  condition: role lacks permission for operation
- id: ERR_NOT_FOUND
  http: 404
  condition: path or body FK reference does not resolve
- id: ERR_INVALID_STATE
  http: 409
  condition: target resource not in a state from which the transition exists
- id: ERR_SELF_ACCEPT_FORBIDDEN
  http: 403
  condition: NrcReviewer attempts to accept an RAI they authored
- id: ERR_PROCUREMENT_GATE
  http: 422
  condition: nuclear-grade lot creation without vendor qualified and program ADEQUATE
- id: ERR_AUDIT_OVERLAP
  http: 409
  condition: new qualification audit within +/-14 days of a non-superseded qualification of same vendor
- id: ERR_HEARING_IN_PAST
  http: 422
  condition: hearing scheduled_at not strictly in the future
- id: ERR_HEARING_WINDOW
  http: 422
  condition: mark-held before scheduled_at, or contend/cancel after scheduled_at
- id: ERR_OUT_OF_ORDER_RESULT
  http: 422
  condition: test result run_at precedes an earlier result of the same program
- id: ERR_SAR_SECTION_UNKNOWN
  http: 422
  condition: RAI targets a section_code with no SAR on the same DCA
- id: ERR_CAPACITY_EXCEEDED
  http: 422
  condition: subscription execute exceeds DCA.available_mw
- id: ERR_STALE_VERSION
  http: 412
  condition: OCC mismatch on expected_cost_share_agreement_version
- id: ERR_ESCALATION_OUT_OF_RANGE
  http: 422
  condition: overrun_usd <= 0 or > 3x participant_share_usd
- id: ERR_DUPLICATE
  http: 409
  condition: uniqueness constraint violated (docket, vendor name, section revision, program code, cohort code, utility pair)
- id: ERR_DCA_NOT_CERTIFIED
  http: 422
  condition: COL creation while DCA not CERTIFIED
- id: ERR_VALIDATION
  http: 400
  condition: missing required field or malformed payload
roles:
- name: DcaApplicant
  description: Reactor vendor/applicant authoring the design certification application
  identity: opaque
  exclusive_operations:
  - create/patch DCA
  - create SAR
  - create test program
  - record test result
  - start/restart test program
  - respond to RAI
  shared_operations:
  - read DCA
  - read SAR/RAI/test program
  - list component lots
- name: NrcReviewer
  description: Regulator reviewing the application
  identity: opaque
  exclusive_operations:
  - enter-safety-review
  - advance-phase
  - certify DCA
  - review/advance SAR
  - create/accept/reopen/supersede RAI
  shared_operations:
  - read DCA
  - SAR
  - RAI
  - test program
  - hearings
  - subscriptions
