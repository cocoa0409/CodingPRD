scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_defaults_and_derived_zero
        claim_type: Creation
        grounds:
          - entities.Project.fields.revised_contract_sum_cents
          - entities.Project.fields.default_retainage_pct
          - endpoints
        distinguishing_aspect: "POST /projects with required fields returns 201; revised_contract_sum_cents == original_contract_sum_cents (500000), retainage_held_cents == 0, status ACTIVE, version 1, default_retainage_pct defaults to 0.10 when omitted."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Tower", owner_user_id: "owner-1", original_contract_sum_cents: 500000 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "GET /projects/${proj}"
              payload: {}
              as: Owner
              as_user_id: "owner-1"
              captures: { st: $.data.status, rcs: $.data.revised_contract_sum_cents, held: $.data.retainage_held_cents, drp: $.data.default_retainage_pct, ver: $.data.version }
          assert:
            - "Project.${proj}.status == ACTIVE"
            - "Project.${proj}.revised_contract_sum_cents == 500000"
            - "Project.${proj}.retainage_held_cents == 0"
            - "Project.${proj}.default_retainage_pct == 0.10"
            - "Project.${proj}.version == 1"

      - name: get_project_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints
        distinguishing_aspect: "GET /projects/{id} with an unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Owner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_sov_line_missing_scheduled_value_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SovLine.fields.scheduled_value_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /sov-lines without scheduled_value_cents returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Project created."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "ReqP", owner_user_id: "owner-1", original_contract_sum_cents: 500000 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_sov_line_nonpositive_scheduled_value_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.SovLine.fields.scheduled_value_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /sov-lines with scheduled_value_cents == 0 violates the >0 constraint and returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Project created."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "ZeroP", owner_user_id: "owner-1", original_contract_sum_cents: 500000 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "X", scheduled_value_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: duplicate_item_no_on_sov_create_returns_duplicate
        claim_type: Type Constraints
        grounds:
          - entities.SovLine.fields.item_no
          - errors[ERR_DUPLICATE_ITEM_NO]
          - validations[priority=10]
        distinguishing_aspect: "Two SOV lines with item_no 001 in the same project: the second returns 409 ERR_DUPLICATE_ITEM_NO."
        test_recipe:
          setup:
            - "Project + one SOV line item_no 001."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "DupP", owner_user_id: "owner-1", original_contract_sum_cents: 500000 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "First", scheduled_value_cents: 300000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
          trigger:
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Second", scheduled_value_cents: 200000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_DUPLICATE_ITEM_NO"

      - name: pay_app_line_computed_fields_ignored_on_input
        claim_type: Computed Fields
        grounds:
          - entities.PayAppLine.fields.line_retainage_cents
          - entities.PayAppLine.fields.work_completed_previous_cents
        distinguishing_aspect: "PayAppLine.line_retainage_cents and work_completed_previous_cents are computed; the response reflects server computation (line_retainage 10000 on 100000 billed at 0.10), not any client value."
        test_recipe:
          setup:
            - "Project + SOV 001 sched 600000; PayApplication 1 created (ev 1)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "CompP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
          trigger:
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 100000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { lr: $.data.line_retainage_cents, prev: $.data.work_completed_previous_cents }
          assert:
            - "PayAppLine.line_retainage_cents == 10000  (0.10 * 100000)"
            - "PayAppLine.work_completed_previous_cents == 0  (no prior certified app)"

      - name: project_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
        distinguishing_aspect: "GET /projects returns response_type array with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup:
            - "Two projects created."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "L1", owner_user_id: "owner-1", original_contract_sum_cents: 100000 }
              as: Owner
              as_user_id: "owner-1"
            - call: "POST /projects"
              payload: { name: "L2", owner_user_id: "owner-1", original_contract_sum_cents: 200000 }
              as: Owner
              as_user_id: "owner-1"
          trigger:
            - call: "GET /projects"
              payload: {}
              as: Owner
              as_user_id: "owner-1"
          assert:
            - "response_type == array"
            - "envelope total_count >= 2 and has_more is a boolean"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: certify_from_draft_returns_invalid_state
        claim_type: Invalid Transition
        grounds:
          - state_machines.PayApplication.SUBMITTED_to_CERTIFIED
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_segregation_on_certify
          rationale: "Certifying a DRAFT pay application returning ERR_INVALID_STATE is exactly the asserted outcome of that §1.8 instance."

      - name: submit_already_submitted_pay_app_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.PayApplication.DRAFT_to_SUBMITTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting a PayApplication that is already SUBMITTED returns 409 ERR_INVALID_STATE (no DRAFT_to_SUBMITTED from SUBMITTED)."
        test_recipe:
          setup:
            - "Project + SOV; PayApplication 1 with one line, submitted."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "IdemP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 100000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
          trigger:
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: submit_pay_app_with_no_lines_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PayApplication.DRAFT_to_SUBMITTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting a DRAFT PayApplication with zero PayAppLines violates the 'at least one line' precondition and returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Project + SOV; PayApplication 1 created DRAFT, no lines."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "NoLineP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
          trigger:
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: substantial_completion_blocked_by_open_punch_item
        claim_type: guarded transitions
        grounds:
          - state_machines.Project.ACTIVE_to_SUBSTANTIALLY_COMPLETE
          - entities.PunchListItem.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Substantial completion with one OPEN punch item present is rejected ERR_INVALID_STATE (a certified app exists but the punch precondition fails)."
        test_recipe:
          setup:
            - "Project + SOV; PayApplication 1 certified; one PunchListItem created OPEN (never verified)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "ScGateP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 100000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
            - call: "POST /punch-items"
              payload: { project_id: "${proj}", location: "Roof", description: "Flashing", severity: "MAJOR" }
              as: Architect
              as_user_id: "arch-1"
              captures: { pi: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/substantial-completion"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Project.${proj}.status == ACTIVE  (unchanged)"

      - name: rfi_answer_sets_ball_in_court_contractor
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Rfi.OPEN_to_ANSWERED
          - entities.Rfi.fields.ball_in_court
        distinguishing_aspect: "Answering an OPEN RFI sets status ANSWERED, ball_in_court CONTRACTOR, and stores the answer text."
        test_recipe:
          setup:
            - "Project + one OPEN RFI."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "RfiP", owner_user_id: "owner-1", original_contract_sum_cents: 500000 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /rfis"
              payload: { project_id: "${proj}", subject: "Beam size", question: "W12 or W14?" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { rfi: $.data.id }
          trigger:
            - call: "POST /rfis/${rfi}/answer"
              payload: { answer: "Use W14." }
              as: Architect
              as_user_id: "arch-1"
              captures: { st: $.data.status, bic: $.data.ball_in_court, ans: $.data.answer }
          assert:
            - "Rfi.${rfi}.status == ANSWERED"
            - "Rfi.${rfi}.ball_in_court == CONTRACTOR"
            - "Rfi.${rfi}.answer == 'Use W14.'"

      - name: submittal_terminal_closed_locked
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Submittal.APPROVED_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A CLOSED submittal cannot be re-reviewed: POST /submittals/{id}/review on CLOSED returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Project + submittal reviewed APPROVED then CLOSED."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "SubTermP", owner_user_id: "owner-1", original_contract_sum_cents: 500000 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /submittals"
              payload: { project_id: "${proj}", spec_section: "05 12 00", title: "Steel shop drawings" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sub: $.data.id }
            - call: "POST /submittals/${sub}/review"
              payload: { decision: "APPROVED" }
              as: Architect
              as_user_id: "arch-1"
            - call: "POST /submittals/${sub}/close"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
          trigger:
            - call: "POST /submittals/${sub}/review"
              payload: { decision: "APPROVED" }
              as: Architect
              as_user_id: "arch-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: change_order_reject_no_ledger_mutation
        claim_type: Valid Transition
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_REJECTED
          - entities.Project.fields.revised_contract_sum_cents
        distinguishing_aspect: "Rejecting a SUBMITTED change order sets status REJECTED and leaves Project.revised_contract_sum_cents unchanged at 1000000 (branch divergence vs approve)."
        test_recipe:
          setup:
            - "Project + SOV; CO-1 (+150000) submitted."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "CoRejP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "Framing", scheduled_value_cents: 400000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /change-orders"
              payload: { project_id: "${proj}", co_number: "CO-1", change_order_amount_cents: 150000, line_edits: [ { action: "ADD", item_no: "003", description: "Extra", scheduled_value_delta_cents: 150000 } ] }
              as: Contractor
              as_user_id: "gc-1"
              captures: { co1: $.data.id }
            - call: "POST /change-orders/${co1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
          trigger:
            - call: "POST /change-orders/${co1}/reject"
              payload: {}
              as: Owner
              as_user_id: "owner-1"
              captures: { st: $.data.status }
          assert:
            - "ChangeOrder.${co1}.status == REJECTED"
            - "Project.${proj}.revised_contract_sum_cents == 1000000  (unchanged; no SovLine added)"

      - name: pay_app_reject_frees_application_number
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PayApplication.SUBMITTED_to_REJECTED
          - validations[priority=7]
        excluded_because:
          difficulty_instance: combinatorial_formula / g702_cpd_three_input_nonlinear_mode_a
          rationale: "That §1.8 instance rejects application 1 and reuses application_number 1 on the next create, exercising the free-the-number side effect."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: retention_waterfall_partial_lowest_item_first
        claim_type: Correct Result
        grounds:
          - calculations.retention_release_waterfall
          - entities.SovLine.fields.retainage_withheld_to_date_cents
        excluded_because:
          difficulty_instance: compensating_invariant / retainage_conservation_certify_then_release
          rationale: "The 40000 partial release draws item 001 (30000) fully then item 002 (10000), leaving 001=0 / 002=5000 — exactly the waterfall ordering asserted there."

      - name: commitment_invoice_sweep_unconditional_credits_largest_balance
        claim_type: Correct Result
        grounds:
          - calculations.commitment_invoice_sweep
          - entities.SubcontractorCommitment.fields.invoiced_to_date_cents
          - state_machines.LienWaiver.PENDING_to_EFFECTIVE
        distinguishing_aspect: "Notarizing an UNCONDITIONAL_PROGRESS waiver (amount 405000) credits the eligible OPEN commitment with the largest remaining balance; with a single 500000 commitment, invoiced_to_date_cents becomes 405000."
        test_recipe:
          setup:
            - "Project P certified app 1 (cpd 405000, project version 2); one OPEN SubcontractorCommitment committed 500000; an UNCONDITIONAL_PROGRESS LienWaiver (amount 405000, through 2026-01-31) created PENDING against app 1."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "SweepP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "Framing", scheduled_value_cents: 400000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov2: $.data.id }
            - call: "POST /subcontractor-commitments"
              payload: { project_id: "${proj}", subcontractor_name: "Acme", committed_amount_cents: 500000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sc: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 300000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov2}", work_completed_this_period_cents: 100000, materials_stored_cents: 50000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
            - call: "POST /lien-waivers"
              payload: { project_id: "${proj}", pay_app_id: "${app1}", waiver_type: "UNCONDITIONAL_PROGRESS", through_date: "2026-01-31T00:00:00.000Z", amount_cents: 405000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { lw: $.data.id }
          trigger:
            - call: "POST /lien-waivers/${lw}/notarize"
