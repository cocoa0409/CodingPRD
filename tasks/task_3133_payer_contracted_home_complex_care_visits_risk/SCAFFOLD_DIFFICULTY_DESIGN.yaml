  # ===========================================================================
  # Rule 3 — Non-linear state machine shape on DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: member_enrollment_outreach_declined_reengagement_cycle
        grounds:
          - state_machines.MemberEnrollment.transitions.OUTREACH_to_DECLINED
          - state_machines.MemberEnrollment.transitions.DECLINED_to_OUTREACH
          - state_machines.MemberEnrollment.transitions.OUTREACH_to_OUTREACH
        distinguishing_aspect: |
          MemberEnrollment exhibits TWO cycle types simultaneously: a
          self-loop (OUTREACH → OUTREACH via record-attempt) AND a
          back-edge (DECLINED → OUTREACH via begin-outreach on re-engagement).
          The outreach_attempts counter is RESET to 1 on the re-engagement
          edge but INCREMENTS on the self-loop, so the same target state
          (OUTREACH) carries different counter state depending on which edge
          was traversed.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Standard setup with member M and enrollment E in IDENTIFIED."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
              captures: { after_first_outreach_attempts: $.data.outreach_attempts }
            - call: "POST /enrollments/${enr_id}/record-attempt"
              payload: {}
              as: EngagementSpecialist
              captures: { after_self_loop_attempts: $.data.outreach_attempts, after_self_loop_status: $.data.status }
            - call: "POST /enrollments/${enr_id}/record-decline"
              payload: {}
              as: EngagementSpecialist
              captures: { after_decline_status: $.data.status }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
              captures: { after_reengage_attempts: $.data.outreach_attempts, after_reengage_status: $.data.status }
          assert:
            - "MemberEnrollment.${enr_id}.outreach_attempts == 1 after the first begin-outreach"
            - "MemberEnrollment.${enr_id}.outreach_attempts == 2 after record-attempt (self-loop INCREMENTS)"
            - "MemberEnrollment.${enr_id}.status == OUTREACH after the self-loop"
            - "MemberEnrollment.${enr_id}.status == DECLINED after record-decline"
            - "MemberEnrollment.${enr_id}.outreach_attempts == 1 after the second begin-outreach (re-engagement RESETS, not increments)"
            - "MemberEnrollment.${enr_id}.status == OUTREACH after re-engagement"

      - name: visit_cancelled_to_scheduled_reschedule_cycle
        grounds:
          - state_machines.Visit.transitions.SCHEDULED_to_CANCELLED
          - state_machines.Visit.transitions.CANCELLED_to_SCHEDULED
          - entities.Visit.fields.reschedule_count
        distinguishing_aspect: |
          Visit exhibits a back-edge (CANCELLED → SCHEDULED via reschedule),
          NOT a self-loop like MemberEnrollment. Each reschedule increments
          reschedule_count and DECREMENTS PerformanceMeasurement.visits_cancelled
          (compensating the +1 recorded at cancel). MAX_RESCHEDULES (2) caps
          the cycle; the third attempt is rejected with
          ERR_MAX_RESCHEDULES_EXCEEDED.
        test_recipe:
          setup:
            - "Standard ACTIVE enrollment; one SCHEDULED visit V."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 10, urgent_response_qualified: true }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_id}/record-consent"
              payload: { consent_document_id: "DOC-1" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "ROUTINE_FOLLOWUP", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: CareCoordinator
              captures: { v_id: $.data.id, v_v0: $.data.version }
          trigger:
            - call: "POST /visits/${v_id}/cancel"
              payload: { cancellation_reason: "MEMBER_REQUEST" }
              as: CareCoordinator
              captures: { after_cancel_status: $.data.status, after_cancel_v: $.data.version, after_cancel_rc: $.data.reschedule_count }
            - call: "POST /visits/${v_id}/reschedule"
              payload: { scheduled_start: "2026-09-06T09:00:00Z", scheduled_end: "2026-09-06T10:00:00Z", expected_visit_version: "${after_cancel_v}" }
              as: CareCoordinator
              captures: { after_rs1_status: $.data.status, after_rs1_rc: $.data.reschedule_count, after_rs1_v: $.data.version }
            - call: "POST /visits/${v_id}/cancel"
              payload: { cancellation_reason: "CLINICIAN_UNAVAILABLE" }
              as: CareCoordinator
              captures: { after_cancel2_v: $.data.version }
            - call: "POST /visits/${v_id}/reschedule"
              payload: { scheduled_start: "2026-09-08T09:00:00Z", scheduled_end: "2026-09-08T10:00:00Z", expected_visit_version: "${after_cancel2_v}" }
              as: CareCoordinator
              captures: { after_rs2_rc: $.data.reschedule_count, after_rs2_v: $.data.version }
            - call: "POST /visits/${v_id}/cancel"
              payload: { cancellation_reason: "MEMBER_REQUEST" }
              as: CareCoordinator
              captures: { after_cancel3_v: $.data.version }
            - call: "POST /visits/${v_id}/reschedule"
              payload: { scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", expected_visit_version: "${after_cancel3_v}" }
              as: CareCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "after first cancel: status == CANCELLED, reschedule_count == 0"
            - "after first reschedule: status == SCHEDULED, reschedule_count == 1"
            - "after second reschedule: reschedule_count == 2"
            - "third reschedule is rejected with 409 ERR_MAX_RESCHEDULES_EXCEEDED"
            - "Visit.${v_id}.reschedule_count == 2 (unchanged by the rejected third attempt)"
            - "GET /performance-measurements?member_id=${member_id} returns visits_cancelled == 1 (only the third cancel remains uncancelled-by-reschedule)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: visit_complete_cascades_to_member_score_and_performance_measurement
        grounds:
          - state_machines.Visit.transitions.IN_PROGRESS_to_COMPLETED
          - calculations.chronic_condition_burden_final
          - calculations.composite_performance_score
          - state_machines.VisitAssessment.transitions.SUBMITTED_to_LOCKED
        distinguishing_aspect: |
          Depth-4 cascade originating from POST /visits/{id}/complete:
          (1) Visit IN_PROGRESS→COMPLETED mutates Visit.
          (2) The Visit mutation cascades to VisitAssessment SUBMITTED→LOCKED.
          (3) The VisitAssessment LOCKED state enables Member.burden_score_final
              recomputation (the assessment is now in the eligible input set),
              mutating Member.risk_tier.
          (4) The Member mutation + the Visit COMPLETED state jointly update
              PerformanceMeasurement.visits_completed and recompute
              composite_score, mutating PerformanceMeasurement.
          Each link is caused by the PREVIOUS link, not by the original
          POST /visits/{id}/complete — this is a chain, not a fan-out.
        test_recipe:
          setup:
