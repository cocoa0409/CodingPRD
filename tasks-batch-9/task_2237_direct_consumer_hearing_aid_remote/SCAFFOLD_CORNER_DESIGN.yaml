            - "GET /devices/${dev_cf} returns data.status == \"ASSIGNED\" and data.device_order_id == ${ord_cf}"
            - "GET /device-orders/${ord_cf} returns data.version == 2"

      - name: sm_order_confirm_fit_blocked_when_payment_not_authorized
        claim_type: precondition_enforcement
        grounds: [state_machines.DeviceOrder.fulfillment_status.transitions.PENDING_FIT_CONFIRM_to_READY_TO_SHIP.preconditions, errors.ERR_DEPENDENT_STATE_NOT_READY]
        distinguishing_aspect: "With inventory and candidacy both satisfied and only payment_status still PENDING_AUTH, confirm-fit must fail with ERR_DEPENDENT_STATE_NOT_READY (409) and leave the pool counters untouched."
        test_recipe:
