              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s20: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 30, step_name: "LITHO-3", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s30: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
