            - { call: "POST /servicing/escrow-accounts/${acct1_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct1_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan1_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct1_id}/deposits", payload: { amount_cents: 200000, effective_date: "2026-08-02" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan1_id}/insurance-policies", payload: { policy_type: "HAZARD", carrier_name: "Carrier C", policy_number: "POL-FP-1", coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", annual_premium_cents: 120000 }, as: InsuranceSpecialist, as_user_id: "is_1", captures: { pol1_id: $.data.id } }
