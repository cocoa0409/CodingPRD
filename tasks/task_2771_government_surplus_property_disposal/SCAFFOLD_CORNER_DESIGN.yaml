      - name: ccl_cascading_side_effects_multi_hop_unwind_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Bidder.transitions[REGISTERED->DEBARRED].side_effects
        distinguishing_aspect: "The long unwind chain triggered by debarring a winning bidder — bid retraction, lot reopening, invoice voiding, asset return to AUCTION_ELIGIBLE and deposit restitution — is the cascading_side_effects layer's headline behaviour."
        excluded_because:
          difficulty_instance: tc_bidder_debarment_five_hop_unwind
          rationale: "That difficulty instance already drives the full five-hop cascade from a CLOSED_MET lot with a PARTIALLY_PAID invoice and asserts every hop plus the deposit-custody invariant, so a corner variant here would only re-run the same chain with different literals."

      - name: ccl_dual_variant_valuation_divergence_excluded
        claim_type: dual_variant_calculation
        grounds:
          - calculations.asset_fair_market_value.variants
        distinguishing_aspect: "One stored valuation feeds two variants whose outputs diverge — the transfer basis and the auction reserve read the same fair_market_value_cents through different multipliers and different rounding points."
        excluded_because:
          difficulty_instance: dv_asset_value_transfer_basis_vs_auction_reserve
          rationale: "That difficulty instance already pins both variants against a single asset and asserts that neither output can be derived from the other, which is exactly the claim this layer would test."

  - section: consistency_model
    instances:
      - name: cm_derived_values_are_readable_immediately_after_the_write_that_produces_them
        claim_type: read_your_writes
        grounds:
          - complexity_profile.consistency_model
          - calculations.asset_fair_market_value
          - calculations.auction_invoice_total
          - calculations.agency_proceeds_ledger_balance
        distinguishing_aspect: "Every derived money field in the sale chain is readable by the immediately following request, with no settle, refresh or recompute endpoint anywhere in the path: the valuation appears on the asset right after the assessment that produced it, the reserve and deposit requirement appear on the lot at creation, the invoice appears in a list read right after the close that created it, and the agency ledger balance moves on the posting call itself. Each read is a different endpoint from the write that caused the change, so a per-request cache would be caught."
