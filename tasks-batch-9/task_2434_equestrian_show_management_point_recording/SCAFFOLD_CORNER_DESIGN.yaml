      - name: license_revision_cycle_loop_bound
        claim_type: cyclic
        grounds:
          - state_machines.Show
        excluded_because:
          difficulty_instance: license_revision_cycle_escalates_to_denied
          rationale: |
            That §1.8 instance already walks DRAFT -> SUBMITTED -> RETURNED twice and
            asserts revision_count 1, 2 and the forced DENIED at the third decision,
            which is exactly the cyclic-shape claim (loop works, termination condition
            respected). A second corner instance would restate it.

      - name: entry_parallel_dimension_independence
        claim_type: parallel
        grounds:
          - state_machines.Entry
        excluded_because:
          difficulty_instance: entry_parallel_dimensions_join_at_class_entry_confirmed
          rationale: |
            The §1.8 instance drives the verification and settlement dimensions in
            both interleavings and asserts that ClassEntry.CONFIRMED appears only at
            the (ACCEPTED, PAID) join, covering both the independence and the
            combined-state claims for the parallel shape.

      - name: footing_hold_cascade_down_chain
        claim_type: cascade_down
        grounds:
          - state_machines.Ring.AVAILABLE_to_MAINTENANCE_HOLD
        excluded_because:
          difficulty_instance: footing_hold_unwinds_schedule_and_official_load
          rationale: |
            The §1.8 instance verifies the whole Ring -> RingSlot -> ShowClass ->
            OfficialAssignment -> Official.assigned_minutes chain, including that
            already-COMPLETED slots are left alone, which is the cascade-down claim
            (parent change reaches children, terminal children untouched).

      - name: positive_finding_cross_entity_fanout
        claim_type: cross_entity
        grounds:
          - state_machines.ComplianceCase.OPEN_to_SUBSTANTIATED
        excluded_because:
          difficulty_instance: positive_drug_finding_unwinds_results_and_prize_ledger
          rationale: |
            The §1.8 instance follows the POSITIVE finding into Horse, ClassEntry,
            ShowClass, Rider standings and the Show prize ledger and checks each
            adjusted field, which is the cross-entity side-effect claim in full.

      - name: stall_ledger_sync_on_accept_and_release
        claim_type: ledger_sync
        grounds:
          - state_machines.Entry.settlement_dimension
        excluded_because:
          difficulty_instance: stall_reservation_withdrawal_zero_drift
          rationale: |
            The §1.8 instance reconciles Show.reserved_stall_count and
            available_stall_count before, during and after a withdrawal and asserts
            zero drift against the capacity invariant, which is the ledger-sync claim.

