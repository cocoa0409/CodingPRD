      - name: address_feedback_release_closes_every_classified_return_and_a_second_release_is_rejected
        claim_type: action_endpoint
        grounds: [endpoints.POST_clients_id_address_feedback, validations.ERR_NO_PENDING_FEEDBACK]
        distinguishing_aspect: "One release sweeps both classification branches at once - the ADDRESS_UPDATED and the UNRESOLVED return move to FEEDBACK_SENT under a single feedback_batch_seq and the pending counter drops to zero - so an immediate second release has nothing left to send."
        test_recipe:
          setup:
            - "Client CL-E3 (dr_readiness_required false) with ACTIVE template T-E3 (FIRST_CLASS, sheets_per_document 1)."
            - "A two-record file composed into two COMPOSED pieces (a return can be scanned against any piece that is neither SUPPRESSED nor VOID)."
            - "Piece 1 is returned MOVED_NO_FORWARD and classified with both corrections (ADDRESS_UPDATED); piece 2 is returned DECEASED with both corrections supplied, which the fork discards (UNRESOLVED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-E3", name: "Feedback Batch Bancshares", dr_readiness_required: false }
              as: BureauAdmin
              captures: { e3_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${e3_client_id}", template_code: "T-E3", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { e3_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${e3_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${e3_client_id}", file_name: "e3.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 8000 }
              as: ClientLiaison
              captures: { e3_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${e3_file_id}", account_ref: "ABC3201", sequence_no: 1, statement_amount_cents: 4000, address_line1: "3400 Return Row", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3401" }
              as: ClientLiaison
              captures: { e3_record_1: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${e3_file_id}", account_ref: "ABC3202", sequence_no: 2, statement_amount_cents: 4000, address_line1: "3402 Return Row", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3402" }
              as: ClientLiaison
              captures: { e3_record_2: "$.data.id" }
            - call: "POST /bureau/data-files/${e3_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${e3_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${e3_file_id}", template_id: "${e3_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { e3_job_id: "$.data.id" }
            - call: "GET /bureau/mail-pieces?composition_job_id=${e3_job_id}"
              payload: {}
              as: IntegrityAuditor
              captures: { e3_piece_1: "$.data[0].id", e3_piece_2: "$.data[1].id" }
            - call: "POST /bureau/undeliverable-returns"
              payload: { mail_piece_id: "${e3_piece_1}", reason_code: "MOVED_NO_FORWARD" }
              as: IntegrityAuditor
              captures: { e3_return_1: "$.data.id" }
            - call: "POST /bureau/undeliverable-returns"
              payload: { mail_piece_id: "${e3_piece_2}", reason_code: "DECEASED" }
              as: IntegrityAuditor
              captures: { e3_return_2: "$.data.id" }
            - call: "POST /bureau/undeliverable-returns/${e3_return_1}/classify"
              payload: { corrected_address_line1: "3500 Forwarding Lane", corrected_postal_code: "30302" }
              as: IntegrityAuditor
              captures: { e3_disp_1: "$.data.disposition" }
            - call: "POST /bureau/undeliverable-returns/${e3_return_2}/classify"
              payload: { corrected_address_line1: "3502 Forwarding Lane", corrected_postal_code: "30303" }
              as: IntegrityAuditor
              captures: { e3_disp_2: "$.data.disposition" }
            - call: "GET /bureau/clients/${e3_client_id}"
              payload: {}
              as: ClientLiaison
              captures: { e3_pending_before: "$.data.pending_address_feedback_count" }
          trigger:
            - call: "POST /bureau/clients/${e3_client_id}/address-feedback"
              payload: { note: "August correction file" }
              as: ClientLiaison
              captures: { e3_batches: "$.data.address_feedback_batch_count", e3_pending_after: "$.data.pending_address_feedback_count" }
            - call: "GET /bureau/undeliverable-returns/${e3_return_1}"
