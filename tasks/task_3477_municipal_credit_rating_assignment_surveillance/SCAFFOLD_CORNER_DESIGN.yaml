        distinguishing_aspect: "Every single-resource GET maps an unknown well-formed UUID to its typed 404: ERR_UNDERWRITER_NOT_FOUND, ERR_ENGAGEMENT_NOT_FOUND, ERR_CRITERIA_VERSION_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_RATING_NOT_FOUND, ERR_APPEAL_NOT_FOUND, ERR_OBLIGATION_NOT_FOUND, ERR_BOND_SALE_NOT_FOUND, ERR_REVIEW_ITEM_NOT_FOUND (issuer 404 is covered by the entities-section instance)."
