# =============================================================================
# §1.9 Scaffold Corner Design — self-order-kiosk-content-ops (task 2931)
#
# Breadth probe: a row-by-row walk of references/claim-extraction-guide.md against
# SCAFFOLD.yaml §1.1-§1.7. Depth (the nine §0.5 reasoning rules) lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already asserted there are emitted here
# as `excluded_because:` stubs with no test_recipe.
#
# Canonical fixture facts reused below (identical to the difficulty design so the two
# files stay replayable side by side):
#   ZONE_A  price_multiplier_bp 11000, psychological_rounding NINE_ENDING, tax_rate_bp 875,
#           max_uplift_bp 1500                     -> Item A (base 500) is 559, Item B (310) is 349
#   ZONE_B  price_multiplier_bp 12000, rounding NONE, tax_rate_bp 700, max_uplift_bp 2000
#                                                   -> Item A is 600
#   Store S001 timezone_offset_minutes -300; clock 2026-08-05T17:00:00Z -> local minute 720,
#           inside the LUNCH slot [660, 960) with buffer 15 -> phase ACTIVE
#   Logical clock before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_price_zone_returns_201_with_envelope_and_all_declared_fields
        claim_type: creation
        grounds:
          - entities.PriceZone
          - endpoints.POST_/kiosk-ops/price-zones
          - response_envelope.success
        distinguishing_aspect: "POST /kiosk-ops/price-zones with every required field returns 201, response_type object, meta.api_request_id and meta.api_request_timestamp, and a data object carrying all declared PriceZone fields."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-05T17:00:00Z."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id, zone_ver: $.data.version }
          assert:
            - "HTTP 201; meta.api_request_id and meta.api_request_timestamp are present and response_type == object"
            - "data.zone_code == ZONE_A, data.currency_code == USD, data.price_multiplier_bp == 11000, data.psychological_rounding == NINE_ENDING, data.tax_rate_bp == 875, data.max_uplift_bp == 1500"
            - "${zone_id} is a non-empty string and ${zone_ver} == 1; data.created_at == data.updated_at == 2026-08-05T17:00:00Z (the logical clock, never wall-clock time)"

      - name: get_price_zone_by_id_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.PriceZone
          - endpoints.GET_/kiosk-ops/price-zones/{price_zone_id}
        distinguishing_aspect: "GET /kiosk-ops/price-zones/{price_zone_id} returns exactly the row POST created, with the same id and version and no re-derivation."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; one PriceZone ZONE_B exists (x1.20, rounding NONE, tax 700 bp, cap 2000 bp)."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_B", currency_code: "USD", price_multiplier_bp: 12000, psychological_rounding: "NONE", tax_rate_bp: 700, max_uplift_bp: 2000 }
              as: PlatformAdmin
              captures: { zone_b_id: $.data.id, zone_b_ver: $.data.version }
          trigger:
            - call: "GET /kiosk-ops/price-zones/${zone_b_id}"
              payload: {}
              as: ContentManager
              captures: { fetched_id: $.data.id, fetched_ver: $.data.version }
          assert:
            - "HTTP 200 with ${fetched_id} == ${zone_b_id} and ${fetched_ver} == ${zone_b_ver} == 1"
            - "data.price_multiplier_bp == 12000, data.psychological_rounding == NONE, data.tax_rate_bp == 700, data.max_uplift_bp == 2000"
            - "a read does not bump version and does not change updated_at"

      - name: list_menu_items_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/kiosk-ops/menu-items
          - response_envelope.pagination_fields
        distinguishing_aspect: "With 3 MenuItems stored, GET /kiosk-ops/menu-items?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; exactly three MenuItems exist: SKU-BURGER (ENTREE), SKU-FRIES (SIDE) and SKU-PIE (DESSERT), created in that order."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-FRIES", display_name: "Seasoned Fries", category: "SIDE", base_price_cents: 310, screen_reader_text: "Seasoned fries", contrast_ratio: 6.2 }
              as: ContentManager
              captures: { item_b_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-PIE", display_name: "Apple Pie", category: "DESSERT", base_price_cents: 200, screen_reader_text: "Apple pie", contrast_ratio: 5.4 }
              as: ContentManager
              captures: { item_c_id: $.data.id }
          trigger:
            - call: "GET /kiosk-ops/menu-items?limit=2&offset=0"
              payload: {}
              as: ContentManager
              captures: { first_page_head: "$.data[0].sku" }
            - call: "GET /kiosk-ops/menu-items?limit=2&offset=2"
              payload: {}
              as: ContentManager
              captures: { second_page_head: "$.data[0].sku" }
            - call: "GET /kiosk-ops/menu-items?category=SIDE"
              payload: {}
              as: ContentManager
              captures: { filtered_head: "$.data[0].id" }
          assert:
            - "page 1: response_type == array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0 and ${first_page_head} == SKU-BURGER"
            - "page 2: exactly 1 row, total_count == 3, has_more == false and ${second_page_head} == SKU-PIE"
            - "${filtered_head} == ${item_b_id} and the category filter response has total_count == 1"
            - "the union of both pages is exactly the three ids ${item_a_id}, ${item_b_id}, ${item_c_id} with no duplicates"

      - name: get_device_with_unknown_id_returns_resource_not_found
        claim_type: not_found
        grounds:
          - validations.priority_5_ERR_RESOURCE_NOT_FOUND
          - endpoints.GET_/kiosk-ops/devices/{device_id}
        distinguishing_aspect: "A path parameter that resolves to no row returns ERR_RESOURCE_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; no Device rows exist."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /kiosk-ops/devices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_RESOURCE_NOT_FOUND and response_type == error"
            - "data.message is a non-empty string and no Device fields are echoed"

      - name: create_store_missing_price_zone_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_7_ERR_INVALID_REQUEST
          - endpoints.POST_/kiosk-ops/stores
        distinguishing_aspect: "price_zone_id is a required input on POST /kiosk-ops/stores; omitting it returns ERR_INVALID_REQUEST (400) and creates nothing."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; cluster CL_WEST exists; no Store rows exist."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /kiosk-ops/stores?cluster_id=${cl_id} returns total_count 0"

      - name: register_device_applies_declared_defaults_for_omitted_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Device.fields.cache_state
          - entities.Device.fields.health_state
          - entities.Device.fields.pin_pad_firmware_version
          - endpoints.POST_/kiosk-ops/devices
        distinguishing_aspect: "Registering a MENU_BOARD without the optional pin_pad_firmware_version yields pin_pad_firmware_version null, health_state OFFLINE, cache_state MISSING, cached_bundle_version 0, consecutive_missed_heartbeats 0, offline_order_count 0 and payment_compliance_state NOT_APPLICABLE."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST and store S001 exist; no Device rows yet."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "MENU_BOARD", device_code: "B001", offline_cache_capacity: 0 }
              as: PlatformAdmin
              captures: { board_id: $.data.id, board_cache: $.data.cache_state, board_health: $.data.health_state, board_pay: $.data.payment_compliance_state, board_fw: $.data.pin_pad_firmware_version }
          assert:
            - "HTTP 201; ${board_cache} == MISSING, ${board_health} == OFFLINE, ${board_pay} == NOT_APPLICABLE and ${board_fw} is null"
            - "data.cached_bundle_id is null, data.cached_bundle_version == 0, data.consecutive_missed_heartbeats == 0, data.offline_order_count == 0"
            - "data.printer_ok, data.touch_ok, data.screen_reader_ok and data.network_ok are all false, and data.last_heartbeat_utc is null"
            - "Store.${store_id}.content_posture is re-derived and is FROZEN (no PUBLISHED bundle in the chain)"

      - name: create_availability_computes_available_units_and_supply_state
        claim_type: computed_fields
        grounds:
          - calculations.availability_rollup
          - entities.StoreItemAvailability.fields.available_units
          - endpoints.POST_/kiosk-ops/stores/{store_id}/item-availabilities
        distinguishing_aspect: "available_units is computed as on_hand_units - reserved_units (30 - 6 = 24) and supply_state/availability_state are derived from it; the client supplies neither."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001 and Item A exist."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 30, reserved_units: 6, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { avail_id: $.data.id, units: $.data.available_units, supply: $.data.supply_state, avail_state: $.data.availability_state, listing: $.data.listing_state, sync: $.data.last_sync_utc }
          assert:
            - "HTTP 201; ${units} == 24, ${supply} == IN_STOCK (24 > threshold 4), ${avail_state} == AVAILABLE and ${listing} == LISTED"
            - "data.eighty_six_state == NONE and ${sync} == 2026-08-05T17:00:00Z (the logical clock)"
            - "MenuItem.${item_a_id}.chainwide_availability_state == AVAILABLE after the rollup"

      - name: create_store_cluster_stamps_system_id_created_at_and_version
        claim_type: system_fields
        grounds:
          - entities.StoreCluster
          - endpoints.POST_/kiosk-ops/store-clusters
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server: version starts at 1 and created_at equals the logical clock 2026-08-05T17:00:00Z, not wall-clock time."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; no StoreCluster rows exist."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_NATIONAL", tier: "NATIONAL" }
              as: ContentManager
              captures: { cl_id: $.data.id, cl_ver: $.data.version, cl_created: $.data.created_at }
          assert:
            - "HTTP 201; ${cl_ver} == 1 and ${cl_created} == 2026-08-05T17:00:00Z"
            - "data.updated_at == 2026-08-05T17:00:00Z and data.parent_cluster_id is null, data.chain_depth == 1, data.published_bundle_version == 0"
            - "${cl_id} is echoed unchanged by GET /kiosk-ops/store-clusters/${cl_id}"

      - name: daypart_slot_with_end_minute_1440_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.priority_7_ERR_INVALID_REQUEST
          - endpoints.POST_/kiosk-ops/content-bundles/{bundle_id}/daypart-slots
        distinguishing_aspect: "minute-of-day inputs are constrained to 0..1439, so end_minute_of_day 1440 returns ERR_INVALID_REQUEST (400) and leaves the bundle's daypart_slots empty and its version unchanged."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; cluster CL_WEST has one DRAFT ContentBundle with no slots."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bundle_ver: $.data.version }
          trigger:
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bundle_ver}", daypart_code: "LATE", start_minute_of_day: 1320, end_minute_of_day: 1440, layout_code: "LATE_GRID", buffer_minutes: 10, category_codes: ["ENTREE"] }
              as: ContentManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST (1440 is outside 0..1439)"
            - "ContentBundle.${bundle_id}.daypart_slots is empty and version == ${bundle_ver} (a rejected request never bumps the OCC parent)"
            - "the same call with end_minute_of_day 1439 is accepted, proving the boundary is the only cause"

      - name: audit_events_are_append_only_and_carry_no_version_field
        claim_type: immutability
        grounds:
          - entities.AuditEvent
          - endpoints.GET_/kiosk-ops/audit-events
        distinguishing_aspect: "AuditEvent declares common_fields false: §1.5 exposes only a list endpoint for it, rows carry sequence_no but no version and no update path exists, so the trail can only grow."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001 and Item A exist with an availability row of 40 units."
            - "One EIGHTY_SIX action has been performed, so at least one AuditEvent exists."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 40, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { avail_id: $.data.id }
            - call: "POST /kiosk-ops/item-availabilities/${avail_id}/actions"
              payload: { action: "EIGHTY_SIX", eighty_six_reason: "Grill down", until_utc: "2026-08-05T21:00:00Z" }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "GET /kiosk-ops/audit-events?subject_kind=ITEM_AVAILABILITY&subject_id=${avail_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { first_seq: "$.data[0].sequence_no", first_action: "$.data[0].action", first_role: "$.data[0].actor_role" }
          assert:
            - "HTTP 200 with total_count >= 1, ${first_action} == ITEM_EIGHTY_SIXED and ${first_role} == StoreOperator"
            - "${first_seq} == 1 and rows are ordered by sequence_no ascending"
            - "each returned row exposes subject_kind, subject_id, action, actor_role, actor_user_id and at_utc but NO version and NO updated_at field"
            - "data[0].at_utc == 2026-08-05T17:00:00Z and §1.5 declares no POST, PUT, PATCH or DELETE endpoint under /kiosk-ops/audit-events"

      - name: create_store_with_unknown_cluster_id_returns_referenced_entity_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_6_ERR_REFERENCED_ENTITY_NOT_FOUND
          - entities.Store.fields.cluster_id
        distinguishing_aspect: "cluster_id is a body foreign key, so an unresolvable value returns ERR_REFERENCED_ENTITY_NOT_FOUND (404) — distinct from the path-parameter error ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A exists but no StoreCluster rows exist."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "00000000-0000-4000-8000-0000000000aa", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_REFERENCED_ENTITY_NOT_FOUND, not ERR_RESOURCE_NOT_FOUND and not ERR_INVALID_REQUEST"
            - "GET /kiosk-ops/stores returns total_count 0"

      - name: upsell_rule_closing_a_suggestion_cycle_is_rejected
        claim_type: graph
        grounds:
          - errors.ERR_UPSELL_CYCLE_DETECTED
          - validations.priority_23_ERR_UPSELL_CYCLE_DETECTED
          - endpoints.POST_/kiosk-ops/upsell-rules
        distinguishing_aspect: "entity_topology is graph: UpsellRule forms a MenuItem->MenuItem digraph per cluster that must stay acyclic, so A->B plus B->C are accepted and C->A is rejected with ERR_UPSELL_CYCLE_DETECTED (422)."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; cluster CL_WEST and three MenuItems A (ENTREE), B (SIDE), C (DESSERT) exist."
            - "Two ACTIVE UpsellRules already exist in CL_WEST: A -> B in suggestion_slot 1 and B -> C in suggestion_slot 2."
