      - name: aftermarket_substitution_issue_succeeds
        claim_type: satisfaction_pass
        grounds: [state_machines.Quote.DRAFT_to_ISSUED, entities.Part.fields.aftermarket_allowed]
        distinguishing_aspect: "Valid substitution (target OBSOLETE + aftermarket_allowed, substitute ACTIVE) issues cleanly."
        test_recipe:
          setup: ["P1 OBSOLETE aftermarket_allowed=true; P2 ACTIVE; quote line {P2, substitution_for_part_id P1}"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Zapata", account_number: "ZA-340", credit_limit_cents: 99999999, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-3401", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /parts", payload: { part_number: "TRIM-O2", description: "OEM trim", unit_price_cents: 5000, aftermarket_allowed: true }, as: ServiceManager, captures: { p1: $.data.id } }
            - { call: "POST /parts", payload: { part_number: "TRIM-AM2", description: "Aftermarket trim", unit_price_cents: 4000 }, as: ServiceManager, captures: { p2: $.data.id } }
