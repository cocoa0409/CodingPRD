          assert:
            - "the first accept fails 409 with error_id == ERR_TERRITORY_NOT_ACTIVE - PROBATION is not ACTIVE, even though the quote is PRESENTED and the clock is far below expires_at 2026-08-17T12:00:00.000Z"
            - "the refusal writes nothing: Quote.${q1}.status == PRESENTED, accepted_at == null, Lead.${l1}.status == ROUTED, Territory.${t1}.net_sales_cents == 0, royalty_accrued_cents == 0 and the ledger is empty"
            - "restoring Territory.${t1}.status == ACTIVE does not touch the quote: expires_at is still 2026-08-17T12:00:00.000Z and revision_count is still 0"
            - "the second accept succeeds 200 with Quote.${q1}.status == ACCEPTED, net_sales_cents == 4960 and recognized_net_sales_cents == 4960"
            - "Territory.${t1}.net_sales_cents == 4960 and royalty_accrued_cents == 273; exactly one NET_SALES_ROYALTY row exists with amount_cents 273 / basis_cents 4960 / memo 'quote_accepted'"
            - "Lead.${l1}.status == CONVERTED and Territory.${t1}.open_leads_count == 0"

  # -------------------------------------------------------------------
  # Rule 8 - resource_temporal_overlap
  # -------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: designer_calendar_is_half_open_with_a_conditional_travel_buffer
        grounds:
          - calculations.designer_calendar_conflict_set
          - validations.priority_42_ERR_DESIGNER_CALENDAR_CONFLICT
          - entities.Consultation.fields.service_postal_code
          - endpoints.POST_blinds_consultations
        distinguishing_aspect: |
          The contended resource is ONE PERSON'S time, the intervals are HALF-OPEN, and the
          separation required is CONDITIONAL on a non-temporal attribute: zero minutes inside
          one postal code, 45 minutes across postal codes. A 44-minute-59.999-second gap is
          refused, exactly 45 minutes is admitted, and a zero-minute gap in the same postal
          code is admitted - three different verdicts from one existing appointment.
        test_recipe:
          setup:
            - "One ACTIVE territory covering postal codes 30301 and 30302 with lead_capacity_per_week 5, and one ACTIVE designer."
            - "Three ROUTED leads so each accepted appointment has its own lead."
            - "One existing SCHEDULED consultation C1 occupying [2026-08-05T14:00:00.000Z, 2026-08-05T15:00:00.000Z) with service_postal_code 30301."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301", "30302"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Bo Chen", postal_code: "30302", source: "REFERRAL", requested_at: "2026-08-01T09:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l2: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Cy Doyle", postal_code: "30302", source: "WALK_IN", requested_at: "2026-08-01T10:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l3: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-05T14:00:00.000Z", scheduled_end_at: "2026-08-05T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l2}", designer_id: "${d1}", scheduled_start_at: "2026-08-05T15:00:00.000Z", scheduled_end_at: "2026-08-05T16:00:00.000Z", service_postal_code: "30302" }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_zero_gap: $.data.error_id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l2}", designer_id: "${d1}", scheduled_start_at: "2026-08-05T15:44:59.999Z", scheduled_end_at: "2026-08-05T16:44:59.999Z", service_postal_code: "30302" }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_short_gap: $.data.error_id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l2}", designer_id: "${d1}", scheduled_start_at: "2026-08-05T15:45:00.000Z", scheduled_end_at: "2026-08-05T16:45:00.000Z", service_postal_code: "30302" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c2: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l3}", designer_id: "${d1}", scheduled_start_at: "2026-08-05T16:45:00.000Z", scheduled_end_at: "2026-08-05T17:45:00.000Z", service_postal_code: "30302" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c3: $.data.id }
          assert:
            - "the 15:00 start in postal 30302 fails 409 with error_id == ERR_DESIGNER_CALENDAR_CONFLICT - back-to-back is legal only inside one postal code, and this pair needs 45 minutes"
            - "the 15:44:59.999 start in postal 30302 also fails 409 with ERR_DESIGNER_CALENDAR_CONFLICT - the gap is one millisecond short of the 45-minute buffer"
            - "the 15:45:00.000 start in postal 30302 succeeds 201: Consultation.${c2}.status == SCHEDULED - a gap of exactly 45 minutes is admissible"
            - "the 16:45:00.000 start in postal 30302 succeeds 201: Consultation.${c3}.status == SCHEDULED - it is back-to-back with ${c2} in the SAME postal code (buffer 0, half-open end) and 105 minutes clear of ${c1}"
            - "the two refusals wrote nothing: GET /blinds/consultations?designer_id=${d1} returns total_count 3 (${c1}, ${c2}, ${c3})"
            - "Lead.${l2}.status == ROUTED with exactly one consultation (${c2}) - the failed attempts consumed no lead capacity, and Territory.${t1}.open_leads_count == 3"

      - name: vendor_capacity_counts_closed_production_windows_that_share_a_single_date
        grounds:
          - calculations.vendor_capacity_window
          - calculations.vendor_lead_time
          - validations.priority_44_ERR_VENDOR_CAPACITY_EXCEEDED
          - entities.Vendor.fields.concurrent_capacity
          - entities.VendorOrder.fields.promised_ship_date
        distinguishing_aspect: |
          The contended resource is a FACTORY across whole calendar DATES, and the intervals
          are CLOSED on both ends and counted as an aggregate load rather than compared
          pairwise: two windows that share exactly one date - the first order's promised ship
          date equalling the second's effective placement date - breach a capacity of 1,
          while windows that merely touch (08-15 then 08-16) do not.
        test_recipe:
          setup:
            - "One ACTIVE territory with a large credit limit, one ACTIVE designer, one vendor with base_lead_time_days 10, cutoff_hour_utc 15 and concurrent_capacity 1."
            - "One consultation with two identical LT-SHEER / CORDED openings measured INSIDE at 24.000 x 48.000 (list 4960 each), quoted and accepted at 2026-08-05T09:00:00.000Z."
            - "The first opening is placed at 2026-08-05T09:00:00.000Z and left PLACED - never shipped - so it keeps occupying the closed window [2026-08-05, 2026-08-15]."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/vendors"
              payload: { name: "Ridgeline Shade Works", base_lead_time_days: 10, motorization_extra_days: 3, cutoff_hour_utc: 15, remake_policy: "SHARED_50_50", concurrent_capacity: 1, supported_lift_systems: ["CORDED", "CORDLESS"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { v1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-04T14:00:00.000Z", scheduled_end_at: "2026-08-04T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Guest left", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Guest right", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o2: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED", motorization_option: "NONE" }
              as: Designer
              as_user_id: "${d1}"
            - call: "PATCH /blinds/openings/${o2}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED", motorization_option: "NONE" }
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv1: $.data.version }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv1}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/quotes/${q1}/accept"
              as: Designer
              as_user_id: "${d1}"
              captures: { qv1: $.data.version }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}"], expected_quote_version: "${qv1}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "GET /blinds/quotes/${q1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { qv2: $.data.version }
          trigger:
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o2}"], expected_quote_version: "${qv2}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_capacity: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o2}"], expected_quote_version: "${qv2}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord2: $.data.id }
          assert:
            - "the occupying order is VendorOrder.${ord1} with effective_placement_date == 2026-08-05, promised_ship_date == 2026-08-15 and status == PLACED"
            - "the placement attempted at 2026-08-15T09:00:00.000Z would occupy [2026-08-15, 2026-08-25] and fails 409 with error_id == ERR_VENDOR_CAPACITY_EXCEEDED - the single shared date 2026-08-15 already carries load 1 against concurrent_capacity 1"
            - "the identical placement one day later succeeds 201: VendorOrder.${ord2}.effective_placement_date == 2026-08-16 and promised_ship_date == 2026-08-26 - closed windows that merely abut do not overlap"
            - "the refusal wrote nothing at all: the successful call reuses the SAME captured quote version ${qv2}, so the failed attempt did not bump Quote.${q1}.version"
            - "VendorOrder.${ord2}.lead_time_days == 10 (unchanged by the retry) and order_cost_cents == 2083"
            - "Territory.${t1}.open_order_exposure_cents == 4166 with both orders outstanding, and GET /blinds/vendor-orders?quote_id=${q1} returns total_count 2"

      - name: sample_kit_holds_are_closed_intervals_that_survive_an_early_return
        grounds:
          - validations.priority_43_ERR_SAMPLE_KIT_HOLD_CONFLICT
          - state_machines.SampleCheckout.OPEN_to_RETURNED
          - state_machines.SampleKit.ON_LOAN_to_AVAILABLE
          - calculations.sample_late_fee
          - calculations.sample_loan_conservation
        distinguishing_aspect: |
          The contended resource is a PHYSICAL KIT and the reservation is a CLOSED instant
          interval that keeps blocking after the kit is physically back: a hold beginning
          exactly on a returned hold's hold_end_at still collides, and one millisecond later
          does not. Unlike the designer calendar this ledger counts promises rather than
          occupancy, and unlike the vendor window it compares instants, not dates.
        test_recipe:
          setup:
            - "One ACTIVE territory, one ACTIVE designer, one ROUTED lead, one SCHEDULED consultation, and one sample kit with replacement_value_cents 50000."
            - "One checkout CO1 holding the kit over the closed interval [2026-08-03T09:00:00.000Z, 2026-08-07T17:00:00.000Z]."
            - "The kit is handed back EARLY at 2026-08-04T10:00:00.000Z, so CO1 is RETURNED with days_late 0 and the kit is AVAILABLE again - but its recorded hold still runs to 2026-08-07T17:00:00.000Z."
            - "The clock is then set to 2026-08-05T09:00:00.000Z so both candidate holds start in the future."
