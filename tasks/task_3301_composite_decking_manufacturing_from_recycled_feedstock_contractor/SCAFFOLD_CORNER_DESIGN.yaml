  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_version_on_allocation_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-commitment-stale-plant]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Two strictly sequential allocation creates: the first bumps Plant.version; the second, carrying the now-stale captured version, is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Plant (version captured), line, price book, dealer."
          setup_api_calls:
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 10000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "Transcend", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/price-books"
              payload: { name: "PB26", effective_from: "2026-01-01", base_prices: { "${line_id}": 500 }, tier_discounts_bp: { STANDARD: 0, PREFERRED: 1000 } }
              as: ChannelManager
              captures: { pb_id: $.data.id }
            - call: "POST /decking/dealers"
              payload: { name: "Dealer D", territory_code: "VA-N", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { dealer_id: $.data.id }
          trigger:
            - call: "POST /decking/plants/${plant_id}/allocation-commitments"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", reserved_lf: 100, price_book_id: "${pb_id}", expected_plant_version: "${plant_v0}" }
              as: DealerSalesRep
              captures: { ac1: $.data.id }
            - call: "POST /decking/plants/${plant_id}/allocation-commitments"
