  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: provisional_plus_final_invoice_amounts_conserved_across_supersede
        grounds:
          - state_machines.Invoice.OPEN_to_VOID
          - state_machines.AssistRequest.IN_SERVICE_to_COMPLETED
          - entities.Invoice.fields.amount_cents
          - entities.Invoice.fields.supersedes_invoice_id
        distinguishing_aspect: |
          Conserved quantity: sum of amounts across NON-VOID invoices attached to an AssistRequest.
          At SUBMIT exactly one OPEN PROVISIONAL invoice exists; at COMPLETED the PROVISIONAL
          transitions to VOID and a FINAL of (typically) different amount becomes the unique OPEN
          invoice. Invariant: count(OPEN invoices per AssistRequest) == 1 throughout the lifecycle,
          and the OPEN invoice's amount is always the most-recently-computed charge.
        test_recipe:
          setup:
            - "Standard 1-leg setup; walk through SUBMIT (PROVISIONAL open)"
            - "Walk through COMPLETED (PROVISIONAL voided, FINAL open)"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "SLC", tz_offset_minutes: -360, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "1", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "DL9", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-20T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "P SLC", dob: "1980-01-01", mobility_code: "WCHR", airline_pnr: "SLC1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "MEET_ARRIVAL", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
            - call: "GET /maa/assist-requests/${req_id}/invoices"
              as: BillingClerk
              captures: { prov_inv_id: "$.data[0].id", prov_amount: "$.data[0].amount_cents", prov_status: "$.data[0].status" }
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "SLC Ag", tsa_cleared_until: "2027-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: true, shift_start_utc: "2026-06-20T08:00:00Z", shift_end_utc: "2026-06-20T20:00:00Z" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-SLC-1", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Dispatcher
              captures: { req_v2: $.data.version }
            - call: "POST /maa/legs/${leg_id}/dispatch"
              payload: { expected_assist_request_version: "${req_v2}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "ARRIVE_PICKUP" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "DEPART_PICKUP" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "ARRIVE_GATE" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "HANDOFF" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/segments/${seg_id}/events"
              payload: { event_type: "LANDED", actual_utc: "2026-06-20T10:00:00Z" }
              as: OpsManager
          trigger:
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "COMPLETE" }
              as: Confirmer
              as_user_id: "conf_slc"
            - call: "GET /maa/assist-requests/${req_id}/invoices"
              as: BillingClerk
              captures: { inv_list: $.data }
          assert:
            - "count(Invoice where assist_request_id == ${req_id} AND status == OPEN) == 1"
            - "Invoice.${prov_inv_id}.status == VOID"
            - "The unique OPEN invoice has invoice_kind == FINAL AND supersedes_invoice_id == ${prov_inv_id}"
            - "OPEN invoice.amount_cents == AssistRequest.${req_id}.final_charge_cents"

      - name: wheelchair_usage_count_conserved_across_cancel_and_complete
        grounds:
          - state_machines.WheelchairAsset.AVAILABLE_to_CHECKED_OUT
          - state_machines.WheelchairAsset.CHECKED_OUT_to_AVAILABLE
          - entities.WheelchairAsset.fields.usage_count
        distinguishing_aspect: |
          Different conserved quantity than invoice amounts: WheelchairAsset.usage_count must
          increment by exactly 1 per checkout and NEVER decrement on cancel/complete — cancel is
          the compensating action that returns the chair to AVAILABLE but does NOT refund
          usage_count. Invariant pinned: usage_count_after == usage_count_before + 1 for both the
          forward path (dispatch) AND the compensating path (cancel mid-flight), distinguishing
          compensation from full rollback.
        test_recipe:
          setup:
            - "Airport STL with one wheelchair (usage_count = 0)"
            - "Dispatch a leg (count → 1) then CANCEL the assignment (count stays 1, chair back to AVAILABLE)"
            - "Dispatch a second leg on the same chair (count → 2) then COMPLETE (count stays 2)"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "STL", tz_offset_minutes: -300, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "1", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "WN20", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-20T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "P STL", dob: "1980-01-01", mobility_code: "WCHR", airline_pnr: "STL1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "MEET_ARRIVAL", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "STL Ag", tsa_cleared_until: "2027-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: true, shift_start_utc: "2026-06-20T08:00:00Z", shift_end_utc: "2026-06-20T20:00:00Z" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-STL-1", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
              captures: { wc_id: $.data.id, wc_v0: $.data.version }
            - call: "GET /maa/assist-requests/${req_id}"
              as: Dispatcher
              captures: { req_v2: $.data.version }
            - call: "POST /maa/legs/${leg_id}/dispatch"
              payload: { expected_assist_request_version: "${req_v2}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "GET /maa/wheelchairs/${wc_id}"
              as: Dispatcher
              captures: { usage_after_dispatch: $.data.usage_count }
          trigger:
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "CANCEL_ASSIGN" }
              as: Dispatcher
            - call: "GET /maa/wheelchairs/${wc_id}"
              as: Dispatcher
              captures: { usage_after_cancel: $.data.usage_count, status_after_cancel: $.data.status }
          assert:
            - "WheelchairAsset.${wc_id}.usage_count after dispatch == 1"
            - "WheelchairAsset.${wc_id}.usage_count after CANCEL_ASSIGN == 1   # compensation does NOT decrement"
            - "WheelchairAsset.${wc_id}.status after CANCEL_ASSIGN == AVAILABLE"
