      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-10T00:00:00Z'
        as: ProgramAdmin
      trigger:
        call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-05T00:00:00Z'
        as: ProgramAdmin
      assert:
      - HTTP 422 with error_id ERR_CLOCK_NOT_MONOTONIC in the response envelope's error block
      - A subsequent POST /_clock/set_current_utc with current_utc 2026-08-10T00:00:00Z succeeds, proving
        the clock still stands at 2026-08-10T00:00:00Z
