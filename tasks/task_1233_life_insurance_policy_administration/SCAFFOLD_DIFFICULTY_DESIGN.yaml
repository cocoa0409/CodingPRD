  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_segregation
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Priority conflict between `state` (priority 4) and
          `business_safety` (priority 5) on POST /applications/{id}/issue:
          if the application is in SUBMITTED (state violation) AND the
          issuer's X-User-ID equals the underwriter's (segregation-of-duties
          violation), the state error wins.
        test_recipe:
          setup:
            - "Application created and approved by underwriter U1 (X-User-ID=u1)"
            - "Now reset: new application created but NOT yet approved — issuer attempts issue with X-User-ID=u1 (same as the would-be approver, but state violation should fire first)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Sam S", date_of_birth: "1990-01-01T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_s: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-S", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_s: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_s}", product_template_id: "${tpl_s}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_s: $.data.id }
          trigger:
            # App is still SUBMITTED (state violation). Issuer X-User-ID is some
            # arbitrary id — the segregation-of-duties check would also fail if
            # state were valid, but the state error fires first.
            - call: "POST /applications/${app_s}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # priority 4 wins over priority 5"

      - name: fiscal_vs_business_referential_loan
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Priority conflict between `business_referential` (priority 7) and
          `business_fiscal` (priority 10) on POST /policies/{id}/loans: if
          the policy's form_status is not IN_FORCE (referential violation
          on loan origination against a non-IN_FORCE policy) AND the
          requested amount exceeds available cash value (fiscal violation),
          the referential error wins because priority 7 < priority 10.
        test_recipe:
          setup:
            - "Policy form_status=REDUCED_PAID_UP (non-IN_FORCE) and requested loan amount > cash_value"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Tina T", date_of_birth: "1972-03-15T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_t: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-T", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_t: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_t}", product_template_id: "${tpl_t}", requested_face_amount_cents: 10000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_t: $.data.id }
            - call: "POST /applications/${app_t}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_t}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_t}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_t: $.data.id }
            - call: "POST /policies/${pol_t}/premium-payments"
              payload: { amount_cents: 10000000 }
              as: Agent
            - call: "POST /policies/${pol_t}/nonforfeiture-elections"
              payload: { election_type: "REDUCED_PAID_UP" }
              as: Policyholder
              as_user_id: "${ip_t}"
          trigger:
            - call: "POST /policies/${pol_t}/loans"
              payload: { requested_amount_cents: 999999999 }
              as: Policyholder
              as_user_id: "${ip_t}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # loans only on IN_FORCE policy — state (priority 4) actually wins here over referential (7) and fiscal (10). The test pins the exact winning category."

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: grace_period_end_date_boundary
        grounds:
          - calculations.grace_period_expiry_check
          - entities.Policy.fields.grace_period_end_date
        distinguishing_aspect: |
          Boundary on grace_period_end_date: if current_utc_date ==
          grace_period_end_date, the policy REMAINS in GRACE (strict >
          comparison). Lapse fires only on the next day. Tests day-30
          (still grace), day-31 (grace end, still grace), day-32 (lapse).
        test_recipe:
          setup:
            - "Policy issued 2026-05-01 with monthly mode; cycle 1 covers 2026-05-01 to 2026-06-01"
            - "Premium unpaid"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Uma U", date_of_birth: "1988-02-14T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_u: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-U", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: false, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_u: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_u}", product_template_id: "${tpl_u}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_u: $.data.id }
            - call: "POST /applications/${app_u}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_u}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_u}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_u: $.data.id }
            # Cycle 1 end = 2026-06-01. grace_period_end = 2026-07-02.
            # First, advance to 2026-06-02 (after cycle end) → policy GRACE.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            # Boundary: on 2026-07-02 (== grace_period_end), still GRACE
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T23:59:59Z" }
              as: PlatformAdmin
            - call: "GET /policies/${pol_u}"
              payload: {}
              as: Agent
              captures: { status_grace_end: $.data.premium_payment_status }
            # Now advance past boundary → LAPSED
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /policies/${pol_u}"
              payload: {}
              as: Agent
              captures: { status_after_end: $.data.premium_payment_status }
          assert:
            - "Policy.${pol_u}.premium_payment_status at grace_period_end_date (2026-07-02T23:59:59Z) == GRACE"
            - "Policy.${pol_u}.premium_payment_status at 2026-07-03T00:00:00Z == LAPSED"

      - name: loan_availability_exact_amount_boundary
        grounds:
          - calculations.cash_surrender_value
          - entities.Policy.fields.cash_value_cents
        distinguishing_aspect: |
          Boundary on cash value availability for loans: requested ==
          available_cash_value succeeds (>=, inclusive); requested ==
          available+1 fails. Different metric from grace_period (numeric
          cents threshold vs date threshold) and different endpoint
          (POST /loans vs clock advance).
        test_recipe:
          setup:
            - "Policy with cash_value_cents = 100_000_00; no outstanding loans"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Victor V", date_of_birth: "1975-07-07T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_v: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-V", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_v: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_v}", product_template_id: "${tpl_v}", requested_face_amount_cents: 10000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_v: $.data.id }
            - call: "POST /applications/${app_v}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_v}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_v}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_v: $.data.id }
            - call: "POST /policies/${pol_v}/premium-payments"
              payload: { amount_cents: 10000000 }
              as: Agent
          trigger:
            # Loan for exact cash_value (boundary: should succeed)
            - call: "POST /policies/${pol_v}/loans"
              payload: { requested_amount_cents: 10000000 }
              as: Policyholder
              as_user_id: "${ip_v}"
              captures: { loan_v1: $.data.id }
            # Second loan for 1 cent (boundary exceeded: should fail)
            - call: "POST /policies/${pol_v}/loans"
              payload: { requested_amount_cents: 1 }
              as: Policyholder
              as_user_id: "${ip_v}"
              captures: { err: $.data.error_id }
          assert:
            - "PolicyLoan.${loan_v1}.status == ACTIVE  # first loan at exact boundary succeeds"
            - "Second POST returns error_id == ERR_INSUFFICIENT_CASH_VALUE"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
