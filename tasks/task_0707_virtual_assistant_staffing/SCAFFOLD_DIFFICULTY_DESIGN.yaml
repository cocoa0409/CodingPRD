  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- 4.A depth-3 cascade from Escalation replace
      - name: escalation_replace_three_hop_cascade
        grounds:
          - state_machines.Escalation.OPEN_to_REPLACED
          - state_machines.Engagement.ACTIVE_to_ENDED
          - entities.Engagement.fields.superseded_by_engagement_id
          - entities.Task.fields.engagement_id
          - entities.VirtualAssistant.fields.active_engagement_count
        distinguishing_aspect: |
          Triggered by Escalation OPEN->REPLACED: hop1 mints a new ACTIVE Engagement (new VA
          count +1); that new engagement CAUSES hop2 (original Engagement ACTIVE->ENDED, old VA
          count -1, superseded_by set); the engagement-end side-effect CAUSES hop3 (the original
          engagement's non-terminal Tasks re-point to the new engagement_id). Each hop is caused
          by the prior hop, not by the replace call directly — depth 3.
        test_recipe:
          setup:
            - "Client ACTIVE on Engagement E1 with VA-old; a QUEUED-then-ASSIGNED task on E1."
            - "A second eligible AVAILABLE VA-new exists for the replacement."
            - "An OPEN Escalation on the client's active engagement."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
