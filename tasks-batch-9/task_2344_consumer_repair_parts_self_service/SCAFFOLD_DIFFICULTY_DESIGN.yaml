        distinguishing_aspect: |
          Boundary metric is the trailing aggregate itself at its lower bound on
          GET /part-catalog-items/{part_id}/demand-forecast: with zero contributing lines
          base_monthly_units is 0.0, the 0.30 safety-stock tier still applies and
