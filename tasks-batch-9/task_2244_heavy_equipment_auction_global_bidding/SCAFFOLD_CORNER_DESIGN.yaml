            - the first UNRESERVED submit returns 422 with data.error_id == "ERR_UNRESERVED_POLICY_NOT_ACK" and status stays "DRAFT"
            - policy-ack returns 200 with Consignor.unreserved_policy_ack == true
            - the second UNRESERVED submit returns 200 with status == "SUBMITTED"

