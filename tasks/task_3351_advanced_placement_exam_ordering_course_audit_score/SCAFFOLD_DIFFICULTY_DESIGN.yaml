  - rule_id: compensating_invariant
    instances:
      - name: score_send_fee_refund_conserves_settled_ledger
        grounds:
          - state_machines.ScoreSend.PENDING_to_CANCELLED
          - calculations.score_send_fee_dual_variant
          - entities.ScoreSend.fields.credit_back_cents
          - entities.ScoreSend.fields.fee_cents
        distinguishing_aspect: "Conservation of the settled-fee ledger: every COLLEGE ScoreSend created on a released score charges fee_cents under the all_include variant, and the compensating PENDING -> CANCELLED transition restores exactly that same amount as credit_back_cents, so sum(fee_cents) over those rows equals sum(credit_back_cents) and the ledger nets to zero."
        test_recipe:
          setup:
            - "A released score for one student on which two COLLEGE sends are created (each charging 2500 under all_include); a third COLLEGE send is filed but left PENDING so it can be cancelled"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Lindale High", school_code: "LD0001", country_code: "US", center_code: "5901", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Human Geography", syllabus_hash: "h-ld-1", submitted_by_user_id: "u-coord-17" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_id_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_id_v1}" }
              as: CourseAuditReviewer
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "approved" }
              as: CourseAuditReviewer
            - call: "POST /ap-program/students"
              payload: { full_name: "Vera Wray", school_id: "${school_id}", student_code: "S1301", grade_level: 12 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /ap-program/exam-registrations"
              payload: { exam_order_id: "${order_id}", student_id: "${student_id}", exam_subject: "AP-HUG", registration_tier: "REGULAR" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { reg_id: "$.data.id" }
