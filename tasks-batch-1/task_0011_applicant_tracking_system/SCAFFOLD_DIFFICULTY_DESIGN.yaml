              as: Recruiter
              as_user_id: "rec_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /ats/candidates"
              payload: { full_name: "Pnl Cand 2", email: "pnl2@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { c2_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${c1_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app1_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${c2_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app2_id: $.data.id }
            - call: "POST /ats/applications/${app1_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/applications/${app2_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/interviews"
              payload: { application_id: "${app1_id}", round_number: 1, scheduled_at: "2026-12-11T10:00:00Z", duration_minutes: 60, panel_user_ids: ["emp_panelX"] }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { intv1_id: $.data.id }
          trigger:
