  - rule_id: non_linear_state_machine
    instances:
      - name: investigation_double_tolling_cycle_then_pending_review_revision_loop
        grounds:
          - state_machines.Investigation.IN_PROGRESS_to_TOLLED
          - state_machines.Investigation.TOLLED_to_IN_PROGRESS
          - state_machines.Investigation.IN_PROGRESS_to_PENDING_REVIEW
          - state_machines.Investigation.PENDING_REVIEW_to_IN_PROGRESS
          - calculations.investigation_window
          - entities.Investigation.fields.tolled_days
          - entities.Investigation.fields.due_at
        distinguishing_aspect: |
          The investigation traverses TOLLED twice and then re-enters IN_PROGRESS from
          PENDING_REVIEW, so tolled_days accumulates to exactly 12 whole days while due_at is
          recomputed from received_at each time - 2026-12-12, not the 2026-12-13 an implementation
          that adds each tolling interval to the previous due_at would produce - and the
          PENDING_REVIEW return adds no tolled days at all.
        test_recipe:
          setup:
            - "A CLASS_II complaint received at 2026-08-01T00:00:00Z has one allegation, an Investigation with statutory_days 121 and due_at 2026-11-30T00:00:00Z, an assigned investigator and one HELD interview."
            - "First tolling cycle: SUSPEND at 2026-08-06T00:00:00Z, RESUME at 2026-08-13T12:00:00Z, an interval of 7.5 days."
            - "Second tolling cycle: SUSPEND at 2026-08-20T00:00:00Z, RESUME at 2026-08-25T06:00:00Z, an interval of 5.25 days."
            - "Findings are then submitted, putting the Investigation in PENDING_REVIEW and the Complaint in ADJUDICATION."
