scenario: "2265. Federal Home Loan Bank Advances & Collateral Pledging (member bank treasury): membership stock purchase requirements and activity-based stock obligations, collateral eligibility review across mortgage, commercial real estate and securities with discount factors, blanket lien versus specific listing and delivery requirements based on condition, borrowing capacity calculation with periodic collateral verification reviews, advance product selection by term, structure and prepayment fee exposure, community lending program eligibility and affordable housing set-asides, collateral shortfall response and pledge substitution, safekeeping, reporting and audit of pledged loan files"
domain_name: fhlb-advances-collateral-pledging
api_prefix: "/fhlb"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # graph: CollateralAsset self-references via replaces_asset_id (substitution chain);
  # ReviewFinding is a junction across CollateralVerificationReview x CollateralAsset;
  # Advance cross-references MemberBank, AdvanceProduct and CommunityProgramAllocation.
  # URL shape is flat (peer collections under /fhlb) with FK ids in bodies.

  state_machine_shape: cyclic
  # CollateralVerificationReview cycles FIELD_WORK -> FINDINGS_ISSUED -> REMEDIATION -> FIELD_WORK.
  # CollateralAsset cycles ELIGIBLE -> SUSPENDED -> UNDER_REVIEW -> ELIGIBLE.
  # Advance carries two independent dimensions (credit_status x collateral_status).
  # MemberBank.collateral_posture is a derived gate recomputed on every capacity change.

  relationship_patterns:
    - one_to_many          # MemberBank -> CollateralAsset / Advance / StockSubscription / Review
    - many_to_many         # ReviewFinding joins CollateralVerificationReview x CollateralAsset
    - self_referential     # CollateralAsset.replaces_asset_id -> CollateralAsset.id
    - cross_aggregate      # Advance -> CommunityProgramAllocation buckets

  role_model: segregation_of_duties
  # The CreditOfficer user who approves an Advance may not fund it.
  # The CollateralReviewAuditor user who raised a ReviewFinding may not be the CreditOfficer
  # who waives it, and no auditor may waive at all.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MemberBank
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the member institution
      - name: charter_type
        type: enum
        source: input
        description: charter class of the member
        constraints: "one of COMMERCIAL_BANK, THRIFT, CREDIT_UNION, INSURANCE_COMPANY, CDFI"
      - name: total_assets_cents
        type: integer
        source: input
        description: most recent regulatory total assets, in cents
        constraints: ">= 100000000"
      - name: membership_status
        type: enum
        source: system
        description: membership lifecycle state
        default: APPLICANT
        constraints: "one of APPLICANT, ACTIVE, PROBATION, SUSPENDED, TERMINATED"
      - name: credit_rating_tier
        type: integer
        source: input
        description: internal credit tier driving the collateral tier cap (1 = strongest)
        default: 2
        constraints: "1..4"
      - name: cdfi_certified
        type: boolean
        source: input
        description: member holds an active CDFI certification
        default: false
      - name: community_lending_eligible
        type: boolean
        source: computed
        description: "derived: membership_status == ACTIVE AND credit_rating_tier <= 3 AND (cdfi_certified == true OR charter_type != INSURANCE_COMPANY)"
      - name: pledge_mode
        type: enum
        source: system
        description: collateral pledging condition set by the executed pledge agreement
        default: NONE
        constraints: "one of NONE, BLANKET_LIEN, SPECIFIC_LISTING, DELIVERY_REQUIRED"
      - name: pledge_agreement_status
        type: enum
        source: system
        description: pledge agreement execution state
        default: NONE
        constraints: "one of NONE, EXECUTED"
      - name: pledge_agreement_effective_date
        type: datetime
        source: system
        description: effective date recorded when the pledge agreement was executed; null before execution
      - name: delivery_required
        type: boolean
        source: computed
        description: "derived: pledge_mode == DELIVERY_REQUIRED OR membership_status IN {PROBATION, SUSPENDED} OR credit_rating_tier == 4"
      - name: verification_haircut_bps
        type: integer
        source: system
        description: additional discount applied to every pledged asset, set by the most recently CLOSED collateral verification review
        default: 0
        constraints: "one of 0, 300, 700, 1500"
      - name: latest_review_outcome
        type: enum
        source: system
        description: outcome of the most recently CLOSED collateral verification review
        default: NONE
        constraints: "one of NONE, PASS, QUALIFIED, FAIL"
      - name: required_membership_stock_cents
        type: integer
        source: computed
        description: "computed by calculations.membership_stock_requirement"
      - name: required_activity_stock_cents
        type: integer
        source: computed
        description: "computed by calculations.activity_stock_requirement"
      - name: required_total_stock_cents
        type: integer
        source: computed
        description: "required_membership_stock_cents + required_activity_stock_cents"
      - name: stock_held_cents
        type: integer
        source: computed
        description: "sum of StockSubscription.amount_cents for this member with status IN {ISSUED, REDEMPTION_REQUESTED}"
      - name: stock_deficiency_cents
        type: integer
        source: computed
        description: "max(0, required_total_stock_cents - stock_held_cents)"
      - name: excess_stock_cents
        type: integer
        source: computed
        description: "max(0, stock_held_cents - required_total_stock_cents)"
      - name: lendable_collateral_value_cents
        type: integer
        source: computed
        description: "CERTIFIED variant of calculations.lendable_collateral_value"
      - name: total_outstanding_advances_cents
        type: integer
        source: computed
        description: "sum of Advance.outstanding_principal_cents for this member with credit_status == FUNDED"
      - name: committed_advances_cents
        type: integer
        source: computed
        description: "sum of Advance.gross_principal_cents for this member with credit_status IN {REQUESTED, CREDIT_APPROVED}"
      - name: borrowing_capacity_cents
        type: integer
        source: computed
        description: "CERTIFIED variant of calculations.borrowing_capacity; may be negative"
      - name: collateral_posture
        type: enum
        source: computed
        description: "derived gate over child operations; computed by calculations.collateral_posture_recompute"
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: shortfall_status
        type: enum
        source: system
        description: collateral shortfall lifecycle for this member
        default: NONE
        constraints: "one of NONE, OPEN, CURED, ESCALATED"
      - name: shortfall_required_cure_cents
        type: integer
        source: system
        description: cents of additional lendable value or repayment needed to clear the shortfall
        default: 0
      - name: shortfall_opened_at
        type: datetime
        source: system
        description: logical-clock instant the shortfall was opened; null when shortfall_status == NONE
      - name: shortfall_cure_deadline
        type: datetime
        source: system
        description: shortfall_opened_at + SHORTFALL_CURE_DAYS; null when shortfall_status == NONE

  - name: StockSubscription
    parent: MemberBank
    common_fields: true
    fields:
      - name: member_bank_id
        type: string
        source: input
        description: "FK -> MemberBank.id; the subscribing member"
      - name: advance_id
        type: string
        source: system
        description: "FK -> Advance.id; set only on the ACTIVITY subscription auto-created when that advance is funded with fund_stock_from_advance == true; null otherwise"
      - name: subscription_type
        type: enum
        source: input
        description: membership stock purchase requirement vs activity-based stock obligation
        constraints: "one of MEMBERSHIP, ACTIVITY"
      - name: amount_cents
        type: integer
        source: input
        description: par value of the subscription in cents
        constraints: "> 0 and amount_cents % STOCK_PAR_VALUE_CENTS == 0"
      - name: shares
        type: integer
        source: computed
        description: "amount_cents / STOCK_PAR_VALUE_CENTS"
      - name: status
        type: enum
        source: system
        description: subscription lifecycle state
        default: SUBSCRIBED
        constraints: "one of SUBSCRIBED, ISSUED, REDEMPTION_REQUESTED, REPURCHASED, CANCELLED"
      - name: redemption_requested_at
        type: datetime
        source: system
        description: logical-clock instant redemption was requested; null otherwise
      - name: repurchased_at
        type: datetime
        source: system
        description: logical-clock instant the bank repurchased the stock; null otherwise

  - name: CollateralAsset
    parent: MemberBank
    common_fields: true
    fields:
      - name: member_bank_id
        type: string
        source: input
        description: "FK -> MemberBank.id; the pledging member"
      - name: replaces_asset_id
        type: string
        source: system
        description: "FK -> CollateralAsset.id; on a replacement asset created by a substitution, the asset it replaced; null on originally submitted assets"
      - name: asset_class
        type: enum
        source: input
        description: collateral class driving the base discount factor
        constraints: "one of SF_MORTGAGE, MULTIFAMILY, CRE, HELOC, SMALL_BUSINESS, CDFI_COMMUNITY, AGENCY_MBS, TREASURY"
      - name: unpaid_principal_balance_cents
        type: integer
        source: input
        description: unpaid principal balance for loan classes; 0 for securities classes
        constraints: ">= 0"
      - name: market_value_cents
        type: integer
        source: input
        description: current market value in cents
        constraints: "> 0"
      - name: ltv_bps
        type: integer
        source: input
        description: loan-to-value in basis points (8000 == 80.00%); 0 for securities classes
        default: 0
        constraints: "0..20000"
      - name: delinquency_days
        type: integer
        source: input
        description: days past due at submission or at the latest documentation update
        default: 0
        constraints: ">= 0"
      - name: documentation_status
        type: enum
        source: input
        description: loan-file documentation condition
        default: COMPLETE
        constraints: "one of COMPLETE, EXCEPTION, MISSING"
      - name: custody_location
        type: enum
        source: input
        description: physical custody of the loan file
        default: MEMBER_VAULT
        constraints: "one of MEMBER_VAULT, THIRD_PARTY_CUSTODIAN, FHLB_SAFEKEEPING"
      - name: appraisal_date
        type: datetime
        source: input
        description: date of the most recent appraisal
      - name: effective_listing_mode
        type: enum
        source: computed
        description: "computed by calculations.effective_listing_mode from member pledge_mode, custody_location and confirmed safekeeping receipts"
        constraints: "one of BLANKET, SPECIFIC, DELIVERED"
      - name: collateral_basis_cents
        type: integer
        source: computed
        description: "asset_class IN {AGENCY_MBS, TREASURY} -> market_value_cents; else min(unpaid_principal_balance_cents, market_value_cents)"
      - name: discount_factor_bps
        type: integer
        source: computed
        description: "computed by calculations.asset_discount_factor; 0 while status IN {UNDER_REVIEW, INELIGIBLE, SUSPENDED, SUBSTITUTED}"
      - name: lendable_value_cents
        type: integer
        source: computed
        description: "round_half_up(collateral_basis_cents * discount_factor_bps / 10000); 0 unless status == ELIGIBLE"
      - name: status
        type: enum
        source: system
        description: eligibility lifecycle state
        default: UNDER_REVIEW
        constraints: "one of UNDER_REVIEW, ELIGIBLE, INELIGIBLE, SUSPENDED, SUBSTITUTED"
      - name: ineligibility_reason
        type: enum
        source: computed
        description: reason recorded when a review-eligibility evaluation rejects the asset
        default: NONE
        constraints: "one of NONE, LTV_EXCEEDS_MAX, DELINQUENT, DOCUMENTATION_MISSING, SECURITIES_NOT_DELIVERED, UNRESOLVED_REVIEW_FINDING"

  - name: SafekeepingReceipt
    parent: CollateralAsset
    common_fields: true
    fields:
      - name: collateral_asset_id
        type: string
        source: input
        description: "FK -> CollateralAsset.id; the asset whose loan file is delivered"
      - name: file_count
        type: integer
        source: input
        description: number of physical loan-file documents in the delivery
        constraints: "> 0"
      - name: delivery_date
        type: datetime
        source: input
        description: start of the custody window (closed interval start)
      - name: return_date
        type: datetime
        source: input
        description: scheduled end of the custody window (closed interval end); must be > delivery_date
      - name: status
        type: enum
        source: system
        description: custody lifecycle state
        default: PENDING_DELIVERY
        constraints: "one of PENDING_DELIVERY, RECEIVED, EXCEPTION, RETURNED"
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant the custodian confirmed receipt; null otherwise
      - name: exception_note
        type: string
        source: system
        description: custodian note recorded when the delivery is booked as an EXCEPTION; null otherwise

  - name: CollateralVerificationReview
    parent: MemberBank
    common_fields: true
    fields:
      - name: member_bank_id
        type: string
        source: input
        description: "FK -> MemberBank.id; the member under review"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the field-work window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the field-work window; must be > window_start
      - name: sample_size
        type: integer
        source: input
        description: number of pledged loan files drawn into the verification sample
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: review lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, FIELD_WORK, FINDINGS_ISSUED, REMEDIATION, CLOSED"
      - name: retest_count
        type: integer
        source: system
        description: number of times this review re-entered FIELD_WORK from REMEDIATION
        default: 0
        constraints: "0..MAX_RETESTS"
      - name: weighted_exception_score
        type: number
        source: computed
        description: "computed by calculations.verification_exception_rate"
      - name: exception_rate_pct
        type: number
        source: computed
        description: "computed by calculations.verification_exception_rate, 2 decimal places"
      - name: haircut_bps
        type: integer
        source: computed
        description: "threshold-selected haircut from calculations.verification_exception_rate"
        default: 0
      - name: outcome
        type: enum
        source: computed
        description: review verdict fixed at close
        default: PENDING
        constraints: "one of PENDING, PASS, QUALIFIED, FAIL"
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the review was closed; null otherwise

  - name: ReviewFinding
    parent: CollateralVerificationReview
    common_fields: true
    fields:
      - name: collateral_verification_review_id
        type: string
        source: input
        description: "FK -> CollateralVerificationReview.id; the review that raised the finding"
      - name: collateral_asset_id
        type: string
        source: input
        description: "FK -> CollateralAsset.id; the sampled asset the finding is against"
      - name: finding_type
        type: enum
        source: input
        description: category of documentation or reporting defect
        constraints: "one of MISSING_NOTE, LIEN_DEFECT, STALE_APPRAISAL, UNREPORTED_DELINQUENCY, INELIGIBLE_PROPERTY_TYPE"
      - name: severity
        type: enum
        source: input
        description: severity class driving the exception weight
        constraints: "one of MINOR, MAJOR, CRITICAL"
      - name: weight
        type: number
        source: computed
        description: "CRITICAL -> 3.0, MAJOR -> 1.0, MINOR -> 0.25"
      - name: status
        type: enum
        source: system
        description: finding lifecycle state
        default: OPEN
        constraints: "one of OPEN, REMEDIATED, WAIVED, UNRESOLVED"
      - name: raised_by_user_id
        type: string
        source: system
        description: X-User-ID of the CollateralReviewAuditor who raised the finding
      - name: waived_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditOfficer who waived the finding; null otherwise

  - name: AdvanceProduct
    parent: null
    common_fields: true
    fields:
      - name: product_code
        type: string
        source: input
        description: unique product code
        constraints: unique
      - name: structure
        type: enum
        source: input
        description: advance structure
        constraints: "one of FIXED_TERM, ADJUSTABLE, AMORTIZING, CALLABLE, PUTABLE"
      - name: min_term_days
        type: integer
        source: input
        description: minimum permitted term in days
        constraints: ">= 1"
      - name: max_term_days
        type: integer
        source: input
        description: maximum permitted term in days
        constraints: ">= min_term_days"
      - name: rate_bps
        type: integer
        source: input
        description: contractual coupon in basis points
        constraints: "> 0"
      - name: prepayment_fee_method
        type: enum
        source: input
        description: prepayment fee exposure method
        constraints: "one of SYMMETRIC_MARKET_VALUE, YIELD_MAINTENANCE, FLAT_PCT, NONE"
      - name: flat_prepayment_fee_bps
        type: integer
        source: input
        description: flat fee in basis points, used only when prepayment_fee_method == FLAT_PCT
        default: 0
      - name: symmetric_credit_enabled
        type: boolean
        source: input
        description: when true a SYMMETRIC_MARKET_VALUE advance may settle at a negative (credit) fee
        default: false
      - name: activity_stock_pct_bps
        type: integer
        source: input
        description: activity-based stock obligation as basis points of gross principal
        constraints: "0..2000"
      - name: min_principal_cents
        type: integer
        source: input
        description: minimum gross principal in cents
        constraints: "> 0"
      - name: requires_collateral_delivery
        type: boolean
        source: input
        description: when true, funding requires every ELIGIBLE asset of the member to be DELIVERED
        default: false
      - name: community_program_flag
        type: boolean
        source: input
        description: product may only be used with a community lending program allocation
        default: false

  - name: Advance
    parent: MemberBank
    common_fields: true
    fields:
      - name: member_bank_id
        type: string
        source: input
        description: "FK -> MemberBank.id; the borrowing member"
      - name: advance_product_id
        type: string
        source: input
        description: "FK -> AdvanceProduct.id; the selected product"
      - name: community_program_allocation_id
        type: string
        source: input
        description: "FK -> CommunityProgramAllocation.id; the set-aside pool the subsidy is drawn from; null for non-community advances"
      - name: community_bucket
        type: enum
        source: input
        description: set-aside bucket the subsidy is charged to first
        default: NONE
        constraints: "one of NONE, FIRST_TIME_HOMEBUYER, REHABILITATION, GENERAL"
      - name: requested_subsidy_cents
        type: integer
        source: input
        description: subsidy requested from the set-aside pool
        default: 0
        constraints: ">= 0"
      - name: requested_net_proceeds_cents
        type: integer
        source: input
        description: cash the member wants to receive
        constraints: "> 0"
      - name: fund_stock_from_advance
        type: boolean
        source: input
        description: when true, the activity stock obligation is grossed up into the advance principal instead of paid from member cash
        default: false
      - name: term_days
        type: integer
        source: input
        description: requested term in days
        constraints: ">= 1"
      - name: gross_principal_cents
        type: integer
        source: computed
        description: "computed by calculations.advance_principal_gross_up"
      - name: activity_stock_cents
        type: integer
        source: computed
        description: "computed by calculations.advance_principal_gross_up"
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: "computed by calculations.advance_principal_gross_up"
      - name: rate_bps
        type: integer
        source: computed
        description: "max(RATE_FLOOR_BPS, product.rate_bps - (community_program_allocation_id != null ? allocation.subsidy_rate_bps : 0))"
      - name: outstanding_principal_cents
        type: integer
        source: system
        description: principal currently outstanding; 0 before funding and after full repayment or prepayment
        default: 0
      - name: credit_status
        type: enum
        source: system
        description: credit dimension of the advance lifecycle
        default: REQUESTED
        constraints: "one of REQUESTED, CREDIT_APPROVED, FUNDED, REPAID, PREPAID, CANCELLED_FOR_COLLATERAL"
      - name: collateral_status
        type: enum
        source: system
        description: collateral-securing dimension of the advance lifecycle, independent of credit_status
        default: PENDING_VERIFICATION
        constraints: "one of PENDING_VERIFICATION, SECURED, SHORTFALL, RELEASED"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditOfficer who approved; null before approval
      - name: funded_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditOfficer who funded; null before funding
      - name: funded_at
        type: datetime
        source: system
        description: logical-clock instant of funding; null before funding
      - name: maturity_date
        type: datetime
        source: computed
        description: "funded_at + term_days; null before funding"
      - name: capacity_at_request_cents
        type: integer
        source: system
        description: PROVISIONAL borrowing capacity snapshot taken when the request was created
      - name: capacity_at_funding_cents
        type: integer
        source: system
        description: CERTIFIED borrowing capacity snapshot taken at funding, excluding this advance's own commitment; null before funding

  - name: PrepaymentEvent
    parent: Advance
    common_fields: true
    fields:
      - name: advance_id
        type: string
        source: input
        description: "FK -> Advance.id; the advance being prepaid"
      - name: prepay_kind
        type: enum
        source: input
        description: full or partial prepayment
        constraints: "one of FULL, PARTIAL"
      - name: prepay_amount_cents
        type: integer
        source: input
        description: principal amount to prepay; must equal outstanding_principal_cents when prepay_kind == FULL
        constraints: "> 0"
      - name: quote_date
        type: datetime
        source: system
        description: logical-clock instant the quote was produced
      - name: quoted_market_rate_bps
        type: integer
        source: system
        description: market reinvestment rate snapshotted at quote time
      - name: quoted_remaining_days
        type: integer
        source: computed
        description: "whole days from quote_date to Advance.maturity_date, floored at 0"
      - name: quoted_fee_cents
        type: integer
        source: computed
        description: "QUOTE variant of calculations.prepayment_fee"
      - name: settlement_date
        type: datetime
        source: system
        description: logical-clock instant of settlement; null while QUOTED
      - name: settlement_market_rate_bps
        type: integer
        source: system
        description: market reinvestment rate in effect at settlement; null while QUOTED
      - name: settled_remaining_days
        type: integer
        source: computed
        description: "whole days from settlement_date to Advance.maturity_date, floored at 0; null while QUOTED"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "round_half_up(prepay_amount_cents * PREPAY_ADMIN_FEE_BPS / 10000), charged only at settlement"
        default: 0
      - name: symmetric_credit_cents
        type: integer
        source: computed
        description: "credit granted at settlement when the symmetric method produces a negative fee and the product enables credits; 0 otherwise"
        default: 0
      - name: settled_fee_cents
        type: integer
        source: computed
        description: "SETTLEMENT variant of calculations.prepayment_fee; null while QUOTED"
      - name: fee_delta_cents
        type: integer
        source: computed
        description: "settled_fee_cents - quoted_fee_cents; null while QUOTED"
      - name: status
        type: enum
        source: system
        description: quote lifecycle state
        default: QUOTED
        constraints: "one of QUOTED, SETTLED, EXPIRED"

  - name: CommunityProgramAllocation
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: enum
        source: input
        description: community lending program
        constraints: "one of CIP, AHP_SETASIDE, CICA"
      - name: fiscal_year
        type: integer
        source: input
        description: program year
        constraints: ">= 2020"
      - name: total_pool_cents
        type: integer
        source: input
        description: total subsidy pool for the year
        constraints: "> 0"
      - name: subsidy_rate_bps
        type: integer
        source: input
        description: coupon reduction granted to advances drawing on this pool
        constraints: "0..500"
      - name: bucket_capacity_first_time_cents
        type: integer
        source: computed
        description: "round_half_up(total_pool_cents * BUCKET_SHARE_FIRST_TIME_BPS / 10000)"
      - name: bucket_capacity_rehabilitation_cents
        type: integer
        source: computed
        description: "round_half_up(total_pool_cents * BUCKET_SHARE_REHABILITATION_BPS / 10000)"
      - name: bucket_capacity_general_cents
        type: integer
        source: computed
        description: "round_half_up(total_pool_cents * BUCKET_SHARE_GENERAL_BPS / 10000) plus the rounding residual, per calculations.setaside_bucket_capacities"
      - name: bucket_committed_first_time_cents
        type: integer
        source: system
        description: subsidy committed against the first-time-homebuyer bucket
        default: 0
      - name: bucket_committed_rehabilitation_cents
        type: integer
        source: system
        description: subsidy committed against the rehabilitation bucket
        default: 0
      - name: bucket_committed_general_cents
        type: integer
        source: system
        description: subsidy committed against the general bucket, including spillover from purpose buckets
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: "bucket_committed_first_time_cents + bucket_committed_rehabilitation_cents + bucket_committed_general_cents"
      - name: remaining_cents
        type: integer
        source: computed
        description: "total_pool_cents - committed_cents"
      - name: status
        type: enum
        source: computed
        description: "OPEN while remaining_cents > 0; CLOSED when remaining_cents == 0"
        default: OPEN
        constraints: "one of OPEN, CLOSED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MemberBank
    dimension: membership_status
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /fhlb/member-banks/{member_bank_id}/activate"
        actor: CreditOfficer
        preconditions:
          - "membership_status == APPLICANT"
          - "stock_held_cents >= required_membership_stock_cents (else ERR_MEMBERSHIP_STOCK_DEFICIENT)"
        side_effects:
          - "recompute community_lending_eligible and delivery_required"
          - "recompute collateral_posture per calculations.collateral_posture_recompute"
          - "increments MemberBank.version by 1"
      - from: ACTIVE
        to: PROBATION
        trigger: "PATCH /fhlb/member-banks/{member_bank_id}/condition with membership_status = PROBATION, or system on shortfall escalation"
        actor: CreditOfficer | system
        preconditions:
          - "membership_status == ACTIVE"
        side_effects:
          - "delivery_required becomes true (PROBATION forces file delivery)"
          - "recompute effective_listing_mode, discount_factor_bps and lendable_value_cents for every CollateralAsset of this member with status IN {ELIGIBLE, SUSPENDED}"
          - "recompute lendable_collateral_value_cents, borrowing_capacity_cents and collateral_posture"
          - "increments MemberBank.version by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "PATCH /fhlb/member-banks/{member_bank_id}/condition with membership_status = ACTIVE"
        actor: CreditOfficer
        preconditions:
          - "membership_status == PROBATION"
          - "shortfall_status != ESCALATED (else ERR_INVALID_STATE)"
        side_effects:
          - "same recomputation cascade as ACTIVE -> PROBATION, in reverse direction"
          - "increments MemberBank.version by 1"
        note: "cycle ACTIVE -> PROBATION -> ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /fhlb/member-banks/{member_bank_id}/condition with membership_status = SUSPENDED"
        actor: CreditOfficer
        preconditions:
          - "membership_status IN {ACTIVE, PROBATION}"
        side_effects:
          - "collateral_posture forced to FROZEN by calculations.collateral_posture_recompute"
          - "increments MemberBank.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "PATCH /fhlb/member-banks/{member_bank_id}/condition with membership_status = SUSPENDED"
        actor: CreditOfficer
        preconditions:
          - "membership_status IN {ACTIVE, PROBATION}"
        side_effects:
          - "collateral_posture forced to FROZEN"
          - "increments MemberBank.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "PATCH /fhlb/member-banks/{member_bank_id}/condition with membership_status = TERMINATED"
        actor: CreditOfficer
        preconditions:
          - "membership_status == SUSPENDED"
          - "total_outstanding_advances_cents == 0 (else ERR_INVALID_STATE)"
        side_effects:
          - "every StockSubscription of this member with status IN {ISSUED, REDEMPTION_REQUESTED} -> REPURCHASED"
          - "recompute stock_held_cents, stock_deficiency_cents, excess_stock_cents"
          - "increments MemberBank.version by 1"

  - entity: StockSubscription
    dimension: status
    initial_state: SUBSCRIBED
    terminal_states: [REPURCHASED, CANCELLED]
    transitions:
      - from: SUBSCRIBED
        to: ISSUED
        trigger: "POST /fhlb/stock-subscriptions/{stock_subscription_id}/issue"
        actor: CreditOfficer
        preconditions:
          - "status == SUBSCRIBED"
          - "MemberBank.membership_status != TERMINATED"
        side_effects:
          - "recompute MemberBank.stock_held_cents, stock_deficiency_cents, excess_stock_cents"
          - "increments MemberBank.version by 1"
      - from: SUBSCRIBED
        to: ISSUED
        trigger: "system, on POST /fhlb/advances/{advance_id}/fund when fund_stock_from_advance == true"
        actor: system
        preconditions:
          - "the ACTIVITY subscription is created by the funding transition and issued in the same request"
        side_effects:
          - "advance_id set to the funding advance"
          - "recompute MemberBank.stock_held_cents, stock_deficiency_cents, excess_stock_cents"
        note: "auto-created and auto-issued in one step; the SUBSCRIBED state is never observable for this path"
      - from: SUBSCRIBED
        to: CANCELLED
        trigger: "system, on cascade from MemberBank.collateral_posture becoming FROZEN"
        actor: system
        preconditions:
          - "status == SUBSCRIBED"
          - "subscription_type == ACTIVITY"
        side_effects:
          - "recompute MemberBank.stock_held_cents (unchanged: SUBSCRIBED never counted) and excess_stock_cents"
      - from: ISSUED
        to: REDEMPTION_REQUESTED
        trigger: "POST /fhlb/stock-subscriptions/{stock_subscription_id}/request-redemption, or system on advance repayment/full prepayment"
        actor: TreasuryOfficer | system
        preconditions:
          - "status == ISSUED"
          - "for the TreasuryOfficer trigger: MemberBank.stock_held_cents - amount_cents >= MemberBank.required_total_stock_cents (else ERR_STOCK_REDEMPTION_WOULD_BREACH_REQUIREMENT)"
        side_effects:
          - "redemption_requested_at = logical clock"
          - "stock_held_cents unchanged (REDEMPTION_REQUESTED still counts as held)"
          - "increments MemberBank.version by 1"
      - from: REDEMPTION_REQUESTED
        to: ISSUED
        trigger: "system, on POST /fhlb/advances/{advance_id}/approve when the member's required_activity_stock_cents rises back above stock_held_cents excluding this subscription"
        actor: system
        preconditions:
          - "status == REDEMPTION_REQUESTED"
          - "MemberBank.stock_deficiency_cents > 0 after the new commitment"
        side_effects:
          - "redemption_requested_at cleared"
          - "recompute MemberBank.stock_deficiency_cents"
        note: "cycle ISSUED -> REDEMPTION_REQUESTED -> ISSUED; the bank recalls pending redemptions before a new activity obligation is allowed to sit uncovered"
      - from: REDEMPTION_REQUESTED
        to: REPURCHASED
        trigger: "POST /fhlb/stock-subscriptions/{stock_subscription_id}/repurchase"
        actor: CreditOfficer
        preconditions:
          - "status == REDEMPTION_REQUESTED"
          - "MemberBank.stock_held_cents - amount_cents >= MemberBank.required_total_stock_cents (else ERR_STOCK_REDEMPTION_WOULD_BREACH_REQUIREMENT)"
        side_effects:
          - "repurchased_at = logical clock"
          - "recompute MemberBank.stock_held_cents, stock_deficiency_cents, excess_stock_cents"
          - "increments MemberBank.version by 1"

  - entity: CollateralAsset
    dimension: status
    initial_state: UNDER_REVIEW
    terminal_states: [SUBSTITUTED]
    transitions:
      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility"
        actor: CreditOfficer
        preconditions:
          - "status IN {UNDER_REVIEW, SUSPENDED}"
          - "MemberBank.pledge_agreement_status == EXECUTED (else ERR_PLEDGE_AGREEMENT_NOT_EXECUTED)"
          - "documentation_status != MISSING (else ERR_DOCUMENTATION_MISSING)"
          - "ltv_bps <= LTV_MAX_BPS (else ERR_LTV_EXCEEDS_MAX)"
          - "delinquency_days < DELINQUENCY_INELIGIBLE_DAYS (else ERR_DELINQUENT_ASSET_INELIGIBLE)"
          - "asset_class IN {AGENCY_MBS, TREASURY} requires effective_listing_mode != BLANKET (else ERR_SECURITIES_REQUIRE_DELIVERY)"
          - "no ReviewFinding against this asset with status == UNRESOLVED (else ERR_CRITICAL_FINDINGS_OPEN)"
        side_effects:
          - "effective_listing_mode, discount_factor_bps, collateral_basis_cents, lendable_value_cents computed per calculations.asset_discount_factor and calculations.lendable_collateral_value"
          - "ineligibility_reason = NONE"
          - "MemberBank.lendable_collateral_value_cents and borrowing_capacity_cents recomputed; that recomputation re-derives MemberBank.collateral_posture"
          - "increments MemberBank.version by 1"
      - from: UNDER_REVIEW
        to: INELIGIBLE
        trigger: "POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility with a disqualifying condition and force_ineligible = true"
        actor: CreditOfficer
        preconditions:
          - "status IN {UNDER_REVIEW, SUSPENDED}"
          - "at least one disqualifying condition holds (documentation MISSING, ltv_bps > LTV_MAX_BPS, delinquency_days >= DELINQUENCY_INELIGIBLE_DAYS, or securities pledged under BLANKET)"
        side_effects:
          - "ineligibility_reason set to the first disqualifying condition in the order documentation, LTV, delinquency, securities-delivery"
          - "discount_factor_bps = 0, lendable_value_cents = 0"
          - "MemberBank.lendable_collateral_value_cents and borrowing_capacity_cents recomputed; collateral_posture re-derived"
          - "increments MemberBank.version by 1"
        note: "force_ineligible = true records the rejection instead of returning the 4xx error, so the audit trail keeps the reason"
      - from: INELIGIBLE
        to: UNDER_REVIEW
        trigger: "PATCH /fhlb/collateral-assets/{collateral_asset_id}/documentation"
        actor: CollateralCustodian
        preconditions:
          - "status IN {ELIGIBLE, INELIGIBLE, SUSPENDED}"
        side_effects:
          - "documentation_status / custody_location / delinquency_days updated from the request"
          - "discount_factor_bps = 0 and lendable_value_cents = 0 while UNDER_REVIEW"
          - "MemberBank.lendable_collateral_value_cents and borrowing_capacity_cents recomputed; collateral_posture re-derived"
          - "increments MemberBank.version by 1"
        note: "cycle INELIGIBLE -> UNDER_REVIEW -> ELIGIBLE"
      - from: ELIGIBLE
        to: UNDER_REVIEW
        trigger: "PATCH /fhlb/collateral-assets/{collateral_asset_id}/documentation"
        actor: CollateralCustodian
        preconditions:
          - "status IN {ELIGIBLE, INELIGIBLE, SUSPENDED}"
        side_effects:
          - "same as INELIGIBLE -> UNDER_REVIEW; the asset stops contributing lendable value until re-reviewed"
          - "increments MemberBank.version by 1"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system, on POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/close"
        actor: system
        preconditions:
          - "status == ELIGIBLE"
          - "the closing review left at least one ReviewFinding against this asset with status == UNRESOLVED and severity IN {MAJOR, CRITICAL}"
        side_effects:
          - "lendable_value_cents = 0, discount_factor_bps = 0"
          - "ineligibility_reason = UNRESOLVED_REVIEW_FINDING"
      - from: SUSPENDED
        to: UNDER_REVIEW
        trigger: "PATCH /fhlb/collateral-assets/{collateral_asset_id}/documentation"
        actor: CollateralCustodian
        preconditions:
          - "status IN {ELIGIBLE, INELIGIBLE, SUSPENDED}"
        side_effects:
          - "same as INELIGIBLE -> UNDER_REVIEW"
          - "increments MemberBank.version by 1"
        note: "cycle ELIGIBLE -> SUSPENDED -> UNDER_REVIEW -> ELIGIBLE"
      - from: ELIGIBLE
        to: SUBSTITUTED
        trigger: "POST /fhlb/collateral-assets/{collateral_asset_id}/substitute"
        actor: TreasuryOfficer
        preconditions:
          - "status IN {ELIGIBLE, SUSPENDED, INELIGIBLE}"
          - "MemberBank version matches expected_member_bank_version (else ERR_STALE_MEMBER_VERSION)"
          - "MemberBank.collateral_posture != FROZEN, unless the replacement's lendable_value_cents >= this asset's lendable_value_cents (else ERR_SUBSTITUTION_REDUCES_LENDABLE_VALUE)"
        side_effects:
          - "a replacement CollateralAsset is created from the request body with replaces_asset_id = this asset's id and status UNDER_REVIEW"
          - "lendable_value_cents = 0, discount_factor_bps = 0 on the outgoing asset"
          - "every SafekeepingReceipt of the outgoing asset with status == RECEIVED -> RETURNED"
          - "MemberBank.lendable_collateral_value_cents and borrowing_capacity_cents recomputed; collateral_posture re-derived"
          - "increments MemberBank.version by 1"
      - from: SUSPENDED
        to: SUBSTITUTED
        trigger: "POST /fhlb/collateral-assets/{collateral_asset_id}/substitute"
        actor: TreasuryOfficer
        preconditions:
          - "same as ELIGIBLE -> SUBSTITUTED"
        side_effects:
          - "same as ELIGIBLE -> SUBSTITUTED"
          - "increments MemberBank.version by 1"

  - entity: SafekeepingReceipt
    dimension: status
    initial_state: PENDING_DELIVERY
    terminal_states: [RETURNED]
    transitions:
      - from: PENDING_DELIVERY
        to: RECEIVED
        trigger: "POST /fhlb/safekeeping-receipts/{safekeeping_receipt_id}/confirm with outcome = RECEIVED"
        actor: CollateralCustodian
        preconditions:
          - "status == PENDING_DELIVERY"
          - "logical clock >= delivery_date (else ERR_INVALID_STATE)"
        side_effects:
          - "received_at = logical clock"
          - "CollateralAsset.custody_location = FHLB_SAFEKEEPING"
          - "that custody change re-derives CollateralAsset.effective_listing_mode; when the asset is ELIGIBLE its discount_factor_bps and lendable_value_cents are recomputed"
          - "that lendable change recomputes MemberBank.lendable_collateral_value_cents, borrowing_capacity_cents and collateral_posture"
          - "increments MemberBank.version by 1"
      - from: PENDING_DELIVERY
        to: EXCEPTION
        trigger: "POST /fhlb/safekeeping-receipts/{safekeeping_receipt_id}/confirm with outcome = EXCEPTION"
        actor: CollateralCustodian
        preconditions:
          - "status == PENDING_DELIVERY"
          - "logical clock >= delivery_date"
        side_effects:
          - "exception_note recorded from the request"
          - "CollateralAsset.documentation_status = EXCEPTION and CollateralAsset.status -> UNDER_REVIEW"
          - "that asset transition zeroes lendable_value_cents, which recomputes MemberBank.lendable_collateral_value_cents, borrowing_capacity_cents and collateral_posture"
          - "increments MemberBank.version by 1"
        note: "branch: the same endpoint forks to RECEIVED or EXCEPTION with divergent side-effect sets"
      - from: RECEIVED
        to: RETURNED
        trigger: "system, on POST /fhlb/collateral-assets/{collateral_asset_id}/substitute"
        actor: system
        preconditions:
          - "status == RECEIVED"
          - "the parent CollateralAsset is leaving the pledge as SUBSTITUTED"
        side_effects:
          - "no further custody-window conflict is raised against this receipt"
      - from: EXCEPTION
        to: RETURNED
        trigger: "system, on POST /fhlb/collateral-assets/{collateral_asset_id}/substitute"
        actor: system
        preconditions:
          - "status == EXCEPTION"
        side_effects:
          - "no further custody-window conflict is raised against this receipt"

  - entity: CollateralVerificationReview
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: FIELD_WORK
        trigger: "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/begin-field-work"
        actor: CollateralReviewAuditor
        preconditions:
          - "status == SCHEDULED"
          - "logical clock >= window_start (else ERR_INVALID_STATE)"
          - "MemberBank.membership_status IN {ACTIVE, PROBATION} (else ERR_MEMBERSHIP_NOT_ACTIVE)"
        side_effects: ["no cross-entity effect"]
      - from: FIELD_WORK
        to: FINDINGS_ISSUED
        trigger: "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/issue-findings"
        actor: CollateralReviewAuditor
        preconditions:
          - "status == FIELD_WORK"
        side_effects:
          - "if at least one ReviewFinding of this review has status == OPEN and severity == CRITICAL, the review auto-transitions FINDINGS_ISSUED -> REMEDIATION in the same request"
      - from: FINDINGS_ISSUED
        to: REMEDIATION
        trigger: "system, immediately after issue-findings when an OPEN CRITICAL finding exists"
        actor: system
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "count(ReviewFinding where collateral_verification_review_id == this.id and status == OPEN and severity == CRITICAL) >= 1"
        side_effects: ["close is blocked until every CRITICAL finding is REMEDIATED or WAIVED"]
      - from: REMEDIATION
        to: FIELD_WORK
        trigger: "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/retest"
        actor: CollateralReviewAuditor
        preconditions:
          - "status == REMEDIATION"
          - "every ReviewFinding of this review with severity == CRITICAL has status IN {REMEDIATED, WAIVED} (else ERR_CRITICAL_FINDINGS_OPEN)"
          - "retest_count < MAX_RETESTS (else ERR_RETEST_LIMIT_EXCEEDED)"
        side_effects:
          - "retest_count incremented by 1"
        note: "cycle FIELD_WORK -> FINDINGS_ISSUED -> REMEDIATION -> FIELD_WORK, bounded by MAX_RETESTS"
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/close"
        actor: CollateralReviewAuditor
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "count(ReviewFinding where status == OPEN and severity == CRITICAL) == 0 (else ERR_CRITICAL_FINDINGS_OPEN)"
        side_effects:
          - "L1: weighted_exception_score, exception_rate_pct, haircut_bps and outcome computed per calculations.verification_exception_rate; every ReviewFinding of this review with status == OPEN -> UNRESOLVED; closed_at set; MemberBank.verification_haircut_bps = haircut_bps and MemberBank.latest_review_outcome = outcome"
          - "L2: because MemberBank.verification_haircut_bps changed, every CollateralAsset of the member with status IN {ELIGIBLE, SUSPENDED} has discount_factor_bps and lendable_value_cents recomputed; in addition, every ELIGIBLE asset carrying an UNRESOLVED finding of severity IN {MAJOR, CRITICAL} from this review transitions ELIGIBLE -> SUSPENDED with lendable_value_cents = 0"
          - "L3: because asset lendable values changed, MemberBank.lendable_collateral_value_cents and borrowing_capacity_cents are recomputed; when borrowing_capacity_cents < 0 the member's collateral_posture becomes FROZEN"
          - "L4: because collateral_posture became FROZEN, MemberBank.shortfall_status NONE -> OPEN with shortfall_required_cure_cents from calculations.shortfall_cure_requirement, shortfall_opened_at = logical clock and shortfall_cure_deadline = logical clock + SHORTFALL_CURE_DAYS; every Advance of the member with credit_status == FUNDED and collateral_status == SECURED moves to collateral_status SHORTFALL; every Advance with credit_status IN {REQUESTED, CREDIT_APPROVED} moves to credit_status CANCELLED_FOR_COLLATERAL"
          - "L5: because those advances were cancelled, each cancelled advance with community_program_allocation_id != null releases its committed subsidy back to the buckets it was charged to (bucket_committed_* decremented in the reverse of the commit order), which restores CommunityProgramAllocation.remaining_cents and flips status CLOSED -> OPEN when remaining_cents becomes > 0; every SUBSCRIBED ACTIVITY StockSubscription of a cancelled advance -> CANCELLED; MemberBank.required_activity_stock_cents, required_total_stock_cents, stock_deficiency_cents and excess_stock_cents are recomputed"
          - "increments MemberBank.version by 1"

  - entity: ReviewFinding
    dimension: status
    initial_state: OPEN
    terminal_states: [REMEDIATED, WAIVED, UNRESOLVED]
    transitions:
      - from: OPEN
        to: REMEDIATED
        trigger: "POST /fhlb/review-findings/{review_finding_id}/remediate"
        actor: TreasuryOfficer
        preconditions:
          - "status == OPEN"
          - "parent review status IN {FINDINGS_ISSUED, REMEDIATION} (else ERR_INVALID_STATE)"
        side_effects: ["the finding stops contributing to weighted_exception_score at close"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /fhlb/review-findings/{review_finding_id}/waive"
        actor: CreditOfficer
        preconditions:
          - "status == OPEN"
          - "parent review status IN {FINDINGS_ISSUED, REMEDIATION}"
          - "X-User-ID != raised_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "waived_by_user_id = X-User-ID"
          - "the finding stops contributing to weighted_exception_score at close"
      - from: OPEN
        to: UNRESOLVED
        trigger: "system, on review close"
        actor: system
        preconditions:
          - "status == OPEN at the moment the parent review closes"
        side_effects:
          - "the finding's weight enters weighted_exception_score"
          - "when severity IN {MAJOR, CRITICAL}, the referenced ELIGIBLE asset is suspended"

  - entity: Advance
    dimension: credit_status
    initial_state: REQUESTED
    terminal_states: [REPAID, PREPAID, CANCELLED_FOR_COLLATERAL]
    transitions:
      - from: REQUESTED
        to: CREDIT_APPROVED
        trigger: "POST /fhlb/advances/{advance_id}/approve"
        actor: CreditOfficer
        preconditions:
          - "credit_status == REQUESTED"
          - "MemberBank.membership_status IN {ACTIVE, PROBATION} (else ERR_MEMBERSHIP_NOT_ACTIVE)"
          - "MemberBank.collateral_posture != FROZEN (else ERR_COLLATERAL_POSTURE_FROZEN)"
          - "MemberBank.collateral_posture != RESTRICTED or term_days <= RESTRICTED_MAX_TERM_DAYS (else ERR_POSTURE_RESTRICTED_TERM_LIMIT)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "when community_program_allocation_id != null, requested_subsidy_cents is committed to the allocation per calculations.setaside_waterfall_commit"
          - "MemberBank.required_activity_stock_cents, required_total_stock_cents and stock_deficiency_cents recomputed; if stock_deficiency_cents > 0 and a REDEMPTION_REQUESTED subscription exists, that subscription reverts to ISSUED"
          - "MemberBank.committed_advances_cents and borrowing_capacity_cents recomputed; collateral_posture re-derived"
          - "increments MemberBank.version by 1"
      - from: CREDIT_APPROVED
        to: FUNDED
        trigger: "POST /fhlb/advances/{advance_id}/fund"
        actor: CreditOfficer
        preconditions:
          - "credit_status == CREDIT_APPROVED"
          - "X-User-ID != approved_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "MemberBank.collateral_posture == OPEN (else ERR_COLLATERAL_POSTURE_FROZEN)"
          - "product.requires_collateral_delivery == false or every ELIGIBLE asset of the member has effective_listing_mode == DELIVERED (else ERR_DELIVERY_NOT_CONFIRMED)"
          - "MemberBank.delivery_required == false or every ELIGIBLE asset of the member has effective_listing_mode == DELIVERED (else ERR_DELIVERY_NOT_CONFIRMED)"
          - "gross_principal_cents <= CERTIFIED capacity excluding this advance's own commitment (else ERR_INSUFFICIENT_BORROWING_CAPACITY)"
          - "when fund_stock_from_advance == false: MemberBank.stock_deficiency_cents == 0 (else ERR_ACTIVITY_STOCK_DEFICIENT)"
        side_effects:
          - "funded_by_user_id = X-User-ID, funded_at = logical clock, maturity_date = funded_at + term_days"
          - "outstanding_principal_cents = gross_principal_cents"
          - "capacity_at_funding_cents = the CERTIFIED capacity used by the precondition"
          - "collateral_status PENDING_VERIFICATION -> SECURED on the collateral dimension"
          - "when fund_stock_from_advance == true, an ACTIVITY StockSubscription of amount_cents = activity_stock_cents is created with advance_id set and immediately ISSUED"
          - "MemberBank.total_outstanding_advances_cents, committed_advances_cents, stock_held_cents, borrowing_capacity_cents recomputed; collateral_posture re-derived"
          - "increments MemberBank.version by 1"
      - from: FUNDED
        to: REPAID
        trigger: "POST /fhlb/advances/{advance_id}/repay"
        actor: CreditOfficer
        preconditions:
          - "credit_status == FUNDED"
          - "logical clock >= maturity_date (else ERR_INVALID_STATE)"
        side_effects:
          - "outstanding_principal_cents = 0; collateral_status -> RELEASED on the collateral dimension"
          - "the ACTIVITY StockSubscription with advance_id == this advance and status == ISSUED moves to REDEMPTION_REQUESTED"
          - "MemberBank.total_outstanding_advances_cents, required_activity_stock_cents, borrowing_capacity_cents recomputed; collateral_posture re-derived, which cures an OPEN shortfall when borrowing_capacity_cents >= 0"
          - "increments MemberBank.version by 1"
      - from: FUNDED
        to: PREPAID
        trigger: "POST /fhlb/prepayment-events/{prepayment_event_id}/settle with prepay_kind == FULL"
        actor: CreditOfficer
        preconditions:
          - "credit_status == FUNDED"
          - "the PrepaymentEvent is QUOTED and within PREPAY_QUOTE_VALIDITY_DAYS of quote_date (else ERR_QUOTE_EXPIRED)"
        side_effects:
          - "L1: PrepaymentEvent -> SETTLED with settled_fee_cents, admin_fee_cents, symmetric_credit_cents and fee_delta_cents from calculations.prepayment_fee; outstanding_principal_cents = 0; collateral_status -> RELEASED; the ACTIVITY StockSubscription with advance_id == this advance and status == ISSUED moves to REDEMPTION_REQUESTED"
          - "L2: because outstanding_principal_cents changed, MemberBank.total_outstanding_advances_cents and borrowing_capacity_cents are recomputed; when shortfall_status == OPEN and borrowing_capacity_cents >= 0 the shortfall moves OPEN -> CURED with shortfall_required_cure_cents = 0"
          - "L3: because the shortfall was cured, collateral_posture is re-derived FROZEN -> RESTRICTED (latest_review_outcome == FAIL) or FROZEN -> OPEN otherwise, and every Advance of the member with collateral_status == SHORTFALL moves back to SECURED"
          - "MemberBank.required_activity_stock_cents and excess_stock_cents recomputed"
          - "increments MemberBank.version by 1"
      - from: REQUESTED
        to: CANCELLED_FOR_COLLATERAL
        trigger: "system, on cascade from MemberBank.collateral_posture becoming FROZEN"
        actor: system
        preconditions:
          - "credit_status IN {REQUESTED, CREDIT_APPROVED}"
          - "MemberBank.collateral_posture just became FROZEN"
        side_effects:
          - "committed subsidy released back to the CommunityProgramAllocation buckets it was charged to"
          - "SUBSCRIBED ACTIVITY subscriptions of this advance -> CANCELLED"
          - "MemberBank.committed_advances_cents, required_activity_stock_cents recomputed"
      - from: CREDIT_APPROVED
        to: CANCELLED_FOR_COLLATERAL
        trigger: "system, on cascade from MemberBank.collateral_posture becoming FROZEN"
        actor: system
        preconditions:
          - "credit_status IN {REQUESTED, CREDIT_APPROVED}"
          - "MemberBank.collateral_posture just became FROZEN"
        side_effects:
          - "same as REQUESTED -> CANCELLED_FOR_COLLATERAL"

  - entity: Advance
    dimension: collateral_status
    initial_state: PENDING_VERIFICATION
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING_VERIFICATION
        to: SECURED
        trigger: "POST /fhlb/advances/{advance_id}/fund"
        actor: CreditOfficer
        preconditions:
          - "credit_status transitions CREDIT_APPROVED -> FUNDED in the same request"
        side_effects: ["the advance now counts in MemberBank.total_outstanding_advances_cents"]
        note: "the two dimensions advance independently: collateral_status may later oscillate SECURED <-> SHORTFALL while credit_status stays FUNDED"
      - from: SECURED
        to: SHORTFALL
        trigger: "system, on MemberBank.collateral_posture becoming FROZEN"
        actor: system
        preconditions:
          - "collateral_status == SECURED"
          - "credit_status == FUNDED"
        side_effects: ["no change to credit_status; the advance stays outstanding and interest-bearing"]
      - from: SHORTFALL
        to: SECURED
        trigger: "system, on MemberBank.shortfall_status moving OPEN -> CURED"
        actor: system
        preconditions:
          - "collateral_status == SHORTFALL"
          - "credit_status == FUNDED"
        side_effects: ["no change to credit_status"]
        note: "cycle SECURED -> SHORTFALL -> SECURED on the collateral dimension"
      - from: SECURED
        to: RELEASED
        trigger: "POST /fhlb/advances/{advance_id}/repay or POST /fhlb/prepayment-events/{prepayment_event_id}/settle with prepay_kind == FULL"
        actor: CreditOfficer
        preconditions:
          - "credit_status moves FUNDED -> REPAID or FUNDED -> PREPAID in the same request"
        side_effects: ["the advance stops counting in MemberBank.total_outstanding_advances_cents"]
      - from: SHORTFALL
        to: RELEASED
        trigger: "POST /fhlb/advances/{advance_id}/repay or POST /fhlb/prepayment-events/{prepayment_event_id}/settle with prepay_kind == FULL"
        actor: CreditOfficer
        preconditions:
          - "credit_status moves FUNDED -> REPAID or FUNDED -> PREPAID in the same request"
        side_effects: ["the advance stops counting in MemberBank.total_outstanding_advances_cents"]

  - entity: PrepaymentEvent
    dimension: status
    initial_state: QUOTED
    terminal_states: [SETTLED, EXPIRED]
    transitions:
      - from: QUOTED
        to: SETTLED
        trigger: "POST /fhlb/prepayment-events/{prepayment_event_id}/settle"
        actor: CreditOfficer
        preconditions:
          - "status == QUOTED"
          - "logical clock <= quote_date + PREPAY_QUOTE_VALIDITY_DAYS (else the event moves to EXPIRED and ERR_QUOTE_EXPIRED is returned)"
          - "Advance.credit_status == FUNDED (else ERR_INVALID_STATE)"
          - "prepay_kind == FULL requires prepay_amount_cents == Advance.outstanding_principal_cents (else ERR_INVALID_REQUEST)"
        side_effects:
          - "settlement_date, settlement_market_rate_bps, settled_remaining_days, admin_fee_cents, symmetric_credit_cents, settled_fee_cents, fee_delta_cents computed"
          - "for prepay_kind == PARTIAL: Advance.outstanding_principal_cents reduced by prepay_amount_cents, credit_status stays FUNDED, collateral_status unchanged"
          - "for prepay_kind == FULL: the Advance credit_status FUNDED -> PREPAID cascade in state_machines.Advance.credit_status runs"
          - "increments MemberBank.version by 1"
      - from: QUOTED
        to: EXPIRED
        trigger: "POST /fhlb/prepayment-events/{prepayment_event_id}/settle after the validity window"
        actor: CreditOfficer
        preconditions:
          - "status == QUOTED"
          - "logical clock > quote_date + PREPAY_QUOTE_VALIDITY_DAYS"
        side_effects:
          - "status = EXPIRED and ERR_QUOTE_EXPIRED (409) is returned; no advance or member field changes"

  - entity: CommunityProgramAllocation
    dimension: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system, on POST /fhlb/advances/{advance_id}/approve when the commit consumes the last remaining cent"
        actor: system
        preconditions:
          - "remaining_cents becomes exactly 0 after the commit"
        side_effects: ["further commits against this allocation are rejected with ERR_ALLOCATION_CLOSED"]
      - from: CLOSED
        to: OPEN
        trigger: "system, on subsidy release from an Advance moving to CANCELLED_FOR_COLLATERAL"
        actor: system
        preconditions:
          - "remaining_cents becomes > 0 after the release"
        side_effects: ["the allocation accepts commits again"]
        note: "cycle OPEN -> CLOSED -> OPEN"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: advance-create-stale-member
    parent_entity: MemberBank
    write_endpoint: "POST /fhlb/advances"
    occ_field: "expected_member_bank_version"
    description: |
      Creating an Advance against a MemberBank whose version has advanced since
      the client last read it is rejected on the stale version. The advance
      request consumes PROVISIONAL borrowing capacity, and every capacity input
      (asset eligibility, other commitments, verification haircut, posture) is
      recorded as a MemberBank mutation; a client working from a stale member
      view would size its request against capacity the bank no longer offers.
      A second create carrying the same expected_member_bank_version as a
      already-accepted create would otherwise legitimately succeed, so the
      rejection is decided purely by the version check.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
  - rule_id: asset-substitute-stale-member
    parent_entity: MemberBank
    write_endpoint: "POST /fhlb/collateral-assets/{collateral_asset_id}/substitute"
    occ_field: "expected_member_bank_version"
    description: |
      Substituting a pledged CollateralAsset when the MemberBank version has
      advanced since the client last read it is rejected on the stale version.
      Substitution is judged against the member's current lendable value and
      posture, and each preceding substitution or eligibility decision bumps
      MemberBank.version; a substitution of a different, still-pledged asset
      would legitimately succeed under the same product rules, so only the
      stale version distinguishes the rejected call.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: membership_stock_requirement
    trigger: "recomputed on MemberBank create, on PATCH condition, and whenever stock_held_cents changes"
    algorithm: threshold
    formula: |
      raw = round_half_up(total_assets_cents * MEMBERSHIP_STOCK_BPS / 10000)
      required_membership_stock_cents =
          min(MEMBERSHIP_STOCK_MAX_CENTS, max(MEMBERSHIP_STOCK_MIN_CENTS, raw))
    input_set: "MemberBank.total_assets_cents only; independent of advances and collateral"
    constants:
      MEMBERSHIP_STOCK_BPS: 12
      MEMBERSHIP_STOCK_MIN_CENTS: 1000000
      MEMBERSHIP_STOCK_MAX_CENTS: 250000000
    precision: "integer cents, round_half_up"

  - name: activity_stock_requirement
    trigger: "recomputed on advance approve / fund / repay / prepay-settle / cancel-for-collateral and on stock issue / repurchase / cancel"
    algorithm: aggregation
    formula: |
      required_activity_stock_cents =
          sum over Advance a where a.member_bank_id == M.id
                                and a.credit_status IN {CREDIT_APPROVED, FUNDED}
              of a.activity_stock_cents
      required_total_stock_cents = required_membership_stock_cents + required_activity_stock_cents
      stock_held_cents =
          sum over StockSubscription s where s.member_bank_id == M.id
                                        and s.status IN {ISSUED, REDEMPTION_REQUESTED}
              of s.amount_cents
      stock_deficiency_cents = max(0, required_total_stock_cents - stock_held_cents)
      excess_stock_cents     = max(0, stock_held_cents - required_total_stock_cents)
    input_set: "advances with credit_status IN {CREDIT_APPROVED, FUNDED} (REQUESTED, REPAID, PREPAID and CANCELLED_FOR_COLLATERAL excluded); subscriptions with status IN {ISSUED, REDEMPTION_REQUESTED} (SUBSCRIBED, REPURCHASED and CANCELLED excluded)"
    constants: {}
    precision: "integer cents; no rounding (pure sums)"

  - name: advance_principal_gross_up
    trigger: "on POST /fhlb/advances, before the PROVISIONAL capacity check; the result is immutable for the life of the advance"
    algorithm: constraint_propagation
    formula: |
      # ceil_to_par(x) = ceil(x / STOCK_PAR_VALUE_CENTS) * STOCK_PAR_VALUE_CENTS
      N = requested_net_proceeds_cents
      P = product.activity_stock_pct_bps
      if fund_stock_from_advance == false:
          gross_principal_cents = N
          activity_stock_cents  = ceil_to_par(round_half_up(N * P / 10000))
          net_proceeds_cents    = N
      else:
          # circular-looking: the stock obligation is a percentage of gross principal,
          # while gross principal must also cover the stock purchase. EVALUATION ORDER
          # IS PINNED to exactly these three steps, in this order:
          #   step 1 provisional gross:  g0 = ceil(N * 10000 / (10000 - P))
          #   step 2 stock from g0:      activity_stock_cents = ceil_to_par(round_half_up(g0 * P / 10000))
          #   step 3 final gross:        gross_principal_cents = N + activity_stock_cents
          g0 = ceil(N * 10000 / (10000 - P))
          activity_stock_cents  = ceil_to_par(round_half_up(g0 * P / 10000))
          gross_principal_cents = N + activity_stock_cents
          net_proceeds_cents    = N
      rate_bps = max(RATE_FLOOR_BPS,
                     product.rate_bps - (community_program_allocation_id != null
                                         ? allocation.subsidy_rate_bps : 0))
    input_set: "the request body plus the selected AdvanceProduct and, when present, the CommunityProgramAllocation"
    constants:
      STOCK_PAR_VALUE_CENTS: 10000
      RATE_FLOOR_BPS: 50
    precision: "integer cents; step 1 uses ceiling, step 2 uses round_half_up then ceiling to the par multiple, step 3 is exact addition"
    note: "step 2 must read g0, NOT the final gross_principal_cents; the fixed point coincides for every product with P <= 2000 but the pinned order is normative"

  - name: effective_listing_mode
    trigger: "recomputed on asset submit, review-eligibility, documentation PATCH, safekeeping confirm, member condition PATCH and pledge-agreement execution"
    algorithm: constraint_propagation
    formula: |
      delivered = custody_location == FHLB_SAFEKEEPING
                  and exists SafekeepingReceipt r where r.collateral_asset_id == asset.id
                                                   and r.status == RECEIVED
      if delivered:                                   effective_listing_mode = DELIVERED
      elif member.pledge_mode == DELIVERY_REQUIRED:   effective_listing_mode = SPECIFIC
      elif member.pledge_mode == SPECIFIC_LISTING:    effective_listing_mode = SPECIFIC
      elif member.pledge_mode == BLANKET_LIEN:        effective_listing_mode = BLANKET
      else:                                           effective_listing_mode = BLANKET
    input_set: "the asset's own custody_location, its SafekeepingReceipt rows with status == RECEIVED, and the owning member's pledge_mode"
    constants: {}
    precision: "n/a (enum)"
    note: "DELIVERY_REQUIRED without a RECEIVED receipt yields SPECIFIC, which is why funding under delivery_required == true fails with ERR_DELIVERY_NOT_CONFIRMED rather than silently using a delivered factor"

  - name: asset_discount_factor
    trigger: "on POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility, and on every recomputation cascade that touches an ELIGIBLE or SUSPENDED asset"
    algorithm: tiered_pricing
    formula: |
      base = BASE_FACTOR_BPS[asset_class][effective_listing_mode]
      if base is undefined (securities under BLANKET) -> asset is INELIGIBLE, reason SECURITIES_NOT_DELIVERED
      f = base
      if ltv_bps > LTV_PENALTY_THRESHOLD_BPS:                        f = f - LTV_PENALTY_BPS
      if delinquency_days >= DELINQUENCY_PENALTY_DAYS:               f = f - DELINQUENCY_PENALTY_BPS
      if documentation_status == EXCEPTION:                          f = f - DOC_EXCEPTION_PENALTY_BPS
      if asset_class IN {CRE, MULTIFAMILY}
         and (clock_date - appraisal_date) in days > STALE_APPRAISAL_DAYS:
                                                                     f = f - STALE_APPRAISAL_PENALTY_BPS
      f = f - member.verification_haircut_bps
      discount_factor_bps = max(FLOOR_FACTOR_BPS, f)
    input_set: "the asset's own fields, its effective_listing_mode, and the owning member's verification_haircut_bps; penalties are additive and evaluated in the order listed"
    constants:
      BASE_FACTOR_BPS: |
        SF_MORTGAGE:    { BLANKET: 7800, SPECIFIC: 8600, DELIVERED: 9200 }
        MULTIFAMILY:    { BLANKET: 6800, SPECIFIC: 7400, DELIVERED: 8000 }
        CRE:            { BLANKET: 5500, SPECIFIC: 6200, DELIVERED: 6800 }
        HELOC:          { BLANKET: 5000, SPECIFIC: 5800, DELIVERED: 6400 }
        SMALL_BUSINESS: { BLANKET: 4000, SPECIFIC: 4800, DELIVERED: 5400 }
        CDFI_COMMUNITY: { BLANKET: 4500, SPECIFIC: 5200, DELIVERED: 5800 }
        AGENCY_MBS:     { SPECIFIC: 9000, DELIVERED: 9400 }
        TREASURY:       { SPECIFIC: 9500, DELIVERED: 9700 }
      LTV_PENALTY_THRESHOLD_BPS: 8000
      LTV_PENALTY_BPS: 500
      LTV_MAX_BPS: 9500
      DELINQUENCY_PENALTY_DAYS: 30
      DELINQUENCY_PENALTY_BPS: 1000
      DELINQUENCY_INELIGIBLE_DAYS: 60
      DOC_EXCEPTION_PENALTY_BPS: 700
      STALE_APPRAISAL_DAYS: 365
      STALE_APPRAISAL_PENALTY_BPS: 300
      FLOOR_FACTOR_BPS: 2000
    precision: "integer basis points; no rounding (all terms are integers)"

  - name: lendable_collateral_value
    trigger: "recomputed whenever any CollateralAsset of the member changes status, factor or basis, and whenever MemberBank.verification_haircut_bps or pledge_mode changes"
    algorithm: aggregation
    formula: |
      per asset:
        collateral_basis_cents = (asset_class IN {AGENCY_MBS, TREASURY})
                                 ? market_value_cents
                                 : min(unpaid_principal_balance_cents, market_value_cents)
        lendable_value_cents   = round_half_up(collateral_basis_cents * discount_factor_bps / 10000)
      # ROUNDING ORDER IS PINNED: round each asset to whole cents FIRST, then sum the
      # rounded per-asset values. Summing the unrounded products and rounding once at
      # the end is NOT the specified behaviour and can differ by cents.
      lendable_collateral_value_cents (CERTIFIED) =
          sum over CollateralAsset a where a.member_bank_id == M.id
                                       and a.status == ELIGIBLE
              of a.lendable_value_cents
    input_set: "CERTIFIED: only assets with status == ELIGIBLE. UNDER_REVIEW, INELIGIBLE, SUSPENDED and SUBSTITUTED assets contribute 0."
    constants: {}
    precision: "integer cents, round_half_up per asset, then exact summation"
    variants:
      - name: CERTIFIED
        when: "MemberBank.lendable_collateral_value_cents, the funding capacity check, posture recomputation and shortfall sizing"
        difference: "includes only status == ELIGIBLE assets at their full rounded lendable_value_cents"
      - name: PROVISIONAL
        when: "the capacity check performed by POST /fhlb/advances and the PROVISIONAL response of GET /fhlb/member-banks/{id}/borrowing-capacity"
        difference: "additionally includes assets with status == UNDER_REVIEW at round_half_up(hypothetical_lendable_value_cents * PROVISIONAL_UNDER_REVIEW_BPS / 10000), where hypothetical_lendable_value_cents applies asset_discount_factor to the asset's current field values as if it had been approved"

  - name: borrowing_capacity
    trigger: "recomputed on every mutation that changes lendable collateral, outstanding advances or commitments; read directly by GET /fhlb/member-banks/{id}/borrowing-capacity"
    algorithm: threshold
    formula: |
      tier_cap_bps = TIER_CAP_BPS[member.credit_rating_tier]
      statutory_cap_cents = round_half_up(total_assets_cents * TOTAL_ASSET_CAP_BPS / 10000)
      capacity_base_cents = min(round_half_up(lendable_collateral_value_cents * tier_cap_bps / 10000),
                                statutory_cap_cents)
      borrowing_capacity_cents = capacity_base_cents
                                 - total_outstanding_advances_cents
                                 - commitments_cents
      # result MAY be negative; a negative value is what opens a collateral shortfall
    input_set: |
      CERTIFIED: lendable from the CERTIFIED variant of lendable_collateral_value;
        outstanding = sum of Advance.outstanding_principal_cents where credit_status == FUNDED;
        commitments = sum of Advance.gross_principal_cents where credit_status IN {REQUESTED, CREDIT_APPROVED}.
      PROVISIONAL: lendable from the PROVISIONAL variant; commitments count only
        credit_status == CREDIT_APPROVED (REQUESTED excluded).
    constants:
      TIER_CAP_BPS: "{ 1: 10000, 2: 9000, 3: 7500, 4: 5000 }"
      TOTAL_ASSET_CAP_BPS: 3000
    precision: "integer cents, round_half_up on each of the two capped terms before min(), then exact subtraction"
    variants:
      - name: PROVISIONAL
        when: "POST /fhlb/advances capacity gate (the request being created is not yet a commitment) and GET .../borrowing-capacity with variant = PROVISIONAL; stored on Advance.capacity_at_request_cents"
        difference: "counts UNDER_REVIEW assets at PROVISIONAL_UNDER_REVIEW_BPS of their hypothetical lendable value and EXCLUDES advances with credit_status == REQUESTED from commitments; therefore reports a larger figure than CERTIFIED for identical data whenever either an UNDER_REVIEW asset or a REQUESTED advance exists"
      - name: CERTIFIED
        when: "MemberBank.borrowing_capacity_cents, posture recomputation, shortfall sizing, POST /fhlb/advances/{id}/fund gate (which additionally excludes the funding advance's own commitment) and GET .../borrowing-capacity with variant = CERTIFIED (the default)"
        difference: "counts only ELIGIBLE assets and INCLUDES REQUESTED advances as commitments"

  - name: collateral_posture_recompute
    trigger: "runs at the end of every mutation that changes lendable_collateral_value_cents, total_outstanding_advances_cents, committed_advances_cents, membership_status, latest_review_outcome or shortfall_status"
    algorithm: constraint_propagation
    formula: |
      # steps run in this exact order; step 2 may change shortfall_status, which step 3 reads
      step 1: recompute lendable_collateral_value_cents, total_outstanding_advances_cents,
              committed_advances_cents and borrowing_capacity_cents (CERTIFIED)
      step 2: if membership_status == SUSPENDED or borrowing_capacity_cents < 0:
                  collateral_posture = FROZEN
                  if shortfall_status == NONE or shortfall_status == CURED:
                      shortfall_status = OPEN
                      shortfall_required_cure_cents = shortfall_cure_requirement
                      shortfall_opened_at = clock
                      shortfall_cure_deadline = clock + SHORTFALL_CURE_DAYS
              elif shortfall_status == OPEN:
                  shortfall_status = CURED
                  shortfall_required_cure_cents = 0
      step 3: if collateral_posture != FROZEN:
                  if shortfall_status == ESCALATED
                     or latest_review_outcome == FAIL
                     or borrowing_capacity_cents
                        < round_half_up(total_outstanding_advances_cents * RESTRICTED_BUFFER_BPS / 10000):
                      collateral_posture = RESTRICTED
                  else:
                      collateral_posture = OPEN
    input_set: "the member's own recomputed aggregates plus latest_review_outcome and shortfall_status"
    constants:
      RESTRICTED_BUFFER_BPS: 500
      SHORTFALL_CURE_DAYS: 5
    precision: "integer cents, round_half_up on the RESTRICTED buffer term"
    note: "when total_outstanding_advances_cents == 0 the RESTRICTED buffer term is 0, so a capacity of exactly 0 is not RESTRICTED by the buffer clause"

  - name: shortfall_cure_requirement
    trigger: "on the transition that sets MemberBank.shortfall_status to OPEN"
    algorithm: aggregation
    formula: |
      shortfall_required_cure_cents =
          (- borrowing_capacity_cents)
          + round_half_up(total_outstanding_advances_cents * SHORTFALL_BUFFER_BPS / 10000)
      # borrowing_capacity_cents is the CERTIFIED value at the instant the shortfall opens
      # and is strictly negative there, so the first term is positive
    input_set: "the member's CERTIFIED borrowing_capacity_cents and total_outstanding_advances_cents at the instant the shortfall opens"
    constants:
      SHORTFALL_BUFFER_BPS: 200
    precision: "integer cents, round_half_up on the buffer term"

  - name: verification_exception_rate
    trigger: "on POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/close"
    algorithm: weighted_scoring
    formula: |
      weighted_exception_score =
          3.0  * count(findings of this review with severity == CRITICAL and status IN {OPEN, UNRESOLVED})
        + 1.0  * count(findings of this review with severity == MAJOR    and status IN {OPEN, UNRESOLVED})
        + 0.25 * count(findings of this review with severity == MINOR    and status IN {OPEN, UNRESOLVED})
      exception_rate_pct = round_half_up(100 * weighted_exception_score / sample_size, 2)
      haircut_bps = 0    if exception_rate_pct <  2.00
                    300  if 2.00 <= exception_rate_pct <  5.00
                    700  if 5.00 <= exception_rate_pct < 10.00
                    1500 if exception_rate_pct >= 10.00
      outcome     = PASS      if exception_rate_pct <  2.00
                    QUALIFIED if 2.00 <= exception_rate_pct < 10.00
                    FAIL      if exception_rate_pct >= 10.00
    input_set: "only findings of this review whose status is OPEN or UNRESOLVED at the moment of close; REMEDIATED and WAIVED findings are excluded entirely. The status snapshot is taken BEFORE the close transition flips OPEN findings to UNRESOLVED, so both statuses are counted identically."
    constants:
      CRITICAL_WEIGHT: 3.0
      MAJOR_WEIGHT: 1.0
      MINOR_WEIGHT: 0.25
      HAIRCUT_BAND_1_PCT: 2.00
      HAIRCUT_BAND_2_PCT: 5.00
      HAIRCUT_BAND_3_PCT: 10.00
    precision: "exception_rate_pct to 2 decimal places, round_half_up; band comparisons use the rounded value with >= at every lower bound"

  - name: setaside_bucket_capacities
    trigger: "on POST /fhlb/community-program-allocations"
    algorithm: waterfall_allocation
    formula: |
      bucket_capacity_first_time_cents      = round_half_up(total_pool_cents * BUCKET_SHARE_FIRST_TIME_BPS / 10000)
      bucket_capacity_rehabilitation_cents  = round_half_up(total_pool_cents * BUCKET_SHARE_REHABILITATION_BPS / 10000)
      general_raw                           = round_half_up(total_pool_cents * BUCKET_SHARE_GENERAL_BPS / 10000)
      residual = total_pool_cents - (bucket_capacity_first_time_cents
                                     + bucket_capacity_rehabilitation_cents
                                     + general_raw)
      bucket_capacity_general_cents = general_raw + residual
      # the rounding residual (positive or negative) always lands on the GENERAL bucket,
      # so the three capacities sum to total_pool_cents exactly
    input_set: "total_pool_cents only"
    constants:
      BUCKET_SHARE_FIRST_TIME_BPS: 3500
      BUCKET_SHARE_REHABILITATION_BPS: 2500
      BUCKET_SHARE_GENERAL_BPS: 4000
    precision: "integer cents, round_half_up per bucket, residual assigned to GENERAL"

  - name: setaside_waterfall_commit
    trigger: "on POST /fhlb/advances/{advance_id}/approve when community_program_allocation_id != null"
    algorithm: waterfall_allocation
    formula: |
      requested = advance.requested_subsidy_cents
      purpose   = advance.community_bucket        # FIRST_TIME_HOMEBUYER | REHABILITATION | GENERAL
      purpose_free = bucket_capacity_<purpose>_cents - bucket_committed_<purpose>_cents
      general_free = bucket_capacity_general_cents  - bucket_committed_general_cents
      # bucket order is fixed: the purpose bucket fills first, the remainder spills to
      # GENERAL only. Spill never crosses between two purpose buckets.
      if purpose == GENERAL:
          if general_free < requested -> ERR_SETASIDE_POOL_EXHAUSTED
          bucket_committed_general_cents += requested
      else:
          take_purpose = min(requested, purpose_free)
          spill        = requested - take_purpose
          if spill > general_free -> ERR_SETASIDE_POOL_EXHAUSTED
          bucket_committed_<purpose>_cents += take_purpose
          bucket_committed_general_cents   += spill
      committed_cents = bucket_committed_first_time_cents
                        + bucket_committed_rehabilitation_cents
                        + bucket_committed_general_cents
      remaining_cents = total_pool_cents - committed_cents
      status = CLOSED if remaining_cents == 0 else OPEN
      # release (advance -> CANCELLED_FOR_COLLATERAL) reverses this exactly: the spill is
      # returned to GENERAL first, then the purpose take is returned to the purpose bucket
    input_set: "the advance's requested_subsidy_cents and community_bucket, plus the allocation's per-bucket capacities and committed amounts"
    constants: {}
    precision: "integer cents; no rounding (pure integer arithmetic)"

  - name: prepayment_fee
    trigger: "QUOTE variant on POST /fhlb/advances/{advance_id}/prepayment-quotes; SETTLEMENT variant on POST /fhlb/prepayment-events/{prepayment_event_id}/settle"
    algorithm: forward_looking
    formula: |
      remaining_days(as_of) = max(0, whole days from as_of date to Advance.maturity_date)
      spread_bps(rate_ref)  = Advance.rate_bps - rate_ref
      # exactly ONE rounding, applied to the whole product:
      base_fee(P, spread, days) = round_half_up(P * spread * days / (10000 * 360))

      method = product.prepayment_fee_method
      if method == NONE:                 raw = 0
      elif method == FLAT_PCT:           raw = round_half_up(P * product.flat_prepayment_fee_bps / 10000)
      elif method == YIELD_MAINTENANCE:  raw = base_fee(P, max(0, spread_bps(rate_ref)), days)
      elif method == SYMMETRIC_MARKET_VALUE:
          raw = base_fee(P, spread_bps(rate_ref), days)      # may be negative
          if raw < 0:
              if product.symmetric_credit_enabled:
                  raw = - min(-raw, round_half_up(P * SYMMETRIC_CREDIT_CAP_BPS / 10000))
              else:
                  raw = 0
      # P = prepay_amount_cents
    input_set: "the PrepaymentEvent's prepay_amount_cents, the Advance's rate_bps and maturity_date, the selected AdvanceProduct's method fields, and the market reinvestment rate in effect at the valuation instant"
    constants:
      PREPAY_ADMIN_FEE_BPS: 5
      SYMMETRIC_CREDIT_CAP_BPS: 200
      PREPAY_QUOTE_VALIDITY_DAYS: 5
      MARKET_RATE_DEFAULT_BPS: 300
    precision: "integer cents, round_half_up; one rounding per named term (base_fee, admin fee, credit cap), then exact addition"
    variants:
      - name: QUOTE
        when: "POST /fhlb/advances/{advance_id}/prepayment-quotes"
        difference: "rate_ref = market rate in effect at quote_date (snapshotted into quoted_market_rate_bps), days = remaining_days(quote_date), and NO administrative fee is added. Result stored in quoted_fee_cents."
      - name: SETTLEMENT
        when: "POST /fhlb/prepayment-events/{prepayment_event_id}/settle"
        difference: "rate_ref = market rate in effect at settlement_date (stored in settlement_market_rate_bps), days = remaining_days(settlement_date), and admin_fee_cents = round_half_up(prepay_amount_cents * PREPAY_ADMIN_FEE_BPS / 10000) is ADDED: settled_fee_cents = raw + admin_fee_cents. Result differs from quoted_fee_cents for identical principal whenever the market rate moved, the settlement date differs from the quote date, or simply because of the admin fee; fee_delta_cents records the difference."

# =============================================================================
# 1.4 Validation Rules Table
# =============================================================================
validations:
  # ---- tier 1: authentication -------------------------------------------------
  - rule_id: auth-header-present
    category: authentication
    priority: 1
    applies_to: "every endpoint"
    condition: "X-User-Role header missing or not one of the six declared roles, or X-User-ID header missing"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401

  # ---- tier 2: authorization --------------------------------------------------
  - rule_id: role-permitted-for-endpoint
    category: authorization
    priority: 2
    applies_to: "every endpoint"
    condition: "the caller's X-User-Role is not listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403

  # ---- tier 3: request shape --------------------------------------------------
  - rule_id: request-shape
    category: request_validation
    priority: 3
    applies_to: "every endpoint with a body or query parameters"
    condition: "a required input field is absent, a field has the wrong type, an enum value is outside its declared set, a numeric field violates its declared range, limit outside 1..100, offset < 0, window_end <= window_start, return_date <= delivery_date, amount_cents <= 0, or prepay_kind == FULL with prepay_amount_cents != Advance.outstanding_principal_cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 422

  - rule_id: stock-amount-par-multiple
    category: request_validation
    priority: 3
    applies_to: "POST /fhlb/stock-subscriptions"
    condition: "amount_cents is not an exact multiple of STOCK_PAR_VALUE_CENTS (10000)"
    error_id: ERR_STOCK_NOT_PAR_MULTIPLE
    http_status: 422

  # ---- tier 4: path resource existence ---------------------------------------
  - rule_id: path-member-bank-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {member_bank_id} in the path"
    condition: "no MemberBank with that id"
    error_id: ERR_MEMBER_BANK_NOT_FOUND
    http_status: 404
  - rule_id: path-stock-subscription-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {stock_subscription_id} in the path"
    condition: "no StockSubscription with that id"
    error_id: ERR_STOCK_SUBSCRIPTION_NOT_FOUND
    http_status: 404
  - rule_id: path-collateral-asset-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {collateral_asset_id} in the path"
    condition: "no CollateralAsset with that id"
    error_id: ERR_COLLATERAL_ASSET_NOT_FOUND
    http_status: 404
  - rule_id: path-safekeeping-receipt-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {safekeeping_receipt_id} in the path"
    condition: "no SafekeepingReceipt with that id"
    error_id: ERR_SAFEKEEPING_RECEIPT_NOT_FOUND
    http_status: 404
  - rule_id: path-review-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {collateral_verification_review_id} in the path"
    condition: "no CollateralVerificationReview with that id"
    error_id: ERR_REVIEW_NOT_FOUND
    http_status: 404
  - rule_id: path-review-finding-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {review_finding_id} in the path"
    condition: "no ReviewFinding with that id"
    error_id: ERR_REVIEW_FINDING_NOT_FOUND
    http_status: 404
  - rule_id: path-advance-product-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {advance_product_id} in the path"
    condition: "no AdvanceProduct with that id"
    error_id: ERR_ADVANCE_PRODUCT_NOT_FOUND
    http_status: 404
  - rule_id: path-advance-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {advance_id} in the path"
    condition: "no Advance with that id"
    error_id: ERR_ADVANCE_NOT_FOUND
    http_status: 404
  - rule_id: path-prepayment-event-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {prepayment_event_id} in the path"
    condition: "no PrepaymentEvent with that id"
    error_id: ERR_PREPAYMENT_EVENT_NOT_FOUND
    http_status: 404
  - rule_id: path-allocation-exists
    category: resource_existence
    priority: 4
    applies_to: "every endpoint with {community_program_allocation_id} in the path"
    condition: "no CommunityProgramAllocation with that id"
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404

  # ---- tier 5: body foreign keys ---------------------------------------------
  - rule_id: body-fk-member-bank
    category: referential_integrity
    priority: 5
    applies_to: "POST /fhlb/stock-subscriptions, POST /fhlb/collateral-assets, POST /fhlb/collateral-verification-reviews, POST /fhlb/advances"
    condition: "member_bank_id in the body does not resolve to a MemberBank"
    error_id: ERR_MEMBER_BANK_NOT_FOUND
    http_status: 404
  - rule_id: body-fk-advance-product
    category: referential_integrity
    priority: 5
    applies_to: "POST /fhlb/advances"
    condition: "advance_product_id in the body does not resolve to an AdvanceProduct"
    error_id: ERR_ADVANCE_PRODUCT_NOT_FOUND
    http_status: 404
  - rule_id: body-fk-allocation
    category: referential_integrity
    priority: 5
    applies_to: "POST /fhlb/advances"
    condition: "community_program_allocation_id is present and does not resolve to a CommunityProgramAllocation"
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
  - rule_id: body-fk-finding-asset
    category: referential_integrity
    priority: 5
    applies_to: "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/findings"
    condition: "collateral_asset_id in the body does not resolve to a CollateralAsset"
    error_id: ERR_COLLATERAL_ASSET_NOT_FOUND
    http_status: 404

  # ---- tier 6: tenant / member scope -----------------------------------------
  - rule_id: treasury-officer-own-member-only
    category: authorization_scope
    priority: 6
    applies_to: "every endpoint whose role list includes TreasuryOfficer"
    condition: "the caller's X-User-Role is TreasuryOfficer and the target resource's owning member_bank_id (resolved through CollateralAsset, StockSubscription, Advance, CollateralVerificationReview or ReviewFinding) is not equal to the caller's X-User-ID"
    error_id: ERR_MEMBER_SCOPE_VIOLATION
    http_status: 403

  # ---- tier 7: optimistic concurrency ----------------------------------------
  - rule_id: member-version-current
    category: concurrency
    priority: 7
    applies_to: "POST /fhlb/advances, POST /fhlb/collateral-assets/{collateral_asset_id}/substitute"
    condition: "expected_member_bank_version does not equal the current MemberBank.version"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

  # ---- tier 8: state legality ------------------------------------------------
  - rule_id: transition-source-state-legal
    category: state
    priority: 8
    applies_to: "every action endpoint that drives a transition in §1.2"
    condition: "the target entity's current state is not a declared source state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
  - rule_id: member-active-for-credit-actions
    category: state
    priority: 8
    applies_to: "POST /fhlb/advances, POST /fhlb/advances/{advance_id}/approve, POST /fhlb/advances/{advance_id}/fund, POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/begin-field-work"
    condition: "the owning MemberBank.membership_status is not in {ACTIVE, PROBATION}"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
  - rule_id: pledge-agreement-executed
    category: state
    priority: 8
    applies_to: "POST /fhlb/collateral-assets, POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility"
    condition: "the owning MemberBank.pledge_agreement_status != EXECUTED"
    error_id: ERR_PLEDGE_AGREEMENT_NOT_EXECUTED
    http_status: 409
  - rule_id: allocation-open
    category: state
    priority: 8
    applies_to: "POST /fhlb/advances/{advance_id}/approve"
    condition: "the referenced CommunityProgramAllocation.status == CLOSED"
    error_id: ERR_ALLOCATION_CLOSED
    http_status: 409
  - rule_id: quote-not-expired
    category: state
    priority: 8
    applies_to: "POST /fhlb/prepayment-events/{prepayment_event_id}/settle"
    condition: "the logical clock is later than quote_date + PREPAY_QUOTE_VALIDITY_DAYS; the event is moved to EXPIRED as part of the rejection"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
  - rule_id: retest-limit
    category: state
    priority: 8
    applies_to: "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/retest"
    condition: "retest_count is already equal to MAX_RETESTS (2)"
    error_id: ERR_RETEST_LIMIT_EXCEEDED
    http_status: 409
  - rule_id: critical-findings-resolved
    category: state
    priority: 8
    applies_to: "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/close, POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/retest, POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility"
    condition: "on close/retest: at least one ReviewFinding of the review has severity == CRITICAL and status == OPEN. On review-eligibility: the asset carries at least one UNRESOLVED finding."
    error_id: ERR_CRITICAL_FINDINGS_OPEN
    http_status: 409
  - rule_id: shortfall-cure-period-blocks-escalation
    category: state
    priority: 8
    applies_to: "POST /fhlb/member-banks/{member_bank_id}/escalate-shortfall"
    condition: "shortfall_status == OPEN and the logical clock is still at or before shortfall_cure_deadline"
    error_id: ERR_SHORTFALL_CURE_PERIOD_ACTIVE
    http_status: 409

  # ---- tier 9: business safety (segregation of duties) -----------------------
  - rule_id: sod-approver-not-funder
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/advances/{advance_id}/fund"
    condition: "the caller's X-User-ID equals Advance.approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
  - rule_id: sod-raiser-not-waiver
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/review-findings/{review_finding_id}/waive"
    condition: "the caller's X-User-ID equals ReviewFinding.raised_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
  - rule_id: posture-frozen-blocks-credit
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/advances, POST /fhlb/advances/{advance_id}/approve, POST /fhlb/advances/{advance_id}/fund"
    condition: "on create/approve: MemberBank.collateral_posture == FROZEN. On fund: MemberBank.collateral_posture != OPEN."
    error_id: ERR_COLLATERAL_POSTURE_FROZEN
    http_status: 409
  - rule_id: posture-restricted-term-limit
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/advances, POST /fhlb/advances/{advance_id}/approve"
    condition: "MemberBank.collateral_posture == RESTRICTED and term_days > RESTRICTED_MAX_TERM_DAYS (90)"
    error_id: ERR_POSTURE_RESTRICTED_TERM_LIMIT
    http_status: 409
  - rule_id: securities-require-delivery
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility"
    condition: "asset_class IN {AGENCY_MBS, TREASURY} and effective_listing_mode == BLANKET (no discount factor is defined for securities under a blanket lien)"
    error_id: ERR_SECURITIES_REQUIRE_DELIVERY
    http_status: 409
  - rule_id: delivery-confirmed-before-funding
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/advances/{advance_id}/fund"
    condition: "AdvanceProduct.requires_collateral_delivery == true or MemberBank.delivery_required == true, and at least one ELIGIBLE asset of the member has effective_listing_mode != DELIVERED"
    error_id: ERR_DELIVERY_NOT_CONFIRMED
    http_status: 409
  - rule_id: documentation-present
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility"
    condition: "documentation_status == MISSING and force_ineligible is not true"
    error_id: ERR_DOCUMENTATION_MISSING
    http_status: 409
  - rule_id: ltv-within-max
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility"
    condition: "ltv_bps > LTV_MAX_BPS (9500) and force_ineligible is not true"
    error_id: ERR_LTV_EXCEEDS_MAX
    http_status: 409
  - rule_id: delinquency-within-max
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility"
    condition: "delinquency_days >= DELINQUENCY_INELIGIBLE_DAYS (60) and force_ineligible is not true"
    error_id: ERR_DELINQUENT_ASSET_INELIGIBLE
    http_status: 409
  - rule_id: substitution-not-value-reducing-while-frozen
    category: business_safety
    priority: 9
    applies_to: "POST /fhlb/collateral-assets/{collateral_asset_id}/substitute"
    condition: "MemberBank.collateral_posture == FROZEN and the replacement asset's hypothetical lendable_value_cents is strictly less than the outgoing asset's lendable_value_cents"
    error_id: ERR_SUBSTITUTION_REDUCES_LENDABLE_VALUE
    http_status: 409

  # ---- tier 10: business referential ----------------------------------------
  - rule_id: finding-asset-belongs-to-reviewed-member
    category: business_referential
    priority: 10
    applies_to: "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/findings"
    condition: "the referenced CollateralAsset.member_bank_id != the review's member_bank_id"
    error_id: ERR_ASSET_MEMBER_MISMATCH
    http_status: 409
  - rule_id: community-product-requires-allocation
    category: business_referential
    priority: 10
    applies_to: "POST /fhlb/advances"
    condition: "AdvanceProduct.community_program_flag == true and community_program_allocation_id is absent, or community_program_allocation_id is present and AdvanceProduct.community_program_flag == false"
    error_id: ERR_PRODUCT_NOT_COMMUNITY_PROGRAM
    http_status: 409
  - rule_id: member-community-lending-eligible
    category: business_referential
    priority: 10
    applies_to: "POST /fhlb/advances"
    condition: "community_program_allocation_id is present and MemberBank.community_lending_eligible == false"
    error_id: ERR_NOT_COMMUNITY_LENDING_ELIGIBLE
    http_status: 409
  - rule_id: asset-eligible-for-safekeeping
    category: business_referential
    priority: 10
    applies_to: "POST /fhlb/collateral-assets/{collateral_asset_id}/safekeeping-receipts"
    condition: "the CollateralAsset.status IN {INELIGIBLE, SUBSTITUTED}"
    error_id: ERR_ASSET_NOT_ELIGIBLE
    http_status: 409

  # ---- tier 11: business temporal -------------------------------------------
  - rule_id: review-window-no-overlap
    category: business_temporal
    priority: 11
    applies_to: "POST /fhlb/collateral-verification-reviews"
    condition: "another CollateralVerificationReview for the same member_bank_id with status != CLOSED has a half-open field-work window [window_start, window_end) that intersects the requested window; adjacency (new.window_start == existing.window_end) does NOT intersect"
    error_id: ERR_REVIEW_WINDOW_OVERLAP
    http_status: 409
  - rule_id: custody-window-no-conflict
    category: business_temporal
    priority: 11
    applies_to: "POST /fhlb/collateral-assets/{collateral_asset_id}/safekeeping-receipts"
    condition: "another SafekeepingReceipt for the same collateral_asset_id with status IN {PENDING_DELIVERY, RECEIVED, EXCEPTION} has a CLOSED custody window [delivery_date, return_date] that conflicts after a CUSTODY_BUFFER_DAYS (2) grace expansion, i.e. new.delivery_date <= existing.return_date + 2 days AND new.return_date >= existing.delivery_date - 2 days"
    error_id: ERR_CUSTODY_WINDOW_CONFLICT
    http_status: 409

  # ---- tier 12: business constraint -----------------------------------------
  - rule_id: term-within-product-range
    category: business_constraint
    priority: 12
    applies_to: "POST /fhlb/advances"
    condition: "term_days < AdvanceProduct.min_term_days or term_days > AdvanceProduct.max_term_days"
    error_id: ERR_TERM_OUT_OF_RANGE
    http_status: 409
  - rule_id: min-principal-met
    category: business_constraint
    priority: 12
    applies_to: "POST /fhlb/advances"
    condition: "the computed gross_principal_cents < AdvanceProduct.min_principal_cents"
    error_id: ERR_MIN_PRINCIPAL_NOT_MET
    http_status: 409
  - rule_id: subsidy-within-principal-cap
    category: business_constraint
    priority: 12
    applies_to: "POST /fhlb/advances"
    condition: "requested_subsidy_cents > round_half_up(gross_principal_cents * MAX_SUBSIDY_PCT_OF_PRINCIPAL_BPS / 10000) with MAX_SUBSIDY_PCT_OF_PRINCIPAL_BPS = 2000; a subsidy exactly equal to the cap passes"
    error_id: ERR_SUBSIDY_EXCEEDS_PRINCIPAL_CAP
    http_status: 409
  - rule_id: redemption-preserves-requirement
    category: business_constraint
    priority: 12
    applies_to: "POST /fhlb/stock-subscriptions/{stock_subscription_id}/request-redemption, POST /fhlb/stock-subscriptions/{stock_subscription_id}/repurchase"
    condition: "MemberBank.stock_held_cents - amount_cents < MemberBank.required_total_stock_cents"
    error_id: ERR_STOCK_REDEMPTION_WOULD_BREACH_REQUIREMENT
    http_status: 409
  - rule_id: membership-stock-before-activation
    category: business_constraint
    priority: 12
    applies_to: "POST /fhlb/member-banks/{member_bank_id}/activate"
    condition: "stock_held_cents < required_membership_stock_cents"
    error_id: ERR_MEMBERSHIP_STOCK_DEFICIENT
    http_status: 409
  - rule_id: activity-stock-covered-at-funding
    category: business_constraint
    priority: 12
    applies_to: "POST /fhlb/advances/{advance_id}/fund"
    condition: "fund_stock_from_advance == false and MemberBank.stock_deficiency_cents > 0"
    error_id: ERR_ACTIVITY_STOCK_DEFICIENT
    http_status: 409

  # ---- tier 13: business fiscal ---------------------------------------------
  - rule_id: capacity-covers-request
    category: business_fiscal
    priority: 13
    applies_to: "POST /fhlb/advances"
    condition: "the computed gross_principal_cents exceeds the PROVISIONAL borrowing capacity of the member"
    error_id: ERR_INSUFFICIENT_BORROWING_CAPACITY
    http_status: 409
  - rule_id: capacity-covers-funding
    category: business_fiscal
    priority: 13
    applies_to: "POST /fhlb/advances/{advance_id}/fund"
    condition: "gross_principal_cents exceeds the CERTIFIED borrowing capacity of the member computed excluding this advance's own commitment"
    error_id: ERR_INSUFFICIENT_BORROWING_CAPACITY
    http_status: 409
  - rule_id: setaside-pool-sufficient
    category: business_fiscal
    priority: 13
    applies_to: "POST /fhlb/advances/{advance_id}/approve"
    condition: "the waterfall commit cannot place requested_subsidy_cents into the purpose bucket plus the GENERAL bucket"
    error_id: ERR_SETASIDE_POOL_EXHAUSTED
    http_status: 409

# =============================================================================
# 1.5 Endpoint Table
# =============================================================================
endpoints:
  # ---------------- MemberBank -----------------------------------------------
  - method: POST
    path: /fhlb/member-banks
    roles: [SystemAdmin]
    input: [name, charter_type, total_assets_cents, "credit_rating_tier?", "cdfi_certified?"]
    output: MemberBank
    side_effects:
      - "membership_status = APPLICANT, pledge_mode = NONE, pledge_agreement_status = NONE, collateral_posture = OPEN, shortfall_status = NONE, version = 1"
      - "required_membership_stock_cents computed per calculations.membership_stock_requirement"
      - "all aggregate money fields initialised to 0; borrowing_capacity_cents computed (0 lendable)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: /fhlb/member-banks/{member_bank_id}
    roles: [SystemAdmin, CreditOfficer, TreasuryOfficer, CollateralCustodian, CollateralReviewAuditor, CommunityLendingManager]
    input: []
    output: MemberBank
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_BANK_NOT_FOUND, ERR_MEMBER_SCOPE_VIOLATION]

  - method: GET
    path: /fhlb/member-banks/{member_bank_id}/borrowing-capacity
    roles: [SystemAdmin, CreditOfficer, TreasuryOfficer, CollateralReviewAuditor, CommunityLendingManager]
    input: ["variant?"]
    output: "inline object (not a stored entity): { variant, lendable_collateral_value_cents, tier_cap_bps, statutory_cap_cents, capacity_base_cents, outstanding_advances_cents, commitments_cents, borrowing_capacity_cents }"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_MEMBER_BANK_NOT_FOUND, ERR_MEMBER_SCOPE_VIOLATION]
    note: "variant defaults to CERTIFIED; PROVISIONAL applies the PROVISIONAL variant of calculations.borrowing_capacity. This is a pure read and does not persist anything."

  - method: POST
    path: /fhlb/member-banks/{member_bank_id}/activate
    roles: [CreditOfficer]
    input: []
    output: MemberBank
    side_effects:
      - "drives state_machines.MemberBank.membership_status APPLICANT -> ACTIVE"
      - "recomputes community_lending_eligible, delivery_required and collateral_posture"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_BANK_NOT_FOUND, ERR_INVALID_STATE, ERR_MEMBERSHIP_STOCK_DEFICIENT]

  - method: PATCH
    path: /fhlb/member-banks/{member_bank_id}/condition
    roles: [CreditOfficer]
    input: ["membership_status?", "credit_rating_tier?"]
    output: MemberBank
    side_effects:
      - "drives the requested transition in state_machines.MemberBank.membership_status when membership_status is supplied"
      - "credit_rating_tier change re-derives delivery_required and re-runs calculations.borrowing_capacity and calculations.collateral_posture_recompute"
      - "a change to PROBATION/SUSPENDED that flips delivery_required re-derives effective_listing_mode, discount_factor_bps and lendable_value_cents for the member's ELIGIBLE and SUSPENDED assets"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_MEMBER_BANK_NOT_FOUND, ERR_INVALID_STATE]

  - method: POST
    path: /fhlb/member-banks/{member_bank_id}/pledge-agreement
    roles: [CreditOfficer]
    input: [pledge_mode, effective_date]
    output: MemberBank
    side_effects:
      - "pledge_agreement_status = EXECUTED, pledge_mode and pledge_agreement_effective_date set from the request"
      - "re-derives delivery_required, then effective_listing_mode / discount_factor_bps / lendable_value_cents for every ELIGIBLE or SUSPENDED asset of the member"
      - "re-runs calculations.borrowing_capacity and calculations.collateral_posture_recompute"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_MEMBER_BANK_NOT_FOUND]
    note: "pledge_mode must be one of BLANKET_LIEN, SPECIFIC_LISTING, DELIVERY_REQUIRED; re-execution with a different mode is allowed and re-runs the whole cascade"

  - method: POST
    path: /fhlb/member-banks/{member_bank_id}/escalate-shortfall
    roles: [CreditOfficer]
    input: []
    output: MemberBank
    side_effects:
      - "shortfall_status OPEN -> ESCALATED once the cure deadline has passed"
      - "membership_status ACTIVE -> PROBATION"
      - "collateral_posture stays FROZEN; delivery_required becomes true"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_BANK_NOT_FOUND, ERR_INVALID_STATE, ERR_SHORTFALL_CURE_PERIOD_ACTIVE]

