# =============================================================================
# SCAFFOLD.yaml — Unit Turnover & Make-Ready Management
# §1.0–§1.7 seed tables (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Unit Turnover & Make-Ready Management (apartment operations team): vacancy notice & turn scope determination, vendor scheduling sequence (clean/paint/repair/carpet) & days-to-ready target, budget per turn & scope creep control, quality inspection & re-work, appliance/fixture replacement decision vs repair, capital vs expense classification, pre-leasing during turn & delivery date commitment, turn cost benchmarking

domain_name: unit-turnover-make-ready
api_prefix: /make-ready

complexity_profile:
  primary_archetype: workflow_orchestration      # turn pipeline with rework loop
  secondary_archetype: temporal_windowing        # vendor calendar + unit window intervals
  complexity_layers:
    - cascading_side_effects                     # inspection FAIL → rework → totals → commitment risk
    - rate_threshold_triggers                    # scope-creep variance tiers (PM / RM approval)
    - optimistic_concurrency                     # OCC on Turn.version for scope-item approval
    - derived_field_reconciliation               # turn cost rollups, property benchmark aggregates
  entity_topology: flat                          # peer collections joined by FK references
  state_machine_shape: cyclic                    # turn rework loop, commitment risk flips, unit lifecycle loop
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: approval_chain                     # TurnCoordinator → PropertyManager → RegionalManager tiers
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property name" }
      - { name: days_to_ready_target, type: integer, source: input, description: "Target calendar days from turn start (finalize) to ready" }
      - { name: pm_threshold_bp, type: integer, source: input, description: "Scope-creep variance in basis points above approved budget that requires PropertyManager approval (<= this value auto-approves)" }
      - { name: rm_threshold_bp, type: integer, source: input, description: "Variance bp above approved budget that requires RegionalManager approval; must be >= pm_threshold_bp" }
      - { name: capital_threshold_cents, type: integer, source: input, description: "REPLACE decisions with replace_estimate_cents >= this value classify as CAPITAL" }
      - { name: replacement_policy, type: enum, source: input, description: "PERCENT_OF_REPLACE | COST_PER_YEAR — selects the repair-economics variant" }
      - { name: benchmark_turn_count, type: integer, source: computed, default: 0, description: "Count of CLOSED turns included in the benchmark" }
      - { name: avg_booked_expense_cents, type: integer, source: computed, default: 0, description: "round_half_up(mean of booked_expense_cents over CLOSED turns)" }
      - { name: avg_days_to_ready, type: integer, source: computed, default: 0, description: "round_half_up(mean of (actual_ready_date - started_on) in days over CLOSED turns)" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; owning property" }
      - { name: unit_number, type: string, source: input, description: "Unit label within the property" }
      - { name: square_feet, type: integer, source: input, description: "Unit area" }
      - { name: status, type: enum, source: system, description: "OCCUPIED | NOTICE | IN_TURN | READY; initial OCCUPIED" }

  - name: Turn
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit being turned" }
      - { name: notice_date, type: string, source: input, description: "ISO date resident gave vacancy notice" }
      - { name: move_out_date, type: string, source: input, description: "ISO date resident vacates; must be >= notice_date" }
      - { name: status, type: enum, source: system, description: "OPEN | SCOPED | IN_PROGRESS | REWORK | READY | CLOSED | CANCELLED; initial OPEN" }
      - { name: started_on, type: string, source: system, description: "ISO date scope was finalized (logical clock date); null until SCOPED" }
      - { name: target_ready_date, type: string, source: computed, description: "started_on + property.days_to_ready_target; null until SCOPED" }
      - { name: actual_ready_date, type: string, source: system, description: "ISO date inspection passed; null until READY" }
      - { name: projected_ready_date, type: string, source: computed, description: "Forward-looking ready-date projection (see projected_ready_date calculation); null until SCOPED" }
      - { name: approved_budget_cents, type: integer, source: system, default: 0, description: "Budget locked at finalize-scope; increased by each approved post-finalization scope item" }
      - { name: estimated_cost_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_cost_cents over scope items in {PLANNED, SCHEDULED, COMPLETED, FAILED}" }
      - { name: expense_actual_cents, type: integer, source: computed, default: 0, description: "Sum of actual_cost_cents over COMPLETED|FAILED items classified EXPENSE" }
      - { name: capital_actual_cents, type: integer, source: computed, default: 0, description: "Sum of actual_cost_cents over COMPLETED|FAILED items classified CAPITAL" }
      - { name: total_actual_cents, type: integer, source: computed, default: 0, description: "= expense_actual_cents + capital_actual_cents (partition invariant)" }
      - { name: booked_expense_cents, type: integer, source: computed, default: 0, description: "Expense actuals plus per-item overhead (see booked_cost_overhead); feeds the property benchmark" }

  - name: ScopeItem
    parent: null
    common_fields: true
    fields:
      - { name: turn_id, type: string, source: input, description: "FK -> Turn.id; owning turn" }
      - { name: category, type: enum, source: input, description: "REPAIR | PAINT | CARPET | CLEAN | APPLIANCE | FIXTURE | OTHER" }
      - { name: description, type: string, source: input, description: "Work description" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated cost; overwritten by a replacement decision's chosen path estimate" }
      - { name: actual_cost_cents, type: integer, source: system, description: "Actual cost, set from the completing VendorAssignment; null until COMPLETED" }
      - { name: classification, type: enum, source: system, default: "EXPENSE", description: "EXPENSE | CAPITAL; CAPITAL only via a REPLACE replacement decision at/above the property capital threshold" }
      - { name: sequence_rank, type: integer, source: computed, description: "Scheduling order from category: REPAIR=1, APPLIANCE=2, FIXTURE=3, PAINT=4, CARPET=5, CLEAN=6, OTHER=7" }
      - { name: approval_tier, type: enum, source: system, default: "NONE", description: "NONE | PM | RM — scope-creep approval tier computed at creation (see scope_creep_tier)" }
      - { name: status, type: enum, source: system, description: "PLANNED | PENDING_APPROVAL | SCHEDULED | COMPLETED | FAILED | VOIDED | REJECTED" }
      - { name: rework_of_item_id, type: string, source: system, description: "FK -> ScopeItem.id; set on auto-created rework items, references the FAILED original; null for normal items" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor company name" }
      - { name: trade, type: enum, source: input, description: "REPAIR | PAINT | CARPET | CLEAN — must match a scope item's category to be assigned (APPLIANCE/FIXTURE/OTHER items use REPAIR-trade vendors)" }
      - { name: open_assignment_count, type: integer, source: computed, default: 0, description: "Count of this vendor's assignments in {SCHEDULED, ACCEPTED}; conserved by create+decline round trips" }

  - name: VendorAssignment
    parent: null
    common_fields: true
    fields:
      - { name: scope_item_id, type: string, source: input, description: "FK -> ScopeItem.id; work being scheduled" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; assigned vendor" }
      - { name: start_date, type: string, source: input, description: "ISO date work starts (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO date work ends (exclusive); must be > start_date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACCEPTED | COMPLETED | DECLINED | CANCELLED; initial SCHEDULED" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Actual invoiced cost, supplied at completion; null until COMPLETED" }

  - name: Inspection
    parent: null
    common_fields: false
    fields:
      - { name: turn_id, type: string, source: system, description: "FK -> Turn.id; from path" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: failed_scope_item_ids, type: array, source: input, description: "Scope item ids that failed; required and non-empty iff result=FAIL, must be absent/empty iff result=PASS" }
      - { name: notes, type: string, source: input, description: "Inspector notes", required: false }

  - name: ReplacementDecision
    parent: null
    common_fields: false
    fields:
      - { name: turn_id, type: string, source: system, description: "FK -> Turn.id; from path" }
      - { name: scope_item_id, type: string, source: input, description: "FK -> ScopeItem.id; item must be category APPLIANCE or FIXTURE" }
      - { name: repair_estimate_cents, type: integer, source: input, description: "Estimated cost to repair the asset" }
      - { name: replace_estimate_cents, type: integer, source: input, description: "Estimated cost to replace the asset" }
      - { name: repair_life_years, type: integer, source: input, description: "Expected years of service after repair; >= 1" }
      - { name: remaining_life_years, type: integer, source: input, description: "Expected years of service of a new asset; >= 1" }
      - { name: decision, type: enum, source: input, description: "REPAIR | REPLACE" }
      - { name: policy_applied, type: enum, source: system, description: "PERCENT_OF_REPLACE | COST_PER_YEAR — the property's replacement_policy at decision time" }
      - { name: resulting_classification, type: enum, source: system, description: "EXPENSE | CAPITAL — REPAIR always EXPENSE; REPLACE is CAPITAL iff replace_estimate_cents >= property.capital_threshold_cents" }

  - name: LeaseCommitment
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; pre-leased unit" }
      - { name: applicant_name, type: string, source: input, description: "Prospective resident name" }
      - { name: committed_delivery_date, type: string, source: input, description: "ISO date the unit is promised to the applicant; must be >= the active turn's projected_ready_date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | AT_RISK | FULFILLED | BREACHED | CANCELLED; initial ACTIVE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Unit
    initial_state: OCCUPIED
    terminal_states: []
    note: "Cyclic lifecycle: OCCUPIED → NOTICE → IN_TURN → READY → OCCUPIED (move-in closes the loop)"
    transitions:
      - from: OCCUPIED
        to: NOTICE
        trigger: "system (POST /make-ready/turns creation on this unit)"
        actor: system
        preconditions: ["unit.status == OCCUPIED (else ERR_UNIT_NOT_OCCUPIED)"]
        side_effects: []
      - from: NOTICE
        to: IN_TURN
        trigger: "system (turn finalize-scope: turn OPEN → SCOPED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOTICE
        to: OCCUPIED
        trigger: "system (turn cancelled while OPEN — notice rescinded before scope lock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TURN
        to: OCCUPIED
        trigger: "system (turn cancelled while SCOPED — notice rescinded after scope lock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TURN
        to: READY
        trigger: "system (inspection PASS: turn IN_PROGRESS → READY)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: OCCUPIED
        trigger: "POST /make-ready/units/{id}/record-move-in"
        actor: TurnCoordinator
        preconditions: ["unit.status == READY (else ERR_INVALID_STATE)"]
        side_effects:
          - "If the unit has a LeaseCommitment in ACTIVE|AT_RISK: move_in_date <= committed_delivery_date → FULFILLED, else → BREACHED"

  - entity: Turn
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: SCOPED
        trigger: "POST /make-ready/turns/{id}/finalize-scope"
        actor: TurnCoordinator
        preconditions:
          - "turn.status == OPEN (else ERR_INVALID_STATE)"
          - "at least one scope item of this turn is PLANNED (else ERR_NO_SCOPE_ITEMS)"
        side_effects:
          - "approved_budget_cents := estimated_cost_cents (sum over PLANNED items)"
          - "started_on := current logical-clock date"
          - "target_ready_date := started_on + property.days_to_ready_target"
          - "projected_ready_date := projected_ready_date calculation"
          - "Unit NOTICE → IN_TURN"
          - "increments Turn.version by 1"
      - from: SCOPED
        to: IN_PROGRESS
        trigger: "system (first VendorAssignment on any item of this turn becomes ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["increments Turn.version by 1"]
      - from: REWORK
        to: IN_PROGRESS
        trigger: "system (first VendorAssignment on a rework item (rework_of_item_id non-null) of this turn becomes ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["increments Turn.version by 1"]
      - from: IN_PROGRESS
        to: REWORK
        trigger: "system (Inspection submitted with result=FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Each listed scope item COMPLETED → FAILED"
          - "Each FAILED item auto-creates a rework ScopeItem (same category, status PLANNED, estimated_cost_cents := failed item's actual_cost_cents, classification EXPENSE, approval_tier NONE, rework_of_item_id := failed item id)"
          - "Recompute turn.estimated_cost_cents and projected_ready_date (link caused by rework-item creation)"
          - "If projected_ready_date now > some ACTIVE commitment's committed_delivery_date on this unit: that LeaseCommitment ACTIVE → AT_RISK (link caused by the projection change)"
          - "increments Turn.version by 1"
      - from: IN_PROGRESS
        to: READY
        trigger: "system (Inspection submitted with result=PASS)"
        actor: system
        preconditions: []
        side_effects:
          - "actual_ready_date := current logical-clock date"
          - "Unit IN_TURN → READY"
          - "increments Turn.version by 1"
      - from: READY
        to: CLOSED
        trigger: "POST /make-ready/turns/{id}/close"
        actor: PropertyManager
        preconditions: ["turn.status == READY (else ERR_INVALID_STATE)"]
        side_effects:
          - "Property benchmark aggregates recomputed including this turn (see property_benchmark)"
          - "increments Turn.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /make-ready/turns/{id}/cancel"
        actor: PropertyManager
        preconditions: ["turn.status ∈ {OPEN, SCOPED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "Unit NOTICE → OCCUPIED"
          - "Scope items PLANNED → VOIDED, PENDING_APPROVAL → REJECTED, SCHEDULED → VOIDED"
          - "Each VOIDED item's SCHEDULED|ACCEPTED VendorAssignment → CANCELLED (chain link caused by the item voiding)"
          - "LeaseCommitment ACTIVE|AT_RISK on this unit → CANCELLED"
          - "increments Turn.version by 1"
      - from: SCOPED
        to: CANCELLED
        trigger: "POST /make-ready/turns/{id}/cancel"
        actor: PropertyManager
        preconditions: ["turn.status ∈ {OPEN, SCOPED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "Unit IN_TURN → OCCUPIED"
          - "Scope items PLANNED → VOIDED, PENDING_APPROVAL → REJECTED, SCHEDULED → VOIDED"
          - "Each VOIDED item's SCHEDULED|ACCEPTED VendorAssignment → CANCELLED"
          - "LeaseCommitment ACTIVE|AT_RISK on this unit → CANCELLED"
          - "increments Turn.version by 1"

  - entity: ScopeItem
    initial_state: PLANNED
    terminal_states: [FAILED, VOIDED, REJECTED]
    note: "Initial state is PLANNED when the turn is OPEN or the scope-creep tier is NONE; PENDING_APPROVAL when the tier is PM|RM. Rework items are always created PLANNED."
    transitions:
      - from: PENDING_APPROVAL
        to: PLANNED
        trigger: "POST /make-ready/scope-items/{id}/approve"
        actor: "PropertyManager or RegionalManager"
        preconditions:
          - "item.status == PENDING_APPROVAL (else ERR_INVALID_STATE)"
          - "tier authority: item.approval_tier == PM allows PM or RM; item.approval_tier == RM allows only RM (else ERR_APPROVAL_AUTHORITY_EXCEEDED)"
          - "OCC: expected_turn_version == turn.version (else ERR_STALE_VERSION)"
        side_effects:
          - "turn.approved_budget_cents += item.estimated_cost_cents"
          - "Recompute turn.estimated_cost_cents and projected_ready_date; commitment risk flips re-evaluated"
          - "increments Turn.version by 1"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /make-ready/scope-items/{id}/reject"
        actor: "PropertyManager or RegionalManager"
        preconditions:
          - "item.status == PENDING_APPROVAL (else ERR_INVALID_STATE)"
          - "tier authority identical to approve (else ERR_APPROVAL_AUTHORITY_EXCEEDED)"
        side_effects: []
      - from: PLANNED
        to: SCHEDULED
        trigger: "system (VendorAssignment created for this item)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: PLANNED
        trigger: "system (assignment DECLINED, or assignment CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["Recompute turn.projected_ready_date; commitment risk flips re-evaluated"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (assignment COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "actual_cost_cents := assignment.actual_cost_cents"
          - "Recompute turn.expense_actual_cents / capital_actual_cents / total_actual_cents / booked_expense_cents and projected_ready_date (chain link caused by this completion)"
      - from: COMPLETED
        to: FAILED
        trigger: "system (Inspection FAIL lists this item)"
        actor: system
        preconditions: []
        side_effects: ["Rework item auto-created (see Turn IN_PROGRESS → REWORK)"]
      - from: PLANNED
        to: VOIDED
        trigger: "POST /make-ready/scope-items/{id}/void, or system (turn cancelled)"
        actor: "TurnCoordinator or system"
        preconditions: ["item.status ∈ {PLANNED, SCHEDULED} (else ERR_INVALID_STATE)"]
        side_effects: ["Recompute turn.estimated_cost_cents and projected_ready_date; commitment risk flips re-evaluated"]
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /make-ready/scope-items/{id}/void, or system (turn cancelled)"
        actor: "TurnCoordinator or system"
        preconditions: ["item.status ∈ {PLANNED, SCHEDULED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "This item's SCHEDULED|ACCEPTED VendorAssignment → CANCELLED (chain link caused by this voiding)"
          - "Recompute turn.estimated_cost_cents and projected_ready_date; commitment risk flips re-evaluated"

  - entity: VendorAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACCEPTED
        trigger: "POST /make-ready/vendor-assignments/{id}/accept"
        actor: Vendor
        preconditions:
          - "X-User-ID == assignment.vendor_id (else ERR_VENDOR_NOT_ASSIGNED)"
          - "assignment.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "If turn SCOPED → IN_PROGRESS; if turn REWORK and item is a rework item → IN_PROGRESS"
          - "Recompute turn.projected_ready_date; commitment risk flips re-evaluated"
      - from: SCHEDULED
        to: DECLINED
        trigger: "POST /make-ready/vendor-assignments/{id}/decline"
        actor: Vendor
        preconditions:
          - "X-User-ID == assignment.vendor_id (else ERR_VENDOR_NOT_ASSIGNED)"
          - "assignment.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects: ["ScopeItem SCHEDULED → PLANNED; turn.projected_ready_date recomputed (chain link caused by this decline)"]
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /make-ready/vendor-assignments/{id}/complete"
        actor: Vendor
        preconditions:
          - "X-User-ID == assignment.vendor_id (else ERR_VENDOR_NOT_ASSIGNED)"
          - "assignment.status == ACCEPTED (else ERR_INVALID_STATE)"
        side_effects: ["ScopeItem SCHEDULED → COMPLETED with actual_cost_cents from this assignment; turn actuals recomputed (chain link caused by the item completion)"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (owning scope item VOIDED, or turn cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system (owning scope item VOIDED, or turn cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LeaseCommitment
    initial_state: ACTIVE
    terminal_states: [FULFILLED, BREACHED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: AT_RISK
        trigger: "system (any recompute of the active turn's projected_ready_date — including clock-set — yields projected_ready_date > committed_delivery_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: ACTIVE
        trigger: "system (a later recompute yields projected_ready_date <= committed_delivery_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (record-move-in with move_in_date <= committed_delivery_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: FULFILLED
        trigger: "system (record-move-in with move_in_date <= committed_delivery_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: BREACHED
        trigger: "system (record-move-in with move_in_date > committed_delivery_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: BREACHED
        trigger: "system (record-move-in with move_in_date > committed_delivery_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /make-ready/lease-commitments/{id}/cancel, or system (turn cancelled)"
        actor: "TurnCoordinator, PropertyManager, or system"
        preconditions: ["commitment.status ∈ {ACTIVE, AT_RISK} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: AT_RISK
        to: CANCELLED
        trigger: "POST /make-ready/lease-commitments/{id}/cancel, or system (turn cancelled)"
        actor: "TurnCoordinator, PropertyManager, or system"
        preconditions: ["commitment.status ∈ {ACTIVE, AT_RISK} (else ERR_INVALID_STATE)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: scope-item-approval-stale-turn
    parent_entity: Turn
    write_endpoint: "POST /make-ready/scope-items/{id}/approve"
    occ_field: expected_turn_version
    description: |
      Approving a PENDING_APPROVAL scope item against a Turn whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just approved a different pending item
      (legitimately raising approved_budget_cents and re-tiering future adds)
      and the current writer's view of the turn budget is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: turn_estimated_cost
    trigger: "scope item created PLANNED, approved, voided, rejected, failed, or rework item auto-created"
    algorithm: aggregation
    formula: |
      turn.estimated_cost_cents =
        sum(item.estimated_cost_cents for items of the turn
            where item.status IN {PLANNED, SCHEDULED, COMPLETED, FAILED})
      PENDING_APPROVAL, VOIDED and REJECTED items are excluded.
    input_set: "ScopeItems of the turn with status IN {PLANNED, SCHEDULED, COMPLETED, FAILED}"
    precision: "integer cents, no rounding"

  - name: turn_actual_cost_views
    trigger: "assignment completion (item → COMPLETED), inspection fail (item → FAILED), replacement decision reclassification"
    algorithm: aggregation
    formula: |
      expense_actual_cents = sum(actual_cost_cents over items status IN {COMPLETED, FAILED} AND classification == EXPENSE)
      capital_actual_cents = sum(actual_cost_cents over items status IN {COMPLETED, FAILED} AND classification == CAPITAL)
      total_actual_cents   = expense_actual_cents + capital_actual_cents   # partition invariant: every booked cent lands in exactly one bucket
    input_set: "ScopeItems of the turn with status IN {COMPLETED, FAILED}"
    precision: "integer cents, no rounding"
    variants:
      - name: operating_view
        when: "budget control, scope-creep context, benchmark input"
        difference: "uses expense_actual_cents only; capital work is excluded"
      - name: all_in_view
        when: "total cash-out view of the turn"
        difference: "uses total_actual_cents (expense + capital); identical items yield a different number whenever any CAPITAL item exists"

  - name: booked_cost_overhead
    trigger: "assignment completion, inspection fail (recompute of turn.booked_expense_cents)"
    algorithm: aggregation
    formula: |
      For each EXPENSE-classified item with status IN {COMPLETED, FAILED}:
        item_overhead_cents = round_half_up(item.actual_cost_cents * OVERHEAD_BP / 10000)   # round PER ITEM first
        item_booked_cents   = item.actual_cost_cents + item_overhead_cents
      turn.booked_expense_cents = sum(item_booked_cents)
      PINNED ORDER: per-item overhead is rounded to whole cents BEFORE summation.
      Sum-then-round is forbidden (e.g. two items of 1010 cents each: per-item gives
      25 + 25 = 50 overhead → booked 2070; sum-then-round would give round_half_up(50.50) = 51 → 2071).
    constants:
      OVERHEAD_BP: 250   # 2.5% property-management overhead allocation
    precision: "integer cents, round_half_up per item before summation"

  - name: scope_creep_tier
    trigger: "POST /make-ready/scope-items when turn.status IN {SCOPED, IN_PROGRESS, REWORK}"
    algorithm: threshold
    formula: |
      would_be_estimated = turn.estimated_cost_cents + new_item.estimated_cost_cents
      variance_bp = round_half_up((would_be_estimated - turn.approved_budget_cents) * 10000 / turn.approved_budget_cents)
      (variance_bp may be negative when would_be_estimated <= approved_budget_cents)
      if variance_bp <= property.pm_threshold_bp:   approval_tier = NONE  → item created PLANNED (auto-approved)
      elif variance_bp <= property.rm_threshold_bp: approval_tier = PM    → item created PENDING_APPROVAL
      else:                                          approval_tier = RM    → item created PENDING_APPROVAL
      BOUNDARY: equality at pm_threshold_bp auto-approves (<=, not <); equality at rm_threshold_bp stays PM tier.
    input_set: "the candidate scope item plus the turn's current estimated_cost_cents and approved_budget_cents"
    precision: "basis points, round_half_up"

  - name: projected_ready_date
    trigger: "scope item created PLANNED / approved / voided / rejected; assignment created / accepted / declined / completed / cancelled; inspection PASS or FAIL; clock set"
    algorithm: forward_looking
    formula: |
      C1 = current logical-clock date
      C2 = max(end_date over this turn's assignments with status IN {SCHEDULED, ACCEPTED}); ignored if none
      anchor = max(C1, C2)  (C1 alone if C2 absent)
      For each scope item with status == PLANNED, processed in ascending
      (sequence_rank, created_at) order:
          if item.category == CARPET AND the turn has any PAINT-category item
             with status NOT IN {COMPLETED, VOIDED, REJECTED, FAILED}:
                 anchor += CURE_BUFFER_DAYS          # mandatory cure day before carpet
          anchor += STANDARD_DAYS[item.category]
      turn.projected_ready_date = anchor
      SIDE EFFECT OF RECOMPUTE: every ACTIVE|AT_RISK LeaseCommitment on this unit is
      re-evaluated: projected > committed_delivery_date → AT_RISK; projected <= committed → ACTIVE.
    constants:
      CURE_BUFFER_DAYS: 1
      STANDARD_DAYS: { REPAIR: 2, PAINT: 2, CARPET: 1, CLEAN: 1, APPLIANCE: 1, FIXTURE: 1, OTHER: 1 }
    precision: "whole ISO dates"

  - name: replacement_policy_verdict
    trigger: "POST /make-ready/turns/{id}/replacement-decisions with decision == REPAIR"
    algorithm: threshold
    formula: |
      Variant is selected by property.replacement_policy; a REPAIR decision that is
      uneconomical under the active variant is rejected with ERR_UNECONOMICAL_REPAIR.
      REPLACE decisions are never rejected by this rule.
      policy_applied is stamped from the property at decision time.
    input_set: "the decision's repair/replace estimates and life-year inputs"
    precision: "integer-exact comparisons (cross-multiplied, no float)"
    variants:
      - name: PERCENT_OF_REPLACE
        when: "property.replacement_policy == PERCENT_OF_REPLACE"
        difference: "REPAIR economical iff repair_estimate_cents < round_half_up(replace_estimate_cents * REPAIR_REPLACE_RATIO); strict <"
      - name: COST_PER_YEAR
        when: "property.replacement_policy == COST_PER_YEAR"
        difference: "REPAIR economical iff repair_estimate_cents * remaining_life_years < replace_estimate_cents * repair_life_years; identical inputs can yield the opposite verdict (e.g. repair 49000 / replace 100000 / lives 3 vs 10: PERCENT allows, COST_PER_YEAR denies)"
    constants:
      REPAIR_REPLACE_RATIO: 0.5

  - name: property_benchmark
    trigger: "turn CLOSED (POST /make-ready/turns/{id}/close)"
    algorithm: aggregation
    formula: |
      S = all turns of the property with status == CLOSED (CANCELLED and non-terminal turns excluded; no time window)
      benchmark_turn_count    = |S|
      avg_booked_expense_cents = round_half_up(sum(t.booked_expense_cents for t in S) / |S|)   (0 when S empty)
      avg_days_to_ready        = round_half_up(sum(t.actual_ready_date - t.started_on, in whole days, for t in S) / |S|)   (0 when S empty)
    input_set: "CLOSED turns of the property only"
    precision: "integer, round_half_up of the final mean"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, types valid, enum values in domain, unknown fields rejected, end_date > start_date, move_out_date >= notice_date, failed_scope_item_ids present iff result=FAIL"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body foreign-key ids (unit_id, turn_id, scope_item_id, vendor_id, property_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: auth
    check: "Vendor ownership: X-User-ID == assignment.vendor_id on vendor action endpoints"
    error_id: ERR_VENDOR_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /make-ready/vendor-assignments/{id}/accept, decline, complete"
  - priority: 6
    category: state
    check: "Target resource in a valid state for the operation (turn status for item add / finalize / close / cancel / inspection / commitment; item status for approve / reject / void / decision; assignment status for accept / decline / complete; unit OCCUPIED for turn create; unit READY for move-in; failed inspection items must be COMPLETED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6.1
    category: state
    check: "Turn creation requires the unit to be OCCUPIED (no other non-terminal turn or notice)"
    error_id: ERR_UNIT_NOT_OCCUPIED
    http_status: 409
    applies_to: "POST /make-ready/turns"
  - priority: 6.5
    category: state
    check: "OCC: expected_turn_version == turn.version on scope-item approve (evaluated after state preconditions, before business rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /make-ready/scope-items/{id}/approve"
  - priority: 7
    category: business_referential
    check: "Vendor trade matches item category mapping (REPAIR/PAINT/CARPET/CLEAN exact; APPLIANCE/FIXTURE/OTHER require REPAIR trade); no prior replacement decision on the item; item category is APPLIANCE|FIXTURE for decisions; no other ACTIVE|AT_RISK commitment on the unit"
    error_id: "ERR_VENDOR_TRADE_MISMATCH | ERR_DECISION_ALREADY_EXISTS | ERR_DECISION_NOT_APPLICABLE | ERR_COMMITMENT_EXISTS"
    http_status: 422
    applies_to: "assignment create, replacement-decision create, lease-commitment create"
  - priority: 8
    category: business_temporal
    check: "Vendor calendar half-open overlap; same-turn unit window shared-day overlap; paint→carpet cure buffer; committed_delivery_date >= projected_ready_date"
    error_id: "ERR_VENDOR_OVERLAP | ERR_UNIT_WINDOW_OVERLAP | ERR_CURE_BUFFER_VIOLATION | ERR_DELIVERY_BEFORE_PROJECTED"
    http_status: 422
    applies_to: "assignment create, lease-commitment create"
  - priority: 9
    category: business_constraint
    check: "Category sequence: no same-turn item with lower sequence_rank in {PLANNED, PENDING_APPROVAL, SCHEDULED}; finalize requires >= 1 PLANNED item; REPAIR decision must be economical under the property policy variant"
    error_id: "ERR_SEQUENCE_VIOLATION | ERR_NO_SCOPE_ITEMS | ERR_UNECONOMICAL_REPAIR"
    http_status: 422
    applies_to: "assignment create, finalize-scope, replacement-decision create"
  - priority: 10
    category: business_fiscal
    check: "Approval authority: PM may act on tier PM items only; RM-tier items require RegionalManager"
    error_id: ERR_APPROVAL_AUTHORITY_EXCEEDED
    http_status: 403
    applies_to: "POST /make-ready/scope-items/{id}/approve, reject"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform / clock ---
  - method: POST
    path: "/make-ready/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Startup default is exactly 2026-08-01T00:00:00Z; before any call the logical clock reads this default and never falls back to wall-clock time. Setting the clock re-triggers projected_ready_date recomputation and commitment risk evaluation on all non-terminal turns."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Recompute projected_ready_date for turns in {SCOPED, IN_PROGRESS, REWORK}; commitment risk flips re-evaluated"]

  # --- Property ---
  - method: POST
    path: "/make-ready/properties"
    description: "Create a property with its turn-policy configuration"
    roles: [RegionalManager]
    code: 201
    input: [name, days_to_ready_target, pm_threshold_bp, rm_threshold_bp, capital_threshold_cents, replacement_policy]
    output: Property
    side_effects: ["benchmark aggregates initialized to 0"]
  - method: GET
    path: "/make-ready/properties/{id}/turn-benchmark"
    description: "Computed read of the property benchmark aggregates over CLOSED turns"
    roles: [RegionalManager, PropertyManager]
    code: 200
    input: []
    output: "{ benchmark_turn_count: integer, avg_booked_expense_cents: integer, avg_days_to_ready: integer }"
    side_effects: []

  # --- Unit ---
  - method: POST
    path: "/make-ready/units"
    description: "Create a unit"
    roles: [PropertyManager]
    code: 201
    input: [property_id, unit_number, square_feet]
    output: Unit
    side_effects: ["status = OCCUPIED"]
  - method: GET
    path: "/make-ready/units/{id}"
    description: "Get a unit"
    roles: [RegionalManager, PropertyManager, TurnCoordinator, Inspector]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: GET
    path: "/make-ready/units"
    description: "List units, optionally filtered by property and/or status"
    roles: [RegionalManager, PropertyManager, TurnCoordinator, Inspector]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: "Unit[]"
    side_effects: []
  - method: POST
    path: "/make-ready/units/{id}/record-move-in"
    description: "Record resident move-in; resolves any ACTIVE|AT_RISK lease commitment to FULFILLED or BREACHED"
    roles: [TurnCoordinator]
    code: 200
    input: [move_in_date]
    output: Unit
    side_effects: ["Unit READY → OCCUPIED", "LeaseCommitment resolution per move_in_date vs committed_delivery_date"]

  # --- LeaseCommitment sub-resource reads under Unit ---
  - method: GET
    path: "/make-ready/units/{id}/lease-commitments"
    description: "List lease commitments for a unit"
    roles: [RegionalManager, PropertyManager, TurnCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "LeaseCommitment[]"
    side_effects: []

  # --- Turn ---
  - method: POST
    path: "/make-ready/turns"
    description: "Open a turn on an OCCUPIED unit (records the vacancy notice)"
    roles: [TurnCoordinator]
    code: 201
    input: [unit_id, notice_date, move_out_date]
    output: Turn
    side_effects: ["status = OPEN", "Unit OCCUPIED → NOTICE", "all cost rollups initialized to 0"]
  - method: GET
    path: "/make-ready/turns/{id}"
    description: "Get a turn (including all computed rollup fields and version)"
    roles: [RegionalManager, PropertyManager, TurnCoordinator, Inspector]
    code: 200
    input: []
    output: Turn
    side_effects: []
  - method: GET
    path: "/make-ready/turns"
    description: "List turns, optionally filtered by unit and/or status"
    roles: [RegionalManager, PropertyManager, TurnCoordinator, Inspector]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "Turn[]"
    side_effects: []
  - method: POST
    path: "/make-ready/turns/{id}/finalize-scope"
    description: "Finalize scope: locks approved budget, stamps started_on / target_ready_date, moves unit IN_TURN"
    roles: [TurnCoordinator]
    code: 200
    input: []
    output: Turn
    side_effects: ["Turn OPEN → SCOPED; see Turn state machine"]
  - method: POST
    path: "/make-ready/turns/{id}/close"
    description: "Administratively close a READY turn; the turn enters the property benchmark"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Turn
    side_effects: ["Turn READY → CLOSED", "property_benchmark recomputed"]
  - method: POST
    path: "/make-ready/turns/{id}/cancel"
    description: "Cancel an OPEN or SCOPED turn (notice rescinded); cascades to items, assignments, commitments, unit"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Turn
    side_effects: ["Turn → CANCELLED; full cascade per Turn state machine"]

  # --- Inspection (nested under Turn) ---
  - method: POST
    path: "/make-ready/turns/{id}/inspections"
    description: "Submit a quality inspection for an IN_PROGRESS turn; PASS → READY, FAIL → REWORK with rework items"
    roles: [Inspector]
    code: 201
    input: [result, "failed_scope_item_ids?", "notes?"]
    output: Inspection
    side_effects: ["Turn IN_PROGRESS → READY (PASS) or → REWORK (FAIL); FAIL cascade per Turn state machine"]
  - method: GET
    path: "/make-ready/turns/{id}/inspections"
    description: "List inspections submitted for a turn"
    roles: [RegionalManager, PropertyManager, TurnCoordinator, Inspector]
    code: 200
    input: []
    output: "Inspection[]"
    side_effects: []

  # --- ReplacementDecision (nested under Turn; reverse reads under Turn and ScopeItem) ---
  - method: POST
    path: "/make-ready/turns/{id}/replacement-decisions"
    description: "Record a repair-vs-replace decision for an APPLIANCE|FIXTURE scope item; applies the property policy and capital classification"
    roles: [TurnCoordinator]
    code: 201
    input: [scope_item_id, repair_estimate_cents, replace_estimate_cents, repair_life_years, remaining_life_years, decision]
    output: ReplacementDecision
    side_effects: ["item.estimated_cost_cents := chosen path estimate (repair_estimate_cents if REPAIR else replace_estimate_cents)", "item.classification := resulting_classification", "turn rollups and projected_ready_date recomputed"]
  - method: GET
    path: "/make-ready/turns/{id}/replacement-decisions"
    description: "List replacement decisions recorded on a turn"
    roles: [RegionalManager, PropertyManager, TurnCoordinator]
    code: 200
    input: []
    output: "ReplacementDecision[]"
    side_effects: []
  - method: GET
    path: "/make-ready/scope-items/{id}/replacement-decisions"
    description: "List replacement decisions recorded against a scope item (0 or 1 element)"
    roles: [RegionalManager, PropertyManager, TurnCoordinator]
    code: 200
    input: []
    output: "ReplacementDecision[]"
    side_effects: []

  # --- ScopeItem ---
  - method: POST
    path: "/make-ready/scope-items"
    description: "Add a scope item to a turn; post-finalization adds are tiered by scope_creep_tier (auto PLANNED or PENDING_APPROVAL)"
    roles: [TurnCoordinator]
    code: 201
    input: [turn_id, category, description, estimated_cost_cents]
    output: ScopeItem
    side_effects: ["status per scope_creep_tier (PLANNED or PENDING_APPROVAL)", "if PLANNED: recompute turn.estimated_cost_cents and projected_ready_date; commitment risk flips re-evaluated"]
  - method: GET
    path: "/make-ready/scope-items/{id}"
    description: "Get a scope item"
    roles: [RegionalManager, PropertyManager, TurnCoordinator, Inspector]
    code: 200
    input: []
    output: ScopeItem
    side_effects: []
  - method: GET
    path: "/make-ready/scope-items"
    description: "List scope items, optionally filtered by turn, rework origin, and/or status"
    roles: [RegionalManager, PropertyManager, TurnCoordinator, Inspector]
    code: 200
    input: ["turn_id?", "rework_of_item_id?", "status?", "limit?", "offset?"]
    output: "ScopeItem[]"
    side_effects: []
  - method: POST
    path: "/make-ready/scope-items/{id}/approve"
    description: "Approve a PENDING_APPROVAL scope item (OCC-guarded on the turn); raises the turn's approved budget by the item estimate"
    roles: [PropertyManager, RegionalManager]
    code: 200
    input: [expected_turn_version]
    output: ScopeItem
    side_effects: ["item PENDING_APPROVAL → PLANNED", "turn.approved_budget_cents += item.estimated_cost_cents", "increments Turn.version by 1", "turn rollups and projected_ready_date recomputed"]
  - method: POST
    path: "/make-ready/scope-items/{id}/reject"
    description: "Reject a PENDING_APPROVAL scope item"
    roles: [PropertyManager, RegionalManager]
    code: 200
    input: []
    output: ScopeItem
    side_effects: ["item PENDING_APPROVAL → REJECTED"]
  - method: POST
    path: "/make-ready/scope-items/{id}/void"
    description: "Void a PLANNED or SCHEDULED scope item; a SCHEDULED item's active assignment is cancelled"
    roles: [TurnCoordinator]
    code: 200
    input: []
    output: ScopeItem
    side_effects: ["item → VOIDED", "assignment cancellation cascade per ScopeItem state machine", "turn.estimated_cost_cents and projected_ready_date recomputed; commitment risk flips re-evaluated"]

  # --- Vendor ---
  - method: POST
    path: "/make-ready/vendors"
    description: "Register a vendor"
    roles: [PropertyManager]
    code: 201
    input: [name, trade]
    output: Vendor
    side_effects: ["open_assignment_count = 0"]

  # --- VendorAssignment ---
  - method: POST
    path: "/make-ready/vendor-assignments"
    description: "Schedule a vendor against a PLANNED scope item over [start_date, end_date)"
    roles: [TurnCoordinator]
    code: 201
    input: [scope_item_id, vendor_id, start_date, end_date]
    output: VendorAssignment
    side_effects: ["status = SCHEDULED", "ScopeItem PLANNED → SCHEDULED", "vendor.open_assignment_count += 1", "turn.projected_ready_date recomputed; commitment risk flips re-evaluated"]
  - method: GET
    path: "/make-ready/vendor-assignments/{id}"
    description: "Get a vendor assignment"
    roles: [RegionalManager, PropertyManager, TurnCoordinator, Inspector, Vendor]
    code: 200
    input: []
    output: VendorAssignment
    side_effects: []
  - method: GET
    path: "/make-ready/vendor-assignments"
    description: "List vendor assignments, optionally filtered by vendor, scope item, and/or status"
    roles: [RegionalManager, PropertyManager, TurnCoordinator, Inspector, Vendor]
    code: 200
    input: ["vendor_id?", "scope_item_id?", "status?", "limit?", "offset?"]
    output: "VendorAssignment[]"
    side_effects: []
  - method: POST
    path: "/make-ready/vendor-assignments/{id}/accept"
    description: "Assigned vendor accepts the assignment"
    roles: [Vendor]
    code: 200
    input: []
    output: VendorAssignment
    side_effects: ["status → ACCEPTED", "turn SCOPED|REWORK → IN_PROGRESS per Turn state machine", "turn.projected_ready_date recomputed"]
  - method: POST
    path: "/make-ready/vendor-assignments/{id}/decline"
    description: "Assigned vendor declines; the scope item returns to PLANNED"
    roles: [Vendor]
    code: 200
    input: []
    output: VendorAssignment
    side_effects: ["status → DECLINED", "vendor.open_assignment_count -= 1", "ScopeItem SCHEDULED → PLANNED", "turn.projected_ready_date recomputed"]
  - method: POST
    path: "/make-ready/vendor-assignments/{id}/complete"
    description: "Assigned vendor completes the work with the actual invoiced cost"
    roles: [Vendor]
    code: 200
    input: [actual_cost_cents]
    output: VendorAssignment
    side_effects: ["status → COMPLETED", "vendor.open_assignment_count -= 1", "ScopeItem → COMPLETED with actual_cost_cents", "turn actuals + booked_expense_cents recomputed"]

  # --- LeaseCommitment ---
  - method: POST
    path: "/make-ready/lease-commitments"
    description: "Pre-lease a unit during its turn; delivery date must cover the turn's projected ready date"
    roles: [TurnCoordinator]
    code: 201
    input: [unit_id, applicant_name, committed_delivery_date]
    output: LeaseCommitment
    side_effects: ["status = ACTIVE"]
  - method: POST
    path: "/make-ready/lease-commitments/{id}/cancel"
    description: "Cancel an ACTIVE or AT_RISK lease commitment"
    roles: [TurnCoordinator, PropertyManager]
    code: 200
    input: []
    output: LeaseCommitment
    side_effects: ["status → CANCELLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type/enum, unknown field, end_date <= start_date, move_out_date < notice_date, failed_scope_item_ids inconsistent with result" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign-key id does not exist" }
  - { id: ERR_VENDOR_NOT_ASSIGNED, http: 403, condition: "Vendor action attempted by an X-User-ID other than the assignment's vendor_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested operation" }
  - { id: ERR_UNIT_NOT_OCCUPIED, http: 409, condition: "Turn creation on a unit that is not OCCUPIED (NOTICE, IN_TURN, or READY)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_turn_version does not match the turn's current version on scope-item approve" }
  - { id: ERR_NO_SCOPE_ITEMS, http: 422, condition: "finalize-scope with zero PLANNED scope items" }
  - { id: ERR_VENDOR_TRADE_MISMATCH, http: 422, condition: "Vendor trade does not match the scope item's category mapping" }
  - { id: ERR_VENDOR_OVERLAP, http: 422, condition: "Half-open [start_date, end_date) collides with another SCHEDULED|ACCEPTED assignment of the same vendor; adjacency (end == start) is allowed" }
  - { id: ERR_UNIT_WINDOW_OVERLAP, http: 422, condition: "Assignment shares a calendar day with another SCHEDULED|ACCEPTED assignment on the same turn (one crew in the unit at a time)" }
  - { id: ERR_CURE_BUFFER_VIOLATION, http: 422, condition: "CARPET assignment start_date < (latest same-turn PAINT assignment end_date + 1 day) while that paint work is not yet complete-cured" }
  - { id: ERR_SEQUENCE_VIOLATION, http: 422, condition: "A same-turn item with lower sequence_rank is still in {PLANNED, PENDING_APPROVAL, SCHEDULED}" }
  - { id: ERR_UNECONOMICAL_REPAIR, http: 422, condition: "REPAIR decision rejected by the property's replacement_policy variant" }
  - { id: ERR_DECISION_NOT_APPLICABLE, http: 422, condition: "Replacement decision on a scope item whose category is not APPLIANCE or FIXTURE" }
  - { id: ERR_DECISION_ALREADY_EXISTS, http: 422, condition: "A replacement decision already exists for this scope item" }
  - { id: ERR_COMMITMENT_EXISTS, http: 422, condition: "Unit already has a LeaseCommitment in ACTIVE or AT_RISK" }
  - { id: ERR_DELIVERY_BEFORE_PROJECTED, http: 422, condition: "committed_delivery_date < the active turn's projected_ready_date" }
  - { id: ERR_APPROVAL_AUTHORITY_EXCEEDED, http: 403, condition: "PropertyManager acting on an RM-tier scope item" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegionalManager
    description: "Regional operator; owns property configuration and approves RM-tier scope creep"
    identity: opaque
    exclusive_operations:
      - "POST /make-ready/properties — create property"
      - "Approve/reject RM-tier scope items (only role allowed)"
    shared_operations:
      - "GET read endpoints (units, turns, scope items, vendor assignments, inspections, replacement decisions, benchmark)"
      - "POST /make-ready/scope-items/{id}/approve, reject — PM-tier items (shared with PropertyManager)"

  - name: PropertyManager
    description: "Property operator; manages units and vendors, approves PM-tier scope creep, closes/cancels turns"
    identity: opaque
    exclusive_operations:
      - "POST /make-ready/units — create unit"
      - "POST /make-ready/vendors — register vendor"
      - "POST /make-ready/turns/{id}/close — close turn"
      - "POST /make-ready/turns/{id}/cancel — cancel turn"
    shared_operations:
      - "GET read endpoints (units, turns, scope items, vendor assignments, inspections, replacement decisions, lease commitments, benchmark)"
      - "POST /make-ready/scope-items/{id}/approve, reject — PM-tier items (shared with RegionalManager)"
      - "POST /make-ready/lease-commitments/{id}/cancel (shared with TurnCoordinator)"

  - name: TurnCoordinator
    description: "Make-ready coordinator; runs turns, scope, scheduling, decisions, and pre-leasing"
    identity: opaque
    exclusive_operations:
      - "POST /make-ready/turns — open turn / record vacancy notice"
      - "POST /make-ready/turns/{id}/finalize-scope"
      - "POST /make-ready/scope-items — add scope item"
      - "POST /make-ready/scope-items/{id}/void"
      - "POST /make-ready/vendor-assignments — schedule vendor"
      - "POST /make-ready/turns/{id}/replacement-decisions"
      - "POST /make-ready/lease-commitments"
      - "POST /make-ready/units/{id}/record-move-in"
    shared_operations:
      - "GET read endpoints (units, turns, scope items, vendor assignments, inspections, replacement decisions, lease commitments)"
      - "POST /make-ready/lease-commitments/{id}/cancel (shared with PropertyManager)"

  - name: Vendor
    description: "External contractor; acts only on its own assignments"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /make-ready/vendor-assignments/{id}/accept — own assignments only"
      - "POST /make-ready/vendor-assignments/{id}/decline — own assignments only"
      - "POST /make-ready/vendor-assignments/{id}/complete — own assignments only"
    shared_operations:
      - "GET /make-ready/vendor-assignments and /{id}"

  - name: Inspector
    description: "Quality inspector; independent of the coordinator (segregation of duties on pass/fail)"
    identity: opaque
    exclusive_operations:
      - "POST /make-ready/turns/{id}/inspections — submit inspection result"
    shared_operations:
      - "GET read endpoints (units, turns, scope items, vendor assignments, inspections)"

  - name: PlatformAdmin
    description: "Platform operator; test-driving clock control only"
    identity: opaque
    exclusive_operations:
      - "POST /make-ready/_clock/set_current_utc"
    shared_operations: []
