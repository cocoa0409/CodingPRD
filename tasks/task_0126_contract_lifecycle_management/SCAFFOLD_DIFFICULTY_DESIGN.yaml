  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_deviation_required_on_send
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - state_machines.Contract.APPROVED_to_OUT_FOR_SIGNATURE
        distinguishing_aspect: |
          Pair (state @6) vs (business_safety @12): a DRAFT contract sent for signature with an
          uncovered above-threshold deviation violates BOTH the state precondition (not APPROVED)
          and the deviation gate; the lower-priority STATE error (ERR_INVALID_STATE) must win.
        test_recipe:
          setup:
            - "A DRAFT contract whose current version has a w=70 deviation (above org threshold 60), still DRAFT (never submitted)."
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "P1Org", risk_appetite_threshold: 60, auto_renew_lead_days: 30 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
