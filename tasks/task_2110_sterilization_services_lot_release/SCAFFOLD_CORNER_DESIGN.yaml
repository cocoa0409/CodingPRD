              payload: { release_mode: "PARAMETRIC" }
              as: QualityReleaseOfficer
              as_user_id: "qro-1"
              captures: { lot_v1: $.data.version }
            - call: "POST /sterilization/lots/${lot1_id}/adverse-events"
              payload: { event_type: "PACKAGING_BREACH", severity: "LOW", description: "Carton seal damaged", expected_lot_version: "${lot_v1}" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { ae1_id: $.data.id, lot_v2: $.data.lot_version_after }
          trigger:
            - call: "POST /sterilization/lots/${lot1_id}/adverse-events"
              payload: { event_type: "STERILITY_COMPLAINT", severity: "HIGH", description: "Second complaint on the same lot", expected_lot_version: "${lot_v1}" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "POST /sterilization/lots/${lot1_id}/adverse-events"
              payload: { event_type: "STERILITY_COMPLAINT", severity: "HIGH", description: "Second complaint on the same lot", expected_lot_version: "${lot_v2}" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { ae2_id: $.data.id, lot_v3: $.data.lot_version_after }
          assert:
            - "${err} == ERR_STALE_LOT_VERSION with HTTP 412"
            - "after the refused call GET /sterilization/lots/${lot1_id}/adverse-events returns total_count == 1"
            - "the retry returns HTTP 201 and ${lot_v3} == ${lot_v2} + 1"
            - "GET /sterilization/lots/${lot1_id}/adverse-events returns total_count == 2"
            - "Lot.${lot1_id}.status == RELEASED throughout"

      - name: corner_cascading_side_effects_end_to_end
        claim_type: cascade_ordering
        grounds:
          - state_machines.Cycle.DOSIMETRY_REVIEW_to_DOSE_DEVIATION
        excluded_because:
          difficulty_instance: dose_deviation_depth4_cascade_strips_sibling_lot_from_another_load_map
          rationale: "The four-hop chain and its ordering are asserted hop by hop there."

      - name: corner_dual_variant_calculation_layer
        claim_type: variant_divergence
        grounds:
          - calculations.delivered_dose_kgy
          - calculations.aeration_required_hours
        excluded_because:
          difficulty_instance: delivered_dose_routine_mean_vs_min_zone_flips_conformance
          rationale: "Both dual-variant calculations are exercised by the two instances of that rule."

      - name: corner_rate_threshold_trigger_permit_auto_suspend
        claim_type: threshold_boundary
        grounds:
          - state_machines.EmissionPermit.ACTIVE_to_SUSPENDED
          - state_machines.EmissionPermit.SUSPENDED_to_ACTIVE
        excluded_because:
          difficulty_instance: abort_restores_abated_eto_mass_ledger_and_reinstates_permit
          rationale: "The auto-suspend at the exact allowance and the auto-reinstate on credit are both asserted there."

  - section: consistency_model
