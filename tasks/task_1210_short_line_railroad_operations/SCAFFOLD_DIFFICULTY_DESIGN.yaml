              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_SIDING_AGREEMENT_INACTIVE"
            - "err != ERR_CUSTOMER_CREDIT_SUSPENDED (priority 5 safety check fires before priority 9 fiscal check)"

  - rule_id: boundary_precision_check
    instances:
      - name: hos_daily_limit_719_vs_720
        grounds:
          - calculations.hos_availability
          - validations[priority=5]
          - errors[ERR_HOS_DAILY_LIMIT]
        distinguishing_aspect: |
          Boundary on MINUTES via POST /rail/crew-calls: rolling_24h == 719 leaves daily_remaining == 1
          (callable, call created), while rolling_24h == 720 leaves daily_remaining == 0 (rejected) —
          the comparison is strict (> 0 required), so exactly 720 blocks.
        test_recipe:
          setup:
            - "member A adjusted to rolling 719; member B adjusted to rolling 720; a movement exists as call target"
          setup_api_calls:
            - call: "POST /rail/crew-members"
