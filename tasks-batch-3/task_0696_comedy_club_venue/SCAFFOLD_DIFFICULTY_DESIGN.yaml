  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ga_capacity_exact_vs_over_by_one
        grounds:
          - calculations.compute_section_availability
          - validations[priority=14]
          - errors[ERR_SECTION_SOLD_OUT]
          - state_machines.Show.ON_SALE_to_SOLD_OUT
        distinguishing_aspect: "GA headcount boundary on POST /reservations: party_size == ga_remaining (3 into remaining 3) succeeds and flips Show to SOLD_OUT; party_size == ga_remaining + 1 (4 into remaining 3) is rejected with ERR_SECTION_SOLD_OUT — the strict '>' boundary."
        test_recipe:
          setup:
            - "A GA show ON_SALE, ga_capacity=3, zero reservations yet (ga_remaining==3)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Boundary Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Boundary Night", starts_at: "2026-04-10T03:00:00Z", ends_at: "2026-04-10T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "GA", label: "Standing", ga_capacity: 3 }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "GA", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
          trigger:
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-g1", party_size: 3 }
              as: BoxOffice
              captures: { r1: $.data.id }
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-g2", party_size: 1 }
              as: BoxOffice
              captures: { err2: $.data.error_id }
          assert:
            - "first reservation succeeds (party_size 3 == ga_remaining 3); Show.${show_id}.status == SOLD_OUT"
            - "second reservation error_id == ERR_SECTION_SOLD_OUT (party_size 1 > ga_remaining 0)"

      - name: counter_rounds_at_limit_boundary
        grounds:
          - validations[priority=9]
          - errors[ERR_COUNTER_LIMIT_REACHED]
          - state_machines.LineupSlot.COUNTERED_to_OFFERED
          - entities.LineupSlot.fields.counter_rounds
        distinguishing_aspect: "Distinct metric (counter_rounds) and distinct endpoint (POST /lineup-slots/{id}/revise-offer): revise is allowed while counter_rounds < MAX_COUNTER_ROUNDS=3 and rejected with ERR_COUNTER_LIMIT_REACHED once counter_rounds == 3 — an empty-headroom boundary, distinct from the GA numeric-capacity edge."
        test_recipe:
          setup:
            - "A lineup slot driven through three counters (counter_rounds==3==MAX_COUNTER_ROUNDS), currently COUNTERED."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Counter Venue", settlement_currency: "USD" }
