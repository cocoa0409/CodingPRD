  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: capital_event_single_active_per_property
        grounds:
          - validations[priority=10]
          - errors[ERR_PROPERTY_HAS_ACTIVE_CAPITAL_EVENT]
          - entities.CapitalEvent.fields.status
        distinguishing_aspect: |
          Interval semantic: "single active occupation" — the resource is a
          Property, and the interval is the lifecycle of a CapitalEvent from
          ANNOUNCED through DISTRIBUTED/CANCELLED. A second CapitalEvent
          creation on the same Property is rejected while the first occupies
          the active slot. The boundary is "any active overlap" regardless of
          timestamps — the intervals are lifecycle states, not wall-clock.
        test_recipe:
          setup:
            - "Property P with one CapitalEvent in ANNOUNCED status"
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "OvSyn", sponsor_legal_entity: "Ov LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: $.data.id }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "Ov Prop", street_address: "5 O St", acquisition_price_cents: 100000000 }
              as: SponsorOperator
              captures: { prop_id: $.data.id }
            - call: "POST /syndications/${syn_id}/properties/${prop_id}/capital-events"
              payload: { event_kind: "REFINANCE", gross_proceeds_cents: 50000000, debt_payoff_cents: 10000000 }
              as: SponsorOperator
              captures: { ev1_id: $.data.id }
          trigger:
            - call: "POST /syndications/${syn_id}/properties/${prop_id}/capital-events"
              payload: { event_kind: "SALE", gross_proceeds_cents: 60000000, debt_payoff_cents: 20000000 }
              as: SponsorOperator
              captures: { err: $.data.error_id }
          assert:
            - "Second CapitalEvent creation rejected: error_id == ERR_PROPERTY_HAS_ACTIVE_CAPITAL_EVENT (HTTP 409)"

      - name: quarterly_report_slot_uniqueness_per_period
        grounds:
          - validations[priority=7d]
          - errors[ERR_DUPLICATE_QUARTERLY_REPORT]
          - entities.QuarterlyReport.fields.report_year
          - entities.QuarterlyReport.fields.report_quarter
        distinguishing_aspect: |
          Interval semantic: "discrete slot occupancy" — the resource is an
          Offering, and the interval is the discrete (year, quarter) slot.
          Only one PUBLISHED report per slot. Adjacent quarters do NOT collide
          (different semantics from capital-event lifecycle occupancy): the
          "interval" is a closed discrete period with no adjacency concept.
        test_recipe:
          setup:
            - "Offering OPEN; one PUBLISHED QuarterlyReport for (2026, Q1); a second DRAFT QuarterlyReport also for (2026, Q1)"
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "QsSyn", sponsor_legal_entity: "Qs LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: $.data.id }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "Qs Prop", street_address: "7 Q St", acquisition_price_cents: 100000000 }
              as: SponsorOperator
              captures: { prop_id: $.data.id }
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${prop_id}", offering_name: "Qs Off", target_raise_cents: 10000000, min_subscription_cents: 1000000, max_non_accredited_count: 35 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: SponsorOperator
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/quarterly-reports"
              payload: { report_year: 2026, report_quarter: 1, noi_cents: 5000000, occupancy_pct: 0.95 }
              as: SponsorOperator
              captures: { qr1_id: $.data.id }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/quarterly-reports/${qr1_id}/publish"
              payload: {}
              as: SponsorOperator
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/quarterly-reports"
              payload: { report_year: 2026, report_quarter: 1, noi_cents: 6000000, occupancy_pct: 0.96 }
              as: SponsorOperator
              captures: { qr2_id: $.data.id }
          trigger:
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/quarterly-reports/${qr2_id}/publish"
              payload: {}
              as: SponsorOperator
              captures: { err: $.data.error_id }
          assert:
            - "Second publish rejected: error_id == ERR_DUPLICATE_QUARTERLY_REPORT (HTTP 409)"
            - "QuarterlyReport.${qr2_id}.status remains DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: transfer_settle_conserves_total_funded
        grounds:
          - state_machines.TransferRequest.APPROVED_to_SETTLED
          - calculations.transfer_prorata_carryover
          - entities.Offering.fields.total_funded_cents
        distinguishing_aspect: |
          Conserved quantity: Offering.total_funded_cents (a cent-denominated
          ledger aggregate). The forward action is TransferRequest SETTLED;
          the invariant is that from_subscription.funded_cents decreases by
          exactly transfer_cents while to_subscription.funded_cents increases
          by exactly transfer_cents, leaving Offering.total_funded_cents
          unchanged end-to-end.
        test_recipe:
          setup:
            - "Offering with two FUNDED subscriptions: S (seller) funded_cents=5000000, B (buyer) funded_cents=3000000; Offering.total_funded_cents=8000000"
            - "TransferRequest in APPROVED status transferring 2000000 from S to B"
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "InvSyn", sponsor_legal_entity: "Inv LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: $.data.id }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "Inv Prop", street_address: "9 I St", acquisition_price_cents: 100000000 }
              as: SponsorOperator
              captures: { prop_id: $.data.id }
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${prop_id}", offering_name: "Inv Off", target_raise_cents: 100000000, min_subscription_cents: 1000000, max_non_accredited_count: 35 }
