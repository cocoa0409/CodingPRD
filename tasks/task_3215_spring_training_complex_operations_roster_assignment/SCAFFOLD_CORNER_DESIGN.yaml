  # ===========================================================================
  - section: errors
    instances:

      - name: stale_group_version_on_assignment_create_returns_precondition_failed
        claim_type: Violation -> Error
        grounds:
          - concurrency_rules[group-assignment-create-stale-group]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/camp-ops/workout-groups/{groupId}/assignments
        distinguishing_aspect: "An assignment create carrying the group version observed before a withdrawal returns 412 ERR_STALE_VERSION, and a retry carrying the freshly observed version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex and one published group; no assignments yet."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Stale Group", idp_number: "IDP-62601", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/complexes/${cx}/workout-groups"
              payload: { complex_id: "${cx}", roster_bucket: "MAJOR", group_name: "Pitchers Group A", facility_kind: "FIELD", capacity_units: 40 }
              as: ComplexDirector
              captures: { wg: $.data.id, wg_observed: $.data.version }
            - call: "POST /camp-ops/workout-groups/${wg}/disband"
              payload: {}
              as: ComplexDirector
            - call: "GET /camp-ops/workout-groups/${wg}"
              payload: {}
              as: ComplexDirector
              captures: { wg_fresh: $.data.version }
          trigger:
            - call: "POST /camp-ops/workout-groups/${wg}/assignments"
              payload: { workout_group_id: "${wg}", player_id: "${pl}", roster_bucket: "MAJOR", assignment_kind: "ACTIVE_WORKOUT", expected_group_version: "${wg_observed}" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the stale create returns status 412 with error_id ERR_STALE_VERSION"
            - "WorkoutGroup.${wg}.version == ${wg_observed} + 1"
            - "a retry carrying ${wg_fresh} is rejected with ERR_INVALID_STATE because the group is DISBANDED, showing the two guards are distinct"

      - name: stale_invitation_version_on_arrangement_confirm_returns_precondition_failed
        claim_type: Violation -> Error
        grounds:
          - concurrency_rules[travel-arrangement-confirm-stale-invitation]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/camp-ops/camp-invitations/{invitationId}/travel-arrangement
        distinguishing_aspect: "A confirm carrying the invitation version read before the letter was sent returns 412 ERR_STALE_VERSION, so a stale arrangement write is refused on the parent's version rather than on a wall-clock window."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex and one domestic pitcher with an invitation created and its version captured, then its letter sent."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
