          assert:
            - "err == ERR_NOTICE_NOT_APPEALABLE (state, priority 8, both conditions hold; the priority-8 state error beats the priority-15 temporal error)"
            - "HTTP status == 409"

      - name: exemption_program_beats_exemption_cap
        grounds:
          - validations[priority=14]
          - validations[priority=28]
          - errors[ERR_EXEMPTION_PROGRAM_UNAVAILABLE]
          - errors[ERR_EXEMPTION_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_fiscal (a
          different pair than the state/temporal instance): the jurisdiction
          does not offer FREEPORT (referential failure, priority 14) AND the
          requested 90% exceeds max_exemption_pct 40 (fiscal failure, priority
          28); ERR_EXEMPTION_PROGRAM_UNAVAILABLE must win.
        test_recipe:
          setup:
