  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_certificate_version_is_refused_when_filing_an_appeal
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[certificate_appeal_occ]"
          - "validations[priority=8]"
          - "errors[ERR_CERTIFICATE_VERSION_CONFLICT]"
          - "endpoints[POST /grain-inspection/appeals]"
        distinguishing_aspect: "The certificate's version moves twice behind the client's back through an appeal it filed itself and the dismissal that returned the certificate to ISSUED, so a second filing that echoes the original version is refused with 412 and takes no deposit, while the same body with the current version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DELEGATED area with an ACTIVE GRADING fee schedule, a certified probe, an inspector holding SAMPLING and GRADING, a graded CORN request and a GRADE certificate whose version is captured at issuance."
            - "An APPEAL is filed with that version and then dismissed, so the certificate is ISSUED again at a higher version."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
