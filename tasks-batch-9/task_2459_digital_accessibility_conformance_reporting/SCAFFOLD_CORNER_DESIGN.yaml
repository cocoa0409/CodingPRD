      - name: corner_intake_risk_score_rounds_half_up
        claim_type: precision
        grounds:
          - calculations.remediation_risk_score
          - entities.KnownIssue.fields.risk_score
        distinguishing_aspect: "A MINOR issue on a two-category criterion at user_reach_pct 8 has an exact base of 5 * 1.15 * 0.54 = 3.105, which must round HALF UP to 3.11 (banker's rounding would give 3.10)."
        test_recipe:
          setup:
