        distinguishing_aspect: |
          Depth-2 chain fired by the logical clock (a different trigger from the
          Director's APPROVE): clock advance flips EvidenceRequest PENDING ->
          OVERDUE (A); that transition recomputes the InvestigationCase's counts
          and priority_score (B); the recomputed score crossing
