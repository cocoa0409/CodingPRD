  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: window_book_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[window-book-stale-project]
        distinguishing_aspect: "OCC rule window-book-stale-project: after W1 bumps Project.version to 2, a second create still carrying the pre-W1 version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Project P (version 1); owner O (notice 24h); segment S; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-OCC1", contract_ref: "C-800", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 24, max_shutdown_hours: 12 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", segment_label: "WL-O-01", pipe_material: PVC_C900, diameter_in: 12, length_ft: 200.0, bedding_class: CLASS_B, design_invert_depth_ft: 8.0, design_slope_pct: 1.0, requires_dewatering: false }
              as: Foreman
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /site-utility/shutdown-windows"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", pipe_segment_id: "${s_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              captures: { w1_id: $.data.id }
            - call: "POST /site-utility/shutdown-windows"
