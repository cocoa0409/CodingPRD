              as: Advisor
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/state"
              payload: { action: "FREEZE" }
              as: Advisor
            - call: "GET /rebalance-orders/${ro_id}"
              payload: {}
              as: Advisor
              captures: { ro_status: $.data.status }
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Advisor
              captures: { tier_after: $.data.breakpoint_tier_index, agg_after: $.data.aggregated_aum_cents }
