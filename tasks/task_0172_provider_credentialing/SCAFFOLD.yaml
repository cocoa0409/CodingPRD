# =============================================================================
# Provider Credentialing & Enrollment — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Provider Credentialing & Enrollment: application/CAQH, primary source
  verification (license/DEA/board), payer enrollment, privileging/peer review,
  expirables tracking, re-credentialing cycle, OIG/SAM sanctions monitoring

domain_name: provider-credentialing
api_prefix: ""   # flat/hybrid topology: many top-level collections rooted at "/"

# -----------------------------------------------------------------------------
# complexity_profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - derived_field_reconciliation   # provider.credentialing_status derived from verifications + sanctions + expirables
    - rate_threshold_triggers        # expirables banding at exact day boundaries; recred window
    - optimistic_concurrency         # OCC on Provider.version for committee decision recording
    - scheduled_actions              # admin clock advances epoch; re-cred due dates, expirable lapse

  entity_topology: hybrid
  # Provider hub with owned satellites (CredentialItem, VerificationRequest,
  # PayerEnrollment, CredentialingFile) plus flat reference catalogs
  # (Payer, SanctionsSource) and a junction (PeerReviewVote).

  state_machine_shape: posture_driven
  # Provider.credentialing_status is a derived posture (PENDING / CLEARED /
  # CONDITIONAL / EXCLUDED) recomputed from child verification states,
  # sanctions hits, and expirable lapse; it gates payer enrollment and
  # privileging. Layered with a CYCLIC re-credentialing loop
  # (CLEARED -> RECRED_DUE -> IN_RECREDENTIALING -> CLEARED) and PARALLEL
  # verification dimensions per CredentialItem.

  relationship_patterns:
    - one_to_many        # Provider -> CredentialItem / VerificationRequest / PayerEnrollment
    - many_to_many       # CredentialingFile <-> PeerReviewer via PeerReviewVote junction
    - cross_aggregate    # PayerEnrollment.status gated by Provider.credentialing_status; VerificationRequest gated by SanctionsScreening

  role_model: segregation_of_duties
  # A CredentialingSpecialist who initiated a provider's file cannot cast a
  # peer-review vote on that same file; MedicalDirector chairs review.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CredentialingOrg
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Credentialing organization / CVO name" }
      - { name: current_utc, type: datetime, source: system, default: "2026-01-01T00:00:00.000Z", description: "Deterministic system clock; advanced only via POST /_clock/set_current_utc" }
      - { name: recred_cycle_days, type: integer, source: input, default: 1095, description: "Re-credentialing cycle length in days (default 3 years)" }
      - { name: expiring_soon_window_days, type: integer, source: input, default: 90, description: "Days-before-expiry at which a CredentialItem becomes EXPIRING_SOON" }

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> CredentialingOrg.id" }
      - { name: name, type: string, source: input, description: "Payer / health plan name" }
      - { name: payer_type, type: enum, source: input, description: "Allowed: COMMERCIAL, MEDICARE, MEDICAID" }
      - { name: retroactive_allowed, type: boolean, source: input, default: false, description: "If true, enrollment effective_date may be backdated to credentialing_completed_date (RETROACTIVE variant); else PROSPECTIVE" }
      - { name: panel_capacity, type: integer, source: input, description: "Maximum number of ACTIVE enrollments this payer panel admits; must be >= 1" }

  - name: SanctionsSource
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> CredentialingOrg.id" }
      - { name: source_code, type: enum, source: input, description: "Allowed: OIG_LEIE, SAM_EXCLUSIONS; unique per org" }
      - { name: severity_weight, type: integer, source: input, description: "Weight applied to a hit from this source when computing exclusion; positive integer" }

  - name: Provider
    parent: CredentialingOrg
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> CredentialingOrg.id" }
      - { name: npi, type: string, source: input, description: "10-digit National Provider Identifier; unique within org" }
      - { name: caqh_id, type: string, source: input, description: "CAQH ProView attestation id; required to submit application" }
      - { name: full_name, type: string, source: input, description: "Provider legal name" }
      - { name: specialty, type: string, source: input, description: "Primary specialty" }
      - { name: application_status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> IN_VERIFICATION -> READY_FOR_REVIEW; lifecycle of the intake application" }
      - { name: credentialing_status, type: enum, source: computed, default: PENDING, description: "Derived posture: PENDING / CLEARED / CONDITIONAL / EXCLUDED; recomputed by credentialing_posture calc" }
      - { name: recred_state, type: enum, source: system, default: NOT_CLEARED, description: "Re-credentialing loop state: NOT_CLEARED / CURRENT / RECRED_DUE / IN_RECREDENTIALING" }
      - { name: readiness_score, type: number, source: computed, default: 0, description: "credentialing_readiness_score output (0-100, 2 dp)" }
      - { name: credentialing_completed_date, type: datetime, source: computed, description: "UTC timestamp at which credentialing_status first became CLEARED in the current cycle; null until cleared" }
      - { name: recred_due_date, type: datetime, source: computed, description: "Next re-credentialing due date; null until first CLEARED" }
      - { name: initiated_by_user_id, type: string, source: system, description: "X-User-ID of the CredentialingSpecialist who submitted the application; pinned for segregation-of-duties checks" }
      - { name: sanction_score, type: integer, source: computed, default: 0, description: "Sum of severity_weight over open SanctionsScreening hits; drives EXCLUDED posture" }

  - name: CredentialItem
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: item_type, type: enum, source: input, description: "Allowed: STATE_LICENSE, DEA_REGISTRATION, BOARD_CERTIFICATION" }
      - { name: identifier, type: string, source: input, description: "License number / DEA number / board cert number" }
      - { name: issued_date, type: datetime, source: input, description: "Issue date (UTC)" }
      - { name: expiration_date, type: datetime, source: input, description: "Expiration date (UTC); must be strictly after issued_date" }
      - { name: verification_state, type: enum, source: system, default: UNVERIFIED, description: "UNVERIFIED -> PENDING_PSV -> VERIFIED / REJECTED (primary-source verification dimension)" }
      - { name: expirable_band, type: enum, source: computed, default: VALID, description: "VALID / EXPIRING_SOON / LAPSED; computed by expirable_band calc from current_utc vs expiration_date" }

  - name: VerificationRequest
    parent: CredentialItem
    common_fields: true
    fields:
      - { name: credential_item_id, type: string, source: system, description: "FK -> CredentialItem.id" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: method, type: enum, source: input, description: "Allowed: PRIMARY_SOURCE, DESIGNATED_AGENT" }
      - { name: source_reference, type: string, source: input, description: "URL or registry reference used for the verification" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> COMPLETED_PASS / COMPLETED_FAIL" }
      - { name: verified_at, type: datetime, source: system, description: "UTC timestamp the request was completed; null while OPEN" }

  - name: SanctionsScreening
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: sanctions_source_id, type: string, source: input, description: "FK -> SanctionsSource.id" }
      - { name: screened_at, type: datetime, source: system, description: "current_utc captured when the screening was recorded" }
      - { name: result, type: enum, source: input, description: "Allowed: CLEAR, HIT" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> RESOLVED; a HIT stays OPEN until resolved, contributing to sanction_score" }
      - { name: resolution_note, type: string, source: input, required: false, description: "Required when resolving a HIT" }

  - name: CredentialingFile
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: review_status, type: enum, source: system, default: ASSEMBLING, description: "ASSEMBLING -> UNDER_REVIEW -> APPROVED / DENIED / CONDITIONAL; peer-review packet lifecycle" }
      - { name: opened_at, type: datetime, source: system, description: "current_utc captured when file opened for review" }
      - { name: chair_user_id, type: string, source: system, description: "X-User-ID of the MedicalDirector who opened review; chair tie-break authority" }
      - { name: tally_yes, type: integer, source: computed, default: 0, description: "Weighted YES tally from peer_review_tally calc" }
      - { name: tally_no, type: integer, source: computed, default: 0, description: "Weighted NO tally from peer_review_tally calc" }
      - { name: decision_reason, type: string, source: input, required: false, description: "Reason recorded on finalize" }

  - name: PeerReviewer
    parent: CredentialingOrg
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> CredentialingOrg.id" }
      - { name: user_id, type: string, source: input, description: "X-User-ID this reviewer acts under (MedicalDirector or PeerReviewer role)" }
      - { name: full_name, type: string, source: input, description: "Reviewer name" }
      - { name: vote_weight, type: integer, source: input, default: 1, description: "Weight of this reviewer's vote in the tally; positive integer" }

  - name: PeerReviewVote
    parent: CredentialingFile
    common_fields: true
    fields:
      - { name: credentialing_file_id, type: string, source: system, description: "FK -> CredentialingFile.id" }
      - { name: reviewer_id, type: string, source: input, description: "FK -> PeerReviewer.id" }
      - { name: voter_user_id, type: string, source: system, description: "X-User-ID of the casting reviewer; pinned for segregation-of-duties" }
      - { name: ballot, type: enum, source: input, description: "Allowed: YES, NO, ABSTAIN" }
      - { name: comment, type: string, source: input, required: false, description: "Optional vote comment" }

  - name: PayerEnrollment
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: requested_at, type: datetime, source: system, description: "current_utc when enrollment requested" }
      - { name: effective_date, type: datetime, source: computed, description: "Coverage effective date; RETROACTIVE or PROSPECTIVE variant per enrollment_effective_date calc; null until APPROVED" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> SUBMITTED -> ACTIVE / REJECTED / TERMINATED" }
      - { name: termination_reason, type: string, source: input, required: false, description: "Required on terminate" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Provider intake application (linear, drives verification fan-out) ----
  - entity: Provider
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /providers/{id}/submit-application"
        actor: CredentialingSpecialist
        preconditions:
          - "application_status == DRAFT (ERR_APPLICATION_NOT_DRAFT)"
          - "caqh_id is present and non-empty (ERR_CAQH_REQUIRED)"
          - "at least one CredentialItem of item_type==STATE_LICENSE exists (ERR_NO_LICENSE_ON_FILE)"
        side_effects:
          - "application_status = SUBMITTED"
          - "initiated_by_user_id set from X-User-ID (segregation-of-duties anchor)"

      - from: SUBMITTED
        to: IN_VERIFICATION
        trigger: "POST /providers/{id}/begin-verification"
        actor: CredentialingSpecialist
        preconditions:
          - "application_status == SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
        side_effects:
          - "application_status = IN_VERIFICATION"
          - "every UNVERIFIED CredentialItem -> PENDING_PSV (cascade down)"

      - from: IN_VERIFICATION
        to: READY_FOR_REVIEW
        trigger: "POST /providers/{id}/finalize-verification"
        actor: CredentialingSpecialist
        preconditions:
          - "application_status == IN_VERIFICATION (ERR_APPLICATION_NOT_IN_VERIFICATION)"
          - "no CredentialItem remains in PENDING_PSV (ERR_VERIFICATIONS_INCOMPLETE)"
        side_effects:
          - "application_status = READY_FOR_REVIEW"
          - "recompute credentialing_posture (bubble up): sets credentialing_status & readiness_score"

  # ---- Provider re-credentialing loop (CYCLIC; non-linear) ----
  - entity: Provider
    initial_state: NOT_CLEARED
    terminal_states: []
    transitions:
      - from: NOT_CLEARED
        to: CURRENT
        trigger: "system (CredentialingFile APPROVED while credentialing_status==CLEARED)"
        actor: system
        preconditions:
          - "credentialing_status == CLEARED at file approval"
        side_effects:
          - "credentialing_completed_date = current_utc"
          - "recred_due_date = recredentialing_due_date calc output"

      - from: CURRENT
        to: RECRED_DUE
        trigger: "system (POST /_clock/set_current_utc advances current_utc >= recred_due_date)"
        actor: system
        preconditions:
          - "recred_state == CURRENT and current_utc >= recred_due_date"
        side_effects:
          - "recred_state = RECRED_DUE"
          - "credentialing_status recomputed -> CONDITIONAL (recred lapse demotes posture)"

      - from: RECRED_DUE
        to: IN_RECREDENTIALING
        trigger: "POST /providers/{id}/start-recredentialing"
        actor: CredentialingSpecialist
        preconditions:
          - "recred_state == RECRED_DUE (ERR_RECRED_NOT_DUE)"
        side_effects:
          - "recred_state = IN_RECREDENTIALING"
          - "application_status = IN_VERIFICATION; every VERIFIED CredentialItem whose expirable_band != VALID -> PENDING_PSV (conditional cascade)"

      - from: IN_RECREDENTIALING
        to: CURRENT
        trigger: "system (CredentialingFile APPROVED while recred_state==IN_RECREDENTIALING)"
        actor: system
        preconditions:
          - "credentialing_status == CLEARED at file approval"
        side_effects:
          - "credentialing_completed_date = current_utc"
          - "recred_due_date = recredentialing_due_date calc output (cycle restarts; cyclic loop closes)"

  # ---- CredentialItem primary-source verification (branching with revert) ----
  - entity: CredentialItem
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING_PSV
        trigger: "system (provider begin-verification cascade)"
        actor: system
        preconditions:
          - "parent Provider.application_status transitions SUBMITTED->IN_VERIFICATION"
        side_effects: []

      - from: PENDING_PSV
        to: VERIFIED
        trigger: "POST /verification-requests/{id}/complete with outcome=PASS"
        actor: CredentialingSpecialist
        preconditions:
          - "owning VerificationRequest.status == OPEN (ERR_VERIFICATION_NOT_OPEN)"
          - "CredentialItem.expirable_band != LAPSED (ERR_CREDENTIAL_LAPSED)"
        side_effects:
          - "VerificationRequest.status = COMPLETED_PASS; verified_at = current_utc"
          - "CredentialItem.verification_state = VERIFIED"

      - from: PENDING_PSV
        to: REJECTED
        trigger: "POST /verification-requests/{id}/complete with outcome=FAIL"
        actor: CredentialingSpecialist
        preconditions:
          - "owning VerificationRequest.status == OPEN (ERR_VERIFICATION_NOT_OPEN)"
        side_effects:
          - "VerificationRequest.status = COMPLETED_FAIL; verified_at = current_utc"
          - "CredentialItem.verification_state = REJECTED"

      - from: REJECTED
        to: PENDING_PSV
        trigger: "POST /credential-items/{id}/reverify"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialItem.verification_state == REJECTED (ERR_ITEM_NOT_REJECTED)"
        side_effects:
          - "CredentialItem.verification_state = PENDING_PSV"
          - "a fresh VerificationRequest is created in OPEN status (revert loop)"

  # ---- SanctionsScreening (linear with resolution) ----
  - entity: SanctionsScreening
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /sanctions-screenings/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "SanctionsScreening.status == OPEN (ERR_SCREENING_NOT_OPEN)"
          - "resolution_note is present and non-empty (ERR_RESOLUTION_NOTE_REQUIRED)"
        side_effects:
          - "status = RESOLVED"
          - "Provider.sanction_score recomputed (cross-entity); if it drops to 0 and no LAPSED items, credentialing_status leaves EXCLUDED"

  # ---- CredentialingFile peer review (branching fork-join; non-linear) ----
  - entity: CredentialingFile
    initial_state: ASSEMBLING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: ASSEMBLING
        to: UNDER_REVIEW
        trigger: "POST /credentialing-files/{id}/open-review"
        actor: MedicalDirector
        preconditions:
          - "review_status == ASSEMBLING (ERR_FILE_NOT_ASSEMBLING)"
          - "parent Provider.application_status == READY_FOR_REVIEW (ERR_PROVIDER_NOT_READY)"
          - "Provider.credentialing_status != EXCLUDED (ERR_PROVIDER_EXCLUDED)"
        side_effects:
          - "review_status = UNDER_REVIEW; opened_at = current_utc; chair_user_id = X-User-ID"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /credentialing-files/{id}/finalize with decision=APPROVE"
        actor: MedicalDirector
        preconditions:
          - "review_status == UNDER_REVIEW (ERR_FILE_NOT_UNDER_REVIEW)"
          - "at least 3 PeerReviewVote rows with ballot in {YES,NO} exist (ERR_QUORUM_NOT_MET)"
          - "peer_review_tally resolves to YES outcome (ERR_REVIEW_OUTCOME_MISMATCH)"
          - "expected_credentialing_file_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "review_status = APPROVED"
          - "Provider.credentialing_status = CLEARED (cross-entity bubble up)"
          - "Provider.recred_state -> CURRENT; credentialing_completed_date = current_utc; recred_due_date computed"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /credentialing-files/{id}/finalize with decision=DENY"
        actor: MedicalDirector
        preconditions:
          - "review_status == UNDER_REVIEW (ERR_FILE_NOT_UNDER_REVIEW)"
          - "at least 3 PeerReviewVote rows with ballot in {YES,NO} exist (ERR_QUORUM_NOT_MET)"
          - "peer_review_tally resolves to NO outcome (ERR_REVIEW_OUTCOME_MISMATCH)"
          - "expected_credentialing_file_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "review_status = DENIED"
          - "Provider.credentialing_status = CONDITIONAL (cross-entity); all REQUESTED/SUBMITTED PayerEnrollment -> REJECTED (cascade)"

  # ---- PayerEnrollment (linear with cross-aggregate gate + termination) ----
  - entity: PayerEnrollment
    initial_state: REQUESTED
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: REQUESTED
        to: SUBMITTED
        trigger: "POST /payer-enrollments/{id}/submit"
        actor: EnrollmentCoordinator
        preconditions:
          - "PayerEnrollment.status == REQUESTED (ERR_ENROLLMENT_NOT_REQUESTED)"
          - "Provider.credentialing_status == CLEARED (ERR_PROVIDER_NOT_CLEARED)"
        side_effects:
          - "status = SUBMITTED"

      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /payer-enrollments/{id}/activate"
        actor: EnrollmentCoordinator
        preconditions:
          - "PayerEnrollment.status == SUBMITTED (ERR_ENROLLMENT_NOT_SUBMITTED)"
          - "Provider.credentialing_status == CLEARED (ERR_PROVIDER_NOT_CLEARED)"
          - "count of ACTIVE PayerEnrollment on the target Payer < Payer.panel_capacity (ERR_PANEL_AT_CAPACITY)"
        side_effects:
          - "effective_date = enrollment_effective_date calc output (RETROACTIVE or PROSPECTIVE variant)"
          - "status = ACTIVE"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /payer-enrollments/{id}/terminate"
        actor: EnrollmentCoordinator
        preconditions:
          - "PayerEnrollment.status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "termination_reason present and non-empty (ERR_TERMINATION_REASON_REQUIRED)"
        side_effects:
          - "status = TERMINATED (frees one panel slot on the Payer)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "system (Provider.credentialing_status leaves CLEARED -> CONDITIONAL/EXCLUDED)"
        actor: system
        preconditions:
          - "owning Provider.credentialing_status transitions away from CLEARED"
        side_effects:
          - "status = TERMINATED; termination_reason = 'CREDENTIALING_LAPSED' (auto); frees one panel slot on the Payer"
        note: |
          Tail link of the depth-3 cascade: a clock advance lapses a CredentialItem,
          the posture recompute demotes the Provider out of CLEARED, and that demotion
          terminates the provider's ACTIVE enrollments.

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: file-finalize-stale-version
    parent_entity: CredentialingFile
    write_endpoint: "POST /credentialing-files/{id}/finalize"
    occ_field: "expected_credentialing_file_version"
    description: |
      Finalizing a CredentialingFile against a version older than the file's
      current version is rejected. A peer-review vote cast after the chair last
      observed the file legitimately bumps CredentialingFile.version (the vote
      recompute writes tally_yes/tally_no), so the chair's finalize carrying the
      stale version is rejected on the stale-version check rather than acting on
      an out-of-date tally.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- (threshold; boundary precision) ----
  - name: expirable_band
    trigger: "CredentialItem create; POST /_clock/set_current_utc; provider posture recompute"
    algorithm: threshold
    formula: |
      days_remaining = floor((expiration_date - org.current_utc) / 86_400_000)   # whole UTC days, truncated toward -inf
      if days_remaining < 0:                              -> LAPSED
      elif days_remaining <= org.expiring_soon_window_days -> EXPIRING_SOON
      else                                                 -> VALID
      Boundary is inclusive on EXPIRING_SOON: days_remaining == window (default 90) is EXPIRING_SOON;
      days_remaining == window + 1 is VALID; days_remaining == 0 is EXPIRING_SOON; days_remaining == -1 is LAPSED.
    input_set: "single CredentialItem vs org.current_utc"
    constants:
      MS_PER_DAY: 86400000
    precision: "integer days, floor"

  # ---- (derived posture; weighted_scoring, combinatorial mode (a): >=3 inputs, nested min/max + conditional branches) ----
  - name: credentialing_readiness_score
    trigger: "POST /providers/{id}/finalize-verification; any verification complete; sanctions resolve; clock advance"
    algorithm: weighted_scoring
    formula: |
      Let V = count of CredentialItem with verification_state==VERIFIED and expirable_band==VALID
      Let T = total count of CredentialItem (>= 1 by submit precondition)
      Let psv_ratio = V / T                      # 0..1
      Let sanction_penalty = min(40, Provider.sanction_score * 5)
      Let recred_penalty = 15 if recred_state==RECRED_DUE else 0
      base = round(100 * psv_ratio, 2)
      readiness_score = max(0, round(base - sanction_penalty - recred_penalty, 2))
      Evaluation order is pinned: compute base (round first), THEN subtract integer penalties, THEN clamp at 0.
    input_set: "all CredentialItem of the provider; provider.sanction_score; provider.recred_state"
    constants:
      SANCTION_UNIT_PENALTY: 5
      SANCTION_PENALTY_CAP: 40
      RECRED_DUE_PENALTY: 15
    precision: "2 decimal places, round_half_up"

  # ---- (derived posture) ----
  - name: credentialing_posture
    trigger: "finalize-verification; verification complete; sanctions screen/resolve; clock advance; file finalize"
    algorithm: aggregation
    formula: |
      Evaluate in this fixed order (first match wins):
      1. if Provider.sanction_score > 0                              -> EXCLUDED
      2. elif any CredentialItem.verification_state == REJECTED        -> CONDITIONAL
      3. elif any CredentialItem.expirable_band == LAPSED             -> CONDITIONAL
      4. elif recred_state == RECRED_DUE                              -> CONDITIONAL
      5. elif CredentialingFile.review_status == APPROVED
              AND all CredentialItem.verification_state == VERIFIED   -> CLEARED
      6. else                                                        -> PENDING
      sanction_score = sum of SanctionsSource.severity_weight over OPEN HIT screenings (RESOLVED excluded)
    input_set: "all CredentialItem, all OPEN SanctionsScreening (result==HIT), recred_state, latest CredentialingFile"
    constants: {}
    precision: "n/a (enum result)"

  # ---- DUAL-VARIANT #1 on Provider domain: anniversary vs rolling cycle ----
  - name: recredentialing_due_date
    trigger: "Provider recred_state -> CURRENT (file approval)"
    algorithm: projection
    formula: |
      base = credentialing_completed_date (the current_utc captured at this clearing)
      recred_due_date = base + org.recred_cycle_days days (added as whole UTC days, 86_400_000 ms each)
    input_set: "credentialing_completed_date, org.recred_cycle_days"
    constants:
      MS_PER_DAY: 86400000
    variants:
      - name: ROLLING_FROM_COMPLETION
        when: "default; first clearing OR org.recred_cycle_days unchanged since last cycle"
        difference: "base = credentialing_completed_date of THIS clearing (rolling)"
      - name: ANNIVERSARY_FROM_FIRST_CLEARING
        when: "re-credentialing cycles after the first (recred_state was IN_RECREDENTIALING at this clearing)"
        difference: |
          base = the ORIGINAL first credentialing_completed_date, NOT the latest one; due date is the next
          multiple of recred_cycle_days after current_utc measured from the original anchor (fixed-anniversary).
          Same inputs, two valid bases -> different recred_due_date.

  # ---- DUAL-VARIANT #2 on PayerEnrollment domain: retroactive vs prospective ----
  - name: enrollment_effective_date
    trigger: "POST /payer-enrollments/{id}/activate"
    algorithm: projection
    formula: |
      if Payer.retroactive_allowed == true:   effective_date = Provider.credentialing_completed_date   # RETROACTIVE
      else:                                    effective_date = org.current_utc                          # PROSPECTIVE
      The two branches read different anchor timestamps for identical enrollment inputs, yielding different
      coverage-eligible windows.
    input_set: "Payer.retroactive_allowed, Provider.credentialing_completed_date, org.current_utc"
    constants: {}
    variants:
      - name: RETROACTIVE
        when: "Payer.retroactive_allowed == true"
        difference: "effective_date backdated to credentialing_completed_date"
      - name: PROSPECTIVE
        when: "Payer.retroactive_allowed == false"
        difference: "effective_date = current_utc at activation"

  # ---- COMBINATORIAL mode (c): circular-looking eval order (chair tie-break depends on tally that includes chair) ----
  - name: peer_review_tally
    trigger: "POST /credentialing-files/{id}/cast-vote; POST /credentialing-files/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      Evaluation order is pinned to break the apparent circularity:
      STEP 1 base_yes  = sum of PeerReviewer.vote_weight over votes with ballot==YES whose voter_user_id != file.chair_user_id
             base_no   = sum of PeerReviewer.vote_weight over votes with ballot==NO  whose voter_user_id != file.chair_user_id
             (ABSTAIN contributes 0; chair's own ballot excluded from base)
      STEP 2 chair_ballot = the chair's ballot if the chair voted, else null
             chair_weight = PeerReviewer.vote_weight of the chair
             Apply chair ONLY now: if base_yes == base_no (tie on non-chair votes) the chair's weight counts DOUBLE
             (chair_weight*2) on the chair's side; otherwise the chair counts at chair_weight*1.
      STEP 3 tally_yes = base_yes + (chair contribution to YES); tally_no = base_no + (chair contribution to NO)
             outcome = YES if tally_yes > tally_no, NO if tally_no > tally_yes, NO if tied (deny on deadlock).
      The chair's effective weight depends on the tally, and the tally depends on the chair — STEP order makes it well-defined.
    input_set: "all PeerReviewVote on the file (ballot in YES/NO/ABSTAIN), each weighted by its PeerReviewer.vote_weight"
    constants:
      CHAIR_TIE_MULTIPLIER: 2
    precision: "integer weights"

  - name: sanction_score
    trigger: "POST /providers/{id}/sanctions-screenings; POST /sanctions-screenings/{id}/resolve"
    algorithm: aggregation
    formula: |
      sanction_score = sum of SanctionsSource.severity_weight for every SanctionsScreening
                       with result==HIT and status==OPEN (RESOLVED HITs and CLEAR results excluded)
    input_set: "OPEN HIT SanctionsScreening rows joined to their SanctionsSource"
    constants: {}
    precision: "integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Body foreign keys (payer_id, reviewer_id, sanctions_source_id) reference existing in-org resources"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /payer-enrollments, POST /credentialing-files/{id}/cast-vote, POST /providers/{id}/sanctions-screenings"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; npi exactly 10 digits; enum members valid; expiration_date strictly after issued_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/mutation endpoints"

  - priority: 5.5
    category: business_temporal
    check: |
      CredentialItem interval overlap: a provider may not hold two CredentialItems of the
      SAME item_type whose validity intervals [issued_date, expiration_date] overlap.
      Interval semantics are CLOSED-CLOSED with adjacency allowed: two items where one's
      expiration_date == the other's issued_date (touching at a single instant) do NOT overlap;
      any interior overlap (a.issued_date < b.expiration_date AND b.issued_date < a.expiration_date,
      strict) is rejected.
    error_id: ERR_CREDENTIAL_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /providers/{id}/credential-items"

  - priority: 6
    category: state
    check: "Concurrency: when expected_credentialing_file_version is supplied it must equal current CredentialingFile.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /credentialing-files/{id}/finalize"
    note: "OCC version check runs before downstream business checks on this endpoint"

  - priority: 7
    category: state
    check: "Target resource is in the required state for the requested transition (application_status / verification_state / review_status / enrollment status / screening status)"
    error_id: "ERR_*_NOT_* (transition-specific; see §1.2 preconditions)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: business_referential
    check: "A cast vote's reviewer belongs to the same org as the file's provider"
    error_id: ERR_REVIEWER_ORG_MISMATCH
    http_status: 409
    applies_to: "POST /credentialing-files/{id}/cast-vote"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: the acting user casting a peer-review vote must NOT be the provider's initiated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /credentialing-files/{id}/cast-vote"

  - priority: 10
    category: business_safety
    check: "A reviewer may cast at most one vote per CredentialingFile"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /credentialing-files/{id}/cast-vote"

  - priority: 11
    category: business_safety
    check: "Provider with sanction_score > 0 (open OIG/SAM HIT) cannot open peer review or have credentialing CLEARED"
    error_id: ERR_PROVIDER_EXCLUDED
    http_status: 403
    applies_to: "POST /credentialing-files/{id}/open-review"

  - priority: 12
    category: business_constraint
    check: "Cannot complete a verification for a CredentialItem whose expirable_band == LAPSED"
    error_id: ERR_CREDENTIAL_LAPSED
    http_status: 409
    applies_to: "POST /verification-requests/{id}/complete (outcome=PASS)"

  - priority: 13
    category: business_constraint
    check: "Quorum: a file may be finalized only when >= 3 non-ABSTAIN PeerReviewVote rows exist"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /credentialing-files/{id}/finalize"

  - priority: 14
    category: business_constraint
    check: "finalize decision must match peer_review_tally outcome (APPROVE requires YES outcome; DENY requires NO outcome)"
    error_id: ERR_REVIEW_OUTCOME_MISMATCH
    http_status: 409
    applies_to: "POST /credentialing-files/{id}/finalize"

  - priority: 14.5
    category: business_temporal
    check: |
      PayerEnrollment coverage overlap: a provider may not hold two enrollments with the SAME
      payer whose coverage windows overlap. Coverage semantics here are ONGOING-SINGLETON (open-ended):
      a non-terminal enrollment (status in {REQUESTED, SUBMITTED, ACTIVE}) occupies an unbounded window
      [requested_at, +inf), so ANY second non-terminal enrollment with the same payer overlaps it and is
      rejected — regardless of date arithmetic (contrast the closed-closed adjacency-allowed semantics of
      ERR_CREDENTIAL_INTERVAL_OVERLAP). Terminal enrollments (REJECTED, TERMINATED) free the window.
    error_id: ERR_DUPLICATE_PAYER_ENROLLMENT
    http_status: 409
    applies_to: "POST /providers/{id}/payer-enrollments"

  - priority: 15
    category: business_referential
    check: "Enrollment submit/activate requires Provider.credentialing_status == CLEARED"
    error_id: ERR_PROVIDER_NOT_CLEARED
    http_status: 409
    applies_to: "POST /payer-enrollments/{id}/submit, POST /payer-enrollments/{id}/activate"

  - priority: 16
    category: business_fiscal
    check: "Activating an enrollment must not push the Payer's ACTIVE enrollment count above panel_capacity"
    error_id: ERR_PANEL_AT_CAPACITY
    http_status: 409
    applies_to: "POST /payer-enrollments/{id}/activate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Org + clock ----
  - method: POST
    path: "/credentialing-orgs"
    description: "Create a credentialing organization"
    roles: [SystemAdmin]
    code: 201
    input: [name, "recred_cycle_days?", "expiring_soon_window_days?"]
    output: CredentialingOrg
    side_effects: ["current_utc initialized to 2026-01-01T00:00:00.000Z"]

  - method: GET
    path: "/credentialing-orgs/{id}"
    description: "Get an org (includes current_utc)"
    roles: [SystemAdmin, CredentialingSpecialist, MedicalDirector, EnrollmentCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: CredentialingOrg
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the deterministic system clock; recomputes expirable_band, recred demotion, posture"
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: CredentialingOrg
    side_effects:
      - "org.current_utc = to_iso8601"
      - "recompute expirable_band for every CredentialItem (a CredentialItem may become LAPSED)"
      - "recompute credentialing_posture & readiness_score for affected providers (a LAPSED item demotes a CLEARED provider to CONDITIONAL)"
      - "any Provider with recred_state==CURRENT and current_utc >= recred_due_date -> RECRED_DUE; posture recomputed -> CONDITIONAL"
      - "any Provider whose credentialing_status leaves CLEARED -> its ACTIVE PayerEnrollment rows auto-TERMINATED (depth-3 cascade tail)"

  # ---- Payers ----
  - method: POST
    path: "/payers"
    description: "Create a payer / health plan"
    roles: [SystemAdmin, EnrollmentCoordinator]
    code: 201
    input: [org_id, name, payer_type, "retroactive_allowed?", panel_capacity]
    output: Payer
    side_effects: []

  - method: GET
    path: "/payers"
    description: "List payers (filter by org_id; reverse-reachability for Payer.org_id FK)"
    roles: [SystemAdmin, EnrollmentCoordinator, CredentialingSpecialist]
    code: 200
    input: ["org_id?", "limit?", "offset?"]
    output: "Payer[]"
    side_effects: []

  - method: GET
    path: "/payers/{id}"
    description: "Get a single payer"
    roles: [SystemAdmin, EnrollmentCoordinator, CredentialingSpecialist]
    code: 200
    input: []
    output: Payer
    side_effects: []

  # ---- Sanctions sources ----
  - method: POST
    path: "/sanctions-sources"
    description: "Register an OIG/SAM sanctions source"
    roles: [SystemAdmin, ComplianceOfficer]
    code: 201
    input: [org_id, source_code, severity_weight]
    output: SanctionsSource
    side_effects: []

  - method: GET
    path: "/sanctions-sources"
    description: "List sanctions sources (filter by org_id; reverse-reachability for SanctionsSource.org_id FK)"
    roles: [SystemAdmin, ComplianceOfficer]
    code: 200
    input: ["org_id?", "limit?", "offset?"]
    output: "SanctionsSource[]"
    side_effects: []

  - method: GET
    path: "/sanctions-sources/{id}"
    description: "Get a single sanctions source"
    roles: [SystemAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: SanctionsSource
    side_effects: []

  # ---- Providers ----
  - method: POST
    path: "/providers"
    description: "Create a provider intake record (DRAFT)"
    roles: [CredentialingSpecialist]
    code: 201
    input: [org_id, npi, full_name, specialty, "caqh_id?"]
    output: Provider
    side_effects: ["application_status=DRAFT; credentialing_status=PENDING; recred_state=NOT_CLEARED"]

  - method: GET
    path: "/providers/{id}"
    description: "Get a provider (includes derived credentialing_status, readiness_score, recred_due_date)"
    roles: [CredentialingSpecialist, MedicalDirector, EnrollmentCoordinator, ComplianceOfficer, SystemAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/providers"
    description: "List providers (filter by org_id)"
    roles: [CredentialingSpecialist, MedicalDirector, EnrollmentCoordinator, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["org_id?", "limit?", "offset?"]
    output: "Provider[]"
    side_effects: []

  - method: POST
    path: "/providers/{id}/submit-application"
    description: "Submit the CAQH application (DRAFT -> SUBMITTED)"
    roles: [CredentialingSpecialist]
    code: 200
    input: []
    output: Provider
    side_effects: ["application_status=SUBMITTED; initiated_by_user_id set from X-User-ID"]

  - method: POST
    path: "/providers/{id}/begin-verification"
    description: "Begin primary source verification (SUBMITTED -> IN_VERIFICATION)"
    roles: [CredentialingSpecialist]
    code: 200
    input: []
    output: Provider
    side_effects: ["application_status=IN_VERIFICATION; UNVERIFIED CredentialItems -> PENDING_PSV"]

  - method: POST
    path: "/providers/{id}/finalize-verification"
    description: "Finalize verification (IN_VERIFICATION -> READY_FOR_REVIEW)"
    roles: [CredentialingSpecialist]
    code: 200
    input: []
    output: Provider
    side_effects: ["application_status=READY_FOR_REVIEW; recompute readiness_score & credentialing_status"]

  - method: POST
    path: "/providers/{id}/start-recredentialing"
    description: "Start a re-credentialing cycle (recred_state RECRED_DUE -> IN_RECREDENTIALING)"
    roles: [CredentialingSpecialist]
    code: 200
    input: []
    output: Provider
    side_effects: ["recred_state=IN_RECREDENTIALING; application_status=IN_VERIFICATION; non-VALID VERIFIED items -> PENDING_PSV"]

  # ---- Credential items (license/DEA/board) ----
  - method: POST
    path: "/providers/{id}/credential-items"
    description: "Add a credential item to a provider"
    roles: [CredentialingSpecialist]
    code: 201
    input: [item_type, identifier, issued_date, expiration_date]
    output: CredentialItem
    side_effects: ["verification_state=UNVERIFIED; expirable_band computed"]

  - method: GET
    path: "/providers/{id}/credential-items"
    description: "List a provider's credential items (reverse-reachability for CredentialItem.provider_id FK)"
    roles: [CredentialingSpecialist, MedicalDirector, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "CredentialItem[]"
    side_effects: []

  - method: GET
    path: "/credential-items/{id}"
    description: "Get a single credential item (includes computed expirable_band, verification_state)"
    roles: [CredentialingSpecialist, MedicalDirector, ComplianceOfficer, SystemAdmin]
    code: 200
    input: []
    output: CredentialItem
    side_effects: []

  - method: POST
    path: "/credential-items/{id}/reverify"
    description: "Re-open verification on a REJECTED credential item (REJECTED -> PENDING_PSV)"
    roles: [CredentialingSpecialist]
    code: 200
    input: []
    output: CredentialItem
    side_effects: ["verification_state=PENDING_PSV; a fresh OPEN VerificationRequest is created"]

  # ---- Verification requests ----
  - method: POST
    path: "/credential-items/{id}/verification-requests"
    description: "Open a primary-source verification request for a credential item"
    roles: [CredentialingSpecialist]
    code: 201
    input: [method, source_reference]
    output: VerificationRequest
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/credential-items/{id}/verification-requests"
    description: "List verification requests for a credential item (reverse-reachability)"
    roles: [CredentialingSpecialist, MedicalDirector, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "VerificationRequest[]"
    side_effects: []

  - method: GET
    path: "/verification-requests"
    description: "List verification requests (filter by provider_id; reverse-reachability for VerificationRequest.provider_id FK)"
    roles: [CredentialingSpecialist, MedicalDirector, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["provider_id?", "limit?", "offset?"]
    output: "VerificationRequest[]"
    side_effects: []

  - method: GET
    path: "/verification-requests/{id}"
    description: "Get a single verification request"
    roles: [CredentialingSpecialist, MedicalDirector, ComplianceOfficer, SystemAdmin]
    code: 200
    input: []
    output: VerificationRequest
    side_effects: []

  - method: POST
    path: "/verification-requests/{id}/complete"
    description: "Complete a verification request with PASS or FAIL"
    roles: [CredentialingSpecialist]
    code: 200
    input: [outcome]
    output: VerificationRequest
    side_effects: ["status=COMPLETED_PASS/FAIL; verified_at=current_utc; CredentialItem.verification_state=VERIFIED/REJECTED; recompute posture & readiness_score"]

  # ---- Sanctions screenings ----
  - method: POST
    path: "/providers/{id}/sanctions-screenings"
    description: "Record an OIG/SAM screening result for a provider"
    roles: [ComplianceOfficer]
    code: 201
    input: [sanctions_source_id, result, "resolution_note?"]
    output: SanctionsScreening
    side_effects: ["screened_at=current_utc; status=OPEN; if HIT recompute sanction_score & posture -> EXCLUDED"]

  - method: GET
    path: "/providers/{id}/sanctions-screenings"
    description: "List a provider's sanctions screenings (reverse-reachability for SanctionsScreening.provider_id FK)"
    roles: [ComplianceOfficer, CredentialingSpecialist, MedicalDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SanctionsScreening[]"
    side_effects: []

  - method: GET
    path: "/sanctions-screenings"
    description: "List sanctions screenings (filter by sanctions_source_id; reverse-reachability for SanctionsScreening.sanctions_source_id FK)"
    roles: [ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["sanctions_source_id?", "provider_id?", "limit?", "offset?"]
    output: "SanctionsScreening[]"
    side_effects: []

  - method: GET
    path: "/sanctions-screenings/{id}"
    description: "Get a single sanctions screening"
    roles: [ComplianceOfficer, CredentialingSpecialist, MedicalDirector, SystemAdmin]
    code: 200
    input: []
    output: SanctionsScreening
    side_effects: []

  - method: POST
    path: "/sanctions-screenings/{id}/resolve"
    description: "Resolve an open HIT screening (OPEN -> RESOLVED)"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: SanctionsScreening
    side_effects: ["status=RESOLVED; recompute sanction_score & posture; may leave EXCLUDED"]

  # ---- Peer reviewers ----
  - method: POST
    path: "/peer-reviewers"
    description: "Register a peer reviewer in an org"
    roles: [SystemAdmin, MedicalDirector]
    code: 201
    input: [org_id, user_id, full_name, "vote_weight?"]
    output: PeerReviewer
    side_effects: []

  - method: GET
    path: "/peer-reviewers"
    description: "List peer reviewers (filter by org_id; reverse-reachability for PeerReviewer.org_id FK)"
    roles: [SystemAdmin, MedicalDirector, CredentialingSpecialist]
    code: 200
    input: ["org_id?", "limit?", "offset?"]
    output: "PeerReviewer[]"
    side_effects: []

  - method: GET
    path: "/peer-reviewers/{id}"
    description: "Get a single peer reviewer"
    roles: [SystemAdmin, MedicalDirector, CredentialingSpecialist]
    code: 200
    input: []
    output: PeerReviewer
    side_effects: []

  # ---- Credentialing files (peer review) ----
  - method: POST
    path: "/providers/{id}/credentialing-files"
    description: "Open a credentialing review packet for a provider"
    roles: [CredentialingSpecialist, MedicalDirector]
    code: 201
    input: []
    output: CredentialingFile
    side_effects: ["review_status=ASSEMBLING"]

  - method: GET
    path: "/providers/{id}/credentialing-files"
    description: "List a provider's credentialing files (reverse-reachability)"
    roles: [CredentialingSpecialist, MedicalDirector, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "CredentialingFile[]"
    side_effects: []

  - method: GET
    path: "/credentialing-files/{id}"
    description: "Get a credentialing file (includes tally_yes/tally_no, version)"
    roles: [CredentialingSpecialist, MedicalDirector, ComplianceOfficer, SystemAdmin]
    code: 200
    input: []
    output: CredentialingFile
    side_effects: []

  - method: POST
    path: "/credentialing-files/{id}/open-review"
    description: "Open peer review (ASSEMBLING -> UNDER_REVIEW)"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: CredentialingFile
    side_effects: ["review_status=UNDER_REVIEW; opened_at=current_utc; chair_user_id=X-User-ID"]

  - method: POST
    path: "/credentialing-files/{id}/cast-vote"
    description: "Cast a peer-review ballot; recomputes weighted tally"
    roles: [MedicalDirector, PeerReviewer]
    code: 201
    input: [reviewer_id, ballot, "comment?"]
    output: PeerReviewVote
    side_effects: ["voter_user_id=X-User-ID; recompute peer_review_tally -> tally_yes/tally_no; CredentialingFile.version increments by 1"]

  - method: GET
    path: "/credentialing-files/{id}/votes"
    description: "List votes on a credentialing file (reverse-reachability for credentialing_file_id FK)"
    roles: [MedicalDirector, CredentialingSpecialist, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "PeerReviewVote[]"
    side_effects: []

  - method: GET
    path: "/votes/{id}"
    description: "Get a single peer-review vote (single-resource read)"
    roles: [MedicalDirector, CredentialingSpecialist, ComplianceOfficer, SystemAdmin]
    code: 200
