  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: draw_period_boundary_blocks_convert_strict
        grounds:
          - state_machines.Heloc.DRAW_to_REPAYMENT
          - validations[priority=12]
          - entities.Heloc.fields.origination_date
        distinguishing_aspect: |
          Interval semantics #1 — half-open lower bound on the draw interval: convert-to-repayment
          requires clock >= origination_date + draw_period_years; at clock one day before draw-end
          (2035-12-31, origination 2026-01-01 + 10y) the draw window still occupies the timeline and
          convert is rejected ERR_DRAW_PERIOD_NOT_ELAPSED.
        test_recipe:
          setup:
            - "Heloc DRAW, origination 2026-01-01, draw_period 10y -> draw-end 2036-01-01; clock 2035-12-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "B 15", annual_income_cents: 50000000, monthly_debt_obligation_cents: 100000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "15 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z", draw_period_years: 10 }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2035-12-31T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/convert-to-repayment"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "convert response error_id == ERR_DRAW_PERIOD_NOT_ELAPSED  # clock strictly before draw-end"

      - name: index_supersede_overlap_by_effective_date
        grounds:
          - concurrency_rules[index-reset-stale-rate]
          - entities.IndexRate.fields.effective_date
          - entities.IndexRate.fields.superseded
        distinguishing_aspect: |
          Interval semantics #2 — point-in-time precedence on a different resource (IndexRate): only
          the latest effective_date may be the active index; publishing a newer PRIME marks any
          earlier-effective_date IndexRate superseded=true (the earlier interval's occupation ends),
          a precedence rule by effective_date rather than a duration window.
        test_recipe:
          setup:
            - "IndexRate PRIME 850 effective 2026-01-01 active; publish PRIME 900 effective 2026-02-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
              captures: { idx_old: $.data.id }
          trigger:
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 900, effective_date: "2026-02-01T00:00:00Z" }
              as: LoanServicer
              captures: { idx_new: $.data.id }
          assert:
            - "IndexRate.${idx_old}.superseded == true  # earlier effective_date superseded by later"
            - "IndexRate.${idx_new}.superseded == false"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: draw_reverse_conserves_principal_plus_available
        grounds:
          - state_machines.Draw.BOOKED_to_REVERSED
          - entities.Heloc.fields.current_balance_cents
          - entities.Heloc.fields.available_credit_cents
        distinguishing_aspect: |
          Conserved quantity #1 — committed credit: for a line in DRAW the invariant
          current_balance_cents + available_credit_cents == credit_limit_cents must hold; reversing a
          BOOKED draw credits principal and re-grows available by the same amount, leaving the sum at
          credit_limit (50000000) unchanged.
        test_recipe:
          setup:
            - "Heloc DRAW credit_limit 50000000; Draw 200000 booked -> balance 200000, available 49800000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "B 16", annual_income_cents: 50000000, monthly_debt_obligation_cents: 100000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "16 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 200000 }
              as: LoanServicer
              captures: { draw_id: $.data.id }
          trigger:
            - call: "POST /helocs/${hl_id}/draws/${draw_id}/reverse"
              payload: {}
              as: LoanServicer
              captures: { st: $.data.status }
          assert:
            - "Draw.${draw_id}.status == REVERSED"
            - "Heloc.${hl_id}.current_balance_cents == 0"
            - "Heloc.${hl_id}.available_credit_cents == 50000000  # balance + available == credit_limit conserved"

      - name: payment_waterfall_conserves_remittance
        grounds:
          - calculations.payment_waterfall_allocation
          - entities.Payment.fields.fee_applied_cents
          - entities.Payment.fields.interest_applied_cents
          - entities.Payment.fields.principal_applied_cents
        distinguishing_aspect: |
          Conserved quantity #2 — remitted cents: the waterfall invariant
          fee_applied + interest_applied + principal_applied == amount_cents must hold exactly; a
          10000 payment against 0 fees / 1644 interest / 200000 principal splits 0+1644+8356 == 10000
          with zero drift (a different conserved quantity than committed credit).
        test_recipe:
          setup:
            - "Heloc DRAW APR 1000; Draw 200000 at 2026-01-01; clock 2026-01-31; accrued 1644; no fees."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "B 17", annual_income_cents: 50000000, monthly_debt_obligation_cents: 100000, credit_score: 750, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "17 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 200000 }
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/payments"
              payload: { amount_cents: 10000 }
              as: LoanServicer
              captures: { pay_id: $.data.id }
          assert:
            - "Payment.${pay_id}.fee_applied_cents == 0"
            - "Payment.${pay_id}.interest_applied_cents == 1644"
            - "Payment.${pay_id}.principal_applied_cents == 8356"
            - "Payment.${pay_id}.fee_applied_cents + Payment.${pay_id}.interest_applied_cents + Payment.${pay_id}.principal_applied_cents == 10000"
