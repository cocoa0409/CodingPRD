  # ===========================================================================
  # Rule 8 — Resource/temporal overlap with two DIFFERENT interval semantics
  #          on two DIFFERENT resource entities
  #   EntryFacility dock : HALF-OPEN [start, end), AGGREGATE capacity
  #   Client billing period : CLOSED [start, end], PAIRWISE-EXCLUSIVE
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: dock_half_open_aggregate_capacity_at_facility
        grounds:
          - calculations.dock_capacity_occupancy
          - validations[priority=39]
          - errors.ERR_DOCK_CAPACITY_EXCEEDED
          - entities.EntryFacility.fields.dock_capacity_pallets_per_slot
          - entities.DropShipment.fields.pallet_count
        distinguishing_aspect: |
          Resource: the EntryFacility dock. Semantics: HALF-OPEN [start, end) with an
          AGGREGATE pallet capacity — a shipment beginning exactly when another ends is not
          a conflict at all, several shipments may share one window while their pallets sum
          within capacity, and the rejection comparison is strict (>) so hitting capacity
          exactly is accepted. Four bookings walk all three of those properties: adjacency
          accepted, sum-to-exactly-capacity accepted, one pallet past capacity refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z."
            - "EntryFacility NDC-060 is OPEN with dock_capacity_pallets_per_slot 12."
            - "Four empty OPEN batches exist, because a batch may hold only one SCHEDULED or IN_TRANSIT shipment at a time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /entry-facilities"
              payload: { facility_code: "NDC-060", facility_type: "NDC", zip3: "060", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 200, served_zip3_list: ["060", "061"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_1_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_2_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_3_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_4_id: $.data.id }
          trigger:
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_1_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T08:00:00.000Z", window_end_utc: "2026-08-12T16:00:00.000Z", pallet_count: 8 }
              as: PresortOperator
              captures: { ship_1_id: $.data.id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_2_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T16:00:00.000Z", window_end_utc: "2026-08-12T20:00:00.000Z", pallet_count: 8 }
              as: PresortOperator
              captures: { ship_2_id: $.data.id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_3_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T12:00:00.000Z", window_end_utc: "2026-08-12T14:00:00.000Z", pallet_count: 4 }
              as: PresortOperator
              captures: { ship_3_id: $.data.id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_4_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T12:00:00.000Z", window_end_utc: "2026-08-12T14:00:00.000Z", pallet_count: 1 }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "Shipment 1: HTTP 201, DropShipment.${ship_1_id}.status == SCHEDULED with pallet_count 8 over [08:00, 16:00)"
            - "Shipment 2: HTTP 201 — it starts at exactly 16:00:00.000Z, the instant shipment 1 ends, and under half-open geometry that is NOT an overlap, so its 8 pallets do not join the earlier 8"
            - "Shipment 3: HTTP 201 — it overlaps shipment 1 only, so occupied 8 + requested 4 == 12 == dock_capacity_pallets_per_slot, and the strict (>) comparison accepts equality"
            - "Shipment 4: HTTP 409 with ${err_id} == ERR_DOCK_CAPACITY_EXCEEDED — it overlaps shipments 1 and 3 for occupied 12, and 12 + 1 == 13 > 12"
            - "Shipment 4 was refused even though its own pallet_count is only 1 and the window is 2 hours long: capacity is AGGREGATE over overlapping shipments, not per shipment"
            - "GET /entry-facilities/${fac_id}/drop-shipments returns exactly 3 rows; no row exists for CommingleBatch.${batch_4_id}"
            - "Shipment 2 proves adjacency is free: had the geometry been closed [start, end], its 8 pallets would have joined shipment 1's 8 at the 16:00 instant and been refused at 16 > 12"

      - name: billing_period_closed_interval_pairwise_exclusivity
        grounds:
          - calculations.billing_period_exclusivity
          - validations[priority=41]
          - validations[priority=43]
          - errors.ERR_BILLING_PERIOD_OVERLAP
          - entities.ClientInvoice.fields.period_start_utc
        distinguishing_aspect: |
          Resource: the Client's billing timeline — a different resource entity from the
          dock, with the OPPOSITE interval semantics. Periods are CLOSED [start, end] and
          PAIRWISE-EXCLUSIVE with zero capacity, so a period starting on exactly the instant
          a prior period ended IS a conflict (that instant would be billed twice), which is
          precisely the case the dock rule accepts. A second request one millisecond later
          clears exclusivity and then fails on a completely different rule
          (ERR_NO_BILLABLE_JOBS), proving the overlap check passed rather than being skipped.
        test_recipe:
          setup:
            - "The canonical batch is sorted, accepted clean and its 2-pallet shipment has departed, with the logical clock at 2026-08-12T14:00:00.000Z."
          setup_api_calls: *chain_departed
          trigger:
            - call: "POST /drop-shipments/${ship_id}/deposit"
              payload: {}
              as: AcceptanceClerk
              as_user_id: "clerk-007"
            - call: "POST /clients/${cl_a_id}/invoices"
              payload: { period_start_utc: "2026-08-01T00:00:00.000Z", period_end_utc: "2026-08-31T23:59:59.000Z" }
              as: PostageManager
              captures: { inv_aug_id: $.data.id }
            - call: "POST /clients/${cl_a_id}/invoices"
              payload: { period_start_utc: "2026-08-31T23:59:59.000Z", period_end_utc: "2026-09-30T23:59:59.000Z" }
              as: PostageManager
              captures: { err_id: $.data.error_id }
            - call: "POST /clients/${cl_a_id}/invoices"
              payload: { period_start_utc: "2026-09-01T00:00:00.000Z", period_end_utc: "2026-09-30T23:59:59.000Z" }
              as: PostageManager
              captures: { err_id_2: $.data.error_id }
          assert:
            - "August invoice: HTTP 201, ClientInvoice.${inv_aug_id}.period_start_utc == '2026-08-01T00:00:00.000Z', period_end_utc == '2026-08-31T23:59:59.000Z', status ISSUED, billed_piece_count 1200, total_cents 34160"
            - "Touching period: HTTP 409 with ${err_id} == ERR_BILLING_PERIOD_OVERLAP — request.period_start_utc 2026-08-31T23:59:59.000Z <= existing period_end_utc 2026-08-31T23:59:59.000Z and existing start <= request end, so closed-interval adjacency conflicts"
            - "The same instant-touching geometry is ACCEPTED by the dock rule in the sibling instance: the two resources must not share one overlap helper"
            - "Disjoint September period: HTTP 422 with ${err_id_2} == ERR_NO_BILLABLE_JOBS, not ERR_BILLING_PERIOD_OVERLAP — exclusivity passed one millisecond later, and the failure moved to the empty-input rule at priority 43"
            - "Only one ClientInvoice exists for Client.${cl_a_id}: GET /clients/${cl_a_id}/invoices returns exactly 1 row, and MailJob.${job_a_id}.status == BILLED was not double-billed"

  # ===========================================================================
  # Rule 9 — Compensating invariants over two DIFFERENT conserved quantities
  #   permit_total_funds_cents = balance_cents + reserved_cents  (money)
  #   CommingleBatch.total_piece_count = sum(BatchMember.contributed_piece_count)  (pieces)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: permit_funds_conservation_on_submit_then_void
        grounds:
          - entities.PermitAccount.fields.balance_cents
          - entities.PermitAccount.fields.reserved_cents
          - state_machines.PostageStatement.DRAFT_to_SUBMITTED
          - state_machines.PostageStatement.SUBMITTED_to_VOID
          - state_machines.CommingleBatch.DOCUMENTED_to_SORTED
        distinguishing_aspect: |
          Conserved quantity: MONEY — permit_total_funds_cents = balance_cents +
          reserved_cents must equal 200000 before the submit, after the submit and after the
          void. Submit moves 79152 from balance into reserved (a transfer, not a spend) and
          the void moves exactly that amount back, with the batch compensated from
          DOCUMENTED back to SORTED so a replacement statement can be prepared against the
          untouched sortation. The classic wrong implementation debits balance on submit
          without crediting reserved (total drops to 120848) or credits balance on void
          without clearing reserved (total inflates to 279152); both leave the invariant
          broken while each individual field looks plausible.
        test_recipe:
          setup:
            - "The canonical batch is sorted (declared_postage_cents 79152) and its statement has been submitted by pm-001 against the house permit account funded with 200000 c."
          setup_api_calls: *chain_submitted
          trigger:
            - call: "GET /permit-accounts/${pa_h_id}"
              payload: {}
              as: PostageManager
              captures: { bal_after_submit: $.data.balance_cents, res_after_submit: $.data.reserved_cents }
            - call: "POST /postage-statements/${stmt_id}/void"
              payload: { reason: "client pulled the job from the drop" }
              as: PostageManager
              as_user_id: "pm-001"
            - call: "GET /permit-accounts/${pa_h_id}"
              payload: {}
              as: PostageManager
              captures: { bal_after_void: $.data.balance_cents, res_after_void: $.data.reserved_cents }
          assert:
            - "Before the submit the funding call had left balance_cents 200000 and reserved_cents 0, so permit_total_funds_cents == 200000"
            - "After the submit: ${bal_after_submit} == 120848 and ${res_after_submit} == 79152, and 120848 + 79152 == 200000 — the invariant held across a transfer"
            - "After the void: ${bal_after_void} == 200000 and ${res_after_void} == 0, so permit_total_funds_cents == 200000 again with zero drift"
            - "PostageStatement.${stmt_id}.status == VOID with void_reason set, declared_postage_cents still 79152 and adjustment_cents 0"
            - "Compensation reached the batch too: CommingleBatch.${batch_id}.status == SORTED (not DOCUMENTED, not OPEN), achieved_tier THREE_DIGIT, rate_mills_per_piece 26384 and batch_postage_cents 79152 all intact"
            - "BatchMember allocations were NOT unwound by the void: ${mem_a_id} keeps 31660 and ${mem_b_id} keeps 47492 — the sortation is untouched, unlike the return cascade which zeroes them"
            - "MailJob.${job_a_id}.status == PRESORTED and SortContainer.${cont_1_id}.status == DOCUMENTED: the void compensates money and batch state only"

      - name: batch_piece_ledger_conservation_on_member_add_then_remove
        grounds:
          - entities.CommingleBatch.fields.total_piece_count
          - entities.BatchMember.fields.contributed_piece_count
          - state_machines.MailJob.POOLED_to_HYGIENE_CLEARED
          - endpoints[DELETE /commingle-batches/{id}/members/{batch_member_id}]
          - calculations.presort_tier_qualification
        distinguishing_aspect: |
          Conserved quantity: PIECES — a different ledger from the money invariant above.
          CommingleBatch.total_piece_count must equal the sum of its BatchMember
          contributed_piece_count values after every add and every remove, and
          member_job_count must track the row count. Removing the 1800-piece member and
          re-adding it must return the batch to exactly 3000 pieces, so that the sort which
          follows produces the same THREE_DIGIT tier, the same 26384 mills and the same
          31660 / 47492 split as an untouched batch. An implementation that decrements
          total_piece_count using the job's declared_piece_count (1850) instead of the
          member's contributed 1800, or that leaves the removed job's commingle_batch_id
          set, drifts by 50 pieces and never recovers.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z."
            - "Clients ACME (job A, accepted 1200 of 1250 declared) and BORE (job B, accepted 1800 of 1850 declared) each have an ACTIVE permit account."
            - "An OPEN MARKETING_MAIL/LETTERS batch destined for SCF-021 already holds member A, so total_piece_count == 1200 and member_job_count == 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { name: "Acme Direct", client_code: "ACME", service_fee_rate_per_thousand_cents: 900 }
              as: BureauAdmin
              captures: { cl_a_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Borealis Mailers", client_code: "BORE", service_fee_rate_per_thousand_cents: 2200 }
              as: BureauAdmin
              captures: { cl_b_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_a_id}", permit_number: "PI-100100", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_a_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_b_id}", permit_number: "PI-200200", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_b_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_a_id}", permit_account_id: "${pa_a_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_a_id: $.data.id }
            - call: "POST /mail-jobs/${job_a_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_b_id}", permit_account_id: "${pa_b_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1850, declared_weight_oz_per_piece: 1.1 }
              as: PresortOperator
              captures: { job_b_id: $.data.id }
            - call: "POST /mail-jobs/${job_b_id}/hygiene-runs"
              payload: { submitted_piece_count: 1850, cass_matched_count: 1830, ncoa_move_updated_count: 55, undeliverable_removed_count: 50, move_update_age_days: 20 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_a_id}" }
              as: PresortOperator
              captures: { mem_a_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_b_id}" }
              as: PresortOperator
              captures: { mem_b_id: $.data.id }
            - call: "GET /commingle-batches/${batch_id}"
              payload: {}
              as: PresortOperator
              captures: { total_after_add: $.data.total_piece_count }
            - call: "DELETE /commingle-batches/${batch_id}/members/${mem_b_id}"
              payload: {}
              as: PresortOperator
            - call: "GET /commingle-batches/${batch_id}"
              payload: {}
              as: PresortOperator
              captures: { total_after_remove: $.data.total_piece_count }
            - call: "GET /mail-jobs/${job_b_id}"
              payload: {}
              as: PresortOperator
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_b_id}" }
              as: PresortOperator
              captures: { mem_b2_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "021", sort_level: "FIVE_DIGIT", piece_count: 1000 }
              as: PresortOperator
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "941", sort_level: "THREE_DIGIT", piece_count: 2000 }
              as: PresortOperator
            - call: "POST /commingle-batches/${batch_id}/sort"
              payload: {}
              as: PresortOperator
            - call: "GET /commingle-batches/${batch_id}/members"
              payload: {}
              as: PresortOperator
          assert:
            - "After the add: ${total_after_add} == 3000 == BatchMember.${mem_a_id}.contributed_piece_count 1200 + BatchMember.${mem_b_id}.contributed_piece_count 1800, with member_job_count == 2"
            - "After the remove: ${total_after_remove} == 1200 == the single surviving member's contributed_piece_count, with member_job_count == 1 — the ledger fell by the member's contributed 1800, NOT by the job's declared 1850"
            - "After the remove: MailJob.${job_b_id}.status == HYGIENE_CLEARED with commingle_batch_id == null and postage_due_cents == 0, so it is poolable again; BatchMember.${mem_b_id} no longer appears in GET /commingle-batches/${batch_id}/members"
            - "After the re-add: total_piece_count == 3000 and member_job_count == 2 again, with BatchMember.${mem_b2_id}.contributed_piece_count == 1800 — a NEW member row for the same job, and MailJob.${job_b_id}.status == POOLED"
            - "Zero drift is proved downstream by the sort: achieved_tier == THREE_DIGIT (3000 >= 3000 exactly), rate_mills_per_piece == 26384, batch_postage_cents == 79152, BatchMember.${mem_a_id}.allocated_postage_cents == 31660 and BatchMember.${mem_b2_id}.allocated_postage_cents == 47492"
            - "Had the remove drifted the ledger to 1150 or 1250 pieces, the re-added batch would sit at 2950 or 3050 and the tier would have landed on BASIC (rate 28556) or stayed THREE_DIGIT with a different pool, so the invariant is observable in money as well as in pieces"
