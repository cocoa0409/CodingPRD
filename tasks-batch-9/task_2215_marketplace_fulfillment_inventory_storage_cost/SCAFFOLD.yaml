# =============================================================================
# task_2215 — Marketplace Fulfillment Inventory & Storage Cost Management
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  2215. Marketplace Fulfillment Inventory & Storage Cost Management (marketplace fulfillment seller operations): inbound shipment planning with prep, labeling and case-pack requirements by destination fulfillment center, restock limit and capacity allocation management with performance-based quotas, inventory age tracking with long-term storage surcharges and removal decisions, sell-through velocity forecasting to size replenishment shipments and avoid stranded inventory, unfulfillable inventory classification with disposal, return-to-seller and liquidation options, reimbursement claims for lost or damaged units with evidence and filing deadlines, multi-channel fulfillment usage and fee comparison, listing suppression from stranded or missing inventory

domain_name: marketplace-fulfillment-inventory
api_prefix: /fulfillment

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Peer entities linked by foreign keys (flat topology): SkuListing, InboundShipmentPlan,
    InventoryLot, RemovalOrder and ReimbursementClaim are siblings joined by FK fields, not
    URL-nested aggregates. Two entities carry parallel state dimensions (SkuListing:
    listing_status x inventory_health; InventoryLot: lot_status x reconciliation_status),
    ReimbursementClaim is cyclic (SUBMITTED -> INFO_REQUESTED -> SUBMITTED, bounded at 2
    resubmissions) and InboundShipmentPlan branches at receipt (RECEIVED_COMPLETE vs
    PARTIALLY_RECEIVED with divergent side-effect sets) plus a CONFIRMED -> DRAFT revert cycle.
    Segregation of duties: only SellerOperator may submit/resubmit claims, only
    ClaimsAdjudicator may request info or decide them, and MarketplaceAdmin has no claim
    powers at all.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SellerAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered seller name.
      - name: storage_cubic_feet_entitlement
        type: number
        source: input
        description: Contracted storage volume in cubic feet used as the denominator of storage_utilization_ratio.
        constraints: "> 0, 4 decimal places"
      - name: unit_cost_cap_cents
        type: integer
        source: input
        description: Per-unit ceiling applied to reimbursement valuation.
        constraints: ">= 0"
      - name: seller_status
        type: enum
        source: system
        description: Account posture. ACTIVE on creation; SUSPENDED set by MarketplaceAdmin quota action when iprs_score < 200.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: restock_reserved_units
        type: integer
        source: computed
        description: "Conserved quantity INV-1: equals sum of InboundShipmentPlan.allocated_units over plans of this seller whose status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}."
        default: 0
      - name: open_discrepancy_units
        type: integer
        source: computed
        description: Sum of InventoryLot.missing_units over lots whose reconciliation_status IN {DISCREPANCY_OPEN, DISCREPANCY_CLAIMED} for listings of this seller.
        default: 0
      - name: suppressed_listing_count
        type: integer
        source: computed
        description: Count of SkuListing rows of this seller whose listing_status == SUPPRESSED.
        default: 0
      - name: storage_utilization_ratio
        type: number
        source: computed
        description: Ratio produced by calculation storage_utilization_ratio; 4 decimal places.
        default: 0.0
      - name: storage_fee_accrued_cents
        type: integer
        source: computed
        description: Running sum of StorageFeeAssessment.total_fee_cents across all billing runs for lots of this seller's listings.
        default: 0
      - name: reimbursement_credit_cents
        type: integer
        source: computed
        description: Running sum of ReimbursementClaim.reimbursement_amount_cents over claims whose status == APPROVED.
        default: 0
      - name: mcf_fee_accrued_cents
        type: integer
        source: computed
        description: Running sum of MultiChannelOrder.mcf_fee_cents over orders whose order_status == MCF_SHIPPED.
        default: 0

  - name: FulfillmentCenter
    parent: null
    common_fields: true
    fields:
      - name: fc_code
        type: string
        source: input
        description: Unique fulfillment center code.
        constraints: "unique across FulfillmentCenter"
      - name: region_code
        type: string
        source: input
        description: Geographic region label used only for reporting.
      - name: prep_profile
        type: enum
        source: input
        description: Destination prep requirement profile driving prep and label validations.
        constraints: "one of {POLYBAG_REQUIRED, LABEL_ONLY, CASE_PACK_STRICT}"
      - name: case_pack_min_units
        type: integer
        source: input
        description: Minimum units per case pack demanded when prep_profile == CASE_PACK_STRICT.
        constraints: ">= 1"
      - name: receiving_capacity_units_per_window
        type: integer
        source: input
        description: Units this FC can receive across any single appointment window.
        constraints: ">= 1"
      - name: monthly_storage_rate_cents_per_cubic_foot
        type: integer
        source: input
        description: Base monthly storage rate in cents per cubic foot.
        constraints: ">= 0"
      - name: ltsf_rate_cents_per_cubic_foot
        type: integer
        source: input
        description: Long-term storage surcharge rate in cents per cubic foot per surcharge step.
        constraints: ">= 0"
      - name: receiving_status
        type: enum
        source: system
        description: OPEN on creation; THROTTLED halves effective window capacity; SUSPENDED blocks plan confirmation.
        default: OPEN
        constraints: "one of {OPEN, THROTTLED, SUSPENDED}"
      - name: committed_receiving_units
        type: integer
        source: computed
        description: "Conserved quantity INV-3: equals sum of InboundShipmentPlan.declared_units over plans with destination_fc_id == this FC whose status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}."
        default: 0

  - name: SkuListing
    parent: null
    common_fields: true
    fields:
      - name: seller_account_id
        type: string
        source: input
        description: FK -> SellerAccount.id; owning seller.
      - name: sku
        type: string
        source: input
        description: Seller SKU.
        constraints: "unique per (seller_account_id, sku)"
      - name: unit_cubic_feet
        type: number
        source: input
        description: Storage volume of one unit in cubic feet.
        constraints: "> 0, 4 decimal places"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Declared per-unit cost used for reimbursement and liquidation valuation.
        constraints: ">= 0"
      - name: listing_status
        type: enum
        source: computed
        description: "Parallel dimension 1. ACTIVE on creation; SUPPRESSED by calculation listing_health_recompute; back to ACTIVE only via POST /fulfillment/sku-listings/{id}/reinstate."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPPRESSED}"
      - name: suppression_reason
        type: enum
        source: computed
        description: Reason pinned when listing_status becomes SUPPRESSED; reset to NONE on reinstate.
        default: NONE
        constraints: "one of {NONE, MISSING_INVENTORY, STRANDED_INVENTORY, ZERO_FULFILLABLE}"
      - name: inventory_health
        type: enum
        source: computed
        description: Parallel dimension 2, evolves independently of listing_status; produced by calculation listing_health_recompute.
        default: OUT_OF_STOCK
        constraints: "one of {HEALTHY, EXCESS_AGED, STRANDED, OUT_OF_STOCK}"
      - name: fulfillable_units
        type: integer
        source: computed
        description: "Sum of InventoryLot.fulfillable_units over lots of this listing whose lot_status IN {ACTIVE, PARTIALLY_REMOVED}."
        default: 0
      - name: unfulfillable_units
        type: integer
        source: computed
        description: "Sum of InventoryLot.unfulfillable_units over lots of this listing whose lot_status IN {ACTIVE, PARTIALLY_REMOVED}."
        default: 0
      - name: missing_units
        type: integer
        source: computed
        description: "Sum of InventoryLot.missing_units over lots of this listing whose lot_status IN {ACTIVE, PARTIALLY_REMOVED, DEPLETED}."
        default: 0
      - name: aged_over_365_units
        type: integer
        source: computed
        description: "Sum of InventoryLot.fulfillable_units + InventoryLot.unfulfillable_units over lots of this listing whose aged_bucket == OVER_365 and lot_status IN {ACTIVE, PARTIALLY_REMOVED}."
        default: 0
      - name: recommended_replenishment_units
        type: integer
        source: computed
        description: Copied from the most recent VelocityForecast of this listing (ordered by created_at DESC, first row).
        default: 0
      - name: lot_ever_created
        type: boolean
        source: computed
        description: True once at least one InventoryLot row exists for this listing; gates the ZERO_FULFILLABLE suppression reason.
        default: false

  - name: RestockQuota
    parent: null
    common_fields: true
    fields:
      - name: seller_account_id
        type: string
        source: input
        description: FK -> SellerAccount.id; seller this quota period belongs to.
      - name: period_start
        type: datetime
        source: input
        description: Quota period start, ISO 8601 UTC, inclusive.
      - name: period_end
        type: datetime
        source: input
        description: Quota period end, ISO 8601 UTC, exclusive.
        constraints: "must be strictly after period_start"
      - name: base_capacity_units
        type: integer
        source: input
        description: Baseline unit allowance before the performance multiplier is applied.
        constraints: ">= 1"
      - name: sell_through_rate
        type: number
        source: input
        description: Trailing sell-through rate input of calculation iprs_and_restock_limit.
        constraints: ">= 0, 4 decimal places"
      - name: excess_units_ratio
        type: number
        source: input
        description: Excess-inventory ratio input of calculation iprs_and_restock_limit.
        constraints: "0..1, 4 decimal places"
      - name: stranded_ratio
        type: number
        source: input
        description: Stranded-inventory ratio input of calculation iprs_and_restock_limit.
        constraints: "0..1, 4 decimal places"
      - name: in_stock_rate
        type: number
        source: input
        description: In-stock-rate input of calculation iprs_and_restock_limit.
        constraints: "0..1, 4 decimal places"
      - name: iprs_score
        type: integer
        source: computed
        description: Inventory performance score 0..1000 produced by calculation iprs_and_restock_limit.
        default: 0
      - name: base_capacity_tier
        type: enum
        source: computed
        description: Tier derived from iprs_score alone, before utilization downgrades.
        constraints: "one of {TIER_ELEVATED, TIER_STANDARD, TIER_RESTRICTED}"
      - name: capacity_tier_downgrade_steps
        type: integer
        source: computed
        description: Number of one-step downgrades applied by storage-billing runs when storage_utilization_ratio > 1.0000; at most one step is added per run.
        default: 0
      - name: capacity_tier
        type: enum
        source: computed
        description: Effective tier after applying capacity_tier_downgrade_steps to base_capacity_tier.
        constraints: "one of {TIER_ELEVATED, TIER_STANDARD, TIER_RESTRICTED}"
      - name: restock_limit_units
        type: integer
        source: computed
        description: Unit ceiling for all inbound allocation, produced by calculation iprs_and_restock_limit.
        default: 0
      - name: utilized_units
        type: integer
        source: computed
        description: Cumulative sum of InboundShipmentPlan.allocated_units granted against this quota; never decremented by receipt, decremented only by plan cancellation and revert-to-draft.
        default: 0
      - name: status
        type: enum
        source: computed
        description: ACTIVE on creation; SUPERSEDED when a newer quota is created for the same seller; EXPIRED by a storage-billing run once the logical clock reaches period_end.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED, EXPIRED}"

  - name: InboundShipmentPlan
    parent: null
    common_fields: true
    fields:
      - name: seller_account_id
        type: string
        source: input
        description: FK -> SellerAccount.id; owning seller.
      - name: destination_fc_id
        type: string
        source: input
        description: FK -> FulfillmentCenter.id; destination fulfillment center whose prep_profile and capacity govern this plan.
      - name: appointment_window_start
        type: datetime
        source: input
        description: Receiving appointment window start, ISO 8601 UTC. Windows are half-open [start, end).
      - name: appointment_window_end
        type: datetime
        source: input
        description: Receiving appointment window end, ISO 8601 UTC, exclusive.
        constraints: "must be strictly after appointment_window_start"
      - name: status
        type: enum
        source: computed
        description: Lifecycle state; see §1.2 InboundShipmentPlan.
        default: DRAFT
        constraints: "one of {DRAFT, CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED, RECEIVED_COMPLETE, CANCELLED, CLOSED}"
      - name: declared_units
        type: integer
        source: computed
        description: Sum of ShipmentLineItem.units over line items of this plan.
        default: 0
      - name: provisional_allocated_units
        type: integer
        source: computed
        description: Output of calculation restock_allocation variant PROVISIONAL; refreshed on plan creation and on every line-item creation.
        default: 0
      - name: final_allocated_units
        type: integer
        source: computed
        description: Output of calculation restock_allocation variant FINAL; written only by a successful confirm.
        default: 0
      - name: allocated_units
        type: integer
        source: computed
        description: "Units reserved against the quota while status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}; equals final_allocated_units at confirm, reset to 0 on cancel, revert-to-draft and CLOSED."
        default: 0
      - name: allocation_status
        type: enum
        source: computed
        description: WITHIN_LIMIT when provisional_allocated_units == declared_units, otherwise OVER_LIMIT.
        default: WITHIN_LIMIT
        constraints: "one of {WITHIN_LIMIT, OVER_LIMIT}"
      - name: prep_compliance_status
        type: enum
        source: computed
        description: PENDING until confirm; COMPLIANT once a confirm passes prep, label and case-pack validation.
        default: PENDING
        constraints: "one of {PENDING, COMPLIANT}"
      - name: received_units
        type: integer
        source: computed
        description: Cumulative units accepted across all receive calls on this plan.
        default: 0
      - name: missing_units
        type: integer
        source: computed
        description: "Conserved quantity INV-4: declared_units - received_units after the plan reaches PARTIALLY_RECEIVED or RECEIVED_COMPLETE, 0 before."
        default: 0
      - name: confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant of the successful confirm, ISO 8601 UTC; null before.
        default: null

  - name: ShipmentLineItem
    parent: null
    common_fields: true
    fields:
      - name: shipment_plan_id
        type: string
        source: input
        description: FK -> InboundShipmentPlan.id; plan this line belongs to.
      - name: sku_listing_id
        type: string
        source: input
        description: FK -> SkuListing.id; listing shipped on this line.
      - name: units
        type: integer
        source: input
        description: Units declared on this line.
        constraints: ">= 1"
      - name: case_pack_units
        type: integer
        source: input
        description: Units per case pack for this line.
        constraints: ">= 1"
      - name: polybagged
        type: boolean
        source: input
        description: Whether the units are polybagged before dispatch.
      - name: label_type
        type: enum
        source: input
        description: Unit labelling applied by the seller.
        constraints: "one of {FNSKU, MANUFACTURER_BARCODE, NONE}"
      - name: provisional_allocated_units
        type: integer
        source: computed
        description: Per-line grant from the PROVISIONAL waterfall of calculation restock_allocation.
        default: 0
      - name: final_allocated_units
        type: integer
        source: computed
        description: Per-line grant from the FINAL waterfall of calculation restock_allocation; written only by a successful confirm.
        default: 0
      - name: received_units
        type: integer
        source: computed
        description: Cumulative units accepted for this line across receive calls.
        default: 0
      - name: shortfall_units
        type: integer
        source: computed
        description: units - received_units once the owning plan has been received at least once, 0 before.
        default: 0

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - name: sku_listing_id
        type: string
        source: input
        description: FK -> SkuListing.id; listing stocked in this lot.
      - name: fulfillment_center_id
        type: string
        source: input
        description: FK -> FulfillmentCenter.id; FC holding this lot.
      - name: first_received_at
        type: datetime
        source: system
        description: Logical-clock instant at which this lot row was created by a receive call; never changed afterwards and used as the aging anchor.
      - name: units_received_total
        type: integer
        source: computed
        description: "Conserved quantity INV-2 left side: cumulative units accepted into this lot."
        default: 0
      - name: fulfillable_units
        type: integer
        source: computed
        description: Units sellable from this lot.
        default: 0
      - name: unfulfillable_units
        type: integer
        source: computed
        description: Units classified unfulfillable and not yet reserved for removal.
        default: 0
      - name: units_reserved_for_removal
        type: integer
        source: computed
        description: Units held by RemovalOrder rows whose status == REQUESTED.
        default: 0
      - name: units_removed
        type: integer
        source: computed
        description: Units retired by RemovalOrder rows whose status == COMPLETED.
        default: 0
      - name: units_shipped_mcf
        type: integer
        source: computed
        description: Units consumed by MultiChannelOrder rows whose order_status == MCF_SHIPPED.
        default: 0
      - name: missing_units
        type: integer
        source: computed
        description: Units declared inbound to this lot but never received; reduced only by an APPROVED ReimbursementClaim.
        default: 0
      - name: lot_status
        type: enum
        source: computed
        description: Parallel dimension 1; see §1.2 InventoryLot.
        default: ACTIVE
        constraints: "one of {ACTIVE, PARTIALLY_REMOVED, DEPLETED}"
      - name: reconciliation_status
        type: enum
        source: computed
        description: Parallel dimension 2, evolves independently of lot_status; see §1.2 InventoryLot.
        default: RECONCILED
        constraints: "one of {RECONCILED, DISCREPANCY_OPEN, DISCREPANCY_CLAIMED, DISCREPANCY_RESOLVED}"
      - name: age_days
        type: integer
        source: computed
        description: floor((logical_clock_now - first_received_at) / 86400 seconds); recomputed on every read and on every storage-billing run.
        default: 0
      - name: aged_bucket
        type: enum
        source: computed
        description: Aging bucket derived from age_days by calculation storage_fee_assessment.
        default: UNDER_181
        constraints: "one of {UNDER_181, D181_270, D271_365, OVER_365}"
      - name: ltsf_exposed
        type: boolean
        source: computed
        description: True when the most recent StorageFeeAssessment of this lot carried ltsf_surcharge_cents > 0.
        default: false
      - name: storage_fee_accrued_cents
        type: integer
        source: computed
        description: Sum of StorageFeeAssessment.total_fee_cents over assessments of this lot.
        default: 0
      - name: discrepancy_opened_at
        type: datetime
        source: system
        description: Logical-clock instant at which reconciliation_status first became DISCREPANCY_OPEN; anchor of the LOST_INBOUND filing deadline. Null before.
        default: null
      - name: unfulfillable_recorded_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent unfulfillable classification; anchor of the DAMAGED_WAREHOUSE filing deadline. Null before.
        default: null
      - name: last_removal_completed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent RemovalOrder completion on this lot; anchor of the LOST_REMOVAL filing deadline. Null before.
        default: null

  - name: StorageFeeAssessment
    parent: null
    common_fields: false
    fields:
      - name: inventory_lot_id
        type: string
        source: input
        description: FK -> InventoryLot.id; lot assessed by this row.
      - name: billing_run_sequence
        type: integer
        source: system
        description: 1-based ordinal of the storage-billing run that produced this assessment.
      - name: assessed_at
        type: datetime
        source: system
        description: Logical-clock instant of the billing run, ISO 8601 UTC.
      - name: age_days_at_assessment
        type: integer
        source: computed
        description: Lot age_days evaluated at assessed_at.
      - name: aged_bucket
        type: enum
        source: computed
        description: Bucket pinned at assessment time.
        constraints: "one of {UNDER_181, D181_270, D271_365, OVER_365}"
      - name: billable_cubic_feet
        type: number
        source: computed
        description: round(billable_units * SkuListing.unit_cubic_feet, 4) where billable_units = fulfillable_units + unfulfillable_units + units_reserved_for_removal.
      - name: monthly_storage_fee_cents
        type: integer
        source: computed
        description: Base storage fee for this lot for this run, rounded to whole cents per lot.
      - name: ltsf_surcharge_cents
        type: integer
        source: computed
        description: Long-term storage surcharge for this lot for this run, rounded to whole cents per lot.
      - name: total_fee_cents
        type: integer
        source: computed
        description: monthly_storage_fee_cents + ltsf_surcharge_cents.

  - name: RemovalOrder
    parent: null
    common_fields: true
    fields:
      - name: inventory_lot_id
        type: string
        source: input
        description: FK -> InventoryLot.id; lot the units are drawn from.
      - name: removal_method
        type: enum
        source: input
        description: Disposition path for the removed units.
        constraints: "one of {DISPOSAL, RETURN_TO_SELLER, LIQUIDATION}"
      - name: unit_pool
        type: enum
        source: input
        description: Pool the units are drawn from on the owning lot.
        constraints: "one of {FULFILLABLE, UNFULFILLABLE}"
      - name: requested_units
        type: integer
        source: input
        description: Units requested for removal.
        constraints: ">= 1"
      - name: removal_window_start
        type: datetime
        source: input
        description: Removal execution window start, ISO 8601 UTC. Windows are CLOSED [start, end] and occupy the lot exclusively.
      - name: removal_window_end
        type: datetime
        source: input
        description: Removal execution window end, ISO 8601 UTC, inclusive.
        constraints: "must be strictly after removal_window_start"
      - name: status
        type: enum
        source: computed
        description: REQUESTED on creation; COMPLETED or CANCELLED thereafter; see §1.2 RemovalOrder.
        default: REQUESTED
        constraints: "one of {REQUESTED, COMPLETED, CANCELLED}"
      - name: removal_fee_cents
        type: integer
        source: computed
        description: Output of calculation removal_settlement.
        default: 0
      - name: liquidation_recovery_cents
        type: integer
        source: computed
        description: Output of calculation removal_settlement; 0 unless removal_method == LIQUIDATION.
        default: 0
      - name: net_settlement_cents
        type: integer
        source: computed
        description: liquidation_recovery_cents - removal_fee_cents.
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant of completion, ISO 8601 UTC; null before.
        default: null

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - name: inventory_lot_id
        type: string
        source: input
        description: FK -> InventoryLot.id; lot whose units are claimed.
      - name: claim_type
        type: enum
        source: input
        description: Claim category; selects the eligible-unit pool and the deadline anchor.
        constraints: "one of {LOST_INBOUND, DAMAGED_WAREHOUSE, LOST_REMOVAL}"
      - name: claimed_units
        type: integer
        source: input
        description: Units claimed.
        constraints: ">= 1"
      - name: evidence_document_count
        type: integer
        source: input
        description: Number of evidence documents attached.
        constraints: ">= 0"
      - name: evidence_reference
        type: string
        source: input
        description: Free-text external evidence reference.
        constraints: "non-empty string"
      - name: status
        type: enum
        source: computed
        description: SUBMITTED on creation; cycles through INFO_REQUESTED; terminal APPROVED or DENIED. See §1.2 ReimbursementClaim.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, INFO_REQUESTED, APPROVED, DENIED}"
      - name: resubmission_count
        type: integer
        source: computed
        description: Number of successful resubmissions; hard cap 2.
        default: 0
      - name: filing_deadline_at
        type: datetime
        source: computed
        description: Anchor + 60 days, pinned at claim creation from the lot anchor selected by claim_type.
      - name: eligible_units
        type: integer
        source: computed
        description: Output of calculation reimbursement_settlement, evaluated at decision time.
        default: 0
      - name: approved_units
        type: integer
        source: computed
        description: eligible_units when the decision is APPROVED, 0 when DENIED.
        default: 0
      - name: reimbursement_amount_cents
        type: integer
        source: computed
        description: Output of calculation reimbursement_settlement; 0 until the claim is APPROVED.
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decision, ISO 8601 UTC; null before.
        default: null

  - name: VelocityForecast
    parent: null
    common_fields: false
    fields:
      - name: sku_listing_id
        type: string
        source: input
        description: FK -> SkuListing.id; listing being forecast.
      - name: forecast_variant
        type: enum
        source: input
        description: Which variant of calculation velocity_forecast to apply.
        constraints: "one of {TRAILING_30, SEASONAL_WEIGHTED}"
      - name: trailing_30_units_sold
        type: integer
        source: input
        description: Units sold in the trailing 30 days.
        constraints: ">= 0"
      - name: prior_year_same_period_units_sold
        type: integer
        source: input
        description: Units sold in the same 30-day period one year earlier.
        constraints: ">= 0"
      - name: seasonal_index
        type: number
        source: input
        description: Seasonal multiplier applied to the prior-year term.
        constraints: ">= 0, 2 decimal places"
      - name: coverage_target_days
        type: integer
        source: input
        description: Days of forward cover the seller wants on hand.
        constraints: ">= 0"
      - name: lead_time_days
        type: integer
        source: input
        description: Inbound lead time in days.
        constraints: ">= 0"
      - name: daily_velocity
        type: number
        source: computed
        description: Units per day produced by calculation velocity_forecast; 4 decimal places.
      - name: target_units
        type: integer
        source: computed
        description: ceil(daily_velocity * (coverage_target_days + lead_time_days)).
      - name: in_flight_units
        type: integer
        source: computed
        description: "Sum of ShipmentLineItem.units for this listing over plans whose status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}."
      - name: quota_headroom_units
        type: integer
        source: computed
        description: RestockQuota.restock_limit_units - RestockQuota.utilized_units of the seller's quota whose status == ACTIVE; 0 when no ACTIVE quota exists.
      - name: recommended_replenishment_units
        type: integer
        source: computed
        description: Output of calculation velocity_forecast after the quota cap is applied.
      - name: stranded_risk_flag
        type: boolean
        source: computed
        description: True when SkuListing.unfulfillable_units > 0, or when daily_velocity == 0.0000 and SkuListing.fulfillable_units > 0.

  - name: MultiChannelOrder
    parent: null
    common_fields: true
    fields:
      - name: sku_listing_id
        type: string
        source: input
        description: FK -> SkuListing.id; listing being shipped.
      - name: units
        type: integer
        source: input
        description: Units ordered.
        constraints: ">= 1"
      - name: billable_weight_lb
        type: number
        source: input
        description: Billable weight of one unit in pounds.
        constraints: "> 0, 2 decimal places"
      - name: destination_zone
        type: enum
        source: input
        description: Destination zone selecting the base fee.
        constraints: "one of {ZONE_1, ZONE_2, ZONE_3}"
      - name: fulfillment_channel
        type: enum
        source: input
        description: MCF draws units from marketplace inventory; SELF_FULFILLED does not touch inventory and only records the comparison.
        constraints: "one of {MCF, SELF_FULFILLED}"
      - name: self_fulfilled_cost_cents
        type: integer
        source: input
        description: Seller's own quoted fulfillment cost for the same order, used for the fee comparison.
        constraints: ">= 0"
      - name: is_peak_period
        type: boolean
        source: computed
        description: True when the logical clock month at creation is one of {10, 11, 12}.
      - name: mcf_fee_cents
        type: integer
        source: computed
        description: Output of calculation mcf_fee_quote.
      - name: fee_advantage_cents
        type: integer
        source: computed
        description: self_fulfilled_cost_cents - mcf_fee_cents.
      - name: recommended_channel
        type: enum
        source: computed
        description: MCF when fee_advantage_cents >= 0, SELF_FULFILLED otherwise; an exact tie (fee_advantage_cents == 0) resolves to MCF.
        constraints: "one of {MCF, SELF_FULFILLED}"
      - name: order_status
        type: enum
        source: computed
        description: MCF_SHIPPED when fulfillment_channel == MCF and lot consumption succeeded; SELF_SHIPPED when fulfillment_channel == SELF_FULFILLED.
        constraints: "one of {MCF_SHIPPED, SELF_SHIPPED}"
      - name: consumed_lot_allocations
        type: array
        source: computed
        description: "Ordered array of objects { inventory_lot_id, units } recording the FIFO draw; empty array when order_status == SELF_SHIPPED."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InboundShipmentPlan
    initial_state: DRAFT
    terminal_states: [CANCELLED, CLOSED]
    shape: "branching fork at receipt (RECEIVED_COMPLETE vs PARTIALLY_RECEIVED with divergent side-effect sets) plus a CONFIRMED -> DRAFT revert cycle"
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /fulfillment/inbound-shipment-plans/{id}/confirm"
        actor: SellerOperator
        preconditions:
          - "plan.status == DRAFT"
          - "count of ShipmentLineItem rows with shipment_plan_id == plan.id is >= 1"
          - "FulfillmentCenter.receiving_status of plan.destination_fc_id IN {OPEN, THROTTLED}"
          - "a RestockQuota of plan.seller_account_id exists with status == ACTIVE"
          - "every line item passes prep, label and case-pack validation (§1.4 priorities 10, 11, 14)"
          - "overlap aggregate check on the destination FC passes (§1.4 priority 18)"
          - "calculation restock_allocation variant FINAL yields final_allocated_units == declared_units"
        side_effects:
          - "sets plan.final_allocated_units and each ShipmentLineItem.final_allocated_units from calculation restock_allocation variant FINAL"
          - "sets plan.allocated_units = plan.final_allocated_units"
          - "sets plan.prep_compliance_status = COMPLIANT and plan.confirmed_at = logical clock now"
          - "increments SellerAccount.restock_reserved_units by plan.allocated_units (keeps INV-1)"
          - "increments RestockQuota.utilized_units by plan.allocated_units"
          - "increments FulfillmentCenter.committed_receiving_units by plan.declared_units (keeps INV-3)"
          - "refreshes calculation restock_allocation variant PROVISIONAL for every other plan of this seller whose status == DRAFT, which may flip their allocation_status to OVER_LIMIT"
      - from: CONFIRMED
        to: DRAFT
        trigger: "POST /fulfillment/inbound-shipment-plans/{id}/revert-to-draft"
        actor: SellerOperator
        preconditions:
          - "plan.status == CONFIRMED"
        side_effects:
          - "decrements SellerAccount.restock_reserved_units by plan.allocated_units (compensating action of the confirm; restores INV-1)"
          - "decrements RestockQuota.utilized_units by plan.allocated_units"
          - "decrements FulfillmentCenter.committed_receiving_units by plan.declared_units (restores INV-3)"
          - "sets plan.allocated_units = 0, plan.final_allocated_units = 0, every ShipmentLineItem.final_allocated_units = 0"
          - "sets plan.prep_compliance_status = PENDING and plan.confirmed_at = null"
          - "recomputes calculation restock_allocation variant PROVISIONAL for this plan"
        note: "Revert cycle; the plan may be edited and confirmed again."
      - from: CONFIRMED
        to: IN_TRANSIT
        trigger: "POST /fulfillment/inbound-shipment-plans/{id}/ship"
        actor: SellerOperator
        preconditions:
          - "plan.status == CONFIRMED"
        side_effects:
          - "no ledger movement; the plan stays inside the reserving set {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}"
      - from: IN_TRANSIT
        to: RECEIVED_COMPLETE
        trigger: "POST /fulfillment/inbound-shipment-plans/{id}/receive with cumulative received_units == plan.declared_units"
        actor: FcOperator
        preconditions:
          - "plan.status IN {IN_TRANSIT, PARTIALLY_RECEIVED}"
          - "acting FcOperator's X-User-ID == plan.destination_fc_id"
          - "every received_lines[].shipment_line_item_id belongs to this plan"
        side_effects:
          - "for each received line, selects or creates the InventoryLot for (line.sku_listing_id, plan.destination_fc_id) per calculation lot_selection and adds received_units to lot.fulfillable_units, unfulfillable_units to lot.unfulfillable_units and both to lot.units_received_total"
          - "sets plan.received_units, each ShipmentLineItem.received_units, plan.missing_units = 0 and each ShipmentLineItem.shortfall_units = 0"
          - "decrements SellerAccount.restock_reserved_units by plan.allocated_units and FulfillmentCenter.committed_receiving_units by plan.declared_units, then sets plan.allocated_units = 0 (plan leaves the reserving set; keeps INV-1 and INV-3)"
          - "recomputes calculation listing_health_recompute for every touched SkuListing"
          - "recomputes calculation storage_utilization_ratio for the seller"
        note: "Branch A of the receipt fork: no discrepancy is opened and no suppression cascade fires."
      - from: IN_TRANSIT
        to: PARTIALLY_RECEIVED
        trigger: "POST /fulfillment/inbound-shipment-plans/{id}/receive with cumulative received_units < plan.declared_units"
        actor: FcOperator
        preconditions:
          - "plan.status IN {IN_TRANSIT, PARTIALLY_RECEIVED}"
          - "acting FcOperator's X-User-ID == plan.destination_fc_id"
          - "every received_lines[].shipment_line_item_id belongs to this plan"
        side_effects:
          - "CASCADE-A link 1: for each received line, selects or creates the InventoryLot for (line.sku_listing_id, plan.destination_fc_id) per calculation lot_selection, adds received_units to lot.fulfillable_units and unfulfillable_units to lot.unfulfillable_units, and sets plan.missing_units = declared_units - received_units with each ShipmentLineItem.shortfall_units = units - received_units"
          - "CASCADE-A link 2 (caused by link 1): every lot that absorbed a short line gets missing_units += that line's shortfall_units, reconciliation_status = DISCREPANCY_OPEN and discrepancy_opened_at = logical clock now; SellerAccount.open_discrepancy_units increases by the total shortfall"
          - "CASCADE-A link 3 (caused by link 2): calculation listing_health_recompute runs for each affected SkuListing and may set listing_status = SUPPRESSED with suppression_reason = MISSING_INVENTORY and inventory_health = OUT_OF_STOCK or STRANDED, updating SellerAccount.suppressed_listing_count"
          - "CASCADE-A link 4 (caused by link 2's change to SellerAccount.open_discrepancy_units): calculation iprs_and_restock_limit re-runs on the seller's RestockQuota whose status == ACTIVE, which may lower iprs_score, base_capacity_tier, capacity_tier and restock_limit_units"
          - "plan stays inside the reserving set; SellerAccount.restock_reserved_units and FulfillmentCenter.committed_receiving_units are unchanged"
        note: "Branch B of the receipt fork: divergent side-effect set (discrepancy + suppression + quota re-scoring)."
      - from: PARTIALLY_RECEIVED
        to: RECEIVED_COMPLETE
        trigger: "POST /fulfillment/inbound-shipment-plans/{id}/receive that brings cumulative received_units up to plan.declared_units"
        actor: FcOperator
        preconditions:
          - "plan.status == PARTIALLY_RECEIVED"
          - "acting FcOperator's X-User-ID == plan.destination_fc_id"
        side_effects:
          - "same lot credits as the IN_TRANSIT -> RECEIVED_COMPLETE transition"
          - "clears the shortfall: every lot that carried missing_units from this plan has missing_units reduced by the newly received units, and reconciliation_status returns to RECONCILED when its missing_units reaches 0"
          - "decrements SellerAccount.open_discrepancy_units by the cleared shortfall, then re-runs calculation iprs_and_restock_limit and calculation listing_health_recompute"
          - "decrements SellerAccount.restock_reserved_units by plan.allocated_units and FulfillmentCenter.committed_receiving_units by plan.declared_units, then sets plan.allocated_units = 0"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fulfillment/inbound-shipment-plans/{id}/cancel"
        actor: SellerOperator
        preconditions:
          - "plan.status == DRAFT"
        side_effects:
          - "sets plan.provisional_allocated_units = 0 and every ShipmentLineItem.provisional_allocated_units = 0"
          - "refreshes calculation restock_allocation variant PROVISIONAL for every other plan of this seller whose status == DRAFT"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /fulfillment/inbound-shipment-plans/{id}/cancel"
        actor: SellerOperator
        preconditions:
          - "plan.status == CONFIRMED"
        side_effects:
          - "decrements SellerAccount.restock_reserved_units by plan.allocated_units (compensating action; restores INV-1 exactly)"
          - "decrements RestockQuota.utilized_units by plan.allocated_units"
          - "decrements FulfillmentCenter.committed_receiving_units by plan.declared_units (restores INV-3 exactly)"
          - "sets plan.allocated_units = 0, plan.final_allocated_units = 0, plan.provisional_allocated_units = 0"
          - "refreshes calculation restock_allocation variant PROVISIONAL for every other plan of this seller whose status == DRAFT"
      - from: RECEIVED_COMPLETE
        to: CLOSED
        trigger: "system sweep inside POST /fulfillment/storage-billing-runs"
        actor: system
        preconditions:
          - "plan.status == RECEIVED_COMPLETE"
          - "logical clock now >= plan.appointment_window_end + 30 days"
        side_effects:
          - "no ledger movement (the plan already left the reserving set at receipt)"
      - from: PARTIALLY_RECEIVED
        to: CLOSED
        trigger: "system sweep inside POST /fulfillment/storage-billing-runs"
        actor: system
        preconditions:
          - "plan.status == PARTIALLY_RECEIVED"
          - "logical clock now >= plan.appointment_window_end + 30 days"
        side_effects:
          - "decrements SellerAccount.restock_reserved_units by plan.allocated_units and FulfillmentCenter.committed_receiving_units by plan.declared_units, then sets plan.allocated_units = 0 (plan leaves the reserving set; keeps INV-1 and INV-3)"
          - "leaves lot.missing_units and lot.reconciliation_status untouched — an unclaimed shortfall stays open"

  - entity: SkuListing
    initial_state: "listing_status = ACTIVE, inventory_health = OUT_OF_STOCK"
    terminal_states: []
    shape: "parallel dimensions listing_status x inventory_health on the same row, with an ACTIVE -> SUPPRESSED -> ACTIVE cycle on the first dimension"
    transitions:
      - from: "listing_status = ACTIVE"
        to: "listing_status = SUPPRESSED"
        trigger: "calculation listing_health_recompute inside any of: POST .../receive, POST .../unfulfillable-classification, POST /fulfillment/multi-channel-orders, POST /fulfillment/removal-orders/{id}/complete, POST /fulfillment/reimbursement-claims/{id}/decide"
        actor: system
        preconditions:
          - "listing.fulfillable_units == 0 after the recompute"
          - "listing.lot_ever_created == true"
        side_effects:
          - "sets suppression_reason by pinned priority: MISSING_INVENTORY when listing.missing_units > 0, else STRANDED_INVENTORY when listing.unfulfillable_units > 0, else ZERO_FULFILLABLE"
          - "increments SellerAccount.suppressed_listing_count by 1"
      - from: "listing_status = SUPPRESSED"
        to: "listing_status = ACTIVE"
        trigger: "POST /fulfillment/sku-listings/{id}/reinstate"
        actor: SellerOperator
        preconditions:
          - "listing.listing_status == SUPPRESSED"
          - "listing.fulfillable_units >= 1"
        side_effects:
          - "sets suppression_reason = NONE"
          - "decrements SellerAccount.suppressed_listing_count by 1"
        note: "Closes the suppression cycle; no automatic un-suppression exists."
      - from: "inventory_health = OUT_OF_STOCK"
        to: "inventory_health = HEALTHY"
        trigger: "calculation listing_health_recompute"
        actor: system
        preconditions:
          - "listing.fulfillable_units >= 1 and listing.unfulfillable_units == 0 and listing.aged_over_365_units == 0"
        side_effects:
          - "listing_status is left untouched — the two dimensions move independently, so a SUPPRESSED listing can be HEALTHY until it is reinstated"
      - from: "inventory_health = HEALTHY"
        to: "inventory_health = EXCESS_AGED"
        trigger: "calculation listing_health_recompute inside POST /fulfillment/storage-billing-runs"
        actor: system
        preconditions:
          - "listing.fulfillable_units >= 1"
          - "listing.aged_over_365_units >= 1"
        side_effects:
          - "no change to listing_status"
      - from: "inventory_health IN {HEALTHY, EXCESS_AGED, OUT_OF_STOCK}"
        to: "inventory_health = STRANDED"
        trigger: "calculation listing_health_recompute"
        actor: system
        preconditions:
          - "listing.fulfillable_units == 0 and listing.unfulfillable_units >= 1"
        side_effects:
          - "no change to listing_status"
      - from: "inventory_health IN {HEALTHY, EXCESS_AGED, STRANDED}"
        to: "inventory_health = OUT_OF_STOCK"
        trigger: "calculation listing_health_recompute"
        actor: system
        preconditions:
          - "listing.fulfillable_units == 0 and listing.unfulfillable_units == 0"
        side_effects:
          - "no change to listing_status"

  - entity: InventoryLot
    initial_state: "lot_status = ACTIVE, reconciliation_status = RECONCILED"
    terminal_states: []
    shape: "parallel dimensions lot_status x reconciliation_status on the same row"
    transitions:
      - from: "lot_status = ACTIVE"
        to: "lot_status = PARTIALLY_REMOVED"
        trigger: "POST /fulfillment/removal-orders/{id}/complete"
        actor: FcOperator
        preconditions:
          - "lot.units_removed >= 1 after the completion"
          - "lot.fulfillable_units + lot.unfulfillable_units + lot.units_reserved_for_removal >= 1 after the completion"
        side_effects:
          - "sets lot.last_removal_completed_at = logical clock now"
      - from: "lot_status IN {ACTIVE, PARTIALLY_REMOVED}"
        to: "lot_status = DEPLETED"
        trigger: "POST /fulfillment/removal-orders/{id}/complete or POST /fulfillment/multi-channel-orders"
        actor: system
        preconditions:
          - "lot.units_received_total >= 1"
          - "lot.fulfillable_units == 0 and lot.unfulfillable_units == 0 and lot.units_reserved_for_removal == 0"
        side_effects:
          - "the lot leaves every storage-fee base: subsequent billing runs skip it and it no longer contributes to SkuListing.fulfillable_units or storage_utilization_ratio"
          - "triggers calculation listing_health_recompute for lot.sku_listing_id"
      - from: "reconciliation_status = RECONCILED"
        to: "reconciliation_status = DISCREPANCY_OPEN"
        trigger: "POST /fulfillment/inbound-shipment-plans/{id}/receive that lands the plan in PARTIALLY_RECEIVED"
        actor: system
        preconditions:
          - "the lot absorbed a line whose received_units < units"
        side_effects:
          - "sets lot.missing_units and lot.discrepancy_opened_at; increases SellerAccount.open_discrepancy_units"
      - from: "reconciliation_status = DISCREPANCY_OPEN"
        to: "reconciliation_status = DISCREPANCY_CLAIMED"
        trigger: "POST /fulfillment/reimbursement-claims"
        actor: SellerOperator
        preconditions:
          - "lot.reconciliation_status == DISCREPANCY_OPEN"
          - "claim_type == LOST_INBOUND"
        side_effects:
          - "no unit movement; the lot is locked against a second LOST_INBOUND claim (§1.4 priority 9)"
      - from: "reconciliation_status = DISCREPANCY_CLAIMED"
        to: "reconciliation_status = DISCREPANCY_RESOLVED"
        trigger: "POST /fulfillment/reimbursement-claims/{id}/decide with decision == APPROVED"
        actor: ClaimsAdjudicator
        preconditions:
          - "lot.missing_units - claim.approved_units == 0"
        side_effects:
          - "decrements lot.missing_units by claim.approved_units and SellerAccount.open_discrepancy_units by the same amount"
      - from: "reconciliation_status = DISCREPANCY_CLAIMED"
        to: "reconciliation_status = DISCREPANCY_OPEN"
        trigger: "POST /fulfillment/reimbursement-claims/{id}/decide with decision == DENIED"
        actor: ClaimsAdjudicator
        preconditions:
          - "lot.reconciliation_status == DISCREPANCY_CLAIMED"
        side_effects:
          - "no unit movement; the lot becomes claimable again so a fresh LOST_INBOUND claim may be filed before filing_deadline_at"
        note: "Cycle on the reconciliation dimension: OPEN -> CLAIMED -> OPEN."

  - entity: RestockQuota
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, EXPIRED]
    shape: linear with two exits
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /fulfillment/sellers/{id}/restock-quotas"
        actor: MarketplaceAdmin
        preconditions:
          - "a RestockQuota of this seller with status == ACTIVE exists"
        side_effects:
          - "the superseded row keeps its utilized_units; the new row starts with utilized_units = sum of allocated_units over the seller's plans whose status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep inside POST /fulfillment/storage-billing-runs"
        actor: system
        preconditions:
          - "logical clock now >= quota.period_end"
        side_effects:
          - "no ledger movement; plan confirmation is blocked with ERR_NO_ACTIVE_RESTOCK_QUOTA until a new quota is opened"

  - entity: RemovalOrder
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    shape: "branching with divergent side-effect sets per branch"
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /fulfillment/removal-orders/{id}/complete"
        actor: FcOperator
        preconditions:
          - "removal.status == REQUESTED"
          - "acting FcOperator's X-User-ID == InventoryLot.fulfillment_center_id of removal.inventory_lot_id"
          - "logical clock now >= removal.removal_window_start"
        side_effects:
          - "moves the reservation into retirement: lot.units_reserved_for_removal -= requested_units and lot.units_removed += requested_units (INV-2 total unchanged)"
          - "sets lot.lot_status per the InventoryLot machine and lot.last_removal_completed_at = logical clock now"
          - "runs calculation removal_settlement, writing removal_fee_cents, liquidation_recovery_cents and net_settlement_cents"
          - "runs calculation listing_health_recompute and calculation storage_utilization_ratio"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /fulfillment/removal-orders/{id}/cancel"
        actor: SellerOperator
        preconditions:
          - "removal.status == REQUESTED"
        side_effects:
          - "returns the reservation to its source pool: lot.units_reserved_for_removal -= requested_units and lot.fulfillable_units += requested_units when unit_pool == FULFILLABLE, otherwise lot.unfulfillable_units += requested_units (compensating action; INV-2 total unchanged and the pool split is restored exactly)"
          - "leaves removal_fee_cents, liquidation_recovery_cents and net_settlement_cents at 0"
          - "runs calculation listing_health_recompute and calculation storage_utilization_ratio"

  - entity: ReimbursementClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    shape: "cyclic SUBMITTED -> INFO_REQUESTED -> SUBMITTED, bounded at 2 resubmissions, with a terminal branch"
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /fulfillment/reimbursement-claims/{id}/request-info"
        actor: ClaimsAdjudicator
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "no ledger movement"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /fulfillment/reimbursement-claims/{id}/resubmit"
        actor: SellerOperator
        preconditions:
          - "claim.status == INFO_REQUESTED"
          - "claim.resubmission_count < 2"
          - "logical clock now <= claim.filing_deadline_at"
        side_effects:
          - "increments claim.resubmission_count by 1 and overwrites evidence_document_count and evidence_reference"
        note: "Cycle back; the third resubmission attempt is rejected with ERR_RESUBMISSION_LIMIT_REACHED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fulfillment/reimbursement-claims/{id}/decide with decision == APPROVED"
        actor: ClaimsAdjudicator
        preconditions:
          - "claim.status == SUBMITTED"
          - "calculation reimbursement_settlement yields eligible_units >= 1"
        side_effects:
          - "CASCADE-D link 1: sets claim.eligible_units, claim.approved_units, claim.reimbursement_amount_cents and claim.decided_at, then increments SellerAccount.reimbursement_credit_cents by reimbursement_amount_cents"
          - "CASCADE-D link 2 (caused by link 1): decrements the lot's claimed pool — lot.missing_units -= approved_units for LOST_INBOUND, lot.unfulfillable_units -= approved_units for DAMAGED_WAREHOUSE, lot.units_removed -= approved_units for LOST_REMOVAL — and moves reconciliation_status to DISCREPANCY_RESOLVED when lot.missing_units reaches 0; SellerAccount.open_discrepancy_units drops by the same amount"
          - "CASCADE-D link 3 (caused by link 2): calculation listing_health_recompute re-derives the listing's fulfillable_units, unfulfillable_units, missing_units, inventory_health and suppression_reason"
          - "CASCADE-D link 4 (caused by link 2's change to SellerAccount.open_discrepancy_units): calculation iprs_and_restock_limit re-runs on the RestockQuota whose status == ACTIVE, refreshing iprs_score, capacity_tier and restock_limit_units"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /fulfillment/reimbursement-claims/{id}/decide with decision == DENIED"
        actor: ClaimsAdjudicator
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "sets claim.approved_units = 0, claim.reimbursement_amount_cents = 0 and claim.decided_at"
          - "moves lot.reconciliation_status from DISCREPANCY_CLAIMED back to DISCREPANCY_OPEN when claim_type == LOST_INBOUND"
          - "leaves SellerAccount.reimbursement_credit_cents and every lot pool unchanged"
        note: "Divergent branch: no money, no unit movement, and the discrepancy stays open."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-seller
    parent_entity: SellerAccount
    write_endpoint: "POST /fulfillment/inbound-shipment-plans"
    occ_field: "expected_seller_account_version"
    description: |
      Creating an InboundShipmentPlan against a SellerAccount whose version has
      advanced since the client last observed it is rejected. Plan creation
      re-derives the seller's DRAFT provisional pool, so a client whose view of
      the seller is stale would size its provisional allocation against a pool
      that another plan has already claimed.
    error_id: ERR_STALE_SELLER_VERSION
    http_status: 412
  - rule_id: removal-create-stale-lot
    parent_entity: InventoryLot
    write_endpoint: "POST /fulfillment/removal-orders"
    occ_field: "expected_inventory_lot_version"
    description: |
      Creating a RemovalOrder against an InventoryLot whose version has advanced
      since the client last observed it is rejected. A new removal request may
      legitimately supersede the pool split the client saw, so the request must
      carry the lot version it was sized against.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: restock_allocation
    trigger: "PROVISIONAL on POST /fulfillment/inbound-shipment-plans and POST /fulfillment/inbound-shipment-plans/{id}/line-items (writes plan.provisional_allocated_units, ShipmentLineItem.provisional_allocated_units, plan.allocation_status); FINAL on POST /fulfillment/inbound-shipment-plans/{id}/confirm (writes plan.final_allocated_units, ShipmentLineItem.final_allocated_units, plan.allocated_units)"
    algorithm: waterfall_allocation
    formula: |
      quota := the RestockQuota of plan.seller_account_id whose status == ACTIVE
               (at most one exists; when none exists PROVISIONAL yields 0 for
               every line and FINAL is never reached because §1.4 priority 9
               rejects the confirm with ERR_NO_ACTIVE_RESTOCK_QUOTA)

      committed_non_draft := sum(p.allocated_units) over plans p where
          p.seller_account_id == plan.seller_account_id
          AND p.id != plan.id
          AND p.status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}

      other_draft_provisional := sum(p.provisional_allocated_units) over plans p where
          p.seller_account_id == plan.seller_account_id
          AND p.id != plan.id
          AND p.status == DRAFT
        # read as currently persisted; sibling DRAFT plans are NOT recursively
        # recomputed while evaluating this plan (pinned evaluation order that
        # makes the mutual dependency well-defined)

      pool_provisional := max(0, quota.restock_limit_units - committed_non_draft - other_draft_provisional)
      pool_final       := max(0, quota.restock_limit_units - committed_non_draft)

      # waterfall over THIS plan's line items, ordered by created_at ASC
      # (tie-break: none required — created_at is unique per line item within a plan
      #  because each line item is created by its own request)
      allocate(pool):
        remaining := pool
        for line in line_items ordered by created_at ASC:
          grant := min(line.units, remaining)
          line.grant := grant
          remaining := remaining - grant
        return sum(line.grant)

      PROVISIONAL: plan.provisional_allocated_units := allocate(pool_provisional)
                   plan.allocation_status := WITHIN_LIMIT if plan.provisional_allocated_units == plan.declared_units else OVER_LIMIT
      FINAL:       plan.final_allocated_units := allocate(pool_final)
                   reject the confirm with ERR_RESTOCK_LIMIT_EXCEEDED when
                   plan.final_allocated_units < plan.declared_units
                   (equality is accepted — the boundary is `<`, not `<=`)
    input_set: "PROVISIONAL charges the pool for sibling plans in status DRAFT as well as {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}; FINAL charges the pool only for {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED} and ignores every DRAFT sibling. Plans in {CANCELLED, RECEIVED_COMPLETE, CLOSED} are excluded from both."
    constants: {}
    precision: "integer units, no rounding"
    variants:
      - name: PROVISIONAL
        when: "plan creation and line-item creation, while the plan is in DRAFT"
        difference: "Forward-looking and pessimistic: sibling DRAFT plans' provisional reservations are subtracted from the pool, so the same data can yield a smaller grant than FINAL and flip allocation_status to OVER_LIMIT."
      - name: FINAL
        when: "confirm"
        difference: "Chronological over committed plans only: sibling DRAFT plans are ignored, so the pool is larger and the grant can equal declared_units where PROVISIONAL fell short."

  - name: iprs_and_restock_limit
    trigger: "POST /fulfillment/sellers/{id}/restock-quotas; re-run whenever SellerAccount.open_discrepancy_units changes (plan receive with a shortfall, receipt completion, claim decision) and inside POST /fulfillment/storage-billing-runs when a utilization downgrade is applied"
    algorithm: weighted_scoring
    formula: |
      raw := 1000 * ( 0.40 * min(1.0, quota.sell_through_rate / 2.5)
                    + 0.25 * (1 - min(1.0, quota.excess_units_ratio / 0.30))
                    + 0.20 * (1 - min(1.0, quota.stranded_ratio / 0.10))
                    + 0.15 * quota.in_stock_rate )
      score := round_half_up(raw)                       # integer
      penalty := (75 if quota.stranded_ratio > 0.05 else 0)
               + (50 if seller.open_discrepancy_units > 500 else 0)
      quota.iprs_score := max(0, score - penalty)

      quota.base_capacity_tier := TIER_ELEVATED   if quota.iprs_score >= 800
                                  TIER_STANDARD   if 500 <= quota.iprs_score < 800
                                  TIER_RESTRICTED otherwise
      quota.capacity_tier := shift_down(quota.base_capacity_tier, quota.capacity_tier_downgrade_steps)
        # shift_down applies one step per unit: TIER_ELEVATED -> TIER_STANDARD -> TIER_RESTRICTED,
        # and TIER_RESTRICTED is the floor
      multiplier := 3.0 if quota.capacity_tier == TIER_ELEVATED
                    1.5 if quota.capacity_tier == TIER_STANDARD
                    0.5 if quota.capacity_tier == TIER_RESTRICTED
      quota.restock_limit_units := floor(quota.base_capacity_units * multiplier)

      seller.seller_status := SUSPENDED if quota.iprs_score < 200 else ACTIVE
    input_set: "Evaluated against the single RestockQuota of the seller whose status == ACTIVE. Quotas with status IN {SUPERSEDED, EXPIRED} are never re-scored."
    constants:
      SELL_THROUGH_TARGET: 2.5
      EXCESS_RATIO_TARGET: 0.30
      STRANDED_RATIO_TARGET: 0.10
      WEIGHT_SELL_THROUGH: 0.40
      WEIGHT_EXCESS: 0.25
      WEIGHT_STRANDED: 0.20
      WEIGHT_IN_STOCK: 0.15
      STRANDED_PENALTY_POINTS: 75
      STRANDED_PENALTY_THRESHOLD: 0.05
      DISCREPANCY_PENALTY_POINTS: 50
      DISCREPANCY_PENALTY_THRESHOLD_UNITS: 500
      TIER_ELEVATED_MULTIPLIER: 3.0
      TIER_STANDARD_MULTIPLIER: 1.5
      TIER_RESTRICTED_MULTIPLIER: 0.5
      SUSPEND_SCORE_FLOOR: 200
    precision: "iprs_score is an integer via round_half_up on the 0..1000 scale; restock_limit_units uses floor"
    variants: []

  - name: storage_fee_assessment
    trigger: "POST /fulfillment/storage-billing-runs — one StorageFeeAssessment row per eligible lot, then the per-lot totals are summed into InventoryLot.storage_fee_accrued_cents and SellerAccount.storage_fee_accrued_cents"
    algorithm: tiered_pricing
    formula: |
      # eligible lots: lot_status IN {ACTIVE, PARTIALLY_REMOVED}; DEPLETED lots are skipped
      for each eligible lot, in order of lot.first_received_at ASC then lot.created_at ASC:
        age_days := floor((clock_now - lot.first_received_at) / 86400 seconds)
        aged_bucket := OVER_365  if age_days >= 365
                       D271_365  if age_days >= 271
                       D181_270  if age_days >= 181
                       UNDER_181 otherwise
        billable_units := lot.fulfillable_units + lot.unfulfillable_units + lot.units_reserved_for_removal
        billable_cubic_feet := round(billable_units * listing.unit_cubic_feet, 4)
        monthly_storage_fee_cents := round_half_up(billable_cubic_feet * fc.monthly_storage_rate_cents_per_cubic_foot)
        ltsf_steps := 2 if aged_bucket == OVER_365
                      1 if aged_bucket == D271_365
                      0 otherwise
        ltsf_surcharge_cents := round_half_up(billable_cubic_feet * fc.ltsf_rate_cents_per_cubic_foot * ltsf_steps)
        total_fee_cents := monthly_storage_fee_cents + ltsf_surcharge_cents      # integer cents
      seller.storage_fee_accrued_cents += sum(total_fee_cents over the lots of this seller's listings)
    input_set: "Lots whose lot_status IN {ACTIVE, PARTIALLY_REMOVED}. Lots whose lot_status == DEPLETED are excluded entirely and receive no assessment row."
    constants:
      LTSF_BUCKET_271_DAYS: 271
      LTSF_BUCKET_365_DAYS: 365
      AGED_BUCKET_181_DAYS: 181
      SECONDS_PER_DAY: 86400
    precision: |
      ROUNDING ORDER IS PINNED: round each lot's monthly_storage_fee_cents and
      ltsf_surcharge_cents to whole cents FIRST (round_half_up), then add them
      per lot, then sum the per-lot integers into the seller total. Summing the
      raw cubic-feet across lots and rounding once at the end is a DIFFERENT and
      FORBIDDEN result — with two lots of 0.5831 and 0.9163 cubic feet at 87
      cents/cubic-foot, per-lot rounding gives 51 + 80 = 131 cents while
      sum-then-round gives round_half_up(1.4994 * 87) = 130 cents.
    variants: []

  - name: velocity_forecast
    trigger: "POST /fulfillment/sku-listings/{id}/velocity-forecasts — writes the VelocityForecast row and copies recommended_replenishment_units onto SkuListing"
    algorithm: forward_looking
    formula: |
      TRAILING_30:        daily_velocity := round(trailing_30_units_sold / 30, 4)
      SEASONAL_WEIGHTED:  daily_velocity := round(( 0.60 * trailing_30_units_sold
                                                  + 0.40 * prior_year_same_period_units_sold * seasonal_index ) / 30, 4)

      target_units := ceil(daily_velocity * (coverage_target_days + lead_time_days))
      in_flight_units := sum(li.units) over ShipmentLineItem li where
          li.sku_listing_id == listing.id
          AND li's plan.status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}
      quota_headroom_units := max(0, quota.restock_limit_units - quota.utilized_units)
          for the seller's RestockQuota whose status == ACTIVE; 0 when none exists
      raw_need := max(0, target_units - listing.fulfillable_units - in_flight_units)
      recommended_replenishment_units := min(raw_need, quota_headroom_units)
      stranded_risk_flag := (listing.unfulfillable_units > 0)
                            OR (daily_velocity == 0.0000 AND listing.fulfillable_units > 0)
    input_set: "in_flight_units counts line items of plans whose status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}; plans in {DRAFT, CANCELLED, RECEIVED_COMPLETE, CLOSED} are excluded. fulfillable_units is read from the listing's own derived field."
    constants:
      TRAILING_WINDOW_DAYS: 30
      SEASONAL_TRAILING_WEIGHT: 0.60
      SEASONAL_PRIOR_YEAR_WEIGHT: 0.40
    precision: "daily_velocity rounded to 4 decimal places (round_half_up); target_units uses ceil; unit outputs are integers"
    variants:
      - name: TRAILING_30
        when: "forecast_variant == TRAILING_30"
        difference: "Uses only the trailing 30-day sales figure; the prior-year term and seasonal_index are ignored even when supplied."
      - name: SEASONAL_WEIGHTED
        when: "forecast_variant == SEASONAL_WEIGHTED"
        difference: "Blends 60% trailing with 40% of the seasonally-indexed prior-year figure, so identical inputs yield a different daily_velocity, a different target_units and a different recommended_replenishment_units."

  - name: mcf_fee_quote
    trigger: "POST /fulfillment/multi-channel-orders — writes mcf_fee_cents, fee_advantage_cents and recommended_channel for both fulfillment_channel values"
    algorithm: tiered_pricing
    formula: |
      base_fee_cents := ZONE_BASE_CENTS[destination_zone]
      per_unit_fee_cents := base_fee_cents + round_half_up(max(0.0, billable_weight_lb - 1.00) * WEIGHT_CENTS_PER_LB)
      gross_fee_cents := per_unit_fee_cents * units
      is_peak_period := month(clock_now) IN {10, 11, 12}
      peak_surcharge_cents := round_half_up(gross_fee_cents * 0.08) if is_peak_period else 0
      pre_discount_total_cents := gross_fee_cents + peak_surcharge_cents

      # EVALUATION ORDER IS PINNED: the volume-discount tier is keyed on
      # pre_discount_total_cents, NEVER on the post-discount figure. Keying the
      # tier on the discounted total is circular and drops a tier at the
      # boundaries, which is a FORBIDDEN reading of this rule.
      volume_discount_pct := 0.10 if pre_discount_total_cents >= 100000
                             0.06 if pre_discount_total_cents >= 50000
                             0.03 if pre_discount_total_cents >= 20000
                             0.00 otherwise
      discount_cents := round_half_up(pre_discount_total_cents * volume_discount_pct)
      mcf_fee_cents := pre_discount_total_cents - discount_cents

      fee_advantage_cents := self_fulfilled_cost_cents - mcf_fee_cents
      recommended_channel := MCF if fee_advantage_cents >= 0 else SELF_FULFILLED
    input_set: "Single order; no aggregation across orders. Peak detection reads the logical clock at creation time."
    constants:
      ZONE_BASE_CENTS: { ZONE_1: 380, ZONE_2: 458, ZONE_3: 540 }
      WEIGHT_CENTS_PER_LB: 42
      PEAK_SURCHARGE_PCT: 0.08
      VOLUME_TIER_1_THRESHOLD_CENTS: 20000
      VOLUME_TIER_1_PCT: 0.03
      VOLUME_TIER_2_THRESHOLD_CENTS: 50000
      VOLUME_TIER_2_PCT: 0.06
      VOLUME_TIER_3_THRESHOLD_CENTS: 100000
      VOLUME_TIER_3_PCT: 0.10
    precision: "all money in integer cents; every multiplication rounded with round_half_up at the step shown, in the order shown"
    variants: []

  - name: lot_selection
    trigger: "POST /fulfillment/inbound-shipment-plans/{id}/receive (which lot absorbs a line) and POST /fulfillment/multi-channel-orders (which lots are drawn down)"
    algorithm: chronological
    formula: |
      RECEIVE (one target lot per received line):
        candidates := InventoryLot rows where
            sku_listing_id == line.sku_listing_id
            AND fulfillment_center_id == plan.destination_fc_id
            AND lot_status IN {ACTIVE, PARTIALLY_REMOVED}
        ranking := first_received_at ASC, tie-break created_at ASC
        selected := first candidate under the ranking
        when candidates is empty: create a new InventoryLot with
            first_received_at := clock_now, units_received_total := 0 and all
            pools at 0, then credit it (a zero-unit discrepancy shell is created
            when the line received 0 units)

      MCF DRAW (FIFO across lots):
        candidates := InventoryLot rows where
            sku_listing_id == order.sku_listing_id
            AND lot_status IN {ACTIVE, PARTIALLY_REMOVED}
            AND fulfillable_units >= 1
            AND FulfillmentCenter.receiving_status of the lot's FC != SUSPENDED
        ranking := first_received_at ASC, tie-break created_at ASC
        remaining := order.units
        for lot in candidates ordered by the ranking:
          draw := min(lot.fulfillable_units, remaining)
          lot.fulfillable_units -= draw
          lot.units_shipped_mcf += draw
          append { inventory_lot_id: lot.id, units: draw } to consumed_lot_allocations
          remaining -= draw
          stop when remaining == 0
        when remaining > 0 after exhausting the candidates: reject the whole
          request with ERR_NO_FULFILLABLE_INVENTORY and persist nothing
    input_set: "Only lots whose lot_status IN {ACTIVE, PARTIALLY_REMOVED} are candidates; DEPLETED lots and lots at a FulfillmentCenter whose receiving_status == SUSPENDED are excluded from the MCF draw."
    constants: {}
    precision: "integer units"
    variants: []

  - name: removal_settlement
    trigger: "POST /fulfillment/removal-orders/{id}/complete"
    algorithm: threshold
    formula: |
      units := removal.requested_units
      removal_fee_cents := DISPOSAL_BASE_CENTS + units * DISPOSAL_PER_UNIT_CENTS          if removal_method == DISPOSAL
                           RTS_BASE_CENTS + units * RTS_PER_UNIT_CENTS                    if removal_method == RETURN_TO_SELLER
                           LIQUIDATION_BASE_CENTS + units * LIQUIDATION_PER_UNIT_CENTS    if removal_method == LIQUIDATION
      liquidation_recovery_cents := 0 if removal_method != LIQUIDATION
                                    else min( round_half_up(units * listing.unit_cost_cents * 0.05),
                                              units * LIQUIDATION_RECOVERY_CAP_CENTS_PER_UNIT )
      net_settlement_cents := liquidation_recovery_cents - removal_fee_cents
    input_set: "Single removal order; the lot's other removal orders do not participate."
    constants:
      DISPOSAL_BASE_CENTS: 100
      DISPOSAL_PER_UNIT_CENTS: 15
      RTS_BASE_CENTS: 200
      RTS_PER_UNIT_CENTS: 50
      LIQUIDATION_BASE_CENTS: 0
      LIQUIDATION_PER_UNIT_CENTS: 25
      LIQUIDATION_RECOVERY_PCT: 0.05
      LIQUIDATION_RECOVERY_CAP_CENTS_PER_UNIT: 120
    precision: "integer cents; round_half_up on the recovery percentage before the cap is applied"
    variants: []

  - name: reimbursement_settlement
    trigger: "POST /fulfillment/reimbursement-claims/{id}/decide with decision == APPROVED (evaluated at decision time, not at submission time)"
    algorithm: threshold
    formula: |
      pool_units := lot.missing_units          if claim_type == LOST_INBOUND
                    lot.unfulfillable_units    if claim_type == DAMAGED_WAREHOUSE
                    lot.units_removed          if claim_type == LOST_REMOVAL
      eligible_units := min(claim.claimed_units, pool_units)
      per_unit_value_cents := min(listing.unit_cost_cents, seller.unit_cost_cap_cents)
      type_factor := 1.00 if claim_type == LOST_INBOUND
                     0.90 if claim_type == DAMAGED_WAREHOUSE
                     0.80 if claim_type == LOST_REMOVAL
      reimbursement_amount_cents := round_half_up(eligible_units * per_unit_value_cents * type_factor)
      approved_units := eligible_units
    input_set: "Reads the claim's own lot pools live at decision time; a pool that shrank between submission and decision shrinks eligible_units."
    constants:
      LOST_INBOUND_FACTOR: 1.00
      DAMAGED_WAREHOUSE_FACTOR: 0.90
      LOST_REMOVAL_FACTOR: 0.80
      FILING_WINDOW_DAYS: 60
      EVIDENCE_MIN_LOST_INBOUND: 2
      EVIDENCE_MIN_DAMAGED_WAREHOUSE: 3
      EVIDENCE_MIN_LOST_REMOVAL: 2
    precision: "integer cents, round_half_up applied once to the whole product"
    variants: []

  - name: listing_health_recompute
    trigger: "every mutation that changes a lot pool: POST .../receive, POST .../unfulfillable-classification, POST /fulfillment/removal-orders, POST /fulfillment/removal-orders/{id}/complete, POST /fulfillment/removal-orders/{id}/cancel, POST /fulfillment/multi-channel-orders, POST /fulfillment/reimbursement-claims/{id}/decide, and the sweep inside POST /fulfillment/storage-billing-runs"
    algorithm: aggregation
    formula: |
      listing.fulfillable_units    := sum(lot.fulfillable_units)    over lots of this listing with lot_status IN {ACTIVE, PARTIALLY_REMOVED}
      listing.unfulfillable_units  := sum(lot.unfulfillable_units)  over the same set
      listing.missing_units        := sum(lot.missing_units)        over lots of this listing with lot_status IN {ACTIVE, PARTIALLY_REMOVED, DEPLETED}
      listing.aged_over_365_units  := sum(lot.fulfillable_units + lot.unfulfillable_units) over lots of this listing with lot_status IN {ACTIVE, PARTIALLY_REMOVED} AND aged_bucket == OVER_365
      listing.lot_ever_created     := true once any InventoryLot row exists for this listing

      # inventory_health — evaluated in this pinned order, first match wins
      inventory_health := STRANDED     if listing.fulfillable_units == 0 AND listing.unfulfillable_units >= 1
                          OUT_OF_STOCK if listing.fulfillable_units == 0
                          EXCESS_AGED  if listing.aged_over_365_units >= 1
                          HEALTHY      otherwise

      # listing_status / suppression_reason — independent dimension, first match wins
      if listing.fulfillable_units == 0 AND listing.lot_ever_created == true:
        listing_status := SUPPRESSED
        suppression_reason := MISSING_INVENTORY   if listing.missing_units >= 1
                              STRANDED_INVENTORY  if listing.unfulfillable_units >= 1
                              ZERO_FULFILLABLE    otherwise
      else:
        listing_status and suppression_reason are left unchanged — suppression is
        cleared only by POST /fulfillment/sku-listings/{id}/reinstate
      SellerAccount.suppressed_listing_count := count of the seller's SkuListing rows with listing_status == SUPPRESSED
    input_set: "Lots with lot_status IN {ACTIVE, PARTIALLY_REMOVED} for the unit pools; DEPLETED lots still contribute missing_units so an unreimbursed shortfall keeps suppressing the listing."
    constants: {}
    precision: "integer units"
    variants: []

  - name: storage_utilization_ratio
    trigger: "every mutation that changes a lot pool (see calculation listing_health_recompute) and the start of POST /fulfillment/storage-billing-runs"
    algorithm: aggregation
    formula: |
      total_stored_cubic_feet := sum over lots L of this seller's listings with
            L.lot_status IN {ACTIVE, PARTIALLY_REMOVED} of
            round((L.fulfillable_units + L.unfulfillable_units + L.units_reserved_for_removal)
                  * listing.unit_cubic_feet, 4)
      seller.storage_utilization_ratio := round(total_stored_cubic_feet / seller.storage_cubic_feet_entitlement, 4)

      # applied ONLY inside a storage-billing run, at most one step per run:
      if seller.storage_utilization_ratio > 1.0000 and the seller has a RestockQuota with status == ACTIVE:
        quota.capacity_tier_downgrade_steps += 1
        re-run calculation iprs_and_restock_limit for that quota
    input_set: "Lots whose lot_status IN {ACTIVE, PARTIALLY_REMOVED}; DEPLETED lots contribute nothing."
    constants:
      UTILIZATION_DOWNGRADE_THRESHOLD: 1.0
    precision: "ratio rounded to 4 decimal places, round_half_up; per-lot cubic feet rounded to 4 decimal places before summing"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body shape: required fields present, enum members valid, numeric fields within their declared constraints, arrays non-null"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "path-templated resources exist, validated left-to-right"
    error_id: "ERR_SELLER_NOT_FOUND | ERR_FC_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_REMOVAL_ORDER_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "body foreign keys exist: seller_account_id, destination_fc_id, sku_listing_id, inventory_lot_id, shipment_line_item_id"
    error_id: "ERR_SELLER_NOT_FOUND | ERR_FC_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_LOT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /fulfillment/sku-listings, POST /fulfillment/inbound-shipment-plans, POST /fulfillment/inbound-shipment-plans/{id}/line-items, POST /fulfillment/removal-orders, POST /fulfillment/reimbursement-claims, POST /fulfillment/multi-channel-orders"
  - priority: 6
    category: auth
    check: "ownership scope: a SellerOperator may only act on resources whose seller chain resolves to its X-User-ID; a FcOperator may only receive plans and complete removals whose FulfillmentCenter is its X-User-ID"
    error_id: "ERR_SELLER_SCOPE_VIOLATION | ERR_FC_SCOPE_VIOLATION"
    http_status: 403
    applies_to: "all SellerOperator and FcOperator write endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_seller_account_version equals SellerAccount.version; expected_inventory_lot_version equals InventoryLot.version"
    error_id: "ERR_STALE_SELLER_VERSION | ERR_STALE_LOT_VERSION"
    http_status: 412
    applies_to: "POST /fulfillment/inbound-shipment-plans, POST /fulfillment/removal-orders"
  - priority: 8
    category: state
    check: "the target resource is in a state that permits this operation (§1.2 from-state)"
    error_id: "ERR_PLAN_NOT_DRAFT | ERR_PLAN_NOT_CONFIRMED | ERR_PLAN_NOT_RECEIVABLE | ERR_REMOVAL_NOT_REQUESTED | ERR_CLAIM_NOT_ACTIONABLE | ERR_LISTING_NOT_SUPPRESSED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: state
    check: "cross-entity state preconditions: destination FulfillmentCenter.receiving_status != SUSPENDED on confirm; a RestockQuota with status == ACTIVE exists on confirm; InventoryLot.reconciliation_status == DISCREPANCY_OPEN for a LOST_INBOUND claim; SkuListing.fulfillable_units >= 1 on reinstate; logical clock now >= RemovalOrder.removal_window_start on complete"
    error_id: "ERR_FC_RECEIVING_SUSPENDED | ERR_NO_ACTIVE_RESTOCK_QUOTA | ERR_LOT_NO_OPEN_DISCREPANCY | ERR_SUPPRESSION_CONDITION_PERSISTS | ERR_REMOVAL_WINDOW_NOT_OPEN"
    http_status: 409
    applies_to: "POST .../confirm, POST /fulfillment/reimbursement-claims, POST .../reinstate, POST /fulfillment/removal-orders/{id}/complete"
  - priority: 10
    category: business_safety
    check: "prep requirement: when the destination FulfillmentCenter.prep_profile IN {POLYBAG_REQUIRED, CASE_PACK_STRICT}, every line item of the plan must have polybagged == true"
    error_id: ERR_PREP_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /fulfillment/inbound-shipment-plans/{id}/line-items, POST /fulfillment/inbound-shipment-plans/{id}/confirm"
  - priority: 11
    category: business_safety
    check: "label requirement: when the destination FulfillmentCenter.prep_profile IN {LABEL_ONLY, CASE_PACK_STRICT}, every line item of the plan must have label_type == FNSKU"
    error_id: ERR_LABEL_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /fulfillment/inbound-shipment-plans/{id}/line-items, POST /fulfillment/inbound-shipment-plans/{id}/confirm"
  - priority: 12
    category: business_temporal
    check: "appointment window sanity: appointment_window_end is strictly after appointment_window_start, and appointment_window_start is not before the logical clock now"
    error_id: "ERR_APPOINTMENT_WINDOW_INVALID | ERR_APPOINTMENT_WINDOW_IN_PAST"
    http_status: 422
    applies_to: "POST /fulfillment/inbound-shipment-plans"
  - priority: 13
    category: business_temporal
    check: "claim filing window: the logical clock now is at or before claim.filing_deadline_at (anchor + 60 days); equality is accepted"
    error_id: ERR_CLAIM_FILING_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /fulfillment/reimbursement-claims, POST /fulfillment/reimbursement-claims/{id}/resubmit"
  - priority: 14
    category: business_constraint
    check: "case pack: units must be an exact positive multiple of case_pack_units, and when the destination FulfillmentCenter.prep_profile == CASE_PACK_STRICT, case_pack_units must be >= FulfillmentCenter.case_pack_min_units"
    error_id: ERR_CASE_PACK_VIOLATION
    http_status: 422
    applies_to: "POST /fulfillment/inbound-shipment-plans/{id}/line-items, POST /fulfillment/inbound-shipment-plans/{id}/confirm"
  - priority: 15
    category: business_constraint
    check: "structural constraints: a plan being confirmed has at least one line item; a seller's (seller_account_id, sku) pair is unique; a removal window does not collide with another REQUESTED removal window on the same lot (CLOSED intervals, touching endpoints collide); a claim has not exhausted its 2 resubmissions"
    error_id: "ERR_PLAN_HAS_NO_LINE_ITEMS | ERR_DUPLICATE_SKU | ERR_REMOVAL_WINDOW_CONFLICT | ERR_RESUBMISSION_LIMIT_REACHED"
    http_status: "409 for ERR_DUPLICATE_SKU and ERR_REMOVAL_WINDOW_CONFLICT, 422 for the others"
    applies_to: "POST /fulfillment/sku-listings, POST /fulfillment/inbound-shipment-plans/{id}/confirm, POST /fulfillment/removal-orders, POST /fulfillment/reimbursement-claims/{id}/resubmit"
  - priority: 16
    category: business_referential
    check: "referential coherence: a line item's SkuListing.seller_account_id equals the plan's seller_account_id; a claim carries at least the evidence minimum for its claim_type (LOST_INBOUND 2, DAMAGED_WAREHOUSE 3, LOST_REMOVAL 2)"
    error_id: "ERR_LISTING_SELLER_MISMATCH | ERR_EVIDENCE_REFERENCE_MISSING"
    http_status: 422
    applies_to: "POST /fulfillment/inbound-shipment-plans/{id}/line-items, POST /fulfillment/reimbursement-claims, POST /fulfillment/reimbursement-claims/{id}/resubmit"
  - priority: 17
    category: business_fiscal
    check: "unit availability: a removal request does not exceed its source pool on the lot; an unfulfillable classification does not exceed lot.fulfillable_units; a claim's claimed_units does not exceed the claim_type's pool at submission time; an MCF draw finds enough fulfillable units"
    error_id: "ERR_INSUFFICIENT_POOL_UNITS | ERR_REIMBURSEMENT_EXCEEDS_ELIGIBLE_UNITS | ERR_NO_FULFILLABLE_INVENTORY"
    http_status: 422
    applies_to: "POST /fulfillment/removal-orders, POST /fulfillment/inventory-lots/{id}/unfulfillable-classification, POST /fulfillment/reimbursement-claims, POST /fulfillment/multi-channel-orders"
  - priority: 18
    category: business_fiscal
    check: "FC window capacity: sum of declared_units over plans at the same destination FC whose status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED} and whose half-open window [start, end) intersects this plan's window, plus this plan's declared_units, must be <= effective capacity (receiving_capacity_units_per_window when receiving_status == OPEN, floor(capacity * 0.5) when THROTTLED). Equality passes."
    error_id: ERR_FC_RECEIVING_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /fulfillment/inbound-shipment-plans/{id}/confirm"
  - priority: 19
    category: business_fiscal
    check: "restock limit: calculation restock_allocation variant FINAL must grant the plan's full declared_units; a grant strictly below declared_units is rejected"
    error_id: ERR_RESTOCK_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /fulfillment/inbound-shipment-plans/{id}/confirm"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- SellerAccount ---
  - method: POST
    path: "/fulfillment/sellers"
    description: "Register a seller account."
    roles: [MarketplaceAdmin]
    code: 201
    input: [legal_name, storage_cubic_feet_entitlement, unit_cost_cap_cents]
    output: SellerAccount
    side_effects: ["seller_status = ACTIVE; all derived ledgers start at 0; version = 1"]
  - method: GET
    path: "/fulfillment/sellers/{id}"
    description: "Read a seller account with its derived quota, storage and reimbursement ledgers."
    roles: [MarketplaceAdmin, SellerOperator, ClaimsAdjudicator]
    code: 200
    input: []
    output: SellerAccount
    side_effects: []
  - method: GET
    path: "/fulfillment/sellers/{id}/sku-listings"
    description: "List the seller's SKU listings (reverse lookup for SkuListing.seller_account_id)."
    roles: [MarketplaceAdmin, SellerOperator]
    code: 200
    input: ["listing_status?", "inventory_health?", "limit?", "offset?"]
    output: SkuListing[]
    side_effects: []
  - method: GET
    path: "/fulfillment/sellers/{id}/restock-quotas"
    description: "List the seller's quota periods newest first (reverse lookup for RestockQuota.seller_account_id)."
    roles: [MarketplaceAdmin, SellerOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RestockQuota[]
    side_effects: []
  - method: POST
    path: "/fulfillment/sellers/{id}/restock-quotas"
    description: "Open a quota period with performance inputs; supersedes the seller's ACTIVE quota."
    roles: [MarketplaceAdmin]
    code: 201
    input: [period_start, period_end, base_capacity_units, sell_through_rate, excess_units_ratio, stranded_ratio, in_stock_rate]
    output: RestockQuota
    side_effects:
      - "runs calculation iprs_and_restock_limit, writing iprs_score, base_capacity_tier, capacity_tier and restock_limit_units"
      - "moves a pre-existing ACTIVE quota of this seller to SUPERSEDED"
      - "seeds utilized_units from the seller's plans whose status IN {CONFIRMED, IN_TRANSIT, PARTIALLY_RECEIVED}"
      - "may set SellerAccount.seller_status = SUSPENDED when iprs_score < 200"

  # --- FulfillmentCenter ---
  - method: POST
    path: "/fulfillment/fulfillment-centers"
    description: "Register a fulfillment center with its prep profile, window capacity and storage rates."
    roles: [MarketplaceAdmin]
    code: 201
    input: [fc_code, region_code, prep_profile, case_pack_min_units, receiving_capacity_units_per_window, monthly_storage_rate_cents_per_cubic_foot, ltsf_rate_cents_per_cubic_foot]
    output: FulfillmentCenter
    side_effects: ["receiving_status = OPEN; committed_receiving_units = 0"]
  - method: GET
    path: "/fulfillment/fulfillment-centers/{id}"
    description: "Read a fulfillment center with its committed receiving units."
    roles: [MarketplaceAdmin, FcOperator, SellerOperator]
    code: 200
    input: []
    output: FulfillmentCenter
    side_effects: []
  - method: PATCH
    path: "/fulfillment/fulfillment-centers/{id}"
    description: "Update receiving posture or window capacity."
    roles: [FcOperator, MarketplaceAdmin]
    code: 200
    input: ["receiving_status?", "receiving_capacity_units_per_window?"]
    output: FulfillmentCenter
    side_effects: ["changes the effective window capacity used by §1.4 priority 18 and can block confirmation via ERR_FC_RECEIVING_SUSPENDED"]

  # --- SkuListing ---
  - method: POST
    path: "/fulfillment/sku-listings"
    description: "Create a SKU listing."
    roles: [SellerOperator]
    code: 201
    input: [seller_account_id, sku, unit_cubic_feet, unit_cost_cents]
    output: SkuListing
    side_effects: ["listing_status = ACTIVE, inventory_health = OUT_OF_STOCK, lot_ever_created = false"]
  - method: GET
    path: "/fulfillment/sku-listings/{id}"
    description: "Read a listing with both state dimensions and its derived unit rollups."
    roles: [MarketplaceAdmin, SellerOperator, ClaimsAdjudicator, FcOperator]
    code: 200
    input: []
    output: SkuListing
    side_effects: []
  - method: POST
    path: "/fulfillment/sku-listings/{id}/reinstate"
    description: "Clear a suppression once fulfillable inventory exists again."
    roles: [SellerOperator]
    code: 200
    input: ["reinstatement_note?"]
    output: SkuListing
    side_effects: ["listing_status = ACTIVE, suppression_reason = NONE; decrements SellerAccount.suppressed_listing_count by 1"]
  - method: GET
    path: "/fulfillment/sku-listings/{id}/line-items"
    description: "List every shipment line item for this listing (reverse lookup for ShipmentLineItem.sku_listing_id)."
    roles: [MarketplaceAdmin, SellerOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: ShipmentLineItem[]
    side_effects: []
  - method: GET
    path: "/fulfillment/sku-listings/{id}/velocity-forecasts"
    description: "List this listing's forecasts newest first (reverse lookup for VelocityForecast.sku_listing_id)."
    roles: [MarketplaceAdmin, SellerOperator]
    code: 200
    input: ["forecast_variant?", "limit?", "offset?"]
    output: VelocityForecast[]
    side_effects: []
  - method: POST
    path: "/fulfillment/sku-listings/{id}/velocity-forecasts"
    description: "Produce a sell-through velocity forecast and a replenishment recommendation."
    roles: [SellerOperator]
    code: 201
    input: [forecast_variant, trailing_30_units_sold, prior_year_same_period_units_sold, seasonal_index, coverage_target_days, lead_time_days]
    output: VelocityForecast
    side_effects:
      - "runs calculation velocity_forecast"
      - "copies recommended_replenishment_units onto SkuListing.recommended_replenishment_units"
  - method: GET
    path: "/fulfillment/sku-listings/{id}/multi-channel-orders"
    description: "List this listing's multi-channel orders (reverse lookup for MultiChannelOrder.sku_listing_id)."
    roles: [MarketplaceAdmin, SellerOperator]
    code: 200
    input: ["fulfillment_channel?", "limit?", "offset?"]
    output: MultiChannelOrder[]
    side_effects: []

  # --- InboundShipmentPlan ---
  - method: POST
    path: "/fulfillment/inbound-shipment-plans"
    description: "Create an inbound shipment plan in DRAFT against a destination FC appointment window."
    roles: [SellerOperator]
    code: 201
    input: [seller_account_id, destination_fc_id, appointment_window_start, appointment_window_end, expected_seller_account_version]
    output: InboundShipmentPlan
    side_effects:
      - "status = DRAFT, declared_units = 0, allocation_status = WITHIN_LIMIT"
      - "runs calculation restock_allocation variant PROVISIONAL"
      - "increments SellerAccount.version by 1"
  - method: GET
    path: "/fulfillment/inbound-shipment-plans/{id}"
    description: "Read a plan with its provisional and final allocation figures."
    roles: [MarketplaceAdmin, SellerOperator, FcOperator]
    code: 200
    input: []
    output: InboundShipmentPlan
    side_effects: []
  - method: GET
    path: "/fulfillment/inbound-shipment-plans"
    description: "List plans filtered by seller, destination FC or status (reverse lookup for both plan FKs)."
    roles: [MarketplaceAdmin, SellerOperator, FcOperator]
    code: 200
    input: ["seller_account_id?", "destination_fc_id?", "status?", "limit?", "offset?"]
    output: InboundShipmentPlan[]
    side_effects: []
  - method: POST
    path: "/fulfillment/inbound-shipment-plans/{id}/line-items"
    description: "Add a line item to a DRAFT plan; re-runs the provisional allocation waterfall."
    roles: [SellerOperator]
    code: 201
    input: [sku_listing_id, units, case_pack_units, polybagged, label_type]
    output: ShipmentLineItem
    side_effects:
      - "recomputes InboundShipmentPlan.declared_units"
      - "runs calculation restock_allocation variant PROVISIONAL over all line items of the plan, writing every line's provisional_allocated_units and the plan's allocation_status"
  - method: GET
    path: "/fulfillment/inbound-shipment-plans/{id}/line-items"
    description: "List a plan's line items in creation order (reverse lookup for ShipmentLineItem.shipment_plan_id)."
    roles: [MarketplaceAdmin, SellerOperator, FcOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: ShipmentLineItem[]
    side_effects: []
  - method: POST
    path: "/fulfillment/inbound-shipment-plans/{id}/confirm"
    description: "Confirm a DRAFT plan: prep, label, case-pack, FC window capacity and final restock allocation are all enforced here."
    roles: [SellerOperator]
    code: 200
    input: ["confirmation_note?"]
    output: InboundShipmentPlan
    side_effects:
      - "DRAFT -> CONFIRMED per §1.2"
      - "runs calculation restock_allocation variant FINAL"
      - "increments SellerAccount.restock_reserved_units, RestockQuota.utilized_units and FulfillmentCenter.committed_receiving_units"
      - "refreshes the PROVISIONAL allocation of the seller's other DRAFT plans"
  - method: POST
    path: "/fulfillment/inbound-shipment-plans/{id}/revert-to-draft"
    description: "Return a CONFIRMED plan to DRAFT, releasing every reservation it holds."
    roles: [SellerOperator]
    code: 200
    input: ["revert_reason?"]
    output: InboundShipmentPlan
    side_effects:
      - "CONFIRMED -> DRAFT per §1.2, restoring INV-1 and INV-3 exactly"
      - "clears final_allocated_units on the plan and on every line item"
  - method: POST
    path: "/fulfillment/inbound-shipment-plans/{id}/ship"
    description: "Mark a confirmed plan as in transit."
    roles: [SellerOperator]
    code: 200
    input: ["carrier_reference?"]
    output: InboundShipmentPlan
    side_effects: ["CONFIRMED -> IN_TRANSIT per §1.2"]
  - method: POST
    path: "/fulfillment/inbound-shipment-plans/{id}/receive"
    description: "Record a receipt at the destination FC; drives the RECEIVED_COMPLETE / PARTIALLY_RECEIVED fork and the discrepancy-to-suppression cascade. received_lines is a non-empty array of objects { shipment_line_item_id: string, received_units: integer >= 0, unfulfillable_units: integer >= 0 }; a line omitted from the array is credited nothing on this call."
    roles: [FcOperator]
    code: 200
    input: [received_lines, "receipt_note?"]
    output: InboundShipmentPlan
    side_effects:
      - "creates or credits InventoryLot rows per calculation lot_selection"
      - "IN_TRANSIT/PARTIALLY_RECEIVED -> RECEIVED_COMPLETE or PARTIALLY_RECEIVED per §1.2, with divergent side-effect sets"
      - "runs calculation listing_health_recompute, calculation storage_utilization_ratio and (on shortfall change) calculation iprs_and_restock_limit"
  - method: POST
    path: "/fulfillment/inbound-shipment-plans/{id}/cancel"
    description: "Cancel a DRAFT or CONFIRMED plan, releasing every reservation it holds."
    roles: [SellerOperator]
    code: 200
    input: ["cancellation_reason?"]
    output: InboundShipmentPlan
    side_effects:
      - "DRAFT -> CANCELLED or CONFIRMED -> CANCELLED per §1.2, restoring INV-1 and INV-3 exactly"
      - "refreshes the PROVISIONAL allocation of the seller's other DRAFT plans"

  # --- InventoryLot ---
  - method: GET
    path: "/fulfillment/inventory-lots/{id}"
    description: "Read a lot with both state dimensions, every unit pool, its age bucket and accrued storage fees."
    roles: [MarketplaceAdmin, SellerOperator, FcOperator, ClaimsAdjudicator]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: GET
    path: "/fulfillment/inventory-lots"
    description: "List lots filtered by listing, FC or state (reverse lookup for both lot FKs)."
    roles: [MarketplaceAdmin, SellerOperator, FcOperator]
    code: 200
    input: ["sku_listing_id?", "fulfillment_center_id?", "lot_status?", "reconciliation_status?", "aged_bucket?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []
  - method: POST
    path: "/fulfillment/inventory-lots/{id}/unfulfillable-classification"
    description: "Move units from the fulfillable pool to the unfulfillable pool at the holding FC."
    roles: [FcOperator]
    code: 200
    input: [units, disposition_reason]
    output: InventoryLot
    side_effects:
      - "fulfillable_units -= units, unfulfillable_units += units (INV-2 total unchanged); sets unfulfillable_recorded_at"
      - "runs calculation listing_health_recompute, which can suppress the listing with suppression_reason = STRANDED_INVENTORY"
  - method: GET
    path: "/fulfillment/inventory-lots/{id}/storage-fee-assessments"
    description: "List a lot's storage assessments oldest first (reverse lookup for StorageFeeAssessment.inventory_lot_id)."
    roles: [MarketplaceAdmin, SellerOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: StorageFeeAssessment[]
    side_effects: []
  - method: GET
    path: "/fulfillment/inventory-lots/{id}/removal-orders"
    description: "List a lot's removal orders (reverse lookup for RemovalOrder.inventory_lot_id)."
    roles: [MarketplaceAdmin, SellerOperator, FcOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RemovalOrder[]
    side_effects: []
  - method: GET
    path: "/fulfillment/inventory-lots/{id}/reimbursement-claims"
    description: "List a lot's claims (reverse lookup for ReimbursementClaim.inventory_lot_id)."
    roles: [MarketplaceAdmin, SellerOperator, ClaimsAdjudicator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []

  # --- RemovalOrder ---
  - method: POST
    path: "/fulfillment/removal-orders"
    description: "Request a removal (disposal, return-to-seller or liquidation) against a lot pool inside a closed execution window."
    roles: [SellerOperator]
    code: 201
    input: [inventory_lot_id, removal_method, unit_pool, requested_units, removal_window_start, removal_window_end, expected_inventory_lot_version]
    output: RemovalOrder
    side_effects:
      - "reserves units: lot.fulfillable_units or lot.unfulfillable_units -= requested_units and lot.units_reserved_for_removal += requested_units (INV-2 total unchanged)"
      - "increments InventoryLot.version by 1"
      - "runs calculation listing_health_recompute and calculation storage_utilization_ratio"
  - method: GET
    path: "/fulfillment/removal-orders/{id}"
    description: "Read a removal order with its settlement figures."
    roles: [MarketplaceAdmin, SellerOperator, FcOperator]
    code: 200
    input: []
    output: RemovalOrder
    side_effects: []
  - method: POST
    path: "/fulfillment/removal-orders/{id}/complete"
    description: "Execute a requested removal at the holding FC."
    roles: [FcOperator]
    code: 200
    input: ["completion_note?"]
    output: RemovalOrder
    side_effects:
      - "REQUESTED -> COMPLETED per §1.2; runs calculation removal_settlement"
      - "lot.units_reserved_for_removal -= requested_units, lot.units_removed += requested_units, lot_status may become PARTIALLY_REMOVED or DEPLETED"
      - "runs calculation listing_health_recompute and calculation storage_utilization_ratio"
  - method: POST
    path: "/fulfillment/removal-orders/{id}/cancel"
    description: "Cancel a requested removal and return the units to their source pool."
    roles: [SellerOperator]
    code: 200
    input: ["cancellation_reason?"]
    output: RemovalOrder
    side_effects:
      - "REQUESTED -> CANCELLED per §1.2, restoring the exact pool split (INV-2 compensating action)"
      - "runs calculation listing_health_recompute and calculation storage_utilization_ratio"

  # --- ReimbursementClaim ---
  - method: POST
    path: "/fulfillment/reimbursement-claims"
    description: "File a reimbursement claim for lost or damaged units with evidence, inside the filing window."
    roles: [SellerOperator]
    code: 201
    input: [inventory_lot_id, claim_type, claimed_units, evidence_document_count, evidence_reference]
    output: ReimbursementClaim
    side_effects:
      - "status = SUBMITTED; pins filing_deadline_at = anchor + 60 days from the lot anchor selected by claim_type"
      - "moves lot.reconciliation_status DISCREPANCY_OPEN -> DISCREPANCY_CLAIMED when claim_type == LOST_INBOUND"
  - method: GET
    path: "/fulfillment/reimbursement-claims/{id}"
    description: "Read a claim with its deadline, resubmission count and settlement figures."
    roles: [MarketplaceAdmin, SellerOperator, ClaimsAdjudicator]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []
  - method: POST
    path: "/fulfillment/reimbursement-claims/{id}/request-info"
    description: "Adjudicator asks the seller for more evidence."
    roles: [ClaimsAdjudicator]
    code: 200
    input: [information_request_note]
    output: ReimbursementClaim
    side_effects: ["SUBMITTED -> INFO_REQUESTED per §1.2"]
  - method: POST
    path: "/fulfillment/reimbursement-claims/{id}/resubmit"
    description: "Seller supplies fresh evidence and returns the claim to the adjudication queue."
    roles: [SellerOperator]
    code: 200
    input: [evidence_document_count, evidence_reference]
    output: ReimbursementClaim
    side_effects:
      - "INFO_REQUESTED -> SUBMITTED per §1.2; increments resubmission_count by 1 (hard cap 2)"
  - method: POST
    path: "/fulfillment/reimbursement-claims/{id}/decide"
    description: "Adjudicator approves or denies a submitted claim; approval drives the reimbursement cascade."
    roles: [ClaimsAdjudicator]
    code: 200
    input: [decision, "decision_note?"]
    output: ReimbursementClaim
    side_effects:
      - "SUBMITTED -> APPROVED or SUBMITTED -> DENIED per §1.2 with divergent side-effect sets"
      - "on APPROVED: runs calculation reimbursement_settlement and the four-link CASCADE-D"

  # --- MultiChannelOrder ---
  - method: POST
    path: "/fulfillment/multi-channel-orders"
    description: "Place a multi-channel order and compare the marketplace fulfillment fee against the seller's own cost."
    roles: [SellerOperator]
    code: 201
    input: [sku_listing_id, units, billable_weight_lb, destination_zone, fulfillment_channel, self_fulfilled_cost_cents]
    output: MultiChannelOrder
    side_effects:
      - "runs calculation mcf_fee_quote, writing mcf_fee_cents, fee_advantage_cents and recommended_channel"
      - "when fulfillment_channel == MCF: draws units FIFO per calculation lot_selection, sets order_status = MCF_SHIPPED, increments SellerAccount.mcf_fee_accrued_cents and runs calculation listing_health_recompute plus calculation storage_utilization_ratio"
      - "when fulfillment_channel == SELF_FULFILLED: sets order_status = SELF_SHIPPED, touches no inventory and leaves mcf_fee_accrued_cents unchanged"

  # --- Ops / system ---
  - method: POST
    path: "/fulfillment/storage-billing-runs"
    description: "Advance the storage billing epoch: assess every eligible lot, apply utilization downgrades, expire due quota periods and close aged plans."
    roles: [MarketplaceAdmin]
    code: 201
    input: ["run_note?"]
    output: { billing_run_sequence: integer, assessment_count: integer, total_assessed_cents: integer, downgraded_quota_count: integer, expired_quota_count: integer, closed_plan_count: integer }
    side_effects:
      - "creates one StorageFeeAssessment per lot whose lot_status IN {ACTIVE, PARTIALLY_REMOVED} per calculation storage_fee_assessment, in order of lot.first_received_at ASC then lot.created_at ASC"
      - "updates InventoryLot.age_days, aged_bucket, ltsf_exposed and storage_fee_accrued_cents, and SellerAccount.storage_fee_accrued_cents"
      - "runs calculation storage_utilization_ratio, which may add one capacity_tier_downgrade_step and re-run calculation iprs_and_restock_limit"
      - "runs calculation listing_health_recompute, which can move inventory_health to EXCESS_AGED"
      - "expires every RestockQuota whose status == ACTIVE and period_end <= clock now"
      - "closes every plan whose status IN {RECEIVED_COMPLETE, PARTIALLY_RECEIVED} and appointment_window_end + 30 days <= clock now, releasing any reservation a PARTIALLY_RECEIVED plan still holds"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [MarketplaceAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["all age, deadline, window and peak-period evaluations read this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of {SellerOperator, FcOperator, ClaimsAdjudicator, MarketplaceAdmin}"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, invalid enum member, non-positive units, window end not after start, or malformed array element"
  - id: ERR_SELLER_NOT_FOUND
    http: 404
    condition: "sellerId path parameter or seller_account_id body field does not resolve"
  - id: ERR_FC_NOT_FOUND
    http: 404
    condition: "fcId path parameter or destination_fc_id body field does not resolve"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "listingId path parameter or sku_listing_id body field does not resolve"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "planId path parameter does not resolve"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "lotId path parameter or inventory_lot_id body field does not resolve"
  - id: ERR_REMOVAL_ORDER_NOT_FOUND
    http: 404
    condition: "removalOrderId path parameter does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claimId path parameter does not resolve"
  - id: ERR_LINE_ITEM_NOT_FOUND
    http: 404
    condition: "a received_lines[].shipment_line_item_id does not resolve or does not belong to the plan being received"
  - id: ERR_SELLER_SCOPE_VIOLATION
    http: 403
    condition: "SellerOperator's X-User-ID is not the seller that owns the target resource"
  - id: ERR_FC_SCOPE_VIOLATION
    http: 403
    condition: "FcOperator's X-User-ID is not the FulfillmentCenter that must perform the operation"
  - id: ERR_STALE_SELLER_VERSION
    http: 412
    condition: "expected_seller_account_version does not equal SellerAccount.version"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_inventory_lot_version does not equal InventoryLot.version"
  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "line-item creation, confirm or DRAFT-cancel attempted on a plan whose status != DRAFT"
  - id: ERR_PLAN_NOT_CONFIRMED
    http: 409
    condition: "ship or revert-to-draft attempted on a plan whose status != CONFIRMED"
  - id: ERR_PLAN_NOT_RECEIVABLE
    http: 409
    condition: "receive attempted on a plan whose status NOT IN {IN_TRANSIT, PARTIALLY_RECEIVED}"
  - id: ERR_PLAN_NOT_CANCELLABLE
    http: 409
    condition: "cancel attempted on a plan whose status NOT IN {DRAFT, CONFIRMED}"
  - id: ERR_REMOVAL_NOT_REQUESTED
    http: 409
    condition: "complete or cancel attempted on a removal order whose status != REQUESTED"
  - id: ERR_CLAIM_NOT_ACTIONABLE
    http: 409
    condition: "request-info or decide attempted on a claim whose status != SUBMITTED, or resubmit attempted on a claim whose status != INFO_REQUESTED"
  - id: ERR_LISTING_NOT_SUPPRESSED
    http: 409
    condition: "reinstate attempted on a listing whose listing_status != SUPPRESSED"
  - id: ERR_FC_RECEIVING_SUSPENDED
    http: 409
    condition: "confirm attempted while the destination FulfillmentCenter.receiving_status == SUSPENDED"
  - id: ERR_NO_ACTIVE_RESTOCK_QUOTA
    http: 409
    condition: "confirm attempted while the seller has no RestockQuota whose status == ACTIVE"
  - id: ERR_LOT_NO_OPEN_DISCREPANCY
    http: 409
    condition: "LOST_INBOUND claim filed while the lot's reconciliation_status != DISCREPANCY_OPEN"
  - id: ERR_SUPPRESSION_CONDITION_PERSISTS
    http: 409
    condition: "reinstate attempted while SkuListing.fulfillable_units == 0"
  - id: ERR_REMOVAL_WINDOW_NOT_OPEN
    http: 409
    condition: "complete attempted before the logical clock reaches RemovalOrder.removal_window_start"
  - id: ERR_PREP_REQUIREMENT_UNMET
    http: 422
    condition: "destination FulfillmentCenter.prep_profile IN {POLYBAG_REQUIRED, CASE_PACK_STRICT} and a line item has polybagged == false"
  - id: ERR_LABEL_REQUIREMENT_UNMET
    http: 422
    condition: "destination FulfillmentCenter.prep_profile IN {LABEL_ONLY, CASE_PACK_STRICT} and a line item has label_type != FNSKU"
  - id: ERR_APPOINTMENT_WINDOW_INVALID
    http: 422
    condition: "appointment_window_end is not strictly after appointment_window_start"
  - id: ERR_APPOINTMENT_WINDOW_IN_PAST
    http: 422
    condition: "appointment_window_start is strictly before the logical clock now"
  - id: ERR_CLAIM_FILING_WINDOW_CLOSED
    http: 422
    condition: "logical clock now is strictly after the claim's filing_deadline_at (anchor + 60 days) at submission or resubmission"
  - id: ERR_CASE_PACK_VIOLATION
    http: 422
    condition: "units is not an exact multiple of case_pack_units, or prep_profile == CASE_PACK_STRICT and case_pack_units < FulfillmentCenter.case_pack_min_units"
  - id: ERR_PLAN_HAS_NO_LINE_ITEMS
    http: 422
    condition: "confirm attempted on a plan with zero ShipmentLineItem rows"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "a SkuListing already exists with the same (seller_account_id, sku) pair"
  - id: ERR_REMOVAL_WINDOW_CONFLICT
    http: 409
    condition: "the requested CLOSED removal window intersects — including touching an endpoint — another RemovalOrder on the same lot whose status == REQUESTED"
  - id: ERR_RESUBMISSION_LIMIT_REACHED
    http: 422
    condition: "resubmit attempted when claim.resubmission_count is already 2"
  - id: ERR_LISTING_SELLER_MISMATCH
    http: 422
    condition: "a line item's SkuListing.seller_account_id differs from the plan's seller_account_id"
  - id: ERR_EVIDENCE_REFERENCE_MISSING
    http: 422
    condition: "evidence_document_count is below the claim_type minimum (LOST_INBOUND 2, DAMAGED_WAREHOUSE 3, LOST_REMOVAL 2)"
  - id: ERR_INSUFFICIENT_POOL_UNITS
    http: 422
    condition: "requested_units exceeds the removal order's source pool on the lot, or an unfulfillable classification's units exceeds lot.fulfillable_units"
  - id: ERR_REIMBURSEMENT_EXCEEDS_ELIGIBLE_UNITS
    http: 422
    condition: "claimed_units exceeds the claim_type's pool on the lot at submission time"
  - id: ERR_NO_FULFILLABLE_INVENTORY
    http: 422
    condition: "an MCF draw cannot cover order.units from the eligible lots"
  - id: ERR_FC_RECEIVING_CAPACITY_EXCEEDED
    http: 422
    condition: "overlapping declared units plus this plan's declared units exceed the destination FC's effective window capacity"
  - id: ERR_RESTOCK_LIMIT_EXCEEDED
    http: 422
    condition: "calculation restock_allocation variant FINAL grants strictly fewer units than the plan's declared_units"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SellerOperator
    description: "Acts for one seller: listings, plans, line items, removals, claims, forecasts and multi-channel orders."
    identity: "entity_backed:SellerAccount"
    exclusive_operations:
      - "POST /fulfillment/sku-listings"
      - "POST /fulfillment/sku-listings/{id}/reinstate"
      - "POST /fulfillment/sku-listings/{id}/velocity-forecasts"
      - "POST /fulfillment/inbound-shipment-plans"
      - "POST /fulfillment/inbound-shipment-plans/{id}/line-items"
      - "POST /fulfillment/inbound-shipment-plans/{id}/confirm"
      - "POST /fulfillment/inbound-shipment-plans/{id}/revert-to-draft"
      - "POST /fulfillment/inbound-shipment-plans/{id}/ship"
      - "POST /fulfillment/inbound-shipment-plans/{id}/cancel"
      - "POST /fulfillment/removal-orders"
      - "POST /fulfillment/removal-orders/{id}/cancel"
      - "POST /fulfillment/reimbursement-claims"
      - "POST /fulfillment/reimbursement-claims/{id}/resubmit"
      - "POST /fulfillment/multi-channel-orders"
    shared_operations:
      - "GET /fulfillment/sellers/{id}"
      - "GET /fulfillment/sellers/{id}/sku-listings"
      - "GET /fulfillment/sellers/{id}/restock-quotas"
      - "GET /fulfillment/fulfillment-centers/{id}"
      - "GET /fulfillment/sku-listings/{id}"
      - "GET /fulfillment/sku-listings/{id}/line-items"
      - "GET /fulfillment/sku-listings/{id}/velocity-forecasts"
      - "GET /fulfillment/sku-listings/{id}/multi-channel-orders"
      - "GET /fulfillment/inbound-shipment-plans/{id}"
      - "GET /fulfillment/inbound-shipment-plans"
      - "GET /fulfillment/inbound-shipment-plans/{id}/line-items"
      - "GET /fulfillment/inventory-lots/{id}"
      - "GET /fulfillment/inventory-lots"
      - "GET /fulfillment/inventory-lots/{id}/storage-fee-assessments"
      - "GET /fulfillment/inventory-lots/{id}/removal-orders"
      - "GET /fulfillment/inventory-lots/{id}/reimbursement-claims"
      - "GET /fulfillment/removal-orders/{id}"
      - "GET /fulfillment/reimbursement-claims/{id}"
  - name: FcOperator
    description: "Acts for one fulfillment center: receives inbound shipments, classifies unfulfillable units, completes removals and manages receiving posture."
    identity: "entity_backed:FulfillmentCenter"
    exclusive_operations:
      - "POST /fulfillment/inbound-shipment-plans/{id}/receive"
      - "POST /fulfillment/inventory-lots/{id}/unfulfillable-classification"
      - "POST /fulfillment/removal-orders/{id}/complete"
    shared_operations:
      - "PATCH /fulfillment/fulfillment-centers/{id}"
      - "GET /fulfillment/fulfillment-centers/{id}"
      - "GET /fulfillment/sku-listings/{id}"
      - "GET /fulfillment/inbound-shipment-plans/{id}"
      - "GET /fulfillment/inbound-shipment-plans"
      - "GET /fulfillment/inbound-shipment-plans/{id}/line-items"
      - "GET /fulfillment/inventory-lots/{id}"
      - "GET /fulfillment/inventory-lots"
      - "GET /fulfillment/inventory-lots/{id}/removal-orders"
      - "GET /fulfillment/removal-orders/{id}"
  - name: ClaimsAdjudicator
    description: "Adjudicates reimbursement claims. Segregation of duties: cannot file or resubmit claims, and no other role can request info or decide."
    identity: opaque
    exclusive_operations:
      - "POST /fulfillment/reimbursement-claims/{id}/request-info"
      - "POST /fulfillment/reimbursement-claims/{id}/decide"
    shared_operations:
      - "GET /fulfillment/sellers/{id}"
      - "GET /fulfillment/sku-listings/{id}"
      - "GET /fulfillment/inventory-lots/{id}"
      - "GET /fulfillment/inventory-lots/{id}/reimbursement-claims"
      - "GET /fulfillment/reimbursement-claims/{id}"
  - name: MarketplaceAdmin
    description: "Platform operator: onboards sellers and fulfillment centers, sets quota periods, runs storage billing and moves the logical clock. Has no claim powers and no inventory powers."
    identity: opaque
    exclusive_operations:
      - "POST /fulfillment/sellers"
      - "POST /fulfillment/fulfillment-centers"
      - "POST /fulfillment/sellers/{id}/restock-quotas"
      - "POST /fulfillment/storage-billing-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "PATCH /fulfillment/fulfillment-centers/{id}"
      - "GET /fulfillment/sellers/{id}"
      - "GET /fulfillment/sellers/{id}/sku-listings"
      - "GET /fulfillment/sellers/{id}/restock-quotas"
      - "GET /fulfillment/fulfillment-centers/{id}"
      - "GET /fulfillment/sku-listings/{id}"
      - "GET /fulfillment/sku-listings/{id}/line-items"
      - "GET /fulfillment/sku-listings/{id}/velocity-forecasts"
      - "GET /fulfillment/sku-listings/{id}/multi-channel-orders"
      - "GET /fulfillment/inbound-shipment-plans/{id}"
      - "GET /fulfillment/inbound-shipment-plans"
      - "GET /fulfillment/inbound-shipment-plans/{id}/line-items"
      - "GET /fulfillment/inventory-lots/{id}"
      - "GET /fulfillment/inventory-lots"
      - "GET /fulfillment/inventory-lots/{id}/storage-fee-assessments"
      - "GET /fulfillment/inventory-lots/{id}/removal-orders"
      - "GET /fulfillment/inventory-lots/{id}/reimbursement-claims"
      - "GET /fulfillment/removal-orders/{id}"
      - "GET /fulfillment/reimbursement-claims/{id}"
