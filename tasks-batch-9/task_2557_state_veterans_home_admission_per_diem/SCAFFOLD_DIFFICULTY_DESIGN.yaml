          - entities.PerDiemClaim.fields.basis
          - entities.PerDiemClaim.fields.billable_day_count
          - entities.PerDiemClaim.fields.correction_generation
          - state_machines.PerDiemClaim.DRAFT_to_SUBMITTED
          - state_machines.PerDiemClaim.SUBMITTED_to_REJECTED
          - concurrency_rules[correcting-claim-stale-claim]
