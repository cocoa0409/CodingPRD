        distinguishing_aspect: |
          Category pair = business_safety vs business_temporal (distinct from the
          state-vs-fiscal pairing above). The create violates BOTH the fatigue rest block
          (safety, priority 6) and the half-open overlap rule (temporal, priority 8);
          ERR_FATIGUE_REST_REQUIRED must win.
        test_recipe:
