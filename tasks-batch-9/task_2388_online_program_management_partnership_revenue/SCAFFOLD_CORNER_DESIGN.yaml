              call: "POST /programs/${pg_id}/courses"
              payload:
                course_code: "MBA-590"
                title: "Partner Capstone Studio"
                credits: 3
                content_owner: "PARTNER"
                design_cost_cents: 1200000
                required_for_launch: true
                ip_license_grant_back: false
              as: PartnerAccountLead
