# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Deleting this file leaves
# the declared behaviour of the system identical.
scaffold_difficulty_design:

  # =======================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: billing_line_provisional_vs_final_charge_diverges
        grounds:
          - calculations.turn_service_charge
          - calculations.line_penalties
          - entities.BillingLine.fields.charged_ground_minutes
          - entities.BillingLine.fields.gross_amount_cents
          - entities.BillingLine.fields.net_amount_cents
          - state_machines.BillingPeriod.OPEN_to_PENDING_APPROVAL
        distinguishing_aspect: |
          This dual variant lives on the MONEY domain (BillingLine amounts derived from a Turn's
          clock times): the identical turn yields net_amount_cents 18000 under PROVISIONAL
          (scheduled ground time, no penalties) and 31416 under FINAL (actual ground time plus a
          12% handler-attributed OTP penalty).
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER, otp_tolerance_minutes 15, penalty_cap_cents 5000000."
            - "FlightBank AM1 is PUBLISHED with staffing_status APPROVED and planned_headcount 1."
            - "Turn LX318 is TOWING_ONLY, scheduled 06:00-06:20 (scheduled_ground_minutes 20 == standard 20, so excess is 0)."
            - "BillingPeriod 2026-04 is OPEN and carries one PROVISIONAL BillingLine for that turn."
            - "The turn then runs 06:00-06:38 (actual_ground_minutes 38, delay 18 minutes, delay_code GH_EQUIPMENT), so it completes DELAYED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER", otp_target_pct: 85.00, otp_tolerance_minutes: 15, gse_reposition_buffer_minutes: 20, penalty_cap_cents: 5000000, damage_penalty_multiplier: 1.00 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a1_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a1_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG", condition_score: 95, service_interval_cycles: 25, cycles_since_service: 0 }
              as: StationManager
              captures: { g1_id: $.data.id }
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
            - call: "POST /billing-periods"
              payload: { station_id: "${st_id}", period_code: "2026-04", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-30T23:59:00Z" }
              as: BillingController
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t1_id}", expected_billing_period_version: "${bp_v}" }
              as: BillingController
              captures: { bl_id: $.data.id }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
            - call: "GET /turns/${t1_id}"
              payload: {}
              as: DutyOfficer
              captures: { t1_v2: $.data.version }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "GSE", gse_unit_id: "${g1_id}", window_start: "2026-04-10T05:55:00Z", window_end: "2026-04-10T06:25:00Z", expected_turn_version: "${t1_v2}" }
              as: DutyOfficer
            - call: "POST /turns/${t1_id}/lifecycle"
              payload: { action: "START", actual_in: "2026-04-10T06:00:00Z" }
              as: DutyOfficer
            - call: "POST /turns/${t1_id}/lifecycle"
              payload: { action: "COMPLETE", actual_out: "2026-04-10T06:38:00Z", delay_code: "GH_EQUIPMENT" }
              as: DutyOfficer
          trigger:
            - call: "GET /billing-lines/${bl_id}"
              payload: {}
              as: BillingController
              captures: { prov_gross: $.data.gross_amount_cents, prov_net: $.data.net_amount_cents, prov_ground: $.data.charged_ground_minutes, prov_status: $.data.status }
            - call: "POST /billing-periods/${bp_id}/transitions"
              payload: { action: "FINALIZE" }
              as: BillingController
              as_user_id: "bc-01"
          assert:
            - "${prov_status} == PROVISIONAL"
            - "${prov_ground} == 20"
            - "${prov_gross} == 18000"
            - "${prov_net} == 18000"
            - "BillingLine.${bl_id}.status == FINAL"
            - "BillingLine.${bl_id}.charged_ground_minutes == 38"
            - "BillingLine.${bl_id}.excess_minutes == 18"
            - "BillingLine.${bl_id}.ground_time_tier == TIER_2"
            - "BillingLine.${bl_id}.gross_amount_cents == 35700"
            - "BillingLine.${bl_id}.otp_penalty_cents == 4284"
            - "BillingLine.${bl_id}.damage_penalty_cents == 0"
            - "BillingLine.${bl_id}.rebate_alloc_cents == 0"
            - "BillingLine.${bl_id}.net_amount_cents == 31416"
            - "BillingPeriod.${bp_id}.status == PENDING_APPROVAL"
            - "BillingPeriod.${bp_id}.gross_total_cents == 35700"
            - "BillingPeriod.${bp_id}.rebate_tier == NONE"
            - "BillingPeriod.${bp_id}.accrued_cents == 31416"
            - "BillingPeriod.${bp_id}.net_total_cents == 31416"
            - "Turn.${t1_id}.otp_result == DELAYED"

      - name: subcontractor_rolling_vs_audit_compliance_score_diverges
        grounds:
          - calculations.subcontractor_compliance_score
          - entities.Subcontractor.fields.compliance_score
          - entities.Subcontractor.fields.audit_compliance_score
          - entities.Subcontractor.fields.oversight_flag
          - state_machines.Incident.FINDINGS_ISSUED_to_CLOSED
        distinguishing_aspect: |
          This dual variant lives on the RISK domain of a different entity (Subcontractor
          oversight, not money): from the identical three-incident history the ROLLING variant
          reports compliance_score 92.50 (closed + subcontractor-liable only, age-decayed) while
          the AUDIT variant reports audit_compliance_score 40.00 (every linked incident, full
          weight, no decay).
        test_recipe:
          setup:
            - "Station ZRH is OPEN; Subcontractor 'Alpine Ramp AG' is APPROVED and employs agent E900."
            - "Incident A: NEAR_MISS, MINOR, occurred 2025-08-01, CLOSED with liability_party SUBCONTRACTOR."
            - "Incident B: PERSONAL_INJURY, MAJOR, occurred 2026-01-05, CLOSED with liability_party SUBCONTRACTOR."
            - "Incident C: PERSONAL_INJURY, CRITICAL, occurred 2026-04-01, still REPORTED (never investigated)."
            - "The logical clock finishes at 2026-04-15T00:00:00Z, so Incident A is 257 days old (decay 0.0) and Incident B is 100 days old (decay 0.5)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-07-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /subcontractors"
              payload: { station_id: "${st_id}", legal_name: "Alpine Ramp AG" }
              as: StationManager
              captures: { sc_id: $.data.id }
            - call: "POST /subcontractors/${sc_id}/oversight-decisions"
              payload: { decision: "APPROVE" }
              as: StationManager
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E900", full_name: "Bruno Sub", subcontractor_id: "${sc_id}" }
              as: StationManager
              captures: { a_sub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-08-02T00:00:00Z" }
              as: StationManager
            - call: "POST /incidents"
              payload: { station_id: "${st_id}", incident_type: "NEAR_MISS", severity: "MINOR", occurred_at: "2025-08-01T00:00:00Z", agent_id: "${a_sub_id}", description: "Wingtip clearance call" }
              as: DutyOfficer
              as_user_id: "duty-01"
              captures: { i_a_id: $.data.id }
            - call: "POST /incidents/${i_a_id}/transitions"
              payload: { action: "INVESTIGATE" }
              as: SafetyOfficer
              as_user_id: "safety-01"
            - call: "POST /incidents/${i_a_id}/transitions"
              payload: { action: "ISSUE_FINDINGS", root_cause_code: "SOP_DEVIATION", liability_party: "SUBCONTRACTOR" }
              as: SafetyOfficer
              as_user_id: "safety-01"
            - call: "POST /incidents/${i_a_id}/transitions"
              payload: { action: "CLOSE" }
              as: SafetyOfficer
              as_user_id: "safety-02"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-06T00:00:00Z" }
              as: StationManager
            - call: "POST /incidents"
              payload: { station_id: "${st_id}", incident_type: "PERSONAL_INJURY", severity: "MAJOR", occurred_at: "2026-01-05T00:00:00Z", agent_id: "${a_sub_id}", description: "Belt loader crush injury" }
              as: DutyOfficer
              as_user_id: "duty-01"
              captures: { i_b_id: $.data.id }
            - call: "POST /incidents/${i_b_id}/transitions"
              payload: { action: "INVESTIGATE" }
              as: SafetyOfficer
              as_user_id: "safety-01"
            - call: "POST /incidents/${i_b_id}/transitions"
              payload: { action: "ISSUE_FINDINGS", root_cause_code: "PPE_NOT_WORN", liability_party: "SUBCONTRACTOR" }
              as: SafetyOfficer
              as_user_id: "safety-01"
            - call: "POST /incidents/${i_b_id}/transitions"
              payload: { action: "CLOSE" }
              as: SafetyOfficer
              as_user_id: "safety-02"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-15T00:00:00Z" }
              as: StationManager
            - call: "POST /incidents"
              payload: { station_id: "${st_id}", incident_type: "PERSONAL_INJURY", severity: "CRITICAL", occurred_at: "2026-04-01T00:00:00Z", agent_id: "${a_sub_id}", description: "Fall from stand" }
              as: DutyOfficer
              as_user_id: "duty-01"
              captures: { i_c_id: $.data.id }
          trigger:
            - call: "GET /subcontractors/${sc_id}"
              payload: {}
              as: StationManager
              captures: { rolling: $.data.compliance_score, audit: $.data.audit_compliance_score, flag: $.data.oversight_flag, closed_cnt: $.data.closed_liable_incident_count, total_cnt: $.data.total_incident_count, sc_status: $.data.status }
          assert:
            - "${rolling} == 92.50"
            - "${audit} == 40.00"
            - "${rolling} != ${audit}"
            - "${closed_cnt} == 2"
            - "${total_cnt} == 3"
            - "${flag} == false"
            - "${sc_status} == APPROVED"
            - "Incident.${i_c_id}.status == REPORTED"
            - "Station.${st_id}.oversight_posture == RESTRICTED"

  # =======================================================================
  # Rule 2 - combinatorial formulas across different modes
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: turn_service_charge_four_input_nonlinear_mode_a
        grounds:
          - calculations.turn_service_charge
          - calculations.turn_requirement_matrix
          - entities.BillingLine.fields.ground_time_tier
          - entities.Station.fields.season_code
          - entities.Agent.fields.employment_type
        distinguishing_aspect: |
          MODE (a) - four inputs interacting non-linearly in one formula: a three-band marginal
          excess-minute rate, a WINTER season multiplier, a subcontract dilution factor and a
          min/max clamp at [base, 3*base]. With TOWING_ONLY, 22 excess minutes, WINTER and a
          SUBCONTRACTED agent the charge is exactly 45833 cents; the same shape at 45 excess
          minutes would compute 81567 and is clamped down to 54000.
        test_recipe:
          setup:
            - "Station GVA is OPEN with season_code WINTER (season multiplier 1.15)."
            - "Subcontractor 'Jet Handling Sarl' is APPROVED and employs the assigned agent, so the subcontract factor is 0.965."
            - "FlightBank W1 is PUBLISHED with staffing APPROVED and planned_headcount 1."
            - "Turn LX999 is TOWING_ONLY scheduled 06:00-06:20 and ran 06:00-06:42, i.e. actual_ground_minutes 42 and excess_minutes 22 (TIER_2)."
            - "delay_code WEATHER is recorded, so the turn is EXCLUDED from OTP and carries no penalty; the assertion isolates the gross formula."
            - "BillingPeriod 2026-04 is OPEN with a single line for that turn."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "GVA", name: "Geneva", handler_code: "MNZ", season_code: "WINTER", otp_target_pct: 85.00, otp_tolerance_minutes: 15, gse_reposition_buffer_minutes: 20, penalty_cap_cents: 5000000, damage_penalty_multiplier: 1.00 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /subcontractors"
              payload: { station_id: "${st_id}", legal_name: "Jet Handling Sarl" }
              as: StationManager
              captures: { sc_id: $.data.id }
            - call: "POST /subcontractors/${sc_id}/oversight-decisions"
              payload: { decision: "APPROVE" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "W1", season_code: "WINTER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX999", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E010", full_name: "Cleo Marin", subcontractor_id: "${sc_id}" }
              as: StationManager
              captures: { a_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG", condition_score: 90, service_interval_cycles: 25, cycles_since_service: 0 }
              as: StationManager
              captures: { g_id: $.data.id }
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "AGENT", agent_id: "${a_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:50:00Z", expected_turn_version: "${t_v}" }
              as: DutyOfficer
            - call: "GET /turns/${t_id}"
              payload: {}
              as: DutyOfficer
              captures: { t_v2: $.data.version }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "GSE", gse_unit_id: "${g_id}", window_start: "2026-04-10T05:55:00Z", window_end: "2026-04-10T06:45:00Z", expected_turn_version: "${t_v2}" }
              as: DutyOfficer
            - call: "POST /turns/${t_id}/lifecycle"
              payload: { action: "START", actual_in: "2026-04-10T06:00:00Z" }
              as: DutyOfficer
            - call: "POST /turns/${t_id}/lifecycle"
              payload: { action: "COMPLETE", actual_out: "2026-04-10T06:42:00Z", delay_code: "WEATHER" }
              as: DutyOfficer
            - call: "POST /billing-periods"
              payload: { station_id: "${st_id}", period_code: "2026-04", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-30T23:59:00Z" }
              as: BillingController
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t_id}", expected_billing_period_version: "${bp_v}" }
              as: BillingController
              captures: { bl_id: $.data.id }
          trigger:
            - call: "POST /billing-periods/${bp_id}/transitions"
              payload: { action: "FINALIZE" }
              as: BillingController
              as_user_id: "bc-01"
          assert:
            - "Turn.${t_id}.actual_ground_minutes == 42"
            - "Turn.${t_id}.delay_minutes == 22"
            - "Turn.${t_id}.otp_result == EXCLUDED"
            - "BillingLine.${bl_id}.excess_minutes == 22"
            - "BillingLine.${bl_id}.ground_time_tier == TIER_2"
            - "BillingLine.${bl_id}.base_rate_cents == 18000"
            - "BillingLine.${bl_id}.gross_amount_cents == 45833"
            - "BillingLine.${bl_id}.otp_penalty_cents == 0"
            - "BillingLine.${bl_id}.net_amount_cents == 45833"
            - "BillingPeriod.${bp_id}.gross_total_cents == 45833"
            - "BillingPeriod.${bp_id}.rebate_tier == NONE"
            - "BillingPeriod.${bp_id}.net_total_cents == 45833"
            - "Station.${st_id}.completed_turn_count == 0"
            - "Station.${st_id}.otp_rolling_pct == 100.00"

      - name: period_rebate_circular_evaluation_order_mode_c
        grounds:
          - calculations.period_billing_rollup
          - entities.BillingPeriod.fields.rebate_tier
          - entities.BillingPeriod.fields.rebate_cents
          - entities.BillingLine.fields.rebate_alloc_cents
          - state_machines.BillingPeriod.OPEN_to_PENDING_APPROVAL
        distinguishing_aspect: |
          MODE (c) - the circular-looking dependency: a line's net needs the rebate, the rebate
          needs the period gross, and the period gross is the sum of the line grosses. The pinned
          eight-step order resolves it, and the pair of lines is engineered to land the period
          gross on exactly 60000 cents, the inclusive TIER_A threshold, producing rebate_cents
          1800 split 1071 / 729 and accrued_cents 61800.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER, one directly-employed agent and one tug."
            - "FlightBank AM1 is PUBLISHED with staffing APPROVED and planned_headcount 2 (two TOWING_ONLY turns require 2)."
            - "Turn P ran 05:42-06:20 against a 06:00-06:20 schedule: actual_ground_minutes 38, excess 18, delay 0, ON_TIME, gross 35700."
            - "Turn Q ran 07:53-08:20 against a 08:00-08:20 schedule: actual_ground_minutes 27, excess 7, delay 0, ON_TIME, gross 24300."
            - "BillingPeriod 2026-04 is OPEN and carries a PROVISIONAL line for each turn."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER", otp_target_pct: 85.00, otp_tolerance_minutes: 15, gse_reposition_buffer_minutes: 20, penalty_cap_cents: 5000000, damage_penalty_multiplier: 1.00 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 2 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX101", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { tp_id: $.data.id, tp_v: $.data.version }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX202", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T08:00:00Z", scheduled_out: "2026-04-10T08:20:00Z" }
              as: DutyOfficer
              captures: { tq_id: $.data.id, tq_v: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a1_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a1_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
