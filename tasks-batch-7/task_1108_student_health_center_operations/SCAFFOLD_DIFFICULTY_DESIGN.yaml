scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: billing_provisional_vs_final_payer_split
        grounds:
          - calculations.invoice_payer_split
          - entities.Invoice.fields.variant
          - entities.InsurancePolicy.fields.deductible_met_cents
        distinguishing_aspect: |
          Entity domain = billing (Invoice/InsurancePolicy). PROVISIONAL at
          generation makes the patient pay 10000 (everything); FINAL at issue
          with a VERIFIED policy adjudicates to 8000 (copay 2500 + deductible
          5000 + coinsurance 500) for the SAME charge data.
        test_recipe:
          setup:
            - "Clock 2026-05-01; ENROLLED student; EXTERNAL policy (copay 2500, deductible 5000 met 0, coinsurance 0.2, coverage 2026-04-01..2027-03-31); provider; SPORTS_PHYSICAL appointment 2026-05-02 checked in"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S100", full_name: "Ann Able" }, as: HealthAdmin, captures: { stu: $.data.id, stu_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "EXTERNAL", policy_number: "EX-1", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 2500, deductible_cents: 5000, coinsurance_pct: 0.2, expected_student_version: "${stu_v}" }, as: BillingOfficer, captures: { pol: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr B", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
          trigger:
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 10000 } ] }, as: BillingOfficer, captures: { inv: $.data.id } }
            - { call: "POST /shc/insurance-policies/${pol}/verify", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/invoices/${inv}/issue", payload: {}, as: BillingOfficer }
            - { call: "GET /shc/students/${stu}/insurance-policies", payload: {}, as: Any }
          assert:
            - "Invoice.${inv} at trigger[0]: variant == PROVISIONAL, patient_responsibility_cents == 10000, insurer_pays_cents == 0"
            - "Invoice.${inv} at trigger[2]: variant == FINAL, patient_responsibility_cents == 8000, insurer_pays_cents == 2000, balance_cents == 8000, due_date == '2026-05-31'"
            - "trigger[3] $.data[0].deductible_met_cents == 5000"
            - "10000 != 8000 (provisional and final diverge on identical charge data)"

      - name: outbreak_rolling_vs_calendar_week_count
        grounds:
          - calculations.outbreak_case_count
          - entities.OutbreakInvestigation.fields.opened_case_count
        distinguishing_aspect: |
          Entity domain = surveillance (DiseaseCase/OutbreakInvestigation).
          Case confirm times 2026-05-11T22:00 (Mon), 2026-05-17T00:30 (Sun),
          2026-05-18T00:30 (next Mon): the rolling 168h window counts 3 and
          auto-opens the outbreak, while the ISO-calendar-week variant counts
          only 1 for the current week — identical case data, divergent counts.
        test_recipe:
          setup:
            - "Three MEASLES cases confirmed at 2026-05-11T22:00:00Z, 2026-05-17T00:30:00Z, 2026-05-18T00:30:00Z via full lab-order chains"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T22:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/providers", payload: { full_name: "Dr C", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S201", full_name: "Case One" }, as: HealthAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s1}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T23:00:00Z", scheduled_end: "2026-05-11T23:30:00Z" }, as: FrontDeskStaff, captures: { a1: $.data.id } }
            - { call: "POST /shc/appointments/${a1}/check-in", payload: {}, as: FrontDeskStaff, captures: { e1: $.data.id } }
            - { call: "POST /shc/encounters/${e1}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l1: $.data.id } }
            - { call: "POST /shc/lab-orders/${l1}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l1}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l1}/disease-cases", payload: {}, as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /shc/disease-cases/${c1}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-17T00:30:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S202", full_name: "Case Two" }, as: HealthAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s2}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-17T01:00:00Z", scheduled_end: "2026-05-17T01:30:00Z" }, as: FrontDeskStaff, captures: { a2: $.data.id } }
            - { call: "POST /shc/appointments/${a2}/check-in", payload: {}, as: FrontDeskStaff, captures: { e2: $.data.id } }
            - { call: "POST /shc/encounters/${e2}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l2: $.data.id } }
            - { call: "POST /shc/lab-orders/${l2}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l2}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l2}/disease-cases", payload: {}, as: Any, captures: { c2: "$.data[0].id" } }
            - { call: "POST /shc/disease-cases/${c2}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "GET /shc/outbreak-investigations", payload: { disease_code: "MEASLES" }, as: Any }
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-18T00:30:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S203", full_name: "Case Three" }, as: HealthAdmin, captures: { s3: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s3}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-18T01:00:00Z", scheduled_end: "2026-05-18T01:30:00Z" }, as: FrontDeskStaff, captures: { a3: $.data.id } }
            - { call: "POST /shc/appointments/${a3}/check-in", payload: {}, as: FrontDeskStaff, captures: { e3: $.data.id } }
            - { call: "POST /shc/encounters/${e3}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l3: $.data.id } }
            - { call: "POST /shc/lab-orders/${l3}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l3}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l3}/disease-cases", payload: {}, as: Any, captures: { c3: "$.data[0].id" } }
          trigger:
            - { call: "POST /shc/disease-cases/${c3}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "GET /shc/outbreak-investigations", payload: { disease_code: "MEASLES" }, as: Any }
          assert:
            - "setup_api_calls[19] (GET outbreaks after 2 confirms): list is empty — count 2 < 3"
            - "trigger[1]: exactly 1 OutbreakInvestigation; status == ACTIVE; opened_case_count == 3; opened_at == 2026-05-18T00:30:00Z (confirm clock)"
            - "Rolling 168h window [2026-05-11T00:30:00Z, 2026-05-18T00:30:00Z] contains all 3 confirmations (22:00 Mon, 00:30 Sun, 00:30 next Mon); the ISO-week variant would count only 1 for the week of 2026-05-18, so the auto-open proves the rolling variant drives"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: payer_split_nested_min_max_clipping
        grounds:
          - calculations.invoice_payer_split
        distinguishing_aspect: |
          Mode (a): 5 inputs (charge_total, copay, deductible, deductible_met,
          coinsurance) with nested min/max — here after_copay (500) clips the
          deductible (min(500, 5000) = 500) and zeroes the coinsurance base,
          so insurer_pays == 0 and patient == 3000.
        test_recipe:
          setup:
            - "Clock 2026-05-01; student with VERIFIED EXTERNAL policy (copay 2500, deductible 5000, coins 0.2); SPORTS_PHYSICAL encounter open"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S300", full_name: "Clip Test" }, as: HealthAdmin, captures: { stu: $.data.id, stu_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "EXTERNAL", policy_number: "EX-2", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 2500, deductible_cents: 5000, coinsurance_pct: 0.2, expected_student_version: "${stu_v}" }, as: BillingOfficer, captures: { pol: $.data.id } }
            - { call: "POST /shc/insurance-policies/${pol}/verify", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/providers", payload: { full_name: "Dr D", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
          trigger:
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 3000 } ] }, as: BillingOfficer, captures: { inv: $.data.id } }
            - { call: "POST /shc/invoices/${inv}/issue", payload: {}, as: BillingOfficer }
            - { call: "GET /shc/students/${stu}/insurance-policies", payload: {}, as: Any }
          assert:
            - "Invoice.${inv} FINAL: charge_total_cents == 3000, patient_responsibility_cents == 3000, insurer_pays_cents == 0"
            - "derivation: after_copay = max(0, 3000-2500) = 500; ded_applied = min(500, 5000) = 500; coins_base = 0; coins_patient = 0; patient = 2500+500+0 = 3000"
            - "trigger[2] $.data[0].deductible_met_cents == 500"

      - name: per_line_subsidy_rounding_then_sum
        grounds:
          - calculations.invoice_line_subsidy_rounding
          - entities.Invoice.fields.subsidy_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned per-line-then-sum. Two 3333-cent
          TRAVEL_VACCINE lines at 50% yield 1667+1667 = 3334 subsidy; the
          rejected sum-then-round reading yields round(6666*0.5) = 3333.
        test_recipe:
          setup:
            - "Clock 2026-05-01; OPEN pool budget 100000; student with VERIFIED EXTERNAL policy (all zeros); TRAVEL_CLINIC encounter open"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/health-fee-pools", payload: { term_code: "SP26", budget_cents: 100000, term_end_date: "2026-08-31" }, as: HealthAdmin, captures: { pool: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S301", full_name: "Round Test" }, as: HealthAdmin, captures: { stu: $.data.id, stu_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "EXTERNAL", policy_number: "EX-3", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${stu_v}" }, as: BillingOfficer, captures: { pol: $.data.id } }
            - { call: "POST /shc/insurance-policies/${pol}/verify", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/providers", payload: { full_name: "Dr E", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "TRAVEL_CLINIC", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
          trigger:
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "TRAVEL_VACCINE", charge_cents: 3333 }, { service_category: "TRAVEL_VACCINE", charge_cents: 3333 }, { service_category: "CONSULT", charge_cents: 5000 } ] }, as: BillingOfficer, captures: { inv: $.data.id } }
            - { call: "GET /shc/health-fee-pools", payload: { term_code: "SP26" }, as: Any }
          assert:
            - "Invoice.${inv}: subsidy_cents == 3334 (1667 + 1667 + 0), charge_total_cents == 8332 (1666 + 1666 + 5000)"
            - "Invoice.${inv}: variant == PROVISIONAL, patient_responsibility_cents == 8332"
            - "trigger[1] $.data[0].spent_cents == 3334"
            - "sum-then-round alternative (3333 subsidy / 8333 total) is rejected"

      - name: pool_waterfall_snapshot_evaluation_order
        grounds:
          - calculations.pool_subsidy_waterfall
          - entities.HealthFeePool.fields.exhausted
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — subsidy reduces the pool
          remaining that bounds the subsidy. Pinned order: snapshot remaining
          at invoice start, waterfall lines in request order, debit pool once.
          Invoice 2 gets min(5000, 2000) = 2000, not a recomputed value.
        test_recipe:
          setup:
            - "Clock 2026-05-01; OPEN pool budget 10000; student with VERIFIED EXTERNAL zero-policy; three TRAVEL_CLINIC encounters open"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/health-fee-pools", payload: { term_code: "SP26", budget_cents: 10000, term_end_date: "2026-08-31" }, as: HealthAdmin, captures: { pool: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S302", full_name: "Water Fall" }, as: HealthAdmin, captures: { stu: $.data.id, stu_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "EXTERNAL", policy_number: "EX-4", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${stu_v}" }, as: BillingOfficer, captures: { pol: $.data.id } }
            - { call: "POST /shc/insurance-policies/${pol}/verify", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/providers", payload: { full_name: "Dr F", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "TRAVEL_CLINIC", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt1: $.data.id } }
            - { call: "POST /shc/appointments/${appt1}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc1: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "TRAVEL_CLINIC", scheduled_start: "2026-05-03T10:00:00Z", scheduled_end: "2026-05-03T10:30:00Z" }, as: FrontDeskStaff, captures: { appt2: $.data.id } }
            - { call: "POST /shc/appointments/${appt2}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc2: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "TRAVEL_CLINIC", scheduled_start: "2026-05-04T10:00:00Z", scheduled_end: "2026-05-04T10:30:00Z" }, as: FrontDeskStaff, captures: { appt3: $.data.id } }
            - { call: "POST /shc/appointments/${appt3}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc3: $.data.id } }
          trigger:
            - { call: "POST /shc/encounters/${enc1}/invoice", payload: { lines: [ { service_category: "TRAVEL_VACCINE", charge_cents: 16000 } ] }, as: BillingOfficer, captures: { inv1: $.data.id } }
            - { call: "POST /shc/encounters/${enc2}/invoice", payload: { lines: [ { service_category: "TRAVEL_VACCINE", charge_cents: 10000 } ] }, as: BillingOfficer, captures: { inv2: $.data.id } }
            - { call: "POST /shc/encounters/${enc3}/invoice", payload: { lines: [ { service_category: "TRAVEL_VACCINE", charge_cents: 4000 } ] }, as: BillingOfficer, captures: { inv3: $.data.id } }
            - { call: "GET /shc/health-fee-pools", payload: { term_code: "SP26" }, as: Any }
          assert:
            - "Invoice.${inv1}: subsidy_cents == 8000 (tentative 8000, snapshot remaining 10000)"
            - "Invoice.${inv2}: subsidy_cents == 2000 (tentative 5000 capped by snapshot remaining 2000), charge_total_cents == 8000"
            - "Invoice.${inv3}: subsidy_cents == 0, charge_total_cents == 4000"
            - "trigger[3] $.data[0].spent_cents == 10000 and exhausted == true"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: outbreak_contain_reopen_cycle
        grounds:
          - state_machines.OutbreakInvestigation
        distinguishing_aspect: |
          Cyclic machine on OutbreakInvestigation: ACTIVE -> CONTAINED ->
          ACTIVE (reopen) -> CONTAINED -> CLOSED revisits ACTIVE, unlike any
          linear pipeline.
        test_recipe:
          setup:
            - "Three MEASLES cases confirmed at the same clock time -> outbreak auto-opened ACTIVE"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T12:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/providers", payload: { full_name: "Dr G", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S401", full_name: "Cyc One" }, as: HealthAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s1}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T13:00:00Z", scheduled_end: "2026-05-11T13:30:00Z" }, as: FrontDeskStaff, captures: { a1: $.data.id } }
            - { call: "POST /shc/appointments/${a1}/check-in", payload: {}, as: FrontDeskStaff, captures: { e1: $.data.id } }
            - { call: "POST /shc/encounters/${e1}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l1: $.data.id } }
            - { call: "POST /shc/lab-orders/${l1}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l1}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l1}/disease-cases", payload: {}, as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /shc/disease-cases/${c1}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "POST /shc/students", payload: { external_ref: "S402", full_name: "Cyc Two" }, as: HealthAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s2}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T14:00:00Z", scheduled_end: "2026-05-11T14:30:00Z" }, as: FrontDeskStaff, captures: { a2: $.data.id } }
            - { call: "POST /shc/appointments/${a2}/check-in", payload: {}, as: FrontDeskStaff, captures: { e2: $.data.id } }
            - { call: "POST /shc/encounters/${e2}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l2: $.data.id } }
            - { call: "POST /shc/lab-orders/${l2}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l2}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l2}/disease-cases", payload: {}, as: Any, captures: { c2: "$.data[0].id" } }
            - { call: "POST /shc/disease-cases/${c2}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "POST /shc/students", payload: { external_ref: "S403", full_name: "Cyc Three" }, as: HealthAdmin, captures: { s3: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s3}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T15:00:00Z", scheduled_end: "2026-05-11T15:30:00Z" }, as: FrontDeskStaff, captures: { a3: $.data.id } }
            - { call: "POST /shc/appointments/${a3}/check-in", payload: {}, as: FrontDeskStaff, captures: { e3: $.data.id } }
            - { call: "POST /shc/encounters/${e3}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l3: $.data.id } }
            - { call: "POST /shc/lab-orders/${l3}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l3}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l3}/disease-cases", payload: {}, as: Any, captures: { c3: "$.data[0].id" } }
            - { call: "POST /shc/disease-cases/${c3}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "GET /shc/outbreak-investigations", payload: { disease_code: "MEASLES" }, as: Any, captures: { ob: "$.data[0].id" } }
          trigger:
            - { call: "POST /shc/outbreak-investigations/${ob}/contain", payload: {}, as: HealthAdmin }
            - { call: "POST /shc/outbreak-investigations/${ob}/reopen", payload: {}, as: HealthAdmin }
            - { call: "POST /shc/outbreak-investigations/${ob}/contain", payload: {}, as: HealthAdmin }
            - { call: "POST /shc/disease-cases/${c1}/resolve", payload: {}, as: Clinician }
            - { call: "POST /shc/disease-cases/${c2}/resolve", payload: {}, as: Clinician }
            - { call: "POST /shc/disease-cases/${c3}/resolve", payload: {}, as: Clinician }
            - { call: "POST /shc/outbreak-investigations/${ob}/close", payload: {}, as: HealthAdmin }
          assert:
            - "trigger[0] status == CONTAINED (ACTIVE -> CONTAINED)"
            - "trigger[1] status == ACTIVE (CONTAINED -> ACTIVE cycle revisit)"
            - "trigger[2] status == CONTAINED (second pass through the same transition)"
            - "trigger[6] status == CLOSED after all 3 cases RESOLVED"

      - name: prescription_partial_dispense_self_loop
        grounds:
          - state_machines.Prescription
        distinguishing_aspect: |
          Non-linear machine on Prescription: PARTIALLY_DISPENSED ->
          PARTIALLY_DISPENSED self-loop (repeatable partial dispense), a
          different entity than OutbreakInvestigation's cycle.
        test_recipe:
          setup:
            - "Clock 2026-05-01; ENROLLED student; urgent encounter open; stock 100 units threshold 5; prescription for 5 units"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S410", full_name: "Self Loop" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr H", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "AMOX500", medication_name: "Amoxicillin 500", initial_on_hand: 100, reorder_threshold: 5 }, as: Pharmacist, captures: { stk: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 5 }, as: Clinician, captures: { rx: $.data.id } }
          trigger:
            - { call: "POST /shc/prescriptions/${rx}/dispense", payload: { quantity: 2 }, as: Pharmacist }
            - { call: "POST /shc/prescriptions/${rx}/dispense", payload: { quantity: 2 }, as: Pharmacist }
            - { call: "POST /shc/prescriptions/${rx}/dispense", payload: { quantity: 1 }, as: Pharmacist }
          assert:
            - "trigger[0]: status == PARTIALLY_DISPENSED, quantity_dispensed == 2"
            - "trigger[1]: status == PARTIALLY_DISPENSED (self-loop), quantity_dispensed == 4"
            - "trigger[2]: status == DISPENSED, quantity_dispensed == 5"

  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: sweep_overdue_invoice_to_elective_cancellation
        grounds:
          - state_machines.Invoice
          - state_machines.Appointment
          - calculations.compliance_posture_derivation
        distinguishing_aspect: |
          Depth-3 chain triggered by the clock sweep (different trigger than
          the dispense cascade): invoice ISSUED -> OVERDUE mutates Invoice,
          which itself recomputes Student posture to REGISTRATION_HOLD, which
          itself auto-cancels the student's future BOOKED SPORTS_PHYSICAL
          appointment (cancel_reason HOLD) while the urgent booking survives.
        test_recipe:
          setup:
            - "Clock 2026-05-01; student; chargeable sports encounter billed 5000 self-pay and ISSUED (due 2026-05-31); future sports appointment 2026-06-10 and future urgent appointment 2026-06-10 both BOOKED"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S500", full_name: "Cascade Kid" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr I", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { apptC: $.data.id } }
            - { call: "POST /shc/appointments/${apptC}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T10:30:00Z" }, as: FrontDeskStaff, captures: { apptA: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-06-10T11:00:00Z", scheduled_end: "2026-06-10T11:30:00Z" }, as: FrontDeskStaff, captures: { apptB: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 5000 } ] }, as: BillingOfficer, captures: { inv: $.data.id } }
            - { call: "POST /shc/invoices/${inv}/issue", payload: {}, as: BillingOfficer }
          trigger:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "GET /shc/invoices/${inv}", payload: {}, as: Any }
            - { call: "GET /shc/students/${stu}", payload: {}, as: Any }
            - { call: "GET /shc/appointments/${apptA}", payload: {}, as: Any }
            - { call: "GET /shc/appointments/${apptB}", payload: {}, as: Any }
          assert:
            - "trigger[1]: Invoice.${inv}.status == OVERDUE (due_date 2026-05-31 < 2026-06-01, balance 5000 > 0)"
            - "trigger[2]: Student.compliance_posture == REGISTRATION_HOLD and active_hold_types contains FINANCIAL"
            - "trigger[3]: Appointment.${apptA}.status == CANCELLED and cancel_reason == HOLD (elective, scheduled 2026-06-10 > sweep time)"
            - "trigger[4]: Appointment.${apptB}.status == BOOKED (urgent visits are never cascade-cancelled)"

      - name: dispense_decrement_to_reorder_flag
        grounds:
          - state_machines.Prescription
          - calculations.stock_reorder_flag
          - entities.MedicationStock.fields.needs_reorder
        distinguishing_aspect: |
          Depth-2 chain triggered by dispense (different trigger than the
          clock sweep): dispense mutates MedicationStock.on_hand (10 -> 4),
          and that mutation itself recomputes needs_reorder to true at the
          inclusive boundary (4 <= 4).
        test_recipe:
          setup:
            - "Clock 2026-05-01; ENROLLED student; urgent encounter open; stock initial 10 threshold 4; prescription for 6 units"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S501", full_name: "Reorder Test" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr J", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "IBU200", medication_name: "Ibuprofen 200", initial_on_hand: 10, reorder_threshold: 4 }, as: Pharmacist, captures: { stk: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 6 }, as: Clinician, captures: { rx: $.data.id } }
          trigger:
            - { call: "POST /shc/prescriptions/${rx}/dispense", payload: { quantity: 6 }, as: Pharmacist }
            - { call: "GET /shc/medication-stocks", payload: { medication_code: "IBU200" }, as: Any }
          assert:
            - "trigger[0]: Prescription.${rx}.status == DISPENSED, quantity_dispensed == 6"
            - "trigger[1] $.data[0].on_hand == 4 and needs_reorder == true (boundary: 4 <= 4 inclusive)"

  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispense_state_beats_stock_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_PRESCRIPTION_NOT_DISPENSABLE]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: dispensing 5 units from a
          CANCELLED prescription against a stock of 1 violates both
          ERR_PRESCRIPTION_NOT_DISPENSABLE (P4) and ERR_INSUFFICIENT_STOCK
          (P9); the state error must win.
        test_recipe:
          setup:
            - "Clock 2026-05-01; urgent encounter open; stock with 1 unit; prescription for 5 units cancelled while WRITTEN"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S600", full_name: "Prio One" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr K", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "RARE1", medication_name: "Rare Drug", initial_on_hand: 1, reorder_threshold: 0 }, as: Pharmacist, captures: { stk: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 5 }, as: Clinician, captures: { rx: $.data.id } }
            - { call: "POST /shc/prescriptions/${rx}/cancel", payload: {}, as: Clinician }
          trigger:
            - { call: "POST /shc/prescriptions/${rx}/dispense", payload: { quantity: 5 }, as: Pharmacist, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0] response: HTTP 409 and error_id == ERR_PRESCRIPTION_NOT_DISPENSABLE (state P4 beats fiscal P9, even though 5 > 1 also fails ERR_INSUFFICIENT_STOCK)"

      - name: booking_hold_safety_beats_slot_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_COMPLIANCE_HOLD_ACTIVE]
          - errors[ERR_SLOT_CONFLICT]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: a
          REGISTRATION_HOLD student booking SPORTS_PHYSICAL into an occupied
          slot violates both ERR_COMPLIANCE_HOLD_ACTIVE (P5) and
          ERR_SLOT_CONFLICT (P6); the safety error must win.
        test_recipe:
          setup:
            - "Student S1 with an OVERDUE MMR record (deadline 2026-05-10, grace 5; clock 2026-05-16 -> REGISTRATION_HOLD); provider; another student's BOOKED appointment occupies 2026-06-01T10:00-10:30"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/immunization-requirements", payload: { vaccine_code: "MMR", required_doses: 2, min_interval_days: 28, deadline_date: "2026-05-10", grace_period_days: 5 }, as: HealthAdmin, captures: { req: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S601", full_name: "Held Student" }, as: HealthAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shc/immunization-records", payload: { student_id: "${s1}", requirement_id: "${req}" }, as: Nurse }
            - { call: "POST /shc/providers", payload: { full_name: "Dr L", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S602", full_name: "Other Student" }, as: HealthAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s2}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T10:30:00Z" }, as: FrontDeskStaff }
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: HealthAdmin }
            - { call: "GET /shc/students/${s1}", payload: {}, as: Any }
          trigger:
            - { call: "POST /shc/appointments", payload: { student_id: "${s1}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-06-01T10:15:00Z", scheduled_end: "2026-06-01T10:45:00Z" }, as: FrontDeskStaff, captures: { err: $.data.error_id } }
          assert:
            - "setup_api_calls[8]: Student.compliance_posture == REGISTRATION_HOLD and active_hold_types contains IMMUNIZATION"
            - "trigger[0] response: HTTP 403 and error_id == ERR_COMPLIANCE_HOLD_ACTIVE (safety P5 beats temporal P6 slot conflict)"

  # ------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics & endpoints)
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: dispense_exactly_on_hand_empties_stock
        grounds:
          - state_machines.Prescription
          - calculations.stock_reorder_flag
        distinguishing_aspect: |
          Metric = stock units, endpoint = POST /shc/prescriptions/{id}/dispense.
          quantity == on_hand (10) is allowed (<= semantics): on_hand lands
          exactly 0, prescription DISPENSED, needs_reorder true (0 <= 4).
        test_recipe:
          setup:
            - "Clock 2026-05-01; urgent encounter open; stock initial 10 threshold 4; prescription for 10 units"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S700", full_name: "Edge Units" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr M", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "CIPRO", medication_name: "Ciprofloxacin", initial_on_hand: 10, reorder_threshold: 4 }, as: Pharmacist, captures: { stk: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 10 }, as: Clinician, captures: { rx: $.data.id } }
          trigger:
            - { call: "POST /shc/prescriptions/${rx}/dispense", payload: { quantity: 10 }, as: Pharmacist }
            - { call: "GET /shc/medication-stocks", payload: { medication_code: "CIPRO" }, as: Any }
          assert:
            - "trigger[0]: HTTP 200, status == DISPENSED, quantity_dispensed == 10 (quantity == on_hand is allowed)"
            - "trigger[1] $.data[0].on_hand == 0 and needs_reorder == true"

      - name: outbreak_third_case_is_the_boundary
        grounds:
          - calculations.outbreak_case_count
          - state_machines.OutbreakInvestigation
        distinguishing_aspect: |
          Metric = confirmed case count, endpoint =
          POST /shc/disease-cases/{id}/confirm. Exactly 2 cases opens nothing;
          the 3rd (>= 3) auto-opens with opened_case_count == 3.
        test_recipe:
          setup:
            - "Clock fixed at 2026-05-11T12:00:00Z; provider; two MEASLES cases already CONFIRMED; third case SUSPECTED ready to confirm"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T12:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/providers", payload: { full_name: "Dr N", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S701", full_name: "B One" }, as: HealthAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s1}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T13:00:00Z", scheduled_end: "2026-05-11T13:30:00Z" }, as: FrontDeskStaff, captures: { a1: $.data.id } }
            - { call: "POST /shc/appointments/${a1}/check-in", payload: {}, as: FrontDeskStaff, captures: { e1: $.data.id } }
            - { call: "POST /shc/encounters/${e1}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l1: $.data.id } }
            - { call: "POST /shc/lab-orders/${l1}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l1}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l1}/disease-cases", payload: {}, as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /shc/disease-cases/${c1}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "POST /shc/students", payload: { external_ref: "S702", full_name: "B Two" }, as: HealthAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s2}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T14:00:00Z", scheduled_end: "2026-05-11T14:30:00Z" }, as: FrontDeskStaff, captures: { a2: $.data.id } }
            - { call: "POST /shc/appointments/${a2}/check-in", payload: {}, as: FrontDeskStaff, captures: { e2: $.data.id } }
            - { call: "POST /shc/encounters/${e2}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l2: $.data.id } }
            - { call: "POST /shc/lab-orders/${l2}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l2}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l2}/disease-cases", payload: {}, as: Any, captures: { c2: "$.data[0].id" } }
            - { call: "POST /shc/disease-cases/${c2}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "GET /shc/outbreak-investigations", payload: { disease_code: "MEASLES" }, as: Any }
            - { call: "POST /shc/students", payload: { external_ref: "S703", full_name: "B Three" }, as: HealthAdmin, captures: { s3: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s3}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T15:00:00Z", scheduled_end: "2026-05-11T15:30:00Z" }, as: FrontDeskStaff, captures: { a3: $.data.id } }
            - { call: "POST /shc/appointments/${a3}/check-in", payload: {}, as: FrontDeskStaff, captures: { e3: $.data.id } }
            - { call: "POST /shc/encounters/${e3}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l3: $.data.id } }
            - { call: "POST /shc/lab-orders/${l3}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l3}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l3}/disease-cases", payload: {}, as: Any, captures: { c3: "$.data[0].id" } }
          trigger:
            - { call: "POST /shc/disease-cases/${c3}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "GET /shc/outbreak-investigations", payload: { disease_code: "MEASLES" }, as: Any }
          assert:
            - "setup_api_calls[18] (after 2 confirms): outbreak list is empty (2 < 3 does not open)"
            - "trigger[1]: exactly 1 investigation, status == ACTIVE, opened_case_count == 3 (>= 3 boundary crossed by the third confirm)"

  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: clearance_gated_by_student_posture
        grounds:
          - state_machines.Encounter
          - calculations.compliance_posture_derivation
          - errors[ERR_CLEARANCE_BLOCKED]
        distinguishing_aspect: |
          Pair Encounter -> Student: closing a SPORTS_PHYSICAL encounter with
          clearance_outcome CLEARED is valid only when the linked Student's
          derived compliance_posture == CLEAR; REGISTRATION_HOLD blocks it
          with 403 while NOT_CLEARED still succeeds.
        test_recipe:
          setup:
            - "Student with MMR record PENDING (deadline 2026-05-10, grace 5); SPORTS_PHYSICAL encounter OPEN with a coded invoice; clock advanced to 2026-05-16 so the record is OVERDUE and posture REGISTRATION_HOLD"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/immunization-requirements", payload: { vaccine_code: "MMR", required_doses: 2, min_interval_days: 28, deadline_date: "2026-05-10", grace_period_days: 5 }, as: HealthAdmin, captures: { req: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S800", full_name: "Clearance Test" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/immunization-records", payload: { student_id: "${stu}", requirement_id: "${req}" }, as: Nurse }
            - { call: "POST /shc/providers", payload: { full_name: "Dr O", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-08T10:00:00Z", scheduled_end: "2026-05-08T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 3000 } ] }, as: BillingOfficer }
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: HealthAdmin }
            - { call: "GET /shc/students/${stu}", payload: {}, as: Any }
          trigger:
            - { call: "POST /shc/encounters/${enc}/close", payload: { clearance_outcome: "CLEARED" }, as: Clinician, captures: { err: $.data.error_id } }
            - { call: "POST /shc/encounters/${enc}/close", payload: { clearance_outcome: "NOT_CLEARED" }, as: Clinician }
            - { call: "GET /shc/appointments/${appt}", payload: {}, as: Any }
          assert:
            - "setup_api_calls[9]: Student.compliance_posture == REGISTRATION_HOLD"
            - "trigger[0]: HTTP 403, error_id == ERR_CLEARANCE_BLOCKED"
            - "trigger[1]: HTTP 200, Encounter.status == CLOSED, clearance_outcome == NOT_CLEARED"
            - "trigger[2]: Appointment.${appt}.status == COMPLETED"

      - name: after_hours_referral_gated_by_oncall_shift
        grounds:
          - state_machines.Referral
          - errors[ERR_NO_ONCALL_COVERAGE]
          - entities.Referral.fields.after_hours
        distinguishing_aspect: |
          Pair Referral -> OnCallShift: a referral created outside
          [08:00, 17:00) UTC is rejected unless an OnCallShift covering now
          exists; the same referral during business hours needs no shift.
        test_recipe:
          setup:
            - "Clock 2026-05-01T20:00:00Z (after hours); urgent encounter open; no on-call shift yet"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T20:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S801", full_name: "Night Owl" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr P", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-01T21:00:00Z", scheduled_end: "2026-05-01T21:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr Q", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov2: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov2}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: FrontDeskStaff, captures: { appt2: $.data.id } }
          trigger:
            - { call: "POST /shc/encounters/${enc}/referrals", payload: { hospital_name: "General", reason: "observation" }, as: Clinician, captures: { err: $.data.error_id } }
            - { call: "POST /shc/on-call-shifts", payload: { provider_id: "${prov}", shift_start: "2026-05-01T18:00:00Z", shift_end: "2026-05-02T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/encounters/${enc}/referrals", payload: { hospital_name: "General", reason: "observation" }, as: Clinician, captures: { ref1: $.data.id } }
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/appointments/${appt2}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc2: $.data.id } }
            - { call: "POST /shc/encounters/${enc2}/referrals", payload: { hospital_name: "General", reason: "follow-up" }, as: Clinician, captures: { ref2: $.data.id } }
          assert:
            - "trigger[0]: HTTP 409, error_id == ERR_NO_ONCALL_COVERAGE (20:00 outside [08:00, 17:00), no covering shift)"
            - "trigger[2]: HTTP 201, Referral.${ref1}.status == INITIATED and after_hours == true (shift 18:00-24:00 covers 20:00)"
            - "trigger[5]: HTTP 201, Referral.${ref2}.after_hours == false (10:00 is business hours; shift no longer needed)"

  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_half_open_intervals_allow_adjacency
        grounds:
          - errors[ERR_SLOT_CONFLICT]
          - entities.Appointment.fields.scheduled_start
        distinguishing_aspect: |
          Resource Appointment/Provider, HALF-OPEN [start, end) semantics:
          10:15-10:45 collides with a 10:00-10:30 booking, but a new booking
          starting exactly at 10:30 (end of the existing one) is allowed.
        test_recipe:
          setup:
            - "Clock 2026-05-01; provider; two students; existing BOOKED appointment 2026-06-01T10:00-10:30"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S900", full_name: "Slot One" }, as: HealthAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S901", full_name: "Slot Two" }, as: HealthAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr R", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s1}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T10:30:00Z" }, as: FrontDeskStaff, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /shc/appointments", payload: { student_id: "${s2}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-06-01T10:15:00Z", scheduled_end: "2026-06-01T10:45:00Z" }, as: FrontDeskStaff, captures: { err: $.data.error_id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s2}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-06-01T10:30:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: FrontDeskStaff, captures: { a3: $.data.id } }
          assert:
            - "trigger[0]: HTTP 409, error_id == ERR_SLOT_CONFLICT (10:15 < 10:30 overlap)"
            - "trigger[1]: HTTP 201, Appointment.${a3}.status == BOOKED (start == existing end is NOT a conflict under half-open semantics)"

      - name: oncall_closed_interval_and_rest_buffer
        grounds:
          - errors[ERR_ONCALL_OVERLAP]
          - errors[ERR_ONCALL_REST_VIOLATION]
          - entities.OnCallShift.fields.shift_end
        distinguishing_aspect: |
          Resource OnCallShift/Provider with DIFFERENT interval semantics than
          appointments: CLOSED intervals (a shift starting exactly when another
          ends conflicts) PLUS a 12h rest buffer (gap 6h rejected, gap exactly
          12h allowed). Overlap is evaluated before the rest buffer.
        test_recipe:
          setup:
            - "Clock 2026-05-01; provider with an existing shift 2026-06-05T18:00 to 2026-06-06T00:00"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/providers", payload: { full_name: "Dr S", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/on-call-shifts", payload: { provider_id: "${prov}", shift_start: "2026-06-05T18:00:00Z", shift_end: "2026-06-06T00:00:00Z" }, as: HealthAdmin, captures: { sh1: $.data.id } }
          trigger:
            - { call: "POST /shc/on-call-shifts", payload: { provider_id: "${prov}", shift_start: "2026-06-05T23:00:00Z", shift_end: "2026-06-06T05:00:00Z" }, as: HealthAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/on-call-shifts", payload: { provider_id: "${prov}", shift_start: "2026-06-06T00:00:00Z", shift_end: "2026-06-06T06:00:00Z" }, as: HealthAdmin, captures: { err2: $.data.error_id } }
            - { call: "POST /shc/on-call-shifts", payload: { provider_id: "${prov}", shift_start: "2026-06-06T06:00:00Z", shift_end: "2026-06-06T12:00:00Z" }, as: HealthAdmin, captures: { err3: $.data.error_id } }
            - { call: "POST /shc/on-call-shifts", payload: { provider_id: "${prov}", shift_start: "2026-06-06T12:00:00Z", shift_end: "2026-06-06T18:00:00Z" }, as: HealthAdmin, captures: { sh4: $.data.id } }
          assert:
            - "trigger[0]: HTTP 409, error_id == ERR_ONCALL_OVERLAP (23:00 < 24:00 overlap)"
            - "trigger[1]: HTTP 409, error_id == ERR_ONCALL_OVERLAP (closed intervals: start == existing end still conflicts — unlike appointments)"
            - "trigger[2]: HTTP 409, error_id == ERR_ONCALL_REST_VIOLATION (gap 6h < 12h from shift1 end)"
            - "trigger[3]: HTTP 201 (gap exactly 12h satisfies the inclusive rest boundary)"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: stock_dispense_then_restock_conserves_units
        grounds:
          - entities.MedicationStock.fields.on_hand
          - state_machines.Prescription
        distinguishing_aspect: |
          Conserved quantity = physical stock units: on_hand ==
          initial_on_hand + sum(restocked) - sum(dispensed). Dispense 20 then
          restock 20 returns on_hand to exactly 50 with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-05-01; urgent encounter open; stock initial 50 threshold 0; prescription for 20 units"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S1000", full_name: "Conserve Units" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr T", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "DOXY", medication_name: "Doxycycline", initial_on_hand: 50, reorder_threshold: 0 }, as: Pharmacist, captures: { stk: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 20 }, as: Clinician, captures: { rx: $.data.id } }
          trigger:
            - { call: "POST /shc/prescriptions/${rx}/dispense", payload: { quantity: 20 }, as: Pharmacist }
            - { call: "POST /shc/medication-stocks/${stk}/restock", payload: { quantity: 20 }, as: Pharmacist }
          assert:
            - "trigger[0] leaves on_hand == 30 (observed via trigger[1] precondition state) and Prescription.${rx}.status == DISPENSED"
            - "trigger[1]: on_hand == 50 — invariant 50 == 50 (initial) + 20 (restocked) - 20 (dispensed) holds exactly"

      - name: invoice_payment_then_void_conserves_money
        grounds:
          - calculations.invoice_balance_and_status
          - state_machines.Payment
          - state_machines.Invoice
        distinguishing_aspect: |
          Conserved quantity = money: patient_responsibility_cents ==
          balance_cents + sum(POSTED payments). Post 3000 then void it:
          balance returns 5000 -> 8000 and status reverts PARTIALLY_PAID ->
          ISSUED (due date still in the future).
        test_recipe:
          setup:
            - "Clock 2026-05-01; student with VERIFIED EXTERNAL policy (copay 2500, deductible 5000, coins 0.2); SPORTS_PHYSICAL encounter; invoice 10000 issued (patient 8000, due 2026-05-31)"
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S1001", full_name: "Conserve Money" }, as: HealthAdmin, captures: { stu: $.data.id, stu_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "EXTERNAL", policy_number: "EX-5", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 2500, deductible_cents: 5000, coinsurance_pct: 0.2, expected_student_version: "${stu_v}" }, as: BillingOfficer, captures: { pol: $.data.id } }
            - { call: "POST /shc/insurance-policies/${pol}/verify", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/providers", payload: { full_name: "Dr U", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 10000 } ] }, as: BillingOfficer, captures: { inv: $.data.id } }
            - { call: "POST /shc/invoices/${inv}/issue", payload: {}, as: BillingOfficer }
          trigger:
            - { call: "POST /shc/invoices/${inv}/payments", payload: { amount_cents: 3000, method: "CARD" }, as: BillingOfficer, captures: { pay: $.data.id } }
            - { call: "GET /shc/invoices/${inv}", payload: {}, as: Any }
            - { call: "POST /shc/payments/${pay}/void", payload: {}, as: BillingOfficer }
            - { call: "GET /shc/invoices/${inv}", payload: {}, as: Any }
          assert:
            - "trigger[1]: balance_cents == 5000, status == PARTIALLY_PAID"
            - "trigger[2]: Payment.${pay}.status == VOIDED"
            - "trigger[3]: balance_cents == 8000, status == ISSUED (due 2026-05-31 >= 2026-05-01) — invariant 8000 == 8000 + 0 (no POSTED payments)"
