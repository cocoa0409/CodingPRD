              payload: { stage: "LIGHTING", stop_tail_turn_lamp_count: 2, clearance_lamp_count: 0, side_marker_lamp_count: 2, license_plate_lamp_count: 1, reflex_reflector_count: 4 }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "BRAKE_AND_AXLE", installed_braked_axle_count: 1, breakaway_kit_installed: true }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/road-tests"
              payload: { lane_id: "${lane_id}", window_start_at: "2026-08-04T10:00:00Z", window_end_at: "2026-08-04T11:00:00Z", protocol_code: "STANDARD_20MI" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { road_test_id: $.data.id }
            - call: "POST /road-tests/${road_test_id}/result"
              payload: { brake_stop_distance_ft: 32.5, lighting_check_passed: true, result_notes: "within spec" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /trailer-units/${unit_id}/certification-label"
              payload: { tire_size_code: "ST205/75R15" }
              as: CertificationOfficer
              as_user_id: "co-2"
            - call: "GET /trailer-units/${unit_id}"
              payload: {}
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { stock_at: $.data.released_to_stock_at }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", po_ref: "PO-10001", stocking_program: "STOCK" }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { order_id: $.data.id }
            - call: "POST /dealer-orders/${order_id}/allocation"
              payload: { expected_dealer_version: "${dealer_v0}" }
              as: SalesAdmin
              as_user_id: "sa-1"
          trigger:
            - call: "POST /dealer-orders/${order_id}/cancellation"
              payload: { cancellation_reason: "dealer cancelled the stocking order" }
              as: SalesAdmin
              as_user_id: "sa-1"
          assert:
            - "DealerOrder.${order_id}.status == CANCELLED"
            - "DealerOrder.${order_id}.allocated_unit_id is null"
            - "DealerOrder.${order_id}.floor_plan_status == RELEASED"
            - "DealerOrder.${order_id}.floor_plan_draw_cents == 521460  # retained for audit, excluded from the sum"
            - "DealerOrder.${order_id}.invoice_total_cents == 579400  # invoice fields also retained"
            - "Dealer.${dealer_id}.floor_plan_outstanding_cents == 0"
            - "Dealer.${dealer_id}.floor_plan_available_cents == 200000000"
            - "Dealer.${dealer_id}.allocations_current_month_count == 0"
            - "Dealer.${dealer_id}.allocations_ytd_count == 0"
            - "TrailerUnit.${unit_id}.build_status == RELEASED_TO_STOCK"
            - "TrailerUnit.${unit_id}.dealer_order_id is null"
            - "TrailerUnit.${unit_id}.released_to_stock_at == ${stock_at}  # NOT rewritten by the reversal"
            - "TrailerUnit.${unit_id}.vin is unchanged and the CertificationLabel is still ISSUED"
      - name: option_removal_restores_the_unit_weight_budget_exactly
        grounds:
          - calculations.unit_weight_budget
          - entities.OptionInstall.fields.status
          - entities.TrailerUnit.fields.curb_weight_lbs
          - entities.TrailerUnit.fields.payload_capacity_lbs
        distinguishing_aspect: |
          The conserved quantity is WEIGHT, not money, and the invariant curb_weight_lbs +
          payload_capacity_lbs == gvwr_lbs is asserted at all three points of the create-then-remove pair.
          The REMOVED row survives with its own total_weight_lbs intact while dropping out of the
          aggregate's input set, so a reversal that mutated the line instead would be caught.
        test_recipe:
          setup:
            - "Unit SN-000101 at SYSTEMS_INSTALLED with gvwr_lbs 6300, curb_weight_lbs 1980 and payload_capacity_lbs 4320."
            - "No OptionInstall rows exist for the unit yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-01", frame_design_code: "TA", changeover_buffer_min: 45 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig_id: $.data.id, jig_v0: $.data.version }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000101", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit_id: $.data.id }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit_id}", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T11:00:00Z", expected_weld_jig_version: "${jig_v0}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/frame-inspections"
              payload: { measured_length_mm: 4267, measured_width_mm: 2134, diagonal_a_mm: 4770, diagonal_b_mm: 4770, critical_weld_defect_count: 0, non_critical_weld_defect_count: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "LIGHTING", stop_tail_turn_lamp_count: 2, clearance_lamp_count: 0, side_marker_lamp_count: 2, license_plate_lamp_count: 1, reflex_reflector_count: 4 }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "BRAKE_AND_AXLE", installed_braked_axle_count: 1, breakaway_kit_installed: true }
              as: AssemblyTech
              as_user_id: "at-1"
          trigger:
            - call: "POST /trailer-units/${unit_id}/option-installs"
              payload: { option_code: "SPECIALTY_FLOORING", quantity: 2, unit_weight_lbs: 150, unit_price_cents: 17250, labor_hours: 1.5 }
              as: AssemblyTech
              as_user_id: "at-1"
              captures: { option_id: $.data.id }
            - call: "DELETE /option-installs/${option_id}"
              payload: { removal_reason: "customer dropped the flooring upgrade" }
              as: AssemblyTech
              as_user_id: "at-1"
          assert:
            - "On creation OptionInstall.${option_id}.status == PENDING with total_weight_lbs == 300 and total_price_cents == 34500"
            - "Immediately after creation TrailerUnit.${unit_id}.curb_weight_lbs == 2280 and payload_capacity_lbs == 4020"
            - "That intermediate state still satisfies curb + payload == 6300"
            - "After the removal OptionInstall.${option_id}.status == REMOVED"
            - "The removed row still reports total_weight_lbs == 300 and total_price_cents == 34500"
            - "TrailerUnit.${unit_id}.curb_weight_lbs == 1980  # exactly the pre-install value, no drift"
            - "TrailerUnit.${unit_id}.payload_capacity_lbs == 4320"
            - "TrailerUnit.${unit_id}.gvwr_lbs == 6300 and curb + payload == 6300"
            - "TrailerUnit.${unit_id}.build_status == SYSTEMS_INSTALLED  # unchanged, the unit was never LABELED"
            - "GET /trailer-units/{id}/option-installs without include_removed returns 0 rows; with include_removed true it returns 1"
