              as: CirculationPlanner
              captures: { lo_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-A", requested_gross_names: 10000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 1000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { r1_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/model"
              payload: { coop_model_score: 640 }
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/order"
              payload: {}
              as: ListBroker
              captures: { per_name: "$.data.unit_cost_cents_per_name" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/deliver"
              payload: { delivered_gross_names: 10000 }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 10000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: ["${r1_id}"] }
              as: ListBroker
              captures: { net_names: "$.data.net_mailable_names" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${lo_id}", requested_quantity: 30000 }
              as: CirculationPlanner
              captures: { l_lo: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "RENTAL", prospect_list_rental_id: "${r1_id}", requested_quantity: 9000 }
              as: CirculationPlanner
              captures: { l_r: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
