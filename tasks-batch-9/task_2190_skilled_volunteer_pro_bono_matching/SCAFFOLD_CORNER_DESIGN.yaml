            - "GET /volunteers/${vol_id}/availability-windows returns total_count == 0"
            - "the same body with starts_at \"2026-08-01T00:00:00Z\" returns HTTP 201, isolating containment as the only failing condition"
      - name: error_invalid_pagination_on_limit_and_offset_together
        claim_type: error_triggerable
        grounds: ["errors[ERR_INVALID_PAGINATION]", "validations[priority=18]", "endpoints[GET /project-requests]"]
        distinguishing_aspect: "The only 400 in the catalogue: limit 101 exceeds the 100 ceiling and offset -1 is negative in the same query string, and the endpoint answers with a single ERR_INVALID_PAGINATION rather than a per-parameter list. limit 100 with offset 0 is the accepted boundary."
