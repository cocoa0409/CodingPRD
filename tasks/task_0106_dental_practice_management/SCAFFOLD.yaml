# =============================================================================
# Dental Practice Management — PRD Benchmark Scaffold (Expert band)
# §1.0–§1.7. Difficulty/corner designs live in sibling files.
# =============================================================================

scenario: |
  106. Dental Practice Management: operatory scheduling, perio/tooth-surface
  charting, treatment plan/phasing, dental insurance (annual max/frequency/
  waiting), pre-determination, claim/attachment, recare recall, payment plan

domain_name: dental-practice-management
api_prefix: ""   # flat multi-collection API; resources live at top-level paths (/patients, /providers, /claims, ...)

complexity_profile:
  primary_archetype: Ledger reconciliation        # estimated benefit vs adjudicated payment on the same procedure
  secondary_archetype: Temporal windowing          # operatory + provider chair-time scheduling
  complexity_layers:
    - Dual-variant calculation                     # estimate (forward) vs adjudication (chronological)
    - Cascading side effects                        # claim payment -> coverage accumulator -> predetermination revalidation
    - Rate / threshold triggers                     # annual maximum + frequency/waiting windows
    - Optimistic concurrency                        # PaymentPlan supersede on Claim.version

  entity_topology: flat
  # Peer entities linked by foreign keys; Appointment, Claim, PaymentPlan all
  # reference Patient / Provider / Operatory / Claim by id rather than nesting
  # in the URL path. Only ToothChartEntry and ClaimAttachment are nested.

  state_machine_shape: parallel
  # Claim carries two independent dimensions (submission_status × adjudication_status).
  # Also present: cyclic (TreatmentPlan revise loop), branching (Predetermination,
  # Appointment). Catalogued as `parallel` because that is the rarest shape here.

  relationship_patterns:
    - one_to_many        # Patient -> Appointment, Patient -> Claim, etc.
    - cross_aggregate    # Claim references TreatmentPlanItem; PaymentPlan references Claim

  role_model: peer_roles
  # FrontDesk owns scheduling/recall, Clinician owns charting/treatment/claims,
  # BillingSpecialist owns insurance/predetermination/payment-plans, Patient reads own data.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE — INACTIVE blocks new appointments/charting", constraints: "{ACTIVE, INACTIVE}" }
      - { name: balance_owed_cents, type: integer, source: computed, default: 0, description: "Sum of patient_responsibility_cents over this patient's Claims not yet covered by an active PaymentPlan" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Provider name" }
      - { name: provider_type, type: enum, source: input, description: "DENTIST | HYGIENIST — HYGIENIST may only own preventive/perio appointments", constraints: "{DENTIST, HYGIENIST}" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier (10 digits)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE", constraints: "{ACTIVE, INACTIVE}" }

  - name: Operatory
    parent: null
    common_fields: true
    fields:
      - { name: room_name, type: string, source: input, description: "Operatory (chair/room) label, e.g. OP-1" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 15, description: "Cleanup/turnover buffer appended after each appointment in this room; widens the room-occupancy interval", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED — CLOSED rooms reject new appointments", constraints: "{OPEN, CLOSED}" }

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier name" }
      - { name: annual_maximum_cents, type: integer, source: input, description: "Per-benefit-year ceiling on carrier-paid benefit", constraints: "> 0" }
      - { name: deductible_cents, type: integer, source: input, description: "Annual deductible the patient pays before coinsurance applies", constraints: ">= 0" }
      - { name: preventive_coinsurance_pct, type: integer, source: input, description: "Percent the carrier pays for PREVENTIVE category (0-100)", constraints: "0..100" }
      - { name: basic_coinsurance_pct, type: integer, source: input, description: "Percent the carrier pays for BASIC category (0-100)", constraints: "0..100" }
      - { name: major_coinsurance_pct, type: integer, source: input, description: "Percent the carrier pays for MAJOR category (0-100)", constraints: "0..100" }
      - { name: major_waiting_period_months, type: integer, source: input, default: 12, description: "Months of continuous coverage required before MAJOR procedures are eligible", constraints: ">= 0" }
      - { name: frequency_limit_months, type: integer, source: input, default: 6, description: "Minimum months between two carrier-paid procedures sharing the same CDT code for one patient", constraints: ">= 0" }

  - name: PatientCoverage
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: insurance_plan_id, type: string, source: input, description: "FK -> InsurancePlan.id" }
      - { name: coverage_start_date, type: string, source: input, description: "ISO date coverage began (drives waiting-period eligibility)" }
      - { name: benefit_year_start_date, type: string, source: input, description: "ISO date (MM-DD anchor) the annual maximum and deductible reset each year" }
      - { name: annual_benefit_used_cents, type: integer, source: computed, default: 0, description: "Sum of adjudicated carrier_paid_cents across this coverage's PAID/PARTIALLY_PAID Claims within the current benefit year" }
      - { name: deductible_met_cents, type: integer, source: computed, default: 0, description: "Deductible amount consumed in the current benefit year" }
      - { name: annual_max_reached, type: boolean, source: computed, default: false, description: "True when annual_benefit_used_cents >= plan.annual_maximum_cents" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TERMINATED", constraints: "{ACTIVE, TERMINATED}" }

  - name: ToothChartEntry
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; charting clinician" }
      - { name: tooth_number, type: integer, source: input, description: "Universal numbering 1-32 (permanent dentition)", constraints: "1..32" }
      - { name: chart_type, type: enum, source: input, description: "SURFACE (restorative finding) | PERIO (pocket-depth reading)", constraints: "{SURFACE, PERIO}" }
      - { name: surface, type: enum, source: input, required: false, description: "Required when chart_type=SURFACE: M|O|D|B|L|I (mesial/occlusal/distal/buccal/lingual/incisal)", constraints: "{M,O,D,B,L,I}" }
      - { name: pocket_depth_mm, type: integer, source: input, required: false, description: "Required when chart_type=PERIO: probing depth in mm", constraints: "1..12" }
      - { name: finding, type: string, source: input, description: "Free-text clinical finding/condition code" }

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; planning dentist" }
      - { name: total_fee_cents, type: integer, source: computed, default: 0, description: "Sum of fee_cents over this plan's TreatmentPlanItems not in CANCELLED" }
      - { name: estimated_patient_portion_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_patient_portion_cents over this plan's non-CANCELLED items" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PROPOSED | ACCEPTED | COMPLETED | CANCELLED", constraints: "{DRAFT, PROPOSED, ACCEPTED, COMPLETED, CANCELLED}" }

  - name: TreatmentPlanItem
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: treatment_plan_id, type: string, source: system, description: "FK -> TreatmentPlan.id" }
      - { name: predetermination_id, type: string, source: computed, required: false, description: "FK -> Predetermination.id; set when a predetermination is requested for this item" }
      - { name: appointment_id, type: string, source: computed, required: false, description: "FK -> Appointment.id; set when item is scheduled" }
      - { name: cdt_code, type: string, source: input, description: "ADA CDT procedure code, e.g. D2740" }
      - { name: category, type: enum, source: input, description: "PREVENTIVE | BASIC | MAJOR — selects coinsurance tier and waiting rule", constraints: "{PREVENTIVE, BASIC, MAJOR}" }
      - { name: phase_number, type: integer, source: input, default: 1, description: "Treatment phasing sequence (1=first phase); lower phases scheduled first", constraints: ">= 1" }
      - { name: tooth_number, type: integer, source: input, required: false, description: "Target tooth (1-32) or null for whole-mouth procedures", constraints: "1..32" }
      - { name: fee_cents, type: integer, source: input, description: "Practice fee for this procedure", constraints: "> 0" }
      - { name: requires_predetermination, type: boolean, source: input, default: false, description: "When true the item cannot be SCHEDULED until its Predetermination is APPROVED" }
      - { name: estimated_insurance_cents, type: integer, source: computed, default: 0, description: "Forward-looking estimated carrier benefit (calculations.estimated_insurance_benefit)" }
      - { name: estimated_patient_portion_cents, type: integer, source: computed, default: 0, description: "= fee_cents - estimated_insurance_cents" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | SCHEDULED | COMPLETED | CANCELLED", constraints: "{PLANNED, SCHEDULED, COMPLETED, CANCELLED}" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: operatory_id, type: string, source: input, description: "FK -> Operatory.id" }
      - { name: treatment_plan_item_id, type: string, source: input, required: false, description: "FK -> TreatmentPlanItem.id; the planned procedure this visit performs" }
      - { name: appointment_type, type: enum, source: input, description: "PREVENTIVE | OPERATIVE — HYGIENIST providers may only own PREVENTIVE", constraints: "{PREVENTIVE, OPERATIVE}" }
      - { name: start_at, type: datetime, source: input, description: "ISO 8601 UTC chair-time start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "ISO 8601 UTC chair-time end (exclusive); must be > start_at" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW", constraints: "{SCHEDULED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW}" }

  - name: Predetermination
    parent: null
    common_fields: true
    fields:
      - { name: treatment_plan_item_id, type: string, source: input, description: "FK -> TreatmentPlanItem.id" }
      - { name: patient_coverage_id, type: string, source: input, description: "FK -> PatientCoverage.id" }
      - { name: submitted_fee_cents, type: integer, source: computed, description: "Snapshot of the item's fee_cents at submission" }
      - { name: approved_benefit_cents, type: integer, source: input, required: false, description: "Carrier-approved benefit amount, recorded on APPROVE", constraints: ">= 0" }
      - { name: valid_until_date, type: string, source: input, required: false, description: "ISO date the carrier approval expires (set on APPROVE)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | DENIED | EXPIRED | REQUIRES_REVALIDATION", constraints: "{PENDING, APPROVED, DENIED, EXPIRED, REQUIRES_REVALIDATION}" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: treatment_plan_item_id, type: string, source: input, description: "FK -> TreatmentPlanItem.id; item must be COMPLETED" }
      - { name: patient_coverage_id, type: string, source: input, description: "FK -> PatientCoverage.id" }
      - { name: billed_fee_cents, type: integer, source: computed, description: "Snapshot of item.fee_cents at claim creation" }
      - { name: carrier_paid_cents, type: integer, source: computed, default: 0, description: "Adjudicated carrier benefit (calculations.adjudicated_benefit); 0 until adjudicated" }
      - { name: patient_responsibility_cents, type: integer, source: computed, default: 0, description: "= billed_fee_cents - carrier_paid_cents, finalized at adjudication" }
      - { name: submission_status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED (independent dimension; submit before adjudicate)", constraints: "{DRAFT, SUBMITTED}" }
      - { name: adjudication_status, type: enum, source: system, default: PENDING, description: "PENDING | PAID | PARTIALLY_PAID | DENIED | VOID (independent dimension)", constraints: "{PENDING, PAID, PARTIALLY_PAID, DENIED, VOID}" }

  - name: ClaimAttachment
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: attachment_type, type: enum, source: input, description: "XRAY | PERIO_CHART | NARRATIVE | PHOTO", constraints: "{XRAY, PERIO_CHART, NARRATIVE, PHOTO}" }
      - { name: document_ref, type: string, source: input, description: "Opaque storage reference (URL/handle) to the attached document" }

  - name: RecareRecall
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: recall_type, type: enum, source: input, description: "PROPHY | PERIO_MAINT | EXAM", constraints: "{PROPHY, PERIO_MAINT, EXAM}" }
      - { name: interval_months, type: integer, source: input, description: "Recall cadence in months", constraints: "> 0" }
      - { name: last_visit_date, type: string, source: input, description: "ISO date of the most recent completed recare visit (baseline for due date)" }
      - { name: next_due_date, type: string, source: computed, description: "= last_visit_date + interval_months (calendar)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DUE — flips ACTIVE->DUE when the clock reaches next_due_date; fulfill rolls it back to ACTIVE with a new next_due_date", constraints: "{ACTIVE, DUE}" }

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the adjudicated claim whose patient_responsibility is financed" }
      - { name: principal_cents, type: integer, source: computed, description: "Snapshot of claim.patient_responsibility_cents at plan creation", constraints: "> 0" }
      - { name: installment_count, type: integer, source: input, description: "Number of monthly installments", constraints: "1..60" }
      - { name: installment_amount_cents, type: integer, source: computed, description: "Per-installment amount (calculations.payment_plan_schedule); final installment absorbs rounding remainder" }
      - { name: final_installment_cents, type: integer, source: computed, description: "Last installment = principal - installment_amount*(installment_count-1)" }
      - { name: amount_posted_cents, type: integer, source: computed, default: 0, description: "Sum of posted installment payments" }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "= principal_cents - amount_posted_cents" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PAID_OFF | DEFAULTED", constraints: "{ACTIVE, PAID_OFF, DEFAULTED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /treatment-plans/{id}/propose"
        actor: Clinician
        preconditions:
          - "Plan in DRAFT (ERR_INVALID_STATE)"
          - "At least one TreatmentPlanItem in PLANNED status (ERR_PLAN_HAS_NO_ITEMS)"
        side_effects:
          - "Recompute estimated_insurance_cents + estimated_patient_portion_cents on every PLANNED item (calculations.estimated_insurance_benefit)"
          - "Recompute plan.total_fee_cents and plan.estimated_patient_portion_cents"

      - from: PROPOSED
        to: DRAFT
        trigger: "POST /treatment-plans/{id}/revise"
        actor: Clinician
        preconditions:
          - "Plan in PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "Plan returns to DRAFT so items may be added/removed (revision loop)"
        note: "Cyclic: PROPOSED -> DRAFT -> PROPOSED is the revision loop."

      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /treatment-plans/{id}/accept"
        actor: FrontDesk
        preconditions:
          - "Plan in PROPOSED (ERR_INVALID_STATE)"
          - "Patient.status == ACTIVE (ERR_PATIENT_INACTIVE)"
        side_effects:
          - "Plan -> ACCEPTED; items remain PLANNED and may now be scheduled"

      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /treatment-plans/{id}/complete"
        actor: Clinician
        preconditions:
          - "Plan in ACCEPTED (ERR_INVALID_STATE)"
          - "Every non-CANCELLED TreatmentPlanItem is COMPLETED (ERR_PLAN_ITEMS_NOT_COMPLETE)"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /treatment-plans/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Plan in DRAFT, PROPOSED, or ACCEPTED (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE depth-1: every non-terminal (PLANNED|SCHEDULED) TreatmentPlanItem -> CANCELLED"
          - "CASCADE depth-2: for each item just cancelled, if it has a linked SCHEDULED Appointment that Appointment -> CANCELLED"
          - "Recompute plan.total_fee_cents and plan.estimated_patient_portion_cents (now 0)"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /treatment-plans/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Plan in DRAFT, PROPOSED, or ACCEPTED (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE depth-1: every non-terminal (PLANNED|SCHEDULED) TreatmentPlanItem -> CANCELLED"
          - "CASCADE depth-2: for each item just cancelled, if it has a linked SCHEDULED Appointment that Appointment -> CANCELLED"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /treatment-plans/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Plan in DRAFT, PROPOSED, or ACCEPTED (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE depth-1: every non-terminal (PLANNED|SCHEDULED) TreatmentPlanItem -> CANCELLED"
          - "CASCADE depth-2: for each item just cancelled, if it has a linked SCHEDULED Appointment that Appointment -> CANCELLED"

  - entity: TreatmentPlanItem
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /appointments (with treatment_plan_item_id) — item bubbles to SCHEDULED"
        actor: FrontDesk
        preconditions:
          - "Parent TreatmentPlan in ACCEPTED (ERR_PLAN_NOT_ACCEPTED)"
          - "If requires_predetermination: linked Predetermination.status == APPROVED (ERR_PREDETERMINATION_NOT_APPROVED)"
        side_effects:
          - "item.appointment_id set to the new Appointment.id"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete — linked item bubbles to COMPLETED"
        actor: Clinician
        preconditions:
          - "Item in SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

      - from: PLANNED
        to: CANCELLED
        trigger: "system (cascade from TreatmentPlan cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "If item has a linked SCHEDULED Appointment, that Appointment -> CANCELLED (cascade depth-2)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from TreatmentPlan cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked SCHEDULED Appointment -> CANCELLED (cascade depth-2)"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "Appointment in SCHEDULED (ERR_INVALID_STATE)"
          - "Patient.status == ACTIVE (ERR_PATIENT_INACTIVE)"
        side_effects: []

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Clinician
        preconditions:
          - "Appointment in CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "If treatment_plan_item_id set and item is SCHEDULED: item -> COMPLETED (bubble up)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Appointment in SCHEDULED or CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "If linked item is SCHEDULED: item -> PLANNED and item.appointment_id cleared (frees the slot)"

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Appointment in SCHEDULED or CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "If linked item is SCHEDULED: item -> PLANNED and item.appointment_id cleared"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: FrontDesk
        preconditions:
          - "Appointment in SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "If linked item is SCHEDULED: item -> PLANNED and item.appointment_id cleared"

  - entity: Predetermination
    initial_state: PENDING
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /predeterminations/{id}/approve"
        actor: BillingSpecialist
        preconditions:
          - "Predetermination in PENDING (ERR_INVALID_STATE)"
          - "approved_benefit_cents and valid_until_date present (ERR_VALIDATION)"
        side_effects:
          - "Record approved_benefit_cents + valid_until_date"

      - from: PENDING
        to: DENIED
        trigger: "POST /predeterminations/{id}/deny"
        actor: BillingSpecialist
        preconditions:
          - "Predetermination in PENDING (ERR_INVALID_STATE)"
        side_effects: []

      - from: PENDING
        to: EXPIRED
        trigger: "system (clock advances past valid window / coverage termination revalidation aged out)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Branching: PENDING forks to APPROVED / DENIED / EXPIRED with divergent side-effects."

      - from: APPROVED
        to: REQUIRES_REVALIDATION
        trigger: "system (cascade depth-3: coverage annual_max_reached flips true)"
        actor: system
        preconditions: []
        side_effects:
          - "Approved benefit can no longer be relied on; item must re-predetermine before SCHEDULED"

      - from: REQUIRES_REVALIDATION
        to: APPROVED
        trigger: "POST /predeterminations/{id}/approve"
        actor: BillingSpecialist
        preconditions:
          - "Predetermination in PENDING or REQUIRES_REVALIDATION (ERR_INVALID_STATE)"
          - "approved_benefit_cents and valid_until_date present (ERR_VALIDATION)"
        side_effects:
          - "Re-record approved_benefit_cents + valid_until_date"

  - entity: Claim
    initial_state: "submission=DRAFT, adjudication=PENDING"
    terminal_states: ["adjudication=VOID"]
    transitions:
      # --- submission_status dimension (independent of adjudication) ---
      - from: "submission=DRAFT"
        to: "submission=SUBMITTED"
        trigger: "POST /claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "submission_status == DRAFT (ERR_INVALID_STATE)"
          - "At least one ClaimAttachment exists (ERR_CLAIM_MISSING_ATTACHMENT)"
        side_effects: []

      # --- adjudication_status dimension (independent of submission) ---
      - from: "adjudication=PENDING"
        to: "adjudication=PAID"
        trigger: "POST /claims/{id}/adjudicate (carrier_paid_cents >= computed benefit)"
        actor: BillingSpecialist
        preconditions:
          - "submission_status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "adjudication_status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "carrier_paid_cents = calculations.adjudicated_benefit; patient_responsibility_cents = billed_fee_cents - carrier_paid_cents"
          - "CASCADE depth-1: coverage.annual_benefit_used_cents += carrier_paid_cents; coverage.deductible_met_cents updated"
          - "CASCADE depth-2: if coverage.annual_benefit_used_cents >= plan.annual_maximum_cents then coverage.annual_max_reached = true"
          - "CASCADE depth-3: when annual_max_reached flips false->true, every APPROVED Predetermination on that coverage -> REQUIRES_REVALIDATION"
          - "patient.balance_owed_cents recomputed"

      - from: "adjudication=PENDING"
        to: "adjudication=PARTIALLY_PAID"
        trigger: "POST /claims/{id}/adjudicate (carrier_paid_cents < computed benefit; e.g. annual max clamp)"
        actor: BillingSpecialist
        preconditions:
          - "submission_status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "adjudication_status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "Same cascade chain as PAID (coverage accumulator, annual_max, predetermination revalidation)"

      - from: "adjudication=PENDING"
        to: "adjudication=DENIED"
        trigger: "POST /claims/{id}/deny"
        actor: BillingSpecialist
        preconditions:
          - "adjudication_status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "carrier_paid_cents = 0; patient_responsibility_cents = billed_fee_cents; patient.balance_owed_cents recomputed"

      - from: "adjudication=PAID"
        to: "adjudication=VOID"
        trigger: "POST /claims/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "adjudication_status == PAID or PARTIALLY_PAID (ERR_CLAIM_NOT_VOIDABLE)"
          - "No ACTIVE PaymentPlan references this claim (ERR_CLAIM_HAS_ACTIVE_PAYMENT_PLAN)"
        side_effects:
          - "COMPENSATION: coverage.annual_benefit_used_cents -= carrier_paid_cents (restores the conserved accumulator)"
          - "COMPENSATION: coverage.deductible_met_cents restored to pre-adjudication value"
          - "Recompute coverage.annual_max_reached (may flip true->false)"
          - "patient.balance_owed_cents recomputed"

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [PAID_OFF, DEFAULTED]
    transitions:
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (when amount_posted_cents >= principal_cents after a posted installment)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_balance_cents = 0; patient.balance_owed_cents recomputed"

      - from: PAID_OFF
        to: ACTIVE
        trigger: "POST /payment-plans/{id}/reverse-installment (drops amount_posted below principal)"
        actor: BillingSpecialist
        preconditions:
          - "Plan in PAID_OFF and the reversal drops amount_posted_cents below principal_cents"
        side_effects:
          - "status reverts to ACTIVE; remaining_balance_cents recomputed; patient.balance_owed_cents recomputed"
        note: "Cyclic: ACTIVE->PAID_OFF->ACTIVE via post/reverse installment."

      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /payment-plans/{id}/default"
        actor: BillingSpecialist
        preconditions:
          - "Plan in ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Outstanding remaining_balance_cents returns to patient.balance_owed_cents (recomputed)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: payment-plan-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /payment-plans"
    occ_field: "expected_claim_version"
    description: |
      Creating a PaymentPlan against a Claim whose version has advanced since
      the client last observed it is rejected. A new PaymentPlan legitimately
      supersedes any prior financing arrangement for the same patient
      responsibility, so a second create on a stale claim view (its version
      already bumped by the first plan's creation) must fail the OCC check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_insurance_benefit
    trigger: "TreatmentPlan propose (DRAFT->PROPOSED); recomputed per PLANNED item"
    algorithm: forward_looking
    formula: |
      # Forward-looking ESTIMATE — assumes the item is the *next* claim adjudicated
      # against the coverage's CURRENT accumulator snapshot (does not chronologically
      # replay other planned items). Selects coverage = the patient's ACTIVE
      # PatientCoverage with the latest coverage_start_date (tie-break: created_at ASC).
      coinsurance_pct = select_by_category(item.category, plan):
                          PREVENTIVE -> preventive_coinsurance_pct
                          BASIC      -> basic_coinsurance_pct
                          MAJOR      -> major_coinsurance_pct
      remaining_deductible = max(0, plan.deductible_cents - coverage.deductible_met_cents)
      deductible_applied   = min(remaining_deductible, item.fee_cents)
      after_deductible     = item.fee_cents - deductible_applied
      gross_benefit        = floor(after_deductible * coinsurance_pct / 100)
      remaining_annual_max = max(0, plan.annual_maximum_cents - coverage.annual_benefit_used_cents)
      estimated_insurance_cents          = min(gross_benefit, remaining_annual_max)
      estimated_patient_portion_cents    = item.fee_cents - estimated_insurance_cents
      # If patient has NO ACTIVE coverage: estimated_insurance_cents = 0.
    input_set: "Patient's ACTIVE PatientCoverage (latest coverage_start_date, tie-break created_at ASC) + its InsurancePlan; coverage accumulator AS-OF now."
    constants: {}
    precision: "integer cents; floor on the coinsurance product, then clamp"
    variants:
      - name: estimate
        when: "at plan propose"
        difference: "forward-looking; ignores in-flight sibling items; reads accumulator as-of-now; no waiting/frequency rejection (estimate is informational)."

  - name: adjudicated_benefit
    trigger: "Claim adjudicate (adjudication PENDING -> PAID/PARTIALLY_PAID)"
    algorithm: chronological
    formula: |
      # CHRONOLOGICAL ACTUAL — recomputes against the coverage accumulator AS IT
      # STANDS at adjudication time (after every previously-adjudicated claim has
      # already debited it). Same deductible/coinsurance arithmetic as the estimate,
      # but the annual-max clamp uses the LIVE annual_benefit_used_cents, so identical
      # inputs can diverge from the estimate when earlier claims consumed the pool.
      coinsurance_pct = select_by_category(item.category, plan)   # same mapping as estimate
      remaining_deductible = max(0, plan.deductible_cents - coverage.deductible_met_cents)   # live
      deductible_applied   = min(remaining_deductible, claim.billed_fee_cents)
      after_deductible     = claim.billed_fee_cents - deductible_applied
      gross_benefit        = floor(after_deductible * coinsurance_pct / 100)
      remaining_annual_max = max(0, plan.annual_maximum_cents - coverage.annual_benefit_used_cents)  # live
      carrier_paid_cents   = min(gross_benefit, remaining_annual_max)
      # PARTIALLY_PAID when carrier_paid_cents < gross_benefit (annual-max clamp bit);
      # PAID when carrier_paid_cents == gross_benefit.
      patient_responsibility_cents = claim.billed_fee_cents - carrier_paid_cents
    input_set: "Live coverage accumulator at adjudication (post earlier debits)."
    constants: {}
    precision: "integer cents; floor on coinsurance product, then clamp"
    variants:
      - name: adjudication
        when: "at claim adjudicate"
        difference: "chronological/live accumulator; the annual-max clamp reflects all earlier PAID claims, so the same fee adjudicates lower than its earlier estimate once the pool is partially consumed."

  - name: payment_plan_schedule
    trigger: "PaymentPlan create"
    algorithm: waterfall_allocation
    formula: |
      # Nested-rounding order is PINNED: divide-then-floor PER installment first,
      # then push the accumulated remainder into the FINAL installment (round-per-
      # installment-then-reconcile, NOT round-the-total).
      base = floor(principal_cents / installment_count)
      installment_amount_cents = base                                  # first (n-1) installments
      final_installment_cents  = principal_cents - base * (installment_count - 1)   # absorbs remainder
      remaining_balance_cents  = principal_cents - amount_posted_cents
      # Invariant: base*(installment_count-1) + final_installment_cents == principal_cents exactly.
    input_set: "principal_cents (= claim.patient_responsibility_cents snapshot), installment_count."
    constants: {}
    precision: "integer cents; floor per installment, remainder reconciled into final installment"
    variants:
      - name: projected_payoff
        when: "schedule generation (forward-looking)"
        difference: "assumes every installment posts on cadence; projected payoff = base*(count-1)+final."
      - name: actual_payoff
        when: "after early/extra installment postings (chronological)"
        difference: "sums actually-posted installments; remaining_balance = principal - amount_posted; PAID_OFF the moment amount_posted >= principal even before count installments."

  - name: annual_benefit_accumulator
    trigger: "Claim adjudicate / void (PAID|PARTIALLY_PAID debit; VOID credit)"
    algorithm: aggregation
    formula: |
      annual_benefit_used_cents = sum(carrier_paid_cents) over this coverage's Claims
                                  whose adjudication_status IN {PAID, PARTIALLY_PAID}
                                  AND adjudicated within the current benefit year window
                                  [benefit_year_start_date, benefit_year_start_date + 12 months).
      annual_max_reached = (annual_benefit_used_cents >= plan.annual_maximum_cents)   # >= boundary
    input_set: "Claims for one coverage in adjudication_status {PAID, PARTIALLY_PAID}; VOID excluded."
    constants: {}
    precision: "integer cents; threshold uses >= (reaching exactly the max trips it)"

  - name: recare_next_due
    trigger: "RecareRecall create / update last_visit_date"
    algorithm: threshold
    formula: |
      next_due_date = last_visit_date + interval_months   # calendar month addition, day clamped to month end
      # On clock advance: status becomes DUE when current_date >= next_due_date (>= boundary),
      # otherwise stays ACTIVE.
    input_set: "Single RecareRecall row + system clock."
    constants: {}
    precision: "calendar date; DUE trips at current_date >= next_due_date"

  - name: frequency_and_waiting_eligibility
    trigger: "Predetermination create"
    algorithm: threshold
    formula: |
      # MAJOR waiting period: months_covered = whole months between coverage_start_date
      # and current_date. Eligible only if months_covered >= plan.major_waiting_period_months.
      # Frequency: find the most recent PAID/PARTIALLY_PAID Claim for the same patient and
      # same cdt_code; let gap = whole months between its adjudication date and current_date.
      # Eligible only if no such claim OR gap >= plan.frequency_limit_months.
      waiting_ok   = (item.category != MAJOR) OR (months_covered >= major_waiting_period_months)
      frequency_ok = (no prior paid same-cdt claim) OR (gap_months >= frequency_limit_months)
    input_set: "PatientCoverage + InsurancePlan + patient's prior PAID/PARTIALLY_PAID Claims for same cdt_code."
    constants: {}
    precision: "whole calendar months; both checks use >= (exactly N months is eligible)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids resolve (validated left-to-right in path, then body FKs)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, conditional fields present (surface for SURFACE charting, pocket_depth_mm for PERIO)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: concurrency
    check: "When expected_claim_version supplied on POST /payment-plans, it must equal Claim.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /payment-plans"
    note: "Concurrency precedes business logic so a stale writer fails fast."

  - priority: 6
    category: state
    check: "Target resource is in a state that permits this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Provider type compatible with appointment_type (HYGIENIST -> PREVENTIVE only); operatory OPEN; provider/patient ACTIVE; coverage belongs to the claim's patient"
    error_id: ERR_PROVIDER_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /appointments, POST /claims"

  - priority: 8
    category: business_temporal
    check: "New appointment chair-time does not overlap an existing non-terminal appointment on the same operatory (with turnover buffer) or the same provider (no buffer)"
    error_id: ERR_OPERATORY_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 9
    category: business_temporal
    check: "MAJOR procedure satisfies the plan's waiting period; same-cdt frequency gap satisfied (Predetermination create)"
    error_id: ERR_WAITING_PERIOD_NOT_MET
    http_status: 409
    applies_to: "POST /predeterminations"

  - priority: 10
    category: business_constraint
    check: "Claim's TreatmentPlanItem is COMPLETED before a claim may be created"
    error_id: ERR_ITEM_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /claims"

  - priority: 11
    category: business_fiscal
    check: "Coverage annual maximum already reached blocks creating a Predetermination for a benefit-bearing item; adjudication clamps but does not error"
    error_id: ERR_ANNUAL_MAX_REACHED
    http_status: 402
    applies_to: "POST /predeterminations"

