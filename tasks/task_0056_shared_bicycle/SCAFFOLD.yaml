# =============================================================================
# Shared Bicycle Operation System — SCAFFOLD (v1)
# =============================================================================

scenario: |
  Shared bicycle operation system: bicycle deployment with bicycle ledger (bike
  ID/lock ID/model), deployment-zone planning, on-shelf and off-shelf workflow,
  deployment quota by region, and bicycle-status (available/in-use/fault/recall)
  tracking; user riding billing with QR-code unlock, GPS-based ride tracking,
  billing rules (per-minute/segment/daily-cap), free-period rules, monthly-pass
  deduction, and end-of-ride settlement; geofence control with electronic-fence
  configuration (allowed-parking/restricted/forbidden), out-of-zone return
  penalty, in-zone return reward, fence-violation alert, and dynamic fence
  adjustment; fault reporting with user-reported fault categorization, automatic
  anomaly detection (long-time stationary/abnormal-lock-status/low-battery),
  fault-bike isolation (lock-out from new orders), and repair-ticket dispatch;
  field operation dispatch with low-density-zone replenishment, high-density-zone
  clearance, charging/battery-swap routing for e-bikes, operator task assignment,
  and SLA monitoring; bicycle reallocation with cross-zone transfer plan,
  transfer-vehicle dispatch, transfer record, and post-transfer status update;
  loss accounting with loss-cause classification (theft/damage/abandoned),
  responsibility attribution, financial-impact recording, scrap workflow, and
  abnormal-loss-rate analysis; event-driven synchronization with payment, IM,
  and mapping systems; audit logging for billing adjustments and operation
  actions.

domain_name: shared-bicycle
api_prefix: /regions

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Region label, unique" }
      - { name: deployment_quota, type: integer, source: input, description: "Maximum total deployed bikes allowed in region" }
      - { name: low_density_threshold, type: integer, source: input, description: "Available bike count at or below which dispatch triggers replenishment", constraints: ">=0" }
      - { name: high_density_threshold, type: integer, source: input, description: "Available bike count at or above which dispatch triggers clearance", constraints: ">low_density_threshold" }
      - { name: in_zone_return_reward_cents, type: integer, source: input, description: "Reward credited to wallet when ride ends inside an ALLOWED_PARKING geofence in this region", default: 0 }
      - { name: out_of_zone_penalty_cents, type: integer, source: input, description: "Penalty surcharged when ride ends in a RESTRICTED geofence", default: 0 }
      - { name: deployed_count, type: integer, source: computed, description: "Bikes currently ON_SHELF in this region across all statuses" }
      - { name: available_count, type: integer, source: computed, description: "Bikes ON_SHELF with status=AVAILABLE in this region" }
      - { name: density_posture, type: enum, source: computed, description: "LOW | NORMAL | HIGH; LOW if available_count<=low_density_threshold, HIGH if available_count>=high_density_threshold, else NORMAL", constraints: "enum: LOW|NORMAL|HIGH" }
      - { name: clock_minutes, type: integer, source: system, description: "Deterministic clock in whole minutes, starts at 0, only advanced by POST /_clock/advance" }

  - name: Geofence
    parent: null
    common_fields: false
    fields:
      - { name: region_id, type: string, source: input, description: "Region this geofence belongs to" }
      - { name: label, type: string, source: input, description: "Human-readable label" }
      - { name: kind, type: enum, source: input, description: "ALLOWED_PARKING | RESTRICTED | FORBIDDEN", constraints: "enum: ALLOWED_PARKING|RESTRICTED|FORBIDDEN" }
      - { name: polygon, type: array, source: input, description: "Ordered list of {lat,lng} vertices defining a simple polygon (>=3, <=32 vertices)" }
      - { name: active, type: boolean, source: input, description: "If true, fence is currently enforced; dynamic adjustment toggles this", default: true }
      - { name: revision, type: integer, source: system, description: "Increments on every shape or active-flag mutation; starts at 1" }

  - name: Bike
    parent: null
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "Region the bike is currently deployed to (null if OFF_SHELF and not yet deployed)" }
      - { name: model, type: enum, source: input, description: "STANDARD | E_BIKE", constraints: "enum: STANDARD|E_BIKE" }
      - { name: lock_id, type: string, source: input, description: "Globally unique lock identifier" }
      - { name: shelf_state, type: enum, source: system, description: "OFF_SHELF | ON_SHELF | SCRAPPED", constraints: "enum: OFF_SHELF|ON_SHELF|SCRAPPED" }
      - { name: status, type: enum, source: system, description: "Operational status when ON_SHELF: AVAILABLE | IN_USE | FAULT | RECALL", constraints: "enum: AVAILABLE|IN_USE|FAULT|RECALL" }
      - { name: battery_pct, type: integer, source: input, description: "Battery percentage 0-100; STANDARD bikes always 100" }
      - { name: last_lat, type: number, source: system, description: "Latest reported latitude" }
      - { name: last_lng, type: number, source: system, description: "Latest reported longitude" }
      - { name: last_motion_minute, type: integer, source: system, description: "clock_minutes value at last motion or ride-end" }
      - { name: lock_state, type: enum, source: system, description: "LOCKED | UNLOCKED | UNKNOWN", constraints: "enum: LOCKED|UNLOCKED|UNKNOWN" }
      - { name: fault_categories, type: array, source: system, description: "Array of currently-open fault category strings (e.g., FLAT_TIRE, LOCK_FAILURE)" }
      - { name: current_ride_id, type: string, source: system, description: "Active Ride.id when status=IN_USE, else null" }

  - name: Rider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: wallet_balance_cents, type: integer, source: system, description: "Wallet balance; never negative", default: 0 }
      - { name: monthly_pass_expires_minute, type: integer, source: system, description: "clock_minutes at which active monthly pass expires; 0 if no active pass", default: 0 }
      - { name: free_minutes_remaining, type: integer, source: system, description: "Free-period minutes credited to rider, decremented on settlement", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "enum: ACTIVE|SUSPENDED", default: ACTIVE }

  - name: Ride
    parent: null
    common_fields: true
    fields:
      - { name: rider_id, type: string, source: input, description: "Owning rider" }
      - { name: bike_id, type: string, source: input, description: "Bike being ridden" }
      - { name: region_id, type: string, source: system, description: "Region the bike was unlocked in (frozen at unlock)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SETTLED | VOIDED | DISPUTED", constraints: "enum: ACTIVE|SETTLED|VOIDED|DISPUTED" }
      - { name: start_minute, type: integer, source: system, description: "clock_minutes at unlock" }
      - { name: end_minute, type: integer, source: system, description: "clock_minutes at end-of-ride lock; null while ACTIVE" }
      - { name: end_lat, type: number, source: system, description: "Latitude at ride end" }
      - { name: end_lng, type: number, source: system, description: "Longitude at ride end" }
      - { name: end_fence_kind, type: enum, source: computed, description: "Geofence kind at end location: ALLOWED_PARKING | RESTRICTED | NONE; FORBIDDEN is blocked at lock time", constraints: "enum: ALLOWED_PARKING|RESTRICTED|NONE" }
      - { name: applied_free_minutes, type: integer, source: computed, description: "Free minutes consumed by this ride", default: 0 }
      - { name: pass_covered_minutes, type: integer, source: computed, description: "Minutes covered by monthly pass (zero-cost)", default: 0 }
      - { name: chargeable_minutes, type: integer, source: computed, description: "Minutes that incur per-minute charges after free + pass coverage" }
      - { name: base_fare_cents, type: integer, source: computed, description: "Fare from per-minute/segment rates before adjustments and cap" }
      - { name: penalty_cents, type: integer, source: computed, description: "Out-of-zone penalty applied at settlement", default: 0 }
      - { name: reward_cents, type: integer, source: computed, description: "In-zone reward credited at settlement", default: 0 }
      - { name: final_fare_cents, type: integer, source: computed, description: "Final billed amount after cap and penalty (reward credited separately to wallet)" }
      - { name: settlement_variant, type: enum, source: computed, description: "PER_MINUTE | DAILY_CAP — which billing variant produced final_fare_cents", constraints: "enum: PER_MINUTE|DAILY_CAP" }
      - { name: payment_event_id, type: string, source: system, description: "Idempotency token forwarded to payment system on settlement" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: bike_id, type: string, source: input, description: "Subject bike" }
      - { name: region_id, type: string, source: system, description: "Region of bike at creation" }
      - { name: cause, type: enum, source: input, description: "USER_REPORT | LONG_STATIONARY | LOCK_ABNORMAL | LOW_BATTERY | RECALL", constraints: "enum: USER_REPORT|LONG_STATIONARY|LOCK_ABNORMAL|LOW_BATTERY|RECALL" }
      - { name: category, type: enum, source: input, description: "FLAT_TIRE | BRAKE | LOCK_FAILURE | BATTERY_SWAP | CHARGING | OTHER", constraints: "enum: FLAT_TIRE|BRAKE|LOCK_FAILURE|BATTERY_SWAP|CHARGING|OTHER" }
      - { name: status, type: enum, source: system, description: "OPEN | ASSIGNED | RESOLVED | CANCELLED", constraints: "enum: OPEN|ASSIGNED|RESOLVED|CANCELLED" }
      - { name: assigned_operator_id, type: string, source: system, description: "Operator id (opaque) when ASSIGNED" }
      - { name: sla_minutes, type: integer, source: input, description: "Allowed minutes from creation to resolution" }
      - { name: opened_minute, type: integer, source: system, description: "clock_minutes at OPEN" }
      - { name: resolved_minute, type: integer, source: system, description: "clock_minutes at RESOLVED" }
      - { name: sla_breached, type: boolean, source: computed, description: "true iff (resolved_minute - opened_minute) > sla_minutes; for unresolved, true iff (current_clock - opened_minute) > sla_minutes" }
      - { name: resolution_note, type: string, source: input, description: "Resolution outcome text; required at RESOLVED" }

  - name: TransferOrder
    parent: null
    common_fields: true
    fields:
      - { name: from_region_id, type: string, source: input, description: "Source region" }
      - { name: to_region_id, type: string, source: input, description: "Destination region" }
      - { name: bike_ids, type: array, source: input, description: "Ordered list of Bike.id selected for transfer" }
      - { name: status, type: enum, source: system, description: "PLANNED | IN_TRANSIT | COMPLETED | CANCELLED", constraints: "enum: PLANNED|IN_TRANSIT|COMPLETED|CANCELLED" }
      - { name: dispatched_minute, type: integer, source: system, description: "clock_minutes at IN_TRANSIT" }
      - { name: completed_minute, type: integer, source: system, description: "clock_minutes at COMPLETED" }
      - { name: kind, type: enum, source: computed, description: "REPLENISH | CLEARANCE — REPLENISH if to_region density_posture was LOW at plan time, CLEARANCE if from_region was HIGH; if neither, PLANNED is rejected", constraints: "enum: REPLENISH|CLEARANCE" }

  - name: LossRecord
    parent: null
    common_fields: false
    fields:
      - { name: bike_id, type: string, source: input, description: "Bike declared lost; must be ON_SHELF or OFF_SHELF (not SCRAPPED) at creation" }
      - { name: region_id, type: string, source: system, description: "Region of bike at creation" }
      - { name: cause, type: enum, source: input, description: "THEFT | DAMAGE | ABANDONED", constraints: "enum: THEFT|DAMAGE|ABANDONED" }
      - { name: responsibility, type: enum, source: input, description: "RIDER | OPERATOR | UNKNOWN", constraints: "enum: RIDER|OPERATOR|UNKNOWN" }
      - { name: responsible_party_id, type: string, source: input, description: "Rider.id when responsibility=RIDER; opaque operator id when responsibility=OPERATOR; null when UNKNOWN" }
      - { name: financial_impact_cents, type: integer, source: input, description: "Loss amount in cents, > 0" }
      - { name: scrapped, type: boolean, source: system, description: "True after scrap workflow runs on the underlying Bike", default: false }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: actor_role, type: string, source: system, description: "Role from X-User-Role at request time" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at request time" }
      - { name: event_kind, type: enum, source: system, description: "BILLING_ADJUSTMENT | OPS_ACTION | EXTERNAL_SYNC", constraints: "enum: BILLING_ADJUSTMENT|OPS_ACTION|EXTERNAL_SYNC" }
      - { name: action, type: string, source: system, description: "Free-text action label (e.g., RIDE_FARE_ADJUST, FENCE_ACTIVATE, TRANSFER_DISPATCH, PAYMENT_SYNC)" }
      - { name: subject_type, type: string, source: system, description: "Entity name the action targets (e.g., Ride, Bike, Geofence)" }
      - { name: subject_id, type: string, source: system, description: "Targeted entity id" }
      - { name: before, type: object, source: system, description: "JSON snapshot of relevant fields before change; {} for create-only events" }
      - { name: after, type: object, source: system, description: "JSON snapshot of relevant fields after change" }
      - { name: clock_minute, type: integer, source: system, description: "clock_minutes at write" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Bike
    field: shelf_state
    initial_state: OFF_SHELF
    terminal_states: [SCRAPPED]
    transitions:
      - from: OFF_SHELF
        to: ON_SHELF
        trigger: "POST /regions/{region_id}/bikes/{bike_id}/shelf with action=ON"
        actor: Operator
        preconditions:
          - "Region.deployed_count + 1 <= Region.deployment_quota (ERR_QUOTA_EXCEEDED)"
          - "Bike has no open WorkOrder with status in {OPEN, ASSIGNED} (ERR_BIKE_HAS_OPEN_WORKORDER)"
          - "Bike.battery_pct >= 20 if model=E_BIKE (ERR_BATTERY_TOO_LOW)"
        side_effects:
          - "Set Bike.shelf_state=ON_SHELF, status=AVAILABLE, region_id=path region"
          - "Region.deployed_count and Region.available_count recomputed (derived_field_reconciliation)"
          - "Region.density_posture recomputed; if it crosses LOW→NORMAL or HIGH→NORMAL the change is logged"
          - "AuditLog event_kind=OPS_ACTION, action=BIKE_ON_SHELF"

      - from: ON_SHELF
        to: OFF_SHELF
        trigger: "POST /regions/{region_id}/bikes/{bike_id}/shelf with action=OFF"
        actor: Operator
        preconditions:
          - "Bike.status != IN_USE (ERR_BIKE_IN_USE)"
        side_effects:
          - "Set Bike.shelf_state=OFF_SHELF, status defaults to AVAILABLE upon re-shelf"
          - "Region.deployed_count and Region.available_count recomputed"
          - "AuditLog event_kind=OPS_ACTION, action=BIKE_OFF_SHELF"

      - from: ON_SHELF
        to: SCRAPPED
        trigger: "POST /bikes/{bike_id}/scrap (driven by LossRecord workflow or system)"
        actor: Admin
        preconditions:
          - "Bike.status != IN_USE (ERR_BIKE_IN_USE)"
          - "A LossRecord referencing this bike exists with scrapped=false (ERR_NO_LOSS_RECORD)"
        side_effects:
          - "Set Bike.shelf_state=SCRAPPED, status remains as last value but is no longer relevant"
          - "Region.deployed_count and Region.available_count recomputed"
          - "Set LossRecord.scrapped=true"
          - "AuditLog event_kind=OPS_ACTION, action=BIKE_SCRAP"
      - from: OFF_SHELF
        to: SCRAPPED
        trigger: "POST /bikes/{bike_id}/scrap"
        actor: Admin
        preconditions:
          - "A LossRecord referencing this bike exists with scrapped=false (ERR_NO_LOSS_RECORD)"
        side_effects:
          - "Set Bike.shelf_state=SCRAPPED"
          - "Set LossRecord.scrapped=true"
          - "AuditLog event_kind=OPS_ACTION, action=BIKE_SCRAP"

  - entity: Bike
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: IN_USE
        trigger: "POST /rides (QR-unlock)"
        actor: Rider
        preconditions:
          - "Bike.shelf_state == ON_SHELF (ERR_BIKE_OFF_SHELF)"
          - "Bike.status == AVAILABLE (ERR_BIKE_NOT_AVAILABLE)"
          - "Bike not located inside a FORBIDDEN active Geofence (ERR_BIKE_IN_FORBIDDEN_ZONE)"
          - "Rider.status == ACTIVE (ERR_RIDER_SUSPENDED)"
          - "Rider has no other ACTIVE Ride (ERR_RIDER_HAS_ACTIVE_RIDE)"
          - "Rider.wallet_balance_cents + (monthly_pass_active?inf:0) >= MIN_UNLOCK_BALANCE_CENTS or pass active (ERR_INSUFFICIENT_BALANCE)"
        side_effects:
          - "Create Ride with status=ACTIVE, start_minute=Region.clock_minutes"
          - "Set Bike.status=IN_USE, lock_state=UNLOCKED, current_ride_id"
          - "Region.available_count decremented; density_posture recomputed"
          - "AuditLog event_kind=OPS_ACTION, action=RIDE_UNLOCK"

      - from: IN_USE
        to: AVAILABLE
        trigger: "POST /rides/{ride_id}/end (settles ride; end-location must not be FORBIDDEN active Geofence)"
        actor: Rider
        preconditions:
          - "Ride.status == ACTIVE (ERR_RIDE_NOT_ACTIVE)"
          - "End-of-ride lat/lng not inside any FORBIDDEN active Geofence in Bike.region_id (ERR_END_IN_FORBIDDEN_ZONE)"
        side_effects:
          - "Compute ride settlement: applied_free_minutes, pass_covered_minutes, chargeable_minutes, base_fare_cents, penalty_cents, reward_cents, final_fare_cents, settlement_variant via calc ride_fare_settlement"
          - "Decrement Rider.free_minutes_remaining by applied_free_minutes; charge Rider.wallet_balance_cents by final_fare_cents; credit reward_cents to wallet"
          - "Ride.status=SETTLED, end_minute=clock_minutes"
          - "Bike.status=AVAILABLE, lock_state=LOCKED, current_ride_id=null, last_motion_minute=clock_minutes"
          - "Region.available_count incremented; density_posture recomputed"
          - "Emit payment-system sync (EXTERNAL_SYNC AuditLog with payment_event_id)"

      - from: AVAILABLE
        to: FAULT
        trigger: "POST /bikes/{bike_id}/fault-report or automatic anomaly detection during POST /_sweep/run"
        actor: Rider | system
        preconditions:
          - "Bike.shelf_state == ON_SHELF (ERR_BIKE_OFF_SHELF)"
          - "Bike.status in {AVAILABLE} (ERR_BIKE_NOT_AVAILABLE)"
        side_effects:
          - "Append category to Bike.fault_categories"
          - "Set Bike.status=FAULT (locks bike out of new rides — fault-bike isolation)"
          - "Open WorkOrder with cause inferred from trigger and status=OPEN, opened_minute=clock_minutes"
          - "Region.available_count decremented; density_posture recomputed"
          - "AuditLog event_kind=OPS_ACTION, action=BIKE_FAULT_OPEN"

      - from: IN_USE
        to: FAULT
        trigger: "POST /rides/{ride_id}/fault-report (rider reports during active ride; ride auto-ends)"
        actor: Rider
        preconditions:
          - "Ride.status == ACTIVE (ERR_RIDE_NOT_ACTIVE)"
        side_effects:
          - "End ride at current location with billing computed up to clock_minute (penalty waived if end_fence_kind=RESTRICTED because fault rendered bike unusable), Ride.status=SETTLED, settlement_variant per cap rule"
          - "Set Bike.status=FAULT, append category to fault_categories"
          - "Open WorkOrder cause=USER_REPORT, status=OPEN, opened_minute=clock_minutes"
          - "Region.available_count unchanged (bike was IN_USE, not AVAILABLE)"

      - from: FAULT
        to: AVAILABLE
        trigger: "POST /workorders/{id}/resolve (when the only open WorkOrder for the bike is resolved)"
        actor: Operator
        preconditions:
          - "WorkOrder.status == ASSIGNED (ERR_WORKORDER_NOT_ASSIGNED)"
        side_effects:
          - "Clear matching category from Bike.fault_categories"
          - "If fault_categories is now empty AND no other OPEN/ASSIGNED WorkOrder for this Bike: Bike.status=AVAILABLE"
          - "Else Bike.status remains FAULT"
          - "Region.available_count recomputed; density_posture recomputed"
          - "AuditLog event_kind=OPS_ACTION, action=WORKORDER_RESOLVE"

      - from: AVAILABLE
        to: RECALL
        trigger: "POST /bikes/{bike_id}/recall"
        actor: Operator
        preconditions:
          - "Bike.status == AVAILABLE (ERR_BIKE_NOT_AVAILABLE)"
          - "Bike has no active Ride (ERR_BIKE_IN_USE)"
        side_effects:
          - "Set Bike.status=RECALL (locks bike out of rides)"
          - "Region.available_count decremented; density_posture recomputed"
          - "AuditLog event_kind=OPS_ACTION, action=BIKE_RECALL"

      - from: RECALL
        to: AVAILABLE
        trigger: "POST /bikes/{bike_id}/release-recall"
        actor: Operator
        preconditions:
          - "Bike.status == RECALL (ERR_BIKE_NOT_IN_RECALL)"
          - "Bike has no open WorkOrder with status in {OPEN, ASSIGNED} (ERR_BIKE_HAS_OPEN_WORKORDER)"
        side_effects:
          - "Set Bike.status=AVAILABLE"
          - "Region.available_count recomputed; density_posture recomputed"

  - entity: Ride
    field: status
    initial_state: ACTIVE
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /rides/{ride_id}/end"
        actor: Rider
        preconditions:
          - "Ride.status == ACTIVE (ERR_RIDE_NOT_ACTIVE)"
          - "End location not inside any FORBIDDEN active Geofence (ERR_END_IN_FORBIDDEN_ZONE)"
        side_effects:
          - "Run calculation ride_fare_settlement; persist all computed fields"
          - "Wallet debit final_fare_cents; wallet credit reward_cents"
          - "Bike.status flips IN_USE → AVAILABLE (cross-machine; see Bike.status transition above)"

      - from: ACTIVE
        to: SETTLED
        trigger: "POST /rides/{ride_id}/fault-report (fault during ride)"
        actor: Rider
        preconditions:
          - "Ride.status == ACTIVE (ERR_RIDE_NOT_ACTIVE)"
        side_effects:
          - "Run ride_fare_settlement with penalty_cents=0 (fault waiver) regardless of end_fence_kind"
          - "Wallet debit final_fare_cents; wallet credit reward_cents if end_fence_kind=ALLOWED_PARKING"
          - "Bike.status flips IN_USE → FAULT (cross-machine; see Bike.status transition above)"

      - from: SETTLED
        to: DISPUTED
        trigger: "POST /rides/{ride_id}/dispute"
        actor: Rider
        preconditions:
          - "Ride.status == SETTLED (ERR_RIDE_NOT_SETTLED)"
          - "Dispute opened within DISPUTE_WINDOW_MINUTES of end_minute (ERR_DISPUTE_WINDOW_CLOSED)"
        side_effects:
          - "Set Ride.status=DISPUTED (no money moves)"
          - "AuditLog event_kind=BILLING_ADJUSTMENT, action=RIDE_DISPUTE_OPEN"

      - from: DISPUTED
        to: SETTLED
        trigger: "POST /rides/{ride_id}/adjust (admin reduces fare or refunds)"
        actor: Admin
        preconditions:
          - "Ride.status == DISPUTED (ERR_RIDE_NOT_DISPUTED)"
          - "adjust_cents <= original final_fare_cents (ERR_ADJUSTMENT_EXCEEDS_FARE)"
        side_effects:
          - "Credit (final_fare_cents - new_final_fare_cents) back to Rider.wallet_balance_cents"
          - "Update Ride.final_fare_cents = new_final_fare_cents; settlement_variant unchanged"
          - "AuditLog event_kind=BILLING_ADJUSTMENT with before={final_fare_cents:old}, after={final_fare_cents:new}"
          - "Emit payment-system sync (EXTERNAL_SYNC AuditLog)"

      - from: ACTIVE
        to: VOIDED
        trigger: "POST /rides/{ride_id}/void (admin only; corrects bogus unlock)"
        actor: Admin
        preconditions:
          - "Ride.status == ACTIVE (ERR_RIDE_NOT_ACTIVE)"
        side_effects:
          - "Ride.status=VOIDED, final_fare_cents=0"
          - "Bike.status=AVAILABLE (or returns to its pre-ride status if FAULT existed — but VOID is only legal when no fault)"
          - "Wallet balance unchanged"

  - entity: WorkOrder
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /workorders/{id}/assign"
        actor: Operator
        preconditions:
          - "WorkOrder.status == OPEN (ERR_WORKORDER_NOT_OPEN)"
          - "assigned_operator_id is provided (ERR_OPERATOR_REQUIRED)"
        side_effects:
          - "Set assigned_operator_id"
          - "AuditLog event_kind=OPS_ACTION, action=WORKORDER_ASSIGN"

      - from: ASSIGNED
        to: RESOLVED
        trigger: "POST /workorders/{id}/resolve"
        actor: Operator
        preconditions:
          - "WorkOrder.status == ASSIGNED (ERR_WORKORDER_NOT_ASSIGNED)"
          - "resolution_note provided"
        side_effects:
          - "Set status=RESOLVED, resolved_minute=clock_minutes"
          - "Trigger Bike.status flip FAULT→AVAILABLE if conditions met (see Bike.status transitions)"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /workorders/{id}/cancel"
        actor: Operator
        preconditions:
          - "WorkOrder.status == OPEN (ERR_WORKORDER_NOT_OPEN)"
        side_effects:
          - "Set status=CANCELLED"
          - "If this was the only open WorkOrder for the bike and fault_categories becomes empty, Bike.status FAULT→AVAILABLE"

  - entity: TransferOrder
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_TRANSIT
        trigger: "POST /transfers/{id}/dispatch"
        actor: Operator
        preconditions:
          - "TransferOrder.status == PLANNED (ERR_TRANSFER_NOT_PLANNED)"
          - "All bike_ids: Bike.region_id == from_region_id AND Bike.status == AVAILABLE AND shelf_state == ON_SHELF (ERR_BIKE_NOT_AVAILABLE_FOR_TRANSFER)"
          - "TransferOrder.kind matches current Region postures: REPLENISH requires to_region.density_posture == LOW at dispatch; CLEARANCE requires from_region.density_posture == HIGH at dispatch (ERR_TRANSFER_KIND_MISMATCH)"
          - "to_region.deployed_count + len(bike_ids) <= to_region.deployment_quota (ERR_QUOTA_EXCEEDED)"
        side_effects:
          - "For each bike: shelf_state=OFF_SHELF, region_id=null"
          - "Recompute from_region counts and density_posture (transitive cascade hop 1)"
          - "Set TransferOrder.status=IN_TRANSIT, dispatched_minute=clock_minutes"

      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /transfers/{id}/complete"
        actor: Operator
        preconditions:
          - "TransferOrder.status == IN_TRANSIT (ERR_TRANSFER_NOT_IN_TRANSIT)"
        side_effects:
          - "For each bike: region_id=to_region_id, shelf_state=ON_SHELF, status=AVAILABLE"
          - "Recompute to_region counts and density_posture (transitive cascade hop 2)"
          - "If to_region.density_posture flips LOW→NORMAL OR LOW→HIGH, automatically CANCEL any other PLANNED TransferOrder targeting to_region with kind=REPLENISH (transitive cascade hop 3)"
          - "Set TransferOrder.status=COMPLETED, completed_minute=clock_minutes"
          - "AuditLog event_kind=OPS_ACTION, action=TRANSFER_COMPLETE"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /transfers/{id}/cancel"
        actor: Operator
        preconditions:
          - "TransferOrder.status == PLANNED (ERR_TRANSFER_NOT_PLANNED)"
        side_effects:
          - "Set status=CANCELLED"
      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /transfers/{id}/cancel"
        actor: Operator
        preconditions:
          - "TransferOrder.status == IN_TRANSIT (ERR_TRANSFER_NOT_IN_TRANSIT)"
        side_effects:
          - "Restore each bike to from_region_id with shelf_state=ON_SHELF, status=AVAILABLE"
          - "Recompute from_region counts and density_posture"
          - "Set status=CANCELLED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two riders POST /rides simultaneously targeting the same AVAILABLE bike"
    guarantee: "At most one ride is created; the bike transitions AVAILABLE→IN_USE exactly once; loser is rejected"
    error_id: ERR_BIKE_NOT_AVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Bike.status; loser sees post-state AVAILABLE→IN_USE and is rejected with bike-not-available"

  - scenario: "Rider POST /rides/{id}/end and Admin POST /rides/{id}/void race"
    guarantee: "Exactly one succeeds; loser observes Ride.status no longer ACTIVE and is rejected"
    error_id: ERR_RIDE_NOT_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on Ride.status"

  - scenario: "Two operators POST /workorders/{id}/assign concurrently"
    guarantee: "Exactly one assignment wins; loser receives state-conflict error"
    error_id: ERR_WORKORDER_NOT_OPEN
    http_status: 409
    serialization: "First-writer-wins on WorkOrder.status"

  - scenario: "PATCH /bikes/{id} sent with stale version header"
    guarantee: "Stale-write rejected; resource version mismatch error"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency via version field"

  - scenario: "Two TransferOrder dispatches reference the same bike id"
    guarantee: "Only one dispatch can move the bike; loser fails because the bike is no longer in from_region"
    error_id: ERR_BIKE_NOT_AVAILABLE_FOR_TRANSFER
    http_status: 409
    serialization: "First-writer-wins on Bike.region_id and Bike.shelf_state"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ride_fare_settlement
    trigger: "On POST /rides/{id}/end or POST /rides/{id}/fault-report (cross-references Ride state transitions ACTIVE→SETTLED)"
    algorithm: tiered_pricing
    input_set: "The single Ride being settled, plus its Rider (for free_minutes_remaining, monthly_pass_expires_minute, wallet_balance_cents), its Bike (for model), its Region (for in_zone_return_reward_cents, out_of_zone_penalty_cents, clock_minutes), and the active Geofences in Bike.region_id at end_minute."
    formula: |
      # All times in whole minutes (Region.clock_minutes).
      duration = max(end_minute - start_minute, 1)             # minimum 1 minute billed
      bike_model = Bike.model                                  # STANDARD or E_BIKE
      pass_active = Rider.monthly_pass_expires_minute > end_minute
      # Step 1: free-period coverage
      applied_free_minutes = min(Rider.free_minutes_remaining, duration)
      remaining_after_free = duration - applied_free_minutes
      # Step 2: monthly pass coverage (STANDARD only; pass does NOT cover E_BIKE minutes)
      if pass_active and bike_model == STANDARD:
          pass_covered_minutes = remaining_after_free
      else:
          pass_covered_minutes = 0
      chargeable_minutes = remaining_after_free - pass_covered_minutes
      # Step 3: per-minute / segment rate (segment thresholds)
      if bike_model == STANDARD:
          per_min_rate = PER_MIN_RATE_STD_CENTS                # 30 cents/min for first SEGMENT_BREAK_MIN minutes
          over_rate = PER_MIN_OVER_RATE_STD_CENTS              # 50 cents/min beyond
      else:  # E_BIKE
          per_min_rate = PER_MIN_RATE_EBIKE_CENTS              # 60 cents/min for first SEGMENT_BREAK_MIN
          over_rate = PER_MIN_OVER_RATE_EBIKE_CENTS            # 100 cents/min beyond
      first_seg = min(chargeable_minutes, SEGMENT_BREAK_MIN)
      over_seg = max(chargeable_minutes - SEGMENT_BREAK_MIN, 0)
      base_fare_cents = first_seg * per_min_rate + over_seg * over_rate
      # Step 4: daily cap (cap applies BEFORE penalties/rewards)
      daily_cap = DAILY_CAP_STD_CENTS if bike_model == STANDARD else DAILY_CAP_EBIKE_CENTS
      if base_fare_cents >= daily_cap:
          base_fare_cents_capped = daily_cap
          settlement_variant = "DAILY_CAP"
      else:
          base_fare_cents_capped = base_fare_cents
          settlement_variant = "PER_MINUTE"
      # Step 5: geofence outcome at end location
      end_fence_kind = lookup_active_fence_at(end_lat, end_lng, Bike.region_id)  # ALLOWED_PARKING | RESTRICTED | NONE; FORBIDDEN blocked upstream
      if end_fence_kind == "RESTRICTED" and trigger != "fault-report":
          penalty_cents = Region.out_of_zone_penalty_cents
      else:
          penalty_cents = 0
      if end_fence_kind == "ALLOWED_PARKING":
          reward_cents = Region.in_zone_return_reward_cents
      else:
          reward_cents = 0
      final_fare_cents = base_fare_cents_capped + penalty_cents
      # Step 6: side-effects on Rider wallet
      Rider.free_minutes_remaining -= applied_free_minutes
      Rider.wallet_balance_cents   -= final_fare_cents     # may NOT take wallet below 0 — validation ERR_INSUFFICIENT_BALANCE at end time
      Rider.wallet_balance_cents   += reward_cents
    input_set_filter: "Bike.region_id frozen at unlock determines Region used (does NOT change if bike crosses region during ride)."
    constants:
      PER_MIN_RATE_STD_CENTS: 30
      PER_MIN_OVER_RATE_STD_CENTS: 50
      PER_MIN_RATE_EBIKE_CENTS: 60
      PER_MIN_OVER_RATE_EBIKE_CENTS: 100
      SEGMENT_BREAK_MIN: 30
      DAILY_CAP_STD_CENTS: 1500
      DAILY_CAP_EBIKE_CENTS: 3000
      MIN_UNLOCK_BALANCE_CENTS: 100
      DISPUTE_WINDOW_MINUTES: 1440
    precision: "Integer cents; no fractional rounding (all rates are whole cents). Order pinned: per-minute → segment sum → cap clamp → penalty added → reward credited separately."
    variants:
      - name: PER_MINUTE
        when: "base_fare_cents < daily_cap"
        difference: "final_fare_cents = base_fare_cents + penalty_cents; raw segment math drives charge"
      - name: DAILY_CAP
        when: "base_fare_cents >= daily_cap"
        difference: "base_fare_cents_capped clamped to daily_cap; penalty still added on top of the cap"

  - name: region_loss_rate
    trigger: "On GET /regions/{region_id}/loss-rate (read-only analytics; recomputed on demand)"
    algorithm: aggregation
    input_set: "All LossRecord rows with region_id == path region, plus all Bike rows with region_id == path region having shelf_state in {ON_SHELF, OFF_SHELF, SCRAPPED}. Window is the lifetime of the region (no time bounds)."
    formula: |
      loss_count = count(LossRecord WHERE region_id == path_region)
      deployed_lifetime = count(Bike WHERE (region_id == path_region) OR
                                            (region_id IS NULL AND any prior shelf_state was ON_SHELF in this region))
      # Tie-break: identical Bike ids are NOT double-counted; LossRecord.cause is NOT filtered out.
      if deployed_lifetime == 0:
          loss_rate = 0.0
      else:
          loss_rate = loss_count / deployed_lifetime
      # Provisional vs. attributed:
      #   provisional_loss_rate  = loss_count / deployed_lifetime   (counts EVERY LossRecord)
      #   attributed_loss_rate   = count(LossRecord WHERE responsibility != UNKNOWN) / deployed_lifetime
      anomaly = (provisional_loss_rate > ANOMALY_RATE_THRESHOLD)
    constants:
      ANOMALY_RATE_THRESHOLD: 0.05
    precision: "loss_rate stored as floating-point ratio; output rounded to 4 decimal places, round_half_up at the API boundary only."
    variants:
      - name: provisional
        when: "All loss records counted, including responsibility=UNKNOWN"
        difference: "Numerator includes every LossRecord regardless of responsibility"
      - name: attributed
        when: "Only loss records with responsibility != UNKNOWN counted"
        difference: "Numerator excludes UNKNOWN, denominator unchanged. Yields a different number for the same Region whenever any LossRecord has responsibility=UNKNOWN."

  - name: workorder_sla_breached
    trigger: "On read of WorkOrder.sla_breached (computed on every GET, and at resolve time)"
    algorithm: threshold
    input_set: "Single WorkOrder plus Region.clock_minutes."
    formula: |
      if status in {RESOLVED}:
          sla_breached = (resolved_minute - opened_minute) > sla_minutes
      elif status in {CANCELLED}:
          sla_breached = false                              # cancelled work orders never breach
      else:  # OPEN, ASSIGNED
          sla_breached = (current_clock_minute - opened_minute) > sla_minutes
    constants: {}
    precision: "Integer minute comparison; strict > (equal to sla_minutes is NOT a breach)."
    variants: []

  - name: density_posture
    trigger: "Recomputed whenever Region.available_count changes (after bike on/off shelf, ride start/end, fault open/resolve, transfer dispatch/complete/cancel, recall)"
    algorithm: threshold
    input_set: "Single Region's available_count plus its two thresholds."
    formula: |
      if Region.available_count <= Region.low_density_threshold:
          density_posture = "LOW"
      elif Region.available_count >= Region.high_density_threshold:
          density_posture = "HIGH"
      else:
          density_posture = "NORMAL"
    constants: {}
    precision: "Integer compare. Tie semantics pinned: <= for LOW (inclusive) and >= for HIGH (inclusive)."
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and decodable"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role in {Rider, Operator, Admin, FieldStaff}; identity rules per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (Region, Bike, Ride, WorkOrder, TransferOrder, Geofence, Rider, LossRecord), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Cross-entity foreign keys in body resolve (rider_id, bike_id, region_id, from_region_id, to_region_id, owner Rider for monthly-pass purchase)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /rides, POST /monthly-passes, POST /transfers, POST /loss-records, POST /workorders"

  - priority: 5
    category: state
    check: "Target resource is in a state legal for this operation (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_safety
    check: "Bike has no open WorkOrder when transitioning OFF_SHELF→ON_SHELF or RECALL→AVAILABLE"
    error_id: ERR_BIKE_HAS_OPEN_WORKORDER
    http_status: 409
    applies_to: "POST /regions/{region_id}/bikes/{bike_id}/shelf (action=ON), POST /bikes/{bike_id}/release-recall"

  - priority: 7
    category: business_safety
    check: "Bike not located inside any FORBIDDEN active Geofence at unlock"
    error_id: ERR_BIKE_IN_FORBIDDEN_ZONE
    http_status: 409
    applies_to: "POST /rides"

  - priority: 8
    category: business_safety
    check: "End-of-ride location not inside any FORBIDDEN active Geofence"
    error_id: ERR_END_IN_FORBIDDEN_ZONE
    http_status: 409
    applies_to: "POST /rides/{ride_id}/end"

  - priority: 9
    category: business_constraint
    check: "TransferOrder.kind matches current Region density postures at dispatch (REPLENISH→to_region.LOW, CLEARANCE→from_region.HIGH)"
    error_id: ERR_TRANSFER_KIND_MISMATCH
    http_status: 409
    applies_to: "POST /transfers/{id}/dispatch"

  - priority: 10
    category: business_constraint
    check: "Geofence polygon has 3 to 32 vertices; vertices are unique; polygon does not self-intersect"
    error_id: ERR_INVALID_POLYGON
    http_status: 422
    applies_to: "POST /regions/{region_id}/geofences, PATCH /geofences/{id}"

  - priority: 11
    category: business_constraint
    check: "Adjustment amount <= original Ride.final_fare_cents"
    error_id: ERR_ADJUSTMENT_EXCEEDS_FARE
    http_status: 422
    applies_to: "POST /rides/{ride_id}/adjust"

  - priority: 12
    category: business_temporal
    check: "Dispute opened within DISPUTE_WINDOW_MINUTES of Ride.end_minute"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rides/{ride_id}/dispute"

  - priority: 13
    category: business_constraint
    check: "Rider has no other ACTIVE Ride"
    error_id: ERR_RIDER_HAS_ACTIVE_RIDE
    http_status: 409
    applies_to: "POST /rides"

  - priority: 14
    category: business_fiscal
    check: "Region.deployed_count + len(incoming bikes) <= deployment_quota for any on-shelf or transfer-complete action"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /regions/{region_id}/bikes/{bike_id}/shelf (action=ON), POST /transfers, POST /transfers/{id}/dispatch"

  - priority: 15
    category: business_fiscal
    check: "Rider has enough payment capacity at unlock: monthly_pass_active OR wallet_balance_cents >= MIN_UNLOCK_BALANCE_CENTS"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /rides"

  - priority: 16
    category: business_fiscal
    check: "Rider wallet would not go negative after settlement (wallet_balance_cents - final_fare_cents >= 0)"
    error_id: ERR_INSUFFICIENT_BALANCE_AT_SETTLEMENT
    http_status: 402
    applies_to: "POST /rides/{ride_id}/end, POST /rides/{ride_id}/fault-report"

  - priority: 17
    category: business_constraint
    check: "Optimistic concurrency: when body includes version, it equals server version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 18
    category: business_constraint
    check: "Input field types, enum domains, and value ranges (e.g., battery_pct in [0,100], deployment_quota > 0, sla_minutes > 0, bike_ids non-empty for TransferOrder)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Regions
  - method: POST
    path: "/regions"
    description: "Create a region with quota and density thresholds"
    roles: [Admin]
    code: 201
    input: [name, deployment_quota, low_density_threshold, high_density_threshold, "in_zone_return_reward_cents?", "out_of_zone_penalty_cents?"]
    output: Region
    side_effects: [Region.clock_minutes=0, density_posture=NORMAL]

  - method: GET
    path: "/regions/{region_id}"
    description: "Read region with computed counts and density_posture"
    roles: [Admin, Operator, FieldStaff, Rider]
    code: 200
    input: []
    output: Region
    side_effects: []

  - method: GET
    path: "/regions/{region_id}/loss-rate"
    description: "Read provisional and attributed loss rates"
    roles: [Admin]
    code: 200
    input: []
    output: "object{provisional_loss_rate, attributed_loss_rate, loss_count, deployed_lifetime, anomaly}"
    side_effects: [Runs calculation region_loss_rate]

  - method: PATCH
    path: "/regions/{region_id}"
    description: "Update region thresholds, quota, reward/penalty"
    roles: [Admin]
    code: 200
    input: ["deployment_quota?", "low_density_threshold?", "high_density_threshold?", "in_zone_return_reward_cents?", "out_of_zone_penalty_cents?", version]
    output: Region
    side_effects: [density_posture recomputed]

  # ---- Geofences
  - method: POST
    path: "/regions/{region_id}/geofences"
    description: "Create a geofence in a region"
    roles: [Admin]
    code: 201
    input: [label, kind, polygon, "active?"]
    output: Geofence
    side_effects: []

  - method: PATCH
    path: "/geofences/{geofence_id}"
    description: "Mutate geofence shape or active flag (dynamic fence adjustment)"
    roles: [Admin]
    code: 200
    input: ["polygon?", "active?", "kind?"]
    output: Geofence
    side_effects: [Geofence.revision incremented]

  - method: GET
    path: "/regions/{region_id}/geofences"
    description: "List geofences in region (filterable by kind, active)"
    roles: [Admin, Operator, FieldStaff, Rider]
    code: 200
    input: ["kind?", "active?", "limit?", "offset?"]
    output: "Geofence[]"
    side_effects: []

  # ---- Bikes
  - method: POST
    path: "/bikes"
    description: "Register a bike (OFF_SHELF by default; no region assigned)"
    roles: [Admin]
    code: 201
    input: [model, lock_id, "battery_pct?"]
    output: Bike
    side_effects: []

  - method: GET
    path: "/bikes/{bike_id}"
    description: "Read a bike"
    roles: [Admin, Operator, FieldStaff, Rider]
    code: 200
    input: []
    output: Bike
    side_effects: []

  - method: PATCH
    path: "/bikes/{bike_id}"
    description: "Update bike fields (battery_pct, lock_state, GPS) via field-staff or system; expects version"
    roles: [Admin, Operator, FieldStaff]
    code: 200
    input: ["battery_pct?", "last_lat?", "last_lng?", "lock_state?", version]
    output: Bike
    side_effects: ["Sets last_motion_minute=clock_minutes when last_lat/lng change"]

  - method: POST
    path: "/regions/{region_id}/bikes/{bike_id}/shelf"
    description: "On-shelf or off-shelf workflow within a region"
    roles: [Operator, Admin]
    code: 200
    input: [action]    # "ON" or "OFF"
    output: Bike
    side_effects: [Region counts and density_posture recomputed]

  - method: POST
    path: "/bikes/{bike_id}/recall"
    description: "Mark bike RECALL (locks out new rides)"
    roles: [Operator, Admin]
    code: 200
    input: []
    output: Bike
    side_effects: [Region counts and density_posture recomputed]

  - method: POST
    path: "/bikes/{bike_id}/release-recall"
    description: "Release recall: RECALL→AVAILABLE if no open work order"
    roles: [Operator, Admin]
    code: 200
    input: []
    output: Bike
    side_effects: []

  - method: POST
    path: "/bikes/{bike_id}/fault-report"
    description: "User-reported fault (outside of an active ride)"
    roles: [Rider, Operator]
    code: 201
    input: [category]
    output: WorkOrder
    side_effects: [Bike.status=FAULT, Region counts recomputed]

  - method: POST
    path: "/bikes/{bike_id}/scrap"
    description: "Scrap a bike (terminal). Requires an unscrapped LossRecord."
    roles: [Admin]
    code: 200
    input: []
    output: Bike
    side_effects: [LossRecord.scrapped=true, Region counts recomputed]

  - method: GET
    path: "/regions/{region_id}/bikes"
    description: "List bikes in region (filterable by status, shelf_state)"
    roles: [Admin, Operator, FieldStaff, Rider]
    code: 200
    input: ["status?", "shelf_state?", "limit?", "offset?"]
    output: "Bike[]"
    side_effects: []

  # ---- Riders
  - method: POST
    path: "/riders"
    description: "Register a rider"
    roles: [Admin]
    code: 201
    input: [name]
    output: Rider
    side_effects: []

  - method: GET
    path: "/riders/{rider_id}"
    description: "Read rider including wallet, pass, free minutes"
    roles: [Rider, Admin]
    code: 200
    input: []
    output: Rider
    side_effects: []

  - method: POST
    path: "/riders/{rider_id}/wallet/credit"
    description: "Top up wallet (admin or platform funding action)"
    roles: [Admin]
    code: 200
    input: [amount_cents]
    output: Rider
    side_effects: [wallet_balance_cents incremented, AuditLog BILLING_ADJUSTMENT]

  - method: POST
    path: "/riders/{rider_id}/monthly-pass"
    description: "Purchase a monthly pass (debits wallet by MONTHLY_PASS_PRICE_CENTS; pass valid 43200 minutes (30 days) from clock_minutes)"
    roles: [Rider]
    code: 200
    input: []
    output: Rider
    side_effects: [Pass expiration set, AuditLog BILLING_ADJUSTMENT]

  - method: POST
    path: "/riders/{rider_id}/free-minutes/grant"
    description: "Admin grants free minutes (promo)"
    roles: [Admin]
    code: 200
    input: [minutes]
    output: Rider
    side_effects: [free_minutes_remaining incremented]

  # ---- Rides
  - method: POST
    path: "/rides"
    description: "QR-unlock: start ride on a specific bike"
    roles: [Rider]
    code: 201
    input: [rider_id, bike_id]
    output: Ride
    side_effects: [Bike.status AVAILABLE→IN_USE, Region.available_count decremented, density_posture recomputed]

  - method: GET
    path: "/rides/{ride_id}"
    description: "Read ride incl. computed fare components when SETTLED"
    roles: [Rider, Admin]
    code: 200
    input: []
    output: Ride
    side_effects: []

  - method: POST
    path: "/rides/{ride_id}/end"
    description: "End-of-ride lock: settles fare, applies penalty/reward"
    roles: [Rider]
    code: 200
    input: [end_lat, end_lng]
    output: Ride
    side_effects: [Runs ride_fare_settlement; wallet debited; bike returned AVAILABLE; payment-system sync emitted]

  - method: POST
    path: "/rides/{ride_id}/fault-report"
    description: "Rider reports fault during ride; auto-ends ride with waived penalty"
    roles: [Rider]
    code: 200
    input: [end_lat, end_lng, category]
    output: Ride
    side_effects: [Runs ride_fare_settlement with penalty waiver; Bike.status IN_USE→FAULT]

  - method: POST
    path: "/rides/{ride_id}/dispute"
    description: "Open billing dispute on a SETTLED ride"
    roles: [Rider]
    code: 200
    input: [reason]
    output: Ride
    side_effects: [Ride.status SETTLED→DISPUTED, AuditLog BILLING_ADJUSTMENT]

  - method: POST
    path: "/rides/{ride_id}/adjust"
    description: "Admin reduces ride fare to new amount; difference refunded"
    roles: [Admin]
    code: 200
    input: [new_final_fare_cents]
    output: Ride
    side_effects: [Wallet credited difference, AuditLog BILLING_ADJUSTMENT, payment-system sync emitted]

  - method: POST
    path: "/rides/{ride_id}/void"
    description: "Admin voids an ACTIVE ride (corrects bogus unlock)"
    roles: [Admin]
    code: 200
    input: []
    output: Ride
    side_effects: [Ride.status ACTIVE→VOIDED, Bike.status IN_USE→AVAILABLE, no money movement]

  # ---- Work Orders
  - method: POST
    path: "/workorders"
    description: "Create a work order for a bike (typically by Operator from dispatch UI; cause can be RECALL, etc.)"
    roles: [Operator, Admin]
    code: 201
    input: [bike_id, cause, category, sla_minutes]
    output: WorkOrder
    side_effects: [Bike.status set to FAULT if not already; Region counts recomputed]

  - method: POST
    path: "/workorders/{workorder_id}/assign"
    description: "Assign work order to operator"
    roles: [Operator, Admin]
    code: 200
    input: [assigned_operator_id]
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/workorders/{workorder_id}/resolve"
    description: "Resolve work order"
    roles: [Operator]
    code: 200
    input: [resolution_note]
    output: WorkOrder
    side_effects: [Bike.status may flip FAULT→AVAILABLE; Region counts recomputed]

  - method: POST
    path: "/workorders/{workorder_id}/cancel"
    description: "Cancel an OPEN work order"
    roles: [Operator, Admin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: [Bike.status may flip FAULT→AVAILABLE if no other open WOs]

  - method: GET
    path: "/workorders"
    description: "List work orders (filterable by status, region_id, sla_breached)"
    roles: [Operator, Admin]
    code: 200
    input: ["status?", "region_id?", "sla_breached?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  # ---- Transfers
  - method: POST
    path: "/transfers"
    description: "Plan a cross-region transfer (kind inferred from density postures at plan time)"
    roles: [Operator, Admin]
    code: 201
    input: [from_region_id, to_region_id, bike_ids]
    output: TransferOrder
    side_effects: []

  - method: POST
    path: "/transfers/{transfer_id}/dispatch"
    description: "Dispatch a planned transfer: removes bikes from source"
    roles: [Operator]
    code: 200
    input: []
    output: TransferOrder
    side_effects: [Source region counts recomputed; transitive cascade hop 1]

  - method: POST
    path: "/transfers/{transfer_id}/complete"
    description: "Complete an in-transit transfer: deposits bikes at destination"
    roles: [Operator]
    code: 200
    input: []
    output: TransferOrder
    side_effects: [Destination region counts recomputed (hop 2); may auto-cancel other PLANNED REPLENISH transfers targeting same region (hop 3)]

  - method: POST
    path: "/transfers/{transfer_id}/cancel"
    description: "Cancel a planned or in-transit transfer (in-transit cancel returns bikes to source)"
    roles: [Operator, Admin]
    code: 200
    input: []
    output: TransferOrder
    side_effects: [If in-transit: source region counts recomputed]

  # ---- Loss & scrap
  - method: POST
    path: "/loss-records"
    description: "Record bicycle loss (theft/damage/abandoned) with responsibility attribution"
    roles: [Admin]
    code: 201
    input: [bike_id, cause, responsibility, "responsible_party_id?", financial_impact_cents]
    output: LossRecord
    side_effects: [Audit log entry; bike eligibility for scrap created]

  - method: GET
    path: "/loss-records"
    description: "List loss records (filter by region_id, cause)"
    roles: [Admin]
    code: 200
    input: ["region_id?", "cause?", "limit?", "offset?"]
    output: "LossRecord[]"
    side_effects: []

  # ---- Audit
  - method: GET
    path: "/audit-logs"
    description: "List audit log entries (filter by event_kind, subject_type, subject_id, actor_role)"
    roles: [Admin]
    code: 200
    input: ["event_kind?", "subject_type?", "subject_id?", "actor_role?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # ---- Test-driving control endpoints
  - method: POST
    path: "/_clock/advance"
    description: "Advance global clock_minutes by a non-negative integer minutes (test driver for time-gated logic)"
    roles: [Admin]
    code: 200
    input: [minutes]
    output: "object{clock_minutes}"
    side_effects: []

  - method: POST
    path: "/_sweep/run"
    description: "Run automatic anomaly sweep: any Bike with status=AVAILABLE where (clock_minutes - last_motion_minute) >= LONG_STATIONARY_THRESHOLD_MIN gets cause=LONG_STATIONARY work order; battery_pct<=LOW_BATTERY_THRESHOLD_PCT triggers LOW_BATTERY work order; lock_state=UNKNOWN with shelf_state=ON_SHELF triggers LOCK_ABNORMAL work order"
    roles: [Admin]
    code: 200
    input: []
    output: "object{opened_count}"
    side_effects: [Mass open WorkOrders, mass Bike.status flips to FAULT, Region counts recomputed]

  - method: POST
    path: "/_events/emit"
    description: "Emit an external system sync event (test driver; mirrors what end-of-ride, pass purchase, and adjustment would emit to payment/IM/mapping)"
    roles: [Admin]
    code: 200
    input: [target_system, subject_type, subject_id, payload]
    output: AuditLog
    side_effects: [AuditLog event_kind=EXTERNAL_SYNC written]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH,                http: 401, condition: "X-User-Role or X-User-ID header missing/malformed" }
  - { id: ERR_FORBIDDEN_ROLE,              http: 403, condition: "Role not permitted for this endpoint, or identity does not match the resource owner (Rider on someone else's ride)" }
  - { id: ERR_NOT_FOUND,                   http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND,         http: 404, condition: "Foreign-key id in body does not resolve" }
  - { id: ERR_INVALID_STATE,               http: 409, condition: "Resource not in a state legal for this operation" }
  - { id: ERR_VERSION_CONFLICT,            http: 409, condition: "version header/body does not match server version (OCC)" }
  - { id: ERR_VALIDATION,                  http: 422, condition: "Schema/type/enum/range violation" }
  - { id: ERR_INVALID_POLYGON,             http: 422, condition: "Geofence polygon malformed (vertices <3 or >32, duplicates, self-intersection)" }
  - { id: ERR_QUOTA_EXCEEDED,              http: 409, condition: "Region.deployed_count would exceed deployment_quota" }
  - { id: ERR_BIKE_NOT_AVAILABLE,          http: 409, condition: "Bike.status != AVAILABLE when AVAILABLE required" }
  - { id: ERR_BIKE_IN_USE,                 http: 409, condition: "Bike has status=IN_USE and operation forbids it" }
  - { id: ERR_BIKE_OFF_SHELF,              http: 409, condition: "Bike.shelf_state != ON_SHELF when ON_SHELF required" }
  - { id: ERR_BIKE_HAS_OPEN_WORKORDER,     http: 409, condition: "Bike has at least one WorkOrder with status in {OPEN, ASSIGNED} when the operation forbids that" }
  - { id: ERR_BIKE_IN_FORBIDDEN_ZONE,      http: 409, condition: "Unlock attempted while bike is located inside an active FORBIDDEN geofence" }
  - { id: ERR_END_IN_FORBIDDEN_ZONE,       http: 409, condition: "End-of-ride location is inside an active FORBIDDEN geofence" }
  - { id: ERR_BATTERY_TOO_LOW,             http: 409, condition: "E_BIKE battery_pct below the on-shelf minimum at on-shelf time" }
  - { id: ERR_RIDER_SUSPENDED,             http: 403, condition: "Rider.status != ACTIVE at unlock" }
  - { id: ERR_RIDER_HAS_ACTIVE_RIDE,       http: 409, condition: "Rider already has another ACTIVE Ride" }
  - { id: ERR_INSUFFICIENT_BALANCE,        http: 402, condition: "At unlock: monthly pass inactive AND wallet < MIN_UNLOCK_BALANCE_CENTS" }
  - { id: ERR_INSUFFICIENT_BALANCE_AT_SETTLEMENT, http: 402, condition: "At end-of-ride: wallet_balance_cents - final_fare_cents < 0" }
  - { id: ERR_RIDE_NOT_ACTIVE,             http: 409, condition: "Operation requires Ride.status == ACTIVE" }
  - { id: ERR_RIDE_NOT_SETTLED,            http: 409, condition: "Operation requires Ride.status == SETTLED" }
  - { id: ERR_RIDE_NOT_DISPUTED,           http: 409, condition: "Operation requires Ride.status == DISPUTED" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_FARE,     http: 422, condition: "new_final_fare_cents > original final_fare_cents on adjust" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED,       http: 409, condition: "Current clock_minutes - Ride.end_minute > DISPUTE_WINDOW_MINUTES" }
  - { id: ERR_WORKORDER_NOT_OPEN,          http: 409, condition: "Operation requires WorkOrder.status == OPEN" }
  - { id: ERR_WORKORDER_NOT_ASSIGNED,      http: 409, condition: "Operation requires WorkOrder.status == ASSIGNED" }
  - { id: ERR_OPERATOR_REQUIRED,           http: 422, condition: "assigned_operator_id missing on POST /workorders/{id}/assign" }
  - { id: ERR_TRANSFER_NOT_PLANNED,        http: 409, condition: "Operation requires TransferOrder.status == PLANNED" }
  - { id: ERR_TRANSFER_NOT_IN_TRANSIT,     http: 409, condition: "Operation requires TransferOrder.status == IN_TRANSIT" }
  - { id: ERR_TRANSFER_KIND_MISMATCH,      http: 409, condition: "At dispatch time, TransferOrder.kind no longer matches Region density posture (REPLENISH needs to_region.LOW; CLEARANCE needs from_region.HIGH)" }
  - { id: ERR_BIKE_NOT_AVAILABLE_FOR_TRANSFER, http: 409, condition: "One or more bike_ids fail the dispatch precondition (not in from_region, not AVAILABLE, not ON_SHELF)" }
  - { id: ERR_NO_LOSS_RECORD,              http: 409, condition: "Scrap attempted without an unscrapped LossRecord for the bike" }
  - { id: ERR_BIKE_NOT_IN_RECALL,          http: 409, condition: "release-recall called on bike whose status != RECALL" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Rider
    description: "End user who unlocks bikes via QR, rides, ends, disputes; identity backed by Rider entity"
    identity: "entity_backed:Rider"
    exclusive_operations:
      - "POST /rides"
      - "POST /rides/{ride_id}/end"
      - "POST /rides/{ride_id}/fault-report"
      - "POST /rides/{ride_id}/dispute"
      - "POST /riders/{rider_id}/monthly-pass"
    shared_operations:
      - "POST /bikes/{bike_id}/fault-report (shared with Operator)"
      - "GET /regions/{region_id}, GET /bikes/{bike_id}, GET /regions/{region_id}/geofences, GET /regions/{region_id}/bikes, GET /rides/{ride_id} (own ride only), GET /riders/{rider_id} (self only)"

  - name: Operator
    description: "Back-office dispatcher: shelves bikes, assigns and resolves work orders, plans and dispatches transfers"
    identity: "opaque"
    exclusive_operations:
      - "POST /regions/{region_id}/bikes/{bike_id}/shelf"
      - "POST /bikes/{bike_id}/recall"
      - "POST /bikes/{bike_id}/release-recall"
      - "POST /workorders, POST /workorders/{id}/assign, POST /workorders/{id}/resolve, POST /workorders/{id}/cancel"
      - "POST /transfers, POST /transfers/{id}/dispatch, POST /transfers/{id}/complete, POST /transfers/{id}/cancel"
    shared_operations:
      - "POST /bikes/{bike_id}/fault-report (shared with Rider)"
      - "GET endpoints across bikes, regions, geofences, workorders"
      - "PATCH /bikes/{bike_id} (shared with FieldStaff, Admin)"

  - name: FieldStaff
    description: "On-the-ground staff updating bike location, battery, lock state; cannot shelf or transfer"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "PATCH /bikes/{bike_id} (shared with Operator, Admin)"
      - "GET endpoints across bikes, regions, geofences"

  - name: Admin
    description: "Platform admin: configures regions/geofences/quotas, handles disputes, voids rides, records losses, scrap, drives test clock and sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /regions, PATCH /regions/{region_id}"
      - "POST /regions/{region_id}/geofences, PATCH /geofences/{geofence_id}"
      - "POST /bikes, POST /bikes/{bike_id}/scrap"
      - "POST /riders, POST /riders/{rider_id}/wallet/credit, POST /riders/{rider_id}/free-minutes/grant"
      - "POST /rides/{ride_id}/adjust, POST /rides/{ride_id}/void"
      - "POST /loss-records, GET /loss-records, GET /regions/{region_id}/loss-rate"
      - "GET /audit-logs"
      - "POST /_clock/advance, POST /_sweep/run, POST /_events/emit"
    shared_operations:
      - "POST /workorders, POST /workorders/{id}/cancel, POST /workorders/{id}/assign (shared with Operator)"
      - "POST /regions/{region_id}/bikes/{bike_id}/shelf, POST /bikes/{bike_id}/recall, POST /bikes/{bike_id}/release-recall (shared with Operator)"
      - "POST /transfers, POST /transfers/{id}/cancel (shared with Operator)"
      - "PATCH /bikes/{bike_id} (shared with Operator, FieldStaff)"
      - "GET endpoints across all resources"
