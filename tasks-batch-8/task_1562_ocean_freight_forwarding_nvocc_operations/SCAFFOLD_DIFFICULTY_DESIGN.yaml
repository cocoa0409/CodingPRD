            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/surety-bonds", payload: { bond_number: "BOND-1", surety_company: "SURETYCO", coverage_amount_cents: 7500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { bd: $.data.id } }
            - { call: "POST /freight/surety-bonds/${bd}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/bill-of-lading", payload: { booking_id: "${b}", bl_type: "HOUSE", release_mode: "SEAWAY" }, as: DocumentationOfficer, as_user_id: "doc_1", captures: { bl: $.data.id } }
            - { call: "POST /freight/bill-of-lading/${bl}/issue", payload: {}, as: DocumentationOfficer, as_user_id: "doc_1" }
            - { call: "POST /freight/invoices", payload: { booking_id: "${b}", invoice_type: "FREIGHT" }, as: FinanceController, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /freight/voyages/${v}/blank", payload: {}, as: OperationsManager }
            - { call: "GET /freight/bookings/${b}", payload: {}, as: Any, captures: { b_st: $.data.status, b_rr: $.data.rolled_reason } }
            - { call: "GET /freight/bill-of-lading/${bl}", payload: {}, as: Any, captures: { bl_st: $.data.status } }
            - { call: "GET /freight/invoices/${inv}", payload: {}, as: Any, captures: { inv_st: $.data.status } }
            - { call: "GET /freight/shippers/${s}", payload: {}, as: Any, captures: { fwd: $.data.credit_exposure_forward_cents, post: $.data.credit_exposure_posted_cents } }
          assert:
            - "Voyage.${v}.status == BLANKED"
            - "link 1: Booking.${b}.status == ROLLED and rolled_reason == BLANK_SAILING and rollover_count == 1"
            - "link 2: BillOfLading.${bl}.status == VOIDED (ISSUED B/L voided by the roll cascade, not by a direct call)"
            - "link 3: Invoice.${inv}.status == VOID (DRAFT freight invoice voided by the same cascade)"
            - "link 4: Shipper.${s}.credit_exposure_forward_cents == 0 and credit_exposure_posted_cents == 0"

      - name: booking_cancel_cascade_depth3_consolidation_reopens
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.ContainerAssignment.STUFFED_to_CANCELLED
          - state_machines.Consolidation.CLOSED_to_OPEN
          - calculations.consolidation_utilization
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (POST /bookings/{id}/cancel):
          booking cancel -> member ContainerAssignment STUFFED -> CANCELLED
          (link 1) -> consolidation used_weight/used_volume recompute (link 2,
          caused by the assignment cancellation) -> CLOSED consolidation with
          zero remaining members auto-reverts to OPEN (link 3, caused by the
          recompute). Plus a CANCELLATION invoice (75000) minted in DRAFT.
        test_recipe:
          setup:
            - "CONFIRMED LCL booking stuffed into consolidation CON (max 10000kg/100cbm); CON has exactly this one member and is CLOSED"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME CXL", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/consolidations", payload: { voyage_id: "${v}", cfs_location: "CFS-LAX-01", container_type: "40HC", max_weight_kg: 10000, max_volume_cbm: 100.0, stuffing_window_start: "2026-08-10T00:00:00Z", stuffing_window_end: "2026-08-15T00:00:00Z" }, as: BookingCoordinator, captures: { con: $.data.id, con_v: $.data.version } }
            - { call: "POST /freight/consolidations/${con}/stuff", payload: { booking_id: "${b}", expected_consolidation_version: "${con_v}" }, as: BookingCoordinator, captures: { asg: $.data.id } }
            - { call: "POST /freight/consolidations/${con}/close", payload: {}, as: BookingCoordinator }
          trigger:
            - { call: "POST /freight/bookings/${b}/cancel", payload: { reason: "shipper cancelled order" }, as: BookingCoordinator }
            - { call: "GET /freight/container-assignments/${asg}", payload: {}, as: Any, captures: { asg_st: $.data.status } }
            - { call: "GET /freight/consolidations/${con}", payload: {}, as: Any, captures: { con_st: $.data.status, con_w: $.data.used_weight_kg, con_vol: $.data.used_volume_cbm } }
            - { call: "GET /freight/invoices", payload: { booking_id: "${b}", invoice_type: "CANCELLATION" }, as: Any, captures: { cx_total: "$.data[0].total_cents", cx_st: "$.data[0].status" } }
          assert:
            - "Booking.${b}.status == CANCELLED"
            - "link 1: ContainerAssignment.${asg}.status == CANCELLED"
            - "link 2: Consolidation.${con}.used_weight_kg == 0 and used_volume_cbm == 0"
            - "link 3: Consolidation.${con}.status == OPEN (auto-reopened because the cancellation emptied it)"
            - "CANCELLATION invoice exists with total_cents == 75000 and status == DRAFT"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancel_loaded_with_unpaid_invoice_state_beats_fiscal
        grounds:
