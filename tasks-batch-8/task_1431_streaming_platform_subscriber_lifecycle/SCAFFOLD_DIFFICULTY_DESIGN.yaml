              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/_sweeps/run"
              payload: { advance_to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
