  - rule_id: cross_entity_state_dependency
    instances:
      - name: qualification_blocked_by_plan_procedures_amendment_pending
        grounds:
          - validations[priority=52]
          - state_machines.Plan.procedures_status
          - errors.ERR_PLAN_PROCEDURES_NOT_PUBLISHED
          - endpoints[POST /plans/{id}/procedure-status]
          - endpoints[POST /draft-orders/{id}/qualify]
        distinguishing_aspect: |
          The qualifiability of a draft order depends on the state of an entity three levels up the
          hierarchy — the Plan behind the Participant behind the PlanAccount — and that state can move
          AFTER the draft was received. A faultless draft with an empty deficiency set, a live hold and a
          matching valuation snapshot is refused with ERR_PLAN_PROCEDURES_NOT_PUBLISHED the moment the
          plan's procedures are pulled back to AMENDMENT_PENDING, and becomes qualifiable again, with no
          resubmission and no new hold, once they are republished. The dependency is also asymmetric:
          receipt of a NEW draft order is deliberately NOT gated on procedures_status, because a plan
          administrator must be able to take custody of funds while procedures are being amended, so the
          same AMENDMENT_PENDING plan accepts a receipt on a sibling case in the very same window.
        test_recipe:
          setup:
            - "A PUBLISHED PERIOD_END plan with max_assignable_pct_bps 5000, max_assignable_amount_cents 2000000."
            - "Participant A and Participant B, each with a single assignable PRE_TAX_DEFERRAL source of 1000000 and one snapshot on 2026-06-30 at 1000000."
            - "A faultless SEPARATE_INTEREST 4000 bps draft received on case A at clock 2026-09-01, so hold_amount_cents 400000 and deficiency_codes []."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Amendment Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
              captures: { plan_v_published: $.data.version }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Ingrid Halvorsen", ssn_last4: "2201", date_of_birth: "1976-02-02", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { partA: $.data.id }
            - call: "POST /participants/${partA}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acctA: $.data.id }
            - call: "POST /plan-accounts/${acctA}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acctA}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Odd Halvorsen", ssn_last4: "2202", date_of_birth: "1976-02-02", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { partB: $.data.id }
            - call: "POST /participants/${partB}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acctB: $.data.id }
            - call: "POST /plan-accounts/${acctB}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acctB}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partA}", alternate_payee_name: "Marit Halvorsen", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1978-06-06", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { caseA: $.data.id, caseA_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseA}", expected_case_version: "${caseA_v}", document_reference: "DRO-2663-P-A", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draftA: $.data.id, codesA: $.data.deficiency_codes }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partB}", alternate_payee_name: "Sigrid Halvorsen", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1978-06-06", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { caseB: $.data.id, caseB_v: $.data.version }
          trigger:
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "AMENDMENT_PENDING" }
              as: PlanAdministrator
              captures: { plan_status_pending: $.data.procedures_status }
            - call: "POST /draft-orders/${draftA}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_pending: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseB}", expected_case_version: "${caseB_v}", document_reference: "DRO-2663-P-B", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draftB: $.data.id, draftB_status: $.data.status }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
              captures: { plan_status_again: $.data.procedures_status }
            - call: "POST /draft-orders/${draftA}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { qualified_status: $.data.status }
          assert:
            - "${codesA} == [] — the draft is faultless, so the refusal that follows cannot be attributed to the order's own content."
            - "${plan_status_pending} == \"AMENDMENT_PENDING\"; ${err_pending} == \"ERR_PLAN_PROCEDURES_NOT_PUBLISHED\" with HTTP 409."
            - "The refusal is inert: GET /draft-orders/${draftA} still reports status \"UNDER_REVIEW\", GET /qdro-cases/${caseA} still reports review_status \"UNDER_REVIEW\" and segregation_status \"HELD\" with version 2, GET /qdro-cases/${caseA}/alternate-payee-accounts is empty, and GET /qdro-cases/${caseA}/communications returns exactly 1 row (PARTICIPANT, RECEIPT_ACKNOWLEDGMENT, LIMITED, SYSTEM)."
            - "${draftB_status} == \"UNDER_REVIEW\" — receipt is NOT gated on procedures_status; GET /segregation-holds with qdro_case_id=${caseB} reports a HELD hold of 400000 and GET /plan-accounts/${acctB} reports available_balance_cents 600000, so custody can still be taken while procedures are being amended."
            - "${plan_status_again} == \"PUBLISHED\" and ${qualified_status} == \"QUALIFIED\" — the identical request that failed now succeeds with no resubmission, no new revision (revision_number still 1) and no new hold."
            - "GET /qdro-cases/${caseA}/alternate-payee-accounts now returns 1 row with balance_cents 400000, and GET /segregation-holds with qdro_case_id=${caseA} reports status \"CONVERTED\" with placed_at still 2026-09-01T00:00:00Z."
            - "GET /plans/${plan_id} reports version 4 (create at 1, PUBLISHED, AMENDMENT_PENDING, PUBLISHED) while every plan-status write left both QdroCase versions untouched."

      - name: hold_release_blocked_until_case_review_status_denied
        grounds:
          - validations[priority=62]
          - validations[priority=40]
          - errors.ERR_CASE_NOT_DENIED
          - errors.ERR_HOLD_NOT_HELD
          - endpoints[POST /segregation-holds/{id}/release]
          - state_machines.SegregationHold
          - state_machines.QdroCase.segregation_status
        distinguishing_aspect: |
          The release of a hold reads the state of a DIFFERENT entity that is not even its own parent in
          the URL: SegregationHold.status must be HELD (its own state, priority 40) AND the hold's
          QdroCase.review_status must already be DENIED (priority 62). Because denial deliberately leaves
          the hold HELD, the participant's money stays locked until an explicit second act, and the three
          attempts against the same hold id return three different outcomes: ERR_CASE_NOT_DENIED while the
          case is under review, success once the case is denied, and ERR_HOLD_NOT_HELD on the replay —
          the error code migrating from the cross-entity rule at 62 to the own-state rule at 40 as the
          hold's own status changes. An implementation that checks only the hold's status releases funds
          on a case still under review; one that checks only the case's status double-releases.
        test_recipe:
          setup:
            - "A PUBLISHED plan with requires_model_language true, so a draft with uses_model_language false carries deficiency code MISSING_MODEL_LANGUAGE."
            - "A participant with a single assignable PRE_TAX_DEFERRAL source of 1000000 and one snapshot on 2026-06-30 at 1000000."
            - "The draft is received at clock 2026-09-01, placing a HELD hold of 400000 and depressing available_balance_cents to 600000."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Release Gate Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Teodoro Vasquez", ssn_last4: "4410", date_of_birth: "1974-04-04", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Rosalia Vasquez", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1977-09-09", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-R1", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id", hold_status_initial: "$.data[0].status" }
          trigger:
            - call: "POST /segregation-holds/${hold_id}/release"
              payload: {}
              as: PlanAdministrator
              captures: { err_not_denied: $.data.error_id }
            - call: "POST /draft-orders/${draft_id}/deny"
              payload: { denial_reason: "ORDER_NOT_QUALIFIABLE" }
              as: PlanAdministrator
              captures: { denied_status: $.data.status }
            - call: "GET /segregation-holds/${hold_id}"
              payload: {}
              as: PlanAdministrator
              captures: { hold_after_denial: $.data.status }
            - call: "POST /segregation-holds/${hold_id}/release"
              payload: {}
              as: PlanAdministrator
              captures: { released_status: $.data.status }
            - call: "POST /segregation-holds/${hold_id}/release"
              payload: {}
              as: PlanAdministrator
              captures: { err_replay: $.data.error_id }
          assert:
            - "${hold_status_initial} == \"HELD\"; ${err_not_denied} == \"ERR_CASE_NOT_DENIED\" with HTTP 409 — the hold's own state admits the release (priority 40 passes) and the refusal comes from the case's review_status at priority 62."
            - "After the first refusal GET /plan-accounts/${acct_id} still reports held_amount_cents 400000 and available_balance_cents 600000, and GET /qdro-cases/${case_id} still reports segregation_status \"HELD\"."
            - "${denied_status} == \"DENIED\" with denial_reason \"ORDER_NOT_QUALIFIABLE\", and ${hold_after_denial} == \"HELD\" — denial does NOT release the money; GET /plan-accounts/${acct_id} still reports available_balance_cents 600000."
            - "${released_status} == \"RELEASED\"; GET /qdro-cases/${case_id} reports segregation_status \"RELEASED_TO_PARTICIPANT\" with review_status still \"DENIED\", and GET /plan-accounts/${acct_id} reports held_amount_cents 0 and available_balance_cents 1000000."
            - "${err_replay} == \"ERR_HOLD_NOT_HELD\" with HTTP 409 — on the replay the own-state rule at priority 40 fires FIRST and the cross-entity rule at 62 is never reached, so the error code changes even though the case is still DENIED."
            - "The replay is inert: GET /plan-accounts/${acct_id} still reports available_balance_cents 1000000 (never 1400000) and GET /qdro-cases/${case_id}/communications returns exactly 5 rows in sent_at order — the receipt acknowledgment, (PARTICIPANT, DETERMINATION_DENIED, FULL, SYSTEM), (ALTERNATE_PAYEE, DETERMINATION_DENIED, LIMITED, SYSTEM), (PARTICIPANT, RELEASE_NOTICE, FULL, SYSTEM), (ALTERNATE_PAYEE, RELEASE_NOTICE, LIMITED, SYSTEM) — no sixth row from the refused replay."
            - "GET /qdro-cases/${case_id} reports version 4 (create, receipt, deny, release) — neither refusal incremented it."

      - name: attorney_communication_gated_by_authorization_status_and_scope
        grounds:
          - validations[priority=50]
          - validations[priority=62]
          - validations[priority=36]
          - errors.ERR_ATTORNEY_NOT_AUTHORIZED
          - errors.ERR_DISCLOSURE_SCOPE_EXCEEDED
          - entities.AttorneyAuthorization.fields.disclosure_scope
          - entities.Communication.fields.attorney_email
          - endpoints[POST /qdro-cases/{id}/communications]
        distinguishing_aspect: |
          Whether a communication may be sent depends on TWO independent attributes of a third entity
          that is never named in the request: the AttorneyAuthorization's disclosure_scope (checked at
          priority 50, against an authorization resolved REGARDLESS of status) and its status (checked at
          priority 62). The request body names only a recipient_type, so the server must resolve
          PARTICIPANT_ATTORNEY -> represents PARTICIPANT and AP_ATTORNEY -> represents ALTERNATE_PAYEE.
          Four calls against one case therefore produce four different outcomes from the same endpoint:
          FULL to a live FULL-scope attorney succeeds and copies attorney_email onto the row; FULL to a
          live LIMITED-scope attorney is ERR_DISCLOSURE_SCOPE_EXCEEDED; LIMITED to that same attorney
          succeeds; and FULL to the FULL-scope attorney AFTER revocation is ERR_ATTORNEY_NOT_AUTHORIZED —
          the scope check at 50 still passes, so only the status check at 62 can refuse it. The same
          revocation independently disables the attorney as an ACTOR at priority 36.
        test_recipe:
          setup:
            - "A PUBLISHED plan and a participant with a single assignable PRE_TAX_DEFERRAL source of 1000000 and one snapshot on 2026-06-30 at 1000000."
            - "A case with a faultless SEPARATE_INTEREST 4000 bps draft received at clock 2026-09-01, so an operative draft exists and review_status is UNDER_REVIEW."
            - "Two authorizations on that case: one representing PARTICIPANT with disclosure_scope FULL, one representing ALTERNATE_PAYEE with disclosure_scope LIMITED, both effective_from 2026-08-01 and expires_at 2027-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Disclosure Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Maren Aaltonen", ssn_last4: "5150", date_of_birth: "1975-05-05", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Eino Aaltonen", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1979-10-10", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-D1", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "POST /qdro-cases/${case_id}/attorney-authorizations"
              payload: { represents: "PARTICIPANT", attorney_name: "Halla Ingimundur", attorney_bar_number: "BAR-77120", attorney_email: "halla@ingimundur-law.example", disclosure_scope: "FULL", effective_from: "2026-08-01", expires_at: "2027-08-01T00:00:00Z" }
              as: QdroAnalyst
              captures: { auth_full: $.data.id, auth_full_email: $.data.attorney_email }
            - call: "POST /qdro-cases/${case_id}/attorney-authorizations"
              payload: { represents: "ALTERNATE_PAYEE", attorney_name: "Pekka Rautio", attorney_bar_number: "BAR-77121", attorney_email: "pekka@rautio-law.example", disclosure_scope: "LIMITED", effective_from: "2026-08-01", expires_at: "2027-08-01T00:00:00Z" }
              as: QdroAnalyst
              captures: { auth_limited: $.data.id, auth_limited_email: $.data.attorney_email }
          trigger:
            - call: "POST /qdro-cases/${case_id}/communications"
              payload: { recipient_type: "PARTICIPANT_ATTORNEY", template_code: "DEFICIENCY_NOTICE", disclosure_level: "FULL" }
              as: QdroAnalyst
              captures: { full_ok_email: $.data.attorney_email, full_ok_origin: $.data.origin }
            - call: "POST /qdro-cases/${case_id}/communications"
              payload: { recipient_type: "AP_ATTORNEY", template_code: "DEFICIENCY_NOTICE", disclosure_level: "FULL" }
              as: QdroAnalyst
              captures: { err_scope: $.data.error_id }
            - call: "POST /qdro-cases/${case_id}/communications"
              payload: { recipient_type: "AP_ATTORNEY", template_code: "DEFICIENCY_NOTICE", disclosure_level: "LIMITED" }
              as: QdroAnalyst
              captures: { limited_ok_email: $.data.attorney_email }
            - call: "POST /attorney-authorizations/${auth_full}/revoke"
              payload: {}
              as: PlanAdministrator
              captures: { revoked_status: $.data.status, revoked_at: $.data.revoked_at }
            - call: "POST /qdro-cases/${case_id}/communications"
              payload: { recipient_type: "PARTICIPANT_ATTORNEY", template_code: "DEFICIENCY_NOTICE", disclosure_level: "FULL" }
              as: QdroAnalyst
              captures: { err_revoked: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-D2", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: Attorney
              as_user_id: "${auth_full}"
              captures: { err_actor: $.data.error_id }
          assert:
            - "${full_ok_email} == ${auth_full_email} and ${full_ok_origin} == \"MANUAL\" — the server resolved PARTICIPANT_ATTORNEY to the represents=PARTICIPANT authorization and copied its address as a value, not a foreign key."
            - "${err_scope} == \"ERR_DISCLOSURE_SCOPE_EXCEEDED\" with HTTP 403 — the AP-side authorization is ACTIVE but its disclosure_scope is LIMITED, so FULL exceeds it."
            - "${limited_ok_email} == ${auth_limited_email} — the identical recipient at LIMITED is permitted, proving the refusal was about scope and not about the addressee."
            - "${revoked_status} == \"REVOKED\" with ${revoked_at} == \"2026-09-01T00:00:00Z\"."
            - "${err_revoked} == \"ERR_ATTORNEY_NOT_AUTHORIZED\" with HTTP 403 — the scope check at priority 50 still passes on the revoked FULL-scope authorization (it is resolved regardless of status), so only the readiness check at priority 62 can refuse this; an implementation that skipped revoked rows when resolving would instead report ERR_DISCLOSURE_SCOPE_EXCEEDED or a 404."
            - "${err_actor} == \"ERR_ATTORNEY_NOT_AUTHORIZED\" with HTTP 403 raised at priority 36, before any body validation — the same revocation independently disables the attorney as an actor, and GET /draft-orders/${draft_id} still reports revision_number 1 with status \"UNDER_REVIEW\" while GET /segregation-holds with qdro_case_id=${case_id} still reports exactly one HELD hold of 400000."
            - "GET /qdro-cases/${case_id}/communications returns exactly 3 rows: the SYSTEM receipt acknowledgment plus the two MANUAL rows; GET with recipient_type=AP_ATTORNEY returns exactly 1 row with disclosure_level \"LIMITED\"."
            - "GET /qdro-cases/${case_id}/attorney-authorizations with status=ACTIVE returns exactly 1 row (${auth_limited})."

  - rule_id: resource_temporal_overlap
    instances:
      - name: marital_period_half_open_adjacency_allowed_overlap_refused
        grounds:
          - validations[priority=60]
          - errors.ERR_MARITAL_PERIOD_OVERLAP
          - entities.QdroCase.fields.marital_period_start
          - entities.QdroCase.fields.marital_period_end
          - endpoints[POST /qdro-cases]
        distinguishing_aspect: |
          Marital periods are HALF-OPEN [start, end) intervals scoped to one participant, and three
          separate subtleties decide each admission. First, adjacency is not overlap: a case ending
          2020-01-01 and a case starting 2020-01-01 coexist, so a closed-interval implementation wrongly
          refuses the second. Second, a null marital_period_end is unbounded-forward and therefore
          overlaps every later interval, so an implementation that treats null as "no constraint" wrongly
          admits a 2026 period behind it. Third, the exclusivity set excludes DENIED cases only, so once
          a case is denied its interval is freed and an identical period may be re-filed — while a
          QUALIFIED case's interval stays reserved forever. The scope is also per-participant: the very
          interval refused on one participant is admissible on another.
        test_recipe:
          setup:
            - "A PUBLISHED plan with requires_model_language true."
            - "Participant A (participation_start_date 1999-01-01) with a plan account holding a single assignable PRE_TAX_DEFERRAL source of 1000000, so a draft can be received and denied."
            - "Participant B with a plan account, used only to prove the exclusivity is per-participant."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Interval Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Lucian Ferraro", ssn_last4: "6060", date_of_birth: "1970-01-01", participation_start_date: "1999-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { partA: $.data.id }
            - call: "POST /participants/${partA}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acctA: $.data.id }
            - call: "POST /plan-accounts/${acctA}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Noor Ferraro", ssn_last4: "6061", date_of_birth: "1970-01-01", participation_start_date: "1999-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { partB: $.data.id }
            - call: "POST /participants/${partB}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acctB: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partA}", alternate_payee_name: "First Spouse", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2020-01-01", alternate_payee_dob: "1972-02-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case1: $.data.id, case1_v: $.data.version }
          trigger:
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partA}", alternate_payee_name: "Second Spouse", valuation_date: "2026-06-30", marital_period_start: "2020-01-01", marital_period_end: "2024-01-01", alternate_payee_dob: "1974-04-04", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case2: $.data.id, case2_status: $.data.review_status }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partA}", alternate_payee_name: "Straddling Spouse", valuation_date: "2026-06-30", marital_period_start: "2019-06-01", marital_period_end: "2021-06-01", alternate_payee_dob: "1974-04-04", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { err_straddle: $.data.error_id }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partA}", alternate_payee_name: "Open Ended Spouse", valuation_date: "2026-06-30", marital_period_start: "2024-01-01", alternate_payee_dob: "1976-06-06", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case3: $.data.id, case3_end: $.data.marital_period_end }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partA}", alternate_payee_name: "Late Spouse", valuation_date: "2026-06-30", marital_period_start: "2026-01-01", marital_period_end: "2026-06-01", alternate_payee_dob: "1976-06-06", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { err_unbounded: $.data.error_id }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partB}", alternate_payee_name: "Other Participant Spouse", valuation_date: "2026-06-30", marital_period_start: "2019-06-01", marital_period_end: "2021-06-01", alternate_payee_dob: "1974-04-04", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { caseB: $.data.id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case1}", expected_case_version: "${case1_v}", document_reference: "DRO-2663-I1", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft1: $.data.id }
            - call: "POST /draft-orders/${draft1}/deny"
              payload: { denial_reason: "ORDER_NOT_QUALIFIABLE" }
              as: PlanAdministrator
              captures: { denied1: $.data.status }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partA}", alternate_payee_name: "Refiled First Spouse", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2020-01-01", alternate_payee_dob: "1972-02-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case1_refiled: $.data.id, case1_refiled_start: $.data.marital_period_start }
          assert:
            - "${case2_status} == \"INTAKE\" — [2020-01-01, 2024-01-01) is admitted alongside [2012-03-01, 2020-01-01) because the intervals are half-open and merely adjacent."
            - "${err_straddle} == \"ERR_MARITAL_PERIOD_OVERLAP\" with HTTP 409 — [2019-06-01, 2021-06-01) intersects both existing periods."
            - "${case3_end} == null — the open-ended period is stored as null, not defaulted to the valuation date or to today."
            - "${err_unbounded} == \"ERR_MARITAL_PERIOD_OVERLAP\" — [2026-01-01, 2026-06-01) lies entirely inside the unbounded-forward period that starts 2024-01-01, so a null end must be treated as +infinity rather than as an absent constraint."
            - "${caseB} is created successfully — the identical [2019-06-01, 2021-06-01) interval refused on participant A is admissible on participant B, so the exclusivity set is scoped by participant_id and not global."
            - "${denied1} == \"DENIED\" and GET /qdro-cases/${case1} reports review_status \"DENIED\"."
            - "${case1_refiled_start} == \"2012-03-01\" — the denied case's interval is released, so the identical period is re-filable; GET /participants/${partA}/qdro-cases returns 4 rows (case1 DENIED, case2, case3, the refiled case) and the refiled case reports review_status \"INTAKE\" with segregation_status \"NONE\"."
            - "The denial did not release the hold: GET /segregation-holds with qdro_case_id=${case1} still reports status \"HELD\" with hold_amount_cents 400000, and GET /plan-accounts/${acctA} reports available_balance_cents 600000 — so the interval is free while the money is still locked, which are deliberately independent facts."

      - name: aggregate_segregation_hold_capacity_refused_though_each_is_legal
        grounds:
          - calculations.hold_aggregate_exposure
          - calculations.gross_assigned_amount
          - validations[priority=70]
          - errors.ERR_HOLD_CAPACITY_EXCEEDED
          - endpoints[POST /draft-orders]
          - endpoints[POST /segregation-holds/{id}/release]
        distinguishing_aspect: |
          Several QDRO cases can be in flight against ONE plan account at the same time, and each
          individual assignment is legal on its own terms — every one of them is well under the plan's
          5000 bps ceiling — yet their simultaneous custody may exceed the account. The candidate hold is
          always computed from assignable_base (which never shrinks while funds are merely HELD), so the
          only thing that grows is the sum of OTHER HELD holds; an implementation that instead computes
          each percentage against available_balance_cents silently shrinks every later assignment and
          never refuses anything. The aggregate predicate is strict, so a third hold that brings the
          total to exactly vested_balance_cents is admitted while one cent more is refused, and releasing
          an earlier hold restores capacity because RELEASED holds leave the sum.
        test_recipe:
          setup:
            - "A PUBLISHED plan with max_assignable_pct_bps 5000, max_assignable_amount_cents 2000000, requires_model_language true."
            - "One participant with ONE plan account holding a single assignable PRE_TAX_DEFERRAL source of 1000000, so vested_balance_cents == assignable_base == 1000000."
            - "Four cases on that participant with adjacent, non-overlapping marital periods: [2000-01-01, 2006-01-01), [2006-01-01, 2012-01-01), [2012-01-01, 2018-01-01), [2018-01-01, 2024-01-01)."
