  - name: the_household_list_filters_on_the_status_column
    claim_type: standard_crud
    grounds: endpoints.GET /clients input (status?); state_machines.Client PROSPECT -> ONBOARDED
    distinguishing_aspect: Two households exist in different states, so a filtered list must return one
      row and the unfiltered list two, which no hard-coded response can satisfy at once.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Beckford Row
          primary_contact_email: ops@beckford.example
          region_code: CA
        captures:
          client2_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      trigger:
      - call: GET /clients?status=ONBOARDED
        as: AgencyPrincipal
      asserts:
      - the trigger returns 200 with total_count == 1 and the single row id == ${client_id}
      - GET /clients?status=PROSPECT as AgencyPrincipal returns total_count == 1 with the row id == ${client2_id}
      - GET /clients as AgencyPrincipal returns total_count == 2
  - name: a_zero_limit_on_the_household_list_is_rejected
    claim_type: standard_crud
    grounds: endpoints.GET /clients errors [ERR_INVALID_RANGE]; response_envelope.pagination_defaults
      (min 1)
    distinguishing_aspect: Zero is one below the declared minimum page size, so the list must refuse rather
      than quietly returning an empty page or falling back to the default of 10.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      trigger:
      - call: GET /clients?limit=0
        as: AgencyPrincipal
      asserts:
      - the trigger returns 400 with error_id == ERR_INVALID_RANGE
      - GET /clients?limit=1 as AgencyPrincipal returns 200 with exactly 1 row
  - name: an_unrecognised_status_filter_on_the_household_list_is_rejected
