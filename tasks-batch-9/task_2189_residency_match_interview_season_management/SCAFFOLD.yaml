scenario: |
  Generate task harder than expert level!

  2189. Residency Match & Interview Season Management (NRMP participating program):
  application review & screening filters, interview slot invitation & scheduling waves,
  interviewer assignment & scoring rubric, rank list committee deliberation & list
  certification, match result & SOAP participation, contract issuance & onboarding
  (license/DEA/visa), pre-match communication compliance, diversity & pipeline reporting

domain_name: residency-match-season
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # graph: InterviewAssignment is a FacultyMember x InterviewSlot junction, ScoreCard hangs
  # off that junction, RankListEntry is self-referential through tie_group_anchor_entry_id,
  # and CommunicationLog cross-cuts Application x FacultyMember. Not a strict tree.

  state_machine_shape: branching
  # branching is the primary shape (RankList forks COMMITTEE_REVIEW -> {RETURNED, APPROVED}
  # with divergent side-effect sets per branch). Two further non-linear shapes are present:
  # Application carries parallel independent dimensions (screening_status x interview_status)
  # and InterviewInvitation is cyclic (WAITLISTED -> ISSUED -> WAITLISTED promotion loop).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The FacultyMember who authored a ScoreCard for an Application may not certify the
  # RankList that ranks that Application; the ProgramDirector who certifies may not also
  # cast the committee ballot that approved the list.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the residency program
        constraints: non-empty, max 200 chars
      - name: nrmp_program_code
        type: string
        source: input
        description: NRMP-assigned participating program code
        constraints: unique across all Program rows, non-empty
      - name: specialty_code
        type: string
        source: input
        description: ACGME specialty abbreviation (e.g. IM, EM, PEDS)
        constraints: non-empty
      - name: quota_positions
        type: integer
        source: input
        description: Number of PGY-1 positions the program is certified to fill
        constraints: ">= 1"
      - name: season_phase
        type: enum
        source: computed
        description: >
          Season posture gating every child operation. Advanced only by the phase
          transitions declared in the Program state machine.
        default: PRE_SEASON
        constraints: "one of PRE_SEASON, REVIEW_OPEN, INTERVIEWS_OPEN, RANKING, LIST_CERTIFIED, MATCH_COMPLETE, SOAP_ACTIVE, SEASON_CLOSED"
      - name: visa_sponsorship_allowed
        type: boolean
        source: input
        description: Whether the institution sponsors J-1/H-1B trainees this season
        default: false
      - name: soap_participating
        type: boolean
        source: input
        description: Whether the program participates in SOAP for unfilled positions
        default: false
      - name: min_step2_score
        type: integer
        source: input
        description: >
          Screening filter floor for USMLE Step 2 CK. An Application passes the score
          filter when applicant_step2_score >= min_step2_score (inclusive).
        default: 220
        constraints: "1..300"
      - name: img_accepted
        type: boolean
        source: input
        description: Screening filter - whether IMG applicants may advance past screening
        default: false
      - name: matched_count
        type: integer
        source: computed
        description: Count of MatchResult rows for this Program whose outcome == MATCHED
        default: 0
      - name: unfilled_positions
        type: integer
        source: computed
        description: >
          quota_positions - matched_count. Conserved quantity - every forward action that
          fills a position and every compensating action that vacates one must leave
          quota_positions == matched_count + unfilled_positions true.
        default: 0
      - name: invited_count
        type: integer
        source: computed
        description: Count of Applications under this Program whose interview_status != NOT_INVITED
        default: 0
      - name: soap_offer_budget
        type: integer
        source: computed
        description: >
          The live ceiling on outstanding SOAP offers, recomputed on every Program read per
          calculations.soap_offer_budget so its pinned evaluation order is directly observable.
        default: 0
      - name: rank_list_certified_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the program's RankList reached CERTIFIED; null before that
        default: null

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: eras_id
        type: string
        source: input
        description: ERAS applicant identifier
        constraints: unique across all Applicant rows, non-empty
      - name: full_name
        type: string
        source: input
        description: Applicant legal name
        constraints: non-empty
      - name: medical_school_type
        type: enum
        source: input
        description: Applicant's degree pathway, used by the screening filter and the pipeline report
        constraints: "one of US_MD, US_DO, IMG"
      - name: visa_status
        type: enum
        source: input
        description: Work-authorization posture, checked against Program.visa_sponsorship_allowed
        constraints: "one of US_CITIZEN, PERMANENT_RESIDENT, NEEDS_J1, NEEDS_H1B"
      - name: step2_score
        type: integer
        source: input
        description: USMLE Step 2 CK three-digit score
        constraints: "1..300"
      - name: pipeline_program_alum
        type: boolean
        source: input
        description: Whether the applicant came through a recognized pipeline/outreach program
        default: false
      - name: self_identified_group
        type: string
        source: input
        description: >
          Optional self-identified demographic group string used only by the aggregate
          pipeline report. Stored as null when the applicant declines to report.
        default: null

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program applied to
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the applying candidate
      - name: screening_status
        type: enum
        source: computed
        description: >
          First of two independent state dimensions on this row. Tracks paper review only.
        default: RECEIVED
        constraints: "one of RECEIVED, UNDER_REVIEW, ADVANCED, REJECTED, WITHDRAWN"
      - name: interview_status
        type: enum
        source: computed
        description: >
          Second, independent state dimension on this row. Tracks interview progress and
          evolves without constraining screening_status once screening_status == ADVANCED.
        default: NOT_INVITED
        constraints: "one of NOT_INVITED, INVITED, SCHEDULED, COMPLETED, NO_SHOW, CANCELLED"
      - name: review_count
        type: integer
        source: computed
        description: Count of ApplicationReview rows for this Application whose status == SUBMITTED
        default: 0
      - name: provisional_screen_score
        type: number
        source: computed
        description: >
          Variant A of the screening composite (see calculations.screen_composite_score).
          Recomputed on every ApplicationReview submission. 2 decimal places.
        default: 0.0
      - name: final_screen_score
        type: number
        source: computed
        description: >
          Variant B of the screening composite, written only by the screening decision
          transition. Used as the wave-allocation ranking key. 2 decimal places.
        default: null
      - name: committee_score
        type: number
        source: computed
        description: >
          Post-interview rubric roll-up (see calculations.committee_rubric_score).
          2 decimal places. Null until at least one ScoreCard is SUBMITTED.
        default: null
      - name: withdrawn_reason
        type: string
        source: input
        description: Free-text reason captured when the applicant withdraws
        default: null

  - name: FacultyMember
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program this faculty member serves
      - name: full_name
        type: string
        source: input
        description: Faculty member name
        constraints: non-empty
      - name: is_program_director
        type: boolean
        source: input
        description: >
          Whether this member holds the PD appointment. Exactly the members with this flag
          may certify the program's RankList, subject to segregation of duties.
        default: false
      - name: is_committee_member
        type: boolean
        source: input
        description: Whether this member sits on the rank committee and may cast a ballot
        default: false
      - name: conflict_applicant_ids
        type: array
        source: input
        description: >
          Array of Applicant.id strings this member has a declared conflict of interest
          with. Blocks interview assignment and review authorship for those applicants.
        default: []
      - name: scheduled_load
        type: number
        source: computed
        description: >
          Variant A of interviewer load (see calculations.interviewer_load_index).
          2 decimal places.
        default: 0.0
      - name: realized_load
        type: number
        source: computed
        description: >
          Variant B of interviewer load, over completed slots only. 2 decimal places.
        default: 0.0

  - name: ApplicationReview
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application being reviewed
      - name: reviewer_id
        type: string
        source: system
        description: >
          FK -> FacultyMember.id; the authoring reviewer, taken from the X-User-ID header of the
          acting Reviewer rather than from the request body
      - name: academic_points
        type: integer
        source: input
        description: Reviewer's academic sub-score
        constraints: "0..40"
      - name: experience_points
        type: integer
        source: input
        description: Reviewer's clinical-experience sub-score
        constraints: "0..30"
      - name: holistic_points
        type: integer
        source: input
        description: Reviewer's holistic/mission-fit sub-score
        constraints: "0..30"
  - name: InterviewWave
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program running this invitation wave
      - name: wave_index
        type: integer
        source: input
        description: 1-based ordinal of the wave within the season
        constraints: ">= 1, unique per program_id"
      - name: invite_release_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant invitations in this wave become releasable
      - name: response_deadline_at
        type: datetime
        source: input
        description: >
          ISO 8601 UTC instant after which an ISSUED invitation in this wave expires.
          Must be strictly after invite_release_at.
      - name: seat_capacity
        type: integer
        source: input
        description: Maximum number of invitations this wave may have in ISSUED or ACCEPTED state
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: Wave lifecycle
        default: PLANNED
        constraints: "one of PLANNED, RELEASED, CLOSED"
      - name: issued_count
        type: integer
        source: computed
        description: Count of InterviewInvitation rows in this wave with status in {ISSUED, ACCEPTED}
        default: 0

  - name: InterviewSlot
    parent: null
    common_fields: true
    fields:
      - name: wave_id
        type: string
        source: input
        description: FK -> InterviewWave.id; the wave this slot belongs to
      - name: start_at
        type: datetime
        source: input
        description: ISO 8601 UTC start of the interview block
      - name: end_at
        type: datetime
        source: input
        description: ISO 8601 UTC end of the interview block; must be strictly after start_at
      - name: room_label
        type: string
        source: input
        description: Physical or virtual room identifier
        constraints: non-empty
      - name: applicant_capacity
        type: integer
        source: input
        description: Number of applicants this slot can host
        constraints: ">= 1"
      - name: booked_count
        type: integer
        source: computed
        description: >
          Count of InterviewInvitation rows whose slot_id is this slot and whose status
          == ACCEPTED. Conserved quantity - applicant_capacity - booked_count is the
          seat pool, and every accept/release pair must restore it exactly.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Slot lifecycle
        default: OPEN
        constraints: "one of OPEN, BOOKED, COMPLETED, CANCELLED"

  - name: InterviewInvitation
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the invited application
      - name: wave_id
        type: string
        source: input
        description: FK -> InterviewWave.id; the wave that issued or waitlisted this invitation
      - name: slot_id
        type: string
        source: computed
        description: >
          FK -> InterviewSlot.id; the slot chosen at accept time. Null while the invitation
          is ISSUED, WAITLISTED, DECLINED, EXPIRED or WITHDRAWN.
        default: null
      - name: status
        type: enum
        source: computed
        description: >
          Invitation lifecycle. WAITLISTED -> ISSUED -> WAITLISTED is a permitted cycle
          driven by seat releases and wave closure.
        default: ISSUED
        constraints: "one of ISSUED, WAITLISTED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN"
      - name: issued_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the invitation last entered ISSUED; null while WAITLISTED
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: >
          ISO 8601 UTC instant this invitation lapses. Set on entry to ISSUED as the earlier
          of the wave's response_deadline_at and issued_at + INVITATION_RESPONSE_WINDOW_HOURS.
        default: null
      - name: responded_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the applicant accepted or declined
        default: null

  - name: InterviewAssignment
    parent: null
    common_fields: true
    fields:
      - name: slot_id
        type: string
        source: input
        description: FK -> InterviewSlot.id; the slot being staffed
      - name: faculty_member_id
        type: string
        source: input
        description: FK -> FacultyMember.id; the assigned interviewer
      - name: panel_role
        type: enum
        source: input
        description: Position on the interview panel
        constraints: "one of LEAD, MEMBER"
      - name: status
        type: enum
        source: computed
        description: Assignment lifecycle
        default: ASSIGNED
        constraints: "one of ASSIGNED, RELEASED"

  - name: ScoreCard
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: FK -> InterviewAssignment.id; the panel seat that authored this score card
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the interviewed application being scored
      - name: communication_score
        type: integer
        source: input
        description: Rubric domain - communication skills
        constraints: "1..10"
      - name: clinical_reasoning_score
        type: integer
        source: input
        description: Rubric domain - clinical reasoning
        constraints: "1..10"
      - name: professionalism_score
        type: integer
        source: input
        description: Rubric domain - professionalism
        constraints: "1..10"
      - name: teamwork_score
        type: integer
        source: input
        description: Rubric domain - teamwork
        constraints: "1..10"
      - name: domain_average
        type: number
        source: computed
        description: >
          Mean of the four rubric domain scores, rounded to 1 decimal place, round_half_up.
          This is the per-card rounding step of committee_rubric_score.
        default: null
      - name: status
        type: enum
        source: computed
        description: >
          Score card lifecycle. SUBMITTED -> AMEND_REQUESTED -> DRAFT -> SUBMITTED is a
          permitted revision cycle.
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, AMEND_REQUESTED, LOCKED"

  - name: RankList
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program whose preference order this list expresses
      - name: status
        type: enum
        source: computed
        description: >
          Deliberation lifecycle. COMMITTEE_REVIEW forks to either RETURNED or APPROVED with
          different side-effect sets; RETURNED re-enters DRAFT, forming a revision cycle.
        default: DRAFT
        constraints: "one of DRAFT, COMMITTEE_REVIEW, RETURNED, APPROVED, CERTIFIED, WITHDRAWN"
      - name: entry_count
        type: integer
        source: computed
        description: Count of RankListEntry rows attached to this list
        default: 0
      - name: review_round
        type: integer
        source: computed
        description: >
          Number of times this list has entered COMMITTEE_REVIEW. Starts at 0 and increments
          on each DRAFT -> COMMITTEE_REVIEW transition.
        default: 0
      - name: approved_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the committee ballot reached quorum approval
        default: null
      - name: certified_by_faculty_id
        type: string
        source: computed
        description: >
          FK -> FacultyMember.id; the program director who certified the list. Null before
          certification.
        default: null

  - name: RankListEntry
    parent: null
    common_fields: true
    fields:
      - name: rank_list_id
        type: string
        source: input
        description: FK -> RankList.id; the owning list
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the ranked application
      - name: rank_position
        type: integer
        source: input
        description: 1-based preference position; unique within a rank_list_id
        constraints: ">= 1"
      - name: tie_group_anchor_entry_id
        type: string
        source: input
        description: >
          FK -> RankListEntry.id; self-referential pointer to the lowest-numbered entry of a
          deliberation tie group. Null when this entry stands alone. Must reference an entry
          on the same rank_list_id.
        default: null

  - name: CommitteeVote
    parent: null
    common_fields: true
    fields:
      - name: rank_list_id
        type: string
        source: input
        description: FK -> RankList.id; the list under deliberation
      - name: faculty_member_id
        type: string
        source: input
        description: FK -> FacultyMember.id; the balloting committee member
      - name: review_round
        type: integer
        source: computed
        description: >
          The RankList.review_round in force when this ballot was cast. Only ballots whose
          review_round equals the list's current review_round count toward quorum.
        default: 1
      - name: ballot
        type: enum
        source: input
        description: The member's decision on the list as presented
        constraints: "one of APPROVE, RETURN"
      - name: comment
        type: string
        source: input
        description: Optional deliberation note
        default: null

  - name: MatchResult
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program the result belongs to
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application the result belongs to
      - name: outcome
        type: enum
        source: computed
        description: >
          Match outcome. VACATED is written only by the contract-rescission cascade and
          returns the position to the program's unfilled pool.
        default: PENDING
        constraints: "one of PENDING, MATCHED, UNMATCHED, VACATED"
      - name: matched_rank_position
        type: integer
        source: computed
        description: The RankListEntry.rank_position that produced a MATCHED outcome; null otherwise
        default: null
      - name: published_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant match day published this result
        default: null

  - name: SoapOffer
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program extending the SOAP offer
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the unmatched application receiving the offer
      - name: soap_round
        type: integer
        source: input
        description: SOAP round ordinal
        constraints: "1..4"
      - name: status
        type: enum
        source: computed
        description: Offer lifecycle
        default: OFFERED
        constraints: "one of OFFERED, ACCEPTED, DECLINED, EXPIRED"
      - name: offered_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the offer was extended
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: >
          ISO 8601 UTC instant the offer lapses, set to offered_at + SOAP_OFFER_WINDOW_HOURS
        default: null

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: match_result_id
        type: string
        source: input
        description: FK -> MatchResult.id; the filled position this contract documents
      - name: salary_cents
        type: integer
        source: input
        description: PGY-1 annual stipend in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: >
          Contract lifecycle. RESCINDED is the compensating terminal state reached from
          SIGNED or ACTIVE and drives the position-conservation cascade.
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, SIGNED, ACTIVE, VOID, RESCINDED"
      - name: issued_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the contract was issued to the applicant
        default: null
      - name: signed_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the applicant signed
        default: null
      - name: mandatory_credential_count
        type: integer
        source: computed
        description: Count of CredentialItem rows for this contract whose is_mandatory == true
        default: 0
      - name: verified_credential_count
        type: integer
        source: computed
        description: >
          Count of CredentialItem rows for this contract whose is_mandatory == true and
          status == VERIFIED
        default: 0

  - name: CredentialItem
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the onboarding packet this item belongs to
      - name: credential_type
        type: enum
        source: input
        description: Onboarding credential category
        constraints: "one of STATE_LICENSE, DEA, VISA, BLS"
      - name: is_mandatory
        type: boolean
        source: computed
        description: >
          Whether this item gates contract activation. Derived at creation: STATE_LICENSE and
          BLS are always mandatory; DEA is mandatory only when the program's specialty_code is
          not PATH; VISA is mandatory only when the applicant's visa_status is NEEDS_J1 or
          NEEDS_H1B.
        default: true
      - name: status
        type: enum
        source: computed
        description: >
          Verification lifecycle. REJECTED -> SUBMITTED is a permitted resubmission cycle.
          VOIDED is written only by the contract-rescission cascade.
        default: PENDING
        constraints: "one of PENDING, SUBMITTED, VERIFIED, REJECTED, VOIDED"
      - name: reference_number
        type: string
        source: input
        description: License/DEA/visa document number supplied at submission time
        default: null
      - name: verified_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant a verifier accepted the item
        default: null

  - name: CommunicationLog
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application the message concerns
      - name: author_faculty_id
        type: string
        source: input
        description: >
          FK -> FacultyMember.id; the authoring faculty member. Null when the message was
          logged by a coordinator acting under an opaque operator identity.
        default: null
      - name: channel
        type: enum
        source: input
        description: Medium the pre-match contact used
        constraints: "one of EMAIL, PHONE, IN_PERSON"
      - name: body
        type: string
        source: input
        description: Verbatim message text scanned for prohibited pre-match content
        constraints: non-empty, max 2000 chars
      - name: contains_ranking_intent
        type: boolean
        source: computed
        description: >
          True when the body matches the prohibited-content scan (see
          calculations.communication_compliance_scan)
        default: false
      - name: compliance_status
        type: enum
        source: computed
        description: Outcome of the compliance scan and any subsequent officer review
        default: CLEAN
        constraints: "one of CLEAN, FLAGGED, CLEARED"
      - name: sent_at
        type: datetime
        source: computed
        description: Logical-clock instant the message was logged
        default: null

state_machines:
  - entity: Program
    state_field: season_phase
    initial_state: PRE_SEASON
    terminal_states: []
    note: >
      SEASON_CLOSED is the intended resting phase but is NOT terminal - the contract
      rescission cascade re-opens a closed season back to SOAP_ACTIVE when a position is
      vacated, so the machine admits a SEASON_CLOSED -> SOAP_ACTIVE cycle.
    transitions:
      - from: PRE_SEASON
        to: REVIEW_OPEN
        trigger: "POST /programs/{id}/advance-phase with to_phase=REVIEW_OPEN"
        actor: ProgramCoordinator
        preconditions:
          - "at least one FacultyMember exists with this program_id"
        side_effects:
          - "increments Program.version by 1"
      - from: REVIEW_OPEN
        to: INTERVIEWS_OPEN
        trigger: "POST /programs/{id}/advance-phase with to_phase=INTERVIEWS_OPEN"
        actor: ProgramCoordinator
        preconditions:
          - "at least one Application with this program_id has screening_status == ADVANCED"
        side_effects:
          - "increments Program.version by 1"
      - from: INTERVIEWS_OPEN
        to: RANKING
        trigger: "POST /programs/{id}/advance-phase with to_phase=RANKING"
        actor: ProgramCoordinator
        preconditions:
          - "every InterviewWave with this program_id has status == CLOSED"
        side_effects:
          - "increments Program.version by 1"
      - from: RANKING
        to: LIST_CERTIFIED
        trigger: "system: the program's RankList reaches CERTIFIED"
        actor: system
        preconditions:
          - "the certifying RankList.program_id == this Program.id"
        side_effects:
          - "sets Program.rank_list_certified_at to the current logical clock instant"
          - "increments Program.version by 1"
      - from: LIST_CERTIFIED
        to: MATCH_COMPLETE
        trigger: "POST /programs/{id}/run-match"
        actor: NrmpAdmin
        preconditions:
          - "Program.rank_list_certified_at is not null"
          - "no MatchResult rows exist for this program_id"
        side_effects:
          - "creates one MatchResult per RankListEntry on the CERTIFIED list, in ascending rank_position order (see calculations.match_day_assignment)"
          - "sets Program.matched_count to the number of MatchResult rows with outcome == MATCHED"
          - "sets Program.unfilled_positions to quota_positions - matched_count"
          - "increments Program.version by 1"
      - from: MATCH_COMPLETE
        to: SOAP_ACTIVE
        trigger: "POST /programs/{id}/advance-phase with to_phase=SOAP_ACTIVE"
        actor: NrmpAdmin
        preconditions:
          - "Program.soap_participating == true"
          - "Program.unfilled_positions >= 1"
        side_effects:
          - "increments Program.version by 1"
      - from: MATCH_COMPLETE
        to: SEASON_CLOSED
        trigger: "POST /programs/{id}/advance-phase with to_phase=SEASON_CLOSED"
        actor: NrmpAdmin
        preconditions:
          - "Program.unfilled_positions == 0"
        side_effects:
          - "increments Program.version by 1"
      - from: SOAP_ACTIVE
        to: SEASON_CLOSED
        trigger: "POST /programs/{id}/advance-phase with to_phase=SEASON_CLOSED"
        actor: NrmpAdmin
        preconditions:
          - "Program.unfilled_positions == 0 OR at least one SoapOffer with soap_round == 4 exists for this program_id"
        side_effects:
          - "sets every SoapOffer for this program_id whose status == OFFERED to EXPIRED"
          - "increments Program.version by 1"
      - from: SEASON_CLOSED
        to: SOAP_ACTIVE
        trigger: "system: a Contract rescission vacates a filled position (cascade hop 3)"
        actor: system
        preconditions:
          - "Program.soap_participating == true"
          - "Program.unfilled_positions >= 1 after the vacating cascade"
        side_effects:
          - "increments Program.version by 1"

  - entity: Application
    state_field: screening_status
    initial_state: RECEIVED
    terminal_states: [REJECTED, WITHDRAWN]
    note: >
      Paper-review dimension. Evolves independently of interview_status; the two dimensions
      share no state names and no transition on one dimension writes the other except where
      a side effect says so explicitly.
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/reviews (first submitted review)"
        actor: Reviewer
        preconditions:
          - "the Application's Program.season_phase == REVIEW_OPEN"
          - "the acting FacultyMember.program_id == the Application's program_id"
          - "the Application's applicant_id is NOT present in the acting FacultyMember.conflict_applicant_ids"
        side_effects:
          - "creates an ApplicationReview with status SUBMITTED"
          - "increments Application.review_count by 1"
          - "recomputes Application.provisional_screen_score (see calculations.screen_composite_score variant provisional)"
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/reviews (subsequent submitted review)"
        actor: Reviewer
        preconditions:
          - "the Application's Program.season_phase == REVIEW_OPEN"
          - "the acting FacultyMember.program_id == the Application's program_id"
          - "the Application's applicant_id is NOT present in the acting FacultyMember.conflict_applicant_ids"
          - "no ApplicationReview already exists for this application_id with this reviewer_id"
        side_effects:
          - "creates an ApplicationReview with status SUBMITTED"
          - "increments Application.review_count by 1"
          - "recomputes Application.provisional_screen_score (see calculations.screen_composite_score variant provisional)"
      - from: UNDER_REVIEW
        to: ADVANCED
        trigger: "POST /applications/{id}/screen with decision=ADVANCE"
        actor: ProgramCoordinator
        preconditions:
          - "the Application's Program.season_phase == REVIEW_OPEN"
          - "Application.review_count >= MIN_REVIEWS_TO_SCREEN"
          - "the Applicant.step2_score >= the Program.min_step2_score (inclusive)"
          - "the Applicant.medical_school_type != IMG OR the Program.img_accepted == true"
          - "the Applicant.visa_status NOT IN {NEEDS_J1, NEEDS_H1B} OR the Program.visa_sponsorship_allowed == true"
        side_effects:
          - "writes Application.final_screen_score (see calculations.screen_composite_score variant final)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /applications/{id}/screen with decision=REJECT"
        actor: ProgramCoordinator
        preconditions:
          - "the Application's Program.season_phase == REVIEW_OPEN"
          - "Application.review_count >= MIN_REVIEWS_TO_SCREEN"
        side_effects:
          - "writes Application.final_screen_score (see calculations.screen_composite_score variant final)"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Application.applicant_id"
        side_effects:
          - "stores Application.withdrawn_reason from the request body"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Application.applicant_id"
        side_effects:
          - "stores Application.withdrawn_reason from the request body"
      - from: ADVANCED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Application.applicant_id"
        side_effects:
          - "stores Application.withdrawn_reason from the request body"
          - "sets every InterviewInvitation for this application_id whose status IN {ISSUED, WAITLISTED} to WITHDRAWN"
          - "for an invitation whose status was ACCEPTED: sets it to WITHDRAWN, decrements its InterviewSlot.booked_count by 1, and returns that slot from BOOKED to OPEN when booked_count < applicant_capacity"
          - "sets Application.interview_status to CANCELLED when it was IN {INVITED, SCHEDULED}"
          - "recomputes Program.invited_count"

  - entity: Application
    state_field: interview_status
    initial_state: NOT_INVITED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    note: >
      Interview-progress dimension, independent of screening_status. INVITED -> NOT_INVITED
      is a permitted reverse edge, so this dimension is cyclic rather than a pipeline.
    transitions:
      - from: NOT_INVITED
        to: INVITED
        trigger: "system: an InterviewInvitation for this application enters ISSUED"
        actor: system
        preconditions:
          - "Application.screening_status == ADVANCED"
        side_effects:
          - "recomputes Program.invited_count"
      - from: INVITED
        to: SCHEDULED
        trigger: "system: an InterviewInvitation for this application enters ACCEPTED"
        actor: system
        preconditions:
          - "the accepted invitation's slot_id is not null"
        side_effects: []
      - from: INVITED
        to: NOT_INVITED
        trigger: "system: the application's last active InterviewInvitation leaves ISSUED for DECLINED or EXPIRED"
        actor: system
        preconditions:
          - "no remaining InterviewInvitation for this application_id has status IN {ISSUED, WAITLISTED, ACCEPTED}"
        side_effects:
          - "recomputes Program.invited_count"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /interview-slots/{id}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "the application holds an ACCEPTED InterviewInvitation whose slot_id == this slot"
          - "the application_id is NOT listed in the request's no_show_application_ids"
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /interview-slots/{id}/complete with the application_id listed in no_show_application_ids"
        actor: ProgramCoordinator
        preconditions:
          - "the application holds an ACCEPTED InterviewInvitation whose slot_id == this slot"
        side_effects: []
      - from: SCHEDULED
        to: NOT_INVITED
        trigger: "system: the application's ACCEPTED InterviewInvitation is declined after acceptance"
        actor: system
        preconditions:
          - "no remaining InterviewInvitation for this application_id has status IN {ISSUED, WAITLISTED, ACCEPTED}"
        side_effects:
          - "recomputes Program.invited_count"
      - from: SCHEDULED
        to: INVITED
        trigger: "system: the application's ACCEPTED InterviewInvitation is rescheduled back to ISSUED"
        actor: system
        preconditions:
          - "the rescheduled InterviewInvitation returns to status ISSUED and its slot_id becomes null"
        side_effects: []
      - from: INVITED
        to: CANCELLED
        trigger: "system: the Application is withdrawn by its applicant"
        actor: system
        preconditions:
          - "Application.screening_status becomes WITHDRAWN"
        side_effects:
          - "recomputes Program.invited_count"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: the Application is withdrawn by its applicant"
        actor: system
        preconditions:
          - "Application.screening_status becomes WITHDRAWN"
        side_effects:
          - "recomputes Program.invited_count"

  - entity: InterviewWave
    state_field: status
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /interview-waves/{id}/release"
        actor: ProgramCoordinator
        preconditions:
          - "the wave's Program.season_phase == INTERVIEWS_OPEN"
          - "the current logical clock instant >= InterviewWave.invite_release_at"
        side_effects:
          - "increments InterviewWave.version by 1"
      - from: RELEASED
        to: CLOSED
        trigger: "POST /interview-waves/{id}/close"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "sets every InterviewInvitation in this wave whose status IN {ISSUED, WAITLISTED} to EXPIRED"
          - "for each application whose last active invitation was thereby expired, reverts Application.interview_status from INVITED to NOT_INVITED"
          - "recomputes InterviewWave.issued_count"
          - "recomputes Program.invited_count"
          - "increments InterviewWave.version by 1"

  - entity: InterviewSlot
    state_field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    note: >
      OPEN <-> BOOKED is a two-way edge driven purely by seat occupancy, which is what makes
      the seat-conservation invariant observable.
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "system: an InterviewInvitation accept raises booked_count to applicant_capacity"
        actor: system
        preconditions:
          - "InterviewSlot.booked_count == InterviewSlot.applicant_capacity after the accept"
        side_effects: []
      - from: BOOKED
        to: OPEN
        trigger: "system: a seat is released by an invitation leaving ACCEPTED"
        actor: system
        preconditions:
          - "InterviewSlot.booked_count < InterviewSlot.applicant_capacity after the release"
        side_effects: []
      - from: OPEN
        to: COMPLETED
        trigger: "POST /interview-slots/{id}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "the current logical clock instant >= InterviewSlot.end_at"
        side_effects:
          - "sets each ACCEPTED invitation's Application.interview_status to COMPLETED, or to NO_SHOW when listed in no_show_application_ids"
          - "recomputes realized_load for every FacultyMember holding an ASSIGNED InterviewAssignment on this slot"
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /interview-slots/{id}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "the current logical clock instant >= InterviewSlot.end_at"
        side_effects:
          - "sets each ACCEPTED invitation's Application.interview_status to COMPLETED, or to NO_SHOW when listed in no_show_application_ids"
          - "recomputes realized_load for every FacultyMember holding an ASSIGNED InterviewAssignment on this slot"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /interview-slots/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "the current logical clock instant < InterviewSlot.start_at"
        side_effects:
          - "sets every InterviewAssignment on this slot to RELEASED"
          - "recomputes scheduled_load for every affected FacultyMember"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /interview-slots/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "the current logical clock instant < InterviewSlot.start_at"
        side_effects:
          - "sets every ACCEPTED InterviewInvitation on this slot to WITHDRAWN and decrements booked_count to 0"
          - "reverts each affected Application.interview_status from SCHEDULED to NOT_INVITED"
          - "sets every InterviewAssignment on this slot to RELEASED"
          - "recomputes scheduled_load for every affected FacultyMember"
          - "recomputes Program.invited_count"

  - entity: InterviewInvitation
    state_field: status
    initial_state: ISSUED
    terminal_states: [DECLINED, EXPIRED, WITHDRAWN]
    note: >
      Created directly in ISSUED when the wave still has seats, or directly in WAITLISTED when
      InterviewWave.issued_count has already reached seat_capacity. ISSUED -> ACCEPTED -> ISSUED
      (reschedule) is a permitted cycle, and WAITLISTED -> ISSUED is a promotion reverse edge.
    transitions:
      - from: WAITLISTED
        to: ISSUED
        trigger: "system: a seat frees in the wave and this invitation wins the promotion selector (cascade hop 2)"
        actor: system
        preconditions:
          - "the wave's status == RELEASED"
          - "InterviewWave.issued_count < InterviewWave.seat_capacity after the seat release"
          - "this invitation is the winner of calculations.waitlist_promotion_selector for the wave"
        side_effects:
          - "sets issued_at to the current logical clock instant"
          - "sets expires_at to the earlier of the wave's response_deadline_at and issued_at + INVITATION_RESPONSE_WINDOW_HOURS"
          - "increments InterviewWave.issued_count by 1"
          - "advances the promoted Application.interview_status from NOT_INVITED to INVITED (cascade hop 3)"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /interview-invitations/{id}/accept"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Application.applicant_id of this invitation"
          - "the current logical clock instant < InterviewInvitation.expires_at"
          - "the wave's status == RELEASED"
          - "the requested InterviewSlot.wave_id == this invitation's wave_id"
          - "the requested InterviewSlot.status is neither COMPLETED nor CANCELLED - the full-seat case is owned by the priority-11 ERR_SLOT_FULL rule, not by the state check"
          - "no other InterviewInvitation for this application_id has status ACCEPTED"
        side_effects:
          - "sets slot_id to the requested slot and responded_at to the current logical clock instant"
          - "increments InterviewSlot.booked_count by 1"
          - "moves the slot from OPEN to BOOKED when booked_count reaches applicant_capacity"
          - "advances Application.interview_status from INVITED to SCHEDULED"
      - from: ACCEPTED
        to: ISSUED
        trigger: "POST /interview-invitations/{id}/reschedule"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Application.applicant_id of this invitation"
          - "the wave's status == RELEASED"
          - "the current logical clock instant < the wave's response_deadline_at"
          - "the current logical clock instant < the currently booked InterviewSlot.start_at"
        side_effects:
          - "decrements the previously booked InterviewSlot.booked_count by 1 and returns that slot from BOOKED to OPEN when booked_count < applicant_capacity"
          - "clears slot_id to null and responded_at to null"
          - "sets issued_at to the current logical clock instant and recomputes expires_at as the earlier of the wave's response_deadline_at and issued_at + INVITATION_RESPONSE_WINDOW_HOURS"
          - "reverts Application.interview_status from SCHEDULED to INVITED"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /interview-invitations/{id}/decline"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Application.applicant_id of this invitation"
          - "the wave's status == RELEASED"
        side_effects:
          - "sets responded_at to the current logical clock instant"
          - "decrements InterviewWave.issued_count by 1"
          - "promotes the winner of calculations.waitlist_promotion_selector from WAITLISTED to ISSUED when the wave has a waitlisted candidate"
          - "reverts Application.interview_status from INVITED to NOT_INVITED when the application retains no invitation in {ISSUED, WAITLISTED, ACCEPTED}"
      - from: ACCEPTED
        to: DECLINED
        trigger: "POST /interview-invitations/{id}/decline"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Application.applicant_id of this invitation"
          - "the wave's status == RELEASED"
          - "the current logical clock instant < the currently booked InterviewSlot.start_at"
        side_effects:
          - "sets responded_at to the current logical clock instant"
          - "cascade hop 1: decrements the booked InterviewSlot.booked_count by 1 and returns that slot from BOOKED to OPEN when booked_count < applicant_capacity"
          - "cascade hop 2: that seat release promotes the winner of calculations.waitlist_promotion_selector from WAITLISTED to ISSUED"
          - "cascade hop 3: the promoted invitation advances its own Application.interview_status from NOT_INVITED to INVITED"
          - "cascade hop 4: Program.invited_count is recomputed from the changed set of invited applications"
          - "reverts the declining Application.interview_status from SCHEDULED to NOT_INVITED when it retains no invitation in {ISSUED, WAITLISTED, ACCEPTED}"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /interview-waves/{id}/close, or a lapse sweep once the logical clock passes expires_at"
        actor: system
        preconditions:
          - "the current logical clock instant >= InterviewInvitation.expires_at OR the wave is closing"
        side_effects:
          - "decrements InterviewWave.issued_count by 1"
          - "reverts Application.interview_status from INVITED to NOT_INVITED when the application retains no invitation in {ISSUED, WAITLISTED, ACCEPTED}"
      - from: WAITLISTED
        to: EXPIRED
        trigger: "POST /interview-waves/{id}/close"
        actor: system
        preconditions:
          - "the wave is closing"
        side_effects: []
      - from: ISSUED
        to: WITHDRAWN
        trigger: "system: the Application is withdrawn by its applicant"
        actor: system
        preconditions:
          - "the owning Application.screening_status becomes WITHDRAWN"
        side_effects:
          - "decrements InterviewWave.issued_count by 1"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "system: the Application is withdrawn by its applicant"
        actor: system
        preconditions:
          - "the owning Application.screening_status becomes WITHDRAWN"
        side_effects: []
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "system: the Application is withdrawn by its applicant"
        actor: system
        preconditions:
          - "the owning Application.screening_status becomes WITHDRAWN"
        side_effects:
          - "decrements the booked InterviewSlot.booked_count by 1 and returns that slot from BOOKED to OPEN when booked_count < applicant_capacity"
          - "decrements InterviewWave.issued_count by 1"

  - entity: ScoreCard
    state_field: status
    initial_state: DRAFT
    terminal_states: [LOCKED]
    note: >
      SUBMITTED -> AMEND_REQUESTED -> DRAFT -> SUBMITTED is a permitted revision cycle, so a
      card may be submitted more than once before the rank list locks it.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /score-cards/{id}/submit"
        actor: Interviewer
        preconditions:
          - "the acting FacultyMember.id == the InterviewAssignment.faculty_member_id of this card"
          - "the InterviewAssignment.status == ASSIGNED"
          - "the scored Application.interview_status == COMPLETED"
        side_effects:
          - "writes ScoreCard.domain_average as the mean of the four rubric domains rounded to 1 decimal place, round_half_up"
          - "recomputes Application.committee_score (see calculations.committee_rubric_score)"
      - from: SUBMITTED
        to: AMEND_REQUESTED
        trigger: "POST /score-cards/{id}/request-amendment"
        actor: ProgramDirector
        preconditions:
          - "the acting FacultyMember.is_program_director == true"
          - "the acting FacultyMember.program_id == the scored Application's program_id"
          - "no RankList for that program has status CERTIFIED"
        side_effects: []
      - from: AMEND_REQUESTED
        to: DRAFT
        trigger: "POST /score-cards/{id}/revise"
        actor: Interviewer
        preconditions:
          - "the acting FacultyMember.id == the InterviewAssignment.faculty_member_id of this card"
        side_effects:
          - "overwrites the four rubric domain scores from the request body"
          - "clears ScoreCard.domain_average to null"
          - "recomputes Application.committee_score over the remaining SUBMITTED and LOCKED cards"
      - from: SUBMITTED
        to: LOCKED
        trigger: "system: the program's RankList reaches CERTIFIED"
        actor: system
        preconditions:
          - "the scored Application appears as a RankListEntry on the certifying list"
        side_effects: []

  - entity: RankList
    state_field: status
    initial_state: DRAFT
    terminal_states: [CERTIFIED, WITHDRAWN]
    note: >
      COMMITTEE_REVIEW forks to APPROVED or RETURNED with different side-effect sets, and
      RETURNED -> DRAFT closes a deliberation revision cycle.
    transitions:
      - from: DRAFT
        to: COMMITTEE_REVIEW
        trigger: "POST /rank-lists/{id}/submit-to-committee"
        actor: ProgramDirector
        preconditions:
          - "the acting FacultyMember.is_program_director == true"
          - "the acting FacultyMember.program_id == RankList.program_id"
          - "the RankList's Program.season_phase == RANKING"
          - "RankList.entry_count >= 1"
          - "RankList.entry_count <= the Program.quota_positions * RANK_LIST_MAX_MULTIPLE"
          - "the set of rank_position values across this list's entries is exactly 1..entry_count with no gaps and no duplicates"
          - "every RankListEntry's Application has at least MIN_SCORECARDS_PER_ENTRY ScoreCard rows with status IN {SUBMITTED, LOCKED}"
        side_effects:
          - "increments RankList.review_round by 1"
          - "increments RankList.version by 1"
      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "system: APPROVE ballots in the current review_round reach quorum"
        actor: system
        preconditions:
          - "see calculations.committee_quorum_resolution - APPROVE branch"
        side_effects:
          - "sets RankList.approved_at to the current logical clock instant"
          - "increments RankList.version by 1"
      - from: COMMITTEE_REVIEW
        to: RETURNED
        trigger: "system: RETURN ballots in the current review_round reach quorum"
        actor: system
        preconditions:
          - "see calculations.committee_quorum_resolution - RETURN branch"
        side_effects:
          - "leaves RankList.approved_at null - this branch writes no approval timestamp"
          - "increments RankList.version by 1"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /rank-lists/{id}/revise"
        actor: ProgramDirector
        preconditions:
          - "the acting FacultyMember.is_program_director == true"
          - "the acting FacultyMember.program_id == RankList.program_id"
        side_effects:
          - "increments RankList.version by 1"
      - from: APPROVED
        to: CERTIFIED
        trigger: "POST /rank-lists/{id}/certify"
        actor: ProgramDirector
        preconditions:
          - "the acting FacultyMember.is_program_director == true"
          - "the acting FacultyMember.program_id == RankList.program_id"
          - "the acting FacultyMember authored no ScoreCard for any Application ranked on this list"
          - "the acting FacultyMember cast no CommitteeVote for this rank_list_id in the current review_round"
          - "the current logical clock instant <= the Program's certification deadline CERT_DEADLINE_UTC"
        side_effects:
          - "sets RankList.certified_by_faculty_id to the acting FacultyMember.id"
          - "sets every ScoreCard whose scored Application is ranked on this list from SUBMITTED to LOCKED"
          - "advances the Program.season_phase from RANKING to LIST_CERTIFIED and stamps Program.rank_list_certified_at"
          - "increments RankList.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /rank-lists/{id}/withdraw"
        actor: ProgramDirector
        preconditions:
          - "the acting FacultyMember.is_program_director == true"
          - "the acting FacultyMember.program_id == RankList.program_id"
        side_effects:
          - "increments RankList.version by 1"
      - from: COMMITTEE_REVIEW
        to: WITHDRAWN
        trigger: "POST /rank-lists/{id}/withdraw"
        actor: ProgramDirector
        preconditions:
          - "the acting FacultyMember.is_program_director == true"
          - "the acting FacultyMember.program_id == RankList.program_id"
        side_effects:
          - "increments RankList.version by 1"

  - entity: MatchResult
    state_field: outcome
    initial_state: PENDING
    terminal_states: [UNMATCHED, VACATED]
    transitions:
      - from: PENDING
        to: MATCHED
        trigger: "POST /programs/{id}/run-match"
        actor: NrmpAdmin
        preconditions:
          - "the ranked position falls within the program's quota per calculations.match_day_assignment"
        side_effects:
          - "sets matched_rank_position and published_at"
          - "increments Program.matched_count by 1 and decrements Program.unfilled_positions by 1"
      - from: PENDING
        to: UNMATCHED
        trigger: "POST /programs/{id}/run-match"
        actor: NrmpAdmin
        preconditions:
          - "the ranked position falls outside the program's quota per calculations.match_day_assignment"
        side_effects:
          - "sets published_at and leaves matched_rank_position null"
      - from: PENDING
        to: MATCHED
        trigger: "POST /soap-offers/{id}/accept (application was never ranked, so the row is created here)"
        actor: Applicant
        preconditions:
          - "the accepting SoapOffer's Program.unfilled_positions >= 1"
        side_effects:
          - "leaves matched_rank_position null"
      - from: UNMATCHED
        to: MATCHED
        trigger: "system: a SoapOffer for this application is accepted"
        actor: system
        preconditions:
          - "the Program.season_phase == SOAP_ACTIVE"
          - "the Program.unfilled_positions >= 1"
        side_effects:
          - "increments Program.matched_count by 1 and decrements Program.unfilled_positions by 1"
      - from: MATCHED
        to: VACATED
        trigger: "system: the Contract documenting this position is rescinded (cascade hop 1)"
        actor: system
        preconditions:
          - "the rescinded Contract.match_result_id == this MatchResult.id"
        side_effects:
          - "cascade hop 2: decrements Program.matched_count by 1 and increments Program.unfilled_positions by 1, preserving quota_positions == matched_count + unfilled_positions"
          - "clears matched_rank_position to null"

  - entity: SoapOffer
    state_field: status
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /soap-offers/{id}/accept"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Application.applicant_id of this offer"
          - "the current logical clock instant < SoapOffer.expires_at"
          - "the Program.season_phase == SOAP_ACTIVE"
          - "no other SoapOffer for this application_id has status ACCEPTED"
        side_effects:
          - "advances the application's MatchResult from UNMATCHED to MATCHED"
          - "increments Program.matched_count by 1 and decrements Program.unfilled_positions by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /soap-offers/{id}/decline"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Application.applicant_id of this offer"
          - "the current logical clock instant < SoapOffer.expires_at"
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /programs/{id}/advance-phase with to_phase=SEASON_CLOSED, or a lapse sweep once the logical clock passes expires_at"
        actor: system
        preconditions:
          - "the current logical clock instant >= SoapOffer.expires_at OR the season is closing"
        side_effects: []

  - entity: Contract
    state_field: status
    initial_state: DRAFT
    terminal_states: [VOID, RESCINDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /contracts"
        actor: ProgramCoordinator
        preconditions:
          - "the referenced MatchResult.outcome == MATCHED"
        side_effects:
          - "creates one CredentialItem row per required credential_type per calculations.credential_packet_composition"
          - "sets Contract.mandatory_credential_count to the number of created items whose is_mandatory == true"
          - "sets issued_at to the current logical clock instant"
      - from: ISSUED
        to: SIGNED
        trigger: "POST /contracts/{id}/sign"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Applicant of the contract's MatchResult Application"
        side_effects:
          - "sets signed_at to the current logical clock instant"
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: ProgramCoordinator
        preconditions:
          - "Contract.verified_credential_count == Contract.mandatory_credential_count"
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "POST /contracts/{id}/void"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "sets every CredentialItem for this contract whose status IN {PENDING, SUBMITTED, REJECTED} to VOIDED"
      - from: SIGNED
        to: RESCINDED
        trigger: "POST /contracts/{id}/rescind"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "cascade hop 1: advances the referenced MatchResult from MATCHED to VACATED"
          - "cascade hop 2: that vacancy decrements Program.matched_count by 1 and increments Program.unfilled_positions by 1"
          - "cascade hop 3: the restored vacancy re-opens a SEASON_CLOSED Program to SOAP_ACTIVE when Program.soap_participating == true"
          - "sets every CredentialItem for this contract whose status IN {PENDING, SUBMITTED, REJECTED} to VOIDED"
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /contracts/{id}/rescind"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "cascade hop 1: advances the referenced MatchResult from MATCHED to VACATED"
          - "cascade hop 2: that vacancy decrements Program.matched_count by 1 and increments Program.unfilled_positions by 1"
          - "cascade hop 3: the restored vacancy re-opens a SEASON_CLOSED Program to SOAP_ACTIVE when Program.soap_participating == true"
          - "sets every CredentialItem for this contract whose status IN {PENDING, SUBMITTED, REJECTED} to VOIDED"

  - entity: CredentialItem
    state_field: status
    initial_state: PENDING
    terminal_states: [VERIFIED, VOIDED]
    note: "REJECTED -> SUBMITTED is a permitted resubmission cycle."
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /credential-items/{id}/submit"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Applicant of the owning contract's MatchResult Application"
          - "the owning Contract.status IN {ISSUED, SIGNED}"
        side_effects:
          - "stores reference_number from the request body"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /credential-items/{id}/verify"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets verified_at to the current logical clock instant"
          - "increments Contract.verified_credential_count by 1 when is_mandatory == true"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /credential-items/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /credential-items/{id}/submit"
        actor: Applicant
        preconditions:
          - "the acting Applicant.id == the Applicant of the owning contract's MatchResult Application"
          - "the owning Contract.status IN {ISSUED, SIGNED}"
        side_effects:
          - "overwrites reference_number from the request body"
      - from: PENDING
        to: VOIDED
        trigger: "system: the owning Contract is voided or rescinded"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: VOIDED
        trigger: "system: the owning Contract is voided or rescinded"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: VOIDED
        trigger: "system: the owning Contract is voided or rescinded"
        actor: system
        preconditions: []
        side_effects: []

concurrency_rules:
  - rule_id: rank-entry-add-stale-list
    parent_entity: RankList
    write_endpoint: "POST /rank-lists/{id}/entries"
    occ_field: "expected_rank_list_version"
    description: |
      Adding a RankListEntry against a RankList whose version has advanced since the client
      last observed it is rejected. Adding an entry is a legitimate supersede operation - a
      second writer adding a different application at a different rank_position would itself
      succeed against the natural product semantics, because nothing in the list's state
      forbids it. The stale-version check is therefore the only thing that can reject it, and
      it protects the client whose view of the list's ordering is out of date.
    error_id: ERR_STALE_RANK_LIST_VERSION
    http_status: 412

  - rule_id: invitation-issue-stale-wave
    parent_entity: InterviewWave
    write_endpoint: "POST /interview-waves/{id}/invitations"
    occ_field: "expected_wave_version"
    description: |
      Issuing an InterviewInvitation against an InterviewWave whose version has advanced since
      the client last observed it is rejected. Issuing an invitation legitimately consumes a
      seat and can supersede the wave's waitlist ordering, so a second issue for a different
      application would itself succeed under the natural product semantics. The stale-version
      check protects a coordinator whose seat-count view predates the earlier issue.
    error_id: ERR_STALE_WAVE_VERSION
    http_status: 412

calculations:
  - name: screen_composite_score
    trigger: "on every ApplicationReview submission (provisional) and on the screening decision transition (final)"
    algorithm: weighted_scoring
    formula: |
      # Per-review raw contribution
      raw(review) = review.academic_points   * W_ACADEMIC
                  + review.experience_points * W_EXPERIENCE
                  + review.holistic_points   * W_HOLISTIC

      # Base mean over the included review set, NOT rounded at this step
      base = sum(raw(r) for r in included_reviews) / count(included_reviews)

      # Tiered band bonus selected from the applicant's Step 2 CK score
      if   applicant.step2_score >= 250: band_bonus = 6.0
      elif applicant.step2_score >= 235: band_bonus = 4.0
      elif applicant.step2_score >= 220: band_bonus = 2.0
      else:                              band_bonus = 0.0

      pipeline_bonus = PIPELINE_BONUS if applicant.pipeline_program_alum else 0.0

      # Variant provisional: base only, rounded once at the end
      provisional_screen_score = round_half_up(base, 2)

      # Variant final: base plus both bonuses, capped, rounded once at the end
      final_screen_score = round_half_up(min(base + band_bonus + pipeline_bonus, SCORE_CEILING), 2)
    input_set: >
      included_reviews = every ApplicationReview row for this application_id. Exactly one review
      per reviewer per application may exist, so the set never holds a superseded row. When
      count(included_reviews) == 0 the base is 0.0 and no division is performed.
    constants:
      W_ACADEMIC: 0.45
      W_EXPERIENCE: 0.30
      W_HOLISTIC: 0.25
      PIPELINE_BONUS: 3.0
      SCORE_CEILING: 40.0
    precision: "2 decimal places, round_half_up; rounding is applied once, at the end of each variant"
    variants:
      - name: provisional
        when: "recomputed into Application.provisional_screen_score on every review submission"
        difference: >
          Uses the review mean alone. Neither the Step 2 band bonus nor the pipeline bonus is
          applied, and the ceiling never binds.
      - name: final
        when: "written once into Application.final_screen_score by the ADVANCED or REJECTED screening transition"
        difference: >
          Adds the tiered Step 2 band bonus and the pipeline bonus to the same base, then caps
          at SCORE_CEILING. For identical review data the two variants therefore differ by
          exactly the bonus sum, unless the ceiling binds.

  - name: interviewer_load_index
    trigger: "on InterviewAssignment create/release (scheduled) and on InterviewSlot completion (realized)"
    algorithm: forward_looking
    formula: |
      duration_hours(slot) = (slot.end_at - slot.start_at) in hours, as an exact decimal
      role_weight(assignment) = LEAD_WEIGHT if assignment.panel_role == LEAD else MEMBER_WEIGHT

      # Variant scheduled - forward looking over slots that have not happened yet
      scheduled_load = round_half_up(
          sum( duration_hours(slot) * role_weight(a)
               for a in assignments if a.status == ASSIGNED
                                    and a.slot.status in {OPEN, BOOKED} ), 2)

      # Variant realized - chronological over slots that actually ran, discounted by attendance
      attendance_factor(slot) = slot.booked_count / slot.applicant_capacity
      realized_load = round_half_up(
          sum( duration_hours(slot) * role_weight(a) * attendance_factor(slot)
               for a in assignments if a.status == ASSIGNED
                                    and a.slot.status == COMPLETED ), 2)
    input_set: >
      assignments = InterviewAssignment rows whose faculty_member_id is this FacultyMember.
      RELEASED assignments are excluded from both variants. The scheduled variant counts only
      slots in {OPEN, BOOKED}; the realized variant counts only slots in {COMPLETED}. The two
      sets are disjoint, which is why the same assignment contributes to exactly one variant at
      a time and the pair diverges for identical data.
    constants:
      LEAD_WEIGHT: 1.5
      MEMBER_WEIGHT: 1.0
    precision: "2 decimal places, round_half_up, applied once to each variant's total"
    variants:
      - name: scheduled
        when: "recomputed into FacultyMember.scheduled_load whenever an assignment is created or released, or a slot is cancelled"
        difference: >
          Counts undiscounted panel hours for slots that have not run. Attendance is unknown, so
          no attendance factor is applied.
      - name: realized
        when: "recomputed into FacultyMember.realized_load when a slot is completed"
        difference: >
          Counts the same panel hours discounted by the slot's actual seat fill ratio, and only
          after the slot reaches COMPLETED. A half-empty completed slot therefore yields a
          strictly smaller realized contribution than its scheduled contribution was.

  - name: committee_rubric_score
    trigger: "on ScoreCard submission and on ScoreCard revision; written to Application.committee_score"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 - round EACH card's four-domain mean to 1 decimal place FIRST
      card_avg(card) = round_half_up(
          (card.communication_score + card.clinical_reasoning_score
           + card.professionalism_score + card.teamwork_score) / 4, 1)

      # STEP 2 - average the ALREADY-ROUNDED card averages, then round to 2 decimal places
      committee_score = round_half_up(
          sum(card_avg(c) for c in included_cards) / count(included_cards), 2)
    input_set: >
      included_cards = ScoreCard rows for this application_id whose status IN {SUBMITTED,
      LOCKED}. DRAFT and AMEND_REQUESTED cards are excluded. When count(included_cards) == 0
      the score is null and no division is performed.
    constants: {}
    precision: >
      PINNED ROUNDING ORDER - round each card's four-domain mean to 1 decimal place FIRST, then
      average the rounded card averages, then round that result to 2 decimal places. Both
      roundings are round_half_up. The alternative order (sum all 4 x N raw domain scores, divide
      by 4 x N, round once to 2 decimal places) is NOT used and produces a different value for
      most inputs; implementations MUST use the per-card-first order.
    variants: []

  - name: soap_offer_budget
    trigger: "evaluated on every POST /soap-offers to bound how many offers a program may have outstanding"
    algorithm: threshold
    formula: |
      # STEP 1 - the base is the raw vacancy count, computed BEFORE any reserve is considered
      base_unfilled = program.quota_positions - program.matched_count

      # STEP 2 - the reserve tier is keyed on base_unfilled, NOT on the budget it feeds
      if   base_unfilled >= 6: reserve_credit = 3
      elif base_unfilled >= 3: reserve_credit = 2
      elif base_unfilled >= 1: reserve_credit = 1
      else:                    reserve_credit = 0

      # STEP 3 - only now are the two combined
      soap_offer_budget = base_unfilled + reserve_credit
    input_set: >
      program.matched_count is the count of MatchResult rows for the program whose outcome ==
      MATCHED at evaluation time; VACATED and UNMATCHED rows do not count. The outstanding
      offer count compared against this budget is the number of SoapOffer rows for the program
      whose status IN {OFFERED, ACCEPTED}, across all rounds.
    constants:
      TIER_3_FLOOR: 6
      TIER_2_FLOOR: 3
      TIER_1_FLOOR: 1
    precision: "integer arithmetic only; no rounding"
    output_field: Program.soap_offer_budget
    variants: []
    note: >
      PINNED EVALUATION ORDER. The definition looks circular because the reserve credit appears
      to depend on the very budget it contributes to. It does not: the tier is selected from
      base_unfilled in STEP 2 and is never re-derived from soap_offer_budget. Implementations
      MUST NOT iterate to a fixed point.

  - name: waitlist_promotion_selector
    trigger: "when a seat frees in a RELEASED wave - invitation decline, reschedule, or applicant withdrawal"
    algorithm: waterfall_allocation
    formula: |
      candidates = InterviewInvitation rows where
            invitation.wave_id == the wave
        AND invitation.status == WAITLISTED
        AND invitation.Application.screening_status == ADVANCED
        AND invitation.Application.interview_status == NOT_INVITED

      # Ranking expression, then tie-break
      order candidates by Application.final_screen_score DESC,
                       then invitation.created_at ASC
      winner = first candidate in that order

      if candidates is empty: no promotion occurs; the freed seat stays available; no error
    input_set: >
      Exactly one invitation is promoted per freed seat. Invitations whose application has
      already been re-invited elsewhere in the same wave are excluded by the
      interview_status == NOT_INVITED clause.
    constants: {}
    precision: "not applicable"
    variants: []
    note: >
      Tie-break is created_at ASC. The random id field MUST NOT participate in this ordering,
      nor in any other selector in this scaffold.

  - name: match_day_assignment
    trigger: "POST /programs/{id}/run-match"
    algorithm: chronological
    formula: |
      entries = RankListEntry rows of the program's CERTIFIED RankList,
                processed in rank_position ASC order

      eligible(entry) = entry.Application.screening_status == ADVANCED
                    AND entry.Application.interview_status == COMPLETED

      filled = 0
      for entry in entries (rank_position ASC):
          if eligible(entry) and filled < program.quota_positions:
              create MatchResult(outcome=MATCHED,
                                 matched_rank_position=entry.rank_position)
              filled = filled + 1
          else:
              create MatchResult(outcome=UNMATCHED, matched_rank_position=null)
    input_set: >
      One MatchResult row is created per RankListEntry, so every ranked application receives a
      published result. Applications not ranked receive no MatchResult. Processing order is
      rank_position ASC, which is a total order because submit-to-committee already required
      rank_position to be exactly 1..entry_count with no gaps or duplicates.
    constants: {}
    precision: "integer arithmetic only"
    variants: []

  - name: committee_quorum_resolution
    trigger: "after each POST /rank-lists/{id}/votes ballot is recorded on a COMMITTEE_REVIEW list"
    algorithm: threshold
    formula: |
      eligible_voters = count(FacultyMember where program_id == list.program_id
                                            and is_committee_member == true)
      quorum_threshold = ceil(eligible_voters * COMMITTEE_QUORUM_PCT)

      ballots = CommitteeVote rows where rank_list_id == list.id
                                    and review_round == list.review_round
      approve_count = count(ballots where ballot == APPROVE)
      return_count  = count(ballots where ballot == RETURN)

      # APPROVE is evaluated first; the comparison is inclusive
      if approve_count >= quorum_threshold: list -> APPROVED
      elif return_count >= quorum_threshold: list -> RETURNED
      else: list stays in COMMITTEE_REVIEW
    input_set: >
      Only ballots stamped with the list's CURRENT review_round count. Ballots from an earlier
      round survive as history but are excluded, so a RETURNED-then-reopened list starts its
      next round with an empty effective tally.
    constants:
      COMMITTEE_QUORUM_PCT: 0.60
    precision: "quorum_threshold uses ceil; the threshold comparison is >= (inclusive)"
    variants: []

  - name: pipeline_diversity_report
    trigger: "GET /programs/{id}/pipeline-report"
    algorithm: aggregation
    formula: |
      cohort = Application rows where program_id == this program
                                 and screening_status IN {RECEIVED, UNDER_REVIEW, ADVANCED, REJECTED}
      # WITHDRAWN applications are excluded from every figure in this report.

      cohort_size  = count(cohort)
      advanced_set = cohort where screening_status == ADVANCED
      img_set      = cohort where Applicant.medical_school_type == IMG
      alum_set     = cohort where Applicant.pipeline_program_alum == true

      pct(n) = round_half_up(n / cohort_size * 100, 1) if cohort_size > 0 else 0.0

      advanced_rate      = pct(count(advanced_set))
      img_share          = pct(count(img_set))
      pipeline_alum_share = pct(count(alum_set))

      # Group buckets, label ASC; applicants who declined to report fall in UNREPORTED
      group_label(app) = app.Applicant.self_identified_group or "UNREPORTED"
      group_buckets = [ { group: g, count: n, share: pct(n) }
                        for each distinct g in cohort, ordered by g ASC ]
    input_set: >
      cohort_size == 0 is an expected state, not an error: every rate is 0.0, group_buckets is
      the empty array, and the endpoint still returns 200. No division is performed in that case.
    constants: {}
    precision: "percentages to 1 decimal place, round_half_up; the empty-cohort result is exactly 0.0"
    variants: []

  - name: credential_packet_composition
    trigger: "POST /contracts"
    algorithm: constraint_propagation
    formula: |
      always create CredentialItem(credential_type=STATE_LICENSE, is_mandatory=true)
      always create CredentialItem(credential_type=BLS,           is_mandatory=true)

      # DEA is always created but only gates activation outside pathology
      create CredentialItem(credential_type=DEA,
                            is_mandatory = (program.specialty_code != "PATH"))

      # VISA exists only for applicants who need sponsorship
      if applicant.visa_status IN {NEEDS_J1, NEEDS_H1B}:
          create CredentialItem(credential_type=VISA, is_mandatory=true)

      contract.mandatory_credential_count = count(created items where is_mandatory == true)
      contract.verified_credential_count  = 0
    input_set: >
      applicant is the Applicant of the contract's MatchResult Application; program is that
      Application's Program. A packet therefore holds 3 items (US citizen or permanent
      resident) or 4 items (J-1/H-1B), of which 2, 3 or 4 are mandatory depending on
      specialty_code and visa_status.
    constants: {}
    precision: "integer counts"
    variants: []

  - name: communication_compliance_scan
    trigger: "POST /communication-logs"
    algorithm: projection
    formula: |
      normalized = lowercase(body)
      contains_ranking_intent = any(phrase in normalized for phrase in PROHIBITED_PHRASES)

      pre_match = program.season_phase IN {PRE_SEASON, REVIEW_OPEN, INTERVIEWS_OPEN,
                                          RANKING, LIST_CERTIFIED}

      if contains_ranking_intent and pre_match: compliance_status = FLAGGED
      else:                                    compliance_status = CLEAN

      sent_at = the current logical clock instant
    input_set: >
      The scan is a plain case-insensitive substring test over the whole body against the fixed
      phrase list. The row is always created and returns 201 even when FLAGGED - the flag is an
      audit record, not a rejection. A FLAGGED row is cleared only by an explicit
      ComplianceOfficer review, which moves it to CLEARED.
    constants:
      PROHIBITED_PHRASES:
        - "how will you rank"
        - "rank us"
        - "commit to us"
        - "where will we be on your list"
        - "ranking intent"
    precision: "not applicable"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles declared in the RBAC matrix AND that role is listed on the endpoint being called"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: >
      Every resource referenced in the URL path exists, validated left to right; then every
      foreign key supplied in the request body exists. The error_id names the missing entity
      type.
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: >
      Request body shape: every required field for the endpoint is present, every field has the
      declared type, every enum field holds a declared member, and every numeric field lies
      inside its declared range (including limit 1..100 and offset >= 0 on list endpoints).
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 5
    category: state
    check: >
      The target resource is in a state from which the requested transition is declared in
      §1.2, and the governing Program.season_phase permits the operation. Covers both a wrong
      current state and an already-terminal resource.
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
    note: >
      Scope boundary. This priority evaluates only the state-field admissibility of the
      transition plus the Program.season_phase gate. Where a §1.2 transition precondition
      restates a rule that a later priority in this table owns under its own error_id - the
      invitation and SOAP expiry instants, seat and budget capacity, evaluation counts,
      ownership, conflict of interest, segregation of duties, certification deadline - the
      specific error_id at the later priority is the one reported, and priority 5 does not
      pre-empt it.

  - priority: 6
    category: state
    check: >
      On endpoints that declare an OCC field, the supplied expected_<parent>_version equals the
      parent entity's current version.
    error_id: ERR_STALE_RANK_LIST_VERSION
    http_status: 412
    applies_to: "POST /rank-lists/{id}/entries"
    note: >
      The wave endpoint raises ERR_STALE_WAVE_VERSION under the next row; the two errors are the
      per-parent instantiations of one check, at the same priority.

  - priority: 6
    category: state
    check: >
      The supplied expected_wave_version equals the InterviewWave's current version.
    error_id: ERR_STALE_WAVE_VERSION
    http_status: 412
    applies_to: "POST /interview-waves/{id}/invitations"
    note: >
      Same check as the row above, instantiated on the InterviewWave parent per
      concurrency_rules.invitation-issue-stale-wave.

  - priority: 7
    category: business_safety
    check: >
      Segregation of duties on rank list certification: the acting program director authored no
      ScoreCard for any Application ranked on the list, and cast no CommitteeVote for the list
      in its current review_round.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /rank-lists/{id}/certify"

  - priority: 7
    category: business_safety
    check: >
      Conflict of interest: the acting or targeted FacultyMember does not list the subject
      Applicant.id in conflict_applicant_ids. Applies to review authorship and to interviewer
      assignment onto a slot the applicant is booked into.
    error_id: ERR_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /applications/{id}/reviews, POST /interview-assignments"

  - priority: 7
    category: business_safety
    check: >
      Pre-match communication compliance: the subject Application has no CommunicationLog row
      whose compliance_status == FLAGGED. Unresolved flags block extending a SOAP offer and
      block running the match.
    error_id: ERR_UNRESOLVED_COMMUNICATION_FLAG
    http_status: 422
    applies_to: "POST /soap-offers, POST /programs/{id}/run-match"

  - priority: 8
    category: business_referential
    check: >
      Acting-identity ownership: for an entity_backed role, X-User-ID resolves to the entity
      that owns the target resource - the Applicant of the Application behind an invitation,
      offer, contract or credential item; the FacultyMember behind an assignment's score card;
      the FacultyMember whose program_id matches the target's program.
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all Applicant-acting and FacultyMember-acting endpoints"

  - priority: 8
    category: business_referential
    check: >
      Cross-aggregate coherence: an accepted InterviewSlot belongs to the invitation's own
      wave_id; a ScoreCard's application_id is an application booked into the assignment's
      slot; a RankListEntry's tie_group_anchor_entry_id references an entry on the same
      rank_list_id.
    error_id: ERR_CROSS_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /interview-invitations/{id}/accept, POST /score-cards, POST /rank-lists/{id}/entries"

  - priority: 9
    category: business_temporal
    check: "The invitation has not lapsed: the current logical clock instant < InterviewInvitation.expires_at"
    error_id: ERR_INVITATION_EXPIRED
    http_status: 409
    applies_to: "POST /interview-invitations/{id}/accept"

  - priority: 9
    category: business_temporal
    check: "The SOAP offer has not lapsed: the current logical clock instant < SoapOffer.expires_at"
    error_id: ERR_SOAP_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /soap-offers/{id}/accept, POST /soap-offers/{id}/decline"

  - priority: 9
    category: business_temporal
    check: >
      Interviewer double-booking, HALF-OPEN interval semantics with NO buffer: the assigned
      FacultyMember holds no other ASSIGNED InterviewAssignment whose slot interval
      [start_at, end_at) intersects this slot's [start_at, end_at). Exact adjacency - one slot
      ending at the instant the next begins - does NOT intersect and is permitted.
    error_id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /interview-assignments"

  - priority: 9
    category: business_temporal
    check: >
      Wave window separation, CLOSED interval semantics WITH a mandatory buffer: the new wave's
      closed window [invite_release_at, response_deadline_at] must be separated from every
      existing wave of the same program by at least WAVE_MIN_GAP_HOURS. Formally, the create
      succeeds only when new.invite_release_at >= other.response_deadline_at + 48h OR
      new.response_deadline_at + 48h <= other.invite_release_at. Exact adjacency is REJECTED,
      unlike the interviewer rule.
    error_id: ERR_WAVE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /interview-waves"

  - priority: 9
    category: business_temporal
    check: >
      Slot geometry at creation: end_at is strictly after start_at, and the whole slot interval
      lies inside its wave's closed [invite_release_at, response_deadline_at] window. Slot timing
      thereafter: a slot may be cancelled or rescheduled away from only while the current logical
      clock instant < InterviewSlot.start_at, and completed only once the clock reaches
      InterviewSlot.end_at.
    error_id: ERR_SLOT_TIMING_VIOLATION
    http_status: 409
    applies_to: "POST /interview-slots, POST /interview-slots/{id}/cancel, POST /interview-slots/{id}/complete, POST /interview-invitations/{id}/reschedule"

  - priority: 9
    category: business_temporal
    check: "Rank list certification occurs on or before the certification deadline CERT_DEADLINE_UTC"
    error_id: ERR_CERTIFICATION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /rank-lists/{id}/certify"

  - priority: 10
    category: business_constraint
    check: >
      Uniqueness: Program.nrmp_program_code is unique; Applicant.eras_id is unique;
      InterviewWave.wave_index is unique per program_id; at most one Application per
      (program_id, applicant_id); at most one ApplicationReview per (application_id,
      reviewer_id); at most one InterviewAssignment per (slot_id, faculty_member_id); at most
      one ScoreCard per (assignment_id, application_id); at most one CommitteeVote per
      (rank_list_id, faculty_member_id, review_round); at most one RankListEntry per
      (rank_list_id, application_id); rank_position is unique per rank_list_id; at most one
      non-WITHDRAWN RankList per program_id; at most one Contract per match_result_id.
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "all create endpoints"

  - priority: 10
    category: business_constraint
    check: >
      Screening filters at the ADVANCE decision: Applicant.step2_score >= Program.min_step2_score
      (inclusive), IMG applicants only when Program.img_accepted == true, and sponsorship-needing
      applicants only when Program.visa_sponsorship_allowed == true.
    error_id: ERR_SCREENING_FILTER_FAILED
    http_status: 422
    applies_to: "POST /applications/{id}/screen"

  - priority: 10
    category: business_constraint
    check: >
      Review sufficiency: Application.review_count >= MIN_REVIEWS_TO_SCREEN before a screening
      decision, and every ranked Application carries at least MIN_SCORECARDS_PER_ENTRY ScoreCard
      rows with status IN {SUBMITTED, LOCKED} before the list may go to committee.
    error_id: ERR_INSUFFICIENT_EVALUATIONS
    http_status: 422
    applies_to: "POST /applications/{id}/screen, POST /rank-lists/{id}/submit-to-committee"

  - priority: 10
    category: business_constraint
    check: >
      Rank position contiguity, enforced at both ends: on entry creation rank_position must equal
      RankList.entry_count + 1 exactly, so the list is built append-only; and when the list is
      submitted to committee the set of rank_position values must be exactly 1..entry_count with
      no gaps and no duplicates.
    error_id: ERR_RANK_POSITION_SEQUENCE
    http_status: 422
    applies_to: "POST /rank-lists/{id}/entries, POST /rank-lists/{id}/submit-to-committee"

  - priority: 11
    category: business_fiscal
    check: "The chosen InterviewSlot has a free seat: booked_count < applicant_capacity"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /interview-invitations/{id}/accept"

  - priority: 11
    category: business_fiscal
    check: >
      Wave headroom: an invitation is created ISSUED while
      InterviewWave.issued_count < InterviewWave.seat_capacity. Once issued_count has reached
      seat_capacity the invitation is created WAITLISTED instead - but only while the wave's own
      WAITLISTED count is still below seat_capacity. When both the issued seats and the waitlist
      have reached seat_capacity, no further invitation of any kind may be issued.
    error_id: ERR_WAVE_CAPACITY_REACHED
    http_status: 409
    applies_to: "POST /interview-waves/{id}/invitations"
    note: >
      Reaching seat_capacity does NOT reject the create - it changes the created invitation's
      status to WAITLISTED. This error fires only when the wave is CLOSED or the program is past
      INTERVIEWS_OPEN so no waitlist can absorb the request.

  - priority: 11
    category: business_fiscal
    check: >
      SOAP budget: the count of SoapOffer rows for the program with status IN {OFFERED,
      ACCEPTED} must remain <= calculations.soap_offer_budget after the create.
    error_id: ERR_SOAP_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /soap-offers"

  - priority: 11
    category: business_fiscal
    check: "Rank list length: RankList.entry_count <= Program.quota_positions * RANK_LIST_MAX_MULTIPLE"
    error_id: ERR_RANK_LIST_TOO_LONG
    http_status: 409
    applies_to: "POST /rank-lists/{id}/entries, POST /rank-lists/{id}/submit-to-committee"

  - priority: 11
    category: business_fiscal
    check: "Contract activation requires a complete onboarding packet: Contract.verified_credential_count == Contract.mandatory_credential_count"
    error_id: ERR_CREDENTIALS_INCOMPLETE
    http_status: 409
    applies_to: "POST /contracts/{id}/activate"

  - priority: 11
    category: business_fiscal
    check: "Match capacity: a program may not fill more positions than Program.quota_positions, and a SOAP acceptance requires Program.unfilled_positions >= 1"
    error_id: ERR_NO_POSITIONS_AVAILABLE
    http_status: 409
    applies_to: "POST /soap-offers/{id}/accept"

global_constants:
  MIN_REVIEWS_TO_SCREEN: 2
  MIN_SCORECARDS_PER_ENTRY: 2
  RANK_LIST_MAX_MULTIPLE: 10
  INVITATION_RESPONSE_WINDOW_HOURS: 120
  WAVE_MIN_GAP_HOURS: 48
  SOAP_OFFER_WINDOW_HOURS: 4
  CERT_DEADLINE_UTC: "2027-02-25T21:00:00Z"
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"

endpoints:
  # ---------- Program ----------
  - method: POST
    path: "/programs"
    description: "Register an NRMP participating program"
    roles: [NrmpAdmin]
    code: 201
    input: [name, nrmp_program_code, specialty_code, quota_positions, "visa_sponsorship_allowed?", "soap_participating?", "min_step2_score?", "img_accepted?"]
    output: Program
    side_effects:
      - "creates the Program in season_phase PRE_SEASON with matched_count 0 and unfilled_positions equal to quota_positions"

  - method: GET
    path: "/programs"
    description: "List programs"
    roles: [NrmpAdmin, ProgramCoordinator, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["specialty_code?", "season_phase?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: GET
    path: "/programs/{id}"
    description: "Read one program including its computed counters"
    roles: [NrmpAdmin, ProgramCoordinator, ProgramDirector, ComplianceOfficer, Applicant]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: POST
    path: "/programs/{id}/advance-phase"
    description: "Advance the program's season_phase along a declared Program transition"
    roles: [ProgramCoordinator, NrmpAdmin]
    code: 200
    input: [to_phase]
    output: Program
    side_effects:
      - "applies the matching Program transition's side effects"
      - "increments Program.version by 1"

  - method: POST
    path: "/programs/{id}/run-match"
    description: >
      Run match day for a certified program. Creates one MatchResult per RankListEntry per
      calculations.match_day_assignment and advances the program to MATCH_COMPLETE.
    roles: [NrmpAdmin]
    code: 200
    input: []
    output: Program
    side_effects:
      - "creates MatchResult rows per calculations.match_day_assignment"
      - "sets Program.matched_count and Program.unfilled_positions"
      - "advances Program.season_phase from LIST_CERTIFIED to MATCH_COMPLETE"
      - "increments Program.version by 1"

  - method: GET
    path: "/programs/{id}/pipeline-report"
    description: >
      Diversity and pipeline aggregate for the program per calculations.pipeline_diversity_report.
      Returns 200 with every rate exactly 0.0 and an empty group_buckets array when the cohort is empty.
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: []
    output: { cohort_size: integer, advanced_rate: number, img_share: number, pipeline_alum_share: number, group_buckets: array }
    side_effects: []

  # ---------- Applicant ----------
  - method: POST
    path: "/applicants"
    description: "Register an ERAS applicant in the registry"
    roles: [NrmpAdmin]
    code: 201
    input: [eras_id, full_name, medical_school_type, visa_status, step2_score, "pipeline_program_alum?", "self_identified_group?"]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants"
    description: "List applicants"
    roles: [NrmpAdmin, ProgramCoordinator, ProgramDirector]
    code: 200
    input: ["medical_school_type?", "visa_status?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  - method: GET
    path: "/applicants/{id}"
    description: "Read one applicant"
    roles: [NrmpAdmin, ProgramCoordinator, ProgramDirector, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ---------- Application ----------
  - method: POST
    path: "/applications"
    description: "Record an application of an applicant to a program"
    roles: [ProgramCoordinator, NrmpAdmin]
    code: 201
    input: [program_id, applicant_id]
    output: Application
    side_effects:
      - "creates the Application with screening_status RECEIVED and interview_status NOT_INVITED"

  - method: GET
    path: "/applications"
    description: "List applications, filterable by either foreign key and by either state dimension"
    roles: [ProgramCoordinator, ProgramDirector, Reviewer, Interviewer, CommitteeMember, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: ["program_id?", "applicant_id?", "screening_status?", "interview_status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: GET
    path: "/applications/{id}"
    description: "Read one application including both state dimensions and all three computed scores"
    roles: [ProgramCoordinator, ProgramDirector, Reviewer, Interviewer, CommitteeMember, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{id}/reviews"
    description: "Submit a paper review of the application"
    roles: [Reviewer]
    code: 201
    input: [academic_points, experience_points, holistic_points]
    output: ApplicationReview
    side_effects:
      - "creates the review with reviewer_id taken from the X-User-ID header"
      - "advances Application.screening_status from RECEIVED to UNDER_REVIEW on the first review"
      - "increments Application.review_count by 1"
      - "recomputes Application.provisional_screen_score per calculations.screen_composite_score variant provisional"

  - method: GET
    path: "/application-reviews"
    description: "List application reviews by either foreign key"
    roles: [ProgramCoordinator, ProgramDirector, Reviewer, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: ["application_id?", "reviewer_id?", "limit?", "offset?"]
    output: ApplicationReview[]
    side_effects: []

  - method: GET
    path: "/application-reviews/{id}"
    description: "Read one submitted application review including its three domain point awards"
    roles: [ProgramCoordinator, ProgramDirector, Reviewer, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: []
    output: ApplicationReview
    side_effects: []

  - method: POST
    path: "/applications/{id}/screen"
    description: "Record the screening decision, applying the program's screening filters"
    roles: [ProgramCoordinator]
    code: 200
    input: [decision]
    output: Application
    side_effects:
      - "advances Application.screening_status to ADVANCED or REJECTED"
      - "writes Application.final_screen_score per calculations.screen_composite_score variant final"

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Applicant withdraws the application, cascading to invitations and slot seats"
    roles: [Applicant]
    code: 200
    input: ["withdrawn_reason?"]
    output: Application
    side_effects:
      - "sets screening_status to WITHDRAWN and stores withdrawn_reason"
      - "withdraws every non-terminal InterviewInvitation for the application and releases any booked seat"
      - "sets interview_status to CANCELLED when it was IN {INVITED, SCHEDULED}"
      - "recomputes Program.invited_count"

  # ---------- FacultyMember ----------
  - method: POST
    path: "/faculty-members"
    description: "Register a faculty member and their declared conflicts of interest"
    roles: [ProgramCoordinator, NrmpAdmin]
    code: 201
    input: [program_id, full_name, "is_program_director?", "is_committee_member?", "conflict_applicant_ids?"]
    output: FacultyMember
    side_effects: []

  - method: GET
    path: "/faculty-members"
    description: "List faculty members of a program"
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: ["program_id?", "is_program_director?", "is_committee_member?", "limit?", "offset?"]
    output: FacultyMember[]
    side_effects: []

  - method: GET
    path: "/faculty-members/{id}"
    description: "Read one faculty member including both load variants"
    roles: [ProgramCoordinator, ProgramDirector, Interviewer, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: []
    output: FacultyMember
    side_effects: []

  # ---------- InterviewWave ----------
  - method: POST
    path: "/interview-waves"
    description: >
      Plan an invitation wave. Enforces the closed-interval, 48-hour-buffered separation rule
      against every existing wave of the same program.
    roles: [ProgramCoordinator]
    code: 201
    input: [program_id, wave_index, invite_release_at, response_deadline_at, seat_capacity]
    output: InterviewWave
    side_effects:
      - "creates the wave in status PLANNED with issued_count 0"

  - method: GET
    path: "/interview-waves"
    description: "List invitation waves of a program"
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: InterviewWave[]
    side_effects: []

  - method: GET
    path: "/interview-waves/{id}"
    description: "Read one wave including issued_count and version"
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: []
    output: InterviewWave
    side_effects: []

  - method: POST
    path: "/interview-waves/{id}/release"
    description: "Release the wave so its invitations may be issued and answered"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: InterviewWave
    side_effects:
      - "advances the wave from PLANNED to RELEASED"
      - "increments InterviewWave.version by 1"

  - method: POST
    path: "/interview-waves/{id}/close"
    description: "Close the wave, lapsing every unanswered and waitlisted invitation"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: InterviewWave
    side_effects:
      - "advances the wave from RELEASED to CLOSED"
      - "expires every invitation in the wave whose status IN {ISSUED, WAITLISTED}"
      - "reverts affected Application.interview_status from INVITED to NOT_INVITED"
      - "recomputes InterviewWave.issued_count and Program.invited_count"
      - "increments InterviewWave.version by 1"

  - method: POST
    path: "/interview-waves/{id}/invitations"
    description: >
      Issue an interview invitation to an advanced application. Created ISSUED while the wave
      has seat headroom, or WAITLISTED once issued_count has reached seat_capacity. Guarded by
      optimistic concurrency on the wave's version.
    roles: [ProgramCoordinator]
    code: 201
    input: [application_id, expected_wave_version]
    output: InterviewInvitation
    side_effects:
      - "creates the invitation ISSUED with issued_at and expires_at set, or WAITLISTED with both null"
      - "increments InterviewWave.issued_count by 1 when the invitation is created ISSUED"
      - "advances Application.interview_status from NOT_INVITED to INVITED when the invitation is created ISSUED"
      - "recomputes Program.invited_count"
      - "increments InterviewWave.version by 1"

  # ---------- InterviewSlot ----------
  - method: POST
    path: "/interview-slots"
    description: "Create an interview block inside a wave"
    roles: [ProgramCoordinator]
    code: 201
    input: [wave_id, start_at, end_at, room_label, applicant_capacity]
    output: InterviewSlot
    side_effects:
      - "creates the slot in status OPEN with booked_count 0"

  - method: GET
    path: "/interview-slots"
    description: "List interview slots of a wave"
    roles: [ProgramCoordinator, ProgramDirector, Interviewer, NrmpAdmin, Applicant]
    code: 200
    input: ["wave_id?", "status?", "limit?", "offset?"]
    output: InterviewSlot[]
    side_effects: []

  - method: GET
    path: "/interview-slots/{id}"
    description: "Read one slot including booked_count"
    roles: [ProgramCoordinator, ProgramDirector, Interviewer, NrmpAdmin, Applicant]
    code: 200
    input: []
    output: InterviewSlot
    side_effects: []

  - method: POST
    path: "/interview-slots/{id}/complete"
    description: >
      Mark the interview block as run. Applications listed in no_show_application_ids land in
      NO_SHOW; the rest land in COMPLETED.
    roles: [ProgramCoordinator]
    code: 200
    input: ["no_show_application_ids?"]
    output: InterviewSlot
    side_effects:
      - "advances the slot from OPEN or BOOKED to COMPLETED"
      - "sets each booked Application.interview_status to COMPLETED or NO_SHOW"
      - "recomputes realized_load for every assigned FacultyMember per calculations.interviewer_load_index"

  - method: POST
    path: "/interview-slots/{id}/cancel"
    description: "Cancel the interview block before it starts, releasing seats and panel assignments"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: InterviewSlot
    side_effects:
      - "advances the slot from OPEN or BOOKED to CANCELLED"
      - "withdraws every ACCEPTED invitation on the slot and reverts those applications to NOT_INVITED"
      - "releases every InterviewAssignment on the slot"
      - "recomputes scheduled_load for every affected FacultyMember and Program.invited_count"

  # ---------- InterviewInvitation ----------
  - method: GET
    path: "/interview-invitations"
    description: "List invitations by application, wave, slot or status"
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: ["application_id?", "wave_id?", "slot_id?", "status?", "limit?", "offset?"]
    output: InterviewInvitation[]
    side_effects: []

  - method: GET
    path: "/interview-invitations/{id}"
    description: "Read one invitation including expires_at and the booked slot_id"
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: []
    output: InterviewInvitation
    side_effects: []

  - method: POST
    path: "/interview-invitations/{id}/accept"
    description: "Applicant accepts the invitation and books a specific slot in the same wave"
    roles: [Applicant]
    code: 200
    input: [slot_id]
    output: InterviewInvitation
    side_effects:
      - "advances the invitation from ISSUED to ACCEPTED and stores slot_id and responded_at"
      - "increments InterviewSlot.booked_count by 1 and moves the slot to BOOKED when it fills"
      - "advances Application.interview_status from INVITED to SCHEDULED"

  - method: POST
    path: "/interview-invitations/{id}/decline"
    description: >
      Applicant declines the invitation. Declining an already-accepted invitation releases the
      seat and triggers the four-hop waitlist promotion cascade.
    roles: [Applicant]
    code: 200
    input: []
    output: InterviewInvitation
    side_effects:
      - "advances the invitation to DECLINED and stores responded_at"
      - "releases the booked seat when the invitation was ACCEPTED"
      - "promotes the waitlist winner per calculations.waitlist_promotion_selector"
      - "advances the promoted application's interview_status to INVITED and recomputes Program.invited_count"

  - method: POST
    path: "/interview-invitations/{id}/reschedule"
    description: >
      Applicant returns an accepted invitation to ISSUED to pick a different slot, releasing the
      previously booked seat and restarting the response window.
    roles: [Applicant]
    code: 200
    input: []
    output: InterviewInvitation
    side_effects:
      - "advances the invitation from ACCEPTED back to ISSUED and clears slot_id and responded_at"
      - "decrements the previously booked InterviewSlot.booked_count by 1 and returns that slot to OPEN when it is no longer full"
      - "resets issued_at and expires_at"
      - "reverts Application.interview_status from SCHEDULED to INVITED"

  # ---------- InterviewAssignment ----------
  - method: POST
    path: "/interview-assignments"
    description: >
      Staff an interviewer onto a slot. Enforces the half-open, unbuffered double-booking rule
      and the conflict-of-interest rule.
    roles: [ProgramCoordinator]
    code: 201
    input: [slot_id, faculty_member_id, panel_role]
    output: InterviewAssignment
    side_effects:
      - "creates the assignment in status ASSIGNED"
      - "recomputes FacultyMember.scheduled_load per calculations.interviewer_load_index"

  - method: GET
    path: "/interview-assignments"
    description: "List panel assignments by slot or by interviewer"
    roles: [ProgramCoordinator, ProgramDirector, Interviewer, NrmpAdmin]
    code: 200
    input: ["slot_id?", "faculty_member_id?", "status?", "limit?", "offset?"]
    output: InterviewAssignment[]
    side_effects: []

  - method: GET
    path: "/interview-assignments/{id}"
    description: "Read one panel seat including its panel_role and current status"
    roles: [ProgramCoordinator, ProgramDirector, Interviewer, NrmpAdmin]
    code: 200
    input: []
    output: InterviewAssignment
    side_effects: []

  - method: POST
    path: "/interview-assignments/{id}/release"
    description: "Release an interviewer from a slot"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: InterviewAssignment
    side_effects:
      - "advances the assignment from ASSIGNED to RELEASED"
      - "recomputes FacultyMember.scheduled_load"

  # ---------- ScoreCard ----------
  - method: POST
    path: "/score-cards"
    description: "Open a rubric score card for an interviewed application on one of the author's panel seats"
    roles: [Interviewer]
    code: 201
    input: [assignment_id, application_id, communication_score, clinical_reasoning_score, professionalism_score, teamwork_score]
    output: ScoreCard
    side_effects:
      - "creates the card in status DRAFT with domain_average null"

  - method: GET
    path: "/score-cards"
    description: "List score cards by assignment or by scored application"
    roles: [ProgramCoordinator, ProgramDirector, Interviewer, CommitteeMember, NrmpAdmin]
    code: 200
    input: ["assignment_id?", "application_id?", "status?", "limit?", "offset?"]
    output: ScoreCard[]
    side_effects: []

  - method: GET
    path: "/score-cards/{id}"
    description: "Read one score card including domain_average"
    roles: [ProgramCoordinator, ProgramDirector, Interviewer, CommitteeMember, NrmpAdmin]
    code: 200
    input: []
    output: ScoreCard
    side_effects: []

  - method: POST
    path: "/score-cards/{id}/submit"
    description: "Submit the card, computing its 1-decimal domain average and rolling up the committee score"
    roles: [Interviewer]
    code: 200
    input: []
    output: ScoreCard
    side_effects:
      - "advances the card from DRAFT to SUBMITTED"
      - "writes ScoreCard.domain_average rounded to 1 decimal place"
      - "recomputes Application.committee_score per calculations.committee_rubric_score"

  - method: POST
    path: "/score-cards/{id}/request-amendment"
    description: "Program director sends a submitted card back for revision"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ScoreCard
    side_effects:
      - "advances the card from SUBMITTED to AMEND_REQUESTED"

  - method: POST
    path: "/score-cards/{id}/revise"
    description: "Interviewer rewrites the rubric domains, returning the card to DRAFT"
    roles: [Interviewer]
    code: 200
    input: [communication_score, clinical_reasoning_score, professionalism_score, teamwork_score]
    output: ScoreCard
    side_effects:
      - "advances the card from AMEND_REQUESTED to DRAFT and overwrites the four rubric domains"
      - "clears ScoreCard.domain_average to null"
      - "recomputes Application.committee_score over the remaining SUBMITTED and LOCKED cards"

  # ---------- RankList ----------
  - method: POST
    path: "/rank-lists"
    description: "Open the program's preference list in DRAFT with review_round 0"
    roles: [ProgramDirector]
    code: 201
    input: [program_id]
    output: RankList
    side_effects:
      - "creates the list in status DRAFT with entry_count 0 and review_round 0"

  - method: GET
    path: "/rank-lists"
    description: "List rank lists of a program"
    roles: [ProgramDirector, CommitteeMember, ProgramCoordinator, NrmpAdmin]
    code: 200
    input: ["program_id?", "status?", "certified_by_faculty_id?", "limit?", "offset?"]
    output: RankList[]
    side_effects: []

  - method: GET
    path: "/rank-lists/{id}"
    description: "Read one rank list including entry_count, review_round and version"
    roles: [ProgramDirector, CommitteeMember, ProgramCoordinator, NrmpAdmin]
    code: 200
    input: []
    output: RankList
    side_effects: []

  - method: POST
    path: "/rank-lists/{id}/entries"
    description: >
      Append a ranked application to the list. Guarded by optimistic concurrency on the list's
      version and by the contiguous rank_position sequence rule.
    roles: [ProgramDirector]
    code: 201
    input: [application_id, rank_position, expected_rank_list_version, "tie_group_anchor_entry_id?"]
    output: RankListEntry
    side_effects:
      - "creates the entry"
      - "increments RankList.entry_count by 1"
      - "increments RankList.version by 1"

  - method: GET
    path: "/rank-lists/{id}/entries"
    description: "List the entries of one rank list in rank_position ascending order"
    roles: [ProgramDirector, CommitteeMember, ProgramCoordinator, NrmpAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RankListEntry[]
    side_effects: []

  - method: GET
    path: "/rank-list-entries"
    description: "List rank list entries by ranked application or by tie-group anchor entry"
    roles: [ProgramDirector, CommitteeMember, ProgramCoordinator, NrmpAdmin]
    code: 200
    input: ["application_id?", "tie_group_anchor_entry_id?", "limit?", "offset?"]
    output: RankListEntry[]
    side_effects: []

  - method: GET
    path: "/rank-list-entries/{id}"
    description: "Read one rank list entry including its tie_group_anchor_entry_id pointer"
    roles: [ProgramDirector, CommitteeMember, ProgramCoordinator, NrmpAdmin]
    code: 200
    input: []
    output: RankListEntry
    side_effects: []

  - method: POST
    path: "/rank-lists/{id}/submit-to-committee"
    description: "Move the list into committee deliberation, opening a new ballot round"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: RankList
    side_effects:
      - "advances the list from DRAFT to COMMITTEE_REVIEW"
      - "increments RankList.review_round by 1"
      - "increments RankList.version by 1"

  - method: POST
    path: "/rank-lists/{id}/votes"
    description: >
      Cast one committee ballot for the list's current review_round. The quorum resolution in
      calculations.committee_quorum_resolution runs after every ballot.
    roles: [CommitteeMember]
    code: 201
    input: [faculty_member_id, ballot, "comment?"]
    output: CommitteeVote
    side_effects:
      - "creates the ballot stamped with the list's current review_round"
      - "advances the list to APPROVED and stamps approved_at when the approve tally reaches quorum"
      - "advances the list to RETURNED when the return tally reaches quorum and the approve tally does not"
      - "increments RankList.version by 1"

  - method: GET
    path: "/rank-lists/{id}/votes"
    description: "List every ballot cast on one rank list across all review rounds"
    roles: [ProgramDirector, CommitteeMember, ProgramCoordinator, NrmpAdmin]
    code: 200
    input: ["review_round?", "ballot?", "limit?", "offset?"]
    output: CommitteeVote[]
    side_effects: []

  - method: GET
    path: "/committee-votes"
    description: "List ballots cast by one committee member"
    roles: [ProgramDirector, CommitteeMember, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: ["faculty_member_id?", "rank_list_id?", "limit?", "offset?"]
    output: CommitteeVote[]
    side_effects: []

  - method: GET
    path: "/committee-votes/{id}"
    description: "Read one committee ballot including the review_round it was cast in"
    roles: [ProgramDirector, CommitteeMember, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: []
    output: CommitteeVote
    side_effects: []

  - method: POST
    path: "/rank-lists/{id}/revise"
    description: "Return a RETURNED list to DRAFT so its entries can be reworked"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: RankList
    side_effects:
      - "advances the list from RETURNED to DRAFT"
      - "increments RankList.version by 1"

  - method: POST
    path: "/rank-lists/{id}/certify"
    description: >
      Certify the approved list to the NRMP. Refused after the certification deadline and refused
      when the certifying director also cast a ballot on the winning round.
    roles: [ProgramDirector]
    code: 200
    input: [certified_by_faculty_id]
    output: RankList
    side_effects:
      - "advances the list from APPROVED to CERTIFIED"
      - "locks every SUBMITTED ScoreCard attached to the listed applications"
      - "stamps Program.rank_list_certified_at with the current logical clock instant"
      - "advances Program.season_phase from RANKING to LIST_CERTIFIED"
      - "increments RankList.version by 1"

  - method: POST
    path: "/rank-lists/{id}/withdraw"
    description: "Withdraw a list that was never certified, ending the program's participation"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: RankList
    side_effects:
      - "advances the list from DRAFT or COMMITTEE_REVIEW to WITHDRAWN"
      - "increments RankList.version by 1"

  # ---------- MatchResult ----------
  - method: GET
    path: "/match-results"
    description: "List published match results by program, application or outcome"
    roles: [ProgramDirector, ProgramCoordinator, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: ["program_id?", "application_id?", "outcome?", "limit?", "offset?"]
    output: MatchResult[]
    side_effects: []

  - method: GET
    path: "/match-results/{id}"
    description: "Read one match result including matched_rank_position"
    roles: [ProgramDirector, ProgramCoordinator, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: []
    output: MatchResult
    side_effects: []

  # ---------- SoapOffer ----------
  - method: POST
    path: "/soap-offers"
    description: >
      Extend a SOAP offer for an unfilled position. Requires Program.season_phase == SOAP_ACTIVE,
      Program.soap_participating == true, and an existing MatchResult for this application under
      this program whose outcome is UNMATCHED. The number of live offers a program may hold is
      capped by calculations.soap_offer_budget.
    roles: [ProgramDirector]
    code: 201
    input: [program_id, application_id, soap_round]
    output: SoapOffer
    side_effects:
      - "creates the offer OFFERED with offered_at set and expires_at at offered_at plus SOAP_OFFER_WINDOW_HOURS"

  - method: GET
    path: "/soap-offers"
    description: "List SOAP offers by program, application, round or status"
    roles: [ProgramDirector, ProgramCoordinator, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: ["program_id?", "application_id?", "soap_round?", "status?", "limit?", "offset?"]
    output: SoapOffer[]
    side_effects: []

  - method: GET
    path: "/soap-offers/{id}"
    description: "Read one SOAP offer including expires_at"
    roles: [ProgramDirector, ProgramCoordinator, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: []
    output: SoapOffer
    side_effects: []

  - method: POST
    path: "/soap-offers/{id}/accept"
    description: "Applicant accepts the SOAP offer, consuming one unfilled position"
    roles: [Applicant]
    code: 200
    input: []
    output: SoapOffer
    side_effects:
      - "advances the offer from OFFERED to ACCEPTED"
      - "advances the application's existing MatchResult for this program from UNMATCHED to MATCHED, or creates one with outcome MATCHED when the application was never ranked; matched_rank_position stays null in both cases"
      - "increments Program.matched_count by 1 and decrements Program.unfilled_positions by 1"

  - method: POST
    path: "/soap-offers/{id}/decline"
    description: "Applicant declines the SOAP offer, freeing one unit of offer budget"
    roles: [Applicant]
    code: 200
    input: []
    output: SoapOffer
    side_effects:
      - "advances the offer from OFFERED to DECLINED"

  # ---------- Contract ----------
  - method: POST
    path: "/contracts"
    description: >
      Issue the PGY-1 agreement for a filled position. Creation composes the mandatory credential
      packet per calculations.credential_packet_composition.
    roles: [ProgramCoordinator]
    code: 201
    input: [match_result_id, salary_cents]
    output: Contract
    side_effects:
      - "creates the contract in status ISSUED with issued_at set"
      - "creates one CredentialItem in status PENDING per calculations.credential_packet_composition"
      - "writes Contract.mandatory_credential_count and sets verified_credential_count to 0"

  - method: GET
    path: "/contracts"
    description: "List contracts by match result or status"
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: ["match_result_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: GET
    path: "/contracts/{id}"
    description: "Read one contract including both credential counters"
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/contracts/{id}/sign"
    description: "Applicant signs the issued contract"
    roles: [Applicant]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "advances the contract from ISSUED to SIGNED and stamps signed_at"

  - method: POST
    path: "/contracts/{id}/activate"
    description: >
      Activate the appointment. Refused until every mandatory credential item is VERIFIED.
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "advances the contract from SIGNED to ACTIVE"

  - method: POST
    path: "/contracts/{id}/void"
    description: "Void an issued contract that the applicant never signed"
    roles: [ProgramCoordinator]
    code: 200
    input: [reason]
    output: Contract
    side_effects:
      - "advances the contract from ISSUED to VOID"
      - "sets every CredentialItem on the contract whose status is not VERIFIED to VOIDED"

  - method: POST
    path: "/contracts/{id}/rescind"
    description: >
      Rescind the appointment. This is the compensating action that returns the conserved position
      count to the program and reopens the season for SOAP.
    roles: [ProgramDirector]
    code: 200
    input: [reason]
    output: Contract
    side_effects:
      - "advances the contract from SIGNED or ACTIVE to RESCINDED"
      - "hop 2: because the contract left its filled state, the linked MatchResult.outcome becomes VACATED"
      - "hop 3: because that MatchResult is no longer MATCHED, Program.matched_count decrements by 1 and Program.unfilled_positions increments by 1"
      - "hop 4: because Program.unfilled_positions rose above 0, a Program in SEASON_CLOSED re-opens to SOAP_ACTIVE"
      - "sets every CredentialItem on the contract whose status is not VERIFIED to VOIDED"

  # ---------- CredentialItem ----------
  - method: GET
    path: "/contracts/{id}/credential-items"
    description: "List the onboarding packet of one contract"
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: ["status?", "credential_type?", "limit?", "offset?"]
    output: CredentialItem[]
    side_effects: []

  - method: GET
    path: "/credential-items/{id}"
    description: "Read one credential item including is_mandatory and verified_at"
    roles: [ProgramCoordinator, ProgramDirector, ComplianceOfficer, NrmpAdmin, Applicant]
    code: 200
    input: []
    output: CredentialItem
    side_effects: []

  - method: POST
    path: "/credential-items/{id}/submit"
    description: "Applicant supplies the document reference for one credential item"
    roles: [Applicant]
    code: 200
    input: [reference_number]
    output: CredentialItem
    side_effects:
      - "advances the item from PENDING or REJECTED to SUBMITTED and stores reference_number"

  - method: POST
    path: "/credential-items/{id}/verify"
    description: "Compliance officer accepts the submitted credential, advancing the packet counter"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CredentialItem
    side_effects:
      - "advances the item from SUBMITTED to VERIFIED and stamps verified_at"
      - "increments Contract.verified_credential_count by 1 when the item is mandatory"

  - method: POST
    path: "/credential-items/{id}/reject"
    description: "Compliance officer rejects the submitted credential, allowing one resubmission cycle"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: CredentialItem
    side_effects:
      - "advances the item from SUBMITTED to REJECTED"

  # ---------- CommunicationLog ----------
  - method: POST
    path: "/communication-logs"
    description: >
      Log a pre-match contact with an applicant. The row is always created; the prohibited-content
      scan in calculations.communication_compliance_scan decides whether it lands CLEAN or FLAGGED.
    roles: [ProgramDirector, ProgramCoordinator, Interviewer, CommitteeMember]
    code: 201
    input: [application_id, channel, body, "author_faculty_id?"]
    output: CommunicationLog
    side_effects:
      - "creates the row with contains_ranking_intent and compliance_status set per calculations.communication_compliance_scan"
      - "stamps sent_at with the current logical clock instant"

  - method: GET
    path: "/communication-logs"
    description: "List logged contacts by application, author, channel or compliance status"
    roles: [ProgramDirector, ProgramCoordinator, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: ["application_id?", "author_faculty_id?", "channel?", "compliance_status?", "limit?", "offset?"]
    output: CommunicationLog[]
    side_effects: []

  - method: GET
    path: "/communication-logs/{id}"
    description: "Read one logged contact including the scan verdict"
    roles: [ProgramDirector, ProgramCoordinator, ComplianceOfficer, NrmpAdmin]
    code: 200
    input: []
    output: CommunicationLog
    side_effects: []

  - method: POST
    path: "/communication-logs/{id}/resolve"
    description: >
      Compliance officer adjudicates a flagged contact, clearing the block it places on the
      program's match and SOAP actions.
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: CommunicationLog
    side_effects:
      - "advances compliance_status from FLAGGED to CLEARED"

  # ---------- Logical clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >
      Set the server's logical current UTC instant. Every deadline, expiry and window comparison in
      this API reads this clock rather than the host wall clock. On process startup the clock is
      initialised to 2026-08-01T00:00:00Z; a fresh server that never receives this call behaves as
      though the current instant were 2026-08-01T00:00:00Z.
    roles: [NrmpAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "replaces the server's logical current instant with current_utc"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is absent or empty on any endpoint"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: >
      An entity_backed actor addresses a resource that does not belong to the entity whose id
      the X-User-ID header carries - an Applicant answering another applicant's invitation, an
      Interviewer scoring a panel seat that is not theirs

  # --- existence ---
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path id or an FK field in the body names no existing row"

  # --- shape ---
  - id: ERR_VALIDATION
    http: 422
    condition: >
      A required input field is missing, has the wrong type, names an enum member that does not
      exist, breaks a numeric bound (rubric domains outside 1..10, non-positive
      applicant_capacity, negative salary_cents), or supplies a malformed ISO 8601 instant

  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: >
      The addressed row's current state does not admit the requested transition, or the parent
      Program.season_phase does not permit the operation

  # --- optimistic concurrency ---
  - id: ERR_STALE_RANK_LIST_VERSION
    http: 412
    condition: "expected_rank_list_version does not equal the addressed RankList's current version"
  - id: ERR_STALE_WAVE_VERSION
    http: 412
    condition: "expected_wave_version does not equal the addressed InterviewWave's current version"

  # --- business safety / compliance ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: >
      The acting program director certifying a rank list authored a ScoreCard for an Application
      ranked on that list, or cast a CommitteeVote for the list in its current review_round

  - id: ERR_CONFLICT_OF_INTEREST
    http: 422
    condition: >
      The acting or targeted FacultyMember lists the subject Applicant.id in
      conflict_applicant_ids, so they may not author a review of that applicant's application nor
      take a panel seat on a slot that applicant is booked into

  - id: ERR_UNRESOLVED_COMMUNICATION_FLAG
    http: 422
    condition: >
      The subject Application carries a CommunicationLog row whose compliance_status is FLAGGED,
      which blocks extending a SOAP offer and blocks running the match

  - id: ERR_CROSS_REFERENCE_MISMATCH
    http: 422
    condition: >
      Two referenced rows do not belong to the same aggregate - booking a slot from a different
      wave than the invitation's, scoring an application the assignment's slot never hosted,
      ranking an application from a different program than the list's

  # --- business temporal ---
  - id: ERR_INVITATION_EXPIRED
    http: 409
    condition: "The logical clock has passed InterviewInvitation.expires_at"
  - id: ERR_SOAP_OFFER_EXPIRED
    http: 409
    condition: "The logical clock has passed SoapOffer.expires_at"
  - id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http: 409
    condition: >
      The FacultyMember already holds an ASSIGNED seat on another slot whose half-open interval
      [start_at, end_at) overlaps the target slot's interval; touching endpoints do not overlap
  - id: ERR_WAVE_WINDOW_CONFLICT
    http: 409
    condition: >
      The proposed wave's invite_release_at falls within WAVE_MIN_GAP_HOURS of an existing wave's
      response_deadline_at for the same program, measured on the closed interval
  - id: ERR_SLOT_TIMING_VIOLATION
    http: 409
    condition: >
      On slot creation, the proposed slot does not lie wholly inside its wave's closed
      [invite_release_at, response_deadline_at] window, or end_at is not strictly after start_at.
      On cancel and on reschedule-away, the logical clock is not strictly before
      InterviewSlot.start_at. On complete, the logical clock has not yet reached
      InterviewSlot.end_at
  - id: ERR_CERTIFICATION_DEADLINE_PASSED
    http: 409
    condition: "The logical clock has passed CERT_DEADLINE_UTC when certification is attempted"

  # --- business constraint ---
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: >
      One of the uniqueness keys enumerated in the priority-10 uniqueness validation already
      exists - for example a second Application for the same (program_id, applicant_id), a second
      ballot by the same faculty member in the same review_round, a second non-WITHDRAWN RankList
      for the same program, or a duplicate rank_position within one list
  - id: ERR_SCREENING_FILTER_FAILED
    http: 422
    condition: >
      At the ADVANCE decision the application does not clear the program's declared screening
      filters - Applicant.step2_score below Program.min_step2_score, an IMG applicant where
      img_accepted is false, or a sponsorship-needing applicant where visa_sponsorship_allowed is
      false
  - id: ERR_INSUFFICIENT_EVALUATIONS
    http: 422
    condition: >
      Fewer than MIN_REVIEWS_TO_SCREEN submitted reviews exist to screen an application, or fewer
      than MIN_SCORECARDS_PER_ENTRY submitted score cards exist for an application being ranked
  - id: ERR_RANK_POSITION_SEQUENCE
    http: 422
    condition: >
      On entry creation, rank_position is not exactly RankList.entry_count + 1; or, when the list
      is submitted to committee, the set of rank_position values on the list is not exactly
      1..entry_count. Either way the list's preference order would contain a gap or a repeat

  # --- business fiscal / capacity ---
  - id: ERR_SLOT_FULL
    http: 409
    condition: "InterviewSlot.booked_count already equals applicant_capacity"
  - id: ERR_WAVE_CAPACITY_REACHED
    http: 409
    condition: >
      The wave's seat_capacity is already consumed and the waitlist itself has reached
      seat_capacity, so no further invitation of any kind may be issued
  - id: ERR_SOAP_BUDGET_EXCEEDED
    http: 409
    condition: >
      The program already holds as many SoapOffer rows with status IN {OFFERED, ACCEPTED} as
      calculations.soap_offer_budget permits
  - id: ERR_RANK_LIST_TOO_LONG
    http: 409
    condition: >
      The list would exceed quota_positions multiplied by RANK_LIST_MAX_MULTIPLE entries
  - id: ERR_CREDENTIALS_INCOMPLETE
    http: 409
    condition: >
      Contract.verified_credential_count is below mandatory_credential_count when activation is
      attempted
  - id: ERR_NO_POSITIONS_AVAILABLE
    http: 409
    condition: >
      Program.unfilled_positions is 0, so a SOAP acceptance may not fill a further position.
      Match day never raises this error: calculations.match_day_assignment stops promoting entries
      once quota_positions is reached and marks the remainder UNMATCHED

# =============================================================================
# 1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: ProgramDirector
    description: >
      Owns the program's preference order and its irreversible commitments - rank list creation,
      entry ordering, certification, SOAP offers, contract rescission. Acts as a FacultyMember,
      so the segregation-of-duties rules bind them personally.
    identity: "entity_backed:FacultyMember"
    exclusive_operations:
      - "POST /rank-lists"
      - "POST /rank-lists/{id}/entries"
      - "POST /rank-lists/{id}/submit-to-committee"
      - "POST /rank-lists/{id}/revise"
      - "POST /rank-lists/{id}/certify"
      - "POST /rank-lists/{id}/withdraw"
      - "POST /soap-offers"
      - "POST /contracts/{id}/rescind"
      - "POST /score-cards/{id}/request-amendment"
    shared_operations:
      - "GET /programs, GET /programs/{id}, GET /programs/{id}/pipeline-report"
      - "GET /applications, GET /applications/{id}, GET /application-reviews"
      - "GET /faculty-members, GET /faculty-members/{id}"
      - "GET /interview-waves, GET /interview-waves/{id}"
