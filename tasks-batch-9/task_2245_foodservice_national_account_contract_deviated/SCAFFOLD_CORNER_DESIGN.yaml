  # ===========================================================================
  # Section: Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: Cross-Cutting Complexity Layers
    instances:
      - claim_type: optimistic_concurrency
        name: stale_expected_contract_version_is_refused_with_412
        grounds:
          - concurrency_rules
          - validations[priority=8]
          - errors.ERR_STALE_CONTRACT_VERSION
          - entities.Contract.fields.version
        distinguishing_aspect: |
          The OCC token is the parent Contract.version, and it moves on writes the client
          never made: a suspend plus a reinstate advance it by two, the deviation create
          replaying the pre-suspension token gets 412, and the retry with the re-read
          token succeeds.
        test_recipe:
          setup:
            - "An ACTIVE contract with a PROTEIN tier, a coverage and one product; its version captured after every write."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000 }
              as: SystemAdmin
              captures: { chkn_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id, ver_created: $.data.version }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 25.00, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
              captures: { ver_submitted: $.data.version }
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ver_signed: $.data.version }
          trigger:
            - call: "POST /nac/contracts/${ct_id}/suspend"
              payload: { note: "Credit review" }
              as: NationalAccountManager
              captures: { ver_susp: $.data.version }
            - call: "POST /nac/contracts/${ct_id}/reinstate"
              payload: {}
              as: NationalAccountManager
              captures: { ver_reinstated: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 4200, max_operator_price_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ver_signed}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { e_stale: $.data.error_id }
            - call: "GET /nac/contracts/${ct_id}"
              payload: {}
              as: PricingAnalyst
              captures: { ver_read: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 4200, max_operator_price_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ver_read}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev_id: $.data.id, dev_ver: $.data.version }
          assert:
            - "${ver_created} == 1, ${ver_submitted} == 2 and ${ver_signed} == 3: every write increments version by exactly 1"
            - "${ver_susp} == 4 and ${ver_reinstated} == 5, moved by writes the deviation client never made"
            - "${e_stale} == ERR_STALE_CONTRACT_VERSION with HTTP 412 for the replayed token ${ver_signed}"
            - "${ver_read} == 5 and the retry succeeds with ${dev_ver} == 1 on the new agreement"
            - "GET /nac/deviation-agreements?contract_id=${ct_id} returns exactly 1 row, so the 412 wrote nothing"

      - claim_type: optimistic_concurrency
        name: stale_expected_deviation_version_is_refused_with_412
        grounds:
          - concurrency_rules
          - validations[priority=9]
          - errors.ERR_STALE_DEVIATION_VERSION
          - entities.DeviationAgreement.fields.version
        distinguishing_aspect: |
          The claim endpoint's OCC token is DeviationAgreement.version, and activation
          moves it: a claim replaying the version read at manufacturer-decision time gets
          412, while the same payload with the post-activation version is accepted.
        test_recipe:
          setup:
            - "An ACTIVE contract with a PROTEIN tier and coverage, an OPEN August period, and a deviation walked DRAFT -> SUBMITTED -> MANUFACTURER_APPROVED -> ACTIVE with the version captured at every hop."
            - "One 10-case line invoiced on 2026-08-05 so a claim would sweep 8000."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000 }
              as: SystemAdmin
              captures: { chkn_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 25.00, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ct_ver: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 4200, max_operator_price_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev_id: $.data.id, dv1: $.data.version }
            - call: "POST /nac/deviation-agreements/${dev_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dv2: $.data.version }
            - call: "POST /nac/deviation-agreements/${dev_id}/manufacturer-decision"
              payload: { decision: "APPROVE" }
              as: ManufacturerRep
              as_user_id: "${mfg_id}"
              captures: { dv3: $.data.version }
            - call: "POST /nac/deviation-agreements/${dev_id}/activate"
              payload: {}
              as: NationalAccountManager
              as_user_id: "nam-1"
              captures: { dv4: $.data.version }
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", distribution_center_id: "${dc_id}", quantity_cases: 10 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { line_id: $.data.id }
            - call: "POST /nac/order-lines/${line_id}/invoice"
              payload: {}
              as: NationalAccountManager
          trigger:
            - call: "POST /nac/bill-back-claims"
              payload: { deviation_agreement_id: "${dev_id}", claim_period_start: "2026-08-01T00:00:00Z", claim_period_end: "2026-09-01T00:00:00Z", expected_deviation_agreement_version: "${dv3}" }
              as: RebateAccountant
              as_user_id: "acct-1"
              captures: { e_stale: $.data.error_id }
            - call: "POST /nac/bill-back-claims"
              payload: { deviation_agreement_id: "${dev_id}", claim_period_start: "2026-08-01T00:00:00Z", claim_period_end: "2026-09-01T00:00:00Z", expected_deviation_agreement_version: "${dv4}" }
              as: RebateAccountant
              as_user_id: "acct-1"
              captures: { k_id: $.data.id, k_amount: $.data.claimed_amount_cents, k_status: $.data.status }
          assert:
            - "${dv1} == 1, ${dv2} == 2, ${dv3} == 3 and ${dv4} == 4, one increment per write"
            - "${e_stale} == ERR_STALE_DEVIATION_VERSION with HTTP 412 for the pre-activation token ${dv3}"
            - "${k_amount} == 8000 and ${k_status} == ACCRUED with the current token ${dv4}"
            - "OrderLine.${line_id}.billback_status == CLAIMED and GET /nac/bill-back-claims?deviation_agreement_id=${dev_id} returns exactly 1 row"

      - claim_type: cascading_side_effects
        name: multi_level_side_effect_chain_verified_end_to_end
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.PricingDispute.UPHELD_to_CREDIT_ISSUED
        excluded_because:
          difficulty_instance: dispute_credit_cascade_line_period_contract_manufacturer
          rationale: |
            That §1.8 instance follows one issue-credit call through all four hops - line
            rewrite, period reopen, contract payable, manufacturer funding payable - and
            asserts every intermediate value, including the ordering-sensitive reopen.

      - claim_type: dual_variant_calculation
