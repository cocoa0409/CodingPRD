              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 20 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { err_complete: "$.data.error_id" }
            - call: "POST /ocs/equipment-placements/${plc1_id}/retrieve"
              payload: { retrieved_asset_condition: "SERVICEABLE" }
              as: AccountManager
              captures: { err_retr: "$.data.error_id" }
            - call: "POST /ocs/equipment-placements/${plc1_id}/evaluate-compliance"
              payload: {}
              as: BillingSpecialist
              captures: { err_eval: "$.data.error_id" }
            - call: "POST /ocs/equipment-placements/${plc2_id}/retrieve"
              payload: { retrieved_asset_condition: "SERVICEABLE" }
              as: AccountManager
          assert:
            - "the new-site attempt is HTTP 409 with data.error_id == ERR_ACCOUNT_NOT_OPERATING"
            - "the scheduling attempt is HTTP 409 with data.error_id == ERR_ACCOUNT_NOT_OPERATING, NOT ERR_SITE_NOT_SERVICEABLE, because rule 11 is evaluated before rule 12 and both are violated"
            - "the completion attempt is HTTP 409 with data.error_id == ERR_SITE_NOT_SERVICEABLE, NOT ERR_VISIT_STATE_INVALID: rule 11 does not list /complete, so the site gate (12) is the first applicable rule even though the visit is CANCELLED (15)"
            - "the retrieve on the SUPERSEDED placement is HTTP 409 with data.error_id == ERR_PLACEMENT_STATE_INVALID (only RETRIEVAL_SCHEDULED and UNRETURNED_BILLED are retrievable)"
            - "the evaluate-compliance on the SUPERSEDED placement is HTTP 409 with data.error_id == ERR_PLACEMENT_STATE_INVALID (only ACTIVE and RETRIEVAL_SCHEDULED are evaluable)"
            - "the retrieve on placement 2 is 2xx and, being the last non-terminal placement, drives Account.${acct_id}.program_posture to CLOSED and Site.${site_id}.service_posture to CLOSED"
            - "none of the five rejections mutated anything: ServiceVisit.${visit_id}.visit_status is still CANCELLED and EquipmentPlacement.${plc1_id}.placement_status is still SUPERSEDED"

      - name: corner_conditionally_required_transition_fields_are_enforced_per_target_state
