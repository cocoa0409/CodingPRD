            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${reporter_id}", verdict: "RESPONSIBLE", severity_recommendation: 3 }
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { err_vote_coi: $.data.error_id }
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan1_id}", verdict: "RESPONSIBLE" }
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { err_rec_required: $.data.error_id }
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan1_id}", verdict: "ABSTAIN", severity_recommendation: 5 }
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { err_rec_not_allowed: $.data.error_id }
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan1_id}", verdict: "RESPONSIBLE", severity_recommendation: 3 }
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { vote_1_id: $.data.id }
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan2_id}", verdict: "RESPONSIBLE", severity_recommendation: 3 }
