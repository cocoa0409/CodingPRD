  # ===========================================================================
  - section: rbac
    instances:
      - name: notary_cannot_commission_returns_unauthorized
        claim_type: rbac_denied
        grounds:
          - roles
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "POST /notaries/{id}/commission is CommissionAuthority-exclusive; a Notary actor is rejected ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["An APPLIED notary and a separate ACTIVE notary acting as the caller"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Caller N", email: "caller@x.com" }
              as: Anonymous
              captures: { caller: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${caller}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { cbond: $.data.id }
            - call: "POST /bonds/${cbond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${caller}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${caller}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Target N", email: "target@x.com" }
              as: Anonymous
              captures: { target: $.data.id }
          trigger:
            - call: "POST /notaries/${target}/commission"
