# =============================================================================
# task_2461 — Challenge Course & Outdoor Education Facilitation
# Scaffold seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2461. Challenge Course & Outdoor Education Facilitation (challenge course operator): course inspection cycles with professional inspection, operational inspection logs and element retirement criteria, facilitator training, certification levels and supervision ratios by element type, participant screening with health forms, weight limits and participation agreements, program design with sequencing from icebreakers through high elements and debrief practices, belay system management including equipment life tracking, retirement dates and rescue readiness, weather and lightning protocols with course closure thresholds, incident reporting, rescue drills and emergency medical access planning, group booking with pricing, cancellation and chaperone requirements

domain_name: challenge-course-ops
api_prefix: /challenge-course

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is addressed as a top-level collection under the api_prefix and
  # linked by explicit foreign keys (`/elements`, `/bookings`, `/participants`,
  # `/program-blocks`, ...). No entity id appears as an ancestor path segment of
  # another entity's create endpoint; parents are named in the request body.

  state_machine_shape: cyclic
  # Element (SERVICEABLE <-> RESTRICTED, OUT_OF_SERVICE -> SERVICEABLE),
  # Facilitator (ACTIVE <-> PROBATION, ACTIVE -> LAPSED -> ACTIVE) and
  # Booking.status (CONFIRMED <-> WEATHER_HOLD, CONFIRMED <-> AT_RISK) all loop.
  # ProfessionalInspection is a fork-join diamond
  # (DRAFT -> {FILED_PASS | FILED_CONDITIONAL | FILED_FAIL} -> DISPOSED) and
  # Booking carries two independent state dimensions (`status` x `roster_status`).

  relationship_patterns:
    - one_to_many          # Course -> Element, Booking -> Participant, Booking -> ProgramBlock
    - many_to_many         # ProgramBlock <-> Facilitator via BlockAssignment
    - cross_aggregate      # ProgramBlock.element_id crosses the booking aggregate into the course aggregate

  role_model: segregation_of_duties
  # The Facilitator who filed the defect log may not return the element to
  # service; the inspector who filed a professional inspection may not dispose
  # it; the Facilitator who reported an incident may not close it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the §0.4 Expert band (14 entities / 54 endpoints / 51 error
  # codes) because the requested scenario spans ten regulated sub-domains that
  # each contribute a gate to the same two hot paths
  # (POST /program-blocks/{id}/start and POST /bookings/{id}/confirm).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
#
# common_fields: true  -> the entity carries id (server-minted UUID),
#   created_at, updated_at (ISO8601 UTC, server-stamped) and version (integer,
#   1 on creation, +1 on every mutating write to that row).
# common_fields: false -> immutable append-only record: id and created_at only,
#   no updated_at, no version, and no update or delete endpoint.
# Client-supplied values for any of these fields are ignored, never rejected.
# =============================================================================
entities:
  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: course_name, type: string, source: input, description: "Operator-facing name of the challenge course site" }
      - { name: ems_response_minutes, type: integer, source: input, description: "Documented ground-ambulance response time to the course trailhead", constraints: "1..240" }
      - { name: ems_access_note, type: string, source: input, description: "Emergency medical access plan narrative (staging point, gate code)" }
      - { name: posture, type: enum, source: computed, default: "OPEN", description: "OPEN | RESTRICTED | CLOSED — derived gate over all child operations; see calculations.course_posture. Initialised to OPEN at course creation and recomputed only by the writes listed in that calculation's trigger; creating or certifying a facilitator does NOT recompute it, so a brand-new unstaffed course reads OPEN until its first weather observation, element/equipment/incident transition or daily-open checkpoint" }
      - { name: posture_reason, type: enum, source: computed, default: "NONE", description: "NONE | LIGHTNING_STOP | WIND_STOP | COLD_STOP | INSPECTION_OVERDUE | RESCUE_READINESS | SERIOUS_INCIDENT | ELEMENT_RESTRICTED | LIGHTNING_WATCH | WIND_WATCH — first matching clause of calculations.course_posture" }
      - { name: lightning_hold_until, type: datetime, source: system, default: null, description: "UTC instant until which all element work is stopped after a close lightning strike" }
      - { name: latest_wind_speed_kph, type: number, source: computed, default: 0, description: "wind_speed_kph of the newest WeatherObservation for this course (observed_at DESC, created_at DESC tie-break)" }
      - { name: latest_air_temp_c, type: number, source: computed, default: 20, description: "air_temp_c of the newest WeatherObservation for this course (observed_at DESC, created_at DESC tie-break)" }
      - { name: latest_lightning_distance_km, type: number, source: computed, default: null, description: "lightning_distance_km of the newest WeatherObservation for this course (observed_at DESC, created_at DESC tie-break); null when no observation has ever reported a strike. Read by clause 8 of calculations.course_posture" }
      - { name: latest_observation_at, type: datetime, source: computed, default: null, description: "observed_at of the newest WeatherObservation for this course" }
      - { name: restricted_element_count, type: integer, source: computed, default: 0, description: "count(Element WHERE course_id == this.id AND status == RESTRICTED)" }
      - { name: out_of_service_element_count, type: integer, source: computed, default: 0, description: "count(Element WHERE course_id == this.id AND status == OUT_OF_SERVICE)" }
      - { name: quarantined_equipment_count, type: integer, source: computed, default: 0, description: "count(BelayEquipment WHERE course_id == this.id AND status == QUARANTINED)" }
      - { name: rescue_ready_facilitator_count, type: integer, source: computed, default: 0, description: "count(Facilitator WHERE course_id == this.id AND cert_status == ACTIVE); an ACTIVE cert_status already implies a rescue drill within RESCUE_DRILL_VALID_DAYS" }
      - { name: rescue_readiness_ok, type: boolean, source: computed, default: false, description: "= rescue_ready_facilitator_count >= 2 (RESCUE_READY_MINIMUM) AND ems_response_minutes <= 30 (EMS_MAX_MINUTES); see calculations.course_posture" }
      - { name: next_professional_inspection_due_on, type: datetime, source: computed, default: null, description: "min(Element.next_professional_inspection_due_on) over Elements of this course with status != RETIRED; null when no such element exists" }
      - { name: at_risk_booking_count, type: integer, source: computed, default: 0, description: "count(Booking WHERE course_id == this.id AND status IN {AT_RISK, WEATHER_HOLD})" }
      - { name: daily_open_index, type: integer, source: system, default: 0, description: "Monotone counter incremented once per POST /courses/{course_id}/daily-open" }
      - { name: last_daily_open_date, type: datetime, source: system, default: null, description: "UTC calendar date of the most recent daily-open checkpoint" }

  - name: Element
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; owning course site" }
      - { name: element_name, type: string, source: input, description: "Element label, unique per course (case-sensitive)" }
      - { name: element_type, type: enum, source: input, description: "GROUND_INITIATIVE | LOW_ELEMENT | HIGH_ELEMENT | CLIMBING_WALL | ZIP_LINE" }
      - { name: installed_on, type: datetime, source: input, description: "UTC calendar date the element was commissioned" }
      - { name: design_life_years, type: integer, source: computed, description: "Manufacturer design life in whole years, stamped at creation from calculations.element_retirement_forecast constant DESIGN_LIFE_YEARS[element_type]; never client-supplied", constraints: "1..40" }
      - { name: cycle_life_limit, type: integer, source: computed, description: "Participant-cycle count at which the element must be retired, stamped at creation from calculations.element_retirement_forecast constant DESIGN_CYCLE_LIMIT[element_type]; never client-supplied", constraints: ">= 1" }
      - { name: cumulative_cycle_count, type: integer, source: computed, default: 0, description: "Seeded from POST input initial_cycle_count, then += ProgramBlock.actual_head_count on every element-bearing block completion" }
      - { name: calendar_life_forecast_date, type: datetime, source: computed, description: "= installed_on + design_life_years years (Feb-29 anniversaries clamp to Feb-28)" }
      - { name: usage_life_forecast_date, type: datetime, source: computed, default: null, description: "Projected exhaustion date from observed cycle rate; null when cumulative_cycle_count == 0; see calculations.element_retirement_forecast" }
      - { name: retirement_forecast_date, type: datetime, source: computed, description: "= min(calendar_life_forecast_date, usage_life_forecast_date) ignoring nulls" }
      - { name: retirement_basis, type: enum, source: computed, default: "CALENDAR", description: "CALENDAR | USAGE — which variant produced retirement_forecast_date (ties resolve to CALENDAR)" }
      - { name: min_participant_weight_kg, type: number, source: input, description: "Inclusive lower participant weight bound for this element" }
      - { name: max_participant_weight_kg, type: number, source: input, description: "Inclusive upper participant weight bound for this element" }
      - { name: next_professional_inspection_due_on, type: datetime, source: input, description: "UTC date the next annual professional inspection is due; advanced by 12 months on a disposed PASS" }
      - { name: latest_inspection_outcome, type: enum, source: computed, default: "NONE", description: "NONE | PASS | CONDITIONAL | FAIL — outcome of the newest DISPOSED ProfessionalInspection for this element (performed_on DESC, created_at DESC tie-break)" }
      - { name: consecutive_conditional_count, type: integer, source: computed, default: 0, description: "Number of DISPOSED CONDITIONAL inspections since the last DISPOSED PASS; reset to 0 by a disposed PASS" }
      - { name: required_belay_set_count, type: integer, source: computed, description: "REQUIRED_BELAY_SETS_BY_TYPE[element_type] — 0 for GROUND_INITIATIVE/LOW_ELEMENT, 2 for HIGH_ELEMENT/CLIMBING_WALL, 3 for ZIP_LINE" }
      - { name: belay_ready, type: boolean, source: computed, default: false, description: "See calculations.belay_system_readiness — always true when required_belay_set_count == 0" }
      - { name: last_clear_log_date, type: datetime, source: computed, default: null, description: "log_date of the newest OperationalInspectionLog for this element with result == CLEAR (log_date DESC, created_at DESC tie-break)" }
      - { name: status, type: enum, source: system, default: "SERVICEABLE", description: "SERVICEABLE | RESTRICTED | OUT_OF_SERVICE | RETIRED" }
      - { name: restricting_log_id, type: string, source: system, default: null, description: "FK -> OperationalInspectionLog.id; the DEFECT_MAJOR log that drove status to RESTRICTED, cleared on return-to-service" }

  - name: Facilitator
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; the course this person is rostered to" }
      - { name: full_name, type: string, source: input, description: "Facilitator legal name" }
      - { name: staff_type, type: enum, source: input, description: "STAFF_FACILITATOR | CONTRACT_INSPECTOR | SAFETY_OFFICER — pins which X-User-Role this record may act as" }
      - { name: certification_level, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3 (ordered; LEVEL_3 is highest)" }
      - { name: is_operator_employee, type: boolean, source: input, default: true, description: "false only for third-party contractors; professional inspections require false" }
      - { name: cert_expires_on, type: datetime, source: input, description: "UTC date the practitioner certification lapses" }
      - { name: refresher_hours_24mo, type: number, source: computed, default: 0, description: "sum(TrainingRecord.hours WHERE facilitator_id == this.id AND kind IN {REFRESHER, RECERTIFICATION} AND completed_on >= clock_date - 730 days)" }
      - { name: rescue_drill_last_passed_on, type: datetime, source: computed, default: null, description: "max(TrainingRecord.completed_on WHERE facilitator_id == this.id AND kind == RESCUE_DRILL)" }
      - { name: cert_status, type: enum, source: computed, default: "PROBATION", description: "ACTIVE | PROBATION | LAPSED — see calculations.facilitator_cert_status" }
      - { name: supervision_capacity, type: integer, source: computed, description: "SUPERVISION_CAPACITY_BY_LEVEL[certification_level] — LEVEL_1 8, LEVEL_2 12, LEVEL_3 16" }

  - name: TrainingRecord
    parent: null
    common_fields: false
    fields:
      - { name: facilitator_id, type: string, source: input, description: "FK -> Facilitator.id; subject of the training event" }
      - { name: kind, type: enum, source: input, description: "INITIAL | REFRESHER | RESCUE_DRILL | RECERTIFICATION" }
      - { name: hours, type: number, source: input, description: "Contact hours credited by this record", constraints: ">= 0" }
      - { name: completed_on, type: datetime, source: input, description: "UTC calendar date the training was completed; must not be after the logical clock date" }
      - { name: notes, type: string, source: input, default: "", description: "Free-text trainer note" }

  - name: ProfessionalInspection
    parent: null
    common_fields: true
    fields:
      - { name: element_id, type: string, source: input, description: "FK -> Element.id; element under inspection" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Facilitator.id; the CONTRACT_INSPECTOR performing the inspection" }
      - { name: performed_on, type: datetime, source: input, description: "UTC calendar date of the on-site inspection" }
      - { name: findings_note, type: string, source: input, default: "", description: "Inspector narrative captured at filing" }
      - { name: outcome, type: enum, source: system, default: "NONE", description: "NONE | PASS | CONDITIONAL | FAIL — set by the file action, immutable afterwards" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FILED_PASS | FILED_CONDITIONAL | FILED_FAIL | DISPOSED" }
      - { name: disposition_note, type: string, source: system, default: "", description: "SafetyOfficer note recorded at disposal" }
      - { name: disposed_on, type: datetime, source: system, default: null, description: "Logical-clock instant of disposal" }

  - name: OperationalInspectionLog
    parent: null
    common_fields: false
    fields:
      - { name: element_id, type: string, source: input, description: "FK -> Element.id; element checked" }
      - { name: facilitator_id, type: string, source: input, description: "FK -> Facilitator.id; the acting Facilitator (must equal X-User-ID)" }
      - { name: log_date, type: datetime, source: input, description: "UTC calendar date on which the pre-use inspection was performed; callers supply the current logical-clock date, and validations priority 12 only ever honours a log whose log_date equals the clock date" }
      - { name: result, type: enum, source: input, description: "CLEAR | DEFECT_MINOR | DEFECT_MAJOR" }
      - { name: defect_note, type: string, source: input, default: "", description: "Required non-empty when result != CLEAR" }
      - { name: caused_restriction, type: boolean, source: computed, default: false, description: "true when this log drove the element from SERVICEABLE to RESTRICTED" }

  - name: GroupClient
    parent: null
    common_fields: true
    fields:
      - { name: client_name, type: string, source: input, description: "Booking organisation name" }
      - { name: org_type, type: enum, source: input, description: "SCHOOL | CORPORATE | NONPROFIT | YOUTH_GROUP" }
      - { name: tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | PARTNER | ANCHOR — drives TIER_DISCOUNT_PCT" }
      - { name: payments_received_cents, type: integer, source: computed, default: 0, description: "Sum of all amount_cents recorded via POST /group-clients/{group_client_id}/payments" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Unallocated client funds; = payments_received_cents - sum(Booking.deposit_allocated_cents) - sum(Booking.retained_cents) over this client's bookings" }
      - { name: late_cancellation_count, type: integer, source: computed, default: 0, description: "count(Booking WHERE group_client_id == this.id AND status == CANCELLED AND cancellation_variant == CLIENT_INITIATED AND notice_days_at_cancel < 14)" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; site being booked" }
      - { name: group_client_id, type: string, source: input, description: "FK -> GroupClient.id; paying organisation" }
      - { name: program_date, type: datetime, source: input, description: "UTC calendar date of delivery; must be >= clock_date + MIN_LEAD_DAYS at creation" }
      - { name: expected_participant_count, type: integer, source: input, description: "Client-declared headcount, informational only (never used in pricing)", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | QUOTED | CONFIRMED | AT_RISK | WEATHER_HOLD | DELIVERED | CANCELLED" }
      - { name: roster_status, type: enum, source: computed, default: "INCOMPLETE", description: "INCOMPLETE | BLOCKED | READY — independent second state dimension; see calculations.booking_roster_status" }
      - { name: billable_head_count, type: integer, source: computed, default: 0, description: "count(Participant WHERE booking_id == this.id AND is_chaperone == false), frozen into the quote at each quote run" }
      - { name: required_chaperone_count, type: integer, source: computed, default: 0, description: "ceil(minor_participant_count / CHAPERONE_RATIO) where minor_participant_count = count(Participant WHERE booking_id == this.id AND is_chaperone == false AND is_minor == true)" }
      - { name: raw_subtotal_cents, type: integer, source: computed, default: 0, description: "Per-line-rounded discounted block subtotal; see calculations.booking_quote_subtotal" }
      - { name: high_element_surcharge_cents, type: integer, source: computed, default: 0, description: "Risk surcharge whose tier is keyed on raw_subtotal_cents; see calculations.booking_high_element_surcharge" }
      - { name: quoted_total_cents, type: integer, source: computed, default: 0, description: "= raw_subtotal_cents + high_element_surcharge_cents" }
      - { name: deposit_required_cents, type: integer, source: computed, default: 0, description: "= round_half_up(quoted_total_cents * DEPOSIT_PCT)" }
      - { name: deposit_allocated_cents, type: integer, source: computed, default: 0, description: "Client funds currently held against this booking; set at confirm, released to 0 at cancel" }
      - { name: cancellation_fee_cents, type: integer, source: computed, default: 0, description: "Fee assessed by calculations.booking_cancellation_settlement" }
      - { name: retained_cents, type: integer, source: computed, default: 0, description: "Portion of the held deposit permanently kept by the operator (= cancellation_fee_cents once cancelled)" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "= deposit_allocated_cents_at_cancel - retained_cents, returned to GroupClient.credit_balance_cents" }
      - { name: cancellation_variant, type: enum, source: computed, default: "NONE", description: "NONE | CLIENT_INITIATED | OPERATOR_WEATHER_INITIATED — which settlement variant ran" }
      - { name: notice_days_at_cancel, type: integer, source: computed, default: null, description: "= (program_date - clock_date).days at the moment of cancellation" }
      - { name: quote_index, type: integer, source: system, default: 0, description: "Monotone counter incremented on every successful quote run" }
      - { name: block_count, type: integer, source: computed, default: 0, description: "count(ProgramBlock WHERE booking_id == this.id)" }
      - { name: blocked_block_count, type: integer, source: computed, default: 0, description: "count(ProgramBlock WHERE booking_id == this.id AND status == BLOCKED_UNSAFE)" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; roster this person belongs to" }
      - { name: full_name, type: string, source: input, description: "Participant legal name" }
      - { name: birth_date, type: datetime, source: input, description: "UTC calendar date of birth" }
      - { name: weight_kg, type: number, source: input, description: "Declared weight in kilograms", constraints: "> 0" }
      - { name: is_chaperone, type: boolean, source: input, default: false, description: "true for accompanying adults who supervise but are never billed" }
      - { name: age_years, type: integer, source: computed, description: "Whole years old on Booking.program_date" }
      - { name: is_minor, type: boolean, source: computed, description: "= age_years < ADULT_AGE_YEARS (18) on Booking.program_date" }
      - { name: health_form_status, type: enum, source: system, default: "MISSING", description: "MISSING | SUBMITTED | FLAGGED | CLEARED" }
      - { name: health_flags, type: array, source: input, default: [], description: "Subset of {NONE, ASTHMA, CARDIAC, SEIZURE, PREGNANCY, RECENT_SURGERY} submitted with the screening packet" }
      - { name: agreement_signed, type: boolean, source: system, default: false, description: "Participation agreement executed via the screening-packet action" }
      - { name: guardian_signature_provided, type: boolean, source: system, default: false, description: "Guardian counter-signature captured with the screening packet" }
      - { name: medical_clearance_granted, type: boolean, source: system, default: false, description: "SafetyOfficer override that clears a FLAGGED health form" }
      - { name: screening_status, type: enum, source: computed, default: "BLOCKED", description: "ELIGIBLE | CONDITIONAL | BLOCKED — see calculations.participant_screening_status" }

  - name: ProgramBlock
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; program this block belongs to" }
      - { name: element_id, type: string, source: input, default: null, description: "FK -> Element.id; required for LOW_ELEMENT/HIGH_ELEMENT phases, forbidden for ICEBREAKER/DEBRIEF" }
      - { name: sequence_index, type: integer, source: input, description: "1-based position in the program; must equal max(existing)+1 for the booking", constraints: ">= 1" }
      - { name: phase, type: enum, source: input, description: "ICEBREAKER | GROUND_INITIATIVE | LOW_ELEMENT | HIGH_ELEMENT | DEBRIEF" }
      - { name: planned_start_at, type: datetime, source: input, description: "UTC start instant; calendar date must equal Booking.program_date" }
      - { name: planned_end_at, type: datetime, source: input, description: "UTC end instant; must be strictly after planned_start_at" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | COMPLETED | SKIPPED | BLOCKED_UNSAFE | SUSPENDED | ABANDONED" }
      - { name: required_facilitator_count, type: integer, source: computed, default: 1, description: "See calculations.required_facilitator_count" }
      - { name: assigned_facilitator_count, type: integer, source: computed, default: 0, description: "count(BlockAssignment WHERE program_block_id == this.id)" }
      - { name: actual_head_count, type: integer, source: computed, default: 0, description: "count(Participant WHERE booking_id == this.booking_id AND screening_status == ELIGIBLE) frozen at start" }
      - { name: debrief_completed, type: boolean, source: input, default: false, description: "Debrief practice recorded at completion; required true for the DEBRIEF phase" }
      - { name: started_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the start action" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the complete action" }

  - name: BlockAssignment
    parent: null
    common_fields: false
    fields:
      - { name: program_block_id, type: string, source: input, description: "FK -> ProgramBlock.id; block being staffed" }
      - { name: facilitator_id, type: string, source: input, description: "FK -> Facilitator.id; assigned staff member" }
      - { name: assignment_role, type: enum, source: input, description: "LEAD | BELAY | SPOTTER — BELAY only permitted on HIGH_ELEMENT/CLIMBING_WALL/ZIP_LINE elements" }
      - { name: rescue_current_at_assignment, type: boolean, source: computed, description: "Snapshot of (facilitator.rescue_drill_last_passed_on >= clock_date - 180 days) at assignment time" }

  - name: BelayEquipment
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; owning site" }
      - { name: assigned_element_id, type: string, source: input, default: null, description: "FK -> Element.id; element this set is rigged to, null when in the store room" }
      - { name: equipment_kind, type: enum, source: input, description: "ROPE | HARNESS | CARABINER | LANYARD" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial, unique per course_id (case-sensitive)" }
      - { name: manufactured_on, type: datetime, source: input, description: "UTC manufacture date" }
      - { name: first_use_on, type: datetime, source: input, default: null, description: "UTC first-use date; null while unused" }
      - { name: usage_cycles, type: integer, source: computed, default: 0, description: "Seeded from POST input initial_usage_cycles, then += ProgramBlock.actual_head_count on every completion of a block whose element it is rigged to" }
      - { name: max_cycles, type: integer, source: input, description: "Hard cycle cap after which the item must leave service", constraints: ">= 1" }
      - { name: mfg_life_forecast_date, type: datetime, source: computed, description: "= manufactured_on + MFG_SHELF_LIFE_YEARS[equipment_kind]" }
      - { name: service_life_forecast_date, type: datetime, source: computed, default: null, description: "= first_use_on + SERVICE_LIFE_YEARS[equipment_kind]; null while first_use_on is null" }
      - { name: retirement_forecast_date, type: datetime, source: computed, description: "= min(mfg_life_forecast_date, service_life_forecast_date) ignoring nulls" }
      - { name: retirement_basis, type: enum, source: computed, default: "MANUFACTURE", description: "MANUFACTURE | SERVICE | CYCLE — CYCLE once usage_cycles >= max_cycles, else whichever date won (ties resolve to MANUFACTURE)" }
      - { name: status, type: enum, source: system, default: "IN_SERVICE", description: "IN_SERVICE | QUARANTINED | RETIRED" }

  - name: WeatherObservation
    parent: null
    common_fields: false
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; site observed" }
      - { name: observed_at, type: datetime, source: input, description: "UTC instant of observation; must not be after the logical clock" }
      - { name: lightning_distance_km, type: number, source: input, default: null, description: "Distance to the nearest detected strike; null when no strike detected" }
      - { name: wind_speed_kph, type: number, source: input, description: "Sustained wind speed", constraints: ">= 0" }
      - { name: air_temp_c, type: number, source: input, description: "Air temperature in Celsius" }
      - { name: resulting_posture, type: enum, source: computed, description: "Course.posture recomputed immediately after this observation was recorded" }
      - { name: resulting_posture_reason, type: enum, source: computed, description: "Course.posture_reason recomputed immediately after this observation was recorded" }
      - { name: hold_until, type: datetime, source: computed, default: null, description: "Course.lightning_hold_until after this observation (= max(previous hold, observed_at + 30 minutes) when lightning_distance_km <= 8.0)" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; site of the event" }
      - { name: element_id, type: string, source: input, default: null, description: "FK -> Element.id; element involved, null for non-element events" }
      - { name: participant_id, type: string, source: input, default: null, description: "FK -> Participant.id; person involved, null when no participant was affected" }
      - { name: reported_by_facilitator_id, type: string, source: input, description: "FK -> Facilitator.id; reporter (must equal X-User-ID)" }
      - { name: occurred_at, type: datetime, source: input, description: "UTC instant of the event; must not be after the logical clock" }
      - { name: severity, type: enum, source: input, description: "NEAR_MISS | MINOR | MODERATE | SERIOUS" }
      - { name: narrative, type: string, source: input, description: "Required non-empty description of what happened" }
      - { name: ems_activated, type: boolean, source: input, default: false, description: "true when emergency medical services were summoned" }
      - { name: status, type: enum, source: system, default: "REPORTED", description: "REPORTED | UNDER_REVIEW | CLOSED_NO_ACTION | CLOSED_CORRECTIVE" }
      - { name: corrective_action, type: enum, source: system, default: "NONE", description: "NONE | ELEMENT_RESTRICTED | EQUIPMENT_QUARANTINED — recorded at close" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Course
    initial_state: OPEN
    terminal_states: []
    note: "`posture` is a derived aggregate (calculations.course_posture) recomputed at the end of every transition listed below; the reason clause that fired is stored in posture_reason."
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /challenge-course/weather-observations (lightning_distance_km <= 8.0, wind_speed_kph >= 48.0, or air_temp_c <= -12.0)"
        actor: Facilitator
        preconditions:
          - "observed_at <= logical clock now"
          - "course_id must resolve to an existing Course"
        side_effects:
          - "When lightning_distance_km <= 8.0: Course.lightning_hold_until = max(existing lightning_hold_until, observed_at + 30 minutes); posture_reason = LIGHTNING_STOP"
          - "Course.latest_wind_speed_kph / latest_air_temp_c / latest_observation_at overwritten from this observation"
          - "Cascade C link 1: Course.posture -> CLOSED"
          - "Cascade C link 2 (caused by the course becoming CLOSED): every ProgramBlock with status == IN_PROGRESS whose booking_id belongs to a Booking of this course transitions IN_PROGRESS -> SUSPENDED, ordered by sequence_index ASC then created_at ASC"
          - "Cascade C link 3 (caused by those blocks becoming SUSPENDED): each owning Booking with status == CONFIRMED transitions CONFIRMED -> WEATHER_HOLD, Course.at_risk_booking_count += 1 per booking, and the booking's next cancellation resolves to the OPERATOR_WEATHER_INITIATED settlement variant"
          - "Course.version += 1"

      - from: OPEN
        to: RESTRICTED
        trigger: "POST /challenge-course/weather-observations (8.0 < lightning_distance_km <= 16.0 or 32.0 <= wind_speed_kph < 48.0)"
        actor: Facilitator
        preconditions:
          - "No CLOSED clause of calculations.course_posture matches"
        side_effects:
          - "posture_reason = LIGHTNING_WATCH or WIND_WATCH (first matching clause)"
          - "HIGH_ELEMENT-phase block starts are refused with ERR_COURSE_RESTRICTED_HIGH_ELEMENT while posture == RESTRICTED"
          - "Course.version += 1"

      - from: OPEN
        to: RESTRICTED
        trigger: "system (an Element of this course enters RESTRICTED, or an Incident with severity == SERIOUS enters UNDER_REVIEW)"
        actor: system
        preconditions: []
        side_effects:
          - "posture_reason = SERIOUS_INCIDENT when an UNDER_REVIEW SERIOUS incident exists, else ELEMENT_RESTRICTED"
          - "Course.restricted_element_count recomputed"
          - "Course.version += 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /challenge-course/courses/{course_id}/daily-open (next_professional_inspection_due_on < clock_date, or rescue_readiness_ok == false)"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "posture_reason = INSPECTION_OVERDUE when an element inspection is overdue, else RESCUE_READINESS"
          - "Course.daily_open_index += 1, Course.last_daily_open_date = clock_date"
          - "Course.version += 1"

      - from: CLOSED
        to: OPEN
        trigger: "POST /challenge-course/courses/{course_id}/daily-open (all CLOSED and RESTRICTED clauses now false)"
        actor: ProgramDirector
        preconditions:
          - "lightning_hold_until is null or <= logical clock now (expired holds are cleared by the checkpoint before posture recomputation)"
        side_effects:
          - "posture_reason = NONE"
          - "Every Booking of this course with status == WEATHER_HOLD transitions WEATHER_HOLD -> CONFIRMED, ordered by created_at ASC; Course.at_risk_booking_count decremented per booking"
          - "Every ProgramBlock with status == SUSPENDED remains SUSPENDED and becomes startable again"
          - "Course.version += 1"

      - from: RESTRICTED
        to: OPEN
        trigger: "system (last RESTRICTED element returns to service and no watch-level weather clause matches) or POST /challenge-course/courses/{course_id}/daily-open"
        actor: system
        preconditions: []
        side_effects:
          - "posture_reason = NONE"
          - "Course.version += 1"

  - entity: Element
    initial_state: SERVICEABLE
    terminal_states: [RETIRED]
    transitions:
      - from: SERVICEABLE
        to: RESTRICTED
        trigger: "POST /challenge-course/operational-logs with result == DEFECT_MAJOR"
        actor: Facilitator
        preconditions:
          - "Element.status == SERVICEABLE"
          - "defect_note must be non-empty"
          - "facilitator_id == X-User-ID and Facilitator.course_id == Element.course_id"
        side_effects:
          - "Cascade A link 1: Element.status -> RESTRICTED, Element.restricting_log_id = the new log's id, OperationalInspectionLog.caused_restriction = true, Course.restricted_element_count += 1"
          - "Cascade A link 2 (caused by the element becoming RESTRICTED): every ProgramBlock with element_id == this element AND status == SCHEDULED transitions SCHEDULED -> BLOCKED_UNSAFE, ordered by sequence_index ASC then created_at ASC"
          - "Cascade A link 3 (caused by those blocks becoming BLOCKED_UNSAFE): each owning Booking recomputes blocked_block_count and, when status == CONFIRMED, transitions CONFIRMED -> AT_RISK"
          - "Cascade A link 4 (caused by those bookings entering AT_RISK): Course.at_risk_booking_count += 1 per booking and Course.posture / posture_reason are recomputed (ELEMENT_RESTRICTED unless a CLOSED clause matches); Course.version += 1"

      - from: SERVICEABLE
        to: RESTRICTED
        trigger: "POST /challenge-course/professional-inspections/{inspection_id}/file with outcome == CONDITIONAL"
        actor: ProfessionalInspector
        preconditions:
          - "Element.status IN {SERVICEABLE, RESTRICTED}"
        side_effects:
          - "Element.status -> RESTRICTED with restricting_log_id left null (no operational log caused it, so the return-to-service segregation check has no counterparty and is skipped)"
          - "Course.restricted_element_count += 1; SCHEDULED blocks on this element -> BLOCKED_UNSAFE; owning CONFIRMED bookings -> AT_RISK; Course.posture recomputed"

      - from: SERVICEABLE
        to: RESTRICTED
        trigger: "POST /challenge-course/incidents with severity == SERIOUS and a non-null element_id"
        actor: Facilitator
        preconditions:
          - "Element.status == SERVICEABLE"
        side_effects:
          - "Element.status -> RESTRICTED with restricting_log_id left null"
          - "Incident.status is set to UNDER_REVIEW at creation, so Course.posture_reason resolves to SERIOUS_INCIDENT (which outranks ELEMENT_RESTRICTED)"
          - "Course.restricted_element_count += 1; Course.posture -> RESTRICTED; Course.version += 1"

      - from: RESTRICTED
        to: SERVICEABLE
        trigger: "POST /challenge-course/elements/{element_id}/return-to-service"
        actor: SafetyOfficer
        preconditions:
          - "Element.status == RESTRICTED"
          - "The newest OperationalInspectionLog for this element (log_date DESC, created_at DESC) has result == CLEAR, else ERR_DEFECT_NOT_CLEARED"
          - "No Incident with element_id == this element and status IN {REPORTED, UNDER_REVIEW}, else ERR_OPEN_INCIDENT_BLOCKS_SERVICE"
          - "When restricting_log_id is not null: X-User-ID != OperationalInspectionLog(restricting_log_id).facilitator_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Element.status -> SERVICEABLE, Element.restricting_log_id = null"
          - "Course.restricted_element_count -= 1 (compensating half of the restriction-count invariant)"
          - "Every ProgramBlock with element_id == this element AND status == BLOCKED_UNSAFE transitions BLOCKED_UNSAFE -> SCHEDULED, ordered by sequence_index ASC then created_at ASC"
          - "Every Booking whose blocked_block_count returns to 0 and whose status == AT_RISK transitions AT_RISK -> CONFIRMED; Course.at_risk_booking_count -= 1 per booking"
          - "Every BelayEquipment with assigned_element_id == this element AND status == QUARANTINED returns to IN_SERVICE; Course.quarantined_equipment_count recomputed"
          - "Course.posture / posture_reason recomputed; Course.version += 1"

      - from: SERVICEABLE
        to: OUT_OF_SERVICE
        trigger: "POST /challenge-course/professional-inspections/{inspection_id}/file with outcome == FAIL"
        actor: ProfessionalInspector
        preconditions:
          - "Element.status IN {SERVICEABLE, RESTRICTED}"
        side_effects:
          - "Cascade B link 1: Element.status -> OUT_OF_SERVICE; Course.out_of_service_element_count += 1"
          - "Cascade B link 2 (caused by the element becoming OUT_OF_SERVICE): every BelayEquipment with assigned_element_id == this element AND status == IN_SERVICE transitions IN_SERVICE -> QUARANTINED, ordered by created_at ASC"
          - "Cascade B link 3 (caused by that quarantine): Element.belay_ready recomputed to false, Course.quarantined_equipment_count += 1, Course.posture / posture_reason recomputed, Course.version += 1"
          - "Fan-out (not part of the cascade depth chain): SCHEDULED blocks on this element -> BLOCKED_UNSAFE and their CONFIRMED bookings -> AT_RISK"

      - from: RESTRICTED
        to: OUT_OF_SERVICE
        trigger: "POST /challenge-course/professional-inspections/{inspection_id}/file with outcome == FAIL"
        actor: ProfessionalInspector
        preconditions:
          - "Element.status == RESTRICTED"
        side_effects:
          - "Same three-link cascade as the SERVICEABLE -> OUT_OF_SERVICE transition; Course.restricted_element_count -= 1 and out_of_service_element_count += 1"

      - from: SERVICEABLE
        to: OUT_OF_SERVICE
        trigger: "POST /challenge-course/courses/{course_id}/daily-open (retirement_forecast_date <= clock_date)"
        actor: ProgramDirector
        preconditions:
          - "Element.status IN {SERVICEABLE, RESTRICTED}"
        side_effects:
          - "Element.status -> OUT_OF_SERVICE; Course.out_of_service_element_count += 1"
          - "SCHEDULED blocks on this element -> BLOCKED_UNSAFE; owning CONFIRMED bookings -> AT_RISK"
        note: "Life-expired elements leave service automatically; only an explicit retire call moves them to the terminal RETIRED state."

      - from: OUT_OF_SERVICE
        to: SERVICEABLE
        trigger: "POST /challenge-course/elements/{element_id}/return-to-service"
        actor: SafetyOfficer
        preconditions:
          - "Element.status == OUT_OF_SERVICE"
          - "Element.latest_inspection_outcome == PASS (a newer DISPOSED PASS inspection exists), else ERR_DEFECT_NOT_CLEARED"
          - "Element.retirement_forecast_date > clock_date, else ERR_RETIREMENT_CRITERIA_NOT_MET"
          - "No Incident with element_id == this element and status IN {REPORTED, UNDER_REVIEW}"
        side_effects:
          - "Element.status -> SERVICEABLE; Course.out_of_service_element_count -= 1"
          - "QUARANTINED BelayEquipment rigged to this element returns to IN_SERVICE; Element.belay_ready recomputed"
          - "BLOCKED_UNSAFE blocks on this element -> SCHEDULED; AT_RISK bookings with blocked_block_count == 0 -> CONFIRMED"
          - "Course.posture recomputed; Course.version += 1"

      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /challenge-course/elements/{element_id}/retire"
        actor: ProgramDirector
        preconditions:
          - "Element.status != RETIRED"
          - "At least one retirement criterion holds: retirement_forecast_date <= clock_date OR consecutive_conditional_count >= 2 OR latest_inspection_outcome == FAIL, else ERR_RETIREMENT_CRITERIA_NOT_MET"
          - "No ProgramBlock with element_id == this element and status IN {SCHEDULED, IN_PROGRESS, SUSPENDED, BLOCKED_UNSAFE}, else ERR_ELEMENT_HAS_ACTIVE_BLOCKS"
        side_effects:
          - "Element.status -> RETIRED (terminal)"
          - "Every BelayEquipment with assigned_element_id == this element is unrigged (assigned_element_id = null) and set to QUARANTINED when status == IN_SERVICE"
          - "Course.out_of_service_element_count / restricted_element_count / quarantined_equipment_count / next_professional_inspection_due_on recomputed; Course.posture recomputed; Course.version += 1"

      - from: SERVICEABLE
        to: RETIRED
        trigger: "POST /challenge-course/elements/{element_id}/retire"
        actor: ProgramDirector
        preconditions:
          - "Same retirement-criteria and active-block preconditions as the OUT_OF_SERVICE -> RETIRED transition"
        side_effects:
          - "Same side effects as the OUT_OF_SERVICE -> RETIRED transition"

      - from: RESTRICTED
        to: RETIRED
        trigger: "POST /challenge-course/elements/{element_id}/retire"
        actor: ProgramDirector
        preconditions:
          - "Same retirement-criteria and active-block preconditions as the OUT_OF_SERVICE -> RETIRED transition"
        side_effects:
          - "Same side effects as the OUT_OF_SERVICE -> RETIRED transition, plus Course.restricted_element_count -= 1"

  - entity: ProfessionalInspection
    initial_state: DRAFT
    terminal_states: [DISPOSED]
    note: "Fork-join diamond: DRAFT -> {FILED_PASS | FILED_CONDITIONAL | FILED_FAIL} -> DISPOSED. The fork branches carry the safety-critical element effects; the join branch carries the administrative inspection-cycle effects, and both sets differ per branch."
    transitions:
      - from: DRAFT
        to: FILED_PASS
        trigger: "POST /challenge-course/professional-inspections/{inspection_id}/file with outcome == PASS"
        actor: ProfessionalInspector
        preconditions:
          - "status == DRAFT, else ERR_INSPECTION_NOT_DRAFT"
          - "X-User-ID == inspector_id"
        side_effects:
          - "outcome = PASS; no Element mutation on the fork"

      - from: DRAFT
        to: FILED_CONDITIONAL
        trigger: "POST /challenge-course/professional-inspections/{inspection_id}/file with outcome == CONDITIONAL"
        actor: ProfessionalInspector
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == inspector_id"
          - "findings_note recorded at create must be non-empty, else ERR_INVALID_REQUEST"
        side_effects:
          - "outcome = CONDITIONAL; Element SERVICEABLE -> RESTRICTED with restricting_log_id left null; SCHEDULED blocks on the element -> BLOCKED_UNSAFE; CONFIRMED owning bookings -> AT_RISK; Course.posture recomputed"

      - from: DRAFT
        to: FILED_FAIL
        trigger: "POST /challenge-course/professional-inspections/{inspection_id}/file with outcome == FAIL"
        actor: ProfessionalInspector
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == inspector_id"
          - "findings_note recorded at create must be non-empty"
        side_effects:
          - "outcome = FAIL; Element -> OUT_OF_SERVICE and the three-link Cascade B (equipment quarantine -> belay_ready false -> course posture) fires"

      - from: FILED_PASS
        to: DISPOSED
        trigger: "POST /challenge-course/professional-inspections/{inspection_id}/dispose"
        actor: SafetyOfficer
        preconditions:
          - "status IN {FILED_PASS, FILED_CONDITIONAL, FILED_FAIL}, else ERR_INSPECTION_NOT_FILED"
          - "X-User-ID != inspector_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Element.next_professional_inspection_due_on += 12 months; Element.latest_inspection_outcome = PASS; Element.consecutive_conditional_count = 0"
          - "Course.next_professional_inspection_due_on recomputed; Course.posture recomputed (may clear INSPECTION_OVERDUE)"
          - "disposed_on = clock now"

      - from: FILED_CONDITIONAL
        to: DISPOSED
        trigger: "POST /challenge-course/professional-inspections/{inspection_id}/dispose"
        actor: SafetyOfficer
        preconditions:
          - "Same preconditions as the FILED_PASS -> DISPOSED transition"
        side_effects:
          - "Element.next_professional_inspection_due_on += 3 months (accelerated re-inspection); Element.latest_inspection_outcome = CONDITIONAL; Element.consecutive_conditional_count += 1"
          - "When consecutive_conditional_count >= 2 the element becomes retirement-eligible even though its forecast date has not been reached"
          - "Course.next_professional_inspection_due_on recomputed; disposed_on = clock now"

      - from: FILED_FAIL
        to: DISPOSED
        trigger: "POST /challenge-course/professional-inspections/{inspection_id}/dispose"
        actor: SafetyOfficer
        preconditions:
          - "Same preconditions as the FILED_PASS -> DISPOSED transition"
        side_effects:
          - "Element.latest_inspection_outcome = FAIL; next_professional_inspection_due_on unchanged; element stays OUT_OF_SERVICE and becomes retirement-eligible"
          - "disposed_on = clock now"

  - entity: Facilitator
    initial_state: PROBATION
    terminal_states: []
    note: "Cyclic: PROBATION <-> ACTIVE via training records, and LAPSED -> PROBATION/ACTIVE via a RECERTIFICATION record. cert_status is always the output of calculations.facilitator_cert_status recomputed after the triggering write."
    transitions:
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /challenge-course/training-records with kind IN {RESCUE_DRILL, REFRESHER}"
        actor: ProgramDirector
        preconditions:
          - "cert_expires_on >= clock_date"
          - "After the record is applied: rescue_drill_last_passed_on >= clock_date - 180 days AND refresher_hours_24mo >= 8"
        side_effects:
          - "cert_status -> ACTIVE; Course.rescue_ready_facilitator_count += 1 and rescue_readiness_ok recomputed"
          - "Course.posture recomputed (a CLOSED RESCUE_READINESS course can reopen once the count reaches 2)"
          - "Facilitator.version += 1"

      - from: ACTIVE
        to: PROBATION
        trigger: "POST /challenge-course/courses/{course_id}/daily-open (rescue_drill_last_passed_on < clock_date - 180 days or refresher_hours_24mo < 8)"
        actor: ProgramDirector
        preconditions:
          - "cert_expires_on >= clock_date"
        side_effects:
          - "cert_status -> PROBATION; Course.rescue_ready_facilitator_count -= 1; Course.posture recomputed"

      - from: ACTIVE
        to: LAPSED
        trigger: "POST /challenge-course/courses/{course_id}/daily-open (cert_expires_on < clock_date)"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "cert_status -> LAPSED; Course.rescue_ready_facilitator_count -= 1; Course.posture recomputed"
          - "Existing BlockAssignments are left in place, but any block start that needs this facilitator now fails ERR_FACILITATOR_CERT_INACTIVE"

      - from: PROBATION
        to: LAPSED
        trigger: "POST /challenge-course/courses/{course_id}/daily-open (cert_expires_on < clock_date)"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "cert_status -> LAPSED"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /challenge-course/training-records with kind == RECERTIFICATION"
        actor: ProgramDirector
        preconditions:
          - "After the record is applied: cert_expires_on = completed_on + 24 months >= clock_date AND rescue_drill_last_passed_on >= clock_date - 180 days AND refresher_hours_24mo >= 8"
        side_effects:
          - "cert_expires_on = completed_on + 24 months; cert_status -> ACTIVE; Course.rescue_ready_facilitator_count += 1; Course.posture recomputed"

      - from: LAPSED
        to: PROBATION
        trigger: "POST /challenge-course/training-records with kind == RECERTIFICATION"
        actor: ProgramDirector
        preconditions:
          - "After the record is applied: cert_expires_on >= clock_date but the rescue-drill or refresher-hours clause still fails"
        side_effects:
          - "cert_expires_on = completed_on + 24 months; cert_status -> PROBATION"

  - entity: Booking
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    note: "Two independent state dimensions on one row: `status` (below) and `roster_status` (INCOMPLETE | BLOCKED | READY, recomputed by calculations.booking_roster_status on every participant write). Participant writes never move `status`; status actions never move `roster_status`."
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /challenge-course/bookings/{booking_id}/quote"
        actor: ProgramDirector
        preconditions:
          - "status IN {DRAFT, QUOTED}, else ERR_BOOKING_NOT_QUOTABLE"
          - "expected_booking_version == Booking.version, else ERR_STALE_BOOKING_VERSION"
          - "block_count >= 1, else ERR_INVALID_REQUEST"
        side_effects:
          - "billable_head_count, raw_subtotal_cents, high_element_surcharge_cents, quoted_total_cents, deposit_required_cents and required_chaperone_count recomputed"
          - "quote_index += 1; Booking.version += 1"

      - from: QUOTED
        to: QUOTED
        trigger: "POST /challenge-course/bookings/{booking_id}/quote (re-quote after roster or program changes)"
        actor: ProgramDirector
        preconditions:
          - "expected_booking_version == Booking.version"
        side_effects:
          - "The prior quote is superseded in place; quote_index += 1; Booking.version += 1"

      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /challenge-course/bookings/{booking_id}/confirm"
        actor: GroupCoordinator
        preconditions:
          - "status == QUOTED, else ERR_BOOKING_NOT_CONFIRMABLE"
          - "roster_status == READY, else ERR_PARTICIPANT_SCREENING_INCOMPLETE"
          - "count(Participant WHERE booking_id AND is_chaperone == true) >= required_chaperone_count, else ERR_CHAPERONE_SHORTFALL"
          - "The highest sequence_index block has phase == DEBRIEF, else ERR_DEBRIEF_BLOCK_MISSING"
          - "Course.rescue_readiness_ok == true, else ERR_RESCUE_READINESS_UNMET"
          - "Every Element referenced by a block of this booking has next_professional_inspection_due_on >= program_date, else ERR_INSPECTION_OVERDUE"
          - "GroupClient.credit_balance_cents >= deposit_required_cents, else ERR_INSUFFICIENT_CLIENT_CREDIT"
        side_effects:
          - "deposit_allocated_cents = deposit_required_cents; GroupClient.credit_balance_cents -= deposit_required_cents (forward half of the client-funds invariant)"
          - "Booking.version += 1; GroupClient.version += 1"

      - from: CONFIRMED
        to: AT_RISK
        trigger: "system (a block of this booking enters BLOCKED_UNSAFE through the element-restriction or inspection-FAIL cascade)"
        actor: system
        preconditions:
          - "blocked_block_count transitions from 0 to >= 1"
        side_effects:
          - "Course.at_risk_booking_count += 1; Booking.version += 1"

      - from: AT_RISK
        to: CONFIRMED
        trigger: "system (the last BLOCKED_UNSAFE block returns to SCHEDULED via POST /challenge-course/elements/{element_id}/return-to-service)"
        actor: system
        preconditions:
          - "blocked_block_count returns to 0"
        side_effects:
          - "Course.at_risk_booking_count -= 1; Booking.version += 1"

      - from: CONFIRMED
        to: WEATHER_HOLD
        trigger: "system (Cascade C: a weather observation closes the course while a block of this booking is IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects:
          - "cancellation_variant resolution switches to OPERATOR_WEATHER_INITIATED for any subsequent cancel; Course.at_risk_booking_count += 1; Booking.version += 1"

      - from: WEATHER_HOLD
        to: CONFIRMED
        trigger: "POST /challenge-course/courses/{course_id}/daily-open (Course.posture recomputes to OPEN)"
        actor: ProgramDirector
        preconditions:
          - "Course.posture == OPEN after the checkpoint"
        side_effects:
          - "Course.at_risk_booking_count -= 1; Booking.version += 1"

      - from: CONFIRMED
        to: DELIVERED
        trigger: "system (bubble-up when the last non-terminal ProgramBlock of this booking reaches COMPLETED)"
        actor: system
        preconditions:
          - "block_count >= 1 and every ProgramBlock of this booking has status IN {COMPLETED, ABANDONED}"
        side_effects:
          - "retained_cents = deposit_allocated_cents, deposit_allocated_cents = 0 (the held deposit converts to earned revenue, keeping the client-funds invariant balanced)"
          - "Booking.version += 1; GroupClient.version += 1"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /challenge-course/bookings/{booking_id}/cancel"
        actor: GroupCoordinator
        preconditions:
          - "status NOT IN {DELIVERED, CANCELLED}, else ERR_BOOKING_ALREADY_TERMINAL"
        side_effects:
          - "notice_days_at_cancel recorded; cancellation_variant = CLIENT_INITIATED; cancellation_fee_cents = min(tiered fee, deposit_allocated_cents) = 0 because nothing was ever allocated"
          - "All non-terminal ProgramBlocks -> ABANDONED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /challenge-course/bookings/{booking_id}/cancel"
        actor: GroupCoordinator
        preconditions:
          - "status NOT IN {DELIVERED, CANCELLED}"
        side_effects:
          - "calculations.booking_cancellation_settlement runs with variant CLIENT_INITIATED; retained_cents = cancellation_fee_cents; refund_cents = deposit_allocated_cents - retained_cents"
          - "GroupClient.credit_balance_cents += refund_cents; Booking.deposit_allocated_cents = 0 (compensating half of the client-funds invariant)"
          - "All non-terminal ProgramBlocks -> ABANDONED; Course.at_risk_booking_count recomputed; Booking.version += 1; GroupClient.version += 1"

      - from: WEATHER_HOLD
        to: CANCELLED
        trigger: "POST /challenge-course/bookings/{booking_id}/cancel"
        actor: GroupCoordinator
        preconditions:
          - "status NOT IN {DELIVERED, CANCELLED}"
        side_effects:
          - "calculations.booking_cancellation_settlement runs with variant OPERATOR_WEATHER_INITIATED (flat admin fee instead of the notice tier)"
          - "GroupClient.credit_balance_cents += refund_cents; deposit_allocated_cents = 0; all non-terminal blocks -> ABANDONED"

      - from: AT_RISK
        to: CANCELLED
        trigger: "POST /challenge-course/bookings/{booking_id}/cancel"
        actor: GroupCoordinator
        preconditions:
          - "status NOT IN {DELIVERED, CANCELLED}"
        side_effects:
          - "Same as the CONFIRMED -> CANCELLED transition (CLIENT_INITIATED variant); Course.at_risk_booking_count -= 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /challenge-course/bookings/{booking_id}/cancel"
        actor: GroupCoordinator
        preconditions: []
        side_effects:
          - "cancellation_variant = CLIENT_INITIATED with zero fee and zero refund; all non-terminal blocks -> ABANDONED"

  - entity: Participant
    initial_state: MISSING
    terminal_states: []
    note: "State dimension is `health_form_status`; `screening_status` is the derived gate recomputed after every transition."
    transitions:
      - from: MISSING
        to: SUBMITTED
        trigger: "POST /challenge-course/participants/{participant_id}/screening-packet with health_flags containing no blocking flag"
        actor: GroupCoordinator
        preconditions:
          - "Booking.status NOT IN {DELIVERED, CANCELLED}, else ERR_BOOKING_ALREADY_TERMINAL"
          - "agreement_signed input must be true, else ERR_INVALID_REQUEST"
          - "health_flags must be a subset of {NONE, ASTHMA, CARDIAC, SEIZURE, PREGNANCY, RECENT_SURGERY}"
        side_effects:
          - "health_form_status -> SUBMITTED; agreement_signed = true; guardian_signature_provided = input value"
          - "screening_status recomputed; Booking.roster_status recomputed; Booking.version += 1"

      - from: MISSING
        to: FLAGGED
        trigger: "POST /challenge-course/participants/{participant_id}/screening-packet with health_flags intersecting {CARDIAC, SEIZURE, PREGNANCY, RECENT_SURGERY}"
        actor: GroupCoordinator
        preconditions:
          - "Same preconditions as the MISSING -> SUBMITTED transition"
        side_effects:
          - "health_form_status -> FLAGGED; screening_status -> CONDITIONAL (medical clearance outstanding); Booking.roster_status -> BLOCKED"

      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /challenge-course/participants/{participant_id}/screening-packet re-submitted with a blocking flag"
        actor: GroupCoordinator
        preconditions:
          - "Booking.status NOT IN {DELIVERED, CANCELLED}"
        side_effects:
          - "health_form_status -> FLAGGED; medical_clearance_granted reset to false; Booking.roster_status recomputed"

      - from: FLAGGED
        to: CLEARED
        trigger: "POST /challenge-course/participants/{participant_id}/medical-clearance"
        actor: SafetyOfficer
        preconditions:
          - "health_form_status == FLAGGED, else ERR_INVALID_STATE"
          - "Booking.status NOT IN {DELIVERED, CANCELLED}"
        side_effects:
          - "health_form_status -> CLEARED; medical_clearance_granted = true; screening_status recomputed to ELIGIBLE when the agreement and guardian clauses pass"
          - "Booking.roster_status recomputed; Booking.version += 1"

  - entity: ProgramBlock
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /challenge-course/program-blocks/{program_block_id}/start"
        actor: Facilitator
        preconditions:
          - "status IN {SCHEDULED, SUSPENDED}, else ERR_BLOCK_NOT_SCHEDULED"
          - "Booking.status IN {CONFIRMED}, else ERR_BOOKING_NOT_CONFIRMED"
          - "Every ProgramBlock of the same booking with a lower sequence_index has status IN {COMPLETED, ABANDONED}, else ERR_BLOCK_SEQUENCE_NOT_READY"
          - "Course.posture != CLOSED, else ERR_COURSE_CLOSED"
          - "When phase == HIGH_ELEMENT: Course.posture == OPEN, else ERR_COURSE_RESTRICTED_HIGH_ELEMENT"
          - "When element_id is not null: Element.status == SERVICEABLE, else ERR_ELEMENT_NOT_SERVICEABLE (ERR_ELEMENT_RETIRED when status == RETIRED)"
          - "When element_id is not null: an OperationalInspectionLog exists for that element with log_date == clock_date and result == CLEAR and no later log with result != CLEAR, else ERR_DAILY_INSPECTION_MISSING"
          - "When element_id is not null and Element.required_belay_set_count > 0: Element.belay_ready == true, else ERR_BELAY_NOT_READY"
          - "When phase == HIGH_ELEMENT: at least one BlockAssignment on this block has rescue_current_at_assignment == true and its Facilitator.cert_status == ACTIVE, else ERR_RESCUE_READINESS_UNMET"
          - "When phase == HIGH_ELEMENT: Course.ems_response_minutes <= 30, else ERR_EMS_ACCESS_UNSUITABLE"
          - "count(Participant WHERE booking_id AND screening_status == ELIGIBLE) >= 1 and no Participant of this booking has screening_status IN {BLOCKED, CONDITIONAL}, else ERR_PARTICIPANT_SCREENING_INCOMPLETE"
          - "When element_id is not null: every ELIGIBLE Participant has min_participant_weight_kg <= weight_kg <= max_participant_weight_kg, else ERR_WEIGHT_LIMIT_EXCEEDED"
          - "assigned_facilitator_count >= required_facilitator_count, else ERR_SUPERVISION_RATIO_UNMET"
          - "Every assigned Facilitator has cert_status == ACTIVE, else ERR_FACILITATOR_CERT_INACTIVE"
        side_effects:
          - "status -> IN_PROGRESS; started_at = clock now; actual_head_count frozen = count(Participant WHERE booking_id AND screening_status == ELIGIBLE)"
          - "ProgramBlock.version += 1"

      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /challenge-course/program-blocks/{program_block_id}/start (resume after a weather hold clears)"
        actor: Facilitator
        preconditions:
          - "Same preconditions as SCHEDULED -> IN_PROGRESS; Course.posture must have returned to OPEN/RESTRICTED per phase"
        side_effects:
          - "status -> IN_PROGRESS; started_at overwritten with the resume instant; actual_head_count re-frozen"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /challenge-course/program-blocks/{program_block_id}/complete"
        actor: Facilitator
        preconditions:
          - "status == IN_PROGRESS, else ERR_BLOCK_NOT_IN_PROGRESS"
          - "When phase == DEBRIEF: debrief_completed input must be true, else ERR_DEBRIEF_NOT_RECORDED"
        side_effects:
          - "status -> COMPLETED; completed_at = clock now; debrief_completed = input value"
          - "When element_id is not null: Element.cumulative_cycle_count += actual_head_count, then usage_life_forecast_date / retirement_forecast_date / retirement_basis recomputed"
          - "Every BelayEquipment with assigned_element_id == this element AND status == IN_SERVICE: usage_cycles += actual_head_count, then retirement_basis recomputed; when usage_cycles >= max_cycles the item transitions IN_SERVICE -> RETIRED, which recomputes Element.belay_ready and can drive dependent SCHEDULED HIGH_ELEMENT blocks to BLOCKED_UNSAFE"
          - "Bubble-up: when every ProgramBlock of the booking is now in {COMPLETED, ABANDONED}, Booking CONFIRMED -> DELIVERED"

      - from: SCHEDULED
        to: BLOCKED_UNSAFE
        trigger: "system (owning Element leaves SERVICEABLE, or its belay set stops being ready)"
        actor: system
        preconditions:
          - "element_id is not null"
        side_effects:
          - "Booking.blocked_block_count += 1; a CONFIRMED booking transitions to AT_RISK"

      - from: BLOCKED_UNSAFE
        to: SCHEDULED
        trigger: "system (owning Element returns to SERVICEABLE with belay_ready == true)"
        actor: system
        preconditions: []
        side_effects:
          - "Booking.blocked_block_count -= 1; an AT_RISK booking with blocked_block_count == 0 transitions to CONFIRMED"

      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "system (Cascade C: a weather observation drives Course.posture to CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Owning CONFIRMED booking -> WEATHER_HOLD"

      - from: SCHEDULED
        to: ABANDONED
        trigger: "system (owning Booking is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Block becomes terminal and no longer counts toward blocked_block_count"

      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "system (owning Booking is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "No element cycle counts are credited for an abandoned block"

      - from: SUSPENDED
        to: ABANDONED
        trigger: "system (owning Booking is cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BLOCKED_UNSAFE
        to: ABANDONED
        trigger: "system (owning Booking is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Booking.blocked_block_count -= 1"

  - entity: BelayEquipment
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: QUARANTINED
        trigger: "system (rigged Element enters OUT_OF_SERVICE, is RETIRED, or an Incident closes with corrective_action == EQUIPMENT_QUARANTINED)"
        actor: system
        preconditions: []
        side_effects:
          - "Course.quarantined_equipment_count += 1; Element.belay_ready recomputed; dependent SCHEDULED blocks -> BLOCKED_UNSAFE"

      - from: QUARANTINED
        to: IN_SERVICE
        trigger: "system (rigged Element returns to SERVICEABLE)"
        actor: system
        preconditions:
          - "retirement_forecast_date > clock_date and usage_cycles < max_cycles"
        side_effects:
          - "Course.quarantined_equipment_count -= 1; Element.belay_ready recomputed"

      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /challenge-course/belay-equipment/{equipment_id}/log-usage (usage_cycles >= max_cycles after the increment) or ProgramBlock completion crediting cycles"
        actor: Facilitator
        preconditions:
          - "status == IN_SERVICE, else ERR_EQUIPMENT_RETIRED"
        side_effects:
          - "retirement_basis = CYCLE; status -> RETIRED; assigned_element_id retained for audit"
          - "Element.belay_ready recomputed; when it turns false every SCHEDULED block on that element -> BLOCKED_UNSAFE and CONFIRMED owning bookings -> AT_RISK"
          - "Course.version += 1"

      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /challenge-course/courses/{course_id}/daily-open (retirement_forecast_date <= clock_date)"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "retirement_basis = MANUFACTURE or SERVICE (whichever date won); status -> RETIRED; Element.belay_ready recomputed; dependent SCHEDULED blocks -> BLOCKED_UNSAFE"

      - from: QUARANTINED
        to: RETIRED
        trigger: "POST /challenge-course/courses/{course_id}/daily-open (retirement_forecast_date <= clock_date)"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "Course.quarantined_equipment_count -= 1; status -> RETIRED"

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CLOSED_NO_ACTION, CLOSED_CORRECTIVE]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /challenge-course/incidents with severity IN {MODERATE, SERIOUS} (automatic at creation)"
        actor: system
        preconditions: []
        side_effects:
          - "When severity == SERIOUS and element_id is not null: Element SERVICEABLE -> RESTRICTED; Course.posture -> RESTRICTED with posture_reason = SERIOUS_INCIDENT"

      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /challenge-course/incidents/{incident_id}/review"
        actor: SafetyOfficer
        preconditions:
          - "status == REPORTED, else ERR_INCIDENT_NOT_REPORTED"
        side_effects:
          - "Element return-to-service stays blocked while the review is open (ERR_OPEN_INCIDENT_BLOCKS_SERVICE)"

      - from: UNDER_REVIEW
        to: CLOSED_NO_ACTION
        trigger: "POST /challenge-course/incidents/{incident_id}/close with disposition == NO_ACTION"
        actor: SafetyOfficer
        preconditions:
          - "status == UNDER_REVIEW, else ERR_INCIDENT_NOT_UNDER_REVIEW"
          - "X-User-ID != reported_by_facilitator_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "corrective_action = NONE; Course.posture recomputed (SERIOUS_INCIDENT clause clears)"

      - from: UNDER_REVIEW
        to: CLOSED_CORRECTIVE
        trigger: "POST /challenge-course/incidents/{incident_id}/close with disposition == CORRECTIVE"
        actor: SafetyOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != reported_by_facilitator_id"
          - "corrective_action input must be ELEMENT_RESTRICTED or EQUIPMENT_QUARANTINED, else ERR_INVALID_REQUEST"
          - "corrective_action requires a non-null element_id on the incident, else ERR_INVALID_REQUEST"
        side_effects:
          - "corrective_action = input value"
          - "ELEMENT_RESTRICTED: Element SERVICEABLE -> RESTRICTED (restricting_log_id stays null); SCHEDULED blocks -> BLOCKED_UNSAFE; CONFIRMED bookings -> AT_RISK"
          - "EQUIPMENT_QUARANTINED: every BelayEquipment with assigned_element_id == incident.element_id AND status == IN_SERVICE -> QUARANTINED; Element.belay_ready recomputed; dependent SCHEDULED blocks -> BLOCKED_UNSAFE"
          - "Course.posture recomputed; Course.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent Booking's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-run-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /challenge-course/bookings/{booking_id}/quote"
    occ_field: "expected_booking_version"
    description: |
      A quote run against a Booking whose version has advanced since the client
      last read it is rejected. Re-quoting is a legitimate operation that
      supersedes the prior quote in place (QUOTED -> QUOTED), so the second
      writer would otherwise succeed and silently overwrite a quote computed
      from a roster it never observed; the stale-version check is what makes the
      supersede explicit.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: participant-add-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /challenge-course/participants"
    occ_field: "expected_booking_version"
    description: |
      Adding a Participant to a Booking whose version has advanced since the
      client last read it is rejected. A roster addition legitimately supersedes
      the booking's frozen billable_head_count and roster_status, so nothing in
      the state machine would refuse it; the stale-version check is the only
      guard that stops a coordinator from extending a roster whose quote or
      screening posture it has not seen.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_quote_subtotal
    trigger: "POST /challenge-course/bookings/{booking_id}/quote (recomputed on every quote run; also recomputed for reporting on POST /challenge-course/participants and POST /challenge-course/program-blocks)"
    algorithm: tiered_pricing
    formula: |
      # ---- input set ------------------------------------------------------
      billable_head_count =
        count(Participant p WHERE p.booking_id == booking.id
                              AND p.is_chaperone == false)
      # chaperones ride free. Screening state does NOT filter the billable
      # head count -- a screening-blocked child still occupies a place. The
      # state-filtered head count lives in block_supervision_requirement.
      lines = [ b in ProgramBlock WHERE b.booking_id == booking.id
                                    AND b.status != ABANDONED ]
              ordered by sequence_index ASC, created_at ASC

      discount_pct = TIER_DISCOUNT_PCT[group_client.tier]

      # ---- per-line rounding, THEN summation (mode b) ---------------------
      # The rounding step sits INSIDE the loop. Each line is rounded to a
      # whole cent before it enters the sum. Summing the unrounded line
      # amounts and rounding once at the end is a DIFFERENT number and is
      # explicitly wrong.
      raw_subtotal_cents = 0
      high_element_line_cents = 0
      for b in lines:
          gross = PHASE_RATE_CENTS[b.phase] * billable_head_count
          line  = round_half_up(gross * (1 - discount_pct))     # whole cents
          raw_subtotal_cents += line
          if b.phase == HIGH_ELEMENT:
              high_element_line_cents += line

      # Worked example (PARTNER, 4 billable heads, the 5-block canonical program):
      #   ICEBREAKER        850*4=3400  *0.925 = 3145.0  -> 3145
      #   GROUND_INITIATIVE 1250*4=5000 *0.925 = 4625.0  -> 4625
      #   LOW_ELEMENT       2275*4=9100 *0.925 = 8417.5  -> 8418   (round_half_up)
      #   HIGH_ELEMENT      4650*4=18600*0.925 = 17205.0 -> 17205
      #   DEBRIEF           625*4=2500  *0.925 = 2312.5  -> 2313   (round_half_up)
      #   raw_subtotal_cents = 35706        high_element_line_cents = 17205
      # Sum-then-round would give round_half_up(9650*4*0.925) = 35705 -- off by one cent.
    input_set: "ProgramBlocks of the booking with status != ABANDONED, priced against the non-chaperone participant head count regardless of screening state. A booking with zero priced blocks is refused with ERR_INVALID_REQUEST rather than quoted at zero."
    constants:
      PHASE_RATE_CENTS:
        ICEBREAKER: 850
        GROUND_INITIATIVE: 1250
        LOW_ELEMENT: 2275
        HIGH_ELEMENT: 4650
        DEBRIEF: 625
      TIER_DISCOUNT_PCT:
        STANDARD: 0.00
        PARTNER: 0.075
        ANCHOR: 0.125
    precision: "Integer cents. round_half_up applied once per program-block line, before summation. Never sum first and round once."

  - name: booking_high_element_surcharge
    trigger: "POST /challenge-course/bookings/{booking_id}/quote, immediately after booking_quote_subtotal"
    algorithm: threshold
    formula: |
      # The surcharge rate is selected by a band over raw_subtotal_cents --
      # the SAME aggregate the surcharge then increases. The band MUST be
      # resolved exactly once, from the PRE-surcharge subtotal. Re-resolving
      # the band against the surcharge-inclusive total is wrong and, at the
      # canonical fixture, silently changes the answer.
      band_input = raw_subtotal_cents            # evaluated once, pre-surcharge
      if   band_input <  30000: rate = 0.06
      elif band_input <  36000: rate = 0.05      # 30000 .. 35999 inclusive
      else:                     rate = 0.03      # 36000 and above

      high_element_surcharge_cents = ceil(high_element_line_cents * rate)
      quoted_total_cents = raw_subtotal_cents + high_element_surcharge_cents

      # Worked example (canonical fixture):
      #   band_input = 35706 -> rate 0.05
      #   surcharge  = ceil(17205 * 0.05) = ceil(860.25) = 861
      #   quoted_total_cents = 35706 + 861 = 36567
      # A re-resolving implementation reads the post-surcharge total 36567,
      # lands in the >= 36000 band, and produces surcharge 517 / total 36223.
    input_set: "The HIGH_ELEMENT line amounts already rounded by booking_quote_subtotal; the band input is the whole pre-surcharge subtotal, not just the high-element portion."
    constants:
      SURCHARGE_BAND_1_MAX_CENTS: 30000
      SURCHARGE_BAND_2_MAX_CENTS: 36000
      SURCHARGE_RATE_BAND_1: 0.06
      SURCHARGE_RATE_BAND_2: 0.05
      SURCHARGE_RATE_BAND_3: 0.03
    precision: "Integer cents, ceil (the operator never absorbs a partial cent of high-element risk loading)."

  - name: booking_deposit_requirement
    trigger: "POST /challenge-course/bookings/{booking_id}/quote"
    algorithm: aggregation
    formula: |
      deposit_required_cents = ceil(quoted_total_cents * DEPOSIT_PCT)
      # canonical fixture: ceil(36567 * 0.25) = ceil(9141.75) = 9142
      required_chaperone_count = ceil(minor_head_count / CHAPERONE_RATIO_MINORS)
      where minor_head_count =
        count(Participant p WHERE p.booking_id == booking.id
                              AND p.is_chaperone == false
                              AND p.age_years < ADULT_AGE_YEARS)
      # 4 minors -> 1 ; 10 minors -> 1 ; 11 minors -> 2 ; 0 minors -> 0
    input_set: "Non-chaperone participants of the booking, counted regardless of screening_status (a screening-blocked minor still needs supervision on site)."
    constants:
      DEPOSIT_PCT: 0.25
      CHAPERONE_RATIO_MINORS: 10
      ADULT_AGE_YEARS: 18
    precision: "Integer cents, ceil. Chaperone count is a whole-person ceil."

  - name: booking_cancellation_settlement
    trigger: "POST /challenge-course/bookings/{booking_id}/cancel"
    algorithm: threshold
    formula: |
      notice_days = date_diff_days(booking.program_date, clock_date)   # may be negative
      variant = OPERATOR_WEATHER_INITIATED if booking.status == WEATHER_HOLD
                else CLIENT_INITIATED

      if variant == CLIENT_INITIATED:
          if   notice_days >= 30: pct = 0.00
          elif notice_days >= 14: pct = 0.25       # 14 .. 29
          elif notice_days >=  7: pct = 0.50       #  7 .. 13
          else:                   pct = 1.00       # 6 or fewer, including negative
          gross_fee_cents = round_half_up(booking.deposit_allocated_cents * pct)
      else:
          gross_fee_cents = WEATHER_ADMIN_FEE_CENTS

      cancellation_fee_cents = min(gross_fee_cents, booking.deposit_allocated_cents)
      refund_cents           = booking.deposit_allocated_cents - cancellation_fee_cents
      # ledger moves (see compensating invariant client_funds_conservation):
      #   booking.retained_cents          += cancellation_fee_cents
      #   booking.deposit_allocated_cents  = 0
      #   group_client.credit_balance_cents += refund_cents
    input_set: "The single booking being cancelled and its currently allocated deposit. Bookings that never reached CONFIRMED have deposit_allocated_cents == 0, so both variants settle to a zero fee and a zero refund."
    constants:
      NOTICE_TIER_FULL_REFUND_DAYS: 30
      NOTICE_TIER_QUARTER_DAYS: 14
      NOTICE_TIER_HALF_DAYS: 7
      WEATHER_ADMIN_FEE_CENTS: 2500
    precision: "Integer cents, round_half_up on the percentage fee, then capped at the allocated deposit (the fee can never exceed money actually held)."
    variants:
      - name: client_initiated
        when: "The group cancels a booking in DRAFT, QUOTED, CONFIRMED or AT_RISK"
        difference: "Fee is a notice-day percentage of the allocated deposit, so it ranges from 0% to 100% of money held."
      - name: operator_weather_initiated
        when: "The booking is in WEATHER_HOLD because Cascade C closed the course"
        difference: "The notice tier is ignored entirely and a flat WEATHER_ADMIN_FEE_CENTS is retained. At 10 days notice on a 9142-cent deposit the two variants diverge: 4571 (client) vs 2500 (weather), a 2071-cent delta on identical booking data."

  - name: element_retirement_forecast
    trigger: "POST /challenge-course/elements; POST /challenge-course/program-blocks/{program_block_id}/complete (cycles credited); POST /challenge-course/courses/{course_id}/daily-open"
    algorithm: forward_looking
    formula: |
      calendar_life_date = installed_on + DESIGN_LIFE_YEARS[element_type] years

      days_in_service    = max(1, date_diff_days(clock_date, installed_on))
      avg_cycles_per_day = cumulative_cycle_count / days_in_service        # exact rational
      remaining_cycles   = cycle_life_limit - cumulative_cycle_count
      #                    cycle_life_limit == DESIGN_CYCLE_LIMIT[element_type], stamped at creation

      if remaining_cycles <= 0:
          usage_life_date = clock_date
      elif avg_cycles_per_day == 0:
          usage_life_date = calendar_life_date       # no usage history to project from
      else:
          usage_life_date = clock_date + ceil(remaining_cycles / avg_cycles_per_day) days

      retirement_forecast_date = min(calendar_life_date, usage_life_date)
      retirement_basis = CALENDAR if calendar_life_date <= usage_life_date else USAGE
      # ties resolve to CALENDAR (the fixed manufacturer limit wins over a projection)

      # Worked example (element H, HIGH_ELEMENT, installed_on 2024-08-10, clock 2026-08-10):
      #   calendar_life_date = 2036-08-10
      #   days_in_service    = 730 ; cumulative_cycle_count = 14600 -> avg 20.0/day
      #   remaining          = 21900 - 14600 = 7300 -> ceil(365.0) = 365 days
      #   usage_life_date    = 2027-08-10
      #   forecast = 2027-08-10, basis USAGE  (the CALENDAR-only answer is 2036-08-10)
    input_set: "One Element. cumulative_cycle_count is credited only by COMPLETED program blocks (ABANDONED and SUSPENDED blocks never credit cycles), plus the initial_cycle_count supplied at creation."
    constants:
      DESIGN_LIFE_YEARS:
        GROUND_INITIATIVE: 20
        LOW_ELEMENT: 15
        HIGH_ELEMENT: 12
        CLIMBING_WALL: 15
        ZIP_LINE: 10
      DESIGN_CYCLE_LIMIT:
        GROUND_INITIATIVE: 43800
        LOW_ELEMENT: 29200
        HIGH_ELEMENT: 21900
        CLIMBING_WALL: 25550
        ZIP_LINE: 18250
    precision: "Whole days, ceil on the projected day count (a partial day of remaining life never buys an extra day of service). Dates are UTC calendar dates."
    variants:
      - name: calendar_basis
        when: "installed_on + DESIGN_LIFE_YEARS is the earlier of the two dates, or there is no usage history to project"
        difference: "Retirement is driven purely by the manufacturer's design life and is completely insensitive to cumulative_cycle_count."
      - name: usage_basis
        when: "The projected cycle-exhaustion date is earlier than the calendar-life date"
        difference: "Retirement accelerates every time a block completes and credits cycles. On the canonical element the two variants disagree by more than nine years (2027-08-10 vs 2036-08-10), and only the USAGE answer makes the element life-expire during the booking horizon."

  - name: equipment_retirement_forecast
    trigger: "POST /challenge-course/belay-equipment; POST /challenge-course/belay-equipment/{equipment_id}/log-usage; POST /challenge-course/program-blocks/{program_block_id}/complete; POST /challenge-course/courses/{course_id}/daily-open"
    algorithm: forward_looking
    formula: |
      mfg_expiry_date = manufactured_on + MFG_SHELF_LIFE_YEARS[equipment_kind] years
      svc_expiry_date = first_use_on is null
                        ? null
                        : first_use_on + SERVICE_LIFE_YEARS[equipment_kind] years

      retirement_forecast_date = svc_expiry_date is null
                                 ? mfg_expiry_date
                                 : min(mfg_expiry_date, svc_expiry_date)

      if usage_cycles >= max_cycles:      retirement_basis = CYCLE
      elif svc_expiry_date is null:       retirement_basis = MANUFACTURE
      elif mfg_expiry_date <= svc_expiry_date: retirement_basis = MANUFACTURE
      else:                               retirement_basis = SERVICE
      # CYCLE outranks both date bases: an exhausted item is retired today
      # regardless of how much shelf or service life the dates still allow.

      # Worked examples:
      #   ROPE manufactured_on 2018-08-10 (shelf 10y -> 2028-08-10),
      #        first_use_on   2022-08-10 (service 5y -> 2027-08-10)
      #     -> forecast 2027-08-10, basis SERVICE
      #   ROPE manufactured_on 2017-06-01 (shelf 10y -> 2027-06-01),
      #        first_use_on   2023-08-10 (service 5y -> 2028-08-10)
      #     -> forecast 2027-06-01, basis MANUFACTURE
    input_set: "One BelayEquipment row. first_use_on is stamped by the first log-usage call or the first crediting block completion; unrigged stock with a null first_use_on is scored on shelf life alone."
    constants:
      MFG_SHELF_LIFE_YEARS:
        ROPE: 10
        HARNESS: 10
        CARABINER: 15
        LANYARD: 8
      SERVICE_LIFE_YEARS:
        ROPE: 5
        HARNESS: 7
        CARABINER: 10
        LANYARD: 5
    precision: "Whole UTC calendar dates. Anniversary arithmetic; a 29 February manufacture date rolls to 28 February in a non-leap expiry year."

  - name: block_supervision_requirement
    trigger: "POST /challenge-course/program-blocks/{program_block_id}/block-assignments; POST /challenge-course/program-blocks/{program_block_id}/start"
    algorithm: aggregation
    formula: |
      active_heads =
        count(Participant p WHERE p.booking_id == block.booking_id
                              AND p.is_chaperone == false
                              AND p.screening_status == ELIGIBLE)

      # --- nested aggregate: a max over a set of independently aggregated
      # --- dimensions, one of which is itself a per-element ratio and one of
      # --- which is a fixed per-phase floor. Every dimension must be
      # --- evaluated; taking only the ratio (the "obvious" one) understates
      # --- the requirement on high elements.
      ratio_need  = block.element_id is null
                    ? 0
                    : ceil(active_heads / RATIO_BY_ELEMENT_TYPE[element.element_type])
      phase_floor = MIN_FACILITATORS_BY_PHASE[block.phase]
      type_floor  = element.element_type IN {HIGH_ELEMENT, CLIMBING_WALL, ZIP_LINE} ? 2 : 0
      required_facilitator_count = max(ratio_need, phase_floor, type_floor)

      # --- second aggregate over the assignment set: certification capacity
      assigned = [ a in BlockAssignment WHERE a.program_block_id == block.id ]
      assigned_facilitator_count = count(assigned)
      supervision_capacity = sum over a in assigned of
                               SUPERVISION_CAPACITY_BY_LEVEL[
                                 Facilitator(a.facilitator_id).certification_level ]
      supervision_capacity_ok = supervision_capacity >= active_heads

      # Worked example (HIGH_ELEMENT block, 4 ELIGIBLE non-chaperone heads):
      #   ratio_need  = ceil(4/6) = 1
      #   phase_floor = 2  (MIN_FACILITATORS_BY_PHASE[HIGH_ELEMENT])
      #   type_floor  = 2
      #   required_facilitator_count = 2      (ratio-only would say 1)
      # Worked example (ZIP_LINE block, 13 heads): ceil(13/4)=4 -> required 4
      # Worked example (LOW_ELEMENT block, 4 heads): max(ceil(4/10)=1, 1, 0) = 1
    input_set: "ELIGIBLE non-chaperone participants of the owning booking, and every BlockAssignment on the block regardless of the assigned facilitator's cert_status (cert_status is a separate gate that produces ERR_FACILITATOR_CERT_INACTIVE)."
    constants:
      RATIO_BY_ELEMENT_TYPE:
        GROUND_INITIATIVE: 12
        LOW_ELEMENT: 10
        HIGH_ELEMENT: 6
        CLIMBING_WALL: 5
        ZIP_LINE: 4
      MIN_FACILITATORS_BY_PHASE:
        ICEBREAKER: 1
        GROUND_INITIATIVE: 1
        LOW_ELEMENT: 1
        HIGH_ELEMENT: 2
        DEBRIEF: 1
      SUPERVISION_CAPACITY_BY_LEVEL:
        LEVEL_1: 8
        LEVEL_2: 12
        LEVEL_3: 16
      HIGH_RISK_TYPE_FLOOR: 2
    precision: "Whole facilitators, ceil on the ratio. No averaging across blocks."

  - name: facilitator_certification_gate
    trigger: "POST /challenge-course/program-blocks/{program_block_id}/block-assignments; POST /challenge-course/program-blocks/{program_block_id}/start"
    algorithm: threshold
    formula: |
      required_level = REQUIRED_CERT_LEVEL_BY_ELEMENT_TYPE[element.element_type]
                       if block.element_id is not null else LEVEL_1
      level_rank = { LEVEL_1: 1, LEVEL_2: 2, LEVEL_3: 3 }
      cert_level_ok = level_rank[facilitator.certification_level] >= level_rank[required_level]
      # A ZIP_LINE element demands LEVEL_3; a LEVEL_2 facilitator is refused
      # with ERR_CERT_LEVEL_INSUFFICIENT even though the ratio is satisfied.
    input_set: "One Facilitator and the Element rigged to the block. Blocks with a null element_id (ICEBREAKER, DEBRIEF) require LEVEL_1."
    constants:
      REQUIRED_CERT_LEVEL_BY_ELEMENT_TYPE:
        GROUND_INITIATIVE: LEVEL_1
        LOW_ELEMENT: LEVEL_1
        HIGH_ELEMENT: LEVEL_2
        CLIMBING_WALL: LEVEL_2
        ZIP_LINE: LEVEL_3
    precision: "Exact ordinal comparison on the three-level ladder."

  - name: facilitator_cert_status
    trigger: "POST /challenge-course/facilitators; POST /challenge-course/training-records; POST /challenge-course/courses/{course_id}/daily-open"
    algorithm: threshold
    formula: |
      # ordered first-match; the expiry clause outranks the currency clauses
      if cert_expires_on < clock_date:
          cert_status = LAPSED
      elif rescue_drill_last_passed_on is null
           or date_diff_days(clock_date, rescue_drill_last_passed_on) > RESCUE_DRILL_VALID_DAYS
           or refresher_hours_24mo < REFRESHER_HOURS_REQUIRED:
          cert_status = PROBATION
      else:
          cert_status = ACTIVE

      rescue_current = (cert_status == ACTIVE)
      # exactly RESCUE_DRILL_VALID_DAYS days since the drill is still current;
      # one day more is not
    input_set: "One Facilitator, with refresher_hours_24mo maintained as the sum of hours from TrainingRecords of kind REFRESHER whose completed_on is within 730 days of clock_date."
    constants:
      RESCUE_DRILL_VALID_DAYS: 180
      REFRESHER_HOURS_REQUIRED: 8
      REFRESHER_WINDOW_DAYS: 730
    precision: "Whole days on UTC calendar dates; the drill-age comparison is `> 180` so day 180 exactly is still current."

  - name: participant_screening_status
    trigger: "POST /challenge-course/participants; POST /challenge-course/participants/{participant_id}/screening-packet; POST /challenge-course/participants/{participant_id}/medical-clearance"
    algorithm: threshold
    formula: |
      # ordered first-match; BLOCKED outranks CONDITIONAL
      is_minor = age_years < ADULT_AGE_YEARS
      if agreement_signed == false
         or health_form_status == MISSING
         or (is_minor and guardian_signature_provided == false):
          screening_status = BLOCKED
      elif health_form_status == FLAGGED and medical_clearance_granted == false:
          screening_status = CONDITIONAL
      else:
          screening_status = ELIGIBLE
      # A CLEARED flag plus a signed agreement plus (for minors) a guardian
      # signature is the only route to ELIGIBLE for a flagged participant.
    input_set: "One Participant."
    constants:
      ADULT_AGE_YEARS: 18
      BLOCKING_HEALTH_FLAGS: [CARDIAC, SEIZURE, PREGNANCY, RECENT_SURGERY]
    precision: "Exact enum comparison; age_years is the whole-year age derived from birth_date on the booking's program_date, so a participant who turns 18 between creation and the program date counts as an adult."

  - name: booking_roster_status
    trigger: "POST /challenge-course/participants; POST /challenge-course/participants/{participant_id}/screening-packet; POST /challenge-course/participants/{participant_id}/medical-clearance"
    algorithm: aggregation
    formula: |
      participants = [ p in Participant WHERE p.booking_id == booking.id ]
      if count(participants) == 0:                          roster_status = INCOMPLETE
      elif any p with p.screening_status IN {BLOCKED, CONDITIONAL}:
                                                            roster_status = BLOCKED
      elif count(p WHERE p.is_chaperone == false) == 0:      roster_status = INCOMPLETE
      else:                                                 roster_status = READY
      blocked_participant_count = count(p WHERE p.screening_status IN {BLOCKED, CONDITIONAL})
      # A roster of chaperones only is INCOMPLETE, never READY.
    input_set: "Every Participant of the booking, chaperones included. Participants are never deleted, so roster_status can move READY -> BLOCKED when a new unscreened participant is added."
    constants: {}
    precision: "Exact counts; no rounding."

  - name: element_belay_readiness
    trigger: "POST /challenge-course/belay-equipment; POST /challenge-course/belay-equipment/{equipment_id}/log-usage; any Element or BelayEquipment status change; POST /challenge-course/courses/{course_id}/daily-open"
    algorithm: aggregation
    formula: |
      required_belay_set_count = REQUIRED_BELAY_SETS_BY_TYPE[element.element_type]

      usable = [ e in BelayEquipment
                 WHERE e.assigned_element_id == element.id
                   AND e.status == IN_SERVICE
                   AND e.retirement_forecast_date > clock_date
                   AND e.usage_cycles < e.max_cycles ]
      quarantined_here = count(e WHERE e.assigned_element_id == element.id
                                   AND e.status == QUARANTINED)

      belay_ready = (count(usable) >= required_belay_set_count)
                    and (quarantined_here == 0)

      # An element with required_belay_set_count == 0 and ZERO rigged
      # equipment is belay_ready == true: the empty set trivially satisfies a
      # zero requirement. An element with required_belay_set_count == 2 and
      # zero rigged equipment is NOT ready -- the empty set is the boundary
      # case that a naive "no quarantined items -> ready" check gets wrong.
    input_set: "BelayEquipment rows whose assigned_element_id points at this element. Unrigged stock (assigned_element_id null) never counts toward any element's readiness."
    constants:
      REQUIRED_BELAY_SETS_BY_TYPE:
        GROUND_INITIATIVE: 0
        LOW_ELEMENT: 0
        HIGH_ELEMENT: 2
        CLIMBING_WALL: 2
        ZIP_LINE: 3
    precision: "Exact counts. The life comparison is strict (`>` clock_date), so equipment whose forecast date equals today is already unusable."

  - name: weather_posture_signals
    trigger: "POST /challenge-course/weather-observations; POST /challenge-course/courses/{course_id}/daily-open"
    algorithm: threshold
    formula: |
      # ---- lightning ------------------------------------------------------
      if lightning_distance_km is not null and lightning_distance_km <= LIGHTNING_STOP_KM:
          course.lightning_hold_until = max(course.lightning_hold_until or observed_at,
                                            observed_at + LIGHTNING_HOLD_MINUTES minutes)
          lightning_signal = STOP
      elif lightning_distance_km is not null and lightning_distance_km <= LIGHTNING_WATCH_KM:
          lightning_signal = WATCH
      else:
          lightning_signal = NONE
      # 8.0 km exactly is a STOP (comparison is `<=`); 8.1 km is a WATCH.
      # A later, farther strike NEVER shortens an existing hold -- the hold
      # window only ever extends (max), so a 30-minute clock restarts on each
      # close strike.

      # ---- wind / temperature --------------------------------------------
      wind_signal = STOP  if wind_speed_kph >= WIND_STOP_KPH
                    else WATCH if wind_speed_kph >= WIND_WATCH_KPH
                    else NONE
      cold_signal = STOP  if air_temp_c <= TEMP_STOP_C else NONE
      # 48.0 kph exactly is a STOP; 47.9 is a WATCH. -12.0 C exactly is a STOP.

      lightning_hold_active = course.lightning_hold_until is not null
                              and course.lightning_hold_until > clock_now
    input_set: "The observation being recorded, plus the course's existing lightning_hold_until. Expired holds are cleared by the daily-open checkpoint before posture is recomputed."
    constants:
      LIGHTNING_STOP_KM: 8.0
      LIGHTNING_WATCH_KM: 16.0
      LIGHTNING_HOLD_MINUTES: 30
      WIND_STOP_KPH: 48.0
      WIND_WATCH_KPH: 32.0
      TEMP_STOP_C: -12.0
    precision: "Distances and speeds to 1 decimal place; all thresholds are inclusive (`<=` for lightning and temperature, `>=` for wind). Hold windows are whole minutes in UTC."

  - name: course_posture
    trigger: "Recomputed at the end of every write that can change a signal: POST /challenge-course/weather-observations, POST /challenge-course/courses/{course_id}/daily-open, every Element / BelayEquipment / Incident transition"
    algorithm: constraint_propagation
    formula: |
      # ORDERED first-match. The first clause that fires sets both posture and
      # posture_reason; later clauses are not evaluated. This ordering is
      # observable: a course that is both lightning-stopped and
      # inspection-overdue reports LIGHTNING_STOP, not INSPECTION_OVERDUE.
      rescue_ready_facilitator_count =
        count(Facilitator f WHERE f.course_id == course.id
                              AND f.cert_status == ACTIVE)
      rescue_readiness_ok = rescue_ready_facilitator_count >= RESCUE_READY_MINIMUM
                            and course.ems_response_minutes <= EMS_MAX_MINUTES

      1. lightning_hold_active                          -> CLOSED,     LIGHTNING_STOP
      2. latest_wind_speed_kph >= 48.0                  -> CLOSED,     WIND_STOP
      3. latest_air_temp_c <= -12.0                     -> CLOSED,     COLD_STOP
      4. next_professional_inspection_due_on < clock_date -> CLOSED,   INSPECTION_OVERDUE
      5. rescue_readiness_ok == false                   -> CLOSED,     RESCUE_READINESS
      6. exists Incident (course, severity SERIOUS, status UNDER_REVIEW)
                                                        -> RESTRICTED, SERIOUS_INCIDENT
      7. restricted_element_count > 0
         or out_of_service_element_count > 0             -> RESTRICTED, ELEMENT_RESTRICTED
      8. 8.0 < latest_lightning_distance_km <= 16.0     -> RESTRICTED, LIGHTNING_WATCH
      9. 32.0 <= latest_wind_speed_kph < 48.0           -> RESTRICTED, WIND_WATCH
      10. otherwise                                     -> OPEN,       NONE

      next_professional_inspection_due_on(course) =
        min over Element e WHERE e.course_id == course.id
                             AND e.status != RETIRED
            of e.next_professional_inspection_due_on
        (null when the course has no non-retired elements, which cannot fire clause 4)
    input_set: "All non-RETIRED Elements of the course, all Facilitators of the course, all non-closed Incidents of the course, and the course's latest weather signals."
    constants:
      RESCUE_READY_MINIMUM: 2
      EMS_MAX_MINUTES: 30
    precision: "Exact first-match evaluation; no scoring or weighting."

  - name: course_daily_open_checkpoint
    trigger: "POST /challenge-course/courses/{course_id}/daily-open"
    algorithm: chronological
    formula: |
      # A single ordered pass. Later steps read the results of earlier steps,
      # so the order is observable: recomputing posture before the element and
      # equipment sweeps yields a stale posture for the same request.
      step 1: daily_open_index += 1 ; last_daily_open_date = clock_date
      step 2: clear course.lightning_hold_until when it is <= clock_now
      step 3: for each Facilitator of the course, ordered by created_at ASC:
                recompute facilitator_cert_status (may move ACTIVE -> PROBATION/LAPSED)
      step 4: for each Element of the course with status != RETIRED,
                ordered by created_at ASC:
                recompute element_retirement_forecast;
                when retirement_forecast_date <= clock_date and status != OUT_OF_SERVICE:
                  status -> OUT_OF_SERVICE and cascade to its SCHEDULED blocks
      step 5: for each BelayEquipment of the course with status != RETIRED,
                ordered by created_at ASC:
                recompute equipment_retirement_forecast;
                when retirement_forecast_date <= clock_date: status -> RETIRED
      step 6: recompute element_belay_readiness for every non-RETIRED Element,
                ordered by created_at ASC
      step 7: recompute course_posture (reads the results of steps 2-6)
      step 8: when posture == OPEN, release WEATHER_HOLD bookings to CONFIRMED,
                ordered by created_at ASC
      step 9: course.version += 1
    input_set: "Every Facilitator, Element and BelayEquipment of the course, always processed in created_at ASC order — never in id order."
    constants: {}
    precision: "Deterministic ordered pass; a second daily-open on the same clock_date is idempotent for every step except daily_open_index and version."
    variants:
      - name: same_day_repeat
        when: "daily-open is called twice without moving the clock"
        difference: "daily_open_index increments both times and version increments both times, but no entity status changes on the second call — the sweep is convergent."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles, X-User-ID resolves to an existing instance of the backing entity whose discriminator matches the claimed role (Facilitator.staff_type == STAFF_FACILITATOR for Facilitator, CONTRACT_INSPECTOR for ProfessionalInspector, SAFETY_OFFICER with certification_level == LEVEL_3 for SafetyOfficer; GroupClient for GroupCoordinator)"
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all endpoints except POST /challenge-course/courses and POST /_clock/set_current_utc"

  - priority: 4
    category: existence
    check: "Request body parses, all required fields are present, enum values are members of their declared sets, numeric fields are within their declared ranges, pagination limit is 1..100 and offset >= 0, and paired time fields satisfy planned_start_at < planned_end_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "Every path id resolves to an existing row, validated left to right"
    error_id: "ERR_COURSE_NOT_FOUND | ERR_ELEMENT_NOT_FOUND | ERR_FACILITATOR_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_OPERATIONAL_LOG_NOT_FOUND | ERR_GROUP_CLIENT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_PROGRAM_BLOCK_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_TRAINING_RECORD_NOT_FOUND | ERR_BLOCK_ASSIGNMENT_NOT_FOUND | ERR_WEATHER_OBSERVATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /challenge-course/elements, /facilitators, /training-records, /professional-inspections, /operational-logs, /bookings, /participants, /program-blocks, /program-blocks/{program_block_id}/block-assignments, /belay-equipment, /weather-observations, /incidents"

  - priority: 7
    category: auth
    check: "For GroupCoordinator, X-User-ID equals the booking's group_client_id; for Facilitator on an operational log, facilitator_id equals X-User-ID; for ProfessionalInspector on file, X-User-ID equals the inspection's inspector_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /challenge-course/bookings/{booking_id}/confirm, /bookings/{booking_id}/cancel, /participants, /participants/{participant_id}/screening-packet, /operational-logs, /professional-inspections/{inspection_id}/file"

  - priority: 8
    category: state
    check: "expected_booking_version equals the current Booking.version"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /challenge-course/bookings/{booking_id}/quote, POST /challenge-course/participants"

  - priority: 9
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2"
    error_id: "ERR_ELEMENT_NOT_RESTRICTED | ERR_ELEMENT_NOT_SERVICEABLE | ERR_ELEMENT_RETIRED | ERR_INSPECTION_NOT_DRAFT | ERR_INSPECTION_NOT_FILED | ERR_BOOKING_NOT_QUOTABLE | ERR_BOOKING_NOT_CONFIRMABLE | ERR_BOOKING_NOT_CONFIRMED | ERR_BOOKING_ALREADY_TERMINAL | ERR_BLOCK_NOT_SCHEDULED | ERR_BLOCK_NOT_IN_PROGRESS | ERR_INCIDENT_NOT_REPORTED | ERR_INCIDENT_NOT_UNDER_REVIEW | ERR_EQUIPMENT_RETIRED | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 10
    category: auth
    check: "Segregation of duties: the acting X-User-ID is not the same person who created the artefact being accepted — return-to-service actor != the restricting log's facilitator_id, dispose actor != the inspection's inspector_id, incident-close actor != reported_by_facilitator_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /challenge-course/elements/{element_id}/return-to-service, POST /challenge-course/professional-inspections/{inspection_id}/dispose, POST /challenge-course/incidents/{incident_id}/close"

  - priority: 11
    category: business_safety
    check: "Course posture permits the operation: posture != CLOSED for any block start, and posture == OPEN for a HIGH_ELEMENT block start"
    error_id: "ERR_COURSE_CLOSED | ERR_COURSE_RESTRICTED_HIGH_ELEMENT"
    http_status: 409
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 12
    category: business_safety
    check: "The rigged element carries a CLEAR operational inspection log dated today with no later non-CLEAR log"
    error_id: ERR_DAILY_INSPECTION_MISSING
    http_status: 409
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 13
    category: business_safety
    check: "The element's professional inspection is not past due relative to the booking's program_date"
    error_id: ERR_INSPECTION_OVERDUE
    http_status: 409
    applies_to: "POST /challenge-course/bookings/{booking_id}/confirm, POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 14
    category: business_safety
    check: "element_belay_readiness holds for the rigged element (enough usable in-service sets, none quarantined)"
    error_id: ERR_BELAY_NOT_READY
    http_status: 409
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 15
    category: business_safety
    check: "Rescue readiness: the course has at least RESCUE_READY_MINIMUM ACTIVE facilitators and, for a HIGH_ELEMENT block, at least one assigned facilitator whose rescue drill is current"
    error_id: ERR_RESCUE_READINESS_UNMET
    http_status: 409
    applies_to: "POST /challenge-course/bookings/{booking_id}/confirm, POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 16
    category: business_safety
    check: "Emergency medical access: course.ems_response_minutes <= EMS_MAX_MINUTES for a HIGH_ELEMENT block start"
    error_id: ERR_EMS_ACCESS_UNSUITABLE
    http_status: 409
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 17
    category: business_safety
    check: "No open Incident (REPORTED or UNDER_REVIEW) references the element being returned to service"
    error_id: ERR_OPEN_INCIDENT_BLOCKS_SERVICE
    http_status: 409
    applies_to: "POST /challenge-course/elements/{element_id}/return-to-service"

  - priority: 18
    category: business_safety
    check: "The defect that restricted the element has been cleared: the newest operational log for the element has result == CLEAR (RESTRICTED path), or the element's latest disposed inspection outcome is PASS (OUT_OF_SERVICE path)"
    error_id: ERR_DEFECT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /challenge-course/elements/{element_id}/return-to-service"

  - priority: 19
    category: business_safety
    check: "Every participant of the booking has screening_status == ELIGIBLE (none BLOCKED or CONDITIONAL) and the booking has at least one participant"
    error_id: ERR_PARTICIPANT_SCREENING_INCOMPLETE
    http_status: 422
    applies_to: "POST /challenge-course/bookings/{booking_id}/confirm, POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 20
    category: business_safety
    check: "Every eligible participant's weight_kg is within the rigged element's [min_participant_weight_kg, max_participant_weight_kg] inclusive band"
    error_id: ERR_WEIGHT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 21
    category: business_safety
    check: "assigned_facilitator_count >= required_facilitator_count and supervision_capacity_ok"
    error_id: ERR_SUPERVISION_RATIO_UNMET
    http_status: 422
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 22
    category: business_safety
    check: "Every facilitator assigned to the block has cert_status == ACTIVE"
    error_id: ERR_FACILITATOR_CERT_INACTIVE
    http_status: 422
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/block-assignments, POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 23
    category: business_referential
    check: "The facilitator's certification_level meets REQUIRED_CERT_LEVEL_BY_ELEMENT_TYPE for the element rigged to the block"
    error_id: ERR_CERT_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/block-assignments"

  - priority: 24
    category: business_referential
    check: "The facilitator belongs to the same course as the element / booking being staffed"
    error_id: ERR_FACILITATOR_COURSE_MISMATCH
    http_status: 422
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/block-assignments, POST /challenge-course/operational-logs"

  - priority: 25
    category: business_referential
    check: "The inspector on a professional inspection has staff_type == CONTRACT_INSPECTOR, is_operator_employee == false and cert_status == ACTIVE"
    error_id: ERR_INSPECTOR_NOT_INDEPENDENT
    http_status: 422
    applies_to: "POST /challenge-course/professional-inspections"

  - priority: 26
    category: business_referential
    check: "The block's phase matches the rigged element's element_type family: ICEBREAKER and DEBRIEF require element_id == null; GROUND_INITIATIVE requires a GROUND_INITIATIVE element; LOW_ELEMENT requires a LOW_ELEMENT element; HIGH_ELEMENT requires HIGH_ELEMENT, CLIMBING_WALL or ZIP_LINE"
    error_id: ERR_ELEMENT_PHASE_MISMATCH
    http_status: 422
    applies_to: "POST /challenge-course/program-blocks"

  - priority: 27
    category: business_referential
    check: "The element belongs to the same course as the booking"
    error_id: ERR_ELEMENT_COURSE_MISMATCH
    http_status: 422
    applies_to: "POST /challenge-course/program-blocks, POST /challenge-course/belay-equipment"

  - priority: 28
    category: business_constraint
    check: "Program sequencing: sequence_index is unique within the booking, the first block must be phase ICEBREAKER, a HIGH_ELEMENT block requires an earlier GROUND_INITIATIVE or LOW_ELEMENT block in the same booking, and sequence_index values must form a gap-free run starting at 1"
    error_id: "ERR_DUPLICATE_BLOCK_SEQUENCE | ERR_SEQUENCING_VIOLATION | ERR_SEQUENCE_PREREQUISITE_MISSING | ERR_SEQUENCE_GAP"
    http_status: 422
    applies_to: "POST /challenge-course/program-blocks"

  - priority: 29
    category: business_constraint
    check: "The booking's highest-sequence block has phase == DEBRIEF"
    error_id: ERR_DEBRIEF_BLOCK_MISSING
    http_status: 422
    applies_to: "POST /challenge-course/bookings/{booking_id}/confirm"

  - priority: 30
    category: business_constraint
    check: "A DEBRIEF block cannot be completed without debrief_completed == true"
    error_id: ERR_DEBRIEF_NOT_RECORDED
    http_status: 422
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/complete"

  - priority: 31
    category: business_constraint
    check: "Chaperone coverage: count of is_chaperone participants >= required_chaperone_count"
    error_id: ERR_CHAPERONE_SHORTFALL
    http_status: 422
    applies_to: "POST /challenge-course/bookings/{booking_id}/confirm"

  - priority: 32
    category: business_temporal
    check: "Element occupancy: the new block's [planned_start_at, planned_end_at) half-open interval must not overlap any non-terminal block on the same element. Adjacency is allowed — a block ending at 10:30 and another starting at 10:30 on the same element is accepted."
    error_id: ERR_ELEMENT_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /challenge-course/program-blocks"

  - priority: 33
    category: business_temporal
    check: "Facilitator turnaround: a facilitator's new assignment is refused when the later block starts before the earlier block ends plus FACILITATOR_BUFFER_MINUTES (20). A block ending at 15:00 permits a next assignment starting at 15:20 exactly, but refuses one starting at 15:10."
    error_id: ERR_FACILITATOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/block-assignments"

  - priority: 34
    category: business_temporal
    check: "The booking's program_date is at least MIN_LEAD_DAYS (3) days after clock_date at creation, and blocks' planned times fall on program_date"
    error_id: ERR_PROGRAM_DATE_IN_PAST
    http_status: 409
    applies_to: "POST /challenge-course/bookings, POST /challenge-course/program-blocks"

  - priority: 35
    category: business_constraint
    check: "Sequential start order: every lower-sequence block of the same booking is already COMPLETED or ABANDONED"
    error_id: ERR_BLOCK_SEQUENCE_NOT_READY
    http_status: 409
    applies_to: "POST /challenge-course/program-blocks/{program_block_id}/start"

  - priority: 36
    category: business_constraint
    check: "Retirement criteria on retire: at least one of retirement_forecast_date <= clock_date, consecutive_conditional_count >= 2, or latest_inspection_outcome == FAIL; and the element carries no non-terminal program blocks. Return-to-service from OUT_OF_SERVICE additionally requires retirement_forecast_date > clock_date (a life-expired element can never come back), but never inspects program blocks -- restoring blocked blocks is the whole point of that call."
    error_id: "ERR_RETIREMENT_CRITERIA_NOT_MET | ERR_ELEMENT_HAS_ACTIVE_BLOCKS"
    http_status: 409
    applies_to: "POST /challenge-course/elements/{element_id}/retire (both clauses), POST /challenge-course/elements/{element_id}/return-to-service (life-expiry clause only)"

  - priority: 37
    category: business_fiscal
    check: "GroupClient.credit_balance_cents >= deposit_required_cents"
    error_id: ERR_INSUFFICIENT_CLIENT_CREDIT
    http_status: 402
    applies_to: "POST /challenge-course/bookings/{booking_id}/confirm"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Course ---------------------------------------------------------------
  - method: POST
    path: "/challenge-course/courses"
    description: "Register a challenge course site with its emergency-medical access profile."
    roles: [ProgramDirector]
    code: 201
    input: [course_name, ems_response_minutes, ems_access_note]
    output: Course
    side_effects: ["posture initialised to OPEN with posture_reason NONE", "daily_open_index 0", "all derived counters 0", "rescue_readiness_ok computed from course_posture (false until two ACTIVE facilitators exist)"]

  - method: GET
    path: "/challenge-course/courses/{course_id}"
    description: "Read a course with its live posture, counters and rescue-readiness flags."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, ProfessionalInspector, GroupCoordinator]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: POST
    path: "/challenge-course/courses/{course_id}/daily-open"
    description: "Run the ordered daily opening checkpoint (calculations.course_daily_open_checkpoint)."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Course
    side_effects: ["daily_open_index += 1", "expired lightning holds cleared", "facilitator cert statuses recomputed", "element and equipment retirement forecasts recomputed, life-expired items moved OUT_OF_SERVICE / RETIRED", "belay readiness recomputed", "posture recomputed", "WEATHER_HOLD bookings released to CONFIRMED", "version += 1"]

  - method: GET
    path: "/challenge-course/courses/{course_id}/facilitators"
    description: "List the facilitators rostered to a course (reverse lookup for Facilitator.course_id)."
    roles: [ProgramDirector, SafetyOfficer]
    code: 200
    input: ["cert_status?", "limit?", "offset?"]
    output: Facilitator[]
    side_effects: []

  - method: GET
    path: "/challenge-course/courses/{course_id}/weather-observations"
    description: "List the weather observations recorded for a course, newest first (reverse lookup for WeatherObservation.course_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: ["limit?", "offset?"]
    output: WeatherObservation[]
    side_effects: []

  # ---- Element --------------------------------------------------------------
  - method: POST
    path: "/challenge-course/elements"
    description: "Install an element on a course, seeding its inspection due date and cycle history."
    roles: [ProgramDirector]
    code: 201
    input: [course_id, element_name, element_type, installed_on, next_professional_inspection_due_on, min_participant_weight_kg, max_participant_weight_kg, "initial_cycle_count?"]
    output: Element
    side_effects: ["status SERVICEABLE", "cumulative_cycle_count = initial_cycle_count (default 0)", "element_retirement_forecast computed", "required_belay_set_count set from REQUIRED_BELAY_SETS_BY_TYPE", "element_belay_readiness computed", "course posture recomputed"]

  - method: GET
    path: "/challenge-course/elements/{element_id}"
    description: "Read an element with its retirement forecast, belay readiness and restriction pointer."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, ProfessionalInspector]
    code: 200
    input: []
    output: Element
    side_effects: []

  - method: GET
    path: "/challenge-course/elements"
    description: "List elements, filterable by course, status, type, or the operational log that restricted them (reverse lookup for Element.course_id and Element.restricting_log_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, ProfessionalInspector]
    code: 200
    input: ["course_id?", "status?", "element_type?", "restricting_log_id?", "limit?", "offset?"]
    output: Element[]
    side_effects: []

  - method: POST
    path: "/challenge-course/elements/{element_id}/return-to-service"
    description: "Return a restricted or out-of-service element to service after the defect is cleared. Segregated from whoever raised the defect."
    roles: [SafetyOfficer]
    code: 200
    input: [note]
    output: Element
    side_effects: ["status -> SERVICEABLE", "restricting_log_id cleared", "quarantined rigged equipment returns to IN_SERVICE", "BLOCKED_UNSAFE blocks -> SCHEDULED", "AT_RISK bookings -> CONFIRMED", "course counters and posture recomputed"]

  - method: POST
    path: "/challenge-course/elements/{element_id}/retire"
    description: "Permanently retire an element that meets a retirement criterion."
    roles: [ProgramDirector]
    code: 200
    input: [reason]
    output: Element
    side_effects: ["status -> RETIRED (terminal)", "rigged equipment unrigged and quarantined", "course counters, inspection due date and posture recomputed"]

  # ---- Professional inspection ---------------------------------------------
  - method: POST
    path: "/challenge-course/professional-inspections"
    description: "Open a professional inspection record for an element, naming the independent inspector."
    roles: [ProgramDirector, ProfessionalInspector]
    code: 201
    input: [element_id, inspector_id, performed_on, "findings_note?"]
    output: ProfessionalInspection
    side_effects: ["status DRAFT", "inspector independence validated (ERR_INSPECTOR_NOT_INDEPENDENT)"]

  - method: GET
    path: "/challenge-course/professional-inspections/{inspection_id}"
    description: "Read a professional inspection record."
    roles: [ProgramDirector, SafetyOfficer, ProfessionalInspector]
    code: 200
    input: []
    output: ProfessionalInspection
    side_effects: []

  - method: GET
    path: "/challenge-course/professional-inspections"
    description: "List professional inspections, filterable by element or inspector (reverse lookup for ProfessionalInspection.element_id and .inspector_id)."
    roles: [ProgramDirector, SafetyOfficer, ProfessionalInspector]
    code: 200
    input: ["element_id?", "inspector_id?", "status?", "outcome?", "limit?", "offset?"]
    output: ProfessionalInspection[]
    side_effects: []

  - method: POST
    path: "/challenge-course/professional-inspections/{inspection_id}/file"
    description: "File the inspection outcome. The three outcomes fork to three different filed states with different element effects."
    roles: [ProfessionalInspector]
    code: 200
    input: [outcome]
    output: ProfessionalInspection
    side_effects: ["status -> FILED_PASS | FILED_CONDITIONAL | FILED_FAIL", "CONDITIONAL restricts the element", "FAIL drives the element OUT_OF_SERVICE and fires the equipment-quarantine cascade", "course posture recomputed"]

  - method: POST
    path: "/challenge-course/professional-inspections/{inspection_id}/dispose"
    description: "Accept a filed inspection and apply its inspection-cycle consequences. Cannot be performed by the inspector who filed it."
    roles: [SafetyOfficer]
    code: 200
    input: [disposition_note]
    output: ProfessionalInspection
    side_effects: ["status -> DISPOSED", "element next_professional_inspection_due_on shifted +12 months (PASS) or +3 months (CONDITIONAL) or unchanged (FAIL)", "latest_inspection_outcome and consecutive_conditional_count updated", "course posture recomputed"]

  # ---- Operational inspection log ------------------------------------------
  - method: POST
    path: "/challenge-course/operational-logs"
    description: "Record a facilitator's operational (pre-use) inspection of an element. A DEFECT_MAJOR result restricts the element and fires the four-link cascade."
    roles: [Facilitator, SafetyOfficer]
    code: 201
    input: [element_id, facilitator_id, log_date, result, "defect_note?"]
    output: OperationalInspectionLog
    side_effects: ["result CLEAR clears the element's daily-inspection gate for log_date", "result DEFECT_MINOR records the defect without restricting", "result DEFECT_MAJOR sets caused_restriction, restricts the element, blocks dependent SCHEDULED blocks, moves owning CONFIRMED bookings to AT_RISK and recomputes course posture"]

  - method: GET
    path: "/challenge-course/operational-logs/{log_id}"
    description: "Read one operational inspection log."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, ProfessionalInspector]
    code: 200
    input: []
    output: OperationalInspectionLog
    side_effects: []

  - method: GET
    path: "/challenge-course/operational-logs"
    description: "List operational logs, filterable by element, facilitator or date (reverse lookup for OperationalInspectionLog.element_id and .facilitator_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: ["element_id?", "facilitator_id?", "log_date?", "result?", "limit?", "offset?"]
    output: OperationalInspectionLog[]
    side_effects: []

  # ---- Facilitator ---------------------------------------------------------
  - method: POST
    path: "/challenge-course/facilitators"
    description: "Add a facilitator, contract inspector or safety officer to a course roster."
    roles: [ProgramDirector]
    code: 201
    input: [course_id, full_name, staff_type, certification_level, cert_expires_on, is_operator_employee]
    output: Facilitator
    side_effects: ["cert_status computed by facilitator_cert_status (a new hire with no rescue drill starts PROBATION)", "course rescue_ready_facilitator_count, rescue_readiness_ok and posture recomputed"]

  - method: GET
    path: "/challenge-course/facilitators/{facilitator_id}"
    description: "Read a facilitator with certification currency and rescue-drill recency."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, ProfessionalInspector]
    code: 200
    input: []
    output: Facilitator
    side_effects: []

  - method: GET
    path: "/challenge-course/facilitators"
    description: "List facilitators, filterable by course, staff type or certification status (reverse lookup for Facilitator.course_id)."
    roles: [ProgramDirector, SafetyOfficer]
    code: 200
    input: ["course_id?", "staff_type?", "cert_status?", "certification_level?", "limit?", "offset?"]
    output: Facilitator[]
    side_effects: []

  - method: GET
    path: "/challenge-course/facilitators/{facilitator_id}/training-records"
    description: "List a facilitator's training records (reverse lookup for TrainingRecord.facilitator_id)."
    roles: [ProgramDirector, SafetyOfficer]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []

  - method: GET
    path: "/challenge-course/facilitators/{facilitator_id}/block-assignments"
    description: "List the block assignments held by a facilitator (reverse lookup for BlockAssignment.facilitator_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: ["limit?", "offset?"]
    output: BlockAssignment[]
    side_effects: []

  - method: GET
    path: "/challenge-course/block-assignments/{block_assignment_id}"
    description: "Read one block assignment, including the rescue-currency snapshot frozen at assignment time."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: []
    output: BlockAssignment
    side_effects: []

  - method: GET
    path: "/challenge-course/block-assignments"
    description: "List block assignments across the operation, filterable by block or by facilitator (flat reverse lookup for both BlockAssignment foreign keys)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: ["program_block_id?", "facilitator_id?", "assignment_role?", "limit?", "offset?"]
    output: BlockAssignment[]
    side_effects: []

  - method: GET
    path: "/challenge-course/training-records/{training_record_id}"
    description: "Read one training record."
    roles: [ProgramDirector, SafetyOfficer]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []

  - method: GET
    path: "/challenge-course/training-records"
    description: "List training records across the operation, filterable by facilitator and kind (flat reverse lookup for TrainingRecord.facilitator_id)."
    roles: [ProgramDirector, SafetyOfficer]
    code: 200
    input: ["facilitator_id?", "kind?", "completed_on?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []

  - method: POST
    path: "/challenge-course/training-records"
    description: "Record a completed training event (rescue drill, refresher hours or recertification) for a facilitator."
    roles: [ProgramDirector]
    code: 201
    input: [facilitator_id, kind, completed_on, "hours?", "notes?"]
    output: TrainingRecord
    side_effects: ["RESCUE_DRILL updates rescue_drill_last_passed_on", "REFRESHER adds to refresher_hours_24mo", "RECERTIFICATION sets cert_expires_on = completed_on + 24 months", "facilitator_cert_status recomputed (PROBATION <-> ACTIVE, LAPSED -> ACTIVE)", "course rescue_readiness_ok and posture recomputed"]

  # ---- Group client and booking -------------------------------------------
  - method: POST
    path: "/challenge-course/group-clients"
    description: "Register a school, camp or corporate group client with its pricing tier."
    roles: [ProgramDirector]
    code: 201
    input: [client_name, org_type, tier]
    output: GroupClient
    side_effects: ["payments_received_cents 0", "credit_balance_cents 0"]

  - method: GET
    path: "/challenge-course/group-clients/{group_client_id}"
    description: "Read a group client with its funds ledger."
    roles: [ProgramDirector, GroupCoordinator]
    code: 200
    input: []
    output: GroupClient
    side_effects: []

  - method: POST
    path: "/challenge-course/group-clients/{group_client_id}/payments"
    description: "Post a payment onto a group client's account, increasing available credit."
    roles: [ProgramDirector]
    code: 200
    input: [amount_cents, reference]
    output: GroupClient
    side_effects: ["payments_received_cents += amount_cents", "credit_balance_cents += amount_cents", "version += 1"]

  - method: POST
    path: "/challenge-course/bookings"
    description: "Open a draft booking for a group on a course for a program date."
    roles: [ProgramDirector, GroupCoordinator]
    code: 201
    input: [course_id, group_client_id, program_date, expected_participant_count]
    output: Booking
    side_effects: ["status DRAFT", "roster_status INCOMPLETE", "all money fields 0", "MIN_LEAD_DAYS lead-time validated"]

  - method: GET
    path: "/challenge-course/bookings/{booking_id}"
    description: "Read a booking with its quote, deposit, roster status and version."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, GroupCoordinator]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/challenge-course/bookings"
    description: "List bookings, filterable by course or client (reverse lookup for Booking.course_id and Booking.group_client_id)."
    roles: [ProgramDirector, SafetyOfficer, GroupCoordinator]
    code: 200
    input: ["course_id?", "group_client_id?", "status?", "roster_status?", "program_date?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/challenge-course/bookings/{booking_id}/quote"
    description: "Run (or re-run) the quote. Requires the booking version the caller last read."
    roles: [ProgramDirector]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects: ["billable_head_count, raw_subtotal_cents, high_element_surcharge_cents, quoted_total_cents, deposit_required_cents and required_chaperone_count recomputed", "status -> QUOTED", "quote_index += 1", "increments version by 1"]

  - method: POST
    path: "/challenge-course/bookings/{booking_id}/confirm"
    description: "Confirm a quoted booking, allocating the deposit from the client's credit balance."
    roles: [GroupCoordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["safety, sequencing, chaperone and fiscal gates evaluated in priority order", "deposit_allocated_cents = deposit_required_cents", "GroupClient.credit_balance_cents decreased", "status -> CONFIRMED", "version += 1"]

  - method: POST
    path: "/challenge-course/bookings/{booking_id}/cancel"
    description: "Cancel a booking and settle the deposit. The settlement variant is chosen from the booking's status (WEATHER_HOLD -> operator-weather variant)."
    roles: [GroupCoordinator, ProgramDirector]
    code: 200
    input: [reason]
    output: Booking
    side_effects: ["booking_cancellation_settlement computed", "retained_cents and refund credited back to the client", "deposit_allocated_cents = 0", "non-terminal program blocks -> ABANDONED", "course at_risk_booking_count recomputed", "status -> CANCELLED"]

  # ---- Participant --------------------------------------------------------
  - method: POST
    path: "/challenge-course/participants"
    description: "Add a participant or chaperone to a booking roster. Requires the booking version the caller last read."
    roles: [GroupCoordinator]
    code: 201
    input: [booking_id, expected_booking_version, full_name, birth_date, weight_kg, is_chaperone]
    output: Participant
    side_effects: ["health_form_status MISSING, agreement_signed false", "participant_screening_status computed (BLOCKED until the packet arrives)", "booking_roster_status recomputed", "increments version by 1"]

  - method: GET
    path: "/challenge-course/participants/{participant_id}"
    description: "Read a participant with screening and health-form state."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, GroupCoordinator]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/challenge-course/participants"
    description: "List participants, filterable by booking (reverse lookup for Participant.booking_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, GroupCoordinator]
    code: 200
    input: ["booking_id?", "screening_status?", "health_form_status?", "is_chaperone?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: POST
    path: "/challenge-course/participants/{participant_id}/screening-packet"
    description: "Submit the participation agreement and health form for a participant."
    roles: [GroupCoordinator]
    code: 200
    input: [agreement_signed, guardian_signature_provided, health_flags]
    output: Participant
    side_effects: ["health_form_status -> SUBMITTED or FLAGGED depending on BLOCKING_HEALTH_FLAGS", "screening_status recomputed", "booking_roster_status recomputed", "Booking.version += 1"]

  - method: POST
    path: "/challenge-course/participants/{participant_id}/medical-clearance"
    description: "Record medical clearance for a flagged participant."
    roles: [SafetyOfficer]
    code: 200
    input: [clearance_note]
    output: Participant
    side_effects: ["health_form_status -> CLEARED", "medical_clearance_granted true", "screening_status -> ELIGIBLE when the agreement and guardian clauses pass", "booking_roster_status recomputed", "Booking.version += 1"]

  # ---- Program design ------------------------------------------------------
  - method: POST
    path: "/challenge-course/program-blocks"
    description: "Add a sequenced program block to a booking, optionally rigged to an element."
    roles: [ProgramDirector]
    code: 201
    input: [booking_id, sequence_index, phase, "element_id?", planned_start_at, planned_end_at]
    output: ProgramBlock
    side_effects: ["status SCHEDULED", "phase/element compatibility, sequencing, element-occupancy overlap and program-date rules validated", "Booking.block_count += 1", "block_supervision_requirement computed"]

  - method: GET
    path: "/challenge-course/program-blocks/{program_block_id}"
    description: "Read a program block with its supervision requirement and timing."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, GroupCoordinator]
    code: 200
    input: []
    output: ProgramBlock
    side_effects: []

  - method: GET
    path: "/challenge-course/program-blocks"
    description: "List program blocks, filterable by booking or element (reverse lookup for ProgramBlock.booking_id and ProgramBlock.element_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, GroupCoordinator]
    code: 200
    input: ["booking_id?", "element_id?", "phase?", "status?", "limit?", "offset?"]
    output: ProgramBlock[]
    side_effects: []

  - method: POST
    path: "/challenge-course/program-blocks/{program_block_id}/block-assignments"
    description: "Assign a facilitator to a program block, enforcing certification level, course membership and turnaround buffer."
    roles: [ProgramDirector]
    code: 201
    input: [facilitator_id, "assignment_role?"]
    output: BlockAssignment
    side_effects: ["rescue_current_at_assignment frozen from the facilitator's rescue-drill currency", "assigned_facilitator_count += 1", "supervision_capacity recomputed"]

  - method: GET
    path: "/challenge-course/program-blocks/{program_block_id}/block-assignments"
    description: "List the facilitators assigned to a block (reverse lookup for BlockAssignment.program_block_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: ["limit?", "offset?"]
    output: BlockAssignment[]
    side_effects: []

  - method: POST
    path: "/challenge-course/program-blocks/{program_block_id}/start"
    description: "Start a block. This is the gate where posture, daily inspection, belay readiness, rescue readiness, EMS access, screening, weight limits and supervision ratios are all enforced."
    roles: [Facilitator]
    code: 200
    input: []
    output: ProgramBlock
    side_effects: ["status -> IN_PROGRESS", "started_at stamped from the logical clock", "actual_head_count frozen from the ELIGIBLE non-chaperone roster"]

  - method: POST
    path: "/challenge-course/program-blocks/{program_block_id}/complete"
    description: "Complete a block, crediting usage cycles to the element and its rigged belay equipment."
    roles: [Facilitator]
    code: 200
    input: ["debrief_completed?"]
    output: ProgramBlock
    side_effects: ["status -> COMPLETED", "Element.cumulative_cycle_count += actual_head_count and element_retirement_forecast recomputed", "rigged IN_SERVICE equipment usage_cycles += actual_head_count, cycle-exhausted items -> RETIRED", "element_belay_readiness recomputed", "booking bubbles up to DELIVERED when every block is terminal"]

  # ---- Belay system -------------------------------------------------------
  - method: POST
    path: "/challenge-course/belay-equipment"
    description: "Add a life-safety item to the course inventory, optionally rigged to an element."
    roles: [ProgramDirector, SafetyOfficer]
    code: 201
    input: [course_id, equipment_kind, serial_number, manufactured_on, max_cycles, "assigned_element_id?", "first_use_on?", "initial_usage_cycles?"]
    output: BelayEquipment
    side_effects: ["status IN_SERVICE", "usage_cycles = initial_usage_cycles (default 0)", "equipment_retirement_forecast computed", "element_belay_readiness recomputed for the rigged element", "course posture recomputed"]

  - method: GET
    path: "/challenge-course/belay-equipment/{equipment_id}"
    description: "Read a belay item with its retirement date and basis."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: []
    output: BelayEquipment
    side_effects: []

  - method: GET
    path: "/challenge-course/belay-equipment"
    description: "List belay equipment, filterable by course or rigged element (reverse lookup for BelayEquipment.course_id and .assigned_element_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: ["course_id?", "assigned_element_id?", "status?", "equipment_kind?", "retirement_basis?", "limit?", "offset?"]
    output: BelayEquipment[]
    side_effects: []

  - method: POST
    path: "/challenge-course/belay-equipment/{equipment_id}/log-usage"
    description: "Log belay cycles against an item outside a program block (rescue drills, training)."
    roles: [Facilitator, SafetyOfficer]
    code: 200
    input: [cycles]
    output: BelayEquipment
    side_effects: ["usage_cycles += cycles", "first_use_on stamped on first use", "equipment_retirement_forecast recomputed", "status -> RETIRED with retirement_basis CYCLE when usage_cycles >= max_cycles", "element_belay_readiness recomputed and dependent SCHEDULED blocks blocked when readiness is lost"]

  # ---- Weather and incidents ----------------------------------------------
  - method: POST
    path: "/challenge-course/weather-observations"
    description: "Record a weather observation. Lightning, wind and cold thresholds can close the course and fire Cascade C."
    roles: [Facilitator, SafetyOfficer, ProgramDirector]
    code: 201
    input: [course_id, observed_at, "lightning_distance_km?", wind_speed_kph, air_temp_c]
    output: WeatherObservation
    side_effects: ["weather_posture_signals evaluated", "lightning_hold_until extended (never shortened)", "course posture recomputed", "IN_PROGRESS blocks -> SUSPENDED and owning CONFIRMED bookings -> WEATHER_HOLD when the course closes"]

  - method: GET
    path: "/challenge-course/weather-observations/{observation_id}"
    description: "Read one weather observation, including the posture and hold it produced."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: []
    output: WeatherObservation
    side_effects: []

  - method: GET
    path: "/challenge-course/weather-observations"
    description: "List weather observations across the operation, filterable by course (flat reverse lookup for WeatherObservation.course_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: ["course_id?", "resulting_posture?", "limit?", "offset?"]
    output: WeatherObservation[]
    side_effects: []

  - method: POST
    path: "/challenge-course/incidents"
    description: "Report an incident. MODERATE and SERIOUS incidents open a review immediately; a SERIOUS incident on an element restricts that element."
    roles: [Facilitator, SafetyOfficer]
    code: 201
    input: [course_id, reported_by_facilitator_id, occurred_at, severity, narrative, ems_activated, "element_id?", "participant_id?"]
    output: Incident
    side_effects: ["status REPORTED, or UNDER_REVIEW when severity is MODERATE or SERIOUS", "SERIOUS + element_id restricts the element and drives posture RESTRICTED with reason SERIOUS_INCIDENT", "course posture recomputed"]

  - method: GET
    path: "/challenge-course/incidents/{incident_id}"
    description: "Read an incident with its review state and corrective action."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/challenge-course/incidents"
    description: "List incidents, filterable by course, element, participant or reporter (reverse lookup for Incident.course_id, .element_id, .participant_id and .reported_by_facilitator_id)."
    roles: [ProgramDirector, SafetyOfficer, Facilitator]
    code: 200
    input: ["course_id?", "element_id?", "participant_id?", "reported_by_facilitator_id?", "status?", "severity?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: POST
    path: "/challenge-course/incidents/{incident_id}/review"
    description: "Open a review on a REPORTED incident."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Incident
    side_effects: ["status -> UNDER_REVIEW", "element return-to-service stays blocked while the review is open"]

  - method: POST
    path: "/challenge-course/incidents/{incident_id}/close"
    description: "Close a reviewed incident with or without corrective action. Cannot be closed by the reporter."
    roles: [SafetyOfficer]
    code: 200
    input: [disposition, "corrective_action?"]
    output: Incident
    side_effects: ["status -> CLOSED_NO_ACTION or CLOSED_CORRECTIVE", "ELEMENT_RESTRICTED restricts the element", "EQUIPMENT_QUARANTINED quarantines the element's rigged equipment and clears belay readiness", "course posture recomputed"]

  # ---- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every date-sensitive rule (certification expiry, rescue-drill recency, retirement forecasts, cancellation notice tiers, inspection due dates, lightning hold windows) reads this clock."
    roles: [ProgramDirector, SafetyOfficer, Facilitator, ProfessionalInspector, GroupCoordinator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["The logical clock is set; no entity is recomputed until the next write or daily-open checkpoint"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_ROLE_IDENTITY_MISMATCH
    http: 403
    condition: "X-User-ID does not resolve to an instance of the role's backing entity, or the instance's discriminator (staff_type / certification_level) does not match the claimed role"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed actor operates on a resource it does not own (coordinator on another client's booking, facilitator logging an inspection under another facilitator's id, inspector filing another inspector's inspection)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user is the same person who raised the artefact now being accepted: returning to service an element they restricted, disposing an inspection they filed, or closing an incident they reported"

  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, unknown enum member, out-of-range number, planned_start_at >= planned_end_at, pagination limit outside 1..100 or negative offset, DEFECT_MAJOR log without defect_note, CORRECTIVE incident close without a valid corrective_action"

  # ---- existence -----------------------------------------------------------
  - id: ERR_COURSE_NOT_FOUND
    http: 404
    condition: "course_id in the path or body does not resolve"
  - id: ERR_ELEMENT_NOT_FOUND
    http: 404
    condition: "element_id in the path or body does not resolve"
  - id: ERR_FACILITATOR_NOT_FOUND
    http: 404
    condition: "facilitator_id, inspector_id or reported_by_facilitator_id does not resolve"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection_id in the path does not resolve"
  - id: ERR_OPERATIONAL_LOG_NOT_FOUND
    http: 404
    condition: "log_id in the path does not resolve"
  - id: ERR_GROUP_CLIENT_NOT_FOUND
    http: 404
    condition: "group_client_id in the path or body does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "booking_id in the path or body does not resolve"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "participant_id in the path or body does not resolve"
  - id: ERR_PROGRAM_BLOCK_NOT_FOUND
    http: 404
    condition: "program_block_id in the path does not resolve"
  - id: ERR_EQUIPMENT_NOT_FOUND
    http: 404
    condition: "equipment_id in the path does not resolve"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "incident_id in the path does not resolve"
  - id: ERR_TRAINING_RECORD_NOT_FOUND
    http: 404
    condition: "training_record_id in the path does not resolve"
  - id: ERR_BLOCK_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "block_assignment_id in the path does not resolve"
  - id: ERR_WEATHER_OBSERVATION_NOT_FOUND
    http: 404
    condition: "observation_id in the path does not resolve"

  # ---- concurrency ---------------------------------------------------------
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version does not equal the booking's current version on a quote run or a participant addition"

  # ---- state preconditions -------------------------------------------------
  - id: ERR_ELEMENT_NOT_RESTRICTED
    http: 409
    condition: "return-to-service called on an element whose status is SERVICEABLE"
  - id: ERR_ELEMENT_NOT_SERVICEABLE
    http: 409
    condition: "A block start references an element whose status is RESTRICTED or OUT_OF_SERVICE"
  - id: ERR_ELEMENT_RETIRED
    http: 409
    condition: "Any operation targets an element in the terminal RETIRED state"
  - id: ERR_INSPECTION_NOT_DRAFT
    http: 409
    condition: "file called on an inspection that is already filed or disposed"
  - id: ERR_INSPECTION_NOT_FILED
    http: 409
    condition: "dispose called on a DRAFT or already DISPOSED inspection"
  - id: ERR_BOOKING_NOT_QUOTABLE
    http: 409
    condition: "quote called on a booking whose status is not DRAFT or QUOTED"
  - id: ERR_BOOKING_NOT_CONFIRMABLE
    http: 409
    condition: "confirm called on a booking whose status is not QUOTED"
  - id: ERR_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "A block start is attempted while its booking is not CONFIRMED (DRAFT, QUOTED, AT_RISK or WEATHER_HOLD)"
  - id: ERR_BOOKING_ALREADY_TERMINAL
    http: 409
    condition: "cancel, or any roster write, targets a booking already in DELIVERED or CANCELLED"
  - id: ERR_BLOCK_NOT_SCHEDULED
    http: 409
    condition: "start called on a block that is not SCHEDULED or SUSPENDED"
  - id: ERR_BLOCK_NOT_IN_PROGRESS
    http: 409
    condition: "complete called on a block that is not IN_PROGRESS"
  - id: ERR_INCIDENT_NOT_REPORTED
    http: 409
    condition: "review called on an incident that is already UNDER_REVIEW or closed"
  - id: ERR_INCIDENT_NOT_UNDER_REVIEW
    http: 409
    condition: "close called on an incident that is still REPORTED or already closed"
  - id: ERR_EQUIPMENT_RETIRED
    http: 409
    condition: "log-usage called on a belay item in the terminal RETIRED state"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state guard for transitions with no more specific code, e.g. medical-clearance on a participant whose health_form_status is not FLAGGED"

  # ---- safety / compliance -------------------------------------------------
  - id: ERR_COURSE_CLOSED
    http: 409
    condition: "A block start is attempted while course posture is CLOSED (lightning hold, wind stop, cold stop, overdue inspection or rescue-readiness failure)"
  - id: ERR_COURSE_RESTRICTED_HIGH_ELEMENT
    http: 409
    condition: "A HIGH_ELEMENT-phase block start is attempted while course posture is RESTRICTED"
  - id: ERR_DAILY_INSPECTION_MISSING
    http: 409
    condition: "A block start references an element with no CLEAR operational inspection log dated today, or with a later non-CLEAR log"
  - id: ERR_INSPECTION_OVERDUE
    http: 409
    condition: "An element's next_professional_inspection_due_on falls before the booking's program_date at confirm, or before today at block start"
  - id: ERR_BELAY_NOT_READY
    http: 409
    condition: "The element's usable in-service belay set count is below required_belay_set_count, or any rigged item is QUARANTINED"
  - id: ERR_RESCUE_READINESS_UNMET
    http: 409
    condition: "The course has fewer than two ACTIVE facilitators, or a HIGH_ELEMENT block has no assigned facilitator with a current rescue drill"
  - id: ERR_EMS_ACCESS_UNSUITABLE
    http: 409
    condition: "A HIGH_ELEMENT block start is attempted on a course whose ems_response_minutes exceeds 30"
  - id: ERR_OPEN_INCIDENT_BLOCKS_SERVICE
    http: 409
    condition: "return-to-service is attempted while a REPORTED or UNDER_REVIEW incident still references the element"
  - id: ERR_DEFECT_NOT_CLEARED
    http: 409
    condition: "return-to-service is attempted before a CLEAR operational log (RESTRICTED path) or a disposed PASS inspection (OUT_OF_SERVICE path) exists"
  - id: ERR_PARTICIPANT_SCREENING_INCOMPLETE
    http: 422
    condition: "The booking has no participants, or any participant's screening_status is BLOCKED or CONDITIONAL"
  - id: ERR_WEIGHT_LIMIT_EXCEEDED
    http: 422
    condition: "An eligible participant's weight_kg falls outside the element's inclusive [min, max] band"
  - id: ERR_SUPERVISION_RATIO_UNMET
    http: 422
    condition: "assigned_facilitator_count is below required_facilitator_count, or the assigned certification capacity is below the active head count"
  - id: ERR_FACILITATOR_CERT_INACTIVE
    http: 422
    condition: "A facilitator being assigned or relied on for a block start has cert_status PROBATION or LAPSED"

  # ---- referential ---------------------------------------------------------
  - id: ERR_CERT_LEVEL_INSUFFICIENT
    http: 422
    condition: "The facilitator's certification_level is below the level required by the element type rigged to the block"
  - id: ERR_FACILITATOR_COURSE_MISMATCH
    http: 422
    condition: "The facilitator belongs to a different course than the element or booking being staffed"
  - id: ERR_INSPECTOR_NOT_INDEPENDENT
    http: 422
    condition: "The named inspector is an operator employee, is not a CONTRACT_INSPECTOR, or does not hold an ACTIVE certification"
  - id: ERR_ELEMENT_PHASE_MISMATCH
    http: 422
    condition: "The block's phase does not match the rigged element's type family, or an ICEBREAKER/DEBRIEF block supplies an element_id"
  - id: ERR_ELEMENT_COURSE_MISMATCH
    http: 422
    condition: "A program block or belay item references an element on a different course"

  # ---- program-design constraints ------------------------------------------
  - id: ERR_DUPLICATE_BLOCK_SEQUENCE
    http: 422
    condition: "sequence_index is already used by another block of the same booking"
  - id: ERR_SEQUENCING_VIOLATION
    http: 422
    condition: "The block at sequence_index 1 is not an ICEBREAKER"
  - id: ERR_SEQUENCE_PREREQUISITE_MISSING
    http: 422
    condition: "A HIGH_ELEMENT block is added with no earlier GROUND_INITIATIVE or LOW_ELEMENT block in the same booking"
  - id: ERR_SEQUENCE_GAP
    http: 422
    condition: "sequence_index skips a value, breaking the gap-free run from 1"
  - id: ERR_DEBRIEF_BLOCK_MISSING
    http: 422
    condition: "confirm is attempted on a booking whose highest-sequence block is not a DEBRIEF"
  - id: ERR_DEBRIEF_NOT_RECORDED
    http: 422
    condition: "complete is called on a DEBRIEF block without debrief_completed == true"
  - id: ERR_CHAPERONE_SHORTFALL
    http: 422
    condition: "The chaperone count is below ceil(minor_head_count / 10) at confirm"
  - id: ERR_BLOCK_SEQUENCE_NOT_READY
    http: 409
    condition: "start is attempted while a lower-sequence block of the same booking is not yet COMPLETED or ABANDONED"
  - id: ERR_RETIREMENT_CRITERIA_NOT_MET
    http: 409
    condition: "retire is attempted on an element meeting none of the retirement criteria, or return-to-service is attempted on a life-expired element"
  - id: ERR_ELEMENT_HAS_ACTIVE_BLOCKS
    http: 409
    condition: "retire is attempted while the element still carries SCHEDULED, IN_PROGRESS, SUSPENDED or BLOCKED_UNSAFE program blocks"

  # ---- temporal ------------------------------------------------------------
  - id: ERR_ELEMENT_SCHEDULE_CONFLICT
    http: 409
    condition: "The new block's half-open [planned_start_at, planned_end_at) interval overlaps a non-terminal block on the same element; back-to-back adjacency does not conflict"
  - id: ERR_FACILITATOR_SCHEDULE_CONFLICT
    http: 409
    condition: "The facilitator's new block starts less than 20 minutes after the end of another block they are assigned to"
  - id: ERR_PROGRAM_DATE_IN_PAST
    http: 409
    condition: "program_date is fewer than three days after the logical clock date at booking creation, or a block's planned times do not fall on the booking's program_date"

  # ---- fiscal --------------------------------------------------------------
  - id: ERR_INSUFFICIENT_CLIENT_CREDIT
    http: 402
    condition: "The group client's credit_balance_cents is below the booking's deposit_required_cents at confirm"

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Operator management: builds courses, installs and retires elements, hires facilitators, records training, designs programs, runs the daily opening checkpoint and posts client payments. Cannot accept its own safety artefacts."
    identity: "opaque"
    exclusive_operations:
      - "POST /challenge-course/courses"
      - "POST /challenge-course/courses/{course_id}/daily-open"
      - "POST /challenge-course/elements"
      - "POST /challenge-course/elements/{element_id}/retire"
      - "POST /challenge-course/facilitators"
      - "POST /challenge-course/training-records"
      - "POST /challenge-course/group-clients"
      - "POST /challenge-course/group-clients/{group_client_id}/payments"
      - "POST /challenge-course/bookings/{booking_id}/quote"
      - "POST /challenge-course/program-blocks"
      - "POST /challenge-course/program-blocks/{program_block_id}/block-assignments"
    shared_operations:
      - "POST /challenge-course/professional-inspections (shared with ProfessionalInspector)"
      - "POST /challenge-course/bookings (shared with GroupCoordinator)"
      - "POST /challenge-course/bookings/{booking_id}/cancel (shared with GroupCoordinator)"
      - "POST /challenge-course/belay-equipment (shared with SafetyOfficer)"
      - "POST /challenge-course/weather-observations (shared with Facilitator, SafetyOfficer)"
      - "All GET reads except participant and incident detail restrictions noted per endpoint"
      - "POST /_clock/set_current_utc"

  - name: SafetyOfficer
    description: "Independent safety authority for the course. Accepts filed inspections, returns elements to service, grants medical clearances and closes incident reviews. X-User-ID must be a Facilitator row with staff_type SAFETY_OFFICER and certification_level LEVEL_3."
    identity: "entity_backed:Facilitator"
    exclusive_operations:
      - "POST /challenge-course/elements/{element_id}/return-to-service"
      - "POST /challenge-course/professional-inspections/{inspection_id}/dispose"
      - "POST /challenge-course/participants/{participant_id}/medical-clearance"
      - "POST /challenge-course/incidents/{incident_id}/review"
      - "POST /challenge-course/incidents/{incident_id}/close"
    shared_operations:
      - "POST /challenge-course/operational-logs (shared with Facilitator)"
      - "POST /challenge-course/belay-equipment (shared with ProgramDirector)"
      - "POST /challenge-course/belay-equipment/{equipment_id}/log-usage (shared with Facilitator)"
      - "POST /challenge-course/weather-observations (shared with Facilitator, ProgramDirector)"
      - "POST /challenge-course/incidents (shared with Facilitator)"
      - "All GET reads"
      - "POST /_clock/set_current_utc"

  - name: Facilitator
    description: "Front-line staff who run program blocks, perform operational (pre-use) inspections, log belay usage, record weather and report incidents. X-User-ID must be a Facilitator row with staff_type STAFF_FACILITATOR."
    identity: "entity_backed:Facilitator"
    exclusive_operations:
      - "POST /challenge-course/program-blocks/{program_block_id}/start"
      - "POST /challenge-course/program-blocks/{program_block_id}/complete"
    shared_operations:
      - "POST /challenge-course/operational-logs (shared with SafetyOfficer)"
      - "POST /challenge-course/belay-equipment/{equipment_id}/log-usage (shared with SafetyOfficer)"
      - "POST /challenge-course/weather-observations (shared with SafetyOfficer, ProgramDirector)"
      - "POST /challenge-course/incidents (shared with SafetyOfficer)"
      - "GET reads on courses, elements, facilitators, operational logs, bookings, participants, program blocks, block assignments, belay equipment, incidents, weather observations"
      - "POST /_clock/set_current_utc"

  - name: ProfessionalInspector
    description: "Contracted third-party inspector who opens and files professional inspections. Never disposes its own filing and never operates a program. X-User-ID must be a Facilitator row with staff_type CONTRACT_INSPECTOR and is_operator_employee == false."
    identity: "entity_backed:Facilitator"
    exclusive_operations:
      - "POST /challenge-course/professional-inspections/{inspection_id}/file"
    shared_operations:
      - "POST /challenge-course/professional-inspections (shared with ProgramDirector)"
      - "GET reads on courses, elements, facilitators, professional inspections, operational logs"
      - "POST /_clock/set_current_utc"

  - name: GroupCoordinator
    description: "The booking group's own coordinator (teacher, camp director, HR lead). Manages the roster, submits screening packets, confirms and cancels its own bookings. X-User-ID must equal the GroupClient id that owns the booking."
    identity: "entity_backed:GroupClient"
    exclusive_operations:
      - "POST /challenge-course/participants"
      - "POST /challenge-course/participants/{participant_id}/screening-packet"
      - "POST /challenge-course/bookings/{booking_id}/confirm"
    shared_operations:
      - "POST /challenge-course/bookings (shared with ProgramDirector)"
      - "POST /challenge-course/bookings/{booking_id}/cancel (shared with ProgramDirector)"
      - "GET reads on courses, group-clients, bookings, participants, program blocks (scoped to the coordinator's own client)"
      - "POST /_clock/set_current_utc"
