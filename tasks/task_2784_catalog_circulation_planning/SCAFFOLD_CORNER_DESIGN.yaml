      - name: measuring_an_already_measured_test_cell_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - errors[ERR_INVALID_TEST_CELL_STATE]
          - state_machines[TestCell.status]
          - endpoints[POST /catalog-circulation/test-cells/{id}/measure]
          - validations[priority=42]
        distinguishing_aspect: "The second measure of a MEASURED cell must 409 with the cell-specific code rather than overwrite the readout, and the already-computed response_rate_bps must survive the rejection unchanged. Because a re-measure would also re-score sibling cells, an implementation that allows it corrupts the whole line's test readout, not just one row."
        test_recipe:
          setup:
            - "The full approved-plan chain of repeating_a_completed_production_transition_is_rejected_not_ignored, taken through mail so measurement is permitted."
            - "The 20000-name S_A line carries a CONTROL cell C_CTL of 5000 and a TEST cell C_TST of 5000."
            - "C_CTL is measured first with 200 responders, giving 400 bps; C_TST is then measured with 300 responders, giving 600 bps."
          setup_api_calls:
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/test-cells"
              payload: { cell_code: "C_CTL", test_type: "OFFER", cell_role: "CONTROL", quantity: 5000 }
              as: MarketingAnalyst
              captures: { ctl_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/test-cells"
              payload: { cell_code: "C_TST", test_type: "OFFER", cell_role: "TEST", quantity: 5000 }
              as: MarketingAnalyst
              captures: { tst_id: "$.data.id" }
            - call: "POST /catalog-circulation/test-cells/${ctl_id}/measure"
              payload: { responders: 200, demand_cents: 3700000 }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/test-cells/${tst_id}/measure"
              payload: { responders: 300, demand_cents: 5550000 }
              as: MarketingAnalyst
              captures: { tst_rate: "$.data.response_rate_bps", tst_lift: "$.data.lift_bps", tst_status: "$.data.status", tst_ver: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/test-cells/${tst_id}/measure"
              payload: { responders: 4000, demand_cents: 74000000 }
              as: MarketingAnalyst
              captures: { e_remeasure: "$.data.error_id" }
          assert:
            - "${tst_status} == MEASURED, ${tst_rate} == 600 and ${tst_lift} == 5000  # (600 - 400) * 10000 / 400"
            - "${e_remeasure} == ERR_INVALID_TEST_CELL_STATE with HTTP 409"
            - "TestCell.${tst_id}.responders == 300, response_rate_bps == 600, lift_bps == 5000 and version == ${tst_ver}  # the rejected re-measure changed nothing"
            - "TestCell.${ctl_id}.response_rate_bps == 400 and lift_bps == 0  # the sibling re-scoring pass did not run either"

      - name: finalizing_a_matchback_run_that_is_not_open_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - errors[ERR_INVALID_MATCHBACK_STATE]
          - state_machines[MatchbackRun.status]
          - endpoints[POST /catalog-circulation/matchback-runs/{id}/finalize]
        distinguishing_aspect: "Finalize is probed twice on the same run - once when it is FINALIZED, and once on a run that a later matchback create pushed to SUPERSEDED. The SUPERSEDED probe is the sharp one because that run was OPEN a moment earlier, so an implementation that caches the run's status or that guards only on finalized_at == null would wrongly re-close a retired read."
        test_recipe:
          setup:
            - "The mailed-drop chain of repeating_a_completed_production_transition_is_rejected_not_ignored (drop MAILED, measurement PENDING)."
            - "Two matchback runs are created: RUN_A, then RUN_B which supersedes it. RUN_B is finalized."
          setup_api_calls:
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { dv1: "$.data.version" }
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${dv1}", attribution_variant: "LAST_TOUCH_MAIL" }
              as: MarketingAnalyst
              captures: { run_a: "$.data.id" }
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { dv2: "$.data.version" }
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${dv2}", attribution_variant: "LAST_TOUCH_MAIL" }
              as: MarketingAnalyst
              captures: { run_b: "$.data.id" }
            - call: "POST /catalog-circulation/matchback-runs/${run_b}/finalize"
              payload: {}
              as: MarketingAnalyst
              captures: { b_status: "$.data.status", b_final_at: "$.data.finalized_at" }
          trigger:
            - call: "POST /catalog-circulation/matchback-runs/${run_b}/finalize"
              payload: {}
              as: MarketingAnalyst
              captures: { e_refinalize: "$.data.error_id" }
            - call: "POST /catalog-circulation/matchback-runs/${run_a}/finalize"
              payload: {}
              as: MarketingAnalyst
              captures: { e_superseded: "$.data.error_id" }
          assert:
            - "${b_status} == FINALIZED with a non-null ${b_final_at}, and Drop.${d1_id}.measurement_status == MATCHBACK_CLOSED"
            - "${e_refinalize} == ERR_INVALID_MATCHBACK_STATE with HTTP 409  # FINALIZED -> FINALIZED does not exist"
            - "${e_superseded} == ERR_INVALID_MATCHBACK_STATE with HTTP 409  # RUN_A was retired by RUN_B's create"
            - "MatchbackRun.${run_a}.status == SUPERSEDED and finalized_at == null"
            - "MatchbackRun.${run_b}.finalized_at == ${b_final_at}  # unchanged by the rejected replay"

      - name: a_new_matchback_run_on_a_closed_drop_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - errors[ERR_INVALID_MEASUREMENT_STATE]
          - state_machines[Drop.measurement_status].terminal_states
          - endpoints[POST /catalog-circulation/drops/{id}/matchback-runs]
        distinguishing_aspect: "MATCHBACK_CLOSED is terminal on the measurement dimension even though the drop's production dimension is still fully alive, so a new matchback create must 409 with the MEASUREMENT code - not the DROP code, which would be the natural mistake since the same endpoint also guards production_status. Advancing production MAILED -> DELIVERED afterwards must still succeed, proving the lockdown is dimension-scoped."
        test_recipe:
          setup:
            - "The chain of finalizing_a_matchback_run_that_is_not_open_is_rejected, leaving the drop at production MAILED and measurement MATCHBACK_CLOSED."
          setup_api_calls:
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { dv3: "$.data.version", prod_now: "$.data.production_status", meas_now: "$.data.measurement_status" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${dv3}", attribution_variant: "FRACTIONAL_MULTI_TOUCH" }
              as: MarketingAnalyst
              captures: { e_closed: "$.data.error_id" }
          assert:
            - "${prod_now} == MAILED and ${meas_now} == MATCHBACK_CLOSED"
            - "${e_closed} == ERR_INVALID_MEASUREMENT_STATE with HTTP 409, NOT ERR_INVALID_DROP_STATE  # production_status is a legal MAILED, so the failing guard is the measurement dimension"
            - "the OCC check passed (expected_drop_version was current) yet the call still failed, so the 409 is not a masked 412"
            - "GET /catalog-circulation/drops/${d1_id}/matchback-runs still returns total_count == 2 and Drop.${d1_id}.version == ${dv3}"
            - "POST /catalog-circulation/drops/${d1_id}/deliver as CirculationPlanner then succeeds with production_status == DELIVERED and measurement_status still MATCHBACK_CLOSED  # the terminal lockdown is scoped to one dimension"

      - name: voiding_a_line_that_is_already_voided_is_rejected
        claim_type: invalid_transitions
