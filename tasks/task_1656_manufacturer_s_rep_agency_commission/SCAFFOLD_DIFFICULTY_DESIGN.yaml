              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/project-registrations"
              payload: { principal_id: "${p1}", customer_id: "${c1}", family_code: "CONNECTORS", project_name: "Project Cyclic" }
              as: Rep
              as_user_id: "${r1}"
              captures: { reg1: $.data.id }
            - call: "POST /rep-agency/project-registrations/${reg1}/reject"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { st_rej: $.data.status }
            - call: "POST /rep-agency/project-registrations/${reg1}/resubmit"
              payload: {}
              as: Rep
              as_user_id: "${r1}"
              captures: { st_sub2: $.data.status }
            - call: "POST /rep-agency/project-registrations/${reg1}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { pend: $.data.protection_end }
