  # ============================================================ complexity layers
  - section: complexity_layers
    instances:
      - name: occ_agreement_amend_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-amend-stale-version]", "endpoints.PATCH /api/supply-agreements/{id}"]
        distinguishing_aspect: "OCC on SupplyAgreement.version: amend with the version observed at create (1) succeeds and bumps to 2; replaying the same expected version is then rejected 412 ERR_STALE_VERSION — two strictly sequential requests."
        test_recipe:
          setup: ["station + DRAFT agreement; client observed version 1"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Occ", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 1000, imaging_allowance_cents: 1000, margin_tc_per_gal: 10, shortfall_penalty_tc_per_gal: 10, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id, a_ver: $.data.version }
          trigger:
            - call: "PATCH /api/supply-agreements/${a_id}"
              payload: { expected_agreement_version: "${a_ver}", margin_tc_per_gal: 30 }
              as: JobberAdmin
              captures: { a_ver2: $.data.version, m2: $.data.margin_tc_per_gal }
            - call: "PATCH /api/supply-agreements/${a_id}"
              payload: { expected_agreement_version: "${a_ver}", margin_tc_per_gal: 40 }
              as: JobberAdmin
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds: version == 2, margin_tc_per_gal == 30"
            - "Second PATCH with the stale expected version fails: error_id == ERR_STALE_VERSION (412); margin stays 30"

      - name: occ_posting_supersede_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[posting-supersede-stale-version]", "endpoints.POST /api/rack-price-postings/{id}/supersede"]
        distinguishing_aspect: "OCC on the POSTED RackPricePosting: superseding with expected version one behind the current is rejected 412 — protecting the create-with-supersede pattern."
        test_recipe:
          setup: ["product; posting POSTED (version observed from the post response)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
              captures: { pp_ver: $.data.version }
          trigger:
            - call: "POST /api/rack-price-postings/${pp_id}/supersede"
              payload: { expected_superseded_posting_version: "${pp_ver} - 1", new_price_tc_per_gal: 2050, effective_date: "2026-05-01" }
              as: PricingDesk
              captures: { err: $.data.error_id }
            - call: "POST /api/rack-price-postings/${pp_id}/supersede"
              payload: { expected_superseded_posting_version: "${pp_ver}", new_price_tc_per_gal: 2050, effective_date: "2026-05-01" }
              as: PricingDesk
              captures: { new_price: $.data.price_tc_per_gal, new_status: $.data.status }
          assert:
            - "Stale supersede (expected = observed - 1) fails: error_id == ERR_STALE_VERSION (412)"
            - "Correct-version supersede succeeds: replacement posting POSTED with price_tc_per_gal == 2050; original posting becomes SUPERSEDED"

      - name: occ_drop_replan_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[drop-replan-stale-version]", "endpoints.POST /api/transport-drops/{id}/replan"]
        distinguishing_aspect: "OCC on TransportDrop.version: a replan carrying the version observed before an earlier replan cycle is rejected 412 even though the drop is again in DELIVERY_FAILED (state precondition satisfied, version stale)."
        test_recipe:
          setup: ["full fixture; drop failed once (version observed), replanned, re-scheduled, re-dispatched, failed again — version has advanced beyond the observed one"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-OccD", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 1000, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id }
            - call: "POST /api/transport-drops/${d_id}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/dispatch"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/fail"
              payload: { reason: "first failure" }
              as: Dispatcher
            - call: "GET /api/transport-drops/${d_id}"
              as: Dispatcher
              captures: { d_ver: $.data.version }
            - call: "POST /api/transport-drops/${d_id}/replan"
              payload: { expected_drop_version: "${d_ver}", window_start: "2026-05-03T08:00:00Z", window_end: "2026-05-03T12:00:00Z", truck_id: "${tr_id}" }
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/dispatch"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/fail"
              payload: { reason: "second failure" }
              as: Dispatcher
          trigger:
            - call: "POST /api/transport-drops/${d_id}/replan"
              payload: { expected_drop_version: "${d_ver}", window_start: "2026-05-04T08:00:00Z", window_end: "2026-05-04T12:00:00Z", truck_id: "${tr_id}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412) — drop is DELIVERY_FAILED (state gate passes) but the expected version predates the first replan cycle"

      - name: credit_watch_band_at_exactly_80pct
        claim_type: rate_threshold_triggers
        grounds: ["calculations.credit_exposure_cents", "state_machines.DealerStation.credit_status=GOOD_STANDING_to_credit_status=WATCH"]
        distinguishing_aspect: "WATCH band boundary is inclusive: exposure exactly 80% of the limit (800000 == 0.8 * 1000000) flips GOOD_STANDING -> WATCH; settling the draft returns exposure to 0 and flips WATCH -> GOOD_STANDING."
        test_recipe:
          setup: ["full gasoline fixture: station limit 1000000 excise 0, price 1376 tc; 5000-gal drop delivered -> invoice exactly 800000 (fuel 688000 + freight 20000 + tax 92000)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Watch", state_code: "NM", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 0, credit_limit_cents: 1000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 1376 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 5000, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id }
            - call: "POST /api/transport-drops/${d_id}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/dispatch"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/deliver"
              payload: { delivered_gallons: 5000 }
              as: Dispatcher
              captures: { inv_id: $.data.invoice_id }
          trigger:
            - call: "GET /api/dealer-stations/${s_id}"
              as: JobberAdmin
              captures: { expo: $.data.current_exposure_cents, band: $.data.credit_status }
            - call: "POST /api/eft-drafts"
              payload: { invoice_id: "${inv_id}", scheduled_date: "2026-05-02" }
              as: CreditManager
              captures: { dr_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: JobberAdmin
            - call: "POST /api/eft-drafts/${dr_id}/execute"
              payload: { outcome: "SUCCEEDED" }
              as: CreditManager
            - call: "GET /api/dealer-stations/${s_id}"
              as: JobberAdmin
              captures: { expo2: $.data.current_exposure_cents, band2: $.data.credit_status }
          assert:
            - "After deliver: current_exposure_cents == 800000 and credit_status == WATCH (exactly 80% is inside the band)"
            - "After draft settle: exposure == 0, credit_status == GOOD_STANDING, and the invoice is PAID"

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_mutation_visibility
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "endpoints.PATCH /api/dealer-stations/{id}"]
        distinguishing_aspect: "Immediate consistency: a PATCH of credit terms is fully visible in the very next GET (new limit, version incremented by exactly 1), no lag."
        test_recipe:
          setup: ["station with credit_limit_cents 500000"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Con", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "PATCH /api/dealer-stations/${s_id}"
              payload: { credit_limit_cents: 750000, credit_terms_days: 21 }
              as: CreditManager
            - call: "GET /api/dealer-stations/${s_id}"
              as: JobberAdmin
              captures: { lim: $.data.credit_limit_cents, days: $.data.credit_terms_days, v2: $.data.version }
          assert:
            - "GET immediately reflects credit_limit_cents == 750000 and credit_terms_days == 21"
            - "version == 2 (incremented by exactly 1 from the create version 1)"
