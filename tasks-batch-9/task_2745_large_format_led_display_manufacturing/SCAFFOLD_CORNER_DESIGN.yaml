            - "trigger call 2: effective_capacity_mbps == 1000   # REDUNDANCY_DERATE[NONE] is 1.0, no halving"

      - name: drawing_below_the_structural_or_wind_minimum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=27]
          - validations[priority=28]
          - errors.ERR_STRUCTURAL_CAPACITY_INSUFFICIENT
          - errors.ERR_WIND_LOAD_INSUFFICIENT
        distinguishing_aspect: |
          Both minimums are derived, not given. required_load_kg_per_sqm comes from
          the model's cabinet weight over its cabinet area (20.5 / 0.2048 =
          100.09765625 -> 100.10 at two decimals), so 100.09 fails by one
          hundredth; MIN_WIND_LOAD_KPH is keyed on install_environment, so 199 kph
          fails a ROADSIDE wall that 199 would pass at RETAIL. The two rules are
          adjacent in priority (27 wind before 28 structure), so a body that
          violates only one must name only that one.
        test_recipe:
          setup:
            - "An FP25-OUT ROADSIDE project ${pj} (required_load 100.10, MIN_WIND_LOAD_KPH[ROADSIDE] 200)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP25-OUT", pixel_pitch_mm: 2.5, rated_brightness_nits: 5000, environmental_rating: "IP65_FRONT_IP54_REAR", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 128, module_pixel_rows: 64, cabinet_width_mm: 640, cabinet_height_mm: 320, modules_per_cabinet: 4, cabinet_weight_kg: 20.5, price_per_sqm_cents: 1234567, dead_pixel_ppm_limit: 122.07, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 48, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Interstate Board", install_environment: "ROADSIDE", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "DUAL_LINK", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
          trigger:
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 100.09, wind_load_kph: 250, mounting_type: "FREESTANDING", service_access_side: "REAR" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err_struct: $.data.error_id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 150.00, wind_load_kph: 199, mounting_type: "FREESTANDING", service_access_side: "REAR" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err_wind: $.data.error_id }
          assert:
            - "trigger call 1 -> 422 with ${err_struct} == 'ERR_STRUCTURAL_CAPACITY_INSUFFICIENT'   # 100.09 < 100.10"
            - "trigger call 2 -> 422 with ${err_wind} == 'ERR_WIND_LOAD_INSUFFICIENT'   # 199 < 200 for ROADSIDE"
            - "DisplayModel.${dm}.required_load_kg_per_sqm == 100.10   # round(20.5 / 0.2048, 2)"
            - "no DrawingRevision row exists for ${pj} and DisplayProject.${pj}.engineering_state == 'DRAFT'"
            - "DisplayProject.${pj}.approved_revision_number is null"

      - name: drawing_at_the_exact_minimums_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=27]
          - validations[priority=28]
          - validations[priority=29]
        distinguishing_aspect: |
          Three independent >= comparisons are satisfied by exact equality in one
          request: viewing distance 2.5 against 2.5, structural load 100.10
          against 100.10, wind 200 against ROADSIDE's 200. Any of the three
          implemented as a strict > turns this legitimate drawing into a 422, which
          is the failure mode this instance exists to catch.
        test_recipe:
          setup:
            - "An FP25-OUT ROADSIDE project created at exactly the minimum viewing distance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP25-OUT", pixel_pitch_mm: 2.5, rated_brightness_nits: 5000, environmental_rating: "IP65_FRONT_IP54_REAR", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 128, module_pixel_rows: 64, cabinet_width_mm: 640, cabinet_height_mm: 320, modules_per_cabinet: 4, cabinet_weight_kg: 20.5, price_per_sqm_cents: 1234567, dead_pixel_ppm_limit: 122.07, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 48, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Exact Minimum Board", install_environment: "ROADSIDE", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 2.5, target_brightness_nits: 5000, redundancy_mode: "RING", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
          trigger:
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 100.10, wind_load_kph: 200, mounting_type: "FREESTANDING", service_access_side: "REAR" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
          assert:
            - "trigger -> 201: DrawingRevision.${rev}.revision_state == 'SUBMITTED' and revision_number == 1"
            - "DrawingRevision.${rev}.required_load_kg_per_sqm == 100.10   # the snapshot equals the model requirement exactly"
            - "DisplayProject.${pj}.engineering_state == 'UNDER_REVIEW'"
            - "DisplayProject.${pj}.min_viewing_distance_m == 2.5 was itself accepted at exact equality"
            - "DisplayProject.${pj}.effective_capacity_mbps == 750   # floor(1 x 1000 x 0.75) for RING, unrelated to the three minimums"

      - name: a_second_submitted_revision_is_refused_while_one_is_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors.ERR_OPEN_REVISION_EXISTS
        distinguishing_aspect: |
          The gate is on the OPEN revision, not on the count of revisions: while
          revision 1 is SUBMITTED a second submission is a 409, and the moment that
          revision is REJECTED the same body is accepted as revision 2. So the
          check must look at revision_state rather than at existence, and the
          revision_number counter must keep climbing across the rejected one.
        test_recipe:
          setup:
            - "An FP16-STD RETAIL project ${pj} with one SUBMITTED DrawingRevision ${rev1}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Two Revisions Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 160.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev1: $.data.id }
          trigger:
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 170.00, wind_load_kph: 120, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
            - call: "POST /drawing-revisions/${rev1}/review"
              payload: { decision: "REJECT", reason: "Cable route clashes with the access hatch" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 170.00, wind_load_kph: 120, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev2: $.data.id }
          assert:
            - "trigger call 1 -> 409 with ${err} == 'ERR_OPEN_REVISION_EXISTS'"
            - "trigger call 2 -> 200: DrawingRevision.${rev1}.revision_state == 'REJECTED' and DisplayProject.${pj}.engineering_state == 'REJECTED'"
            - "trigger call 3 -> 201: DrawingRevision.${rev2}.revision_number == 2   # the refused submission never consumed a number"
            - "DisplayProject.${pj}.engineering_state == 'UNDER_REVIEW' again and approved_revision_number is null"

      - name: cabinet_position_must_be_free_and_inside_the_grid
        claim_type: violation_to_error
        grounds:
          - validations[priority=42]
          - errors.ERR_CABINET_POSITION_TAKEN
        distinguishing_aspect: |
          One error code covers two different failures — a position already taken
          and a position outside the declared cabinet_grid_cols x cabinet_grid_rows
          envelope — so an implementation that only enforces the uniqueness index
          will happily create a cabinet at (2,1) in a 1x1 project and silently
          inflate cabinet_count, total_area_sqm and contract_amount_cents.
        test_recipe:
          setup:
            - "An FP10-IN project ${pj} declared as a 1x1 grid with cabinet (1,1) already created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
