            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "17 A St" }
              as: Donor
              as_user_id: "${donor_id}"
