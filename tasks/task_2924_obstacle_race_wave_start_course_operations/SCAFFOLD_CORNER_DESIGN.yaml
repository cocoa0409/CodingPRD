        distinguishing_aspect: "Priority 15 is two-sided: a normal outcome at an UNSTAFFED station is refused with ERR_OBSTACLE_UNMARSHALED and a SKIPPED_UNMARSHALED outcome at a staffed station is refused with ERR_OBSTACLE_MARSHALED, so neither direction can be waved through."
