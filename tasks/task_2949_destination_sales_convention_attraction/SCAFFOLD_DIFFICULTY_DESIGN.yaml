            - "HOP 2: ${hotel_peak} == 0 and ${hotel_nights} == 0; ${opp_peak} == 400 and ${coverage_after} == 40.00"
            - "HOP 3: ${bid_status_after} == DRAFT, ${round_after} == 2, ${submitted_after} == null, ${stage_after} == QUALIFIED"
            - "HOP 4: ${charge_after} == null, ${fund_committed} == 0.00, ${fund_uncommitted} == 500000.00, ${fund_posture} == OPEN"
            - "the two surviving commitments ${c_b_id} and ${c_c_id} are still COMMITTED - the cascade does not touch siblings"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_bid_state_priority_12_outranks_fund_insufficient_priority_36
        grounds:
          - validations[priority 12 ERR_INVALID_BID_STATE]
          - validations[priority 36 ERR_FUND_INSUFFICIENT]
          - validations[priority 35 ERR_INCENTIVE_EXCEEDS_CAP]
          - endpoints[POST /bid-packages/{id}/incentive-decisions]
        distinguishing_aspect: |
          The single decision call violates THREE rules at once - the bid is still DRAFT (priority 12), the
          approved amount blows through the cap (priority 35) and the total charge exceeds the fund's
          uncommitted balance of 5000.00 (priority 36). Only the lowest priority number may surface, so a
          money-first implementation that reaches for the fiscal checks returns ERR_FUND_INSUFFICIENT or
          ERR_INCENTIVE_EXCEEDS_CAP and fails.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; planner CDA; incentive fund FY2028 with budget_amount 5000.00 and uncommitted_amount 5000.00"
            - "opportunity QUALIFIED and a BidPackage that is still in status DRAFT - request-incentive was never called, so incentive_cap_amount is null"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /incentive-funds"
              payload: { fiscal_year: 2028, budget_amount: 5000.00 }
              as: BureauAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { opp_v_a: $.data.version }
            - call: "POST /bid-packages"
              payload: { opportunity_id: "${opp_id}", expected_opportunity_version: "${opp_v_a}" }
              as: SalesManager
              as_user_id: "sales-11"
              captures: { bid_id: $.data.id, bid_status: $.data.status }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { fund_v_a: $.data.version }
          trigger:
            - call: "POST /bid-packages/${bid_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 96000.00, rationale: "Attempt to approve a draft bid far beyond the balance", expected_fund_version: "${fund_v_a}" }
              as: IncentiveApprover
              as_user_id: "approver-01"
              captures: { err: $.data.error_id }
          assert:
            - "${bid_status} == DRAFT"
            - "HTTP 409 and ${err} == ERR_INVALID_BID_STATE"
            - "${err} != ERR_FUND_INSUFFICIENT and ${err} != ERR_INCENTIVE_EXCEEDS_CAP"
            - "IncentiveFund.${fund_id}.committed_amount == 0.00 and version unchanged at ${fund_v_a}"
            - "GET /bid-packages/${bid_id}/incentive-decisions returns 0 rows - a rejected call writes nothing"

      - name: segregation_of_duties_priority_15_outranks_incentive_exceeds_cap_priority_35
        grounds:
          - validations[priority 15 ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 35 ERR_INCENTIVE_EXCEEDS_CAP]
          - entities.BidPackage.fields.incentive_requested_by_user_id
          - rbac.role_model.segregation_of_duties
        distinguishing_aspect: |
          The acting X-User-ID sales-11 both requested the incentive and now decides it, AND the approved
          amount 60000.00 exceeds the recomputed cap 11086.88 (coverage 0.00 -> factor 0.75). Priority 15 must
          win over priority 35, which forces the duties check to run before any cap arithmetic; an
          implementation that computes money first reports ERR_INCENTIVE_EXCEEDS_CAP instead.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; planner CDA at tier TIER_B; fund FY2028 with budget 500000.00"
            - "opportunity QUALIFIED with no committed room block, so block_coverage_pct is 0.00 and coverage_factor is 0.75"
            - "BidPackage INCENTIVE_PENDING, prepared_by_user_id and incentive_requested_by_user_id both sales-11, incentive_cap_amount 11086.88"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
