      - name: deciding_a_draft_regulatory_report_is_not_a_declared_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.RegulatoryReport.DRAFT_to_SUBMITTED
          - validations[priority=9]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "DRAFT has exactly one outgoing trigger (submission); a Regulator ACCEPT aimed at a DRAFT report is 409 ERR_INVALID_STATE_TRANSITION even though the caller holds the right role, and the report keeps submitted_at null with submission_count 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, one DRAFT ANNUAL_LEAK_RATE report for 2026-01-01..2026-06-30 with leaked_lbs_method CHARGE_BASED and no systems."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { store_id: "${store_id}", report_type: "ANNUAL_LEAK_RATE", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", leaked_lbs_method: "CHARGE_BASED" }
              as: ComplianceManager
              captures: { report_id: $.data.id, report_status: $.data.status, report_due: $.data.due_on }
          trigger:
            - call: "POST /regulatory-reports/${report_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "RegulatoryReport.${report_id}.status == DRAFT, submitted_at == null, submission_count == 0, decided_at == null"
            - "RegulatoryReport.${report_id}.due_on == 2026-08-29T00:00:00Z and days_late == 0"
            - "RegulatoryReport.${report_id}.late_filing_assessment_usd == 0.00"

      - name: inspection_escalates_on_sweep_then_late_response_retains_escalation
        claim_type: valid_transition
        grounds:
          - state_machines.Inspection.OPEN_to_ESCALATED
          - state_machines.Inspection.ESCALATED_to_RESPONDED
          - entities.Inspection.fields.response_deadline
        distinguishing_aspect: "An unanswered inspection escalates on the sweep (response_deadline 2026-08-31 < 2026-09-05) and the later store response moves it to RESPONDED while escalated_at is deliberately retained as evidence of the lapse - the response does not erase the escalation, and the exposure figure keeps the COMPLIANT multiplier 1.00 throughout."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store with no systems (so it stays COMPLIANT), one inspection with a single MINOR citation of 1 violation day opened by regulator-1."
            - "Clock advanced to 2026-09-05T00:00:00Z, then a compliance run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /inspections"
              payload: { store_id: "${store_id}", inspector_name: "Inspector Vale", citations: [ { citation_code: "608-LEAK-REC", severity: "MINOR", violation_days: 1 } ] }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { insp_id: $.data.id, insp_deadline: $.data.response_deadline, insp_penalty: $.data.penalty_exposure_usd }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /compliance-runs"
              payload: { store_id: "${store_id}" }
              as: PlatformAdmin
              captures: { escalated_ids: $.data.escalated_inspection_ids }
          trigger:
            - call: "POST /inspections/${insp_id}/response"
              payload: { response_summary: "All records corrected and filed with the agency.", corrective_action_code: "RECORDS_CORRECTED" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { insp_status: $.data.status, insp_responded: $.data.responded_at }
          assert:
            - "at creation: response_deadline == 2026-08-31T00:00:00Z, status == OPEN, chronic_multiplier_applied == 1.00, penalty_exposure_usd == 275.55, capped == false"
            - "the run returns escalated_inspection_ids == [${insp_id}] and Inspection.${insp_id}.status == ESCALATED with escalated_at == 2026-09-05T00:00:00Z"
            - "HTTP 200 on the response: Inspection.${insp_id}.status == RESPONDED, responded_at == 2026-09-05T00:00:00Z"
            - "Inspection.${insp_id}.escalated_at is still 2026-09-05T00:00:00Z (not cleared) and corrective_action_code == RECORDS_CORRECTED"
            - "Inspection.${insp_id}.penalty_exposure_usd == 275.55 and Store.${store_id}.penalty_exposure_total_usd == 275.55"

      - name: filing_a_newer_plan_supersedes_the_draft_and_locks_it_out_of_submission
        claim_type: side_effect_execution
        grounds:
          - state_machines.RetrofitPlan.DRAFT_to_SUPERSEDED
          - state_machines.RetrofitPlan.DRAFT_to_SUBMITTED.preconditions
          - calculations.retrofit_compatibility_score
        distinguishing_aspect: "Creating a second plan for the same system flips only the earlier DRAFT to SUPERSEDED (the new plan stays DRAFT), and the superseded plan can never be submitted again - a 409 ERR_INVALID_STATE_TRANSITION - while both rows keep the same computed compatibility 84.1 COMPATIBLE and mandated false."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A and R-448A (gwp 1387, HIGH, HFC), SYS1 (full 100.0, initial 80.0), compliance_state COMPLIANT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-448A", gwp: 1387, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "ALLOWED" }
              as: ComplianceManager
              captures: { rt448_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /retrofit-plans"
              payload: { system_id: "${sys1_id}", plan_type: "RETROFIT", target_refrigerant_type_id: "${rt448_id}", due_on: "2026-12-01T00:00:00Z", estimated_cost_usd: 50000.00, expected_system_version: "${sys1_v}" }
              as: ComplianceManager
              captures: { plan1_id: $.data.id, plan1_score: $.data.compatibility_score }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v2: $.data.version }
            - call: "POST /retrofit-plans"
              payload: { system_id: "${sys1_id}", plan_type: "RETROFIT", target_refrigerant_type_id: "${rt448_id}", due_on: "2027-01-15T00:00:00Z", estimated_cost_usd: 61000.00, expected_system_version: "${sys1_v2}" }
              as: ComplianceManager
              captures: { plan2_id: $.data.id, plan2_status: $.data.status }
          trigger:
            - call: "POST /retrofit-plans/${plan1_id}/submission"
              payload: { submission_note: "Attempting to submit the superseded plan." }
              as: ComplianceManager
              captures: { err_id: $.data.error_id }
          assert:
            - "RetrofitPlan.${plan1_id}.status == SUPERSEDED after the second create"
            - "RetrofitPlan.${plan2_id}.status == DRAFT, submission_count == 0, submitted_at == null"
            - "both plans: compatibility_score == 84.1, compatibility_result == COMPATIBLE, gwp_reduction_pct == 64.6, mandated == false"
            - "HTTP 409 and error_id == ERR_INVALID_STATE_TRANSITION on the submission of ${plan1_id}"
            - "RetrofitPlan.${plan1_id}.submission_count stays 0"

      - name: technician_suspension_then_reinstatement_clears_the_reason_code
        claim_type: valid_transition
        grounds:
          - state_machines.Technician.ACTIVE_to_SUSPENDED
          - state_machines.Technician.SUSPENDED_to_ACTIVE
          - entities.Technician.fields.suspension_reason_code
        distinguishing_aspect: "Both directions of the technician cycle are real transitions with observable field effects: suspension stores the reason code, reinstatement clears it back to null, and a second suspension of an already-SUSPENDED technician is 409 ERR_INVALID_STATE_TRANSITION rather than a no-op."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One technician T1, ACTIVE at creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id, tech1_status: $.data.status }
            - call: "POST /technicians/${tech1_id}/status-change"
              payload: { new_status: "SUSPENDED", reason_code: "RECOVERY_PROCEDURE_VIOLATION" }
              as: ComplianceManager
              captures: { susp_status: $.data.status, susp_reason: $.data.suspension_reason_code }
            - call: "POST /technicians/${tech1_id}/status-change"
              payload: { new_status: "SUSPENDED", reason_code: "RECOVERY_PROCEDURE_VIOLATION" }
              as: ComplianceManager
              captures: { err_id: $.data.error_id }
          trigger:
            - call: "POST /technicians/${tech1_id}/status-change"
              payload: { new_status: "ACTIVE", reason_code: "RETRAINING_COMPLETED" }
              as: ComplianceManager
              captures: { final_status: $.data.status, final_reason: $.data.suspension_reason_code }
          assert:
            - "at creation Technician.${tech1_id}.status == ACTIVE, suspension_reason_code == null, repair_attempt_count == 0"
            - "after the first status-change: status == SUSPENDED and suspension_reason_code == RECOVERY_PROCEDURE_VIOLATION"
            - "the repeated SUSPENDED call is HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "after the reinstatement: HTTP 200, status == ACTIVE and suspension_reason_code == null"

