scenario: "2272. Airline Live Animal & Pet Travel Acceptance (airline cargo and passenger animal program): acceptance criteria by species, breed restrictions and container standards with ventilation and size requirements, temperature embargo rules by origin, destination and season with hold and rebooking procedures, in-cabin versus checked versus cargo routing with per-flight limits and reservation control, health certificate, vaccination and import permit verification by destination, connection time minimums and animal welfare handling procedures during transfers, service animal documentation and behavior standards distinct from pet policy, incident reporting for injury, loss or death with regulatory disclosure, kennel provisioning, feeding requirements and irregular operations care"
domain_name: "airline-live-animal-travel-acceptance"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "Expert (upper band, above the §0.4 expert ceiling as explicitly requested: 14 entities, 74 endpoints, 64 error codes, 9 calculations of which 2 are dual-variant, 53 ordered validations, 7 state machines carrying cyclic, parallel and fork-join shapes)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: SpeciesProfile
    parent: null
    common_fields: true
    fields:
      - name: species_code
        type: string
        source: input
        description: "Program species key, unique across SpeciesProfile"
        constraints: "uppercase A-Z and underscore, 2-24 chars, unique"
      - name: common_name
        type: string
        source: input
        description: "Human-readable species name used on paperwork"
      - name: acceptance_class
        type: enum
        source: input
        description: "Program-wide acceptance ceiling for the species"
        constraints: "ACCEPTED_ALL_ROUTINGS | CARGO_ONLY | EMBARGOED_SPECIES"
      - name: max_cabin_weight_kg
        type: number
        source: input
        description: "Combined animal + container gross weight ceiling for CABIN routing"
        constraints: ">= 0, <= 50"
      - name: min_age_weeks
        type: integer
        source: input
        description: "Minimum animal age in weeks for any acceptance"
        constraints: ">= 0"
      - name: requires_veterinary_review
        type: boolean
        source: input
        description: "When true, every HealthDocument of this species must be verified by VeterinaryReviewer"
        default: false
      - name: breed_restriction_count
        type: integer
        source: computed
        description: "Derived count of BreedRestriction rows with status ACTIVE whose species_profile_id equals this id"
        default: 0
      - name: status
        type: enum
        source: input
        description: "Configuration lifecycle of the species profile"
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: BreedRestriction
    parent: SpeciesProfile
    common_fields: true
    fields:
      - name: species_profile_id
        type: string
        source: input
        description: "FK -> SpeciesProfile.id; the species this breed rule narrows"
      - name: breed_name
        type: string
        source: input
        description: "Exact breed label matched case-insensitively against AnimalRecord.breed_name"
        constraints: "1-60 chars; unique per (species_profile_id, lowercased breed_name) among status ACTIVE rows"
      - name: restriction_type
        type: enum
        source: input
        description: "Kind of narrowing this row imposes"
        constraints: "SNUB_NOSED | BANNED | CARGO_ONLY | WEIGHT_CAPPED"
      - name: max_weight_kg
        type: number
        source: input
        description: "Gross weight ceiling; required when restriction_type is WEIGHT_CAPPED, must be null otherwise"
        default: null
      - name: status
        type: enum
        source: input
        description: "Restriction lifecycle; only ACTIVE rows participate in acceptance decisions"
        default: ACTIVE
        constraints: "ACTIVE | WITHDRAWN"

  - name: ContainerModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: "Container model key, unique across ContainerModel"
        constraints: "unique, 2-24 chars"
      - name: interior_length_cm
        type: number
        source: input
        description: "Usable interior length in centimetres"
        constraints: "> 0"
      - name: interior_width_cm
        type: number
        source: input
        description: "Usable interior width in centimetres"
        constraints: "> 0"
      - name: interior_height_cm
        type: number
        source: input
        description: "Usable interior height in centimetres"
        constraints: "> 0"
      - name: tare_weight_kg
        type: number
        source: input
        description: "Empty container weight added to animal weight to form gross weight"
        constraints: ">= 0"
      - name: ventilation_area_pct
        type: number
        source: input
        description: "Ventilated openings as a percentage of total wall area"
        constraints: ">= 0, <= 100"
      - name: ventilated_side_count
        type: integer
        source: input
        description: "Number of container sides carrying ventilation openings"
        constraints: "0-4"
      - name: wheels_removable
        type: boolean
        source: input
        description: "True when wheels are absent or removable, required for CARGO routing"
      - name: cabin_eligible
        type: boolean
        source: input
        description: "True when the model fits the under-seat envelope for CABIN routing"

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: iata_code
        type: string
        source: input
        description: "Three-letter station code, unique across Station"
        constraints: "exactly 3 uppercase letters, unique"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of the station"
        constraints: "exactly 2 uppercase letters"
      - name: kennel_bay_count
        type: integer
        source: input
        description: "Total holding bays available for KennelAllocation at this station"
        constraints: ">= 0"
      - name: reserved_bay_count
        type: integer
        source: computed
        description: "Derived sum of KennelAllocation.bay_count over rows at this station whose status is RESERVED or OCCUPIED"
        default: 0
      - name: status
        type: enum
        source: input
        description: "Station acceptance posture for live animals"
        default: ACCEPTING
        constraints: "ACCEPTING | SUSPENDED"

  - name: TemperatureEmbargoRule
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the station this embargo rule guards"
      - name: direction
        type: enum
        source: input
        description: "Whether the rule applies when the station is the leg origin or the leg destination"
        constraints: "ORIGIN | DESTINATION"
      - name: season_start_month_day
        type: string
        source: input
        description: "Inclusive season start as MM-DD; a window whose end sorts before its start wraps across 12-31"
        constraints: "matches ^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
      - name: season_end_month_day
        type: string
        source: input
        description: "Inclusive season end as MM-DD"
        constraints: "matches ^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
      - name: forecast_high_limit_c
        type: number
        source: input
        description: "Embargo triggers when the leg forecast high is >= this value"
      - name: forecast_low_limit_c
        type: number
        source: input
        description: "Embargo triggers when the leg forecast low is <= this value"
      - name: applies_to_routings
        type: array
        source: input
        description: "Routings the embargo suppresses; array of CABIN | CHECKED | CARGO, at least one member"
      - name: status
        type: enum
        source: input
        description: "Rule lifecycle; only ACTIVE rows participate in embargo determination"
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"

  - name: DestinationRequirement
    parent: SpeciesProfile
    common_fields: true
    fields:
      - name: species_profile_id
        type: string
        source: input
        description: "FK -> SpeciesProfile.id; species the import requirement applies to"
      - name: destination_country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country enforcing this requirement"
        constraints: "exactly 2 uppercase letters"
      - name: document_type
        type: enum
        source: input
        description: "Document class the destination demands"
        constraints: "HEALTH_CERTIFICATE | RABIES_VACCINATION | IMPORT_PERMIT | PARASITE_TREATMENT"
      - name: max_age_days_at_arrival
        type: integer
        source: input
        description: "Maximum permitted whole days between HealthDocument.issued_at and the final leg scheduled_arrival_utc"
        constraints: ">= 1"
      - name: mandatory
        type: boolean
        source: input
        description: "When true a VERIFIED HealthDocument of this document_type is required before acceptance"
        default: true
      - name: status
        type: enum
        source: input
        description: "Requirement lifecycle; only ACTIVE rows are enforced"
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"

  - name: FlightLeg
    parent: null
    common_fields: true
    fields:
      - name: flight_number
        type: string
        source: input
        description: "Marketing flight number of the leg"
      - name: origin_station_id
        type: string
        source: input
        description: "FK -> Station.id; departure station"
      - name: destination_station_id
        type: string
        source: input
        description: "FK -> Station.id; arrival station"
      - name: governing_embargo_rule_id
        type: string
        source: computed
        description: "FK -> TemperatureEmbargoRule.id; the single embargo rule selected by embargo_determination, null when no rule triggers"
        default: null
      - name: scheduled_departure_utc
        type: datetime
        source: input
        description: "Scheduled departure instant, ISO 8601 UTC"
      - name: scheduled_arrival_utc
        type: datetime
        source: input
        description: "Scheduled arrival instant, ISO 8601 UTC; must be strictly after scheduled_departure_utc"
      - name: block_minutes
        type: integer
        source: computed
        description: "Whole minutes between scheduled_departure_utc and scheduled_arrival_utc"
      - name: forecast_high_c
        type: number
        source: input
        description: "Forecast high temperature in Celsius used for embargo determination"
      - name: forecast_low_c
        type: number
        source: input
        description: "Forecast low temperature in Celsius used for embargo determination"
      - name: cabin_animal_limit
        type: integer
        source: input
        description: "Maximum SegmentAssignment rows with routing_type CABIN in status RESERVED or ACCEPTED"
        constraints: ">= 0"
      - name: checked_animal_limit
        type: integer
        source: input
        description: "Maximum SegmentAssignment rows with routing_type CHECKED in status RESERVED or ACCEPTED"
        constraints: ">= 0"
      - name: cargo_animal_limit
        type: integer
        source: input
        description: "Maximum SegmentAssignment rows with routing_type CARGO in status RESERVED or ACCEPTED"
        constraints: ">= 0"
      - name: booked_cabin_count
        type: integer
        source: computed
        description: "Derived count of SegmentAssignment rows on this leg with routing_type CABIN and status in {RESERVED, ACCEPTED}"
        default: 0
      - name: booked_checked_count
        type: integer
        source: computed
        description: "Derived count of SegmentAssignment rows on this leg with routing_type CHECKED and status in {RESERVED, ACCEPTED}"
        default: 0
      - name: booked_cargo_count
        type: integer
        source: computed
        description: "Derived count of SegmentAssignment rows on this leg with routing_type CARGO and status in {RESERVED, ACCEPTED}"
        default: 0
      - name: posture
        type: enum
        source: computed
        description: "Derived gate over child operations produced by leg_posture_derivation"
        default: OPEN
        constraints: "OPEN | RESTRICTED | EMBARGOED | CLOSED"
      - name: status
        type: enum
        source: input
        description: "Operational lifecycle of the leg"
        default: SCHEDULED
        constraints: "SCHEDULED | DELAYED | CANCELLED | DEPARTED | ARRIVED"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: passenger_name
        type: string
        source: input
        description: "Name of the travelling passenger or shipper of record"
      - name: contact_email
        type: string
        source: input
        description: "Contact address for hold and rebooking notices"
      - name: routing_type
        type: enum
        source: input
        description: "Requested carriage mode for every animal on the reservation"
        constraints: "CABIN | CHECKED | CARGO"
      - name: is_service_animal_booking
        type: boolean
        source: input
        description: "True when the booking is governed by service animal policy instead of pet policy"
        default: false
      - name: booked_by_agent_id
        type: string
        source: system
        description: "X-User-ID of the ReservationsAgent that created the reservation, retained for segregation of duties"
      - name: booking_status
        type: enum
        source: computed
        description: "First parallel state dimension: commercial lifecycle of the reservation"
        default: PENDING
        constraints: "PENDING | CONFIRMED | HOLD_PARTIAL | REBOOK_REQUIRED | IN_TRANSIT | INTERRUPTED | COMPLETED | CANCELLED"
      - name: compliance_status
        type: enum
        source: computed
        description: "Second parallel state dimension: documentation and import compliance posture, evolves independently of booking_status"
        default: UNVERIFIED
        constraints: "UNVERIFIED | IN_REVIEW | VERIFIED | DEFICIENT | EXPIRED"
      - name: animal_count
        type: integer
        source: computed
        description: "Derived count of AnimalRecord rows whose reservation_id equals this id and whose status is not DENIED"
        default: 0
      - name: subtotal_amount
        type: integer
        source: computed
        description: "Gross charged amount: sum of SegmentAssignment.segment_fee_amount over EVERY segment of the reservation's AnimalRecord rows in any status (releases and offloads stay in the sum and are offset through refunded_amount instead) plus irops_fee_total, in minor currency units"
        default: 0
      - name: irops_fee_total
        type: integer
        source: computed
        description: "Accumulated irregular-operations care fees in minor currency units"
        default: 0
      - name: loyalty_tier_pct
        type: number
        source: computed
        description: "Discount rate selected by reservation_charge_assembly from subtotal_amount"
        default: 0
      - name: loyalty_discount_amount
        type: integer
        source: computed
        description: "round_half_up((subtotal_amount - refunded_amount) * loyalty_tier_pct) in minor currency units"
        default: 0
      - name: refunded_amount
        type: integer
        source: computed
        description: "Accumulated refunds from embargo holds and cancellations in minor currency units"
        default: 0
      - name: net_payable_amount
        type: integer
        source: computed
        description: "subtotal_amount - refunded_amount - loyalty_discount_amount in minor currency units"
        default: 0

  - name: AnimalRecord
    parent: Reservation
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; owning reservation"
      - name: species_profile_id
        type: string
        source: input
        description: "FK -> SpeciesProfile.id; species of this animal"
      - name: container_model_id
        type: string
        source: input
        description: "FK -> ContainerModel.id; container the animal will travel in"
      - name: animal_name
        type: string
        source: input
        description: "Call name of the animal"
      - name: breed_name
        type: string
        source: input
        description: "Declared breed, matched case-insensitively against BreedRestriction.breed_name"
      - name: animal_kind
        type: enum
        source: input
        description: "Policy family applied to this animal"
        default: PET
        constraints: "PET | SERVICE_ANIMAL"
      - name: declared_weight_kg
        type: number
        source: input
        description: "Weight declared at reservation time, used by the PROVISIONAL_AT_RESERVATION fee variant"
        constraints: "> 0"
      - name: measured_weight_kg
        type: number
        source: input
        description: "Weight measured at acceptance, used by the FINAL_AT_ACCEPTANCE fee variant"
        default: null
      - name: height_at_shoulder_cm
        type: number
        source: input
        description: "Standing shoulder height, drives container height requirement"
        constraints: "> 0"
      - name: length_nose_to_tail_cm
        type: number
        source: input
        description: "Nose-to-tail-base length, drives container length requirement"
        constraints: "> 0"
      - name: age_weeks
        type: integer
        source: input
        description: "Animal age in whole weeks at booking"
        constraints: ">= 0"
      - name: chargeable_weight_kg
        type: integer
        source: computed
        description: "ceil(max(gross weight, volumetric weight)) produced by animal_travel_fee"
        default: 0
      - name: container_compliance_state
        type: enum
        source: computed
        description: "Outcome of container_compliance_evaluation"
        default: UNEVALUATED
        constraints: "UNEVALUATED | COMPLIANT | DEFICIENT"
      - name: deficiency_codes
        type: array
        source: computed
        description: "Ordered container deficiency codes emitted by container_compliance_evaluation"
        default: []
      - name: behavior_attestation_on_file
        type: boolean
        source: input
        description: "Service animal behavior standards attestation; ignored for animal_kind PET"
        default: false
      - name: status
        type: enum
        source: computed
        description: "Acceptance lifecycle of the animal"
        default: DRAFT
        constraints: "DRAFT | SCREENED | TRAVEL_READY | IN_TRANSIT | DELIVERED | DENIED | DECEASED"

  - name: SegmentAssignment
    parent: AnimalRecord
    common_fields: true
    fields:
      - name: animal_record_id
        type: string
        source: input
        description: "FK -> AnimalRecord.id; animal carried on this segment"
      - name: flight_leg_id
        type: string
        source: input
        description: "FK -> FlightLeg.id; leg the animal occupies"
      - name: routing_type
        type: enum
        source: input
        description: "Carriage mode occupied on this leg; must equal the owning Reservation.routing_type"
        constraints: "CABIN | CHECKED | CARGO"
      - name: sequence_index
        type: integer
        source: input
        description: "1-based position of this segment in the animal itinerary; unique per animal_record_id"
        constraints: ">= 1"
      - name: connection_minutes
        type: integer
        source: computed
        description: "Whole minutes between the previous segment scheduled_arrival_utc and this segment scheduled_departure_utc, null for sequence_index 1"
        default: null
      - name: required_welfare_check_count
        type: integer
        source: computed
        description: "Welfare checks the connection window demands, produced by connection_welfare_window"
        default: 0
      - name: completed_welfare_check_count
        type: integer
        source: computed
        description: "Derived count of WelfareCheck rows whose segment_assignment_id equals this id"
        default: 0
      - name: segment_fee_amount
        type: integer
        source: computed
        description: "Per-segment fee in minor currency units produced by animal_travel_fee"
        default: 0
      - name: fee_variant
        type: enum
        source: computed
        description: "Which animal_travel_fee variant produced segment_fee_amount"
        default: PROVISIONAL_AT_RESERVATION
        constraints: "PROVISIONAL_AT_RESERVATION | FINAL_AT_ACCEPTANCE"
      - name: status
        type: enum
        source: computed
        description: "Occupancy lifecycle of the segment"
        default: RESERVED
        constraints: "RESERVED | ACCEPTED | COMPLETED | OFFLOADED | RELEASED"

  - name: HealthDocument
    parent: AnimalRecord
    common_fields: true
    fields:
      - name: animal_record_id
        type: string
        source: input
        description: "FK -> AnimalRecord.id; animal the document certifies"
      - name: document_type
        type: enum
        source: input
        description: "Document class presented"
        constraints: "HEALTH_CERTIFICATE | RABIES_VACCINATION | IMPORT_PERMIT | PARASITE_TREATMENT"
      - name: issuing_country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of the issuing authority"
        constraints: "exactly 2 uppercase letters"
      - name: issued_at
        type: datetime
        source: input
        description: "Issue instant of the document, ISO 8601 UTC"
      - name: expires_at
        type: datetime
        source: input
        description: "Expiry instant of the document, ISO 8601 UTC; must be strictly after issued_at"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this document has re-entered SUBMITTED after a rejection"
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the reviewer that last moved the document out of UNDER_REVIEW"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Review lifecycle of the document"
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | VERIFIED | REJECTED | EXPIRED"

  - name: KennelAllocation
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station providing the holding bays"
      - name: animal_record_id
        type: string
        source: input
        description: "FK -> AnimalRecord.id; animal to be held"
      - name: bay_count
        type: integer
        source: input
        description: "Number of holding bays this allocation occupies"
        constraints: ">= 1"
      - name: occupancy_start_utc
        type: datetime
        source: input
        description: "Half-open interval start of bay occupancy, inclusive"
      - name: occupancy_end_utc
        type: datetime
        source: input
        description: "Half-open interval end of bay occupancy, exclusive; must be strictly after occupancy_start_utc"
      - name: feeding_interval_minutes
        type: integer
        source: input
        description: "Maximum minutes permitted between feedings while held"
        constraints: ">= 60, <= 720"
      - name: status
        type: enum
        source: computed
        description: "Occupancy lifecycle of the allocation"
        default: RESERVED
        constraints: "RESERVED | OCCUPIED | RELEASED"

  - name: WelfareCheck
    parent: SegmentAssignment
    common_fields: false
    fields:
      - name: segment_assignment_id
        type: string
        source: input
        description: "FK -> SegmentAssignment.id; segment during whose transfer the check was performed"
      - name: check_type
        type: enum
        source: input
        description: "Welfare handling action performed"
        constraints: "WATER | FEED | VISUAL | SANITATION"
      - name: recorded_at_utc
        type: datetime
        source: system
        description: "Logical clock instant at which the check was appended; append-only event, never updated"
      - name: performed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AcceptanceAgent that appended the check"
      - name: outcome
        type: enum
        source: input
        description: "Observed welfare outcome"
        default: NORMAL
        constraints: "NORMAL | CONCERN"
      - name: notes
        type: string
        source: input
        description: "Free-text handling note"
        default: null

  - name: AnimalIncident
    parent: AnimalRecord
    common_fields: true
    fields:
      - name: animal_record_id
        type: string
        source: input
        description: "FK -> AnimalRecord.id; animal involved in the incident"
      - name: segment_assignment_id
        type: string
        source: input
        description: "FK -> SegmentAssignment.id; segment during which the incident was discovered, null when discovered on the ground"
        default: null
      - name: incident_type
        type: enum
        source: input
        description: "Reportable event class"
        constraints: "INJURY | LOSS | DEATH"
      - name: discovered_at_utc
        type: datetime
        source: input
        description: "Instant the incident was discovered; starts the regulatory disclosure clock"
      - name: veterinary_finding
        type: enum
        source: input
        description: "Adjudicated cause attribution supplied at investigation close-out"
        default: null
        constraints: "CARRIER_ATTRIBUTABLE | PRE_EXISTING_CONDITION | INDETERMINATE"
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reporter, retained for segregation of duties"
      - name: investigated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that opened the investigation"
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that closed the incident"
        default: null
      - name: preliminary_severity_score
        type: integer
        source: computed
        description: "PRELIMINARY variant output of incident_severity_score, computed at report time"
        default: 0
      - name: adjudicated_severity_score
        type: integer
        source: computed
        description: "ADJUDICATED variant output of incident_severity_score, computed at close time"
        default: null
      - name: disclosure_required
        type: boolean
        source: computed
        description: "Whether regulatory disclosure is mandatory, produced by regulator_disclosure_deadline"
        default: false
      - name: disclosure_deadline_utc
        type: datetime
        source: computed
        description: "Deadline instant for regulatory disclosure, produced by regulator_disclosure_deadline"
        default: null
      - name: disclosed_at_utc
        type: datetime
        source: computed
        description: "Logical clock instant at which disclosure was filed"
        default: null
      - name: disclosure_on_time
        type: boolean
        source: computed
        description: "True when disclosed_at_utc <= disclosure_deadline_utc"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Investigation lifecycle of the incident"
        default: REPORTED
        constraints: "REPORTED | INVESTIGATING | REGULATOR_DISCLOSED | CLOSED"

state_machines:
  - entity: FlightLeg
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, ARRIVED]
    transitions:
      - from: SCHEDULED
        to: DELAYED
        trigger: "POST /flight-legs/{id}/delay"
        actor: ProgramAdmin
        preconditions:
          - "FlightLeg.status == SCHEDULED"
          - "new_departure_utc > FlightLeg.scheduled_departure_utc"
          - "new_arrival_utc > new_departure_utc"
        side_effects:
          - "scheduled_departure_utc and scheduled_arrival_utc overwritten with the supplied instants; block_minutes recomputed"
          - "cascade hop 1: every SegmentAssignment whose sequence_index is one greater than a segment on this leg for the same animal_record_id, and whose status is RESERVED, has connection_minutes and required_welfare_check_count recomputed by connection_welfare_window"
          - "cascade hop 2: every such SegmentAssignment whose recomputed connection_minutes < ROUTING_MIN for its routing_type, or > MAX_CONNECTION_MINUTES, transitions RESERVED -> RELEASED and decrements the corresponding booked_<routing>_count on its own FlightLeg, which re-derives that leg's posture"
          - "cascade hop 3: every Reservation owning a SegmentAssignment released in hop 2 has booking_status recomputed (HOLD_PARTIAL when it still retains at least one SegmentAssignment in status RESERVED or ACCEPTED, otherwise REBOOK_REQUIRED), refunded_amount incremented by the released segment_fee_amount, and reservation_charge_assembly re-run"
        note: "Delay is the second cascade origin; the connection recompute, not the delay itself, is what releases the downstream segment."
      - from: DELAYED
        to: SCHEDULED
        trigger: "POST /flight-legs/{id}/restore-schedule"
        actor: ProgramAdmin
        preconditions:
          - "FlightLeg.status == DELAYED"
          - "restored_departure_utc < FlightLeg.scheduled_departure_utc"
          - "restored_arrival_utc > restored_departure_utc"
        side_effects:
          - "scheduled_departure_utc, scheduled_arrival_utc, block_minutes restored to the supplied instants"
          - "connection_minutes and required_welfare_check_count recomputed for downstream SegmentAssignment rows in status RESERVED or ACCEPTED"
          - "posture re-derived by leg_posture_derivation"
        note: "Cyclic recovery edge: SCHEDULED -> DELAYED -> SCHEDULED; already-RELEASED segments are NOT restored."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /flight-legs/{id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "FlightLeg.status IN {SCHEDULED, DELAYED}"
        side_effects:
          - "posture set to CLOSED"
          - "every SegmentAssignment on this leg in status RESERVED transitions to RELEASED; booked_cabin_count, booked_checked_count and booked_cargo_count are decremented accordingly"
          - "every SegmentAssignment on this leg in status ACCEPTED transitions to OFFLOADED and its AnimalRecord returns from IN_TRANSIT to TRAVEL_READY"
          - "each affected Reservation has booking_status recomputed to HOLD_PARTIAL or REBOOK_REQUIRED, refunded_amount incremented by each released or offloaded segment_fee_amount, and reservation_charge_assembly re-run"
      - from: DELAYED
        to: CANCELLED
        trigger: "POST /flight-legs/{id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "FlightLeg.status IN {SCHEDULED, DELAYED}"
        side_effects:
          - "identical cascade to the SCHEDULED -> CANCELLED edge"
      - from: SCHEDULED
        to: DEPARTED
        trigger: "POST /flight-legs/{id}/depart"
        actor: AcceptanceAgent
        preconditions:
          - "FlightLeg.status IN {SCHEDULED, DELAYED}"
          - "FlightLeg.posture != EMBARGOED"
          - "no SegmentAssignment on this leg remains in status RESERVED"
          - "every SegmentAssignment on this leg in status ACCEPTED has completed_welfare_check_count >= required_welfare_check_count"
        side_effects:
          - "every ACCEPTED SegmentAssignment's AnimalRecord transitions TRAVEL_READY -> IN_TRANSIT"
          - "every Reservation owning such an AnimalRecord has booking_status set to IN_TRANSIT"
        note: "Guarded transition: the leg's own transition is gated on the aggregate state of its SegmentAssignment children."
      - from: DELAYED
        to: DEPARTED
        trigger: "POST /flight-legs/{id}/depart"
        actor: AcceptanceAgent
        preconditions:
          - "same preconditions as the SCHEDULED -> DEPARTED edge"
        side_effects:
          - "same side effects as the SCHEDULED -> DEPARTED edge"
      - from: DEPARTED
        to: ARRIVED
        trigger: "POST /flight-legs/{id}/arrive"
        actor: AcceptanceAgent
        preconditions:
          - "FlightLeg.status == DEPARTED"
        side_effects:
          - "every SegmentAssignment on this leg in status ACCEPTED transitions to COMPLETED"
          - "for each such SegmentAssignment whose sequence_index equals the maximum sequence_index of non-RELEASED segments for its animal_record_id, the AnimalRecord transitions IN_TRANSIT -> DELIVERED"
          - "bubble-up: a Reservation whose every AnimalRecord with status not in {DENIED} is DELIVERED transitions booking_status IN_TRANSIT -> COMPLETED"
          - "for each AnimalRecord that is NOT on its final segment, a KennelAllocation may be created separately; no automatic allocation is made here"

  - entity: Reservation
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: ReservationsAgent
        preconditions:
          - "Reservation.booking_status == PENDING"
          - "Reservation.compliance_status == VERIFIED"
          - "Reservation.animal_count >= 1"
          - "every AnimalRecord of the reservation with status not in {DENIED} has status TRAVEL_READY"
          - "every such AnimalRecord has at least one SegmentAssignment in status RESERVED"
        side_effects:
          - "reservation_charge_assembly re-run: subtotal_amount, loyalty_tier_pct, loyalty_discount_amount, net_payable_amount refreshed"
        note: "booking_status dimension. Cross-dimension guard: the commercial edge reads the compliance dimension but never writes it."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: ReservationsAgent
        preconditions:
          - "Reservation.booking_status IN {PENDING, CONFIRMED, HOLD_PARTIAL, REBOOK_REQUIRED}"
        side_effects:
          - "every SegmentAssignment of every AnimalRecord of this reservation in status RESERVED transitions to RELEASED with the owning FlightLeg booked counters decremented and posture re-derived"
          - "every KennelAllocation whose animal_record_id belongs to this reservation and whose status is RESERVED or OCCUPIED transitions to RELEASED and decrements Station.reserved_bay_count"
          - "refunded_amount incremented by round_half_up(subtotal_amount * CANCEL_REFUND_PCT)"
          - "reservation_charge_assembly re-run so subtotal_amount == net_payable_amount + loyalty_discount_amount + refunded_amount still holds"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: ReservationsAgent
        preconditions:
          - "Reservation.booking_status IN {PENDING, CONFIRMED, HOLD_PARTIAL, REBOOK_REQUIRED}"
        side_effects:
          - "identical to the PENDING -> CANCELLED edge"
      - from: CONFIRMED
        to: HOLD_PARTIAL
        trigger: "system: embargo determination, leg cancellation or leg delay releases some but not all segments of the reservation"
        actor: system
        preconditions:
          - "at least one SegmentAssignment of the reservation transitioned RESERVED -> RELEASED in the current request"
          - "the reservation still retains at least one SegmentAssignment in status RESERVED or ACCEPTED"
        side_effects:
          - "refunded_amount incremented by the released segment_fee_amount; reservation_charge_assembly re-run"
      - from: CONFIRMED
        to: REBOOK_REQUIRED
        trigger: "system: embargo determination, leg cancellation or leg delay releases every remaining segment of the reservation"
        actor: system
        preconditions:
          - "no SegmentAssignment of the reservation remains in status RESERVED or ACCEPTED"
        side_effects:
          - "refunded_amount incremented by the released segment_fee_amount; reservation_charge_assembly re-run"
      - from: HOLD_PARTIAL
        to: REBOOK_REQUIRED
        trigger: "system: the last remaining RESERVED segment of a held reservation is released"
        actor: system
        preconditions:
          - "no SegmentAssignment of the reservation remains in status RESERVED or ACCEPTED"
        side_effects:
          - "refunded_amount incremented by the released segment_fee_amount; reservation_charge_assembly re-run"
      - from: REBOOK_REQUIRED
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: ReservationsAgent
        preconditions:
          - "Reservation.booking_status == REBOOK_REQUIRED"
          - "Reservation.compliance_status == VERIFIED"
          - "every AnimalRecord with status not in {DENIED} has at least one SegmentAssignment in status RESERVED on a FlightLeg whose posture is OPEN or RESTRICTED"
        side_effects:
          - "reservation_charge_assembly re-run"
        note: "Cyclic edge: CONFIRMED -> REBOOK_REQUIRED -> CONFIRMED closes the rebooking loop; refunded_amount is never reversed."
      - from: HOLD_PARTIAL
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: ReservationsAgent
        preconditions:
          - "Reservation.booking_status == HOLD_PARTIAL"
          - "Reservation.compliance_status == VERIFIED"
          - "every AnimalRecord with status not in {DENIED} has a contiguous SegmentAssignment chain in status RESERVED starting at sequence_index 1"
        side_effects:
          - "reservation_charge_assembly re-run"
      - from: CONFIRMED
        to: IN_TRANSIT
        trigger: "system: POST /flight-legs/{id}/depart carries an ACCEPTED segment of this reservation"
        actor: system
        preconditions:
          - "Reservation.booking_status == CONFIRMED"
        side_effects:
          - "each carried AnimalRecord transitions TRAVEL_READY -> IN_TRANSIT"
      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "system: POST /flight-legs/{id}/arrive delivers the final segment of every animal on the reservation"
        actor: system
        preconditions:
          - "every AnimalRecord of the reservation with status not in {DENIED} has status DELIVERED"
        side_effects:
          - "reservation_charge_assembly re-run one final time"
      - from: IN_TRANSIT
        to: INTERRUPTED
        trigger: "system: POST /animal-incidents with incident_type LOSS or DEATH, or POST /segment-assignments/{id}/offload"
        actor: system
        preconditions:
          - "Reservation.booking_status == IN_TRANSIT"
        side_effects:
          - "affected AnimalRecord transitions to DECEASED (DEATH) or DENIED (LOSS); its remaining SegmentAssignment rows are OFFLOADED or RELEASED"
      - from: UNVERIFIED
        to: IN_REVIEW
        trigger: "system: POST /health-documents/{id}/start-review on any HealthDocument of the reservation"
        actor: system
        preconditions:
          - "Reservation.compliance_status IN {UNVERIFIED, DEFICIENT, EXPIRED}"
        side_effects:
          - "compliance_status set to IN_REVIEW; booking_status unchanged"
        note: "compliance_status dimension - evolves independently of booking_status on the same row."
      - from: IN_REVIEW
        to: VERIFIED
        trigger: "POST /reservations/{id}/verify-compliance"
        actor: VeterinaryReviewer
        preconditions:
          - "Reservation.compliance_status IN {IN_REVIEW, EXPIRED}"
          - "for every AnimalRecord with status not in {DENIED} and every ACTIVE DestinationRequirement with mandatory true matching the animal's species_profile_id and the destination_station_id country of the animal's highest-sequence_index segment, a HealthDocument of that document_type exists in status VERIFIED whose issued_at is at most max_age_days_at_arrival whole days before that segment's FlightLeg.scheduled_arrival_utc"
          - "every such HealthDocument has expires_at > logical clock"
        side_effects:
          - "compliance_status set to VERIFIED; booking_status unchanged"
        note: "Atomic all-or-nothing: when any required document is missing the request fails with no field written; when a required VERIFIED document has expires_at <= clock the request succeeds and the outcome is the EXPIRED edge below."
      - from: IN_REVIEW
        to: EXPIRED
        trigger: "POST /reservations/{id}/verify-compliance"
        actor: VeterinaryReviewer
        preconditions:
          - "Reservation.compliance_status IN {IN_REVIEW, VERIFIED, EXPIRED}"
          - "every mandatory document exists in status VERIFIED but at least one has expires_at <= logical clock"
        side_effects:
          - "each such HealthDocument transitions VERIFIED -> EXPIRED"
          - "compliance_status set to EXPIRED; booking_status unchanged"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /reservations/{id}/verify-compliance after the logical clock advances past a verified document's expires_at"
        actor: VeterinaryReviewer
        preconditions:
          - "Reservation.compliance_status == VERIFIED"
          - "at least one HealthDocument backing a mandatory requirement has expires_at <= logical clock"
        side_effects:
          - "each such HealthDocument transitions VERIFIED -> EXPIRED; compliance_status set to EXPIRED"
      - from: IN_REVIEW
        to: DEFICIENT
        trigger: "system: POST /health-documents/{id}/reject on a HealthDocument of the reservation"
        actor: system
        preconditions:
          - "Reservation.compliance_status IN {IN_REVIEW, VERIFIED}"
        side_effects:
          - "compliance_status set to DEFICIENT; the animal's status returns TRAVEL_READY -> SCREENED when it was TRAVEL_READY"
      - from: VERIFIED
        to: DEFICIENT
        trigger: "system: POST /health-documents/{id}/reject on a HealthDocument of the reservation"
        actor: system
        preconditions:
          - "Reservation.compliance_status IN {IN_REVIEW, VERIFIED}"
        side_effects:
          - "compliance_status set to DEFICIENT; the animal's status returns TRAVEL_READY -> SCREENED when it was TRAVEL_READY"
      - from: DEFICIENT
        to: IN_REVIEW
        trigger: "system: POST /health-documents/{id}/start-review after a resubmission"
        actor: system
        preconditions:
          - "Reservation.compliance_status == DEFICIENT"
        side_effects:
          - "compliance_status set to IN_REVIEW"
      - from: EXPIRED
        to: IN_REVIEW
        trigger: "system: POST /health-documents/{id}/start-review on a replacement document"
        actor: system
        preconditions:
          - "Reservation.compliance_status == EXPIRED"
        side_effects:
          - "compliance_status set to IN_REVIEW"

  - entity: AnimalRecord
    initial_state: DRAFT
    terminal_states: [DELIVERED, DENIED, DECEASED]
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /animal-records/{id}/screen"
        actor: AcceptanceAgent
        preconditions:
          - "AnimalRecord.status IN {DRAFT, TRAVEL_READY}"
          - "SpeciesProfile.status == ACTIVE"
          - "SpeciesProfile.acceptance_class != EMBARGOED_SPECIES"
          - "no ACTIVE BreedRestriction with restriction_type BANNED matches AnimalRecord.breed_name"
          - "AnimalRecord.age_weeks >= SpeciesProfile.min_age_weeks"
        side_effects:
          - "container_compliance_evaluation runs: container_compliance_state and deficiency_codes overwritten"
          - "animal_travel_fee PROVISIONAL_AT_RESERVATION variant runs: chargeable_weight_kg overwritten and every SegmentAssignment in status RESERVED has segment_fee_amount and fee_variant refreshed"
          - "Reservation.subtotal_amount, loyalty_tier_pct, loyalty_discount_amount and net_payable_amount recomputed by reservation_charge_assembly"
      - from: TRAVEL_READY
        to: SCREENED
        trigger: "POST /animal-records/{id}/screen after a container or weight change"
        actor: AcceptanceAgent
        preconditions:
          - "AnimalRecord.status IN {DRAFT, TRAVEL_READY}"
        side_effects:
          - "same side effects as the DRAFT -> SCREENED edge"
        note: "Cyclic edge: SCREENED -> TRAVEL_READY -> SCREENED re-screening loop."
      - from: SCREENED
        to: TRAVEL_READY
        trigger: "POST /animal-records/{id}/mark-travel-ready"
        actor: AcceptanceAgent
        preconditions:
          - "AnimalRecord.status == SCREENED"
          - "AnimalRecord.container_compliance_state == COMPLIANT"
          - "AnimalRecord has at least one SegmentAssignment in status RESERVED with sequence_index 1"
          - "when animal_kind == SERVICE_ANIMAL: behavior_attestation_on_file == true"
          - "when animal_kind == PET: every ACTIVE mandatory DestinationRequirement for the species and destination country has a HealthDocument in status VERIFIED"
        side_effects:
          - "Reservation.animal_count recomputed"
        note: "Service animal policy diverges from pet policy on this edge: attestation replaces the import-document gate."
      - from: DRAFT
        to: DENIED
        trigger: "POST /animal-records/{id}/deny"
        actor: AcceptanceAgent
        preconditions:
          - "AnimalRecord.status IN {DRAFT, SCREENED}"
        side_effects:
          - "every SegmentAssignment of the animal in status RESERVED transitions to RELEASED with the owning FlightLeg counters decremented and posture re-derived"
          - "Reservation.animal_count and reservation_charge_assembly recomputed"
      - from: SCREENED
        to: DENIED
        trigger: "POST /animal-records/{id}/deny"
        actor: AcceptanceAgent
        preconditions:
          - "AnimalRecord.status IN {DRAFT, SCREENED}"
        side_effects:
          - "identical to the DRAFT -> DENIED edge"
      - from: TRAVEL_READY
        to: IN_TRANSIT
        trigger: "system: POST /flight-legs/{id}/depart"
        actor: system
        preconditions:
          - "AnimalRecord.status == TRAVEL_READY"
          - "the animal has a SegmentAssignment in status ACCEPTED on the departing leg"
        side_effects:
          - "owning Reservation booking_status set to IN_TRANSIT"
      - from: IN_TRANSIT
        to: TRAVEL_READY
        trigger: "system: POST /flight-legs/{id}/cancel offloads an ACCEPTED segment"
        actor: system
        preconditions:
          - "AnimalRecord.status == IN_TRANSIT"
        side_effects:
          - "the offloaded SegmentAssignment transitions ACCEPTED -> OFFLOADED"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system: POST /flight-legs/{id}/arrive completes the animal's highest-sequence_index segment"
        actor: system
        preconditions:
          - "AnimalRecord.status == IN_TRANSIT"
        side_effects:
          - "owning Reservation booking_status set to COMPLETED once every non-DENIED animal is DELIVERED"
      - from: IN_TRANSIT
        to: DECEASED
        trigger: "system: POST /animal-incidents with incident_type DEATH"
        actor: system
        preconditions:
          - "AnimalRecord.status IN {TRAVEL_READY, IN_TRANSIT}"
        side_effects:
          - "cascade hop 1: AnimalRecord.status set to DECEASED"
          - "cascade hop 2: every SegmentAssignment of the animal in status RESERVED transitions to RELEASED and every one in status ACCEPTED transitions to OFFLOADED, each decrementing the owning FlightLeg's booked_<routing>_count and re-deriving that leg's posture"
          - "cascade hop 3: every KennelAllocation for the animal in status RESERVED or OCCUPIED transitions to RELEASED, decrementing Station.reserved_bay_count; the owning Reservation booking_status becomes INTERRUPTED and refunded_amount is incremented by the released and offloaded segment_fee_amount with reservation_charge_assembly re-run"
      - from: TRAVEL_READY
        to: DECEASED
        trigger: "system: POST /animal-incidents with incident_type DEATH before departure"
        actor: system
        preconditions:
          - "AnimalRecord.status IN {TRAVEL_READY, IN_TRANSIT}"
        side_effects:
          - "identical three-hop cascade to the IN_TRANSIT -> DECEASED edge"

  - entity: SegmentAssignment
    initial_state: RESERVED
    terminal_states: [COMPLETED, OFFLOADED, RELEASED]
    transitions:
      - from: RESERVED
        to: ACCEPTED
        trigger: "POST /segment-assignments/{id}/accept"
        actor: AcceptanceAgent
        preconditions:
          - "SegmentAssignment.status == RESERVED"
          - "acting X-User-ID != owning Reservation.booked_by_agent_id"
          - "FlightLeg.status IN {SCHEDULED, DELAYED} and FlightLeg.posture IN {OPEN, RESTRICTED}"
          - "AnimalRecord.status == TRAVEL_READY"
          - "owning Reservation.booking_status IN {CONFIRMED, HOLD_PARTIAL}"
          - "owning Reservation.compliance_status == VERIFIED"
          - "measured_weight_kg is present on the AnimalRecord"
        side_effects:
          - "animal_travel_fee FINAL_AT_ACCEPTANCE variant runs on this segment: segment_fee_amount recomputed from measured_weight_kg and fee_variant set to FINAL_AT_ACCEPTANCE"
          - "AnimalRecord.chargeable_weight_kg recomputed from measured_weight_kg"
          - "Reservation.subtotal_amount, loyalty_tier_pct, loyalty_discount_amount, net_payable_amount recomputed by reservation_charge_assembly"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /segment-assignments/{id}/release, or system cascade from embargo determination, leg delay, leg cancellation, animal denial or reservation cancellation"
        actor: ReservationsAgent
        preconditions:
          - "SegmentAssignment.status == RESERVED"
        side_effects:
          - "owning FlightLeg booked_<routing_type>_count decremented by 1 and posture re-derived"
          - "owning Reservation refunded_amount incremented by segment_fee_amount, booking_status recomputed to HOLD_PARTIAL or REBOOK_REQUIRED, reservation_charge_assembly re-run"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "system: POST /flight-legs/{id}/arrive"
        actor: system
        preconditions:
          - "SegmentAssignment.status == ACCEPTED"
          - "FlightLeg.status == DEPARTED"
        side_effects:
          - "AnimalRecord transitions to DELIVERED when this is its highest-sequence_index non-RELEASED segment"
      - from: ACCEPTED
        to: OFFLOADED
        trigger: "POST /segment-assignments/{id}/offload, or system cascade from leg cancellation or a DEATH incident"
        actor: AcceptanceAgent
        preconditions:
          - "SegmentAssignment.status == ACCEPTED"
        side_effects:
          - "owning FlightLeg booked_<routing_type>_count decremented by 1 and posture re-derived"
          - "owning Reservation refunded_amount incremented by segment_fee_amount, booking_status set to INTERRUPTED when it was IN_TRANSIT, reservation_charge_assembly re-run"

  - entity: HealthDocument
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /health-documents/{id}/start-review"
        actor: VeterinaryReviewer
        preconditions:
          - "HealthDocument.status == SUBMITTED"
          - "AnimalRecord.status NOT IN {DENIED, DECEASED, DELIVERED}"
        side_effects:
          - "owning Reservation.compliance_status set to IN_REVIEW when it is UNVERIFIED, DEFICIENT or EXPIRED"
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /health-documents/{id}/verify"
        actor: VeterinaryReviewer
        preconditions:
          - "HealthDocument.status == UNDER_REVIEW"
          - "HealthDocument.expires_at > logical clock"
          - "when SpeciesProfile.requires_veterinary_review is true the actor role is VeterinaryReviewer"
        side_effects:
          - "reviewed_by_user_id set to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "POST /health-documents/{id}/verify when the logical clock has passed expires_at"
        actor: VeterinaryReviewer
        preconditions:
          - "HealthDocument.status == UNDER_REVIEW"
          - "HealthDocument.expires_at <= logical clock"
        side_effects:
          - "reviewed_by_user_id set to the acting X-User-ID; the document is terminal and a replacement must be submitted"
        note: "Same endpoint, two outcomes decided by the clock; both return 200 and the response status field distinguishes them."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /health-documents/{id}/reject"
        actor: VeterinaryReviewer
        preconditions:
          - "HealthDocument.status == UNDER_REVIEW"
        side_effects:
          - "reviewed_by_user_id set to the acting X-User-ID"
          - "owning Reservation.compliance_status set to DEFICIENT"
          - "owning AnimalRecord returns TRAVEL_READY -> SCREENED when it was TRAVEL_READY"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /health-documents/{id}/resubmit"
        actor: ReservationsAgent
        preconditions:
          - "HealthDocument.status == REJECTED"
          - "HealthDocument.revision_count < MAX_DOCUMENT_REVISIONS"
        side_effects:
          - "revision_count incremented by 1; issued_at and expires_at overwritten with the supplied instants; reviewed_by_user_id cleared to null"
        note: "Cyclic edge: SUBMITTED -> UNDER_REVIEW -> REJECTED -> SUBMITTED, capped at MAX_DOCUMENT_REVISIONS revisions."
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: POST /reservations/{id}/verify-compliance when the logical clock has passed expires_at"
        actor: system
        preconditions:
          - "HealthDocument.status == VERIFIED"
          - "HealthDocument.expires_at <= logical clock"
        side_effects:
          - "owning Reservation.compliance_status set to EXPIRED"

  - entity: KennelAllocation
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: OCCUPIED
        trigger: "POST /kennel-allocations/{id}/occupy"
        actor: AcceptanceAgent
        preconditions:
          - "KennelAllocation.status == RESERVED"
          - "logical clock >= occupancy_start_utc"
          - "AnimalRecord.status IN {TRAVEL_READY, IN_TRANSIT}"
        side_effects:
          - "Station.reserved_bay_count unchanged; the allocation continues to consume bay_count bays"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /kennel-allocations/{id}/release, or system cascade from a DEATH incident or reservation cancellation"
        actor: AcceptanceAgent
        preconditions:
          - "KennelAllocation.status IN {RESERVED, OCCUPIED}"
        side_effects:
          - "Station.reserved_bay_count decremented by bay_count"
      - from: OCCUPIED
        to: RELEASED
        trigger: "POST /kennel-allocations/{id}/release"
        actor: AcceptanceAgent
        preconditions:
          - "KennelAllocation.status IN {RESERVED, OCCUPIED}"
        side_effects:
          - "Station.reserved_bay_count decremented by bay_count"

  - entity: AnimalIncident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /animal-incidents/{id}/investigate"
        actor: ComplianceOfficer
        preconditions:
          - "AnimalIncident.status == REPORTED"
          - "acting X-User-ID != AnimalIncident.reported_by_user_id"
        side_effects:
          - "investigated_by_user_id set to the acting X-User-ID"
      - from: INVESTIGATING
        to: REGULATOR_DISCLOSED
        trigger: "POST /animal-incidents/{id}/disclose"
        actor: ComplianceOfficer
        preconditions:
          - "AnimalIncident.status == INVESTIGATING"
          - "AnimalIncident.disclosure_required == true"
        side_effects:
          - "disclosed_at_utc set to the logical clock; disclosure_on_time set to (disclosed_at_utc <= disclosure_deadline_utc)"
        note: "Fork branch A of the fork-join: disclosure-bearing incidents must pass through this state before CLOSED."
      - from: INVESTIGATING
        to: CLOSED
        trigger: "POST /animal-incidents/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "AnimalIncident.status IN {INVESTIGATING, REGULATOR_DISCLOSED}"
          - "AnimalIncident.disclosure_required == false"
          - "veterinary_finding supplied in the request body"
          - "acting X-User-ID != AnimalIncident.investigated_by_user_id"
        side_effects:
          - "closed_by_user_id set to the acting X-User-ID; incident_severity_score ADJUDICATED variant runs and writes adjudicated_severity_score"
        note: "Fork branch B: non-disclosable incidents close directly, with a different side-effect set from branch A (no disclosure fields written)."
      - from: REGULATOR_DISCLOSED
        to: CLOSED
        trigger: "POST /animal-incidents/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "AnimalIncident.status IN {INVESTIGATING, REGULATOR_DISCLOSED}"
          - "veterinary_finding supplied in the request body"
          - "acting X-User-ID != AnimalIncident.investigated_by_user_id"
        side_effects:
          - "closed_by_user_id set to the acting X-User-ID; incident_severity_score ADJUDICATED variant runs and writes adjudicated_severity_score including the LATE_DISCLOSURE_PENALTY when disclosure_on_time is false"
        note: "Join point: both branches converge on CLOSED, but branch A's adjudicated score carries the late-disclosure penalty term."

concurrency_rules:
  - rule_id: assignment-create-stale-leg
    parent_entity: FlightLeg
    write_endpoint: "POST /segment-assignments"
    occ_field: "expected_flight_leg_version"
    description: |
      Creating a SegmentAssignment against a FlightLeg whose version has advanced
      since the client last observed it is rejected. A per-flight routing limit is
      finite, and every accepted, released or offloaded assignment advances the leg's
      booked counters and version; a writer holding a stale version has made its
      routing-limit decision against a superseded booked count, so the create is
      refused with a stale-version error instead of being allowed to oversubscribe.
    error_id: ERR_STALE_FLIGHT_LEG_VERSION
    http_status: 412
  - rule_id: kennel-allocate-stale-station
    parent_entity: Station
    write_endpoint: "POST /kennel-allocations"
    occ_field: "expected_station_version"
    description: |
      Creating a KennelAllocation against a Station whose version has advanced since
      the client last observed it is rejected. Station.reserved_bay_count is the pool
      the aggregate-capacity check reads, and every allocation create or release
      advances it together with the station version; a writer carrying a stale version
      computed its projected occupancy from a superseded bay pool and is refused.
    error_id: ERR_STALE_STATION_VERSION
    http_status: 412

calculations:
  - name: animal_travel_fee
    trigger: "POST /animal-records/{id}/screen writes the PROVISIONAL_AT_RESERVATION variant onto every SegmentAssignment of the animal in status RESERVED; POST /segment-assignments/{id}/accept rewrites the single accepted segment with the FINAL_AT_ACCEPTANCE variant"
    algorithm: tiered_pricing
    formula: |
      # step 1 - weight basis (variant-dependent, see variants below)
      weight_source_kg   = declared_weight_kg   # PROVISIONAL_AT_RESERVATION
                         | measured_weight_kg   # FINAL_AT_ACCEPTANCE
      gross_weight_kg      = weight_source_kg + ContainerModel.tare_weight_kg
      volumetric_weight_kg = (ContainerModel.interior_length_cm
                              * ContainerModel.interior_width_cm
                              * ContainerModel.interior_height_cm) / VOLUMETRIC_DIVISOR
      chargeable_weight_kg = ceil(max(gross_weight_kg, volumetric_weight_kg))   # whole kg

      # step 2 - non-linear weight component (two marginal rates, free allowance)
      c = chargeable_weight_kg
      if c <= WEIGHT_FREE_ALLOWANCE_KG:
          weight_component = 0
      else:
          weight_component = (min(c, WEIGHT_BREAK_KG) - WEIGHT_FREE_ALLOWANCE_KG) * WEIGHT_RATE_LOW
                           + max(c - WEIGHT_BREAK_KG, 0) * WEIGHT_RATE_HIGH

      # step 3 - per-segment base plus multipliers, in this pinned order
      segment_fee = BASE_FEE[SegmentAssignment.routing_type] + weight_component
      if snub_nosed and SegmentAssignment.routing_type != 'CABIN':
          segment_fee = round_half_up(segment_fee * SNUB_NOSED_MULTIPLIER)
      if FlightLeg.block_minutes > LONG_HAUL_BLOCK_MINUTES and AnimalRecord.animal_kind == 'PET':
          segment_fee = round_half_up(segment_fee * LONG_HAUL_MULTIPLIER)
      SegmentAssignment.segment_fee_amount = segment_fee     # integer minor units

      # step 4 - ROUNDING ORDER IS PINNED: round per segment (step 3), THEN sum.
      # Summing unrounded segment fees and rounding once at the reservation level is
      # explicitly NOT the rule and produces a different total.
      reservation_segment_total = sum(SegmentAssignment.segment_fee_amount
                                     for every segment of the reservation, any status)
      # snub_nosed is true iff an ACTIVE BreedRestriction row exists whose
      # species_profile_id == AnimalRecord.species_profile_id, whose restriction_type
      # is SNUB_NOSED, and whose lowercased breed_name equals lowercased
      # AnimalRecord.breed_name.
    input_set: "SegmentAssignment rows of the animal in status RESERVED (provisional recompute) or the single row in status RESERVED being accepted (final); rows in status RELEASED, OFFLOADED are excluded and keep their last computed segment_fee_amount for refund purposes"
    constants:
      BASE_FEE_CABIN: 12500
      BASE_FEE_CHECKED: 20000
      BASE_FEE_CARGO: 27500
      VOLUMETRIC_DIVISOR: 6000
      WEIGHT_FREE_ALLOWANCE_KG: 10
      WEIGHT_BREAK_KG: 32
      WEIGHT_RATE_LOW: 450
      WEIGHT_RATE_HIGH: 700
      SNUB_NOSED_MULTIPLIER: 1.15
      LONG_HAUL_MULTIPLIER: 1.20
      LONG_HAUL_BLOCK_MINUTES: 480
    precision: "chargeable_weight_kg is ceiled to whole kg; every multiplier result is round_half_up to whole minor currency units; segment fees are rounded before summation"
    variants:
      - name: PROVISIONAL_AT_RESERVATION
        when: "POST /animal-records/{id}/screen, i.e. before the animal is physically weighed"
        difference: "weight_source_kg = declared_weight_kg; fee_variant is written as PROVISIONAL_AT_RESERVATION on every RESERVED segment"
      - name: FINAL_AT_ACCEPTANCE
        when: "POST /segment-assignments/{id}/accept, when the animal is on the scale at the counter"
        difference: "weight_source_kg = measured_weight_kg; only the accepted segment is rewritten, so a multi-segment itinerary can legitimately carry one FINAL_AT_ACCEPTANCE segment and one PROVISIONAL_AT_RESERVATION segment at the same moment, and Reservation.subtotal_amount is the mixed-variant sum"

  - name: container_compliance_evaluation
    trigger: "POST /animal-records/{id}/screen"
    algorithm: constraint_propagation
    formula: |
      required_height_cm      = ceil(AnimalRecord.height_at_shoulder_cm + HEIGHT_CLEARANCE_CM)
      required_length_cm      = ceil(AnimalRecord.length_nose_to_tail_cm * LENGTH_FACTOR)
      required_ventilation_pct = VENT_BASE_PCT
                                 + ceil(AnimalRecord.chargeable_weight_kg / VENT_WEIGHT_DIVISOR_KG)
      required_vent_side_count = 2 if chargeable_weight_kg <= 20
                                 else 3 if chargeable_weight_kg <= WEIGHT_BREAK_KG
                                 else 4
      routing = owning Reservation.routing_type

      deficiency_codes = []   # APPENDED IN EXACTLY THIS ORDER
      if ContainerModel.interior_height_cm < required_height_cm:        append 'HEIGHT'
      if ContainerModel.interior_length_cm < required_length_cm:        append 'LENGTH'
      if ContainerModel.ventilation_area_pct < required_ventilation_pct: append 'VENT_PCT'
      if ContainerModel.ventilated_side_count < required_vent_side_count: append 'VENT_SIDES'
      if routing == 'CABIN' and gross_weight_kg > SpeciesProfile.max_cabin_weight_kg:
                                                                        append 'GROSS_WEIGHT'
      if routing == 'CABIN' and ContainerModel.cabin_eligible == false:  append 'CABIN_DIM'
      if routing == 'CARGO' and ContainerModel.wheels_removable == false: append 'WHEELS'

      container_compliance_state = 'COMPLIANT' if deficiency_codes == [] else 'DEFICIENT'
      # gross_weight_kg and chargeable_weight_kg are the animal_travel_fee step-1 values
      # for the variant in force at screen time (declared_weight_kg).
    input_set: "the single AnimalRecord being screened, its ContainerModel, its SpeciesProfile, and the routing_type of its owning Reservation"
    constants:
      HEIGHT_CLEARANCE_CM: 8
      LENGTH_FACTOR: 1.15
      VENT_BASE_PCT: 8
      VENT_WEIGHT_DIVISOR_KG: 5
    precision: "required_height_cm, required_length_cm and required_ventilation_pct are ceiled to whole units; comparisons are strict less-than so a container exactly meeting a requirement is COMPLIANT"

  - name: reservation_charge_assembly
    trigger: "every write that changes a SegmentAssignment.segment_fee_amount, releases or offloads a segment, appends an irregular-operations care fee, or refunds a reservation: POST /animal-records/{id}/screen, POST /segment-assignments, POST /segment-assignments/{id}/accept, POST /segment-assignments/{id}/release, POST /segment-assignments/{id}/offload, POST /irops-care-sweeps, POST /reservations/{id}/confirm, POST /reservations/{id}/cancel, POST /flight-legs/{id}/cancel, POST /flight-legs/{id}/delay, PUT /flight-legs/{id}/forecast"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The dependency looks circular - the discount rate is
      # keyed on the subtotal, and the subtotal includes the irregular-operations fees that
      # can themselves push the subtotal across a tier boundary - so the order below is
      # normative and no step may be re-entered after a later step has run.
      step 1: subtotal_amount = sum(SegmentAssignment.segment_fee_amount
                                    over EVERY segment of the reservation's AnimalRecord
                                    rows, in ANY status - RELEASED and OFFLOADED segments
                                    stay in the gross sum and are offset through
                                    refunded_amount, which is what keeps
                                    net_payable_amount from going negative)
                              + irops_fee_total
      step 2: loyalty_tier_pct = LOYALTY_TIER2_PCT if subtotal_amount >= LOYALTY_TIER2_THRESHOLD
                                 else LOYALTY_TIER1_PCT if subtotal_amount >= LOYALTY_TIER1_THRESHOLD
                                 else 0
              # tier selection reads subtotal_amount ONLY - never the post-refund base
      step 3: loyalty_discount_amount = round_half_up(
                  (subtotal_amount - refunded_amount) * loyalty_tier_pct)
      step 4: net_payable_amount = subtotal_amount - refunded_amount - loyalty_discount_amount
      invariant (must hold after every write):
              subtotal_amount == net_payable_amount + loyalty_discount_amount + refunded_amount
    input_set: "every SegmentAssignment row belonging to an AnimalRecord row of this reservation, in any status; refunded_amount and irops_fee_total are accumulators on the Reservation row and are never recomputed from scratch"
    constants:
      LOYALTY_TIER1_THRESHOLD: 65000
      LOYALTY_TIER1_PCT: 0.05
      LOYALTY_TIER2_THRESHOLD: 100000
      LOYALTY_TIER2_PCT: 0.10
      CANCEL_REFUND_PCT: 0.5
      IROPS_CARE_FEE_PER_ANIMAL: 3500
    precision: "all amounts are integer minor currency units; the single rounding point is step 3, round_half_up"

  - name: incident_severity_score
    trigger: "POST /animal-incidents writes preliminary_severity_score (PRELIMINARY variant); POST /animal-incidents/{id}/close writes adjudicated_severity_score (ADJUDICATED variant)"
    algorithm: weighted_scoring
    formula: |
      base = TYPE_WEIGHT[incident_type]            # INJURY 40, LOSS 70, DEATH 85
      in_transit_adder = IN_TRANSIT_ADDER if AnimalIncident.segment_assignment_id is not null
                         else 0
      welfare_gap = max(SegmentAssignment.required_welfare_check_count
                        - SegmentAssignment.completed_welfare_check_count, 0)
                    if AnimalIncident.segment_assignment_id is not null else 0
      welfare_component = min(welfare_gap * WELFARE_GAP_WEIGHT, WELFARE_GAP_CAP)

      raw = base + in_transit_adder + welfare_component

      PRELIMINARY : score = min(raw, SCORE_CEILING)
      ADJUDICATED : attributed = round_half_up(raw * FINDING_FACTOR[veterinary_finding])
                    penalised  = attributed + (LATE_DISCLOSURE_PENALTY
                                               if disclosure_required == true
                                                  and disclosure_on_time == false else 0)
                    score = min(penalised, SCORE_CEILING)
    input_set: "the single AnimalIncident, its optional SegmentAssignment (for the in-transit and welfare-gap terms), and veterinary_finding supplied at close time"
    constants:
      TYPE_WEIGHT_INJURY: 40
      TYPE_WEIGHT_LOSS: 70
      TYPE_WEIGHT_DEATH: 85
      IN_TRANSIT_ADDER: 10
      WELFARE_GAP_WEIGHT: 6
      WELFARE_GAP_CAP: 12
      FINDING_FACTOR_CARRIER_ATTRIBUTABLE: 1.0
      FINDING_FACTOR_INDETERMINATE: 0.9
      FINDING_FACTOR_PRE_EXISTING_CONDITION: 0.8
      LATE_DISCLOSURE_PENALTY: 20
      SCORE_CEILING: 100
    precision: "scores are whole integers; the FINDING_FACTOR product is round_half_up before the late-disclosure penalty is added and before the ceiling is applied"
    variants:
      - name: PRELIMINARY
        when: "POST /animal-incidents, at report time, before any veterinary attribution exists"
        difference: "no FINDING_FACTOR and no LATE_DISCLOSURE_PENALTY term; the raw score is only ceiling-capped"
      - name: ADJUDICATED
        when: "POST /animal-incidents/{id}/close, after investigation"
        difference: "raw score is scaled by FINDING_FACTOR[veterinary_finding] with round_half_up, then LATE_DISCLOSURE_PENALTY is added when the disclosure was required and filed after disclosure_deadline_utc"

  - name: embargo_determination
    trigger: "POST /flight-legs, PUT /flight-legs/{id}/forecast, POST /flight-legs/{id}/delay, POST /flight-legs/{id}/restore-schedule"
    algorithm: threshold
    formula: |
      md = month-day of FlightLeg.scheduled_departure_utc formatted MM-DD
      candidates = TemperatureEmbargoRule rows where
          status == 'ACTIVE'
          and ( (direction == 'ORIGIN'      and station_id == FlightLeg.origin_station_id)
             or (direction == 'DESTINATION' and station_id == FlightLeg.destination_station_id) )
          and season_contains(md)                     # inclusive on both endpoints;
                                                      # when season_end_month_day <
                                                      # season_start_month_day the window
                                                      # wraps across 12-31
          and ( FlightLeg.forecast_high_c >= forecast_high_limit_c
             or FlightLeg.forecast_low_c  <= forecast_low_limit_c )
      # eligibility filter, ranking, tie-break and empty-set fallback are all pinned:
      if candidates is empty:
          FlightLeg.governing_embargo_rule_id = null
      else:
          governing = candidates ordered by forecast_high_limit_c ASC,
                                 then created_at ASC          # never by id
          FlightLeg.governing_embargo_rule_id = governing[0].id
      then leg_posture_derivation runs.
    input_set: "TemperatureEmbargoRule rows with status ACTIVE attached to the leg's origin station (direction ORIGIN) or destination station (direction DESTINATION); SUPERSEDED rows are excluded"
    constants: {}
    precision: "temperature comparisons use >= for the high limit and <= for the low limit, so a forecast exactly equal to a limit triggers the embargo"

  - name: connection_welfare_window
    trigger: "POST /segment-assignments, POST /flight-legs/{id}/delay, POST /flight-legs/{id}/restore-schedule"
    algorithm: interval_merge
    formula: |
      if SegmentAssignment.sequence_index == 1:
          connection_minutes = null
          required_welfare_check_count = 0
      else:
          prev = the SegmentAssignment of the same animal_record_id with
                 sequence_index == this.sequence_index - 1 and status not in {RELEASED}
          connection_minutes = floor((this.FlightLeg.scheduled_departure_utc
                                      - prev.FlightLeg.scheduled_arrival_utc) / 60 seconds)
          # rejected by validations when below the routing minimum or above the maximum
          minimum = ROUTING_MIN_CONNECTION_MINUTES[this.routing_type]
          required_welfare_check_count = 1 + floor(connection_minutes
                                                   / WELFARE_CHECK_INTERVAL_MINUTES)
    input_set: "the immediately preceding SegmentAssignment of the same AnimalRecord whose status is not RELEASED, and the two FlightLeg rows involved"
    constants:
      ROUTING_MIN_CONNECTION_MINUTES_CABIN: 60
      ROUTING_MIN_CONNECTION_MINUTES_CHECKED: 90
      ROUTING_MIN_CONNECTION_MINUTES_CARGO: 120
      MAX_CONNECTION_MINUTES: 720
      WELFARE_CHECK_INTERVAL_MINUTES: 240
    precision: "connection_minutes is floored to whole minutes; the minimum comparison is connection_minutes >= minimum, so a connection exactly equal to the routing minimum is accepted"

  - name: leg_posture_derivation
    trigger: "every write that changes FlightLeg.status, FlightLeg.governing_embargo_rule_id or any booked_<routing>_count: POST /flight-legs, PUT /flight-legs/{id}/forecast, POST /flight-legs/{id}/delay, POST /flight-legs/{id}/restore-schedule, POST /flight-legs/{id}/cancel, POST /flight-legs/{id}/depart, POST /flight-legs/{id}/arrive, POST /segment-assignments, POST /segment-assignments/{id}/release, POST /segment-assignments/{id}/offload"
    algorithm: threshold
    formula: |
      # first matching branch wins, in this exact order
      if FlightLeg.status == 'CANCELLED':                      posture = 'CLOSED'
      elif FlightLeg.governing_embargo_rule_id is not null:     posture = 'EMBARGOED'
      elif FlightLeg.status in {'DEPARTED', 'ARRIVED'}:         posture = 'CLOSED'
      elif exists routing r in {CABIN, CHECKED, CARGO} with
           limit_r > 0 and booked_r * 10 >= limit_r * 9:        posture = 'RESTRICTED'
      else:                                                     posture = 'OPEN'
      # limit_r / booked_r are (cabin_animal_limit, booked_cabin_count),
      # (checked_animal_limit, booked_checked_count), (cargo_animal_limit,
      # booked_cargo_count). The 90% test is written as an integer cross-multiplication
      # to avoid any floating-point boundary ambiguity.
    input_set: "the single FlightLeg row and its own derived booked counters"
    constants:
      RESTRICTED_LOAD_NUMERATOR: 9
      RESTRICTED_LOAD_DENOMINATOR: 10
    precision: "integer cross-multiplication only; a leg with limit 10 and 9 booked is RESTRICTED, a leg with limit 10 and 8 booked is OPEN"

  - name: kennel_bay_occupancy_projection
    trigger: "POST /kennel-allocations"
    algorithm: aggregation
    formula: |
      candidate_start = occupancy_start_utc                       # inclusive
      candidate_end   = occupancy_end_utc                          # exclusive
      # every allocation reserves the bay for a sanitation window after release
      effective_end(a) = a.occupancy_end_utc + SANITATION_BUFFER_MINUTES minutes
      overlapping = KennelAllocation rows where
            station_id == candidate.station_id
        and status in {'RESERVED', 'OCCUPIED'}
        and occupancy_start_utc < effective_end(candidate)
        and effective_end(row)  > candidate_start
      projected_peak_bays = candidate.bay_count + sum(row.bay_count for row in overlapping)
      accept only when projected_peak_bays <= Station.kennel_bay_count
      Station.reserved_bay_count = sum(bay_count for rows at the station
                                       whose status is in {RESERVED, OCCUPIED})
    input_set: "KennelAllocation rows at the same station with status RESERVED or OCCUPIED; RELEASED rows are excluded and free their bays immediately without a sanitation window"
    constants:
      SANITATION_BUFFER_MINUTES: 45
    precision: "intervals are half-open [start, end): an allocation starting exactly at another allocation's effective_end does NOT overlap; the aggregate comparison is projected_peak_bays <= kennel_bay_count so exact equality is accepted"

  - name: regulator_disclosure_deadline
    trigger: "POST /animal-incidents"
    algorithm: threshold
    formula: |
      disclosure_required = (incident_type in {'LOSS', 'DEATH'})
                            or (preliminary_severity_score >= DISCLOSURE_SCORE_THRESHOLD)
      base_hours = DISCLOSURE_HOURS[incident_type]      # DEATH 24, LOSS 48, INJURY 168
      itinerary_is_international =
          exists a SegmentAssignment of the AnimalRecord with status not in {RELEASED}
          whose FlightLeg origin Station.country_code != destination Station.country_code
      hours = base_hours / 2 if itinerary_is_international else base_hours
      disclosure_deadline_utc = discovered_at_utc + hours     if disclosure_required
                                else null
    input_set: "the AnimalIncident being reported, its AnimalRecord's SegmentAssignment rows whose status is not RELEASED, and the origin/destination Station country codes of those legs"
    constants:
      DISCLOSURE_HOURS_DEATH: 24
      DISCLOSURE_HOURS_LOSS: 48
      DISCLOSURE_HOURS_INJURY: 168
      DISCLOSURE_SCORE_THRESHOLD: 60
    precision: "hour arithmetic on whole hours; the score comparison is >=, so a preliminary score of exactly 60 makes disclosure mandatory"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "request body parses as JSON, every required input field is present, every field has the declared type, every enum field carries a declared member, and no unknown field is supplied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PUT endpoints"
  - priority: 5
    category: existence
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 6
    category: existence
    check: "every path id resolves to an existing row, validated left to right"
    error_id: "ERR_SPECIES_NOT_FOUND | ERR_BREED_RESTRICTION_NOT_FOUND | ERR_CONTAINER_MODEL_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_EMBARGO_RULE_NOT_FOUND | ERR_DESTINATION_REQUIREMENT_NOT_FOUND | ERR_FLIGHT_LEG_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_ANIMAL_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_INCIDENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path parameter"
  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input"
    error_id: "ERR_SPECIES_NOT_FOUND | ERR_CONTAINER_MODEL_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_FLIGHT_LEG_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_ANIMAL_NOT_FOUND | ERR_SEGMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /breed-restrictions, POST /destination-requirements, POST /temperature-embargo-rules, POST /flight-legs, POST /animal-records, POST /segment-assignments, POST /health-documents, POST /kennel-allocations, POST /animal-incidents, POST /irops-care-sweeps"
  - priority: 8
    category: auth
    check: "segregation of duties: the acting X-User-ID differs from Reservation.booked_by_agent_id on segment acceptance, from AnimalIncident.reported_by_user_id on investigation, and from AnimalIncident.investigated_by_user_id on close"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /segment-assignments/{id}/accept, POST /animal-incidents/{id}/investigate, POST /animal-incidents/{id}/close"
  - priority: 9
    category: state
    check: "expected_flight_leg_version equals the current FlightLeg.version"
    error_id: ERR_STALE_FLIGHT_LEG_VERSION
    http_status: 412
    applies_to: "POST /segment-assignments"
  - priority: 10
    category: state
    check: "expected_station_version equals the current Station.version"
    error_id: ERR_STALE_STATION_VERSION
    http_status: 412
    applies_to: "POST /kennel-allocations"
  - priority: 11
    category: state
    check: "FlightLeg.status is in the set the requested transition allows"
    error_id: ERR_FLIGHT_LEG_INVALID_STATE
    http_status: 409
    applies_to: "POST /flight-legs/{id}/delay, POST /flight-legs/{id}/restore-schedule, POST /flight-legs/{id}/cancel, POST /flight-legs/{id}/depart, POST /flight-legs/{id}/arrive, PUT /flight-legs/{id}/forecast, POST /segment-assignments"
  - priority: 12
    category: state
    check: "Reservation.booking_status is in the set the requested operation allows: {PENDING, HOLD_PARTIAL, REBOOK_REQUIRED} for confirm, {PENDING, CONFIRMED, HOLD_PARTIAL, REBOOK_REQUIRED} for cancel, {CONFIRMED, HOLD_PARTIAL} for segment acceptance, {PENDING, CONFIRMED, HOLD_PARTIAL, IN_TRANSIT} for an irregular-operations care sweep"
    error_id: ERR_RESERVATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm, POST /reservations/{id}/cancel, POST /segment-assignments/{id}/accept, POST /irops-care-sweeps"
  - priority: 13
    category: state
    check: "AnimalRecord.status is in the set the requested operation allows: {DRAFT, TRAVEL_READY} for screen, {SCREENED} for mark-travel-ready, {DRAFT, SCREENED} for deny, {DRAFT, SCREENED, TRAVEL_READY} for POST /segment-assignments, {TRAVEL_READY} for segment acceptance, {DRAFT, SCREENED, TRAVEL_READY} for POST /health-documents, {SCREENED, TRAVEL_READY, IN_TRANSIT} for POST /kennel-allocations, {TRAVEL_READY} for every non-DENIED AnimalRecord of the reservation on POST /reservations/{id}/confirm"
    error_id: ERR_ANIMAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /animal-records/{id}/screen, POST /animal-records/{id}/mark-travel-ready, POST /animal-records/{id}/deny, POST /segment-assignments, POST /segment-assignments/{id}/accept, POST /health-documents, POST /kennel-allocations, POST /reservations/{id}/confirm"
  - priority: 14
    category: state
    check: "SegmentAssignment.status is in the set the requested transition allows"
    error_id: ERR_SEGMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /segment-assignments/{id}/accept, POST /segment-assignments/{id}/release, POST /segment-assignments/{id}/offload, POST /welfare-checks"
  - priority: 15
    category: state
    check: "HealthDocument.status is in the set the requested transition allows"
    error_id: ERR_DOCUMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /health-documents/{id}/start-review, POST /health-documents/{id}/verify, POST /health-documents/{id}/reject, POST /health-documents/{id}/resubmit"
  - priority: 16
    category: state
    check: "KennelAllocation.status is in the set the requested transition allows"
    error_id: ERR_ALLOCATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /kennel-allocations/{id}/occupy, POST /kennel-allocations/{id}/release"
  - priority: 17
    category: state
    check: "AnimalIncident.status is in the set the requested transition allows"
    error_id: ERR_INCIDENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /animal-incidents/{id}/investigate, POST /animal-incidents/{id}/disclose, POST /animal-incidents/{id}/close"
  - priority: 18
    category: state
    check: "HealthDocument.revision_count is strictly less than MAX_DOCUMENT_REVISIONS (3) before a resubmission is accepted"
    error_id: ERR_DOC_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /health-documents/{id}/resubmit"
  - priority: 19
    category: business_safety
    check: "the AnimalRecord's SpeciesProfile.status is ACTIVE"
    error_id: ERR_SPECIES_RETIRED
    http_status: 422
    applies_to: "POST /animal-records, POST /animal-records/{id}/screen"
  - priority: 20
    category: business_safety
    check: "the SpeciesProfile.acceptance_class is not EMBARGOED_SPECIES"
    error_id: ERR_SPECIES_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /animal-records/{id}/screen"
  - priority: 21
    category: business_safety
    check: "no ACTIVE BreedRestriction with restriction_type BANNED matches the animal's breed_name case-insensitively"
    error_id: ERR_BREED_BANNED
    http_status: 422
    applies_to: "POST /animal-records/{id}/screen"
  - priority: 22
    category: business_safety
    check: "the animal's age_weeks is >= SpeciesProfile.min_age_weeks"
    error_id: ERR_ANIMAL_UNDERAGE
    http_status: 422
    applies_to: "POST /animal-records/{id}/screen"
  - priority: 23
    category: business_safety
    check: "when the SpeciesProfile.acceptance_class is CARGO_ONLY, or an ACTIVE BreedRestriction with restriction_type CARGO_ONLY matches the breed, the owning Reservation.routing_type is CARGO"
    error_id: ERR_ROUTING_NOT_PERMITTED_FOR_BREED
    http_status: 422
    applies_to: "POST /animal-records/{id}/screen"
  - priority: 24
    category: business_safety
    check: "when an ACTIVE BreedRestriction with restriction_type WEIGHT_CAPPED matches the breed, the animal's gross weight (weight basis + ContainerModel.tare_weight_kg) is <= that restriction's max_weight_kg"
    error_id: ERR_BREED_WEIGHT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /animal-records/{id}/screen, POST /segment-assignments/{id}/accept"
  - priority: 25
    category: business_safety
    check: "when the Reservation.routing_type is CABIN, the animal's gross weight is <= SpeciesProfile.max_cabin_weight_kg"
    error_id: ERR_CABIN_WEIGHT_EXCEEDED
    http_status: 422
    applies_to: "POST /segment-assignments/{id}/accept"
  - priority: 26
    category: business_safety
    check: "AnimalRecord.container_compliance_state is COMPLIANT"
    error_id: ERR_CONTAINER_NON_COMPLIANT
    http_status: 422
    applies_to: "POST /animal-records/{id}/mark-travel-ready, POST /segment-assignments/{id}/accept"
  - priority: 27
    category: business_safety
    check: "when the AnimalRecord.animal_kind is SERVICE_ANIMAL, behavior_attestation_on_file is true"
    error_id: ERR_BEHAVIOR_ATTESTATION_MISSING
    http_status: 422
    applies_to: "POST /animal-records/{id}/mark-travel-ready"
  - priority: 28
    category: business_safety
    check: "the target FlightLeg.posture is not EMBARGOED, or the governing embargo rule's applies_to_routings does not contain the routing_type of the segment being created, accepted or departed"
    error_id: ERR_LEG_EMBARGOED
    http_status: 422
    applies_to: "POST /segment-assignments, POST /segment-assignments/{id}/accept, POST /flight-legs/{id}/depart"
  - priority: 29
    category: business_safety
    check: "both the origin Station.status and the destination Station.status of the leg are ACCEPTING"
    error_id: ERR_STATION_SUSPENDED
    http_status: 422
    applies_to: "POST /segment-assignments, POST /kennel-allocations"
  - priority: 30
    category: business_safety
    check: "every ACCEPTED SegmentAssignment on the departing leg has completed_welfare_check_count >= required_welfare_check_count"
    error_id: ERR_WELFARE_CHECKS_INCOMPLETE
    http_status: 422
    applies_to: "POST /flight-legs/{id}/depart"
  - priority: 31
    category: business_safety
    check: "no SegmentAssignment on the departing leg remains in status RESERVED"
    error_id: ERR_LEG_HAS_UNACCEPTED_SEGMENTS
    http_status: 422
    applies_to: "POST /flight-legs/{id}/depart"
  - priority: 32
    category: business_safety
    check: "AnimalRecord.measured_weight_kg is present"
    error_id: ERR_MEASURED_WEIGHT_REQUIRED
    http_status: 422
    applies_to: "POST /segment-assignments/{id}/accept"
  - priority: 33
    category: business_referential
    check: "for every ACTIVE DestinationRequirement with mandatory true matching the animal's species and the destination country of its highest-sequence_index segment, a HealthDocument of that document_type exists in status VERIFIED"
    error_id: ERR_REQUIRED_DOCUMENT_MISSING
    http_status: 422
    applies_to: "POST /animal-records/{id}/mark-travel-ready, POST /reservations/{id}/verify-compliance"
  - priority: 34
    category: business_referential
    check: "each VERIFIED HealthDocument backing a mandatory requirement was issued at most max_age_days_at_arrival whole days before the final segment's FlightLeg.scheduled_arrival_utc"
    error_id: ERR_DOCUMENT_STALE_FOR_DESTINATION
    http_status: 422
    applies_to: "POST /animal-records/{id}/mark-travel-ready, POST /reservations/{id}/verify-compliance"
  - priority: 35
    category: business_referential
    check: "the HealthDocument.issuing_country_code equals the origin Station.country_code of the animal's sequence_index 1 segment"
    error_id: ERR_DOCUMENT_ISSUER_MISMATCH
    http_status: 422
    applies_to: "POST /health-documents/{id}/verify"
  - priority: 36
    category: business_referential
    check: "Reservation.compliance_status is VERIFIED"
    error_id: ERR_COMPLIANCE_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /reservations/{id}/confirm, POST /segment-assignments/{id}/accept"
  - priority: 37
    category: business_constraint
    check: "the requested routing_type equals the owning Reservation.routing_type"
    error_id: ERR_ROUTING_MISMATCH
    http_status: 422
    applies_to: "POST /segment-assignments"
  - priority: 38
    category: business_constraint
    check: "sequence_index is 1 for the animal's first segment and otherwise exactly one greater than the animal's current maximum non-RELEASED sequence_index, and is not already taken by a non-RELEASED segment"
    error_id: ERR_SEGMENT_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /segment-assignments"
  - priority: 39
    category: business_constraint
    check: "the supplied segment_assignment_id belongs to the supplied animal_record_id"
    error_id: ERR_SEGMENT_ANIMAL_MISMATCH
    http_status: 422
    applies_to: "POST /animal-incidents"
  - priority: 40
    category: business_constraint
    check: "species_code is unique across SpeciesProfile"
    error_id: ERR_DUPLICATE_SPECIES_CODE
    http_status: 409
    applies_to: "POST /species-profiles"
  - priority: 41
    category: business_constraint
    check: "model_code is unique across ContainerModel"
    error_id: ERR_DUPLICATE_CONTAINER_MODEL
    http_status: 409
    applies_to: "POST /container-models"
  - priority: 42
    category: business_constraint
    check: "iata_code is unique across Station"
    error_id: ERR_DUPLICATE_STATION_CODE
    http_status: 409
    applies_to: "POST /stations"
  - priority: 43
    category: business_constraint
    check: "the lowercased breed_name is unique among ACTIVE BreedRestriction rows of the same species_profile_id, and max_weight_kg is supplied exactly when restriction_type is WEIGHT_CAPPED"
    error_id: ERR_DUPLICATE_BREED_RESTRICTION
    http_status: 409
    applies_to: "POST /breed-restrictions"
  - priority: 44
    category: business_temporal
    check: "the later instant of every supplied pair is strictly after the earlier one: scheduled_arrival_utc after scheduled_departure_utc, expires_at after issued_at, occupancy_end_utc after occupancy_start_utc"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /flight-legs, POST /health-documents, POST /health-documents/{id}/resubmit, POST /kennel-allocations, POST /flight-legs/{id}/delay, POST /flight-legs/{id}/restore-schedule"
  - priority: 45
    category: business_temporal
    check: "new_departure_utc is strictly after the current FlightLeg.scheduled_departure_utc on a delay, and restored_departure_utc is strictly before it on a restore"
    error_id: ERR_SCHEDULE_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /flight-legs/{id}/delay, POST /flight-legs/{id}/restore-schedule"
  - priority: 46
    category: business_temporal
    check: "the animal has no other non-RELEASED SegmentAssignment whose leg interval [scheduled_departure_utc, scheduled_arrival_utc] intersects the requested leg's interval, where touching endpoints count as an intersection (CLOSED intervals on both ends)"
    error_id: ERR_ANIMAL_ITINERARY_OVERLAP
    http_status: 409
    applies_to: "POST /segment-assignments"
  - priority: 47
    category: business_temporal
    check: "for a segment with sequence_index > 1, connection_minutes >= ROUTING_MIN_CONNECTION_MINUTES for the routing_type"
    error_id: ERR_CONNECTION_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /segment-assignments"
  - priority: 48
    category: business_temporal
    check: "for a segment with sequence_index > 1, connection_minutes <= MAX_CONNECTION_MINUTES (720)"
    error_id: ERR_CONNECTION_EXCEEDS_MAXIMUM
    http_status: 422
    applies_to: "POST /segment-assignments"
  - priority: 49
    category: business_temporal
    check: "the logical clock never moves backwards: to_iso8601 is >= the current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 50
    category: business_fiscal
    check: "booked_<routing_type>_count + 1 <= the leg's corresponding routing limit"
    error_id: ERR_ROUTING_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /segment-assignments"
  - priority: 51
    category: business_fiscal
    check: "projected_peak_bays from kennel_bay_occupancy_projection is <= Station.kennel_bay_count"
    error_id: ERR_KENNEL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /kennel-allocations"
  - priority: 52
    category: business_referential
    check: "disclosure is only filed when AnimalIncident.disclosure_required is true"
    error_id: ERR_DISCLOSURE_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /animal-incidents/{id}/disclose"
  - priority: 53
    category: business_referential
    check: "an incident whose disclosure_required is true cannot be closed from INVESTIGATING before the disclosure is filed"
    error_id: ERR_DISCLOSURE_PENDING
    http_status: 422
    applies_to: "POST /animal-incidents/{id}/close"

endpoints:
  - method: POST
    path: "/species-profiles"
    description: "Register a species acceptance profile"
    roles: [ProgramAdmin]
    code: 201
    input: ["species_code", "common_name", "acceptance_class", "max_cabin_weight_kg", "min_age_weeks", "requires_veterinary_review?", "status?"]
    output: SpeciesProfile
    side_effects: ["breed_restriction_count initialised to 0"]
  - method: GET
    path: "/species-profiles/{id}"
    description: "Read one species profile"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: SpeciesProfile
    side_effects: []
  - method: GET
    path: "/species-profiles"
    description: "List species profiles"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SpeciesProfile[]
    side_effects: []
  - method: PUT
    path: "/species-profiles/{id}/status"
    description: "Activate or retire a species profile"
    roles: [ProgramAdmin]
    code: 200
    input: ["status"]
    output: SpeciesProfile
    side_effects: ["retiring a species blocks further AnimalRecord creation and screening for it"]
  - method: POST
    path: "/breed-restrictions"
    description: "Attach a breed restriction to a species profile"
    roles: [ProgramAdmin]
    code: 201
    input: ["species_profile_id", "breed_name", "restriction_type", "max_weight_kg?"]
    output: BreedRestriction
    side_effects: ["increments SpeciesProfile.breed_restriction_count", "increments SpeciesProfile.version by 1"]
  - method: GET
    path: "/species-profiles/{id}/breed-restrictions"
    description: "List the breed restrictions of one species profile"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BreedRestriction[]
    side_effects: []
  - method: GET
    path: "/breed-restrictions/{id}"
    description: "Read one breed restriction"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: BreedRestriction
    side_effects: []
  - method: PUT
    path: "/breed-restrictions/{id}/status"
    description: "Withdraw or reinstate a breed restriction"
    roles: [ProgramAdmin]
    code: 200
    input: ["status"]
    output: BreedRestriction
    side_effects: ["recomputes SpeciesProfile.breed_restriction_count", "increments SpeciesProfile.version by 1"]
  - method: POST
    path: "/destination-requirements"
    description: "Declare an import document requirement for a species and destination country"
    roles: [ProgramAdmin]
    code: 201
    input: ["species_profile_id", "destination_country_code", "document_type", "max_age_days_at_arrival", "mandatory?"]
    output: DestinationRequirement
    side_effects: []
  - method: GET
    path: "/species-profiles/{id}/destination-requirements"
    description: "List the destination requirements of one species profile"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["destination_country_code?", "status?", "limit?", "offset?"]
    output: DestinationRequirement[]
    side_effects: []
  - method: GET
    path: "/destination-requirements/{id}"
    description: "Read one destination requirement"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: DestinationRequirement
    side_effects: []
  - method: POST
    path: "/container-models"
    description: "Register an approved container model"
    roles: [ProgramAdmin]
    code: 201
    input: ["model_code", "interior_length_cm", "interior_width_cm", "interior_height_cm", "tare_weight_kg", "ventilation_area_pct", "ventilated_side_count", "wheels_removable", "cabin_eligible"]
    output: ContainerModel
    side_effects: []
  - method: GET
    path: "/container-models/{id}"
    description: "Read one container model"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: ContainerModel
    side_effects: []
  - method: GET
    path: "/container-models"
    description: "List container models"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["cabin_eligible?", "limit?", "offset?"]
    output: ContainerModel[]
    side_effects: []
  - method: POST
    path: "/stations"
    description: "Register a station with its kennel bay pool"
    roles: [ProgramAdmin]
    code: 201
    input: ["iata_code", "country_code", "kennel_bay_count", "status?"]
    output: Station
    side_effects: ["reserved_bay_count initialised to 0"]
  - method: GET
    path: "/stations/{id}"
    description: "Read one station including its current reserved_bay_count and version"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Station
    side_effects: []
  - method: GET
    path: "/stations"
    description: "List stations"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Station[]
    side_effects: []
  - method: PUT
    path: "/stations/{id}/status"
    description: "Suspend or resume live animal acceptance at a station"
    roles: [ProgramAdmin]
    code: 200
    input: ["status"]
    output: Station
    side_effects: ["increments Station.version by 1"]
  - method: POST
    path: "/temperature-embargo-rules"
    description: "Attach a seasonal temperature embargo rule to a station"
    roles: [ProgramAdmin]
    code: 201
    input: ["station_id", "direction", "season_start_month_day", "season_end_month_day", "forecast_high_limit_c", "forecast_low_limit_c", "applies_to_routings"]
    output: TemperatureEmbargoRule
    side_effects: ["increments Station.version by 1"]
  - method: GET
    path: "/stations/{id}/temperature-embargo-rules"
    description: "List the embargo rules attached to one station"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["direction?", "status?", "limit?", "offset?"]
    output: TemperatureEmbargoRule[]
    side_effects: []
  - method: GET
    path: "/temperature-embargo-rules/{id}"
    description: "Read one embargo rule"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: TemperatureEmbargoRule
    side_effects: []
  - method: PUT
    path: "/temperature-embargo-rules/{id}/status"
    description: "Supersede or reactivate an embargo rule"
    roles: [ProgramAdmin]
    code: 200
    input: ["status"]
    output: TemperatureEmbargoRule
    side_effects: ["increments Station.version by 1"]
  - method: POST
    path: "/flight-legs"
    description: "Create a flight leg with its per-routing animal limits and forecast"
    roles: [ProgramAdmin]
    code: 201
    input: ["flight_number", "origin_station_id", "destination_station_id", "scheduled_departure_utc", "scheduled_arrival_utc", "forecast_high_c", "forecast_low_c", "cabin_animal_limit", "checked_animal_limit", "cargo_animal_limit"]
    output: FlightLeg
    side_effects: ["computes block_minutes", "runs embargo_determination writing governing_embargo_rule_id", "runs leg_posture_derivation writing posture"]
  - method: GET
    path: "/flight-legs/{id}"
    description: "Read one flight leg including booked counters, posture and version"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: FlightLeg
    side_effects: []
  - method: GET
    path: "/flight-legs"
    description: "List flight legs, filterable by origin station, destination station, governing embargo rule and status"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["origin_station_id?", "destination_station_id?", "governing_embargo_rule_id?", "status?", "limit?", "offset?"]
    output: FlightLeg[]
    side_effects: []
  - method: PUT
    path: "/flight-legs/{id}/forecast"
    description: "Update the leg temperature forecast, re-running embargo determination"
    roles: [ProgramAdmin]
    code: 200
    input: ["forecast_high_c", "forecast_low_c"]
    output: FlightLeg
    side_effects: ["runs embargo_determination and leg_posture_derivation", "when posture becomes EMBARGOED, releases every SegmentAssignment on the leg in status RESERVED whose routing_type is contained in the governing rule's applies_to_routings, which decrements the leg booked counters, which drives each owning Reservation to HOLD_PARTIAL or REBOOK_REQUIRED with refunded_amount incremented and reservation_charge_assembly re-run", "increments FlightLeg.version by 1"]
  - method: POST
    path: "/flight-legs/{id}/delay"
    description: "Move a leg to DELAYED with a later schedule"
    roles: [ProgramAdmin]
    code: 200
    input: ["new_departure_utc", "new_arrival_utc"]
    output: FlightLeg
    side_effects: ["recomputes block_minutes", "recomputes connection_minutes and required_welfare_check_count on downstream segments", "releases downstream segments whose connection window is no longer legal and cascades to their reservations", "increments FlightLeg.version by 1"]
  - method: POST
    path: "/flight-legs/{id}/restore-schedule"
    description: "Return a DELAYED leg to SCHEDULED with an earlier schedule"
    roles: [ProgramAdmin]
    code: 200
    input: ["restored_departure_utc", "restored_arrival_utc"]
    output: FlightLeg
    side_effects: ["recomputes block_minutes, downstream connection_minutes and required_welfare_check_count", "runs leg_posture_derivation", "increments FlightLeg.version by 1"]
  - method: POST
    path: "/flight-legs/{id}/cancel"
    description: "Cancel a flight leg and cascade to its segments and reservations"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: FlightLeg
    side_effects: ["posture set to CLOSED", "releases RESERVED segments and offloads ACCEPTED segments, decrementing booked counters", "drives owning reservations to HOLD_PARTIAL or REBOOK_REQUIRED with refunds and reservation_charge_assembly re-run", "increments FlightLeg.version by 1"]
  - method: POST
    path: "/flight-legs/{id}/depart"
    description: "Depart a leg once every segment is accepted or released and welfare checks are complete"
    roles: [AcceptanceAgent]
    code: 200
    input: []
    output: FlightLeg
    side_effects: ["ACCEPTED segments' animals move TRAVEL_READY -> IN_TRANSIT and their reservations move to IN_TRANSIT", "runs leg_posture_derivation writing CLOSED", "increments FlightLeg.version by 1"]
  - method: POST
    path: "/flight-legs/{id}/arrive"
    description: "Arrive a departed leg, completing its segments"
    roles: [AcceptanceAgent]
    code: 200
    input: []
    output: FlightLeg
    side_effects: ["ACCEPTED segments become COMPLETED", "animals on their final segment become DELIVERED and fully delivered reservations become COMPLETED", "increments FlightLeg.version by 1"]
  - method: POST
    path: "/reservations"
    description: "Open a live animal reservation"
    roles: [ReservationsAgent]
    code: 201
    input: ["passenger_name", "contact_email", "routing_type", "is_service_animal_booking?"]
    output: Reservation
    side_effects: ["booked_by_agent_id stamped from X-User-ID", "booking_status PENDING and compliance_status UNVERIFIED", "all money fields initialised to 0"]
  - method: GET
    path: "/reservations/{id}"
    description: "Read one reservation including both state dimensions and all money fields"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/reservations"
    description: "List reservations, filterable by either state dimension"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["booking_status?", "compliance_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: GET
    path: "/reservations/{id}/charge-summary"
    description: "Computed read of the reservation money identity"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, ComplianceOfficer]
    code: 200
    input: []
    output: "{ reservation_id: string, subtotal_amount: integer, irops_fee_total: integer, loyalty_tier_pct: number, loyalty_discount_amount: integer, refunded_amount: integer, net_payable_amount: integer, invariant_holds: boolean }"
    side_effects: []
  - method: POST
    path: "/reservations/{id}/confirm"
    description: "Confirm a reservation whose animals are all travel-ready and whose compliance is verified"
    roles: [ReservationsAgent]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status set to CONFIRMED", "runs reservation_charge_assembly", "increments Reservation.version by 1"]
  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a reservation, releasing segments and kennel bays and refunding half the subtotal"
    roles: [ReservationsAgent]
    code: 200
    input: ["reason?"]
    output: Reservation
    side_effects: ["RESERVED segments released with leg counters decremented", "RESERVED and OCCUPIED kennel allocations released with Station.reserved_bay_count decremented", "refunded_amount incremented by round_half_up(subtotal_amount * CANCEL_REFUND_PCT)", "runs reservation_charge_assembly", "increments Reservation.version by 1"]
  - method: POST
    path: "/reservations/{id}/verify-compliance"
    description: "Run the destination document verification sweep for a reservation; returns compliance_status VERIFIED or EXPIRED"
    roles: [VeterinaryReviewer]
    code: 200
    input: []
    output: Reservation
    side_effects: ["compliance_status set to VERIFIED, or set to EXPIRED with each stale HealthDocument moved VERIFIED -> EXPIRED", "atomic: when a mandatory document is missing nothing is written and ERR_REQUIRED_DOCUMENT_MISSING is returned", "increments Reservation.version by 1"]
  - method: POST
    path: "/animal-records"
    description: "Add an animal to a reservation"
    roles: [ReservationsAgent]
    code: 201
    input: ["reservation_id", "species_profile_id", "container_model_id", "animal_name", "breed_name", "animal_kind?", "declared_weight_kg", "height_at_shoulder_cm", "length_nose_to_tail_cm", "age_weeks", "behavior_attestation_on_file?"]
    output: AnimalRecord
    side_effects: ["status DRAFT and container_compliance_state UNEVALUATED", "recomputes Reservation.animal_count", "increments Reservation.version by 1"]
  - method: GET
    path: "/animal-records/{id}"
    description: "Read one animal record including chargeable weight, compliance state and deficiency codes"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: AnimalRecord
    side_effects: []
  - method: GET
    path: "/animal-records"
    description: "List animal records, filterable by reservation, species, container model and status"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["reservation_id?", "species_profile_id?", "container_model_id?", "status?", "limit?", "offset?"]
    output: AnimalRecord[]
    side_effects: []
  - method: PUT
    path: "/animal-records/{id}"
    description: "Amend an animal record's container, declared weight, measured weight or behavior attestation"
    roles: [ReservationsAgent, AcceptanceAgent]
    code: 200
    input: ["container_model_id?", "declared_weight_kg?", "measured_weight_kg?", "behavior_attestation_on_file?"]
    output: AnimalRecord
    side_effects: ["container_compliance_state reset to UNEVALUATED and deficiency_codes cleared when container_model_id or declared_weight_kg changes", "increments AnimalRecord.version by 1"]
  - method: POST
    path: "/animal-records/{id}/screen"
    description: "Screen an animal against species, breed and container standards and price its reserved segments provisionally"
    roles: [AcceptanceAgent]
    code: 200
    input: []
    output: AnimalRecord
    side_effects: ["runs container_compliance_evaluation writing container_compliance_state and deficiency_codes", "runs animal_travel_fee PROVISIONAL_AT_RESERVATION over every RESERVED segment", "runs reservation_charge_assembly", "increments AnimalRecord.version by 1"]
  - method: POST
    path: "/animal-records/{id}/mark-travel-ready"
    description: "Mark a screened animal travel-ready after container, document and behavior gates pass"
    roles: [AcceptanceAgent]
    code: 200
    input: []
    output: AnimalRecord
    side_effects: ["status set to TRAVEL_READY", "recomputes Reservation.animal_count", "increments AnimalRecord.version by 1"]
  - method: POST
    path: "/animal-records/{id}/deny"
    description: "Deny carriage for an animal and release its segments"
    roles: [AcceptanceAgent]
    code: 200
    input: ["reason?"]
    output: AnimalRecord
    side_effects: ["status set to DENIED", "RESERVED segments released with leg counters decremented and posture re-derived", "runs reservation_charge_assembly", "increments AnimalRecord.version by 1"]
  - method: POST
    path: "/segment-assignments"
    description: "Reserve a routing slot for an animal on a flight leg under optimistic concurrency on the leg version"
    roles: [ReservationsAgent]
    code: 201
    input: ["animal_record_id", "flight_leg_id", "routing_type", "sequence_index", "expected_flight_leg_version"]
    output: SegmentAssignment
    side_effects: ["increments the leg's booked_<routing_type>_count by 1 and re-derives posture", "runs connection_welfare_window writing connection_minutes and required_welfare_check_count", "runs animal_travel_fee writing segment_fee_amount and fee_variant", "runs reservation_charge_assembly", "increments FlightLeg.version by 1"]
  - method: GET
    path: "/segment-assignments/{id}"
    description: "Read one segment assignment including fee, variant and welfare counters"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: SegmentAssignment
    side_effects: []
  - method: GET
    path: "/segment-assignments"
    description: "List segment assignments, filterable by animal record, flight leg and status"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["animal_record_id?", "flight_leg_id?", "status?", "limit?", "offset?"]
    output: SegmentAssignment[]
    side_effects: []
  - method: POST
    path: "/segment-assignments/{id}/accept"
    description: "Accept an animal at the counter for one segment, repricing it with the final measured weight"
    roles: [AcceptanceAgent]
    code: 200
    input: []
    output: SegmentAssignment
    side_effects: ["status set to ACCEPTED", "runs animal_travel_fee FINAL_AT_ACCEPTANCE on this segment and rewrites AnimalRecord.chargeable_weight_kg", "runs reservation_charge_assembly", "increments SegmentAssignment.version by 1"]
  - method: POST
    path: "/segment-assignments/{id}/release"
    description: "Release a reserved routing slot"
    roles: [ReservationsAgent]
    code: 200
    input: ["reason?"]
    output: SegmentAssignment
    side_effects: ["status set to RELEASED", "decrements the leg booked counter and re-derives posture", "increments Reservation.refunded_amount by segment_fee_amount and recomputes booking_status", "runs reservation_charge_assembly", "increments FlightLeg.version by 1"]
  - method: POST
    path: "/segment-assignments/{id}/offload"
    description: "Offload an accepted animal from a segment"
    roles: [AcceptanceAgent]
    code: 200
    input: ["reason?"]
    output: SegmentAssignment
    side_effects: ["status set to OFFLOADED", "decrements the leg booked counter and re-derives posture", "increments Reservation.refunded_amount by segment_fee_amount and sets booking_status INTERRUPTED when it was IN_TRANSIT", "runs reservation_charge_assembly", "increments FlightLeg.version by 1"]
  - method: POST
    path: "/welfare-checks"
    description: "Append a welfare handling event to a segment during a transfer"
    roles: [AcceptanceAgent]
    code: 201
    input: ["segment_assignment_id", "check_type", "outcome?", "notes?"]
    output: WelfareCheck
    side_effects: ["recorded_at_utc stamped from the logical clock and performed_by_user_id from X-User-ID", "increments SegmentAssignment.completed_welfare_check_count", "increments SegmentAssignment.version by 1"]
  - method: GET
    path: "/segment-assignments/{id}/welfare-checks"
    description: "List the welfare checks appended to one segment"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["check_type?", "limit?", "offset?"]
    output: WelfareCheck[]
    side_effects: []
  - method: POST
    path: "/health-documents"
    description: "Submit a health certificate, vaccination record or import permit for an animal"
    roles: [ReservationsAgent]
    code: 201
    input: ["animal_record_id", "document_type", "issuing_country_code", "issued_at", "expires_at"]
    output: HealthDocument
    side_effects: ["status SUBMITTED with revision_count 0"]
  - method: GET
    path: "/animal-records/{id}/health-documents"
    description: "List the health documents of one animal"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["document_type?", "status?", "limit?", "offset?"]
    output: HealthDocument[]
    side_effects: []
  - method: GET
    path: "/health-documents/{id}"
    description: "Read one health document"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: HealthDocument
    side_effects: []
  - method: POST
    path: "/health-documents/{id}/start-review"
    description: "Take a submitted document under review"
    roles: [VeterinaryReviewer]
    code: 200
    input: []
    output: HealthDocument
    side_effects: ["status set to UNDER_REVIEW", "owning Reservation.compliance_status set to IN_REVIEW", "increments HealthDocument.version by 1"]
  - method: POST
    path: "/health-documents/{id}/verify"
    description: "Verify a document under review; returns status VERIFIED, or EXPIRED when the logical clock has passed expires_at"
    roles: [VeterinaryReviewer]
    code: 200
    input: []
    output: HealthDocument
    side_effects: ["status set to VERIFIED or EXPIRED depending on the logical clock", "reviewed_by_user_id stamped from X-User-ID", "increments HealthDocument.version by 1"]
  - method: POST
    path: "/health-documents/{id}/reject"
    description: "Reject a document under review, driving the reservation compliance dimension to DEFICIENT"
    roles: [VeterinaryReviewer]
    code: 200
    input: ["rejection_reason?"]
    output: HealthDocument
    side_effects: ["status set to REJECTED", "owning Reservation.compliance_status set to DEFICIENT", "owning AnimalRecord returns TRAVEL_READY -> SCREENED when it was TRAVEL_READY", "increments HealthDocument.version by 1"]
  - method: POST
    path: "/health-documents/{id}/resubmit"
    description: "Resubmit a rejected document with new issue and expiry instants, capped at three revisions"
    roles: [ReservationsAgent]
    code: 200
    input: ["issued_at", "expires_at"]
    output: HealthDocument
    side_effects: ["status set to SUBMITTED", "increments revision_count by 1 and clears reviewed_by_user_id", "increments HealthDocument.version by 1"]
  - method: POST
    path: "/kennel-allocations"
    description: "Reserve holding bays for an animal at a station under optimistic concurrency on the station version"
    roles: [AcceptanceAgent]
    code: 201
    input: ["station_id", "animal_record_id", "bay_count", "occupancy_start_utc", "occupancy_end_utc", "feeding_interval_minutes", "expected_station_version"]
    output: KennelAllocation
    side_effects: ["runs kennel_bay_occupancy_projection", "increments Station.reserved_bay_count by bay_count", "increments Station.version by 1"]
  - method: GET
    path: "/kennel-allocations/{id}"
    description: "Read one kennel allocation"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: KennelAllocation
    side_effects: []
  - method: GET
    path: "/kennel-allocations"
    description: "List kennel allocations, filterable by station, animal record and status"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["station_id?", "animal_record_id?", "status?", "limit?", "offset?"]
    output: KennelAllocation[]
    side_effects: []
  - method: POST
    path: "/kennel-allocations/{id}/occupy"
    description: "Move a reserved allocation to OCCUPIED once the occupancy window has opened"
    roles: [AcceptanceAgent]
    code: 200
    input: []
    output: KennelAllocation
    side_effects: ["status set to OCCUPIED", "increments KennelAllocation.version by 1"]
  - method: POST
    path: "/kennel-allocations/{id}/release"
    description: "Release holding bays back to the station pool"
    roles: [AcceptanceAgent]
    code: 200
    input: ["reason?"]
    output: KennelAllocation
    side_effects: ["status set to RELEASED", "decrements Station.reserved_bay_count by bay_count", "increments Station.version by 1"]
  - method: POST
    path: "/irops-care-sweeps"
    description: "Charge irregular-operations care for every non-terminal animal on a leg disrupted by irregular operations; permitted while the leg status is SCHEDULED, DELAYED or DEPARTED, and repeat calls charge again"
    roles: [AcceptanceAgent]
    code: 200
    input: ["flight_leg_id"]
    output: "{ flight_leg_id: string, affected_animal_count: integer, irops_fee_per_animal: integer, total_fee_charged: integer }"
    side_effects: ["for each Reservation owning a RESERVED or ACCEPTED segment on the leg, increments irops_fee_total by IROPS_CARE_FEE_PER_ANIMAL per such animal", "runs reservation_charge_assembly, which may cross a loyalty tier threshold", "increments Reservation.version by 1"]
  - method: POST
    path: "/animal-incidents"
    description: "Report an injury, loss or death incident and open the regulatory disclosure clock"
    roles: [AcceptanceAgent, ComplianceOfficer]
    code: 201
    input: ["animal_record_id", "segment_assignment_id?", "incident_type", "discovered_at_utc"]
    output: AnimalIncident
    side_effects: ["reported_by_user_id stamped from X-User-ID", "runs incident_severity_score PRELIMINARY writing preliminary_severity_score", "runs regulator_disclosure_deadline writing disclosure_required and disclosure_deadline_utc", "for incident_type DEATH: the animal becomes DECEASED, its RESERVED segments are RELEASED and ACCEPTED segments OFFLOADED with leg counters decremented, its kennel allocations are RELEASED with Station.reserved_bay_count decremented, and the reservation becomes INTERRUPTED with refunds applied", "for incident_type LOSS: the animal becomes DENIED with the same segment and allocation cascade"]
  - method: GET
    path: "/animal-incidents/{id}"
    description: "Read one incident including both severity variants and the disclosure fields"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: AnimalIncident
    side_effects: []
  - method: GET
    path: "/animal-incidents"
    description: "List incidents, filterable by animal record, segment and status"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: ["animal_record_id?", "segment_assignment_id?", "status?", "limit?", "offset?"]
    output: AnimalIncident[]
    side_effects: []
  - method: POST
    path: "/animal-incidents/{id}/investigate"
    description: "Open the investigation, barred to the reporter"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AnimalIncident
    side_effects: ["status set to INVESTIGATING", "investigated_by_user_id stamped from X-User-ID", "increments AnimalIncident.version by 1"]
  - method: POST
    path: "/animal-incidents/{id}/disclose"
    description: "File the regulatory disclosure for an incident that requires it"
    roles: [ComplianceOfficer]
    code: 200
    input: ["regulator_reference?"]
    output: AnimalIncident
    side_effects: ["status set to REGULATOR_DISCLOSED", "disclosed_at_utc stamped from the logical clock and disclosure_on_time computed", "increments AnimalIncident.version by 1"]
  - method: POST
    path: "/animal-incidents/{id}/close"
    description: "Close an incident with a veterinary finding, barred to the investigator"
    roles: [ComplianceOfficer]
    code: 200
    input: ["veterinary_finding"]
    output: AnimalIncident
    side_effects: ["status set to CLOSED", "closed_by_user_id stamped from X-User-ID", "runs incident_severity_score ADJUDICATED writing adjudicated_severity_score", "increments AnimalIncident.version by 1"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["advances the logical clock read by document expiry, welfare timestamps, occupancy windows and disclosure deadlines"]
  - method: GET
    path: "/_clock"
    description: "Test-driving endpoint: read the current logical clock, default 2026-08-01T00:00:00Z"
    roles: [ProgramAdmin, ReservationsAgent, AcceptanceAgent, VeterinaryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []

errors:
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-ID or X-User-Role header absent or empty"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same operator that booked the reservation being accepted, reported the incident being investigated, or investigated the incident being closed"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed JSON body, missing required field, wrong type, undeclared enum member, or unknown field"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative"
  - id: ERR_SPECIES_NOT_FOUND
    http: 404
    condition: "species profile id in path or body does not exist"
  - id: ERR_BREED_RESTRICTION_NOT_FOUND
    http: 404
    condition: "breed restriction id in path does not exist"
  - id: ERR_CONTAINER_MODEL_NOT_FOUND
    http: 404
    condition: "container model id in path or body does not exist"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "station id in path or body does not exist"
  - id: ERR_EMBARGO_RULE_NOT_FOUND
    http: 404
    condition: "temperature embargo rule id in path does not exist"
  - id: ERR_DESTINATION_REQUIREMENT_NOT_FOUND
    http: 404
    condition: "destination requirement id in path does not exist"
  - id: ERR_FLIGHT_LEG_NOT_FOUND
    http: 404
    condition: "flight leg id in path or body does not exist"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "reservation id in path or body does not exist"
  - id: ERR_ANIMAL_NOT_FOUND
    http: 404
    condition: "animal record id in path or body does not exist"
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "segment assignment id in path or body does not exist"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "health document id in path does not exist"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "kennel allocation id in path does not exist"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "animal incident id in path does not exist"
  - id: ERR_STALE_FLIGHT_LEG_VERSION
    http: 412
    condition: "expected_flight_leg_version does not equal the current FlightLeg.version on POST /segment-assignments"
  - id: ERR_STALE_STATION_VERSION
    http: 412
    condition: "expected_station_version does not equal the current Station.version on POST /kennel-allocations"
  - id: ERR_FLIGHT_LEG_INVALID_STATE
    http: 409
    condition: "the flight leg is not in a status the requested operation allows"
  - id: ERR_RESERVATION_INVALID_STATE
    http: 409
    condition: "the reservation booking_status does not permit the requested operation"
  - id: ERR_ANIMAL_INVALID_STATE
    http: 409
    condition: "the animal record status does not permit the requested operation"
  - id: ERR_SEGMENT_INVALID_STATE
    http: 409
    condition: "the segment assignment status does not permit the requested operation"
  - id: ERR_DOCUMENT_INVALID_STATE
    http: 409
    condition: "the health document status does not permit the requested review action"
  - id: ERR_ALLOCATION_INVALID_STATE
    http: 409
    condition: "the kennel allocation status does not permit occupy or release"
  - id: ERR_INCIDENT_INVALID_STATE
    http: 409
    condition: "the incident status does not permit investigate, disclose or close"
  - id: ERR_DOC_REVISION_LIMIT_REACHED
    http: 409
    condition: "a rejected document has already been revised three times"
  - id: ERR_SPECIES_RETIRED
    http: 422
    condition: "the animal's SpeciesProfile.status is RETIRED"
  - id: ERR_SPECIES_NOT_ACCEPTED
    http: 422
    condition: "the SpeciesProfile.acceptance_class is EMBARGOED_SPECIES"
  - id: ERR_BREED_BANNED
    http: 422
    condition: "an ACTIVE BreedRestriction with restriction_type BANNED matches the animal's breed"
  - id: ERR_ANIMAL_UNDERAGE
    http: 422
    condition: "age_weeks is below SpeciesProfile.min_age_weeks"
  - id: ERR_ROUTING_NOT_PERMITTED_FOR_BREED
    http: 422
    condition: "a CARGO_ONLY species or breed is booked on CABIN or CHECKED routing"
  - id: ERR_BREED_WEIGHT_CAP_EXCEEDED
    http: 422
    condition: "gross weight exceeds the matching WEIGHT_CAPPED restriction's max_weight_kg"
  - id: ERR_CABIN_WEIGHT_EXCEEDED
    http: 422
    condition: "CABIN routing gross weight exceeds SpeciesProfile.max_cabin_weight_kg at acceptance"
  - id: ERR_CONTAINER_NON_COMPLIANT
    http: 422
    condition: "AnimalRecord.container_compliance_state is DEFICIENT or UNEVALUATED"
  - id: ERR_BEHAVIOR_ATTESTATION_MISSING
    http: 422
    condition: "a SERVICE_ANIMAL record has behavior_attestation_on_file false at travel-ready time"
  - id: ERR_LEG_EMBARGOED
    http: 422
    condition: "the flight leg posture is EMBARGOED and the governing rule's applies_to_routings contains the requested routing_type"
  - id: ERR_STATION_SUSPENDED
    http: 422
    condition: "an origin or destination station has status SUSPENDED"
  - id: ERR_WELFARE_CHECKS_INCOMPLETE
    http: 422
    condition: "an accepted segment on the departing leg has fewer welfare checks than required_welfare_check_count"
  - id: ERR_LEG_HAS_UNACCEPTED_SEGMENTS
    http: 422
    condition: "a segment on the departing leg is still in status RESERVED"
  - id: ERR_MEASURED_WEIGHT_REQUIRED
    http: 422
    condition: "measured_weight_kg is null when the final fee variant must be computed at acceptance"
  - id: ERR_REQUIRED_DOCUMENT_MISSING
    http: 422
    condition: "a mandatory ACTIVE DestinationRequirement has no VERIFIED HealthDocument"
  - id: ERR_DOCUMENT_STALE_FOR_DESTINATION
    http: 422
    condition: "a verified document was issued more than max_age_days_at_arrival whole days before the final segment arrival"
  - id: ERR_DOCUMENT_ISSUER_MISMATCH
    http: 422
    condition: "the document issuing_country_code differs from the origin station country of the animal's first segment"
  - id: ERR_COMPLIANCE_NOT_VERIFIED
    http: 422
    condition: "the reservation compliance_status is not VERIFIED when confirmation or acceptance is attempted"
  - id: ERR_DISCLOSURE_NOT_REQUIRED
    http: 422
    condition: "disclosure filed for an incident whose disclosure_required is false"
  - id: ERR_DISCLOSURE_PENDING
    http: 422
    condition: "close attempted from INVESTIGATING while disclosure_required is true and no disclosure has been filed"
  - id: ERR_ROUTING_MISMATCH
    http: 422
    condition: "segment routing_type differs from the owning reservation routing_type"
  - id: ERR_SEGMENT_SEQUENCE_INVALID
    http: 422
    condition: "sequence_index is not 1 for a first segment, skips a position, or duplicates a non-RELEASED segment"
  - id: ERR_SEGMENT_ANIMAL_MISMATCH
    http: 422
    condition: "the segment_assignment_id supplied on an incident does not belong to the supplied animal_record_id"
  - id: ERR_DUPLICATE_SPECIES_CODE
    http: 409
    condition: "species_code already exists"
  - id: ERR_DUPLICATE_CONTAINER_MODEL
    http: 409
    condition: "model_code already exists"
  - id: ERR_DUPLICATE_STATION_CODE
    http: 409
    condition: "iata_code already exists"
  - id: ERR_DUPLICATE_BREED_RESTRICTION
    http: 409
    condition: "an ACTIVE breed restriction with the same lowercased breed_name already exists for the species, or max_weight_kg is supplied without restriction_type WEIGHT_CAPPED"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "an end instant is not strictly after its start instant"
  - id: ERR_SCHEDULE_NOT_MONOTONIC
    http: 422
    condition: "a delay does not move the departure later, or a restore does not move it earlier"
  - id: ERR_CONNECTION_BELOW_MINIMUM
    http: 422
    condition: "connection_minutes is below the routing minimum"
  - id: ERR_CONNECTION_EXCEEDS_MAXIMUM
    http: 422
    condition: "connection_minutes exceeds MAX_CONNECTION_MINUTES"
  - id: ERR_ANIMAL_ITINERARY_OVERLAP
    http: 409
    condition: "the requested leg interval intersects another non-RELEASED segment interval of the same animal, endpoints included"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "the requested logical clock instant is earlier than the current logical clock"
  - id: ERR_ROUTING_LIMIT_REACHED
    http: 409
    condition: "the leg's per-routing animal limit is already met"
  - id: ERR_KENNEL_CAPACITY_EXCEEDED
    http: 409
    condition: "projected peak bay occupancy exceeds Station.kennel_bay_count"

roles:
  - name: ProgramAdmin
    description: "Owns the live animal program configuration: species, breeds, containers, stations, embargo rules, flight schedules and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /species-profiles"
      - "PUT /species-profiles/{id}/status"
      - "POST /breed-restrictions"
      - "PUT /breed-restrictions/{id}/status"
      - "POST /destination-requirements"
      - "POST /container-models"
      - "POST /stations"
      - "PUT /stations/{id}/status"
      - "POST /temperature-embargo-rules"
      - "PUT /temperature-embargo-rules/{id}/status"
      - "POST /flight-legs"
      - "PUT /flight-legs/{id}/forecast"
      - "POST /flight-legs/{id}/delay"
      - "POST /flight-legs/{id}/restore-schedule"
      - "POST /flight-legs/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: ReservationsAgent
    description: "Books reservations, animals, segments and document submissions; barred from accepting the animals it booked"
    identity: "opaque"
    exclusive_operations:
      - "POST /reservations"
      - "POST /reservations/{id}/confirm"
      - "POST /reservations/{id}/cancel"
      - "POST /animal-records"
      - "POST /segment-assignments"
      - "POST /segment-assignments/{id}/release"
      - "POST /health-documents"
      - "POST /health-documents/{id}/resubmit"
    shared_operations:
      - "PUT /animal-records/{id}"
      - "all GET endpoints"
  - name: AcceptanceAgent
    description: "Screens and accepts animals at the counter, records welfare checks, provisions kennels, works the flight and reports incidents"
    identity: "opaque"
    exclusive_operations:
      - "POST /animal-records/{id}/screen"
      - "POST /animal-records/{id}/mark-travel-ready"
      - "POST /animal-records/{id}/deny"
      - "POST /segment-assignments/{id}/accept"
      - "POST /segment-assignments/{id}/offload"
      - "POST /welfare-checks"
      - "POST /kennel-allocations"
      - "POST /kennel-allocations/{id}/occupy"
      - "POST /kennel-allocations/{id}/release"
      - "POST /irops-care-sweeps"
      - "POST /flight-legs/{id}/depart"
      - "POST /flight-legs/{id}/arrive"
    shared_operations:
      - "PUT /animal-records/{id}"
      - "POST /animal-incidents"
      - "all GET endpoints"
  - name: VeterinaryReviewer
    description: "Reviews health certificates, vaccination records and import permits and runs the reservation compliance sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /health-documents/{id}/start-review"
      - "POST /health-documents/{id}/verify"
      - "POST /health-documents/{id}/reject"
      - "POST /reservations/{id}/verify-compliance"
    shared_operations:
      - "all GET endpoints"
  - name: ComplianceOfficer
    description: "Investigates, discloses and closes animal incidents; segregation of duties bars the reporter from investigating and the investigator from closing"
    identity: "opaque"
    exclusive_operations:
      - "POST /animal-incidents/{id}/investigate"
      - "POST /animal-incidents/{id}/disclose"
      - "POST /animal-incidents/{id}/close"
    shared_operations:
      - "POST /animal-incidents"
      - "all GET endpoints"
