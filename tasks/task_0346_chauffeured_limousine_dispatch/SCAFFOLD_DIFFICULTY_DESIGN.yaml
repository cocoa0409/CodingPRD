              payload: { corporate_account_id: "00000000-0000-4000-8000-000000000000", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-07-10T13:00:00Z", planned_drop_at: "2026-07-10T12:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
