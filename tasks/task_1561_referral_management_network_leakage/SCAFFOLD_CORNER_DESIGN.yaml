            - { call: "POST /specialty-providers", payload: { name: "SO", npi: "1000000009", specialty: "ORTHOPEDICS", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { so: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
          trigger:
            - { call: "POST /referrals/${r}/auto-match", as: ReferralCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_ELIGIBLE_SPECIALIST, HTTP 422"
            - "Referral.${r}.target_specialist_id == null and status == ACCEPTED"

      - name: stat_urgency_requires_accepts_urgent_eligibility
        claim_type: selector_policy
        grounds: [calculations.specialty_match_ranking, entities.SpecialistProvider.fields.accepts_urgent]
        distinguishing_aspect: "Conditional eligibility: for a STAT referral, candidates with accepts_urgent=false are excluded entirely (not just penalized); the single accepts_urgent=true candidate wins."
        test_recipe:
          setup: ["clock 2026-08-01; plan; patient; provider; S1 CARDIOLOGY accepts_urgent=false PREFERRED; S2 CARDIOLOGY accepts_urgent=true STANDARD; STAT referral accepted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10, accepts_urgent: false }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S2", npi: "1000000002", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10, accepts_urgent: true }, as: NetworkAdmin, captures: { s2: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /network-participations", payload: { specialist_id: "${s2}", insurance_plan_id: "${plan1}", tier: "STANDARD", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I21", urgency: "STAT" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
          trigger:
            - { call: "POST /referrals/${r}/auto-match", as: ReferralCoordinator }
          assert:
            - "Referral.${r}.target_specialist_id == ${s2} (S1 excluded by accepts_urgent=false despite PREFERRED tier)"
            - "Referral.${r}.match_score == 85 (50 + 10 STANDARD + 0 + 20 STAT + 5 region)"

      - name: strike_threshold_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Appointment.SCHEDULED_to_NO_SHOW]
        excluded_because:
          difficulty_instance: no_show_strike_threshold_cascade
          rationale: "Depth-3 cascade asserted end-to-end in the §1.8 instance."

      - name: dual_variant_coverage_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.conversion_rate, calculations.no_show_risk_score]
        excluded_because:
          difficulty_instance: conversion_rate_dual_basis_divergence
          rationale: "Both dual-variant calculations exercised by §1.8 instances (and live-report variant selection in calculations section)."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: accept_response_reflects_mutation_immediately
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.Referral.PENDING_TRIAGE_to_ACCEPTED]
        distinguishing_aspect: "Immediate consistency: the accept RESPONSE body itself carries the mutated fields (status ACCEPTED, auth_status NOT_REQUIRED, sla_due_at set, version 2) — no re-read needed to observe the transition."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; plan; provider; patient; referral created"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
          trigger:
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator, captures: { st: $.data.status, auth: $.data.auth_status, due: $.data.sla_due_at, v: $.data.version } }
          assert:
            - "accept response: status == ACCEPTED, auth_status == NOT_REQUIRED, sla_due_at == \"2026-08-31T00:00:00Z\", version == 2"
