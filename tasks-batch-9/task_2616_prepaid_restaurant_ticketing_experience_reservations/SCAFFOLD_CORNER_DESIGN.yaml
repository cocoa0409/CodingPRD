            - "G1 also holds a WAITING waitlist entry on a second service S2 of the same restaurant, whose priority_penalty_applied is false — this is the far end of cascade C"
            - "exception X requests 1000 cents, which is well below amount_paid 25740, so priority 62 and 63 are both satisfied"
