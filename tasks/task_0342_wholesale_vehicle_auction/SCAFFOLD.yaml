# =============================================================================
# PRD Benchmark Seed Tables — Wholesale Vehicle Auction (Manheim style)
# Difficulty tier: EXPERT (§0.4)
# =============================================================================

scenario: |
  Wholesale Vehicle Auction (Manheim style): consignment intake & condition
  report, run-list & lane scheduling, live/online bidding & reserve, arbitration
  window/policy, buyer fee & gate pass, floor price/proxy bid, title & payment
  settlement, transport

domain_name: wholesale-vehicle-auction
api_prefix: /auction

complexity_profile:
  primary_archetype: multi_party_negotiation      # buyers + seller (+ house floor) converge on a clearing price
  secondary_archetype: temporal_windowing          # run-list lane slots + carrier pickup windows + arbitration windows
  complexity_layers:
    - optimistic_concurrency        # OCC on RunListEntry.version for bid-create-with-supersede
    - cascading_side_effects        # hammer → settlement → gate pass; payment → clear → gate pass → consign settled
    - dual_variant_calculation      # buyer_fee and seller_net_proceeds each provisional@hammer vs final@settlement
    - rate_threshold_triggers       # bid-increment ladder + buyer-fee tier bands + reserve threshold

  entity_topology: flat
  # Flat peer collections under /auction with FK references in bodies; reverse
  # reachability provided by filtered-list GETs (?fk_field=). Deliberately NOT
  # hierarchical — see §0.3 diversity guidance.

  state_machine_shape: parallel
  # Settlement carries TWO independent state axes (payment_status × title_status)
  # on one row; Consignment has a cycle (IF_PENDING ↔ RUN_LISTED re-run loop);
  # RunListEntry forks SOLD/PASSED/IF_PENDING with divergent side-effects;
  # ArbitrationClaim branches APPROVED/DENIED.

  relationship_patterns:
    - one_to_many        # AuctionSale → Lanes / Consignments / Lots
    - cross_aggregate    # Settlement references Lot, Buyer, Seller across aggregates

  role_model: peer_roles
  # Seller owns Consignments; Buyer owns Bids/Settlements; AuctionAdmin runs the
  # sale; Arbitrator rules on claims. Non-overlapping resource ownership.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: AuctionSale
    parent: null
    common_fields: true
    fields:
      - { name: sale_name, type: string, source: input, description: "Human-readable name of the auction sale (e.g. 'Tuesday Dealer Sale')" }
      - { name: sale_date, type: datetime, source: input, description: "ISO 8601 UTC date the sale runs" }
      - { name: buyer_fee_schedule_code, type: enum, source: input, default: "STANDARD", description: "Fee schedule applied to all lots in this sale", constraints: "one of {STANDARD, PREMIUM}" }
      - { name: status, type: enum, source: system, description: "Lifecycle gate for all child operations", constraints: "DRAFT -> OPEN -> RUNNING -> CLOSED -> SETTLED" }
      - { name: lane_count, type: integer, source: computed, default: 0, description: "Read-only count of Lanes whose status != ARCHIVED for this sale" }

  - name: Lane
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> AuctionSale.id; the sale this lane belongs to" }
      - { name: lane_number, type: integer, source: input, description: "Lane number, unique within the sale", constraints: "positive integer; unique per (sale_id, lane_number)" }
      - { name: open_minute, type: integer, source: input, description: "Lane operating window start, minutes from sale start (inclusive)", constraints: "0 <= open_minute < close_minute" }
      - { name: close_minute, type: integer, source: input, description: "Lane operating window end, minutes from sale start (exclusive)", constraints: "close_minute > open_minute" }
      - { name: scheduled_slot_count, type: integer, source: computed, default: 0, description: "Read-only = count of RunListEntry with lane_id == this.id and status NOT IN {WITHDRAWN, PASSED}" }
      - { name: status, type: enum, source: system, description: "PLANNED -> ACTIVE -> CLOSED ; ARCHIVED is a soft-removed terminal", constraints: "PLANNED -> ACTIVE -> CLOSED ; PLANNED -> ARCHIVED" }

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: dealer_name, type: string, source: input, description: "Selling dealer's legal name" }
      - { name: seller_fee_pct, type: number, source: input, default: 0.02, description: "Seller commission rate applied to hammer price", constraints: "0 <= seller_fee_pct <= 0.10" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> SUSPENDED", constraints: "ACTIVE -> SUSPENDED -> ACTIVE" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: dealer_name, type: string, source: input, description: "Buying dealer's legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Total floor-plan credit available to this buyer, in cents", constraints: ">= 0" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Read-only = sum of total_due_cents over this buyer's Settlements with payment_status IN {UNPAID, PAID} (i.e. not REVERSED and not WRITTEN_OFF)" }
      - { name: available_credit_cents, type: integer, source: computed, default: 0, description: "Read-only = credit_limit_cents - committed_cents; initialized equal to credit_limit_cents" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> SUSPENDED", constraints: "ACTIVE -> SUSPENDED -> ACTIVE" }

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> AuctionSale.id; the sale this vehicle is consigned into" }
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; the consigning dealer" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number", constraints: "17 chars; unique per sale_id" }
      - { name: reserve_price_cents, type: integer, source: input, default: 0, description: "Hidden seller minimum; 0 means absolute/no-reserve. Set during CATALOGED transition.", constraints: ">= 0" }
      - { name: floor_price_cents, type: integer, source: input, default: 0, description: "House proxy floor bid placed on the seller's behalf; must be <= reserve_price_cents", constraints: "0 <= floor_price_cents <= reserve_price_cents" }
      - { name: title_status, type: enum, source: input, default: "ABSENT", description: "Whether the paper/electronic title is in hand at the auction", constraints: "one of {ABSENT, ON_HAND}" }
      - { name: expected_proceeds_cents, type: integer, source: computed, default: 0, description: "Read-only seller_net_proceeds; provisional at hammer, final at settlement (see calculations.seller_net_proceeds)" }
      - { name: status, type: enum, source: system, description: "Lifecycle of the consigned vehicle", constraints: "SUBMITTED -> CATALOGED -> RUN_LISTED -> (SOLD | NO_SALE | IF_PENDING) ; IF_PENDING -> RUN_LISTED (re-run) ; SOLD -> SETTLED ; SOLD -> ARB_UNWOUND ; SUBMITTED/CATALOGED -> WITHDRAWN" }

  - name: ConditionReport
    parent: null
    common_fields: true
    fields:
      - { name: consignment_id, type: string, source: input, description: "FK -> Consignment.id; the inspected vehicle (1:1 with Consignment)" }
      - { name: grade, type: number, source: input, description: "Inspection grade 0.0–5.0 in 0.1 steps", constraints: "0.0 <= grade <= 5.0" }
      - { name: odometer_miles, type: integer, source: input, description: "Recorded odometer reading", constraints: ">= 0" }
      - { name: announcements, type: array, source: input, default: [], description: "Disclosed defects/announcements, e.g. ['FRAME_DAMAGE','TITLE_BRANDED']" }
      - { name: as_is, type: boolean, source: computed, default: false, description: "Read-only = true when grade < 3.0 OR announcements is non-empty; an AS_IS sale blocks arbitration" }

  - name: RunListEntry
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> AuctionSale.id; denormalized owning sale" }
      - { name: consignment_id, type: string, source: input, description: "FK -> Consignment.id; the vehicle being run (1:1 with an active lot)" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; the lane this lot runs in" }
      - { name: run_number, type: integer, source: input, description: "Sequence position within the lane", constraints: "positive; unique per (lane_id, run_number)" }
      - { name: slot_start_minute, type: integer, source: input, description: "Scheduled run window start (inclusive), minutes from sale start", constraints: "lane.open_minute <= slot_start_minute < slot_end_minute" }
      - { name: slot_end_minute, type: integer, source: input, description: "Scheduled run window end (exclusive), minutes from sale start", constraints: "slot_start_minute < slot_end_minute <= lane.close_minute" }
      - { name: starting_bid_cents, type: integer, source: input, description: "Opening ask the auctioneer starts at", constraints: ">= 0" }
      - { name: high_bid_cents, type: integer, source: computed, default: 0, description: "Read-only current standing clearing price (see calculations.clearing_price)" }
      - { name: high_bidder_id, type: string, source: computed, default: null, description: "Computed standing high bidder; holds a Buyer.id value (or null when only the house floor stands). Derived by clearing_price, not a stored relational FK; discover bids per buyer via GET /auction/bids?buyer_id." }
      - { name: hammer_price_cents, type: integer, source: computed, default: 0, description: "Read-only clearing price frozen at HAMMERED; 0 until hammered" }
      - { name: outcome, type: enum, source: computed, default: "NONE", description: "Read-only sale_outcome at hammer", constraints: "one of {NONE, SOLD, IF, PASSED}" }
      - { name: status, type: enum, source: system, description: "Lifecycle of the lot on the block", constraints: "SCHEDULED -> BIDDING_OPEN -> BIDDING_CLOSED -> (HAMMERED | PASSED | IF_PENDING) ; HAMMERED -> FINALIZED ; HAMMERED -> ARB_REVERSED ; IF_PENDING -> SCHEDULED (re-list) ; SCHEDULED -> WITHDRAWN" }

  - name: Bid
    parent: null
    common_fields: false   # append-only event: only id + created_at; never mutated
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> RunListEntry.id; the lot bid on" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the bidder" }
      - { name: bid_type, type: enum, source: input, description: "LIVE = exact one-shot bid; PROXY = autobid up to a ceiling", constraints: "one of {LIVE, PROXY}" }
      - { name: channel, type: enum, source: input, default: "ONLINE", description: "Where the bid came from; ONLINE bids attract a simulcast surcharge on buyer_fee", constraints: "one of {LANE, ONLINE}" }
      - { name: amount_cents, type: integer, source: input, description: "For LIVE: the bid amount. For PROXY: the autobid ceiling (max_amount).", constraints: "> 0" }
      - { name: ceiling_cents, type: integer, source: computed, description: "Read-only normalized ceiling = amount_cents (used by clearing_price)" }

  - name: ArbitrationClaim
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> RunListEntry.id; the sold lot being disputed" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the claimant (must be the winning buyer)" }
      - { name: reason_code, type: enum, source: input, description: "Basis of the claim", constraints: "one of {UNDISCLOSED_DAMAGE, TITLE_DISCREPANCY, MECHANICAL}" }
      - { name: claimed_cents, type: integer, source: input, description: "Buyer's requested adjustment/credit", constraints: "> 0" }
      - { name: approved_cents, type: integer, source: computed, default: 0, description: "Read-only arbitration_credit decided at ruling (see calculations.arbitration_credit)" }
      - { name: resolution, type: enum, source: computed, default: "PENDING", description: "PENDING -> APPROVED_FULL | APPROVED_PARTIAL | DENIED", constraints: "one of {PENDING, APPROVED_FULL, APPROVED_PARTIAL, DENIED}" }
      - { name: status, type: enum, source: system, description: "OPEN -> (RESOLVED) ; RESOLVED is terminal", constraints: "OPEN -> RESOLVED" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> RunListEntry.id; the hammered lot being settled (1:1)" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the paying winner" }
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; the paid consignor" }
      - { name: sale_price_cents, type: integer, source: computed, description: "Effective sale price; equals hammer_price_cents, reduced by approved arbitration credit when applicable" }
      - { name: buyer_fee_cents, type: integer, source: computed, description: "Read-only buyer_fee (dual-variant: provisional@create vs final@payment-after-arbitration)" }
      - { name: total_due_cents, type: integer, source: computed, description: "Read-only buyer_total_due = sale_price_cents + buyer_fee_cents (see calculations.buyer_total_due)" }
      - { name: seller_proceeds_cents, type: integer, source: computed, description: "Read-only net paid to seller (mirrors Consignment.expected_proceeds, final at clearing)" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "Payment axis (independent of title_status)", constraints: "UNPAID -> PAID -> REVERSED ; UNPAID -> WRITTEN_OFF" }
      - { name: title_status, type: enum, source: system, default: "PENDING_TITLE", description: "Title axis (independent of payment_status)", constraints: "PENDING_TITLE -> TITLE_RECEIVED" }
      - { name: status, type: enum, source: computed, default: "OPEN", description: "Derived rollup of the two axes", constraints: "OPEN (payment_status != PAID OR title_status != TITLE_RECEIVED) ; CLEARED (PAID AND TITLE_RECEIVED) ; VOID (payment_status REVERSED) ; DEFAULTED (payment_status WRITTEN_OFF)" }

  - name: GatePass
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: input, description: "FK -> Settlement.id; the cleared settlement that authorized release (1:1)" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the buyer releasing the vehicle" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED -> REDEEMED ; ISSUED -> VOID", constraints: "ISSUED -> REDEEMED ; ISSUED -> VOID" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: carrier_name, type: string, source: input, description: "Transport carrier legal name" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory closed-interval buffer required between two pickups by this carrier", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> SUSPENDED", constraints: "ACTIVE -> SUSPENDED -> ACTIVE" }

  - name: TransportOrder
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: input, description: "FK -> Settlement.id; the settlement whose vehicle is being moved" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; the booked carrier" }
      - { name: pickup_start_minute, type: integer, source: input, description: "Pickup window start (inclusive), absolute minutes-of-day", constraints: "0 <= pickup_start_minute < pickup_end_minute" }
      - { name: pickup_end_minute, type: integer, source: input, description: "Pickup window end (inclusive), absolute minutes-of-day", constraints: "pickup_end_minute > pickup_start_minute" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED -> DISPATCHED -> DELIVERED ; REQUESTED -> CANCELLED", constraints: "REQUESTED -> DISPATCHED -> DELIVERED ; REQUESTED -> CANCELLED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: AuctionSale
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /auction/sales/{saleId}/open"
        actor: AuctionAdmin
        preconditions:
          - "Sale must be in DRAFT (ERR_SALE_NOT_IN_DRAFT)"
        side_effects: []
        note: "Once OPEN, consignment intake and lane/run-list building are allowed"
      - from: OPEN
        to: RUNNING
        trigger: "POST /auction/sales/{saleId}/start"
        actor: AuctionAdmin
        preconditions:
          - "Sale must be in OPEN (ERR_SALE_NOT_OPEN)"
          - "At least one Lane exists for this sale with status PLANNED or ACTIVE (ERR_NO_LANES)"
        side_effects:
          - "All Lanes of this sale in PLANNED -> ACTIVE"
      - from: RUNNING
        to: CLOSED
        trigger: "POST /auction/sales/{saleId}/close"
        actor: AuctionAdmin
        preconditions:
          - "Sale must be in RUNNING (ERR_SALE_NOT_RUNNING)"
          - "No RunListEntry of this sale is in BIDDING_OPEN (ERR_LOTS_STILL_LIVE)"
        side_effects:
          - "All Lanes of this sale in ACTIVE -> CLOSED"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /auction/sales/{saleId}/settle"
        actor: AuctionAdmin
        preconditions:
          - "Sale must be in CLOSED (ERR_SALE_NOT_CLOSED)"
          - "Every Settlement of this sale has status IN {CLEARED, VOID, DEFAULTED} (ERR_UNSETTLED_LOTS_EXIST)"
        side_effects: []

  - entity: Lane
    initial_state: PLANNED
    terminal_states: [CLOSED, ARCHIVED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "system (cascaded by AuctionSale OPEN->RUNNING start)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "system (cascaded by AuctionSale RUNNING->CLOSED close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: ARCHIVED
        trigger: "POST /auction/lanes/{laneId}/archive"
        actor: AuctionAdmin
        preconditions:
          - "Lane must be PLANNED (ERR_LANE_NOT_PLANNED)"
          - "scheduled_slot_count == 0 (ERR_LANE_HAS_LOTS)"
        side_effects:
          - "Recompute AuctionSale.lane_count for the owning sale"

  - entity: Consignment
    initial_state: SUBMITTED
    terminal_states: [SETTLED, WITHDRAWN, ARB_UNWOUND]
    transitions:
      - from: SUBMITTED
        to: CATALOGED
        trigger: "POST /auction/consignments/{consignmentId}/catalog"
        actor: AuctionAdmin
        preconditions:
          - "Consignment must be SUBMITTED (ERR_CONSIGNMENT_NOT_SUBMITTED)"
          - "A ConditionReport exists for this consignment (ERR_CONDITION_REPORT_MISSING)"
          - "floor_price_cents <= reserve_price_cents (ERR_FLOOR_ABOVE_RESERVE)"
        side_effects:
          - "Persist reserve_price_cents and floor_price_cents from request body"
      - from: CATALOGED
        to: RUN_LISTED
        trigger: "system (cascaded when a RunListEntry is created for this consignment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RUN_LISTED
        to: SOLD
        trigger: "system (cascaded by RunListEntry BIDDING_CLOSED->HAMMERED with outcome SOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "Set expected_proceeds_cents = seller_net_proceeds (provisional variant)"
      - from: RUN_LISTED
        to: IF_PENDING
        trigger: "system (cascaded by RunListEntry BIDDING_CLOSED->IF_PENDING with outcome IF)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RUN_LISTED
        to: NO_SALE
        trigger: "system (cascaded by RunListEntry BIDDING_CLOSED->PASSED with outcome PASSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IF_PENDING
        to: RUN_LISTED
        trigger: "system (cascaded by RunListEntry IF_PENDING->SCHEDULED re-list)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cycle: an if-bid lot can be re-run, returning the consignment to RUN_LISTED"
      - from: SOLD
        to: SETTLED
        trigger: "system (cascaded when the lot's Settlement reaches CLEARED and GatePass is ISSUED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SOLD
        to: ARB_UNWOUND
        trigger: "system (cascaded by ArbitrationClaim ruling APPROVED_FULL that reverses the settlement)"
        actor: system
        preconditions: []
        side_effects:
          - "Set expected_proceeds_cents = 0"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /auction/consignments/{consignmentId}/withdraw"
        actor: Seller
        preconditions:
          - "Consignment must be SUBMITTED or CATALOGED (ERR_CONSIGNMENT_NOT_WITHDRAWABLE)"
        side_effects: []
      - from: CATALOGED
        to: WITHDRAWN
        trigger: "POST /auction/consignments/{consignmentId}/withdraw"
        actor: Seller
        preconditions:
          - "Consignment must be SUBMITTED or CATALOGED (ERR_CONSIGNMENT_NOT_WITHDRAWABLE)"
        side_effects: []

  - entity: RunListEntry
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, PASSED, ARB_REVERSED, WITHDRAWN]
    transitions:
      - from: SCHEDULED
        to: BIDDING_OPEN
        trigger: "POST /auction/lots/{lotId}/open-bidding"
        actor: AuctionAdmin
        preconditions:
          - "Lot must be SCHEDULED (ERR_LOT_NOT_SCHEDULED)"
          - "Owning AuctionSale is RUNNING (ERR_SALE_NOT_RUNNING)"
          - "Lane referenced by lane_id is ACTIVE (ERR_LANE_NOT_ACTIVE)"
        side_effects:
          - "Initialize high_bid_cents = max(starting_bid_cents, consignment.floor_price_cents); high_bidder_id = null"
      - from: BIDDING_OPEN
        to: BIDDING_CLOSED
        trigger: "POST /auction/lots/{lotId}/close-bidding"
        actor: AuctionAdmin
        preconditions:
          - "Lot must be BIDDING_OPEN (ERR_LOT_NOT_BIDDING_OPEN)"
        side_effects:
          - "Freeze high_bid_cents and high_bidder_id"
      - from: BIDDING_CLOSED
        to: HAMMERED
        trigger: "POST /auction/lots/{lotId}/hammer"
        actor: AuctionAdmin
        preconditions:
          - "Lot must be BIDDING_CLOSED (ERR_LOT_NOT_BIDDING_CLOSED)"
          - "sale_outcome computes to SOLD (high_bidder_id != null AND high_bid_cents >= consignment.reserve_price_cents) (ERR_OUTCOME_NOT_SOLD)"
        side_effects:
          - "Set outcome = SOLD; freeze hammer_price_cents = high_bid_cents"
          - "Cascade: Consignment RUN_LISTED -> SOLD (sets expected_proceeds_cents provisional)"
          - "Create Settlement (payment_status=UNPAID, title_status=PENDING_TITLE) for (lot, high_bidder_id, consignment.seller_id); compute provisional buyer_fee_cents, total_due_cents, sale_price_cents=hammer_price_cents, seller_proceeds_cents"
          - "Debit Buyer.available_credit_cents by total_due_cents (recompute committed_cents)"
      - from: BIDDING_CLOSED
        to: IF_PENDING
        trigger: "POST /auction/lots/{lotId}/mark-if"
        actor: AuctionAdmin
        preconditions:
          - "Lot must be BIDDING_CLOSED (ERR_LOT_NOT_BIDDING_CLOSED)"
          - "sale_outcome computes to IF (high_bidder_id != null AND high_bid_cents < consignment.reserve_price_cents) (ERR_OUTCOME_NOT_IF)"
        side_effects:
          - "Set outcome = IF"
          - "Cascade: Consignment RUN_LISTED -> IF_PENDING"
      - from: BIDDING_CLOSED
        to: PASSED
        trigger: "POST /auction/lots/{lotId}/pass"
        actor: AuctionAdmin
        preconditions:
          - "Lot must be BIDDING_CLOSED (ERR_LOT_NOT_BIDDING_CLOSED)"
          - "sale_outcome computes to PASSED (high_bidder_id == null) (ERR_OUTCOME_NOT_PASSED)"
        side_effects:
          - "Set outcome = PASSED"
          - "Cascade: Consignment RUN_LISTED -> NO_SALE"
          - "Recompute Lane.scheduled_slot_count (PASSED lots leave the active slot set)"
      - from: IF_PENDING
        to: SCHEDULED
        trigger: "POST /auction/lots/{lotId}/relist"
        actor: AuctionAdmin
        preconditions:
          - "Lot must be IF_PENDING (ERR_LOT_NOT_IF_PENDING)"
          - "Owning AuctionSale is RUNNING (ERR_SALE_NOT_RUNNING)"
        side_effects:
          - "Reset high_bid_cents = 0, high_bidder_id = null, outcome = NONE"
          - "Cascade: Consignment IF_PENDING -> RUN_LISTED"
        note: "Cycle back to SCHEDULED so the lot can be re-run"
      - from: HAMMERED
        to: FINALIZED
        trigger: "system (cascaded when the lot's Settlement reaches CLEARED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: HAMMERED
        to: ARB_REVERSED
        trigger: "system (cascaded by ArbitrationClaim ruling APPROVED_FULL)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /auction/lots/{lotId}/withdraw"
        actor: AuctionAdmin
        preconditions:
          - "Lot must be SCHEDULED (ERR_LOT_NOT_SCHEDULED)"
        side_effects:
          - "Recompute Lane.scheduled_slot_count (WITHDRAWN lots leave the active slot set)"
          - "Cascade: Consignment RUN_LISTED -> NO_SALE if no other active lot references it"

  - entity: Bid
    initial_state: PLACED
    terminal_states: [PLACED]
    transitions:
      - from: "(none)"
        to: PLACED
        trigger: "POST /auction/lots/{lotId}/bids"
        actor: Buyer
        preconditions:
          - "Lot must be BIDDING_OPEN (ERR_LOT_NOT_BIDDING_OPEN)"
          - "Buyer.status == ACTIVE (ERR_BUYER_SUSPENDED)"
          - "expected_lot_version matches RunListEntry.version (ERR_STALE_LOT_VERSION)"
          - "amount_cents >= high_bid_cents + bid_increment when a buyer high bid already stands; otherwise amount_cents >= high_bid_cents (ERR_BID_BELOW_MINIMUM)"
          - "Buyer.available_credit_cents >= projected total_due if this bid were to win (ERR_INSUFFICIENT_CREDIT)"
        side_effects:
          - "Append immutable Bid (event); set ceiling_cents = amount_cents"
          - "Recompute clearing_price -> update RunListEntry.high_bid_cents, high_bidder_id"
          - "Increment RunListEntry.version by 1"
        note: "Bid is append-only; no further transitions. The lot, not the bid, carries OCC version."

  - entity: ArbitrationClaim
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /auction/arbitration-claims/{claimId}/rule"
        actor: Arbitrator
        preconditions:
          - "Claim must be OPEN (ERR_CLAIM_NOT_OPEN)"
          - "Referenced lot's Settlement payment_status == PAID (ERR_SETTLEMENT_NOT_PAID)"
        side_effects:
          - "Set approved_cents = arbitration_credit; set resolution IN {APPROVED_FULL, APPROVED_PARTIAL, DENIED}"
          - "If APPROVED_PARTIAL: reduce Settlement.sale_price_cents by approved_cents; recompute final buyer_fee_cents, total_due_cents, seller_proceeds_cents; re-credit Buyer by (old_total_due - new_total_due)"
          - "If APPROVED_FULL: cascade Settlement -> REVERSED (full unwind); see Settlement REVERSED transition"
          - "If DENIED: no economic change"
        note: "Branching fork with divergent side-effect sets per resolution branch"

  - entity: Settlement
    initial_state: OPEN
    terminal_states: [CLEARED, VOID, DEFAULTED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /auction/settlements/{settlementId}/record-payment"
        actor: AuctionAdmin
        preconditions:
          - "Settlement payment_status must be UNPAID (ERR_SETTLEMENT_NOT_UNPAID)"
          - "Referenced lot status == HAMMERED (ERR_LOT_NOT_HAMMERED)"
        side_effects:
          - "payment_status UNPAID -> PAID"
          - "Recompute derived status; if title_status == TITLE_RECEIVED then status -> CLEARED (see CLEARED transition cascade)"
        note: "Payment axis advances independently of title axis (parallel dimensions)"
      - from: OPEN
        to: OPEN
        trigger: "POST /auction/settlements/{settlementId}/record-title"
        actor: AuctionAdmin
        preconditions:
          - "Settlement title_status must be PENDING_TITLE (ERR_TITLE_ALREADY_RECEIVED)"
        side_effects:
          - "title_status PENDING_TITLE -> TITLE_RECEIVED"
          - "Recompute derived status; if payment_status == PAID then status -> CLEARED (see CLEARED transition cascade)"
        note: "Title axis advances independently of payment axis (parallel dimensions)"
      - from: OPEN
        to: CLEARED
        trigger: "system (auto when payment_status==PAID AND title_status==TITLE_RECEIVED)"
        actor: system
        preconditions:
          - "payment_status == PAID AND title_status == TITLE_RECEIVED"
        side_effects:
          - "Set seller_proceeds_cents = seller_net_proceeds (final variant); mirror to Consignment.expected_proceeds_cents"
          - "Cascade: RunListEntry HAMMERED -> FINALIZED"
          - "Cascade: auto-issue GatePass (status ISSUED) for (settlement, buyer)"
          - "Cascade: Consignment SOLD -> SETTLED"
        note: "Depth-4 transitive cascade: payment -> CLEARED -> GatePass issued -> Consignment SETTLED"
      - from: OPEN
        to: VOID
        trigger: "system (cascaded by ArbitrationClaim APPROVED_FULL)"
        actor: system
        preconditions:
          - "payment_status == PAID (claim ruling precondition guarantees this)"
        side_effects:
          - "payment_status PAID -> REVERSED; derived status -> VOID"
          - "Re-credit Buyer.available_credit_cents by total_due_cents (recompute committed_cents)"
          - "Cascade: RunListEntry HAMMERED -> ARB_REVERSED"
          - "Cascade: Consignment SOLD -> ARB_UNWOUND (expected_proceeds_cents -> 0)"
          - "If a GatePass exists for this settlement and is ISSUED: GatePass -> VOID"
        note: "Compensating action: total_due_cents fully returned to buyer credit"
      - from: OPEN
        to: DEFAULTED
        trigger: "POST /auction/settlements/{settlementId}/write-off"
        actor: AuctionAdmin
        preconditions:
          - "Settlement payment_status must be UNPAID (ERR_SETTLEMENT_NOT_UNPAID)"
          - "Referenced AuctionSale status == CLOSED (ERR_SALE_NOT_CLOSED)"
        side_effects:
          - "payment_status UNPAID -> WRITTEN_OFF; derived status -> DEFAULTED"
          - "Re-credit Buyer.available_credit_cents by total_due_cents (recompute committed_cents)"
          - "Suspend Buyer (ACTIVE -> SUSPENDED)"

  - entity: GatePass
    initial_state: ISSUED
    terminal_states: [REDEEMED, VOID]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /auction/gate-passes/{gatePassId}/redeem"
        actor: AuctionAdmin
        preconditions:
          - "GatePass must be ISSUED (ERR_GATE_PASS_NOT_ISSUED)"
          - "A TransportOrder exists for the same settlement with status DISPATCHED (ERR_NO_DISPATCHED_TRANSPORT)"
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "system (cascaded by Settlement VOID via arbitration)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TransportOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /auction/transport-orders/{transportOrderId}/dispatch"
        actor: AuctionAdmin
        preconditions:
          - "TransportOrder must be REQUESTED (ERR_TRANSPORT_NOT_REQUESTED)"
          - "Referenced Settlement status == CLEARED (ERR_SETTLEMENT_NOT_CLEARED)"
          - "Carrier.status == ACTIVE (ERR_CARRIER_SUSPENDED)"
        side_effects: []
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /auction/transport-orders/{transportOrderId}/deliver"
        actor: AuctionAdmin
        preconditions:
          - "TransportOrder must be DISPATCHED (ERR_TRANSPORT_NOT_DISPATCHED)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /auction/transport-orders/{transportOrderId}/cancel"
        actor: Buyer
        preconditions:
          - "TransportOrder must be REQUESTED (ERR_TRANSPORT_NOT_REQUESTED)"
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: bid-create-stale-lot
    parent_entity: RunListEntry
    write_endpoint: "POST /auction/lots/{lotId}/bids"
    occ_field: "expected_lot_version"
    description: |
      Placing a Bid against a RunListEntry whose version has advanced since the
      client last observed it is rejected. The losing request carries a stale
      expected_lot_version because an earlier bid was already appended (which
      legitimately advanced the standing clearing price and the lot version);
      the current bidder's view of high_bid_cents is therefore stale. Resolved
      by an OCC stale-version check, not by request timing.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: bid_increment
    trigger: "validated on every POST /auction/lots/{lotId}/bids and used by clearing_price"
    algorithm: threshold
    formula: |
      Given a reference price P (cents), the minimum increment is selected by band:
        if P < 500000:        increment = 10000      # under $5,000 -> $100
        elif P < 1000000:     increment = 25000      # $5,000 .. $9,999.99 -> $250
        else:                 increment = 50000      # >= $10,000 -> $500
      Band boundaries are strict (>=): P == 500000 uses 25000; P == 1000000 uses 50000.
    constants:
      BAND1_MAX_CENTS: 500000
      BAND2_MAX_CENTS: 1000000
      INCR_BAND1: 10000
      INCR_BAND2: 25000
      INCR_BAND3: 50000
    precision: "integer cents; no rounding"

  - name: clearing_price
    trigger: "recomputed after every appended Bid; frozen into hammer_price_cents at HAMMERED"
    algorithm: weighted_scoring
    formula: |
      Let house_floor = max(lot.starting_bid_cents, consignment.floor_price_cents).
      Consider all Bids on the lot grouped by buyer_id; each buyer's effective
      ceiling = the MAXIMUM ceiling_cents among that buyer's bids.
      Rank buyer ceilings DESC; tie-break = the buyer whose qualifying max-ceiling
      bid has the EARLIEST created_at (never by id).
        - If zero buyer bids: high_bidder_id = null, high_bid_cents = house_floor.
        - If exactly one buyer ceiling C1 (buyer B1):
            high_bidder_id = B1
            high_bid_cents = min(C1, max(house_floor, lot.starting_bid_cents))
              (i.e. B1 only needs to beat the house floor: standing = max(house_floor, starting_bid_cents),
               but never above its own ceiling C1)
        - If two or more (top C1 buyer B1, second C2):
            high_bidder_id = B1
            second_ref = max(C2, house_floor)
            high_bid_cents = min(C1, second_ref + bid_increment(second_ref))
      A LIVE bid is treated as a PROXY whose ceiling equals amount_cents.
    input_set: "all Bid events for the lot (Bid is append-only; none are excluded)"
    constants: {}
    precision: "integer cents; bid_increment selected on second_ref"
    note: "Order-independent except the documented earliest-created_at tie-break"

  - name: sale_outcome
    trigger: "evaluated at close-bidding / hammer / mark-if / pass"
    algorithm: threshold
    formula: |
      Using the frozen high_bidder_id and high_bid_cents at BIDDING_CLOSED:
        if high_bidder_id == null:                              outcome = PASSED
        elif high_bid_cents >= consignment.reserve_price_cents: outcome = SOLD
        else:                                                   outcome = IF
      Reserve threshold is inclusive: high_bid_cents == reserve_price_cents is SOLD.
      A no-reserve consignment (reserve_price_cents == 0) with any buyer high bid is SOLD.
    constants: {}
    precision: "integer cents"

  - name: buyer_fee
    trigger: "computed when Settlement is created (provisional); recomputed at arbitration ruling (final)"
    algorithm: tiered_pricing
    formula: |
      Inputs: sale_price_cents S, sale.buyer_fee_schedule_code, winning bid channel.
      Base tier fee by hammer/sale band (flat, marginal NOT applied — flat per band):
        STANDARD schedule:
          S <  200000:            base = 12500    # < $2,000  -> $125
          200000 <= S < 1000000:  base = round_half_up(S * 0.06)   # $2,000 .. $9,999.99 -> 6%
          S >= 1000000:           base = round_half_up(S * 0.04) + 20000  # >= $10,000 -> 4% + $200
        PREMIUM schedule:
          S <  200000:            base = 17500
          200000 <= S < 1000000:  base = round_half_up(S * 0.08)
          S >= 1000000:           base = round_half_up(S * 0.05) + 25000
      Online surcharge: if winning Bid.channel == ONLINE, online = round_half_up(base * 0.10) else 0.
      buyer_fee_cents = base + online.
      "Winning Bid" = the high_bidder_id buyer's max-ceiling bid frozen at hammer.
    input_set: "Settlement.sale_price_cents and the winning bid's channel"
    constants:
      STANDARD_FLOOR_FEE: 12500
      STANDARD_MID_PCT: 0.06
      STANDARD_HIGH_PCT: 0.04
      STANDARD_HIGH_ADDON: 20000
      PREMIUM_FLOOR_FEE: 17500
      PREMIUM_MID_PCT: 0.08
      PREMIUM_HIGH_PCT: 0.05
      PREMIUM_HIGH_ADDON: 25000
      ONLINE_SURCHARGE_PCT: 0.10
      MID_BAND_FLOOR_CENTS: 200000
      HIGH_BAND_FLOOR_CENTS: 1000000
    precision: "round_half_up to integer cents on each percentage term BEFORE adding addon/surcharge"
    variants:
      - name: provisional
        when: "at Settlement creation (hammer); sale_price_cents == hammer_price_cents"
        difference: "uses the hammer price as S"
      - name: final
        when: "at arbitration ruling APPROVED_PARTIAL; sale_price_cents reduced by approved_cents"
        difference: "recomputes base/online on the reduced sale_price_cents, which can drop a tier band -> different fee"

  - name: buyer_total_due
    trigger: "computed with buyer_fee at Settlement creation and recomputed at arbitration ruling"
    algorithm: aggregation
    formula: |
      Component A = sale_price_cents (already integer cents).
      Component B = buyer_fee_cents, itself the sum of two ALREADY-rounded integer
        terms (base, online) — see buyer_fee precision.
      total_due_cents = A + B.
      Rounding order is PINNED: each percentage-derived term is rounded half-up to
      cents FIRST (inside buyer_fee), THEN summed. The benchmark forbids the
      "sum the raw fractional terms, then round once" order, which yields a
      different cent on tier-straddling prices.
    input_set: "Settlement.sale_price_cents, Settlement.buyer_fee_cents"
    constants: {}
    precision: "integer cents; per-term-round-then-sum order is mandatory"

  - name: seller_net_proceeds
    trigger: "provisional at Consignment SOLD (hammer); final at Settlement CLEARED / arbitration ruling"
    algorithm: aggregation
    formula: |
      Inputs: sale_price_cents S, Seller.seller_fee_pct R, ConditionReport.as_is.
      seller_commission = round_half_up(S * R)
      seller_commission = min(seller_commission, SELLER_FEE_CAP_CENTS)   # cap
      assurance_fee = 0 if ConditionReport.as_is else ASSURANCE_FEE_CENTS  # arbitration-assurance pool
      seller_net_proceeds = S - seller_commission - assurance_fee
      (Floor at 0: never negative.)
    input_set: "Settlement.sale_price_cents, the consignment's Seller.seller_fee_pct, ConditionReport.as_is"
    constants:
      SELLER_FEE_CAP_CENTS: 150000
      ASSURANCE_FEE_CENTS: 5000
    precision: "round_half_up to integer cents"
    variants:
      - name: provisional
        when: "at hammer; S = hammer_price_cents, as_is read from ConditionReport"
        difference: "uses hammer price"
      - name: final
        when: "at Settlement CLEARED or after APPROVED_PARTIAL arbitration"
        difference: "uses Settlement.sale_price_cents (possibly reduced by arbitration credit) -> lower commission and proceeds"

  - name: arbitration_credit
    trigger: "POST /auction/arbitration-claims/{claimId}/rule"
    algorithm: threshold
    formula: |
      Inputs: claimed_cents Q, Settlement.sale_price_cents S, reason_code,
              ConditionReport.as_is, ConditionReport.grade.
      If ConditionReport.as_is == true:
        approved_cents = 0; resolution = DENIED   # AS_IS sales are not arbitrable
      else:
        cap = round_half_up(S * MAX_CREDIT_PCT)
        if Q >= S:                       # claim meets/exceeds the price -> full unwind
            approved_cents = S; resolution = APPROVED_FULL
        elif Q <= cap:                   # within policy cap -> full of the claim
            approved_cents = Q; resolution = APPROVED_PARTIAL
        else:                            # over cap -> capped partial
            approved_cents = cap; resolution = APPROVED_PARTIAL
      Cap boundary is inclusive: Q == cap is APPROVED_PARTIAL at Q (not capped).
    constants:
      MAX_CREDIT_PCT: 0.30
    precision: "round_half_up to integer cents"

  - name: lane_slot_occupancy
    trigger: "recomputed on lot create / withdraw / pass and on lane archive check"
    algorithm: aggregation
    formula: |
      Lane.scheduled_slot_count = count of RunListEntry where
        lane_id == lane.id AND status NOT IN {WITHDRAWN, PASSED}.
      Invariant: for every Lane, scheduled_slot_count == |{lots in that lane not in
      {WITHDRAWN, PASSED}}| at all times (a forward create increments it by 1; the
      compensating withdraw/pass decrements it by 1, leaving the running auction's
      total active-slot count conserved).
    input_set: "RunListEntry rows with status NOT IN {WITHDRAWN, PASSED}"
    constants: {}
    precision: "integer count"

  - name: buyer_credit_balance
    trigger: "recomputed whenever a Settlement is created, reversed, written off, or arbitration-adjusted"
    algorithm: aggregation
    formula: |
      committed_cents = sum of total_due_cents over the buyer's Settlements whose
        payment_status IN {UNPAID, PAID} (REVERSED and WRITTEN_OFF excluded).
      available_credit_cents = credit_limit_cents - committed_cents.
      Conservation invariant: available_credit_cents + committed_cents ==
      credit_limit_cents at all times. A hammer debits exactly total_due_cents;
      its compensating reversal/write-off re-credits exactly the same total_due_cents,
      so the buyer's credit is conserved end-to-end.
    input_set: "Settlement rows for the buyer with payment_status IN {UNPAID, PAID}"
    constants: {}
    precision: "integer cents"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles (Seller, Buyer) the acting X-User-ID must own the targeted resource (Seller.id == consignment.seller_id; Buyer.id == bid/settlement/transport buyer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Seller/Buyer ownership-scoped endpoints"

  - priority: 4
    category: existence
    check: "All path/body resource IDs exist (validated left-to-right in path, then body FKs)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (from-state precondition)"
    error_id: "varies (ERR_LOT_NOT_BIDDING_OPEN, ERR_SETTLEMENT_NOT_UNPAID, etc.)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-FK coherence: a lot's lane_id and consignment_id must reference the SAME sale_id as the lot; a settlement's seller_id must equal the consignment's seller_id"
    error_id: ERR_CROSS_SALE_REFERENCE
    http_status: 409
    applies_to: "POST /auction/lots, POST /auction/lots/{lotId}/hammer"

  - priority: 7
    category: business_temporal
    check: "RunListEntry slot window [slot_start_minute, slot_end_minute) must lie within the lane window and must NOT overlap any other non-WITHDRAWN/PASSED lot in the same lane (half-open intervals; adjacency gap==0 is allowed)"
    error_id: ERR_LANE_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /auction/lots"

  - priority: 8
    category: business_temporal
    check: "TransportOrder pickup window [pickup_start_minute, pickup_end_minute] (CLOSED interval) must keep a gap >= carrier.turnaround_buffer_minutes from every other non-CANCELLED TransportOrder on the same carrier (buffered closed-interval semantics)"
    error_id: ERR_CARRIER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /auction/transport-orders"

  - priority: 9
    category: business_constraint
    check: "Bid amount meets the minimum increment rule (see calculations.bid_increment / clearing_price)"
    error_id: ERR_BID_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /auction/lots/{lotId}/bids"

  - priority: 10
    category: business_constraint
    check: "floor_price_cents <= reserve_price_cents at catalog; uniqueness of (sale_id, vin), (lane_id, run_number), (sale_id, lane_number)"
    error_id: "varies (ERR_FLOOR_ABOVE_RESERVE, ERR_DUPLICATE_VIN, ERR_DUPLICATE_RUN_NUMBER, ERR_DUPLICATE_LANE_NUMBER)"
    http_status: 409
    applies_to: "POST /auction/consignments/{id}/catalog, POST /auction/consignments, POST /auction/lots, POST /auction/lanes"

  - priority: 11
    category: business_fiscal
    check: "Buyer must have sufficient available_credit_cents to cover projected total_due if this bid wins"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /auction/lots/{lotId}/bids"

  - priority: 12
    category: business_constraint
    check: "OCC: expected_lot_version must equal RunListEntry.version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /auction/lots/{lotId}/bids"

# =============================================================================
# Table 1.5: API Endpoint Table  (all under /auction)
# =============================================================================
endpoints:
  # ---- AuctionSale ----
  - { method: POST, path: "/auction/sales", description: "Create a sale (DRAFT)", roles: [AuctionAdmin], code: 201, input: [sale_name, sale_date, "buyer_fee_schedule_code?"], output: AuctionSale, side_effects: ["status=DRAFT", "lane_count=0"] }
  - { method: GET, path: "/auction/sales", description: "List sales", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: ["status?", "limit?", "offset?"], output: "AuctionSale[]", side_effects: [] }
  - { method: GET, path: "/auction/sales/{saleId}", description: "Get a sale", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: [], output: AuctionSale, side_effects: [] }
  - { method: POST, path: "/auction/sales/{saleId}/open", description: "DRAFT->OPEN", roles: [AuctionAdmin], code: 200, input: [], output: AuctionSale, side_effects: ["status->OPEN"] }
  - { method: POST, path: "/auction/sales/{saleId}/start", description: "OPEN->RUNNING; activates lanes", roles: [AuctionAdmin], code: 200, input: [], output: AuctionSale, side_effects: ["status->RUNNING", "Lanes PLANNED->ACTIVE"] }
  - { method: POST, path: "/auction/sales/{saleId}/close", description: "RUNNING->CLOSED; closes lanes", roles: [AuctionAdmin], code: 200, input: [], output: AuctionSale, side_effects: ["status->CLOSED", "Lanes ACTIVE->CLOSED"] }
  - { method: POST, path: "/auction/sales/{saleId}/settle", description: "CLOSED->SETTLED", roles: [AuctionAdmin], code: 200, input: [], output: AuctionSale, side_effects: ["status->SETTLED"] }

  # ---- Lane ----
  - { method: POST, path: "/auction/lanes", description: "Create a lane (PLANNED)", roles: [AuctionAdmin], code: 201, input: [sale_id, lane_number, open_minute, close_minute], output: Lane, side_effects: ["status=PLANNED", "recompute AuctionSale.lane_count"] }
  - { method: GET, path: "/auction/lanes", description: "List/filter lanes", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: ["sale_id?", "status?", "limit?", "offset?"], output: "Lane[]", side_effects: [] }
  - { method: GET, path: "/auction/lanes/{laneId}", description: "Get a lane", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: [], output: Lane, side_effects: [] }
  - { method: POST, path: "/auction/lanes/{laneId}/archive", description: "PLANNED->ARCHIVED (only if empty)", roles: [AuctionAdmin], code: 200, input: [], output: Lane, side_effects: ["status->ARCHIVED", "recompute AuctionSale.lane_count"] }

  # ---- Seller ----
  - { method: POST, path: "/auction/sellers", description: "Register a selling dealer", roles: [AuctionAdmin], code: 201, input: [dealer_name, "seller_fee_pct?"], output: Seller, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/auction/sellers", description: "List sellers", roles: [AuctionAdmin, Seller], code: 200, input: ["status?", "limit?", "offset?"], output: "Seller[]", side_effects: [] }
  - { method: GET, path: "/auction/sellers/{sellerId}", description: "Get a seller", roles: [AuctionAdmin, Seller], code: 200, input: [], output: Seller, side_effects: [] }
  - { method: POST, path: "/auction/sellers/{sellerId}/suspend", description: "ACTIVE->SUSPENDED", roles: [AuctionAdmin], code: 200, input: [], output: Seller, side_effects: ["status->SUSPENDED"] }
  - { method: POST, path: "/auction/sellers/{sellerId}/reinstate", description: "SUSPENDED->ACTIVE", roles: [AuctionAdmin], code: 200, input: [], output: Seller, side_effects: ["status->ACTIVE"] }

  # ---- Buyer ----
  - { method: POST, path: "/auction/buyers", description: "Register a buying dealer", roles: [AuctionAdmin], code: 201, input: [dealer_name, credit_limit_cents], output: Buyer, side_effects: ["status=ACTIVE", "available_credit_cents=credit_limit_cents", "committed_cents=0"] }
  - { method: GET, path: "/auction/buyers", description: "List buyers", roles: [AuctionAdmin, Buyer], code: 200, input: ["status?", "limit?", "offset?"], output: "Buyer[]", side_effects: [] }
  - { method: GET, path: "/auction/buyers/{buyerId}", description: "Get a buyer (credit fields)", roles: [AuctionAdmin, Buyer], code: 200, input: [], output: Buyer, side_effects: [] }
  - { method: POST, path: "/auction/buyers/{buyerId}/suspend", description: "ACTIVE->SUSPENDED", roles: [AuctionAdmin], code: 200, input: [], output: Buyer, side_effects: ["status->SUSPENDED"] }
  - { method: POST, path: "/auction/buyers/{buyerId}/reinstate", description: "SUSPENDED->ACTIVE", roles: [AuctionAdmin], code: 200, input: [], output: Buyer, side_effects: ["status->ACTIVE"] }

  # ---- Consignment ----
  - { method: POST, path: "/auction/consignments", description: "Consign a vehicle (SUBMITTED)", roles: [AuctionAdmin, Seller], code: 201, input: [sale_id, seller_id, vin, "title_status?"], output: Consignment, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/auction/consignments", description: "List/filter consignments", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: ["sale_id?", "seller_id?", "status?", "limit?", "offset?"], output: "Consignment[]", side_effects: [] }
  - { method: GET, path: "/auction/consignments/{consignmentId}", description: "Get a consignment", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: [], output: Consignment, side_effects: [] }
  - { method: POST, path: "/auction/consignments/{consignmentId}/catalog", description: "SUBMITTED->CATALOGED; set reserve/floor", roles: [AuctionAdmin], code: 200, input: [reserve_price_cents, floor_price_cents], output: Consignment, side_effects: ["status->CATALOGED", "persist reserve/floor"] }
  - { method: POST, path: "/auction/consignments/{consignmentId}/withdraw", description: "SUBMITTED/CATALOGED->WITHDRAWN", roles: [AuctionAdmin, Seller], code: 200, input: [], output: Consignment, side_effects: ["status->WITHDRAWN"] }

  # ---- ConditionReport ----
  - { method: POST, path: "/auction/condition-reports", description: "Attach a condition report to a consignment", roles: [AuctionAdmin], code: 201, input: [consignment_id, grade, odometer_miles, "announcements?"], output: ConditionReport, side_effects: ["compute as_is"] }
  - { method: GET, path: "/auction/condition-reports", description: "List/filter condition reports", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: ["consignment_id?", "limit?", "offset?"], output: "ConditionReport[]", side_effects: [] }
  - { method: GET, path: "/auction/condition-reports/{conditionReportId}", description: "Get a condition report", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: [], output: ConditionReport, side_effects: [] }

  # ---- RunListEntry (Lot) ----
  - { method: POST, path: "/auction/lots", description: "Run-list a cataloged consignment into a lane slot (SCHEDULED)", roles: [AuctionAdmin], code: 201, input: [sale_id, consignment_id, lane_id, run_number, slot_start_minute, slot_end_minute, starting_bid_cents], output: RunListEntry, side_effects: ["status=SCHEDULED", "Consignment CATALOGED->RUN_LISTED", "recompute Lane.scheduled_slot_count"] }
  - { method: GET, path: "/auction/lots", description: "List/filter lots", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: ["sale_id?", "consignment_id?", "lane_id?", "status?", "limit?", "offset?"], output: "RunListEntry[]", side_effects: [] }
  - { method: GET, path: "/auction/lots/{lotId}", description: "Get a lot (live high bid)", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: [], output: RunListEntry, side_effects: [] }
  - { method: POST, path: "/auction/lots/{lotId}/open-bidding", description: "SCHEDULED->BIDDING_OPEN", roles: [AuctionAdmin], code: 200, input: [], output: RunListEntry, side_effects: ["status->BIDDING_OPEN", "init high_bid_cents=max(starting_bid_cents, floor_price_cents)"] }
  - { method: POST, path: "/auction/lots/{lotId}/close-bidding", description: "BIDDING_OPEN->BIDDING_CLOSED", roles: [AuctionAdmin], code: 200, input: [], output: RunListEntry, side_effects: ["status->BIDDING_CLOSED", "freeze high bid"] }
  - { method: POST, path: "/auction/lots/{lotId}/hammer", description: "BIDDING_CLOSED->HAMMERED (outcome SOLD); creates Settlement", roles: [AuctionAdmin], code: 200, input: [], output: RunListEntry, side_effects: ["outcome=SOLD", "freeze hammer_price_cents", "Consignment->SOLD", "create Settlement", "debit Buyer credit"] }
  - { method: POST, path: "/auction/lots/{lotId}/mark-if", description: "BIDDING_CLOSED->IF_PENDING (outcome IF)", roles: [AuctionAdmin], code: 200, input: [], output: RunListEntry, side_effects: ["outcome=IF", "Consignment->IF_PENDING"] }
  - { method: POST, path: "/auction/lots/{lotId}/pass", description: "BIDDING_CLOSED->PASSED (outcome PASSED)", roles: [AuctionAdmin], code: 200, input: [], output: RunListEntry, side_effects: ["outcome=PASSED", "Consignment->NO_SALE", "recompute Lane.scheduled_slot_count"] }
  - { method: POST, path: "/auction/lots/{lotId}/relist", description: "IF_PENDING->SCHEDULED (re-run loop)", roles: [AuctionAdmin], code: 200, input: [], output: RunListEntry, side_effects: ["status->SCHEDULED", "reset high bid/outcome", "Consignment IF_PENDING->RUN_LISTED"] }
  - { method: POST, path: "/auction/lots/{lotId}/withdraw", description: "SCHEDULED->WITHDRAWN", roles: [AuctionAdmin], code: 200, input: [], output: RunListEntry, side_effects: ["status->WITHDRAWN", "recompute Lane.scheduled_slot_count"] }

  # ---- Bid ----
  - { method: POST, path: "/auction/lots/{lotId}/bids", description: "Place a LIVE or PROXY bid (OCC on lot.version)", roles: [Buyer], code: 201, input: [buyer_id, bid_type, amount_cents, expected_lot_version, "channel?"], output: Bid, side_effects: ["append Bid", "recompute clearing_price -> lot.high_bid_cents/high_bidder_id", "increment RunListEntry.version by 1"] }
  - { method: GET, path: "/auction/bids", description: "List/filter bids", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: ["lot_id?", "buyer_id?", "limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/auction/bids/{bidId}", description: "Get a bid", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: [], output: Bid, side_effects: [] }

  # ---- ArbitrationClaim ----
  - { method: POST, path: "/auction/arbitration-claims", description: "Open an arbitration claim within the window", roles: [Buyer], code: 201, input: [lot_id, buyer_id, reason_code, claimed_cents], output: ArbitrationClaim, side_effects: ["status=OPEN", "resolution=PENDING"] }
  - { method: GET, path: "/auction/arbitration-claims", description: "List/filter claims", roles: [AuctionAdmin, Buyer, Arbitrator], code: 200, input: ["lot_id?", "buyer_id?", "status?", "limit?", "offset?"], output: "ArbitrationClaim[]", side_effects: [] }
  - { method: GET, path: "/auction/arbitration-claims/{claimId}", description: "Get a claim", roles: [AuctionAdmin, Buyer, Arbitrator], code: 200, input: [], output: ArbitrationClaim, side_effects: [] }
  - { method: POST, path: "/auction/arbitration-claims/{claimId}/rule", description: "OPEN->RESOLVED; decide arbitration_credit and cascade", roles: [Arbitrator], code: 200, input: [], output: ArbitrationClaim, side_effects: ["set approved_cents/resolution", "APPROVED_PARTIAL: adjust settlement+re-credit", "APPROVED_FULL: reverse settlement", "DENIED: no-op"] }

  # ---- Settlement ----
  - { method: GET, path: "/auction/settlements", description: "List/filter settlements", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: ["lot_id?", "buyer_id?", "seller_id?", "status?", "limit?", "offset?"], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/auction/settlements/{settlementId}", description: "Get a settlement", roles: [AuctionAdmin, Seller, Buyer, Arbitrator], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: POST, path: "/auction/settlements/{settlementId}/record-payment", description: "Mark payment received (payment axis)", roles: [AuctionAdmin], code: 200, input: [], output: Settlement, side_effects: ["payment_status->PAID", "maybe CLEARED cascade"] }
  - { method: POST, path: "/auction/settlements/{settlementId}/record-title", description: "Mark title received (title axis)", roles: [AuctionAdmin], code: 200, input: [], output: Settlement, side_effects: ["title_status->TITLE_RECEIVED", "maybe CLEARED cascade"] }
  - { method: POST, path: "/auction/settlements/{settlementId}/write-off", description: "UNPAID->WRITTEN_OFF (default); re-credit + suspend buyer", roles: [AuctionAdmin], code: 200, input: [], output: Settlement, side_effects: ["payment_status->WRITTEN_OFF", "status->DEFAULTED", "re-credit buyer", "Buyer->SUSPENDED"] }

  # ---- GatePass ----
  - { method: GET, path: "/auction/gate-passes", description: "List/filter gate passes", roles: [AuctionAdmin, Buyer], code: 200, input: ["settlement_id?", "buyer_id?", "status?", "limit?", "offset?"], output: "GatePass[]", side_effects: [] }
  - { method: GET, path: "/auction/gate-passes/{gatePassId}", description: "Get a gate pass", roles: [AuctionAdmin, Buyer], code: 200, input: [], output: GatePass, side_effects: [] }
  - { method: POST, path: "/auction/gate-passes/{gatePassId}/redeem", description: "ISSUED->REDEEMED (release vehicle)", roles: [AuctionAdmin], code: 200, input: [], output: GatePass, side_effects: ["status->REDEEMED"] }

  # ---- Carrier ----
  - { method: POST, path: "/auction/carriers", description: "Register a transport carrier", roles: [AuctionAdmin], code: 201, input: [carrier_name, "turnaround_buffer_minutes?"], output: Carrier, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/auction/carriers", description: "List carriers", roles: [AuctionAdmin, Buyer], code: 200, input: ["status?", "limit?", "offset?"], output: "Carrier[]", side_effects: [] }
  - { method: GET, path: "/auction/carriers/{carrierId}", description: "Get a carrier", roles: [AuctionAdmin, Buyer], code: 200, input: [], output: Carrier, side_effects: [] }
  - { method: POST, path: "/auction/carriers/{carrierId}/suspend", description: "ACTIVE->SUSPENDED", roles: [AuctionAdmin], code: 200, input: [], output: Carrier, side_effects: ["status->SUSPENDED"] }

  # ---- TransportOrder ----
  - { method: POST, path: "/auction/transport-orders", description: "Book transport for a settled vehicle (REQUESTED)", roles: [AuctionAdmin, Buyer], code: 201, input: [settlement_id, carrier_id, pickup_start_minute, pickup_end_minute], output: TransportOrder, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/auction/transport-orders", description: "List/filter transport orders", roles: [AuctionAdmin, Buyer], code: 200, input: ["settlement_id?", "carrier_id?", "status?", "limit?", "offset?"], output: "TransportOrder[]", side_effects: [] }
  - { method: GET, path: "/auction/transport-orders/{transportOrderId}", description: "Get a transport order", roles: [AuctionAdmin, Buyer], code: 200, input: [], output: TransportOrder, side_effects: [] }
  - { method: POST, path: "/auction/transport-orders/{transportOrderId}/dispatch", description: "REQUESTED->DISPATCHED", roles: [AuctionAdmin], code: 200, input: [], output: TransportOrder, side_effects: ["status->DISPATCHED"] }
  - { method: POST, path: "/auction/transport-orders/{transportOrderId}/deliver", description: "DISPATCHED->DELIVERED", roles: [AuctionAdmin], code: 200, input: [], output: TransportOrder, side_effects: ["status->DELIVERED"] }
  - { method: POST, path: "/auction/transport-orders/{transportOrderId}/cancel", description: "REQUESTED->CANCELLED", roles: [AuctionAdmin, Buyer], code: 200, input: [], output: TransportOrder, side_effects: ["status->CANCELLED"] }

