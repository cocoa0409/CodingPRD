            - "A transfer with from_store_id == to_store_id == 0102 -> 422 ERR_SAME_STORE_TRANSFER, the self-loop refusal"
            - "Creating a second run on the same receipt sets AllocationRun.${run2_id}.supersedes_run_id == ${run1_id} and moves AllocationRun.${run1_id}.status to CANCELLED"
