            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-C", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-C", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { proto_id: "$.data.id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-C", name: "Catheter Parts" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-C", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
