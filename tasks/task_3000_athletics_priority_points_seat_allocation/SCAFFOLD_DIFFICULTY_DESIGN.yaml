# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 3000 — Athletics Priority Points & Seat Allocation
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Every numeric assert
# below was produced by executing the relevant §1.3 formula with
# decimal.Decimal + ROUND_HALF_UP against its declared constants.
# Standing operator identities used throughout:
#   officer-1 (DevelopmentOfficer), admin-1 (PlatformAdmin),
#   certifier-1 (PointsCertifier), analyst-1 (DisputeAnalyst),
#   policy-1 (PolicyCommittee).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_certified_points_diverge_on_pledged_gift
        grounds:
          - calculations.priority_point_score
          - entities.Donor.fields.provisional_points
          - entities.Donor.fields.certified_base_points
          - entities.Gift.fields.gift_status
          - entities.PointLedgerEntry.fields.variant
        distinguishing_aspect: |
          This dual variant lives on the Donor scoring domain: with an unsettled
          PLEDGED gift on the books the PROVISIONAL variant scores 92.50 while
          the CERTIFIED variant scores 85.00 from the identical donor and gift
          rows, a 7.50 divergence created purely by the admitted gift_status set.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "One ALUMNUS INDIVIDUAL donor with no season-ticket tenure and no transfers."
            - "One RECEIVED ATHLETICS_ANNUAL gift of 4,500,000 cents dated 2026-03-01 and one PLEDGED ATHLETICS_ANNUAL gift of 500,000 cents dated 2026-04-01."
            - "A DRAFT PointRecalculation for cycle 2026 with cutoff_date 2026-06-30T23:59:59.999Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Dana Alumna", email: "dana.alumna@example.com", alumni_status: "ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { d1_id: "$.data.id" }
            - call: "POST /athletics/donors/${d1_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 4500000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${d1_id}/gifts"
              payload: { gift_date: "2026-04-01T00:00:00.000Z", amount_cents: 500000, designation: "ATHLETICS_ANNUAL", gift_status: "PLEDGED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { g_pledge_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { r_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/point-recalculations/${r_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "Donor.${d1_id}.provisional_points == 92.50"
            - "Donor.${d1_id}.certified_base_points == 85.00"
            - "Donor.${d1_id}.certified_points == 85.00"
            - "Donor.${d1_id}.cumulative_giving_cents == 4500000"
            - "Donor.${d1_id}.consecutive_giving_years == 1"
            - "PointLedgerEntry with donor_id ${d1_id}, entry_type CUMULATIVE_GIVING and variant PROVISIONAL has points == 62.50"
            - "PointLedgerEntry with donor_id ${d1_id}, entry_type CUMULATIVE_GIVING and variant CERTIFIED has points == 55.00"
            - "PointLedgerEntry with donor_id ${d1_id}, entry_type ALUMNI_STATUS and variant CERTIFIED has points == 25.00"
            - "PointRecalculation.${r_id}.status == COMPUTED"
            - "PointRecalculation.${r_id}.donors_processed_count == 1"

      - name: renewal_vs_market_seat_requirement_diverge_after_reprice
        grounds:
          - calculations.seat_requirement_amount
          - entities.SeatAssignment.fields.pricing_mode
          - entities.SeatAssignment.fields.grandfathered_requirement_cents
          - entities.Section.fields.requirement_history
          - state_machines.Seat.AVAILABLE_to_HELD
        distinguishing_aspect: |
          This dual variant lives on the SeatAssignment pricing domain, not the
          Donor scoring domain: after SEC-B is repriced from 250,000 to 400,000
          cents, the renewing occupant is charged 298,513 cents (grandfathered
          rate compounded six years, under the 340,000-cent ceiling) while a
          first-time occupant of the same section in the same event is charged
          the full 400,000-cent market rate.
        test_recipe:
          setup:
            - "Section SEC-B created in 2020 at 250,000 cents per seat with required_points_per_seat 0 and three seats."
            - "Donor Dana (created first) occupies seat B/1 through the 2020 season-ticket event and reaches occupancy ASSIGNED with the seat paid in full, so first_occupied_cycle_year is 2020."
            - "Donor Blake has never occupied a seat in SEC-B."
            - "Section repriced to 400,000 cents for cycle 2026; the 2026 recalculation is CERTIFIED and its SEASON_TICKET event is OPEN with slot 0 for Dana and slot 1 for Blake."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2020-05-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-B", venue_code: "STADIUM", seat_capacity: 3, per_seat_requirement_cents: 250000, required_points_per_seat: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sec_b_id: "$.data.id" }
            - call: "POST /athletics/sections/${sec_b_id}/seats"
              payload: { row_label: "B", seat_number: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { seat_b1_id: "$.data.id" }
            - call: "POST /athletics/sections/${sec_b_id}/seats"
              payload: { row_label: "B", seat_number: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { seat_b2_id: "$.data.id" }
            - call: "POST /athletics/sections/${sec_b_id}/seats"
              payload: { row_label: "B", seat_number: 3 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { seat_b3_id: "$.data.id" }
            - call: "POST /athletics/donors"
              payload: { full_name: "Dana Renewer", email: "dana.renewer@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { dana_id: "$.data.id" }
            - call: "POST /athletics/donors"
              payload: { full_name: "Blake Newcomer", email: "blake.newcomer@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { blake_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2020, cutoff_date: "2020-06-30T23:59:59.999Z", dispute_window_end: "2020-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { r2020_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${r2020_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${r2020_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-recalculations/${r2020_id}"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
              captures: { r2020_v: "$.data.version" }
            - call: "POST /athletics/point-recalculations/${r2020_id}/certify"
              payload: { expected_recalculation_version: "${r2020_v}" }
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "POST /athletics/point-recalculations/${r2020_id}/selection-events"
              payload: { event_type: "SEASON_TICKET", window_start: "2020-07-01T00:00:00.000Z", window_end: "2020-07-10T00:00:00.000Z", slot_minutes: 2880 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { e2020_id: "$.data.id" }
            - call: "POST /athletics/selection-events/${e2020_id}/publish-slots"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/selection-events/${e2020_id}/gate"
              payload: { to_status: "OPEN" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/selection-slots?selection_event_id=${e2020_id}&donor_id=${dana_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { slot2020_dana_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2020-07-01T12:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /athletics/seats/${seat_b1_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { seat_b1_v: "$.data.version" }
            - call: "POST /athletics/selection-slots/${slot2020_dana_id}/pick"
              payload: { seat_id: "${seat_b1_id}", expected_seat_version: "${seat_b1_v}" }
              as: Donor
              as_user_id: "${dana_id}"
              captures: { sa2020_id: "$.data.id" }
            - call: "POST /athletics/seat-assignments/${sa2020_id}/billing"
              payload: { to_status: "INVOICED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/seat-assignments/${sa2020_id}/billing"
              payload: { to_status: "PAID", amount_cents: 250000 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { sa2020_v: "$.data.version" }
            - call: "POST /athletics/seat-assignments/${sa2020_id}/occupancy"
              payload: { to_status: "ASSIGNED", expected_seat_assignment_version: "${sa2020_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/selection-events/${e2020_id}/gate"
              payload: { to_status: "CLOSED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /athletics/sections/${sec_b_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sec_b_v1: "$.data.version" }
            - call: "POST /athletics/sections/${sec_b_id}/reprice"
              payload: { per_seat_requirement_cents: 400000, cycle_year: 2026, expected_section_version: "${sec_b_v1}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { r2026_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${r2026_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${r2026_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-recalculations/${r2026_id}"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
              captures: { r2026_v: "$.data.version" }
            - call: "POST /athletics/point-recalculations/${r2026_id}/certify"
              payload: { expected_recalculation_version: "${r2026_v}" }
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "POST /athletics/point-recalculations/${r2026_id}/selection-events"
              payload: { event_type: "SEASON_TICKET", window_start: "2026-09-01T00:00:00.000Z", window_end: "2026-09-10T00:00:00.000Z", slot_minutes: 2880 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { e2026_id: "$.data.id" }
            - call: "POST /athletics/selection-events/${e2026_id}/publish-slots"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/selection-events/${e2026_id}/gate"
              payload: { to_status: "OPEN" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/selection-slots?selection_event_id=${e2026_id}&donor_id=${dana_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { slot2026_dana_id: "$.data[0].id" }
            - call: "GET /athletics/selection-slots?selection_event_id=${e2026_id}&donor_id=${blake_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { slot2026_blake_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /athletics/seats/${seat_b2_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { seat_b2_v: "$.data.version" }
          trigger:
            - call: "POST /athletics/selection-slots/${slot2026_dana_id}/pick"
              payload: { seat_id: "${seat_b2_id}", expected_seat_version: "${seat_b2_v}" }
              as: Donor
              as_user_id: "${dana_id}"
              captures: { sa_renewal_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T12:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /athletics/seats/${seat_b3_id}"
              payload: {}
              as: DevelopmentOfficer
