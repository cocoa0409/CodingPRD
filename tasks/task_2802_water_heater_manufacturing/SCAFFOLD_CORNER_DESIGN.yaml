      - name: rating_floor_check_ignores_fuel_and_capacity
        claim_type: correct_result
        grounds:
          - calculations.rating_floor_check
          - entities.EfficiencyTest.fields.effective_minimum
          - entities.EfficiencyTest.fields.margin
          - state_machines.EfficiencyTest.SCHEDULED_to_COMPLETED
        distinguishing_aspect: >
          FIRST_HOUR_RATING and RECOVERY use flat floors of 30.0 and 10.0 - the fuel table, the capacity tier,
          the sample derate and the R-value credit that dominate the UEF path must all be ignored. The two edges
          are walked at margin exactly 0.0000 (PASSED, because the test is >=) and at -0.1000 (FAILED), and a
          FAILED result must still complete the test rather than error.
        test_recipe:
          setup:
            - "Model GX50-T is a GAS 50-gallon model with insulation_r_value 20, i.e. the small tier with a credit."
            - "Test cell CELL-1 has 2 parallel slots and a 12-hour cooldown; the two windows are 12 hours apart."
            - "The logical clock is 2026-08-05T06:00:00Z, after both window ends."
            - "sample_size is 1 for both tests, which would carry a 0.02 derate on the UEF path."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }

            - call: "POST /mfg/test-cells"
              payload: { cell_code: "CELL-1", parallel_slots: 2, cooldown_hours: 12 }
              as: PlantAdmin
              captures: { cell1_id: $.data.id }

            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "FIRST_HOUR_RATING", sample_size: 1, window_start: "2026-08-04T06:00:00Z", window_end: "2026-08-04T10:00:00Z" }
              as: ComplianceEngineer
              captures: { f1_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "RECOVERY", sample_size: 1, window_start: "2026-08-04T22:00:00Z", window_end: "2026-08-05T02:00:00Z" }
              as: ComplianceEngineer
              captures: { r1_id: $.data.id }

            - call: "POST /mfg/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /mfg/efficiency-tests/${f1_id}/record-result"
              payload: { measured_value: 30.0 }
              as: QualityInspector
            - call: "POST /mfg/efficiency-tests/${r1_id}/record-result"
              payload: { measured_value: 9.9 }
              as: QualityInspector
          assert:
            - "EfficiencyTest.${f1_id}: effective_minimum == 30.0000, margin == 0.0000 and status == PASSED"
            - "EfficiencyTest.${r1_id}: effective_minimum == 10.0000, margin == -0.1000 and status == FAILED"
            - "neither effective_minimum was shifted by the sample_size 1 derate of 0.02 or by the R-20 insulation credit"
            - "both record-result calls returned 200; the FAILED verdict is a normal outcome, not an error"
            - "ProductModel.${m1_id}.fhr_rated == null and recovery_rate_rated == null (only certification approval publishes ratings)"
