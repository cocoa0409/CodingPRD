# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections. Same 7-point contract
# and §1.5 reachability gates as §1.8. excluded_because stubs cite §1.8 instances.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts/register with required fields returns 201, kyc_status==PENDING_KYC, billing_status==TRIAL, cash_balance_cents==0, version==1."
        test_recipe:
          setup: ["A subscription plan and a model portfolio exist."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "LITE", monthly_fee_cents: 300, allows_custodial: false, allows_ira: false, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 2, name: "Cautious", target_allocation: { EQUITY: 40, BOND: 60 }, drift_band_bps: 400 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /accounts/register"
              payload: { email: "new@x.com", full_name: "New User", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id, kyc: $.data.kyc_status, bill: $.data.billing_status }
          assert:
            - "Response is 201"
            - "Account.${acc_id}.kyc_status == PENDING_KYC"
            - "Account.${acc_id}.billing_status == TRIAL"
            - "Account.${acc_id}.cash_balance_cents == 0 and version == 1"
            - "Account.${acc_id}.sweep_threshold_cents == 500 (default)"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["No account with the queried id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response is 404 with error_id == ERR_NOT_FOUND"

      - name: register_missing_plan_id_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Account.fields.plan_id, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts/register without plan_id returns 400 ERR_INVALID_REQUEST (required input field absent)."
        test_recipe:
          setup: ["A model portfolio exists; plan_id omitted from the body."]
          setup_api_calls:
            - call: "POST /model-portfolios"
              payload: { risk_tier: 1, name: "Safe", target_allocation: { BOND: 100 }, drift_band_bps: 300 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /accounts/register"
              payload: { email: "noplan@x.com", full_name: "No Plan", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Response is 400 with error_id == ERR_INVALID_REQUEST"

      - name: account_computed_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.Account.fields.cash_balance_cents, entities.Account.fields.kyc_status]
        distinguishing_aspect: "Client-supplied kyc_status/cash_balance_cents on register are ignored; server forces PENDING_KYC and 0."
        test_recipe:
          setup: ["Plan and portfolio exist."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /accounts/register"
              payload: { email: "sys@x.com", full_name: "Sys Field", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}", kyc_status: "VERIFIED", cash_balance_cents: 99999 }
              as: Anonymous
              captures: { acc_id: $.data.id, kyc: $.data.kyc_status, cash: $.data.cash_balance_cents }
          assert:
            - "Account.${acc_id}.kyc_status == PENDING_KYC (client VERIFIED ignored)"
            - "Account.${acc_id}.cash_balance_cents == 0 (client 99999 ignored)"

      - name: model_portfolio_allocation_sum_not_100_rejected
        claim_type: Type Constraints
        grounds: [entities.ModelPortfolio.fields.target_allocation, "validations[priority=20]", "errors[ERR_ALLOCATION_SUM]"]
        distinguishing_aspect: "POST /model-portfolios with target_allocation summing to 90 (not 100) returns 400 ERR_ALLOCATION_SUM."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /model-portfolios"
              payload: { risk_tier: 4, name: "Bad", target_allocation: { EQUITY: 50, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response is 400 with error_id == ERR_ALLOCATION_SUM"

      - name: linked_card_invalid_multiplier_rejected
        claim_type: Type Constraints
        grounds: [entities.LinkedCard.fields.roundup_multiplier, "validations[priority=19]", "errors[ERR_INVALID_MULTIPLIER]"]
        distinguishing_aspect: "POST /linked-cards with roundup_multiplier 5 (not in {1,2,3,10}) returns 400 ERR_INVALID_MULTIPLIER."
        test_recipe:
          setup: ["Verified account exists."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "card@x.com", full_name: "Ca Rd", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /linked-cards"
              payload: { account_id: "${acc_id}", last_four: "9999", roundup_multiplier: 5 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 400 with error_id == ERR_INVALID_MULTIPLIER"

      - name: list_accounts_pagination_invalid_limit_rejected
        claim_type: Listing
        grounds: [endpoints, "validations[priority=6]", "errors[ERR_INVALID_PAGINATION]"]
        distinguishing_aspect: "GET /accounts?limit=0 returns 400 ERR_INVALID_PAGINATION (limit below min 1)."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts?limit=0"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response is 400 with error_id == ERR_INVALID_PAGINATION"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_accrual_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.RoundUpAccrual.PENDING_to_CANCELLED, "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a RoundUpAccrual already in CANCELLED returns 409 ERR_INVALID_STATE; no further side effects."
        test_recipe:
          setup: ["Account with a card and one accrual already CANCELLED."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "ac@x.com", full_name: "Ac Crual", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /linked-cards"
              payload: { account_id: "${acc_id}", last_four: "1212", roundup_multiplier: 1 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { card_id: $.data.id }
            - call: "POST /roundup-accruals"
              payload: { account_id: "${acc_id}", linked_card_id: "${card_id}", purchase_amount_cents: 150 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { acr_id: $.data.id }
            - call: "POST /roundup-accruals/${acr_id}/cancel"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
          trigger:
            - call: "POST /roundup-accruals/${acr_id}/cancel"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with error_id == ERR_INVALID_STATE"
            - "RoundUpAccrual.${acr_id}.status remains CANCELLED"

      - name: settle_draft_order_without_submit_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.SUBMITTED_to_SETTLED, "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling a DRAFT order (never submitted) returns 409 ERR_INVALID_STATE; settle requires SUBMITTED."
        test_recipe:
          setup: ["Verified account, OPEN bucket, DRAFT INVEST order not submitted."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "ds@x.com", full_name: "Dr Aft", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /buckets"
              payload: { account_id: "${acc_id}", bucket_type: "TAXABLE" }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acc_id}", bucket_id: "${bkt_id}", order_kind: "INVEST", source: "MANUAL", requested_amount_cents: 100 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with error_id == ERR_INVALID_STATE"
            - "Order.${o_id}.status remains DRAFT"

      - name: terminal_referral_revoked_cannot_redeem
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Referral.ISSUED_to_REVOKED, "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REVOKED referral (terminal) cannot be redeemed; redeem returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Referrer issues a referral then revokes it (terminal REVOKED)."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "rv@x.com", full_name: "Re V", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "rvb@x.com", full_name: "Rv B", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_account_id: "${r_id}", code: "REVOK1", bonus_cents: 1000 }
              as: Investor
              as_user_id: "${r_id}"
              captures: { rf_id: $.data.id }
            - call: "POST /referrals/${rf_id}/revoke"
              payload: {}
              as: Investor
              as_user_id: "${r_id}"
          trigger:
            - call: "POST /referrals/${rf_id}/redeem"
              payload: { referred_account_id: "${b_id}" }
              as: Investor
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with error_id == ERR_INVALID_STATE"
            - "Referral.${rf_id}.status remains REVOKED"

      - name: bucket_close_with_open_lot_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Bucket.OPEN_to_CLOSED, "validations[priority=22]", "errors[ERR_BUCKET_NOT_EMPTY]"]
        distinguishing_aspect: "Closing a bucket that holds an OPEN TaxLot returns 409 ERR_BUCKET_NOT_EMPTY."
        test_recipe:
          setup: ["Verified account, mgmt 0bps, cash 5000 (found-money), TAXABLE bucket with one settled INVEST -> one OPEN lot."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /found-money-offers"
              payload: { brand_name: "Seed", rebate_mode: "FLAT", rebate_flat_cents: 5000, max_rebate_cents: 5000, min_spend_cents: 0, hold_days: 0, active_from: "2026-01-01T00:00:00Z", active_until: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "bc@x.com", full_name: "Bc Lose", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}", sweep_threshold_cents: 100000 }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /found-money-rewards"
              payload: { account_id: "${acc_id}", offer_id: "${offer_id}", qualifying_spend_cents: 5000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { rew_id: $.data.id }
            - call: "POST /found-money-rewards/${rew_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /buckets"
              payload: { account_id: "${acc_id}", bucket_type: "TAXABLE" }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acc_id}", bucket_id: "${bkt_id}", order_kind: "INVEST", source: "MANUAL", requested_amount_cents: 5000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { o_id: $.data.id }
            - call: "GET /buckets/${bkt_id}"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_v: $.data.version }
            - call: "POST /orders/${o_id}/submit"
              payload: { expected_bucket_version: "${bkt_v}" }
              as: Investor
              as_user_id: "${acc_id}"
            - call: "POST /orders/${o_id}/settle"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /buckets/${bkt_id}/close"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with error_id == ERR_BUCKET_NOT_EMPTY"
            - "Bucket.${bkt_id}.status remains OPEN"

      - name: parallel_dims_billing_advances_without_kyc
        claim_type: parallel
        grounds: [state_machines.Account.TRIAL_to_ACTIVE, state_machines.Account.PENDING_KYC_to_VERIFIED]
        distinguishing_aspect: "Account billing_status can advance TRIAL->ACTIVE via charge-subscription while kyc_status stays PENDING_KYC — the two state dimensions evolve independently."
        test_recipe:
          setup: ["A freshly registered account in PENDING_KYC/TRIAL with cash_balance_cents 0; the subscription charge runs regardless of KYC and debits the prorated fee floored at 0."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "par@x.com", full_name: "Pa Rallel", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_id}/billing/charge-subscription"
              payload: {}
              as: PlatformAdmin
              captures: { bill: $.data.billing_status, kyc: $.data.kyc_status }
          assert:
            - "Account.${acc_id}.billing_status == ACTIVE (billing dimension advanced)"
            - "Account.${acc_id}.kyc_status == PENDING_KYC (kyc dimension unaffected)"
            - "Account.${acc_id}.months_billed == 1"

  # ===========================================================================
  - section: calculations
    instances:
      - name: whole_dollar_purchase_zero_roundup
        claim_type: Correct Result
        grounds: [calculations.roundup_effective_amount, entities.RoundUpAccrual.fields.effective_amount_cents]
        distinguishing_aspect: "A whole-dollar purchase (2000 cents) on a x10 card yields base_roundup_cents==0 and effective_amount_cents==0."
        test_recipe:
          setup: ["Verified account with a x10 card."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "wd@x.com", full_name: "Wh Dollar", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /linked-cards"
              payload: { account_id: "${acc_id}", last_four: "1010", roundup_multiplier: 10 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { card_id: $.data.id }
          trigger:
            - call: "POST /roundup-accruals"
              payload: { account_id: "${acc_id}", linked_card_id: "${card_id}", purchase_amount_cents: 2000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { acr_id: $.data.id, eff: $.data.effective_amount_cents }
          assert:
            - "RoundUpAccrual.${acr_id}.base_roundup_cents == 0"
            - "RoundUpAccrual.${acr_id}.effective_amount_cents == 0"
            - "Account.${acc_id}.pending_roundup_cents == 0"

      - name: found_money_percent_cap_binds
        claim_type: Constants Applied
        grounds: [calculations.found_money_rebate, entities.FoundMoneyReward.fields.rebate_amount_cents]
        distinguishing_aspect: "PERCENT offer 500bps cap 1000 on spend 50000 yields raw floor(2500) clamped to max_rebate_cents 1000."
        test_recipe:
          setup: ["Verified account; PERCENT offer 500bps cap 1000 min_spend 0."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /found-money-offers"
              payload: { brand_name: "CapBrand", rebate_mode: "PERCENT", rebate_percent_bps: 500, max_rebate_cents: 1000, min_spend_cents: 0, hold_days: 0, active_from: "2026-01-01T00:00:00Z", active_until: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "cap@x.com", full_name: "Ca Pp", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /found-money-rewards"
              payload: { account_id: "${acc_id}", offer_id: "${offer_id}", qualifying_spend_cents: 50000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { rew_id: $.data.id, reb: $.data.rebate_amount_cents }
          assert:
            - "FoundMoneyReward.${rew_id}.rebate_amount_cents == 1000 (cap binds; raw 2500 clamped)"

      - name: min_spend_not_met_rejects_reward
        claim_type: Input Set Filtering
        grounds: [calculations.found_money_rebate, "validations[priority=15]", "errors[ERR_MIN_SPEND_NOT_MET]"]
        distinguishing_aspect: "FLAT offer min_spend 1000 on spend 999 returns 409 ERR_MIN_SPEND_NOT_MET; no reward created."
        test_recipe:
          setup: ["Verified account; FLAT offer 250 min_spend 1000."]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /found-money-offers"
