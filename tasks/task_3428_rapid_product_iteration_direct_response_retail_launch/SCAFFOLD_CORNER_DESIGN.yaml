  # ===========================================================================
  - section: rbac
    instances:

      - name: product_lead_cannot_sign_agreement
        claim_type: Violation → Error
        grounds:
          - roles[ProductLead]
          - "endpoints.POST_/retail-agreements/{id}/sign"
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Sign is RetailExec-exclusive; ProductLead with a valid DRAFT agreement id fails 403 ERR_FORBIDDEN (existence would pass — authorization fires first)."
        test_recipe:
          setup: ["Season OPEN; category; DRAFT agreement exists."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - call: "POST /retail-agreements"
              payload: { category_id: "${cat_id}", retailer_name: "BigBoxCo", exclusive: false, window_start: "2026-10-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", min_launch_units: 100 }
              as: RetailExec
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /retail-agreements/${agr_id}/sign"
              payload: {}
              as: ProductLead
              captures: { err: $.data.error_id }
          assert:
            - "response status is 403 and err == ERR_FORBIDDEN; the agreement remains DRAFT"

      - name: retail_exec_cannot_record_judgment
        claim_type: Violation → Error
        grounds:
          - roles[RetailExec]
          - "endpoints.POST_/patent-cases/{id}/record-judgment"
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Record-judgment is LegalCounsel-exclusive; RetailExec fails 403 even with an ACTIVE case id."
        test_recipe:
          setup: ["Case PT-5001 ACTIVE (filed, then reviewed)."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - call: "POST /patent-cases"
              payload: { category_id: "${cat_id}", case_number: "PT-5001", claim_cents: 1000000, severity: "MED" }
              as: LegalCounsel
              as_user_id: "lc-jane"
              captures: { case_id: $.data.id }
            - *c_review
          trigger:
            - call: "POST /patent-cases/${case_id}/record-judgment"
              payload: { outcome: "ADVERSE", award_cents: 900000 }
              as: RetailExec
              captures: { err: $.data.error_id }
          assert:
            - "response status is 403 and err == ERR_FORBIDDEN; the case remains ACTIVE"

      - name: claims_scientist_cannot_decide_media
        claim_type: Violation → Error
        grounds:
          - roles[ClaimsScientist]
          - "endpoints.POST_/media-tests/{id}/decide"
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Decide is MediaBuyer-exclusive; the scientist who substantiated the claim cannot also call the media outcome — 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Media test AIRING (study substantiated per SoD by sci-bob)."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
            - *c_partner
            - *c_variant
            - *c_tool
            - *c_study
            - *c_complete
            - *c_substantiate
            - *c_media
            - *c_air
          trigger:
            - call: "POST /media-tests/${media_id}/decide"
              payload:
                decision: "KILL"
                order_lines: [ { revenue_cents: 100, cancels_cents: 0, returns_cents: 0 } ]
              as: ClaimsScientist
              as_user_id: "sci-anna"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 403 and err == ERR_FORBIDDEN; the test remains AIRING"

      - name: sod_substantiate_by_conducting_scientist_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - state_machines.ClaimStudy.RESULTS_RECORDED_to_SUBSTANTIATED
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The ClaimsScientist whose X-User-ID matches conducted_by_user_id cannot substantiate their own study — 403 ERR_SEGREGATION_OF_DUTIES — while a different scientist succeeds with the identical payload."
        test_recipe:
          setup: ["Study RESULTS_RECORDED (margin 0.15), conducted by sci-anna."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
            - *c_partner
            - *c_variant
            - *c_tool
            - *c_study
            - *c_complete
          trigger:
            - call: "POST /claim-studies/${study_id}/substantiate"
              payload: {}
              as: ClaimsScientist
              as_user_id: "sci-anna"
              captures: { err: $.data.error_id }
            - *c_substantiate
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (same user as conducted_by_user_id)"
            - "the second call by sci-bob returns 200 with status SUBSTANTIATED"

      - name: sod_settle_by_filing_counsel_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - state_machines.PatentCase
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The LegalCounsel whose X-User-ID matches filed_by_user_id cannot settle their own case — 403 ERR_SEGREGATION_OF_DUTIES — while a different counsel settles with the identical payload."
        test_recipe:
          setup: ["Case PT-5001 FILED by lc-jane."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - call: "POST /patent-cases"
              payload: { category_id: "${cat_id}", case_number: "PT-5001", claim_cents: 1000000, severity: "MED" }
              as: LegalCounsel
              as_user_id: "lc-jane"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /patent-cases/${case_id}/settle"
              payload: { settlement_cents: 100000 }
              as: LegalCounsel
              as_user_id: "lc-jane"
              captures: { err: $.data.error_id }
            - call: "POST /patent-cases/${case_id}/settle"
              payload: { settlement_cents: 100000 }
              as: LegalCounsel
              as_user_id: "lc-john"
              captures: { st: $.data.status }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (filer cannot settle)"
            - "st == SETTLED after the second counsel's identical call"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_variant_version_rejected_on_replenish
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[replenish-create-stale-variant]
          - errors[ERR_STALE_VARIANT_VERSION]
        distinguishing_aspect: "The client reads variant version N, creates replenishment R1 (version advances), and a second create still carrying N fails 412 ERR_STALE_VARIANT_VERSION — two strictly sequential requests, no parallelism; R1 is left OPEN and un-superseded because the stale write never ran."
        test_recipe:
          setup: ["Variant RETAIL_LIVE via the fulfilled-commitment path; variant version captured as v_live."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
            - *c_partner
            - *c_variant
            - *c_tool
            - *c_study
            - *c_complete
            - *c_substantiate
            - *c_media
            - *c_air
            - *c_decide_scale
            - *c_agr
            - *c_sign
            - *c_commit
            - *c_clock1016
            - *c_review
            - call: "GET /model-variants/${variant_id}"
              payload: {}
              as: RetailExec
              captures: { v_live: $.data.version }
          trigger:
            - call: "POST /replenishment-orders"
              payload: { variant_id: "${variant_id}", weekly_velocity: 120, on_hand_units: 100, in_transit_units: 60, case_pack_units: 24, expected_variant_version: "${v_live}" }
              as: RetailExec
              captures: { r1_id: $.data.id }
            - call: "POST /replenishment-orders"
              payload: { variant_id: "${variant_id}", weekly_velocity: 100, on_hand_units: 50, in_transit_units: 10, case_pack_units: 24, expected_variant_version: "${v_live}" }
              as: RetailExec
              captures: { err: $.data.error_id }
            - call: "GET /model-variants/${variant_id}/replenishments"
              payload: {}
              as: RetailExec
              captures: { r1_status: "$.data[0].status" }
          assert:
            - "the first create returned 201 (fresh version accepted)"
            - "err == ERR_STALE_VARIANT_VERSION with HTTP 412 (the second create carries the now-stale ${v_live})"
            - "r1_status == OPEN (the rejected stale write did not supersede it)"

      - name: occ_stale_agreement_version_rejected_on_commitment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[commitment-create-stale-agreement]
          - errors[ERR_STALE_AGREEMENT_VERSION]
        distinguishing_aspect: "Two sequential commitment creates against one SIGNED agreement: the first (carrying the version captured at sign) succeeds and advances RetailAgreement.version; the second carrying the same captured version fails 412 ERR_STALE_AGREEMENT_VERSION."
        test_recipe:
          setup: ["Variant DR_TESTING with DECIDED_SCALE media; agreement SIGNED, version captured as agr_v; partner capacity 500 free."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
            - *c_partner
            - *c_variant
            - *c_tool
            - *c_study
            - *c_complete
            - *c_substantiate
            - *c_media
            - *c_air
            - *c_decide_scale
            - *c_agr
            - *c_sign
          trigger:
            - call: "POST /launch-commitments"
              payload: { agreement_id: "${agr_id}", variant_id: "${variant_id}", committed_units: 100, need_by_date: "2026-10-15T00:00:00Z", expected_agreement_version: "${agr_v}" }
              as: SourcingManager
              captures: { c1_id: $.data.id }
            - call: "POST /launch-commitments"
              payload: { agreement_id: "${agr_id}", variant_id: "${variant_id}", committed_units: 50, need_by_date: "2026-10-20T00:00:00Z", expected_agreement_version: "${agr_v}" }
              as: SourcingManager
              captures: { err: $.data.error_id }
          assert:
            - "the first commitment returned 201"
            - "err == ERR_STALE_AGREEMENT_VERSION with HTTP 412 (the create bumped the agreement's version past the captured one)"

      - name: run_review_advances_index_and_repeat_review_is_inert
        claim_type: ops_run_checkpoint
        grounds:
          - state_machines.LaunchSeason.run_review
          - entities.LaunchSeason.fields.review_index
        distinguishing_aspect: "Each run-review increments review_index by exactly 1 and stamps last_review_at from the logical clock; a second review at the same clock position fires no transitions twice (the activated case stays ACTIVE, nothing else changes)."
        test_recipe:
          setup: ["Season with one FILED case; review_index 0."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - call: "POST /patent-cases"
              payload: { category_id: "${cat_id}", case_number: "PT-5001", claim_cents: 1000000, severity: "MED" }
              as: LegalCounsel
              as_user_id: "lc-jane"
              captures: { case_id: $.data.id }
          trigger:
            - *c_review
            - call: "GET /launch-seasons/${season_id}"
              payload: {}
              as: PlatformAdmin
              captures: { idx1: $.data.review_index, ts1: $.data.last_review_at }
            - *c_review
            - call: "GET /launch-seasons/${season_id}"
              payload: {}
              as: PlatformAdmin
              captures: { idx2: $.data.review_index }
            - call: "GET /categories/${cat_id}/patent-cases"
              payload: {}
              as: LegalCounsel
              captures: { case_status: "$.data[0].status" }
          assert:
            - "idx1 == 1 and ts1 == '2026-09-01T00:00:00Z' and idx2 == 2"
            - "case_status == ACTIVE after both reviews (step 1 fired once; the repeat review changed no entity state)"

      - name: transitive_cascade_coverage_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.LaunchSeason.run_review
        excluded_because:
          difficulty_instance: adverse_judgment_cascades_case_to_category_to_season_posture
          rationale: "Both cascade chains (judgment-driven and review-driven) are asserted hop-by-hop in the two transitive_cascade difficulty instances."

      - name: dual_variant_coverage_stub
        claim_type: dual_variant_calculation
        grounds:
          - calculations.media_efficiency_ratio
          - calculations.litigation_reserve
        excluded_because:
          difficulty_instance: litigation_reserve_provisional_vs_final
          rationale: "Both dual-variant pairs (media MER, litigation reserve) are asserted with literal expected values in the dual_variant_calc difficulty instances."

