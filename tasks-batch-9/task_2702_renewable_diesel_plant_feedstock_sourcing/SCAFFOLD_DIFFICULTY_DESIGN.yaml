      - name: hedge_tier_boundary_at_exactly_fifty_thousand_base_margin
        grounds:
          - calculations.hedge_margin_requirement
          - entities.HedgePosition.fields.volatility_tier
          - entities.HedgePosition.fields.total_margin_usd
        distinguishing_aspect: |
          The T2 floor is tested with >= on the cent-rounded base margin: 62500 units at 10.00 produce a base
          margin of exactly 50000.00 and land in T2 at a 1250.00 adder, while one unit fewer produces 49999.20
          and stays in T1 at a 499.99 adder. A single notional unit swings the total margin by 750.81 because
          the adder percentage, not the notional, is what changes.
        test_recipe:
          setup:
            - "No prior state is required; the clock stays at the 2026-08-01T00:00:00Z default so the 2026-12-31 maturity is in the future."
          setup_api_calls: []
          trigger:
            - call: "POST /hedge-positions"
              payload: { instrument: "FEEDSTOCK_SWAP", notional_units: 62500, strike_price_usd: 10.00, maturity_at: "2026-12-31T00:00:00Z" }
              as: FeedstockTrader
              captures: { pos_at_id: $.data.id }
            - call: "POST /hedge-positions"
              payload: { instrument: "FEEDSTOCK_SWAP", notional_units: 62499, strike_price_usd: 10.00, maturity_at: "2026-12-31T00:00:00Z" }
              as: FeedstockTrader
              captures: { pos_below_id: $.data.id }
          assert:
            - "Both trigger calls: response.status == 201"
            - "HedgePosition.${pos_at_id}.gross_notional_usd == 625000.00"
            - "HedgePosition.${pos_at_id}.base_margin_usd == 50000.00"
            - "HedgePosition.${pos_at_id}.volatility_tier == T2"
            - "HedgePosition.${pos_at_id}.volatility_adder_usd == 1250.00"
            - "HedgePosition.${pos_at_id}.total_margin_usd == 51250.00"
            - "HedgePosition.${pos_below_id}.gross_notional_usd == 624990.00"
            - "HedgePosition.${pos_below_id}.base_margin_usd == 49999.20"
            - "HedgePosition.${pos_below_id}.volatility_tier == T1"
            - "HedgePosition.${pos_below_id}.volatility_adder_usd == 499.99"
            - "HedgePosition.${pos_below_id}.total_margin_usd == 50499.19"

