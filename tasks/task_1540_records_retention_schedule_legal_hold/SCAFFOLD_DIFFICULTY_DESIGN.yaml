# =============================================================================
# §1.8 Scaffold Difficulty Design — Records Retention Schedule & Legal Hold
# 2 instances per Difficulty Rule (18 total). Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and carries an executable structured test_recipe.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: retention_due_date_event_vs_fiscal_basis
        grounds:
          - calculations.retention_due_date
          - entities.Record.fields.retention_due_date
          - entities.RetentionRule.fields.trigger_basis
        distinguishing_aspect: |
          Same event_date (2026-03-15) and same retention length (12 months) produce
          different due dates on the Record domain because one governing rule anchors
          on the raw event (due 2027-03-15) while the other anchors on the first
          program fiscal-year-end on or after the event (2026-06-30 -> due 2027-06-30).
        test_recipe:
          setup:
            - "Program with fiscal_year_end = June 30; two record classes; one jurisdiction"
            - "Rule R-EV (EVENT_DATE, 12 months, effective 2020-01-01 open-ended) ACTIVE on class CL_EVT"
            - "Rule R-FY (FISCAL_YEAR_END, 12 months, same window) ACTIVE on class CL_FY"
            - "Record X in CL_EVT with event_date 2026-03-15; Record Y in CL_FY with event_date 2026-03-15"
            - "Logical clock never set: reads at the startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "Variant Program", fiscal_year_end_month: 6, fiscal_year_end_day: 30 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "CL_EVT", name: "Event Based", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl_ev: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "CL_FY", name: "Fiscal Based", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl_fy: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl_ev}", jurisdiction_id: "${jur}", rule_code: "R-EV", retention_months: 12, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { r_ev: "$.data.id" }
            - call: "POST /ig/retention-rules/${r_ev}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl_fy}", jurisdiction_id: "${jur}", rule_code: "R-FY", retention_months: 12, trigger_basis: "FISCAL_YEAR_END", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { r_fy: "$.data.id" }
            - call: "POST /ig/retention-rules/${r_fy}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl_ev}", jurisdiction_id: "${jur}", title: "Rec X", source_system: "ERP", event_date: "2026-03-15T00:00:00Z", size_gb: 2 }
              as: RecordsManager
              captures: { rx: "$.data.id" }
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl_fy}", jurisdiction_id: "${jur}", title: "Rec Y", source_system: "ERP", event_date: "2026-03-15T00:00:00Z", size_gb: 2 }
              as: RecordsManager
              captures: { ry: "$.data.id" }
          trigger:
            - call: "GET /ig/records/${rx}"
              payload: {}
              as: RecordsManager
            - call: "GET /ig/records/${ry}"
              payload: {}
              as: RecordsManager
          assert:
            - "Record.${rx}.retention_due_date == 2027-03-15T00:00:00Z (raw event + 12 months)"
            - "Record.${ry}.retention_due_date == 2027-06-30T00:00:00Z (anchor FYE 2026-06-30 + 12 months)"
            - "Record.${rx}.retention_due_date != Record.${ry}.retention_due_date despite identical event_date and retention_months"
            - "Both records have disposition_posture == RETAINED at the default clock 2026-08-01T00:00:00Z"

      - name: ack_sla_strict_vs_reminder_adjusted
        grounds:
          - calculations.ack_sla_evaluation
          - entities.HoldCustodian.fields.was_late
          - entities.GovernanceProgram.fields.ack_sla_mode
        distinguishing_aspect: |
          Identical timestamps (issue 2026-08-01, due 2026-08-15, one reminder sent
          2026-08-16, ack 2026-08-21) yield was_late = true under STRICT on program A
          but was_late = false under REMINDER_ADJUSTED on program B (effective due
          2026-08-22) — two variants over the HoldCustodian domain, distinct from the
          Record-domain retention variants.
        test_recipe:
          setup:
            - "Program A ack_sla_mode STRICT; Program B ack_sla_mode REMINDER_ADJUSTED; both ack_deadline_days 14, reminder_interval_days 7, max_reminders_before_escalation 3"
            - "Each program: class, jurisdiction, ACTIVE rule (EVENT_DATE, 120 months), one record (event 2026-01-15, never due), one custodian, one hold covering them, issued at the default clock 2026-08-01T00:00:00Z (ack_due 2026-08-15)"
            - "Clock advanced to 2026-08-16; reminder sweep run in both programs (reminder_count = 1); clock advanced to 2026-08-21"
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "Strict SLA", fiscal_year_end_month: 12, fiscal_year_end_day: 31, ack_deadline_days: 14, reminder_interval_days: 7, max_reminders_before_escalation: 3, ack_sla_mode: "STRICT" }
              as: PlatformAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /ig/programs"
              payload: { name: "Adjusted SLA", fiscal_year_end_month: 12, fiscal_year_end_day: 31, ack_deadline_days: 14, reminder_interval_days: 7, max_reminders_before_escalation: 3, ack_sla_mode: "REMINDER_ADJUSTED" }
              as: PlatformAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${pa}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cla: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${pb}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { clb: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${pa}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jura: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${pb}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jurb: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${pa}", record_class_id: "${cla}", jurisdiction_id: "${jura}", rule_code: "R-120", retention_months: 120, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rulea: "$.data.id" }
            - call: "POST /ig/retention-rules/${rulea}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${pb}", record_class_id: "${clb}", jurisdiction_id: "${jurb}", rule_code: "R-120", retention_months: 120, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { ruleb: "$.data.id" }
            - call: "POST /ig/retention-rules/${ruleb}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${pa}", record_class_id: "${cla}", jurisdiction_id: "${jura}", title: "Rec A", source_system: "MAIL", event_date: "2026-01-15T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { reca: "$.data.id" }
            - call: "POST /ig/records"
              payload: { program_id: "${pb}", record_class_id: "${clb}", jurisdiction_id: "${jurb}", title: "Rec B", source_system: "MAIL", event_date: "2026-01-15T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { recb: "$.data.id" }
            - call: "POST /ig/custodians"
              payload: { program_id: "${pa}", email: "custa@x.com", full_name: "Cust A", department: "Legal" }
              as: RecordsManager
              captures: { custa: "$.data.id" }
            - call: "POST /ig/custodians"
              payload: { program_id: "${pb}", email: "custb@x.com", full_name: "Cust B", department: "Legal" }
              as: RecordsManager
              captures: { custb: "$.data.id" }
            - call: "POST /ig/legal-holds"
              payload: { program_id: "${pa}", matter_ref: "M-A", title: "Hold A", reason: "Litigation", custodian_ids: ["${custa}"], record_ids: ["${reca}"] }
              as: LegalCounsel
              captures: { holda: "$.data.id" }
            - call: "POST /ig/legal-holds"
              payload: { program_id: "${pb}", matter_ref: "M-B", title: "Hold B", reason: "Litigation", custodian_ids: ["${custb}"], record_ids: ["${recb}"] }
              as: LegalCounsel
              captures: { holdb: "$.data.id" }
            - call: "POST /ig/legal-holds/${holda}/issue"
              payload: {}
              as: LegalCounsel
            - call: "POST /ig/legal-holds/${holdb}/issue"
              payload: {}
              as: LegalCounsel
            - call: "GET /ig/hold-custodians?hold_id=${holda}"
              payload: {}
              as: LegalCounsel
              captures: { asgna: "$.data[0].id" }
            - call: "GET /ig/hold-custodians?hold_id=${holdb}"
              payload: {}
              as: LegalCounsel
              captures: { asgnb: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ig/sweeps/reminders"
              payload: { program_id: "${pa}" }
              as: RecordsManager
              captures: { rem_a: "$.data.reminders_sent" }
            - call: "POST /ig/sweeps/reminders"
              payload: { program_id: "${pb}" }
              as: RecordsManager
              captures: { rem_b: "$.data.reminders_sent" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ig/hold-custodians/${asgna}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${custa}"
              captures: { late_a: "$.data.was_late" }
            - call: "POST /ig/hold-custodians/${asgnb}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${custb}"
              captures: { late_b: "$.data.was_late" }
            - call: "GET /ig/legal-holds/${holda}"
              payload: {}
              as: LegalCounsel
              captures: { latect_a: "$.data.late_ack_count" }
            - call: "GET /ig/legal-holds/${holdb}"
              payload: {}
              as: LegalCounsel
              captures: { latect_b: "$.data.late_ack_count" }
          assert:
            - "HoldCustodian.${asgna}.was_late == true (STRICT: 2026-08-21 > 2026-08-15)"
            - "HoldCustodian.${asgnb}.was_late == false (REMINDER_ADJUSTED: effective due 2026-08-15 + 1*7d = 2026-08-22; 2026-08-21 not > 2026-08-22)"
            - "LegalHold.${holda}.late_ack_count == 1"
            - "LegalHold.${holdb}.late_ack_count == 0"
            - "Sweep at 2026-08-16 sent exactly 1 reminder per program (rem_a == 1, rem_b == 1)"

  - rule_id: combinatorial_formula
    instances:
      - name: conflict_tiebreak_newer_rule_wins
        grounds:
          - calculations.governing_rule_selection
          - state_machines.RetentionConflict.OPEN_to_RESOLVED
          - entities.RetentionRule.fields.rule_code
        distinguishing_aspect: |
          Mode (a) combinatorial: the winner formula consumes >= 3 inputs
          (retention_months, created_at, rule_code) with a conditional branch on
          strategy. Here retention_months ties at 84 and the challenger was created
          one clock-day later, so created_at DESC picks the challenger even though
          its rule_code R-ZZZ would lose the final lexicographic tie-break.
        test_recipe:
          setup:
            - "Program, class CL, jurisdiction J"
            - "Rule INC: rule_code R-AAA, retention_months 84, EVENT_DATE, effective 2020-01-01 open-ended, created at default clock 2026-08-01, ACTIVE"
            - "Clock advanced to 2026-08-02; rule CH: rule_code R-ZZZ, retention_months 84, same window; activation attempt -> PENDING_CONFLICT with OPEN conflict naming INC as incumbent"
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "Tiebreak Program", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "CL", name: "Class", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "EU", name: "European Union" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-AAA", retention_months: 84, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { inc: "$.data.id" }
            - call: "POST /ig/retention-rules/${inc}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-ZZZ", retention_months: 84, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { ch: "$.data.id" }
            - call: "POST /ig/retention-rules/${ch}/activate"
              payload: {}
              as: RecordsManager
              captures: { ch_status: "$.data.status" }
            - call: "GET /ig/retention-conflicts?challenger_rule_id=${ch}&status=OPEN"
              payload: {}
              as: RecordsManager
              captures: { conf: "$.data[0].id" }
          trigger:
            - call: "POST /ig/retention-conflicts/${conf}/resolve"
              payload: { strategy: "APPLY_LONGEST" }
              as: RecordsManager
              captures: { winner: "$.data.governing_rule_id" }
            - call: "GET /ig/retention-rules/${inc}"
              payload: {}
              as: RecordsManager
              captures: { inc_status: "$.data.status" }
          assert:
            - "RetentionConflict.${conf}.governing_rule_id == ${ch} (tie on retention_months 84 broken by created_at DESC: challenger created 2026-08-02 > incumbent 2026-08-01)"
            - "RetentionRule.${ch}.status == ACTIVE"
            - "RetentionRule.${inc}.status == SUPERSEDED and superseded_by_id == ${ch}"
            - "The final rule_code ASC tie-break was NOT reached (R-ZZZ would have lost to R-AAA)"
            - "Challenger activation had returned status PENDING_CONFLICT (ch_status == PENDING_CONFLICT)"

      - name: over_preservation_cost_per_record_rounding
        grounds:
          - calculations.over_preservation_cost
          - entities.HoldAudit.fields.over_preservation_cost_cents
          - entities.RecordClass.fields.monthly_storage_cost_cents_per_gb
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-record-then-sum.
          Two records each cost round_half_up(1.1 GB * 12.5 cents/GB-month * 3 months)
          = round_half_up(41.25) = 41, so the audit total is 82; the forbidden
          sum-then-round order would produce round_half_up(82.5) = 83.
        test_recipe:
          setup:
            - "Program (over_preservation_warn_pct 20); class rate 12.5 cents/GB-month; jurisdiction; rule EVENT_DATE 3 months ACTIVE since 2020-01-01"
            - "Records R1, R2: size_gb 1.1, event_date 2026-04-01, auto_delete_enabled false -> due 2026-07-01"
            - "Clock at 2026-10-01T00:00:00Z: 92 days over -> months_over = floor(92/30) = 3"
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "Audit Program", fiscal_year_end_month: 12, fiscal_year_end_day: 31, over_preservation_warn_pct: 20 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "DOCS", name: "Documents", monthly_storage_cost_cents_per_gb: 12.5 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-CA", name: "California" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-3M", retention_months: 3, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "R1", source_system: "DMS", event_date: "2026-04-01T00:00:00Z", size_gb: 1.1, auto_delete_enabled: false }
              as: RecordsManager
              captures: { r1: "$.data.id" }
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "R2", source_system: "DMS", event_date: "2026-04-01T00:00:00Z", size_gb: 1.1, auto_delete_enabled: false }
              as: RecordsManager
              captures: { r2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ig/hold-audits"
              payload: { program_id: "${p}" }
              as: Auditor
              captures: { cost: "$.data.over_preservation_cost_cents", pct: "$.data.over_preservation_pct", over: "$.data.over_preserved_record_count", elig: "$.data.eligible_record_count", breached: "$.data.threshold_breached" }
          assert:
            - "HoldAudit.over_preservation_cost_cents == 82 (41 + 41 per-record rounding; sum-then-round would give 83)"
            - "HoldAudit.over_preserved_record_count == 2 (both ELIGIBLE with auto_delete_enabled false)"
            - "HoldAudit.eligible_record_count == 2"
            - "HoldAudit.over_preservation_pct == 100.0"
            - "HoldAudit.threshold_breached == true (100.0 >= 20)"

  - rule_id: non_linear_state_machine
    instances:
      - name: disposition_request_reject_revise_cycle
        grounds:
          - state_machines.DispositionRequest.REJECTED_to_DRAFT
          - state_machines.DispositionRequest.DRAFT_to_SUBMITTED
          - state_machines.DispositionRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          DispositionRequest is cyclic: DRAFT -> SUBMITTED -> REJECTED -> DRAFT ->
          SUBMITTED -> APPROVED. The loop back to DRAFT clears eligibility snapshots
          and resets stale_item_count, which a linear pipeline could not exercise.
        test_recipe:
          setup:
            - "Program; class; jurisdiction; rule EVENT_DATE 1 month ACTIVE since 2020-01-01"
            - "Record event 2026-06-01 -> due 2026-07-01, ELIGIBLE at the default clock 2026-08-01"
            - "Disposition request created by X-User-ID rm-1 (RecordsManager)"
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "Cycle Program", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-1M", retention_months: 1, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "Cyc Rec", source_system: "ERP", event_date: "2026-06-01T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { rec: "$.data.id" }
            - call: "POST /ig/disposition-requests"
              payload: { program_id: "${p}", record_ids: ["${rec}"], method: "SECURE_ERASE", justification: "Quarterly purge of eligible records" }
              as: RecordsManager
              as_user_id: "rm-1"
              captures: { req: "$.data.id" }
          trigger:
            - call: "POST /ig/disposition-requests/${req}/submit"
              payload: {}
              as: RecordsManager
              as_user_id: "rm-1"
              captures: { st1: "$.data.status" }
            - call: "POST /ig/disposition-requests/${req}/reject"
              payload: { rejection_reason: "Need counsel review first" }
              as: LegalCounsel
              as_user_id: "lc-9"
              captures: { st2: "$.data.status" }
            - call: "POST /ig/disposition-requests/${req}/revise"
              payload: {}
              as: RecordsManager
              as_user_id: "rm-1"
              captures: { st3: "$.data.status", stale3: "$.data.stale_item_count" }
            - call: "GET /ig/disposition-items?request_id=${req}"
              payload: {}
              as: RecordsManager
              captures: { snap3: "$.data[0].snapshot_posture" }
            - call: "POST /ig/disposition-requests/${req}/submit"
              payload: {}
              as: RecordsManager
              as_user_id: "rm-1"
              captures: { st4: "$.data.status" }
            - call: "POST /ig/disposition-requests/${req}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-1"
              captures: { st5: "$.data.status" }
          assert:
            - "st1 == SUBMITTED, st2 == REJECTED, st3 == DRAFT (cycle completed), st4 == SUBMITTED, st5 == APPROVED"
            - "After revise: DispositionItem.snapshot_posture == null (snapshots cleared) and stale_item_count == 0"
            - "Approve succeeded only because decided_by lc-1 != requester rm-1"

      - name: retention_rule_conflict_withdraw_cycle
        grounds:
          - state_machines.RetentionRule.PENDING_CONFLICT_to_DRAFT
          - state_machines.RetentionRule.DRAFT_to_PENDING_CONFLICT
          - state_machines.RetentionConflict.OPEN_to_WITHDRAWN
        distinguishing_aspect: |
          RetentionRule cycles DRAFT -> PENDING_CONFLICT -> DRAFT via withdraw (and
          the linked conflict goes OPEN -> WITHDRAWN), then re-enters PENDING_CONFLICT
          on the next activation attempt and finally reaches ACTIVE through
          resolution — a branching cycle, unlike the DispositionRequest reject loop.
