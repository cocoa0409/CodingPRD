            - "pallet_status == STRANDED (cascaded from item discontinue, not from a direct pallet call)"
            - "alloc_status == VOIDED with alloc_void_reason == ITEM_DISCONTINUED (cascaded from the pallet stranding)"
            - "club_slots == 0 and club_posture == NORMAL (third-order cascade effect of the void)"

