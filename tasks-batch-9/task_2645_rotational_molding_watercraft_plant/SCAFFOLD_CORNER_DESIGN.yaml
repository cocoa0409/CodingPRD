            - "quoted per-line: line 1 dim_weight = round(1.2345 * 120.000, 3) == 148.140, chargeable = max(30.000, 148.140) == 148.140, freight = round_half_up(148.140 * 61) == round_half_up(9036.54) == 9037; line 2 dim_weight = round(0.6173 * 120.000, 3) == 74.076, chargeable == 74.076, freight = round_half_up(74.076 * 61) == round_half_up(4518.636) == 4519"
            - "quoted_pre_discount_cents == 9037 + 4519 == 13556 and NOT 13555: summing the chargeable masses first, (148.140 + 74.076) * 61 == 13555.176, rounds to 13555, so the one-cent gap is the whole per-line-rounding claim"
            - "Shipment.${shp}.quoted_freight_cents == 14398: discount_rate_pct 3.00 is the first UTILIZATION_DISCOUNT_TIERS row with min_utilization_pct <= 61.73, discount = round_half_up(13556 * 3.00 / 100) == round_half_up(406.68) == 407, after_discount == 13149, fuel = round_half_up(13149 * 9.50 / 100) == round_half_up(1249.155) == 1249, total == 13149 + 1249 == 14398"
            - "applying the fuel surcharge before the discount would give round_half_up(13556 * 9.50 / 100) == 1288, base 14844, less round_half_up(14844 * 3.00 / 100) == 445, i.e. 14399 — one cent different, so the pinned order is observable"
            - "Shipment.${shp}.billed_freight_cents == 19198: the BILLED variant charges both lines on line_gross_cube_m3 1.2345, so each line is round_half_up(148.140 * 61) == 9037, billed_pre_discount_cents == 18074, discount = round_half_up(18074 * 3.00 / 100) == round_half_up(542.22) == 542, after_discount == 17532, fuel = round_half_up(17532 * 9.50 / 100) == round_half_up(1665.54) == 1666, total == 19198"
            - "the bill reuses discount_rate_pct 3.00 chosen from cube_utilization_pct 61.73 — the utilisation is still computed from the nested cube even though the money now uses the gross cube, so an implementation that re-derived the tier from the gross 2.4690 / 3.0000 == 82.30 would apply 7.50 pct and bill round_half_up(18074 * 7.50 / 100) == 1356 off, 16718 + round_half_up(1588.21) == 18306"
            - "the final freight-summary carries BOTH figures on one row: quoted_freight_cents 14398 and billed_freight_cents 19198, a variance of 4800 cents on a trailer whose two lines never changed; lines[0] shows nest_position 1 with chargeable_kg_nested == chargeable_kg_gross == 148.140 and lines[1] shows nest_position 2 with chargeable_kg_nested 74.076 against chargeable_kg_gross 148.140"
            - "after depart both hulls read logistics_status IN_TRANSIT with stored_footprint_cube_m3 0.0000 and Warehouse.${wh}.committed_cube_m3 == 0.0000, yet the two ShipmentLine rows remain LOADED — which is why deliver can still price them"

      # -----------------------------------------------------------------------
      # C20 — shipment_freight tier straddle: two identical two-hull trailers
      # whose declared capacities differ by 0.0002 m3 land on different
      # UTILIZATION_DISCOUNT_TIERS rows, and the tier is compared against the
      # ROUNDED utilisation.
      # -----------------------------------------------------------------------
      - name: calc_tiered_pricing_freight_utilization_discount_tier_straddle
        claim_type: tiered_pricing
        grounds:
          - calculations.shipment_freight
          - calculations.shipment_cube_rollup
          - endpoints.POST_/shipments/{shipment_id}/seal
          - endpoints.GET_/shipments/{shipment_id}/freight-summary
        distinguishing_aspect: "Two trailers carrying the same two-hull nested cube 1.8518 m3 must quote 13730 and 14398 cents: the 2.4691 m3 trailer's raw utilisation 74.998987 rounds to 75.00 and takes the 7.50 pct tier, while the 2.4693 m3 trailer's 74.992912 rounds to 74.99 and falls to 3.00 pct — the tier ladder is tested against the 2-dp rounded cube_utilization_pct, not the raw quotient."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVT (gross_cube_m3 1.2345, nest_factor 0.5000, unit_weight_kg 30.000, nominal_charge_kg 10.000) with 4-cavity mould MLD-CVT-1 (nominal_charge_kg 40.000), oven OV-CVS, bay CB-CVS, site WH-CVA, resin lot LOT-CVS, four technicians."
            - "ProductionOrder PO-CVT (ordered_qty 4) ran one cycle that produced four SELLABLE hulls, all four STORED at WH-CVA — the first is the zone anchor at 1.2345 m3 and the other three nest at 0.6173 m3 each, so committed_cube_m3 is 3.0864 and the site is NORMAL."
            - "Two trailers exist on destination_zone Z2, SHP-CVT-A with trailer_cube_capacity_m3 2.4691 and SHP-CVT-B with 2.4693; both are PLANNED with no lines and both quotes null."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - &cvT_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CVT", hull_type: "CANOE", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 10.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 1.2345, nest_factor: 0.5000, unit_weight_kg: 30.000, msrp_cents: 200000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - &cvT_mold
              call: "POST /molds"
              payload: { mold_code: "MLD-CVT-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 4, nominal_charge_kg: 40.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - *cvS_oven
            - *cvS_bay
            - *cvA_wh
            - *cvS_lot
            - &cvT_po
              call: "POST /production-orders"
              payload: { order_code: "PO-CVT", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 4 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - *cvS_release
            - *cvS_cycle
            - &cvT_charge
              call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 40.000, regrind_kg: 4.000, expected_resin_lot_version: "${lot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - *cvB_clk_0900
            - *cvS_start
            - *cvB_clk_1000
            - *cvS_cool
            - *cvB_clk_1035
            - *cvS_demold
            - &cvT_units
              call: "GET /finished-units?molding_cycle_id=${cyc}"
              payload: {}
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { fu1: "$.data[0].id", fu2: "$.data[1].id", fu3: "$.data[2].id", fu4: "$.data[3].id" }
            - *cvW_trim1
            - *cvW_outfit1
            - *cvW_inspect1
            - *cvW_trim2
            - *cvW_outfit2
            - *cvW_inspect2
            - &cvT_trim3
              call: "POST /finished-units/${fu3}/trim"
              payload: { trim_waste_kg: 0.200 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - &cvT_outfit3
              call: "POST /finished-units/${fu3}/outfit"
              payload: { hardware_kit_serial: "HK-CVT-3" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - &cvT_inspect3
              call: "POST /finished-units/${fu3}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - &cvT_trim4
              call: "POST /finished-units/${fu4}/trim"
              payload: { trim_waste_kg: 0.200 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - &cvT_outfit4
              call: "POST /finished-units/${fu4}/outfit"
              payload: { hardware_kit_serial: "HK-CVT-4" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - &cvT_inspect4
              call: "POST /finished-units/${fu4}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - *cvW_get_wh1
            - *cvW_store1
            - *cvW_get_wh2
            - *cvW_store2
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v3: $.data.version }
            - call: "POST /finished-units/${fu3}/store"
              payload: { expected_warehouse_version: "${wh_v3}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v4: $.data.version }
            - call: "POST /finished-units/${fu4}/store"
              payload: { expected_warehouse_version: "${wh_v4}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CVT-A", origin_warehouse_id: "${wh}", destination_zone: "Z2", carrier_code: "CAR-CVT", trailer_cube_capacity_m3: 2.4691, trailer_max_payload_kg: 1000.000 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_a: $.data.id, shp_a_v: $.data.version }
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CVT-B", origin_warehouse_id: "${wh}", destination_zone: "Z2", carrier_code: "CAR-CVT", trailer_cube_capacity_m3: 2.4693, trailer_max_payload_kg: 1000.000 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_b: $.data.id, shp_b_v: $.data.version }
          trigger:
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_a}", finished_unit_id: "${fu1}", expected_shipment_version: "${shp_a_v}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_a}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_a_v2: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_a}", finished_unit_id: "${fu2}", expected_shipment_version: "${shp_a_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_b}", finished_unit_id: "${fu3}", expected_shipment_version: "${shp_b_v}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_b}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_b_v2: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_b}", finished_unit_id: "${fu4}", expected_shipment_version: "${shp_b_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /shipments/${shp_a}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipments/${shp_b}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_a}/freight-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_b}/freight-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "both trailers report the identical cube rollup: loaded_cube_m3 2.4690, nested_cube_m3 1.8518 (1.2345 anchor line plus round(1.2345 * 0.5000, 4) == 0.6173), loaded_weight_kg 60.000 and quoted_pre_discount_cents 13556 == round_half_up(148.140 * 61) + round_half_up(74.076 * 61) == 9037 + 4519 — every input to the money except the declared capacity is byte-identical"
            - "Shipment.${shp_a}.cube_utilization_pct == 75.00: the raw quotient 1.8518 / 2.4691 * 100 == 74.998987... rounds HALF_UP at 2 dp to exactly 75.00, which SATISFIES the 75.00 tier row"
            - "Shipment.${shp_b}.cube_utilization_pct == 74.99: 1.8518 / 2.4693 * 100 == 74.992912... rounds to 74.99, which fails min_utilization_pct 75.00 and matches the 60.00 row instead"
            - "Shipment.${shp_a}.quoted_freight_cents == 13730: discount_rate_pct 7.50, discount = round_half_up(13556 * 7.50 / 100) == round_half_up(1016.70) == 1017, after_discount == 12539, fuel = round_half_up(12539 * 9.50 / 100) == round_half_up(1191.205) == 1191, total == 13730"
            - "Shipment.${shp_b}.quoted_freight_cents == 14398: discount_rate_pct 3.00, discount = round_half_up(13556 * 3.00 / 100) == 407, after_discount == 13149, fuel = round_half_up(1249.155) == 1249, total == 14398"
            - "the two quotes differ by 668 cents although the trailers differ by 0.0002 m3 of declared capacity and carry the same hulls — the discount tier is a step function of cube_utilization_pct, so an arbitrarily small capacity change can move real money"
            - "the rounding happens BEFORE the tier comparison: an implementation that tested the raw 74.998987 against min_utilization_pct 75.00 would drop ${shp_a} into the 3.00 pct row and quote 14398, erasing the divergence and making both trailers identical"
            - "the SMALLER trailer is the cheaper one: paying for less declared cube raises utilisation and therefore the discount, which is the intended incentive and the opposite of a per-cube charge"
            - "both seals succeeded because both rounded utilisations clear MIN_SEAL_UTILIZATION_PCT 60.00, so the ERR_TRAILER_UNDERUTILIZED gate did not interfere with the tier observation"
            - "each trailer's lines[0] has nest_position 1 and lines[1] nest_position 2 — nest_position is numbered per hull model WITHIN one trailer, so loading four hulls of one model across two trailers yields two position-1 full-cube lines and not one"

      # =======================================================================
      # CALCULATION CORNERS ALREADY PROBED BY §1.8 — stubs only, no recipe.
      # Each cites the one difficulty instance that already exercises it.
      # =======================================================================
      - name: calc_threshold_regrind_ceiling_exact_30_00_vs_30_01
        claim_type: threshold
        grounds:
          - calculations.qualified_resin_lot_count
          - validation_rules.priority_50
          - endpoints.POST_/resin-charges
        excluded_because:
          difficulty_instance: "boundary_precision_check / regrind_ceiling_exact_30_00_pct_accepted_vs_30_01_rejected"
          rationale: "The inclusive regrind ceiling is already driven at both sides of the bound — a 30.00 pct lot admitted and a 30.01 pct lot refused on the same model — so a second breadth instance would only restate the <= comparison that §1.8 already pins. C12 still exercises regrind at its bound as ONE conjunct of the eight-clause qualification predicate, which is a different claim."
      - name: calc_threshold_warehouse_frozen_threshold_rounded_boundary
        claim_type: threshold
        grounds:
          - calculations.warehouse_footprint_posture
          - validation_rules.priority_40
          - endpoints.POST_/finished-units/{finished_unit_id}/store
        excluded_because:
          difficulty_instance: "boundary_precision_check / warehouse_frozen_threshold_rounded_95_00_freezes_vs_95_01_threshold"
          rationale: "§1.8 already stores hulls into a site whose utilisation ROUNDS to exactly 95.00 and then one that lands at 95.01, proving both the >= comparison and that the comparison runs on the 2-dp rounded utilisation. C15 covers the posture machine from the other end, at 100.00 with a full zone, where the interesting behaviour is the CASCADE-H propagation rather than the threshold."
      - name: calc_precision_wall_distribution_nested_rounding_mean_then_sd_then_cv
        claim_type: Precision
        grounds:
          - calculations.wall_thickness_distribution
          - endpoints.POST_/finished-units/{finished_unit_id}/inspect
        excluded_because:
          difficulty_instance: "combinatorial_formula / wall_distribution_nested_rounding_mean_then_sd_then_cv"
          rationale: "The three-stage nested rounding — mean to 3 dp, population sd about the ROUNDED mean, then cv to 2 dp — is already probed with a point set chosen so that using the unrounded mean or the sample sd changes the cv. My calculation instances consume the resulting cv as an input (C7 at 1.08, C9 at 12.09) rather than re-probing how it is formed."
      - name: calc_selector_policy_storage_zone_anchor_affinity_then_remaining_then_code
        claim_type: selector_policy
        grounds:
          - calculations.storage_zone_selection
          - calculations.storage_footprint
          - endpoints.POST_/finished-units/{finished_unit_id}/store
        excluded_because:
          difficulty_instance: "combinatorial_formula / zone_selector_anchor_affinity_then_remaining_then_promotion"
          rationale: "The full three-key ranking (anchor_exists DESC, remaining_after ASC, zone_code ASC) needs a multi-zone site where each key is the decisive one in turn, and §1.8 already builds exactly that. C15 uses a deliberately single-zone site so that the ERR_NO_ELIGIBLE_ZONE eligibility test is observed with the ranking held constant."
      - name: calc_tiered_pricing_warranty_fee_tier_chosen_before_storage_deduction
        claim_type: tiered_pricing
        grounds:
          - calculations.warranty_payout
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/waive-storage-finding
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/approve
        excluded_because:
          difficulty_instance: "combinatorial_formula / warranty_payout_gross_then_fee_tier_then_storage_deduction"
          rationale: "The ordering claim — a WAIVED claim whose post-deduction value would fall into a cheaper band still pays the band selected from the pre-deduction gross — is the whole point of that §1.8 instance. C17 and C18 deliberately keep every claim GUIDANCE_VERIFIED so that storage_deduction_cents is 0 and the fee tier and coverage arithmetic are isolated."
      - name: calc_interval_merge_oven_arm_half_open_span_with_changeover_buffer
        claim_type: interval_merge
        grounds:
          - calculations.oven_arm_window_check
          - calculations.cycle_window_projection
          - validation_rules.priority_62
          - endpoints.POST_/molding-cycles
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / oven_arm_half_open_span_with_symmetric_changeover_buffer"
          rationale: "Abutting two cycles on one arm at exactly the buffer boundary, and one second inside it, is already driven symmetrically on both sides. C11 uses the same projection formula but observes the BUTT-JOINT between a cycle's own oven and cooling windows and the flooring of actual minutes, which the §1.8 instance does not touch."
      - name: calc_aggregation_cooling_bay_closed_interval_slot_capacity
        claim_type: aggregation
        grounds:
          - calculations.cooling_bay_slot_check
          - calculations.cycle_window_projection
          - validation_rules.priority_71
          - entities.CoolingBay.concurrent_slot_capacity
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / cooling_bay_closed_interval_aggregate_slot_capacity"
          rationale: "Counting concurrent occupants of a CLOSED cooling window against concurrent_slot_capacity, including the endpoint-touching case that a half-open reading would let through, is exactly that instance's subject. My bay in every calculation instance is sized above the concurrent load so the aggregate never binds."
      - name: calc_interval_merge_mold_occupancy_oven_plus_cooling_span
        claim_type: interval_merge
        grounds:
          - calculations.cycle_window_projection
          - validation_rules.priority_70
          - entities.Mold.status
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / mold_half_open_oven_plus_cooling_span_occupancy_vs_capability"
          rationale: "The mould's occupancy span is the union [oven_start, cooling_end) rather than either window alone, and §1.8 already separates that overlap failure from the size-class capability failure on the same request. C10 instead drives the mould's SERVICE COUNTER, which is a different function of the same cycles."
      - name: calc_reconciliation_resin_mass_ledger_conserved_across_release_and_consume
        claim_type: Reconciliation
        grounds:
          - calculations.resin_mass_ledger
          - endpoints.POST_/molding-cycles/{molding_cycle_id}/abort
          - endpoints.POST_/molding-cycles/{molding_cycle_id}/start-oven
        excluded_because:
          difficulty_instance: "compensating_invariant / resin_mass_ledger_conserved_across_reserve_release_and_irreversible_consume"
          rationale: "The asymmetry that makes the ledger interesting — RESERVED mass returns on abort while CONSUMED mass never does — is already driven to a fixed point across a reserve, a release and an irreversible consume. C1 and C10 assert the three-way split (available / reserved / consumed) as a supporting invariant at single points in the sequence, not as the claim under test."
      - name: calc_reconciliation_warranty_reserve_ledger_conserved_across_approve_and_void
        claim_type: Reconciliation
        grounds:
          - calculations.warranty_reserve_ledger
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/void
          - entities.ProductModel.warranty_paid_cents
        excluded_because:
          difficulty_instance: "compensating_invariant / warranty_reserve_ledger_conserved_across_approve_and_void"
          rationale: "Restoring the reserve on void — the only edge that raises it — while retaining the claim's money fields as the audit record is that instance's subject. C17 and C18 assert reserve + paid == initial after three approvals, which is the one-directional half of the same invariant and is needed there to show that three different payouts were actually booked."
      - name: calc_reconciliation_storage_footprint_conserved_with_anchor_promotion
        claim_type: Reconciliation
        grounds:
          - calculations.storage_footprint
          - endpoints.POST_/finished-units/{finished_unit_id}/release-storage
          - endpoints.POST_/shipments/{shipment_id}/depart
        excluded_because:
          difficulty_instance: "compensating_invariant / storage_footprint_conserved_with_asymmetric_anchor_promotion"
          rationale: "Promotion makes the footprint ledger asymmetric: vacating the anchor of a nest group RAISES a follower's charged cube, so the site's committed cube does not fall by the departing unit's own figure. §1.8 drives that promotion explicitly; C15 deliberately keeps a single stored hull so the release is the symmetric case, and C19 vacates a whole nest group at once."
      - name: calc_correct_result_order_completion_rollup_downward_demotion
        claim_type: Correct Result
        grounds:
          - calculations.order_completion_rollup
          - calculations.production_order_cost
          - endpoints.POST_/finished-units/{finished_unit_id}/reinspect
        excluded_because:
          difficulty_instance: "transitive_cascade / reinspect_demotion_reopens_complete_order_and_raises_unit_cost"
          rationale: "Demoting a SELLABLE hull back out of the completed set reopens a COMPLETE order and RAISES unit_cost_cents because the divisor shrinks — a downward recomputation §1.8 already drives end to end. C5 covers the reconciliation in the upward direction only, where completed_qty rises and the floored unit cost falls."
      - name: calc_variant_selection_requote_after_unseal_on_a_new_discount_tier
        claim_type: Variant Selection
        grounds:
          - calculations.shipment_freight
          - endpoints.POST_/shipments/{shipment_id}/unseal
          - endpoints.POST_/shipment-lines/{shipment_line_id}/remove
        excluded_because:
          difficulty_instance: "non_linear_state_machine / shipment_unseal_revert_forces_requote_on_a_new_discount_tier"
          rationale: "Recomputing the quote over a DIFFERENT line set after an unseal, a removal that renumbers nest_position and a reseal is that instance's subject, including the counter-intuitive rise in nested cube. C19 and C20 hold the line set fixed so that per-line rounding and the tier ladder can be read without the renumbering confound."
      - name: calc_variant_selection_mold_first_attempt_vs_retry_with_exclusions
        claim_type: Variant Selection
        grounds:
          - calculations.mold_selection
          - endpoints.POST_/molding-cycles
        excluded_because:
          difficulty_instance: "dual_variant_calc / mold_selection_first_attempt_vs_retry_with_exclusions"
          rationale: "The two variants only diverge when the first-choice mould is excluded by an overlap or a capability miss and the RETRY_WITH_EXCLUSIONS pass has to fall to a lower-ranked tool; §1.8 builds that exclusion set. Every calculation instance here gives its order exactly one usable mould, so FIRST_ATTEMPT always wins and the variant is not observable."

  # ===========================================================================
  # SECTION: validations
  #
  # The §1.4 ladder is 76 rungs long, so this section is deliberately NOT one
  # instance per rung. Every Table 4 claim type and every validation pattern is
  # covered at least once, with the rungs chosen for the widest applies_to, the
  # least usual category, and the ladder neighbours that make ORDERING visible:
  #   * auth 1 / 3 / 5 — applies_to "all", so they gate every other instance
  #   * the boundary rungs whose comparison runs on a ROUNDED value (53, 68)
  #   * the five PRIORITY PAIRS; §1.8 owns PAIR-1, PAIR-2 and PAIR-5, so
  #     PAIR-3 and PAIR-4 are driven here with real recipes
  #   * ordering across CATEGORY boundaries that §1.8 does not pair:
  #     state 38 over OCC 82, safety 51 over fiscal 72, fiscal 73 over 75
  #   * the conditional rungs that only exist when a flag is set (27, 69/74)
  #   * the aggregate rungs where every part is legal and the collective is not
  #     (77 trailer cube, 79 order overbuild)
  # ===========================================================================
  - section: validations
    instances:

      # -----------------------------------------------------------------------
      # V1 — priority 1 applies_to "all" and precedes existence, schema and
      # every write.
      # -----------------------------------------------------------------------
      - name: val_violation_missing_auth_headers_rejected_before_any_write
        claim_type: "Violation → Error"
        grounds:
          - validation_rules.priority_1
          - errors.ERR_MISSING_AUTH_HEADERS
          - endpoints.POST_/production-orders
        distinguishing_aspect: "A POST /production-orders whose body is entirely valid but whose X-User-ID is empty must return 401 ERR_MISSING_AUTH_HEADERS and leave zero ProductionOrder rows behind, while the byte-identical body with a non-empty X-User-ID returns 201 — priority 1 runs before existence, schema and the write."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVA and site WH-CVA exist."
            - "No ProductionOrder row exists yet."
          setup_api_calls:
            - *cvA_clock
            - *cvA_pm
            - *cvA_wh
          trigger:
            - call: "POST /production-orders"
              payload: { order_code: "PO-CVV-AUTH", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: ""
            - call: "GET /production-orders"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /production-orders"
              payload: { order_code: "PO-CVV-AUTH", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "GET /production-orders"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the first POST fails 401 with error_id ERR_MISSING_AUTH_HEADERS — an empty X-User-ID is a MISSING header, not merely an unknown identity, so priority 4's ERR_IDENTITY_NOT_FOUND is the wrong answer here"
            - "the intervening GET /production-orders returns total_count 0 — the rejected request wrote nothing, which is what makes priority 1 a gate rather than a post-hoc audit"
            - "the second POST, byte-identical in body and differing only in the X-User-ID header, returns 201 with status DRAFT — so the 401 was attributable to the header alone and no ERR_DUPLICATE_CODE arises from the first attempt"
            - "the closing GET /production-orders returns total_count 1, confirming order_code PO-CVV-AUTH was never consumed by the rejected call"

      # -----------------------------------------------------------------------
      # V2 — priority 3 (auth) beats priority 10 (existence) on the same call.
      # -----------------------------------------------------------------------
      - name: val_priority_ordering_role_not_permitted_beats_unresolved_path_id
        claim_type: "Priority Ordering"
        grounds:
          - validation_rules.priority_3
          - validation_rules.priority_10
          - errors.ERR_ROLE_NOT_PERMITTED
          - endpoints.POST_/molds/{mold_id}/retire
        distinguishing_aspect: "POST /molds/mold-cvv-absent/retire as MoldingOperator must return 403 ERR_ROLE_NOT_PERMITTED, not 404 ERR_RESOURCE_NOT_FOUND — the role check at priority 3 runs before the path id is resolved at priority 10, so an unauthorised caller cannot probe which ids exist."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVA, mould MLD-CVA-1 (AVAILABLE) and technician T-CVOPR (MOLDING_OPERATOR) exist."
            - "No mould carries the id mold-cvv-absent."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_op
            - *cvA_pm
            - *cvA_mold
          trigger:
            - call: "POST /molds/mold-cvv-absent/retire"
              payload: { retire_reason: "probing an id the caller may not touch" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molds/${mold}/retire"
              payload: { retire_reason: "probing a real id the caller may not touch" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molds/mold-cvv-absent/retire"
              payload: { retire_reason: "authorised caller, absent id" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /molds/${mold}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the first call fails 403 ERR_ROLE_NOT_PERMITTED: POST /molds/{mold_id}/retire lists roles [PlantAdmin] only, and priority 3 short-circuits before priority 10 ever looks the id up"
            - "the second call, same role but a REAL mould id, also fails 403 ERR_ROLE_NOT_PERMITTED with the identical error_id — the two responses are indistinguishable, which is precisely the information-hiding property the ordering buys"
            - "the third call, PlantAdmin against the absent id, fails 404 ERR_RESOURCE_NOT_FOUND — so priority 10 does fire once priority 3 is satisfied, proving the first two 403s were ordering and not a missing existence check"
            - "GET /molds/${mold} still reads status AVAILABLE with an unchanged version: neither rejected retire wrote anything"

      # -----------------------------------------------------------------------
      # V3 — priority 5: the backing Technician row's role_code must match the
      # shop-floor role being asserted, and it is checked before certification
      # (31) and before any resin business rule.
      # -----------------------------------------------------------------------
      - name: val_violation_role_identity_mismatch_when_the_technician_holds_another_role
        claim_type: "Violation → Error"
        grounds:
          - validation_rules.priority_5
          - validation_rules.priority_4
          - validation_rules.priority_31
          - errors.ERR_ROLE_IDENTITY_MISMATCH
          - endpoints.POST_/resin-charges
        distinguishing_aspect: "A POST /resin-charges sent as ResinTechnician but carrying the ASSEMBLY_TECH technician's id must fail 403 ERR_ROLE_IDENTITY_MISMATCH — the row exists so priority 4 passes, and the mismatch is caught before priority 31 could complain that the same technician lacks RESIN_BLENDING."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Four technicians exist: T-CVRES (RESIN_TECH, RESIN_BLENDING), T-CVOPR (MOLDING_OPERATOR), T-CVASM (ASSEMBLY_TECH, FIXTURE_ASSEMBLY) and T-CVQCI (QUALITY_INSPECTOR)."
            - "ProductModel PM-CVA, mould MLD-CVA-1, oven OV-CVA, bay CB-CVA, site WH-CVA and resin lot LOT-CVA-A (100.000 kg AVAILABLE) exist."
            - "ProductionOrder PO-CVA is RELEASED and one MoldingCycle is SCHEDULED on arm 1 with no charges yet."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvA_pm
            - *cvA_mold
            - *cvA_oven
            - *cvA_bay
            - *cvA_wh
            - *cvA_lot_a
            - *cvA_po
            - *cvA_release
            - *cvA_cycle
          trigger:
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_a}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${lot_a_v}" }
              as: ResinTechnician
              as_user_id: "${t_asm}"
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_a}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${lot_a_v}" }
              as: ResinTechnician
              as_user_id: "technician-cvv-absent"
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_a}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${lot_a_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_a}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "the first call fails 403 ERR_ROLE_IDENTITY_MISMATCH: T-CVASM is a real Technician row so priority 4 passes, but its role_code ASSEMBLY_TECH is not the RESIN_TECH that the ResinTechnician header asserts"
            - "the mismatch is reported as ERR_ROLE_IDENTITY_MISMATCH and NOT as ERR_TECHNICIAN_NOT_CERTIFIED: T-CVASM's certifications are [FIXTURE_ASSEMBLY], so priority 31 would also fail this request, and only the 5-before-31 ordering distinguishes the two"
            - "the second call fails 401 ERR_IDENTITY_NOT_FOUND for an id that backs no Technician row — priority 4 fires before priority 5, so an unknown id never reaches the role comparison"
            - "the third call, the same body as the acting T-CVRES, returns 201 with status RESERVED — the body was legal throughout and all three outcomes differ only in X-User-ID"
            - "GET /resin-lots/${lot_a} shows available_kg 80.000, reserved_kg 20.000 and consumed_kg 0.000: exactly ONE of the three attempts moved mass, so neither 403 nor 401 leaked a partial ledger write"

      # -----------------------------------------------------------------------
      # V4 — priority 53: the tolerance comparison runs on the percentage
      # ROUNDED to 2 dp, so a mass 0.001 kg past the raw bound still passes.
      # -----------------------------------------------------------------------
      - name: val_satisfaction_charge_mass_at_the_rounded_tolerance_bound_passes
        claim_type: "Satisfaction → Pass"
        grounds:
          - validation_rules.priority_53
          - errors.ERR_CHARGE_MASS_OUT_OF_TOLERANCE
          - calculations.cycle_charge_rollup
          - endpoints.POST_/molding-cycles/{molding_cycle_id}/start-oven
        distinguishing_aspect: "Against a 25.000 kg mould at 5.00 pct tolerance a charged mass of 26.251 kg must START the oven while 26.252 kg must fail 422 ERR_CHARGE_MASS_OUT_OF_TOLERANCE: the deviations are 5.004 and 5.008 pct, which round to 5.00 and 5.01, so the accepted mass is one that exceeds the raw bound 26.250 and is rescued only by the 2-dp rounding."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVV1 (nominal_charge_kg 25.000, charge_tolerance_pct 5.00, max_regrind_pct 30.00, min_cooling_minutes 30), two single-cavity moulds MLD-CVV-1 and MLD-CVV-2 each with nominal_charge_kg 25.000, oven OV-CVV with arm_count 2, bay CB-CVV with 2 slots, site WH-CVA, resin lot LOT-CVV (200.000 kg), four technicians."
            - "ProductionOrder PO-CVV (ordered_qty 2) is RELEASED and IN_PRODUCTION with two SCHEDULED cycles: cycle A on arm 1 holding two RESERVED charges of 13.000 and 13.251 kg (26.251 total), cycle B on arm 2 holding 13.000 and 13.252 kg (26.252 total)."
            - "Neither cycle has started; the lot reads available_kg 147.497, reserved_kg 52.503 and consumed_kg 0.000."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - &cvV_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CVV1", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 25.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 1.0000, nest_factor: 0.5000, unit_weight_kg: 30.000, msrp_cents: 200000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - &cvV_mold1
              call: "POST /molds"
              payload: { mold_code: "MLD-CVV-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 25.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold1: $.data.id }
            - &cvV_mold2
              call: "POST /molds"
              payload: { mold_code: "MLD-CVV-2", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 25.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold2: $.data.id }
            - &cvV_oven
              call: "POST /oven-stations"
              payload: { station_code: "OV-CVV", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - &cvV_bay
              call: "POST /cooling-bays"
              payload: { bay_code: "CB-CVV", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - *cvA_wh
            - &cvV_lot
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVV", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 200.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
            - &cvV_po
              call: "POST /production-orders"
              payload: { order_code: "PO-CVV", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - &cvV_release
              call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - &cvV_cycA
              call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_a: $.data.id, po_v2: $.data.version }
            - &cvV_cycB
              call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_b: $.data.id }
            - &cvV_chA1
              call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc_a}", resin_lot_id: "${lot}", charge_kg: 13.000, regrind_kg: 1.300, expected_resin_lot_version: "${lot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - &cvV_get_lot2
              call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v2: $.data.version }
            - &cvV_chA2
              call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc_a}", resin_lot_id: "${lot}", charge_kg: 13.251, regrind_kg: 1.325, expected_resin_lot_version: "${lot_v2}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - &cvV_get_lot3
              call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v3: $.data.version }
            - &cvV_chB1
              call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc_b}", resin_lot_id: "${lot}", charge_kg: 13.000, regrind_kg: 1.300, expected_resin_lot_version: "${lot_v3}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - &cvV_get_lot4
              call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v4: $.data.version }
            - &cvV_chB2
              call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc_b}", resin_lot_id: "${lot}", charge_kg: 13.252, regrind_kg: 1.325, expected_resin_lot_version: "${lot_v4}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
          trigger:
            - call: "GET /molding-cycles/${cyc_a}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc_a}/start-oven"
              payload: { actual_oven_start_at: "2026-08-01T09:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles/${cyc_b}/start-oven"
              payload: { actual_oven_start_at: "2026-08-01T09:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /molding-cycles/${cyc_b}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "MoldingCycle.${cyc_a}.charged_mass_kg == round(13.000 + 13.251, 3) == 26.251 and MoldingCycle.${cyc_b}.charged_mass_kg == 26.252 — one thousandth of a kilogram apart"
            - "the start-oven of ${cyc_a} returns 200 with status OVEN_RUNNING: the deviation is abs(26.251 - 25.000) / 25.000 * 100 == 5.00400, which rounded to 2 dp is 5.00 and satisfies <= charge_tolerance_pct 5.00 — note 26.251 is ABOVE the raw bound 25.000 * 1.05 == 26.250, so an implementation comparing the unrounded 5.004 would wrongly reject a legal charge"
            - "the start-oven of ${cyc_b} fails 422 ERR_CHARGE_MASS_OUT_OF_TOLERANCE: abs(26.252 - 25.000) / 25.000 * 100 == 5.00800 rounds to 5.01, which exceeds 5.00 — the two masses straddle the rounding boundary and not the arithmetic bound"
            - "the rejected cycle ${cyc_b} still reads status SCHEDULED with actual_oven_start_at null, and its two charges are still RESERVED — priority 53 is evaluated before the transition is written"
            - "GET /resin-lots/${lot} reads available_kg 147.497, reserved_kg 26.252 and consumed_kg 26.251: only cycle A's charges were consumed by its successful start, and available + reserved + consumed == 200.000 == received_kg"
            - "both cycles were admitted in the first place because each drew a distinct mould: mold_selection ranks by cycles_since_service ASC then mold_code ASC, so ${cyc_a} holds MLD-CVV-1 and ${cyc_b} holds MLD-CVV-2 — with one mould the second create would have failed priority 70 and the tolerance boundary would never have been reachable"
            - "the regrind share is 10.00 pct on both cycles (round(2.625 / 26.251 * 100, 2) and round(2.625 / 26.252 * 100, 2)), well inside max_regrind_pct 30.00, so priority 50 cannot be the cause of either outcome"

      # -----------------------------------------------------------------------
      # V5 — priority 68: MIN_SEAL_UTILIZATION_PCT is compared against the
      # 2-dp cube_utilization_pct, so 0.0001 m3 of declared capacity decides it.
      # -----------------------------------------------------------------------
      - name: val_violation_trailer_underutilized_when_the_rounded_utilisation_slips_below_60
        claim_type: "Violation → Error"
        grounds:
          - validation_rules.priority_68
          - errors.ERR_TRAILER_UNDERUTILIZED
          - calculations.shipment_cube_rollup
          - endpoints.POST_/shipments/{shipment_id}/seal
        distinguishing_aspect: "Two trailers holding the identical nested cube 1.8518 m3 but declaring 3.0865 and 3.0866 m3 of capacity must diverge at the seal: the first reports cube_utilization_pct 60.00 and seals, the second reports 59.99 and fails 409 ERR_TRAILER_UNDERUTILIZED, even though the first trailer's raw utilisation 59.996760 is below 60."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVT (gross_cube_m3 1.2345, nest_factor 0.5000, unit_weight_kg 30.000) with the 4-cavity mould MLD-CVT-1, oven OV-CVS, bay CB-CVS, site WH-CVA, resin lot LOT-CVS, four technicians."
            - "ProductionOrder PO-CVT ran one cycle and produced four SELLABLE hulls, all four STORED at WH-CVA."
            - "Two trailers exist on zone Z2: SHP-CVV-A with trailer_cube_capacity_m3 3.0865 and SHP-CVV-B with 3.0866, both PLANNED and empty."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvT_pm
            - *cvT_mold
            - *cvS_oven
            - *cvS_bay
            - *cvA_wh
            - *cvS_lot
            - *cvT_po
            - *cvS_release
            - *cvS_cycle
            - *cvT_charge
            - *cvB_clk_0900
            - *cvS_start
            - *cvB_clk_1000
            - *cvS_cool
            - *cvB_clk_1035
            - *cvS_demold
            - *cvT_units
            - *cvW_trim1
            - *cvW_outfit1
            - *cvW_inspect1
            - *cvW_trim2
            - *cvW_outfit2
            - *cvW_inspect2
            - *cvT_trim3
            - *cvT_outfit3
            - *cvT_inspect3
            - *cvT_trim4
            - *cvT_outfit4
            - *cvT_inspect4
            - *cvW_get_wh1
            - *cvW_store1
            - *cvW_get_wh2
            - *cvW_store2
            - &cvV_get_wh3
              call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v3: $.data.version }
            - &cvV_store3
              call: "POST /finished-units/${fu3}/store"
              payload: { expected_warehouse_version: "${wh_v3}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - &cvV_get_wh4
              call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v4: $.data.version }
            - &cvV_store4
              call: "POST /finished-units/${fu4}/store"
              payload: { expected_warehouse_version: "${wh_v4}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CVV-A", origin_warehouse_id: "${wh}", destination_zone: "Z2", carrier_code: "CAR-CVV", trailer_cube_capacity_m3: 3.0865, trailer_max_payload_kg: 1000.000 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_a: $.data.id, shp_a_v: $.data.version }
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CVV-B", origin_warehouse_id: "${wh}", destination_zone: "Z2", carrier_code: "CAR-CVV", trailer_cube_capacity_m3: 3.0866, trailer_max_payload_kg: 1000.000 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_b: $.data.id, shp_b_v: $.data.version }
          trigger:
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_a}", finished_unit_id: "${fu1}", expected_shipment_version: "${shp_a_v}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_a}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_a_v2: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_a}", finished_unit_id: "${fu2}", expected_shipment_version: "${shp_a_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_b}", finished_unit_id: "${fu3}", expected_shipment_version: "${shp_b_v}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_b}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_b_v2: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_b}", finished_unit_id: "${fu4}", expected_shipment_version: "${shp_b_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /shipments/${shp_a}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipments/${shp_b}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_b}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipment-lines?shipment_id=${shp_b}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "both trailers report nested_cube_m3 == 1.8518 (1.2345 + round(1.2345 * 0.5000, 4)) and loaded_weight_kg == 60.000 — the only difference between them is trailer_cube_capacity_m3"
            - "Shipment.${shp_a}.cube_utilization_pct == 60.00: the raw quotient 1.8518 / 3.0865 * 100 == 59.996760... rounds HALF_UP at 2 dp to 60.00, which SATISFIES 'utilisation reaches MIN_SEAL_UTILIZATION_PCT 60.00; exactly 60.00 passes'"
            - "the seal of ${shp_a} returns 200 with status SEALED, sealed_at == 2026-08-01T11:00:00Z (taken from the logical clock, not from a body field) and a non-null quoted_freight_cents"
            - "Shipment.${shp_b}.cube_utilization_pct == 59.99 (raw 59.994816...) and its seal fails 409 ERR_TRAILER_UNDERUTILIZED — 0.0001 m3 of declared capacity is the entire difference between a sealable and an unsealable trailer"
            - "an implementation that compared the RAW utilisation against 60.00 would reject ${shp_a} too, since 59.996760 < 60; the rounding to 2 dp must happen before the comparison"
            - "after the failed seal GET /shipments/${shp_b} still reads status LOADING with sealed_at null and quoted_freight_cents null — no quote is minted by a refused seal"
            - "GET /shipment-lines?shipment_id=${shp_b} still returns 2 rows in status LOADED, and both hulls remain logistics_status LOADED: the refused seal did not unload anything"
            - "priority 49 (ERR_SHIPMENT_EMPTY) cannot be confused with this outcome because ${shp_b} holds two LOADED lines; the only failing rung is 68"

      # -----------------------------------------------------------------------
      # V6 — PAIR-3: priority 40 (warehouse FROZEN) must pre-empt priority 74
      # (build-ahead cap) AND priority 73 (no eligible zone) on the same store.
      # §1.8 owns PAIR-1/2/5; PAIR-3 is exercised for real here.
      # -----------------------------------------------------------------------
      - name: val_priority_conflict_pair3_warehouse_frozen_beats_build_ahead_cap_and_zone
        claim_type: "Priority conflict"
        grounds:
          - validation_rules.priority_40
          - validation_rules.priority_73
          - validation_rules.priority_74
          - errors.ERR_WAREHOUSE_FROZEN
          - errors.ERR_BUILD_AHEAD_CAP_EXCEEDED
          - calculations.build_ahead_commitment
          - calculations.warehouse_footprint_posture
          - endpoints.POST_/finished-units/{finished_unit_id}/store
        distinguishing_aspect: "A single store request that simultaneously violates rung 40 (site FROZEN at 95.24 pct), rung 73 (the only zone has 0.0500 m3 left against a 0.5000 m3 nested footprint) and rung 74 (bucket committed 1 of cap 1) must return 409 ERR_WAREHOUSE_FROZEN, while an otherwise identical store at a NORMAL roomy site charged to the same exhausted bucket returns 409 ERR_BUILD_AHEAD_CAP_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVF (gross_cube_m3 1.0000, nest_factor 0.5000, unit_weight_kg 30.000) with one 2-cavity mould MLD-CVF-1, oven OV-CVF (2 arms), bay CB-CVF (2 slots), resin lot LOT-CVF (100.000 kg) and four technicians."
            - "Two sites: WH-CVF is deliberately tiny — footprint_capacity_cube_m3 1.0500 in a single zone Z1 of 1.0500 — and WH-CVG is roomy at 20.0000 in one zone Z1."
            - "DemandForecastBucket BKT-CVF (season S26F, forecast_qty 2, build_ahead_cap_pct 60.00, window 2026-07-01..2026-09-30) therefore has build_ahead_cap_qty floor(2 * 60.00 / 100) == 1."
            - "ProductionOrder PO-CVF (target WH-CVF, ordered_qty 2, demand_bucket_id BKT-CVF) produced hulls fu1 and fu2; ProductionOrder PO-CVG (target WH-CVG, ordered_qty 2, same bucket) produced fu3 and fu4. fu1, fu2 and fu3 are SELLABLE and UNALLOCATED."
            - "fu1 has already been stored at WH-CVF: it is the zone anchor at the full 1.0000 m3, so the site reads committed_cube_m3 1.0000, utilization_pct 95.24 and posture FROZEN, and the bucket reads build_ahead_committed_qty 1 of cap 1."
