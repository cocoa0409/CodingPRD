  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: renewal_state_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_FACILITY_NOT_RENEWABLE
          - errors.ERR_RENEWAL_WINDOW_CLOSED
        distinguishing_aspect: "Error-category pair state x business_temporal: a renewal attempt on a SUSPENDED facility whose renewal window has also closed must surface the state error ERR_FACILITY_NOT_RENEWABLE (priority 5), not ERR_RENEWAL_WINDOW_CLOSED (priority 7)."
        test_recipe:
          setup:
            - "Facility J registered at startup default clock, then SUSPENDED via inspection refusal (version advanced to 2)"
            - "Logical clock advanced to 2028-10-15T00:00:00Z — past the renewal grace end 2028-09-30T00:00:00Z, so the temporal check would also fail"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Douro Conservas", facility_kind: "FOREIGN", country_code: "PT", ufi: "UFI-PT-701" }
              as: FacilityOwner
              captures: { fac_j: $.data.id }
            - call: "POST /registry/inspections"
              payload: { facility_id: "${fac_j}", scheduled_start_at: "2026-09-05T09:00:00Z", scheduled_end_at: "2026-09-05T17:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
              captures: { insp_j: $.data.id }
            - call: "POST /registry/inspections/${insp_j}/refuse-entry"
              payload: {}
              as: FacilityOwner
              as_user_id: "${fac_j}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /registry/facilities/${fac_j}"
              payload: {}
              as: PlatformAdmin
              captures: { fac_j_v: $.data.version }
          trigger:
            - call: "POST /registry/facilities/${fac_j}/renew"
              payload: { expected_facility_version: "${fac_j_v}" }
              as: FacilityOwner
              as_user_id: "${fac_j}"
              captures: { err_renew: $.data.error_id }
          assert:
            - "err_renew == ERR_FACILITY_NOT_RENEWABLE (http 409) — the priority-5 state error wins over the priority-7 temporal error ERR_RENEWAL_WINDOW_CLOSED"
            - "Facility.${fac_j}.registration_status remains SUSPENDED and expires_at remains 2028-08-31T00:00:00Z"

      - name: sample_temporal_beats_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors.ERR_SAMPLE_DATE_PAST
          - errors.ERR_LAB_CAPACITY_EXCEEDED
        distinguishing_aspect: "Error-category pair business_temporal x business_constraint (different pair from the state x temporal instance): a record-sample call whose analysis_date is in the past AND whose lab-day bucket is full must surface ERR_SAMPLE_DATE_PAST (priority 7), not ERR_LAB_CAPACITY_EXCEEDED (priority 9)."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T12:00:00Z (current logical UTC date 2026-10-01)"
            - "Facility K clean; Importer I7; HIGH entry screened to decision SAMPLE; laboratory LAB-FULL with daily_sample_capacity 1; while the clock is still on 2026-09-30 a first sample of 1 unit is scheduled for 2026-09-30, filling that lab-day bucket to capacity; clock then advances to 2026-10-01T12:00:00Z so the trigger call hits both a past analysis_date and a full bucket"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registry/facilities"
