              payload: { action: "DOWNGRADE", new_notch: "BBB", rationale: "first action wins", expected_rating_version: "${rv}" }
              as: SurveillanceOfficer
              captures: { dg_notch: $.data.notch, dg_version: $.data.version }
            - call: "POST /muni/ratings/${rating_id}/actions"
              payload: { action: "AFFIRM", rationale: "stale replay", expected_rating_version: "${rv}" }
              as: SurveillanceOfficer
              captures: { stale_err: "$.data.error_id" }
          assert:
            - "DOWNGRADE -> 200 with notch BBB and version == ${rv} + 1"
            - "AFFIRM with the pre-action version -> 412 ERR_STALE_RATING_VERSION"
            - "final rating state: notch BBB (the first action's result), no AFFIRM history entry appended"

      - name: engagement_version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.RatingEngagement
        distinguishing_aspect: "The common-field version ticks exactly once per mutation: create 1 -> accept-terms 2 -> first document 3 — each observable in that call's own response."
        test_recipe:
