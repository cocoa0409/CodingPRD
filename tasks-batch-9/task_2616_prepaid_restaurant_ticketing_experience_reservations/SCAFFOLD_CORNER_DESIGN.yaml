          setup:
            - "logical clock at 2026-09-01T00:00:00Z; one restaurant with the STD parameters (service_charge_bp 725, hold_ttl 20, offer_ttl 15, max_offer_rounds 2, no_show_grace 30, goodwill cap 20000, prep_lead 45, scrutiny 300000) and nothing else"
            - "two guests G1 and G2 exist so that two independent parties can be confirmed against the same service"
