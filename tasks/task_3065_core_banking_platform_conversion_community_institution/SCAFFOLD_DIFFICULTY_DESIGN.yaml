  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: fee_waiver_threshold_equality_waives
        grounds:
          - calculations.monthly_fee_assessment
          - entities.ProductType.fields.fee_waiver_threshold_cents
        distinguishing_aspect: |
          Boundary metric 1: the >= (not >) waiver threshold on a DEPOSIT
          account. Account principal 500000 with threshold 500000 waives
          (fee 0); a sibling account at 499999 pays the full 1500 cents. Zero
          fee on LOAN accounts is a separate rule and not exercised here.
        test_recipe:
          setup:
            - "Project MOCK_CONVERSION; product DDA-FEE (DEPOSIT, ACT_365, rate 0.0, monthly_fee_cents 1500, fee_waiver_threshold_cents 500000) ACTIVE; GL-1000."
            - "Account A-EQ principal 500000 (rate 0 -> conversion_balance 500000 exactly at threshold); account A-BELOW principal 499999."
            - "Both MAPPED; MOCK-1 finalized at 2026-09-01 (accrual 0 at rate 0)."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "First Community Bank", incumbent_core_name: "LegacyCore", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              as_user_id: "pm-alice"
              captures: { proj_id: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${proj_id}",  product_code: "DDA-FEE", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.0, statement_frequency: "MONTHLY", monthly_fee_cents: 1500, fee_waiver_threshold_cents: 500000 }
              as: ConversionEngineer
              captures: { pt_id: $.data.id }
            - call: "POST /api/v1/product-types/${pt_id}/activate"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${proj_id}",  gl_code: "GL-1000", description: "Demand deposits" }
              as: ConversionEngineer
              captures: { gl_id: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${proj_id}",  legacy_account_number: "A-EQ", account_type: "DEPOSIT", product_type_id: "${pt_id}", opening_principal_cents: 500000, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { acct_eq: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${proj_id}",  legacy_account_number: "A-BELOW", account_type: "DEPOSIT", product_type_id: "${pt_id}", opening_principal_cents: 499999, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { acct_below: $.data.id }
            - call: "GET /api/v1/conversions/${proj_id}"
              payload: {}
              as: ConversionEngineer
              captures: { pv1: $.data.version }
            - call: "POST /api/v1/accounts/${acct_eq}/map"
              payload: { gl_account_id: "${gl_id}", expected_project_version: "${pv1}" }
              as: ConversionEngineer
            - call: "GET /api/v1/conversions/${proj_id}"
              payload: {}
              as: ConversionEngineer
              captures: { pv2: $.data.version }
            - call: "POST /api/v1/accounts/${acct_below}/map"
              payload: { gl_account_id: "${gl_id}", expected_project_version: "${pv2}" }
              as: ConversionEngineer
            - call: "POST /api/v1/conversions/${proj_id}/advance"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/conversions/${proj_id}/advance"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/mock-runs"
              payload: {project_id: "${proj_id}",  run_label: "MOCK-1" }
              as: ConversionEngineer
              captures: { run_id: $.data.id }
            - call: "POST /api/v1/mock-runs/${run_id}/finalize"
              payload: {}
              as: ConversionEngineer
          trigger:
            - call: "GET /api/v1/accounts/${acct_eq}"
              payload: {}
              as: ConversionEngineer
              captures: { fee_eq: $.data.monthly_fee_assessed_cents, bal_eq: $.data.conversion_balance_cents }
            - call: "GET /api/v1/accounts/${acct_below}"
              payload: {}
              as: ConversionEngineer
              captures: { fee_below: $.data.monthly_fee_assessed_cents, bal_below: $.data.conversion_balance_cents }
          assert:
            - "bal_eq == 500000 and fee_eq == 0 (equality waives: >= threshold)"
            - "bal_below == 499999 and fee_below == 1500 (one cent below the threshold pays the full fee)"

      - name: session_enrollment_capacity_full_rejects
        grounds:
          - entities.TrainingSession.fields.capacity
          - validations[priority=8]
          - endpoints.POST_/conversions/{id}/training-sessions/{tsid}/enrollments
        distinguishing_aspect: |
          Boundary metric 2 (different metric and endpoint than fee waiver):
          the zero-remaining-seats edge on session enrollment. With capacity
          1, the first enrollment succeeds (reserved_count == capacity is the
          full boundary); the second enrollment is rejected with
          ERR_INVARIANT_VIOLATION — the check fires AT reserved == capacity,
          not above it.
        test_recipe:
          setup:
            - "Project exists (any phase); training session S (capacity 1, 2026-09-02T09:00-12:00Z, branch MAIN); staff members E1 and E2."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "First Community Bank", incumbent_core_name: "LegacyCore", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              as_user_id: "pm-alice"
              captures: { proj_id: $.data.id }
            - call: "POST /api/v1/training-sessions"
              payload: {project_id: "${proj_id}",  branch_name: "MAIN", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", capacity: 1 }
              as: Trainer
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/staff"
              payload: {project_id: "${proj_id}",  employee_code: "E1", full_name: "Teller One", branch_name: "MAIN", role_scope: "TELLER" }
              as: Trainer
              captures: { emp1: $.data.id }
            - call: "POST /api/v1/staff"
              payload: {project_id: "${proj_id}",  employee_code: "E2", full_name: "Teller Two", branch_name: "MAIN", role_scope: "TELLER" }
              as: Trainer
              captures: { emp2: $.data.id }
          trigger:
            - call: "POST /api/v1/enrollments"
              payload: {session_id: "${sess_id}",  employee_id: "${emp1}" }
              as: Trainer
              captures: { enr1_state: $.data.state }
            - call: "POST /api/v1/enrollments"
              payload: {session_id: "${sess_id}",  employee_id: "${emp2}" }
              as: Trainer
              captures: { err: $.data.error_id }
            - call: "GET /api/v1/training-sessions/${sess_id}"
              payload: {}
              as: Trainer
              captures: { sess_reserved: $.data.reserved_count }
          assert:
            - "enr1_state == \"RESERVED\""
            - "err == \"ERR_INVARIANT_VIOLATION\" (second seat request at reserved_count == capacity == 1)"
            - "sess_reserved == 1 (count unchanged by the rejected enrollment)"

