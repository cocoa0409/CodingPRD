              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z", min_match_pct: 25.0, holdback_pct: 10.0, ehcl_threshold_cents: 2500000, ehcl_waiver_enabled: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0002", reported_down_mbps: 50, reported_up_mbps: 10, reported_latency_ms: 40, reported_technology: "CABLE", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l2_id: $.data.id }
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0003", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l3_id: $.data.id }
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0005", reported_down_mbps: 25, reported_up_mbps: 3, reported_latency_ms: 60, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l5_id: $.data.id }
            - call: "POST /broadband/subgrantees"
              payload: { program_id: "${p_id}", legal_name: "Northline Fiber Coop", ein: "81-1234567", net_assets_cents: 900000, requested_amount_cents: 3000000, key_personnel_count: 4, has_prior_federal_award: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { s1_id: $.data.id }
            - call: "POST /broadband/subgrantees/${s1_id}/begin-capability-review"
              payload: {}
              as: CapabilityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /broadband/subgrantees/${s1_id}/record-capability-determination"
              payload: { technical_raw_score: 30 }
              as: CapabilityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /broadband/applications"
              payload: { program_id: "${p_id}", subgrantee_id: "${s1_id}", match_offer_pct: 25.0, committed_down_mbps: 1000, committed_up_mbps: 1000, committed_latency_ms: 50, low_cost_plan_price_cents: 3000, participates_in_state_affordability_program: true, has_dbe_plan: true, has_union_agreement: false, local_hire_pct: 40, proposed_construction_start: "2026-10-01T00:00:00Z", proposed_construction_end: "2027-10-01T00:00:00Z" }
              as: Subgrantee
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /broadband/location-claims"
