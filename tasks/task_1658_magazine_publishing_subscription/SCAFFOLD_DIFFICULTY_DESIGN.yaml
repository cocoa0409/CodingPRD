              payload: { email: "p1@x.com", full_name: "P1", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { p1: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "p2@x.com", full_name: "P2", address_line1: "2 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { p2: $.data.id }
            - call: "POST /subscribers"
