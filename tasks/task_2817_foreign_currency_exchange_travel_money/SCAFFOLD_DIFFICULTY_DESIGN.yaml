scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: transaction_commission_provisional_vs_settlement_final_tier_basis
        grounds:
          - calculations.transaction_commission_and_total
          - calculations.transaction_usd_conversion
          - entities.ExchangeTransaction.fields.quoted_commission_cents
          - entities.ExchangeTransaction.fields.settled_commission_cents
          - entities.ExchangeTransaction.fields.price_adjustment_cents
          - state_machines.ExchangeTransaction.AUTHORIZED_to_SETTLED
        distinguishing_aspect: |
          This dual-variant calculation lives in the ExchangeTransaction money
          domain: QUOTE_PROVISIONAL tiers the commission on the deal's own gross
          while SETTLEMENT_FINAL tiers it on the customer's cumulative same-branch
          same-UTC-day settled gross, so an identical gross of 21626 cents yields
          757 cents at quote time and 400 cents at settlement, a signed
          price_adjustment_cents of -357.
        test_recipe:
          setup:
            - "One branch BR-LHR with a 20,000,000-cent vault limit, posture OPEN."
            - "EUR profile (MAJOR, denominations 500/1000/2000/5000/10000), one wholesale mid of 920000 micros effective 2026-07-01, one PUBLISHED open-ended rate card with buy_spread 550 and sell_spread 450 (derived buy 970600, sell 878600)."
            - "EUR position opened with 10x2000 + 10x5000 + 20x10000 notes (270000 minor units, 293478 USD cents, 147 bps)."
            - "One customer who has already SETTLED an 80000-minor-unit EUR sell at this branch today for a gross of 91054 cents."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: $.data.id, br_v0: $.data.version }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card_id: $.data.id }
            - call: "POST /rate-cards/${card_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /inventory-positions"
              payload: { branch_id: "${br_id}", currency_code: "EUR", opening_denomination_mix: [{ denomination_minor_units: 2000, note_count: 10 }, { denomination_minor_units: 5000, note_count: 10 }, { denomination_minor_units: 10000, note_count: 20 }] }
              as: BranchManager
              captures: { pos_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ana Ruiz", nationality_code: "ES", home_branch_id: "${br_id}" }
              as: BranchTeller
              captures: { cust_id: $.data.id }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 8 }] }
              as: BranchTeller
              captures: { txn1_id: $.data.id }
            - call: "POST /exchange-transactions/${txn1_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
            - call: "POST /exchange-transactions/${txn1_id}/settle"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 1 }, { denomination_minor_units: 5000, note_count: 1 }, { denomination_minor_units: 2000, note_count: 2 }] }
              as: BranchTeller
              captures: { txn2_id: $.data.id }
          trigger:
            - call: "POST /exchange-transactions/${txn2_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
            - call: "POST /exchange-transactions/${txn2_id}/settle"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
          assert:
            - "ExchangeTransaction.${txn2_id}.fx_gross_minor_units == 19000"
            - "ExchangeTransaction.${txn2_id}.applied_rate_micros == 878600"
            - "ExchangeTransaction.${txn2_id}.quoted_usd_gross_cents == 21626"
            - "ExchangeTransaction.${txn2_id}.quoted_commission_cents == 757"
            - "ExchangeTransaction.${txn2_id}.quoted_total_charge_cents == 22383"
            - "ExchangeTransaction.${txn2_id}.settled_usd_gross_cents == 21626"
            - "ExchangeTransaction.${txn2_id}.settled_commission_cents == 400"
            - "ExchangeTransaction.${txn2_id}.settled_total_charge_cents == 22026"
            - "ExchangeTransaction.${txn2_id}.price_adjustment_cents == -357"
            - "ExchangeTransaction.${txn1_id}.settled_usd_gross_cents == 91054"
            - "ExchangeTransaction.${txn1_id}.settled_commission_cents == 2276"
            - "ExchangeTransaction.${txn1_id}.price_adjustment_cents == 0"

      - name: customer_structuring_rolling_30d_vs_calendar_month_across_month_boundary
        grounds:
          - calculations.customer_structuring_aggregates
          - calculations.customer_structuring_risk_score
          - entities.Customer.fields.rolling_30d_settled_usd_cents
          - entities.Customer.fields.calendar_month_settled_usd_cents
          - entities.ComplianceReport.fields.aggregate_usd_cents
          - state_machines.Customer.ELEVATED_to_HIGH
        distinguishing_aspect: |
          This dual-variant calculation lives in the Customer compliance domain,
          not the transaction money domain: over the same two settlements the
          ROLLING_30D variant returns 1821078 cents while the CALENDAR_MONTH
          variant returns 910539 cents, because a 2026-07-28 settlement is inside
          the 30-day window but outside the August calendar month, and the
          STRUCTURING_SUSPICION report cites the calendar-month figure.
        test_recipe:
          setup:
            - "Two branches, BR-LHR (region SOUTH) and BR-CDG (region NORTH), each with a 20,000,000-cent vault limit and each carrying a PUBLISHED open-ended EUR rate card derived from the same 920000-micro wholesale mid (sell 878600)."
            - "Each branch holds an EUR position of 100 x 10000 notes."
            - "One customer with a PASSPORT expiring 2027-01-01."
            - "The customer settles an 80 x 10000 EUR sell (gross 910539 cents) at BR-LHR while the clock reads 2026-07-28T10:00:00Z."
            - "The clock is then moved to 2026-08-02T10:00:00Z and a second identical deal is quoted and authorized at BR-CDG."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { bra_id: $.data.id, bra_v0: $.data.version }
            - call: "POST /branches"
              payload: { code: "BR-CDG", name: "Paris CDG", region_code: "NORTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { brb_id: $.data.id, brb_v0: $.data.version }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { branch_id: "${bra_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${bra_v0}" }
              as: TreasuryOfficer
              captures: { carda_id: $.data.id }
            - call: "POST /rate-cards/${carda_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /rate-cards"
              payload: { branch_id: "${brb_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${brb_v0}" }
              as: TreasuryOfficer
              captures: { cardb_id: $.data.id }
            - call: "POST /rate-cards/${cardb_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /inventory-positions"
              payload: { branch_id: "${bra_id}", currency_code: "EUR", opening_denomination_mix: [{ denomination_minor_units: 10000, note_count: 100 }] }
              as: BranchManager
              captures: { posa_id: $.data.id }
            - call: "POST /inventory-positions"
              payload: { branch_id: "${brb_id}", currency_code: "EUR", opening_denomination_mix: [{ denomination_minor_units: 10000, note_count: 100 }] }
              as: BranchManager
              captures: { posb_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Bo Lindqvist", nationality_code: "SE", home_branch_id: "${bra_id}", id_document_type: "PASSPORT", id_document_number: "SE-882311", id_document_expiry: "2027-01-01T00:00:00Z" }
              as: BranchTeller
              captures: { cust_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-28T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${bra_id}", customer_id: "${cust_id}", rate_card_id: "${carda_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 80 }] }
              as: BranchTeller
              captures: { txn1_id: $.data.id }
            - call: "POST /exchange-transactions/${txn1_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-a"
            - call: "POST /exchange-transactions/${txn1_id}/settle"
              payload: {}
              as: BranchManager
              as_user_id: "u-mgr-a"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${brb_id}", customer_id: "${cust_id}", rate_card_id: "${cardb_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 80 }] }
              as: BranchTeller
              captures: { txn2_id: $.data.id }
            - call: "POST /exchange-transactions/${txn2_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-b"
          trigger:
            - call: "POST /exchange-transactions/${txn2_id}/settle"
              payload: {}
              as: BranchManager
              as_user_id: "u-mgr-b"
            - call: "GET /compliance-reports"
              payload: { customer_id: "${cust_id}", report_type: "STRUCTURING_SUSPICION" }
              as: ComplianceOfficer
              captures: { rep_id: "$.data[0].id" }
          assert:
            - "Customer.${cust_id}.rolling_30d_settled_usd_cents == 1821078"
            - "Customer.${cust_id}.calendar_month_settled_usd_cents == 910539"
            - "Customer.${cust_id}.near_threshold_txn_count == 2"
            - "Customer.${cust_id}.distinct_branch_count == 2"
            - "Customer.${cust_id}.structuring_risk_score == 74"
            - "Customer.${cust_id}.structuring_risk_tier == HIGH"
            - "Customer.${cust_id}.compliance_hold_active == true"
            - "ComplianceReport.${rep_id}.report_type == STRUCTURING_SUSPICION"
            - "ComplianceReport.${rep_id}.aggregate_usd_cents == 910539"
            - "ComplianceReport.${rep_id}.window_start == 2026-08-01T00:00:00Z"
            - "ComplianceReport.${rep_id}.window_end == 2026-08-02T10:00:00Z"
            - "ComplianceReport.${rep_id}.transaction_count == 1"
            - "ComplianceReport.${rep_id}.status == DRAFT"
            - "GET /compliance-reports?customer_id=${cust_id}&report_type=THRESHOLD_REPORT returns total_count == 0 because neither gross of 910539 reaches REPORT_THRESHOLD_CENTS"

  - rule_id: combinatorial_formula
    instances:
      - name: usd_conversion_round_per_line_then_sum_pinned_order
        grounds:
          - calculations.transaction_usd_conversion
          - calculations.transaction_fx_gross
          - entities.ExchangeTransaction.fields.quoted_usd_gross_cents
          - entities.ExchangeTransaction.fields.applied_rate_micros
        distinguishing_aspect: |
          Mode (b), rounding-order divergence inside a single formula: the pinned
          ROUND-PER-LINE-THEN-SUM order converts each requested denomination line
          independently (11382 + 5691 + 4553 = 21626 cents) whereas the equally
          plausible SUM-THEN-ROUND order over the same three lines gives 21625
          cents, a one-cent gap that only appears because three separate
          truncations each discard a fraction.
        test_recipe:
          setup:
            - "One branch BR-LHR with a 20,000,000-cent vault limit."
            - "EUR profile with denominations 500/1000/2000/5000/10000."
            - "One wholesale mid of 920000 micros effective 2026-07-01 and one PUBLISHED open-ended rate card with sell_spread_bps 450, so sell_rate_micros is 878600."
            - "One customer; no inventory position is needed because quoting does not draw on inventory."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card_id: "$.data.id" }
            - call: "POST /rate-cards/${card_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /customers"
              payload: { full_name: "Ana Ruiz", nationality_code: "ES", home_branch_id: "${br_id}" }
              as: BranchTeller
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 1 }, { denomination_minor_units: 5000, note_count: 1 }, { denomination_minor_units: 2000, note_count: 2 }] }
              as: BranchTeller
              captures: { txn_id: "$.data.id" }
          assert:
            - "ExchangeTransaction.${txn_id}.applied_rate_micros == 878600"
            - "ExchangeTransaction.${txn_id}.fx_gross_minor_units == 19000"
            - "ExchangeTransaction.${txn_id}.quoted_usd_gross_cents == 21626"
            - "ExchangeTransaction.${txn_id}.quoted_usd_gross_cents != 21625 (the SUM-THEN-ROUND reading of the same three lines)"
            - "ExchangeTransaction.${txn_id}.quoted_commission_cents == 757"
            - "ExchangeTransaction.${txn_id}.quoted_total_charge_cents == 22383"

      - name: commission_tier_keyed_on_basis_not_total_pinned_evaluation_order
        grounds:
          - calculations.transaction_commission_and_total
          - entities.ExchangeTransaction.fields.quoted_commission_cents
          - entities.ExchangeTransaction.fields.quoted_total_charge_cents
        distinguishing_aspect: |
          Mode (c), evaluation-order divergence in a different formula from the
          instance above: the pinned five-step order selects the commission tier
          from tier_basis (the gross, 24470 cents) BEFORE the total is formed,
          giving 856 and 25326; keying the tier off the already-assembled total
          (25326 cents, which has crossed the 25000-cent tier edge) gives 612 and
          25082 instead. The divergence is a tier selection, not a rounding gap.
        test_recipe:
          setup:
            - "Identical world to usd_conversion_round_per_line_then_sum_pinned_order: BR-LHR, EUR at sell_rate_micros 878600, one PUBLISHED rate card, one customer with no settlement history so tier_basis equals this deal's own gross."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card_id: "$.data.id" }
            - call: "POST /rate-cards/${card_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /customers"
              payload: { full_name: "Cai Wen", nationality_code: "SG", home_branch_id: "${br_id}" }
              as: BranchTeller
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 500, note_count: 3 }, { denomination_minor_units: 10000, note_count: 2 }] }
              as: BranchTeller
              captures: { txn_id: "$.data.id" }
          assert:
            - "ExchangeTransaction.${txn_id}.fx_gross_minor_units == 21500"
            - "ExchangeTransaction.${txn_id}.quoted_usd_gross_cents == 24470 (per-line 1707 + 22763)"
            - "ExchangeTransaction.${txn_id}.quoted_commission_cents == 856 (350 bps of 24470, tier selected from the 24470 basis)"
            - "ExchangeTransaction.${txn_id}.quoted_total_charge_cents == 25326"
            - "ExchangeTransaction.${txn_id}.quoted_commission_cents != 612 and quoted_total_charge_cents != 25082 (the reading that keys the tier off the assembled total 25326)"

      - name: corridor_inventory_target_nested_min_max_across_currency_classes
        grounds:
          - calculations.corridor_inventory_target
          - entities.InventoryPlan.fields.computed_targets
          - entities.CurrencyProfile.fields.currency_class
          - entities.CurrencyProfile.fields.export_limit_minor_units
          - state_machines.InventoryPlan.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a), nested min/max composition: the target is
          round_up_to_note(min(vault_share_cap, class_cap, raw_demand)) where the
          class_cap term only exists for RESTRICTED and EXOTIC currencies. Over one
          submit the MAJOR line resolves through the raw-demand branch (248400 ->
          250000) while the RESTRICTED line resolves through the class_cap branch
          (raw 621000 clamped to 2 x 200000 = 400000), so a flat max() or a
          single-cap reading cannot reproduce both numbers at once.
        test_recipe:
          setup:
            - "One branch BR-LHR with a 5,000,000-cent vault limit, so the 2500-bps plan share is 1,250,000 cents of USD headroom."
            - "EUR profile (MAJOR, no export limit, denominations 500/1000/2000/5000/10000) and MAD profile (RESTRICTED, export_limit_minor_units 200000, denominations 2000/10000)."
            - "Wholesale mids of 920000 micros for EUR and 10000000 micros for MAD, both effective 2026-07-01."
            - "One SUMMER corridor LHR-CMN running 2026-06-01 to 2026-09-01 with demand_index_bps 13500 and destination_currency_code MAD."
            - "A DRAFT plan for that branch and corridor with season_days 92 and no target lines yet."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 5000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /currencies"
              payload: { iso_code: "MAD", display_name: "Moroccan Dirham", minor_unit_digits: 2, currency_class: "RESTRICTED", standard_denominations: [2000, 10000], export_limit_minor_units: 200000, buyback_eligible: false }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_eur_id: "$.data.id" }
            - call: "POST /wholesale-rates"
              payload: { currency_code: "MAD", mid_rate_micros: 10000000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_mad_id: "$.data.id" }
            - call: "POST /travel-corridors"
              payload: { code: "LHR-CMN-SUMMER", origin_country_code: "GB", destination_country_code: "MA", destination_currency_code: "MAD", season: "SUMMER", season_start_date: "2026-06-01", season_end_date: "2026-09-01", demand_index_bps: 13500 }
              as: TreasuryOfficer
              captures: { corr_id: "$.data.id" }
            - call: "POST /inventory-plans"
              payload: { branch_id: "${br_id}", travel_corridor_id: "${corr_id}", season_days: 92 }
              as: BranchManager
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /inventory-plans/${plan_id}/submit"
              payload: { target_lines: [{ currency_code: "EUR", baseline_daily_minor_units: 2000 }, { currency_code: "MAD", baseline_daily_minor_units: 5000 }] }
              as: BranchManager
              as_user_id: "u-mgr-1"
          assert:
            - "InventoryPlan.${plan_id}.status == SUBMITTED"
            - "InventoryPlan.${plan_id}.computed_targets has exactly 2 entries ordered by currency_code ascending: EUR then MAD"
