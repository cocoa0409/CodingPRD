              payload: { ndc_code: "0006-0227", brand_name: "Immol", controlled: false, per_visit_max_units: 10, annual_max_units_per_prescriber: 100, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /field-force/products/${p_id}/sample-lots"
              payload: { lot_number: "LOT-IM1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 50 }
              as: PlatformAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /field-force/representatives/${rep_id}/lot-balances"
              payload: { lot_id: "${lot_id}", quantity: 20 }
              as: PlatformAdmin
              captures: { bal_id: $.data.id }
            - call: "POST /field-force/territories/${t_id}/target-list-entries"
              payload: { prescriber_id: "${h_id}", product_id: "${p_id}", tier: "B", planned_sample_units: 20 }
              as: DistrictManager
              captures: { e_id: $.data.id }
            - call: "POST /field-force/call-plans"
