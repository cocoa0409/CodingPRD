      - name: referral_above_the_fee_ceiling_returns_referral_fee_exceeded
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_REFERRAL_FEE_EXCEEDED
          - entities.AgentReferral.fields.referral_fee_bps
        distinguishing_aspect: "referral_fee_bps is capped at 2500: 2500 is admitted and 2501 is refused with ERR_REFERRAL_FEE_EXCEEDED, which is a distinct failure from the region partner-pool ERR_REGION_CAPACITY_EXCEEDED that shares priority 6a above it."
