      - name: duplicate_codes_and_duplicate_bids_are_both_422_after_the_occ_gate
        claim_type: Priority Ordering
        grounds:
          - errors.ERR_DUPLICATE_CODE
          - errors.ERR_DUPLICATE_BID
          - errors.ERR_STALE_POSTING_VERSION
          - concurrency_rules.bid-create-stale-posting
        distinguishing_aspect: "Uniqueness is priority 15, the OCC gate is priority 9: a driver's second bid on the same posting reports ERR_STALE_POSTING_VERSION (412) when it replays the pre-bid version, and only reveals ERR_DUPLICATE_BID (422) once it carries the current version. Store code uniqueness returns 422 rather than the 400 of a malformed request."
        test_recipe:
          setup:
            - "Store S-5006 exists. Posting P-6001 in DOM-V6 closes 2026-09-15 and driver D-V6 (safety 100) has bid once already."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-V6", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-C", mileage_cents_per_mile: 80, stop_cents_per_stop: 2000, drop_hook_cents: 1400, hourly_cents_per_minute: 40, minimum_daily_cents: 20000, backhaul_bonus_pct: 0.04 }
              as: PayrollAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /fleet/stores"
              payload: { store_code: "S-5006", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-V6", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-03-01" }
              as: TransportManager
              captures: { driver_id: $.data.id }
            - call: "POST /fleet/route-postings"
              payload: { route_code: "P-6001", domicile_id: "${dom_id}", weekly_miles: 2400, weekly_stops: 18, start_effective_date: "2026-10-01", bid_close_at: "2026-09-15T00:00:00Z" }
              as: TransportManager
              captures: { posting_id: $.data.id, v0: $.data.version }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_id}", expected_posting_version: "${v0}" }
              as: Driver
              as_user_id: "${driver_id}"
              captures: { bid_1: $.data.id, bid_status: $.data.status }
            - call: "GET /fleet/route-postings/${posting_id}"
              payload: {}
              as: TransportManager
              captures: { v1: $.data.version, bid_count: $.data.bid_count }
          trigger:
            - call: "POST /fleet/stores"
              payload: { store_code: "S-5006", region_code: "SOUTH", dock_count: 4, cases_per_hour_unload_rate: 900, dock_open_minute: 300, dock_close_minute: 1200 }
              as: FleetPlanner
              captures: { dup_code_err: $.data.error_id }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_id}", expected_posting_version: "${v0}" }
              as: Driver
              as_user_id: "${driver_id}"
              captures: { stale_err: $.data.error_id }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_id}", expected_posting_version: "${v1}" }
              as: Driver
              as_user_id: "${driver_id}"
              captures: { dup_bid_err: $.data.error_id }
            - call: "GET /fleet/route-bids"
              payload: { route_posting_id: "${posting_id}", limit: 10, offset: 0 }
              as: TransportManager
              captures: { only_bid: "$.data[0].id" }
          assert:
            - "${bid_status} == SUBMITTED and ${bid_count} == 1 with ${v1} == ${v0} + 1 - a bid bumps the posting's own version"
            - "${dup_code_err} == ERR_DUPLICATE_CODE with HTTP 422 - store_code is unique fleet-wide even under a different region"
            - "${stale_err} == ERR_STALE_POSTING_VERSION with HTTP 412 - the priority 9 OCC gate hides the duplicate"
            - "${dup_bid_err} == ERR_DUPLICATE_BID with HTTP 422 once the current version is supplied"
            - "${only_bid} == ${bid_1} and the listing reports total_count 1 - neither refused call created a row"

      - name: an_offer_that_is_not_under_review_refuses_revise_accept_and_reject
        claim_type: Satisfaction to Pass
        grounds:
          - errors.ERR_OFFER_NOT_UNDER_REVIEW
          - state_machines[BackhaulOffer]
        distinguishing_aspect: "ERR_OFFER_NOT_UNDER_REVIEW is the single code guarding three different triggers (revise, accept, reject) and it is keyed on the offer being UNDER_REVIEW, not merely alive: a freshly PROPOSED offer refuses all three, and the identical revise call succeeds the moment submit-review has run. The paired positive case also pins that a revise carrying only revenue_cents leaves cases, deadhead_miles and loaded_miles untouched."
        test_recipe:
          setup:
            - "Offer OF-V7 is PROPOSED at store S-5007: revenue 60000, cases 500, deadhead 40, loaded 160, DRY, expiring 2026-08-18 (the clock is 2026-08-01)."
            - "Variable cost is 200 * 185 + 500 * 9 = 41500, which the revise must reuse unchanged."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-5007", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_id: $.data.id }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "VENDOR_PICKUP", shipper_name: "Prairie Foods", origin_region_code: "MIDWEST", dest_store_id: "${store_id}", revenue_cents: 60000, cases: 500, weight_lbs: 11000, deadhead_miles: 40, loaded_miles: 160, temperature_mode: "DRY", pickup_window_start: "2026-08-19T12:00:00Z", pickup_window_end: "2026-08-19T20:00:00Z", offer_expires_at: "2026-08-18T00:00:00Z" }
              as: FleetPlanner
              captures: { offer_id: $.data.id, initial_status: $.data.status, initial_vc: $.data.variable_cost_cents, initial_round: $.data.review_round }
          trigger:
            - call: "POST /fleet/backhaul-offers/${offer_id}/revise"
              payload: { revenue_cents: 50000 }
              as: FleetPlanner
              captures: { revise_err: $.data.error_id }
            - call: "POST /fleet/backhaul-offers/${offer_id}/accept"
              payload: {}
              as: TransportManager
              captures: { accept_err: $.data.error_id }
            - call: "POST /fleet/backhaul-offers/${offer_id}/reject"
              payload: { reason_code: "LANE_DROPPED" }
              as: TransportManager
              captures: { reject_err: $.data.error_id }
            - call: "POST /fleet/backhaul-offers/${offer_id}/submit-review"
              payload: {}
              as: FleetPlanner
              captures: { sr_status: $.data.status, sr_vc: $.data.variable_cost_cents, sr_tier: $.data.tier_margin_pct, sr_comm: $.data.commission_cents, sr_cm: $.data.contribution_margin_cents, sr_margin: $.data.margin_pct }
            - call: "POST /fleet/backhaul-offers/${offer_id}/revise"
              payload: { revenue_cents: 50000 }
              as: FleetPlanner
              captures: { rv_status: $.data.status, rv_round: $.data.review_round, rv_cases: $.data.cases, rv_dead: $.data.deadhead_miles, rv_loaded: $.data.loaded_miles, rv_vc: $.data.variable_cost_cents, rv_tier: $.data.tier_margin_pct, rv_comm: $.data.commission_cents, rv_cm: $.data.contribution_margin_cents }
          assert:
            - "${initial_status} == PROPOSED with ${initial_vc} == 0 and ${initial_round} == 0 - creation does not run the margin calculation"
            - "${revise_err} == ERR_OFFER_NOT_UNDER_REVIEW with HTTP 409"
            - "${accept_err} == ERR_OFFER_NOT_UNDER_REVIEW with HTTP 409 - the money floor at priority 16 is never reached"
            - "${reject_err} == ERR_OFFER_NOT_UNDER_REVIEW with HTTP 409 - a PROPOSED offer is withdrawn, not rejected"
            - "${sr_status} == UNDER_REVIEW with ${sr_vc} == 41500, ${sr_tier} == 0.3083, ${sr_comm} == 3600, ${sr_cm} == 14900 and ${sr_margin} == 0.2483"
            - "${rv_status} == PROPOSED with ${rv_round} == 1, and ${rv_cases} == 500 / ${rv_dead} == 40 / ${rv_loaded} == 160 are unchanged by the partial body"
            - "${rv_vc} == 41500 still, but ${rv_tier} == 0.1700 now falls under the 0.2 tier so ${rv_comm} == 1500 and ${rv_cm} == 7000"

      - name: review_round_ceiling_and_the_accepted_to_proposed_reversal
        claim_type: Violation to Error
        grounds:
          - errors.ERR_REVIEW_ROUND_LIMIT
        distinguishing_aspect: "The bounded revision loop and its ERR_REVIEW_ROUND_LIMIT ceiling are exercised in full by the §1.8 instance below, including the fact that returning an ACCEPTED offer to PROPOSED does not reset the counter."
        excluded_because:
