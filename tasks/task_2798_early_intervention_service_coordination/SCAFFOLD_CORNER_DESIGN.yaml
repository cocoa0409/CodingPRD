  # ---------------------------------------------------------------------------
  # claim-extraction-guide.md -> "Complexity layers" (cross-cutting)
  # One instance per declared layer in §1.1 complexity_layers:
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  # selector_policy.
  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: stale_expected_referral_version_is_rejected_then_accepted_after_a_refresh
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[Referral.expected_referral_version]
          - endpoints[POST /ei/ifsps].input
          - errors[ERR_STALE_REFERRAL_VERSION]
        distinguishing_aspect: |
          The guard compares against the referral version at the moment of the write, and every
          intervening state transition bumps it: a version read before the eligibility determination
          is two increments behind by the time the plan is authored. The rejection is 412 with
          nothing written, and re-reading the referral makes the identical payload succeed, which
          proves the check is a version comparison rather than a state or payload validation.
        test_recipe:
          setup:
            - "Referral with both assessments COMPLETED; the referral version is captured BEFORE the eligibility determination and the entry-outcome measurement."
            - "Logical clock parked at 2026-03-20T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-19", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-03-18", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam_id}/complete"
              payload: { completion_date: "2026-03-19", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
              captures: { ref_v_stale: $.data.version }
            - call: "POST /ei/referrals/${ref_id}/eligibility-determination"
              payload: { is_eligible: true, determination_date: "2026-03-20" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/entry-outcomes"
              payload: { measurement_date: "2026-03-20", rating_social: 3, rating_knowledge: 4, rating_needs: 3 }
              as: Evaluator
          trigger:
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref_id}", ifsp_type: "INITIAL", meeting_date: "2026-03-20", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref_v_stale}" }
              as: ProgramAdmin
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
              captures: { ref_v_fresh: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref_id}", ifsp_type: "INITIAL", meeting_date: "2026-03-20", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref_v_fresh}" }
              as: ProgramAdmin
          assert:
            - "Trigger 1: HTTP 412 with response.data.error_id == \"ERR_STALE_REFERRAL_VERSION\""
            - "Trigger 1: no IFSP row exists for the referral afterwards (GET /ei/ifsps?referral_id=${ref_id} returns meta.total_count == 0) and Referral.${ref_id}.status is still \"IFSP_PENDING\""
            - "Trigger 2: response.data.version is strictly greater than ${ref_v_stale} — the determination and the entry-outcome write each incremented it"
            - "Trigger 3: HTTP 201 with response.data.status == \"DRAFT\" and ifsp_type == \"INITIAL\", from a payload identical to trigger 1 except for the version"
            - "Trigger 3: the plan creation is what the 412 blocked, so the retry needs no state change — only the refreshed version"

      - name: coordinator_selector_ranks_by_projected_utilization_then_created_at
        claim_type: selector_policy
        grounds:
          - calculations.coordinator_auto_selection
          - calculations.case_weight_points
          - endpoints[POST /ei/referrals/{referralId}/assign-coordinator].input
        distinguishing_aspect: |
          Four assignments with coordinator_id omitted walk every layer of the selector in order.
          The first shows ranking on PROJECTED utilization rather than on points, so the newest
          coordinator with the largest cap wins; the second is a three-way tie on the rounded ratio
          broken by created_at ASC in favour of the oldest row; the third is a two-way tie among the
          remaining pair; the fourth shows the language clause filtering before ranking, so the only
          Spanish-speaking coordinator is selected despite having the highest projected utilization
          of the candidates. The out-of-county coordinator has the lowest utilization throughout and
          is never selected.
        test_recipe:
          setup:
            - "Coordinators created in this order: coord_1 (CNT_A, [EN], cap 6.00), coord_2 (CNT_A, [EN, ES], cap 6.00), coord_3 (CNT_A, [EN], cap 12.00), coord_4 (CNT_B, [EN], cap 12.00)."
            - "Four children in CNT_A, all with third birthdays far beyond the 180-day proximity bonus; child D speaks ES and its referral requires an interpreter, so its projected weight is 2.00 while the others are 1.50."
            - "Logical clock parked at 2026-03-02T09:00:00Z; the language clause reads the referred child's primary_language."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 6.00 }
              as: ProgramAdmin
              captures: { coord_1: $.data.id }
            - call: "POST /ei/service-coordinators"
