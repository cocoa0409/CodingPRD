      - name: closed_runway_blocks_flight_creation
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=7]
          - endpoints[POST /runways/{id}/close]
          - errors[ERR_RUNWAY_CLOSED]
        distinguishing_aspect: |
          The posture of a referenced configuration row, not of the flight
          being created, decides the outcome: after POST /runways/{id}/close
          the same well-formed body that succeeded a moment earlier is refused
          with ERR_RUNWAY_CLOSED (409), ahead of the slot-capacity and
          occupancy checks further down the ladder.
        test_recipe:
          setup:
            - "AC1, R1 with the [15,30) band and STD-2026; one flight is created successfully on the open runway; the runway is then closed."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1602", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id }
            - call: "POST /runways/${rw}/close"
              payload: {}
              as: LoadControlAdmin
          trigger:
            - call: "POST /flights"
              payload: { flight_number: "LX1670", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T13:20:00Z", scheduled_on_block_utc: "2026-08-15T15:00:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
          assert:
            - "HTTP 409 with data.error_id == \"ERR_RUNWAY_CLOSED\""
            - "Runway.${rw}.status == \"CLOSED\""
