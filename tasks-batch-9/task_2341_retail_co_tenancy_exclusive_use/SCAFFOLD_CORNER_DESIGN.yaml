  - name: go_dark_multi_level_cascade_covered_by_difficulty
    claim_type: conditional_cascade
    grounds:
    - state_machines.Lease.premises_status.OPEN_to_DARK
    - state_machines.EstoppelCertificate.status.TENANT_SIGNED_to_STALE
    excluded_because:
      difficulty_instance: transitive_cascade / go_dark_cascades_through_occupancy_condition_remedy_and_estoppel
      rationale: The five-hop conditional cascade and every side effect along it is the asserted subject of that §1.8 instance.
  - name: notice_dispute_cycle_covered_by_difficulty
    claim_type: cyclic
    grounds:
    - state_machines.UseViolationNotice.status.DISPUTED_to_ISSUED
    - entities.UseViolationNotice.fields.cure_restart_count
    excluded_because:
      difficulty_instance: non_linear_state_machine / notice_dispute_denied_returns_to_issued_and_restarts_cure
      rationale: The ISSUED -> DISPUTED -> ISSUED loop and its cure_restart_count termination counter are that instance's asserted subject.
  - name: lease_parallel_dimensions_covered_by_difficulty
    claim_type: parallel
    grounds:
    - state_machines.Lease.premises_status
    - state_machines.Lease.remedy_status
    excluded_because:
      difficulty_instance: non_linear_state_machine / lease_dark_dimension_moves_while_remedy_dimension_holds
      rationale: Independent movement of the two Lease state dimensions and the legality of the combined (DARK, REMEDY_ACTIVE) state are asserted there.
