      - name: ledger_running_total_after_credit_and_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: funding_reversal_restores_money_conservation_and_ledger_sum
          rationale: "The aggregation claims - running total correct after an add, correct after a reversal, and the signed ledger sum matching the derived balance - are the whole substance of that compensating_invariant instance, which walks ROLLOVER_IN, CONTRIBUTION and FUNDING_REVERSAL and checks every balance_after_cents."

      - name: exclusion_split_variant_delta_on_identical_inputs
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: election_exclusion_split_elected_vs_funded_basis_divergence
          rationale: "Same-data / two-variant divergence with an explicit delta is that dual_variant_calc instance: 18000 stored pre-tax yields 12500 under elected_basis and 18000 under funded_basis, delta 5500, on one Election row."

      - name: month_close_variant_selected_by_employee_status
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: month_close_standard_vs_termination_variant_bucket_split
          rationale: "Variant selection by context is exactly what that instance asserts - two accounts with identical 12000-cent balances closed in the same request pick standard_close vs termination_close purely from Employee.status."

      - name: funded_basis_recompute_reconciles_into_the_contribution_entry
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: election_exclusion_split_elected_vs_funded_basis_divergence
          rationale: "The variant switch's ledger reconciliation is asserted there: after the elected_basis 12500 is replaced by the funded_basis 18000 at lock, the CONTRIBUTION entry, contributed_cents and available_balance_cents all carry 18000 rather than the stale elected figure."

