          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "One agency created in agreement_status PENDING and training_status REQUIRED."
            - "Training completed 2026-07-01 (training_expires_at 2027-07-01) and an agreement covering 2026-07-01 .. 2028-06-30, so the agreement outlives the training by a year."
