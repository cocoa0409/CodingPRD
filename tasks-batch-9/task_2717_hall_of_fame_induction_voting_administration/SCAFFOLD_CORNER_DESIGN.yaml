        grounds:
          - rbac.IndependentAuditor.exclusive_operations
          - endpoints[GET /vote-submissions/{id}]
          - entities.VoteSubmission.fields.selected_slot_ids
        distinguishing_aspect: |
          Ballot confidentiality is an RBAC rule about a FIELD, not an endpoint: the elector who cast
          the submission may read the row - status, selection_count, timestamps - but
          selected_slot_ids comes back null, while the auditor reading the identical row sees the real
          array. Both calls are 200, so a system that simply denied the endpoint to electors would be
          wrong in the opposite direction.
