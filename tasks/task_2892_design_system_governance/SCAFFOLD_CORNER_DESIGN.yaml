              as_user_id: "${team_id}"
              captures: { view_trailing: $.data.view, index_trailing: $.data.adoption_index }
          assert:
            - "${june_ratio} == 60.00 and ${july_ratio} == 90.00"
            - "${view_default} == LATEST_SCAN and ${index_default} == 63.00"
            - "${code_ratio} == 90.00 and ${lint_ratio} == 0.00 and ${kinds} == 1"
            - "${view_trailing} == TRAILING_WINDOW and ${index_trailing} == 52.50"
            - "${stored_latest} == 63.00 and ${stored_trailing} == 52.50"

      - name: governance_sweep_and_latest_evidence_diverge_on_identical_audit_rows
        claim_type: Variant Divergence
        grounds:
          - calculations.a11y_conformance_score
        excluded_because:
          difficulty_instance: dual_variant_calc / a11y_governance_sweep_scores_below_latest_evidence
          rationale: "Same-data / two-variants divergence with the exact delta is the entire subject of the named §1.8 instance."

      - name: adoption_latest_and_trailing_diverge_on_identical_scan_rows
        claim_type: Variant Divergence
        grounds:
          - calculations.team_adoption_index
        excluded_because:
          difficulty_instance: dual_variant_calc / team_adoption_trailing_window_reads_below_latest_scan
          rationale: "The named §1.8 instance already computes both variants over one scan set and asserts the delta on both stored Team fields."

      - name: notice_window_threshold_is_inclusive_at_the_required_day_count
        claim_type: threshold
        grounds:
          - calculations.deprecation_notice_window
          - validations[priority=25]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / deprecation_notice_gate_outranks_window_overlap_gate
          rationale: "The named §1.8 instance exercises the notice-day threshold together with the window geometry, including the inclusive boundary."

      - name: release_bump_reaches_a_single_forward_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.release_version_bump
        excluded_because:
          difficulty_instance: combinatorial_formula / release_bump_pins_breaking_ratio_to_step_two_classes
          rationale: "Propagation through the six pinned steps, and the refusal to re-run steps 3-5 to a naive fixed point, is exactly what the named §1.8 instance asserts."

  - section: validations
    instances:
      - name: unknown_owning_team_id_in_the_body_is_refused_by_the_fk_existence_gate
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - errors[ERR_TEAM_NOT_FOUND]
          - endpoints["POST /design-system/components"]
        distinguishing_aspect: |
          Priority 5 covers foreign keys carried in the request body, not only path ids: a
          syntactically perfect component creation whose owning_team_id is a well-formed UUID
          that resolves to nothing must be refused with ERR_TEAM_NOT_FOUND at 404 (not
          ERR_INVALID_REQUEST at 400), and no Component row may be created.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "no Team with id 00000000-0000-4000-8000-00000000dead exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "00000000-0000-4000-8000-00000000dead", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TEAM_NOT_FOUND"
            - "HTTP status == 404"
            - "GET /design-system/components with limit 100 / offset 0 returns total_count == 0"

      - name: ship_gate_reads_only_the_greatest_sequence_automated_audit
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=13]
          - calculations.a11y_conformance_score
          - endpoints["POST /design-system/platform-implementations/{id}/ship"]
        distinguishing_aspect: |
          Priority 13 is satisfied by remediation, not by an unblemished history: an
          implementation whose first AUTOMATED AA audit reported 2 critical violations may still
          ship once a later AUTOMATED AA audit reports 0, because the gate selects the
          greatest-audit_sequence row. The ship must succeed at 200 with status SHIPPED, and the
          implementation's latest_evidence conformance_score must be 75.00 (100 - 25.00 for the
          missing MANUAL method), proving the clean row - not the historic one - was selected.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` owns Component `badge` with a PLANNED WEB implementation"
            - "two AUTOMATED AA audits on that implementation: sequence 1 with 2 critical, sequence 2 clean"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "0.9.0", token_compliance_ratio: 0.80 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id, impl_status: $.data.status }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 2, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/web-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { seq_1: $.data.audit_sequence, load_1: $.data.defect_load }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/web-2" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { seq_2: $.data.audit_sequence, load_2: $.data.defect_load }
          trigger:
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { status_after: $.data.status, score_after: $.data.conformance_score, shipped_at: $.data.shipped_at }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { coverage: $.data.coverage_state, shipped_count: $.data.shipped_platform_count }
          assert:
            - "${impl_status} == PLANNED"
            - "${seq_1} == 1 and ${load_1} == 20 and ${seq_2} == 2 and ${load_2} == 0"
            - "HTTP status == 200"
            - "${status_after} == SHIPPED and ${score_after} == 75.00"
            - "${shipped_at} == 2026-08-01T00:00:00.000Z"
            - "${coverage} == WEB_ONLY and ${shipped_count} == 1"

      - name: path_existence_is_checked_before_contributing_team_ownership
        claim_type: Cascading validation
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_COMPONENT_NOT_FOUND]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          The ownership check at priority 6 cannot run until the path id has been resolved at
          priority 4, so it must not be allowed to answer first: the same ContributingTeam caller
          gets ERR_COMPONENT_NOT_FOUND (404) for an unknown component id and
          ERR_NOT_RESOURCE_OWNER (403) for a real component owned by a different team. An
          implementation that evaluated ownership first would return 403 in both cases and leak
          the non-existence of the id.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` owns Component `badge`; Team `growth` owns nothing"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { owner_team: $.data.id }
            - call: "POST /design-system/teams"
              payload: { name: "Growth", slug: "growth", platform_scope: "WEB_ONLY", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { other_team: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${owner_team}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /design-system/components/00000000-0000-4000-8000-0000000000ff/platform-implementations"
              payload: { platform: "WEB", package_name: "@growth/badge-web", package_version: "1.0.0" }
              as: ContributingTeam
              as_user_id: "${other_team}"
              captures: { err_missing: $.data.error_id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@growth/badge-web", package_version: "1.0.0" }
              as: ContributingTeam
              as_user_id: "${other_team}"
              captures: { err_owner: $.data.error_id }
          assert:
            - "${err_missing} == ERR_COMPONENT_NOT_FOUND with HTTP status 404"
            - "${err_owner} == ERR_NOT_RESOURCE_OWNER with HTTP status 403"
            - "GET /design-system/components/${comp_id}/platform-implementations returns total_count == 0"

      - name: the_publish_false_announce_gate_applies_only_to_stable_components
        claim_type: Conditional validation
        grounds:
          - validations[priority=24]
          - state_machines.DeprecationPlan.transitions["DRAFT->ANNOUNCED"]
          - errors[ERR_MIGRATION_GUIDE_REQUIRED]
          - endpoints["POST /design-system/deprecation-plans/{id}/migration-guide"]
        distinguishing_aspect: |
          The same request - migration-guide with publish=false - must succeed or fail purely on
          the target component's maturity_level: on an EXPERIMENTAL component it parks the plan
          at migration_guide_state DRAFT with state DRAFT and returns 200, while on a STABLE
          component it is refused with ERR_MIGRATION_GUIDE_REQUIRED at 422 because a STABLE
          component may not be announced without a published guide. The STABLE plan must be left
          entirely untouched (migration_guide_state MISSING, migration_guide_url null).
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge` promoted EXPERIMENTAL -> BETA -> STABLE (docs PUBLISHED, WEB+IOS shipped with clean AUTOMATED and MANUAL AA audits, score 100.00, coverage PARTIAL)"
            - "Component `chip` left EXPERIMENTAL with no implementations"
            - "a DRAFT DeprecationPlan on each: badge with a 111-day notice (required 105 = STABLE 90 + PARTIAL 15), chip with a 19-day notice (required 14)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}", docs_state: "PUBLISHED" }
              as: DesignSystemLead
              captures: { badge_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Chip", slug: "chip", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { chip_id: $.data.id }
            - call: "POST /design-system/components/${badge_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.99 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { web_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${web_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/web-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${web_id}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/web-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "GET /design-system/platform-implementations/${web_id}"
              payload: {}
              as: DesignSystemLead
              captures: { web_score: $.data.conformance_score }
            - call: "POST /design-system/platform-implementations/${web_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.99 }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/components/${badge_id}/promote-maturity"
              payload: { target_maturity_level: "BETA" }
              as: DesignSystemLead
              captures: { beta_level: $.data.maturity_level }
            - call: "POST /design-system/components/${badge_id}/platform-implementations"
              payload: { platform: "IOS", package_name: "DSBadge", package_version: "1.0.0", token_compliance_ratio: 0.99 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { ios_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${ios_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/ios-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${ios_id}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/ios-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${ios_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.99 }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/components/${badge_id}/promote-maturity"
              payload: { target_maturity_level: "STABLE" }
              as: DesignSystemLead
              captures: { stable_level: $.data.maturity_level, stable_score: $.data.governance_conformance_score, stable_coverage: $.data.coverage_state }
            - call: "POST /design-system/components/${badge_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-11-20T00:00:00.000Z", removal_at: "2026-12-25T00:00:00.000Z" }
              as: DesignSystemLead
              captures: { badge_plan: $.data.id, badge_required: $.data.required_notice_days, badge_actual: $.data.actual_notice_days }
            - call: "POST /design-system/components/${chip_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-09-25T00:00:00.000Z" }
              as: DesignSystemLead
              captures: { chip_plan: $.data.id, chip_required: $.data.required_notice_days }
          trigger:
            - call: "POST /design-system/deprecation-plans/${chip_plan}/migration-guide"
              payload: { migration_guide_url: "https://ds.example.com/migrate/chip", publish: false }
              as: DesignSystemLead
              captures: { chip_guide_state: $.data.migration_guide_state, chip_state: $.data.state, chip_lifecycle_url: $.data.migration_guide_url }
            - call: "POST /design-system/deprecation-plans/${badge_plan}/migration-guide"
              payload: { migration_guide_url: "https://ds.example.com/migrate/badge", publish: false }
              as: DesignSystemLead
              captures: { err: $.data.error_id }
            - call: "GET /design-system/components/${badge_id}/deprecation-plans"
              payload: { limit: 100, offset: 0 }
              as: DesignSystemLead
              captures: { badge_guide_state: $.data.0.migration_guide_state, badge_state: $.data.0.state, badge_url: $.data.0.migration_guide_url }
            - call: "GET /design-system/components/${badge_id}"
              payload: {}
              as: DesignSystemLead
              captures: { badge_lifecycle: $.data.lifecycle_state }
          assert:
            - "${web_score} == 100.00 and ${beta_level} == BETA"
            - "${stable_level} == STABLE and ${stable_score} == 100.00 and ${stable_coverage} == PARTIAL"
            - "${badge_required} == 105 and ${badge_actual} == 111 and ${chip_required} == 14"
            - "${chip_guide_state} == DRAFT and ${chip_state} == DRAFT and ${chip_lifecycle_url} == https://ds.example.com/migrate/chip"
            - "${err} == ERR_MIGRATION_GUIDE_REQUIRED"
            - "HTTP status == 422"
            - "${badge_guide_state} == MISSING and ${badge_state} == DRAFT and ${badge_url} == null"
            - "${badge_lifecycle} == ACTIVE"

      - name: two_individually_affordable_grants_breach_the_budget_collectively
        claim_type: Aggregate validation
        grounds:
          - validations[priority=30]
          - calculations.exception_debt_points
          - errors[ERR_TEAM_DEBT_BUDGET_EXCEEDED]
          - entities.Team.fields.outstanding_debt_points
        distinguishing_aspect: |
          The budget gate is an aggregate, not a per-grant, check: against a 20.00 budget each
          10.50 one-off grant is individually affordable, but approving the second one would take
          outstanding to 21.00, so it must be refused with ERR_TEAM_DEBT_BUDGET_EXCEEDED at 422
          with the second grant left in REQUESTED and outstanding_debt_points still 10.50. An
          implementation that only compared grant_points to the budget would approve both.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` with debt_budget_points 20.00; EXPERIMENTAL Component `badge`"
            - "two REQUESTED ONE_OFF_COMPONENT / ALL grants worth 10.50 each; the first already approved"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 20.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/exception-grants"
              payload: { requesting_team_id: "${team_id}", substitute_for_component_id: "${comp_id}", exception_kind: "ONE_OFF_COMPONENT", platform_scope: "ALL", justification: "campaign badge one", expires_at: "2026-10-01T00:00:00.000Z" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { g1: $.data.id }
            - call: "POST /design-system/exception-grants"
              payload: { requesting_team_id: "${team_id}", substitute_for_component_id: "${comp_id}", exception_kind: "ONE_OFF_COMPONENT", platform_scope: "ALL", justification: "campaign badge two", expires_at: "2026-10-01T00:00:00.000Z" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { g2: $.data.id }
            - call: "POST /design-system/exception-grants/${g1}/decision"
              payload: { decision: "APPROVE", decision_notes: "first campaign only" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { g1_state: $.data.state, g1_points: $.data.debt_points }
            - call: "GET /design-system/teams/${team_id}"
              payload: {}
              as: DesignSystemLead
              captures: { out_1: $.data.outstanding_debt_points, state_1: $.data.debt_state }
          trigger:
            - call: "POST /design-system/exception-grants/${g2}/decision"
              payload: { decision: "APPROVE", decision_notes: "second campaign" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { err: $.data.error_id }
            - call: "GET /design-system/exception-grants/${g2}"
              payload: {}
              as: DesignSystemLead
              captures: { g2_state: $.data.state, g2_points: $.data.debt_points, g2_decided: $.data.decided_at }
            - call: "GET /design-system/teams/${team_id}"
              payload: {}
              as: DesignSystemLead
              captures: { out_2: $.data.outstanding_debt_points, life_2: $.data.lifetime_debt_points, state_2: $.data.debt_state }
          assert:
            - "${g1_state} == APPROVED and ${g1_points} == 10.50"
            - "${out_1} == 10.50 and ${state_1} == CLEAR"
            - "${err} == ERR_TEAM_DEBT_BUDGET_EXCEEDED"
            - "HTTP status == 422"
            - "${g2_state} == REQUESTED and ${g2_points} == 0.00 and ${g2_decided} == null"
            - "${out_2} == 10.50 and ${life_2} == 10.50 and ${state_2} == CLEAR"

      - name: promotion_conformance_gate_answers_before_the_deprecation_gate
        claim_type: Priority Ordering
        grounds:
          - validations[priority=12]
          - validations[priority=15]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / promotion_conformance_gate_outranks_deprecation_in_progress_gate
          rationale: "Two simultaneously violated promotion gates and the assertion that the lower priority number wins is exactly the named §1.8 instance."

      - name: exception_state_gate_answers_before_the_budget_gate
        claim_type: Priority conflict
        grounds:
          - validations[priority=7]
          - validations[priority=30]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / exception_state_gate_outranks_debt_budget_gate
          rationale: "The named §1.8 instance already violates priority 7 and priority 30 in one request and asserts the 409 rather than the 422."

      - name: proposal_creation_depends_on_the_author_teams_debt_state
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=29]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / proposal_creation_refused_because_author_team_debt_state_is_frozen
          rationale: "The named §1.8 instance tests the same rule from both sides of the other entity's state (CLEAR passes, FROZEN refuses)."

      - name: deprecation_windows_touching_at_an_instant_do_not_overlap
        claim_type: Temporal validation
        grounds:
          - validations[priority=26]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / deprecation_windows_touching_at_removal_instant_are_admitted
          rationale: "Half-open window adjacency at the removal instant, and the one-millisecond earlier collision, are the named §1.8 instance's whole content."

  - section: endpoints
    instances:
      - name: dependency_edge_is_created_read_and_repinned_through_its_own_routes
        claim_type: Standard CRUD
        grounds:
          - endpoints["POST /design-system/components/{id}/dependencies"]
          - endpoints["GET /design-system/components/{id}/dependencies"]
          - endpoints["PUT /design-system/component-dependencies/{id}"]
          - entities.ComponentDependency.fields.compatibility_state
        distinguishing_aspect: |
          The three dependency routes must agree on one row: creating the edge with
          pinned_provider_major 2 against a provider still on major 1 yields compatibility_state
          INCOMPATIBLE and lifts the consumer's blocked_dependency_count to 1 at creation time
          (not lazily at ship time); the list route surfaces the same row under direction
          CONSUMES for the consumer and PROVIDES for the provider; and the re-pin to 1 flips it
          back to COMPATIBLE, drops blocked_dependency_count to 0 and increments both the edge's
          version and the consumer Component's version.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` owns Component `badge` (consumer) and Component `icon` (provider, current_major_version 1)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { consumer: $.data.id, consumer_v0: $.data.version }
            - call: "POST /design-system/components"
              payload: { name: "Icon", slug: "icon", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { provider: $.data.id, provider_major: $.data.current_major_version }
          trigger:
            - call: "POST /design-system/components/${consumer}/dependencies"
              payload: { provider_component_id: "${provider}", pinned_provider_major: 2 }
              as: DesignSystemLead
              captures: { dep_id: $.data.id, dep_state: $.data.compatibility_state, dep_v0: $.data.version }
            - call: "GET /design-system/components/${consumer}"
              payload: {}
              as: DesignSystemLead
              captures: { blocked_1: $.data.blocked_dependency_count, consumer_v1: $.data.version }
            - call: "GET /design-system/components/${consumer}/dependencies"
              payload: { direction: "CONSUMES", limit: 100, offset: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { listed_id: $.data.0.id, listed_pin: $.data.0.pinned_provider_major }
            - call: "PUT /design-system/component-dependencies/${dep_id}"
              payload: { pinned_provider_major: 1 }
              as: DesignSystemLead
              captures: { dep_state_2: $.data.compatibility_state, dep_v1: $.data.version, dep_pin_2: $.data.pinned_provider_major }
            - call: "GET /design-system/components/${consumer}"
              payload: {}
              as: DesignSystemLead
              captures: { blocked_2: $.data.blocked_dependency_count, consumer_v2: $.data.version }
          assert:
            - "${provider_major} == 1 and ${consumer_v0} == 1"
            - "${dep_state} == INCOMPATIBLE and ${dep_v0} == 1 with HTTP status 201"
            - "${blocked_1} == 1 and ${consumer_v1} == 2"
            - "${listed_id} == ${dep_id} and ${listed_pin} == 2"
            - "GET /design-system/components/${provider}/dependencies with direction PROVIDES returns total_count == 1 and that row's id == ${dep_id}"
            - "${dep_state_2} == COMPATIBLE and ${dep_pin_2} == 1 and ${dep_v1} == 2"
            - "${blocked_2} == 0 and ${consumer_v2} == 3"

