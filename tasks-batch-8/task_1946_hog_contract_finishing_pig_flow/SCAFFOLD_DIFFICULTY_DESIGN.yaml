            - { call: "POST /pig-groups/${group_id}/mortality-reports", payload: { report_date: "2026-03-20", mortality_count: 80, cull_count: 0, reason_code: "DISEASE" }, as: Grower, as_user_id: "${grower_id}" }
            - { call: "GET /pig-groups/${group_id}", payload: {}, as: FieldTech, captures: { grp_status: $.data.group_status, mort_pct: $.data.mortality_pct } }
            - { call: "GET /settlements", payload: { group_id: "${group_id}" }, as: IntegratorAdmin, captures: { sett_id: "$.data[0].id" } }
          assert:
            - "Second report (120+80 == 200 == head_placed) is accepted (reconciliation uses > not >=)"
            - "Link 1-2: PigGroup.mortality_total == 200, mortality_pct == 100.0, head_current == 0, group_status == CLOSED (${grp_status})"
            - "Link 3: Settlement FINALIZED with head_marketed == 0, fcr is null, adg_lbs is null (zero-marketed branch)"
            - "Settlement.bonus_cents == 0 (mortality 100.0 > 5.00 gate), base_pay_cents == 800000, total_pay_cents == 800000"
            - "Barn of the group: barn_status == WASH_REQUIRED"

  # ---------------------------------------------------------------- rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_feed_order_on_cancelled_group
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_GROUP_NOT_ACTIVE]
          - errors[ERR_FEED_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair = state vs business_fiscal. One request violates both: the group is
          CANCELLED (state) AND 999999999 lbs exceeds any feed budget (fiscal). The state
          check (priority 7) MUST win over the fiscal check (priority 12).
        test_recipe:
          setup:
            - "Contract A ACTIVE; group G1 SCHEDULED then cancelled (never placed)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /pig-groups/${group_id}/cancel", payload: {}, as: FieldTech }
          trigger:
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 999999999, requested_delivery_date: "2026-03-05" }, as: FieldTech, captures: { err_id: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_GROUP_NOT_ACTIVE (${err_id}) — state beats fiscal"
            - "The response is NOT ERR_FEED_BUDGET_EXCEEDED even though quantity 999999999 also breaks the fiscal gate"

      - name: safety_vs_temporal_dispatch_wash_unverified_and_stale
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_WASH_NOT_VERIFIED]
          - errors[ERR_WASH_STALE]
        distinguishing_aspect: |
          Category pair = business_safety vs business_temporal. The referenced wash is BOTH
          unverified (safety) and 100h old (temporal stale). Safety (priority 8) MUST win
          over temporal (priority 9).
        test_recipe:
          setup:
            - "Contract A ACTIVE; group 500 head PLACED; slot 2026-07-13 (window 240-320, cap 500); load 100 head SCHEDULED"
            - "TruckWash recorded with washed_at 2026-07-03T20:00:00Z; clock 2026-07-08T00:00:00Z (100h stale); never verified"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-08T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 100, expected_slot_version: "${slot1_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "POST /truck-washes", payload: { truck_code: "T-1", washed_at: "2026-07-03T20:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { wash1: $.data.id } }
          trigger:
            - { call: "POST /market-loads/${load1}/dispatch", payload: { truck_wash_id: "${wash1}" }, as: TransportCoordinator, captures: { err_id: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_WASH_NOT_VERIFIED (${err_id}) — safety beats temporal"
            - "The response is NOT ERR_WASH_STALE even though the wash is also 100h > 48h old"
            - "MarketLoad.${load1}.load_status remains SCHEDULED"

  # ---------------------------------------------------------------- rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: slot_capacity_exact_fit_then_one_over
        grounds:
          - calculations.slot_reserved_head
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric = head-count capacity on PackerSlot via POST /market-loads. The gate is
          reserved + new <= capacity (equality ALLOWED): 170 + 170 == 340 succeeds and flips
          the slot FULL; one more head (341st) is rejected. Tests the <= vs < boundary.
        test_recipe:
          setup:
            - "Contract A ACTIVE; group 1000 head PLACED; slot 2026-07-13 capacity 340 (window 240-320)"
