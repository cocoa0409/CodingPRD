              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /prt/participants/${pa_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "1 Ashcroft Way", confirmed_postal_code: "18042" }
              as: PlanAdministrator
