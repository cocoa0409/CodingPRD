errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_USER_NOT_FOUND, http: 401, condition: "X-User-ID does not resolve to an ACTIVE User" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-template resource id does not exist" }
  - { id: ERR_FOREIGN_KEY_NOT_FOUND, http: 422, condition: "Body-referenced FK (clause_template_id, playbook_id, etc.) does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body or missing required field (e.g., decision_rationale on REJECT)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is in a state where the requested transition is not allowed" }
  - { id: ERR_PLAYBOOK_EMPTY, http: 409, condition: "Cannot publish a Playbook with zero ClauseTemplates" }
  - { id: ERR_PLAYBOOK_NO_ACTIVE_CLAUSES, http: 409, condition: "Cannot publish a Playbook whose ClauseTemplates are all RETIRED" }
  - { id: ERR_PLAYBOOK_NOT_ACTIVE, http: 409, condition: "Operation requires parent Playbook.status == ACTIVE" }
  - { id: ERR_PLAYBOOK_IN_USE, http: 409, condition: "Cannot deprecate Playbook referenced by non-terminal Negotiation" }
  - { id: ERR_PLAYBOOK_STALE, http: 409, condition: "Playbook.version advanced past Negotiation.playbook_version_at_pin and no override supplied" }
  - { id: ERR_CLAUSE_HAS_OPEN_DEVIATIONS, http: 409, condition: "Cannot retire clause referenced by Deviation in {OPEN, IN_REVIEW, ESCALATED}" }
  - { id: ERR_CONTRACT_TYPE_IN_USE, http: 409, condition: "Cannot retire ContractType referenced by non-terminal Negotiation" }
  - { id: ERR_CONTRACT_TYPE_INACTIVE, http: 409, condition: "IntakeRequest references a ContractType that is not ACTIVE" }
  - { id: ERR_THRESHOLDS_NOT_MONOTONIC, http: 422, condition: "ContractType thresholds not strictly ascending (low < mid < high)" }
  - { id: ERR_COUNTERPARTY_SANCTIONED, http: 409, condition: "Counterparty.risk_tier == SANCTIONED blocks triage" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match current entity version" }
  - { id: ERR_DEVIATION_ALREADY_OPEN, http: 409, condition: "An ESCALATED Deviation already exists for this (negotiation, clause); cannot create a fresh one" }
  - { id: ERR_FALLBACK_INDEX_OUT_OF_RANGE, http: 422, condition: "fallback_index not -1 and not within 0..len(fallback_positions)-1" }
  - { id: ERR_DEVIATIONS_BLOCKING_ROUND_CLOSE, http: 409, condition: "blocking_deviation_count > 0 prevents round close" }
  - { id: ERR_DEVIATIONS_UNRESOLVED, http: 409, condition: "finalize-redlining attempted while approval_status not in {NO_DEVIATIONS, APPROVED_WITH_DEVIATIONS}" }
  - { id: ERR_ROUND_ALREADY_OPEN, http: 409, condition: "A NegotiationRound with status == OPEN already exists" }
  - { id: ERR_NOT_ASSIGNED_APPROVER, http: 403, condition: "Actor is not the assigned approver on this Deviation (and not CHIEF_COUNSEL)" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Approver is also the drafter of this Negotiation" }
  - { id: ERR_INSUFFICIENT_APPROVER_ROLE, http: 403, condition: "Approver primary_role below required_approver_role" }
  - { id: ERR_NOT_DRAFTER, http: 403, condition: "Only the negotiation's drafter may withdraw its deviations" }
  - { id: ERR_SEVERITY_NOT_ESCATABLE, http: 409, condition: "Deviation on a clause with deviation_severity_cap == LOW cannot be escalated" }
  - { id: ERR_SIGNATORY_OUT_OF_ORDER, http: 409, condition: "Signatory attempting to sign before prior-order signatories have signed" }
  - { id: ERR_SIGNATORY_AUTHORITY_EXCEEDED, http: 403, condition: "User.can_sign_above_cents <= Negotiation.contract_value_cents (strict > required)" }
  - { id: ERR_SIGNATURE_WINDOW_VIOLATION, http: 409, condition: "Signature or execution timestamp outside [window_opens_at, window_closes_at]" }
  - { id: ERR_SIGNATURE_INCOMPLETE, http: 409, condition: "record-execution attempted before SignaturePacket.status == FULLY_SIGNED" }
  - { id: ERR_SIGNATURE_ALREADY_STARTED, http: 409, condition: "Void attempted after at least one signature recorded" }
  - { id: ERR_SIGNATURE_ALREADY_FINAL, http: 409, condition: "Abort attempted when SignaturePacket is FULLY_SIGNED or EXECUTION_RECORDED" }
  - { id: ERR_SIGNATURE_PACKET_ALREADY_ACTIVE, http: 409, condition: "Another SignaturePacket is in ROUTING/PARTIALLY_SIGNED/FULLY_SIGNED for this negotiation" }

roles:
  - name: ContractAnalyst
    description: "Files intake, runs triage, opens rounds and deviations, withdraws own drafts"
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /intake-requests"
      - "POST /intake-requests/{id}/triage"
      - "POST /intake-requests/{id}/reject"
      - "POST /intake-requests/{id}/cancel"
      - "POST /intake-requests/{id}/open-negotiation"
      - "POST /negotiations/{id}/rounds"
      - "POST /negotiations/{id}/rounds/{rid}/close"
      - "POST /negotiations/{nid}/deviations/{did}/withdraw"
    shared_operations:
      - "POST /negotiations/{nid}/deviations (shared with LegalCounsel)"
      - "POST /negotiations/{id}/abort (shared with LegalCounsel)"
      - "POST /counterparties (shared with OpsAdmin)"

  - name: BusinessOwner
    description: "Default business owner; approves operational-fallback deviations"
    identity: "entity_backed:User"
    exclusive_operations: []
    shared_operations:
      - "POST /intake-requests (shared with ContractAnalyst)"
      - "POST .../deviations/{did}/begin-review (shared with LegalCounsel, FinanceController, ChiefCounsel)"
      - "POST .../deviations/{did}/decide (shared with LegalCounsel, FinanceController, ChiefCounsel)"

  - name: LegalCounsel
    description: "General counsel; approves most deviations, finalizes redlining, creates signature packets"
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /negotiations/{id}/finalize-redlining"
      - "POST /negotiations/{id}/signature-packets"
      - "POST /negotiations/{id}/signature-packets/{pid}/void"
    shared_operations:
      - "POST /negotiations/{nid}/deviations (shared with ContractAnalyst)"
      - "POST /negotiations/{id}/abort (shared with ContractAnalyst)"
      - "POST .../deviations/{did}/begin-review (shared)"
      - "POST .../deviations/{did}/decide (shared)"

  - name: FinanceController
    description: "Approves COMMERCIAL deviations on high-value contracts"
    identity: "entity_backed:User"
    exclusive_operations: []
    shared_operations:
      - "POST .../deviations/{did}/begin-review (shared)"
      - "POST .../deviations/{did}/decide (shared)"
      - "GET /analytics/* (shared with LegalCounsel, ChiefCounsel, OpsAdmin)"

  - name: ChiefCounsel
    description: "Publishes playbooks, retires clauses, final approver on escalated/high-severity deviations"
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /playbooks"
      - "POST /playbooks/{id}/publish"
      - "POST /playbooks/{id}/deprecate"
      - "POST /playbooks/{id}/clauses"
      - "POST /playbooks/{id}/clauses/{cid}/retire"
    shared_operations:
      - "POST .../deviations/{did}/begin-review (shared)"
      - "POST .../deviations/{did}/decide (shared)"
      - "GET /analytics/* (shared)"

  - name: Signatory
    description: "Executes signature packets within authority ceiling"
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST .../signature-packets/{pid}/sign"
      - "POST .../signature-packets/{pid}/record-execution"
    shared_operations: []

  - name: OpsAdmin
    description: "Platform operator; manages users, contract types, clock; creates counterparties"
    identity: "opaque"
    exclusive_operations:
      - "POST /users"
      - "POST /contract-types"
      - "POST /contract-types/{id}/retire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /playbooks (shared with ChiefCounsel)"
      - "POST /counterparties (shared with ContractAnalyst)"
      - "GET /analytics/* (shared)"
