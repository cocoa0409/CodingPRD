# §1.9 Scaffold Corner Design (breadth coverage of testable claims not in §1.8).
# Same 7-point contract + §1.5 reachability gates as §1.8.
scaffold_corner_design:

  # ----------------------------------------------------------------- Entities
  - section: entities
    instances:
      - name: create_listing_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Listing.fields.status, endpoints]
        distinguishing_aspect: "POST /listings with required fields -> 201; status defaults DRAFT, version 1, reserved_nights_count 0, id/created_at server-minted."
        test_recipe:
          setup: ["A host exists."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "c1@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "New Yurt", site_type: "YURT", max_guests: 3, base_nightly_rate_cents: 15000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
          assert:
            - "Listing.${listing_id}.status == DRAFT"
            - "Listing.${listing_id}.version == 1"
            - "Listing.${listing_id}.reserved_nights_count == 0"
            - "Listing.${listing_id}.min_nights == 1 (default applied)"

      - name: create_listing_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /listings omitting site_type -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A host exists."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "c2@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "No Type", max_guests: 3, base_nightly_rate_cents: 15000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: create_listing_invalid_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Listing.fields.site_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /listings with site_type='CASTLE' (not in enum) -> ERR_VALIDATION."
        test_recipe:
          setup: ["A host exists."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "c3@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "Bad Enum", site_type: "CASTLE", max_guests: 3, base_nightly_rate_cents: 15000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: get_listing_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /listings/{unknown-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /listings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: booking_computed_nights_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.nights, calculations.booking_quote_total]
        distinguishing_aspect: "nights is computed from check_out-check_in (3), not client-supplied; quoted_total_cents computed at request."
        test_recipe:
          setup: ["Listing LISTED (rate @20000, min_nights 1); guest exists."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "c4@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "G", email: "cg4@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "Comp Cabin", site_type: "CABIN", max_guests: 4, min_nights: 1, base_nightly_rate_cents: 20000, cleaning_fee_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "CAMPING", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z", nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { lv: $.data.version }
          trigger:
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-07-10T00:00:00Z", check_out: "2026-07-13T00:00:00Z", guest_count: 2, expected_listing_version: "${lv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.nights == 3"
            - "Booking.${booking_id}.quoted_total_cents == 60000"

  # ----------------------------------------------------------- State Machines
  - section: state_machines
    instances:
      - name: submit_permit_from_approved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Permit.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /permits/{id}/submit on an APPROVED permit -> ERR_INVALID_STATE (submit only from DRAFT or REJECTED)."
        test_recipe:
          setup: ["Permit APPROVED."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "s1@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "S Cabin", site_type: "CABIN", max_guests: 4, base_nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "STRUCTURE", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
          trigger:
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: decision_on_already_decided_permit_returns_already_decided
        claim_type: Idempotency
        grounds: ["validations[priority=7]", "errors[ERR_PERMIT_ALREADY_DECIDED]"]
        distinguishing_aspect: "A second POST /permits/{id}/decision on an APPROVED permit -> ERR_PERMIT_ALREADY_DECIDED (decision only from SUBMITTED)."
        test_recipe:
          setup: ["Permit APPROVED."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "s2@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "S2 Cabin", site_type: "CABIN", max_guests: 4, base_nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "STRUCTURE", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
          trigger:
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "REJECT" }
              as: PermitReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERMIT_ALREADY_DECIDED"

      - name: cancel_from_requested_returns_not_cancellable
        claim_type: Invalid Transitions
        grounds: ["validations[priority=8]", "errors[ERR_BOOKING_NOT_CANCELLABLE]", state_machines.Booking.CONFIRMED_to_CANCELLED]
        distinguishing_aspect: "POST /bookings/{id}/cancel on a REQUESTED (not yet accepted) booking -> ERR_BOOKING_NOT_CANCELLABLE."
        test_recipe:
          setup: ["Booking REQUESTED (not accepted) on a LISTED listing."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "s3@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "G", email: "sg3@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "S3 Cabin", site_type: "CABIN", max_guests: 4, min_nights: 1, base_nightly_rate_cents: 20000, cleaning_fee_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "CAMPING", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z", nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { lv: $.data.version }
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-07-10T00:00:00Z", check_out: "2026-07-12T00:00:00Z", guest_count: 2, expected_listing_version: "${lv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BOOKING_NOT_CANCELLABLE"

      - name: checkin_before_check_in_date_returns_too_early
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=22]", "errors[ERR_CHECKIN_TOO_EARLY]", state_machines.Booking.CONFIRMED_to_CHECKED_IN]
        distinguishing_aspect: "check-in while clock (default 2026-07-01) < check_in (2026-07-10) -> ERR_CHECKIN_TOO_EARLY."
        test_recipe:
          setup: ["Booking CONFIRMED for 07-10..07-13; clock at default 2026-07-01."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "s4@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "G", email: "sg4@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "S4 Cabin", site_type: "CABIN", max_guests: 4, min_nights: 1, base_nightly_rate_cents: 20000, cleaning_fee_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "CAMPING", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z", nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { lv: $.data.version }
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-07-10T00:00:00Z", check_out: "2026-07-13T00:00:00Z", guest_count: 2, expected_listing_version: "${lv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/accept"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/check-in"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHECKIN_TOO_EARLY"

      - name: full_booking_lifecycle_complete_settles_ledger
        claim_type: Valid Transition
        grounds: [state_machines.Booking.CHECKED_IN_to_COMPLETED, calculations.payout_final, entities.Host.fields.paid_out_cents]
        distinguishing_aspect: "REQUESTED->CONFIRMED->CHECKED_IN->COMPLETED settles payout 77750 to paid_out and increments completed_stays_count."
        test_recipe:
          setup: ["Booking 07-10..07-13 CONFIRMED (rate @25000, cleaning 5000); clock advanced to 07-11 for check-in."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "s5@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "G", email: "sg5@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "S5 Yurt", site_type: "YURT", max_guests: 4, min_nights: 2, base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, cancellation_policy: "MODERATE" }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "STRUCTURE", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", nightly_rate_cents: 25000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { lv: $.data.version }
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-07-10T00:00:00Z", check_out: "2026-07-13T00:00:00Z", guest_count: 2, expected_listing_version: "${lv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/accept"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/check-in"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/complete"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
          assert:
            - "Booking.${booking_id}.status == COMPLETED and payment_status == PAID"
            - "Host.${host_id}.paid_out_cents == 77750 and pending_payout_cents == 0"
            - "Host.${host_id}.completed_stays_count == 1"

  # -------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: seasonal_rate_overlap_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=15]", "errors[ERR_RATE_OVERLAP]"]
        distinguishing_aspect: "Adding a rate window [07-05,07-20) overlapping an existing [07-01,07-15) -> ERR_RATE_OVERLAP (409)."
        test_recipe:
          setup: ["Listing with one rate window 07-01..07-15."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "v1@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "V1 Cabin", site_type: "CABIN", max_guests: 4, base_nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-07-15T00:00:00Z", nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-05T00:00:00Z", end_date: "2026-07-20T00:00:00Z", nightly_rate_cents: 22000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RATE_OVERLAP"

      - name: booking_night_without_rate_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=14]", "errors[ERR_NO_RATE_FOR_DATES]"]
        distinguishing_aspect: "Requesting a stay whose nights fall outside every SeasonalRate window -> ERR_NO_RATE_FOR_DATES."
        test_recipe:
          setup: ["Listing LISTED with a July rate window only; guest requests an August stay."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "H", email: "v2@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "G", email: "vg2@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "V2 Cabin", site_type: "CABIN", max_guests: 4, min_nights: 1, base_nightly_rate_cents: 20000, cleaning_fee_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "CAMPING", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z", nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { lv: $.data.version }
          trigger:
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-08-10T00:00:00Z", check_out: "2026-08-12T00:00:00Z", guest_count: 2, expected_listing_version: "${lv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_RATE_FOR_DATES"

      - name: booking_guest_count_over_max_rejected
        claim_type: Violation to Error
