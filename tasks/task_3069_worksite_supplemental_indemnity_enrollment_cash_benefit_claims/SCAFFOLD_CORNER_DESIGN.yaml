            - { call: "POST /enrollment-campaigns/${cb2_cam}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${gb}", employee_ref: "EB2", full_name: "Emp GB", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { eb2: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cb2_cam}", employee_id: "${eb2}", policy_series_id: "${sb2}" }, as: BenefitCounselor, captures: { pb2: $.data.id } }
            - { call: "POST /policies/${pb2}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /claims", payload: { policy_id: "${pb2}", event_code: "B2", service_date: "2026-09-05T00:00:00Z", diagnosis_code: "D-B2", claimed_occurrences: 1 }, as: ClaimsAdjuster, captures: { clb1: $.data.id } }
            - { call: "POST /claims/${clb1}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claim-documents", payload: { claim_id: "${clb1}", doc_type: "ITEMIZED_BILL", content_ref: "ref-b1" }, as: ClaimsAdjuster, captures: { docb1: $.data.id } }
          trigger:
            - { call: "POST /claims/${clb1}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster, captures: { err_b1: $.data.error_id } }
            - { call: "POST /claim-documents/${docb1}/reject", payload: {}, as: ClaimsAdjuster }
