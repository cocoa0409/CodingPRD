scenario: |
  Generate task harder than expert level!

  2747. Appraisal Review & Reconsideration of Value (lender appraisal desk): appraisal receipt with
  automated rule checks on completeness, comparable selection and adjustment magnitudes, desk review
  escalation to field review or second appraisal by risk tier, borrower-initiated reconsideration of
  value intake with a structured evidence submission channel, bias and discrimination indicator
  screening in narrative language and comparable selection, appraiser communication rules preserving
  independence, dispute resolution with the appraisal management company and appraiser response
  deadlines, value revision documentation and loan decision impacts, appraiser panel performance
  monitoring and removal process

domain_name: lender-appraisal-review-desk
api_prefix: "/appraisal-desk"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Appraiser <-> AMC is a true many-to-many resolved by the PanelMembership junction entity;
  # Appraisal.supersedes_appraisal_id is self-referential; ValueRevision.source_ref_id is
  # polymorphic across ROVRequest / EscalationOrder / DisputeCase. No entity is URL-nested more
  # than one level, and every cross-link is an explicit foreign key rather than a path ancestor.

  state_machine_shape: cyclic
  # ROVRequest cycles RESPONDED -> INTAKE across negotiation rounds; Appraisal cycles
  # QUARANTINED -> {quarantine_return_status} on bias appeal; EscalationOrder cycles
  # ASSIGNED -> REASSIGNMENT_REQUIRED -> ASSIGNED. Appraisal additionally carries two
  # independent state dimensions (review_status x bias_screen_status) on the same row, and
  # DeskReview forks SUBMITTED -> {ACCEPTED, ESCALATED, RETURNED} with divergent side effects.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # The reviewer who submits a DeskReview may not be the actor who decides it; appraiser
  # communication rights are partitioned by role so the lender-facing roles cannot exert
  # value influence on the appraiser.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 15 entities, 52 endpoints, 48 error codes, 42 ordered validations,
  # 12 calculations (2 of them dual-variant), 11 state-machine dimensions,
  # 3 OCC concurrency rules, 7 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_conventions:
  logical_clock: |
    The server keeps a logical UTC clock that starts at exactly 2026-08-01T00:00:00Z and is only
    moved by POST /appraisal-desk/_clock/set_current_utc. Every created_at / updated_at / sent_at
    stamp, every deadline computation, and every rolling-window filter reads this logical clock,
    never the host wall clock. The clock may be set to any instant, forward or backward.
  money: "All monetary amounts are integer cents. No floats are persisted."
  basis_points: |
    All ratio-valued fields are integer basis points (bps; 10000 bps == 100%). Every bps value is
    produced with round_half_up to zero decimal places unless a calculation pins a different order.
  rounding: "round_half_up everywhere. Halves round away from zero."
  identity: |
    `id` values are server-minted UUID4 strings with no type prefix. They identify resources in
    paths and foreign keys and MUST NEVER participate in any selector, ranking, tie-break,
    ordering, or conflict-resolution decision. Where a deterministic ordering fallback is needed
    the scaffold uses `created_at ASC`.

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: LoanFile
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: loan_number
        type: string
        source: input
        description: "Lender loan identifier."
        constraints: "1-32 chars; unique across LoanFile."
      - name: loan_purpose
        type: enum
        source: input
        description: "Whether the collateral value is capped by a contract price."
        constraints: "PURCHASE | REFINANCE"
      - name: market_type
        type: enum
        source: input
        description: "Market classification that selects the comparable distance ceiling."
        constraints: "URBAN | SUBURBAN | RURAL"
      - name: risk_tier
        type: enum
        source: input
        description: "Credit risk tier that selects the desk-review escalation matrix row."
        constraints: "LOW | STANDARD | ELEVATED | HIGH"
      - name: loan_amount_cents
        type: integer
        source: input
        description: "Requested loan principal in cents."
        constraints: "> 0"
      - name: contract_price_cents
        type: integer
        source: input
        description: "Purchase contract price in cents; null for REFINANCE."
        default: null
        constraints: "Required and > 0 when loan_purpose == PURCHASE; MUST be null when REFINANCE."
      - name: borrower_display_name
        type: string
        source: input
        description: "Borrower name shown on ROV correspondence."
      - name: underwriting_status
        type: enum
        source: system
        description: "Loan decision dimension; moved by POST underwriting-status and by the DENIAL_RECOMMENDED / recovery cascades."
        default: SUBMITTED
        constraints: "SUBMITTED | CONDITIONALLY_APPROVED | SUSPENDED | CLOSED | WITHDRAWN"
      - name: collateral_status
        type: enum
        source: computed
        description: "Collateral dimension derived from the value-of-record appraisal's review_status."
        default: PENDING_APPRAISAL
        constraints: "PENDING_APPRAISAL | UNDER_REVIEW | VALUE_ACCEPTED | VALUE_CONTESTED | VALUE_REVISED | QUARANTINED"
      - name: value_of_record_appraisal_id
        type: string
        source: computed
        description: "Denormalised pointer to the Appraisal currently designated value-of-record; null until a DeskReview is ACCEPTED or an EscalationOrder completes. Not a declarative foreign key -- the authoritative reverse lookup is GET /appraisal-desk/appraisals?loan_file_id=<id>."
        default: null
      - name: current_appraised_value_cents
        type: integer
        source: computed
        description: "Value of record: Appraisal.reported_value_cents plus the signed sum of every ValueRevision.delta_cents on the value-of-record appraisal. Null while no appraisal is designated."
        default: null
      - name: effective_value_cents
        type: integer
        source: computed
        description: "min(current_appraised_value_cents, contract_price_cents) for PURCHASE; current_appraised_value_cents for REFINANCE."
        default: null
      - name: ltv_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * loan_amount_cents / effective_value_cents)."
        default: null
      - name: decision_impact
        type: enum
        source: computed
        description: "Loan decision impact tier selected from ltv_bps by the ltv_and_decision_impact calculation."
        default: null
        constraints: "NO_IMPACT | PRICING_ADJUSTMENT | CONDITION_REQUIRED | DENIAL_RECOMMENDED"
      - name: rov_request_count
        type: integer
        source: computed
        description: "Count of ROVRequest rows whose loan_file_id is this LoanFile."
        default: 0

  - name: Appraiser
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: "Appraiser legal name."
      - name: license_number
        type: string
        source: input
        description: "State appraiser license number."
        constraints: "Unique across Appraiser."
      - name: license_state
        type: string
        source: input
        description: "Two-letter state code of the appraiser's license."
        constraints: "Exactly 2 uppercase letters."
      - name: panel_status
        type: enum
        source: input
        description: "Panel standing. Settable at creation; thereafter mutated only by the Appraiser panel_status state machine (explicit panel-review actions and the performance-score cascade)."
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED | REMOVED"
      - name: probation_started_at
        type: datetime
        source: system
        description: "Logical-clock instant at which panel_status last became PROBATION; null otherwise."
        default: null
      - name: removal_reason
        type: string
        source: system
        description: "Reason recorded when panel_status became REMOVED."
        default: null
      - name: performance_score_bps
        type: integer
        source: computed
        description: "appraiser_performance_score, ROLLING_12M variant."
        default: 10000
      - name: lifetime_performance_score_bps
        type: integer
        source: computed
        description: "appraiser_performance_score, LIFETIME variant."
        default: 10000
      - name: revision_rate_bps
        type: integer
        source: computed
        description: "ROLLING_12M revision rate: round_half_up(10000 * windowed_revisions / windowed_total_appraisals), 0 when the denominator is 0."
        default: 0
      - name: total_appraisal_count
        type: integer
        source: computed
        description: "ROLLING_12M count of Appraisal rows authored by this appraiser with review_status != SUPERSEDED."
        default: 0
      - name: substantiated_bias_count
        type: integer
        source: computed
        description: "Lifetime count of BiasIndicatorFlag rows with status == SUBSTANTIATED on appraisals authored by this appraiser. Decremented when a SUBSTANTIATED flag is reversed to CLEARED on appeal."
        default: 0
      - name: sla_miss_count
        type: integer
        source: computed
        description: "Lifetime count of DisputeCase rows for this appraiser with responded_late == true."
        default: 0
      - name: open_assignment_count
        type: integer
        source: computed
        description: "count(EscalationOrder where assigned_appraiser_id == this.id AND status IN {ASSIGNED, REASSIGNMENT_REQUIRED})."
        default: 0
      - name: completed_assignment_count
        type: integer
        source: computed
        description: "count(EscalationOrder where assigned_appraiser_id == this.id AND status == COMPLETED)."
        default: 0
      - name: panel_membership_count
        type: integer
        source: computed
        description: "count(PanelMembership where appraiser_id == this.id AND status == ACTIVE)."
        default: 0

  - name: AMC
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: "Appraisal management company name."
        constraints: "Unique across AMC."
      - name: sla_response_hours
        type: integer
        source: input
        description: "Hours the AMC has to route an appraiser response to a DisputeCase."
        default: 72
        constraints: ">= 1"
      - name: concurrent_dispute_capacity
        type: integer
        source: input
        description: "Maximum number of mutually overlapping DisputeCase review slots this AMC can host."
        default: 2
        constraints: ">= 1"
      - name: escalation_budget_cents
        type: integer
        source: input
        description: "Ceiling on ytd_escalation_spend_cents chargeable to this AMC."
        default: 500000
        constraints: ">= 0"
      - name: panel_status
        type: enum
        source: input
        description: "AMC standing. Settable at creation; thereafter mutated only by the AMC panel_status state machine (dispute SLA breach cascade)."
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED"
      - name: ytd_escalation_spend_cents
        type: integer
        source: computed
        description: "sum(EscalationOrder.total_cost_cents where amc_id == this.id AND status IN {ASSIGNED, REASSIGNMENT_REQUIRED, COMPLETED})."
        default: 0
      - name: sla_breach_count
        type: integer
        source: computed
        description: "count(DisputeCase where amc_id == this.id AND responded_late == true) plus count(DisputeCase where amc_id == this.id AND status == RESOLVED_BY_DEFAULT)."
        default: 0
      - name: open_dispute_count
        type: integer
        source: computed
        description: "count(DisputeCase where amc_id == this.id AND status IN {OPEN, APPRAISER_RESPONDED})."
        default: 0

  - name: PanelMembership
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: appraiser_id
        type: string
        source: input
        description: "FK -> Appraiser.id; the panel appraiser."
      - name: amc_id
        type: string
        source: input
        description: "FK -> AMC.id; the management company whose panel the appraiser sits on."
      - name: coverage_state
        type: string
        source: input
        description: "Two-letter state code this membership covers."
        constraints: "Exactly 2 uppercase letters."
      - name: tier
        type: enum
        source: input
        description: "Assignment tier the appraiser is approved for on this panel."
        constraints: "GENERAL | COMPLEX | REVIEW_SPECIALIST"
      - name: status
        type: enum
        source: system
        description: "ACTIVE until a later membership for the same (appraiser_id, amc_id, coverage_state) supersedes it."
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"

  - name: Appraisal
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: loan_file_id
        type: string
        source: input
        description: "FK -> LoanFile.id; the loan this report values."
      - name: appraiser_id
        type: string
        source: input
        description: "FK -> Appraiser.id; the author of the report."
      - name: amc_id
        type: string
        source: input
        description: "FK -> AMC.id; the management company that delivered the report."
      - name: supersedes_appraisal_id
        type: string
        source: input
        description: "FK -> Appraisal.id; self-referential pointer to the appraisal this delivery replaces. Null for a first delivery."
        default: null
      - name: report_form_type
        type: enum
        source: input
        description: "URAR form used."
        constraints: "FORM_1004 | FORM_1073 | FORM_2055"
      - name: effective_date
        type: datetime
        source: input
        description: "Effective date of value."
        constraints: "MUST be <= the logical clock at intake."
      - name: reported_value_cents
        type: integer
        source: input
        description: "Value opinion as originally reported by the appraiser."
        constraints: "> 0"
      - name: sections_present
        type: array
        source: input
        description: "Report sections the delivery contains."
        constraints: "Subset of {SUBJECT, CONTRACT, NEIGHBORHOOD, SITE, IMPROVEMENTS, SALES_COMPARISON, RECONCILIATION, CERTIFICATION, ADDENDA, MARKET_CONDITIONS}; no duplicates."
      - name: exhibit_count
        type: integer
        source: input
        description: "Number of exhibits (photos, sketches, maps) attached."
        constraints: ">= 0"
      - name: narrative_text
        type: string
        source: input
        description: "Free-text narrative and neighbourhood commentary screened for prohibited terms."
      - name: subject_census_tract_band
        type: enum
        source: input
        description: "Demographic band of the subject property's census tract, used only for comparable-selection skew screening."
        constraints: "A | B | C | D"
      - name: review_status
        type: enum
        source: system
        description: "Review lifecycle dimension. Independent of bias_screen_status."
        default: RECEIVED
        constraints: "RECEIVED | RULES_CLEARED | RULES_FLAGGED | IN_DESK_REVIEW | VALUE_ACCEPTED | ESCALATED | RETURNED_TO_AMC | VALUE_CONTESTED | VALUE_REVISED | QUARANTINED | SUPERSEDED"
      - name: bias_screen_status
        type: enum
        source: system
        description: "Bias screening dimension. Independent of review_status."
        default: NOT_SCREENED
        constraints: "NOT_SCREENED | CLEAR | INDICATED | SUBSTANTIATED | CLEARED_ON_REVIEW"
      - name: quarantine_return_status
        type: enum
        source: system
        description: "review_status snapshot taken when the appraisal entered QUARANTINED; the value review_status is restored to when the quarantine is lifted on appeal."
        default: null
        constraints: "Any review_status value other than QUARANTINED or SUPERSEDED, or null."
      - name: completeness_score_bps
        type: integer
        source: computed
        description: "appraisal_completeness_score output; written only by run-rule-checks."
        default: null
      - name: eligible_comp_count
        type: integer
        source: computed
        description: "count(ComparableSale where appraisal_id == this.id AND included_in_grid == true)."
        default: 0
      - name: closed_comp_count
        type: integer
        source: computed
        description: "count(ComparableSale where appraisal_id == this.id AND included_in_grid == true AND sale_status == CLOSED)."
        default: 0
      - name: max_gross_adjustment_bps
        type: integer
        source: computed
        description: "max over eligible comparables of ComparableSale.gross_adjustment_bps; 0 when the eligible set is empty."
        default: 0
      - name: max_net_adjustment_bps
        type: integer
        source: computed
        description: "max over eligible comparables of ComparableSale.net_adjustment_bps; 0 when the eligible set is empty."
        default: 0
      - name: indicated_value_cents
        type: integer
        source: computed
        description: "reconciled_indicated_value output; null when eligible_comp_count == 0."
        default: null
      - name: variance_vs_reported_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * abs(indicated_value_cents - reported_value_cents) / reported_value_cents); null when indicated_value_cents is null."
        default: null
      - name: bias_risk_index
        type: integer
        source: computed
        description: "bias_risk_index output on a 0-100 scale; written only by run-bias-screen."
        default: null
      - name: current_value_cents
        type: integer
        source: computed
        description: "reported_value_cents plus the signed sum of every ValueRevision.delta_cents on this appraisal."
        default: null
      - name: rule_check_fail_count
        type: integer
        source: computed
        description: "count(RuleCheckResult where appraisal_id == this.id AND outcome == FAIL) from the most recent run-rule-checks."
        default: 0
      - name: rule_check_warn_count
        type: integer
        source: computed
        description: "count(RuleCheckResult where appraisal_id == this.id AND outcome == WARN) from the most recent run-rule-checks."
        default: 0

  - name: ComparableSale
    parent: Appraisal
    common_fields: true
    entity_kind: resource
    fields:
      - name: appraisal_id
        type: string
        source: system
        description: "FK -> Appraisal.id; taken from the path, never the body."
      - name: street_address
        type: string
        source: input
        description: "Comparable street address; uniqueness is checked on the case-folded, whitespace-collapsed form."
      - name: sale_price_cents
        type: integer
        source: input
        description: "Unadjusted sale price in cents."
        constraints: "> 0"
      - name: gross_adjustment_cents
        type: integer
        source: input
        description: "Sum of the absolute values of every line adjustment applied to this comparable."
        constraints: ">= 0"
      - name: net_adjustment_cents
        type: integer
        source: input
        description: "Signed sum of every line adjustment applied to this comparable."
      - name: distance_miles
        type: number
        source: input
        description: "Distance from the subject property, two decimal places."
        constraints: ">= 0; at most 2 decimal places."
      - name: sale_date
        type: datetime
        source: input
        description: "Date the comparable transaction closed or listed."
        constraints: "MUST be <= the parent Appraisal.effective_date."
      - name: sale_status
        type: enum
        source: input
        description: "Transaction status of the comparable."
        constraints: "CLOSED | PENDING | ACTIVE_LISTING"
      - name: dwelling_type
        type: enum
        source: input
        description: "Dwelling type of the comparable."
        constraints: "SFR | CONDO | TOWNHOUSE | MULTI_2_4"
      - name: census_tract_band
        type: enum
        source: input
        description: "Demographic band of the comparable's census tract, used only for selection-skew screening."
        constraints: "A | B | C | D"
      - name: included_in_grid
        type: boolean
        source: input
        description: "Whether the comparable participates in the sales-comparison grid."
        default: true
      - name: adjusted_price_cents
        type: integer
        source: computed
        description: "sale_price_cents + net_adjustment_cents."
      - name: gross_adjustment_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * gross_adjustment_cents / sale_price_cents)."
      - name: net_adjustment_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * abs(net_adjustment_cents) / sale_price_cents)."

  - name: RuleCheckResult
    parent: Appraisal
    common_fields: false
    entity_kind: event
    fields:
      - name: appraisal_id
        type: string
        source: system
        description: "FK -> Appraisal.id; the appraisal the check ran against."
      - name: sequence_no
        type: integer
        source: computed
        description: "Fixed emission order 1..8; the run always writes all eight rows in this order."
        constraints: "1..8"
      - name: check_code
        type: enum
        source: computed
        description: "Which automated rule check this row records."
        constraints: "CHK_COMPLETENESS | CHK_COMP_COUNT | CHK_COMP_DISTANCE | CHK_COMP_AGE | CHK_GROSS_ADJUSTMENT | CHK_NET_ADJUSTMENT | CHK_VALUE_RECONCILIATION | CHK_FORM_TYPE"
      - name: outcome
        type: enum
        source: computed
        description: "Severity of the check result."
        constraints: "PASS | WARN | FAIL"
      - name: observed_value
        type: string
        source: computed
        description: "Stringified observed metric that produced the outcome."
      - name: detail
        type: string
        source: computed
        description: "Human-readable explanation of the outcome."

  - name: BiasIndicatorFlag
    parent: Appraisal
    common_fields: true
    entity_kind: resource
    fields:
      - name: appraisal_id
        type: string
        source: system
        description: "FK -> Appraisal.id; the screened appraisal."
      - name: source
        type: enum
        source: computed
        description: "Which screening channel raised the flag."
        constraints: "NARRATIVE | COMP_SELECTION"
      - name: indicator_code
        type: string
        source: computed
        description: "TERM_<index> for narrative hits (index is the 1-based position in PROHIBITED_TERMS), or COMP_BAND_SKEW for the selection-skew flag."
      - name: matched_text
        type: string
        source: computed
        description: "The prohibited term as declared in PROHIBITED_TERMS for NARRATIVE flags; null for COMP_SELECTION flags."
        default: null
      - name: severity_weight
        type: integer
        source: computed
        description: "NARRATIVE_TERM_WEIGHT for narrative flags; round_half_up(comp_skew_bps / COMP_SKEW_DIVISOR) for the selection-skew flag."
      - name: status
        type: enum
        source: system
        description: "Adjudication state."
        default: OPEN
        constraints: "OPEN | CLEARED | SUBSTANTIATED"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ChiefAppraiser who last adjudicated the flag."
        default: null
      - name: rationale
        type: string
        source: input
        description: "Adjudication rationale supplied on the last adjudicate call."
        default: null

  - name: AppraiserCommunication
    parent: Appraisal
    common_fields: false
    entity_kind: event
    fields:
      - name: appraisal_id
        type: string
        source: system
        description: "FK -> Appraisal.id; the appraisal the message concerns."
      - name: sender_role
        type: string
        source: system
        description: "X-User-Role of the sender."
      - name: sender_user_id
        type: string
        source: system
        description: "X-User-ID of the sender."
      - name: recipient
        type: enum
        source: input
        description: "Who the message is addressed to."
        constraints: "APPRAISER | AMC | LENDER_DESK"
      - name: intent
        type: enum
        source: input
        description: "Declared purpose of the message; screened against the sender role's allowed intent set."
        constraints: "ORDER_STATUS | DELIVERY_LOGISTICS | REPORT_CLARIFICATION | COMPARABLE_SUGGESTION | VALUE_INFLUENCE | DEADLINE_PRESSURE"
      - name: body
        type: string
        source: input
        description: "Message body, retained verbatim for the independence audit trail."
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock instant the message was accepted."

  - name: DeskReview
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: appraisal_id
        type: string
        source: input
        description: "FK -> Appraisal.id; the appraisal under desk review."
      - name: status
        type: enum
        source: system
        description: "Desk review lifecycle."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | ESCALATED | RETURNED | CLOSED"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AppraisalDeskReviewer who opened the review."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AppraisalDeskReviewer who submitted the review."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ChiefAppraiser who decided the review; MUST differ from submitted_by_user_id."
        default: null
      - name: risk_tier_at_review
        type: enum
        source: computed
        description: "Snapshot of LoanFile.risk_tier taken at desk-review creation; the escalation matrix reads this snapshot, not the live loan field."
        constraints: "LOW | STANDARD | ELEVATED | HIGH"
      - name: preliminary_quality_score_bps
        type: integer
        source: computed
        description: "desk_review_quality_score, PRELIMINARY variant; written at creation and never recomputed."
      - name: final_quality_score_bps
        type: integer
        source: computed
        description: "desk_review_quality_score, FINAL variant; written at submit."
        default: null
      - name: required_escalation
        type: enum
        source: computed
        description: "escalation_requirement_matrix output; written at submit."
        default: null
        constraints: "NONE | FIELD_REVIEW | SECOND_APPRAISAL"
      - name: decision_action
        type: enum
        source: system
        description: "The action the ChiefAppraiser took at decide."
        default: null
        constraints: "ACCEPT | ESCALATE | RETURN"
      - name: reviewer_note
        type: string
        source: input
        description: "Optional note captured at creation."
        default: null
      - name: findings_note
        type: string
        source: input
        description: "Findings narrative captured at submit."
        default: null
      - name: decision_note
        type: string
        source: input
        description: "Decision rationale captured at decide."
        default: null

  - name: EscalationOrder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: desk_review_id
        type: string
        source: system
        description: "FK -> DeskReview.id; the review whose ESCALATE decision created this order."
      - name: amc_id
        type: string
        source: system
        description: "FK -> AMC.id; copied from the appraisal; the party the escalation cost is charged to."
      - name: assigned_appraiser_id
        type: string
        source: system
        description: "FK -> Appraiser.id; the review or second appraiser, set by assign and retained after cancellation for audit."
        default: null
      - name: escalation_type
        type: enum
        source: computed
        description: "Copied from DeskReview.required_escalation at ESCALATE time."
        constraints: "FIELD_REVIEW | SECOND_APPRAISAL"
      - name: status
        type: enum
        source: system
        description: "Escalation lifecycle."
        default: PENDING_ASSIGNMENT
        constraints: "PENDING_ASSIGNMENT | ASSIGNED | REASSIGNMENT_REQUIRED | COMPLETED | CANCELLED"
      - name: due_at
        type: datetime
        source: computed
        description: "created_at plus FIELD_REVIEW_TAT_HOURS or SECOND_APPRAISAL_TAT_HOURS by escalation_type."
      - name: inspection_window_start
        type: datetime
        source: input
        description: "Start of the half-open inspection window [start, end) reserved on the assigned appraiser."
        default: null
      - name: inspection_window_end
        type: datetime
        source: input
        description: "End of the half-open inspection window [start, end) reserved on the assigned appraiser."
        default: null
      - name: base_fee_cents
        type: integer
        source: computed
        description: "escalation_cost_allocation step 1; written at assign."
        default: null
      - name: rush_surcharge_cents
        type: integer
        source: computed
        description: "escalation_cost_allocation step 2; written at assign."
        default: null
      - name: discount_pct_bps
        type: integer
        source: computed
        description: "escalation_cost_allocation step 3 tier, in bps; written at assign."
        default: null
      - name: total_cost_cents
        type: integer
        source: computed
        description: "escalation_cost_allocation step 5; written at assign and retained after cancellation for audit."
        default: null
      - name: resulting_value_cents
        type: integer
        source: input
        description: "Value opinion produced by the field review or second appraisal."
        default: null
      - name: documentation_note
        type: string
        source: input
        description: "Value revision documentation captured at completion."
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: "Reason captured at cancellation."
        default: null

  - name: ROVRequest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: loan_file_id
        type: string
        source: input
        description: "FK -> LoanFile.id; the loan the borrower is contesting."
      - name: appraisal_id
        type: string
        source: input
        description: "FK -> Appraisal.id; the appraisal whose value is contested."
      - name: borrower_statement
        type: string
        source: input
        description: "Borrower's written basis for the reconsideration."
      - name: requested_value_cents
        type: integer
        source: input
        description: "Value the borrower asks the appraiser to consider."
        constraints: "> 0"
      - name: round_number
        type: integer
        source: system
        description: "Negotiation round; starts at 1 and increments on next-round."
        default: 1
        constraints: "1..MAX_ROV_ROUNDS"
      - name: status
        type: enum
        source: system
        description: "ROV lifecycle; cycles RESPONDED -> INTAKE across rounds."
        default: INTAKE
        constraints: "INTAKE | AWAITING_APPRAISER | RESPONDED | CLOSED_AFFIRMED | CLOSED_REVISED"
      - name: admissible_evidence_count
        type: integer
        source: computed
        description: "count(ROVEvidenceItem where rov_request_id == this.id AND admissible == true AND round_number == this.round_number)."
        default: 0
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "Logical clock at submit plus ROV_APPRAISER_RESPONSE_HOURS; cleared to null by next-round."
        default: null
      - name: appraiser_responded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the appraiser response for the current round."
        default: null
      - name: responded_late
        type: boolean
        source: system
        description: "True when appraiser_responded_at > response_deadline_at for the current round."
        default: false
      - name: outcome
        type: enum
        source: system
        description: "Appraiser's disposition for the current round."
        default: null
        constraints: "VALUE_AFFIRMED | VALUE_REVISED"
      - name: revised_value_cents
        type: integer
        source: input
        description: "Revised value opinion supplied when outcome == VALUE_REVISED."
        default: null
      - name: intake_note
        type: string
        source: input
        description: "Desk note captured at submit."
        default: null
      - name: response_note
        type: string
        source: input
        description: "Appraiser narrative captured at appraiser-response."
        default: null
      - name: next_round_reason
        type: string
        source: input
        description: "Reason captured at next-round."
        default: null
      - name: closure_note
        type: string
        source: input
        description: "Closure narrative captured at finalize."
        default: null

  - name: ROVEvidenceItem
    parent: ROVRequest
    common_fields: true
    entity_kind: resource
    fields:
      - name: rov_request_id
        type: string
        source: system
        description: "FK -> ROVRequest.id; taken from the path, never the body."
      - name: evidence_type
        type: enum
        source: input
        description: "Structured evidence channel category."
        constraints: "CLOSED_SALE | ACTIVE_LISTING_WITH_CONTRACT | DATA_ERROR_CITATION | OPINION_STATEMENT"
      - name: street_address
        type: string
        source: input
        description: "Address of the submitted sale or listing; case-folded and whitespace-collapsed for duplicate detection against the appraisal's grid comparables."
      - name: sale_price_cents
        type: integer
        source: input
        description: "Sale or contract price in cents."
        default: null
      - name: sale_date
        type: datetime
        source: input
        description: "Sale or contract date."
        default: null
      - name: distance_miles
        type: number
        source: input
        description: "Distance from the subject property, two decimal places."
        default: null
      - name: citation_note
        type: string
        source: input
        description: "Citation text for DATA_ERROR_CITATION evidence."
        default: null
      - name: admissible
        type: boolean
        source: computed
        description: "rov_evidence_admissibility output, evaluated once at creation."
      - name: inadmissible_reason
        type: enum
        source: computed
        description: "First failing admissibility clause in the pinned evaluation order; null when admissible."
        default: null
        constraints: "TYPE_NOT_ADMISSIBLE | MISSING_REQUIRED_ATTRIBUTE | STALE_SALE_DATE | DISTANCE_EXCEEDED | DUPLICATE_OF_GRID_COMP"
      - name: round_number
        type: integer
        source: computed
        description: "Snapshot of the parent ROVRequest.round_number at filing time."

  - name: DisputeCase
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: appraisal_id
        type: string
        source: input
        description: "FK -> Appraisal.id; the disputed report."
      - name: amc_id
        type: string
        source: input
        description: "FK -> AMC.id; the management company the dispute is filed with."
      - name: appraiser_id
        type: string
        source: input
        description: "FK -> Appraiser.id; the appraiser expected to respond."
      - name: dispute_basis
        type: enum
        source: input
        description: "Ground of the dispute; at most one non-resolved DisputeCase per (appraisal_id, dispute_basis)."
        constraints: "COMP_SELECTION | ADJUSTMENT_SUPPORT | VALUE_OPINION | USPAP_COMPLIANCE"
      - name: review_slot_start
        type: datetime
        source: input
        description: "Start of the closed review slot [start, end] reserved on the AMC."
      - name: review_slot_end
        type: datetime
        source: input
        description: "End of the closed review slot [start, end] reserved on the AMC."
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "created_at plus AMC.sla_response_hours, snapshotted at creation."
      - name: appraiser_position
        type: enum
        source: input
        description: "Appraiser's stated position, relayed by the AMC."
        default: null
        constraints: "VALUE_SUPPORTED | VALUE_AMENDED | NO_POSITION"
      - name: response_summary
        type: string
        source: input
        description: "AMC summary of the appraiser response."
        default: null
      - name: appraiser_responded_at
        type: datetime
        source: system
        description: "Logical-clock instant the AMC relayed the appraiser response."
        default: null
      - name: responded_late
        type: boolean
        source: system
        description: "True when appraiser_responded_at > response_deadline_at."
        default: false
      - name: status
        type: enum
        source: system
        description: "Dispute lifecycle."
        default: OPEN
        constraints: "OPEN | APPRAISER_RESPONDED | RESOLVED_UPHELD | RESOLVED_OVERTURNED | RESOLVED_BY_DEFAULT"
      - name: resolution
        type: enum
        source: system
        description: "Resolution recorded at resolve."
        default: null
        constraints: "UPHELD | OVERTURNED | BY_DEFAULT"
      - name: resolved_value_cents
        type: integer
        source: input
        description: "Value the dispute resolution restores or amends to; required when resolution == OVERTURNED."
        default: null
      - name: resolution_note
        type: string
        source: input
        description: "Resolution rationale."
        default: null

  - name: ValueRevision
    parent: Appraisal
    common_fields: false
    entity_kind: event
    fields:
      - name: appraisal_id
        type: string
        source: system
        description: "FK -> Appraisal.id; the appraisal whose value of record moved."
      - name: source_type
        type: enum
        source: computed
        description: "Which workflow produced the revision."
        constraints: "ROV | FIELD_REVIEW | SECOND_APPRAISAL | DISPUTE"
      - name: source_ref_id
        type: string
        source: computed
        description: "Polymorphic reference resolved by source_type: ROVRequest.id when source_type == ROV, EscalationOrder.id when FIELD_REVIEW or SECOND_APPRAISAL, DisputeCase.id when DISPUTE. Not a single-target foreign key; the reverse lookup is GET /appraisal-desk/appraisals/{appraisal_id}/value-revisions."
      - name: prior_value_cents
        type: integer
        source: computed
        description: "Appraisal.current_value_cents immediately before this revision."
      - name: new_value_cents
        type: integer
        source: computed
        description: "Appraisal.current_value_cents immediately after this revision."
      - name: delta_cents
        type: integer
        source: computed
        description: "new_value_cents - prior_value_cents."
      - name: delta_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * abs(delta_cents) / prior_value_cents)."
      - name: is_compensating
        type: boolean
        source: computed
        description: "True only for the revision written by a DisputeCase resolved OVERTURNED, which reverses a prior revision."
        default: false
      - name: ltv_bps_before
        type: integer
        source: computed
        description: "LoanFile.ltv_bps immediately before this revision."
        default: null
      - name: ltv_bps_after
        type: integer
        source: computed
        description: "LoanFile.ltv_bps immediately after this revision."
        default: null
      - name: decision_impact_before
        type: enum
        source: computed
        description: "LoanFile.decision_impact immediately before this revision."
        default: null
        constraints: "NO_IMPACT | PRICING_ADJUSTMENT | CONDITION_REQUIRED | DENIAL_RECOMMENDED"
      - name: decision_impact_after
        type: enum
        source: computed
        description: "LoanFile.decision_impact immediately after this revision."
        default: null
        constraints: "NO_IMPACT | PRICING_ADJUSTMENT | CONDITION_REQUIRED | DENIAL_RECOMMENDED"
      - name: documentation_note
        type: string
        source: computed
        description: "Documentation text copied from the triggering call's note field."

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Appraisal
    dimension: review_status
    initial_state: RECEIVED
    terminal_states: [SUPERSEDED]
    note: |
      Parallel dimension 1 of 2 on Appraisal. review_status and bias_screen_status advance
      independently: run-bias-screen never touches review_status, and desk-review transitions never
      touch bias_screen_status. QUARANTINED is the single point where the bias dimension reaches
      across into the review dimension, and it is reversible via quarantine_return_status.
    transitions:
      - from: RECEIVED
        to: RULES_CLEARED
        trigger: "POST /appraisal-desk/appraisals/{id}/run-rule-checks"
        actor: AppraisalDeskReviewer
        preconditions:
          - "expected_appraisal_version matches Appraisal.version"
          - "rule_check_fail_count computed by this run == 0"
        side_effects:
          - "writes 8 RuleCheckResult rows with sequence_no 1..8"
          - "writes completeness_score_bps, eligible_comp_count, closed_comp_count, max_gross_adjustment_bps, max_net_adjustment_bps, indicated_value_cents, variance_vs_reported_bps, rule_check_fail_count, rule_check_warn_count"
          - "sets current_value_cents to reported_value_cents on the first run"
          - "increments Appraisal.version by 1"
      - from: RECEIVED
        to: RULES_FLAGGED
        trigger: "POST /appraisal-desk/appraisals/{id}/run-rule-checks"
        actor: AppraisalDeskReviewer
        preconditions:
          - "expected_appraisal_version matches Appraisal.version"
          - "rule_check_fail_count computed by this run >= 1"
        side_effects:
          - "same writes as the RULES_CLEARED transition"
          - "increments Appraisal.version by 1"
      - from: RULES_CLEARED
        to: RULES_CLEARED
        trigger: "POST /appraisal-desk/appraisals/{id}/run-rule-checks (re-run)"
        actor: AppraisalDeskReviewer
        preconditions:
          - "expected_appraisal_version matches Appraisal.version"
          - "rule_check_fail_count computed by this run == 0"
        side_effects:
          - "deletes the prior RuleCheckResult rows and writes a fresh set of 8"
        note: "Re-running after a comparable edit is permitted while no DeskReview exists."
      - from: RULES_FLAGGED
        to: RULES_CLEARED
        trigger: "POST /appraisal-desk/appraisals/{id}/run-rule-checks (re-run)"
        actor: AppraisalDeskReviewer
        preconditions:
          - "expected_appraisal_version matches Appraisal.version"
          - "rule_check_fail_count computed by this run == 0"
        side_effects:
          - "deletes the prior RuleCheckResult rows and writes a fresh set of 8"
      - from: RULES_CLEARED
        to: IN_DESK_REVIEW
        trigger: "POST /appraisal-desk/desk-reviews"
        actor: AppraisalDeskReviewer
        preconditions:
          - "expected_appraisal_version matches Appraisal.version"
          - "bias_screen_status != NOT_SCREENED"
          - "no DeskReview for this appraisal is in DRAFT or SUBMITTED"
        side_effects:
          - "creates DeskReview in DRAFT with preliminary_quality_score_bps and risk_tier_at_review"
          - "sets LoanFile.collateral_status to UNDER_REVIEW"
          - "locks the comparable grid (further POST comparables rejected)"
          - "increments Appraisal.version by 1"
      - from: RULES_FLAGGED
        to: IN_DESK_REVIEW
        trigger: "POST /appraisal-desk/desk-reviews"
        actor: AppraisalDeskReviewer
        preconditions:
          - "expected_appraisal_version matches Appraisal.version"
          - "bias_screen_status != NOT_SCREENED"
          - "no DeskReview for this appraisal is in DRAFT or SUBMITTED"
        side_effects:
          - "same as the RULES_CLEARED -> IN_DESK_REVIEW transition"
      - from: IN_DESK_REVIEW
        to: VALUE_ACCEPTED
        trigger: "POST /appraisal-desk/desk-reviews/{id}/decide with decision_action ACCEPT"
        actor: ChiefAppraiser
        preconditions:
          - "DeskReview.status == SUBMITTED"
          - "DeskReview.required_escalation == NONE"
          - "bias_screen_status NOT IN {INDICATED, SUBSTANTIATED}"
          - "acting X-User-ID != DeskReview.submitted_by_user_id"
        side_effects:
          - "sets DeskReview.status to ACCEPTED"
          - "sets LoanFile.value_of_record_appraisal_id to this appraisal, collateral_status to VALUE_ACCEPTED"
          - "recomputes LoanFile.current_appraised_value_cents, effective_value_cents, ltv_bps, decision_impact"
          - "cascades LoanFile.underwriting_status per the decision_impact cascade"
      - from: IN_DESK_REVIEW
        to: ESCALATED
        trigger: "POST /appraisal-desk/desk-reviews/{id}/decide with decision_action ESCALATE"
        actor: ChiefAppraiser
        preconditions:
          - "DeskReview.status == SUBMITTED"
          - "DeskReview.required_escalation != NONE"
          - "acting X-User-ID != DeskReview.submitted_by_user_id"
          - "AMC.ytd_escalation_spend_cents remains within AMC.escalation_budget_cents is NOT checked here; it is checked at assign"
        side_effects:
          - "sets DeskReview.status to ESCALATED"
          - "creates EscalationOrder in PENDING_ASSIGNMENT with escalation_type == DeskReview.required_escalation and due_at"
          - "sets LoanFile.collateral_status to UNDER_REVIEW"
      - from: IN_DESK_REVIEW
        to: RETURNED_TO_AMC
        trigger: "POST /appraisal-desk/desk-reviews/{id}/decide with decision_action RETURN"
        actor: ChiefAppraiser
        preconditions:
          - "DeskReview.status == SUBMITTED"
          - "acting X-User-ID != DeskReview.submitted_by_user_id"
        side_effects:
          - "sets DeskReview.status to RETURNED"
          - "sets LoanFile.collateral_status to UNDER_REVIEW"
          - "unlocks the comparable grid so the AMC can deliver a superseding appraisal"
      - from: ESCALATED
        to: VALUE_REVISED
        trigger: "POST /appraisal-desk/escalation-orders/{id}/complete"
        actor: AMCCoordinator
        preconditions:
          - "EscalationOrder.status == ASSIGNED"
          - "resulting_value_cents is present and > 0"
        side_effects:
          - "sets EscalationOrder.status to COMPLETED"
          - "writes a ValueRevision with source_type FIELD_REVIEW or SECOND_APPRAISAL"
          - "sets Appraisal.current_value_cents to resulting_value_cents"
          - "sets LoanFile.value_of_record_appraisal_id, collateral_status VALUE_REVISED, and recomputes ltv_bps / decision_impact"
          - "increments the authoring appraiser's revision tally and recomputes both performance-score variants"
          - "decrements AMC.open escalation exposure is NOT applied; ytd_escalation_spend_cents retains the COMPLETED order's total_cost_cents"
      - from: ESCALATED
        to: IN_DESK_REVIEW
        trigger: "POST /appraisal-desk/escalation-orders/{id}/cancel"
        actor: ChiefAppraiser
        preconditions:
          - "EscalationOrder.status IN {PENDING_ASSIGNMENT, ASSIGNED, REASSIGNMENT_REQUIRED}"
          - "cancel_reason is present"
        side_effects:
          - "returns the DeskReview to SUBMITTED so a fresh decision can be made on the same review"
          - "see the EscalationOrder ASSIGNED -> CANCELLED transition for the money-ledger compensation"
          - "LoanFile.collateral_status stays UNDER_REVIEW"
        note: "Revert edge. The review dimension is not forward-only around ESCALATED; the money ledger compensates but the DeskReview scores and required_escalation are retained."
      - from: RULES_CLEARED
        to: VALUE_CONTESTED
        trigger: "POST /appraisal-desk/rov-requests/{id}/submit"
        actor: AppraisalDeskReviewer
        preconditions:
          - "ROVRequest.status == INTAKE"
          - "ROVRequest.admissible_evidence_count >= MIN_ADMISSIBLE_EVIDENCE"
        side_effects:
          - "sets ROVRequest.status to AWAITING_APPRAISER and stamps response_deadline_at"
          - "sets LoanFile.collateral_status to VALUE_CONTESTED"
      - from: VALUE_ACCEPTED
        to: VALUE_CONTESTED
        trigger: "POST /appraisal-desk/rov-requests/{id}/submit"
        actor: AppraisalDeskReviewer
        preconditions:
          - "ROVRequest.status == INTAKE"
          - "ROVRequest.admissible_evidence_count >= MIN_ADMISSIBLE_EVIDENCE"
        side_effects:
          - "same as the RULES_CLEARED -> VALUE_CONTESTED transition"
      - from: VALUE_REVISED
        to: VALUE_CONTESTED
        trigger: "POST /appraisal-desk/rov-requests/{id}/submit"
        actor: AppraisalDeskReviewer
        preconditions:
          - "ROVRequest.status == INTAKE"
          - "ROVRequest.admissible_evidence_count >= MIN_ADMISSIBLE_EVIDENCE"
        side_effects:
          - "same as the RULES_CLEARED -> VALUE_CONTESTED transition"
      - from: VALUE_CONTESTED
        to: VALUE_REVISED
        trigger: "POST /appraisal-desk/rov-requests/{id}/appraiser-response with outcome VALUE_REVISED"
        actor: Appraiser
        preconditions:
          - "ROVRequest.status == AWAITING_APPRAISER"
          - "acting appraiser is Appraisal.appraiser_id"
          - "abs(revised_value_cents - Appraisal.current_value_cents) / Appraisal.current_value_cents <= ROV_REVISION_CAP_BPS"
        side_effects:
          - "sets ROVRequest.status to RESPONDED, outcome VALUE_REVISED, appraiser_responded_at, responded_late"
          - "writes a ValueRevision with source_type ROV"
          - "sets Appraisal.current_value_cents to revised_value_cents"
          - "sets LoanFile.collateral_status to VALUE_REVISED and recomputes ltv_bps / decision_impact"
          - "cascades LoanFile.underwriting_status per the decision_impact cascade"
          - "increments the appraiser's revision tally and recomputes both performance-score variants"
      - from: VALUE_CONTESTED
        to: VALUE_ACCEPTED
        trigger: "POST /appraisal-desk/rov-requests/{id}/appraiser-response with outcome VALUE_AFFIRMED"
        actor: Appraiser
        preconditions:
          - "ROVRequest.status == AWAITING_APPRAISER"
          - "acting appraiser is Appraisal.appraiser_id"
        side_effects:
          - "sets ROVRequest.status to RESPONDED, outcome VALUE_AFFIRMED"
          - "sets LoanFile.collateral_status to VALUE_ACCEPTED and recomputes ltv_bps / decision_impact"
      - from: VALUE_REVISED
        to: VALUE_REVISED
        trigger: "POST /appraisal-desk/dispute-cases/{id}/resolve with resolution OVERTURNED"
        actor: ChiefAppraiser
        preconditions:
          - "DisputeCase.status IN {OPEN, APPRAISER_RESPONDED}"
          - "resolved_value_cents is present and > 0"
        side_effects:
          - "sets DisputeCase.status to RESOLVED_OVERTURNED"
          - "writes a compensating ValueRevision (is_compensating true) with source_type DISPUTE"
          - "sets Appraisal.current_value_cents to resolved_value_cents"
          - "recomputes LoanFile.current_appraised_value_cents, effective_value_cents, ltv_bps, decision_impact"
      - from: RULES_CLEARED
        to: QUARANTINED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == OPEN"
        side_effects:
          - "snapshots the current review_status into quarantine_return_status"
          - "sets bias_screen_status to SUBSTANTIATED"
          - "sets LoanFile.collateral_status to QUARANTINED"
          - "increments Appraiser.substantiated_bias_count and recomputes both performance-score variants"
          - "cascades Appraiser.panel_status per the performance cascade"
          - "moves the authoring appraiser's ASSIGNED SECOND_APPRAISAL orders to REASSIGNMENT_REQUIRED when the cascade lands on PROBATION, SUSPENDED, or REMOVED"
        note: "The same transition exists from every non-terminal review_status; quarantine_return_status makes it reversible."
      - from: RULES_FLAGGED
        to: QUARANTINED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == OPEN"
        side_effects:
          - "same as the RULES_CLEARED -> QUARANTINED transition"
      - from: IN_DESK_REVIEW
        to: QUARANTINED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == OPEN"
        side_effects:
          - "same as the RULES_CLEARED -> QUARANTINED transition"
      - from: VALUE_ACCEPTED
        to: QUARANTINED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == OPEN"
        side_effects:
          - "same as the RULES_CLEARED -> QUARANTINED transition"
      - from: VALUE_REVISED
        to: QUARANTINED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == OPEN"
        side_effects:
          - "same as the RULES_CLEARED -> QUARANTINED transition"
      - from: QUARANTINED
        to: "quarantine_return_status"
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition CLEAR on the SUBSTANTIATED flag"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == SUBSTANTIATED"
          - "no other BiasIndicatorFlag on this appraisal is SUBSTANTIATED"
        side_effects:
          - "restores review_status to quarantine_return_status and clears quarantine_return_status to null"
          - "sets bias_screen_status to CLEARED_ON_REVIEW"
          - "restores LoanFile.collateral_status to the value implied by the restored review_status"
          - "decrements Appraiser.substantiated_bias_count and recomputes both performance-score variants"
        note: "Bias appeal. The only inbound edge to a QUARANTINED appraisal's prior status."
      - from: RETURNED_TO_AMC
        to: SUPERSEDED
        trigger: "POST /appraisal-desk/appraisals with supersedes_appraisal_id == this appraisal"
        actor: AMCCoordinator
        preconditions:
          - "expected_loan_file_version matches LoanFile.version"
          - "the superseded appraisal's review_status == RETURNED_TO_AMC"
        side_effects:
          - "creates the replacement Appraisal in RECEIVED"
          - "sets this appraisal's review_status to SUPERSEDED"
          - "removes this appraisal from the authoring appraiser's total_appraisal_count and recomputes both performance-score variants"
          - "increments LoanFile.version by 1"

  - entity: Appraisal
    dimension: bias_screen_status
    initial_state: NOT_SCREENED
    terminal_states: []
    note: "Parallel dimension 2 of 2 on Appraisal."
    transitions:
      - from: NOT_SCREENED
        to: CLEAR
        trigger: "POST /appraisal-desk/appraisals/{id}/run-bias-screen"
        actor: ComplianceOfficer
        preconditions:
          - "expected_appraisal_version matches Appraisal.version"
          - "computed bias_risk_index < BIAS_INDICATED_THRESHOLD"
        side_effects:
          - "writes bias_risk_index"
          - "writes zero or more BiasIndicatorFlag rows in OPEN"
          - "increments Appraisal.version by 1"
          - "leaves review_status unchanged"
      - from: NOT_SCREENED
        to: INDICATED
        trigger: "POST /appraisal-desk/appraisals/{id}/run-bias-screen"
        actor: ComplianceOfficer
        preconditions:
          - "expected_appraisal_version matches Appraisal.version"
          - "computed bias_risk_index >= BIAS_INDICATED_THRESHOLD"
        side_effects:
          - "writes bias_risk_index and one BiasIndicatorFlag per matched narrative term plus the COMP_BAND_SKEW flag when applicable"
          - "increments Appraisal.version by 1"
          - "leaves review_status unchanged"
      - from: CLEAR
        to: INDICATED
        trigger: "POST /appraisal-desk/appraisals/{id}/run-bias-screen (re-run after a comparable edit)"
        actor: ComplianceOfficer
        preconditions:
          - "expected_appraisal_version matches Appraisal.version"
          - "the comparable grid is not locked"
          - "computed bias_risk_index >= BIAS_INDICATED_THRESHOLD"
        side_effects:
          - "deletes the prior OPEN flags and writes a fresh set"
      - from: INDICATED
        to: SUBSTANTIATED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == OPEN"
        side_effects:
          - "see the review_status QUARANTINED transitions for the full cascade"
      - from: INDICATED
        to: CLEAR
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition CLEAR on the last OPEN flag"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == OPEN"
          - "this is the last flag on the appraisal still in OPEN"
        side_effects:
          - "sets the flag to CLEARED"
          - "sets bias_screen_status to CLEAR, unblocking desk-review acceptance"
      - from: SUBSTANTIATED
        to: CLEARED_ON_REVIEW
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition CLEAR on the SUBSTANTIATED flag"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == SUBSTANTIATED"
          - "no other BiasIndicatorFlag on this appraisal is SUBSTANTIATED"
        side_effects:
          - "see the review_status QUARANTINED -> quarantine_return_status transition for the full cascade"

  - entity: DeskReview
    dimension: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, RETURNED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /appraisal-desk/desk-reviews/{id}/submit"
        actor: AppraisalDeskReviewer
        preconditions:
          - "DeskReview.status == DRAFT"
          - "the appraisal's bias_screen_status != NOT_SCREENED"
        side_effects:
          - "writes final_quality_score_bps (FINAL variant) and required_escalation"
          - "records submitted_by_user_id from X-User-ID"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /appraisal-desk/desk-reviews/{id}/decide with decision_action ACCEPT"
        actor: ChiefAppraiser
        preconditions:
          - "required_escalation == NONE"
          - "the appraisal's bias_screen_status NOT IN {INDICATED, SUBSTANTIATED}"
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "see the Appraisal review_status IN_DESK_REVIEW -> VALUE_ACCEPTED transition"
      - from: SUBMITTED
        to: ESCALATED
        trigger: "POST /appraisal-desk/desk-reviews/{id}/decide with decision_action ESCALATE"
        actor: ChiefAppraiser
        preconditions:
          - "required_escalation != NONE"
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "creates the EscalationOrder; see the Appraisal review_status IN_DESK_REVIEW -> ESCALATED transition"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /appraisal-desk/desk-reviews/{id}/decide with decision_action RETURN"
        actor: ChiefAppraiser
        preconditions:
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "see the Appraisal review_status IN_DESK_REVIEW -> RETURNED_TO_AMC transition"
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /appraisal-desk/escalation-orders/{id}/complete"
        actor: AMCCoordinator
        preconditions:
          - "EscalationOrder.status == ASSIGNED"
        side_effects:
          - "see the Appraisal review_status ESCALATED -> VALUE_REVISED transition"
      - from: ESCALATED
        to: SUBMITTED
        trigger: "POST /appraisal-desk/escalation-orders/{id}/cancel"
        actor: ChiefAppraiser
        preconditions:
          - "EscalationOrder.status IN {PENDING_ASSIGNMENT, ASSIGNED, REASSIGNMENT_REQUIRED}"
          - "cancel_reason is present"
        side_effects:
          - "retains final_quality_score_bps, required_escalation and submitted_by_user_id unchanged"
          - "see the Appraisal review_status ESCALATED -> IN_DESK_REVIEW transition"
        note: "Revert edge; a cancelled order returns the review to the decision queue rather than stranding it."

  - entity: EscalationOrder
    dimension: status
    initial_state: PENDING_ASSIGNMENT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING_ASSIGNMENT
        to: ASSIGNED
        trigger: "POST /appraisal-desk/escalation-orders/{id}/assign"
        actor: ChiefAppraiser
        preconditions:
          - "EscalationOrder.status == PENDING_ASSIGNMENT"
          - "the assigned appraiser is on an ACTIVE PanelMembership for this AMC"
          - "the assigned appraiser is not the authoring appraiser of the escalated appraisal"
          - "the assigned appraiser's panel_status permits this escalation_type"
          - "the requested inspection window does not conflict with the appraiser's existing windows under the travel-buffer rule"
          - "AMC.ytd_escalation_spend_cents + this order's total_cost_cents <= AMC.escalation_budget_cents"
        side_effects:
          - "writes base_fee_cents, rush_surcharge_cents, discount_pct_bps, total_cost_cents"
          - "adds total_cost_cents to AMC.ytd_escalation_spend_cents"
          - "increments Appraiser.open_assignment_count"
          - "reserves the inspection window on the assigned appraiser"
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /appraisal-desk/escalation-orders/{id}/complete"
        actor: AMCCoordinator
        preconditions:
          - "EscalationOrder.status == ASSIGNED"
          - "resulting_value_cents is present and > 0"
        side_effects:
          - "decrements Appraiser.open_assignment_count and increments completed_assignment_count"
          - "releases the inspection window"
          - "see the Appraisal review_status ESCALATED -> VALUE_REVISED transition"
      - from: ASSIGNED
        to: REASSIGNMENT_REQUIRED
        trigger: "system: the assigned appraiser's panel_status leaves ACTIVE while escalation_type == SECOND_APPRAISAL"
        actor: system
        preconditions:
          - "escalation_type == SECOND_APPRAISAL"
          - "the assigned appraiser's panel_status moved to PROBATION, SUSPENDED, or REMOVED"
        side_effects:
          - "retains total_cost_cents and the AMC spend contribution"
          - "keeps assigned_appraiser_id for audit while forbidding completion"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /appraisal-desk/escalation-orders/{id}/cancel"
        actor: ChiefAppraiser
        preconditions:
          - "EscalationOrder.status IN {PENDING_ASSIGNMENT, ASSIGNED, REASSIGNMENT_REQUIRED}"
          - "cancel_reason is present"
        side_effects:
          - "subtracts total_cost_cents from AMC.ytd_escalation_spend_cents (compensating ledger entry)"
          - "retains total_cost_cents on the order for audit"
          - "decrements Appraiser.open_assignment_count and releases the inspection window"
          - "returns the DeskReview to SUBMITTED so a fresh decision can be made"
          - "reverts Appraisal.review_status from ESCALATED to IN_DESK_REVIEW"
      - from: PENDING_ASSIGNMENT
        to: CANCELLED
        trigger: "POST /appraisal-desk/escalation-orders/{id}/cancel"
        actor: ChiefAppraiser
        preconditions:
          - "cancel_reason is present"
        side_effects:
          - "no ledger change (total_cost_cents is still null)"
          - "returns the DeskReview to SUBMITTED and Appraisal.review_status to IN_DESK_REVIEW"
      - from: REASSIGNMENT_REQUIRED
        to: ASSIGNED
        trigger: "POST /appraisal-desk/escalation-orders/{id}/assign (re-assignment to an eligible appraiser)"
        actor: ChiefAppraiser
        preconditions:
          - "EscalationOrder.status == REASSIGNMENT_REQUIRED"
          - "the new appraiser satisfies every assign precondition"
        side_effects:
          - "recomputes the cost fields from the current clock and window"
          - "replaces the AMC spend contribution with the recomputed total_cost_cents"
          - "decrements the prior appraiser's open_assignment_count and increments the new appraiser's"

  - entity: ROVRequest
    dimension: status
    initial_state: INTAKE
    terminal_states: [CLOSED_AFFIRMED, CLOSED_REVISED]
    note: "Cyclic: RESPONDED -> INTAKE on next-round, bounded by MAX_ROV_ROUNDS."
    transitions:
      - from: INTAKE
        to: AWAITING_APPRAISER
        trigger: "POST /appraisal-desk/rov-requests/{id}/submit"
        actor: AppraisalDeskReviewer
        preconditions:
          - "ROVRequest.status == INTAKE"
          - "LoanFile.underwriting_status IN {SUBMITTED, CONDITIONALLY_APPROVED, SUSPENDED}"
          - "admissible_evidence_count for the current round >= MIN_ADMISSIBLE_EVIDENCE"
          - "the appraisal's bias_screen_status != SUBSTANTIATED"
        side_effects:
          - "stamps response_deadline_at = clock + ROV_APPRAISER_RESPONSE_HOURS"
          - "sets LoanFile.collateral_status to VALUE_CONTESTED and Appraisal.review_status to VALUE_CONTESTED"
      - from: AWAITING_APPRAISER
        to: RESPONDED
        trigger: "POST /appraisal-desk/rov-requests/{id}/appraiser-response"
        actor: Appraiser
        preconditions:
          - "ROVRequest.status == AWAITING_APPRAISER"
          - "X-User-ID == the appraisal's appraiser_id"
          - "when outcome == VALUE_REVISED, the revision is within ROV_REVISION_CAP_BPS of Appraisal.current_value_cents"
        side_effects:
          - "sets responded_late when the clock is past response_deadline_at"
          - "see the Appraisal review_status VALUE_CONTESTED transitions"
      - from: RESPONDED
        to: INTAKE
        trigger: "POST /appraisal-desk/rov-requests/{id}/next-round"
        actor: AppraisalDeskReviewer
        preconditions:
          - "ROVRequest.status == RESPONDED"
          - "round_number < MAX_ROV_ROUNDS"
          - "next_round_reason is present"
        side_effects:
          - "increments round_number"
          - "clears response_deadline_at, appraiser_responded_at, responded_late, outcome, revised_value_cents"
          - "resets admissible_evidence_count to the count of admissible items filed in the new round (0 at entry)"
      - from: RESPONDED
        to: CLOSED_AFFIRMED
        trigger: "POST /appraisal-desk/rov-requests/{id}/finalize"
        actor: AppraisalDeskReviewer
        preconditions:
          - "ROVRequest.status == RESPONDED"
          - "outcome == VALUE_AFFIRMED"
        side_effects:
          - "records closure_note"
      - from: RESPONDED
        to: CLOSED_REVISED
        trigger: "POST /appraisal-desk/rov-requests/{id}/finalize"
        actor: AppraisalDeskReviewer
        preconditions:
          - "ROVRequest.status == RESPONDED"
          - "outcome == VALUE_REVISED"
        side_effects:
          - "records closure_note"

  - entity: DisputeCase
    dimension: status
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_OVERTURNED, RESOLVED_BY_DEFAULT]
    transitions:
      - from: OPEN
        to: APPRAISER_RESPONDED
        trigger: "POST /appraisal-desk/dispute-cases/{id}/amc-response"
        actor: AMCCoordinator
        preconditions:
          - "DisputeCase.status == OPEN"
          - "X-User-ID == DisputeCase.amc_id"
          - "appraiser_position is present"
        side_effects:
          - "stamps appraiser_responded_at from the logical clock"
          - "sets responded_late when the clock is past response_deadline_at"
          - "when responded_late, increments Appraiser.sla_miss_count and AMC.sla_breach_count and recomputes both appraiser performance-score variants"
          - "decrements AMC.open_dispute_count"
      - from: OPEN
        to: RESOLVED_BY_DEFAULT
        trigger: "POST /appraisal-desk/dispute-cases/{id}/resolve with resolution BY_DEFAULT"
        actor: ChiefAppraiser
        preconditions:
          - "DisputeCase.status == OPEN"
          - "the logical clock is at or past response_deadline_at"
        side_effects:
          - "increments AMC.sla_breach_count"
          - "cascades AMC.panel_status per the AMC breach cascade"
          - "decrements AMC.open_dispute_count"
      - from: APPRAISER_RESPONDED
        to: RESOLVED_UPHELD
        trigger: "POST /appraisal-desk/dispute-cases/{id}/resolve with resolution UPHELD"
        actor: ChiefAppraiser
        preconditions:
          - "DisputeCase.status IN {OPEN, APPRAISER_RESPONDED}"
        side_effects:
          - "records resolution_note; the value of record is unchanged"
      - from: APPRAISER_RESPONDED
        to: RESOLVED_OVERTURNED
        trigger: "POST /appraisal-desk/dispute-cases/{id}/resolve with resolution OVERTURNED"
        actor: ChiefAppraiser
        preconditions:
          - "DisputeCase.status IN {OPEN, APPRAISER_RESPONDED}"
          - "resolved_value_cents is present and > 0"
        side_effects:
          - "see the Appraisal review_status VALUE_REVISED -> VALUE_REVISED (compensating) transition"
      - from: OPEN
        to: RESOLVED_UPHELD
        trigger: "POST /appraisal-desk/dispute-cases/{id}/resolve with resolution UPHELD"
        actor: ChiefAppraiser
        preconditions:
          - "DisputeCase.status == OPEN"
        side_effects:
          - "records resolution_note; decrements AMC.open_dispute_count"

  - entity: BiasIndicatorFlag
    dimension: status
    initial_state: OPEN
    terminal_states: [CLEARED]
    note: "SUBSTANTIATED is reversible on appeal; CLEARED is terminal."
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == OPEN"
          - "rationale is present"
        side_effects:
          - "records adjudicated_by_user_id and rationale"
          - "drives the Appraisal QUARANTINED cascade"
      - from: OPEN
        to: CLEARED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == OPEN"
          - "rationale is present"
        side_effects:
          - "sets Appraisal.bias_screen_status to CLEAR when this was the last OPEN flag"
      - from: SUBSTANTIATED
        to: CLEARED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition CLEAR (appeal)"
        actor: ComplianceOfficer
        preconditions:
          - "BiasIndicatorFlag.status == SUBSTANTIATED"
          - "rationale is present"
        side_effects:
          - "drives the Appraisal quarantine-lift cascade and decrements Appraiser.substantiated_bias_count"

  - entity: Appraiser
    dimension: panel_status
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    note: |
      Non-linear: PROBATION -> ACTIVE (reinstatement) and SUSPENDED -> PROBATION (partial
      reinstatement) both exist, so the machine is not a forward-only ladder. The automatic
      performance cascade can reach PROBATION and SUSPENDED but never REMOVED; REMOVED requires an
      explicit panel-review action by the ChiefAppraiser.
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system: performance_score_bps drops below PROBATION_THRESHOLD_BPS after a recompute"
        actor: system
        preconditions:
          - "performance_score_bps < PROBATION_THRESHOLD_BPS"
          - "performance_score_bps >= SUSPENSION_THRESHOLD_BPS"
        side_effects:
          - "stamps probation_started_at from the logical clock"
          - "moves the appraiser's ASSIGNED SECOND_APPRAISAL orders to REASSIGNMENT_REQUIRED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: performance_score_bps drops below SUSPENSION_THRESHOLD_BPS after a recompute"
        actor: system
        preconditions:
          - "performance_score_bps < SUSPENSION_THRESHOLD_BPS"
        side_effects:
          - "moves the appraiser's ASSIGNED SECOND_APPRAISAL orders to REASSIGNMENT_REQUIRED"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: performance_score_bps drops below SUSPENSION_THRESHOLD_BPS after a recompute"
        actor: system
        preconditions:
          - "performance_score_bps < SUSPENSION_THRESHOLD_BPS"
        side_effects:
          - "moves the appraiser's ASSIGNED SECOND_APPRAISAL orders to REASSIGNMENT_REQUIRED"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /appraisal-desk/appraisers/{id}/panel-review with panel_action REINSTATE"
        actor: ChiefAppraiser
        preconditions:
          - "expected_appraiser_version matches Appraiser.version"
          - "panel_status == PROBATION"
          - "performance_score_bps >= PROBATION_THRESHOLD_BPS"
        side_effects:
          - "clears probation_started_at"
          - "increments Appraiser.version by 1"
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /appraisal-desk/appraisers/{id}/panel-review with panel_action REINSTATE"
        actor: ChiefAppraiser
        preconditions:
          - "expected_appraiser_version matches Appraiser.version"
          - "panel_status == SUSPENDED"
          - "performance_score_bps >= SUSPENSION_THRESHOLD_BPS"
        side_effects:
          - "stamps probation_started_at; a suspended appraiser is reinstated to PROBATION, never straight to ACTIVE"
          - "increments Appraiser.version by 1"
      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /appraisal-desk/appraisers/{id}/panel-review with panel_action REMOVE"
        actor: ChiefAppraiser
        preconditions:
          - "expected_appraiser_version matches Appraiser.version"
          - "panel_status == SUSPENDED"
          - "performance_score_bps < REMOVAL_THRESHOLD_BPS"
          - "removal_reason is present"
        side_effects:
          - "records removal_reason"
          - "supersedes every ACTIVE PanelMembership for this appraiser"
          - "moves every ASSIGNED or REASSIGNMENT_REQUIRED order for this appraiser to REASSIGNMENT_REQUIRED"
          - "increments Appraiser.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /appraisal-desk/appraisers/{id}/panel-review with panel_action MONITOR"
        actor: ChiefAppraiser
        preconditions:
          - "expected_appraiser_version matches Appraiser.version"
        side_effects:
          - "recomputes performance_score_bps (ROLLING_12M) and lifetime_performance_score_bps (LIFETIME) from the current logical clock"
          - "increments Appraiser.version by 1"
        note: "MONITOR is the read-and-recompute action; it is the only way to observe both score variants side by side."
      - from: PROBATION
        to: PROBATION
        trigger: "POST /appraisal-desk/appraisers/{id}/panel-review with panel_action MONITOR"
        actor: ChiefAppraiser
        preconditions:
          - "expected_appraiser_version matches Appraiser.version"
        side_effects:
          - "recomputes both performance-score variants"
          - "increments Appraiser.version by 1"
      - from: SUSPENDED
        to: SUSPENDED
        trigger: "POST /appraisal-desk/appraisers/{id}/panel-review with panel_action MONITOR"
        actor: ChiefAppraiser
        preconditions:
          - "expected_appraiser_version matches Appraiser.version"
        side_effects:
          - "recomputes both performance-score variants"
          - "increments Appraiser.version by 1"

  - entity: AMC
    dimension: panel_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system: sla_breach_count reaches AMC_PROBATION_BREACH_COUNT after a dispute breach"
        actor: system
        preconditions:
          - "sla_breach_count >= AMC_PROBATION_BREACH_COUNT"
          - "sla_breach_count < AMC_SUSPENSION_BREACH_COUNT"
        side_effects:
          - "no change to existing orders; new appraisal intake is still permitted"
        note: "AMC_PROBATION_BREACH_COUNT == 2. sla_breach_count counts late amc-response relays plus RESOLVED_BY_DEFAULT disputes, so a single breach leaves the AMC ACTIVE."
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: sla_breach_count reaches AMC_SUSPENSION_BREACH_COUNT after a dispute breach"
        actor: system
        preconditions:
          - "sla_breach_count >= AMC_SUSPENSION_BREACH_COUNT"
        side_effects:
          - "blocks POST /appraisal-desk/appraisals naming this AMC"
        note: "AMC_SUSPENSION_BREACH_COUNT == 4. The cascade is evaluated after every dispute breach, so reaching 4 from ACTIVE passes through PROBATION on the way."

  - entity: LoanFile
    dimension: underwriting_status
    initial_state: SUBMITTED
    terminal_states: [CLOSED, WITHDRAWN]
    note: "Dimension 1 of 2 on LoanFile; moves both by explicit operator action and by the decision_impact cascade."
    transitions:
      - from: SUBMITTED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /appraisal-desk/loan-files/{id}/underwriting-status with target CONDITIONALLY_APPROVED"
        actor: LoanOfficer
        preconditions:
          - "underwriting_status == SUBMITTED"
        side_effects: []
      - from: SUBMITTED
        to: SUSPENDED
        trigger: "system: decision_impact becomes DENIAL_RECOMMENDED after a value recompute"
        actor: system
        preconditions:
          - "decision_impact == DENIAL_RECOMMENDED"
        side_effects:
          - "blocks the loan from closing until the value of record moves"
      - from: CONDITIONALLY_APPROVED
        to: SUSPENDED
        trigger: "system: decision_impact becomes DENIAL_RECOMMENDED after a value recompute"
        actor: system
        preconditions:
          - "decision_impact == DENIAL_RECOMMENDED"
        side_effects: []
      - from: SUSPENDED
        to: CONDITIONALLY_APPROVED
        trigger: "system: decision_impact moves off DENIAL_RECOMMENDED after a value recompute"
        actor: system
        preconditions:
          - "decision_impact != DENIAL_RECOMMENDED"
        side_effects:
          - "auto-reinstatement; the loan returns to CONDITIONALLY_APPROVED regardless of which status it was suspended from"
      - from: CONDITIONALLY_APPROVED
        to: CLOSED
        trigger: "POST /appraisal-desk/loan-files/{id}/underwriting-status with target CLOSED"
        actor: LoanOfficer
        preconditions:
          - "underwriting_status == CONDITIONALLY_APPROVED"
          - "collateral_status IN {VALUE_ACCEPTED, VALUE_REVISED}"
          - "no ROVRequest for this loan is in INTAKE or AWAITING_APPRAISER"
        side_effects:
          - "freezes the collateral dimension; ROV intake is rejected afterwards"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /appraisal-desk/loan-files/{id}/underwriting-status with target WITHDRAWN"
        actor: LoanOfficer
        preconditions:
          - "underwriting_status IN {SUBMITTED, CONDITIONALLY_APPROVED, SUSPENDED}"
        side_effects:
          - "cancels every PENDING_ASSIGNMENT EscalationOrder on this loan's appraisals"
      - from: CONDITIONALLY_APPROVED
        to: WITHDRAWN
        trigger: "POST /appraisal-desk/loan-files/{id}/underwriting-status with target WITHDRAWN"
        actor: LoanOfficer
        preconditions:
          - "underwriting_status IN {SUBMITTED, CONDITIONALLY_APPROVED, SUSPENDED}"
        side_effects:
          - "cancels every PENDING_ASSIGNMENT EscalationOrder on this loan's appraisals"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /appraisal-desk/loan-files/{id}/underwriting-status with target WITHDRAWN"
        actor: LoanOfficer
        preconditions:
          - "underwriting_status IN {SUBMITTED, CONDITIONALLY_APPROVED, SUSPENDED}"
        side_effects:
          - "cancels every PENDING_ASSIGNMENT EscalationOrder on this loan's appraisals"

  - entity: LoanFile
    dimension: collateral_status
    initial_state: PENDING_APPRAISAL
    terminal_states: []
    note: "Dimension 2 of 2 on LoanFile; a compound projection of the value-of-record Appraisal.review_status."
    transitions:
      - from: PENDING_APPRAISAL
        to: UNDER_REVIEW
        trigger: "POST /appraisal-desk/desk-reviews"
        actor: AppraisalDeskReviewer
        preconditions:
          - "a DeskReview is created for one of this loan's appraisals"
        side_effects: []
      - from: UNDER_REVIEW
        to: VALUE_ACCEPTED
        trigger: "POST /appraisal-desk/desk-reviews/{id}/decide with decision_action ACCEPT"
        actor: ChiefAppraiser
        preconditions:
          - "the appraisal moves to VALUE_ACCEPTED"
        side_effects:
          - "recomputes current_appraised_value_cents, effective_value_cents, ltv_bps, decision_impact"
      - from: UNDER_REVIEW
        to: VALUE_REVISED
        trigger: "POST /appraisal-desk/escalation-orders/{id}/complete"
        actor: AMCCoordinator
        preconditions:
          - "the appraisal moves to VALUE_REVISED"
        side_effects:
          - "recomputes current_appraised_value_cents, effective_value_cents, ltv_bps, decision_impact"
      - from: VALUE_ACCEPTED
        to: VALUE_CONTESTED
        trigger: "POST /appraisal-desk/rov-requests/{id}/submit"
        actor: AppraisalDeskReviewer
        preconditions:
          - "the appraisal moves to VALUE_CONTESTED"
        side_effects: []
      - from: VALUE_REVISED
        to: VALUE_CONTESTED
        trigger: "POST /appraisal-desk/rov-requests/{id}/submit"
        actor: AppraisalDeskReviewer
        preconditions:
          - "the appraisal moves to VALUE_CONTESTED"
        side_effects: []
      - from: VALUE_CONTESTED
        to: VALUE_REVISED
        trigger: "POST /appraisal-desk/rov-requests/{id}/appraiser-response with outcome VALUE_REVISED"
        actor: Appraiser
        preconditions:
          - "the appraisal moves to VALUE_REVISED"
        side_effects:
          - "recomputes current_appraised_value_cents, effective_value_cents, ltv_bps, decision_impact"
          - "cascades underwriting_status when decision_impact changes tier"
      - from: VALUE_CONTESTED
        to: VALUE_ACCEPTED
        trigger: "POST /appraisal-desk/rov-requests/{id}/appraiser-response with outcome VALUE_AFFIRMED"
        actor: Appraiser
        preconditions:
          - "the appraisal moves to VALUE_ACCEPTED"
        side_effects: []
      - from: VALUE_REVISED
        to: QUARANTINED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "the value-of-record appraisal moves to QUARANTINED"
        side_effects:
          - "the loan cannot close while collateral_status == QUARANTINED"
      - from: VALUE_ACCEPTED
        to: QUARANTINED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "the value-of-record appraisal moves to QUARANTINED"
        side_effects: []
      - from: QUARANTINED
        to: VALUE_REVISED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition CLEAR (appeal)"
        actor: ComplianceOfficer
        preconditions:
          - "the appraisal's quarantine_return_status == VALUE_REVISED"
        side_effects: []
      - from: QUARANTINED
        to: VALUE_ACCEPTED
        trigger: "POST /appraisal-desk/bias-flags/{id}/adjudicate with disposition CLEAR (appeal)"
        actor: ComplianceOfficer
        preconditions:
          - "the appraisal's quarantine_return_status == VALUE_ACCEPTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /appraisal-desk/desk-reviews/{id}/decide with decision_action RETURN or ESCALATE"
        actor: ChiefAppraiser
        preconditions:
          - "the appraisal moves to RETURNED_TO_AMC or ESCALATED"
        side_effects: []

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent entity's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: desk-review-create-stale-appraisal
    parent_entity: Appraisal
    write_endpoint: "POST /appraisal-desk/desk-reviews"
    occ_field: "expected_appraisal_version"
    description: |
      Opening a DeskReview against an Appraisal whose version has advanced since the caller last
      read it is rejected. This covers the legitimate case where another reviewer re-ran the rule
      checks (which rewrites completeness_score_bps and the rule-check tallies that the preliminary
      quality score is built from), so the caller's view of the appraisal's scoring inputs is stale
      and the DeskReview it would open would be scored from superseded numbers.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appraisal-intake-stale-loan-file
    parent_entity: LoanFile
    write_endpoint: "POST /appraisal-desk/appraisals"
    occ_field: "expected_loan_file_version"
    description: |
      Delivering an Appraisal against a LoanFile whose version has advanced since the AMC last read
      it is rejected. This covers the legitimate case where a prior delivery already landed and
      superseded the report the AMC believed was current, so the caller's supersede pointer and
      risk-tier assumptions no longer describe the loan it is writing to.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: panel-membership-create-stale-appraiser
    parent_entity: Appraiser
    write_endpoint: "POST /appraisal-desk/panel-memberships"
    occ_field: "expected_appraiser_version"
    description: |
      Creating a PanelMembership against an Appraiser whose version has advanced since the caller
      last read it is rejected. This covers the legitimate case where a panel-review action already
      moved the appraiser's panel_status (a new membership legitimately supersedes the prior
      membership for the same coverage state), so the caller is enrolling an appraiser whose
      standing it has not observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: appraisal_completeness_score
    trigger: "POST /appraisal-desk/appraisals/{id}/run-rule-checks"
    algorithm: weighted_scoring
    formula: |
      REQUIRED_SECTIONS is the ordered 8-element set
        [SUBJECT, CONTRACT, NEIGHBORHOOD, SITE, IMPROVEMENTS, SALES_COMPARISON, RECONCILIATION,
         CERTIFICATION]
      Sections beyond that set (ADDENDA, MARKET_CONDITIONS) are accepted as input but contribute 0.

      section_hits   = count(s in REQUIRED_SECTIONS where s in Appraisal.sections_present)
      section_bps    = round_half_up(10000 * section_hits / 8)
      comp_bps       = round_half_up(10000 * min(closed_comp_count, MIN_CLOSED_COMPS) / MIN_CLOSED_COMPS)
      exhibit_bps    = round_half_up(10000 * min(exhibit_count, MIN_EXHIBITS) / MIN_EXHIBITS)

      # Each component is rounded to integer bps FIRST, then weighted. The weighted sum is then
      # rounded once more. Weighting the unrounded components is FORBIDDEN.
      completeness_score_bps = round_half_up(
          W_SECTION * section_bps + W_COMP * comp_bps + W_EXHIBIT * exhibit_bps)

      CHK_COMPLETENESS outcome:
        FAIL when completeness_score_bps < COMPLETENESS_FAIL_BPS
        WARN when COMPLETENESS_FAIL_BPS <= completeness_score_bps < COMPLETENESS_PASS_BPS
        PASS when completeness_score_bps >= COMPLETENESS_PASS_BPS
    input_set: "The Appraisal's own sections_present and exhibit_count, plus closed_comp_count over ComparableSale rows with included_in_grid == true AND sale_status == CLOSED."
    constants:
      REQUIRED_SECTION_COUNT: 8
      MIN_CLOSED_COMPS: 3
      MIN_EXHIBITS: 7
      W_SECTION: 0.50
      W_COMP: 0.30
      W_EXHIBIT: 0.20
      COMPLETENESS_PASS_BPS: 8500
      COMPLETENESS_FAIL_BPS: 6000
    precision: "Integer basis points at every step; round_half_up. Halves round away from zero."

  - name: comparable_adjustment_magnitudes
    trigger: "POST /appraisal-desk/appraisals/{id}/comparables (per row) and POST /appraisal-desk/appraisals/{id}/run-rule-checks (roll-up)"
    algorithm: aggregation
    formula: |
      per ComparableSale:
        adjusted_price_cents = sale_price_cents + net_adjustment_cents
        gross_adjustment_bps = round_half_up(10000 * gross_adjustment_cents / sale_price_cents)
        net_adjustment_bps   = round_half_up(10000 * abs(net_adjustment_cents) / sale_price_cents)

      eligible = ComparableSale rows for this appraisal with included_in_grid == true
      max_gross_adjustment_bps = 0 if eligible is empty else max(c.gross_adjustment_bps for c in eligible)
      max_net_adjustment_bps   = 0 if eligible is empty else max(c.net_adjustment_bps for c in eligible)

      CHK_GROSS_ADJUSTMENT outcome:
        FAIL when max_gross_adjustment_bps > MAX_SINGLE_GROSS_BPS
        WARN when GROSS_WARN_BPS < max_gross_adjustment_bps <= MAX_SINGLE_GROSS_BPS
        PASS otherwise (including the empty eligible set, where the metric is 0)
      CHK_NET_ADJUSTMENT outcome:
        FAIL when max_net_adjustment_bps > MAX_NET_BPS
        WARN when NET_WARN_BPS < max_net_adjustment_bps <= MAX_NET_BPS
        PASS otherwise
    input_set: "Only ComparableSale rows with included_in_grid == true participate in the maxima; excluded rows keep their own per-row bps fields but never move the appraisal roll-up."
    constants:
      MAX_SINGLE_GROSS_BPS: 2500
      GROSS_WARN_BPS: 1500
      MAX_NET_BPS: 1500
      NET_WARN_BPS: 1000
    precision: "Integer basis points; round_half_up."

  - name: reconciled_indicated_value
    trigger: "POST /appraisal-desk/appraisals/{id}/run-rule-checks"
    algorithm: aggregation
    formula: |
      eligible = ComparableSale rows with included_in_grid == true, ordered by created_at ASC
      n = count(eligible)
      if n == 0:
        indicated_value_cents   = null
        variance_vs_reported_bps = null
        CHK_VALUE_RECONCILIATION = PASS   # nothing to reconcile
      else:
        # ROUNDING ORDER IS PINNED. Divide each comparable's adjusted price by n, round that
        # per-comparable quotient to whole cents, THEN sum the rounded quotients.
        # Summing first and dividing once (round_half_up(sum(adjusted) / n)) is FORBIDDEN and
        # produces a different value whenever the per-comparable remainders do not cancel.
        indicated_value_cents = sum(round_half_up(c.adjusted_price_cents / n) for c in eligible)
        variance_vs_reported_bps = round_half_up(
            10000 * abs(indicated_value_cents - reported_value_cents) / reported_value_cents)
        CHK_VALUE_RECONCILIATION outcome:
          FAIL when variance_vs_reported_bps > VARIANCE_FAIL_BPS
          WARN when VARIANCE_WARN_BPS < variance_vs_reported_bps <= VARIANCE_FAIL_BPS
          PASS otherwise
    input_set: "ComparableSale rows with included_in_grid == true, regardless of sale_status."
    constants:
      VARIANCE_FAIL_BPS: 500
      VARIANCE_WARN_BPS: 250
    precision: "Whole cents per comparable, then integer sum; round_half_up at the per-comparable step only."

  - name: receipt_rule_check_battery
    trigger: "POST /appraisal-desk/appraisals/{id}/run-rule-checks"
    algorithm: chronological
    formula: |
      The run always emits exactly 8 RuleCheckResult rows, in this fixed sequence_no order.
      A re-run deletes the previous 8 rows and writes a fresh 8.

        sequence_no 1  CHK_COMPLETENESS         (outcome per appraisal_completeness_score)
        sequence_no 2  CHK_COMP_COUNT
        sequence_no 3  CHK_COMP_DISTANCE
        sequence_no 4  CHK_COMP_AGE
        sequence_no 5  CHK_GROSS_ADJUSTMENT     (outcome per comparable_adjustment_magnitudes)
        sequence_no 6  CHK_NET_ADJUSTMENT       (outcome per comparable_adjustment_magnitudes)
        sequence_no 7  CHK_VALUE_RECONCILIATION (outcome per reconciled_indicated_value)
        sequence_no 8  CHK_FORM_TYPE

      eligible = ComparableSale rows for this appraisal with included_in_grid == true
      ceiling  = MAX_COMP_DISTANCE_MILES[LoanFile.market_type]   # 1.00 URBAN, 3.00 SUBURBAN, 5.00 RURAL

      CHK_COMP_COUNT   (observed_value = closed_comp_count)
        FAIL when closed_comp_count < MIN_CLOSED_COMPS
        PASS otherwise
        (this check never yields WARN)

      CHK_COMP_DISTANCE (observed_value = max distance_miles over eligible, or "0.00" when empty)
        FAIL when any eligible comparable has distance_miles > 2 * ceiling
        WARN when no comparable breaches 2 * ceiling but at least one has distance_miles > ceiling
        PASS otherwise (including the empty eligible set)
        The comparison is a strict >, so distance_miles exactly equal to ceiling is a PASS.

      CHK_COMP_AGE     (observed_value = max age in days over eligible, or "0" when empty)
        age_days = (Appraisal.effective_date - ComparableSale.sale_date) in whole days
        FAIL when any eligible comparable has age_days > MAX_COMP_AGE_DAYS
        PASS otherwise (including the empty eligible set)
        (this check never yields WARN)

      CHK_FORM_TYPE    (observed_value = report_form_type)
        FAIL when report_form_type == FORM_2055 AND LoanFile.risk_tier IN {ELEVATED, HIGH}
        PASS otherwise

      After all 8 rows are written:
        rule_check_fail_count = count(rows with outcome == FAIL)
        rule_check_warn_count = count(rows with outcome == WARN)
        review_status = RULES_CLEARED when rule_check_fail_count == 0
                        RULES_FLAGGED otherwise
      A WARN alone never blocks: a run with 0 FAILs and any number of WARNs still clears.
    input_set: "The Appraisal itself, its parent LoanFile (market_type, risk_tier), and its ComparableSale rows with included_in_grid == true. Rows with included_in_grid == false are ignored by every one of the eight checks."
    constants:
      MIN_CLOSED_COMPS: 3
      MAX_COMP_AGE_DAYS: 365
      MAX_COMP_DISTANCE_MILES:
        URBAN: 1.00
        SUBURBAN: 3.00
        RURAL: 5.00
      RULE_CHECK_COUNT: 8
    precision: "Distances compared at two decimal places; ages in whole days; all comparisons strict where stated."

  - name: desk_review_quality_score
    trigger: "POST /appraisal-desk/desk-reviews (PRELIMINARY) and POST /appraisal-desk/desk-reviews/{id}/submit (FINAL)"
    algorithm: weighted_scoring
    formula: |
      base = Appraisal.completeness_score_bps
      rule_penalty     = P_RULE_FAIL * Appraisal.rule_check_fail_count
                       + P_RULE_WARN * Appraisal.rule_check_warn_count
      distance_penalty = P_COMP_DISTANCE if any eligible ComparableSale has
                         distance_miles > MAX_COMP_DISTANCE_MILES[LoanFile.market_type] else 0
      bias_penalty     = P_BIAS_INDICATED     if Appraisal.bias_screen_status == INDICATED
                         else P_BIAS_SUBSTANTIATED if Appraisal.bias_screen_status == SUBSTANTIATED
                         else 0

      PRELIMINARY: score = max(0, base - rule_penalty)
      FINAL:       score = max(0, base - rule_penalty - distance_penalty - bias_penalty)
    input_set: "The parent Appraisal's persisted completeness_score_bps and rule-check tallies, its eligible ComparableSale rows, and its bias_screen_status at the moment the variant runs."
    constants:
      P_RULE_FAIL: 600
      P_RULE_WARN: 200
      P_COMP_DISTANCE: 300
      P_BIAS_INDICATED: 1500
      P_BIAS_SUBSTANTIATED: 3000
    precision: "Integer basis points, floored at 0; no rounding needed because every term is an integer."
    variants:
      - name: PRELIMINARY
        when: "Computed once at POST /appraisal-desk/desk-reviews and persisted to DeskReview.preliminary_quality_score_bps. Never recomputed."
        difference: "Counts only the rule-check penalty. The comparable-distance penalty and the bias penalty are excluded entirely, because the desk reviewer has not yet walked the grid or read the bias screen."
      - name: FINAL
        when: "Computed at POST /appraisal-desk/desk-reviews/{id}/submit and persisted to DeskReview.final_quality_score_bps. This is the score the escalation matrix reads."
        difference: "Subtracts all four penalty terms. For identical appraisal data the FINAL score is strictly lower than the PRELIMINARY score whenever a distance breach or a bias indication exists; the delta is exactly distance_penalty + bias_penalty."

  - name: appraiser_performance_score
    trigger: "POST /appraisal-desk/appraisers/{id}/panel-review, plus every side effect that changes an appraiser's revision, bias, or SLA tallies"
    algorithm: threshold
    formula: |
      # variant selects the source-record window; everything below is identical across variants.
      windowed_appraisals = Appraisal rows with appraiser_id == this appraiser
                            AND review_status != SUPERSEDED
                            AND created_at >= window_start
      windowed_revisions  = ValueRevision rows whose appraisal_id is in windowed_appraisals
                            AND is_compensating == false
                            AND created_at >= window_start

      total     = count(windowed_appraisals)
      revisions = count(windowed_revisions)
      revision_rate_bps = 0 if total == 0 else round_half_up(10000 * revisions / total)

      score = 10000
              - round_half_up(REVISION_WEIGHT * revision_rate_bps)
              - P_BIAS_SUBSTANTIATED_APPRAISER * Appraiser.substantiated_bias_count
              - P_SLA_MISS * Appraiser.sla_miss_count
      score = max(0, min(10000, score))

      Panel cascade on the ROLLING_12M score only:
        score <  SUSPENSION_THRESHOLD_BPS -> panel_status SUSPENDED
        score <  PROBATION_THRESHOLD_BPS  -> panel_status PROBATION
        otherwise                          -> panel_status unchanged
      The automatic cascade NEVER reaches REMOVED even when score < REMOVAL_THRESHOLD_BPS;
      REMOVED requires an explicit panel_action REMOVE.
    input_set: "Appraisal rows authored by the appraiser excluding SUPERSEDED ones, and the non-compensating ValueRevision rows on those appraisals. substantiated_bias_count and sla_miss_count are lifetime tallies in BOTH variants -- only the appraisal/revision window differs."
    constants:
      REVISION_WEIGHT: 0.60
      P_BIAS_SUBSTANTIATED_APPRAISER: 1200
      P_SLA_MISS: 400
      PROBATION_THRESHOLD_BPS: 7000
      SUSPENSION_THRESHOLD_BPS: 5500
      REMOVAL_THRESHOLD_BPS: 4000
      ROLLING_WINDOW_DAYS: 365
    precision: "Integer basis points; round_half_up; clamped to [0, 10000]."
    variants:
      - name: ROLLING_12M
        when: "Always. Persisted to Appraiser.performance_score_bps and Appraiser.revision_rate_bps; this is the variant the panel cascade reads."
        difference: "window_start = logical_clock - ROLLING_WINDOW_DAYS. Appraisals and revisions created before that instant are excluded from total and revisions, so an appraiser whose only revision is older than the window shows revision_rate_bps 0 and a perfect 10000 while still carrying the lifetime bias and SLA penalties."
      - name: LIFETIME
        when: "Always. Persisted to Appraiser.lifetime_performance_score_bps; audit-only, never drives the cascade."
        difference: "window_start = the beginning of time -- no date filter at all. For identical data the LIFETIME score diverges from ROLLING_12M whenever any qualifying appraisal or revision predates the rolling window."

  - name: escalation_requirement_matrix
    trigger: "POST /appraisal-desk/desk-reviews/{id}/submit"
    algorithm: threshold
    formula: |
      score = DeskReview.final_quality_score_bps
      tier  = DeskReview.risk_tier_at_review          # snapshot, not the live LoanFile.risk_tier

      # Clause 1 -- bias override, evaluated FIRST and short-circuiting.
      if Appraisal.bias_screen_status IN {INDICATED, SUBSTANTIATED}:
          required_escalation = SECOND_APPRAISAL
      else:
          # Clause 2 -- risk-tier matrix. Strictly-less-than comparisons throughout: a score
          # exactly equal to a row's cut-off does NOT trigger that row.
          if tier == HIGH:
              required_escalation = SECOND_APPRAISAL if score < 7000
                                    else FIELD_REVIEW if score < 8500
                                    else NONE
          elif tier == ELEVATED:
              required_escalation = SECOND_APPRAISAL if score < 6000
                                    else FIELD_REVIEW if score < 8000
                                    else NONE
          elif tier == STANDARD:
              required_escalation = FIELD_REVIEW if score < 6000 else NONE
          else:  # LOW
              required_escalation = FIELD_REVIEW if score < 5000 else NONE

          # Clause 3 -- adjustment-magnitude upgrade, applied AFTER the matrix. Never downgrades.
          if Appraisal.max_gross_adjustment_bps > MAX_SINGLE_GROSS_BPS and required_escalation == NONE:
              required_escalation = FIELD_REVIEW
    input_set: "The DeskReview's own final score and risk-tier snapshot, plus the parent Appraisal's bias_screen_status and max_gross_adjustment_bps."
    constants:
      HIGH_SECOND_APPRAISAL_BPS: 7000
      HIGH_FIELD_REVIEW_BPS: 8500
      ELEVATED_SECOND_APPRAISAL_BPS: 6000
      ELEVATED_FIELD_REVIEW_BPS: 8000
      STANDARD_FIELD_REVIEW_BPS: 6000
      LOW_FIELD_REVIEW_BPS: 5000
      MAX_SINGLE_GROSS_BPS: 2500
    precision: "Integer basis-point comparisons; no arithmetic."

  - name: escalation_cost_allocation
    trigger: "POST /appraisal-desk/escalation-orders/{id}/assign"
    algorithm: tiered_pricing
    formula: |
      # THE FIVE STEPS RUN IN THIS ORDER. Reordering steps 2 and 3 changes the answer.
      # step 1 -- base fee by escalation type
      base_fee_cents = FIELD_REVIEW_BASE_CENTS      if escalation_type == FIELD_REVIEW
                       else SECOND_APPRAISAL_BASE_CENTS

      # step 2 -- rush surcharge, decided on the remaining turnaround at the moment of assignment
      hours_remaining = (EscalationOrder.due_at - logical_clock) in hours
      is_rush = hours_remaining < RUSH_WINDOW_HOURS          # STRICT: exactly 72.0 is NOT rush
      rush_surcharge_cents = round_half_up(base_fee_cents * RUSH_PCT) if is_rush else 0

      # step 3 -- volume discount tier, keyed on the POST-RUSH subtotal
      total_before_discount = base_fee_cents + rush_surcharge_cents
      discount_pct_bps = 0    if total_before_discount < TIER1_FLOOR_CENTS
                         else 500  if total_before_discount <= TIER2_CEIL_CENTS
                         else 1000

      # step 4 -- apply the discount
      discount_cents = round_half_up(total_before_discount * discount_pct_bps / 10000)

      # step 5 -- final
      total_cost_cents = total_before_discount - discount_cents

      due_at = EscalationOrder.created_at + (FIELD_REVIEW_TAT_HOURS if escalation_type == FIELD_REVIEW
                                             else SECOND_APPRAISAL_TAT_HOURS)
    input_set: "The order's own escalation_type and due_at, and the logical clock at the instant of assignment."
    constants:
      FIELD_REVIEW_BASE_CENTS: 45000
      SECOND_APPRAISAL_BASE_CENTS: 65000
      RUSH_PCT: 0.30
      RUSH_WINDOW_HOURS: 72
      TIER1_FLOOR_CENTS: 50000
      TIER2_CEIL_CENTS: 80000
      FIELD_REVIEW_TAT_HOURS: 72
      SECOND_APPRAISAL_TAT_HOURS: 168
    precision: "Whole cents; round_half_up at the surcharge and discount steps."

  - name: bias_risk_index
    trigger: "POST /appraisal-desk/appraisals/{id}/run-bias-screen"
    algorithm: weighted_scoring
    formula: |
      PROHIBITED_TERMS is an ORDERED list; term index is 1-based and fixes flag emission order.
      Matching is a case-insensitive substring test against Appraisal.narrative_text. A term that
      appears more than once counts ONCE.

      narrative_hits = count(t in PROHIBITED_TERMS where casefold(t) in casefold(narrative_text))

      eligible    = ComparableSale rows with included_in_grid == true
      off_band    = count(c in eligible where c.census_tract_band != Appraisal.subject_census_tract_band)
      comp_skew_bps = 0 if eligible is empty else round_half_up(10000 * off_band / count(eligible))

      bias_risk_index = min(100, NARRATIVE_TERM_WEIGHT * narrative_hits
                                 + round_half_up(comp_skew_bps / COMP_SKEW_DIVISOR))

      bias_screen_status = INDICATED if bias_risk_index >= BIAS_INDICATED_THRESHOLD else CLEAR

      Flags emitted, in this order:
        1. one NARRATIVE flag per matched term, ordered by the term's index in PROHIBITED_TERMS,
           indicator_code TERM_<index>, severity_weight NARRATIVE_TERM_WEIGHT
        2. one COMP_SELECTION flag with indicator_code COMP_BAND_SKEW when
           comp_skew_bps >= COMP_SKEW_FLAG_BPS, severity_weight round_half_up(comp_skew_bps / COMP_SKEW_DIVISOR)
    input_set: "The Appraisal's narrative_text and subject_census_tract_band, plus ComparableSale rows with included_in_grid == true."
    constants:
      PROHIBITED_TERMS:
        - "desirable neighborhood"
        - "pride of ownership"
        - "crime-ridden"
        - "ethnic"
        - "student neighborhood"
        - "up and coming"
        - "gentrifying"
        - "family-oriented"
      NARRATIVE_TERM_WEIGHT: 12
      COMP_SKEW_DIVISOR: 200
      COMP_SKEW_FLAG_BPS: 5000
      BIAS_INDICATED_THRESHOLD: 25
    precision: "Integer index on a 0-100 scale; round_half_up; capped at 100."

  - name: ltv_and_decision_impact
    trigger: "Every side effect that writes LoanFile.current_appraised_value_cents (desk-review ACCEPT, escalation complete, ROV appraiser-response, dispute resolve OVERTURNED, bias quarantine lift)"
    algorithm: threshold
    formula: |
      current_appraised_value_cents = Appraisal.reported_value_cents
                                      + sum(vr.delta_cents for vr in ValueRevision on that appraisal)

      effective_value_cents = min(current_appraised_value_cents, LoanFile.contract_price_cents)
                              if LoanFile.loan_purpose == PURCHASE
                              else current_appraised_value_cents

      ltv_bps = round_half_up(10000 * LoanFile.loan_amount_cents / effective_value_cents)

      # Inclusive upper bounds. A loan at exactly 8000 bps is NO_IMPACT, not PRICING_ADJUSTMENT.
      decision_impact = NO_IMPACT           if ltv_bps <= LTV_NO_IMPACT_BPS
                        else PRICING_ADJUSTMENT if ltv_bps <= LTV_PRICING_BPS
                        else CONDITION_REQUIRED if ltv_bps <= LTV_CONDITION_BPS
                        else DENIAL_RECOMMENDED

      Cascade: DENIAL_RECOMMENDED suspends the loan; any other tier auto-reinstates a SUSPENDED
      loan to CONDITIONALLY_APPROVED.
    input_set: "The value-of-record Appraisal and every ValueRevision on it, including compensating ones."
    constants:
      LTV_NO_IMPACT_BPS: 8000
      LTV_PRICING_BPS: 9500
      LTV_CONDITION_BPS: 9700
    precision: "Integer basis points; round_half_up."

  - name: rov_evidence_admissibility
    trigger: "POST /appraisal-desk/rov-requests/{id}/evidence"
    algorithm: constraint_propagation
    formula: |
      # Clauses evaluated in this pinned order; the FIRST failure sets inadmissible_reason and stops.
      1. TYPE_NOT_ADMISSIBLE      -- evidence_type == OPINION_STATEMENT is never admissible.
      2. MISSING_REQUIRED_ATTRIBUTE
           CLOSED_SALE and ACTIVE_LISTING_WITH_CONTRACT require sale_price_cents, sale_date and
           distance_miles; DATA_ERROR_CITATION requires citation_note.
      3. STALE_SALE_DATE          -- for CLOSED_SALE and ACTIVE_LISTING_WITH_CONTRACT,
           (Appraisal.effective_date - sale_date) in days > MAX_COMP_AGE_DAYS.
      4. DISTANCE_EXCEEDED        -- for CLOSED_SALE and ACTIVE_LISTING_WITH_CONTRACT,
           distance_miles > MAX_COMP_DISTANCE_MILES[LoanFile.market_type].
      5. DUPLICATE_OF_GRID_COMP   -- the case-folded, whitespace-collapsed street_address already
           appears on a ComparableSale of the contested appraisal with included_in_grid == true.
      DATA_ERROR_CITATION skips clauses 3-5 entirely.
      admissible = true when no clause fires.

      admissible_evidence_count = count of admissible items filed in the CURRENT round only.
      Submitting requires admissible_evidence_count >= MIN_ADMISSIBLE_EVIDENCE.
    input_set: "ROVEvidenceItem rows for the parent ROVRequest whose round_number equals the request's current round_number."
    constants:
      MIN_ADMISSIBLE_EVIDENCE: 2
      MAX_ROV_ROUNDS: 2
      ROV_APPRAISER_RESPONSE_HOURS: 120
      ROV_REVISION_CAP_BPS: 2000
      MAX_COMP_AGE_DAYS: 365
      MAX_COMP_DISTANCE_MILES:
        URBAN: 1.00
        SUBURBAN: 3.00
        RURAL: 5.00
    precision: "Distances compared at 2 decimal places; day counts are whole days on the logical clock."

  - name: resource_window_conflict
    trigger: "POST /appraisal-desk/escalation-orders/{id}/assign (appraiser windows) and POST /appraisal-desk/dispute-cases (AMC slots)"
    algorithm: interval_merge
    formula: |
      # Semantics A -- Appraiser inspection windows. HALF-OPEN [start, end), buffered, EXCLUSIVE.
      # The buffer is applied to the EXISTING window on both sides; the incoming window is compared
      # bare. Any non-empty intersection is a conflict.
      for each existing EscalationOrder e on the same assigned_appraiser_id with
          status IN {ASSIGNED, REASSIGNMENT_REQUIRED} and non-null window:
        lo = e.inspection_window_start - TRAVEL_BUFFER_MINUTES
        hi = e.inspection_window_end   + TRAVEL_BUFFER_MINUTES
        conflict when new_start < hi AND new_end > lo
      A new window that begins exactly at hi is accepted (half-open upper bound).

      # Semantics B -- AMC dispute review slots. CLOSED [start, end], UNBUFFERED, AGGREGATE.
      # Touching endpoints DO overlap, and overlap alone is not an error -- only exceeding the
      # AMC's aggregate capacity is.
      overlapping = count(DisputeCase d on the same amc_id with status IN {OPEN, APPRAISER_RESPONDED}
                          where new_start <= d.review_slot_end AND new_end >= d.review_slot_start)
      reject when overlapping >= AMC.concurrent_dispute_capacity
      A slot that starts exactly at an existing slot's end counts as overlapping that slot.
    input_set: "Semantics A ranges over EscalationOrder windows held by one Appraiser. Semantics B ranges over DisputeCase slots held by one AMC. The two never interact."
    constants:
      TRAVEL_BUFFER_MINUTES: 90
      MAX_GRID_COMPS: 6
    precision: "Whole minutes on the logical clock."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared role names."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "For entity-backed roles, X-User-ID matches the resource's own identity field: AMCCoordinator's id equals the target's amc_id, Appraiser's id equals the target appraisal's appraiser_id, Borrower's id equals the target loan_file_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /appraisal-desk/appraisals, POST /appraisal-desk/escalation-orders/{id}/complete, POST /appraisal-desk/rov-requests/{id}/appraiser-response, POST /appraisal-desk/dispute-cases/{id}/amc-response, POST /appraisal-desk/rov-requests, POST /appraisal-desk/rov-requests/{id}/evidence"
  - priority: 5
    category: auth
    check: "The acting X-User-ID on POST /appraisal-desk/desk-reviews/{id}/decide differs from DeskReview.submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appraisal-desk/desk-reviews/{id}/decide"
  - priority: 6
    category: existence
    check: "Every path-position resource exists, validated left to right."
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 7
    category: existence
    check: "Every foreign key in the request body references an existing row, validated in the order the fields are declared in the endpoint's input list."
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /appraisal-desk/appraisals, POST /appraisal-desk/panel-memberships, POST /appraisal-desk/desk-reviews, POST /appraisal-desk/rov-requests, POST /appraisal-desk/dispute-cases, POST /appraisal-desk/escalation-orders/{id}/assign"
  - priority: 8
    category: existence
    check: "Body shape is valid: required fields present, enums in range, integers non-negative where declared, no unknown fields rejected but silently ignored, datetimes ISO-8601 with a Z suffix."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 9
    category: existence
    check: "limit is an integer in [1, 100] and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 10
    category: state
    check: "The declared expected_<parent>_version equals the parent's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appraisal-desk/appraisals, POST /appraisal-desk/panel-memberships, POST /appraisal-desk/desk-reviews, POST /appraisal-desk/appraisals/{id}/run-rule-checks, POST /appraisal-desk/appraisals/{id}/run-bias-screen, POST /appraisal-desk/appraisers/{id}/panel-review"
  - priority: 11
    category: state
    check: "The target resource is in a state from which the requested transition exists in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints without a more specific state error"
  - priority: 12
    category: state
    check: "The comparable grid is unlocked: no DeskReview exists for the appraisal in DRAFT, SUBMITTED or ACCEPTED, and review_status is not one of VALUE_ACCEPTED, VALUE_REVISED, QUARANTINED, SUPERSEDED."
    error_id: ERR_APPRAISAL_GRID_LOCKED
    http_status: 409
    applies_to: "POST /appraisal-desk/appraisals/{id}/comparables"
  - priority: 13
    category: state
    check: "Rule checks have been run: Appraisal.review_status is RULES_CLEARED or RULES_FLAGGED (or later), i.e. completeness_score_bps is non-null."
    error_id: ERR_RULE_CHECKS_NOT_RUN
    http_status: 409
    applies_to: "POST /appraisal-desk/desk-reviews"
  - priority: 14
    category: state
    check: "DeskReview.status == SUBMITTED."
    error_id: ERR_DESK_REVIEW_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /appraisal-desk/desk-reviews/{id}/decide"
  - priority: 15
    category: state
    check: "EscalationOrder.status is PENDING_ASSIGNMENT (first assignment) or REASSIGNMENT_REQUIRED (re-assignment)."
    error_id: ERR_ESCALATION_NOT_PENDING
    http_status: 409
    applies_to: "POST /appraisal-desk/escalation-orders/{id}/assign"
  - priority: 16
    category: state
    check: "ROVRequest.status == AWAITING_APPRAISER."
    error_id: ERR_ROV_NOT_AWAITING_RESPONSE
    http_status: 409
    applies_to: "POST /appraisal-desk/rov-requests/{id}/appraiser-response"
  - priority: 17
    category: state
    check: "DisputeCase.status is not one of RESOLVED_UPHELD, RESOLVED_OVERTURNED, RESOLVED_BY_DEFAULT."
    error_id: ERR_DISPUTE_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /appraisal-desk/dispute-cases/{id}/amc-response, POST /appraisal-desk/dispute-cases/{id}/resolve"
  - priority: 18
    category: state
    check: "The appraisal still accepts communications: review_status is not SUPERSEDED and not QUARANTINED."
    error_id: ERR_COMMUNICATION_LOCKED
    http_status: 409
    applies_to: "POST /appraisal-desk/appraisals/{id}/communications"
  - priority: 19
    category: business_safety
    check: "The bias screen has been run before a desk review is opened or submitted: Appraisal.bias_screen_status != NOT_SCREENED."
    error_id: ERR_BIAS_SCREEN_REQUIRED
    http_status: 422
    applies_to: "POST /appraisal-desk/desk-reviews, POST /appraisal-desk/desk-reviews/{id}/submit"
  - priority: 20
    category: business_safety
    check: "A desk review whose required_escalation != NONE cannot be accepted, and a review whose required_escalation == NONE cannot be escalated."
    error_id: ERR_ESCALATION_REQUIRED
    http_status: 422
    applies_to: "POST /appraisal-desk/desk-reviews/{id}/decide"
  - priority: 21
    category: business_safety
    check: "The appraisal is not under a substantiated bias quarantine: bias_screen_status != SUBSTANTIATED and review_status != QUARANTINED."
    error_id: ERR_BIAS_QUARANTINE_ACTIVE
    http_status: 422
    applies_to: "POST /appraisal-desk/desk-reviews/{id}/decide, POST /appraisal-desk/rov-requests/{id}/submit, POST /appraisal-desk/escalation-orders/{id}/complete, POST /appraisal-desk/loan-files/{id}/underwriting-status"
  - priority: 22
    category: business_safety
    check: "Appraiser-independence screen on communications: the sender's role is permitted to use the declared intent. LoanOfficer and Borrower may never send VALUE_INFLUENCE, COMPARABLE_SUGGESTION or DEADLINE_PRESSURE to recipient APPRAISER; AppraisalDeskReviewer may never send VALUE_INFLUENCE to recipient APPRAISER; no role may send VALUE_INFLUENCE while an ROVRequest on the appraisal is AWAITING_APPRAISER."
    error_id: ERR_INDEPENDENCE_VIOLATION
    http_status: 422
    applies_to: "POST /appraisal-desk/appraisals/{id}/communications"
  - priority: 23
    category: business_referential
    check: "The named AMC's panel_status is not SUSPENDED."
    error_id: ERR_AMC_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /appraisal-desk/appraisals, POST /appraisal-desk/dispute-cases"
  - priority: 24
    category: business_referential
    check: "The named appraiser holds an ACTIVE PanelMembership with the named AMC."
    error_id: ERR_APPRAISER_NOT_ON_PANEL
    http_status: 422
    applies_to: "POST /appraisal-desk/appraisals"
  - priority: 25
    category: business_referential
    check: "The appraiser being assigned holds an ACTIVE PanelMembership with the escalated appraisal's AMC."
    error_id: ERR_APPRAISER_NOT_ON_PANEL
    http_status: 422
    applies_to: "POST /appraisal-desk/escalation-orders/{id}/assign"
  - priority: 26
    category: business_referential
    check: "The appraiser being assigned is eligible for the order's escalation_type: SECOND_APPRAISAL requires panel_status == ACTIVE; FIELD_REVIEW requires panel_status IN {ACTIVE, PROBATION}; a SUSPENDED or REMOVED appraiser is eligible for neither. The assignee must also differ from the escalated appraisal's authoring appraiser."
    error_id: ERR_APPRAISER_INELIGIBLE
    http_status: 422
    applies_to: "POST /appraisal-desk/escalation-orders/{id}/assign"
  - priority: 27
    category: business_referential
    check: "The loan is eligible for reconsideration of value: underwriting_status IN {SUBMITTED, CONDITIONALLY_APPROVED, SUSPENDED}, and the named appraisal belongs to that loan."
    error_id: ERR_LOAN_NOT_ROV_ELIGIBLE
    http_status: 422
    applies_to: "POST /appraisal-desk/rov-requests, POST /appraisal-desk/rov-requests/{id}/submit"
  - priority: 28
    category: business_referential
    check: "The dispute's appraiser_id equals the named appraisal's appraiser_id and its amc_id equals the named appraisal's amc_id."
    error_id: ERR_DISPUTE_PARTY_MISMATCH
    http_status: 422
    applies_to: "POST /appraisal-desk/dispute-cases"
  - priority: 29
    category: business_temporal
    check: "The comparable's sale_date is at or before the parent Appraisal.effective_date."
    error_id: ERR_COMP_DATE_AFTER_EFFECTIVE
    http_status: 422
    applies_to: "POST /appraisal-desk/appraisals/{id}/comparables"
  - priority: 30
    category: business_temporal
    check: "Every submitted interval is well formed: start is strictly before end, and both are present when either is."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /appraisal-desk/escalation-orders/{id}/assign, POST /appraisal-desk/dispute-cases"
  - priority: 31
    category: business_temporal
    check: "The requested inspection window does not intersect any window already held by the assignee, after expanding each existing window by TRAVEL_BUFFER_MINUTES on both sides (half-open [start, end) semantics, any intersection rejected)."
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /appraisal-desk/escalation-orders/{id}/assign"
  - priority: 32
    category: business_constraint
    check: "The requested review slot does not push the AMC past concurrent_dispute_capacity: the count of unresolved DisputeCase slots on the same AMC that overlap the new slot under closed [start, end] semantics must be strictly less than concurrent_dispute_capacity."
    error_id: ERR_DISPUTE_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /appraisal-desk/dispute-cases"
  - priority: 33
    category: business_temporal
    check: "A dispute may be resolved BY_DEFAULT only once the logical clock has reached response_deadline_at."
    error_id: ERR_DISPUTE_DEADLINE_NOT_REACHED
    http_status: 422
    applies_to: "POST /appraisal-desk/dispute-cases/{id}/resolve"
  - priority: 34
    category: business_constraint
    check: "The comparable's case-folded, whitespace-collapsed street_address is not already present on this appraisal."
    error_id: ERR_DUPLICATE_COMPARABLE
    http_status: 422
    applies_to: "POST /appraisal-desk/appraisals/{id}/comparables"
  - priority: 35
    category: business_constraint
    check: "The appraisal holds at most MAX_GRID_COMPS comparables with included_in_grid == true."
    error_id: ERR_COMP_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /appraisal-desk/appraisals/{id}/comparables"
  - priority: 36
    category: business_constraint
    check: "No ACTIVE PanelMembership already exists for the same (appraiser_id, amc_id, coverage_state)."
    error_id: ERR_DUPLICATE_PANEL_MEMBERSHIP
    http_status: 422
    applies_to: "POST /appraisal-desk/panel-memberships"
  - priority: 37
    category: business_constraint
    check: "The ROV request carries at least MIN_ADMISSIBLE_EVIDENCE admissible evidence items filed in its current round."
    error_id: ERR_INSUFFICIENT_ADMISSIBLE_EVIDENCE
    http_status: 422
    applies_to: "POST /appraisal-desk/rov-requests/{id}/submit"
  - priority: 38
    category: business_constraint
    check: "round_number is strictly less than MAX_ROV_ROUNDS before a new round opens."
    error_id: ERR_ROV_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /appraisal-desk/rov-requests/{id}/next-round"
  - priority: 39
    category: business_constraint
    check: "The requested panel_action is permitted from the appraiser's current panel_status and score: REINSTATE requires the score to be back above the threshold for the current status, REMOVE requires panel_status == SUSPENDED and performance_score_bps < REMOVAL_THRESHOLD_BPS plus a removal_reason."
    error_id: ERR_PANEL_ACTION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /appraisal-desk/appraisers/{id}/panel-review"
  - priority: 40
    category: business_constraint
    check: "A value revision stays within ROV_REVISION_CAP_BPS of the appraisal's current value: round_half_up(10000 * abs(new - current) / current) <= 2000."
    error_id: ERR_REVISION_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /appraisal-desk/rov-requests/{id}/appraiser-response, POST /appraisal-desk/escalation-orders/{id}/complete, POST /appraisal-desk/dispute-cases/{id}/resolve"
  - priority: 41
    category: business_fiscal
    check: "AMC.ytd_escalation_spend_cents plus the order's computed total_cost_cents does not exceed AMC.escalation_budget_cents."
    error_id: ERR_ESCALATION_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /appraisal-desk/escalation-orders/{id}/assign"
  - priority: 42
    category: business_constraint
    check: "At most one non-resolved DisputeCase exists per (appraisal_id, dispute_basis)."
    error_id: ERR_DUPLICATE_DISPUTE_BASIS
    http_status: 422
    applies_to: "POST /appraisal-desk/dispute-cases"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/appraisal-desk/_clock/set_current_utc"
    description: |
      Test-driving endpoint. Sets the server's logical UTC clock to any instant, forward or backward.
      Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall
      back to real wall-clock time.
    roles: [ChiefAppraiser, ComplianceOfficer, AppraisalDeskReviewer, LoanOfficer, AMCCoordinator, Appraiser, Borrower]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "replaces the logical clock value used by every deadline, window and rolling-window computation"

  - method: POST
    path: "/appraisal-desk/loan-files"
    description: "Register a loan file at the appraisal desk."
    roles: [LoanOfficer]
    code: 201
    input: [loan_number, loan_purpose, market_type, risk_tier, loan_amount_cents, "contract_price_cents?", borrower_display_name]
    output: LoanFile
    side_effects:
      - "sets underwriting_status SUBMITTED and collateral_status PENDING_APPRAISAL"
      - "sets version to 1"

  - method: GET
    path: "/appraisal-desk/loan-files/{id}"
    description: "Read a loan file with its derived value and decision fields."
    roles: [LoanOfficer, AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: LoanFile
    side_effects: []

  - method: GET
    path: "/appraisal-desk/loan-files"
    description: "List loan files."
    roles: [LoanOfficer, AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer]
    code: 200
    input: ["underwriting_status?", "collateral_status?", "risk_tier?", "limit?", "offset?"]
    output: LoanFile[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/loan-files/{id}/underwriting-status"
    description: "Move the loan's underwriting dimension explicitly."
    roles: [LoanOfficer]
    code: 200
    input: [target_status, "note?"]
    output: LoanFile
    side_effects:
      - "increments LoanFile.version by 1"
      - "on WITHDRAWN, cancels every PENDING_ASSIGNMENT EscalationOrder on this loan's appraisals"

  - method: POST
    path: "/appraisal-desk/appraisers"
    description: "Add an appraiser to the lender's panel roster."
    roles: [ChiefAppraiser]
    code: 201
    input: [full_name, license_number, license_state, "panel_status?"]
    output: Appraiser
    side_effects:
      - "initialises performance_score_bps and lifetime_performance_score_bps to 10000"
      - "sets version to 1"

  - method: GET
    path: "/appraisal-desk/appraisers/{id}"
    description: "Read an appraiser with both performance-score variants and every panel tally."
    roles: [ChiefAppraiser, ComplianceOfficer, AppraisalDeskReviewer, AMCCoordinator, Appraiser]
    code: 200
    input: []
    output: Appraiser
    side_effects: []

  - method: GET
    path: "/appraisal-desk/appraisers"
    description: "List appraisers."
    roles: [ChiefAppraiser, ComplianceOfficer, AppraisalDeskReviewer, AMCCoordinator]
    code: 200
    input: ["panel_status?", "license_state?", "limit?", "offset?"]
    output: Appraiser[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/appraisers/{id}/panel-review"
    description: |
      Panel performance monitoring action. MONITOR recomputes both score variants from the current
      logical clock; REINSTATE and REMOVE move panel_status.
    roles: [ChiefAppraiser]
    code: 200
    input: [expected_appraiser_version, panel_action, "removal_reason?", "note?"]
    output: Appraiser
    side_effects:
      - "recomputes performance_score_bps (ROLLING_12M) and lifetime_performance_score_bps (LIFETIME)"
      - "recomputes revision_rate_bps and total_appraisal_count over the rolling window"
      - "increments Appraiser.version by 1"
      - "on REMOVE, supersedes every ACTIVE PanelMembership and forces open orders to REASSIGNMENT_REQUIRED"

  - method: POST
    path: "/appraisal-desk/amcs"
    description: "Register an appraisal management company."
    roles: [ChiefAppraiser]
    code: 201
    input: [name, "sla_response_hours?", "concurrent_dispute_capacity?", "escalation_budget_cents?", "panel_status?"]
    output: AMC
    side_effects:
      - "sets ytd_escalation_spend_cents, sla_breach_count and open_dispute_count to 0"
      - "sets version to 1"

  - method: GET
    path: "/appraisal-desk/amcs/{id}"
    description: "Read an AMC with its escalation-spend ledger and SLA tallies."
    roles: [ChiefAppraiser, ComplianceOfficer, AppraisalDeskReviewer, AMCCoordinator]
    code: 200
    input: []
    output: AMC
    side_effects: []

  - method: GET
    path: "/appraisal-desk/amcs"
    description: "List AMCs."
    roles: [ChiefAppraiser, ComplianceOfficer, AppraisalDeskReviewer]
    code: 200
    input: ["panel_status?", "limit?", "offset?"]
    output: AMC[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/panel-memberships"
    description: "Enrol an appraiser on an AMC panel for a coverage state and assignment tier."
    roles: [ChiefAppraiser]
    code: 201
    input: [appraiser_id, amc_id, coverage_state, tier, expected_appraiser_version]
    output: PanelMembership
    side_effects:
      - "increments Appraiser.version by 1"
      - "increments Appraiser.panel_membership_count"
      - "sets status ACTIVE"

  - method: GET
    path: "/appraisal-desk/panel-memberships/{id}"
    description: "Read a panel membership."
    roles: [ChiefAppraiser, ComplianceOfficer, AMCCoordinator]
    code: 200
    input: []
    output: PanelMembership
    side_effects: []

  - method: GET
    path: "/appraisal-desk/panel-memberships"
    description: "List panel memberships, filterable by appraiser or AMC."
    roles: [ChiefAppraiser, ComplianceOfficer, AMCCoordinator, AppraisalDeskReviewer]
    code: 200
    input: ["appraiser_id?", "amc_id?", "status?", "limit?", "offset?"]
    output: PanelMembership[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/appraisals"
    description: "AMC delivers an appraisal report against a loan file. Optionally supersedes a returned report."
    roles: [AMCCoordinator]
    code: 201
    input: [loan_file_id, appraiser_id, amc_id, report_form_type, effective_date, reported_value_cents, sections_present, exhibit_count, narrative_text, subject_census_tract_band, "supersedes_appraisal_id?", expected_loan_file_version]
    output: Appraisal
    side_effects:
      - "increments LoanFile.version by 1"
      - "sets review_status RECEIVED and bias_screen_status NOT_SCREENED"
      - "increments the authoring Appraiser.total_appraisal_count and recomputes both performance-score variants"
      - "when supersedes_appraisal_id is present, sets that appraisal's review_status to SUPERSEDED"
      - "sets version to 1"

  - method: GET
    path: "/appraisal-desk/appraisals/{id}"
    description: "Read an appraisal with every rule-check roll-up, the bias index and the current value."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, AMCCoordinator, Appraiser, LoanOfficer, Borrower]
    code: 200
    input: []
    output: Appraisal
    side_effects: []

  - method: GET
    path: "/appraisal-desk/appraisals"
    description: "List appraisals, filterable by loan file, appraiser, AMC, superseded report, or either status dimension."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, AMCCoordinator, LoanOfficer]
    code: 200
    input: ["loan_file_id?", "appraiser_id?", "amc_id?", "supersedes_appraisal_id?", "review_status?", "bias_screen_status?", "limit?", "offset?"]
    output: Appraisal[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/appraisals/{id}/comparables"
    description: "Add a comparable sale to the appraisal's sales-comparison grid."
    roles: [AMCCoordinator]
    code: 201
    input: [street_address, sale_price_cents, gross_adjustment_cents, net_adjustment_cents, distance_miles, sale_date, sale_status, dwelling_type, census_tract_band, "included_in_grid?"]
    output: ComparableSale
    side_effects:
      - "computes adjusted_price_cents, gross_adjustment_bps and net_adjustment_bps for the row"
      - "updates Appraisal.eligible_comp_count and closed_comp_count"

  - method: GET
    path: "/appraisal-desk/appraisals/{id}/comparables"
    description: "List the appraisal's comparable sales."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, AMCCoordinator, Appraiser]
    code: 200
    input: ["included_in_grid?", "limit?", "offset?"]
    output: ComparableSale[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/appraisals/{id}/run-rule-checks"
    description: "Run the eight automated receipt rule checks and write the scoring roll-ups."
    roles: [AppraisalDeskReviewer]
    code: 200
    input: [expected_appraisal_version]
    output: Appraisal
    side_effects:
      - "replaces the appraisal's RuleCheckResult rows with a fresh ordered set of 8"
      - "writes completeness_score_bps, max_gross_adjustment_bps, max_net_adjustment_bps, indicated_value_cents, variance_vs_reported_bps, rule_check_fail_count, rule_check_warn_count"
      - "moves review_status to RULES_CLEARED or RULES_FLAGGED"
      - "increments Appraisal.version by 1"

  - method: GET
    path: "/appraisal-desk/appraisals/{id}/rule-checks"
    description: "List the appraisal's rule-check results in emission order."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, AMCCoordinator]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: RuleCheckResult[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/appraisals/{id}/run-bias-screen"
    description: "Screen the narrative language and comparable selection for bias and discrimination indicators."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_appraisal_version]
    output: Appraisal
    side_effects:
      - "writes bias_risk_index and moves bias_screen_status to CLEAR or INDICATED"
      - "replaces the appraisal's OPEN BiasIndicatorFlag rows with a fresh ordered set"
      - "increments Appraisal.version by 1"
      - "leaves review_status untouched"

  - method: GET
    path: "/appraisal-desk/appraisals/{id}/bias-flags"
    description: "List the appraisal's bias indicator flags in emission order."
    roles: [ComplianceOfficer, ChiefAppraiser, AppraisalDeskReviewer]
    code: 200
    input: ["status?", "source?", "limit?", "offset?"]
    output: BiasIndicatorFlag[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/appraisals/{id}/communications"
    description: "Record a message about the appraisal; screened against the appraiser-independence rules."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, AMCCoordinator, LoanOfficer, Borrower]
    code: 201
    input: [recipient, intent, body]
    output: AppraiserCommunication
    side_effects:
      - "stamps sent_at from the logical clock and records sender_role and sender_user_id"

  - method: GET
    path: "/appraisal-desk/appraisals/{id}/communications"
    description: "List the appraisal's communication audit trail."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, AMCCoordinator]
    code: 200
    input: ["recipient?", "intent?", "limit?", "offset?"]
    output: AppraiserCommunication[]
    side_effects: []

  - method: GET
    path: "/appraisal-desk/appraisals/{id}/value-revisions"
    description: "List every value revision written against the appraisal, in creation order."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, LoanOfficer, AMCCoordinator]
    code: 200
    input: ["source_type?", "limit?", "offset?"]
    output: ValueRevision[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/bias-flags/{id}/adjudicate"
    description: "Adjudicate a bias indicator flag. SUBSTANTIATE quarantines the appraisal; CLEAR on a substantiated flag lifts the quarantine on appeal."
    roles: [ComplianceOfficer]
    code: 200
    input: [disposition, rationale]
    output: BiasIndicatorFlag
    side_effects:
      - "on SUBSTANTIATE: snapshots review_status into quarantine_return_status, sets review_status QUARANTINED and bias_screen_status SUBSTANTIATED, sets LoanFile.collateral_status QUARANTINED, increments Appraiser.substantiated_bias_count, recomputes both performance-score variants, cascades Appraiser.panel_status, and forces the appraiser's ASSIGNED SECOND_APPRAISAL orders to REASSIGNMENT_REQUIRED"
      - "on CLEAR of a SUBSTANTIATED flag: restores review_status from quarantine_return_status, sets bias_screen_status CLEARED_ON_REVIEW, restores LoanFile.collateral_status, decrements Appraiser.substantiated_bias_count and recomputes both performance-score variants"
      - "on CLEAR of the last OPEN flag: sets bias_screen_status CLEAR"

  - method: POST
    path: "/appraisal-desk/desk-reviews"
    description: "Open a desk review on a received appraisal; scores the PRELIMINARY quality variant."
    roles: [AppraisalDeskReviewer]
    code: 201
    input: [appraisal_id, "reviewer_note?", expected_appraisal_version]
    output: DeskReview
    side_effects:
      - "increments Appraisal.version by 1 and moves review_status to IN_DESK_REVIEW"
      - "writes preliminary_quality_score_bps and risk_tier_at_review"
      - "sets LoanFile.collateral_status to UNDER_REVIEW"
      - "locks the appraisal's comparable grid"

  - method: GET
    path: "/appraisal-desk/desk-reviews/{id}"
    description: "Read a desk review with both quality-score variants and the escalation requirement."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer]
    code: 200
    input: []
    output: DeskReview
    side_effects: []

  - method: GET
    path: "/appraisal-desk/desk-reviews"
    description: "List desk reviews, filterable by appraisal."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer]
    code: 200
    input: ["appraisal_id?", "status?", "limit?", "offset?"]
    output: DeskReview[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/desk-reviews/{id}/submit"
    description: "Submit the desk review; scores the FINAL quality variant and resolves the escalation requirement."
    roles: [AppraisalDeskReviewer]
    code: 200
    input: ["findings_note?"]
    output: DeskReview
    side_effects:
      - "writes final_quality_score_bps and required_escalation"
      - "records submitted_by_user_id from X-User-ID"

  - method: POST
    path: "/appraisal-desk/desk-reviews/{id}/decide"
    description: "Chief appraiser decides the submitted review: accept the value, escalate, or return to the AMC."
    roles: [ChiefAppraiser]
    code: 200
    input: [decision_action, "decision_note?"]
    output: DeskReview
    side_effects:
      - "on ACCEPT: designates the appraisal as value of record and recomputes LoanFile ltv_bps and decision_impact, cascading underwriting_status"
      - "on ESCALATE: creates an EscalationOrder in PENDING_ASSIGNMENT with due_at"
      - "on RETURN: sets Appraisal.review_status RETURNED_TO_AMC and unlocks the grid"
      - "records decided_by_user_id from X-User-ID"

  - method: GET
    path: "/appraisal-desk/escalation-orders/{id}"
    description: "Read an escalation order with its cost breakdown."
    roles: [ChiefAppraiser, AppraisalDeskReviewer, AMCCoordinator, ComplianceOfficer, Appraiser]
    code: 200
    input: []
    output: EscalationOrder
    side_effects: []

  - method: GET
    path: "/appraisal-desk/escalation-orders"
    description: "List escalation orders, filterable by desk review, assigned appraiser, AMC or status."
    roles: [ChiefAppraiser, AppraisalDeskReviewer, AMCCoordinator, ComplianceOfficer]
    code: 200
    input: ["desk_review_id?", "assigned_appraiser_id?", "amc_id?", "status?", "limit?", "offset?"]
    output: EscalationOrder[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/escalation-orders/{id}/assign"
    description: "Assign the field review or second appraisal to an eligible panel appraiser and price the order."
    roles: [ChiefAppraiser]
    code: 200
    input: [assigned_appraiser_id, inspection_window_start, inspection_window_end]
    output: EscalationOrder
    side_effects:
      - "writes base_fee_cents, rush_surcharge_cents, discount_pct_bps and total_cost_cents"
      - "adds total_cost_cents to AMC.ytd_escalation_spend_cents"
      - "increments Appraiser.open_assignment_count and reserves the inspection window"

  - method: POST
    path: "/appraisal-desk/escalation-orders/{id}/complete"
    description: "AMC delivers the escalation result; documents the value revision and its loan decision impact."
    roles: [AMCCoordinator]
    code: 200
    input: [resulting_value_cents, documentation_note]
    output: EscalationOrder
    side_effects:
      - "writes a ValueRevision and updates Appraisal.current_value_cents"
      - "sets Appraisal.review_status VALUE_REVISED and LoanFile.collateral_status VALUE_REVISED"
      - "recomputes LoanFile ltv_bps and decision_impact and cascades underwriting_status"
      - "recomputes the authoring appraiser's revision rate and both performance-score variants, cascading panel_status"
      - "decrements Appraiser.open_assignment_count and increments completed_assignment_count"

  - method: POST
    path: "/appraisal-desk/escalation-orders/{id}/cancel"
    description: "Cancel the escalation order and reverse its charge against the AMC's escalation budget."
    roles: [ChiefAppraiser]
    code: 200
    input: [cancel_reason]
    output: EscalationOrder
    side_effects:
      - "subtracts total_cost_cents from AMC.ytd_escalation_spend_cents while retaining total_cost_cents on the order"
      - "decrements Appraiser.open_assignment_count and releases the inspection window"
      - "returns the DeskReview to SUBMITTED and the Appraisal to IN_DESK_REVIEW"

  - method: POST
    path: "/appraisal-desk/rov-requests"
    description: "Borrower-initiated reconsideration of value intake."
    roles: [Borrower, AppraisalDeskReviewer]
    code: 201
    input: [loan_file_id, appraisal_id, borrower_statement, requested_value_cents]
    output: ROVRequest
    side_effects:
      - "sets status INTAKE and round_number 1"
      - "increments LoanFile.rov_request_count"

  - method: GET
    path: "/appraisal-desk/rov-requests/{id}"
    description: "Read an ROV request with its round, deadline and evidence tally."
    roles: [Borrower, AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, Appraiser, AMCCoordinator]
    code: 200
    input: []
    output: ROVRequest
    side_effects: []

  - method: GET
    path: "/appraisal-desk/rov-requests"
    description: "List ROV requests, filterable by loan file, appraisal or status."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, LoanOfficer]
    code: 200
    input: ["loan_file_id?", "appraisal_id?", "status?", "limit?", "offset?"]
    output: ROVRequest[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/rov-requests/{id}/evidence"
    description: "Structured evidence submission channel; admissibility is decided once, at filing."
    roles: [Borrower, AppraisalDeskReviewer]
    code: 201
    input: [evidence_type, street_address, "sale_price_cents?", "sale_date?", "distance_miles?", "citation_note?"]
    output: ROVEvidenceItem
    side_effects:
      - "writes admissible and inadmissible_reason and snapshots round_number"
      - "updates ROVRequest.admissible_evidence_count for the current round"

  - method: GET
    path: "/appraisal-desk/rov-requests/{id}/evidence"
    description: "List the evidence filed on the ROV request."
    roles: [Borrower, AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, Appraiser]
    code: 200
    input: ["admissible?", "round_number?", "limit?", "offset?"]
    output: ROVEvidenceItem[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/rov-requests/{id}/submit"
    description: "Route the reconsideration to the appraiser and start the response clock."
    roles: [AppraisalDeskReviewer]
    code: 200
    input: ["intake_note?"]
    output: ROVRequest
    side_effects:
      - "stamps response_deadline_at from the logical clock"
      - "sets Appraisal.review_status and LoanFile.collateral_status to VALUE_CONTESTED"

  - method: POST
    path: "/appraisal-desk/rov-requests/{id}/appraiser-response"
    description: "Appraiser affirms or revises the value opinion for the current round."
    roles: [Appraiser]
    code: 200
    input: [outcome, response_note, "revised_value_cents?"]
    output: ROVRequest
    side_effects:
      - "stamps appraiser_responded_at and responded_late"
      - "on VALUE_REVISED: writes a ValueRevision, updates Appraisal.current_value_cents, recomputes LoanFile ltv_bps and decision_impact, cascades underwriting_status, and recomputes the appraiser's revision rate and both performance-score variants"
      - "on VALUE_AFFIRMED: returns the collateral dimension to VALUE_ACCEPTED"

  - method: POST
    path: "/appraisal-desk/rov-requests/{id}/next-round"
    description: "Open a further reconsideration round on the same request, bounded by MAX_ROV_ROUNDS."
    roles: [AppraisalDeskReviewer]
    code: 200
    input: [next_round_reason]
    output: ROVRequest
    side_effects:
      - "increments round_number and clears the response, deadline and outcome fields"
      - "resets admissible_evidence_count for the new round"

  - method: POST
    path: "/appraisal-desk/rov-requests/{id}/finalize"
    description: "Close the reconsideration, recording the final disposition."
    roles: [AppraisalDeskReviewer]
    code: 200
    input: [closure_note]
    output: ROVRequest
    side_effects:
      - "sets status CLOSED_AFFIRMED or CLOSED_REVISED from the current outcome"

  - method: POST
    path: "/appraisal-desk/dispute-cases"
    description: "File a dispute with the AMC and reserve a review slot against its concurrent capacity."
    roles: [AppraisalDeskReviewer, ChiefAppraiser]
    code: 201
    input: [appraisal_id, amc_id, appraiser_id, dispute_basis, review_slot_start, review_slot_end]
    output: DisputeCase
    side_effects:
      - "snapshots response_deadline_at as created_at plus AMC.sla_response_hours"
      - "increments AMC.open_dispute_count"

  - method: GET
    path: "/appraisal-desk/dispute-cases/{id}"
    description: "Read a dispute case with its deadline and response state."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, AMCCoordinator, Appraiser]
    code: 200
    input: []
    output: DisputeCase
    side_effects: []

  - method: GET
    path: "/appraisal-desk/dispute-cases"
    description: "List dispute cases, filterable by appraisal, AMC, appraiser or status."
    roles: [AppraisalDeskReviewer, ChiefAppraiser, ComplianceOfficer, AMCCoordinator]
    code: 200
    input: ["appraisal_id?", "amc_id?", "appraiser_id?", "status?", "limit?", "offset?"]
    output: DisputeCase[]
    side_effects: []

  - method: POST
    path: "/appraisal-desk/dispute-cases/{id}/amc-response"
    description: "AMC relays the appraiser's response, subject to its own SLA deadline."
    roles: [AMCCoordinator]
    code: 200
    input: [appraiser_position, response_summary]
    output: DisputeCase
    side_effects:
      - "stamps appraiser_responded_at and responded_late from the logical clock"
      - "when late, increments Appraiser.sla_miss_count and AMC.sla_breach_count, recomputes both appraiser performance-score variants and cascades both panel_status machines"
      - "decrements AMC.open_dispute_count"

  - method: POST
    path: "/appraisal-desk/dispute-cases/{id}/resolve"
    description: "Resolve the dispute: uphold the value, overturn it with a compensating revision, or resolve by default after the deadline."
    roles: [ChiefAppraiser]
    code: 200
    input: [resolution, "resolved_value_cents?", "resolution_note?"]
    output: DisputeCase
    side_effects:
      - "on OVERTURNED: writes a compensating ValueRevision, updates Appraisal.current_value_cents and recomputes LoanFile ltv_bps and decision_impact"
      - "on BY_DEFAULT: increments AMC.sla_breach_count and cascades AMC.panel_status"
      - "decrements AMC.open_dispute_count when the dispute was still OPEN"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, empty, or naming a role outside the seven declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acts on a resource it does not own (AMCCoordinator on another AMC's report, Appraiser on another appraiser's ROV, Borrower on another loan file)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID deciding a desk review equals the X-User-ID that submitted it."
  - id: ERR_LOAN_FILE_NOT_FOUND
    http: 404
    condition: "The referenced LoanFile id does not exist."
  - id: ERR_APPRAISER_NOT_FOUND
    http: 404
    condition: "The referenced Appraiser id does not exist."
  - id: ERR_AMC_NOT_FOUND
    http: 404
    condition: "The referenced AMC id does not exist."
  - id: ERR_PANEL_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "The referenced PanelMembership id does not exist."
  - id: ERR_APPRAISAL_NOT_FOUND
    http: 404
    condition: "The referenced Appraisal id does not exist, including a supersedes_appraisal_id pointing at nothing."
  - id: ERR_BIAS_FLAG_NOT_FOUND
    http: 404
    condition: "The referenced BiasIndicatorFlag id does not exist."
  - id: ERR_DESK_REVIEW_NOT_FOUND
    http: 404
    condition: "The referenced DeskReview id does not exist."
  - id: ERR_ESCALATION_ORDER_NOT_FOUND
    http: 404
    condition: "The referenced EscalationOrder id does not exist."
  - id: ERR_ROV_REQUEST_NOT_FOUND
    http: 404
    condition: "The referenced ROVRequest id does not exist."
  - id: ERR_DISPUTE_CASE_NOT_FOUND
    http: 404
    condition: "The referenced DisputeCase id does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, enum value out of range, negative amount where non-negative is required, malformed timestamp, or contract_price_cents supplied on a REFINANCE loan."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative or non-integer."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_<parent>_version does not equal the parent entity's current version."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition does not exist from the target resource's current state."
  - id: ERR_APPRAISAL_GRID_LOCKED
    http: 409
    condition: "A comparable is added after a desk review has opened on the appraisal or after the value became of record."
  - id: ERR_RULE_CHECKS_NOT_RUN
    http: 409
    condition: "A desk review is opened before the automated rule checks have been run."
  - id: ERR_DESK_REVIEW_NOT_SUBMITTED
    http: 409
    condition: "A desk review decision is attempted while the review is not SUBMITTED."
  - id: ERR_ESCALATION_NOT_PENDING
    http: 409
    condition: "An escalation order is assigned while its status is neither PENDING_ASSIGNMENT nor REASSIGNMENT_REQUIRED."
  - id: ERR_ROV_NOT_AWAITING_RESPONSE
    http: 409
    condition: "An appraiser response is filed while the ROV request is not AWAITING_APPRAISER."
  - id: ERR_DISPUTE_ALREADY_RESOLVED
    http: 409
    condition: "A response or resolution is filed on a dispute already in a resolved state."
  - id: ERR_COMMUNICATION_LOCKED
    http: 409
    condition: "A communication is recorded against a SUPERSEDED or QUARANTINED appraisal."
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "The requested inspection window intersects an existing window held by the assignee once that window is widened by the 90-minute travel buffer on both sides."
  - id: ERR_DISPUTE_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "The requested review slot overlaps at least concurrent_dispute_capacity unresolved slots on the same AMC under closed-interval semantics."
  - id: ERR_BIAS_SCREEN_REQUIRED
    http: 422
    condition: "A desk review is opened or submitted while the appraisal's bias_screen_status is still NOT_SCREENED."
  - id: ERR_ESCALATION_REQUIRED
    http: 422
    condition: "ACCEPT is attempted while required_escalation != NONE, or ESCALATE is attempted while required_escalation == NONE."
  - id: ERR_BIAS_QUARANTINE_ACTIVE
    http: 422
    condition: "An operation that would move or rely on the value of record is attempted while the appraisal carries a substantiated bias quarantine."
  - id: ERR_INDEPENDENCE_VIOLATION
    http: 422
    condition: "A communication's sender role is not permitted to use the declared intent toward the declared recipient, or a value-influencing intent is used while a reconsideration is awaiting the appraiser."
  - id: ERR_AMC_NOT_ELIGIBLE
    http: 422
    condition: "The named AMC's panel_status is SUSPENDED."
  - id: ERR_APPRAISER_NOT_ON_PANEL
    http: 422
    condition: "The named appraiser holds no ACTIVE PanelMembership with the named AMC."
  - id: ERR_APPRAISER_INELIGIBLE
    http: 422
    condition: "The assignee's panel_status does not permit the order's escalation_type, or the assignee authored the escalated appraisal."
  - id: ERR_LOAN_NOT_ROV_ELIGIBLE
    http: 422
    condition: "The loan's underwriting_status is CLOSED or WITHDRAWN, or the named appraisal does not belong to the named loan."
  - id: ERR_DISPUTE_PARTY_MISMATCH
    http: 422
    condition: "The dispute's appraiser_id or amc_id does not match the named appraisal's own appraiser_id or amc_id."
  - id: ERR_COMP_DATE_AFTER_EFFECTIVE
    http: 422
    condition: "A comparable's sale_date is later than the parent appraisal's effective_date."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "An interval's start is not strictly before its end, or only one endpoint was supplied."
  - id: ERR_DISPUTE_DEADLINE_NOT_REACHED
    http: 422
    condition: "BY_DEFAULT resolution is attempted before the logical clock reaches the dispute's response_deadline_at."
  - id: ERR_DUPLICATE_COMPARABLE
    http: 422
    condition: "A comparable's normalised street_address already appears on the appraisal."
  - id: ERR_DUPLICATE_DISPUTE_BASIS
    http: 422
    condition: "A non-resolved dispute already exists on the appraisal for the same dispute_basis."
  - id: ERR_COMP_LIMIT_EXCEEDED
    http: 422
    condition: "Adding the comparable would push the appraisal past MAX_GRID_COMPS in-grid comparables."
  - id: ERR_DUPLICATE_PANEL_MEMBERSHIP
    http: 422
    condition: "An ACTIVE PanelMembership already exists for the same appraiser, AMC and coverage_state."
  - id: ERR_INSUFFICIENT_ADMISSIBLE_EVIDENCE
    http: 422
    condition: "The reconsideration is submitted with fewer than MIN_ADMISSIBLE_EVIDENCE admissible evidence items in its current round."
  - id: ERR_ROV_ROUND_LIMIT
    http: 422
    condition: "A further reconsideration round is opened when round_number already equals MAX_ROV_ROUNDS."
  - id: ERR_PANEL_ACTION_NOT_PERMITTED
    http: 422
    condition: "The requested panel_action is not permitted from the appraiser's current panel_status and performance score, or REMOVE was requested without a removal_reason."
  - id: ERR_REVISION_EXCEEDS_CAP
    http: 422
    condition: "A value revision moves the appraisal's current value by more than ROV_REVISION_CAP_BPS."
  - id: ERR_ESCALATION_BUDGET_EXCEEDED
    http: 402
    condition: "Assigning the order would push the AMC's ytd_escalation_spend_cents past its escalation_budget_cents."

