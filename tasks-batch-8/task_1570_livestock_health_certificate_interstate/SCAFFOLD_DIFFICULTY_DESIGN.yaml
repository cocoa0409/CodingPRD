            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: true, vaccination_min_days_before_inspection: 14, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-1" }
              as: LabTechnician
              captures: { test_id: $.data.id }
            - call: "POST /api/test-records/${test_id}/result"
