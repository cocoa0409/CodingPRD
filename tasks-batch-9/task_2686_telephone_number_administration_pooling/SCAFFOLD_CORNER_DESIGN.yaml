            - "GET /numbering/utilization-filings?carrier_id=${a_id} reads total_count == 0 - nothing was written for A"

      - name: duplicate_ocn_on_a_second_carrier_create
        claim_type: Violation → Error
        grounds: ["errors[ERR_DUPLICATE_OCN]", "validations[priority=23]", "endpoints[POST /numbering/carriers]"]
        distinguishing_aspect: "OCN uniqueness is global rather than per-state, so a second carrier reusing 1234 under a different legal name and a different home_state_code is still a 409."
        test_recipe:
          setup: ["Carrier A already holds OCN 1234."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Great Lakes Telecom LLC", carrier_type: "ILEC", home_state_code: "MI", months_in_operation: 4 }
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_DUPLICATE_OCN\""
            - "GET /numbering/carriers reads total_count == 1 and the surviving row is legal_name \"Acme Telecom LLC\""

      - name: duplicate_npa_code_on_a_second_npa_create
        claim_type: Violation → Error
        grounds: ["errors[ERR_DUPLICATE_NPA_CODE]", "validations[priority=24]", "endpoints[POST /numbering/npas]"]
        distinguishing_aspect: "npa_code is unique across the whole numbering plan, so re-declaring 614 for a different state and a different npa_type is refused - the same rule that later guards a relief ORDER minting a new NPA."
        test_recipe:
          setup: ["NPA 614 / OH already exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "MI", npa_type: "OVERLAY" }
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_DUPLICATE_NPA_CODE\""
