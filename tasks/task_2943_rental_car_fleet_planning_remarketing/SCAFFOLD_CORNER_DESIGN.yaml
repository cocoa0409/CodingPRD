              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/markets"
              payload: { code: "DFW", name: "Dallas", region: "CENTRAL", transport_hub_distance_km: 35, transfer_cost_per_km_cents: 300, storage_cost_per_day_cents: 700, prep_capacity_per_day: 4, registration_lead_days: 2 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_dfw: $.data.id }
          trigger:
            - call: "GET /fleet/markets/${mkt_dfw}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "GET /fleet/markets/${mkt_dfw}"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
            - call: "GET /fleet/markets/${mkt_dfw}"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "GET /fleet/markets/${mkt_dfw}"
              payload: {}
              as: RemarketingManager
              as_user_id: "u-rm-1"
            - call: "GET /fleet/markets/${mkt_dfw}"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
          assert:
            - "all five calls return HTTP 200 with identical bodies: id ${mkt_dfw}, code \"DFW\", status \"ACTIVE\", in_service_unit_count 0, version 1"
            - "the ATL operator reading the DFW market is NOT a scope violation: priority 4 lists only the eight write endpoints, and no GET is among them"
            - "GET /fleet/markets as the ATL operator reports total_count 2, not 1"

      - name: each_role_is_denied_the_other_roles_exclusive_operations_returns_403_forbidden
        claim_type: denial
        grounds:
          - validations[priority 3 ERR_ROLE_NOT_PERMITTED]
          - rbac[FleetController].exclusive_operations
          - rbac[MarketOperator].exclusive_operations
        distinguishing_aspect: "Denial is decided from §1.5's per-endpoint roles list at priority 3, ahead of every state and body check, and it applies to a READ as well: GET /fleet/vehicles/{vehicle_id}/channel-recommendation is the one GET that omits MarketOperator, so the same role that may post usage on a vehicle may not read its channel recommendation."
