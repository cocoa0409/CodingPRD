      - name: citation_hearing_branching_escalation_fork
        grounds:
          - state_machines.Citation.HEARING_PENDING_to_PAID
          - state_machines.Citation.HEARING_PENDING_to_WAIVED
          - state_machines.Citation.HEARING_PENDING_to_ESCALATED
        distinguishing_aspect: |
          Citation is a branch (fork with three divergent side-effect sets) from
          HEARING_PENDING: UPHOLD with strikes_12m < 3 -> PAID (credit accrual +
          strike recompute), UPHOLD with strikes_12m >= 3 -> ESCALATED (no credit,
          no payment), OVERTURN -> WAIVED (no credit) — branch selection depends
          on the member's LIVE strikes_12m at ruling instant, not on the panel's
          decision alone.
        test_recipe:
