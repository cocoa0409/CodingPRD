    output: WireFulfillment[]
    side_effects: []
  - method: POST
    path: "/floral/wire-fulfillments/{id}/accept"
    description: "florist accepts the assignment: ASSIGNED->ACCEPTED"
    roles: [Florist, Dispatcher]
    code: 200
    input: []
    output: WireFulfillment
    side_effects: ["set status=ACCEPTED; increments WireFulfillment.version by 1"]

  # ---- Delivery slots (read) ----
  - method: GET
    path: "/floral/zones/{id}/delivery-slots"
    description: "reverse-reachability: DeliverySlots booked against a zone"
    roles: [Dispatcher, CatalogAdmin]
    code: 200
    input: []
    output: DeliverySlot[]
    side_effects: []

  # ---- Substitutions ----
  - method: POST
    path: "/floral/substitutions"
    description: "record a stem substitution against a BOOKED order; validated by substitution_policy"
    roles: [Florist, Dispatcher]
    code: 201
    input: [order_id, florist_id, removed_stem, added_stem, price_delta_cents]
    output: Substitution
    side_effects: ["set accepted=true if policy passes; counts toward compute_final_total"]
  - method: GET
    path: "/floral/substitutions/{id}"
    description: fetch a substitution
    roles: [Florist, Dispatcher, CatalogAdmin]
    code: 200
    input: []
    output: Substitution
    side_effects: []
  - method: GET
    path: "/floral/substitutions"
    description: "list substitutions; filter by order_id or florist_id"
    roles: [Florist, Dispatcher, CatalogAdmin]
    code: 200
    input: ["order_id?", "florist_id?", "limit?", "offset?"]
    output: Substitution[]
    side_effects: []

  # ---- Quality claims ----
  - method: POST
    path: "/floral/claims"
    description: "file a quality claim against a DELIVERED order"
    roles: [Customer, Dispatcher]
    code: 201
    input: [order_id, customer_id, reason, requested_remedy]
    output: QualityClaim
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/floral/claims/{id}"
    description: fetch a claim
    roles: [Customer, Dispatcher, CatalogAdmin]
    code: 200
    input: []
    output: QualityClaim
    side_effects: []
  - method: GET
    path: "/floral/claims"
    description: "list claims; filter by order_id or customer_id"
    roles: [Customer, Dispatcher, CatalogAdmin]
    code: 200
    input: ["order_id?", "customer_id?", "limit?", "offset?"]
    output: QualityClaim[]
    side_effects: []
  - method: POST
    path: "/floral/claims/{id}/approve"
    description: "approve a claim: OPEN->APPROVED; computes refund for REFUND remedies"
    roles: [Dispatcher]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["if REFUND: compute_claim_refund -> refund_cents; increments QualityClaim.version by 1"]
  - method: POST
    path: "/floral/claims/{id}/reject"
    description: "reject a claim: OPEN->REJECTED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["increments QualityClaim.version by 1"]
  - method: POST
    path: "/floral/claims/{id}/resolve"
    description: "resolve an APPROVED claim: APPROVED->RESOLVED; spawns redelivery Order or drives refund (OCC on Order)"
    roles: [Dispatcher]
    code: 200
    input: [expected_order_version]
    output: QualityClaim
    side_effects: ["REDELIVERY: spawn redelivery Order, set redelivery_order_id; REFUND: Order CAPTURED->REFUNDED + credit wallet; increments QualityClaim.version and Order.version by 1"]

  # ---- Recurring schedules ----
  - method: POST
    path: "/floral/recurring-schedules"
    description: create a recurring schedule
    roles: [Customer, Dispatcher]
    code: 201
    input: [customer_id, arrangement_id, zone_id, cadence, next_delivery_date, window_start_minute, window_end_minute, occurrences_remaining, "recurring_discount_pct?"]
    output: RecurringSchedule
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/floral/recurring-schedules/{id}"
    description: fetch a recurring schedule
    roles: [Customer, Dispatcher, CatalogAdmin]
    code: 200
    input: []
    output: RecurringSchedule
    side_effects: []
  - method: GET
    path: "/floral/recurring-schedules"
    description: "list recurring schedules; filter by customer_id, arrangement_id, zone_id"
    roles: [Customer, Dispatcher, CatalogAdmin]
    code: 200
    input: ["customer_id?", "arrangement_id?", "zone_id?", "limit?", "offset?"]
    output: RecurringSchedule[]
    side_effects: []
  - method: POST
    path: "/floral/recurring-schedules/{id}/emit"
    description: "emit the next order: ACTIVE->ACTIVE (auto-PAUSE when occurrences exhaust)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RecurringSchedule
    side_effects: ["create Order; advance next_delivery_date; decrement occurrences_remaining; auto-PAUSE at 0; increments RecurringSchedule.version by 1"]
  - method: POST
    path: "/floral/recurring-schedules/{id}/pause"
    description: "pause: ACTIVE->PAUSED"
    roles: [Customer, Dispatcher]
    code: 200
    input: []
    output: RecurringSchedule
    side_effects: ["status=PAUSED; increments RecurringSchedule.version by 1"]
  - method: POST
    path: "/floral/recurring-schedules/{id}/resume"
    description: "resume: PAUSED->ACTIVE"
    roles: [Customer, Dispatcher]
    code: 200
    input: []
    output: RecurringSchedule
    side_effects: ["status=ACTIVE; increments RecurringSchedule.version by 1"]
  - method: POST
    path: "/floral/recurring-schedules/{id}/cancel"
    description: "cancel: ACTIVE/PAUSED->CANCELLED"
    roles: [Customer, Dispatcher]
    code: 200
    input: []
    output: RecurringSchedule
    side_effects: ["status=CANCELLED; increments RecurringSchedule.version by 1"]

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/floral/_clock/set_current_utc"
    description: "test-driving: set the server's simulated clock"
    roles: [CatalogAdmin, Dispatcher]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects: ["set ClockState.current_utc"]
  - method: GET
    path: "/floral/_clock"
    description: "read the server's simulated clock"
    roles: [CatalogAdmin, Dispatcher, Customer, Florist]
    code: 200
    input: []
    output: ClockState
    side_effects: []

  # ---- Payment authorize for redelivery / direct order quote helper ----
  - method: POST
    path: "/floral/_payments/mark_authorized"
    description: "test-driving: force an order's payment_status to AUTHORIZED at its estimated_total_cents without a real gateway (used to drive booking preconditions deterministically)"
    roles: [Dispatcher]
    code: 200
    input: [order_id]
    output: Order
    side_effects: ["payment_status UNPAID->AUTHORIZED; increments Order.version by 1"]

  # ---- Inject helpers (test-driving) ----
  - method: POST
    path: "/floral/_inject/set_loyalty_tier"
    description: "test-driving: set a customer's loyalty_tier directly (no plausible business endpoint sets a tier; promotion is otherwise only via delivered-count)"
    roles: [Dispatcher]
    code: 200
    input: [customer_id, loyalty_tier]
    output: Customer
    side_effects: ["set Customer.loyalty_tier; increments Customer.version by 1"]
  - method: POST
    path: "/floral/_inject/credit_wallet"
    description: "test-driving: credit a customer's wallet_credit_cents directly to seed wallet-credit scenarios deterministically"
    roles: [Dispatcher]
    code: 200
    input: [customer_id, amount_cents]
    output: Customer
    side_effects: ["increment Customer.wallet_credit_cents by amount_cents; increments Customer.version by 1"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers on a protected endpoint"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed role acting on a resource it does not own (X-User-ID != owner FK)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or body FK does not resolve to an existing row"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "schema violation: missing required field, enum out of range, card_message > 240 chars, window_start_minute >= window_end_minute, numeric out of range"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition is not defined from the resource's current state"
  - id: ERR_PRECONDITION_NOT_MET
    http: 409
    condition: "cross-dimension/cross-entity precondition fails (e.g. book without AUTHORIZED payment, dispatch without ACCEPTED fulfillment, approve claim whose order is not DELIVERED)"
  - id: ERR_PAST_SAME_DAY_CUTOFF
    http: 409
    condition: "same-day quote attempted after the effective same-day cutoff hour"
  - id: ERR_DELIVERY_DATE_IN_PAST
    http: 409
    condition: "delivery_date is strictly before the clock date at quote time"
  - id: ERR_SUBSTITUTION_NOT_ALLOWED
    http: 409
    condition: "substitution violates the arrangement's substitution_policy (NONE / SAME_VALUE positive delta / FLORIST_CHOICE over cap)"
  - id: ERR_ZONE_WINDOW_FULL
    http: 409
    condition: "the requested (zone, date, half-open window) already holds window_capacity_per_slot non-released bookings"
  - id: ERR_NO_FLORIST_AVAILABLE
    http: 409
    condition: "no florist in the order's zone has capacity headroom for the delivery date (empty selector candidate set), or chosen florist already at daily_capacity"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the linked Order's current version on book or claim resolve"
  - id: ERR_SCHEDULE_EXHAUSTED
    http: 409
    condition: "emit/resume on a schedule with occurrences_remaining == 0"
  - id: ERR_ZONE_INACTIVE
    http: 409
    condition: "quote against a DeliveryZone whose active == false"
  - id: ERR_ARRANGEMENT_INACTIVE
    http: 409
    condition: "quote against an Arrangement whose active == false"
  - id: ERR_CLAIM_WINDOW_INVALID
    http: 409
    condition: "claim filed against an Order that is not in fulfillment_status DELIVERED"
  - id: ERR_VALIDATION_RANGE
    http: 422
    condition: "loyalty/discount/cap/multiplier configuration value out of its declared numeric range at creation time"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Customer
    description: "the ordering customer; owns own Orders, QualityClaims, RecurringSchedules"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /floral/claims (file claim on own delivered order)"
      - "POST /floral/recurring-schedules (subscribe)"
    shared_operations:
      - "POST /floral/orders (own order)"
      - "POST /floral/orders/{id}/quote|authorize-payment|book|cancel (own order)"
      - "POST /floral/recurring-schedules/{id}/pause|resume|cancel (own schedule)"
      - "GET own orders/claims/schedules/zones/arrangements"

  - name: Florist
    description: "fulfilling local florist; owns own WireFulfillments; applies substitutions, dispatches, confirms delivery"
    identity: "entity_backed:Florist"
    exclusive_operations:
      - "POST /floral/wire-fulfillments/{id}/accept (own assignment)"
      - "POST /floral/substitutions (against orders it fulfils)"
    shared_operations:
      - "POST /floral/orders/{id}/dispatch|confirm-delivery"
      - "GET florists/wire-fulfillments/orders/substitutions/arrangements/zones"

  - name: Dispatcher
    description: "wire-service operator; runs florist selection, capacity, claim adjudication, recurring emission; opaque operator identity"
    identity: opaque
    exclusive_operations:
      - "POST /floral/florists (register florist)"
      - "PATCH /floral/florists/{id}"
      - "POST /floral/claims/{id}/approve|reject|resolve"
      - "POST /floral/recurring-schedules/{id}/emit"
      - "POST /floral/_payments/mark_authorized"
    shared_operations:
      - "all order/claim/schedule/substitution mutations as operator backstop"
      - "POST /floral/_clock/set_current_utc"

  - name: CatalogAdmin
    description: "catalog/config owner; manages arrangements, zones, holiday windows, customers; opaque operator identity"
    identity: opaque
    exclusive_operations:
      - "POST /floral/zones"
      - "POST /floral/arrangements"
      - "POST /floral/holiday-windows"
      - "POST /floral/customers"
    shared_operations:
      - "GET catalog/zones/holiday-windows/orders/claims"
      - "POST /floral/_clock/set_current_utc"
