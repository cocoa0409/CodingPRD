              as: PlatformAdmin
              captures: { lic12_id: $.data.id }
            - call: "POST /print-capacity"
              payload: { city_code: "ATL", print_type: "BASE", window_start: "2026-09-01T01:00:00Z", window_end: "2026-09-02T01:00:00Z", capacity_qty: 40, rush_sla_hours: 24 }
              as: FulfillmentCoordinator
              captures: { cap12_id: $.data.id }
          trigger:
            - call: "POST /print-capacity:reserve"
              payload: { print_capacity_id: "${cap12_id}", quantity: 20, rush_flag: true, needed_by: "2026-09-02T00:00:00Z" }
              as: FulfillmentCoordinator
              captures: { res12_id: $.data.id, res12_state: $.data.reservation_state }
            - call: "POST /print-capacity:reserve"
              payload: { print_capacity_id: "${cap12_id}", quantity: 20, rush_flag: false, needed_by: "2026-09-02T02:00:00Z" }
              as: FulfillmentCoordinator
              captures: { res12b_id: $.data.id, res12b_state: $.data.reservation_state }
            - call: "GET /print-capacity/${cap12_id}"
              payload: {}
              as: FulfillmentCoordinator
              captures: { cap12_reserved: $.data.reserved_qty, cap12_available: $.data.available_qty }
          assert:
            - "PrintReservation.${res12_id}.reservation_state == HELD"
            - "the first reservation is classified RUSH because its window starts 23 hours before needed_by"
            - "the second reservation is classified STANDARD because its window starts 25 hours before needed_by, and is still accepted"
            - "PrintCapacity.${cap12_id}.reserved_qty == 40 and available_qty == 0"

