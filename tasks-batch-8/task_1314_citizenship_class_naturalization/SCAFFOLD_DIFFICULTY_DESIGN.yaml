            - { call: "POST /naturalization/_clock/set_current_utc", payload: { to_iso8601: "2028-08-15T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - call: "POST /naturalization/workshops/${ws_id}/complete"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACCREDITATION_LAPSED (priority 8 safety beats priority 10 ERR_WORKSHOP_NOT_YET_HELD)"
            - "Workshop.${ws_id}.status remains SCHEDULED"

  # ===================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fee_waiver_income_exactly_at_150pct_boundary
        grounds:
          - calculations.fee_waiver_tier
        distinguishing_aspect: |
          Metric: income-to-guideline ratio at the FULL cap. Household 1: income
          exactly 2347500 cents (=150.000 pct of the 1565000 guideline) is FULL
          (inclusive <=); one cent above (2347501) is PARTIAL. Exercised through
          POST /naturalization/applicants/{id}/fee-waiver-requests.
        test_recipe:
          setup:
            - "Program defaults; two applicants each with ACTIVE ELIGIBLE screening"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Edge One", email: "e1@x.com", date_of_birth: "1988-06-01" }
              as: IntakeCoordinator
              captures: { e1_id: $.data.id, e1_v: $.data.version }
            - call: "POST /naturalization/applicants/${e1_id}/screenings"
              payload: { expected_applicant_version: "${e1_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 38, english_level: 2, civics_practice_pct: 40, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Edge Two", email: "e2@x.com", date_of_birth: "1989-06-01" }
              as: IntakeCoordinator
              captures: { e2_id: $.data.id, e2_v: $.data.version }
            - call: "POST /naturalization/applicants/${e2_id}/screenings"
              payload: { expected_applicant_version: "${e2_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 37, english_level: 2, civics_practice_pct: 40, has_legal_flag: false }
              as: IntakeCoordinator
          trigger:
            - call: "POST /naturalization/applicants/${e1_id}/fee-waiver-requests"
              payload: { household_size: 1, self_reported_income_cents: 2347500, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { fwr_e1: $.data.id }
            - call: "POST /naturalization/applicants/${e2_id}/fee-waiver-requests"
              payload: { household_size: 1, self_reported_income_cents: 2347501, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { fwr_e2: $.data.id }
          assert:
            - "FeeWaiverRequest.${fwr_e1}.provisional_tier == FULL (boundary value, inclusive)"
            - "FeeWaiverRequest.${fwr_e2}.provisional_tier == PARTIAL (one cent over the boundary)"

      - name: attendance_exactly_8000bp_completion_boundary
        grounds:
          - calculations.attendance_pct
          - state_machines.Enrollment.ENROLLED_to_COMPLETED
        distinguishing_aspect: |
          Metric: attendance basis points at the completion threshold. 8 of 10
          sessions attended -> 8000 bp exactly -> complete succeeds (>= 8000);
          a sibling enrollment at 7 of 10 -> 7000 bp -> ERR_ATTENDANCE_BELOW_THRESHOLD.
          Exercised through POST /naturalization/enrollments/{id}/complete — a
          different endpoint and metric than the income-ratio boundary.
