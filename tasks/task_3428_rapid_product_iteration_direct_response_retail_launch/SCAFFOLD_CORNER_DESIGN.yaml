  - section: endpoints
    instances:

      - name: error_response_envelope_shape_is_fixed
        claim_type: Standard CRUD
        grounds:
          - response_envelope.error
          - endpoints.GET_/concepts/{id}
        distinguishing_aspect: "A 404 response carries the fixed envelope: meta.api_request_id and meta.api_request_timestamp present, response_type == 'error', data.error_id == ERR_CONCEPT_NOT_FOUND, data.message a non-empty string."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clock0
          trigger:
            - call: "GET /concepts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
