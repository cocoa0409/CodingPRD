              as_user_id: "${cb45_id}"
            - call: "GET /offers"
              payload: { application_id: "${capp45_id}" }
              as: Borrower
              as_user_id: "${cb45_id}"
              captures: { coffer45_id: "$.data[0].id" }
            - call: "POST /offers/${coffer45_id}/lock"
              payload: { expected_application_version: "${capp45_ver}", autopay_elected: false }
              as: Borrower
              as_user_id: "${cb45_id}"
            - call: "POST /applications/${capp45_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-corner-25"
            - call: "POST /applications/${capp45_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-corner-25"
              captures: { cloan45_id: $.data.id }
          trigger:
            - call: "POST /loans/${cloan45_id}/forbearance"
              payload: { reason_code: "MEDICAL", months_requested: 3 }
              as: DisbursementOfficer
              as_user_id: "do-corner-25"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"

      - name: segregation_of_duties_underwriter_vs_disbursement_officer
        claim_type: segregation_of_duties
        grounds:
          - roles.Underwriter
          - roles.DisbursementOfficer
          - validations[priority=6]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_before_segregation_on_disbursement_send
          rationale: "The Underwriter-vs-DisbursementOfficer SoD on disbursement send is exercised (alongside the state-precedence pairing) by the named §1.8 instance, and additionally by the §1.9 errors-section instance err_segregation_of_duties_on_disbursement_send."

  # ===========================================================================
  # SECTION 8 — Cross-Cutting Complexity Layers
  # (optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  #  rate_threshold_triggers)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_lock_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[offer-lock-stale-application]
          - state_machines.Application.PREQUALIFIED_to_UNDER_REVIEW
          - entities.Application.fields.version
        distinguishing_aspect: "Locking an Offer with the matching expected_application_version succeeds, advancing the application to UNDER_REVIEW and incrementing Application.version (the positive OCC path complementing the §1.8 stale negative)."
        test_recipe:
          setup:
            - "A prequalified application; the borrower observed version is captured fresh before lock."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b46@x.com", full_name: "Corner B46", annual_income_cents: 30000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb46_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb46_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb46_id}"
              captures: { capp46_id: $.data.id }
            - call: "POST /applications/${capp46_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb46_id}"
            - call: "GET /applications/${capp46_id}"
              payload: {}
              as: Borrower
              as_user_id: "${cb46_id}"
              captures: { capp46_ver: $.data.version }
            - call: "GET /offers"
              payload: { application_id: "${capp46_id}" }
              as: Borrower
              as_user_id: "${cb46_id}"
              captures: { coffer46_id: "$.data[0].id" }
          trigger:
            - call: "POST /offers/${coffer46_id}/lock"
              payload: { expected_application_version: "${capp46_ver}", autopay_elected: false }
              as: Borrower
              as_user_id: "${cb46_id}"
              captures: { new_ver: $.data.version }
          assert:
            - "Offer.${coffer46_id}.status == LOCKED"
            - "Application.${capp46_id}.status == UNDER_REVIEW"
            - "Application.${capp46_id}.version == ${capp46_ver} + 1 (incremented on the OCC-guarded write)"

      - name: lock_supersedes_sibling_presented_offers
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Application.PREQUALIFIED_to_UNDER_REVIEW
          - entities.Offer.fields.status
        distinguishing_aspect: "Locking one offer sets all sibling PRESENTED offers on the same application to SUPERSEDED (single-mutation fan to sibling offers)."
        test_recipe:
          setup:
            - "A prequalified application that minted two PRESENTED offers from two matching grid cells."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "PRIME", base_apr_bps: 600, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b47@x.com", full_name: "Corner B47", annual_income_cents: 30000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb47_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb47_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb47_id}"
              captures: { capp47_id: $.data.id, capp47_ver: $.data.version }
            - call: "POST /applications/${capp47_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb47_id}"
            - call: "GET /offers"
              payload: { application_id: "${capp47_id}" }
              as: Borrower
              as_user_id: "${cb47_id}"
              captures: { coffer47a_id: "$.data[0].id", coffer47b_id: "$.data[1].id" }
          trigger:
            - call: "POST /offers/${coffer47a_id}/lock"
              payload: { expected_application_version: "${capp47_ver}", autopay_elected: false }
              as: Borrower
              as_user_id: "${cb47_id}"
          assert:
            - "Offer.${coffer47a_id}.status == LOCKED"
            - "Offer.${coffer47b_id}.status == SUPERSEDED (sibling superseded by lock)"

      - name: withdraw_cascades_supersede_to_nonterminal_offers
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Application.PREQUALIFIED_to_WITHDRAWN
          - entities.Offer.fields.status
        distinguishing_aspect: "Withdrawing a PREQUALIFIED application sets its non-terminal PRESENTED offers to SUPERSEDED, a different originating transition than offer-lock supersession."
        test_recipe:
          setup:
            - "A prequalified application with one PRESENTED offer."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 60, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b48@x.com", full_name: "Corner B48", annual_income_cents: 30000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb48_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb48_id}", requested_principal_cents: 4000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb48_id}"
              captures: { capp48_id: $.data.id }
            - call: "POST /applications/${capp48_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb48_id}"
            - call: "GET /offers"
              payload: { application_id: "${capp48_id}" }
              as: Borrower
              as_user_id: "${cb48_id}"
              captures: { coffer48_id: "$.data[0].id" }
          trigger:
            - call: "POST /applications/${capp48_id}/withdraw"
              payload: {}
              as: Borrower
              as_user_id: "${cb48_id}"
          assert:
            - "Application.${capp48_id}.status == WITHDRAWN"
            - "Offer.${coffer48_id}.status == SUPERSEDED (non-terminal offer superseded by withdraw)"

      - name: fund_cascade_pool_member_tier
        claim_type: cascading_side_effects
        grounds:
          - calculations.pool_capacity_check
          - entities.Borrower.fields.member_tier
        excluded_because:
          difficulty_instance: transitive_cascade / fund_cascade_pool_loan_member_tier_depth3
          rationale: "The depth-3 fund cascade (pool select -> committed_principal += -> member_tier NONE->SILVER) is the named §1.8 instance."

      - name: estimated_vs_locked_dual_variant
        claim_type: dual_variant_calculation
        grounds:
          - calculations.estimated_apr
          - calculations.locked_apr
        excluded_because:
          difficulty_instance: dual_variant_calc / estimated_apr_vs_locked_apr_offer
          rationale: "Both APR variants producing divergent results (800 vs 775) is the named §1.8 instance."

      - name: streak_threshold_crossing_makes_release_eligible
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.on_time_determination
          - state_machines.Loan.PENDING_to_ELIGIBLE
          - entities.Loan.fields.cosigner_release_status
        distinguishing_aspect: "The third consecutive on-time payment brings on_time_streak to exactly COSIGNER_RELEASE_STREAK (3), crossing the threshold so cosigner_release_status flips PENDING->ELIGIBLE on a CURRENT loan."
        test_recipe:
          setup:
            - "A funded CURRENT loan with a CONSENTED cosigner; three consecutive on-time payments posted across three monthly clock advances."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /abs-pools"
              payload: { pool_code: "CORNER-POOL-THR", max_principal_cents: 20000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b49@x.com", full_name: "Corner B49", annual_income_cents: 30000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb49_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb49_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb49_id}"
              captures: { capp49_id: $.data.id, capp49_ver: $.data.version }
            - call: "POST /cosigners"
              payload: { application_id: "${capp49_id}", cosigner_email: "corner.c49@x.com", cosigner_annual_income_cents: 6000000 }
              as: Borrower
              as_user_id: "${cb49_id}"
              captures: { ccos49_id: $.data.id }
            - call: "POST /cosigners/${ccos49_id}/consent"
              payload: {}
              as: Cosigner
              as_user_id: "${ccos49_id}"
            - call: "POST /applications/${capp49_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb49_id}"
            - call: "GET /offers"
              payload: { application_id: "${capp49_id}" }
              as: Borrower
              as_user_id: "${cb49_id}"
              captures: { coffer49_id: "$.data[0].id" }
            - call: "POST /offers/${coffer49_id}/lock"
              payload: { expected_application_version: "${capp49_ver}", autopay_elected: false }
              as: Borrower
              as_user_id: "${cb49_id}"
            - call: "POST /applications/${capp49_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-corner-26"
            - call: "POST /applications/${capp49_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-corner-26"
              captures: { cloan49_id: $.data.id }
            - call: "POST /loans/${cloan49_id}/payments"
              payload: { amount_cents: 40000, due_date: "2026-06-01T00:00:00Z", paid_at: "2026-06-01T00:00:00Z" }
              as: ServicingAgent
              as_user_id: "sa-corner-26"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /loans/${cloan49_id}/payments"
              payload: { amount_cents: 40000, due_date: "2026-07-01T00:00:00Z", paid_at: "2026-07-01T00:00:00Z" }
              as: ServicingAgent
              as_user_id: "sa-corner-26"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /loans/${cloan49_id}/payments"
              payload: { amount_cents: 40000, due_date: "2026-08-01T00:00:00Z", paid_at: "2026-08-01T00:00:00Z" }
              as: ServicingAgent
              as_user_id: "sa-corner-26"
          assert:
            - "Cosigner.${ccos49_id}.on_time_streak == 3 (== COSIGNER_RELEASE_STREAK)"
            - "Loan.${cloan49_id}.cosigner_release_status == ELIGIBLE (threshold crossed PENDING->ELIGIBLE)"

  # ===========================================================================
  # SECTION 9 — Consistency Model (immediate)
