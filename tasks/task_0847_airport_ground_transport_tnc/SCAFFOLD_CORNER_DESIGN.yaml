# =============================================================================
# Task 0847 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide sections; §1.5 audit pass.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_operator_returns_201_all_fields
        claim_type: creation
        grounds: [entities.Operator, endpoints.POST_/v1/operators]
        distinguishing_aspect: "POST /v1/operators with all required fields returns 201 with server-minted id, status PENDING, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/operators"
              payload: { legal_name: "New Co", operator_type: "TNC", contact_email: "n@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response http_status == 201"
            - "Operator.${op_id}.status == PENDING"
            - "Operator.${op_id}.version == 1"

      - name: create_operator_missing_type_returns_invalid_request
        claim_type: required_field
        grounds: [entities.Operator.fields.operator_type, "validations[priority=3]"]
        distinguishing_aspect: "Omitting the required operator_type field -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/operators"
              payload: { legal_name: "Bad Co", contact_email: "b@x.com" }
              as: AirportAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response http_status == 400"

      - name: create_operator_bad_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Operator.fields.operator_type, "validations[priority=3]"]
        distinguishing_aspect: "operator_type outside {TNC,TAXI,LIMO,SHUTTLE} -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/operators"
              payload: { legal_name: "Bus Co", operator_type: "BUS", contact_email: "b@x.com" }
              as: AirportAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response http_status == 400"

      - name: get_operator_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Operator, "validations[priority=4]"]
        distinguishing_aspect: "GET /v1/operators/{unknown-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/operators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AirportAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response http_status == 404"

      - name: create_operator_default_pledge_pct_applied
        claim_type: defaults
        grounds: [entities.Operator.fields.wheelchair_pledge_pct]
        distinguishing_aspect: "Omitting wheelchair_pledge_pct defaults it to 0.0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/operators"
              payload: { legal_name: "Def Co", operator_type: "TAXI", contact_email: "d@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
          assert:
            - "Operator.${op_id}.wheelchair_pledge_pct == 0.0"

      - name: create_vehicle_unknown_operator_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.Vehicle.fields.operator_id, "validations[priority=4]"]
        distinguishing_aspect: "POST /v1/vehicles with a nonexistent operator_id (matching X-User-ID) -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/vehicles"
              payload: { operator_id: "11111111-1111-4111-8111-111111111111", plate: "X" }
              as: Operator
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response http_status == 404"

      - name: list_vehicles_pagination_envelope
        claim_type: listing
        grounds: [entities.Vehicle, endpoints.GET_/v1/vehicles]
        distinguishing_aspect: "GET /v1/vehicles?operator_id filter returns an array envelope with total_count and has_more."
        test_recipe:
          setup: ["one operator with one vehicle"]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { legal_name: "List Co", operator_type: "TNC", contact_email: "li@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "LP1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "GET /v1/vehicles?operator_id=${op_id}"
              payload: {}
              as: AirportAuthority
          assert:
            - "response total_count == 1"
            - "response has_more == false"
            - "response data[0].id == ${veh_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pickup_completed_trip_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Trip, "validations[priority=6]"]
        distinguishing_aspect: "PICKUP on a trip already COMPLETED -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["operator ACTIVE; vehicle+permit; a trip driven to COMPLETED; clock 2026-04-03T12:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T12:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "IS Co", operator_type: "TNC", contact_email: "is@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "IV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-IV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotL", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe_id: $.data.id }
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh_id}", staging_lot_id: "${lot_id}", trip_kind: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response http_status == 409"

      - name: suspend_revoked_operator_terminal_lockdown
        claim_type: terminal_state
        grounds: [state_machines.Operator, "validations[priority=6]"]
        distinguishing_aspect: "REVOKED is terminal; SUSPEND on a REVOKED operator -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["operator created then REVOKED"]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { legal_name: "Rev Co", operator_type: "LIMO", contact_email: "re@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "REVOKE" }
              as: AirportAuthority
          trigger:
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "SUSPEND" }
              as: AirportAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response http_status == 409"

      - name: activate_operator_twice_idempotency_rejected
        claim_type: idempotency
        grounds: [state_machines.Operator.PENDING_to_ACTIVE, "validations[priority=6]"]
        distinguishing_aspect: "ACTIVATE on an already-ACTIVE operator -> ERR_INVALID_STATE (no PENDING->ACTIVE edge from ACTIVE)."
        test_recipe:
          setup: ["operator ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { legal_name: "Idem Co", operator_type: "TNC", contact_email: "id@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
          trigger:
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response http_status == 409"

      - name: permit_activate_mints_decal_number
        claim_type: side_effect_execution
        grounds: [state_machines.Permit.ISSUED_to_ACTIVE, entities.Permit.fields.decal_number]
        distinguishing_aspect: "ACTIVATE transitions permit ISSUED->ACTIVE and mints a non-null decal_number (null while ISSUED)."
        test_recipe:
          setup: ["operator; vehicle; an ISSUED permit; clock 2026-03-20T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Dec Co", operator_type: "TNC", contact_email: "dc@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "DCV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-DCV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id, decal_before: $.data.decal_number }
          trigger:
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
              captures: { pstatus: $.data.permit_status, decal_after: $.data.decal_number }
          assert:
            - "Permit.${permit_id}.permit_status == ACTIVE"
            - "Permit.${permit_id}.decal_number is non-null after activation"

      - name: queue_entry_requires_active_permit_guarded
        claim_type: guarded_transition
        grounds: ["validations[priority=9]", entities.Permit.fields.permit_status]
        distinguishing_aspect: "Cross-entity guard: queuing a vehicle whose permit is still ISSUED (never activated) -> ERR_VEHICLE_PERMIT_INVALID (QueueEntry->Permit)."
        test_recipe:
          setup: ["operator ACTIVE; vehicle ACTIVE with an ISSUED (not-activated) permit; a lot; clock 2026-04-06T10:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-06T10:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Grd Co", operator_type: "TNC", contact_email: "g@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "GV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-GV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/staging-lots"
              payload: { name: "LotM", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VEHICLE_PERMIT_INVALID"
            - "response http_status == 409"

      - name: queue_suspended_vehicle_returns_vehicle_not_active
        claim_type: guarded_transition
        grounds: ["validations[priority=7]", state_machines.Vehicle.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Vehicle-active check precedes the permit check: queuing a vehicle SUSPENDED by an operator suspension -> ERR_VEHICLE_NOT_ACTIVE (priority 7), not ERR_VEHICLE_PERMIT_INVALID."
        test_recipe:
          setup: ["operator suspended (so its vehicle is SUSPENDED); a lot; clock 2026-04-07T10:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-07T10:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Susp Co", operator_type: "TNC", contact_email: "su@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "SV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-SV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotN", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "SUSPEND" }
              as: AirportAuthority
          trigger:
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VEHICLE_NOT_ACTIVE"
            - "response http_status == 409"

      - name: cancel_head_queue_entry_renumbers_fifo
        claim_type: side_effect_execution
        grounds: [state_machines.QueueEntry, calculations.fifo_position_assignment, entities.QueueEntry.fields.position]
        distinguishing_aspect: "Cancelling the head (position 1) entry decrements the following WAITING entry from position 2 to position 1."
        test_recipe:
          setup: ["operator ACTIVE; two ACTIVE vehicles A,B each with active permit; A queued (pos1), B queued (pos2); clock 2026-04-08T10:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T10:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Fifo Co", operator_type: "TNC", contact_email: "f@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "FA" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { vehA: $.data.id, vehA_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${vehA}", avi_tag_id: "AVI-FA", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${vehA_v}" }
              as: AirportAuthority
              captures: { pA: $.data.id }
            - call: "POST /v1/permits/${pA}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "FB" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { vehB: $.data.id, vehB_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${vehB}", avi_tag_id: "AVI-FB", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${vehB_v}" }
              as: AirportAuthority
              captures: { pB: $.data.id }
            - call: "POST /v1/permits/${pB}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotO", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${vehA}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qeA: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${vehB}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qeB: $.data.id }
          trigger:
            - call: "POST /v1/queue-entries/${qeA}/transitions"
              payload: { action: "CANCEL" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "GET /v1/queue-entries/${qeB}"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { posB: $.data.position }
          assert:
            - "QueueEntry.${qeA}.status == CANCELLED"
            - "QueueEntry.${qeB}.position == 1"

  # ===========================================================================
  - section: calculations
    instances:
      - name: deadhead_trip_flat_fee
        claim_type: correct_result
        grounds: [calculations.trip_fee, entities.Trip.fields.trip_kind]
        distinguishing_aspect: "A DEADHEAD trip is billed the flat DEADHEAD_FEE_CENTS (100) regardless of hour/type/WAV."
        test_recipe:
          setup: ["LIMO operator ACTIVE; vehicle+permit queued; clock 2026-04-09T16:00:00Z (peak)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-09T16:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "DH Co", operator_type: "LIMO", contact_email: "dh@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "DHV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-DHV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotP", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe_id: $.data.id }
          trigger:
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh_id}", staging_lot_id: "${lot_id}", trip_kind: "DEADHEAD" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { trip_id: $.data.id, prov: $.data.provisional_fee_cents }
          assert:
            - "Trip.${trip_id}.provisional_fee_cents == 100"

      - name: trip_fee_floor_engaged
        claim_type: constants_applied
        grounds: [calculations.trip_fee]
        distinguishing_aspect: "SHUTTLE base 200 off-peak minus WAV discount 100 = 100, floored up to FEE_FLOOR_CENTS 200 by max()."
        test_recipe:
