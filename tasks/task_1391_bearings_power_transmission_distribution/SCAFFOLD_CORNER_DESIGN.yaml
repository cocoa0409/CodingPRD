              payload: { code: "CRD-28", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Limit Exact Plant", credit_limit_cents: 10000 }
              as: ContractAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Limit Short Plant", credit_limit_cents: 9999 }
              as: ContractAdministrator
              captures: { cb_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${ca_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { oa_id: $.data.id }
            - call: "POST /motion/orders/${oa_id}/lines"
              payload: { product_id: "${p_id}", qty: 1 }
              as: CounterSalesRep
            - call: "POST /motion/orders"
              payload: { customer_id: "${cb_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { ob_id: $.data.id }
            - call: "POST /motion/orders/${ob_id}/lines"
              payload: { product_id: "${p_id}", qty: 1 }
              as: CounterSalesRep
          trigger:
            - call: "POST /motion/orders/${oa_id}/confirm"
              payload: {}
              as: CounterSalesRep
              captures: { oa_st: $.data.fulfillment_status }
            - call: "POST /motion/orders/${ob_id}/confirm"
              payload: {}
              as: CounterSalesRep
              captures: { err: $.data.error_id }
          assert:
            - "oa_st == CONFIRMED (total == limit passes: <= semantics)"
            - "err == ERR_CREDIT_LIMIT_EXCEEDED and HTTP 402 (total 10000 > limit 9999)"
            - "SalesOrder.${ob_id}.fulfillment_status remains DRAFT"

