# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or parent chain mismatch" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "Body foreign-key reference does not exist or is out of scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Field range/uniqueness/type violation (bedroom_count, minutes_per_inch, limiting_layer_inches, test_pit_count, quantity, unit_cost_cents, annual_fee_cents, period bounds, scheduled_period, parcel_id/email/license uniqueness, county not covered)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a state admitting the requested transition (incl. contract over non-COMPLETED installation, education before completion, permit issuance over non-APPROVED design)" }
  - { id: ERR_SITE_FROZEN, http: 409, condition: "Site is FROZEN (seasonal freeze window active)" }
  - { id: ERR_PERMIT_EXPIRED, http: 409, condition: "site.current_period_index > permit.expires_period" }
  - { id: ERR_STALE_SCIENCE, http: 409, condition: "Pinned soil evaluation or perc test is SUPERSEDED or VOIDED at submit time" }
  - { id: ERR_SCIENCE_EXPIRED, http: 409, condition: "Science age exceeds SCIENCE_MAX_AGE_PERIODS at submit time (strict >)" }
  - { id: ERR_VARIANCE_REQUIRED, http: 409, condition: "Approval/triage requires an APPROVED variance (high-water-table GRAVITY design, or REPAIR_IN_KIND on STRUCTURAL_COLLAPSE)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Actor is the same person as the independent party the rule requires, or is not the record owner where ownership is required" }
  - { id: ERR_HOLD_POINT_NOT_PASSED, http: 409, condition: "Required PASSED hold-point inspection missing for the advance leg" }
  - { id: ERR_MATERIALS_UNVERIFIED, http: 409, condition: "Required material class not fully verified for the advance leg" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "Permit must be ISSUED (is SUSPENDED/EXPIRED/REVOKED/FINALIZED)" }
  - { id: ERR_REPLACEMENT_DESIGN_NOT_APPROVED, http: 409, condition: "Replacement remedy references a design that is not APPROVED for the site" }
  - { id: ERR_INSPECTION_TOO_EARLY, http: 409, condition: "site.current_period_index < inspection.scheduled_period at decide time" }
  - { id: ERR_VISIT_OUTSIDE_CONTRACT, http: 409, condition: "visit_period outside [start_period, end_period] inclusive, or contract not ACTIVE" }
  - { id: ERR_SCHEDULING_CONFLICT, http: 409, condition: "Inspector already holds a PENDING inspection at the same scheduled_period (capacity 1 per inspector per period)" }
  - { id: ERR_INSUFFICIENT_NOTE, http: 400, condition: "Required justification/decision_note/diagnosis_note/resolution_note/revoke_note below minimum length (20 chars)" }
  - { id: ERR_MATERIAL_BUDGET_EXCEEDED, http: 402, condition: "Verifying this material would push cumulative verified cost past the pinned design's material budget ceiling (strict >)" }
  - { id: ERR_FREEZE_IN_PAST, http: 409, condition: "freeze_until_period < site.current_period_index" }
  - { id: ERR_INVALID_RENEWAL, http: 400, condition: "new_end_period <= contract.end_period on renew" }
  - { id: ERR_OPEN_WORK_REMAINS, http: 409, condition: "Site close attempted with open designs, installations, or repair cases" }
  - { id: ERR_INSTALLATION_NOT_READY, http: 409, condition: "FINAL inspection decided PASS while installation is not READY_FOR_FINAL" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version mismatch on revise / reinstate / renew" }
  - { id: ERR_PINNED_BY_LIVE_DESIGN, http: 409, condition: "Void refused while a SUBMITTED or APPROVED design pins the science record; reinstate refused when pinned design no longer APPROVED" }
  - { id: ERR_REMEDIATION_NOT_STARTED, http: 409, condition: "REPLACEMENT remediation begun before an installation exists under a permit pinning the replacement design" }
  - { id: ERR_INVALID_DECISION, http: 400, condition: "decision/remedy payload not one of the enumerated values" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Back-office operator who registers companies and licensed staff"
    identity: opaque
    exclusive_operations:
      - "POST /septic-ops/installer-companies"
      - "POST .../soil-scientists — Register soil scientist"
      - "POST .../system-designers — Register system designer"
      - "POST .../inspectors — Register inspector"
      - "POST .../health-officers — Register health officer"
      - "POST .../project-managers — Register project manager"
    shared_operations:
      - "All GET endpoints"

  - name: ProjectManager
    description: "Runs the customer/site/installation lifecycle; schedules inspections; verifies materials; manages contracts and repair cases"
    identity: "entity_backed:ProjectManager"
    exclusive_operations:
      - "POST .../customers — Register customer"
      - "POST .../sites — Register site"
      - "POST .../sites/{id}/clock/advance — Advance logical clock"
      - "POST .../sites/{id}/freeze — Set seasonal freeze"
      - "POST .../sites/{id}/close — Close site"
      - "POST .../installations — Create installation"
      - "POST .../installations/{id}/advance — Advance installation leg"
      - "POST .../installations/{id}/remediate — Return failed installation to re-inspection"
      - "POST .../installations/{id}/abandon — Abandon installation"
      - "POST .../inspections — Schedule inspection"
      - "POST .../material-verifications — Record material delivery"
      - "POST .../material-verifications/{id}/verify — Verify material"
      - "POST .../maintenance-contracts — Create contract"
      - "POST .../maintenance-contracts/{id}/renew — Renew contract"
      - "POST .../maintenance-contracts/{id}/cancel — Cancel contract"
      - "POST .../maintenance-contracts/{id}/visits — Record visit"
      - "POST .../education-records — Deliver homeowner education"
      - "POST .../repair-cases — Open repair case"
      - "POST .../repair-cases/{id}/triage — Triage case"
      - "POST .../repair-cases/{id}/begin-remediation — Begin remediation"
      - "POST .../repair-cases/{id}/resolve — Resolve REPAIR_IN_KIND case"
      - "POST .../repair-cases/{id}/close — Close case"
    shared_operations:
      - "All GET endpoints"

  - name: SystemDesigner
    description: "Licensed designer; authors and submits designs, files variance requests"
    identity: "entity_backed:SystemDesigner"
    exclusive_operations:
      - "POST .../designs — Create design"
      - "POST .../designs/{id}/submit — Submit design"
      - "POST .../designs/{id}/revise — Return rejected design to draft"
      - "POST .../designs/{id}/withdraw — Withdraw draft design"
      - "POST .../variance-requests — File variance request"
      - "POST .../variance-requests/{id}/withdraw — Withdraw variance request"
    shared_operations:
      - "All GET endpoints"

  - name: SoilScientist
    description: "Licensed evaluator; records and voids soil evaluations and percolation tests"
    identity: "entity_backed:SoilScientist"
    exclusive_operations:
      - "POST .../soil-evaluations — Record soil evaluation"
      - "POST .../soil-evaluations/{id}/void — Void evaluation (owner only)"
      - "POST .../percolation-tests — Record perc test"
      - "POST .../percolation-tests/{id}/void — Void perc test (owner only)"
    shared_operations:
      - "All GET endpoints"

  - name: Inspector
    description: "Licensed inspector; decides hold-point inspections (segregated from crew and designer)"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST .../inspections/{id}/decide — Decide inspection"
    shared_operations:
      - "All GET endpoints"

  - name: HealthOfficer
    description: "Authority officer; decides designs and variances, issues/suspends/reinstates/revokes permits (segregated from designers)"
    identity: "entity_backed:HealthOfficer"
    exclusive_operations:
      - "POST .../designs/{id}/decide — Approve or reject design"
      - "POST .../permits — Issue permit"
      - "POST .../permits/{id}/suspend — Suspend permit"
      - "POST .../permits/{id}/reinstate — Reinstate permit"
      - "POST .../permits/{id}/revoke — Revoke permit"
      - "POST .../variance-requests/{id}/decide — Decide variance request"
    shared_operations:
      - "All GET endpoints"
