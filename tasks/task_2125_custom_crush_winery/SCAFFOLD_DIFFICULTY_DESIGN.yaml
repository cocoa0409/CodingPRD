              payload: { action: "START_AGING" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot2}/transitions"
              payload: { action: "START_FERMENTATION" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot2}/transitions"
              payload: { action: "PRESS", loss_gallons: 0 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot2}/transitions"
              payload: { action: "START_AGING" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /blend-trials"
              payload: { contract_id: "${ct1}", trial_name: "Estate Cuvee", target_lot_code: "BLEND-26-01", declared_loss_pct: 2.00, components: [{ source_lot_id: "${lot1}", volume_gallons: 750.00 }, { source_lot_id: "${lot2}", volume_gallons: 866.25 }] }
              as: ClientRep
              as_user_id: "${cl1}"
              captures: { bt1: $.data.id }
            - call: "POST /blend-trials/${bt1}/transitions"
              payload: { action: "SUBMIT" }
              as: ClientRep
              as_user_id: "${cl1}"
            - call: "POST /blend-trials/${bt1}/transitions"
              payload: { action: "APPROVE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "GET /contracts/${ct1}"
              as: ClientRep
              as_user_id: "${cl1}"
              captures: { ct1_v: $.data.version }
            - call: "POST /blend-trials/${bt1}/execute"
              payload: { expected_contract_version: "${ct1_v}" }
              as: ClientRep
              as_user_id: "${cl1}"
              captures: { blot: $.data.result_lot_id }
          trigger:
            - call: "POST /blend-trials/${bt1}/transitions"
              payload: { action: "UNWIND" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { st: $.data.status, res: $.data.result_lot_id }
          assert:
            - "before the trigger: Lot.${lot1}.volume_gallons == 815.00, Lot.${lot2}.volume_gallons == 0.00, Lot.${blot}.volume_gallons == 1583.92, Lot.${blot}.loss_gallons == 32.33 — INVARIANT_GALLONS == 2431.25"
            - "${st} == UNWOUND and ${res} == null"
            - "Lot.${lot1}.volume_gallons == 1565.00 and loss_gallons == 0.00"
            - "Lot.${lot2}.volume_gallons == 866.25, loss_gallons == 0.00, production_status == AGING, parent_lot_id == null"
            - "Lot.${blot}.volume_gallons == 0.00, loss_gallons == 0.00, production_status == CONSUMED, component_manifest == []"
            - "INVARIANT_GALLONS(${ct1}) == 2431.25 after the unwind — identical to the pre-execute reading, zero drift"
            - "Client.${cl1}.bond_gallons_in_bond == 2431.25"

