              as: WaterChemist
              captures: { v3_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "V3-1", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { v3_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${v3_asset}", product_id: "${v3_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { v3_fs: $.data.id }
            - { call: "POST /wt/feed-stations/${v3_fs}/bring-online", payload: {}, as: WaterChemist }
          trigger:
            - call: "POST /wt/delivery-orders"
