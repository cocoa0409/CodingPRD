# =============================================================================
# SCAFFOLD — task_3085_endorsement_based_zero_interest_microloan_crowdfunding
# Endorsement-based zero-interest microloan crowdfunding (Kiva U.S. style)
# =============================================================================

scenario: |
  Endorsement-Based Zero-Interest Microloan Crowdfunding (Kiva U.S.): borrower
  application with social underwriting rather than credit score thresholds,
  private fundraising period requiring a number of personal endorsers to lend
  before public listing, public campaign period with per-lender minimum
  contributions and expiration handling, disbursement upon full funding with
  partial-funding cancellation rules, repayment schedule with lender credit
  returned to a lending account rather than paid as interest, delinquency
  communication with borrower coaching and no collections referral, trustee
  endorsement program where community organizations vouch for borrowers,
  impact reporting to lenders on business outcomes

domain_name: endorsement-microloan-crowdfunding
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  # Quorum: N distinct private endorsers must lend before public listing;
  # trustee vouching reduces the quorum; timeout/expiry cancels the deal.
  secondary_archetype: workflow_orchestration
  # Application pipeline DRAFT -> IN_REVIEW -> PRIVATE_FUNDRAISING ->
  # PUBLIC_FUNDRAISING -> FUNDED -> REPAYING with revision loops and expiry.
  complexity_layers:
    - optimistic_concurrency       # OCC on LoanApplication.version and Borrower.version
    - cascading_side_effects       # payment -> installments -> loan -> borrower/trustee
    - dual_variant_calculation     # underwriting score variants; provisional vs final schedule
    - rate_threshold_triggers      # endorser quorum, trustee default-rate suspension
  entity_topology: flat            # peer entities joined by FK references; no nested creation paths
  state_machine_shape: branching   # fork/join at PRIVATE_FUNDRAISING plus DRAFT<->IN_REVIEW and REPAYING<->DELINQUENT cycles
  relationship_patterns:
    - one_to_many
    - cross_aggregate              # endorsements/contributions join Lender x LoanApplication; trustee endorsements join Trustee x LoanApplication
  role_model: peer_roles           # Borrower / Lender / Trustee own disjoint operation sets; PlatformAdmin operates
  consistency_model: immediate     # every mutation + cascade visible in the same response

# =============================================================================
# Table 1: Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Borrower legal name" }
      - { name: business_name, type: string, source: input, description: "Business name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across borrowers" }
      - { name: business_tenure_months, type: integer, source: input, description: "Months the business has operated; feeds underwriting score" }
      - { name: prior_repaid_loans_count, type: integer, source: input, default: 0, description: "Self-declared count of prior fully repaid microloans; feeds underwriting score" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | RESTRICTED — RESTRICTED set automatically when one of the borrower's loans is DEFAULTED", constraints: "REGISTERED | RESTRICTED" }
      - { name: social_underwriting_score, type: number, source: computed, default: 0, description: "Last computed social underwriting score (see calculations.social_underwriting_score); 0 until first submit" }
      - { name: underwriting_variant, type: enum, source: computed, default: NONE, description: "Variant used for the last score computation", constraints: "NONE | STANDARD | TRUSTEE_AUGMENTED" }
      - { name: completed_loan_count, type: integer, source: computed, default: 0, description: "Count of the borrower's loans that reached PAID_OFF" }
      - { name: defaulted_loan_count, type: integer, source: computed, default: 0, description: "Count of the borrower's loans that reached DEFAULTED" }
      - { name: restricted_since, type: datetime, source: system, description: "Timestamp of the default that set status=RESTRICTED; null while REGISTERED" }

  - name: UnderwritingInvite
    parent: Borrower
    common_fields: false
    fields:
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; owner of this invite" }
      - { name: invitee_email, type: string, source: input, description: "Email of the invited community member; unique per borrower" }
      - { name: invite_token, type: string, source: system, description: "Server-minted opaque token used in the invite URL path" }
      - { name: status, type: enum, source: system, default: SENT, description: "SENT | ACCEPTED | DECLINED | EXPIRED — EXPIRED set by sweep 30 days after creation", constraints: "SENT | ACCEPTED | DECLINED | EXPIRED" }
      - { name: responded_at, type: datetime, source: system, description: "Timestamp of accept/decline/expiry; null while SENT" }

  - name: Lender
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Lender display name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across lenders" }
      - { name: lending_balance_cents, type: integer, source: system, default: 0, description: "Spendable lending-account balance; debited on lend, credited on repayment share and on refund" }
      - { name: total_deposited_cents, type: integer, source: system, default: 0, description: "Lifetime deposits into the lending account" }
      - { name: lifetime_lent_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this lender's ACTIVE endorsements and ACTIVE contributions across all loans" }
      - { name: lifetime_repaid_cents, type: integer, source: computed, default: 0, description: "Lifetime principal credited back through repayment distribution" }

  - name: Trustee
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Community organization name" }
      - { name: endorsement_limit_cents, type: integer, source: input, description: "Cap on the sum of amount_cents over this trustee's ACTIVE trustee endorsements" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE | SUSPENDED" }
      - { name: suspension_reason, type: enum, source: system, default: NONE, description: "NONE | MANUAL | DEFAULT_RATE", constraints: "NONE | MANUAL | DEFAULT_RATE" }
      - { name: active_endorsement_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over ACTIVE trustee endorsements issued by this trustee" }
      - { name: endorsed_terminal_count, type: integer, source: computed, default: 0, description: "Count of trustee-endorsed loans in terminal repayment states (PAID_OFF or DEFAULTED)" }
      - { name: endorsed_defaulted_count, type: integer, source: computed, default: 0, description: "Count of trustee-endorsed loans in DEFAULTED" }
      - { name: default_rate_bps, type: integer, source: computed, default: 0, description: "round(10000 * endorsed_defaulted_count / endorsed_terminal_count); 0 when endorsed_terminal_count == 0" }

  - name: LoanApplication
    parent: Borrower
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; applicant" }
      - { name: trustee_id, type: string, source: input, description: "FK -> Trustee.id; vouching trustee chosen at submission; required iff endorsement_mode == TRUSTEE_VOUCHED, forbidden otherwise" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested principal; must be a positive multiple of 100" }
      - { name: term_months, type: integer, source: input, description: "Repayment term; integer 3..36 inclusive" }
      - { name: business_purpose, type: string, source: input, description: "Free-text description of intended loan use" }
      - { name: endorsement_mode, type: enum, source: system, description: "SELF_ENDORSED | TRUSTEE_VOUCHED — set at submission", constraints: "SELF_ENDORSED | TRUSTEE_VOUCHED" }
      - { name: required_endorser_count, type: integer, source: computed, description: "Endorser quorum: 15 when SELF_ENDORSED, 5 when TRUSTEE_VOUCHED; pinned at submission" }
      - { name: distinct_endorser_count, type: integer, source: computed, default: 0, description: "Number of distinct lenders holding an ACTIVE endorsement on this application" }
      - { name: private_total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over ACTIVE endorsements" }
      - { name: public_total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over ACTIVE contributions" }
      - { name: funded_total_cents, type: integer, source: computed, default: 0, description: "private_total_cents + public_total_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | IN_REVIEW | APPROVED_PENDING_FUNDRAISE | PRIVATE_FUNDRAISING | PUBLIC_FUNDRAISING | FUNDED | WITHDRAWN | EXPIRED_PRIVATE | EXPIRED_PUBLIC | REJECTED | CANCELLED", constraints: "DRAFT | IN_REVIEW | APPROVED_PENDING_FUNDRAISE | PRIVATE_FUNDRAISING | PUBLIC_FUNDRAISING | FUNDED | WITHDRAWN | EXPIRED_PRIVATE | EXPIRED_PUBLIC | REJECTED | CANCELLED" }
      - { name: review_notes, type: string, source: system, description: "Notes recorded on approve or reject; null until reviewed" }
      - { name: private_started_at, type: datetime, source: system, description: "Timestamp of entry into PRIVATE_FUNDRAISING" }
      - { name: private_deadline, type: datetime, source: computed, description: "private_started_at + 15 days" }
      - { name: public_started_at, type: datetime, source: system, description: "Timestamp of entry into PUBLIC_FUNDRAISING" }
      - { name: public_deadline, type: datetime, source: computed, description: "public_started_at + 30 days" }
      - { name: funded_at, type: datetime, source: system, description: "Timestamp of entry into FUNDED; null until fully funded" }
      - { name: terminal_at, type: datetime, source: system, description: "Timestamp of entry into any terminal status; null while live" }

  - name: Endorsement
    parent: LoanApplication
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: system, description: "FK -> LoanApplication.id; endorsed application" }
      - { name: lender_id, type: string, source: input, description: "FK -> Lender.id; endorsing lender" }
      - { name: amount_cents, type: integer, source: input, description: "Endorsement lend amount in cents; >= 2500" }
      - { name: is_trustee_endorsement, type: boolean, source: computed, default: false, description: "True when created via a trustee delegation token; trustee endorsements count toward the quorum but never debit a Lender balance" }
      - { name: trustee_id, type: string, source: system, description: "FK -> Trustee.id; vouching trustee when is_trustee_endorsement, else null" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CANCELLED | REFUNDED | CONVERTED", constraints: "ACTIVE | CANCELLED | REFUNDED | CONVERTED" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp of the terminal status change; null while ACTIVE" }

  - name: Contribution
    parent: LoanApplication
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: system, description: "FK -> LoanApplication.id; funded application" }
      - { name: lender_id, type: string, source: input, description: "FK -> Lender.id; contributing lender" }
      - { name: amount_cents, type: integer, source: input, description: "Contribution amount in cents; >= 2500" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REFUNDED | CONVERTED", constraints: "ACTIVE | REFUNDED | CONVERTED" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp of REFUNDED/CONVERTED; null while ACTIVE" }

  - name: Loan
    parent: LoanApplication
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: system, description: "FK -> LoanApplication.id; unique — at most one loan per application" }
      - { name: borrower_id, type: string, source: computed, description: "FK -> Borrower.id; copied from the application at disbursement" }
      - { name: principal_cents, type: integer, source: computed, description: "Equal to the application's requested_amount_cents at disbursement" }
      - { name: term_months, type: integer, source: computed, description: "Copied from the application at disbursement" }
      - { name: disbursed_at, type: datetime, source: system, description: "Timestamp of disbursement" }
      - { name: status, type: enum, source: system, default: REPAYING, description: "REPAYING | DELINQUENT | PAID_OFF | DEFAULTED", constraints: "REPAYING | DELINQUENT | PAID_OFF | DEFAULTED" }
      - { name: schedule_status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | FINAL — FINAL set by POST /loans/{id}/finalize-schedule (OCC-guarded)", constraints: "PROVISIONAL | FINAL" }
      - { name: provisional_base_cents, type: integer, source: computed, description: "floor(principal_cents / term_months) — even-split base used by the provisional schedule" }
      - { name: final_base_cents, type: integer, source: computed, description: "floor((principal_cents - 100) / term_months) — first-installment-scaled base used by the finalized schedule" }
      - { name: final_first_cents, type: integer, source: computed, description: "principal_cents - (term_months - 1) * final_base_cents — absorbs all rounding remainder into installment 1" }
      - { name: outstanding_cents, type: integer, source: computed, description: "Sum of remaining_cents over all installments" }
      - { name: delinquent_since, type: datetime, source: system, description: "Timestamp of entry into DELINQUENT; null while REPAYING" }
      - { name: defaulted_at, type: datetime, source: system, description: "Timestamp of DEFAULTED; null otherwise" }

  - name: Installment
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; parent loan" }
      - { name: installment_number, type: integer, source: computed, description: "1..term_months, ascending" }
      - { name: due_date, type: datetime, source: computed, description: "disbursed_at + installment_number * 1 month" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Provisional: even split with remainder in last installment; Final: final_first_cents at installment 1, final_base_cents otherwise" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Principal applied from payments; may exceed amount_due_cents when a payment overpays (excess carries forward)" }
      - { name: remaining_cents, type: integer, source: computed, description: "max(0, amount_due_cents - amount_paid_cents)" }
      - { name: status, type: enum, source: computed, default: PENDING, description: "PENDING | DUE | PARTIAL | PAID | LATE", constraints: "PENDING | DUE | PARTIAL | PAID | LATE" }
      - { name: paid_at, type: datetime, source: system, description: "Timestamp when the installment reached PAID; null otherwise" }

  - name: Payment
    parent: Loan
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan being paid" }
      - { name: borrower_id, type: string, source: computed, description: "FK -> Borrower.id; copied from the loan for reverse lookup" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; integer cents, must be >= 100" }
      - { name: paid_at, type: datetime, source: system, description: "Timestamp of the payment (server clock)" }

  - name: ImpactReport
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan this report describes" }
      - { name: borrower_id, type: string, source: computed, description: "FK -> Borrower.id; copied from the loan for lender impact aggregation" }
      - { name: months_after_disbursement, type: integer, source: input, description: "Whole months between loan.disbursed_at and current time; must equal the actual elapsed whole-month count" }
      - { name: revenue_change_pct, type: integer, source: input, description: "Business revenue change vs pre-loan baseline, percent, -100..1000" }
      - { name: jobs_created, type: integer, source: input, description: "Net new jobs attributable to the loan, 0..100" }
      - { name: narrative, type: string, source: input, description: "Free-text outcome narrative" }
      - { name: is_mid_term, type: boolean, source: computed, description: "months_after_disbursement <= floor(term_months / 2) — selects the simple-impact vs standard-impact variant of lender_impact_report" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: UnderwritingInvite
    initial_state: SENT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: SENT
        to: ACCEPTED
        trigger: "POST /underwriting-invites/{token}/accept"
        actor: Anonymous
        preconditions:
          - "Invite exists with this invite_token (ERR_NOT_FOUND)"
          - "Invite status == SENT (ERR_INVITE_NOT_PENDING)"
        side_effects:
          - "responded_at := current time"
      - from: SENT
        to: DECLINED
        trigger: "POST /underwriting-invites/{token}/decline"
        actor: Anonymous
        preconditions:
          - "Invite exists with this invite_token (ERR_NOT_FOUND)"
          - "Invite status == SENT (ERR_INVITE_NOT_PENDING)"
        side_effects:
          - "responded_at := current time"
      - from: SENT
        to: EXPIRED
        trigger: "POST /_sweeps/run (system sweep)"
        actor: system
        preconditions:
          - "Invite status == SENT"
          - "created_at <= current time - 30 days"
        side_effects:
          - "responded_at := sweep time"

  - entity: Borrower
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: RESTRICTED
        trigger: "system (automatic when any loan of this borrower enters DEFAULTED)"
        actor: system
        preconditions: []
        side_effects:
          - "restricted_since := default timestamp"
          - "defaulted_loan_count += 1"
          - "POST /borrowers cannot re-register this email (ERR_DUPLICATE_EMAIL)"
      - from: RESTRICTED
        to: REGISTERED
        trigger: "system (never automatic — a defaulted loan is never un-defaulted); no manual transition exists"
        actor: system
        preconditions: []
        side_effects: []
        note: "Declared for completeness; unreachable in practice. RESTRICTED is effectively terminal."

  - entity: Trustee
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /trustees/{id}/suspend (manual) OR system automatic in sweep when default_rate_bps > 2000 and endorsed_terminal_count >= 3"
        actor: "PlatformAdmin | system"
        preconditions:
          - "Manual: Trustee status == ACTIVE (ERR_INVALID_STATE)"
          - "Automatic: default_rate_bps > 2000 and endorsed_terminal_count >= 3"
        side_effects:
          - "suspension_reason := MANUAL for the manual trigger, DEFAULT_RATE for the sweep trigger"
          - "New trustee endorsements referencing this trustee are rejected (ERR_TRUSTEE_SUSPENDED) while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /trustees/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Trustee status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "suspension_reason := NONE"

  - entity: LoanApplication
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, EXPIRED_PRIVATE, EXPIRED_PUBLIC, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /loan-applications/{id}/submit"
        actor: Borrower
        preconditions:
          - "Application status == DRAFT (ERR_INVALID_STATE)"
          - "Acting borrower is the application owner (ERR_FORBIDDEN)"
          - "Borrower.status == REGISTERED (ERR_BORROWER_RESTRICTED)"
          - "No other loan application of this borrower is in a live status {DRAFT, IN_REVIEW, APPROVED_PENDING_FUNDRAISE, PRIVATE_FUNDRAISING, PUBLIC_FUNDRAISING, FUNDED} (ERR_ACTIVE_APPLICATION_EXISTS)"
          - "Acceptance quota met: count of the borrower's UnderwritingInvites with status == ACCEPTED >= max(3, floor(requested_amount_cents / 1000000)) (ERR_UNDERWRITING_ACCEPTANCE_QUOTA)"
          - "If endorsement_mode is trustee-vouched (trustee_id provided): trustee exists (ERR_NOT_FOUND), Trustee.status == ACTIVE (ERR_TRUSTEE_SUSPENDED), requested_amount_cents + trustee.active_endorsement_exposure_cents <= trustee.endorsement_limit_cents (ERR_TRUSTEE_LIMIT_EXCEEDED)"
          - "trustee_id provided XOR trustee_id absent is enforced by the mode: providing trustee_id selects TRUSTEE_VOUCHED; omitting it selects SELF_ENDORSED"
        side_effects:
          - "endorsement_mode := TRUSTEE_VOUCHED if trustee_id provided else SELF_ENDORSED"
          - "required_endorser_count := 5 if TRUSTEE_VOUCHED else 15"
          - "borrower.social_underwriting_score recomputed and borrower.underwriting_variant set (calculations.social_underwriting_score)"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /loan-applications/{id}/request-changes"
        actor: PlatformAdmin
        preconditions:
          - "Application status == IN_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "review_notes := notes"
      - from: IN_REVIEW
        to: APPROVED_PENDING_FUNDRAISE
        trigger: "POST /loan-applications/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "Application status == IN_REVIEW (ERR_INVALID_STATE)"
          - "borrower.social_underwriting_score >= 60 (ERR_SCORE_TOO_LOW)"
        side_effects:
          - "review_notes := notes"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /loan-applications/{id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "Application status == IN_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "review_notes := notes"
          - "terminal_at := current time"
      - from: APPROVED_PENDING_FUNDRAISE
        to: PRIVATE_FUNDRAISING
        trigger: "POST /loan-applications/{id}/open-private"
        actor: Borrower
        preconditions:
          - "Application status == APPROVED_PENDING_FUNDRAISE (ERR_INVALID_STATE)"
          - "Acting borrower is the application owner (ERR_FORBIDDEN)"
        side_effects:
          - "private_started_at := current time; private_deadline := current time + 15 days"
      - from: PRIVATE_FUNDRAISING
        to: PUBLIC_FUNDRAISING
        trigger: "POST /loan-applications/{id}/open-public"
        actor: Borrower
        preconditions:
          - "Application status == PRIVATE_FUNDRAISING (ERR_INVALID_STATE)"
          - "Acting borrower is the application owner (ERR_FORBIDDEN)"
          - "distinct_endorser_count >= required_endorser_count (ERR_QUORUM_NOT_MET)"
        side_effects:
          - "public_started_at := current time; public_deadline := current time + 30 days"
      - from: PRIVATE_FUNDRAISING
        to: EXPIRED_PRIVATE
        trigger: "POST /_sweeps/run (system sweep)"
        actor: system
        preconditions:
          - "Application status == PRIVATE_FUNDRAISING"
          - "current time > private_deadline"
        side_effects:
          - "terminal_at := sweep time"
          - "Every ACTIVE endorsement on this application -> REFUNDED (resolved_at := sweep time); for each non-trustee endorsement, lender.lending_balance_cents += amount_cents"
          - "private_total_cents recomputed to 0; distinct_endorser_count recomputed to 0"
      - from: PUBLIC_FUNDRAISING
        to: EXPIRED_PUBLIC
        trigger: "POST /_sweeps/run (system sweep)"
        actor: system
        preconditions:
          - "Application status == PUBLIC_FUNDRAISING"
          - "current time > public_deadline"
          - "funded_total_cents < requested_amount_cents"
        side_effects:
          - "terminal_at := sweep time"
          - "Every ACTIVE endorsement -> REFUNDED and every ACTIVE contribution -> REFUNDED (resolved_at := sweep time); each non-trustee endorsement and each contribution credits lender.lending_balance_cents += amount_cents"
          - "private_total_cents and public_total_cents recomputed to 0; distinct_endorser_count recomputed to 0"
      - from: PUBLIC_FUNDRAISING
        to: FUNDED
        trigger: "system (automatic when a contribution makes funded_total_cents >= requested_amount_cents)"
        actor: system
        preconditions:
          - "funded_total_cents >= requested_amount_cents"
        side_effects:
          - "funded_at := current time"
      - from: FUNDED
        to: CANCELLED
        trigger: "POST /loan-applications/{id}/cancel"
        actor: Borrower
        preconditions:
          - "Application status == FUNDED (ERR_INVALID_STATE)"
          - "Acting borrower is the application owner (ERR_FORBIDDEN)"
          - "No Loan exists for this application (ERR_INVALID_STATE)"
        side_effects:
          - "terminal_at := current time"
          - "All ACTIVE endorsements and contributions -> REFUNDED; lender balances credited"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /loan-applications/{id}/withdraw"
        actor: Borrower
        preconditions:
          - "Application status in {DRAFT, IN_REVIEW, APPROVED_PENDING_FUNDRAISE, PRIVATE_FUNDRAISING} (ERR_INVALID_STATE)"
          - "Acting borrower is the application owner (ERR_FORBIDDEN)"
        side_effects:
          - "terminal_at := current time"
          - "When withdrawing from PRIVATE_FUNDRAISING: all ACTIVE endorsements -> CANCELLED; lender balances credited"
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /loan-applications/{id}/withdraw"
        actor: Borrower
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: ["same as DRAFT -> WITHDRAWN"]
      - from: APPROVED_PENDING_FUNDRAISE
        to: WITHDRAWN
        trigger: "POST /loan-applications/{id}/withdraw"
        actor: Borrower
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: ["same as DRAFT -> WITHDRAWN"]
      - from: PRIVATE_FUNDRAISING
        to: WITHDRAWN
        trigger: "POST /loan-applications/{id}/withdraw"
        actor: Borrower
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: ["same as DRAFT -> WITHDRAWN plus endorsement cancellation"]

  - entity: Endorsement
    initial_state: ACTIVE
    terminal_states: [CANCELLED, REFUNDED, CONVERTED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /loan-applications/{id}/withdraw from PRIVATE_FUNDRAISING"
        actor: Borrower
        preconditions:
          - "Endorsement status == ACTIVE"
        side_effects:
          - "resolved_at := current time"
          - "Non-trustee: lender.lending_balance_cents += amount_cents"
      - from: ACTIVE
        to: REFUNDED
        trigger: "system (application expires or a FUNDED application is cancelled before disbursement)"
        actor: system
        preconditions:
          - "Endorsement status == ACTIVE"
        side_effects:
          - "resolved_at := current time"
          - "Non-trustee: lender.lending_balance_cents += amount_cents"
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /loan-applications/{id}/disburse"
        actor: PlatformAdmin
        preconditions:
          - "Endorsement status == ACTIVE"
        side_effects:
          - "resolved_at := disbursement timestamp"
          - "Trustee endorsement: trustee.active_endorsement_exposure_cents unchanged (amount already counted since creation)"

  - entity: Contribution
    initial_state: ACTIVE
    terminal_states: [REFUNDED, CONVERTED]
    transitions:
      - from: ACTIVE
        to: REFUNDED
        trigger: "system (application expires in PUBLIC_FUNDRAISING or a FUNDED application is cancelled before disbursement)"
        actor: system
        preconditions:
          - "Contribution status == ACTIVE"
        side_effects:
          - "resolved_at := current time"
          - "lender.lending_balance_cents += amount_cents"
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /loan-applications/{id}/disburse"
        actor: PlatformAdmin
        preconditions:
          - "Contribution status == ACTIVE"
        side_effects:
          - "resolved_at := disbursement timestamp"

  - entity: Loan
    initial_state: REPAYING
    terminal_states: [PAID_OFF, DEFAULTED]
    transitions:
      - from: REPAYING
        to: DELINQUENT
        trigger: "POST /_sweeps/run (system sweep)"
        actor: system
        preconditions:
          - "Loan status == REPAYING"
          - "Earliest non-PAID installment (lowest installment_number with status != PAID) has due_date < current time - 14 days"
        side_effects:
          - "delinquent_since := sweep time"
          - "A delinquency coaching message is recorded for the borrower (no collections referral exists anywhere in the system)"
      - from: DELINQUENT
        to: REPAYING
        trigger: "system (automatic when a payment leaves no non-PAID installment with due_date < current time - 14 days)"
        actor: system
        preconditions:
          - "Every non-PAID installment has due_date >= current time - 14 days"
        side_effects:
          - "delinquent_since := null"
      - from: REPAYING
        to: PAID_OFF
        trigger: "system (automatic when a payment leaves outstanding_cents == 0)"
        actor: system
        preconditions:
          - "outstanding_cents == 0 after applying the payment"
        side_effects:
          - "borrower.completed_loan_count += 1"
          - "If a trustee endorsed the underlying application: trustee.endorsed_terminal_count += 1 and trustee.default_rate_bps recomputed"
      - from: DELINQUENT
        to: PAID_OFF
        trigger: "system (same condition as REPAYING -> PAID_OFF)"
        actor: system
        preconditions:
          - "outstanding_cents == 0 after applying the payment"
        side_effects: ["same as REPAYING -> PAID_OFF"]
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "POST /_sweeps/run (system sweep)"
        actor: system
        preconditions:
          - "Loan status == DELINQUENT"
          - "Earliest non-PAID installment has due_date < current time - 74 days (14-day delinquency window plus 60-day default horizon)"
        side_effects:
          - "defaulted_at := sweep time"
          - "borrower.status := RESTRICTED, borrower.restricted_since := sweep time, borrower.defaulted_loan_count += 1"
          - "If a trustee endorsed the underlying application: trustee.endorsed_terminal_count += 1, trustee.endorsed_defaulted_count += 1, trustee.default_rate_bps recomputed; when default_rate_bps > 2000 and endorsed_terminal_count >= 3 the trustee is auto-suspended (suspension_reason := DEFAULT_RATE)"

  - entity: Installment
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: DUE
        trigger: "system (re-evaluated whenever the clock crosses due_date - 7 days)"
        actor: system
        preconditions:
          - "due_date - 7 days <= current time < due_date"
        side_effects: []
      - from: DUE
        to: LATE
        trigger: "system (clock crosses due_date with remaining_cents > 0)"
        actor: system
        preconditions:
          - "remaining_cents > 0 and current time >= due_date"
        side_effects: []
      - from: PENDING
        to: PARTIAL
        trigger: "POST /loans/{id}/payments applies less than amount_due_cents"
        actor: Borrower
        preconditions: []
        side_effects: ["remaining_cents recomputed"]
      - from: DUE
        to: PARTIAL
        trigger: "POST /loans/{id}/payments applies less than amount_due_cents"
        actor: Borrower
        preconditions: []
        side_effects: ["remaining_cents recomputed"]
      - from: LATE
        to: PARTIAL
        trigger: "POST /loans/{id}/payments applies less than remaining_cents"
        actor: Borrower
        preconditions: []
        side_effects: ["remaining_cents recomputed"]
      - from: PARTIAL
        to: LATE
        trigger: "system (clock crosses due_date with remaining_cents > 0)"
        actor: system
        preconditions:
          - "remaining_cents > 0 and current time >= due_date"
        side_effects: []
      - from: PENDING
        to: PAID
        trigger: "POST /loans/{id}/payments fully covers this installment"
        actor: Borrower
        preconditions: []
        side_effects: ["paid_at := payment time; remaining_cents := 0"]
      - from: DUE
        to: PAID
        trigger: "POST /loans/{id}/payments fully covers this installment"
        actor: Borrower
        preconditions: []
        side_effects: ["paid_at := payment time; remaining_cents := 0"]
      - from: PARTIAL
        to: PAID
        trigger: "POST /loans/{id}/payments covers the remainder"
        actor: Borrower
        preconditions: []
        side_effects: ["paid_at := payment time; remaining_cents := 0"]
      - from: LATE
        to: PAID
        trigger: "POST /loans/{id}/payments covers the remainder"
        actor: Borrower
        preconditions: []
        side_effects: ["paid_at := payment time; remaining_cents := 0"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: submit-stale-application
    parent_entity: LoanApplication
    write_endpoint: "POST /loan-applications/{id}/submit"
    occ_field: "expected_application_version"
    description: |
      Submitting a LoanApplication whose version has advanced since the client
      last observed it is rejected. This captures the case where the client
      edited the draft (each PATCH bumps version) and a second submit attempt
      still carries the pre-edit version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: disburse-stale-application
    parent_entity: LoanApplication
    write_endpoint: "POST /loan-applications/{id}/disburse"
    occ_field: "expected_application_version"
    description: |
      Disbursing a FUNDED application whose version has advanced since the
      operator last observed it is rejected. Every endorsement and contribution
      bumps the application version, so a version read before the final
      contribution is stale by the time disburse is called.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: finalize-schedule-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /loans/{id}/finalize-schedule"
    occ_field: "expected_loan_version"
    description: |
      Finalizing a repayment schedule against a Loan whose version has advanced
      since the client last observed it is rejected. The product allows a
      schedule to be finalized once, and any mutation of the loan (a payment,
      a status flip) makes an earlier-observed version stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: social_underwriting_score
    trigger: "POST /loan-applications/{id}/submit"
    algorithm: weighted_scoring
    input_set: "The submitting Borrower; the borrower's UnderwritingInvites with status == ACCEPTED; trustee acceptance iff endorsement_mode == TRUSTEE_VOUCHED"
    constants:
      W_TENURE: 20
      TENURE_CAP_MONTHS: 24
      W_COMMUNITY: 30
      COMMUNITY_CAP: 10
      W_TRUSTEE: 25
      W_REPAYMENT: 25
      REPAYMENT_CAP: 2
      APPROVAL_THRESHOLD: 60
    precision: "integer score 0..100; intermediate values rounded round_half_up"
    formula: |
      tenure_component      = W_TENURE * min(business_tenure_months, TENURE_CAP_MONTHS) / TENURE_CAP_MONTHS
      community_component   = W_COMMUNITY * min(accepted_invite_count, COMMUNITY_CAP) / COMMUNITY_CAP
      trustee_component     = W_TRUSTEE * (1 if endorsement_mode == TRUSTEE_VOUCHED else 0)              # variant-dependent
      repayment_component   = W_REPAYMENT * min(prior_repaid_loans_count, REPAYMENT_CAP) / REPAYMENT_CAP # variant-dependent
      score = round_half_up(tenure_component + community_component + trustee_component + repayment_component)
      score is clamped to [0, 100]
    variants:
      - name: STANDARD
        when: "endorsement_mode == SELF_ENDORSED"
        difference: "trustee_component = 0 (no trustee vouch); repayment_component = W_REPAYMENT * min(prior_repaid_loans_count, REPAYMENT_CAP) / REPAYMENT_CAP"
      - name: TRUSTEE_AUGMENTED
        when: "endorsement_mode == TRUSTEE_VOUCHED"
        difference: "trustee_component = 25; repayment history is ignored: repayment_component = 0 (the vouch substitutes for repayment track record)"

  - name: endorser_quorum
    trigger: "POST /loan-applications/{id}/open-public"
    algorithm: threshold
    input_set: "Endorsements on the application with status == ACTIVE, including trustee endorsements"
    constants:
      QUORUM_SELF_ENDORSED: 15
      QUORUM_TRUSTEE_VOUCHED: 5
    precision: "integer counts; comparison is >= (meeting the quorum exactly is sufficient)"
    formula: |
      distinct_endorser_count = count(distinct lender_id) over ACTIVE non-trustee endorsements
                              + count(ACTIVE trustee endorsements)
      required_endorser_count = 5 if endorsement_mode == TRUSTEE_VOUCHED else 15
      gate passes iff distinct_endorser_count >= required_endorser_count

  - name: provisional_installment_schedule
    trigger: "POST /loan-applications/{id}/disburse (Loan creation)"
    algorithm: waterfall_allocation
    input_set: "Loan principal_cents and term_months"
    precision: "integer cents; floor division; the single rounding remainder lands in the LAST installment"
    formula: |
      provisional_base_cents = floor(principal_cents / term_months)
      amount_due_cents(i) = provisional_base_cents                       for i = 1 .. term_months-1
      amount_due_cents(term_months) = principal_cents - (term_months-1) * provisional_base_cents
      due_date(i) = disbursed_at + i months
    variants:
      - name: PROVISIONAL
        when: "schedule_status == PROVISIONAL (initial schedule at disbursement)"
        difference: "Even split; rounding remainder absorbed by the final installment"

  - name: final_installment_schedule
    trigger: "POST /loans/{id}/finalize-schedule"
    algorithm: waterfall_allocation
    input_set: "Loan principal_cents and term_months; loan must be REPAYING, schedule_status == PROVISIONAL, and every installment amount_paid_cents == 0"
    precision: "integer cents; floor division; the single rounding remainder lands in the FIRST installment"
    formula: |
      final_base_cents  = floor((principal_cents - 100) / term_months)
      final_first_cents = principal_cents - (term_months - 1) * final_base_cents
      amount_due_cents(1) = final_first_cents
      amount_due_cents(i) = final_base_cents                             for i = 2 .. term_months
      due_date(i) = disbursed_at + i months
      For principal_cents=500000, term_months=5: final schedule = (100025, 99975, 99975, 99975, 99975)
      vs provisional (100000, 100000, 100000, 100000, 100000) — same principal, different per-installment amounts
    variants:
      - name: FINAL
        when: "schedule_status == FINAL after POST /loans/{id}/finalize-schedule"
        difference: "First installment is scaled up by 100 plus the remainder; installments 2..N share the reduced base"

  - name: payment_application
    trigger: "POST /loans/{id}/payments"
    algorithm: waterfall_allocation
    input_set: "The new Payment amount_cents; the loan's Installments in ascending installment_number, regardless of status, skipping those already PAID"
    precision: "integer cents; no rounding"
    formula: |
      remaining_payment = payment.amount_cents
      for inst in installments ascending by installment_number, where inst.status != PAID:
          apply = min(remaining_payment, inst.remaining_cents)
          inst.amount_paid_cents += apply
          inst.remaining_cents    -= apply
          remaining_payment       -= apply
          if inst.remaining_cents == 0: inst.status = PAID; inst.paid_at = payment.paid_at
          elif apply > 0:               inst.status = PARTIAL
      if remaining_payment > 0: overpay carries to the last installment's amount_paid_cents
      loan.outstanding_cents = sum(inst.remaining_cents)
      if loan.outstanding_cents == 0: loan -> PAID_OFF
      elif no non-PAID installment has due_date < current time - 14 days and loan.status == DELINQUENT: loan -> REPAYING

  - name: repayment_distribution
    trigger: "POST /loans/{id}/payments (after payment_application)"
    algorithm: waterfall_allocation
    input_set: "Payment amount_cents; the application's ACTIVE endorsements and ACTIVE contributions at disbursement (CONVERTED rows), each lender's lent total = sum of their converted amounts"
    precision: "per-lender shares rounded DOWN to whole cents (round per lender, then the unallocated remainder is retained by the platform — never distributed); comparison order pinned below"
    formula: |
      lent(lender) = sum of the lender's CONVERTED endorsement amount_cents + CONVERTED contribution amount_cents on this loan
      total_lent   = loan.principal_cents
      for each lender with lent(lender) > 0, ordered by earliest conversion created_at ASC, ties broken by display_name ASC:
          share_cents(lender) = floor(payment.amount_cents * lent(lender) / total_lent)
          lender.lending_balance_cents += share_cents(lender)
          lender.lifetime_repaid_cents += share_cents(lender)
      platform retains payment.amount_cents - sum(share_cents)   # zero-interest: no lender ever receives more than principal

  - name: trustee_default_rate
    trigger: "system — when an endorsed loan reaches PAID_OFF or DEFAULTED"
    algorithm: threshold
    input_set: "Trustee.endorsed_terminal_count and Trustee.endorsed_defaulted_count"
    constants:
      SUSPEND_RATE_BPS: 2000
      SUSPEND_MIN_TERMINAL: 3
    precision: "integer basis points, round_half_up"
    formula: |
      default_rate_bps = 0 if endorsed_terminal_count == 0
                       else round_half_up(10000 * endorsed_defaulted_count / endorsed_terminal_count)
      if default_rate_bps > SUSPEND_RATE_BPS and endorsed_terminal_count >= SUSPEND_MIN_TERMINAL:
          trustee.status = SUSPENDED; trustee.suspension_reason = DEFAULT_RATE

  - name: trustee_endorsement_capacity
    trigger: "POST /trustees/{id}/endorsements"
    algorithm: aggregation
    input_set: "The trustee's Endorsements with is_trustee_endorsement == true and status == ACTIVE"
    precision: "integer cents"
    formula: |
      active_endorsement_exposure_cents = sum(amount_cents) over ACTIVE trustee endorsements
      new endorsement allowed iff active_endorsement_exposure_cents + amount_cents <= endorsement_limit_cents
      Trustee endorsements move no money: no lender balance is debited, but the endorsement
      counts toward the quorum and the amount counts against the trustee's cap.

  - name: underwriting_acceptance_quota
    trigger: "POST /loan-applications/{id}/submit"
    algorithm: threshold
    input_set: "Borrower's UnderwritingInvites with status == ACCEPTED"
    precision: "integer; floor division; comparison is >= (meeting the quota exactly is sufficient)"
    formula: |
      required_accepts = max(3, floor(requested_amount_cents / 1000000))
      gate passes iff count(ACCEPTED invites of this borrower) >= required_accepts

  - name: lender_impact_report
    trigger: "GET /lenders/{id}/impact"
    algorithm: aggregation
    input_set: "ImpactReports whose loans' applications received at least one ACTIVE endorsement or ACTIVE contribution from this lender; restricted to loans of the underlying applications"
    precision: "percent values are integers; weighted jobs_created and revenue_change_pct are round_half_up to integers"
    formula: |
      candidate reports R = ImpactReport r where exists converted endorsement/contribution
                            by this lender on r.borrower_id's loan's application
      For each report r, weight w(r) = principal share of this lender on that loan (cents)
      jobs_created_weighted      = round_half_up(sum(w(r) * r.jobs_created) / sum(w(r)))
      revenue_change_pct_weighted = round_half_up(sum(w(r) * r.revenue_change_pct) / sum(w(r)))
    variants:
      - name: SIMPLE_IMPACT
        when: "every candidate report has is_mid_term == true"
        difference: "Report returned is the unweighted mean over candidate reports: round_half_up(avg(jobs_created)), round_half_up(avg(revenue_change_pct)) — no principal weighting"
      - name: STANDARD_IMPACT
        when: "at least one candidate report has is_mid_term == false"
        difference: "Principal-share weighted aggregation as in the base formula"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /borrowers, POST /lenders, POST /underwriting-invites/{token}/accept, POST /underwriting-invites/{token}/decline"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.5 roles; entity_backed ownership where required (acting Borrower id == resource borrower_id; acting Lender id == resource lender_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Every path id and body FK (borrower_id, lender_id, trustee_id, loan_application_id, loan_id, invite_token) resolves to an existing record, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: state
    check: "Target resource is in a state that permits the operation (state-machine preconditions of §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_constraint
    check: "Required request fields present and well-typed; enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 6
    category: business_referential
    check: "Uniqueness: borrower email, lender email, (borrower_id, invitee_email) invite pair, (loan_application_id, lender_id) active endorsement pair"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /borrowers, POST /lenders, POST /borrowers/{id}/underwriting-invites, POST /loan-applications/{id}/endorsements"
  - priority: 7
    category: business_safety
    check: "Borrower.status == REGISTERED (a borrower with a DEFAULTED loan may not submit)"
    error_id: ERR_BORROWER_RESTRICTED
    http_status: 409
    applies_to: "POST /loan-applications/{id}/submit"
  - priority: 8
    category: business_safety
    check: "No other loan application of this borrower is in a live status {DRAFT, IN_REVIEW, APPROVED_PENDING_FUNDRAISE, PRIVATE_FUNDRAISING, PUBLIC_FUNDRAISING, FUNDED}"
    error_id: ERR_ACTIVE_APPLICATION_EXISTS
    http_status: 409
    applies_to: "POST /loan-applications/{id}/submit"
  - priority: 9
    category: business_safety
    check: "Underwriting acceptance quota met before submit (calculations.underwriting_acceptance_quota)"
    error_id: ERR_UNDERWRITING_ACCEPTANCE_QUOTA
    http_status: 409
    applies_to: "POST /loan-applications/{id}/submit"
  - priority: 10
    category: business_safety
    check: "Trustee referenced at submit must have status == ACTIVE"
    error_id: ERR_TRUSTEE_SUSPENDED
    http_status: 409
    applies_to: "POST /loan-applications/{id}/submit, POST /trustees/{id}/endorsements"
  - priority: 11
    category: business_fiscal
    check: "Trustee endorsement cap: trustee.active_endorsement_exposure_cents + new amount <= trustee.endorsement_limit_cents (at submit the new amount is requested_amount_cents)"
    error_id: ERR_TRUSTEE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /loan-applications/{id}/submit, POST /trustees/{id}/endorsements"
  - priority: 12
    category: business_constraint
    check: "Approve requires borrower.social_underwriting_score >= 60 (score computed at submit)"
    error_id: ERR_SCORE_TOO_LOW
    http_status: 409
    applies_to: "POST /loan-applications/{id}/approve"
  - priority: 13
    category: business_constraint
    check: "Open-public requires distinct_endorser_count >= required_endorser_count"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /loan-applications/{id}/open-public"
  - priority: 14
    category: business_fiscal
    check: "Endorsement or contribution amount_cents >= 2500"
    error_id: ERR_MIN_CONTRIBUTION
    http_status: 422
    applies_to: "POST /loan-applications/{id}/endorsements, POST /loan-applications/{id}/contributions"
  - priority: 15
    category: business_fiscal
    check: "Lender.lending_balance_cents >= amount_cents (never checked for trustee endorsements, which move no money)"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /loan-applications/{id}/endorsements, POST /loan-applications/{id}/contributions"
  - priority: 16
    category: business_fiscal
    check: "funded_total_cents + amount_cents <= requested_amount_cents (no overfunding)"
    error_id: ERR_OVERFUND
    http_status: 422
    applies_to: "POST /loan-applications/{id}/contributions"
  - priority: 17
    category: business_temporal
    check: "Impact report months_after_disbursement equals whole months elapsed since loan.disbursed_at"
    error_id: ERR_TIMING_MISMATCH
    http_status: 409
    applies_to: "POST /loans/{id}/impact-reports"
  - priority: 18
    category: business_referential
    check: "OCC: expected_*_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /loan-applications/{id}/submit, POST /loan-applications/{id}/disburse, POST /loans/{id}/finalize-schedule"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (33 endpoints)
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["Logical clock advanced; no state sweep is implied"]

  - method: POST
    path: "/_sweeps/run"
    description: "Run one maintenance pass at the current logical time: expire stale SENT invites (30 days), expire PRIVATE_FUNDRAISING applications past private_deadline, expire underfunded PUBLIC_FUNDRAISING applications past public_deadline, flip installment status labels (PENDING->DUE, DUE->LATE), move REPAYING loans with an installment 14+ days past due to DELINQUENT, move DELINQUENT loans with an installment 74+ days past due to DEFAULTED, and auto-suspend trustees whose default_rate_bps > 2000 with >= 3 terminal endorsed loans."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { invites_expired: integer, applications_expired: integer, loans_delinquent: integer, loans_defaulted: integer, trustees_suspended: integer }
    side_effects: ["All sweep transitions in §1.2 with trigger POST /_sweeps/run"]

  # --- Borrower ---
  - method: POST
    path: "/borrowers"
    description: "Register a borrower (self-registration; no auth headers required)"
    roles: [Anonymous]
    code: 201
    input: [legal_name, business_name, email, business_tenure_months, "prior_repaid_loans_count?"]
    output: Borrower
    side_effects: ["status=REGISTERED, counters initialized to 0"]

  - method: GET
    path: "/borrowers/{id}"
    description: "Get a borrower"
    roles: [Borrower, PlatformAdmin, Trustee, Lender]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: PATCH
    path: "/borrowers/{id}"
    description: "Update a borrower's profile (owner or admin)"
    roles: [Borrower, PlatformAdmin]
    code: 200
    input: ["legal_name?", "business_name?", "business_tenure_months?", "prior_repaid_loans_count?"]
    output: Borrower
    side_effects: ["increments Borrower.version by 1"]

  - method: GET
    path: "/borrowers/{id}/underwriting-invites"
    description: "List a borrower's underwriting invites (FK reverse reachability)"
    roles: [Borrower, PlatformAdmin]
    code: 200
    input: []
    output: UnderwritingInvite[]
    side_effects: []

  - method: GET
    path: "/borrowers/{id}/loan-applications"
    description: "List a borrower's loan applications (FK reverse reachability)"
    roles: [Borrower, PlatformAdmin]
    code: 200
    input: []
    output: LoanApplication[]
    side_effects: []

  - method: GET
    path: "/borrowers/{id}/loans"
    description: "List loans disbursed to this borrower (FK reverse reachability)"
    roles: [Borrower, PlatformAdmin]
    code: 200
    input: []
    output: Loan[]
    side_effects: []

  - method: GET
    path: "/borrowers/{id}/impact-reports"
    description: "List impact reports filed on this borrower's loans (FK reverse reachability)"
    roles: [Borrower, PlatformAdmin]
    code: 200
    input: []
    output: ImpactReport[]
    side_effects: []

  - method: GET
    path: "/borrowers/{id}/payments"
    description: "List payments made by this borrower across their loans (FK reverse reachability)"
    roles: [Borrower, PlatformAdmin]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  # --- UnderwritingInvite ---
  - method: POST
    path: "/borrowers/{id}/underwriting-invites"
    description: "Borrower invites a community member to vouch during social underwriting"
    roles: [Borrower]
    code: 201
    input: [invitee_email]
    output: UnderwritingInvite
    side_effects: ["status=SENT, invite_token minted", "duplicate (borrower_id, invitee_email) rejected ERR_DUPLICATE"]

  - method: POST
    path: "/underwriting-invites/{token}/accept"
    description: "Invitee accepts the underwriting vouch via the token link"
    roles: [Anonymous]
    code: 200
    input: []
    output: UnderwritingInvite
    side_effects: ["status SENT -> ACCEPTED, responded_at set"]

  - method: POST
    path: "/underwriting-invites/{token}/decline"
    description: "Invitee declines the underwriting vouch via the token link"
    roles: [Anonymous]
    code: 200
    input: []
    output: UnderwritingInvite
    side_effects: ["status SENT -> DECLINED, responded_at set"]

  # --- Lender ---
  - method: POST
    path: "/lenders"
    description: "Register a lender (self-registration)"
    roles: [Anonymous]
    code: 201
    input: [display_name, email]
    output: Lender
    side_effects: ["lending_balance_cents=0"]

  - method: GET
    path: "/lenders/{id}"
    description: "Get a lender"
    roles: [Lender, PlatformAdmin]
    code: 200
    input: []
    output: Lender
    side_effects: []

  - method: POST
    path: "/lenders/{id}/deposits"
    description: "Deposit funds into the lender's lending account"
    roles: [Lender, PlatformAdmin]
    code: 201
    input: [amount_cents]
    output: Lender
    side_effects: ["lending_balance_cents += amount_cents; total_deposited_cents += amount_cents; increments Lender.version by 1"]

  - method: GET
    path: "/lenders/{id}/endorsements"
    description: "List endorsements made by this lender (FK reverse reachability)"
    roles: [Lender, PlatformAdmin]
    code: 200
    input: []
    output: Endorsement[]
    side_effects: []

  - method: GET
    path: "/lenders/{id}/contributions"
    description: "List contributions made by this lender (FK reverse reachability)"
    roles: [Lender, PlatformAdmin]
    code: 200
    input: []
    output: Contribution[]
    side_effects: []

  - method: GET
    path: "/lenders/{id}/impact"
    description: "Aggregated impact report across loans this lender helped fund (calculations.lender_impact_report)"
    roles: [Lender, PlatformAdmin]
    code: 200
    input: []
    output: { report_count: integer, jobs_created_weighted: integer, revenue_change_pct_weighted: integer }
    side_effects: []

  # --- Trustee ---
  - method: POST
    path: "/trustees"
    description: "Register a community organization as a trustee"
    roles: [PlatformAdmin]
    code: 201
    input: [org_name, endorsement_limit_cents]
    output: Trustee
    side_effects: ["status=ACTIVE, exposure and counters initialized to 0"]

  - method: GET
    path: "/trustees/{id}"
    description: "Get a trustee"
    roles: [PlatformAdmin, Trustee, Borrower]
    code: 200
    input: []
    output: Trustee
    side_effects: []

  - method: POST
    path: "/trustees/{id}/suspend"
    description: "Manually suspend a trustee"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Trustee
    side_effects: ["status -> SUSPENDED, suspension_reason=MANUAL"]

  - method: POST
    path: "/trustees/{id}/reinstate"
    description: "Reinstate a suspended trustee"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Trustee
    side_effects: ["status -> ACTIVE, suspension_reason=NONE"]

  - method: POST
    path: "/trustees/{id}/endorsements"
    description: "Trustee vouches for a borrower's application with an endorsement amount; counts toward the quorum but debits no lender balance"
    roles: [Trustee]
    code: 201
    input: [loan_application_id, amount_cents]
    output: Endorsement
    side_effects:
      - "Creates Endorsement with is_trustee_endorsement=true, trustee_id=this trustee"
      - "trustee.active_endorsement_exposure_cents += amount_cents"
      - "application.private_total_cents += amount_cents; application.distinct_endorser_count += 1; increments LoanApplication.version by 1"

  - method: GET
    path: "/trustees/{id}/endorsements"
    description: "List trustee endorsements issued by this trustee (FK reverse reachability)"
    roles: [Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Endorsement[]
    side_effects: []

  - method: GET
    path: "/trustees/{id}/loan-applications"
    description: "List applications vouched by this trustee (FK reverse reachability)"
    roles: [Trustee, PlatformAdmin]
    code: 200
    input: []
    output: LoanApplication[]
    side_effects: []

  # --- LoanApplication ---
  - method: POST
    path: "/loan-applications"
    description: "Create a draft loan application"
    roles: [Borrower]
    code: 201
    input: [borrower_id, requested_amount_cents, term_months, business_purpose]
    output: LoanApplication
    side_effects: ["status=DRAFT, fundraising counters 0"]

  - method: GET
    path: "/loan-applications/{id}"
    description: "Get a loan application"
    roles: [Borrower, Lender, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: LoanApplication
    side_effects: []

  - method: GET
    path: "/loan-applications"
    description: "List loan applications, optionally filtered"
    roles: [Borrower, Lender, Trustee, PlatformAdmin]
    code: 200
    input: ["status?", "borrower_id?", "limit?", "offset?"]
    output: LoanApplication[]
    side_effects: []

  - method: PATCH
    path: "/loan-applications/{id}"
    description: "Edit a DRAFT application (owner or admin)"
    roles: [Borrower, PlatformAdmin]
    code: 200
    input: ["requested_amount_cents?", "term_months?", "business_purpose?"]
    output: LoanApplication
    side_effects: ["Only valid while status == DRAFT; increments LoanApplication.version by 1"]

  - method: POST
    path: "/loan-applications/{id}/submit"
    description: "Submit a draft for social underwriting review (OCC on application version)"
    roles: [Borrower]
    code: 200
    input: [expected_application_version, "trustee_id?"]
    output: LoanApplication
    side_effects:
      - "status DRAFT -> IN_REVIEW; endorsement_mode and required_endorser_count pinned"
      - "borrower.social_underwriting_score recomputed; borrower.underwriting_variant set"
      - "increments LoanApplication.version by 1"

  - method: POST
    path: "/loan-applications/{id}/approve"
    description: "Approve an application in review"
    roles: [PlatformAdmin]
    code: 200
    input: ["notes?"]
    output: LoanApplication
    side_effects: ["status IN_REVIEW -> APPROVED_PENDING_FUNDRAISE; review_notes set"]

  - method: POST
    path: "/loan-applications/{id}/reject"
    description: "Reject an application in review"
    roles: [PlatformAdmin]
    code: 200
    input: ["notes?"]
    output: LoanApplication
    side_effects: ["status IN_REVIEW -> REJECTED; review_notes set; terminal_at set"]

  - method: POST
    path: "/loan-applications/{id}/request-changes"
    description: "Send an application in review back to draft for revision"
    roles: [PlatformAdmin]
    code: 200
    input: ["notes?"]
    output: LoanApplication
    side_effects: ["status IN_REVIEW -> DRAFT; review_notes set"]

  - method: POST
    path: "/loan-applications/{id}/open-private"
    description: "Open the private fundraising period"
    roles: [Borrower]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["status APPROVED_PENDING_FUNDRAISE -> PRIVATE_FUNDRAISING; private_started_at and private_deadline set"]

  - method: POST
    path: "/loan-applications/{id}/open-public"
    description: "Open the public campaign once the endorser quorum is met"
    roles: [Borrower]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["status PRIVATE_FUNDRAISING -> PUBLIC_FUNDRAISING; public_started_at and public_deadline set"]

  - method: POST
    path: "/loan-applications/{id}/withdraw"
    description: "Borrower withdraws a live application before funding"
    roles: [Borrower]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["status -> WITHDRAWN from DRAFT/IN_REVIEW/APPROVED_PENDING_FUNDRAISE/PRIVATE_FUNDRAISING; ACTIVE endorsements -> CANCELLED with lender refunds"]

  - method: POST
    path: "/loan-applications/{id}/cancel"
    description: "Borrower cancels a FUNDED application before disbursement"
    roles: [Borrower]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["status FUNDED -> CANCELLED; all ACTIVE endorsements and contributions -> REFUNDED with lender credits"]

  - method: POST
    path: "/loan-applications/{id}/disburse"
    description: "Disburse a fully funded application: creates the Loan with a PROVISIONAL schedule (OCC on application version)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_application_version]
    output: Loan
    side_effects:
      - "Creates Loan (status=REPAYING, schedule_status=PROVISIONAL) with term_months Installments per calculations.provisional_installment_schedule"
      - "All ACTIVE endorsements and contributions -> CONVERTED"
      - "Each lender's lifetime_lent_cents += their converted total"
      - "increments LoanApplication.version by 1"

  - method: GET
    path: "/loan-applications/{id}/endorsements"
    description: "List endorsements on an application (FK reverse reachability)"
    roles: [Borrower, Lender, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Endorsement[]
    side_effects: []

  - method: GET
    path: "/loan-applications/{id}/contributions"
    description: "List contributions on an application (FK reverse reachability)"
    roles: [Borrower, Lender, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Contribution[]
    side_effects: []

  - method: GET
    path: "/loan-applications/{id}/loan"
    description: "Get the loan disbursed from this application, if any (FK reverse reachability; array of 0 or 1)"
    roles: [Borrower, Lender, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Loan[]
    side_effects: []

  # --- Endorsement / Contribution creation ---
  - method: POST
    path: "/loan-applications/{id}/endorsements"
    description: "Lender lends during the private fundraising period"
    roles: [Lender]
    code: 201
    input: [lender_id, amount_cents]
    output: Endorsement
    side_effects:
      - "lender.lending_balance_cents -= amount_cents; increments Lender.version by 1"
      - "application.private_total_cents += amount_cents; distinct_endorser_count recomputed; increments LoanApplication.version by 1"

  - method: POST
    path: "/loan-applications/{id}/contributions"
    description: "Lender contributes during the public campaign period"
    roles: [Lender]
    code: 201
    input: [lender_id, amount_cents]
    output: Contribution
    side_effects:
      - "lender.lending_balance_cents -= amount_cents; increments Lender.version by 1"
      - "application.public_total_cents += amount_cents; increments LoanApplication.version by 1"
      - "if funded_total_cents reaches requested_amount_cents: application -> FUNDED (funded_at set)"

  # --- Loan ---
  - method: GET
    path: "/loans/{id}"
    description: "Get a loan"
    roles: [Borrower, Lender, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: POST
    path: "/loans/{id}/finalize-schedule"
    description: "Replace the provisional schedule with the final schedule (OCC on loan version); allowed only while REPAYING with no payment applied"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_loan_version]
    output: Loan
    side_effects:
      - "schedule_status PROVISIONAL -> FINAL; every installment amount_due_cents rewritten per calculations.final_installment_schedule"
      - "loan.final_base_cents and final_first_cents computed and stored"
      - "increments Loan.version by 1"

  - method: POST
    path: "/loans/{id}/payments"
    description: "Borrower makes a repayment; applied oldest-installment-first, then distributed pro-rata to lenders as principal credit (zero interest)"
    roles: [Borrower]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects:
      - "Payment created with paid_at = current time"
      - "calculations.payment_application applies funds across installments"
      - "calculations.repayment_distribution credits each lender's lending_balance_cents"
      - "loan.outstanding_cents recomputed; loan may transition REPAYING<->DELINQUENT or -> PAID_OFF; increments Loan.version by 1"

  - method: GET
    path: "/loans/{id}/installments"
    description: "List a loan's repayment installments (FK reverse reachability)"
    roles: [Borrower, Lender, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Installment[]
    side_effects: []

  - method: GET
    path: "/loans/{id}/payments"
    description: "List payments made on a loan (FK reverse reachability)"
    roles: [Borrower, Lender, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/loans/{id}/impact-reports"
    description: "List impact reports filed on a loan (FK reverse reachability)"
    roles: [Borrower, Lender, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: ImpactReport[]
    side_effects: []

  - method: POST
    path: "/loans/{id}/impact-reports"
    description: "Borrower files a business-outcome report for a live or completed loan"
    roles: [Borrower]
    code: 201
    input: [months_after_disbursement, revenue_change_pct, jobs_created, narrative]
    output: ImpactReport
    side_effects: ["is_mid_term computed; visible in lender impact aggregation"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers on an authenticated endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity_backed ownership check failed (actor id != resource owner id)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve to an existing record" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, invalid enum member, or out-of-range input (term_months outside 3..36, non-positive amounts)" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation: borrower/lender email, (borrower_id, invitee_email) invite pair, or an ACTIVE endorsement already exists for (loan_application_id, lender_id)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not permit the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not equal the parent entity's current version (OCC)" }
  - { id: ERR_BORROWER_RESTRICTED, http: 409, condition: "Borrower.status == RESTRICTED at submit (a prior loan of this borrower is DEFAULTED)" }
  - { id: ERR_ACTIVE_APPLICATION_EXISTS, http: 409, condition: "Borrower already has a live application (DRAFT through FUNDED)" }
  - { id: ERR_UNDERWRITING_ACCEPTANCE_QUOTA, http: 409, condition: "Fewer than max(3, floor(requested_amount_cents/1000000)) ACCEPTED underwriting invites at submit" }
  - { id: ERR_TRUSTEE_SUSPENDED, http: 409, condition: "Trustee status == SUSPENDED at submit or trustee-endorsement creation" }
  - { id: ERR_TRUSTEE_LIMIT_EXCEEDED, http: 422, condition: "Trustee active endorsement exposure + new amount exceeds endorsement_limit_cents" }
  - { id: ERR_SCORE_TOO_LOW, http: 409, condition: "borrower.social_underwriting_score < 60 at approve" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "distinct_endorser_count < required_endorser_count at open-public" }
  - { id: ERR_MIN_CONTRIBUTION, http: 422, condition: "Endorsement or contribution amount_cents < 2500" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 422, condition: "Lender lending_balance_cents < amount_cents" }
  - { id: ERR_OVERFUND, http: 422, condition: "Contribution would push funded_total_cents above requested_amount_cents" }
  - { id: ERR_APPLICATION_NOT_FUNDED, http: 409, condition: "Disburse requires status == FUNDED" }
  - { id: ERR_TIMING_MISMATCH, http: 409, condition: "Impact report months_after_disbursement != whole months elapsed since disbursed_at" }
  - { id: ERR_INVITE_NOT_PENDING, http: 409, condition: "Underwriting invite already resolved (ACCEPTED/DECLINED/EXPIRED)" }
  - { id: ERR_SCHEDULE_ALREADY_FINAL, http: 409, condition: "finalize-schedule called when schedule_status == FINAL, or a payment has already been applied" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller for self-registration and invite links"
    identity: opaque
    exclusive_operations:
      - "POST /borrowers"
      - "POST /lenders"
      - "POST /underwriting-invites/{token}/accept"
      - "POST /underwriting-invites/{token}/decline"
    shared_operations: []
  - name: Borrower
    description: "Loan applicant and repayer; X-User-ID must equal the Borrower.id that owns the resource"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /borrowers/{id}/underwriting-invites (own id only)"
      - "POST /loan-applications"
      - "POST /loan-applications/{id}/submit | open-private | open-public | withdraw | cancel (own applications only)"
      - "POST /loans/{id}/payments (own loans only)"
      - "POST /loans/{id}/impact-reports (own loans only)"
    shared_operations:
      - "GET /borrowers/{id}, GET sub-resources of own borrower"
      - "GET /loan-applications, GET /loan-applications/{id} and sub-resources"
      - "GET /loans/{id} and sub-resources"
      - "PATCH /borrowers/{id} (own), PATCH /loan-applications/{id} (own, DRAFT only)"
  - name: Lender
    description: "Crowdfunder with a lending account; X-User-ID must equal the Lender.id"
    identity: "entity_backed:Lender"
    exclusive_operations:
      - "POST /lenders/{id}/deposits (own id only)"
      - "POST /loan-applications/{id}/endorsements (lender_id == own id)"
      - "POST /loan-applications/{id}/contributions (lender_id == own id)"
      - "GET /lenders/{id}/impact (own id only)"
    shared_operations:
      - "GET /lenders/{id} and own sub-resources"
      - "GET /loan-applications, GET /loan-applications/{id} and sub-resources"
      - "GET /loans/{id} and sub-resources"
  - name: Trustee
    description: "Community organization vouching for borrowers; X-User-ID must equal the Trustee.id"
    identity: "entity_backed:Trustee"
    exclusive_operations:
      - "POST /trustees/{id}/endorsements (own id only)"
    shared_operations:
      - "GET /trustees/{id} and own sub-resources"
      - "GET /borrowers/{id}"
      - "GET /loan-applications, GET /loan-applications/{id} and sub-resources"
      - "GET /loans/{id} and sub-resources"
  - name: PlatformAdmin
    description: "Platform operator; not tied to any persisted entity"
    identity: opaque
    exclusive_operations:
      - "POST /trustees, POST /trustees/{id}/suspend, POST /trustees/{id}/reinstate"
      - "POST /loan-applications/{id}/approve | reject | request-changes | disburse"
      - "POST /loans/{id}/finalize-schedule"
      - "POST /_clock/set_current_utc, POST /_sweeps/run"
    shared_operations:
      - "All GET endpoints"
      - "PATCH /borrowers/{id}, PATCH /loan-applications/{id} (DRAFT only)"
