              captures: { gate_error: "$.data.error_id" }
          assert:
            - "before any award the association reads reserve_balance_cents 600000, reserve_funding_ratio 0.6 and reserve_posture ADEQUATE: 600000*100 == 1000000*60 is the inclusive boundary"
            - "the first award succeeds (HTTP 200): draw equal to the balance is allowed because priority 56 is inclusive"
            - "project 1 reads status AWARDED with awarded_amount_cents 600000 and reserve_draw_cents 600000, and bid 1 reads status AWARDED"
            - "after the first award the association reads reserve_balance_cents exactly 0, reserve_funding_ratio 0.0 and reserve_posture UNDERFUNDED"
            - "the second award returns HTTP 409 with error_id ERR_RESERVE_UNDERFUNDED, the priority-55 error, not ERR_INSUFFICIENT_RESERVE: the CULVERT category plus UNDERFUNDED posture plus a null proposal_id is checked before the amount comparison"
            - "project 2 is still BID_SOLICITATION with reserve_draw_cents 0 and awarded_bid_id null, and bid 2 is still SUBMITTED"
            - "the rejected award leaves reserve_balance_cents at 0: no partial draw was taken"

      - name: minimum_charge_floor_and_cap_together_yield_negative_unallocated_residual
        grounds:
          - "calculations.annual_assessment_allocation"
          - "entities.AssessmentRoll.fields.unallocated_residual_cents"
          - "entities.AssessmentRoll.fields.total_levied_cents"
          - "endpoints[POST /assessment-rolls/{roll_id}/certify]"
        distinguishing_aspect: >
          A 200000-cent budget over units 290/240/10 clamps every parcel: two
          hit the 80000 cap (floor(0.40 * 200000)) and the tiny one is lifted to
          the 50000 MIN_CHARGE_CENTS floor, so total_levied_cents is 210000 and
          unallocated_residual_cents is negative-10000. Because every parcel is
          clamped, the unclamped set is empty and Uu is 0, so step 5's negative
          residual must be recorded, not spread: the branch `add = max(want,
          MIN_CHARGE_CENTS - cl)` is never reached and no parcel is pushed below
          its floor. Implementations that clamp the residual at zero, that
          re-scale to force the sum to equal the budget, or that iterate to a
          fixed point produce 200000 / 0 instead of 210000 / negative-10000.
        test_recipe:
          setup: |
            Build a three-parcel association on one segment: P1 290 ft
            RESIDENTIAL_YEAR_ROUND (290 units), P2 400 ft SEASONAL (240 units),
            P3 40 ft UNDEVELOPED with 1 trip per day (40 * 0.25 == 10 units), so
            U is 540. All three members have verified deeds and are
            GOOD_STANDING. Draft an FY2027 FRONTAGE_WEIGHTED roll for a
            deliberately tiny budget of 200000 cents: the raw shares are
            107407.41, 88888.89 and 3703.70, the cap is 80000 and the floor is
            50000.
