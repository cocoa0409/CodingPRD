            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2018-01", effective_date: "2018-01-01", min_project_units_threshold: 20, set_aside_bps_by_district: { "R-2": 500, "R-4": 800, "C-2": 1000 }, gap_basis_cents_by_level: { "5000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 0, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 } ], fee_due_days: 60, alternative_paths_allowed: ["IN_LIEU_FEE"] }, as: ProgramAdministrator, captures: { o18_id: $.data.id } }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { o24_id: $.data.id } }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2026-06", effective_date: "2026-06-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1500, "R-4": 2000, "C-2": 2500 }, gap_basis_cents_by_level: { "5000": 30000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 } ], fee_due_days: 30, alternative_paths_allowed: ["IN_LIEU_FEE"] }, as: ProgramAdministrator, captures: { o26_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
