              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/components/${c_id}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/components/${c_id}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/components/${c_id}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/components/${c_id}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/attractions/${a_id}"
