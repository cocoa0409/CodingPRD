          The stacking limit is refused only at the extreme where the state
          share collapses to exactly 0: a utility rebate of 1000000 against a
          1000000 project drives S1 to max(0, 800000 - 800000) == 0 and returns
          422 with NOTHING persisted, whereas a 500000 utility rebate over the
