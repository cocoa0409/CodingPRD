  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_period_half_open_overlap
        grounds:
          - validations[priority=12]
        distinguishing_aspect: |
          Interval semantics: half-open [period_start, period_end) on the Vehicle
          resource — a policy starting exactly at the prior policy's period_end
          is ALLOWED (adjacency), while one starting one day earlier is rejected
          with ERR_POLICY_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "Member, eligible+documented vehicle, two APPROVED valuations v1 and v2 (v2 supersedes v1); policy P1 [2026-09-01, 2027-09-01) in QUOTED status"
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ola", email: "ola@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN015", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /valuation-guides"
              payload: { edition: "2026-Q3", effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /valuation-guides/${g_id}/entries"
              payload: { vehicle_class: CLASSIC, make: "Ford", year_min: 1965, year_max: 1972, base_value_cents: 3000000 }
              as: PlatformAdmin
            - call: "POST /valuation-guides/${g_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: GUIDE_TOOL, proposed_agreed_value_cents: 3000000, expected_vehicle_version: "${v_ver}" }
              as: Underwriter
              captures: { val1_id: $.data.id }
            - call: "POST /valuations/${val1_id}/propose"
              payload: {}
              as: Underwriter
            - call: "POST /valuations/${val1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: Underwriter
              captures: { v_ver2: $.data.version }
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: GUIDE_TOOL, proposed_agreed_value_cents: 3000000, expected_vehicle_version: "${v_ver2}" }
              as: Underwriter
              captures: { val2_id: $.data.id }
            - call: "POST /valuations/${val2_id}/propose"
              payload: {}
              as: Underwriter
            - call: "POST /valuations/${val2_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /policies"
              payload: { member_id: "${m_id}", vehicle_id: "${v_id}", valuation_id: "${val1_id}", usage_tier: REGULAR, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: Underwriter
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { member_id: "${m_id}", vehicle_id: "${v_id}", valuation_id: "${val2_id}", usage_tier: REGULAR, period_start: "2027-09-01T00:00:00Z", period_end: "2028-09-01T00:00:00Z" }
              as: Underwriter
              captures: { p2_id: $.data.id }
            - call: "POST /policies"
              payload: { member_id: "${m_id}", vehicle_id: "${v_id}", valuation_id: "${val2_id}", usage_tier: REGULAR, period_start: "2027-08-31T00:00:00Z", period_end: "2028-08-31T00:00:00Z" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "adjacent policy [2027-09-01, 2028-09-01) created successfully (half-open: period_end == period_start is NOT overlap)"
            - "overlapping policy starting 2027-08-31 rejected with ERR_POLICY_PERIOD_OVERLAP"
      - name: venue_event_closed_interval_with_buffer
        grounds:
          - validations[priority=13]
        distinguishing_aspect: |
          Different semantics on a different resource: ClubEvent venue conflicts
          use CLOSED intervals [start_date, end_date] expanded by a 1-day buffer
          on each side — an event starting the day AFTER another's end_date at
          the same venue still conflicts (buffer), while the same dates at a
          different venue are accepted.
        test_recipe:
          setup:
            - "Event E1 SCHEDULED at venue Fairground, 2026-10-10..2026-10-11 (closed)"
          setup_api_calls:
            - call: "POST /club-events"
              payload: { name: "Fall Tour", venue: "Fairground", start_date: "2026-10-10T00:00:00Z", end_date: "2026-10-11T00:00:00Z", capacity: 50 }
              as: ClubCoordinator
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /club-events"
              payload: { name: "Swap Meet", venue: "Fairground", start_date: "2026-10-12T00:00:00Z", end_date: "2026-10-12T00:00:00Z", capacity: 30 }
              as: ClubCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /club-events"
              payload: { name: "Swap Meet", venue: "Speedway", start_date: "2026-10-12T00:00:00Z", end_date: "2026-10-12T00:00:00Z", capacity: 30 }
              as: ClubCoordinator
              captures: { e2_id: $.data.id }
          assert:
            - "same-venue event starting 1 day after E1's end_date rejected with ERR_EVENT_VENUE_CONFLICT (1-day teardown buffer, closed-interval semantics)"
            - "same dates at a different venue accepted (201, venue-scoped conflict only)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: mileage_ledger_record_reverse_invariant
        grounds:
          - calculations.mileage_ledger
          - state_machines.UsageEvent.RECORDED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: policy mileage ledger. RECORD then REVERSE of the
          same event restores billable_miles_used + remaining_allowance_miles ==
