      - name: second_close_of_a_period_is_rejected_as_already_closed
        claim_type: idempotency
        grounds:
          - state_machines.ReportingPeriod.OPEN_to_CLOSED
          - validations.priority_13_action_state
          - errors.ERR_PERIOD_ALREADY_CLOSED
        distinguishing_aspect: "The ops-run checkpoint is not idempotent-by-replay: the second close of the same period is refused 409 ERR_PERIOD_ALREADY_CLOSED so the sweep counters and penalty assessments can never be applied twice."
        test_recipe:
          setup:
            - "One August period with no facilities registered, so the close run assesses nothing; the clock is advanced to the period end and the period is closed once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
