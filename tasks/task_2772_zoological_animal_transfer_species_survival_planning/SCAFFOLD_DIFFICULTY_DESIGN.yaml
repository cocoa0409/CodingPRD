          The degenerate empty-collection boundary: an agreement with ZERO recorded pre-shipment
          tests must fail the panel check rather than vacuously satisfy a "no test is missing"
          formulation, and the one-of-two partial panel must fail identically. Only when both
          INTERSTATE panel codes are present does the certificate issue. Three attempts on the
          same DRAFT document walk 0, 1 and 2 tests.
