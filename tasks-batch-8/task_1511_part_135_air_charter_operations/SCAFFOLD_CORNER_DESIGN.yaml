# =============================================================================
# §1.9 Scaffold Corner Design — Part 135 Air Charter Operations
# Breadth coverage of every §1.1–§1.7 claim not already covered by §1.8.
# Common fixture values (precomputed from §1.3 constants):
#   LIGHT_JET leg REV 60  -> quote 270000, deposit 67500, balance 202500
#   LIGHT_JET legs 120+30 -> quote 621000, deposit 155250, balance 465750
#   LIGHT_JET leg REV 480 -> quote 2052000, deposit 513000, balance 1539000
#   LIGHT_JET leg REV 61  -> quote 274500, deposit 68625, balance 205875
#   MIDSIZE_JET REV 120 fuel_stop + intl -> quote 1129000, deposit 282250
#   HEAVY_JET leg REV 60  -> quote 702000, deposit 175500, balance 526500
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: create_aircraft_owner_defaults
        claim_type: creation
        grounds: [entities.AircraftOwner]
        distinguishing_aspect: "Owner created without guarantee_cents_per_block_min gets default 0, version 1, server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner D", contact_email: "d@x.com", revenue_share_pct: 75 }, as: OpsAdmin, captures: { own_d: $.data.id, own_d_g: $.data.guarantee_cents_per_block_min, own_d_v: $.data.version } }
          assert:
            - "response 201; AircraftOwner.${own_d}.guarantee_cents_per_block_min == 0 (default applied)"
            - "AircraftOwner.${own_d}.version == 1 and created_at/updated_at present (ISO8601)"

      - name: create_trip_request_initial_state
        claim_type: creation
        grounds: [entities.TripRequest, state_machines.TripRequest]
        distinguishing_aspect: "New trip starts QUOTE_DRAFT with payment_posture UNPAID and null quoted/final fields; input cannot set status."
        test_recipe:
          setup: ["clock at default"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust I", customer_email: "i@x.com", requested_category: "TURBOPROP", origin_icao: "KLAX", destination_icao: "KLAS", departure_at: "2026-08-09T09:00:00Z", passenger_count: 3, international: false }, as: SalesAgent, captures: { trip_i: $.data.id, trip_i_st: $.data.status, trip_i_pp: $.data.payment_posture, trip_i_q: $.data.quoted_total_cents } }
          assert:
            - "TripRequest.${trip_i}.status == QUOTE_DRAFT and payment_posture == UNPAID"
            - "quoted_total_cents is null and collected_cents == 0"

      - name: aircraft_total_airframe_computed_from_initial
        claim_type: computed_field
        grounds: [entities.Aircraft.fields.total_airframe_minutes]
        distinguishing_aspect: "total_airframe_minutes is computed (initial + logged); at creation with no logs it equals initial_airframe_minutes and any client-supplied value for it is ignored."
        test_recipe:
          setup: ["one owner"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner AC", contact_email: "ac@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_ac: $.data.id } }
          trigger:
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_ac}", tail_number: "N111AC", category: "TURBOPROP", home_base_icao: "KLAX", seats: 6, hourly_rate_cents: 140000, on_ops_spec: true, initial_airframe_minutes: 500, next_check_due_minutes: 6000 }, as: OpsAdmin, captures: { ac_ac: $.data.id, ac_ac_min: $.data.total_airframe_minutes } }
          assert:
            - "Aircraft.${ac_ac}.total_airframe_minutes == 500 (computed from initial, zero logs)"
            - "Aircraft.${ac_ac}.status == AVAILABLE (initial state)"

      - name: create_aircraft_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Aircraft, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required tail_number yields 400 ERR_INVALID_REQUEST before any existence/business check."
        test_recipe:
          setup: ["one owner"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner RF", contact_email: "rf@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_rf: $.data.id } }
          trigger:
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_rf}", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { err_rf: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: create_trip_invalid_enum_category_rejected
        claim_type: type_constraint
        grounds: [entities.TripRequest.fields.requested_category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "requested_category outside the enum is rejected at request-shape priority."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust E", customer_email: "e@x.com", requested_category: "ROCKET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 1, international: false }, as: SalesAgent, captures: { err_e: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: window_invalid_time_range_returns_400
        claim_type: type_constraint
        grounds: [entities.MaintenanceWindow.fields.ends_at, "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "ends_at == starts_at violates the closed-interval requirement (must be strictly greater)."
        test_recipe:
          setup: ["owner + aircraft"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner W", contact_email: "w@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_w: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_w}", tail_number: "N222WW", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_w: $.data.id } }
          trigger:
            - { call: "POST /charter/maintenance-windows", payload: { aircraft_id: "${ac_w}", window_type: "ANNUAL", starts_at: "2026-08-05T00:00:00Z", ends_at: "2026-08-05T00:00:00Z" }, as: MaintenanceController, captures: { err_w: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_TIME_RANGE"

      - name: get_trip_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TRIP_REQUEST_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID yields the trip-specific 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /charter/trip-requests/00000000-0000-4000-8000-000000000000", payload: {}, as: OpsAdmin, captures: { err_n1: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_TRIP_REQUEST_NOT_FOUND"]

      - name: get_aircraft_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_AIRCRAFT_NOT_FOUND]"]
        distinguishing_aspect: "Aircraft-specific 404 on missing id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /charter/aircraft/00000000-0000-4000-8000-000000000000", payload: {}, as: OpsAdmin, captures: { err_n2: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_AIRCRAFT_NOT_FOUND"]

      - name: get_aircraft_owner_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_AIRCRAFT_OWNER_NOT_FOUND]"]
        distinguishing_aspect: "AircraftOwner-specific 404 on missing id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /charter/aircraft-owners/00000000-0000-4000-8000-000000000000", payload: {}, as: OpsAdmin, captures: { err_n3: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_AIRCRAFT_OWNER_NOT_FOUND"]

      - name: get_crew_member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CREW_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "CrewMember-specific 404 on missing id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /charter/crew-members/00000000-0000-4000-8000-000000000000", payload: {}, as: OpsAdmin, captures: { err_n4: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_CREW_MEMBER_NOT_FOUND"]

      - name: get_quote_leg_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_QUOTE_LEG_NOT_FOUND]"]
        distinguishing_aspect: "QuoteLeg-specific 404 on missing id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /charter/quote-legs/00000000-0000-4000-8000-000000000000", payload: {}, as: OpsAdmin, captures: { err_n5: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_QUOTE_LEG_NOT_FOUND"]

      - name: confirm_assignment_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_AIRCRAFT_ASSIGNMENT_NOT_FOUND]"]
        distinguishing_aspect: "Confirm on a missing assignment id yields 404 before any state check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/aircraft-assignments/00000000-0000-4000-8000-000000000000/confirm", payload: {}, as: DispatchManager, captures: { err_n6: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_AIRCRAFT_ASSIGNMENT_NOT_FOUND"]

      - name: vet_crew_assignment_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CREW_ASSIGNMENT_NOT_FOUND]"]
        distinguishing_aspect: "Vet on a missing crew-assignment id yields 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/crew-assignments/00000000-0000-4000-8000-000000000000/vet", payload: {}, as: DispatchManager, captures: { err_n7: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_CREW_ASSIGNMENT_NOT_FOUND"]

      - name: complete_window_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MAINTENANCE_WINDOW_NOT_FOUND]"]
        distinguishing_aspect: "Complete on a missing window id yields 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/maintenance-windows/00000000-0000-4000-8000-000000000000/complete", payload: {}, as: MaintenanceController, captures: { err_n8: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_MAINTENANCE_WINDOW_NOT_FOUND"]

      - name: screen_passenger_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PASSENGER_NOT_FOUND]"]
        distinguishing_aspect: "Screen on a missing passenger id yields 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/passengers/00000000-0000-4000-8000-000000000000/screen", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, captures: { err_n9: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_PASSENGER_NOT_FOUND"]

      - name: decide_permit_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_OVERFLIGHT_PERMIT_NOT_FOUND]"]
        distinguishing_aspect: "Decide on a missing permit id yields 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/overflight-permits/00000000-0000-4000-8000-000000000000/decide", payload: { decision: "GRANTED" }, as: ComplianceOfficer, captures: { err_n10: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_OVERFLIGHT_PERMIT_NOT_FOUND"]

      - name: get_flight_log_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_FLIGHT_LOG_NOT_FOUND]"]
        distinguishing_aspect: "FlightLog-specific 404 on missing id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /charter/flight-logs/00000000-0000-4000-8000-000000000000", payload: {}, as: OpsAdmin, captures: { err_n11: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_FLIGHT_LOG_NOT_FOUND"]

      - name: issue_statement_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_OWNER_STATEMENT_NOT_FOUND]"]
        distinguishing_aspect: "Issue on a missing statement id yields 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/owner-statements/00000000-0000-4000-8000-000000000000/issue", payload: {}, as: OpsAdmin, captures: { err_n12: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_OWNER_STATEMENT_NOT_FOUND"]

      - name: resolve_finding_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_COMPLIANCE_FINDING_NOT_FOUND]"]
        distinguishing_aspect: "Resolve on a missing finding id yields 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/compliance-findings/00000000-0000-4000-8000-000000000000/resolve", payload: {}, as: ComplianceOfficer, captures: { err_n13: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_COMPLIANCE_FINDING_NOT_FOUND"]

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: quote_from_quoted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TripRequest.QUOTE_DRAFT_to_QUOTED, "errors[ERR_TRIP_NOT_QUOTE_DRAFT]"]
        distinguishing_aspect: "quote requires QUOTE_DRAFT; a second quote on a QUOTED trip fails."
        test_recipe:
          setup: ["clock; trip dep 2026-08-10T10:00:00Z with leg REV 60; already QUOTED (270000)"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust QQ", customer_email: "qq@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_qq: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_qq}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_qq}/quote", payload: {}, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_qq}/quote", payload: {}, as: SalesAgent, captures: { err_qq: $.data.error_id } }
          assert: ["HTTP 409 with error_id == ERR_TRIP_NOT_QUOTE_DRAFT"]

      - name: book_from_quote_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TripRequest.QUOTED_to_BOOKED, "errors[ERR_TRIP_NOT_QUOTED]"]
        distinguishing_aspect: "book requires QUOTED; booking a QUOTE_DRAFT trip fails."
        test_recipe:
          setup: ["clock; trip with one leg, still QUOTE_DRAFT"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust BK", customer_email: "bk@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_bk: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_bk}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_bk}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { err_bk: $.data.error_id } }
          assert: ["HTTP 409 with error_id == ERR_TRIP_NOT_QUOTED"]

      - name: requote_from_booked_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TripRequest.QUOTED_to_QUOTE_DRAFT, "errors[ERR_TRIP_NOT_QUOTED]"]
        distinguishing_aspect: "requote requires QUOTED; a BOOKED trip cannot requote (OCC passes with the current version, state check fires)."
        test_recipe:
          setup: ["clock; trip leg REV 60 QUOTED then BOOKED (deposit 67500)"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust RQ", customer_email: "rq@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_rq: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_rq}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_rq}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_rq}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_rq_v: $.data.version } }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_rq}/requote", payload: { expected_trip_request_version: "${trip_rq_v}" }, as: SalesAgent, captures: { err_rq: $.data.error_id } }
          assert: ["HTTP 409 with error_id == ERR_TRIP_NOT_QUOTED"]

      - name: cancel_completed_trip_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.TripRequest, "errors[ERR_TRIP_NOT_CANCELLABLE]"]
        distinguishing_aspect: "COMPLETED is terminal; cancel is rejected with the cancellability error."
        test_recipe:
          setup:
            - "Full chain: owner, aircraft N700CL (initial 0, due 60000), PIC crew, clock 2026-08-01T00:00:00Z"
            - "Trip leg REV 60 QUOTED 270000, BOOKED 67500 + BALANCE 202500, CONFIRMED, VETTED, DISPATCHED, leg logged (actual 60) -> COMPLETED"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner CL", contact_email: "cl@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 0 }, as: OpsAdmin, captures: { own_cl: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_cl}", tail_number: "N700CL", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_cl: $.data.id } }
            - { call: "POST /charter/crew-members", payload: { name: "Pic CL", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_cl: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust CL", customer_email: "cl2@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_cl: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_cl}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent, captures: { leg_cl: $.data.id } }
            - { call: "POST /charter/trip-requests/${trip_cl}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_cl}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_cl_v: $.data.version } }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_cl}", payment_type: "BALANCE", amount_cents: 202500 }, as: SalesAgent }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_cl}", aircraft_id: "${ac_cl}", expected_trip_request_version: "${trip_cl_v}" }, as: DispatchManager, captures: { asg_cl: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_cl}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_cl}", crew_member_id: "${crew_cl}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_cl: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_cl}/vet", payload: {}, as: DispatchManager }
            - { call: "POST /charter/trip-requests/${trip_cl}/dispatch", payload: {}, as: DispatchManager }
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_cl}", quote_leg_id: "${leg_cl}", actual_block_minutes: 60, departed_at: "2026-08-10T10:00:00Z", arrived_at: "2026-08-10T11:00:00Z" }, as: CrewMember, as_user_id: "${crew_cl}" }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_cl}/cancel", payload: { reason: "CUSTOMER" }, as: SalesAgent, captures: { err_cl: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_TRIP_NOT_CANCELLABLE"
            - "TripRequest.${trip_cl}.status remains COMPLETED and final_total_cents == 240000"

      - name: confirm_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AircraftAssignment.TENTATIVE_to_CONFIRMED, "errors[ERR_ASSIGNMENT_NOT_TENTATIVE]"]
        distinguishing_aspect: "confirm requires TENTATIVE; a second confirm on the CONFIRMED assignment fails."
        test_recipe:
          setup: ["owner + aircraft; trip leg REV 60 QUOTED/BOOKED 67500; assignment CONFIRMED once"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner CT", contact_email: "ct@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_ct: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_ct}", tail_number: "N800CT", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_ct: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
