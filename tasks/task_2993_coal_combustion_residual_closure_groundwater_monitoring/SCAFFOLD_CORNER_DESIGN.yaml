# §1.9 Scaffold Corner Design — breadth probe over the §1.1–§1.7 surface of
# SCAFFOLD.yaml. Sections and claim_type values are taken from
# references/claim-extraction-guide.md; corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
#
# Unless a call sets it otherwise, the logical clock reads 2026-08-01T00:00:00Z.
# Fixture identities reused across instances (same literals as §1.8):
#   Dana Reyes / PE-11001 / NC / GEOTECHNICAL     Owen Park / PE-22002 / NC / CIVIL
#   Mia Chen   / HG-33003 / NC / HYDROGEOLOGY     Rae Novak / ST-44004 / NC / STATISTICS
# Corner units use unit_code IMP-01xx so they never collide with §1.8's IMP-00xx.

scaffold_corner_design:
  - section: entities
    instances:
      - name: unit_creation_returns_the_full_declared_field_set_and_mints_a_monitoring_program
        claim_type: creation
        grounds:
          - endpoints.POST_/ccr/units
          - entities.DisposalUnit
          - calculations.location_restriction_verdict
          - calculations.closure_deadline_date
        distinguishing_aspect: |
          A single POST must return every declared DisposalUnit field already populated — the four
          common fields, the thirteen inputs echoed back, and the computed block (verdict, deadline,
          balance, posture) — plus a non-null monitoring_program_id, because the unit and its
          MonitoringProgram are created in the same request. An implementation that defers the program
          to a second call, or that returns the computed block as null on create, fails.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its initial 2026-08-01"
          setup_api_calls: []
          trigger:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0101", unit_name: "Ash Pond 101", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id, unit_v1: $.data.version }
          assert:
            - "HTTP 201 with response_type object and a data block carrying id, created_at, updated_at and version"
            - "${unit_v1} == 1"
            - "data.unit_code == IMP-0101 and data.plant_code == PLNT01 and data.original_ash_in_place_tons == 480000"
            - "data.location_restriction_verdict == UNRESTRICTED and data.demonstration_required == false"
            - "data.closure_state == ACTIVE and data.cap_integrity_state == NOT_APPLICABLE"
            - "data.closure_deadline_date == 2031-03-31 and data.granted_extension_months == 0"
            - "data.ash_in_place_tons == 480000 and data.ash_mass_balance_ok == true"
            - "data.governing_stability_verdict == UNASSESSED and data.compliance_posture == COMPLIANT"
            - "data.closure_timeliness == PENDING and data.overdue_posting_types == [] and data.late_posting_count == 0"
            - "${prog_id} is non-null and GET /ccr/monitoring-programs/${prog_id} returns phase DETECTION with unit_id == ${unit_id}"

      - name: well_retrieval_by_id_returns_the_stored_screen_interval
        claim_type: retrieval
        grounds:
          - endpoints.GET_/ccr/wells/{id}
          - entities.MonitoringWell
        distinguishing_aspect: |
          The detail read must return the row as stored, not a re-derived or defaulted view: the two
          decimal screen depths, the free-text aquifer_zone and the installed_on date all round-trip
          byte-for-byte, and well_status is the initial CERTIFIED.
        test_recipe:
          setup:
            - "One clean unit with a single BACKGROUND well"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0102", unit_name: "Ash Pond 102", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { well_id: $.data.id }
          trigger:
            - call: "GET /ccr/wells/${well_id}"
              as: Hydrogeologist
              as_user_id: "${hg_id}"
          assert:
            - "HTTP 200 and data.id == ${well_id}"
            - "data.unit_id == ${unit_id} and data.well_code == BG-01 and data.well_role == BACKGROUND"
            - "data.aquifer_zone == UPPER SAND and data.screen_top_ft == 22.00 and data.screen_bottom_ft == 42.00"
            - "data.installed_on == 2024-06-01 and data.well_status == CERTIFIED"
            - "data.decommissioned_on == null and data.decommission_reason == null"

      - name: public_posting_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/ccr/public-postings
          - entities.PublicPosting.fields.satisfied_obligation
        distinguishing_aspect: |
          The list envelope must report the total matching row count rather than the page size, and
          has_more must be derived from offset + returned versus total_count. Two ANNUAL_GW_REPORT
          postings read one at a time therefore yield total_count 2 with has_more true on the first
          page and false on the second. Both carry satisfied_obligation false because ANNUAL_GW_REPORT
          has no obligation due date.
        test_recipe:
          setup:
            - "One clean unit with exactly two POSTED ANNUAL_GW_REPORT postings"
          setup_api_calls:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0103", unit_name: "Ash Pond 103", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "ANNUAL_GW_REPORT", posted_on: "2026-07-01", document_uri: "https://utility.example.com/ccr/imp-0103/annual-gw-2025.pdf", document_sha256: "c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2" }
              as: ComplianceOfficer
              captures: { posting_a_id: $.data.id }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "ANNUAL_GW_REPORT", posted_on: "2026-07-15", document_uri: "https://utility.example.com/ccr/imp-0103/annual-gw-2025-rev1.pdf", document_sha256: "7e907e907e907e907e907e907e907e907e907e907e907e907e907e907e907e90" }
              as: ComplianceOfficer
              captures: { posting_b_id: $.data.id }
          trigger:
            - call: "GET /ccr/public-postings?unit_id=${unit_id}&limit=1&offset=0"
              as: PublicViewer
            - call: "GET /ccr/public-postings?unit_id=${unit_id}&limit=1&offset=1"
              as: PublicViewer
            - call: "GET /ccr/public-postings?unit_id=${unit_id}&limit=200"
              as: PublicViewer
          assert:
            - "trigger call 1 returns HTTP 200 with response_type array, exactly 1 row, total_count == 2, limit == 1, offset == 0 and has_more == true"
            - "trigger call 2 returns exactly 1 row, total_count == 2, offset == 1 and has_more == false"
            - "the two pages return different ids, and their union is {${posting_a_id}, ${posting_b_id}}"
            - "every returned row has status POSTED, satisfied_obligation == false and days_late == 0"
            - "trigger call 3 returns HTTP 400 with error_id ERR_INVALID_REQUEST because limit exceeds the maximum of 100"

      - name: unknown_ids_are_not_found_per_entity_family
        claim_type: not_found
        grounds:
          - errors.ERR_UNIT_NOT_FOUND
          - errors.ERR_CLOSURE_ENTITY_NOT_FOUND
          - errors.ERR_MONITORING_ENTITY_NOT_FOUND
          - errors.ERR_REUSE_ENTITY_NOT_FOUND
          - errors.ERR_POSTING_NOT_FOUND
        distinguishing_aspect: |
          Each entity family reports its own 404 id, so a read of a syntactically valid but absent UUID
          must return the family-specific error rather than one blanket ERR_NOT_FOUND. The same absent
          UUID is used for all five reads, which proves the discrimination comes from the route family
          and not from the identifier.
        test_recipe:
          setup:
            - "Empty database; no row of any kind carries the probe UUID"
          setup_api_calls: []
          trigger:
            - call: "GET /ccr/units/9f1e7a52-0000-4000-8000-000000000001"
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/closure-plans/9f1e7a52-0000-4000-8000-000000000001"
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/monitoring-programs/9f1e7a52-0000-4000-8000-000000000001"
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/reuse-agreements/9f1e7a52-0000-4000-8000-000000000001"
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/public-postings/9f1e7a52-0000-4000-8000-000000000001"
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 404 with error_id ERR_UNIT_NOT_FOUND"
            - "trigger call 2 returns HTTP 404 with error_id ERR_CLOSURE_ENTITY_NOT_FOUND"
            - "trigger call 3 returns HTTP 404 with error_id ERR_MONITORING_ENTITY_NOT_FOUND"
            - "trigger call 4 returns HTTP 404 with error_id ERR_REUSE_ENTITY_NOT_FOUND"
            - "trigger call 5 returns HTTP 404 with error_id ERR_POSTING_NOT_FOUND"
            - "every response carries response_type error and a non-empty data.message"

      - name: unit_creation_missing_required_liner_class_is_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_4_ERR_INVALID_REQUEST
          - entities.DisposalUnit.fields.liner_class
        distinguishing_aspect: |
          liner_class has source input and no default, so its absence is a malformed body (400), not a
          business-rule violation (422) and not a silently defaulted UNLINED. The companion call proves
          the same field rejects an out-of-enum value, so the rule is presence AND domain.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0104", unit_name: "Ash Pond 104", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0104", unit_name: "Ash Pond 104", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "GEOMEMBRANE_ONLY", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "trigger call 2 returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /ccr/units?plant_code=PLNT01 returns total_count 0 — neither attempt created a row"

      - name: professional_created_without_license_status_defaults_to_active
        claim_type: defaults
        grounds:
          - entities.QualifiedProfessional.fields.license_status
          - endpoints.POST_/ccr/professionals
        distinguishing_aspect: |
          license_status is the only optional input on professional creation and it defaults to ACTIVE.
          Omitting it must produce an immediately usable signer, while explicitly passing SUSPENDED must
          be honored rather than overwritten by the default — so the two creations in one instance
          separate "default applied" from "default always applied".
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { defaulted_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL", license_status: "SUSPENDED" }
              as: UtilityAdmin
              captures: { explicit_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 201 and QualifiedProfessional.${defaulted_id}.license_status == ACTIVE"
            - "trigger call 2 returns HTTP 201 and QualifiedProfessional.${explicit_id}.license_status == SUSPENDED"
            - "GET /ccr/professionals?license_status=ACTIVE returns total_count 1 and contains ${defaulted_id} only"

      - name: unit_ash_in_place_tons_is_recomputed_and_a_supplied_value_is_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.ash_in_place_balance
          - entities.DisposalUnit.fields.ash_in_place_tons
          - entities.DisposalUnit.fields.location_restriction_verdict
        distinguishing_aspect: |
          ash_in_place_tons, location_restriction_verdict and closure_deadline_date all have source
          computed and are absent from the endpoint's input list. Supplying them in the body must not
          steer the response: the balance must equal original_ash_in_place_tons because no shipment
          exists, and the verdict must be re-derived from the siting numbers even though a contradictory
          DISQUALIFIED was supplied.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0105", unit_name: "Ash Pond 105", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false, ash_in_place_tons: 1, location_restriction_verdict: "DISQUALIFIED", closure_deadline_date: "2099-01-01" }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.ash_in_place_tons == 480000, not 1"
            - "data.location_restriction_verdict == UNRESTRICTED, not DISQUALIFIED"
            - "data.closure_deadline_date == 2031-03-31, not 2099-01-01"
            - "data.ash_mass_balance_ok == true"
            - "GET /ccr/units/${unit_id} returns the same three computed values on re-read"

      - name: posting_identity_and_audit_fields_are_server_minted_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.PublicPosting.fields.posted_by_user_id
          - entities.PublicPosting.fields.status
          - endpoints.POST_/ccr/public-postings
        distinguishing_aspect: |
          id, created_at, updated_at, version, status and posted_by_user_id are all system-sourced. A
          client that supplies a UUID, a back-dated created_at, a version of 99, a status of WITHDRAWN
          and someone else's posted_by_user_id must receive a server-minted identity, version 1, status
          POSTED and posted_by_user_id equal to its own X-User-ID.
        test_recipe:
          setup:
            - "One clean unit"
          setup_api_calls:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0106", unit_name: "Ash Pond 106", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "ANNUAL_GW_REPORT", posted_on: "2026-07-01", document_uri: "https://utility.example.com/ccr/imp-0106/annual-gw-2025.pdf", document_sha256: "a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1", id: "9f1e7a52-0000-4000-8000-0000000000aa", created_at: "2001-01-01T00:00:00.000Z", version: 99, status: "WITHDRAWN", posted_by_user_id: "9f1e7a52-0000-4000-8000-0000000000bb" }
              as: ComplianceOfficer
              captures: { posting_id: $.data.id }
          assert:
            - "HTTP 201"
            - "${posting_id} is not 9f1e7a52-0000-4000-8000-0000000000aa and is a bare UUID with no type prefix"
            - "data.created_at is an ISO 8601 UTC instant with three fractional digits, not 2001-01-01T00:00:00.000Z"
            - "data.version == 1, not 99"
            - "data.status == POSTED, not WITHDRAWN"
            - "data.withdrawn_on == null and data.withdrawal_reason == null"
            - "data.posted_by_user_id is the caller's X-User-ID, not 9f1e7a52-0000-4000-8000-0000000000bb"

      - name: well_role_outside_the_enum_and_over_precise_pga_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_4_ERR_INVALID_REQUEST
          - entities.MonitoringWell.fields.well_role
          - entities.DisposalUnit.fields.seismic_pga_g
          - entities.MonitoringWell.fields.screen_bottom_ft
        distinguishing_aspect: |
          Three different type constraints must all report 400 ERR_INVALID_REQUEST: an out-of-domain
          enum symbol, a numeric field carrying more decimal places than declared, and an ordered pair
          whose bound relation is inverted (screen_bottom_ft must exceed screen_top_ft). None of them is
          a business-rule 422, and none may be silently coerced.
        test_recipe:
          setup:
            - "One clean unit and one licensed hydrogeologist"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0107", unit_name: "Ash Pond 107", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "SG-01", well_role: "SIDEGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-09", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 42.00, screen_bottom_ft: 22.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0108", unit_name: "Ash Pond 108", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.0501, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /ccr/wells?unit_id=${unit_id} returns total_count 0"
            - "GET /ccr/units?plant_code=PLNT01 returns total_count 1, containing only ${unit_id}"

      - name: stability_assessment_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.StabilityAssessment
          - entities.AnalyticalResult
          - entities.CapInspection
        distinguishing_aspect: |
          StabilityAssessment, AnalyticalResult and CapInspection are declared common_fields false, so
          they carry only id and created_at — no updated_at, no version — and §1.5 exposes no PATCH,
          PUT or DELETE for them. Correction is by superseding append, never by mutation: a second
          assessment for the same unit flips the first one's superseded flag instead of editing it.
        test_recipe:
          setup:
            - "One clean unit and one GEOTECHNICAL engineer"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0109", unit_name: "Ash Pond 109", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { first_id: $.data.id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-20", factor_of_safety_static: 1.50, factor_of_safety_seismic: 1.00, factor_of_safety_liquefaction: 1.20 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { second_id: $.data.id }
          assert:
            - "both calls return HTTP 201 and both response bodies carry id and created_at but neither updated_at nor version"
            - "StabilityAssessment.${first_id}.superseded == true and StabilityAssessment.${second_id}.superseded == false"
            - "StabilityAssessment.${first_id}.verdict == ADEQUATE and its factors are unchanged at 1.60 / 1.10 / 1.30"
