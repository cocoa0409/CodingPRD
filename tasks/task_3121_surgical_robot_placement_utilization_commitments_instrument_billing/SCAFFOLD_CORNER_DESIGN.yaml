# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3121_surgical_robot_placement_utilization_commitments_instrument_billing
#
# Breadth probe. Every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe. The first instance of each section defines the shared fixture
# anchors (`&clock`, `&acct`, ...) that later instances reuse by alias.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: account_create_returns_system_fields_and_onboarding_posture
        claim_type: Creation
        grounds:
          - entities.HospitalAccount
          - entities.HospitalAccount.fields.account_posture
          - endpoints.POST_/api/accounts
          - response_envelope.success
        distinguishing_aspect: "POST /api/accounts with only account_name, idn_group_code, region_code, placement_cap and maximum_procedure_commitment returns 201 with status PROSPECT, an ungated ONBOARDING_GATE posture, version 1, and system-minted id/created_at/updated_at — account_status and account_posture are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &clock
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &acct
              call: "POST /api/accounts"
              payload: { account_name: "Corner General Hospital", idn_group_code: "IDN-CORNER", region_code: "WEST", placement_cap: 6, maximum_procedure_commitment: 40 }
              as: RegionalSalesDirector
              captures: { acct: $.data.id, acct_v: $.data.version }
          assert:
            - "the response status is 201, response_type is object, and meta carries api_request_id and api_request_timestamp"
            - "HospitalAccount.${acct}.account_name == \"Corner General Hospital\" and idn_group_code == \"IDN-CORNER\""
            - "HospitalAccount.${acct}.account_status == PROSPECT"
            - "HospitalAccount.${acct}.account_posture == ONBOARDING_GATE because the account has no SiteReadinessReview yet"
            - "HospitalAccount.${acct}.version == 1 and created_at / updated_at are non-null ISO-8601 UTC with three fractional digits"

      - name: configuration_get_round_trips_the_dimensional_catalog
        claim_type: Retrieval
        grounds:
          - entities.SystemConfiguration
          - endpoints.GET_/api/system-configurations/{configId}
        distinguishing_aspect: "Every SystemConfiguration catalog field round-trips through GET unchanged, including the nested feature_entitlements array of {feature_code, min_release_index} objects and both integration requirement booleans."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One DA_V2 configuration with integration_tier 2."
          setup_api_calls:
            - *clock
            - &cfg2
              call: "POST /api/system-configurations"
              payload: { model_code: "DA_V2", base_placement_fee_cents: 6000000, max_instrument_lives: 12, feature_entitlements: [{ feature_code: "FIREFLY", min_release_index: 1 }, { feature_code: "FORCE_FEEDBACK", min_release_index: 3 }], requires_dark_fiber: true, requires_dedicated_power_circuit: true, integration_tier: 2, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg: $.data.id }
          trigger:
            - call: "GET /api/system-configurations/${cfg}"
              payload: {}
              as: RegionalSalesDirector
          assert:
            - "SystemConfiguration.${cfg}.model_code == \"DA_V2\" and base_placement_fee_cents == 6000000"
            - "SystemConfiguration.${cfg}.integration_tier == 2 and max_instrument_lives == 12"
            - "SystemConfiguration.${cfg}.feature_entitlements has 2 entries and the FORCE_FEEDBACK entry has min_release_index 3"
            - "SystemConfiguration.${cfg}.requires_dark_fiber == true and requires_dedicated_power_circuit == true"
            - "SystemConfiguration.${cfg}.status == ACTIVE"

      - name: procedure_cases_list_paginates_with_status_and_window_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/procedure-cases
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three cases on one system, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true while offset=2 returns the last row with has_more false, and the case_status plus case_started_from filters narrow total_count rather than the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack: account, configuration, credentialed surgeon, agreement, commissioned system, and three scheduled cases on 2026-09-10, 2026-09-11 and 2026-09-12."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - &review_pass
              call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "CG-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev: $.data.id, rev_v: $.data.version }
            - &review_verdict
              call: "POST /api/account-readiness-reviews/${rev}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev_v}" }
              as: ClinicalOperationsLead
            - &surgeon
              call: "POST /api/accounts/${acct}/training-records"
              payload: { surgeon_name: "Dr. Corner", simulation_modules_completed: 4, required_proctored_cases: 1 }
              as: ClinicalOperationsLead
              captures: { tr: $.data.id, tr_v: $.data.version }
            - &agreement
              call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "PURCHASE", base_monthly_fee_cents: 200000, minimum_procedures_per_cycle: 0, interval_months: 1, placement_fee_cents: 6000000 }
              as: RegionalSalesDirector
              captures: { agr: $.data.id, agr_v: $.data.version }
            - &submit
              call: "POST /api/placement-agreements/${agr}/submit"
              payload: { expected_agreement_version: "${agr_v}" }
              as: RegionalSalesDirector
              captures: { agr_v: $.data.version }
            - &accept
              call: "POST /api/placement-agreements/${agr}/accept"
              payload: { expected_agreement_version: "${agr_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys: $.data.synthesized_system_id, sys_v: $.data.synthesized_system_version, agr_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - &case_a
              call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-10T08:00:00Z", duration_minutes: 60, instrument_load: 1, is_emergency: false }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { ca: $.data.id, ca_v: $.data.version }
            - &case_b
              call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "GYNECOLOGY", case_started_at: "2026-09-11T08:00:00Z", duration_minutes: 60, instrument_load: 1, is_emergency: false }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { cb: $.data.id, cb_v: $.data.version }
            - &case_c
              call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-12T08:00:00Z", duration_minutes: 60, instrument_load: 1, is_emergency: false }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { cc: $.data.id, cc_v: $.data.version }
          trigger:
            - call: "GET /api/procedure-cases"
              payload: { robot_system_id: "${sys}", limit: 2, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "the response status is 200, response_type is array, and exactly 2 rows are returned with total_count == 3 and has_more == true"
            - "GET /api/procedure-cases?robot_system_id=${sys}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /api/procedure-cases?robot_system_id=${sys}&case_status=SCHEDULED returns total_count 3"
            - "GET /api/procedure-cases?robot_system_id=${sys}&case_started_from=2026-09-11T00:00:00Z&case_started_to=2026-09-12T00:00:00Z returns total_count 1, the GYNECOLOGY case"
            - "GET /api/procedure-cases with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: agreement_get_with_an_unallocated_id_returns_agreement_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/placement-agreements/{agreementId}
          - errors.ERR_AGREEMENT_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id yields the entity-specific 404 ERR_AGREEMENT_NOT_FOUND rather than a generic ERR_NOT_FOUND, and the error envelope carries both error_id and message."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No agreement has been created."
          setup_api_calls:
            - *clock
          trigger:
            - call: "GET /api/placement-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegionalSalesDirector
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "the response status is 404 and error_id == ERR_AGREEMENT_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"
            - "no PlacementAgreement row is created as a side effect"

      - name: configuration_create_missing_model_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SystemConfiguration.fields.model_code
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "model_code is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 422 business error about the configuration's content."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *clock
          trigger:
            - call: "POST /api/system-configurations"
              payload: { base_placement_fee_cents: 4800000, max_instrument_lives: 10, feature_entitlements: [], requires_dark_fiber: false, requires_dedicated_power_circuit: false, integration_tier: 1, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: agreement_optional_defaults_materialize_on_draft
        claim_type: Defaults
        grounds:
          - entities.PlacementAgreement.fields.minimum_procedures_per_cycle
          - entities.PlacementAgreement.fields.interval_months
          - entities.PlacementAgreement.fields.is_shortfall_waived
          - endpoints.POST_/api/placement-agreements
        distinguishing_aspect: "Omitting the three optional agreement fields materializes the declared defaults — minimum_procedures_per_cycle 0, interval_months 1 and is_shortfall_waived false — and a commitment of 0 is what makes the shortfall machinery vacuous for this agreement."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack up to a PASSED review."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
          trigger:
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "LEASE", base_monthly_fee_cents: 900000, lease_monthly_amount_cents: 1200000 }
              as: RegionalSalesDirector
              captures: { agr: $.data.id }
          assert:
            - "the response status is 201 and PlacementAgreement.${agr}.minimum_procedures_per_cycle == 0"
            - "PlacementAgreement.${agr}.interval_months == 1"
            - "PlacementAgreement.${agr}.is_shortfall_waived == false"
            - "PlacementAgreement.${agr}.compliance_status == MEETS_COMMITMENT and agreement_status == DRAFT"
            - "PlacementAgreement.${agr}.net_placement_fee_cents is null before acceptance"

      - name: procedure_case_computed_billing_and_lives_are_not_client_settable
        claim_type: Computed Fields
        grounds:
          - entities.ProcedureCase.fields.instrument_billing_cents
          - entities.ProcedureCase.fields.approved_instrument_load
          - entities.RobotSystem.fields.instrument_lives_remaining
          - endpoints.POST_/api/robot-systems/{systemId}/procedure-cases
        distinguishing_aspect: "instrument_billing_cents, approved_instrument_load, instrument_lives_remaining and commitment_cycle_index are all source: computed, so a client that tries to post them either has them ignored or is rejected — the server-derived values stand."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack fully installed and commissioned on a PURCHASE agreement whose configuration carries max_instrument_lives 40."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
          trigger:
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-10T08:00:00Z", duration_minutes: 90, instrument_load: 2, is_emergency: false }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { cid: $.data.id }
          assert:
            - "ProcedureCase.${cid}.instrument_billing_cents == 250000 (2 loads x 125000), not a client-supplied number"
            - "ProcedureCase.${cid}.approved_instrument_load == 2 and equals the attempted load because 40 lives remain"
            - "ProcedureCase.${cid}.case_status == SCHEDULED and commitment_cycle_index is a non-null integer"
            - "GET /api/robot-systems/${sys} reports instrument_lives_remaining == 38"

      - name: agreement_arrangement_type_rejects_an_unknown_enum_member
        claim_type: Type Constraints
        grounds:
          - entities.PlacementAgreement.fields.arrangement_type
          - entities.ProcedureCase.fields.procedure_family
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "arrangement_type is a closed enum {PURCHASE, LEASE, USAGE_BASED}, so a value outside that set is rejected at parse time rather than silently treated as one of the three arrangements."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack up to a PASSED review."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
          trigger:
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "RENT_TO_OWN", base_monthly_fee_cents: 200000, placement_fee_cents: 6000000 }
              as: RegionalSalesDirector
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "no PlacementAgreement row is created"

      - name: loaner_dispatch_parent_relationship_uses_the_system_in_the_path
        claim_type: Parent Relationships
        grounds:
          - entities.LoanerSystemDispatch.fields.robot_system_id
          - endpoints.POST_/api/loaner-dispatches
          - endpoints.GET_/api/robot-systems/{systemId}/loaner-dispatches
        distinguishing_aspect: "A dispatch created against system A is discoverable only under A's sub-resource list and never under B's, so the parent relationship is enforced by the FK rather than by the caller."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two commissioned systems A and B on the same account, both with active contracts."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "CG-2", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev_b: $.data.id, rev_b_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev_b}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev_b_v}" }
              as: ClinicalOperationsLead
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev_b}", arrangement_type: "LEASE", base_monthly_fee_cents: 200000, lease_monthly_amount_cents: 900000 }
              as: RegionalSalesDirector
              captures: { agr_b: $.data.id, agr_b_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_b}/submit"
              payload: { expected_agreement_version: "${agr_b_v}" }
              as: RegionalSalesDirector
              captures: { agr_b_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_b}/accept"
              payload: { expected_agreement_version: "${agr_b_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys_b: $.data.synthesized_system_id, sys_b_v: $.data.synthesized_system_version }
          trigger:
            - call: "POST /api/loaner-dispatches"
              payload: { robot_system_id: "${sys}", loaner_serial_number: "LOAN-CORNER-1", dispatch_window_start_utc: "2026-09-15T00:00:00Z", dispatch_window_end_utc: "2026-09-29T00:00:00Z" }
              as: ServiceEngineer
              captures: { disp: $.data.id }
          assert:
            - "LoanerSystemDispatch.${disp}.robot_system_id == ${sys}"
            - "GET /api/robot-systems/${sys}/loaner-dispatches returns exactly 1 row, the new dispatch"
            - "GET /api/robot-systems/${sys_b}/loaner-dispatches returns exactly 0 rows"
            - "GET /api/loaner-dispatches?robot_system_id=${sys} returns total_count 1"

      - name: service_contract_get_with_an_unknown_id_returns_contract_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/service-contracts/{contractId}
          - errors.ERR_CONTRACT_NOT_FOUND
        distinguishing_aspect: "The contract path segment resolves to its own entity-specific 404 rather than reusing the agreement or system not-found code."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *clock
          trigger:
            - call: "GET /api/service-contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ServiceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CONTRACT_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: account_starts_in_prospect_and_close_locks_the_terminal_state
        claim_type: Initial State
        grounds:
          - state_machines.HospitalAccount.initial_state
          - state_machines.HospitalAccount.terminal_states
          - endpoints.POST_/api/accounts/{accountId}/close
        distinguishing_aspect: "A freshly created account sits in PROSPECT and, once closed, CLOSED is terminal — every subsequent transition endpoint rejects from it rather than re-opening the account."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with no agreements, already closed."
          setup_api_calls:
            - *clock
            - *acct
            - call: "POST /api/accounts/${acct}/close"
              payload: { expected_account_version: "${acct_v}" }
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /api/households/${acct}/reactivate"
              payload: { expected_account_version: "${acct_v}" }
              as: RegionalSalesDirector
              captures: { err: $.data.error_id }
          assert:
            - "HospitalAccount.${acct}.account_status == CLOSED before the trigger"
            - "the response status is 409 and error_id == ERR_ACCOUNT_NOT_IN_ELIGIBLE_STATE"
            - "HospitalAccount.${acct}.account_status is still CLOSED"

      - name: account_activation_without_training_path_returns_uninitialized
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.HospitalAccount.PROSPECT_to_READINESS
          - errors.ERR_TRAINING_PATH_UNINITIALIZED
          - endpoints.POST_/api/account-readiness-reviews/{reviewId}/activate
        distinguishing_aspect: "With a readiness review on file but no SurgeonTrainingRecord, the PROSPECT to READINESS precondition fails on the training-path clause specifically — proving the two preconditions are separately enforced rather than collapsed into one."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with a review but no training record."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
          trigger:
            - call: "POST /api/account-readiness-reviews/${rev}/activate"
              payload: { expected_account_version: "${acct_v}" }
              as: ClinicalOperationsLead
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TRAINING_PATH_UNINITIALIZED"
            - "HospitalAccount.${acct}.account_status is still PROSPECT"
            - "after POST /api/accounts/${acct}/training-records the same call succeeds and account_status becomes READINESS"

      - name: commissioning_synthesizes_an_underutilized_cycle_as_a_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RobotSystem.INSTALLED_to_IN_SERVICE
          - entities.RobotSystem.fields.current_utilization_cycle_id
          - endpoints.GET_/api/robot-systems/{systemId}/current-utilization-cycle
        distinguishing_aspect: "The commission transition's only externally visible side effect is the stamped current_utilization_cycle_id, and the cycle it names is reachable and reports UNDERUTILIZED with zero completed cases."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack installed but not commissioned."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
          trigger:
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
          assert:
            - "RobotSystem.${sys}.service_status == IN_SERVICE"
            - "RobotSystem.${sys}.current_utilization_cycle_id is non-null"
            - "GET /api/robot-systems/${sys}/current-utilization-cycle returns completed_case_count 0, scheduled_case_count 0 and utilization_band UNDERUTILIZED"
            - "the cycle's cycle_end_utc is exactly cycle_start_utc + 30 days"

      - name: commissioning_from_the_uninstalled_state_returns_status_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RobotSystem.NOT_INSTALLED_to_INSTALLED
          - errors.ERR_SYSTEM_STATUS_INVALID
          - endpoints.POST_/api/robot-systems/{systemId}/commission
        distinguishing_aspect: "Commissioning is legal only from INSTALLED, so the same endpoint against a NOT_INSTALLED system is rejected with ERR_SYSTEM_STATUS_INVALID and no cycle is opened."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack accepted so a NOT_INSTALLED system exists, with a credentialed surgeon and an active contract."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
          trigger:
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SYSTEM_STATUS_INVALID"
            - "RobotSystem.${sys}.service_status is still NOT_INSTALLED and current_utilization_cycle_id is null"

      - name: evidence_state_machine_starts_valid_and_expiry_is_terminal
        claim_type: Initial State
        grounds:
          - state_machines.CredentialingEvidence.initial_state
          - state_machines.CredentialingEvidence.terminal_states
          - endpoints.POST_/api/credentialing-evidence/{evidenceId}/revoke
        distinguishing_aspect: "Evidence is created VALID and revocation is terminal, so a second revoke against an already REVOKED row is rejected rather than idempotent."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack up to a training record, plus one evidence record."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - call: "POST /api/training-records/${tr}/credentialing-evidence"
              payload: { evidence_type: "CREDENTIAL_LETTER", issued_utc: "2026-08-01T00:00:00Z", expires_utc: "2027-08-01T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /api/credentialing-evidence/${ev}/revoke"
              payload: { expected_evidence_version: "${ev_v}" }
              as: ComplianceOfficer
              captures: { ev_v: $.data.version }
          trigger:
            - call: "POST /api/credentialing-evidence/${ev}/revoke"
              payload: { expected_evidence_version: "${ev_v}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "CredentialingEvidence.${ev}.evidence_status == REVOKED before the trigger"
            - "the response status is 409 and error_id == ERR_EVIDENCE_NOT_RENEWABLE"
            - "CredentialingEvidence.${ev}.evidence_status is still REVOKED"

      - name: agreement_already_terminated_cannot_be_terminated_again
        claim_type: Idempotency
        grounds:
          - state_machines.PlacementAgreement.ACTIVE_to_TERMINATED
          - errors.ERR_AGREEMENT_NOT_TERMINABLE
          - endpoints.POST_/api/placement-agreements/{agreementId}/terminate
        distinguishing_aspect: "Repeating a terminal transition is rejected rather than silently succeeding, so a second terminate returns ERR_AGREEMENT_NOT_TERMINABLE and the dependent systems are not decommissioned twice."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack installed and commissioned, then terminated."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr}/terminate"
              payload: { expected_agreement_version: "${agr_v}" }
              as: PlatformAdmin
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /api/placement-agreements/${agr}/terminate"
              payload: { expected_agreement_version: "${agr_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_AGREEMENT_NOT_TERMINABLE"
            - "PlacementAgreement.${agr}.agreement_status is still TERMINATED"
            - "RobotSystem.${sys}.service_status is still DECOMMISSIONED"
  # ===========================================================================
  - section: calculations
    instances:

      - name: incident_resolution_penalty_grace_band_is_inclusive_at_due
        claim_type: Correct Result
        grounds:
          - calculations.incident_resolution_penalty
          - calculations.service_response_commitment
          - entities.IncidentServiceRequest.fields.response_due_at_utc
          - endpoints.POST_/api/incident-service-requests/{incidentId}/resolve
        distinguishing_aspect: "The grace boundary is closed on the left: resolving at exactly response_due_at_utc scores 0 while one minute later scores 2, so an implementation using a strict comparison at the due instant is wrong."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack installed and commissioned with a COMPREHENSIVE contract (tier index 3, commitment 6 hours), plus one MINOR incident started 2026-09-05T00:00:00Z whose due instant is 2026-09-05T06:00:00Z."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/incident-service-requests"
              payload: { robot_system_id: "${sys}", incident_started_at: "2026-09-05T00:00:00Z" }
              as: ServiceEngineer
              captures: { inc: $.data.id, inc_v: $.data.version, due: $.data.response_due_at_utc, sev: $.data.incident_severity }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T06:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/incident-service-requests/${inc}/resolve"
              payload: { resolution_notes: "Resolved exactly at the commitment instant.", expected_incident_version: "${inc_v}" }
              as: ServiceEngineer
          assert:
            - "IncidentServiceRequest.${inc}.incident_severity == MINOR because the system stayed IN_SERVICE and the account posture was ACTIVE"
            - "IncidentServiceRequest.${inc}.response_due_at_utc == 2026-09-05T06:00:00Z (6 hours after a COMPREHENSIVE tier-index-3 contract)"
            - "the resolution at exactly the due instant scores penalty 0, so the resolve response reports a zero penalty for the incident"
            - "resolving one minute later (clock 2026-09-05T06:01:00Z) scores penalty 2 instead, so the boundary is inclusive on the due instant"

      - name: instrument_lives_accumulator_never_goes_negative_under_load
        claim_type: Constants Applied
        grounds:
          - calculations.instrument_lives_remaining
          - entities.RobotSystem.fields.instrument_lives_remaining
          - endpoints.POST_/api/robot-systems/{systemId}/instrument-lives/reset
        distinguishing_aspect: "The accumulator floors at 0 and only a provisioning reset raises it, so a load larger than the remaining lives leaves instrument_lives_remaining at 0 (clamped, not negative) and the reset restores the configuration's full count."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack installed and commissioned, with a configuration carrying max_instrument_lives 2."
          setup_api_calls:
            - *clock
            - *acct
            - &cfg_small
              call: "POST /api/system-configurations"
              payload: { model_code: "DA_V1", base_placement_fee_cents: 4800000, max_instrument_lives: 2, feature_entitlements: [], requires_dark_fiber: false, requires_dedicated_power_circuit: false, integration_tier: 1, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg_s: $.data.id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "LS-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg_s}" }
              as: ClinicalOperationsLead
              captures: { rev_s: $.data.id, rev_s_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev_s}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev_s_v}" }
              as: ClinicalOperationsLead
            - *surgeon
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg_s}", site_readiness_review_id: "${rev_s}", arrangement_type: "PURCHASE", base_monthly_fee_cents: 200000, minimum_procedures_per_cycle: 0, interval_months: 1, placement_fee_cents: 6000000 }
              as: RegionalSalesDirector
              captures: { agr_s: $.data.id, agr_s_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_s}/submit"
              payload: { expected_agreement_version: "${agr_s_v}" }
              as: RegionalSalesDirector
              captures: { agr_s_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_s}/accept"
              payload: { expected_agreement_version: "${agr_s_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys_s: $.data.synthesized_system_id, sys_s_v: $.data.synthesized_system_version }
            - call: "POST /api/robot-systems/${sys_s}/install"
              payload: { expected_robot_system_version: "${sys_s_v}" }
              as: ClinicalOperationsLead
              captures: { sys_s_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_s}/commission"
              payload: { expected_robot_system_version: "${sys_s_v}" }
              as: ClinicalOperationsLead
              captures: { sys_s_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_s}/instrument-lives/decrement"
              payload: { approved_load: 2 }
              as: ServiceEngineer
              captures: { sys_s_v: $.data.version }
          trigger:
            - call: "POST /api/robot-systems/${sys_s}/instrument-lives/decrement"
              payload: { approved_load: 5 }
              as: ServiceEngineer
              captures: { sys_s_v: $.data.version }
          assert:
            - "RobotSystem.${sys_s}.instrument_lives_remaining == 0 after decrementing 2 of 2"
            - "decrementing a further 5 leaves RobotSystem.${sys_s}.instrument_lives_remaining == 0 and never a negative number"
            - "POST /api/robot-systems/${sys_s}/instrument-lives/reset with expected_robot_system_version ${sys_s_v} restores instrument_lives_remaining == 2"

      - name: shortfall_fee_grace_two_is_inclusive_and_three_charges
        claim_type: Precision
        grounds:
          - calculations.shortfall_fee
          - constants.SHORTFALL_GRACE_PROCEDURES
          - endpoints.POST_/api/month-close/runs
        distinguishing_aspect: "The grace band is inclusive at exactly two procedures: a commitment of 10 delivered 8 (shortfall 2) charges 0 while delivered 7 (shortfall 3) charges exactly one chargeable procedure at 2% of the placement fee, pinning the >= versus > trap."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with a USAGE_BASED agreement carrying minimum_procedures_per_cycle 6, placement_fee_cents 1000000 and usage_rate_basis_points 400, plus a commissioned system and four completed cases."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "USAGE_BASED", base_monthly_fee_cents: 0, minimum_procedures_per_cycle: 6, interval_months: 1, placement_fee_cents: 1000000, usage_rate_basis_points: 400 }
              as: RegionalSalesDirector
              captures: { agr_u: $.data.id, agr_u_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_u}/submit"
              payload: { expected_agreement_version: "${agr_u_v}" }
              as: RegionalSalesDirector
              captures: { agr_u_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_u}/accept"
              payload: { expected_agreement_version: "${agr_u_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys_u: $.data.synthesized_system_id, sys_u_v: $.data.synthesized_system_version }
            - call: "POST /api/robot-systems/${sys_u}/install"
              payload: { expected_robot_system_version: "${sys_u_v}" }
              as: ClinicalOperationsLead
              captures: { sys_u_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_u}/commission"
              payload: { expected_robot_system_version: "${sys_u_v}" }
              as: ClinicalOperationsLead
              captures: { sys_u_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_u}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-05T08:00:00Z", duration_minutes: 60 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { u1: $.data.id }
            - call: "POST /api/robot-systems/${sys_u}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-06T08:00:00Z", duration_minutes: 60 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { u2: $.data.id }
            - call: "POST /api/robot-systems/${sys_u}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-07T08:00:00Z", duration_minutes: 60 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { u3: $.data.id }
            - call: "POST /api/robot-systems/${sys_u}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-08T08:00:00Z", duration_minutes: 60 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { u4: $.data.id }
          trigger:
            - call: "POST /api/month-close/runs"
              payload: { as_of_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "the four scheduled cases give committed_cases 4 against a commitment of 6, so shortfall_procedures == 2"
            - "PlacementAgreement.${agr_u}.last_shortfall_fee_cents == 0, because a shortfall of exactly the 2-procedure grace is free"
            - "a shortfall of 3 would bill 1 x 1000000 x 0.02 == 20000, so the grace is inclusive at 2 and exclusive at 3"
            - "PlacementAgreement.${agr_u}.compliance_status == MEETS_COMMITMENT"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_user_context_header_wins_over_every_business_check
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
          - endpoints.POST_/api/placement-agreements/{agreementId}/submit
        distinguishing_aspect: "The auth check runs before every business rule, so the same submit call that would otherwise fail on ERR_AGREEMENT_TERMS_INCOMPLETE fails instead on the missing header — priority 1 defeats priority 38."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One DRAFT LEASE agreement with no lease_monthly_amount_cents, so the terms check would also fire."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "LEASE", base_monthly_fee_cents: 200000 }
              as: RegionalSalesDirector
              captures: { agr: $.data.id, agr_v: $.data.version }
          trigger:
            - call: "POST /api/placement-agreements/${agr}/submit"
              payload: { expected_agreement_version: "${agr_v}" }
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "error_id is NOT ERR_AGREEMENT_TERMS_INCOMPLETE even though the LEASE terms are incomplete"
            - "PlacementAgreement.${agr}.agreement_status is still DRAFT"

      - name: region_scoped_director_outside_its_region_is_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations[priority=3]
          - errors.ERR_REGION_SCOPE_VIOLATION
          - roles.RegionalSalesDirector
        distinguishing_aspect: "A RegionalSalesDirector whose identity is region WEST is denied on an account whose region_code is EAST, with 403, even though the role owns the operation — scope is enforced on the resource, not the verb."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account created in region EAST."
          setup_api_calls:
            - *clock
            - call: "POST /api/accounts"
              payload: { account_name: "Eastgate Regional", idn_group_code: "IDN-EASTGATE", region_code: "EAST", placement_cap: 3, maximum_procedure_commitment: 20 }
              as: RegionalSalesDirector
              as_user_id: "rd-east"
              captures: { acct_e: $.data.id, acct_e_v: $.data.version }
          trigger:
            - call: "POST /api/accounts/${acct_e}/close"
              payload: { expected_account_version: "${acct_e_v}" }
              as: RegionalSalesDirector
              as_user_id: "rd-west"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 or 404 and the account is not closed"
            - "GET /api/accounts?region_code=EAST with as_user_id rd-west returns zero rows because the scope filter excludes other regions"
            - "the same close with as_user_id rd-east and the account's real version succeeds"

      - name: emergency_case_on_a_service_action_system_still_requires_the_credential
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=41]
          - errors.ERR_SURGEON_NOT_CREDENTIALED
          - calculations.training_path_eligibility
          - endpoints.POST_/api/robot-systems/{systemId}/procedure-cases
        distinguishing_aspect: "The cross-entity credential check is not bypassed by the emergency flag: an uncredentialed surgeon on a healthy IN_SERVICE system fails with ERR_SURGEON_NOT_CREDENTIALED, proving the credential gate is independent of the system-status gate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack installed and commissioned, plus a second training record that has only finished its simulation modules and never been credentialed."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/accounts/${acct}/training-records"
              payload: { surgeon_name: "Dr. Trainee", simulation_modules_completed: 3, required_proctored_cases: 2 }
              as: ClinicalOperationsLead
              captures: { tr2: $.data.id, tr2_v: $.data.version }
            - call: "POST /api/training-records/${tr2}/complete-simulation"
              payload: { simulation_modules_completed: 3, expected_training_record_version: "${tr2_v}" }
              as: ClinicalOperationsLead
              captures: { tr2_v: $.data.version }
          trigger:
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr2}", procedure_family: "UROLOGY", case_started_at: "2026-09-20T08:00:00Z", duration_minutes: 60, instrument_load: 1, is_emergency: false }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SURGEON_NOT_CREDENTIALED"
            - "the same booking with training_record_id ${tr} (credentialed) succeeds with 201"
            - "training_path_eligibility step 5 is false for ${tr2} because training_status is SIMULATION_COMPLETE, not CREDENTIALED"

      - name: cancelled_case_lifecycle_bounds_aggregate_committed_cases
        claim_type: Aggregate validation
        grounds:
          - calculations.shortfall_fee
          - calculations.instrument_lives_remaining
          - endpoints.POST_/api/procedure-cases/{caseId}/cancel
        distinguishing_aspect: "Two aggregates move in opposite directions from one cancellation: the cancelled case leaves the committed_cases count (so the interval can fall into shortfall) while its instrument load is released in the same request, so a single cancel can flip a compliant interval into shortfall without changing any other field."
        test_recipe:
