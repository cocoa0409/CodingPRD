  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted to invoke this endpoint" }
  # --- Not found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id not found" }
  # --- Generic input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or type mismatch" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in a state that does not permit this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match current version" }
  # --- Campaign / attempt ---
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "OutreachCampaign referenced by attempt is not ACTIVE" }
  - { id: ERR_CAMPAIGN_NOT_YET_OPEN, http: 409, condition: "Campaign launch attempted before starts_at" }
  - { id: ERR_CAMPAIGN_WINDOW_PAST, http: 409, condition: "Current business date is past campaign ends_at" }
  - { id: ERR_INVALID_CAMPAIGN_WINDOW, http: 400, condition: "starts_at >= ends_at or window entirely in the past" }
  - { id: ERR_CAMPAIGN_WINDOW_VIOLATION, http: 409, condition: "Attempt falls outside campaign window or inside quiet hours" }
  - { id: ERR_ATTEMPT_TOO_EARLY, http: 409, condition: "current_business_date < next_eligible_attempt_at" }
  - { id: ERR_ATTEMPT_CAP_REACHED, http: 409, condition: "attempt_count >= campaign.max_attempts_per_member" }
  - { id: ERR_CHANNEL_CONSENT_MISSING, http: 403, condition: "Member consent flag blocks the chosen channel" }
  - { id: ERR_MEMBER_EXCLUDED, http: 409, condition: "APPROVED ExclusionRequest covers this measure for the member at current_business_date" }
  # --- Appointment / transport ---
  - { id: ERR_APPOINTMENT_ALREADY_ACTIVE, http: 409, condition: "An Appointment in {SCHEDULED, CONFIRMED} already exists for this care_gap_id" }
  - { id: ERR_PROVIDER_SLOT_FULL, http: 409, condition: "Overlapping appointment would exceed provider_capacity_per_slot" }
  - { id: ERR_INVALID_SLOT, http: 400, condition: "slot_start_at >= slot_end_at or slot_start_at in the past" }
  - { id: ERR_CANNOT_MARK_FUTURE_APPOINTMENT, http: 409, condition: "mark-no-show before slot_end_at" }
  - { id: ERR_APPOINTMENT_NOT_CONFIRMED, http: 409, condition: "Appointment must be CONFIRMED before complete" }
  - { id: ERR_TRANSPORT_NOT_ARRANGED, http: 409, condition: "Linked TransportationAssist must be ARRANGED or COMPLETED before appointment confirm/complete" }
  - { id: ERR_INVALID_COST, http: 400, condition: "cost_cents negative" }
  # --- Evidence / exclusion ---
  - { id: ERR_EVIDENCE_OUT_OF_WINDOW, http: 409, condition: "service_date older than measure.lookback_days" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Approver/rejector may not equal submitter (segregation of duties)" }
  - { id: ERR_INSUFFICIENT_JUSTIFICATION, http: 400, condition: "MEDICAL_CONTRAINDICATION requires justification >= 20 chars" }
  - { id: ERR_EXCLUSION_BLOCKED_BY_APPOINTMENT, http: 409, condition: "Member has a SCHEDULED/CONFIRMED appointment for this measure" }
  # --- Reconciliation / report ---
  - { id: ERR_RECONCILIATION_WINDOW_OPEN, http: 409, condition: "Report cannot be finalized before reporting_lag_days have elapsed" }
  - { id: ERR_RECONCILIATION_WINDOW_CLOSED, http: 409, condition: "CareGap cannot be reopened after reporting_lag_days past due_date" }
  # --- Panel ---
  - { id: ERR_PANEL_NOT_ACTIVE, http: 409, condition: "RegistryPanel must be ACTIVE for campaign launch" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Population-health program admin; owns registry, measures, cohorts, panels, campaigns, clock, workloads, reports"
    identity: opaque
    exclusive_operations:
      - "POST /population-health/_clock/set_current_utc"
      - "POST /population-health/registries"
      - "POST /population-health/registries/{id}/measure-definitions (+ publish)"
      - "POST /population-health/registries/{id}/cohort-definitions (+ activate)"
      - "POST /population-health/registries/{id}/members (+ disenroll)"
      - "POST /population-health/registries/{id}/registry-panels (+ activate/rebuild/finalize-rebuild/retire)"
      - "POST /population-health/registries/{id}/outreach-campaigns (+ schedule/launch/pause/resume/complete/cancel)"
      - "POST /population-health/registries/{id}/panel-manager-workloads"
      - "POST /population-health/panel-manager-workloads/{id}/incentive-payouts/projection"
      - "POST /population-health/incentive-payouts/{id}/approve"
      - "POST /population-health/measure-definitions/{id}/measure-performance-reports"
      - "POST /population-health/measure-performance-reports/{id}/finalize"
    shared_operations:
      - "GET read endpoints"
      - "POST /population-health/members/{id}/exclusion-requests"
      - "POST /population-health/appointments/{id}/transportation-assists"

  - name: PanelManager
    description: "Care-gap outreach worker; acts on panels where panel_manager_id == X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /population-health/care-gaps/{id}/outreach-attempts"
      - "POST /population-health/care-gaps/{id}/appointments"
      - "POST /population-health/appointments/{id}/confirm"
      - "POST /population-health/appointments/{id}/complete"
      - "POST /population-health/appointments/{id}/mark-no-show"
      - "POST /population-health/appointments/{id}/cancel"
      - "POST /population-health/appointments/{id}/reschedule"
    shared_operations:
      - "GET read endpoints"
      - "POST /population-health/members/{id}/exclusion-requests"
      - "POST /population-health/care-gaps/{id}/gap-closure-evidence"
      - "POST /population-health/appointments/{id}/transportation-assists"

  - name: QualityReviewer
    description: "Independent reviewer; approves evidence and exclusions. Segregation of duties: cannot approve their own submissions"
    identity: opaque
    exclusive_operations:
      - "POST /population-health/gap-closure-evidence/{id}/approve"
      - "POST /population-health/gap-closure-evidence/{id}/reject"
      - "POST /population-health/exclusion-requests/{id}/start-review"
      - "POST /population-health/exclusion-requests/{id}/approve"
      - "POST /population-health/exclusion-requests/{id}/deny"
      - "POST /population-health/exclusion-requests/{id}/revoke"
    shared_operations:
      - "GET read endpoints"
      - "POST /population-health/care-gaps/{id}/gap-closure-evidence"

  - name: TransportationCoordinator
    description: "Vendor-facing transport coordinator"
    identity: opaque
    exclusive_operations:
      - "POST /population-health/transportation-assists/{id}/arrange"
      - "POST /population-health/transportation-assists/{id}/complete"
      - "POST /population-health/transportation-assists/{id}/cancel"
    shared_operations:
      - "GET read endpoints"
      - "POST /population-health/appointments/{id}/transportation-assists"

  - name: DataReconciliationBot
    description: "System actor; processes claims feed and reopens mismatched gaps"
    identity: opaque
    exclusive_operations:
      - "POST /population-health/care-gaps/{id}/reopen"
    shared_operations:
      - "GET read endpoints"
