            - { call: "PUT /fair-lending/applications/${a1}", payload: { note_rate_bps: 705, expected_application_version: "${a_v2}" }, as: LendingDataOps, captures: { a_status: $.data.status, a_v3: $.data.version } }
          assert:
            - "stale PUT (version 1 vs current 2) -> 412 ERR_STALE_VERSION; version unchanged"
            - "current PUT (version 2) -> 200, status RECEIVED, version == 3 (increments on every mutation)"

