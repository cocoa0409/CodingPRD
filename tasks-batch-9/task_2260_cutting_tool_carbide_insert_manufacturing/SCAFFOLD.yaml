  - method: GET
    path: "/tooling/tool-products"
    description: "List tool products, filterable by grade, geometry, coating recipe, base catalog product, release status and order class; the reverse-reachability channel for CarbideGrade/InsertGeometry/CoatingRecipe -> ToolProduct and for the self-referential base_catalog_product_id."
    roles: [GeometryEngineer, ApplicationEngineer, MetallurgyEngineer, CoatingEngineer, QualityApprover, ProductionPlanner, Customer]
    code: 200
    input: ["grade_id?", "geometry_id?", "coating_recipe_id?", "base_catalog_product_id?", "release_status?", "order_class?", "limit?", "offset?"]
    output: ToolProduct[]
    side_effects: []

  - method: POST
    path: "/tooling/tool-products/{productId}/enter-qualification"
    description: "Move a DEVELOPMENT product into QUALIFICATION so a dossier and machining trials can be opened against it."
