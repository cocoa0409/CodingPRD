    input: []
    output: DangerousDogCase
    side_effects: ["compute surcharge_cents; set Pet.is_dangerous=true; add surcharge to active licenses' final_fee_cents"]

  - method: POST
    path: "/dangerous-dog-cases/{id}/dismiss"
    description: "INVESTIGATING→DISMISSED"
    roles: [AnimalControlOfficer]
    code: 200
    input: []
    output: DangerousDogCase
    side_effects: []

  - method: POST
    path: "/dangerous-dog-cases/{id}/appeal"
    description: "DESIGNATED→APPEALED (owner-initiated)"
    roles: [Owner]
    code: 200
    input: []
    output: DangerousDogCase
    side_effects: []

  - method: POST
    path: "/dangerous-dog-cases/{id}/overturn"
    description: "APPEALED→OVERTURNED; compensating reversal of surcharge cascade"
    roles: [AnimalControlOfficer]
    code: 200
    input: []
    output: DangerousDogCase
    side_effects: ["clear Pet.is_dangerous if no other designation; subtract surcharge from licenses' final_fee_cents"]

  - method: POST
    path: "/dangerous-dog-cases/{id}/uphold"
    description: "APPEALED→DESIGNATED (appeal denied)"
    roles: [AnimalControlOfficer]
    code: 200
    input: []
    output: DangerousDogCase
    side_effects: []

  # ---- LostFoundReport ----
  - method: POST
    path: "/lost-found-reports"
    description: "File a lost or found report (OPEN)"
    roles: [Owner, AnimalControlOfficer, LicensingClerk]
    code: 201
    input: [report_type, species, zip_seen, reported_at, "pet_id?", "tag_serial_seen?"]
    output: LostFoundReport
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/lost-found-reports/{id}"
    description: "Get a lost/found report"
    roles: [LicensingClerk, Owner, AnimalControlOfficer]
    code: 200
    input: []
    output: LostFoundReport
    side_effects: []

  - method: GET
    path: "/lost-found-reports"
    description: "List lost/found reports with filters (also filtered-list FK reverse-reachability for matched_report_id and pet_id)"
    roles: [LicensingClerk, AnimalControlOfficer, Owner]
    code: 200
    input: ["report_type?", "status?", "species?", "pet_id?", "matched_report_id?", "limit?", "offset?"]
    output: LostFoundReport[]
    side_effects: []

  - method: POST
    path: "/lost-found-reports/{id}/match"
    description: "OPEN→MATCHED; selects best counterpart via lost_found_match"
    roles: [AnimalControlOfficer]
    code: 200
    input: []
    output: LostFoundReport
    side_effects: ["select counterpart, set mutual matched_report_id + match_score, counterpart→MATCHED"]

  - method: POST
    path: "/lost-found-reports/{id}/resolve"
    description: "MATCHED→RESOLVED; cascades to counterpart"
    roles: [AnimalControlOfficer]
    code: 200
    input: []
    output: LostFoundReport
    side_effects: ["counterpart→RESOLVED"]

  - method: POST
    path: "/lost-found-reports/{id}/unmatch"
    description: "MATCHED→OPEN; compensating reversal of the match"
    roles: [AnimalControlOfficer]
    code: 200
    input: []
    output: LostFoundReport
    side_effects: ["reset both reports' matched_report_id + match_score; counterpart→OPEN"]

  - method: POST
    path: "/lost-found-reports/{id}/close"
    description: "OPEN→CLOSED or RESOLVED→CLOSED"
    roles: [AnimalControlOfficer]
    code: 200
    input: []
    output: LostFoundReport
    side_effects: []

  # ---- AuditEvent ----
  - method: GET
    path: "/audit-events"
    description: "List audit events with filters"
    roles: [LicensingClerk, AnimalControlOfficer]
    code: 200
    input: ["subject_entity?", "subject_id?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Set the system clock to an absolute UTC instant (test-driving)"
    roles: [LicensingClerk, AnimalControlOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets current_utc used by all temporal checks"]

  - method: POST
    path: "/_clock/advance"
    description: "Advance the clock and re-evaluate auto-transitions (ACTIVE→GRACE→EXPIRED) for all licenses (test-driving)"
    roles: [LicensingClerk, AnimalControlOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance current_utc; fire ACTIVE→GRACE and GRACE→EXPIRED auto-transitions; stamp late penalties; mark owners delinquent"]

  - method: POST
    path: "/_bulk/seed-kennel-licenses"
    description: "Test-driving: synthesize `count` fully-ACTIVE kennel licenses (each with its own pet + RABIES proof) attached to the given kennel, advancing occupied_slots, so capacity/discount boundary states are reachable without replaying every lifecycle by hand"
    roles: [LicensingClerk]
    code: 200
    input: [kennel_id, owner_id, count, "is_altered?"]
    output: null
    side_effects: ["create `count` pets + RABIES records + KENNEL licenses, drive each to ACTIVE; recompute Kennel.occupied_slots"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for operation, or Owner does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, term_years not in {1,3}, slot_capacity < 1" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_LICENSE_KIND_MISMATCH, http: 422, condition: "INDIVIDUAL with kennel_id set, or KENNEL with kennel_id null/closed" }
  - { id: ERR_VACCINATION_MISMATCH, http: 422, condition: "Attached VaccinationRecord.pet_id does not match License.pet_id" }
  - { id: ERR_VACCINATION_EXPIRED, http: 422, condition: "Attached vaccination's expires_on is at/before current_utc" }
  - { id: ERR_RABIES_PROOF_REQUIRED, http: 422, condition: "Approval/renewal/attach lacks a valid unexpired RABIES proof" }
  - { id: ERR_DANGEROUS_DOG_HOLD, http: 422, condition: "Tag issuance blocked: pet has an open DESIGNATED dangerous-dog case" }
  - { id: ERR_ALREADY_DESIGNATED, http: 409, condition: "Pet already has a DESIGNATED dangerous-dog case" }
  - { id: ERR_KENNEL_FULL, http: 409, condition: "Kennel has no free slots (occupied_slots >= slot_capacity)" }
  - { id: ERR_LICENSE_PERIOD_OVERLAP, http: 409, condition: "Tag issuance would create a license validity interval [issued_on, expires_on) overlapping another ACTIVE/GRACE license of the same pet (half-open; adjacency at the boundary allowed)" }
  - { id: ERR_PENALTY_UNPAID, http: 402, condition: "Renewal from EXPIRED without full penalty settlement" }
  - { id: ERR_OWNER_DELINQUENT, http: 409, condition: "DELINQUENT owner attempted to submit a new application" }
  - { id: ERR_PET_NOT_ACTIVE, http: 409, condition: "Operation requires Pet.status == ACTIVE" }
  - { id: ERR_NO_MATCH_CANDIDATE, http: 409, condition: "No counterpart report meets MATCH_MIN_SCORE" }
  - { id: ERR_VALIDATION, http: 400, condition: "Pagination/query param out of range (limit/offset)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Owner
    description: "Pet owner; files applications, attaches vaccination proof, renews, marks pets deceased, files lost reports, appeals designations. Acts only on resources they own."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /licenses/{id}/submit"
      - "POST /licenses/{id}/attach-vaccination"
      - "POST /licenses/{id}/renew"
      - "POST /pets/{id}/mark-deceased"
      - "POST /dangerous-dog-cases/{id}/appeal"
    shared_operations:
      - "POST /owners (self-register)"
      - "POST /pets, POST /vaccination-records, POST /kennels, POST /licenses"
      - "POST /lost-found-reports"
      - "GET endpoints on owned resources"

  - name: LicensingClerk
    description: "Counter clerk; reviews applications, requests proof, approves/rejects, issues tags."
    identity: "opaque"
    exclusive_operations:
      - "POST /licenses/{id}/start-review"
      - "POST /licenses/{id}/request-vaccination-proof"
      - "POST /licenses/{id}/approve"
      - "POST /licenses/{id}/reject"
      - "POST /licenses/{id}/issue-tag"
    shared_operations:
      - "POST /owners, POST /pets, POST /vaccination-records, POST /kennels, POST /licenses"
      - "POST /lost-found-reports"
      - "GET endpoints, POST /_clock/set, POST /_clock/advance, GET /audit-events"

  - name: AnimalControlOfficer
    description: "Enforcement officer; manages dangerous-dog cases, lost/found matching, revocation, kennel suspension."
    identity: "opaque"
    exclusive_operations:
      - "POST /dangerous-dog-cases and its investigate/designate/dismiss/overturn/uphold transitions"
      - "POST /lost-found-reports/{id}/match, /resolve, /unmatch, /close"
      - "POST /licenses/{id}/revoke"
      - "POST /kennels/{id}/suspend"
    shared_operations:
      - "POST /lost-found-reports"
      - "GET endpoints, POST /_clock/set, POST /_clock/advance, GET /audit-events"
