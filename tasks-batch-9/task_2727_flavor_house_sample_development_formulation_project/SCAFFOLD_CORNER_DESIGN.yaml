      - name: brief_second_submit_rejected
        claim_type: idempotency
        grounds:
          - state_machines.CustomerBrief.DRAFT_to_SUBMITTED
          - validations[priority=40]
          - errors.ERR_BRIEF_STATE_INVALID
        distinguishing_aspect: "SUBMITTED is not in the from-set of the submit trigger, so a second submit returns ERR_BRIEF_STATE_INVALID (409) and leaves version at 2 — the transition is not idempotent."
        test_recipe:
          setup:
            - "Brief BRF-0001 already SUBMITTED at version 2."
          setup_api_calls:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_BRIEF_STATE_INVALID"
            - "CustomerBrief.${b1}.status == SUBMITTED"
            - "CustomerBrief.${b1}.version == 2"

