              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: wrong_provider_cannot_accept_offer_not_owner
        claim_type: peer_roles
        grounds: [roles, "validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A provider that is not offer.provider_id calling accept returns ERR_NOT_RESOURCE_OWNER (403); ownership is compared via offer.provider_id."
        test_recipe:
          setup: ["A call with an OFFERED offer to provider 1; provider 2 attempts to accept."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Prov One", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov1_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Prov Two", current_lat: 0.0, current_lng: 0.05, capabilities: ["TOW"], rating: 4.6 }
              as: DispatchOperator
              captures: { prov2_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, cv: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov1_id}", expected_service_call_version: "${cv}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER"

  # =========================================================================
  # Cross-cutting complexity layers — OCC
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_call_version_on_offer_dispatch_rejected
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.offer-dispatch-stale-call, "errors[ERR_STALE_CALL_VERSION]", "validations[priority=18]"]
        distinguishing_aspect: "Dispatching an offer with expected_service_call_version one behind the live version (after a prior offer bumped it) returns ERR_STALE_CALL_VERSION (412)."
        test_recipe:
          setup: ["A DISPATCHING call; a first offer is dispatched (bumping version) and declined; a second dispatch carries the pre-bump version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${v0}" }
              as: DispatchOperator
              captures: { offer1_id: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${offer1_id}/decline"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${v0}" }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_CALL_VERSION"

      - name: occ_correct_call_version_on_offer_dispatch_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.offer-dispatch-stale-call, entities.ServiceCall.fields.dispatch_attempts]
        distinguishing_aspect: "Dispatching an offer with the current expected_service_call_version succeeds (201), increments dispatch_attempts to 1, and bumps ServiceCall.version by 1 so the next stale dispatch would fail."
        test_recipe:
          setup: ["A fresh DISPATCHING call at version 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${v0}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
          assert:
            - "response status == 201"
            - "DispatchOffer.${offer_id}.status == OFFERED"
            - "ServiceCall.${call_id}.dispatch_attempts == 1"
            - "ServiceCall.${call_id}.version == 2"

