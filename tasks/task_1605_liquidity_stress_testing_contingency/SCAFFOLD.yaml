    description: "List BoardLimits (ewi_metric_id filter provides FK reverse-reachability)"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["subject?", "ewi_metric_id?", "limit?", "offset?"]
    output: BoardLimit[]
    side_effects: []

  - method: GET
    path: "/liquidity/board-limits/{id}"
    description: "Get a BoardLimit"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: []
    output: BoardLimit
    side_effects: []

  - method: GET
    path: "/liquidity/board-limits/{id}/breaches"
    description: "List breaches of a limit (FK reverse-reachability)"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["limit?", "offset?"]
    output: LimitBreach[]
    side_effects: []

  - method: GET
    path: "/liquidity/breaches/{id}"
    description: "Get a LimitBreach"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: []
    output: LimitBreach
    side_effects: []

  - method: POST
    path: "/liquidity/breaches/{id}/acknowledge"
    description: "Acknowledge an OPEN breach"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: LimitBreach
    side_effects: ["OPEN -> ACKNOWLEDGED; acknowledged_by_user_id set"]

  - method: POST
    path: "/liquidity/breaches/{id}/escalate"
    description: "Escalate an ACKNOWLEDGED breach"
    roles: [LiquidityCommittee]
    code: 200
    input: []
    output: LimitBreach
