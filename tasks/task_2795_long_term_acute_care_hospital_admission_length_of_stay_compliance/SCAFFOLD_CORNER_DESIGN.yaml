      - name: weaning_close_by_a_suspended_or_wrong_specialty_physician_is_rejected
        claim_type: guarded_transitions
        grounds:
          - validations.priority_19_ERR_PHYSICIAN_NOT_CREDENTIALED
          - entities.Physician.fields.credential_status
          - endpoints.POST_ltch_physicians_id_credential_status
        distinguishing_aspect: "A cross-entity guard on the acting identity, not on the subject: the same LIBERATED close is refused for a SUSPENDED pulmonologist and for an ACTIVE wound-care physician, then accepted for an ACTIVE pulmonologist - proving both halves of the credential predicate are evaluated."
