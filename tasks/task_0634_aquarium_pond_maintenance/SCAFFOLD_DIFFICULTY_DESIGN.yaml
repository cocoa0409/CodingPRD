              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/contracts/${contract_id}/suspend"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /aquatics/visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "SystemProfile.${system_id}.status == SUSPENDED (cascade from contract suspend)"
            - "trigger response error_id == ERR_INVALID_STATE (visit start blocked because system not ACTIVE)"

      - name: install_approve_requires_contract_active
        grounds:
          - state_machines.InstallProject.QUOTED_to_APPROVED
          - entities.ServiceContract.fields.status
        distinguishing_aspect: |
          InstallProject's QUOTED -> APPROVED transition depends on ServiceContract.status ==
          ACTIVE (the Install->Contract pair, distinct from the Visit->System pair). Approving
          an install whose contract is still DRAFT is rejected with ERR_CONTRACT_NOT_ACTIVE.
        test_recipe:
          setup:
