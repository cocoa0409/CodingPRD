  - rule_id: cross_entity_state_dependency
    instances:
      - name: eligibility_route_depends_on_agreement_draft_versus_active
        grounds:
          - calculations.apc_coverage_determination
          - state_machines.TransformativeAgreement.DRAFT_to_ACTIVE
          - state_machines.Article.DRAFT_to_SELF_FUNDED
          - state_machines.Article.SELF_FUNDED_to_FUNDED
          - entities.TransformativeAgreement.fields.status
        distinguishing_aspect: |
          The identical eligibility check on an unchanged Article yields route AUTHOR_PAYS
          with covered_amount_cents 0 while the agreement is DRAFT and route TA_FULL with
          covered_amount_cents 285000 once the agreement is ACTIVE — the Article's own fields
          are untouched between the two calls, so only the other entity's state decides.
