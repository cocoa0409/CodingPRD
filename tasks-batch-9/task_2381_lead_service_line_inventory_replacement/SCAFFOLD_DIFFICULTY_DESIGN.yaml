# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2381_lead_service_line_inventory_replacement
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Deleting this file leaves
# the scaffold's declared behavior identical.
#
# Fixed test-fixture conventions used throughout:
#   * The logical clock's startup default is 2026-08-01T00:00:00Z (§1.5
#     POST /lsl/_clock/set_current_utc). Chains that do not call the clock endpoint
#     run entirely at that instant.
#   * X-User-ID literals: "admin-1" (ProgramAdministrator), "analyst-1"
#     (InventoryAnalyst), "officer-1" (ComplianceOfficer), "csr-1"
#     (CustomerRepresentative), "contractor-1" (ReplacementContractor).
#     FieldTechnician always acts as the crew row id it owns (`as_user_id: "${crew}"`).
#   * Every numeric literal in `assert:` was produced by executing the relevant
#     §1.3 `formula:` against its `constants:`.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: certainty_score_records_basis_versus_field_basis_on_identical_evidence_set
        grounds:
          - calculations.service_line_certainty_score
          - calculations.governing_evidence_selection
          - calculations.service_line_classification
          - state_machines.ServiceLine.inventory_state.CLASSIFIED_PROVISIONAL_to_CLASSIFIED_VERIFIED
          - entities.ServiceLine.fields.certainty_basis
          - entities.ServiceLine.fields.certainty_score
        distinguishing_aspect: |
          This instance runs the ServiceLine inventory-scoring domain: one unchanged
          evidence set of four rows scores 16.00 under RECORDS_BASIS (POTHOLE and
          VISUAL_INSPECTION rows are filtered out of the governing pool entirely) and
          91.00 under FIELD_BASIS, and the variant is selected by the line's own
          inventory_state rather than by any request field.
        test_recipe:
          setup:
            - "One WaterSystem with no disadvantaged tracts, so equity_points and the equity floor are both 0.00 and the priority delta isolates the certainty bonus."
            - "One ServiceLine 101 Elm St holding three EvidenceItem rows: HISTORIC_RECORD/UTILITY/LEAD, PREDICTIVE_MODEL/CUSTOMER/UNKNOWN, POTHOLE/UTILITY/LEAD."
            - "The line sits at inventory_state = CLASSIFIED_PROVISIONAL with certainty_basis = RECORDS_BASIS, because field evidence exists on the UTILITY side only."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031001", system_name: "Riverbend Water District", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "PREDICTIVE_MODEL", side: "CUSTOMER", observed_material: "UNKNOWN", observed_at: "2026-06-02T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "POTHOLE", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-07-10T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "GET /lsl/service-lines/${l1}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { score_records: $.data.certainty_score, basis_records: $.data.certainty_basis, prio_records: $.data.replacement_priority_score, state_records: $.data.inventory_state }
          trigger:
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "VISUAL_INSPECTION", side: "CUSTOMER", observed_material: "COPPER", observed_at: "2026-07-11T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
          assert:
            - "${state_records} == CLASSIFIED_PROVISIONAL"
            - "${basis_records} == RECORDS_BASIS"
            - "${score_records} == 16.00"
            - "${prio_records} == 50.00"
            - "ServiceLine.${l1}.inventory_state == CLASSIFIED_VERIFIED"
            - "ServiceLine.${l1}.certainty_basis == FIELD_BASIS"
            - "ServiceLine.${l1}.certainty_score == 91.00"
            - "ServiceLine.${l1}.utility_side_material == LEAD"
            - "ServiceLine.${l1}.customer_side_material == COPPER"
            - "ServiceLine.${l1}.classification == LEAD"
            - "ServiceLine.${l1}.replacement_priority_score == 65.00"
            - "WaterSystem.${ws}.lead_count == 1"
            - "WaterSystem.${ws}.unknown_count == 0"
            - "WaterSystem.${ws}.total_service_line_count == 1"

      - name: funding_apportionment_waterfall_share_caps_versus_pro_rata_remainder
        grounds:
          - calculations.funding_apportionment
          - state_machines.ReplacementOrder.fulfillment_state.SCOPED_to_FUNDED
          - state_machines.ReplacementOrder.fulfillment_state.FUNDED_to_CANCELLED
          - entities.FundingSource.fields.max_share_pct
          - entities.ReplacementOrder.fields.funding_allocations
          - entities.ReplacementOrder.fields.funding_mode_applied
        distinguishing_aspect: |
          This instance runs the ReplacementOrder / FundingSource cost-accounting domain,
          not the ServiceLine scoring domain: the identical 100000-cent order against the
          identical {200000, 300000, 200000} ACTIVE pool produces TWO allocation rows
          (60000 / 40000, source 3 omitted) under WATERFALL and THREE rows
          (28572 / 42857 / 28571) under PRO_RATA, so the two variants differ in row
          cardinality as well as in per-source cents.
        test_recipe:
          setup:
            - "One WaterSystem with funding_mode = WATERFALL and a PUBLISHED inventory, so replacement orders may be opened and program_posture is RESTRICTED (not FROZEN)."
            - "Two LEAD ServiceLine rows at replacement_state = ELIGIBLE."
            - "Three ACTIVE FundingSource rows: priority_rank 1 / 200000 cents / max_share_pct 60.0, priority_rank 2 / 300000 cents / max_share_pct 40.0, priority_rank 3 / 200000 cents / max_share_pct 100.0."
            - "Order A on line 1 has already been funded under WATERFALL and then cancelled, restoring every source's available_cents to its authorized_cents; the water system has since been switched to PRO_RATA."
            - "Order B on line 2 sits at fulfillment_state = SCOPED with consent_state = GRANTED and scope = FULL, estimated_cost_cents = 100000."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031002", system_name: "Cedar Falls Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "205 Oak Ave", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l2: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l2}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/sampling-batches"
              payload: { water_system_id: "${ws}", stratum_code: "STR-A", stratum_line_count: 20 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { batch: $.data.id }
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 1.0, collected_at: "2026-07-11T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 2.0, collected_at: "2026-07-12T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 3.0, collected_at: "2026-07-13T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l2}", lead_ppb: 4.0, collected_at: "2026-07-14T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l2}", lead_ppb: 5.0, collected_at: "2026-07-15T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/water-systems/${ws}/advance-inventory-status"
              payload: { target_status: "VALIDATION_PENDING" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ws_v: $.data.version }
            - call: "POST /lsl/inventory-publications"
              payload: { water_system_id: "${ws}", basis: "RECORDS", reporting_period_label: "2026-H2", expected_water_system_version: "${ws_v}" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id }
            - call: "POST /lsl/inventory-publications/${pub}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/inventory-publications/${pub}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/funding-sources"
              payload: { water_system_id: "${ws}", source_kind: "STATE_REVOLVING_FUND", authorized_cents: 200000, priority_rank: 1, max_share_pct: 60.0, equity_required_pct: 0.0 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { s1: $.data.id }
            - call: "POST /lsl/funding-sources"
              payload: { water_system_id: "${ws}", source_kind: "FEDERAL_GRANT", authorized_cents: 300000, priority_rank: 2, max_share_pct: 40.0, equity_required_pct: 0.0 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { s2: $.data.id }
            - call: "POST /lsl/funding-sources"
              payload: { water_system_id: "${ws}", source_kind: "RATE_REVENUE", authorized_cents: 200000, priority_rank: 3, max_share_pct: 100.0, equity_required_pct: 0.0 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { s3: $.data.id }
            - call: "POST /lsl/replacement-orders"
              payload: { service_line_id: "${l1}", estimated_cost_cents: 100000, excavation_start_date: "2026-08-10", excavation_end_date: "2026-08-11" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { oa: $.data.id }
            - call: "POST /lsl/replacement-orders/${oa}/consent-request"
              payload: {}
              as: CustomerRepresentative
              as_user_id: "csr-1"
            - call: "POST /lsl/replacement-orders/${oa}/consent-response"
              payload: { outcome: "GRANTED" }
              as: CustomerRepresentative
              as_user_id: "csr-1"
            - call: "POST /lsl/replacement-orders/${oa}/funding-plan"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { oa_rows: $.data.funding_allocations, oa_mode: $.data.funding_mode_applied, oa_total: $.data.allocated_total_cents }
            - call: "POST /lsl/replacement-orders/${oa}/cancel"
              payload: { reason: "REBID_UNDER_PRO_RATA_POLICY" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "PATCH /lsl/water-systems/${ws}/funding-policy"
              payload: { funding_mode: "PRO_RATA" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /lsl/replacement-orders"
              payload: { service_line_id: "${l2}", estimated_cost_cents: 100000, excavation_start_date: "2026-08-12", excavation_end_date: "2026-08-13" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ob: $.data.id }
            - call: "POST /lsl/replacement-orders/${ob}/consent-request"
              payload: {}
              as: CustomerRepresentative
              as_user_id: "csr-1"
            - call: "POST /lsl/replacement-orders/${ob}/consent-response"
              payload: { outcome: "GRANTED" }
              as: CustomerRepresentative
              as_user_id: "csr-1"
          trigger:
            - call: "POST /lsl/replacement-orders/${ob}/funding-plan"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "${oa_mode} == WATERFALL"
            - "${oa_total} == 100000"
            - "${oa_rows} has exactly 2 entries"
            - "${oa_rows} entry with funding_source_id == ${s1} has allocated_cents == 60000 and priority_rank == 1"
            - "${oa_rows} entry with funding_source_id == ${s2} has allocated_cents == 40000 and priority_rank == 2"
            - "${oa_rows} contains no entry with funding_source_id == ${s3}"
            - "ReplacementOrder.${ob}.funding_mode_applied == PRO_RATA"
            - "ReplacementOrder.${ob}.funding_allocations has exactly 3 entries"
            - "ReplacementOrder.${ob}.funding_allocations entry with funding_source_id == ${s1} has allocated_cents == 28572"
            - "ReplacementOrder.${ob}.funding_allocations entry with funding_source_id == ${s2} has allocated_cents == 42857"
            - "ReplacementOrder.${ob}.funding_allocations entry with funding_source_id == ${s3} has allocated_cents == 28571"
            - "ReplacementOrder.${ob}.allocated_total_cents == 100000"
            - "ReplacementOrder.${ob}.fulfillment_state == FUNDED"
            - "FundingSource.${s1}.committed_cents == 28572 and FundingSource.${s1}.available_cents == 171428"
            - "FundingSource.${s2}.committed_cents == 42857 and FundingSource.${s2}.available_cents == 257143"
            - "FundingSource.${s3}.committed_cents == 28571 and FundingSource.${s3}.available_cents == 171429"
            - "ReplacementOrder.${oa}.fulfillment_state == CANCELLED and ReplacementOrder.${oa}.allocated_total_cents == 0"
            - "every ReplacementOrder.${oa}.funding_allocations[].state == RELEASED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: replacement_priority_cap_applies_before_barrier_penalty_and_equity_floor
        grounds:
          - calculations.replacement_priority_score
          - state_machines.ReplacementOrder.fulfillment_state.DRAFT_to_SCOPED
          - state_machines.ReplacementOrder.consent_state.REQUESTED_to_NO_RESPONSE
          - entities.ServiceLine.fields.consent_barrier_flag
          - entities.ServiceLine.fields.replacement_priority_score
          - entities.StreetProject.fields.paving_start_date
        distinguishing_aspect: |
          Mode (a): five independent inputs (classification, inventory_state,
          disadvantaged_status, street-project coordination tier, sensitive population)
          interact non-linearly through a tiered coordination lookup, a nested
          min/max clamp and two ordered post-adjustments. The pinned order —
          clamp to 100.00 FIRST, subtract the 8.00 barrier penalty SECOND, lift to the
          65.00 equity floor THIRD — yields 92.00; penalty-before-clamp yields 100.00
          and no clamp at all yields 112.00.
        test_recipe:
          setup:
            - "WaterSystem with disadvantaged_tract_codes = ['17031-8402'] and a PUBLISHED FIELD_VERIFIED inventory."
            - "StreetProject with paving_start_date = 2026-09-30, i.e. exactly 60 days after the default clock, landing in the <=90-day coordination tier worth 20.00 points."
            - "ServiceLine 101 Elm St in tract 17031-8402, serves_sensitive_population = true, linked to that street project, holding POTHOLE/UTILITY/LEAD and VISUAL_INSPECTION/CUSTOMER/COPPER field evidence, therefore inventory_state = CLASSIFIED_VERIFIED with certainty_basis = FIELD_BASIS, classification = LEAD and certainty_score = 91.00."
            - "Its raw priority is 50.00 + 15.00 + 25.00 + 20.00 + 10.00 = 120.00, clamped to 100.00 with no barrier yet."
            - "A ReplacementOrder on that line sits at fulfillment_state = DRAFT with consent_state = REQUESTED."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031003", system_name: "Harbor Point Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: ["17031-8402"], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/street-projects"
              payload: { water_system_id: "${ws}", project_name: "Elm St Resurfacing", moratorium_start_date: "2026-12-01", moratorium_end_date: "2026-12-31", paving_start_date: "2026-09-30", max_concurrent_excavations: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sp: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-8402", street_project_id: "${sp}", serves_sensitive_population: true }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "POTHOLE", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-07-10T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "VISUAL_INSPECTION", side: "CUSTOMER", observed_material: "COPPER", observed_at: "2026-07-11T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "GET /lsl/service-lines/${l1}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { cert_before: $.data.certainty_score, prio_before: $.data.replacement_priority_score, cls_before: $.data.classification }
            - call: "POST /lsl/sampling-batches"
              payload: { water_system_id: "${ws}", stratum_code: "STR-A", stratum_line_count: 20 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { batch: $.data.id }
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 1.0, collected_at: "2026-07-11T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 2.0, collected_at: "2026-07-12T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 3.0, collected_at: "2026-07-13T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 4.0, collected_at: "2026-07-14T09:00:00Z", sample_type: "FIFTH_LITER" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 5.0, collected_at: "2026-07-15T09:00:00Z", sample_type: "FIFTH_LITER" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/water-systems/${ws}/advance-inventory-status"
              payload: { target_status: "VALIDATION_PENDING" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ws_v: $.data.version }
            - call: "POST /lsl/inventory-publications"
              payload: { water_system_id: "${ws}", basis: "FIELD_VERIFIED", reporting_period_label: "2026-H2", expected_water_system_version: "${ws_v}" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id }
            - call: "POST /lsl/inventory-publications/${pub}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/inventory-publications/${pub}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/replacement-orders"
              payload: { service_line_id: "${l1}", street_project_id: "${sp}", estimated_cost_cents: 100000, excavation_start_date: "2026-08-10", excavation_end_date: "2026-08-11" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { o1: $.data.id }
            - call: "POST /lsl/replacement-orders/${o1}/consent-request"
              payload: {}
              as: CustomerRepresentative
              as_user_id: "csr-1"
          trigger:
            - call: "POST /lsl/replacement-orders/${o1}/consent-response"
              payload: { outcome: "NO_RESPONSE", barrier_reason: "NO_CONTACT" }
              as: CustomerRepresentative
              as_user_id: "csr-1"
          assert:
            - "${cls_before} == LEAD"
            - "${cert_before} == 91.00"
            - "${prio_before} == 100.00"
            - "ReplacementOrder.${o1}.fulfillment_state == SCOPED"
            - "ReplacementOrder.${o1}.consent_state == NO_RESPONSE"
            - "ReplacementOrder.${o1}.scope == PARTIAL"
            - "ReplacementOrder.${o1}.consent_barrier_reason == NO_CONTACT"
            - "ServiceLine.${l1}.consent_barrier_flag == true"
            - "ServiceLine.${l1}.replacement_priority_score == 92.00"
            - "ServiceLine.${l1}.replacement_priority_score != 100.00 (the value produced if the barrier penalty were applied before the 100.00 cap)"
            - "ServiceLine.${l1}.replacement_priority_score != 112.00 (the value produced if no cap were applied)"

      - name: compliance_credit_evaluation_order_resolves_multiplier_and_deferral_dependency
        grounds:
          - calculations.compliance_credit
          - calculations.inventory_progress_rate
          - calculations.post_replacement_flushing_guidance
          - state_machines.ReplacementOrder.fulfillment_state.IN_PROGRESS_to_COMPLETED
          - entities.ProgressReport.fields.deferral_allowance
          - entities.ProgressReport.fields.equity_multiplier
        distinguishing_aspect: |
          Mode (c): the circular-looking dependency is pinned in one direction only —
          equity_multiplier keys on disadvantaged_share_pct (50.00 -> TIER_B -> 1.10)
