        distinguishing_aspect: "Closing a sampling window with final_coupons_redeemed 1001 against 1000 issued fails 422 — redemption can never exceed issuance."
        test_recipe:
          setup: ["Product PROD-K-29 PILOT; SAMPLING_DEMO program PROG-K-29 (window 2026-09-01..2026-10-31, budget 50000, coupons_issued 1000) IN_WINDOW."]
