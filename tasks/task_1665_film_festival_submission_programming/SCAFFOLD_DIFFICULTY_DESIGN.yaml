  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: stacked_discount_rounding_order
        grounds:
          - calculations.submission_fee
          - entities.FeePayment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: student discount rounds against base FIRST
          and member discount rounds against the remainder SECOND, so a
          half-cent intermediate lands at member_discount_cents 413 and
          amount_cents 3712 — single-step stacked multiplication would yield
          3713; the pinned order decides the cent.
        test_recipe:
          setup:
            - "Edition 2027 INTAKE_OPEN; SHORT_FILM config fees 4000/5500/7000"
            - "Submitter with is_student=true and is_member=true; one SHORT_FILM submission in DRAFT"
            - "Logical clock 2026-08-20 (after early deadline 2026-08-15, before regular 2026-09-01) => REGULAR tier base 5500"
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000, screener_count_required: 2 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "Stu Member", email: "sm@example.com", country_of_residence: "US", is_student: true, is_member: true }, as: PUBLIC, captures: { subm: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Half Cent", runtime_minutes: 12, completion_date: "2025-06-01", premiere_status: NONE, production_company: "Penny Productions", format: PRORES_4444 }, as: FILMMAKER, as_user_id: "${subm}", captures: { film: $.data.id } }
            - { call: "POST /festival/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: FESTIVAL_ADMIN }
          trigger:
            - { call: "POST /festival/submissions/${film}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { amt: $.data.amount_cents, tier: $.data.tier_applied } }
          assert:
            - "FeePayment.tier_applied == REGULAR"
            - "FeePayment.base_fee_cents == 5500"
            - "FeePayment.student_discount_cents == 1375 (round_half_up(5500 * 0.25))"
            - "FeePayment.member_discount_cents == 413 (round_half_up((5500-1375) * 0.10) = round_half_up(412.5))"
            - "FeePayment.amount_cents == 3712 (5500 - 1375 - 413; NOT 3713)"

      - name: travel_stipend_multi_input_clamp
        grounds:
          - calculations.travel_stipend
          - entities.TravelPackage.fields.stipend_cents
          - entities.TravelPackage.fields.raw_stipend_cents
        distinguishing_aspect: |
          Mode (a) multi-input non-linear: stipend = min(200000 cap, base(origin)
          + 20000*max(0, min(delegate_count,2)-1)) then min(raw, budget
          remaining) at approve — international origin, 3 delegates, and a
          100000 budget interact so the raw 170000 clamps to 100000 while the
          delegate cap discards the third traveler.
        test_recipe:
          setup:
            - "Edition 2027 with travel_budget_cents 100000, hotel_nights_pool 10; SHORT_FILM pipeline"
            - "One short film fully confirmed: paid, ELIGIBLE, 2 scores (8,9 STAFF), SHORTS slate capacity 1 locked, invitation accepted (TravelPackage DRAFT created)"
