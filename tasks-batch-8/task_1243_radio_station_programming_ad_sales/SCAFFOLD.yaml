# =============================================================================
# Task 1243: Radio Station Programming & Ad Sales — scaffold seed tables
# =============================================================================

scenario: |
  1243. Radio Station Programming & Ad Sales (iHeart/Audacy market cluster): clock/format construction & music rotation categories, spot load limits & inventory pricing by daypart, trade/barter deal accounting, live-read & endorsement scheduling, remote broadcast & event sponsorship packages, log reconciliation & affidavit, ratings book impact on rate card, syndicated program clearance & barter avails

domain_name: radio-station-ad-sales
api_prefix: ""

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat          # peer entities with FK references; no URL nesting except one sub-resource ledger list
  state_machine_shape: cyclic    # make-good loops (Spot/LiveRead), EXHAUSTED<->ACTIVE (TradeAgreement), reopen loops (DailyLog)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # order creator != approver; reconciler != affidavit issuer
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: call_sign, type: string, source: input, description: "Station call letters, e.g. KAAA" }
      - { name: market_name, type: string, source: input, description: "Market/cluster name" }
      - { name: default_share_fallback, type: number, source: input, default: 1.0, description: "Audience share used by ratings_lookup when no PUBLISHED RatingsBook covers an air date" }

  - name: FormatClock
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: name, type: string, source: input, description: "Clock name" }
      - { name: applies_weekdays, type: array, source: input, description: "Enum array subset of [MON,TUE,WED,THU,FRI,SAT,SUN]; ACTIVE clocks of one station must have pairwise disjoint weekday sets", constraints: "non-empty; members of MON..SUN" }
      - { name: slots, type: array, source: input, description: "Array of {slot_type: MUSIC|SPOT_BREAK|LIVE_READ_WINDOW, hour: 0-23, capacity_units: int, capacity_seconds: int}; at most one slot per (slot_type, hour)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED" }

  - name: MusicCategory
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: code, type: string, source: input, description: "Rotation category code, e.g. POWER, MEDIUM, LIGHT; unique per station" }
      - { name: min_song_separation_min, type: integer, source: input, description: "Minimum minutes between two placements of the SAME song on one log (hour-granular: minute_of_day = hour*60)" }
      - { name: min_artist_separation_min, type: integer, source: input, description: "Minimum minutes between placements of any two songs sharing artist on one log" }
      - { name: max_spins_per_day, type: integer, source: input, description: "Maximum placements of the SAME song on one log date" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: Song
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: category_id, type: string, source: input, description: "FK -> MusicCategory.id; rotation category" }
      - { name: title, type: string, source: input, description: "Song title" }
      - { name: artist, type: string, source: input, description: "Artist name (separation rules key on exact string)" }
      - { name: duration_sec, type: integer, source: input, description: "Duration in seconds" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: RatingsBook
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: survey_name, type: string, source: input, description: "Ratings survey name" }
      - { name: period_start, type: string, source: input, description: "Survey period start date YYYY-MM-DD (inclusive)" }
      - { name: period_end, type: string, source: input, description: "Survey period end date YYYY-MM-DD (inclusive); must be >= period_start" }
      - { name: share_value, type: number, source: input, description: "Audience share (e.g. 5.5); > 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SUPERSEDED" }

  - name: RateCardEntry
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: daypart, type: enum, source: input, description: "MORNING_DRIVE | MIDDAY | AFTERNOON_DRIVE | EVENING | OVERNIGHT" }
      - { name: weekday_set, type: array, source: input, description: "Enum array subset of MON..SUN" }
      - { name: base_rate_cents, type: integer, source: input, description: "Base unit rate in cents; > 0" }
      - { name: min_rate_cents, type: integer, source: input, description: "Rate floor in cents; > 0 and <= base_rate_cents" }
      - { name: effective_from, type: string, source: input, description: "Effective window start date (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "Effective window end date (inclusive); >= effective_from" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: SyndicationClearance
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: program_name, type: string, source: input, description: "Syndicated program name" }
      - { name: provider, type: string, source: input, description: "Network/syndicator name" }
      - { name: weekday_set, type: array, source: input, description: "Enum array subset of MON..SUN" }
      - { name: start_hour, type: integer, source: input, description: "Window start hour 0-23 (half-open window start)" }
      - { name: duration_hours, type: integer, source: input, description: "Window length in hours; window is [start_hour, start_hour+duration_hours), may not wrap past 24" }
      - { name: barter_avails_per_hour, type: integer, source: input, description: "Network barter spots the station MUST air per covered hour; >= 1" }
      - { name: effective_from, type: string, source: input, description: "Effective window start date (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "Effective window end date (inclusive)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CLEARED | DISAFFIRMED" }

  - name: TradeAgreement
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: vendor_name, type: string, source: input, description: "Barter/trade vendor name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Total trade credit line in cents; > 0" }
      - { name: trade_ratio, type: number, source: input, description: "Trade-dollars charged per cash-equivalent cent: trade_value = round_half_up(cash_equivalent * trade_ratio); > 0" }
      - { name: consumed_cents, type: integer, source: computed, description: "sum(DEBIT) - sum(REVERSAL) over ledger entries" }
      - { name: adjustments_cents, type: integer, source: computed, description: "sum(ADJUSTMENT) over ledger entries (signed)" }
      - { name: available_cents, type: integer, source: computed, description: "credit_limit_cents - consumed_cents + adjustments_cents; invariant >= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXHAUSTED | SUSPENDED | CLOSED" }

  - name: TradeLedgerEntry
    parent: TradeAgreement
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> TradeAgreement.id; owning agreement" }
      - { name: entry_kind, type: enum, source: input, description: "DEBIT | REVERSAL | ADJUSTMENT; DEBIT/REVERSAL are system-generated from spot lifecycle, ADJUSTMENT is manual (BillingAdmin) or system at affidavit repricing" }
      - { name: amount_cents, type: integer, source: input, description: "DEBIT/REVERSAL: positive; ADJUSTMENT: signed (positive restores credit, negative consumes)" }
      - { name: spot_id, type: string, source: system, description: "FK -> Spot.id; set on system-generated DEBIT/REVERSAL entries, null on manual ADJUSTMENT", constraints: "nullable" }
      - { name: note, type: string, source: input, description: "Free-form note", constraints: "optional" }
      - { name: entry_seq, type: integer, source: system, description: "Per-agreement monotonically increasing sequence starting at 1" }

  - name: Order
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: advertiser_name, type: string, source: input, description: "Advertiser name" }
      - { name: order_kind, type: enum, source: input, description: "CASH | TRADE" }
      - { name: trade_agreement_id, type: string, source: input, description: "FK -> TradeAgreement.id; required iff order_kind == TRADE, forbidden when CASH", constraints: "nullable" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating SalesRep; approver must differ (segregation of duties)" }
      - { name: flight_start, type: string, source: input, description: "Flight start date (inclusive)" }
      - { name: flight_end, type: string, source: input, description: "Flight end date (inclusive); >= flight_start" }
      - { name: rate_tier, type: enum, source: input, description: "FIXED | PREEMPTIBLE; only FIXED orders may preempt" }
      - { name: reprice_policy, type: enum, source: input, description: "LOCKED_AT_BOOKING | REPRICED_AT_AFFIDAVIT" }
      - { name: daypart_targets, type: array, source: input, description: "Array of {daypart, units}; per-daypart ordered unit counts; non-empty; dayparts unique within the array" }
      - { name: units_scheduled, type: integer, source: computed, description: "Count of this order's spots in status SCHEDULED or AIRED (make-good successors excluded)" }
      - { name: units_aired, type: integer, source: computed, description: "Count of this order's spots in status AIRED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | ACTIVE | COMPLETED | CANCELLED" }

  - name: DailyLog
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: log_date, type: string, source: input, description: "Broadcast date YYYY-MM-DD; unique per station" }
      - { name: clock_id, type: string, source: system, description: "FK -> FormatClock.id; pinned at lock time, null until LOCKED", constraints: "nullable" }
      - { name: clock_version, type: integer, source: system, description: "FormatClock.version pinned at lock time (version-pinning on approval)", constraints: "nullable" }
      - { name: posture, type: enum, source: system, default: DRAFT, description: "DRAFT | LOCKED | AS_RUN | RECONCILING | RECONCILED | AFFIDAVIT_ISSUED | CLOSED" }
      - { name: reconciled_by_user_id, type: string, source: system, description: "X-User-ID of TrafficDirector who reconciled; affidavit issuer must differ", constraints: "nullable" }
      - { name: affidavit_issued_by_user_id, type: string, source: system, description: "X-User-ID of BillingAdmin who issued affidavit", constraints: "nullable" }
      - { name: unresolved_discrepancy_count, type: integer, source: computed, description: "Count of Discrepancy with log_id == this and status == UNRESOLVED" }
      - { name: affidavit_total_cents, type: integer, source: computed, description: "Net billing total computed at issue-affidavit; null until AFFIDAVIT_ISSUED", constraints: "nullable" }
      - { name: music_placements, type: array, source: system, description: "Array of {song_id, hour, placed_seq} appended by POST /logs/{id}/music-placements; placed_seq is per-log monotonically increasing from 1" }

  - name: Spot
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: system, description: "FK -> Station.id; copied from order at creation" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; buying order" }
      - { name: log_id, type: string, source: input, description: "FK -> DailyLog.id; target log" }
      - { name: event_id, type: string, source: input, description: "FK -> RemoteEvent.id; set when the spot fulfills a remote-event sponsorship package", constraints: "nullable" }
      - { name: air_date, type: string, source: system, description: "Copied from DailyLog.log_date at creation" }
      - { name: daypart, type: enum, source: input, description: "MORNING_DRIVE | MIDDAY | AFTERNOON_DRIVE | EVENING | OVERNIGHT; hour must belong to the daypart's hour set" }
      - { name: hour, type: integer, source: input, description: "Air hour 0-23" }
      - { name: duration_sec, type: integer, source: input, description: "15 | 30 | 60" }
      - { name: unit_rate_cents, type: integer, source: computed, description: "Rate computed at booking (or override); see spot_unit_rate" }
      - { name: billed_rate_cents, type: integer, source: computed, description: "Final billed rate: set at booking for LOCKED_AT_BOOKING; recomputed at affidavit for REPRICED_AT_AFFIDAVIT; null until then", constraints: "nullable" }
      - { name: cash_equivalent_cents, type: integer, source: computed, description: "TRADE orders only: the cash-card value of the spot (= unit_rate_cents at booking)", constraints: "nullable" }
      - { name: makeup_of_spot_id, type: string, source: system, description: "Set on successor spots created by reschedule; FK -> Spot.id", constraints: "nullable" }
      - { name: make_good_reason, type: enum, source: system, description: "PREEMPTED | MISSED; set when status == MAKE_GOOD_PENDING", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | AIRED | MAKE_GOOD_PENDING | RESOLVED | CANCELLED" }

  - name: BarterAvail
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: system, description: "FK -> Station.id; copied from clearance at creation" }
      - { name: clearance_id, type: string, source: input, description: "FK -> SyndicationClearance.id; governing clearance" }
      - { name: log_id, type: string, source: input, description: "FK -> DailyLog.id; target log" }
      - { name: air_date, type: string, source: system, description: "Copied from DailyLog.log_date at creation" }
      - { name: hour, type: integer, source: input, description: "Air hour 0-23; must lie inside clearance window" }
      - { name: duration_sec, type: integer, source: input, description: "15 | 30 | 60" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | AIRED | MISSED | CANCELLED" }

  - name: EndorsementContract
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: advertiser_name, type: string, source: input, description: "Advertiser buying the endorsement" }
      - { name: host_name, type: string, source: input, description: "On-air talent/host whose program carries the live reads" }
      - { name: program_weekdays, type: array, source: input, description: "Enum array subset of MON..SUN; weekdays the host's program airs" }
      - { name: program_start_hour, type: integer, source: input, description: "Program window start hour (half-open, 0-23)" }
      - { name: program_end_hour, type: integer, source: input, description: "Program window end hour (exclusive); > program_start_hour, <= 24" }
      - { name: reads_per_week, type: integer, source: input, description: "Promised live reads per week; >= 1" }
      - { name: start_date, type: string, source: input, description: "Contract window start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Contract window end (inclusive); >= start_date" }
      - { name: contracted_reads_total, type: integer, source: computed, description: "reads_per_week * floor((end_date - start_date + 1) / 7)" }
      - { name: reads_completed, type: integer, source: computed, description: "Count of this contract's LiveRead in status AIRED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | COMPLETED | BREACHED | CANCELLED" }

  - name: LiveRead
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: system, description: "FK -> Station.id; copied from contract at creation" }
      - { name: contract_id, type: string, source: input, description: "FK -> EndorsementContract.id; governing contract" }
      - { name: log_id, type: string, source: input, description: "FK -> DailyLog.id; target log" }
      - { name: air_date, type: string, source: system, description: "Copied from DailyLog.log_date at creation" }
      - { name: hour, type: integer, source: input, description: "Air hour 0-23; must satisfy contract program window" }
      - { name: duration_sec, type: integer, source: input, default: 60, description: "30 | 60" }
      - { name: makeup_of_live_read_id, type: string, source: system, description: "Set on successor live reads created by reschedule; FK -> LiveRead.id", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | AIRED | MAKE_GOOD_PENDING | RESOLVED | CANCELLED" }

  - name: Discrepancy
    parent: DailyLog
    common_fields: true
    fields:
      - { name: station_id, type: string, source: system, description: "FK -> Station.id; copied from log at creation" }
      - { name: log_id, type: string, source: system, description: "FK -> DailyLog.id; owning log" }
      - { name: spot_id, type: string, source: system, description: "FK -> Spot.id; set iff kind == MISSED_SPOT", constraints: "nullable" }
      - { name: live_read_id, type: string, source: system, description: "FK -> LiveRead.id; set iff kind == MISSED_READ", constraints: "nullable" }
      - { name: barter_avail_id, type: string, source: system, description: "FK -> BarterAvail.id; set for a MISSED scheduled avail; null for under-coverage (fewer avails aired than barter_avails_per_hour)", constraints: "nullable" }
      - { name: discrepancy_kind, type: enum, source: system, description: "MISSED_SPOT | MISSED_READ | UNFILLED_BARTER" }
      - { name: status, type: enum, source: system, default: UNRESOLVED, description: "UNRESOLVED | RESOLVED | WAIVED" }
      - { name: resolution_note, type: string, source: input, description: "Note set on resolve/waive", constraints: "optional" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID that resolved/waived; null while UNRESOLVED", constraints: "nullable" }

  - name: RemoteEvent
    parent: Station
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: event_name, type: string, source: input, description: "Remote broadcast event name" }
      - { name: sponsor_name, type: string, source: input, description: "Sponsor buying the package" }
      - { name: event_date, type: string, source: input, description: "Event broadcast date YYYY-MM-DD" }
      - { name: spot_units_promised, type: integer, source: input, description: "Promised sponsor-tagged spots on the event date's log; >= 1" }
      - { name: package_price_cents, type: integer, source: input, description: "Package price in cents; > 0" }
      - { name: spots_delivered, type: integer, source: computed, description: "Count of Spot with event_id == this, status == AIRED, on the log of event_date" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | CONFIRMED | DELIVERED | DEFAULTED | CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: FormatClock
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /clocks/{id}/activate"
        actor: ProgramDirector
        preconditions:
          - "No other ACTIVE FormatClock on the same station whose applies_weekdays intersects this clock's (weekday-set disjointness)"
        side_effects: ["increments FormatClock.version by 1"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /clocks/{id}/retire"
        actor: ProgramDirector
        preconditions: []
        side_effects: ["increments FormatClock.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /clocks/{id}/retire"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "increments FormatClock.version by 1"
          - "Already-LOCKED logs keep their pinned clock_id/clock_version (version-pinning); only future locks stop selecting this clock"

  - entity: MusicCategory
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /music-categories/{id}/retire"
        actor: ProgramDirector
        preconditions: []
        side_effects: ["Songs in the category are NOT cascaded; placement validation (ERR_CATEGORY_RETIRED) blocks new placements"]
        note: "No cascade by design — keeps ERR_CATEGORY_RETIRED reachable"

  - entity: Song
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /songs/{id}/retire"
        actor: ProgramDirector
        preconditions: []
        side_effects: []
        note: "Existing music_placements on logs are left intact; new placements blocked by ERR_SONG_NOT_ACTIVE"

  - entity: RatingsBook
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /ratings-books/{id}/publish"
        actor: SalesManager
        preconditions: ["period_end >= period_start"]
        side_effects:
          - "Every other PUBLISHED RatingsBook on the same station whose [period_start, period_end] intersects this book's period -> SUPERSEDED (cascade)"
          - "increments RatingsBook.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a newly published overlapping book supersedes it)"
        actor: system
        preconditions: []
        side_effects: ["increments RatingsBook.version by 1"]
        note: "Invariant after every publish: PUBLISHED books of one station have pairwise disjoint periods, so ratings_lookup sees at most one candidate per date"

  - entity: RateCardEntry
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /rate-card-entries/{id}/retire"
        actor: SalesManager
        preconditions: []
        side_effects: []
        note: "Already-booked spots keep their computed rates (rates are copied onto Spot at booking)"

  - entity: SyndicationClearance
    initial_state: PENDING
    terminal_states: [DISAFFIRMED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /clearances/{id}/clear"
        actor: ProgramDirector
        preconditions:
          - "No other CLEARED clearance on the same station with intersecting weekday_set AND overlapping half-open hour window [start_hour, start_hour+duration_hours) AND overlapping [effective_from, effective_to] date range (adjacency end==start is allowed)"
        side_effects: ["increments SyndicationClearance.version by 1"]
      - from: PENDING
        to: DISAFFIRMED
        trigger: "POST /clearances/{id}/disaffirm"
        actor: ProgramDirector
        preconditions: []
        side_effects: ["increments SyndicationClearance.version by 1"]
      - from: CLEARED
        to: DISAFFIRMED
        trigger: "POST /clearances/{id}/disaffirm"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "increments SyndicationClearance.version by 1"
          - "Every BarterAvail with clearance_id == this, status == SCHEDULED and air_date > current logical clock date -> CANCELLED (cascade)"
          - "Each such cancellation recomputes the owning DailyLog's spot-pool occupancy counters and bumps DailyLog.version"

  - entity: TradeAgreement
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (after a DEBIT or negative ADJUSTMENT makes available_cents == 0)"
        actor: system
        preconditions: []
        side_effects: ["increments TradeAgreement.version by 1"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (after a REVERSAL or positive ADJUSTMENT makes available_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["increments TradeAgreement.version by 1"]
        note: "Cyclic auto-transitions driven by trade_available_balance recomputation"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /trade-agreements/{id}/suspend"
        actor: BillingAdmin
        preconditions: []
        side_effects: ["increments TradeAgreement.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /trade-agreements/{id}/close"
        actor: BillingAdmin
        preconditions: ["No Spot whose order.trade_agreement_id == this is in status SCHEDULED"]
        side_effects: ["increments TradeAgreement.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /trade-agreements/{id}/close"
        actor: BillingAdmin
        preconditions: ["No Spot whose order.trade_agreement_id == this is in status SCHEDULED"]
        side_effects: ["increments TradeAgreement.version by 1"]

  - entity: Order
    initial_state: DRAFT
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /orders/{id}/submit"
        actor: SalesRep
        preconditions:
          - "Caller X-User-ID == created_by_user_id (ownership)"
          - "flight_end >= flight_start and daypart_targets non-empty"
          - "If TRADE: referenced TradeAgreement.status == ACTIVE"
        side_effects: ["increments Order.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /orders/{id}/approve"
        actor: SalesManager
        preconditions:
          - "Approver X-User-ID != created_by_user_id (segregation of duties)"
          - "If TRADE: referenced TradeAgreement.status == ACTIVE"
        side_effects: ["increments Order.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /orders/{id}/reject"
        actor: SalesManager
        preconditions: []
        side_effects: ["increments Order.version by 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /orders/{id}/activate"
        actor: SalesManager
        preconditions: ["flight_start <= current logical clock date <= flight_end"]
        side_effects: ["increments Order.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /orders/{id}/complete"
        actor: SalesManager
        preconditions:
          - "current logical clock date > flight_end"
          - "No Spot of this order in status SCHEDULED or MAKE_GOOD_PENDING"
        side_effects: ["increments Order.version by 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: "SalesRep (creator only) or SalesManager"
        preconditions: []
        side_effects: ["increments Order.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: "SalesRep (creator only) or SalesManager"
        preconditions: []
        side_effects:
          - "increments Order.version by 1"
          - "Every Spot of this order in status SCHEDULED -> CANCELLED (cascade)"
          - "Each such TRADE spot cancellation appends a TradeLedgerEntry REVERSAL equal to that spot's original DEBIT (cascade hop 2)"
          - "Each REVERSAL recomputes trade_available_balance; TradeAgreement EXHAUSTED -> ACTIVE if available_cents becomes > 0 (cascade hop 3)"
          - "Spots in MAKE_GOOD_PENDING -> CANCELLED (obligation voided with the order)"

  - entity: DailyLog
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /logs/{id}/lock"
        actor: TrafficDirector
        preconditions:
          - "expected_log_version == DailyLog.version (OCC)"
          - "clock_pin_selection finds an ACTIVE FormatClock covering weekday(log_date); else ERR_NO_ACTIVE_CLOCK"
        side_effects:
          - "clock_id and clock_version pinned from the selected clock"
          - "increments DailyLog.version by 1"
      - from: LOCKED
        to: AS_RUN
        trigger: "POST /logs/{id}/as-run-import"
        actor: TrafficDirector
        preconditions: ["Every id in aired_spot_ids/aired_live_read_ids/aired_barter_avail_ids belongs to this log (else ERR_NOT_FOUND)"]
        side_effects:
          - "Each Spot of this log in status SCHEDULED: id in aired_spot_ids -> AIRED; else -> MAKE_GOOD_PENDING with make_good_reason MISSED + Discrepancy(MISSED_SPOT, UNRESOLVED) created"
          - "Spots already AIRED that are omitted from a re-import after reopen -> MAKE_GOOD_PENDING (reason MISSED) + Discrepancy; spots listed again stay AIRED"
          - "Each TRADE spot transitioning to MAKE_GOOD_PENDING appends a REVERSAL ledger entry equal to its DEBIT (and agreement available_cents recomputes; EXHAUSTED -> ACTIVE if > 0)"
          - "Each LiveRead of this log in status SCHEDULED: id in aired_live_read_ids -> AIRED (contract reads_completed recomputed); else -> MAKE_GOOD_PENDING + Discrepancy(MISSED_READ)"
          - "Each BarterAvail of this log in status SCHEDULED: id in aired_barter_avail_ids -> AIRED; else -> MISSED + Discrepancy(UNFILLED_BARTER with barter_avail_id set)"
          - "Under-coverage sweep: for each SyndicationClearance CLEARED covering (weekday(log_date), hour) with effective range containing log_date, if count(avails AIRED at that hour) < barter_avails_per_hour -> one Discrepancy(UNFILLED_BARTER, barter_avail_id null) per (clearance, hour)"
          - "increments DailyLog.version by 1"
      - from: AS_RUN
        to: RECONCILING
        trigger: "POST /logs/{id}/begin-reconciliation"
        actor: TrafficDirector
        preconditions: []
        side_effects: ["increments DailyLog.version by 1"]
      - from: RECONCILING
        to: LOCKED
        trigger: "POST /logs/{id}/reopen"
        actor: TrafficDirector
        preconditions: []
        side_effects:
          - "increments DailyLog.version by 1"
          - "Spots/LiveReads in MAKE_GOOD_PENDING and existing Discrepancies persist (obligations are not erased); new bookings and edits become possible again; a later as-run-import re-evaluates spots still in SCHEDULED or AIRED"
      - from: RECONCILING
        to: RECONCILED
        trigger: "POST /logs/{id}/reconcile"
        actor: TrafficDirector
        preconditions: ["unresolved_discrepancy_count == 0 (exact zero; 1 or more blocks)"]
        side_effects:
          - "reconciled_by_user_id set to caller X-User-ID"
          - "increments DailyLog.version by 1"
      - from: RECONCILED
        to: RECONCILING
        trigger: "POST /logs/{id}/reopen"
        actor: TrafficDirector
        preconditions: []
        side_effects: ["reconciled_by_user_id cleared to null", "increments DailyLog.version by 1"]
        note: "Revert branch of the reconciliation loop"
      - from: RECONCILED
        to: AFFIDAVIT_ISSUED
        trigger: "POST /logs/{id}/issue-affidavit"
        actor: BillingAdmin
        preconditions: ["Issuer X-User-ID != reconciled_by_user_id (segregation of duties)"]
        side_effects:
          - "For every AIRED spot of an order with reprice_policy REPRICED_AT_AFFIDAVIT: billed_rate_cents recomputed via spot_unit_rate with current ratings/demand; LOCKED spots keep booked billed_rate_cents"
          - "For each repriced TRADE spot: system appends ADJUSTMENT ledger entry = original DEBIT - new trade_value (signed); available_cents recomputed (must remain >= 0 else affidavit fails with ERR_TRADE_CREDIT_EXCEEDED)"
          - "affidavit_total_cents computed per affidavit_billing_total (per-spot rounding, then sum)"
          - "affidavit_issued_by_user_id set"
          - "increments DailyLog.version by 1"
      - from: AFFIDAVIT_ISSUED
        to: CLOSED
        trigger: "POST /logs/{id}/close"
        actor: BillingAdmin
        preconditions: []
        side_effects: ["increments DailyLog.version by 1"]

  - entity: Spot
    initial_state: SCHEDULED
    terminal_states: [AIRED, RESOLVED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /spots (creation)"
        actor: "SalesRep or TrafficDirector"
        preconditions:
          - "OCC: expected_order_version == Order.version"
          - "Order.status == ACTIVE; log posture in {DRAFT, LOCKED}; hour belongs to daypart; air_date within flight"
          - "Per-(order, daypart) scheduled count < daypart_targets units"
          - "Hour spot-pool capacity (possibly after preemption cascade when allow_preemption)"
          - "TRADE: agreement ACTIVE and projected DEBIT <= available_cents"
        side_effects:
          - "unit_rate_cents computed via spot_unit_rate (demand tier evaluated pre-booking); billed_rate_cents set iff LOCKED_AT_BOOKING; cash_equivalent_cents set iff TRADE"
          - "TRADE: append DEBIT ledger entry = trade_value (round_half_up(cash_equivalent_cents * trade_ratio)); recompute balance; agreement ACTIVE -> EXHAUSTED if available == 0"
          - "Order.units_scheduled recomputed; increments Order.version by 1 (OCC write)"
          - "Preemption cascade when hour full and allow_preemption: selected PREEMPTIBLE spots -> MAKE_GOOD_PENDING (reason PREEMPTED), see preemption_selector"
      - from: SCHEDULED
        to: MAKE_GOOD_PENDING
        trigger: "system (preemption by a FIXED booking) or POST /logs/{id}/as-run-import (not aired)"
        actor: system
        preconditions: []
        side_effects:
          - "make_good_reason set: PREEMPTED (system) or MISSED (import)"
          - "MISSED only: Discrepancy(MISSED_SPOT, UNRESOLVED) created on the log"
          - "TRADE: append REVERSAL ledger entry equal to the original DEBIT; balance recomputed (EXHAUSTED -> ACTIVE if > 0)"
      - from: MAKE_GOOD_PENDING
        to: RESOLVED
        trigger: "POST /spots/{id}/reschedule (TrafficDirector) or POST /spots/{id}/issue-credit (BillingAdmin)"
        actor: "TrafficDirector or BillingAdmin"
        preconditions:
          - "reschedule: target log posture in {DRAFT, LOCKED}, target hour belongs to target daypart, target air_date within order flight, target hour capacity fits (no preemption allowed for make-goods)"
        side_effects:
          - "reschedule: creates successor Spot (status SCHEDULED, makeup_of_spot_id = this id, fresh rate via spot_unit_rate, TRADE -> new DEBIT); successor does NOT count against daypart_targets"
          - "issue-credit: closes the obligation with no successor (no billing occurred for non-AIRED spots; TRADE reversal already posted at MAKE_GOOD_PENDING)"
          - "Linked Discrepancy (MISSED_SPOT) auto-transitions UNRESOLVED -> RESOLVED (cascade)"
      - from: SCHEDULED
        to: AIRED
        trigger: "POST /logs/{id}/as-run-import"
        actor: TrafficDirector
        preconditions: []
        side_effects: ["Order.units_aired/units_scheduled recomputed"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /spots/{id}/cancel or order-cancel cascade"
        actor: TrafficDirector
        preconditions: ["log posture in {DRAFT, LOCKED}"]
        side_effects: ["TRADE: append REVERSAL equal to DEBIT; balance recomputed", "Order.units_scheduled recomputed"]

  - entity: BarterAvail
    initial_state: SCHEDULED
    terminal_states: [AIRED, MISSED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /barter-avails (creation)"
        actor: TrafficDirector
        preconditions:
          - "OCC: expected_clearance_version == SyndicationClearance.version"
          - "Clearance.status == CLEARED"
          - "weekday(air_date) in clearance.weekday_set AND start_hour <= hour < start_hour + duration_hours AND effective_from <= air_date <= effective_to"
          - "Log posture in {DRAFT, LOCKED}; hour SPOT_BREAK pool capacity fits"
        side_effects:
          - "Consumes sellable spot-pool inventory of the hour"
          - "increments SyndicationClearance.version by 1 (OCC write)"
      - from: SCHEDULED
        to: AIRED
        trigger: "POST /logs/{id}/as-run-import"
        actor: TrafficDirector
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /logs/{id}/as-run-import (not listed)"
        actor: TrafficDirector
        preconditions: []
        side_effects: ["Discrepancy(UNFILLED_BARTER, barter_avail_id set) created"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (clearance disaffirm cascade; only when air_date > current clock date)"
        actor: system
        preconditions: []
        side_effects: ["Owning DailyLog occupancy counters recomputed; DailyLog.version bumped"]

  - entity: EndorsementContract
    initial_state: DRAFT
    terminal_states: [COMPLETED, BREACHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /endorsement-contracts/{id}/activate"
        actor: SalesManager
        preconditions: ["start_date <= current logical clock date <= end_date (else ERR_FLIGHT_WINDOW_INVALID)"]
        side_effects: ["increments EndorsementContract.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /endorsement-contracts/{id}/close"
        actor: SalesManager
        preconditions: ["current clock date > end_date", "reads_completed >= contracted_reads_total"]
        side_effects: ["increments EndorsementContract.version by 1"]
      - from: ACTIVE
        to: BREACHED
        trigger: "POST /endorsement-contracts/{id}/close"
        actor: SalesManager
        preconditions: ["current clock date > end_date", "reads_completed < contracted_reads_total"]
        side_effects: ["increments EndorsementContract.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /endorsement-contracts/{id}/cancel"
        actor: "SalesRep or SalesManager"
        preconditions: []
        side_effects: ["increments EndorsementContract.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /endorsement-contracts/{id}/cancel"
        actor: "SalesRep or SalesManager"
        preconditions: []
        side_effects:
          - "Every LiveRead of this contract in status SCHEDULED -> CANCELLED (cascade)"
          - "increments EndorsementContract.version by 1"

  - entity: LiveRead
    initial_state: SCHEDULED
    terminal_states: [AIRED, RESOLVED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /live-reads (creation)"
        actor: TrafficDirector
        preconditions:
          - "Contract.status == ACTIVE"
          - "weekday(air_date) in contract.program_weekdays AND program_start_hour <= hour < program_end_hour AND start_date <= air_date <= end_date"
          - "Log posture in {DRAFT, LOCKED}; hour LIVE_READ_WINDOW pool capacity fits"
        side_effects: ["Consumes LIVE_READ_WINDOW pool unit of the hour"]
      - from: SCHEDULED
        to: AIRED
        trigger: "POST /logs/{id}/as-run-import"
        actor: TrafficDirector
        preconditions: []
        side_effects: ["Contract.reads_completed recomputed"]
      - from: SCHEDULED
        to: MAKE_GOOD_PENDING
        trigger: "POST /logs/{id}/as-run-import (not listed)"
        actor: TrafficDirector
        preconditions: []
        side_effects: ["Discrepancy(MISSED_READ, UNRESOLVED) created"]
      - from: MAKE_GOOD_PENDING
        to: RESOLVED
        trigger: "POST /live-reads/{id}/reschedule (TrafficDirector) or POST /live-reads/{id}/issue-credit (BillingAdmin)"
        actor: "TrafficDirector or BillingAdmin"
        preconditions: ["reschedule: target log posture in {DRAFT, LOCKED} and contract window satisfied for target hour/date"]
        side_effects:
          - "reschedule: creates successor LiveRead (SCHEDULED, makeup_of_live_read_id = this id)"
          - "Linked Discrepancy (MISSED_READ) auto-transitions UNRESOLVED -> RESOLVED (cascade)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (contract cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Discrepancy
    initial_state: UNRESOLVED
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: UNRESOLVED
        to: RESOLVED
        trigger: "system (linked Spot/LiveRead resolved) or POST /discrepancies/{id}/resolve (TrafficDirector, UNFILLED_BARTER only)"
        actor: "system or TrafficDirector"
        preconditions:
          - "Explicit resolve allowed only when discrepancy_kind == UNFILLED_BARTER (MISSED_SPOT/MISSED_READ resolve via their obligation)"
        side_effects:
          - "resolved_by_user_id set (system for cascades)"
          - "Owning DailyLog.unresolved_discrepancy_count recomputed"
      - from: UNRESOLVED
        to: WAIVED
        trigger: "POST /discrepancies/{id}/waive"
        actor: BillingAdmin
        preconditions: ["discrepancy_kind == UNFILLED_BARTER (else ERR_DISCREPANCY_NOT_WAIVABLE)"]
        side_effects: ["resolved_by_user_id set", "Owning DailyLog.unresolved_discrepancy_count recomputed"]

  - entity: RemoteEvent
    initial_state: PLANNED
    terminal_states: [DELIVERED, DEFAULTED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /remote-events/{id}/confirm"
        actor: SalesManager
        preconditions: ["event_date >= current logical clock date"]
        side_effects: ["increments RemoteEvent.version by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /remote-events/{id}/cancel"
        actor: SalesManager
        preconditions: []
        side_effects: ["increments RemoteEvent.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /remote-events/{id}/cancel"
        actor: SalesManager
        preconditions: []
        side_effects: ["Booked spots tagged with event_id are NOT cancelled (sponsor spots already sold stand)"]
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /remote-events/{id}/settle"
        actor: SalesManager
        preconditions:
          - "The DailyLog for (station_id, event_date) exists and posture in {AFFIDAVIT_ISSUED, CLOSED} (cross-entity gate)"
          - "spots_delivered >= spot_units_promised (boundary: equal delivers)"
        side_effects: ["increments RemoteEvent.version by 1"]
      - from: CONFIRMED
        to: DEFAULTED
        trigger: "POST /remote-events/{id}/settle"
        actor: SalesManager
        preconditions:
          - "The DailyLog for (station_id, event_date) exists and posture in {AFFIDAVIT_ISSUED, CLOSED}"
          - "spots_delivered < spot_units_promised"
        side_effects: ["increments RemoteEvent.version by 1"]

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: spot-book-stale-order
    parent_entity: Order
    write_endpoint: "POST /spots"
    occ_field: "expected_order_version"
    description: |
      Booking a Spot against an Order whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just booked or cancelled a spot on the same order (mutating
      units_scheduled and bumping Order.version) and the current writer's view
      of the order's remaining inventory is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: log-lock-stale-log
    parent_entity: DailyLog
    write_endpoint: "POST /logs/{id}/lock"
    occ_field: "expected_log_version"
    description: |
      Locking a DailyLog whose version has advanced since the client last
      observed it is rejected. The version captures any prior mutation of the
      log (e.g. music placements appended), so a stale lock attempt would pin
      a clock against a log state the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: barter-schedule-stale-clearance
    parent_entity: SyndicationClearance
    write_endpoint: "POST /barter-avails"
    occ_field: "expected_clearance_version"
    description: |
      Scheduling a BarterAvail against a SyndicationClearance whose version has
      advanced since the client last observed it is rejected. Each scheduled
      avail bumps the clearance version, so a stale writer is scheduling
      against an avail-usage view that no longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: spot_unit_rate
    trigger: "Spot booking (POST /spots), make-good reschedule pricing, affidavit repricing for REPRICED_AT_AFFIDAVIT orders"
    algorithm: tiered_pricing
    formula: |
      Inputs: RateCardEntry R (from rate_card_lookup), share s (from ratings_lookup), air_date d, log L, daypart D.
      1. ratings_multiplier m_r:  s < 2.0 -> 0.80;  2.0 <= s < 4.0 -> 1.00;  4.0 <= s < 6.0 -> 1.25;  s >= 6.0 -> 1.50.
      2. dow_factor m_d:  weekday(d) in {SAT, SUN} -> 0.85;  otherwise -> 1.00.
      3. demand_multiplier m_u: let u = scheduled_units(L, D) / capacity_units(L, D) evaluated BEFORE this booking
         (scheduled_units counts Spot+BarterAvail in status SCHEDULED or AIRED in hours of D on L; capacity from pinned clock SPOT_BREAK slots):
         u < 0.70 -> 1.00;  0.70 <= u < 0.85 -> 1.15;  u >= 0.85 -> 1.30.  (Boundary: exactly 0.70 -> 1.15; exactly 0.85 -> 1.30.)
      4. raw = R.base_rate_cents * m_r * m_d * m_u
      5. unit_rate_cents = max(R.min_rate_cents, round_half_up(raw))   (integer cents)
    input_set: "Spot being priced; ACTIVE RateCardEntry matching (station, daypart, weekday, effective window); PUBLISHED RatingsBook covering air_date or station fallback share; pinned clock slots of the target log"
    constants:
      RATINGS_TIERS: "[[2.0, 0.80], [4.0, 1.00], [6.0, 1.25], [Infinity, 1.50]] interpreted as lower bounds: s>=6.0 -> 1.50 etc."
      DOW_FACTOR_WEEKEND: 0.85
      DEMAND_TIERS: "u < 0.70 -> 1.00; [0.70, 0.85) -> 1.15; >= 0.85 -> 1.30"
    precision: "integer cents, round_half_up applied once to the final product"
    variants:
      - name: LOCKED_AT_BOOKING
        when: "order.reprice_policy == LOCKED_AT_BOOKING"
        difference: "billed_rate_cents is pinned to unit_rate_cents at booking and never recomputed"
      - name: REPRICED_AT_AFFIDAVIT
        when: "order.reprice_policy == REPRICED_AT_AFFIDAVIT"
        difference: "billed_rate_cents is null at booking and recomputed at issue-affidavit with the THEN-current PUBLISHED ratings book and THEN-current demand utilization; mid-flight ratings changes produce a different billed rate for identical booking inputs"

  - name: trade_valuation
    trigger: "TRADE spot booking (DEBIT) and reporting"
    algorithm: aggregation
    formula: |
      For a TRADE spot with unit_rate_cents = v and agreement.trade_ratio = r:
        cash_equivalent_cents = v                            (what a CASH buyer would pay)
        trade_value_cents     = round_half_up(v * r)         (ledger DEBIT amount)
      The two valuations diverge whenever r != 1.0.
    input_set: "Spot being booked; its order's TradeAgreement"
    precision: "integer cents, round_half_up"
    variants:
      - name: cash_equivalent_view
        when: "rate-card / affidavit reporting"
        difference: "values the spot at the card rate v"
      - name: trade_value_view
        when: "trade ledger accounting"
        difference: "values the spot at round_half_up(v * trade_ratio); same spot, different number"

  - name: trade_available_balance
    trigger: "after every TradeLedgerEntry append (DEBIT, REVERSAL, ADJUSTMENT)"
    algorithm: chronological
    formula: |
      Replay the agreement's ledger in entry_seq order:
        consumed_cents    = sum(amount_cents of DEBIT) - sum(amount_cents of REVERSAL)
        adjustments_cents = sum(amount_cents of ADJUSTMENT)          (signed)
        available_cents   = credit_limit_cents - consumed_cents + adjustments_cents
      Post-condition invariant: available_cents >= 0 (any write that would make it negative is rejected with ERR_TRADE_CREDIT_EXCEEDED).
      Auto-transitions: available == 0 and status == ACTIVE -> EXHAUSTED; available > 0 and status == EXHAUSTED -> ACTIVE.
    input_set: "All TradeLedgerEntry rows of the agreement, ordered by entry_seq ASC (append-only, no reordering)"
    precision: "integer cents"

  - name: affidavit_billing_total
    trigger: "POST /logs/{id}/issue-affidavit"
    algorithm: aggregation
    formula: |
      For each order O with >= 1 AIRED spot on this log:
        order_net_cents(O) = sum over AIRED spots s of O on this log of round_half_up(s.billed_rate_cents * (1 - AGENCY_COMMISSION_PCT))
      affidavit_total_cents = sum over those orders of order_net_cents(O)
      PINNED ROUNDING ORDER: round per spot line FIRST, then sum. (The alternative sum-then-round
      is a different, forbidden variant: it can differ by cents, e.g. two spots billed 1003 ->
      per-line 853 + 853 = 1706, sum-then-round would give round(2006 * 0.85) = 1705.)
    input_set: "All Spots on this log in status AIRED (MISSED/MAKE_GOOD_PENDING/CANCELLED/RESOLVED excluded); billed_rate_cents after any repricing"
    constants:
      AGENCY_COMMISSION_PCT: 0.15
    precision: "integer cents, round_half_up per spot line, then integer sum"

  - name: hour_spot_capacity
    trigger: "Spot/BarterAvail creation, preemption evaluation, LiveRead creation (LIVE_READ_WINDOW pool)"
    algorithm: threshold
    formula: |
      DAYPART_HOURS: MORNING_DRIVE={5,6,7,8}, MIDDAY={9,10,11,12,13}, AFTERNOON_DRIVE={15,16,17,18}, EVENING={19,20,21}, OVERNIGHT={0,1,2,3,4}.
      SPOT_BREAK pool for (log L, hour h): cap_units = sum(capacity_units), cap_seconds = sum(capacity_seconds) over SPOT_BREAK slots of L's pinned clock at hour h.
      occupied = count + summed duration_sec of Spot (status SCHEDULED|AIRED) and BarterAvail (status SCHEDULED|AIRED) at (L, h).
      A new unit of u=1, seconds=s fits iff occupied_units + 1 <= cap_units AND occupied_seconds + s <= cap_seconds
      (boundary: exactly reaching cap is allowed; exceeding by 1 rejects with ERR_HOUR_CAPACITY_EXCEEDED).
      LIVE_READ_WINDOW pool: same shape over LIVE_READ_WINDOW slots, counting LiveRead (SCHEDULED|AIRED); units only.
    input_set: "DailyLog pinned clock slots; Spots/BarterAvails/LiveReads of the log in holding statuses"
    constants:
      DAYPART_HOURS: "MORNING_DRIVE=[5,6,7,8]; MIDDAY=[9,10,11,12,13]; AFTERNOON_DRIVE=[15,16,17,18]; EVENING=[19,20,21]; OVERNIGHT=[0,1,2,3,4]"
    precision: "integer units and seconds"

  - name: spin_compliance
    trigger: "POST /logs/{id}/music-placements"
    algorithm: chronological
    formula: |
      Placements on one log are compared at hour granularity: minute_of_day = hour * 60.
      For a candidate placement of song S (category C) at hour h:
        1. song separation: for every existing placement of S at hour h2: abs(h*60 - h2*60) >= C.min_song_separation_min, else ERR_SPIN_SEPARATION_VIOLATION
        2. artist separation: for every existing placement of any song with artist == S.artist at hour h2: abs(h*60 - h2*60) >= C.min_artist_separation_min, else ERR_ARTIST_SEPARATION_VIOLATION
        3. spin cap: count(existing placements of S on this log) + 1 <= C.max_spins_per_day, else ERR_CATEGORY_SPIN_CAP_EXCEEDED
      Checks run in the order 1, 2, 3 (song separation before artist separation before cap).
    input_set: "music_placements of the target log only (never across logs); songs in any status are blocked earlier by ERR_SONG_NOT_ACTIVE / ERR_CATEGORY_RETIRED"
    precision: "integer minutes"

  - name: ratings_lookup
    trigger: "inside spot_unit_rate"
    algorithm: threshold
    formula: |
      Eligibility: RatingsBook of the station with status == PUBLISHED AND period_start <= air_date <= period_end (both inclusive).
      Uniqueness: supersede-on-overlap at publish keeps the PUBLISHED set pairwise disjoint, so at most one candidate exists; no tie-break is needed (a tie is impossible by invariant).
      Fallback: if no candidate exists, use Station.default_share_fallback as s.
    input_set: "RatingsBooks of the station"
    precision: "share as decimal"

  - name: clock_pin_selection
    trigger: "POST /logs/{id}/lock"
    algorithm: constraint_propagation
    formula: |
      Eligibility: FormatClock with station_id == log.station_id AND status == ACTIVE AND weekday(log.log_date) in applies_weekdays.
      Uniqueness: activation-time weekday-disjointness makes at most one candidate possible; no tie-break needed.
      Fallback: empty candidate set -> ERR_NO_ACTIVE_CLOCK (lock rejected).
      On success: pin clock_id and clock_version onto the log (version-pinning on approval: later clock edits/retirement do NOT move the pin).
    input_set: "FormatClocks of the station"
    precision: "n/a"

  - name: preemption_selector
    trigger: "POST /spots with allow_preemption == true when the hour's SPOT_BREAK pool is full"
    algorithm: waterfall_allocation
    formula: |
      Eligibility (victim pool): Spots at the same (log, hour) with status == SCHEDULED whose order.rate_tier == PREEMPTIBLE.
      Ranking: unit_rate_cents ASC; tie-break: created_at ASC (earliest created first). id is NEVER used.
      Waterfall: preempt victims in ranking order, stopping as soon as the new unit fits BOTH units and seconds; preempt exactly the minimum prefix needed.
      Empty/insufficient pool fallback: if preempting the entire pool still does not free enough capacity -> ERR_HOUR_CAPACITY_EXCEEDED (no partial preemption is committed).
      Each victim -> MAKE_GOOD_PENDING with make_good_reason PREEMPTED (TRADE victims also append a REVERSAL ledger entry, which may flip the agreement EXHAUSTED -> ACTIVE).
    input_set: "Spots of the log-hour"
    precision: "integer cents"

  - name: make_good_conservation
    trigger: "invariant evaluated after every spot/live-read transition"
    algorithm: constraint_propagation
    formula: |
      For Spot:  count(status == MAKE_GOOD_PENDING) + count(status == RESOLVED)
                 == count(make_good_reason == PREEMPTED) + count(make_good_reason == MISSED)
      i.e. every preemption/miss creates exactly one obligation and every obligation closes exactly once (reschedule or credit). No drift is permitted.
      Same shape for LiveRead with reason MISSED only.
    input_set: "All Spots / LiveReads"
    precision: "integer counts"

  - name: endorsement_contracted_total
    trigger: "EndorsementContract creation"
    algorithm: aggregation
    formula: |
      contracted_reads_total = reads_per_week * floor((end_date - start_date + 1) / 7)
      (whole weeks only; a partial trailing week does not add reads)
    input_set: "Contract date window and reads_per_week"
    precision: "integer"

  - name: event_delivery_evaluation
    trigger: "POST /remote-events/{id}/settle"
    algorithm: threshold
    formula: |
      spots_delivered = count of Spot with event_id == this, status == AIRED, air_date == event_date
      DELIVERED iff spots_delivered >= spot_units_promised (boundary: equality delivers); otherwise DEFAULTED.
    input_set: "Spots tagged to the event on the event date's log"
    precision: "integer counts"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: existence
    check: "Request body well-formed: required fields present, types correct, enum members valid, date ranges coherent (period_end >= period_start, flight_end >= flight_start, effective_to >= effective_from, end_hour > start_hour), numeric ranges valid"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 2.1
    category: auth
    check: "Ownership: POST /orders/{id}/submit and SalesRep-initiated POST /orders/{id}/cancel require X-User-ID == order.created_by_user_id"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "POST /orders/{id}/submit, POST /orders/{id}/cancel"

  - priority: 2.2
    category: auth
    check: "Segregation of duties: order approver X-User-ID != order.created_by_user_id; affidavit issuer X-User-ID != log.reconciled_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /orders/{id}/approve, POST /logs/{id}/issue-affidavit"

  - priority: 3
    category: existence
    check: "All path ids and body foreign-key references exist, validated left-to-right (includes as-run import id lists, trade_agreement_id existence, event_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 3.1
    category: business_referential
    check: "order_kind == TRADE requires trade_agreement_id present (CASH forbids it)"
    error_id: ERR_TRADE_AGREEMENT_REQUIRED
    http_status: 422
    applies_to: "POST /orders"

  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version (checked BEFORE from-state rules so a stale write never silently re-validates)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /spots, POST /logs/{id}/lock, POST /barter-avails"

  - priority: 5
    category: state
    check: "Generic state-machine from-state: the transition is declared for the entity's current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5.1
    category: state
    check: "Log posture gate: spot/barter-avail/live-read create, spot cancel/reschedule, live-read reschedule require posture in {DRAFT, LOCKED}; music-placements require LOCKED (clock pinned)"
    error_id: ERR_LOG_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /spots, POST /spots/{id}/cancel, POST /spots/{id}/reschedule, POST /barter-avails, POST /live-reads, POST /live-reads/{id}/reschedule, POST /logs/{id}/music-placements"

  - priority: 5.2
    category: state
    check: "Order must be ACTIVE to book spots"
    error_id: ERR_ORDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /spots"

  - priority: 5.3
    category: state
    check: "Reconcile gate: unresolved_discrepancy_count == 0 (exact zero)"
    error_id: ERR_UNRESOLVED_DISCREPANCIES
    http_status: 409
    applies_to: "POST /logs/{id}/reconcile"

  - priority: 5.4
    category: state
    check: "Lock precondition: clock_pin_selection must find an ACTIVE FormatClock covering weekday(log_date); empty candidate set rejects the lock"
    error_id: ERR_NO_ACTIVE_CLOCK
    http_status: 422
    applies_to: "POST /logs/{id}/lock"

  - priority: 6
    category: business_safety
    check: "Compliance gates on referenced entities: clearance CLEARED (ERR_CLEARANCE_NOT_CLEARED), endorsement contract ACTIVE (ERR_CONTRACT_NOT_ACTIVE), song ACTIVE (ERR_SONG_NOT_ACTIVE), category not RETIRED (ERR_CATEGORY_RETIRED), trade agreement status == ACTIVE for new trade submit/booking (ERR_TRADE_AGREEMENT_INACTIVE)"
    error_id: "ERR_CLEARANCE_NOT_CLEARED | ERR_CONTRACT_NOT_ACTIVE | ERR_SONG_NOT_ACTIVE | ERR_CATEGORY_RETIRED | ERR_TRADE_AGREEMENT_INACTIVE"
    http_status: 409
    applies_to: "POST /barter-avails, POST /live-reads, POST /logs/{id}/music-placements, POST /spots, POST /orders/{id}/submit, POST /orders/{id}/approve"

  - priority: 7
    category: business_temporal
    check: "Temporal/window rules in declared sub-order: (7a) song separation ERR_SPIN_SEPARATION_VIOLATION; (7b) artist separation ERR_ARTIST_SEPARATION_VIOLATION; (7c) barter avail inside clearance window ERR_CLEARANCE_WINDOW_VIOLATION; (7d) live read inside contract program window ERR_CONTRACT_WINDOW_VIOLATION; (7e) hour belongs to daypart ERR_DAYPART_HOUR_MISMATCH; (7f) air_date within order flight ERR_SPOT_OUTSIDE_FLIGHT; (7g) flight/contract window vs logical clock at activate/close ERR_FLIGHT_WINDOW_INVALID"
    error_id: "ERR_SPIN_SEPARATION_VIOLATION | ERR_ARTIST_SEPARATION_VIOLATION | ERR_CLEARANCE_WINDOW_VIOLATION | ERR_CONTRACT_WINDOW_VIOLATION | ERR_DAYPART_HOUR_MISMATCH | ERR_SPOT_OUTSIDE_FLIGHT | ERR_FLIGHT_WINDOW_INVALID"
    http_status: 422
    applies_to: "POST /logs/{id}/music-placements, POST /barter-avails, POST /live-reads, POST /live-reads/{id}/reschedule, POST /spots, POST /spots/{id}/reschedule, POST /orders/{id}/activate, POST /endorsement-contracts/{id}/activate, POST /endorsement-contracts/{id}/close"

  - priority: 8
    category: business_constraint
    check: "Uniqueness/overlap/quota constraints: one log per (station, log_date) ERR_LOG_ALREADY_EXISTS; ACTIVE clock weekday disjointness ERR_CLOCK_WEEKDAY_OVERLAP; rate-card window overlap per (station, daypart) ERR_RATE_WINDOW_OVERLAP; clearance window overlap ERR_CLEARANCE_WINDOW_OVERLAP; per-song daily spin cap ERR_CATEGORY_SPIN_CAP_EXCEEDED; waive/resolve restricted to UNFILLED_BARTER ERR_DISCREPANCY_NOT_WAIVABLE; per-(order, daypart) scheduled units < daypart_targets ERR_DAYPART_UNITS_EXHAUSTED"
    error_id: "ERR_LOG_ALREADY_EXISTS | ERR_CLOCK_WEEKDAY_OVERLAP | ERR_RATE_WINDOW_OVERLAP | ERR_CLEARANCE_WINDOW_OVERLAP | ERR_CATEGORY_SPIN_CAP_EXCEEDED | ERR_DISCREPANCY_NOT_WAIVABLE | ERR_DAYPART_UNITS_EXHAUSTED"
    http_status: "409 for the four overlap/uniqueness errors; 422 for ERR_CATEGORY_SPIN_CAP_EXCEEDED, ERR_DISCREPANCY_NOT_WAIVABLE, ERR_DAYPART_UNITS_EXHAUSTED (catalog is authoritative)"
    applies_to: "POST /logs, POST /clocks/{id}/activate, POST /rate-card-entries, POST /clearances/{id}/clear, POST /logs/{id}/music-placements, POST /discrepancies/{id}/waive, POST /discrepancies/{id}/resolve, POST /spots"

  - priority: 9
    category: business_constraint
    check: "Hour capacity: (9a) allow_preemption == true requires order.rate_tier == FIXED (ERR_PREEMPTION_NOT_ALLOWED); (9b) SPOT_BREAK/LIVE_READ_WINDOW pool capacity after optional preemption cascade (ERR_HOUR_CAPACITY_EXCEEDED)"
    error_id: "ERR_PREEMPTION_NOT_ALLOWED | ERR_HOUR_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /spots, POST /barter-avails, POST /live-reads, POST /spots/{id}/reschedule, POST /live-reads/{id}/reschedule"

  - priority: 10
    category: business_fiscal
    check: "Fiscal rules in declared sub-order: (10a) rate card exists for (daypart, weekday, air_date) ERR_NO_RATE_CARD; (10b) unit_rate_override_cents >= min_rate_cents unless caller is SalesManager passing allow_below_floor == true (ERR_RATE_FLOOR_VIOLATION); (10c) TRADE projected DEBIT <= agreement available_cents, and ledger ADJUSTMENT never drives available < 0 (ERR_TRADE_CREDIT_EXCEEDED)"
    error_id: "ERR_NO_RATE_CARD | ERR_RATE_FLOOR_VIOLATION | ERR_TRADE_CREDIT_EXCEEDED"
    http_status: "422 for ERR_NO_RATE_CARD and ERR_RATE_FLOOR_VIOLATION; 402 for ERR_TRADE_CREDIT_EXCEEDED (catalog is authoritative)"
    applies_to: "POST /spots, POST /spots/{id}/reschedule, POST /trade-agreements/{id}/ledger-entries, POST /logs/{id}/issue-affidavit"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time; all flight/window/effective-range/disaffirm-future checks read this clock."
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Re-evaluates nothing eagerly; the new clock value is read lazily by subsequent validations"]

  # --- Station ---
  - method: POST
    path: "/stations"
    description: "Create a station"
    roles: [SalesManager]
    code: 201
    input: [call_sign, market_name, "default_share_fallback?"]
    output: Station
    side_effects: []
  - method: GET
    path: "/stations/{id}"
    description: "Get a station"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: []
    output: Station
    side_effects: []
  - method: GET
    path: "/stations"
    description: "List stations (paginated)"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Station[]
    side_effects: []

  # --- FormatClock ---
  - method: POST
