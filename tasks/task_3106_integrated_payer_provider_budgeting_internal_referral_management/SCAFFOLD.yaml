    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock reads to_iso8601 for every subsequent expiry, window, wait_days and effective-date evaluation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The acting role does not hold this operation in its exclusive_operations or shared_operations set"

  # --- Not found ---
  - id: ERR_REGION_NOT_FOUND
    http: 404
    condition: "No Region exists for the supplied id"

  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "No Member exists for the supplied id"

  - id: ERR_CARE_SITE_NOT_FOUND
    http: 404
    condition: "No CareSite exists for the supplied id"

  - id: ERR_DEPARTMENT_NOT_FOUND
    http: 404
    condition: "No Department exists for the supplied id"

  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "No Provider exists for the supplied id"

  - id: ERR_NETWORK_SERVICE_NOT_FOUND
    http: 404
    condition: "No NetworkService exists for the supplied id"

  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "No Appointment exists for the supplied id"

  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "No Referral exists for the supplied id"

  - id: ERR_OUTSIDE_CLAIM_NOT_FOUND
    http: 404
    condition: "No OutsideServiceClaim exists for the supplied id"

  - id: ERR_REGIONAL_BUDGET_NOT_FOUND
    http: 404
    condition: "No RegionalBudget exists for the supplied id"

  - id: ERR_CAPACITY_PLAN_NOT_FOUND
    http: 404
    condition: "No CapacityPlan exists for the supplied id"

  - id: ERR_MEMBER_TRANSFER_NOT_FOUND
    http: 404
    condition: "No MemberTransfer exists for the supplied id"

  - id: ERR_QUALITY_METRIC_NOT_FOUND
    http: 404
    condition: "No QualityMetric exists for the supplied id"

  - id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 422
    condition: "An id supplied in the request body does not resolve to a stored row"

  - id: ERR_CROSS_REGION_REFERENCE
    http: 422
    condition: "A member, department, provider, referral or claim named in one request belongs to a different region of record than the request's region"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row is not in a state from which the requested trigger is declared"

  - id: ERR_REFERRAL_NOT_DECIDABLE
    http: 409
    condition: "A referral decision was requested on a Referral whose status is not PENDING_TRIAGE or APPEALED"

  - id: ERR_CLAIM_NOT_ADJUDICABLE
    http: 409
    condition: "Adjudication was requested on an OutsideServiceClaim whose status is not SUBMITTED or APPEALED"

  - id: ERR_BUDGET_NOT_SUBMITTABLE
    http: 409
    condition: "Submission was requested on a RegionalBudget whose status is not DRAFT or REOPENED"

  - id: ERR_CAPACITY_PLAN_NOT_ACTIVATABLE
    http: 409
    condition: "Activation was requested on a CapacityPlan whose status is not UNDER_REVIEW"

  - id: ERR_TRANSFER_NOT_COMPLETABLE
    http: 409
    condition: "Completion was requested on a MemberTransfer whose status is not PENDING_EFFECTIVE"

  - id: ERR_METRIC_NOT_FINALIZABLE
    http: 409
    condition: "Finalization was requested on a QualityMetric whose status is not MEASURING or REOPENED"

  # --- Temporal ---
  - id: ERR_REFERRAL_TRIAGE_WINDOW_EXPIRED
    http: 409
    condition: "A referral decision was requested after Referral.created_at + REFERRAL_TRIAGE_WINDOW_DAYS has passed"

  - id: ERR_REFERRAL_EXPIRED
    http: 409
    condition: "A booking was attempted against a referral whose expires_at has been reached"

  - id: ERR_TRANSFER_EFFECTIVE_DATE_NOT_REACHED
    http: 409
    condition: "Transfer completion was requested before MemberTransfer.effective_utc"

  # --- Network and coverage ---
  - id: ERR_SERVICE_NOT_AVAILABLE_IN_NETWORK
    http: 409
    condition: "No in-network department satisfies the referral's service, or an outside-network exception is claimed without a permitted exception_reason"

  - id: ERR_NO_IN_NETWORK_CAPACITY
    http: 409
    condition: "Candidate selection found no department with remaining budgeted supply and accepting_internal_referrals == true"

  - id: ERR_VOLUME_COMPONENT_NOT_PERMITTED
    http: 422
    condition: "A provider compensation arrangement would introduce a non-zero procedure-volume component"

  - id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http: 409
    condition: "An appeal was opened on a referral or claim that has already reached APPEAL_ROUNDS_MAX appeal rounds"

  - id: ERR_REFERRAL_NOT_AUTHORIZED
    http: 409
    condition: "A specialty booking named a referral that is not AUTHORIZED, or that does not match the member and target department"

  - id: ERR_UNAUTHORIZED_NETWORK_EXPANSION
    http: 409
    condition: "external_contract_count exceeds EXTERNAL_CONTRACT_MAX"

  - id: ERR_BUDGET_NOT_APPROVED
    http: 409
    condition: "Claim adjudication requires an APPROVED RegionalBudget for the region and period"

  - id: ERR_DUPLICATE_QUALITY_METRIC
    http: 409
    condition: "A QualityMetric already exists for this region, metric_code and period"

  - id: ERR_DUPLICATE_CAPACITY_PLAN
    http: 409
    condition: "A CapacityPlan already exists for this department and period"

  - id: ERR_PROVIDER_SCHEDULE_OVERLAP
    http: 409
    condition: "The provider already holds a non-cancelled appointment whose instants intersect the requested slot"

  # --- Posture and capacity ---
  - id: ERR_REGION_POSTURE_FROZEN
    http: 409
    condition: "The target region's posture is FROZEN, so child mutations are refused"

  - id: ERR_DEPARTMENT_CAPACITY_EXHAUSTED
    http: 409
    condition: "Booked appointments already fill the department's budgeted supply, or the department is CLOSED"

  - id: ERR_FTE_BUDGET_EXCEEDED
    http: 409
    condition: "Filled staffing full-time-equivalents would exceed the CareSite's budgeted headcount"

  - id: ERR_BUDGET_FISCAL_LINE_EXCEEDED
    http: 402
    condition: "The request would exceed the approved staffing budget line or push the region's operating margin past the freeze floor"

  # --- Concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_member_version does not match the stored Member.version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegionalFinanceOfficer
    description: "Owns enrollment, compensation, facility cost, outside-services spend and the regional operating budget"
    identity: opaque
    exclusive_operations:
      - "POST /regions/{id}/members"
      - "PATCH /members/{id}"
      - "POST /members/{id}/terminate"
      - "POST /regions/{id}/care-sites"
      - "POST /care-sites/{id}/staffing"
      - "POST /care-sites/{id}/providers"
      - "PATCH /providers/{id}/compensation-model"
      - "POST /regions/{id}/outside-service-claims"
      - "POST /outside-service-claims/{id}/adjudicate"
      - "POST /outside-service-claims/{id}/pay"
      - "POST /regions/{id}/regional-budgets"
      - "POST /regional-budgets/{id}/submit"
      - "POST /regional-budgets/{id}/close"
      - "POST /regions/{id}/capacity-plans"
      - "POST /capacity-plans/{id}/activate"
      - "POST /capacity-plans/{id}/adjust"
      - "POST /member-transfers"
      - "POST /member-transfers/{id}/accept"
      - "POST /member-transfers/{id}/reject"
      - "POST /member-transfers/{id}/complete"
      - "POST /member-transfers/{id}/cancel"
      - "POST /referral-claims/bulk-adjudicate"
    shared_operations:
      - "GET region, member, care-site, department, provider, network-service, appointment, referral, claim, budget, capacity-plan, transfer and quality-metric reads"

  - name: UtilizationReviewer
    description: "Decides referral authorizations, appeals and claim denials on clinical necessity and network rules"
    identity: opaque
    exclusive_operations:
      - "POST /referrals/{id}/authorize"
      - "POST /referrals/{id}/deny"
      - "POST /referrals/{id}/appeal"
      - "POST /outside-service-claims/{id}/deny"
      - "POST /outside-service-claims/{id}/appeal"
    shared_operations:
      - "GET region, member, department, provider, network-service, referral, claim and appointment reads"

  - name: AccessScheduler
    description: "Owns appointment supply, department configuration, network service declarations and referral intake"
    identity: opaque
    exclusive_operations:
      - "POST /care-sites/{id}/departments"
      - "PATCH /departments/{id}"
      - "POST /regions/{id}/network-services"
      - "POST /referrals"
      - "POST /appointments"
      - "POST /appointments/{id}/cancel"
      - "POST /capacity-plans/{id}/review"
      - "POST /capacity-plans/{id}/return"
    shared_operations:
      - "GET region, member, care-site, department, provider, network-service, appointment, referral, capacity-plan and quality-metric reads"

  - name: QualityReviewBoard
    description: "Owns quality and access metric definition, finalization and remediation"
    identity: opaque
    exclusive_operations:
      - "POST /regions/{id}/quality-metrics"
