      - name: surfacing_depth_nested_max_over_tier_age_and_soil_uplifts
        grounds:
          - calculations.surfacing_depth_requirement
          - entities.PlayArea.fields.required_surfacing_depth_cm
          - entities.PlayArea.fields.critical_fall_height_cm
        distinguishing_aspect: |
          Mode: nested max over three independently derived candidate terms with a floor - the
          TODDLER_UPLIFT_CM 5 and CLAY_SOIL_UPLIFT_CM 3 uplifts are applied to the material
          tier base SEPARATELY and never summed, so a toddler EWF area on CLAY requires 28 cm
          (max(23+5, 23+3, 15)) and not 31 cm, a school-age EWF area on the same CLAY project
          requires 26 cm, and a toddler POURED_RUBBER area on CLAY requires 15 cm because
          MIN_SURFACING_DEPTH_CM dominates max(5+5, 5+3, 15).
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 is ACTIVE; DECK-TDL-122 (toddler, deck_height 122) and DECK-SCH-122 (school-age, deck_height 122) are CERTIFIED."
