            - "Unit.${unit_id}.pest_flag == CLEAR and Property posture == STANDARD with open_bed_bug_case_count == 0"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: cascade_positive_inspection_to_property_posture
        grounds:
          - state_machines.Inspection.SCHEDULED_to_COMPLETED
          - state_machines.Unit.CLEAR_to_MONITORING
          - calculations.adjacent_exposure_selector
          - calculations.exposure_posture
        distinguishing_aspect: |
          Depth-4 transitive cascade triggered by inspection completion:
          complete(positive) -> creates BedBugCase OPEN -> case creation runs
          the adjacency selector creating INITIAL inspections on 102 and 201 ->
          each created inspection flips its unit's pest_flag to MONITORING ->
          property recomputes open_bed_bug_case_count (1) and posture
          (ELEVATED). Each hop is caused by the previous hop, not by the
          original request.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope BED_BUGS), units 101 (floor1 stack1), 102 (floor1 stack2), 201 (floor2 stack1), technician"
            - "ROUTINE BED_BUGS inspection scheduled on 101"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Ash Court", address: "7 Ash St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["BED_BUGS"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 2 }, as: ProgramAdmin, captures: { u101: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "102", floor: 1, stack_index: 2, bedrooms: 2 }, as: ProgramAdmin, captures: { u102: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "201", floor: 2, stack_index: 1, bedrooms: 2 }, as: ProgramAdmin, captures: { u201: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${u101}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "BED_BUGS", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { insp_id: "$.data.id" } }
          trigger:
            - { call: "POST /pest/inspections/${insp_id}/complete", payload: { live_sightings: 10, evidence_count: 0, bed_bug_positive: true }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "GET /pest/units/${u101}/bed-bug-cases", payload: {}, as: PropertyManager, captures: { case_id: "$.data[0].id", case_status: "$.data[0].status" } }
            - { call: "GET /pest/units/${u102}/inspections", payload: {}, as: PropertyManager, captures: { i102_kind: "$.data[0].kind", i102_case: "$.data[0].bed_bug_case_id", i102_sched: "$.data[0].scheduled_for" } }
            - { call: "GET /pest/units/${u201}/inspections", payload: {}, as: PropertyManager, captures: { i201_kind: "$.data[0].kind" } }
            - { call: "GET /pest/units/${u101}", payload: {}, as: PropertyManager, captures: { flag101: "$.data.pest_flag" } }
            - { call: "GET /pest/units/${u102}", payload: {}, as: PropertyManager, captures: { flag102: "$.data.pest_flag" } }
            - { call: "GET /pest/units/${u201}", payload: {}, as: PropertyManager, captures: { flag201: "$.data.pest_flag" } }
            - { call: "GET /pest/properties/${prop_id}/summary", payload: {}, as: PropertyManager, captures: { posture: "$.data.posture", open_count: "$.data.open_bed_bug_case_count" } }
          assert:
            - "exactly one BedBugCase exists on unit 101 with status OPEN (link 1)"
            - "unit 102 has exactly one inspection: kind INITIAL, pest_type BED_BUGS, status SCHEDULED, bed_bug_case_id == ${case_id}, scheduled_for == 2026-08-02T00:00:00Z (link 2: default clock 2026-08-01T00:00:00Z + 24h)"
            - "unit 201 has exactly one auto-created INITIAL inspection linked to ${case_id} (same stack, floor delta 1); no inspection is created on any non-adjacent unit"
            - "Unit 102.pest_flag == MONITORING and Unit 201.pest_flag == MONITORING (link 3) while Unit 101.pest_flag == INFESTED"
            - "Property summary: open_bed_bug_case_count == 1 and posture == ELEVATED (link 4: 1 <= open < 3)"
      - name: cascade_prep_failure_to_late_fee
        grounds:
          - state_machines.Treatment.PREP_NOTIFIED_to_NON_COMPLIANT
          - calculations.lease_balance
          - calculations.chargeback_amount
        distinguishing_aspect: |
          Depth-3 transitive cascade from a different trigger (verify-prep, not
          inspection completion): verify(false) -> Treatment NON_COMPLIANT +
          auto-created NON_COMPLIANCE_FEE chargeback -> chargeback creation
          recomputes the lease balance -> the upward crossing of 50000 creates
          a LATE_FEE chargeback, which recomputes the balance again. Final
          balance 40000 + 16125 + 5375 = 61500 proves all three links fired.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (heat_treatment_included false, coverage 20000, budget 1000000, scope ROACHES), unit 101, lease cap 40000 addendum signed, resident, technician"
            - "HEAT_SURCHARGE chargeback assessed (provisional min(round_half_up(65000*1.075)=69875, cap 40000) = 40000 -> balance 40000, below late-fee threshold)"
            - "CHEMICAL treatment on 101 window 2026-08-10T09:00-10:00Z, PREP_NOTIFIED and acknowledged"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Walnut Court", address: "8 Walnut St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: false, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 40000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/residents", payload: { full_name: "R One", email: "r1@x.com", lease_id: "${lease_id}" }, as: PropertyManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/leases/${lease_id}/chargebacks", payload: { kind: "HEAT_SURCHARGE" }, as: BillingClerk, as_user_id: "clerk-1", captures: { cb_heat: "$.data.id", heat_prov: "$.data.provisional_amount_cents" } }
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager, captures: { tr_id: "$.data.id" } }
            - { call: "POST /pest/treatments/${tr_id}/notify-prep", payload: {}, as: PropertyManager }
            - { call: "POST /pest/treatments/${tr_id}/acknowledge-prep", payload: {}, as: Resident, as_user_id: "${res_id}" }
          trigger:
            - { call: "POST /pest/treatments/${tr_id}/verify-prep", payload: { compliant: false }, as: PropertyManager, captures: { tr_status: "$.data.status" } }
            - { call: "GET /pest/leases/${lease_id}/chargebacks", payload: {}, as: BillingClerk, captures: {} }
            - { call: "GET /pest/leases/${lease_id}", payload: {}, as: BillingClerk, captures: { bal: "$.data.outstanding_balance_cents", delinq: "$.data.delinquent" } }
          assert:
            - "HEAT_SURCHARGE provisional == 40000 (cap clamps 69875; no late fee at 40000 < 50000)"
            - "Treatment.${tr_id}.status == NON_COMPLIANT (link 1)"
            - "a NON_COMPLIANCE_FEE chargeback exists with provisional_amount_cents == 16125 and source_treatment_id == ${tr_id} (link 1 product)"
            - "a LATE_FEE chargeback exists with provisional_amount_cents == 5375, created only because the balance crossed 50000 upward (link 3)"
            - "Lease.${lease_id}.outstanding_balance_cents == 61500 (40000 + 16125 + 5375) and delinquent == true"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_suspended_contract
        grounds:
          - validations[priority=4]
          - validations[priority=13]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - errors[ERR_CONTRACT_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the schedule request
          violates both ERR_CONTRACT_NOT_ACTIVE (contract SUSPENDED) and
          ERR_CONTRACT_BUDGET_EXCEEDED (spent 12000 + estimate 12000 > budget
          12000); priority 4 must win over priority 13.
        test_recipe:
          setup:
            - "Property with ACTIVE-then-SUSPENDED contract (scope ROACHES, monthly_budget_cents 12000)"
            - "One CHEMICAL treatment COMPLETED (spent_cents == 12000 == budget), unit 101 with lease+resident, technician"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Poplar Court", address: "9 Poplar St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 12000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/residents", payload: { full_name: "R One", email: "r1@x.com", lease_id: "${lease_id}" }, as: PropertyManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager, captures: { tr1: "$.data.id" } }
            - { call: "POST /pest/treatments/${tr1}/notify-prep", payload: {}, as: PropertyManager }
            - { call: "POST /pest/treatments/${tr1}/acknowledge-prep", payload: {}, as: Resident, as_user_id: "${res_id}" }
            - { call: "POST /pest/treatments/${tr1}/verify-prep", payload: { compliant: true }, as: PropertyManager }
            - { call: "POST /pest/treatments/${tr1}/complete", payload: { actual_minutes: 60 }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /pest/contracts/${contract_id}/suspend", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-12T09:00:00Z", window_end: "2026-08-12T10:00:00Z" }, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CONTRACT_NOT_ACTIVE with HTTP 409 (state priority 4 wins)"
            - "error_id != ERR_CONTRACT_BUDGET_EXCEEDED (fiscal priority 13 loses despite spent 12000 + 12000 > 12000 also being violated)"
      - name: safety_beats_temporal_on_heat_schedule
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_HEAT_SAFETY_VIOLATION]
          - errors[ERR_TREATMENT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal (different
          pair from the state/fiscal instance): a HEAT schedule violates both
          vacancy attestation and the technician's buffered window; priority 6
          must win over priority 8.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope BED_BUGS, budget 1000000), units 101 and 102, technician"
            - "Technician already has CHEMICAL treatment on 101 window 2026-08-10T09:00-10:00Z (buffered 08:45-10:15)"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Cherry Court", address: "10 Cherry St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["BED_BUGS"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { u101: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "102", floor: 1, stack_index: 2, bedrooms: 1 }, as: ProgramAdmin, captures: { u102: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${u101}/treatments", payload: { technician_id: "${tech_id}", pest_type: "BED_BUGS", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager }
          trigger:
            - { call: "POST /pest/units/${u102}/treatments", payload: { technician_id: "${tech_id}", pest_type: "BED_BUGS", treatment_type: "HEAT", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T11:00:00Z", vacancy_attested: false }, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_HEAT_SAFETY_VIOLATION with HTTP 422 (safety priority 6 wins)"
            - "error_id != ERR_TREATMENT_WINDOW_CONFLICT (temporal priority 8 loses despite buffered intervals [09:45,11:15) and [08:45,10:15) intersecting)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: severity_threshold_inclusive_at_ten
        grounds:
          - calculations.severity_classification
        distinguishing_aspect: |
          Boundary on the live_sightings metric via POST
          /pest/inspections/{id}/complete: exactly 10 live sightings is SEVERE
          (>= 10 inclusive) while 9 is MODERATE — one unit of input flips the
          classification.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope ROACHES), unit 101, technician; two ROUTINE ROACHES inspections scheduled"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Alder Court", address: "11 Alder St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "ROACHES", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { inspA: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "ROACHES", scheduled_for: "2026-08-06T09:00:00Z" }, as: PropertyManager, captures: { inspB: "$.data.id" } }
          trigger:
            - { call: "POST /pest/inspections/${inspA}/complete", payload: { live_sightings: 10, evidence_count: 0, bed_bug_positive: false }, as: Technician, as_user_id: "${tech_id}", captures: { sevA: "$.data.severity" } }
