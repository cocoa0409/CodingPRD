      - name: cascading_validation_rofr_window_check_precedes_the_title_exception_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=24]
          - validations[priority=27]
          - errors[ERR_ROFR_WINDOW_OPEN]
          - endpoints[POST /lease-buyouts/deals/{id}/clear-to-close]
        distinguishing_aspect: |
          Two clearance blockers are live at once and the ladder decides which one the caller sees: the
          ROFR window is still open (priority 24) and two title exceptions are unresolved (priority 27), so
          clear-to-close returns 422 ERR_ROFR_WINDOW_OPEN and never reports the title problem, which is what
          makes the ordering falsifiable rather than incidental.
        test_recipe:
          setup:
            - "A tower company with rofr_required true and rofr_window_days 30."
            - "A deal in DILIGENCE with a SERVED RofrNotice, so rofr_state is PENDING."
            - "Its TitleReport is in EXCEPTIONS_FOUND with exception_count 2 and open_exception_count 2."
            - "The logical clock is at 2026-08-01T00:00:00Z, inside the notice window."
