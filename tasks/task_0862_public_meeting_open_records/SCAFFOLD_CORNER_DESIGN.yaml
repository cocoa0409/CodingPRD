              as: RecordsOfficer
              captures: { doc_id: $.data.id }
            - call: "POST /records-requests/${req_id}/documents/${doc_id}/transition"
              payload: { to_status: "REVIEWED" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents/${doc_id}/transition"
              payload: { to_status: "RELEASED" }
              as: RecordsOfficer
            - call: "GET /records-requests/${req_id}"
              payload: {}
              as: RecordsOfficer
              captures: { rr_v: $.data.version }
            - call: "POST /records-requests/${req_id}/determination"
              payload: { decision: "GRANTED", expected_records_request_version: "${rr_v}" }
              as: RecordsOfficer
          trigger:
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "CLOSED" }
              as: RecordsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FEE_OUTSTANDING"

      - name: waiver_exceeds_assessed_fee_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_WAIVER_EXCEEDS_FEE]"]
        distinguishing_aspect: "A determination waiving 99999 cents against an assessed fee of 15 (one 51-page doc) returns ERR_WAIVER_EXCEEDS_FEE (422)."
