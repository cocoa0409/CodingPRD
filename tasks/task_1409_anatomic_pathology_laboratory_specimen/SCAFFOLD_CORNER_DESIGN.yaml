            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr W", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/pathologists/${p1}/coverage-windows", payload: { window_type: "CONSULT_SERVICE", start_at: "2026-08-04T10:00:00Z", end_at: "2026-08-04T12:00:00Z" }, as: LabAdmin, captures: { w1: $.data.id } }
            - { call: "POST /pathology/coverage-windows/${w1}/cancel", as: LabAdmin }
          trigger:
            - { call: "POST /pathology/coverage-windows/${w1}/cancel", as: LabAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_COVERAGE_WINDOW_NOT_ACTIVE (http 409)"]
      - name: assign_reassign_cancel_state_gates
        claim_type: invalid_transition
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_CASE_NOT_ASSIGNABLE]
          - errors[ERR_CASE_NOT_REASSIGNABLE]
          - errors[ERR_CASE_NOT_CANCELLABLE]
        distinguishing_aspect: "The three case-admin actions have disjoint state gates: assign on a PENDING_SIGNOUT case fails (ERR_CASE_NOT_ASSIGNABLE), reassign on an OPEN case fails (ERR_CASE_NOT_REASSIGNABLE), cancel on a PENDING_SIGNOUT case fails (ERR_CASE_NOT_CANCELLABLE)."
        test_recipe:
          setup: ["case X OPEN (never worked up); case Y fully worked up and PENDING_SIGNOUT; pathologists p1, p2"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-R9", full_name: "Err Nine", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr One", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Two", subspecialties: ["GI"] }, as: LabAdmin, captures: { p2: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { cx: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { cy: $.data.id } }
            - { call: "POST /pathology/cases/${cy}/specimens", payload: { patient_mrn: "MRN-R9", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { spy: $.data.id } }
            - { call: "POST /pathology/specimens/${spy}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${spy}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { by: $.data.id } }
            - { call: "POST /pathology/blocks/${by}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${by}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { sy: $.data.id } }
            - { call: "POST /pathology/slides/${sy}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${sy}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${sy}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/cases/${cy}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${cy}/submit-for-signout", as: Pathologist, as_user_id: "${p1}" }
            - { call: "GET /pathology/cases/${cx}", as: LabAdmin, captures: { cvx: $.data.version } }
          trigger:
            - { call: "POST /pathology/cases/${cy}/assign", payload: { pathologist_id: "${p2}" }, as: LabAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /pathology/cases/${cx}/reassign", payload: { pathologist_id: "${p2}", expected_case_version: "${cvx}" }, as: LabAdmin, captures: { err2: $.data.error_id } }
            - { call: "POST /pathology/cases/${cy}/cancel", payload: { reason: "too late" }, as: LabAdmin, captures: { err3: $.data.error_id } }
          assert:
            - "err1 == ERR_CASE_NOT_ASSIGNABLE (assign requires OPEN or WORKUP)"
            - "err2 == ERR_CASE_NOT_REASSIGNABLE (reassign requires WORKUP or PENDING_SIGNOUT; OPEN fails despite a correct OCC version)"
            - "err3 == ERR_CASE_NOT_CANCELLABLE (cancel requires OPEN or WORKUP)"
      - name: submit_from_open_and_amend_sign_without_amendment_rejected
        claim_type: invalid_transition
