              captures: { inv_id: $.data.id, inv_st: $.data.status, trig: $.data.trigger_reason, opened: $.data.opened_at, impacted: $.data.impacted_tissue_count, quarantined: $.data.quarantined_count }
          trigger:
            - call: "POST /eye-bank/lookback-investigations/${inv_id}/close"
              payload: { resolution: "NO_ACTION", closure_note: "Nothing found" }
              as: MedicalDirector
              captures: { err: $.data.error_id }
            - call: "POST /eye-bank/lookback-investigations/${inv_id}/notify"
              payload: {}
              as: MedicalDirector
              captures: { st2: $.data.status, notified: $.data.notified_at }
          assert:
            - "${inv_st} == \"OPEN\" and ${trig} == \"POSITIVE_RETEST\" and ${opened} == \"2026-08-03T06:00:00.000Z\""
            - "${impacted} == 0 and ${quarantined} == 0 (the donor has no graded tissue yet)"
            - "Donor.${donor_id}.lookback_flag == true"
            - "HTTP 409 on close"
            - "${err} == \"ERR_INVESTIGATION_STATE_INVALID\""
            - "LookbackInvestigation.${inv_id}.closed_at == null and LookbackInvestigation.${inv_id}.closure_note == null"
            - "HTTP 200 on notify with ${st2} == \"NOTIFIED\" and ${notified} == \"2026-08-03T06:00:00.000Z\""

