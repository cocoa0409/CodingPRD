            - "captured memo_st == POSTED and memo_amt == 9600 (auto-created memo, origin SHORT)"
            - "captured inv_bal == 48179 (57779 - 9600)"
            - "captured cs == GOOD_STANDING (exposure 48179 <= 55000 auto-releases hold)"
      - name: assign_weight_flips_manifest_posture
        grounds:
          - state_machines.PurchaseOrder.SUBMITTED_to_ASSIGNED
          - entities.DeliveryManifest.fields.total_weight_lbs
          - entities.DeliveryManifest.fields.overweight_flag
          - "errors[ERR_MANIFEST_OVERWEIGHT]"
        distinguishing_aspect: |
          Depth-2 chain from the assign-order trigger (different trigger from the exception
          cascade): assign mutates PurchaseOrder, which recomputes
          DeliveryManifest.total_weight_lbs, whose crossing of capacity_lbs flips
          overweight_flag and gates the NEXT assign — each link caused by the previous one.
        test_recipe:
          setup:
            - "Manifest capacity 100 lbs; P1 weighs 10 lbs/case; order A of 15 cases P1 (150 lbs) submitted; order B of 1 case P1 submitted"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 15, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { poa: $.data.id, poa_ver: $.data.version } }
            - { call: "POST /purchase-orders/${poa}/submit", payload: { expected_order_version: "${poa_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 1, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { pob: $.data.id, pob_ver: $.data.version } }
            - { call: "POST /purchase-orders/${pob}/submit", payload: { expected_order_version: "${pob_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
            - { call: "POST /delivery-manifests", payload: { route_code: "R-9", delivery_date: "2026-05-25", capacity_lbs: 100 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver: $.data.version } }
          trigger:
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${poa}", expected_manifest_version: "${m_ver}" }, as: WholesaleAdmin }
            - { call: "GET /delivery-manifests/${m_id}", payload: {}, as: WholesaleAdmin, captures: { m_w: $.data.total_weight_lbs, m_ow: $.data.overweight_flag, m_ver2: $.data.version } }
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${pob}", expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured m_w == 150 (15 cases * 10 lbs)"
            - "captured m_ow == true (150 > capacity 100)"
            - "captured err == ERR_MANIFEST_OVERWEIGHT (posture gate blocks the next assign)"

  - rule_id: priority_pair_validation_conflict
