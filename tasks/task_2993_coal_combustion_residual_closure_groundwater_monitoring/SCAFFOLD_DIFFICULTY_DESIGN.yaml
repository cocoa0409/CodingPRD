              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ok_event_id: $.data.id }
          assert:
            - "SamplingEvent.${base_event_id}.status == VALIDATED and sampled_on == 2026-06-15"
            - "trigger call 1 (day 89) returns HTTP 422 with error_id ERR_SAMPLE_INTERVAL_TOO_SHORT"
            - "GET /ccr/sampling-events?program_id=${prog_id} does not contain event_code DET-D89"
            - "trigger call 2 (day 90) returns HTTP 201"
            - "SamplingEvent.${ok_event_id}.status == DRAFT and sampled_on == 2026-09-13"
            - "MonitoringProgram.${prog_id}.last_validated_event_id == ${base_event_id} (a DRAFT event does not move the anchor)"
            - "MonitoringProgram.${prog_id}.sampling_frequency == SEMIANNUAL and next_sampling_due_date == 2026-12-14"

      - name: adjacent_commitment_windows_touching_at_one_endpoint_exceed_the_ash_inventory
        grounds:
          - validations.priority_55_ERR_REUSE_COMMITMENT_OVERLAP
          - entities.BeneficialReuseAgreement.fields.commitment_start_on
          - entities.BeneficialReuseAgreement.fields.commitment_end_on
          - entities.DisposalUnit.fields.ash_in_place_tons
        distinguishing_aspect: |
          Commitment windows are closed intervals, so two agreements that merely touch at a single shared
          endpoint still overlap and their tonnage must be aggregated. A 30000-ton window ending
          2026-06-30 plus a 25000-ton window starting 2026-06-30 exposes 55000 tons of a 50000-ton
          inventory and is refused, while shifting the second window's start by one day to 2026-07-01
          makes the windows disjoint and the identical 25000 tons qualifies. Each agreement is
          individually within inventory, so only the overlap-aware aggregate can distinguish them.
        test_recipe:
          setup:
            - "One unit whose original_ash_in_place_tons is 50000 and which has no shipments, so ash_in_place_tons is 50000"
            - "Agreement A: 30000 tons over the closed window 2026-01-01..2026-06-30, already QUALIFIED"
            - "Agreements B and C are identical to each other except for commitment_start_on, and both use ash chemistry that passes ASTM C618 Class F so the priority-52 quality gate cannot fire"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL" }
