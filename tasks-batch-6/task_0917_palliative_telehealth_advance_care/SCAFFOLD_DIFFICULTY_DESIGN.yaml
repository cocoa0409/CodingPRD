            - "HospiceElection.${he_id}.current_period_start == 2026-09-01T00:00:00.000Z"
            - "HospiceElection.${he_id}.current_period_end == 2026-11-30T00:00:00.000Z"
            - "HospiceElection.${he_id}.cumulative_benefit_days == 180"
            - "HospiceElection.${he_id}.certification_count == 2"
            - "Patient.${p_id}.program_status == HOSPICE_ELECTED"

  # =========================================================================
  # Rule 4 - transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: death_event_drives_five_hop_program_closure_chain
        grounds:
          - state_machines.Patient.ACTIVE_to_DECEASED
          - state_machines.HospiceElection.ELECTED_to_CLOSED_ON_DEATH
          - state_machines.MedicationOrder.ACTIVE_to_DISCONTINUED
          - state_machines.CarePlan.ACTIVE_to_CLOSED
          - state_machines.SymptomAssessment.OPEN_to_RESOLVED
          - state_machines.OnCallEscalation.ACKNOWLEDGED_to_CLOSED
          - endpoints["POST /palliative/patients/{id}/death-events"]
        distinguishing_aspect: |
          Depth-5 chain triggered by the death event: the election closes
          BECAUSE the record froze, the medication orders discontinue BECAUSE
          the election closed, the care plan closes BECAUSE the orders were
          discontinued, the assessment resolves BECAUSE the plan closed, and the
          escalation closes BECAUSE the assessment resolved. Each link is caused
          by the link before it, not by the death event directly.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE with active_daily_mme 30.0 and open_symptom_count 1."
            - "One HospiceElection in status PENDING_CERT."
            - "One MedicationOrder in status ACTIVE contributing mme_daily 30.0."
            - "One CarePlan in status ACTIVE carrying one SymptomAssessment with triage_status OPEN."
            - "One OnCallEscalation in status TIER_NOTIFIED on that assessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1007", full_name: "Gio Ahmadi", date_of_birth: "1939-09-14", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/hospice-elections"
              payload: { patient_id: "${p_id}" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { he_id: $.data.id }
            - call: "POST /palliative/medication-orders"
              payload: { patient_id: "${p_id}", drug: "MORPHINE_PO", dose_amount: 30, days_supply: 14, breakthrough_drug: "MORPHINE_PO" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { mo_id: $.data.id }
            - call: "POST /palliative/medication-orders/${mo_id}/attestations"
              payload: { attestation_type: "VERIFICATION" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Comfort plan", problem_list: ["pain"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_id: $.data.id }
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/symptom-assessments"
              payload: { patient_id: "${p_id}", care_plan_id: "${cp_id}", reporter_type: "SELF", item_pain: 6, item_dyspnea: 6, item_nausea: 6, item_anxiety: 6, item_fatigue: 6 }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { sa_id: $.data.id }
            - call: "POST /palliative/escalations"
              payload: { patient_id: "${p_id}", symptom_assessment_id: "${sa_id}", contact_summary: "night call for pain crisis" }
              as: OnCallClinician
              as_user_id: "u_oncall_1"
              captures: { esc_id: $.data.id }
          trigger:
            - call: "POST /palliative/patients/${p_id}/death-events"
              payload: { pronouncing_clinician_user_id: "u_physician_1" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
          assert:
            - "Patient.${p_id}.program_status == DECEASED"
            - "Patient.${p_id}.records_frozen == true"
            - "HospiceElection.${he_id}.status == CLOSED_ON_DEATH"
            - "MedicationOrder.${mo_id}.status == DISCONTINUED"
            - "Patient.${p_id}.active_daily_mme == 0.0"
            - "CarePlan.${cp_id}.status == CLOSED"
            - "CarePlan.${cp_id}.closed_reason == PATIENT_DEATH"
            - "SymptomAssessment.${sa_id}.triage_status == RESOLVED"
            - "SymptomAssessment.${sa_id}.resolution_reason == PLAN_CLOSED"
            - "Patient.${p_id}.open_symptom_count == 0"
            - "OnCallEscalation.${esc_id}.status == CLOSED"
            - "OnCallEscalation.${esc_id}.disposition == ADMINISTRATIVE_CLOSE"

      - name: document_execution_drives_four_hop_supersession_chain
        grounds:
          - state_machines.AdvanceCareDocument.PENDING_EXECUTION_to_EXECUTED
          - state_machines.AdvanceCareDocument.EXECUTED_to_SUPERSEDED
          - state_machines.CodeStatusOrder.EFFECTIVE_to_SUPERSEDED
          - state_machines.CodeStatusOrder.ATTESTED_to_CONFLICT_HOLD
          - entities.Patient.fields.code_status_rank
          - concurrency_rules[document-execute-stale-patient]
        distinguishing_aspect: |
          Depth-4 chain triggered by document execution, a different triggering
          transition from the death event: the prior document is superseded
          BECAUSE the new one executed, the effective code-status order is
          superseded BECAUSE its source document was superseded, the patient's
          code_status is rewritten BECAUSE that order was superseded, and the
          in-flight draft order parks in CONFLICT_HOLD BECAUSE the patient's
          code_status moved underneath it.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE, jurisdiction_code JUR_TWO_WITNESS, capacity_status HAS_CAPACITY, code_status DNR and code_status_rank 2."
            - "AdvanceCareDocument doc1 (LIVING_WILL, stated_code_status DNR) in status EXECUTED with two witness signatures."
            - "CodeStatusOrder cso1 citing doc1 in status EFFECTIVE."
            - "CodeStatusOrder cso2 requesting DNR_DNI in status DRAFT."
            - "AdvanceCareDocument doc2 (LIVING_WILL, stated_code_status COMFORT_MEASURES_ONLY, supersedes doc1) in status PENDING_EXECUTION with two witness signatures."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1008", full_name: "Hana Bloomfield", date_of_birth: "1944-12-02", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/advance-care-documents"
              payload: { patient_id: "${p_id}", document_type: "LIVING_WILL", stated_code_status: "DNR" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { doc1_id: $.data.id }
            - call: "POST /palliative/advance-care-documents/${doc1_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_1" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/advance-care-documents/${doc1_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_2" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "GET /palliative/patients/${p_id}"
              payload: {}
              as: ProgramAdmin
              captures: { p_v_a: $.data.version }
            - call: "POST /palliative/advance-care-documents/${doc1_id}/execute"
              payload: { expected_patient_version: "${p_v_a}" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
            - call: "POST /palliative/code-status-orders"
              payload: { patient_id: "${p_id}", requested_code_status: "DNR", source_document_id: "${doc1_id}" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { cso1_id: $.data.id }
            - call: "POST /palliative/code-status-orders/${cso1_id}/attestations"
              payload: { attestation_role: "CLINICIAN", attestation_text: "goals discussed, DNR affirmed" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
            - call: "POST /palliative/code-status-orders/${cso1_id}/attestations"
              payload: { attestation_role: "PATIENT_OR_SURROGATE", attestation_text: "patient affirms DNR" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/code-status-orders"
              payload: { patient_id: "${p_id}", requested_code_status: "DNR_DNI" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { cso2_id: $.data.id }
            - call: "POST /palliative/advance-care-documents"
              payload: { patient_id: "${p_id}", document_type: "LIVING_WILL", stated_code_status: "COMFORT_MEASURES_ONLY", supersedes_document_id: "${doc1_id}" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { doc2_id: $.data.id }
            - call: "POST /palliative/advance-care-documents/${doc2_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_1" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/advance-care-documents/${doc2_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_2" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "GET /palliative/patients/${p_id}"
              payload: {}
              as: ProgramAdmin
              captures: { p_v_b: $.data.version }
          trigger:
            - call: "POST /palliative/advance-care-documents/${doc2_id}/execute"
              payload: { expected_patient_version: "${p_v_b}" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
          assert:
            - "AdvanceCareDocument.${doc2_id}.status == EXECUTED"
            - "AdvanceCareDocument.${doc1_id}.status == SUPERSEDED"
            - "CodeStatusOrder.${cso1_id}.status == SUPERSEDED"
            - "Patient.${p_id}.code_status == COMFORT_MEASURES_ONLY"
            - "Patient.${p_id}.code_status_rank == 4"
            - "CodeStatusOrder.${cso2_id}.status == CONFLICT_HOLD"
            - "AdvanceCareDocument.${doc2_id}.reattest_due_at == 2027-06-01T00:00:00.000Z"

  # =========================================================================
  # Rule 5 - validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: record_freeze_preempts_invalid_state_and_stale_version_on_plan_revision
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_RECORD_FROZEN]
          - concurrency_rules[care-plan-revision-stale-plan]
        distinguishing_aspect: |
          Error-category pair business_safety (rung 6, ERR_RECORD_FROZEN) versus
          state (rungs 7 and 8, ERR_INVALID_STATE and
          ERR_STALE_CARE_PLAN_VERSION). One request violates all three - the
          patient is frozen, the plan is CLOSED rather than ACTIVE, and the
          supplied version is two behind - and the global write gate wins.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status DECEASED with records_frozen true."
            - "One CarePlan that reached ACTIVE and was then closed by the death cascade to status CLOSED with closed_reason PATIENT_DEATH."
            - "The client still holds the plan version observed just after activation, which the closure cascade has since advanced."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1009", full_name: "Ivo Marchetti", date_of_birth: "1937-04-19", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Comfort plan", problem_list: ["pain"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_id: $.data.id }
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_v_stale: $.data.version }
            - call: "POST /palliative/patients/${p_id}/death-events"
              payload: { pronouncing_clinician_user_id: "u_physician_1" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
          trigger:
            - call: "POST /palliative/care-plans/${cp_id}/revisions"
              payload: { expected_care_plan_version: "${cp_v_stale}", revised_problem_list: ["pain", "delirium"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_RECORD_FROZEN"
            - "${err} != ERR_INVALID_STATE"
            - "${err} != ERR_STALE_CARE_PLAN_VERSION"
            - "CarePlan.${cp_id}.status == CLOSED"
            - "CarePlan.${cp_id}.problem_list == [pain]"

      - name: prior_auth_preempts_delivery_window_overlap_on_dme_fulfillment
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - errors[ERR_PRIOR_AUTH_REQUIRED]
          - errors[ERR_SCHEDULE_CONFLICT]
          - state_machines.DmeOrder.PENDING_AUTH_to_REQUESTED
        distinguishing_aspect: |
          Error-category pair business_referential (rung 24,
          ERR_PRIOR_AUTH_REQUIRED) versus business_temporal (rung 25,
          ERR_SCHEDULE_CONFLICT) - a different pairing from the
          business_safety/state conflict above. The same fulfillment request
          violates both, the referential rung wins, and authorizing the order
          then exposes the temporal rung on a repeat of the identical call.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE."
            - "One DmeInventoryItem of device_type HOSPITAL_BED with total_units 5 and prior_auth_required true."
            - "DmeOrder A authorized and SCHEDULED for the window 2026-06-10T09:00:00Z to 2026-06-10T11:00:00Z."
            - "DmeOrder B still in PENDING_AUTH for the overlapping window 2026-06-10T10:00:00Z to 2026-06-10T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-1010", full_name: "Jun Alvarado", date_of_birth: "1952-08-25", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/dme-inventory"
              payload: { device_type: "HOSPITAL_BED", total_units: 5, prior_auth_required: true }
              as: ProgramAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /palliative/dme-orders"
              payload: { patient_id: "${p_id}", inventory_item_id: "${inv_id}", quantity: 1, delivery_window_start: "2026-06-10T09:00:00Z", delivery_window_end: "2026-06-10T11:00:00Z" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { dme_a_id: $.data.id }
            - call: "POST /palliative/dme-orders/${dme_a_id}/authorize"
              payload: { prior_auth_reference: "PA-2026-0001" }
              as: ProgramAdmin
            - call: "POST /palliative/dme-orders/${dme_a_id}/fulfillment"
              payload: { event: "SCHEDULED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/dme-orders"
              payload: { patient_id: "${p_id}", inventory_item_id: "${inv_id}", quantity: 1, delivery_window_start: "2026-06-10T10:00:00Z", delivery_window_end: "2026-06-10T12:00:00Z" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { dme_b_id: $.data.id }
          trigger:
            - call: "POST /palliative/dme-orders/${dme_b_id}/fulfillment"
              payload: { event: "SCHEDULED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { err_auth: $.data.error_id }
            - call: "POST /palliative/dme-orders/${dme_b_id}/authorize"
              payload: { prior_auth_reference: "PA-2026-0002" }
              as: ProgramAdmin
            - call: "POST /palliative/dme-orders/${dme_b_id}/fulfillment"
              payload: { event: "SCHEDULED" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "${err_auth} == ERR_PRIOR_AUTH_REQUIRED"
            - "${err_overlap} == ERR_SCHEDULE_CONFLICT"
            - "DmeOrder.${dme_b_id}.status == REQUESTED"
            - "DmeOrder.${dme_b_id}.prior_auth_reference == PA-2026-0002"
            - "DmeInventoryItem.${inv_id}.available_units == 3"
            - "DmeInventoryItem.${inv_id}.reserved_units == 2"

  # =========================================================================
  # Rule 6 - boundary-precision checks on different metrics and endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: acp_first_unit_minimum_minutes_is_inclusive_at_sixteen
        grounds:
          - calculations.acp_billable_units
          - validations[priority=29]
          - errors[ERR_INSUFFICIENT_DOCUMENTED_TIME]
          - endpoints["POST /palliative/claims"]
        distinguishing_aspect: |
          Numeric threshold-crossing boundary on documented_minutes reached
          through POST /palliative/claims: exactly ACP_FIRST_UNIT_MIN_MINUTES
          (16) yields billable_units 1, and 15 minutes is rejected with
          ERR_INSUFFICIENT_DOCUMENTED_TIME. 45 stays at 1 unit while 46 crosses
          to 2, proving the additional-unit midpoint is also inclusive.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE with acp_paid_cents_ytd 0 and no HospiceElection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
