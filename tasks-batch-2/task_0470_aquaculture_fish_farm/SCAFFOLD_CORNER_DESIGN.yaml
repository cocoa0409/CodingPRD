              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/complete"
              payload: { harvested_fish_count: 1, harvested_live_weight_kg: 90.0 }
              as: HarvestOperator
            - call: "POST /processing-batches"
              payload: { harvest_order_id: "${ho}" }
              as: HarvestOperator
              captures: { pb: $.data.id }
            - call: "POST /processing-batches/${pb}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /processing-batches/${pb}/complete"
              payload: { actual_processed_weight_kg: 50.0, price_per_kg: 10.0 }
              as: HarvestOperator
              captures: { lotA: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_name: "Acme", discount_tier: "NONE" }
