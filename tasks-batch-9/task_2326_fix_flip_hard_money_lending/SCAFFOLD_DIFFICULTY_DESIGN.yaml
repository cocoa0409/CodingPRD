  - rule_id: non_linear_state_machine
    instances:
      - name: rehab_line_revision_cycle_reenters_proposed_then_deapproves
        grounds:
          - state_machines.RehabLineItem.PROPOSED_to_REVISION_REQUESTED
          - state_machines.RehabLineItem.REVISION_REQUESTED_to_PROPOSED
          - state_machines.RehabLineItem.PROPOSED_to_APPROVED
          - state_machines.RehabLineItem.APPROVED_to_REVISION_REQUESTED
          - entities.RehabLineItem.fields.revision_round
          - entities.RehabLineItem.fields.approved_cost_cents
          - entities.LoanApplication.fields.approved_rehab_total_cents
          - entities.LoanApplication.fields.sizing_stale
        distinguishing_aspect: |
          The scope-line machine is genuinely cyclic and re-entrant, not a forward
          pipeline: the same line occupies PROPOSED twice and REVISION_REQUESTED twice
          (rounds 1 and 2), and the second REVISION_REQUESTED is reached from APPROVED —
          a backwards edge that clears approved_cost_cents, subtracts from
          approved_rehab_total_cents and re-dirties an already-SIZED application, so
          state alone does not determine history and revision_round is the only witness.
        test_recipe:
          setup:
            - "logical clock 2026-08-10T09:00:00Z"
            - "TIER_A sponsor b1 APPROVED_SPONSOR with executed guarantee; property purchase 20,000,000 / ARV 32,000,000"
