# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x 2 instances. All chains replay from empty DB.
# Canonical program payload (unless an instance overrides a field):
#   name "P", start_date 2026-05-01, end_date 2026-10-31,
#   base 10000, increment 2500, max_household 6, multiplier 1.0,
#   daily cap 100000, du pool 200000, tier2 3, tier3 6,
#   renewal window 30, a1c threshold 0.5
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: pool_utilization_accrual_vs_cash
        grounds:
          - calculations.pool_utilization
          - entities.FundingPool.fields.disbursed_cents
          - entities.FundingPool.fields.reserved_cents
          - entities.FunderReport.fields.basis
          - entities.FunderReport.fields.utilization_cents
        distinguishing_aspect: |
          Dual-variant on the FISCAL (FundingPool/Voucher) domain: identical
          ledger data yields utilization_cents == 12500 under ACCRUAL
          (disbursed 3000 + reserved 9500) and == 3000 under CASH (disbursed
          only); the reserved 9500 is the only difference between variants.
        test_recipe:
          setup:
            - "Program ACTIVE with FUNDED pool committed 500000; one ACTIVE enrollment (household 2, STANDARD, T1 -> face 12500) with an ISSUED voucher in an OPEN cycle"
            - "One SETTLED redemption: produce 2000 + staple 3000 -> match 2000, voucher_applied 3000; pool disbursed 3000, reserved 9500"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /retailers", payload: { name: "R1", kind: "GROCERY", double_up_eligible: true }, as: ProgramAdmin, captures: { rt: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 1, start_date: "2026-05-01", end_date: "2026-06-01" }, as: ProgramAdmin, captures: { cy: $.data.id } }
            - { call: "POST /cycles/${cy}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /cycles/${cy}/issue", payload: {}, as: ProgramAdmin }
            - { call: "POST /redemptions", payload: { retailer_id: "${rt}", enrollment_id: "${en}", lines: [ { category: "PRODUCE_ELIGIBLE", amount_cents: 2000 }, { category: "STAPLE", amount_cents: 3000 } ] }, as: RetailerStaff, as_user_id: "${rt}" }
          trigger:
            - { call: "GET /programs/${pg}", payload: {}, as: ProgramAdmin, captures: { pg_v1: $.data.version } }
            - { call: "POST /programs/${pg}/funder-reports", payload: { funding_pool_id: "${pl}", period_start: "2026-05-01", period_end: "2026-06-01", basis: "ACCRUAL", expected_program_version: "${pg_v1}" }, as: ProgramAdmin, captures: { rep_a: $.data.id, util_a: $.data.utilization_cents } }
            - { call: "GET /programs/${pg}", payload: {}, as: ProgramAdmin, captures: { pg_v2: $.data.version } }
            - { call: "POST /programs/${pg}/funder-reports", payload: { funding_pool_id: "${pl}", period_start: "2026-06-01", period_end: "2026-07-01", basis: "CASH", expected_program_version: "${pg_v2}" }, as: ProgramAdmin, captures: { rep_b: $.data.id, util_b: $.data.utilization_cents } }
          assert:
            - "FunderReport.${rep_a}.utilization_cents == 12500 (ACCRUAL: disbursed 3000 + reserved 9500)"
            - "FunderReport.${rep_b}.utilization_cents == 3000 (CASH: disbursed only)"
            - "util_a != util_b for identical ledger state"

      - name: a1c_delta_inclusive_vs_verified
        grounds:
          - calculations.a1c_outcome_delta
          - entities.BiometricReading.fields.source
          - entities.BiometricReading.fields.measured_at
        distinguishing_aspect: |
          Dual-variant on the CLINICAL-OUTCOME (BiometricReading/Enrollment)
          domain: with baseline LAB_VERIFIED 8.0 and latest SELF_REPORT 6.9 the
          inclusive variant reports the enrollment improved (delta -1.1 <= -0.5)
          while the verified variant reports it NOT improved (fewer than 2
          LAB_VERIFIED readings) — same raw data, different outcome counts.
        test_recipe:
          setup:
            - "Program ACTIVE with FUNDED pool; one ACTIVE enrollment"
            - "A1C readings: LAB_VERIFIED 8.0 measured 2026-05-10; SELF_REPORT 6.9 measured 2026-06-01"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "POST /enrollments/${en}/biometric-readings", payload: { kind: "A1C", value: 8.0, measured_at: "2026-05-10T00:00:00Z", source: "LAB_VERIFIED" }, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /enrollments/${en}/biometric-readings", payload: { kind: "A1C", value: 6.9, measured_at: "2026-06-01T00:00:00Z", source: "SELF_REPORT" }, as: ClinicStaff, as_user_id: "${cl}" }
          trigger:
            - { call: "GET /programs/${pg}/summary", payload: {}, as: ProgramAdmin, captures: { inc: $.data.a1c_improved_inclusive_count, ver: $.data.a1c_improved_verified_count } }
          assert:
            - "summary.a1c_improved_inclusive_count == 1 (delta 6.9 - 8.0 == -1.1 <= -0.5)"
            - "summary.a1c_improved_verified_count == 0 (only one LAB_VERIFIED reading exists)"

  - rule_id: combinatorial_formula
    instances:
      - name: benefit_face_tier_priority_household_cap
        grounds:
          - calculations.monthly_benefit_allocation
          - entities.Enrollment.fields.engagement_tier
          - entities.Voucher.fields.face_value_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: three interacting inputs — household_size 9
          capped to 6 (min), engagement tier T2 (conditional 1.10), URGENT
          referral priority (conditional 1.10) — compose multiplicatively:
          round_half_up(22500 * 1.10 * 1.10) == 27225.
        test_recipe:
          setup:
            - "Program ACTIVE; enrollment from URGENT referral with household_size 9"
            - "Three COMPLETED sessions each with a passed completion for the enrollment (tier T2 at exactly 3)"
            - "Cycle 1 OPEN and issued AFTER the tier promotion"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat Nine", date_of_birth: "1975-03-03", household_size: 9 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "URGENT" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "POST /programs/${pg}/education-sessions", payload: { topic: "T1", venue: "RM-1", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", capacity: 10, educator_ref: "ed-1" }, as: Educator, captures: { s1: $.data.id } }
            - { call: "POST /education-sessions/${s1}/complete", payload: {}, as: Educator }
            - { call: "POST /education-sessions/${s1}/completions", payload: { enrollment_id: "${en}", minutes_attended: 60, passed: true }, as: Educator }
            - { call: "POST /programs/${pg}/education-sessions", payload: { topic: "T2", venue: "RM-1", starts_at: "2026-05-11T10:00:00Z", ends_at: "2026-05-11T11:00:00Z", capacity: 10, educator_ref: "ed-1" }, as: Educator, captures: { s2: $.data.id } }
            - { call: "POST /education-sessions/${s2}/complete", payload: {}, as: Educator }
            - { call: "POST /education-sessions/${s2}/completions", payload: { enrollment_id: "${en}", minutes_attended: 60, passed: true }, as: Educator }
            - { call: "POST /programs/${pg}/education-sessions", payload: { topic: "T3", venue: "RM-1", starts_at: "2026-05-12T10:00:00Z", ends_at: "2026-05-12T11:00:00Z", capacity: 10, educator_ref: "ed-1" }, as: Educator, captures: { s3: $.data.id } }
            - { call: "POST /education-sessions/${s3}/complete", payload: {}, as: Educator }
            - { call: "POST /education-sessions/${s3}/completions", payload: { enrollment_id: "${en}", minutes_attended: 60, passed: true }, as: Educator }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 1, start_date: "2026-05-01", end_date: "2026-06-01" }, as: ProgramAdmin, captures: { cy: $.data.id } }
            - { call: "POST /cycles/${cy}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /cycles/${cy}/issue", payload: {}, as: ProgramAdmin, captures: { n: $.data.issued_count } }
          trigger:
            - { call: "GET /vouchers", payload: {}, as: ProgramAdmin, captures: { face: "$.data[0].face_value_cents" } }
          assert:
            - "issued_count == 1"
            - "voucher.face_value_cents == 27225 (round_half_up(22500 * 1.10 * 1.10); household 9 capped at 6 -> base 22500)"
            - "GET /vouchers?enrollment_id filter returns the enrollment's single voucher"

      - name: double_up_match_per_line_rounding
        grounds:
          - calculations.double_up_match
          - entities.Redemption.fields.match_cents
          - entities.Redemption.fields.voucher_applied_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (different mode from the tiered benefit
          formula): rounding is pinned PER LINE then summed. With multiplier
          0.5 and produce lines 101, 101, 103 the per-line rounding yields
          51+51+52 == 154, while round-half-up of the summed 305*0.5 would
          yield 153 — the two orders provably diverge by 1 cent.
        test_recipe:
          setup:
            - "Program ACTIVE with double_up_multiplier 0.5, daily cap 100000, du pool 200000; enrollment household 1 STANDARD T1 -> face 10000; voucher ISSUED"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 0.5, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /retailers", payload: { name: "R1", kind: "GROCERY", double_up_eligible: true }, as: ProgramAdmin, captures: { rt: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 1 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 1, start_date: "2026-05-01", end_date: "2026-06-01" }, as: ProgramAdmin, captures: { cy: $.data.id } }
            - { call: "POST /cycles/${cy}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /cycles/${cy}/issue", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /redemptions", payload: { retailer_id: "${rt}", enrollment_id: "${en}", lines: [ { category: "PRODUCE_ELIGIBLE", amount_cents: 101 }, { category: "PRODUCE_ELIGIBLE", amount_cents: 101 }, { category: "PRODUCE_ELIGIBLE", amount_cents: 103 } ] }, as: RetailerStaff, as_user_id: "${rt}", captures: { rd: $.data.id, m: $.data.match_cents, va: $.data.voucher_applied_cents, pp: $.data.patient_pay_cents } }
          assert:
            - "Redemption.${rd}.match_cents == 154 (per-line rounding: 51+51+52), NOT 153 (sum-then-round of 305*0.5)"
            - "Redemption.${rd}.voucher_applied_cents == 151 (min(10000, 305-154))"
            - "Redemption.${rd}.patient_pay_cents == 0"

  - rule_id: non_linear_state_machine
    instances:
      - name: referral_decline_appeal_approve_cycle
        grounds:
          - state_machines.Referral.DECLINED_to_UNDER_REVIEW
          - state_machines.Referral.UNDER_REVIEW_to_DECLINED
          - entities.Referral.fields.appeal_count
        distinguishing_aspect: |
          Cyclic machine on Referral: UNDER_REVIEW -> DECLINED -> UNDER_REVIEW
          -> APPROVED succeeds and appeal_count == 1; the cycle is on the
          Referral entity (distinct from the FunderReport cycle instance).
        test_recipe:
          setup:
            - "Program ACTIVE with FUNDED pool; clinic; patient with GRANTED consent; referral SUBMITTED"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
          trigger:
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/decline", payload: { decision_reason: "incomplete labs" }, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/appeal", payload: { appeal_reason: "labs attached" }, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "GET /referrals/${rf}", payload: {}, as: ProgramAdmin, captures: { st: $.data.status, ac: $.data.appeal_count } }
            - { call: "GET /enrollments/${en}", payload: {}, as: ProgramAdmin, captures: { est: $.data.status } }
          assert:
            - "Referral.${rf}.status == APPROVED after the DECLINED -> UNDER_REVIEW loop"
            - "Referral.${rf}.appeal_count == 1"
            - "Enrollment.${en}.status == ACTIVE"

      - name: funder_report_return_resubmit_accept_cycle
        grounds:
          - state_machines.FunderReport.SUBMITTED_to_RETURNED
          - state_machines.FunderReport.RETURNED_to_SUBMITTED
          - entities.FunderReport.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on FunderReport (different entity from the Referral
          cycle): DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED -> ACCEPTED with
          revision_count == 1 after exactly one return.
        test_recipe:
          setup:
            - "Program ACTIVE with FUNDED pool committed 500000 (no enrollments needed)"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /programs/${pg}", payload: {}, as: ProgramAdmin, captures: { pg_v: $.data.version } }
            - { call: "POST /programs/${pg}/funder-reports", payload: { funding_pool_id: "${pl}", period_start: "2026-05-01", period_end: "2026-06-01", basis: "CASH", expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { rep: $.data.id } }
            - { call: "POST /funder-reports/${rep}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /funder-reports/${rep}/return", payload: { return_reason: "missing narrative" }, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /funder-reports/${rep}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /funder-reports/${rep}/accept", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "GET /funder-reports/${rep}", payload: {}, as: ProgramAdmin, captures: { st: $.data.status, rc: $.data.revision_count } }
          assert:
            - "FunderReport.${rep}.status == ACCEPTED"
            - "FunderReport.${rep}.revision_count == 1"

  - rule_id: transitive_cascade
    instances:
      - name: funder_suspend_cascades_pool_program_enrollment
        grounds:
          - state_machines.Funder.ACTIVE_to_SUSPENDED
          - state_machines.FundingPool.FUNDED_to_SUSPENDED
          - state_machines.Program.ACTIVE_to_FROZEN
          - state_machines.Enrollment.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger (funder suspend): Funder ->
          SUSPENDED causes FundingPool -> SUSPENDED, whose mutation causes
          Program -> FROZEN, whose mutation causes Enrollment -> SUSPENDED;
          each hop is caused by the previous hop, not by the original call.
        test_recipe:
          setup:
            - "Funder ACTIVE; program ACTIVE with its single FUNDED pool; one ACTIVE enrollment"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
          trigger:
            - { call: "POST /funders/${fu}/suspend", payload: {}, as: ProgramAdmin }
            - { call: "GET /funding-pools/${pl}", payload: {}, as: ProgramAdmin, captures: { plst: $.data.status } }
            - { call: "GET /programs/${pg}", payload: {}, as: ProgramAdmin, captures: { pgst: $.data.status } }
            - { call: "GET /enrollments/${en}", payload: {}, as: ProgramAdmin, captures: { enst: $.data.status } }
          assert:
            - "FundingPool.${pl}.status == SUSPENDED"
            - "Program.${pg}.status == FROZEN"
            - "Enrollment.${en}.status == SUSPENDED (frozen-program cascade, not a manual suspend)"

      - name: cycle_close_expires_voucher_and_releases_reserve
        grounds:
          - state_machines.BenefitCycle.OPEN_to_CLOSED
          - state_machines.Voucher.ISSUED_to_EXPIRED
          - calculations.cycle_close_settlement
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (cycle close): close mutates
          the voucher (ISSUED -> EXPIRED), and that voucher mutation itself
          releases the pool reserve (reserved 9500 -> 0, available 487500 ->
          497000) while disbursed 3000 stays put.
        test_recipe:
          setup:
            - "Standard ACTIVE program, pool 500000, enrollment face 12500, voucher ISSUED; one redemption (produce 2000 + staple 3000) settled -> voucher remaining 9500, pool disbursed 3000 / reserved 9500 / available 487500"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /retailers", payload: { name: "R1", kind: "GROCERY", double_up_eligible: true }, as: ProgramAdmin, captures: { rt: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 1, start_date: "2026-05-01", end_date: "2026-06-01" }, as: ProgramAdmin, captures: { cy: $.data.id } }
            - { call: "POST /cycles/${cy}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /cycles/${cy}/issue", payload: {}, as: ProgramAdmin }
            - { call: "GET /vouchers", payload: {}, as: ProgramAdmin, captures: { vc: "$.data[0].id" } }
            - { call: "POST /redemptions", payload: { retailer_id: "${rt}", enrollment_id: "${en}", lines: [ { category: "PRODUCE_ELIGIBLE", amount_cents: 2000 }, { category: "STAPLE", amount_cents: 3000 } ] }, as: RetailerStaff, as_user_id: "${rt}" }
          trigger:
            - { call: "POST /cycles/${cy}/close", payload: {}, as: ProgramAdmin }
            - { call: "GET /vouchers/${vc}", payload: {}, as: ProgramAdmin, captures: { vcs: $.data.status } }
            - { call: "GET /funding-pools/${pl}", payload: {}, as: ProgramAdmin, captures: { res: $.data.reserved_cents, dis: $.data.disbursed_cents, avl: $.data.available_cents } }
          assert:
            - "Voucher.${vc}.status == EXPIRED"
            - "FundingPool.${pl}.reserved_cents == 0 (was 9500)"
            - "FundingPool.${pl}.disbursed_cents == 3000 (unchanged by expiry)"
            - "FundingPool.${pl}.available_cents == 497000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_referral_program_frozen_beats_consent_revoked
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_PROGRAM_NOT_ACTIVE]
          - errors[ERR_CONSENT_REVOKED]
        distinguishing_aspect: |
          Error-category pair state (6) vs business_safety (7): the approve
          request violates BOTH (program FROZEN after funder suspension AND
          patient consent REVOKED); the state error ERR_PROGRAM_NOT_ACTIVE must
          win over ERR_CONSENT_REVOKED.
        test_recipe:
          setup:
            - "Program ACTIVE, referral UNDER_REVIEW; then consent revoked; then funder suspended (program FROZEN)"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /patients/${pt}/revoke-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /funders/${fu}/suspend", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_NOT_ACTIVE (state priority 6 beats business_safety priority 7)"
            - "error_id != ERR_CONSENT_REVOKED"
            - "Referral.${rf} remains UNDER_REVIEW (no side effects fired)"

      - name: create_referral_consent_revoked_beats_clinic_cap
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_CONSENT_REVOKED]
          - errors[ERR_CLINIC_REFERRAL_CAP]
        distinguishing_aspect: |
          Different error-category pair from the program-frozen instance:
          business_safety (7) vs business_constraint (9). The referral create
          violates BOTH (patient consent REVOKED AND clinic at
          max_active_referrals == 1); ERR_CONSENT_REVOKED must win.
        test_recipe:
          setup:
            - "Program ACTIVE; clinic max_active_referrals 1 with one SUBMITTED referral already occupying the cap; second patient with consent REVOKED"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 1 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt1: $.data.id } }
            - { call: "POST /patients/${pt1}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt1}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf1: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat Two", date_of_birth: "1982-06-20", household_size: 3 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt2: $.data.id } }
            - { call: "POST /patients/${pt2}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /patients/${pt2}/revoke-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
          trigger:
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt2}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONSENT_REVOKED (business_safety priority 7 beats business_constraint priority 9)"
            - "error_id != ERR_CLINIC_REFERRAL_CAP"

  - rule_id: boundary_precision_check
