            - "no lower-priority guard did the work in any of the three calls: Customer CUST-P5 is ACTIVE (ERR_CUSTOMER_NOT_ACTIVE vacuous), both units are DELIVERED (ERR_UNIT_NOT_DELIVERED vacuous), every expected_product_model_version came from a GET immediately before its call (ERR_STALE_PRODUCT_MODEL_VERSION vacuous), and warranty_reserve_cents 500000 has never been drawn on (ERR_WARRANTY_RESERVE_EXHAUSTED vacuous)"
