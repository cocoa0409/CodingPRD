# =============================================================================
# Task 1584 — Crop Hail & Livestock Mortality Insurance Carrier
# =============================================================================
# Scenario (verbatim from requester):
#   Crop Hail & Livestock Mortality Insurance (crop insurance carrier): coverage
#   application & acre/head reporting, rate by county/crop or species/value, claim
#   notification & adjuster field inspection, loss determination (percent
#   damage/appraisal) & indemnity calculation, deadline for planting/harvest
#   reporting, mortality claim documentation (veterinary/necropsy) requirements,
#   policy interaction with federal crop insurance, renewal & continuous coverage
#   rules

scenario: |
  Crop Hail & Livestock Mortality Insurance (crop insurance carrier): coverage
  application & acre/head reporting, rate by county/crop or species/value, claim
  notification & adjuster field inspection, loss determination (percent
  damage/appraisal) & indemnity calculation, deadline for planting/harvest
  reporting, mortality claim documentation (veterinary/necropsy) requirements,
  policy interaction with federal crop insurance, renewal & continuous coverage
  rules.

domain_name: crop-hail-livestock-mortality-insurance
api_prefix: /carriers

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on Policy.version for endorsements & renewals
    - cascading_side_effects        # indemnity approval → ledger → premium_reserve → reinsurance_posture
    - dual_variant_calculation      # provisional (adjuster field estimate) vs final (loss-determination board) indemnity
    - temporal_windowing            # planting/harvest reporting deadlines relative to policy effective dates

  entity_topology: hybrid            # Carrier → Policy → CoverageUnit tree, with Claim cross-cutting
  state_machine_shape: parallel      # Policy has lifecycle_state × billing_state; Claim has parallel doc_state
  relationship_patterns:
    - one_to_many                    # Policy → CoverageUnit → AcreageReport
    - many_to_many                   # Policy ↔ FederalCropPolicy (junction DualCoverageLink)
    - cross_aggregate                # Claim references CoverageUnit AND Adjuster
    - self_referential               # Renewal.prior_policy_id references Policy

  role_model: segregation_of_duties  # Adjuster who inspects cannot also approve loss; Underwriter distinct from ClaimsApprover
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: carrier_code, type: string, source: input, description: "Unique carrier code (e.g. 'CHL-001'); unique across carriers" }
      - { name: legal_name, type: string, source: input, description: "Legal name of the insurance carrier" }
      - { name: current_utc, type: datetime, source: system, description: "Logical clock for the carrier; server starts at 2026-08-01T00:00:00Z; advanced only via POST /_clock/set_current_utc" }
      - { name: reinsurance_treaty_attachment_cents, type: integer, source: input, description: "Aggregate indemnity dollars (cents) above which reinsurance attaches; used to compute CarrierReinsurancePosture" }

  - name: Grower
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "References Carrier.id; owning carrier" }
      - { name: full_name, type: string, source: input, description: "Grower legal name" }
      - { name: tax_id_last4, type: string, source: input, description: "Last 4 digits of SSN/EIN; used as duplicate-guard key" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: county_code, type: string, source: input, description: "Primary county FIPS code (5-char)" }
      - { name: state_code, type: string, source: input, description: "2-letter state code" }
      - { name: continuous_coverage_since, type: datetime, source: computed, description: "Null until first renewal; set from earliest un-broken coverage period start" }
      - { name: prior_claims_count, type: integer, source: computed, default: 0, description: "Count of Claims in APPROVED or PAID status linked to this grower's policies; drives high-risk premium surcharge" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DEBARRED", constraints: "SUSPENDED on unpaid premium > 30d; DEBARRED on proven fraud" }

  - name: FederalCropPolicy
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "References Carrier.id; owning carrier" }
      - { name: grower_id, type: string, source: input, description: "References Grower.id; insured grower" }
      - { name: fci_policy_number, type: string, source: input, description: "FCIC-issued policy number (federal multi-peril crop insurance)" }
      - { name: coverage_level_pct, type: number, source: input, description: "Federal coverage level 0.50–0.85" }
      - { name: crop_code, type: string, source: input, description: "FCIC crop code (e.g. 'CORN', 'WHEAT')" }
      - { name: county_code, type: string, source: input, description: "County FIPS where federal coverage attaches" }
      - { name: effective_date, type: datetime, source: input, description: "Federal policy effective date" }
      - { name: expiration_date, type: datetime, source: input, description: "Federal policy expiration date" }
      - { name: liability_cents, type: integer, source: input, description: "Federal liability in cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | CANCELLED" }

  - name: RateTable
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "References Carrier.id; owning carrier" }
      - { name: rating_kind, type: enum, source: input, description: "CROP_HAIL | LIVESTOCK_MORTALITY" }
      - { name: county_code, type: string, source: input, description: "County FIPS for crop-hail rating; nullable when rating_kind=LIVESTOCK_MORTALITY" }
      - { name: crop_code, type: string, source: input, description: "Crop code for crop-hail rating; nullable when rating_kind=LIVESTOCK_MORTALITY" }
      - { name: species, type: enum, source: input, description: "CATTLE | SWINE | POULTRY | EQUINE | SHEEP; nullable when rating_kind=CROP_HAIL" }
      - { name: value_band_floor_cents, type: integer, source: input, description: "Inclusive floor of animal value band (cents); only for LIVESTOCK_MORTALITY" }
      - { name: value_band_ceiling_cents, type: integer, source: input, description: "Exclusive ceiling of animal value band (cents); only for LIVESTOCK_MORTALITY" }
      - { name: rate_per_100_cents_of_liability, type: integer, source: input, description: "Premium cents per 100 cents of liability; e.g. 350 = $3.50 per $100" }
      - { name: effective_from, type: datetime, source: input, description: "Rate effective-from timestamp (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Rate effective-to timestamp (exclusive; null means open-ended)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED" }

  - name: Policy
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "References Carrier.id; owning carrier" }
      - { name: grower_id, type: string, source: input, description: "References Grower.id; insured grower" }
      - { name: policy_kind, type: enum, source: input, description: "CROP_HAIL | LIVESTOCK_MORTALITY" }
      - { name: policy_number, type: string, source: system, description: "Server-minted unique policy number 'POL-<carrier_code>-<seq>'" }
      - { name: effective_date, type: datetime, source: input, description: "Coverage effective (inclusive)" }
      - { name: expiration_date, type: datetime, source: input, description: "Coverage expiration (exclusive)" }
      - { name: acreage_report_deadline, type: datetime, source: computed, description: "Crop-hail only: effective_date + 21 days; deadline for submitting planting/acre report" }
      - { name: harvest_report_deadline, type: datetime, source: computed, description: "Crop-hail only: expiration_date - 14 days; deadline for harvest-report submission" }
      - { name: head_report_deadline, type: datetime, source: computed, description: "Livestock only: effective_date + 10 days; deadline for initial head-count report" }
      - { name: premium_cents, type: integer, source: computed, default: 0, description: "Aggregate premium across all bound CoverageUnits" }
      - { name: premium_paid_cents, type: integer, source: system, default: 0, description: "Cumulative premium collected; grows on POST /premium-payments" }
      - { name: premium_reserve_cents, type: integer, source: computed, default: 0, description: "Reserve = 60% of premium_cents minus cumulative APPROVED+PAID indemnity cents; floor 0" }
      - { name: continuous_coverage_carryover_credit_cents, type: integer, source: computed, default: 0, description: "Renewal-only: 5% of prior Policy.premium_cents if the prior policy expired no more than 7 days before this policy's effective_date and was not cancelled; otherwise 0" }
      - { name: high_risk_surcharge_pct, type: integer, source: computed, default: 0, description: "0 if grower.prior_claims_count <= 1; 10 if 2-3; 25 if >=4" }
      - { name: lifecycle_state, type: enum, source: system, description: "APPLICATION | BOUND | ACTIVE | EXPIRED | CANCELLED | NON_RENEWED" }
      - { name: billing_state, type: enum, source: system, description: "UNBILLED | BILLED | PARTIALLY_PAID | PAID_IN_FULL | DELINQUENT" }
      - { name: claims_posture, type: enum, source: system, description: "OPEN | RESTRICTED; RESTRICTED when billing_state=DELINQUENT or lifecycle_state in {EXPIRED, CANCELLED, NON_RENEWED}" }
      - { name: prior_policy_id, type: string, source: input, description: "References Policy.id; self-referential. Set only on renewals; identifies the policy this one renews" }
      - { name: dual_coverage_link_id, type: string, source: system, description: "References DualCoverageLink.id; set when a DualCoverageLink referencing this policy is created; null otherwise" }
      - { name: version_note, type: string, source: system, description: "OCC target — version increments on every mutation including cascaded side effects" }

  - name: CoverageUnit
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "References Policy.id; parent policy" }
      - { name: unit_kind, type: enum, source: system, description: "Mirrors Policy.policy_kind: CROP_HAIL or LIVESTOCK_MORTALITY" }
      - { name: county_code, type: string, source: input, description: "Crop-hail only: FIPS where the acreage sits; must match an active RateTable row" }
      - { name: crop_code, type: string, source: input, description: "Crop-hail only; must match RateTable" }
      - { name: declared_acres, type: integer, source: input, description: "Crop-hail only: whole acres declared; 1..100000" }
      - { name: species, type: enum, source: input, description: "Livestock only: CATTLE | SWINE | POULTRY | EQUINE | SHEEP" }
      - { name: declared_head_count, type: integer, source: input, description: "Livestock only: number of animals insured; 1..100000" }
      - { name: per_head_value_cents, type: integer, source: input, description: "Livestock only: declared value per head (cents); selects RateTable value band" }
      - { name: liability_cents, type: integer, source: computed, description: "Crop-hail: declared_acres * per-acre exposure constant (USD_CENTS_PER_ACRE=40000); Livestock: declared_head_count * per_head_value_cents" }
      - { name: premium_cents, type: integer, source: computed, description: "Crop-hail: round_half_up(liability_cents * rate_per_100 / 10000). Livestock: same shape. Surcharge applies at policy level" }
      - { name: status, type: enum, source: system, description: "PENDING_REPORT | REPORTED | LAPSED_REPORT | UNDER_CLAIM | SETTLED" }

  - name: AcreageReport
    parent: CoverageUnit
    common_fields: true
    fields:
      - { name: coverage_unit_id, type: string, source: system, description: "References CoverageUnit.id; parent coverage unit (crop-hail only)" }
      - { name: report_kind, type: enum, source: input, description: "PLANTING | HARVEST" }
      - { name: reported_acres, type: integer, source: input, description: "Acres actually planted/harvested" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp at submission" }
      - { name: is_timely, type: boolean, source: computed, description: "PLANTING: submitted_at <= Policy.acreage_report_deadline. HARVEST: submitted_at <= Policy.harvest_report_deadline" }
      - { name: lateness_days, type: integer, source: computed, default: 0, description: "0 when timely; otherwise integer days past deadline (fraction rounded up)" }
      - { name: coverage_reduction_pct, type: integer, source: computed, default: 0, description: "0 when timely; min(100, lateness_days * 5) when late; applied to liability when claim settles" }

  - name: HeadReport
    parent: CoverageUnit
    common_fields: true
    fields:
      - { name: coverage_unit_id, type: string, source: system, description: "References CoverageUnit.id; parent coverage unit (livestock only)" }
      - { name: report_kind, type: enum, source: input, description: "INITIAL | INTERIM | FINAL" }
      - { name: reported_head_count, type: integer, source: input, description: "Head count at report time" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp at submission" }
      - { name: is_timely, type: boolean, source: computed, description: "INITIAL: submitted_at <= Policy.head_report_deadline. INTERIM/FINAL always timely if policy is ACTIVE." }
      - { name: lateness_days, type: integer, source: computed, default: 0, description: "0 when timely; otherwise integer days past deadline" }
      - { name: coverage_reduction_pct, type: integer, source: computed, default: 0, description: "0 when timely; min(100, lateness_days * 5) when INITIAL is late; INTERIM/FINAL never reduce coverage" }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "References Policy.id; parent policy" }
      - { name: coverage_unit_id, type: string, source: input, description: "References CoverageUnit.id; the unit sustaining the loss" }
      - { name: claim_kind, type: enum, source: system, description: "Mirrors Policy.policy_kind: HAIL_DAMAGE | LIVESTOCK_MORTALITY" }
      - { name: loss_date, type: datetime, source: input, description: "When the loss occurred; must fall within [Policy.effective_date, Policy.expiration_date)" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock timestamp at first notice of loss" }
      - { name: reported_within_window, type: boolean, source: computed, description: "true iff reported_at <= loss_date + 72 hours (crop-hail) or loss_date + 24 hours (livestock)" }
      - { name: late_notification_penalty_pct, type: integer, source: computed, default: 0, description: "0 when reported_within_window; 10 when reported within 7d but past window; 25 when 7d..30d past; claim not payable when > 30d past" }
      - { name: percent_damage_estimate_pct, type: integer, source: input, description: "Crop-hail only: grower's initial estimate of percent damage 1..100" }
      - { name: appraisal_value_cents, type: integer, source: input, description: "Livestock only: grower's claimed appraised value of the deceased animal(s)" }
      - { name: deceased_head_count, type: integer, source: input, description: "Livestock only: number of dead animals; 1..CoverageUnit.declared_head_count" }
      - { name: adjuster_id, type: string, source: system, description: "References Adjuster.id; adjuster assigned for field inspection; null until assigned" }
      - { name: provisional_indemnity_cents, type: integer, source: computed, default: 0, description: "Adjuster's field-estimate indemnity, set when FieldInspection is submitted" }
      - { name: final_indemnity_cents, type: integer, source: computed, default: 0, description: "Final indemnity after loss-determination board review; written on APPROVE" }
      - { name: claim_state, type: enum, source: system, description: "REPORTED | INSPECTION_SCHEDULED | INSPECTED | UNDER_REVIEW | APPROVED | DENIED | PAID | WITHDRAWN | CLOSED_UNTIMELY" }
      - { name: doc_posture, type: enum, source: system, description: "DOCS_PENDING | DOCS_COMPLETE | DOCS_WAIVED; independent axis; gates livestock claim APPROVE transition" }

  - name: Adjuster
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "References Carrier.id; owning carrier" }
      - { name: full_name, type: string, source: input, description: "Adjuster legal name" }
      - { name: license_number, type: string, source: input, description: "State adjuster license; unique per carrier" }
      - { name: county_codes, type: array, source: input, description: "List of FIPS codes the adjuster is licensed to inspect" }
      - { name: species_qualified, type: array, source: input, description: "List of species the adjuster is qualified to appraise" }
      - { name: capacity_max_open_claims, type: integer, source: input, description: "Maximum concurrent open claims (REPORTED/INSPECTION_SCHEDULED/INSPECTED/UNDER_REVIEW)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: FieldInspection
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "References Claim.id; parent claim" }
      - { name: adjuster_id, type: string, source: input, description: "References Adjuster.id; must match Claim.adjuster_id" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned inspection timestamp" }
      - { name: inspected_at, type: datetime, source: system, description: "Logical-clock time when SUBMIT executes" }
      - { name: within_inspection_window, type: boolean, source: computed, description: "true iff inspected_at <= Claim.reported_at + 7 days" }
      - { name: observed_percent_damage_pct, type: integer, source: input, description: "Crop-hail only: adjuster's observed percent damage 0..100" }
      - { name: observed_appraisal_cents, type: integer, source: input, description: "Livestock only: adjuster's observed appraisal value" }
      - { name: observed_deceased_count, type: integer, source: input, description: "Livestock only: adjuster's observed deceased count" }
      - { name: provisional_indemnity_cents, type: integer, source: computed, description: "See calculation provisional_indemnity; written back onto Claim.provisional_indemnity_cents" }
      - { name: notes, type: string, source: input, description: "Free-form adjuster notes" }

  - name: VeterinaryReport
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "References Claim.id; parent claim (livestock only)" }
      - { name: veterinarian_license, type: string, source: input, description: "Attending veterinarian license number" }
      - { name: report_kind, type: enum, source: input, description: "VETERINARY_CERTIFICATE | NECROPSY_REPORT | THIRD_PARTY_AFFIDAVIT" }
      - { name: cause_of_death, type: string, source: input, description: "Free-form cause; must be non-empty for VETERINARY_CERTIFICATE and NECROPSY_REPORT" }
      - { name: necropsy_performed, type: boolean, source: input, description: "true iff necropsy was performed; required for claims > $5,000" }
      - { name: death_date, type: datetime, source: input, description: "Vet-attested death date; must equal Claim.loss_date within ±2 days" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp" }

  - name: LossDetermination
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "References Claim.id; parent claim" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the ClaimsApprover; recorded for segregation-of-duties audit" }
      - { name: decision, type: enum, source: input, description: "APPROVE | DENY | PARTIAL" }
      - { name: approved_indemnity_cents, type: integer, source: input, description: "Approver-adjusted final indemnity; must be 0 when decision=DENY; may differ from provisional" }
      - { name: applied_coverage_reduction_pct, type: integer, source: computed, description: "From latest late AcreageReport/HeadReport if any; applied on top of approver's amount" }
      - { name: applied_late_notification_penalty_pct, type: integer, source: computed, description: "From Claim.late_notification_penalty_pct" }
      - { name: applied_dual_coverage_offset_cents, type: integer, source: computed, description: "Offset for federal dual coverage: min(provisional or approved, federal.liability_cents * 20%)" }
      - { name: final_indemnity_cents, type: integer, source: computed, description: "See calculation final_indemnity" }
      - { name: denial_reason_code, type: enum, source: input, description: "FRAUD | NOT_COVERED_PERIL | LATE_NOTICE_OVER_30D | MISSING_DOCS | POLICY_INACTIVE; required when decision=DENY" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock time at decision" }

  - name: IndemnityPayment
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "References Claim.id; parent claim" }
      - { name: amount_cents, type: integer, source: system, description: "Always equals Claim.final_indemnity_cents at time of issue; captured snapshot" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp" }
      - { name: payment_method, type: enum, source: input, description: "ACH | CHECK | WIRE" }
      - { name: status, type: enum, source: system, description: "ISSUED | CLEARED | VOID" }

  - name: DualCoverageLink
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "References Policy.id; private crop-hail policy" }
      - { name: federal_crop_policy_id, type: string, source: input, description: "References FederalCropPolicy.id; paired federal policy" }
      - { name: offset_pct_of_federal_liability, type: integer, source: system, default: 20, description: "Fixed 20%; the dual-coverage offset applied at loss determination" }
      - { name: established_at, type: datetime, source: system, description: "Logical-clock timestamp at link" }

  - name: Renewal
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "References Policy.id; the NEW policy produced by this renewal" }
      - { name: prior_policy_id, type: string, source: input, description: "References Policy.id; the policy being renewed" }
      - { name: continuity_gap_days, type: integer, source: computed, description: "Days between prior.expiration_date and new effective_date; 0 when contiguous" }
      - { name: carryover_credit_cents, type: integer, source: computed, description: "5% of prior Policy.premium_cents when continuity_gap_days <= 7 and prior.lifecycle_state was EXPIRED (not CANCELLED); else 0" }
      - { name: decision, type: enum, source: input, description: "RENEW | NON_RENEW" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock time at decision" }

  - name: PremiumPayment
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "References Policy.id; parent policy" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock timestamp" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Policy
    initial_state: APPLICATION
    terminal_states: [EXPIRED, CANCELLED, NON_RENEWED]
    # NOTE: Policy has TWO parallel state dimensions: lifecycle_state and billing_state.
    # They evolve independently. claims_posture is DERIVED from both.
    transitions:
      # --- lifecycle_state transitions ---
      - from: APPLICATION
        to: BOUND
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/bind"
        actor: Underwriter
        preconditions:
          - "Policy.lifecycle_state == APPLICATION (ERR_POLICY_NOT_IN_APPLICATION)"
          - "At least one CoverageUnit exists for this policy (ERR_NO_COVERAGE_UNITS)"
          - "Each CoverageUnit's crop_hail (county,crop) or livestock (species,value_band) matches a PUBLISHED RateTable whose [effective_from, effective_to) contains the binding clock time (ERR_NO_ACTIVE_RATE_TABLE)"
          - "Grower.status == ACTIVE (ERR_GROWER_NOT_ACTIVE)"
          - "If prior_policy_id set: prior policy exists and belongs to same grower (ERR_INVALID_PRIOR_POLICY)"
        side_effects:
          - "lifecycle_state := BOUND"
          - "premium_cents := sum over CoverageUnits of CoverageUnit.premium_cents (after surcharge application)"
          - "billing_state := BILLED"
          - "premium_reserve_cents := floor(premium_cents * 0.60)"
          - "increments Policy.version by 1"
      - from: BOUND
        to: ACTIVE
        trigger: "system (automatic when logical clock reaches Policy.effective_date AND billing_state != DELINQUENT)"
        actor: system
        preconditions:
          - "current_utc >= Policy.effective_date"
          - "billing_state IN {BILLED, PARTIALLY_PAID, PAID_IN_FULL}"
        side_effects:
          - "lifecycle_state := ACTIVE"
          - "increments Policy.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock reaches Policy.expiration_date)"
        actor: system
        preconditions:
          - "current_utc >= Policy.expiration_date"
        side_effects:
          - "lifecycle_state := EXPIRED"
          - "claims_posture := RESTRICTED"
          - "All CoverageUnits in PENDING_REPORT → LAPSED_REPORT"
          - "increments Policy.version by 1"
      - from: BOUND
        to: CANCELLED
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/cancel"
        actor: Underwriter
        preconditions:
          - "lifecycle_state IN {BOUND, ACTIVE} (ERR_POLICY_NOT_CANCELLABLE)"
          - "No Claims in {INSPECTION_SCHEDULED, INSPECTED, UNDER_REVIEW, APPROVED} (ERR_OPEN_CLAIMS_BLOCK_CANCEL)"
        side_effects:
          - "lifecycle_state := CANCELLED"
          - "claims_posture := RESTRICTED"
          - "Claims in REPORTED → WITHDRAWN"
          - "premium_reserve_cents := 0"
          - "increments Policy.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/cancel"
        actor: Underwriter
        preconditions:
          - "lifecycle_state IN {BOUND, ACTIVE} (ERR_POLICY_NOT_CANCELLABLE)"
          - "No Claims in {INSPECTION_SCHEDULED, INSPECTED, UNDER_REVIEW, APPROVED} (ERR_OPEN_CLAIMS_BLOCK_CANCEL)"
        side_effects:
          - "lifecycle_state := CANCELLED"
          - "claims_posture := RESTRICTED"
          - "Claims in REPORTED → WITHDRAWN"
          - "premium_reserve_cents := 0"
          - "increments Policy.version by 1"
      - from: EXPIRED
        to: NON_RENEWED
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/renewals (with decision=NON_RENEW)"
        actor: Underwriter
        preconditions:
          - "Prior policy lifecycle_state == EXPIRED (ERR_POLICY_NOT_RENEWABLE)"
        side_effects:
          - "This policy's lifecycle_state := NON_RENEWED"
          - "No new Policy is created"
      # --- billing_state transitions ---
      - from: BILLED
        to: PARTIALLY_PAID
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/premium-payments (amount < outstanding)"
        actor: Policyholder
        preconditions:
          - "lifecycle_state IN {BOUND, ACTIVE} (ERR_POLICY_NOT_BILLABLE)"
        side_effects:
          - "premium_paid_cents += amount"
          - "billing_state := PARTIALLY_PAID"
          - "increments Policy.version by 1"
      - from: BILLED
        to: PAID_IN_FULL
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/premium-payments (amount == outstanding)"
        actor: Policyholder
        preconditions:
          - "lifecycle_state IN {BOUND, ACTIVE} (ERR_POLICY_NOT_BILLABLE)"
        side_effects:
          - "premium_paid_cents += amount"
          - "billing_state := PAID_IN_FULL"
          - "increments Policy.version by 1"
      - from: PARTIALLY_PAID
        to: PAID_IN_FULL
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/premium-payments (cumulative reaches premium_cents)"
        actor: Policyholder
        preconditions:
          - "lifecycle_state IN {BOUND, ACTIVE} (ERR_POLICY_NOT_BILLABLE)"
        side_effects:
          - "premium_paid_cents += amount"
          - "billing_state := PAID_IN_FULL"
          - "increments Policy.version by 1"
      - from: BILLED
        to: DELINQUENT
        trigger: "system (automatic when current_utc > bind_time + 30d AND premium_paid_cents < premium_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "billing_state := DELINQUENT"
          - "claims_posture := RESTRICTED"
          - "Grower.status := SUSPENDED"
          - "increments Policy.version by 1"
      - from: PARTIALLY_PAID
        to: DELINQUENT
        trigger: "system (automatic when current_utc > bind_time + 30d AND premium_paid_cents < premium_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "billing_state := DELINQUENT"
          - "claims_posture := RESTRICTED"
          - "Grower.status := SUSPENDED"
          - "increments Policy.version by 1"
      - from: DELINQUENT
        to: PAID_IN_FULL
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/premium-payments (cumulative reaches premium_cents)"
        actor: Policyholder
        preconditions:
          - "lifecycle_state IN {BOUND, ACTIVE} (ERR_POLICY_NOT_BILLABLE)"
        side_effects:
          - "premium_paid_cents += amount"
          - "billing_state := PAID_IN_FULL"
          - "claims_posture := OPEN"
          - "Grower.status := ACTIVE (if no other delinquent policies for this grower)"
          - "increments Policy.version by 1"

  - entity: CoverageUnit
    initial_state: PENDING_REPORT
    terminal_states: [SETTLED, LAPSED_REPORT]
    transitions:
      - from: PENDING_REPORT
        to: REPORTED
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/coverage-units/{unitId}/acreage-reports OR /head-reports (first timely report)"
        actor: Policyholder
        preconditions:
          - "CoverageUnit.status == PENDING_REPORT"
          - "Parent Policy.lifecycle_state IN {BOUND, ACTIVE}"
          - "For PLANTING/INITIAL: submitted_at <= deadline (else transition to LAPSED_REPORT instead)"
        side_effects:
          - "status := REPORTED"
      - from: PENDING_REPORT
        to: LAPSED_REPORT
        trigger: "POST .../acreage-reports OR /head-reports (when submitted past deadline) OR system when deadline passes with no report"
        actor: system
        preconditions:
          - "submitted_at > applicable deadline"
        side_effects:
          - "status := LAPSED_REPORT"
          - "coverage_reduction_pct recorded on the report (lateness_days * 5, capped at 100)"
      - from: REPORTED
        to: UNDER_CLAIM
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/claims (when claim created against this unit)"
        actor: Policyholder
        preconditions:
          - "CoverageUnit.status == REPORTED"
        side_effects:
          - "status := UNDER_CLAIM"
      - from: UNDER_CLAIM
        to: SETTLED
        trigger: "system (automatic when Claim transitions to APPROVED or DENIED)"
        actor: system
        preconditions: []
        side_effects:
          - "status := SETTLED"
      - from: UNDER_CLAIM
        to: REPORTED
        trigger: "system (automatic when Claim transitions to WITHDRAWN or CLOSED_UNTIMELY)"
        actor: system
        preconditions: []
        side_effects:
          - "status := REPORTED (allows re-claim)"

  - entity: Claim
    initial_state: REPORTED
    terminal_states: [PAID, DENIED, WITHDRAWN, CLOSED_UNTIMELY]
    # Claim also has doc_posture as a parallel axis.
    transitions:
      - from: REPORTED
        to: INSPECTION_SCHEDULED
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/claims/{claimId}/assign-adjuster"
        actor: ClaimsApprover
        preconditions:
          - "Claim.claim_state == REPORTED (ERR_CLAIM_NOT_IN_REPORTED)"
          - "Adjuster.status == ACTIVE (ERR_ADJUSTER_NOT_ACTIVE)"
          - "For crop-hail: Claim.CoverageUnit.county_code ∈ Adjuster.county_codes (ERR_ADJUSTER_COUNTY_MISMATCH)"
          - "For livestock: Claim.CoverageUnit.species ∈ Adjuster.species_qualified (ERR_ADJUSTER_SPECIES_MISMATCH)"
          - "Adjuster's current open-claim count < capacity_max_open_claims (ERR_ADJUSTER_CAPACITY_FULL)"
          - "Policy.claims_posture == OPEN (ERR_POLICY_RESTRICTED)"
        side_effects:
          - "Claim.adjuster_id := assigned Adjuster.id"
          - "claim_state := INSPECTION_SCHEDULED"
      - from: INSPECTION_SCHEDULED
        to: INSPECTED
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/claims/{claimId}/field-inspections (submission of inspection)"
        actor: Adjuster
        preconditions:
          - "Claim.claim_state == INSPECTION_SCHEDULED (ERR_CLAIM_NOT_IN_INSPECTION_SCHEDULED)"
          - "X-User-ID of caller == Claim.adjuster_id (ERR_NOT_ASSIGNED_ADJUSTER)"
          - "For livestock claims > $5,000 appraised: at least one VeterinaryReport with necropsy_performed=true must exist (ERR_NECROPSY_REQUIRED)"
        side_effects:
          - "claim_state := INSPECTED"
          - "Claim.provisional_indemnity_cents := FieldInspection.provisional_indemnity_cents (computed per calculation provisional_indemnity)"
      - from: INSPECTED
        to: UNDER_REVIEW
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/claims/{claimId}/submit-for-review"
        actor: Adjuster
        preconditions:
          - "Claim.claim_state == INSPECTED (ERR_CLAIM_NOT_IN_INSPECTED)"
          - "X-User-ID == Claim.adjuster_id"
        side_effects:
          - "claim_state := UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/claims/{claimId}/determinations (decision=APPROVE or PARTIAL)"
        actor: ClaimsApprover
        preconditions:
          - "Claim.claim_state == UNDER_REVIEW (ERR_CLAIM_NOT_IN_UNDER_REVIEW)"
          - "X-User-ID != Claim.adjuster_id (segregation of duties; ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "For livestock: Claim.doc_posture == DOCS_COMPLETE or DOCS_WAIVED (ERR_DOCS_INCOMPLETE)"
          - "If loss_date outside [Policy.effective_date, expiration_date): forbidden at creation; re-checked here"
        side_effects:
          - "claim_state := APPROVED"
          - "LossDetermination.final_indemnity_cents := computed per final_indemnity calculation"
          - "Claim.final_indemnity_cents := LossDetermination.final_indemnity_cents"
          - "CoverageUnit.status := SETTLED"
          - "Grower.prior_claims_count += 1"
          - "Policy.premium_reserve_cents := max(0, premium_reserve_cents - final_indemnity_cents)"
          - "increments Policy.version by 1 (cascade)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST .../determinations (decision=DENY)"
        actor: ClaimsApprover
        preconditions:
          - "Claim.claim_state == UNDER_REVIEW (ERR_CLAIM_NOT_IN_UNDER_REVIEW)"
          - "X-User-ID != Claim.adjuster_id (segregation of duties)"
          - "denial_reason_code is provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "claim_state := DENIED"
          - "CoverageUnit.status := SETTLED"
      - from: APPROVED
        to: PAID
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/claims/{claimId}/indemnity-payments"
        actor: ClaimsApprover
        preconditions:
          - "Claim.claim_state == APPROVED (ERR_CLAIM_NOT_IN_APPROVED)"
          - "No IndemnityPayment with status != VOID already exists for this claim (ERR_PAYMENT_ALREADY_ISSUED)"
        side_effects:
          - "claim_state := PAID"
          - "IndemnityPayment created with amount_cents := Claim.final_indemnity_cents"
      - from: REPORTED
        to: WITHDRAWN
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/claims/{claimId}/withdraw"
        actor: Policyholder
        preconditions:
          - "Claim.claim_state IN {REPORTED, INSPECTION_SCHEDULED} (ERR_CLAIM_NOT_WITHDRAWABLE)"
        side_effects:
          - "claim_state := WITHDRAWN"
          - "CoverageUnit.status := REPORTED (releases the unit)"
      - from: INSPECTION_SCHEDULED
        to: WITHDRAWN
        trigger: "POST .../withdraw"
        actor: Policyholder
        preconditions:
          - "Claim.claim_state IN {REPORTED, INSPECTION_SCHEDULED} (ERR_CLAIM_NOT_WITHDRAWABLE)"
        side_effects:
          - "claim_state := WITHDRAWN"
          - "CoverageUnit.status := REPORTED"
      - from: REPORTED
        to: CLOSED_UNTIMELY
        trigger: "system (automatic when current_utc > loss_date + 30 days AND claim still REPORTED)"
        actor: system
        preconditions: []
        side_effects:
          - "claim_state := CLOSED_UNTIMELY"
          - "CoverageUnit.status := REPORTED"

  - entity: RateTable
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /carriers/{carrierId}/rate-tables/{rateTableId}/publish"
        actor: Underwriter
        preconditions:
          - "RateTable.status == DRAFT"
          - "No overlapping PUBLISHED RateTable for the same (rating_kind, county_code, crop_code) or (rating_kind, species, value_band) with overlapping [effective_from, effective_to) (ERR_RATE_TABLE_OVERLAP)"
        side_effects:
          - "status := PUBLISHED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /carriers/{carrierId}/rate-tables/{rateTableId}/supersede (or implicit when a new rate is published overlapping)"
        actor: Underwriter
        preconditions:
          - "RateTable.status == PUBLISHED"
        side_effects:
          - "status := SUPERSEDED"

  - entity: IndemnityPayment
    initial_state: ISSUED
    terminal_states: [CLEARED, VOID]
    transitions:
      - from: ISSUED
        to: CLEARED
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/claims/{claimId}/indemnity-payments/{paymentId}/clear"
        actor: ClaimsApprover
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "status := CLEARED"
      - from: ISSUED
        to: VOID
        trigger: "POST /carriers/{carrierId}/policies/{policyId}/claims/{claimId}/indemnity-payments/{paymentId}/void"
        actor: ClaimsApprover
        preconditions:
          - "status == ISSUED"
          - "current_utc <= issued_at + 24h (ERR_VOID_WINDOW_EXPIRED)"
        side_effects:
          - "status := VOID"
          - "Claim.claim_state := APPROVED (re-open for re-issue)"

  - entity: Grower
    initial_state: ACTIVE
    terminal_states: [DEBARRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic on Policy billing_state → DELINQUENT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when all delinquent policies paid)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DEBARRED
        trigger: "POST /carriers/{carrierId}/growers/{growerId}/debar"
        actor: Underwriter
        preconditions:
          - "Grower.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "All BOUND or ACTIVE Policies → CANCELLED (cascade)"
          - "All REPORTED or INSPECTION_SCHEDULED Claims → WITHDRAWN (cascade)"

  - entity: FederalCropPolicy
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (when clock reaches expiration_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /carriers/{carrierId}/federal-crop-policies/{fciId}/cancel"
        actor: Underwriter
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: policy-renewal-stale-version
    parent_entity: Policy
    write_endpoint: "POST /carriers/{carrierId}/policies/{policyId}/renewals"
    occ_field: "expected_prior_policy_version"
    description: |
      Creating a Renewal against a prior Policy whose version has advanced since the
      client last observed it is rejected. Captures the case where another writer has
      just posted a premium payment (bumping version) or created a claim against the
      prior policy, so the current writer's view of the prior policy is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-determination-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /carriers/{carrierId}/policies/{policyId}/claims/{claimId}/determinations"
    occ_field: "expected_policy_version"
    description: |
      Submitting a LossDetermination against a Policy whose version has advanced
      since the approver last observed it is rejected. Captures the case where a
      premium payment, cancellation, or renewal cascaded a version bump between the
      approver's read and the determination write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: coverage_unit_premium
    trigger: "CoverageUnit creation; again at bind time to freeze numbers"
    algorithm: tiered_pricing
    formula: |
      # Crop-hail variant
      if unit_kind == CROP_HAIL:
        liability_cents = declared_acres * USD_CENTS_PER_ACRE  # 40_000
        rate_row = the PUBLISHED RateTable with rating_kind=CROP_HAIL
                   AND county_code == CoverageUnit.county_code
                   AND crop_code == CoverageUnit.crop_code
                   AND effective_from <= clock < (effective_to OR +infinity)
        # Tie-break: when multiple rows match (overlapping windows), pick the one with
        # latest effective_from; further ties broken by created_at ASC.
        base_premium = round_half_up(liability_cents * rate_row.rate_per_100_cents_of_liability / 10_000)
      # Livestock variant
      else:
        liability_cents = declared_head_count * per_head_value_cents
        rate_row = the PUBLISHED RateTable with rating_kind=LIVESTOCK_MORTALITY
                   AND species == CoverageUnit.species
                   AND value_band_floor_cents <= per_head_value_cents < value_band_ceiling_cents
                   AND effective_from <= clock < (effective_to OR +infinity)
        base_premium = round_half_up(liability_cents * rate_row.rate_per_100_cents_of_liability / 10_000)
      CoverageUnit.premium_cents = base_premium
    input_set: "PUBLISHED RateTables only; DRAFT/SUPERSEDED excluded"
    constants:
      USD_CENTS_PER_ACRE: 40000   # $400.00 per acre exposure
    precision: "integer cents; round_half_up at the final step only"

  - name: policy_premium_aggregation
    trigger: "Policy bind; CoverageUnit add/remove; surcharge tier change"
    algorithm: aggregation
    formula: |
      # Round per-unit first, then sum (pinned order: per-unit round THEN sum).
      unit_premiums = [round_half_up(cu.liability_cents * cu.rate / 10_000) for cu in CoverageUnits]
      subtotal = sum(unit_premiums)
      surcharge_multiplier_bp = 10_000 + (Policy.high_risk_surcharge_pct * 100)   # bp
      # Apply surcharge AFTER summing units, then subtract carryover credit.
      after_surcharge = round_half_up(subtotal * surcharge_multiplier_bp / 10_000)
      Policy.premium_cents = max(0, after_surcharge - Policy.continuous_coverage_carryover_credit_cents)
    precision: "integer cents; per-unit round_half_up THEN sum THEN apply surcharge THEN subtract credit"
    variants:
      - name: provisional
        when: "CoverageUnit create/update before bind"
        difference: "Uses current clock time to select RateTable row; result not persisted"
      - name: final
        when: "POST /bind"
        difference: "Uses bind clock time; freezes premium_cents onto Policy row"

  - name: continuous_coverage_carryover_credit
    trigger: "Renewal creation with decision=RENEW"
    algorithm: threshold
    formula: |
      if prior.lifecycle_state == EXPIRED AND continuity_gap_days <= 7:
        credit = round_half_up(prior.premium_cents * CARRYOVER_PCT / 100)
      else:
        credit = 0
      Policy.continuous_coverage_carryover_credit_cents = credit
    constants:
      CARRYOVER_PCT: 5
      MAX_CONTINUITY_GAP_DAYS: 7
    precision: "integer cents"

  - name: high_risk_surcharge_tier
    trigger: "Grower.prior_claims_count changes; Policy bind"
    algorithm: threshold
    formula: |
      if grower.prior_claims_count >= 4: surcharge_pct = 25
      elif grower.prior_claims_count >= 2: surcharge_pct = 10
      else: surcharge_pct = 0
      Policy.high_risk_surcharge_pct = surcharge_pct
    precision: "integer percentage"
    note: "Boundary inclusive at >= 2 and >= 4"

  - name: provisional_indemnity
    trigger: "FieldInspection submission"
    algorithm: tiered_pricing
    formula: |
      # Crop-hail: percent-damage method
      if claim.claim_kind == HAIL_DAMAGE:
        # Apply the LATE acreage-report coverage reduction first.
        effective_liability = CoverageUnit.liability_cents *
                              (100 - latest_AcreageReport.coverage_reduction_pct) / 100
        provisional = effective_liability * FieldInspection.observed_percent_damage_pct / 100
      # Livestock: appraisal method
      else:
        # Use MIN of adjuster-observed appraisal and grower-claimed appraisal.
        appraisal_basis = min(FieldInspection.observed_appraisal_cents,
                              Claim.appraisal_value_cents)
        # Cap by per-head band ceiling of the RateTable that rated the unit.
        per_head_cap = rate_row.value_band_ceiling_cents  # exclusive ceiling used as cap
        capped_appraisal = min(appraisal_basis,
                               per_head_cap * FieldInspection.observed_deceased_count)
        # Apply late head-report reduction.
        after_reduction = capped_appraisal *
                          (100 - latest_HeadReport.coverage_reduction_pct) / 100
        provisional = after_reduction
      # Late-notification penalty applies in both branches.
      provisional_final = provisional * (100 - Claim.late_notification_penalty_pct) / 100
      FieldInspection.provisional_indemnity_cents = round_half_up(provisional_final)
      Claim.provisional_indemnity_cents = FieldInspection.provisional_indemnity_cents
    precision: "integer cents; round_half_up at final step; nested per-step truncation NOT applied"
    variants:
      - name: crop_hail_percent_damage
        when: "claim_kind == HAIL_DAMAGE"
        difference: "Liability * observed damage percent"
      - name: livestock_appraisal
        when: "claim_kind == LIVESTOCK_MORTALITY"
        difference: "MIN(adjuster, grower) capped by value-band ceiling * head count"

  - name: final_indemnity
    trigger: "LossDetermination creation with decision IN {APPROVE, PARTIAL}"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall: start from approver's amount, apply reductions in pinned order.
      # Step 1: base = approver's approved_indemnity_cents
      base = LossDetermination.approved_indemnity_cents
      # Step 2: apply coverage reduction (from late acreage/head report)
      after_coverage = base * (100 - LossDetermination.applied_coverage_reduction_pct) / 100
      # Step 3: apply late-notification penalty
      after_late_penalty = after_coverage * (100 - LossDetermination.applied_late_notification_penalty_pct) / 100
      # Step 4: subtract dual-coverage offset (20% of federal liability, capped at the post-step-3 amount)
      offset = min(after_late_penalty,
                   DualCoverageLink.offset_pct_of_federal_liability * FederalCropPolicy.liability_cents / 100)
      after_offset = after_late_penalty - offset
      # Step 5: floor at zero
      LossDetermination.final_indemnity_cents = round_half_up(max(0, after_offset))
      Claim.final_indemnity_cents = LossDetermination.final_indemnity_cents
    precision: "integer cents; round_half_up at final step only; each step truncates to integer cents BEFORE next step"
    variants:
      - name: approve
        when: "decision == APPROVE"
        difference: "approved_indemnity_cents = Claim.provisional_indemnity_cents"
      - name: partial
        when: "decision == PARTIAL"
        difference: "approved_indemnity_cents is approver-supplied; may be less than provisional"

  - name: dual_coverage_offset
    trigger: "LossDetermination when DualCoverageLink exists on the policy"
    algorithm: aggregation
    formula: |
      offset = DualCoverageLink.offset_pct_of_federal_liability *
               FederalCropPolicy.liability_cents / 100
      LossDetermination.applied_dual_coverage_offset_cents = offset
    note: "Only when the federal policy's status == ACTIVE at claim loss_date AND crops/counties overlap"

  - name: premium_reserve_recompute
    trigger: "Policy bind; Claim APPROVE; IndemnityPayment VOID"
    algorithm: aggregation
    formula: |
      total_approved_or_paid_cents = sum of Claim.final_indemnity_cents
        for Claims on this Policy with claim_state IN {APPROVED, PAID}
      Policy.premium_reserve_cents = max(0, floor(Policy.premium_cents * 0.60) - total_approved_or_paid_cents)
    constants:
      RESERVE_RATIO: 0.60

  - name: late_notification_penalty
    trigger: "Claim creation (computed once from reported_at vs loss_date)"
    algorithm: threshold
    formula: |
      window_hours = 72 if claim_kind == HAIL_DAMAGE else 24
      delta_hours = (reported_at - loss_date).total_seconds() / 3600
      if delta_hours <= window_hours: penalty = 0
      elif delta_hours <= 7 * 24: penalty = 10
      elif delta_hours <= 30 * 24: penalty = 25
      else: penalty = 100  # but Claim creation itself is rejected when > 30d (see ERR_LATE_NOTICE_OVER_30D)
      Claim.late_notification_penalty_pct = penalty
      Claim.reported_within_window = (penalty == 0)
    precision: "integer percent"
    note: "Boundary inclusive at <= window, <= 7d, <= 30d"

  - name: acreage_report_lateness
    trigger: "AcreageReport submission"
    algorithm: threshold
    formula: |
      deadline = Policy.acreage_report_deadline if kind == PLANTING else Policy.harvest_report_deadline
      if submitted_at <= deadline:
        lateness_days = 0
        coverage_reduction_pct = 0
      else:
        # Round UP to next integer day for any fraction past deadline.
        lateness_seconds = (submitted_at - deadline).total_seconds()
        lateness_days = ceil(lateness_seconds / 86400)
        coverage_reduction_pct = min(100, lateness_days * 5)
    precision: "integer days (ceiling), integer percent"

  - name: reinsurance_posture_check
    trigger: "Claim APPROVE (cascaded)"
    algorithm: threshold
    formula: |
      aggregate_indemnity_cents = sum over all APPROVED+PAID claims across the carrier
      if aggregate_indemnity_cents >= Carrier.reinsurance_treaty_attachment_cents:
        # Posture flag — observed via carrier read; no entity mutation in this benchmark.
        posture = "ATTACHED"
      else:
        posture = "BELOW_ATTACHMENT"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be in endpoint's roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "All path-template resource IDs must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 3.5
    category: existence
    check: "When expected_*_version payload field is present, OCC version check runs BEFORE any business validation; mismatch yields ERR_STALE_VERSION"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints declared in concurrency_rules"

  - priority: 4
    category: state
    check: "Target resource must be in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: ClaimsApprover who submits a LossDetermination must not equal the Claim.adjuster_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST .../determinations"

  - priority: 6
    category: business_safety
    check: "Livestock claim with appraisal_value_cents > 500_000 ($5,000) MUST have a VeterinaryReport with necropsy_performed=true before FieldInspection submission"
    error_id: ERR_NECROPSY_REQUIRED
    http_status: 422
    applies_to: "POST .../field-inspections"

  - priority: 7
    category: business_safety
    check: "For livestock claim to transition UNDER_REVIEW → APPROVED, doc_posture must be DOCS_COMPLETE or DOCS_WAIVED"
    error_id: ERR_DOCS_INCOMPLETE
    http_status: 422
    applies_to: "POST .../determinations"

  - priority: 8
    category: business_temporal
    check: "Claim.loss_date must satisfy Policy.effective_date <= loss_date < Policy.expiration_date"
    error_id: ERR_LOSS_DATE_OUT_OF_COVERAGE
    http_status: 422
    applies_to: "POST /claims"

  - priority: 9
    category: business_temporal
    check: "Claim creation rejected when (current_utc - loss_date) > 30 days (late notice of loss > 30d is non-payable and must be refused at intake)"
    error_id: ERR_LATE_NOTICE_OVER_30D
    http_status: 422
    applies_to: "POST /claims"

  - priority: 10
    category: business_temporal
    check: "AcreageReport.submitted_at must be >= Policy.effective_date (cannot report before coverage starts)"
    error_id: ERR_REPORT_BEFORE_COVERAGE
    http_status: 422
    applies_to: "POST .../acreage-reports, POST .../head-reports"

  - priority: 11
    category: business_referential
    check: "Adjuster's county_codes must contain CoverageUnit.county_code (crop-hail) or species_qualified must contain CoverageUnit.species (livestock)"
    error_id: ERR_ADJUSTER_COUNTY_MISMATCH
    http_status: 422
    applies_to: "POST .../assign-adjuster"

  - priority: 12
    category: business_referential
    check: "Adjuster's open-claim count must be < capacity_max_open_claims"
    error_id: ERR_ADJUSTER_CAPACITY_FULL
    http_status: 409
    applies_to: "POST .../assign-adjuster"

  - priority: 13
    category: business_constraint
    check: "RateTable publish must not overlap another PUBLISHED row on (kind, county, crop) or (kind, species, value_band) with overlapping [effective_from, effective_to)"
    error_id: ERR_RATE_TABLE_OVERLAP
    http_status: 409
    applies_to: "POST .../rate-tables/{id}/publish"

  - priority: 14
    category: business_constraint
    check: "CoverageUnit's (county_code, crop_code) or (species, per_head_value_cents) must match a PUBLISHED RateTable row at bind time"
    error_id: ERR_NO_ACTIVE_RATE_TABLE
    http_status: 422
    applies_to: "POST .../bind"

  - priority: 15
    category: business_referential
    check: "Renewal.prior_policy_id must reference a Policy owned by the same grower; prior.lifecycle_state must be EXPIRED"
    error_id: ERR_POLICY_NOT_RENEWABLE
    http_status: 409
    applies_to: "POST .../renewals"

  - priority: 16
    category: business_referential
    check: "DualCoverageLink creation requires FederalCropPolicy.status == ACTIVE AND crops/county match the private Policy's CoverageUnits"
    error_id: ERR_DUAL_COVERAGE_MISMATCH
    http_status: 422
    applies_to: "POST .../dual-coverage-links"

  - priority: 17
    category: business_fiscal
    check: "PremiumPayment amount_cents must not exceed (premium_cents - premium_paid_cents) remaining"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST .../premium-payments"

  - priority: 18
    category: business_fiscal
    check: "LossDetermination.approved_indemnity_cents must not exceed Policy.premium_reserve_cents + provisional_indemnity_cents (safety net against runaway approval)"
    error_id: ERR_INDEMNITY_EXCEEDS_RESERVE
    http_status: 402
    applies_to: "POST .../determinations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/carriers/{carrierId}/_clock/set_current_utc"
    description: "Advance the carrier's logical clock. Server default before any call: 2026-08-01T00:00:00Z. Used by tests to drive deadline/window logic deterministically."
    roles: [Underwriter]
    code: 200
    input: [to_iso8601]
    output: Carrier
    side_effects:
      - "Carrier.current_utc := to_iso8601"
      - "Triggers system transitions: Policy BOUND→ACTIVE, ACTIVE→EXPIRED, billing_state →DELINQUENT, Claim REPORTED →CLOSED_UNTIMELY, FederalCropPolicy ACTIVE→EXPIRED"

  # --- Carrier ---
  - method: POST
    path: "/carriers"
    description: "Create a carrier"
    roles: [PlatformAdmin]
    code: 201
    input: [carrier_code, legal_name, reinsurance_treaty_attachment_cents]
    output: Carrier
    side_effects: ["current_utc initialized to 2026-08-01T00:00:00Z"]

  - method: GET
    path: "/carriers/{carrierId}"
    description: "Fetch a carrier"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  # --- Growers ---
  - method: POST
    path: "/carriers/{carrierId}/growers"
    description: "Register a grower"
    roles: [Underwriter]
    code: 201
    input: [full_name, tax_id_last4, email, county_code, state_code]
    output: Grower
    side_effects: ["status := ACTIVE, prior_claims_count := 0"]

  - method: GET
    path: "/carriers/{carrierId}/growers/{growerId}"
    description: "Fetch a grower"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: []
    output: Grower
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/growers"
    description: "List growers"
    roles: [PlatformAdmin, Underwriter, ClaimsApprover]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Grower[]"
    side_effects: []

  - method: POST
    path: "/carriers/{carrierId}/growers/{growerId}/debar"
    description: "Debar a grower (fraud); cancels all bound/active policies"
    roles: [Underwriter]
    code: 200
    input: []
    output: Grower
    side_effects:
      - "Grower.status := DEBARRED"
      - "All BOUND/ACTIVE Policies → CANCELLED"
      - "All REPORTED/INSPECTION_SCHEDULED Claims → WITHDRAWN"

  # --- Adjusters ---
  - method: POST
    path: "/carriers/{carrierId}/adjusters"
    description: "Register an adjuster"
    roles: [Underwriter]
    code: 201
    input: [full_name, license_number, county_codes, species_qualified, capacity_max_open_claims]
    output: Adjuster
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/carriers/{carrierId}/adjusters/{adjusterId}"
    description: "Fetch adjuster"
    roles: [PlatformAdmin, Underwriter, Adjuster, ClaimsApprover]
    code: 200
    input: []
    output: Adjuster
    side_effects: []

  # --- Rate Tables ---
  - method: POST
    path: "/carriers/{carrierId}/rate-tables"
    description: "Create a rate table row (DRAFT)"
    roles: [Underwriter]
    code: 201
    input: [rating_kind, "county_code?", "crop_code?", "species?", "value_band_floor_cents?", "value_band_ceiling_cents?", rate_per_100_cents_of_liability, effective_from, "effective_to?"]
    output: RateTable
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/carriers/{carrierId}/rate-tables"
    description: "List rate tables"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: ["rating_kind?", "status?", "limit?", "offset?"]
    output: "RateTable[]"
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/rate-tables/{rateTableId}"
    description: "Fetch a rate table"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: []
    output: RateTable
    side_effects: []

  - method: POST
    path: "/carriers/{carrierId}/rate-tables/{rateTableId}/publish"
    description: "Publish a rate table row"
    roles: [Underwriter]
    code: 200
    input: []
    output: RateTable
    side_effects: ["status := PUBLISHED (subject to overlap check)"]

  - method: POST
    path: "/carriers/{carrierId}/rate-tables/{rateTableId}/supersede"
    description: "Supersede a published rate row"
    roles: [Underwriter]
    code: 200
    input: []
    output: RateTable
    side_effects: ["status := SUPERSEDED"]

  # --- Federal Crop Policies ---
  - method: POST
    path: "/carriers/{carrierId}/federal-crop-policies"
    description: "Register a federal crop policy"
    roles: [Underwriter]
    code: 201
    input: [grower_id, fci_policy_number, coverage_level_pct, crop_code, county_code, effective_date, expiration_date, liability_cents]
    output: FederalCropPolicy
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/carriers/{carrierId}/federal-crop-policies/{fciId}"
    description: "Fetch a federal crop policy"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: []
    output: FederalCropPolicy
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/federal-crop-policies"
    description: "List federal crop policies (filter by grower)"
    roles: [PlatformAdmin, Underwriter, ClaimsApprover]
    code: 200
    input: ["grower_id?", "status?", "limit?", "offset?"]
    output: "FederalCropPolicy[]"
    side_effects: []

  - method: POST
    path: "/carriers/{carrierId}/federal-crop-policies/{fciId}/cancel"
    description: "Cancel a federal crop policy"
    roles: [Underwriter]
    code: 200
    input: []
    output: FederalCropPolicy
    side_effects: ["status := CANCELLED"]

  # --- Policies ---
  - method: POST
    path: "/carriers/{carrierId}/policies"
    description: "Create a policy application"
    roles: [Underwriter]
    code: 201
    input: [grower_id, policy_kind, effective_date, expiration_date, "prior_policy_id?"]
    output: Policy
    side_effects:
      - "lifecycle_state := APPLICATION"
      - "billing_state := UNBILLED"
      - "claims_posture := OPEN"
      - "policy_number server-minted"
      - "acreage/harvest/head report deadlines computed from effective_date and expiration_date"
      - "high_risk_surcharge_pct computed from Grower.prior_claims_count"
      - "continuous_coverage_carryover_credit_cents computed when prior_policy_id present"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}"
    description: "Fetch a policy"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/policies"
    description: "List policies"
    roles: [PlatformAdmin, Underwriter, ClaimsApprover]
    code: 200
    input: ["grower_id?", "lifecycle_state?", "billing_state?", "limit?", "offset?"]
    output: "Policy[]"
    side_effects: []

  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/bind"
    description: "Bind the policy (APPLICATION → BOUND)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "lifecycle_state := BOUND"
      - "billing_state := BILLED"
      - "premium_cents aggregated from CoverageUnits + surcharge - carryover credit"
      - "premium_reserve_cents := floor(premium_cents * 0.60)"
      - "increments Policy.version by 1"

  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/cancel"
    description: "Cancel a bound/active policy"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "lifecycle_state := CANCELLED"
      - "claims_posture := RESTRICTED"
      - "Claims in REPORTED → WITHDRAWN"
      - "premium_reserve_cents := 0"
      - "increments Policy.version by 1"

  # --- Coverage Units ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/coverage-units"
    description: "Add a coverage unit to a policy application"
    roles: [Underwriter]
    code: 201
    input: ["county_code?", "crop_code?", "declared_acres?", "species?", "declared_head_count?", "per_head_value_cents?"]
    output: CoverageUnit
    side_effects:
      - "unit_kind mirrors Policy.policy_kind"
      - "liability_cents computed"
      - "premium_cents computed (provisional variant)"
      - "status := PENDING_REPORT"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/coverage-units"
    description: "List coverage units for a policy"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CoverageUnit[]"
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/coverage-units/{unitId}"
    description: "Fetch a coverage unit"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: []
    output: CoverageUnit
    side_effects: []

  # --- Acreage Reports ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/coverage-units/{unitId}/acreage-reports"
    description: "Submit a planting or harvest acreage report"
    roles: [Policyholder]
    code: 201
    input: [report_kind, reported_acres]
    output: AcreageReport
    side_effects:
      - "is_timely computed against acreage_report_deadline or harvest_report_deadline"
      - "lateness_days and coverage_reduction_pct computed"
      - "CoverageUnit.status transitions PENDING_REPORT → REPORTED (timely) or → LAPSED_REPORT (late)"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/coverage-units/{unitId}/acreage-reports"
    description: "List acreage reports for a coverage unit"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "AcreageReport[]"
    side_effects: []

  # --- Head Reports ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/coverage-units/{unitId}/head-reports"
    description: "Submit an initial/interim/final head-count report"
    roles: [Policyholder]
    code: 201
    input: [report_kind, reported_head_count]
    output: HeadReport
    side_effects:
      - "is_timely computed against head_report_deadline (INITIAL only)"
      - "CoverageUnit.status transitions PENDING_REPORT → REPORTED (timely INITIAL) or → LAPSED_REPORT (late INITIAL)"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/coverage-units/{unitId}/head-reports"
    description: "List head reports for a coverage unit"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "HeadReport[]"
    side_effects: []

  # --- Claims ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims"
    description: "First notice of loss"
    roles: [Policyholder]
    code: 201
    input: [coverage_unit_id, loss_date, "percent_damage_estimate_pct?", "appraisal_value_cents?", "deceased_head_count?"]
    output: Claim
    side_effects:
      - "claim_state := REPORTED"
      - "doc_posture := DOCS_PENDING"
      - "claim_kind mirrors Policy.policy_kind"
      - "reported_at stamped from logical clock"
      - "reported_within_window and late_notification_penalty_pct computed"
      - "CoverageUnit.status REPORTED → UNDER_CLAIM"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}"
    description: "Fetch a claim"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/claims"
    description: "List claims for a policy"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: ["claim_state?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/assign-adjuster"
    description: "Assign an adjuster (REPORTED → INSPECTION_SCHEDULED)"
    roles: [ClaimsApprover]
    code: 200
    input: [adjuster_id]
    output: Claim
    side_effects:
      - "Claim.adjuster_id := assigned"
      - "claim_state := INSPECTION_SCHEDULED"

  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/withdraw"
    description: "Withdraw a claim (REPORTED/INSPECTION_SCHEDULED → WITHDRAWN)"
    roles: [Policyholder]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim_state := WITHDRAWN"
      - "CoverageUnit.status := REPORTED"

  # --- Field Inspections ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/field-inspections"
    description: "Submit field inspection report (INSPECTION_SCHEDULED → INSPECTED)"
    roles: [Adjuster]
    code: 201
    input: [adjuster_id, scheduled_for, "observed_percent_damage_pct?", "observed_appraisal_cents?", "observed_deceased_count?", notes]
    output: FieldInspection
    side_effects:
      - "claim_state := INSPECTED"
      - "provisional_indemnity_cents computed"
      - "Claim.provisional_indemnity_cents updated"
      - "within_inspection_window computed"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/field-inspections"
    description: "List field inspections for a claim"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "FieldInspection[]"
    side_effects: []

  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/submit-for-review"
    description: "Adjuster submits inspected claim for review (INSPECTED → UNDER_REVIEW)"
    roles: [Adjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_state := UNDER_REVIEW"]

  # --- Veterinary Reports ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/veterinary-reports"
    description: "Submit a veterinary certificate, necropsy report, or third-party affidavit"
    roles: [Policyholder]
    code: 201
    input: [veterinarian_license, report_kind, cause_of_death, necropsy_performed, death_date]
    output: VeterinaryReport
    side_effects:
      - "doc_posture recomputed: DOCS_COMPLETE iff (1) a VETERINARY_CERTIFICATE exists AND (2) for claims > $5,000, a NECROPSY_REPORT with necropsy_performed=true exists"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/veterinary-reports"
    description: "List veterinary reports for a claim"
    roles: [PlatformAdmin, Underwriter, Policyholder, Adjuster, ClaimsApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "VeterinaryReport[]"
    side_effects: []

  # --- Loss Determinations ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/determinations"
    description: "ClaimsApprover issues the loss determination (UNDER_REVIEW → APPROVED/DENIED)"
    roles: [ClaimsApprover]
    code: 201
    input: [decision, approved_indemnity_cents, "denial_reason_code?", expected_policy_version]
    output: LossDetermination
    side_effects:
      - "claim_state := APPROVED or DENIED"
      - "final_indemnity_cents computed (waterfall)"
      - "CoverageUnit.status := SETTLED"
      - "Grower.prior_claims_count += 1 (on APPROVE)"
      - "Policy.premium_reserve_cents recomputed"
      - "increments Policy.version by 1 (OCC target)"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/determinations"
    description: "List determinations for a claim"
    roles: [PlatformAdmin, Underwriter, ClaimsApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "LossDetermination[]"
    side_effects: []

  # --- Indemnity Payments ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/indemnity-payments"
    description: "Issue the indemnity payment (APPROVED → PAID)"
    roles: [ClaimsApprover]
    code: 201
    input: [payment_method]
    output: IndemnityPayment
    side_effects:
      - "claim_state := PAID"
      - "amount_cents := Claim.final_indemnity_cents"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/indemnity-payments"
    description: "List payments for a claim"
    roles: [PlatformAdmin, Underwriter, ClaimsApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "IndemnityPayment[]"
    side_effects: []

  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/indemnity-payments/{paymentId}/clear"
    description: "Mark a payment cleared"
    roles: [ClaimsApprover]
    code: 200
    input: []
    output: IndemnityPayment
    side_effects: ["status := CLEARED"]

  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/claims/{claimId}/indemnity-payments/{paymentId}/void"
    description: "Void a payment within 24h of issue"
    roles: [ClaimsApprover]
    code: 200
    input: []
    output: IndemnityPayment
    side_effects:
      - "status := VOID"
      - "Claim.claim_state := APPROVED (re-open)"

  # --- Dual Coverage Links ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/dual-coverage-links"
    description: "Link a private crop-hail policy to a federal crop policy"
    roles: [Underwriter]
    code: 201
    input: [federal_crop_policy_id]
    output: DualCoverageLink
    side_effects:
      - "Policy.dual_coverage_link_id set"
      - "offset_pct_of_federal_liability := 20"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/dual-coverage-links"
    description: "List dual coverage links for a policy"
    roles: [PlatformAdmin, Underwriter, ClaimsApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "DualCoverageLink[]"
    side_effects: []

  # --- Renewals ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/renewals"
    description: "Renew or non-renew an EXPIRED policy. On RENEW, creates a new Policy whose prior_policy_id = path policyId."
    roles: [Underwriter]
    code: 201
    input: [decision, effective_date, expiration_date, expected_prior_policy_version]
    output: Renewal
    side_effects:
      - "On RENEW: a new Policy is created (lifecycle_state=APPLICATION, prior_policy_id=path policyId, continuous_coverage_carryover_credit_cents computed)"
      - "On NON_RENEW: prior Policy.lifecycle_state := NON_RENEWED"
      - "continuity_gap_days computed"
      - "carryover_credit_cents computed"
      - "increments Policy.version by 1 (on the prior Policy; OCC target)"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/renewals"
    description: "List renewals for a policy (either as the new or the prior)"
    roles: [PlatformAdmin, Underwriter, ClaimsApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "Renewal[]"
    side_effects: []

  # --- Premium Payments ---
  - method: POST
    path: "/carriers/{carrierId}/policies/{policyId}/premium-payments"
    description: "Post a premium payment"
    roles: [Policyholder]
    code: 201
    input: [amount_cents]
    output: PremiumPayment
    side_effects:
      - "premium_paid_cents += amount"
      - "billing_state transitions BILLED→PARTIALLY_PAID or →PAID_IN_FULL; PARTIALLY_PAID→PAID_IN_FULL; DELINQUENT→PAID_IN_FULL (if reaches full)"
      - "claims_posture recomputed (DELINQUENT →PAID_IN_FULL restores OPEN)"
      - "Grower.status := ACTIVE if no other delinquent policies"
      - "increments Policy.version by 1"

  - method: GET
    path: "/carriers/{carrierId}/policies/{policyId}/premium-payments"
    description: "List premium payments"
    roles: [PlatformAdmin, Underwriter, Policyholder, ClaimsApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: "PremiumPayment[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not in endpoint's allowed roles list" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-template resource ID not found" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version mismatch (OCC)" }

  # --- Input shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, type mismatch, or enum value not in declared set" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "expiration_date <= effective_date on policy/federal-policy/rate-table creation" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource in a state that does not permit the requested transition" }
  - { id: ERR_POLICY_NOT_IN_APPLICATION, http: 409, condition: "Bind requires lifecycle_state == APPLICATION" }
  - { id: ERR_POLICY_NOT_CANCELLABLE, http: 409, condition: "Cancel requires lifecycle_state IN {BOUND, ACTIVE}" }
  - { id: ERR_POLICY_NOT_RENEWABLE, http: 409, condition: "Renewal requires prior.lifecycle_state == EXPIRED and matching grower" }
  - { id: ERR_POLICY_NOT_BILLABLE, http: 409, condition: "Premium payments accepted only when lifecycle_state IN {BOUND, ACTIVE}" }
  - { id: ERR_CLAIM_NOT_IN_REPORTED, http: 409, condition: "assign-adjuster requires claim_state == REPORTED" }
  - { id: ERR_CLAIM_NOT_IN_INSPECTION_SCHEDULED, http: 409, condition: "field-inspection submission requires claim_state == INSPECTION_SCHEDULED" }
  - { id: ERR_CLAIM_NOT_IN_INSPECTED, http: 409, condition: "submit-for-review requires claim_state == INSPECTED" }
  - { id: ERR_CLAIM_NOT_IN_UNDER_REVIEW, http: 409, condition: "determinations requires claim_state == UNDER_REVIEW" }
  - { id: ERR_CLAIM_NOT_IN_APPROVED, http: 409, condition: "indemnity-payments requires claim_state == APPROVED" }
  - { id: ERR_CLAIM_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires claim_state IN {REPORTED, INSPECTION_SCHEDULED}" }
  - { id: ERR_POLICY_RESTRICTED, http: 409, condition: "claims_posture == RESTRICTED (delinquent billing or terminal lifecycle)" }

  # --- Coverage & rating ---
  - { id: ERR_NO_COVERAGE_UNITS, http: 422, condition: "Bind requires at least one CoverageUnit" }
  - { id: ERR_NO_ACTIVE_RATE_TABLE, http: 422, condition: "No PUBLISHED RateTable matches the CoverageUnit at bind clock time" }
  - { id: ERR_RATE_TABLE_OVERLAP, http: 409, condition: "PUBLISHED rate overlaps another PUBLISHED row on (kind, county, crop) or (kind, species, value_band)" }

  # --- Claim intake ---
  - { id: ERR_LOSS_DATE_OUT_OF_COVERAGE, http: 422, condition: "loss_date not within [effective_date, expiration_date)" }
  - { id: ERR_LATE_NOTICE_OVER_30D, http: 422, condition: "current_utc - loss_date > 30 days; claim non-payable at intake" }
  - { id: ERR_REPORT_BEFORE_COVERAGE, http: 422, condition: "Report submitted_at < Policy.effective_date" }
  - { id: ERR_OPEN_CLAIMS_BLOCK_CANCEL, http: 409, condition: "Open claims in {INSPECTION_SCHEDULED, INSPECTED, UNDER_REVIEW, APPROVED} block policy cancel" }

  # --- Adjuster / inspection ---
  - { id: ERR_ADJUSTER_NOT_ACTIVE, http: 409, condition: "Adjuster.status != ACTIVE" }
  - { id: ERR_ADJUSTER_COUNTY_MISMATCH, http: 422, condition: "Adjuster not licensed for the coverage unit's county" }
  - { id: ERR_ADJUSTER_SPECIES_MISMATCH, http: 422, condition: "Adjuster not qualified for the coverage unit's species" }
  - { id: ERR_ADJUSTER_CAPACITY_FULL, http: 409, condition: "Adjuster at capacity_max_open_claims" }
  - { id: ERR_NOT_ASSIGNED_ADJUSTER, http: 403, condition: "Caller is not the Claim.adjuster_id" }
  - { id: ERR_NECROPSY_REQUIRED, http: 422, condition: "Livestock claim > $5,000 requires VeterinaryReport with necropsy_performed=true before inspection" }
  - { id: ERR_DOCS_INCOMPLETE, http: 422, condition: "Livestock claim requires doc_posture IN {DOCS_COMPLETE, DOCS_WAIVED} to approve" }

  # --- Determination / payment ---
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Approver equals Claim.adjuster_id" }
  - { id: ERR_INDEMNITY_EXCEEDS_RESERVE, http: 402, condition: "approved_indemnity_cents exceeds reserve + provisional safety cap" }
  - { id: ERR_PAYMENT_ALREADY_ISSUED, http: 409, condition: "An IndemnityPayment in non-VOID status already exists for this claim" }
  - { id: ERR_VOID_WINDOW_EXPIRED, http: 422, condition: "Void attempted after issued_at + 24h" }

  # --- Fiscal ---
  - { id: ERR_OVERPAYMENT, http: 422, condition: "PremiumPayment amount exceeds outstanding balance" }

  # --- Dual coverage ---
  - { id: ERR_DUAL_COVERAGE_MISMATCH, http: 422, condition: "Federal policy not ACTIVE or crop/county mismatch at link time" }

  # --- Grower ---
  - { id: ERR_GROWER_NOT_ACTIVE, http: 409, condition: "Grower.status != ACTIVE at bind time" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Carrier platform administrator; can create carriers and read everything"
    identity: opaque
    exclusive_operations:
      - "POST /carriers"
    shared_operations:
      - "GET on all resources"

  - name: Underwriter
    description: "Carrier underwriter; owns grower registration, rate tables, policy lifecycle, dual-coverage linking, renewals, debarment"
    identity: opaque
    exclusive_operations:
      - "POST /carriers/{id}/growers"
      - "POST /carriers/{id}/growers/{id}/debar"
      - "POST /carriers/{id}/adjusters"
      - "POST /carriers/{id}/rate-tables*"
      - "POST /carriers/{id}/federal-crop-policies*"
      - "POST /carriers/{id}/policies (create, bind, cancel)"
      - "POST /carriers/{id}/policies/{id}/coverage-units"
      - "POST /carriers/{id}/policies/{id}/dual-coverage-links"
      - "POST /carriers/{id}/policies/{id}/renewals"
      - "POST /carriers/{id}/_clock/set_current_utc"
    shared_operations:
      - "GET on all carrier-scoped resources"

  - name: Policyholder
    description: "The grower (insured). Submits acreage/head reports, files claims, submits veterinary reports, pays premiums, withdraws claims"
    identity: "entity_backed:Grower"
    exclusive_operations:
      - "POST /carriers/{id}/policies/{id}/coverage-units/{id}/acreage-reports"
      - "POST /carriers/{id}/policies/{id}/coverage-units/{id}/head-reports"
      - "POST /carriers/{id}/policies/{id}/claims (first notice of loss)"
      - "POST /carriers/{id}/policies/{id}/claims/{id}/withdraw"
      - "POST /carriers/{id}/policies/{id}/claims/{id}/veterinary-reports"
      - "POST /carriers/{id}/policies/{id}/premium-payments"
    shared_operations:
      - "GET on own policies, claims, reports"

  - name: Adjuster
    description: "Field adjuster; submits inspections and forwards claims to review. Cannot approve loss determinations (segregation of duties)"
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /carriers/{id}/policies/{id}/claims/{id}/field-inspections"
      - "POST /carriers/{id}/policies/{id}/claims/{id}/submit-for-review"
    shared_operations:
      - "GET on claims assigned to them"

  - name: ClaimsApprover
    description: "Claims approver / loss-determination board; assigns adjusters, issues determinations, issues/voids payments. Cannot inspect (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /carriers/{id}/policies/{id}/claims/{id}/assign-adjuster"
      - "POST /carriers/{id}/policies/{id}/claims/{id}/determinations"
      - "POST /carriers/{id}/policies/{id}/claims/{id}/indemnity-payments*"
    shared_operations:
      - "GET on all claims, inspections, determinations, payments"
