          - endpoints["GET /digital-shelf/products/{id}/shelf-summary"]
        excluded_because:
          difficulty_instance: conversion_lift_post_pin_window_vs_quality_split_regroup
          rationale: "Variant selection through the lift_variant query parameter, and the regrouping of the same observation rows it causes, are asserted there with both lift values."

      - name: service_fee_rush_tier_reads_the_discounted_subtotal
