      - name: observation_visit_fork_join_with_reliability_rescore_loop
        grounds:
          - state_machines.ObservationVisit.SCORES_ENTERED_to_RELIABILITY_CHECK
          - state_machines.ObservationVisit.RELIABILITY_CHECK_to_SCORES_ENTERED
          - state_machines.ObservationVisit.RELIABILITY_CHECK_to_FINALIZED
          - state_machines.ObservationVisit.SCORES_ENTERED_to_FINALIZED
          - calculations.inter_rater_reliability_pct
          - calculations.observation_composite_score
          - validations[priority=22]
          - validations[priority=24]
          - entities.ObservationVisit.fields.rescore_count
        distinguishing_aspect: |
          ObservationVisit is a branching fork-join with a cycle inside one arm: two
          different visits reach the same join state FINALIZED through arms whose
          side-effect sets differ observably (arm A leaves reliability_pct == 83.33,
          arm B sets reliability_pct to null), and arm A first traverses the
          RELIABILITY_CHECK -> SCORES_ENTERED -> RELIABILITY_CHECK rescore cycle which
          moves reliability_pct 66.67 -> 83.33 while leaving composite 5.83 untouched.
        test_recipe:
          setup:
            - "Logical clock starts at the 2026-08-01T00:00:00Z default."
            - "All 5 StandardDomain rows exist with weights 0.30/0.25/0.20/0.15/0.10; LEARNING_ENVIRONMENT is observation_linked with min_composite_for_block 4.00."
            - "Provider C (RURAL, active_staff_fte 2.00, credential_compliance_pct 90.00) has a cycle in OBSERVATION_SCHEDULED with a TWO-observer visit whose lead scores sum to 35 (composite 5.83) and whose secondary disagrees on ACTIVITIES and PROGRAM_STRUCTURE, giving reliability_pct 66.67 — below the inclusive 83.33 gate."
            - "Provider D (URBAN, active_staff_fte 2.00, credential_compliance_pct 60.00) has a cycle in OBSERVATION_SCHEDULED with a SINGLE-observer visit whose lead scores are all 4 (composite 4.00) and whose PROVISIONAL weighted_total is 47.00, i.e. points_tier 2, so the single-observer arm is legal under validations priority 21."
            - "Clock sits at 2026-08-06T09:00:00Z, at or after both visit windows."
