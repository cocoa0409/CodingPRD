# SCAFFOLD_CORNER_DESIGN.yaml -- §1.9 breadth probe for task_2576
# Companion to SCAFFOLD.yaml (§1.0-§1.7) and SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8).
# Logical clock starts at 2026-08-01T00:00:00Z (POST /_clock/set_current_utc default).
# Instances whose corner is already asserted by a §1.8 depth instance carry
# `excluded_because:` and no `test_recipe:`.
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_conversion_project_returns_declared_defaults
        claim_type: creation
        grounds:
          - entities.ConversionProject.fields.building_address
          - entities.ConversionProject.fields.year_built
          - entities.ConversionProject.fields.total_unit_count
          - entities.ConversionProject.fields.sponsor_user_id
          - entities.ConversionProject.fields.max_overlapping_remediations
          - endpoints[POST /conversion-projects]
        distinguishing_aspect: "A brand-new project must come back with every computed aggregate at
          its declared default and posture RESTRICTED (not OPEN): calculations.project_posture_derivation
          returns RESTRICTED for a project whose suitability_gate is UNEVALUATED, so an implementation
          that seeds posture OPEN at creation is detectably wrong on the very first response."
        test_recipe:
          setup:
            - "No prior state; logical clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
          assert:
            - "http status == 201"
            - "ConversionProject.${proj_id}.building_address == \"44 Cove Lane, Bangor ME\""
            - "ConversionProject.${proj_id}.year_built == 1968"
            - "ConversionProject.${proj_id}.total_unit_count == 2"
            - "ConversionProject.${proj_id}.sponsor_user_id == \"sponsor-1\""
            - "ConversionProject.${proj_id}.max_overlapping_remediations == 2"
            - "ConversionProject.${proj_id}.status == FEASIBILITY"
            - "ConversionProject.${proj_id}.posture == RESTRICTED"
            - "ConversionProject.${proj_id}.suitability_gate == UNEVALUATED"
            - "ConversionProject.${proj_id}.suitability_score == 0.00"
            - "ConversionProject.${proj_id}.included_unit_count == 0"
            - "ConversionProject.${proj_id}.bp_conservation_total == 0"
            - "ConversionProject.${proj_id}.escrow_deposits_received_cents == 0"
            - "ConversionProject.${proj_id}.escrow_balance_cents == 0"
            - "ConversionProject.${proj_id}.escrow_reconciliation_delta_cents == 0"
            - "ConversionProject.${proj_id}.relocation_reconciliation_delta_cents == 0"
            - "ConversionProject.${proj_id}.warranty_reserve_charge_cents == 0"
            - "ConversionProject.${proj_id}.warrantability_verdict == UNEVALUATED"
            - "ConversionProject.${proj_id}.warrantability_verdict_closed_basis == UNEVALUATED"
            - "ConversionProject.${proj_id}.declaration_recorded_at == null"
            - "ConversionProject.${proj_id}.warranty_start_at == null"
            - "ConversionProject.${proj_id}.version == 1"
      - name: conversion_project_system_fields_generated_by_server
        claim_type: system_fields
        grounds:
          - entities.ConversionProject.fields.last_posture_recalculated_at
          - entities.ConversionProject.common_fields
          - endpoints[POST /conversion-projects]
          - endpoints[POST /conversion-projects/{id}/posture-recalculations]
        distinguishing_aspect: "id / created_at / updated_at / version and the system field
          last_posture_recalculated_at are server-minted; last_posture_recalculated_at must be stamped
          from the LOGICAL clock (2026-08-15T00:00:00Z after the clock move), not from wall time, and
          the sweep endpoint must bump version even though it takes no request body."
        test_recipe:
          setup:
            - "One ConversionProject in FEASIBILITY / RESTRICTED at version 1."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "9 Harbor Row, Bath ME", year_built: 1972, total_unit_count: 3, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id", proj_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /conversion-projects/${proj_id}/posture-recalculations"
              payload: {}
              as: StateRegulator
              as_user_id: "reg-1"
          assert:
            - "http status == 200"
            - "ConversionProject.${proj_id}.id == \"${proj_id}\""
            - "ConversionProject.${proj_id}.last_posture_recalculated_at == \"2026-08-15T00:00:00Z\""
            - "ConversionProject.${proj_id}.posture == RESTRICTED"
            - "ConversionProject.${proj_id}.version == ${proj_v} + 1"
            - "response body contains meta.api_request_id and meta.api_request_timestamp"
      - name: get_major_component_returns_stored_engineering_inputs
        claim_type: retrieval
        grounds:
          - entities.MajorComponent.fields.component_type
          - entities.MajorComponent.fields.remaining_useful_life_years
          - entities.MajorComponent.fields.effective_age_years
          - entities.MajorComponent.fields.replacement_cost_cents
          - entities.MajorComponent.fields.condition_rating
          - entities.MajorComponent.fields.verification_status
          - endpoints[GET /major-components/{id}]
        distinguishing_aspect: "A freshly created component must read back with verification_status
          UNVERIFIED and funded_pct_bp / planned_remediation_gain_years / is_life_safety / is_structural
          at their declared defaults, and the parent report's total_replacement_cost_cents must still be
          0 because that aggregate only counts VERIFIED children."
        test_recipe:
          setup:
            - "One ConversionProject in FEASIBILITY with one DRAFT EngineeringReport."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_id: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "ROOF", remaining_useful_life_years: 30, effective_age_years: 10, replacement_cost_cents: 10000000, funded_pct_bp: 0, condition_rating: "EXCELLENT" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_id: "$.data.id" }
          trigger:
            - call: "GET /major-components/${mc_id}"
              payload: {}
              as: PeerReviewEngineer
              as_user_id: "peer-1"
          assert:
            - "http status == 200"
            - "MajorComponent.${mc_id}.engineering_report_id == \"${er_id}\""
            - "MajorComponent.${mc_id}.component_type == ROOF"
            - "MajorComponent.${mc_id}.remaining_useful_life_years == 30"
            - "MajorComponent.${mc_id}.effective_age_years == 10"
            - "MajorComponent.${mc_id}.replacement_cost_cents == 10000000"
            - "MajorComponent.${mc_id}.condition_rating == EXCELLENT"
            - "MajorComponent.${mc_id}.verification_status == UNVERIFIED"
            - "EngineeringReport.${er_id}.verified_component_count == 0"
            - "EngineeringReport.${er_id}.total_replacement_cost_cents == 0"
      - name: list_engineering_reports_applies_pagination_defaults
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - response_envelope.pagination_fields
          - endpoints[GET /conversion-projects/{id}/engineering-reports]
        distinguishing_aspect: "With three sibling reports and no pagination params the envelope must
          report the DECLARED defaults limit 10 / offset 0 with total_count 3 and has_more false; an
          explicit limit 2 must page the SAME created_at ASC ordering with has_more true, so a server
          that echoes the page size as total_count or defaults limit to 20 is caught."
        test_recipe:
          setup:
            - "One ConversionProject with exactly three DRAFT EngineeringReports created in label order."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er1_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-2", inspection_date: "2026-07-11T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er2_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-3", inspection_date: "2026-07-12T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er3_id: "$.data.id" }
          trigger:
            - call: "GET /conversion-projects/${proj_id}/engineering-reports"
              payload: {}
              as: StateRegulator
              as_user_id: "reg-1"
            - call: "GET /conversion-projects/${proj_id}/engineering-reports"
              payload: { limit: 2, offset: 2 }
              as: StateRegulator
              as_user_id: "reg-1"
          assert:
            - "first trigger: http status == 200 and response_type == \"array\""
            - "first trigger: data.limit == 10"
            - "first trigger: data.offset == 0"
            - "first trigger: data.total_count == 3"
            - "first trigger: data.has_more == false"
            - "first trigger: returned ids in order == [\"${er1_id}\", \"${er2_id}\", \"${er3_id}\"]"
            - "second trigger: data.limit == 2 and data.offset == 2"
            - "second trigger: data.total_count == 3 and data.has_more == false"
            - "second trigger: returned ids == [\"${er3_id}\"]"
      - name: withdraw_unit_with_unknown_id_returns_declaration_artifact_not_found
        claim_type: not_found
        grounds:
          - validations[priority 7]
          - errors[ERR_DECLARATION_ARTIFACT_NOT_FOUND]
          - endpoints[POST /units/{id}/withdraw]
        distinguishing_aspect: "The declaration family has its OWN 404 id: an unknown Unit id must
          return ERR_DECLARATION_ARTIFACT_NOT_FOUND, not the generic ERR_PROJECT_NOT_FOUND, and the
          existence check at priority 7 must fire before the ERR_LAST_INCLUDED_UNIT safety rule at
          priority 44 that would otherwise also be unsatisfiable."
        test_recipe:
          setup:
            - "No Unit with id unit-does-not-exist exists."
          setup_api_calls: []
          trigger:
            - call: "POST /units/unit-does-not-exist/withdraw"
              payload: { withdrawal_reason: "probe" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "http status == 404"
            - "${err_id} == \"ERR_DECLARATION_ARTIFACT_NOT_FOUND\""
            - "response_type == \"error\""
      - name: create_major_component_missing_condition_rating_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.MajorComponent.fields.condition_rating
          - validations[priority 14]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /engineering-reports/{id}/major-components]
        distinguishing_aspect: "condition_rating is the only MajorComponent enum input with no declared
          default, so omitting it must be a 422 ERR_INVALID_REQUEST rather than silently defaulting to
          EXCELLENT (which would make the suitability condition penalty 0.00 and quietly pass the gate)."
        test_recipe:
          setup:
            - "One ConversionProject with one DRAFT EngineeringReport and no MajorComponents."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_id: "$.data.id" }
          trigger:
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "ROOF", remaining_useful_life_years: 30, effective_age_years: 10, replacement_cost_cents: 10000000, funded_pct_bp: 0 }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "http status == 422"
            - "${err_id} == \"ERR_INVALID_REQUEST\""
            - "EngineeringReport.${er_id}.version == 1"
            - "GET /engineering-reports/${er_id}/major-components returns total_count == 0"
      - name: create_unit_base_bp_above_declared_range_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Unit.fields.base_percentage_interest_bp
          - validations[priority 15]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /declaration-packages/{id}/units]
        distinguishing_aspect: "base_percentage_interest_bp is constrained to 1..10000 inclusive, so
          10001 must be rejected at request-shape validation (priority 15) BEFORE any allocation math
          runs; the sibling floor case 0 must be rejected too, proving the lower bound is 1 and not 0."
        test_recipe:
          setup:
            - "One ConversionProject with a DRAFT DeclarationPackage and no Units."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/declaration-packages"
              payload: { declaration_text_ref: "decl-1", bylaws_text_ref: "bylaws-1", boundary_convention: "PAINT_TO_PAINT" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { dp_id: "$.data.id" }
          trigger:
            - call: "POST /declaration-packages/${dp_id}/units"
              payload: { unit_number: "101", floor_level: 1, heated_square_feet: 900, boundary_note: "paint to paint", base_percentage_interest_bp: 10001 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /declaration-packages/${dp_id}/units"
              payload: { unit_number: "102", floor_level: 1, heated_square_feet: 900, boundary_note: "paint to paint", base_percentage_interest_bp: 0 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { err_id2: "$.data.error_id" }
          assert:
            - "first trigger: http status == 422 and ${err_id} == \"ERR_INVALID_REQUEST\""
            - "second trigger: http status == 422 and ${err_id2} == \"ERR_INVALID_REQUEST\""
            - "DeclarationPackage.${dp_id}.allocated_bp_total == 0"
            - "ConversionProject.${proj_id}.included_unit_count == 0"
      - name: omitted_optional_inputs_apply_declared_entity_defaults
        claim_type: defaults
        grounds:
          - entities.TenantHousehold.fields.protected_class
          - entities.ClosingBatch.fields.status
          - entities.ClosingBatch.fields.assigned_agreement_count
          - entities.MajorComponent.fields.planned_remediation_gain_years
          - entities.MajorComponent.fields.is_life_safety
          - entities.MajorComponent.fields.is_structural
          - endpoints[POST /conversion-projects/{id}/tenant-households]
          - endpoints[POST /conversion-projects/{id}/closing-batches]
          - endpoints[POST /engineering-reports/{id}/major-components]
        distinguishing_aspect: "Declared defaults must materialise from omission on three different
          entities without the client naming them: protected_class NONE (which makes the notice
          extension 0 days) and occupied_unit_id null on TenantHousehold, planned_remediation_gain_years
          0 with is_life_safety/is_structural false on MajorComponent, and the computed opening
          counters (status DRAFT, assigned_agreement_count 0, presale_pct 0.00) on ClosingBatch. A
          server that stores nulls or zeroes for the boolean/enum defaults, or that leaves
          presale_pct null until the first threshold evaluation, fails."
        test_recipe:
          setup:
            - "One ConversionProject in FEASIBILITY with one DRAFT EngineeringReport and no children."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_id: "$.data.id" }
          trigger:
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "ROOF", remaining_useful_life_years: 30, effective_age_years: 10, replacement_cost_cents: 10000000, funded_pct_bp: 0, condition_rating: "GOOD" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/tenant-households"
              payload: { household_label: "HH-1", tenancy_start_date: "2026-01-01T00:00:00Z", monthly_rent_cents: 300000 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { hh_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/closing-batches"
              payload: { batch_sequence_no: 1, window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", min_presale_threshold_pct: 51.00, min_absolute_unit_count: 1 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { cb_id: "$.data.id" }
          assert:
            - "MajorComponent.${mc_id}.planned_remediation_gain_years == 0"
            - "MajorComponent.${mc_id}.is_life_safety == false"
            - "MajorComponent.${mc_id}.is_structural == false"
            - "TenantHousehold.${hh_id}.protected_class == NONE"
            - "TenantHousehold.${hh_id}.occupied_unit_id == null"
            - "TenantHousehold.${hh_id}.notice_status == PRE_NOTICE"
            - "TenantHousehold.${hh_id}.rofr_status == NOT_OFFERED"
            - "TenantHousehold.${hh_id}.relocation_status == NOT_OWED"
            - "ClosingBatch.${cb_id}.status == DRAFT"
            - "ClosingBatch.${cb_id}.assigned_agreement_count == 0"
            - "ClosingBatch.${cb_id}.presale_pct == 0.0"
      - name: engineering_report_verified_aggregates_computed_from_children
        claim_type: computed_fields
        grounds:
          - entities.EngineeringReport.fields.verified_component_count
          - entities.EngineeringReport.fields.total_replacement_cost_cents
          - entities.MajorComponent.fields.verification_status
          - endpoints[POST /major-components/{id}/verification]
        distinguishing_aspect: "Both aggregates are re-derived from the VERIFIED child set on every
          verification write: with both children verified they read 2 / 18000000, un-verifying the
          10000000-cent ROOF must drop the sum to exactly 8000000 (not leave the 18000000 high-water
          mark), and re-verifying must restore 18000000 rather than double-count."
        test_recipe:
          setup:
            - "One SUBMITTED EngineeringReport whose two MajorComponents have both been explicitly set
              VERIFIED, giving verified_component_count 2 and total_replacement_cost_cents 18000000;
              parent ConversionProject in SUITABILITY_REVIEW."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_id: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "ROOF", remaining_useful_life_years: 30, effective_age_years: 10, replacement_cost_cents: 10000000, funded_pct_bp: 0, condition_rating: "EXCELLENT" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_roof: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "ELEVATOR", remaining_useful_life_years: 20, effective_age_years: 15, replacement_cost_cents: 8000000, funded_pct_bp: 0, condition_rating: "GOOD" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_elev: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/submit"
              payload: {}
              as: LicensedEngineer
              as_user_id: "eng-1"
            - call: "POST /major-components/${mc_roof}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /major-components/${mc_elev}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
          trigger:
            - call: "POST /major-components/${mc_roof}/verification"
              payload: { verified: false }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /major-components/${mc_roof}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
          assert:
            - "before the triggers: EngineeringReport.${er_id}.verified_component_count == 2 and total_replacement_cost_cents == 18000000"
            - "after first trigger: MajorComponent.${mc_roof}.verification_status == UNVERIFIED"
            - "after first trigger: MajorComponent.${mc_elev}.verification_status == VERIFIED"
            - "after first trigger: EngineeringReport.${er_id}.verified_component_count == 1"
            - "after first trigger: EngineeringReport.${er_id}.total_replacement_cost_cents == 8000000"
            - "after second trigger: MajorComponent.${mc_roof}.verification_status == VERIFIED"
            - "after second trigger: EngineeringReport.${er_id}.verified_component_count == 2"
            - "after second trigger: EngineeringReport.${er_id}.total_replacement_cost_cents == 18000000"
      - name: create_engineering_report_under_unknown_project_returns_project_not_found
        claim_type: parent_relationships
        grounds:
          - entities.EngineeringReport.parent
          - validations[priority 5]
          - errors[ERR_PROJECT_NOT_FOUND]
          - endpoints[POST /conversion-projects/{id}/engineering-reports]
        distinguishing_aspect: "A child cannot be minted under a non-existent parent: the nested create
          must 404 with the project-family id even though the request body itself is perfectly valid,
          proving the parent existence check at priority 5 precedes request-shape validation at 14."
        test_recipe:
          setup:
            - "No ConversionProject with id project-does-not-exist exists."
          setup_api_calls: []
          trigger:
            - call: "POST /conversion-projects/project-does-not-exist/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { err_id: "$.data.error_id" }
          assert:
