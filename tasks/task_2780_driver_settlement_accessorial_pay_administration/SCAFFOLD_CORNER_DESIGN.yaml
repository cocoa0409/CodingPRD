            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Dev Derived", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_drc: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_drc}/assign-pay-package"
              payload: { pay_package_id: "${pkg_drc}" }
              as: PayrollAdmin
