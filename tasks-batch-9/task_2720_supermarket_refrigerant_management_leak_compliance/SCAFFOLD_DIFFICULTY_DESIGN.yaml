            - "RepairAttempt.${attempt2_id}.outcome == AWAITING_VERIFICATION and attempt_number == 2"
            - "naming A1: HTTP 422 with error_id == ERR_REPAIR_ATTEMPT_NOT_CURRENT"
            - "naming A1: LeakEvent.${event_id}.status == VERIFICATION_PENDING and failed_verification_count == 0 (no test row written)"
            - "naming A2: HTTP 201 with VerificationTest.${test_id}.test_sequence == INITIAL_VERIFICATION and result == PASS"
            - "naming A2: RepairAttempt.${attempt2_id}.outcome == VERIFIED and LeakEvent.${event_id}.status == FOLLOWUP_PENDING"
            - "naming A2: LeakEvent.${event_id}.verification_deadline == 2026-08-17T13:00:00Z"
            - "RepairAttempt.${attempt1_id}.outcome remains SUPERSEDED (a superseded attempt is never revived)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_labour_intervals_are_half_open_abutting_allowed
        grounds:
          - validations[priority=32]
          - errors[ERR_TECHNICIAN_SCHEDULE_CONFLICT]
          - entities.ServiceRecord.fields.occupies_until
          - entities.ServiceRecord.fields.duration_minutes
        distinguishing_aspect: |
          Resource entity: Technician. Interval semantics: HALF-OPEN
          [performed_at, performed_at + duration_minutes). A record starting at
          the exact instant the previous one ends is therefore legal, while a
          record starting one minute earlier overlaps by a single minute and is
          rejected. Each attempt uses a different recovery machine so the
          equipment rule cannot fire and the technician rule is isolated.
        test_recipe:
          setup:
            - "Clock 2026-08-01T12:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0), T1 TYPE_II, two machines EQ1 (RM-9001) and EQ2 (RM-9002) both certified HIGH and verified 2026-06-01."
            - "Baseline record R1: ROUTINE_MAINTENANCE by T1 on EQ1 at 2026-08-01T08:00:00Z, duration_minutes 60, so T1 occupies [08:00, 09:00) and occupies_until == 2026-08-01T09:00:00Z."
            - "ROUTINE_MAINTENANCE moves no refrigerant, so the charge ledger and leak rate stay constant across the whole instance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
