# =============================================================================
# Task 0847 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: trip_fee_provisional_vs_final_diverge
        grounds:
          - calculations.trip_fee
          - entities.Trip.fields.provisional_fee_cents
          - entities.Trip.fields.final_fee_cents
          - state_machines.Trip.PICKED_UP_to_COMPLETED
        distinguishing_aspect: |
          Same Trip, two variants: provisional keys off dispatch_ts hour, final keys off
          pickup_ts hour; a dispatch off-peak (15:xx) and a pickup on-peak (16:xx) yield
          different fees (350 vs 525) on the SAME row.
        test_recipe:
          setup:
            - "TNC operator ACTIVE; one ACTIVE vehicle+permit queued at head of a lot; clock at 2026-04-01T15:55:00Z (hour 15, off-peak)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T15:55:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Acme TNC", operator_type: "TNC", contact_email: "a@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "P1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotA", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe_id: $.data.id }
          trigger:
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh_id}", staging_lot_id: "${lot_id}", trip_kind: "PICKUP", is_wheelchair_trip: false }
              as: Operator
              as_user_id: "${op_id}"
              captures: { trip_id: $.data.id, prov: $.data.provisional_fee_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T16:10:00Z" }
              as: AirportAuthority
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fin: $.data.final_fee_cents }
          assert:
            - "Trip.${trip_id}.provisional_fee_cents == 350"
            - "Trip.${trip_id}.final_fee_cents == 525"

      - name: operator_penalty_rolling_vs_lifetime_diverge
        grounds:
          - calculations.operator_penalty_score
          - entities.Operator.fields.rolling_penalty_points
          - entities.Operator.fields.lifetime_penalty_points
          - state_machines.Violation.OPEN_to_ASSESSED
        distinguishing_aspect: |
          Dual-variant on a DIFFERENT entity domain (Operator risk scoring, not Trip cost):
          an AVI_MISMATCH assessed 200 days ago (6 pts) falls out of the 90-day rolling
          window but stays in lifetime, so rolling==3 while lifetime==9.
        test_recipe:
          setup:
            - "Operator ACTIVE; one AVI_MISMATCH violation ASSESSED at 2026-03-01, one STAGING violation ASSESSED at 2026-09-17; clock at 2026-09-17."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Beta Taxi", operator_type: "TAXI", contact_email: "b@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/violations"
              payload: { operator_id: "${op_id}", violation_type: "AVI_MISMATCH" }
              as: AirportAuthority
              captures: { vio1_id: $.data.id }
            - call: "POST /v1/violations/${vio1_id}/transitions"
              payload: { action: "ASSESS" }
              as: AirportAuthority
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T00:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/violations"
              payload: { operator_id: "${op_id}", violation_type: "STAGING" }
              as: AirportAuthority
              captures: { vio2_id: $.data.id }
            - call: "POST /v1/violations/${vio2_id}/transitions"
              payload: { action: "ASSESS" }
              as: AirportAuthority
          trigger:
            - call: "GET /v1/operators/${op_id}"
              payload: {}
              as: AirportAuthority
              captures: { roll: $.data.rolling_penalty_points, life: $.data.lifetime_penalty_points }
          assert:
            - "Operator.${op_id}.rolling_penalty_points == 3"
            - "Operator.${op_id}.lifetime_penalty_points == 9"
            - "Operator.${op_id}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: trip_fee_peak_wav_floor_mode_a
        grounds:
          - calculations.trip_fee
          - entities.Trip.fields.final_fee_cents
          - entities.Operator.fields.operator_type
        distinguishing_aspect: |
          Mode (a): a formula with >=3 interacting inputs and a nested max — base-by-type
          (TNC 350) * peak multiplier (1.5) minus WAV discount (100), then max(FEE_FLOOR, .),
          giving 525-100=425 (not floored).
        test_recipe:
          setup:
            - "TNC operator ACTIVE; WAV vehicle+permit queued at head; clock at 2026-04-02T16:00:00Z (hour 16, peak)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T16:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Acme TNC", operator_type: "TNC", contact_email: "a@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "WAV1", is_wheelchair_accessible: true }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-2", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotB", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe_id: $.data.id }
          trigger:
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh_id}", staging_lot_id: "${lot_id}", trip_kind: "PICKUP", is_wheelchair_trip: true }
              as: Operator
              as_user_id: "${op_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fin: $.data.final_fee_cents }
          assert:
            - "Trip.${trip_id}.final_fee_cents == 425"

      - name: settlement_admin_fee_sum_then_round_mode_b
        grounds:
          - calculations.settlement_statement_totals
          - entities.SettlementStatement.fields.admin_fee_cents
          - entities.SettlementStatement.fields.net_due_cents
          - state_machines.SettlementStatement.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (b): rounding-order pinned to SUM-THEN-ROUND. Two 500-cent LIMO trips give
          gross 1000; admin = round_half_up(1000*0.025)=25, whereas per-trip rounding would
          give round(12.5)+round(12.5)=26. Statement pins 25.
        test_recipe:
          setup:
            - "LIMO operator ACTIVE with two ACTIVE vehicles; each completes one off-peak non-WAV trip (fee 500) on 2026-05-01; an OPEN 2026-05 statement exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T12:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Lux Limo", operator_type: "LIMO", contact_email: "l@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "L1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh1: $.data.id, veh1_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh1}", avi_tag_id: "AVI-L1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh1_v}" }
              as: AirportAuthority
              captures: { p1: $.data.id }
            - call: "POST /v1/permits/${p1}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "L2" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh2: $.data.id, veh2_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh2}", avi_tag_id: "AVI-L2", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh2_v}" }
              as: AirportAuthority
              captures: { p2: $.data.id }
            - call: "POST /v1/permits/${p2}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotC", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh1}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe1: $.data.id }
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh1}", staging_lot_id: "${lot_id}", trip_kind: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { trip1: $.data.id }
            - call: "POST /v1/trips/${trip1}/transitions"
              payload: { action: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /v1/trips/${trip1}/transitions"
              payload: { action: "COMPLETE" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh2}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe2: $.data.id }
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh2}", staging_lot_id: "${lot_id}", trip_kind: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { trip2: $.data.id }
            - call: "POST /v1/trips/${trip2}/transitions"
              payload: { action: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /v1/trips/${trip2}/transitions"
              payload: { action: "COMPLETE" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /v1/settlements"
              payload: { operator_id: "${op_id}", period_year: 2026, period_month: 5 }
              as: AirportAuthority
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /v1/settlements/${stmt_id}/transitions"
              payload: { action: "CLOSE" }
              as: AirportAuthority
              captures: { gross: $.data.gross_fees_cents, admin: $.data.admin_fee_cents, net: $.data.net_due_cents, tc: $.data.total_trip_count }
          assert:
            - "SettlementStatement.${stmt_id}.gross_fees_cents == 1000"
            - "SettlementStatement.${stmt_id}.admin_fee_cents == 25"
            - "SettlementStatement.${stmt_id}.net_due_cents == 1025"
            - "SettlementStatement.${stmt_id}.total_trip_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: operator_suspend_reinstate_cycle
        grounds:
          - state_machines.Operator.ACTIVE_to_SUSPENDED
          - state_machines.Operator.SUSPENDED_to_ACTIVE
          - entities.Operator.fields.status
        distinguishing_aspect: |
          Operator has a SUSPENDED->ACTIVE back-edge (cycle): admin SUSPEND then REINSTATE
          returns status to a previously-visited state ACTIVE with suspended_reason cleared.
        test_recipe:
          setup:
            - "Operator ACTIVE, no vehicles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Cyc Co", operator_type: "SHUTTLE", contact_email: "c@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
          trigger:
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "SUSPEND" }
              as: AirportAuthority
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "REINSTATE" }
              as: AirportAuthority
              captures: { st: $.data.status }
          assert:
            - "Operator.${op_id}.status == ACTIVE"
            - "Operator.${op_id}.suspended_reason == null"

      - name: violation_appeal_overturn_branch
        grounds:
          - state_machines.Violation.APPEALED_to_OVERTURNED
          - state_machines.Violation.APPEALED_to_UPHELD
          - state_machines.Violation.ASSESSED_to_APPEALED
          - entities.Operator.fields.lifetime_penalty_points
        distinguishing_aspect: |
          Violation fork-joins OPEN->{ASSESSED,DISMISSED} and APPEALED->{UPHELD,OVERTURNED}
          with DIVERGENT side effects: OVERTURN removes the points (operator lifetime 3->0)
          whereas UPHOLD would leave them; a purely linear machine cannot express this.
        test_recipe:
          setup:
            - "Operator ACTIVE; one STAGING violation ASSESSED (lifetime 3) then APPEALED, within the appeal window; clock 2026-03-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Branch Co", operator_type: "TAXI", contact_email: "br@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/violations"
              payload: { operator_id: "${op_id}", violation_type: "STAGING" }
              as: AirportAuthority
              captures: { vio_id: $.data.id }
            - call: "POST /v1/violations/${vio_id}/transitions"
              payload: { action: "ASSESS" }
              as: AirportAuthority
            - call: "POST /v1/violations/${vio_id}/transitions"
              payload: { action: "APPEAL" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /v1/violations/${vio_id}/transitions"
              payload: { action: "OVERTURN" }
              as: AirportAuthority
              captures: { st: $.data.status }
          assert:
            - "Violation.${vio_id}.status == OVERTURNED"
            - "Operator.${op_id}.lifetime_penalty_points == 0"
            - "Operator.${op_id}.rolling_penalty_points == 0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: operator_suspend_cascades_vehicle_trip_curb_depth3
        grounds:
          - state_machines.Operator.ACTIVE_to_SUSPENDED
          - state_machines.Vehicle.ACTIVE_to_SUSPENDED
          - state_machines.Trip.DISPATCHED_to_CANCELLED
          - state_machines.CurbAssignment.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Depth-3 chain from admin SUSPEND: Operator->Vehicle (link1) causes Vehicle->Trip
          CANCELLED (link2) which itself causes Trip->CurbAssignment RELEASED (link3); each
          link is caused by the previous, not by the original SUSPEND.
        test_recipe:
          setup:
            - "Operator ACTIVE; ACTIVE vehicle+permit; a DISPATCHED trip with an ACTIVE curb assignment; clock 2026-04-05T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T10:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Casc Co", operator_type: "TNC", contact_email: "ca@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "CX1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-CX1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotD", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe_id: $.data.id }
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh_id}", staging_lot_id: "${lot_id}", trip_kind: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /v1/curb-zones"
              payload: { name: "Z1", terminal: "T1", capacity: 1 }
              as: AirportAuthority
              captures: { zone_id: $.data.id }
            - call: "POST /v1/curb-assignments"
              payload: { curb_zone_id: "${zone_id}", trip_id: "${trip_id}", start_ts: "2026-04-05T10:00:00Z", end_ts: "2026-04-05T10:30:00Z" }
              as: CurbCoordinator
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "SUSPEND" }
              as: AirportAuthority
          assert:
            - "Vehicle.${veh_id}.status == SUSPENDED"
            - "Permit.${permit_id}.permit_status == SUSPENDED"
            - "Trip.${trip_id}.status == CANCELLED"
            - "CurbAssignment.${ca_id}.status == RELEASED"

      - name: violation_assess_threshold_cascades_operator_suspend_depth2
        grounds:
          - state_machines.Violation.OPEN_to_ASSESSED
          - state_machines.Operator.ACTIVE_to_SUSPENDED
          - calculations.operator_penalty_score
          - entities.Operator.fields.suspended_reason
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (Violation ASSESS): the assessment mutates
          operator.rolling_penalty_points to 12 (link1), and that field crossing the
          threshold causes Operator->SUSPENDED reason PENALTY_THRESHOLD (link2).
        test_recipe:
          setup:
            - "Operator ACTIVE with one ASSESSED AVI_MISMATCH (6 pts, rolling=6) and one OPEN NO_DECAL (6 pts) ready to assess; clock 2026-03-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Thresh Co", operator_type: "TNC", contact_email: "t@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/violations"
              payload: { operator_id: "${op_id}", violation_type: "AVI_MISMATCH" }
              as: AirportAuthority
              captures: { vio1_id: $.data.id }
            - call: "POST /v1/violations/${vio1_id}/transitions"
              payload: { action: "ASSESS" }
              as: AirportAuthority
            - call: "POST /v1/violations"
              payload: { operator_id: "${op_id}", violation_type: "NO_DECAL" }
              as: AirportAuthority
              captures: { vio2_id: $.data.id }
          trigger:
            - call: "POST /v1/violations/${vio2_id}/transitions"
              payload: { action: "ASSESS" }
              as: AirportAuthority
          assert:
            - "Violation.${vio2_id}.status == ASSESSED"
            - "Operator.${op_id}.rolling_penalty_points == 12"
            - "Operator.${op_id}.status == SUSPENDED"
            - "Operator.${op_id}.suspended_reason == PENALTY_THRESHOLD"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_state_beats_amount_mismatch
        grounds:
          - validations[priority=6]
          - validations[priority=21]
          - state_machines.SettlementStatement.CLOSED_to_SETTLED
        distinguishing_aspect: |
          Dual failure on SETTLE: statement still OPEN (state, priority 6) AND payment amount
          wrong (business_fiscal, priority 21) -> the state error ERR_INVALID_STATE wins.
          Category pair: state vs business_fiscal.
        test_recipe:
          setup:
            - "Operator ACTIVE; an OPEN (never closed) 2026-06 statement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Pri Co", operator_type: "TAXI", contact_email: "p@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/settlements"
              payload: { operator_id: "${op_id}", period_year: 2026, period_month: 6 }
              as: AirportAuthority
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /v1/settlements/${stmt_id}/transitions"
              payload: { action: "SETTLE", payment_amount_cents: 999 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response http_status == 409"

      - name: dispatch_permit_invalid_beats_not_queue_head
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - state_machines.Permit.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Dual failure on dispatch of vehicle B (queued at position 2, its permit EXPIRED):
          business_referential permit-invalid (priority 9) AND business_constraint not-head
          (priority 14) -> ERR_VEHICLE_PERMIT_INVALID wins. Different category pair than the
          state-vs-fiscal instance.
        test_recipe:
          setup:
            - "Operator ACTIVE; vehicle A queued at head (pos1); vehicle B queued at pos2 with its permit EXPIRED; clock 2026-04-10T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T10:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Head Co", operator_type: "TNC", contact_email: "h@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "A" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { vehA: $.data.id, vehA_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${vehA}", avi_tag_id: "AVI-A", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${vehA_v}" }
              as: AirportAuthority
              captures: { pA: $.data.id }
            - call: "POST /v1/permits/${pA}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "B" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { vehB: $.data.id, vehB_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${vehB}", avi_tag_id: "AVI-B", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${vehB_v}" }
              as: AirportAuthority
              captures: { pB: $.data.id }
            - call: "POST /v1/permits/${pB}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotE", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
