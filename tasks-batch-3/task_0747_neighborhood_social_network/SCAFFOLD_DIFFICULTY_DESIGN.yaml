              as: AgencyOfficer
              as_user_id: "OFF1"
              captures: { cn1_id: "$.data.id" }
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /neighborhood/civic-notices"
              payload: { neighborhood_id: "${n1_id}", title: "Followup", body: "more", notice_kind: "POLICE", effective_from: "2026-06-10T00:00:00Z", effective_until: "2026-06-15T00:00:00Z" }
              as: AgencyOfficer
              as_user_id: "OFF1"
              captures: { cn2_id: "$.data.id" }
          assert:
            - "POST /civic-notices returns 201"
            - "CivicNotice.${cn2_id}.state == \"SCHEDULED\""
            - "Adjacent intervals (A.effective_until == B.effective_from) succeed — half-open semantics"

