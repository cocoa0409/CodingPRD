            - { call: "POST /api/supply-orders/${ord}/submit", as: Patient, as_user_id: "${pat}" }
            - { call: "POST /api/supply-orders/${ord}/review", payload: { decision: APPROVE }, as: SupplyCoordinator }
          trigger:
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv3: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 4 } ], expected_patient_version: "${pv3}" }, as: Patient, as_user_id: "${pat}", captures: { e1: $.data.error_id } }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-05-06T12:00:00Z", window_end: "2026-05-06T08:00:00Z" }, as: SupplyCoordinator, captures: { e2: $.data.error_id } }
          assert:
            - "second May order while the first is APPROVED: e1 == ERR_MONTH_ORDER_EXISTS"
            - "window_end before window_start: e2 == ERR_INVALID_REQUEST"

      - name: activate_gate_ladder_enforced_in_order
        claim_type: cross_entity_validation
        grounds: [state_machines.Patient.TRAINING_to_ACTIVE_HOME, "errors[ERR_TRAINING_INCOMPLETE]", "errors[ERR_ASSESSMENT_NOT_CURRENT]", "errors[ERR_NO_MACHINE_ASSIGNED]", "errors[ERR_NO_ACTIVE_PLAN]"]
        distinguishing_aspect: "One patient climbing the readiness ladder: each activate attempt fails on exactly the next unmet gate — training, then assessment, then machine, then plan — proving the pinned gate order."
        test_recipe:
          setup: ["program; TRAINING patient; gates added one at a time"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat A", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
          trigger:
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist, captures: { e1: $.data.error_id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a1: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a2: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: ASEPTIC_TECHNIQUE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a3: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: EMERGENCY_RESPONSE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a4: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: SUPPLY_STORAGE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a5: $.data.id } }
            - { call: "POST /api/training-attempts/${a1}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a2}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a3}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a4}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a5}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist, captures: { e2: $.data.error_id } }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist, captures: { e3: $.data.error_id } }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-Z", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mv: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mv}" }, as: BiomedTechnician }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist, captures: { e4: $.data.error_id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pv}" }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist, captures: { pst: $.data.program_status } }
          assert:
            - "gate order observed: e1 == ERR_TRAINING_INCOMPLETE, e2 == ERR_ASSESSMENT_NOT_CURRENT, e3 == ERR_NO_MACHINE_ASSIGNED, e4 == ERR_NO_ACTIVE_PLAN"
            - "after all four gates: program_status == ACTIVE_HOME and ever_home_ready latched true"

      - name: log_create_while_training_returns_not_active_home
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_PATIENT_NOT_ACTIVE_HOME]", state_machines.TreatmentLog]
        distinguishing_aspect: "A TRAINING patient with an assigned machine still cannot log treatments — program_status must be ACTIVE_HOME."
        test_recipe:
          setup: ["program; TRAINING patient; machine assigned to the patient"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat A", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-Z", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mv: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mv}" }, as: BiomedTechnician }
          trigger:
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-01", duration_minutes: 240, consumption: [] }, as: Patient, as_user_id: "${pat}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PATIENT_NOT_ACTIVE_HOME, http 409"

      - name: priority_conflict_state_vs_safety_corner
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]"]
        excluded_because:
          difficulty_instance: submit_cancelled_order_blocked_posture_state_wins
          rationale: "Dual-failure ordering between state and business_safety is asserted there."

      - name: priority_conflict_temporal_vs_fiscal_corner
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: submit_past_month_over_capacity_temporal_wins
          rationale: "Dual-failure ordering between business_temporal and business_fiscal is asserted there."

  # ============================================================== ENDPOINTS
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shapes
        claim_type: creation
        grounds: [response_envelope]
        distinguishing_aspect: "Success envelope carries meta.api_request_id/api_request_timestamp + response_type object + data; error envelope carries response_type error + data.error_id/message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "GET /api/patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "success: response_type == object, meta.api_request_id non-empty, meta.api_request_timestamp ISO8601, data.id present"
            - "error: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty, meta present"

      - name: order_list_filter_and_pagination
        claim_type: listing
        grounds: [response_envelope, list_ordering, "endpoints[GET /api/patients/{id}/supply-orders]"]
        distinguishing_aspect: "order_status filter narrows the list to the CANCELLED row; limit=1 pages the unfiltered list with has_more true; ordering is created_at ASC."
        test_recipe:
          setup: ["program; TRAINING patient with a cancelled May order and a DRAFT June order"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat A", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 2 } ], expected_patient_version: "${pv1}" }, as: Patient, as_user_id: "${pat}", captures: { ord_a: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-06", lines: [ { sku: "DIALYSATE_2L", quantity: 3 } ], expected_patient_version: "${pv2}" }, as: Patient, as_user_id: "${pat}", captures: { ord_b: $.data.id } }
            - { call: "POST /api/supply-orders/${ord_a}/cancel", as: Patient, as_user_id: "${pat}" }
          trigger:
            - { call: "GET /api/patients/${pat}/supply-orders", as: ProgramAdmin, captures: { first: "$.data[0].id", second: "$.data[1].id" } }
            - { call: "GET /api/patients/${pat}/supply-orders?order_status=CANCELLED", as: ProgramAdmin, captures: { cid: "$.data[0].id" } }
            - { call: "GET /api/patients/${pat}/supply-orders?limit=1&offset=0", as: ProgramAdmin, captures: { p1first: "$.data[0].id" } }
          assert:
            - "unfiltered: total_count == 2, data[0].id == ${ord_a} and data[1].id == ${ord_b} (created_at ASC), data[2] absent"
            - "filtered order_status=CANCELLED: data[0].id == ${ord_a}, data[1] absent (exactly 1 row)"
            - "limit=1: data[0].id == ${ord_a} with data[1] absent from the page, and pagination has_more == true"

  # ============================================================== RBAC
  - section: rbac
    instances:
      - name: patient_cannot_create_program
        claim_type: rbac_denial
        grounds: [roles.Patient, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Patient role is denied ProgramAdmin's exclusive program-creation operation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [] }, as: Patient, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, http 403"

      - name: coordinator_cannot_register_machine
        claim_type: rbac_denial
        grounds: [roles.SupplyCoordinator, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "SupplyCoordinator is denied BiomedTechnician's exclusive machine-registration operation."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [] }, as: ProgramAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-X", model: "HomeX" }, as: SupplyCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, http 403"

      - name: admin_cannot_activate_patient
        claim_type: rbac_denial
        grounds: [roles.ProgramAdmin, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "ProgramAdmin is denied the Nephrologist-exclusive patient activation even though the role is otherwise administrative."
        test_recipe:
          setup: ["program; TRAINING patient"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat A", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
          trigger:
            - { call: "POST /api/patients/${pat}/activate", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, http 403"

  # ============================================================== CROSS-CUTTING LAYERS
  - section: cross_cutting_layers
    instances:
      - name: occ_order_create_stale_patient_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[supply-order-create-stale-patient]", "errors[ERR_STALE_VERSION]", "endpoints[POST /api/supply-orders]"]
        distinguishing_aspect: "Creating an order with the patient version observed before a prescription PATCH (which bumped it) is rejected 412; re-reading and resubmitting with the fresh version succeeds — two strictly sequential requests, no wall-clock dependence."
        test_recipe:
          setup: ["program; patient at version 1"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat A", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv_stale: $.data.version } }
            - { call: "PATCH /api/patients/${pat}/prescription", payload: { prescription_units_per_treatment: 8 }, as: Nephrologist }
          trigger:
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 2 } ], expected_patient_version: "${pv_stale}" }, as: Patient, as_user_id: "${pat}", captures: { err: $.data.error_id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv_fresh: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 2 } ], expected_patient_version: "${pv_fresh}" }, as: Patient, as_user_id: "${pat}", captures: { ord: $.data.id, ost: $.data.order_status } }
          assert:
            - "stale expected_patient_version: error_id == ERR_STALE_VERSION, http 412"
            - "fresh version: 201, order_status == DRAFT"
            - "Patient.version advanced by the PATCH and again by the successful create"

      - name: cascading_side_effects_layer_corner
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: permanent_transition_machine_maintenance_cascade
          rationale: "The N-level cascade (transition -> patient -> machine -> maintenance events, plus plan/order/slot siblings) is asserted end-to-end there."

      - name: dual_variant_calculation_layer_corner
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: supply_allowance_standard_vs_actualized_diverge
          rationale: "Variant divergence, variant selection by context, and reconciliation delta (adjustment_units carry) are asserted there; adherence variants are covered by adherence_streak_vs_rolling_diverge."

  # ============================================================== CONSISTENCY MODEL
  - section: consistency_model
    instances:
      - name: immediate_consistency_money_visible_in_create_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.handling_fee, calculations.order_grand_total]
        distinguishing_aspect: "The 201 create response itself carries the fully computed money fields (no re-fetch, no lag): subtotal 2400, fee 521, discount 0, grand 2921 for 2 x DIALYSATE_2L at 1200 with rate 10.5."
        test_recipe:
          setup: ["program; patient at version 1"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat A", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 2 } ], expected_patient_version: "${pv}" }, as: Patient, as_user_id: "${pat}", captures: { sub: $.data.subtotal_cents, fee: $.data.handling_fee_cents, disc: $.data.discount_cents, grand: $.data.grand_total_cents } }
          assert:
            - "subtotal_cents == 2400, handling_fee_cents == 521 (500 + round(2*10.5)), discount_cents == 0, grand_total_cents == 2921 — all in the create response body"
