              payload: { pole_id: "${p_id}", estimated_cost_cents: 200000 }
              as: ProgramManager
              captures: { o_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders/${o_id}/defer"
              payload: {}
              as: ProgramManager
              captures: { st1: $.data.status, dc: $.data.deferral_count, esc: $.data.escalated_cost_cents }
          trigger:
            - call: "POST /pole-program/inspection-cycles/${c_id}/reconcile"
              payload: { budget_id: "${b_id}" }
              as: ProgramManager
            - call: "GET /pole-program/replacement-work-orders/${o_id}"
              payload: {}
              as: ProgramManager
              captures: { st2: $.data.status, pr2: $.data.priority_score }
          assert:
            - "after defer: status == DEFERRED, deferral_count == 1, escalated_cost_cents == 216000"
            - "after reconcile: status == QUEUED (auto-requeue) and deferral_count still == 1"
            - "after reconcile: priority_score == 55 (deficiency 50 + deferral 5)"
            - "order remains QUEUED because available 100 < 216000"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: accept_reject_priority_cascade_depth3
        grounds:
          - state_machines.InspectionTask.SUBMITTED_to_ACCEPTED
          - state_machines.Pole.IN_SERVICE_to_PRIORITY_REJECT
          - entities.InspectionCycle.fields.pending_replacement_count
        distinguishing_aspect: |
          Depth-3 chain from the qa-review ACCEPT trigger: task acceptance mutates Pole
          (PRIORITY_REJECT, link 1); the pole transition auto-creates a QUEUED
          ReplacementWorkOrder (link 2); the order creation increments
          InspectionCycle.pending_replacement_count (link 3) — each link caused by the previous.
        test_recipe:
          setup:
            - "Cycle CONSERVATIVE OPEN pct 0; pole P-CAS (class 3); task submitted with readings giving effective_rs 28.00 (REJECT_PRIORITY), hazard_flag true, three photo types"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-CAS", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.00
                sound_wood_pct: 30
                decay_pocket_depth_in: 0.4
                moisture_pct: 25
                hazard_flag: true
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: DECAY_POCKET, url: "https://ev/d.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: ACCEPT }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "GET /pole-program/poles/${p_id}"
              payload: {}
              as: ProgramManager
              captures: { pst: $.data.status, prs: $.data.current_remaining_strength_pct }
            - call: "GET /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}" }
              as: ProgramManager
              captures: { o_id: "$.data[0].id", o_st: "$.data[0].status", o_cy: "$.data[0].cycle_id", o_pr: "$.data[0].priority_score", o_cost: "$.data[0].escalated_cost_cents" }
            - call: "GET /pole-program/inspection-cycles/${c_id}"
              payload: {}
              as: ProgramManager
              captures: { prc: $.data.pending_replacement_count }
          assert:
            - "Pole.${p_id}.status == PRIORITY_REJECT and current_remaining_strength_pct == 28.00"
            - "exactly one ReplacementWorkOrder exists for the pole: status QUEUED, cycle_id == ${c_id}"
            - "ReplacementWorkOrder escalated_cost_cents == 250000 (DEFAULT_REPLACEMENT_COST_CENTS, deferral 0)"
            - "ReplacementWorkOrder priority_score == 72 (deficiency 72, no other terms)"
            - "InspectionCycle.${c_id}.pending_replacement_count == 1"

      - name: treatment_fail_suspends_crew_cascade_depth2
        grounds:
          - state_machines.TreatmentWorkOrder.APPLIED_to_FAILED_QA
          - state_machines.ContractorCrew.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (treatment qa-review FAIL): the FAIL mutates
          ContractorCrew counters and recomputes the rolling score (link 1); the recomputed
          rolling score crossing below 70.00 itself flips crew.status ACTIVE -> SUSPENDED (link 2).
        test_recipe:
          setup:
            - "Crew CR-S with four prior decisions P,P,P,F (rolling 75.00, still ACTIVE) and a fifth order APPLIED"
          setup_api_calls:
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-S", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-S", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
