            - call: "POST /api/rabbi-trusts/${trust_id}/funding-events"
              payload: { event_type: "VALUATION_ADJUSTMENT", amount_cents: -5000 }
              as: TrustOfficer
              captures: { e_neg: $.data.error_id }
          assert:
            - "${e_xfund} == ERR_CROSS_PLAN_REFERENCE (fund belongs to plan B, election to plan A)"
            - "${e_xacct} == ERR_CROSS_PLAN_REFERENCE (participant.plan_id == A != B)"
            - "${e_noacct} == ERR_ACCOUNT_REQUIRED (no account for (P2, plan A))"
            - "${e_nocic} == ERR_NO_VERIFIED_CIC"
            - "${e_neg} == ERR_NEGATIVE_TRUST_ASSETS (0 - 5000 < 0)"
      - name: crediting_reverse_not_latest_then_reverse_twice
        claim_type: violation_to_error
        grounds: ["validations[priority=9.3]", "errors[ERR_CREDITING_RUN_NOT_LATEST]", "errors[ERR_CREDITING_RUN_STATE_INVALID]", "state_machines.CreditingRun"]
        distinguishing_aspect: "Only the latest POSTED run per plan is reversible: with runs R1 (Jan) and R2 (Feb) posted, reversing R1 fails ERR_CREDITING_RUN_NOT_LATEST; reversing R2 succeeds; reversing R2 again fails ERR_CREDITING_RUN_STATE_INVALID."
        test_recipe:
          setup: ["ACTIVE plan; two POSTED crediting runs R1 [2027-01-01,2027-02-01) and R2 [2027-02-01,2027-03-01)"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan RN", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/crediting-runs"
              payload: { plan_id: "${plan_id}", period_start: "2027-01-01", period_end: "2027-02-01", expected_plan_version: "${plan_v}" }
              as: BenefitsAdministrator
              captures: { run1_id: $.data.id }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { plan_v2: $.data.version }
            - call: "POST /api/crediting-runs"
              payload: { plan_id: "${plan_id}", period_start: "2027-02-01", period_end: "2027-03-01", expected_plan_version: "${plan_v2}" }
              as: BenefitsAdministrator
              captures: { run2_id: $.data.id }
          trigger:
            - call: "POST /api/crediting-runs/${run1_id}/reverse"
              as: BenefitsAdministrator
              captures: { e_notlatest: $.data.error_id }
            - call: "POST /api/crediting-runs/${run2_id}/reverse"
              as: BenefitsAdministrator
              captures: { r2_status: $.data.status }
            - call: "POST /api/crediting-runs/${run2_id}/reverse"
              as: BenefitsAdministrator
              captures: { e_twice: $.data.error_id }
          assert:
            - "${e_notlatest} == ERR_CREDITING_RUN_NOT_LATEST (R2 has the max period_end)"
            - "${r2_status} == REVERSED"
            - "${e_twice} == ERR_CREDITING_RUN_STATE_INVALID (already REVERSED)"
      - name: reopen_with_paid_distribution_blocked
        claim_type: violation_to_error
        grounds: ["state_machines.SeparationCase", "errors[ERR_CASE_HAS_PAID_DISTRIBUTIONS]"]
        distinguishing_aspect: "A case whose linked distribution reached PAID can never be reopened — the completed payment makes reopening unsafe; ERR_CASE_HAS_PAID_DISTRIBUTIONS fires even though the 30-day window is still open."
        test_recipe:
          setup: ["funded vested account; separation confirmed (alleged 2027-03-15); SEPARATION request for the full vested 100000 verified, scheduled (2027-04-14), and PAID at clock 2027-04-14"]
          setup_api_calls:
            - call: "POST /api/plans"
