  - rule_id: resource_temporal_overlap
    instances:
      - name: work_period_half_open_adjacency
        grounds:
          - validations[priority=8]
          - state_machines.ExperienceReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Resource: the candidate's experience timeline; interval semantics:
          half-open [start, end), so a report starting exactly on another's
          end date is legal adjacency while a one-day-earlier start inside
          the occupied interval conflicts with ERR_WORK_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C, supervisor S; R1 SUBMITTED occupying [2026-01-05, 2026-03-02)"
            - "R2 DRAFT [2026-03-02, 2026-05-01) - adjacent, touches R1's end"
            - "R3 DRAFT [2026-04-15, 2026-06-01) - starts inside R2's interval"
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 40, work_period_start: "2026-01-05", work_period_end: "2026-03-02" }, as: Candidate, as_user_id: "${cand_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 40, work_period_start: "2026-03-02", work_period_end: "2026-05-01" }, as: Candidate, as_user_id: "${cand_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 40, work_period_start: "2026-04-15", work_period_end: "2026-06-01" }, as: Candidate, as_user_id: "${cand_id}", captures: { r3_id: $.data.id } }
          trigger:
            - { call: "POST /licensure/experience-reports/${r2_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r3_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { err: $.data.error_id } }
          assert:
            - "R2 (adjacent, start == R1.end) submits successfully: status == SUBMITTED"
            - "R3 (overlaps R2's occupied interval) rejected: error_id == ERR_WORK_PERIOD_OVERLAP, status stays DRAFT"
            - "half-open semantics: [2026-01-05, 2026-03-02) and [2026-03-02, 2026-05-01) do not intersect"
      - name: exam_day_closed_interval_conflict
        grounds:
          - validations[priority=8]
          - state_machines.ExamDivisionProgress.ELIGIBLE_to_SCHEDULED
        distinguishing_aspect: |
          Resource: the candidate's exam calendar; interval semantics differ
          from the experience timeline's half-open intervals: a sitting
          occupies its ENTIRE calendar day (closed day-granularity interval),
          so a second division on the same date conflicts while the next
          calendar day is free.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C with exam authorization; division PCM SCHEDULED for 2026-10-05"
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/candidates/${cand_id}/exam-authorizations", payload: { jurisdiction_code: "J1" }, as: BoardAdministrator }
            - { call: "GET /licensure/candidates/${cand_id}/exam-progress", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { div_pa: "$.data[1].id", div_pcm: "$.data[2].id" } }
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2026-10-05" }, as: Candidate, as_user_id: "${cand_id}" }
          trigger:
            - { call: "POST /licensure/exam-progress/${div_pa}/schedule", payload: { scheduled_date: "2026-10-05" }, as: Candidate, as_user_id: "${cand_id}", captures: { err: $.data.error_id } }
            - { call: "POST /licensure/exam-progress/${div_pa}/schedule", payload: { scheduled_date: "2026-10-06" }, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "same calendar day (2026-10-05): error_id == ERR_EXAM_DAY_CONFLICT and PA stays ELIGIBLE"
            - "next calendar day (2026-10-06): schedule succeeds, PA == SCHEDULED"
            - "the conflict is day-granular and closed: no time-of-day refinement can make two sittings share 2026-10-05"
  - rule_id: compensating_invariant
    instances:
      - name: ce_entry_add_void_period_conservation
        grounds:
          - entities.Certificate.fields.ce_hours_current_period
          - calculations.ce_period_compliance
          - endpoints.POST /licensure/ce-entries/{id}/void
        distinguishing_aspect: |
          Conserved quantity: Certificate.ce_hours_current_period (and
