              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Lena Ostrom", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { lead_dem_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Sami Adeyemi", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { s1_dem_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Tova Reinholt", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { s2_dem_id: "$.data.id" }
            - call: "POST /demonstrators/${lead_dem_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", certificate_number: "FH-2026-0701", issued_on: "2026-01-05", expires_on: "2027-01-05" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
            - call: "POST /demonstrators/${s1_dem_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", certificate_number: "FH-2026-0702", issued_on: "2026-01-05", expires_on: "2027-01-05" }
              as: StaffingCoordinator
