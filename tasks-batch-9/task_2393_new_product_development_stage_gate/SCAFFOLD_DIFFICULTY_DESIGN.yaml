            - "BusinessCase.${bc_rd_id}.annual_units != 821247, the sum-then-round result"
            - "BusinessCase.${bc_rd_id}.gross_revenue_usd == 2781915.07"
            - "BusinessCase.${bc_rd_id}.gross_revenue_usd != 2781915.06, the round-once-at-the-end result"
            - "BusinessCase.${bc_rd_id}.annual_units == ForecastLine.${fl_g_id}.line_units + ForecastLine.${fl_m_id}.line_units"

      - name: trade_rate_keyed_on_gross_before_net_derivation
        grounds:
          - calculations.business_case_financials
          - entities.BusinessCase.fields.trade_spend_rate_pct
          - entities.BusinessCase.fields.net_revenue_usd
        distinguishing_aspect: |
          Mode (c): net_revenue_usd depends on trade_spend_usd while the trade tier looks like it
          could key off either figure, so the scaffold pins step 1 to gross_revenue_usd — at gross
          exactly 5000000.00 the rate is 15.00 giving net 4000000.00, whereas keying the tier on the
          resulting net would have selected 12.00 and produced trade 600000.00 and net 4150000.00.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "One BEVERAGE NEW_BRAND project with a TOP_DOWN case whose share drives volume to exactly 2000000 units."
            - "A single CLUB forecast line pinning avg_list_price_usd to 2.5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
