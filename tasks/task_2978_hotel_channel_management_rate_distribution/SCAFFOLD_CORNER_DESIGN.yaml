  # =====================================================================================
  - section: rbac
    instances:

      - name: channel_partner_cannot_reach_the_pricing_inventory_or_analytics_surface
        claim_type: role_forbidden_operations
        grounds:
          - roles[ChannelPartner]
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          ChannelPartner has an empty exclusive_operations list, so every write outside the two
          reservation endpoints must be refused - and because the role check is priority 3 it fires
          before path resolution (P4), before body validation (P7) and before the optimistic
          concurrency check (P10), which the PATCH call proves by carrying a perfectly valid version.
        test_recipe:
          setup:
            - "Property HTL-SFO with room type KING, channel OTA1 (the partner's identity) and plan BAR."
            - "The current version of BAR is captured as an admin so the forbidden PATCH can carry a correct expected_rate_plan_version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "GET /distribution/rate-plans/${bar_id}"
              payload: {}
              as: RevenueManager
              captures: { bar_v1: $.data.version }
          trigger:
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "PARTNERBAR", rate_class: "PUBLIC", base_amount_cents: 19000, floor_amount_cents: 15000, ceiling_amount_cents: 30000 }
              as: ChannelPartner
              as_user_id: "${ota1_id}"
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${bar_v1}", base_amount_cents: 19000 }
              as: ChannelPartner
              as_user_id: "${ota1_id}"
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: ChannelPartner
              as_user_id: "${ota1_id}"
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "STOP_SELL", start_date: "2026-09-10", end_date: "2026-09-10" }
              as: ChannelPartner
              as_user_id: "${ota1_id}"
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelPartner
              as_user_id: "${ota1_id}"
            - call: "GET /distribution/room-types/${king_id}/pace"
              payload: { target_stay_date: "2026-09-10" }
              as: ChannelPartner
              as_user_id: "${ota1_id}"
            - call: "GET /distribution/properties/${prop_id}/channel-mix"
              payload: { window_start_date: "2026-08-01", window_end_date: "2026-08-25" }
              as: ChannelPartner
              as_user_id: "${ota1_id}"
            - call: "GET /distribution/reservations"
              payload: { channel_id: "${ota1_id}" }
              as: ChannelPartner
              as_user_id: "${ota1_id}"
          assert:
            - "The first seven partner calls all return HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "The PATCH is refused at priority 3 even though expected_rate_plan_version was correct - BAR still has base_amount_cents 25000 and version ${bar_v1}"
            - "No row was created by any refusal: GET /distribution/rate-plans?property_id=${prop_id} has total_count == 1, and the inventory-day, restriction and mapping lists for the property are all empty"
            - "The last call - a shared operation for this role - returns HTTP 200 with response_type array and data == [] (an empty own-channel reservation list, not a 403)"

      - name: requests_with_missing_or_unknown_x_user_headers_are_unauthenticated
        claim_type: role_forbidden_operations
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Three distinct header defects collapse onto one error at two different priorities: an absent
          header, a present-but-empty header (the empty string, not whitespace) and a syntactically fine
          but undeclared role name. All three answer 401 even when the rest of the request is perfect
          and even when the path id does not exist, proving P1/P2 run ahead of P3 and P4.
        test_recipe:
          setup:
            - "Property HTL-SFO exists so that the authenticated control call has something to read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "GET /distribution/properties/${prop_id}"
              payload: {}
              as: OMIT_ROLE_HEADER
              as_user_id: "admin-1"
            - call: "GET /distribution/properties/${prop_id}"
              payload: {}
              as: ""
              as_user_id: "admin-1"
            - call: "GET /distribution/properties/${prop_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: OMIT_USER_HEADER
            - call: "GET /distribution/properties/${prop_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: ""
            - call: "GET /distribution/properties/${prop_id}"
              payload: {}
              as: RevenueAnalyst
              as_user_id: "analyst-1"
            - call: "GET /distribution/properties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RevenueAnalyst
              as_user_id: "analyst-1"
            - call: "POST /distribution/properties"
              payload: { code: "HTL-LAX", name: "Harborview LAX", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: ""
              as_user_id: ""
          assert:
            - "Missing X-User-Role, X-User-Role sent as the empty string, missing X-User-ID and X-User-ID sent as the empty string all return HTTP 401 with data.error_id == ERR_UNAUTHENTICATED (priority 1)"
            - "X-User-Role: RevenueAnalyst - well formed but not one of the five declared roles - also returns HTTP 401 ERR_UNAUTHENTICATED (priority 2), never 403"
            - "The same unknown role against an id that does not exist still returns 401, not 404 - P2 precedes P4"
            - "The unauthenticated POST created nothing: an authenticated GET /distribution/properties returns total_count == 1 with only HTL-SFO"
            - "Every 401 body still carries the standard error envelope { meta, response_type: \"error\", data: { error_id, message } }"

      - name: channel_partner_cannot_book_or_cancel_on_another_channels_id
        claim_type: peer_roles
        grounds:
          - roles[ChannelPartner]
          - validations[priority=5]
          - errors[ERR_CHANNEL_OWNERSHIP_VIOLATION]
        distinguishing_aspect: |
          ChannelPartner is the only entity_backed role: X-User-ID is a Channel row id, so the same
          role name is a different principal per channel. The ownership check reads the body's
          channel_id on a booking but the stored reservation's channel_id on a cancel, so both
          directions of the peer boundary must be probed - and the two partners' own calls succeed.
        test_recipe:
