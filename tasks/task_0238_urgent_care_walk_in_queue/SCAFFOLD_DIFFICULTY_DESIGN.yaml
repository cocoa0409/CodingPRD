  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # ---- 6.1 posture surge_threshold >= boundary (numeric) on queue create ---
      - name: posture_surge_threshold_inclusive_boundary
        grounds:
          - calculations.clinic_posture
          - entities.Clinic.fields.surge_threshold
          - state_machines.QueueEntry.none_to_WAITING
        distinguishing_aspect: |
          NUMERIC threshold metric: with surge_threshold=3, depth==2 keeps posture
          OPEN, the 3rd WALK_IN create makes depth==3 == surge_threshold and posture
          flips to SURGE (>= inclusive). Reached via POST /clinics/{id}/queue-entries
          — a different endpoint and metric than the occ adjacency edge (6.2).
        test_recipe:
          setup:
            - "Clinic surge_threshold=3, diversion_threshold=20; two WALK_IN entries already WAITING (depth 2, OPEN)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "BoundClinic", exam_room_capacity: 10, surge_threshold: 3, diversion_threshold: 20 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /_seed/queue-depth"
              payload: { clinic_id: "${c}", count: 2 }
              as: Anonymous
              captures: { depth2: $.data.active_queue_depth, posture2: $.data.posture }
          trigger:
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "third" }
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: FrontDeskClerk
              captures: { depth3: $.data.active_queue_depth, posture3: $.data.posture }
          assert:
            - "before 3rd create: Clinic.${c}.active_queue_depth == 2 AND Clinic.${c}.posture == OPEN"
            - "after 3rd create: Clinic.${c}.active_queue_depth == 3 AND Clinic.${c}.posture == SURGE"

      # ---- 6.2 occ collector half-open back-to-back (adjacency) on occ create ---
      - name: occ_slot_half_open_back_to_back_allowed
        grounds:
          - calculations.occ_slot_overlap
          - entities.OccHealthOrder.fields.scheduled_start
          - validations[priority=45]
        distinguishing_aspect: |
          ADJACENCY metric (empty-overlap edge): a DRUG_SCREEN at 10:00-10:30 and a
          second at exactly 10:30-11:00 on the same collector do NOT overlap under
          half-open [start,end) and the second is ACCEPTED (201). Reached via POST
          /occ-health-orders — distinct endpoint/metric from the posture numeric edge.
        test_recipe:
          setup:
            - "One clinic, one collector (provider); clock set to 2026-06-08T09:00:00Z."
            - "First DRUG_SCREEN order booked 10:00-10:30 on the collector."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-08T09:00:00Z" }
              as: Anonymous
            - call: "POST /clinics"
              payload: { name: "OccClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Collector", credential: "NP" }
              as: ClinicManager
              captures: { col: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "occ1" }
              as: FrontDeskClerk
              captures: { qe1: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "occ2" }
              as: FrontDeskClerk
              captures: { qe2: $.data.id }
            - call: "POST /occ-health-orders"
              payload: { queue_entry_id: "${qe1}", order_type: "DRUG_SCREEN", employer_name: "Acme", scheduled_start: "2026-06-08T10:00:00Z", collector_id: "${col}", duration_minutes: 30 }
              as: FrontDeskClerk
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /occ-health-orders"
              payload: { queue_entry_id: "${qe2}", order_type: "DRUG_SCREEN", employer_name: "Acme", scheduled_start: "2026-06-08T10:30:00Z", collector_id: "${col}", duration_minutes: 30 }
              as: FrontDeskClerk
              captures: { o2: $.data.id, o2_status: $.data.status }
          assert:
            - "response status == 201"
            - "OccHealthOrder.${o2}.status == SCHEDULED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # ---- 7.1 Visit rooming depends on ExamRoom.status (Visit -> ExamRoom) -----
      - name: rooming_blocked_by_room_not_available
        grounds:
          - state_machines.QueueEntry.READY_FOR_PROVIDER_to_ROOMED
          - validations[priority=43]
          - entities.ExamRoom.fields.status
        distinguishing_aspect: |
          Visit creation (QueueEntry -> ROOMED) is gated by a DIFFERENT entity's
          state: ExamRoom.status must be AVAILABLE. Targeting a room taken
          OUT_OF_SERVICE yields ERR_ROOM_UNAVAILABLE. Entity pair Visit->ExamRoom.
