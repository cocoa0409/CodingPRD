scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quota_balance_calendar_vs_rolling
        grounds:
          - calculations.quota_balance_calc
          - entities.Employer.fields.leave_year_basis
          - entities.LeaveCase.fields.leave_year_anchor
        distinguishing_aspect: |
          Operates on the LeaveCase/LeaveInstance entity domain (FMLA hours
          bucket). Two valid window definitions (CALENDAR vs ROLLING_BACKWARD)
          produce strictly different consumed_hours for identical instance
          history, so the same employee with the same instances has different
          remaining_hours under each variant.
        test_recipe:
          setup:
            - "Employer A: leave_year_basis=CALENDAR, state_pfl_program=NONE, benefit_premium_share_cents=30000"
            - "Employer B: leave_year_basis=ROLLING_BACKWARD, state_pfl_program=NONE, benefit_premium_share_cents=30000"
            - "Worksite WA/WB under each, employee_count_within_75_miles=80"
            - "Employee EA under A and EB under B; identical hire_date 2023-01-01; hours_worked_trailing_12mo=2080; monthly_wage_cents=500000"
            - "Two APPROVED LeaveCases on each employee: case C1 with 30 hours of APPROVED instances dated 2025-11-03..2025-11-09 (4 instances totalling 32 hours but use exactly 4 x 8 = 32 hours), case C2 with 17 APPROVED instances dated 2026-01-05..2026-02-15 (17 x 8 = 136 hours)"
            - "POST /_clock/advance to to_timestamp=2026-03-01T00:00:00.000Z"
          trigger:
            - "GET /employees/EA/quota-balance?as_of_date=2026-03-01  (CALENDAR)"
            - "GET /employees/EB/quota-balance?as_of_date=2026-03-01  (ROLLING_BACKWARD)"
          assert:
            - "EA response window_start == '2026-01-01' AND window_end == '2026-12-31'"
            - "EA response consumed_hours == 136"
            - "EA response remaining_hours == 344"
            - "EB response window_start == '2025-03-01' AND window_end == '2026-03-01'"
            - "EB response consumed_hours == 168"
            - "EB response remaining_hours == 312"
            - "EA.remaining_hours != EB.remaining_hours given identical instance history"

      - name: pfl_weekly_benefit_under_vs_at_cap
        grounds:
          - calculations.pfl_weekly_benefit_calc
          - entities.PfLClaim.fields.weekly_benefit_cents
          - entities.Employee.fields.monthly_wage_cents
        distinguishing_aspect: |
          Operates on a different entity domain (PfLClaim wage-replacement
          benefit, NOT FMLA quota). Two valid pricing paths (under-cap vs
          at-cap) produce different weekly_benefit_cents for the same formula
          shape: the cap branch ignores wage and pins to PFL_WEEKLY_CAP_CENTS.
        test_recipe:
          setup:
            - "Employer X: state_pfl_program=STATE_PFL_8WEEK"
            - "Employee E1: monthly_wage_cents=500000"
            - "Employee E2: monthly_wage_cents=2000000"
          trigger:
            - "POST /pfl-claims body { employee_id: E1, claim_type: BABY_BONDING, weeks_authorized: 8 }"
            - "POST /pfl-claims body { employee_id: E2, claim_type: BABY_BONDING, weeks_authorized: 8 }"
          assert:
            - "PfLClaim for E1 has weekly_benefit_cents == 69231  (under-cap variant)"
            - "PfLClaim for E2 has weekly_benefit_cents == 162900 (at-cap variant)"
            - "Both PfLClaim rows share identical formula but differ only in cap branch"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: job_restoration_score_per_step_rounding
        grounds:
          - calculations.job_restoration_score
          - entities.LeaveCase.fields.job_restoration_status
          - entities.MedicalCertification.fields.review_outcome
          - entities.BenefitInvoice.fields.invoice_status
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The score chains
          three multiplicative penalty steps (cert × invoice × tenure) and the
          scaffold pins per-step rounding rather than sum-then-round. The
          INSUFFICIENT (0.50) × GRACE (0.75) path produces score 38 only when
          rounded per-step (round_half_up(100*0.50)=50 then round_half_up(50*0.75)=38);
          combined rounding (round_half_up(100*0.50*0.75)=round_half_up(37.5)=38)
          happens to agree here, but the INSUFF × ON_CAP edge with a third tenure
          factor produces divergent results, exercising the pinned order.
        test_recipe:
          setup:
            - "Employer Y: state_pfl_program=NONE, benefit_premium_share_cents=30000, leave_year_basis=CALENDAR"
            - "Worksite headcount 80, Employee EC: hire_date 2023-01-01, hours_worked_trailing_12mo=1500 (below the 2000-hour tenure bonus threshold), monthly_wage_cents=500000"
            - "Create LeaveCase LC with reason OWN_SERIOUS_HEALTH, leave_pattern CONTINUOUS, requested_start_date 2026-04-01, expected_end_date 2026-04-30"
            - "Submit a MedicalCertification, HR reviews as INSUFFICIENT (LeaveCase.certification_status = INSUFFICIENT)"
            - "Force the case into APPROVED state via legitimate path: employee cures the certification, HR ACCEPTS the new cert, HR APPROVES the case; then re-trigger an INSUFFICIENT branch by submitting an INTERMITTENT recertification that HR marks INSUFFICIENT (this is allowed because certification_status is an independent dimension and may flip back to INSUFFICIENT post-approval)"
            - "First BenefitInvoice issued at approval; POST /_clock/advance by 35 days so invoice transitions ISSUED -> GRACE"
          trigger:
            - "GET /leave-cases/LC  (server recomputes job_restoration_score)"
          assert:
            - "Step 1 base_score == 100"
            - "Step 2 (cert INSUFFICIENT) score := round_half_up(100 * 0.50) == 50"
            - "Step 3 (one GRACE invoice) score := round_half_up(50 * 0.75) == 38"
            - "Step 4 (hours_worked_trailing_12mo < 2000) no tenure bonus; score stays 38"
            - "LeaveCase.job_restoration_status == 'FORFEITED'  (38 < JOB_RESTORATION_FLOOR of 50)"

      - name: benefit_invoice_proration_three_input_nonlinear
        grounds:
          - calculations.benefit_invoice_calc
          - entities.BenefitInvoice.fields.amount_due_cents
          - entities.LeaveCase.fields.leave_pattern
        distinguishing_aspect: |
          Mode (a) — formula with 3+ inputs and conditional branches on entity
          state. Inputs: Employer.benefit_premium_share_cents, days_in_month
          (28/29/30/31 from calendar), days_on_leave_in_month (sum of approved
          intermittent instances PLUS a bridge calculation for CONTINUOUS
          cases). The branch on LeaveCase.leave_pattern (CONTINUOUS bridge vs
          INTERMITTENT instance-count) is the non-linear interaction.
        test_recipe:
          setup:
            - "Employer Y: benefit_premium_share_cents=30000, leave_year_basis=CALENDAR, state_pfl_program=NONE"
            - "Employee EI eligible; create LeaveCase LC_INT with leave_pattern=INTERMITTENT, requested_start_date 2026-02-01, expected_end_date 2026-02-28"
            - "Submit MedicalCertification, HR ACCEPTS, log 14 intermittent instances on 2026-02-01..2026-02-14, 8 hours each"
            - "HR APPROVES the case (issues first BenefitInvoice for period 2026-02)"
            - "POST /_clock/advance to 2026-02-28T00:00:00.000Z"
          trigger:
            - "GET /leave-cases/LC_INT/benefit-invoices"
          assert:
            - "Invoice for period_month '2026-02' has amount_due_cents == round_half_up(30000 * 14 / 28) == 15000"
            - "days_in_month resolved from calendar (28 for February 2026, NOT 31)"
            - "Non-linear branch fires: CONTINUOUS bridge is NOT applied because leave_pattern==INTERMITTENT"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: medical_certification_cyclic_cure_loop
        grounds:
          - state_machines.MedicalCertification.PENDING_to_INSUFFICIENT
          - state_machines.MedicalCertification.INSUFFICIENT_to_PENDING
          - entities.MedicalCertification.fields.review_outcome
          - entities.LeaveCase.fields.certification_status
        distinguishing_aspect: |
          MedicalCertification carries a cycle PENDING -> INSUFFICIENT ->
          PENDING via the employee's cure submission. The cycle is on the
          MedicalCertification entity (and reflects into LeaveCase
          certification_status, an independent parallel dimension to case_status).
        test_recipe:
          setup:
            - "Eligible Employee; LeaveCase LC in PENDING_CERTIFICATION; cert_deadline = creation + 15 days"
          trigger:
            - "POST /leave-cases/LC/certifications body { serious_health_condition: true }  -> Cert1 created with review_outcome=PENDING"
            - "POST /leave-cases/LC/certifications/Cert1/review body { decision: 'INSUFFICIENT' }  -> Cert1.review_outcome=INSUFFICIENT, LC.certification_status=INSUFFICIENT"
            - "POST /leave-cases/LC/certifications body { serious_health_condition: true }  -> Cert2 created with review_outcome=PENDING (cycle hop)"
          assert:
            - "Cert1.review_outcome == 'INSUFFICIENT'"
            - "Cert2 exists with review_outcome == 'PENDING'"
            - "LC.certification_status == 'RECEIVED' after cure submission"
            - "MedicalCertification went through PENDING -> INSUFFICIENT -> (cure creates new PENDING row, demonstrating the cycle pattern in the state machine on this entity)"

      - name: leave_case_branching_approve_or_deny
        grounds:
          - state_machines.LeaveCase.PENDING_CERTIFICATION_to_APPROVED
          - state_machines.LeaveCase.PENDING_CERTIFICATION_to_DENIED
          - entities.LeaveCase.fields.case_status
        distinguishing_aspect: |
          LeaveCase (different entity from MedicalCertification) has a
          branching shape: from PENDING_CERTIFICATION it forks to APPROVED or
          DENIED, each with disjoint side-effect sets. APPROVED cascades to
          create BenefitInvoice and flip PfLClaim to PAYING; DENIED voids
          all instances and re-credits the quota. The two branches diverge
          in side-effect topology, not in target state alone.
        test_recipe:
          setup:
            - "Two eligible employees, each with a PENDING_CERTIFICATION LeaveCase carrying 2 PROPOSED instances of 8 hours each"
            - "Both have MedicalCertifications in COMPLETE state"
          trigger:
            - "POST /leave-cases/LC1/review body { decision: 'APPROVE' }"
            - "POST /leave-cases/LC2/review body { decision: 'DENY' }"
          assert:
            - "LC1.case_status == 'APPROVED', LC1.hours_charged == 16, all LC1 instances.instance_status == 'APPROVED', at least one BenefitInvoice issued for LC1"
            - "LC2.case_status == 'DENIED', LC2.hours_charged == 0, all LC2 instances.instance_status == 'VOIDED', no BenefitInvoice created for LC2"
            - "The same FROM state forks to different TO states with disjoint side-effect lists"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: invoice_forfeit_cascade_depth_3
        grounds:
          - state_machines.BenefitInvoice.ISSUED_to_GRACE
          - state_machines.BenefitInvoice.GRACE_to_FORFEITED
          - entities.LeaveCase.fields.job_restoration_status
          - entities.BenefitInvoice.fields.invoice_status
        distinguishing_aspect: |
          Triggered by /_clock/advance crossing 45 days past invoice creation.
          Depth 3: clock advance -> BenefitInvoice ISSUED -> GRACE (link 1)
          caused by the advance; GRACE -> FORFEITED (link 2) caused BY the
          previous link's state, not by the original advance directly (the
          sweep evaluates each invoice in its current state, so the 45-day
          rule fires only because the 30-day rule already flipped to GRACE);
          FORFEITED -> LeaveCase.job_restoration_status := FORFEITED (link 3)
          caused by the GRACE_to_FORFEITED transition's side_effects. Each
          link is consequence-of-previous, not parallel fan-out.
        test_recipe:
          setup:
            - "Eligible Employee EF; LeaveCase LCF APPROVED, ACTIVE, first BenefitInvoice issued at 2026-01-15"
          trigger:
            - "POST /_clock/advance to 2026-02-15T00:00:00.000Z  (invoice age = 31 days, triggers ISSUED -> GRACE)"
            - "POST /_clock/advance to 2026-03-02T00:00:00.000Z  (invoice age = 46 days, triggers GRACE -> FORFEITED which cascades to LeaveCase)"
          assert:
            - "Invoice.invoice_status flipped ISSUED -> GRACE on the first /_clock/advance (link 1, caused by the advance)"
            - "Invoice.invoice_status flipped GRACE -> FORFEITED on the second /_clock/advance (link 2, caused by being in GRACE — not by the advance directly; the 45-day rule cannot fire from ISSUED)"
            - "LeaveCase.job_restoration_status == 'FORFEITED' (link 3, caused by Invoice GRACE_to_FORFEITED side_effect)"
            - "Subsequent POST /leave-cases/LCF/restore-job returns 409 ERR_JOB_RESTORATION_FORFEITED"

      - name: deny_review_cascade_depth_2
        grounds:
          - state_machines.LeaveCase.PENDING_CERTIFICATION_to_DENIED
          - entities.LeaveInstance.fields.instance_status
          - entities.PfLClaim.fields.claim_status
          - entities.LeaveCase.fields.hours_charged
        distinguishing_aspect: |
          Triggered by HRSpecialist review with decision=DENY (a DIFFERENT
          trigger than the clock-advance of the depth-3 cascade above).
          Depth 2: review POST -> LeaveCase DENIED (link 1) caused by the
          POST; LeaveCase DENIED -> all LeaveInstance.instance_status :=
          VOIDED AND PfLClaim.claim_status := DENIED (link 2) caused BY the
          case becoming DENIED, not directly by the review POST. The void
          step also recomputes hours_charged := 0 as a consequence of the
          per-instance flip, demonstrating consequence-of-previous chaining.
        test_recipe:
          setup:
            - "Employer with state_pfl_program=STATE_PFL_8WEEK; eligible Employee EG"
            - "PfLClaim P1 for EG; LeaveCase LCG with pfl_claim_id=P1, reason=FAMILY_SERIOUS_HEALTH, leave_pattern=INTERMITTENT, two PROPOSED instances of 8h each in PENDING_CERTIFICATION state"
            - "MedicalCertification submitted but review_outcome stays INSUFFICIENT"
          trigger:
            - "POST /leave-cases/LCG/review body { decision: 'DENY' }"
          assert:
            - "LCG.case_status == 'DENIED' (link 1)"
            - "Both LeaveInstance rows have instance_status == 'VOIDED' (link 2 — caused by the case becoming DENIED)"
            - "PfLClaim P1.claim_status == 'DENIED' (link 2 — caused by the case becoming DENIED)"
            - "LCG.hours_charged == 0  (link 2 — recomputed because all instances voided)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_conflict
        grounds:
          - validations[priority=7]   # ERR_INVALID_STATE
          - validations[priority=15]  # ERR_QUOTA_EXCEEDED
        distinguishing_aspect: |
          Error-category pair: state vs business_fiscal. Posting an instance
          on a CANCELLED case for an employee whose quota is also already
          exhausted produces TWO failing conditions; the scaffold pins
          ERR_INVALID_STATE (priority 7) to win over ERR_QUOTA_EXCEEDED
          (priority 15).
        test_recipe:
          setup:
            - "Eligible Employee EE; LeaveCase LCE was DRAFT then DELETEd -> CANCELLED"
            - "Same employee has separately APPROVED instances totalling 480 hours in the same leave year (quota exhausted)"
          trigger:
            - "POST /leave-cases/LCE/instances body { instance_date: '2026-05-01', hours_used: 8 }"
          assert:
            - "Response status == 409"
            - "error_id == 'ERR_INVALID_STATE' (priority 7 — state)"
            - "error_id != 'ERR_QUOTA_EXCEEDED' (priority 15 — business_fiscal would also fail, but is dominated)"

      - name: business_safety_vs_business_referential_conflict
        grounds:
          - validations[priority=12]  # ERR_NOT_ELIGIBLE_WORKSITE (business_safety)
          - validations[priority=19]  # ERR_PFL_MISMATCH (business_referential)
        distinguishing_aspect: |
          Different error-category pair from the previous conflict:
          business_safety vs business_referential. An employee whose worksite
          headcount is below 50 AND who submits a leave case with a PfLClaim
          belonging to a DIFFERENT employee triggers both. Scaffold pins
          business_safety (priority 12) over business_referential (priority 19).
        test_recipe:
          setup:
            - "Employer Q: state_pfl_program=STATE_PFL_8WEEK"
            - "Worksite WQ: employee_count_within_75_miles=40 (below 50)"
            - "Employee EA on WQ; Employee EB on a different worksite"
            - "PfLClaim P_EB belonging to EB (employee_id=EB)"
          trigger:
            - "POST /employees/EA/leave-cases body { reason: 'FAMILY_SERIOUS_HEALTH', leave_pattern: 'CONTINUOUS', requested_start_date: '2026-06-01', expected_end_date: '2026-06-30', pfl_claim_id: P_EB }"
          assert:
            - "Response status == 422"
            - "error_id == 'ERR_NOT_ELIGIBLE_WORKSITE' (priority 12 — business_safety)"
            - "error_id != 'ERR_PFL_MISMATCH' (priority 19 — would also fail but dominated)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quota_boundary_480_inclusive
        grounds:
          - calculations.quota_balance_calc.constants.FMLA_ENTITLEMENT_HOURS
          - validations[priority=15]
          - entities.LeaveInstance.fields.hours_used
        distinguishing_aspect: |
          Numeric-threshold boundary on the quota metric on the
          POST /leave-cases/{id}/instances endpoint. Exactly 480 hours
          consumed is INSIDE the quota; the 481st hour is OUTSIDE.
          The check is consumed_hours + new_hours <= 480 (inclusive on 480).
        test_recipe:
          setup:
            - "Employer with leave_year_basis=CALENDAR; eligible Employee EQ"
            - "Existing APPROVED LeaveCase with 59 APPROVED instances of 8 hours each (472 hours consumed) in 2026"
            - "New PENDING_CERTIFICATION LeaveCase LCN with no instances yet"
          trigger:
            - "Step 1: POST /leave-cases/LCN/instances body { instance_date: '2026-07-01', hours_used: 8 }  -> consumed_hours would be 480, INSIDE"
            - "Step 2: POST /leave-cases/LCN/instances body { instance_date: '2026-07-02', hours_used: 1 }  -> consumed_hours would be 481, OUTSIDE"
          assert:
            - "Step 1 returns 201 (instance created, consumed_hours == 480 is inclusive — within the bucket)"
            - "Step 2 returns 422 error_id == 'ERR_QUOTA_EXCEEDED' (481 > 480)"

      - name: eligibility_zero_count_empty_set_boundary
        grounds:
          - validations[priority=12]
          - entities.Worksite.fields.employee_count_within_75_miles
        distinguishing_aspect: |
          Different metric (worksite headcount, NOT hours) and different
          endpoint (POST /employees/{id}/leave-cases). The empty-set / zero
          edge: employee_count_within_75_miles == 0 (an empty roster) and
          == 49 (just below threshold) both fail; == 50 passes. This is a
          collection-count edge, not a numeric-formula edge.
        test_recipe:
          setup:
            - "Employer E; Worksite W0 with employee_count_within_75_miles=0; Worksite W49 with 49; Worksite W50 with 50"
            - "Three eligible-on-other-axes Employees E0, E49, E50 each on the matching worksite"
          trigger:
            - "POST /employees/E0/leave-cases  (valid body)"
            - "POST /employees/E49/leave-cases (valid body)"
            - "POST /employees/E50/leave-cases (valid body)"
          assert:
            - "E0 response: 422 ERR_NOT_ELIGIBLE_WORKSITE (empty-set edge: zero headcount)"
            - "E49 response: 422 ERR_NOT_ELIGIBLE_WORKSITE (just-below boundary)"
            - "E50 response: 201 LeaveCase created (50 is inclusive — at-threshold passes)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: leavecase_approve_requires_medicalcertification_complete
        grounds:
          - state_machines.LeaveCase.PENDING_CERTIFICATION_to_APPROVED
          - state_machines.MedicalCertification.PENDING_to_ACCEPTED
          - validations[priority=14]
          - entities.LeaveCase.fields.certification_status
          - entities.MedicalCertification.fields.review_outcome
        distinguishing_aspect: |
          Entity pair: LeaveCase x MedicalCertification. LeaveCase's
          PENDING_CERTIFICATION -> APPROVED transition requires
          MedicalCertification.review_outcome == ACCEPTED (which sets
          LeaveCase.certification_status to COMPLETE). Without that the
          transition is blocked with ERR_CERT_INCOMPLETE.
        test_recipe:
          setup:
            - "Eligible Employee with LeaveCase LC in PENDING_CERTIFICATION; MedicalCertification posted but not yet reviewed (review_outcome=PENDING, LC.certification_status=RECEIVED)"
          trigger:
            - "POST /leave-cases/LC/review body { decision: 'APPROVE' }"
          assert:
            - "Response 422 ERR_CERT_INCOMPLETE (LC cannot APPROVE because MedicalCertification is not ACCEPTED)"
            - "After POST /leave-cases/LC/certifications/{cert_id}/review body { decision: 'ACCEPT' }: LC.certification_status == 'COMPLETE'"
            - "Then POST /leave-cases/LC/review body { decision: 'APPROVE' } returns 200 with LC.case_status == 'APPROVED'"

      - name: restore_job_requires_benefitinvoice_no_forfeit
        grounds:
          - state_machines.LeaveCase.COMPLETED_to_JOB_RESTORED
          - state_machines.BenefitInvoice.GRACE_to_FORFEITED
          - validations[priority=20]
          - entities.LeaveCase.fields.job_restoration_status
          - entities.BenefitInvoice.fields.invoice_status
        distinguishing_aspect: |
          Different entity pair from the first instance: LeaveCase x
          BenefitInvoice. LeaveCase.COMPLETED -> JOB_RESTORED is blocked when
          any BenefitInvoice on the case is in FORFEITED, via the cascade
          that flips LeaveCase.job_restoration_status. This is a separate
          cross-entity reasoning chain than the LeaveCase/MedicalCertification
          coupling.
        test_recipe:
          setup:
            - "Eligible Employee with LeaveCase LCR; HR APPROVED; advance clock so case becomes ACTIVE; first BenefitInvoice issued"
            - "Advance clock 46 days so invoice flips ISSUED -> GRACE -> FORFEITED"
            - "Advance clock past expected_end_date so case auto-COMPLETES"
          trigger:
            - "POST /leave-cases/LCR/restore-job"
          assert:
            - "Response 409 ERR_JOB_RESTORATION_FORFEITED"
            - "LCR.job_restoration_status == 'FORFEITED' (cascade from BenefitInvoice FORFEIT)"
            - "If a parallel test pays the invoice BEFORE the 45-day mark, job_restoration_status stays PROTECTED and the same POST returns 200"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: leaveinstance_same_day_duplicate_on_same_case
        grounds:
          - validations[priority=22]
          - concurrency_rules[duplicate_instance_day]
          - entities.LeaveInstance.fields.instance_date
        distinguishing_aspect: |
          Resource: LeaveInstance, scoped to (leave_case_id, instance_date)
          uniqueness — same case, same day. The interval semantics is
          POINT-EQUALITY on a single calendar day (the instance is the whole
          day, no fractional adjacency). Geometric treatment: equality on a
          singleton.
        test_recipe:
          setup:
            - "Eligible Employee with LeaveCase LCO in APPROVED, leave_pattern=INTERMITTENT"
          trigger:
            - "POST /leave-cases/LCO/instances body { instance_date: '2026-08-10', hours_used: 8 } -> 201"
            - "POST /leave-cases/LCO/instances body { instance_date: '2026-08-10', hours_used: 4 } -> rejected"
          assert:
            - "Second call returns 409 ERR_DUPLICATE_INSTANCE_DAY"
            - "Only one LeaveInstance exists for (LCO, 2026-08-10)"

      - name: leaveinstance_same_day_across_employees_cases_aggregate
        grounds:
          - validations[priority=17]
          - entities.LeaveInstance.fields.instance_date
          - entities.LeaveCase.fields.employee_id
        distinguishing_aspect: |
          Different interval semantics from the previous instance: this rule
          is AGGREGATE-CAPACITY across all of an employee's LeaveCases for
          the same calendar day, not point-equality on a single case. Two
          DIFFERENT LeaveCases for the same employee both attempting to claim
          the same day collide via the cross-case uniqueness ban — the
          interval geometry merges the same-day intervals at the employee
          level, not the case level.
        test_recipe:
          setup:
            - "Eligible Employee EX with two simultaneously APPROVED LeaveCases LC_A (OWN_SERIOUS_HEALTH, intermittent) and LC_B (FAMILY_SERIOUS_HEALTH, intermittent)"
          trigger:
            - "POST /leave-cases/LC_A/instances body { instance_date: '2026-09-05', hours_used: 8 } -> 201"
            - "POST /leave-cases/LC_B/instances body { instance_date: '2026-09-05', hours_used: 4 } -> rejected"
          assert:
            - "Second call returns 422 ERR_INSTANCE_OVERLAP  (priority 17 fires before priority 22 because LC_B has no same-case row on that date — uniqueness is per-case, overlap is per-employee)"
            - "LC_A has its LeaveInstance for 2026-09-05; LC_B has none for that date"
            - "Interval semantics differs: instance #1 is single-case point uniqueness, instance #2 is per-employee aggregate capacity across cases"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_then_relog_preserves_quota_balance
        grounds:
          - state_machines.LeaveCase.PENDING_CERTIFICATION_to_APPROVED
          - calculations.quota_balance_calc
          - entities.LeaveCase.fields.hours_charged
          - entities.LeaveInstance.fields.instance_status
        distinguishing_aspect: |
          Conserved quantity: Employee.quota_balance.remaining_hours (FMLA
          hours bucket). Forward action POST /leave-cases/{id}/instances
          consumes hours; compensating action DELETE
          /leave-cases/{id}/instances/{instance_id} re-credits the same hours.
          Invariant pinned as: remaining_hours_before_pair ==
          remaining_hours_after_pair, where the pair is forward+compensate.
        test_recipe:
          setup:
            - "Eligible Employee EY with quota fully available (480 hours remaining at as_of_date)"
            - "APPROVED LeaveCase LCY with leave_pattern=INTERMITTENT"
            - "GET /employees/EY/quota-balance -> remaining_hours == 480 (snapshot B0)"
          trigger:
            - "POST /leave-cases/LCY/instances body { instance_date: '2026-10-12', hours_used: 8 } -> 201 (forward)"
            - "GET /employees/EY/quota-balance -> remaining_hours == 472 (snapshot B1)"
            - "DELETE /leave-cases/LCY/instances/{id_from_step_1} -> 204 (compensate)"
            - "GET /employees/EY/quota-balance -> remaining_hours == 480 (snapshot B2)"
          assert:
            - "B0 == 480 AND B1 == 472 AND B2 == 480"
            - "B0 == B2  (named conserved quantity Employee.quota_balance.remaining_hours unchanged across the forward+compensate pair)"

      - name: pfl_link_then_deny_preserves_pfl_weeks_paid
        grounds:
          - state_machines.LeaveCase.PENDING_CERTIFICATION_to_DENIED
          - entities.PfLClaim.fields.claim_status
          - entities.PfLClaim.fields.weeks_paid
        distinguishing_aspect: |
          Different conserved quantity from the quota invariant: PfLClaim.weeks_paid
          (state PFL benefit weeks paid out). Forward action is the case
          submission that links a PfLClaim (which would, on APPROVE, flip
          claim to PAYING and eventually increment weeks_paid); compensating
          action is review with DENY (which drops the claim back to DENIED
          without incrementing weeks_paid). Invariant: weeks_paid_before ==
          weeks_paid_after across submit+deny when the case never reached
          APPROVED. Different conserved-quantity TYPE from FMLA hours.
        test_recipe:
          setup:
            - "Employer with state_pfl_program=STATE_PFL_8WEEK; eligible Employee EZ"
            - "POST /pfl-claims for EZ with claim_type=BABY_BONDING, weeks_authorized=8 -> P1.weeks_paid == 0 (snapshot W0)"
            - "POST /employees/EZ/leave-cases body { reason: 'BABY_BONDING', leave_pattern: 'CONTINUOUS', requested_start_date: '...', expected_end_date: '...', pfl_claim_id: P1 } -> LCZ in PENDING_CERTIFICATION"
            - "POST /leave-cases/LCZ/certifications and HR ACCEPTS (LC.certification_status=COMPLETE)"
          trigger:
            - "POST /leave-cases/LCZ/review body { decision: 'DENY' }"
            - "GET /pfl-claims/P1 -> snapshot W1"
          assert:
            - "W0.weeks_paid == 0 AND W1.weeks_paid == 0"
            - "W0.weeks_paid == W1.weeks_paid  (named conserved quantity PfLClaim.weeks_paid unchanged across forward+compensate)"
            - "PfLClaim.claim_status flipped SUBMITTED -> DENIED but weeks_paid never advanced"
