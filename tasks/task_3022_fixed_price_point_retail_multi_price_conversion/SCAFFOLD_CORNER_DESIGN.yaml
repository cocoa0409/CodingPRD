  - section: rbac
    instances:

      - name: merchandise_buyer_cannot_operate_a_store_conversion
        claim_type: peer_roles
        grounds:
          - roles.MerchandiseBuyer
          - roles.StoreOperationsManager
          - endpoints.POST_/merchandise/stores/{id}/conversions
          - errors.ERR_INSUFFICIENT_ROLE
        distinguishing_aspect: "The buying office owns cost engineering and the store team owns physical conversion, and neither can borrow the other's endpoint: a MerchandiseBuyer beginning a conversion is a 403 while the StoreOperationsManager succeeds on the identical payload."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE 125-cent point and one single-price store."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
              captures: { err_role: $.data.error_id }
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp125_id}" }
              as: StoreOperationsManager
              captures: { store_status: $.data.status }
          assert:
            - "the MerchandiseBuyer attempt returns 403 and err_role == ERR_INSUFFICIENT_ROLE"
            - "the StoreOperationsManager attempt returns 200 and store_status == CONVERTING"
            - "Store.${store_id}.conversion_price_point_id == ${pp125_id} — the refused call wrote nothing"
            - "Store.${store_id}.sign_order_filed == false and shelf_tag_filed == false and register_file_locked == false — the begin reset all three artefacts"

