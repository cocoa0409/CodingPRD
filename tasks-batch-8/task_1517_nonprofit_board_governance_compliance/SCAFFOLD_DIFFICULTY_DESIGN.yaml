          policy_end_date: '2028-01-02T00:00:00Z'
          prior_policy_id: ${p1}
        as: ComplianceOfficer
        captures:
          p_gap: $.data.id
      - call: POST /boardgov/insurance-policies
        payload:
          nonprofit_id: ${np}
          policy_type: DNO
          carrier: Carrier1
          coverage_limit_cents: 2000000000
          premium_cents: 520000
          policy_start_date: '2026-12-01T00:00:00Z'
          policy_end_date: '2027-12-01T00:00:00Z'
          prior_policy_id: ${p1}
        as: ComplianceOfficer
        captures:
          p_ovl: $.data.id
      - call: POST /boardgov/insurance-policies
        payload:
          nonprofit_id: ${np}
          policy_type: DNO
          carrier: Carrier1
          coverage_limit_cents: 2000000000
          premium_cents: 520000
          policy_start_date: '2027-01-01T00:00:00Z'
          policy_end_date: '2028-01-01T00:00:00Z'
          prior_policy_id: ${p1}
        as: ComplianceOfficer
        captures:
          p_ok: $.data.id
          p_ok_gap: $.data.gap_days
      trigger:
      - call: POST /boardgov/insurance-policies/${p_gap}/bind
        payload: {}
        as: ComplianceOfficer
        captures:
          err_gap: $.data.error_id
      - call: POST /boardgov/insurance-policies/${p_ovl}/bind
        payload: {}
        as: ComplianceOfficer
        captures:
          err_ovl: $.data.error_id
      - call: POST /boardgov/insurance-policies/${p_ok}/bind
        payload: {}
        as: ComplianceOfficer
        captures:
          ok_status: $.data.status
      assert:
      - err_gap == ERR_COVERAGE_GAP (1-day gap 2027-01-01 -> 2027-01-02 and acknowledge_gap not set)
      - err_ovl == ERR_POLICY_OVERLAP (2026-12-01 < prior end 2027-01-01)
      - p_ok_gap == 0 and ok_status == BOUND (exact abutment = continuous coverage)
