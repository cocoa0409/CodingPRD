      - name: cascade_b_retraction_blocks_items_reverts_the_arm_and_credits_the_spots
        claim_type: Side Effect Execution
        grounds: "§1.2 Asset QC_PASSED -> RETRACTED (CASCADE B hops 1-3); §1.2 Playlist ARMED -> IMPORTED (system trigger); §1.3 spot_inventory_conservation; §1.4 ERR_UNCLEARED_CONTENT_ON_AIR"
        distinguishing_aspect: "One retraction of a shared commercial asset must bubble UP into two other entities: the items it feeds become BLOCKED, the owning playlist falls out of ARMED back to IMPORTED with armed_at_utc cleared, and the spot ledger moves two spots from scheduled to credited with the FULL per-spot rate (200000 cents). Re-arming is then refused until the block clears."
        test_recipe:
          setup: "Reference graph with ${pl1_id} ARMED. Items 2 and 3 both reference HN-SPOT-01 and ORD-2026-0001 (per_spot_rate 100000)."
