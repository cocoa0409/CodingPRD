          - entities.SubpoenaRequest.fields.legal_reviewed_by_user_id
        distinguishing_aspect: "The second duty-separation rule, on a different entity pair: counsel-1 who performed the legal review is refused with 403 ERR_SEGREGATION_OF_DUTIES when signing the response, and counsel-2 signs the identical response successfully."
        test_recipe:
