        distinguishing_aspect: "At exactly 2026-08-01T00:00:00Z the half-open windows put pool P1 [07-01, 08-01) out of the candidate set and pool P2 [08-01, 09-01) in, so the 10000-cent gift draws its 2000-cent match from P2 only."
