          trigger:
            - { call: "GET /talent/successors/${es}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { rs: $.data.readiness_score } }
          assert:
            - "SuccessorEntry.${es}.readiness_score == 40.00 at creation (no plan)"

      - name: bench_posture_coverage_boundaries
        claim_type: boundary_edge
        grounds: [calculations.bench_posture, calculations.bench_strength]
        distinguishing_aspect: "COVERAGE integer bands: 2/5 = 40 lands exactly on the ADEQUATE floor (>= 40, not THIN); 4/5 = 80 lands in STRONG (>= 70). Both thresholds exercised on one role by growing the slate."
        test_recipe:
          setup: ["COVERAGE role ACTIVE; two ACTIVE READY_NOW entries already in place (bench 40)"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB81", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
