  - rule_id: boundary_precision_check
    instances:
      - name: storage_pressure_exactly_ninety_locks_unit
        grounds:
          - calculations.unit_storage_pressure
          - calculations.study_storage_gb
          - entities.MonitoringUnit.fields.storage_pressure_pct
          - entities.MonitoringUnit.fields.posture
          - validations[priority=21]
        distinguishing_aspect: "Boundary on the storage-pressure metric with an inclusive comparator: the first closed segment leaves storage_pressure_pct at 89.95 and posture OPEN, and a 2-minute second segment adds exactly 0.05 GB so pressure lands on 90.00 == STORAGE_LOCK_PCT, which must lock the unit because the comparator is >= and not >."
        test_recipe:
          setup:
            - "Unit storage_quota_gb 100.00 so 90.00 GB of data is exactly 90.00% pressure."
            - "Admission admitted 2026-08-02T00:00:00Z; shift ACTIVE 2026-08-02T00:00:00Z..2026-08-10T00:00:00Z with max_concurrent_studies 2."
            - "Study of 25 channels INPATIENT_VEEG (0.025 GB per minute) started 2026-08-02T00:00:00Z."
            - "Segment 1 closes at 2026-08-04T11:58:00Z (3598 minutes -> 89.95 GB): storage_pressure_pct 89.95, strictly below the lock, posture OPEN, which is why the following resume is allowed."
            - "Segment 2 opens at 2026-08-04T12:00:00Z and the trigger closes it 2 minutes later (+0.05 GB)."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU A", bed_count: 2, storage_quota_gb: 100.00 }
