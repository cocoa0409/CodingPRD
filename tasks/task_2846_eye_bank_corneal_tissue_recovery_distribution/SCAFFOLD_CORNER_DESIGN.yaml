          assert:
            - "${odc_before} == 1 and ${tech_v_before} == 2"
            - "${d_st} == \"DEFERRED\" and ${d_reason} == \"Awaiting hospital chart review\""
            - "${r_st} == \"ABORTED\" and ${r_abort} == \"DONOR_DEFERRED\""
            - "${odc_after} == 0 and ${tech_v_after} == 3"

      - name: a_newer_serology_panel_invalidates_the_earlier_panel_and_resets_the_donor
        claim_type: side_effect_execution
