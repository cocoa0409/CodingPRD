      - name: state_beats_fiscal_on_reactivate
        grounds:
          - validations[priority=5]
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_CREDIT]
        distinguishing_aspect: "Pair state(p5 ERR_INVALID_STATE) vs business_fiscal(p20 ERR_INSUFFICIENT_CREDIT): reactivating an ACTIVE (non-SUSPENDED) account that ALSO lacks one period of credit returns the higher-priority ERR_INVALID_STATE, not the fiscal error."
