              payload: { name: "Van O" }
              as: PlatformAdmin
              captures: { un_o: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Nia Ford", certified_modalities: ["RADIOGRAPHY"] }
              as: PlatformAdmin
              captures: { tc_o: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_o}", technician_id: "${tc_o}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_o: $.data.id, rto_v1: $.data.version }
            - call: "POST /routes/${rt_o}/stops"
              payload: { clinic_id: "${cl_o}", planned_arrival_minute: 540, service_minutes: 30, drive_minutes_from_prev: 15, stop_priority: "ROUTINE", expected_route_version: "${rto_v1}" }
              as: Scheduler
              captures: { st_o: $.data.id }
            - call: "POST /mobile-units/${un_o}/service-status"
              payload: { service_status: "OUT_OF_SERVICE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /routes/${rt_o}/publish"
              payload: {}
              as: Scheduler
              captures: { err_id: $.data.error_id }
            - call: "POST /mobile-units/${un_o}/service-status"
              payload: { service_status: "IN_SERVICE" }
              as: PlatformAdmin
            - call: "POST /routes/${rt_o}/publish"
              payload: {}
              as: Scheduler
              captures: { st_after: $.data.status }
          assert:
            - "${err_id} == ERR_UNIT_OUT_OF_SERVICE"
            - "HTTP status == 409"
            - "${st_after} == PUBLISHED"
            - "Route.${rt_o}.published_at != null"
            - "RouteStop.${st_o}.status == PLANNED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: route_stop_buffer_expanded_minute_interval_conflict
        grounds:
          - calculations.stop_window_conflict_detection
          - validations[priority=41]
          - errors[ERR_STOP_WINDOW_CONFLICT]
          - entities.RouteStop.fields.planned_arrival_minute
        distinguishing_aspect: |
          Interval semantics #1, on the Route resource: half-open minute
          intervals [arrival, arrival + service) expanded by a 10-minute buffer
          on both sides. A stop starting 9 minutes after the previous stop's
          service ends is rejected; one starting exactly 10 minutes after is
          accepted. The arithmetic is minute-level and buffer-aware.
        test_recipe:
          setup:
            - "one DRAFT route on 2026-05-04 with shift window 480..900"
            - "one stop already occupying minutes 540..585 at clinic P1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Clinic P1", address_zone: "Z16" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /clinics"
              payload: { name: "Clinic P2", address_zone: "Z16" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /mobile-units"
              payload: { name: "Van P" }
              as: PlatformAdmin
              captures: { un_p: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dov Klein", certified_modalities: ["RADIOGRAPHY"] }
              as: PlatformAdmin
              captures: { tc_p: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_p}", technician_id: "${tc_p}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_p: $.data.id, rtp_v1: $.data.version }
            - call: "POST /routes/${rt_p}/stops"
              payload: { clinic_id: "${p1}", planned_arrival_minute: 540, service_minutes: 45, drive_minutes_from_prev: 20, stop_priority: "ROUTINE", expected_route_version: "${rtp_v1}" }
              as: Scheduler
              captures: { sp1: $.data.id }
            - call: "GET /routes/${rt_p}"
              payload: {}
              as: Scheduler
              captures: { rtp_v2: $.data.version }
          trigger:
            - call: "POST /routes/${rt_p}/stops"
              payload: { clinic_id: "${p2}", planned_arrival_minute: 594, service_minutes: 20, drive_minutes_from_prev: 5, stop_priority: "ROUTINE", expected_route_version: "${rtp_v2}" }
              as: Scheduler
              captures: { err_id: $.data.error_id }
            - call: "GET /routes/${rt_p}"
              payload: {}
              as: Scheduler
              captures: { rtp_v3: $.data.version }
            - call: "POST /routes/${rt_p}/stops"
              payload: { clinic_id: "${p2}", planned_arrival_minute: 595, service_minutes: 20, drive_minutes_from_prev: 5, stop_priority: "ROUTINE", expected_route_version: "${rtp_v3}" }
              as: Scheduler
              captures: { sp2: $.data.id, sp2_seq: $.data.sequence }
          assert:
            - "${err_id} == ERR_STOP_WINDOW_CONFLICT"
            - "HTTP status == 409"
            - "${sp2_seq} == 2"
            - "RouteStop.${sp2}.planned_arrival_minute == 595"
            - "Route.${rt_p}.stop_count == 2"
            - "Route.${rt_p}.planned_occupied_minutes == 90"
            - "a 9-minute gap (594) conflicts while a 10-minute gap (595) does not, because conflict requires P.start < X.end + 10"

      - name: clinic_hosts_at_most_one_stop_per_service_date_across_all_routes
        grounds:
          - calculations.clinic_same_date_stop_conflict
          - validations[priority=42]
          - errors[ERR_CLINIC_STOP_ALREADY_SCHEDULED]
          - entities.Route.fields.service_date
        distinguishing_aspect: |
          Interval semantics #2, on the Clinic resource: whole-calendar-day
          aggregate capacity of one, with no buffer and no minute arithmetic at
          all, and enforced ACROSS routes and mobile units rather than within a
          single route. The same clinic is refused a second stop on 2026-05-04
          even on a different van at a non-overlapping hour, yet is accepted
          immediately for 2026-05-05.
        test_recipe:
          setup:
            - "one clinic already hosting a stop on route A for 2026-05-04"
            - "a second, different mobile unit with its own DRAFT route for 2026-05-04"
            - "a third DRAFT route on 2026-05-05"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Single Visit Vet", address_zone: "Z17" }
              as: PlatformAdmin
              captures: { cl_s: $.data.id }
            - call: "POST /mobile-units"
              payload: { name: "Van S1" }
              as: PlatformAdmin
              captures: { un_s1: $.data.id }
            - call: "POST /mobile-units"
