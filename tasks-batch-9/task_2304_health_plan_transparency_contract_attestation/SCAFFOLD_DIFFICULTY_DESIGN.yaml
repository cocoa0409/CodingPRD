            - "Reconciliation happened at clock 2028-05-20T09:00:00Z; the clock has since advanced to 2028-06-15T09:00:00Z, i.e. 14 inclusive days from the 2028-06-02 onset."
            - "Ledger empty and deficiency_points 0 at the moment of the trigger."
