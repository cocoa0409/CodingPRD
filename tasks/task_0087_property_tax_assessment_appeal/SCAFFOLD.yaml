# =============================================================================
# PRD Benchmark Scaffold — Property Tax Assessment & Appeal
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: "Property Tax Assessment & Appeal: assessed value, exemptions (Homestead/Senior/Veteran/Disability), Mill Rate, annual growth cap (Prop 13 style), Board of Equalization hearing, repayment deferral"

domain_name: property-tax-assessment-appeal
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation       # capped roll-forward vs fresh market reassessment diverge on identical inputs
  secondary_archetype: multi_party_negotiation    # Board of Equalization appeal: taxpayer vs assessor, hearing rounds, settle/deny
  complexity_layers:
    - dual_variant_calculation       # assessed_value: capped-growth roll-forward vs market reassessment
    - cascading_side_effects         # appeal decision -> assessment revalue -> tax bill -> deferral balance
    - rate_threshold_triggers        # growth cap boundary, exemption eligibility age/percent thresholds
    - optimistic_concurrency         # OCC on Assessment.version and DeferralAgreement.version (CREATE-with-supersede)

  entity_topology: flat              # peer entities linked by FK; URLs are /parcels, /assessments, /appeals, /deferrals (no deep nesting)
  state_machine_shape: cyclic        # Appeal negotiation loops (UNDER_REVIEW <-> EVIDENCE_REQUESTED); plus branching fork-join on decision
  relationship_patterns:
    - one_to_many                    # Parcel -> Assessment[], Assessment -> Exemption[], Appeal -> Hearing[]
    - cross_aggregate                # Appeal references Assessment across the assessment aggregate; DeferralPayment touches DeferralAgreement balance
  role_model: segregation_of_duties  # the Assessor who issued an assessment cannot adjudicate its own appeal; Reviewer != HearingOfficer
  consistency_model: immediate       # every cascade resolves atomically within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration / annual epoch -----------------------------------------
  - name: TaxRoll
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: tax_year, type: integer, source: input, description: "Assessment year, e.g. 2026", constraints: "unique across TaxRoll; 2000..2100" }
      - { name: mill_rate, type: number, source: input, description: "Mills per 1000 of taxable value applied to all bills on this roll", constraints: ">= 0; up to 4 decimal places" }
      - { name: growth_cap_pct, type: number, source: input, description: "Prop-13-style maximum YoY growth of capped_base_value, e.g. 0.02 for 2%", constraints: ">= 0 and <= 1" }
      - { name: prior_roll_id, type: string, source: input, description: "FK -> TaxRoll.id; the immediately preceding certified roll this roll rolls forward from; null for the genesis roll" }
      - { name: senior_age_threshold, type: integer, source: input, description: "Minimum owner age (years) qualifying for the SENIOR exemption on this roll", default: 65 }
      - { name: status, type: enum, source: system, description: "DRAFT -> OPEN -> CERTIFIED -> CLOSED", constraints: "DRAFT|OPEN|CERTIFIED|CLOSED" }

  # --- Owner (taxpayer principal) -------------------------------------------
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the property owner" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Owner" }
      - { name: birth_date, type: datetime, source: input, description: "Owner date of birth (date portion used for SENIOR age test)" }
      - { name: is_veteran, type: boolean, source: input, description: "Verified veteran status flag", default: false }
      - { name: disability_pct, type: integer, source: input, description: "Service/medical disability rating percent used for DISABILITY exemption", default: 0, constraints: "0..100" }

  # --- Parcel (the property; persists across tax years) ----------------------
  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; current owner of record" }
      - { name: apn, type: string, source: input, description: "Assessor parcel number; unique among Parcel" }
      - { name: situs_address, type: string, source: input, description: "Street address of the parcel" }
      - { name: is_primary_residence, type: boolean, source: input, description: "Whether owner occupies as primary residence (HOMESTEAD eligibility)", default: false }
      - { name: last_certified_capped_base, type: number, source: computed, description: "capped_base_value from this parcel's most recent CERTIFIED assessment; baseline for next year's cap; 0 before any certification" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SOLD (reassessment trigger) -> ACTIVE", constraints: "ACTIVE|SOLD" }

  # --- Assessment (per-parcel, per-roll valuation record) --------------------
  - name: Assessment
    parent: Parcel
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the parcel being assessed" }
      - { name: tax_roll_id, type: string, source: input, description: "FK -> TaxRoll.id; the roll/year this assessment belongs to" }
      - { name: market_value, type: number, source: input, description: "Appraiser-supplied full market value for this year", constraints: ">= 0" }
      - { name: reassessment_event, type: enum, source: input, description: "Why the cap is lifted this year: NONE keeps the cap, SALE|NEW_CONSTRUCTION rebase to market", default: NONE, constraints: "NONE|SALE|NEW_CONSTRUCTION" }
      - { name: capped_base_value, type: number, source: computed, description: "Prop-13 capped base: min(market_value, prior_capped_base*(1+growth_cap_pct)) when reassessment_event==NONE, else market_value" }
      - { name: assessed_value, type: number, source: computed, description: "= capped_base_value (the value before exemptions)" }
      - { name: exemption_total, type: number, source: computed, description: "Sum of approved-exemption deduction amounts applied to this assessment (capped at assessed_value)" }
      - { name: taxable_value, type: number, source: computed, description: "= max(0, assessed_value - exemption_total)" }
      - { name: appealed_value, type: number, source: computed, description: "Board-determined taxable value once an appeal is SETTLED/GRANTED; null until then" }
      - { name: final_taxable_value, type: number, source: computed, description: "appealed_value when an appeal resolved it, else taxable_value; the value the bill uses" }
      - { name: status, type: enum, source: system, description: "DRAFT -> NOTICED -> (UNDER_APPEAL ->) FINAL; FINAL is terminal", constraints: "DRAFT|NOTICED|UNDER_APPEAL|FINAL" }

  # --- Exemption (deduction claimed against an Assessment) -------------------
  - name: Exemption
    parent: Assessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: input, description: "FK -> Assessment.id; the assessment this exemption reduces" }
      - { name: exemption_type, type: enum, source: input, description: "HOMESTEAD|SENIOR|VETERAN|DISABILITY", constraints: "HOMESTEAD|SENIOR|VETERAN|DISABILITY" }
      - { name: claimed_amount, type: number, source: computed, description: "Deduction amount derived per type from constants and owner attributes (see exemption_deduction calc)" }
      - { name: status, type: enum, source: system, description: "CLAIMED -> APPROVED|DENIED; APPROVED|DENIED terminal", constraints: "CLAIMED|APPROVED|DENIED" }

  # --- Appeal (Board of Equalization petition against an Assessment) ----------
  - name: Appeal
    parent: Assessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: input, description: "FK -> Assessment.id; the assessment under appeal" }
      - { name: filed_by_owner_id, type: string, source: input, description: "FK -> Owner.id; the petitioning owner" }
      - { name: requested_taxable_value, type: number, source: input, description: "Taxable value the owner asks the Board to set", constraints: ">= 0" }
      - { name: opinion_of_value, type: number, source: computed, description: "Working settlement target during negotiation; defaults to requested_taxable_value, updated by counter-offers" }
      - { name: round_no, type: integer, source: computed, description: "Negotiation round counter; starts at 1, increments on each EVIDENCE_REQUESTED->UNDER_REVIEW return", default: 1 }
      - { name: determined_taxable_value, type: number, source: computed, description: "Board's final taxable value on GRANTED/SETTLED; null otherwise" }
      - { name: status, type: enum, source: system, description: "FILED -> UNDER_REVIEW <-> EVIDENCE_REQUESTED -> (SETTLED|GRANTED|DENIED|WITHDRAWN)", constraints: "FILED|UNDER_REVIEW|EVIDENCE_REQUESTED|SETTLED|GRANTED|DENIED|WITHDRAWN" }

  # --- BoardPanel (scheduling resource for hearings) -------------------------
  - name: BoardPanel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Board of Equalization panel label, e.g. 'Panel A'" }
      - { name: setup_buffer_minutes, type: integer, source: input, description: "Mandatory clearance gap required AFTER each hearing on this panel before the next may start", default: 15, constraints: ">= 0" }

  # --- Hearing (scheduled Board session for an Appeal) -----------------------
  - name: Hearing
    parent: Appeal
    common_fields: true
    fields:
      - { name: appeal_id, type: string, source: input, description: "FK -> Appeal.id; the appeal being heard" }
      - { name: board_panel_id, type: string, source: input, description: "FK -> BoardPanel.id; the panel occupying the slot" }
      - { name: hearing_officer_role_user_id, type: string, source: input, description: "X-User-ID of the HearingOfficer assigned (opaque operator id)" }
      - { name: starts_at, type: datetime, source: input, description: "Slot start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Slot end (exclusive)", constraints: "ends_at > starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> HELD|CANCELLED; HELD|CANCELLED terminal", constraints: "SCHEDULED|HELD|CANCELLED" }

  # --- DeferralAgreement (tax repayment deferral with lien ledger) -----------
  - name: DeferralAgreement
    parent: Parcel
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the parcel under deferral" }
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the owner granted deferral (must be SENIOR- or DISABILITY-eligible)" }
      - { name: annual_interest_rate, type: number, source: input, description: "Simple annual interest accrued on the deferred principal, e.g. 0.05", constraints: ">= 0 and <= 1" }
      - { name: deferred_principal_cents, type: number, source: computed, description: "Cumulative principal deferred (sum of enrolled bill amounts), in cents" }
      - { name: accrued_interest_cents, type: number, source: computed, description: "Cumulative interest assessed at each interest-accrual run, in cents" }
      - { name: outstanding_balance_cents, type: number, source: computed, description: "= deferred_principal_cents + accrued_interest_cents - total_paid_cents" }
      - { name: total_paid_cents, type: number, source: computed, description: "Sum of applied DeferralPayment amounts, in cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SATISFIED (balance 0) | DEFAULTED; SATISFIED|DEFAULTED terminal", constraints: "ACTIVE|SATISFIED|DEFAULTED" }

  # --- DeferralPayment (append-only payment applied via waterfall) -----------
  - name: DeferralPayment
    parent: DeferralAgreement
    common_fields: false   # id, created_at only — immutable event
    fields:
      - { name: deferral_agreement_id, type: string, source: input, description: "FK -> DeferralAgreement.id; the agreement this payment is applied to" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: ">= 1" }
      - { name: applied_to_interest_cents, type: integer, source: computed, description: "Portion of this payment waterfalled to accrued interest first" }
      - { name: applied_to_principal_cents, type: integer, source: computed, description: "Portion of this payment waterfalled to principal after interest is covered" }

  # --- TaxBill (the billed amount derived from a FINAL assessment) -----------
  - name: TaxBill
    parent: Assessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: input, description: "FK -> Assessment.id; the FINAL assessment billed" }
      - { name: billed_taxable_value, type: number, source: computed, description: "Snapshot of Assessment.final_taxable_value at issuance" }
      - { name: tax_amount_cents, type: number, source: computed, description: "Billed tax = round(billed_taxable_value * mill_rate / 1000) in cents" }
      - { name: is_deferred, type: boolean, source: computed, description: "True when this bill was rolled into an ACTIVE DeferralAgreement instead of being due", default: false }
      - { name: status, type: enum, source: system, description: "ISSUED -> PAID | DEFERRED; PAID|DEFERRED terminal", constraints: "ISSUED|PAID|DEFERRED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- TaxRoll: linear epoch with a certify gate -----------------------------
  - entity: TaxRoll
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /tax-rolls/{id}/open"
        actor: Assessor
        preconditions:
          - "If prior_roll_id is non-null, that TaxRoll.status == CERTIFIED (ERR_PRIOR_ROLL_NOT_CERTIFIED)"
        side_effects: []
      - from: OPEN
        to: CERTIFIED
        trigger: "POST /tax-rolls/{id}/certify"
        actor: Assessor
        preconditions:
          - "Every Assessment on this roll has status == FINAL (ERR_ASSESSMENTS_NOT_FINAL)"
        side_effects:
          - "For each Assessment on this roll, copy assessment.capped_base_value into its Parcel.last_certified_capped_base (ledger sync to Parcel; bumps Parcel.updated_at)"
      - from: CERTIFIED
        to: CLOSED
        trigger: "POST /tax-rolls/{id}/close"
        actor: Assessor
        preconditions:
          - "A successor TaxRoll with prior_roll_id == this.id exists and is CERTIFIED (ERR_NO_CERTIFIED_SUCCESSOR)"
        side_effects: []

  # --- Parcel: ACTIVE <-> SOLD (sale flips reassessment baseline) ------------
  - entity: Parcel
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SOLD
        trigger: "POST /parcels/{id}/record-sale"
        actor: Assessor
        preconditions:
          - "new_owner_id resolves to an existing Owner (ERR_OWNER_NOT_FOUND)"
        side_effects:
          - "Set parcel.owner_id = new_owner_id"
          - "Set parcel.last_certified_capped_base = 0 so the next NONE assessment cannot inherit a stale cap; the next Assessment created for this parcel MUST use reassessment_event SALE (cross-entity precondition on Assessment create)"
      - from: SOLD
        to: ACTIVE
        trigger: "POST /assessments (the first assessment created after a sale closes the SOLD flag)"
        actor: system
        preconditions:
          - "An Assessment with reassessment_event == SALE is created for this parcel"
        side_effects:
          - "parcel.status returns to ACTIVE"

  # --- Assessment: DRAFT -> NOTICED -> (UNDER_APPEAL ->) FINAL ----------------
  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: NOTICED
        trigger: "POST /assessments/{id}/notice"
        actor: Assessor
        preconditions:
          - "Parent TaxRoll.status == OPEN (ERR_ROLL_NOT_OPEN)"
          - "Every Exemption on this assessment is APPROVED or DENIED, none CLAIMED (ERR_EXEMPTIONS_PENDING)"
        side_effects:
          - "Recompute capped_base_value, assessed_value, exemption_total, taxable_value (calc: capped_base_value, exemption_total)"
          - "Set final_taxable_value = taxable_value"
      - from: NOTICED
        to: FINAL
        trigger: "POST /assessments/{id}/finalize"
        actor: Assessor
        preconditions:
          - "No Appeal on this assessment in FILED, UNDER_REVIEW, or EVIDENCE_REQUESTED (ERR_OPEN_APPEAL_EXISTS)"
        side_effects:
          - "final_taxable_value frozen at its current value (taxable_value, or appealed_value if an appeal resolved it)"
      - from: NOTICED
        to: UNDER_APPEAL
        trigger: "POST /appeals (filing an appeal against a NOTICED assessment)"
        actor: system
        preconditions:
          - "A new Appeal is created referencing this assessment"
        side_effects:
          - "Block finalize until the appeal leaves its open states"
      - from: UNDER_APPEAL
        to: NOTICED
        trigger: "Appeal reaches DENIED or WITHDRAWN (no value change)"
        actor: system
        preconditions:
          - "The only open Appeal on this assessment transitions to DENIED or WITHDRAWN"
        side_effects:
          - "appealed_value stays null; final_taxable_value stays = taxable_value"
      - from: UNDER_APPEAL
        to: NOTICED
        trigger: "Appeal reaches SETTLED or GRANTED (value lowered)"
        actor: system
        preconditions:
          - "The open Appeal on this assessment transitions to SETTLED or GRANTED"
        side_effects:
          - "CASCADE STEP 1: set assessment.appealed_value = appeal.determined_taxable_value"
          - "CASCADE STEP 1: set assessment.final_taxable_value = appeal.determined_taxable_value (overrides taxable_value)"
        note: "Cascade origin for transitive_cascade 'appeal_grant_reprices_bill_and_deferral' continues into TaxBill on finalize/billing."

  # --- Exemption: CLAIMED -> APPROVED|DENIED ---------------------------------
  - entity: Exemption
    initial_state: CLAIMED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: CLAIMED
        to: APPROVED
        trigger: "POST /exemptions/{id}/approve"
        actor: Reviewer
        preconditions:
          - "Parent Assessment.status == DRAFT (ERR_INVALID_STATE)"
          - "Eligibility holds for the type (HOMESTEAD: Parcel.is_primary_residence == true; SENIOR: owner age >= TaxRoll.senior_age_threshold; VETERAN: Owner.is_veteran == true; DISABILITY: Owner.disability_pct >= 1) else ERR_EXEMPTION_INELIGIBLE"
          - "No other APPROVED Exemption of the same exemption_type on this assessment (ERR_DUPLICATE_EXEMPTION)"
        side_effects:
          - "Recompute claimed_amount via exemption_deduction calc"
          - "Add claimed_amount into Assessment.exemption_total (ledger sync up to parent; recompute taxable_value)"
      - from: CLAIMED
        to: DENIED
        trigger: "POST /exemptions/{id}/deny"
        actor: Reviewer
        preconditions:
          - "Parent Assessment.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "claimed_amount set to 0; no change to Assessment.exemption_total"

  # --- Appeal: cyclic negotiation + branching decision -----------------------
  - entity: Appeal
    initial_state: FILED
    terminal_states: [SETTLED, GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/accept"
        actor: HearingOfficer
        preconditions:
          - "Parent Assessment.status == UNDER_APPEAL (cross-entity: assessment must be in appeal state) (ERR_INVALID_STATE)"
          - "Acting HearingOfficer X-User-ID != the X-User-ID that noticed the parent assessment (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: UNDER_REVIEW
        to: EVIDENCE_REQUESTED
        trigger: "POST /appeals/{id}/request-evidence"
        actor: HearingOfficer
        preconditions:
          - "appeal.round_no < 3 (ERR_MAX_ROUNDS_REACHED)"
        side_effects:
          - "Set opinion_of_value = counter_value from the request body (Board counter-offer)"
      - from: EVIDENCE_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/submit-evidence"
        actor: Taxpayer
        preconditions:
          - "Acting Taxpayer X-User-ID == appeal.filed_by_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Increment appeal.round_no by 1 (cyclic loop counter)"
      - from: UNDER_REVIEW
        to: SETTLED
        trigger: "POST /appeals/{id}/settle"
        actor: HearingOfficer
        preconditions:
          - "settled_value is between requested_taxable_value (inclusive) and the assessment's current taxable_value (inclusive) (ERR_SETTLEMENT_OUT_OF_RANGE)"
        side_effects:
          - "Set determined_taxable_value = settled_value"
          - "CASCADE: drive parent Assessment UNDER_APPEAL -> NOTICED (SETTLED/GRANTED branch) which sets appealed_value + final_taxable_value"
        note: "Branch with value change; differs from DENIED branch (no value change)."
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /appeals/{id}/grant"
        actor: HearingOfficer
        preconditions:
          - "A Hearing on this appeal has status == HELD (cross-entity: appeal cannot be granted without a held hearing) (ERR_NO_HELD_HEARING)"
        side_effects:
          - "Set determined_taxable_value = requested_taxable_value (Board grants the petition in full)"
          - "CASCADE: drive parent Assessment UNDER_APPEAL -> NOTICED (SETTLED/GRANTED branch) which sets appealed_value + final_taxable_value"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /appeals/{id}/deny"
        actor: HearingOfficer
        preconditions:
          - "A Hearing on this appeal has status == HELD (ERR_NO_HELD_HEARING)"
        side_effects:
          - "determined_taxable_value stays null"
          - "CASCADE: drive parent Assessment UNDER_APPEAL -> NOTICED (DENIED/WITHDRAWN branch); appealed_value stays null"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: Taxpayer
        preconditions:
          - "Acting Taxpayer X-User-ID == appeal.filed_by_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "CASCADE: drive parent Assessment UNDER_APPEAL -> NOTICED (DENIED/WITHDRAWN branch); appealed_value stays null"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: Taxpayer
        preconditions:
          - "Acting Taxpayer X-User-ID == appeal.filed_by_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "CASCADE: drive parent Assessment UNDER_APPEAL -> NOTICED (DENIED/WITHDRAWN branch); appealed_value stays null"

  # --- Hearing: SCHEDULED -> HELD|CANCELLED ----------------------------------
  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{id}/hold"
        actor: HearingOfficer
        preconditions:
          - "Parent Appeal.status == UNDER_REVIEW (cross-entity) (ERR_INVALID_STATE)"
          - "Acting HearingOfficer X-User-ID == hearing.hearing_officer_role_user_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hearings/{id}/cancel"
        actor: HearingOfficer
        preconditions: []
        side_effects:
          - "Frees the panel slot so an overlapping reschedule can succeed"

  # --- DeferralAgreement: ACTIVE -> SATISFIED|DEFAULTED ----------------------
  - entity: DeferralAgreement
    initial_state: ACTIVE
    terminal_states: [SATISFIED, DEFAULTED]
    transitions:
      - from: ACTIVE
        to: SATISFIED
        trigger: "POST /deferrals/{id}/payments (auto when outstanding_balance_cents reaches 0)"
        actor: system
        preconditions:
          - "After applying the payment, outstanding_balance_cents == 0 exactly (ERR not applicable — auto)"
        side_effects:
          - "status -> SATISFIED; lien released"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /deferrals/{id}/default"
        actor: Assessor
        preconditions:
          - "Parcel.status == SOLD (a deferred parcel that sold must settle; cross-entity) (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DEFAULTED; outstanding_balance_cents becomes immediately due"

  # --- TaxBill: ISSUED -> PAID | DEFERRED ------------------------------------
  - entity: TaxBill
    initial_state: ISSUED
    terminal_states: [PAID, DEFERRED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /tax-bills/{id}/pay"
        actor: Taxpayer
        preconditions:
          - "Bill not already PAID or DEFERRED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> PAID"
      - from: ISSUED
        to: DEFERRED
        trigger: "POST /deferrals/{id}/enroll-bill (the bill is rolled into a deferral)"
        actor: Assessor
        preconditions:
          - "Bill is ISSUED and not already enrolled (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DEFERRED; is_deferred = true"
          - "CASCADE: target DeferralAgreement.deferred_principal_cents += tax_amount_cents; recompute outstanding_balance_cents"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC only — passes the serial-observability filter)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: appeal-file-stale-assessment
    parent_entity: Assessment
    write_endpoint: "POST /appeals"
    occ_field: "expected_assessment_version"
    description: |
      Filing an Appeal against an Assessment whose version has advanced since
      the client last observed it is rejected. A NOTICED assessment admits at
      most one open appeal; once an appeal is filed, the assessment is driven
      to UNDER_APPEAL and its version advances. A second create still carrying
      the previously observed version is therefore working from a stale view of
      the assessment and is rejected on the OCC check before the duplicate-appeal
      state precondition would even be reached.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: deferral-payment-stale-agreement
    parent_entity: DeferralAgreement
    write_endpoint: "POST /deferrals/{id}/payments"
    occ_field: "expected_deferral_version"
    description: |
      Applying a DeferralPayment against a DeferralAgreement whose version has
      advanced since the client last read it is rejected. Each applied payment
      waterfalls against the live balance and advances the agreement's version;
      a payment carrying a stale version was computed against an outdated
      balance and is rejected so the waterfall always runs against the current
      ledger state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (1) DUAL-VARIANT #1: assessed value — capped roll-forward vs market ---
  - name: capped_base_value
    trigger: "On POST /assessments (create) and on assessment notice/recompute"
    algorithm: threshold
    formula: |
      roll = TaxRoll of this assessment
      prior_base = Parcel.last_certified_capped_base   # 0 if none / after a sale rebase
      cap_ceiling = prior_base * (1 + roll.growth_cap_pct)
      if reassessment_event == NONE:
          capped_base_value = min(market_value, cap_ceiling) if prior_base > 0 else market_value
      else:  # SALE or NEW_CONSTRUCTION rebase to full market
          capped_base_value = market_value
      assessed_value = capped_base_value
    input_set: "Single Parcel's prior CERTIFIED capped base + this year's market_value; reassessment_event selects variant"
    constants: {}
    precision: "whole dollars, round_half_up to integer"
    variants:
      - name: capped_rollforward
        when: "reassessment_event == NONE and prior_base > 0"
        difference: "Caps growth at prior_base*(1+growth_cap_pct); a hot market is clipped — assessed_value can be far below market_value"
      - name: market_rebase
        when: "reassessment_event in {SALE, NEW_CONSTRUCTION}, or first-ever assessment (prior_base == 0)"
        difference: "Ignores the cap; assessed_value = full market_value, resetting the Prop-13 base for future years"

  # --- (2) DUAL-VARIANT #2: deferral payoff — simple vs proportional ----------
  - name: deferral_payment_waterfall
    trigger: "On POST /deferrals/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      # interest bucket fills before principal bucket
      interest_due = accrued_interest_cents - applied_to_interest_already   # remaining unpaid interest
      applied_to_interest_cents = min(amount_cents, interest_due)
      remainder = amount_cents - applied_to_interest_cents
      applied_to_principal_cents = min(remainder, deferred_principal_cents - principal_paid_already)
      # overpayment beyond full balance is rejected (ERR_PAYMENT_EXCEEDS_BALANCE), not refunded
      total_paid_cents += applied_to_interest_cents + applied_to_principal_cents
      outstanding_balance_cents = deferred_principal_cents + accrued_interest_cents - total_paid_cents
    input_set: "One DeferralAgreement's current accrued_interest_cents, deferred_principal_cents, total_paid_cents"
    constants: {}
    precision: "integer cents; no rounding (already cents)"
    variants:
      - name: interest_first_waterfall
        when: "always — the sanctioned order"
        difference: "Interest bucket is exhausted before any cent touches principal; a partial payment never reduces principal while interest remains"

  # --- (3) COMBINATORIAL (mode a): exemption deduction — multi-input branching
  - name: exemption_deduction
    trigger: "On POST /exemptions/{id}/approve"
    algorithm: weighted_scoring
    formula: |
      av = Assessment.assessed_value            # >= 3 inputs: type, av, owner attrs, constants
      switch exemption_type:
        HOMESTEAD:   raw = HOMESTEAD_FLAT
        SENIOR:      raw = max(SENIOR_FLAT, round_half_up(av * SENIOR_PCT))   # nested max over a percentage of AV
        VETERAN:     raw = VETERAN_FLAT
        DISABILITY:  raw = round_half_up(av * (Owner.disability_pct / 100) * DISABILITY_FACTOR)
      claimed_amount = min(raw, av)             # a single exemption can never exceed assessed_value
    input_set: "Exemption.exemption_type, parent Assessment.assessed_value, Owner attributes"
    constants:
      HOMESTEAD_FLAT: 7000
      SENIOR_FLAT: 5000
      SENIOR_PCT: 0.10
      VETERAN_FLAT: 4000
      DISABILITY_FACTOR: 0.50
    precision: "whole dollars, round_half_up"

  # --- (4) COMBINATORIAL (mode c): taxable value ordered evaluation -----------
  - name: exemption_total
    trigger: "On Exemption approve/deny and on assessment notice"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED: each exemption_deduction is computed against the
      # SAME assessed_value (the AV before any exemption), then summed, THEN clipped.
      # (Naive 'subtract each exemption then recompute next against the reduced base'
      #  would diverge — this scaffold forbids that order.)
      raw_sum = sum(e.claimed_amount for e in Exemptions where e.status == APPROVED)
      exemption_total = min(raw_sum, assessed_value)
      taxable_value = max(0, assessed_value - exemption_total)
    input_set: "All APPROVED Exemptions on the assessment; assessed_value as the common base"
    constants: {}
    precision: "whole dollars, round_half_up"

  # --- (5) COMBINATORIAL (mode b): tax bill — round order pinned --------------
  - name: tax_bill_amount
    trigger: "On POST /assessments/{id}/issue-bill (assessment must be FINAL)"
    algorithm: tiered_pricing
    formula: |
      btv = Assessment.final_taxable_value        # dollars (already whole)
      mr  = TaxRoll.mill_rate                      # mills per 1000
      # ROUND ORDER PINNED: multiply full-precision FIRST, convert to cents, round ONCE at the end.
      # tax_dollars(full precision) = btv * mr / 1000
      # tax_amount_cents = round_half_up(btv * mr / 1000 * 100)
      tax_amount_cents = round_half_up(btv * mr / 10)     # == btv*mr/1000*100
      billed_taxable_value = btv
    input_set: "One FINAL Assessment's final_taxable_value + its TaxRoll.mill_rate"
    constants: {}
    precision: "integer cents, round_half_up, rounded exactly once after the full-precision product"

  # --- (6) DUAL-VARIANT #2: interest accrual — declining vs originated base ---
  - name: deferral_interest_accrual
    trigger: "On POST /deferrals/{id}/accrue-interest (operator-run annual accrual)"
    algorithm: decay_function
    formula: |
      # PINNED VARIANT = declining_balance: interest accrues only on principal
      # not yet repaid, so once a payment touches principal the next period's
      # interest is smaller. The originated_principal variant (interest always
      # on the full original deferred_principal_cents regardless of payments)
      # would yield a strictly larger figure once any principal is repaid — the
      # scaffold forbids it.
      principal_outstanding_cents = deferred_principal_cents - applied_to_principal_total
      period_interest_cents = round_half_up(principal_outstanding_cents * annual_interest_rate)
      accrued_interest_cents += period_interest_cents
      outstanding_balance_cents = deferred_principal_cents + accrued_interest_cents - total_paid_cents
    input_set: "One DeferralAgreement; principal not yet paid; annual_interest_rate"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: declining_balance
        when: "always — the sanctioned base; interest accrues on (deferred_principal_cents - principal already repaid)"
        difference: "Once a payment reduces principal, the next accrual period charges less interest"
      - name: originated_principal
        when: "FORBIDDEN comparison variant used only to expose divergence"
        difference: "Would accrue on the full original principal forever; after any principal repayment it over-charges versus declining_balance"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth, check: "X-User-Role and X-User-ID headers present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /owners and pagination GET list endpoints" }
  - { priority: 2,  category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all role-gated endpoints" }
  - { priority: 3,  category: auth, check: "Segregation of duties: HearingOfficer accepting an appeal must not be the operator who noticed the parent assessment", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /appeals/{id}/accept" }
  - { priority: 4,  category: existence, check: "Path/body referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all id-bearing endpoints" }
  - { priority: 5,  category: existence, check: "Acting Taxpayer X-User-ID equals the resource's owner FK (filed_by_owner_id / parcel.owner_id)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "POST /appeals/{id}/submit-evidence, /withdraw; POST /deferrals/{id}/payments by Taxpayer" }
  - { priority: 6,  category: business_fiscal, check: "OCC: expected_<parent>_version must equal the live parent version — checked BEFORE state preconditions so a stale supersede-write loses with 412 rather than masking as a state error", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /appeals, POST /deferrals/{id}/payments" }
  - { priority: 7,  category: state, check: "Target resource is in a state from which the requested transition is allowed", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 8,  category: state, check: "Parent TaxRoll.status == OPEN before an assessment can be noticed", error_id: ERR_ROLL_NOT_OPEN, http_status: 409, applies_to: "POST /assessments/{id}/notice" }
  - { priority: 9,  category: state, check: "Open Appeal (FILED/UNDER_REVIEW/EVIDENCE_REQUESTED) blocks finalize", error_id: ERR_OPEN_APPEAL_EXISTS, http_status: 409, applies_to: "POST /assessments/{id}/finalize" }
  - { priority: 10, category: state, check: "Cannot grant/deny an appeal without a HELD hearing on it", error_id: ERR_NO_HELD_HEARING, http_status: 409, applies_to: "POST /appeals/{id}/grant, /deny" }
  - { priority: 11, category: state, check: "All assessments on a roll must be FINAL before certify", error_id: ERR_ASSESSMENTS_NOT_FINAL, http_status: 409, applies_to: "POST /tax-rolls/{id}/certify" }
  - { priority: 12, category: business_referential, check: "After a Parcel sale (status SOLD), the next Assessment for it must carry reassessment_event == SALE", error_id: ERR_SALE_REASSESSMENT_REQUIRED, http_status: 422, applies_to: "POST /assessments" }
  - { priority: 13, category: business_referential, check: "TaxRoll.prior_roll_id must reference a CERTIFIED roll before this roll opens", error_id: ERR_PRIOR_ROLL_NOT_CERTIFIED, http_status: 409, applies_to: "POST /tax-rolls/{id}/open" }
  - { priority: 14, category: business_constraint, check: "Exemption eligibility holds for its type (homestead residence / senior age / veteran flag / disability pct)", error_id: ERR_EXEMPTION_INELIGIBLE, http_status: 422, applies_to: "POST /exemptions/{id}/approve" }
  - { priority: 15, category: business_constraint, check: "No second APPROVED exemption of the same type on one assessment", error_id: ERR_DUPLICATE_EXEMPTION, http_status: 409, applies_to: "POST /exemptions/{id}/approve" }
  - { priority: 16, category: business_constraint, check: "Hearing slot does not overlap an existing SCHEDULED/HELD hearing on the same BoardPanel, honoring the panel setup_buffer_minutes after each hearing (half-open [start,end) plus buffer)", error_id: ERR_PANEL_SLOT_CONFLICT, http_status: 409, applies_to: "POST /hearings" }
  - { priority: 17, category: business_constraint, check: "Appeal max 3 negotiation rounds (round_no < 3 to request more evidence)", error_id: ERR_MAX_ROUNDS_REACHED, http_status: 409, applies_to: "POST /appeals/{id}/request-evidence" }
  - { priority: 18, category: business_constraint, check: "Settlement value within [requested_taxable_value, current taxable_value]", error_id: ERR_SETTLEMENT_OUT_OF_RANGE, http_status: 422, applies_to: "POST /appeals/{id}/settle" }
  - { priority: 19, category: business_fiscal, check: "A DeferralPayment may not exceed the agreement outstanding_balance_cents", error_id: ERR_PAYMENT_EXCEEDS_BALANCE, http_status: 422, applies_to: "POST /deferrals/{id}/payments" }
  - { priority: 20, category: business_constraint, check: "Request body schema valid: required fields present, enums/ranges within constraints", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Owners ----------------------------------------------------------------
  - { method: POST, path: "/owners", description: "Register a property owner (taxpayer principal)", roles: [Assessor, Anonymous], code: 201, input: [full_name, email, birth_date, "is_veteran?", "disability_pct?"], output: Owner, side_effects: [] }
  - { method: GET,  path: "/owners/{id}", description: "Fetch an owner", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: [], output: Owner, side_effects: [] }

  # --- Tax rolls -------------------------------------------------------------
  - { method: POST, path: "/tax-rolls", description: "Create a tax-year roll", roles: [Assessor], code: 201, input: [tax_year, mill_rate, growth_cap_pct, "prior_roll_id?", "senior_age_threshold?"], output: TaxRoll, side_effects: [] }
  - { method: GET,  path: "/tax-rolls", description: "List tax rolls (filterable by prior_roll_id)", roles: [Assessor, Reviewer, HearingOfficer], code: 200, input: ["prior_roll_id?", "limit?", "offset?"], output: "TaxRoll[]", side_effects: [] }
  - { method: GET,  path: "/tax-rolls/{id}", description: "Fetch a tax roll", roles: [Assessor, Reviewer, HearingOfficer], code: 200, input: [], output: TaxRoll, side_effects: [] }
  - { method: POST, path: "/tax-rolls/{id}/open", description: "Open a DRAFT roll for assessment", roles: [Assessor], code: 200, input: [], output: TaxRoll, side_effects: ["TaxRoll DRAFT->OPEN"] }
  - { method: POST, path: "/tax-rolls/{id}/certify", description: "Certify an OPEN roll once all assessments FINAL", roles: [Assessor], code: 200, input: [], output: TaxRoll, side_effects: ["TaxRoll OPEN->CERTIFIED", "copy each assessment.capped_base_value into Parcel.last_certified_capped_base"] }
  - { method: POST, path: "/tax-rolls/{id}/close", description: "Close a CERTIFIED roll once a certified successor exists", roles: [Assessor], code: 200, input: [], output: TaxRoll, side_effects: ["TaxRoll CERTIFIED->CLOSED"] }

  # --- Parcels ---------------------------------------------------------------
  - { method: POST, path: "/parcels", description: "Create a parcel", roles: [Assessor], code: 201, input: [owner_id, apn, situs_address, "is_primary_residence?"], output: Parcel, side_effects: [] }
  - { method: GET,  path: "/parcels", description: "List parcels (filterable by owner_id)", roles: [Assessor, Reviewer, HearingOfficer], code: 200, input: ["owner_id?", "limit?", "offset?"], output: "Parcel[]", side_effects: [] }
  - { method: GET,  path: "/parcels/{id}", description: "Fetch a parcel", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: [], output: Parcel, side_effects: [] }
  - { method: POST, path: "/parcels/{id}/record-sale", description: "Record a sale: reassign owner and rebase the cap", roles: [Assessor], code: 200, input: [new_owner_id], output: Parcel, side_effects: ["Parcel ACTIVE->SOLD", "owner_id reassigned", "last_certified_capped_base reset to 0"] }
  - { method: GET,  path: "/parcels/{id}/assessments", description: "List assessments for a parcel (FK reverse-reachability for Assessment.parcel_id)", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: [], output: "Assessment[]", side_effects: [] }
  - { method: GET,  path: "/parcels/{id}/deferrals", description: "List deferral agreements for a parcel (FK reverse-reachability for DeferralAgreement.parcel_id)", roles: [Assessor, Reviewer, Taxpayer], code: 200, input: [], output: "DeferralAgreement[]", side_effects: [] }

  # --- Assessments -----------------------------------------------------------
  - { method: POST, path: "/assessments", description: "Create a per-parcel per-roll assessment", roles: [Assessor], code: 201, input: [parcel_id, tax_roll_id, market_value, "reassessment_event?"], output: Assessment, side_effects: ["Compute capped_base_value/assessed_value (calc capped_base_value)", "If reassessment_event==SALE and parcel SOLD: Parcel SOLD->ACTIVE"] }
  - { method: GET,  path: "/assessments", description: "List assessments (filterable by tax_roll_id and parcel_id)", roles: [Assessor, Reviewer, HearingOfficer], code: 200, input: ["tax_roll_id?", "parcel_id?", "limit?", "offset?"], output: "Assessment[]", side_effects: [] }
  - { method: GET,  path: "/assessments/{id}", description: "Fetch an assessment with computed values", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: [], output: Assessment, side_effects: [] }
  - { method: POST, path: "/assessments/{id}/notice", description: "Notice a DRAFT assessment to the owner", roles: [Assessor], code: 200, input: [], output: Assessment, side_effects: ["Assessment DRAFT->NOTICED", "recompute taxable_value", "set final_taxable_value=taxable_value"] }
  - { method: POST, path: "/assessments/{id}/finalize", description: "Finalize a NOTICED assessment (no open appeal)", roles: [Assessor], code: 200, input: [], output: Assessment, side_effects: ["Assessment NOTICED->FINAL", "freeze final_taxable_value"] }
  - { method: POST, path: "/assessments/{id}/issue-bill", description: "Issue the tax bill for a FINAL assessment", roles: [Assessor], code: 201, input: [], output: TaxBill, side_effects: ["Compute tax_amount_cents (calc tax_bill_amount)", "TaxBill created ISSUED"] }
  - { method: GET,  path: "/assessments/{id}/exemptions", description: "List exemptions on an assessment (FK reverse-reachability for Exemption.assessment_id)", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: [], output: "Exemption[]", side_effects: [] }
  - { method: GET,  path: "/assessments/{id}/appeals", description: "List appeals on an assessment (FK reverse-reachability for Appeal.assessment_id)", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: [], output: "Appeal[]", side_effects: [] }
  - { method: GET,  path: "/assessments/{id}/bills", description: "List tax bills for an assessment (FK reverse-reachability for TaxBill.assessment_id)", roles: [Assessor, Reviewer, Taxpayer], code: 200, input: [], output: "TaxBill[]", side_effects: [] }

  # --- Tax bills -------------------------------------------------------------
  - { method: GET,  path: "/tax-bills/{id}", description: "Fetch a tax bill", roles: [Assessor, Reviewer, Taxpayer], code: 200, input: [], output: TaxBill, side_effects: [] }
  - { method: POST, path: "/tax-bills/{id}/pay", description: "Pay an ISSUED tax bill in full (taxpayer pays rather than defers)", roles: [Assessor, Taxpayer], code: 200, input: [], output: TaxBill, side_effects: ["TaxBill ISSUED->PAID"] }

  # --- Exemptions ------------------------------------------------------------
  - { method: POST, path: "/exemptions", description: "Claim an exemption against a DRAFT assessment", roles: [Assessor, Taxpayer], code: 201, input: [assessment_id, exemption_type], output: Exemption, side_effects: ["Exemption created CLAIMED"] }
  - { method: GET,  path: "/exemptions/{id}", description: "Fetch an exemption", roles: [Assessor, Reviewer, Taxpayer], code: 200, input: [], output: Exemption, side_effects: [] }
  - { method: POST, path: "/exemptions/{id}/approve", description: "Reviewer approves a claimed exemption", roles: [Reviewer], code: 200, input: [], output: Exemption, side_effects: ["Exemption CLAIMED->APPROVED", "compute claimed_amount (calc exemption_deduction)", "recompute Assessment.exemption_total/taxable_value (calc exemption_total)"] }
  - { method: POST, path: "/exemptions/{id}/deny", description: "Reviewer denies a claimed exemption", roles: [Reviewer], code: 200, input: [], output: Exemption, side_effects: ["Exemption CLAIMED->DENIED", "claimed_amount=0"] }

  # --- Appeals (Board of Equalization) ---------------------------------------
  - { method: POST, path: "/appeals", description: "File an appeal against a NOTICED assessment (OCC on assessment version)", roles: [Taxpayer], code: 201, input: [assessment_id, filed_by_owner_id, requested_taxable_value, expected_assessment_version], output: Appeal, side_effects: ["Appeal created FILED", "Assessment NOTICED->UNDER_APPEAL", "increments Assessment.version by 1"] }
  - { method: GET,  path: "/appeals", description: "List appeals (filterable by assessment_id and filed_by_owner_id)", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: ["assessment_id?", "filed_by_owner_id?", "limit?", "offset?"], output: "Appeal[]", side_effects: [] }
  - { method: GET,  path: "/appeals/{id}", description: "Fetch an appeal", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: [], output: Appeal, side_effects: [] }
  - { method: POST, path: "/appeals/{id}/accept", description: "HearingOfficer accepts an appeal into review (segregation of duties)", roles: [HearingOfficer], code: 200, input: [], output: Appeal, side_effects: ["Appeal FILED->UNDER_REVIEW"] }
  - { method: POST, path: "/appeals/{id}/request-evidence", description: "Board counter-offer; requests more evidence (cyclic)", roles: [HearingOfficer], code: 200, input: [counter_value], output: Appeal, side_effects: ["Appeal UNDER_REVIEW->EVIDENCE_REQUESTED", "set opinion_of_value=counter_value"] }
  - { method: POST, path: "/appeals/{id}/submit-evidence", description: "Taxpayer submits evidence, returns appeal to review (cyclic, increments round)", roles: [Taxpayer], code: 200, input: [], output: Appeal, side_effects: ["Appeal EVIDENCE_REQUESTED->UNDER_REVIEW", "round_no += 1"] }
  - { method: POST, path: "/appeals/{id}/settle", description: "Settle the appeal at an agreed value", roles: [HearingOfficer], code: 200, input: [settled_value], output: Appeal, side_effects: ["Appeal UNDER_REVIEW->SETTLED", "determined_taxable_value=settled_value", "CASCADE: Assessment appealed_value+final_taxable_value updated, UNDER_APPEAL->NOTICED"] }
  - { method: POST, path: "/appeals/{id}/grant", description: "Board grants the petition in full (requires held hearing)", roles: [HearingOfficer], code: 200, input: [], output: Appeal, side_effects: ["Appeal UNDER_REVIEW->GRANTED", "determined_taxable_value=requested_taxable_value", "CASCADE: Assessment appealed_value+final_taxable_value updated, UNDER_APPEAL->NOTICED"] }
  - { method: POST, path: "/appeals/{id}/deny", description: "Board denies the petition (requires held hearing)", roles: [HearingOfficer], code: 200, input: [], output: Appeal, side_effects: ["Appeal UNDER_REVIEW->DENIED", "CASCADE: Assessment UNDER_APPEAL->NOTICED, appealed_value stays null"] }
  - { method: POST, path: "/appeals/{id}/withdraw", description: "Taxpayer withdraws the appeal", roles: [Taxpayer], code: 200, input: [], output: Appeal, side_effects: ["Appeal ->WITHDRAWN", "CASCADE: Assessment UNDER_APPEAL->NOTICED, appealed_value stays null"] }
  - { method: GET,  path: "/appeals/{id}/hearings", description: "List hearings on an appeal (FK reverse-reachability for Hearing.appeal_id)", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: [], output: "Hearing[]", side_effects: [] }

  # --- Board panels & hearings -----------------------------------------------
  - { method: POST, path: "/board-panels", description: "Create a Board of Equalization panel (scheduling resource)", roles: [Assessor], code: 201, input: [name, "setup_buffer_minutes?"], output: BoardPanel, side_effects: [] }
  - { method: GET,  path: "/board-panels/{id}", description: "Fetch a board panel", roles: [Assessor, Reviewer, HearingOfficer], code: 200, input: [], output: BoardPanel, side_effects: [] }
  - { method: GET,  path: "/board-panels/{id}/hearings", description: "List hearings on a panel (FK reverse-reachability for Hearing.board_panel_id)", roles: [Assessor, Reviewer, HearingOfficer], code: 200, input: [], output: "Hearing[]", side_effects: [] }
  - { method: POST, path: "/hearings", description: "Schedule a hearing slot on a panel (overlap+buffer checked)", roles: [HearingOfficer], code: 201, input: [appeal_id, board_panel_id, hearing_officer_role_user_id, starts_at, ends_at], output: Hearing, side_effects: ["Hearing created SCHEDULED"] }
  - { method: GET,  path: "/hearings/{id}", description: "Fetch a hearing", roles: [Assessor, Reviewer, HearingOfficer, Taxpayer], code: 200, input: [], output: Hearing, side_effects: [] }
  - { method: POST, path: "/hearings/{id}/hold", description: "Mark a hearing HELD (enables grant/deny)", roles: [HearingOfficer], code: 200, input: [], output: Hearing, side_effects: ["Hearing SCHEDULED->HELD"] }
  - { method: POST, path: "/hearings/{id}/cancel", description: "Cancel a scheduled hearing, freeing the slot", roles: [HearingOfficer], code: 200, input: [], output: Hearing, side_effects: ["Hearing SCHEDULED->CANCELLED"] }

  # --- Deferrals -------------------------------------------------------------
  - { method: POST, path: "/deferrals", description: "Open a tax repayment deferral for a senior/disability-eligible owner", roles: [Assessor], code: 201, input: [parcel_id, owner_id, annual_interest_rate], output: DeferralAgreement, side_effects: ["DeferralAgreement created ACTIVE"] }
  - { method: GET,  path: "/deferrals", description: "List deferral agreements (filterable by parcel_id and owner_id; FK reverse-reachability for DeferralAgreement.owner_id)", roles: [Assessor, Reviewer, Taxpayer], code: 200, input: ["parcel_id?", "owner_id?", "limit?", "offset?"], output: "DeferralAgreement[]", side_effects: [] }
  - { method: GET,  path: "/deferrals/{id}", description: "Fetch a deferral agreement with computed balances", roles: [Assessor, Reviewer, Taxpayer], code: 200, input: [], output: DeferralAgreement, side_effects: [] }
  - { method: POST, path: "/deferrals/{id}/enroll-bill", description: "Roll an ISSUED bill into the deferral (adds principal)", roles: [Assessor], code: 200, input: [tax_bill_id], output: DeferralAgreement, side_effects: ["TaxBill ISSUED->DEFERRED, is_deferred=true", "deferred_principal_cents += bill.tax_amount_cents", "recompute outstanding_balance_cents"] }
  - { method: POST, path: "/deferrals/{id}/accrue-interest", description: "Run one annual interest accrual period", roles: [Assessor], code: 200, input: [], output: DeferralAgreement, side_effects: ["compute period interest (calc deferral_interest_accrual)", "accrued_interest_cents += period_interest_cents"] }
  - { method: POST, path: "/deferrals/{id}/payments", description: "Apply a payment via interest-first waterfall (OCC on agreement version)", roles: [Assessor, Taxpayer], code: 201, input: [amount_cents, expected_deferral_version], output: DeferralPayment, side_effects: ["compute waterfall split (calc deferral_payment_waterfall)", "increments DeferralAgreement.version by 1", "recompute outstanding_balance_cents", "if balance==0: DeferralAgreement ACTIVE->SATISFIED"] }
  - { method: POST, path: "/deferrals/{id}/default", description: "Declare a deferral defaulted (parcel sold)", roles: [Assessor], code: 200, input: [], output: DeferralAgreement, side_effects: ["DeferralAgreement ACTIVE->DEFAULTED"] }
  - { method: GET,  path: "/deferrals/{id}/payments", description: "List payments on a deferral (FK reverse-reachability for DeferralPayment.deferral_agreement_id)", roles: [Assessor, Reviewer, Taxpayer], code: 200, input: [], output: "DeferralPayment[]", side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "HearingOfficer accepting an appeal is the same operator who noticed the parent assessment" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Taxpayer X-User-ID is not the owner FK on the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "new_owner_id on a sale does not resolve to an Owner" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_ROLL_NOT_OPEN, http: 409, condition: "Assessment notice attempted while parent TaxRoll is not OPEN" }
  - { id: ERR_PRIOR_ROLL_NOT_CERTIFIED, http: 409, condition: "Opening a roll whose prior_roll_id is not CERTIFIED" }
  - { id: ERR_NO_CERTIFIED_SUCCESSOR, http: 409, condition: "Closing a roll with no certified successor roll" }
  - { id: ERR_EXEMPTIONS_PENDING, http: 409, condition: "Noticing an assessment that still has a CLAIMED exemption" }
  - { id: ERR_OPEN_APPEAL_EXISTS, http: 409, condition: "Finalizing an assessment that has an open appeal" }
  - { id: ERR_NO_HELD_HEARING, http: 409, condition: "Granting/denying an appeal with no HELD hearing on it" }
  - { id: ERR_ASSESSMENTS_NOT_FINAL, http: 409, condition: "Certifying a roll while some assessments are not FINAL" }
  - { id: ERR_DUPLICATE_EXEMPTION, http: 409, condition: "Approving a second exemption of an already-APPROVED type on one assessment" }
  - { id: ERR_PANEL_SLOT_CONFLICT, http: 409, condition: "Hearing slot overlaps an existing slot+buffer on the same panel" }
  - { id: ERR_MAX_ROUNDS_REACHED, http: 409, condition: "Requesting evidence when appeal.round_no is already 3" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match live parent version" }
  - { id: ERR_SALE_REASSESSMENT_REQUIRED, http: 422, condition: "First assessment after a parcel sale omits reassessment_event==SALE" }
  - { id: ERR_EXEMPTION_INELIGIBLE, http: 422, condition: "Exemption approval where the owner/parcel does not meet the type's eligibility test" }
  - { id: ERR_SETTLEMENT_OUT_OF_RANGE, http: 422, condition: "Settle value outside [requested_taxable_value, current taxable_value]" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Deferral payment amount exceeds outstanding_balance_cents" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range numeric" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Assessor
    description: "County assessor staff: creates rolls/parcels/assessments, approves notices, issues bills, administers deferrals"
    identity: opaque
    exclusive_operations:
      - "POST /tax-rolls and lifecycle (open/certify/close)"
      - "POST /parcels, POST /parcels/{id}/record-sale"
      - "POST /assessments, /notice, /finalize, /issue-bill"
      - "POST /board-panels"
      - "POST /deferrals, /enroll-bill, /accrue-interest, /default"
    shared_operations:
      - "POST /owners (also Anonymous)"
      - "POST /exemptions (also Taxpayer)"
      - "POST /deferrals/{id}/payments (also Taxpayer)"
      - "GET reads"

  - name: Reviewer
    description: "Exemptions reviewer: adjudicates exemption claims; cannot file/decide appeals or touch valuations"
    identity: opaque
    exclusive_operations:
      - "POST /exemptions/{id}/approve"
      - "POST /exemptions/{id}/deny"
    shared_operations:
      - "GET reads"

  - name: HearingOfficer
    description: "Board of Equalization officer: schedules/holds hearings, accepts/decides appeals; barred from deciding appeals on assessments they noticed (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /hearings, /hold, /cancel"
      - "POST /appeals/{id}/accept, /request-evidence, /settle, /grant, /deny"
    shared_operations:
      - "GET reads"

  - name: Taxpayer
    description: "Property owner / petitioner: claims exemptions, files/withdraws appeals, submits evidence, pays deferrals on parcels they own"
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /appeals (file), /withdraw, /submit-evidence"
    shared_operations:
      - "POST /exemptions (also Assessor)"
      - "POST /deferrals/{id}/payments (also Assessor)"
      - "GET reads on owned resources"

  - name: Anonymous
    description: "Unauthenticated principal able only to self-register as an Owner"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /owners (also Assessor)"
