# =============================================================================
# PRD Benchmark Scaffold — Public-Private Partnership Availability Payment Project
# Generated per skills/prd-bench-scaffold-generator/SKILL.md §1.0–§1.7
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2542. Public-Private Partnership Availability Payment Project (infrastructure
  concessionaire): concession agreement with performance standards, availability
  definitions and payment deduction regimes, financial close with debt, equity and
  milestone drawdown schedules, design and construction risk transfer with liquidated
  damages for late service commencement, handback condition requirements and lifecycle
  reserve funding, operations performance monitoring with self-reporting, verification
  and deduction disputes, change in law, compensation events and relief event claims,
  refinancing gain sharing with the public authority, step-in rights and termination
  compensation calculations

domain_name: ppp-availability-payment
api_prefix: /ppp

# Every entity declaring `common_fields: true` in §1.1 carries these four fields in
# addition to those listed, and every one of them appears in that entity's `output:`:
#   id          string   system  server-minted opaque identifier (NEVER a business input)
#   created_at  datetime system  logical-clock stamp at insert; the documented fallback
#                                ordering key wherever an explicit sequence_no is absent
#   updated_at  datetime system  logical-clock stamp of the last mutation
#   version     integer  system  optimistic-concurrency counter, starts at 1 and increments
#                                by exactly 1 on every successful mutation of the row
# An entity declaring `common_fields: false` (LifecycleReserveTransaction) carries `id`
# and `created_at` only: it is append-only, has no update endpoint, and has no `version`.
common_fields:
  - name: id
    type: string
    source: system
    description: "server-minted opaque identifier; never accepted as input and never used in any business decision, ordering or tie-break"
  - name: created_at
    type: datetime
    source: system
    description: "logical-clock timestamp at insert; the documented fallback ordering key where no explicit sequence_no exists"
  - name: updated_at
    type: datetime
    source: system
    description: "logical-clock timestamp of the most recent mutation"
  - name: version
    type: integer
    source: system
    description: "optimistic-concurrency counter; starts at 1 and increments by exactly 1 on every successful mutation. Only Concession.version and ServicePeriod.version are read by an OCC rule (§1.2.1)."
    default: 1

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Eleven peer entities linked exclusively by foreign keys declared with the canonical
    `FK -> {Entity}.id` prefix. Every collection is addressed at exactly one level under
    the api_prefix (`/ppp/service-periods/{id}`, `/ppp/deduction-events/{id}`); no entity
    id is ever nested inside another entity id in a read path. Creation of a child uses
    the parent's action path (`POST /ppp/concessions/{id}/service-periods`) but the child
    is thereafter a first-class top-level resource. Discovery of children is via
    filtered-list endpoints carrying the FK field as an optional query input.

  state_machine_shape: cyclic
  state_machine_shape_note: |
    Three distinct non-linear shapes coexist:
      (1) ServicePeriod carries two independent state axes on the same row —
          `reporting_status` (PENDING -> SELF_REPORTED -> VERIFIED, with a
          SELF_REPORTED -> PENDING revert on report rejection) and `payment_status`
          (UNBILLED -> INVOICED -> PAID -> ADJUSTED). The axes advance under different
          endpoints, different roles, and never gate each other except where §1.2
          states an explicit cross-axis precondition.
      (2) DeductionDispute is cyclic: RAISED -> REFERRED_BACK -> RESUBMITTED ->
          REFERRED_BACK -> ... bounded by DISPUTE_MAX_ROUNDS, terminating in
          UPHELD or REJECTED.
      (3) EnforcementAction is a branching fork: NOTIFIED forks into a STEP_IN branch
          (STEP_IN_ACTIVE -> {CURED | LAPSED}) and a TERMINATION branch
          (COMPENSATION_CALCULATED -> SETTLED), with disjoint side-effect sets.
      (4) Concession is cyclic through enforcement: OPERATIONS -> STEP_IN -> OPERATIONS.

  relationship_patterns:
    - one_to_many
    - self_referential          # LifecycleReserveTransaction.reverses_txn_id -> LifecycleReserveTransaction.id
    - cross_aggregate           # DeductionEvent.performance_report_id crosses the report aggregate
    - polymorphic_trigger_reason  # EnforcementAction.trigger_reason selects the compensation variant

  role_model: segregation_of_duties
  role_model_note: |
    Five roles with non-overlapping write surfaces. The compliance spine is a hard
    segregation of duties on the opaque `X-User-ID` of AuthorityOfficer: the officer whose
    id is recorded in `DeductionEvent.issued_by_user_id` MUST NOT be the officer who
    adjudicates a DeductionDispute against that same DeductionEvent.

  consistency_model: immediate
  consistency_model_note: |
    Every cascade in §1.2 completes inside the triggering request. All derived fields
    (`ServicePeriod.net_payment_cents`, `Concession.availability_deduction_ytd_cents`,
    `Concession.lifecycle_reserve_balance_cents`, `Concession.persistent_breach_flag`)
    are readable at their final value in the same response or in an immediately
    following GET.

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Concessionaire
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered name of the special-purpose vehicle holding the concession
        constraints: non-empty, max 200 chars
      - name: sponsor_equity_commitment_cents
        type: integer
        source: input
        description: total equity the sponsors have committed across all concessions of this SPV
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: SPV lifecycle state driven by enforcement cascades
        default: ACTIVE
        constraints: "one of {ACTIVE, STEPPED_IN, WOUND_UP}; STEPPED_IN written by the EnforcementAction NOTIFIED->STEP_IN_ACTIVE cascade, ACTIVE restored by STEP_IN_ACTIVE->CURED, WOUND_UP written by COMPENSATION_CALCULATED->SETTLED"
      - name: concessions_count
        type: integer
        source: computed
        description: "count of Concession rows whose concessionaire_id equals this row's id (no status filter — every Concession counts)"
        default: 0

  - name: Concession
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: project_name
        type: string
        source: input
        description: name of the availability-payment infrastructure project
        constraints: non-empty, max 200 chars
      - name: concessionaire_id
        type: string
        source: input
        description: FK -> Concessionaire.id; the SPV that is the private party to this concession agreement
      - name: status
        type: enum
        source: system
        description: concession agreement phase
        default: DRAFTED
        constraints: "one of {DRAFTED, FINANCIAL_CLOSE, CONSTRUCTION, OPERATIONS, STEP_IN, TERMINATED}"
      - name: masp_cents
        type: integer
        source: input
        description: Maximum Annual Service Payment in cents, the contractual payment ceiling before indexation
        constraints: "> 0"
      - name: indexation_pct
        type: number
        source: input
        description: contractual indexation uplift applied to the monthly unitary charge, expressed as a decimal fraction
        default: 0
        constraints: ">= 0 and <= 1, at most 6 decimal places"
      - name: deduction_cap_pct
        type: number
        source: input
        description: per-service-period deduction cap expressed as a decimal fraction of that period's gross unitary charge
        constraints: "> 0 and <= 1, at most 4 decimal places"
      - name: total_project_cost_cents
        type: integer
        source: input
        description: certified total project cost used as the denominator of cumulative_drawn_pct and the base of the equity-first ceiling
        constraints: "> 0"
      - name: senior_debt_committed_cents
        type: integer
        source: input
        description: senior debt facility committed at financial close
        constraints: ">= 0"
      - name: equity_committed_cents
        type: integer
        source: input
        description: equity committed at financial close
        constraints: ">= 0"
      - name: base_case_equity_irr_bps
        type: integer
        source: input
        description: base-case equity internal rate of return in basis points, used by termination_compensation
        constraints: ">= 0 and <= 5000"
      - name: scheduled_service_commencement
        type: datetime
        source: input
        description: contractual planned service commencement date (ISO 8601 UTC), the baseline for liquidated damages
      - name: ld_daily_rate_cents
        type: integer
        source: input
        description: liquidated damages accruing per net late day of service commencement
        constraints: ">= 0"
      - name: ld_cap_cents
        type: integer
        source: input
        description: aggregate ceiling on liquidated damages for late service commencement
        constraints: ">= 0"
      - name: lifecycle_reserve_target_cents
        type: integer
        source: input
        description: contractual lifecycle reserve target balance to be maintained during operations
        constraints: ">= 0"
      - name: financial_close_date
        type: datetime
        source: system
        description: date recorded when DRAFTED -> FINANCIAL_CLOSE succeeds; null before that
        default: null
      - name: monthly_unitary_charge_cents
        type: integer
        source: computed
        description: "output of calculations.monthly_unitary_charge; null while status == DRAFTED, set on DRAFTED -> FINANCIAL_CLOSE"
        default: null
      - name: senior_debt_drawn_cents
        type: integer
        source: computed
        description: "sum of DrawdownMilestone.debt_portion_cents over milestones of this concession with status == DISBURSED"
        default: 0
      - name: equity_drawn_cents
        type: integer
        source: computed
        description: "sum of DrawdownMilestone.equity_portion_cents over milestones of this concession with status == DISBURSED"
        default: 0
      - name: cumulative_drawn_pct
        type: number
        source: computed
        description: "(senior_debt_drawn_cents + equity_drawn_cents) / total_project_cost_cents, carried at full precision and reported rounded half-up to 6 decimal places"
        default: 0
      - name: actual_service_commencement
        type: datetime
        source: system
        description: date certified by the IndependentCertifier on CONSTRUCTION -> OPERATIONS; null before that
        default: null
      - name: ld_accrued_cents
        type: integer
        source: computed
        description: output of calculations.liquidated_damages_late_commencement, written on CONSTRUCTION -> OPERATIONS
        default: 0
      - name: lifecycle_reserve_balance_cents
        type: integer
        source: computed
        description: "sum of LifecycleReserveTransaction.signed_amount_cents over every transaction of this concession (append-only ledger, no status filter — reversals are themselves rows)"
        default: 0
      - name: availability_deduction_ytd_cents
        type: integer
        source: computed
        description: "sum of ServicePeriod.total_deduction_cents over service periods of this concession with reporting_status == VERIFIED"
        default: 0
      - name: deduction_points_ytd
        type: integer
        source: computed
        description: "sum of DeductionEvent.points over deduction events attached to service periods of this concession whose status IN {ISSUED, DISPUTED}"
        default: 0
      - name: persistent_breach_flag
        type: boolean
        source: computed
        description: "true exactly when deduction_points_ytd >= PERSISTENT_BREACH_POINTS_THRESHOLD (see calculations.persistent_breach_evaluation)"
        default: false
      - name: handback_survey_date
        type: datetime
        source: system
        description: survey date recorded by POST /ppp/concessions/{id}/handback-survey; null before the survey
        default: null
      - name: handback_rectification_cost_cents
        type: integer
        source: system
        description: certifier-assessed rectification cost recorded by the handback survey; null before the survey
        default: null
      - name: handback_required_reserve_cents
        type: integer
        source: computed
        description: output of calculations.handback_required_reserve; null before the handback survey
        default: null
      - name: handback_shortfall_cents
        type: integer
        source: computed
        description: output of calculations.handback_required_reserve step 5; null before the handback survey
        default: null
      - name: handback_status
        type: enum
        source: system
        description: handback condition assessment state
        default: NOT_SURVEYED
        constraints: "one of {NOT_SURVEYED, CERTIFIED, FAILED}; NOT_SURVEYED at creation, and POST /ppp/concessions/{id}/handback-survey writes CERTIFIED when handback_shortfall_cents == 0 and FAILED otherwise"

  - name: DrawdownMilestone
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: concession_id
        type: string
        source: input
        description: FK -> Concession.id; the concession whose financial close funds this milestone
      - name: sequence_no
        type: integer
        source: system
        description: "1-based insertion order of this milestone within its concession; assigned at creation and never reused. This is the ONLY ordering key for drawdown waterfall replay."
      - name: milestone_name
        type: string
        source: input
        description: construction milestone label (e.g. "Earthworks complete")
        constraints: non-empty, max 200 chars
      - name: requested_amount_cents
        type: integer
        source: input
        description: cash amount requested for this drawdown
        constraints: "> 0"
      - name: certified_cost_cents
        type: integer
        source: input
        description: independently certified cost incurred to this milestone, recorded for audit only
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: drawdown lifecycle state
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, REJECTED, DISBURSED}"
      - name: equity_portion_cents
        type: integer
        source: computed
        description: "equity leg of calculations.drawdown_split; null while status == REQUESTED, written on REQUESTED -> APPROVED"
        default: null
      - name: debt_portion_cents
        type: integer
        source: computed
        description: "senior debt leg of calculations.drawdown_split; null while status == REQUESTED, written on REQUESTED -> APPROVED"
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: reason echoed from the reject call; null unless status == REJECTED
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock timestamp of REQUESTED -> APPROVED
        default: null
      - name: disbursed_at
        type: datetime
        source: system
        description: logical-clock timestamp of APPROVED -> DISBURSED
        default: null

  - name: ServicePeriod
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: concession_id
        type: string
        source: input
        description: FK -> Concession.id; the concession this monthly payment period belongs to
      - name: period_index
        type: integer
        source: input
        description: contractual period number, unique per concession
        constraints: ">= 1"
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the payment period (ISO 8601 UTC)
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the payment period (ISO 8601 UTC); intervals are half-open [period_start, period_end)
      - name: days_in_period
        type: integer
        source: computed
        description: "count of whole calendar days in the half-open interval [period_start, period_end), i.e. (period_end - period_start) expressed in days"
      - name: reporting_status
        type: enum
        source: system
        description: performance-monitoring axis; advances independently of payment_status
        default: PENDING
        constraints: "one of {PENDING, SELF_REPORTED, VERIFIED}"
      - name: payment_status
        type: enum
        source: system
        description: payment axis; advances independently of reporting_status
        default: UNBILLED
        constraints: "one of {UNBILLED, INVOICED, PAID, ADJUSTED}"
      - name: gross_unitary_charge_cents
        type: integer
        source: computed
        description: "copied from Concession.monthly_unitary_charge_cents at ServicePeriod creation and frozen thereafter (a later indexation change does not restate a created period)"
      - name: deduction_cap_cents
        type: integer
        source: computed
        description: "round_half_up(gross_unitary_charge_cents * Concession.deduction_cap_pct), frozen at ServicePeriod creation"
      - name: unavailable_minutes_verified
        type: integer
        source: system
        description: authority-verified unavailable minutes recorded by POST /ppp/service-periods/{id}/verify; null before verification
        default: null
      - name: deduction_points_total
        type: integer
        source: computed
        description: "sum of DeductionEvent.points over deduction events of this period whose status IN {ISSUED, DISPUTED}"
        default: 0
      - name: total_deduction_cents
        type: integer
        source: computed
        description: "running total produced by calculations.period_deduction_cap_allocation (variant SEQUENTIAL_CAP); equals the sum of allowed_amount_cents over the same event set"
        default: 0
      - name: relief_credit_cents
        type: integer
        source: computed
        description: output of calculations.relief_credit_for_period
        default: 0
      - name: net_payment_cents
        type: integer
        source: computed
        description: output of calculations.service_period_net_payment
      - name: availability_ratio
        type: number
        source: computed
        description: "1 - (unavailable_minutes_verified / (days_in_period * 1440)), rounded half-up to 4 decimal places; null while unavailable_minutes_verified is null"
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock timestamp of SELF_REPORTED -> VERIFIED
        default: null
      - name: invoiced_at
        type: datetime
        source: system
        description: logical-clock timestamp of UNBILLED -> INVOICED
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock timestamp of INVOICED -> PAID
        default: null
      - name: payment_reference
        type: string
        source: system
        description: authority payment reference echoed from the pay call; null unless payment_status IN {PAID, ADJUSTED}
        default: null

  - name: PerformanceReport
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: service_period_id
        type: string
        source: input
        description: FK -> ServicePeriod.id; the period this concessionaire self-report covers
      - name: unavailable_minutes
        type: integer
        source: input
        description: self-reported minutes during which the asset failed the availability definition
        constraints: ">= 0"
      - name: category_a_failures
        type: integer
        source: input
        description: self-reported count of Category A performance-standard failures
        constraints: ">= 0"
      - name: category_b_failures
        type: integer
        source: input
        description: self-reported count of Category B performance-standard failures
        constraints: ">= 0"
      - name: reported_points
        type: integer
        source: computed
        description: output of calculations.deduction_points_from_counts applied to this report's self-reported counts
      - name: status
        type: enum
        source: system
        description: report lifecycle state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, VERIFIED, REJECTED, SUPERSEDED}; SUPERSEDED written when a later report is created for the same ServicePeriod"
      - name: variance_pct
        type: number
        source: computed
        description: "output of calculations.self_report_variance, written on the period's SELF_REPORTED -> VERIFIED transition for the report that was still SUBMITTED; null otherwise"
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: reason echoed from the reject call; null unless status == REJECTED
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock timestamp at which the report row was created

  - name: DeductionEvent
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: service_period_id
        type: string
        source: input
        description: FK -> ServicePeriod.id; the payment period this deduction bites into
      - name: performance_report_id
        type: string
        source: system
        description: "FK -> PerformanceReport.id; null for authority-originated events, set only for the SELF_REPORT_UNDERSTATEMENT event auto-created at verification, pointing at the report that understated"
        default: null
      - name: sequence_no
        type: integer
        source: system
        description: "1-based insertion order of this deduction event within its ServicePeriod; assigned at creation and never reused. This is the ONLY ordering key for the sequential-cap waterfall and the pro-rata remainder tie-break."
      - name: deduction_type
        type: enum
        source: input
        description: deduction regime under which this event is issued
        constraints: "one of {UNAVAILABILITY, PERFORMANCE_FAILURE, SELF_REPORT_UNDERSTATEMENT, HANDBACK_SHORTFALL}; SELF_REPORT_UNDERSTATEMENT is system-only (auto-created at verification) and HANDBACK_SHORTFALL is system-only (auto-created at handback certification)"
      - name: points
        type: integer
        source: input
        description: "deduction points assigned to this event; supplied by the AuthorityOfficer for UNAVAILABILITY and PERFORMANCE_FAILURE, computed by the system for SELF_REPORT_UNDERSTATEMENT and HANDBACK_SHORTFALL"
        constraints: "> 0"
      - name: raw_amount_cents
        type: integer
        source: computed
        description: "points * DEDUCTION_POINT_VALUE_CENTS (integer multiplication, exact, no rounding)"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "this event's share under calculations.period_deduction_cap_allocation (variant SEQUENTIAL_CAP) — the contractual amount actually deducted from the period payment"
      - name: pro_rata_amount_cents
        type: integer
        source: computed
        description: "this event's share under calculations.period_deduction_cap_allocation (variant PRO_RATA_CAP) — the reconciliation amount reported by GET /ppp/concessions/{id}/payment-summary; deliberately diverges from allowed_amount_cents on identical inputs"
      - name: status
        type: enum
        source: system
        description: deduction lifecycle state
        default: ISSUED
        constraints: "one of {ISSUED, DISPUTED, OVERTURNED, WITHDRAWN}"
      - name: issued_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the AuthorityOfficer who issued the event (or the literal string SYSTEM for auto-created events); the segregation-of-duties comparand at dispute adjudication"
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock timestamp at which the event row was created
      - name: withdrawal_reason
        type: string
        source: system
        description: reason echoed from the withdraw call; null unless status == WITHDRAWN
        default: null

  - name: DeductionDispute
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: deduction_event_id
        type: string
        source: input
        description: FK -> DeductionEvent.id; the deduction being disputed
      - name: raised_by_user_id
        type: string
        source: system
        description: X-User-ID of the Concessionaire that raised the dispute (equals the concession's concessionaire_id)
      - name: grounds
        type: string
        source: input
        description: latest submitted grounds of dispute; overwritten on each resubmit
        constraints: non-empty, max 2000 chars
      - name: round_no
        type: integer
        source: system
        description: "1 on creation; incremented by one on every REFERRED_BACK -> RESUBMITTED transition; capped by DISPUTE_MAX_ROUNDS"
        default: 1
      - name: status
        type: enum
        source: system
        description: dispute lifecycle state
        default: RAISED
        constraints: "one of {RAISED, REFERRED_BACK, RESUBMITTED, UPHELD, REJECTED}"
      - name: referred_back_reason
        type: string
        source: system
        description: reason echoed from the latest refer-back call; null before the first refer-back
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuthorityOfficer who adjudicated; null before adjudication
        default: null
      - name: adjudicated_at
        type: datetime
        source: system
        description: logical-clock timestamp of the transition into UPHELD or REJECTED
        default: null
      - name: outcome_note
        type: string
        source: system
        description: note echoed from the adjudicate call; null before adjudication
        default: null

  - name: ReliefClaim
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: concession_id
        type: string
        source: input
        description: FK -> Concession.id; the concession under which relief is claimed
      - name: claim_type
        type: enum
        source: input
        description: contractual head of claim
        constraints: "one of {RELIEF_EVENT, COMPENSATION_EVENT, CHANGE_IN_LAW}"
      - name: event_start
        type: datetime
        source: input
        description: inclusive first day of the claimed event window (ISO 8601 UTC); relief windows are CLOSED intervals [event_start, event_end]
      - name: event_end
        type: datetime
        source: input
        description: inclusive last day of the claimed event window (ISO 8601 UTC)
      - name: notified_at
        type: datetime
        source: system
        description: logical clock at row creation; compared against event_start + RELIEF_NOTIFICATION_WINDOW_DAYS by the notification-window validation
      - name: claimed_relief_days
        type: integer
        source: input
        description: relief days claimed by the concessionaire
        constraints: ">= 0"
      - name: claimed_cost_cents
        type: integer
        source: input
        description: compensation amount claimed by the concessionaire
        constraints: ">= 0"
      - name: granted_relief_days
        type: integer
        source: computed
        description: "relief days determined by the AuthorityOfficer; 0 until determination, and 0 permanently when the determination decision is REJECT"
        default: 0
      - name: granted_cost_cents
        type: integer
        source: computed
        description: "compensation cents determined by the AuthorityOfficer; 0 until determination, and 0 permanently when the determination decision is REJECT"
        default: 0
      - name: status
        type: enum
        source: system
        description: claim lifecycle state
        default: NOTIFIED
        constraints: "one of {NOTIFIED, GRANTED, PARTIALLY_GRANTED, REJECTED}; GRANTED when granted_relief_days == claimed_relief_days AND granted_cost_cents == claimed_cost_cents, PARTIALLY_GRANTED when the decision is GRANT but either granted figure is strictly lower, REJECTED when the decision is REJECT"
      - name: determined_at
        type: datetime
        source: system
        description: logical-clock timestamp of the determination
        default: null
      - name: determination_note
        type: string
        source: system
        description: note echoed from the determine call; null before determination
        default: null

  - name: LifecycleReserveTransaction
    parent: null
    common_fields: false
    entity_kind: event
    immutability_note: |
      Append-only ledger. Carries only `id` and `created_at`; there is no update or delete
      endpoint and no `version` field. A mistaken entry is corrected by appending a REVERSAL
      row that points at it via reverses_txn_id, never by mutating the original row.
    fields:
      - name: concession_id
        type: string
        source: input
        description: FK -> Concession.id; the concession whose lifecycle reserve this entry moves
      - name: sequence_no
        type: integer
        source: system
        description: "1-based insertion order of this entry within its concession; the ONLY replay order for resulting_balance_cents"
      - name: txn_type
        type: enum
        source: input
        description: ledger entry kind
        constraints: "one of {CONTRIBUTION, WITHDRAWAL, HANDBACK_TOPUP, REVERSAL}; CONTRIBUTION is also written by the drawdown construction-seed cascade and the refinancing consent sweep cascade"
      - name: amount_cents
        type: integer
        source: input
        description: "positive magnitude of the entry; for txn_type == REVERSAL the request body value is ignored and the magnitude is taken from the reversed entry"
        constraints: "> 0"
      - name: signed_amount_cents
        type: integer
        source: computed
        description: "+amount_cents for txn_type IN {CONTRIBUTION, HANDBACK_TOPUP}; -amount_cents for txn_type == WITHDRAWAL; for txn_type == REVERSAL it is the exact arithmetic negation of the reversed entry's signed_amount_cents"
      - name: reason
        type: string
        source: input
        description: free-text justification recorded for audit
        constraints: non-empty, max 500 chars
      - name: reverses_txn_id
        type: string
        source: input
        description: "FK -> LifecycleReserveTransaction.id; required when txn_type == REVERSAL, MUST be null otherwise (self-referential edge inside the same ledger)"
        default: null
      - name: resulting_balance_cents
        type: integer
        source: computed
        description: "running balance after this entry: sum of signed_amount_cents over entries of the same concession with sequence_no <= this row's sequence_no"
      - name: created_by_role
        type: string
        source: system
        description: "the X-User-Role that appended the entry, or the literal string SYSTEM for cascade-created entries"

  - name: RefinancingEvent
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: concession_id
        type: string
        source: input
        description: FK -> Concession.id; the concession being refinanced
      - name: refinancing_date
        type: datetime
        source: input
        description: proposed effective date of the refinancing (ISO 8601 UTC)
      - name: new_senior_debt_cents
        type: integer
        source: input
        description: face amount of the replacement senior debt
        constraints: ">= 0"
      - name: outstanding_senior_debt_cents
        type: integer
        source: input
        description: senior debt outstanding immediately before the refinancing
        constraints: ">= 0"
      - name: refinancing_cost_cents
        type: integer
        source: input
        description: transaction costs deducted before the gain is shared
        constraints: ">= 0"
      - name: gross_gain_cents
        type: integer
        source: computed
        description: output of calculations.refinancing_gain_share step 1, written at row creation
      - name: tier_pct_applied
        type: number
        source: computed
        description: the gain-share tier selected by calculations.refinancing_gain_share step 2, written at row creation
      - name: authority_share_cents
        type: integer
        source: computed
        description: the public authority's share of the refinancing gain, written at row creation
      - name: concessionaire_share_cents
        type: integer
        source: computed
        description: gross_gain_cents - authority_share_cents, written at row creation
      - name: reserve_sweep_cents
        type: integer
        source: computed
        description: "round_half_up(concessionaire_share_cents * RESERVE_SWEEP_PCT); 0 until consent, written on PROPOSED -> CONSENTED and appended to the lifecycle reserve as a CONTRIBUTION"
        default: 0
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the party that proposed the refinancing; set from the X-User-ID header at creation and compared against the consenting officer by the segregation-of-duties rule
      - name: status
        type: enum
        source: system
        description: consent lifecycle state
        default: PROPOSED
        constraints: "one of {PROPOSED, CONSENTED, REJECTED}"
      - name: consented_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuthorityOfficer who decided; null while status == PROPOSED
        default: null
      - name: consented_at
        type: datetime
        source: system
        description: logical-clock timestamp of the consent decision
        default: null

  - name: EnforcementAction
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: concession_id
        type: string
        source: input
        description: FK -> Concession.id; the concession against which step-in or termination is exercised
      - name: action_type
        type: enum
        source: input
        description: which branch of the enforcement fork this row takes
        constraints: "one of {STEP_IN, TERMINATION}"
      - name: trigger_reason
        type: enum
        source: input
        description: contractual ground; also selects the termination_compensation variant
        constraints: "one of {PERSISTENT_BREACH, LENDER_DEFAULT_CURE, AUTHORITY_VOLUNTARY, CONCESSIONAIRE_DEFAULT, AUTHORITY_DEFAULT, FORCE_MAJEURE}; PERSISTENT_BREACH and LENDER_DEFAULT_CURE are the only grounds admitted for action_type == STEP_IN, the remaining four are the only grounds admitted for action_type == TERMINATION"
      - name: initiated_by_role
        type: string
        source: system
        description: the X-User-Role that created the row (AuthorityOfficer or LenderAgent)
      - name: effective_date
        type: datetime
        source: input
        description: date from which the enforcement action takes effect (ISO 8601 UTC)
      - name: cure_deadline
        type: datetime
        source: computed
        description: "effective_date + CURE_PERIOD_DAYS calendar days; null when action_type == TERMINATION"
        default: null
      - name: status
        type: enum
        source: system
        description: enforcement lifecycle state across both branches of the fork
        default: NOTIFIED
        constraints: "one of {NOTIFIED, STEP_IN_ACTIVE, CURED, LAPSED, COMPENSATION_CALCULATED, SETTLED}"
      - name: outstanding_senior_debt_cents
        type: integer
        source: input
        description: senior debt outstanding at the termination date, supplied at compensation calculation
        default: null
        constraints: ">= 0 when supplied"
      - name: market_value_estimate_cents
        type: integer
        source: input
        description: independent market-value estimate of the concession, used only by the CONCESSIONAIRE_DEFAULT variant
        default: null
        constraints: ">= 0 when supplied"
      - name: rectification_cost_cents
        type: integer
        source: input
        description: cost of rectifying the asset to contract condition, used only by the CONCESSIONAIRE_DEFAULT variant
        default: null
        constraints: ">= 0 when supplied"
      - name: authority_reprocurement_cost_cents
        type: integer
        source: input
        description: authority's cost of reprocuring the service, used only by the CONCESSIONAIRE_DEFAULT variant
        default: null
        constraints: ">= 0 when supplied"
      - name: termination_date
        type: datetime
        source: input
        description: date used as the end of the operational-months accrual window, supplied at compensation calculation
        default: null
      - name: elapsed_operational_months
        type: integer
        source: computed
        description: "floor(calendar_days_between(Concession.actual_service_commencement, termination_date) / 30); 0 when actual_service_commencement is null"
        default: null
      - name: accrued_equity_return_cents
        type: integer
        source: computed
        description: output of calculations.termination_compensation step 2
        default: null
      - name: unpaid_invoiced_cents
        type: integer
        source: computed
        description: "sum of ServicePeriod.net_payment_cents over service periods of this concession with payment_status == INVOICED, evaluated at compensation calculation"
        default: null
      - name: deduction_offset_cents
        type: integer
        source: computed
        description: "sum of DeductionEvent.allowed_amount_cents over every deduction event of this concession with status IN {ISSUED, DISPUTED}, captured at compensation calculation"
        default: null
      - name: compensation_cents
        type: integer
        source: computed
        description: output of calculations.termination_compensation, variant selected by trigger_reason
        default: null
      - name: calculated_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuthorityOfficer who ran calculate-compensation; compared against the settling officer by the segregation-of-duties rule
        default: null
      - name: cure_note
        type: string
        source: system
        description: note echoed from the cure call; null unless status == CURED
        default: null
      - name: cured_at
        type: datetime
        source: system
        description: logical-clock timestamp of STEP_IN_ACTIVE -> CURED
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: logical-clock timestamp of COMPENSATION_CALCULATED -> SETTLED
        default: null
      - name: settlement_reference
        type: string
        source: system
        description: settlement reference echoed from the settle call; null unless status == SETTLED
        default: null
      - name: escalated_to_action_id
        type: string
        source: system
        description: "FK -> EnforcementAction.id; on STEP_IN_ACTIVE -> LAPSED the system appends a TERMINATION row and records its id here; null otherwise"
        default: null

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
# Convention: every transition that mutates a row also refreshes that row's
# `updated_at` and increments its `version` by 1 (per §1.1 common_fields). This
# applies to cascaded mutations too, which is what makes the OCC rules in §1.2.1
# observable from two strictly sequential requests.
# -----------------------------------------------------------------------------
state_machines:

  - entity: Concession
    state_field: status
    shape: cyclic
    initial_state: DRAFTED
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFTED
        to: FINANCIAL_CLOSE
        trigger: "POST /ppp/concessions/{id}/financial-close"
        actor: AuthorityOfficer
        preconditions:
          - "Concession.status == DRAFTED"
          - "senior_debt_committed_cents + equity_committed_cents >= total_project_cost_cents"
        side_effects:
          - "financial_close_date := request body close_date"
          - "monthly_unitary_charge_cents := calculations.monthly_unitary_charge (single round_half_up at the end)"
        note: "Financial close is the only producer of monthly_unitary_charge_cents; every ServicePeriod freezes a copy of it at creation."

      - from: FINANCIAL_CLOSE
        to: CONSTRUCTION
        trigger: "system auto-transition evaluated at the end of POST /ppp/drawdown-milestones/{id}/disburse"
        actor: system
        preconditions:
          - "Concession.status == FINANCIAL_CLOSE"
          - "cumulative_drawn_pct >= CONSTRUCTION_START_PCT (boundary is inclusive: exactly 0.30 fires)"
        side_effects:
          - "CASCADE B LINK 3: appends one LifecycleReserveTransaction with txn_type == CONTRIBUTION, created_by_role == SYSTEM, reason == 'CONSTRUCTION_SEED', amount_cents == round_half_up(total_project_cost_cents * CONSTRUCTION_SEED_PCT)"
          - "CASCADE B LINK 4: that appended entry recomputes Concession.lifecycle_reserve_balance_cents to the entry's resulting_balance_cents"
        note: "Threshold auto-transition; fires at most once because the from-state is consumed."

      - from: CONSTRUCTION
        to: OPERATIONS
        trigger: "POST /ppp/concessions/{id}/certify-service-commencement"
        actor: IndependentCertifier
        preconditions:
          - "Concession.status == CONSTRUCTION"
          - "Concession.actual_service_commencement IS NULL"
          - "request body actual_commencement_date >= Concession.financial_close_date"
        side_effects:
          - "actual_service_commencement := request body actual_commencement_date"
          - "ld_accrued_cents := calculations.liquidated_damages_late_commencement (capped at ld_cap_cents)"

      - from: OPERATIONS
        to: STEP_IN
        trigger: "POST /ppp/concessions/{id}/enforcement-actions with action_type == STEP_IN (cascade from EnforcementAction NOTIFIED -> STEP_IN_ACTIVE)"
        actor: system
        preconditions:
          - "Concession.status == OPERATIONS"
        side_effects:
          - "Concessionaire.status ACTIVE -> STEPPED_IN for the row referenced by Concession.concessionaire_id"

      - from: STEP_IN
        to: OPERATIONS
        trigger: "POST /ppp/enforcement-actions/{id}/cure, or the persistent-breach clearance cascade (CASCADE A LINK 5)"
        actor: system
        preconditions:
          - "Concession.status == STEP_IN"
          - "the EnforcementAction transitioning STEP_IN_ACTIVE -> CURED references this concession"
        side_effects:
          - "Concessionaire.status STEPPED_IN -> ACTIVE"
        note: "This edge closes the cycle OPERATIONS -> STEP_IN -> OPERATIONS."

      - from: OPERATIONS
        to: TERMINATED
        trigger: "POST /ppp/enforcement-actions/{id}/settle (cascade from EnforcementAction COMPENSATION_CALCULATED -> SETTLED)"
        actor: system
        preconditions:
          - "Concession.status IN {OPERATIONS, STEP_IN}"
        side_effects:
          - "every ServicePeriod of this concession with payment_status == INVOICED transitions INVOICED -> ADJUSTED and its net_payment_cents is frozen at its current value"
          - "Concessionaire.status -> WOUND_UP"

      - from: STEP_IN
        to: TERMINATED
        trigger: "POST /ppp/enforcement-actions/{id}/settle (cascade from EnforcementAction COMPENSATION_CALCULATED -> SETTLED)"
        actor: system
        preconditions:
          - "Concession.status == STEP_IN"
        side_effects:
          - "every ServicePeriod of this concession with payment_status == INVOICED transitions INVOICED -> ADJUSTED and its net_payment_cents is frozen at its current value"
          - "Concessionaire.status -> WOUND_UP"

  - entity: Concessionaire
    state_field: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [WOUND_UP]
    transitions:
      - from: ACTIVE
        to: STEPPED_IN
        trigger: "cascade from EnforcementAction NOTIFIED -> STEP_IN_ACTIVE"
        actor: system
        preconditions: ["Concessionaire.status == ACTIVE"]
        side_effects: ["no further propagation; this is the terminal link of the step-in notification cascade"]
      - from: STEPPED_IN
        to: ACTIVE
        trigger: "cascade from EnforcementAction STEP_IN_ACTIVE -> CURED"
        actor: system
        preconditions: ["Concessionaire.status == STEPPED_IN"]
        side_effects: ["no further propagation"]
      - from: ACTIVE
        to: WOUND_UP
        trigger: "cascade from EnforcementAction COMPENSATION_CALCULATED -> SETTLED"
        actor: system
        preconditions: ["Concessionaire.status IN {ACTIVE, STEPPED_IN}"]
        side_effects: ["no further propagation"]
      - from: STEPPED_IN
        to: WOUND_UP
        trigger: "cascade from EnforcementAction COMPENSATION_CALCULATED -> SETTLED"
        actor: system
        preconditions: ["Concessionaire.status == STEPPED_IN"]
        side_effects: ["no further propagation"]

  - entity: DrawdownMilestone
    state_field: status
    shape: branching
    initial_state: REQUESTED
    terminal_states: [REJECTED, DISBURSED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /ppp/drawdown-milestones/{id}/approve"
        actor: IndependentCertifier
        preconditions:
          - "DrawdownMilestone.status == REQUESTED"
          - "Concession.status IN {FINANCIAL_CLOSE, CONSTRUCTION}"
          - "the debt leg computed by calculations.drawdown_split does not exceed (Concession.senior_debt_committed_cents - Concession.senior_debt_drawn_cents)"
        side_effects:
          - "equity_portion_cents and debt_portion_cents := calculations.drawdown_split (nested min/max over the equity-first ceiling, the remaining equity commitment and the requested amount)"
          - "approved_at := logical clock"
        note: "APPROVED branch. The competing REQUESTED -> REJECTED branch writes a disjoint field set (rejection_reason only) and leaves both portion fields null."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /ppp/drawdown-milestones/{id}/reject"
        actor: IndependentCertifier
        preconditions:
          - "DrawdownMilestone.status == REQUESTED"
        side_effects:
          - "rejection_reason := request body rejection_reason"
          - "equity_portion_cents and debt_portion_cents remain null; Concession.senior_debt_drawn_cents, Concession.equity_drawn_cents and Concession.cumulative_drawn_pct are left untouched"
        note: "REJECTED branch. Divergent side-effect set from the APPROVED branch — no split is computed and no funding counter moves."
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /ppp/drawdown-milestones/{id}/disburse"
        actor: LenderAgent
        preconditions:
          - "DrawdownMilestone.status == APPROVED"
          - "Concession.status IN {FINANCIAL_CLOSE, CONSTRUCTION}"
        side_effects:
          - "disbursed_at := logical clock"
          - "CASCADE B LINK 1: Concession.senior_debt_drawn_cents += debt_portion_cents and Concession.equity_drawn_cents += equity_portion_cents"
          - "CASCADE B LINK 2: that mutation recomputes Concession.cumulative_drawn_pct, and when the recomputed value satisfies >= CONSTRUCTION_START_PCT the Concession FINANCIAL_CLOSE -> CONSTRUCTION auto-transition fires (which itself carries LINKS 3 and 4)"

  - entity: ServicePeriod
    state_field: reporting_status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [VERIFIED]
    axis_note: |
      Performance-monitoring axis. Advances only under the report/verify endpoints and is
      completely independent of the payment_status axis below: a period may be INVOICED
      while still PENDING, and may be VERIFIED while still UNBILLED.
    transitions:
      - from: PENDING
        to: SELF_REPORTED
        trigger: "POST /ppp/service-periods/{id}/performance-reports"
        actor: Concessionaire
        preconditions:
          - "ServicePeriod.reporting_status IN {PENDING, SELF_REPORTED}"
          - "Concession.status == OPERATIONS"
          - "request body expected_service_period_version == ServicePeriod.version"
        side_effects:
          - "a PerformanceReport row is created with status SUBMITTED and reported_points := calculations.deduction_points_from_counts"
          - "every other PerformanceReport of this period with status == SUBMITTED transitions SUBMITTED -> SUPERSEDED"
          - "increments ServicePeriod.version by 1"
      - from: SELF_REPORTED
        to: SELF_REPORTED
        trigger: "POST /ppp/service-periods/{id}/performance-reports (supersede-in-place resubmission)"
        actor: Concessionaire
        preconditions:
          - "ServicePeriod.reporting_status == SELF_REPORTED"
          - "Concession.status == OPERATIONS"
          - "request body expected_service_period_version == ServicePeriod.version"
        side_effects:
          - "a new PerformanceReport row is created with status SUBMITTED"
          - "the prior SUBMITTED report transitions SUBMITTED -> SUPERSEDED"
          - "increments ServicePeriod.version by 1"
        note: "Self-loop. This edge is what makes concurrency_rules[report-create-stale-period] a true race rather than a state precondition: the second sequential create legitimately succeeds."
      - from: SELF_REPORTED
        to: PENDING
        trigger: "POST /ppp/performance-reports/{id}/reject"
        actor: AuthorityOfficer
        preconditions:
          - "the target PerformanceReport.status == SUBMITTED"
          - "ServicePeriod.reporting_status == SELF_REPORTED"
        side_effects:
          - "PerformanceReport.status SUBMITTED -> REJECTED and rejection_reason is recorded"
          - "the period's reporting_status reverts to PENDING only when no other PerformanceReport of the period is left in status SUBMITTED; otherwise it stays SELF_REPORTED"
          - "increments ServicePeriod.version by 1"
        note: "Revert edge closing the PENDING -> SELF_REPORTED -> PENDING cycle."
      - from: SELF_REPORTED
        to: VERIFIED
        trigger: "POST /ppp/service-periods/{id}/verify"
        actor: AuthorityOfficer
        preconditions:
          - "ServicePeriod.reporting_status == SELF_REPORTED"
          - "exactly one PerformanceReport of this period has status == SUBMITTED"
          - "Concession.status == OPERATIONS"
        side_effects:
          - "unavailable_minutes_verified := request body verified_unavailable_minutes; availability_ratio recomputed"
          - "the SUBMITTED PerformanceReport transitions SUBMITTED -> VERIFIED and its variance_pct := calculations.self_report_variance"
          - "when variance_pct > SELF_REPORT_VARIANCE_TOLERANCE_PCT (strict >), one DeductionEvent is auto-created with deduction_type == SELF_REPORT_UNDERSTATEMENT, issued_by_user_id == 'SYSTEM', performance_report_id == that report's id, and points := calculations.self_report_variance step 4"
          - "the period re-runs calculations.period_deduction_cap_allocation (both the SEQUENTIAL_CAP and PRO_RATA_CAP variants), then calculations.relief_credit_for_period, then calculations.service_period_net_payment, in that pinned order"
          - "Concession.availability_deduction_ytd_cents, Concession.deduction_points_ytd and Concession.persistent_breach_flag are recomputed because this period has entered the VERIFIED input set"

  - entity: ServicePeriod
    state_field: payment_status
    shape: linear_with_terminal_adjustment
    initial_state: UNBILLED
    terminal_states: [ADJUSTED]
    axis_note: |
      Payment axis. Advances only under the invoice/pay endpoints and the overturn cascade.
      It never reads or writes reporting_status.
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /ppp/service-periods/{id}/invoice"
        actor: Concessionaire
        preconditions:
          - "ServicePeriod.payment_status == UNBILLED"
          - "ServicePeriod.reporting_status == VERIFIED"
          - "Concession.status == OPERATIONS"
        side_effects:
          - "invoiced_at := logical clock"
        note: "The only cross-axis precondition in the whole machine: invoicing requires the reporting axis to have reached VERIFIED."
      - from: INVOICED
        to: PAID
        trigger: "POST /ppp/service-periods/{id}/pay"
        actor: AuthorityOfficer
        preconditions:
          - "ServicePeriod.payment_status == INVOICED"
          - "Concession.status == OPERATIONS"
        side_effects:
          - "paid_at := logical clock; payment_reference := request body payment_reference"
      - from: PAID
        to: ADJUSTED
        trigger: "cascade from DeductionEvent DISPUTED -> OVERTURNED (CASCADE A LINK 2) or from DeductionEvent {ISSUED,DISPUTED} -> WITHDRAWN"
        actor: system
        preconditions:
          - "ServicePeriod.payment_status == PAID"
          - "the recomputed total_deduction_cents differs from the value in force when paid_at was stamped"
        side_effects:
          - "total_deduction_cents, relief_credit_cents and net_payment_cents recomputed"
          - "CASCADE A LINK 3: Concession.availability_deduction_ytd_cents, Concession.deduction_points_ytd and Concession.persistent_breach_flag recomputed"
      - from: INVOICED
        to: ADJUSTED
        trigger: "cascade from Concession {OPERATIONS,STEP_IN} -> TERMINATED"
        actor: system
        preconditions:
          - "ServicePeriod.payment_status == INVOICED"
          - "Concession.status transitions to TERMINATED in this request"
        side_effects:
          - "net_payment_cents frozen at its current value; no further recomputation is performed on this period"

  - entity: PerformanceReport
    state_field: status
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /ppp/service-periods/{id}/verify"
        actor: AuthorityOfficer
        preconditions:
          - "PerformanceReport.status == SUBMITTED"
          - "the report is the only SUBMITTED report of its ServicePeriod"
        side_effects:
          - "variance_pct := calculations.self_report_variance step 3"
          - "when variance_pct > SELF_REPORT_VARIANCE_TOLERANCE_PCT a SELF_REPORT_UNDERSTATEMENT DeductionEvent is created with performance_report_id == this report's id"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ppp/performance-reports/{id}/reject"
        actor: AuthorityOfficer
        preconditions:
          - "PerformanceReport.status == SUBMITTED"
        side_effects:
          - "rejection_reason recorded; the owning ServicePeriod may revert SELF_REPORTED -> PENDING per the reporting-axis machine"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "cascade from a later POST /ppp/service-periods/{id}/performance-reports on the same period"
        actor: system
        preconditions:
          - "PerformanceReport.status == SUBMITTED"
          - "a newer PerformanceReport row for the same service_period_id is being created in this request"
        side_effects:
          - "no fields other than status, updated_at and version change; reported_points is preserved for audit"

  - entity: DeductionEvent
    state_field: status
    shape: branching
    initial_state: ISSUED
    terminal_states: [OVERTURNED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /ppp/deduction-events/{id}/disputes"
        actor: Concessionaire
        preconditions:
          - "DeductionEvent.status == ISSUED"
          - "no DeductionDispute already exists for this deduction_event_id"
        side_effects:
          - "a DeductionDispute row is created with status RAISED and round_no 1"
          - "the event stays inside the {ISSUED, DISPUTED} input set, so total_deduction_cents does NOT move on dispute"
      - from: DISPUTED
        to: OVERTURNED
        trigger: "POST /ppp/deduction-disputes/{id}/adjudicate with decision == UPHOLD (terminal write of the same call)"
        actor: system
        preconditions:
          - "DeductionEvent.status == DISPUTED"
          - "the adjudicating officer's X-User-ID differs from DeductionEvent.issued_by_user_id"
        side_effects:
          - "CASCADE A LINK 2: allowed_amount_cents := 0, pro_rata_amount_cents := 0, and the event leaves the {ISSUED, DISPUTED} input set"
          - "CASCADE A LINK 2 -> 3: the owning ServicePeriod re-runs period_deduction_cap_allocation, relief_credit_for_period and service_period_net_payment in that pinned order, and when payment_status == PAID it transitions PAID -> ADJUSTED"
        note: "OVERTURNED is the terminal state the deduction lands in when the concessionaire wins; the dispute row itself lands in UPHELD. Divergent side-effect set from the DISPUTED -> ISSUED reject branch."
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /ppp/deduction-disputes/{id}/adjudicate with decision == REJECT"
        actor: system
        preconditions:
          - "DeductionEvent.status == DISPUTED"
        side_effects:
          - "the event returns to ISSUED; allowed_amount_cents and pro_rata_amount_cents are unchanged because the event never left the input set"
        note: "REJECT branch. Divergent side-effect set from the UPHOLD branch: nothing downstream of the event is recomputed and no ServicePeriod or Concession field moves."
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /ppp/deduction-events/{id}/withdraw"
        actor: AuthorityOfficer
        preconditions:
          - "DeductionEvent.status == ISSUED"
        side_effects:
          - "withdrawal_reason recorded; allowed_amount_cents := 0 and pro_rata_amount_cents := 0"
          - "the owning ServicePeriod re-runs period_deduction_cap_allocation, relief_credit_for_period and service_period_net_payment in that pinned order"
          - "Concession.availability_deduction_ytd_cents, Concession.deduction_points_ytd and Concession.persistent_breach_flag recomputed"
          - "when payment_status == PAID the period transitions PAID -> ADJUSTED"
        note: "Compensating action for the issue action; see calculations.period_payment_conservation."
      - from: DISPUTED
        to: WITHDRAWN
        trigger: "POST /ppp/deduction-events/{id}/withdraw"
        actor: AuthorityOfficer
        preconditions:
          - "DeductionEvent.status == DISPUTED"
        side_effects:
          - "the open DeductionDispute (status IN {RAISED, REFERRED_BACK, RESUBMITTED}) transitions to UPHELD with outcome_note == 'WITHDRAWN_BY_AUTHORITY' and adjudicated_by_user_id == 'SYSTEM'"
          - "allowed_amount_cents := 0, pro_rata_amount_cents := 0, and the owning ServicePeriod plus Concession derived fields are recomputed exactly as in the ISSUED -> WITHDRAWN edge"

  - entity: DeductionDispute
    state_field: status
    shape: cyclic
    initial_state: RAISED
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: RAISED
        to: REFERRED_BACK
        trigger: "POST /ppp/deduction-disputes/{id}/refer-back"
        actor: AuthorityOfficer
        preconditions:
          - "DeductionDispute.status IN {RAISED, RESUBMITTED}"
          - "DeductionDispute.round_no < DISPUTE_MAX_ROUNDS"
        side_effects:
          - "referred_back_reason recorded"
      - from: REFERRED_BACK
        to: RESUBMITTED
        trigger: "POST /ppp/deduction-disputes/{id}/resubmit"
        actor: Concessionaire
        preconditions:
          - "DeductionDispute.status == REFERRED_BACK"
          - "DeductionDispute.round_no < DISPUTE_MAX_ROUNDS"
        side_effects:
          - "round_no += 1; grounds := request body grounds"
        note: "Closes the cycle REFERRED_BACK -> RESUBMITTED -> REFERRED_BACK, bounded by DISPUTE_MAX_ROUNDS."
      - from: RESUBMITTED
        to: REFERRED_BACK
        trigger: "POST /ppp/deduction-disputes/{id}/refer-back"
        actor: AuthorityOfficer
        preconditions:
          - "DeductionDispute.status == RESUBMITTED"
          - "DeductionDispute.round_no < DISPUTE_MAX_ROUNDS"
        side_effects:
          - "referred_back_reason overwritten"
      - from: RAISED
        to: UPHELD
        trigger: "POST /ppp/deduction-disputes/{id}/adjudicate with decision == UPHOLD"
        actor: AuthorityOfficer
        preconditions:
          - "DeductionDispute.status IN {RAISED, REFERRED_BACK, RESUBMITTED}"
          - "X-User-ID != DeductionEvent.issued_by_user_id for the disputed event (segregation of duties)"
        side_effects:
          - "adjudicated_by_user_id, adjudicated_at and outcome_note recorded"
          - "CASCADE A LINK 1: the disputed DeductionEvent transitions DISPUTED -> OVERTURNED, which carries LINKS 2..5"
      - from: RESUBMITTED
        to: UPHELD
        trigger: "POST /ppp/deduction-disputes/{id}/adjudicate with decision == UPHOLD"
        actor: AuthorityOfficer
        preconditions:
          - "DeductionDispute.status == RESUBMITTED"
          - "X-User-ID != DeductionEvent.issued_by_user_id for the disputed event"
        side_effects:
          - "same as the RAISED -> UPHELD edge, including CASCADE A LINKS 1..5"
      - from: RAISED
        to: REJECTED
        trigger: "POST /ppp/deduction-disputes/{id}/adjudicate with decision == REJECT"
        actor: AuthorityOfficer
        preconditions:
          - "DeductionDispute.status IN {RAISED, REFERRED_BACK, RESUBMITTED}"
          - "X-User-ID != DeductionEvent.issued_by_user_id for the disputed event"
        side_effects:
          - "adjudicated_by_user_id, adjudicated_at and outcome_note recorded"
          - "the disputed DeductionEvent transitions DISPUTED -> ISSUED; no ServicePeriod or Concession field moves"
        note: "REJECT branch of the fork; disjoint side-effect set from the UPHOLD branch."
      - from: RESUBMITTED
        to: REJECTED
        trigger: "POST /ppp/deduction-disputes/{id}/adjudicate with decision == REJECT"
        actor: AuthorityOfficer
        preconditions:
          - "DeductionDispute.status == RESUBMITTED"
          - "X-User-ID != DeductionEvent.issued_by_user_id for the disputed event"
        side_effects:
          - "same as the RAISED -> REJECTED edge"
      - from: REFERRED_BACK
        to: UPHELD
        trigger: "cascade from DeductionEvent DISPUTED -> WITHDRAWN"
        actor: system
        preconditions:
          - "DeductionDispute.status IN {RAISED, REFERRED_BACK, RESUBMITTED}"
        side_effects:
          - "outcome_note := 'WITHDRAWN_BY_AUTHORITY'; adjudicated_by_user_id := 'SYSTEM'"

  - entity: ReliefClaim
    state_field: status
    shape: branching
    initial_state: NOTIFIED
    terminal_states: [GRANTED, PARTIALLY_GRANTED, REJECTED]
    transitions:
      - from: NOTIFIED
        to: GRANTED
        trigger: "POST /ppp/relief-claims/{id}/determine with decision == GRANT and both granted figures equal to the claimed figures"
        actor: AuthorityOfficer
        preconditions:
          - "ReliefClaim.status == NOTIFIED"
          - "request body granted_relief_days <= claimed_relief_days AND granted_cost_cents <= claimed_cost_cents"
          - "the sum of granted_relief_days over ReliefClaim rows of this concession with status IN {GRANTED, PARTIALLY_GRANTED}, plus the granted_relief_days in this request, is <= RELIEF_DAYS_ANNUAL_CAP"
        side_effects:
          - "granted_relief_days, granted_cost_cents, determined_at and determination_note recorded"
          - "when claim_type == COMPENSATION_EVENT: every ServicePeriod of this concession whose half-open interval [period_start, period_end) intersects the closed window [event_start, event_end] re-runs relief_credit_for_period and then service_period_net_payment, and any such period with payment_status == PAID transitions PAID -> ADJUSTED"
          - "when claim_type == RELIEF_EVENT and Concession.status == CONSTRUCTION: nothing is recomputed now; the granted days enter liquidated_damages_late_commencement when service commencement is later certified"
      - from: NOTIFIED
        to: PARTIALLY_GRANTED
        trigger: "POST /ppp/relief-claims/{id}/determine with decision == GRANT and at least one granted figure strictly below the claimed figure"
        actor: AuthorityOfficer
        preconditions:
          - "ReliefClaim.status == NOTIFIED"
          - "request body granted_relief_days <= claimed_relief_days AND granted_cost_cents <= claimed_cost_cents"
          - "the sum of granted_relief_days over ReliefClaim rows of this concession with status IN {GRANTED, PARTIALLY_GRANTED}, plus the granted_relief_days in this request, is <= RELIEF_DAYS_ANNUAL_CAP"
        side_effects:
          - "identical to the NOTIFIED -> GRANTED edge; only the status label differs"
      - from: NOTIFIED
        to: REJECTED
        trigger: "POST /ppp/relief-claims/{id}/determine with decision == REJECT"
        actor: AuthorityOfficer
        preconditions:
          - "ReliefClaim.status == NOTIFIED"
        side_effects:
          - "granted_relief_days := 0 and granted_cost_cents := 0 regardless of the request body figures"
          - "no ServicePeriod is recomputed and Concession.ld_accrued_cents is untouched"
        note: "REJECT branch. Disjoint side-effect set: a rejected claim never enters the relief-credit or liquidated-damages input sets."

  - entity: RefinancingEvent
    state_field: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [CONSENTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: CONSENTED
        trigger: "POST /ppp/refinancing-events/{id}/consent with decision == CONSENT"
        actor: AuthorityOfficer
        preconditions:
          - "RefinancingEvent.status == PROPOSED"
          - "Concession.status == OPERATIONS"
          - "no EnforcementAction of this concession has status IN {NOTIFIED, STEP_IN_ACTIVE, COMPENSATION_CALCULATED}"
          - "request body expected_concession_version == Concession.version"
        side_effects:
          - "consented_by_user_id, consented_at recorded"
          - "reserve_sweep_cents := round_half_up(concessionaire_share_cents * RESERVE_SWEEP_PCT)"
          - "CASCADE D LINK 1: one LifecycleReserveTransaction is appended with txn_type == CONTRIBUTION, created_by_role == SYSTEM, reason == 'REFINANCING_GAIN_SWEEP', amount_cents == reserve_sweep_cents"
          - "CASCADE D LINK 2: that appended entry recomputes Concession.lifecycle_reserve_balance_cents to the entry's resulting_balance_cents"
          - "increments Concession.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /ppp/refinancing-events/{id}/consent with decision == REJECT"
        actor: AuthorityOfficer
        preconditions:
          - "RefinancingEvent.status == PROPOSED"
          - "Concession.status == OPERATIONS"
          - "request body expected_concession_version == Concession.version"
        side_effects:
          - "consented_by_user_id, consented_at recorded; reserve_sweep_cents stays 0"
          - "no LifecycleReserveTransaction is appended and Concession.lifecycle_reserve_balance_cents does not move"
          - "increments Concession.version by 1"
        note: "REJECT branch. Disjoint side-effect set from CONSENT: no ledger entry, no reserve movement."

  - entity: EnforcementAction
    state_field: status
    shape: branching
    initial_state: NOTIFIED
    terminal_states: [CURED, LAPSED, SETTLED]
    fork_note: |
      NOTIFIED is the single entry state. `action_type` selects which arm of the fork the row
      may travel: STEP_IN rows leave NOTIFIED immediately by a system auto-transition into
      STEP_IN_ACTIVE and may only reach CURED or LAPSED; TERMINATION rows stay in NOTIFIED
      until compensation is calculated and may only reach COMPENSATION_CALCULATED then SETTLED.
      The two arms write disjoint field sets and fire disjoint cascades.
    transitions:
      - from: NOTIFIED
        to: STEP_IN_ACTIVE
        trigger: "system auto-transition at the end of POST /ppp/concessions/{id}/enforcement-actions when action_type == STEP_IN"
        actor: system
        preconditions:
          - "action_type == STEP_IN"
          - "trigger_reason IN {PERSISTENT_BREACH, LENDER_DEFAULT_CURE}"
          - "when trigger_reason == PERSISTENT_BREACH: Concession.persistent_breach_flag == true"
          - "Concession.status == OPERATIONS"
        side_effects:
          - "cure_deadline := effective_date + CURE_PERIOD_DAYS calendar days"
          - "Concession.status OPERATIONS -> STEP_IN"
          - "that concession mutation propagates to Concessionaire.status ACTIVE -> STEPPED_IN"
      - from: STEP_IN_ACTIVE
        to: CURED
        trigger: "POST /ppp/enforcement-actions/{id}/cure, or CASCADE A LINK 4 when Concession.persistent_breach_flag flips true -> false"
        actor: LenderAgent
        preconditions:
          - "EnforcementAction.status == STEP_IN_ACTIVE"
          - "for the manual call: the logical clock is <= cure_deadline"
          - "for the cascade path: trigger_reason == PERSISTENT_BREACH and the recomputed Concession.persistent_breach_flag == false"
        side_effects:
          - "cure_note and cured_at recorded (cure_note := 'PERSISTENT_BREACH_CLEARED' on the cascade path)"
          - "CASCADE A LINK 5: Concession.status STEP_IN -> OPERATIONS, which propagates to Concessionaire.status STEPPED_IN -> ACTIVE"
      - from: STEP_IN_ACTIVE
        to: LAPSED
        trigger: "POST /ppp/enforcement-actions/{id}/escalate"
        actor: LenderAgent
        preconditions:
          - "EnforcementAction.status == STEP_IN_ACTIVE"
          - "the logical clock is > cure_deadline"
        side_effects:
          - "a new EnforcementAction row is appended with action_type == TERMINATION, trigger_reason == CONCESSIONAIRE_DEFAULT, effective_date == the logical clock, status NOTIFIED, initiated_by_role == 'SYSTEM'"
          - "escalated_to_action_id := the appended row's id"
          - "Concession.status stays STEP_IN; the STEP_IN arm of the fork joins the TERMINATION arm at the appended row"
      - from: NOTIFIED
        to: COMPENSATION_CALCULATED
        trigger: "POST /ppp/enforcement-actions/{id}/calculate-compensation"
        actor: AuthorityOfficer
        preconditions:
          - "EnforcementAction.status == NOTIFIED"
          - "action_type == TERMINATION"
          - "Concession.status IN {OPERATIONS, STEP_IN}"
          - "when trigger_reason == CONCESSIONAIRE_DEFAULT: market_value_estimate_cents, rectification_cost_cents and authority_reprocurement_cost_cents are all supplied"
        side_effects:
          - "termination_date, outstanding_senior_debt_cents and the four optional inputs recorded"
          - "elapsed_operational_months, accrued_equity_return_cents, unpaid_invoiced_cents, deduction_offset_cents and compensation_cents := calculations.termination_compensation (variant selected by trigger_reason)"
      - from: COMPENSATION_CALCULATED
        to: SETTLED
        trigger: "POST /ppp/enforcement-actions/{id}/settle"
        actor: AuthorityOfficer
        preconditions:
          - "EnforcementAction.status == COMPENSATION_CALCULATED"
          - "compensation_cents IS NOT NULL"
        side_effects:
          - "settled_at and settlement_reference recorded"
          - "CASCADE C LINK 1: Concession.status {OPERATIONS, STEP_IN} -> TERMINATED"
          - "CASCADE C LINK 2: that concession mutation transitions every ServicePeriod of the concession with payment_status == INVOICED to ADJUSTED"
          - "CASCADE C LINK 3: the same concession mutation propagates to Concessionaire.status -> WOUND_UP"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on a parent entity's `version` ONLY
# -----------------------------------------------------------------------------
concurrency_rules:

  - rule_id: report-create-stale-period
    parent_entity: ServicePeriod
    write_endpoint: "POST /ppp/service-periods/{id}/performance-reports"
    occ_field: "expected_service_period_version"
    description: |
      Creating a PerformanceReport against a ServicePeriod whose `version` has advanced past
      the value the client last observed is rejected. Because the reporting-axis machine
      declares a SELF_REPORTED -> SELF_REPORTED self-loop, a second create against the same
      period is a legitimate supersede-in-place resubmission and would otherwise succeed
      silently on a stale view — the writer would be superseding a report it never read.
      The stale-version check turns that into a deterministic rejection.
    error_id: ERR_STALE_SERVICE_PERIOD_VERSION
    http_status: 412

  - rule_id: drawdown-create-stale-concession
    parent_entity: Concession
    write_endpoint: "POST /ppp/concessions/{id}/drawdown-milestones"
    occ_field: "expected_concession_version"
    description: |
      Creating a DrawdownMilestone against a Concession whose `version` has advanced past the
      value the client last observed is rejected. Milestone creation is additive and always
      legitimate on its own terms, but the equity/debt split the requester is relying on is a
      function of the concession's cumulative drawn state; a view that predates another
      milestone's disbursement (or the FINANCIAL_CLOSE -> CONSTRUCTION auto-transition it
      triggered) would produce a split the requester did not intend.
    error_id: ERR_STALE_CONCESSION_VERSION
    http_status: 412

  - rule_id: refinancing-consent-stale-concession
    parent_entity: Concession
    write_endpoint: "POST /ppp/refinancing-events/{id}/consent"
    occ_field: "expected_concession_version"
    description: |
      Consenting to a RefinancingEvent against a Concession whose `version` has advanced past
      the value the officer last observed is rejected. Consent is legitimate on its own terms
      and appends a reserve sweep sized from a gain computed at proposal time; if the
      concession has since moved (a further drawdown, a period recompute, an enforcement
      cascade) the officer is consenting on a view that no longer describes the project.
    error_id: ERR_STALE_CONCESSION_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules
# -----------------------------------------------------------------------------
# All money is integer cents. Every division or percentage multiplication resolves
# through Decimal arithmetic with ROUND_HALF_UP and exactly ONE rounding step at the
# position stated in each formula. Where a formula prescribes an evaluation ORDER, that
# order is contractual: re-ordering the same operands yields a different, wrong answer.
# No business decision anywhere reads a random `id`; ordering keys are the explicit
# `sequence_no` fields declared in §1.1, with `created_at` as the documented fallback.
# -----------------------------------------------------------------------------
calculations:

  - name: monthly_unitary_charge
    trigger: "on POST /ppp/concessions/{id}/financial-close, and re-derived whenever Concession.masp_cents or Concession.indexation_pct is amended by PATCH /ppp/concessions/{id}"
    algorithm: aggregation
    formula: |
      # Evaluation order is contractual: divide, then index, then round ONCE at the end.
      raw = Decimal(masp_cents) / Decimal(12) * (Decimal(1) + Decimal(indexation_pct))
      monthly_unitary_charge_cents = round_half_up(raw, 0)

      # The three operations MUST NOT be re-associated. Rounding the annual/12 quotient
      # to cents BEFORE applying indexation is the canonical wrong answer:
      #   masp=100000000, indexation=0.0325
      #     correct  -> 100000000/12 = 8333333.3333...; x 1.0325 = 8604166.6666...; round -> 8604167
      #     wrong    -> round(8333333.3333) = 8333333; x 1.0325 = 8604166.4725; round -> 8604166
      #   a 1-cent divergence that then propagates into deduction_cap_cents and
      #   relief_credit_for_period for every service period of the concession.
    input_set: "the single Concession row named in the path; no child rows participate"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "integer cents, ROUND_HALF_UP, exactly one rounding step applied to the fully-composed expression"

  - name: deduction_points_from_counts
    trigger: "on POST /ppp/service-periods/{id}/performance-reports (computes PerformanceReport.reported_points) and on POST /ppp/service-periods/{id}/verify (computes the verified point total from the verifier's counts)"
    algorithm: weighted_scoring
    formula: |
      points = UNAVAILABILITY_POINTS_PER_MINUTE * unavailable_minutes
             + CATEGORY_A_POINTS * category_a_failures
             + CATEGORY_B_POINTS * category_b_failures
      # Integer arithmetic throughout; no rounding step exists, so no drift is possible.
      # Worked fixture: (minutes=100, a=2, b=4) -> 200 + 80 + 40 = 320
      #                 (minutes=108, a=2, b=4) -> 216 + 80 + 40 = 336
      #                 (minutes=110, a=2, b=4) -> 220 + 80 + 40 = 340
    input_set: "the three counts carried on one PerformanceReport row, or the three counts supplied in the verify request body"
    constants:
      UNAVAILABILITY_POINTS_PER_MINUTE: 2
      CATEGORY_A_POINTS: 40
      CATEGORY_B_POINTS: 10
    precision: "exact integers, no rounding"

  - name: self_report_variance
    trigger: "on POST /ppp/service-periods/{id}/verify, after the verified point total is computed"
    algorithm: threshold
    formula: |
      reported = the reported_points of the PerformanceReport of this period whose status == SUBMITTED
      verified = deduction_points_from_counts(verifier's counts)
      if reported == 0:
        variance_pct = Decimal(0) if verified == 0 else Decimal(1)
      else:
        variance_pct = round_half_up(Decimal(verified - reported) / Decimal(reported), 4)

      # STRICT greater-than at the tolerance boundary.
      understatement_triggered = variance_pct > SELF_REPORT_VARIANCE_TOLERANCE_PCT

      if understatement_triggered:
        # The uplift is applied to the point DELTA, not to the verified total.
        understatement_points = round_half_up(
            Decimal(verified - reported) * (Decimal(1) + UNDERSTATEMENT_UPLIFT_PCT), 0)
      else:
        understatement_points = 0

      # Worked fixture (reported = 320):
      #   verified 336 -> variance 0.0500 -> NOT > 0.05 -> understatement_points = 0
      #   verified 340 -> variance 0.0625 -> triggered  -> round_half_up(20 * 1.25) = 25
      #                                                 -> raw_amount_cents 25 * 1250 = 31250
    input_set: "exactly one PerformanceReport per ServicePeriod, the one with status == SUBMITTED; SUPERSEDED and REJECTED reports are excluded"
    constants:
      SELF_REPORT_VARIANCE_TOLERANCE_PCT: 0.05
      UNDERSTATEMENT_UPLIFT_PCT: 0.25
    precision: "variance_pct to 4 decimal places ROUND_HALF_UP; understatement_points to integer ROUND_HALF_UP"

  - name: deduction_event_raw_amount
    trigger: "on every DeductionEvent append — from POST /ppp/service-periods/{id}/deduction-events, from the verify cascade, and from the handback-shortfall cascade"
    algorithm: aggregation
    formula: |
      raw_amount_cents = points * DEDUCTION_POINT_VALUE_CENTS
      # points 400 -> 500000 ; 600 -> 750000 ; 500 -> 625000 ; 25 -> 31250
    input_set: "the single DeductionEvent row being appended"
    constants:
      DEDUCTION_POINT_VALUE_CENTS: 1250
    precision: "exact integers, no rounding"

  - name: period_deduction_cap_allocation
    trigger: "on POST /ppp/service-periods/{id}/verify, and re-run on every subsequent event set change for the period (deduction-event append, deduction withdrawal, dispute overturn, compensation-event grant)"
    algorithm: waterfall_allocation
    formula: |
      cap        = ServicePeriod.deduction_cap_cents           # frozen at verify time
      events     = the period's DeductionEvent rows in the input set, ordered by sequence_no ASC
      raw_total  = sum(e.raw_amount_cents for e in events)

      # ---- both variants are computed on EVERY run and both are persisted ----
      # allowed_amount_cents      <- SEQUENTIAL_CAP variant
      # pro_rata_amount_cents     <- PRO_RATA_CAP variant
      # ServicePeriod.total_deduction_cents <- sum of allowed_amount_cents (SEQUENTIAL_CAP is
      #                                        the contractual figure; PRO_RATA_CAP is the
      #                                        audit shadow the authority publishes alongside)
    input_set: "DeductionEvent rows of the ServicePeriod whose status IN {ISSUED, DISPUTED}. Rows in OVERTURNED or WITHDRAWN are excluded, which is what makes the whole allocation re-run when a dispute is upheld or an event withdrawn. An empty input set yields raw_total 0, every allocation 0, and total_deduction_cents 0."
    constants:
      SEQUENTIAL_TIE_BREAK: "sequence_no ASC"
      PRO_RATA_REMAINDER_TIE_BREAK: "raw_amount_cents DESC, then sequence_no ASC"
    precision: "integer cents; SEQUENTIAL_CAP performs no rounding at all, PRO_RATA_CAP floors each share then distributes the residue one cent at a time"
    variants:
      - name: SEQUENTIAL_CAP
        when: "always computed; written to DeductionEvent.allowed_amount_cents and it is this variant that feeds ServicePeriod.total_deduction_cents and therefore the payment"
        difference: |
          Chronological waterfall in sequence_no order. Earlier events are paid in full and the
          event that straddles the cap absorbs the truncation; every later event gets zero.
            headroom = cap
            for e in events (sequence_no ASC):
                e.allowed_amount_cents = min(e.raw_amount_cents, headroom)
                headroom -= e.allowed_amount_cents
          Fixture (cap 1720833; raws 500000, 750000, 625000 at sequence_no 1,2,3):
            -> 500000, 750000, 470833   (sum 1720833; event 3 truncated, no event zeroed)
          Order sensitivity is total: feeding the same three raws as sequence_no 3,2,1
          yields 625000, 750000, 345833 instead.
      - name: PRO_RATA_CAP
        when: "always computed; written to DeductionEvent.pro_rata_amount_cents and surfaced by GET /ppp/concessions/{id}/payment-summary as the audit shadow. Never feeds net_payment_cents."
        difference: |
          Every event is scaled by the same ratio, so no event is truncated to zero and no
          event keeps its full raw amount.
            if raw_total <= cap:  e.pro_rata_amount_cents = e.raw_amount_cents  (no scaling)
            else:
              for e in events:
                  e.pro_rata_amount_cents = floor(Decimal(e.raw_amount_cents) * Decimal(cap)
                                                  / Decimal(raw_total))
              residue = cap - sum(e.pro_rata_amount_cents)
              distribute the `residue` cents one at a time over the events ordered by
              (raw_amount_cents DESC, sequence_no ASC), +1 cent each, wrapping if needed
          Fixture (cap 1720833; raws 500000, 750000, 625000 at sequence_no 1,2,3):
            floors    -> 458888, 688333, 573611   (sum 1720832, residue 1)
            residue   -> the +1 goes to sequence_no 2 (largest raw 750000)
            final     -> 458888, 688334, 573611   (sum 1720833)
          Same cap, same raws, same total — but a per-event allocation that differs from
          SEQUENTIAL_CAP on all three rows.

  - name: relief_credit_for_period
    trigger: "on POST /ppp/service-periods/{id}/verify, and re-run whenever a ReliefClaim of claim_type == COMPENSATION_EVENT reaches GRANTED or PARTIALLY_GRANTED with a window intersecting the period"
    algorithm: interval_merge
    formula: |
      # 1. collect the granted windows, clipped to the period
      period_window = [period_start, period_end)                  # HALF-OPEN
      windows = []
      for c in input_set:
          claim_window = [c.event_start, c.event_end]             # CLOSED
          overlap_days = count of distinct calendar days d such that
                         d in claim_window AND period_start <= d < period_end
          if overlap_days > 0: windows.append((c, overlap_days))

      # 2. MERGE before counting: a calendar day covered by two granted claims counts ONCE.
      credited_days = |union of the clipped day-sets|             # NOT sum(overlap_days)
      credited_days = min(credited_days, days_in_period)

      # 3. one rounding step, against the FROZEN gross charge of the period
      relief_credit_cents = round_half_up(
          Decimal(gross_unitary_charge_cents) * Decimal(credited_days) / Decimal(days_in_period), 0)

      # Fixture (gross 8604167, days_in_period 31):
      #   credited_days 3 -> 8604167*3/31  = 832661.32... -> 832661
      #   credited_days 8 -> 8604167*8/31  = 2220430.19.. -> 2220430
      #   credited_days 0 -> 0             (no rounding, exact zero)
    input_set: "ReliefClaim rows of the same Concession with claim_type == COMPENSATION_EVENT and status IN {GRANTED, PARTIALLY_GRANTED}. RELIEF_EVENT and CHANGE_IN_LAW claims are excluded — RELIEF_EVENT feeds liquidated_damages_late_commencement instead, CHANGE_IN_LAW feeds granted_cost_cents only. NOTIFIED and REJECTED claims are excluded."
    constants:
      DAY_BOUNDARY_SEMANTICS: "ServicePeriod interval is half-open [start, end); ReliefClaim window is closed [start, end]"
    precision: "integer cents, ROUND_HALF_UP, exactly one rounding step after the day-union is final"

  - name: service_period_net_payment
    trigger: "on POST /ppp/service-periods/{id}/verify, and re-run on every recompute of period_deduction_cap_allocation or relief_credit_for_period"
    algorithm: aggregation
    formula: |
      # PINNED ORDER — four steps, and the sequence is contractual:
      #   (1) cap the event allocation  (period_deduction_cap_allocation, SEQUENTIAL_CAP)
      #   (2) total_deduction_cents = sum of allowed_amount_cents over the input set
      #   (3) relief_credit_cents   = relief_credit_for_period
      #   (4) net_payment_cents     = gross - max(0, total_deduction_cents - relief_credit_cents)
      net_payment_cents = gross_unitary_charge_cents
                        - max(0, total_deduction_cents - relief_credit_cents)

      # The relief credit offsets the CAPPED deduction, never the raw deduction. Applying
      # step (3) before step (1) is the canonical wrong answer:
      #   gross 8604167, raws 500000+750000+625000 = 1875000, cap 1720833, relief 832661
      #     correct -> capped 1720833; 1720833-832661 = 888172; net 8604167-888172 = 7715995
      #     wrong   -> 1875000-832661 = 1042339 (now under the cap, so never capped);
      #                net 8604167-1042339 = 7561828
      # Single-event fixture (one 400-point event, no relief):
      #     capped 500000; net 8604167-500000 = 8104167
      # availability_ratio is reported alongside and is independent of money:
      #     availability_ratio = round_half_up(
      #         Decimal(days_in_period*1440 - unavailable_minutes_verified)
      #         / Decimal(days_in_period*1440), 4)
      #     31 days, 108 unavailable minutes -> 44532/44640 -> 0.9976
    input_set: "the ServicePeriod row plus its DeductionEvent rows with status IN {ISSUED, DISPUTED} and its Concession's granted COMPENSATION_EVENT claims"
    constants:
      NET_PAYMENT_FLOOR_CENTS: 0
    precision: "integer cents; the max(0, ...) clamp guarantees net_payment_cents is never negative and never exceeds gross_unitary_charge_cents"

  - name: annual_deduction_cap_check
    trigger: "on POST /ppp/service-periods/{id}/verify (evaluated after service_period_net_payment and before the period is allowed to leave SELF_REPORTED) and again on POST /ppp/service-periods/{id}/deduction-events when the owning period is already VERIFIED"
    algorithm: threshold
    formula: |
      annual_cap_cents = round_half_up(Decimal(masp_cents) * ANNUAL_DEDUCTION_CAP_PCT, 0)
      projected_ytd    = Concession.availability_deduction_ytd_cents + total_deduction_cents
      # STRICT greater-than: landing exactly on the cap is permitted.
      if projected_ytd > annual_cap_cents: reject with ERR_ANNUAL_DEDUCTION_CAP_EXCEEDED (422)
      else: Concession.availability_deduction_ytd_cents = projected_ytd

      # Fixture: masp 100000000 -> annual_cap_cents 10000000.
      #   ytd 8279167 + 1720833 = 10000000 -> exactly at the cap -> ACCEPTED
      #   ytd 8279168 + 1720833 = 10000001 -> over the cap       -> REJECTED
    input_set: "the Concession's running availability_deduction_ytd_cents plus the period being verified"
    constants:
      ANNUAL_DEDUCTION_CAP_PCT: 0.10
    precision: "integer cents, ROUND_HALF_UP on the cap derivation only"

  - name: persistent_breach_evaluation
    trigger: "on every mutation of Concession.deduction_points_ytd — the verify cascade, a deduction-event append, a deduction withdrawal, and a dispute overturn"
    algorithm: threshold
    formula: |
      deduction_points_ytd = sum of `points` over every DeductionEvent of every ServicePeriod
                             of this concession whose status IN {ISSUED, DISPUTED}
      # >= at the boundary: exactly 500 points DOES set the flag.
      persistent_breach_flag = (deduction_points_ytd >= PERSISTENT_BREACH_POINTS_THRESHOLD)

      # The flag is RECOMPUTED, not latched: withdrawing an event or having one overturned
      # can drop the total back below the threshold and flip the flag true -> false, which
      # is the trigger for the STEP_IN_ACTIVE -> CURED cascade in §1.2.
      # Fixture: 400 + 600 = 1000 -> true ; overturn the 600 -> 400 -> false
      #          exactly 500      -> true ; 499 -> false
    input_set: "DeductionEvent rows with status IN {ISSUED, DISPUTED} across all ServicePeriods of the Concession"
    constants:
      PERSISTENT_BREACH_POINTS_THRESHOLD: 500
    precision: "exact integers"

  - name: drawdown_split
    trigger: "on POST /ppp/drawdown-milestones/{id}/approve (computes the split) and re-affirmed at POST /ppp/drawdown-milestones/{id}/disburse"
    algorithm: waterfall_allocation
    formula: |
      # Equity-first waterfall. The equity bucket's size is the MINIMUM of two independently
      # sourced ceilings, and swapping min for either ceiling alone changes the split.
      equity_first_ceiling_cents = min(
          round_half_up(Decimal(total_project_cost_cents) * EQUITY_FIRST_PCT, 0),
          equity_committed_cents)

      cum_before   = Concession.equity_drawn_cents + Concession.senior_debt_drawn_cents
      equity_room  = max(0, equity_first_ceiling_cents - Concession.equity_drawn_cents)
      equity_portion_cents = min(certified_cost_cents, equity_room)
      debt_portion_cents   = certified_cost_cents - equity_portion_cents

      # Fixture: total_project_cost 400000000, EQUITY_FIRST_PCT 0.30 -> 120000000;
      #          equity_committed 100000000  ->  ceiling = min(120000000, 100000000)
      #                                                  = 100000000
      #   M1 certified  80000000, equity_drawn   0 -> equity  80000000 / debt         0
      #   M2 certified  60000000, equity_drawn  80000000 -> equity 20000000 / debt 40000000
      #   M3 certified 100000000, equity_drawn 100000000 -> equity        0 / debt 100000000
      #   boundary: a single M certified 120000000 from a virgin concession
      #             -> equity 100000000 / debt 20000000
      # Taking the round_half_up ceiling alone (120000000) would give M2 equity 40000000 /
      # debt 20000000; taking equity_committed alone gives the same answer here but diverges
      # whenever EQUITY_FIRST_PCT * total_project_cost < equity_committed_cents.
    input_set: "the DrawdownMilestone being approved plus the owning Concession's running equity_drawn_cents / senior_debt_drawn_cents; only DISBURSED milestones have contributed to those running totals"
    constants:
      EQUITY_FIRST_PCT: 0.30
    precision: "integer cents; one ROUND_HALF_UP step on the percentage ceiling, exact integer arithmetic thereafter"

  - name: construction_trigger_and_seed
    trigger: "on POST /ppp/drawdown-milestones/{id}/disburse, after the running drawn totals are updated"
    algorithm: threshold
    formula: |
      cumulative_drawn_pct = round_half_up(
          Decimal(equity_drawn_cents + senior_debt_drawn_cents)
          / Decimal(total_project_cost_cents), 4)

      # >= at the boundary: exactly 0.30 fires the transition.
      if Concession.status == FINANCIAL_CLOSE
         and cumulative_drawn_pct >= CONSTRUCTION_START_PCT:
            Concession.status = CONSTRUCTION
            seed = round_half_up(Decimal(total_project_cost_cents) * CONSTRUCTION_SEED_PCT, 0)
            append LifecycleReserveTransaction(txn_type=CONTRIBUTION,
                                               reason='CONSTRUCTION_SEED',
                                               amount_cents=seed,
                                               created_by_role='SYSTEM')

      # Fixture: total_project_cost 400000000
      #   drawn 120000000 -> 0.3000 -> fires ; seed = 400000000*0.02 = 8000000
      #   drawn 119999999 -> 0.3000 (rounds up from 0.29999999) -> ALSO fires, because the
      #                      comparison is against the ROUNDED 4-dp ratio, not the raw ratio
      #   drawn 119980000 -> raw 0.29995 -> rounds to 0.3000 -> ALSO fires (the classic trap)
      #   drawn 119900000 -> raw 0.299750 -> rounds to 0.2998 -> does NOT fire
    input_set: "the Concession row; only DISBURSED milestones have contributed to the drawn totals"
    constants:
      CONSTRUCTION_START_PCT: 0.30
      CONSTRUCTION_SEED_PCT: 0.02
    precision: "cumulative_drawn_pct to 4 decimal places ROUND_HALF_UP; the seed to integer cents ROUND_HALF_UP"

  - name: liquidated_damages_late_commencement
    trigger: "on POST /ppp/concessions/{id}/certify-service-commencement"
    algorithm: threshold
    formula: |
      gross_late_days = (actual_service_commencement - scheduled_service_commencement) in
                        whole calendar days, floored at 0
      excused_days    = sum of granted_relief_days over ReliefClaim rows of this concession
                        with claim_type == RELIEF_EVENT and status IN {GRANTED, PARTIALLY_GRANTED}
      net_late_days   = max(0, gross_late_days - excused_days)

      # cap AFTER multiplying, never a cap on the day count
      ld_accrued_cents = min(net_late_days * ld_daily_rate_cents, ld_cap_cents)

      # Fixture (rate 250000/day, cap 5000000, scheduled 2027-01-01):
      #   actual 2027-01-21 (20 days), excused 6 -> net 14 -> 3500000            (under cap)
      #   actual 2027-01-21 (20 days), excused 0 -> net 20 -> 5000000            (exactly cap)
      #   actual 2027-01-22 (21 days), excused 0 -> net 21 -> 5250000 -> 5000000 (capped)
      #   actual 2026-12-28 (early)              -> net  0 -> 0
    input_set: "granted RELIEF_EVENT claims of the concession; COMPENSATION_EVENT and CHANGE_IN_LAW claims are excluded, as are NOTIFIED and REJECTED claims"
    constants:
      LD_DAY_BASIS: "whole calendar days, actual minus scheduled, floored at zero"
    precision: "exact integers; the cap is applied to the money product, not to the day count"

  - name: handback_required_reserve
    trigger: "on POST /ppp/concessions/{id}/handback-survey"
    algorithm: constraint_propagation
    formula: |
      # SINGLE PASS, NOT iterated to a fixed point. The penalty is sized from the
      # PRE-PENALTY shortfall and is then added to the requirement; the resulting larger
      # shortfall does NOT re-enter the penalty base.
      base_required_cents   = handback_rectification_cost_cents
      shortfall_pre_cents   = max(0, base_required_cents - lifecycle_reserve_balance_cents)
      penalty_cents         = round_half_up(
                                Decimal(shortfall_pre_cents) * HANDBACK_SHORTFALL_PENALTY_PCT, 0)
      handback_required_reserve_cents = base_required_cents + penalty_cents
      handback_shortfall_cents        = max(0,
          handback_required_reserve_cents - lifecycle_reserve_balance_cents)

      handback_status = CERTIFIED if handback_shortfall_cents == 0 else FAILED

      # FAILED additionally appends a DeductionEvent of deduction_type == HANDBACK_SHORTFALL
      # against the concession's most recent VERIFIED ServicePeriod (highest period_index),
      # sized so that its raw amount reproduces the shortfall exactly:
      #   points = round_half_up(Decimal(handback_shortfall_cents)
      #                          / Decimal(DEDUCTION_POINT_VALUE_CENTS), 0)
      # shortfall 4600000 -> points 3680 -> raw_amount_cents 4600000, which the period's
      # deduction_cap_cents then truncates under period_deduction_cap_allocation.

      # Fixture (rectification 12000000, reserve balance 8000000, penalty pct 0.15):
      #   shortfall_pre = 4000000 ; penalty = 600000
      #   required      = 12600000
      #   shortfall     = 4600000        <- single pass
      #   a fixed-point iteration would instead give penalty 690000 -> required 12690000
      #   -> shortfall 4690000 -> penalty 703500 -> ... converging near 4705882; that is
      #   the canonical wrong answer.
      # Fixture (rectification 12000000, reserve balance 12000000):
      #   shortfall_pre = 0 ; penalty = 0 ; required = 12000000 ; shortfall = 0 -> CERTIFIED
    input_set: "the Concession row's handback_rectification_cost_cents and its lifecycle_reserve_balance_cents, the latter being the signed sum over all its LifecycleReserveTransaction rows"
    constants:
      HANDBACK_SHORTFALL_PENALTY_PCT: 0.15
      ITERATION_POLICY: "single pass; the penalty base is the pre-penalty shortfall"
    precision: "integer cents, ROUND_HALF_UP on the penalty only"

  - name: refinancing_gain_share
    trigger: "on POST /ppp/concessions/{id}/refinancing-events (computes the whole share block at proposal time) and frozen thereafter"
    algorithm: tiered_pricing
    formula: |
      gross_gain_cents = new_senior_debt_cents
                       - outstanding_senior_debt_cents
                       - refinancing_cost_cents
      if gross_gain_cents <= 0: reject with ERR_NO_REFINANCING_GAIN (422)

      tier1_ceiling_cents = round_half_up(Decimal(masp_cents) * TIER1_MASP_MULTIPLE, 0)
      tier2_ceiling_cents = round_half_up(Decimal(masp_cents) * TIER2_MASP_MULTIPLE, 0)

      # AVERAGE-rate tiering, not marginal: ONE rate is selected by the band the whole gain
      # falls in and is then applied to the ENTIRE gain. Boundaries use <=, so a gain sitting
      # exactly on a ceiling stays in the lower band.
      if   gross_gain_cents <= tier1_ceiling_cents: tier_pct_applied = TIER1_AUTHORITY_PCT
      elif gross_gain_cents <= tier2_ceiling_cents: tier_pct_applied = TIER2_AUTHORITY_PCT
      else:                                         tier_pct_applied = TIER3_AUTHORITY_PCT

      authority_share_cents      = round_half_up(
                                     Decimal(gross_gain_cents) * tier_pct_applied, 0)
      concessionaire_share_cents = gross_gain_cents - authority_share_cents   # residual, exact
      reserve_sweep_cents        = round_half_up(
                                     Decimal(concessionaire_share_cents) * RESERVE_SWEEP_PCT, 0)

      # Fixture (masp 100000000 -> tier1 50000000, tier2 150000000):
      #   gain 50000000 -> tier 0.30 -> authority 15000000, concessionaire 35000000,
      #                                 sweep round_half_up(35000000*0.25) = 8750000
      #   gain 50000001 -> tier 0.50 -> authority round_half_up(25000000.5) = 25000001,
      #                                 concessionaire 25000000, sweep 6250000
      #   one cent of extra gain moves the authority's share by 10000001 cents, and the
      #   ROUND_HALF_UP on 25000000.5 must round UP (banker's rounding gives 25000000,
      #   which then leaves the concessionaire 25000001 — the canonical wrong answer).
      #   gain 150000001 -> tier 0.60 -> authority 90000001 (round_half_up(90000000.6))
    input_set: "the single RefinancingEvent being proposed plus its Concession's masp_cents; no other refinancing events participate, so tiers do not aggregate across events"
    constants:
      TIER1_MASP_MULTIPLE: 0.5
      TIER2_MASP_MULTIPLE: 1.5
      TIER1_AUTHORITY_PCT: 0.30
      TIER2_AUTHORITY_PCT: 0.50
      TIER3_AUTHORITY_PCT: 0.60
      RESERVE_SWEEP_PCT: 0.25
    precision: "integer cents, ROUND_HALF_UP; the concessionaire share is the exact residual so authority + concessionaire == gross_gain_cents with no drift"

  - name: lifecycle_reserve_balance
    trigger: "on every LifecycleReserveTransaction append — POST /ppp/concessions/{id}/reserve-transactions, POST /ppp/reserve-transactions/{id}/reverse, the CONSTRUCTION seed, and the refinancing sweep"
    algorithm: projection
    formula: |
      signed_amount_cents(t) =
          + t.amount_cents                        if t.txn_type IN {CONTRIBUTION, HANDBACK_TOPUP}
          - t.amount_cents                        if t.txn_type == WITHDRAWAL
          - signed_amount_cents(t.reverses_txn_id) if t.txn_type == REVERSAL

      # Replay in sequence_no order (1-based per concession); never by id.
      resulting_balance_cents(t) = sum of signed_amount_cents over the concession's
                                   transactions with sequence_no <= t.sequence_no
      Concession.lifecycle_reserve_balance_cents = resulting_balance_cents(latest sequence_no)

      # A REVERSAL negates whatever the reversed row contributed, so reversing a WITHDRAWAL
      # ADDS money back and reversing a CONTRIBUTION removes it. Because the amount comes
      # from the reversed row, REVERSAL requests ignore any amount_cents in the body.
      # Fixture: +8000000 (seed), -3000000 (WITHDRAWAL), reverse the WITHDRAWAL (+3000000)
      #          -> resulting balances 8000000, 5000000, 8000000
      # A row may be reversed at most once (ERR_TRANSACTION_ALREADY_REVERSED) and a REVERSAL
      # may not itself be reversed (ERR_CANNOT_REVERSE_REVERSAL).
    input_set: "every LifecycleReserveTransaction row of the concession — the ledger is append-only, so no row is ever excluded or edited"
    constants:
      REPLAY_ORDER: "sequence_no ASC (created_at ASC is the documented fallback); never id"
    precision: "exact integers; no rounding exists anywhere in the ledger"

  - name: termination_compensation
    trigger: "on POST /ppp/enforcement-actions/{id}/calculate-compensation"
    algorithm: aggregation
    formula: |
      elapsed_operational_months = floor(
          (termination_date - Concession.actual_service_commencement) in whole days / 30)
      accrued_equity_return_cents = round_half_up(
          Decimal(Concession.equity_drawn_cents)
          * Decimal(Concession.base_case_equity_irr_bps) / Decimal(10000)
          * Decimal(elapsed_operational_months) / Decimal(12), 0)
      unpaid_invoiced_cents  = sum of net_payment_cents over ServicePeriod rows of the
                               concession with payment_status == INVOICED
      deduction_offset_cents = sum of allowed_amount_cents over DeductionEvent rows of the
                               concession with status IN {ISSUED, DISPUTED}

      # variant selected by EnforcementAction.trigger_reason — see `variants` below
      compensation_cents = <variant formula>, clamped at 0

      # Shared fixture: equity_drawn 100000000, base_case_equity_irr_bps 1200,
      #   actual_service_commencement 2027-01-21, termination_date 2028-01-21 (365 days)
      #   -> elapsed_operational_months = floor(365/30) = 12
      #   -> accrued_equity_return_cents = 100000000 * 0.12 * 12/12 = 12000000
      #   outstanding_senior_debt 180000000, unpaid_invoiced 0, deduction_offset 1720833,
      #   market_value_estimate 210000000, rectification 15000000, reprocurement 8000000
    input_set: "the EnforcementAction row, its Concession, the concession's INVOICED ServicePeriods, and the concession's DeductionEvents with status IN {ISSUED, DISPUTED}"
    constants:
      MONTH_BASIS_DAYS: 30
      BPS_DIVISOR: 10000
      AUTHORITY_DEFAULT_UPLIFT_PCT: 0.10
      COMPENSATION_FLOOR_CENTS: 0
    precision: "integer cents, ROUND_HALF_UP; the accrued equity return is the only rounded term and it is rounded exactly once"
    variants:
      - name: AUTHORITY_VOLUNTARY
        when: "EnforcementAction.trigger_reason == AUTHORITY_VOLUNTARY"
        difference: |
          Full make-whole: debt + equity + accrued return + unpaid invoices, less the
          outstanding deduction offset.
            outstanding_senior_debt + equity_drawn + accrued_equity_return
              + unpaid_invoiced - deduction_offset
          Fixture -> 180000000 + 100000000 + 12000000 + 0 - 1720833 = 290279167
      - name: CONCESSIONAIRE_DEFAULT
        when: "EnforcementAction.trigger_reason == CONCESSIONAIRE_DEFAULT"
        difference: |
          Market-value basis — the debt, equity and accrued-return terms drop out entirely
          and three cost terms the other variants never read come in.
            market_value_estimate - rectification_cost
              - authority_reprocurement_cost - deduction_offset
          Fixture -> 210000000 - 15000000 - 8000000 - 1720833 = 185279167
      - name: AUTHORITY_DEFAULT
        when: "EnforcementAction.trigger_reason == AUTHORITY_DEFAULT"
        difference: |
          AUTHORITY_VOLUNTARY plus a 10% uplift on drawn equity, AND the deduction offset is
          dropped — the authority cannot net its own deductions off its own default.
            outstanding_senior_debt + equity_drawn + accrued_equity_return
              + round_half_up(equity_drawn * AUTHORITY_DEFAULT_UPLIFT_PCT)
              + unpaid_invoiced
          Fixture -> 180000000 + 100000000 + 12000000 + 10000000 + 0 = 302000000
      - name: FORCE_MAJEURE
        when: "EnforcementAction.trigger_reason == FORCE_MAJEURE"
        difference: |
          Debt and equity are returned but no equity RETURN is accrued — nobody is at fault,
          so the sponsor recovers capital without profit. The deduction offset still applies.
            outstanding_senior_debt + equity_drawn + unpaid_invoiced - deduction_offset
          Fixture -> 180000000 + 100000000 + 0 - 1720833 = 278279167

  - name: contractual_time_windows
    trigger: "evaluated on every time-gated write — relief-claim notification, dispute resubmission, step-in cure and step-in escalation"
    algorithm: threshold
    formula: |
      # 1. Relief notification window (inclusive at the boundary)
      days_since_event_start = calendar_days_between(claim.event_start, logical_clock)
      notification_ok = days_since_event_start <= RELIEF_NOTIFICATION_WINDOW_DAYS
      #    clock exactly RELIEF_NOTIFICATION_WINDOW_DAYS after event_start -> ACCEPTED
      #    clock one day later                                            -> ERR_RELIEF_NOTIFICATION_LATE
      #    a clock BEFORE event_start yields a negative span, treated as 0 -> ACCEPTED

      # 2. Relief window buffering (closed interval expanded on BOTH sides)
      buffered(claim) = [claim.event_start - RELIEF_CLAIM_BUFFER_DAYS,
                         claim.event_end   + RELIEF_CLAIM_BUFFER_DAYS]   # still CLOSED
      conflict = buffered(new) intersects buffered(existing) for some live claim of the
                 SAME claim_type
      #    two claims of the same type need a clear gap of more than
      #    2 * RELIEF_CLAIM_BUFFER_DAYS calendar days between event_end and event_start:
      #    A = [2027-02-01, 2027-02-10] -> buffered [2027-01-29, 2027-02-13]
      #      B = [2027-02-16, 2027-02-20] (gap 5) -> buffered [2027-02-13, 2027-02-23] -> CONFLICT
      #      C = [2027-02-17, 2027-02-21] (gap 6) -> buffered [2027-02-14, 2027-02-24] -> CLEAR
      #    claims of a DIFFERENT claim_type never conflict with each other.

      # 3. Step-in cure window (asymmetric comparison on the same instant)
      cure_deadline = effective_date + CURE_PERIOD_DAYS calendar days
      cure_allowed     = logical_clock <= cure_deadline     # inclusive
      escalate_allowed = logical_clock >  cure_deadline     # strict
      #    the two predicates partition the timeline with no gap and no overlap

      # 4. Dispute round budget
      resubmit_allowed = (dispute.round_no + 1) <= DISPUTE_MAX_ROUNDS
      #    round_no starts at 1 on RAISED and only `resubmit` increments it; `refer-back`
      #    never does, so the referral cycle admits exactly DISPUTE_MAX_ROUNDS submissions

      # 5. Relief-day annual budget
      granted_so_far = sum of granted_relief_days over the concession's claims with
                       status IN {GRANTED, PARTIALLY_GRANTED}
      grant_allowed = (granted_so_far + request.granted_relief_days) <= RELIEF_DAYS_ANNUAL_CAP
    input_set: "the row under test plus, for the buffer and budget rules, the concession's other ReliefClaim rows with status IN {NOTIFIED, GRANTED, PARTIALLY_GRANTED}"
    constants:
      RELIEF_NOTIFICATION_WINDOW_DAYS: 20
      RELIEF_CLAIM_BUFFER_DAYS: 3
      RELIEF_DAYS_ANNUAL_CAP: 60
      CURE_PERIOD_DAYS: 90
      DISPUTE_MAX_ROUNDS: 3
    precision: "whole calendar days on the logical clock; no partial days and no wall-clock reads"

  - name: reserve_ledger_conservation
    trigger: "invariant — asserted after every LifecycleReserveTransaction append and after every reversal"
    algorithm: aggregation
    formula: |
      Concession.lifecycle_reserve_balance_cents
        == sum(signed_amount_cents) over all LifecycleReserveTransaction rows of the concession
        == resulting_balance_cents of the row with the highest sequence_no
      AND for every row t:  t.resulting_balance_cents
                              == sum(signed_amount_cents of rows with sequence_no <= t.sequence_no)
      # Holds through the compensating pair (WITHDRAWAL then its REVERSAL): the ledger grows
      # by two rows, the balance returns to its pre-withdrawal value, and no row is mutated.
    input_set: "all LifecycleReserveTransaction rows of the concession, no state filter"
    constants: {}
    precision: "exact integers; any drift is a defect, not a rounding artefact"

  - name: period_payment_conservation
    trigger: "invariant — asserted after verify, after every deduction-event append/withdrawal, after every dispute adjudication, and after every compensation-event grant"
    algorithm: aggregation
    formula: |
      ServicePeriod.total_deduction_cents
        == sum(allowed_amount_cents) over its DeductionEvents with status IN {ISSUED, DISPUTED}
      AND ServicePeriod.total_deduction_cents <= ServicePeriod.deduction_cap_cents
      AND sum(pro_rata_amount_cents) over the same input set
            == min(sum(raw_amount_cents), deduction_cap_cents)
      AND ServicePeriod.net_payment_cents
            == gross_unitary_charge_cents
               - max(0, total_deduction_cents - relief_credit_cents)
      AND 0 <= net_payment_cents <= gross_unitary_charge_cents
      # Holds through the compensating pair (issue an event, then withdraw it): both variant
      # totals and net_payment_cents return to their pre-issue values exactly.
    input_set: "the ServicePeriod row and its DeductionEvents with status IN {ISSUED, DISPUTED}"
    constants: {}
    precision: "exact integers"

  - name: drawdown_funding_conservation
    trigger: "invariant — asserted after every POST /ppp/drawdown-milestones/{id}/disburse"
    algorithm: aggregation
    formula: |
      Concession.equity_drawn_cents
        == sum(equity_portion_cents) over its DISBURSED DrawdownMilestones
      AND Concession.senior_debt_drawn_cents
        == sum(debt_portion_cents) over its DISBURSED DrawdownMilestones
      AND equity_drawn_cents + senior_debt_drawn_cents
        == sum(certified_cost_cents) over its DISBURSED DrawdownMilestones
      AND equity_drawn_cents <= equity_committed_cents
      AND senior_debt_drawn_cents <= senior_debt_committed_cents
      AND Concession.cumulative_drawn_pct == round_half_up(
            Decimal(equity_drawn_cents + senior_debt_drawn_cents)
            / Decimal(total_project_cost_cents), 4)
      # REQUESTED, APPROVED and REJECTED milestones contribute nothing; only DISBURSED does.
    input_set: "DrawdownMilestone rows of the concession with status == DISBURSED"
    constants: {}
    precision: "exact integers on the money terms; cumulative_drawn_pct to 4 dp ROUND_HALF_UP"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated in ascending `priority`; first violation wins)
# -----------------------------------------------------------------------------
# Domain ordering rationale: this is a regulated infrastructure concession, so the
# ladder runs auth -> authorization -> ownership -> existence -> schema -> optimistic
# concurrency -> state -> segregation of duties -> enforcement safety -> referential
# integrity -> temporal windows -> interval validity -> overlap -> uniqueness ->
# fiscal caps. Fiscal caps are LAST: the authority would rather tell a concessionaire
# "you are not the party to this concession" or "this project is under step-in" than
# "your deduction exceeds the annual cap", because the latter leaks the project's
# financial position to a party that had no standing to ask.
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 10
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's declared `roles:` list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 15
    category: auth
    check: "when X-User-Role == Concessionaire, X-User-ID equals the concessionaire_id of the Concession that owns the path resource (resolved transitively: ServicePeriod -> Concession, DeductionEvent -> ServicePeriod -> Concession, DeductionDispute -> DeductionEvent -> ServicePeriod -> Concession, DrawdownMilestone/ReliefClaim/RefinancingEvent/EnforcementAction/LifecycleReserveTransaction -> Concession)"
    error_id: ERR_NOT_CONCESSION_PARTY
    http_status: 403
    applies_to: "every endpoint whose `roles:` includes Concessionaire and whose path names a concession-owned resource"

  - priority: 20
    category: existence
    check: "each id in the path resolves to a live row, validated left-to-right: Concession -> ERR_CONCESSION_NOT_FOUND, Concessionaire -> ERR_CONCESSIONAIRE_NOT_FOUND, ServicePeriod -> ERR_SERVICE_PERIOD_NOT_FOUND, DrawdownMilestone -> ERR_DRAWDOWN_MILESTONE_NOT_FOUND, DeductionEvent -> ERR_DEDUCTION_EVENT_NOT_FOUND, DeductionDispute -> ERR_DEDUCTION_DISPUTE_NOT_FOUND, ReliefClaim -> ERR_RELIEF_CLAIM_NOT_FOUND, RefinancingEvent -> ERR_REFINANCING_EVENT_NOT_FOUND, LifecycleReserveTransaction -> ERR_RESERVE_TRANSACTION_NOT_FOUND, EnforcementAction -> ERR_ENFORCEMENT_ACTION_NOT_FOUND, PerformanceReport -> ERR_PERFORMANCE_REPORT_NOT_FOUND"
    error_id: ERR_CONCESSION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 25
    category: business_referential
    check: "ids supplied in the request BODY resolve to live rows — concessionaire_id on POST /ppp/concessions, performance_report_id on POST /ppp/service-periods/{id}/deduction-events, reverses_txn_id on POST /ppp/reserve-transactions/{id}/reverse"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /ppp/concessions, POST /ppp/service-periods/{id}/deduction-events, POST /ppp/reserve-transactions/{id}/reverse"

  - priority: 30
    category: business_constraint
    check: "request body conforms to the endpoint's declared `input:` schema — every required field present, every enum value in range, every *_cents field a non-negative integer, every *_pct a Decimal in [0, 1], every date an ISO-8601 date, every *_bps a non-negative integer"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 35
    category: state
    check: "when the endpoint declares an OCC field (see §1.2.1), the supplied expected_<parent>_version equals the parent's current `version`"
    error_id: ERR_STALE_CONCESSION_VERSION
    http_status: 412
    applies_to: "POST /ppp/concessions/{id}/drawdown-milestones and POST /ppp/refinancing-events/{id}/consent (ERR_STALE_CONCESSION_VERSION); POST /ppp/service-periods/{id}/performance-reports (ERR_STALE_SERVICE_PERIOD_VERSION)"

  - priority: 40
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2 — e.g. financial-close requires Concession.status == DRAFTED, approve requires DrawdownMilestone.status == REQUESTED, verify requires ServicePeriod.reporting_status == SELF_REPORTED, adjudicate requires DeductionDispute.status IN {RAISED, RESUBMITTED}, determine requires ReliefClaim.status == NOTIFIED, consent requires RefinancingEvent.status == PROPOSED, settle requires EnforcementAction.status == COMPENSATION_CALCULATED"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 42
    category: state
    check: "the owning Concession is in a state that admits the operation — service periods and deduction events require Concession.status IN {OPERATIONS, STEP_IN}; drawdown milestones require Concession.status IN {FINANCIAL_CLOSE, CONSTRUCTION}; certify-service-commencement requires CONSTRUCTION; handback-survey requires OPERATIONS; refinancing proposal and consent require OPERATIONS"
    error_id: ERR_CONCESSION_STATE_FORBIDS_OPERATION
    http_status: 409
    applies_to: "POST /ppp/concessions/{id}/service-periods, POST /ppp/service-periods/{id}/deduction-events, POST /ppp/concessions/{id}/drawdown-milestones, POST /ppp/concessions/{id}/certify-service-commencement, POST /ppp/concessions/{id}/handback-survey, POST /ppp/concessions/{id}/refinancing-events, POST /ppp/refinancing-events/{id}/consent"

  - priority: 45
    category: business_safety
    check: "segregation of duties on X-User-ID — the AuthorityOfficer verifying a ServicePeriod must not be the officer who issued any DeductionEvent already attached to it; the officer adjudicating a DeductionDispute must not be the DeductionEvent.issued_by_user_id; the officer consenting to a RefinancingEvent must not be its proposed_by_user_id (reachable because AuthorityOfficer is one of the two roles permitted to propose); the officer settling an EnforcementAction must not be its calculated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ppp/service-periods/{id}/verify, POST /ppp/deduction-disputes/{id}/adjudicate, POST /ppp/refinancing-events/{id}/consent, POST /ppp/enforcement-actions/{id}/settle"

  - priority: 48
    category: business_safety
    check: "no EnforcementAction of the owning Concession has status IN {NOTIFIED, STEP_IN_ACTIVE, COMPENSATION_CALCULATED} — an open enforcement freezes new commercial writes on the project"
    error_id: ERR_CONCESSION_UNDER_ENFORCEMENT
    http_status: 409
    applies_to: "POST /ppp/concessions/{id}/refinancing-events, POST /ppp/refinancing-events/{id}/consent, POST /ppp/concessions/{id}/drawdown-milestones, POST /ppp/drawdown-milestones/{id}/disburse, POST /ppp/concessions/{id}/handback-survey"

  - priority: 50
    category: business_safety
    check: "a LifecycleReserveTransaction of txn_type == WITHDRAWAL may not drive lifecycle_reserve_balance_cents below zero, and a WITHDRAWAL is forbidden once Concession.handback_status IN {CERTIFIED, FAILED} (that is, once the handback survey has been recorded)"
    error_id: ERR_RESERVE_WITHDRAWAL_FORBIDDEN
    http_status: 409
    applies_to: "POST /ppp/concessions/{id}/reserve-transactions"

  - priority: 52
    category: business_referential
    check: "cross-entity referential coherence — a DeductionEvent's performance_report_id, when supplied, must belong to the same ServicePeriod named in the path; a REVERSAL target must belong to the concession named in the path, must not already be reversed, and must not itself be a REVERSAL; a DeductionDispute may only be raised on a DeductionEvent whose ServicePeriod.reporting_status == VERIFIED"
    error_id: ERR_CROSS_ENTITY_MISMATCH
    http_status: 409
    applies_to: "POST /ppp/service-periods/{id}/deduction-events, POST /ppp/reserve-transactions/{id}/reverse, POST /ppp/deduction-events/{id}/disputes"

  - priority: 55
    category: business_temporal
    check: "a ReliefClaim must be notified within RELIEF_NOTIFICATION_WINDOW_DAYS (20) calendar days of its event_start, measured against the logical clock at the moment of the POST"
    error_id: ERR_RELIEF_NOTIFICATION_LATE
    http_status: 422
    applies_to: "POST /ppp/concessions/{id}/relief-claims"

  - priority: 56
    category: business_temporal
    check: "an EnforcementAction of action_type == STEP_IN may only be cured while the logical clock is <= cure_deadline, and may only be escalated once the logical clock is > cure_deadline"
    error_id: ERR_CURE_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST /ppp/enforcement-actions/{id}/cure, POST /ppp/enforcement-actions/{id}/escalate"

  - priority: 58
    category: business_temporal
    check: "interval validity — ServicePeriod requires period_start < period_end and days_in_period == the whole-day span of the half-open interval [period_start, period_end); ReliefClaim requires event_start <= event_end on the closed interval [event_start, event_end]; certify-service-commencement requires actual_service_commencement >= Concession.financial_close_date; calculate-compensation requires termination_date >= Concession.actual_service_commencement"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /ppp/concessions/{id}/service-periods, POST /ppp/concessions/{id}/relief-claims, POST /ppp/concessions/{id}/certify-service-commencement, POST /ppp/enforcement-actions/{id}/calculate-compensation"

  - priority: 62
    category: business_constraint
    check: "temporal overlap — a new ServicePeriod's half-open interval [period_start, period_end) must not intersect any existing ServicePeriod of the same Concession. Adjacency is explicitly ALLOWED: a period starting exactly at the prior period's period_end does not intersect it."
    error_id: ERR_SERVICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /ppp/concessions/{id}/service-periods"

  - priority: 63
    category: business_constraint
    check: "temporal overlap with buffer — a new ReliefClaim's closed window [event_start, event_end], expanded by RELIEF_CLAIM_BUFFER_DAYS (3) on each side, must not intersect the closed window of any existing ReliefClaim of the same Concession with the same claim_type and status IN {NOTIFIED, GRANTED, PARTIALLY_GRANTED}. Because the interval is CLOSED and buffered, back-to-back claims are rejected even with a 3-day gap; a 4-day gap is accepted. REJECTED claims free their window."
    error_id: ERR_RELIEF_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /ppp/concessions/{id}/relief-claims"

  - priority: 65
    category: business_constraint
    check: "uniqueness and round limits — period_index must be unique per Concession (ERR_DUPLICATE_PERIOD_INDEX); at most one PerformanceReport per ServicePeriod may hold status == SUBMITTED (a new submission supersedes the incumbent rather than colliding); at most one DeductionDispute per DeductionEvent may be open, i.e. in status IN {RAISED, REFERRED_BACK, RESUBMITTED} (ERR_DISPUTE_ALREADY_OPEN), and neither a refer-back nor a resubmit may act on a dispute whose round_no has already reached DISPUTE_MAX_ROUNDS (3), so the referral cycle admits exactly three submissions and must then be closed by adjudication (ERR_DISPUTE_ROUNDS_EXHAUSTED); at most one un-reversed REVERSAL per target row"
    error_id: ERR_DUPLICATE_PERIOD_INDEX
    http_status: 409
    applies_to: "POST /ppp/concessions/{id}/service-periods, POST /ppp/deduction-events/{id}/disputes, POST /ppp/deduction-disputes/{id}/refer-back, POST /ppp/deduction-disputes/{id}/resubmit"

  - priority: 68
    category: business_fiscal
    check: "commitment ceilings — a DrawdownMilestone's certified_cost_cents, added to the concession's drawn totals under drawdown_split, must not push equity_drawn_cents past equity_committed_cents nor senior_debt_drawn_cents past senior_debt_committed_cents; and a Concession's total_project_cost_cents must be less than or equal to senior_debt_committed_cents + equity_committed_cents at creation"
    error_id: ERR_COMMITMENT_EXCEEDED
    http_status: 422
    applies_to: "POST /ppp/drawdown-milestones/{id}/approve, POST /ppp/concessions"

  - priority: 70
    category: business_fiscal
    check: "annual deduction cap — the projected availability_deduction_ytd_cents after verifying this period must not strictly exceed round_half_up(masp_cents * ANNUAL_DEDUCTION_CAP_PCT); landing exactly on the cap is permitted"
    error_id: ERR_ANNUAL_DEDUCTION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /ppp/service-periods/{id}/verify and POST /ppp/service-periods/{id}/deduction-events (a deduction issued after verification re-enters the same gate)"

  - priority: 72
    category: business_fiscal
    check: "relief-day annual cap — the sum of granted_relief_days over the concession's GRANTED and PARTIALLY_GRANTED claims, plus the days being granted now, must not exceed RELIEF_DAYS_ANNUAL_CAP (60)"
    error_id: ERR_RELIEF_DAYS_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /ppp/relief-claims/{id}/determine"

  - priority: 74
    category: business_fiscal
    check: "a determination may not grant more than was claimed — granted_relief_days <= claimed_relief_days AND granted_cost_cents <= claimed_cost_cents"
    error_id: ERR_GRANT_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /ppp/relief-claims/{id}/determine"

  - priority: 76
    category: business_fiscal
    check: "a refinancing proposal must show a strictly positive gross_gain_cents under refinancing_gain_share, and its new_senior_debt_cents must be strictly greater than its outstanding_senior_debt_cents"
    error_id: ERR_NO_REFINANCING_GAIN
    http_status: 422
    applies_to: "POST /ppp/concessions/{id}/refinancing-events"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
# Surface shape: FLAT. Every entity is addressable at `/ppp/<collection>/{id}` for the
# scalar read and at `/ppp/<collection>` for a filtered list that accepts each of the
# entity's FK fields as an optional query input — that is the reverse-reachability
# channel for cascade-created rows (the SELF_REPORT_UNDERSTATEMENT DeductionEvent, the
# CONSTRUCTION_SEED and REFINANCING_GAIN_SWEEP reserve entries, and the TERMINATION
# EnforcementAction appended by an escalate) which no creation response ever returns.
# Creation is nested under the owning parent (`POST /ppp/concessions/{id}/service-periods`)
# so the parent context is unambiguous; every subsequent write is a flat action endpoint.
# All list endpoints accept `limit?` / `offset?` and return the paginated envelope of §1.0.
# -----------------------------------------------------------------------------
endpoints:

  # --- reads: Concessionaire ---------------------------------------------------
  - method: GET
    path: "/ppp/concessionaires/{id}"
    description: "Read one concessionaire (sponsor vehicle)."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent, IndependentCertifier]
    code: 200
    input: []
    output: Concessionaire
    side_effects: []

  - method: GET
    path: "/ppp/concessionaires"
    description: "List concessionaires."
    roles: [PlatformAdmin, AuthorityOfficer, LenderAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Concessionaire[]
    side_effects: []

  # --- reads: Concession ------------------------------------------------------
  - method: GET
    path: "/ppp/concessions/{id}"
    description: "Read one concession including every derived financial and performance field."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent, IndependentCertifier]
    code: 200
    input: []
    output: Concession
    side_effects: []

  - method: GET
    path: "/ppp/concessions"
    description: "List concessions, optionally narrowed to one sponsor. Reverse-reachability channel for Concession.concessionaire_id."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent]
    code: 200
    input: ["concessionaire_id?", "status?", "handback_status?", "limit?", "offset?"]
    output: Concession[]
    side_effects: []

  - method: GET
    path: "/ppp/concessions/{id}/payment-summary"
    description: "Computed read. Returns the concession's payment position: monthly_unitary_charge_cents, availability_deduction_ytd_cents, annual_cap_cents, deduction_points_ytd, persistent_breach_flag, lifecycle_reserve_balance_cents, sequential_total_cents and pro_rata_total_cents (the audit shadow of the PRO_RATA_CAP variant summed over every VERIFIED period), and unpaid_invoiced_cents. Derived only — no row is written."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent]
    code: 200
    input: []
    output: PaymentSummary
    side_effects: []

  # --- reads: DrawdownMilestone ------------------------------------------------
  - method: GET
    path: "/ppp/drawdown-milestones/{id}"
    description: "Read one drawdown milestone including its equity/debt split."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent, IndependentCertifier]
    code: 200
    input: []
    output: DrawdownMilestone
    side_effects: []

  - method: GET
    path: "/ppp/drawdown-milestones"
    description: "List drawdown milestones in sequence_no order. Reverse-reachability channel for DrawdownMilestone.concession_id."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent, IndependentCertifier]
    code: 200
    input: ["concession_id?", "status?", "limit?", "offset?"]
    output: DrawdownMilestone[]
    side_effects: []

  # --- reads: ServicePeriod ----------------------------------------------------
  - method: GET
    path: "/ppp/service-periods/{id}"
    description: "Read one service period on both axes, with every money field."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent, IndependentCertifier]
    code: 200
    input: []
    output: ServicePeriod
    side_effects: []

  - method: GET
    path: "/ppp/service-periods"
    description: "List service periods in period_index order. Reverse-reachability channel for ServicePeriod.concession_id."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent, IndependentCertifier]
    code: 200
    input: ["concession_id?", "reporting_status?", "payment_status?", "limit?", "offset?"]
    output: ServicePeriod[]
    side_effects: []

  # --- reads: PerformanceReport ------------------------------------------------
  - method: GET
    path: "/ppp/performance-reports/{id}"
    description: "Read one self-reported performance return including its verified variance_pct."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, IndependentCertifier]
    code: 200
    input: []
    output: PerformanceReport
    side_effects: []

  - method: GET
    path: "/ppp/performance-reports"
    description: "List performance reports. Reverse-reachability channel for PerformanceReport.service_period_id; the only way to see the SUPERSEDED history of a period."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, IndependentCertifier]
    code: 200
    input: ["service_period_id?", "status?", "limit?", "offset?"]
    output: PerformanceReport[]
    side_effects: []

  # --- reads: DeductionEvent ---------------------------------------------------
  - method: GET
    path: "/ppp/deduction-events/{id}"
    description: "Read one deduction event, exposing both allowed_amount_cents (SEQUENTIAL_CAP) and pro_rata_amount_cents (PRO_RATA_CAP)."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent]
    code: 200
    input: []
    output: DeductionEvent
    side_effects: []

  - method: GET
    path: "/ppp/deduction-events"
    description: "List deduction events in sequence_no order. Reverse-reachability channel for both DeductionEvent.service_period_id and DeductionEvent.performance_report_id, and the only discovery channel for the SELF_REPORT_UNDERSTATEMENT and HANDBACK_SHORTFALL events the cascades create."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent]
    code: 200
    input: ["service_period_id?", "performance_report_id?", "deduction_type?", "status?", "limit?", "offset?"]
    output: DeductionEvent[]
    side_effects: []

  # --- reads: DeductionDispute -------------------------------------------------
  - method: GET
    path: "/ppp/deduction-disputes/{id}"
    description: "Read one deduction dispute including its round_no."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire]
    code: 200
    input: []
    output: DeductionDispute
    side_effects: []

  - method: GET
    path: "/ppp/deduction-disputes"
    description: "List deduction disputes. Reverse-reachability channel for DeductionDispute.deduction_event_id."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire]
    code: 200
    input: ["deduction_event_id?", "status?", "limit?", "offset?"]
    output: DeductionDispute[]
    side_effects: []

  # --- reads: ReliefClaim ------------------------------------------------------
  - method: GET
    path: "/ppp/relief-claims/{id}"
    description: "Read one relief, compensation or change-in-law claim."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, IndependentCertifier]
    code: 200
    input: []
    output: ReliefClaim
    side_effects: []

  - method: GET
    path: "/ppp/relief-claims"
    description: "List claims. Reverse-reachability channel for ReliefClaim.concession_id."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, IndependentCertifier]
    code: 200
    input: ["concession_id?", "claim_type?", "status?", "limit?", "offset?"]
    output: ReliefClaim[]
    side_effects: []

  # --- reads: LifecycleReserveTransaction --------------------------------------
  - method: GET
    path: "/ppp/reserve-transactions/{id}"
    description: "Read one lifecycle-reserve ledger entry, including its signed_amount_cents and resulting_balance_cents."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent, IndependentCertifier]
    code: 200
    input: []
    output: LifecycleReserveTransaction
    side_effects: []

  - method: GET
    path: "/ppp/reserve-transactions"
    description: "List the append-only lifecycle-reserve ledger in sequence_no order. Reverse-reachability channel for both LifecycleReserveTransaction.concession_id and the self-referential LifecycleReserveTransaction.reverses_txn_id, and the only discovery channel for the CONSTRUCTION_SEED and REFINANCING_GAIN_SWEEP entries the cascades append."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent, IndependentCertifier]
    code: 200
    input: ["concession_id?", "reverses_txn_id?", "txn_type?", "limit?", "offset?"]
    output: LifecycleReserveTransaction[]
    side_effects: []

  # --- reads: RefinancingEvent -------------------------------------------------
  - method: GET
    path: "/ppp/refinancing-events/{id}"
    description: "Read one refinancing event including its tier_pct_applied and the two shares."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent]
    code: 200
    input: []
    output: RefinancingEvent
    side_effects: []

  - method: GET
    path: "/ppp/refinancing-events"
    description: "List refinancing events. Reverse-reachability channel for RefinancingEvent.concession_id."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent]
    code: 200
    input: ["concession_id?", "status?", "limit?", "offset?"]
    output: RefinancingEvent[]
    side_effects: []

  # --- reads: EnforcementAction ------------------------------------------------
  - method: GET
    path: "/ppp/enforcement-actions/{id}"
    description: "Read one step-in or termination action including the full compensation working."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []

  - method: GET
    path: "/ppp/enforcement-actions"
    description: "List enforcement actions. Reverse-reachability channel for both EnforcementAction.concession_id and the self-referential EnforcementAction.escalated_to_action_id, and the only discovery channel for the TERMINATION row an escalate appends."
    roles: [PlatformAdmin, AuthorityOfficer, Concessionaire, LenderAgent]
    code: 200
    input: ["concession_id?", "escalated_to_action_id?", "action_type?", "status?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []

  # --- writes: concession set-up ------------------------------------------------
  - method: POST
    path: "/ppp/concessionaires"
    description: "Register a sponsor vehicle. Starts in status ACTIVE with concessions_count 0."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, sponsor_equity_commitment_cents]
    output: Concessionaire
    side_effects: ["creates the Concessionaire in status ACTIVE with concessions_count 0"]

  - method: POST
    path: "/ppp/concessions"
    description: "Draft a concession agreement. Every performance standard, availability definition and financial-close parameter is fixed here; the concession starts in DRAFTED with no monthly_unitary_charge_cents."
    roles: [PlatformAdmin, AuthorityOfficer]
    code: 201
    input: [concessionaire_id, project_name, masp_cents, indexation_pct, deduction_cap_pct, total_project_cost_cents, senior_debt_committed_cents, equity_committed_cents, base_case_equity_irr_bps, scheduled_service_commencement, ld_daily_rate_cents, ld_cap_cents, lifecycle_reserve_target_cents]
    output: Concession
    side_effects:
      - "creates the Concession in status DRAFTED with handback_status NOT_SURVEYED, every drawn/deduction/reserve running total 0 and persistent_breach_flag false"
      - "increments Concessionaire.concessions_count by 1"
      - "rejects with ERR_COMMITMENT_EXCEEDED (422) when total_project_cost_cents > senior_debt_committed_cents + equity_committed_cents"

  - method: PATCH
    path: "/ppp/concessions/{id}"
    description: "Amend the commercial parameters of a concession. Permitted only while status == DRAFTED, so the amendment can never invalidate a frozen period charge."
    roles: [AuthorityOfficer]
    code: 200
    input: ["masp_cents?", "indexation_pct?", "deduction_cap_pct?", "ld_daily_rate_cents?", "ld_cap_cents?", "lifecycle_reserve_target_cents?"]
    output: Concession
    side_effects:
      - "rejects with ERR_CONCESSION_STATE_FORBIDS_OPERATION (409) unless status == DRAFTED"
      - "monthly_unitary_charge_cents stays null; it is derived at financial close from the amended values"

  - method: POST
    path: "/ppp/concessions/{id}/financial-close"
    description: "Reach financial close. Drives Concession DRAFTED -> FINANCIAL_CLOSE and is the sole producer of monthly_unitary_charge_cents."
    roles: [AuthorityOfficer]
    code: 200
    input: [close_date]
    output: Concession
    side_effects:
      - "financial_close_date := close_date"
      - "monthly_unitary_charge_cents := calculations.monthly_unitary_charge"
      - "Concession.status DRAFTED -> FINANCIAL_CLOSE"

  # --- writes: drawdown ---------------------------------------------------------
  - method: POST
    path: "/ppp/concessions/{id}/drawdown-milestones"
    description: "Request a milestone drawdown against the committed debt and equity. OCC-guarded on the parent concession."
    roles: [Concessionaire]
    code: 201
    input: [milestone_name, requested_amount_cents, expected_concession_version]
    output: DrawdownMilestone
    side_effects:
      - "creates the DrawdownMilestone in status REQUESTED with sequence_no := 1 + the highest existing sequence_no for this concession"
      - "increments Concession.version by 1"
      - "rejects with ERR_STALE_CONCESSION_VERSION (412) when expected_concession_version != Concession.version"

  - method: POST
    path: "/ppp/drawdown-milestones/{id}/approve"
    description: "Certify the milestone's cost and compute its equity/debt split under the equity-first waterfall. Drives REQUESTED -> APPROVED."
    roles: [IndependentCertifier]
    code: 200
    input: [certified_cost_cents]
    output: DrawdownMilestone
    side_effects:
      - "certified_cost_cents recorded; equity_portion_cents and debt_portion_cents := calculations.drawdown_split"
      - "DrawdownMilestone.status REQUESTED -> APPROVED; approved_at := logical clock"
      - "rejects with ERR_COMMITMENT_EXCEEDED (422) when the split would push either drawn total past its commitment"

  - method: POST
    path: "/ppp/drawdown-milestones/{id}/reject"
    description: "Refuse certification of a requested milestone. Drives REQUESTED -> REJECTED; the row never contributes to any drawn total."
    roles: [IndependentCertifier]
    code: 200
    input: [rejection_reason]
    output: DrawdownMilestone
    side_effects:
      - "rejection_reason recorded; DrawdownMilestone.status REQUESTED -> REJECTED"
      - "equity_portion_cents and debt_portion_cents stay 0 and no concession field moves"

  - method: POST
    path: "/ppp/drawdown-milestones/{id}/disburse"
    description: "Disburse an approved milestone. Drives APPROVED -> DISBURSED and is the head of CASCADE B."
    roles: [LenderAgent]
    code: 200
    input: []
    output: DrawdownMilestone
    side_effects:
      - "DrawdownMilestone.status APPROVED -> DISBURSED; disbursed_at := logical clock"
      - "CASCADE B LINK 1: Concession.equity_drawn_cents += equity_portion_cents and Concession.senior_debt_drawn_cents += debt_portion_cents"
      - "CASCADE B LINK 2: Concession.cumulative_drawn_pct recomputed under calculations.construction_trigger_and_seed"
      - "CASCADE B LINK 3: when the recomputed pct >= CONSTRUCTION_START_PCT and status == FINANCIAL_CLOSE, Concession.status -> CONSTRUCTION and a CONSTRUCTION_SEED LifecycleReserveTransaction is appended"
      - "CASCADE B LINK 4: Concession.lifecycle_reserve_balance_cents recomputed from the appended ledger entry"

  - method: POST
    path: "/ppp/concessions/{id}/certify-service-commencement"
    description: "Certify the service commencement date. Drives Concession CONSTRUCTION -> OPERATIONS and accrues liquidated damages for late commencement."
    roles: [IndependentCertifier]
    code: 200
    input: [actual_commencement_date]
    output: Concession
    side_effects:
      - "actual_service_commencement := actual_commencement_date"
      - "ld_accrued_cents := calculations.liquidated_damages_late_commencement"
      - "Concession.status CONSTRUCTION -> OPERATIONS"

  # --- writes: performance monitoring -------------------------------------------
  - method: POST
    path: "/ppp/concessions/{id}/service-periods"
    description: "Open a service period. Freezes the concession's monthly charge and derived deduction cap onto the period so later amendments cannot rewrite history."
    roles: [AuthorityOfficer]
    code: 201
    input: [period_index, period_start, period_end]
    output: ServicePeriod
    side_effects:
      - "creates the ServicePeriod with reporting_status PENDING and payment_status UNBILLED"
      - "days_in_period := whole-day span of the half-open interval [period_start, period_end)"
      - "gross_unitary_charge_cents := Concession.monthly_unitary_charge_cents (frozen copy)"
      - "deduction_cap_cents := round_half_up(gross_unitary_charge_cents * Concession.deduction_cap_pct) (frozen copy)"
      - "rejects with ERR_SERVICE_PERIOD_OVERLAP (409) on intersection with an existing period; adjacency at period_end is allowed"

  - method: POST
    path: "/ppp/service-periods/{id}/performance-reports"
    description: "Self-report performance for a period. OCC-guarded on the parent service period; a second report supersedes the incumbent in place."
    roles: [Concessionaire]
    code: 201
    input: [unavailable_minutes, category_a_failures, category_b_failures, expected_service_period_version]
    output: PerformanceReport
    side_effects:
      - "creates the PerformanceReport in status SUBMITTED with reported_points := calculations.deduction_points_from_counts"
      - "any incumbent SUBMITTED report of the period transitions SUBMITTED -> SUPERSEDED"
      - "ServicePeriod.reporting_status PENDING -> SELF_REPORTED (or the SELF_REPORTED self-loop)"
      - "increments ServicePeriod.version by 1"
      - "rejects with ERR_STALE_SERVICE_PERIOD_VERSION (412) when expected_service_period_version != ServicePeriod.version"

  - method: POST
    path: "/ppp/performance-reports/{id}/reject"
    description: "Reject a submitted performance return. Drives PerformanceReport SUBMITTED -> REJECTED and may revert the period's reporting axis to PENDING."
    roles: [AuthorityOfficer]
    code: 200
    input: [rejection_reason]
    output: PerformanceReport
    side_effects:
      - "rejection_reason recorded; PerformanceReport.status SUBMITTED -> REJECTED"
      - "ServicePeriod.reporting_status reverts SELF_REPORTED -> PENDING when no SUBMITTED report is left on the period"
      - "increments ServicePeriod.version by 1"

  - method: POST
    path: "/ppp/service-periods/{id}/verify"
    description: "Verify a self-reported period against the authority's own counts. Runs the variance check, seals both cap variants, applies relief and settles the net payment."
    roles: [AuthorityOfficer]
    code: 200
    input: [verified_unavailable_minutes, verified_category_a_failures, verified_category_b_failures]
    output: ServicePeriod
    side_effects:
      - "unavailable_minutes_verified and availability_ratio recorded"
      - "the SUBMITTED PerformanceReport transitions SUBMITTED -> VERIFIED with variance_pct := calculations.self_report_variance"
      - "when variance_pct > SELF_REPORT_VARIANCE_TOLERANCE_PCT, one SELF_REPORT_UNDERSTATEMENT DeductionEvent is appended (discoverable only via GET /ppp/deduction-events)"
      - "runs calculations.period_deduction_cap_allocation, then relief_credit_for_period, then service_period_net_payment, in that pinned order"
      - "runs calculations.annual_deduction_cap_check and calculations.persistent_breach_evaluation"
      - "ServicePeriod.reporting_status SELF_REPORTED -> VERIFIED"
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when the acting X-User-ID issued any DeductionEvent already on the period"

  - method: POST
    path: "/ppp/service-periods/{id}/deduction-events"
    description: "Issue a performance or unavailability deduction against a period. Appends to the period's ordered event set and re-runs the whole allocation."
    roles: [AuthorityOfficer]
    code: 201
    input: [deduction_type, points, "performance_report_id?"]
    output: DeductionEvent
    side_effects:
      - "creates the DeductionEvent in status ISSUED with sequence_no := 1 + the highest existing sequence_no on the period and raw_amount_cents := calculations.deduction_event_raw_amount"
      - "re-runs calculations.period_deduction_cap_allocation, relief_credit_for_period and service_period_net_payment in that pinned order"
      - "recomputes Concession.availability_deduction_ytd_cents as the sum of total_deduction_cents over the concession's VERIFIED periods and re-applies calculations.annual_deduction_cap_check to the recomputed total"
      - "re-runs calculations.persistent_breach_evaluation on the concession"

  - method: POST
    path: "/ppp/deduction-events/{id}/withdraw"
    description: "Withdraw a deduction the authority accepts was wrongly issued. Compensating write: the event leaves the allocation input set and every derived figure returns to its pre-issue value."
    roles: [AuthorityOfficer]
    code: 200
    input: [withdrawal_reason]
    output: DeductionEvent
    side_effects:
      - "withdrawal_reason recorded; DeductionEvent.status {ISSUED, DISPUTED} -> WITHDRAWN with allowed_amount_cents := 0 and pro_rata_amount_cents := 0"
      - "any open DeductionDispute on the event is closed to UPHELD"
      - "re-runs calculations.period_deduction_cap_allocation, relief_credit_for_period and service_period_net_payment; a PAID period transitions PAID -> ADJUSTED"
      - "recomputes Concession.availability_deduction_ytd_cents as the sum of total_deduction_cents over the concession's VERIFIED periods"
      - "re-runs calculations.persistent_breach_evaluation on the concession"

  - method: POST
    path: "/ppp/deduction-events/{id}/disputes"
    description: "Raise a deduction dispute. Drives DeductionEvent ISSUED -> DISPUTED and opens the bounded referral cycle."
    roles: [Concessionaire]
    code: 201
    input: [grounds]
    output: DeductionDispute
    side_effects:
      - "creates the DeductionDispute in status RAISED with round_no 1 and raised_by_user_id := the acting X-User-ID"
      - "DeductionEvent.status ISSUED -> DISPUTED; the event stays in the allocation input set, so no money moves yet"
      - "rejects with ERR_CROSS_ENTITY_MISMATCH (409) unless the owning ServicePeriod.reporting_status == VERIFIED"

  - method: POST
    path: "/ppp/deduction-disputes/{id}/refer-back"
    description: "Refer a dispute back for more evidence. Drives {RAISED, RESUBMITTED} -> REFERRED_BACK without incrementing round_no."
    roles: [AuthorityOfficer]
    code: 200
    input: [referred_back_reason]
    output: DeductionDispute
    side_effects:
      - "referred_back_reason recorded; DeductionDispute.status -> REFERRED_BACK"
      - "round_no is unchanged; the DeductionEvent stays DISPUTED"

  - method: POST
    path: "/ppp/deduction-disputes/{id}/resubmit"
    description: "Resubmit a referred-back dispute with new grounds. Drives REFERRED_BACK -> RESUBMITTED and consumes one round."
    roles: [Concessionaire]
    code: 200
    input: [grounds]
    output: DeductionDispute
    side_effects:
      - "grounds replaced; round_no incremented by 1; DeductionDispute.status REFERRED_BACK -> RESUBMITTED"
      - "rejects with ERR_DISPUTE_ROUNDS_EXHAUSTED (409) when round_no would exceed DISPUTE_MAX_ROUNDS"

  - method: POST
    path: "/ppp/deduction-disputes/{id}/adjudicate"
    description: "Adjudicate a dispute. UPHOLD is the head of CASCADE A; REJECT returns the event to ISSUED with no money movement."
    roles: [AuthorityOfficer]
    code: 200
    input: [decision, outcome_note]
    output: DeductionDispute
    side_effects:
      - "adjudicated_by_user_id and adjudicated_at recorded; DeductionDispute.status -> UPHELD or REJECTED"
      - "CASCADE A LINK 1 (UPHOLD): DeductionEvent.status DISPUTED -> OVERTURNED with both allocation figures zeroed"
      - "CASCADE A LINK 2/3 (UPHOLD): the period re-runs the pinned allocation chain and a PAID period transitions PAID -> ADJUSTED"
      - "CASCADE A LINK 4/5 (UPHOLD): persistent_breach_evaluation re-runs and, when the flag flips true -> false, an open PERSISTENT_BREACH step-in cures and the concession returns STEP_IN -> OPERATIONS"
      - "REJECT: DeductionEvent.status DISPUTED -> ISSUED and every money figure is left exactly as it stood"
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when the acting X-User-ID equals the DeductionEvent's issued_by_user_id"

  # --- writes: payment ----------------------------------------------------------
  - method: POST
    path: "/ppp/service-periods/{id}/invoice"
    description: "Invoice the verified net payment for a period. The only cross-axis operation: requires the reporting axis to have reached VERIFIED."
    roles: [Concessionaire]
    code: 200
    input: []
    output: ServicePeriod
    side_effects:
      - "invoiced_at := logical clock; ServicePeriod.payment_status UNBILLED -> INVOICED"
      - "rejects with ERR_INVALID_STATE_TRANSITION (409) when reporting_status != VERIFIED"

  - method: POST
    path: "/ppp/service-periods/{id}/pay"
    description: "Record payment of an invoiced period."
    roles: [AuthorityOfficer]
    code: 200
    input: [payment_reference]
    output: ServicePeriod
    side_effects:
      - "paid_at := logical clock; payment_reference recorded; ServicePeriod.payment_status INVOICED -> PAID"

  # --- writes: relief, compensation and change in law ---------------------------
  - method: POST
    path: "/ppp/concessions/{id}/relief-claims"
    description: "Notify a relief event, compensation event or change-in-law claim. Windows are closed intervals and are buffer-checked against existing claims of the same type."
    roles: [Concessionaire]
    code: 201
    input: [claim_type, event_start, event_end, claimed_relief_days, claimed_cost_cents]
    output: ReliefClaim
    side_effects:
      - "creates the ReliefClaim in status NOTIFIED with notified_at := logical clock and both granted figures 0"
      - "rejects with ERR_RELIEF_NOTIFICATION_LATE (422) when the clock is more than RELIEF_NOTIFICATION_WINDOW_DAYS past event_start"
      - "rejects with ERR_RELIEF_WINDOW_CONFLICT (409) when the RELIEF_CLAIM_BUFFER_DAYS-expanded closed window intersects a live claim of the same claim_type"

  - method: POST
    path: "/ppp/relief-claims/{id}/determine"
    description: "Determine a claim. A granted COMPENSATION_EVENT recomputes every intersecting service period; a granted RELIEF_EVENT feeds the liquidated-damages calculation instead."
    roles: [AuthorityOfficer]
    code: 200
    input: [decision, "granted_relief_days?", "granted_cost_cents?", "determination_note?"]
    output: ReliefClaim
    side_effects:
      - "granted figures, determined_at and determination_note recorded; status -> GRANTED, PARTIALLY_GRANTED or REJECTED"
      - "GRANT of a COMPENSATION_EVENT re-runs relief_credit_for_period then service_period_net_payment on every intersecting ServicePeriod; a PAID period transitions PAID -> ADJUSTED"
      - "rejects with ERR_GRANT_EXCEEDS_CLAIM (422) when either granted figure exceeds its claimed figure"
      - "rejects with ERR_RELIEF_DAYS_CAP_EXCEEDED (422) when the concession's granted relief days would pass RELIEF_DAYS_ANNUAL_CAP"

  # --- writes: lifecycle reserve ------------------------------------------------
  - method: POST
    path: "/ppp/concessions/{id}/reserve-transactions"
    description: "Append a lifecycle-reserve ledger entry. Append-only: the entry is immutable once written and carries no version field."
    roles: [Concessionaire]
    code: 201
    input: [txn_type, amount_cents, reason]
    output: LifecycleReserveTransaction
    side_effects:
      - "creates the entry with sequence_no := 1 + the highest existing sequence_no for this concession, signed_amount_cents and resulting_balance_cents per calculations.lifecycle_reserve_balance"
      - "Concession.lifecycle_reserve_balance_cents := the entry's resulting_balance_cents"
      - "rejects with ERR_RESERVE_WITHDRAWAL_FORBIDDEN (409) when a WITHDRAWAL would drive the balance negative or the concession has already been surveyed for handback"
      - "rejects with ERR_INVALID_REQUEST (400) when txn_type == REVERSAL; reversals go through the dedicated endpoint"

  - method: POST
    path: "/ppp/reserve-transactions/{id}/reverse"
    description: "Append a compensating REVERSAL of an existing ledger entry. The amount is taken from the target row, never from the body."
    roles: [PlatformAdmin]
    code: 201
    input: [reason]
    output: LifecycleReserveTransaction
    side_effects:
      - "creates a new entry with txn_type REVERSAL, reverses_txn_id := the path id, amount_cents copied from the target and signed_amount_cents := -1 * the target's signed_amount_cents"
      - "Concession.lifecycle_reserve_balance_cents := the new entry's resulting_balance_cents, which equals the balance in force before the reversed entry when the reversed entry was the latest"
      - "rejects with ERR_TRANSACTION_ALREADY_REVERSED (409) when the target already has a REVERSAL"
      - "rejects with ERR_CANNOT_REVERSE_REVERSAL (409) when the target's txn_type == REVERSAL"

  # --- writes: handback ---------------------------------------------------------
  - method: POST
    path: "/ppp/concessions/{id}/handback-survey"
    description: "Record the handback condition survey. Sizes the required reserve under the single-pass penalty rule and either certifies handback or fails it with a shortfall deduction."
    roles: [IndependentCertifier]
    code: 200
    input: [handback_survey_date, handback_rectification_cost_cents]
    output: Concession
    side_effects:
      - "handback_survey_date and handback_rectification_cost_cents recorded"
      - "handback_required_reserve_cents and handback_shortfall_cents := calculations.handback_required_reserve (single pass)"
      - "handback_status := CERTIFIED when the shortfall is 0, otherwise FAILED"
      - "FAILED appends a HANDBACK_SHORTFALL DeductionEvent against the concession's most recent VERIFIED ServicePeriod and re-runs that period's pinned allocation chain"

  # --- writes: refinancing ------------------------------------------------------
  - method: POST
    path: "/ppp/concessions/{id}/refinancing-events"
    description: "Propose a refinancing and compute the authority's gain share under the average-rate tier table. Either party may propose."
    roles: [Concessionaire, AuthorityOfficer]
    code: 201
    input: [refinancing_date, new_senior_debt_cents, outstanding_senior_debt_cents, refinancing_cost_cents]
    output: RefinancingEvent
    side_effects:
      - "creates the RefinancingEvent in status PROPOSED with proposed_by_user_id := the acting X-User-ID"
      - "gross_gain_cents, tier_pct_applied, authority_share_cents and concessionaire_share_cents := calculations.refinancing_gain_share; reserve_sweep_cents stays 0 until consent"
      - "rejects with ERR_NO_REFINANCING_GAIN (422) when gross_gain_cents <= 0"

  - method: POST
    path: "/ppp/refinancing-events/{id}/consent"
    description: "Consent to or refuse a proposed refinancing. OCC-guarded on the parent concession; consent is the head of CASCADE D."
    roles: [AuthorityOfficer]
    code: 200
    input: [decision, expected_concession_version]
    output: RefinancingEvent
    side_effects:
      - "consented_by_user_id and consented_at recorded; status -> CONSENTED or REJECTED"
      - "CONSENT: reserve_sweep_cents := round_half_up(concessionaire_share_cents * RESERVE_SWEEP_PCT) and a REFINANCING_GAIN_SWEEP CONTRIBUTION is appended to the lifecycle reserve"
      - "increments Concession.version by 1"
      - "rejects with ERR_STALE_CONCESSION_VERSION (412) when expected_concession_version != Concession.version"
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when the acting X-User-ID equals proposed_by_user_id"

  # --- writes: step-in, termination and compensation -----------------------------
  - method: POST
    path: "/ppp/concessions/{id}/enforcement-actions"
    description: "Notify a step-in or a termination. A STEP_IN row auto-advances to STEP_IN_ACTIVE and moves the concession into STEP_IN in the same request."
    roles: [AuthorityOfficer, LenderAgent]
    code: 201
    input: [action_type, trigger_reason, effective_date]
    output: EnforcementAction
    side_effects:
      - "creates the EnforcementAction in status NOTIFIED with initiated_by_role := the acting X-User-Role"
      - "STEP_IN: cure_deadline := effective_date + CURE_PERIOD_DAYS, status -> STEP_IN_ACTIVE, Concession.status OPERATIONS -> STEP_IN and Concessionaire.status ACTIVE -> STEPPED_IN"
      - "TERMINATION: the row stays NOTIFIED with cure_deadline null and no concession field moves"
      - "rejects with ERR_ENFORCEMENT_GROUND_NOT_ADMITTED (422) when trigger_reason is not admitted for the action_type"

  - method: POST
    path: "/ppp/enforcement-actions/{id}/cure"
    description: "Cure an active step-in inside the cure window. Returns the concession to OPERATIONS."
    roles: [LenderAgent]
    code: 200
    input: [cure_note]
    output: EnforcementAction
    side_effects:
      - "cure_note and cured_at recorded; EnforcementAction.status STEP_IN_ACTIVE -> CURED"
      - "Concession.status STEP_IN -> OPERATIONS and Concessionaire.status STEPPED_IN -> ACTIVE"
      - "rejects with ERR_CURE_WINDOW_VIOLATION (409) when the logical clock is past cure_deadline"

  - method: POST
    path: "/ppp/enforcement-actions/{id}/escalate"
    description: "Escalate a lapsed step-in into a termination. Appends a second EnforcementAction and links it through escalated_to_action_id."
    roles: [LenderAgent]
    code: 200
    input: []
    output: EnforcementAction
    side_effects:
      - "EnforcementAction.status STEP_IN_ACTIVE -> LAPSED"
      - "appends a new EnforcementAction with action_type TERMINATION, trigger_reason CONCESSIONAIRE_DEFAULT and status NOTIFIED (discoverable only via GET /ppp/enforcement-actions)"
      - "escalated_to_action_id := the appended row's id; Concession.status stays STEP_IN"
      - "rejects with ERR_CURE_WINDOW_VIOLATION (409) when the logical clock is still inside the cure window"

  - method: POST
    path: "/ppp/enforcement-actions/{id}/calculate-compensation"
    description: "Calculate termination compensation. The variant is selected by trigger_reason and the four variants read overlapping but non-identical input sets."
    roles: [AuthorityOfficer]
    code: 200
    input: [termination_date, outstanding_senior_debt_cents, "market_value_estimate_cents?", "rectification_cost_cents?", "authority_reprocurement_cost_cents?"]
    output: EnforcementAction
    side_effects:
      - "termination_date and the supplied cost inputs recorded; calculated_by_user_id := the acting X-User-ID"
      - "elapsed_operational_months, accrued_equity_return_cents, unpaid_invoiced_cents, deduction_offset_cents and compensation_cents := calculations.termination_compensation"
      - "EnforcementAction.status NOTIFIED -> COMPENSATION_CALCULATED; no concession field moves yet"
      - "rejects with ERR_INVALID_REQUEST (400) when trigger_reason == CONCESSIONAIRE_DEFAULT and any of the three market-value inputs is absent"

  - method: POST
    path: "/ppp/enforcement-actions/{id}/settle"
    description: "Settle the calculated compensation. Head of CASCADE C: terminates the concession, adjusts its invoiced periods and winds up the sponsor."
    roles: [AuthorityOfficer]
    code: 200
    input: [settlement_reference]
    output: EnforcementAction
    side_effects:
      - "settled_at and settlement_reference recorded; EnforcementAction.status COMPENSATION_CALCULATED -> SETTLED"
      - "CASCADE C LINK 1: Concession.status {OPERATIONS, STEP_IN} -> TERMINATED"
      - "CASCADE C LINK 2: every ServicePeriod of the concession with payment_status == INVOICED transitions INVOICED -> ADJUSTED"
      - "CASCADE C LINK 3: Concessionaire.status -> WOUND_UP"
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when the acting X-User-ID equals calculated_by_user_id"

  # --- test-driving endpoint ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and it never falls back to wall-clock time, so every notification window, cure deadline and accrual span in this scaffold is deterministic before any call to this endpoint."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "every subsequent read of the logical clock returns current_utc until this endpoint is called again"
      - "no business row is created or mutated"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- auth and authorization ---------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_CONCESSION_PARTY
    http: 403
    condition: "a Concessionaire acts on a resource whose owning Concession.concessionaire_id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID attempts both halves of a separated pair: issuing a deduction and verifying its period, issuing a deduction and adjudicating its dispute, proposing a refinancing and consenting to it, or calculating termination compensation and settling it"

  # --- path existence -----------------------------------------------------------
  - id: ERR_CONCESSIONAIRE_NOT_FOUND
    http: 404
    condition: "no Concessionaire row matches the path id"
  - id: ERR_CONCESSION_NOT_FOUND
    http: 404
    condition: "no Concession row matches the path id"
  - id: ERR_DRAWDOWN_MILESTONE_NOT_FOUND
    http: 404
    condition: "no DrawdownMilestone row matches the path id"
  - id: ERR_SERVICE_PERIOD_NOT_FOUND
    http: 404
    condition: "no ServicePeriod row matches the path id"
  - id: ERR_PERFORMANCE_REPORT_NOT_FOUND
    http: 404
    condition: "no PerformanceReport row matches the path id"
  - id: ERR_DEDUCTION_EVENT_NOT_FOUND
    http: 404
    condition: "no DeductionEvent row matches the path id"
  - id: ERR_DEDUCTION_DISPUTE_NOT_FOUND
    http: 404
    condition: "no DeductionDispute row matches the path id"
  - id: ERR_RELIEF_CLAIM_NOT_FOUND
    http: 404
    condition: "no ReliefClaim row matches the path id"
  - id: ERR_RESERVE_TRANSACTION_NOT_FOUND
    http: 404
    condition: "no LifecycleReserveTransaction row matches the path id"
  - id: ERR_REFINANCING_EVENT_NOT_FOUND
    http: 404
    condition: "no RefinancingEvent row matches the path id"
  - id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http: 404
    condition: "no EnforcementAction row matches the path id"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "an id supplied in the request BODY (concessionaire_id, performance_report_id) resolves to no row"

  # --- schema -------------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required input field missing, enum value out of range, negative *_cents, *_pct outside [0, 1], malformed date, txn_type == REVERSAL on the plain reserve-transaction endpoint, or a CONCESSIONAIRE_DEFAULT compensation calculation missing one of its three market-value inputs"

  # --- optimistic concurrency ---------------------------------------------------
  - id: ERR_STALE_CONCESSION_VERSION
    http: 412
    condition: "expected_concession_version does not equal the parent Concession's current version on drawdown-milestone creation or refinancing consent"
  - id: ERR_STALE_SERVICE_PERIOD_VERSION
    http: 412
    condition: "expected_service_period_version does not equal the parent ServicePeriod's current version on performance-report creation"

  # --- state --------------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target row's current state has no transition to the requested state — including invoicing a period whose reporting_status is not VERIFIED, verifying a period with zero or more than one SUBMITTED report, and any write against a terminal state"
  - id: ERR_CONCESSION_STATE_FORBIDS_OPERATION
    http: 409
    condition: "the owning Concession's status does not admit the operation — amending a closed concession, opening a period before OPERATIONS, drawing down after CONSTRUCTION, surveying handback outside OPERATIONS"

  # --- safety -------------------------------------------------------------------
  - id: ERR_CONCESSION_UNDER_ENFORCEMENT
    http: 409
    condition: "an EnforcementAction of the concession is in NOTIFIED, STEP_IN_ACTIVE or COMPENSATION_CALCULATED, which freezes refinancing, drawdown and handback writes"
  - id: ERR_RESERVE_WITHDRAWAL_FORBIDDEN
    http: 409
    condition: "a WITHDRAWAL would drive lifecycle_reserve_balance_cents below zero, or the concession's handback_status has already left NOT_SURVEYED"
  - id: ERR_ENFORCEMENT_GROUND_NOT_ADMITTED
    http: 422
    condition: "trigger_reason is not admitted for the action_type — a STEP_IN on anything other than PERSISTENT_BREACH or LENDER_DEFAULT_CURE, or a TERMINATION on either of those two"

  # --- referential integrity ----------------------------------------------------
  - id: ERR_CROSS_ENTITY_MISMATCH
    http: 409
    condition: "a body-supplied performance_report_id belongs to a different ServicePeriod, a reversal target belongs to a different concession, or a dispute is raised on a deduction whose ServicePeriod has not reached VERIFIED"
  - id: ERR_TRANSACTION_ALREADY_REVERSED
    http: 409
    condition: "the targeted LifecycleReserveTransaction already has a REVERSAL pointing at it"
  - id: ERR_CANNOT_REVERSE_REVERSAL
    http: 409
    condition: "the targeted LifecycleReserveTransaction is itself a REVERSAL"

  # --- temporal -----------------------------------------------------------------
  - id: ERR_RELIEF_NOTIFICATION_LATE
    http: 422
    condition: "the logical clock is more than RELIEF_NOTIFICATION_WINDOW_DAYS calendar days past the claim's event_start"
  - id: ERR_CURE_WINDOW_VIOLATION
    http: 409
    condition: "a cure is attempted after cure_deadline, or an escalation is attempted while the clock is still at or before cure_deadline"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "period_start >= period_end, days_in_period inconsistent with the half-open span, event_start > event_end, an actual commencement before financial close, or a termination_date before actual_service_commencement"

  # --- overlap and uniqueness ---------------------------------------------------
  - id: ERR_SERVICE_PERIOD_OVERLAP
    http: 409
    condition: "the new period's half-open interval intersects an existing period of the same concession; exact adjacency at period_end does NOT trigger this"
  - id: ERR_RELIEF_WINDOW_CONFLICT
    http: 409
    condition: "the new claim's closed window, expanded by RELIEF_CLAIM_BUFFER_DAYS on each side, intersects the closed window of a live claim of the same claim_type"
  - id: ERR_DUPLICATE_PERIOD_INDEX
    http: 409
    condition: "another ServicePeriod of the same Concession already holds this period_index"
  - id: ERR_DISPUTE_ALREADY_OPEN
    http: 409
    condition: "the DeductionEvent already has a DeductionDispute in RAISED, REFERRED_BACK or RESUBMITTED"
  - id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http: 409
    condition: "a resubmission would push round_no past DISPUTE_MAX_ROUNDS"

  # --- fiscal -------------------------------------------------------------------
  - id: ERR_COMMITMENT_EXCEEDED
    http: 422
    condition: "an approved milestone's split would push equity_drawn_cents past equity_committed_cents or senior_debt_drawn_cents past senior_debt_committed_cents, or a concession is drafted with total_project_cost_cents above the sum of its two commitments"
  - id: ERR_ANNUAL_DEDUCTION_CAP_EXCEEDED
    http: 422
    condition: "verifying the period would push availability_deduction_ytd_cents strictly above round_half_up(masp_cents * ANNUAL_DEDUCTION_CAP_PCT); landing exactly on the cap is accepted"
  - id: ERR_RELIEF_DAYS_CAP_EXCEEDED
    http: 422
    condition: "the determination would push the concession's granted relief days above RELIEF_DAYS_ANNUAL_CAP"
  - id: ERR_GRANT_EXCEEDS_CLAIM
    http: 422
    condition: "granted_relief_days > claimed_relief_days or granted_cost_cents > claimed_cost_cents"
  - id: ERR_NO_REFINANCING_GAIN
    http: 422
    condition: "the proposed refinancing yields gross_gain_cents <= 0"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
# -----------------------------------------------------------------------------
# The model is segregation_of_duties layered over peer ownership: the authority side
# (AuthorityOfficer) and the project side (Concessionaire) own disjoint halves of every
# workflow, and within the authority side four operation PAIRS may never be performed by
# the same X-User-ID. IndependentCertifier holds the certification monopoly (milestone
# certification, service commencement, handback survey) precisely so neither commercial
# party can certify its own position. LenderAgent holds the step-in and disbursement
# levers. PlatformAdmin is operational only and holds no commercial authority — it can
# neither verify a period nor consent to a refinancing.
# -----------------------------------------------------------------------------
roles:

  - name: PlatformAdmin
    description: "Registry and ledger-integrity operator. Onboards sponsors, drafts concessions, appends compensating reserve reversals and drives the logical clock. Deliberately excluded from every commercial decision."
    identity: opaque
    exclusive_operations:
      - "POST /ppp/concessionaires"
      - "POST /ppp/reserve-transactions/{id}/reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /ppp/concessions (shared with AuthorityOfficer)"
      - "every GET under /ppp"

  - name: AuthorityOfficer
    description: "Public authority case officer. Closes the deal, opens service periods, verifies self-reported performance, issues and withdraws deductions, adjudicates disputes, determines relief and compensation claims, consents to refinancings, and calculates and settles termination compensation. Four of these operations are separated from each other by X-User-ID."
    identity: opaque
    exclusive_operations:
      - "PATCH /ppp/concessions/{id}"
      - "POST /ppp/concessions/{id}/financial-close"
      - "POST /ppp/concessions/{id}/service-periods"
      - "POST /ppp/performance-reports/{id}/reject"
      - "POST /ppp/service-periods/{id}/verify"
      - "POST /ppp/service-periods/{id}/deduction-events"
      - "POST /ppp/deduction-events/{id}/withdraw"
      - "POST /ppp/deduction-disputes/{id}/refer-back"
      - "POST /ppp/deduction-disputes/{id}/adjudicate"
      - "POST /ppp/service-periods/{id}/pay"
      - "POST /ppp/relief-claims/{id}/determine"
      - "POST /ppp/refinancing-events/{id}/consent"
      - "POST /ppp/enforcement-actions/{id}/calculate-compensation"
      - "POST /ppp/enforcement-actions/{id}/settle"
    shared_operations:
      - "POST /ppp/concessions (shared with PlatformAdmin)"
      - "POST /ppp/concessions/{id}/refinancing-events (shared with Concessionaire)"
      - "POST /ppp/concessions/{id}/enforcement-actions (shared with LenderAgent)"
      - "every GET under /ppp"
    segregation_pairs:
      - "issuing a DeductionEvent on a period and running POST /ppp/service-periods/{id}/verify on that period"
      - "issuing a DeductionEvent and running POST /ppp/deduction-disputes/{id}/adjudicate on its dispute"
      - "proposing a RefinancingEvent and running POST /ppp/refinancing-events/{id}/consent on it"
      - "running calculate-compensation on an EnforcementAction and running settle on the same row"

  - name: Concessionaire
    description: "The project company. Requests drawdowns, self-reports performance, invoices the net availability payment, disputes deductions, notifies relief and compensation claims, funds the lifecycle reserve and may propose a refinancing. Every write is ownership-checked against the concession's concessionaire_id."
    identity: "entity_backed:Concessionaire"
    exclusive_operations:
      - "POST /ppp/concessions/{id}/drawdown-milestones"
      - "POST /ppp/service-periods/{id}/performance-reports"
      - "POST /ppp/service-periods/{id}/invoice"
      - "POST /ppp/deduction-events/{id}/disputes"
      - "POST /ppp/deduction-disputes/{id}/resubmit"
      - "POST /ppp/concessions/{id}/relief-claims"
      - "POST /ppp/concessions/{id}/reserve-transactions"
    shared_operations:
      - "POST /ppp/concessions/{id}/refinancing-events (shared with AuthorityOfficer)"
      - "every GET under /ppp scoped to its own concessions"

  - name: LenderAgent
    description: "Agent for the senior lenders. Controls disbursement of certified milestones and holds the step-in levers — notify, cure and escalate — so the lenders can rescue a defaulting project before the authority terminates it."
    identity: opaque
    exclusive_operations:
      - "POST /ppp/drawdown-milestones/{id}/disburse"
      - "POST /ppp/enforcement-actions/{id}/cure"
      - "POST /ppp/enforcement-actions/{id}/escalate"
    shared_operations:
      - "POST /ppp/concessions/{id}/enforcement-actions (shared with AuthorityOfficer)"
      - "every GET under /ppp"

  - name: IndependentCertifier
    description: "Independent certifier appointed jointly by the parties. Holds the sole power to certify milestone cost, service commencement and handback condition — the three determinations that neither commercial party may make about itself."
    identity: opaque
    exclusive_operations:
      - "POST /ppp/drawdown-milestones/{id}/approve"
      - "POST /ppp/drawdown-milestones/{id}/reject"
      - "POST /ppp/concessions/{id}/certify-service-commencement"
      - "POST /ppp/concessions/{id}/handback-survey"
    shared_operations:
      - "every GET under /ppp"
