              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-MOTOR", oem_code: "WHIRLPOOL", description: "Drive motor", category: "MECHANICAL", list_price_cents: 128000, weight_grams: 9000 }
              as: PricingAdmin
              captures: { part_p4_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
              captures: { inv_a_p1_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p4_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
              captures: { inv_a_p4_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 3, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_1_id: $.data.id }
            - call: "GET /part-orders/${order_id}"
              payload: {}
              as: PlatformAdmin
              captures: { order_v1: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p4_id}", quantity: 1, expected_part_order_version: "${order_v1}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_2_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
          trigger:
            - call: "POST /order-lines/${line_1_id}/cancel"
              payload: { cancellation_reason: "servicer sourced the pump locally" }
              as: Servicer
              as_user_id: "${acct_s_id}"
          assert:
            - "before the trigger: InventoryRecord.${inv_a_p1_id}.on_hand_units == 10, reserved_units == 3, available_units == 7"
            - "OrderLine.${line_1_id}.line_status == CANCELLED"
            - "after the trigger: InventoryRecord.${inv_a_p1_id}.on_hand_units == 10, reserved_units == 0, available_units == 10"
            - "untouched — InventoryRecord.${inv_a_p4_id}.on_hand_units == 10, reserved_units == 1, available_units == 9"
            - "OrderLine.${line_2_id}.line_status == ALLOCATED"
            - "PartOrder.${order_id}.subtotal_cents == 102400 and total_cents == 102400 and fulfillment_status == ALLOCATED"
            - "ServicerAccount.${acct_s_id}.credit_used_cents == 102400"

      - name: catalog_list_price_sum_is_restored_by_a_price_file_rollback
        grounds:
          - state_machines.PriceFile.PUBLISHED_to_ROLLED_BACK
          - endpoints.POST_/price-files/{id}/rollback
          - entities.PriceFileLine.fields.previous_list_price_cents
          - calculations.price_window_reconciliation
        distinguishing_aspect: |
          Conserved quantity #3 is the CATALOG PRICE SUM, a configuration aggregate rather than an
          account balance or a unit count: the two-part catalog sums to 140999, the publish lifts it
          to 145999 by writing P1 to 17999, and the rollback replays previous_list_price_cents to
          return the sum to exactly 140999 with no drift on the untouched part.
        test_recipe:
          setup:
            - "Part P1 W10-PUMP, WHIRLPOOL, MECHANICAL, list 12999, and Part P4 W10-MOTOR, WHIRLPOOL, MECHANICAL, list 128000 — the whole catalog, summing to 140999."
            - "PriceFile F with file_version 2026-08-UP, effective_at 2026-08-01, carrying exactly one line that sets P1 to 17999 and touches nothing else."
            - "The clock stays at its 2026-08-01T00:00:00Z default and no order, substitute request or obsolescence is involved, so the rollback precondition on this file's substitute requests is vacuously satisfied."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-MOTOR", oem_code: "WHIRLPOOL", description: "Drive motor", category: "MECHANICAL", list_price_cents: 128000, weight_grams: 9000 }
              as: PricingAdmin
              captures: { part_p4_id: $.data.id }
            - call: "POST /price-files"
              payload: { file_version: "2026-08-UP", effective_at: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /price-files/${pf_id}/lines"
              payload: { part_id: "${part_p1_id}", new_list_price_cents: 17999 }
              as: PricingAdmin
              captures: { pfl_id: $.data.id }
          trigger:
            - call: "POST /price-files/${pf_id}/publish"
              payload: {}
              as: PricingAdmin
            - call: "POST /price-files/${pf_id}/rollback"
              payload: { rollback_reason: "OEM withdrew the increase" }
              as: PricingAdmin
          assert:
            - "before the trigger: Part.${part_p1_id}.list_price_cents == 12999 and Part.${part_p4_id}.list_price_cents == 128000, catalog sum 140999"
            - "after trigger step 1: PriceFile.${pf_id}.price_file_status == PUBLISHED, Part.${part_p1_id}.list_price_cents == 17999, catalog sum 145999"
            - "PriceFileLine.${pfl_id}.previous_list_price_cents == 12999 and previous_lifecycle_status == ACTIVE"
            - "after trigger step 2: PriceFile.${pf_id}.price_file_status == ROLLED_BACK"
            - "after trigger step 2: Part.${part_p1_id}.list_price_cents == 12999 and Part.${part_p1_id}.lifecycle_status == ACTIVE"
            - "untouched — Part.${part_p4_id}.list_price_cents == 128000"
            - "catalog sum is back to exactly 140999, not 145999 and not 140999 +/- any rounding drift"
