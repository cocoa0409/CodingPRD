        distinguishing_aspect: "state (priority 5) outranks business_fiscal (deposit amount, priority 16): depositing again on an already DEPOSIT_PAID appointment with a wrong amount returns ERR_INVALID_STATE, not ERR_DEPOSIT_AMOUNT_MISMATCH — a different error-category pair (state vs business_fiscal) than the consent/cooling-off pair."
        test_recipe:
