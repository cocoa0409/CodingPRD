  - rule_id: non_linear_state_machine
    instances:
      - name: order_indication_rejection_revision_cycle_returns_to_draft
        grounds:
          - state_machines.TestOrder.DRAFT_to_INDICATION_REJECTED
          - state_machines.TestOrder.INDICATION_REJECTED_to_DRAFT
          - state_machines.TestOrder.DRAFT_to_READY
          - validations[priority=23]
          - endpoints[POST /pft-lab/test-orders/{order_id}/submit]
        distinguishing_aspect: |
          This is the cyclic shape: the order re-enters DRAFT after INDICATION_REJECTED and is submitted a
          second time, so DRAFT is visited twice and the second visit produces a different destination
          (READY) than the first (INDICATION_REJECTED) purely because requested_modalities changed; the
          cycle is exited irreversibly, and a third submit from READY is refused with
          ERR_ORDER_STATE_INVALID rather than looping again.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "ordering physician D-001 exists and patient MRN-7001 is registered"
            - "order ORD-1 is DRAFT with indication_code DYSPNEA_EVALUATION, test_context ROUTINE_CLINICAL, requested_modalities [SPIROMETRY, PLETHYSMOGRAPHY] and current_medication_classes []"
            - "APPROVED_INDICATION_MODALITIES[DYSPNEA_EVALUATION] is [SPIROMETRY, DLCO], so PLETHYSMOGRAPHY is unapproved and the soft gate will park the order"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "D-001", full_name: "Dana Okafor", role_type: "ORDERING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"] }
              as: LabManager
              captures: { doc1_id: $.data.id }
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 175.0, weight_kg: 80.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { pat1_id: $.data.id }
            - call: "POST /pft-lab/test-orders"
              payload: { patient_id: "${pat1_id}", indication_code: "DYSPNEA_EVALUATION", requested_modalities: ["SPIROMETRY", "PLETHYSMOGRAPHY"], test_context: "ROUTINE_CLINICAL", bronchodilator_requested: false, current_medication_classes: [] }
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
              captures: { ord1_id: $.data.id }
          trigger:
            - call: "POST /pft-lab/test-orders/${ord1_id}/submit"
              payload: {}
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
            - call: "PATCH /pft-lab/test-orders/${ord1_id}"
              payload: { requested_modalities: ["SPIROMETRY"] }
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
            - call: "POST /pft-lab/test-orders/${ord1_id}/submit"
              payload: {}
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
            - call: "POST /pft-lab/test-orders/${ord1_id}/submit"
              payload: {}
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
          assert:
            - "the first submit returns HTTP 200, not an error, because the modality-approval gate is a workflow outcome"
            - "after the first submit TestOrder.${ord1_id}.status == INDICATION_REJECTED"
            - "after the first submit TestOrder.${ord1_id}.rejection_reason == MODALITY_NOT_APPROVED_FOR_INDICATION"
            - "after the first submit TestOrder.${ord1_id}.version == 2"
            - "after the PATCH TestOrder.${ord1_id}.status == DRAFT (the cycle closes back onto DRAFT)"
            - "after the PATCH TestOrder.${ord1_id}.rejection_reason == null"
            - "after the PATCH TestOrder.${ord1_id}.requested_modalities == [SPIROMETRY]"
            - "after the PATCH TestOrder.${ord1_id}.version == 3"
            - "after the second submit TestOrder.${ord1_id}.status == READY, because current_medication_classes is empty"
            - "after the second submit TestOrder.${ord1_id}.version == 4"
            - "the third submit returns HTTP 422 with error_id ERR_ORDER_STATE_INVALID"
            - "after the third submit TestOrder.${ord1_id}.status == READY and version == 4, unchanged"
