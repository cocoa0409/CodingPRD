  - section: errors
    instances:
      - name: err_stale_version_on_claim_approve
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[claim-approve-stale-page]"]
        distinguishing_aspect: "OCC: approving a verified claim with an outdated expected_page_version returns 412 ERR_STALE_VERSION; the claimant must re-read the page."
        test_recipe:
          setup: ["Clock 2026-09-01; page P1 created (version v0); user UC files CLAIM, verifies; meanwhile page version advanced by an intervening PATCH... pinned simpler: claim approved attempt uses v0 - 1 stale arithmetic? No — use a genuine stale read: read version, then a no-op-ish mutation? The only page mutation before claim is claim create itself (does not bump page version). So: read version v0, approve with ${v0}-1 expression is forbidden by lint (expressions allowed: ${var} - 1). Use deliberate stale expression."]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
