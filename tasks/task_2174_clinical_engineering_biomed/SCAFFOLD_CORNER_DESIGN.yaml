# =============================================================================
# 1.9 Scaffold Corner Design (breadth probe)
# Sections and claim_type values come from references/claim-extraction-guide.md.
# Bootstrap shorthand used throughout: facility RMC-01 -> department -> device
# model -> device, all created by CEManager at the default clock 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: facility_creation_returns_system_defaults
        claim_type: creation
        grounds:
          - "entities.Facility.fields.ce_posture"
          - "entities.Facility.fields.pm_compliance_pct_strict"
          - "entities.Facility.fields.pm_compliance_pct_operational"
          - "entities.Facility.fields.pm_audit_index"
        distinguishing_aspect: "A facility created with only the three input fields comes back 201 with ce_posture NORMAL, pm_compliance_pct_strict 0.00, pm_compliance_pct_operational 100.00, pm_audit_index 0, open_class_i_recall_count 0, departments_on_hold_count 0 and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Facility.${f_id}.ce_posture == NORMAL"
            - "Facility.${f_id}.pm_compliance_pct_strict == 0.00"
            - "Facility.${f_id}.pm_compliance_pct_operational == 100.00"
            - "Facility.${f_id}.pm_audit_index == 0"
            - "Facility.${f_id}.open_class_i_recall_count == 0"
            - "Facility.${f_id}.departments_on_hold_count == 0"
            - "Facility.${f_id}.version == 1"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: facility_get_returns_stored_entity
        claim_type: retrieval
        grounds:
          - "endpoints.GET /clinical-engineering/facilities/{id}"
        distinguishing_aspect: "GET /facilities/{id} returns exactly the row stored by the create call, with facility_code RMC-01 and pm_compliance_target_pct 90.00 unchanged."
        test_recipe:
          setup: ["One facility."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
          trigger:
            - call: "GET /clinical-engineering/facilities/${f_id}"
              payload: {}
              as: BiomedTech
              as_user_id: "tech-alpha"
          assert:
            - "HTTP status == 200"
            - "Facility.${f_id}.facility_code == RMC-01"
            - "Facility.${f_id}.pm_compliance_target_pct == 90.00"

      - name: devices_list_returns_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints.GET /clinical-engineering/devices"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "GET /devices with limit 1 and offset 0 returns exactly 1 element while total_count reports 2 and has_more is true."
        test_recipe:
          setup: ["One facility, one department, one model and two devices."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000, is_network_connected: false }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-2001", acquisition_date: "2019-03-01", acquisition_cost_cents: 1400000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 4 }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-2002", acquisition_date: "2023-01-10", acquisition_cost_cents: 1450000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 2 }
              as: CEManager
              as_user_id: "ce-mgr-01"
          trigger:
            - call: "GET /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", limit: 1, offset: 0 }
              as: CEManager
              as_user_id: "ce-mgr-01"
          assert:
            - "HTTP status == 200 and response_type == array"
            - "the returned data array has exactly 1 element"
            - "meta/pagination total_count == 2 and has_more == true and limit == 1 and offset == 0"

      - name: device_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_DEVICE_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET /devices/{id} with a well-formed but unknown UUID returns 404 ERR_DEVICE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /clinical-engineering/devices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_DEVICE_NOT_FOUND"

      - name: device_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /devices without maintenance_requirement_code, a required input with no default, returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["One facility, one department and one model."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-BAD", acquisition_date: "2023-01-10", acquisition_cost_cents: 1000000, function_code: 5, physical_risk_code: 3 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /clinical-engineering/devices?facility_id=${f_id} returns exactly 0 elements"

      - name: device_create_optional_fields_apply_declared_defaults
        claim_type: defaults
        grounds:
          - "entities.Device.fields.condition_score"
          - "entities.Device.fields.utilization_hours"
          - "entities.Device.fields.is_loaner_pool"
          - "entities.Device.fields.lot_number"
        distinguishing_aspect: "Omitting lot_number, condition_score, utilization_hours and is_loaner_pool yields null, 1, 0 and false respectively, and the risk score is computed from condition-independent inputs only."
        test_recipe:
          setup: ["One facility, one department and one non-network model."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-DEF", acquisition_date: "2023-01-10", acquisition_cost_cents: 1000000, function_code: 2, physical_risk_code: 1, maintenance_requirement_code: 1 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev_id: $.data.id }
          assert:
            - "Device.${dev_id}.lot_number == null"
            - "Device.${dev_id}.condition_score == 1"
            - "Device.${dev_id}.utilization_hours == 0"
            - "Device.${dev_id}.is_loaner_pool == false"
            - "Device.${dev_id}.risk_score == 8 and Device.${dev_id}.risk_class == LOW and Device.${dev_id}.pm_interval_days == 365"
            - "DeviceModel is_network_connected defaulted to false, so no network adder was applied"

      - name: device_create_computed_risk_score_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Device.fields.risk_score"
          - "validations[priority=5]"
        distinguishing_aspect: "risk_score is source: computed and is not a declared input, so a request that supplies it is rejected with 400 ERR_INVALID_REQUEST rather than silently honoured."
        test_recipe:
          setup: ["One facility, one department and one model."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-INJ", acquisition_date: "2023-01-10", acquisition_cost_cents: 1000000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, risk_score: 47 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /clinical-engineering/devices?facility_id=${f_id} returns exactly 0 elements"

      - name: device_create_system_fields_generated_by_server
        claim_type: system_fields
        grounds:
          - "entities.Device.fields.operational_state"
          - "entities.Device.fields.security_state"
          - "entities.Device.fields.recall_hold"
        distinguishing_aspect: "A newly created device is stamped with a server-minted UUID id (no type prefix), created_at, updated_at, version 1, operational_state IN_SERVICE, security_state UNASSESSED and recall_hold false."
        test_recipe:
          setup: ["One facility, one department and one model."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-SYS", acquisition_date: "2023-01-10", acquisition_cost_cents: 1000000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev_id: $.data.id }
          assert:
            - "Device.${dev_id}.id matches the bare UUID form with no type prefix"
            - "Device.${dev_id}.version == 1"
            - "Device.${dev_id}.operational_state == IN_SERVICE"
            - "Device.${dev_id}.security_state == UNASSESSED"
            - "Device.${dev_id}.recall_hold == false"
            - "Device.${dev_id}.plan_rank == 0 and Device.${dev_id}.plan_funded == false"

      - name: device_create_function_code_out_of_range_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "validations[priority=5]"
          - "entities.Device.fields.function_code"
        distinguishing_aspect: "function_code is constrained to the integer range 1..10, so a request carrying 11 returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One facility, one department and one model."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-RANGE", acquisition_date: "2023-01-10", acquisition_cost_cents: 1000000, function_code: 11, physical_risk_code: 3, maintenance_requirement_code: 2 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: device_create_with_unknown_department_returns_department_not_found
        claim_type: parent_relationships
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_DEPARTMENT_NOT_FOUND]"
        distinguishing_aspect: "Body foreign keys are resolved after schema validation, so a device create naming an unknown department_id returns 404 ERR_DEPARTMENT_NOT_FOUND, not 400."
        test_recipe:
          setup: ["One facility and one model; no departments."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "00000000-0000-4000-8000-000000000000", device_model_id: "${m2_id}", serial_number: "SN-FK", acquisition_date: "2023-01-10", acquisition_cost_cents: 1000000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_DEPARTMENT_NOT_FOUND"

      - name: facility_duplicate_code_returns_conflict
        claim_type: type_constraints
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_DUPLICATE_FACILITY_CODE]"
        distinguishing_aspect: "facility_code is unique across all facilities, so a second create with facility_code RMC-01 returns 409 ERR_DUPLICATE_FACILITY_CODE."
        test_recipe:
          setup: ["One facility with facility_code RMC-01."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Annex", facility_code: "RMC-01", pm_compliance_target_pct: 95.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_DUPLICATE_FACILITY_CODE"

      - name: pm_task_original_due_at_survives_defer
        claim_type: computed_fields
        grounds:
          - "entities.PMTask.fields.original_due_at"
          - "entities.PMTask.fields.due_at"
          - "state_machines.PMTask.SCHEDULED_to_DEFERRED"
        distinguishing_aspect: "A defer rewrites window_start, window_end and due_at to 2026-08-20T23:59:00Z but leaves original_due_at pinned at the creation window_end 2026-08-03T23:59:00Z."
        test_recipe:
          setup: ["One device with a SCHEDULED PM task in the 2026-08-03 window."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-2001", acquisition_date: "2019-03-01", acquisition_cost_cents: 1400000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 4 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev_id: $.data.id }
            - call: "POST /clinical-engineering/pm-tasks"
              payload: { device_id: "${dev_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-03T23:59:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /clinical-engineering/pm-tasks/${pt_id}/defer"
              payload: { new_window_start: "2026-08-20T00:00:00Z", new_window_end: "2026-08-20T23:59:00Z", reason: "Clinical schedule conflict" }
              as: CEManager
              as_user_id: "ce-mgr-01"
          assert:
            - "PMTask.${pt_id}.status == DEFERRED and PMTask.${pt_id}.deferral_count == 1"
            - "PMTask.${pt_id}.due_at == 2026-08-20T23:59:00.000Z"
            - "PMTask.${pt_id}.original_due_at == 2026-08-03T23:59:00.000Z"
            - "PMTask.${pt_id}.window_start == 2026-08-20T00:00:00.000Z"

      - name: auto_created_work_order_reachable_via_device_filtered_list
        claim_type: parent_relationships
        grounds:
          - "endpoints.GET /clinical-engineering/work-orders"
          - "state_machines.PMTask.SCHEDULED_to_COMPLETED"
          - "entities.WorkOrder.fields.device_id"
        distinguishing_aspect: "A FAIL PM result creates a WorkOrder that appears in no create response; GET /work-orders?device_id= is the only discovery channel and must return exactly 1 element in status INTAKE with reported_severity CLINICAL_IMPACT."
        test_recipe:
          setup: ["One device with a SCHEDULED PM task whose window contains the clock."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
