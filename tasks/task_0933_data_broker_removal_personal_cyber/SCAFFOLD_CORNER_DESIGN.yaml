          difficulty_instance: cross_entity_state_dependency / seat_rebind_blocked_by_suspended_addon
          rationale: "Asserted as the trigger outcome of the named instance."

  # =========================================================================
  # Section 7 — RBAC
  # =========================================================================
  - section: rbac
    instances:

      - name: member_cannot_invite_another_household_member
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - roles.Member
          - roles.AccountOwner
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Inviting members is exclusive to AccountOwner and PlatformAdmin; a non-primary Member calling it is refused at rung 3 with ERR_ROLE_NOT_PERMITTED, before rung 4 or rung 12 can be reached."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, primary member plus one activated MINOR member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id, av1: $.data.version }
            - call: "POST /accounts/${acct_id}/members"
              payload: { email: "kid@example.com", full_name: "Robin Kid", role_in_family: "MINOR", expected_account_version: "${av1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { kid_id: $.data.id, kid_token: $.data.invitation_token }
            - call: "POST /members/${kid_id}/activate"
              payload: { invitation_token: "${kid_token}" }
              as: Member
              as_user_id: "${kid_id}"
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { av2: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/members"
              payload: { email: "kid2@example.com", full_name: "Sam Kid", role_in_family: "MINOR", expected_account_version: "${av2}" }
              as: Member
              as_user_id: "${kid_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /accounts/${acct_id}/members returns total_count == 2"

      - name: privacy_agent_cannot_remediate_a_credential_finding
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - roles.PrivacyAgent
          - roles.Member
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Remediation is a household action reserved to Member and AccountOwner even though the agent may create and reopen the finding, which is the peer-role split this scaffold declares."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one DRAFT profile carrying one OPEN WEAK_PASSWORD finding created by the agent."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /credential-findings"
              payload: { profile_id: "${prof_id}", finding_type: "WEAK_PASSWORD", detail: "router admin" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { finding_id: $.data.id }
          trigger:
            - call: "POST /credential-findings/${finding_id}/remediate"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "CredentialFinding.${finding_id}.status == OPEN and MonitoredProfile.${prof_id}.hygiene_score == 82.00"
            - "The same call as AccountOwner ${owner_id} succeeds and hygiene_score becomes 100.00"

      - name: platform_admin_can_perform_the_shared_verify_operation
        claim_type: Can perform shared operations
        grounds:
          - roles.PlatformAdmin
          - roles.PrivacyAgent
          - state_machines.IdentityDocument.PENDING_to_VERIFIED
        distinguishing_aspect: "Identity-document verification is declared as shared between PrivacyAgent and PlatformAdmin, so the admin path must succeed identically and produce effective_status VALID."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one PENDING IdentityDocument expiring 2026-12-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /members/${owner_id}/identity-documents"
              payload: { document_type: "PASSPORT", document_reference: "PASS-1", expires_at: "2026-12-01T00:00:00Z" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /identity-documents/${doc_id}/verify"
              payload: {}
              as: PlatformAdmin
