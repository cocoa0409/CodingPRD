            - call: "POST /incentives/programs"
              payload: { program_code: "PWS-1", name: "Window Stack Cash", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 120000, budget_cents: 90000000, stack_group: "PWS", priority_rank: 71, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_1: $.data.id }
            - call: "POST /incentives/programs/${prog_1}/eligibility-rules"
              payload: { model_code: "TRK9", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["FINANCE"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "PWS-2", name: "Window Stack Subvention", incentive_type: "FINANCE_SUBVENTION", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-08-16T00:00:00.000Z", per_unit_amount_cents: 0, apr_buydown_bps: 300, budget_cents: 90000000, stack_group: "PWS", priority_rank: 72, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_2: $.data.id }
            - call: "POST /incentives/programs/${prog_2}/eligibility-rules"
              payload: { model_code: "TRK9", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["FINANCE"] }
              as: ProgramDesigner
