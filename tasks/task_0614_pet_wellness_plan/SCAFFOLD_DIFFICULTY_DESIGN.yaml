# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pet Wellness-Plan Membership — EXPERT band
# 9 rules x >=2 instances = 18 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: entitlement_grant_enrollment_vs_renewal_on_contract_term
        grounds:
          - calculations.compute_entitlement_grant
          - state_machines.ContractTerm.RENEWAL_PENDING_to_EXPIRED
          - entities.ContractTerm.fields.entitlement_granted_cents
        distinguishing_aspect: |
          The same formula yields a different grant on the ContractTerm domain because a PlanService
          retired between enrollment and renewal is excluded from the renewal grant but was present at
          enrollment: enrollment grant = 44500, renewal grant = 22500 (DENTAL line dropped).
        test_recipe:
          setup:
            - "PLUS plan with EXAM(2@6000), VACCINE(3@3500), DENTAL(1@22000) -> enrollment grant 44500"
            - "Membership ENROLLED at 2026-01-01; first ContractTerm term_index=1 granted=44500"
            - "DENTAL PlanService retired before the term renews at 2026-01-01+365d"
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000, alacarte_discount_pct: 0.20, enrollment_fee_cents: 3000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "VACCINE", included_quantity: 3, unit_value_cents: 3500 }
              as: PlanAdmin
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "DENTAL", included_quantity: 1, unit_value_cents: 22000 }
              as: PlanAdmin
              captures: { dental_ps_id: $.data.id }
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "a@x.com", full_name: "A", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1, auto_renew: true }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
              captures: { term1_id: $.data.id }
            - call: "POST /wellness/plan-services/${dental_ps_id}/retire"
              payload: {}
              as: PlanAdmin
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /wellness/_billing/run-epoch"
              payload: {}
              as: BillingAdmin
          assert:
            - "The first ContractTerm (term_index=1) had entitlement_granted_cents == 44500"
            - "The successor ContractTerm (term_index=2) has entitlement_granted_cents == 22500"
            - "ContractTerm.term_index=2 has no OPEN ServiceCredit with service_code == DENTAL"

      - name: settlement_gross_vs_net_discounted_basis_on_membership
        grounds:
          - calculations.compute_early_termination_settlement
          - state_machines.Membership.ENROLLED_to_CANCEL_PENDING
          - entities.MemberAccount.fields.wallet_credit_cents
        distinguishing_aspect: |
          Settlement on the Membership/MemberAccount domain uses gross_basis (consumed valued at full
          catalog 6000), giving wallet settlement credit 7000; the net_discounted variant would value
          consumed at the discounted 4800 and refund more — the scaffold pins gross_basis.
        test_recipe:
          setup:
            - "PLUS membership: enrollment_fee 3000 + two monthly cycles 4500 = fees_paid 12000"
            - "Zero credits consumed; cancel -> unused 12000, ETF 5000, settlement credit 7000"
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000, alacarte_discount_pct: 0.20, enrollment_fee_cents: 3000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "b@x.com", full_name: "B", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1, auto_renew: false }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /wellness/_billing/run-epoch"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
          assert:
            - "MemberAccount.${acct_id}.wallet_credit_cents == -5000"
            - "Membership.${mem_id}.status == CANCEL_PENDING"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: alacarte_price_three_input_nonlinear_dental_tier
        grounds:
          - calculations.compute_alacarte_price
          - entities.ServiceVisit.fields.charged_cents
          - entities.EnrolledPet.fields.weight_kg
        distinguishing_aspect: |
          Mode (a): charged_cents depends non-linearly on three inputs (base unit value, DENTAL weight
          tier branch, member discount). A 30kg dog DENTAL with no remaining credit costs 20800 = (22000+4000)
          minus round(26000*0.20).
        test_recipe:
          setup:
            - "ESSENTIAL plan with EXAM(1@6000), VACCINE(1@3500), NO DENTAL inclusion line, discount 0.20"
            - "Member ENROLLED; one 30kg dog; first DENTAL visit has no credit -> à-la-carte"
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "ESSENTIAL", name: "Essential", monthly_fee_cents: 2500, annual_value_cents: 30000, alacarte_discount_pct: 0.20, enrollment_fee_cents: 0 }
              as: PlanAdmin
              captures: { ess_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${ess_id}", service_code: "EXAM", included_quantity: 1, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${ess_id}", service_code: "VACCINE", included_quantity: 1, unit_value_cents: 3500 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "c@x.com", full_name: "C", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${ess_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "BigDog", species: "DOG", weight_kg: 30 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/visits"
              payload: { enrolled_pet_id: "${pet_id}", clinic_id: "${clinic_id}", service_code: "DENTAL" }
              as: ClinicStaff
              captures: { visit_id: $.data.id }
          assert:
            - "ServiceVisit.${visit_id}.covered_by_credit == false"
            - "ServiceVisit.${visit_id}.charged_cents == 20800"

      - name: plan_change_proration_pinned_round_once
        grounds:
          - calculations.compute_plan_change_proration
          - entities.PlanChangeRequest.fields.proration_delta_cents
          - state_machines.Membership.ENROLLED_to_CANCEL_PENDING
        distinguishing_aspect: |
          Mode (b): nested-rounding order is pinned — delta = round_half_up((to_daily - from_daily) * days_remaining)
          rounding ONCE at the end. Upgrade 4500->9000/mo over a 31-day cycle with 16 days remaining yields
          proration_delta_cents == 2323, not a rate-rounded-first value.
        test_recipe:
          setup:
            - "PLUS (4500) and PREMIUM (9000) plans; member ENROLLED on PLUS at 2026-01-01, cycle Jan1..Feb1 = 31 days"
            - "Clock advanced to 2026-01-16 (16 days remaining); upgrade to PREMIUM"
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000, alacarte_discount_pct: 0.20, enrollment_fee_cents: 0 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PREMIUM", name: "Premium", monthly_fee_cents: 9000, annual_value_cents: 120000, alacarte_discount_pct: 0.30, enrollment_fee_cents: 0 }
              as: PlanAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${prem_id}", service_code: "EXAM", included_quantity: 4, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "d@x.com", full_name: "D", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id, mem_v0: $.data.version }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_v_after_activate: $.data.version }
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-16T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/plan-change"
              payload: { to_plan_id: "${prem_id}", expected_membership_version: "${mem_v_after_activate}" }
              as: Member
              as_user_id: "${acct_id}"
              captures: { pcr_id: $.data.id }
          assert:
            - "PlanChangeRequest.${pcr_id}.change_kind == UPGRADE"
            - "PlanChangeRequest.${pcr_id}.proration_delta_cents == 2323"
            - "MemberAccount.${acct_id}.wallet_credit_cents == -6823"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_term_renewal_cycle_active_renewalpending_expired_successor_active
        grounds:
          - state_machines.ContractTerm.ACTIVE_to_RENEWAL_PENDING
          - state_machines.ContractTerm.RENEWAL_PENDING_to_EXPIRED
          - entities.ContractTerm.fields.term_index
        distinguishing_aspect: |
          ContractTerm follows a cycle: ACTIVE -> RENEWAL_PENDING -> EXPIRED, and EXPIRED spawns a fresh
          ACTIVE successor term (term_index increments 1 -> 2), so the entity returns to ACTIVE — not a
          linear pipeline.
        test_recipe:
          setup:
            - "PLUS auto_renew membership ENROLLED at 2026-01-01; term1 ends 2027-01-01"
            - "Epoch run inside renewal window then past ends_at creates successor ACTIVE term"
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000, alacarte_discount_pct: 0.20, enrollment_fee_cents: 0 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "e@x.com", full_name: "E", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1, auto_renew: true }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-28T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /wellness/_billing/run-epoch"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /wellness/_billing/run-epoch"
              payload: {}
              as: BillingAdmin
          assert:
            - "The ContractTerm with term_index == 1 has status == EXPIRED"
            - "A ContractTerm with term_index == 2 exists with status == ACTIVE"

      - name: membership_branch_and_suspend_resume_cycle
        grounds:
          - state_machines.Membership.ENROLLED_to_SUSPENDED
          - state_machines.Membership.SUSPENDED_to_ENROLLED
          - state_machines.Membership.ENROLLED_to_CANCEL_PENDING
        distinguishing_aspect: |
          Membership is non-linear on a different entity: ENROLLED branches to {SUSPENDED, CANCEL_PENDING}
          with divergent side-effect sets, and SUSPENDED loops back to ENROLLED via resume (cycle).
        test_recipe:
          setup:
            - "PLUS membership ENROLLED; suspend then resume returns to ENROLLED with pets ENROLLED again"
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000, alacarte_discount_pct: 0.20, enrollment_fee_cents: 0 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "f@x.com", full_name: "F", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/suspend"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/resume"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
          assert:
            - "Membership.${mem_id}.status == ENROLLED"
            - "EnrolledPet.${pet_id}.status == ENROLLED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascade_membership_term_credit_depth3
        grounds:
          - state_machines.Membership.ENROLLED_to_CANCEL_PENDING
          - state_machines.ContractTerm.ACTIVE_to_TERMINATED
          - entities.ServiceCredit.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from cancel: Membership ENROLLED->CANCEL_PENDING causes ContractTerm
          ACTIVE->TERMINATED, which itself causes every OPEN ServiceCredit on that term to become
          FORFEITED. Each link is caused by the previous one.
        test_recipe:
          setup:
            - "PLUS membership ENROLLED with OPEN EXAM credit bucket on its ACTIVE term"
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000, alacarte_discount_pct: 0.20, enrollment_fee_cents: 0 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "g@x.com", full_name: "G", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
              captures: { term1_id: $.data.id }
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
          assert:
            - "Membership.${mem_id}.status == CANCEL_PENDING"
            - "The ContractTerm of membership ${mem_id} has status == TERMINATED"
            - "Every ServiceCredit of that ContractTerm has status == FORFEITED"

      - name: renewal_cascade_expire_forfeit_grant_depth2
        grounds:
          - state_machines.ContractTerm.RENEWAL_PENDING_to_EXPIRED
          - entities.ServiceCredit.fields.status
          - calculations.compute_entitlement_grant
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (run-epoch term expiry): term EXPIRED forfeits all
          OPEN credits on the old term, and that expiry itself triggers grant of fresh ServiceCredit
          buckets on the successor term. Originates from a different transition than the cancel cascade.
        test_recipe:
          setup:
            - "PLUS auto_renew membership ENROLLED at 2026-01-01; unused EXAM credits on term1; epoch past ends_at"
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000, alacarte_discount_pct: 0.20, enrollment_fee_cents: 0 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "h@x.com", full_name: "H", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1, auto_renew: true }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
