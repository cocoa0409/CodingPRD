      - name: duplicate_active_enrollment_in_the_same_track_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=84]
          - errors[ERR_DUPLICATE_ACTIVE_ENROLLMENT]
        distinguishing_aspect: |
          The uniqueness key is (student, program_track) over ACTIVE enrollments only - not (student,
          section). A second HSE_PREP section is refused while the learner is ACTIVE, and the same
          request succeeds once the first enrollment is withdrawn.
