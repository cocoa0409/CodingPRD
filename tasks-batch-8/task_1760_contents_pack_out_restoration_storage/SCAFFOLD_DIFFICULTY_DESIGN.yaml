# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 2 instances per §0.5 rule (rules 6 and 7 carry a 3rd) — 20 instances total.
# All numeric asserts were computed by executing the §1.3 formulas on the pinned
# literal inputs. Common fixture conventions:
#   - logical clock starts at 2026-08-01T00:00:00Z (server default)
#   - job version is always captured fresh via GET /api/pack-out-jobs/{id}
#     before any OCC-guarded call (cascades may have bumped it)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (StorageStatement charges vs HandlingClaim settlement).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: storage_accrual_provisional_vs_final_divergence
        grounds:
          - calculations.storage_charge_accrual
          - entities.StorageStatement.fields.provisional_total_cents
          - entities.StorageStatement.fields.final_total_cents
        distinguishing_aspect: |
          Identical placement data (monthly_rate 6000, placed 2026-08-10, released
          2026-08-31) yields 6000 under the provisional whole-month variant and
          4137 under the final daily-proration variant — same entity domain
          (StorageStatement), two valid algorithms, provably different cents.
        test_recipe:
          setup:
            - "Job with one GENERAL item (vol 40 cu ft) CLEANED and placed into a CLIMATE_CONTROLLED vault (rate 150 cents/cu ft/mo -> monthly_rate_cents 6000) on 2026-08-10"
            - "PROVISIONAL statement for period [2026-08-01, 2026-09-01) created 2026-08-15 while placement ACTIVE -> provisional 6000 (one calendar month touched)"
            - "Placement released 2026-08-31; billing run at 2026-09-01 finalizes the statement"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-DV1", property_address: "1 Pine St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Lounge", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-DV1", description: "Sofa", item_category: "GENERAL", declared_value_cents: 1000, volume_cu_ft: 40 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-DV1", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 10000, monthly_rate_cents_per_cu_ft: 150 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { plc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:00:00Z" }, as: BillingClerk }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { job_v: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v}" }, as: BillingClerk, captures: { stmt: $.data.id, prov: $.data.provisional_total_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T10:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/storage-placements/${plc}/release", payload: {}, as: InventoryTechnician }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk }
          trigger:
            - { call: "GET /api/storage-statements/${stmt}", payload: {}, as: BillingClerk, captures: { fin: $.data.final_total_cents, st: $.data.status } }
          assert:
            - "captured provisional_total_cents ${prov} == 6000 (whole-month convention: 1 month x 6000)"
            - "StorageStatement.${stmt}.final_total_cents == 4137 (daily 197 = round_half_up(6000*12/365) x 21 occupied days 08-10..08-30)"
            - "StorageStatement.${stmt}.status == FINALIZED"
            - "6000 != 4137 — the two variants diverge on identical placement data"
      - name: claim_settlement_acv_vs_rcv_divergence
        grounds:
          - calculations.handling_claim_settlement
          - entities.HandlingClaim.fields.settlement_amount_cents
          - entities.PackOutJob.fields.policy_coverage_type
        distinguishing_aspect: |
          Different entity domain than storage_accrual: identical claim data
          (replacement_cost 100000, age 5y) settles at 50000 on an ACV-policy job
          (50% depreciation) vs 100000 on an RCV-policy job (under the 250000 cap).
        test_recipe:
          setup:
            - "Two jobs, one policy_coverage_type ACV and one RCV, each with one room + one item"
            - "Identical DAMAGE claim (replacement_cost_cents 100000, item_age_years 5) filed on each item, filed_by pm-1, reviewed and approved by adjuster adj-1"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-DV2A", property_address: "2 Oak Ave", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job_a: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job_a}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room_a: $.data.id } }
            - { call: "POST /api/rooms/${room_a}/items", payload: { barcode: "BC-DV2A", description: "Laptop", item_category: "ELECTRONICS", declared_value_cents: 100000, volume_cu_ft: 2 }, as: InventoryTechnician, captures: { item_a: $.data.id } }
            - { call: "POST /api/items/${item_a}/handling-claims", payload: { claim_type: "DAMAGE", description: "Dropped during pack-out", replacement_cost_cents: 100000, item_age_years: 5 }, as: ProjectManager, as_user_id: "pm-1", captures: { claim_a: $.data.id } }
            - { call: "POST /api/handling-claims/${claim_a}/transition", payload: { action: "SUBMIT_REVIEW" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
            - { call: "POST /api/handling-claims/${claim_a}/transition", payload: { action: "APPROVE" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-DV2B", property_address: "3 Elm Rd", carrier_name: "Acme Mutual", policy_coverage_type: "RCV" }, as: ProjectManager, captures: { job_b: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job_b}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room_b: $.data.id } }
            - { call: "POST /api/rooms/${room_b}/items", payload: { barcode: "BC-DV2B", description: "Laptop", item_category: "ELECTRONICS", declared_value_cents: 100000, volume_cu_ft: 2 }, as: InventoryTechnician, captures: { item_b: $.data.id } }
            - { call: "POST /api/items/${item_b}/handling-claims", payload: { claim_type: "DAMAGE", description: "Dropped during pack-out", replacement_cost_cents: 100000, item_age_years: 5 }, as: ProjectManager, as_user_id: "pm-1", captures: { claim_b: $.data.id } }
            - { call: "POST /api/handling-claims/${claim_b}/transition", payload: { action: "SUBMIT_REVIEW" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
            - { call: "POST /api/handling-claims/${claim_b}/transition", payload: { action: "APPROVE" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
          trigger:
            - { call: "GET /api/items/${item_a}/handling-claims", payload: {}, as: ClaimsAdjuster, captures: { set_a: "$.data[0].settlement_amount_cents", var_a: "$.data[0].settlement_variant" } }
            - { call: "GET /api/items/${item_b}/handling-claims", payload: {}, as: ClaimsAdjuster, captures: { set_b: "$.data[0].settlement_amount_cents", var_b: "$.data[0].settlement_variant" } }
          assert:
            - "claim A settlement_variant == ACV and settlement_amount_cents == 50000 (depreciation min(5*10,70)=50 -> 100000*50/100; floor 30000 not binding)"
            - "claim B settlement_variant == RCV and settlement_amount_cents == 100000 (min(100000, 250000), no QA_ACCEPTED referral so cap applies but does not bind)"
            - "50000 != 100000 — variants diverge on identical claim data across different policy coverage"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: mode (b) nested-rounding order and mode (c)
  # circular-looking dependency with pinned evaluation order. Different modes.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: storage_daily_rate_rounding_order_pinned
        grounds:
          - calculations.storage_charge_accrual
          - state_machines.StorageStatement.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Mode (b): nested rounding — the scaffold pins round-per-placement-daily-rate
          THEN multiply by days: monthly 6001 -> daily round_half_up(72012/365)=197
          -> 3 days = 591. The alternative sum-then-round order gives
          round_half_up(6001*12*3/365)=592. Assertion pins 591.
        test_recipe:
          setup:
            - "GENERAL item vol 1 cu ft placed into CLIMATE_CONTROLLED vault rated 6001 cents/cu ft/mo (monthly_rate_cents snapshot 6001) on 2026-08-01 (default clock), released 2026-08-04 -> exactly 3 occupied days"
            - "Statement period [2026-08-01, 2026-09-01) finalized by billing run at 2026-09-01"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-CF1", property_address: "9 Birch Ln", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Study", room_type: "OTHER" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-CF1", description: "Lamp", item_category: "GENERAL", declared_value_cents: 500, volume_cu_ft: 1 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-CF1", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 6001 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { plc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/storage-placements/${plc}/release", payload: {}, as: InventoryTechnician }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { job_v: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v}" }, as: BillingClerk, captures: { stmt: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk }
          trigger:
            - { call: "GET /api/storage-statements/${stmt}", payload: {}, as: BillingClerk, captures: { fin: $.data.final_total_cents } }
          assert:
            - "StorageStatement.${stmt}.final_total_cents == 591 (197/day x 3 days; NOT 592 from the sum-then-round order)"
            - "StorageStatement.${stmt}.status == FINALIZED"
      - name: invoice_admin_fee_tier_keyed_on_subtotal
        grounds:
          - calculations.carrier_invoice_total
          - entities.CarrierInvoice.fields.admin_fee_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the admin-fee tier is keyed on the
          subtotal BEFORE the fee (pinned evaluation order subtotal -> fee -> total).
          Subtotal exactly 100000 (4137 storage + 95863 adjustment) lands in the 7%
          tier -> fee 7000, total 107000; keying on the post-fee total would be
          ill-defined and would suggest 9%.
        test_recipe:
          setup:
            - "Job with one FINALIZED statement carrying final_total_cents 4137 (vol 40 at 150/cu ft, placed 2026-08-10, released 2026-08-31, 21 days x 197)"
            - "Invoice created with adjustment_cents 95863 so subtotal hits the 100000 tier boundary exactly"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-CF2", property_address: "5 Cedar Ct", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Lounge", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-CF2", description: "Sofa", item_category: "GENERAL", declared_value_cents: 1000, volume_cu_ft: 40 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-CF2", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 10000, monthly_rate_cents_per_cu_ft: 150 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { plc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T10:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/storage-placements/${plc}/release", payload: {}, as: InventoryTechnician }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { job_v: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v}" }, as: BillingClerk, captures: { stmt: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk }
          trigger:
            - { call: "POST /api/pack-out-jobs/${job}/carrier-invoices", payload: { adjustment_cents: 95863 }, as: BillingClerk, captures: { inv: $.data.id } }
          assert:
            - "CarrierInvoice.${inv}.storage_cents == 4137 (swept final statement total; statement became INVOICED)"
            - "CarrierInvoice.${inv}.admin_fee_cents == 7000 (subtotal 100000 -> 7% tier, keyed on subtotal BEFORE fee)"
            - "CarrierInvoice.${inv}.total_cents == 107000"
            - "CarrierInvoice.${inv}.balance_cents == 107000 (claim_credit 0, amount_paid 0)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: cyclic rework loop on CleaningTask vs
  # parallel state dimensions with a re-triage cycle on Item. Different entities.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: cleaning_task_rework_cycle
        grounds:
          - state_machines.CleaningTask.FAILED_to_IN_PROGRESS
          - entities.CleaningTask.fields.rework_count
        distinguishing_aspect: |
          CleaningTask is cyclic: IN_PROGRESS -> FAILED -> IN_PROGRESS -> PASSED
          (rework loop) — not a linear pipeline; rework_count tracks the loop.
        test_recipe:
          setup:
            - "Job with one GENERAL item triaged SALVAGEABLE; one cleaning task created"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-NL1", property_address: "7 Willow Way", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Kitchen", room_type: "KITCHEN" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-NL1", description: "Toaster", item_category: "APPLIANCE", declared_value_cents: 8000, volume_cu_ft: 3 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_FAIL", qa_note: "odor remains" }, as: InventoryTechnician }
          trigger:
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "REWORK" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician, captures: { tst: $.data.status, rw: $.data.rework_count, fee: $.data.fee_cents } }
            - { call: "GET /api/items/${item}", payload: {}, as: InventoryTechnician, captures: { ips: $.data.processing_status } }
          assert:
            - "CleaningTask.${task}.status == PASSED after the FAILED -> IN_PROGRESS rework loop"
            - "CleaningTask.${task}.rework_count == 1"
            - "CleaningTask.${task}.fee_cents == 12000 (no smoke damage -> no deodorization adder)"
            - "Item.${item}.processing_status == CLEANED"
      - name: item_parallel_dimensions_retriage_loop
        grounds:
          - state_machines.Item.SALVAGEABLE_to_NON_SALVAGEABLE
          - state_machines.Item.NON_SALVAGEABLE_to_SALVAGEABLE
          - entities.Item.fields.condition_triage
          - entities.Item.fields.processing_status
          - concurrency_rules[triage-decision-stale-item]
        distinguishing_aspect: |
          Item carries two parallel state dimensions (condition_triage x
          processing_status) and the triage dimension cycles
          SALVAGEABLE -> NON_SALVAGEABLE -> SALVAGEABLE under OCC — a different
          entity and a different non-linear shape than the CleaningTask loop.
        test_recipe:
          setup:
            - "Job with one GENERAL item; no cleaning task started (item stays re-triageable)"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-NL2", property_address: "8 Maple Dr", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Bedroom", room_type: "BEDROOM" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-NL2", description: "Dresser", item_category: "FURNITURE", declared_value_cents: 30000, volume_cu_ft: 20 }, as: InventoryTechnician, captures: { item: $.data.id, item_v1: $.data.version } }
          trigger:
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v1}" }, as: InventoryTechnician, captures: { item_v2: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "NON_SALVAGEABLE", expected_item_version: "${item_v2}" }, as: InventoryTechnician, captures: { item_v3: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v3}" }, as: InventoryTechnician, captures: { item_v4: $.data.version } }
            - { call: "GET /api/items/${item}", payload: {}, as: InventoryTechnician, captures: { tri: $.data.condition_triage, proc: $.data.processing_status, tc: $.data.triage_count } }
            - { call: "GET /api/items/${item}/disposal-record", payload: {}, as: InventoryTechnician, captures: { drec: "$.data[0].status" } }
          assert:
            - "Item.${item}.condition_triage == SALVAGEABLE after the SALVAGEABLE -> NON_SALVAGEABLE -> SALVAGEABLE cycle"
            - "Item.${item}.processing_status == AWAITING_CLEANING (processing dimension moved REGISTERED -> AWAITING_CLEANING -> AWAITING_DISPOSAL -> AWAITING_CLEANING independently)"
            - "Item.${item}.triage_count == 3"
            - "DisposalRecord created by the NON_SALVAGEABLE leg was auto-VOIDED by the re-triage (GET disposal-record -> $.data[0].status == VOIDED)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: disposal re-triage cascade (depth 4) vs claim
  # settlement cascade (depth 3). Different triggering transitions.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: disposal_retriage_cascade_depth4
        grounds:
          - state_machines.Item.SALVAGEABLE_to_NON_SALVAGEABLE
          - state_machines.StoragePlacement.ACTIVE_to_RELEASED
          - calculations.vault_occupancy
          - calculations.storage_charge_accrual
        distinguishing_aspect: |
          Trigger = triage NON_SALVAGEABLE on an IN_STORAGE item. Chain: item ->
          AWAITING_DISPOSAL (1) -> DRAFT DisposalRecord auto-created (2) -> ACTIVE
          placement RELEASED reason=DISPOSAL (3) -> Vault.occupied_cu_ft decremented
          AND PROVISIONAL statement accrual + job.accrued_storage_total_cents
          recomputed (4). Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Job with one GENERAL item (vol 40) IN_STORAGE in a CLIMATE_CONTROLLED vault (rate 150 -> occupied_cu_ft 40)"
            - "PROVISIONAL statement for [2026-08-01, 2026-09-01) showing provisional_total_cents 6000 and job.accrued_storage_total_cents 6000"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-TC1", property_address: "11 Ash St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Garage", room_type: "GARAGE" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-TC1", description: "Workbench", item_category: "GENERAL", declared_value_cents: 40000, volume_cu_ft: 40 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-TC1", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 10000, monthly_rate_cents_per_cu_ft: 150 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:00:00Z" }, as: BillingClerk }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { job_v: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v}" }, as: BillingClerk, captures: { stmt: $.data.id, prov_before: $.data.provisional_total_cents } }
            - { call: "GET /api/items/${item}", payload: {}, as: InventoryTechnician, captures: { item_v_now: $.data.version } }
          trigger:
            - { call: "POST /api/items/${item}/triage", payload: { determination: "NON_SALVAGEABLE", expected_item_version: "${item_v_now}" }, as: InventoryTechnician }
          assert:
            - "Item.${item}.processing_status == AWAITING_DISPOSAL (link 1)"
            - "GET /api/items/${item}/disposal-record returns array length 1 with status DRAFT (link 2)"
            - "GET /api/items/${item}/placements -> $.data[0].status == RELEASED and release_reason == DISPOSAL (link 3)"
            - "GET /api/vaults/${vault} -> occupied_cu_ft == 0 (link 4)"
            - "GET /api/storage-statements/${stmt} -> provisional_total_cents == 0 (link 4 recompute; was 6000 per captured ${prov_before})"
            - "GET /api/pack-out-jobs/${job} -> accrued_storage_total_cents == 0"
      - name: claim_settle_cascade_depth3
        grounds:
          - state_machines.HandlingClaim.APPROVED_to_SETTLED
          - state_machines.Item.IN_STORAGE_to_CLAIM_SETTLED
          - calculations.vault_occupancy
        distinguishing_aspect: |
          Different trigger than disposal_retriage_cascade_depth4: direct claim
          SETTLE. Chain: claim APPROVED -> SETTLED (0) -> item CLAIM_SETTLED (1) ->
          ACTIVE placement RELEASED reason=CLAIM (2) -> vault occupancy decremented
          (3). Depth 3 vs depth 4, different propagation pattern.
        test_recipe:
          setup:
            - "ACV job with one GENERAL item (vol 25) IN_STORAGE in a CLIMATE_CONTROLLED vault (rate 100 -> monthly 2500, occupied_cu_ft 25)"
            - "HandlingClaim (replacement 50000, age 2) approved by adj-1: depreciation min(2*10,70)=20 -> 50000*80/100 = 40000; floor 15000 not binding"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-TC2", property_address: "12 Poplar Ave", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Basement", room_type: "BASEMENT" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-TC2", description: "Freezer", item_category: "APPLIANCE", declared_value_cents: 50000, volume_cu_ft: 25 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-TC2", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 5000, monthly_rate_cents_per_cu_ft: 100 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/handling-claims", payload: { claim_type: "DAMAGE", description: "Crushed in vault", replacement_cost_cents: 50000, item_age_years: 2 }, as: ProjectManager, as_user_id: "pm-1", captures: { claim: $.data.id } }
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "SUBMIT_REVIEW" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "APPROVE" }, as: ClaimsAdjuster, as_user_id: "adj-1", captures: { settle_amt: $.data.settlement_amount_cents } }
          trigger:
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "SETTLE" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
          assert:
            - "HandlingClaim.${claim}.status == SETTLED and settlement_amount_cents == 40000"
            - "Item.${item}.processing_status == CLAIM_SETTLED (link 1)"
            - "GET /api/items/${item}/placements -> $.data[0].status == RELEASED and release_reason == CLAIM (link 2)"
            - "GET /api/vaults/${vault} -> occupied_cu_ft == 0 (link 3)"
  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: state-vs-fiscal and
  # safety-vs-constraint — different error-category pairs on different endpoints.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payment_state_error_beats_fiscal_error
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - state_machines.CarrierInvoice.transitions
          - errors[ERR_INVALID_TRANSITION]
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
        distinguishing_aspect: |
          Category pair = state vs business_fiscal: RECORD_PAYMENT on a DRAFT
          invoice with amount 999999 (> balance 1050) violates both the state
          machine (RECORD_PAYMENT only from SUBMITTED/DISPUTED) and the fiscal
          bound; priority 7 beats 12 -> ERR_INVALID_TRANSITION must win.
        test_recipe:
          setup:
            - "Job with one FINALIZED statement (final_total 0 — no placements) swept into a DRAFT invoice with adjustment_cents 1000: storage 0, admin fee 5% = 50, total 1050, balance 1050"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-PP1", property_address: "14 Hemlock Rd", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v1}" }, as: BillingClerk, captures: { stmt: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk }
            - { call: "POST /api/pack-out-jobs/${job}/carrier-invoices", payload: { adjustment_cents: 1000 }, as: BillingClerk, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "RECORD_PAYMENT", amount_cents: 999999 }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION (state, priority 7) — NOT ERR_PAYMENT_EXCEEDS_BALANCE (fiscal, priority 12) although amount 999999 > balance 1050"
            - "CarrierInvoice.${inv}.status still DRAFT and amount_paid_cents == 0"
      - name: hazmat_safety_error_beats_capacity_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_HAZMAT_STORAGE_FORBIDDEN]
          - errors[ERR_VAULT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair = business_safety vs business_constraint (different pair
          than state-vs-fiscal): placing a hazmat-flagged CLEANED item into a FULL
          vault violates both; priority 8 beats 9 -> ERR_HAZMAT_STORAGE_FORBIDDEN
          must win over ERR_VAULT_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "CLIMATE_CONTROLLED vault capacity 10 cu ft fully occupied by item A (vol 10, cleaned, placed)"
            - "Item B (hazmat_flag true, vol 1) cleaned and ready for placement"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-PP2", property_address: "16 Juniper Dr", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Shed", room_type: "GARAGE" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-PP2A", description: "Toolbox", item_category: "GENERAL", declared_value_cents: 2000, volume_cu_ft: 10 }, as: InventoryTechnician, captures: { item_a: $.data.id, item_a_v: $.data.version } }
            - { call: "POST /api/items/${item_a}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_a_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_a}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task_a: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task_a}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task_a}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-PP2", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 10, monthly_rate_cents_per_cu_ft: 100 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /api/items/${item_a}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-PP2B", description: "Chem-soaked rug", item_category: "GENERAL", declared_value_cents: 500, volume_cu_ft: 1, hazmat_flag: true }, as: InventoryTechnician, captures: { item_b: $.data.id, item_b_v: $.data.version } }
            - { call: "POST /api/items/${item_b}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_b_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_b}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task_b: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task_b}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task_b}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
          trigger:
            - { call: "POST /api/items/${item_b}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HAZMAT_STORAGE_FORBIDDEN (safety, priority 8) — NOT ERR_VAULT_CAPACITY_EXCEEDED (constraint, priority 9) although the vault is exactly full (occupied 10 == capacity 10)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: cu-ft capacity (<=), high-value cents
  # threshold (>=), empty eligible set (==0) — different metrics, distinct endpoints.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: vault_capacity_exact_fit_allowed
        grounds:
          - validations[priority=9]
          - calculations.vault_occupancy
          - entities.Vault.fields.posture
          - errors[ERR_VAULT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric = cubic feet on POST /api/items/{id}/placements: the bound is
          inclusive (occupied + volume <= capacity). 900 + 100 == 1000 fits and
          flips posture to FULL; the next 1 cu ft overflows to 1001 > 1000 and
          is rejected.
        test_recipe:
          setup:
            - "CLIMATE_CONTROLLED vault capacity 1000; three cleaned GENERAL items A(900), B(100), C(1)"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-BP1", property_address: "18 Spruce St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Storage", room_type: "BASEMENT" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-BP1A", description: "A", item_category: "GENERAL", declared_value_cents: 100, volume_cu_ft: 900 }, as: InventoryTechnician, captures: { item_a: $.data.id, item_a_v: $.data.version } }
            - { call: "POST /api/items/${item_a}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_a_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_a}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task_a: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task_a}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task_a}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-BP1B", description: "B", item_category: "GENERAL", declared_value_cents: 100, volume_cu_ft: 100 }, as: InventoryTechnician, captures: { item_b: $.data.id, item_b_v: $.data.version } }
            - { call: "POST /api/items/${item_b}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_b_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_b}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task_b: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task_b}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task_b}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-BP1C", description: "C", item_category: "GENERAL", declared_value_cents: 100, volume_cu_ft: 1 }, as: InventoryTechnician, captures: { item_c: $.data.id, item_c_v: $.data.version } }
            - { call: "POST /api/items/${item_c}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_c_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_c}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task_c: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task_c}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task_c}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-BP1", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 100 }, as: ProjectManager, captures: { vault: $.data.id } }
          trigger:
            - { call: "POST /api/items/${item_a}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_b}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { plc_b: $.data.id } }
            - { call: "GET /api/vaults/${vault}", payload: {}, as: InventoryTechnician, captures: { occ: $.data.occupied_cu_ft, post: $.data.posture } }
            - { call: "POST /api/items/${item_c}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { err: $.data.error_id } }
          assert:
            - "placement B == ACTIVE (900 + 100 == 1000 <= 1000 — exact fit allowed)"
            - "Vault.${vault}.occupied_cu_ft == 1000 and posture == FULL"
            - "placement C rejected: error_id == ERR_VAULT_CAPACITY_EXCEEDED (1000 + 1 > 1000)"
      - name: high_value_threshold_exact_boundary
        grounds:
          - entities.Item.fields.is_high_value
          - validations[priority=11]
          - errors[ERR_SPECIALTY_REQUIRED]
        distinguishing_aspect: |
          Metric = declared_value_cents on POST /api/rooms/{id}/items (observable
          computed flag): exactly 1000000 => is_high_value true (>= boundary) and
          placement is gated by ERR_SPECIALTY_REQUIRED; 999999 => false and
          placement succeeds. Distinct metric and distinct primary endpoint from
          the vault-capacity boundary.
        test_recipe:
          setup:
            - "Two FURNITURE items: X declared 1000000 (== threshold), Y declared 999999 (threshold - 1); both cleaned; STANDARD vault with capacity"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-BP2", property_address: "20 Chestnut Ave", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-BP2X", description: "Grand piano", item_category: "FURNITURE", declared_value_cents: 1000000, volume_cu_ft: 30 }, as: InventoryTechnician, captures: { item_x: $.data.id, item_x_v: $.data.version, hv_x: $.data.is_high_value } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-BP2Y", description: "Oak table", item_category: "FURNITURE", declared_value_cents: 999999, volume_cu_ft: 30 }, as: InventoryTechnician, captures: { item_y: $.data.id, item_y_v: $.data.version, hv_y: $.data.is_high_value } }
            - { call: "POST /api/items/${item_x}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_x_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_x}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task_x: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task_x}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task_x}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_y}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_y_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_y}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task_y: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task_y}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task_y}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-BP2", climate_class: "STANDARD", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 100 }, as: ProjectManager, captures: { vault: $.data.id } }
          trigger:
            - { call: "POST /api/items/${item_x}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { err: $.data.error_id } }
            - { call: "POST /api/items/${item_y}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { plc_y: $.data.id } }
          assert:
            - "Item X: is_high_value == true at exactly 1000000 (>= boundary)"
            - "Item Y: is_high_value == false at 999999"
            - "placement of X rejected: error_id == ERR_SPECIALTY_REQUIRED (no QA_ACCEPTED referral)"
            - "placement of Y succeeds (ACTIVE) — the threshold binds only at >= 1000000"
      - name: packback_confirm_empty_eligible_set_rejected
        grounds:
          - calculations.packback_eligibility_count
          - errors[ERR_NO_ELIGIBLE_ITEMS_FOR_PACKBACK]
          - state_machines.PackBackSchedule.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Metric = eligible-set cardinality (zero-count edge) on POST
          /api/pack-back-schedules/{id}/transition: structure COMPLETE but zero
          items IN_STORAGE => count == 0 => ERR_NO_ELIGIBLE_ITEMS_FOR_PACKBACK.
          Distinct metric and endpoint from the cu-ft and cents boundaries.
        test_recipe:
          setup:
            - "Job with structure_status COMPLETE; one item CLEANED but never placed (eligible set empty)"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-BP3", property_address: "22 Alder Way", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Bath", room_type: "BATH" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-BP3", description: "Vanity", item_category: "FURNITURE", declared_value_cents: 5000, volume_cu_ft: 10 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/pack-out-jobs/${job}/transition", payload: { action: "STRUCTURE_START" }, as: ProjectManager }
            - { call: "POST /api/pack-out-jobs/${job}/transition", payload: { action: "STRUCTURE_COMPLETE" }, as: ProjectManager }
            - { call: "POST /api/pack-out-jobs/${job}/pack-back-schedules", payload: { crew_id: "crew-9", service_date: "2026-09-10", window_start_hour: 8, window_end_hour: 12 }, as: ProjectManager, captures: { sch: $.data.id } }
          trigger:
            - { call: "POST /api/pack-back-schedules/${sch}/transition", payload: { action: "CONFIRM" }, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_ELIGIBLE_ITEMS_FOR_PACKBACK (eligible_item_count == 0 — empty-set boundary)"
            - "PackBackSchedule.${sch}.status remains REQUESTED"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: schedule->job structure,
  # placement->item triage, schedule->claim. Three different entity pairs.
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_confirm_gated_on_job_structure
        grounds:
          - state_machines.PackBackSchedule.REQUESTED_to_CONFIRMED
          - entities.PackOutJob.fields.structure_status
          - errors[ERR_JOB_NOT_READY_FOR_PACKBACK]
        distinguishing_aspect: |
          Entity pair PackBackSchedule -> PackOutJob: CONFIRM is legal only when
          the JOB's structure_status == COMPLETE; an eligible in-storage item
          alone does not unlock it.
        test_recipe:
          setup:
            - "Job with structure_status PENDING (never signed off); one item fully processed to IN_STORAGE"
          setup_api_calls:
