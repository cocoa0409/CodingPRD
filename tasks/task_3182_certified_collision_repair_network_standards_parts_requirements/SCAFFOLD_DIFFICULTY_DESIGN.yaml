  - name: audit_verification_rejection_loop_increments_round
    grounds:
    - state_machines.Audit.VERIFICATION_to_FINDINGS_ISSUED
    - state_machines.CorrectiveAction.SUBMITTED_to_REJECTED
    - entities.Audit.fields.round_number
    distinguishing_aspect: "Audit loops VERIFICATION -> FINDINGS_ISSUED -> VERIFICATION on rejected\ncorrective evidence with round_number incremented per loop \u2014 a cyclic\nstate machine on Audit (different\
      \ entity from RepairOrder).\n"
    test_recipe:
      setup:
      - Shop with ACTIVE attestation A1 to published requirement R1; cycle open; audit begun; one MAJOR finding issued against A1 (audit FINDINGS_ISSUED, corrective action OPEN, due_at = issued + 30 days)
      - Two distinct auditor user ids AUD1 (issuer) and AUD2 (verifier) to satisfy segregation of duties
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Loop Collision
          state_code: NV
          zip_code: '89101'
          latitude: 36.17
          longitude: -115.14
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v: $.data.version
      - call: POST /network/requirements
        payload:
          requirement_code: TL-LOOP-01
          category: TOOLING
          description: Rivet gun calibration cert
          severity_if_failed: MAJOR
          effective_from: '2026-08-01T00:00:00Z'
        as: NetworkAdmin
        captures:
          req_id: $.data.id
      - call: POST /network/requirements/${req_id}/publish
        payload: {}
        as: NetworkAdmin
      - call: POST /network/shops/${shop_id}/attestations
        payload:
          requirement_id: ${req_id}
          evidence_uri: s3://ev/old-cert.pdf
          expected_shop_version: ${shop_v}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          att_id: $.data.id
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cycle_id: $.data.id
      - call: POST /network/certification-cycles/${cycle_id}/audits
        payload:
          scheduled_start: '2026-09-02T09:00:00Z'
          scheduled_end: '2026-09-02T17:00:00Z'
        as: NetworkAuditor
        as_user_id: aud-1
        captures:
          audit_id: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-02T10:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${audit_id}/begin
        payload: {}
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/audits/${audit_id}/issue-findings
        payload:
          findings:
          - attestation_id: ${att_id}
            severity: MAJOR
        as: NetworkAuditor
        as_user_id: aud-1
      trigger:
      - call: GET /network/audits/${audit_id}/corrective-actions
        as: NetworkAuditor
        captures:
          ca_id: $.data[0].id
      - call: POST /network/corrective-actions/${ca_id}/submit
        payload:
          evidence_uri: s3://ev/attempt1.pdf
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/corrective-actions/${ca_id}/verify
        payload:
          verdict: REJECTED
        as: NetworkAuditor
        as_user_id: aud-2
      - call: GET /network/audits/${audit_id}
        as: NetworkAuditor
        captures:
          round_after: $.data.round_number
      - call: GET /network/audits/${audit_id}/corrective-actions
        as: NetworkAuditor
        captures:
          ca2_id: $.data[1].id
      - call: POST /network/corrective-actions/${ca2_id}/submit
        payload:
          evidence_uri: s3://ev/attempt2.pdf
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/corrective-actions/${ca2_id}/verify
        payload:
          verdict: VERIFIED
        as: NetworkAuditor
        as_user_id: aud-2
      assert:
      - After the REJECTED verdict the audit returned VERIFICATION -> FINDINGS_ISSUED and Audit.${audit_id}.round_number == 2
      - A fresh CorrectiveAction in OPEN was created with a NEW due_at (revision loop, not reuse)
      - After the second action is VERIFIED the audit status == PASSED
      - Attestation.${att_id}.status == ACTIVE again (compensation of the earlier lapse)
- rule_id: transitive_cascade
  instances:
  - name: shop_suspension_cascades_to_relations_referrals_counters
    grounds:
    - state_machines.Shop.CERTIFIED_to_SUSPENDED
    - state_machines.InsurerRelation.transitions
    - state_machines.Referral.ROUTED_to_DECLINED
    - entities.Shop.fields.pending_referral_count
    distinguishing_aspect: 'Depth-3 chain from a CERTIFIED->SUSPENDED posture flip: the clock sweep

      mutates Shop; the Shop mutation mutates each Referral (ROUTED -> DECLINED);

      each Referral mutation itself mutates the Shop counter

      (pending_referral_count -= 1); and the same Shop mutation mutates each

      InsurerRelation (steering_enabled := false). Trigger: clock sweep past an

      overdue CRITICAL corrective action.

      '
    test_recipe:
      setup:
      - Shop CERTIFIED with one ACTIVE InsurerRelation (steering_enabled true) and one ROUTED referral (pending_referral_count == 1)
      - A second cycle audit in FINDINGS_ISSUED with a CRITICAL corrective action left OPEN; due_at = issued + 10 days (2026-09-15T10:00:00Z); clock advanced past due_at and the sweep fires CERTIFIED ->
        SUSPENDED
