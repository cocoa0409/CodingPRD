              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /depots"
              payload: { name: "North Depot", lat: 0.0, lng: 0.2, bay_count: 1, cleanup_buffer_minutes: 30 }
              as: DispatchOperator
              captures: { depot_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_a_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_b_id: $.data.id }
            - call: "POST /depots/${depot_id}/bay-reservations"
              payload: { service_call_id: "${call_a_id}", reserved_from: "2026-06-01T10:00:00Z", reserved_until: "2026-06-01T11:00:00Z" }
              as: DispatchOperator
              captures: { resv_a_id: $.data.id }
          trigger:
            - call: "POST /depots/${depot_id}/bay-reservations"
              payload: { service_call_id: "${call_b_id}", reserved_from: "2026-06-01T11:15:00Z", reserved_until: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_NO_BAY_AVAILABLE"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: financial_balance_invariant_complete_then_approve_nets_to_zero
        grounds:
          - calculations.final_service_cost
          - calculations.reimbursement_payout
          - entities.Member.fields.outstanding_balance_cents
          - state_machines.ReimbursementClaim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Conserved quantity = money (outstanding_balance_cents): forward complete books +3000 then compensating approve of a 3000 claim subtracts 3000, leaving outstanding_balance_cents == 0 (sum of COMPLETED member_out_of_pocket minus sum of APPROVED payouts)."
        test_recipe:
          setup:
            - "A COMPLETED TOW call with member_out_of_pocket_cents=3000 (balance 3000). A claim for 3000 approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/start"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/complete"
              payload: { final_towed_miles: 20 }
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /reimbursement-claims"
              payload: { member_id: "${mem_id}", service_call_id: "${call_id}", claimed_amount_cents: 3000 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /reimbursement-claims/${claim_id}/begin-review"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /reimbursement-claims/${claim_id}/approve"
              payload: {}
              as: DispatchOperator
          assert:
            - "ReimbursementClaim.${claim_id}.approved_amount_cents == 3000"
            - "Member.${mem_id}.outstanding_balance_cents == 0"

      - name: bay_occupancy_invariant_reserve_then_release_returns_to_zero
        grounds:
          - entities.Depot.fields.occupied_bays
          - state_machines.BayReservation.ACTIVE_to_RELEASED
          - validations[priority=12]
        distinguishing_aspect: "Conserved quantity = bay-occupancy count (distinct type from money): forward reserve sets depot.occupied_bays to 1 then compensating release returns it to 0, restoring occupied_bays == count(ACTIVE reservations) == 0."
        test_recipe:
          setup:
            - "A depot bay_count=2, buffer=0. One ACTIVE reservation (occupied_bays=1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /depots"
              payload: { name: "South Depot", lat: 0.0, lng: 0.2, bay_count: 2, cleanup_buffer_minutes: 0 }
              as: DispatchOperator
              captures: { depot_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id }
            - call: "POST /depots/${depot_id}/bay-reservations"
              payload: { service_call_id: "${call_id}", reserved_from: "2026-06-01T10:00:00Z", reserved_until: "2026-06-01T11:00:00Z" }
              as: DispatchOperator
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /depots/${depot_id}/bay-reservations/${resv_id}/release"
              payload: {}
              as: DispatchOperator
          assert:
            - "BayReservation.${resv_id}.status == RELEASED"
            - "Depot.${depot_id}.occupied_bays == 0"
