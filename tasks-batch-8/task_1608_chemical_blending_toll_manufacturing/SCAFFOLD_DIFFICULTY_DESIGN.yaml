              as: QualityManager
              captures: { t11: $.data.id }
            - call: "POST /toll-operations/tanks/${t11}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-02T08:00:00Z", completed_at: "2026-08-02T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr11: $.data.id }
            - call: "POST /toll-operations/tanks/${t11}/cleaning-records/${cr11}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t11}/cleaning-records/${cr11}/validate"
