  # =====================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: runway_closure_buffered_half_open_overlap
        grounds:
          - calculations.closure_window_overlap
          - validations[priority=10]
          - errors[ERR_CLOSURE_CONFLICT]
        distinguishing_aspect: |
          Interval semantics A: buffered half-open conflict on RunwayClosure.
          A new closure [10:00, 12:00) conflicts with an existing AUTHORIZED
          closure [09:00, 10:15) because the 15-minute buffer on the existing
          closure's end (10:15 + 15min = 10:30) overlaps the new start. But
          [10:30, 12:00) would NOT conflict (adjacent after buffer).
        test_recipe:
          setup:
            - "Airport A; senior biologist B1; ATCController C1"
            - "Existing AUTHORIZED closure RC1 on runway 09L: 09:00 -> 10:15 (buffered end = 10:30)"
            - "New closure RC2 on same runway: 10:00 -> 12:00 (overlaps buffered RC1)"
            - "New closure RC3 on same runway: 10:30 -> 12:00 (adjacent after buffer — no conflict)"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KOOO", name: "Oscar Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-1401", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/atc-controllers"
              payload: { full_name: "C One", facility_id: "TWR-OOO", airport_id: "${ap_id}" }
              as: AirportAdmin
              captures: { c1_id: $.data.id }
            # RC1: 09:00 -> 10:15
            - call: "POST /wildlife/runway-closures"
              payload: { airport_id: "${ap_id}", runway_designator: "09L", requested_by_biologist_id: "${b1_id}", closure_start: "2026-08-01T09:00:00Z", closure_end: "2026-08-01T10:15:00Z", reason: "HAZARD_SWEEP" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { rc1_id: $.data.id }
            - call: "POST /wildlife/runway-closures/${rc1_id}/authorize"
              payload: {}
              as: ATCController
              as_user_id: "${c1_id}"
          trigger:
            # RC2: 10:00 -> 12:00 — conflicts with buffered RC1 (10:00 < 10:30)
            - call: "POST /wildlife/runway-closures"
              payload: { airport_id: "${ap_id}", runway_designator: "09L", requested_by_biologist_id: "${b1_id}", closure_start: "2026-08-01T10:00:00Z", closure_end: "2026-08-01T12:00:00Z", reason: "STRIKE_RESPONSE" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { err_rc2: $.data.error_id }
            # RC3: 10:30 -> 12:00 — adjacent after buffer, no conflict
            - call: "POST /wildlife/runway-closures"
              payload: { airport_id: "${ap_id}", runway_designator: "09L", requested_by_biologist_id: "${b1_id}", closure_start: "2026-08-01T10:30:00Z", closure_end: "2026-08-01T12:00:00Z", reason: "STRIKE_RESPONSE" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { rc3_id: $.data.id }
          assert:
            - "RC2 creation fails with HTTP 409, error_id == ERR_CLOSURE_CONFLICT (10:00 < buffered_end 10:30)"
            - "RC3 creation succeeds with HTTP 201 (10:30 >= buffered_end 10:30, half-open semantics)"
            - "RunwayClosure.${rc3_id}.status == REQUESTED"

      - name: permit_validity_window_inclusive_boundary
        grounds:
          - calculations.permit_take_reconciliation
          - validations[priority=18]
          - errors[ERR_PERMIT_OUTSIDE_WINDOW]
        distinguishing_aspect: |
          Different interval semantics B: TakePermit validity window is
          INCLUSIVE on both ends ([valid_from, valid_to]). A dispersal at
          exactly valid_from or exactly valid_to is accepted; one at
          valid_to + 1 day is rejected. This differs from the runway
          closure's half-open buffered semantics.
        test_recipe:
          setup:
            - "Airport A; senior B1; non-senior B2; RegulatorAgent R"
            - "Species S1 LOW risk"
            - "TakePermit P ACTIVE, valid_from=2026-07-01, valid_to=2026-07-31"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KPPP", name: "Papa Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "House Sparrow", scientific_name: "Passer domesticus", guild: "SONGBIRD", risk_tier: "LOW", body_mass_g: 30, is_protected_federally: false }
              as: AirportAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-1501", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-1502", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /wildlife/regulators"
              payload: { full_name: "R One", agency: "USFWS", badge_number: "USFWS-9401" }
              as: AirportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /wildlife/take-permits"
              payload: { airport_id: "${ap_id}", species_id: "${sp_id}", issued_by_regulator_id: "${r_id}", permit_number: "MB0004-00", authorized_take_total: 10, valid_from: "2026-07-01", valid_to: "2026-07-31" }
              as: RegulatorAgent
              as_user_id: "${r_id}"
              captures: { tp_id: $.data.id }
            - call: "GET /wildlife/take-permits/${tp_id}"
              as: RegulatorAgent
              as_user_id: "${r_id}"
          trigger:
            # Dispersal at exactly valid_from (inclusive — OK)
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-01T00:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 5, animals_taken_lethal: 1, take_permit_id: "${tp_id}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { d_ok1: $.data.id }
            # Dispersal at exactly valid_to (inclusive — OK)
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-31T23:59:59Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 3, animals_taken_lethal: 1, take_permit_id: "${tp_id}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { d_ok2: $.data.id }
            # Dispersal one day past valid_to (excluded — fails)
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-08-01T00:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 2, animals_taken_lethal: 1, take_permit_id: "${tp_id}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { err_d: $.data.error_id }
          assert:
            - "Dispersal at valid_from succeeds (HTTP 201)"
            - "Dispersal at valid_to succeeds (HTTP 201)"
            - "Dispersal at valid_to + 1 day fails with HTTP 422, error_id == ERR_PERMIT_OUTSIDE_WINDOW"
            - "TakePermit validity uses inclusive [valid_from, valid_to] semantics, distinct from runway closure half-open"

  # =====================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: permit_take_consumed_invariant_after_close_and_revoke
        grounds:
          - calculations.permit_take_reconciliation
          - state_machines.TakePermit.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity: TakePermit.take_consumed. Forward action:
          DispersalActivity close increments take_consumed by
          animals_taken_lethal. Compensating action: permit revocation does
          NOT decrement take_consumed (the take physically happened). The
          invariant is: at any time, take_consumed == sum of
          animals_taken_lethal over all CLOSED DispersalActivity referencing
          this permit, regardless of permit status.
        test_recipe:
          setup:
            - "Airport A; senior B1; non-senior B2; RegulatorAgent R"
            - "Species S1 LOW risk"
            - "TakePermit P ACTIVE, authorized_take_total=10"
            - "D1 CLOSED with take=3; D2 LOGGED with take=2"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KQQQ", name: "Quebec Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "House Sparrow", scientific_name: "Passer domesticus", guild: "SONGBIRD", risk_tier: "LOW", body_mass_g: 30, is_protected_federally: false }
              as: AirportAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-1601", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-1602", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /wildlife/regulators"
              payload: { full_name: "R One", agency: "USFWS", badge_number: "USFWS-9501" }
              as: AirportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /wildlife/take-permits"
              payload: { airport_id: "${ap_id}", species_id: "${sp_id}", issued_by_regulator_id: "${r_id}", permit_number: "MB0005-00", authorized_take_total: 10, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: RegulatorAgent
              as_user_id: "${r_id}"
              captures: { tp_id: $.data.id }
            - call: "GET /wildlife/take-permits/${tp_id}"
              as: RegulatorAgent
              as_user_id: "${r_id}"
            # D1: take 3, close
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-15T10:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 5, animals_taken_lethal: 3, take_permit_id: "${tp_id}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /wildlife/dispersal-activities/${d1_id}/review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/dispersal-activities/${d1_id}/close"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            # D2: take 2, leave LOGGED
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-16T10:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 3, animals_taken_lethal: 2, take_permit_id: "${tp_id}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { d2_id: $.data.id }
          trigger:
            # Revoke permit
            - call: "POST /wildlife/take-permits/${tp_id}/revoke"
              payload: {}
              as: RegulatorAgent
              as_user_id: "${r_id}"
            - call: "GET /wildlife/take-permits/${tp_id}"
              as: RegulatorAgent
              as_user_id: "${r_id}"
              captures: { tp_consumed: $.data.take_consumed, tp_status: $.data.status }
            - call: "GET /wildlife/dispersal-activities/${d2_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { d2_status: $.data.status }
          assert:
            - "TakePermit.take_consumed == 3 after revocation (invariant: only CLOSED dispersals count)"
            - "TakePermit.status == REVOKED"
            - "DispersalActivity.${d2_id}.status == FLAGGED"
            - "The revocation did NOT decrement take_consumed — the conserved quantity is preserved"

      - name: airport_hazard_level_recompute_invariant_after_strike_reject
        grounds:
          - calculations.airport_hazard_level
          - calculations.rolling_strike_window
          - state_machines.WildlifeStrikeReport.UNDER_REVIEW_to_REJECTED
        distinguishing_aspect: |
          Conserved quantity: Airport.strikes_trailing_12m. Forward action:
          strike confirm increments the count. Compensating action: strike
          reject does NOT decrement the count (the rejected strike was never
          in the CONFIRMED set). The invariant is: strikes_trailing_12m ==
          count of CONFIRMED strikes in window at all times, and a reject
          leaves it unchanged from the pre-confirm baseline.
        test_recipe:
          setup:
            - "Airport A; senior B1; non-senior B2"
            - "Species S1 MEDIUM risk"
            - "5 CONFIRMED strikes in window; strikes_trailing_12m == 5"
            - "One strike SR in UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KRRR", name: "Romeo Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "Ring-billed Gull", scientific_name: "Larus delawarensis", guild: "GULL", risk_tier: "MEDIUM", body_mass_g: 550, is_protected_federally: true }
              as: AirportAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-1701", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
