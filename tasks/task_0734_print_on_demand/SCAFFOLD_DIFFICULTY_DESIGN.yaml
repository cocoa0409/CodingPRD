  # ==========================================================================
  # Rule 4 — transitive_cascade (≥2 instances, depth ≥3 and ≥2, different triggers)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: design_reject_cascades_listing_archive_then_order_cancel_depth3
        grounds:
          - state_machines.Design.MOCKUP_READY_to_REJECTED
          - entities.Listing.fields.status
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /pod/designs/{id}/reject. Link 1: Design.status
          -> REJECTED. Link 2 (caused by 1): Listing.status DRAFT/PUBLISHED -> ARCHIVED. Link 3
          (caused by 2): Order.fulfillment_status PENDING -> CANCELLED AND payment_status
          AUTHORIZED -> VOIDED. Each hop is caused by the previous, not by the reject action
          directly.
        test_recipe:
          setup:
            - "One MOCKUP_READY Design under Creator G."
            - "One PUBLISHED Listing referencing that Design."
            - "One AUTHORIZED (payment) / PENDING (fulfillment) Order against that Listing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/fulfillment-partners"
