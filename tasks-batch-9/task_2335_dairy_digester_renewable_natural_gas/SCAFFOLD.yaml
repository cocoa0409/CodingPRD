scenario: "2335. Dairy Digester & Renewable Natural Gas Project (dairy anaerobic digestion project): feedstock agreements with dairies covering manure supply volumes, solids content and duration, digester operation with loading rates, temperature control and biological stability monitoring, biogas conditioning to pipeline quality with hydrogen sulfide, moisture and carbon dioxide removal, pipeline interconnection agreement with gas quality specifications and injection scheduling, environmental credit generation under low carbon fuel and renewable fuel programs with pathway certification, carbon intensity score calculation and verification with annual audits, digestate handling with solids separation, bedding recovery and nutrient management, revenue sharing with dairy partners and project financing covenants"
domain_name: "dairy-digester-rng"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "beyond_expert"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Dairy
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the dairy operation"
      - name: county
        type: string
        source: input
        description: "County the dairy operates in"
      - name: herd_size
        type: integer
        source: input
        description: "Milking herd head count"
        constraints: "> 0"
      - name: manure_management_baseline
        type: enum
        source: input
        description: "Pre-project manure handling baseline that sets the methane conversion factor"
        constraints: "LAGOON | SOLID_STORAGE | DAILY_SPREAD"
      - name: haul_distance_km
        type: number
        source: input
        description: "One-way haul distance from dairy to digester, 1 decimal place"
        constraints: ">= 0"
      - name: annual_nitrogen_budget_kg
        type: number
        source: input
        description: "Agronomic plant-available-nitrogen ceiling per calendar year across all land units of this dairy, 3 decimal places"
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle derived from the count of ACTIVE feedstock agreements naming this dairy"
        default: "PROSPECT"
        constraints: "PROSPECT | CONTRACTED | SUSPENDED"
      - name: active_agreement_count
        type: integer
        source: computed
        description: "Number of FeedstockAgreement rows with dairy_id equal to this Dairy.id and status == ACTIVE"
        default: 0
      - name: contracted_agreement_count
        type: integer
        source: computed
        description: "Number of FeedstockAgreement rows with dairy_id equal to this Dairy.id and status IN {ACTIVE, SUSPENDED}"
        default: 0
      - name: pan_applied_ytd_kg
        type: number
        source: computed
        description: "Sum of NutrientApplication.plant_available_nitrogen_kg for this dairy with status == APPLIED whose application_start_date falls in the same calendar year as the logical clock, 3 decimal places"
        default: 0

  - name: DigesterFacility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Facility name"
      - name: digester_volume_m3
        type: number
        source: input
        description: "Active digester working volume in cubic metres, used as the organic-loading-rate denominator"
        constraints: "> 0"
      - name: hydraulic_capacity_tonnes_per_day
        type: number
        source: input
        description: "Maximum accepted wet feedstock tonnage per operations day, 3 decimal places"
        constraints: "> 0"
      - name: thermal_regime
        type: enum
        source: input
        description: "Digester temperature regime that selects the design organic loading rate limit"
        constraints: "MESOPHILIC | THERMOPHILIC"
      - name: target_temperature_c
        type: number
        source: input
        description: "Set-point digester temperature in Celsius, 1 decimal place"
      - name: design_max_olr
        type: number
        source: computed
        description: "Design organic loading rate ceiling in kg VS per m3 per day, 3 decimal places; set from thermal_regime at creation via calculations.design_olr_limit"
      - name: ops_posture
        type: enum
        source: computed
        description: "Operational posture dimension derived from the most recently closed OperationsDay stability_status"
        default: "STABLE"
        constraints: "STABLE | WATCH | RESTRICTED | UPSET"
      - name: distribution_posture
        type: enum
        source: computed
        description: "Financing-covenant posture dimension derived from dscr_current versus dscr_minimum"
        default: "OPEN"
        constraints: "OPEN | RESTRICTED | LOCKED"
      - name: posture_override_active
        type: boolean
        source: computed
        description: "When true a LOCKED distribution posture is downgraded to RESTRICTED; set by POST /facilities/{id}/posture-override"
        default: false
      - name: reserve_target_cents
        type: integer
        source: input
        description: "Debt-service reserve account funding target in cents"
        constraints: ">= 0"
      - name: reserve_balance_cents
        type: integer
        source: computed
        description: "Current debt-service reserve balance in cents; increased by POST /facilities/{id}/reserve-funding and by revenue-statement reserve sweeps"
        default: 0
      - name: annual_debt_service_cents
        type: integer
        source: input
        description: "Scheduled annual principal plus interest in cents, the debt-service-coverage-ratio denominator"
        constraints: "> 0"
      - name: dscr_minimum
        type: number
        source: input
        description: "Covenant minimum debt-service coverage ratio, 3 decimal places"
        constraints: "> 0"
      - name: dscr_current
        type: number
        source: computed
        description: "Most recent debt-service coverage ratio, 3 decimal places; recomputed by calculations.dscr_and_distribution_posture"
        default: 0
      - name: total_manure_received_tonnes
        type: number
        source: computed
        description: "Sum of FeedstockDelivery.net_tonnes with status == ACCEPTED across all OperationsDay rows of this facility, 3 decimal places"
        default: 0
      - name: unseparated_manure_tonnes
        type: number
        source: computed
        description: "Sum of FeedstockDelivery.net_tonnes with status == ACCEPTED on OperationsDay rows of this facility whose separation_recorded == false, 3 decimal places"
        default: 0
      - name: digestate_solids_produced_tonnes
        type: number
        source: computed
        description: "Sum of OperationsDay.digestate_solids_tonnes over OperationsDay rows of this facility whose separation_recorded == true, 3 decimal places"
        default: 0
      - name: digestate_liquid_produced_tonnes
        type: number
        source: computed
        description: "Sum of OperationsDay.digestate_liquid_tonnes over OperationsDay rows of this facility whose separation_recorded == true, 3 decimal places"
        default: 0
      - name: digestate_solids_applied_tonnes
        type: number
        source: computed
        description: "Sum of NutrientApplication.solids_tonnes_applied with status == APPLIED for this facility, 3 decimal places"
        default: 0
      - name: digestate_liquid_applied_tonnes
        type: number
        source: computed
        description: "Sum of NutrientApplication.liquid_tonnes_applied with status == APPLIED for this facility, 3 decimal places"
        default: 0
      - name: digestate_solids_on_hand_tonnes
        type: number
        source: computed
        description: "digestate_solids_produced_tonnes minus digestate_solids_applied_tonnes, 3 decimal places"
        default: 0
      - name: digestate_liquid_on_hand_tonnes
        type: number
        source: computed
        description: "digestate_liquid_produced_tonnes minus digestate_liquid_applied_tonnes, 3 decimal places"
        default: 0
      - name: mass_control_residual_tonnes
        type: number
        source: computed
        description: "MASS_CONTROL conserved quantity, 3 decimal places; equals total_manure_received_tonnes minus unseparated_manure_tonnes minus digestate_solids_produced_tonnes minus digestate_liquid_produced_tonnes and MUST always equal 0.000"
        default: 0
      - name: gross_revenue_to_date_cents
        type: integer
        source: computed
        description: "Sum of RevenueStatement.gross_revenue_cents for this facility with status IN {DRAFT, APPROVED, PAID}"
        default: 0
      - name: dairy_share_paid_cents
        type: integer
        source: computed
        description: "Sum of RevenueStatement.total_dairy_share_cents for this facility with status == PAID"
        default: 0
      - name: retained_to_date_cents
        type: integer
        source: computed
        description: "Sum of RevenueStatement.retained_cents for this facility with status == PAID"
        default: 0

  - name: FeedstockAgreement
    parent: null
    common_fields: true
    fields:
      - name: dairy_id
        type: string
        source: input
        description: "FK -> Dairy.id; the manure supplier bound by this agreement"
      - name: facility_id
        type: string
        source: input
        description: "FK -> DigesterFacility.id; the digester receiving the manure"
      - name: committed_tonnes_per_day
        type: number
        source: input
        description: "Contracted wet manure supply volume per day, 3 decimal places; also the residual-cent allocation sort key"
        constraints: "> 0"
      - name: minimum_total_solids_pct
        type: number
        source: input
        description: "Minimum acceptable total solids percentage of delivered manure, 1 decimal place"
        constraints: "> 0 and < 100"
      - name: term_start_date
        type: string
        source: input
        description: "Inclusive first calendar date the agreement may receive deliveries, YYYY-MM-DD"
      - name: term_end_date
        type: string
        source: input
        description: "Inclusive last calendar date the agreement may receive deliveries, YYYY-MM-DD"
      - name: revenue_share_pct
        type: number
        source: input
        description: "Dairy revenue share as a decimal fraction, 4 decimal places"
        constraints: "> 0 and <= 0.95"
      - name: revenue_share_basis
        type: enum
        source: input
        description: "Whether the share applies to RevenueStatement.net_distributable_cents (NET) or RevenueStatement.gross_revenue_cents (GROSS)"
        constraints: "NET | GROSS"
      - name: curtailable
        type: boolean
        source: input
        description: "When true this agreement is suspended by the facility UPSET cascade; when false it survives an upset"
      - name: status
        type: enum
        source: computed
        description: "Negotiation and service lifecycle state"
        default: "DRAFT"
        constraints: "DRAFT | PENDING_DAIRY_SIGNATURE | COUNTERED | ACTIVE | SUSPENDED | TERMINATED"
      - name: negotiation_round
        type: integer
        source: computed
        description: "Count of completed dairy counters; incremented by POST /feedstock-agreements/{id}/counter"
        default: 0
      - name: countered_tonnes_per_day
        type: number
        source: computed
        description: "Volume the dairy asked for in the most recent counter, 3 decimal places; null until first counter"
      - name: countered_revenue_share_pct
        type: number
        source: computed
        description: "Revenue share the dairy asked for in the most recent counter, 4 decimal places; null until first counter"
      - name: suspension_reason
        type: enum
        source: computed
        description: "Why the agreement is SUSPENDED; null in every other status"
        constraints: "OPS_UPSET | COMPLIANCE | null"
      - name: signed_at
        type: datetime
        source: computed
        description: "Logical-clock timestamp when the dairy signed; null until signature"

  - name: FeedstockDelivery
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FeedstockAgreement.id; the supply agreement this load is booked against"
      - name: ops_day_id
        type: string
        source: input
        description: "FK -> OperationsDay.id; the operations day the load is received on"
      - name: gross_tonnes
        type: number
        source: input
        description: "Loaded weight in tonnes, 3 decimal places"
        constraints: "> 0"
      - name: tare_tonnes
        type: number
        source: input
        description: "Tare deduction in tonnes, 3 decimal places"
        default: 0
        constraints: ">= 0 and < gross_tonnes"
      - name: total_solids_pct
        type: number
        source: input
        description: "Measured total solids percentage of the load, 1 decimal place"
        constraints: "> 0 and < 100"
      - name: volatile_solids_pct_of_ts
        type: number
        source: input
        description: "Volatile solids as a percentage of total solids, 1 decimal place"
        constraints: "> 0 and <= 100"
      - name: net_tonnes
        type: number
        source: computed
        description: "gross_tonnes minus tare_tonnes, 3 decimal places"
      - name: vs_tonnes
        type: number
        source: computed
        description: "Volatile solids mass in tonnes, 3 decimal places; net_tonnes * total_solids_pct/100 * volatile_solids_pct_of_ts/100"
      - name: haul_tonne_km
        type: number
        source: computed
        description: "net_tonnes multiplied by the supplying Dairy.haul_distance_km, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: "ACCEPTED on creation; REJECTED by operator action; CANCELLED by the facility UPSET cascade"
        default: "ACCEPTED"
        constraints: "ACCEPTED | REJECTED | CANCELLED"
      - name: rejection_reason
        type: enum
        source: computed
        description: "Reason recorded by POST /feedstock-deliveries/{id}/reject, or AGREEMENT_SUSPENDED when cancelled by cascade; null while ACCEPTED"
        constraints: "OFF_SPEC_SOLIDS | CONTAMINATION | SCALE_ERROR | AGREEMENT_SUSPENDED | null"

  - name: OperationsDay
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> DigesterFacility.id; the digester this operating day belongs to"
      - name: ops_date
        type: string
        source: input
        description: "Calendar date of the operating day, YYYY-MM-DD; unique per facility_id"
      - name: status
        type: enum
        source: computed
        description: "Bookkeeping dimension of the parallel state machine"
        default: "OPEN"
        constraints: "OPEN | CLOSED"
      - name: gas_state
        type: enum
        source: computed
        description: "Gas dimension of the parallel state machine, evolving independently of status"
        default: "NOT_PRODUCED"
        constraints: "NOT_PRODUCED | RAW | PIPELINE_SPEC | OFFSPEC | FLARED | INJECTED"
      - name: avg_digester_temp_c
        type: number
        source: computed
        description: "Daily average digester temperature in Celsius recorded at close, 1 decimal place; null while OPEN"
      - name: temp_excursion_minutes
        type: integer
        source: computed
        description: "Minutes outside the target temperature band recorded at close; null while OPEN"
      - name: vfa_mg_per_l
        type: number
        source: computed
        description: "Volatile fatty acid concentration in mg/L recorded at close, 1 decimal place; null while OPEN"
      - name: alkalinity_mg_per_l
        type: number
        source: computed
        description: "Total alkalinity as mg/L CaCO3 recorded at close, 1 decimal place; null while OPEN"
      - name: organic_loading_rate
        type: number
        source: computed
        description: "kg VS per m3 per day, 3 decimal places; output of calculations.organic_loading_rate"
        default: 0
      - name: vfa_alkalinity_ratio
        type: number
        source: computed
        description: "vfa_mg_per_l divided by alkalinity_mg_per_l, 3 decimal places; null while OPEN"
      - name: thermal_status
        type: enum
        source: computed
        description: "Temperature control classification produced at close"
        constraints: "IN_BAND | EXCURSION | CRITICAL | null"
      - name: stress_points
        type: integer
        source: computed
        description: "Biological stress score 0..6 produced by calculations.biological_stability_assessment"
      - name: stability_status
        type: enum
        source: computed
        description: "Biological stability classification produced at close; drives the facility ops_posture cascade"
        constraints: "STABLE | STRESSED | INHIBITED | null"
      - name: raw_biogas_scf
        type: number
        source: computed
        description: "Raw biogas volume in standard cubic feet recorded at close, 3 decimal places"
        default: 0
      - name: raw_ch4_pct
        type: number
        source: computed
        description: "Methane percentage of raw biogas recorded at close, 1 decimal place"
      - name: raw_co2_pct
        type: number
        source: computed
        description: "Carbon dioxide percentage of raw biogas recorded at close, 1 decimal place"
      - name: raw_h2s_ppm
        type: number
        source: computed
        description: "Hydrogen sulfide concentration of raw biogas in ppmv recorded at close, 1 decimal place"
      - name: raw_moisture_lb_per_mmscf
        type: number
        source: computed
        description: "Water content of raw biogas in lb per MMscf recorded at close, 1 decimal place"
      - name: raw_gas_mmbtu
        type: number
        source: computed
        description: "Raw biogas energy in MMBtu, 3 decimal places; raw_biogas_scf * raw_hhv_btu_per_scf / 1e6"
        default: 0
      - name: raw_hhv_btu_per_scf
        type: number
        source: computed
        description: "Higher heating value of raw biogas, 2 decimal places; raw_ch4_pct/100 * CH4_HHV_BTU_PER_SCF"
      - name: conditioning_attempts
        type: integer
        source: computed
        description: "Count of POST /ops-days/{id}/condition-gas calls with disposition == RECONDITION applied to this day"
        default: 0
      - name: treated_ch4_pct
        type: number
        source: computed
        description: "Methane percentage after conditioning, 1 decimal place; null until first conditioning"
      - name: treated_co2_pct
        type: number
        source: computed
        description: "Carbon dioxide percentage after conditioning, 1 decimal place; null until first conditioning"
      - name: treated_h2s_ppm
        type: number
        source: computed
        description: "Hydrogen sulfide in ppmv after conditioning, 1 decimal place; null until first conditioning"
      - name: treated_moisture_lb_per_mmscf
        type: number
        source: computed
        description: "Water content in lb per MMscf after conditioning, 1 decimal place; null until first conditioning"
      - name: pipeline_hhv_btu_per_scf
        type: number
        source: computed
        description: "Higher heating value of conditioned gas, 2 decimal places; treated_ch4_pct/100 * CH4_HHV_BTU_PER_SCF"
      - name: pipeline_gas_scf
        type: number
        source: computed
        description: "Conditioned gas volume in standard cubic feet, 3 decimal places"
        default: 0
      - name: pipeline_gas_mmbtu
        type: number
        source: computed
        description: "Conditioned gas energy in MMBtu, 3 decimal places; output of calculations.gas_conditioning_yield"
        default: 0
      - name: offspec_reason
        type: enum
        source: computed
        description: "First failing pipeline specification in the pinned evaluation order H2S then MOISTURE then CO2 then HHV; null when the conditioned gas meets specification"
        constraints: "H2S | MOISTURE | CO2 | HHV | null"
      - name: separation_recorded
        type: boolean
        source: computed
        description: "True once POST /ops-days/{id}/record-separation has run and not been undone by a reopen"
        default: false
      - name: solids_capture_pct
        type: number
        source: computed
        description: "Screw-press total-solids capture efficiency percentage recorded at separation, 1 decimal place"
      - name: bedding_recovery_pct
        type: number
        source: computed
        description: "Fraction of separated cake recovered as animal bedding, percentage with 1 decimal place"
      - name: digestate_solids_tonnes
        type: number
        source: computed
        description: "Separated cake mass in tonnes, 3 decimal places; output of calculations.digestate_separation"
        default: 0
      - name: digestate_liquid_tonnes
        type: number
        source: computed
        description: "Liquid digestate mass in tonnes, 3 decimal places; output of calculations.digestate_separation"
        default: 0
      - name: bedding_recovered_tonnes
        type: number
        source: computed
        description: "Bedding recovered from the cake in tonnes, 3 decimal places"
        default: 0
      - name: lab_total_nitrogen_mg_per_l
        type: number
        source: computed
        description: "Laboratory total nitrogen of the liquid digestate in mg/L recorded at separation, 1 decimal place"
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of times this day has been reopened after closing"
        default: 0

  - name: InterconnectAgreement
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> DigesterFacility.id; the injecting facility"
      - name: pipeline_operator_name
        type: string
        source: input
        description: "Receiving pipeline operator"
      - name: max_h2s_ppm
        type: number
        source: input
        description: "Maximum hydrogen sulfide in ppmv accepted at the interconnect, 1 decimal place"
        constraints: "> 0"
      - name: max_moisture_lb_per_mmscf
        type: number
        source: input
        description: "Maximum water content in lb per MMscf accepted at the interconnect, 1 decimal place"
        constraints: "> 0"
      - name: max_co2_pct
        type: number
        source: input
        description: "Maximum carbon dioxide percentage accepted at the interconnect, 1 decimal place"
        constraints: "> 0"
      - name: min_hhv_btu_per_scf
        type: number
        source: input
        description: "Minimum higher heating value accepted at the interconnect, 2 decimal places"
        constraints: "> 0"
      - name: max_hourly_injection_mmbtu
        type: number
        source: input
        description: "Maximum injection rate in MMBtu per hour, 3 decimal places"
        constraints: "> 0"
      - name: ramp_buffer_minutes
        type: integer
        source: input
        description: "Symmetric ramp buffer applied to both ends of every nomination window for overlap detection"
        constraints: ">= 0"
      - name: nomination_lead_hours
        type: integer
        source: input
        description: "Minimum whole hours between the logical clock and window_start_utc when a nomination is created"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Interconnect lifecycle; SUSPENDED by the off-spec curtailment cascade at CURTAILMENT_SUSPEND_THRESHOLD"
        default: "ACTIVE"
        constraints: "ACTIVE | SUSPENDED | TERMINATED"
      - name: curtailment_count
        type: integer
        source: computed
        description: "Cumulative count of nominations moved to REJECTED_OFFSPEC or CURTAILED on this interconnect"
        default: 0

  - name: InjectionNomination
    parent: null
    common_fields: true
    fields:
      - name: interconnect_id
        type: string
        source: input
        description: "FK -> InterconnectAgreement.id; the interconnect the gas is nominated into"
      - name: ops_day_id
        type: string
        source: input
        description: "FK -> OperationsDay.id; the operations day supplying the conditioned gas"
      - name: window_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the half-open injection window"
      - name: window_end_utc
        type: datetime
        source: input
        description: "Exclusive end of the half-open injection window"
      - name: nominated_mmbtu
        type: number
        source: input
        description: "Energy nominated for injection in MMBtu, 3 decimal places"
        constraints: "> 0"
      - name: window_minutes
        type: integer
        source: computed
        description: "Whole minutes between window_start_utc and window_end_utc"
      - name: hourly_rate_mmbtu
        type: number
        source: computed
        description: "nominated_mmbtu divided by window_minutes/60, 3 decimal places"
      - name: status
        type: enum
        source: computed
        description: "Nomination lifecycle"
        default: "NOMINATED"
        constraints: "NOMINATED | CONFIRMED | CURTAILED | DELIVERED | REJECTED_OFFSPEC"
      - name: confirmed_mmbtu
        type: number
        source: computed
        description: "Energy the scheduler confirmed, 3 decimal places; null until a schedule decision"
      - name: delivered_mmbtu
        type: number
        source: computed
        description: "Energy actually injected, 3 decimal places; null until delivery"

  - name: CreditPathway
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> DigesterFacility.id; the facility whose gas the pathway covers"
      - name: program
        type: enum
        source: input
        description: "Environmental credit program the pathway generates under"
        constraints: "LCFS | RFS_D3"
      - name: pathway_code
        type: string
        source: input
        description: "Regulator-assigned pathway identifier"
      - name: reference_start_date
        type: string
        source: computed
        description: "Inclusive first ops_date of the certification reference window, YYYY-MM-DD; null until certified"
      - name: reference_end_date
        type: string
        source: computed
        description: "Inclusive last ops_date of the certification reference window, YYYY-MM-DD; null until certified"
      - name: status
        type: enum
        source: computed
        description: "Pathway certification lifecycle"
        default: "PROVISIONAL"
        constraints: "PROVISIONAL | CERTIFIED | SUSPENDED | REVOKED"
      - name: certified_ci_score
        type: number
        source: computed
        description: "Carbon intensity in g CO2e/MJ from the CERTIFIED variant of calculations.pathway_ci_score, 2 decimal places; null until certified"
      - name: verified_ci_score
        type: number
        source: computed
        description: "Carbon intensity from the VERIFIED variant of calculations.pathway_ci_score, 2 decimal places; null until an audit issues findings"
      - name: ci_adjustment
        type: number
        source: computed
        description: "verified_ci_score minus certified_ci_score, 2 decimal places; null until an audit issues findings"
      - name: credits_issued_total
        type: number
        source: computed
        description: "Sum of CreditBatch.credit_quantity_final over batches of this pathway that have ever reached ISSUED, 3 decimal places"
        default: 0
      - name: credits_reversed_total
        type: number
        source: computed
        description: "Sum of CreditBatch.credit_quantity_final over batches of this pathway with status == REVERSED, 3 decimal places"
        default: 0
      - name: credits_outstanding
        type: number
        source: computed
        description: "Sum of CreditBatch.credit_quantity_final over batches of this pathway with status == ISSUED, 3 decimal places"
        default: 0
      - name: credit_control_residual
        type: number
        source: computed
        description: "CREDIT_CONTROL conserved quantity, 3 decimal places; equals credits_issued_total minus credits_reversed_total minus credits_outstanding and MUST always equal 0.000"
        default: 0

  - name: CreditBatch
    parent: null
    common_fields: true
    fields:
      - name: pathway_id
        type: string
        source: input
        description: "FK -> CreditPathway.id; the certified pathway the batch claims under"
      - name: facility_id
        type: string
        source: input
        description: "FK -> DigesterFacility.id; denormalised facility of the pathway, validated to match"
      - name: period_start_date
        type: string
        source: input
        description: "Inclusive first ops_date included in the batch, YYYY-MM-DD"
      - name: period_end_date
        type: string
        source: input
        description: "Inclusive last ops_date included in the batch, YYYY-MM-DD"
      - name: superseded_by_batch_id
        type: string
        source: computed
        description: "FK -> CreditBatch.id; set on a DRAFT batch when a newer batch on the same pathway with an overlapping period supersedes it; null otherwise"
      - name: status
        type: enum
        source: computed
        description: "Credit batch lifecycle"
        default: "DRAFT"
        constraints: "DRAFT | CLAIMED | VERIFIED | ISSUED | REVERSED | SUPERSEDED"
      - name: delivered_mmbtu
        type: number
        source: computed
        description: "Sum of InjectionNomination.delivered_mmbtu for nominations with status == DELIVERED whose OperationsDay.facility_id equals facility_id and whose ops_date lies in the batch period, 3 decimal places"
        default: 0
      - name: ci_score_used
        type: number
        source: computed
        description: "Carbon intensity actually applied to this batch, 2 decimal places"
      - name: credit_quantity_provisional
        type: number
        source: computed
        description: "PROVISIONAL variant output of calculations.credit_quantity, 3 decimal places"
      - name: credit_quantity_final
        type: number
        source: computed
        description: "FINAL variant output of calculations.credit_quantity, 3 decimal places; null until verification"
      - name: credit_value_cents
        type: integer
        source: computed
        description: "Monetised credit value in cents; null until verification"
      - name: reversal_reason
        type: enum
        source: computed
        description: "Why the batch was reversed; null unless status == REVERSED"
        constraints: "MATERIAL_FINDING | REGULATOR_ORDER | OPERATOR_WITHDRAWAL | null"

  - name: VerificationAudit
    parent: null
    common_fields: true
    fields:
      - name: pathway_id
        type: string
        source: input
        description: "FK -> CreditPathway.id; the pathway under annual verification"
      - name: audit_year
        type: integer
        source: input
        description: "Calendar year being verified"
      - name: verifier_body_name
        type: string
        source: input
        description: "Accredited verification body performing the audit"
      - name: status
        type: enum
        source: computed
        description: "Audit lifecycle with a remediation loop back to FIELDWORK"
        default: "FIELDWORK"
        constraints: "FIELDWORK | FINDINGS_ISSUED | REMEDIATION | CLOSED"
      - name: actual_pipeline_mmbtu
        type: number
        source: computed
        description: "Audited pipeline energy for the reference window in MMBtu, 3 decimal places; recorded by POST /verification-audits/{id}/fieldwork"
      - name: actual_vs_tonnes_lagoon
        type: number
        source: computed
        description: "Audited volatile solids tonnage sourced from LAGOON-baseline dairies, 3 decimal places"
      - name: actual_vs_tonnes_solid_storage
        type: number
        source: computed
        description: "Audited volatile solids tonnage sourced from SOLID_STORAGE-baseline dairies, 3 decimal places"
      - name: actual_vs_tonnes_daily_spread
        type: number
        source: computed
        description: "Audited volatile solids tonnage sourced from DAILY_SPREAD-baseline dairies, 3 decimal places"
      - name: actual_haul_tonne_km
        type: number
        source: computed
        description: "Audited hauling activity in tonne-kilometres, 2 decimal places"
      - name: actual_process_g_per_mj
        type: number
        source: computed
        description: "Audited parasitic process emissions in g CO2e/MJ, 2 decimal places"
      - name: reported_ci_score
        type: number
        source: computed
        description: "VERIFIED variant output of calculations.pathway_ci_score from the fieldwork actuals, 2 decimal places; null until fieldwork is recorded"
      - name: ci_delta
        type: number
        source: computed
        description: "reported_ci_score minus CreditPathway.certified_ci_score, 2 decimal places; null until fieldwork is recorded"
      - name: finding_severity
        type: enum
        source: computed
        description: "Severity classification produced by POST /verification-audits/{id}/findings from abs(ci_delta)"
        constraints: "NONE | MINOR | MATERIAL | null"
      - name: remediation_round
        type: integer
        source: computed
        description: "Count of completed remediation loops; capped by MAX_REMEDIATION_ROUNDS"
        default: 0

  - name: NutrientApplication
    parent: null
    common_fields: true
    fields:
      - name: dairy_id
        type: string
        source: input
        description: "FK -> Dairy.id; the dairy whose cropland receives the digestate and whose nitrogen budget is charged"
      - name: facility_id
        type: string
        source: input
        description: "FK -> DigesterFacility.id; the facility whose digestate inventory is drawn down"
      - name: ops_day_id
        type: string
        source: input
        description: "FK -> OperationsDay.id; the separation event supplying the applied digestate and its laboratory nitrogen result"
      - name: land_unit_code
        type: string
        source: input
        description: "Field identifier within the dairy, the resource whose application intervals must not collide"
      - name: application_start_date
        type: string
        source: input
        description: "Inclusive first calendar date of the application window, YYYY-MM-DD"
      - name: application_end_date
        type: string
        source: input
        description: "Inclusive last calendar date of the application window, YYYY-MM-DD"
      - name: solids_tonnes_applied
        type: number
        source: input
        description: "Separated cake applied in tonnes, 3 decimal places"
        constraints: ">= 0"
      - name: liquid_tonnes_applied
        type: number
        source: input
        description: "Liquid digestate applied in tonnes, 3 decimal places"
        constraints: ">= 0"
      - name: pan_basis
        type: enum
        source: input
        description: "Which variant of calculations.plant_available_nitrogen applies"
        constraints: "LAB | AGRONOMIC"
      - name: liquid_total_nitrogen_kg
        type: number
        source: computed
        description: "Total nitrogen in the applied liquid fraction in kg, 3 decimal places"
      - name: solids_total_nitrogen_kg
        type: number
        source: computed
        description: "Total nitrogen in the applied cake fraction in kg, 3 decimal places"
      - name: plant_available_nitrogen_kg
        type: number
        source: computed
        description: "Plant-available nitrogen charged against the dairy budget in kg, 3 decimal places"
      - name: status
        type: enum
        source: computed
        description: "Application lifecycle; only APPLIED rows charge inventory and the nitrogen budget"
        default: "PLANNED"
        constraints: "PLANNED | APPLIED | VOIDED"

  - name: RevenueStatement
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> DigesterFacility.id; the project whose revenue is being distributed"
      - name: period_start_date
        type: string
        source: input
        description: "Inclusive first calendar date of the settlement period, YYYY-MM-DD"
      - name: period_end_date
        type: string
        source: input
        description: "Inclusive last calendar date of the settlement period, YYYY-MM-DD"
      - name: gas_revenue_cents
        type: integer
        source: input
        description: "Commodity gas sales for the period in cents, entered by the finance controller"
        constraints: ">= 0"
      - name: superseded_by_statement_id
        type: string
        source: computed
        description: "FK -> RevenueStatement.id; set on a DRAFT statement when a newer statement on the same facility with an overlapping period supersedes it; null otherwise"
      - name: credit_revenue_cents
        type: integer
        source: computed
        description: "Sum of CreditBatch.credit_value_cents for batches of this facility with status == ISSUED whose period lies inside the statement period"
        default: 0
      - name: gross_revenue_cents
        type: integer
        source: computed
        description: "gas_revenue_cents plus credit_revenue_cents"
      - name: management_fee_rate
        type: number
        source: computed
        description: "Tiered management fee rate selected from gross_revenue_cents, 4 decimal places"
      - name: management_fee_cents
        type: integer
        source: computed
        description: "Management fee in cents from calculations.net_distributable_waterfall"
      - name: after_fee_cents
        type: integer
        source: computed
        description: "gross_revenue_cents minus management_fee_cents"
      - name: reserve_sweep_cents
        type: integer
        source: computed
        description: "Cash swept to the debt-service reserve in cents from calculations.net_distributable_waterfall"
      - name: net_distributable_cents
        type: integer
        source: computed
        description: "after_fee_cents minus reserve_sweep_cents"
      - name: share_lines
        type: array
        source: computed
        description: "Ordered dairy share lines, each an object with agreement_id, dairy_id, revenue_share_basis, revenue_share_pct, committed_tonnes_per_day, floor_cents, residual_cents and share_cents; output of calculations.dairy_share_allocation"
      - name: total_dairy_share_cents
        type: integer
        source: computed
        description: "Sum of share_lines[].share_cents"
      - name: retained_cents
        type: integer
        source: computed
        description: "net_distributable_cents minus total_dairy_share_cents"
      - name: dscr_at_close
        type: number
        source: computed
        description: "Debt-service coverage ratio computed for this statement, 3 decimal places"
      - name: status
        type: enum
        source: computed
        description: "Settlement lifecycle under segregation of duties"
        default: "DRAFT"
        constraints: "DRAFT | APPROVED | PAID | CLAWED_BACK | SUPERSEDED"
      - name: approved_by_user_id
        type: string
        source: computed
        description: "X-User-ID that approved the statement; null while DRAFT"
      - name: paid_by_user_id
        type: string
        source: computed
        description: "X-User-ID that released payment; MUST differ from approved_by_user_id"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FeedstockAgreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    note: "Cyclic negotiation loop DRAFT -> PENDING_DAIRY_SIGNATURE -> COUNTERED -> DRAFT bounded by MAX_NEGOTIATION_ROUNDS, plus a reversible ACTIVE <-> SUSPENDED service pair."
    transitions:
      - from: DRAFT
        to: PENDING_DAIRY_SIGNATURE
        trigger: "POST /feedstock-agreements/{id}/offer"
        actor: ProjectOperator
        preconditions:
          - "status == DRAFT"
          - "Dairy.status IN {PROSPECT, CONTRACTED}"
        side_effects:
          - "increments FeedstockAgreement.version by 1"
      - from: PENDING_DAIRY_SIGNATURE
        to: COUNTERED
        trigger: "POST /feedstock-agreements/{id}/counter"
        actor: DairyPartner
        preconditions:
          - "status == PENDING_DAIRY_SIGNATURE"
          - "X-User-ID == FeedstockAgreement.dairy_id"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (3)"
        side_effects:
          - "sets countered_tonnes_per_day and countered_revenue_share_pct from the request"
          - "increments negotiation_round by 1"
          - "increments FeedstockAgreement.version by 1"
      - from: COUNTERED
        to: DRAFT
        trigger: "POST /feedstock-agreements/{id}/revise"
        actor: ProjectOperator
        preconditions:
          - "status == COUNTERED"
        side_effects:
          - "overwrites committed_tonnes_per_day, minimum_total_solids_pct and revenue_share_pct with the revised terms"
          - "clears countered_tonnes_per_day and countered_revenue_share_pct to null"
          - "increments FeedstockAgreement.version by 1"
        note: "Closes the negotiation cycle; a fourth counter attempt is rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED."
      - from: PENDING_DAIRY_SIGNATURE
        to: ACTIVE
        trigger: "POST /feedstock-agreements/{id}/sign"
        actor: DairyPartner
        preconditions:
          - "status == PENDING_DAIRY_SIGNATURE"
          - "X-User-ID == FeedstockAgreement.dairy_id"
        side_effects:
          - "sets signed_at to the logical clock"
          - "increments Dairy.active_agreement_count and Dairy.contracted_agreement_count by 1"
          - "because Dairy.active_agreement_count became >= 1, Dairy.status moves PROSPECT -> CONTRACTED"
          - "increments FeedstockAgreement.version by 1 and Dairy.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /feedstock-agreements/{id}/status-change with action == SUSPEND"
        actor: ProjectOperator
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "sets suspension_reason to COMPLIANCE"
          - "decrements Dairy.active_agreement_count by 1"
          - "because Dairy.active_agreement_count became 0, Dairy.status moves CONTRACTED -> SUSPENDED"
          - "every FeedstockDelivery with agreement_id == this agreement, status == ACCEPTED and OperationsDay.status == OPEN moves ACCEPTED -> CANCELLED with rejection_reason AGREEMENT_SUSPENDED"
          - "because those deliveries were cancelled, each affected OperationsDay.organic_loading_rate is recomputed by calculations.organic_loading_rate"
          - "increments FeedstockAgreement.version, Dairy.version and each affected OperationsDay.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: DigesterFacility.ops_posture became UPSET"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "curtailable == true"
        side_effects:
          - "sets suspension_reason to OPS_UPSET"
          - "decrements Dairy.active_agreement_count by 1"
          - "because Dairy.active_agreement_count became 0, Dairy.status moves CONTRACTED -> SUSPENDED"
          - "every FeedstockDelivery with agreement_id == this agreement, status == ACCEPTED and OperationsDay.status == OPEN moves ACCEPTED -> CANCELLED with rejection_reason AGREEMENT_SUSPENDED"
          - "because those deliveries were cancelled, each affected OperationsDay.organic_loading_rate is recomputed"
        note: "Link 3 of cascade B. Agreements with curtailable == false are skipped and stay ACTIVE."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /feedstock-agreements/{id}/status-change with action == REINSTATE"
        actor: ProjectOperator
        preconditions:
          - "status == SUSPENDED"
          - "DigesterFacility.ops_posture != UPSET"
        side_effects:
          - "clears suspension_reason to null"
          - "increments Dairy.active_agreement_count by 1"
          - "because Dairy.active_agreement_count became >= 1, Dairy.status moves SUSPENDED -> CONTRACTED"
          - "increments FeedstockAgreement.version and Dairy.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /feedstock-agreements/{id}/status-change with action == TERMINATE"
        actor: ProjectOperator
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "decrements Dairy.active_agreement_count by 1 when the prior status was ACTIVE"
          - "decrements Dairy.contracted_agreement_count by 1"
          - "because Dairy.contracted_agreement_count became 0, Dairy.status moves to PROSPECT"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /feedstock-agreements/{id}/status-change with action == TERMINATE"
        actor: ProjectOperator
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "decrements Dairy.contracted_agreement_count by 1"
          - "because Dairy.contracted_agreement_count became 0, Dairy.status moves to PROSPECT"

  - entity: FeedstockDelivery
    dimension: status
    initial_state: ACCEPTED
    terminal_states: [REJECTED, CANCELLED]
    note: "A load is booked ACCEPTED and can leave the accepted set in exactly two ways: an operator rejection after re-sampling, or the facility-upset cascade. Both removals feed calculations.organic_loading_rate and calculations.mass_control_invariant."
    transitions:
      - from: ACCEPTED
        to: REJECTED
        trigger: "POST /feedstock-deliveries/{id}/reject"
        actor: ProjectOperator
        preconditions:
          - "status == ACCEPTED"
          - "OperationsDay.status == OPEN"
        side_effects:
          - "sets rejection_reason from the request"
          - "removes net_tonnes and vs_tonnes from the ACCEPTED set, so OperationsDay.organic_loading_rate is recomputed"
          - "recomputes DigesterFacility.total_manure_received_tonnes, unseparated_manure_tonnes and mass_control_residual_tonnes, which MUST stay 0.000"
          - "increments FeedstockDelivery.version, OperationsDay.version and DigesterFacility.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system event: the parent FeedstockAgreement moved ACTIVE -> SUSPENDED while OperationsDay.status == OPEN"
        actor: system
        preconditions:
          - "status == ACCEPTED"
          - "OperationsDay.status == OPEN"
        side_effects:
          - "sets rejection_reason to AGREEMENT_SUSPENDED"
          - "recomputes OperationsDay.organic_loading_rate and the facility mass-control totals"
          - "increments FeedstockDelivery.version, OperationsDay.version and DigesterFacility.version by 1"
        note: "Link 4 of cascade B. Deliveries on an already-CLOSED OperationsDay are never cancelled, because the closed day's loading rate is already embedded in its stability assessment."

  - entity: Dairy
    dimension: status
    initial_state: PROSPECT
    terminal_states: []
    note: "Compound machine: Dairy.status is re-derived from active_agreement_count and contracted_agreement_count after every FeedstockAgreement mutation."
    transitions:
      - from: PROSPECT
        to: CONTRACTED
        trigger: "system event: active_agreement_count became >= 1"
        actor: system
        preconditions:
          - "active_agreement_count >= 1"
        side_effects:
          - "increments Dairy.version by 1"
      - from: CONTRACTED
        to: SUSPENDED
        trigger: "system event: active_agreement_count became 0 while contracted_agreement_count >= 1"
        actor: system
        preconditions:
          - "active_agreement_count == 0"
          - "contracted_agreement_count >= 1"
        side_effects:
          - "increments Dairy.version by 1"
        note: "Link 5 of cascade B."
      - from: SUSPENDED
        to: CONTRACTED
        trigger: "system event: active_agreement_count became >= 1"
        actor: system
        preconditions:
          - "active_agreement_count >= 1"
        side_effects:
          - "increments Dairy.version by 1"
      - from: SUSPENDED
        to: PROSPECT
        trigger: "system event: contracted_agreement_count became 0"
        actor: system
        preconditions:
          - "contracted_agreement_count == 0"
        side_effects:
          - "increments Dairy.version by 1"
      - from: CONTRACTED
        to: PROSPECT
        trigger: "system event: contracted_agreement_count became 0"
        actor: system
        preconditions:
          - "contracted_agreement_count == 0"
        side_effects:
          - "increments Dairy.version by 1"

  - entity: DigesterFacility
    dimension: ops_posture
    initial_state: STABLE
    terminal_states: []
    note: "First of two independent dimensions on DigesterFacility. Driven only by OperationsDay close/reopen outcomes; never by financing state."
    transitions:
      - from: STABLE
        to: WATCH
        trigger: "POST /ops-days/{id}/close producing stability_status == STRESSED"
        actor: system
        preconditions:
          - "the closed OperationsDay.facility_id == this facility"
          - "stability_status == STRESSED"
        side_effects:
          - "increments DigesterFacility.version by 1"
      - from: WATCH
        to: STABLE
        trigger: "POST /ops-days/{id}/close producing stability_status == STABLE"
        actor: system
        preconditions:
          - "stability_status == STABLE"
        side_effects:
          - "increments DigesterFacility.version by 1"
      - from: STABLE
        to: UPSET
        trigger: "POST /ops-days/{id}/close producing stability_status == INHIBITED"
        actor: system
        preconditions:
          - "stability_status == INHIBITED"
        side_effects:
          - "because ops_posture became UPSET, every FeedstockAgreement with facility_id == this facility, status == ACTIVE and curtailable == true moves ACTIVE -> SUSPENDED with suspension_reason OPS_UPSET"
          - "increments DigesterFacility.version by 1"
        note: "Link 2 of cascade B; link 3 is the agreement suspension, link 4 the delivery cancellations, link 5 the Dairy suspension."
      - from: WATCH
        to: UPSET
        trigger: "POST /ops-days/{id}/close producing stability_status == INHIBITED"
        actor: system
        preconditions:
          - "stability_status == INHIBITED"
        side_effects:
          - "because ops_posture became UPSET, every FeedstockAgreement with facility_id == this facility, status == ACTIVE and curtailable == true moves ACTIVE -> SUSPENDED with suspension_reason OPS_UPSET"
      - from: UPSET
        to: RESTRICTED
        trigger: "POST /facilities/{id}/posture-override with dimension == OPS"
        actor: PlatformAdmin
        preconditions:
          - "ops_posture == UPSET"
        side_effects:
          - "sets posture_override_active to true"
          - "increments DigesterFacility.version by 1"
        note: "Manual engineering release out of an upset; feedstock intake resumes but agreements stay SUSPENDED until reinstated explicitly."
      - from: RESTRICTED
        to: STABLE
        trigger: "POST /ops-days/{id}/close producing stability_status == STABLE"
        actor: system
        preconditions:
          - "stability_status == STABLE"
        side_effects:
          - "sets posture_override_active to false"
          - "increments DigesterFacility.version by 1"

  - entity: DigesterFacility
    dimension: distribution_posture
    initial_state: OPEN
    terminal_states: []
    note: "Second, independent dimension on the same DigesterFacility row. Driven only by dscr_current recomputation; a facility can be ops_posture UPSET while distribution_posture is OPEN and vice versa."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system event: calculations.dscr_and_distribution_posture produced dscr_current in [dscr_minimum - DSCR_RESTRICTED_BAND, dscr_minimum)"
        actor: system
        preconditions:
          - "dscr_current < dscr_minimum"
          - "dscr_current >= dscr_minimum - DSCR_RESTRICTED_BAND"
        side_effects:
          - "increments DigesterFacility.version by 1"
        note: "Link 5 of cascade A."
      - from: OPEN
        to: LOCKED
        trigger: "system event: calculations.dscr_and_distribution_posture produced dscr_current < dscr_minimum - DSCR_RESTRICTED_BAND"
        actor: system
        preconditions:
          - "dscr_current < dscr_minimum - DSCR_RESTRICTED_BAND"
          - "posture_override_active == false"
        side_effects:
          - "increments DigesterFacility.version by 1"
      - from: RESTRICTED
        to: LOCKED
        trigger: "system event: calculations.dscr_and_distribution_posture produced dscr_current < dscr_minimum - DSCR_RESTRICTED_BAND"
        actor: system
        preconditions:
          - "dscr_current < dscr_minimum - DSCR_RESTRICTED_BAND"
          - "posture_override_active == false"
        side_effects:
          - "increments DigesterFacility.version by 1"
      - from: LOCKED
        to: RESTRICTED
        trigger: "POST /facilities/{id}/posture-override with dimension == DISTRIBUTION"
        actor: PlatformAdmin
        preconditions:
          - "distribution_posture == LOCKED"
        side_effects:
          - "sets posture_override_active to true"
          - "increments DigesterFacility.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system event: calculations.dscr_and_distribution_posture produced dscr_current >= dscr_minimum"
        actor: system
        preconditions:
          - "dscr_current >= dscr_minimum"
        side_effects:
          - "sets posture_override_active to false"
          - "increments DigesterFacility.version by 1"
      - from: LOCKED
        to: OPEN
        trigger: "system event: calculations.dscr_and_distribution_posture produced dscr_current >= dscr_minimum"
        actor: system
        preconditions:
          - "dscr_current >= dscr_minimum"
        side_effects:
          - "sets posture_override_active to false"

  - entity: OperationsDay
    dimension: status
    initial_state: OPEN
    terminal_states: []
    note: "Bookkeeping dimension. Cyclic: a closed day may be reopened, which also rewinds the gas and digestate dimension."
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /ops-days/{id}/close"
        actor: ProjectOperator
        preconditions:
          - "status == OPEN"
          - "DigesterFacility.ops_posture != UPSET"
          - "at least one FeedstockDelivery with ops_day_id == this day and status == ACCEPTED exists"
        side_effects:
          - "records avg_digester_temp_c, temp_excursion_minutes, vfa_mg_per_l, alkalinity_mg_per_l and the raw gas analysis"
          - "runs calculations.organic_loading_rate then calculations.biological_stability_assessment"
          - "sets gas_state NOT_PRODUCED -> RAW"
          - "because stability_status was produced, DigesterFacility.ops_posture is re-derived (link 2 of cascade B when INHIBITED)"
          - "increments OperationsDay.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /ops-days/{id}/reopen"
        actor: ProjectOperator
        preconditions:
          - "status == CLOSED"
          - "no InjectionNomination with ops_day_id == this day has status IN {CONFIRMED, DELIVERED}"
          - "no CreditBatch of this facility with status IN {CLAIMED, VERIFIED, ISSUED} covers ops_date"
          - "no NutrientApplication with ops_day_id == this day has status == APPLIED"
          - "reopen_count < MAX_REOPENS (1)"
        side_effects:
          - "sets gas_state back to NOT_PRODUCED and clears treated_* fields, pipeline_gas_scf, pipeline_gas_mmbtu and offspec_reason to null or 0"
          - "sets conditioning_attempts to 0"
          - "sets separation_recorded to false and zeroes digestate_solids_tonnes, digestate_liquid_tonnes and bedding_recovered_tonnes"
          - "recomputes DigesterFacility.unseparated_manure_tonnes, digestate_solids_produced_tonnes, digestate_liquid_produced_tonnes and mass_control_residual_tonnes, which MUST return to 0.000"
          - "increments reopen_count by 1"
        note: "Compensating action for record-separation under the MASS_CONTROL invariant."

  - entity: OperationsDay
    dimension: gas_state
    initial_state: NOT_PRODUCED
    terminal_states: [FLARED, INJECTED]
    note: "Gas dimension of the same OperationsDay row, branching at conditioning into PIPELINE_SPEC or OFFSPEC with divergent side-effect sets, and evolving independently of the status dimension."
    transitions:
      - from: NOT_PRODUCED
        to: RAW
        trigger: "POST /ops-days/{id}/close"
        actor: ProjectOperator
        preconditions:
          - "raw_biogas_scf > 0"
        side_effects:
          - "computes raw_hhv_btu_per_scf and raw_gas_mmbtu"
      - from: RAW
        to: PIPELINE_SPEC
        trigger: "POST /ops-days/{id}/condition-gas with disposition == RECONDITION and every treated value inside the InterconnectAgreement specification"
        actor: ProjectOperator
        preconditions:
          - "gas_state IN {RAW, PIPELINE_SPEC}"
          - "an InterconnectAgreement with facility_id == OperationsDay.facility_id and status == ACTIVE exists"
          - "conditioning_attempts < MAX_CONDITIONING_ATTEMPTS (2)"
        side_effects:
          - "runs calculations.gas_conditioning_yield setting pipeline_hhv_btu_per_scf, pipeline_gas_scf and pipeline_gas_mmbtu"
          - "sets offspec_reason to null"
          - "increments conditioning_attempts by 1"
      - from: RAW
        to: OFFSPEC
        trigger: "POST /ops-days/{id}/condition-gas with disposition == RECONDITION and at least one treated value outside the InterconnectAgreement specification"
        actor: ProjectOperator
        preconditions:
          - "gas_state IN {RAW, PIPELINE_SPEC}"
          - "conditioning_attempts < MAX_CONDITIONING_ATTEMPTS (2)"
        side_effects:
          - "sets offspec_reason to the first failing specification in the pinned order H2S, MOISTURE, CO2, HHV"
          - "sets pipeline_gas_scf and pipeline_gas_mmbtu to 0"
          - "increments conditioning_attempts by 1"
      - from: PIPELINE_SPEC
        to: OFFSPEC
        trigger: "POST /ops-days/{id}/condition-gas with disposition == RECONDITION on a re-tested sample that fails specification"
        actor: ProjectOperator
        preconditions:
          - "gas_state == PIPELINE_SPEC"
          - "conditioning_attempts < MAX_CONDITIONING_ATTEMPTS (2)"
        side_effects:
          - "sets offspec_reason to the first failing specification"
          - "sets pipeline_gas_scf and pipeline_gas_mmbtu to 0"
          - "because the day went off specification, every InjectionNomination with ops_day_id == this day and status IN {NOMINATED, CONFIRMED} moves to REJECTED_OFFSPEC"
          - "because those nominations were rejected, InterconnectAgreement.curtailment_count is increased by the number rejected"
          - "because curtailment_count reached CURTAILMENT_SUSPEND_THRESHOLD (3), InterconnectAgreement moves ACTIVE -> SUSPENDED"
        note: "Cascade C, depth 4, triggered by a laboratory re-test rather than by a first conditioning pass."
      - from: OFFSPEC
        to: PIPELINE_SPEC
        trigger: "POST /ops-days/{id}/condition-gas with disposition == RECONDITION and every treated value inside specification"
        actor: ProjectOperator
        preconditions:
          - "gas_state == OFFSPEC"
          - "conditioning_attempts < MAX_CONDITIONING_ATTEMPTS (2)"
        side_effects:
          - "runs calculations.gas_conditioning_yield and clears offspec_reason to null"
          - "increments conditioning_attempts by 1"
      - from: OFFSPEC
        to: FLARED
        trigger: "POST /ops-days/{id}/condition-gas with disposition == FLARE"
        actor: ProjectOperator
        preconditions:
          - "gas_state == OFFSPEC"
        side_effects:
          - "sets pipeline_gas_scf and pipeline_gas_mmbtu to 0"
          - "the day can never contribute delivered energy to a CreditBatch"
      - from: PIPELINE_SPEC
        to: INJECTED
        trigger: "POST /injection-nominations/{id}/deliver"
        actor: PipelineScheduler
        preconditions:
          - "gas_state == PIPELINE_SPEC"
          - "the nomination status IN {CONFIRMED, CURTAILED}"
        side_effects:
          - "sets InjectionNomination.delivered_mmbtu"
          - "increments OperationsDay.version by 1"

  - entity: InterconnectAgreement
    dimension: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: curtailment_count reached CURTAILMENT_SUSPEND_THRESHOLD"
        actor: system
        preconditions:
          - "curtailment_count >= CURTAILMENT_SUSPEND_THRESHOLD (3)"
        side_effects:
          - "increments InterconnectAgreement.version by 1"
        note: "Link 4 of cascade C. While SUSPENDED no new nomination may be created."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /interconnect-agreements/{id}/status-change with action == REINSTATE"
        actor: PipelineScheduler
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "resets curtailment_count to 0"
          - "increments InterconnectAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /interconnect-agreements/{id}/status-change with action == TERMINATE"
        actor: PipelineScheduler
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
          - "no InjectionNomination on this interconnect has status IN {NOMINATED, CONFIRMED}"
        side_effects:
          - "increments InterconnectAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /interconnect-agreements/{id}/status-change with action == TERMINATE"
        actor: PipelineScheduler
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "increments InterconnectAgreement.version by 1"

  - entity: InjectionNomination
    dimension: status
    initial_state: NOMINATED
    terminal_states: [DELIVERED, REJECTED_OFFSPEC]
    transitions:
      - from: NOMINATED
        to: CONFIRMED
        trigger: "POST /injection-nominations/{id}/schedule-decision with decision == CONFIRM"
        actor: PipelineScheduler
        preconditions:
          - "status == NOMINATED"
          - "InterconnectAgreement.status == ACTIVE"
          - "OperationsDay.gas_state == PIPELINE_SPEC"
        side_effects:
          - "sets confirmed_mmbtu to nominated_mmbtu"
          - "increments InjectionNomination.version by 1"
      - from: NOMINATED
        to: CURTAILED
        trigger: "POST /injection-nominations/{id}/schedule-decision with decision == CURTAIL"
        actor: PipelineScheduler
        preconditions:
          - "status == NOMINATED"
          - "0 < curtailed_mmbtu < nominated_mmbtu"
        side_effects:
          - "sets confirmed_mmbtu to the curtailed volume"
          - "increments InterconnectAgreement.curtailment_count by 1"
          - "because curtailment_count reached CURTAILMENT_SUSPEND_THRESHOLD (3), InterconnectAgreement moves ACTIVE -> SUSPENDED"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /injection-nominations/{id}/deliver"
        actor: PipelineScheduler
        preconditions:
          - "status IN {CONFIRMED, CURTAILED}"
          - "OperationsDay.gas_state == PIPELINE_SPEC"
          - "delivered_mmbtu <= confirmed_mmbtu"
        side_effects:
          - "sets delivered_mmbtu from the request"
          - "sets OperationsDay.gas_state PIPELINE_SPEC -> INJECTED"
      - from: CURTAILED
        to: DELIVERED
        trigger: "POST /injection-nominations/{id}/deliver"
        actor: PipelineScheduler
        preconditions:
          - "status == CURTAILED"
          - "delivered_mmbtu <= confirmed_mmbtu"
        side_effects:
          - "sets delivered_mmbtu from the request"
          - "sets OperationsDay.gas_state PIPELINE_SPEC -> INJECTED"
      - from: NOMINATED
        to: REJECTED_OFFSPEC
        trigger: "system event: OperationsDay.gas_state moved PIPELINE_SPEC -> OFFSPEC"
        actor: system
        preconditions:
          - "status IN {NOMINATED, CONFIRMED}"
        side_effects:
          - "increments InterconnectAgreement.curtailment_count by 1"
        note: "Link 2 of cascade C."
      - from: CONFIRMED
        to: REJECTED_OFFSPEC
        trigger: "system event: OperationsDay.gas_state moved PIPELINE_SPEC -> OFFSPEC"
        actor: system
        preconditions:
          - "status IN {NOMINATED, CONFIRMED}"
        side_effects:
          - "increments InterconnectAgreement.curtailment_count by 1"

  - entity: CreditPathway
    dimension: status
    initial_state: PROVISIONAL
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /credit-pathways/{id}/certification-decision with decision == CERTIFY"
        actor: ProgramAdministrator
        preconditions:
          - "status == PROVISIONAL"
          - "at least one OperationsDay of the facility with gas_state IN {PIPELINE_SPEC, INJECTED} lies inside the requested reference window"
        side_effects:
          - "sets reference_start_date and reference_end_date from the request"
          - "runs the CERTIFIED variant of calculations.pathway_ci_score setting certified_ci_score"
          - "increments CreditPathway.version by 1"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system event: a VerificationAudit issued findings with finding_severity == MATERIAL"
        actor: system
        preconditions:
          - "status == CERTIFIED"
        side_effects:
          - "sets verified_ci_score from VerificationAudit.reported_ci_score and ci_adjustment to verified_ci_score minus certified_ci_score"
          - "because verified_ci_score changed, every CreditBatch of this pathway with status IN {VERIFIED, ISSUED} recomputes ci_score_used, credit_quantity_final and credit_value_cents from the FINAL variant of calculations.credit_quantity"
          - "recomputes credits_issued_total, credits_reversed_total, credits_outstanding and credit_control_residual"
          - "increments CreditPathway.version by 1"
        note: "Link 2 of cascade A; link 3 is the batch recomputation, link 4 the DRAFT statement recomputation, link 5 the facility distribution_posture flip."
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /credit-pathways/{id}/certification-decision with decision == REINSTATE"
        actor: ProgramAdministrator
        preconditions:
          - "status == SUSPENDED"
          - "every VerificationAudit on this pathway has status == CLOSED"
        side_effects:
          - "increments CreditPathway.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /credit-pathways/{id}/certification-decision with decision == REVOKE"
        actor: ProgramAdministrator
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "every CreditBatch of this pathway with status == ISSUED moves ISSUED -> REVERSED with reversal_reason REGULATOR_ORDER"
          - "recomputes credits_reversed_total, credits_outstanding and credit_control_residual, which MUST remain 0.000"

  - entity: CreditBatch
    dimension: status
    initial_state: DRAFT
    terminal_states: [REVERSED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CLAIMED
        trigger: "POST /credit-batches/{id}/claim"
        actor: ProgramAdministrator
        preconditions:
          - "status == DRAFT"
          - "CreditPathway.status == CERTIFIED"
          - "delivered_mmbtu > 0"
        side_effects:
          - "recomputes delivered_mmbtu from the DELIVERED nomination set"
          - "sets ci_score_used to CreditPathway.certified_ci_score and credit_quantity_provisional from the PROVISIONAL variant of calculations.credit_quantity"
          - "increments CreditBatch.version by 1"
      - from: CLAIMED
        to: VERIFIED
        trigger: "POST /credit-batches/{id}/verify"
        actor: CreditVerifier
        preconditions:
          - "status == CLAIMED"
          - "CreditPathway.status == CERTIFIED"
        side_effects:
          - "sets ci_score_used to CreditPathway.verified_ci_score when it is not null, otherwise to certified_ci_score"
          - "sets credit_quantity_final and credit_value_cents from the FINAL variant of calculations.credit_quantity"
          - "increments CreditBatch.version by 1"
      - from: VERIFIED
        to: ISSUED
        trigger: "POST /credit-batches/{id}/issue"
        actor: ProgramAdministrator
        preconditions:
          - "status == VERIFIED"
          - "CreditPathway.status == CERTIFIED"
          - "X-User-ID differs from the X-User-ID that verified the batch"
        side_effects:
          - "increases CreditPathway.credits_issued_total and credits_outstanding by credit_quantity_final"
          - "recomputes CreditPathway.credit_control_residual, which MUST equal 0.000"
          - "increments CreditBatch.version and CreditPathway.version by 1"
      - from: ISSUED
        to: REVERSED
        trigger: "POST /credit-batches/{id}/reverse"
        actor: ProgramAdministrator
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "sets reversal_reason from the request"
          - "increases CreditPathway.credits_reversed_total by credit_quantity_final and decreases credits_outstanding by the same amount"
          - "recomputes CreditPathway.credit_control_residual, which MUST return to 0.000"
          - "because credit_value_cents left the issued set, every RevenueStatement of the facility with status == DRAFT whose period contains the batch period recomputes credit_revenue_cents and the whole waterfall"
        note: "Compensating action for issue under the CREDIT_CONTROL invariant."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: a newer CreditBatch on the same pathway with an overlapping period was created"
        actor: system
        preconditions:
          - "status == DRAFT"
          - "period_start_date <= newer.period_end_date and newer.period_start_date <= period_end_date"
        side_effects:
          - "sets superseded_by_batch_id to the newer batch id"
          - "increments CreditBatch.version by 1"
        note: "The legitimate supersede that makes concurrency_rules[credit-batch-create-stale-pathway] a true race rather than a state precondition."

  - entity: VerificationAudit
    dimension: status
    initial_state: FIELDWORK
    terminal_states: [CLOSED]
    note: "Cyclic remediation loop FINDINGS_ISSUED -> REMEDIATION -> FIELDWORK bounded by MAX_REMEDIATION_ROUNDS, and a three-way branch out of FIELDWORK keyed on the computed finding_severity."
    transitions:
      - from: FIELDWORK
        to: FIELDWORK
        trigger: "POST /verification-audits/{id}/fieldwork"
        actor: CreditVerifier
        preconditions:
          - "status == FIELDWORK"
          - "CreditPathway.status == CERTIFIED"
          - "CreditPathway.certified_ci_score is not null"
        side_effects:
          - "records the actual_* fields from the request"
          - "runs the VERIFIED variant of calculations.pathway_ci_score setting reported_ci_score and ci_delta"
          - "increments VerificationAudit.version by 1"
        note: "Self-transition: fieldwork may be re-recorded while the audit remains in FIELDWORK."
      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /verification-audits/{id}/findings"
        actor: CreditVerifier
        preconditions:
          - "status == FIELDWORK"
          - "reported_ci_score is not null"
        side_effects:
          - "sets finding_severity to NONE when abs(ci_delta) == 0.00, MINOR when 0.00 < abs(ci_delta) <= MATERIAL_CI_TOLERANCE, MATERIAL when abs(ci_delta) > MATERIAL_CI_TOLERANCE"
          - "when finding_severity == MATERIAL, CreditPathway moves CERTIFIED -> SUSPENDED (link 2 of cascade A)"
          - "when finding_severity == MINOR, CreditPathway.verified_ci_score and ci_adjustment are set but status is unchanged, and no batch is recomputed"
          - "when finding_severity == NONE, CreditPathway.verified_ci_score is set equal to certified_ci_score and ci_adjustment to 0.00"
          - "increments VerificationAudit.version by 1"
      - from: FINDINGS_ISSUED
        to: REMEDIATION
        trigger: "POST /verification-audits/{id}/remediation"
        actor: ProjectOperator
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "finding_severity IN {MINOR, MATERIAL}"
          - "remediation_round < MAX_REMEDIATION_ROUNDS (2)"
        side_effects:
          - "increments remediation_round by 1"
          - "increments VerificationAudit.version by 1"
      - from: REMEDIATION
        to: FIELDWORK
        trigger: "POST /verification-audits/{id}/fieldwork"
        actor: CreditVerifier
        preconditions:
          - "status == REMEDIATION"
        side_effects:
          - "records the corrected actual_* fields and recomputes reported_ci_score and ci_delta"
          - "clears finding_severity to null"
        note: "Closes the remediation cycle; a third remediation is rejected with ERR_REMEDIATION_ROUNDS_EXHAUSTED."
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /verification-audits/{id}/close"
        actor: CreditVerifier
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "finding_severity == NONE"
        side_effects:
          - "increments VerificationAudit.version by 1"
      - from: REMEDIATION
        to: CLOSED
        trigger: "POST /verification-audits/{id}/close"
        actor: CreditVerifier
        preconditions:
          - "status == REMEDIATION"
        side_effects:
          - "increments VerificationAudit.version by 1"

  - entity: NutrientApplication
    dimension: status
    initial_state: PLANNED
    terminal_states: [VOIDED]
    transitions:
      - from: PLANNED
        to: APPLIED
        trigger: "POST /nutrient-applications/{id}/apply"
        actor: ProjectOperator
        preconditions:
          - "status == PLANNED"
          - "OperationsDay.separation_recorded == true"
          - "solids_tonnes_applied <= DigesterFacility.digestate_solids_on_hand_tonnes"
          - "liquid_tonnes_applied <= DigesterFacility.digestate_liquid_on_hand_tonnes"
          - "Dairy.pan_applied_ytd_kg + plant_available_nitrogen_kg <= Dairy.annual_nitrogen_budget_kg"
        side_effects:
          - "increases DigesterFacility.digestate_solids_applied_tonnes and digestate_liquid_applied_tonnes"
          - "decreases DigesterFacility.digestate_solids_on_hand_tonnes and digestate_liquid_on_hand_tonnes by the same amounts"
          - "increases Dairy.pan_applied_ytd_kg by plant_available_nitrogen_kg"
          - "increments NutrientApplication.version, DigesterFacility.version and Dairy.version by 1"
      - from: APPLIED
        to: VOIDED
        trigger: "POST /nutrient-applications/{id}/void"
        actor: ProjectOperator
        preconditions:
          - "status == APPLIED"
        side_effects:
          - "decreases DigesterFacility.digestate_solids_applied_tonnes and digestate_liquid_applied_tonnes by the applied amounts"
          - "restores DigesterFacility.digestate_solids_on_hand_tonnes and digestate_liquid_on_hand_tonnes to their pre-application values"
          - "decreases Dairy.pan_applied_ytd_kg by plant_available_nitrogen_kg"
        note: "Compensating action for apply; the digestate inventory quantity must show no drift."
      - from: PLANNED
        to: VOIDED
        trigger: "POST /nutrient-applications/{id}/void"
        actor: ProjectOperator
        preconditions:
          - "status == PLANNED"
        side_effects:
          - "no inventory or nitrogen movement occurs"

  - entity: RevenueStatement
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLAWED_BACK, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /revenue-statements/{id}/approve"
        actor: FinanceController
        preconditions:
          - "status == DRAFT"
          - "DigesterFacility.distribution_posture != LOCKED"
          - "total_dairy_share_cents <= net_distributable_cents"
        side_effects:
          - "sets approved_by_user_id to the acting X-User-ID"
          - "increments RevenueStatement.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /revenue-statements/{id}/pay"
        actor: FinanceController
        preconditions:
          - "status == APPROVED"
          - "X-User-ID != approved_by_user_id"
          - "DigesterFacility.distribution_posture == OPEN, or distribution_posture == RESTRICTED and net_distributable_cents <= RESTRICTED_PAY_CAP_CENTS"
        side_effects:
          - "sets paid_by_user_id to the acting X-User-ID"
          - "increases DigesterFacility.dairy_share_paid_cents by total_dairy_share_cents and retained_to_date_cents by retained_cents"
          - "increases DigesterFacility.reserve_balance_cents by reserve_sweep_cents"
          - "increments RevenueStatement.version and DigesterFacility.version by 1"
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /revenue-statements/{id}/claw-back"
        actor: FinanceController
        preconditions:
          - "status == PAID"
        side_effects:
          - "decreases DigesterFacility.dairy_share_paid_cents by total_dairy_share_cents and retained_to_date_cents by retained_cents"
          - "decreases DigesterFacility.reserve_balance_cents by reserve_sweep_cents"
          - "recomputes DigesterFacility.dscr_current and distribution_posture"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: a newer RevenueStatement on the same facility with an overlapping period was created"
        actor: system
        preconditions:
          - "status == DRAFT"
          - "period_start_date <= newer.period_end_date and newer.period_start_date <= period_end_date"
        side_effects:
          - "sets superseded_by_statement_id to the newer statement id"
          - "increments RevenueStatement.version by 1"
        note: "The legitimate supersede that makes concurrency_rules[revenue-statement-create-stale-facility] a true race rather than a state precondition."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: credit-batch-create-stale-pathway
    parent_entity: CreditPathway
    write_endpoint: "POST /credit-batches"
    occ_field: "expected_pathway_version"
    description: |
      Creating a CreditBatch against a CreditPathway whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A new batch legitimately supersedes any DRAFT batch on the same pathway
      whose period overlaps, so a writer holding an outdated view of the pathway
      would otherwise silently retire a batch it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: revenue-statement-create-stale-facility
    parent_entity: DigesterFacility
    write_endpoint: "POST /revenue-statements"
    occ_field: "expected_facility_version"
    description: |
      Creating a RevenueStatement against a DigesterFacility whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A new statement legitimately supersedes any DRAFT statement on the
      same facility whose period overlaps, and the waterfall depends on the
      facility reserve_balance_cents and distribution_posture the client read,
      so an outdated view would compute a distribution against stale covenant data.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: design_olr_limit
    trigger: "POST /facilities (creation)"
    algorithm: threshold
    formula: |
      design_max_olr = MESOPHILIC_MAX_OLR when thermal_regime == "MESOPHILIC"
                       else THERMOPHILIC_MAX_OLR
    input_set: "The DigesterFacility row being created; no other entity participates."
    constants:
      MESOPHILIC_MAX_OLR: 3.500
      THERMOPHILIC_MAX_OLR: 4.500
    precision: "3 decimal places, round_half_up"

  - name: organic_loading_rate
    trigger: "POST /feedstock-deliveries, POST /feedstock-deliveries/{id}/reject, POST /ops-days/{id}/close, and any cascade that cancels a FeedstockDelivery"
    algorithm: aggregation
    formula: |
      # per FeedstockDelivery
      net_tonnes = round(gross_tonnes - tare_tonnes, 3)
      vs_tonnes  = round(net_tonnes * (total_solids_pct / 100) * (volatile_solids_pct_of_ts / 100), 3)
      # per OperationsDay
      day_vs_kg  = sum(vs_tonnes) * 1000
      organic_loading_rate = round(day_vs_kg / DigesterFacility.digester_volume_m3, 3)
    input_set: "FeedstockDelivery rows with ops_day_id == this OperationsDay.id and status == ACCEPTED. REJECTED and CANCELLED rows are excluded. Summation is over the whole day set; the sum is taken on the already-rounded per-delivery vs_tonnes values (round-then-sum), then converted to kg and divided once."
    constants: {}
    precision: "vs_tonnes and organic_loading_rate to 3 decimal places, round_half_up"

  - name: biological_stability_assessment
    trigger: "POST /ops-days/{id}/close"
    algorithm: weighted_scoring
    formula: |
      # step 1 - thermal classification (evaluated first, independent of loading)
      temp_delta = abs(avg_digester_temp_c - DigesterFacility.target_temperature_c)
      if temp_delta > THERMAL_CRITICAL_DELTA_C or temp_excursion_minutes > THERMAL_CRITICAL_MINUTES:
          thermal_status = "CRITICAL"
      elif temp_delta > THERMAL_BAND_DELTA_C or temp_excursion_minutes > THERMAL_BAND_MINUTES:
          thermal_status = "EXCURSION"
      else:
          thermal_status = "IN_BAND"

      # step 2 - three independent stress contributions, each 0, 1 or 2 points
      vfa_alkalinity_ratio = round(vfa_mg_per_l / alkalinity_mg_per_l, 3)
      vfa_points = 2 if vfa_alkalinity_ratio >= VFA_ALK_SEVERE   else
                   1 if vfa_alkalinity_ratio >= VFA_ALK_WARNING  else 0
      olr_points = 2 if organic_loading_rate > DigesterFacility.design_max_olr * OLR_SEVERE_MULTIPLE else
                   1 if organic_loading_rate > DigesterFacility.design_max_olr else 0
      thermal_points = 2 if thermal_status == "CRITICAL" else
                       1 if thermal_status == "EXCURSION" else 0
      stress_points = vfa_points + olr_points + thermal_points

      # step 3 - classification
      stability_status = "INHIBITED" if stress_points >= INHIBITED_POINTS else
                         "STRESSED"  if stress_points >= STRESSED_POINTS  else "STABLE"
    input_set: "The single OperationsDay being closed, its already-computed organic_loading_rate, and its DigesterFacility target_temperature_c and design_max_olr. No other day contributes."
    constants:
      THERMAL_BAND_DELTA_C: 1.0
      THERMAL_CRITICAL_DELTA_C: 3.0
      THERMAL_BAND_MINUTES: 30
      THERMAL_CRITICAL_MINUTES: 120
      VFA_ALK_WARNING: 0.300
      VFA_ALK_SEVERE: 0.400
      OLR_SEVERE_MULTIPLE: 1.10
      STRESSED_POINTS: 2
      INHIBITED_POINTS: 4
    precision: "vfa_alkalinity_ratio to 3 decimal places, round_half_up; stress_points is an integer"

  - name: gas_conditioning_yield
    trigger: "POST /ops-days/{id}/condition-gas with disposition == RECONDITION"
    algorithm: threshold
    formula: |
      # step 1 - conditioned volume: methane is conserved except for the parasitic slip
      pipeline_gas_scf = round(raw_biogas_scf * (raw_ch4_pct / treated_ch4_pct)
                               * (1 - CONDITIONING_CH4_SLIP), 3)
      pipeline_hhv_btu_per_scf = round((treated_ch4_pct / 100) * CH4_HHV_BTU_PER_SCF, 2)

      # step 2 - specification screen against the ACTIVE InterconnectAgreement,
      #          evaluated in this pinned order; the FIRST failure wins
      if treated_h2s_ppm                > interconnect.max_h2s_ppm:                offspec_reason = "H2S"
      elif treated_moisture_lb_per_mmscf > interconnect.max_moisture_lb_per_mmscf: offspec_reason = "MOISTURE"
      elif treated_co2_pct               > interconnect.max_co2_pct:               offspec_reason = "CO2"
      elif pipeline_hhv_btu_per_scf      < interconnect.min_hhv_btu_per_scf:       offspec_reason = "HHV"
      else:                                                                        offspec_reason = null

      # step 3 - energy
      pipeline_gas_mmbtu = 0 if offspec_reason is not null
                           else round(pipeline_gas_scf * pipeline_hhv_btu_per_scf / 1000000, 3)
    input_set: "The single OperationsDay being conditioned plus the InterconnectAgreement with facility_id == OperationsDay.facility_id and status == ACTIVE. When more than one such interconnect exists the one with the earliest created_at is used."
    constants:
      CH4_HHV_BTU_PER_SCF: 1010.0
      CONDITIONING_CH4_SLIP: 0.020
    precision: "pipeline_gas_scf and pipeline_gas_mmbtu to 3 decimal places, pipeline_hhv_btu_per_scf to 2 decimal places, all round_half_up"

  - name: pathway_ci_score
    trigger: "POST /credit-pathways/{id}/certification-decision with decision == CERTIFY (CERTIFIED variant); POST /verification-audits/{id}/fieldwork (VERIFIED variant)"
    algorithm: constraint_propagation
    formula: |
      # step 1 - denominator
      energy_mj = round(pipeline_mmbtu * MJ_PER_MMBTU, 3)

      # step 2 - avoided methane from displaced baseline manure storage
      avoided_ch4_kg = sum over baseline b in {LAGOON, SOLID_STORAGE, DAILY_SPREAD} of
                       ( vs_tonnes[b] * 1000 * BMP_M3_CH4_PER_KG_VS
                         * MCF[b] * CH4_DENSITY_KG_PER_M3 )
      avoided_g_co2e = round(avoided_ch4_kg * GWP_CH4 * 1000, 3)
      raw_avoidance_g_per_mj = round(avoided_g_co2e / energy_mj, 2)

      # step 3 - direct emissions
      transport_g_per_mj = round(haul_tonne_km * TRANSPORT_G_PER_TONNE_KM / energy_mj, 2)
      direct_g_per_mj    = round(process_g_per_mj + transport_g_per_mj, 2)

      # step 4 - nested cap then floor: the avoidance credit may never exceed a
      #          multiple of the project's own direct emissions
      avoidance_credit = min(raw_avoidance_g_per_mj,
                             round(direct_g_per_mj * AVOIDANCE_CREDIT_CAP_MULTIPLE, 2))
      ci_score = max(round(direct_g_per_mj - avoidance_credit, 2), CI_FLOOR)
    input_set: |
      CERTIFIED variant: pipeline_mmbtu = sum of OperationsDay.pipeline_gas_mmbtu over OperationsDay rows
      with facility_id == CreditPathway.facility_id, gas_state IN {PIPELINE_SPEC, INJECTED} and
      ops_date within the inclusive reference window; vs_tonnes[b] = sum of FeedstockDelivery.vs_tonnes
      with status == ACCEPTED on those same days grouped by the supplying Dairy.manure_management_baseline;
      haul_tonne_km = sum of FeedstockDelivery.haul_tonne_km over the same delivery set;
      process_g_per_mj = PROCESS_G_PER_MJ.
      VERIFIED variant: every input is read from the VerificationAudit fieldwork actuals instead
      (actual_pipeline_mmbtu, actual_vs_tonnes_lagoon, actual_vs_tonnes_solid_storage,
      actual_vs_tonnes_daily_spread, actual_haul_tonne_km, actual_process_g_per_mj).
    constants:
      MJ_PER_MMBTU: 1055.06
      BMP_M3_CH4_PER_KG_VS: 0.21
      CH4_DENSITY_KG_PER_M3: 0.6785
      GWP_CH4: 25
      MCF_LAGOON: 0.75
      MCF_SOLID_STORAGE: 0.30
      MCF_DAILY_SPREAD: 0.10
      TRANSPORT_G_PER_TONNE_KM: 95.0
      PROCESS_G_PER_MJ: 15.40
      AVOIDANCE_CREDIT_CAP_MULTIPLE: 20.0
      CI_FLOOR: -400.00
    precision: "ci_score, raw_avoidance_g_per_mj, transport_g_per_mj and direct_g_per_mj to 2 decimal places, round_half_up; energy_mj to 3 decimal places"
    variants:
      - name: CERTIFIED
        when: "Run at POST /credit-pathways/{id}/certification-decision; writes CreditPathway.certified_ci_score"
        difference: "Inputs are aggregated from the facility's own OperationsDay and FeedstockDelivery records inside the reference window, and process_g_per_mj is the PROCESS_G_PER_MJ design constant."
      - name: VERIFIED
        when: "Run at POST /verification-audits/{id}/fieldwork; writes VerificationAudit.reported_ci_score and later CreditPathway.verified_ci_score"
        difference: "Every input is replaced by the auditor's measured actual, including a measured actual_process_g_per_mj that replaces the design constant, so identical gas can yield a different carbon intensity."

  - name: credit_quantity
    trigger: "POST /credit-batches/{id}/claim (PROVISIONAL variant); POST /credit-batches/{id}/verify and any cascade that recomputes an already-verified batch (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      delivered_mmbtu = sum(InjectionNomination.delivered_mmbtu)   # see input_set
      if CreditPathway.program == "LCFS":
          energy_mj      = delivered_mmbtu * MJ_PER_MMBTU
          credit_quantity = round((LCFS_BENCHMARK_CI - ci_score_used) * LCFS_EER
                                  * energy_mj / 1000000, 3)
          credit_value_cents = round_half_up(credit_quantity * LCFS_CREDIT_PRICE_CENTS)
      else:   # RFS_D3 - RINs are whole numbers and are truncated, never rounded up
          credit_quantity = floor(delivered_mmbtu * D3_RIN_PER_MMBTU)
          credit_value_cents = round_half_up(credit_quantity * D3_RIN_PRICE_CENTS)
    input_set: "InjectionNomination rows with status == DELIVERED whose OperationsDay.facility_id == CreditBatch.facility_id and whose OperationsDay.ops_date lies inside the inclusive [period_start_date, period_end_date] window. Nominations in NOMINATED, CONFIRMED, CURTAILED or REJECTED_OFFSPEC are excluded. When the set is empty, delivered_mmbtu is 0.000 and POST /credit-batches/{id}/claim is rejected with ERR_NO_DELIVERED_VOLUME."
    constants:
      MJ_PER_MMBTU: 1055.06
      LCFS_BENCHMARK_CI: 79.50
      LCFS_EER: 0.90
      LCFS_CREDIT_PRICE_CENTS: 7450
      D3_RIN_PER_MMBTU: 11.727
      D3_RIN_PRICE_CENTS: 285
    precision: "credit_quantity to 3 decimal places round_half_up for LCFS and to a whole number by floor for RFS_D3; credit_value_cents is an integer, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "At claim time, written to CreditBatch.credit_quantity_provisional"
        difference: "ci_score_used = CreditPathway.certified_ci_score. credit_value_cents is NOT written; the batch carries no monetary value yet and contributes nothing to any RevenueStatement."
      - name: FINAL
        when: "At verification, and again whenever an audit finding changes CreditPathway.verified_ci_score"
        difference: "ci_score_used = CreditPathway.verified_ci_score when it is not null, otherwise certified_ci_score. The result lands in credit_quantity_final and credit_value_cents, which is what the revenue waterfall consumes."

  - name: digestate_separation
    trigger: "POST /ops-days/{id}/record-separation"
    algorithm: aggregation
    formula: |
      feed_tonnes            = sum(FeedstockDelivery.net_tonnes)
      total_solids_tonnes    = round(sum(FeedstockDelivery.net_tonnes
                                         * FeedstockDelivery.total_solids_pct / 100), 2)
      digestate_solids_tonnes = round(total_solids_tonnes * (solids_capture_pct / 100)
                                      / CAKE_DRY_MATTER_FRACTION, 3)
      digestate_liquid_tonnes = round(feed_tonnes - digestate_solids_tonnes, 3)
      bedding_recovered_tonnes = round(digestate_solids_tonnes * (bedding_recovery_pct / 100), 3)
    input_set: "FeedstockDelivery rows with ops_day_id == this OperationsDay.id and status == ACCEPTED. Mass balance is closed by construction: digestate_solids_tonnes + digestate_liquid_tonnes == feed_tonnes."
    constants:
      CAKE_DRY_MATTER_FRACTION: 0.30
    precision: "3 decimal places, round_half_up; total_solids_tonnes to 2 decimal places"

  - name: plant_available_nitrogen
    trigger: "POST /nutrient-applications (creation) and recomputed on POST /nutrient-applications/{id}/apply"
    algorithm: weighted_scoring
    formula: |
      liquid_total_nitrogen_kg = round(liquid_tonnes_applied
                                       * OperationsDay.lab_total_nitrogen_mg_per_l / 1000, 3)
      solids_total_nitrogen_kg = round(solids_tonnes_applied * SOLIDS_N_KG_PER_TONNE, 3)
      liquid_availability_factor = PAN_LAB_FACTOR if pan_basis == "LAB" else
                                   round(NH4_FRACTION * VOLATILIZATION_RETENTION
                                         + (1 - NH4_FRACTION) * ORGANIC_MINERALIZATION, 4)
      plant_available_nitrogen_kg = round(liquid_total_nitrogen_kg * liquid_availability_factor
                                          + solids_total_nitrogen_kg * ORGANIC_MINERALIZATION, 3)
    input_set: "The single NutrientApplication row plus the laboratory nitrogen result on the OperationsDay named by ops_day_id. The dairy-level budget check sums plant_available_nitrogen_kg over NutrientApplication rows of the same dairy_id with status == APPLIED whose application_start_date falls in the same calendar year as the logical clock."
    constants:
      SOLIDS_N_KG_PER_TONNE: 5.20
      PAN_LAB_FACTOR: 0.55
      NH4_FRACTION: 0.62
      VOLATILIZATION_RETENTION: 0.75
      ORGANIC_MINERALIZATION: 0.35
    precision: "3 decimal places, round_half_up; liquid_availability_factor to 4 decimal places"
    variants:
      - name: LAB
        when: "pan_basis == LAB - the certified laboratory availability coefficient is used"
        difference: "liquid_availability_factor is the flat PAN_LAB_FACTOR of 0.5500."
      - name: AGRONOMIC
        when: "pan_basis == AGRONOMIC - the extension-service two-pool model is used"
        difference: "liquid_availability_factor is derived as 0.62 * 0.75 + 0.38 * 0.35 = 0.5980, so identical digestate charges more nitrogen against the dairy budget than the LAB basis does."

  - name: net_distributable_waterfall
    trigger: "POST /revenue-statements (creation) and any cascade that changes credit_revenue_cents on a DRAFT statement"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER - each step consumes only values produced above it.
      # The fee tier is keyed on gross_revenue_cents while the reserve sweep is keyed on
      # after_fee_cents, so the two look mutually dependent; this order makes them not.
      # step 1
      credit_revenue_cents = sum(CreditBatch.credit_value_cents)          # see input_set
      # step 2
      gross_revenue_cents  = gas_revenue_cents + credit_revenue_cents
      # step 3 - tier selected from the step-2 value, never from a post-fee value
      management_fee_rate  = FEE_RATE_TIER_1 if gross_revenue_cents <= FEE_TIER_1_MAX_CENTS else
                             FEE_RATE_TIER_2 if gross_revenue_cents <= FEE_TIER_2_MAX_CENTS else
                             FEE_RATE_TIER_3
      # step 4
      management_fee_cents = round_half_up(gross_revenue_cents * management_fee_rate)
      # step 5
      after_fee_cents      = gross_revenue_cents - management_fee_cents
      # step 6 - sweep is keyed on the step-5 value and capped by the unfunded reserve
      reserve_sweep_cents  = min(round_half_up(after_fee_cents * RESERVE_SWEEP_RATE),
                                 max(DigesterFacility.reserve_target_cents
                                     - DigesterFacility.reserve_balance_cents, 0))
      # step 7
      net_distributable_cents = after_fee_cents - reserve_sweep_cents
    input_set: "CreditBatch rows with facility_id == RevenueStatement.facility_id, status == ISSUED, and period_start_date >= RevenueStatement.period_start_date and period_end_date <= RevenueStatement.period_end_date. Batches in DRAFT, CLAIMED, VERIFIED, REVERSED or SUPERSEDED contribute nothing."
    constants:
      FEE_TIER_1_MAX_CENTS: 1000000
      FEE_TIER_2_MAX_CENTS: 2500000
      FEE_RATE_TIER_1: 0.0800
      FEE_RATE_TIER_2: 0.0650
      FEE_RATE_TIER_3: 0.0500
      RESERVE_SWEEP_RATE: 0.2500
    precision: "all cent amounts are integers, round_half_up at each pinned step; no intermediate value is carried at sub-cent precision into a later step"

  - name: dairy_share_allocation
    trigger: "POST /revenue-statements (creation) and any cascade that recomputes a DRAFT statement waterfall"
    algorithm: waterfall_allocation
    formula: |
      # PINNED ROUNDING ORDER: floor each line first, then distribute the residual cents.
      # Rounding each line half_up, or rounding the sum and pro-rating, produces a
      # different cent split; this scaffold pins floor-then-residual.
      for each participating FeedstockAgreement a, ordered by committed_tonnes_per_day DESC,
          then created_at ASC:
          base_cents  = net_distributable_cents if a.revenue_share_basis == "NET"
                        else gross_revenue_cents
          exact_i     = base_cents * a.revenue_share_pct        # exact decimal, not rounded
          floor_cents = floor(exact_i)
      residual_pool  = floor(sum(exact_i over all lines)) - sum(floor_cents over all lines)
      # one cent to each line in the same DESC committed_tonnes_per_day / ASC created_at order
      residual_cents[k] = 1 for the first residual_pool lines in that order, else 0
      share_cents[k]           = floor_cents[k] + residual_cents[k]
      total_dairy_share_cents  = sum(share_cents)
      retained_cents           = net_distributable_cents - total_dairy_share_cents
    input_set: "FeedstockAgreement rows with facility_id == RevenueStatement.facility_id, status == ACTIVE at the moment the statement is computed, and term_start_date <= RevenueStatement.period_end_date and term_end_date >= RevenueStatement.period_start_date. Agreements in DRAFT, PENDING_DAIRY_SIGNATURE, COUNTERED, SUSPENDED or TERMINATED are excluded. Ordering is committed_tonnes_per_day DESC then created_at ASC; id is never consulted."
    constants: {}
    precision: "floor to whole cents per line, then integer residual distribution; total_dairy_share_cents is an integer"

  - name: dscr_and_distribution_posture
    trigger: "POST /revenue-statements (creation), POST /revenue-statements/{id}/claw-back, and any cascade that recomputes a DRAFT statement waterfall"
    algorithm: threshold
    formula: |
      annualized_noi_cents = after_fee_cents * MONTHS_PER_YEAR
      dscr_at_close = round(annualized_noi_cents / DigesterFacility.annual_debt_service_cents, 3)
      DigesterFacility.dscr_current = dscr_at_close
      if dscr_at_close >= DigesterFacility.dscr_minimum:
          distribution_posture = "OPEN"
      elif dscr_at_close >= DigesterFacility.dscr_minimum - DSCR_RESTRICTED_BAND:
          distribution_posture = "RESTRICTED"
      else:
          distribution_posture = "RESTRICTED" if DigesterFacility.posture_override_active else "LOCKED"
    input_set: "The single RevenueStatement being created or recomputed - the one with the latest created_at among statements with status IN {DRAFT, APPROVED, PAID} for this facility. SUPERSEDED and CLAWED_BACK statements never set dscr_current."
    constants:
      MONTHS_PER_YEAR: 12
      DSCR_RESTRICTED_BAND: 0.150
      RESTRICTED_PAY_CAP_CENTS: 1000000
    precision: "dscr to 3 decimal places, round_half_up; the OPEN boundary is inclusive (>= dscr_minimum)"

  - name: injection_window_overlap
    trigger: "POST /injection-nominations"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN windows expanded by a SYMMETRIC ramp buffer on both ends.
      new_lo = window_start_utc - InterconnectAgreement.ramp_buffer_minutes minutes
      new_hi = window_end_utc   + InterconnectAgreement.ramp_buffer_minutes minutes
      for each existing nomination e on the same interconnect_id with
          status IN {NOMINATED, CONFIRMED, CURTAILED, DELIVERED}:
          e_lo = e.window_start_utc - ramp_buffer_minutes
          e_hi = e.window_end_utc   + ramp_buffer_minutes
          conflict if new_lo < e_hi and e_lo < new_hi        # strict, so touching ends do NOT conflict
      window_minutes    = whole minutes from window_start_utc to window_end_utc
      hourly_rate_mmbtu = round(nominated_mmbtu / (window_minutes / 60), 3)
    input_set: "InjectionNomination rows with the same interconnect_id and status IN {NOMINATED, CONFIRMED, CURTAILED, DELIVERED}. Rows with status == REJECTED_OFFSPEC free their window and are excluded."
    constants: {}
    precision: "hourly_rate_mmbtu to 3 decimal places, round_half_up; capacity check accepts hourly_rate_mmbtu == max_hourly_injection_mmbtu and rejects anything greater"

  - name: nutrient_window_setback
    trigger: "POST /nutrient-applications"
    algorithm: interval_merge
    formula: |
      # CLOSED day intervals with an ASYMMETRIC, leading-edge-only setback.
      # Same resource = the (dairy_id, land_unit_code) pair.
      for each existing application e on the same (dairy_id, land_unit_code) with
          status IN {PLANNED, APPLIED}:
          overlap  = new.application_start_date <= e.application_end_date
                     and e.application_start_date <= new.application_end_date   # inclusive both ends
          setback  = e.application_end_date < new.application_start_date
                     and new.application_start_date
                         <= e.application_end_date + REAPPLICATION_SETBACK_DAYS days
          conflict if overlap or setback
      # No symmetric mirror: an application placed entirely BEFORE an existing one is
      # never blocked by the setback, only by the closed-interval overlap test.
    input_set: "NutrientApplication rows with the same dairy_id and land_unit_code and status IN {PLANNED, APPLIED}. VOIDED rows release their window and are excluded."
    constants:
      REAPPLICATION_SETBACK_DAYS: 21
    precision: "whole calendar days; both interval ends inclusive"

  - name: audit_finding_severity
    trigger: "POST /verification-audits/{id}/findings"
    algorithm: threshold
    formula: |
      # Classification of the carbon-intensity discrepancy. The MINOR band is
      # CLOSED at the top: a delta of exactly MATERIAL_CI_TOLERANCE is still MINOR.
      abs_delta = abs(VerificationAudit.ci_delta)
      finding_severity = "NONE"     if abs_delta == 0.00                     else
                         "MINOR"    if abs_delta <= MATERIAL_CI_TOLERANCE    else
                         "MATERIAL"
    input_set: "The single VerificationAudit being closed out, using the ci_delta produced by the most recent POST /verification-audits/{id}/fieldwork. No other audit contributes."
    constants:
      MATERIAL_CI_TOLERANCE: 2.00
    precision: "abs_delta compared at 2 decimal places; both band edges are evaluated on the already-rounded ci_delta"

  - name: mass_control_invariant
    trigger: "POST /feedstock-deliveries, POST /feedstock-deliveries/{id}/reject, POST /ops-days/{id}/record-separation, POST /ops-days/{id}/reopen, and any cascade that cancels a FeedstockDelivery"
    algorithm: aggregation
    formula: |
      total_manure_received_tonnes      = sum(FeedstockDelivery.net_tonnes where status == ACCEPTED)
      unseparated_manure_tonnes         = sum(FeedstockDelivery.net_tonnes where status == ACCEPTED
                                              and OperationsDay.separation_recorded == false)
      digestate_solids_produced_tonnes  = sum(OperationsDay.digestate_solids_tonnes
                                              where separation_recorded == true)
      digestate_liquid_produced_tonnes  = sum(OperationsDay.digestate_liquid_tonnes
                                              where separation_recorded == true)
      mass_control_residual_tonnes = round(total_manure_received_tonnes
                                           - unseparated_manure_tonnes
                                           - digestate_solids_produced_tonnes
                                           - digestate_liquid_produced_tonnes, 3)
      # INVARIANT: mass_control_residual_tonnes == 0.000 after every mutation, including
      # after record-separation and after its compensating reopen.
    input_set: "All OperationsDay rows of the facility and all FeedstockDelivery rows on them; ACCEPTED deliveries only."
    constants: {}
    precision: "3 decimal places, round_half_up; the invariant target is exactly 0.000"

  - name: credit_control_invariant
    trigger: "POST /credit-batches/{id}/issue, POST /credit-batches/{id}/reverse, POST /credit-pathways/{id}/certification-decision with decision == REVOKE, and the cascade-A batch recomputation"
    algorithm: aggregation
    formula: |
      credits_issued_total    = sum(CreditBatch.credit_quantity_final
                                    where the batch has ever reached ISSUED)
      credits_reversed_total  = sum(CreditBatch.credit_quantity_final where status == REVERSED)
      credits_outstanding     = sum(CreditBatch.credit_quantity_final where status == ISSUED)
      credit_control_residual = round(credits_issued_total - credits_reversed_total
                                      - credits_outstanding, 3)
      # INVARIANT: credit_control_residual == 0.000 after every mutation, including after
      # issue, after its compensating reverse, and after a cascade-A revaluation that
      # rewrites credit_quantity_final on batches already issued.
    input_set: "CreditBatch rows with pathway_id == this CreditPathway.id. DRAFT, CLAIMED, VERIFIED and SUPERSEDED batches contribute nothing to any of the three totals."
    constants: {}
    precision: "3 decimal places, round_half_up; the invariant target is exactly 0.000"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 30
    category: existence
    check: "Every id in the path resolves, validated left to right"
    error_id: "ERR_DAIRY_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_DELIVERY_NOT_FOUND | ERR_OPS_DAY_NOT_FOUND | ERR_INTERCONNECT_NOT_FOUND | ERR_NOMINATION_NOT_FOUND | ERR_PATHWAY_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_STATEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 40
    category: existence
    check: "Every foreign key supplied in the request body resolves, validated in the order the fields are listed in the endpoint input"
    error_id: "ERR_DAIRY_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_OPS_DAY_NOT_FOUND | ERR_INTERCONNECT_NOT_FOUND | ERR_PATHWAY_NOT_FOUND"
    http_status: 404
    applies_to: "all creation endpoints"
  - priority: 50
    category: auth
    check: "When X-User-Role == DairyPartner, X-User-ID equals the dairy_id of the FeedstockAgreement being acted on"
    error_id: ERR_NOT_OWNING_DAIRY
    http_status: 403
    applies_to: "POST /feedstock-agreements/{id}/counter, POST /feedstock-agreements/{id}/sign"
  - priority: 60
    category: business_constraint
    check: "Request body conforms to the endpoint input schema: required fields present, numeric ranges honoured, enum members valid, decimal scale not exceeded"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 70
    category: business_temporal
    check: "Every supplied date or datetime range satisfies start <= end, and window_start_utc < window_end_utc strictly"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /feedstock-agreements, POST /injection-nominations, POST /credit-batches, POST /nutrient-applications, POST /revenue-statements, POST /credit-pathways/{id}/certification-decision"
  - priority: 80
    category: state
    check: "expected_pathway_version equals CreditPathway.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /credit-batches"
  - priority: 80
    category: state
    check: "expected_facility_version equals DigesterFacility.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /revenue-statements"
  - priority: 90
    category: state
    check: "The target resource is in a from-state that declares the requested transition in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints without a more specific state error"
  - priority: 100
    category: state
    check: "FeedstockAgreement.status == ACTIVE when a delivery is booked against it"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /feedstock-deliveries"
  - priority: 100
    category: state
    check: "CreditPathway.status == CERTIFIED"
    error_id: ERR_PATHWAY_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /credit-batches/{id}/claim, POST /credit-batches/{id}/verify, POST /credit-batches/{id}/issue, POST /verification-audits/{id}/fieldwork"
  - priority: 100
    category: state
    check: "An InterconnectAgreement with facility_id == OperationsDay.facility_id and status == ACTIVE exists"
    error_id: ERR_NO_ACTIVE_INTERCONNECT
    http_status: 409
    applies_to: "POST /ops-days/{id}/condition-gas, POST /injection-nominations"
  - priority: 100
    category: state
    check: "OperationsDay.gas_state == PIPELINE_SPEC"
    error_id: ERR_GAS_NOT_PIPELINE_SPEC
    http_status: 409
    applies_to: "POST /injection-nominations, POST /injection-nominations/{id}/schedule-decision, POST /injection-nominations/{id}/deliver"
  - priority: 100
    category: state
    check: "OperationsDay.gas_state IN {RAW, PIPELINE_SPEC, OFFSPEC} for a RECONDITION disposition, or == OFFSPEC for a FLARE disposition"
    error_id: ERR_GAS_NOT_CONDITIONABLE
    http_status: 409
    applies_to: "POST /ops-days/{id}/condition-gas"
  - priority: 100
    category: state
    check: "OperationsDay.separation_recorded == false"
    error_id: ERR_SEPARATION_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /ops-days/{id}/record-separation"
  - priority: 100
    category: state
    check: "OperationsDay.separation_recorded == true on the ops_day_id supplying the digestate"
    error_id: ERR_SEPARATION_NOT_RECORDED
    http_status: 409
    applies_to: "POST /nutrient-applications/{id}/apply"
  - priority: 105
    category: state
    check: "DigesterFacility.distribution_posture != LOCKED"
    error_id: ERR_DISTRIBUTION_LOCKED
    http_status: 409
    applies_to: "POST /revenue-statements/{id}/approve, POST /revenue-statements/{id}/pay"
  - priority: 110
    category: auth
    check: "The acting X-User-ID differs from RevenueStatement.approved_by_user_id, and differs from the X-User-ID that verified a CreditBatch when issuing it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /revenue-statements/{id}/pay, POST /credit-batches/{id}/issue"
  - priority: 120
    category: business_constraint
    check: "negotiation_round < MAX_NEGOTIATION_ROUNDS (3)"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /feedstock-agreements/{id}/counter"
  - priority: 120
    category: business_constraint
    check: "remediation_round < MAX_REMEDIATION_ROUNDS (2)"
    error_id: ERR_REMEDIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /verification-audits/{id}/remediation"
  - priority: 120
    category: business_constraint
    check: "conditioning_attempts < MAX_CONDITIONING_ATTEMPTS (2) for a RECONDITION disposition"
    error_id: ERR_CONDITIONING_ATTEMPTS_EXHAUSTED
    http_status: 422
    applies_to: "POST /ops-days/{id}/condition-gas"
  - priority: 120
    category: business_constraint
    check: "reopen_count < MAX_REOPENS (1)"
    error_id: ERR_REOPEN_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /ops-days/{id}/reopen"
  - priority: 125
    category: business_constraint
    check: "No OperationsDay with the same facility_id and ops_date already exists"
    error_id: ERR_OPS_DAY_EXISTS
    http_status: 409
    applies_to: "POST /ops-days"
  - priority: 130
    category: business_safety
    check: "DigesterFacility.ops_posture != UPSET - no feedstock may be booked into, and no day closed on, a digester in biological upset"
    error_id: ERR_FACILITY_UPSET
    http_status: 422
    applies_to: "POST /feedstock-deliveries, POST /ops-days/{id}/close"
  - priority: 135
    category: business_temporal
    check: "OperationsDay.ops_date lies inside the inclusive [term_start_date, term_end_date] of the agreement"
    error_id: ERR_OUTSIDE_AGREEMENT_TERM
    http_status: 422
    applies_to: "POST /feedstock-deliveries"
  - priority: 140
    category: business_constraint
    check: "FeedstockDelivery.total_solids_pct >= FeedstockAgreement.minimum_total_solids_pct - equality is accepted"
    error_id: ERR_SOLIDS_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /feedstock-deliveries"
  - priority: 145
    category: business_temporal
    check: "The logical clock is at least InterconnectAgreement.nomination_lead_hours whole hours before window_start_utc"
    error_id: ERR_NOMINATION_LEAD_TIME
    http_status: 422
    applies_to: "POST /injection-nominations"
  - priority: 150
    category: business_constraint
    check: "The buffered half-open window does not collide with another nomination on the same interconnect per calculations.injection_window_overlap"
    error_id: ERR_INJECTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /injection-nominations"
  - priority: 150
    category: business_constraint
    check: "The closed application interval respects the 21-day leading-edge setback on the same (dairy_id, land_unit_code) per calculations.nutrient_window_setback"
    error_id: ERR_LAND_UNIT_SETBACK_CONFLICT
    http_status: 409
    applies_to: "POST /nutrient-applications"
  - priority: 155
    category: business_referential
    check: "CreditBatch.facility_id equals CreditPathway.facility_id"
    error_id: ERR_FACILITY_PATHWAY_MISMATCH
    http_status: 422
    applies_to: "POST /credit-batches"
  - priority: 155
    category: business_referential
    check: "No CreditBatch on the same pathway with status IN {CLAIMED, VERIFIED, ISSUED} has a period overlapping the requested period"
    error_id: ERR_CREDIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /credit-batches"
  - priority: 155
    category: business_referential
    check: "No RevenueStatement on the same facility with status IN {APPROVED, PAID} has a period overlapping the requested period"
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /revenue-statements"
  - priority: 160
    category: business_constraint
    check: "nominated_mmbtu <= OperationsDay.pipeline_gas_mmbtu"
    error_id: ERR_NOMINATION_EXCEEDS_PRODUCTION
    http_status: 422
    applies_to: "POST /injection-nominations"
  - priority: 170
    category: business_fiscal
    check: "hourly_rate_mmbtu <= InterconnectAgreement.max_hourly_injection_mmbtu - equality is accepted"
    error_id: ERR_HOURLY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /injection-nominations"
  - priority: 200
    category: business_fiscal
    check: "Sum of ACCEPTED FeedstockDelivery.net_tonnes on the day plus the new net_tonnes <= DigesterFacility.hydraulic_capacity_tonnes_per_day - equality is accepted"
    error_id: ERR_HYDRAULIC_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /feedstock-deliveries"
  - priority: 200
    category: business_fiscal
    check: "At least one InjectionNomination with status == DELIVERED falls inside the batch period, so delivered_mmbtu > 0"
    error_id: ERR_NO_DELIVERED_VOLUME
    http_status: 422
    applies_to: "POST /credit-batches/{id}/claim"
  - priority: 200
    category: business_fiscal
    check: "solids_tonnes_applied <= DigesterFacility.digestate_solids_on_hand_tonnes and liquid_tonnes_applied <= DigesterFacility.digestate_liquid_on_hand_tonnes"
    error_id: ERR_DIGESTATE_INVENTORY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /nutrient-applications/{id}/apply"
  - priority: 210
    category: business_fiscal
    check: "Dairy.pan_applied_ytd_kg + plant_available_nitrogen_kg <= Dairy.annual_nitrogen_budget_kg - equality is accepted"
    error_id: ERR_NITROGEN_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /nutrient-applications/{id}/apply"
  - priority: 210
    category: business_fiscal
    check: "total_dairy_share_cents <= net_distributable_cents"
    error_id: ERR_SHARE_EXCEEDS_DISTRIBUTABLE
    http_status: 422
    applies_to: "POST /revenue-statements/{id}/approve"
  - priority: 220
    category: business_fiscal
    check: "When DigesterFacility.distribution_posture == RESTRICTED, net_distributable_cents <= RESTRICTED_PAY_CAP_CENTS (1000000)"
    error_id: ERR_DISTRIBUTION_RESTRICTED
    http_status: 422
    applies_to: "POST /revenue-statements/{id}/pay"
  - priority: 230
    category: business_constraint
    check: "delivered_mmbtu <= InjectionNomination.confirmed_mmbtu"
    error_id: ERR_DELIVERY_EXCEEDS_CONFIRMED
    http_status: 422
    applies_to: "POST /injection-nominations/{id}/deliver"
  - priority: 240
    category: business_constraint
    check: "amount_cents > 0 and reserve_balance_cents + amount_cents <= reserve_target_cents"
    error_id: ERR_RESERVE_TARGET_EXCEEDED
    http_status: 422
    applies_to: "POST /facilities/{id}/reserve-funding"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["repositions the logical clock used by nomination lead-time, signed_at and calendar-year nitrogen aggregation"]

  - method: POST
    path: "/dairies"
    description: "Register a manure supplier"
    roles: [PlatformAdmin]
    code: 201
    input: [name, county, herd_size, manure_management_baseline, haul_distance_km, annual_nitrogen_budget_kg]
    output: Dairy
    side_effects: ["creates Dairy with status PROSPECT, active_agreement_count 0, contracted_agreement_count 0, pan_applied_ytd_kg 0"]
  - method: GET
    path: "/dairies"
    description: "List dairies, filterable by status and county"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, ProgramAdministrator, CreditVerifier, FinanceController, PipelineScheduler]
    code: 200
    input: ["status?", "county?", "limit?", "offset?"]
    output: Dairy[]
    side_effects: []
  - method: GET
    path: "/dairies/{id}"
    description: "Read one dairy including its derived counters and nitrogen usage"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, ProgramAdministrator, CreditVerifier, FinanceController]
    code: 200
    input: []
    output: Dairy
    side_effects: []

  - method: POST
    path: "/facilities"
    description: "Register a digester facility; design_max_olr is derived from thermal_regime"
    roles: [PlatformAdmin]
    code: 201
    input: [name, digester_volume_m3, hydraulic_capacity_tonnes_per_day, thermal_regime, target_temperature_c, reserve_target_cents, annual_debt_service_cents, dscr_minimum]
    output: DigesterFacility
    side_effects: ["runs calculations.design_olr_limit", "sets ops_posture STABLE and distribution_posture OPEN"]
  - method: GET
    path: "/facilities"
    description: "List facilities, filterable by either posture dimension"
    roles: [PlatformAdmin, ProjectOperator, ProgramAdministrator, CreditVerifier, FinanceController, PipelineScheduler]
    code: 200
    input: ["ops_posture?", "distribution_posture?", "limit?", "offset?"]
    output: DigesterFacility[]
    side_effects: []
  - method: GET
    path: "/facilities/{id}"
    description: "Read one facility including both posture dimensions, dscr_current and the mass-control residual"
    roles: [PlatformAdmin, ProjectOperator, ProgramAdministrator, CreditVerifier, FinanceController, PipelineScheduler]
    code: 200
    input: []
    output: DigesterFacility
    side_effects: []
  - method: POST
    path: "/facilities/{id}/reserve-funding"
    description: "Inject equity into the debt-service reserve account"
    roles: [FinanceController]
    code: 200
    input: ["amount_cents", "memo?"]
    output: DigesterFacility
    side_effects: ["increases reserve_balance_cents by amount_cents", "increments DigesterFacility.version by 1"]
  - method: POST
    path: "/facilities/{id}/posture-override"
    description: "Engineering or lender override that softens one posture dimension"
    roles: [PlatformAdmin]
    code: 200
    input: [dimension, justification]
    output: DigesterFacility
    side_effects: ["sets posture_override_active true", "moves ops_posture UPSET -> RESTRICTED when dimension == OPS", "moves distribution_posture LOCKED -> RESTRICTED when dimension == DISTRIBUTION", "increments DigesterFacility.version by 1"]
  - method: GET
    path: "/facilities/{id}/financial-summary"
    description: "Computed read exposing the MASS_CONTROL invariant and the cumulative revenue ledger on the facility row"
    roles: [PlatformAdmin, ProjectOperator, FinanceController]
    code: 200
    input: []
    output: DigesterFacility
    side_effects: ["recomputes calculations.mass_control_invariant before responding"]

  - method: POST
    path: "/feedstock-agreements"
    description: "Draft a manure supply agreement"
    roles: [ProjectOperator]
    code: 201
    input: [dairy_id, facility_id, committed_tonnes_per_day, minimum_total_solids_pct, term_start_date, term_end_date, revenue_share_pct, revenue_share_basis, curtailable]
    output: FeedstockAgreement
    side_effects: ["creates FeedstockAgreement with status DRAFT and negotiation_round 0"]
  - method: GET
    path: "/feedstock-agreements"
    description: "List agreements filtered by dairy, facility or status"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, FinanceController, ProgramAdministrator]
    code: 200
    input: ["dairy_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: FeedstockAgreement[]
    side_effects: []
  - method: GET
    path: "/feedstock-agreements/{id}"
    description: "Read one agreement including counter terms and suspension reason"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, FinanceController, ProgramAdministrator]
    code: 200
    input: []
    output: FeedstockAgreement
    side_effects: []
  - method: POST
    path: "/feedstock-agreements/{id}/offer"
    description: "Send the drafted agreement to the dairy for signature"
    roles: [ProjectOperator]
    code: 200
    input: ["cover_note?"]
    output: FeedstockAgreement
    side_effects: ["moves status DRAFT -> PENDING_DAIRY_SIGNATURE", "increments FeedstockAgreement.version by 1"]
  - method: POST
    path: "/feedstock-agreements/{id}/counter"
    description: "Dairy returns revised commercial terms, opening a negotiation round"
    roles: [DairyPartner]
    code: 200
    input: ["countered_tonnes_per_day", "countered_revenue_share_pct", "comment?"]
    output: FeedstockAgreement
    side_effects: ["moves status PENDING_DAIRY_SIGNATURE -> COUNTERED", "increments negotiation_round by 1", "increments FeedstockAgreement.version by 1"]
  - method: POST
    path: "/feedstock-agreements/{id}/revise"
    description: "Operator accepts or amends the counter and returns the agreement to draft"
    roles: [ProjectOperator]
    code: 200
    input: [committed_tonnes_per_day, minimum_total_solids_pct, revenue_share_pct]
    output: FeedstockAgreement
    side_effects: ["moves status COUNTERED -> DRAFT", "overwrites the commercial terms", "clears countered_tonnes_per_day and countered_revenue_share_pct", "increments FeedstockAgreement.version by 1"]
  - method: POST
    path: "/feedstock-agreements/{id}/sign"
    description: "Dairy signs, activating the agreement"
    roles: [DairyPartner]
    code: 200
    input: [signatory_name]
    output: FeedstockAgreement
    side_effects: ["moves status PENDING_DAIRY_SIGNATURE -> ACTIVE", "sets signed_at from the logical clock", "increments Dairy.active_agreement_count and contracted_agreement_count", "re-derives Dairy.status", "increments FeedstockAgreement.version and Dairy.version by 1"]
  - method: POST
    path: "/feedstock-agreements/{id}/status-change"
    description: "Suspend, reinstate or terminate an agreement"
    roles: [ProjectOperator]
    code: 200
    input: ["action", "reason?"]
    output: FeedstockAgreement
    side_effects: ["applies the SUSPEND, REINSTATE or TERMINATE transition", "cancels ACCEPTED deliveries on OPEN days and recomputes their organic_loading_rate on SUSPEND", "re-derives Dairy.status", "increments FeedstockAgreement.version by 1"]

  - method: POST
    path: "/feedstock-deliveries"
    description: "Book a manure load against an active agreement on an open operations day"
    roles: [ProjectOperator]
    code: 201
    input: ["agreement_id", "ops_day_id", "gross_tonnes", "tare_tonnes?", "total_solids_pct", "volatile_solids_pct_of_ts"]
    output: FeedstockDelivery
    side_effects: ["computes net_tonnes, vs_tonnes and haul_tonne_km", "recomputes OperationsDay.organic_loading_rate", "recomputes calculations.mass_control_invariant on the facility", "increments OperationsDay.version and DigesterFacility.version by 1"]
  - method: GET
    path: "/feedstock-deliveries"
    description: "List deliveries filtered by agreement, operations day or status"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, CreditVerifier, FinanceController]
    code: 200
    input: ["agreement_id?", "ops_day_id?", "status?", "limit?", "offset?"]
    output: FeedstockDelivery[]
    side_effects: []
  - method: GET
    path: "/feedstock-deliveries/{id}"
    description: "Read one delivery including its derived volatile-solids mass"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, CreditVerifier, FinanceController]
    code: 200
    input: []
    output: FeedstockDelivery
    side_effects: []
  - method: POST
    path: "/feedstock-deliveries/{id}/reject"
    description: "Reject an already-booked load after re-sampling"
    roles: [ProjectOperator]
    code: 200
    input: [rejection_reason]
    output: FeedstockDelivery
    side_effects: ["moves status ACCEPTED -> REJECTED", "recomputes OperationsDay.organic_loading_rate and the facility mass-control totals"]

  - method: POST
    path: "/ops-days"
    description: "Open an operations day for a facility"
    roles: [ProjectOperator]
    code: 201
    input: [facility_id, ops_date]
    output: OperationsDay
    side_effects: ["creates OperationsDay with status OPEN and gas_state NOT_PRODUCED"]
  - method: GET
    path: "/ops-days"
    description: "List operations days filtered by facility, either state dimension, or date"
    roles: [PlatformAdmin, ProjectOperator, ProgramAdministrator, CreditVerifier, PipelineScheduler, FinanceController]
    code: 200
    input: ["facility_id?", "status?", "gas_state?", "ops_date?", "limit?", "offset?"]
    output: OperationsDay[]
    side_effects: []
  - method: GET
    path: "/ops-days/{id}"
    description: "Read one operations day including loading rate, stability, gas and digestate results"
    roles: [PlatformAdmin, ProjectOperator, ProgramAdministrator, CreditVerifier, PipelineScheduler, FinanceController]
    code: 200
    input: []
    output: OperationsDay
    side_effects: []
  - method: POST
    path: "/ops-days/{id}/close"
    description: "Close the day with process monitoring and raw gas analysis"
    roles: [ProjectOperator]
    code: 200
    input: [avg_digester_temp_c, temp_excursion_minutes, vfa_mg_per_l, alkalinity_mg_per_l, raw_biogas_scf, raw_ch4_pct, raw_co2_pct, raw_h2s_ppm, raw_moisture_lb_per_mmscf]
    output: OperationsDay
    side_effects: ["moves status OPEN -> CLOSED and gas_state NOT_PRODUCED -> RAW", "runs calculations.organic_loading_rate then calculations.biological_stability_assessment", "re-derives DigesterFacility.ops_posture, which on INHIBITED starts cascade B", "increments OperationsDay.version and DigesterFacility.version by 1"]
  - method: POST
    path: "/ops-days/{id}/reopen"
    description: "Reopen a closed day, rewinding the gas and digestate dimension"
    roles: [ProjectOperator]
    code: 200
    input: [reason]
    output: OperationsDay
    side_effects: ["moves status CLOSED -> OPEN and gas_state back to NOT_PRODUCED", "clears separation_recorded and zeroes the digestate tonnages", "resets conditioning_attempts to 0", "recomputes calculations.mass_control_invariant, which MUST return to 0.000", "increments reopen_count, OperationsDay.version and DigesterFacility.version by 1"]
  - method: POST
    path: "/ops-days/{id}/condition-gas"
    description: "Record a conditioning pass (H2S, moisture and CO2 removal) or flare the day's gas"
    roles: [ProjectOperator]
    code: 200
    input: ["disposition?", "treated_ch4_pct?", "treated_co2_pct?", "treated_h2s_ppm?", "treated_moisture_lb_per_mmscf?"]
    output: OperationsDay
    side_effects: ["runs calculations.gas_conditioning_yield", "branches gas_state to PIPELINE_SPEC or OFFSPEC, or to FLARED on disposition FLARE", "on a PIPELINE_SPEC -> OFFSPEC re-test starts cascade C by rejecting nominations, raising InterconnectAgreement.curtailment_count and suspending the interconnect at the threshold", "increments conditioning_attempts and OperationsDay.version by 1"]
  - method: POST
    path: "/ops-days/{id}/record-separation"
    description: "Record screw-press solids separation, bedding recovery and the liquid nitrogen laboratory result"
    roles: [ProjectOperator]
    code: 200
    input: [solids_capture_pct, bedding_recovery_pct, lab_total_nitrogen_mg_per_l]
    output: OperationsDay
    side_effects: ["runs calculations.digestate_separation", "sets separation_recorded true", "increases the facility digestate production totals and recomputes calculations.mass_control_invariant, which MUST stay 0.000", "increments OperationsDay.version and DigesterFacility.version by 1"]

  - method: POST
    path: "/interconnect-agreements"
    description: "Register a pipeline interconnection agreement with its gas quality specification"
    roles: [PipelineScheduler]
    code: 201
    input: [facility_id, pipeline_operator_name, max_h2s_ppm, max_moisture_lb_per_mmscf, max_co2_pct, min_hhv_btu_per_scf, max_hourly_injection_mmbtu, ramp_buffer_minutes, nomination_lead_hours]
    output: InterconnectAgreement
    side_effects: ["creates InterconnectAgreement with status ACTIVE and curtailment_count 0"]
  - method: GET
    path: "/interconnect-agreements"
    description: "List interconnection agreements filtered by facility or status"
    roles: [PlatformAdmin, ProjectOperator, PipelineScheduler, ProgramAdministrator, FinanceController]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: InterconnectAgreement[]
    side_effects: []
  - method: GET
    path: "/interconnect-agreements/{id}"
    description: "Read one interconnection agreement including its curtailment counter"
    roles: [PlatformAdmin, ProjectOperator, PipelineScheduler, ProgramAdministrator, FinanceController]
    code: 200
    input: []
    output: InterconnectAgreement
    side_effects: []
  - method: POST
    path: "/interconnect-agreements/{id}/status-change"
    description: "Reinstate or terminate an interconnection agreement"
    roles: [PipelineScheduler]
    code: 200
    input: ["action", "reason?"]
    output: InterconnectAgreement
    side_effects: ["applies the REINSTATE or TERMINATE transition", "resets curtailment_count to 0 on REINSTATE", "increments InterconnectAgreement.version by 1"]

  - method: POST
    path: "/injection-nominations"
    description: "Nominate conditioned gas into a half-open injection window"
    roles: [PipelineScheduler]
    code: 201
    input: [interconnect_id, ops_day_id, window_start_utc, window_end_utc, nominated_mmbtu]
    output: InjectionNomination
    side_effects: ["runs calculations.injection_window_overlap", "computes window_minutes and hourly_rate_mmbtu", "creates InjectionNomination with status NOMINATED"]
  - method: GET
    path: "/injection-nominations"
    description: "List nominations filtered by interconnect, operations day or status"
    roles: [PlatformAdmin, ProjectOperator, PipelineScheduler, ProgramAdministrator, CreditVerifier]
    code: 200
    input: ["interconnect_id?", "ops_day_id?", "status?", "limit?", "offset?"]
    output: InjectionNomination[]
    side_effects: []
  - method: GET
    path: "/injection-nominations/{id}"
    description: "Read one nomination including confirmed and delivered energy"
    roles: [PlatformAdmin, ProjectOperator, PipelineScheduler, ProgramAdministrator, CreditVerifier]
    code: 200
    input: []
    output: InjectionNomination
    side_effects: []
  - method: POST
    path: "/injection-nominations/{id}/schedule-decision"
    description: "Confirm the nomination in full or curtail it to a smaller volume"
    roles: [PipelineScheduler]
    code: 200
    input: ["decision", "curtailed_mmbtu?", "reason?"]
    output: InjectionNomination
    side_effects: ["moves status NOMINATED -> CONFIRMED or NOMINATED -> CURTAILED", "sets confirmed_mmbtu", "on CURTAIL increments InterconnectAgreement.curtailment_count and suspends the interconnect at the threshold", "increments InjectionNomination.version by 1"]
  - method: POST
    path: "/injection-nominations/{id}/deliver"
    description: "Record actual injection against a confirmed or curtailed nomination"
    roles: [PipelineScheduler]
    code: 200
    input: [delivered_mmbtu]
    output: InjectionNomination
    side_effects: ["moves status to DELIVERED", "sets delivered_mmbtu", "sets OperationsDay.gas_state PIPELINE_SPEC -> INJECTED", "increments InjectionNomination.version and OperationsDay.version by 1"]

  - method: POST
    path: "/credit-pathways"
    description: "Register an environmental credit pathway application"
    roles: [ProgramAdministrator]
    code: 201
    input: [facility_id, program, pathway_code]
    output: CreditPathway
    side_effects: ["creates CreditPathway with status PROVISIONAL and all credit counters at 0"]
  - method: GET
    path: "/credit-pathways"
    description: "List pathways filtered by facility, program or status"
    roles: [PlatformAdmin, ProjectOperator, ProgramAdministrator, CreditVerifier, FinanceController]
    code: 200
    input: ["facility_id?", "program?", "status?", "limit?", "offset?"]
    output: CreditPathway[]
    side_effects: []
  - method: GET
    path: "/credit-pathways/{id}"
    description: "Read one pathway including both carbon intensity scores and the adjustment"
    roles: [PlatformAdmin, ProjectOperator, ProgramAdministrator, CreditVerifier, FinanceController]
    code: 200
    input: []
    output: CreditPathway
    side_effects: []
  - method: POST
    path: "/credit-pathways/{id}/certification-decision"
    description: "Certify, reinstate or revoke a pathway; certification computes the CERTIFIED carbon intensity over a reference window"
    roles: [ProgramAdministrator]
    code: 200
    input: ["decision", "reference_start_date?", "reference_end_date?", "reason?"]
    output: CreditPathway
    side_effects: ["on CERTIFY runs the CERTIFIED variant of calculations.pathway_ci_score and sets certified_ci_score", "on REVOKE reverses every ISSUED batch and recomputes calculations.credit_control_invariant", "increments CreditPathway.version by 1"]
  - method: GET
    path: "/credit-pathways/{id}/credit-ledger"
    description: "Computed read exposing the CREDIT_CONTROL invariant on the pathway row"
    roles: [ProgramAdministrator, CreditVerifier, FinanceController]
    code: 200
    input: []
    output: CreditPathway
    side_effects: ["recomputes calculations.credit_control_invariant before responding"]

  - method: POST
    path: "/credit-batches"
    description: "Open a credit batch for a settlement period; supersedes any overlapping DRAFT batch on the same pathway"
    roles: [ProgramAdministrator]
    code: 201
    input: [pathway_id, facility_id, period_start_date, period_end_date, expected_pathway_version]
    output: CreditBatch
    side_effects: ["rejects a stale expected_pathway_version with ERR_STALE_VERSION (412)", "moves any overlapping DRAFT batch on the pathway to SUPERSEDED and sets its superseded_by_batch_id", "increments CreditPathway.version by 1"]
  - method: GET
    path: "/credit-batches"
    description: "List credit batches filtered by pathway, facility, status or the batch that superseded them"
    roles: [PlatformAdmin, ProgramAdministrator, CreditVerifier, FinanceController]
    code: 200
    input: ["pathway_id?", "facility_id?", "status?", "superseded_by_batch_id?", "limit?", "offset?"]
    output: CreditBatch[]
    side_effects: []
  - method: GET
    path: "/credit-batches/{id}"
    description: "Read one credit batch including both credit quantities and the monetised value"
    roles: [PlatformAdmin, ProgramAdministrator, CreditVerifier, FinanceController]
    code: 200
    input: []
    output: CreditBatch
    side_effects: []
  - method: POST
    path: "/credit-batches/{id}/claim"
    description: "Claim the batch, aggregating delivered energy and computing the provisional credit quantity"
    roles: [ProgramAdministrator]
    code: 200
    input: ["claim_note?"]
    output: CreditBatch
    side_effects: ["moves status DRAFT -> CLAIMED", "recomputes delivered_mmbtu", "runs the PROVISIONAL variant of calculations.credit_quantity", "increments CreditBatch.version by 1"]
  - method: POST
    path: "/credit-batches/{id}/verify"
    description: "Third-party verification of the batch, computing the final credit quantity and value"
    roles: [CreditVerifier]
    code: 200
    input: ["verifier_note?"]
    output: CreditBatch
    side_effects: ["moves status CLAIMED -> VERIFIED", "runs the FINAL variant of calculations.credit_quantity setting credit_quantity_final and credit_value_cents", "increments CreditBatch.version by 1"]
  - method: POST
    path: "/credit-batches/{id}/issue"
    description: "Issue the verified credits into the registry; the issuer must not be the verifier"
    roles: [ProgramAdministrator]
    code: 200
    input: ["issuance_reference?"]
    output: CreditBatch
    side_effects: ["moves status VERIFIED -> ISSUED", "increases CreditPathway.credits_issued_total and credits_outstanding", "recomputes calculations.credit_control_invariant, which MUST stay 0.000", "increments CreditBatch.version and CreditPathway.version by 1"]
  - method: POST
    path: "/credit-batches/{id}/reverse"
    description: "Reverse issued credits, the compensating action for issue"
    roles: [ProgramAdministrator]
    code: 200
    input: [reversal_reason]
    output: CreditBatch
    side_effects: ["moves status ISSUED -> REVERSED", "increases credits_reversed_total and decreases credits_outstanding by credit_quantity_final", "recomputes calculations.credit_control_invariant, which MUST return to 0.000", "recomputes every DRAFT RevenueStatement whose period contains the batch period", "increments CreditBatch.version and CreditPathway.version by 1"]

  - method: POST
    path: "/verification-audits"
    description: "Open the annual verification audit for a pathway"
    roles: [CreditVerifier]
    code: 201
    input: [pathway_id, audit_year, verifier_body_name]
    output: VerificationAudit
    side_effects: ["creates VerificationAudit with status FIELDWORK and remediation_round 0"]
  - method: GET
    path: "/verification-audits"
    description: "List verification audits filtered by pathway or status"
    roles: [PlatformAdmin, ProjectOperator, ProgramAdministrator, CreditVerifier, FinanceController]
    code: 200
    input: ["pathway_id?", "status?", "limit?", "offset?"]
    output: VerificationAudit[]
    side_effects: []
  - method: GET
    path: "/verification-audits/{id}"
    description: "Read one audit including the reported carbon intensity, delta and severity"
    roles: [PlatformAdmin, ProjectOperator, ProgramAdministrator, CreditVerifier, FinanceController]
    code: 200
    input: []
    output: VerificationAudit
    side_effects: []
  - method: POST
    path: "/verification-audits/{id}/fieldwork"
    description: "Record audited actuals and compute the VERIFIED carbon intensity"
    roles: [CreditVerifier]
    code: 200
    input: [actual_pipeline_mmbtu, actual_vs_tonnes_lagoon, actual_vs_tonnes_solid_storage, actual_vs_tonnes_daily_spread, actual_haul_tonne_km, actual_process_g_per_mj]
    output: VerificationAudit
    side_effects: ["runs the VERIFIED variant of calculations.pathway_ci_score setting reported_ci_score and ci_delta", "clears finding_severity when returning from REMEDIATION", "increments VerificationAudit.version by 1"]
  - method: POST
    path: "/verification-audits/{id}/findings"
    description: "Issue findings, classifying the carbon-intensity delta as NONE, MINOR or MATERIAL"
    roles: [CreditVerifier]
    code: 200
    input: ["narrative?"]
    output: VerificationAudit
    side_effects: ["moves status FIELDWORK -> FINDINGS_ISSUED and sets finding_severity", "on MATERIAL starts cascade A by suspending the pathway, revaluing its VERIFIED and ISSUED batches, recomputing every DRAFT statement and re-deriving distribution_posture", "increments VerificationAudit.version by 1"]
  - method: POST
    path: "/verification-audits/{id}/remediation"
    description: "Operator opens a remediation round in response to findings"
    roles: [ProjectOperator]
    code: 200
    input: [remediation_plan]
    output: VerificationAudit
    side_effects: ["moves status FINDINGS_ISSUED -> REMEDIATION", "increments remediation_round and VerificationAudit.version by 1"]
  - method: POST
    path: "/verification-audits/{id}/close"
    description: "Close the audit"
    roles: [CreditVerifier]
    code: 200
    input: ["closing_note?"]
    output: VerificationAudit
    side_effects: ["moves status to CLOSED", "increments VerificationAudit.version by 1"]

  - method: POST
    path: "/nutrient-applications"
    description: "Plan a digestate land application on a dairy land unit"
    roles: [ProjectOperator]
    code: 201
    input: [dairy_id, facility_id, ops_day_id, land_unit_code, application_start_date, application_end_date, solids_tonnes_applied, liquid_tonnes_applied, pan_basis]
    output: NutrientApplication
    side_effects: ["runs calculations.nutrient_window_setback", "runs calculations.plant_available_nitrogen", "creates NutrientApplication with status PLANNED"]
  - method: GET
    path: "/nutrient-applications"
    description: "List applications filtered by dairy, facility, source day, land unit or status"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, CreditVerifier]
    code: 200
    input: ["dairy_id?", "facility_id?", "ops_day_id?", "status?", "land_unit_code?", "limit?", "offset?"]
    output: NutrientApplication[]
    side_effects: []
  - method: GET
    path: "/nutrient-applications/{id}"
    description: "Read one application including its plant-available nitrogen"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, CreditVerifier]
    code: 200
    input: []
    output: NutrientApplication
    side_effects: []
  - method: POST
    path: "/nutrient-applications/{id}/apply"
    description: "Commit the application, drawing down digestate inventory and charging the nitrogen budget"
    roles: [ProjectOperator]
    code: 200
    input: ["applicator_name?"]
    output: NutrientApplication
    side_effects: ["moves status PLANNED -> APPLIED", "recomputes calculations.plant_available_nitrogen", "moves digestate tonnage from on-hand to applied", "increases Dairy.pan_applied_ytd_kg", "increments NutrientApplication.version, DigesterFacility.version and Dairy.version by 1"]
  - method: POST
    path: "/nutrient-applications/{id}/void"
    description: "Void an application, the compensating action for apply"
    roles: [ProjectOperator]
    code: 200
    input: [void_reason]
    output: NutrientApplication
    side_effects: ["moves status to VOIDED", "restores the digestate on-hand tonnages", "decreases Dairy.pan_applied_ytd_kg", "increments NutrientApplication.version, DigesterFacility.version and Dairy.version by 1"]

  - method: POST
    path: "/revenue-statements"
    description: "Open a settlement statement; runs the waterfall, the dairy share allocation and the covenant test"
    roles: [FinanceController]
    code: 201
    input: [facility_id, period_start_date, period_end_date, gas_revenue_cents, expected_facility_version]
    output: RevenueStatement
    side_effects: ["rejects a stale expected_facility_version with ERR_STALE_VERSION (412)", "moves any overlapping DRAFT statement to SUPERSEDED and sets its superseded_by_statement_id", "runs calculations.net_distributable_waterfall then calculations.dairy_share_allocation then calculations.dscr_and_distribution_posture", "re-derives DigesterFacility.distribution_posture", "increments DigesterFacility.version by 1"]
  - method: GET
    path: "/revenue-statements"
    description: "List statements filtered by facility, status or the statement that superseded them"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, FinanceController, ProgramAdministrator]
    code: 200
    input: ["facility_id?", "status?", "superseded_by_statement_id?", "limit?", "offset?"]
    output: RevenueStatement[]
    side_effects: []
  - method: GET
    path: "/revenue-statements/{id}"
    description: "Read one statement including the full waterfall and the dairy share lines"
    roles: [PlatformAdmin, ProjectOperator, DairyPartner, FinanceController, ProgramAdministrator]
    code: 200
    input: []
    output: RevenueStatement
    side_effects: []
  - method: POST
    path: "/revenue-statements/{id}/approve"
    description: "Approve the statement for payment"
    roles: [FinanceController]
    code: 200
    input: ["approval_note?"]
    output: RevenueStatement
    side_effects: ["moves status DRAFT -> APPROVED", "records approved_by_user_id", "increments RevenueStatement.version by 1"]
  - method: POST
    path: "/revenue-statements/{id}/pay"
    description: "Release payment; the payer must differ from the approver"
    roles: [FinanceController]
    code: 200
    input: [payment_reference]
    output: RevenueStatement
    side_effects: ["moves status APPROVED -> PAID", "records paid_by_user_id", "increases DigesterFacility.dairy_share_paid_cents, retained_to_date_cents and reserve_balance_cents", "increments RevenueStatement.version and DigesterFacility.version by 1"]
  - method: POST
    path: "/revenue-statements/{id}/claw-back"
    description: "Claw back a paid statement and re-derive the covenant posture"
    roles: [FinanceController]
    code: 200
    input: [claw_back_reason]
    output: RevenueStatement
    side_effects: ["moves status PAID -> CLAWED_BACK", "reverses the facility ledger and reserve movements", "recomputes calculations.dscr_and_distribution_posture", "increments RevenueStatement.version and DigesterFacility.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint roles"
  - id: ERR_NOT_OWNING_DAIRY
    http: 403
    condition: "A DairyPartner acts on a FeedstockAgreement whose dairy_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The paying X-User-ID equals approved_by_user_id, or the issuing X-User-ID equals the verifying X-User-ID of the batch"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, enum value not permitted, or numeric constraint violated"
  - id: ERR_DAIRY_NOT_FOUND
    http: 404
    condition: "No Dairy with the given id"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "No DigesterFacility with the given id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No FeedstockAgreement with the given id"
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "No FeedstockDelivery with the given id"
  - id: ERR_OPS_DAY_NOT_FOUND
    http: 404
    condition: "No OperationsDay with the given id"
  - id: ERR_INTERCONNECT_NOT_FOUND
    http: 404
    condition: "No InterconnectAgreement with the given id"
  - id: ERR_NOMINATION_NOT_FOUND
    http: 404
    condition: "No InjectionNomination with the given id"
  - id: ERR_PATHWAY_NOT_FOUND
    http: 404
    condition: "No CreditPathway with the given id"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No CreditBatch with the given id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "No VerificationAudit with the given id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No NutrientApplication with the given id"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "No RevenueStatement with the given id"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_pathway_version or expected_facility_version does not equal the parent entity current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the resource current state"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "A supplied range has start after end, or an injection window has window_start_utc >= window_end_utc"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "A delivery is booked against a FeedstockAgreement whose status is not ACTIVE"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: "A fourth counter is attempted on an agreement whose negotiation_round is already 3"
  - id: ERR_OPS_DAY_EXISTS
    http: 409
    condition: "An OperationsDay already exists for the same facility_id and ops_date"
  - id: ERR_FACILITY_UPSET
    http: 422
    condition: "Feedstock is booked into, or a day closed on, a facility whose ops_posture is UPSET"
  - id: ERR_OUTSIDE_AGREEMENT_TERM
    http: 422
    condition: "The operations day date falls outside the inclusive agreement term"
  - id: ERR_SOLIDS_BELOW_MINIMUM
    http: 422
    condition: "Delivered total_solids_pct is strictly below the agreement minimum_total_solids_pct"
  - id: ERR_HYDRAULIC_CAPACITY_EXCEEDED
    http: 422
    condition: "Accepted tonnage on the day would exceed the facility hydraulic_capacity_tonnes_per_day"
  - id: ERR_REOPEN_LIMIT_REACHED
    http: 422
    condition: "A day is reopened more than MAX_REOPENS times"
  - id: ERR_GAS_NOT_CONDITIONABLE
    http: 409
    condition: "Conditioning is attempted from a gas_state that does not permit it, or a flare is attempted from a state other than OFFSPEC"
  - id: ERR_CONDITIONING_ATTEMPTS_EXHAUSTED
    http: 422
    condition: "A third RECONDITION pass is attempted on the same operations day"
  - id: ERR_SEPARATION_ALREADY_RECORDED
    http: 409
    condition: "Separation is recorded twice on the same operations day without an intervening reopen"
  - id: ERR_SEPARATION_NOT_RECORDED
    http: 409
    condition: "An application is committed against an operations day whose separation_recorded is false"
  - id: ERR_NO_ACTIVE_INTERCONNECT
    http: 409
    condition: "No InterconnectAgreement with status ACTIVE exists for the facility"
  - id: ERR_GAS_NOT_PIPELINE_SPEC
    http: 409
    condition: "The operations day gas_state is not PIPELINE_SPEC when a nomination is created, decided or delivered"
  - id: ERR_NOMINATION_LEAD_TIME
    http: 422
    condition: "The logical clock is closer to window_start_utc than nomination_lead_hours"
  - id: ERR_INJECTION_WINDOW_OVERLAP
    http: 409
    condition: "The buffered half-open window collides with another nomination on the same interconnect"
  - id: ERR_NOMINATION_EXCEEDS_PRODUCTION
    http: 422
    condition: "nominated_mmbtu exceeds the operations day pipeline_gas_mmbtu"
  - id: ERR_HOURLY_CAPACITY_EXCEEDED
    http: 422
    condition: "hourly_rate_mmbtu is strictly greater than max_hourly_injection_mmbtu"
  - id: ERR_DELIVERY_EXCEEDS_CONFIRMED
    http: 422
    condition: "delivered_mmbtu exceeds confirmed_mmbtu"
  - id: ERR_PATHWAY_NOT_CERTIFIED
    http: 409
    condition: "A batch or audit operation requires CreditPathway.status == CERTIFIED"
  - id: ERR_FACILITY_PATHWAY_MISMATCH
    http: 422
    condition: "CreditBatch.facility_id does not equal CreditPathway.facility_id"
  - id: ERR_CREDIT_PERIOD_OVERLAP
    http: 409
    condition: "A CLAIMED, VERIFIED or ISSUED batch on the same pathway already covers part of the requested period"
  - id: ERR_NO_DELIVERED_VOLUME
    http: 422
    condition: "No DELIVERED nomination falls inside the batch period, so delivered_mmbtu is 0.000"
  - id: ERR_REMEDIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: "A third remediation round is opened on the same audit"
  - id: ERR_DIGESTATE_INVENTORY_INSUFFICIENT
    http: 422
    condition: "Applied solids or liquid tonnage exceeds the facility on-hand digestate inventory"
  - id: ERR_LAND_UNIT_SETBACK_CONFLICT
    http: 409
    condition: "The application window overlaps, or falls within the 21-day leading-edge setback of, another application on the same dairy land unit"
  - id: ERR_NITROGEN_BUDGET_EXCEEDED
    http: 422
    condition: "Committed plant-available nitrogen would push the dairy calendar-year total above annual_nitrogen_budget_kg"
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 409
    condition: "An APPROVED or PAID statement on the same facility already covers part of the requested period"
  - id: ERR_SHARE_EXCEEDS_DISTRIBUTABLE
    http: 422
    condition: "total_dairy_share_cents exceeds net_distributable_cents at approval"
  - id: ERR_DISTRIBUTION_LOCKED
    http: 409
    condition: "The facility distribution_posture is LOCKED"
  - id: ERR_DISTRIBUTION_RESTRICTED
    http: 422
    condition: "The facility distribution_posture is RESTRICTED and net_distributable_cents exceeds RESTRICTED_PAY_CAP_CENTS"
  - id: ERR_RESERVE_TARGET_EXCEEDED
    http: 422
    condition: "Reserve funding would push reserve_balance_cents above reserve_target_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator that registers master data, moves the logical clock and grants posture overrides"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /dairies"
      - "POST /facilities"
      - "POST /facilities/{id}/posture-override"
    shared_operations:
      - "GET /dairies"
      - "GET /dairies/{id}"
      - "GET /facilities"
      - "GET /facilities/{id}"
      - "GET /facilities/{id}/financial-summary"
      - "all other GET list and detail endpoints"
  - name: ProjectOperator
    description: "Digester operations team that runs the plant, books feedstock, conditions gas, separates digestate and manages land application"
    identity: "opaque"
    exclusive_operations:
      - "POST /feedstock-agreements"
      - "POST /feedstock-agreements/{id}/offer"
      - "POST /feedstock-agreements/{id}/revise"
      - "POST /feedstock-agreements/{id}/status-change"
      - "POST /feedstock-deliveries"
      - "POST /feedstock-deliveries/{id}/reject"
      - "POST /ops-days"
      - "POST /ops-days/{id}/close"
      - "POST /ops-days/{id}/reopen"
      - "POST /ops-days/{id}/condition-gas"
      - "POST /ops-days/{id}/record-separation"
      - "POST /nutrient-applications"
      - "POST /nutrient-applications/{id}/apply"
      - "POST /nutrient-applications/{id}/void"
      - "POST /verification-audits/{id}/remediation"
    shared_operations:
      - "GET /facilities/{id}/financial-summary"
      - "all GET list and detail endpoints except GET /credit-pathways/{id}/credit-ledger"
  - name: DairyPartner
    description: "Manure supplier acting for its own Dairy; may counter and sign agreements naming that dairy and read its own settlement lines"
    identity: "entity_backed:Dairy"
    exclusive_operations:
      - "POST /feedstock-agreements/{id}/counter"
      - "POST /feedstock-agreements/{id}/sign"
    shared_operations:
      - "GET /dairies"
      - "GET /dairies/{id}"
      - "GET /feedstock-agreements"
      - "GET /feedstock-agreements/{id}"
      - "GET /feedstock-deliveries"
      - "GET /feedstock-deliveries/{id}"
      - "GET /nutrient-applications"
      - "GET /nutrient-applications/{id}"
      - "GET /revenue-statements"
      - "GET /revenue-statements/{id}"
  - name: PipelineScheduler
    description: "Pipeline interconnection and gas scheduling desk"
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnect-agreements"
      - "POST /interconnect-agreements/{id}/status-change"
      - "POST /injection-nominations"
      - "POST /injection-nominations/{id}/schedule-decision"
      - "POST /injection-nominations/{id}/deliver"
    shared_operations:
      - "GET /dairies"
      - "GET /facilities"
      - "GET /facilities/{id}"
      - "GET /ops-days"
      - "GET /ops-days/{id}"
      - "GET /interconnect-agreements"
      - "GET /interconnect-agreements/{id}"
      - "GET /injection-nominations"
      - "GET /injection-nominations/{id}"
  - name: CreditVerifier
    description: "Accredited third-party verifier; runs annual audits and verifies credit batches but may never issue them"
    identity: "opaque"
    exclusive_operations:
      - "POST /credit-batches/{id}/verify"
      - "POST /verification-audits"
