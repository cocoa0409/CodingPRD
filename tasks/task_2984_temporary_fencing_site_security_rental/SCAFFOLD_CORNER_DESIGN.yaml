      - name: quote_pricing_all_five_factors_at_once
        claim_type: correct_result
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.monthly_recurring_cents
          - entities.Quote.fields.one_time_cents
        excluded_because:
          difficulty_instance: quote_pricing_five_factor_combination
          rationale: "The named §1.8 instance drives all five pricing factors in one quote (tier, screen factor plus adder, add-on rates, term discount, condition labour) and asserts every intermediate S-step figure including the S10 waiver read of the post-discount monthly."

      - name: panel_rate_bands_at_the_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.quote_pricing
          - calculations.quote_pricing.constants.PANEL_TIER_RATE_CENTS_PER_FT
        excluded_because:
          difficulty_instance: panel_tier_boundary_at_250_and_500_feet
          rationale: "The named §1.8 instance prices 250, 251, 500 and 501 linear feet and asserts the flat-rate (not marginal) behaviour on both sides of both band edges."

      - name: daily_rate_rounded_before_it_is_multiplied
        claim_type: precision
        grounds:
          - calculations.invoice_period_charge
          - calculations.invoice_period_charge.variants.event_daily_proration
        excluded_because:
          difficulty_instance: event_daily_rate_rounding_order
          rationale: "The named §1.8 instance asserts the E3-then-E4 order explicitly and contrasts it with the multiply-then-round figure, which is the only observable difference the precision rule makes."

      - name: free_cancellation_notice_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.cancellation_fee
          - calculations.cancellation_fee.constants.FREE_CANCELLATION_NOTICE_HOURS
        excluded_because:
          difficulty_instance: cancellation_notice_72_hour_boundary
          rationale: "The named §1.8 instance cancels at exactly the free-notice boundary and one second inside it, asserting the zero fee with no CANCELLATION invoice on one side and the computed fee on the other."

      - name: corridor_aggregate_counts_only_intersecting_windows
        claim_type: aggregation
        grounds:
          - calculations.closure_corridor_utilization
          - validations.priority_17_ERR_CLOSURE_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: municipal_corridor_aggregate_and_adjacent_window
          rationale: "The named §1.8 instance asserts the running aggregate at the cap, the strict-excess refusal and the adjacent window that starts exactly when another ends and therefore contends for nothing."

      - name: event_and_construction_prorate_the_same_window_differently
        claim_type: variant_divergence
        grounds:
          - calculations.invoice_period_charge.variants.event_daily_proration
          - calculations.invoice_period_charge.variants.construction_cycle_proration
        excluded_because:
          difficulty_instance: event_vs_construction_proration_divergence
          rationale: "The named §1.8 instance bills the identical window on an EVENT and a CONSTRUCTION contract with the same monthly figure and asserts both results and the delta between them."

      - name: police_report_and_contract_type_select_the_loss_variant
        claim_type: variant_selection
        grounds:
          - calculations.reconciliation_loss_assessment.variant_selection
          - entities.RemovalReconciliation.fields.assessment_variant
        excluded_because:
          difficulty_instance: theft_loss_replacement_vs_depreciated_divergence
          rationale: "The named §1.8 instance finalizes with and without a police report on both contract types and asserts the recorded assessment_variant plus the per-product depreciation floor in the depreciated branch."

  - section: validations
    instances:

      - name: construction_term_two_and_event_term_two_rejected
        claim_type: violation_error
        grounds:
          - validations.priority_24_ERR_BELOW_MINIMUM_TERM
          - errors.ERR_BELOW_MINIMUM_TERM
          - entities.Quote.fields.term_months
        distinguishing_aspect: |
          The minimum-term rule is asymmetric, so term_months 2 is refused for
          both contract types but for opposite reasons: CONSTRUCTION needs at
          least 3 months and EVENT needs exactly 1, and the same jobsite then
          accepts an EVENT quote at term_months 1 whose surge-priced monthly is
          33750.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01, account A, product PANEL-CL-10, jobsite J1 (SOIL, requires_sidewalk_closure false)."
            - "No quotes yet, so Jobsite.version is 1 and the two refused calls leave it unchanged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { m1_id: "$.data.id" }
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id" }
            - call: "POST /fence-rentals/products"
              payload: { code: "PANEL-CL-10", category: "FENCE_PANEL", description: "10 ft chain-link fence panel", panel_length_ft: 10, unit_monthly_rate_cents: 0, replacement_cost_cents_per_unit: 24000, fleet_age_months: 18, wind_load_rating_mph: 90, owned_count: 400 }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Foundry Road Phase Yard", address_line: "402 Foundry Road", site_condition: "SOIL", phase_count: 1, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id", j1_v: "$.data.version" }
          trigger:
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "CONSTRUCTION", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 2, wind_screen: "NONE" }
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "EVENT", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 2, wind_screen: "NONE" }
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "EVENT", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 1, wind_screen: "NONE" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { q_ok_id: "$.data.id" }
          assert:
            - "First trigger: HTTP 409 with data.error_id == \"ERR_BELOW_MINIMUM_TERM\" (2 < 3)"
            - "Second trigger: HTTP 409 with data.error_id == \"ERR_BELOW_MINIMUM_TERM\" (EVENT must be exactly 1, and 2 is refused even though it exceeds the construction floor's direction)"
            - "Both refusals leave Jobsite.${j1_id}.version == 1, which is why the third call can reuse the same expected_jobsite_version"
            - "Third trigger: HTTP 201 and Quote.${q_ok_id}.term_months == 1"
            - "Quote.${q_ok_id}.monthly_recurring_cents == 33750 (27000 * 1.25 surge, no term discount on EVENT)"
            - "Quote.${q_ok_id}.one_time_cents == 78500"

      - name: permit_submitted_at_exactly_the_lead_time_boundary_admitted
        claim_type: satisfaction_pass
        grounds:
          - validations.priority_13_ERR_PERMIT_LEAD_TIME_NOT_MET
          - errors.ERR_PERMIT_LEAD_TIME_NOT_MET
          - entities.Municipality.fields.permit_lead_time_days
        distinguishing_aspect: |
          The lead-time comparison is `>=` against clock + 5 x 86400 seconds
          measured in whole seconds, so a closure starting at exactly
          2026-08-06T00:00:00Z is admitted while one starting one second earlier
          at 2026-08-05T23:59:59Z is refused — the boundary itself passes and
          only the second permit is left in DRAFT.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01 with permit_lead_time_days 5 and max_concurrent_closure_linear_feet 800."
            - "Account A with jobsite J1 (requires_sidewalk_closure true)."
            - "Permit P1 in DRAFT for 300 ft over [2026-08-06T00:00:00Z, 2026-08-16T00:00:00Z) — exactly five days out."
            - "Permit P2 in DRAFT for 200 ft over [2026-08-05T23:59:59Z, 2026-08-15T00:00:00Z) — one second short."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { m1_id: "$.data.id" }
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id" }
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Dock Street North", address_line: "8 Dock Street", site_condition: "ASPHALT", phase_count: 1, requires_sidewalk_closure: true }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id" }
            - call: "POST /fence-rentals/permits"
              payload: { jobsite_id: "${j1_id}", closure_linear_feet: 300, closure_start_utc: "2026-08-06T00:00:00Z", closure_end_utc: "2026-08-16T00:00:00Z", sidewalk_closure_type: "PARTIAL" }
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm1_id: "$.data.id" }
            - call: "POST /fence-rentals/permits"
              payload: { jobsite_id: "${j1_id}", closure_linear_feet: 200, closure_start_utc: "2026-08-05T23:59:59Z", closure_end_utc: "2026-08-15T00:00:00Z", sidewalk_closure_type: "LANE_SHIFT" }
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm2_id: "$.data.id" }
          trigger:
            - call: "POST /fence-rentals/permits/${pm1_id}/submit"
              payload: {}
              as: MunicipalLiaison
              as_user_id: "ml-001"
            - call: "POST /fence-rentals/permits/${pm2_id}/submit"
              payload: {}
              as: MunicipalLiaison
              as_user_id: "ml-001"
          assert:
            - "First trigger: HTTP 200 (the boundary is admitted)"
            - "PermitApplication.${pm1_id}.status == \"SUBMITTED\" and submitted_at_utc == \"2026-08-01T00:00:00Z\""
            - "PermitApplication.${pm1_id}.revision_round == 0"
            - "Second trigger: HTTP 409 with data.error_id == \"ERR_PERMIT_LEAD_TIME_NOT_MET\""
            - "PermitApplication.${pm2_id}.status == \"DRAFT\" and submitted_at_utc is null"

      - name: malformed_timestamp_outranks_unknown_path_id_and_returns_400
        claim_type: priority_ordering
        grounds:
          - validations.priority_3_ERR_VALIDATION
          - validations.priority_4_ERR_WORK_ORDER_NOT_FOUND
          - errors.ERR_VALIDATION
          - errors.ERR_WORK_ORDER_NOT_FOUND
        distinguishing_aspect: |
          Both a shape violation and an unresolvable path id are present in the
          same request, and priority 3 wins: dispatching an unknown work-order id
          with scheduled_start_utc "2026-08-03 08:00" returns 400 ERR_VALIDATION,
          while the identical call with a well-formed instant returns
          404 ERR_WORK_ORDER_NOT_FOUND from priority 4.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One crew CRW-A exists so the body's crew_id resolves; no work order with the probed id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/crews"
              payload: { crew_code: "CRW-A", depot_code: "DEP-1", daily_capacity_hours: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /fence-rentals/work-orders/00000000-0000-4000-8000-000000000999/dispatch"
              payload: { crew_id: "${c1_id}", scheduled_start_utc: "2026-08-03 08:00" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/work-orders/00000000-0000-4000-8000-000000000999/dispatch"
              payload: { crew_id: "${c1_id}", scheduled_start_utc: "2026-08-03T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
          assert:
            - "First trigger: HTTP 400 with data.error_id == \"ERR_VALIDATION\" (not 404, even though the path id resolves to nothing)"
            - "Second trigger: HTTP 404 with data.error_id == \"ERR_WORK_ORDER_NOT_FOUND\""
            - "Both responses carry response_type == \"error\" and a non-empty data.message"
            - "Crew.${c1_id} is unchanged: no interval was committed by either call"

