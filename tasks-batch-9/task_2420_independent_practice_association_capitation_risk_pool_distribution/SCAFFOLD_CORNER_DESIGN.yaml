              as: IpaAdmin
              captures: { agr_v10: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_v10}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_v10}/physicians"
              payload: { npi: "5200000001", full_name: "Dr Suspended Gate", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_v10: "$.data.id" }
            - call: "POST /ipa/physicians/${p_v10}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_v10}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_v10}/enrollees"
              payload: { external_member_id: "V10-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_v10: "$.data.id", e_v10_v: "$.data.version" }
            - call: "POST /ipa/delegation-agreements/${agr_v10}/state"
              payload: { to_state: "SUSPENDED" }
              as: IpaAdmin
              captures: { agr_v10_status: "$.data.status" }
          trigger:
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_v10}", physician_id: "${p_v10}", effective_date: "2026-08-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_v10_v}" }
              as: NetworkManager
              captures: { suspended_error: "$.data.error_id" }
            - call: "POST /ipa/delegation-agreements/${agr_v10}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_v10}", physician_id: "${p_v10}", effective_date: "2026-08-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_v10_v}" }
              as: NetworkManager
              captures: { panel_error: "$.data.error_id" }
            - call: "GET /ipa/physicians/${p_v10}"
              as: NetworkManager
              captures: { p_v10_panel: "$.data.panel_status" }
          assert:
            - "${agr_v10_status} == \"SUSPENDED\" and PhysicianMember.${p_v10}.panel_status == \"CLOSED_TO_NEW\" — suspension closed the OPEN panel"
            - "call 1 returns HTTP 409 with ${suspended_error} == \"ERR_AGREEMENT_NOT_ACTIVE\" — priority 8 outranks the priority 10 panel check that is also violated"
            - "call 3 returns HTTP 409 with ${panel_error} == \"ERR_PANEL_CLOSED_TO_NEW\" — reinstatement does not reopen the panel, so the masked error surfaces"
            - "${p_v10_panel} == \"CLOSED_TO_NEW\" and DelegationAgreement.${agr_v10}.total_assigned_members == 0"

      - name: claim_allowed_above_billed_and_service_date_outside_pool_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_28_ERR_ALLOWED_EXCEEDS_BILLED
          - validations.priority_16_ERR_NO_POOL_FOR_SERVICE_DATE
          - state_machines.DownstreamClaim.RECEIVED_to_ADJUDICATED_APPROVED
        distinguishing_aspect: |
          Two fiscal guards on the claim path, each with an adjacent legal case.
          A service_date of 2027-01-01T00:00:00Z falls one day outside the CLOSED
          [2026-01-01, 2026-12-31T23:59:59] pool interval and must be rejected
          with ERR_NO_POOL_FOR_SERVICE_DATE, while 2026-12-31T23:59:59Z — the
          closing endpoint itself — must be accepted. allowed_cents of 10001
          against billed 10000 must be rejected with ERR_ALLOWED_EXCEEDS_BILLED,
          while exactly 10000 must be accepted.
        test_recipe:
          setup:
            - "Agreement AGR_V11 ACTIVE with a PROFESSIONAL 2026 pool, one ACTIVE physician and one assigned enrollee."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Claim Guards Health", payer_tax_id: "94-3000069", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_v11: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_v11}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_v11}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_v11: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_v11}/physicians"
              payload: { npi: "5300000001", full_name: "Dr Claim Guards", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_v11: "$.data.id" }
            - call: "POST /ipa/physicians/${p_v11}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_v11}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_v11}/enrollees"
              payload: { external_member_id: "V11-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_v11: "$.data.id", e_v11_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_v11}", physician_id: "${p_v11}", effective_date: "2026-08-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_v11_v}" }
              as: NetworkManager
          trigger:
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_v11}", enrollee_id: "${e_v11}", attributed_physician_id: "${p_v11}", pool_type: "PROFESSIONAL", downstream_provider_name: "Out Of Period Imaging LLC", billed_cents: 10000, service_date: "2027-01-01T00:00:00Z" }
              as: ClaimsExaminer
              captures: { no_pool_error: "$.data.error_id" }
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_v11}", enrollee_id: "${e_v11}", attributed_physician_id: "${p_v11}", pool_type: "PROFESSIONAL", downstream_provider_name: "Endpoint Imaging LLC", billed_cents: 10000, service_date: "2026-12-31T23:59:59Z" }
              as: ClaimsExaminer
              captures: { clm_v11: "$.data.id", clm_v11_pool: "$.data.pool_id" }
            - call: "POST /ipa/downstream-claims/${clm_v11}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 10001 }
