            - { call: "POST /depot/rmas/${rma2}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "00000000-0000-0000-0000-000000000000", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { e4: $.data.error_id } }
          assert:
