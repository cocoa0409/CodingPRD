              as_user_id: "u-controller-1"
            - call: "POST /incentives/payment-batches/${batch_id}/disburse"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dis_resp_status: $.data.status, dis_resp_at: $.data.disbursed_at, dis_resp_total: $.data.total_cents }
            - call: "GET /incentives/payment-batches/${batch_id}"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dis_read_status: $.data.status, dis_read_at: $.data.disbursed_at, dis_read_total: $.data.total_cents }
            - call: "GET /incentives/claims/${claim_id}"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dis_claim_pay: $.data.payment_status, dis_claim_paid_at: $.data.paid_at }
            - call: "GET /incentives/dealers/${dealer_id}"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_paid: $.data.paid_cents, dealer_open_cb: $.data.open_chargeback_cents }
          assert:
            - "${approve_resp_status} == ${approve_read_status} == ACTIVE and ${approve_resp_version} == ${approve_read_version} — the action response is already the post-transition state"
            - "${val_resp_status} == ${val_read_status} == VALIDATED, ${val_resp_by} == ${val_read_by} == u-auditor-1 and ${val_resp_version} == ${val_read_version}"
            - "${adj_resp_amount} == ${adj_read_amount} == 45000, ${adj_resp_val} == ${adj_read_val} == VALIDATED, ${adj_resp_basis} == ${adj_read_basis} == AS_SOLD_SNAPSHOT and ${adj_resp_version} == ${adj_read_version} — every computed field is present in the write response, not filled in later"
            - "${sum_committed} == 45000, ${sum_units} == 1 and ${sum_spend} == 45000 on the FIRST read of the projection after the adjudication — a cross-aggregate derived value with no lag and no recompute call"
            - "${sch_resp_count} == ${sch_read_count} == 1, ${sch_resp_total} == ${sch_read_total} == 45000 and ${sch_resp_version} == ${sch_read_version}"
            - "${sch_claim_pay} == SCHEDULED and ${sch_claim_batch} == ${batch_id} — the CHILD row already reflects a write addressed to the parent batch"
            - "${lock_resp_status} == LOCKED and ${dis_resp_status} == ${dis_read_status} == DISBURSED with ${dis_resp_at} == ${dis_read_at} == 2026-08-31T00:00:00.000Z and ${dis_resp_total} == ${dis_read_total} == 45000"
            - "${dis_claim_pay} == PAID with ${dis_claim_paid_at} == 2026-08-31T00:00:00.000Z, and ${dealer_paid} == 45000 with ${dealer_open_cb} == 0 — a third aggregate (the Dealer) is current on its first read too"
            - "no assertion in this instance needed a retry, a sleep, or a second read to become true: the consistency model is immediate everywhere, including across aggregates"

      - name: a_new_objective_is_born_already_reconciled_with_deliveries_that_predate_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.objective_achieved_units
          - state_machines.RetailDelivery.transitions.REPORTED_to_VALIDATED
        distinguishing_aspect: "The objective is created AFTER two deliveries have already been validated, and its creation response already carries achieved_units 2 with the matching attainment — the derived fields are computed from existing state, not accumulated forward from the moment of creation. Each later validation then updates the objective in the same request, even though the response body of that request is a RetailDelivery and never mentions the objective."
        test_recipe:
          setup:
            - "One ACTIVE DEALER_STAIR_STEP program (single tier at 8000 bps paying 20000 per unit, MARGINAL), one dealer with historical_volume_units 4, and four reported deliveries of which the first two are already VALIDATED. No objective exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-BRN", name: "Born Reconciled Motors", region_code: "ZZBRN", historical_volume_units: 4, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-X-BRN", name: "Born Reconciled Stair", incentive_type: "DEALER_STAIR_STEP", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 0, budget_cents: 600000, stack_group: "CRNBRN", priority_rank: 453, tier_schedule: [{ tier_index: 1, threshold_bps: 8000, per_unit_bonus_cents: 20000 }], tier_bonus_mode: "MARGINAL", accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "ZZBRN", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842BRN000001", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 2400000, sale_date: "2026-08-03T00:00:00.000Z", customer_region_code: "ZZBRN", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { b1: $.data.id }
            - call: "POST /incentives/deliveries/${b1}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842BRN000002", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-02T00:00:00.000Z", msrp_cents: 2400000, sale_date: "2026-08-04T00:00:00.000Z", customer_region_code: "ZZBRN", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { b2: $.data.id }
            - call: "POST /incentives/deliveries/${b2}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842BRN000003", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-03T00:00:00.000Z", msrp_cents: 2400000, sale_date: "2026-08-05T00:00:00.000Z", customer_region_code: "ZZBRN", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { b3: $.data.id }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842BRN000004", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-04T00:00:00.000Z", msrp_cents: 2400000, sale_date: "2026-08-06T00:00:00.000Z", customer_region_code: "ZZBRN", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { b4: $.data.id }
          trigger:
            - call: "POST /incentives/programs/${prog_id}/objectives"
              payload: { dealer_id: "${dealer_id}", stretch_bps: 0 }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { obj_id: $.data.id, c_basis: $.data.basis_units, c_units: $.data.objective_units, c_ach: $.data.achieved_units, c_att: $.data.attainment_bps, c_tier: $.data.tier_attained, c_pay: $.data.payout_cents, c_ver: $.data.version }
            - call: "GET /incentives/objectives/${obj_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { r_ach: $.data.achieved_units, r_att: $.data.attainment_bps, r_tier: $.data.tier_attained, r_pay: $.data.payout_cents, r_ver: $.data.version }
            - call: "POST /incentives/deliveries/${b3}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { b3_status: $.data.status }
            - call: "GET /incentives/objectives/${obj_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { m_ach: $.data.achieved_units, m_att: $.data.attainment_bps, m_tier: $.data.tier_attained, m_pay: $.data.payout_cents, m_ver: $.data.version }
            - call: "POST /incentives/deliveries/${b4}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { b4_status: $.data.status }
            - call: "GET /incentives/objectives/${obj_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { f_ach: $.data.achieved_units, f_att: $.data.attainment_bps, f_tier: $.data.tier_attained, f_pay: $.data.payout_cents, f_ver: $.data.version }
            - call: "GET /incentives/objectives"
              payload: { program_id: "${prog_id}", status: "PROPOSED", limit: 10 }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { list_total: $.pagination.total_count, list_first_pay: "$.data[0].payout_cents" }
          assert:
            - "${c_basis} == 4 and ${c_units} == 4 (historical volume, no uplift)"
            - "${c_ach} == 2 and ${c_att} == 5000 IN THE CREATION RESPONSE — the objective is born reconciled with the two deliveries that were validated before it existed, so achieved_units is a query over existing rows and not a counter that starts at zero"
            - "${c_tier} == 0 and ${c_pay} == 0 — 5000 bps is short of the 8000 bps tier"
            - "${r_ach} == ${c_ach}, ${r_att} == ${c_att}, ${r_tier} == ${c_tier}, ${r_pay} == ${c_pay} and ${r_ver} == ${c_ver} — the follow-up read adds nothing"
            - "${b3_status} == VALIDATED, then ${m_ach} == 3, ${m_att} == 7500, ${m_tier} == 0, ${m_pay} == 0 and ${m_ver} == ${c_ver} + 1 — the objective moved inside the validate request even though that request returned a RetailDelivery body"
            - "${b4_status} == VALIDATED, then ${f_ach} == 4, ${f_att} == 10000, ${f_tier} == 1 and ${f_pay} == 20000, because threshold_units == ceil(4 * 8000 / 10000) == 4 and MARGINAL pays (4 - 4 + 1) * 20000"
            - "${f_ver} == ${c_ver} + 2 — exactly one objective version increment per validation, which is what makes concurrency_rules.protest-resolve-stale-objective able to detect this movement"
            - "${list_total} == 1 and ${list_first_pay} == 20000 — the list projection is as current as the item read; there is no denormalised copy lagging behind"
