          trigger:
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-S" }
              as: BrandChannelManager
              captures: { pol: $.data.id, cre: $.data.created_at, upd: $.data.updated_at, ver: $.data.version }
          assert:
            - "${pol} matches ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ with no type prefix"
            - "${cre} == '2026-08-01T00:00:00.000Z'"
            - "${upd} == '2026-08-01T00:00:00.000Z'"
            - "${ver} == 1"
            - "PricingPolicy.${pol}.status == DRAFT"
            - "PricingPolicy.${pol}.reviewed_by_user_id == null"
            - "PricingPolicy.${pol}.published_by_user_id == null"
            - "PricingPolicy.${pol}.superseded_by_policy_id == null"

