scenario: 'Creative Subscription Seat Management & Entitlement Transfer (Adobe): subscription plans across individual, team and enterprise with different administration and deployment capabilities, seat
  assignment, reclamation and transfer between employees with entitlement propagation to devices, annual commitment plans billed monthly with early termination fees and cancellation windows, enterprise
  licensing with named user deployment, package creation and offline activation exceptions, storage entitlements, asset ownership and transfer when a user leaves an organization, add-on services including
  stock credits, fonts and cloud services with separate metering, version availability and forced upgrade timing for cloud applications, license compliance auditing and reseller order routing'
domain_name: creative-subscription-seat-management
api_prefix: /licensing
complexity_profile:
  primary_archetype: Quota / allocation
  secondary_archetype: Access control matrix
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - derived_field_reconciliation
  - scheduled_actions
  - dual_variant_calculation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - many_to_many
  - cross_aggregate
  - polymorphic
  role_model: hierarchical_override
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Organization
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Organization display name
  - name: org_type
    type: enum
    source: input
    description: Tier of organization
    constraints: one of {INDIVIDUAL, TEAM, ENTERPRISE}
  - name: status
    type: enum
    source: system
    description: Lifecycle state
    default: ACTIVE
    constraints: one of {ACTIVE, SUSPENDED, TERMINATED}
  - name: primary_admin_id
    type: string
    source: input
    description: FK -> Admin.id; owning admin
  - name: storage_pool_gb
    type: number
    source: computed
    description: Aggregate storage entitlement in GB derived from active subscriptions and add-ons
  - name: compliance_posture
    type: enum
    source: computed
    description: Aggregate compliance posture over seats and assignments
    default: COMPLIANT
    constraints: one of {COMPLIANT, OVER_ALLOCATED, UNDER_AUDIT, FROZEN}
- name: Admin
  parent: null
  common_fields: true
  fields:
  - name: email
    type: string
    source: input
    description: Admin login email; unique across orgs
  - name: full_name
    type: string
    source: input
    description: Display name
  - name: admin_kind
    type: enum
    source: input
    description: Administration capability level
    constraints: one of {SYSTEM_ADMIN, PRODUCT_ADMIN, DEPLOYMENT_ADMIN}
  - name: org_id
    type: string
    source: input
    description: FK -> Organization.id; org this admin belongs to
- name: EndUser
  parent: null
  common_fields: true
  fields:
  - name: email
    type: string
    source: input
    description: End user email; unique per org
  - name: full_name
    type: string
    source: input
    description: Display name
  - name: org_id
    type: string
    source: input
    description: FK -> Organization.id; owning org
  - name: status
    type: enum
    source: system
    description: Employment/membership status
    default: ACTIVE
    constraints: one of {ACTIVE, DEACTIVATED, DEPARTED}
  - name: storage_used_gb
    type: number
    source: system
    description: Storage currently consumed by this user's assets
    default: 0
- name: Reseller
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Reseller company name
  - name: region
    type: enum
    source: input
    description: Sales region
    constraints: one of {NA, EMEA, APAC, LATAM}
  - name: tier
    type: enum
    source: input
    description: Reseller tier affecting discount
    constraints: one of {CERTIFIED, GOLD, PLATINUM}
  - name: status
    type: enum
    source: system
    description: Reseller account state
    default: ACTIVE
    constraints: one of {ACTIVE, SUSPENDED}
- name: Plan
  parent: null
  common_fields: true
  fields:
  - name: code
    type: string
    source: input
    description: Unique plan code e.g. CC_ALL_APPS
  - name: segment
    type: enum
    source: input
    description: Plan segment
    constraints: one of {INDIVIDUAL, TEAM, ENTERPRISE}
  - name: billing_model
    type: enum
    source: input
    description: Billing structure
    constraints: one of {MONTHLY, ANNUAL_MONTHLY_BILLED, ANNUAL_PREPAID}
  - name: monthly_price_cents
    type: integer
    source: input
    description: Base monthly list price in cents
  - name: annual_monthly_price_cents
    type: integer
    source: input
    description: Monthly-equivalent price under annual commitment, cents
  - name: storage_gb_per_seat
    type: integer
    source: input
    description: Storage entitlement granted per provisioned seat
  - name: seat_limit
    type: integer
    source: input
    description: Max provisionable seats; -1 means unlimited
    constraints: '>= -1'
  - name: deployment_modes
    type: array
    source: input
    description: Permitted deployment modes
    constraints: subset of {NAMED_USER, SERIALIZED, SHARED_DEVICE}
  - name: allows_offline_activation
    type: boolean
    source: input
    description: Whether offline activation packages are permitted
  - name: max_devices_per_seat
    type: integer
    source: input
    description: Device activation cap per seat
    default: 2
  - name: cancellation_window_days
    type: integer
    source: input
    description: Full-refund cancellation window in days from commitment start
  - name: etf_rate_pct
    type: integer
    source: input
    description: Early termination fee as percent of remaining commitment value
    constraints: 0..100
- name: Subscription
  parent: Organization
  common_fields: true
  fields:
  - name: org_id
    type: string
    source: input
    description: FK -> Organization.id; owning organization
  - name: plan_id
    type: string
    source: input
    description: FK -> Plan.id; subscribed plan
  - name: reseller_id
    type: string
    source: input
    description: FK -> Reseller.id; routing reseller (nullable for direct)
    constraints: nullable
  - name: status
    type: enum
    source: system
    description: Subscription lifecycle
    default: PENDING_PAYMENT
    constraints: one of {PENDING_PAYMENT, ACTIVE, PAST_DUE, CANCELLED_IN_WINDOW, CANCELLED_ETF, EXPIRED}
  - name: seats_purchased
    type: integer
    source: input
    description: Number of seats bought
    constraints: '>= 1'
  - name: seats_assigned
    type: integer
    source: computed
    description: Seats currently assigned to end users
    default: 0
  - name: commitment_start
    type: datetime
    source: system
    description: Commitment period start (activation time)
  - name: commitment_months
    type: integer
    source: system
    description: Commitment length in months; 1 for MONTHLY, 12 for annual
  - name: months_elapsed
    type: integer
    source: computed
    description: Full billing months elapsed since commitment_start
    default: 0
  - name: monthly_charge_cents
    type: integer
    source: computed
    description: Per-month billed amount incl. reseller discount
    default: 0
- name: Seat
  parent: Subscription
  common_fields: true
  fields:
  - name: subscription_id
    type: string
    source: input
    description: FK -> Subscription.id; parent subscription
  - name: end_user_id
    type: string
    source: system
    description: FK -> EndUser.id; current assignee; null when unassigned
    constraints: nullable
  - name: status
    type: enum
    source: system
    description: Seat lifecycle
    default: UNASSIGNED
    constraints: one of {UNASSIGNED, ASSIGNED, PENDING_RECLAIM, RECLAIMED, TRANSFERRING}
  - name: assigned_at
    type: datetime
    source: system
    description: Last assignment timestamp; null when unassigned
    constraints: nullable
  - name: pending_reclaim_not_before
    type: datetime
    source: system
    description: Earliest reclaim finalization instant (grace period end); null otherwise
    constraints: nullable
- name: Device
  parent: null
  common_fields: true
  fields:
  - name: end_user_id
    type: string
    source: input
    description: FK -> EndUser.id; owning user
  - name: device_fingerprint
    type: string
    source: input
    description: Stable device fingerprint; unique per end user
  - name: label
    type: string
    source: input
    description: Human label e.g. 'MacBook Pro'
  - name: status
    type: enum
    source: system
    description: Device status
    default: ACTIVE
    constraints: one of {ACTIVE, DEACTIVATED}
- name: Entitlement
  parent: Seat
  common_fields: true
  fields:
  - name: seat_id
    type: string
    source: input
    description: FK -> Seat.id; backing seat
  - name: device_id
    type: string
    source: system
    description: FK -> Device.id; propagated device; null until activated
    constraints: nullable
  - name: status
    type: enum
    source: system
    description: Entitlement lifecycle
    default: PENDING_ACTIVATION
    constraints: one of {PENDING_ACTIVATION, ACTIVE, SUSPENDED, REVOKED}
  - name: product_version_id
    type: string
    source: system
    description: FK -> ProductVersion.id; version the entitlement currently grants
  - name: storage_granted_gb
    type: integer
    source: system
    description: Storage grant attached to this entitlement
- name: DeploymentPackage
  parent: Organization
  common_fields: true
  fields:
  - name: org_id
    type: string
    source: input
    description: FK -> Organization.id; owning org
  - name: created_by_admin_id
    type: string
    source: input
    description: FK -> Admin.id; packaging admin
  - name: name
    type: string
    source: input
    description: Package display name
  - name: plan_id
    type: string
    source: input
    description: FK -> Plan.id; plan being packaged
  - name: deployment_mode
    type: enum
    source: input
    description: Packaging mode
    constraints: one of {NAMED_USER, SERIALIZED, SHARED_DEVICE}
  - name: offline_activation
    type: boolean
    source: input
    description: Request offline activation exception
    default: false
  - name: status
    type: enum
    source: system
    description: Package review lifecycle
    default: DRAFT
    constraints: one of {DRAFT, PENDING_APPROVAL, APPROVED, PUBLISHED, RETIRED, REJECTED}
- name: ProductVersion
  parent: Plan
  common_fields: true
  fields:
  - name: plan_id
    type: string
    source: input
    description: FK -> Plan.id; plan this version belongs to
  - name: version_label
    type: string
    source: input
    description: Version label e.g. 2025.1
  - name: release_date
    type: datetime
    source: input
    description: Release timestamp
  - name: availability
    type: enum
    source: system
    description: Availability state
    default: AVAILABLE
    constraints: one of {AVAILABLE, DEPRECATED, FORCED_UPGRADE}
  - name: forced_upgrade_deadline
    type: datetime
    source: input
    description: Deadline after which entitlements auto-upgrade; null unless FORCED_UPGRADE
    constraints: nullable
- name: AddOnService
  parent: Subscription
  common_fields: true
  fields:
  - name: subscription_id
    type: string
    source: input
    description: FK -> Subscription.id; attached subscription
  - name: kind
    type: enum
    source: input
    description: Add-on category
    constraints: one of {STOCK_CREDITS, FONTS, CLOUD_SERVICES}
  - name: quota_total
    type: integer
    source: input
    description: Purchased quota units (credits, font seats, or service units)
    constraints: '>= 1'
  - name: quota_used
    type: integer
    source: computed
    description: Units consumed this metering period
    default: 0
  - name: status
    type: enum
    source: system
    description: Add-on lifecycle
    default: ACTIVE
    constraints: one of {ACTIVE, EXHAUSTED, CANCELLED}
  - name: overage_unit_price_cents
    type: integer
    source: input
    description: Price per unit beyond quota
    default: 0
- name: Asset
  parent: EndUser
  common_fields: true
  fields:
  - name: owner_user_id
    type: string
    source: system
    description: FK -> EndUser.id; current asset owner
  - name: org_id
    type: string
    source: system
    description: FK -> Organization.id; org scope (inherited from owner)
  - name: title
    type: string
    source: input
    description: Asset title
  - name: size_mb
    type: integer
    source: input
    description: Asset size in MB
    constraints: '>= 0'
  - name: status
    type: enum
    source: system
    description: Asset lifecycle
    default: ACTIVE
    constraints: one of {ACTIVE, IN_TRANSFER, TRANSFERRED, ORPHANED, PURGED}
- name: TransferRequest
  parent: Organization
  common_fields: true
  fields:
  - name: org_id
    type: string
    source: input
    description: FK -> Organization.id; org scope
  - name: seat_id
    type: string
    source: input
    description: FK -> Seat.id; seat being transferred
  - name: from_user_id
    type: string
    source: system
    description: FK -> EndUser.id; current assignee
  - name: to_user_id
    type: string
    source: input
    description: FK -> EndUser.id; proposed recipient
  - name: requested_by_admin_id
    type: string
    source: input
    description: FK -> Admin.id; initiating admin
  - name: approver_admin_id
    type: string
    source: system
    description: FK -> Admin.id; approving admin (segregated from requester); null until decided
    constraints: nullable
  - name: status
    type: enum
    source: system
    description: Transfer lifecycle
    default: PENDING_APPROVAL
    constraints: one of {PENDING_APPROVAL, APPROVED, REJECTED, EXECUTED, EXPIRED}
  - name: expires_at
    type: datetime
    source: system
    description: Approval expiry timestamp; auto-EXPIRED after this instant
- name: ResellerOrder
  parent: Reseller
  common_fields: true
  fields:
  - name: reseller_id
    type: string
    source: system
    description: FK -> Reseller.id; fulfilling reseller
  - name: org_id
    type: string
    source: input
    description: FK -> Organization.id; purchasing org
  - name: plan_id
    type: string
    source: input
    description: FK -> Plan.id; plan ordered
  - name: seats
    type: integer
    source: input
    description: Seats ordered
    constraints: '>= 1'
  - name: region
    type: enum
    source: input
    description: Purchase region used for reseller routing
    constraints: one of {NA, EMEA, APAC, LATAM}
  - name: status
    type: enum
    source: system
    description: Order routing lifecycle
    default: ROUTED
    constraints: one of {ROUTED, FULFILLED, CANCELLED, REJECTED}
  - name: discount_pct
    type: integer
    source: computed
    description: Applied reseller discount percent based on tier
- name: ComplianceAudit
  parent: Organization
  common_fields: true
  fields:
  - name: org_id
    type: string
    source: input
    description: FK -> Organization.id; audited org
  - name: opened_by_admin_id
    type: string
    source: input
    description: FK -> Admin.id; auditor
  - name: status
    type: enum
    source: system
    description: Audit lifecycle
    default: OPEN
    constraints: one of {OPEN, FINDINGS_RAISED, REMEDIATED, CLOSED}
  - name: over_allocated_seats
    type: integer
    source: computed
    description: Seats assigned beyond purchased across org subscriptions
    default: 0
  - name: findings_count
    type: integer
    source: computed
    description: Number of compliance findings
    default: 0
- name: CancellationRequest
  parent: Subscription
  common_fields: true
  fields:
  - name: subscription_id
    type: string
    source: input
    description: FK -> Subscription.id; subscription being cancelled
  - name: requested_by_admin_id
    type: string
    source: input
    description: FK -> Admin.id; requesting admin
  - name: requested_at
    type: datetime
    source: system
    description: Request timestamp (logical clock)
  - name: status
    type: enum
    source: system
    description: Cancellation lifecycle
    default: PENDING
    constraints: one of {PENDING, REFUNDED, ETF_CHARGED, DENIED}
  - name: etf_amount_cents
    type: integer
    source: computed
    description: Early termination fee charged; 0 when inside window
    default: 0
state_machines:
- entity: Subscription
  initial_state: PENDING_PAYMENT
  terminal_states:
  - CANCELLED_IN_WINDOW
  - CANCELLED_ETF
  - EXPIRED
  transitions:
  - from: PENDING_PAYMENT
    to: ACTIVE
    trigger: POST /licensing/subscriptions/{id}/activate
    actor: SystemAdmin
    preconditions:
    - org.status == ACTIVE
    - org.compliance_posture != FROZEN
    - seats_purchased >= 1
    - plan.seat_limit == -1 OR seats_purchased <= plan.seat_limit
    - 'if reseller_id present: reseller.status == ACTIVE'
    side_effects:
    - commitment_start := logical clock now
    - commitment_months := 1 when plan.billing_model == MONTHLY else 12
    - monthly_charge_cents := per monthly_charge calculation (calc monthly_billed_charge)
    - recompute org.storage_pool_gb via calc org_storage_pool
    - increments Subscription.version by 1
  - from: ACTIVE
    to: PAST_DUE
    trigger: system billing job when a monthly invoice is unpaid at logical-clock sweep
    actor: system
    preconditions:
    - logical clock advanced past invoice due date
    side_effects:
    - all non-terminal Entitlements of seats under this subscription transition ACTIVE -> SUSPENDED (devices keep local grace)
    - recompute org.compliance_posture
    - increments Subscription.version by 1
  - from: PAST_DUE
    to: ACTIVE
    trigger: POST /licensing/subscriptions/{id}/settle
    actor: SystemAdmin
    preconditions:
    - org.status == ACTIVE
    side_effects:
    - all SUSPENDED Entitlements of seats under this subscription transition SUSPENDED -> ACTIVE
    - recompute org.compliance_posture
    - increments Subscription.version by 1
  - from: ACTIVE
    to: CANCELLED_IN_WINDOW
    trigger: POST /licensing/cancellation-requests followed by POST /licensing/cancellation-requests/{id}/finalize while within plan.cancellation_window_days of commitment_start
    actor: SystemAdmin
    preconditions:
    - cancellation request exists in PENDING
    - logical clock now <= commitment_start + plan.cancellation_window_days days
    - no Seat under this subscription in {PENDING_RECLAIM, TRANSFERRING}
    side_effects:
    - 'cascade: every Seat ASSIGNED -> RECLAIMED; every Seat UNASSIGNED stays; seats_assigned := 0'
    - every non-terminal Entitlement of those seats -> REVOKED
    - org.storage_pool_gb recomputed (subscription contributes 0 after cancellation)
    - cancellation_request.status := REFUNDED; etf_amount_cents := 0
    - increments Subscription.version by 1
  - from: ACTIVE
    to: CANCELLED_ETF
    trigger: POST /licensing/cancellation-requests/{id}/finalize after the cancellation window has closed
    actor: SystemAdmin
    preconditions:
    - cancellation request exists in PENDING
    - logical clock now > commitment_start + plan.cancellation_window_days days
    - plan.billing_model != MONTHLY
    - no Seat under this subscription in {PENDING_RECLAIM, TRANSFERRING}
    side_effects:
    - etf computed via calc early_termination_fee; cancellation_request.etf_amount_cents := computed fee; status := ETF_CHARGED
    - 'cascade: every Seat ASSIGNED -> RECLAIMED; seats_assigned := 0'
    - every non-terminal Entitlement -> REVOKED
    - org.storage_pool_gb recomputed
    - increments Subscription.version by 1
  - from: ACTIVE
    to: EXPIRED
    trigger: system sweep when logical clock reaches commitment_start + commitment_months months (applies to ANNUAL_PREPAID; ANNUAL_MONTHLY_BILLED renews implicitly until cancelled)
    actor: system
    preconditions:
    - plan.billing_model == ANNUAL_PREPAID
    - logical clock now >= commitment_start + commitment_months months
    side_effects:
    - 'cascade: every Seat ASSIGNED -> RECLAIMED; seats_assigned := 0'
    - every non-terminal Entitlement -> REVOKED
    - org.storage_pool_gb recomputed
    - increments Subscription.version by 1
  note: PENDING_PAYMENT->ACTIVE is the only forward entry; MONTHLY subscriptions never EXPIRE and can only be cancelled inside the window (MONTHLY plans have no ETF path).
- entity: Seat
  initial_state: UNASSIGNED
  terminal_states: []
  transitions:
  - from: UNASSIGNED
    to: ASSIGNED
    trigger: POST /licensing/seats/{id}/assign
    actor: OrgAdmin
    preconditions:
    - subscription.status == ACTIVE
    - org.compliance_posture != FROZEN
    - end_user.org_id == subscription.org_id
    - end_user.status == ACTIVE
    - subscription.seats_assigned < subscription.seats_purchased
    - no other Seat under the same plan in this org is ASSIGNED to the same end_user (one seat per user per plan per org)
    side_effects:
    - end_user_id := target user; assigned_at := logical clock now
    - subscription.seats_assigned += 1
    - create Entitlement (status PENDING_ACTIVATION, product_version_id := current default AVAILABLE ProductVersion for the plan, storage_granted_gb := plan.storage_gb_per_seat)
    - recompute org.storage_pool_gb
    - increments Seat.version by 1
  - from: ASSIGNED
    to: PENDING_RECLAIM
    trigger: POST /licensing/seats/{id}/reclaim
    actor: OrgAdmin
    preconditions:
    - subscription.status in {ACTIVE, PAST_DUE}
    side_effects:
    - pending_reclaim_not_before := logical clock now + 24h grace
    - entitlement ACTIVE -> SUSPENDED
    - increments Seat.version by 1
  - from: PENDING_RECLAIM
    to: ASSIGNED
    trigger: POST /licensing/seats/{id}/reclaim/cancel
    actor: OrgAdmin
    preconditions:
    - logical clock now < pending_reclaim_not_before
    side_effects:
    - pending_reclaim_not_before := null
    - entitlement SUSPENDED -> ACTIVE
    - increments Seat.version by 1
  - from: PENDING_RECLAIM
    to: RECLAIMED
    trigger: POST /licensing/seats/{id}/reclaim/finalize
    actor: OrgAdmin
    preconditions:
    - logical clock now >= pending_reclaim_not_before
    side_effects:
    - end_user_id := null; assigned_at := null; pending_reclaim_not_before := null
    - subscription.seats_assigned -= 1
    - entitlement -> REVOKED; entitlement devices unaffected (Device rows remain, entitlement link severed)
    - recompute org.storage_pool_gb and org.compliance_posture
    - increments Seat.version by 1
    note: 'RECLAIMED is reusable: RECLAIMED -> ASSIGNED allowed (cyclic)'
  - from: RECLAIMED
    to: ASSIGNED
    trigger: POST /licensing/seats/{id}/assign
    actor: OrgAdmin
    preconditions:
    - same preconditions as UNASSIGNED -> ASSIGNED
    side_effects:
    - same side effects as UNASSIGNED -> ASSIGNED (a fresh Entitlement is created)
  - from: ASSIGNED
    to: TRANSFERRING
    trigger: POST /licensing/transfer-requests creation referencing this seat
    actor: OrgAdmin
    preconditions:
    - subscription.status == ACTIVE
    - no other TransferRequest in {PENDING_APPROVAL, APPROVED} for this seat
    side_effects:
    - increments Seat.version by 1
  - from: TRANSFERRING
    to: ASSIGNED
    trigger: TransferRequest reaches REJECTED or EXPIRED
    actor: system
    preconditions: []
    side_effects:
    - increments Seat.version by 1
    note: Seat remains ASSIGNED but end_user_id unchanged on failed transfer
  - from: TRANSFERRING
    to: ASSIGNED
    trigger: POST /licensing/transfer-requests/{id}/execute
    actor: SystemAdmin
    preconditions:
    - transfer_request.status == APPROVED
    - to_user.status == ACTIVE
    - to_user.org_id == org.id
    - no other Seat under the same plan in this org ASSIGNED to to_user
    side_effects:
    - end_user_id := to_user_id; assigned_at := logical clock now
    - 'entitlement: product grant re-pointed; entitlement stays ACTIVE but device links are severed (entitlement.device_id := null, status := PENDING_ACTIVATION) forcing re-activation by recipient'
    - transfer_request.status := EXECUTED
    - assets of from_user remain owned by from_user until a separate asset transfer
    - increments Seat.version by 1
- entity: Entitlement
  initial_state: PENDING_ACTIVATION
  terminal_states:
  - REVOKED
  transitions:
  - from: PENDING_ACTIVATION
    to: ACTIVE
    trigger: POST /licensing/entitlements/{id}/activate
    actor: EndUser
    preconditions:
    - seat.end_user_id == calling end user
    - seat.status == ASSIGNED
    - subscription.status == ACTIVE
    - device.end_user_id == calling end user and device.status == ACTIVE
    - 'count of ACTIVE entitlements of the calling user''s seats on device_id == request device < plan.max_devices_per_seat evaluated per seat: this seat must have fewer than plan.max_devices_per_seat ACTIVE
      device-entitlements'
    - entitlement.product_version.availability != FORCED_UPGRADE past deadline
    side_effects:
    - device_id := request device
    - 'if entitlement.product_version.availability == FORCED_UPGRADE and clock >= forced_upgrade_deadline: product_version_id := latest AVAILABLE ProductVersion for plan (tie-break: greatest release_date,
      then created_at ASC)'
    - increments Entitlement.version by 1
  - from: ACTIVE
    to: SUSPENDED
    trigger: cascade from subscription PAST_DUE or seat reclaim
    actor: system
    preconditions: []
    side_effects:
    - increments Entitlement.version by 1
  - from: SUSPENDED
    to: ACTIVE
    trigger: cascade from subscription settle or reclaim cancel
    actor: system
    preconditions: []
    side_effects:
    - increments Entitlement.version by 1
  - from: ACTIVE
    to: REVOKED
    trigger: cascade from seat reclaim finalize / subscription cancel / expiry
    actor: system
    preconditions: []
    side_effects:
    - device_id := null
    - increments Entitlement.version by 1
  - from: SUSPENDED
    to: REVOKED
    trigger: cascade from seat reclaim finalize / subscription cancel
    actor: system
    preconditions: []
    side_effects:
    - device_id := null
    - increments Entitlement.version by 1
- entity: DeploymentPackage
  initial_state: DRAFT
  terminal_states:
  - PUBLISHED
  - RETIRED
  - REJECTED
  transitions:
  - from: DRAFT
    to: PENDING_APPROVAL
    trigger: POST /licensing/deployment-packages/{id}/submit
    actor: DeploymentAdmin
    preconditions:
    - plan.deployment_modes contains package.deployment_mode
    - 'if offline_activation == true: plan.allows_offline_activation == true AND package.deployment_mode == SERIALIZED'
    - org.compliance_posture != FROZEN
    side_effects:
    - increments DeploymentPackage.version by 1
  - from: PENDING_APPROVAL
    to: APPROVED
    trigger: POST /licensing/deployment-packages/{id}/approve
    actor: OrgAdmin
    preconditions:
    - approver admin != created_by_admin_id (segregation of duties)
    side_effects:
    - increments DeploymentPackage.version by 1
  - from: PENDING_APPROVAL
    to: REJECTED
    trigger: POST /licensing/deployment-packages/{id}/reject
    actor: OrgAdmin
    preconditions:
    - approver admin != created_by_admin_id
    side_effects:
    - increments DeploymentPackage.version by 1
  - from: APPROVED
    to: PUBLISHED
    trigger: POST /licensing/deployment-packages/{id}/publish
    actor: DeploymentAdmin
    preconditions:
    - plan still permits package.deployment_mode
    side_effects:
    - increments DeploymentPackage.version by 1
  - from: PUBLISHED
    to: RETIRED
    trigger: POST /licensing/deployment-packages/{id}/retire
    actor: DeploymentAdmin
    preconditions: []
    side_effects:
    - increments DeploymentPackage.version by 1
- entity: TransferRequest
  initial_state: PENDING_APPROVAL
  terminal_states:
  - REJECTED
  - EXECUTED
  - EXPIRED
  transitions:
  - from: PENDING_APPROVAL
    to: APPROVED
    trigger: POST /licensing/transfer-requests/{id}/approve
    actor: OrgAdmin
    preconditions:
    - approver admin != requested_by_admin_id (segregation of duties)
    - logical clock now < expires_at
    side_effects:
    - approver_admin_id := calling admin
    - increments TransferRequest.version by 1
  - from: PENDING_APPROVAL
    to: REJECTED
    trigger: POST /licensing/transfer-requests/{id}/reject
    actor: OrgAdmin
    preconditions:
    - approver admin != requested_by_admin_id
    side_effects:
    - seat TRANSFERRING -> ASSIGNED (end_user unchanged)
    - increments TransferRequest.version by 1
  - from: PENDING_APPROVAL
    to: EXPIRED
    trigger: system sweep when logical clock >= expires_at
    actor: system
    preconditions: []
    side_effects:
    - seat TRANSFERRING -> ASSIGNED (end_user unchanged)
    - increments TransferRequest.version by 1
  - from: APPROVED
    to: EXECUTED
    trigger: POST /licensing/transfer-requests/{id}/execute
    actor: SystemAdmin
    preconditions:
    - seat transfer preconditions per Seat TRANSFERRING -> ASSIGNED
    side_effects:
    - seat reassignment side effects per Seat machine
    - increments TransferRequest.version by 1
- entity: ResellerOrder
  initial_state: ROUTED
  terminal_states:
  - FULFILLED
  - CANCELLED
  - REJECTED
  transitions:
  - from: ROUTED
    to: FULFILLED
    trigger: POST /licensing/reseller-orders/{id}/fulfill
    actor: ResellerAgent
    preconditions:
    - reseller.status == ACTIVE
    - calling reseller agent's reseller_id == order.reseller_id
    - org.status == ACTIVE
    side_effects:
    - create Subscription in PENDING_PAYMENT for org with reseller_id := order.reseller_id, seats_purchased := order.seats
    - increments ResellerOrder.version by 1
  - from: ROUTED
    to: REJECTED
    trigger: POST /licensing/reseller-orders/{id}/reject
    actor: ResellerAgent
    preconditions:
    - calling reseller agent's reseller_id == order.reseller_id
    side_effects:
    - increments ResellerOrder.version by 1
  - from: ROUTED
    to: CANCELLED
    trigger: POST /licensing/reseller-orders/{id}/cancel
    actor: SystemAdmin
    preconditions: []
    side_effects:
    - increments ResellerOrder.version by 1
- entity: ComplianceAudit
  initial_state: OPEN
  terminal_states:
  - CLOSED
  transitions:
  - from: OPEN
    to: FINDINGS_RAISED
    trigger: POST /licensing/compliance-audits/{id}/raise-findings
    actor: SystemAdmin
    preconditions:
    - computed over_allocated_seats > 0 OR findings_count > 0
    side_effects:
    - org.compliance_posture := UNDER_AUDIT (if over_allocated_seats > 0 also OVER_ALLOCATED takes precedence per calc org_compliance_posture)
    - increments ComplianceAudit.version by 1
  - from: FINDINGS_RAISED
    to: REMEDIATED
    trigger: POST /licensing/compliance-audits/{id}/remediate
    actor: SystemAdmin
    preconditions:
    - 'org over-allocation resolved: every subscription seats_assigned <= seats_purchased'
    side_effects:
    - org.compliance_posture recomputed
    - increments ComplianceAudit.version by 1
  - from: REMEDIATED
    to: CLOSED
    trigger: POST /licensing/compliance-audits/{id}/close
    actor: SystemAdmin
    preconditions: []
    side_effects:
    - org.compliance_posture recomputed
    - increments ComplianceAudit.version by 1
  - from: OPEN
    to: CLOSED
    trigger: POST /licensing/compliance-audits/{id}/close
    actor: SystemAdmin
    preconditions:
    - findings_count == 0
    side_effects:
    - org.compliance_posture recomputed
    - increments ComplianceAudit.version by 1
- entity: Asset
  initial_state: ACTIVE
  terminal_states:
  - PURGED
  transitions:
  - from: ACTIVE
    to: IN_TRANSFER
    trigger: POST /licensing/assets/{id}/transfer
    actor: OrgAdmin
    preconditions:
    - owner_user.status == DEPARTED OR admin initiates org-claim transfer while owner ACTIVE
    - target user's org == asset.org_id
    side_effects:
    - increments Asset.version by 1
  - from: IN_TRANSFER
    to: TRANSFERRED
    trigger: POST /licensing/assets/{id}/transfer/accept
    actor: EndUser
    preconditions:
    - calling end user == target user
    - target user status == ACTIVE
    side_effects:
    - owner_user_id := target user; then status auto-returns to ACTIVE under new owner (TRANSFERRED is momentary; record persists via updated_at)
    - source owner storage_used_gb -= size_gb; target owner storage_used_gb += size_gb (calc user_storage_used)
    - increments Asset.version by 1
    note: TRANSFERRED immediately settles to ACTIVE with new owner; TRANSFERRED retained in enum for audit filtering
  - from: IN_TRANSFER
    to: ACTIVE
    trigger: POST /licensing/assets/{id}/transfer/cancel
    actor: OrgAdmin
    preconditions: []
    side_effects:
    - owner unchanged
    - increments Asset.version by 1
  - from: ACTIVE
    to: ORPHANED
    trigger: cascade when owner EndUser transitions ACTIVE -> DEPARTED with no transfer initiated within deactivation flow
    actor: system
    preconditions: []
    side_effects:
    - asset excluded from org storage quota consumption until claimed
    - increments Asset.version by 1
  - from: ORPHANED
    to: ACTIVE
    trigger: POST /licensing/assets/{id}/claim
    actor: OrgAdmin
    preconditions:
    - target user ACTIVE in same org
    side_effects:
    - owner_user_id := claimant target; storage re-attributed via calc user_storage_used
    - increments Asset.version by 1
  - from: ORPHANED
    to: PURGED
    trigger: POST /licensing/assets/{id}/purge
    actor: OrgAdmin
    preconditions:
    - org.compliance_posture != UNDER_AUDIT (audit freeze protects evidence)
    side_effects:
    - 'storage freed: previous owner storage_used_gb unchanged (already excluded); asset unrecoverable'
    - increments Asset.version by 1
- entity: ProductVersion
  initial_state: AVAILABLE
  terminal_states: []
  transitions:
  - from: AVAILABLE
    to: DEPRECATED
    trigger: POST /licensing/product-versions/{id}/deprecate
    actor: SystemAdmin
    preconditions:
    - at least one other ProductVersion for the same plan remains AVAILABLE
    side_effects:
    - new seat assignments no longer select this version as default
    - increments ProductVersion.version by 1
  - from: DEPRECATED
    to: AVAILABLE
    trigger: POST /licensing/product-versions/{id}/restore
    actor: SystemAdmin
    preconditions: []
    side_effects:
    - increments ProductVersion.version by 1
  - from: DEPRECATED
    to: FORCED_UPGRADE
    trigger: POST /licensing/product-versions/{id}/force-upgrade
    actor: SystemAdmin
    preconditions:
    - forced_upgrade_deadline set in request and > logical clock now
    side_effects:
    - forced_upgrade_deadline := request value
    - existing ACTIVE entitlements on this version keep running until deadline; activation after deadline migrates to latest AVAILABLE (tie-break release_date DESC, created_at ASC)
    - increments ProductVersion.version by 1
  - from: FORCED_UPGRADE
    to: DEPRECATED
    trigger: system sweep once logical clock > forced_upgrade_deadline and no ACTIVE entitlements remain on this version
    actor: system
    preconditions: []
    side_effects:
    - increments ProductVersion.version by 1
- entity: EndUser
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: DEACTIVATED
    trigger: POST /licensing/end-users/{id}/deactivate
    actor: OrgAdmin
    preconditions:
    - org.status == ACTIVE
    side_effects:
    - 'all seats ASSIGNED to this user: Seat ASSIGNED -> PENDING_RECLAIM with pending_reclaim_not_before := now + 24h (grace); their ACTIVE entitlements -> SUSPENDED'
    - increments EndUser.version by 1
  - from: DEACTIVATED
    to: ACTIVE
    trigger: POST /licensing/end-users/{id}/reactivate
    actor: OrgAdmin
    preconditions:
    - org.status == ACTIVE
    side_effects:
    - 'seats in PENDING_RECLAIM initiated by the deactivation whose grace has not lapsed: PENDING_RECLAIM -> ASSIGNED; entitlements SUSPENDED -> ACTIVE'
    - increments EndUser.version by 1
  - from: DEACTIVATED
    to: DEPARTED
    trigger: POST /licensing/end-users/{id}/mark-departed
    actor: OrgAdmin
    preconditions: []
    side_effects:
    - 'remaining seats in PENDING_RECLAIM for this user are finalized immediately regardless of grace: -> RECLAIMED, entitlements REVOKED, subscription.seats_assigned decremented'
    - 'assets still owned: ACTIVE assets -> ORPHANED (org retains storage accounting exclusion)'
    - increments EndUser.version by 1
- entity: AddOnService
  initial_state: ACTIVE
  terminal_states:
  - CANCELLED
  transitions:
  - from: ACTIVE
    to: EXHAUSTED
    trigger: system metering when quota_used >= quota_total
    actor: system
    preconditions: []
    side_effects:
    - further consumption billed at overage_unit_price_cents while subscription ACTIVE
    - increments AddOnService.version by 1
  - from: EXHAUSTED
    to: ACTIVE
    trigger: POST /licensing/add-on-services/{id}/top-up
    actor: OrgAdmin
    preconditions:
    - subscription.status == ACTIVE
    side_effects:
    - quota_total += top_up units
    - increments AddOnService.version by 1
  - from: ACTIVE
    to: CANCELLED
    trigger: POST /licensing/add-on-services/{id}/cancel
    actor: OrgAdmin
    preconditions: []
    side_effects:
    - no refund; metering stops; quota_used frozen
    - increments AddOnService.version by 1
  - from: EXHAUSTED
    to: CANCELLED
    trigger: POST /licensing/add-on-services/{id}/cancel
    actor: OrgAdmin
    preconditions: []
    side_effects:
    - increments AddOnService.version by 1
- entity: CancellationRequest
  initial_state: PENDING
  terminal_states:
  - REFUNDED
  - ETF_CHARGED
  - DENIED
  transitions:
  - from: PENDING
    to: REFUNDED
    trigger: POST /licensing/cancellation-requests/{id}/finalize within cancellation window
    actor: SystemAdmin
    preconditions:
    - per Subscription ACTIVE -> CANCELLED_IN_WINDOW
    side_effects:
    - etf_amount_cents := 0
    - increments CancellationRequest.version by 1
  - from: PENDING
    to: ETF_CHARGED
    trigger: POST /licensing/cancellation-requests/{id}/finalize outside window on annual plan
    actor: SystemAdmin
    preconditions:
    - per Subscription ACTIVE -> CANCELLED_ETF
    side_effects:
    - etf_amount_cents := calc early_termination_fee
    - increments CancellationRequest.version by 1
  - from: PENDING
    to: DENIED
    trigger: POST /licensing/cancellation-requests/{id}/finalize when subscription not ACTIVE or seats mid-transfer
    actor: SystemAdmin
    preconditions:
    - subscription not cancellable
    side_effects:
    - subscription unchanged
    - increments CancellationRequest.version by 1
- entity: Reseller
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /licensing/resellers/{id}/suspend
    actor: SystemAdmin
    preconditions: []
    side_effects:
    - increments Reseller.version by 1
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /licensing/resellers/{id}/reinstate
    actor: SystemAdmin
    preconditions: []
    side_effects:
    - increments Reseller.version by 1
  note: Cyclic ACTIVE<->SUSPENDED
concurrency_rules:
- rule_id: seat-assign-stale-subscription
  parent_entity: Subscription
  write_endpoint: POST /licensing/seats
  occ_field: expected_subscription_version
  description: "Creating a Seat (provisioning extra seat inventory is not allowed \u2014 seats are minted at activation;\nthis rule instead guards seat ASSIGnment batch creation) against a Subscription\
    \ whose version has\nadvanced since the client last read it is rejected. A Seat creation request carrying a stale\nexpected_subscription_version is rejected with ERR_STALE_VERSION because the client's\
    \ view of\nseats_assigned / seats_purchased may no longer reflect reality.\n"
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: transfer-request-stale-seat
  parent_entity: Seat
  write_endpoint: POST /licensing/transfer-requests
  occ_field: expected_seat_version
  description: 'Creating a TransferRequest for a Seat whose version has advanced since the requester last

    observed it is rejected with ERR_STALE_VERSION; another admin may have just initiated a reclaim

    or assignment changing the seat''s effective state and the requester''s snapshot is stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: early_termination_fee
  trigger: Subscription ACTIVE -> CANCELLED_ETF finalization
  algorithm: tiered_pricing
  formula: 'remaining_months = commitment_months - months_elapsed

    remaining_value = remaining_months * monthly_charge_cents

    fee = floor(remaining_value * etf_rate_pct / 100)

    where months_elapsed = number of fully elapsed billing months between commitment_start and logical-clock now

    (a month elapses when clock passes the monthly anniversary of commitment_start)

    '
  input_set: the single Subscription being cancelled; uses plan.etf_rate_pct and subscription.monthly_charge_cents
  constants:
    MONTHS_PER_ANNUAL: 12
    ROUNDING: floor to whole cents
  precision: integer cents, floor
  variants:
  - name: in_window
    when: logical clock <= commitment_start + plan.cancellation_window_days days
    difference: fee is always 0 and cancellation lands as CANCELLED_IN_WINDOW with full refund
  - name: out_of_window
    when: past the window; only on ANNUAL_MONTHLY_BILLED or ANNUAL_PREPAID
    difference: fee computed as floor(remaining_value * etf_rate_pct / 100)
- name: monthly_billed_charge
  trigger: Subscription activation and whenever reseller discount changes (never changes post-activation)
  algorithm: tiered_pricing
  formula: "base = plan.monthly_price_cents when plan.billing_model == MONTHLY else plan.annual_monthly_price_cents\ndiscount_pct = 0 when subscription.reseller_id is null else reseller discount per tier:\n\
    \  CERTIFIED -> 5, GOLD -> 10, PLATINUM -> 15\nper_seat = floor(base * (100 - discount_pct) / 100)\nmonthly_charge_cents = per_seat * seats_purchased\nRounding order is pinned: per-seat floor FIRST,\
    \ then multiply by seats (round-per-line then sum).\n"
  input_set: the activating Subscription, its Plan, its Reseller if any
  constants:
    CERTIFIED_DISCOUNT_PCT: 5
    GOLD_DISCOUNT_PCT: 10
    PLATINUM_DISCOUNT_PCT: 15
  precision: integer cents; per-seat floor before multiplication
  variants:
  - name: direct
    when: subscription.reseller_id is null
    difference: discount_pct = 0; per_seat = base
  - name: reseller_routed
    when: subscription.reseller_id present
    difference: tier discount applied per-seat before seat multiplication
- name: org_storage_pool
  trigger: any transition that changes a subscription's active status, seat assignment, or add-on top-up
  algorithm: aggregation
  formula: "pool_gb = sum over subscriptions S of org where S.status == ACTIVE:\n            S.seats_assigned * plan(S).storage_gb_per_seat\n          + sum over AddOnService A of org where A.kind == CLOUD_SERVICES\
    \ and A.status in {ACTIVE, EXHAUSTED}:\n            A.quota_total\n(storage add-on quota units are 1 GB each)\n"
  input_set: subscriptions with status ACTIVE only; PAST_DUE subscriptions still count seats; cancelled/expired contribute 0
  constants:
    STORAGE_ADDON_UNIT_GB: 1
  precision: whole GB
- name: org_compliance_posture
  trigger: seat assignment/reclaim, subscription settle, audit open/raise/remediate/close
  algorithm: weighted_scoring
  formula: "over = max(0, sum over subs of org: max(0, S.seats_assigned - S.seats_purchased))\nunder_audit = any ComplianceAudit of org with status in {OPEN, FINDINGS_RAISED}\nany_past_due = any Subscription\
    \ of org with status == PAST_DUE\nposture =\n  FROZEN         if any ComplianceAudit FINDINGS_RAISED and over > 0\n  OVER_ALLOCATED if over > 0\n  UNDER_AUDIT    if under_audit\n  COMPLIANT      otherwise\n\
    Precedence pinned: FROZEN > OVER_ALLOCATED > UNDER_AUDIT > COMPLIANT. any_past_due does not change posture\nbut blocks new seat creation via validation.\n"
  input_set: all subscriptions and audits of the org regardless of status filter noted
  constants: {}
  precision: enum
- name: user_storage_used
  trigger: asset create/purge/transfer accept/claim
  algorithm: aggregation
  formula: 'used_gb(owner) = ceil( sum over assets A where A.owner_user_id == owner and A.status in {ACTIVE, IN_TRANSFER} of A.size_mb / 1024 )

    ORPHANED assets contribute 0 to any user; they accrue to no one until claimed.

    Rounding: sum MB first, then single ceil to GB (sum-then-round, opposite of per-line rounding in monthly_billed_charge).

    '
  input_set: assets of a single owner in {ACTIVE, IN_TRANSFER}
  constants:
    MB_PER_GB: 1024
  precision: whole GB, ceiling after MB sum
- name: addon_overage_charge
  trigger: monthly metering sweep per AddOnService
  algorithm: waterfall_allocation
  formula: 'consumed = usage event units in metering order sorted by (occurred_at ASC, created_at ASC)

    quota_used = min(consumed_cumulative, quota_total)

    overage_units = max(0, consumed_cumulative - quota_total)

    overage_charge_cents = overage_units * overage_unit_price_cents

    Waterfall: quota bucket fills first; only overflow is billed. Ties in occurred_at break by created_at ASC.

    '
  input_set: usage events of the add-on in the current metering period (month starting on subscription commitment day)
  constants: {}
  precision: integer cents
- name: default_product_version
  trigger: seat assignment (entitlement creation) and entitlement activation migration
  algorithm: projection
  formula: 'candidate set = ProductVersion of plan with availability == AVAILABLE

    select max by (release_date DESC); tie-break created_at ASC

    if candidate set empty -> assignment/activation fails with ERR_NO_AVAILABLE_VERSION

    '
  input_set: ProductVersion rows of the plan in availability AVAILABLE only
  constants: {}
  precision: n/a
- name: reseller_routing_selector
  trigger: POST /licensing/reseller-orders creation
  algorithm: waterfall_allocation
  formula: 'candidate resellers = Reseller with status == ACTIVE and region == order.region

    rank by tier priority PLATINUM > GOLD > CERTIFIED, then by least open orders

    (count of ResellerOrder in {ROUTED}), tie-break created_at ASC

    empty candidate set -> ERR_NO_RESELLER_AVAILABLE

    '
  input_set: ACTIVE resellers in the order's region
  constants:
    TIER_PRIORITY: 'PLATINUM: 3, GOLD: 2, CERTIFIED: 1'
  precision: n/a
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present and well-formed
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: "Role permitted to call this endpoint per \xA71.5 roles list"
  error_id: ERR_FORBIDDEN_ROLE
  http_status: 403
  applies_to: all
- priority: 3
  category: auth
  check: 'Entity-backed identity: for OrgAdmin/DeploymentAdmin, X-User-ID must be an existing Admin.id whose org_id matches the target resource''s org; for EndUser, X-User-ID must be an existing EndUser.id;
    for ResellerAgent, X-User-ID must be an existing Reseller.id; SystemAdmin is opaque'
  error_id: ERR_IDENTITY_MISMATCH
  http_status: 403
  applies_to: all
- priority: 4
  category: existence
  check: Path resources exist, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 5
  category: existence
  check: Body-referenced resources exist (plan_id, end_user_id, device_id, seat_id, to_user_id, reseller_id when non-null)
  error_id: ERR_REFERENCE_NOT_FOUND
  http_status: 404
  applies_to: POST endpoints with body FKs
- priority: 6
  category: state
  check: "Target entity in a state from which the trigger transition exists per \xA71.2"
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 7
  category: state
  check: 'OCC: expected_<parent>_version matches parent''s current version (concurrency_rules)'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /licensing/seats, POST /licensing/transfer-requests
- priority: 8
  category: business_safety
  check: 'Compliance freeze: org.compliance_posture == FROZEN blocks seat assignment, package submit, subscription activation'
  error_id: ERR_ORG_FROZEN
  http_status: 409
  applies_to: POST /licensing/seats, POST /licensing/seats/{id}/assign, POST /licensing/deployment-packages/{id}/submit, POST /licensing/subscriptions/{id}/activate
- priority: 9
  category: business_safety
  check: 'Audit evidence protection: asset purge forbidden while org.compliance_posture == UNDER_AUDIT or FROZEN'
  error_id: ERR_AUDIT_FREEZE
  http_status: 409
  applies_to: POST /licensing/assets/{id}/purge
- priority: 10
  category: business_safety
  check: 'Segregation of duties: approver admin id != requested_by_admin_id / created_by_admin_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST /licensing/transfer-requests/{id}/approve, POST /licensing/deployment-packages/{id}/approve, POST /licensing/transfer-requests/{id}/reject, POST /licensing/deployment-packages/{id}/reject
- priority: 11
  category: business_constraint
  check: Offline activation only when plan.allows_offline_activation and deployment_mode == SERIALIZED
  error_id: ERR_OFFLINE_ACTIVATION_NOT_ALLOWED
  http_status: 422
  applies_to: POST /licensing/deployment-packages, POST /licensing/deployment-packages/{id}/submit
- priority: 12
  category: business_constraint
  check: Package deployment_mode must be in plan.deployment_modes
  error_id: ERR_DEPLOYMENT_MODE_NOT_PERMITTED
  http_status: 422
  applies_to: POST /licensing/deployment-packages, POST /licensing/deployment-packages/{id}/submit, POST /licensing/deployment-packages/{id}/publish
- priority: 13
  category: business_constraint
  check: 'One seat per user per plan per org: no other ASSIGNED seat under the same plan in the org for the target user'
  error_id: ERR_DUPLICATE_PLAN_SEAT
  http_status: 409
  applies_to: POST /licensing/seats/{id}/assign, POST /licensing/transfer-requests/{id}/execute
- priority: 14
  category: business_constraint
  check: 'Device cap: seat must have fewer than plan.max_devices_per_seat ACTIVE device-entitlements before activating another device'
  error_id: ERR_DEVICE_LIMIT_EXCEEDED
  http_status: 422
  applies_to: POST /licensing/entitlements/{id}/activate
- priority: 15
  category: business_constraint
  check: 'Cross-org integrity: end_user.org_id == subscription.org_id; transfer to_user in same org; asset claim/transfer target in same org'
  error_id: ERR_CROSS_ORG_REFERENCE
  http_status: 422
  applies_to: POST /licensing/seats/{id}/assign, POST /licensing/transfer-requests, POST /licensing/assets/{id}/transfer, POST /licensing/assets/{id}/claim
- priority: 16
  category: business_temporal
  check: Reclaim finalize only when logical clock >= seat.pending_reclaim_not_before
  error_id: ERR_RECLAIM_GRACE_ACTIVE
  http_status: 409
  applies_to: POST /licensing/seats/{id}/reclaim/finalize
- priority: 17
  category: business_temporal
  check: TransferRequest approval only before expires_at; expired requests auto-EXPIRED
  error_id: ERR_TRANSFER_EXPIRED
  http_status: 409
  applies_to: POST /licensing/transfer-requests/{id}/approve
- priority: 18
  category: business_temporal
  check: force-upgrade deadline must be strictly in the future of the logical clock
  error_id: ERR_DEADLINE_NOT_FUTURE
  http_status: 422
  applies_to: POST /licensing/product-versions/{id}/force-upgrade
- priority: 19
  category: business_referential
  check: Deprecate leaves at least one AVAILABLE ProductVersion for the plan
  error_id: ERR_NO_AVAILABLE_VERSION
  http_status: 409
  applies_to: POST /licensing/product-versions/{id}/deprecate, seat assignment default selection
- priority: 20
  category: business_fiscal
  check: 'Seat capacity: subscription.seats_assigned < subscription.seats_purchased before assignment; plan.seat_limit honored at subscription creation'
  error_id: ERR_SEAT_CAPACITY_EXCEEDED
  http_status: 422
  applies_to: POST /licensing/seats/{id}/assign, POST /licensing/subscriptions
- priority: 21
  category: business_fiscal
  check: MONTHLY subscriptions cannot take the ETF path; outside the window a MONTHLY plan cancellation is DENIED
  error_id: ERR_MONTHLY_NO_ETF
  http_status: 422
  applies_to: POST /licensing/cancellation-requests/{id}/finalize
- priority: 22
  category: business_fiscal
  check: 'Reseller routing: at least one ACTIVE reseller in the order region'
  error_id: ERR_NO_RESELLER_AVAILABLE
  http_status: 422
  applies_to: POST /licensing/reseller-orders
- priority: 23
  category: business_fiscal
  check: Reseller must be ACTIVE at subscription activation and order fulfillment
  error_id: ERR_RESELLER_SUSPENDED
  http_status: 409
  applies_to: POST /licensing/subscriptions/{id}/activate, POST /licensing/reseller-orders/{id}/fulfill
- priority: 24
  category: business_constraint
  check: Required input fields present and typed per endpoint input
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
endpoints:
- method: POST
  path: /licensing/_clock/set_current_utc
  description: Set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Setting the clock runs pending system sweeps (PAST_DUE
    invoicing, subscription EXPIRED, transfer-request EXPIRED, add-on EXHAUSTED).
  roles:
  - SystemAdmin
  code: 200
  input:
  - to_iso8601
  output: '{ current_utc: string }'
  side_effects:
  - run pending system sweeps
- method: POST
  path: /licensing/organizations
  description: Create an organization
  roles:
  - SystemAdmin
  code: 201
  input:
  - name
  - org_type
  - primary_admin_id
  output: Organization
  side_effects: []
- method: GET
  path: /licensing/organizations/{id}
  description: Get one organization incl. computed storage_pool_gb and compliance_posture
  roles:
  - SystemAdmin
  - OrgAdmin
  code: 200
  input: []
  output: Organization
  side_effects: []
- method: POST
  path: /licensing/admins
  description: Create an admin
  roles:
  - SystemAdmin
  code: 201
  input:
  - email
  - full_name
  - admin_kind
  - org_id
  output: Admin
  side_effects: []
- method: GET
  path: /licensing/admins
  description: List admins, filterable by org
  roles:
  - SystemAdmin
  code: 200
  input:
  - limit?
  - offset?
  - org_id?
  output: Admin[]
  side_effects: []
- method: POST
  path: /licensing/end-users
  description: Create an end user in an org
  roles:
  - SystemAdmin
  - OrgAdmin
  code: 201
  input:
  - email
  - full_name
  - org_id
  output: EndUser
  side_effects: []
- method: GET
  path: /licensing/end-users/{id}
  description: Get one end user
  roles:
  - SystemAdmin
  - OrgAdmin
  - EndUser
  code: 200
  input: []
  output: EndUser
  side_effects: []
- method: GET
  path: /licensing/end-users
  description: List end users, filterable by org and status
  roles:
  - SystemAdmin
  - OrgAdmin
  code: 200
  input:
  - limit?
  - offset?
  - org_id?
  - status?
  output: EndUser[]
  side_effects: []
- method: POST
  path: /licensing/end-users/{id}/deactivate
  description: Deactivate a user; their ASSIGNED seats go to PENDING_RECLAIM with 24h grace
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: EndUser
  side_effects:
  - seat PENDING_RECLAIM cascade
  - entitlement SUSPENDED cascade
- method: POST
  path: /licensing/end-users/{id}/reactivate
  description: Reactivate a user; un-lapsed reclaims roll back
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: EndUser
  side_effects:
  - seat/entitlement rollback per state machine
- method: POST
  path: /licensing/end-users/{id}/mark-departed
  description: 'Finalize departure: pending reclaims finalize immediately, owned assets become ORPHANED'
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: EndUser
  side_effects:
  - seat RECLAIMED
  - entitlement REVOKED
  - assets ORPHANED
  - org storage recompute
- method: POST
  path: /licensing/devices
  description: Register a device for an end user
  roles:
  - EndUser
  - OrgAdmin
  code: 201
  input:
  - end_user_id
  - device_fingerprint
  - label
  output: Device
  side_effects: []
- method: GET
  path: /licensing/devices
  description: List devices, filterable by end_user_id
  roles:
  - SystemAdmin
  - OrgAdmin
  - EndUser
  code: 200
  input:
  - limit?
  - offset?
  - end_user_id?
  output: Device[]
  side_effects: []
- method: POST
  path: /licensing/plans
  description: Create a plan
  roles:
  - SystemAdmin
  code: 201
  input:
  - code
  - segment
  - billing_model
  - monthly_price_cents
  - annual_monthly_price_cents
  - storage_gb_per_seat
  - seat_limit
  - deployment_modes
  - allows_offline_activation
  - max_devices_per_seat?
  - cancellation_window_days
  - etf_rate_pct
  output: Plan
  side_effects: []
- method: POST
  path: /licensing/product-versions
  description: Create a product version for a plan
  roles:
  - SystemAdmin
  code: 201
  input:
  - plan_id
  - version_label
  - release_date
  - forced_upgrade_deadline?
  output: ProductVersion
  side_effects: []
- method: GET
  path: /licensing/product-versions
  description: List product versions, filterable by plan and availability
  roles:
  - SystemAdmin
  - OrgAdmin
  - DeploymentAdmin
  code: 200
  input:
  - limit?
  - offset?
  - plan_id?
  - availability?
  output: ProductVersion[]
  side_effects: []
- method: POST
  path: /licensing/product-versions/{id}/deprecate
  description: Deprecate a version; must leave >= 1 AVAILABLE for the plan
  roles:
  - SystemAdmin
  code: 200
  input: []
  output: ProductVersion
  side_effects:
  - default version selection changes for future assignments
- method: POST
  path: /licensing/product-versions/{id}/force-upgrade
  description: Mark a DEPRECATED version FORCED_UPGRADE with a future deadline
  roles:
  - SystemAdmin
  code: 200
  input:
  - forced_upgrade_deadline
  output: ProductVersion
  side_effects:
  - post-deadline activations migrate to latest AVAILABLE version
- method: POST
  path: /licensing/resellers
  description: Create a reseller
  roles:
  - SystemAdmin
  code: 201
  input:
  - name
  - region
  - tier
  output: Reseller
  side_effects: []
- method: POST
  path: /licensing/subscriptions
  description: Create a direct subscription (PENDING_PAYMENT)
  roles:
  - SystemAdmin
  code: 201
  input:
  - org_id
  - plan_id
  - seats_purchased
  - reseller_id?
  output: Subscription
  side_effects:
  - validate seats_purchased <= plan.seat_limit unless -1
- method: GET
  path: /licensing/subscriptions/{id}
  description: Get a subscription
  roles:
  - SystemAdmin
  - OrgAdmin
  code: 200
  input: []
  output: Subscription
  side_effects: []
- method: GET
  path: /licensing/subscriptions
  description: List subscriptions, filterable by org/plan/reseller/status
  roles:
  - SystemAdmin
  - OrgAdmin
  code: 200
  input:
  - limit?
  - offset?
  - org_id?
  - plan_id?
  - reseller_id?
  - status?
  output: Subscription[]
  side_effects: []
- method: POST
  path: /licensing/subscriptions/{id}/activate
  description: Activate PENDING_PAYMENT subscription; stamps commitment_start, computes monthly_charge_cents
  roles:
  - SystemAdmin
  code: 200
  input: []
  output: Subscription
  side_effects:
  - commitment_start := clock
  - monthly_charge_cents computed
  - org storage recompute
- method: POST
  path: /licensing/subscriptions/{id}/settle
  description: Settle PAST_DUE back to ACTIVE
  roles:
  - SystemAdmin
  code: 200
  input: []
  output: Subscription
  side_effects:
  - entitlements SUSPENDED -> ACTIVE
- method: POST
  path: /licensing/seats
  description: Mint one extra seat after a seats_purchased amendment; OCC-guarded on subscription version
  roles:
  - SystemAdmin
  code: 201
  input:
  - subscription_id
  - expected_subscription_version
  output: Seat
  side_effects:
  - increments Subscription.version by 1
  - org storage recompute
- method: GET
  path: /licensing/seats/{id}
  description: Get a seat
  roles:
  - SystemAdmin
  - OrgAdmin
  code: 200
  input: []
  output: Seat
  side_effects: []
- method: GET
  path: /licensing/seats
  description: List seats, filterable by subscription/end_user/status
  roles:
  - SystemAdmin
  - OrgAdmin
  code: 200
  input:
  - limit?
  - offset?
  - subscription_id?
  - end_user_id?
  - status?
  output: Seat[]
  side_effects: []
- method: POST
  path: /licensing/seats/{id}/assign
  description: Assign an UNASSIGNED or RECLAIMED seat; creates PENDING_ACTIVATION entitlement
  roles:
  - OrgAdmin
  code: 200
  input:
  - end_user_id
  output: Seat
  side_effects:
  - seats_assigned += 1
  - entitlement created
  - org storage/compliance recompute
- method: POST
  path: /licensing/seats/{id}/reclaim
  description: Begin reclaim with 24h grace
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: Seat
  side_effects:
  - entitlement SUSPENDED
  - pending_reclaim_not_before := now + 24h
- method: POST
  path: /licensing/seats/{id}/reclaim/finalize
  description: Finalize reclaim after grace; entitlement REVOKED
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: Seat
  side_effects:
  - seats_assigned -= 1
  - entitlement REVOKED
  - org storage/compliance recompute
- method: GET
  path: /licensing/entitlements
  description: List entitlements, filterable by seat/device/status
  roles:
  - SystemAdmin
  - OrgAdmin
  - EndUser
  code: 200
  input:
  - limit?
  - offset?
  - seat_id?
  - device_id?
  - status?
  - product_version_id?
  output: Entitlement[]
  side_effects: []
- method: POST
  path: /licensing/entitlements/{id}/activate
  description: Activate an entitlement on one of the assignee's devices (named-user propagation)
  roles:
  - EndUser
  code: 200
  input:
  - device_id
  output: Entitlement
  side_effects:
  - device cap check
  - forced-upgrade migration if past deadline
- method: POST
  path: /licensing/transfer-requests
  description: Initiate a seat transfer; OCC on seat version; seat -> TRANSFERRING
  roles:
  - OrgAdmin
  code: 201
  input:
  - org_id
  - seat_id
  - to_user_id
  - requested_by_admin_id
  - expected_seat_version
  output: TransferRequest
  side_effects:
  - seat ASSIGNED -> TRANSFERRING
  - expires_at := now + 72h
  - increments Seat.version by 1
- method: POST
  path: /licensing/transfer-requests/{id}/approve
  description: Approve a pending transfer (different admin than requester)
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: TransferRequest
  side_effects: []
- method: POST
  path: /licensing/transfer-requests/{id}/reject
  description: Reject a pending transfer (different admin than requester)
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: TransferRequest
  side_effects:
  - seat TRANSFERRING -> ASSIGNED
- method: POST
  path: /licensing/transfer-requests/{id}/execute
  description: Execute an approved transfer; seat reassigns, entitlement resets to PENDING_ACTIVATION
  roles:
  - SystemAdmin
  code: 200
  input: []
  output: TransferRequest
  side_effects:
  - seat reassign side effects
  - status EXECUTED
- method: POST
  path: /licensing/cancellation-requests
  description: Request subscription cancellation
  roles:
  - OrgAdmin
  code: 201
  input:
  - subscription_id
  - requested_by_admin_id
  output: CancellationRequest
  side_effects:
  - requested_at := logical clock
- method: POST
  path: /licensing/cancellation-requests/{id}/finalize
  description: 'Finalize: in-window => REFUNDED; annual out-of-window => ETF_CHARGED; else DENIED'
  roles:
  - SystemAdmin
  code: 200
  input: []
  output: CancellationRequest
  side_effects:
  - subscription transition per window
  - seat/entitlement cascades
- method: POST
  path: /licensing/add-on-services
  description: Attach an add-on (STOCK_CREDITS, FONTS, CLOUD_SERVICES) to a subscription
  roles:
  - OrgAdmin
  code: 201
  input:
  - subscription_id
  - kind
  - quota_total
  - overage_unit_price_cents?
  output: AddOnService
  side_effects:
  - CLOUD_SERVICES quota feeds org storage pool
- method: GET
  path: /licensing/add-on-services
  description: List add-ons, filterable by subscription/kind/status
  roles:
  - SystemAdmin
  - OrgAdmin
  code: 200
  input:
  - limit?
  - offset?
  - subscription_id?
  - kind?
  - status?
  output: AddOnService[]
  side_effects: []
- method: POST
  path: /licensing/add-on-services/{id}/consume
  description: 'Record usage units (waterfall: quota first, then overage billing)'
  roles:
  - EndUser
  - OrgAdmin
  code: 200
  input:
  - units
  output: AddOnService
  side_effects:
  - quota_used updated
  - may transition EXHAUSTED
- method: POST
  path: /licensing/add-on-services/{id}/top-up
  description: Add quota units; EXHAUSTED returns to ACTIVE when quota_used < new quota_total
  roles:
  - OrgAdmin
  code: 200
  input:
  - units
  output: AddOnService
  side_effects:
  - quota_total += units
- method: POST
  path: /licensing/add-on-services/{id}/cancel
  description: Cancel an add-on; metering stops
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: AddOnService
  side_effects:
  - org storage recompute when kind == CLOUD_SERVICES
- method: POST
  path: /licensing/assets
  description: Create an asset owned by an end user
  roles:
  - EndUser
  - OrgAdmin
  code: 201
  input:
  - owner_user_id
  - title
  - size_mb
  output: Asset
  side_effects:
  - owner storage_used_gb recomputed
- method: GET
  path: /licensing/assets
  description: List assets, filterable by owner/org/status
  roles:
  - SystemAdmin
  - OrgAdmin
  - EndUser
  code: 200
  input:
  - limit?
  - offset?
  - owner_user_id?
  - org_id?
  - status?
  output: Asset[]
  side_effects: []
- method: POST
  path: /licensing/assets/{id}/transfer
  description: Initiate asset transfer to another in-org user
  roles:
  - OrgAdmin
  code: 200
  input:
  - to_user_id
  output: Asset
  side_effects: []
- method: POST
  path: /licensing/assets/{id}/transfer/accept
  description: Recipient accepts; ownership and storage re-attribute
  roles:
  - EndUser
  code: 200
  input: []
  output: Asset
  side_effects:
  - owner_user_id updated
  - storage re-attributed
- method: POST
  path: /licensing/assets/{id}/claim
  description: Claim an ORPHANED asset to an in-org user
  roles:
  - OrgAdmin
  code: 200
  input:
  - to_user_id
  output: Asset
  side_effects:
  - storage re-attributed
- method: POST
  path: /licensing/assets/{id}/purge
  description: Purge an ORPHANED asset (blocked under audit freeze)
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: Asset
  side_effects: []
- method: POST
  path: /licensing/deployment-packages
  description: Create a deployment package draft
  roles:
  - DeploymentAdmin
  code: 201
  input:
  - org_id
  - created_by_admin_id
  - name
  - plan_id
  - deployment_mode
  - offline_activation?
  output: DeploymentPackage
  side_effects: []
- method: GET
  path: /licensing/deployment-packages
  description: List packages, filterable by org/plan/status
  roles:
  - SystemAdmin
  - OrgAdmin
  - DeploymentAdmin
  code: 200
  input:
  - limit?
  - offset?
  - org_id?
  - plan_id?
  - status?
  - created_by_admin_id?
  output: DeploymentPackage[]
  side_effects: []
- method: POST
  path: /licensing/deployment-packages/{id}/submit
  description: Submit a draft package for approval
  roles:
  - DeploymentAdmin
  code: 200
  input: []
  output: DeploymentPackage
  side_effects: []
- method: POST
  path: /licensing/deployment-packages/{id}/approve
  description: Approve a package (OrgAdmin; different admin than creator)
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: DeploymentPackage
  side_effects: []
- method: POST
  path: /licensing/deployment-packages/{id}/publish
  description: Publish an approved package
  roles:
  - DeploymentAdmin
  code: 200
  input: []
  output: DeploymentPackage
  side_effects: []
- method: POST
  path: /licensing/reseller-orders
  description: Route a purchase order to a regional reseller per selector policy
  roles:
  - SystemAdmin
  - OrgAdmin
  code: 201
  input:
  - org_id
  - plan_id
  - seats
  - region
  output: ResellerOrder
  side_effects:
  - reseller_id resolved by reseller_routing_selector
  - discount_pct stamped
- method: GET
  path: /licensing/reseller-orders
  description: List reseller orders, filterable by reseller/org/plan/status
  roles:
  - SystemAdmin
  - ResellerAgent
  - OrgAdmin
  code: 200
  input:
  - limit?
  - offset?
  - reseller_id?
  - org_id?
  - plan_id?
  - status?
  output: ResellerOrder[]
  side_effects: []
- method: POST
  path: /licensing/reseller-orders/{id}/fulfill
  description: Reseller fulfills; creates PENDING_PAYMENT subscription carrying reseller_id
  roles:
  - ResellerAgent
  code: 200
  input: []
  output: ResellerOrder
  side_effects:
  - Subscription created
- method: POST
  path: /licensing/compliance-audits
  description: Open a compliance audit on an org
  roles:
  - SystemAdmin
  code: 201
  input:
  - org_id
  - opened_by_admin_id
  output: ComplianceAudit
  side_effects:
  - org posture -> UNDER_AUDIT
- method: POST
  path: /licensing/compliance-audits/{id}/raise-findings
  description: Record findings; posture may become FROZEN when over-allocated
  roles:
  - SystemAdmin
  code: 200
  input:
  - findings_count
  output: ComplianceAudit
  side_effects:
  - posture recompute with FROZEN precedence
- method: POST
  path: /licensing/compliance-audits/{id}/close
  description: Close an audit (OPEN requires findings_count == 0)
  roles:
  - SystemAdmin
  code: 200
  input: []
  output: ComplianceAudit
  side_effects:
  - posture recompute
- method: POST
  path: /licensing/seats/{id}/reclaim/cancel
  description: Cancel a pending reclaim inside grace
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: Seat
  side_effects:
  - entitlement SUSPENDED -> ACTIVE
- method: POST
  path: /licensing/product-versions/{id}/restore
  description: Restore a DEPRECATED version to AVAILABLE
  roles:
  - SystemAdmin
  code: 200
  input: []
  output: ProductVersion
  side_effects: []
- method: POST
  path: /licensing/deployment-packages/{id}/reject
  description: Reject a package (OrgAdmin; different admin than creator)
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: DeploymentPackage
  side_effects: []
- method: POST
  path: /licensing/deployment-packages/{id}/retire
  description: Retire a published package
  roles:
  - DeploymentAdmin
  code: 200
  input: []
  output: DeploymentPackage
  side_effects: []
- method: POST
  path: /licensing/reseller-orders/{id}/reject
  description: Reseller rejects a routed order
  roles:
  - ResellerAgent
  code: 200
  input: []
  output: ResellerOrder
  side_effects: []
- method: POST
  path: /licensing/reseller-orders/{id}/cancel
  description: System admin cancels a routed order
  roles:
  - SystemAdmin
  code: 200
  input: []
  output: ResellerOrder
  side_effects: []
- method: POST
  path: /licensing/assets/{id}/transfer/cancel
  description: Cancel a pending asset transfer
  roles:
  - OrgAdmin
  code: 200
  input: []
  output: Asset
  side_effects:
  - owner unchanged
- method: POST
  path: /licensing/compliance-audits/{id}/remediate
  description: Mark findings remediated after over-allocation resolved
  roles:
  - SystemAdmin
  code: 200
  input: []
  output: ComplianceAudit
  side_effects:
  - posture recompute
- method: GET
  path: /licensing/admins/{id}
  description: Get an admin
  roles:
  - SystemAdmin
  - OrgAdmin
  - DeploymentAdmin
  code: 200
  input: []
  output: Admin
  side_effects: []
- method: GET
  path: /licensing/plans/{id}
  description: Get a plan
  roles:
  - SystemAdmin
