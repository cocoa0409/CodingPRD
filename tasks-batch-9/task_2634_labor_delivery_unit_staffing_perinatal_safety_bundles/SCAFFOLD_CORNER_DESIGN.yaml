              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-PASS-1111", parity: 1, gestational_age_weeks: 40 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { encounter_id: $.data.id }
            - call: POST /support-person-passes
              payload: { encounter_id: "${encounter_id}", person_name: "Rosa Kaminski", credential_type: "PARTNER" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { pass_id: $.data.id, valid_until: $.data.valid_until }
            - call: POST /support-person-passes/${pass_id}/check-in
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { first_in_count: $.data.reentry_count }
            - call: POST /support-person-passes/${pass_id}/check-out
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { out_status: $.data.status }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:30:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: POST /support-person-passes/${pass_id}/check-in
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { back_status: $.data.status, back_count: $.data.reentry_count, back_in_at: $.data.checked_in_at }
          assert:
