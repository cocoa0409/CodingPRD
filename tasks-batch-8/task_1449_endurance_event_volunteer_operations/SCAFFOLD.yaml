scenario: |
  Endurance Event Volunteer Operations (marathon organizing committee): role catalog & shift creation by course segment, volunteer registration & minimum-age/skill requirements, training & captain assignment, check-in, credential & supply distribution, no-show backfill & floating pool, hour tracking for group fundraising credit, appreciation & retention program, post-event debrief & role adjustment

domain_name: endurance-event-volunteer-operations
api_prefix: /volunteer-ops

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (13 entities, flat topology under /volunteer-ops)
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable event name" }
      - { name: event_start_at, type: datetime, source: input, description: "Race-day start instant (UTC ISO8601)" }
      - { name: event_end_at, type: datetime, source: input, description: "Event end instant; must be strictly after event_start_at" }
      - { name: early_access_opens_at, type: datetime, source: input, description: "From this instant only volunteers with is_returning=true may create signups" }
      - { name: signup_opens_at, type: datetime, source: input, description: "General signup window opens; must be >= early_access_opens_at and < signup_closes_at" }
      - { name: signup_closes_at, type: datetime, source: input, description: "Signup window closes; must be > signup_opens_at and <= event_start_at" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOCKED | RACE_DAY | COMPLETED | DEBRIEF_OPEN | CLOSED | CANCELLED", default: DRAFT }

  - name: CourseSegment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: segment_code, type: string, source: input, description: "Unique-per-event code, e.g. MILE-05-WATER" }
      - { name: mile_start, type: number, source: input, description: "Inclusive start of half-open mile range [mile_start, mile_end)" }
      - { name: mile_end, type: number, source: input, description: "Exclusive end of half-open mile range; must be > mile_start" }
      - { name: terrain_type, type: enum, source: input, description: "ROAD | TRAIL | BRIDGE | TRACK" }

  - name: RoleCatalogEntry
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: role_code, type: string, source: input, description: "Unique-per-event machine code, e.g. MARSHAL-18" }
      - { name: title, type: string, source: input, description: "Display title, e.g. Mile 18 Course Marshal" }
      - { name: min_age_years, type: integer, source: input, description: "Minimum age in whole years measured on event_start_at date; signup requires age >= min_age_years" }
      - { name: required_skill, type: enum, source: input, description: "NONE | MEDICAL | BIKE_MARSHAL | TIMING_TECH | COURSE_MARSHAL", default: NONE }
      - { name: required_training_module, type: enum, source: input, description: "NONE | SAFETY_BRIEFING | MEDICAL_RESPONSE | CAPTAIN_COURSE; NONE means no training gate", default: NONE }
      - { name: credit_weight, type: number, source: input, description: "Fundraising-credit hour multiplier for this role; > 0 and <= 3", default: 1.0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | RETIRED", default: ACTIVE }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: role_entry_id, type: string, source: input, description: "FK -> RoleCatalogEntry.id; role staffed by this shift" }
      - { name: segment_id, type: string, source: input, description: "FK -> CourseSegment.id; course segment covered" }
      - { name: start_at, type: datetime, source: input, description: "Shift start; must be within [event.event_start_at, event.event_end_at]" }
      - { name: end_at, type: datetime, source: input, description: "Shift end; strictly after start_at and within event bounds" }
      - { name: required_headcount, type: integer, source: input, description: "Seats to fill; >= 1" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of Signups on this shift with status IN {APPROVED, CONFIRMED, CHECKED_IN, COMPLETED}" }
      - { name: checked_in_count, type: integer, source: computed, description: "Count of Signups on this shift with status IN {CHECKED_IN, COMPLETED}" }
      - { name: understaffed_alert, type: boolean, source: computed, description: "True once a backfill attempt found an empty eligible float pool; cleared when confirmed_count reaches required_headcount", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | LOCKED | IN_PROGRESS | RECONCILED | CANCELLED", default: OPEN }

  - name: FundraisingGroup
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: name, type: string, source: input, description: "Group name, e.g. Riverside High Track Club" }
      - { name: charity_code, type: string, source: input, description: "Unique-per-event charity code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED groups reject new volunteer affiliations", default: ACTIVE }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event (registration is per-event)" }
      - { name: group_id, type: string, source: input, description: "FK -> FundraisingGroup.id; optional fundraising affiliation; null when unaffiliated" }
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; drives age_years_on_event" }
      - { name: skill_tags, type: array, source: input, description: "Array of skill enums from {MEDICAL, BIKE_MARSHAL, TIMING_TECH, COURSE_MARSHAL}", default: [] }
      - { name: float_opt_in, type: boolean, source: input, description: "Volunteer joins the floating backfill pool", default: false }
      - { name: is_returning, type: boolean, source: input, description: "Returning-volunteer flag (retention program); gates early-access window and waitlist priority", default: false }
      - { name: status, type: enum, source: system, description: "REGISTERED | ELIGIBLE | SUSPENDED", default: REGISTERED }
      - { name: age_years_on_event, type: integer, source: computed, description: "Whole years between date_of_birth and the event_start_at calendar date; a birthday falling exactly on the event date counts as reached" }
      - { name: no_show_strikes, type: integer, source: system, description: "Count of NO_SHOW signups for this volunteer; >= 2 auto-suspends", default: 0 }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; trainee" }
      - { name: module_code, type: enum, source: input, description: "SAFETY_BRIEFING | MEDICAL_RESPONSE | CAPTAIN_COURSE" }
      - { name: status, type: enum, source: system, description: "ENROLLED | PASSED | FAILED | EXPIRED", default: ENROLLED }
      - { name: passed_at, type: datetime, source: system, description: "Set on PASS transition; null otherwise" }
      - { name: valid_until, type: datetime, source: system, description: "passed_at + module validity (SAFETY_BRIEFING 30d, CAPTAIN_COURSE 365d, MEDICAL_RESPONSE 730d); null unless PASSED" }
      - { name: attempt_count, type: integer, source: system, description: "1 at creation; +1 on every re-enroll", default: 1 }

  - name: Signup
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; signing volunteer" }
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id; target shift" }
      - { name: status, type: enum, source: system, description: "REQUESTED | WAITLISTED | APPROVED | CONFIRMED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", default: REQUESTED }
      - { name: origin, type: enum, source: system, description: "DIRECT | WAITLIST_PROMOTION | FLOAT_POOL_BACKFILL", default: DIRECT }
      - { name: replaces_signup_id, type: string, source: system, description: "FK -> Signup.id; self-referential: set on backfill signups to the NO_SHOW/CANCELLED signup they replace; null otherwise" }
      - { name: is_captain, type: boolean, source: system, description: "True once assign-captain succeeds; at most one captain Signup per Shift", default: false }
      - { name: requested_at, type: datetime, source: system, description: "Creation instant" }
      - { name: approved_at, type: datetime, source: system, description: "Set on transition into APPROVED (approve or promotion); null otherwise" }
      - { name: confirm_by_at, type: datetime, source: system, description: "min(approved_at + 48h, shift.start_at - 1h); epoch sweep cancels APPROVED signups whose confirm_by_at < now" }
      - { name: confirmed_at, type: datetime, source: system, description: "Set on CONFIRMED transition; null otherwise" }
      - { name: checked_in_at, type: datetime, source: system, description: "Set on check-in; null otherwise" }
      - { name: checked_out_at, type: datetime, source: system, description: "Set on check-out; null otherwise" }

  - name: SupplyInventory
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: item_code, type: string, source: input, description: "Unique-per-event item code, e.g. SAFETY_VEST" }
      - { name: description, type: string, source: input, description: "Free-text item description" }
      - { name: quantity_total, type: integer, source: input, description: "Total units on hand; >= 0" }
      - { name: quantity_issued, type: integer, source: computed, description: "Count of DistributionRecords with this inventory_id, kind=SUPPLY_ITEM, status=ISSUED", default: 0 }

  - name: DistributionRecord
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: signup_id, type: string, source: input, description: "FK -> Signup.id; recipient signup (must be CHECKED_IN)" }
      - { name: inventory_id, type: string, source: input, description: "FK -> SupplyInventory.id; required when kind=SUPPLY_ITEM, must be null when kind=CREDENTIAL" }
      - { name: kind, type: enum, source: input, description: "CREDENTIAL | SUPPLY_ITEM" }
      - { name: status, type: enum, source: system, description: "ISSUED | RETURNED | REVOKED", default: ISSUED }
      - { name: issued_at, type: datetime, source: system, description: "Issuance instant" }
      - { name: returned_at, type: datetime, source: system, description: "Set on return; null otherwise" }

  - name: HourLog
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; denormalized from signup at creation" }
      - { name: signup_id, type: string, source: system, description: "FK -> Signup.id; the checked-out signup this log records" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | DISPUTED | REJECTED", default: PENDING_VERIFICATION }
      - { name: break_minutes, type: integer, source: input, description: "Unpaid break minutes subtracted from raw duration; >= 0; adjustable via adjust endpoint", default: 0 }
      - { name: raw_minutes, type: integer, source: system, description: "max(0, checked_out_at - checked_in_at - break_minutes); recomputed on adjust" }
      - { name: claimed_hours, type: number, source: computed, description: "round_half_up(raw_minutes / 60, 2 decimal places)" }
      - { name: credited_hours, type: number, source: computed, description: "round_half_up(raw_minutes / 15, integer) * 0.25 — per-entry quarter-hour rounding, rounded BEFORE any summation" }
      - { name: verified_by_role, type: enum, source: system, description: "CAPTAIN | COORDINATOR; set on verify, null otherwise" }

  - name: DebriefReport
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id; debriefed shift" }
      - { name: author_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must equal X-User-ID and be captain of shift_id" }
      - { name: headcount_actual, type: integer, source: input, description: "Captain-reported actual staffing; >= 0" }
      - { name: role_effectiveness_rating, type: integer, source: input, description: "1..5 effectiveness rating of the assigned role" }
      - { name: supply_shortage_flag, type: boolean, source: input, description: "True when supplies ran short on this shift", default: false }
      - { name: notes, type: string, source: input, description: "Free-text debrief notes" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED", default: DRAFT }

  - name: RoleAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: role_entry_id, type: string, source: input, description: "FK -> RoleCatalogEntry.id; role being adjusted" }
      - { name: debrief_report_id, type: string, source: input, description: "FK -> DebriefReport.id; motivating debrief (must be SUBMITTED or ACKNOWLEDGED at creation, ACKNOWLEDGED at approve)" }
      - { name: proposed_min_age_years, type: integer, source: input, description: "Optional replacement min_age_years" }
      - { name: proposed_required_skill, type: enum, source: input, description: "Optional replacement required_skill (NONE|MEDICAL|BIKE_MARSHAL|TIMING_TECH|COURSE_MARSHAL)" }
      - { name: proposed_credit_weight, type: number, source: input, description: "Optional replacement credit_weight" }
      - { name: proposed_retire, type: boolean, source: input, description: "When true, applying retires the role", default: false }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | APPLIED", default: PROPOSED }
      - { name: applied_at, type: datetime, source: system, description: "Set on apply; null otherwise" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /volunteer-ops/events/{eventId}/publish
        actor: EventDirector
        preconditions:
          - "At least one RoleCatalogEntry with status ACTIVE exists for the event (ERR_EVENT_READINESS_INCOMPLETE)"
          - "At least one CourseSegment exists for the event (ERR_EVENT_READINESS_INCOMPLETE)"
          - "At least one Shift exists for the event (ERR_EVENT_READINESS_INCOMPLETE)"
        side_effects: []
      - from: PUBLISHED
        to: LOCKED
        trigger: POST /volunteer-ops/events/{eventId}/lock-signups OR system via POST /volunteer-ops/events/{eventId}/run-epoch-sweep when now >= signup_closes_at
        actor: EventDirector
        preconditions: []
        side_effects:
          - "Every Shift of this event in status OPEN or FULL -> LOCKED"
      - from: LOCKED
        to: RACE_DAY
        trigger: POST /volunteer-ops/events/{eventId}/start-race-day
        actor: EventDirector
        preconditions:
          - "Logical clock now >= event.event_start_at (ERR_EVENT_NOT_YET_STARTED)"
        side_effects:
          - "Every Shift of this event in status LOCKED -> IN_PROGRESS"
      - from: RACE_DAY
        to: COMPLETED
        trigger: POST /volunteer-ops/events/{eventId}/complete
        actor: EventDirector
        preconditions:
          - "Logical clock now >= event.event_end_at (ERR_EVENT_NOT_YET_ENDED)"
          - "Zero Signups of this event in status CHECKED_IN (ERR_SIGNUPS_STILL_ON_COURSE)"
        side_effects: []
      - from: COMPLETED
        to: DEBRIEF_OPEN
        trigger: POST /volunteer-ops/events/{eventId}/open-debrief
        actor: EventDirector
        preconditions: []
        side_effects: []
      - from: DEBRIEF_OPEN
        to: CLOSED
        trigger: POST /volunteer-ops/events/{eventId}/close
        actor: EventDirector
        preconditions:
          - "Zero HourLogs of this event in status PENDING_VERIFICATION or DISPUTED (ERR_EVENT_CLOSE_BLOCKED)"
          - "Zero DebriefReports of this event in status SUBMITTED (ERR_EVENT_CLOSE_BLOCKED)"
          - "Zero RoleAdjustments of this event in status PROPOSED or APPROVED (ERR_EVENT_CLOSE_BLOCKED)"
          - "Every Shift of this event in status IN {RECONCILED, CANCELLED} (ERR_EVENT_CLOSE_BLOCKED)"
        side_effects:
          - "Settled fundraising credit and recognition tiers become final (no further hour/debrief mutations accepted)"
      - from: DRAFT
        to: CANCELLED
        trigger: POST /volunteer-ops/events/{eventId}/cancel
        actor: EventDirector
        preconditions: []
        side_effects:
          - "Cascade: every Shift of this event in status OPEN|FULL|LOCKED|IN_PROGRESS -> CANCELLED (link 1)"
          - "Cascade link 2: every Signup on a cancelled Shift in status REQUESTED|WAITLISTED|APPROVED|CONFIRMED|CHECKED_IN -> CANCELLED"
          - "Cascade link 3: every DistributionRecord on a cancelled Signup with status ISSUED -> REVOKED; SUPPLY_ITEM revokes decrement SupplyInventory.quantity_issued"
      - from: PUBLISHED
        to: CANCELLED
        trigger: POST /volunteer-ops/events/{eventId}/cancel
        actor: EventDirector
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]
      - from: LOCKED
        to: CANCELLED
        trigger: POST /volunteer-ops/events/{eventId}/cancel
        actor: EventDirector
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]
      - from: RACE_DAY
        to: CANCELLED
        trigger: POST /volunteer-ops/events/{eventId}/cancel
        actor: EventDirector
        preconditions: []
        side_effects:
          - "Same cascade as DRAFT -> CANCELLED, additionally covering CHECKED_IN signups (mid-race cancellation revokes their ISSUED credentials and supply items)"
      - from: COMPLETED
        to: CANCELLED
        trigger: POST /volunteer-ops/events/{eventId}/cancel
        actor: EventDirector
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]

  - entity: Shift
    initial_state: OPEN
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (automatic when confirmed_count reaches required_headcount after an approve/promotion/backfill)"
        actor: system
        preconditions: ["confirmed_count >= required_headcount"]
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system (automatic when confirmed_count drops below required_headcount after a cancel/no-show/timeout)"
        actor: system
        preconditions: ["confirmed_count < required_headcount"]
        side_effects:
          - "Seat-open handling fires (waitlist promotion pre-RACE_DAY; float-pool backfill during RACE_DAY)"
      - from: OPEN
        to: LOCKED
        trigger: "system (cascade from Event lock-signups or epoch-sweep auto-lock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: LOCKED
        trigger: "system (cascade from Event lock-signups or epoch-sweep auto-lock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: IN_PROGRESS
        trigger: "system (cascade from Event start-race-day)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: RECONCILED
        trigger: POST /volunteer-ops/shifts/{shiftId}/reconcile
        actor: VolunteerCoordinator
        preconditions:
          - "Event.status IN {COMPLETED, DEBRIEF_OPEN} (ERR_INVALID_EVENT_STATE)"
          - "Zero Signups on this shift in status CONFIRMED or CHECKED_IN (ERR_SHIFT_HAS_UNRESOLVED_SIGNUPS)"
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: POST /volunteer-ops/shifts/{shiftId}/cancel (manual, event DRAFT|PUBLISHED) OR system (cascade from Event cancel)
        actor: VolunteerCoordinator
        preconditions: ["Manual cancel: Event.status IN {DRAFT, PUBLISHED} (ERR_INVALID_EVENT_STATE)"]
        side_effects: ["Cascade to non-terminal Signups -> CANCELLED"]
      - from: FULL
        to: CANCELLED
        trigger: POST /volunteer-ops/shifts/{shiftId}/cancel (manual, event DRAFT|PUBLISHED) OR system (cascade from Event cancel)
        actor: VolunteerCoordinator
        preconditions: ["Manual cancel: Event.status IN {DRAFT, PUBLISHED} (ERR_INVALID_EVENT_STATE)"]
        side_effects: ["Cascade to non-terminal Signups -> CANCELLED"]
      - from: LOCKED
        to: CANCELLED
        trigger: "system (cascade from Event cancel)"
        actor: system
        preconditions: []
        side_effects: ["Cascade to non-terminal Signups -> CANCELLED"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (cascade from Event cancel)"
        actor: system
        preconditions: []
        side_effects: ["Cascade to non-terminal Signups (incl. CHECKED_IN) -> CANCELLED; their ISSUED distributions -> REVOKED"]

  - entity: Signup
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: POST /volunteer-ops/signups/{signupId}/approve
        actor: VolunteerCoordinator
        preconditions:
          - "Signup.status == REQUESTED (ERR_SIGNUP_NOT_APPROVABLE)"
          - "Event.status == PUBLISHED (ERR_EVENT_NOT_PUBLISHED)"
          - "Shift.status == OPEN or FULL (ERR_SHIFT_NOT_OPEN when LOCKED/IN_PROGRESS/RECONCILED/CANCELLED)"
          - "Volunteer.status == ELIGIBLE (ERR_VOLUNTEER_NOT_ELIGIBLE)"
          - "Re-run safety gauntlet: age >= role.min_age_years (ERR_MIN_AGE_NOT_MET); skill (ERR_REQUIRED_SKILL_MISSING); training current (ERR_TRAINING_NOT_CURRENT)"
          - "Re-run overlap check vs volunteer's APPROVED/CONFIRMED signups (ERR_SHIFT_TIME_OVERLAP)"
          - "Shift.confirmed_count < Shift.required_headcount (ERR_SHIFT_CAPACITY_REACHED)"
        side_effects:
          - "approved_at = now; confirm_by_at = min(approved_at + 48h, shift.start_at - 1h)"
          - "Shift.confirmed_count recomputed; if == required_headcount, Shift OPEN -> FULL"
      - from: WAITLISTED
        to: APPROVED
        trigger: "system (waitlist promotion when a seat opens while Event.status IN {PUBLISHED})"
        actor: system
        preconditions:
          - "Eligible candidate selection: WAITLISTED signups on this shift whose volunteer is ELIGIBLE and still passes age/skill/training/overlap checks"
          - "Ranking: is_returning DESC, then requested_at ASC; tie-break volunteer.created_at ASC"
        side_effects:
          - "origin = WAITLIST_PROMOTION; approved_at = now; confirm_by_at recomputed as in approve"
          - "Shift.confirmed_count recomputed; if == required_headcount, Shift OPEN -> FULL"
      - from: APPROVED
        to: CONFIRMED
        trigger: POST /volunteer-ops/signups/{signupId}/confirm
        actor: Volunteer
        preconditions:
          - "Signup.status == APPROVED (ERR_SIGNUP_NOT_CONFIRMABLE)"
          - "X-User-ID == Signup.volunteer_id (ERR_NOT_RESOURCE_OWNER)"
          - "now <= confirm_by_at (ERR_CONFIRM_DEADLINE_PASSED)"
        side_effects:
          - "confirmed_at = now"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: POST /volunteer-ops/signups/{signupId}/check-in
        actor: VolunteerCoordinator
        preconditions:
          - "Signup.status == CONFIRMED (ERR_SIGNUP_NOT_CHECKINABLE)"
          - "Event.status == RACE_DAY (ERR_INVALID_EVENT_STATE)"
          - "now within [shift.start_at - 60min, shift.end_at] (ERR_CHECKIN_WINDOW_INVALID)"
        side_effects:
          - "checked_in_at = now"
          - "Auto-create DistributionRecord kind=CREDENTIAL, status=ISSUED for this signup"
          - "Shift.checked_in_count recomputed"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: POST /volunteer-ops/signups/{signupId}/check-out
        actor: VolunteerCoordinator
        preconditions:
          - "Signup.status == CHECKED_IN (ERR_SIGNUP_NOT_CHECKED_OUTABLE)"
        side_effects:
          - "checked_out_at = now"
          - "Create HourLog (PENDING_VERIFICATION) with raw_minutes/claimed_hours/credited_hours computed"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: POST /volunteer-ops/signups/{signupId}/mark-no-show
        actor: Captain
        preconditions:
          - "Signup.status == CONFIRMED (ERR_SIGNUP_NOT_NO_SHOWABLE)"
          - "Event.status IN {RACE_DAY, COMPLETED} (ERR_INVALID_EVENT_STATE)"
          - "now >= shift.start_at + 30min no-show grace (ERR_NO_SHOW_GRACE_NOT_PASSED)"
          - "Actor is VolunteerCoordinator, or Captain whose captain Signup shares this shift_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Volunteer.no_show_strikes += 1 (cascade link 1)"
          - "If no_show_strikes >= 2: Volunteer -> SUSPENDED (link 2); every other Signup of this volunteer in status APPROVED|CONFIRMED -> CANCELLED with origin preserved (link 3); each affected Shift recomputes confirmed_count, FULL -> OPEN as needed (link 4); seat-open handling fires per freed seat (link 5: waitlist promotion if Event PUBLISHED, float-pool backfill if RACE_DAY)"
          - "This shift's freed seat: if Event.status == RACE_DAY and now <= shift.start_at + 90min, float-pool backfill attempt; on empty eligible pool set Shift.understaffed_alert = true"
      - from: REQUESTED
        to: CANCELLED
        trigger: POST /volunteer-ops/signups/{signupId}/cancel (self or coordinator) OR system cascade
        actor: Volunteer
        preconditions: ["Signup.status IN {REQUESTED, WAITLISTED, APPROVED, CONFIRMED} (ERR_SIGNUP_NOT_CANCELLABLE)"]
        side_effects:
          - "If status was APPROVED or CONFIRMED: seat freed -> Shift.confirmed_count recomputed; FULL -> OPEN as needed; seat-open handling fires (waitlist promotion when Event PUBLISHED; float-pool backfill when RACE_DAY and within backfill window)"
          - "If is_captain was true, captain slot on the shift is released"
      - from: WAITLISTED
        to: CANCELLED
        trigger: POST /volunteer-ops/signups/{signupId}/cancel OR system cascade
        actor: Volunteer
        preconditions: ["Signup.status IN {REQUESTED, WAITLISTED, APPROVED, CONFIRMED} (ERR_SIGNUP_NOT_CANCELLABLE)"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: POST /volunteer-ops/signups/{signupId}/cancel OR epoch-sweep confirm-timeout OR suspension cascade
        actor: Volunteer
        preconditions: ["Signup.status IN {REQUESTED, WAITLISTED, APPROVED, CONFIRMED} (ERR_SIGNUP_NOT_CANCELLABLE)"]
        side_effects: ["Seat freed; same seat-open handling as REQUESTED -> CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /volunteer-ops/signups/{signupId}/cancel OR suspension cascade OR event cascade
        actor: Volunteer
        preconditions: ["Signup.status IN {REQUESTED, WAITLISTED, APPROVED, CONFIRMED} (ERR_SIGNUP_NOT_CANCELLABLE); self-cancel of CONFIRMED forbidden once Event.status == RACE_DAY (ERR_SIGNUP_NOT_CANCELLABLE)"]
        side_effects:
          - "Seat freed; same seat-open handling"
          - "Cascade link: DistributionRecords of this signup with status ISSUED -> REVOKED (SUPPLY_ITEM revokes decrement inventory)"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "system (event-cancellation cascade only; the cancel endpoint never cancels CHECKED_IN)"
        actor: system
        preconditions: ["Owning Event transitioned to CANCELLED"]
        side_effects:
          - "Cascade link: DistributionRecords of this signup with status ISSUED -> REVOKED (SUPPLY_ITEM revokes decrement inventory)"

  - entity: Volunteer
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ELIGIBLE
        trigger: POST /volunteer-ops/volunteers/{volunteerId}/screen
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer.status == REGISTERED (ERR_VOLUNTEER_NOT_SCREENABLE)"
          - "age_years_on_event >= 14 global floor (ERR_MIN_AGE_NOT_MET)"
        side_effects: []
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system (automatic when no_show_strikes reaches 2)"
        actor: system
        preconditions: ["no_show_strikes >= 2"]
        side_effects:
          - "Cascade: all APPROVED|CONFIRMED signups of this volunteer -> CANCELLED (frees seats, fires seat-open handling)"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: POST /volunteer-ops/volunteers/{volunteerId}/reinstate
        actor: VolunteerCoordinator
        preconditions: ["Volunteer.status == SUSPENDED (ERR_VOLUNTEER_NOT_SUSPENDED)"]
        side_effects: ["no_show_strikes reset to 0"]

  - entity: TrainingRecord
    initial_state: ENROLLED
    terminal_states: []
    transitions:
      - from: ENROLLED
        to: PASSED
        trigger: POST /volunteer-ops/training-records/{trainingRecordId}/pass
        actor: VolunteerCoordinator
        preconditions: ["TrainingRecord.status == ENROLLED (ERR_TRAINING_INVALID_STATE)"]
        side_effects:
          - "passed_at = now; valid_until = now + module validity (SAFETY_BRIEFING 30d, CAPTAIN_COURSE 365d, MEDICAL_RESPONSE 730d)"
      - from: ENROLLED
        to: FAILED
        trigger: POST /volunteer-ops/training-records/{trainingRecordId}/fail
        actor: VolunteerCoordinator
        preconditions: ["TrainingRecord.status == ENROLLED (ERR_TRAINING_INVALID_STATE)"]
        side_effects: []
      - from: FAILED
        to: ENROLLED
        trigger: POST /volunteer-ops/training-records/{trainingRecordId}/re-enroll
        actor: VolunteerCoordinator
        preconditions: ["TrainingRecord.status IN {FAILED, EXPIRED} (ERR_TRAINING_INVALID_STATE)"]
        side_effects: ["attempt_count += 1; passed_at = null; valid_until = null"]
      - from: EXPIRED
        to: ENROLLED
        trigger: POST /volunteer-ops/training-records/{trainingRecordId}/re-enroll
        actor: VolunteerCoordinator
        preconditions: ["TrainingRecord.status IN {FAILED, EXPIRED} (ERR_TRAINING_INVALID_STATE)"]
        side_effects: ["attempt_count += 1; passed_at = null; valid_until = null"]
      - from: PASSED
        to: EXPIRED
        trigger: "system via POST /volunteer-ops/events/{eventId}/run-epoch-sweep when now > valid_until"
        actor: system
        preconditions: ["now > valid_until"]
        side_effects:
          - "Cascade: every Signup of this volunteer in status APPROVED|CONFIRMED whose shift's role.required_training_module == this module_code -> CANCELLED (seat freed; seat-open handling fires)"

  - entity: RoleCatalogEntry
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /volunteer-ops/role-catalog-entries/{roleEntryId}/suspend
        actor: VolunteerCoordinator
        preconditions: ["RoleCatalogEntry.status == ACTIVE (ERR_ROLE_ENTRY_INVALID_STATE)"]
        side_effects: ["New signups against shifts of a SUSPENDED role are rejected (ERR_ROLE_ENTRY_NOT_ACTIVE)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /volunteer-ops/role-catalog-entries/{roleEntryId}/reactivate
        actor: VolunteerCoordinator
        preconditions: ["RoleCatalogEntry.status == SUSPENDED (ERR_ROLE_ENTRY_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: POST /volunteer-ops/role-catalog-entries/{roleEntryId}/retire OR RoleAdjustment apply with proposed_retire=true
        actor: VolunteerCoordinator
        preconditions:
          - "RoleCatalogEntry.status IN {ACTIVE, SUSPENDED} (ERR_ROLE_ENTRY_INVALID_STATE)"
          - "Zero Signups in status REQUESTED|WAITLISTED|APPROVED|CONFIRMED|CHECKED_IN on shifts of this role (ERR_ROLE_IN_USE)"
        side_effects: ["Future shift creation for this role rejected (ERR_ROLE_ENTRY_NOT_ACTIVE)"]
      - from: SUSPENDED
        to: RETIRED
        trigger: POST /volunteer-ops/role-catalog-entries/{roleEntryId}/retire OR RoleAdjustment apply with proposed_retire=true
        actor: VolunteerCoordinator
        preconditions:
          - "RoleCatalogEntry.status IN {ACTIVE, SUSPENDED} (ERR_ROLE_ENTRY_INVALID_STATE)"
          - "Zero non-terminal signups on shifts of this role (ERR_ROLE_IN_USE)"
        side_effects: []

  - entity: FundraisingGroup
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /volunteer-ops/fundraising-groups/{groupId}/suspend
        actor: EventDirector
        preconditions: ["FundraisingGroup.status == ACTIVE (ERR_GROUP_INVALID_STATE)"]
        side_effects: ["New volunteer affiliations to this group rejected (ERR_GROUP_SUSPENDED); existing volunteers keep affiliation"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /volunteer-ops/fundraising-groups/{groupId}/reinstate
        actor: EventDirector
        preconditions: ["FundraisingGroup.status == SUSPENDED (ERR_GROUP_INVALID_STATE)"]
        side_effects: []

  - entity: HourLog
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: POST /volunteer-ops/hour-logs/{hourLogId}/verify
        actor: Captain
        preconditions:
          - "HourLog.status IN {PENDING_VERIFICATION, DISPUTED} (ERR_HOUR_LOG_INVALID_STATE)"
          - "Actor is VolunteerCoordinator, or Captain of the shift behind HourLog.signup_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["verified_by_role = CAPTAIN or COORDINATOR; group settled credit recomputed on read"]
      - from: DISPUTED
        to: VERIFIED
        trigger: POST /volunteer-ops/hour-logs/{hourLogId}/verify
        actor: Captain
        preconditions: ["HourLog.status IN {PENDING_VERIFICATION, DISPUTED} (ERR_HOUR_LOG_INVALID_STATE)"]
        side_effects: ["Settled credit recomputed (dispute-then-reverify leaves settled credit unchanged)"]
      - from: PENDING_VERIFICATION
        to: DISPUTED
        trigger: POST /volunteer-ops/hour-logs/{hourLogId}/dispute
        actor: Volunteer
        preconditions:
          - "HourLog.status IN {PENDING_VERIFICATION, VERIFIED} (ERR_HOUR_LOG_INVALID_STATE)"
          - "Actor is the hour log's volunteer (X-User-ID == signup.volunteer_id), the GroupLeader of that volunteer's group (X-User-ID == group.id), or VolunteerCoordinator (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["Disputed logs leave the settled credit pool until re-verified"]
      - from: VERIFIED
        to: DISPUTED
        trigger: POST /volunteer-ops/hour-logs/{hourLogId}/dispute
        actor: Volunteer
        preconditions:
          - "HourLog.status IN {PENDING_VERIFICATION, VERIFIED} (ERR_HOUR_LOG_INVALID_STATE)"
          - "Same ownership rule as PENDING_VERIFICATION -> DISPUTED"
        side_effects: ["Settled credit recomputed (log drops out of the settled pool)"]
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: POST /volunteer-ops/hour-logs/{hourLogId}/reject
        actor: VolunteerCoordinator
        preconditions: ["HourLog.status == PENDING_VERIFICATION (ERR_HOUR_LOG_INVALID_STATE)"]
        side_effects: ["Excluded from both provisional and settled credit"]

  - entity: DistributionRecord
    initial_state: ISSUED
    terminal_states: [RETURNED, REVOKED]
    transitions:
      - from: ISSUED
        to: RETURNED
        trigger: POST /volunteer-ops/distribution-records/{distributionId}/return
        actor: VolunteerCoordinator
        preconditions:
          - "DistributionRecord.status == ISSUED (ERR_DISTRIBUTION_INVALID_STATE)"
          - "kind == SUPPLY_ITEM (credentials cannot be returned: ERR_DISTRIBUTION_INVALID_STATE)"
        side_effects: ["returned_at = now; SupplyInventory.quantity_issued recomputed (decrement)"]
      - from: ISSUED
        to: REVOKED
        trigger: POST /volunteer-ops/distribution-records/{distributionId}/revoke OR cascade from signup/event cancellation
        actor: VolunteerCoordinator
        preconditions: ["DistributionRecord.status == ISSUED (ERR_DISTRIBUTION_INVALID_STATE)"]
        side_effects: ["If kind == SUPPLY_ITEM: SupplyInventory.quantity_issued recomputed (decrement)"]

  - entity: DebriefReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /volunteer-ops/debrief-reports/{debriefId}/submit
        actor: Captain
        preconditions:
          - "DebriefReport.status == DRAFT (ERR_DEBRIEF_INVALID_STATE)"
          - "X-User-ID == author_volunteer_id (ERR_NOT_RESOURCE_OWNER)"
          - "Event.status == DEBRIEF_OPEN (ERR_INVALID_EVENT_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: POST /volunteer-ops/debrief-reports/{debriefId}/acknowledge
        actor: VolunteerCoordinator
        preconditions: ["DebriefReport.status == SUBMITTED (ERR_DEBRIEF_INVALID_STATE)"]
        side_effects: []

  - entity: RoleAdjustment
    initial_state: PROPOSED
    terminal_states: [REJECTED, APPLIED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: POST /volunteer-ops/role-adjustments/{adjustmentId}/approve
        actor: EventDirector
        preconditions:
          - "RoleAdjustment.status == PROPOSED (ERR_ADJUSTMENT_INVALID_STATE)"
          - "Event.status == DEBRIEF_OPEN (ERR_INVALID_EVENT_STATE)"
          - "debrief_report_id's DebriefReport.status == ACKNOWLEDGED (ERR_DEBRIEF_NOT_ACKNOWLEDGED)"
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: POST /volunteer-ops/role-adjustments/{adjustmentId}/reject
        actor: EventDirector
        preconditions:
          - "RoleAdjustment.status == PROPOSED (ERR_ADJUSTMENT_INVALID_STATE)"
          - "Event.status == DEBRIEF_OPEN (ERR_INVALID_EVENT_STATE)"
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: POST /volunteer-ops/role-adjustments/{adjustmentId}/apply
        actor: VolunteerCoordinator
        preconditions:
          - "RoleAdjustment.status == APPROVED (ERR_ADJUSTMENT_INVALID_STATE)"
          - "Event.status == DEBRIEF_OPEN (ERR_INVALID_EVENT_STATE)"
          - "expected_role_version == RoleCatalogEntry.version (ERR_STALE_VERSION)"
          - "If proposed_retire: zero non-terminal signups on this role's shifts (ERR_ROLE_IN_USE)"
        side_effects:
          - "Apply provided proposed_* fields to RoleCatalogEntry (proposed_retire=true -> status RETIRED); RoleCatalogEntry.version += 1"
          - "applied_at = now; forward-looking only: existing signups are NOT re-validated against new requirements"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: event-config-update-stale
    parent_entity: Event
    write_endpoint: PATCH /volunteer-ops/events/{eventId}
    occ_field: expected_event_version
    description: |
      Updating an Event's configuration with an expected_event_version older than
      the Event's current version is rejected: another writer has already advanced
      the event config since the client last read it, and both writes would
      otherwise legitimately succeed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: volunteer-profile-update-stale
    parent_entity: Volunteer
    write_endpoint: PATCH /volunteer-ops/volunteers/{volunteerId}
    occ_field: expected_volunteer_version
    description: |
      Updating a Volunteer's mutable profile fields (skills, group, float opt-in,
      returning flag) with a stale expected_volunteer_version is rejected; e.g. a
      coordinator editing skill_tags while the volunteer toggles float_opt_in are
      two legitimate writes that must not silently overwrite each other.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: role-adjust-apply-stale-role
    parent_entity: RoleCatalogEntry
    write_endpoint: POST /volunteer-ops/role-adjustments/{adjustmentId}/apply
    occ_field: expected_role_version
    description: |
      Applying an APPROVED RoleAdjustment against a RoleCatalogEntry whose version
      has advanced since the client observed it is rejected; two approved
      adjustments on the same role could both legitimately apply, so the second
      must re-read the role before re-applying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: age_years_on_event
    trigger: "Volunteer creation; screen; signup create; signup approve"
    algorithm: chronological
    formula: |
      Let D = event.event_start_at calendar date (UTC), B = volunteer.date_of_birth.
      age = D.year - B.year - (1 if (D.month, D.day) < (B.month, B.day) else 0)
      A birthday falling exactly on the event date counts as reached.
    input_set: "The volunteer's date_of_birth and the owning event's event_start_at"
    constants:
      GLOBAL_MIN_AGE: 14
    precision: "integer years"
    variants: []

  - name: shift_fill_posture
    trigger: "approve, waitlist promotion, backfill, cancel, no-show, sweep-cancel, check-in, check-out"
    algorithm: aggregation
    formula: |
      confirmed_count = count(Signup where signup.shift_id == shift.id
                              AND signup.status IN {APPROVED, CONFIRMED, CHECKED_IN, COMPLETED})
      checked_in_count = count(Signup where signup.shift_id == shift.id
                               AND signup.status IN {CHECKED_IN, COMPLETED})
      While Event.status == PUBLISHED and Shift.status IN {OPEN, FULL}:
        if confirmed_count >= required_headcount -> Shift.status = FULL
        if confirmed_count <  required_headcount -> Shift.status = OPEN
      Seat-open handling (when confirmed_count drops below required_headcount):
        if Event.status == PUBLISHED -> waitlist promotion (selector below)
        elif Event.status == RACE_DAY and now <= shift.start_at + 90min -> float-pool backfill (selector below)
        else -> none
    input_set: "Signups of the shift; REQUESTED, WAITLISTED, NO_SHOW and CANCELLED never occupy a seat"
    constants:
      BACKFILL_WINDOW_MINUTES: 90
    precision: "integer counts"
    variants: []

  - name: waitlist_promotion_rank
    trigger: "seat-open handling while Event.status == PUBLISHED"
    algorithm: constraint_propagation
    formula: |
      candidates = Signups with shift_id == shift.id, status == WAITLISTED,
                   volunteer.status == ELIGIBLE, and re-verified age/skill/training/overlap checks
      rank: is_returning DESC, then requested_at ASC, then volunteer.created_at ASC
      Promote the single top candidate to APPROVED (origin=WAITLIST_PROMOTION).
      If candidates is empty -> no promotion (seat stays open).
    input_set: "WAITLISTED signups of the freed shift only"
    constants: {}
    precision: "deterministic total order; id never participates"
    variants: []

  - name: float_pool_backfill_selection
    trigger: "seat-open handling while Event.status == RACE_DAY and now <= shift.start_at + 90min"
    algorithm: constraint_propagation
    formula: |
      candidates = Volunteers of this event with float_opt_in == true, status == ELIGIBLE,
                   age_years_on_event >= role.min_age_years,
                   role.required_skill IN volunteer.skill_tags (or NONE),
                   role.required_training_module satisfied by a PASSED, non-EXPIRED TrainingRecord
                     (valid_until >= now; NONE module always satisfied),
                   and no APPROVED|CONFIRMED signup whose shift overlaps [start_at, end_at]
                     under the volunteer_overlap_rule semantics.
      rank: fewest hours already worked this event ASC
              (sum of credited_hours over that volunteer's HourLogs in any status except REJECTED),
            then volunteer.created_at ASC.
      Top candidate: create Signup(status=CONFIRMED, origin=FLOAT_POOL_BACKFILL,
              replaces_signup_id = the freed signup, confirmed_at = now).
      If candidates is empty -> set Shift.understaffed_alert = true (no error).
    input_set: "Volunteers of the event; excludes volunteers with a REJECTED-only hour history from the ranking sum but not from eligibility"
    constants:
      BACKFILL_WINDOW_MINUTES: 90
    precision: "deterministic total order; id never participates"
    variants: []

  - name: credited_hours_quarter_rounding
    trigger: "check-out (HourLog creation) and POST /hour-logs/{id}/adjust"
    algorithm: aggregation
    formula: |
      raw_minutes = max(0, checked_out_at - checked_in_at - break_minutes)
      claimed_hours  = round_half_up(raw_minutes / 60, 2)
      credited_hours = round_half_up(raw_minutes / 15, 0) * 0.25
      PINNED ORDER: quarter-rounding is applied PER HourLog entry BEFORE any
      summation. Group or volunteer totals are sums of per-entry credited_hours.
      (Sum-then-round is a different, forbidden order: two 6-minute logs credit
      0.00 + 0.00 = 0.00 under the pinned order, never 0.25.)
    input_set: "The single HourLog being computed"
    constants:
      QUARTER_MINUTES: 15
    precision: "claimed 2dp round_half_up; credited to the exact quarter hour, round_half_up on quarters"
    variants: []

  - name: fundraising_credit
    trigger: "on read of GET /volunteer-ops/fundraising-groups/{groupId}/credit-summary"
    algorithm: tiered_pricing
    formula: |
      effective_hours(log) = round_half_up(log.credited_hours * role.credit_weight, 2)
        where role is the RoleCatalogEntry of the log's signup's shift.
      effective_claimed_hours(log) = round_half_up(log.claimed_hours * role.credit_weight, 2)

      PROVISIONAL variant:
        pool = HourLogs of signups whose volunteer.group_id == group.id
               AND log.status IN {PENDING_VERIFICATION, VERIFIED, DISPUTED}
        provisional_effective_hours = sum(effective_claimed_hours over pool)
        provisional_credit_cents = tier_credit(provisional_effective_hours)

      SETTLED variant:
        pool = same but log.status == VERIFIED only, using effective_hours
        settled_effective_hours = sum(effective_hours over pool)
        settled_credit_cents = tier_credit(settled_effective_hours)

      tier_credit(h): marginal tiers over h with per-slice rounding:
        slice1 = min(h, 100);        cents1 = round_half_up(slice1 * 500, 0)
        slice2 = min(max(h-100,0), 400); cents2 = round_half_up(slice2 * 800, 0)
        slice3 = max(h-500, 0);      cents3 = round_half_up(slice3 * 1200, 0)
        return cents1 + cents2 + cents3
      Hour-to-tier allocation order (when it matters for audit display):
        HourLogs sorted by shift.start_at ASC, then hour_log.created_at ASC.
    input_set: "HourLogs joined via Signup -> Volunteer.group_id == group.id; REJECTED logs and logs of SUSPENDED groups' volunteers are still included by status alone (group suspension blocks NEW affiliations, not accrual on existing ones)"
    constants:
      TIER1_LIMIT_HOURS: 100
      TIER1_RATE_CENTS: 500
      TIER2_LIMIT_HOURS: 500
      TIER2_RATE_CENTS: 800
      TIER3_RATE_CENTS: 1200
    precision: "cents integer, per-slice round_half_up"
    variants:
      - name: provisional
        when: "planning view; includes PENDING_VERIFICATION, VERIFIED and DISPUTED logs at claimed_hours"
        difference: "Larger input set and unrounded-quarter claimed hours -> strictly >= settled for identical data"
      - name: settled
        when: "official credit; VERIFIED logs only at credited_hours"
        difference: "Smaller input set and quarter-rounded hours -> can be strictly less than provisional"

  - name: sponsor_match_credit
    trigger: "on read of GET /volunteer-ops/fundraising-groups/{groupId}/credit-summary, after fundraising_credit"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (removes the circular reading
      "match depends on total, total includes match"):
        step 1: base = settled_credit_cents from fundraising_credit
        step 2: match_pct keyed on base ALONE (never on total):
                base >= 250000 -> 0.25; base >= 50000 -> 0.15; else 0.05
        step 3: sponsor_match_cents = round_half_up(base * match_pct, 0)
        step 4: total_settled_credit_cents = base + sponsor_match_cents
      The match tier MUST NOT be re-evaluated against total_settled_credit_cents.
    input_set: "settled_credit_cents of the group"
    constants:
      MATCH_TIER_HIGH_CENTS: 250000
      MATCH_TIER_HIGH_PCT: 0.25
      MATCH_TIER_MID_CENTS: 50000
      MATCH_TIER_MID_PCT: 0.15
      MATCH_BASE_PCT: 0.05
    precision: "cents integer, round_half_up"
    variants: []

  - name: recognition_points
    trigger: "on read of GET /volunteer-ops/volunteers/{volunteerId}/recognition-summary"
    algorithm: weighted_scoring
    formula: |
      Per signup of this volunteer:
        hour_points    = credited_hours (VERIFIED logs) or claimed_hours
                         (PENDING_VERIFICATION/DISPUTED logs) * 10 per hour
        captain_bonus  = 25 if the signup has is_captain == true and status != CANCELLED
        noshow_penalty = -15 if signup.status == NO_SHOW
      returning_bonus = 50 if volunteer.is_returning == true (once per event)
      projected_points = sum over signups not in {CANCELLED} of
                         (hour_points using claimed for unverified + bonuses + penalties)
                         + returning_bonus
      official_points  = sum over signups not in {CANCELLED} of
                         (hour_points using VERIFIED-only credited hours + bonuses + penalties)
                         + returning_bonus
      recognition_tier keyed on official_points:
        official >= 600 -> PLATINUM; >= 300 -> GOLD; >= 150 -> SILVER; >= 50 -> BRONZE; else NONE
      Points may go negative; there is no floor.
    input_set: "Signups of the volunteer in this event and their HourLogs; CANCELLED signups excluded entirely; REJECTED HourLogs contribute 0"
    constants:
      POINTS_PER_HOUR: 10
      CAPTAIN_BONUS: 25
      RETURNING_BONUS: 50
      NOSHOW_PENALTY: -15
      TIER_BRONZE: 50
      TIER_SILVER: 150
      TIER_GOLD: 300
      TIER_PLATINUM: 600
    precision: "points integer (hours * 10 of 2dp hours is exact)"
    variants:
      - name: projected
        when: "pre-verification appreciation planning view"
        difference: "Counts claimed_hours of PENDING_VERIFICATION and DISPUTED logs"
      - name: official
        when: "tier-award view"
        difference: "Counts only VERIFIED credited_hours; identical data yields fewer points when unverified logs exist"

  - name: volunteer_overlap_rule
    trigger: "signup create and approve; float-pool eligibility"
    algorithm: interval_merge
    formula: |
      For candidate shift S and each existing APPROVED|CONFIRMED signup shift T
      of the same volunteer:
        buffer = 30 minutes if S.segment_id != T.segment_id else 0
        overlap iff S.start_at < T.end_at + buffer AND T.start_at < S.end_at + buffer
      Back-to-back shifts on the SAME segment are allowed (buffer 0, half-open
      adjacency at exact end==start is not an overlap); cross-segment changes
      require a strict 30-minute gap. Violation -> ERR_SHIFT_TIME_OVERLAP.
    input_set: "Volunteer's APPROVED and CONFIRMED signups only (REQUESTED, WAITLISTED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED excluded)"
    constants:
      TRANSITION_BUFFER_MINUTES: 30
    precision: "minute granularity"
    variants: []

  - name: segment_mile_overlap_rule
    trigger: "POST /volunteer-ops/course-segments"
    algorithm: interval_merge
    formula: |
      New segment [mile_start, mile_end) conflicts with any existing segment
      [s, e) of the SAME event iff mile_start < e AND s < mile_end
      (half-open semantics: adjacency mile_end == s or mile_start == e is legal).
      Violation -> ERR_SEGMENT_MILE_OVERLAP.
    input_set: "All existing CourseSegments of the same event"
    constants: {}
    precision: "miles as numbers; exact equality at adjacency is NOT overlap"
    variants: []

  - name: no_show_strike_threshold
    trigger: "Signup CONFIRMED -> NO_SHOW"
    algorithm: threshold
    formula: |
      volunteer.no_show_strikes += 1
      if volunteer.no_show_strikes >= 2 and volunteer.status == ELIGIBLE:
        volunteer.status = SUSPENDED (fires suspension cascade)
      Reinstatement resets strikes to 0.
    input_set: "The volunteer behind the no-show signup"
    constants:
      STRIKE_LIMIT: 2
    precision: "integer"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references exist (volunteer_id, shift_id, group_id, role_entry_id, segment_id, inventory_id, signup_id, event_id, debrief_report_id)"
    error_id: "ERR_EVENT_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_ROLE_ENTRY_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_GROUP_NOT_FOUND | ERR_VOLUNTEER_NOT_FOUND | ERR_TRAINING_RECORD_NOT_FOUND | ERR_SIGNUP_NOT_FOUND | ERR_INVENTORY_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND | ERR_HOUR_LOG_NOT_FOUND | ERR_DEBRIEF_NOT_FOUND | ERR_ADJUSTMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: state
    check: "Target resource state preconditions per state machine (event status gates, signup status gates, hour-log/debrief/adjustment/training status gates, volunteer ELIGIBLE checks, role ACTIVE checks)"
    error_id: "ERR_INVALID_EVENT_STATE | ERR_EVENT_NOT_PUBLISHED | ERR_SHIFT_NOT_OPEN | ERR_SIGNUP_NOT_APPROVABLE | ERR_SIGNUP_NOT_CONFIRMABLE | ERR_SIGNUP_NOT_CANCELLABLE | ERR_SIGNUP_NOT_CHECKINABLE | ERR_SIGNUP_NOT_CHECKED_OUTABLE | ERR_SIGNUP_NOT_NO_SHOWABLE | ERR_SIGNUP_NOT_CHECKED_IN | ERR_VOLUNTEER_NOT_ELIGIBLE | ERR_VOLUNTEER_NOT_SCREENABLE | ERR_VOLUNTEER_NOT_SUSPENDED | ERR_TRAINING_INVALID_STATE | ERR_ROLE_ENTRY_INVALID_STATE | ERR_ROLE_ENTRY_NOT_ACTIVE | ERR_GROUP_INVALID_STATE | ERR_HOUR_LOG_INVALID_STATE | ERR_DISTRIBUTION_INVALID_STATE | ERR_DEBRIEF_INVALID_STATE | ERR_ADJUSTMENT_INVALID_STATE | ERR_EVENT_READINESS_INCOMPLETE | ERR_EVENT_NOT_YET_STARTED | ERR_EVENT_NOT_YET_ENDED | ERR_SIGNUPS_STILL_ON_COURSE | ERR_SHIFT_HAS_UNRESOLVED_SIGNUPS | ERR_EVENT_CLOSE_BLOCKED | ERR_DEBRIEF_NOT_ACKNOWLEDGED"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 5
    category: business_safety
    check: "Minimum age: age_years_on_event >= role.min_age_years at signup create and approve; age_years_on_event >= 14 global floor at screen"
    error_id: ERR_MIN_AGE_NOT_MET
    http_status: 422
    applies_to: "POST /volunteer-ops/signups, POST /volunteer-ops/signups/{id}/approve, POST /volunteer-ops/volunteers/{id}/screen"
  - priority: 6
    category: business_safety
    check: "Required skill: role.required_skill == NONE or present in volunteer.skill_tags"
    error_id: ERR_REQUIRED_SKILL_MISSING
    http_status: 422
    applies_to: "POST /volunteer-ops/signups, POST /volunteer-ops/signups/{id}/approve"
  - priority: 7
    category: business_safety
    check: "Required training current: role.required_training_module == NONE or volunteer holds a TrainingRecord for that module in PASSED status with valid_until >= now (EXPIRED/FAILED/ENROLLED fail)"
    error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 422
    applies_to: "POST /volunteer-ops/signups, POST /volunteer-ops/signups/{id}/approve, POST /volunteer-ops/signups/{id}/assign-captain (module CAPTAIN_COURSE)"
  - priority: 8
    category: business_temporal
    check: "Signup window: now < early_access_opens_at or now >= signup_closes_at -> ERR_SIGNUP_WINDOW_CLOSED; early_access_opens_at <= now < signup_opens_at requires volunteer.is_returning == true else ERR_EARLY_ACCESS_RESTRICTED; check-in window [shift.start_at - 60min, shift.end_at]; confirm by confirm_by_at; no-show grace 30min"
    error_id: "ERR_SIGNUP_WINDOW_CLOSED | ERR_EARLY_ACCESS_RESTRICTED | ERR_CHECKIN_WINDOW_INVALID | ERR_CONFIRM_DEADLINE_PASSED | ERR_NO_SHOW_GRACE_NOT_PASSED"
    http_status: 422
    applies_to: "POST /volunteer-ops/signups, /check-in, /confirm, /mark-no-show"
  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: volunteer shift overlap with buffer; segment mile overlap; per-event uniqueness (segment_code, role_code, charity_code); one active signup per (volunteer, shift); one TrainingRecord per (volunteer, module); one captain per shift; one ISSUED credential per signup; inventory_id required iff kind=SUPPLY_ITEM; datetime ordering (end > start; window bounds)"
    error_id: "ERR_SHIFT_TIME_OVERLAP | ERR_SEGMENT_MILE_OVERLAP | ERR_DUPLICATE_SIGNUP | ERR_DUPLICATE_TRAINING_RECORD | ERR_CAPTAIN_SLOT_TAKEN | ERR_CREDENTIAL_ALREADY_ISSUED | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "creation and approve endpoints"
  - priority: 10
    category: business_constraint
    check: "Capacity: approve requires shift.confirmed_count < required_headcount; role retirement requires zero non-terminal signups"
    error_id: "ERR_SHIFT_CAPACITY_REACHED | ERR_ROLE_IN_USE"
    http_status: 409
    applies_to: "POST /volunteer-ops/signups/{id}/approve, POST /volunteer-ops/role-catalog-entries/{id}/retire, POST /volunteer-ops/role-adjustments/{id}/apply"
  - priority: 11
    category: business_referential
    check: "Group affiliation: volunteer.group_id may only reference a FundraisingGroup with status ACTIVE"
    error_id: ERR_GROUP_SUSPENDED
    http_status: 409
    applies_to: "POST /volunteer-ops/volunteers, PATCH /volunteer-ops/volunteers/{id}"
  - priority: 12
    category: business_fiscal
    check: "Supply stock: issuing a SUPPLY_ITEM requires inventory.quantity_issued < quantity_total (issuing the last unit succeeds; the next fails)"
    error_id: ERR_OUT_OF_STOCK
    http_status: 422
    applies_to: "POST /volunteer-ops/distribution-records"
  - priority: 13
    category: auth
    check: "Ownership: entity-backed roles act only on own resources (Volunteer on own signups/hour-logs; Captain on own shift's signups/hour-logs/debriefs; GroupLeader on own group)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "confirm, cancel (self), dispute, mark-no-show (captain), verify (captain), debrief create/submit, credit-summary (GroupLeader), PATCH /volunteers/{id} (Volunteer)"

# =============================================================================
# 1.5 API Endpoint Table
# Roles shorthand: ALL = [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/volunteer-ops/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time."
    roles: [EventDirector]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: []

  # --- Event ---
  - method: POST
    path: "/volunteer-ops/events"
    description: "Create an Event in DRAFT"
    roles: [EventDirector]
    code: 201
    input: [name, event_start_at, event_end_at, early_access_opens_at, signup_opens_at, signup_closes_at]
    output: Event
    side_effects: ["status DRAFT; version 1"]
  - method: GET
    path: "/volunteer-ops/events"
    description: "List events"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Event[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/events/{eventId}"
    description: "Get one event"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: PATCH
    path: "/volunteer-ops/events/{eventId}"
    description: "Update event config; OCC via expected_event_version (required); only while DRAFT"
    roles: [EventDirector]
    code: 200
    input: ["name?", "event_start_at?", "event_end_at?", "early_access_opens_at?", "signup_opens_at?", "signup_closes_at?", expected_event_version]
    output: Event
    side_effects: ["increments Event.version by 1"]
  - method: POST
    path: "/volunteer-ops/events/{eventId}/publish"
    description: "DRAFT -> PUBLISHED (readiness invariant)"
    roles: [EventDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> PUBLISHED"]
  - method: POST
    path: "/volunteer-ops/events/{eventId}/lock-signups"
    description: "PUBLISHED -> LOCKED; cascades shifts OPEN|FULL -> LOCKED"
    roles: [EventDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> LOCKED", "shifts OPEN|FULL -> LOCKED"]
  - method: POST
    path: "/volunteer-ops/events/{eventId}/start-race-day"
    description: "LOCKED -> RACE_DAY; requires now >= event_start_at; cascades shifts LOCKED -> IN_PROGRESS"
    roles: [EventDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> RACE_DAY", "shifts LOCKED -> IN_PROGRESS"]
  - method: POST
    path: "/volunteer-ops/events/{eventId}/complete"
    description: "RACE_DAY -> COMPLETED; requires now >= event_end_at and zero CHECKED_IN signups"
    roles: [EventDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> COMPLETED"]
  - method: POST
    path: "/volunteer-ops/events/{eventId}/open-debrief"
    description: "COMPLETED -> DEBRIEF_OPEN"
    roles: [EventDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> DEBRIEF_OPEN"]
  - method: POST
    path: "/volunteer-ops/events/{eventId}/close"
    description: "DEBRIEF_OPEN -> CLOSED; requires all hour logs resolved, no SUBMITTED debriefs, no PROPOSED/APPROVED adjustments, all shifts RECONCILED/CANCELLED"
    roles: [EventDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/volunteer-ops/events/{eventId}/cancel"
    description: "DRAFT|PUBLISHED|LOCKED -> CANCELLED with full cascade (shifts, signups, distributions)"
    roles: [EventDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> CANCELLED", "shifts -> CANCELLED", "non-terminal signups -> CANCELLED", "ISSUED distributions -> REVOKED"]
  - method: POST
    path: "/volunteer-ops/events/{eventId}/run-epoch-sweep"
    description: "Ops-run checkpoint: expires PASSED trainings past valid_until (with cascade), auto-locks PUBLISHED events past signup_closes_at, cancels APPROVED signups past confirm_by_at"
    roles: [EventDirector]
    code: 200
    input: []
    output: { expired_training_record_ids: "string[]", auto_locked: boolean, timed_out_signup_ids: "string[]" }
    side_effects: ["training expiry cascade", "auto-lock", "confirm-timeout cancellations with seat-open handling"]

  # --- CourseSegment ---
  - method: POST
    path: "/volunteer-ops/course-segments"
    description: "Create a course segment; half-open mile range must not overlap any existing segment of the same event"
    roles: [VolunteerCoordinator]
    code: 201
    input: [event_id, segment_code, mile_start, mile_end, terrain_type]
    output: CourseSegment
    side_effects: []
  - method: GET
    path: "/volunteer-ops/course-segments"
    description: "List course segments, filterable by event_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: "CourseSegment[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/course-segments/{segmentId}"
    description: "Get one course segment"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: CourseSegment
    side_effects: []

  # --- RoleCatalogEntry ---
  - method: POST
    path: "/volunteer-ops/role-catalog-entries"
    description: "Create a role catalog entry"
    roles: [VolunteerCoordinator]
    code: 201
    input: [event_id, role_code, title, min_age_years, "required_skill?", "required_training_module?", "credit_weight?"]
    output: RoleCatalogEntry
    side_effects: ["status ACTIVE; defaults applied"]
  - method: GET
    path: "/volunteer-ops/role-catalog-entries"
    description: "List role entries, filterable by event_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: "RoleCatalogEntry[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/role-catalog-entries/{roleEntryId}"
    description: "Get one role entry"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: RoleCatalogEntry
    side_effects: []
  - method: POST
    path: "/volunteer-ops/role-catalog-entries/{roleEntryId}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: RoleCatalogEntry
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/volunteer-ops/role-catalog-entries/{roleEntryId}/reactivate"
    description: "SUSPENDED -> ACTIVE"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: RoleCatalogEntry
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/volunteer-ops/role-catalog-entries/{roleEntryId}/retire"
    description: "ACTIVE|SUSPENDED -> RETIRED; requires zero non-terminal signups on this role's shifts"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: RoleCatalogEntry
    side_effects: ["status -> RETIRED"]

  # --- Shift ---
  - method: POST
    path: "/volunteer-ops/shifts"
    description: "Create a shift on a segment for a role; role must be ACTIVE, all three FKs must share one event"
    roles: [VolunteerCoordinator]
    code: 201
    input: [event_id, role_entry_id, segment_id, start_at, end_at, required_headcount]
    output: Shift
    side_effects: ["status OPEN"]
  - method: GET
    path: "/volunteer-ops/shifts"
    description: "List shifts, filterable by event_id / role_entry_id / segment_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "role_entry_id?", "segment_id?", "limit?", "offset?"]
    output: "Shift[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/shifts/{shiftId}"
    description: "Get one shift (includes computed confirmed_count, checked_in_count, understaffed_alert)"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: Shift
    side_effects: []
  - method: POST
    path: "/volunteer-ops/shifts/{shiftId}/cancel"
    description: "OPEN|FULL -> CANCELLED (manual decommission while event DRAFT|PUBLISHED); cancels non-terminal signups on the shift"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: Shift
    side_effects: ["status -> CANCELLED", "signups REQUESTED|WAITLISTED|APPROVED|CONFIRMED -> CANCELLED"]
  - method: POST
    path: "/volunteer-ops/shifts/{shiftId}/reconcile"
    description: "IN_PROGRESS -> RECONCILED; requires event COMPLETED|DEBRIEF_OPEN and zero CONFIRMED/CHECKED_IN signups"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: Shift
    side_effects: ["status -> RECONCILED"]

  # --- FundraisingGroup ---
  - method: POST
    path: "/volunteer-ops/fundraising-groups"
    description: "Create a fundraising group"
    roles: [EventDirector]
    code: 201
    input: [event_id, name, charity_code]
    output: FundraisingGroup
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/volunteer-ops/fundraising-groups"
    description: "List groups, filterable by event_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: "FundraisingGroup[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/fundraising-groups/{groupId}"
    description: "Get one group"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: FundraisingGroup
    side_effects: []
  - method: GET
    path: "/volunteer-ops/fundraising-groups/{groupId}/credit-summary"
    description: "Computed read: provisional vs settled credit, sponsor match, totals. GroupLeader restricted to own group (X-User-ID == groupId)"
    roles: [GroupLeader, EventDirector]
    code: 200
    input: []
    output: { provisional_effective_hours: number, settled_effective_hours: number, provisional_credit_cents: integer, settled_credit_cents: integer, sponsor_match_cents: integer, total_settled_credit_cents: integer }
    side_effects: []
  - method: POST
    path: "/volunteer-ops/fundraising-groups/{groupId}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [EventDirector]
    code: 200
    input: []
    output: FundraisingGroup
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/volunteer-ops/fundraising-groups/{groupId}/reinstate"
    description: "SUSPENDED -> ACTIVE"
    roles: [EventDirector]
    code: 200
    input: []
    output: FundraisingGroup
    side_effects: ["status -> ACTIVE"]

  # --- Volunteer ---
  - method: POST
    path: "/volunteer-ops/volunteers"
    description: "Register a volunteer (self-service anonymous or coordinator-on-behalf); starts REGISTERED"
    roles: [Anonymous, VolunteerCoordinator]
    code: 201
    input: [event_id, full_name, date_of_birth, "skill_tags?", "group_id?", "float_opt_in?", "is_returning?"]
    output: Volunteer
    side_effects: ["status REGISTERED; age_years_on_event computed; no_show_strikes 0"]
  - method: GET
    path: "/volunteer-ops/volunteers"
    description: "List volunteers, filterable by event_id / group_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "group_id?", "limit?", "offset?"]
    output: "Volunteer[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/volunteers/{volunteerId}"
    description: "Get one volunteer"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: PATCH
    path: "/volunteer-ops/volunteers/{volunteerId}"
    description: "Update mutable profile fields; OCC via expected_volunteer_version (required). Volunteer role restricted to own record"
    roles: [Volunteer, VolunteerCoordinator]
    code: 200
    input: ["skill_tags?", "group_id?", "float_opt_in?", "is_returning?", expected_volunteer_version]
    output: Volunteer
    side_effects: ["increments Volunteer.version by 1; group_id change to a SUSPENDED group -> ERR_GROUP_SUSPENDED"]
  - method: POST
    path: "/volunteer-ops/volunteers/{volunteerId}/screen"
    description: "REGISTERED -> ELIGIBLE; enforces global age floor 14"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["status -> ELIGIBLE"]
  - method: POST
    path: "/volunteer-ops/volunteers/{volunteerId}/reinstate"
    description: "SUSPENDED -> ELIGIBLE; resets no_show_strikes to 0"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["status -> ELIGIBLE", "no_show_strikes = 0"]
  - method: GET
    path: "/volunteer-ops/volunteers/{volunteerId}/recognition-summary"
    description: "Computed read: projected vs official recognition points and tier"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: { projected_points: integer, official_points: integer, recognition_tier: string, captain_shift_count: integer, no_show_count: integer }
    side_effects: []

  # --- TrainingRecord ---
  - method: POST
    path: "/volunteer-ops/training-records"
    description: "Enroll a volunteer in a training module; one record per (volunteer, module)"
    roles: [VolunteerCoordinator]
    code: 201
    input: [event_id, volunteer_id, module_code]
    output: TrainingRecord
    side_effects: ["status ENROLLED; attempt_count 1"]
  - method: GET
    path: "/volunteer-ops/training-records"
    description: "List training records, filterable by event_id / volunteer_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "volunteer_id?", "limit?", "offset?"]
    output: "TrainingRecord[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/training-records/{trainingRecordId}"
    description: "Get one training record"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []
  - method: POST
    path: "/volunteer-ops/training-records/{trainingRecordId}/pass"
    description: "ENROLLED -> PASSED; sets passed_at=now, valid_until=now+module validity"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: ["status -> PASSED"]
  - method: POST
    path: "/volunteer-ops/training-records/{trainingRecordId}/fail"
    description: "ENROLLED -> FAILED"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: ["status -> FAILED"]
  - method: POST
    path: "/volunteer-ops/training-records/{trainingRecordId}/re-enroll"
    description: "FAILED|EXPIRED -> ENROLLED; attempt_count += 1, clears passed_at/valid_until"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: ["status -> ENROLLED", "attempt_count += 1"]

  # --- Signup ---
  - method: POST
    path: "/volunteer-ops/signups"
    description: "Create a signup. Volunteer role restricted to volunteer_id == X-User-ID. Full gauntlet: volunteer ELIGIBLE, event PUBLISHED, shift OPEN|FULL, role ACTIVE, age/skill/training, window, overlap, duplicate. Routes to REQUESTED when a seat is free, WAITLISTED when confirmed_count >= required_headcount."
    roles: [Volunteer, VolunteerCoordinator]
    code: 201
    input: [volunteer_id, shift_id]
    output: Signup
    side_effects: ["status REQUESTED or WAITLISTED by capacity; requested_at = now"]
  - method: GET
    path: "/volunteer-ops/signups"
    description: "List signups, filterable by event_id / volunteer_id / shift_id / status / replaces_signup_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "volunteer_id?", "shift_id?", "status?", "replaces_signup_id?", "limit?", "offset?"]
    output: "Signup[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/signups/{signupId}"
    description: "Get one signup"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: Signup
    side_effects: []
  - method: POST
    path: "/volunteer-ops/signups/{signupId}/approve"
    description: "REQUESTED -> APPROVED; re-runs safety/overlap gauntlet and capacity check"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> APPROVED", "approved_at/confirm_by_at set", "shift count recompute; OPEN -> FULL at headcount"]
  - method: POST
    path: "/volunteer-ops/signups/{signupId}/confirm"
    description: "APPROVED -> CONFIRMED; volunteer self only, by confirm_by_at"
    roles: [Volunteer]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> CONFIRMED", "confirmed_at = now"]
  - method: POST
    path: "/volunteer-ops/signups/{signupId}/cancel"
    description: "REQUESTED|WAITLISTED|APPROVED|CONFIRMED -> CANCELLED; frees seat and fires seat-open handling; revokes ISSUED distributions"
    roles: [Volunteer, VolunteerCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> CANCELLED", "seat-open handling (waitlist promotion pre-race-day; float backfill on race day)"]
  - method: POST
    path: "/volunteer-ops/signups/{signupId}/check-in"
    description: "CONFIRMED -> CHECKED_IN within [shift.start_at - 60min, shift.end_at] on RACE_DAY; auto-issues credential"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> CHECKED_IN", "creates DistributionRecord kind=CREDENTIAL status=ISSUED", "checked_in_count recompute"]
  - method: POST
    path: "/volunteer-ops/signups/{signupId}/check-out"
    description: "CHECKED_IN -> COMPLETED; creates HourLog with computed raw_minutes/claimed_hours/credited_hours"
    roles: [VolunteerCoordinator]
    code: 200
    input: ["break_minutes?"]
    output: Signup
    side_effects: ["status -> COMPLETED", "creates HourLog PENDING_VERIFICATION"]
  - method: POST
    path: "/volunteer-ops/signups/{signupId}/mark-no-show"
    description: "CONFIRMED -> NO_SHOW after start+30min grace; fires strike/suspension/backfill cascade"
    roles: [Captain, VolunteerCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> NO_SHOW", "no_show_strikes += 1", "strikes >= 2 -> volunteer SUSPENDED with cancellation cascade", "seat-open handling"]
  - method: POST
    path: "/volunteer-ops/signups/{signupId}/assign-captain"
    description: "Mark this signup as the shift captain; signup CONFIRMED, volunteer holds current CAPTAIN_COURSE, shift has no other captain"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["is_captain = true"]
  - method: POST
    path: "/volunteer-ops/signups/{signupId}/remove-captain"
    description: "Clear the captain flag on a signup"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["is_captain = false"]

  # --- SupplyInventory ---
  - method: POST
    path: "/volunteer-ops/supply-inventories"
    description: "Create a supply inventory item"
    roles: [VolunteerCoordinator]
    code: 201
    input: [event_id, item_code, "description?", quantity_total]
    output: SupplyInventory
    side_effects: ["quantity_issued = 0"]
  - method: GET
    path: "/volunteer-ops/supply-inventories"
    description: "List supply inventories, filterable by event_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: "SupplyInventory[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/supply-inventories/{inventoryId}"
    description: "Get one inventory item (includes computed quantity_issued)"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: SupplyInventory
    side_effects: []

  # --- DistributionRecord ---
  - method: POST
    path: "/volunteer-ops/distribution-records"
    description: "Issue a credential or supply item to a CHECKED_IN signup. CREDENTIAL: inventory_id must be null, one ISSUED credential per signup. SUPPLY_ITEM: inventory_id required, stock decrement."
    roles: [VolunteerCoordinator]
    code: 201
    input: [signup_id, kind, "inventory_id?"]
    output: DistributionRecord
    side_effects: ["status ISSUED; SUPPLY_ITEM: inventory.quantity_issued recompute (increment)"]
  - method: GET
    path: "/volunteer-ops/distribution-records"
    description: "List distribution records, filterable by event_id / signup_id / inventory_id / kind"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "signup_id?", "inventory_id?", "kind?", "limit?", "offset?"]
    output: "DistributionRecord[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/distribution-records/{distributionId}"
    description: "Get one distribution record"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: DistributionRecord
    side_effects: []
  - method: POST
    path: "/volunteer-ops/distribution-records/{distributionId}/return"
    description: "ISSUED -> RETURNED (SUPPLY_ITEM only); restores stock"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: DistributionRecord
    side_effects: ["status -> RETURNED", "inventory.quantity_issued recompute (decrement)"]
  - method: POST
    path: "/volunteer-ops/distribution-records/{distributionId}/revoke"
    description: "ISSUED -> REVOKED; restores stock for SUPPLY_ITEM"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: DistributionRecord
    side_effects: ["status -> REVOKED", "inventory.quantity_issued recompute (decrement)"]

  # --- HourLog ---
  - method: GET
    path: "/volunteer-ops/hour-logs"
    description: "List hour logs, filterable by event_id / signup_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "signup_id?", "limit?", "offset?"]
    output: "HourLog[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/hour-logs/{hourLogId}"
    description: "Get one hour log"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: HourLog
    side_effects: []
  - method: POST
    path: "/volunteer-ops/hour-logs/{hourLogId}/verify"
    description: "PENDING_VERIFICATION|DISPUTED -> VERIFIED; captain of the log's shift or coordinator"
    roles: [Captain, VolunteerCoordinator]
    code: 200
    input: []
    output: HourLog
    side_effects: ["status -> VERIFIED", "verified_by_role set", "settled credit recompute"]
  - method: POST
    path: "/volunteer-ops/hour-logs/{hourLogId}/dispute"
    description: "PENDING_VERIFICATION -> DISPUTED; the log's volunteer, their GroupLeader, or coordinator"
    roles: [Volunteer, GroupLeader, VolunteerCoordinator]
    code: 200
    input: []
    output: HourLog
    side_effects: ["status -> DISPUTED"]
  - method: POST
    path: "/volunteer-ops/hour-logs/{hourLogId}/reject"
    description: "PENDING_VERIFICATION -> REJECTED; excluded from all credit variants"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: HourLog
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/volunteer-ops/hour-logs/{hourLogId}/adjust"
    description: "Adjust break_minutes while PENDING_VERIFICATION; recomputes raw_minutes/claimed_hours/credited_hours"
    roles: [VolunteerCoordinator]
    code: 200
    input: [break_minutes]
    output: HourLog
    side_effects: ["raw_minutes, claimed_hours, credited_hours recomputed"]

  # --- DebriefReport ---
  - method: POST
    path: "/volunteer-ops/debrief-reports"
    description: "Create a DRAFT debrief for a shift; author must be Captain of that shift (X-User-ID == author_volunteer_id and captain signup on shift_id)"
    roles: [Captain]
    code: 201
    input: [event_id, shift_id, author_volunteer_id, headcount_actual, role_effectiveness_rating, "supply_shortage_flag?", "notes?"]
    output: DebriefReport
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/volunteer-ops/debrief-reports"
    description: "List debriefs, filterable by event_id / shift_id / author_volunteer_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "shift_id?", "author_volunteer_id?", "limit?", "offset?"]
    output: "DebriefReport[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/debrief-reports/{debriefId}"
    description: "Get one debrief"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: DebriefReport
    side_effects: []
  - method: POST
    path: "/volunteer-ops/debrief-reports/{debriefId}/submit"
    description: "DRAFT -> SUBMITTED by the authoring captain; requires Event DEBRIEF_OPEN"
    roles: [Captain]
    code: 200
    input: []
    output: DebriefReport
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/volunteer-ops/debrief-reports/{debriefId}/acknowledge"
    description: "SUBMITTED -> ACKNOWLEDGED"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: DebriefReport
    side_effects: ["status -> ACKNOWLEDGED"]

  # --- RoleAdjustment ---
  - method: POST
    path: "/volunteer-ops/role-adjustments"
    description: "Propose a role adjustment citing a debrief (SUBMITTED or ACKNOWLEDGED); event must be DEBRIEF_OPEN"
    roles: [VolunteerCoordinator]
    code: 201
    input: [event_id, role_entry_id, debrief_report_id, "proposed_min_age_years?", "proposed_required_skill?", "proposed_credit_weight?", "proposed_retire?"]
    output: RoleAdjustment
    side_effects: ["status PROPOSED"]
  - method: GET
    path: "/volunteer-ops/role-adjustments"
    description: "List role adjustments, filterable by event_id / role_entry_id / debrief_report_id"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: ["event_id?", "role_entry_id?", "debrief_report_id?", "limit?", "offset?"]
    output: "RoleAdjustment[]"
    side_effects: []
  - method: GET
    path: "/volunteer-ops/role-adjustments/{adjustmentId}"
    description: "Get one role adjustment"
    roles: [Anonymous, Volunteer, Captain, GroupLeader, VolunteerCoordinator, EventDirector]
    code: 200
    input: []
    output: RoleAdjustment
    side_effects: []
  - method: POST
    path: "/volunteer-ops/role-adjustments/{adjustmentId}/approve"
    description: "PROPOSED -> APPROVED; event DEBRIEF_OPEN and debrief ACKNOWLEDGED"
    roles: [EventDirector]
    code: 200
    input: []
    output: RoleAdjustment
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/volunteer-ops/role-adjustments/{adjustmentId}/reject"
    description: "PROPOSED -> REJECTED; event DEBRIEF_OPEN"
    roles: [EventDirector]
    code: 200
    input: []
    output: RoleAdjustment
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/volunteer-ops/role-adjustments/{adjustmentId}/apply"
    description: "APPROVED -> APPLIED; OCC via expected_role_version (required); applies proposed fields to the role and bumps its version"
    roles: [VolunteerCoordinator]
    code: 200
    input: [expected_role_version]
    output: RoleAdjustment
    side_effects: ["status -> APPLIED", "applies proposed_* fields to RoleCatalogEntry (proposed_retire -> RETIRED)", "increments RoleCatalogEntry.version by 1", "applied_at = now", "forward-looking only: existing signups NOT re-validated"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource (volunteer self, captain-of-shift, group-leader-of-group)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum value, end <= start, negative quantities, inventory_id/kind mismatch" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "eventId does not exist" }
  - { id: ERR_SEGMENT_NOT_FOUND, http: 404, condition: "segmentId does not exist" }
  - { id: ERR_ROLE_ENTRY_NOT_FOUND, http: 404, condition: "roleEntryId does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "shiftId does not exist" }
  - { id: ERR_GROUP_NOT_FOUND, http: 404, condition: "groupId does not exist" }
  - { id: ERR_VOLUNTEER_NOT_FOUND, http: 404, condition: "volunteerId does not exist" }
  - { id: ERR_TRAINING_RECORD_NOT_FOUND, http: 404, condition: "trainingRecordId does not exist" }
  - { id: ERR_SIGNUP_NOT_FOUND, http: 404, condition: "signupId does not exist" }
  - { id: ERR_INVENTORY_NOT_FOUND, http: 404, condition: "inventoryId does not exist" }
  - { id: ERR_DISTRIBUTION_NOT_FOUND, http: 404, condition: "distributionId does not exist" }
  - { id: ERR_HOUR_LOG_NOT_FOUND, http: 404, condition: "hourLogId does not exist" }
  - { id: ERR_DEBRIEF_NOT_FOUND, http: 404, condition: "debriefId does not exist" }
  - { id: ERR_ADJUSTMENT_NOT_FOUND, http: 404, condition: "adjustmentId does not exist" }
  - { id: ERR_INVALID_EVENT_STATE, http: 409, condition: "Event transition or event-gated operation not allowed from the event's current status" }
  - { id: ERR_EVENT_NOT_PUBLISHED, http: 409, condition: "Signup create/approve requires Event PUBLISHED" }
  - { id: ERR_EVENT_READINESS_INCOMPLETE, http: 409, condition: "Publish requires >= 1 ACTIVE role, >= 1 segment, >= 1 shift" }
  - { id: ERR_EVENT_NOT_YET_STARTED, http: 409, condition: "start-race-day before event_start_at" }
  - { id: ERR_EVENT_NOT_YET_ENDED, http: 409, condition: "complete before event_end_at" }
  - { id: ERR_SIGNUPS_STILL_ON_COURSE, http: 409, condition: "complete while any signup is CHECKED_IN" }
  - { id: ERR_EVENT_CLOSE_BLOCKED, http: 409, condition: "close with unresolved hour logs / submitted debriefs / open adjustments / unreconciled shifts" }
  - { id: ERR_SHIFT_NOT_OPEN, http: 409, condition: "Signup create/approve against a LOCKED, IN_PROGRESS, RECONCILED or CANCELLED shift" }
  - { id: ERR_SHIFT_CAPACITY_REACHED, http: 409, condition: "Approve when confirmed_count >= required_headcount" }
  - { id: ERR_SHIFT_HAS_UNRESOLVED_SIGNUPS, http: 409, condition: "reconcile with CONFIRMED or CHECKED_IN signups remaining" }
  - { id: ERR_SHIFT_TIME_OVERLAP, http: 409, condition: "Volunteer holds an APPROVED/CONFIRMED signup overlapping under buffer semantics" }
  - { id: ERR_SEGMENT_MILE_OVERLAP, http: 409, condition: "New segment's half-open mile range intersects an existing segment of the same event" }
  - { id: ERR_MIN_AGE_NOT_MET, http: 422, condition: "age_years_on_event below role.min_age_years (signup) or below 14 (screen)" }
  - { id: ERR_REQUIRED_SKILL_MISSING, http: 422, condition: "role.required_skill absent from volunteer.skill_tags" }
  - { id: ERR_TRAINING_NOT_CURRENT, http: 422, condition: "Required module has no PASSED, unexpired TrainingRecord (also used for captain assignment)" }
  - { id: ERR_SIGNUP_WINDOW_CLOSED, http: 422, condition: "Signup create before early_access_opens_at or at/after signup_closes_at" }
  - { id: ERR_EARLY_ACCESS_RESTRICTED, http: 422, condition: "During early-access window, volunteer.is_returning must be true" }
  - { id: ERR_CHECKIN_WINDOW_INVALID, http: 422, condition: "check-in outside [shift.start_at - 60min, shift.end_at]" }
  - { id: ERR_CONFIRM_DEADLINE_PASSED, http: 422, condition: "confirm after confirm_by_at" }
  - { id: ERR_NO_SHOW_GRACE_NOT_PASSED, http: 422, condition: "mark-no-show before shift.start_at + 30min" }
  - { id: ERR_DUPLICATE_SIGNUP, http: 409, condition: "Volunteer already holds a non-terminal signup (REQUESTED|WAITLISTED|APPROVED|CONFIRMED|CHECKED_IN) on the same shift" }
  - { id: ERR_DUPLICATE_TRAINING_RECORD, http: 409, condition: "A TrainingRecord already exists for (volunteer, module); use re-enroll" }
  - { id: ERR_CAPTAIN_SLOT_TAKEN, http: 409, condition: "Shift already has a signup with is_captain == true" }
  - { id: ERR_CREDENTIAL_ALREADY_ISSUED, http: 409, condition: "Signup already has a CREDENTIAL distribution in ISSUED status" }
  - { id: ERR_OUT_OF_STOCK, http: 422, condition: "SUPPLY_ITEM issue when quantity_issued >= quantity_total" }
  - { id: ERR_SIGNUP_NOT_APPROVABLE, http: 409, condition: "approve requires signup REQUESTED" }
  - { id: ERR_SIGNUP_NOT_CONFIRMABLE, http: 409, condition: "confirm requires signup APPROVED" }
  - { id: ERR_SIGNUP_NOT_CANCELLABLE, http: 409, condition: "cancel from CHECKED_IN|COMPLETED|NO_SHOW|CANCELLED, or self-cancel of CONFIRMED during RACE_DAY" }
  - { id: ERR_SIGNUP_NOT_CHECKINABLE, http: 409, condition: "check-in requires signup CONFIRMED" }
  - { id: ERR_SIGNUP_NOT_CHECKED_OUTABLE, http: 409, condition: "check-out requires signup CHECKED_IN" }
  - { id: ERR_SIGNUP_NOT_NO_SHOWABLE, http: 409, condition: "mark-no-show requires signup CONFIRMED" }
  - { id: ERR_SIGNUP_NOT_CHECKED_IN, http: 409, condition: "distribution requires signup CHECKED_IN" }
  - { id: ERR_VOLUNTEER_NOT_ELIGIBLE, http: 409, condition: "Signup create/approve requires volunteer ELIGIBLE" }
  - { id: ERR_VOLUNTEER_NOT_SCREENABLE, http: 409, condition: "screen requires volunteer REGISTERED" }
  - { id: ERR_VOLUNTEER_NOT_SUSPENDED, http: 409, condition: "reinstate requires volunteer SUSPENDED" }
  - { id: ERR_TRAINING_INVALID_STATE, http: 409, condition: "pass/fail require ENROLLED; re-enroll requires FAILED|EXPIRED" }
  - { id: ERR_ROLE_ENTRY_INVALID_STATE, http: 409, condition: "suspend/reactivate/retire state precondition violated" }
  - { id: ERR_ROLE_ENTRY_NOT_ACTIVE, http: 409, condition: "Signup or shift creation against a SUSPENDED or RETIRED role" }
  - { id: ERR_ROLE_IN_USE, http: 409, condition: "retire/apply-with-retire while non-terminal signups exist on the role's shifts" }
  - { id: ERR_GROUP_INVALID_STATE, http: 409, condition: "suspend/reinstate state precondition violated" }
  - { id: ERR_GROUP_SUSPENDED, http: 409, condition: "Affiliation change to a SUSPENDED fundraising group" }
  - { id: ERR_HOUR_LOG_INVALID_STATE, http: 409, condition: "verify/dispute/reject/adjust against an hour log in a disallowed status" }
  - { id: ERR_DISTRIBUTION_INVALID_STATE, http: 409, condition: "return/revoke against a non-ISSUED record, or return of a CREDENTIAL" }
  - { id: ERR_DEBRIEF_INVALID_STATE, http: 409, condition: "submit requires DRAFT; acknowledge requires SUBMITTED" }
  - { id: ERR_DEBRIEF_NOT_ACKNOWLEDGED, http: 409, condition: "adjustment approve requires the cited debrief ACKNOWLEDGED" }
  - { id: ERR_ADJUSTMENT_INVALID_STATE, http: 409, condition: "approve/reject require PROPOSED; apply requires APPROVED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; may self-register as a volunteer and read public resources"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-ops/volunteers (self-registration; shares endpoint with VolunteerCoordinator)"
    shared_operations:
      - "All GET list/single endpoints; recognition-summary"
  - name: Volunteer
    description: "A registered volunteer acting on their own records (X-User-ID == Volunteer.id)"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /volunteer-ops/signups/{id}/confirm (own signup only)"
    shared_operations:
      - "POST /volunteer-ops/signups (volunteer_id must equal X-User-ID)"
      - "POST /volunteer-ops/signups/{id}/cancel (own signup only; coordinator may cancel any)"
      - "PATCH /volunteer-ops/volunteers/{id} (own record only; coordinator unrestricted)"
      - "POST /volunteer-ops/hour-logs/{id}/dispute (own hour logs)"
      - "All GET endpoints"
  - name: Captain
    description: "A volunteer designated as shift captain (is_captain=true Signup); acts on own shift's records (X-User-ID == Volunteer.id of the captain signup)"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /volunteer-ops/debrief-reports and /submit (author must be captain of the shift)"
    shared_operations:
      - "POST /volunteer-ops/signups/{id}/mark-no-show (own shift only; coordinator unrestricted)"
      - "POST /volunteer-ops/hour-logs/{id}/verify (own shift only; coordinator unrestricted)"
      - "All GET endpoints"
  - name: GroupLeader
    description: "Fundraising group representative (X-User-ID == FundraisingGroup.id)"
    identity: "entity_backed:FundraisingGroup"
    exclusive_operations: []
    shared_operations:
      - "GET /volunteer-ops/fundraising-groups/{id}/credit-summary (own group only; EventDirector unrestricted)"
      - "POST /volunteer-ops/hour-logs/{id}/dispute (hour logs of own group's volunteers)"
      - "All GET endpoints"
  - name: VolunteerCoordinator
