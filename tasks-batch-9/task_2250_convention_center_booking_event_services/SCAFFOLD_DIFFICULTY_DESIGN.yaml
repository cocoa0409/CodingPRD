scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: actual_usage_rental_basis_diverges_from_contracted_rental_on_same_booking
        grounds:
          - calculations.settlement_rental_basis
          - calculations.contracted_rental_charge
          - entities.EventSettlement.fields.basis
          - entities.SpaceUsageRecord.fields.usage_kind
          - validations[priority=93]
        distinguishing_aspect: |
          This dual-variant pair lives in the rental-accounting domain of EventBooking and
          SpaceUsageRecord: the same booking priced under basis ACTUAL_USAGE yields a RENTAL
          basis of 204526 cents while its contracted_rental_cents is 363600 cents.
        test_recipe:
          setup:
            - "CONSUMER_SHOW policy window published with rental_discount_pct 0.0"
            - "Meeting Room 301 has daily_base_rate_cents 90900"
            - "booking runs move-in 2027-03-01, show 2027-03-02 to 2027-03-04, move-out 2027-03-05, so contracted_rental_cents is 363600 and deposit_required_cents is 90900"
            - "five SpaceUsageRecord rows attest MOVE_IN, SHOW, DARK, DARK, MOVE_OUT"
            - "booking is CLOSED and an EventSettlement with basis ACTUAL_USAGE carries a single RENTAL line of 204526"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
              captures: { pw_cs_id: $.data.id }
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients/${cl_ssp_id}/deposits"
              payload: { amount_cents: 200000 }
              as: VenueAdmin
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
            - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_id}/license"
              payload: {}
              as: SalesManager
              captures: { lic_id: $.data.id }
            - call: "POST /convention-center/licenses/${lic_id}/issue"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/licenses/${lic_id}/countersign"
              payload: {}
              as: Licensee
              as_user_id: "${cl_ssp_id}"
            - call: "POST /convention-center/bookings/${bk_id}/confirm-definite"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T08:00:00Z" }
              as: VenueAdmin
            - call: "POST /convention-center/bookings/${bk_id}/open-show"
              payload: {}
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/usage-records"
              payload: { usage_date: "2027-03-01", usage_kind: "MOVE_IN" }
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/usage-records"
              payload: { usage_date: "2027-03-02", usage_kind: "SHOW" }
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/usage-records"
              payload: { usage_date: "2027-03-03", usage_kind: "DARK" }
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/usage-records"
              payload: { usage_date: "2027-03-04", usage_kind: "DARK" }
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/usage-records"
              payload: { usage_date: "2027-03-05", usage_kind: "MOVE_OUT" }
              as: EventServicesManager
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-06T09:00:00Z" }
              as: VenueAdmin
            - call: "POST /convention-center/bookings/${bk_id}/close"
              payload: {}
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/settlement"
              payload: { basis: "ACTUAL_USAGE" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { set_id: $.data.id }
            - call: "POST /convention-center/settlement-line-items"
              payload: { settlement_id: "${set_id}", line_kind: "RENTAL", amount_cents: 204526, memo: "actual usage rental" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /convention-center/settlements/${set_id}/issue"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
          assert:
            - "EventSettlement.${set_id}.line_subtotal_cents == 204526"
            - "EventSettlement.${set_id}.facility_service_fee_cents == 18407"
            - "EventSettlement.${set_id}.grand_total_cents == 222933"
            - "EventBooking.${bk_id}.contracted_rental_cents == 363600"
            - "EventBooking.${bk_id}.gross_rental_cents == 363600"
            - "EventSettlement.${set_id}.line_subtotal_cents != EventBooking.${bk_id}.contracted_rental_cents"

      - name: actualized_union_labor_charge_diverges_from_scheduled_estimate
        grounds:
          - calculations.union_labor_charge
          - state_machines.LaborCall.DISPATCHED_to_ACTUALIZED
          - entities.LaborCall.fields.estimated_charge_cents
          - entities.LaborCall.fields.actual_charge_cents
          - entities.UnionJurisdiction.fields.st_window_start_hour
        distinguishing_aspect: |
          This dual-variant pair lives in the union-labor domain of LaborCall and
          UnionJurisdiction, a different entity domain from the rental-accounting pair:
          the SCHEDULED_ESTIMATE variant bills 4.5 hours per member entirely at straight
          time for 128696 cents, while ACTUALIZED splits 6.5 hours at the 08:00 window edge
          and bills 214493 cents.
        test_recipe:
          setup:
            - "SEIU Local 3 covers CLEANING at straight_time_rate_cents 9533, overtime_multiplier 1.5, min_call_hours 4, straight-time window 08:00 to 17:00, max_crew_hours_per_day 40"
            - "the Meeting Room 301 booking is IN_HOUSE at logical clock 2027-03-01T08:00:00Z"
            - "a LaborCall for 3 crew scheduled 06:00 to 10:30 on 2027-03-01 has estimated_charge_cents 128696 and billed_hours 13.5"
            - "the call has been dispatched"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/union-jurisdictions"
              payload: { craft_name: "SEIU Local 3", covered_category: "CLEANING", straight_time_rate_cents: 9533, max_crew_hours_per_day: 40, overtime_multiplier: 1.5, min_call_hours: 4, st_window_start_hour: 8, st_window_end_hour: 17 }
              as: VenueAdmin
              captures: { uj_clean_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients/${cl_ssp_id}/deposits"
              payload: { amount_cents: 200000 }
              as: VenueAdmin
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
            - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_id}/license"
              payload: {}
              as: SalesManager
              captures: { lic_id: $.data.id }
            - call: "POST /convention-center/licenses/${lic_id}/issue"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/licenses/${lic_id}/countersign"
              payload: {}
              as: Licensee
              as_user_id: "${cl_ssp_id}"
            - call: "POST /convention-center/bookings/${bk_id}/confirm-definite"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T08:00:00Z" }
              as: VenueAdmin
            - call: "POST /convention-center/bookings/${bk_id}/open-show"
              payload: {}
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/labor-calls"
              payload: { jurisdiction_id: "${uj_clean_id}", work_category: "CLEANING", work_date: "2027-03-01", scheduled_start_hour: 6.0, scheduled_end_hour: 10.5, crew_size: 3 }
              as: EventServicesManager
              captures: { lc_id: $.data.id }
            - call: "POST /convention-center/labor-calls/${lc_id}/dispatch"
              payload: {}
              as: EventServicesManager
          trigger:
            - call: "POST /convention-center/labor-calls/${lc_id}/actualize"
              payload: { actual_start_hour: 6.0, actual_end_hour: 12.5 }
              as: EventServicesManager
          assert:
            - "LaborCall.${lc_id}.estimated_charge_cents == 128696"
            - "LaborCall.${lc_id}.actual_charge_cents == 214493"
            - "LaborCall.${lc_id}.status == ACTUALIZED"
            - "LaborCall.${lc_id}.billed_hours == 19.5"
            - "UnionJurisdiction.${uj_clean_id}.committed_crew_hours == 19.5"

  - rule_id: combinatorial_formula
    instances:
      - name: utilities_service_order_surcharge_cap_binds_over_marginal_tier_stack
        grounds:
          - calculations.service_order_charge
          - entities.ServiceOrder.fields.order_timing
          - entities.Vendor.fields.vendor_tier
          - state_machines.ServiceOrder.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          Mode (a) nested min/max over a marginal tier stack. A 500-amp utilities order
          straddles all three UTILITIES breakpoints (100 at 1200, 300 at 900, 100 at 700 =
          460000), then the LATE 1.35 timing factor and the OPEN 1.25 vendor multiplier
          compose to 1.6875 which the SURCHARGE_CAP clamps to 1.40, giving 644000 and not
          the uncapped 776250; the MIN_ORDER_CENTS floor inside the same max() is inert here.
        test_recipe:
          setup:
            - "no EXCLUSIVE utilities vendor exists, so Volt Open Utilities (vendor_tier OPEN, coi_expiry_date 2030-01-01) is a legal choice"
            - "the Meeting Room 301 CONSUMER_SHOW booking is IN_HOUSE and the logical clock is 2027-03-01T08:00:00Z, which is inside ADVANCE_CUTOFF_DAYS of show_start_date 2027-03-02, so order_timing is LATE"
            - "a ServiceOrder for service_category UTILITIES with ordered_quantity 500 is PENDING_APPROVAL"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/vendors"
              payload: { legal_name: "Volt Open Utilities", service_category: "UTILITIES", vendor_tier: "OPEN", coi_expiry_date: "2030-01-01" }
              as: VenueAdmin
              captures: { ven_util_open_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients/${cl_ssp_id}/deposits"
              payload: { amount_cents: 200000 }
              as: VenueAdmin
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
            - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_id}/license"
              payload: {}
              as: SalesManager
              captures: { lic_id: $.data.id }
            - call: "POST /convention-center/licenses/${lic_id}/issue"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/licenses/${lic_id}/countersign"
              payload: {}
              as: Licensee
              as_user_id: "${cl_ssp_id}"
            - call: "POST /convention-center/bookings/${bk_id}/confirm-definite"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T08:00:00Z" }
              as: VenueAdmin
            - call: "POST /convention-center/bookings/${bk_id}/open-show"
              payload: {}
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/service-orders"
              payload: { vendor_id: "${ven_util_open_id}", service_category: "UTILITIES", ordered_quantity: 500 }
              as: EventServicesManager
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /convention-center/service-orders/${so_id}/approve"
              payload: {}
              as: EventServicesManager
          assert:
            - "ServiceOrder.${so_id}.estimated_charge_cents == 644000"
            - "ServiceOrder.${so_id}.approval_status == APPROVED"
            - "ServiceOrder.${so_id}.billing_status == ESTIMATED"
            - "ServiceOrder.${so_id}.order_timing == LATE"
            - "ServiceOrder.${so_id}.estimated_charge_cents != 776250"

      - name: sum_then_round_actual_usage_rental_line_rejected_at_one_cent_below
        grounds:
          - calculations.settlement_rental_basis
          - validations[priority=93]
          - errors.ERR_RENTAL_LINE_MISMATCH
          - entities.SpaceUsageRecord.fields.usage_kind
        distinguishing_aspect: |
          Mode (b) rounding-order sensitivity. Two DARK days at 90900 * 0.125 = 11362.5 each
          round up to 11363 apiece under the pinned round-per-day-then-sum order, giving
          204526; summing the unrounded products first and rounding once gives 204525. A
          RENTAL line of 204525 is therefore rejected, which is only true if the per-day
          rounding order is honoured.
        test_recipe:
          setup:
            - "Meeting Room 301 has daily_base_rate_cents 90900 and the CONSUMER_SHOW window has rental_discount_pct 0.0"
            - "the booking is CLOSED with five SpaceUsageRecord rows MOVE_IN, SHOW, DARK, DARK, MOVE_OUT"
            - "an EventSettlement with basis ACTUAL_USAGE is DRAFT"
