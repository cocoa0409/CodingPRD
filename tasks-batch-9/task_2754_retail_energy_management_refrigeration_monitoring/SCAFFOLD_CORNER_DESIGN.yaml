      - name: dr_event_parallel_dimensions_advance_independently
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: "non_linear_state_machine / dr_event_parallel_state_dimensions"
          rationale: |
            The PARALLEL shape row of the state-machine guide (independent state
            dimensions change independently; combined state correct) is exactly
            what that difficulty instance drives: it walks event_state
            SCHEDULED -> NOTIFIED -> ACTIVE -> COMPLETED while settlement_state
            stays PENDING, then advances settlement_state PENDING -> SETTLED ->
            REVERSED with event_state pinned at COMPLETED, asserting the
            combined pair after every call. A corner instance could only repeat
            a prefix of that walk.

      - name: excursion_cycles_from_acknowledged_back_to_open
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: "non_linear_state_machine / excursion_acknowledge_rebreach_cycle"
          rationale: |
            The CYCLIC shape row (entity can loop back; loop count or
            termination condition respected) is carried by that difficulty
            instance, which acknowledges an excursion, re-breaches it back to
            OPEN, acknowledges it again and asserts acknowledged_by_user_id and
            exposure_minutes across the loop before escalation terminates the
            cycle. The second cyclic dimension, Store.bms_status
            ACTIVE -> DEGRADED -> COMMISSIONING -> ACTIVE, is covered by
            store_bms_status_degrade_recommission_cycle.

  # ===========================================================================
  - section: calculations
    instances:

      - name: bill_recompute_applies_ratchet_floor_and_surcharge_excess
        claim_type: constants_applied
        grounds: "§1.3 calculations.period_peak_demand (RATCHET_FLOOR_FRACTION 0.8, steps 5-6, variant coincident_peak) and calculations.bill_recompute_total (RIDER_RATE 0.0375, SURCHARGE_THRESHOLD_USD 20000.0, SURCHARGE_RATE 0.015, BILL_VARIANCE_TOLERANCE_PCT 2.0); §1.2 bill_recompute_validated; §1.5 POST /energy-ops/utility-bills/{id}/recompute"
        distinguishing_aspect: |
          Every declared constant of the pricing chain is load-bearing in ONE
          recompute: the ratchet floor (0.8 x 1500.0 = 1200.0) beats the observed
          on-peak peak of 900.0 and becomes billable_demand_kw; the rider is
          charged on the base subtotal only; the surcharge is charged on the
          EXCESS above 20000.00 rather than on the whole subtotal (a
          whole-subtotal surcharge would give 555.58 instead of 255.58); and the
          off-peak interval of 1100.0 kW must be ignored because the account is
          TOU_DEMAND, not FLAT_DEMAND.
        test_recipe:
          setup: |
            store; TOU_DEMAND account with rate_on_peak 0.1450, rate_off_peak
            0.0800, demand_charge_per_kw 14.50 and ratchet_peak_kw 1500.0; three
            intervals inside the bill period - on-peak 900.0, on-peak 850.0 and
            off-peak 1100.0; one RECEIVED bill for 2026-06-01..2026-07-01 whose
            billed_amount_usd equals the exact recomputed total.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-RT", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, ratchet_peak_kw: 1500.0 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 900.0, is_on_peak: true }, { interval_start_iso: "2026-06-16T14:00:00Z", kw_demand: 850.0, is_on_peak: true }, { interval_start_iso: "2026-06-16T02:00:00Z", kw_demand: 1100.0, is_on_peak: false } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 60000, off_peak_kwh: 120000, billed_kwh: 180000, billed_peak_kw: 900.0, billed_amount_usd: 37294.33 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id" }
          trigger:
            call: "POST /energy-ops/utility-bills/${bill_id}/recompute"
            payload: {}
            as: EnergyAnalyst
            as_user_id: "u_analyst_rt"
          assert: |
            200. peak_basis == "COINCIDENT_PEAK";
            billable_demand_kw == 1200.0 (ratchet floor round(0.8 * 1500.0, 1),
            NOT the observed 900.0 and NOT the off-peak 1100.0);
            recomputed_energy_cost_usd == 18300.00
              (60000 * 0.1450 = 8700.00 plus 120000 * 0.0800 = 9600.00);
            recomputed_demand_cost_usd == 17400.00 (1200.0 * 14.50);
            recomputed_rider_cost_usd == 1338.75 (0.0375 * 35700.00);
            recomputed_surcharge_usd == 255.58
              (0.015 * (37038.75 - 20000.00) = 255.58125 -> 255.58);
            recomputed_amount_usd == 37294.33;
            variance_pct == 0.00; validation_state == "VALIDATED";
            recomputed_by_user_id == "u_analyst_rt".
            The three DemandInterval rows are untouched and no new interval was
            created.

      - name: benchmark_eui_percentile_and_per_store_outlier_threshold
        claim_type: correct_result
        grounds: "§1.3 calculations.store_eui_benchmark (KWH_TO_KBTU 3.412, OUTLIER_MEDIAN_MULTIPLE 1.3, steps 1-8) and its input_set (VALIDATED|ADJUSTED bills inside TRAILING_WINDOW_DAYS); §1.5 GET /energy-ops/benchmark-report (notes: peer_median_eui and outlier_threshold_eui are per store because the median excludes the subject)"
        distinguishing_aspect: |
          A four-store peer group whose EUIs are 7.68 / 8.53 / 30.71 / 11.09, so
          the LEAVE-ONE-OUT median differs per store (8.53 for the two high
          stores, 11.09 for the two low ones) and the group-level
          peer_group_median_eui (9.81, the even-count mean of 8.53 and 11.09) is
          a fourth, different number. The borderline store sits EXACTLY on its
          own threshold (11.09 >= 1.3 x 8.53 = 11.09), so the inclusive
          comparison of step 7 decides its flag; an implementation that reuses one
          group median for every store, or that compares strictly, reports a
          different outlier_count.
        test_recipe:
          setup: |
            four 40000 sqft MIXED/SUPERCENTER stores, each with one TOU_DEMAND
            account (0.1450 / 0.0800 / 14.50, ratchet 0.0), one on-peak interval
            and one bill for 2026-06-01..2026-07-01 recomputed to VALIDATED
            (billed_amount_usd is set equal to the exact recomputed total, so
            variance_pct is 0.00 in every case):
              BM1 on 36000 / off 54000 / billed 90000  / peak 300.0  -> 14410.88, eui 7.68
              BM2 on 40000 / off 60000 / billed 100000 / peak 330.0  -> 15961.94, eui 8.53
              BM3 on 144000/ off 216000/ billed 360000 / peak 1200.0 -> 58208.15, eui 30.71
              BM4 on 52000 / off 78000 / billed 130000 / peak 420.0  -> 20624.36, eui 11.09
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-BM1", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 40000 }
              as: PlatformAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-BM2", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 40000 }
              as: PlatformAdmin
              captures: { s2: "$.data.id" }
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-BM3", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 40000 }
              as: PlatformAdmin
