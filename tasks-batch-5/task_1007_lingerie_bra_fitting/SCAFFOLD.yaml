  - { method: GET,  path: "/boutique/orders", description: "List orders (filter by customer)", roles: [Customer, StoreManager, BillingClerk], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/boutique/orders/{id}/lines", description: "Add a line to a draft order", roles: [Customer, StoreManager], code: 201, input: [sku_id, quantity], output: OrderLine, side_effects: ["unit_price_cents snapshot from SKU.price_cents", "is_special_order flagged if SKU out of stock on SPECIAL_ORDER order", "status=ACTIVE"] }
  - { method: GET,  path: "/boutique/order-lines/{id}", description: "Get an order line", roles: [Customer, StoreManager, BillingClerk], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: GET,  path: "/boutique/order-lines", description: "List order lines (filter by order or SKU)", roles: [Customer, StoreManager, BillingClerk], code: 200, input: ["order_id?", "sku_id?", "limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - { method: POST, path: "/boutique/orders/{id}/place", description: "Place the order; reserves inventory for in-stock lines", roles: [Customer, StoreManager], code: 200, input: [], output: Order, side_effects: ["fulfillment_status DRAFT -> PLACED", "reservations taken"] }
  - { method: POST, path: "/boutique/orders/{id}/pay", description: "Record payment; computes totals + provisional loyalty", roles: [BillingClerk], code: 200, input: [], output: Order, side_effects: ["payment_status UNPAID -> PAID", "order_totals + provisional loyalty computed"] }
  - { method: POST, path: "/boutique/orders/{id}/fulfill", description: "Fulfill the order; decrements stock, finalizes loyalty, seeds reminders", roles: [StoreManager], code: 200, input: [], output: Order, side_effects: ["fulfillment_status PLACED -> FULFILLED", "stock decremented, final loyalty, reminders created"] }
  - { method: POST, path: "/boutique/orders/{id}/cancel", description: "Cancel a draft/placed order; releases reservations, reverses loyalty, refunds if paid", roles: [Customer, StoreManager], code: 200, input: [], output: Order, side_effects: ["fulfillment_status -> CANCELLED, cascade line cancel + reservation release + loyalty reversal"] }

  # ---- Exchange (hygiene / exchange) ----
  - { method: POST, path: "/boutique/exchanges", description: "Request an exchange/return for a fulfilled line", roles: [Customer, StoreManager], code: 201, input: [order_id, order_line_id, item_condition, "reason?"], output: Exchange, side_effects: ["status=REQUESTED"] }
  - { method: GET,  path: "/boutique/exchanges/{id}", description: "Get an exchange", roles: [Customer, StoreManager, BillingClerk], code: 200, input: [], output: Exchange, side_effects: [] }
  - { method: GET,  path: "/boutique/exchanges", description: "List exchanges (filter by order or order line)", roles: [Customer, StoreManager, BillingClerk], code: 200, input: ["order_id?", "order_line_id?", "limit?", "offset?"], output: "Exchange[]", side_effects: [] }
  - { method: POST, path: "/boutique/exchanges/{id}/approve", description: "Approve exchange; restocks unit, issues store credit, reverses loyalty (cascade)", roles: [StoreManager], code: 200, input: [], output: Exchange, side_effects: ["status -> APPROVED; line EXCHANGED; SKU restock + status; store credit; loyalty reversal; reminder cancel"] }
  - { method: POST, path: "/boutique/exchanges/{id}/reject", description: "Reject exchange", roles: [StoreManager], code: 200, input: [], output: Exchange, side_effects: ["status -> REJECTED"] }

  # ---- InsuranceClaim (post-surgical / mastectomy) ----
  - { method: POST, path: "/boutique/insurance-claims", description: "Submit an insurance claim for a paid mastectomy order (ESTIMATE coverage)", roles: [BillingClerk], code: 201, input: [order_id], output: InsuranceClaim, side_effects: ["status=SUBMITTED; claim_amount + estimate covered computed"] }
  - { method: GET,  path: "/boutique/insurance-claims/{id}", description: "Get an insurance claim", roles: [Customer, StoreManager, BillingClerk], code: 200, input: [], output: InsuranceClaim, side_effects: [] }
  - { method: GET,  path: "/boutique/insurance-claims", description: "List insurance claims (filter by order)", roles: [Customer, StoreManager, BillingClerk], code: 200, input: ["order_id?", "limit?", "offset?"], output: "InsuranceClaim[]", side_effects: [] }
  - { method: POST, path: "/boutique/insurance-claims/{id}/adjudicate", description: "Adjudicate: APPROVE (final coverage over adjudicated amount) or DENY", roles: [BillingClerk], code: 200, input: [decision, "adjudicated_amount_cents?"], output: InsuranceClaim, side_effects: ["status -> APPROVED|DENIED; covered_amount recomputed"] }
  - { method: POST, path: "/boutique/insurance-claims/{id}/reimburse", description: "Reimburse an approved claim into customer store credit", roles: [BillingClerk], code: 200, input: [], output: InsuranceClaim, side_effects: ["status APPROVED -> REIMBURSED; store credit += covered_amount"] }
  - { method: POST, path: "/boutique/insurance-claims/{id}/resubmit", description: "Resubmit a denied claim (cyclic)", roles: [BillingClerk], code: 200, input: [], output: InsuranceClaim, side_effects: ["status DENIED -> SUBMITTED; estimate coverage recomputed"] }

  # ---- ReplacementReminder (loyalty & replacement reminder) ----
  - { method: GET,  path: "/boutique/reminders/{id}", description: "Get a replacement reminder", roles: [Customer, StoreManager, BillingClerk], code: 200, input: [], output: ReplacementReminder, side_effects: [] }
  - { method: GET,  path: "/boutique/reminders", description: "List reminders (filter by customer/line/status)", roles: [Customer, StoreManager, BillingClerk], code: 200, input: ["customer_id?", "order_line_id?", "status?", "limit?", "offset?"], output: "ReplacementReminder[]", side_effects: [] }
  - { method: POST, path: "/boutique/reminders/{id}/send", description: "Send a due reminder", roles: [StoreManager], code: 200, input: [], output: ReplacementReminder, side_effects: ["status SCHEDULED -> SENT (requires clock >= due_date)"] }
  - { method: POST, path: "/boutique/reminders/{id}/dismiss", description: "Dismiss a reminder", roles: [Customer, StoreManager], code: 200, input: [], output: ReplacementReminder, side_effects: ["status -> DISMISSED"] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time.", roles: [StoreManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth --
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer acting on a resource whose customer_id is not their own id" }
  # -- validation --
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, negative/zero where positive required" }
  - { id: ERR_MEASUREMENT_OUT_OF_RANGE, http: 422, condition: "underbust/bust outside allowed range, or derived cup_index outside 1..8" }
  # -- not found --
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_FITTER_NOT_FOUND, http: 404, condition: "Fitter id does not exist" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "FittingRoom id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "FittingAppointment id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_SKU_NOT_FOUND, http: 404, condition: "SKU id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "OrderLine id does not exist" }
  - { id: ERR_EXCHANGE_NOT_FOUND, http: 404, condition: "Exchange id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "InsuranceClaim id does not exist" }
  - { id: ERR_REMINDER_NOT_FOUND, http: 404, condition: "ReplacementReminder id does not exist" }
  # -- state --
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic: entity not in a valid state for the requested transition" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "Place attempted on an order with no ACTIVE lines" }
  - { id: ERR_ORDER_NOT_PLACED, http: 409, condition: "Pay attempted while fulfillment_status != PLACED" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "Fulfill or insurance-claim submit attempted while the order's payment_status != PAID" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted on a FULFILLED order" }
  - { id: ERR_FIT_NOT_SUBMITTED, http: 409, condition: "Complete attempted before any fit recommendation was submitted" }
  - { id: ERR_LINE_NOT_EXCHANGEABLE_STATE, http: 409, condition: "Exchange approve on a line whose status is not FULFILLED (e.g., already EXCHANGED/CANCELLED)" }
  - { id: ERR_NOTHING_TO_REIMBURSE, http: 409, condition: "Reimburse on a claim whose covered_amount_cents is 0" }
  - { id: ERR_STALE_APPOINTMENT_VERSION, http: 412, condition: "expected_appointment_version does not match current FittingAppointment.version on re-fit" }
  # -- business_safety --
  - { id: ERR_FITTER_NOT_CERTIFIED, http: 409, condition: "POST_SURGICAL/MASTECTOMY fitting confirmed with an uncertified fitter" }
  - { id: ERR_ROOM_NOT_PRIVATE, http: 409, condition: "POST_SURGICAL/MASTECTOMY fitting confirmed in a non-private room" }
  - { id: ERR_ITEM_NOT_EXCHANGEABLE_HYGIENE, http: 409, condition: "Exchange of a non-SEALED item or an INTIMATE_NON_RETURNABLE product (hygiene policy)" }
  # -- business_constraint --
  - { id: ERR_FITTER_DOUBLE_BOOKED, http: 409, condition: "Fitter's buffered interval overlaps another CONFIRMED/CHECKED_IN appointment" }
  - { id: ERR_ROOM_AT_CAPACITY, http: 409, condition: "Room's overlapping CONFIRMED/CHECKED_IN count would reach or exceed capacity" }
  # -- business_temporal --
  - { id: ERR_EXCHANGE_WINDOW_EXPIRED, http: 409, condition: "Exchange approved more than EXCHANGE_WINDOW_DAYS after fulfillment" }
  - { id: ERR_REMINDER_NOT_DUE, http: 409, condition: "Reminder send attempted before due_date" }
  # -- business_referential --
  - { id: ERR_SKU_INACTIVE, http: 409, condition: "Placing an order whose line references an inactive SKU" }
  - { id: ERR_NOT_MASTECTOMY_ORDER, http: 409, condition: "Insurance claim submitted for an order with no mastectomy line" }
  # -- business_fiscal --
  - { id: ERR_INSUFFICIENT_STOCK, http: 402, condition: "available_units < requested quantity at place (0 available rejects any reservation)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "The client being fitted / purchasing; acts only on their own appointments, orders, exchanges, reminders"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /boutique/appointments/{id}/reschedule (own)"
      - "POST /boutique/reminders/{id}/dismiss (own)"
    shared_operations:
      - "POST /boutique/appointments (book own)"
      - "POST /boutique/appointments/{id}/cancel (own)"
      - "POST /boutique/orders (own), POST /boutique/orders/{id}/lines, /place, /cancel (own)"
      - "POST /boutique/exchanges (own)"
      - "GET reads on own resources and catalog"

  - name: Fitter
    description: "Conducts fittings; confirms, checks in, fits, completes appointments"
    identity: "entity_backed:Fitter"
    exclusive_operations:
      - "POST /boutique/appointments/{id}/confirm"
      - "POST /boutique/appointments/{id}/check-in"
      - "POST /boutique/appointments/{id}/fit"
      - "POST /boutique/appointments/{id}/complete"
    shared_operations:
      - "GET reads on appointments, customers, catalog"

  - name: StoreManager
    description: "Operational admin: catalog, inventory, fulfillment, exchanges, reminders, loyalty adjustments, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /boutique/customers, /boutique/fitters, /boutique/rooms, /boutique/products, /boutique/skus"
      - "POST /boutique/skus/{id}/restock"
      - "POST /boutique/customers/{id}/loyalty-adjustments"
      - "POST /boutique/orders/{id}/fulfill"
      - "POST /boutique/exchanges/{id}/approve, /reject"
      - "POST /boutique/reminders/{id}/send"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /boutique/appointments (on behalf), /reschedule, /cancel"
      - "POST /boutique/orders (on behalf), /lines, /place, /cancel"
      - "POST /boutique/exchanges (on behalf)"
      - "POST /boutique/reminders/{id}/dismiss"
      - "GET reads (all)"

  - name: BillingClerk
    description: "Handles payments, insurance claims, reimbursements"
    identity: "opaque"
    exclusive_operations:
      - "POST /boutique/orders/{id}/pay"
      - "POST /boutique/insurance-claims"
      - "POST /boutique/insurance-claims/{id}/adjudicate, /reimburse, /resubmit"
    shared_operations:
      - "GET reads (orders, claims, customers, loyalty-events)"
