            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 5000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 5000, fixed_price: 4.55, delivery_window_start: "2026-11-01", delivery_window_end: "2026-12-01" }, as: CommodityAdvisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 1000, fixed_price: 4.60, delivery_window_start: "2026-10-31", delivery_window_end: "2026-11-30" }, as: CommodityAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent window [2026-11-01, 2026-12-01) touching C1's end is accepted (201) — half-open semantics"
            - "Window [2026-10-31, 2026-11-30) intersecting C1 by one day is rejected with ERR_DELIVERY_WINDOW_OVERLAP"
      - name: storage_bin_seven_day_buffer_gap
        grounds:
          - validations[priority=9]
          - errors[ERR_STORAGE_BIN_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = mandatory 7-day buffer between closed [start, end]
          occupancies of one storage bin — adjacency is FORBIDDEN (unlike the
          sibling's half-open contract windows). A lot starting 5 days after the
          prior lot's end conflicts; one starting 8 days after is accepted.
        test_recipe:
          setup:
            - "Operation with an ACTIVE plan (not needed for lots) and STORED lot A in bin BIN-7 spanning [2026-10-01 .. 2026-10-31]"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Bin Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id } }
            - { call: "POST /advisory/storage-lots", payload: { operation_id: "${op_id}", bin_id: "BIN-7", bushels: 30000, start_date: "2026-10-01", planned_end_date: "2026-10-31", cost_per_bushel_month: 0.03, annual_interest_rate: 0.06 }, as: Grower, as_user_id: "${op_id}", captures: { lot_a: $.data.id } }
          trigger:
            - { call: "POST /advisory/storage-lots", payload: { operation_id: "${op_id}", bin_id: "BIN-7", bushels: 10000, start_date: "2026-11-05", planned_end_date: "2026-12-15", cost_per_bushel_month: 0.03, annual_interest_rate: 0.06 }, as: Grower, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
            - { call: "POST /advisory/storage-lots", payload: { operation_id: "${op_id}", bin_id: "BIN-7", bushels: 10000, start_date: "2026-11-08", planned_end_date: "2026-12-15", cost_per_bushel_month: 0.03, annual_interest_rate: 0.06 }, as: Grower, as_user_id: "${op_id}", captures: { lot_c: $.data.id } }
          assert:
            - "Lot starting 2026-11-05 (gap 5 days < 7) rejected with ERR_STORAGE_BIN_OVERLAP"
            - "Lot starting 2026-11-08 (gap 8 days >= 7) accepted (201) — buffer satisfied"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: contract_create_cancel_conserve_bushels
        grounds:
          - state_machines.SalesContract.OPEN_to_CANCELLED
          - entities.MarketingPlan.fields.uncommitted_bushels
        distinguishing_aspect: |
          Conserved quantity = plan bushel budget: committed_contract_bushels +
          uncommitted_bushels == expected_bushels_snapshot at every step. The forward
          action (contract create) and its compensating action (cancel) return
          uncommitted_bushels to the exact pre-create value 20000.
        test_recipe:
          setup:
            - "AGGRESSIVE operation expected 20000, ACTIVE plan max 1.00, APPROVED buyer"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Inv Farm 1", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Inv Buyer", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "GET /advisory/marketing-plans/${plan_id}", as: CommodityAdvisor, captures: { uncom0: $.data.uncommitted_bushels, com0: $.data.committed_contract_bushels } }
          trigger:
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 7500, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c_id: $.data.id } }
            - { call: "GET /advisory/marketing-plans/${plan_id}", as: CommodityAdvisor, captures: { uncom1: $.data.uncommitted_bushels, com1: $.data.committed_contract_bushels } }
            - { call: "POST /advisory/sales-contracts/${c_id}/cancel", as: Grower, as_user_id: "${op_id}" }
            - { call: "GET /advisory/marketing-plans/${plan_id}", as: CommodityAdvisor, captures: { uncom2: $.data.uncommitted_bushels, com2: $.data.committed_contract_bushels } }
          assert:
            - "Before: committed == 0, uncommitted == 20000 (sum == expected_bushels_snapshot 20000)"
            - "After create: committed == 7500, uncommitted == 12500 (sum still 20000)"
            - "After cancel: committed == 0, uncommitted == 20000 — forward + compensating action leaves the conserved budget unchanged"
      - name: position_open_offset_conserve_margin_cash
        grounds:
          - state_machines.BrokeragePosition.OPEN_to_OFFSET
          - calculations.margin_accounting
        distinguishing_aspect: |
          Conserved quantity = margin cash absent market movement (a different
          quantity from the sibling's bushel budget): opening and then offsetting a
          futures position at an unchanged SETTLEMENT price leaves cash_balance,
          margin requirements, and realized pnl exactly as before the pair.
        test_recipe:
          setup:
            - "BALANCED operation expected 200000, ACTIVE plan, margin account funded 20000.00, SETTLEMENT tick CORN 2026-12 @4.50"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Inv Farm 2", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/margin-accounts", payload: { operation_id: "${op_id}", initial_funding: 20000 }, as: CommodityAdvisor, captures: { acct: $.data.id, cash0: $.data.cash_balance } }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.50, kind: SETTLEMENT, price_date: "2026-06-01" }, as: PlatformAdmin }
            - { call: "POST /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", instrument: FUTURES_SHORT, contract_month: "2026-12", bushels: 10000 }, as: CommodityAdvisor, captures: { rec: $.data.id } }
            - { call: "POST /advisory/hedge-recommendations/${rec}/accept", as: Grower, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /advisory/hedge-recommendations/${rec}/execute", as: CommodityAdvisor, captures: { pos: $.data.id } }
            - { call: "GET /advisory/margin-accounts/${acct}", as: CommodityAdvisor, captures: { cash_open: $.data.cash_balance, im_open: $.data.initial_margin_required } }
            - { call: "POST /advisory/brokerage-positions/${pos}/offset", as: CommodityAdvisor, captures: { realized: $.data.realized_pnl, exit_p: $.data.exit_price } }
            - { call: "GET /advisory/margin-accounts/${acct}", as: CommodityAdvisor, captures: { cash_end: $.data.cash_balance, im_end: $.data.initial_margin_required, mm_end: $.data.maintenance_margin_required, eq_end: $.data.margin_equity } }
          assert:
            - "After open at 4.50: cash_balance == 20000.00 (unchanged by opening), initial_margin_required == 3000.00"
            - "Offset at the same 4.50 tick: exit_price == 4.50, realized_pnl == 0.00"
            - "After offset: cash_balance == 20000.00, initial_margin_required == 0.00, maintenance_margin_required == 0.00, margin_equity == 20000.00 — open + offset conserves account value"
