          assert:
            - "SeveranceOffer.${offer_id}.weekly_rate_cents == 181827"
            - "SeveranceOffer.${offer_id}.weeks_awarded == 13.5"
            - "SeveranceOffer.${offer_id}.base_severance_cents == 2454665"
            - "SeveranceOffer.${offer_id}.base_severance_cents != 2454663"
            - "SeveranceOffer.${offer_id}.benefit_subsidy_months == 6"
            - "SeveranceOffer.${offer_id}.benefit_subsidy_cents == 351000"
            - "SeveranceOffer.${offer_id}.outplacement_fee_cents == 350000"
            - "SeveranceOffer.${offer_id}.total_separation_cost_cents == 3155665"
            - "Selection.${sel_grace}.composite_score == 70.10"

      - name: subsidy_tier_keyed_on_pre_benefit_subtotal_not_on_the_total
        grounds:
          - calculations.separation_cost_rollup
          - entities.SeveranceOffer.fields.benefit_subsidy_months
          - entities.SeveranceOffer.fields.outplacement_fee_cents
          - entities.SeveranceOffer.fields.total_separation_cost_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose evaluation order the scaffold
          pins. The subsidy tier is keyed on step (4) pre_benefit_subtotal 950000, which
          is below SUBSIDY_TIER_1_CEILING and therefore yields 3 months / STANDARD
          outplacement / total 1245500; keying the same tier on the step (8) total
          1245500 would cross the ceiling and yield 6 months / PREMIUM / total 1651000.
        test_recipe:
          setup:
            - "A TX site with three full-time employees and no WarnRule configured, so Site.required_notice_days is 0 and notice_pay_offset_cents is 0."
            - "Ivy (hired 2019-02-01, annual_base_cents 4940000 which divides to exactly 95000 per week, born 1978-05-10, 7 completed years) is the only SELECTED employee for 2026-12-01."
            - "Plan APPROVED with a CLEARED analysis and an ATTACHED disclosure; Ivy's notice has been delivered."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
