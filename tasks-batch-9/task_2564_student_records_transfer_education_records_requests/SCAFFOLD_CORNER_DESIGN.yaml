  - section: state_machines
    instances:
      - name: withdrawal_hold_then_final_release_returns_to_cleared
        claim_type: valid_transition
        grounds:
          - state_machines.Withdrawal.transitions.CLEARED_to_HOLD
          - state_machines.Withdrawal.transitions.HOLD_to_HOLD
          - state_machines.Withdrawal.transitions.HOLD_to_CLEARED
          - entities.Withdrawal.fields.active_hold_types
        distinguishing_aspect: "Two holds then two releases: the first release is non-final (HOLD -> HOLD, hold_count 1) and only the second returns the row to CLEARED with active_hold_types [], and active_hold_types stays sorted ascending by enum name (LIBRARY_FINE before MEAL_ACCOUNT) regardless of the order the holds were placed."
        test_recipe:
          setup:
            - "CA rule, SEND01 and one ENROLLED student exist."
            - "A withdrawal is opened, then MEAL_ACCOUNT is placed first and LIBRARY_FINE second."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Mika", last_name: "Rosen", dob: "2011-04-04", grade_level: 9, has_iep: false, guardian_user_id: "guardian-mika" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "POST /records-office/students/${student_id}/withdrawals"
              payload: { effective_date: "2026-08-14", destination_district_code: "SEND01", withdrawal_reason: "MOVED" }
              as: RecordsClerk
              captures: { withdrawal_id: "$.data.id" }
            - call: "POST /records-office/withdrawals/${withdrawal_id}/holds"
              payload: { hold_type: "MEAL_ACCOUNT" }
              as: RecordsClerk
            - call: "POST /records-office/withdrawals/${withdrawal_id}/holds"
              payload: { hold_type: "LIBRARY_FINE" }
              as: RecordsClerk
          trigger:
            - call: "POST /records-office/withdrawals/${withdrawal_id}/hold-releases"
              payload: { hold_type: "LIBRARY_FINE" }
              as: RecordsClerk
            - call: "POST /records-office/withdrawals/${withdrawal_id}/hold-releases"
              payload: { hold_type: "MEAL_ACCOUNT" }
              as: RecordsClerk
          assert:
            - "after the two setup holds, Withdrawal.${withdrawal_id}.status was \"HOLD\" with hold_count == 2 and active_hold_types == [\"LIBRARY_FINE\", \"MEAL_ACCOUNT\"]"
            - "after the first trigger call, Withdrawal.${withdrawal_id}.status == \"HOLD\" with hold_count == 1 and active_hold_types == [\"MEAL_ACCOUNT\"]"
            - "after the second trigger call, Withdrawal.${withdrawal_id}.status == \"CLEARED\" with hold_count == 0 and active_hold_types == []"
            - "Withdrawal.${withdrawal_id}.completed_at == null"
