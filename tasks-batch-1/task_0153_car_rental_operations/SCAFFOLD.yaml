# =============================================================================
# Car Rental Operations — Scaffold Seed Tables (Expert band, §0.4)
# =============================================================================

scenario: |
  Car Rental Operations: fleet/class availability, reservation/upgrade, daily/weekly
  rate + LDW/PAI add-ons, mileage/fuel policy, damage/incident, loyalty, one-way drop
  fee, young-driver surcharge, no-show grace

domain_name: car-rental-operations
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation     # quoted estimate vs final settlement on different subjects
    - rate_threshold_triggers      # weekly-rate breakpoint, mileage cap, fuel level, age band, grace window
    - optimistic_concurrency       # OCC on Vehicle.version for the assign-vehicle race
    - derived_field_reconciliation # VehicleClass.available_count denormalized from Vehicle rows

  entity_topology: flat
  # Peer entities linked by FK (Reservation -> Member/Location/VehicleClass;
  # RentalAgreement -> Reservation/Vehicle; IncidentReport -> RentalAgreement;
  # LedgerEntry / LoyaltyAccrual append-only). No nesting in URL paths.

  state_machine_shape: branching
  # Reservation forks QUOTED -> {CONFIRMED, EXPIRED}; CONFIRMED -> {PICKED_UP, NO_SHOW, CANCELLED};
  # RentalAgreement OPEN -> {CLOSED, WRITE_OFF}; Vehicle has a non-linear cycle
  # AVAILABLE<->RESERVED and ON_RENT->AVAILABLE/MAINTENANCE.

  relationship_patterns:
    - one_to_many        # Location -> Vehicle; VehicleClass -> Vehicle; Member -> Reservation
    - cross_aggregate    # RentalAgreement references Reservation and Vehicle across aggregates

  role_model: peer_roles
  # FleetManager owns vehicles/classes/locations; RentalAgent runs the counter
  # (reservations, pickups, returns, incidents); Member acts on own reservations.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Three-letter branch code, e.g. SFO", constraints: "uppercase, unique across Location" }
      - { name: name, type: string, source: input, description: "Branch display name" }
      - { name: one_way_drop_fee_cents, type: integer, source: input, description: "Flat fee charged when a vehicle is dropped at a different Location than pickup", constraints: ">= 0" }
      - { name: young_driver_surcharge_per_day_cents, type: integer, source: input, description: "Per-rental-day surcharge applied when the renting member's driver_age is below YOUNG_DRIVER_AGE_THRESHOLD", constraints: ">= 0" }

  - name: VehicleClass
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Class code, e.g. ECON, COMP, SUV, LUXURY", constraints: "unique across VehicleClass" }
      - { name: tier_rank, type: integer, source: input, description: "Ordinal rank used to decide whether a swap is an upgrade (higher) or downgrade (lower)", constraints: ">= 1, unique across VehicleClass" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Base daily rate before add-ons, surcharges and loyalty discount", constraints: "> 0" }
      - { name: weekly_rate_cents, type: integer, source: input, description: "Flat 7-day block rate; applied per whole week when rental_days >= WEEKLY_BREAKPOINT_DAYS", constraints: "> 0" }
      - { name: included_miles_per_day, type: integer, source: input, description: "Free mileage allowance per rental day; miles beyond allowance billed at overage_per_mile_cents", constraints: ">= 0" }
      - { name: overage_per_mile_cents, type: integer, source: input, description: "Charge per mile driven beyond the included allowance", constraints: ">= 0" }
      - { name: ldw_per_day_cents, type: integer, source: input, description: "Loss Damage Waiver add-on price per rental day", constraints: ">= 0" }
      - { name: pai_per_day_cents, type: integer, source: input, description: "Personal Accident Insurance add-on price per rental day", constraints: ">= 0" }
      - { name: total_count, type: integer, source: computed, description: "Count of Vehicle rows whose class_id == this VehicleClass.id and status != RETIRED" }
      - { name: available_count, type: integer, source: computed, description: "Denormalized count of Vehicle rows whose class_id == this VehicleClass.id and status == AVAILABLE; reconciled on every Vehicle status change" }

  - name: RatePlan
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; the Location this override applies at" }
      - { name: class_id, type: string, source: input, description: "FK -> VehicleClass.id; the class this override applies to" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Location-specific daily rate that overrides VehicleClass.daily_rate_cents when an active RatePlan matches (location_id, class_id)", constraints: "> 0" }
      - { name: weekly_rate_cents, type: integer, source: input, description: "Location-specific weekly rate overriding VehicleClass.weekly_rate_cents", constraints: "> 0" }
      - { name: active, type: boolean, source: input, description: "Whether this override is in effect; only active plans are consulted by reservation_quote", default: true }
      - { name: effective_from, type: datetime, source: input, description: "Instant from which the override applies; quote uses the active plan with the latest effective_from that is <= pickup_at, tie-broken by created_at ASC" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; the Location whose fleet currently holds this vehicle" }
      - { name: class_id, type: string, source: input, description: "FK -> VehicleClass.id; the class this vehicle belongs to" }
      - { name: plate, type: string, source: input, description: "License plate", constraints: "unique across Vehicle" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | ON_RENT | MAINTENANCE | RETIRED", default: "AVAILABLE", constraints: "AVAILABLE,RESERVED,ON_RENT,MAINTENANCE,RETIRED" }
      - { name: odometer_miles, type: integer, source: input, description: "Current odometer reading in miles; advanced on agreement close", constraints: ">= 0" }
      - { name: fuel_level_eighths, type: integer, source: input, description: "Fuel tank level in eighths (0=empty, 8=full) at the vehicle's current rest state", default: 8, constraints: "0..8" }
      - { name: held_by_reservation_id, type: string, source: system, description: "FK -> Reservation.id; set while status==RESERVED, null otherwise" }

  - name: LoyaltyMember
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Member email", constraints: "unique across LoyaltyMember" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: driver_age, type: integer, source: input, description: "Driver age in whole years at registration; drives the young-driver surcharge band", constraints: ">= 18" }
      - { name: tier, type: enum, source: system, description: "STANDARD | SILVER | GOLD — drives loyalty discount percent; auto-promoted on lifetime_points thresholds", default: "STANDARD", constraints: "STANDARD,SILVER,GOLD" }
      - { name: points_balance, type: integer, source: computed, description: "Redeemable points = sum of LoyaltyAccrual.delta_points for this member (ACCRUAL adds, REDEMPTION subtracts)" }
      - { name: lifetime_points, type: integer, source: computed, description: "Sum of LoyaltyAccrual.delta_points for ACCRUAL events only (never reduced by redemptions); drives tier promotion" }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of Reservation rows for this member whose status == NO_SHOW", default: 0 }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> LoyaltyMember.id; the member who booked" }
      - { name: pickup_location_id, type: string, source: input, description: "FK -> Location.id; where the vehicle is collected" }
      - { name: dropoff_location_id, type: string, source: input, description: "FK -> Location.id; where the vehicle is returned (may differ from pickup -> one-way drop fee)" }
      - { name: class_id, type: string, source: input, description: "FK -> VehicleClass.id; the reserved class (may change on upgrade)" }
      - { name: pickup_at, type: datetime, source: input, description: "Scheduled pickup instant (ISO 8601 UTC)" }
      - { name: dropoff_at, type: datetime, source: input, description: "Scheduled dropoff instant (ISO 8601 UTC)", constraints: "must be strictly after pickup_at" }
      - { name: rental_days, type: integer, source: computed, description: "Billable day count = ceil((dropoff_at - pickup_at) / 24h); minimum 1" }
      - { name: ldw_selected, type: boolean, source: input, description: "Whether Loss Damage Waiver add-on was selected", default: false }
      - { name: pai_selected, type: boolean, source: input, description: "Whether Personal Accident Insurance add-on was selected", default: false }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | PICKED_UP | CANCELLED | NO_SHOW | EXPIRED", default: "QUOTED", constraints: "QUOTED,CONFIRMED,PICKED_UP,CANCELLED,NO_SHOW,EXPIRED" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Estimate computed at confirmation using the reservation_quote calculation; frozen on CONFIRMED" }
      - { name: hold_expires_at, type: datetime, source: system, description: "Instant after which an un-picked-up CONFIRMED reservation may transition to NO_SHOW; = pickup_at + NO_SHOW_GRACE_MINUTES" }

  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the confirmed reservation this agreement realizes" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; the specific vehicle handed to the member at pickup" }
      - { name: odometer_out, type: integer, source: input, description: "Odometer reading at pickup", constraints: ">= 0" }
      - { name: fuel_out_eighths, type: integer, source: input, description: "Fuel level in eighths at pickup", constraints: "0..8" }
      - { name: odometer_in, type: integer, source: input, description: "Odometer reading at return; set on close", constraints: ">= odometer_out" }
      - { name: fuel_in_eighths, type: integer, source: input, description: "Fuel level in eighths at return; set on close", constraints: "0..8" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | WRITE_OFF", default: "OPEN", constraints: "OPEN,CLOSED,WRITE_OFF" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final settlement computed by agreement_settlement on close; sum of all LedgerEntry.amount_cents for this agreement" }
      - { name: miles_driven, type: integer, source: computed, description: "= odometer_in - odometer_out; 0 while OPEN" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> RentalAgreement.id; the open agreement the incident occurred under" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | TOTAL — drives base damage charge tier", constraints: "MINOR,MAJOR,TOTAL" }
      - { name: assessed_damage_cents, type: integer, source: input, description: "Raw assessed repair/replacement cost before LDW waiver", constraints: ">= 0" }
      - { name: member_liability_cents, type: integer, source: computed, description: "Damage charged to the member after applying LDW waiver and the per-incident deductible" }
      - { name: status, type: enum, source: system, description: "FILED | RESOLVED | VOID", default: "FILED", constraints: "FILED,RESOLVED,VOID" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> RentalAgreement.id; the agreement this charge/credit belongs to" }
      - { name: kind, type: enum, source: system, description: "BASE_RENTAL | MILEAGE_OVERAGE | FUEL | ADDONS | YOUNG_DRIVER | ONE_WAY_DROP | DAMAGE | LOYALTY_DISCOUNT | INCIDENT_REVERSAL", constraints: "BASE_RENTAL,MILEAGE_OVERAGE,FUEL,ADDONS,YOUNG_DRIVER,ONE_WAY_DROP,DAMAGE,LOYALTY_DISCOUNT,INCIDENT_REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents; charges positive, credits/reversals negative" }
      - { name: memo, type: string, source: system, description: "Human-readable explanation of the line" }

  - name: LoyaltyAccrual
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> LoyaltyMember.id; the member whose points changed" }
      - { name: agreement_id, type: string, source: input, description: "FK -> RentalAgreement.id; the agreement that produced this accrual (null for manual redemptions)" }
      - { name: kind, type: enum, source: system, description: "ACCRUAL | REDEMPTION | REVERSAL", constraints: "ACCRUAL,REDEMPTION,REVERSAL" }
      - { name: delta_points, type: integer, source: system, description: "Signed point change; ACCRUAL positive, REDEMPTION negative, REVERSAL negative (undoes a prior ACCRUAL)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Reservation
    initial_state: QUOTED
    terminal_states: [PICKED_UP, CANCELLED, NO_SHOW, EXPIRED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: RentalAgent
        preconditions:
          - "Reservation.status == QUOTED"
          - "member.no_show_strikes < NO_SHOW_STRIKE_LIMIT (ERR_MEMBER_BLOCKED)"
          - "VehicleClass(class_id).available_count >= 1 at the pickup_location (ERR_NO_AVAILABILITY)"
          - "count of CONFIRMED/PICKED_UP reservations for (pickup_location_id, class_id) whose [pickup_at, dropoff_at) interval overlaps this one stays strictly below the location's class fleet size (ERR_LOCATION_CLASS_CAPACITY)"
        side_effects:
          - "Compute quoted_total_cents via reservation_quote and freeze it on the row"
          - "Set hold_expires_at = pickup_at + NO_SHOW_GRACE_MINUTES"

      - from: QUOTED
        to: EXPIRED
        trigger: "POST /reservations/{id}/expire"
        actor: system
        preconditions:
          - "Reservation.status == QUOTED"
        side_effects:
          - "No vehicle was ever held; no availability change"

      - from: CONFIRMED
        to: PICKED_UP
        trigger: "POST /rental-agreements (creates the agreement)"
        actor: RentalAgent
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "current_utc <= hold_expires_at (ERR_GRACE_WINDOW_EXPIRED)"
          - "the assigned Vehicle.status == RESERVED and held_by_reservation_id == this reservation, OR an AVAILABLE vehicle of the reserved class at pickup_location is assigned (ERR_NO_AVAILABILITY)"
        side_effects:
          - "Create RentalAgreement(status=OPEN) referencing this reservation and the assigned vehicle"
          - "Assigned Vehicle.status -> ON_RENT; held_by_reservation_id cleared; class.available_count reconciled"
          - "Emit LedgerEntry rows for BASE_RENTAL, ADDONS, YOUNG_DRIVER, ONE_WAY_DROP and LOYALTY_DISCOUNT per agreement_settlement provisional pass"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /reservations/{id}/no-show"
        actor: RentalAgent
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "current_utc > hold_expires_at (ERR_WITHIN_GRACE)"
        side_effects:
          - "If a Vehicle is RESERVED for this reservation: Vehicle.status -> AVAILABLE, held_by_reservation_id cleared, class.available_count incremented (cascade)"
          - "member.no_show_strikes recomputed (this reservation now counts)"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Member
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "current_utc <= hold_expires_at (ERR_GRACE_WINDOW_EXPIRED)"
        side_effects:
          - "If a Vehicle is RESERVED for this reservation: Vehicle.status -> AVAILABLE, held_by_reservation_id cleared, class.available_count incremented (cascade)"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Member
        preconditions:
          - "Reservation.status == QUOTED"
        side_effects:
          - "No vehicle held; no availability change"

  - entity: Vehicle
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /vehicles/{id}/hold"
        actor: RentalAgent
        preconditions:
          - "expected_vehicle_version matches Vehicle.version (ERR_STALE_VERSION)"
          - "target Reservation.status == CONFIRMED and class_id == Vehicle.class_id and pickup_location_id == Vehicle.location_id (ERR_CLASS_MISMATCH)"
          - "the vehicle's current active commitment (its RESERVED-hold reservation or its ON_RENT agreement's reservation), if any, does NOT have a [pickup_at, dropoff_at) interval overlapping the target reservation's interval; half-open, shared boundary instant does not collide (ERR_VEHICLE_DOUBLE_BOOKED). Checked BEFORE the availability check so an overlapping busy vehicle reports the double-booking, not a generic unavailability."
          - "Vehicle.status == AVAILABLE — once the vehicle is committed to a non-overlapping window it is already busy; a busy vehicle with no overlap still fails here (ERR_VEHICLE_NOT_AVAILABLE)"
        side_effects:
          - "held_by_reservation_id = reservation_id"
          - "class.available_count decremented (cascade onto VehicleClass)"
          - "increments Vehicle.version by 1"

      - from: RESERVED
        to: AVAILABLE
        trigger: "Reservation cancel/no-show/expire release, or POST /vehicles/{id}/release"
        actor: system
        preconditions:
          - "Vehicle.status == RESERVED"
        side_effects:
          - "held_by_reservation_id cleared"
          - "class.available_count incremented (cascade)"

      - from: RESERVED
        to: ON_RENT
        trigger: "POST /rental-agreements"
        actor: RentalAgent
        preconditions:
          - "Vehicle.status == RESERVED and held_by_reservation_id == the picked-up reservation"
        side_effects:
          - "held_by_reservation_id cleared"
          - "class.available_count unchanged (already excluded while RESERVED)"

      - from: ON_RENT
        to: AVAILABLE
        trigger: "POST /rental-agreements/{id}/close (clean return)"
        actor: RentalAgent
        preconditions:
          - "Vehicle.status == ON_RENT"
          - "no FILED IncidentReport of severity MAJOR or TOTAL on the closing agreement"
        side_effects:
          - "odometer_miles = agreement.odometer_in; fuel_level_eighths = agreement.fuel_in_eighths"
          - "class.available_count incremented (cascade)"

      - from: ON_RENT
        to: MAINTENANCE
        trigger: "POST /rental-agreements/{id}/close (damaged return)"
        actor: RentalAgent
        preconditions:
          - "Vehicle.status == ON_RENT"
          - "at least one FILED IncidentReport of severity MAJOR or TOTAL on the closing agreement"
        side_effects:
          - "odometer_miles = agreement.odometer_in; fuel_level_eighths = agreement.fuel_in_eighths"
          - "vehicle stays out of availability; class.available_count unchanged"

      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /vehicles/{id}/return-to-service"
        actor: FleetManager
        preconditions:
          - "Vehicle.status == MAINTENANCE"
          - "no IncidentReport in FILED status on this vehicle's last agreement (all RESOLVED or VOID) (ERR_OPEN_INCIDENT)"
        side_effects:
          - "class.available_count incremented (cascade)"

      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /vehicles/{id}/retire"
        actor: FleetManager
        preconditions:
          - "Vehicle.status == AVAILABLE"
        side_effects:
          - "class.total_count and class.available_count both decremented (cascade)"

      - from: ON_RENT
        to: RETIRED
        trigger: "RentalAgreement OPEN->WRITE_OFF (total-loss cascade)"
        actor: system
        preconditions:
          - "Vehicle.status == ON_RENT"
          - "the agreement being written off references this vehicle"
        side_effects:
          - "class.total_count decremented; class.available_count reconciled (cascade onto VehicleClass) — this is hop C of the write-off cascade"

  - entity: RentalAgreement
    initial_state: OPEN
    terminal_states: [CLOSED, WRITE_OFF]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /rental-agreements/{id}/close"
        actor: RentalAgent
        preconditions:
          - "RentalAgreement.status == OPEN"
          - "odometer_in >= odometer_out (ERR_ODOMETER_ROLLBACK)"
          - "no FILED IncidentReport of severity TOTAL on this agreement (a TOTAL must be resolved to WRITE_OFF instead) (ERR_TOTAL_LOSS_REQUIRES_WRITEOFF)"
        side_effects:
          - "Recompute miles_driven = odometer_in - odometer_out"
          - "Run agreement_settlement final pass: emit/replace MILEAGE_OVERAGE, FUEL, DAMAGE ledger entries; final_total_cents = sum of LedgerEntry.amount_cents"
          - "Vehicle transitions ON_RENT -> AVAILABLE (clean) or ON_RENT -> MAINTENANCE (any MAJOR/TOTAL FILED incident) per Vehicle state machine"
          - "Emit LoyaltyAccrual(kind=ACCRUAL) via loyalty_accrual; member tier re-evaluated (cascade)"

      - from: OPEN
        to: WRITE_OFF
        trigger: "POST /rental-agreements/{id}/write-off"
        actor: FleetManager
        preconditions:
          - "RentalAgreement.status == OPEN"
          - "at least one IncidentReport of severity TOTAL on this agreement (ERR_NO_TOTAL_INCIDENT)"
        side_effects:
          - "Run agreement_settlement final pass including full DAMAGE charge"
          - "Vehicle.status -> RETIRED (total loss); class.total_count and available accounting reconciled (cascade)"
          - "Emit LoyaltyAccrual(kind=ACCRUAL) at half rate per loyalty_accrual write-off variant (cascade)"

  - entity: IncidentReport
    initial_state: FILED
    terminal_states: [RESOLVED, VOID]
    transitions:
      - from: FILED
        to: RESOLVED
        trigger: "POST /incident-reports/{id}/resolve"
        actor: FleetManager
        preconditions:
          - "IncidentReport.status == FILED"
          - "the parent RentalAgreement.status is CLOSED or WRITE_OFF (ERR_AGREEMENT_STILL_OPEN)"
        side_effects:
          - "member_liability_cents frozen per incident_liability calculation"

      - from: FILED
        to: VOID
        trigger: "POST /incident-reports/{id}/void"
        actor: FleetManager
        preconditions:
          - "IncidentReport.status == FILED"
        side_effects:
          - "If a DAMAGE LedgerEntry was already emitted for this incident on a CLOSED agreement, emit a compensating INCIDENT_REVERSAL LedgerEntry of equal negative amount so the agreement's ledger sum drops by exactly the prior DAMAGE charge (compensation; final_total_cents recomputed)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: vehicle-hold-stale-version
    parent_entity: Vehicle
    write_endpoint: "POST /vehicles/{id}/hold"
    occ_field: "expected_vehicle_version"
    description: |
      Holding a Vehicle for a reservation against a Vehicle whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another agent has already held (or otherwise mutated) the same
      AVAILABLE vehicle — legitimately taking it out of the available pool — so
      the current writer's view of the vehicle is stale. The loser carries an
      expected_vehicle_version that no longer matches the vehicle's current
      version and is rejected, leaving the single hold intact.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reservation_quote
    trigger: "Reservation QUOTED -> CONFIRMED (POST /reservations/{id}/confirm); freezes quoted_total_cents"
    algorithm: tiered_pricing
    formula: |
      # Forward-looking ESTIMATE on the Reservation. Uses scheduled rental_days only;
      # never references odometer/fuel (those are unknown until return).
      rental_days = max(1, ceil((dropoff_at - pickup_at) / 24h))
      # --- effective rate selection (RatePlan override else class default) ---
      # Candidate set: RatePlan rows where active == true AND location_id == pickup_location_id
      #   AND class_id == reservation.class_id AND effective_from <= pickup_at.
      # Ranking: effective_from DESC. Tie-break: created_at ASC. Fallback (empty set):
      #   use class.daily_rate_cents / class.weekly_rate_cents.
      plan = select RatePlan rows where (active AND location_id==pickup_location_id
               AND class_id==reservation.class_id AND effective_from <= pickup_at)
             rank by effective_from DESC, then created_at ASC; take first; else NONE
      daily  = plan ? plan.daily_rate_cents  : class.daily_rate_cents
      weekly = plan ? plan.weekly_rate_cents : class.weekly_rate_cents
      # --- base rental: weekly blocks then daily remainder ---
      if rental_days >= WEEKLY_BREAKPOINT_DAYS:
        whole_weeks    = rental_days // 7
        leftover_days  = rental_days % 7
        base = whole_weeks * weekly + leftover_days * daily
      else:
        base = rental_days * daily
      # --- add-ons (per day) ---
      addons = rental_days * ((ldw_selected ? class.ldw_per_day_cents : 0)
                            + (pai_selected ? class.pai_per_day_cents : 0))
      # --- young-driver surcharge (per day, pickup_location config) ---
      young = (member.driver_age < YOUNG_DRIVER_AGE_THRESHOLD)
              ? rental_days * pickup_location.young_driver_surcharge_per_day_cents : 0
      # --- one-way drop fee (flat, dropoff_location config) ---
      drop = (dropoff_location_id != pickup_location_id)
              ? dropoff_location.one_way_drop_fee_cents : 0
      # --- loyalty discount: applies ONLY to base, rounded HALF-UP at the end ---
      pct = loyalty_discount_pct(member.tier)   # STANDARD 0.00, SILVER 0.05, GOLD 0.10
      discount = round_half_up(base * pct)
      quoted_total_cents = base + addons + young + drop - discount
    input_set: "Single Reservation plus its member, pickup_location, dropoff_location, class config and any matching active RatePlan; no Vehicle, no agreement."
    constants:
      WEEKLY_BREAKPOINT_DAYS: 7
      YOUNG_DRIVER_AGE_THRESHOLD: 25
    precision: "All money integer cents; discount rounded once at the end, round_half_up."

  - name: agreement_settlement
    trigger: "RentalAgreement OPEN->CLOSED / OPEN->WRITE_OFF (final pass) and CONFIRMED->PICKED_UP (provisional pass)"
    algorithm: dual_variant
    formula: |
      # CHRONOLOGICAL ACTUAL settlement on the RentalAgreement. Emits signed
      # LedgerEntry rows; final_total_cents = sum of all LedgerEntry.amount_cents.
      # Provisional pass (at PICKED_UP): emits BASE_RENTAL, ADDONS, YOUNG_DRIVER,
      #   ONE_WAY_DROP, LOYALTY_DISCOUNT — identical numbers to reservation_quote.
      # Final pass (at CLOSE/WRITE_OFF): keeps the provisional rows and ADDS the
      #   usage-driven rows below, then re-sums.
      miles_driven   = odometer_in - odometer_out
      included_total = class.included_miles_per_day * rental_days
      overage_miles  = max(0, miles_driven - included_total)          # zero-floor edge
      MILEAGE_OVERAGE = overage_miles * class.overage_per_mile_cents
      # --- fuel: charge only if returned with LESS fuel than picked up ---
      missing_eighths = max(0, fuel_out_eighths - fuel_in_eighths)
      FUEL = missing_eighths * FUEL_PER_EIGHTH_CENTS
      # --- damage: sum of member_liability_cents over RESOLVED-or-FILED incidents ---
      DAMAGE = sum(incident.member_liability_cents
                   for incident in agreement.incidents
                   if incident.status in {FILED, RESOLVED})
      final_total_cents = sum(LedgerEntry.amount_cents for entry on this agreement)
    input_set: "One RentalAgreement, its reservation (for frozen base/addon/young/drop/discount inputs), its vehicle (odometer/fuel), and its non-VOID IncidentReports."
    constants:
      FUEL_PER_EIGHTH_CENTS: 1500
    precision: "Integer cents; no intermediate rounding (all inputs already integer cents)."
    variants:
      - name: provisional_at_pickup
        when: "Reservation CONFIRMED -> PICKED_UP"
        difference: "Emits only the date-driven rows (base, addons, young, drop, discount); usage rows absent because odometer_in/fuel_in unknown. Equals reservation_quote numerically."
      - name: final_at_close
        when: "RentalAgreement OPEN -> CLOSED"
        difference: "Adds MILEAGE_OVERAGE, FUEL, DAMAGE on top of the frozen provisional rows; final_total_cents diverges from quoted_total_cents by exactly those usage rows."

  - name: incident_liability
    trigger: "IncidentReport creation (POST /incident-reports) and FILED->RESOLVED freeze"
    algorithm: threshold
    formula: |
      # Risk/liability scoring on the MEMBER's incident — a different entity domain
      # than agreement_settlement's cost accounting. Tiered cap on member exposure.
      ldw_in_effect = reservation.ldw_selected   # via agreement.reservation
      base_cap = (severity == MINOR) ? MINOR_DEDUCTIBLE_CENTS
               : (severity == MAJOR) ? MAJOR_DEDUCTIBLE_CENTS
               :                       TOTAL_DEDUCTIBLE_CENTS
      if ldw_in_effect:
        # LDW waives assessed damage down to the deductible, but never below 0
        member_liability_cents = min(assessed_damage_cents, base_cap)
      else:
        # no waiver: member owes full assessed up to the (higher) no-LDW ceiling
        member_liability_cents = min(assessed_damage_cents, NO_LDW_CEILING_CENTS)
    input_set: "One IncidentReport, its agreement, and that agreement's reservation.ldw_selected flag."
    constants:
      MINOR_DEDUCTIBLE_CENTS: 25000
      MAJOR_DEDUCTIBLE_CENTS: 100000
      TOTAL_DEDUCTIBLE_CENTS: 250000
      NO_LDW_CEILING_CENTS: 5000000
    precision: "Integer cents."
    variants:
      - name: ldw_waived
        when: "agreement.reservation.ldw_selected == true"
        difference: "Caps member exposure at the per-severity deductible."
      - name: no_ldw
        when: "agreement.reservation.ldw_selected == false"
        difference: "Member owes full assessed_damage up to NO_LDW_CEILING_CENTS — diverges sharply from the waived figure on identical assessed_damage_cents."

  - name: loyalty_accrual
    trigger: "RentalAgreement OPEN->CLOSED (full) and OPEN->WRITE_OFF (half); emits LoyaltyAccrual"
    algorithm: aggregation
    formula: |
      # Points = floor(final_total_cents / POINTS_DIVISOR_CENTS) * tier_multiplier,
      # evaluated AFTER final_total_cents is known. Order is pinned: settlement
      # runs first (final_total_cents fixed), THEN accrual reads it.
      tier_mult = (member.tier == GOLD)   ? 3
                : (member.tier == SILVER) ? 2
                :                           1
      earned = floor(max(0, final_total_cents) / POINTS_DIVISOR_CENTS) * tier_mult
      delta_points = (close variant) ? earned : floor(earned / 2)   # write-off pays half
      # member.points_balance and lifetime_points are recomputed from LoyaltyAccrual rows
    input_set: "One closed/written-off RentalAgreement and its member.tier at close time."
    constants:
      POINTS_DIVISOR_CENTS: 100
    precision: "Integer points; floor after division, multiply after floor (order pinned)."
    variants:
      - name: close_full
        when: "OPEN -> CLOSED"
        difference: "delta_points = earned (full)."
      - name: writeoff_half
        when: "OPEN -> WRITE_OFF"
        difference: "delta_points = floor(earned / 2) — a different conserved quantity (points) than the cash ledger."

  - name: member_tier
    trigger: "LoyaltyMember read and after any LoyaltyAccrual ACCRUAL (on agreement close/write-off)"
    algorithm: threshold
    formula: |
      # Promotion is monotonic on lifetime_points (which never decreases).
      # Boundaries are inclusive at the lower edge (>=).
      lifetime_points = sum(LoyaltyAccrual.delta_points for ACCRUAL events of this member)
      if lifetime_points >= GOLD_THRESHOLD_POINTS:    tier = GOLD
      elif lifetime_points >= SILVER_THRESHOLD_POINTS: tier = SILVER
      else:                                            tier = STANDARD
      # loyalty_discount_pct(tier): STANDARD 0.00, SILVER 0.05, GOLD 0.10
    input_set: "All ACCRUAL LoyaltyAccrual rows for one member."
    constants:
      SILVER_THRESHOLD_POINTS: 500
      GOLD_THRESHOLD_POINTS: 2000
      STANDARD_DISCOUNT_PCT: 0.00
      SILVER_DISCOUNT_PCT: 0.05
      GOLD_DISCOUNT_PCT: 0.10
    precision: "Integer points compared with >= at lower edge; discount percent applied in reservation_quote."

  - name: no_show_policy
    trigger: "Reservation confirm (strike gate) and no-show (grace gate)"
    algorithm: threshold
    formula: |
      hold_expires_at = pickup_at + minutes(NO_SHOW_GRACE_MINUTES)
      # no-show allowed only when current_utc > hold_expires_at (strict >)
      # confirm blocked when no_show_strikes >= NO_SHOW_STRIKE_LIMIT (>=, inclusive)
      no_show_strikes = count(Reservation for member where status == NO_SHOW)
    input_set: "One reservation's pickup_at and the member's NO_SHOW reservation count."
    constants:
      NO_SHOW_GRACE_MINUTES: 120
      NO_SHOW_STRIKE_LIMIT: 3
    precision: "Integer minutes; grace boundary strict (>), strike boundary inclusive (>=)."

  - name: class_availability_reconcile
    trigger: "any Vehicle status change (hold/release/pickup/close/retire/return-to-service)"
    algorithm: aggregation
    formula: |
      class.total_count     = count(Vehicle where class_id == class.id and status != RETIRED)
      class.available_count = count(Vehicle where class_id == class.id and status == AVAILABLE)
      # Derived-field reconciliation: recomputed from Vehicle rows on every status change,
      # never incremented blindly. available_count is the denormalized cache.
    input_set: "All Vehicle rows for the class; status filter AVAILABLE for available_count, status != RETIRED for total_count."
    constants: {}
    precision: "Integer counts."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC; entity_backed Member acting on a reservation must own it (Reservation.member_id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right): Location, VehicleClass, Vehicle, LoyaltyMember, Reservation, RentalAgreement, IncidentReport"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, dropoff_at strictly after pickup_at, integer fields non-negative where constrained"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_vehicle_version on POST /vehicles/{id}/hold matches Vehicle.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /vehicles/{id}/hold"

  - priority: 7
    category: business_referential
    check: "On confirm/hold: reservation class_id == vehicle class_id and pickup_location_id == vehicle location_id"
    error_id: ERR_CLASS_MISMATCH
    http_status: 409
    applies_to: "POST /vehicles/{id}/hold, POST /rental-agreements"

  - priority: 8
    category: business_safety
    check: "Member is not blocked: member.no_show_strikes < NO_SHOW_STRIKE_LIMIT before a reservation may be CONFIRMED"
    error_id: ERR_MEMBER_BLOCKED
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 9
    category: business_temporal
    check: "No-show may be declared only after the grace window: current_utc > hold_expires_at"
    error_id: ERR_WITHIN_GRACE
    http_status: 409
    applies_to: "POST /reservations/{id}/no-show"

  - priority: 10
    category: business_temporal
    check: "Pickup/cancel allowed only within the grace window: current_utc <= hold_expires_at"
    error_id: ERR_GRACE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /rental-agreements, POST /reservations/{id}/cancel"

  - priority: 11
    category: business_constraint
    check: "On close: odometer_in >= odometer_out"
    error_id: ERR_ODOMETER_ROLLBACK
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/close"

  - priority: 12
    category: business_safety
    check: "An agreement with a FILED TOTAL-severity incident cannot be CLOSED; it must be written off"
    error_id: ERR_TOTAL_LOSS_REQUIRES_WRITEOFF
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/close"

  - priority: 13
    category: business_constraint
    check: "Write-off requires at least one TOTAL-severity incident on the agreement"
    error_id: ERR_NO_TOTAL_INCIDENT
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/write-off"

  - priority: 14
    category: business_fiscal
    check: "Confirming a reservation requires class availability at the pickup location: class.available_count >= 1"
    error_id: ERR_NO_AVAILABILITY
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm, POST /vehicles/{id}/hold, POST /rental-agreements"

  - priority: 15
    category: business_referential
    check: "Resolving an incident requires its parent agreement to be CLOSED or WRITE_OFF"
    error_id: ERR_AGREEMENT_STILL_OPEN
    http_status: 409
    applies_to: "POST /incident-reports/{id}/resolve"

  - priority: 16
    category: business_safety
    check: "Returning a vehicle to service requires no FILED incident remaining on its last agreement"
    error_id: ERR_OPEN_INCIDENT
    http_status: 409
    applies_to: "POST /vehicles/{id}/return-to-service"

  - priority: 17
    category: business_constraint
    check: "On upgrade, target VehicleClass.tier_rank must be strictly greater than the current reserved class's tier_rank"
    error_id: ERR_NOT_AN_UPGRADE
    http_status: 409
    applies_to: "POST /reservations/{id}/upgrade"

  - priority: 18
    category: business_fiscal
    check: "Redemption points must not exceed member.points_balance"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    applies_to: "POST /members/{id}/redeem"

  - priority: 19
    category: business_temporal
    check: "On hold: the vehicle's current active commitment (RESERVED-hold or ON_RENT agreement reservation) must not have a [pickup_at, dropoff_at) interval overlapping the target reservation's interval; half-open semantics, shared boundary instant does not collide. Evaluated before the availability check (priority 20)"
    error_id: ERR_VEHICLE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /vehicles/{id}/hold"

  - priority: 20
    category: state
    check: "Hold attempted on a vehicle whose status != AVAILABLE (and whose committed window did not overlap, else priority 19 fired)"
    error_id: ERR_VEHICLE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /vehicles/{id}/hold"

  - priority: 21
    category: business_temporal
    check: "On confirm: count of CONFIRMED/PICKED_UP reservations for the same (pickup_location_id, class_id) whose intervals overlap the new interval must remain strictly below the location's class fleet size (aggregate-capacity overlap; half-open intervals)"
    error_id: ERR_LOCATION_CLASS_CAPACITY
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Location ----
  - method: POST
    path: "/locations"
    description: "Create a rental Location/branch"
    roles: [FleetManager]
    code: 201
    input: [code, name, one_way_drop_fee_cents, young_driver_surcharge_per_day_cents]
    output: Location
    side_effects: []

  - method: GET
    path: "/locations/{id}"
    description: "Get a Location"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: GET
    path: "/locations/{id}/vehicles"
    description: "List vehicles whose location_id == this Location (reverse-reachability for Vehicle.location_id)"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: ["status?", "class_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # ---- VehicleClass ----
  - method: POST
    path: "/vehicle-classes"
    description: "Create a VehicleClass with its rate card"
    roles: [FleetManager]
    code: 201
    input: [code, tier_rank, daily_rate_cents, weekly_rate_cents, included_miles_per_day, overage_per_mile_cents, ldw_per_day_cents, pai_per_day_cents]
    output: VehicleClass
    side_effects: ["total_count=0, available_count=0"]

  - method: GET
    path: "/vehicle-classes/{id}"
    description: "Get a VehicleClass including denormalized total_count/available_count"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: []
    output: VehicleClass
    side_effects: []

  - method: GET
    path: "/vehicle-classes/{id}/vehicles"
    description: "List vehicles whose class_id == this VehicleClass (reverse-reachability for Vehicle.class_id)"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: ["status?", "location_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # ---- RatePlan ----
  - method: POST
    path: "/rate-plans"
    description: "Create a location/class rate override consulted by reservation_quote"
    roles: [FleetManager]
    code: 201
    input: [location_id, class_id, daily_rate_cents, weekly_rate_cents, effective_from, "active?"]
    output: RatePlan
    side_effects: []

  - method: GET
    path: "/rate-plans"
    description: "List/filter rate plans (reverse-reachability for RatePlan.location_id and RatePlan.class_id)"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: ["location_id?", "class_id?", "active?", "limit?", "offset?"]
    output: RatePlan[]
    side_effects: []

  - method: GET
    path: "/rate-plans/{id}"
    description: "Get a RatePlan"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: []
    output: RatePlan
    side_effects: []

  # ---- Vehicle ----
  - method: POST
    path: "/vehicles"
    description: "Add a Vehicle to a location's fleet"
    roles: [FleetManager]
    code: 201
    input: [location_id, class_id, plate, odometer_miles, fuel_level_eighths]
    output: Vehicle
    side_effects: ["status=AVAILABLE", "class.total_count and class.available_count reconciled (cascade)"]

  - method: GET
    path: "/vehicles"
    description: "List/filter vehicles (reverse-reachability for Vehicle.held_by_reservation_id, class_id, location_id)"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: ["status?", "class_id?", "location_id?", "held_by_reservation_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: GET
    path: "/vehicles/{id}"
    description: "Get a Vehicle"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/vehicles/{id}/hold"
    description: "Reserve a specific AVAILABLE vehicle for a CONFIRMED reservation (OCC-guarded)"
    roles: [RentalAgent]
    code: 200
    input: [reservation_id, expected_vehicle_version]
    output: Vehicle
    side_effects: ["status AVAILABLE->RESERVED", "held_by_reservation_id set", "class.available_count decremented (cascade)", "increments Vehicle.version by 1"]

  - method: POST
    path: "/vehicles/{id}/release"
    description: "Release a RESERVED vehicle back to AVAILABLE without a pickup"
    roles: [RentalAgent]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["status RESERVED->AVAILABLE", "held_by_reservation_id cleared", "class.available_count incremented (cascade)"]

  - method: POST
    path: "/vehicles/{id}/return-to-service"
    description: "Return a MAINTENANCE vehicle to AVAILABLE"
    roles: [FleetManager]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["status MAINTENANCE->AVAILABLE", "class.available_count incremented (cascade)"]

  - method: POST
    path: "/vehicles/{id}/retire"
    description: "Retire an AVAILABLE vehicle out of the fleet"
    roles: [FleetManager]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["status AVAILABLE->RETIRED", "class.total_count and available_count decremented (cascade)"]

  # ---- LoyaltyMember ----
  - method: POST
    path: "/members"
    description: "Register a LoyaltyMember"
    roles: [RentalAgent, Member]
    code: 201
    input: [email, full_name, driver_age]
    output: LoyaltyMember
    side_effects: ["tier=STANDARD", "points_balance=0", "lifetime_points=0", "no_show_strikes=0"]

  - method: GET
    path: "/members/{id}"
    description: "Get a LoyaltyMember including computed points/tier/strikes"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: []
    output: LoyaltyMember
    side_effects: []

  - method: GET
    path: "/members/{id}/reservations"
    description: "List reservations for a member (reverse-reachability for Reservation.member_id)"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/members/{id}/loyalty-accruals"
    description: "List LoyaltyAccrual events for a member (reverse-reachability for LoyaltyAccrual.member_id)"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: LoyaltyAccrual[]
    side_effects: []

  - method: POST
    path: "/members/{id}/redeem"
    description: "Redeem points (emits a REDEMPTION LoyaltyAccrual)"
    roles: [RentalAgent, Member]
    code: 201
    input: [points]
    output: LoyaltyAccrual
    side_effects: ["points_balance recomputed (cascade)"]

  # ---- Reservation ----
  - method: POST
    path: "/reservations"
    description: "Create a QUOTED reservation"
    roles: [RentalAgent, Member]
    code: 201
    input: [member_id, pickup_location_id, dropoff_location_id, class_id, pickup_at, dropoff_at, "ldw_selected?", "pai_selected?"]
    output: Reservation
    side_effects: ["status=QUOTED", "rental_days computed"]

  - method: GET
    path: "/reservations"
    description: "List/filter reservations (reverse-reachability for Reservation.pickup_location_id, dropoff_location_id, class_id)"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: ["pickup_location_id?", "dropoff_location_id?", "class_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/reservations/{id}"
    description: "Get a Reservation"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations/{id}/rental-agreements"
    description: "List rental agreements for a reservation (reverse-reachability for RentalAgreement.reservation_id)"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []

  - method: POST
    path: "/reservations/{id}/upgrade"
    description: "Change the reserved class while QUOTED or CONFIRMED (re-quotes; only an upgrade to a higher tier_rank is allowed)"
    roles: [RentalAgent]
    code: 200
    input: [class_id]
    output: Reservation
    side_effects: ["class_id replaced", "if CONFIRMED: quoted_total_cents recomputed via reservation_quote"]

  - method: POST
    path: "/reservations/{id}/confirm"
    description: "Confirm a QUOTED reservation; freezes quoted_total_cents and the no-show grace deadline"
    roles: [RentalAgent]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status QUOTED->CONFIRMED", "quoted_total_cents frozen via reservation_quote", "hold_expires_at set"]

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a QUOTED or CONFIRMED reservation"
    roles: [Member, RentalAgent]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> CANCELLED", "if a vehicle was RESERVED: release it (cascade)"]

  - method: POST
    path: "/reservations/{id}/no-show"
    description: "Mark a CONFIRMED reservation as a no-show after the grace window"
    roles: [RentalAgent]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status CONFIRMED->NO_SHOW", "release any held vehicle (cascade)", "member.no_show_strikes recomputed"]

  - method: POST
    path: "/reservations/{id}/expire"
    description: "Expire a stale QUOTED reservation (no vehicle was held); driven by an operator on behalf of the system sweep"
    roles: [RentalAgent]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status QUOTED->EXPIRED"]

  # ---- RentalAgreement ----
  - method: POST
    path: "/rental-agreements"
    description: "Pick up: realize a CONFIRMED reservation into an OPEN agreement on a specific vehicle"
    roles: [RentalAgent]
    code: 201
    input: [reservation_id, vehicle_id, odometer_out, fuel_out_eighths]
    output: RentalAgreement
    side_effects: ["Reservation CONFIRMED->PICKED_UP", "Vehicle RESERVED/AVAILABLE->ON_RENT (cascade)", "provisional settlement ledger emitted"]

  - method: GET
    path: "/rental-agreements"
    description: "List/filter rental agreements (reverse-reachability for RentalAgreement.vehicle_id)"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: ["vehicle_id?", "status?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []

  - method: GET
    path: "/rental-agreements/{id}"
    description: "Get a RentalAgreement"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: []

  - method: GET
    path: "/rental-agreements/{id}/loyalty-accruals"
    description: "List loyalty accruals produced by an agreement (reverse-reachability for LoyaltyAccrual.agreement_id)"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyAccrual[]
    side_effects: []

  - method: GET
    path: "/rental-agreements/{id}/ledger-entries"
    description: "List ledger entries for an agreement (reverse-reachability for LedgerEntry.agreement_id)"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/rental-agreements/{id}/incident-reports"
    description: "List incident reports for an agreement (reverse-reachability for IncidentReport.agreement_id)"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []

  - method: POST
    path: "/rental-agreements/{id}/close"
    description: "Return the vehicle and close the agreement; runs final settlement and loyalty accrual"
    roles: [RentalAgent]
    code: 200
    input: [odometer_in, fuel_in_eighths]
    output: RentalAgreement
    side_effects: ["status OPEN->CLOSED", "final settlement ledger emitted", "Vehicle ON_RENT->AVAILABLE or ON_RENT->MAINTENANCE (cascade)", "LoyaltyAccrual emitted; tier re-evaluated (cascade)"]

  - method: POST
    path: "/rental-agreements/{id}/write-off"
    description: "Write off the agreement on a TOTAL-loss incident"
    roles: [FleetManager]
    code: 200
    input: [odometer_in, fuel_in_eighths]
    output: RentalAgreement
    side_effects: ["status OPEN->WRITE_OFF", "final settlement with full damage", "Vehicle ON_RENT->RETIRED (cascade)", "half-rate LoyaltyAccrual emitted (cascade)"]

  # ---- IncidentReport ----
  - method: POST
    path: "/incident-reports"
    description: "File a damage/incident report against an OPEN agreement"
    roles: [RentalAgent, FleetManager]
    code: 201
    input: [agreement_id, severity, assessed_damage_cents]
    output: IncidentReport
    side_effects: ["status=FILED", "member_liability_cents computed via incident_liability"]

  - method: GET
    path: "/incident-reports/{id}"
    description: "Get an IncidentReport"
    roles: [FleetManager, RentalAgent, Member]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []

  - method: POST
    path: "/incident-reports/{id}/resolve"
    description: "Resolve a FILED incident on a closed/written-off agreement"
    roles: [FleetManager]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status FILED->RESOLVED", "member_liability_cents frozen"]

  - method: POST
    path: "/incident-reports/{id}/void"
    description: "Void a FILED incident; reverses any prior DAMAGE ledger charge"
    roles: [FleetManager]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status FILED->VOID", "if a DAMAGE LedgerEntry exists, emit compensating INCIDENT_REVERSAL (cascade); final_total_cents recomputed"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's notion of current UTC (test-driving; grace-window and no-show checks read it)"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_utc set to to_iso8601 for subsequent grace/no-show evaluations"]

  # ---- Test-driving loyalty injection ----
  - method: POST
    path: "/_members/{id}/set_loyalty"
    description: "Inject a member's loyalty standing (tier, lifetime_points, no_show_strikes) for deterministic tests; bypasses the accrual history"
    roles: [FleetManager, RentalAgent]
    code: 200
    input: ["tier?", "lifetime_points?", "points_balance?", "no_show_strikes?"]
    output: LoyaltyMember
    side_effects: ["overwrites the named loyalty fields on the member; tier recomputed from member_tier unless an explicit tier override is supplied"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or Member acting on a reservation it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced Location/VehicleClass/Vehicle/Member/Reservation/Agreement/Incident does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, enum out of range, dropoff_at not after pickup_at, negative constrained integer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_vehicle_version on POST /vehicles/{id}/hold does not match Vehicle.version" }
  - { id: ERR_CLASS_MISMATCH, http: 409, condition: "Vehicle class/location does not match the reservation's class/pickup location" }
  - { id: ERR_VEHICLE_NOT_AVAILABLE, http: 409, condition: "Hold attempted on a vehicle whose status != AVAILABLE" }
  - { id: ERR_MEMBER_BLOCKED, http: 409, condition: "Member has reached NO_SHOW_STRIKE_LIMIT and cannot confirm new reservations" }
  - { id: ERR_WITHIN_GRACE, http: 409, condition: "No-show declared before the grace window elapsed (current_utc <= hold_expires_at)" }
  - { id: ERR_GRACE_WINDOW_EXPIRED, http: 409, condition: "Pickup or cancel attempted after the grace window (current_utc > hold_expires_at)" }
  - { id: ERR_ODOMETER_ROLLBACK, http: 409, condition: "odometer_in < odometer_out on close" }
  - { id: ERR_TOTAL_LOSS_REQUIRES_WRITEOFF, http: 409, condition: "Close attempted on an agreement carrying a FILED TOTAL-severity incident" }
  - { id: ERR_NO_TOTAL_INCIDENT, http: 409, condition: "Write-off attempted on an agreement with no TOTAL-severity incident" }
  - { id: ERR_NO_AVAILABILITY, http: 409, condition: "No AVAILABLE vehicle of the reserved class at the pickup location (available_count < 1)" }
  - { id: ERR_AGREEMENT_STILL_OPEN, http: 409, condition: "Incident resolve attempted while its parent agreement is still OPEN" }
  - { id: ERR_OPEN_INCIDENT, http: 409, condition: "Return-to-service attempted while a FILED incident remains on the vehicle's last agreement" }
  - { id: ERR_NOT_AN_UPGRADE, http: 409, condition: "Upgrade target class tier_rank is not strictly higher than the current reserved class" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 409, condition: "Redemption requested for more points than the member's points_balance" }
  - { id: ERR_VEHICLE_DOUBLE_BOOKED, http: 409, condition: "Hold attempted on a vehicle whose current active commitment (RESERVED-hold or ON_RENT agreement) has a [pickup_at, dropoff_at) interval overlapping the target reservation's interval (half-open: shared boundary instant does not overlap)" }
  - { id: ERR_LOCATION_CLASS_CAPACITY, http: 409, condition: "Confirming would make the count of class commitments at the pickup location whose intervals overlap the new interval exceed the location's fleet of that class (aggregate-capacity overlap)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FleetManager
    description: "Owns the physical fleet and rate card: locations, classes, vehicles, fleet lifecycle (retire/return-to-service), write-offs and incident adjudication (resolve/void)."
    identity: "opaque"
    exclusive_operations:
      - "POST /locations"
      - "POST /vehicle-classes"
      - "POST /rate-plans"
      - "POST /vehicles"
      - "POST /vehicles/{id}/return-to-service"
      - "POST /vehicles/{id}/retire"
      - "POST /rental-agreements/{id}/write-off"
      - "POST /incident-reports/{id}/resolve"
      - "POST /incident-reports/{id}/void"
    shared_operations:
      - "GET endpoints (locations, classes, vehicles, members, reservations, agreements, incidents, ledger, accruals)"
      - "POST /incident-reports"

  - name: RentalAgent
    description: "Runs the rental counter: quotes, confirms, holds vehicles, processes pickups/returns, declares no-shows, files incidents."
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicles/{id}/hold"
      - "POST /vehicles/{id}/release"
      - "POST /reservations/{id}/upgrade"
      - "POST /reservations/{id}/confirm"
      - "POST /reservations/{id}/no-show"
      - "POST /reservations/{id}/expire"
      - "POST /rental-agreements"
      - "POST /rental-agreements/{id}/close"
    shared_operations:
      - "POST /reservations (also Member)"
      - "POST /reservations/{id}/cancel (also Member)"
      - "POST /members (also Member)"
      - "POST /members/{id}/redeem (also Member)"
      - "POST /incident-reports (also FleetManager)"
      - "GET endpoints"

  - name: Member
    description: "The renting customer. Acts only on their own member record and reservations; X-User-ID equals their LoyaltyMember.id."
    identity: "entity_backed:LoyaltyMember"
    exclusive_operations: []
    shared_operations:
      - "POST /reservations (own member_id only)"
      - "POST /reservations/{id}/cancel (own reservation only)"
      - "POST /members (self-registration)"
      - "POST /members/{id}/redeem (own account only)"
      - "GET endpoints scoped to own member/reservations/agreements"
