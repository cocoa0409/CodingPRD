            - call: "GET /households/${h58_id}"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mt58_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-11T10:00:00Z", end_iso: "2026-08-11T10:29:00Z", station_code: "WBBB", tuning_minutes: 29 }
              as: MethodologyStatistician
              captures: { ti58b_id: "$.data.id" }
            - call: "GET /households/${h58_id}"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mt58_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-12T10:00:00Z", end_iso: "2026-08-12T10:15:00Z", station_code: "WCCC", tuning_minutes: 15 }
              as: MethodologyStatistician
              captures: { ti58c_id: "$.data.id" }
            - call: "GET /households/${h58_id}"
