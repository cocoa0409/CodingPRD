            - call: "POST /allocation-runs/${run_sd}/publish"
              payload: {}
              as: DistributorAdmin
              captures: { err_sd: $.data.error_id }
          assert:
            - "InventoryLot.${lot_sd}.status == QUARANTINED (sweep fired)"
