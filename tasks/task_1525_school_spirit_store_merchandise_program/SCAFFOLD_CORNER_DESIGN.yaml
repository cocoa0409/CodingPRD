            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 1000, deposit_pct: 0.4, goal_units: 1, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var}", customer_user_id: "cust-01", qty: 1 }, as: Customer, as_user_id: "cust-01", captures: { dep: $.data.deposit_due_cents, bal: $.data.balance_due_cents } }
