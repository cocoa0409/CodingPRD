        grounds: ["validations[priority=12]", "errors[ERR_CONTRACT_VOLUME_EXCEEDED]", entities.RetailerContract.fields.max_open_dozen]
        distinguishing_aspect: "With state/claim checks all passing (lot RELEASED, contract ACTIVE, claim NONE), the fiscal cap fires: allocated_dozen 20 + 20 > max_open_dozen 30 -> ERR_CONTRACT_VOLUME_EXCEEDED. Complements the §1.8 priority instance where the same cap is shadowed by a state error."
