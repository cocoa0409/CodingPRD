          setup:
            - "The reporter has one APPROVED consulting engagement covering 2026-09-01 to 2026-09-10"
            - "The reporter has no pending conflict disclosures and no restricted beats"
            - "Two further requests are on file: one starting exactly on 2026-09-10 and one overlapping the approved window"
