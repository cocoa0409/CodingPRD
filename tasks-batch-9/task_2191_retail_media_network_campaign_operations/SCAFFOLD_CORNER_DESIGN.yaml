              call: "POST /rmn/incrementality-studies"
              payload: { campaign_id: "${camp_id}", design_method: "GEO_HOLDOUT", holdout_pct: 0.1, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-08T00:00:00Z", expected_campaign_version: "${camp_v2}" }
              as: MeasurementAnalyst
