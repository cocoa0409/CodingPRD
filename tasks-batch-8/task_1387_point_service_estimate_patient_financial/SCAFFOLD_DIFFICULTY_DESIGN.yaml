  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: finalize_gfe_dispute_escalation_regresses_case
        grounds:
          - state_machines.Estimate.ACCEPTED_to_FINALIZED
          - state_machines.FinancialClearanceCase.CLEARED_to_IN_REVIEW
          - calculations.gfe_dispute_eligibility
        distinguishing_aspect: |
          Depth-3 chain: finalize (Estimate ACCEPTED->FINALIZED) creates a
          VarianceRecord whose dispute_eligible=true itself triggers a
          GFE_DISPUTE Escalation (OPEN), whose OPEN state flips
          case.escalation_cleared and regresses the case CLEARED -> IN_REVIEW.
          Trigger differs from the sibling (deposit refund).
        test_recipe:
          setup:
            - "Charge 27447 list 5000000, requires_auth_prior true (GFE mode ignores it)"
            - "Patient with case (service 2026-08-20); GFE estimate [27447 x1] priced (gfe_total 3750000, high-dollar auto-escalation OPEN), escalation APPROVED by supervisor, estimate PRESENTED (within 2026-08-06 deadline) and ACCEPTED (required deposit 937500)"
            - "Deposit 937500 POSTED; case CLEARED"
            - "Clock at 2026-08-03T09:00:00Z throughout"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Total knee arthroplasty", list_price_cents: 5000000, requires_auth_prior: true }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-G-1", full_name: "Pat Gfe", date_of_birth: "1975-08-08" }
              as: Registrar
              captures: { pat_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee replacement (self-pay)" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "UNINSURED_GFE", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
              captures: { gfe_total: $.data.gfe_total_cents }
            - call: "GET /clearance/cases/${case_id}/escalations"
              as: ClearanceSupervisor
              captures: { esc_hd: "$.data[0].id" }
            - call: "POST /clearance/escalations/${esc_hd}/approve"
              payload: { decision_note: "high-dollar reviewed" }
              as: ClearanceSupervisor
              as_user_id: "sup-1"
            - call: "POST /clearance/estimates/${est_id}/present"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_id}/accept"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/cases/${case_id}/deposits"
              payload: { amount_cents: 937500, method: "CARD" }
              as: FinancialCounselor
              captures: { dep_id: $.data.id }
            - call: "POST /clearance/deposits/${dep_id}/post"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/cases/${case_id}/clear"
              payload: {}
              as: ClearanceSupervisor
              captures: { cleared_status: $.data.status }
          trigger:
            - call: "POST /clearance/estimates/${est_id}/finalize"
              payload: { actual_billed_cents: 3790000 }
              as: FinancialCounselor
              captures: { est_status: $.data.status, est_dispute: $.data.dispute_eligible }
            - call: "GET /clearance/estimates/${est_id}/variance-records"
              as: ClearanceSupervisor
              captures: { vr_class: "$.data[0].classification", vr_dispute: "$.data[0].dispute_eligible", vr_var: "$.data[0].variance_vs_accepted_cents" }
            - call: "GET /clearance/cases/${case_id}/escalations"
              as: ClearanceSupervisor
              captures: { esc_count_probe: "$.data[1].reason" }
            - call: "GET /clearance/cases/${case_id}"
              as: ClearanceSupervisor
              captures: { case_status: $.data.status, case_esc_cleared: $.data.escalation_cleared }
            - call: "GET /clearance/cases/${case_id}/deposits"
              as: ClearanceSupervisor
              captures: { dep_status: "$.data[0].status", dep_applied: "$.data[0].applied_amount_cents" }
          assert:
            - "pre-trigger: case was CLEARED (${cleared_status} == CLEARED)"
            - "Estimate.${est_id}.status == FINALIZED and dispute_eligible == true (3790000 - 3750000 = 40000 >= 40000)"
            - "link 1: VarianceRecord created with variance_vs_accepted_cents == 40000, classification == WITHIN_TOLERANCE (1.07 pct), dispute_eligible == true"
            - "link 2: a second Escalation exists with reason GFE_DISPUTE, status OPEN, opened_by_user_id == \"system\", trigger_amount_cents == 40000"
            - "link 3: Case.${case_id}.status == IN_REVIEW (regressed from CLEARED) and escalation_cleared == false"
            - "deposit application: Deposit.${dep_id}.status == APPLIED with applied_amount_cents == 937500"

      - name: deposit_refund_ledger_posture_regression
        grounds:
          - state_machines.Deposit.POSTED_to_REFUNDED
          - state_machines.FinancialClearanceCase.CLEARED_to_IN_REVIEW
          - calculations.deposit_refund_amount
        distinguishing_aspect: |
          Depth-2 chain: the refund transition mutates the case ledger
          (deposit_posted_cents -= 125000), and that ledger mutation itself
          recomputes deposit_satisfied and regresses the case CLEARED ->
          IN_REVIEW. Trigger (deposit refund) differs from the sibling's
          (estimate finalize); chain depth 2 vs 3.
        test_recipe:
          setup:
            - "INS-A fixture: charge 27447; contract ACME (MPR 50) rate 3000000; patient with snapshot (ded 150000/50000, oop 600000/100000, coins 20); case service 2026-08-20"
            - "Estimate priced (resp 500000), presented, ACCEPTED (required deposit 125000, auth_required true)"
            - "Authorization for 27447 APPROVED (valid 2026-08-10..2026-08-31) by a second reviewer"
            - "Deposit 125000 POSTED; case CLEARED"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Total knee arthroplasty", list_price_cents: 5000000, requires_auth_prior: true }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "MULTIPLE_PROCEDURE_REDUCTION", reduction_pct: 50 }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-R-1", full_name: "Pat Refund", date_of_birth: "1976-09-09" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-R", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee replacement" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_id}/present"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_id}/accept"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/cases/${case_id}/authorizations"
              payload: { cpt_codes: ["27447"], payer_code: "ACME" }
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { auth_id: $.data.id }
            - call: "POST /clearance/authorizations/${auth_id}/decide"
              payload: { decision: "APPROVED", medical_necessity_met: true, valid_from: "2026-08-10", valid_to: "2026-08-31" }
              as: UtilizationReviewer
              as_user_id: "ur-2"
            - call: "POST /clearance/cases/${case_id}/deposits"
              payload: { amount_cents: 125000, method: "CARD" }
              as: FinancialCounselor
              captures: { dep_id: $.data.id }
            - call: "POST /clearance/deposits/${dep_id}/post"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/cases/${case_id}/clear"
              payload: {}
              as: ClearanceSupervisor
          trigger:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/deposits/${dep_id}/refund"
              payload: {}
              as: ClearanceSupervisor
              captures: { dep_status: $.data.status, dep_refund: $.data.refund_amount_cents }
            - call: "GET /clearance/cases/${case_id}"
              as: ClearanceSupervisor
              captures: { case_status: $.data.status, case_posted: $.data.deposit_posted_cents, case_dep_sat: $.data.deposit_satisfied }
          assert:
