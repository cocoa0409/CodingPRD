  - rule_id: boundary_precision_check
    instances:

      - name: control_total_variance_bp_at_the_exact_client_tolerance_edge
        grounds:
          - calculations.data_file_control_reconciliation
          - entities.Client.fields.control_total_tolerance_bp
          - state_machines.DataFile.FORMAT_VALIDATED_to_ACCEPTED
          - state_machines.DataFile.FORMAT_VALIDATED_to_HELD_VARIANCE
        distinguishing_aspect: |
          The metric is the rounded basis-point variance on POST /bureau/data-files/{id}/control-check
          and the edge is one cent wide: 197 cents over 360000 rounds to exactly 5 bp and is accepted
          on the inclusive comparison, while 198 cents rounds 5.5 up to 6 bp and is held — so both
          round_half_up and the inclusive <= must be right, and truncation would wrongly accept 198.
        test_recipe:
          setup:
            - "Client CL-TE at the default control_total_tolerance_bp of 5, dr_readiness_required false."
            - "DataFile A declares 2 records / 360000 cents and carries records of 180000 and 180197 cents: variance 197."
            - "DataFile B declares 2 records / 360000 cents and carries records of 180000 and 180198 cents: variance 198."
            - "Both files pass validate-format first so both sit in FORMAT_VALIDATED with format_error_count 0; only the last cent differs between them."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-TE", name: "Tolerance Edge Bancorp", dr_readiness_required: false, control_total_tolerance_bp: 5 }
              as: BureauAdmin
              captures: { te_client_id: "$.data.id" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${te_client_id}", file_name: "te-edge-accept.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 360000 }
              as: ClientLiaison
              captures: { te_file_a: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${te_file_a}", account_ref: "ACC1401", sequence_no: 1, statement_amount_cents: 180000, address_line1: "1 Tolerance Way", city: "Boise", region_code: "ID", postal_code: "83702", postal_code_plus4: "3301" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${te_file_a}", account_ref: "ACC1402", sequence_no: 2, statement_amount_cents: 180197, address_line1: "2 Tolerance Way", city: "Boise", region_code: "ID", postal_code: "83702", postal_code_plus4: "3302" }
              as: ClientLiaison
            - call: "POST /bureau/data-files"
              payload: { client_id: "${te_client_id}", file_name: "te-edge-hold.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 360000 }
              as: ClientLiaison
              captures: { te_file_b: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${te_file_b}", account_ref: "ACC1403", sequence_no: 1, statement_amount_cents: 180000, address_line1: "3 Tolerance Way", city: "Boise", region_code: "ID", postal_code: "83702", postal_code_plus4: "3303" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${te_file_b}", account_ref: "ACC1404", sequence_no: 2, statement_amount_cents: 180198, address_line1: "4 Tolerance Way", city: "Boise", region_code: "ID", postal_code: "83702", postal_code_plus4: "3304" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${te_file_a}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${te_file_b}/validate-format"
              payload: {}
              as: CompositionOperator
          trigger:
            - call: "POST /bureau/data-files/${te_file_a}/control-check"
              payload: {}
              as: CompositionOperator
              captures: { te_bp_a: "$.data.control_total_variance_bp", te_status_a: "$.data.status" }
            - call: "POST /bureau/data-files/${te_file_b}/control-check"
              payload: {}
              as: CompositionOperator
              captures: { te_bp_b: "$.data.control_total_variance_bp", te_status_b: "$.data.status" }
          assert:
            - "On the accepting side: DataFile.${te_file_a}.actual_control_total_cents == 360197, control_total_variance_cents == 197, record_count_variance == 0"
            - "On the accepting side: ${te_bp_a} == 5 (round_half_up(197 * 10000 / 360000) == round_half_up(5.4722)) and ${te_status_a} == ACCEPTED, accepted_at == 2026-08-01T00:00:00Z"
            - "On the holding side: DataFile.${te_file_b}.actual_control_total_cents == 360198 and control_total_variance_cents == 198"
            - "On the holding side: ${te_bp_b} == 6 (round_half_up(198 * 10000 / 360000) == round_half_up(5.5000), which rounds UP, not down) and ${te_status_b} == HELD_VARIANCE with accepted_at null"
            - "The two files differ by exactly one cent of variance, and 5 <= 5 passes while 6 <= 5 fails: the comparison is inclusive on the lower edge"
            - "Neither file's amendment_count changed: both read 0"

