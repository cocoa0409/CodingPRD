          rationale: "Projection replay (estimated/final/payable/entry_count) asserted at three points of the ledger invariant instance."

  # ===================================================== 6. Errors
  - section: errors
    instances:
      - name: error_merchant_suspended_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_MERCHANT_SUSPENDED]"]
        excluded_because: { difficulty_instance: order_create_requires_merchant_active, rationale: "Asserted as the failure path there." }
      - name: error_dim_exceeds_xl_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DIM_EXCEEDS_XL]"]
        excluded_because: { difficulty_instance: locker_xl_dim_boundary_150_accepted_151_rejected, rationale: "Asserted at the 150.01 boundary there." }
      - name: error_route_not_dispatched_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROUTE_NOT_DISPATCHED]"]
        excluded_because: { difficulty_instance: tote_dispatch_requires_route_dispatched, rationale: "Asserted as the failure path there." }
      - name: error_location_not_operational_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOCATION_NOT_OPERATIONAL]"]
        excluded_because: { difficulty_instance: reservation_requires_location_operational, rationale: "Asserted as the failure path there." }
      - name: error_slot_unavailable_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SLOT_UNAVAILABLE]"]
        excluded_because: { difficulty_instance: slot_live_hold_exclusive_interval, rationale: "Asserted as the overlap rejection there." }
      - name: error_pickup_window_full_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PICKUP_WINDOW_FULL]"]
        excluded_because: { difficulty_instance: zone_window_aggregate_capacity_overlap, rationale: "Asserted as the (N+1)-th rejection there." }
      - name: error_tote_weight_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TOTE_WEIGHT_EXCEEDED]"]
        excluded_because: { difficulty_instance: tote_weight_exact_30000_allowed_30001_rejected, rationale: "Asserted at the 30001st gram there." }
      - name: error_reservation_expired_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESERVATION_EXPIRED]"]
        excluded_because: { difficulty_instance: reservation_consume_hold_until_time_boundary, rationale: "Asserted at exactly hold_until there." }
      - name: error_appeal_limit_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPEAL_LIMIT_REACHED]"]
        excluded_because: { difficulty_instance: exception_case_appeal_reopen_cycle, rationale: "Asserted on the third appeal there." }
      - name: error_billing_period_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BILLING_PERIOD_OVERLAP]"]
        excluded_because: { difficulty_instance: billing_period_half_open_adjacency, rationale: "Asserted on the overlapping third cycle there." }

      - name: error_feature_not_included_pickup_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_FEATURE_NOT_INCLUDED]", "validations[priority=9]"]
        distinguishing_aspect: "HOME_PICKUP create on a plan with pickup_enabled=false fails with ERR_FEATURE_NOT_INCLUDED."
        test_recipe:
          setup: ["Plan pickup_enabled=false; merchant; cycle; shopper"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-FN", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sfn@x.com", full_name: "S FN", postal_code: "30043" }, as: Shopper, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "FN", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FEATURE_NOT_INCLUDED"]

      - name: error_oversize_not_supported_plan_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_OVERSIZE_NOT_SUPPORTED]", "validations[priority=8]"]
        distinguishing_aspect: "COUNTER_DROP order with a 200 cm item on a plan with oversize_enabled=false fails with ERR_OVERSIZE_NOT_SUPPORTED (locker dim cap not implicated)."
        test_recipe:
          setup: ["Plan oversize_enabled=false; merchant; cycle; shopper"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: false, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-ON", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "son@x.com", full_name: "S ON", postal_code: "30044" }, as: Shopper, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "ON", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 200, weight_grams: 9000 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_OVERSIZE_NOT_SUPPORTED"]

      - name: error_label_method_mismatch_boxless
        claim_type: violation_to_error
        grounds: ["errors[ERR_LABEL_METHOD_MISMATCH]"]
        distinguishing_aspect: "A boxless order rejects a CARRIER_LABEL issue with ERR_LABEL_METHOD_MISMATCH (QR_CODE forced)."
        test_recipe:
          setup: ["COUNTER_DROP order created with boxless=true"]
