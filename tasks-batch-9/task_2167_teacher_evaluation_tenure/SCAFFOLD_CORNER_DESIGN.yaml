              as_user_id: "${edu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "error_id == ERR_UNAUTHORIZED"
            - "GET /evaluation-cycles filtered by educator_id ${edu_id} returns an empty array"

