          Metric = donor weight_kg band edges; endpoint = POST
          /donation-visits/{id}/check-in. Lower edge is inclusive, upper exclusive:
          67.9 kg programs 625 mL while exactly 68.0 kg programs 690 mL — a 0.1 kg
          difference flips the band, and 68.0 must NOT fall into the < 68.0 band.
