              payload: { escrow_file_id: "${file_b}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_b: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_b}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_b}/approvals"
              as: EscrowOfficer
              captures: { ap_b: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_b}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
          trigger:
