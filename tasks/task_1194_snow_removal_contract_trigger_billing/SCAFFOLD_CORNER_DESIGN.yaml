            - { call: "POST /disputes/${dD}/submit-evidence", payload: { evidence_note: "Our gauge read 0.8 in" }, as: ClientContact, as_user_id: "${cl}", captures: { dD_s1: $.data.status } }
            - { call: "POST /disputes/${dD}/request-evidence", payload: { note: "Need dated photos" }, as: OpsDispatcher, captures: { dD_s2: $.data.status } }
            - { call: "POST /disputes/${dD}/submit-evidence", payload: { evidence_note: "Photos attached separately; stand by gauge" }, as: ClientContact, as_user_id: "${cl}", captures: { dD_s3: $.data.status } }
          trigger:
            - { call: "POST /disputes/${dD}/resolve", payload: { outcome: "UPHELD" }, as: OpsDispatcher, as_user_id: "disp-2", captures: { dD_final: $.data.status, dD_credit: $.data.resolution_credit_cents } }
            - { call: "GET /invoices/${invD}", as: OpsDispatcher, captures: { invD_total: $.data.total_cents, invD_credit: $.data.credit_cents } }
            - { call: "GET /visits/${vD}", as: OpsDispatcher, captures: { vD_bill: $.data.billing_status } }
          assert:
