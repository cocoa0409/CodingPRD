    side_effects: ["Listing ACTIVE/BACK_ON_MARKET -> TERMINATED", "Invoice DEFERRED_CLOSING -> ESCALATED with CLOSING_ESCALATION_FEE booked", "Project.payment_state DEFERRED -> ESCALATED and Project.fiscal_hold := true"]

