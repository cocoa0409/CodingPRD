            - "ClosingStatement.${stmt_id}.cash_to_close_cents == 24415014 (25000000 - 0 + (-84986) + 0 - 500000)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (two machines on DIFFERENT entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_estoppel_negotiation_cycle_on_lease_entity
        grounds:
