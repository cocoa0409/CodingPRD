        distinguishing_aspect: "With the role held constant at Lessee and the path held constant at account B, X-User-ID A is refused 403 ERR_FORBIDDEN while X-User-ID B succeeds 200 — the denial is keyed on the X-User-ID-to-path-id match, not on the role or the path."
        test_recipe:
          setup:
