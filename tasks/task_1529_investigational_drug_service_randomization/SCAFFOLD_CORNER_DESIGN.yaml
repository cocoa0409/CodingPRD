          trigger:
            - { call: "POST /api/subjects/${sub}/transition", payload: { to: "SCREEN_FAILED", reason: "labs" }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/subjects/${sub}/transition", payload: { to: "SCREENING" }, as: Pharmacist, as_user_id: "${p1}", captures: { rc: $.data.rescreen_count, st: $.data.enrollment_status } }
