  - method: POST
    path: "/shift-assignments/{shiftId}/activate"
    description: "Moves a ShiftAssignment SCHEDULED -> ACTIVE and freezes capacity_units_effective. Only an ACTIVE shift whose interval contains clock_now can fund a CareAssignment. An OR_STANDBY slot additionally demands or_circulating_qualified and drill_currency_state == CURRENT, which is the lever that lifts unit.cesarean_readiness_state out of DEGRADED."
    roles: [ChargeNurse]
    code: 200
    input: []
    input_types: {}
    output: ShiftAssignment
    validation_priorities: [1, 2, 3, 8, 8.08, 11.1, 11.2]
    transitions: ["ShiftAssignment.status SCHEDULED -> ACTIVE"]
    side_effects:
      - "capacity_units_effective := calc staff_capacity_units snapshot for this role_slot"
      - "Recompute calc cesarean_readiness_derivation and calc unit_posture_derivation; increments shift.version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_SHIFT_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_SHIFT_WINDOW_NOT_CURRENT, ERR_STAFF_CREDENTIAL_EXPIRED, ERR_OR_STANDBY_NOT_QUALIFIED]

  - method: POST
    path: "/shift-assignments/{shiftId}/relieve"
    description: "Hands off an ACTIVE shift to a relieving ACTIVE shift of the same unit and role_slot with a different staff_id, re-pointing every ACTIVE CareAssignment. The old shift is credited exactly acuity_units_consumed and the relieving shift debited the same amount, so invariant acuity_load_conservation holds across the handoff; encounters left short fall to COVERAGE_BREACH."
    roles: [ChargeNurse]
    code: 200
    input: [relieved_by_shift_id]
