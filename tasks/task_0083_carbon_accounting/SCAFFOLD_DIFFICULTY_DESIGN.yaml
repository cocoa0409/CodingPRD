scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: scope2_location_vs_market_on_report
        grounds:
          - calculations.report_net_emissions
          - calculations.report_compile_totals
          - entities.Report.fields.gross_scope2_location_kg_co2e
          - entities.Report.fields.gross_scope2_market_kg_co2e
          - endpoints.GET /organizations/{org_id}/reports/{id}/dual-scope2
        distinguishing_aspect: |
          Operates on the Report entity domain — two valid net-emissions algorithms
          (variant net_with_location_scope2 vs net_with_market_scope2) consume identical
          underlying activity data but pull different EmissionFactor rows
          (scope2_method == LOCATION_BASED vs MARKET_BASED), producing different
          Report.net_emissions_kg_co2e values for the same period.
        test_recipe:
          setup:
            - "Create Organization with consolidation_approach=FINANCIAL_CONTROL, materiality_threshold_pct=0.00."
            - "Create Facility with financial_control=true, country_code='US' (so it is in boundary)."
            - "Create ReportingPeriod 2025-01-01..2026-01-01 with revenue=1000000, headcount=10, unit_output=100."
            - "Create FactorManager-approved location-based factor: code='GRID-US', scope2_method=LOCATION_BASED, gas_type=CO2, kg_per_unit=0.500000, effective_from=2024-12-01."
            - "Create FactorManager-approved market-based factor: code='REC-US', scope2_method=MARKET_BASED, gas_type=CO2, kg_per_unit=0.200000, effective_from=2024-12-01."
            - "Create EmissionSource S_LOC with category=PURCHASED_ENERGY, gas_type=CO2, factor_code='GRID-US'."
            - "Create EmissionSource S_MKT with category=PURCHASED_ENERGY, gas_type=CO2, factor_code='REC-US'."
            - "POST activity-data on each source with quantity=10000.0000 kWh, data_source=METER_READING, window inside the period."
          trigger:
            - "POST /organizations/{org_id}/reports (standard=GHG_PROTOCOL)."
            - "POST /organizations/{org_id}/reports/{report_id}/compile."
            - "GET  /organizations/{org_id}/reports/{report_id}/dual-scope2."
          assert:
            - "Report.gross_scope2_location_kg_co2e == 5000.0000  # 10000 * 0.500000 * 1 (GWP CO2)"
            - "Report.gross_scope2_market_kg_co2e   == 2000.0000  # 10000 * 0.200000 * 1"
            - "dual-scope2 response.net_with_location_scope2 == 5000.0000"
            - "dual-scope2 response.net_with_market_scope2   == 2000.0000"
            - "dual-scope2 response.delta_kg_co2e == 3000.0000"

      - name: equity_share_vs_financial_control_on_facility
        grounds:
          - calculations.facility_inclusion_resolver
          - calculations.report_compile_totals
          - entities.Facility.fields.included_in_boundary
          - entities.Facility.fields.ownership_share_pct
          - entities.Facility.fields.financial_control
          - endpoints.PATCH /organizations/{org_id}
        distinguishing_aspect: |
          Operates on the Facility entity domain — variants equity_share_inclusion
          and financial_control_inclusion produce different included_in_boundary values
          and different per-facility consolidation weights for the same Facility row,
          yielding different Report.gross_scope1_kg_co2e totals from identical activity data.
        test_recipe:
          setup:
            - "Create Organization with consolidation_approach=EQUITY_SHARE."
            - "Create Facility F with ownership_share_pct=30.00, financial_control=true, operational_control=false."
            - "Create reporting period, factor with kg_per_unit=1.000000, gas_type=CO2, source on F with stationary combustion."
            - "Post one activity-data row with quantity=1000.0000."
            - "Create Report R1, compile it."
            - "PATCH /organizations/{org_id} with consolidation_approach=FINANCIAL_CONTROL (admin)."
            - "Reopen R1 (REVISIONS_REQUIRED→DRAFT or recreate Report R2)."
          trigger:
            - "POST /organizations/{org_id}/reports (R2) and compile it under FINANCIAL_CONTROL."
          assert:
            - "Under EQUITY_SHARE: R1.gross_scope1_kg_co2e == 300.0000  # 1000 * 1.0 * 1 * 0.30"
            - "Under FINANCIAL_CONTROL: R2.gross_scope1_kg_co2e == 1000.0000  # 1000 * 1.0 * 1 * 1.00"
            - "Facility.included_in_boundary remains true under both approaches (both conditions satisfied)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: emission_record_three_input_nonlinear_formula
        grounds:
          - calculations.emission_record_kg_co2e
          - entities.EmissionRecord.fields.kg_co2e
          - entities.EmissionRecord.fields.gwp_factor
          - entities.EmissionFactor.fields.kg_per_unit
        distinguishing_aspect: |
          Mode (a) — three multiplicative inputs (ActivityData.quantity * EmissionFactor.kg_per_unit
          * GWP_TABLE[source.gas_type]) where the GWP factor is conditionally selected from a 7-entry
          table by source.gas_type (non-linear branch on entity state), and EmissionFactor is itself
          conditionally selected by effective_from <= activity_start with effective_to fallback.
        test_recipe:
          setup:
            - "Create org, facility, period, source S with gas_type=N2O, factor code='N2O-MOBILE'."
            - "Approve factor N2O-MOBILE v1 with kg_per_unit=0.001000, effective_from=2025-01-01."
          trigger:
            - "POST activity-data on S with quantity=500.0000 and activity_start=2025-06-15."
          assert:
            - "EmissionRecord.gwp_factor == 265  # N2O GWP-100 from GWP_TABLE"
            - "EmissionRecord.kg_co2e == 132.5000  # 500.0000 * 0.001000 * 265, round_half_up to 4dp"

      - name: report_compile_round_per_subtotal_then_sum
        grounds:
          - calculations.report_compile_totals
          - entities.Report.fields.gross_scope1_kg_co2e
          - entities.Facility.fields.ownership_share_pct
        distinguishing_aspect: |
          Mode (b) — rounding-order matters: report_compile_totals pins
          "round per facility-scope subtotal first, then sum subtotals", which produces a
          different result than "sum unrounded contributions then round once" when
          ownership weights generate trailing-half digits at the 4th decimal across multiple facilities.
        test_recipe:
          setup:
            - "Organization with consolidation_approach=EQUITY_SHARE."
            - "Facility A: ownership_share_pct=33.33; Facility B: ownership_share_pct=66.67."
            - "Both facilities have one stationary source with gas_type=CO2, factor kg_per_unit=1.000000."
            - "Post activity-data 100.0001 on A, 100.0001 on B, into the same period."
          trigger:
            - "POST /reports + /compile."
          assert:
            - "per-facility subtotal A = round_half_up(100.0001 * 1.0 * 1 * 0.3333, 4) = 33.3333"
            - "per-facility subtotal B = round_half_up(100.0001 * 1.0 * 1 * 0.6667, 4) = 66.6707"
            - "Report.gross_scope1_kg_co2e == 100.0040  # sum of rounded subtotals (33.3333 + 66.6707), NOT 100.0001 from round-once-at-end"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_review_cycle_with_revert
        grounds:
          - state_machines.Report.UNDER_REVIEW_to_REVISIONS_REQUIRED
          - state_machines.Report.REVISIONS_REQUIRED_to_DRAFT
          - state_machines.Report.DRAFT_to_UNDER_REVIEW
          - state_machines.Report.UNDER_REVIEW_to_RECOMPUTE_REQUIRED
          - state_machines.Report.RECOMPUTE_REQUIRED_to_DRAFT
        distinguishing_aspect: |
          Cyclic shape on the Report entity — DRAFT→UNDER_REVIEW→REVISIONS_REQUIRED→DRAFT
          (and the parallel RECOMPUTE_REQUIRED→DRAFT loop), so a Report can re-enter DRAFT
          an unbounded number of times. Reopen resets pinned totals (compiled_at=null), which
          is a non-trivial side effect on revisit.
        test_recipe:
          setup:
            - "Org, facility, period, factor, source, activity-data, Report R."
            - "Compile R → UNDER_REVIEW (totals pinned)."
          trigger:
            - "POST /reports/{R}/request-revisions → REVISIONS_REQUIRED."
            - "POST /reports/{R}/reopen → DRAFT (totals reset)."
            - "POST /reports/{R}/compile → UNDER_REVIEW (totals re-pinned)."
          assert:
            - "After reopen: R.compiled_at == null and R.gross_scope1_kg_co2e == null"
            - "After second compile: R.status == 'UNDER_REVIEW' and R.compiled_at is fresh ISO timestamp"
            - "R.version has incremented strictly across the cycle (>= 4 mutations)"

      - name: carbon_credit_branching_terminal
        grounds:
          - state_machines.CarbonCredit.PURCHASED_to_RETIRED
          - state_machines.CarbonCredit.PURCHASED_to_TRANSFERRED
          - entities.CarbonCredit.fields.status
        distinguishing_aspect: |
          Branching shape on the CarbonCredit entity — PURCHASED forks to two mutually
          exclusive terminal states {RETIRED, TRANSFERRED} with divergent side-effect
          sets (RETIRED recomputes Report.applied_offsets, TRANSFERRED does not).
        test_recipe:
          setup:
            - "Org, period, ReductionProject P (EXTERNAL_OFFSET, ACTIVE)."
            - "Create CarbonCredit C1 (PURCHASED) and C2 (PURCHASED) on P."
          trigger:
            - "POST /credits/{C1}/retire (with retirement_certificate_url)."
            - "POST /credits/{C2}/transfer."
          assert:
            - "C1.status == 'RETIRED' and C1.retired_at is non-null"
            - "C2.status == 'TRANSFERRED' and C2.retired_at == null"
            - "Attempting POST /credits/{C1}/transfer now returns ERR_INVALID_STATE (409)"
            - "Attempting POST /credits/{C2}/retire now returns ERR_INVALID_STATE (409)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: factor_approve_cascade_depth_3
        grounds:
          - state_machines.EmissionFactor.DRAFT_to_ACTIVE
          - state_machines.EmissionFactor.ACTIVE_to_SUPERSEDED
          - state_machines.Report.DRAFT_to_RECOMPUTE_REQUIRED
          - state_machines.Report.UNDER_REVIEW_to_RECOMPUTE_REQUIRED
          - entities.EmissionRecord.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /factors/{id}/approve: hop 1 supersedes the
          predecessor EmissionFactor (ACTIVE→SUPERSEDED); that supersession causes hop 2,
          flipping every EmissionRecord pinned to the predecessor from FRESH→STALE;
          which causes hop 3, flipping every DRAFT/UNDER_REVIEW Report on the affected
          periods to RECOMPUTE_REQUIRED. Each hop is caused by the previous hop, not by
          the original approve call.
        test_recipe:
          setup:
            - "Org, facility, period (OPEN), source S with factor_code='DIESEL'."
            - "Approve factor DIESEL v1 (kg_per_unit=2.687000, effective_from=2025-01-01)."
            - "Post activity-data on S with activity_start=2025-06-01 → EmissionRecord ER (FRESH, factor=v1)."
            - "Create Report R, compile → UNDER_REVIEW."
            - "Create factor DIESEL v2 (kg_per_unit=2.700000, effective_from=2025-07-01) as DRAFT."
          trigger:
            - "POST /factors/{v2.id}/approve."
          assert:
            - "EmissionFactor v1.status == 'SUPERSEDED' and v1.effective_to == '2025-07-01T00:00:00.000Z' (hop 1)"
            - "EmissionRecord ER.status == 'STALE' (hop 2 — caused by v1 supersession, not by approve directly)"
            - "Report R.status == 'RECOMPUTE_REQUIRED' (hop 3 — caused by ER going STALE)"

      - name: period_close_cascade_depth_3
        grounds:
          - state_machines.ReportingPeriod.OPEN_to_CLOSED
          - entities.ActivityData.fields.status
          - entities.EmissionRecord.fields.status
          - state_machines.Report.UNDER_REVIEW_to_REVISIONS_REQUIRED
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /reporting-periods/{id}/close: hop 1 archives
          every ActivityData row (RECORDED→ARCHIVED); that archival causes hop 2, archiving
          every EmissionRecord on those rows (FRESH/STALE→ARCHIVED); which causes hop 3,
          auto-transitioning any DRAFT/UNDER_REVIEW Report on the period to
          REVISIONS_REQUIRED. Different originating trigger than factor_approve_cascade_depth_3.
        test_recipe:
          setup:
            - "Org, facility, period P with end_date 2025-07-01."
            - "Activity-data, EmissionRecord, Report R (UNDER_REVIEW) on P."
            - "POST /_clock/advance to 2025-07-01T00:00:01Z."
          trigger:
            - "POST /reporting-periods/{P}/close."
          assert:
            - "ActivityData rows of P all status == 'ARCHIVED' (hop 1)"
            - "EmissionRecord rows of P all status == 'ARCHIVED' (hop 2 — caused by ActivityData archive)"
            - "Report R.status == 'REVISIONS_REQUIRED' (hop 3 — caused by EmissionRecord archive)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_segregation_of_duties_on_verify
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - endpoints.POST /organizations/{org_id}/reports/{id}/verify
        distinguishing_aspect: |
          Error-category pair: 'state' (ERR_INVALID_STATE) vs 'business_safety'
          (ERR_SEGREGATION_OF_DUTIES). When a Verifier attempts to verify a Report
          still in DRAFT (not UNDER_REVIEW) AND who happens to be a user that previously
          entered activity-data on the period, both checks fail simultaneously; priority 4
          fires first, returning ERR_INVALID_STATE (409), not ERR_SEGREGATION_OF_DUTIES (403).
        test_recipe:
          setup:
            - "Org, period, source. As DataSteward U1, post activity-data."
            - "Create Report R, leave it in DRAFT (do NOT compile)."
            - "Switch to Verifier headers with X-User-ID == U1's id (same user wearing Verifier hat)."
          trigger:
            - "POST /reports/{R}/verify."
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: temporal_before_referential_on_activity_data
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - endpoints.POST /organizations/{org_id}/reporting-periods/{period_id}/activity-data
        distinguishing_aspect: |
          Error-category pair: 'business_temporal' (ERR_ACTIVITY_OUTSIDE_PERIOD) vs
          'business_referential' (ERR_NO_APPLICABLE_FACTOR). When activity_start is
          outside the period AND no ACTIVE factor exists for the source's code at that
          date, both checks fail; priority 9 fires first, returning
          ERR_ACTIVITY_OUTSIDE_PERIOD (422), not ERR_NO_APPLICABLE_FACTOR (422).
        test_recipe:
          setup:
            - "Org, period 2025-01-01..2026-01-01."
            - "Source S with factor_code='ORPHAN' (no factor with this code exists)."
          trigger:
            - "POST activity-data with activity_start=2024-06-01, activity_end=2024-07-01 (outside period AND no factor)."
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_ACTIVITY_OUTSIDE_PERIOD'"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: completeness_pct_ge_threshold_on_compile
        grounds:
          - calculations.completeness_check
          - entities.Report.fields.completeness_passes
          - entities.Organization.fields.materiality_threshold_pct
          - endpoints.POST /organizations/{org_id}/reports/{id}/compile
        distinguishing_aspect: |
          Metric: completeness_pct (numeric share) checked at endpoint POST /reports/{id}/compile
          and POST /reports/{id}/verify. Boundary precision is '>=' not '>': when
          completeness_pct equals (100.00 - materiality_threshold_pct), completeness_passes
          MUST be true. At one step lower it MUST be false.
        test_recipe:
          setup:
            - "Org with materiality_threshold_pct=1.00 (threshold = 99.00)."
            - "Create exactly 100 ACTIVE EmissionSources, all in boundary."
            - "Post activity-data on exactly 99 of them (1 source uncovered)."
            - "Create Report R."
          trigger:
            - "POST /reports/{R}/compile."
          assert:
            - "R.completeness_pct == 99.00"
            - "R.completeness_passes == true  # boundary: 99.00 >= 99.00 → true"
            - "R.assurance_ready == true"
            - "Then leave another source uncovered (98 covered, 100 identified) → completeness_pct == 98.00, completeness_passes == false"

      - name: ownership_share_strict_gt_zero_on_equity_share
        grounds:
          - calculations.facility_inclusion_resolver
          - entities.Facility.fields.ownership_share_pct
          - entities.Facility.fields.included_in_boundary
          - endpoints.PATCH /organizations/{org_id}/facilities/{id}
        distinguishing_aspect: |
          Metric: Facility.ownership_share_pct (collection/zero edge) checked at endpoint
          PATCH /facilities/{id}. Under EQUITY_SHARE, inclusion uses strict '>' not '>=':
          ownership_share_pct == 0.00 yields included_in_boundary == false even when
          financial_control == true.
        test_recipe:
          setup:
            - "Org with consolidation_approach=EQUITY_SHARE."
            - "Facility F with ownership_share_pct=0.01, financial_control=true."
          trigger:
            - "GET F → confirm included_in_boundary == true."
            - "PATCH F with ownership_share_pct=0.00."
            - "GET F."
          assert:
            - "Before patch: F.included_in_boundary == true  # 0.01 > 0.00"
            - "After patch:  F.included_in_boundary == false # 0.00 NOT > 0.00 (strict)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_compile_depends_on_emission_record_freshness
        grounds:
          - state_machines.Report.DRAFT_to_UNDER_REVIEW
          - entities.EmissionRecord.fields.status
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair: Report → EmissionRecord. Report.DRAFT→UNDER_REVIEW transition is
          gated by the precondition that no EmissionRecord for the report's period has
          status == STALE; a single STALE record blocks compile.
        test_recipe:
          setup:
            - "Org, period, source S, factor v1, activity-data, EmissionRecord ER (FRESH)."
            - "Create factor v2 with strictly greater effective_from, approve it → ER becomes STALE."
            - "Create Report R."
          trigger:
            - "POST /reports/{R}/compile."
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "After reopen+wait (factor cascade complete), R.status remains 'DRAFT'"

      - name: credit_retire_depends_on_reduction_project_state
        grounds:
          - state_machines.CarbonCredit.PURCHASED_to_RETIRED
          - entities.ReductionProject.fields.status
          - entities.CarbonCredit.fields.linked_reduction_project_id
        distinguishing_aspect: |
          Entity pair: CarbonCredit → ReductionProject. CarbonCredit.PURCHASED→RETIRED is
          gated by the precondition that the linked ReductionProject.status == ACTIVE.
          A PLANNED or COMPLETED project blocks retirement.
        test_recipe:
          setup:
            - "Org, period, ReductionProject P (PLANNED, EXTERNAL_OFFSET)."
            - "CarbonCredit C (PURCHASED) linked to P."
          trigger:
            - "POST /credits/{C}/retire (while P is still PLANNED)."
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "After POST /projects/{P}/activate (P→ACTIVE), POST /credits/{C}/retire succeeds with 200"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: activity_data_half_open_overlap_on_source
        grounds:
          - validations[priority=10]
          - concurrency_rules[activity_interval]
          - entities.ActivityData.fields.activity_start
          - entities.ActivityData.fields.activity_end
        distinguishing_aspect: |
          Resource entity: EmissionSource. Interval semantics: half-open '[activity_start,
          activity_end)' overlap on the SAME source — touching intervals are ALLOWED
          (record1 [a,b) and record2 [b,c) are non-overlapping); strict overlap is rejected
          with ERR_ACTIVITY_INTERVAL_OVERLAP (409).
        test_recipe:
          setup:
            - "Org, period 2025-01-01..2026-01-01, source S, factor (effective_from 2025-01-01)."
            - "POST activity-data on S with [2025-03-01, 2025-04-01)."
          trigger:
            - "POST activity-data on S with [2025-03-15, 2025-04-15)  # overlaps mid-window."
          assert:
            - "Second POST: response.status_code == 409 and error_id == 'ERR_ACTIVITY_INTERVAL_OVERLAP'"
            - "POST activity-data on S with [2025-04-01, 2025-05-01)  # touches at 2025-04-01 → 201 Created (adjacency allowed)"

      - name: factor_effective_from_strict_order_per_code
        grounds:
          - validations[priority=17]
          - state_machines.EmissionFactor.DRAFT_to_ACTIVE
          - entities.EmissionFactor.fields.effective_from
          - entities.EmissionFactor.fields.effective_to
        distinguishing_aspect: |
          Resource entity: EmissionFactor (per code). Interval semantics: half-open chain
          with STRICT '>' ordering on effective_from — a new version cannot share the
          predecessor's effective_from (zero-length window rejected), but on approval the
          predecessor's effective_to is auto-set to the new version's effective_from
          (adjacency at the boundary is built-in, not an explicit second row). Geometrically
          different from ActivityData overlap: chain ordering with auto-closure vs symmetric
          two-record overlap detection.
        test_recipe:
          setup:
            - "Org, FactorManager. Approve factor 'GRID-A' v1 with effective_from=2025-01-01."
          trigger:
            - "Create DRAFT v2 with same effective_from=2025-01-01 (zero-length window)."
            - "POST /factors/{v2}/approve."
          assert:
            - "response.status_code == 422 and error_id == 'ERR_FACTOR_EFFECTIVE_FROM_ORDER'"
            - "Approving v2 with effective_from=2025-06-01 succeeds, AND v1.effective_to is auto-set to '2025-06-01T00:00:00.000Z'"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: report_reopen_recompile_preserves_net_emissions
        grounds:
          - state_machines.Report.UNDER_REVIEW_to_REVISIONS_REQUIRED
          - state_machines.Report.REVISIONS_REQUIRED_to_DRAFT
          - state_machines.Report.DRAFT_to_UNDER_REVIEW
          - calculations.report_net_emissions
          - entities.Report.fields.net_emissions_kg_co2e
        distinguishing_aspect: |
          Conserved quantity: Report.net_emissions_kg_co2e. The forward action is
          POST /reports/{id}/compile (DRAFT→UNDER_REVIEW pins totals); the compensating
          chain is request-revisions → reopen → compile, which resets pinned totals to null
          and recomputes them. INVARIANT: if no ActivityData, EmissionFactor, ReductionProject,
          or CarbonCredit row changes in between, the second-compile Report.net_emissions_kg_co2e
          == first-compile Report.net_emissions_kg_co2e exactly (no drift from floating-point or
          re-pinning).
        test_recipe:
          setup:
            - "Build a fully-specified period with one source, one factor v1, one activity-data row (q=1000, kg_per_unit=2.687000, CO2)."
            - "Create Report R, compile → record R.net_emissions_kg_co2e_initial."
          trigger:
            - "POST /reports/{R}/request-revisions (no underlying data changes)."
            - "POST /reports/{R}/reopen."
            - "POST /reports/{R}/compile."
          assert:
            - "R.net_emissions_kg_co2e_initial == 2687.0000"
            - "After reopen: R.net_emissions_kg_co2e == null (totals reset)"
            - "After second compile: R.net_emissions_kg_co2e == 2687.0000 (invariant holds — same value)"

      - name: credit_transfer_preserves_applied_offsets
        grounds:
          - state_machines.CarbonCredit.PURCHASED_to_TRANSFERRED
          - state_machines.CarbonCredit.PURCHASED_to_RETIRED
          - calculations.report_net_emissions
          - entities.Report.fields.applied_offsets_kg_co2e
        distinguishing_aspect: |
          Conserved quantity: Report.applied_offsets_kg_co2e (distinct from
          net_emissions_kg_co2e — measures offset volume only). Transferring a PURCHASED
          CarbonCredit (PURCHASED→TRANSFERRED) is the compensating action paired against
          the credit being available for retirement; INVARIANT: a transfer of a still-PURCHASED
          credit leaves the live Report.applied_offsets_kg_co2e unchanged (because PURCHASED
          credits were never counted in applied_offsets — only RETIRED credits are).
        test_recipe:
          setup:
            - "Org, period, project P (ACTIVE, EXTERNAL_OFFSET)."
            - "Two CarbonCredits C1, C2 on P, each quantity_kg_co2e=500.0000."
