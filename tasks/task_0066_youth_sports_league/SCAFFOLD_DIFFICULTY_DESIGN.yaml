      5% fee then sum, deposit-capped) produce DIFFERENT cent totals for the same Family''s

      fulfilled commitments — both on the Family domain but as distinct algorithms: accrual

      of [3000,3000] on deposit 5000 caps to 5000, while refund of those same credits nets 5700

      pre-cap then caps to 5000, yet refund of [1050,1050,1050] nets 2991 (not 2992).

