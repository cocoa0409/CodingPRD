            - "EqualOpportunityRequest.${eq}.parity_basis_applied == null"
            - "EqualOpportunityRequest.${eq}.responded_at == null"
            - "CommercialOrder.${ord_g}.status == CANCELLED"
            - "election_eo_outstanding_units for ${el}, defined as sum over EqualOpportunityRequest with status == GRANTED of (owed_units - fulfilled_units), == 0"
