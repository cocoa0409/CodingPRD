scenario: "Immersive Venue Content Production & Show Scheduling (Sphere Entertainment): purpose-built venue with a wraparound display requiring content produced in a bespoke format and resolution, content production pipeline with capture, rendering and quality control at extreme file sizes, residency and one-off show scheduling balancing original productions, concert residencies and corporate rentals, technical rehearsal and changeover time between different show formats, ticket pricing by seating zone reflecting visual and haptic experience differences, venue systems operations including audio beamforming, haptic seating and environmental effects with maintenance windows, sponsorship and exterior display advertising sales, guest capacity flow and accessibility accommodation in a unique bowl configuration"

domain_name: immersive-venue-show-scheduling
api_prefix: /venue

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, ops_run_checkpoint]
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many]
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Production title" }
      - { name: production_type, type: enum, source: input, description: "ORIGINAL | RESIDENCY | CORPORATE" }
      - { name: base_price_cents, type: integer, source: input, description: "Base ticket price (cents) at multiplier 1.0, before any experience differential" }
      - { name: is_haptic_capable, type: boolean, source: input, description: "Whether the production drives haptic seating zones (RING, APEX)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DARK | RETIRED" }
      - { name: gain_cents, type: integer, source: computed, description: "Sum of base_price_cents over ACTIVE productions, including this one when ACTIVE; 0 otherwise" }

  - name: Asset
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: title, type: string, source: input, description: "Asset title" }
      - { name: capture_format, type: enum, source: input, description: "WRAP_16K | WRAP_8K" }
      - { name: storage_gb, type: integer, source: input, description: "Captured master size in GB" }
      - { name: render_hours_base, type: number, source: input, description: "Base render hours before rush overhead" }
      - { name: status, type: enum, source: system, description: "CAPTURED | RENDERING | QC | QC_FAILED | APPROVED | ARCHIVED" }
      - { name: render_cost_cents, type: integer, source: computed, description: "0 until a render batch APPROVEDs the asset; then render hours x rate" }

  - name: RenderBatch
    parent: null
    common_fields: true
    fields:
      - { name: status, type: enum, source: system, description: "OPEN | RENDERING | SETTLING | SETTLED | FAILED" }
      - { name: dispatch_mode, type: enum, source: input, description: "STANDARD | RUSH" }
      - { name: render_minutes, type: integer, source: computed, description: "Total venue-wall render minutes the batch occupies" }
      - { name: batch_cost_cents, type: integer, source: computed, description: "render_minutes x 1000 cents per render minute" }
      - { name: submitted_asset_count, type: integer, source: computed, description: "Number of assets in submitted_asset_ids not yet terminally excluded" }
      - { name: failed_asset_count, type: integer, source: computed, description: "Number of assets QC_FAILED in this batch" }
      - { name: submitted_asset_ids, type: array, source: system, description: "Asset ids captured at dispatch time" }

  - name: Show
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: show_format, type: enum, source: input, description: "FILM | CONCERT | CORPORATE" }
      - { name: start_time, type: datetime, source: input, description: "Show start (ISO8601)" }
      - { name: length_minutes, type: integer, source: input, description: "Show duration in minutes" }
      - { name: peak_rush_minutes, type: integer, source: input, description: "Minutes of peak effects density; drives changeover rush surcharges", default: 0 }
      - { name: rehearsal_minutes, type: integer, source: computed, description: "Reserved rehearsal minutes preceding start_time" }
      - { name: changeover_minutes, type: integer, source: computed, description: "Reserved changeover minutes following start_time + length_minutes" }
      - { name: tech_readiness, type: enum, source: computed, description: "READY | DEGRADED" }
      - { name: status, type: enum, source: system, description: "TENTATIVE | REHEARSAL | CONFIRMED | COMPLETED | CANCELLED" }
      - { name: utilization_at_lock, type: number, source: system, description: "Zone utilization (0..1) captured when the show was confirmed; default 0" }
      - { name: haptic_surcharge_cents_at_lock, type: integer, source: system, description: "Haptic surcharge cents per seat captured at confirmation; default 0" }
      - { name: settlement_snapshot_id, type: string, source: system, description: "id of the Settlement recorded on completion; null otherwise" }

  - name: Booking
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: zone, type: enum, source: input, description: "MAIN | RING | APEX" }
      - { name: seats, type: integer, source: input, description: "Number of seats booked (>= 1)" }
      - { name: seat_kind, type: enum, source: input, description: "STANDARD | WHEELCHAIR | COMPANION", default: STANDARD }
      - { name: unit_price_cents, type: number, source: computed, description: "Quoted price per seat at booking time (2dp)" }
      - { name: line_total_cents, type: number, source: computed, description: "Booking line total: round_half_up(seats x B0_zone x (1 + fee_pct), 2) computed from the 4dp-pinned B0_zone — NOT seats x unit_price_cents" }
      - { name: quoted_variant, type: enum, source: computed, description: "EXPERIENCE_DIFF | HAPTIC_SURCHARGE — which pricing variant produced unit_price_cents" }
      - { name: refund_cents, type: number, source: computed, description: "Refund on cancellation; 0 otherwise" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CANCELLED" }

  - name: VenueSystem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable system name" }
      - { name: kind, type: enum, source: input, description: "AUDIO_BEAM | HAPTIC | ENV_FX" }
      - { name: status, type: enum, source: system, description: "ONLINE | MAINTENANCE | DEGRADED | OFFLINE" }
      - { name: consecutive_failed_windows, type: integer, source: computed, description: "Count of consecutive FAILED maintenance windows; resets to 0 on COMPLETED or ONLINE repair" }

  - name: MaintenanceWindow
    parent: VenueSystem
    common_fields: true
    fields:
      - { name: venue_system_id, type: string, source: system, description: "FK -> VenueSystem.id" }
      - { name: start_time, type: datetime, source: input, description: "Window start (ISO8601)" }
      - { name: end_time, type: datetime, source: input, description: "Window end (ISO8601)" }
      - { name: buffer_minutes, type: integer, source: input, description: "Post-window buffer minutes that must remain show-free" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | COMPLETED | FAILED" }

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sponsor brand name" }
      - { name: brand_tier, type: enum, source: input, description: "STANDARD | PREMIUM" }
      - { name: active_campaign_count, type: integer, source: computed, description: "Number of campaigns in ACTIVE status" }

  - name: Campaign
    parent: Sponsor
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: system, description: "FK -> Sponsor.id" }
      - { name: start_time, type: datetime, source: input, description: "Campaign flight start (ISO8601)" }
      - { name: end_time, type: datetime, source: input, description: "Campaign flight end (ISO8601)" }
      - { name: exterior_slots, type: integer, source: input, description: "Number of exterior display slots (>= 1)" }
      - { name: spot_seconds, type: integer, source: input, description: "Length of each spot in seconds" }
      - { name: contracted_impressions, type: integer, source: input, description: "Contracted total impressions" }
      - { name: delivered_impressions, type: integer, source: computed, description: "Impressions delivered so far" }
      - { name: under_delivery, type: integer, source: computed, description: "max(0, contracted - delivered) at completion" }
      - { name: make_good_credits, type: integer, source: computed, description: "Compensatory impressions issued on under-delivery" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | COMPLETED | CANCELLED" }

  - name: Settlement
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: gross_cents, type: number, source: computed, description: "Sum of line_total_cents over CONFIRMED bookings at completion" }
      - { name: refunds_cents, type: number, source: computed, description: "Sum of refund_cents over CANCELLED bookings" }
      - { name: net_cents, type: number, source: computed, description: "gross_cents - refunds_cents" }
      - { name: sponsor_payout_cents, type: number, source: computed, description: "Sponsor payout per waterfall allocation" }
      - { name: venue_retain_cents, type: number, source: computed, description: "net_cents - sponsor_payout_cents" }
      - { name: status, type: enum, source: system, description: "FINAL" }

state_machines:
  - entity: Production
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /productions/{id}/activate"
        actor: ProductionDirector
        preconditions:
          - "No other Production currently ACTIVE"
        side_effects:
          - "Recompute gain_cents for this production (sum of base_price_cents over ACTIVE productions)"

      - from: ACTIVE
        to: DARK
        trigger: "POST /productions/{id}/deactivate"
        actor: ProductionDirector
        preconditions:
          - "No Show of this production is in CONFIRMED status"
        side_effects:
          - "All TENTATIVE or REHEARSAL shows of this production -> CANCELLED"
          - "Every HELD booking on each cancelled show -> CANCELLED with refund_cents = 0"
          - "Every CONFIRMED booking on each cancelled show -> CANCELLED with refund_cents = line_total_cents"
          - "Recompute gain_cents of the remaining ACTIVE production (if any)"

      - from: DARK
        to: ACTIVE
        trigger: "POST /productions/{id}/activate"
        actor: ProductionDirector
        preconditions:
          - "No other Production currently ACTIVE"
        side_effects:
          - "Recompute gain_cents"

      - from: [DRAFT, DARK]
        to: RETIRED
        trigger: "POST /productions/{id}/retire"
        actor: ProductionDirector
        preconditions: []
        side_effects: []

  - entity: Asset
    field: status
    initial_state: CAPTURED
    terminal_states: [ARCHIVED]
    transitions:
      - from: CAPTURED
        to: RENDERING
        trigger: "system: parent RenderBatch dispatched (OPEN -> RENDERING)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RENDERING
        to: QC
        trigger: "system: parent RenderBatch settled (RENDERING -> SETTLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: QC
        to: APPROVED
        trigger: "POST /assets/{id}/qc/approve"
        actor: ContentProducer
        preconditions:
          - "Asset in QC"
        side_effects:
          - "render_cost_cents := round_half_up(render_hours_base x 360000 / 60) where render_hours_base is the asset's own pinned base hours"
          - "Parent RenderBatch.submitted_asset_count decrements by 1"

      - from: QC
        to: QC_FAILED
        trigger: "POST /assets/{id}/qc/fail"
        actor: ContentProducer
        preconditions:
          - "Asset in QC"
        side_effects:
          - "Parent RenderBatch.failed_asset_count increments by 1"
          - "Parent RenderBatch.submitted_asset_count decrements by 1"

      - from: QC_FAILED
        to: CAPTURED
        trigger: "POST /assets/{id}/retry"
        actor: ContentProducer
        preconditions:
          - "Production of this asset is DRAFT or ACTIVE (not RETIRED)"
        side_effects: []

      - from: APPROVED
        to: ARCHIVED
        trigger: "POST /assets/{id}/archive"
        actor: ContentProducer
        preconditions: []
        side_effects: []

  - entity: RenderBatch
    field: status
    initial_state: OPEN
    terminal_states: [SETTLED, FAILED]
    transitions:
      - from: OPEN
        to: RENDERING
        trigger: "POST /render-batches/{id}/dispatch"
        actor: ContentProducer
        preconditions:
          - "submitted_asset_count > 0"
          - "No other RenderBatch is in RENDERING or SETTLING"
          - "Venue render wall free: no MaintenanceWindow of kind ENV_FX is SCHEDULED or ACTIVE overlapping [now, now + computed render_minutes]"
        side_effects:
          - "All submitted assets -> RENDERING"
          - "render_minutes computed per calc_render_time; batch_cost_cents computed"

      - from: RENDERING
        to: SETTLING
        trigger: "system: clock reaches batch completion instant"
        actor: system
        preconditions: []
        side_effects: []

      - from: SETTLING
        to: SETTLED
        trigger: "POST /render-batches/{id}/settle"
        actor: ContentProducer
        preconditions:
          - "RenderBatch in SETTLING"
        side_effects:
          - "All RENDERING assets in this batch -> QC"

      - from: [OPEN, RENDERING, SETTLING]
        to: FAILED
        trigger: "POST /render-batches/{id}/abort or system: ENV_FX VenueSystem -> OFFLINE while batch active"
        actor: "ContentProducer or system"
        preconditions: []
        side_effects:
          - "RENDERING assets -> QC_FAILED"
          - "CAPTURED assets remain CAPTURED"

  - entity: Show
    field: status
    initial_state: TENTATIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: TENTATIVE
        to: REHEARSAL
        trigger: "POST /shows/{id}/schedule-rehearsal"
        actor: VenueScheduler
        preconditions:
          - "Production ACTIVE"
          - "No other non-terminal Show overlaps this show's [rehearsal_start, changeover_end) window per calc_changeover_time"
        side_effects:
          - "rehearsal_minutes, changeover_minutes computed and stored"

      - from: REHEARSAL
        to: CONFIRMED
        trigger: "POST /shows/{show_id}/confirm (with expected_production_version)"
        actor: VenueScheduler
        preconditions:
          - "Production ACTIVE"
          - "At least one Asset of the production is APPROVED"
          - "tech_readiness == READY (no required VenueSystem DEGRADED or OFFLINE)"
        side_effects:
          - "utilization_at_lock := current venue utilization"
          - "haptic_surcharge_cents_at_lock := current haptic surcharge cents"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /shows/{id}/complete"
        actor: VenueScheduler
        preconditions:
          - "Clock >= start_time + length_minutes"
        side_effects:
          - "Settlement created (status FINAL) per calc_settlement"
          - "settlement_snapshot_id set"
          - "Each ACTIVE Campaign overlapping the show window accrues delivered_impressions per calc_impressions"

      - from: [TENTATIVE, REHEARSAL, CONFIRMED]
        to: CANCELLED
        trigger: "POST /shows/{id}/cancel or system: parent Production -> DARK"
        actor: "VenueScheduler or system"
        preconditions: []
        side_effects:
          - "HELD bookings -> CANCELLED, refund_cents = 0"
          - "CONFIRMED bookings -> CANCELLED, refund_cents = line_total_cents"

  - entity: Booking
    field: status
    initial_state: HELD
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: "Guest (own booking) or BoxOfficeAgent"
        preconditions:
          - "Booking in HELD"
          - "Booking held_at within 15 minutes of logical clock (else expired)"
        side_effects:
          - "Seat inventory finalized for zone"

      - from: HELD
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel, or system: hold expiry at 15 minutes, or system: parent Show -> CANCELLED"
        actor: "Guest, BoxOfficeAgent, or system"
        preconditions: []
        side_effects:
          - "refund_cents := 0"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel or system: parent Show -> CANCELLED"
        actor: "Guest (own), BoxOfficeAgent, or system"
        preconditions: []
        side_effects:
          - "refund_cents := line_total_cents"

  - entity: VenueSystem
    field: status
    initial_state: ONLINE
    terminal_states: [OFFLINE]
    transitions:
      - from: ONLINE
        to: MAINTENANCE
        trigger: "system: a SCHEDULED MaintenanceWindow's start_time reached"
        actor: system
        preconditions: []
        side_effects: []

      - from: MAINTENANCE
        to: ONLINE
        trigger: "system: MaintenanceWindow COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_failed_windows := 0"

      - from: [ONLINE, MAINTENANCE]
        to: DEGRADED
        trigger: "system: consecutive_failed_windows >= 2"
        actor: system
        preconditions: []
        side_effects:
          - "Every Show whose window requires this system kind flips tech_readiness to DEGRADED"

      - from: DEGRADED
        to: OFFLINE
        trigger: "system: consecutive_failed_windows >= 3"
        actor: system
        preconditions: []
        side_effects:
          - "Any RENDERING RenderBatch -> FAILED (cascades assets -> QC_FAILED)"

      - from: DEGRADED
        to: ONLINE
        trigger: "POST /venue-systems/{id}/repair"
        actor: VenueOpsEngineer
        preconditions: []
        side_effects:
          - "consecutive_failed_windows := 0"

  - entity: MaintenanceWindow
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: logical clock reaches start_time"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /maintenance-windows/{id}/complete"
        actor: VenueOpsEngineer
        preconditions:
          - "Clock >= end_time"
        side_effects:
          - "Parent VenueSystem consecutive_failed_windows := 0; if MAINTENANCE -> ONLINE"

      - from: ACTIVE
        to: FAILED
        trigger: "POST /maintenance-windows/{id}/fail"
        actor: VenueOpsEngineer
        preconditions: []
        side_effects:
          - "Parent VenueSystem consecutive_failed_windows += 1"

  - entity: Campaign
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /campaigns/{campaign_id}/activate (with expected_sponsor_version)"
        actor: SponsorshipManager
        preconditions:
          - "Sponsor exists; start_time <= clock < end_time"
        side_effects:
          - "Sponsor.active_campaign_count += 1"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /campaigns/{id}/pause"
        actor: SponsorshipManager
        preconditions: []
        side_effects:
          - "Sponsor.active_campaign_count -= 1"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /campaigns/{campaign_id}/activate (with expected_sponsor_version)"
        actor: SponsorshipManager
        preconditions:
          - "start_time <= clock < end_time"
        side_effects:
          - "Sponsor.active_campaign_count += 1"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system: logical clock >= end_time"
        actor: system
        preconditions: []
        side_effects:
          - "under_delivery := max(0, contracted_impressions - delivered_impressions)"
          - "make_good_credits := 2 x under_delivery (impressions owed)"
          - "Sponsor.active_campaign_count -= 1"

      - from: [DRAFT, ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel"
        actor: SponsorshipManager
        preconditions: []
        side_effects:
          - "If was ACTIVE: Sponsor.active_campaign_count -= 1"
          - "If was PAUSED or DRAFT: Sponsor.active_campaign_count unchanged"

concurrency_rules:
  - rule_id: show-confirm-stale-production
    parent_entity: Production
    write_endpoint: "POST /shows/{show_id}/confirm"
    occ_field: "expected_production_version"
    description: |
      Confirming a Show against a Production whose version has advanced since the
      scheduler last observed it is rejected with ERR_STALE_VERSION. This captures
      the case where another operator has just changed the production's ACTIVE/DARK
      posture or pricing surface and the confirming client's view of the production
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: campaign-activate-stale-sponsor
    parent_entity: Sponsor
    write_endpoint: "POST /campaigns/{campaign_id}/activate"
    occ_field: "expected_sponsor_version"
    description: |
      Activating a Campaign against a Sponsor whose version has advanced since the
      manager last observed it is rejected with ERR_STALE_VERSION. Captures the case
      where another manager has just changed the sponsor's campaign posture and the
      activating client's view of the sponsor is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: calc_ticket_price
    trigger: "Booking creation (POST /shows/{id}/bookings); pinned on Booking.unit_price_cents"
    algorithm: tiered_pricing
    formula: |
      Zone seating: MAIN capacity 300, multiplier 1.0; RING capacity 200, multiplier 1.4;
      APEX capacity 100, multiplier 1.8.

      gain_cents = sum of base_price_cents over productions in ACTIVE status.
      For the active production P, zone multiplier m_z is computed as:
        m_z = 1 + (gain_cents x zone_experience_weight_z) / sum_z(capacity_z x zone_experience_weight_z)
      B0_z = round_half_up(P.base_price_cents x m_z, 4)   [round to 4 decimal places]
      q_z  = round_half_up(seats_booked_z x B0_z, 4)       [round per zone line, 4 dp]

      Variant EXPERIENCE_DIFF (default):
        Booking.unit_price_cents = round_half_up(B0_z x (1 + venue_fee_pct), 2)
          with venue_fee_pct = 0.06
        Booking.line_total_cents = round_half_up(seats x B0_z x (1 + venue_fee_pct), 2)
          computed from the 4dp-pinned B0_z — NOT seats x unit_price_cents.

      Variant HAPTIC_SURCHARGE (when production.is_haptic_capable AND zone in {RING, APEX}):
        Booking.unit_price_cents = round_half_up(B0_z x (1 + haptic_pct), 2)
          with haptic_pct = 0.08
        Booking.line_total_cents = round_half_up(seats x B0_z x (1 + haptic_pct), 2)
        Zones outside {RING, APEX} use B0_z directly (no haptic surcharge): unit = B0_z,
          line_total = round_half_up(seats x B0_z, 2).
    constants:
      VENUE_FEE_PCT: 0.06
      HAPTIC_PCT: 0.08
      ZONE_CAPACITY: { MAIN: 300, RING: 200, APEX: 100 }
      ZONE_EXPERIENCE_WEIGHT: { MAIN: 1.0, RING: 1.4, APEX: 1.8 }
    precision: "per-line 4dp round_half_up; final 2dp round_half_up; pinned order is: per-zone line round THEN aggregate"
    variants:
      - name: EXPERIENCE_DIFF
        when: "default — production.is_haptic_capable == false OR zone == MAIN"
        difference: "per-seat unit price = round(B0_z x 1.06, 2)"
      - name: HAPTIC_SURCHARGE
        when: "production.is_haptic_capable == true AND zone in {RING, APEX}"
        difference: "per-seat unit price = round(B0_z x 1.08, 2); MAIN seats remain at B0_z"

  - name: calc_render_time
    trigger: "RenderBatch dispatch (OPEN -> RENDERING)"
    algorithm: constraint_propagation
    formula: |
      base_render_minutes = 90
      rush_overhead_minutes = (number of assets in batch with dispatch_mode contribution) x 45
        where each asset in a RUSH batch contributes 45 minutes of peak rush overhead
      sponsor_adjust_minutes = 30 x (count of Campaigns in ACTIVE status whose sponsor
        brand_tier == PREMIUM and whose flight covers the dispatch instant)
      render_minutes = base_render_minutes + rush_overhead_minutes + sponsor_adjust_minutes
      render_hours = round_half_up(render_minutes / 60, 4)
      batch_cost_cents = render_minutes x 1000
      Per-asset render_cost_cents (assigned at asset QC approve):
        render_cost_cents = round_half_up(asset.render_hours_base x 360000 / 60, 2)
    constants:
      BASE_RENDER_MIN: 90
      RUSH_OVERHEAD_MIN_PER_ASSET: 45
      SPONSOR_ADJ_MIN_PER_PREMIUM_CAMPAIGN: 30
      RENDER_COST_PER_HOUR_CENTS: 360000
      COST_PER_RENDER_MINUTE_CENTS: 1000
    precision: "render_hours rounded to 4dp; cents to 2dp"

  - name: calc_changeover_time
    trigger: "Show scheduling (schedule-rehearsal) and conflict detection"
    algorithm: interval_merge
    formula: |
      rehearsal_minutes = 120 (fixed per show)
      changeover_minutes = 60 + 30 x (number of format transitions between this show and the
        temporally adjacent prior or next non-cancelled show) + 20 x peak_rush_indicator
      where peak_rush_indicator = 1 if peak_rush_minutes >= 30 else 0
      Reserved window for conflict detection: [start_time - rehearsal_minutes,
        start_time + length_minutes + changeover_minutes), half-open.
      Two shows conflict iff their reserved windows overlap (strictly: a.start < b.end AND b.start < a.end).
    constants:
      REHEARSAL_MIN: 120
      BASE_CHANGEOVER_MIN: 60
      FORMAT_TRANSITION_MIN: 30
      PEAK_RUSH_THRESHOLD_MIN: 30
      PEAK_RUSH_CHANGEOVER_MIN: 20
    precision: "integer minutes"

  - name: calc_impressions
    trigger: "Show completion — accrues delivered_impressions for each ACTIVE campaign overlapping show window"
    algorithm: aggregation
    formula: |
      impressions_per_show = exterior_slots x show.length_minutes x spot_seconds / 60
      STANDARD tier multiplier: 1.0 ; PREMIUM tier multiplier: 1.0 (premium affects cost, not count)
      delivered_impressions += impressions_per_show for each overlapping ACTIVE campaign
      On campaign completion: under_delivery = max(0, contracted_impressions - delivered_impressions)
      make_good_credits = 2 x under_delivery
    constants:
      MAKE_GOOD_MULTIPLIER: 2
    precision: "integer impressions"

  - name: calc_settlement
    trigger: "Show completion (CONFIRMED -> COMPLETED)"
    algorithm: waterfall_allocation
    formula: |
      gross_cents = sum over CONFIRMED bookings of line_total_cents
      refunds_cents = sum over CANCELLED bookings of refund_cents
      net_cents = gross_cents - refunds_cents
      sponsor_payout_cents: waterfall across ACTIVE campaigns overlapping the show window,
        ordered by Campaign.created_at ASC, tie-break by campaign exterior_slots DESC:
          per campaign payout_share = round_half_up(net_cents x 0.10 / max(1, overlapping_campaigns), 2)
        sponsor_payout_cents = sum of payout_share, capped at net_cents
      venue_retain_cents = net_cents - sponsor_payout_cents
    constants:
      SPONSOR_POOL_PCT: 0.10
    precision: "2dp round_half_up; allocation order pinned (created_at ASC, tie exterior_slots DESC)"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in the declared role set for the endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is authorized for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Referenced resources exist (production, show, asset, batch, sponsor, campaign, booking, system, window), validated left-to-right in path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Entity in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"

  - priority: 5
    category: business_temporal
    check: "Scheduling window conflict: new show's reserved window [start - rehearsal, end + changeover) overlaps an existing non-cancelled show"
    error_id: ERR_SHOW_CONFLICT
    http_status: 422
    applies_to: "POST /productions/{id}/shows, POST /shows/{id}/schedule-rehearsal"

  - priority: 6
    category: business_temporal
    check: "MaintenanceWindow buffer_minutes must not overlap any show's reserved window; window end_time must be > start_time"
    error_id: ERR_MAINTENANCE_CONFLICT
    http_status: 422
    applies_to: "POST /venue-systems/{id}/maintenance-windows"

  - priority: 7
    category: business_constraint
    check: "Zone seat capacity: booking seats must not exceed remaining capacity in that zone for the show"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /shows/{id}/bookings"

  - priority: 4
    category: state
    check: "Booking creation requires the parent Show in REHEARSAL or CONFIRMED status"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /shows/{id}/bookings"

  - priority: 8
    category: business_constraint
    check: "Accessibility: WHEELCHAIR or COMPANION seat_kinds require zone in {MAIN, RING} (APEX not accessible); APEX zone bookings must use STANDARD"
    error_id: ERR_ACCESSIBILITY_ZONE
    http_status: 422
    applies_to: "POST /shows/{id}/bookings"

  - priority: 9
    category: business_referential
    check: "Show confirmation requires at least one APPROVED Asset on the production"
    error_id: ERR_NO_APPROVED_ASSET
    http_status: 422
    applies_to: "POST /productions/{pid}/shows/{sid}/confirm"

  - priority: 10
    category: business_safety
    check: "Show confirmation requires tech_readiness == READY (no required VenueSystem DEGRADED or OFFLINE)"
    error_id: ERR_TECH_NOT_READY
    http_status: 422
    applies_to: "POST /productions/{pid}/shows/{sid}/confirm"

  - priority: 11
    category: business_fiscal
    check: "Production activate: no other Production currently ACTIVE"
    error_id: ERR_PRODUCTION_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /productions/{id}/activate"

  - priority: 12
    category: business_fiscal
    check: "Campaign activate: sponsor's contracted impressions not already fully allocated to other ACTIVE campaigns overlapping the same flight window"
    error_id: ERR_CAMPAIGN_OVERLAP
    http_status: 422
    applies_to: "POST /sponsors/{sid}/campaigns/{cid}/activate"

  - priority: 13
    category: business_constraint
    check: "RenderBatch dispatch: at least one asset submitted; no other batch RENDERING or SETTLING"
    error_id: ERR_BATCH_BUSY
    http_status: 409
    applies_to: "POST /render-batches/{id}/dispatch"

  - priority: 14
    category: business_temporal
    check: "RenderBatch dispatch: no ENV_FX maintenance window SCHEDULED or ACTIVE overlapping [now, now + render_minutes]"
    error_id: ERR_RENDER_BLOCKED_BY_MAINTENANCE
    http_status: 422
    applies_to: "POST /render-batches/{id}/dispatch"

  - priority: 15
    category: state
    check: "Booking confirm: booking still within 15-minute hold window per logical clock"
    error_id: ERR_BOOKING_HOLD_EXPIRED
    http_status: 422
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 16
    category: business_constraint
    check: "Asset QC approve requires asset in QC (i.e., its batch must have SETTLED)"
    error_id: ERR_ASSET_NOT_IN_QC
    http_status: 409
    applies_to: "POST /assets/{id}/qc/approve, POST /assets/{id}/qc/fail"

  - priority: 17
    category: business_referential
    check: "OCC: expected_<parent>_version payload field equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /productions/{pid}/shows/{sid}/confirm, POST /sponsors/{sid}/campaigns/{cid}/activate"

  - priority: 18
    category: business_constraint
    check: "Asset capture: capture_format must be WRAP_16K when production.is_haptic_capable == true"
    error_id: ERR_FORMAT_MISMATCH
    http_status: 422
    applies_to: "POST /productions/{id}/assets"

endpoints:
  # --- Productions ---
  - method: POST
    path: "/venue/productions"
    description: "Create a production"
    roles: [ProductionDirector]
    code: 201
    input: [title, production_type, base_price_cents, is_haptic_capable]
    output: Production
    side_effects: ["status=DRAFT, gain_cents=0"]

  - method: GET
    path: "/venue/assets"
    description: "List assets, optionally filtered by production"
    roles: [ContentProducer, ProductionDirector]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: GET
    path: "/venue/shows"
    description: "List shows, optionally filtered by production"
    roles: [VenueScheduler, ProductionDirector, BoxOfficeAgent]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: Show[]
    side_effects: []

  - method: GET
    path: "/venue/shows/{id}/bookings"
    description: "List bookings for a show"
    roles: [BoxOfficeAgent, VenueScheduler, Guest]
    code: 200
    input: ["zone?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/venue/shows/{id}/settlement"
    description: "Get settlement for a completed show"
    roles: [VenueScheduler, ProductionDirector]
    code: 200
    input: []
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/venue/maintenance-windows"
    description: "List maintenance windows, optionally filtered by venue system"
    roles: [VenueOpsEngineer, VenueScheduler]
    code: 200
    input: ["venue_system_id?", "status?", "limit?", "offset?"]
    output: MaintenanceWindow[]
    side_effects: []

  - method: GET
    path: "/venue/maintenance-windows/{window_id}"
    description: "Get maintenance window"
    roles: [VenueOpsEngineer, VenueScheduler]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  - method: GET
    path: "/venue/campaigns"
    description: "List campaigns, optionally filtered by sponsor"
    roles: [SponsorshipManager]
    code: 200
    input: ["sponsor_id?", "status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: GET
    path: "/venue/productions"
    description: "List productions"
    roles: [ProductionDirector, ContentProducer, VenueScheduler, VenueOpsEngineer, SponsorshipManager, BoxOfficeAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Production[]
    side_effects: []

  - method: GET
    path: "/venue/productions/{production_id}"
    description: "Get production"
    roles: [ProductionDirector, ContentProducer, VenueScheduler, VenueOpsEngineer, SponsorshipManager, BoxOfficeAgent]
    code: 200
    input: []
    output: Production
    side_effects: []

  - method: POST
    path: "/venue/productions/{production_id}/activate"
    description: "Activate production (DRAFT or DARK -> ACTIVE)"
    roles: [ProductionDirector]
    code: 200
    input: []
    output: Production
    side_effects:
      - "status -> ACTIVE"
      - "gain_cents recomputed"
      - "increments Production.version by 1"

  - method: POST
    path: "/venue/productions/{production_id}/deactivate"
    description: "Deactivate production (ACTIVE -> DARK); cancels non-terminal shows"
    roles: [ProductionDirector]
    code: 200
    input: []
    output: Production
    side_effects:
      - "status -> DARK"
      - "non-terminal shows -> CANCELLED; bookings compensated"
      - "gain_cents of remaining ACTIVE production recomputed"
      - "increments Production.version by 1"

  - method: POST
    path: "/venue/productions/{production_id}/retire"
    description: "Retire production (DRAFT/DARK -> RETIRED)"
    roles: [ProductionDirector]
    code: 200
    input: []
    output: Production
    side_effects: ["status -> RETIRED", "increments Production.version by 1"]

  # --- Assets ---
  - method: POST
    path: "/venue/assets"
    description: "Capture a new asset under a production"
    roles: [ContentProducer]
    code: 201
    input: [production_id, title, capture_format, storage_gb, render_hours_base]
    output: Asset
    side_effects: ["status=CAPTURED, render_cost_cents=0"]

  - method: GET
    path: "/venue/assets/{asset_id}"
    description: "Get asset"
    roles: [ContentProducer, ProductionDirector]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: POST
    path: "/venue/assets/{asset_id}/qc/approve"
    description: "Approve asset QC"
    roles: [ContentProducer]
    code: 200
    input: []
    output: Asset
    side_effects:
      - "status -> APPROVED"
      - "render_cost_cents computed"
      - "parent batch submitted_asset_count -= 1"
      - "increments Asset.version by 1"

  - method: POST
    path: "/venue/assets/{asset_id}/qc/fail"
    description: "Fail asset QC"
    roles: [ContentProducer]
    code: 200
    input: []
    output: Asset
    side_effects:
      - "status -> QC_FAILED"
      - "parent batch failed_asset_count += 1; submitted_asset_count -= 1"
      - "increments Asset.version by 1"

  - method: POST
    path: "/venue/assets/{asset_id}/retry"
    description: "Retry a QC_FAILED asset (back to CAPTURED)"
    roles: [ContentProducer]
    code: 200
    input: []
    output: Asset
    side_effects: ["status -> CAPTURED", "increments Asset.version by 1"]

  - method: POST
    path: "/venue/assets/{asset_id}/archive"
    description: "Archive an APPROVED asset"
    roles: [ContentProducer]
    code: 200
    input: []
    output: Asset
    side_effects: ["status -> ARCHIVED", "increments Asset.version by 1"]

  # --- Render batches ---
  - method: POST
    path: "/venue/render-batches"
    description: "Create a render batch"
    roles: [ContentProducer]
    code: 201
    input: [dispatch_mode, "asset_ids"]
    output: RenderBatch
    side_effects: ["status=OPEN; submitted_asset_ids captured; submitted_asset_count = len(asset_ids)"]

  - method: GET
    path: "/venue/render-batches/{batch_id}"
    description: "Get render batch"
    roles: [ContentProducer, ProductionDirector]
    code: 200
    input: []
    output: RenderBatch
    side_effects: []

  - method: POST
    path: "/venue/render-batches/{batch_id}/dispatch"
    description: "Dispatch batch to rendering"
    roles: [ContentProducer]
    code: 200
    input: []
    output: RenderBatch
    side_effects:
      - "status -> RENDERING"
      - "assets -> RENDERING"
      - "render_minutes, batch_cost_cents computed"
      - "increments RenderBatch.version by 1"

  - method: POST
    path: "/venue/render-batches/{batch_id}/settle"
    description: "Settle a SETTLING batch (assets -> QC)"
    roles: [ContentProducer]
    code: 200
    input: []
    output: RenderBatch
    side_effects:
      - "status -> SETTLED"
      - "RENDERING assets -> QC"
      - "increments RenderBatch.version by 1"

  - method: POST
    path: "/venue/render-batches/{batch_id}/abort"
    description: "Abort a batch"
    roles: [ContentProducer]
    code: 200
    input: []
    output: RenderBatch
    side_effects: ["status -> FAILED; RENDERING assets -> QC_FAILED"]

  # --- Shows ---
  - method: POST
    path: "/venue/shows"
    description: "Create a show under a production"
    roles: [VenueScheduler]
    code: 201
    input: [production_id, show_format, start_time, length_minutes, "peak_rush_minutes?"]
    output: Show
    side_effects: ["status=TENTATIVE"]

  - method: GET
    path: "/venue/shows/{show_id}"
    description: "Get show"
    roles: [VenueScheduler, ProductionDirector, BoxOfficeAgent, Guest]
    code: 200
    input: []
    output: Show
    side_effects: []

  - method: POST
    path: "/venue/shows/{show_id}/schedule-rehearsal"
    description: "Compute rehearsal/changeover windows and move show to REHEARSAL"
    roles: [VenueScheduler]
    code: 200
    input: []
    output: Show
    side_effects:
      - "status -> REHEARSAL"
      - "rehearsal_minutes, changeover_minutes computed"
      - "increments Show.version by 1"

  - method: POST
    path: "/venue/shows/{show_id}/confirm"
    description: "Confirm a show (REHEARSAL -> CONFIRMED), OCC on Production.version"
    roles: [VenueScheduler]
    code: 200
    input: [expected_production_version]
    output: Show
    side_effects:
      - "status -> CONFIRMED"
      - "utilization_at_lock, haptic_surcharge_cents_at_lock pinned"
      - "increments Show.version by 1"

  - method: POST
    path: "/venue/shows/{show_id}/complete"
    description: "Complete a CONFIRMED show; runs settlement"
    roles: [VenueScheduler]
    code: 200
    input: []
    output: Show
    side_effects:
      - "status -> COMPLETED"
      - "Settlement created (FINAL)"
      - "campaign delivered_impressions accrued"
      - "increments Show.version by 1"

  - method: POST
    path: "/venue/shows/{show_id}/cancel"
    description: "Cancel a show"
    roles: [VenueScheduler, ProductionDirector]
    code: 200
    input: []
    output: Show
    side_effects:
      - "status -> CANCELLED"
      - "bookings compensated"

  # --- Bookings ---
  - method: POST
    path: "/venue/shows/{id}/bookings"
    description: "Create a booking (HELD)"
    roles: [Guest, BoxOfficeAgent]
    code: 201
    input: [zone, seats, "seat_kind?"]
    output: Booking
    side_effects:
      - "status=HELD"
      - "unit_price_cents computed per calc_ticket_price; quoted_variant pinned"

  - method: GET
    path: "/venue/bookings/{booking_id}"
    description: "Get booking"
    roles: [Guest, BoxOfficeAgent]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/venue/bookings/{booking_id}/confirm"
    description: "Confirm a HELD booking"
    roles: [Guest, BoxOfficeAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> CONFIRMED", "increments Booking.version by 1"]

  - method: POST
    path: "/venue/bookings/{booking_id}/cancel"
    description: "Cancel a booking (HELD or CONFIRMED)"
    roles: [Guest, BoxOfficeAgent]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> CANCELLED"
      - "refund_cents computed"
      - "increments Booking.version by 1"

  # --- Venue systems & maintenance ---
  - method: POST
    path: "/venue-systems"
    description: "Register a venue system"
    roles: [VenueOpsEngineer]
    code: 201
    input: [name, kind]
    output: VenueSystem
    side_effects: ["status=ONLINE; consecutive_failed_windows=0"]

  - method: GET
    path: "/venue-systems"
    description: "List venue systems"
    roles: [VenueOpsEngineer, VenueScheduler, ProductionDirector]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: VenueSystem[]
    side_effects: []

  - method: GET
    path: "/venue-systems/{system_id}"
    description: "Get venue system"
    roles: [VenueOpsEngineer, VenueScheduler]
    code: 200
    input: []
    output: VenueSystem
    side_effects: []

  - method: POST
    path: "/venue-systems/{system_id}/repair"
    description: "Repair a DEGRADED system back to ONLINE"
    roles: [VenueOpsEngineer]
    code: 200
    input: []
    output: VenueSystem
    side_effects:
      - "status -> ONLINE"
      - "consecutive_failed_windows := 0"
      - "increments VenueSystem.version by 1"

  - method: POST
    path: "/venue/maintenance-windows"
    description: "Schedule a maintenance window"
    roles: [VenueOpsEngineer]
    code: 201
    input: [venue_system_id, start_time, end_time, buffer_minutes]
    output: MaintenanceWindow
    side_effects: ["status=SCHEDULED"]

  - method: POST
    path: "/venue/maintenance-windows/{window_id}/complete"
    description: "Mark an ACTIVE window COMPLETED"
    roles: [VenueOpsEngineer]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects:
      - "status -> COMPLETED"
      - "parent system consecutive_failed_windows := 0"

  - method: POST
    path: "/venue/maintenance-windows/{window_id}/fail"
    description: "Mark an ACTIVE window FAILED"
    roles: [VenueOpsEngineer]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects:
      - "status -> FAILED"
      - "parent system consecutive_failed_windows += 1"

  # --- Sponsors & campaigns ---
  - method: POST
    path: "/venue/sponsors"
    description: "Register a sponsor"
    roles: [SponsorshipManager]
    code: 201
    input: [name, brand_tier]
    output: Sponsor
    side_effects: ["active_campaign_count=0"]

  - method: GET
    path: "/venue/sponsors"
    description: "List sponsors"
    roles: [SponsorshipManager, ProductionDirector]
    code: 200
    input: ["brand_tier?", "limit?", "offset?"]
    output: Sponsor[]
    side_effects: []

  - method: GET
    path: "/venue/sponsors/{sponsor_id}"
    description: "Get sponsor"
    roles: [SponsorshipManager]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  - method: POST
    path: "/venue/campaigns"
    description: "Create a campaign"
    roles: [SponsorshipManager]
    code: 201
    input: [sponsor_id, start_time, end_time, exterior_slots, spot_seconds, contracted_impressions]
    output: Campaign
    side_effects: ["status=DRAFT; delivered_impressions=0"]

  - method: GET
    path: "/venue/campaigns/{campaign_id}"
    description: "Get campaign"
    roles: [SponsorshipManager]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: POST
    path: "/venue/campaigns/{campaign_id}/activate"
    description: "Activate a campaign (OCC on Sponsor.version)"
    roles: [SponsorshipManager]
    code: 200
    input: [expected_sponsor_version]
    output: Campaign
    side_effects:
      - "status -> ACTIVE"
      - "Sponsor.active_campaign_count += 1"
      - "increments Sponsor.version by 1"

  - method: POST
    path: "/venue/campaigns/{campaign_id}/pause"
    description: "Pause an ACTIVE campaign"
    roles: [SponsorshipManager]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "status -> PAUSED"
      - "Sponsor.active_campaign_count -= 1"

  - method: POST
    path: "/venue/campaigns/{campaign_id}/cancel"
    description: "Cancel a campaign"
    roles: [SponsorshipManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status -> CANCELLED; decrement active count if was ACTIVE"]

  # --- Test-driving endpoints ---
  - method: POST
    path: "/venue/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default time is exactly 2026-09-01T00:00:00Z (must NOT fall back to wall-clock) — before any set_current_utc call, the logical clock reads this default."
    roles: [ProductionDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "advance Show COMPLETED transitions whose clock condition now holds"
      - "advance Campaign COMPLETED transitions whose end_time has passed"
      - "expire HELD bookings past the 15-minute hold window"
      - "advance MaintenanceWindow SCHEDULED -> ACTIVE when start_time reached"
      - "advance RenderBatch RENDERING -> SETTLING when render_minutes elapsed"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role header"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a state that permits the requested transition"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version"

  - id: ERR_SHOW_CONFLICT
    http: 422
    condition: "Show reserved window overlaps an existing non-cancelled show"

  - id: ERR_MAINTENANCE_CONFLICT
    http: 422
    condition: "Maintenance window (plus buffer) overlaps a show reserved window, or end_time <= start_time"

  - id: ERR_ZONE_CAPACITY_EXCEEDED
    http: 422
    condition: "Booking seats exceed remaining zone capacity for the show"

  - id: ERR_ACCESSIBILITY_ZONE
    http: 422
    condition: "WHEELCHAIR/COMPANION seat kind not permitted in APEX zone"

  - id: ERR_NO_APPROVED_ASSET
    http: 422
    condition: "Show confirm requires at least one APPROVED asset on the production"

  - id: ERR_TECH_NOT_READY
    http: 422
    condition: "Show confirm requires tech_readiness == READY"

  - id: ERR_PRODUCTION_ALREADY_ACTIVE
    http: 409
    condition: "Another production is already ACTIVE"

  - id: ERR_CAMPAIGN_OVERLAP
    http: 422
    condition: "Sponsor already has an ACTIVE campaign whose flight window overlaps"

  - id: ERR_BATCH_BUSY
    http: 409
    condition: "Batch has no submitted assets, or another batch is RENDERING/SETTLING"

  - id: ERR_RENDER_BLOCKED_BY_MAINTENANCE
    http: 422
    condition: "ENV_FX maintenance window overlaps the projected render window"

  - id: ERR_BOOKING_HOLD_EXPIRED
    http: 422
    condition: "Booking hold window (15 min) has elapsed"

  - id: ERR_ASSET_NOT_IN_QC
    http: 409
    condition: "QC approve/fail requires asset in QC"

  - id: ERR_FORMAT_MISMATCH
    http: 422
    condition: "Haptic-capable production requires WRAP_16K capture format"

roles:
  - name: ProductionDirector
    description: "Owns the production slate and venue calendar at the highest level"
    identity: opaque
    exclusive_operations:
      - "POST /productions"
      - "POST /productions/{id}/activate"
      - "POST /productions/{id}/deactivate"
      - "POST /productions/{id}/retire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET productions, shows, venue-systems, sponsors"

  - name: ContentProducer
    description: "Runs the capture/render/QC pipeline"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{id}/assets"
      - "POST /assets/{id}/qc/approve"
      - "POST /assets/{id}/qc/fail"
      - "POST /assets/{id}/retry"
      - "POST /assets/{id}/archive"
      - "POST /render-batches and batch lifecycle"
    shared_operations:
      - "GET assets, batches"

  - name: VenueScheduler
    description: "Schedules shows, rehearsals, and confirms readiness"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{id}/shows"
      - "POST /shows/{id}/schedule-rehearsal"
      - "POST /productions/{pid}/shows/{sid}/confirm"
      - "POST /shows/{id}/complete"
      - "POST /shows/{id}/cancel"
    shared_operations:
      - "GET shows, venue-systems, maintenance-windows"

  - name: VenueOpsEngineer
    description: "Maintains venue systems (audio beamforming, haptic seating, environmental effects)"
    identity: opaque
    exclusive_operations:
      - "POST /venue-systems"
      - "POST /venue-systems/{id}/repair"
      - "POST /venue-systems/{id}/maintenance-windows"
      - "POST /maintenance-windows/{id}/complete"
      - "POST /maintenance-windows/{id}/fail"
    shared_operations:
      - "GET venue-systems, maintenance-windows"

  - name: SponsorshipManager
    description: "Sells exterior display advertising and manages sponsor campaigns"
    identity: opaque
    exclusive_operations:
      - "POST /sponsors"
      - "POST /sponsors/{id}/campaigns"
      - "POST /sponsors/{sid}/campaigns/{cid}/activate"
      - "POST /campaigns/{id}/pause"
      - "POST /campaigns/{id}/cancel"
    shared_operations:
      - "GET sponsors, campaigns"

  - name: BoxOfficeAgent
    description: "Assists guests with bookings and can act on their behalf"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /shows/{id}/bookings"
      - "POST /bookings/{id}/confirm"
      - "POST /bookings/{id}/cancel"
      - "GET bookings, shows"

  - name: Guest
    description: "Ticket buyer; acts on own bookings"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /shows/{id}/bookings"
      - "POST /bookings/{id}/confirm"
      - "POST /bookings/{id}/cancel"
      - "GET bookings, shows"
