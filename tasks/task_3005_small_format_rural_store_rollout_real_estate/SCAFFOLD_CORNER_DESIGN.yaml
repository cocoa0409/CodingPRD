              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "B", drive_time_minutes: 20, household_count: 3000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
