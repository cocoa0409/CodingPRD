          assert:
            - "${mix_status_now} == SUSPENDED in the suspend call's own response body"
            - "BedRun.${run_id}.status == BLOCKED and blocked_reason == MIX_SUSPENDED on the very next read"
            - "Piece.${pc1_id}.qc_status == HOLD and qc_hold_reason == MIX_SUSPENDED on the very next read"
