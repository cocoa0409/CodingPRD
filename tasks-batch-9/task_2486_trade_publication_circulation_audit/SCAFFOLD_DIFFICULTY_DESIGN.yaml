            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "PURCHASING_AUTHORITY", allowed_values: ["APPROVES"], points: 25, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "India Toolworks", contact_email: "i@india.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 30 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_i_id: $.data.id, sub_i_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_i_id}/source-documents"
              payload: { doc_type: "SIGNED_REQUEST_CARD", captured_at: "2026-07-15T00:00:00Z", storage_ref: "s3://circ/i-card" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_i_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/source-documents/${doc_i_id}/purge"
              payload: { purge_reason: "retention elapsed" }
              as: CirculationManager
              as_user_id: "mgr-01"
