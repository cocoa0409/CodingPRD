            - "valid parent: HTTP 201, data.state_rule_id == \"${sr_tx_id}\" (taken from the path) and data.zip_code == \"78702\""
            - "data.reason == \"DRY_COUNTY\" and data.effective_from == \"2026-01-01\"; the row carries id and created_at but no version"
