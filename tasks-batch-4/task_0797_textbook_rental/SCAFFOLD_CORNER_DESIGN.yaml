              payload: {}
              as: Customer
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # -------------------------------------------------------------------------
  # Cross-cutting: Optimistic Concurrency (OCC)
  # -------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: buyback_requote_stale_customer_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[buyback-requote-stale-customer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second POST /buyback-quotes carrying the pre-first-quote customer version is stale (the first create bumped Customer.version) and returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A customer (version captured pre-quote) has just created one buyback quote, which advanced Customer.version."]
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000125", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "oc@x.com", full_name: "OC" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id", cust_v0: "$.data.version" }
            - call: "POST /buyback-quotes"
              payload: { catalog_item_id: "${cat_id}", declared_condition: "GOOD", expected_customer_version: "${cust_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q1_id: "$.data.id" }
          trigger:
            - call: "POST /buyback-quotes"
              payload: { catalog_item_id: "${cat_id}", declared_condition: "LIKE_NEW", expected_customer_version: "${cust_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: buyback_requote_fresh_version_supersedes_prior
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[buyback-requote-stale-customer]", "state_machines.BuybackQuote.QUOTED_to_SUPERSEDED"]
        distinguishing_aspect: "Re-quoting with the current customer version (re-read after the first quote) succeeds and supersedes the prior quote (q1 -> SUPERSEDED, q2 -> QUOTED)."
        test_recipe:
          setup: ["Customer has a QUOTED quote q1; the client re-reads Customer.version (now advanced) before re-quoting the same item."]
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000126", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "os@x.com", full_name: "OS" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id", cust_v0: "$.data.version" }
            - call: "POST /buyback-quotes"
              payload: { catalog_item_id: "${cat_id}", declared_condition: "GOOD", expected_customer_version: "${cust_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q1_id: "$.data.id" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cust_v1: "$.data.version" }
          trigger:
            - call: "POST /buyback-quotes"
              payload: { catalog_item_id: "${cat_id}", declared_condition: "LIKE_NEW", expected_customer_version: "${cust_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q2_id: "$.data.id" }
          assert:
            - "BuybackQuote.${q1_id}.status == SUPERSEDED"
            - "BuybackQuote.${q2_id}.status == QUOTED"

