              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${filer_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { s_ret: $.data.id }
            - call: "POST /mft/returns/${s_ret}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "GASOLINE", total_gallons: 800.00 }
              as: ReturnsExaminer
              captures: { s_sch: $.data.id }
            - call: "POST /mft/schedules/${s_sch}/lines"
              payload: { counterparty_licensee_id: "${up_id}", transaction_type: "PURCHASE", gallons: 800.00, document_date: "2026-08-07", bill_of_lading_number: "BOL-MS-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
