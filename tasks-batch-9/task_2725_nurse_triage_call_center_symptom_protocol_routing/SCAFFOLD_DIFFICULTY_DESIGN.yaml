  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: nurse_shift_half_open_overlap_rejects_a_one_minute_straddle_but_allows_exact_adjacency
        grounds:
          - validations[priority=40]        # ERR_SHIFT_OVERLAP
          - entities.NurseShift.fields.scheduled_minutes
          - calculations.shift_status_derivation
          - endpoints[POST /nurses/{id}/shifts]
        distinguishing_aspect: "Half-open interval semantics on one nurse's roster: a shift starting exactly when the previous one ends is legal, while one starting a single minute earlier is ERR_SHIFT_OVERLAP — a closed-interval implementation rejects the legal adjacency and an off-by-one comparison accepts the straddle."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T14:30:00Z."
            - "One nurse with one existing shift 2026-08-03T12:00:00Z to 2026-08-03T20:00:00Z (480 scheduled minutes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_a_id: $.data.id }
            - call: "POST /nurses/${nurse_a_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
              captures: { shift_one_id: $.data.id }
          trigger:
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T20:00:00Z", end_utc: "2026-08-03T23:00:00Z" }
              as: PlatformAdmin
              captures: { shift_two_id: $.data.id }
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T19:59:00Z", end_utc: "2026-08-03T21:00:00Z" }
              as: PlatformAdmin
              expect_error: ERR_SHIFT_OVERLAP
              expect_status: 409
          assert:
            - "the adjacent shift request returns HTTP 201"
            - "the one-minute straddle returns error_id ERR_SHIFT_OVERLAP with HTTP status 409"
            - "NurseShift.${shift_one_id}.scheduled_minutes == 480"
            - "NurseShift.${shift_two_id}.scheduled_minutes == 180"
            - "NurseShift.${shift_one_id}.status == ACTIVE"
            - "NurseShift.${shift_two_id}.status == SCHEDULED"
            - "GET /nurses/${nurse_a_id}/shifts returns total_count == 2"

      - name: coverage_window_thirty_minute_buffer_accepts_an_exact_gap_and_rejects_twenty_nine_minutes_on_both_sides
        grounds:
          - validations[priority=41]        # ERR_COVERAGE_WINDOW_CONFLICT
          - state_machines.CoverageWindow.DRAFT_to_ACTIVE
          - endpoints[POST /coverage-windows]
        distinguishing_aspect: "The 30-minute buffer is applied to BOTH sides of the existing window: a candidate ending 29 minutes before the ACTIVE window starts is rejected, one ending exactly 30 minutes before is accepted, and the same pair of outcomes repeats on the trailing edge — an implementation that buffers only the forward side accepts the leading 29-minute case."
        test_recipe:
          setup:
            - "Clock at 2026-07-30T12:00:00Z so every window under test is in the future and no lazy expiry fires."
            - "One ACTIVE coverage window spanning 2026-08-01T00:00:00Z to 2026-08-08T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-30T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, weekend_is_after_hours: true, consent_recording_required: false, variance_review_threshold: 1, audit_period_start_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /coverage-windows"
              payload: { practice_id: "${practice_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-08T00:00:00Z", coverage_kind: "WEEKEND" }
              as: PlatformAdmin
              captures: { window_base_id: $.data.id }
            - call: "POST /coverage-windows/${window_base_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /coverage-windows"
              payload: { practice_id: "${practice_id}", start_utc: "2026-07-31T12:00:00Z", end_utc: "2026-07-31T23:31:00Z", coverage_kind: "NIGHTS" }
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              expect_error: ERR_COVERAGE_WINDOW_CONFLICT
              expect_status: 409
            - call: "POST /coverage-windows"
              payload: { practice_id: "${practice_id}", start_utc: "2026-07-31T12:00:00Z", end_utc: "2026-07-31T23:30:00Z", coverage_kind: "NIGHTS" }
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              captures: { window_before_id: $.data.id }
            - call: "POST /coverage-windows"
              payload: { practice_id: "${practice_id}", start_utc: "2026-08-08T00:29:00Z", end_utc: "2026-08-09T00:00:00Z", coverage_kind: "OVERFLOW" }
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              expect_error: ERR_COVERAGE_WINDOW_CONFLICT
              expect_status: 409
            - call: "POST /coverage-windows"
              payload: { practice_id: "${practice_id}", start_utc: "2026-08-08T00:30:00Z", end_utc: "2026-08-09T00:00:00Z", coverage_kind: "OVERFLOW" }
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              captures: { window_after_id: $.data.id }
          assert:
            - "the 29-minute leading candidate returns error_id ERR_COVERAGE_WINDOW_CONFLICT with HTTP status 409"
            - "the 29-minute trailing candidate returns error_id ERR_COVERAGE_WINDOW_CONFLICT with HTTP status 409"
            - "CoverageWindow.${window_before_id}.status == DRAFT"
            - "CoverageWindow.${window_before_id}.coverage_kind == NIGHTS"
            - "CoverageWindow.${window_after_id}.status == DRAFT"
            - "CoverageWindow.${window_base_id}.status == ACTIVE"
            - "GET /practices/${practice_id}/coverage-windows returns total_count == 3"

