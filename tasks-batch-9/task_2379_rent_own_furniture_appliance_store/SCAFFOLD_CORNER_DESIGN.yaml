            - "the first create returns 201 with status == SCHEDULED and Agreement.${agr_id}.version becomes ${agr_v1} + 1"
            - "the second create reusing ${agr_v1} returns 412 ERR_STALE_AGREEMENT_VERSION; DeliveryOrder.${do1_id} is untouched (status SCHEDULED, attempt_count 0) and no third order exists"
            - "the retry with ${agr_v2} returns 201 with status == SCHEDULED, attempt_count == 0, crew_id == ${crew_tx_id} and the identical 2026-08-03T09:00:00Z-11:00:00Z window — the superseded order's window was released before the conflict check ran, so ERR_CREW_WINDOW_CONFLICT is not raised"
            - "GET /delivery-orders/${do1_id} now reports status == SUPERSEDED with completed_at null"
            - "GET /delivery-orders?agreement_id=${agr_id} reports total_count == 2 (same window_start_at, so created_at ASC breaks the tie) with statuses SUPERSEDED then SCHEDULED, and InventoryUnit.${unit_tx_id}.status is still RESERVED"

      - name: curing_payment_cascade_reaches_every_dependent_row
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Agreement.payment_status.DELINQUENT_to_CURRENT
        excluded_because:
          difficulty_instance: transitive_cascade / curing_payment_cascades_five_hops_from_window_to_loyalty_tier
          rationale: "That instance asserts all five hops of the cure cascade (window USED, fee balances cleared, stage NONE, ledger entry appended, tier recomputed) from a single payment."

      - name: payoff_quotes_diverge_by_state_formula
        claim_type: dual_variant_calculation
        grounds:
          - calculations.early_purchase_payoff.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / early_purchase_payoff_pct_of_remaining_vs_cash_price_minus_credit
          rationale: "That instance runs both variants side by side on identically-shaped agreements in two states and asserts each payoff, which is the whole dual-variant layer."

  # ===========================================================================
  # 9. Consistency model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: payment_response_and_immediate_reread_agree_on_every_cascaded_field
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints[POST /agreements/{id}/renewal-payments]
          - calculations.loyalty_points_accrual
        distinguishing_aspect: |
          The model is immediate: the write response and a same-instant re-read
          of every row the payment touched — agreement ledger, customer loyalty
          aggregate, the appended ledger entry and the payment row itself — carry
          identical values, with no settle step, no background job and no
          eventual convergence. balance_after on the ledger entry equals the
          customer's re-read balance exactly.
        test_recipe:
          setup:
            - "one TX StateRtoRule"
            - "one DELIVERED TX agreement, WEEKLY x 52 on a NEW FURNITURE unit of 120000 (rate 5077, total 269004), cycle_anchor_at 2026-08-01T00:00:00Z, no payments"
            - "the customer at loyalty_points_balance 0 and loyalty_tier STANDARD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/delivery-crews"
              payload: { crew_name: "TX Crew A", setup_certified: true }
              as: StoreManager
              captures: { crew_tx_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_tx_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_id: $.data.id, agr_v1: $.data.version }
            - call: "POST /agreements/${agr_id}/delivery-orders"
              payload: { crew_id: "${crew_tx_id}", service_type: "DELIVERY_ONLY", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_agreement_version: "${agr_v1}" }
              as: StoreManager
              captures: { do_id: $.data.id }
            - call: "POST /delivery-orders/${do_id}/complete"
              payload: { setup_completed: false }
              as: ServiceTechnician
          trigger:
            - call: "POST /agreements/${agr_id}/renewal-payments"
              payload: { amount_cents: 5077, payment_method: "CASH" }
              as: SalesAssociate
              captures: { pay_id: $.data.id }
            - call: "GET /agreements/${agr_id}"
              as: StoreManager
            - call: "GET /customers/${cust_id}"
              as: StoreManager
            - call: "GET /agreements/${agr_id}/renewal-payments"
              as: StoreManager
            - call: "GET /loyalty-ledger-entries?agreement_id=${agr_id}"
              as: StoreManager
          assert:
            - "the POST response carries periods_advanced == 1, allocation_rent_cents == 5077, allocation_partial_credit_cents == 0, allocation_customer_credit_cents == 0, partial_credit_before_cents == 0, days_late == 0, cured_delinquency == false, loyalty_points_awarded == 75 (50 for the rent cents at the STANDARD multiplier plus the 25 on-time bonus) and status == POSTED"
            - "the immediate GET /agreements/${agr_id} returns periods_paid == 1, rent_applied_cents == 5077, partial_credit_cents == 0, paid_pct == 0.0189, current_period_due_at == 2026-08-15T00:00:00Z and payment_status == CURRENT — the same values the POST implied, with no settle step"
            - "the immediate GET /customers/${cust_id} returns loyalty_points_balance == 75, loyalty_points_lifetime == 75, loyalty_tier == STANDARD and credit_balance_cents == 0"
            - "GET /agreements/${agr_id}/renewal-payments reports total_count == 1 and every field of that row equals the POST response body field for field, including posted_at == 2026-08-01T00:00:00Z"
            - "GET /loyalty-ledger-entries?agreement_id=${agr_id} reports total_count == 1 with entry_type == PAYMENT_ACCRUAL, delta_points == 75 and balance_after == 75, matching the customer's re-read balance exactly"
