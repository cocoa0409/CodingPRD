      - name: err_school_cap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCHOOL_APPLICATION_CAP_REACHED]"]
        excluded_because:
          difficulty_instance: school_cap_boundary_at_cap
          rationale: "Triggered at the exact cap boundary by the named §1.8 instance."
      - name: err_offer_expired_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_EXPIRED]"]
        excluded_because:
          difficulty_instance: offer_deadline_inclusive_boundary
          rationale: "Triggered one second past deadline_at by the named §1.8 instance."
      - name: err_event_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_TIME_OVERLAP]"]
        excluded_because:
          difficulty_instance: event_half_open_adjacency_allowed
          rationale: "Triggered by the one-second-overlap event in the named §1.8 instance."
      - name: err_evaluator_schedule_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVALUATOR_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: evaluator_buffered_gap_fifteen_minutes
          rationale: "Triggered by the zero-gap booking in the named §1.8 instance."
      - name: err_evaluator_coi_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVALUATOR_CONFLICT_OF_INTEREST]"]
        excluded_because:
          difficulty_instance: slot_book_safety_beats_temporal
          rationale: "Triggered as the winning error of the safety-vs-temporal priority pair in the named §1.8 instance."
      - name: err_offer_state_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_STATE_FORBIDDEN]"]
        excluded_because:
          difficulty_instance: accept_expired_offer_state_beats_fiscal
          rationale: "Triggered as the winning error of the state-vs-fiscal priority pair in the named §1.8 instance (also re-exercised as terminal lockdown by offer_terminal_lockdown_decline_accepted)."

