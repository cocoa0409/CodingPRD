  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: advance_ledger_conserved_across_audit_reversal_with_cap_read_at_start
        grounds:
          - calculations.advance_recoupment_and_payable
          - calculations.advance_recoupment_and_payable.constants.LATE_INTEREST_BPS_PER_DAY
          - state_machines.RoyaltyReport.UNDER_AUDIT_to_ADJUSTED
          - state_machines.LicenseAgreement.compliance_posture.CLEAR_to_PROBATION
          - entities.LicenseAgreement.fields.unrecouped_advance_cents
          - entities.LicenseAgreement.fields.recouped_advance_cents
        distinguishing_aspect: |
          advance_paid_cents == unrecouped_advance_cents + recouped_advance_cents must
          hold with ZERO drift before and after a compensating reversal. The settle call
          reverses the accepted posting (recouped 500000 -> 0) and re-applies it at the
          adjusted royalty, and because the recoupment cap is read from the posture in
          force AT THE START of the transition it uses 10000 bps for 525000 — NOT the
          262500 that the PROBATION cap cascaded by the very same request would produce.
          The next filing, which starts while the posture is already PROBATION, is capped
          at 5000 bps and recoups only 250000, so the same agreement shows both caps in
          one test. A naive re-application (add without reversing) leaves recouped at
          1025000 and breaks the identity; re-reading the posture after the cascade
          yields 262500.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z; FILING_DEADLINE_DATE(2026Q1) == 2026-05-15, so a 2026Q1 filing today is 78 days late"
            - "licensee LIC_K ACTIVE; agreement AGR_K ACTIVE on category JERSEY, MG 4000000, required_advance 1000000 fully paid, posture CLEAR"
            - "one AUTHORIZED DEPARTMENT authorization covering 2026-01-01..2028-12-31"
            - "a 2026Q2 report (gross 6250000) is FILED and ACCEPTED by u_fin_1, so the ledger reads unrecouped 500000 / recouped 500000 / cumulative 500000"
            - "a 2026Q1 report (gross 6250000) is created and left in DRAFT"
            - "one EnforcementAction naming LIC_K reaches SEIZURE_ORDERED at 2026Q3 (weight 15)"
            - "u_aud_1 opens an engagement scoped to [2026Q2], begins fieldwork and issues findings restating gross to 6562500"
