              as: CatalogAdmin
              captures: { pnc: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${pnc}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${pnc}"
              captures: { cartnc: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartnc}", test_offering_id: "${off_nc}" }
              as: Patient
              as_user_id: "${pnc}"
            - call: "GET /catalog/carts/${cartnc}"
              as: Patient
              as_user_id: "${pnc}"
              captures: { cartnc_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartnc}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartnc_v}" }
              as: Patient
              as_user_id: "${pnc}"
              captures: { ordernc: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${ordernc}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${pnc}"
            - call: "GET /catalog/order-lines?order_id=${ordernc}"
              as: CatalogAdmin
              captures: { olnc: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${olnc}/collect"
              as: PhlebotomyTech
              captures: { specnc: '$.data.id' }
            - call: "POST /catalog/specimens/${specnc}/process"
              payload: { analyzer_value: 150 }
              as: LabTech
              captures: { resnc: '$.data.id' }
          trigger:
            - call: "POST /catalog/lab-results/${resnc}/release"
              as: LabTech
              captures: { resnc_final: '$.data.final_flag', resnc_status: '$.data.status' }
            - call: "GET /catalog/telehealth-referrals?lab_result_id=${resnc}"
              as: LabTech
              captures: { ref_count: '$.meta.total_count' }
          assert:
            - "LabResult.${resnc}.status == RELEASED; final_flag == ABNORMAL"
            - "telehealth-referrals list for ${resnc}: total_count == 0"

