  - rule_id: boundary_precision_check
    instances:
      - name: circuit_fee_tier_boundary_and_half_up_tie_at_settlement_draft
        grounds:
          - calculations.show_settlement_payout
          - entities.ShowSettlement.fields.provisional_circuit_fee_cents
          - entities.ShowSettlement.fields.provisional_prize_cents
          - entities.ShowSettlement.fields.provisional_net_cents
        distinguishing_aspect: |
          Threshold-minus-one / threshold on the CIRCUIT_FEE_TIER_1_MAX_CENTS
          boundary plus an exact .5 rounding tie, all on the provisional variant:
          gross 1499999 pays 4.0% (60000, itself a round_half_up of 59999.96) while
          gross 1500000 — one cent more — pays 5.5% (82500), a 22500-cent step,
          because the tier predicate is `gross < 1500000` and not `<=`. A third
          settlement forces prize_pool 1050 x 0.09 == 94.50 exactly, which must
          round UP to 95 (truncation or banker's rounding gives 94) and then pay
          4003.80 -> 4004.
        test_recipe:
          setup:
            - "A 2027 season with three unchained SHOW stops, each CONFIRMED with an empty roster and then COMPLETED after the clock passes 2027-06-23."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "SHOW", venue_name: "Allen Stadium", city: "Allen", state_code: "TX", arrive_at: "2027-06-20T14:00:00Z", depart_at: "2027-06-20T23:30:00Z", show_start_at: "2027-06-20T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 0, heat_index_f: 80 }
              as: TourManager
              captures: { stop_lo_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "SHOW", venue_name: "Denton Bowl", city: "Denton", state_code: "TX", arrive_at: "2027-06-21T14:00:00Z", depart_at: "2027-06-21T23:30:00Z", show_start_at: "2027-06-21T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 0, heat_index_f: 80 }
              as: TourManager
              captures: { stop_at_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "SHOW", venue_name: "Waco Field", city: "Waco", state_code: "TX", arrive_at: "2027-06-22T14:00:00Z", depart_at: "2027-06-22T23:30:00Z", show_start_at: "2027-06-22T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 0, heat_index_f: 80 }
              as: TourManager
              captures: { stop_tie_id: "$.data.id" }
            - call: "POST /tour-stops/${stop_lo_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tour-stops/${stop_at_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tour-stops/${stop_tie_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-23T00:00:00Z" }
              as: TourManager
            - call: "POST /tour-stops/${stop_lo_id}/complete"
              payload: {}
              as: TourManager
            - call: "POST /tour-stops/${stop_at_id}/complete"
              payload: {}
              as: TourManager
            - call: "POST /tour-stops/${stop_tie_id}/complete"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${stop_lo_id}", appearance_fee_cents: 1399999, prize_pool_cents: 625000, projected_placement: 3 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { settlement_lo_id: "$.data.id" }
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${stop_at_id}", appearance_fee_cents: 1400000, prize_pool_cents: 625000, projected_placement: 3 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { settlement_at_id: "$.data.id" }
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${stop_tie_id}", appearance_fee_cents: 100000, prize_pool_cents: 1050, projected_placement: 5 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { settlement_tie_id: "$.data.id" }
          assert:
            - "ShowSettlement.${settlement_lo_id}.provisional_prize_cents == 100000 and provisional_gross_cents == 1499999"
            - "ShowSettlement.${settlement_lo_id}.provisional_circuit_fee_cents == 60000 (4.0% of 1499999 == 59999.96 rounded half up) and provisional_net_cents == 1439999"
            - "ShowSettlement.${settlement_at_id}.provisional_gross_cents == 1500000"
            - "ShowSettlement.${settlement_at_id}.provisional_circuit_fee_cents == 82500 (5.5%, because the tier predicate is gross < 1500000 and 1500000 is NOT below the boundary) and provisional_net_cents == 1417500"
            - "the one-cent gross difference produces a 22500-cent fee difference: 82500 - 60000 == 22500"
            - "ShowSettlement.${settlement_tie_id}.provisional_prize_cents == 95 (1050 * 0.09 == 94.50 exactly, rounded half UP; 94 is wrong)"
            - "ShowSettlement.${settlement_tie_id}.provisional_gross_cents == 100095 and provisional_circuit_fee_cents == 4004 (4003.80 rounded half up) and provisional_net_cents == 96091"
            - "all three settlements are status DRAFT with final_net_cents null and variance_cents null"

