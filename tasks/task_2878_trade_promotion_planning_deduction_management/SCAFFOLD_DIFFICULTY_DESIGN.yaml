      - name: dispute_write_off_chain_reaches_allocation_at_risk_amount
        cascade_depth: 4
        grounds:
          - state_machines.Dispute.status
          - calculations.promotion_accrual_ledger
          - calculations.post_event_analysis
          - calculations.allocation_ledger_rollup
          - entities.BudgetAllocation.fields.at_risk_amount
        distinguishing_aspect: |
          A different trigger (a 450.00 dispute write-off, not a deduction validation) drives a
          four-hop chain through a different set of derived quantities (recognized spend -> ROI
          -> performance flag -> at-risk dollars, not spend ratio -> posture -> penalty points):
          hop 1 written_off_total 450.00 lifts consumed_deduction_amount to 2450.00 and
          spend_status WITHIN_BUDGET -> OVERSPEND_WARNING at ratio 0.9800; hop 2 the existing
          PostEventAnalysis recomputes net_spend 2000.00 -> 2450.00 and roi 1.2000 -> 0.9796;
          hop 3 that drops roi below ROI_FLOOR so Promotion.performance_flag goes ON_TRACK ->
          UNDERPERFORMING; hop 4 BudgetAllocation.at_risk_amount goes 0.00 -> 2450.00. Because
          recognized_spend_amount is max(accrual view, deduction view) and the validated
          deduction 2000.00 already exceeded the 1812.50 accrual view, the write-off really does
