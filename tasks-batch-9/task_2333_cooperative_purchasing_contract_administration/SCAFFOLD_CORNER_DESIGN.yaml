            - "the undocumented nonprofit returns error_id == ERR_NONPROFIT_EVIDENCE_MISSING with http_status == 422"
            - "the NV nonprofit returns error_id == ERR_NONPROFIT_NOT_PERMITTED with http_status == 422"
