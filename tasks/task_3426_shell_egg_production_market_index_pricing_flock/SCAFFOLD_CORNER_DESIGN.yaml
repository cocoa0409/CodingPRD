        distinguishing_aspect: "Chronological receipt costing: the 100 hedged tons price the FIRST receipt (100 of 120 tons at 18000, the rest at 19500 -> running average 18250); the second receipt of 80 tons is entirely unhedged at 20000 -> cumulative average 18950."
        test_recipe:
          setup: ["The contract fixture of feed_batch_actual_fifo_vs_standard_budget after the FIRST receipt only: CORN 200 tons, basis 2000, hedged 100 @ 16000, receipt of 120 tons at spot 17500 on 2026-09-02."]
