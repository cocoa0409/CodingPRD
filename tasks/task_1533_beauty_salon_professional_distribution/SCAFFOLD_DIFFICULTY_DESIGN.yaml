            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-J1", name: "Cream", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 10000, weight_grams: 200 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-J2", name: "Sachet", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 500, weight_grams: 10 }, as: DistributionAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /api/promotions", payload: { code: "SAMP9", promo_type: SAMPLE, eligible_tiers: [SILVER], starts_at: "2026-07-01T00:00:00Z", ends_at: "2027-01-01T00:00:00Z", budget_units: 5, per_salon_cap: 10, sample_product_id: "${p2}", sample_units_per_redemption: 2 }, as: DistributionAdmin, captures: { promo: "$.data.id" } }
            - { call: "POST /api/promotions/${promo}/activate", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /api/orders/${o_id}/redeem-promotion", payload: { code: "SAMP9" }, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "GET /api/promotion-redemptions?order_id=${o_id}", payload: {}, as: DistributionAdmin, captures: { red: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/orders/${o_id}/cancel", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "GET /api/promotions/${promo}", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/promotion-redemptions/${red}", payload: {}, as: DistributionAdmin }
          assert:
            - "Promotion.${promo}.remaining_budget_units == 5 (2 units restored by reversal)"
            - "PromotionRedemption.${red}.status == REVERSED with reversal_reason == ORDER_CANCELLED"
            - "Order.${o_id}.fulfillment_status == CANCELLED"
