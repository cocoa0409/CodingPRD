# =============================================================================
# SCAFFOLD.yaml — Captive Insurance Management (task_1174)
# Difficulty: Harder than Expert — 14 entities, 36 endpoints, 30 errors,
# 6 calculations (4 dual-variant), 6 state machines (cyclic + parallel +
# branching + compound), OCC on 2 entities, 9 difficulty rules x 2 instances.
# =============================================================================

scenario: |
  1174. Captive Insurance Management (captive management firm): captive formation &
  domicile regulatory filing, capitalization & solvency requirement monitoring,
  program design & fronting arrangement with collateral, premium allocation to
  parent operating units, claims handling & TPA oversight, actuarial reserve
  certification & annual statement, board meeting & governance documentation,
  tax positions & risk distribution analysis

domain_name: captive-insurance-management
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CaptiveEntity
    parent: null
    common_fields: true
    fields:
      - { name: captive_name, type: string, source: input, description: "Legal name of the captive insurance company" }
      - { name: domicile_jurisdiction, type: enum, source: input, description: "Regulatory domicile: VERMONT | BERMUDA | CAYMAN | GUERNSEY | LUXEMBOURG" }
      - { name: formation_date, type: datetime, source: input, description: "Date of captive formation" }
      - { name: capitalization_amount, type: number, source: input, description: "Initial capitalization in cents" }
      - { name: capital_minimum_required, type: number, source: computed, description: "Read-only minimum capital required by domicile regulator" }
      - { name: solvency_ratio, type: number, source: computed, description: "Read-only = (admitted_assets / required_capital) * 100" }
      - { name: solvency_status, type: enum, source: computed, description: "ADEQUATE | WARNING | BREACH — derived from solvency_ratio thresholds" }
      - { name: admitted_assets, type: number, source: computed, description: "Read-only sum of collateral posted + premiums received - claims paid" }
      - { name: total_reserves_held, type: number, source: computed, description: "Read-only sum of all active reserve amounts" }
      - { name: total_premium_written, type: number, source: computed, description: "Read-only sum of all premium allocations" }
      - { name: governance_score, type: number, source: computed, default: 100, description: "Read-only governance health score, starts at 100, decremented by violations" }
      - { name: status, type: enum, source: system, description: "FORMATION_PENDING -> DOMICILE_FILED -> CAPITALIZED -> ACTIVE -> SUSPENDED / DISSOLVED" }
      - { name: tax_classification, type: enum, source: input, default: "MICRO_CAPTIVE_831B", description: "Tax election: MICRO_CAPTIVE_831B | STANDARD_831A | NON_ELECTING" }
      - { name: risk_distribution_score, type: number, source: computed, description: "Read-only IRS risk distribution adequacy score 0-100" }

  - name: DomicileFiling
    parent: CaptiveEntity
    common_fields: true
    fields:
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive" }
      - { name: filing_type, type: enum, source: input, description: "INITIAL_FORMATION | ANNUAL_RENEWAL | AMENDMENT | REDOMESTICATION" }
      - { name: jurisdiction, type: enum, source: input, description: "VERMONT | BERMUDA | CAYMAN | GUERNSEY | LUXEMBOURG" }
      - { name: filing_fee_cents, type: number, source: computed, description: "Read-only fee computed from jurisdiction + filing_type schedule" }
      - { name: supporting_documents, type: array, source: input, description: "Array of {document_type, document_url, uploaded_at}" }
      - { name: regulator_reference, type: string, source: system, description: "Regulator-issued reference number, populated on acknowledgment" }
      - { name: review_deadline, type: datetime, source: computed, description: "Read-only deadline = filed_at + jurisdiction_review_days" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> UNDER_REVIEW -> APPROVED / REJECTED / WITHDRAWN" }
      - { name: rejection_reason, type: string, source: system, description: "Populated when status = REJECTED" }
      - { name: filed_at, type: datetime, source: system, description: "Timestamp of submission" }

  - name: InsuranceProgram
    parent: CaptiveEntity
    common_fields: true
    fields:
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive" }
      - { name: program_name, type: string, source: input, description: "Name of insurance program" }
      - { name: line_of_business, type: enum, source: input, description: "GENERAL_LIABILITY | WORKERS_COMP | PROPERTY | PROFESSIONAL_LIABILITY | CYBER | D_AND_O" }
      - { name: policy_period_start, type: datetime, source: input, description: "Coverage start date" }
      - { name: policy_period_end, type: datetime, source: input, description: "Coverage end date (must be > policy_period_start)" }
      - { name: aggregate_limit_cents, type: number, source: input, description: "Maximum aggregate liability in cents" }
      - { name: per_occurrence_limit_cents, type: number, source: input, description: "Maximum per-occurrence liability in cents" }
      - { name: attachment_point_cents, type: number, source: input, description: "Retained risk attachment point in cents" }
      - { name: premium_budget_cents, type: number, source: input, description: "Total premium budget for the period in cents" }
      - { name: premium_allocated_cents, type: number, source: computed, default: 0, description: "Read-only sum of all premium allocations to operating units" }
      - { name: claims_incurred_cents, type: number, source: computed, default: 0, description: "Read-only sum of all claims incurred" }
      - { name: claims_paid_cents, type: number, source: computed, default: 0, description: "Read-only sum of all claims paid" }
      - { name: loss_ratio, type: number, source: computed, description: "Read-only = claims_incurred_cents / premium_allocated_cents * 100 (0 if no premium)" }
      - { name: program_status, type: enum, source: system, description: "DRAFT -> QUOTED -> BOUND -> IN_FORCE -> RUN_OFF -> CLOSED / CANCELLED" }
      - { name: coverage_status, type: enum, source: system, description: "UNBOUND | BOUND | EXPIRED — parallel dimension tracking coverage binding" }
      - { name: fronting_required, type: boolean, source: input, default: false, description: "Whether fronting arrangement is required" }

  - name: FrontingArrangement
    parent: InsuranceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; parent program" }
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive (denormalized)" }
      - { name: fronting_carrier_name, type: string, source: input, description: "Name of the fronting carrier" }
      - { name: fronting_fee_pct, type: number, source: input, description: "Fronting fee as percentage of gross premium (0.01 to 0.15)" }
      - { name: collateral_required_cents, type: number, source: computed, description: "Read-only collateral required by fronting carrier" }
      - { name: collateral_posted_cents, type: number, source: computed, default: 0, description: "Read-only total collateral posted" }
      - { name: collateral_shortfall_cents, type: number, source: computed, description: "Read-only = max(0, collateral_required_cents - collateral_posted_cents)" }
      - { name: reinsurance_ceded_pct, type: number, source: input, description: "Percentage of risk ceded back to captive (0.0 to 1.0)" }
      - { name: fronting_fee_amount_cents, type: number, source: computed, description: "Read-only = program.premium_allocated_cents * fronting_fee_pct" }
      - { name: status, type: enum, source: system, description: "NEGOTIATING -> TERMS_AGREED -> COLLATERAL_POSTED -> ACTIVE -> EXPIRED / TERMINATED" }

  - name: CollateralPosting
    parent: FrontingArrangement
    common_fields: true
    fields:
      - { name: fronting_arrangement_id, type: string, source: system, description: "FK -> FrontingArrangement.id; parent fronting arrangement" }
      - { name: collateral_type, type: enum, source: input, description: "LETTER_OF_CREDIT | TRUST_ACCOUNT | SURETY_BOND | CASH_ESCROW | INVESTMENT_SECURITIES" }
      - { name: amount_cents, type: number, source: input, description: "Collateral amount in cents" }
      - { name: posted_date, type: datetime, source: input, description: "Date collateral was posted" }
      - { name: expiry_date, type: datetime, source: input, description: "Date collateral expires (must be > posted_date)" }
      - { name: issuing_institution, type: string, source: input, description: "Bank or institution issuing the collateral" }
      - { name: verification_status, type: enum, source: system, description: "PENDING_VERIFICATION -> VERIFIED -> RELEASED / EXPIRED" }
      - { name: haircut_pct, type: number, source: computed, description: "Read-only haircut applied to collateral value based on type" }
      - { name: effective_value_cents, type: number, source: computed, description: "Read-only = amount_cents * (1 - haircut_pct)" }

  - name: OperatingUnit
    parent: CaptiveEntity
    common_fields: true
    fields:
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive" }
      - { name: unit_name, type: string, source: input, description: "Name of the operating unit" }
      - { name: unit_code, type: string, source: input, description: "Unique code for the operating unit within the captive" }
      - { name: exposure_basis, type: enum, source: input, description: "REVENUE | HEADCOUNT | PAYROLL | ASSET_VALUE | SQUARE_FOOTAGE" }
      - { name: exposure_amount, type: number, source: input, description: "Quantitative exposure measure in units matching exposure_basis" }
      - { name: total_premium_allocated_cents, type: number, source: computed, default: 0, description: "Read-only sum of all premium allocations received" }
      - { name: total_claims_incurred_cents, type: number, source: computed, default: 0, description: "Read-only sum of all claims filed" }
      - { name: loss_ratio, type: number, source: computed, description: "Read-only = total_claims_incurred_cents / total_premium_allocated_cents * 100 (0 if no premium)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED / DECOMMISSIONED" }

  - name: PremiumAllocation
    parent: InsuranceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; parent program" }
      - { name: operating_unit_id, type: string, source: input, description: "FK -> OperatingUnit.id; target operating unit" }
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive (denormalized)" }
      - { name: allocation_method, type: enum, source: input, description: "EXPOSURE_PRO_RATA | EQUAL_SHARE | MANUAL | RISK_WEIGHTED" }
      - { name: allocated_amount_cents, type: number, source: computed, description: "Read-only computed allocation amount" }
      - { name: provisional_amount_cents, type: number, source: computed, description: "Read-only provisional allocation (pre-audit)" }
      - { name: final_amount_cents, type: number, source: computed, description: "Read-only final allocation (post-audit), null until audit" }
      - { name: adjustment_cents, type: number, source: computed, description: "Read-only = final_amount_cents - provisional_amount_cents (delta on finalization)" }
      - { name: risk_weight, type: number, source: input, default: 1.0, description: "Risk weight multiplier for RISK_WEIGHTED method (0.1 to 5.0)" }
      - { name: allocation_period_start, type: datetime, source: input, description: "Start of allocation period" }
      - { name: allocation_period_end, type: datetime, source: input, description: "End of allocation period" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> AUDITED -> FINALIZED / DISPUTED / CANCELLED" }

  - name: Claim
    parent: InsuranceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; parent program" }
      - { name: operating_unit_id, type: string, source: input, description: "FK -> OperatingUnit.id; claiming operating unit" }
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive (denormalized)" }
      - { name: claim_number, type: string, source: system, description: "System-generated claim number (CLM-YYYYMMDD-NNNN)" }
      - { name: claimant_name, type: string, source: input, description: "Name of claimant" }
      - { name: loss_date, type: datetime, source: input, description: "Date of loss occurrence" }
      - { name: reported_date, type: datetime, source: system, description: "Date claim was reported" }
      - { name: claimed_amount_cents, type: number, source: input, description: "Amount claimed in cents" }
      - { name: reserved_amount_cents, type: number, source: computed, description: "Read-only current reserve amount" }
      - { name: paid_amount_cents, type: number, source: computed, default: 0, description: "Read-only total paid across all payments" }
      - { name: recoverable_amount_cents, type: number, source: computed, default: 0, description: "Read-only salvage/subrogation recovery" }
      - { name: net_incurred_cents, type: number, source: computed, description: "Read-only = paid_amount_cents + reserved_amount_cents - recoverable_amount_cents" }
      - { name: tpa_assigned_id, type: string, source: input, description: "FK -> TPAAssignment.id; assigned TPA (nullable)" }
      - { name: coverage_confirmed, type: boolean, source: computed, description: "Read-only whether loss falls within policy period and limits" }
      - { name: claim_status, type: enum, source: system, description: "REPORTED -> ACKNOWLEDGED -> UNDER_INVESTIGATION -> RESERVED -> SETTLED / DENIED / CLOSED_WITHOUT_PAYMENT" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID -> PARTIALLY_PAID -> FULLY_PAID — parallel dimension" }
      - { name: litigation_status, type: enum, source: system, default: "NOT_LITIGATED", description: "NOT_LITIGATED -> LITIGATED -> SETTLED_IN_LITIGATION — parallel dimension" }

  - name: TPAAssignment
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; parent claim" }
      - { name: tpa_firm_name, type: string, source: input, description: "Name of third-party administrator firm" }
      - { name: tpa_contact_email, type: string, source: input, description: "TPA contact email" }
      - { name: assignment_date, type: datetime, source: system, description: "Date TPA was assigned" }
      - { name: authority_limit_cents, type: number, source: input, description: "Maximum settlement authority for this TPA" }
      - { name: fee_structure, type: enum, source: input, description: "FLAT_FEE | PER_CLAIM | PERCENTAGE_OF_SAVINGS" }
      - { name: fee_amount_cents, type: number, source: input, description: "TPA fee amount in cents" }
      - { name: performance_score, type: number, source: computed, default: 100, description: "Read-only TPA performance score (0-100)" }
      - { name: sla_compliance_pct, type: number, source: computed, description: "Read-only percentage of SLA deadlines met" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED -> REINSTATED / TERMINATED — cyclic" }

  - name: ActuarialReserve
    parent: InsuranceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; parent program" }
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive (denormalized)" }
      - { name: reserve_type, type: enum, source: input, description: "CASE_RESERVE | IBNR_RESERVE | LAE_RESERVE | UNALLOCATED_EXPENSE" }
      - { name: actuarial_method, type: enum, source: input, description: "CHAIN_LADDER | BORNHUETTER_FERGUSON | EXPECTED_LOSS_RATIO | BERQUIST_SHERMAN" }
      - { name: valuation_date, type: datetime, source: input, description: "As-of date for reserve valuation" }
      - { name: central_estimate_cents, type: number, source: computed, description: "Read-only actuarial central estimate" }
      - { name: low_estimate_cents, type: number, source: computed, description: "Read-only 75th percentile low estimate" }
      - { name: high_estimate_cents, type: number, source: computed, description: "Read-only 90th percentile high estimate" }
      - { name: carried_reserve_cents, type: number, source: computed, description: "Read-only booked reserve (between low and high)" }
      - { name: confidence_level_pct, type: number, source: input, default: 75, description: "Confidence level for carried reserve (50-95)" }
      - { name: development_factor, type: number, source: computed, description: "Read-only loss development factor used" }
      - { name: certified_by, type: string, source: system, description: "Actuary user ID who certified" }
      - { name: certification_date, type: datetime, source: system, description: "Date of certification" }
      - { name: status, type: enum, source: system, description: "PRELIMINARY -> REVIEWED -> CERTIFIED -> FILED / SUPERSEDED" }

  - name: AnnualStatement
    parent: CaptiveEntity
    common_fields: true
    fields:
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive" }
      - { name: statement_year, type: integer, source: input, description: "Calendar year of the statement" }
      - { name: filing_deadline, type: datetime, source: computed, description: "Read-only regulatory filing deadline" }
      - { name: total_assets_cents, type: number, source: computed, description: "Read-only total admitted assets" }
      - { name: total_liabilities_cents, type: number, source: computed, description: "Read-only total liabilities" }
      - { name: policyholder_surplus_cents, type: number, source: computed, description: "Read-only = total_assets_cents - total_liabilities_cents" }
      - { name: net_premium_written_cents, type: number, source: computed, description: "Read-only net written premium for the year" }
      - { name: net_losses_incurred_cents, type: number, source: computed, description: "Read-only net incurred losses for the year" }
      - { name: combined_ratio, type: number, source: computed, description: "Read-only = (loss_ratio + expense_ratio) * 100" }
      - { name: expense_ratio, type: number, source: computed, description: "Read-only operating expense ratio" }
      - { name: underwriting_result_cents, type: number, source: computed, description: "Read-only net underwriting profit/loss" }
      - { name: investment_income_cents, type: number, source: input, description: "Investment income earned in cents" }
      - { name: rbc_ratio, type: number, source: computed, description: "Read-only risk-based capital ratio" }
      - { name: rbc_action_level, type: enum, source: computed, description: "NONE | COMPANY_ACTION | REGULATORY_ACTION | AUTHORIZED_CONTROL | MANDATORY_CONTROL" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTUARIAL_REVIEW -> BOARD_APPROVED -> FILED / AMENDED" }

  - name: BoardMeeting
    parent: CaptiveEntity
    common_fields: true
    fields:
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive" }
      - { name: meeting_date, type: datetime, source: input, description: "Date of board meeting" }
      - { name: meeting_type, type: enum, source: input, description: "ANNUAL | QUARTERLY | SPECIAL | EMERGENCY" }
      - { name: quorum_required, type: integer, source: computed, description: "Read-only minimum directors required for quorum" }
      - { name: directors_present, type: integer, source: input, description: "Number of directors present" }
      - { name: quorum_met, type: boolean, source: computed, description: "Read-only = directors_present >= quorum_required" }
      - { name: agenda_items, type: array, source: input, description: "Array of {item_number, description, resolution_required}" }
      - { name: resolutions_passed, type: array, source: system, description: "Array of {item_number, resolution_text, vote_result}" }
      - { name: minutes_document_url, type: string, source: input, description: "URL to meeting minutes document" }
      - { name: annual_meeting_completed, type: boolean, source: computed, description: "Read-only whether this satisfies annual meeting requirement" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_SESSION -> MINUTES_DRAFTED -> MINUTES_APPROVED -> FILED / CANCELLED" }

  - name: TaxPosition
    parent: CaptiveEntity
    common_fields: true
    fields:
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive" }
      - { name: tax_year, type: integer, source: input, description: "Tax year" }
      - { name: position_type, type: enum, source: input, description: "PREMIUM_DEDUCTIBILITY | RISK_DISTRIBUTION | MICRO_CAPTIVE_ELECTION | ARM_LENGTH_PRICING | EXCISE_TAX_EXEMPTION" }
      - { name: position_description, type: string, source: input, description: "Description of the tax position" }
      - { name: premium_deductibility_pct, type: number, source: computed, description: "Read-only percentage of premium deductible" }
      - { name: risk_distribution_test_result, type: enum, source: computed, description: "PASS | FAIL | MARGINAL — IRS risk distribution analysis" }
      - { name: insured_entities_count, type: integer, source: computed, description: "Read-only count of distinct insured operating units" }
      - { name: third_party_premium_pct, type: number, source: computed, description: "Read-only percentage of premium from third parties (for risk distribution)" }
      - { name: premium_threshold_met, type: boolean, source: computed, description: "Read-only whether micro-captive premium threshold is met" }
      - { name: reporting_position, type: enum, source: system, description: "MORE_LIKELY_THAN_NOT | SUBSTANTIAL_AUTHORITY | REASONABLE_BASIS | NO_POSITION" }
      - { name: disclosure_required, type: boolean, source: computed, description: "Read-only whether Form 8886 disclosure is required" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ANALYZED -> OPINION_ISSUED -> FILED / CHALLENGED" }

  - name: AuditLog
    parent: CaptiveEntity
    common_fields: false
    fields:
      - { name: captive_id, type: string, source: system, description: "FK -> CaptiveEntity.id; owning captive" }
      - { name: action_type, type: enum, source: system, description: "STATE_CHANGE | CALCULATION_RUN | FILING_SUBMITTED | CERTIFICATION | GOVERNANCE_ACTION | TAX_POSITION_CHANGE" }
      - { name: entity_type, type: string, source: system, description: "Type of entity affected" }
      - { name: entity_id, type: string, source: system, description: "ID of entity affected" }
      - { name: actor_role, type: string, source: system, description: "Role that performed the action" }
      - { name: actor_id, type: string, source: system, description: "ID of the acting user" }
      - { name: action_description, type: string, source: system, description: "Description of the action" }
      - { name: previous_state, type: string, source: system, description: "State before the action" }
      - { name: new_state, type: string, source: system, description: "State after the action" }
      - { name: timestamp, type: datetime, source: system, description: "Timestamp of the action" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CaptiveEntity
    initial_state: FORMATION_PENDING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMATION_PENDING
        to: DOMICILE_FILED
        trigger: "POST /captives/{captiveId}/domicile-filings/{filingId}/submit"
        actor: CaptiveManager
        preconditions:
          - "CaptiveEntity.status == FORMATION_PENDING (ERR_CAPTIVE_NOT_IN_FORMATION)"
          - "DomicileFiling.status == DRAFT (ERR_FILING_NOT_DRAFT)"
        side_effects:
          - "DomicileFiling.status -> SUBMITTED"
          - "DomicileFiling.filed_at = current_utc"
          - "DomicileFiling.review_deadline = filed_at + jurisdiction_review_days"
          - "Create AuditLog entry for filing submission"
          - "CaptiveEntity.updated_at refreshed, version incremented"

      - from: DOMICILE_FILED
        to: CAPITALIZED
        trigger: "POST /captives/{captiveId}/domicile-filings/{filingId}/approve"
        actor: DomicileRegulator
        preconditions:
          - "CaptiveEntity.status == DOMICILE_FILED (ERR_CAPTIVE_NOT_DOMICILE_FILED)"
          - "DomicileFiling.status == UNDER_REVIEW (ERR_FILING_NOT_UNDER_REVIEW)"
          - "CaptiveEntity.capitalization_amount >= capital_minimum_required (ERR_CAPITALIZATION_BELOW_MINIMUM)"
        side_effects:
          - "DomicileFiling.status -> APPROVED"
          - "DomicileFiling.regulator_reference = system-generated"
          - "Recompute CaptiveEntity.solvency_ratio"
          - "Recompute CaptiveEntity.solvency_status"
          - "Create AuditLog entry for approval"
          - "CaptiveEntity.updated_at refreshed, version incremented"

      - from: CAPITALIZED
        to: ACTIVE
        trigger: "POST /captives/{captiveId}/activate"
        actor: CaptiveManager
        preconditions:
          - "CaptiveEntity.status == CAPITALIZED (ERR_CAPTIVE_NOT_CAPITALIZED)"
          - "At least one InsuranceProgram exists with program_status == BOUND or later (ERR_NO_BOUND_PROGRAM)"
          - "CaptiveEntity.solvency_status != BREACH (ERR_SOLVENCY_BREACH)"
        side_effects:
          - "CaptiveEntity.status -> ACTIVE"
          - "Create AuditLog entry for activation"
          - "CaptiveEntity.updated_at refreshed, version incremented"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /captives/{captiveId}/suspend"
        actor: DomicileRegulator
        preconditions:
          - "CaptiveEntity.status == ACTIVE (ERR_CAPTIVE_NOT_ACTIVE)"
          - "CaptiveEntity.solvency_status == BREACH OR CaptiveEntity.governance_score < 40 (ERR_NO_SUSPENSION_GROUNDS)"
        side_effects:
          - "CaptiveEntity.status -> SUSPENDED"
          - "All IN_FORCE programs: program_status -> RUN_OFF (cascade down)"
          - "All ACTIVE FrontingArrangements: status -> TERMINATED (cascade down)"
          - "Create AuditLog entry for suspension"
          - "CaptiveEntity.updated_at refreshed, version incremented"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /captives/{captiveId}/reinstate"
        actor: DomicileRegulator
        preconditions:
          - "CaptiveEntity.status == SUSPENDED (ERR_CAPTIVE_NOT_SUSPENDED)"
          - "CaptiveEntity.solvency_status != BREACH (ERR_SOLVENCY_BREACH)"
          - "CaptiveEntity.governance_score >= 40 (ERR_GOVERNANCE_SCORE_TOO_LOW)"
        side_effects:
          - "CaptiveEntity.status -> ACTIVE"
          - "Create AuditLog entry for reinstatement"
          - "CaptiveEntity.updated_at refreshed, version incremented"

      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /captives/{captiveId}/dissolve"
        actor: CaptiveManager
        preconditions:
          - "CaptiveEntity.status == ACTIVE (ERR_CAPTIVE_NOT_ACTIVE)"
          - "No programs in IN_FORCE or BOUND status (ERR_ACTIVE_PROGRAMS_EXIST)"
          - "All claims in terminal states (ERR_OPEN_CLAIMS_EXIST)"
          - "All reserves filed (ERR_UNFILED_RESERVES_EXIST)"
        side_effects:
          - "CaptiveEntity.status -> DISSOLVED"
          - "All remaining programs -> CLOSED"
          - "All collateral postings -> RELEASED"
          - "Create AuditLog entry for dissolution"
          - "CaptiveEntity.updated_at refreshed, version incremented"

      - from: SUSPENDED
        to: DISSOLVED
        trigger: "POST /captives/{captiveId}/dissolve"
        actor: DomicileRegulator
        preconditions:
          - "CaptiveEntity.status == SUSPENDED"
          - "All claims in terminal states (ERR_OPEN_CLAIMS_EXIST)"
        side_effects:
          - "CaptiveEntity.status -> DISSOLVED"
          - "All remaining programs -> CLOSED"
          - "All collateral postings -> RELEASED"
          - "Create AuditLog entry for dissolution"

  - entity: DomicileFiling
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /captives/{captiveId}/domicile-filings/{filingId}/submit"
        actor: CaptiveManager
        preconditions:
          - "DomicileFiling.status == DRAFT (ERR_FILING_NOT_DRAFT)"
          - "At least one supporting document uploaded (ERR_NO_SUPPORTING_DOCUMENTS)"
        side_effects:
          - "DomicileFiling.filed_at = current_utc"
          - "DomicileFiling.review_deadline computed"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /captives/{captiveId}/domicile-filings/{filingId}/acknowledge"
        actor: DomicileRegulator
        preconditions:
          - "DomicileFiling.status == SUBMITTED (ERR_FILING_NOT_SUBMITTED)"
        side_effects:
          - "DomicileFiling.regulator_reference generated"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /captives/{captiveId}/domicile-filings/{filingId}/approve"
        actor: DomicileRegulator
        preconditions:
          - "DomicileFiling.status == UNDER_REVIEW (ERR_FILING_NOT_UNDER_REVIEW)"
        side_effects:
          - "If captive.status == DOMICILE_FILED: captive.status -> CAPITALIZED (bubble up)"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /captives/{captiveId}/domicile-filings/{filingId}/reject"
        actor: DomicileRegulator
        preconditions:
          - "DomicileFiling.status == UNDER_REVIEW (ERR_FILING_NOT_UNDER_REVIEW)"
        side_effects:
          - "DomicileFiling.rejection_reason = input reason"
          - "CaptiveEntity.governance_score -= 10"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /captives/{captiveId}/domicile-filings/{filingId}/withdraw"
        actor: CaptiveManager
        preconditions:
          - "DomicileFiling.status in {DRAFT, SUBMITTED} (ERR_FILING_NOT_WITHDRAWABLE)"
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /captives/{captiveId}/domicile-filings/{filingId}/withdraw"
        actor: CaptiveManager
        preconditions:
          - "DomicileFiling.status in {DRAFT, SUBMITTED}"
        side_effects:
          - "CaptiveEntity.governance_score -= 5"

  - entity: InsuranceProgram
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /captives/{captiveId}/programs/{programId}/quote"
        actor: Underwriter
        preconditions:
          - "InsuranceProgram.program_status == DRAFT (ERR_PROGRAM_NOT_DRAFT)"
          - "CaptiveEntity.status in {CAPITALIZED, ACTIVE} (ERR_CAPTIVE_NOT_OPERATIONAL)"
        side_effects:
          - "Recompute premium allocation estimates"
          - "InsuranceProgram.coverage_status -> UNBOUND"

      - from: QUOTED
        to: BOUND
        trigger: "POST /captives/{captiveId}/programs/{programId}/bind"
        actor: Underwriter
        preconditions:
          - "InsuranceProgram.program_status == QUOTED (ERR_PROGRAM_NOT_QUOTED)"
          - "If fronting_required: FrontingArrangement.status == COLLATERAL_POSTED or later (ERR_FRONTING_NOT_READY)"
        side_effects:
          - "InsuranceProgram.coverage_status -> BOUND"
          - "If fronting_required: FrontingArrangement.status -> ACTIVE (cross-entity)"

      - from: BOUND
        to: IN_FORCE
        trigger: "POST /captives/{captiveId}/programs/{programId}/activate"
        actor: Underwriter
        preconditions:
          - "InsuranceProgram.program_status == BOUND (ERR_PROGRAM_NOT_BOUND)"
          - "CaptiveEntity.status == ACTIVE (ERR_CAPTIVE_NOT_ACTIVE)"
          - "current_utc >= policy_period_start (ERR_POLICY_PERIOD_NOT_STARTED)"
        side_effects:
          - "CaptiveEntity.total_premium_written updated (ledger sync)"
          - "InsuranceProgram.coverage_status stays BOUND"

      - from: IN_FORCE
        to: RUN_OFF
        trigger: "POST /captives/{captiveId}/programs/{programId}/enter-runoff"
        actor: Underwriter
        preconditions:
          - "InsuranceProgram.program_status == IN_FORCE (ERR_PROGRAM_NOT_IN_FORCE)"
        side_effects:
          - "InsuranceProgram.coverage_status -> EXPIRED"
          - "No new premium allocations accepted"

      - from: RUN_OFF
        to: CLOSED
        trigger: "POST /captives/{captiveId}/programs/{programId}/close"
        actor: Underwriter
        preconditions:
          - "InsuranceProgram.program_status == RUN_OFF (ERR_PROGRAM_NOT_IN_RUNOFF)"
          - "All claims in terminal states (ERR_OPEN_CLAIMS_EXIST)"
          - "All reserves certified and filed (ERR_UNFILED_RESERVES_EXIST)"
        side_effects:
          - "Final premium allocation reconciliation"
          - "CaptiveEntity.admitted_assets recomputed"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /captives/{captiveId}/programs/{programId}/cancel"
        actor: Underwriter
        preconditions:
          - "InsuranceProgram.program_status in {DRAFT, QUOTED} (ERR_PROGRAM_NOT_CANCELLABLE)"
        side_effects:
          - "All provisional premium allocations -> CANCELLED"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /captives/{captiveId}/programs/{programId}/cancel"
        actor: Underwriter
        preconditions:
          - "InsuranceProgram.program_status in {DRAFT, QUOTED}"
        side_effects:
          - "All provisional premium allocations -> CANCELLED"

  - entity: FrontingArrangement
    initial_state: NEGOTIATING
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: NEGOTIATING
        to: TERMS_AGREED
        trigger: "POST /captives/{captiveId}/programs/{programId}/fronting/{frontingId}/agree-terms"
        actor: Underwriter
        preconditions:
          - "FrontingArrangement.status == NEGOTIATING (ERR_FRONTING_NOT_NEGOTIATING)"
        side_effects:
          - "Compute collateral_required_cents"

      - from: TERMS_AGREED
        to: COLLATERAL_POSTED
        trigger: "POST /captives/{captiveId}/programs/{programId}/fronting/{frontingId}/post-collateral"
        actor: CaptiveManager
        preconditions:
          - "FrontingArrangement.status == TERMS_AGREED (ERR_FRONTING_NOT_TERMS_AGREED)"
          - "collateral_posted_cents >= collateral_required_cents (ERR_INSUFFICIENT_COLLATERAL)"
        side_effects:
          - "FrontingArrangement.collateral_shortfall_cents recomputed"
          - "CaptiveEntity.admitted_assets updated (ledger sync)"

      - from: COLLATERAL_POSTED
        to: ACTIVE
        trigger: "POST /captives/{captiveId}/programs/{programId}/fronting/{frontingId}/activate"
        actor: Underwriter
        preconditions:
          - "FrontingArrangement.status == COLLATERAL_POSTED (ERR_FRONTING_NOT_COLLATERAL_POSTED)"
          - "InsuranceProgram.program_status == BOUND (ERR_PROGRAM_NOT_BOUND)"
        side_effects:
          - "Fronting fee calculation triggered"
          - "CaptiveEntity.total_reserves_held updated"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when policy_period_end reached)"
        actor: system
        preconditions:
          - "current_utc > program.policy_period_end"
        side_effects:
          - "All VERIFIED CollateralPostings -> RELEASED"
          - "CaptiveEntity.admitted_assets reduced"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /captives/{captiveId}/programs/{programId}/fronting/{frontingId}/terminate"
        actor: Underwriter
        preconditions:
          - "FrontingArrangement.status == ACTIVE (ERR_FRONTING_NOT_ACTIVE)"
        side_effects:
          - "All VERIFIED CollateralPostings -> RELEASED"
          - "CaptiveEntity.admitted_assets reduced"
          - "Program reverts to BOUND if not yet IN_FORCE"

  - entity: Claim
    initial_state: REPORTED
    terminal_states: [SETTLED, DENIED, CLOSED_WITHOUT_PAYMENT]
    transitions:
      - from: REPORTED
        to: ACKNOWLEDGED
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/acknowledge"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.claim_status == REPORTED (ERR_CLAIM_NOT_REPORTED)"
          - "Claim.coverage_confirmed == true (ERR_COVERAGE_NOT_CONFIRMED)"
        side_effects:
          - "Create TPAAssignment if tpa_assigned_id provided"
          - "InsuranceProgram.claims_incurred_cents updated"

      - from: ACKNOWLEDGED
        to: UNDER_INVESTIGATION
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/investigate"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.claim_status == ACKNOWLEDGED (ERR_CLAIM_NOT_ACKNOWLEDGED)"
        side_effects:
          - "Claim.reserved_amount_cents computed (initial reserve)"

      - from: UNDER_INVESTIGATION
        to: RESERVED
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/set-reserve"
        actor: Actuary
        preconditions:
          - "Claim.claim_status == UNDER_INVESTIGATION (ERR_CLAIM_NOT_UNDER_INVESTIGATION)"
        side_effects:
          - "Claim.reserved_amount_cents = input reserve_amount_cents"
          - "CaptiveEntity.total_reserves_held updated (ledger sync)"
          - "InsuranceProgram.claims_incurred_cents updated"

      - from: RESERVED
        to: SETTLED
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.claim_status == RESERVED (ERR_CLAIM_NOT_RESERVED)"
          - "settlement_amount_cents <= per_occurrence_limit_cents (ERR_SETTLEMENT_EXCEEDS_LIMIT)"
          - "settlement_amount_cents <= TPAAssignment.authority_limit_cents if TPA assigned (ERR_SETTLEMENT_EXCEEDS_TPA_AUTHORITY)"
        side_effects:
          - "Claim.paid_amount_cents = settlement_amount_cents"
          - "Claim.payment_status -> FULLY_PAID (if settlement >= reserved) or PARTIALLY_PAID"
          - "Claim.reserved_amount_cents = 0"
          - "CaptiveEntity.admitted_assets reduced by settlement"
          - "InsuranceProgram.claims_paid_cents updated"
          - "CaptiveEntity.total_reserves_held reduced"

      - from: RESERVED
        to: DENIED
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.claim_status == RESERVED (ERR_CLAIM_NOT_RESERVED)"
        side_effects:
          - "Claim.reserved_amount_cents = 0"
          - "CaptiveEntity.total_reserves_held reduced"
          - "InsuranceProgram.claims_incurred_cents reduced"

      - from: RESERVED
        to: CLOSED_WITHOUT_PAYMENT
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/close-without-payment"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.claim_status == RESERVED (ERR_CLAIM_NOT_RESERVED)"
          - "Claim.paid_amount_cents == 0 (ERR_CLAIM_HAS_PAYMENTS)"
        side_effects:
          - "Claim.reserved_amount_cents = 0"
          - "CaptiveEntity.total_reserves_held reduced"
          - "InsuranceProgram.claims_incurred_cents reduced"

  - entity: ActuarialReserve
    initial_state: PRELIMINARY
    terminal_states: [FILED, SUPERSEDED]
    transitions:
      - from: PRELIMINARY
        to: REVIEWED
        trigger: "POST /captives/{captiveId}/programs/{programId}/reserves/{reserveId}/review"
        actor: Actuary
        preconditions:
          - "ActuarialReserve.status == PRELIMINARY (ERR_RESERVE_NOT_PRELIMINARY)"
        side_effects:
          - "Recompute central_estimate_cents, low_estimate_cents, high_estimate_cents"

      - from: REVIEWED
        to: CERTIFIED
        trigger: "POST /captives/{captiveId}/programs/{programId}/reserves/{reserveId}/certify"
        actor: Actuary
        preconditions:
          - "ActuarialReserve.status == REVIEWED (ERR_RESERVE_NOT_REVIEWED)"
          - "carried_reserve_cents >= low_estimate_cents AND <= high_estimate_cents (ERR_RESERVE_OUT_OF_RANGE)"
          - "Actuary certifying is different from Actuary who created (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ActuarialReserve.certified_by = acting actuary user_id"
          - "ActuarialReserve.certification_date = current_utc"
          - "CaptiveEntity.total_reserves_held updated"

      - from: CERTIFIED
        to: FILED
        trigger: "POST /captives/{captiveId}/programs/{programId}/reserves/{reserveId}/file"
        actor: CaptiveManager
        preconditions:
          - "ActuarialReserve.status == CERTIFIED (ERR_RESERVE_NOT_CERTIFIED)"
        side_effects:
          - "AnnualStatement.total_liabilities_cents updated if same year"

      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /captives/{captiveId}/programs/{programId}/reserves (new reserve for same type + valuation_date)"
        actor: Actuary
        preconditions:
          - "New reserve created for same program + reserve_type with later valuation_date"
        side_effects:
          - "Old reserve marked SUPERSEDED"
          - "CaptiveEntity.total_reserves_held recomputed with new values"

  - entity: AnnualStatement
    initial_state: DRAFT
    terminal_states: [FILED, AMENDED]
    transitions:
      - from: DRAFT
        to: ACTUARIAL_REVIEW
        trigger: "POST /captives/{captiveId}/annual-statements/{statementId}/submit-for-review"
        actor: CaptiveManager
        preconditions:
          - "AnnualStatement.status == DRAFT (ERR_STATEMENT_NOT_DRAFT)"
        side_effects:
          - "Recompute all computed fields"

      - from: ACTUARIAL_REVIEW
        to: BOARD_APPROVED
        trigger: "POST /captives/{captiveId}/annual-statements/{statementId}/board-approve"
        actor: BoardDirector
        preconditions:
          - "AnnualStatement.status == ACTUARIAL_REVIEW (ERR_STATEMENT_NOT_UNDER_REVIEW)"
          - "All ActuarialReserves for the year are CERTIFIED or FILED (ERR_UNCERTIFIED_RESERVES)"
          - "A BoardMeeting with status == MINUTES_APPROVED exists for the approval (ERR_NO_BOARD_APPROVAL_MEETING)"
        side_effects:
          - "CaptiveEntity.governance_score += 5 (capped at 100)"

      - from: BOARD_APPROVED
        to: FILED
        trigger: "POST /captives/{captiveId}/annual-statements/{statementId}/file"
        actor: CaptiveManager
        preconditions:
          - "AnnualStatement.status == BOARD_APPROVED (ERR_STATEMENT_NOT_BOARD_APPROVED)"
          - "current_utc <= filing_deadline (ERR_FILING_DEADLINE_PASSED)"
        side_effects:
          - "Create AuditLog entry for filing"

      - from: FILED
        to: AMENDED
        trigger: "POST /captives/{captiveId}/annual-statements/{statementId}/amend"
        actor: CaptiveManager
        preconditions:
          - "AnnualStatement.status == FILED (ERR_STATEMENT_NOT_FILED)"
        side_effects:
          - "New AnnualStatement created in DRAFT for same year"
          - "CaptiveEntity.governance_score -= 5"

  - entity: TPAAssignment
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/tpa/{tpaId}/suspend"
        actor: CaptiveManager
        preconditions:
          - "TPAAssignment.status == ACTIVE (ERR_TPA_NOT_ACTIVE)"
          - "TPAAssignment.performance_score < 60 OR TPAAssignment.sla_compliance_pct < 80 (ERR_NO_SUSPENSION_GROUNDS)"
        side_effects:
          - "Claim flagged for TPA reassignment review"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/tpa/{tpaId}/reinstate"
        actor: CaptiveManager
        preconditions:
          - "TPAAssignment.status == SUSPENDED (ERR_TPA_NOT_SUSPENDED)"
        side_effects: []

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/tpa/{tpaId}/terminate"
        actor: CaptiveManager
        preconditions:
          - "TPAAssignment.status in {ACTIVE, SUSPENDED} (ERR_TPA_NOT_TERMINABLE)"
        side_effects:
          - "Claim.tpa_assigned_id = null"
          - "Claim remains in current state, requires new TPA assignment"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/tpa/{tpaId}/terminate"
        actor: CaptiveManager
        preconditions:
          - "TPAAssignment.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "Claim.tpa_assigned_id = null"

  - entity: PremiumAllocation
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: PROVISIONAL
        to: AUDITED
        trigger: "POST /captives/{captiveId}/programs/{programId}/allocations/{allocId}/audit"
        actor: Actuary
        preconditions:
          - "PremiumAllocation.status == PROVISIONAL (ERR_ALLOCATION_NOT_PROVISIONAL)"
        side_effects:
          - "Recompute allocated_amount_cents using final method"

      - from: AUDITED
        to: FINALIZED
        trigger: "POST /captives/{captiveId}/programs/{programId}/allocations/{allocId}/finalize"
        actor: Actuary
        preconditions:
          - "PremiumAllocation.status == AUDITED (ERR_ALLOCATION_NOT_AUDITED)"
          - "final_amount_cents computed and validated (ERR_ALLOCATION_NOT_COMPUTED)"
        side_effects:
          - "PremiumAllocation.adjustment_cents = final_amount_cents - provisional_amount_cents"
          - "OperatingUnit.total_premium_allocated_cents updated by adjustment"
          - "InsuranceProgram.premium_allocated_cents updated by adjustment"
          - "CaptiveEntity.total_premium_written updated by adjustment"

      - from: PROVISIONAL
        to: DISPUTED
        trigger: "POST /captives/{captiveId}/programs/{programId}/allocations/{allocId}/dispute"
        actor: CaptiveManager
        preconditions:
          - "PremiumAllocation.status == PROVISIONAL (ERR_ALLOCATION_NOT_PROVISIONAL)"
        side_effects:
          - "CaptiveEntity.governance_score -= 3"

      - from: DISPUTED
        to: PROVISIONAL
        trigger: "POST /captives/{captiveId}/programs/{programId}/allocations/{allocId}/resolve-dispute"
        actor: CaptiveManager
        preconditions:
          - "PremiumAllocation.status == DISPUTED (ERR_ALLOCATION_NOT_DISPUTED)"
        side_effects:
          - "CaptiveEntity.governance_score += 3 (capped at 100)"

      - from: PROVISIONAL
        to: CANCELLED
        trigger: "POST /captives/{captiveId}/programs/{programId}/allocations/{allocId}/cancel"
        actor: Underwriter
        preconditions:
          - "PremiumAllocation.status in {PROVISIONAL, DISPUTED} (ERR_ALLOCATION_NOT_CANCELLABLE)"
        side_effects:
          - "InsuranceProgram.premium_allocated_cents reduced"

      - from: DISPUTED
        to: CANCELLED
        trigger: "POST /captives/{captiveId}/programs/{programId}/allocations/{allocId}/cancel"
        actor: Underwriter
        preconditions:
          - "PremiumAllocation.status in {PROVISIONAL, DISPUTED}"
        side_effects:
          - "InsuranceProgram.premium_allocated_cents reduced"

  - entity: BoardMeeting
    initial_state: SCHEDULED
    terminal_states: [FILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /captives/{captiveId}/board-meetings/{meetingId}/convene"
        actor: BoardDirector
        preconditions:
          - "BoardMeeting.status == SCHEDULED (ERR_MEETING_NOT_SCHEDULED)"
          - "BoardMeeting.quorum_met == true (ERR_QUORUM_NOT_MET)"
        side_effects: []

      - from: IN_SESSION
        to: MINUTES_DRAFTED
        trigger: "POST /captives/{captiveId}/board-meetings/{meetingId}/draft-minutes"
        actor: BoardDirector
        preconditions:
          - "BoardMeeting.status == IN_SESSION (ERR_MEETING_NOT_IN_SESSION)"
        side_effects:
          - "BoardMeeting.resolutions_passed populated from agenda"

      - from: MINUTES_DRAFTED
        to: MINUTES_APPROVED
        trigger: "POST /captives/{captiveId}/board-meetings/{meetingId}/approve-minutes"
        actor: BoardDirector
        preconditions:
          - "BoardMeeting.status == MINUTES_DRAFTED (ERR_MINUTES_NOT_DRAFTED)"
          - "Approving director is different from drafting director (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If meeting_type == ANNUAL: annual_meeting_completed = true"

      - from: MINUTES_APPROVED
        to: FILED
        trigger: "POST /captives/{captiveId}/board-meetings/{meetingId}/file"
        actor: CaptiveManager
        preconditions:
          - "BoardMeeting.status == MINUTES_APPROVED (ERR_MINUTES_NOT_APPROVED)"
        side_effects:
          - "Create AuditLog entry"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /captives/{captiveId}/board-meetings/{meetingId}/cancel"
        actor: BoardDirector
        preconditions:
          - "BoardMeeting.status == SCHEDULED (ERR_MEETING_NOT_SCHEDULED)"
        side_effects: []

  - entity: TaxPosition
    initial_state: DRAFT
    terminal_states: [FILED, CHALLENGED]
    transitions:
      - from: DRAFT
        to: ANALYZED
        trigger: "POST /captives/{captiveId}/tax-positions/{positionId}/analyze"
        actor: TaxAdvisor
        preconditions:
          - "TaxPosition.status == DRAFT (ERR_TAX_POSITION_NOT_DRAFT)"
        side_effects:
          - "Compute risk_distribution_test_result"
          - "Compute premium_deductibility_pct"
          - "Compute insured_entities_count"
          - "Compute third_party_premium_pct"
          - "Compute premium_threshold_met"
          - "Compute disclosure_required"

      - from: ANALYZED
        to: OPINION_ISSUED
        trigger: "POST /captives/{captiveId}/tax-positions/{positionId}/issue-opinion"
        actor: TaxAdvisor
        preconditions:
          - "TaxPosition.status == ANALYZED (ERR_TAX_POSITION_NOT_ANALYZED)"
          - "reporting_position set to valid value (ERR_NO_REPORTING_POSITION)"
        side_effects:
          - "CaptiveEntity.risk_distribution_score updated"

      - from: OPINION_ISSUED
        to: FILED
        trigger: "POST /captives/{captiveId}/tax-positions/{positionId}/file"
        actor: CaptiveManager
        preconditions:
          - "TaxPosition.status == OPINION_ISSUED (ERR_TAX_POSITION_NOT_OPINION_ISSUED)"
        side_effects:
          - "Create AuditLog entry"

      - from: FILED
        to: CHALLENGED
        trigger: "POST /captives/{captiveId}/tax-positions/{positionId}/challenge"
        actor: TaxAdvisor
        preconditions:
          - "TaxPosition.status == FILED (ERR_TAX_POSITION_NOT_FILED)"
        side_effects:
          - "CaptiveEntity.governance_score -= 15"
          - "New TaxPosition created in DRAFT for same tax_year + position_type"


# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: program-update-stale-captive
    parent_entity: CaptiveEntity
    write_endpoint: "POST /captives/{captiveId}/programs"
    occ_field: "expected_captive_version"
    description: |
      Creating an InsuranceProgram against a CaptiveEntity whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just modified the captive (e.g., solvency
      recalculation) and the current writer's view of the captive is therefore
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-settle-stale-captive
    parent_entity: CaptiveEntity
    write_endpoint: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/settle"
    occ_field: "expected_captive_version"
    description: |
      Settling a Claim against a CaptiveEntity whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just modified the captive (e.g., another claim settlement
      changed admitted_assets) and the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: solvency_ratio_calculation
    trigger: "On any change to admitted_assets or required_capital (claim settlement, collateral posting/release, premium allocation, reserve certification)"
    algorithm: threshold
    formula: |
      1. admitted_assets = sum(all VERIFIED CollateralPosting.effective_value_cents)
                         + sum(all PremiumAllocation.allocated_amount_cents where status IN {PROVISIONAL, AUDITED, FINALIZED})
                         - sum(all Claim.paid_amount_cents where claim_status == SETTLED)
      2. required_capital = capital_minimum_required (from domicile schedule)
      3. solvency_ratio = (admitted_assets / required_capital) * 100
      4. If solvency_ratio >= SOLVENCY_WARNING_THRESHOLD: solvency_status = ADEQUATE
         If solvency_ratio >= SOLVENCY_BREACH_THRESHOLD and < SOLVENCY_WARNING_THRESHOLD: solvency_status = WARNING
         If solvency_ratio < SOLVENCY_BREACH_THRESHOLD: solvency_status = BREACH
    input_set: "All CollateralPostings with verification_status == VERIFIED, all PremiumAllocations with status IN {PROVISIONAL, AUDITED, FINALIZED}, all Claims with claim_status == SETTLED"
    constants:
      SOLVENCY_WARNING_THRESHOLD: 150
      SOLVENCY_BREACH_THRESHOLD: 100
    precision: "2 decimal places, round_half_up"
    variants:
      - name: conservative
        when: "CaptiveEntity.tax_classification == MICRO_CAPTIVE_831B"
        difference: "Uses haircuts at 1.5x standard rate for non-cash collateral (letter of credit haircut 10% instead of 5%)"
      - name: standard
        when: "All other tax classifications"
        difference: "Standard haircut rates per collateral type"

  - name: premium_allocation_calculation
    trigger: "On PremiumAllocation creation and audit"
    algorithm: weighted_scoring
    formula: |
      For EXPOSURE_PRO_RATA:
        unit_share = operating_unit.exposure_amount / sum(all active units' exposure_amount)
        allocated_amount = program.premium_budget_cents * unit_share
      For EQUAL_SHARE:
        allocated_amount = program.premium_budget_cents / count(active units)
      For MANUAL:
        allocated_amount = input amount (validated against budget)
      For RISK_WEIGHTED:
        weighted_exposure = operating_unit.exposure_amount * allocation.risk_weight
        total_weighted = sum(all units' weighted_exposure)
        allocated_amount = program.premium_budget_cents * (weighted_exposure / total_weighted)
      Rounding: round to nearest cent, round_half_up
    input_set: "All OperatingUnits with status == ACTIVE under the captive"
    constants:
      MAX_ALLOCATION_PCT: 0.50
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: provisional
        when: "PremiumAllocation.status == PROVISIONAL (initial allocation)"
        difference: "Uses estimated exposure amounts; rounding up to nearest 100 cents for conservatism"
      - name: final
        when: "PremiumAllocation.status == AUDITED (post-audit finalization)"
        difference: "Uses audited actual exposure amounts; exact cent rounding"

  - name: loss_ratio_calculation
    trigger: "On claim status change and premium allocation update"
    algorithm: aggregation
    formula: |
      loss_ratio = (claims_incurred_cents / premium_allocated_cents) * 100
      where claims_incurred_cents = sum of net_incurred_cents for all claims
      with claim_status IN {RESERVED, SETTLED, DENIED, CLOSED_WITHOUT_PAYMENT}
      If premium_allocated_cents == 0: loss_ratio = 0
    input_set: "All Claims under the program with claim_status != REPORTED or ACKNOWLEDGED"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ultimate
        when: "Actuarial analysis context (used in reserve calculations)"
        difference: "Includes IBNR estimate: ultimate_loss_ratio = (claims_incurred + IBNR_estimate) / premium_allocated * 100"
      - name: reported
        when: "Operational dashboard context"
        difference: "Uses only reported claims (excludes IBNR)"

  - name: actuarial_reserve_estimation
    trigger: "On ActuarialReserve creation and review"
    algorithm: tiered_pricing
    formula: |
      For CHAIN_LADDER:
        development_factor = product of age-to-age factors for the line of business
        central_estimate = cumulative_paid_losses * (development_factor - 1)
      For BORNHUETTER_FERGUSON:
        central_estimate = expected_loss_ratio * premium_allocated * (1 - 1/development_factor)
      For EXPECTED_LOSS_RATIO:
        central_estimate = expected_loss_ratio * premium_allocated - paid_losses
      For BERQUIST_SHERMAN:
        central_estimate = chain_ladder_result adjusted for case adequacy changes
      low_estimate = central_estimate * (1 - margin_pct)
      high_estimate = central_estimate * (1 + margin_pct)
      carried_reserve = central_estimate adjusted to confidence_level_pct between low and high
    input_set: "All Claims for the program, all prior ActuarialReserves, premium_allocated_cents"
    constants:
      DEFAULT_MARGIN_PCT: 0.20
      MIN_RESERVE_FLOOR: 10000
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: gross
        when: "Reserve before reinsurance recovery"
        difference: "Computes reserves gross of reinsurance; no reduction for expected recoveries"
      - name: net
        when: "Reserve net of reinsurance"
        difference: "Reduces reserves by expected reinsurance recoveries: net_reserve = gross_reserve * (1 - reinsurance_ceded_pct)"

  - name: risk_distribution_analysis
    trigger: "On TaxPosition analysis"
    algorithm: weighted_scoring
    formula: |
      insured_entities_count = count(distinct operating_unit_id across all programs with status IN_FORCE or RUN_OFF)
      If insured_entities_count >= MIN_INSURED_ENTITIES:
        entity_score = 40
      elif insured_entities_count >= MIN_INSURED_ENTITIES / 2:
        entity_score = 20
      else:
        entity_score = 0

      third_party_premium_pct = (third_party_premium_cents / total_premium_written_cents) * 100
      If third_party_premium_pct >= MIN_THIRD_PARTY_PCT:
        third_party_score = 30
      elif third_party_premium_pct >= MIN_THIRD_PARTY_PCT / 2:
        third_party_score = 15
      else:
        third_party_score = 0

      premium_concentration = max(single_unit_premium) / total_premium * 100
      If premium_concentration <= MAX_CONCENTRATION_PCT:
        concentration_score = 30
      elif premium_concentration <= MAX_CONCENTRATION_PCT * 1.5:
        concentration_score = 15
      else:
        concentration_score = 0

      risk_distribution_score = entity_score + third_party_score + concentration_score
      If risk_distribution_score >= 70: risk_distribution_test_result = PASS
      If risk_distribution_score >= 40 and < 70: risk_distribution_test_result = MARGINAL
      If risk_distribution_score < 40: risk_distribution_test_result = FAIL
    input_set: "All OperatingUnits, PremiumAllocations, and Claims for the tax year"
    constants:
      MIN_INSURED_ENTITIES: 12
      MIN_THIRD_PARTY_PCT: 30
      MAX_CONCENTRATION_PCT: 50
      MICRO_CAPTIVE_PREMIUM_LIMIT: 265000000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: irs_safe_harbor
        when: "Testing against IRS safe harbor thresholds (Rev. Rul. 2002-89/90/91)"
        difference: "Uses 50% third-party threshold and 12-entity minimum; binary pass/fail"
      - name: economic_substance
        when: "Testing against economic substance doctrine"
        difference: "Applies sliding scale instead of binary thresholds; considers claims paying history as additional factor"

  - name: collateral_valuation
    trigger: "On CollateralPosting creation and verification"
    algorithm: threshold
    formula: |
      haircut_pct by collateral_type:
        LETTER_OF_CREDIT: 0.05
        TRUST_ACCOUNT: 0.02
        SURETY_BOND: 0.10
        CASH_ESCROW: 0.00
        INVESTMENT_SECURITIES: 0.15
      effective_value_cents = amount_cents * (1 - haircut_pct)
      Round to integer cents, round_half_up
    input_set: "Single CollateralPosting being created/verified"
    constants:
      LOC_HAIRCUT: 0.05
      TRUST_HAIRCUT: 0.02
      SURETY_HAIRCUT: 0.10
      CASH_HAIRCUT: 0.00
      SECURITIES_HAIRCUT: 0.15
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: standard
        when: "Standard tax classification"
        difference: "Haircut rates as listed"
      - name: conservative
        when: "MICRO_CAPTIVE_831B tax classification"
        difference: "Haircut rates multiplied by 1.5 (LOC: 7.5%, Trust: 3%, Surety: 15%, Cash: 0%, Securities: 22.5%)"

  - name: fronting_fee_calculation
    trigger: "On FrontingArrangement activation and premium allocation change"
    algorithm: aggregation
    formula: |
      fronting_fee_amount_cents = program.premium_allocated_cents * fronting_fee_pct
      Round to integer cents, round_half_up
    input_set: "FrontingArrangement and its parent InsuranceProgram"
    constants: {}
    precision: "0 decimal places (integer cents), round_half_up"
    variants: []

  - name: rbc_ratio_calculation
    trigger: "On AnnualStatement computation"
    algorithm: threshold
    formula: |
      rbc_ratio = (policyholder_surplus_cents / authorized_control_level_capital) * 100
      If rbc_ratio >= 200: rbc_action_level = NONE
      If rbc_ratio >= 150 and < 200: rbc_action_level = COMPANY_ACTION
      If rbc_ratio >= 100 and < 150: rbc_action_level = REGULATORY_ACTION
      If rbc_ratio >= 70 and < 100: rbc_action_level = AUTHORIZED_CONTROL
      If rbc_ratio < 70: rbc_action_level = MANDATORY_CONTROL
    input_set: "AnnualStatement computed fields"
    constants:
      ACL_BASE: 50000000
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "CaptiveEntity must be in correct state for the requested operation"
    error_id: "ERR_CAPTIVE_NOT_IN_FORMATION | ERR_CAPTIVE_NOT_DOMICILE_FILED | ERR_CAPTIVE_NOT_CAPITALIZED | ERR_CAPTIVE_NOT_ACTIVE | ERR_CAPTIVE_NOT_SUSPENDED"
    http_status: 409
    applies_to: "All captive-level state transition endpoints"

  - priority: 5
    category: state
    check: "Target resource must be in correct state for operation"
    error_id: "varies (ERR_PROGRAM_NOT_DRAFT, ERR_CLAIM_NOT_REPORTED, etc.)"
    http_status: 409
    applies_to: "State transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: same user cannot perform creation and certification/approval of the same resource"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /captives/{captiveId}/programs/{programId}/reserves/{reserveId}/certify, POST /captives/{captiveId}/board-meetings/{meetingId}/approve-minutes"

  - priority: 7
    category: business_safety
    check: "Solvency breach prevents new program activation"
    error_id: ERR_SOLVENCY_BREACH
    http_status: 403
    applies_to: "POST /captives/{captiveId}/activate, POST /captives/{captiveId}/programs/{programId}/activate"

  - priority: 8
    category: business_constraint
    check: "Capitalization must meet domicile minimum requirement"
    error_id: ERR_CAPITALIZATION_BELOW_MINIMUM
    http_status: 400
    applies_to: "POST /captives/{captiveId}/domicile-filings/{filingId}/approve"

  - priority: 9
    category: business_constraint
    check: "Collateral posted must meet or exceed collateral required by fronting carrier"
    error_id: ERR_INSUFFICIENT_COLLATERAL
    http_status: 400
    applies_to: "POST /captives/{captiveId}/programs/{programId}/fronting/{frontingId}/post-collateral"

  - priority: 10
    category: business_constraint
    check: "Premium allocation total must not exceed program premium budget"
    error_id: ERR_ALLOCATION_EXCEEDS_BUDGET
    http_status: 400
    applies_to: "POST /captives/{captiveId}/programs/{programId}/allocations"

  - priority: 11
    category: business_constraint
    check: "Settlement amount must not exceed per-occurrence limit"
    error_id: ERR_SETTLEMENT_EXCEEDS_LIMIT
    http_status: 400
    applies_to: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/settle"

  - priority: 12
    category: business_constraint
    check: "Settlement amount must not exceed TPA authority limit if TPA assigned"
    error_id: ERR_SETTLEMENT_EXCEEDS_TPA_AUTHORITY
    http_status: 400
    applies_to: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/settle"

  - priority: 13
    category: business_referential
    check: "Operating unit must exist and belong to the same captive"
    error_id: ERR_OPERATING_UNIT_MISMATCH
    http_status: 400
    applies_to: "POST /captives/{captiveId}/programs/{programId}/allocations, POST /captives/{captiveId}/programs/{programId}/claims"

  - priority: 14
    category: business_temporal
    check: "Policy period must be valid (end > start, no overlap with existing programs for same line of business)"
    error_id: ERR_POLICY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /captives/{captiveId}/programs"

  - priority: 15
    category: business_temporal
    check: "Loss date must fall within policy period"
    error_id: ERR_LOSS_DATE_OUT_OF_PERIOD
    http_status: 400
    applies_to: "POST /captives/{captiveId}/programs/{programId}/claims"

  - priority: 16
    category: business_temporal
    check: "Annual statement filing deadline must not be passed"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 400
    applies_to: "POST /captives/{captiveId}/annual-statements/{statementId}/file"

  - priority: 17
    category: business_fiscal
    check: "Reserve carried amount must be within actuarial range (low to high)"
    error_id: ERR_RESERVE_OUT_OF_RANGE
    http_status: 400
    applies_to: "POST /captives/{captiveId}/programs/{programId}/reserves/{reserveId}/certify"

  - priority: 18
    category: business_fiscal
    check: "Micro-captive premium threshold must not be exceeded for 831(b) election"
    error_id: ERR_PREMIUM_THRESHOLD_EXCEEDED
    http_status: 400
    applies_to: "POST /captives/{captiveId}/tax-positions/{positionId}/analyze"

  - priority: 19
    category: business_constraint
    check: "Quorum must be met for board meeting to convene"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 400
    applies_to: "POST /captives/{captiveId}/board-meetings/{meetingId}/convene"

  - priority: 20
    category: business_referential
    check: "Claim must have confirmed coverage (loss within policy period and limits)"
    error_id: ERR_COVERAGE_NOT_CONFIRMED
    http_status: 400
    applies_to: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/acknowledge"

  - priority: 21
    category: business_constraint
    check: "At least one bound program must exist for captive activation"
    error_id: ERR_NO_BOUND_PROGRAM
    http_status: 409
    applies_to: "POST /captives/{captiveId}/activate"

  - priority: 22
    category: business_constraint
    check: "No open claims allowed for program closure or captive dissolution"
    error_id: ERR_OPEN_CLAIMS_EXIST
    http_status: 409
    applies_to: "POST /captives/{captiveId}/programs/{programId}/close, POST /captives/{captiveId}/dissolve"

  - priority: 23
    category: business_constraint
    check: "All reserves must be certified/filed for program closure or captive dissolution"
    error_id: ERR_UNFILED_RESERVES_EXIST
    http_status: 409
    applies_to: "POST /captives/{captiveId}/programs/{programId}/close, POST /captives/{captiveId}/dissolve"

  - priority: 24
    category: business_constraint
    check: "Supporting documents required for filing submission"
    error_id: ERR_NO_SUPPORTING_DOCUMENTS
    http_status: 400
    applies_to: "POST /captives/{captiveId}/domicile-filings/{filingId}/submit"

  - priority: 25
    category: business_constraint
    check: "TPA suspension requires performance grounds"
    error_id: ERR_NO_SUSPENSION_GROUNDS
    http_status: 400
    applies_to: "POST /captives/{captiveId}/programs/{programId}/claims/{claimId}/tpa/{tpaId}/suspend"

  - priority: 26
    category: business_constraint
    check: "Board approval meeting must exist for annual statement"
    error_id: ERR_NO_BOARD_APPROVAL_MEETING
    http_status: 400
    applies_to: "POST /captives/{captiveId}/annual-statements/{statementId}/board-approve"


# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- CaptiveEntity ---
  - method: POST
    path: "/api/captives"
    description: "Create a new Captive Entity"
    roles: [CaptiveManager]
    code: 201
    input: [captive_name, domicile_jurisdiction, formation_date, capitalization_amount, "tax_classification?"]
    output: CaptiveEntity
    side_effects:
      - "status = FORMATION_PENDING"
      - "solvency_status = ADEQUATE (initial)"
      - "governance_score = 100"
      - "capital_minimum_required computed from domicile"

  - method: GET
    path: "/api/captives"
    description: "List all Captive Entities"
    roles: [CaptiveManager, DomicileRegulator, Underwriter, Actuary, ClaimsAdjuster, BoardDirector, TaxAdvisor]
    code: 200
    input: ["limit?", "offset?"]
    output: "CaptiveEntity[]"
    side_effects: []

  - method: GET
    path: "/api/captives/{captiveId}"
    description: "Get a specific Captive Entity"
    roles: [CaptiveManager, DomicileRegulator, Underwriter, Actuary, ClaimsAdjuster, BoardDirector, TaxAdvisor]
    code: 200
    input: []
    output: CaptiveEntity
    side_effects: []

  - method: POST
    path: "/api/captives/{captiveId}/activate"
    description: "Activate a capitalized captive"
    roles: [CaptiveManager]
    code: 200
    input: []
    output: CaptiveEntity
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/api/captives/{captiveId}/suspend"
    description: "Suspend an active captive"
    roles: [DomicileRegulator]
    code: 200
    input: []
    output: CaptiveEntity
    side_effects: ["status -> SUSPENDED", "Cascade: programs -> RUN_OFF, fronting -> TERMINATED"]

  - method: POST
    path: "/api/captives/{captiveId}/reinstate"
    description: "Reinstate a suspended captive"
    roles: [DomicileRegulator]
    code: 200
    input: []
    output: CaptiveEntity
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/api/captives/{captiveId}/dissolve"
    description: "Dissolve a captive"
    roles: [CaptiveManager, DomicileRegulator]
    code: 200
    input: []
    output: CaptiveEntity
    side_effects: ["status -> DISSOLVED", "Cascade: programs -> CLOSED, collateral -> RELEASED"]

  # --- DomicileFiling ---
  - method: POST
    path: "/api/captives/{captiveId}/domicile-filings"
    description: "Create a domicile filing"
    roles: [CaptiveManager]
    code: 201
    input: [filing_type, jurisdiction, supporting_documents]
    output: DomicileFiling
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/api/captives/{captiveId}/domicile-filings"
    description: "List domicile filings for a captive"
    roles: [CaptiveManager, DomicileRegulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "DomicileFiling[]"
    side_effects: []

  - method: GET
    path: "/api/captives/{captiveId}/domicile-filings/{filingId}"
    description: "Get a specific domicile filing"
    roles: [CaptiveManager, DomicileRegulator]
    code: 200
    input: []
    output: DomicileFiling
    side_effects: []

  - method: POST
    path: "/api/captives/{captiveId}/domicile-filings/{filingId}/submit"
    description: "Submit a domicile filing"
    roles: [CaptiveManager]
    code: 200
    input: []
    output: DomicileFiling
    side_effects: ["status -> SUBMITTED", "CaptiveEntity.status -> DOMICILE_FILED"]

  - method: POST
    path: "/api/captives/{captiveId}/domicile-filings/{filingId}/acknowledge"
    description: "Regulator acknowledges filing"
    roles: [DomicileRegulator]
    code: 200
    input: []
    output: DomicileFiling
    side_effects: ["status -> UNDER_REVIEW", "regulator_reference generated"]

  - method: POST
    path: "/api/captives/{captiveId}/domicile-filings/{filingId}/approve"
    description: "Approve a domicile filing"
    roles: [DomicileRegulator]
    code: 200
    input: []
    output: DomicileFiling
    side_effects: ["status -> APPROVED", "CaptiveEntity.status -> CAPITALIZED"]

  - method: POST
    path: "/api/captives/{captiveId}/domicile-filings/{filingId}/reject"
    description: "Reject a domicile filing"
    roles: [DomicileRegulator]
    code: 200
    input: [rejection_reason]
    output: DomicileFiling
    side_effects: ["status -> REJECTED", "CaptiveEntity.governance_score -= 10"]

  - method: POST
    path: "/api/captives/{captiveId}/domicile-filings/{filingId}/withdraw"
    description: "Withdraw a domicile filing"
    roles: [CaptiveManager]
    code: 200
    input: []
    output: DomicileFiling
    side_effects: ["status -> WITHDRAWN"]

  # --- InsuranceProgram ---
  - method: POST
    path: "/api/captives/{captiveId}/programs"
    description: "Create an insurance program"
    roles: [Underwriter]
    code: 201
    input: [program_name, line_of_business, policy_period_start, policy_period_end, aggregate_limit_cents, per_occurrence_limit_cents, attachment_point_cents, premium_budget_cents, "fronting_required?", expected_captive_version]
    output: InsuranceProgram
    side_effects: ["program_status = DRAFT", "coverage_status = UNBOUND", "increments CaptiveEntity.version by 1"]

  - method: GET
    path: "/api/captives/{captiveId}/programs"
    description: "List programs for a captive"
    roles: [CaptiveManager, Underwriter, Actuary, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "InsuranceProgram[]"
    side_effects: []

  - method: GET
    path: "/api/captives/{captiveId}/programs/{programId}"
    description: "Get a specific program"
    roles: [CaptiveManager, Underwriter, Actuary, ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceProgram
    side_effects: []

  - method: POST
    path: "/api/captives/{captiveId}/programs/{programId}/quote"
    description: "Quote a program"
