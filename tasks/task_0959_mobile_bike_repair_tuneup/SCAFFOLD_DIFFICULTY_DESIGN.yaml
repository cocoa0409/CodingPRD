          trigger:
            - { call: "POST /v1/invoices/${inv_id}/events", payload: { event_type: "DISPUTE", dispute_reason: "overcharge" }, as: Customer, as_user_id: "${cust_id}", captures: { st1: $.data.status } }
            - { call: "POST /v1/invoices/${inv_id}/events", payload: { event_type: "ISSUE" }, as: Dispatcher, captures: { st2: $.data.status } }
            - { call: "POST /v1/invoices/${inv_id}/events", payload: { event_type: "PAY", amount_cents: 7992 }, as: Customer, as_user_id: "${cust_id}", captures: { st3: $.data.status } }
            - { call: "GET /v1/service-requests/${req_id}", as: Dispatcher, captures: { ws_end: $.data.work_status, bs_end: $.data.billing_status } }
          assert:
            - "Invoice status sequence: ISSUED -> DISPUTED -> ISSUED -> PAID (cycle then terminal)"
            - "ServiceRequest.${req_id}.billing_status == PAID and work_status == CLOSED (auto-close on PAID while COMPLETED)"

  - rule_id: transitive_cascade
    instances:
      - name: mechanic_suspend_unassigns_stops_reverts_requests_unlocks_route
        grounds:
          - state_machines.Mechanic.ACTIVE_to_SUSPENDED
          - state_machines.RouteStop.PLANNED_to_UNASSIGNED
          - state_machines.ServiceRequest.DISPATCHED_to_QUOTED
          - state_machines.RouteDay.LOCKED_to_OPEN
        distinguishing_aspect: |
          Depth-3 cascade from the Mechanic SUSPEND trigger: Mechanic ->
          RouteStop (UNASSIGNED) -> ServiceRequest (reverts DISPATCHED->QUOTED)
          -> RouteDay (active_stop_count recomputed; LOCKED day auto-unlocks
          when emptied) — each hop caused by the previous mutation.
        test_recipe:
          setup:
            - "Mechanic Mo on van VAN-1; route day 2026-05-02 LOCKED with exactly one PLANNED stop for a DISPATCHED request"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/events", payload: { event_type: "LOCK" }, as: Dispatcher }
          trigger:
            - { call: "POST /v1/mechanics/${mech_id}/events", payload: { event_type: "SUSPEND", reason: "injury" }, as: Dispatcher, captures: { mech_status: $.data.status } }
            - { call: "GET /v1/route-stops/${stop_id}", as: Dispatcher, captures: { stop_status: $.data.status } }
            - { call: "GET /v1/service-requests/${req_id}", as: Dispatcher, captures: { req_ws: $.data.work_status, req_mech: $.data.scheduled_mechanic_id } }
            - { call: "GET /v1/route-days/${rd_id}", as: Dispatcher, captures: { rd_status: $.data.status, rd_count: $.data.active_stop_count } }
          assert:
            - "Mechanic.status == SUSPENDED (trigger)"
            - "Hop 1: RouteStop.${stop_id}.status == UNASSIGNED"
            - "Hop 2: ServiceRequest.${req_id}.work_status == QUOTED and scheduled_mechanic_id == null"
            - "Hop 3: RouteDay.active_stop_count == 0 and RouteDay.status == OPEN (auto-unlocked from LOCKED)"

      - name: subscription_suspend_releases_allowance_and_requotes
        grounds:
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - calculations.provisional_quote
          - entities.ServiceRequest.fields.covered_by_subscription
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (Subscription SUSPEND):
          Subscription -> ServiceRequest (coverage cleared, allowance released)
          -> quoted_total_cents recomputed without discount (11391 -> 12352).
        test_recipe:
          setup:
            - "FLEET customer with 10% subscription (included 5); one covered QUOTED STANDARD request (zone 2500, STANDARD tier)"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "STANDARD", base_price_cents: 8900, included_minutes: 75, overage_rate_cents_per_min: 110, labor_warranty_days: 60 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Fleet Co", email: "fleet@x.com", account_kind: "FLEET" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { customer_id: "${cust_id}", included_tunes_per_period: 5, discount_pct: 0.10, period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z" }, as: Dispatcher, captures: { sub_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", subscription_id: "${sub_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id, quoted_pre: $.data.quoted_total_cents } }
          trigger:
            - { call: "POST /v1/subscriptions/${sub_id}/events", payload: { event_type: "SUSPEND" }, as: Dispatcher, captures: { sub_status: $.data.status, sub_reserved: $.data.allowance_reserved } }
            - { call: "GET /v1/service-requests/${req_id}", as: Dispatcher, captures: { req_covered: $.data.covered_by_subscription, quoted_post: $.data.quoted_total_cents } }
          assert:
            - "Pre-cascade: quoted_total_cents == 11391 (10% discount on 8900 labor line)"
            - "Hop 1: Subscription.status == SUSPENDED and allowance_reserved == 0 (reservation released)"
            - "Hop 2: ServiceRequest.covered_by_subscription == false and quoted_total_cents == 12352 (recomputed without discount)"

  - rule_id: priority_pair_validation_conflict
