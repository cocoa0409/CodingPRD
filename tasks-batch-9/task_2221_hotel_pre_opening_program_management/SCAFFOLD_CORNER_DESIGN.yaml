              payload: { program_id: "${prog_id}", system_type: "KEY", is_required: true }
              as: SystemsIntegrator
              as_user_id: "si-1"
              captures: { sys_key: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/system-implementations/${sys_key}/test-runs"
              payload: { executed_at: "2026-09-01T09:00:00Z", cases_total: 0, cases_passed: 0, blocker_count: 0 }
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
              captures: { e_empty: "$.data.error_id" }
          assert:
            - "response status is 422"
            - "data.error_id == 'ERR_TEST_RUN_EMPTY'"
            - "GET /pre-opening/system-implementations/${sys_key} still returns state == 'PLANNED', latest_pass_rate == null and cumulative_pass_rate == null"
            - "GET /pre-opening/system-implementations/${sys_key}/test-runs returns total_count == 0"

      - name: certify_below_pass_rate_floor_returns_pass_rate_below_threshold
        claim_type: violation_to_error
        grounds:
          - "§1.3 system_test_aggregation sets CERTIFY_PASS_RATE_FLOOR 0.95 and states certification reads latest_pass_rate; 37/40 = 0.925 is above the 0.50 failure ceiling but below the floor, so the system sits in TESTING and certification is refused with ERR_SYSTEM_PASS_RATE_BELOW_THRESHOLD."
        distinguishing_aspect: "37/40 is 0.925 — above the 0.5 failure ceiling but below CERTIFY_PASS_RATE_FLOOR 0.95 — so the system sits in TESTING and certification is refused with ERR_PASS_RATE_BELOW_THRESHOLD at 422."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One required REVENUE SystemImplementation with a single 37/40 run at 2026-09-01T09:00:00Z and blocker_count 0, so latest_pass_rate is 0.925, result FAILED and state TESTING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/system-implementations"
              payload: { program_id: "${prog_id}", system_type: "REVENUE", is_required: true }
              as: SystemsIntegrator
              as_user_id: "si-1"
              captures: { sys_rev: "$.data.id" }
            - call: "POST /pre-opening/system-implementations/${sys_rev}/test-runs"
              payload: { executed_at: "2026-09-01T09:00:00Z", cases_total: 40, cases_passed: 37, blocker_count: 0 }
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
              captures: { run_925: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/system-implementations/${sys_rev}/certify"
              payload: {}
              as: SystemsIntegrator
              as_user_id: "si-certifier-2"
              captures: { e_floor: "$.data.error_id" }
          assert:
            - "the setup run response data.pass_rate == 0.925 and data.result == 'FAILED'"
            - "the system state after the setup run == 'TESTING' (0.925 is not below the 0.50 failure ceiling)"
            - "response status is 422"
            - "data.error_id == 'ERR_SYSTEM_PASS_RATE_BELOW_THRESHOLD'"
            - "GET /pre-opening/programs/${prog_id} still returns certified_system_count == 0 and required_system_count == 1"

      - name: certify_with_uncertified_prerequisite_returns_prerequisite_system_not_certified
        claim_type: violation_to_error
        grounds:
          - "§1.2 TESTING -> CERTIFIED requires prerequisite_system_id to be null or that system to be CERTIFIED (else ERR_PREREQUISITE_SYSTEM_NOT_CERTIFIED); §1.1 SystemImplementation.prerequisite_system_id is the interface prerequisite, so an untested PMS blocks a fully passing POS."
        distinguishing_aspect: "The POS system meets every gate of its own (latest_pass_rate 1.0, no blockers) and is still refused, because its prerequisite PMS system is only PLANNED — the failure is entirely in the other entity's state."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
