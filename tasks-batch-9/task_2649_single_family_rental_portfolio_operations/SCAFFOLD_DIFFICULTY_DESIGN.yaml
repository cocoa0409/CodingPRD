  - rule_id: transitive_cascade
    instances:
      - name: work_order_completion_cascades_four_hops_to_slot_unblock_and_realized_yield
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.RenovationProject.IN_PROGRESS_to_RENT_READY
          - state_machines.Home.asset_status.RENOVATING_to_STABILIZED
          - state_machines.ShowingSlot.BLOCKED_BY_POSTURE_to_AVAILABLE
          - calculations.home_leasing_posture
          - calculations.turn_holdback
          - calculations.yield_on_cost
        distinguishing_aspect: |
          A single work-order completion propagates four hops across four different entities -
          WorkOrder -> RenovationProject (RENT_READY plus the turn_holdback figures) -> Home
          (STABILIZED and posture FROZEN -> OPEN) -> ShowingSlot (BLOCKED_BY_POSTURE -> AVAILABLE)
          and UnderwritingCase (realized_* group) - with no direct call touching the slot or the case.
