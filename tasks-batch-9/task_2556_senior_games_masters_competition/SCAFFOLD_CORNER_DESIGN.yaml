          - calculations.personnel_conflict_window
          - calculations.athlete_multisport_gap
        excluded_because:
          difficulty_instance: venue_area_half_open_end_buffer_with_aggregate_area_capacity
          rationale: "Half-open venue windows with end-only teardown buffers, and the deliberately opposite verdict the closed-interval personnel scan gives on the same 09:00-10:00 / 10:00-11:00 pair, are covered by that §1.8 instance together with personnel_closed_interval_with_venue_conditional_travel_buffer."

