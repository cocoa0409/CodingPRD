              as: QualityAssurance
              as_user_id: "qa-rb4a"
              captures: { err_rb4: $.data.error_id }
            - call: "POST /cleanroom/investigations/${inv_rb4}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-rb4b"
          assert:
            - "Approve by qa-rb4a (== investigated_by): HTTP 403 error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Approve by qa-rb4b (!= investigated_by): succeeds, ExcursionInvestigation.${inv_rb4}.status == APPROVED"

      - name: segregation_of_duties_cycle_performer_cannot_verify_own
        claim_type: rbac_denial
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "A QA verifying a cycle while carrying the SAME X-User-ID as the cycle's performed_by_user_id is denied 403 ERR_SEGREGATION_OF_DUTIES; a QA with a different X-User-ID verifies successfully. (Role gate passes — QualityAssurance may verify — but the SoD identity check fires.)"
