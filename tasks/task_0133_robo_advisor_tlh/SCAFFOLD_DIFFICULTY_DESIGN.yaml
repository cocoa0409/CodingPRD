scaffold_difficulty_design:

  # =====================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fifo_vs_specific_lot_realized_gain
        grounds:
          - calculations.realized_gain_loss
          - entities.Trade.fields.cost_basis_method
          - entities.Lot.fields.adjusted_unit_cost_cents
          - state_machines.Trade.PENDING_to_EXECUTED
        distinguishing_aspect: |
          Realized P/L is computed on the Trade/Lot domain (cost-basis accounting on tax lots).
          Given identical SELL inputs (same Position, 5 shares, execution price 11000 cents),
          FIFO consumes the older 10000-cost lot and SPECIFIC_LOT consumes the named 12000-cost
          lot. The two variants produce realized_gain_loss_cents of +5000 vs -5000 — different
          sign, different magnitude.
        test_recipe:
          setup:
            - "Create Client (kyc=ACTIVE), Account funded with cash 200000."
            - "Register Security S1 (US_EQUITY, group g1, last_price_cents=11000)."
            - "Open Lot A via BUY+execute+settle at executed_at=2024-01-01: 10 shares at unit_cost_cents=10000 (advance clock back via /_clock/advance)."
            - "Open Lot B via BUY+execute+settle at executed_at=2024-06-01: 10 shares at unit_cost_cents=12000."
            - "Advance clock to 2024-12-01; /_pricing/set S1.last_price_cents=11000."
          trigger:
            - "POST /accounts/{a}/trades  body={security_id:S1, side:SELL, requested_shares:5, cost_basis_method:FIFO}  → Trade T_F."
            - "POST /accounts/{a}/trades/T_F/execute"
            - "POST /accounts/{a}/trades  body={security_id:S1, side:SELL, requested_shares:5, cost_basis_method:SPECIFIC_LOT, specific_lot_id:Lot_B.id}  → Trade T_S."
            - "POST /accounts/{a}/trades/T_S/execute"
          assert:
            - "Trade T_F.realized_gain_loss_cents == 5000"
            - "Trade T_S.realized_gain_loss_cents == -5000"
            - "T_F.realized_gain_loss_cents != T_S.realized_gain_loss_cents"

      - name: standard_vs_age_adjusted_risk_score
        grounds:
          - calculations.risk_score
          - entities.RiskQuestionnaire.fields.scoring_method
          - entities.RiskQuestionnaire.fields.q3_growth_vs_stability
          - entities.Client.fields.age
        distinguishing_aspect: |
          Risk score is computed on the Client/RiskQuestionnaire domain (suitability scoring) —
          a different entity domain from realized P/L on Trade/Lot. For identical answers
          {q1:4, q2:4, q3:5, q4:2, q5:4} and a 60-year-old client, STANDARD yields raw=21 →
          AGGRESSIVE; AGE_ADJUSTED inverts q3 yielding raw=17 → MODERATE.
        test_recipe:
          setup:
            - "Create Client C with birth_date=1965-01-01, time_horizon_years=10."
            - "Advance clock to 2025-06-01 so Client.age >= 55."
          trigger:
            - "POST /clients/{C}/risk-questionnaire  body={q1:4, q2:4, q3:5, q4:2, q5:4, scoring_method:STANDARD}  → Q_A."
            - "POST /clients/{C}/risk-questionnaire  body={q1:4, q2:4, q3:5, q4:2, q5:4, scoring_method:AGE_ADJUSTED}  → Q_B."
          assert:
            - "Q_A.raw_score == 21"
            - "Q_A.assigned_band == 'AGGRESSIVE'"
            - "Q_B.raw_score == 17"
            - "Q_B.assigned_band == 'MODERATE'"

  # =====================================================================
  # Rule 2: Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: model_portfolio_tiered_3x3_matrix
        grounds:
          - calculations.model_portfolio_assignment
          - entities.ModelPortfolio.fields.risk_band
          - entities.ModelPortfolio.fields.horizon_band
          - entities.Client.fields.time_horizon_years
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and tiered-rate selection. Model assignment depends
          on three inputs (Client.risk_band, Client.time_horizon_years, ModelPortfolio.is_active)
          combined non-linearly via two tier bucketings (risk band × horizon band). Different
          horizons crossing the band cutoffs (5/15/40) select different models even when
          risk_band is identical.
        test_recipe:
          setup:
            - "Create 9 ModelPortfolio rows covering all (risk_band, horizon_band) combinations, each is_active=true."
            - "Submit questionnaire yielding Client.risk_band=MODERATE."
          trigger:
            - "PATCH /clients/{C}  body={time_horizon_years:5} ; activate → Account.model_portfolio_id assigned."
            - "PATCH /clients/{C}  body={time_horizon_years:6} ; observe reassignment."
            - "PATCH /clients/{C}  body={time_horizon_years:15} ; observe."
            - "PATCH /clients/{C}  body={time_horizon_years:16} ; observe."
          assert:
            - "Time_horizon=5 → ModelPortfolio.horizon_band == 'SHORT'."
            - "Time_horizon=6 → ModelPortfolio.horizon_band == 'MID' (different model than the SHORT one)."
            - "Time_horizon=15 → ModelPortfolio.horizon_band == 'MID'."
            - "Time_horizon=16 → ModelPortfolio.horizon_band == 'LONG' (different model than the MID one)."

      - name: nested_rounding_1099b_per_trade_then_sum
        grounds:
          - calculations.form_1099b_assembly
          - calculations.realized_gain_loss
          - entities.Form1099B.fields.short_term_realized_gain_loss_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Per the pinned order, each Trade's
          gross_proceeds_cents and basis_consumed_cents are rounded half-up to whole cents
          once at trade level; the 1099-B then sums those already-rounded integers without
          further rounding. The alternative (sum raw products of share×cents then round once)
          produces different totals on edge cases — the scaffold pins per-trade-then-sum.
        test_recipe:
          setup:
            - "Create Client, Account, Security S2 with last_price_cents=10003."
            - "BUY+settle 3 trades of 0.3333 shares each at unit_cost_cents=10001 (3 lots) earlier in tax year."
            - "Advance clock to year-end."
          trigger:
            - "Issue 3 separate SELL trades of 0.3333 shares each at execution_price=10003; execute+settle."
            - "POST /clients/{C}/forms-1099b  body={tax_year:2025}  → Form1099B F."
            - "GET /clients/{C}/forms-1099b/{F}"
          assert:
            - "Each Trade.gross_proceeds_cents == round_half_up(0.3333 * 10003) == 3334 (sum of 3 = 10002)."
            - "Each Trade.realized_gain_loss_cents was rounded once per trade."
            - "F.short_term_proceeds_cents == sum of three trade-level integers == 10002 (NOT round(0.9999*10003)=10002 — verify the implementation rounded per trade, not at aggregate)."
            - "F.short_term_realized_gain_loss_cents equals the per-trade-summed value, not an aggregate-then-rounded value."

  # =====================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rebalance_run_branching_fork_join
        grounds:
          - state_machines.RebalanceRun
          - state_machines.RebalanceRun.IN_PROGRESS_to_COMPLETED
          - state_machines.RebalanceRun.IN_PROGRESS_to_BLOCKED_BY_WASH_SALE
          - state_machines.RebalanceRun.IN_PROGRESS_to_FAILED
        distinguishing_aspect: |
          Branching fork-join: from IN_PROGRESS the RebalanceRun forks into three divergent
          terminal states (COMPLETED, BLOCKED_BY_WASH_SALE, FAILED), each with a different
          side-effect set on child Trades and Account.investment_status. Not a linear A→B→C→D.
        test_recipe:
          setup:
            - "Create two Accounts a1, a2, each with drift >= 5.00 and identical model portfolios."
            - "For a2, register a SELL Trade SETTLED on group g_dup within the last 30 days, and seed a2's drift such that the rebalance would need to BUY group g_dup."
          trigger:
            - "POST /accounts/a1/rebalance/start (force=false) → run R1; settle all child trades; observe terminal state."
            - "POST /accounts/a2/rebalance/start (force=false) → run R2; observe terminal state."
          assert:
            - "R1.status == 'COMPLETED' and R1.completed_at is not null."
            - "R2.status == 'BLOCKED_BY_WASH_SALE' (different terminal of the same fork)."

      - name: harvest_opportunity_cyclic_blocked_to_detected
        grounds:
          - state_machines.HarvestOpportunity
          - state_machines.HarvestOpportunity.BLOCKED_to_DETECTED
          - state_machines.HarvestOpportunity.DETECTED_to_DISMISSED
        distinguishing_aspect: |
          Cyclic on a different entity: HarvestOpportunity can transition BLOCKED → DETECTED
          when a new investable replacement Security becomes available (e.g., a CorrelationLink
          added later). The cycle BLOCKED↔DETECTED is observable, distinct from the linear
          Trade/Lot pipelines.
        test_recipe:
          setup:
            - "Create Account with a position whose unrealized_loss_cents = -60000."
            - "No CorrelationLink exists between the held security and any investable security of a different group."
          trigger:
            - "POST /accounts/{a}/positions/recompute body={intent:detect}  → opp O.status=='BLOCKED'."
            - "POST /securities (new investable Security S_new in a different group)."
            - "POST /correlation-links body={security_a_id:held, security_b_id:S_new, correlation:0.95}."
            - "POST /accounts/{a}/positions/recompute body={intent:detect}  → re-evaluate."
          assert:
            - "Before correlation-link: opp O.status == 'BLOCKED' and replacement_security_id == null."
            - "After correlation-link: opp O.status == 'DETECTED' and replacement_security_id == S_new.id."

  # =====================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: client_suspend_depth4_cascade
        grounds:
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - state_machines.Account
          - state_machines.HarvestOpportunity.DETECTED_to_DISMISSED
        distinguishing_aspect: |
          Depth-3 chain originating from a Client suspend trigger:
          (1) Client ACTIVE→SUSPENDED causes (2) every Account.compliance_status to mutate
          to FROZEN_DOC_REVIEW; that Account mutation itself causes (3) every DETECTED
          HarvestOpportunity row on each frozen Account to flip to DISMISSED. Each link
          fires from the previous link's mutation, not from the original trigger directly.
        test_recipe:
          setup:
            - "Client C ACTIVE; two Accounts a1, a2 each ACTIVE."
            - "Seed positions with unrealized_loss_cents <= -60000 and run detect: each account has at least one DETECTED HarvestOpportunity."
          trigger:
            - "POST /clients/C/suspend"
          assert:
            - "Client.kyc_status == 'SUSPENDED'."
            - "Account a1.compliance_status == 'FROZEN_DOC_REVIEW' and a2.compliance_status == 'FROZEN_DOC_REVIEW'."
            - "Every previously-DETECTED HarvestOpportunity on a1 and a2 now has status == 'DISMISSED'."

      - name: sell_settle_depth3_wash_sale_chain
        grounds:
          - state_machines.Trade.EXECUTED_to_SETTLED
          - state_machines.Lot.OPEN_to_CLOSED
          - calculations.wash_sale_basis_adjustment
          - entities.WashSaleEvent
          - entities.Lot.fields.adjusted_unit_cost_cents
        distinguishing_aspect: |
          Depth-3 chain originating from a SELL Trade settle trigger (different originating
          transition from the suspend cascade): (1) Trade EXECUTED→SETTLED mutates (2) the
          consumed Lot to CLOSED with realized loss; that Lot closure mutation triggers
          (3) wash_sale_basis_adjustment which writes a WashSaleEvent and mutates the
          replacement Lot's adjusted_unit_cost_cents.
        test_recipe:
          setup:
            - "Account funded; Security S3 (group g3), Security S3b (also group g3 — substantially identical)."
            - "BUY+settle 10 shares S3 at unit_cost=10000 on 2024-09-01."
            - "BUY+settle 5 shares S3b at unit_cost=9000 on 2024-09-20 (within 30 days)."
            - "Advance clock to 2024-09-25; /_pricing/set S3.last_price_cents=9000."
          trigger:
            - "POST /accounts/{a}/trades  body={security_id:S3, side:SELL, requested_shares:10, cost_basis_method:FIFO}  → T_sell."
            - "POST /accounts/{a}/trades/T_sell/execute"
            - "POST /accounts/{a}/trades/T_sell/settle"
          assert:
            - "Trade T_sell.status == 'SETTLED' and T_sell.realized_gain_loss_cents == -10000."
            - "The original Lot for S3 has status == 'CLOSED' and shares_remaining == 0."
            - "A WashSaleEvent exists linking T_sell to the BUY of S3b with disallowed_loss_cents == 5000."
            - "The replacement Lot (the 5 shares of S3b) has adjusted_unit_cost_cents == 9000 + 1000 == 10000."

  # =====================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_frozen_vs_insufficient_cash
        grounds:
          - validations[priority=9]   # ERR_ACCOUNT_FROZEN (state-adjacent, business_safety)
          - validations[priority=22]  # ERR_INSUFFICIENT_CASH (business_fiscal)
          - entities.Account.fields.compliance_status
          - entities.Account.fields.cash_balance_cents
        distinguishing_aspect: |
          Two simultaneous failures on a BUY execute: Account.compliance_status==FROZEN_DOC_REVIEW
          (business_safety/state category at priority 9) AND cash_balance < required (business_fiscal
          at priority 22). By priority ordering the response MUST be ERR_ACCOUNT_FROZEN, not
          ERR_INSUFFICIENT_CASH.
        test_recipe:
          setup:
            - "Account with compliance_status=FROZEN_DOC_REVIEW and cash_balance_cents=100."
            - "Security S with last_price_cents=10000."
            - "Create BUY Trade T for 5 shares (would require 50000 cents)."
          trigger:
            - "POST /accounts/{a}/trades/T/execute"
          assert:
            - "HTTP status 409"
            - "data.error_id == 'ERR_ACCOUNT_FROZEN' (NOT 'ERR_INSUFFICIENT_CASH')."

      - name: business_safety_vs_referential_wash_sale_vs_not_investable
        grounds:
          - validations[priority=8]   # ERR_WASH_SALE_VIOLATION (business_safety)
          - validations[priority=10]  # ERR_SECURITY_NOT_INVESTABLE (business_referential)
          - entities.Security.fields.is_investable
          - entities.Security.fields.substantially_identical_group_id
        distinguishing_aspect: |
          Different error-category pair from the prior conflict: business_safety (wash sale
          window violation at priority 8) vs business_referential (security not investable at
          priority 10). When both apply to the same BUY execute, the response MUST be
          ERR_WASH_SALE_VIOLATION because it has the lower (higher-priority) number.
        test_recipe:
          setup:
            - "Account ACTIVE with sufficient cash."
            - "Security S_loss (group g4, is_investable=true) — held, recently SELL-settled at a loss."
            - "Security S_dup (group g4, is_investable=false) — substantially identical AND not investable."
            - "SELL+settle of S_loss within last 30 days realizing a loss."
            - "Create BUY Trade T for S_dup."
          trigger:
            - "POST /accounts/{a}/trades/T/execute"
          assert:
            - "HTTP status 422"
            - "data.error_id == 'ERR_WASH_SALE_VIOLATION' (NOT 'ERR_SECURITY_NOT_INVESTABLE')."

  # =====================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: drift_threshold_exact_5pct_inclusive
        grounds:
          - calculations.recompute_drift
          - validations[priority=14]
          - entities.Account.fields.max_drift_pct
        distinguishing_aspect: |
          Boundary on a numeric percentage metric reachable via POST /accounts/{id}/rebalance/start.
          The rule is max_drift_pct >= 5.00 (inclusive >=). At exactly 5.00 rebalance MUST succeed;
          at 4.99 it MUST fail with ERR_DRIFT_BELOW_THRESHOLD.
        test_recipe:
          setup:
            - "Account with model targets US_EQUITY=0.60, INTL_EQUITY=0.20, US_BOND=0.15, INTL_BOND=0.04, CASH=0.01."
            - "Holdings: US_EQUITY MV=65000, INTL_EQUITY MV=20000, US_BOND MV=10000, INTL_BOND MV=4000, cash=1000. Total=100000. Max drift = |0.65-0.60|=0.05 → 5.00."
          trigger:
            - "POST /accounts/{a}/drift/recompute"
            - "POST /accounts/{a}/rebalance/start  body={quarter_key:'2026-Q2'}"
          assert:
            - "Account.max_drift_pct == 5.00 after recompute (exact)."
            - "Rebalance start returns 201 with RebalanceRun created."
            - "Second scenario with holdings shifted so max drift = 4.99 returns 422 ERR_DRIFT_BELOW_THRESHOLD."

      - name: harvest_threshold_exact_minus_500_inclusive
        grounds:
          - calculations.harvest_opportunity_detection
          - validations[priority=15]
          - entities.HarvestOpportunity.fields.unrealized_loss_cents
        distinguishing_aspect: |
          Boundary on a different metric (integer cents unrealized loss) reachable via a
          different endpoint POST /accounts/{id}/positions/recompute?intent=detect. The rule
          is unrealized_loss_cents <= -50000 (inclusive). At exactly -50000 an opportunity
          MUST be DETECTED; at -49900 none is created.
        test_recipe:
          setup:
            - "Account funded; Security S with last_price_cents=10000."
            - "BUY+settle 10 shares S at unit_cost=10000 (cost_basis=100000)."
            - "Advance and /_pricing/set S.last_price_cents=5000 → MV=50000, unrealized=-50000."
          trigger:
            - "POST /accounts/{a}/positions/recompute body={intent:'detect'}"
          assert:
            - "Exactly one HarvestOpportunity with status=DETECTED and unrealized_loss_cents == -50000."
            - "When repeated with last_price_cents=5010 (unrealized=-49900): NO HarvestOpportunity is created (existing ones remain unchanged)."

      - name: wash_sale_window_day30_vs_day31
        grounds:
          - calculations.wash_sale_basis_adjustment
          - entities.WashSaleEvent
          - state_machines.Trade.EXECUTED_to_SETTLED
        distinguishing_aspect: |
          Boundary on a temporal interval metric (calendar days) reachable via POST
          /accounts/{a}/trades/{t}/settle. Window is symmetric ±30 calendar days INCLUSIVE.
          A replacement BUY on day +30 matches; day +31 does not.
        test_recipe:
          setup:
            - "Account funded; Security S (group g5) held at a loss after a SELL on 2024-10-01."
            - "Two separate scenarios: scenario A — buy 5 shares S on 2024-10-31 (day +30); scenario B — buy 5 shares S on 2024-11-01 (day +31)."
          trigger:
            - "For scenario A: SELL+execute+settle on 2024-10-01 then BUY+execute+settle on 2024-10-31."
            - "For scenario B: SELL+execute+settle on 2024-10-01 then BUY+execute+settle on 2024-11-01."
          assert:
            - "Scenario A: a WashSaleEvent exists for the SELL with matched_shares > 0."
            - "Scenario B: NO WashSaleEvent exists for the SELL (day +31 is outside the inclusive window)."

  # =====================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: trade_execute_depends_on_account_compliance
        grounds:
          - state_machines.Trade.PENDING_to_EXECUTED
          - entities.Account.fields.compliance_status
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair (Trade, Account). Trade.PENDING→EXECUTED requires the parent Account's
          compliance_status == ACTIVE. Trade itself is otherwise in a legal state — the
          rejection comes from a different entity's state.
        test_recipe:
          setup:
            - "Account in compliance_status=FROZEN_DOC_REVIEW with sufficient cash."
            - "BUY Trade T in PENDING for an investable Security."
          trigger:
            - "POST /accounts/{a}/trades/T/execute"
          assert:
            - "HTTP 409, error_id == 'ERR_ACCOUNT_FROZEN'."
            - "After POST /accounts/{a}/unfreeze and re-execute: Trade.status == 'EXECUTED'."

      - name: form1099b_issue_depends_on_client_and_open_trades
        grounds:
          - state_machines.Form1099B.DRAFT_to_ISSUED
          - entities.Client.fields.kyc_status
          - validations[priority=21]
        distinguishing_aspect: |
          Entity pair (Form1099B, Client) — different from (Trade, Account). Issuing a
          Form1099B requires Client.kyc_status==ACTIVE AND zero non-terminal SELL Trades
          for that client in the tax year. The dependency is across an aggregate-of-children
          state, not the same-entity state.
        test_recipe:
          setup:
            - "Client ACTIVE with one SELL Trade T in EXECUTED (non-terminal) for tax_year=2025."
            - "Form1099B F created in DRAFT for client+2025."
          trigger:
            - "POST /clients/{C}/forms-1099b/F/issue"
          assert:
            - "HTTP 409, error_id == 'ERR_OPEN_TRADES_FOR_TAX_YEAR'."
            - "After settling T (Trade.status='SETTLED'), POST /clients/{C}/forms-1099b/F/issue returns 200 with F.status == 'ISSUED'."

  # =====================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: wash_sale_symmetric_inclusive_30day_window
        grounds:
          - calculations.wash_sale_basis_adjustment
          - entities.WashSaleEvent
          - entities.Security.fields.substantially_identical_group_id
        distinguishing_aspect: |
          Resource is Security (within an Account scope). Interval semantics: symmetric
          closed interval [sell_date - 30, sell_date + 30] in calendar days; both endpoints
          inclusive. The overlap rule matches a SELL and a BUY of the SAME
          substantially_identical_group_id within that closed bilateral window.
        test_recipe:
          setup:
            - "Account funded; Securities S1 and S2 share group g6 (S1 ≡ S2)."
            - "SELL+settle 10 shares S1 at a loss on 2024-10-15."
            - "BUY+settle 4 shares S2 on 2024-09-15 (day -30, inclusive)."
            - "BUY+settle 4 shares S2 on 2024-11-14 (day +30, inclusive)."
          trigger:
            - "Trigger SELL settle to run wash_sale_basis_adjustment."
          assert:
            - "Exactly two WashSaleEvent rows exist for the SELL trade (one per matched BUY); each matched_shares == 4."
            - "The replacement Lots' adjusted_unit_cost_cents have been boosted."

      - name: rebalance_run_calendar_quarter_bucket
        grounds:
          - entities.RebalanceRun.fields.quarter_key
          - state_machines.RebalanceRun.SCHEDULED_to_IN_PROGRESS
          - validations[priority=13]
          - concurrency_rules[rebalance_already_in_progress]
        distinguishing_aspect: |
          Different resource (Account) and different interval semantics: discrete calendar
          quarter buckets indexed by quarter_key="YYYY-Qn" (right-open intervals [Q_start,
          Q_end)), at most ONE non-FAILED RebalanceRun per bucket per Account. Not a sliding
          window — a discrete partition.
        test_recipe:
          setup:
            - "Account a with drift >= 5.00."
            - "One COMPLETED RebalanceRun already exists for (a, '2026-Q2')."
          trigger:
            - "POST /accounts/a/rebalance/start body={quarter_key:'2026-Q2', force:true}"
            - "POST /accounts/a/rebalance/start body={quarter_key:'2026-Q3', force:true}"
          assert:
            - "First call returns 409 ERR_REBALANCE_ALREADY_IN_PROGRESS (Q2 bucket occupied)."
            - "Second call returns 201 with a new RebalanceRun for Q3 (different bucket — no overlap)."

  # =====================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: share_conservation_buy_then_sell_full_round_trip
        grounds:
          - state_machines.Trade.PENDING_to_EXECUTED
          - state_machines.Trade.EXECUTED_to_SETTLED
          - state_machines.Lot.OPEN_to_CLOSED
          - entities.Lot.fields.shares_remaining
          - entities.Position.fields.shares
        distinguishing_aspect: |
          Conserved quantity (shares): sum of Lot.shares_remaining for OPEN/PARTIALLY_CLOSED
          lots PLUS cumulative shares sold = cumulative shares bought, per Account×Security.
          BUY+execute+settle of X shares then SELL+execute+settle of X shares must leave
          the named invariant unchanged at zero net position with both lots in CLOSED state.
          Formula: Σ Lot.shares_remaining + Σ Trade(SELL).requested_shares = Σ Trade(BUY).requested_shares.
        test_recipe:
          setup:
            - "Account funded; Security S; no positions."
          trigger:
            - "BUY+execute+settle 10 shares S at price=10000."
            - "SELL+execute+settle 10 shares S at price=10000 (zero gain — no wash sale)."
          assert:
            - "Σ Lot.shares_remaining over OPEN/PARTIALLY_CLOSED for (account, S) == 0."
            - "Σ requested_shares of SELL trades (10) == Σ requested_shares of BUY trades (10) — share invariant holds."
            - "Position row absent or shares == 0; no orphan share float."

      - name: cost_basis_conservation_after_wash_sale_adjustment
        grounds:
          - calculations.wash_sale_basis_adjustment
          - entities.Trade.fields.disallowed_loss_cents
          - entities.Lot.fields.adjusted_unit_cost_cents
          - entities.Lot.fields.unit_cost_cents
        distinguishing_aspect: |
          Conserved quantity (cost basis dollars) — different from shares. When a wash sale
          disallows loss D on a SELL and boosts the replacement Lot's adjusted_unit_cost_cents
          by D, the invariant is: (sum of replacement-Lot.adjusted_unit_cost_cents *
          shares_opened) − (sum of replacement-Lot.unit_cost_cents * shares_opened)
          == Trade.disallowed_loss_cents. No basis is created or destroyed; the disallowed
          loss is moved from realized P/L into replacement basis.
        test_recipe:
          setup:
            - "Same setup as sell_settle_depth3_wash_sale_chain: SELL realizing $1000 loss with 5 of 10 shares matched against a 5-share BUY at unit_cost=9000."
          trigger:
            - "POST /accounts/{a}/trades/T_sell/settle"
          assert:
            - "Trade T_sell.disallowed_loss_cents == 5000."
            - "Replacement Lot.adjusted_unit_cost_cents == 10000, Lot.unit_cost_cents == 9000."
            - "(adjusted_unit_cost_cents - unit_cost_cents) * shares_opened == (10000-9000) * 5 == 5000 == disallowed_loss_cents (basis invariant holds)."

      - name: cash_conservation_dividend_then_full_reinvest
        grounds:
          - calculations.dividend_reinvestment_amount
          - entities.Account.fields.cash_balance_cents
          - entities.DividendEvent
        distinguishing_aspect: |
          Conserved quantity (cash cents) — different from shares and basis. For a dividend
          paid in an amount that yields an integer number of whole shares at the held
          security's last_price_cents, the invariant after dividend recording + reinvest
          settle is: Account.cash_balance_cents == cash_balance_before + amount_cents
          − round_half_up(shares * price) and equals cash_balance_before exactly when the
          reinvest fully consumes the dividend. No drift in cash.
        test_recipe:
          setup:
            - "Account with cash_balance_cents=10000 (the only initial cash) and a held position in Security S (last_price_cents=10000, is_investable=true)."
          trigger:
            - "POST /accounts/{a}/dividends body={security_id:S, amount_cents:30000}  → emits BUY 3.0000 shares S."
            - "Execute and settle the reinvest BUY Trade."
          assert:
            - "After dividend recording: cash_balance_cents == 40000 (10000 + 30000)."
            - "After BUY execute+settle: cash_balance_cents == 10000 (cash returns to pre-dividend baseline — full reinvest)."
            - "Lot for the reinvest exists with shares_opened == 3.0000 and unit_cost_cents == 10000."
