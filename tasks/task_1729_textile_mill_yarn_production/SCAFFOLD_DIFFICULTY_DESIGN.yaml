              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
          trigger:
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 1000.0 }
              as: DyeHouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_QUALITY_GATE_FAILED (recipe not APPROVED blocks dye submission)"

      - name: dye_lot_approve_requires_passing_quality_test
        grounds:
          - state_machines.DyeLot.SHADE_PENDING_to_APPROVED
        distinguishing_aspect: |
          DyeLot → QualityTest dependency: approving a DyeLot requires a linked
          QualityTest whose grade is in {FIRST_QUALITY, SECOND_QUALITY}; a
          REJECTED-grade test blocks the transition (entity pair DyeLot/QualityTest).
        test_recipe:
          setup:
            - "DyeLot in SHADE_PENDING with a QualityTest whose grade == REJECTED (shrinkage 9.0 >= 8.0)"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "XDEP-B", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 1000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 9.0, hand_score: 2 }
              as: QualityInspector
            - call: "POST /mill/dye-lots/${dl_id}/submit-shade"
              payload: {}
              as: DyeHouseOperator
          trigger:
            - call: "POST /mill/dye-lots/${dl_id}/approve"
              payload: {}
              as: QualityInspector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_QUALITY_GATE_FAILED (REJECTED grade blocks approval)"
            - "DyeLot.${dl_id}.status remains SHADE_PENDING"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances DIFFERENT interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: machine_assignment_half_open_overlap
        grounds:
          - validations[priority=8]
        distinguishing_aspect: |
          Half-open interval [start, end) semantics on SpinningMachine — two
          SCHEDULED/IN_PROGRESS MachineAssignments on the same machine overlap
          iff start1 < end2 AND start2 < end1; touching endpoints (end1 == start2)
          do NOT overlap.
        test_recipe:
          setup:
            - "SpinningMachine and YarnLot exist; one SCHEDULED assignment occupies [08:00, 12:00)"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "OVL-A", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 100.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_a: $.data.id }
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 80.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_b: $.data.id }
            - call: "POST /mill/spinning-machines"
              payload: { machine_code: "SPIN-OVL", supported_count_min_ne: 10.0, supported_count_max_ne: 30.0 }
              as: MillAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /mill/machine-assignments"
              payload: { machine_id: "${sm_id}", yarn_lot_id: "${yl_a}", window_start: "2026-08-14T08:00:00Z", window_end: "2026-08-14T12:00:00Z" }
              as: SpinningSupervisor
          trigger:
            - call: "POST /mill/machine-assignments"
              payload: { machine_id: "${sm_id}", yarn_lot_id: "${yl_b}", window_start: "2026-08-14T10:00:00Z", window_end: "2026-08-14T14:00:00Z" }
              as: SpinningSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_WINDOW_CONFLICT (10:00 < 12:00 overlaps)"
            - "A back-to-back assignment starting at exactly 12:00 would NOT conflict (half-open)"

      - name: vat_buffer_cooldown_between_dye_lots
        grounds:
          - validations[priority=8]
        distinguishing_aspect: |
          Buffer-based semantics on vat_id — a different interval model from
          half-open: a new DyeLot on the same vat must start at least 30 minutes
          after the previous DyeLot's scheduled_at (aggregate capacity with
          cooldown), tested via POST /mill/dye-lots.
        test_recipe:
          setup:
            - "A DyeLot scheduled on vat_id='VAT-BUF' at 08:00; a second DyeLot submitted at 08:15 (inside the 30-minute cooldown)"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "OVL-B", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 400.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 100.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_a: $.data.id }
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 80.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_b: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_a}", shade_band_id: "${sb_id}", vat_id: "VAT-BUF", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 1000.0 }
              as: DyeHouseOperator
          trigger:
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_b}", shade_band_id: "${sb_id}", vat_id: "VAT-BUF", scheduled_at: "2026-08-14T08:15:00Z", requested_yards: 1000.0 }
              as: DyeHouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_WINDOW_CONFLICT (08:15 is within 30-minute cooldown of 08:00 batch)"

  # =========================================================================
  # Rule 9 — compensating_invariant (2 instances DIFFERENT conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fiber_weight_conservation_across_blend
        grounds:
          - entities.FiberLot.fields.available_weight_lbs
          - state_machines.FiberLot.RECEIVED_to_BLENDED
        distinguishing_aspect: |
          Conserved quantity: fiber weight in pounds. Invariant —
          received_weight_lbs == available_weight_lbs + sum(component_weight_lbs
          across all recipes consuming this lot). Approve then reject the recipe
          restores available_weight_lbs unchanged.
        test_recipe:
          setup:
            - "FiberLot with received_weight_lbs=500; a BlendRecipe consuming 200 lbs approved then rejected"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "INV-WT", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
          trigger:
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "GET /mill/fiber-lots/${fl_id}"
              as: MillPlanner
              captures: { fl_mid: $.data }
          assert:
            - "FiberLot.${fl_id}.available_weight_lbs == 300.0 after approve (500 - 200)"
            - "FiberLot.${fl_id}.received_weight_lbs == 500.0 (unchanged)"
            - "Invariant: received_weight_lbs == available_weight_lbs + consumed (500 == 300 + 200)"

      - name: greige_yards_conservation_dye_and_reject
        grounds:
          - entities.YarnLot.fields.greige_yards_available
          - state_machines.YarnLot.DYEING_to_GREIGE
        distinguishing_aspect: |
          Conserved quantity: greige yards. Invariant — greige_yards_available +
          yards_committed_to_open_dye_lots + yards_finished == initial_yards.
          DyeLot create then reject restores greige_yards_available unchanged.
        test_recipe:
          setup:
            - "YarnLot with initial greige_yards_available == 3,024,000 (180 lbs @ Ne=20)"
            - "A DyeLot consuming 5000 yards, then rejected"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "INV-YDS", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 9.0, hand_score: 2 }
              as: QualityInspector
            - call: "POST /mill/dye-lots/${dl_id}/submit-shade"
              payload: {}
              as: DyeHouseOperator
          trigger:
            - call: "POST /mill/dye-lots/${dl_id}/reject"
              payload: {}
              as: QualityInspector
          assert:
            - "YarnLot.${yl_id}.greige_yards_available == 3024000.0 (restored to initial value)"
            - "Invariant: greige_yards_available (3,024,000) + committed (0) + finished (0) == initial (3,024,000)"
            - "YarnLot.${yl_id}.status == GREIGE"
