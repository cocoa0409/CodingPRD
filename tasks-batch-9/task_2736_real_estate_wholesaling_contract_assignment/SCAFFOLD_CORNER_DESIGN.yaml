          - state_machines.SellerLead.SCREENED_to_SCREENED
        distinguishing_aspect: "The screen action is a self-transition on SCREENED: re-running it under the same variant at a later clock leaves status and protection_tier alone but re-stamps screened_at to the new clock value and bumps version a second time."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-04T00:00:00Z, then advanced to 2026-08-09T00:00:00Z."
