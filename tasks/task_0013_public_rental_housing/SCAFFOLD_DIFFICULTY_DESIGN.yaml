# =============================================================================
# Public Rental Housing — Scaffold Difficulty Design (Test Targeting Index)
# Cross-references the nine §0.5 Difficulty Rules to declared elements in
# SCAFFOLD.yaml §1.1–§1.7. All numeric literals in assertions were computed
# against the SCAFFOLD's calculations and constants.
# =============================================================================

scaffold_difficulty_design:

  # -----------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: queue_score_initial_vs_recalculated
        grounds:
          - calculations.queue_score
          - calculations.queue_score.variants[initial_score]
          - calculations.queue_score.variants[recalculated_score]
          - state_machines.Application.UNDER_REVIEW_to_SCORED
          - state_machines.AnnualReview.OPEN_to_FINALIZED
          - entities.Application.fields.queue_score
        distinguishing_aspect: |
          Operates on the Application entity domain (queue ranking on the queue side):
          residence_length is measured at different clock points in the two variants,
          and the RESIDENCE_PTS_CAP=20 saturates only the recalculated variant — yielding
          two different integer queue_score values for identical residence_start_period.
        test_recipe:
          setup:
            - "Create HousingProgram P with notice_period_length=3, grace_period_length=6, per_capita_income_threshold_cents=300000, per_capita_asset_threshold_cents=500000."
            - "Advance P.current_period_index to 18 via POST /clock/advance by_periods=18."
            - "Applicant A creates Application with household_type=LOW_INCOME, household_members=[{citizen_id=C1,relation=SELF,has_disability=true,special_care_category=ELDERLY_LIVE_ALONE}], declared_monthly_income_cents=200000, declared_total_assets_cents=200000, residence_start_period=0."
            - "Emit valid CIVIL_AFFAIRS_HOUSEHOLD, PUBLIC_SECURITY_IDENTITY (identity_verified=true for C1), and TAX_INCOME_ASSETS (monthly_income_cents=200000, total_assets_cents=200000) SyncEvents."
            - "POST /applications/{appId}/submit and POST /applications/{appId}/cross-check (Application now SCORED)."
            - "POST /applications/{appId}/enqueue, simulate allocation/contract path until Application is OCCUPIED."
            - "Advance clock by_periods=4 (now current_period_index=22)."
            - "POST /applications/{appId}/annual-reviews then POST /annual-reviews/{reviewId}/finalize with no updated_* fields."
          trigger:
            - "Read Application after cross-check (initial_score variant) and after AnnualReview finalize (recalculated_score variant)."
          assert:
            - "Application.queue_score == 80 immediately after cross-check (residence_length=18, 30+20+18+12)."
            - "AnnualReview.recomputed_queue_score == 82 after finalize (residence_length=22, capped to 20: 30+20+20+12)."
            - "Application.queue_score == 82 after finalize (recalculated overwrites initial)."

      - name: rent_reduction_provisional_vs_final
        grounds:
          - calculations.rent_reduction_discount_provisional
          - calculations.rent_reduction_discount_final
          - state_machines.RentReduction.SECONDARY_REVIEW_to_FINAL_APPROVED
          - entities.RentReduction.fields.provisional_discount_bps
          - entities.RentReduction.fields.final_discount_bps
        distinguishing_aspect: |
          Operates on the RentReduction entity domain (a different entity from queue_score):
          provisional uses the applicant's declared_hardship_income_cents whereas final uses
          the cross-verified TAX_INCOME_ASSETS payload, so the two valid algorithms can land
          in different tier_bps buckets and produce different basis-point discounts.
        test_recipe:
          setup:
            - "Bring an Application through to ACTIVE Contract on a HousingUnit with monthly_base_rent_cents=100000."
            - "POST /contracts/{cid}/rent-reductions with hardship_category=UNEMPLOYMENT, declared_hardship_income_cents=25000, supporting_documents=[{doc_type='unemployment_letter', doc_ref='ref1', issued_period=current}]."
            - "Emit a TAX_INCOME_ASSETS SyncEvent for the parent application with payload.monthly_income_cents=35000."
            - "advance-to-primary, advance-to-secondary (using two distinct HousingOfficer X-User-IDs), final-approve as HousingDirector (different from primary)."
          trigger:
            - "Read RentReduction after SUBMITTED (provisional) and after FINAL_APPROVED (final)."
          assert:
            - "RentReduction.provisional_discount_bps == 6000 (ratio 0.25 < 0.30 → 5000, +UNEMPLOYMENT 1000)."
            - "RentReduction.final_discount_bps == 4000 (verified ratio 0.35 ∈ [0.30,0.50) → 3000, +UNEMPLOYMENT 1000)."
            - "RentReduction.final_discount_bps != RentReduction.provisional_discount_bps."

  # -----------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: queue_score_multifactor_with_cap_and_branches
        grounds:
          - calculations.queue_score
          - calculations.queue_score.constants
          - entities.Application.fields.queue_score
          - state_machines.Application.UNDER_REVIEW_to_SCORED
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction. queue_score combines
          four inputs (household_type, any_disability, residence_length, special_care_max)
          and is non-linear via min(residence_length, CAP) saturation and the conditional
          DISABILITY_PTS branch. Two distinct (household_type, any_disability, residence_length,
          special_care) tuples must yield the same total — exercising the tie-break rule.
        test_recipe:
          setup:
            - "Create program P (per_capita thresholds large enough that both pass)."
            - "Advance clock to current_period_index=10."
            - "Applicant A1 creates Application with household_type=NEW_CITIZEN, household_members=[{citizen_id=C1, has_disability=false, special_care_category=VETERAN}], residence_start_period= -40 (i.e., residence_length=50)."
            - "Applicant A2 creates Application with household_type=TALENT, household_members=[{citizen_id=C2, has_disability=true, special_care_category=NONE}], residence_start_period=5 (i.e., residence_length=5)."
            - "Emit per-application valid SyncEvents and POST /submit and /cross-check on both."
          trigger:
            - "Read both Applications after cross-check completes."
          assert:
            - "A1.queue_score == 50 (15 + 0 + min(50,20) + 15)."
            - "A2.queue_score == 50 (25 + 20 + 5 + 0)."
            - "A1.queue_score == A2.queue_score, forcing tie_break_key comparison on subsequent allocation."

      - name: monthly_effective_rent_round_per_line_then_sum
        grounds:
          - calculations.monthly_effective_rent
          - calculations.monthly_effective_rent.variants[round_per_line_then_sum]
          - calculations.monthly_effective_rent.variants[sum_then_round_INCORRECT]
          - state_machines.Contract.SIGNED_to_ACTIVE
          - entities.Contract.fields.monthly_effective_rent_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          "round per-line then sum"; the alternative "sum then round" produces a different
          integer total. Concretely, base_rent_cents=99999 in a TWO_BEDROOM unit
          (fractions [0.40, 0.30, 0.30]) yields 100000 under round-then-sum and 99999 under
          sum-then-round.
        test_recipe:
          setup:
            - "Create HousingUnit with apartment_type=TWO_BEDROOM, bedroom_count=2, monthly_base_rent_cents=99999."
            - "Bring an Application through to allocation, deposit (deposit_amount=199998), sign (lease_start_period=current, lease_end_period=current+12), handover."
          trigger:
            - "Read Contract after handover."
          assert:
            - "Contract.monthly_effective_rent_cents == 100000 (round_half_up(99999*0.40)=40000 + round_half_up(99999*0.30)=30000 + round_half_up(99999*0.30)=30000 = 100000)."
            - "Contract.monthly_effective_rent_cents != 99999 (the sum-then-round-once result is rejected)."

  # -----------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: allocation_revert_cycle
        grounds:
          - state_machines.Allocation
          - state_machines.Allocation.PUBLISHED_to_UNDER_OBJECTION
          - state_machines.Allocation.UNDER_OBJECTION_to_PUBLISHED
          - state_machines.Allocation.UNDER_OBJECTION_to_REVERTED
          - state_machines.Application.ALLOCATED_to_QUEUED
        distinguishing_aspect: |
          Allocation has a CYCLE: PUBLISHED → UNDER_OBJECTION → PUBLISHED (when all open
          objections are dismissed and none sustained), and a fork with REVERTED that
          cascades the parent Application back from ALLOCATED to QUEUED. This is on the
          Allocation entity.
        test_recipe:
          setup:
            - "Set up an Allocation in PUBLISHED state during the notice period."
            - "POST /allocations/{id}/objections (Citizen submits) — Allocation moves PUBLISHED → UNDER_OBJECTION."
            - "POST /objections/{id}/dismiss — last open objection dismissed, none sustained."
          trigger:
            - "Read Allocation after dismissal."
            - "POST another /objections to re-enter UNDER_OBJECTION."
            - "POST /objections/{id}/sustain to enter REVERTED."
          assert:
            - "Allocation.status transitions: PUBLISHED → UNDER_OBJECTION → PUBLISHED (cycle realized)."
            - "On sustain, Allocation.status == REVERTED and parent Application.status == QUEUED, HousingUnit.status == AVAILABLE."

      - name: rent_reduction_branching_with_revert
        grounds:
          - state_machines.RentReduction
          - state_machines.RentReduction.SECONDARY_REVIEW_to_FINAL_APPROVED
          - state_machines.RentReduction.PRIMARY_REVIEW_to_REJECTED
          - state_machines.RentReduction.SECONDARY_REVIEW_to_REJECTED
          - state_machines.RentReduction.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          RentReduction is a BRANCHING fork-join with revert on a different entity
          (RentReduction, not Allocation): SUBMITTED → PRIMARY_REVIEW splits into
          {FINAL_APPROVED via SECONDARY_REVIEW} or {REJECTED}, and REJECTED → SUBMITTED
          permits a revision cycle. Side effects diverge per branch (final-approve
          mutates Contract.monthly_effective_rent_cents; reject does not).
        test_recipe:
          setup:
            - "Active Contract C exists; Applicant submits RentReduction R."
            - "Advance R: SUBMITTED → PRIMARY_REVIEW → SECONDARY_REVIEW → REJECTED (via /reject by HousingDirector)."
            - "Applicant calls /resubmit (REJECTED → SUBMITTED)."
            - "Advance R again to FINAL_APPROVED with valid distinct primary/secondary reviewers."
          trigger:
            - "Read RentReduction after each transition."
            - "Read Contract.monthly_effective_rent_cents at each step."
          assert:
            - "RentReduction.status sequence includes both REJECTED and a subsequent SUBMITTED (revision cycle)."
            - "Contract.monthly_effective_rent_cents is unchanged by /reject but recomputed on FINAL_APPROVED (branch divergence)."

  # -----------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: confirm_to_contract_to_handover_chain
        grounds:
          - state_machines.Allocation.PUBLISHED_to_CONFIRMED
          - state_machines.Contract.DRAFT_to_DEPOSIT_PAID
          - state_machines.Contract.SIGNED_to_ACTIVE
          - state_machines.Application.ALLOCATED_to_OCCUPIED
          - entities.HousingUnit.fields.status
        distinguishing_aspect: |
          Depth 4 chain originating from Applicant /confirm: A) Allocation PUBLISHED→CONFIRMED
          itself causes B) auto-create Contract in DRAFT with deposit_amount_cents derived
          from the unit. B is required for /pay-deposit, which causes C) Contract
          DEPOSIT_PAID; /sign → SIGNED; /handover causes D) Contract → ACTIVE which itself
          cascades to E) Application ALLOCATED→OCCUPIED and HousingUnit RESERVED→OCCUPIED.
          Each link is caused by the previous link, not by the original /confirm.
        test_recipe:
          setup:
            - "Allocation PUBLISHED with notice elapsed; HousingUnit in RESERVED, monthly_base_rent_cents=50000."
          trigger:
            - "POST /allocations/{id}/confirm (Applicant)."
            - "Emit PAYMENT_DEPOSIT SyncEvent payload.amount_cents=100000 for the auto-created Contract."
            - "POST /contracts/{cid}/pay-deposit, /sign with lease window, /handover (after lease_start_period)."
          assert:
            - "After /confirm: Allocation.status==CONFIRMED AND a Contract exists in DRAFT with deposit_amount_cents == 100000."
            - "After /pay-deposit: Contract.deposit_paid==true and status==DEPOSIT_PAID."
            - "After /sign: Contract.status==SIGNED with stored signature_blob."
            - "After /handover: Contract.status==ACTIVE AND Application.status==OCCUPIED AND HousingUnit.status==OCCUPIED (D→E hop)."

      - name: annual_review_failure_to_grace_to_exit
        grounds:
          - state_machines.AnnualReview.OPEN_to_FINALIZED
          - state_machines.Application.OCCUPIED_to_EXIT_PENDING
          - state_machines.Application.EXIT_PENDING_to_EXITED
          - state_machines.Contract.ACTIVE_to_TERMINATED
          - entities.Application.fields.exit_trigger_period
        distinguishing_aspect: |
          Depth 3 chain from a different trigger (AnnualReview /finalize, not /confirm):
          A) AnnualReview OPEN→FINALIZED with re_eligibility=INELIGIBLE causes B)
          Application OCCUPIED→EXIT_PENDING; B together with /clock/advance causes C)
          Application EXIT_PENDING→EXITED, which itself triggers D) Contract
          ACTIVE→TERMINATED and HousingUnit OCCUPIED→AVAILABLE. Originates from a
          different transition than the confirm-chain, capturing a different propagation
          pattern (eligibility loss vs allocation acceptance).
        test_recipe:
          setup:
            - "Bring Application to OCCUPIED with active Contract; per_capita_income_threshold_cents=300000, grace_period_length=6."
            - "POST /annual-reviews; emit a TAX_INCOME_ASSETS SyncEvent reporting verified_monthly_income_cents=900000 (per-capita 450000 > threshold)."
          trigger:
            - "POST /annual-reviews/{rid}/finalize (re_eligibility=INELIGIBLE; Application → EXIT_PENDING; exit_trigger_period set to current)."
            - "POST /clock/advance by_periods=6 (or call /finalize-exit explicitly)."
          assert:
            - "After finalize: Application.status==EXIT_PENDING AND Application.exit_trigger_period==current_period_index_at_finalize."
            - "After clock advance ≥ grace_period_length: Application.status==EXITED AND Contract.status==TERMINATED AND HousingUnit.status==AVAILABLE (B→C→D propagation)."

  # -----------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: contract_state_vs_fiscal_deposit
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - state_machines.Contract.DRAFT_to_DEPOSIT_PAID
          - errors[ERR_CONTRACT_NOT_IN_DRAFT]
          - errors[ERR_DEPOSIT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): a /pay-deposit call where (1) the Contract is
          NOT in DRAFT (already DEPOSIT_PAID) AND (2) the latest PAYMENT_DEPOSIT SyncEvent
          payload.amount_cents does not match deposit_amount_cents. Per priority order
          (priority 7 state vs priority 19 fiscal), state must win → ERR_CONTRACT_NOT_IN_DRAFT
          rather than ERR_DEPOSIT_AMOUNT_MISMATCH.
        test_recipe:
          setup:
            - "Contract C in DEPOSIT_PAID state."
            - "Latest PAYMENT_DEPOSIT SyncEvent for C has payload.amount_cents != C.deposit_amount_cents (mismatch)."
          trigger:
            - "POST /contracts/{cid}/pay-deposit."
          assert:
            - "Response status code == 409 AND data.error_id == 'ERR_CONTRACT_NOT_IN_DRAFT' (state error wins over fiscal error)."

      - name: cross_check_referential_vs_safety
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - state_machines.Application.UNDER_REVIEW_to_SCORED
          - errors[ERR_HOUSEHOLD_REGISTRATION_MISMATCH]
          - errors[ERR_EXISTING_HOUSING_DETECTED]
        distinguishing_aspect: |
          Pair (business_referential vs business_safety) — a different error-category pair
          from the first instance: cross-check where (1) latest CIVIL_AFFAIRS_HOUSEHOLD
          SyncEvent does not include all citizen_ids (referential mismatch) AND (2) one
          household member already occupies another active Contract (existing housing,
          safety). Priority 12 (referential) precedes priority 14 (safety) →
          ERR_HOUSEHOLD_REGISTRATION_MISMATCH wins.
        test_recipe:
          setup:
            - "Existing OCCUPIED Application/Contract in the program for citizen C2 (so C2 has existing housing)."
            - "New Application N with household_members=[{citizen_id=C1},{citizen_id=C2}], submitted to UNDER_REVIEW."
            - "Emit CIVIL_AFFAIRS_HOUSEHOLD SyncEvent that lists only C1 (omits C2 — referential mismatch)."
            - "Emit valid PUBLIC_SECURITY_IDENTITY and TAX_INCOME_ASSETS SyncEvents for C1 and C2."
          trigger:
            - "POST /applications/{N.id}/cross-check."
          assert:
            - "Response status code == 409 AND data.error_id == 'ERR_HOUSEHOLD_REGISTRATION_MISMATCH' (referential error wins over safety)."

  # -----------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: per_capita_income_strict_greater_than
        grounds:
          - validations[priority=15]
          - calculations.queue_score
          - state_machines.Application.UNDER_REVIEW_to_SCORED
          - errors[ERR_INCOME_OVER_THRESHOLD]
        distinguishing_aspect: |
          Numeric threshold boundary — strict greater-than (>) on
          verified_monthly_income_cents/family_size vs per_capita_income_threshold_cents.
          At exactly the threshold the application PASSES; one cent above it FAILS.
          Reachable through POST /applications/{id}/cross-check.
        test_recipe:
          setup:
            - "HousingProgram with per_capita_income_threshold_cents=300000, family of 2 members."
            - "Application A in UNDER_REVIEW with valid CIVIL/IDENTITY events for both members."
            - "Emit TAX_INCOME_ASSETS SyncEvent with payload.monthly_income_cents=600000 (per-capita exactly 300000)."
          trigger:
            - "POST /applications/{A.id}/cross-check."
            - "Reset and rerun with TAX SyncEvent payload.monthly_income_cents=600001 (per-capita 300000.5)."
          assert:
            - "First call: HTTP 200, Application.status==SCORED (300000 NOT > 300000 — boundary passes)."
            - "Second call: HTTP 409 with error_id=='ERR_INCOME_OVER_THRESHOLD' (300000.5 > 300000 — strict)."

      - name: empty_household_member_update_zero_count_edge
        grounds:
          - state_machines.AnnualReview.OPEN_to_FINALIZED
          - entities.AnnualReview.fields.updated_household_members
          - entities.AnnualReview.fields.recomputed_queue_score
          - calculations.queue_score
        distinguishing_aspect: |
          Empty-collection / zero-update edge on a different metric and endpoint:
          POST /annual-reviews/{id}/finalize where updated_household_members is omitted
          (null) and updated_declared_* are also null. The system MUST treat this as
          "reuse current values, recompute clock-dependent fields only" — recomputed_queue_score
          is set, rent_adjustment_cents == 0, and household composition is unchanged.
          This is a different boundary (zero-count of updates) on a different endpoint
          from the income threshold boundary.
        test_recipe:
          setup:
            - "Application in OCCUPIED with current queue_score=50, household_members of size 2."
            - "Advance clock by some periods so residence_length increases."
            - "POST /annual-reviews with no updated_* fields supplied (all null)."
          trigger:
            - "POST /annual-reviews/{rid}/finalize."
          assert:
            - "AnnualReview.recomputed_queue_score is non-null AND equal to recomputed value at new clock."
            - "AnnualReview.rent_adjustment_cents == 0 (no household_type change → no tier shift)."
            - "Application.household_members length unchanged (zero-count update preserved existing list)."

  # -----------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_requires_unit_available
        grounds:
          - state_machines.Application.QUEUED_to_ALLOCATED
          - validations[priority=17]
          - entities.HousingUnit.fields.status
          - errors[ERR_UNIT_NOT_AVAILABLE]
        distinguishing_aspect: |
          Entity pair (Application ↔ HousingUnit): an Application's QUEUED→ALLOCATED
          transition depends on a HousingUnit being in state AVAILABLE; if the unit is
          RESERVED/OCCUPIED/RETIRED, the transition is rejected.
        test_recipe:
          setup:
            - "Application A in QUEUED."
            - "HousingUnit U in RESERVED state (already reserved for another allocation)."
          trigger:
            - "POST /allocations with housing_unit_id=U.id."
          assert:
            - "HTTP 409 with error_id=='ERR_UNIT_NOT_AVAILABLE'."
            - "A.status remains QUEUED."

      - name: annual_review_requires_application_occupied
        grounds:
          - state_machines.AnnualReview.OPEN_to_FINALIZED
          - state_machines.Application.OCCUPIED_to_EXIT_PENDING
          - validations[priority=5]
          - entities.AnnualReview.fields.status
          - errors[ERR_APPLICATION_NOT_OCCUPIED]
        distinguishing_aspect: |
          Different entity pair (AnnualReview ↔ Application, distinct from
          Application ↔ HousingUnit): finalize on an AnnualReview is only valid when
          the parent Application is in OCCUPIED. If the application has already moved
          to EXIT_PENDING (e.g., a previously-finalized review triggered exit), a stale
          OPEN AnnualReview cannot be finalized. The dependency crosses a different
          parent-child boundary than the QUEUED→ALLOCATED case.
        test_recipe:
          setup:
            - "Application APP in OCCUPIED state."
            - "POST /annual-reviews → AR1 (OPEN)."
            - "POST /annual-reviews → would fail with ERR_ANNUAL_REVIEW_ALREADY_OPEN, so finalize AR1 first with INELIGIBLE inputs (per_capita income above threshold). APP transitions to EXIT_PENDING."
            - "POST /annual-reviews on APP again — must FAIL because APP is no longer OCCUPIED."
          trigger:
            - "POST /housing-programs/{pid}/applications/{APP.id}/annual-reviews while APP.status==EXIT_PENDING."
          assert:
            - "HTTP 409 with error_id=='ERR_APPLICATION_NOT_OCCUPIED' (AnnualReview creation rejected because parent Application is in a different cross-entity state than required)."

  # -----------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: housing_unit_lease_overlap_closed_intervals
        grounds:
          - state_machines.Contract.DEPOSIT_PAID_to_SIGNED
          - entities.Contract.fields.lease_start_period
          - entities.Contract.fields.lease_end_period
          - entities.HousingUnit.fields.status
          - errors[ERR_UNIT_NOT_AVAILABLE]
        distinguishing_aspect: |
          Resource: HousingUnit. Interval semantics: closed-closed inclusive
          [lease_start_period, lease_end_period]. A unit cannot host two contracts whose
          lease intervals share any period; enforced via the AVAILABLE/RESERVED/OCCUPIED
          status field — a unit becomes RESERVED on allocation and OCCUPIED on handover,
          blocking further allocations for the entire lease window.
        test_recipe:
          setup:
            - "Unit U with monthly_base_rent_cents=50000 in OCCUPIED via Contract C1 (lease 5..16)."
          trigger:
            - "Attempt POST /allocations with housing_unit_id=U.id during the lease."
          assert:
            - "HTTP 409 with error_id=='ERR_UNIT_NOT_AVAILABLE' (closed-closed interval excludes any overlapping period)."

      - name: rent_reduction_validity_overlap_half_open
        grounds:
          - validations[priority=23]
          - state_machines.RentReduction.SECONDARY_REVIEW_to_FINAL_APPROVED
          - entities.RentReduction.fields.validity_start_period
          - entities.RentReduction.fields.validity_end_period
          - errors[ERR_OVERLAPPING_RENT_REDUCTION]
        distinguishing_aspect: |
          Resource: Contract (a different entity from HousingUnit). Interval semantics:
          half-open [validity_start_period, validity_end_period) — a NEW reduction with
          start == previous end is permitted (no overlap), but start < previous end is
          rejected. This is geometrically distinct from the closed-closed unit-lease case.
        test_recipe:
          setup:
            - "Contract C with one FINAL_APPROVED RentReduction R1 covering [5, 17)."
            - "Submit a new RentReduction R2; advance R2 to SECONDARY_REVIEW; clock currently at period 16."
          trigger:
            - "POST /rent-reductions/{R2.id}/final-approve at period 16 (validity window would be [16, 28), overlapping R1 at periods 16)."
            - "Advance clock to 17 and try again (validity window would be [17, 29), abutting R1 at the half-open boundary)."
          assert:
            - "First attempt: HTTP 409 with error_id=='ERR_OVERLAPPING_RENT_REDUCTION' (16 ∈ [5,17), overlap)."
            - "Second attempt: HTTP 200; R2.status==FINAL_APPROVED (17 ∉ [5,17) — adjacency without overlap permitted under half-open semantics)."

  # -----------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: housing_unit_availability_invariant
        grounds:
          - state_machines.Allocation.PUBLISHED_to_REVERTED
          - state_machines.Allocation.UNDER_OBJECTION_to_REVERTED
          - state_machines.Application.ALLOCATED_to_QUEUED
          - entities.HousingUnit.fields.status
        distinguishing_aspect: |
          Conserved quantity: count of HousingUnits in {AVAILABLE} + count of HousingUnits
          in {RESERVED} + count of HousingUnits in {OCCUPIED} (excluding RETIRED) is
          constant under any sequence of allocation + revert. Specifically, the named
          invariant: BEFORE_count(status==AVAILABLE) == AFTER_count(status==AVAILABLE)
          when an Allocation is created and then immediately reverted (compensating action).
        test_recipe:
          setup:
            - "HousingProgram with N=5 HousingUnits, all AVAILABLE."
            - "Snapshot count_avail_before = count(HousingUnit.status==AVAILABLE) == 5."
          trigger:
            - "POST /allocations on one unit U → unit becomes RESERVED."
            - "Compensating action: POST /allocations/{id}/reject (Applicant declines) → unit returns to AVAILABLE, application to QUEUED."
          assert:
            - "After both actions: count(HousingUnit.status==AVAILABLE) == count_avail_before == 5 (named quantity unchanged)."
            - "Application.status == 'QUEUED' (round-tripped from QUEUED → ALLOCATED → QUEUED)."

      - name: applicant_active_application_count_invariant
        grounds:
          - state_machines.Application.OCCUPIED_to_EXIT_PENDING
          - state_machines.Application.EXIT_PENDING_to_EXITED
          - state_machines.Application.UNDER_REVIEW_to_REJECTED
          - validations[priority=24]
          - errors[ERR_DUPLICATE_ACTIVE_APPLICATION]
        distinguishing_aspect: |
          Different conserved quantity: count of Applications in non-terminal status
          {DRAFT, UNDER_REVIEW, SCORED, QUEUED, ALLOCATED, OCCUPIED, EXIT_PENDING}
          per (program, applicant_user_id) MUST equal at most 1. After the forward action
          (create application) followed by the compensating action (annual_review eligibility
          loss → exit), the count returns to 0 and the same applicant_user_id can create a
          new Application without ERR_DUPLICATE_ACTIVE_APPLICATION.
        test_recipe:
          setup:
            - "Applicant A1 has Application APP1 in OCCUPIED."
            - "Snapshot count_active_before = count(Application.applicant_user_id==A1, status NOT IN {EXITED, REJECTED}) == 1."
          trigger:
            - "Forward action: AnnualReview /finalize triggers EXIT_PENDING."
            - "Compensating action: clock advance past grace_period → Application APP1 → EXITED."
            - "Applicant A1 attempts POST /applications (a new application) → must succeed (count returns to 0 then back to 1)."
          assert:
            - "Immediately after EXITED: count(Application.applicant_user_id==A1, status NOT IN {EXITED, REJECTED}) == 0."
            - "After new POST /applications: count(...) == 1 again (and HTTP 201, not 409 ERR_DUPLICATE_ACTIVE_APPLICATION). The conserved quantity 'active applications per applicant' was correctly drained before re-incrementing."
