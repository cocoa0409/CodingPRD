              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ROOM_DOUBLE_BOOKED"

      - name: make_definite_state_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - state_machines.FunctionRoomBooking.HOLD_to_DEFINITE
        distinguishing_aspect: |
          A DIFFERENT category pair state (pri 5, ERR_INVALID_STATE) vs business_temporal
          (pri 7, ERR_ROOM_DOUBLE_BOOKED): event B is still INQUIRY (its booking may not go
          DEFINITE) AND B's window buffer-overlaps an already-DEFINITE booking on the same
          room; ERR_INVALID_STATE (lower priority number) wins over the overlap error.
        test_recipe:
          setup:
            - "Room buffer 60 with an existing DEFINITE booking 18:00-22:00 (event A held)."
            - "Event B is INQUIRY (never held) with a HOLD booking 22:30-23:30 on the same room (would buffer-overlap)."
