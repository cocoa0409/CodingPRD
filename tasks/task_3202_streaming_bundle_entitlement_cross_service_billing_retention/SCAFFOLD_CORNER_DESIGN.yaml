            - call: "GET /streaming/subscriber-accounts/${sa_b}"
              as: Subscriber
              as_user_id: "${sa_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_FORBIDDEN_NOT_OWNER"

      - name: distributor_ops_cannot_create_offers_or_read_revenue_scope
        claim_type: role_denied
