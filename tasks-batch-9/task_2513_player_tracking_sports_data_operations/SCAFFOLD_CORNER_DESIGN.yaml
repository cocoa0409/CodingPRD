              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { gv1: $.data.version }
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p1}", tag_type: "SHOT", clock_ms: 120000, confidence: 0.9, biometric_payload_present: false, expected_game_version: "${gv1}" }
              as: Statistician
