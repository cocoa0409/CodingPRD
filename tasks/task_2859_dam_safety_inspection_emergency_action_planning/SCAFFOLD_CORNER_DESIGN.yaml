      - name: drawdown_coordination_rejected_when_planned_release_exceeds_available_storage
        claim_type: aggregate_validation
        grounds:
          - validations[priority 29]
          - calculations.drawdown_volume_conservation
          - endpoints[POST /drawdown-orders/{id}/coordinate]
        distinguishing_aspect: |
          On a 100 acre-ft reservoir a 400 cfs six-hour release converts to 198.347 acre-ft and is a
          409 even though the 1200 cfs channel could carry it, and a 200 cfs release converting to
          99.174 acre-ft is allowed with 0.826 acre-ft to spare - the storage rule and the capacity
          rule read different denominators.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "SIGNIFICANT dam with gross_storage_acre_ft 100 on a 1200 cfs reach, with a MONITORING high-water event."
            - "Two REQUESTED drawdown orders over 2026-08-02T00:00:00Z..06:00Z: 400 cfs and 200 cfs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Pinch Pond Dam", nid_code: "ST00990", height_ft: 30, gross_storage_acre_ft: 100, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1974, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a1_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /high-water-events"
              payload: { dam_id: "${dam_id}", declared_at: "2026-08-01T06:00:00Z", trigger_description: "Rain-on-snow inflow", declared_inflow_cfs: 600 }
              as: EmergencyCoordinator
              captures: { event_id: "$.data.id" }
            - call: "POST /drawdown-orders"
              payload: { dam_id: "${dam_id}", high_water_event_id: "${event_id}", requested_release_cfs: 400, window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z" }
              as: EmergencyCoordinator
              captures: { big_id: "$.data.id" }
            - call: "POST /drawdown-orders"
              payload: { dam_id: "${dam_id}", high_water_event_id: "${event_id}", requested_release_cfs: 200, window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z" }
              as: EmergencyCoordinator
              captures: { small_id: "$.data.id" }
            - call: "GET /river-reaches/${reach_id}"
              payload: {}
              as: ProgramAdmin
              captures: { reach_v: "$.data.version" }
          trigger:
            - call: "POST /drawdown-orders/${big_id}/coordinate"
              payload: { expected_reach_version: "${reach_v}" }
              as: ProgramAdmin
            - call: "POST /drawdown-orders/${small_id}/coordinate"
              payload: { expected_reach_version: "${reach_v}" }
              as: ProgramAdmin
          assert:
            - "DrawdownOrder.${big_id}.planned_release_acre_ft == 198.347 and DrawdownOrder.${small_id}.planned_release_acre_ft == 99.174"
            - "the first coordinate returns HTTP 409 with error_id ERR_INSUFFICIENT_STORAGE"
            - "after the failure DrawdownOrder.${big_id}.status is still REQUESTED, RiverReach.${reach_id}.committed_release_cfs == 0 and version is unchanged"
            - "the second coordinate returns HTTP 200 with DrawdownOrder.${small_id}.status == COORDINATED"
            - "Dam.${dam_id}.committed_drawdown_acre_ft == 99.174 and available_conservation_storage_acre_ft == 0.826"
            - "RiverReach.${reach_id}.committed_release_cfs == 200 and active_drawdown_count == 1"

      - name: duplicate_nid_code_and_duplicate_license_number_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 38]
          - validations[priority 39]
