            - call: "POST /appeals/cases/${c_cc1}/extensions"
              payload: { expected_case_version: "${v_cc1_fresh}" }
              as: MemberServicesRep
              captures: { ext_ok: $.data.extension_applied }
          assert:
            - "Stale attempt: error_id == ERR_STALE_VERSION and http status 412 (event append bumped version between read and write)"
            - "Fresh attempt with the current version succeeds: extension_applied == true"

      - name: occ_effectuation_complete_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[effectuation-complete-stale-version]"]
        distinguishing_aspect: "Complete with expected_effectuation_version one behind current is rejected 412; the effectuation OCC guards the referral-cascading completion."
        test_recipe:
          setup: ["GRIEVANCE case decided FULLY_FAVORABLE; its Effectuation IN_PROGRESS at version 2 (start bumped it); client holds version 1 from creation"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CC2", full_name: "Occ Eff", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_cc2: $.data.id }
            - call: "POST /appeals/providers"
              payload: { npi: "6655443322", legal_name: "OccEff Clinic", contract_status: "CONTRACTED", w9_on_file: true }
              as: PlatformAdmin
              captures: { p_cc2: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_cc2}", provider_id: "${p_cc2}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_cc2: $.data.id }
            - call: "POST /appeals/cases/${c_cc2}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_cc2}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_cc2}/decide"
              payload: { decision_outcome: "FULLY_FAVORABLE", payment_amount_cents: 100 }
              as: CaseAnalyst
            - call: "GET /appeals/cases/${c_cc2}/effectuations"
              payload: {}
              as: ClaimsProcessor
              captures: { e_cc2: "$.data[0].id", ev_cc2_stale: "$.data[0].version" }
            - call: "POST /appeals/effectuations/${e_cc2}/start"
              payload: {}
              as: ClaimsProcessor
          trigger:
            - call: "POST /appeals/effectuations/${e_cc2}/complete"
              payload: { expected_effectuation_version: "${ev_cc2_stale}" }
              as: ClaimsProcessor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (start bumped version from the value captured before start)"
            - "Effectuation.status remains IN_PROGRESS"

      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.GrievanceAppealCase]
        distinguishing_aspect: "Each mutation (triage, event append, expedite) increments case.version by exactly 1; a GET reflects the running count."
        test_recipe:
          setup: ["APPEAL case created (version 1)"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CC3", full_name: "Ver Count", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_cc3: $.data.id }
            - call: "POST /appeals/providers"
              payload: { npi: "5544332211", legal_name: "Ver Clinic", contract_status: "CONTRACTED", w9_on_file: true }
              as: PlatformAdmin
              captures: { p_cc3: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "EXPEDITED", resolution_hours: 72, extension_hours: 0, effectuation_hours: 24 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_cc3}", provider_id: "${p_cc3}", case_kind: "APPEAL" }
              as: IntakeSpecialist
              captures: { c_cc3: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /appeals/cases/${c_cc3}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_cc3}/events"
              payload: { event_type: "NOTE", body: "n1" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_cc3}/expedite"
              payload: {}
              as: MedicalDirector
            - call: "GET /appeals/cases/${c_cc3}"
              payload: {}
              as: ComplianceOfficer
              captures: { v_final: $.data.version }
          assert:
            - "version at creation == 1"
            - "version after triage + 1 event + 1 expedite == 4 (each mutation +1, no drift)"

      - name: decision_notification_cascade_fires_once
        claim_type: cascading_side_effects
        grounds: [state_machines.Notification.QUEUED_to_SENT, state_machines.GrievanceAppealCase.DECIDED_to_NOTIFIED]
        distinguishing_aspect: "Sending the DECISION/MEMBER notification cascades the case DECIDED -> NOTIFIED exactly once; a PROVIDER decision notice does not re-trigger it."
        test_recipe:
          setup: ["DECIDED GRIEVANCE case; complete MEMBER and PROVIDER DECISION notifications"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CC4", full_name: "Cascade Once", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_cc4: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_cc4}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_cc4: $.data.id }
            - call: "POST /appeals/cases/${c_cc4}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_cc4}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_cc4}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_cc4}/notifications"
              payload: { recipient_kind: "PROVIDER", notification_kind: "DECISION", supplied_elements: ["citation_of_criteria", "appeal_rights", "decision_rationale", "expedited_availability", "ire_notice", "contact_information", "language_assistance"] }
              as: MemberServicesRep
              captures: { n_cc4p: $.data.id }
            - call: "POST /appeals/cases/${c_cc4}/notifications"
              payload: { recipient_kind: "MEMBER", notification_kind: "DECISION", supplied_elements: ["citation_of_criteria", "appeal_rights", "decision_rationale", "expedited_availability", "ire_notice", "contact_information", "language_assistance"] }
              as: MemberServicesRep
              captures: { n_cc4m: $.data.id }
          trigger:
            - call: "POST /appeals/notifications/${n_cc4p}/mark-sent"
              payload: {}
              as: MemberServicesRep
            - call: "GET /appeals/cases/${c_cc4}"
              payload: {}
              as: ComplianceOfficer
              captures: { st_after_provider: $.data.status }
            - call: "POST /appeals/notifications/${n_cc4m}/mark-sent"
              payload: {}
              as: MemberServicesRep
            - call: "GET /appeals/cases/${c_cc4}"
              payload: {}
              as: ComplianceOfficer
              captures: { st_after_member: $.data.status, notified_at: $.data.notified_at }
          assert:
            - "After PROVIDER notice sent: case status remains DECIDED (cascade is MEMBER-scoped)"
            - "After MEMBER notice sent: case status == NOTIFIED and notified_at == the MEMBER notification's sent_at"

