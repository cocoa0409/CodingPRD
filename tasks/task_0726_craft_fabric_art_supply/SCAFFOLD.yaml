# =============================================================================
# Craft, Fabric & Art-Supply Store (Michaels/JOANN style) — seed tables (v1)
# =============================================================================

scenario: "726. Craft, Fabric & Art-Supply Store (Michaels/JOANN style): SKU & cut-by-yard/bulk, coupon/weekly-ad & loyalty, class/workshop registration & supply kit, custom-framing linkage, project/BOM bundle, clearance/seasonal, special order, BOPIS"

domain_name: craft-fabric-art-supply
api_prefix: /

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers: [dual_variant_calculation, cascading_side_effects, rate_threshold_triggers, optimistic_concurrency]
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate
  entity_count: 14
  state_machine_count: 5
  calculation_count: 8
  validation_layers: 12
  endpoint_count: 30
  error_code_count: 26
  role_count: 4

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "unique customer email" }
      - { name: full_name, type: string, source: input, description: "customer name" }
      - { name: home_store_code, type: string, source: input, description: "BOPIS home store code, e.g. CA01" }

  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; one loyalty account per customer" }
      - { name: points_earned, type: integer, source: computed, description: "cumulative points ever earned, starts 0" }
      - { name: points_redeemed, type: integer, source: computed, description: "cumulative points ever redeemed, starts 0" }
      - { name: points_balance, type: integer, source: computed, description: "points_earned - points_redeemed; invariant" }
      - { name: spend_ytd_cents, type: integer, source: computed, description: "sum of finalized PICKED_UP order totals in current calendar year" }
      - { name: tier_forward, type: enum, source: computed, description: "BASIC|SILVER|GOLD from projected annual spend (forward_looking)" }
      - { name: tier_chronological, type: enum, source: computed, description: "BASIC|SILVER|GOLD from rolling 12-month actual spend (chronological)" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: sku, type: string, source: input, description: "unique stock-keeping unit code" }
      - { name: name, type: string, source: input, description: "product name" }
      - { name: sell_mode, type: enum, source: input, description: "UNIT|BY_YARD|BULK" }
      - { name: unit_price_cents, type: integer, source: input, description: "price per unit or per yard (integer cents)" }
      - { name: min_cut_increment_yards, type: number, source: input, default: 0.25, description: "minimum cut increment for BY_YARD; ignored for UNIT/BULK" }
      - { name: is_clearance, type: boolean, source: input, default: false, description: "clearance/seasonal flag; excluded from percent coupons" }
      - { name: special_order_only, type: boolean, source: input, default: false, description: "true if only obtainable via SpecialOrder" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: on_hand_yards, type: number, source: input, description: "physical stock (yards for BY_YARD, whole units otherwise)" }
      - { name: reserved_yards, type: number, source: computed, description: "reserved by SUBMITTED order lines, starts 0" }
      - { name: available_yards, type: number, source: computed, description: "on_hand_yards - reserved_yards; invariant" }

  - name: Coupon
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: code, type: string, source: input, description: "unique coupon/weekly-ad code" }
      - { name: discount_type, type: enum, source: input, description: "PERCENT|FIXED" }
      - { name: value, type: number, source: input, description: "percent as fraction 0..1 for PERCENT, or integer cents for FIXED" }
      - { name: min_basket_cents, type: integer, source: input, default: 0, description: "minimum eligible subtotal to apply" }
      - { name: stackable, type: boolean, source: input, default: false, description: "may combine with other coupons" }
      - { name: excludes_clearance, type: boolean, source: input, default: true, description: "if true, clearance line subtotals do not count toward PERCENT discount base" }
      - { name: priority, type: integer, source: input, description: "stack application order, ascending; ties broken by created_at ASC" }
      - { name: valid_from, type: datetime, source: input, description: "weekly-ad window start (inclusive)" }
      - { name: valid_to, type: datetime, source: input, description: "weekly-ad window end (exclusive)" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: coupon_id, type: string, source: system, description: "FK -> Coupon.id; last-applied coupon when only one; null if none" }
      - { name: project_bundle_id, type: string, source: input, description: "FK -> ProjectBundle.id; null unless order was built from a bundle" }
      - { name: fulfillment_status, type: enum, source: system, description: "BUILDING|SUBMITTED|READY_FOR_PICKUP|PICKED_UP|CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID|PAID|REFUNDED" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "estimate at SUBMITTED using requested yards" }
      - { name: final_total_cents, type: integer, source: computed, description: "recomputed at READY_FOR_PICKUP using actual_cut_yards" }
      - { name: points_redeemed_on_order, type: integer, source: input, default: 0, description: "loyalty points customer chose to redeem on this order" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: workshop_registration_id, type: string, source: input, description: "FK -> WorkshopRegistration.id; set when this line is a class supply kit; null otherwise" }
      - { name: requested_yards, type: number, source: input, description: "requested quantity (yards for BY_YARD, whole count for UNIT/BULK)" }
      - { name: actual_cut_yards, type: number, source: input, description: "yards actually cut, measured at pickup; null until measured" }
      - { name: line_subtotal_cents, type: integer, source: computed, description: "rounded per-line price; see calc order_pricing" }
      - { name: status, type: enum, source: system, description: "DRAFT|RESERVED|FULFILLED|CANCELLED" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: name, type: string, source: input, description: "classroom name" }
      - { name: cleanup_buffer_min, type: integer, source: input, default: 30, description: "required gap minutes between sessions in this room" }

  - name: Workshop
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: title, type: string, source: input, description: "workshop title" }
      - { name: status, type: enum, source: system, description: "DRAFT|OPEN|CLOSED|CANCELLED" }
      - { name: kit_product_id, type: string, source: input, description: "FK -> Product.id; supply-kit product added to registrant orders; null if none" }

  - name: WorkshopSession
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: workshop_id, type: string, source: input, description: "FK -> Workshop.id" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id" }
      - { name: instructor_code, type: string, source: input, description: "instructor identifier (opaque string, not an entity id)" }
      - { name: starts_at, type: datetime, source: input, description: "session start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "session end (exclusive)" }
      - { name: capacity, type: integer, source: input, description: "max registrations" }
      - { name: registered_count, type: integer, source: computed, description: "count of REGISTERED registrations, starts 0" }

  - name: WorkshopRegistration
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: workshop_id, type: string, source: input, description: "FK -> Workshop.id" }
      - { name: session_id, type: string, source: input, description: "FK -> WorkshopSession.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: status, type: enum, source: system, description: "REGISTERED|WAITLISTED|CANCELLED" }
      - { name: waitlist_rank, type: integer, source: computed, description: "position among WAITLISTED, 1-based by created_at ASC; null unless WAITLISTED" }

  - name: FramingOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the retail order this framing links to" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: width_in, type: number, source: input, description: "frame width inches" }
      - { name: height_in, type: number, source: input, description: "frame height inches" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "framing quote; see calc framing_quote" }
      - { name: status, type: enum, source: system, description: "QUOTED|APPROVED|IN_PRODUCTION|READY|CANCELLED" }

  - name: ProjectBundle
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: name, type: string, source: input, description: "project/BOM name" }
      - { name: bom, type: array, source: input, description: "array of {product_id, quantity}; bill of materials" }
      - { name: status, type: enum, source: system, description: "DRAFT|MATERIALIZED|CANCELLED" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the special-order-only product" }
      - { name: quantity, type: number, source: input, description: "requested quantity" }
      - { name: quoted_unit_price_cents, type: integer, source: input, description: "vendor quote per unit; set at QUOTED" }
      - { name: deposit_cents, type: integer, source: computed, description: "required deposit; see calc special_order_deposit" }
      - { name: status, type: enum, source: system, description: "REQUESTED|QUOTED|CONFIRMED|RECEIVED|CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    field: fulfillment_status
    initial_state: BUILDING
    terminal_states: [PICKED_UP, CANCELLED]
    note: "Order carries TWO parallel state dimensions: fulfillment_status (this block) and payment_status (next block); they evolve independently."
    transitions:
      - from: BUILDING
        to: SUBMITTED
        trigger: "POST /orders/{id}/submit"
        actor: Customer
        preconditions:
          - "At least one OrderLine exists (ERR_EMPTY_ORDER)"
          - "For each BY_YARD line, available_yards on the product's InventoryLot >= requested_yards (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "Each OrderLine DRAFT -> RESERVED"
          - "For each line, InventoryLot.reserved_yards += requested_yards; available_yards recomputed (transitive cascade)"
          - "provisional_total_cents computed via order_pricing (provisional variant)"
      - from: SUBMITTED
        to: READY_FOR_PICKUP
        trigger: "POST /orders/{id}/ready"
        actor: StoreAssociate
        preconditions:
          - "Order.payment_status == PAID (ERR_ORDER_NOT_PAID)"
          - "Every BY_YARD line has actual_cut_yards set (ERR_CUT_NOT_RECORDED)"
        side_effects:
          - "final_total_cents computed via order_pricing (final variant using actual_cut_yards)"
      - from: READY_FOR_PICKUP
        to: PICKED_UP
        trigger: "POST /orders/{id}/pickup"
        actor: StoreAssociate
        preconditions:
          - "Order.payment_status == PAID (ERR_ORDER_NOT_PAID)"
        side_effects:
          - "Each RESERVED OrderLine -> FULFILLED"
          - "For each line, InventoryLot.on_hand_yards -= actual_cut_yards (or requested_yards for UNIT/BULK); reserved_yards -= requested_yards (transitive cascade)"
          - "LoyaltyAccount.points_earned += floor(final_total_cents / 100); spend_ytd_cents += final_total_cents; tiers recomputed"
      - from: [BUILDING, SUBMITTED, READY_FOR_PICKUP]
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order not already PICKED_UP or CANCELLED (ERR_INVALID_STATE)"
        side_effects:
          - "Each non-CANCELLED OrderLine -> CANCELLED"
          - "For each previously RESERVED line, InventoryLot.reserved_yards -= requested_yards; available_yards recomputed (compensating release; transitive cascade)"
          - "If points_redeemed_on_order > 0: LoyaltyAccount.points_redeemed -= points_redeemed_on_order; points_balance recomputed (compensating)"
          - "Any linked FramingOrder in {QUOTED,APPROVED} -> CANCELLED"

  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status == SUBMITTED (ERR_INVALID_STATE)"
          - "If points_redeemed_on_order > 0, LoyaltyAccount.points_balance >= points_redeemed_on_order (ERR_INSUFFICIENT_POINTS)"
        side_effects:
          - "If points_redeemed_on_order > 0: LoyaltyAccount.points_redeemed += points_redeemed_on_order; points_balance recomputed"
      - from: PAID
        to: REFUNDED
        trigger: "system (Order cancel while PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "Refund issued for provisional_total_cents"

  - entity: Workshop
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /workshops/{id}/open"
        actor: StoreManager
        preconditions:
          - "At least one WorkshopSession exists (ERR_NO_SESSIONS)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /workshops/{id}/close"
        actor: StoreManager
        preconditions: []
        side_effects: []
      - from: [DRAFT, OPEN, CLOSED]
        to: CANCELLED
        trigger: "POST /workshops/{id}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "Each REGISTERED/WAITLISTED WorkshopRegistration -> CANCELLED (cascade)"
          - "For each cancelled registration, its supply-kit OrderLine (if any) -> CANCELLED, releasing InventoryLot reservation (transitive cascade)"

  - entity: WorkshopRegistration
    field: status
    initial_state: REGISTERED
    terminal_states: [CANCELLED]
    note: "Cyclic: WAITLISTED can be promoted back to REGISTERED when a seat frees."
    transitions:
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /workshop-registrations/{id}/cancel"
        actor: Customer
        preconditions:
          - "Registration is REGISTERED (ERR_INVALID_STATE)"
        side_effects:
          - "WorkshopSession.registered_count -= 1"
          - "Earliest WAITLISTED registration (by created_at ASC) for the session -> REGISTERED; registered_count += 1 (promotion; transitive cascade)"
      - from: WAITLISTED
        to: REGISTERED
        trigger: "system (seat freed by a cancel)"
        actor: system
        preconditions:
          - "A REGISTERED seat was released in the same session"
        side_effects:
          - "waitlist_rank cleared; registered_count += 1"
      - from: [REGISTERED, WAITLISTED]
        to: CANCELLED
        trigger: "system (parent Workshop cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SpecialOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [RECEIVED, CANCELLED]
    note: "Branching: REQUESTED forks to QUOTED or CANCELLED."
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: StoreManager
        preconditions:
          - "quoted_unit_price_cents provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "deposit_cents computed via special_order_deposit"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /special-orders/{id}/confirm"
        actor: Customer
        preconditions:
          - "SpecialOrder is QUOTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: RECEIVED
        trigger: "POST /special-orders/{id}/receive"
        actor: StoreAssociate
        preconditions: []
        side_effects:
          - "InventoryLot for product created/incremented by quantity"
      - from: [REQUESTED, QUOTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []

  - entity: FramingOrder
    field: status
    initial_state: QUOTED
    terminal_states: [READY, CANCELLED]
    transitions:
      - from: QUOTED
        to: APPROVED
        trigger: "POST /framing-orders/{id}/approve"
        actor: Customer
        preconditions:
          - "Linked Order.fulfillment_status IN {SUBMITTED, READY_FOR_PICKUP} (ERR_LINKED_ORDER_NOT_READY)"
        side_effects: []
      - from: APPROVED
        to: IN_PRODUCTION
        trigger: "POST /framing-orders/{id}/start"
        actor: FramingSpecialist
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: READY
        trigger: "POST /framing-orders/{id}/complete"
        actor: FramingSpecialist
        preconditions: []
        side_effects: []
      - from: [QUOTED, APPROVED]
        to: CANCELLED
        trigger: "POST /framing-orders/{id}/cancel or system (linked Order cancelled)"
        actor: Customer
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: coupon-apply-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/coupons"
    occ_field: "expected_order_version"
    description: |
      Applying a Coupon to an Order whose version has advanced since the client
      last observed it is rejected. A newly applied coupon legitimately supersedes
      the discount base recomputation on the order; if another writer has already
      applied a coupon (advancing the order's version), the current writer's view
      of the order is stale and the apply is refused on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    trigger: "Order submit (provisional variant); Order ready (final variant)"
    algorithm: aggregation
    formula: |
      For each OrderLine (status in {RESERVED, FULFILLED}):
        qty = (variant == provisional) ? requested_yards
                                       : (product.sell_mode == BY_YARD ? actual_cut_yards : requested_yards)
        raw = product.unit_price_cents * qty
        line_subtotal_cents = round_half_up(raw)            # ROUND PER LINE, then sum
      subtotal = sum(line_subtotal_cents over lines)         # sum of already-rounded line values
      discount = coupon_discount(subtotal, applied_coupons)  # see coupon_discount
      redeem = points_redeemed_on_order * POINT_VALUE_CENTS
      total = max(0, subtotal - discount - redeem)
    input_set: "OrderLines in RESERVED or FULFILLED status on the order"
    constants:
      POINT_VALUE_CENTS: 1
    precision: "integer cents; round_half_up applied per line BEFORE summing (pinned order)"
    variants:
      - { name: provisional, when: "at SUBMITTED", difference: "uses requested_yards for every line" }
      - { name: final, when: "at READY_FOR_PICKUP", difference: "uses actual_cut_yards for BY_YARD lines" }

  - name: coupon_discount
    trigger: "order_pricing evaluation"
    algorithm: tiered_pricing
    formula: |
      applied = coupons sorted by (priority ASC, created_at ASC)
      if len(applied) > 1: all MUST have stackable == true (else ERR_COUPON_NOT_STACKABLE at apply time)
      running = subtotal
      clearance_subtotal = sum of line_subtotal_cents where product.is_clearance == true
      discount = 0
      for c in applied:
        if running < c.min_basket_cents: skip c (ERR_COUPON_MIN_NOT_MET at apply time)
        if c.discount_type == PERCENT:
          base = c.excludes_clearance ? (running - clearance_subtotal) : running
          d = round_half_up(base * c.value)
        else:  # FIXED
          d = min(c.value, running)
        discount += d
        running -= d
      return discount
    input_set: "coupons currently applied to the order"
    constants: {}
    precision: "integer cents, round_half_up; PERCENT coupons applied before recomputing running total (pinned order)"

  - name: loyalty_tier
    trigger: "Order pickup (points/spend update); GET loyalty account"
    algorithm: threshold
    formula: |
      # forward_looking variant
      days_elapsed = max(1, days from Jan 1 of current year to clock now, inclusive)
      projected = spend_ytd_cents / days_elapsed * 365
      tier_forward = projected >= GOLD_CENTS ? GOLD : (projected >= SILVER_CENTS ? SILVER : BASIC)
      # chronological variant
      rolling = sum of PICKED_UP order final_total_cents in the last 365 days (>= now-365d, exclusive of older)
      tier_chronological = rolling >= GOLD_CENTS ? GOLD : (rolling >= SILVER_CENTS ? SILVER : BASIC)
    input_set: "PICKED_UP orders for the customer"
    constants:
      SILVER_CENTS: 50000
      GOLD_CENTS: 150000
    precision: "integer cents; boundary is >= (exactly SILVER_CENTS qualifies SILVER)"
    variants:
      - { name: forward_looking, when: "projection", difference: "annualizes YTD spend by elapsed days" }
      - { name: chronological, when: "rolling window", difference: "sums actual finalized spend over trailing 365 days" }

  - name: framing_quote
    trigger: "FramingOrder create"
    algorithm: tiered_pricing
    formula: |
      united_inches = width_in + height_in
      if united_inches <= 40: rate = SMALL_RATE_CENTS
      elif united_inches <= 80: rate = MED_RATE_CENTS
      else: rate = LARGE_RATE_CENTS
      perimeter_in = 2 * (width_in + height_in)
      quoted_price_cents = round_half_up(BASE_CENTS + rate * perimeter_in)
    input_set: "single FramingOrder dimensions"
    constants:
      BASE_CENTS: 2000
      SMALL_RATE_CENTS: 15
      MED_RATE_CENTS: 25
      LARGE_RATE_CENTS: 40
    precision: "integer cents, round_half_up"

  - name: special_order_deposit
    trigger: "SpecialOrder quote"
    algorithm: threshold
    formula: |
      line_value = quoted_unit_price_cents * quantity
      deposit_cents = round_half_up(line_value * DEPOSIT_PCT)
    input_set: "single SpecialOrder"
    constants:
      DEPOSIT_PCT: 0.50
    precision: "integer cents, round_half_up"

  - name: inventory_availability
    trigger: "OrderLine reserve/release; Order pickup; SpecialOrder receive"
    algorithm: aggregation
    formula: |
      reserved_yards = sum(requested_yards over OrderLines with status == RESERVED referencing this lot's product)
      available_yards = on_hand_yards - reserved_yards
    input_set: "RESERVED order lines for the product"
    constants: {}
    precision: "matches product sell_mode; invariant on_hand = available + reserved"

  - name: waitlist_promotion
    trigger: "WorkshopRegistration cancel; Workshop cancel"
    algorithm: chronological
    formula: |
      When a REGISTERED seat is released and registered_count < session.capacity:
        promote the WAITLISTED registration with the smallest created_at (ties: none; created_at is unique per row)
        promoted.status = REGISTERED; registered_count += 1
    input_set: "WAITLISTED registrations for the session"
    constants: {}
    precision: "created_at ASC ordering; never uses id"

  - name: loyalty_points_earned
    trigger: "Order pickup"
    algorithm: aggregation
    formula: |
      earned = floor(final_total_cents / POINTS_DIVISOR_CENTS)
      points_earned += earned
      points_balance = points_earned - points_redeemed
    input_set: "the picked-up order"
    constants:
      POINTS_DIVISOR_CENTS: 100
    precision: "integer floor; invariant points_balance = points_earned - points_redeemed"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and valid", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for this operation", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path resource ids exist, validated left-to-right", error_id: "ERR_ORDER_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_WORKSHOP_NOT_FOUND / ERR_SESSION_NOT_FOUND / ERR_REGISTRATION_NOT_FOUND / ERR_FRAMING_NOT_FOUND / ERR_SPECIAL_ORDER_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND", http_status: 404, applies_to: "all id-bearing endpoints" }
  - { priority: 4, category: business_referential, check: "body FK references resolve (product_id, session_id, order_id, etc.)", error_id: ERR_REFERENCED_ENTITY_NOT_FOUND, http_status: 404, applies_to: "create endpoints with body FKs" }
  - { priority: 5, category: state, check: "target resource in correct state for operation (OCC version checked here for coupon apply)", error_id: "ERR_INVALID_STATE / ERR_STALE_VERSION", http_status: 409, applies_to: "state transition + coupon apply endpoints" }
  - { priority: 6, category: business_temporal, check: "workshop session registration window open: clock now < session.starts_at; and coupon within [valid_from, valid_to)", error_id: "ERR_REGISTRATION_CLOSED / ERR_COUPON_EXPIRED", http_status: 422, applies_to: "POST /workshops/{id}/register, POST /orders/{id}/coupons" }
  - { priority: 7, category: business_constraint, check: "BY_YARD requested_yards is a positive multiple of product.min_cut_increment_yards", error_id: ERR_INVALID_CUT_INCREMENT, http_status: 422, applies_to: "POST /orders/{id}/lines" }
  - { priority: 8, category: business_constraint, check: "Room overlap: two WorkshopSessions in same room need >= room.cleanup_buffer_min gap (closed interval + buffer)", error_id: ERR_ROOM_CONFLICT, http_status: 409, applies_to: "POST /workshops/{id}/sessions" }
  - { priority: 9, category: business_constraint, check: "Customer time overlap: a customer's REGISTERED sessions cannot overlap; half-open [starts_at, ends_at), back-to-back allowed", error_id: ERR_CUSTOMER_SESSION_OVERLAP, http_status: 409, applies_to: "POST /workshops/{id}/register" }
  - { priority: 10, category: business_constraint, check: "coupon stackability: applying >1 coupon requires all stackable", error_id: ERR_COUPON_NOT_STACKABLE, http_status: 422, applies_to: "POST /orders/{id}/coupons" }
  - { priority: 11, category: business_fiscal, check: "coupon min_basket_cents met by current subtotal", error_id: ERR_COUPON_MIN_NOT_MET, http_status: 422, applies_to: "POST /orders/{id}/coupons" }
  - { priority: 12, category: business_fiscal, check: "sufficient inventory / loyalty points for the operation", error_id: "ERR_INSUFFICIENT_INVENTORY / ERR_INSUFFICIENT_POINTS", http_status: 409, applies_to: "POST /orders/{id}/submit, POST /orders/{id}/pay" }

