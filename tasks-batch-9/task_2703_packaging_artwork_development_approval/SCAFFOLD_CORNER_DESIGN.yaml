      - name: rejected_is_terminal_for_a_claim_from_either_direction
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors[ERR_CLAIM_STATE_INVALID]
          - state_machines.MarketingClaim.CLEARED_to_REJECTED
          - state_machines.MarketingClaim.DRAFT_to_REJECTED
          - state_machines.MarketingClaim.terminal_states
          - entities.MarketingClaim.fields.rejection_reason
        distinguishing_aspect: |
          One endpoint serves clearance, withdrawal and re-clearance, and REJECTED is the
          claim's only terminal state - reachable from DRAFT and from CLEARED. Both
          paths must then refuse a further clearance. The audit detail is the
          discriminator: a withdrawal from CLEARED RETAINS cleared_from_utc and
          cleared_until_utc for audit while setting rejection_reason, so an
          implementation that nulls the window on withdrawal loses the record of what
          was once legal, and one that treats REJECTED as re-clearable resurrects a
          retracted claim.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "MarketingClaim CLM-NAS-01 (US, NUTRIENT_CONTENT) is CLEARED for 2026-08-01 -> 2026-09-01 by u_legal, version 2, usage_count 0."
            - "MarketingClaim CLM-GF-01 (US, CONTENT) is still DRAFT, version 1, with cleared_from_utc and cleared_until_utc null."
            - "No ArtworkVersion references either claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /marketing-claims"
              payload: {claim_code: "CLM-NAS-01", claim_text: "NO ADDED SUGAR", claim_type: "NUTRIENT_CONTENT", market_code: "US", substantiation_ref: "DOSSIER-NAS-2026-01"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { claim_a: "$.data.id" }
            - call: "POST /marketing-claims/${claim_a}/clearance"
              payload: {decision: "CLEARED", cleared_from_utc: "2026-08-01T00:00:00Z", cleared_until_utc: "2026-09-01T00:00:00Z"}
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "POST /marketing-claims"
              payload: {claim_code: "CLM-GF-01", claim_text: "GLUTEN FREE", claim_type: "CONTENT", market_code: "US", substantiation_ref: "DOSSIER-NAS-2026-01"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { claim_b: "$.data.id" }
          trigger:
            - call: "POST /marketing-claims/${claim_a}/clearance"
              payload: {decision: "REJECTED", rejection_reason: "Substantiation dossier retracted by the supplier."}
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "POST /marketing-claims/${claim_a}/clearance"
              payload: {decision: "CLEARED", cleared_from_utc: "2026-09-01T00:00:00Z", cleared_until_utc: "2026-10-01T00:00:00Z"}
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "POST /marketing-claims/${claim_b}/clearance"
              payload: {decision: "REJECTED", rejection_reason: "Never substantiated; abandoned before review."}
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "POST /marketing-claims/${claim_b}/clearance"
              payload: {decision: "CLEARED", cleared_from_utc: "2026-08-01T00:00:00Z", cleared_until_utc: "2026-09-01T00:00:00Z"}
              as: LegalReviewer
              as_user_id: "u_legal"
          assert:
            - "the withdrawal of CLM-NAS-01 returns 200 with data.legal_status == REJECTED, a non-empty data.rejection_reason and data.cleared_by_user_id == u_legal"
            - "that row still reports cleared_from_utc == 2026-08-01T00:00:00Z and cleared_until_utc == 2026-09-01T00:00:00Z - retained for audit"
            - "re-clearing CLM-NAS-01 returns 409 with data.error_id == ERR_CLAIM_STATE_INVALID and its legal_status stays REJECTED"
            - "the withdrawal of CLM-GF-01 returns 200 with data.legal_status == REJECTED and cleared_from_utc still null"
            - "clearing CLM-GF-01 returns 409 with data.error_id == ERR_CLAIM_STATE_INVALID"
            - "GET /marketing-claims/${claim_a} reports version == 3 and GET /marketing-claims/${claim_b} reports version == 2 - the two refusals bumped nothing"

      - name: depletion_weeks_must_ascend_and_a_scrap_split_must_conserve_every_remaining_unit
        claim_type: violation_to_error
        grounds:
          - validations[priority=54]
          - validations[priority=51]
          - errors[ERR_DEPLETION_RECORD_OUT_OF_ORDER]
          - errors[ERR_UNIT_CONSERVATION_VIOLATION]
          - calculations.runout_projection.variants.CHRONOLOGICAL
          - calculations.changeover_writeoff_cost
          - entities.InventoryRunout.fields.depletion_records
        distinguishing_aspect: |
          Rule 54 has two clauses and both are probed: descending weeks WITHIN one
          submitted array, and a re-submitted week that is not strictly greater than the
          stored maximum (equal is not greater). Rule 51 then has two clauses of its
          own: a SCRAP split of 13000 + 1 overshoots remaining_qty 13000 by one unit,
          and a RUNOUT disposition demands remaining_qty == 0. The accepted 10000 + 3000
