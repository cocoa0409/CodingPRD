      - name: stale_claim_version_on_amendment_returns_412
        claim_type: OCC stale-version
        grounds:
          - concurrency_rules[claim-amend-stale-claim]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on LossClaim.version: after one amendment supersedes a claim (version bumps to 2 and status is AMENDED), a second amendment carrying the original captured version is rejected 412 — the version check fires before the state check because OCC is a precondition of the write itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier B15 ACTIVE; consumer Tom with 1 claim; the claim's version captured, one amendment already applied."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_b15
              call: "POST /carriers"
              payload: { legal_name: "Temple Mutual", naic_code: "90025" }
              as: PlatformAdmin
              captures: { cb15_id: $.data.id }
            - &k_consumer_tom
              call: "POST /consumers"
              payload: { full_name: "Tom Tally", date_of_birth: "1979-01-08", address_line: "2 Tamarind Trl, Temple TX", driver_license_number: "TOM-1" }
              as: PlatformAdmin
              captures: { ctom_id: $.data.id }
            - call: "POST /carriers/${cb15_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${ctom_id}", policy_number: "PT-15", claim_number: "T15-1", loss_date: "2025-05-25", loss_type: "PROPERTY", cause_of_loss_code: "TT1", paid_amount_cents: 51000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cb15_id}"
            - call: "GET /consumers/${ctom_id}/claims"
              payload: { status: "ACTIVE" }
              as: ExchangeComplianceOfficer
              captures: { tom_claim: "$.data[0].id", tom_claim_v: "$.data[0].version" }
            - call: "POST /claims/${tom_claim}/amendments"
              payload: { loss_date: "2025-05-25", loss_type: "PROPERTY", cause_of_loss_code: "TT1", paid_amount_cents: 52000, claim_status_code: "CLOSED_WITH_PAYMENT", expected_claim_version: "${tom_claim_v}" }
              as: CarrierDataSteward
              as_user_id: "${cb15_id}"
          trigger:
            - call: "POST /claims/${tom_claim}/amendments"
              payload: { loss_date: "2025-05-25", loss_type: "PROPERTY", cause_of_loss_code: "TT1", paid_amount_cents: 53000, claim_status_code: "CLOSED_WITH_PAYMENT", expected_claim_version: "${tom_claim_v}" }
              as: CarrierDataSteward
              as_user_id: "${cb15_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "the original claim remains AMENDED and exactly one replacement exists (amendment_of_id == ${tom_claim})"

      - name: success_envelope_and_pagination_defaults_on_lists
        claim_type: response envelope
        grounds:
          - response_envelope
          - endpoints.GET_/consumers
        distinguishing_aspect: "A bare list GET applies the fixed pagination defaults: limit 10, offset 0, total_count over the whole collection, has_more false for a 2-row result."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Consumers Ula and Ute exist."
          setup_api_calls:
            - *k_clock
            - &k_consumer_ula
              call: "POST /consumers"
              payload: { full_name: "Ula Urban", date_of_birth: "1990-03-03", address_line: "3 Ulm St, Austin TX", driver_license_number: "ULA-1" }
              as: PlatformAdmin
              captures: { cula_id: $.data.id }
            - &k_consumer_ute
              call: "POST /consumers"
              payload: { full_name: "Ute Utley", date_of_birth: "1991-04-04", address_line: "4 Ulm St, Austin TX", driver_license_number: "UTE-1" }
              as: PlatformAdmin
              captures: { cute_id: $.data.id }
          trigger:
            - call: "GET /consumers"
              payload: {}
              as: ExchangeComplianceOfficer
          assert:
            - "the response status is 200 and response_type == array"
            - "the response returns exactly 2 rows with total_count == 2 and has_more == false"
            - "the applied limit defaults to 10 and offset defaults to 0"
            - "meta.api_request_id and meta.api_request_timestamp are present"

  # ===========================================================================
  - section: consistency
    instances:
      - name: inquiry_response_reflects_all_writes_immediately
        claim_type: immediate consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/carriers/{carrierId}/inquiries
        distinguishing_aspect: "Consistency model is immediate: the 201 inquiry response already carries the resolved matched_consumer_id, all three match grades, match_score, match_disposition, and report_id; a follow-up GET of the report shows the fully computed risk scores with no reconciliation lag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier B16 ACTIVE; consumer Val with 1 claim of 100000 cents."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_b16
              call: "POST /carriers"
              payload: { legal_name: "Victoria Mutual", naic_code: "90026" }
              as: PlatformAdmin
              captures: { cb16_id: $.data.id }
            - &k_consumer_val
              call: "POST /consumers"
              payload: { full_name: "Val Vann", date_of_birth: "1984-11-17", address_line: "6 Vine St, Victoria TX", driver_license_number: "VAL-1" }
              as: PlatformAdmin
              captures: { cval_id: $.data.id }
            - call: "POST /carriers/${cb16_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cval_id}", policy_number: "PV-16", claim_number: "V16-1", loss_date: "2025-02-14", loss_type: "COLLISION", cause_of_loss_code: "VV1", paid_amount_cents: 100000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cb16_id}"
          trigger:
            - call: "POST /carriers/${cb16_id}/inquiries"
              payload: { subject_name: "Val Vann", subject_dob: "1984-11-17", subject_address: "6 Vine St, Victoria TX", subject_driver_license: "VAL-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${cb16_id}"
              captures: { inq_val: $.data.id, rep_val: $.data.report_id, val_cons: $.data.matched_consumer_id }
            - call: "GET /reports/${rep_val}"
              payload: {}
              as: CarrierUnderwriter
              as_user_id: "${cb16_id}"
          assert:
            - "the inquiry response itself carries matched_consumer_id == ${cval_id}, match_disposition == PROBABLE, and a non-null report_id — no polling needed"
            - "QuoteInquiry.${inq_val}.match_score == 6050 (EXACT individual 5000 + EXACT address 1000 + 1 loss x 50; 6050 >= 5500, < 7000)"
            - "the immediate GET of LossHistoryReport.${rep_val} shows risk_score_certainty == 60.50, risk_score_count == 61 (1 x 60.50 round_half_up), risk_score_premium_weighted_cents == 60500 (100000 x 60.50 / 100)"
