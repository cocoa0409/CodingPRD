              as: Member
              as_user_id: "${m1_id}"
              captures: { subX_id: $.data.id }
            - call: "POST /submissions"
              payload: { member_id: "${m2_id}", specification_id: "${s2_id}", device_model: "BL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: false, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "BB:00:00:01" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { subA_id: $.data.id }
            - call: "POST /submissions"
              payload: { member_id: "${m2_id}", specification_id: "${s2_id}", device_model: "BL-200", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_UNSIGNED", attestation_key_fingerprint: "BB:00:00:02" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { subB_id: $.data.id }
            - call: "POST /submissions"
              payload: { member_id: "${m2_id}", specification_id: "${s2_id}", device_model: "BL-300", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "BB:00:00:03" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { subC_id: $.data.id }
          trigger:
            - call: "POST /submissions/${subX_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { err_ip_scope: $.data.error_id }
            - call: "POST /submissions/${subA_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
              captures: { err_no_secure_boot: $.data.error_id }
            - call: "POST /submissions/${subB_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
              captures: { err_unsigned_ota: $.data.error_id }
            - call: "POST /submissions/${subC_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /submissions/${subC_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "CONF1"
            - call: "POST /submissions/${subC_id}/return-for-info"
              payload: { reason: "Attestation key provenance evidence missing" }
              as: ConformanceReviewer
              as_user_id: "CONF1"
            - call: "POST /submissions/${subC_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /submissions/${subC_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "CONF2"
            - call: "POST /submissions/${subC_id}/security-decision"
              payload: { decision: "APPROVE", secure_boot_verified: false, verified_firmware_update_capability: "OTA_UNSIGNED" }
              as: SecurityReviewer
              as_user_id: "CONF1"
              captures: { err_segregation: $.data.error_id }
            - call: "POST /submissions/${subC_id}/security-decision"
              payload: { decision: "APPROVE", secure_boot_verified: false, verified_firmware_update_capability: "OTA_UNSIGNED" }
              as: SecurityReviewer
              as_user_id: "SEC1"
              captures: { err_verified_baseline: $.data.error_id }
            - call: "POST /submissions/${subC_id}/security-decision"
              payload: { decision: "APPROVE", secure_boot_verified: false, verified_firmware_update_capability: "OTA_SIGNED" }
              as: SecurityReviewer
              as_user_id: "SEC1"
              captures: { err_attestation: $.data.error_id }
            - call: "POST /submissions/${subC_id}/security-decision"
              payload: { decision: "APPROVE", secure_boot_verified: true, verified_firmware_update_capability: "OTA_SIGNED" }
              as: SecurityReviewer
              as_user_id: "SEC1"
            - call: "GET /submissions/${subC_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /members/${m2_id}/credit-ledger"
              payload: {}
              as: ProgramAdmin
          assert:
            - "M1's submit returns 409 ERR_IP_COMMITMENT_REQUIRED - its ip_scope_specification_id names S1 while the submission is pinned to S2; the declarations themselves are impeccable"
            - "${subA_id} (declared_secure_boot false) and ${subB_id} (OTA_UNSIGNED) both return 422 ERR_SECURITY_BASELINE_NOT_MET on submit, because S2 is SB2; both stay in state \"DRAFT\" with fee_escrowed_cents 0"
            - "${subC_id} submits cleanly: certification_fee_cents == 185000 (LIGHTING 120000 + 1 x 15000 + SB2 50000) and fee_escrowed_cents == 185000"
            - "The security decision carrying X-User-ID CONF1 returns 409 ERR_SEGREGATION_OF_DUTIES - priority 24 outranks the baseline and attestation rules that the same body also violates"
            - "The same body under SEC1 returns 422 ERR_SECURITY_BASELINE_NOT_MET (verified_firmware_update_capability must be OTA_SIGNED on SB2) - priority 27 outranks 28"
            - "With OTA_SIGNED but secure_boot_verified false the decision returns 422 ERR_SECURE_BOOT_NOT_VERIFIED - priority 28, the last of the four"
            - "Until the fourth attempt succeeds, security_review_state is \"PENDING\", secure_boot_verified is null and security_reviewer_user_id is null - no refused attempt persisted anything"
            - "The accepted decision returns 200 with security_review_state \"APPROVED\", secure_boot_verified true, verified_firmware_update_capability \"OTA_SIGNED\", security_reviewer_user_id \"SEC1\"; state stays \"IN_REVIEW\" because the conformance axis is still PENDING"
            - "revision_round == 1 and conformance_reviewer_user_id == \"CONF1\" (written by return-for-info, not overwritten by the second start-review); fee_escrowed_cents is still 185000 - the resubmit did not escrow twice"
            - "M2's ledger reports escrowed_credit_cents 185000 and balance_cents 815000 - the two refused submits contributed nothing"

      - name: expired_accreditation_outranks_the_device_type_authorization_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=29]
          - validations[priority=30]
          - endpoints[POST /test-sessions]
          - endpoints[POST /test-laboratories/{laboratory_id}/accreditation-decision]
        distinguishing_aspect: >
          One laboratory is authorized for LIGHTING only and its accreditation expires 2026-09-10.
          Booking a THERMOSTAT plan on it before expiry returns ERR_DEVICE_TYPE_NOT_AUTHORIZED; the
          identical request after the clock passes the expiry returns ERR_ACCREDITATION_EXPIRED, because
          priority 29 is evaluated first. An AUTHORIZE decision on an already-expired laboratory is
          refused by the same rule, and the comparison is strict (expiry is not "at or after now").
        test_recipe:
          setup:
