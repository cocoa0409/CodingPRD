      - name: cycle_lifecycle_rejects_empty_unmapped_ambiguous_and_terminal_transitions
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CYCLE_HAS_NO_ENTRIES]
          - errors[ERR_CYCLE_HAS_NO_MAPPED_ENTRIES]
          - errors[ERR_INVALID_CYCLE_STATE]
          - errors[ERR_INVALID_ENTRY_STATE]
          - errors[ERR_CROSSWALK_TARGET_NOT_FOUND]
          - errors[ERR_CROSSWALK_TARGET_AMBIGUOUS]
          - validations[priority=28]
          - validations[priority=29]
          - validations[priority=41]
          - state_machines.CodeUpdateCycle
          - state_machines.CodeUpdateEntry
        distinguishing_aspect: "Walks every rejection edge of the code-update pair in one chain. The priority-13 rank is split by target entity, so a disposition call can only raise ERR_INVALID_ENTRY_STATE from the ladder — the cycle-status guard on that same call comes from the §1.2 precondition, so a PENDING entry of a LOADED cycle still fails with ERR_INVALID_CYCLE_STATE. Crosswalk resolution distinguishes zero matches (404) from two matches (409) on the same MAP action, and CANCEL leaves a terminal cycle that rejects both further lifecycle actions and new entries."
