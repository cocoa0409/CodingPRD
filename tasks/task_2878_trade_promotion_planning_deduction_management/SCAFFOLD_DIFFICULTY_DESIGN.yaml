  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_posture_state_outranks_allocation_balance_fiscal
        conflicting_rules: [42, 95]
        expected_error: ERR_ALLOCATION_POSTURE_RESTRICTED
        grounds:
          - validations.priority_42
          - validations.priority_95
          - errors.ERR_ALLOCATION_POSTURE_RESTRICTED
          - errors.ERR_ALLOCATION_BALANCE_INSUFFICIENT
        distinguishing_aspect: |
          One approve call violates a state rule at priority 42 (category state, 409) and a
          fiscal-capacity rule at priority 95 (category business_fiscal, 422) at the same time:
          the allocation's posture is RESTRICTED because a sibling promotion went OVERSPENT, and
          its available_amount is 0.00 against a planned_total_spend of 2250.00. Only the
          priority-42 error may be returned, with HTTP 409 rather than 422 — an implementation
          that evaluates fiscal capacity first, or that checks the cheap arithmetic before the
          state read, returns 422 ERR_ALLOCATION_BALANCE_INSUFFICIENT and fails. The
          business_safety rule at priority 53 is also violated (the overspend cascade put the
          customer on CREDIT_HOLD), which makes the ladder a three-way test in which 42 must
          still win.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03."
            - "One program, brand, customer, and one APPROVED allocation with planned_amount 2500.00 and planned_incremental_units 20000 — deliberately just large enough for one promotion."
            - "Promotion X: one TPR tactic of 2000 cases at rate_per_case 1.25, planned_total_spend 2500.00, APPROVED, which consumes the whole allocation (available_amount 0.00)."
            - "Promotion Y: created BEFORE the posture turns (priority 42 also blocks creation), one TPR tactic of 1800 cases at 1.25, planned_total_spend 2250.00, submitted and left in SUBMITTED."
            - "Promotion X is driven OVERSPENT: it is made LIVE and a CONSUMPTION accrual of 2100 cases x 1.25 = 2625.00 gives spend_ratio 1.0500, so the allocation's overspend_event_count becomes 1 and posture becomes RESTRICTED."
