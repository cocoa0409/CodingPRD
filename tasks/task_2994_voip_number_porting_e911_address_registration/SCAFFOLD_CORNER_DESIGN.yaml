          trigger:
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "44 TEASEL TERRACE", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: E911Validator
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "44 TEASEL TERRACE", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
