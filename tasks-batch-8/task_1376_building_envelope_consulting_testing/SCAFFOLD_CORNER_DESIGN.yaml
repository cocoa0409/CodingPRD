  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: invoice_volume_tier_boundary_at_exactly_2m
        claim_type: correct_result
        grounds:
          - "calculations.invoice_total_calc"
        distinguishing_aspect: "Volume tier engages at subtotal_cents >= 2000000 inclusive: subtotal exactly 2000000 forces effective discount 10% even with declared 0% -> total 1800000; subtotal 1999999 keeps declared 0% -> total 1999999."
        test_recipe:
          setup: ["engagement E (rate 14000) and E2 (rate 15000) both IN_PROGRESS; invoice on E with 100h + 600000 expense (subtotal exactly 2000000, discount 0); invoice on E2 below tier: 10h + 500000 expense (subtotal 650000, discount 5)"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EI", client_name: "C", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 14000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements"
              payload: { name: "EI2", client_name: "C", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng2_id: $.data.id }
            - call: "POST /engagements/${eng2_id}/activate"
              payload: {}
              as: Principal
          trigger:
            - call: "POST /engagements/${eng_id}/invoices"
              payload: { labor_hours: 100, expense_cents: 600000, discount_pct: 0 }
              as: Consultant
              captures: { sub1: $.data.subtotal_cents, tot1: $.data.total_cents }
            - call: "POST /engagements/${eng2_id}/invoices"
              payload: { labor_hours: 10, expense_cents: 500000, discount_pct: 5 }
              as: Consultant
              captures: { sub2: $.data.subtotal_cents, tot2: $.data.total_cents }
          assert:
            - "sub1 == 2000000 and tot1 == 1800000 (tier floor 10% applied at exactly-threshold subtotal)"
            - "sub2 == 650000 and tot2 == 617500 (declared 5% honored below tier)"
      - name: invoice_labor_rounding_half_up
        claim_type: precision
        grounds:
          - "calculations.invoice_total_calc"
        distinguishing_aspect: "Labor multiplication rounds half-up to cents before expenses are added: 7.5 hours at 13333 cents = 99997.5 -> 99998 (not 99997)."
        test_recipe:
          setup: ["engagement IN_PROGRESS with rate 13333"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "ER2", client_name: "C", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 13333 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
          trigger:
            - call: "POST /engagements/${eng_id}/invoices"
              payload: { labor_hours: 7.5, expense_cents: 0, discount_pct: 0 }
              as: Consultant
              captures: { sub: $.data.subtotal_cents, tot: $.data.total_cents }
          assert:
            - "sub == 99998 (round_half_up(99997.5))"
            - "tot == 99998"
      - name: risk_score_severity_deltas_accumulate
        claim_type: correct_result
        grounds:
          - "calculations.risk_score_update"
        distinguishing_aspect: "Verify deltas accumulate per severity in application order: from risk 100, verifying three CRITICAL anomalies lands at exactly 55 (100-15-15-15), and the presence of a VERIFIED CRITICAL anomaly flips posture to FROZEN — asserted twice via independent reads."
        test_recipe:
          setup: ["engagement IN_PROGRESS; survey completed; three CRITICAL anomalies created and verified in sequence"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EK", client_name: "C", fee_cap_cents: 90000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
