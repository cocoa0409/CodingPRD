              as: ShowSecretary
          trigger:
            - call: "GET /rings/${ring_a_id}"
              payload: {}
              as: RingMaster
              captures: { ring_v1: $.data.version }
            - call: "POST /ring-slots"
              payload: { ring_id: "${ring_a_id}", class_id: "${class101_id}", start_utc: "2026-09-10T16:00:00Z", expected_ring_version: "${ring_v1}" }
              as: RingMaster
              captures: { slot_late_id: $.data.id, slot_late_order: $.data.order_index }
