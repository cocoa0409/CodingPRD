# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3054_independent_broker_dealer_affiliation_models_advisor_payout
# Nine §0.5 rules, >= 2 instances each (>= 18 instances).
# Every setup_api_calls / trigger entry is a structured call object.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: grid_rate_provisional_vs_final_on_tier_crossing
        grounds:
          - calculations.payout_grid_rate
          - calculations.payout_grid_rate.variants.provisional_grid_rate
          - calculations.payout_grid_rate.variants.final_grid_rate
          - calculations.period_true_up_amount
          - state_machines.AdvisorPayoutLine.RELEASED_to_TRUE_UP_APPLIED
        distinguishing_aspect: "The same five revenue entries pay 2,381,000 on the provisional projected basis of 120,000,000 and 2,081,000 on the final cumulative basis, so the true-up is the signed 2,081,000 - 2,381,000 == -300,000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Elevated branch SUP-1 fully supervised. Advisor A-1001 is IC with a fully repaid loan."
            - "Five DRAFT revenue entries dated in September 2026 totalling 3,000,000 cents gross."
            - "Payout period 2026/9 index 1 is OPEN and a DRAFT payout line carries projected_annual_production_cents 120,000,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_sup_id: $.data.id, b_sup_v: $.data.version }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1001", crd_number: "1234567", full_name: "Iris Calloway", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 400000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a1_id: $.data.id, a1_v: $.data.version }
            - call: "POST /branch-supervisor-enrollments"
              payload: { branch_code: "SUP-1", advisor_code: "A-1001", effective_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /branch-supervisor-enrollments/${e1_id}/state"
              payload: { to_status: "ENROLLED", expected_branch_version: "${b_sup_v}" }
              as: PlatformAdmin
              captures: { b_sup_v2: $.data.version }
            - call: "POST /advisor-links"
              payload: { advisor_code: "A-1001", branch_code: "SUP-1", is_supervisor: true, assignment_type: "PRIMARY" }
              as: AdvisorOps
              as_user_id: "${a1_id}"
              captures: { l1_id: $.data.id, b_sup_v3: $.data.version }
            - call: "POST /payout-loans"
              payload: { advisor_code: "A-1001", principal_cents: 500000, amortization_rate_bps: 2000, forgiveness_milestone_pct: 90 }
              as: PlatformAdmin
              captures: { ln1_id: $.data.id }
            - call: "POST /advisors/${a1_id}/enrollment"
              payload: { expected_advisor_version: "${a1_v}" }
              as: AdvisorOps
              as_user_id: "${a1_id}"
              captures: { a1_v2: $.data.version }
            - call: "POST /advisors/${a1_id}/affiliation"
              payload: { affiliation_model: "IC", expected_advisor_version: "${a1_v2}" }
              as: AdvisorOps
              as_user_id: "${a1_id}"
              captures: { a1_v3: $.data.version }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1001", account_number: "A-1001-EQ", account_type: "BROKERAGE", balance_cents: 10000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a1_id}"
              captures: { ac_eq_id: $.data.id }
            - call: "POST /payout-periods"
              payload: { branch_code: "SUP-1", year: 2026, month: 9, period_index: 1 }
              as: BranchManager
              captures: { p1_id: $.data.id, b_sup_v4: $.data.version }
            - call: "POST /advisors/${a1_id}/payout-lines"
              payload: { payout_period_id: "${p1_id}", projected_annual_production_cents: 120000000 }
              as: AdvisorOps
              as_user_id: "${a1_id}"
              captures: { pl1_id: $.data.id }
            - call: "POST /revenue-entries"
              payload: { advisor_code: "A-1001", account_id: "${ac_eq_id}", product_type: "EQUITY", gross_commission_cents: 800000, production_date: "2026-09-03" }
              as: AdvisorOps
              as_user_id: "${a1_id}"
            - call: "POST /revenue-entries"
              payload: { advisor_code: "A-1001", account_id: "${ac_eq_id}", product_type: "MUTUAL_FUND", gross_commission_cents: 600000, production_date: "2026-09-08" }
              as: AdvisorOps
              as_user_id: "${a1_id}"
            - call: "POST /revenue-entries"
              payload: { advisor_code: "A-1001", account_id: "${ac_eq_id}", product_type: "ADVISORY", gross_commission_cents: 400000, production_date: "2026-09-12" }
              as: AdvisorOps
              as_user_id: "${a1_id}"
            - call: "POST /revenue-entries"
              payload: { advisor_code: "A-1001", account_id: "${ac_eq_id}", product_type: "EQUITY", gross_commission_cents: 900000, production_date: "2026-09-20" }
              as: AdvisorOps
              as_user_id: "${a1_id}"
            - call: "POST /revenue-entries"
              payload: { advisor_code: "A-1001", account_id: "${ac_eq_id}", product_type: "BROKERAGE_TRAIL", gross_commission_cents: 300000, production_date: "2026-09-26" }
              as: AdvisorOps
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /payout-periods/${p1_id}/state"
              payload: { to_state: "CLOSED", expected_branch_version: "${b_sup_v4}" }
              as: BranchManager
              captures: { b_sup_v5: $.data.version }
            - call: "POST /payout-periods/${p1_id}/true-up"
              payload: { expected_branch_version: "${b_sup_v5}" }
              as: BranchManager
              captures: { tu_amt: $.data.true_up_amount_cents }
          assert:
            - "the posted payout line release_amount_cents == 2081000"
            - "the posted true_up_amount_cents == -300000"
            - "PayoutPeriod.${p1_id}.period_gross_cents == 3000000 and period_payout_cents == 2081000"
            - "Advisor.${a1_id}.ytd_payout_earned_cents == 2081000"
            - "the first entry (800000 EQUITY at cumulative 800000) holds provisional rate 8000 and final rate 7000, and the fourth entry (900000 EQUITY at cumulative 2700000) holds provisional rate 8000 and final rate 7000"

      - name: retention_credit_cap_sweep_is_an_account_ordered_waterfall
        grounds:
          - calculations.retention_credit
          - calculations.retention_credit.constants.RETENTION_CREDIT_CAP_BPS
          - validations[priority=12]
          - state_machines.Account.PENDING_TRANSFER_to_RETENTION_CONTESTED
        distinguishing_aspect: "The same four AccountRetention rows settle at 600,000 when the cap is swept by account_number and at 480,000 when the cap is instead applied per row, so the recorded TransitionRecord.settled_amount_cents differs for identical row inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Elevated branch SUP-1 supervised. Advisor A-1002 is IC, ACTIVE, DEPARTING, with 4 frozen accounts."
            - "Three AccountRetention rows are POSTED (2,000,000 / 1,500,000 / 1,000,000); a fourth frozen account has no retention row yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_sup_id: $.data.id, b_sup_v: $.data.version }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1002", crd_number: "1234568", full_name: "Noor Beaumont", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 100000000, book_transferred_cents: 80000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a2_id: $.data.id, a2_v: $.data.version }
            - call: "POST /branch-supervisor-enrollments"
              payload: { branch_code: "SUP-1", advisor_code: "A-1002", effective_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { e2_id: $.data.id }
            - call: "POST /branch-supervisor-enrollments/${e2_id}/state"
              payload: { to_status: "ENROLLED", expected_branch_version: "${b_sup_v}" }
              as: PlatformAdmin
              captures: { b_sup_v2: $.data.version }
            - call: "POST /advisor-links"
              payload: { advisor_code: "A-1002", branch_code: "SUP-1", is_supervisor: true, assignment_type: "PRIMARY" }
              as: AdvisorOps
              as_user_id: "${a2_id}"
              captures: { l2_id: $.data.id, b_sup_v3: $.data.version }
            - call: "POST /payout-loans"
              payload: { advisor_code: "A-1002", principal_cents: 400000, amortization_rate_bps: 2000, forgiveness_milestone_pct: 50 }
              as: PlatformAdmin
              captures: { ln2_id: $.data.id }
            - call: "POST /advisors/${a2_id}/enrollment"
              payload: { expected_advisor_version: "${a2_v}" }
              as: AdvisorOps
              as_user_id: "${a2_id}"
              captures: { a2_v2: $.data.version }
            - call: "POST /advisors/${a2_id}/affiliation"
              payload: { affiliation_model: "IC", expected_advisor_version: "${a2_v2}" }
              as: AdvisorOps
              as_user_id: "${a2_id}"
              captures: { a2_v3: $.data.version }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1002", account_number: "A-3001", account_type: "BROKERAGE", balance_cents: 4000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a2_id}"
              captures: { ac_r1_id: $.data.id }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1002", account_number: "A-3002", account_type: "BROKERAGE", balance_cents: 3000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a2_id}"
              captures: { ac_r2_id: $.data.id }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1002", account_number: "A-3003", account_type: "BROKERAGE", balance_cents: 2000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a2_id}"
              captures: { ac_r3_id: $.data.id }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1002", account_number: "A-3004", account_type: "BROKERAGE", balance_cents: 3000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a2_id}"
              captures: { ac_r4_id: $.data.id }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1002", account_number: "A-3005", account_type: "BROKERAGE", balance_cents: 5000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a2_id}"
              captures: { ac_r5_id: $.data.id }
            - call: "POST /payout-periods"
              payload: { branch_code: "SUP-1", year: 2026, month: 9, period_index: 1 }
              as: BranchManager
              captures: { p2_id: $.data.id, b_sup_v4: $.data.version }
            - call: "POST /advisors/${a2_id}/book-transfer"
              payload: { expected_advisor_version: "${a2_v3}" }
              as: AdvisorOps
              as_user_id: "${a2_id}"
            - call: "GET /advisors/${a2_id}"
              payload: {}
              as: AdvisorOps
              as_user_id: "${a2_id}"
              captures: { a2_v4: $.data.version }
            - call: "POST /accounts/${ac_r5_id}/transfer/confirm"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /transitions"
              payload: { advisor_code: "A-1002", payout_period_id: "${p2_id}", expected_advisor_version: "${a2_v4}" }
              as: BranchManager
              captures: { t2_id: $.data.id, a2_v5: $.data.version }
            - call: "POST /transitions/${t2_id}/retention/contest"
              payload: { account_id: "${ac_r1_id}", retention_rate_bps: 500 }
              as: BranchManager
              captures: { rr1_id: $.data.id }
            - call: "POST /transitions/${t2_id}/retention/contest"
              payload: { account_id: "${ac_r2_id}", retention_rate_bps: 500 }
              as: BranchManager
              captures: { rr2_id: $.data.id }
            - call: "POST /transitions/${t2_id}/retention/contest"
              payload: { account_id: "${ac_r3_id}", retention_rate_bps: 500 }
              as: BranchManager
              captures: { rr3_id: $.data.id }
          trigger:
            - call: "POST /transitions/${t2_id}/retention/contest"
              payload: { account_id: "${ac_r4_id}", retention_rate_bps: 500 }
              as: BranchManager
              captures: { rr4_id: $.data.id, rr4_credit: $.data.credit_amount_cents }
          assert:
            - "the fourth POSTED retention row credit_amount_cents == 150000"
            - "GET /transitions/${t2_id}/retention-rows returns 4 rows whose credit_amount_cents sum to 600000"
            - "TransitionRecord.${t2_id}.settled_amount_cents == 600000 and accounts_in_contest_count == 4"
            - "the four rows carry credit_amount_cents 200000, 150000, 100000 and 150000 in account_number order"
            - "had the cap instead been applied per row as min(row, cap) the sum would be 480000, so 600000 distinguishes the waterfall sweep from the per-row clip"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: per_entry_rounding_order_in_period_release
        grounds:
          - calculations.period_release_amount
          - calculations.period_release_amount.constants.ROUNDING_MODE
          - calculations.payout_grid_rate
          - state_machines.AdvisorPayoutLine.DRAFT_to_RELEASED
        distinguishing_aspect: "Rounding each revenue entry then summing yields 1250003 while summing the three entries and rounding once yields 1250002, a one-cent divergence that pins rule 2 mode (b) on the release aggregation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Elevated branch SUP-1 supervised. Advisor A-1003 is IC and ACTIVE."
            - "Three DRAFT entries chosen so each line has a fractional cent: 700001 EQUITY, 650001 MUTUAL_FUND, 450001 ADVISORY, all dated September 2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_sup_id: $.data.id, b_sup_v: $.data.version }
