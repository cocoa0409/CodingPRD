scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: due_date_minimum_vs_recommended_diverge
        grounds:
          - calculations.schedule_next_due
          - entities.ScheduleEvaluation.fields.antigen_results
        distinguishing_aspect: >
          For a patient with one valid DTAP dose, schedule_next_due's minimum_interval
          variant yields next_valid_due_date = dose1 + (min_interval-grace) while the
          recommended_age variant yields next_recommended_due_date = dose1 + min_interval;
          the two due dates differ by exactly grace_period_days (4) — dual-variant on the
          ScheduleEvaluation/Patient domain.
        test_recipe:
          setup:
            - "Clock 2026-01-10. One ACTIVE product DTAP (doses_in_series 5, min_age 42, recommended_age 60, min_interval 28, grace 4)."
            - "Provider authorized for DTAP, one lot valid 2024..2027, capacity 50."
            - "Patient dob 2025-11-01 (so the 2026-01-01 dose is age-valid) with one valid DTAP dose administered 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "DTAP", antigen: "DTAP", doses_in_series: 5, min_age_days: 42, recommended_age_days: 60, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { dtap_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic A", vfc_pin: "PIN-A", authorized_product_codes: ["DTAP"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${dtap_id}", lot_number: "L1", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child One", date_of_birth: "2025-11-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2026-01-01" }
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /patients/${pat_id}/evaluations"
              payload: { as_of_date: "2026-01-10" }
              as: ImmunizationRegistrar
              captures: { eval_id: $.data.id }
          assert:
            - "ScheduleEvaluation.${eval_id}.antigen_results[antigen=DTAP].next_valid_due_date == 2026-01-25"
            - "ScheduleEvaluation.${eval_id}.antigen_results[antigen=DTAP].next_recommended_due_date == 2026-01-29"

      - name: completeness_pct_vs_certificate_type_diverge
        grounds:
          - calculations.compliance_completeness
          - entities.SchoolComplianceCertificate.fields.certificate_type
        distinguishing_aspect: >
          On the SchoolComplianceCertificate domain (a different entity from due-date
          scheduling), the completeness_pct (50.00) and the categorical certificate_type
          (CONDITIONAL) are two valid readings of the same evaluation; certificate_type is
          driven by overall_status not by the numeric percentage.
        test_recipe:
          setup:
            - "Clock 2026-01-10. One ACTIVE product MMR2 (doses_in_series 2, min_age 0, recommended 0, min_interval 28, grace 4)."
            - "Patient dob 2025-12-01 with one valid MMR2 dose on 2026-01-01; second dose not yet due (next_valid_due 2026-01-25 > as_of)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "MMR2", antigen: "MMR", doses_in_series: 2, min_age_days: 0, recommended_age_days: 0, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { mmr_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic B", vfc_pin: "PIN-B", authorized_product_codes: ["MMR2"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${mmr_id}", lot_number: "LM", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child Two", date_of_birth: "2025-12-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2026-01-01" }
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /patients/${pat_id}/evaluations"
              payload: { as_of_date: "2026-01-10" }
              as: ImmunizationRegistrar
              captures: { eval_id: $.data.id, pv: $.data.version }
          assert:
            - "ScheduleEvaluation.${eval_id}.completeness_pct == 50.00"
            - "ScheduleEvaluation.${eval_id}.overall_status == CONDITIONAL"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: catchup_interval_max_of_age_and_interval_branch
        grounds:
          - calculations.compute_dose_validity
          - calculations.schedule_next_due
          - entities.Immunization.fields.validity
        distinguishing_aspect: >
          Mode (a): dose validity selects via a 3+ input non-linear branch over
          (age_days vs min_age-grace), (gap vs min_interval-grace), and lot recall state;
          a dose given exactly at the graced minimum interval (24 days after the prior valid
          dose) is VALID while one day earlier is INVALID_INTERVAL.
        test_recipe:
          setup:
            - "Clock 2026-06-01. DTAP product (min_age 42, min_interval 28, grace 4). Patient dob 2025-01-01."
            - "Dose1 valid on 2025-02-08 (age 38 == min_age-grace). Dose2 candidate exactly 24 days later (2025-03-04)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "DTAP", antigen: "DTAP", doses_in_series: 5, min_age_days: 42, recommended_age_days: 60, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { dtap_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic C", vfc_pin: "PIN-C", authorized_product_codes: ["DTAP"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${dtap_id}", lot_number: "LC", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child Three", date_of_birth: "2025-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-02-08" }
              as: ImmunizationRegistrar
              captures: { dose1_id: $.data.id }
          trigger:
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-03-04" }
              as: ImmunizationRegistrar
              captures: { dose2_id: $.data.id }
          assert:
            - "Immunization.${dose2_id}.validity == VALID"
            - "Immunization.${dose2_id}.dose_number == 2"

      - name: completeness_round_per_antigen_then_average
        grounds:
          - calculations.compliance_completeness
          - entities.ScheduleEvaluation.fields.completeness_pct
        distinguishing_aspect: >
          Mode (b): nested rounding order is pinned — per-antigen percentages are rounded to
          2 dp FIRST then averaged then rounded; with DTAP 2/5 (40.00) and MMR 0/2 (0.00) the
          average is 20.00, demonstrating the pinned round-then-average order.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Two ACTIVE products: DTAP (doses_in_series 5) and MMR (doses_in_series 2). Patient with 2 valid DTAP doses and 0 MMR doses."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "DTAP", antigen: "DTAP", doses_in_series: 5, min_age_days: 42, recommended_age_days: 60, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { dtap_id: $.data.id }
            - call: "POST /products"
              payload: { product_code: "MMR", antigen: "MMR", doses_in_series: 2, min_age_days: 0, recommended_age_days: 0, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { mmr_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic D", vfc_pin: "PIN-D", authorized_product_codes: ["DTAP", "MMR"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${dtap_id}", lot_number: "LD", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child Four", date_of_birth: "2025-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-02-08" }
              as: ImmunizationRegistrar
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-03-08" }
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /patients/${pat_id}/evaluations"
              payload: { as_of_date: "2026-06-01" }
              as: ImmunizationRegistrar
              captures: { eval_id: $.data.id }
          assert:
            - "ScheduleEvaluation.${eval_id}.completeness_pct == 20.00"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: immunization_recall_invalidate_then_revalidate_cycle
        grounds:
          - state_machines.Immunization.RECORDED_to_INVALIDATED
          - state_machines.Immunization.INVALIDATED_to_RECORDED
          - state_machines.LotRecall.ISSUED_to_REVERSED
        distinguishing_aspect: >
          Immunization exhibits a cycle RECORDED -> INVALIDATED -> RECORDED driven by recall
          then recall-reverse, distinct from any linear pipeline; the entity returns to RECORDED.
        test_recipe:
          setup:
            - "Clock 2026-06-01. DTAP product/provider/lot; patient with one valid dose on 2025-02-08; lot recalled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "DTAP", antigen: "DTAP", doses_in_series: 5, min_age_days: 42, recommended_age_days: 60, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { dtap_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic E", vfc_pin: "PIN-E", authorized_product_codes: ["DTAP"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${dtap_id}", lot_number: "LE", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child Five", date_of_birth: "2025-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-02-08" }
              as: ImmunizationRegistrar
              captures: { dose_id: $.data.id }
            - call: "POST /lots/${lot_id}/recalls"
              payload: { reason: "manufacturer defect" }
              as: ImmunizationRegistrar
              captures: { recall_id: $.data.id }
          trigger:
            - call: "POST /lots/${lot_id}/recalls/${recall_id}/reverse"
              payload: {}
              as: ImmunizationRegistrar
          assert:
            - "Immunization.${dose_id}.status == RECORDED"
            - "Immunization.${dose_id}.validity == VALID"

      - name: provider_report_fork_join_partial_reject
        grounds:
          - state_machines.ProviderReport.SUBMITTED_to_PARTIALLY_REJECTED
          - state_machines.ProviderReport.SUBMITTED_to_ACCEPTED
          - state_machines.ProviderReport.SUBMITTED_to_REJECTED
        distinguishing_aspect: >
          ProviderReport branches SUBMITTED -> {ACCEPTED, PARTIALLY_REJECTED, REJECTED} with
          divergent side-effect sets; the PARTIALLY_REJECTED branch materializes Immunizations
          only for accepted lines (a different entity than Immunization's cycle above).
        test_recipe:
          setup:
            - "Clock 2026-06-01. DTAP product; provider authorized; one AVAILABLE lot and one RECALLED lot."
            - "Report with 2 lines: line1 on the available lot (accepts), line2 on the recalled lot (rejects)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "DTAP", antigen: "DTAP", doses_in_series: 5, min_age_days: 42, recommended_age_days: 60, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { dtap_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic F", vfc_pin: "PIN-F", authorized_product_codes: ["DTAP"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${dtap_id}", lot_number: "LF-OK", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_ok: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${dtap_id}", lot_number: "LF-BAD", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_bad: $.data.id }
            - call: "POST /lots/${lot_bad}/recalls"
              payload: { reason: "recalled before report" }
              as: ImmunizationRegistrar
            - call: "POST /patients"
              payload: { full_name: "Child Six", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /provider-reports"
              payload: { provider_id: "${prov_id}", line_count: 2 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /provider-reports/${rep_id}/lines"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_ok}", administered_date: "2025-06-01" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /provider-reports/${rep_id}/lines"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_bad}", administered_date: "2025-07-01" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /provider-reports/${rep_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /provider-reports/${rep_id}/adjudicate"
              payload: {}
              as: ImmunizationRegistrar
          assert:
            - "ProviderReport.${rep_id}.status == PARTIALLY_REJECTED"
            - "ProviderReport.${rep_id}.accepted_count == 1"
            - "ProviderReport.${rep_id}.rejected_count == 1"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_invalidates_dose_recomputes_eval_revokes_cert
        grounds:
          - state_machines.LotRecall.ISSUED_to_REVERSED
          - state_machines.Immunization.RECORDED_to_INVALIDATED
          - state_machines.SchoolComplianceCertificate.ACTIVE_to_REVOKED
          - entities.SchoolComplianceCertificate.fields.status
        distinguishing_aspect: >
          Depth-3 cascade from recall issuance: LotRecall ISSUED -> Immunization INVALIDATED
          (hop1) -> patient ScheduleEvaluation recomputed to BEHIND (hop2) -> ACTIVE
          certificate REVOKED (hop3); each hop is caused by the previous, not by the recall directly.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Single mandated product COMPLETE1 (doses_in_series 1, min_age 0, recommended 0, min_interval 0)."
            - "Patient dob 2024-01-01 with one valid dose on 2025-01-01 -> UP_TO_DATE; certificate issued (COMPLETE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic G", vfc_pin: "PIN-G", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LG", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child Seven", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
              captures: { dose_id: $.data.id }
            - call: "POST /patients/${pat_id}/evaluations"
              payload: { as_of_date: "2026-06-01" }
              as: ImmunizationRegistrar
              captures: { eval_id: $.data.id, pv: $.data.version }
            - call: "POST /patients/${pat_id}/certificates"
              payload: { evaluation_id: "${eval_id}", expected_patient_version: "${pv}" }
              as: ImmunizationRegistrar
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /lots/${lot_id}/recalls"
              payload: { reason: "contamination" }
              as: ImmunizationRegistrar
          assert:
            - "Immunization.${dose_id}.status == INVALIDATED"
            - "SchoolComplianceCertificate.${cert_id}.status == REVOKED"

      - name: confirmed_serious_ae_creates_contraindication_marks_noncompliant
        grounds:
          - state_machines.AdverseEvent.UNDER_REVIEW_to_CONFIRMED
          - entities.AllergyRecord.fields.origin
          - entities.ScheduleEvaluation.fields.overall_status
        distinguishing_aspect: >
          Depth-2 cascade from a different trigger (AdverseEvent confirm): CONFIRMED serious
          AE -> AllergyRecord (origin ADVERSE_EVENT) created (hop1) -> patient's next
          ScheduleEvaluation overall_status NON_COMPLIANT (hop2).
        test_recipe:
          setup:
            - "Clock 2026-06-01. Single mandated product C1 needing 2 doses; patient with only one (unsatisfied); a SERIOUS adverse event reported and moved UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 2, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic H", vfc_pin: "PIN-H", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LH", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child Eight", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
              captures: { dose_id: $.data.id }
            - call: "POST /adverse-events"
              payload: { immunization_id: "${dose_id}", seriousness: "SERIOUS", symptoms: "anaphylaxis" }
              as: ImmunizationRegistrar
              captures: { ae_id: $.data.id }
            - call: "POST /adverse-events/${ae_id}/review"
              payload: {}
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /adverse-events/${ae_id}/confirm"
              payload: {}
              as: ImmunizationRegistrar
            - call: "POST /patients/${pat_id}/evaluations"
              payload: { as_of_date: "2026-06-01" }
              as: ImmunizationRegistrar
              captures: { eval_id: $.data.id }
          assert:
            - "AllergyRecord for patient ${pat_id} antigen C1 exists with origin == ADVERSE_EVENT and severity == CONTRAINDICATED"
            - "ScheduleEvaluation.${eval_id}.overall_status == NON_COMPLIANT"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: contraindication_beats_interval_on_record
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: >
          A single record that violates BOTH business_safety (contraindication, prio 9)
          and business_temporal (interval too short, prio 10) returns ERR_CONTRAINDICATED,
          not ERR_INTERVAL_TOO_SHORT — safety outranks temporal.
        test_recipe:
          setup:
            - "Clock 2026-06-01. DTAP product (min_interval 28, grace 4). Patient with a valid dose on 2025-02-08 and a CONTRAINDICATED DTAP allergy record."
            - "New dose dated 2025-02-20 violates BOTH interval (gap 12 < 24) AND the contraindication."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "DTAP", antigen: "DTAP", doses_in_series: 5, min_age_days: 42, recommended_age_days: 60, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { dtap_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic I", vfc_pin: "PIN-I", authorized_product_codes: ["DTAP"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
