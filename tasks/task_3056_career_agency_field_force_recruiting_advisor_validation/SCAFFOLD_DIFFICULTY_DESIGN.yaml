              as: LicensingCoordinator
              captures: { lic_id: $.data.id }
            - call: "POST /agency/product-licenses/${lic_id}/activate"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/carrier-appointments"
              payload: { advisor_id: "${adv_id}", requires_license_id: "${lic_id}", carrier_name: "Northwestern Mutual", state_code: "WI", requested_date: "2026-01-05T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /agency/carrier-appointments/${appt_id}/approve"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Omar Reversible", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "invariant arm" }
