scaffold_corner_design:

  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: grower_creation_success_and_defaults
        claim_type: creation
        grounds: [entities.Grower]
        distinguishing_aspect: "POST /api/growers with required fields returns 201 with server-minted UUID id, status defaulting to ACTIVE, loan_outstanding_cents 0, house_count 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-NEW", full_name: "New Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
          trigger:
            - { call: "GET /api/growers/${g}", payload: {}, as: IntegratorAdmin, captures: { st: $.data.status, lo: $.data.loan_outstanding_cents, hc: $.data.house_count, v: $.data.version } }
          assert:
            - "Grower.${g}.status == ACTIVE (default applied)"
            - "Grower.${g}.loan_outstanding_cents == 0 and house_count == 0"
            - "Grower.${g}.version == 1 and id is a UUID"

      - name: grower_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Grower, "validations[priority=1]"]
        distinguishing_aspect: "POST /api/growers without grower_code is rejected with a 4xx validation error; required input fields are enforced."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/growers", payload: { full_name: "No Code" }, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response is an error envelope with a 4xx status and non-empty error_id"

      - name: grower_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Grower, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/growers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_NOT_FOUND with http 404"

      - name: grower_list_pagination_envelope
        claim_type: listing
        grounds: [entities.Grower, response_envelope]
        distinguishing_aspect: "GET /api/growers?limit=1 returns response_type array with pagination fields limit/offset/total_count/has_more; second page disjoint from first."
        test_recipe:
          setup: ["three growers exist"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-L1", full_name: "List One" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-L2", full_name: "List Two" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-L3", full_name: "List Three" }, as: IntegratorAdmin }
          trigger:
            - { call: "GET /api/growers?limit=1&offset=0", payload: {}, as: IntegratorAdmin, captures: { tc: $.meta } }
          assert:
            - "response envelope carries response_type == array and pagination fields limit, offset, total_count == 3, has_more == true"
            - "GET /api/growers?limit=1&offset=1 returns a different grower id than offset=0"

      - name: flock_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.Flock]
        distinguishing_aspect: "Client-supplied feed_delivered_lbs / live_weight_lbs / adj_fcr on POST /api/flocks are ignored; computed fields initialize to 0/null."
        test_recipe:
          setup: ["grower, house, active contract, group exist"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-CF", full_name: "Computed Fields" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-CF", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-CF", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
          trigger:
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-CF" }, as: IntegratorAdmin, captures: { f: $.data.id, fd: $.data.feed_delivered_lbs, lw: $.data.live_weight_lbs, fcr: $.data.adj_fcr } }
          assert:
            - "Flock.${f}.feed_delivered_lbs == 0 and live_weight_lbs == 0"
            - "Flock.${f}.adj_fcr is null and status == PLANNED (initial state)"

      - name: house_no_unique_within_grower
        claim_type: type_constraints
        grounds: [entities.House, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Two houses with the same house_no under one grower rejected with ERR_DUPLICATE; the same house_no under a different grower is allowed."
        test_recipe:
          setup: ["two growers exist"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-D1", full_name: "Dup One" }, as: IntegratorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /api/growers", payload: { grower_code: "G-D2", full_name: "Dup Two" }, as: IntegratorAdmin, captures: { g2: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g1}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/houses", payload: { grower_id: "${g1}", house_no: "H1", capacity_birds: 6000 }, as: IntegratorAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g2}", house_no: "H1", capacity_birds: 6000 }, as: IntegratorAdmin }
          assert:
            - "duplicate house_no within grower -> ERR_DUPLICATE 409"
            - "same house_no under grower ${g2} succeeds (uniqueness is grower-scoped)"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: contract_activate_from_active_rejected
        claim_type: invalid_transition
        grounds: [state_machines.GrowerContract.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE contract fails with ERR_INVALID_STATE and no side effects."
        test_recipe:
          setup: ["grower with one house and an ACTIVE contract"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-S1", full_name: "State One" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-S1", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "second activate -> ERR_INVALID_STATE 409"
            - "GrowerContract.${c}.status remains ACTIVE"

      - name: placement_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.ChickPlacement, entities.ChickPlacement.fields.status]
        distinguishing_aspect: "Newly created ChickPlacement starts in SCHEDULED with confirmed_date null."
        test_recipe:
          setup: ["flock PLANNED exists"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-S2", full_name: "State Two" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-S2", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-S2", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-S2" }, as: IntegratorAdmin, captures: { f: $.data.id } }
          trigger:
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 4000 }, as: IntegratorAdmin, captures: { st: $.data.status, cd: $.data.confirmed_date } }
          assert:
            - "placement status == SCHEDULED and confirmed_date is null"

      - name: settlement_terminal_paid_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Settlement]
        distinguishing_aspect: "From PAID no further transitions are possible: dispute, approve, pay, resolve-dispute all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["a PAID settlement (approve then pay after group lock)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-S3", full_name: "State Three" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-S3", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-S3", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-S3" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 10000, feed_type: STARTER, ticket_no: "FT-S3" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-S3", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs: $.data.id } }
            - { call: "POST /api/flocks/${f}/weight-tickets", payload: { ticket_no: "WT-S3", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 5000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${cs}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/settlement-groups/${grp}/lock", payload: {}, as: SettlementAnalyst }
            - { call: "GET /api/flocks/${f}/settlement", payload: {}, as: SettlementAnalyst, captures: { s: "$.data[0].id" } }
            - { call: "POST /api/settlements/${s}/approve", payload: {}, as: SettlementAnalyst }
            - { call: "POST /api/settlements/${s}/pay", payload: {}, as: SettlementAnalyst }
          trigger:
            - { call: "POST /api/settlements/${s}/dispute", payload: {}, as: Grower, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "dispute from PAID -> ERR_INVALID_STATE 409 (terminal lockdown)"
            - "Settlement.${s}.status remains PAID and net_amount_cents unchanged"

      - name: placement_confirm_cascades_flock_and_house
        claim_type: side_effect_execution
        grounds: [state_machines.Flock.PLANNED_to_PLACED, state_machines.House.ACTIVE_to_PLACED]
        distinguishing_aspect: "Confirming a placement copies head_count into Flock.placed_head, sets placed_date, and flips House ACTIVE -> PLACED."
        test_recipe:
          setup: ["flock PLANNED with SCHEDULED placement of 7000 head"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-S4", full_name: "State Four" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 9000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-S4", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-S4", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-S4" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 7000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "GET /api/flocks/${f}", payload: {}, as: IntegratorAdmin, captures: { ph: $.data.placed_head, fst: $.data.status } }
            - { call: "GET /api/houses/${h}", payload: {}, as: IntegratorAdmin, captures: { hst: $.data.house_status } }
          assert:
            - "Flock.${f}.status == PLACED and placed_head == 7000"
            - "House.${h}.house_status == PLACED"

      - name: feed_delivery_first_flips_placed_to_growing
        claim_type: side_effect_execution
        grounds: [state_machines.Flock.PLACED_to_GROWING]
        distinguishing_aspect: "First feed delivery on a PLACED flock moves it to GROWING and accumulates feed_delivered_lbs; a second delivery only accumulates."
        test_recipe:
          setup: ["flock PLACED with 7000 head"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-S5", full_name: "State Five" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 9000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-S5", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-S5", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-S5" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 7000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 3000, feed_type: STARTER, ticket_no: "FT-S5a" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-06", feed_lbs: 2500, feed_type: GROWER, ticket_no: "FT-S5b" }, as: IntegratorAdmin }
            - { call: "GET /api/flocks/${f}", payload: {}, as: IntegratorAdmin, captures: { fd: $.data.feed_delivered_lbs, st: $.data.status } }
          assert:
            - "after first delivery Flock.${f}.status == GROWING"
            - "Flock.${f}.feed_delivered_lbs == 5500 after second delivery (accumulation without state change)"

  # ==================================================================
  # Section: calculations
  # ==================================================================
  - section: calculations
    instances:
      - name: group_averages_exclude_non_harvested_members
        claim_type: input_set_filtering
        grounds: [calculations.performance_score, entities.SettlementGroup.fields.group_avg_fcr]
        distinguishing_aspect: "Group averages are computed over flocks with status IN {HARVESTED, SETTLED} only; a PLANNED/GROWING member of the group does not move the average."
        test_recipe:
          setup: ["group with one HARVESTED flock (adj_fcr 1.6) and one GROWING flock (feed posted but not harvested)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-AV", full_name: "Average Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 9000 }, as: IntegratorAdmin, captures: { h1: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H2", capacity_birds: 9000 }, as: IntegratorAdmin, captures: { h2: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-AV", base_pay_cents_per_lb: 6, committed_house_count: 2, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-AV", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h1}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-AV1" }, as: IntegratorAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h2}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-AV2" }, as: IntegratorAdmin, captures: { f2: $.data.id } }
            - { call: "POST /api/flocks/${f1}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/flocks/${f2}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/placements/${p1}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/placements/${p2}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 10000, feed_type: STARTER, ticket_no: "FT-AV1" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f2}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 99000, feed_type: STARTER, ticket_no: "FT-AV2" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-AV", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs1: $.data.id } }
            - { call: "POST /api/flocks/${f1}/weight-tickets", payload: { ticket_no: "WT-AV1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 5000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${cs1}/complete", payload: {}, as: LivehaulScheduler }
          trigger:
            - { call: "GET /api/settlement-groups/${grp}", payload: {}, as: SettlementAnalyst, captures: { gavg: $.data.group_avg_fcr } }
          assert:
            - "SettlementGroup.${grp}.group_avg_fcr == 1.6 — the GROWING flock ${f2} with 99000 lbs feed posted is excluded from the average"

      - name: performance_rating_rolling_window_of_three
        claim_type: correct_result
        grounds: [calculations.grower_performance_rating, entities.Grower.fields.performance_rating]
        distinguishing_aspect: "Grower.performance_rating averages the 3 most recent SETTLED flocks; with exactly one settled flock the rating equals that flock's score, and it stays null with zero settled flocks."
        test_recipe:
          setup: ["grower with no settled flocks, then one flock settled in a single-member group"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-RT", full_name: "Rating Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "GET /api/growers/${g}", payload: {}, as: IntegratorAdmin, captures: { r0: $.data.performance_rating } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 9000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-RT", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-RT", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-RT" }, as: IntegratorAdmin, captures: { f: $.data.id } }
