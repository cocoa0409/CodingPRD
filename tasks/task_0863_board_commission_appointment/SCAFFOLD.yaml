scenario: "863. Board & Commission Appointment Management: seat/term & vacancy, application & residency/eligibility, appointment & confirmation workflow, term-limit & attendance, financial-disclosure & ethics filing, reappointment & rotation, roster & reporting, sunshine compliance"
domain_name: "board-commission-appointment"
api_prefix: "/civic"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by FK (Board, Seat, Vacancy, Applicant, Application,
  # Appointment, Term, Meeting, AttendanceRecord, DisclosureFiling, RemovalAction,
  # ReappointmentRequest). No nested resource ownership in URL paths.

  state_machine_shape: branching
  # Appointment forks NOMINATED -> {CONFIRMED, REJECTED, SUPERSEDED} with divergent
  # side-effects; Application is cyclic (UNDER_REVIEW <-> RETURNED_FOR_INFO); several
  # others linear.

  relationship_patterns:
    - one_to_many          # Board -> Seat, Board -> Meeting, Term -> DisclosureFiling
    - cross_aggregate      # Appointment references Application + Seat + Applicant
    - self_referential     # Term consecutive-chain references prior Terms of same applicant/board

  role_model: segregation_of_duties
  # The AppointingAuthority who nominates a candidate cannot cast the confirming vote
  # (SoD by X-User-ID); EthicsOfficer reviews disclosures independently.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Board
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the board or commission"
      - name: jurisdiction
        type: string
        source: input
        description: "Governing jurisdiction (city/county/state) the board serves"
      - name: board_type
        type: enum
        source: input
        description: "Kind of body"
        constraints: "one of {BOARD, COMMISSION, AUTHORITY}"
      - name: authorized_seat_count
        type: integer
        source: input
        description: "Number of seats the enabling ordinance authorizes"
        constraints: ">= 1"
      - name: quorum_count
        type: integer
        source: input
        description: "Minimum YES votes required to confirm an appointment"
        constraints: ">= 1"
      - name: term_length_months
        type: integer
        source: input
        description: "Length of a full term in whole months"
        constraints: ">= 1"
      - name: max_consecutive_terms
        type: integer
        source: input
        description: "Term-limit: maximum unbroken consecutive terms one person may serve"
        constraints: ">= 1"
      - name: max_cumulative_years
        type: number
        source: input
        description: "Term-limit: maximum lifetime years one person may serve across all terms"
        constraints: "> 0"
      - name: attendance_threshold_pct
        type: number
        source: input
        description: "Minimum final attendance rate (percent); below this a member is removal-eligible"
        constraints: "0 < value <= 100"
      - name: sunshine_notice_days
        type: integer
        source: input
        description: "Open-meetings notice must be posted at least this many days before a meeting"
        constraints: ">= 0"
      - name: max_holdover_days
        type: integer
        source: input
        description: "Maximum days a member may hold over past scheduled term end awaiting a successor"
        default: 90
        constraints: ">= 0"
      - name: is_sunshine_subject
        type: boolean
        source: input
        description: "Whether the board is subject to open-meetings (sunshine) law"
        default: true
      - name: status
        type: enum
        source: system
        description: "Board lifecycle status"
        default: ACTIVE
        constraints: "one of {ACTIVE}"

  - name: Seat
    parent: null
    common_fields: true
    fields:
      - name: board_id
        type: string
        source: input
        description: "FK -> Board.id; the board this seat belongs to"
      - name: seat_number
        type: integer
        source: input
        description: "Ordinal seat number within the board"
        constraints: ">= 1"
      - name: seat_category
        type: enum
        source: input
        description: "Category the seat represents"
        constraints: "one of {AT_LARGE, DISTRICT, EX_OFFICIO}"
      - name: residency_requirement
        type: enum
        source: input
        description: "Residency rule an occupant must satisfy"
        constraints: "one of {IN_JURISDICTION, DISTRICT_SPECIFIC, NONE}"
      - name: required_district
        type: string
        source: input
        description: "District an occupant must reside in; required iff residency_requirement==DISTRICT_SPECIFIC"
        default: null
      - name: occupancy_status
        type: enum
        source: computed
        description: "Derived occupancy: VACANT (no active term), FILLED (an ACTIVE term), HOLDOVER (a HOLDOVER term)"
        default: VACANT
        constraints: "one of {VACANT, FILLED, HOLDOVER}"

  - name: Vacancy
    parent: null
    common_fields: true
    fields:
      - name: seat_id
        type: string
        source: input
        description: "FK -> Seat.id; the seat this vacancy is opened against"
      - name: reason
        type: enum
        source: input
        description: "Why the vacancy exists"
        constraints: "one of {NEW_SEAT, RESIGNATION, TERM_EXPIRY, REMOVAL}"
      - name: application_deadline
        type: datetime
        source: input
        description: "Applications are accepted only at or before this instant (inclusive)"
      - name: status
        type: enum
        source: system
        description: "Vacancy lifecycle"
        default: OPEN
        constraints: "one of {OPEN, CLOSED, FILLED}"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Applicant legal name"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: residence_district
        type: string
        source: input
        description: "District the applicant resides in"
      - name: resides_in_jurisdiction
        type: boolean
        source: input
        description: "Whether the applicant resides within the board jurisdiction"
      - name: is_registered_voter
        type: boolean
        source: input
        description: "Whether the applicant is a registered voter"
      - name: employer
        type: string
        source: input
        description: "Current employer (used for conflict screening in disclosures)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Applicant lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE}"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the person applying"
      - name: vacancy_id
        type: string
        source: input
        description: "FK -> Vacancy.id; the vacancy applied to"
      - name: residency_attested
        type: boolean
        source: input
        description: "Applicant's sworn attestation that they meet the seat residency requirement"
      - name: statement
        type: string
        source: input
        description: "Applicant's statement of interest"
        default: null
      - name: return_count
        type: integer
        source: system
        description: "Number of times the application was returned for more information"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Review lifecycle"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, ELIGIBLE, INELIGIBLE}"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the eligible application being nominated"
      - name: seat_id
        type: string
        source: input
        description: "FK -> Seat.id; the seat nominated to"
      - name: applicant_id
        type: string
        source: system
        description: "FK -> Applicant.id; copied from the nominated application's applicant"
      - name: term_start_date
        type: datetime
        source: input
        description: "Proposed start of the term this appointment would create"
      - name: term_end_date
        type: datetime
        source: computed
        description: "Computed = term_start_date + Board.term_length_months (see calc term_window_computation)"
      - name: term_sequence_number
        type: integer
        source: computed
        description: "1 + count of the applicant's prior consecutive terms on this board (see calc consecutive_term_count)"
      - name: nominated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AppointingAuthority who created this nomination"
      - name: yes_votes
        type: integer
        source: system
        description: "YES votes recorded at confirmation"
        default: null
      - name: no_votes
        type: integer
        source: system
        description: "NO votes recorded at confirmation"
        default: null
      - name: confirmed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ConfirmingMember who recorded the confirming vote"
        default: null
      - name: status
        type: enum
        source: system
        description: "Nomination lifecycle"
        default: NOMINATED
        constraints: "one of {NOMINATED, CONFIRMED, REJECTED, SUPERSEDED}"

  - name: Term
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: system
        description: "FK -> Appointment.id; the confirmed appointment (or reappointment-minted appointment) that created this term"
      - name: seat_id
        type: string
        source: system
        description: "FK -> Seat.id; the seat occupied"
      - name: applicant_id
        type: string
        source: system
        description: "FK -> Applicant.id; the member serving the term"
      - name: board_id
        type: string
        source: system
        description: "FK -> Board.id; the board served on"
      - name: term_start_date
        type: datetime
        source: system
        description: "Actual start of the term (copied from the appointment)"
      - name: term_end_date
        type: datetime
        source: computed
        description: "Scheduled end = term_start_date + Board.term_length_months; may extend on holdover (see calc term_expiry_resolution)"
      - name: term_sequence_number
        type: integer
        source: system
        description: "Consecutive term number for this applicant on this board"
      - name: is_holdover
        type: boolean
        source: system
        description: "True once the term has passed scheduled end without a seated successor"
        default: false
      - name: present_count
        type: integer
        source: computed
        description: "Count of AttendanceRecord with presence==PRESENT for this term"
        default: 0
      - name: absent_count
        type: integer
        source: computed
        description: "Count of AttendanceRecord with presence==ABSENT for this term"
        default: 0
      - name: excused_count
        type: integer
        source: computed
        description: "Count of AttendanceRecord with presence==EXCUSED for this term"
        default: 0
      - name: provisional_attendance_rate
        type: number
        source: computed
        description: "Provisional attendance rate percent computed live on read (denominator excludes EXCUSED; see calc attendance_rate provisional variant)"
        default: null
      - name: final_attendance_rate
        type: number
        source: computed
        description: "Final attendance rate percent (denominator includes EXCUSED); computed live on every Term read and for the compliance report and ATTENDANCE removals, and snapshot-persisted when the term expires/completes. Null only when the term has zero attendance records (see calc attendance_rate final variant)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Term lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE, HOLDOVER, EXPIRED, VACATED, COMPLETED}"

  - name: Meeting
    parent: null
    common_fields: true
    fields:
      - name: board_id
        type: string
        source: input
        description: "FK -> Board.id; the board that holds this meeting"
      - name: scheduled_date
        type: datetime
        source: input
        description: "Instant the meeting is scheduled to occur"
      - name: notice_posted_at
        type: datetime
        source: system
        description: "Instant the public notice was posted (logical clock at post-notice)"
        default: null
      - name: notice_compliant
        type: boolean
        source: computed
        description: "True iff notice_posted_at <= scheduled_date - Board.sunshine_notice_days (see calc sunshine_notice_compliance)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Meeting lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, NOTICED, HELD}"

  - name: AttendanceRecord
    parent: null
    common_fields: false
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the term whose member attended (or not)"
      - name: meeting_id
        type: string
        source: input
        description: "FK -> Meeting.id; the meeting attended"
      - name: presence
        type: enum
        source: input
        description: "Attendance outcome"
        constraints: "one of {PRESENT, ABSENT, EXCUSED}"

  - name: DisclosureFiling
    parent: null
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: system
        description: "FK -> Term.id; the term this filing obligation attaches to"
      - name: board_id
        type: string
        source: system
        description: "FK -> Board.id; the board the filing is filed with"
      - name: filing_type
        type: enum
        source: system
        description: "Kind of filing obligation (one of each type is minted per term)"
        constraints: "one of {FINANCIAL_DISCLOSURE, ETHICS_PLEDGE}"
      - name: due_date
        type: datetime
        source: computed
        description: "Computed = term_start_date + DISCLOSURE_DUE_DAYS (see calc disclosure_due_date)"
      - name: filed_at
        type: datetime
        source: system
        description: "Instant the member filed the disclosure"
        default: null
      - name: content
        type: string
        source: system
        description: "Filed disclosure content"
        default: null
      - name: status
        type: enum
        source: system
        description: "Filing lifecycle"
        default: PENDING
        constraints: "one of {PENDING, FILED, ACCEPTED, DEFICIENT, CLOSED}"

  - name: RemovalAction
    parent: null
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the term being removed"
      - name: reason
        type: enum
        source: input
        description: "Grounds for removal"
        constraints: "one of {RESIGNATION, TERM_LIMIT, ATTENDANCE, ETHICS_VIOLATION, FOR_CAUSE}"
      - name: effective_date
        type: datetime
        source: input
        description: "Instant the removal takes effect"
      - name: initiated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the role that initiated the removal"
      - name: status
        type: enum
        source: system
        description: "Removal lifecycle"
        default: INITIATED
        constraints: "one of {INITIATED, EXECUTED}"

  - name: ReappointmentRequest
    parent: null
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the expiring or holdover term whose incumbent seeks reappointment"
      - name: seat_id
        type: string
        source: input
        description: "FK -> Seat.id; the seat to be re-filled"
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the incumbent seeking reappointment"
      - name: requested_term_start
        type: datetime
        source: input
        description: "Proposed start of the new (reappointed) term"
      - name: consecutive_terms_at_request
        type: integer
        source: computed
        description: "Snapshot of the incumbent's consecutive-term count at decision time (see calc consecutive_term_count)"
        default: null
      - name: cumulative_years_at_request
        type: number
        source: computed
        description: "Snapshot of the incumbent's cumulative years served at decision time (see calc cumulative_years_served)"
        default: null
      - name: resulting_appointment_id
        type: string
        source: system
        description: "Id of the CONFIRMED Appointment minted on approval (computed back-reference; null until APPROVED)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Reappointment lifecycle"
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED}"

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [ELIGIBLE, INELIGIBLE]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /civic/applications/{id}/start-review"
        actor: BoardClerk
        preconditions:
          - "application.status == SUBMITTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: RETURNED_FOR_INFO
        trigger: "POST /civic/applications/{id}/return-for-info"
        actor: BoardClerk
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "increment application.return_count by 1"
        note: "Cyclic: an application may bounce between UNDER_REVIEW and RETURNED_FOR_INFO any number of times."
      - from: RETURNED_FOR_INFO
        to: UNDER_REVIEW
        trigger: "POST /civic/applications/{id}/resubmit"
        actor: Applicant
        preconditions:
          - "application.status == RETURNED_FOR_INFO"
          - "acting Applicant owns the application (X-User-ID == application.applicant_id)"
        side_effects: []
        note: "Closes the revision loop back to review."
      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "POST /civic/applications/{id}/decide-eligibility (eligible=true)"
        actor: BoardClerk
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "applicant satisfies the seat residency requirement (see validation priority 60)"
        side_effects: []
      - from: UNDER_REVIEW
        to: INELIGIBLE
        trigger: "POST /civic/applications/{id}/decide-eligibility (eligible=false)"
        actor: BoardClerk
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects: []

  - entity: Appointment
    initial_state: NOMINATED
    terminal_states: [CONFIRMED, REJECTED, SUPERSEDED]
    transitions:
      - from: NOMINATED
        to: CONFIRMED
        trigger: "POST /civic/appointments/{id}/confirm"
        actor: ConfirmingMember
        preconditions:
          - "appointment.status == NOMINATED"
          - "confirming member is not the nominator (X-User-ID != appointment.nominated_by_user_id) [SoD]"
          - "seat.occupancy_status == VACANT [cross-entity: Appointment depends on Seat]"
          - "yes_votes >= board.quorum_count AND yes_votes > no_votes [quorum]"
          - "the term window [term_start_date, term_end_date) does not overlap any ACTIVE/HOLDOVER Term on the seat [half-open]"
        side_effects:
          - "record yes_votes, no_votes, confirmed_by_user_id on the appointment"
          - "CASCADE link1: create Term(status=ACTIVE) for the seat/applicant with term_sequence_number and computed term_end_date"
          - "CASCADE link2: the new ACTIVE Term sets seat.occupancy_status = FILLED"
          - "mint 2 DisclosureFiling rows (FINANCIAL_DISCLOSURE, ETHICS_PLEDGE) in PENDING with computed due_date"
          - "set linked Vacancy.status = FILLED if a vacancy for this seat is OPEN"
        note: "Branching fork: CONFIRMED vs REJECTED vs SUPERSEDED carry divergent side-effects."
      - from: NOMINATED
        to: REJECTED
        trigger: "POST /civic/appointments/{id}/reject"
        actor: ConfirmingMember
        preconditions:
          - "appointment.status == NOMINATED"
          - "confirming member is not the nominator (X-User-ID != appointment.nominated_by_user_id) [SoD]"
        side_effects:
          - "record confirmed_by_user_id (the rejecting voter) and reason"
          - "no Term is created; seat.occupancy_status unchanged; vacancy stays OPEN"
      - from: NOMINATED
        to: SUPERSEDED
        trigger: "system: a newer nomination is created for the same seat via POST /civic/appointments"
        actor: system
        preconditions:
          - "appointment.status == NOMINATED"
          - "a new Appointment is created for the same seat_id"
        side_effects:
          - "the prior NOMINATED appointment for the seat is set to SUPERSEDED"
        note: "Only one live NOMINATED appointment may exist per seat; a fresh nomination supersedes the previous one."

  - entity: Term
    initial_state: ACTIVE
    terminal_states: [EXPIRED, VACATED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: HOLDOVER
        trigger: "POST /civic/terms/{id}/expire (no seated successor and within holdover window)"
        actor: BoardClerk
        preconditions:
          - "term.status == ACTIVE"
          - "clock >= term.term_end_date"
          - "no ACTIVE Term exists for the seat with term_start_date >= this term.term_end_date [no successor seated]"
        side_effects:
          - "set term.is_holdover = true; extend term.term_end_date per calc term_expiry_resolution"
          - "set seat.occupancy_status = HOLDOVER"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /civic/terms/{id}/expire (a successor term is seated)"
        actor: BoardClerk
        preconditions:
          - "term.status == ACTIVE"
          - "clock >= term.term_end_date"
          - "an ACTIVE Term exists for the seat with term_start_date >= this term.term_end_date [successor seated]"
        side_effects:
          - "set term.final_attendance_rate per calc attendance_rate (final variant)"
      - from: HOLDOVER
        to: EXPIRED
        trigger: "POST /civic/terms/{id}/expire (holdover window elapsed or successor seated)"
        actor: BoardClerk
        preconditions:
          - "term.status == HOLDOVER"
          - "clock >= term.term_end_date [holdover-extended end]"
        side_effects:
          - "set term.final_attendance_rate per calc attendance_rate (final variant)"
          - "if seat still HOLDOVER and no ACTIVE successor, set seat.occupancy_status = VACANT"
      - from: ACTIVE
        to: VACATED
        trigger: "system: POST /civic/removals/{id}/execute"
        actor: system
        preconditions:
          - "term.status IN {ACTIVE, HOLDOVER}"
        side_effects:
          - "CASCADE link1: removal execution sets term.status = VACATED"
          - "CASCADE link2: the VACATED term sets seat.occupancy_status = VACANT"
          - "CASCADE link3: the now-VACANT seat opens a new Vacancy(status=OPEN, reason=REMOVAL)"
          - "close this term's open DisclosureFiling rows (status -> CLOSED)"
        note: "Depth-3 cascade: Removal -> Term.VACATED -> Seat.VACANT -> Vacancy.OPEN."
      - from: HOLDOVER
        to: VACATED
        trigger: "system: POST /civic/removals/{id}/execute"
        actor: system
        preconditions:
          - "term.status == HOLDOVER"
        side_effects:
          - "same cascade as ACTIVE->VACATED"
      - from: HOLDOVER
        to: COMPLETED
        trigger: "system: reappointment approved for the same seat/incumbent (POST /civic/reappointments/{id}/decide, approve=true)"
        actor: system
        preconditions:
          - "term.status == HOLDOVER"
        side_effects:
          - "set term.final_attendance_rate per calc attendance_rate (final variant)"
          - "the reappointment mints a fresh CONFIRMED Appointment and a new ACTIVE Term (see Appointment CONFIRMED cascade)"

  - entity: Meeting
    initial_state: SCHEDULED
    terminal_states: [HELD]
    transitions:
      - from: SCHEDULED
        to: NOTICED
        trigger: "POST /civic/meetings/{id}/post-notice"
        actor: BoardClerk
        preconditions:
          - "meeting.status == SCHEDULED"
        side_effects:
          - "set notice_posted_at = clock"
          - "set notice_compliant per calc sunshine_notice_compliance"
      - from: NOTICED
        to: HELD
        trigger: "POST /civic/meetings/{id}/hold"
        actor: BoardClerk
        preconditions:
          - "meeting.status == NOTICED"
          - "clock >= meeting.scheduled_date"
        side_effects: []

  - entity: DisclosureFiling
    initial_state: PENDING
    terminal_states: [ACCEPTED, CLOSED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /civic/disclosures/{id}/file"
        actor: Applicant
        preconditions:
          - "filing.status == PENDING"
          - "acting Applicant is the term's member (X-User-ID == term.applicant_id)"
        side_effects:
          - "set filed_at = clock and content"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /civic/disclosures/{id}/review (accept=true)"
        actor: EthicsOfficer
        preconditions:
          - "filing.status IN {FILED, DEFICIENT}"
        side_effects: []
      - from: FILED
        to: DEFICIENT
        trigger: "POST /civic/disclosures/{id}/review (accept=false)"
        actor: EthicsOfficer
        preconditions:
          - "filing.status == FILED"
        side_effects: []
      - from: DEFICIENT
        to: FILED
        trigger: "POST /civic/disclosures/{id}/file (re-file to cure)"
        actor: Applicant
        preconditions:
          - "filing.status == DEFICIENT"
          - "acting Applicant is the term's member"
        side_effects:
          - "set filed_at = clock and content"
        note: "Cyclic cure loop FILED <-> DEFICIENT."
      - from: PENDING
        to: CLOSED
        trigger: "system: the parent Term is VACATED via removal execution"
        actor: system
        preconditions:
          - "parent term.status transitions to VACATED"
        side_effects: []

  - entity: ReappointmentRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /civic/reappointments/{id}/decide (approve=true)"
        actor: ConfirmingMember
        preconditions:
          - "request.status == REQUESTED"
          - "the expiring term.status IN {EXPIRED, HOLDOVER} [cross-entity: ReappointmentRequest depends on Term]"
          - "consecutive_term_count(applicant, board) < board.max_consecutive_terms [term-limit]"
          - "cumulative_years_served(applicant, board) < board.max_cumulative_years [term-limit]"
        side_effects:
          - "snapshot consecutive_terms_at_request, cumulative_years_at_request"
          - "mint a CONFIRMED Appointment and a new ACTIVE Term for the seat (reuses Appointment CONFIRMED cascade); set resulting_appointment_id"
          - "if the expiring term was HOLDOVER, set it COMPLETED"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /civic/reappointments/{id}/decide (approve=false) or term-limit exceeded"
        actor: ConfirmingMember
        preconditions:
          - "request.status == REQUESTED"
        side_effects:
          - "snapshot consecutive_terms_at_request, cumulative_years_at_request"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - rule_id: nomination-supersede-stale-seat
    parent_entity: Seat
    write_endpoint: "POST /civic/appointments"
    occ_field: "expected_seat_version"
    description: |
      Creating a nomination against a Seat whose version has advanced since the
      client last observed it is rejected. A fresh nomination legitimately
      supersedes the seat's prior NOMINATED appointment (§ Appointment
      NOMINATED->SUPERSEDED), so a second nomination is a valid product action;
      the OCC guard rejects the one whose expected_seat_version is stale because
      the seat was already re-nominated (its version advanced) after the client
      read it.
    error_id: ERR_STALE_SEAT_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: term_window_computation
    trigger: "on POST /civic/appointments (nomination) and when a Term is created"
    algorithm: aggregation
    formula: |
      term_end_date = add_months(term_start_date, Board.term_length_months)
      # add_months adds whole calendar months; day-of-month preserved,
      # clamped to the last valid day of the target month.
    input_set: "the nominating board's term_length_months and the supplied term_start_date"
    constants: {}
    precision: "whole-day ISO 8601 instants; time-of-day copied from term_start_date"

  - name: attendance_rate
    trigger: "provisional: on GET /civic/terms/{id} read and GET roster; final: persisted on Term ACTIVE|HOLDOVER -> EXPIRED|COMPLETED, and computed live for ATTENDANCE-reason removals and the board compliance report"
    algorithm: aggregation
    formula: |
      present = count(AttendanceRecord where term_id==T.id and presence==PRESENT)
      absent  = count(AttendanceRecord where term_id==T.id and presence==ABSENT)
      excused = count(AttendanceRecord where term_id==T.id and presence==EXCUSED)
      # base (provisional) denominator EXCLUDES excused absences:
      provisional_denom = present + absent
      provisional_rate  = 0.0 if provisional_denom == 0
                          else round(present / provisional_denom * 100, 1)
      # final denominator INCLUDES excused absences (stricter):
      final_denom = present + absent + excused
      final_rate  = null if final_denom == 0
                    else round(present / final_denom * 100, 1)
    input_set: "AttendanceRecord rows for the term; only meetings with recorded attendance are counted"
    constants: {}
    precision: "1 decimal place, round_half_up"
    variants:
      - name: provisional
        when: "in-term progress views (term read, live roster) before the term ends"
        difference: "denominator = present + absent (EXCUSED excluded), so the rate reads higher"
      - name: final
        when: "at term expiry/completion; stored in Term.final_attendance_rate and used for attendance removal eligibility"
        difference: "denominator = present + absent + excused (EXCUSED counted against the member), so the rate reads lower"

  - name: tenure_measurement
    trigger: "on POST /civic/reappointments/{id}/decide and on term-limit validation"
    algorithm: chronological
    formula: |
      served = [ t for t in Term
                 where t.applicant_id==A.id and t.board_id==B.id
                 and t.status in {ACTIVE, HOLDOVER, EXPIRED, COMPLETED} ]
      order served by term_start_date ASC, then created_at ASC as tie-break
      # ---- variant consecutive_terms ----
      # walk served newest->oldest; a term joins the run iff its predecessor's
      # term_end_date + CONSECUTIVE_GAP_DAYS >= this term's term_start_date.
      consecutive_terms = length of the maximal back-to-back run ending at the newest served term
      # ---- variant cumulative_years ----
      # uses each term's NOMINAL length (term_start + term_length_months), never the
      # holdover-extended term_end_date, so the measure is holdover-independent.
      cumulative_years = round( sum over served of
                                ( add_months(t.term_start_date, Board.term_length_months)
                                  - t.term_start_date ).days / 365.0, 2 )
    input_set: "the applicant's Terms on the board with status in {ACTIVE, HOLDOVER, EXPIRED, COMPLETED}; VACATED and future terms excluded"
    constants:
      CONSECUTIVE_GAP_DAYS: 1
    precision: "consecutive_terms integer; cumulative_years 2 decimals round_half_up"
    variants:
      - name: consecutive_terms
        when: "enforcing Board.max_consecutive_terms"
        difference: "counts TERMS in an unbroken chain; a gap > CONSECUTIVE_GAP_DAYS resets the count to the post-gap run"
      - name: cumulative_years
        when: "enforcing Board.max_cumulative_years"
        difference: "sums YEARS across ALL served terms regardless of gaps; never resets"

  - name: term_expiry_resolution
    trigger: "on POST /civic/terms/{id}/expire"
    algorithm: constraint_propagation
    formula: |
      scheduled_end = T.term_end_date            # already = start + term_length_months
      successor = the ACTIVE Term on T.seat_id with term_start_date >= scheduled_end
                  (earliest such by term_start_date ASC, created_at ASC tie-break), else none
      if successor exists and successor.term_start_date <= clock:
          # successor already seated -> clean expiry
          resolved_end = scheduled_end
          new_status   = EXPIRED
      else:
          # holdover: extend end to the earlier of successor start (if any) and the
          # holdover ceiling; this is the combinatorial min over 3 inputs.
          holdover_ceiling = scheduled_end + Board.max_holdover_days (days)
          candidate_end    = min( successor.term_start_date if successor else holdover_ceiling,
                                  holdover_ceiling )
          resolved_end = max(candidate_end, scheduled_end)
          new_status   = HOLDOVER
      T.term_end_date = resolved_end
    input_set: "the term, its seat's successor terms, Board.max_holdover_days, and the logical clock"
    constants: {}
    precision: "whole-day ISO 8601 instants"

  - name: sunshine_notice_compliance
    trigger: "on POST /civic/meetings/{id}/post-notice"
    algorithm: threshold
    formula: |
      required_by = Meeting.scheduled_date - (Board.sunshine_notice_days days)
      notice_posted_at = clock
      notice_compliant = (notice_posted_at <= required_by)   # inclusive boundary
    input_set: "the meeting's board sunshine_notice_days, the meeting scheduled_date, and the logical clock at post time"
    constants: {}
    precision: "instant comparison; boundary is inclusive (posted exactly N days before == compliant)"

  - name: disclosure_due_date
    trigger: "when the 2 DisclosureFiling rows are minted on Term creation"
    algorithm: aggregation
    formula: |
      due_date = Term.term_start_date + DISCLOSURE_DUE_DAYS (days)
    input_set: "the created term's term_start_date"
    constants:
      DISCLOSURE_DUE_DAYS: 30
    precision: "whole-day ISO 8601 instants"

  - name: confirmation_result
    trigger: "on POST /civic/appointments/{id}/confirm"
    algorithm: threshold
    formula: |
      confirmed = (yes_votes >= Board.quorum_count) and (yes_votes > no_votes)
      # not confirmed -> the confirm call is rejected with ERR_QUORUM_NOT_MET;
      # rejection of the nomination is a separate explicit /reject action.
    input_set: "yes_votes and no_votes supplied at confirm, and the board quorum_count"
    constants: {}
    precision: "integer vote counts; quorum boundary is inclusive (yes == quorum passes)"

  - name: board_attendance_index
    trigger: "on GET /civic/boards/{id}/compliance-report"
    algorithm: weighted_scoring
    formula: |
      members = [ t for t in Term where t.board_id==B.id
                  and t.status in {ACTIVE, HOLDOVER, EXPIRED, COMPLETED} ]
      if members is empty: board_attendance_index = null
      else:
        # ROUNDING ORDER IS PINNED: compute each member's EXACT (unrounded) final
        # rate, sum the exact rates, divide by member count, and round ONCE at the
        # very end. Do NOT round per-member first.
        exact_rates = [ present/(present+absent+excused)*100  (exact float, denom>0)
                        for each member term; skip terms whose denom == 0 ]
        board_attendance_index = round( sum(exact_rates) / len(exact_rates), 1 )
    input_set: "final-variant attendance of the board's served terms whose attendance denominator > 0"
    constants: {}
    precision: "1 decimal place, round_half_up, applied exactly once after averaging exact per-member rates"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number checked first)
# ============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /civic/applicants (self-registration) and /_clock/set_current_utc"
  - priority: 20
    category: auth
    check: "the acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 30
    category: existence
    check: "every resource referenced in the path and every FK in the body exists; validated left-to-right in the path first, then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 35
    category: business_referential
    check: "on POST /civic/seats with residency_requirement==DISTRICT_SPECIFIC, required_district must be non-null"
    error_id: ERR_DISTRICT_REQUIRED
    http_status: 422
    applies_to: "POST /civic/seats"
  - priority: 40
    category: state
    check: "the target resource is in a state from which the requested transition is allowed (e.g., appointment.status==NOMINATED to confirm; application.status==ELIGIBLE to nominate; vacancy.status==OPEN to apply; meeting.status==NOTICED to hold; term.status in {ACTIVE,HOLDOVER} to remove)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 42
    category: state
    check: "ownership: an Applicant acting on an Application/DisclosureFiling must be the owning applicant/member (X-User-ID matches)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /civic/applications/{id}/resubmit, POST /civic/disclosures/{id}/file"
  - priority: 50
    category: business_constraint
    check: "segregation of duties: on confirm/reject, the acting ConfirmingMember's X-User-ID must differ from appointment.nominated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /civic/appointments/{id}/confirm, POST /civic/appointments/{id}/reject"
  - priority: 55
    category: business_constraint
    check: "optimistic concurrency: expected_seat_version must equal the seat's current version"
    error_id: ERR_STALE_SEAT_VERSION
    http_status: 412
    applies_to: "POST /civic/appointments"
  - priority: 60
    category: business_referential
    check: "residency: applicant satisfies the seat's residency_requirement (IN_JURISDICTION => resides_in_jurisdiction; DISTRICT_SPECIFIC => residence_district == seat.required_district; NONE => always ok) and residency_attested==true"
    error_id: ERR_RESIDENCY_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /civic/applications"
  - priority: 62
    category: business_constraint
    check: "seat capacity: creating a Seat must not push the board's seat count above authorized_seat_count"
    error_id: ERR_SEAT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /civic/seats"
  - priority: 70
    category: business_temporal
    check: "application window: clock <= vacancy.application_deadline (inclusive) when submitting an application"
    error_id: ERR_APPLICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /civic/applications"
  - priority: 72
    category: business_temporal
    check: "term overlap: the proposed [term_start_date, term_end_date) must not overlap any ACTIVE/HOLDOVER Term on the seat; intervals are half-open so adjacency (end==next start) is allowed"
    error_id: ERR_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /civic/appointments/{id}/confirm, POST /civic/reappointments/{id}/decide"
  - priority: 74
    category: business_temporal
    check: "meeting spacing: a new Meeting on a board must be at least MEETING_MIN_GAP_HOURS (= 24) hours from any other meeting of that board (closed buffer around the scheduled instant: reject if abs(new.scheduled_date - other.scheduled_date) < 24h)"
    error_id: ERR_MEETING_TOO_CLOSE
    http_status: 409
    applies_to: "POST /civic/meetings"
  - priority: 76
    category: business_temporal
    check: "hold timing: a meeting may be held only once clock >= scheduled_date"
    error_id: ERR_MEETING_NOT_YET_DUE
    http_status: 409
    applies_to: "POST /civic/meetings/{id}/hold"
  - priority: 78
    category: business_referential
    check: "attendance context: an AttendanceRecord requires meeting.status==HELD and term.status in {ACTIVE,HOLDOVER} and meeting.board_id==term.board_id"
    error_id: ERR_MEETING_NOT_HELD
    http_status: 409
    applies_to: "POST /civic/attendance"
  - priority: 80
    category: business_constraint
    check: "quorum: on confirm, yes_votes >= board.quorum_count AND yes_votes > no_votes"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /civic/appointments/{id}/confirm"
  - priority: 82
    category: business_constraint
    check: "term limit: on reappointment approve, consecutive_term_count < board.max_consecutive_terms AND cumulative_years_served < board.max_cumulative_years"
    error_id: ERR_TERM_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /civic/reappointments/{id}/decide"
  - priority: 84
    category: business_constraint
    check: "attendance removal: a RemovalAction with reason==ATTENDANCE requires the final-variant attendance rate computed live over the term's AttendanceRecords (denominator = present+absent+excused) to be strictly below board.attendance_threshold_pct; if the term has zero attendance records the rate is treated as 100.0 (not below)"
    error_id: ERR_ATTENDANCE_ABOVE_THRESHOLD
    http_status: 422
    applies_to: "POST /civic/removals"
  - priority: 25
    category: business_constraint
    check: "field-level input validation: required fields present, enums in range, numeric constraints satisfied (e.g., yes_votes/no_votes >= 0, seat_number >= 1). Checked after authz, before existence."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [BoardClerk]
    code: 200
    input: ["to_iso8601"]
    output: "null"
    side_effects: ["advances the logical clock used by all deadline/window/expiry rules"]

  # ---- Board ----
  - method: POST
    path: "/civic/boards"
    description: "Create a board or commission"
    roles: [BoardClerk]
    code: 201
    input: ["name", "jurisdiction", "board_type", "authorized_seat_count", "quorum_count", "term_length_months", "max_consecutive_terms", "max_cumulative_years", "attendance_threshold_pct", "sunshine_notice_days", "max_holdover_days?", "is_sunshine_subject?"]
    output: Board
    side_effects: ["status defaults ACTIVE"]
  - method: GET
    path: "/civic/boards"
    description: "List boards"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Board[]
    side_effects: []
  - method: GET
    path: "/civic/boards/{id}"
    description: "Fetch a board"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: []
    output: Board
    side_effects: []
  - method: GET
    path: "/civic/boards/{id}/roster"
    description: "Computed roster: seats with their current occupant/term and occupancy counts"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: []
    output: "{ board_id: string, seats: array, filled_seat_count: integer, vacant_seat_count: integer, holdover_count: integer, active_member_count: integer }"
    side_effects: []
  - method: GET
    path: "/civic/boards/{id}/compliance-report"
    description: "Computed compliance report: board attendance index, sunshine notice compliance, disclosure delinquency"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: []
    output: "{ board_id: string, board_attendance_index: number, sunshine_meeting_count: integer, sunshine_violation_count: integer, delinquent_disclosure_count: integer }"
    side_effects: []

  # ---- Seat ----
  - method: POST
    path: "/civic/seats"
    description: "Create a seat on a board"
    roles: [BoardClerk]
    code: 201
    input: ["board_id", "seat_number", "seat_category", "residency_requirement", "required_district?"]
    output: Seat
    side_effects: ["occupancy_status defaults VACANT"]
  - method: GET
    path: "/civic/seats"
    description: "List seats, optionally by board or occupancy"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: ["board_id?", "occupancy_status?", "limit?", "offset?"]
    output: Seat[]
    side_effects: []
  - method: GET
    path: "/civic/seats/{id}"
    description: "Fetch a seat (includes version for OCC)"
    roles: [BoardClerk, PublicAuditor, AppointingAuthority]
    code: 200
    input: []
    output: Seat
    side_effects: []

  # ---- Vacancy ----
  - method: POST
    path: "/civic/vacancies"
    description: "Open a vacancy against a VACANT seat"
    roles: [BoardClerk]
    code: 201
    input: ["seat_id", "reason", "application_deadline"]
    output: Vacancy
    side_effects: ["status defaults OPEN"]
  - method: GET
    path: "/civic/vacancies"
    description: "List vacancies, optionally by seat or status"
    roles: [BoardClerk, PublicAuditor, Applicant]
    code: 200
    input: ["seat_id?", "status?", "limit?", "offset?"]
    output: Vacancy[]
    side_effects: []
  - method: GET
    path: "/civic/vacancies/{id}"
    description: "Fetch a vacancy"
    roles: [BoardClerk, PublicAuditor, Applicant]
    code: 200
    input: []
    output: Vacancy
    side_effects: []
  - method: POST
    path: "/civic/vacancies/{id}/close"
    description: "Close an OPEN vacancy without filling it"
    roles: [BoardClerk]
    code: 200
    input: []
    output: Vacancy
    side_effects: ["status OPEN -> CLOSED"]

  # ---- Applicant ----
  - method: POST
    path: "/civic/applicants"
    description: "Self-register an applicant (no auth required)"
    roles: [Applicant, BoardClerk]
    code: 201
    input: ["full_name", "email", "residence_district", "resides_in_jurisdiction", "is_registered_voter", "employer?"]
    output: Applicant
    side_effects: ["status defaults ACTIVE"]
  - method: GET
    path: "/civic/applicants/{id}"
    description: "Fetch an applicant"
    roles: [Applicant, BoardClerk, PublicAuditor]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/civic/applications"
    description: "Submit an application to an OPEN vacancy; enforces residency then window"
    roles: [Applicant]
    code: 201
    input: ["applicant_id", "vacancy_id", "residency_attested", "statement?"]
    output: Application
    side_effects: ["status defaults SUBMITTED", "return_count defaults 0"]
  - method: GET
    path: "/civic/applications"
    description: "List applications, optionally by applicant, vacancy, or status"
    roles: [BoardClerk, Applicant]
    code: 200
    input: ["applicant_id?", "vacancy_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/civic/applications/{id}"
    description: "Fetch an application"
    roles: [BoardClerk, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/civic/applications/{id}/start-review"
    description: "Move a SUBMITTED application into review"
    roles: [BoardClerk]
    code: 200
    input: []
    output: Application
    side_effects: ["status SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/civic/applications/{id}/return-for-info"
    description: "Return an UNDER_REVIEW application to the applicant for more information"
    roles: [BoardClerk]
    code: 200
    input: ["notes?"]
    output: Application
    side_effects: ["status UNDER_REVIEW -> RETURNED_FOR_INFO", "increment return_count by 1"]
  - method: POST
    path: "/civic/applications/{id}/resubmit"
    description: "Applicant resubmits a RETURNED_FOR_INFO application"
    roles: [Applicant]
    code: 200
    input: ["statement?"]
    output: Application
    side_effects: ["status RETURNED_FOR_INFO -> UNDER_REVIEW"]
  - method: POST
    path: "/civic/applications/{id}/decide-eligibility"
    description: "Clerk decides eligibility of an UNDER_REVIEW application"
    roles: [BoardClerk]
    code: 200
    input: ["eligible"]
    output: Application
    side_effects: ["status UNDER_REVIEW -> ELIGIBLE or INELIGIBLE"]

  # ---- Appointment ----
  - method: POST
    path: "/civic/appointments"
    description: "Nominate an ELIGIBLE application to a seat; OCC-guarded on the seat; supersedes any prior NOMINATED appointment for the seat"
    roles: [AppointingAuthority]
    code: 201
    input: ["application_id", "seat_id", "term_start_date", "expected_seat_version"]
    output: Appointment
    side_effects: ["set nominated_by_user_id from X-User-ID", "compute term_end_date and term_sequence_number", "set any prior NOMINATED appointment for the seat to SUPERSEDED", "increments Seat.version by 1"]
  - method: GET
    path: "/civic/appointments"
    description: "List appointments by application, seat, applicant, or status"
    roles: [BoardClerk, AppointingAuthority, ConfirmingMember]
    code: 200
    input: ["application_id?", "seat_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: GET
    path: "/civic/appointments/{id}"
    description: "Fetch an appointment"
    roles: [BoardClerk, AppointingAuthority, ConfirmingMember]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/civic/appointments/{id}/confirm"
    description: "Confirming member records the confirming vote; SoD, quorum, and term-overlap enforced; on success seats the member"
    roles: [ConfirmingMember]
    code: 200
    input: ["yes_votes", "no_votes"]
    output: Appointment
    side_effects: ["record yes_votes/no_votes/confirmed_by_user_id", "create ACTIVE Term (cascade link1)", "the new Term sets seat.occupancy_status FILLED (cascade link2)", "mint 2 PENDING DisclosureFiling rows", "set linked OPEN Vacancy to FILLED"]
  - method: POST
    path: "/civic/appointments/{id}/reject"
    description: "Confirming member rejects a NOMINATED appointment; SoD enforced"
    roles: [ConfirmingMember]
    code: 200
    input: ["reason?"]
    output: Appointment
    side_effects: ["status NOMINATED -> REJECTED", "no Term created; seat and vacancy unchanged"]

  # ---- Term ----
  - method: GET
    path: "/civic/terms"
    description: "List terms by seat, applicant, board, appointment, or status"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: ["seat_id?", "applicant_id?", "board_id?", "appointment_id?", "status?", "limit?", "offset?"]
    output: Term[]
    side_effects: []
  - method: GET
    path: "/civic/terms/{id}"
    description: "Fetch a term (provisional attendance computed on read)"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: []
    output: Term
    side_effects: []
  - method: POST
    path: "/civic/terms/{id}/expire"
    description: "Expire a term whose scheduled end has passed; resolves to EXPIRED or HOLDOVER per term_expiry_resolution"
    roles: [BoardClerk]
    code: 200
    input: []
    output: Term
    side_effects: ["ACTIVE -> EXPIRED (successor seated) sets final_attendance_rate", "ACTIVE -> HOLDOVER extends term_end_date and sets seat HOLDOVER", "HOLDOVER -> EXPIRED sets final_attendance_rate and may set seat VACANT"]

  # ---- Meeting ----
  - method: POST
    path: "/civic/meetings"
    description: "Schedule a meeting; enforces 24h spacing from other board meetings"
    roles: [BoardClerk]
    code: 201
    input: ["board_id", "scheduled_date"]
    output: Meeting
    side_effects: ["status defaults SCHEDULED"]
  - method: GET
    path: "/civic/meetings"
    description: "List meetings by board or status"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: ["board_id?", "status?", "limit?", "offset?"]
    output: Meeting[]
    side_effects: []
  - method: GET
    path: "/civic/meetings/{id}"
    description: "Fetch a meeting"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: []
    output: Meeting
    side_effects: []
  - method: POST
    path: "/civic/meetings/{id}/post-notice"
    description: "Post the public notice; computes notice_compliant against sunshine_notice_days"
    roles: [BoardClerk]
    code: 200
    input: []
    output: Meeting
    side_effects: ["status SCHEDULED -> NOTICED", "set notice_posted_at = clock", "set notice_compliant per sunshine_notice_compliance"]
  - method: POST
    path: "/civic/meetings/{id}/hold"
    description: "Mark a NOTICED meeting HELD once its scheduled_date has arrived"
    roles: [BoardClerk]
    code: 200
    input: []
    output: Meeting
    side_effects: ["status NOTICED -> HELD"]

  # ---- Attendance ----
  - method: POST
    path: "/civic/attendance"
    description: "Record a member's attendance at a HELD meeting"
    roles: [BoardClerk]
    code: 201
    input: ["term_id", "meeting_id", "presence"]
    output: AttendanceRecord
    side_effects: ["recompute term present_count/absent_count/excused_count"]
  - method: GET
    path: "/civic/attendance"
    description: "List attendance records by term or meeting"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: ["term_id?", "meeting_id?", "limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []
  - method: GET
    path: "/civic/attendance/{id}"
    description: "Fetch an attendance record"
    roles: [BoardClerk, PublicAuditor]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []

  # ---- DisclosureFiling ----
  - method: GET
    path: "/civic/disclosures"
    description: "List disclosure filings by term, board, or status"
    roles: [BoardClerk, EthicsOfficer, Applicant]
    code: 200
    input: ["term_id?", "board_id?", "status?", "limit?", "offset?"]
    output: DisclosureFiling[]
    side_effects: []
  - method: GET
    path: "/civic/disclosures/{id}"
    description: "Fetch a disclosure filing"
    roles: [BoardClerk, EthicsOfficer, Applicant]
    code: 200
    input: []
    output: DisclosureFiling
    side_effects: []
  - method: POST
    path: "/civic/disclosures/{id}/file"
    description: "Member files (or re-files a DEFICIENT) disclosure"
    roles: [Applicant]
    code: 200
    input: ["content"]
    output: DisclosureFiling
    side_effects: ["status PENDING|DEFICIENT -> FILED", "set filed_at = clock"]
  - method: POST
    path: "/civic/disclosures/{id}/review"
    description: "Ethics officer accepts or marks a FILED disclosure deficient"
    roles: [EthicsOfficer]
    code: 200
    input: ["accept"]
    output: DisclosureFiling
    side_effects: ["status FILED -> ACCEPTED (accept=true) or DEFICIENT (accept=false)"]

  # ---- RemovalAction ----
  - method: POST
    path: "/civic/removals"
    description: "Initiate removal of a seated term; ATTENDANCE reason requires final_attendance_rate below threshold"
    roles: [EthicsOfficer, AppointingAuthority]
    code: 201
    input: ["term_id", "reason", "effective_date"]
    output: RemovalAction
    side_effects: ["set initiated_by_user_id", "status defaults INITIATED"]
  - method: GET
    path: "/civic/removals"
    description: "List removal actions by term or status"
    roles: [BoardClerk, EthicsOfficer, AppointingAuthority]
    code: 200
    input: ["term_id?", "status?", "limit?", "offset?"]
    output: RemovalAction[]
    side_effects: []
  - method: GET
    path: "/civic/removals/{id}"
    description: "Fetch a removal action"
    roles: [BoardClerk, EthicsOfficer, AppointingAuthority]
    code: 200
    input: []
    output: RemovalAction
    side_effects: []
  - method: POST
    path: "/civic/removals/{id}/execute"
    description: "Execute an INITIATED removal; runs the depth-3 vacate cascade"
    roles: [AppointingAuthority]
    code: 200
    input: []
    output: RemovalAction
    side_effects: ["status INITIATED -> EXECUTED", "term -> VACATED (link1)", "seat -> VACANT (link2)", "open new Vacancy reason=REMOVAL (link3)", "close the term's open DisclosureFiling rows"]

  # ---- ReappointmentRequest ----
  - method: POST
    path: "/civic/reappointments"
    description: "Request reappointment of an incumbent whose term is EXPIRED or HOLDOVER"
    roles: [AppointingAuthority]
    code: 201
    input: ["term_id", "seat_id", "applicant_id", "requested_term_start"]
    output: ReappointmentRequest
    side_effects: ["status defaults REQUESTED"]
  - method: GET
    path: "/civic/reappointments"
    description: "List reappointment requests by term, seat, applicant, or status"
    roles: [BoardClerk, AppointingAuthority, ConfirmingMember]
    code: 200
    input: ["term_id?", "seat_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: ReappointmentRequest[]
    side_effects: []
  - method: GET
    path: "/civic/reappointments/{id}"
    description: "Fetch a reappointment request"
    roles: [BoardClerk, AppointingAuthority, ConfirmingMember]
    code: 200
    input: []
    output: ReappointmentRequest
    side_effects: []
  - method: POST
    path: "/civic/reappointments/{id}/decide"
    description: "Confirming member approves/denies reappointment; enforces term limits and term overlap; on approve mints a CONFIRMED appointment and new ACTIVE term"
    roles: [ConfirmingMember]
    code: 200
    input: ["approve"]
    output: ReappointmentRequest
    side_effects: ["snapshot consecutive_terms_at_request/cumulative_years_at_request", "approve -> APPROVED mints Appointment(CONFIRMED)+Term(ACTIVE), seat FILLED, 2 disclosures; expiring HOLDOVER term -> COMPLETED", "deny -> DENIED"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role/X-User-ID missing or role unknown on an authenticated endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not permitted to call this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an Applicant acts on an application/disclosure they do not own (X-User-ID mismatch)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or body FK references a resource that does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad enum value, or numeric constraint violated"
  - id: ERR_DISTRICT_REQUIRED
    http: 422
    condition: "seat with residency_requirement==DISTRICT_SPECIFIC created without required_district"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state that allows the requested transition (e.g., confirm a non-NOMINATED appointment, nominate a non-ELIGIBLE application, apply to a non-OPEN vacancy, hold a non-NOTICED meeting, expire a non-ACTIVE/HOLDOVER term)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the confirming/rejecting member's X-User-ID equals the appointment's nominated_by_user_id"
  - id: ERR_STALE_SEAT_VERSION
    http: 412
    condition: "expected_seat_version does not match the seat's current version on nomination"
  - id: ERR_RESIDENCY_REQUIREMENT_NOT_MET
    http: 422
    condition: "applicant fails the seat residency requirement or residency_attested is false"
  - id: ERR_SEAT_LIMIT_REACHED
    http: 409
    condition: "creating a seat would exceed the board's authorized_seat_count"
  - id: ERR_APPLICATION_WINDOW_CLOSED
    http: 422
    condition: "clock is after the vacancy application_deadline"
  - id: ERR_TERM_OVERLAP
    http: 409
    condition: "the proposed term window overlaps an existing ACTIVE/HOLDOVER term on the seat (half-open intervals)"
  - id: ERR_MEETING_TOO_CLOSE
    http: 409
    condition: "a new meeting is within 24h of another non-CANCELLED meeting on the same board"
  - id: ERR_MEETING_NOT_YET_DUE
    http: 409
    condition: "attempting to hold a meeting before its scheduled_date"
  - id: ERR_MEETING_NOT_HELD
    http: 409
    condition: "recording attendance against a meeting that is not HELD, a term not in {ACTIVE,HOLDOVER}, or a board mismatch"
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "yes_votes < board.quorum_count or yes_votes <= no_votes at confirmation"
  - id: ERR_TERM_LIMIT_EXCEEDED
    http: 422
    condition: "reappointment approval would exceed max_consecutive_terms or max_cumulative_years"
  - id: ERR_ATTENDANCE_ABOVE_THRESHOLD
    http: 422
    condition: "ATTENDANCE-reason removal requested but term.final_attendance_rate >= attendance_threshold_pct"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: BoardClerk
    description: "Administrative clerk: manages boards, seats, vacancies, application review, term expiry, meetings, attendance, and reporting. Also drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /civic/boards"
      - "POST /civic/seats"
      - "POST /civic/vacancies"
      - "POST /civic/vacancies/{id}/close"
      - "POST /civic/applications/{id}/start-review"
      - "POST /civic/applications/{id}/return-for-info"
      - "POST /civic/applications/{id}/decide-eligibility"
      - "POST /civic/terms/{id}/expire"
      - "POST /civic/meetings"
      - "POST /civic/meetings/{id}/post-notice"
      - "POST /civic/meetings/{id}/hold"
      - "POST /civic/attendance"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across boards, seats, vacancies, applicants, applications, appointments, terms, meetings, attendance, disclosures, removals, reappointments, roster, compliance-report"
      - "POST /civic/applicants"
  - name: AppointingAuthority
    description: "Nominating authority (e.g., mayor/governor). Nominates candidates, initiates and executes removals, and requests reappointments. Cannot cast confirming votes (SoD)."
    identity: "opaque"
    exclusive_operations:
      - "POST /civic/appointments"
      - "POST /civic/removals/{id}/execute"
      - "POST /civic/reappointments"
    shared_operations:
      - "POST /civic/removals (with EthicsOfficer)"
      - "GET reads on seats, appointments, removals, reappointments, terms"
  - name: ConfirmingMember
    description: "Member of the confirming body who records confirm/reject votes and decides reappointments. Cannot confirm an appointment they nominated (SoD)."
    identity: "opaque"
    exclusive_operations:
      - "POST /civic/appointments/{id}/confirm"
      - "POST /civic/appointments/{id}/reject"
      - "POST /civic/reappointments/{id}/decide"
    shared_operations:
      - "GET reads on appointments, reappointments"
  - name: EthicsOfficer
    description: "Independent ethics officer who reviews financial-disclosure and ethics filings and may initiate removals for ethics violations."
    identity: "opaque"
    exclusive_operations:
      - "POST /civic/disclosures/{id}/review"
    shared_operations:
      - "POST /civic/removals (with AppointingAuthority)"
      - "GET reads on disclosures, removals"
  - name: Applicant
    description: "A member of the public applying for a seat, and once seated the member who files disclosures. X-User-ID is the Applicant.id."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /civic/applications"
      - "POST /civic/applications/{id}/resubmit"
      - "POST /civic/disclosures/{id}/file"
    shared_operations:
      - "POST /civic/applicants (self-registration)"
      - "GET reads on own applications, own disclosures, vacancies"
  - name: PublicAuditor
    description: "Read-only public/oversight role for transparency: rosters, compliance reports, and public listings."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET reads on boards, seats, vacancies, applicants, terms, meetings, attendance, roster, compliance-report"
