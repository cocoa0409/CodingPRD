          trigger:
            - { call: "PATCH /v1/buildings/${b1}", payload: { expected_building_version: "${b_v}", address: "95 Main St (Suite A)" }, as: BuildingOwner, as_user_id: "${o1}", captures: { v_after: $.data.version } }
            - { call: "PATCH /v1/buildings/${b1}", payload: { expected_building_version: "${b_v}", address: "95 Main St (Suite B)" }, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
          assert:
            - "first PATCH succeeds: version == 2"
            - "second PATCH with the same (now stale) captured version: err == ERR_STALE_VERSION (412); address unchanged from the first write"

