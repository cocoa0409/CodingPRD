        grounds: [errors.ERR_DUNNING_LIMIT_REACHED, validations.priority_63, validations.priority_22]
        distinguishing_aspect: "Because the third dunning failure itself forces SUSPENDED, the fourth retry can only ever answer 409 ERR_INVALID_STATE -- ERR_DUNNING_LIMIT_REACHED is structurally shadowed by the state band and this instance pins that outcome."
        test_recipe:
          setup:
            - "Canonical delivered order with a STANDARD plan; the cycle charge declines once (PAST_DUE, dunning 1) and two retries decline (dunning 2, then the third failure suspends the plan and cancels non-safety rollouts)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /inventory-pools", payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }, as: PlatformAdmin, captures: { pool_mo: "$.data.id" } }
            - { call: "POST /inventory-pools/${pool_mo}/restock", payload: { units: 5 }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-X032", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "x32@x.test", full_name: "X Dunning", age_years: 70 }, as: CareOpsAgent, captures: { pat_x32: "$.data.id" } }
            - { call: "POST /patients/${pat_x32}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_x32}", captures: { scr_x32: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_x32}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_x32}" }
            - { call: "POST /screening-sessions/${scr_x32}/submit", payload: {}, as: Patient, as_user_id: "${pat_x32}" }
            - { call: "POST /patients/${pat_x32}/device-orders", payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 200000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 1495 }, as: Patient, as_user_id: "${pat_x32}", captures: { ord_x32: "$.data.id" } }
            - { call: "POST /care-plan-subscriptions", payload: { patient_id: "${pat_x32}", device_order_id: "${ord_x32}", plan_tier: "STANDARD", base_fee_cents: 9900, firmware_auto_update_enabled: true }, as: Patient, as_user_id: "${pat_x32}", captures: { sub_x32: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_x32}", outcome: "AUTHORIZED" }, as: PlatformAdmin }
            - { call: "POST /device-orders/${ord_x32}/confirm-fit", payload: {}, as: CareOpsAgent }
            - { call: "POST /device-orders/${ord_x32}/ship", payload: {}, as: CareOpsAgent }
            - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord_x32}", event: "DELIVERED" }, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /care-plan-subscriptions/${sub_x32}/run-billing-cycle", payload: { charge_outcome: "DECLINED" }, as: PlatformAdmin, note: "402 ERR_PAYMENT_DECLINED; PAST_DUE, dunning_attempts 1" }
            - { call: "POST /care-plan-subscriptions/${sub_x32}/retry-payment", payload: { charge_outcome: "DECLINED" }, as: Patient, as_user_id: "${pat_x32}", note: "402; dunning_attempts 2" }
            - { call: "POST /care-plan-subscriptions/${sub_x32}/retry-payment", payload: { charge_outcome: "DECLINED" }, as: Patient, as_user_id: "${pat_x32}", note: "402; dunning_attempts 3 -> SUSPENDED" }
          trigger:
            - { call: "POST /care-plan-subscriptions/${sub_x32}/retry-payment", payload: { charge_outcome: "DECLINED" }, as: Patient, as_user_id: "${pat_x32}" }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_INVALID_STATE\" (the state band at priority 22 pre-empts ERR_DUNNING_LIMIT_REACHED at priority 63)"
            - "GET /care-plan-subscriptions/${sub_x32} returns data.status == \"SUSPENDED\", data.dunning_attempts == 3 and data.cycle_ordinal == 0"

