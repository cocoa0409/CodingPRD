              payload: { class_number: 201, name: "Open Jumper 1.20m", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1669, max_entries: 30 }
              as: ShowSecretary
              captures: { class201_id: $.data.id }
            - call: "POST /shows/${show2_id}/license-submission"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show2_id}/license-decision"
              payload: { decision: "DENY", correction_note: "Officials panel does not meet level requirements." }
              as: FederationOfficer
          trigger:
            - call: "POST /shows/${show1_id}/license-submission"
              payload: {}
