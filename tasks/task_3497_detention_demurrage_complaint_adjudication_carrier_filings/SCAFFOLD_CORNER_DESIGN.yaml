              payload: { invoice_number: "INV-SC-1", charge_basis: "SERVICE_CONTRACT", service_contract_id: "${sc_id}", billed_party_shipper_id: "${shipper2_id}", container_number: "MSKU9200005", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-09T00:00:00Z", last_accrual_date: "2026-09-09T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_party: $.data.error_id }
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-SC-2", charge_basis: "SERVICE_CONTRACT", service_contract_id: "${sc_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9200006", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-09T00:00:00Z", last_accrual_date: "2026-09-09T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_sc: $.data.id }
          assert:
            - "billing ${shipper2_id} under S1's contract fails: 422 ERR_BILLED_PARTY_NOT_CONTRACT_PARTY"
            - "billing the contract shipper succeeds: Invoice.${inv_sc}.amount_cents == 24000 (return 2026-09-09 minus free_time_end 2026-09-07 = 2 days x 12000) with free_time_days == 3 and per_diem_rate_cents == 12000 copied from the contract"

      - name: complaint_party_and_respondent_mismatches_rejected
        claim_type: Violation → Error
        grounds:
