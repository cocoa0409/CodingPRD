            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM7604", origin: "DEN", destination: "MKE", scheduled_departure_utc: "2026-09-05T08:00:00Z", scheduled_arrival_utc: "2026-09-05T09:00:00Z", planned_block_hours: 1.000 }
