scenario: |
  Generate task harder than expert level!

  2448. Vehicle Service Information & Repair Data Access (independent repair information platform):
  manufacturer service information licensing with per-vehicle or subscription terms, coverage mapping
  across makes, models and systems with gap identification, diagnostic tool and security credential
  provisioning for immobilizer and module programming, technician identity verification and audit
  logging required for secure gateway access, right-to-repair obligations on data availability and
  pricing parity, repair procedure updates, technical service bulletin ingestion and version control,
  calibration requirements documentation for advanced driver assistance systems, subscription tiering
  and shop-level entitlement management

domain_name: vehicle-service-information-access
api_prefix: "/"

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  entity_topology_note: |
    SeatAssignment is a junction between Technician and ShopEntitlement (many-to-many);
    Publication is a junction-shaped cell over (VehicleModel x SystemArea); ModuleProgrammingJob
    references both its GatewaySession and a pinned PublicationVersion across aggregate
    boundaries. Only PublicationVersion-under-Publication uses a nested URL; every other
    relationship is a peer FK reference resolved by filtered lists.
  state_machine_shape: parallel
  state_machine_shape_note: |
    PublicationVersion carries two independent state dimensions (review_status x
    distribution_status). License and ModuleProgrammingJob are cyclic. ShopEntitlement is
    branching (ACTIVE -> {LAPSED, CANCELLED}) with divergent side-effect sets per branch.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - polymorphic
    - cross_aggregate
  relationship_patterns_note: |
    polymorphic: AuditEvent.subject_entity + AuditEvent.subject_id address any of six entity
    types and are deliberately NOT declared as a foreign key.
  role_model: segregation_of_duties
  role_model_note: |
    A ContentPublisher who validated a PublicationVersion may not be the ContentPublisher who
    publishes it (ERR_SEGREGATION_OF_DUTIES). ShopManager and Technician are entity-backed and
    scope-checked; PlatformAdmin, ContentPublisher and ComplianceOfficer are opaque operators
    with disjoint exclusive operations.
  consistency_model: immediate
  difficulty_level: expert_plus
  difficulty_level_note: |
    Above the Expert band on purpose: 14 entities, 53 endpoints, 7 state machines (3 non-linear),
    6 calculations (3 with divergent variants), 2 OCC parents, 2 conserved-quantity invariants.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Manufacturer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: OEM display name
        constraints: "1..120 chars"
      - name: oem_code
        type: string
        source: input
        description: Short OEM code used in coverage reports
        constraints: "2..8 chars, uppercase A-Z0-9, globally unique"
      - name: region
        type: enum
        source: input
        description: Regulatory region the OEM's right-to-repair obligation is evaluated under
        constraints: "NA | EU | APAC"
      - name: independent_list_monthly_cents
        type: integer
        source: input
        description: List monthly price the OEM charges independent repair shops for service information
        constraints: ">= 1"
      - name: independent_covered_system_count
        type: integer
        source: input
        description: Number of vehicle systems included in the independent-shop offer
        constraints: ">= 1"
      - name: oem_dealer_monthly_cents
        type: integer
        source: input
        description: Monthly price the OEM charges its own franchised dealers for the same data
        constraints: ">= 1"
      - name: oem_dealer_covered_system_count
        type: integer
        source: input
        description: Number of vehicle systems included in the franchised-dealer offer
        constraints: ">= 1"
      - name: parity_index
        type: number
        source: computed
        description: "LIST_BASIS pricing-parity ratio; see calculations.parity_index"
        constraints: "4 decimal places, round_half_up"
      - name: parity_status
        type: enum
        source: computed
        description: "Right-to-repair pricing-parity verdict derived from parity_index vs PARITY_MAX_INDEX"
        constraints: "COMPLIANT | NON_COMPLIANT"
        default: COMPLIANT

  - name: VehicleModel
    parent: Manufacturer
    common_fields: false
    entity_kind: configuration
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the OEM that builds this model"
      - name: model_code
        type: string
        source: input
        description: Model code used in coverage cells
        constraints: "1..24 chars, unique per (manufacturer_id, model_year)"
      - name: model_year
        type: integer
        source: input
        description: Model year of this vehicle model row
        constraints: "1990..2035"

  - name: SystemArea
    parent: null
    common_fields: false
    entity_kind: configuration
    fields:
      - name: code
        type: string
        source: input
        description: Vehicle system area code used in coverage cells and gap reports
        constraints: "2..24 chars, uppercase A-Z_ , globally unique"
      - name: name
        type: string
        source: input
        description: Human-readable system area name
        constraints: "1..80 chars"
      - name: requires_calibration_doc
        type: boolean
        source: input
        description: When true a coverage cell for this system area also needs a VALIDATED+PUBLISHED CALIBRATION_DOC publication (ADAS obligation)
        default: false
      - name: requires_security_credential
        type: boolean
        source: input
        description: When true a ModuleProgrammingJob touching this system area needs a secure-gateway credential token on its session
        default: false

  - name: License
    parent: Manufacturer
    common_fields: true
    entity_kind: resource
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the OEM granting this service-information license"
      - name: license_model
        type: enum
        source: input
        description: Commercial term shape offered to shops under this license
        constraints: "SUBSCRIPTION | PER_VEHICLE | EITHER"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: Term fee charged for one SUBSCRIPTION entitlement window under this license
        constraints: ">= 1"
      - name: per_vehicle_fee_cents
        type: integer
        source: input
        description: Fee charged per VIN of quota for one PER_VEHICLE entitlement under this license
        constraints: ">= 1"
      - name: seat_cap
        type: integer
        source: input
        description: Maximum seats_total a single ShopEntitlement under this license may request
        constraints: "1..500"
      - name: covered_system_area_ids
        type: array
        source: input
        description: "Array of SystemArea.id values this license covers; these are the charge lines of calculations.entitlement_charge and the system axis of coverage cells"
        constraints: "1..12 unique SystemArea.id values"
      - name: effective_start
        type: datetime
        source: input
        description: ISO 8601 UTC instant this license's coverage begins
      - name: effective_end
        type: datetime
        source: input
        description: ISO 8601 UTC instant this license's coverage ends; must be > effective_start
      - name: status
        type: enum
        source: system
        description: License lifecycle state
        constraints: "DRAFT | ACTIVE | SUSPENDED | TERMINATED"
        default: DRAFT
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded by the most recent suspend or terminate call; null while DRAFT/ACTIVE and never suspended
        default: null

  - name: Shop
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Independent repair shop name
        constraints: "1..120 chars"
      - name: tier
        type: enum
        source: input
        description: Subscription tier of the shop; selects TIER_MULT in calculations.entitlement_charge
        constraints: "BASIC | PRO | ENTERPRISE"
      - name: funded_credit_total_cents
        type: integer
        source: system
        description: Lifetime sum of every credit-funding amount_cents accepted for this shop; never decreases
        default: 0
      - name: data_credit_balance_cents
        type: integer
        source: system
        description: Unspent data credit; debited by ShopEntitlement.charged_cents at entitlement creation and credited back by (charged_cents - settled_cents) at settlement
        default: 0
      - name: gateway_fee_accrued_cents
        type: integer
        source: system
        description: Running sum of GatewaySession.total_access_fee_cents over sessions of this shop in status COMPLETED, EXPIRED or TERMINATED; an accrual, never netted against data_credit_balance_cents
        default: 0
      - name: coverage_completeness_pct
        type: number
        source: computed
        description: "Stored EFFECTIVE-basis value of calculations.shop_coverage_completeness; recomputed on every entitlement status change and on every PublicationVersion validate/publish/recall"
        constraints: "0.00..100.00, 2 decimal places, round_half_up"
        default: 0.00

  - name: Technician
    parent: Shop
    common_fields: true
    entity_kind: resource
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; employer shop of this technician"
      - name: full_name
        type: string
        source: input
        description: Technician legal name as presented for identity verification
        constraints: "1..120 chars"
      - name: identity_status
        type: enum
        source: system
        description: Identity-verification state gating secure-gateway credential issuance
        constraints: "UNVERIFIED | VERIFIED | SUSPENDED | REVOKED"
        default: UNVERIFIED
      - name: credential_expires_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the technician's secure-gateway credential lapses; re-stamped by every verify call
      - name: identity_document_ref
        type: string
        source: system
        description: Reference of the identity document accepted by the most recent verify call; null while UNVERIFIED and never verified
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: Opaque ComplianceOfficer X-User-ID recorded by the most recent verify call
        default: null

  - name: ShopEntitlement
    parent: Shop
    common_fields: true
    entity_kind: resource
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; the shop holding this entitlement"
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the manufacturer license this entitlement draws coverage from"
      - name: entitlement_model
        type: enum
        source: input
        description: Commercial term chosen for this entitlement; must be permitted by License.license_model
        constraints: "SUBSCRIPTION | PER_VEHICLE"
      - name: seats_total
        type: integer
        source: input
        description: Seats purchased on this entitlement; must be <= License.seat_cap
        constraints: "1..500"
      - name: vin_quota
        type: integer
        source: input
        description: VIN quota purchased; required and >= 1 when entitlement_model is PER_VEHICLE, must be 0 when SUBSCRIPTION
        default: 0
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the coverage window; must be >= License.effective_start
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the coverage window; must be > window_start and <= License.effective_end
      - name: status
        type: enum
        source: system
        description: Entitlement lifecycle state
        constraints: "PENDING | ACTIVE | LAPSED | CANCELLED"
        default: PENDING
      - name: charged_cents
        type: integer
        source: computed
        description: "Provisional charge stamped at creation by calculations.entitlement_charge variant PROVISIONAL"
      - name: settled_cents
        type: integer
        source: computed
        description: "Final charge stamped at settlement by calculations.entitlement_charge variant FINAL; 0 while settlement_status is UNSETTLED"
        default: 0
      - name: settlement_status
        type: enum
        source: system
        description: Whether the FINAL variant has been applied and the refund credited
        constraints: "UNSETTLED | SETTLED"
        default: UNSETTLED
      - name: seats_assigned
        type: integer
        source: computed
        description: "Count of SeatAssignment rows on this entitlement with status == ACTIVE"
        default: 0
      - name: seats_available
        type: integer
        source: computed
        description: "seats_total - seats_assigned; the seat-conservation invariant of calculations.seat_ledger"

  - name: SeatAssignment
    parent: ShopEntitlement
    common_fields: true
    entity_kind: resource
    fields:
      - name: entitlement_id
        type: string
        source: input
        description: "FK -> ShopEntitlement.id; the entitlement whose seat is consumed"
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the seated technician; must belong to ShopEntitlement.shop_id"
      - name: status
        type: enum
        source: system
        description: Seat lifecycle state
        constraints: "ACTIVE | REVOKED | SUPERSEDED"
        default: ACTIVE
      - name: revocation_reason
        type: string
        source: system
        description: Reason recorded when the seat moves to REVOKED, either by an explicit revoke call or by a cascade
        default: null

  - name: DiagnosticTool
    parent: Shop
    common_fields: true
    entity_kind: resource
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; owning shop of this scan tool"
      - name: serial_no
        type: string
        source: input
        description: Tool serial number
        constraints: "4..40 chars, unique per shop_id"
      - name: oem_attestation_expires_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant this tool's OEM security attestation lapses; sessions cannot be activated at or after it
      - name: status
        type: enum
        source: system
        description: Tool availability state
        constraints: "IDLE | OCCUPIED"
        default: IDLE
      - name: occupied_by_session_id
        type: string
        source: system
        description: Identifier of the GatewaySession currently holding this tool; null when status is IDLE
        default: null

  - name: Publication
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: vehicle_model_id
        type: string
        source: input
        description: "FK -> VehicleModel.id; the model axis of this publication's coverage cell"
      - name: system_area_id
        type: string
        source: input
        description: "FK -> SystemArea.id; the system axis of this publication's coverage cell"
      - name: publication_type
        type: enum
        source: input
        description: Kind of service information carried by this publication
        constraints: "REPAIR_PROCEDURE | TSB | CALIBRATION_DOC"
      - name: current_version_no
        type: integer
        source: computed
        description: Highest version_no minted under this publication; 0 before the first version
        default: 0
      - name: published_version_id
        type: string
        source: computed
        description: Identifier of the sole child PublicationVersion whose distribution_status is PUBLISHED, or null when none is
        default: null

  - name: PublicationVersion
    parent: Publication
    common_fields: true
    entity_kind: resource
    fields:
      - name: publication_id
        type: string
        source: input
        description: "FK -> Publication.id; the publication this version belongs to"
      - name: version_no
        type: integer
        source: system
        description: Monotonic per-publication version number, starting at 1
      - name: source_tsb_ref
        type: string
        source: input
        description: Technical service bulletin reference this version was ingested from
        constraints: "1..40 chars"
      - name: calibration_procedure_ref
        type: string
        source: input
        description: ADAS calibration procedure reference; required when the parent publication_type is CALIBRATION_DOC
        default: null
      - name: review_status
        type: enum
        source: system
        description: "Editorial dimension of this version, independent of distribution_status"
        constraints: "DRAFT | VALIDATED"
        default: DRAFT
      - name: distribution_status
        type: enum
        source: system
        description: "Availability dimension of this version, independent of review_status"
        constraints: "WITHHELD | PUBLISHED | SUPERSEDED | RECALLED"
        default: WITHHELD
      - name: validated_by_user_id
        type: string
        source: system
        description: Opaque ContentPublisher X-User-ID that moved review_status to VALIDATED; null while DRAFT
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: Opaque ContentPublisher X-User-ID that moved distribution_status to PUBLISHED; null while never published
        default: null
      - name: active_pin_count
        type: integer
        source: computed
        description: "Count of ModuleProgrammingJob rows pinned to this version with status IN {QUEUED, IN_PROGRESS}"
        default: 0

  - name: GatewaySession
    parent: SeatAssignment
    common_fields: true
    entity_kind: resource
    fields:
      - name: seat_assignment_id
        type: string
        source: input
        description: "FK -> SeatAssignment.id; the seat that entitles this secure-gateway session"
      - name: diagnostic_tool_id
        type: string
        source: input
        description: "FK -> DiagnosticTool.id; the tool occupied by this session"
      - name: vin
        type: string
        source: input
        description: Vehicle identification number this session is scoped to
        constraints: "exactly 17 chars, uppercase A-HJ-NPR-Z0-9"
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the tool occupation window
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the tool occupation window; must be > window_start
      - name: status
        type: enum
        source: system
        description: Session lifecycle state
        constraints: "REQUESTED | ACTIVE | COMPLETED | EXPIRED | TERMINATED"
        default: REQUESTED
      - name: credential_token
        type: string
        source: system
        description: Secure-gateway credential minted at activation; null while REQUESTED
        default: null
      - name: base_subtotal_cents
        type: integer
        source: computed
        description: "Step 1 of calculations.gateway_access_fee; stamped at session termination, expiry or completion"
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: "Step 3 of calculations.gateway_access_fee, keyed on base_subtotal_cents"
        default: 0
      - name: surcharge_cents
        type: integer
        source: computed
        description: "Step 4 of calculations.gateway_access_fee, keyed on base_subtotal_cents"
        default: 0
      - name: total_access_fee_cents
        type: integer
        source: computed
        description: "Step 5 of calculations.gateway_access_fee"
        default: 0
      - name: termination_reason
        type: string
        source: system
        description: Reason recorded when the session moves to TERMINATED by cascade
        default: null

  - name: ModuleProgrammingJob
    parent: GatewaySession
    common_fields: true
    entity_kind: resource
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> GatewaySession.id; the secure-gateway session this job runs under"
      - name: job_type
        type: enum
        source: input
        description: Kind of module work performed
        constraints: "IMMOBILIZER_KEY | MODULE_FLASH | ADAS_CALIBRATION"
      - name: pinned_publication_version_id
        type: string
        source: input
        description: "FK -> PublicationVersion.id; the procedure version this job is pinned to at creation and re-pinned to on repin"
      - name: status
        type: enum
        source: system
        description: Job lifecycle state
        constraints: "QUEUED | IN_PROGRESS | REVALIDATION_REQUIRED | COMPLETED | ABORTED"
        default: QUEUED
      - name: repin_count
        type: integer
        source: system
        description: Number of successful repin calls on this job
        default: 0
      - name: abort_reason
        type: string
        source: system
        description: Reason recorded when the job moves to ABORTED by cascade
        default: null

  - name: AuditEvent
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: actor_role
        type: enum
        source: system
        description: X-User-Role of the request that produced this event, or SYSTEM for cascade-produced events
        constraints: "PlatformAdmin | ContentPublisher | ComplianceOfficer | ShopManager | Technician | SYSTEM"
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the request that produced this event; null for SYSTEM
        default: null
      - name: subject_entity
        type: enum
        source: system
        description: Entity type of the audited subject; polymorphic pair with subject_id and deliberately not a declared foreign key
        constraints: "Technician | SeatAssignment | GatewaySession | ModuleProgrammingJob | PublicationVersion | License | ShopEntitlement"
      - name: subject_id
        type: string
        source: system
        description: Identifier of the audited subject row; polymorphic pair with subject_entity and deliberately not a declared foreign key
      - name: event_type
        type: enum
        source: system
        description: Audited action
        constraints: "TECHNICIAN_VERIFIED | TECHNICIAN_SUSPENDED | SEAT_ASSIGNED | SEAT_REVOKED | SESSION_CREDENTIAL_ISSUED | SESSION_COMPLETED | SESSION_TERMINATED | JOB_STARTED | JOB_COMPLETED | JOB_ABORTED | JOB_REVALIDATION_REQUIRED | VERSION_PUBLISHED | VERSION_RECALLED | LICENSE_TERMINATED | ENTITLEMENT_SETTLED"
      - name: detail
        type: string
        source: system
        description: Short machine-readable detail string, e.g. "vin=1HGCM82633A004352" or "reason=..."
        default: null
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant (current_utc) at which the audited action was applied

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: License
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /licenses/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "License.status == DRAFT"
          - "Manufacturer(license.manufacturer_id).parity_status == COMPLIANT else ERR_PARITY_NON_COMPLIANT"
          - "every id in License.covered_system_area_ids resolves to a SystemArea row else ERR_REFERENCED_RESOURCE_NOT_FOUND"
        side_effects:
          - "License.status = ACTIVE"
          - "increments License.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licenses/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "License.status == ACTIVE"
        side_effects:
          - "License.status = SUSPENDED; License.suspension_reason = request.reason"
          - "no cascade to ShopEntitlement rows: entitlements stay ACTIVE but POST /entitlements and POST /entitlements/{id}/activate against this license are refused with ERR_LICENSE_NOT_ACTIVE"
          - "increments License.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licenses/{id}/activate"
        actor: PlatformAdmin
        note: "cycle back — reinstatement re-runs the parity gate, so a license suspended while COMPLIANT cannot be reinstated after its OEM drifts to NON_COMPLIANT"
        preconditions:
          - "License.status == SUSPENDED"
          - "Manufacturer(license.manufacturer_id).parity_status == COMPLIANT else ERR_PARITY_NON_COMPLIANT"
        side_effects:
          - "License.status = ACTIVE; License.suspension_reason is left as-is for audit"
          - "increments License.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licenses/{id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "License.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "License.status = TERMINATED; License.suspension_reason = request.reason"
          - "CASCADE HOP 1 — every ShopEntitlement with license_id == this License and status == ACTIVE transitions ACTIVE -> LAPSED, running calculations.entitlement_charge variant FINAL: settled_cents stamped, settlement_status = SETTLED, Shop.data_credit_balance_cents += (charged_cents - settled_cents), AuditEvent ENTITLEMENT_SETTLED appended, Shop.coverage_completeness_pct recomputed"
          - "CASCADE HOP 2 — caused by HOP 1: every SeatAssignment on each just-LAPSED entitlement with status == ACTIVE transitions ACTIVE -> REVOKED with revocation_reason = 'LICENSE_TERMINATED', decrementing that entitlement's seats_assigned and appending AuditEvent SEAT_REVOKED"
          - "CASCADE HOP 3 — caused by HOP 2: every GatewaySession whose seat_assignment_id is a just-REVOKED seat and whose status == ACTIVE transitions ACTIVE -> TERMINATED with termination_reason = 'SEAT_REVOKED', stamping calculations.gateway_access_fee, adding total_access_fee_cents to Shop.gateway_fee_accrued_cents, releasing its DiagnosticTool (status = IDLE, occupied_by_session_id = null) and appending AuditEvent SESSION_TERMINATED"
          - "AuditEvent LICENSE_TERMINATED appended for the license itself"
          - "increments License.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /licenses/{id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "License.status == SUSPENDED"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED cascade above"
          - "increments License.version by 1"

  - entity: Technician
    initial_state: UNVERIFIED
    terminal_states: [REVOKED]
    shape: cyclic
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /technicians/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "Technician.identity_status IN {UNVERIFIED, SUSPENDED}"
          - "request.credential_expires_at > current_utc else ERR_SECURITY_CREDENTIAL_EXPIRED"
        side_effects:
          - "Technician.identity_status = VERIFIED; identity_document_ref and credential_expires_at re-stamped from the request; verified_by_user_id = X-User-ID"
          - "AuditEvent TECHNICIAN_VERIFIED appended"
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /technicians/{id}/verify"
        actor: ComplianceOfficer
        note: "cycle back — re-verification after a suspension does NOT restore the seats or sessions the suspension cascade tore down"
        preconditions:
          - "Technician.identity_status == SUSPENDED"
          - "request.credential_expires_at > current_utc else ERR_SECURITY_CREDENTIAL_EXPIRED"
        side_effects:
          - "Technician.identity_status = VERIFIED; credential_expires_at re-stamped"
          - "SeatAssignment rows revoked by the earlier suspension stay REVOKED; GatewaySession rows terminated by it stay TERMINATED"
          - "AuditEvent TECHNICIAN_VERIFIED appended"
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /technicians/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Technician.identity_status IN {UNVERIFIED, VERIFIED}"
        side_effects:
          - "Technician.identity_status = SUSPENDED"
          - "CASCADE HOP 1 — every SeatAssignment with technician_id == this Technician and status == ACTIVE transitions ACTIVE -> REVOKED with revocation_reason = 'TECHNICIAN_SUSPENDED', decrementing its entitlement's seats_assigned and appending AuditEvent SEAT_REVOKED"
          - "CASCADE HOP 2 — caused by HOP 1: every GatewaySession whose seat_assignment_id is a just-REVOKED seat and whose status == ACTIVE transitions ACTIVE -> TERMINATED with termination_reason = 'TECHNICIAN_SUSPENDED', stamping calculations.gateway_access_fee, adding total_access_fee_cents to Shop.gateway_fee_accrued_cents, releasing its DiagnosticTool and appending AuditEvent SESSION_TERMINATED"
          - "CASCADE HOP 3 — caused by HOP 2: every ModuleProgrammingJob whose session_id is a just-TERMINATED session and whose status IN {QUEUED, IN_PROGRESS} transitions to ABORTED with abort_reason = 'SESSION_TERMINATED' and appends AuditEvent JOB_ABORTED"
          - "CASCADE HOP 4 — caused by HOP 3: the PublicationVersion pinned by each just-ABORTED job has its active_pin_count decremented by 1"
          - "AuditEvent TECHNICIAN_SUSPENDED appended for the technician itself"
      - from: UNVERIFIED
        to: SUSPENDED
        trigger: "POST /technicians/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Technician.identity_status == UNVERIFIED"
        side_effects:
          - "identical to the VERIFIED -> SUSPENDED cascade above"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /technicians/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "Technician.identity_status == SUSPENDED"
        side_effects:
          - "Technician.identity_status = REVOKED (terminal); credential_expires_at left as-is for audit"
          - "no further cascade: the suspension that preceded it already revoked the seats and terminated the sessions"

  - entity: ShopEntitlement
    initial_state: PENDING
    terminal_states: [LAPSED, CANCELLED]
    shape: branching
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /entitlements/{id}/activate"
        actor: ShopManager
        preconditions:
          - "ShopEntitlement.status == PENDING"
          - "License(entitlement.license_id).status == ACTIVE else ERR_LICENSE_NOT_ACTIVE"
        side_effects:
          - "ShopEntitlement.status = ACTIVE"
          - "Shop.coverage_completeness_pct recomputed (this entitlement's cells now enter the coverage denominator)"
          - "increments ShopEntitlement.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /entitlements/{id}/cancel"
        actor: ShopManager
        note: "branch A of the fork — shop-initiated exit; refund is prorated by elapsed coverage"
        preconditions:
          - "ShopEntitlement.status IN {PENDING, ACTIVE}"
        side_effects:
          - "ShopEntitlement.status = CANCELLED"
          - "runs calculations.entitlement_charge variant FINAL: settled_cents stamped, settlement_status = SETTLED"
          - "Shop.data_credit_balance_cents += (charged_cents - settled_cents)"
          - "every SeatAssignment on this entitlement with status == ACTIVE transitions to REVOKED with revocation_reason = 'ENTITLEMENT_CANCELLED'; each such revocation terminates that seat's ACTIVE GatewaySession exactly as in the License termination cascade HOP 3"
          - "Shop.coverage_completeness_pct recomputed"
          - "AuditEvent ENTITLEMENT_SETTLED appended"
          - "increments ShopEntitlement.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /entitlements/{id}/cancel"
        actor: ShopManager
        preconditions:
          - "ShopEntitlement.status == PENDING"
        side_effects:
          - "identical to ACTIVE -> CANCELLED, except that a PENDING entitlement whose window has not started yields elapsed_days = 0 and therefore settled_cents = 0 and a full refund"
          - "increments ShopEntitlement.version by 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "system cascade from POST /licenses/{id}/terminate"
        actor: system
        note: "branch B of the fork — same FINAL settlement arithmetic as CANCELLED, but the divergent side-effect set: revocation_reason is LICENSE_TERMINATED, no ShopManager actor is recorded, and the AuditEvent actor_role is SYSTEM"
        preconditions:
          - "License(entitlement.license_id) is transitioning to TERMINATED"
          - "ShopEntitlement.status == ACTIVE"
        side_effects:
          - "ShopEntitlement.status = LAPSED"
          - "runs calculations.entitlement_charge variant FINAL; settled_cents stamped, settlement_status = SETTLED, refund credited"
          - "seat and session cascade per License termination HOPs 2 and 3"
          - "Shop.coverage_completeness_pct recomputed"
          - "AuditEvent ENTITLEMENT_SETTLED appended with actor_role = SYSTEM"
          - "increments ShopEntitlement.version by 1"

  - entity: SeatAssignment
    initial_state: ACTIVE
    terminal_states: [REVOKED, SUPERSEDED]
    shape: branching
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /seat-assignments (re-seat of the same (entitlement_id, technician_id) pair)"
        actor: ShopManager
        note: "the supersede branch is why POST /seat-assignments is an OCC write — see concurrency_rules.seat-create-stale-entitlement"
        preconditions:
          - "an ACTIVE SeatAssignment already exists for the same (entitlement_id, technician_id) pair"
        side_effects:
          - "prior SeatAssignment.status = SUPERSEDED"
          - "ShopEntitlement.seats_assigned unchanged (one ACTIVE row replaces another)"
          - "any GatewaySession on the superseded seat with status == REQUESTED stays REQUESTED but can never be activated (its seat is no longer ACTIVE) — activation is refused with ERR_INVALID_STATE"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /seat-assignments/{id}/revoke"
        actor: ShopManager
        preconditions:
          - "SeatAssignment.status == ACTIVE"
        side_effects:
          - "SeatAssignment.status = REVOKED; revocation_reason = request.reason"
          - "ShopEntitlement.seats_assigned -= 1; seats_available recomputed; increments ShopEntitlement.version by 1"
          - "every GatewaySession on this seat with status == ACTIVE transitions ACTIVE -> TERMINATED with termination_reason = 'SEAT_REVOKED', stamping calculations.gateway_access_fee, accruing the fee on the shop, releasing the tool, aborting its QUEUED/IN_PROGRESS jobs and decrementing each aborted job's pinned version active_pin_count"
          - "AuditEvent SEAT_REVOKED appended"
      - from: ACTIVE
        to: REVOKED
        trigger: "system cascade from POST /technicians/{id}/suspend, POST /entitlements/{id}/cancel, or POST /licenses/{id}/terminate"
        actor: system
        preconditions:
          - "SeatAssignment.status == ACTIVE"
        side_effects:
          - "same as the explicit revoke, with revocation_reason set to 'TECHNICIAN_SUSPENDED', 'ENTITLEMENT_CANCELLED' or 'LICENSE_TERMINATED' respectively and AuditEvent actor_role = SYSTEM"

  - entity: PublicationVersion
    initial_state: "review_status=DRAFT x distribution_status=WITHHELD"
    terminal_states: ["distribution_status=SUPERSEDED", "distribution_status=RECALLED"]
    shape: parallel
    note: |
      Two independent dimensions on one row. review_status is the editorial axis; distribution_status
      is the availability axis. Publishing does NOT require validation — a right-to-repair data
      availability obligation can force a DRAFT version out of the door — which is exactly why
      calculations.shop_coverage_completeness has divergent DECLARED and EFFECTIVE variants.
    transitions:
      - from: "review_status=DRAFT"
        to: "review_status=VALIDATED"
        trigger: "POST /publication-versions/{id}/validate"
        actor: ContentPublisher
        preconditions:
          - "PublicationVersion.review_status == DRAFT"
          - "PublicationVersion.distribution_status != RECALLED"
        side_effects:
          - "review_status = VALIDATED; validated_by_user_id = X-User-ID"
          - "Shop.coverage_completeness_pct recomputed for every Shop holding an ACTIVE entitlement whose license covers this version's (vehicle_model_id, system_area_id) cell"
      - from: "distribution_status=WITHHELD"
        to: "distribution_status=PUBLISHED"
        trigger: "POST /publication-versions/{id}/publish"
        actor: ContentPublisher
        preconditions:
          - "PublicationVersion.distribution_status == WITHHELD"
          - "review_status is NOT checked — the axes are independent"
          - "if validated_by_user_id is non-null it MUST NOT equal X-User-ID else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "distribution_status = PUBLISHED; published_by_user_id = X-User-ID"
          - "Publication.published_version_id = this version id"
          - "CASCADE HOP 1 — the previously PUBLISHED sibling version of the same Publication (if any) transitions distribution_status PUBLISHED -> SUPERSEDED"
          - "CASCADE HOP 2 — caused by HOP 1: every ModuleProgrammingJob pinned to that superseded version with status == IN_PROGRESS transitions IN_PROGRESS -> REVALIDATION_REQUIRED and appends AuditEvent JOB_REVALIDATION_REQUIRED; jobs in status QUEUED are ABORTED with abort_reason = 'PINNED_VERSION_SUPERSEDED'"
          - "CASCADE HOP 3 — caused by HOP 2: the superseded version's active_pin_count is decremented once for every job that left {QUEUED, IN_PROGRESS}"
          - "Shop.coverage_completeness_pct recomputed for every affected Shop"
          - "AuditEvent VERSION_PUBLISHED appended"
      - from: "distribution_status=PUBLISHED"
        to: "distribution_status=RECALLED"
        trigger: "POST /publication-versions/{id}/recall"
        actor: ContentPublisher
        preconditions:
          - "PublicationVersion.distribution_status == PUBLISHED"
        side_effects:
          - "distribution_status = RECALLED; Publication.published_version_id = null"
          - "every ModuleProgrammingJob pinned to this version with status == IN_PROGRESS transitions to REVALIDATION_REQUIRED and appends AuditEvent JOB_REVALIDATION_REQUIRED; jobs in status QUEUED are ABORTED with abort_reason = 'PINNED_VERSION_RECALLED'"
          - "active_pin_count decremented once per job that left {QUEUED, IN_PROGRESS}"
          - "Shop.coverage_completeness_pct recomputed for every affected Shop"
          - "AuditEvent VERSION_RECALLED appended"
      - from: "distribution_status=PUBLISHED"
        to: "distribution_status=SUPERSEDED"
        trigger: "system cascade from POST /publication-versions/{id}/publish on a newer sibling"
        actor: system
        preconditions:
          - "a sibling version of the same Publication is transitioning distribution_status WITHHELD -> PUBLISHED"
        side_effects:
          - "distribution_status = SUPERSEDED (terminal); review_status is left untouched on the superseded row"

  - entity: GatewaySession
    initial_state: REQUESTED
    terminal_states: [COMPLETED, EXPIRED, TERMINATED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /gateway-sessions/{id}/activate"
        actor: Technician
        preconditions:
          - "GatewaySession.status == REQUESTED"
          - "SeatAssignment(session.seat_assignment_id).status == ACTIVE else ERR_INVALID_STATE"
          - "ShopEntitlement of that seat has status == ACTIVE else ERR_ENTITLEMENT_NOT_ACTIVE"
          - "Technician(seat.technician_id).identity_status == VERIFIED else ERR_TECHNICIAN_NOT_VERIFIED"
          - "Technician.credential_expires_at > current_utc else ERR_SECURITY_CREDENTIAL_EXPIRED"
          - "DiagnosticTool.oem_attestation_expires_at > current_utc else ERR_TOOL_ATTESTATION_EXPIRED"
          - "no sibling GatewaySession on the same diagnostic_tool_id with status == ACTIVE overlaps this window under half-open arithmetic else ERR_TOOL_WINDOW_CONFLICT"
        side_effects:
          - "GatewaySession.status = ACTIVE; credential_token minted as 'GW-' || uppercase(first 8 hex chars of the session id)"
          - "DiagnosticTool.status = OCCUPIED; occupied_by_session_id = this session id"
          - "AuditEvent SESSION_CREDENTIAL_ISSUED appended with detail = 'vin=' || session.vin"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /gateway-sessions/{id}/complete"
        actor: Technician
        note: "branch A of the fork — taken when current_utc < window_end"
        preconditions:
          - "GatewaySession.status == ACTIVE"
          - "current_utc < GatewaySession.window_end"
          - "no ModuleProgrammingJob on this session has status == IN_PROGRESS else ERR_INVALID_STATE"
        side_effects:
          - "GatewaySession.status = COMPLETED"
          - "runs calculations.gateway_access_fee, stamping base_subtotal_cents, discount_cents, surcharge_cents and total_access_fee_cents"
          - "Shop.gateway_fee_accrued_cents += total_access_fee_cents"
          - "DiagnosticTool.status = IDLE; occupied_by_session_id = null"
          - "every ModuleProgrammingJob on this session with status IN {QUEUED, REVALIDATION_REQUIRED} transitions to ABORTED with abort_reason = 'SESSION_COMPLETED', decrementing active_pin_count for QUEUED rows only (REVALIDATION_REQUIRED rows already left the pin count)"
          - "AuditEvent SESSION_COMPLETED appended"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /gateway-sessions/{id}/complete"
        actor: Technician
        note: "branch B of the fork — taken when current_utc >= window_end; divergent side-effect set: IN_PROGRESS jobs are aborted rather than blocking, and the audit trail records SESSION_TERMINATED"
        preconditions:
          - "GatewaySession.status == ACTIVE"
          - "current_utc >= GatewaySession.window_end"
        side_effects:
          - "GatewaySession.status = EXPIRED"
          - "runs calculations.gateway_access_fee identically to the COMPLETED branch; Shop.gateway_fee_accrued_cents += total_access_fee_cents"
          - "DiagnosticTool.status = IDLE; occupied_by_session_id = null"
          - "every ModuleProgrammingJob on this session with status IN {QUEUED, IN_PROGRESS, REVALIDATION_REQUIRED} transitions to ABORTED with abort_reason = 'SESSION_EXPIRED'; active_pin_count decremented for the QUEUED and IN_PROGRESS rows"
          - "AuditEvent SESSION_TERMINATED appended with detail = 'reason=SESSION_EXPIRED'"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system cascade from SeatAssignment ACTIVE -> REVOKED (explicit revoke, technician suspension, entitlement cancellation or license termination)"
        actor: system
        preconditions:
          - "GatewaySession.status == ACTIVE"
        side_effects:
          - "GatewaySession.status = TERMINATED; termination_reason set from the cascade origin"
          - "runs calculations.gateway_access_fee; Shop.gateway_fee_accrued_cents += total_access_fee_cents"
          - "DiagnosticTool released to IDLE"
          - "every ModuleProgrammingJob on this session with status IN {QUEUED, IN_PROGRESS} transitions to ABORTED with abort_reason = 'SESSION_TERMINATED'; active_pin_count decremented per aborted job"
          - "AuditEvent SESSION_TERMINATED appended with actor_role = SYSTEM"

  - entity: ModuleProgrammingJob
    initial_state: QUEUED
    terminal_states: [COMPLETED, ABORTED]
    shape: cyclic
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "POST /programming-jobs/{id}/start"
        actor: Technician
        preconditions:
          - "ModuleProgrammingJob.status == QUEUED"
          - "GatewaySession(job.session_id).status == ACTIVE else ERR_INVALID_STATE"
          - "Technician(seat.technician_id).credential_expires_at > current_utc else ERR_SECURITY_CREDENTIAL_EXPIRED"
          - "PublicationVersion(job.pinned_publication_version_id).distribution_status == PUBLISHED else ERR_STALE_PUBLICATION_VERSION when it is SUPERSEDED or RECALLED, ERR_VERSION_NOT_PUBLISHED when it is WITHHELD"
          - "if job_type == ADAS_CALIBRATION, a VALIDATED+PUBLISHED CALIBRATION_DOC PublicationVersion must exist for the same (vehicle_model_id, system_area_id) cell as the pinned version's publication else ERR_CALIBRATION_DOC_REQUIRED"
        side_effects:
          - "ModuleProgrammingJob.status = IN_PROGRESS"
          - "AuditEvent JOB_STARTED appended with detail = 'job_type=' || job_type"
      - from: IN_PROGRESS
        to: REVALIDATION_REQUIRED
        trigger: "system cascade from POST /publication-versions/{id}/recall or from a sibling publish that supersedes the pinned version"
        actor: system
        preconditions:
          - "ModuleProgrammingJob.status == IN_PROGRESS"
          - "job.pinned_publication_version_id is the version leaving distribution_status PUBLISHED"
        side_effects:
          - "ModuleProgrammingJob.status = REVALIDATION_REQUIRED"
          - "pinned version's active_pin_count -= 1"
          - "AuditEvent JOB_REVALIDATION_REQUIRED appended"
      - from: REVALIDATION_REQUIRED
        to: IN_PROGRESS
        trigger: "POST /programming-jobs/{id}/repin"
        actor: Technician
        note: "closes the cycle IN_PROGRESS -> REVALIDATION_REQUIRED -> IN_PROGRESS; a job may traverse it any number of times"
        preconditions:
          - "ModuleProgrammingJob.status == REVALIDATION_REQUIRED"
          - "GatewaySession(job.session_id).status == ACTIVE else ERR_INVALID_STATE"
          - "the new pinned PublicationVersion has distribution_status == PUBLISHED else ERR_VERSION_NOT_PUBLISHED"
          - "the new pinned PublicationVersion belongs to the same Publication as the old pin else ERR_REFERENCED_RESOURCE_NOT_FOUND"
        side_effects:
          - "pinned_publication_version_id = request.pinned_publication_version_id; repin_count += 1; status = IN_PROGRESS"
          - "new pinned version's active_pin_count += 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /programming-jobs/{id}/complete"
        actor: Technician
        preconditions:
          - "ModuleProgrammingJob.status == IN_PROGRESS else ERR_JOB_REVALIDATION_REQUIRED when the job is REVALIDATION_REQUIRED, ERR_INVALID_STATE otherwise"
          - "GatewaySession(job.session_id).status == ACTIVE else ERR_INVALID_STATE"
        side_effects:
          - "ModuleProgrammingJob.status = COMPLETED"
          - "pinned version's active_pin_count -= 1"
          - "AuditEvent JOB_COMPLETED appended"
      - from: QUEUED
        to: ABORTED
        trigger: "system cascade from session completion/expiry/termination or from pinned-version supersession/recall"
        actor: system
        preconditions:
          - "ModuleProgrammingJob.status == QUEUED"
        side_effects:
          - "status = ABORTED; abort_reason set from the cascade origin; pinned version's active_pin_count -= 1"
          - "AuditEvent JOB_ABORTED appended"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "system cascade from session expiry or termination"
        actor: system
        preconditions:
          - "ModuleProgrammingJob.status == IN_PROGRESS"
        side_effects:
          - "status = ABORTED; abort_reason set from the cascade origin; pinned version's active_pin_count -= 1"
          - "AuditEvent JOB_ABORTED appended"
      - from: REVALIDATION_REQUIRED
        to: ABORTED
        trigger: "system cascade from session completion, expiry or termination"
        actor: system
        preconditions:
          - "ModuleProgrammingJob.status == REVALIDATION_REQUIRED"
        side_effects:
          - "status = ABORTED; abort_reason set from the cascade origin; active_pin_count is NOT decremented again (it already left the pin count when the job entered REVALIDATION_REQUIRED)"
          - "AuditEvent JOB_ABORTED appended"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:

  - rule_id: seat-create-stale-entitlement
    parent_entity: ShopEntitlement
    write_endpoint: "POST /seat-assignments"
    occ_field: "expected_entitlement_version"
    description: |
      Creating a SeatAssignment against a ShopEntitlement whose version has advanced since the
      client last observed it is rejected. This is a genuine race rather than a state
      precondition: a second create for the same (entitlement_id, technician_id) pair is
      legitimate under §1.2 SeatAssignment ACTIVE -> SUPERSEDED (re-seat), and a create for a
      different technician is legitimate whenever seats_available > 0, so a strictly sequential
      second request observing the same entitlement state would otherwise succeed and silently
      overwrite the seat map the client based its decision on.
    error_id: ERR_STALE_ENTITLEMENT_VERSION
    http_status: 412

  - rule_id: version-create-stale-publication
    parent_entity: Publication
    write_endpoint: "POST /publications/{id}/versions"
    occ_field: "expected_publication_version"
    description: |
      Minting a new PublicationVersion under a Publication whose version has advanced since the
      client last observed it is rejected. TSB ingestion legitimately supersedes: a second
      sequential POST would mint version_no N+2 and, once published, push N+1 to SUPERSEDED,
      so the natural product semantics accept it and only the stale-version check can protect
      the ingesting client from clobbering a version it never saw.
    error_id: ERR_STALE_PUBLICATION_PARENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: entitlement_charge
    trigger: "PROVISIONAL at POST /entitlements (stamps ShopEntitlement.charged_cents); FINAL at POST /entitlements/{id}/cancel and at the ShopEntitlement ACTIVE -> LAPSED cascade of POST /licenses/{id}/terminate (stamps ShopEntitlement.settled_cents and credits the refund)"
    algorithm: tiered_pricing
    combinatorial_mode: "(b) nested rounding where the order matters"
    formula: |
      # ---- shared inputs -------------------------------------------------
      tier_mult    = TIER_MULT[Shop.tier]
      seat_factor  = 1 + SEAT_STEP * max(0, ShopEntitlement.seats_total - INCLUDED_SEATS)
      lines        = License.covered_system_area_ids, sorted by SystemArea.code ASC
      n_lines      = count(lines)                     # >= 1 by License constraint

      # ---- PROVISIONAL ---------------------------------------------------
      if ShopEntitlement.entitlement_model == SUBSCRIPTION:
          per_line_base = License.monthly_fee_cents / n_lines        # exact rational, NOT rounded
          # PINNED ROUNDING ORDER: round EACH LINE to whole cents, THEN sum.
          # The alternative order (sum the exact line values, then round once)
          # is explicitly NOT used and yields a different total.
          line_charge   = round_half_up(per_line_base * tier_mult * seat_factor)   # per line
          charged_cents = line_charge * n_lines
      else:  # PER_VEHICLE — a single line, so no per-line rounding step exists
          charged_cents = round_half_up(License.per_vehicle_fee_cents
                                       * ShopEntitlement.vin_quota
                                       * tier_mult)

      # ---- FINAL ---------------------------------------------------------
      window_days  = floor((ShopEntitlement.window_end - ShopEntitlement.window_start) / 86400)
      elapsed_days = max(0, floor((min(current_utc, ShopEntitlement.window_end)
                                   - ShopEntitlement.window_start) / 86400))
      if ShopEntitlement.entitlement_model == SUBSCRIPTION:
          settled_cents = round_half_up(ShopEntitlement.charged_cents
                                        * elapsed_days / window_days)
      else:  # PER_VEHICLE — consumption based, not time based
          vins_consumed = count(DISTINCT GatewaySession.vin
                                over sessions whose seat_assignment_id belongs to this
                                entitlement AND whose status IN
                                {ACTIVE, COMPLETED, EXPIRED, TERMINATED})
          settled_cents = round_half_up(License.per_vehicle_fee_cents
                                        * vins_consumed * tier_mult)
      refund_cents = ShopEntitlement.charged_cents - settled_cents   # credited to the shop
    input_set: |
      Lines are exactly License.covered_system_area_ids — every id in the array, regardless of the
      SystemArea's requires_calibration_doc / requires_security_credential flags. The FINAL
      PER_VEHICLE consumption set includes GatewaySession rows in status ACTIVE, COMPLETED,
      EXPIRED and TERMINATED and excludes rows still in REQUESTED; VINs are de-duplicated by exact
      string equality. Both variants read Shop.tier as it stands at the moment the variant runs.
    constants:
      TIER_MULT: { BASIC: 1.00, PRO: 0.85, ENTERPRISE: 0.70 }
      SEAT_STEP: 0.05
      INCLUDED_SEATS: 3
    precision: "whole cents, round_half_up; per-line rounding for SUBSCRIPTION PROVISIONAL, single rounding everywhere else"
    worked_example: |
      monthly_fee_cents=100000, n_lines=3, tier=PRO (0.85), seats_total=3 (seat_factor 1.00):
        per_line_base = 33333.333...; line_charge = round_half_up(28333.3333) = 28333
        charged_cents = 28333 * 3 = 84999            (sum-then-round would give 85000)
      Same shop, PER_VEHICLE with per_vehicle_fee_cents=2500 and vin_quota=40:
        charged_cents = round_half_up(2500*40*0.85) = 85000
      FINAL, SUBSCRIPTION, window 2026-08-01T00:00:00Z..2026-09-01T00:00:00Z (31 days),
      cancelled at current_utc 2026-08-11T00:00:00Z (elapsed_days 10):
        settled_cents = round_half_up(84999 * 10 / 31) = 27419; refund_cents = 57580
    variants:
      - name: PROVISIONAL
        when: "at POST /entitlements, before any coverage has been consumed"
        difference: "charges the whole term (SUBSCRIPTION) or the whole VIN quota (PER_VEHICLE); ignores current_utc and ignores every GatewaySession"
      - name: FINAL
        when: "at settlement — POST /entitlements/{id}/cancel or the LAPSED cascade"
        difference: "SUBSCRIPTION prorates the PROVISIONAL amount by whole elapsed days over whole window days; PER_VEHICLE re-prices from scratch on distinct VINs actually touched. For the worked example above the same entitlement is worth 84999 under PROVISIONAL and 27419 under FINAL"

  - name: parity_index
    trigger: "recomputed on POST /manufacturers and on PATCH /manufacturers/{id}/pricing (stamps Manufacturer.parity_index and Manufacturer.parity_status under LIST_BASIS); computed on demand for either basis by GET /manufacturers/{id}/parity-report"
    algorithm: threshold
    combinatorial_mode: "(a) formula with >=3 inputs and non-linear interaction (basis branch plus per-system-day normalisation)"
    formula: |
      if basis == LIST_BASIS:
          index = round_half_up(Manufacturer.independent_list_monthly_cents
                                / Manufacturer.oem_dealer_monthly_cents, 4)
      else:  # EFFECTIVE_BASIS — normalise both offers to cents per covered system per day
          ind_eff = Manufacturer.independent_list_monthly_cents
                    / (Manufacturer.independent_covered_system_count * DAYS_PER_MONTH)
          oem_eff = Manufacturer.oem_dealer_monthly_cents
                    / (Manufacturer.oem_dealer_covered_system_count * DAYS_PER_MONTH)
          index   = round_half_up(ind_eff / oem_eff, 4)   # intermediates stay exact rationals
      parity_status = COMPLIANT if index <= PARITY_MAX_INDEX else NON_COMPLIANT
    input_set: |
      Only the four pricing fields on the Manufacturer row itself; no License, entitlement or
      publication data enters. Manufacturer.parity_status stored on the row is always the
      LIST_BASIS verdict; the EFFECTIVE_BASIS verdict is report-only and never persisted.
    constants:
      PARITY_MAX_INDEX: 1.15
      DAYS_PER_MONTH: 30
    precision: "index at 4 decimal places, round_half_up; the ROUNDED index is what is compared against PARITY_MAX_INDEX"
    worked_example: |
      independent_list_monthly_cents=115000, oem_dealer_monthly_cents=100000,
      independent_covered_system_count=3, oem_dealer_covered_system_count=4:
        LIST_BASIS      index = round_half_up(1.15, 4)          = 1.1500 -> COMPLIANT (boundary, <=)
        EFFECTIVE_BASIS ind_eff = 115000/(3*30) = 1277.777...
                        oem_eff = 100000/(4*30) =  833.333...
                        index   = round_half_up(1.5333..., 4)   = 1.5333 -> NON_COMPLIANT
      After PATCH to independent_list_monthly_cents=115100:
        LIST_BASIS      index = round_half_up(1.151, 4)         = 1.1510 -> NON_COMPLIANT
    variants:
      - name: LIST_BASIS
        when: "persisted on the Manufacturer row and used by the License DRAFT/SUSPENDED -> ACTIVE parity gate"
        difference: "compares headline monthly prices only; ignores how many systems each offer covers"
      - name: EFFECTIVE_BASIS
        when: "GET /manufacturers/{id}/parity-report?basis=EFFECTIVE_BASIS — the basis a right-to-repair regulator uses"
        difference: "normalises by covered system count and DAYS_PER_MONTH, so an OEM that bundles more systems for dealers is exposed; for the worked example the same row is COMPLIANT at 1.1500 under LIST_BASIS and NON_COMPLIANT at 1.5333 under EFFECTIVE_BASIS"

  - name: shop_coverage_completeness
    trigger: "GET /shops/{id}/coverage-map for either basis; the EFFECTIVE value is additionally stamped onto Shop.coverage_completeness_pct at every ShopEntitlement status change (activate, cancel, lapse) and at every PublicationVersion validate/publish/recall that touches a covered cell"
    algorithm: aggregation
    combinatorial_mode: "(a) formula with >=3 inputs and non-linear interaction (per-cell conditional branch on requires_calibration_doc, then a ratio)"
    formula: |
      # cell universe
      licenses = { License L : exists ShopEntitlement e with e.shop_id == shop.id
                               AND e.status == ACTIVE AND e.license_id == L.id }
      cells    = { (vm, sa) : L in licenses,
                              vm in VehicleModel where vm.manufacturer_id == L.manufacturer_id,
                              sa.id in L.covered_system_area_ids }        # de-duplicated
      total_cells = count(cells)

      # per-cell classification
      P(cell) = PublicationVersion rows v where v.publication.vehicle_model_id == vm.id
                AND v.publication.system_area_id == sa.id
                AND v.publication.publication_type == REPAIR_PROCEDURE
      C(cell) = same but publication_type == CALIBRATION_DOC
      strict(X) = exists v in X with v.review_status == VALIDATED
                                AND v.distribution_status == PUBLISHED
      loose(X)  = exists v in X with v.distribution_status == PUBLISHED   # review ignored
      needs_cal = sa.requires_calibration_doc

      state(cell) = COVERED   if strict(P) and (not needs_cal or strict(C))
                    DEGRADED  if not COVERED and loose(P) and (not needs_cal or loose(C))
                    GAP       otherwise

      covered_cells  = count(cells with state == COVERED)
      degraded_cells = count(cells with state == DEGRADED)
      gap_cells      = count(cells with state == GAP)

      numerator = covered_cells                       if basis == EFFECTIVE
                  covered_cells + degraded_cells      if basis == DECLARED
      completeness_pct = 0.00 if total_cells == 0
                         else round_half_up(100 * numerator / total_cells, 2)

      # gaps[] lists every cell whose state != COVERED, sorted by
      # (VehicleModel.model_code ASC, SystemArea.code ASC) — no id ever enters the ordering
      gaps = [ { vehicle_model_id, model_code, system_area_id, system_area_code, cell_state }
               for cell in cells if state(cell) != COVERED ]
    input_set: |
      Entitlements contribute cells only in status ACTIVE — PENDING, LAPSED and CANCELLED
      entitlements are excluded, so a shop with no ACTIVE entitlement has total_cells == 0.
      VehicleModel rows contribute regardless of model_year. Versions in distribution_status
      WITHHELD, SUPERSEDED or RECALLED never satisfy strict() or loose().
    constants: {}
    precision: "completeness_pct at 2 decimal places, round_half_up; 0.00 exactly when total_cells == 0"
    worked_example: |
      One ACTIVE entitlement on a license covering 2 system areas (ADAS with
      requires_calibration_doc=true, POWERTRAIN with false) for an OEM with 1 VehicleModel:
      total_cells = 2.
        (VM, ADAS):       REPAIR_PROCEDURE version VALIDATED+PUBLISHED, no CALIBRATION_DOC at all
                          -> strict(P) true, strict(C) false, loose(C) false -> GAP
        (VM, POWERTRAIN): REPAIR_PROCEDURE version PUBLISHED but review_status DRAFT
                          -> strict(P) false, loose(P) true, needs_cal false -> DEGRADED
      EFFECTIVE: 100*0/2 = 0.00     DECLARED: 100*1/2 = 50.00     gap_cells=1, degraded_cells=1
    variants:
      - name: EFFECTIVE
        when: "default basis; the value stamped on Shop.coverage_completeness_pct"
        difference: "counts only COVERED cells, so an unvalidated-but-published procedure earns nothing"
      - name: DECLARED
        when: "GET /shops/{id}/coverage-map?basis=DECLARED — the number an OEM quotes to satisfy a data-availability obligation"
        difference: "counts DEGRADED cells in the numerator; for the worked example the same data reads 0.00 EFFECTIVE and 50.00 DECLARED"

  - name: gateway_access_fee
    trigger: "on every GatewaySession exit from ACTIVE — POST /gateway-sessions/{id}/complete (COMPLETED or EXPIRED branch) and the system TERMINATED cascade"
    algorithm: waterfall_allocation
    combinatorial_mode: "(c) circular-looking dependency with a pinned evaluation order"
    formula: |
      # STEP 1 — base subtotal over the session's job set.
      # PINNED READ POINT: job statuses are read IMMEDIATELY BEFORE this exit's own job
      # cascade runs, and only these three statuses are billable.
      jobs = ModuleProgrammingJob rows on this session whose status immediately before the
             exit cascade is IN {IN_PROGRESS, COMPLETED, REVALIDATION_REQUIRED}
             # QUEUED is never billed, and neither is a row already ABORTED by an earlier event
      base_subtotal_cents = SESSION_BASE_CENTS
                          + VIN_CREDENTIAL_CENTS
                          + sum(JOB_CENTS[j.job_type] for j in jobs)

      # STEP 2 — discount tier. PINNED: the tier is keyed on base_subtotal_cents,
      #          NOT on total_access_fee_cents. Keying it on the total would be
      #          circular because the surcharge is part of the total; this scaffold
      #          resolves the loop by fixing the tier input to STEP 1's output.
      discount_pct = 0.00 if base_subtotal_cents < DISCOUNT_TIER_1_CENTS
                     0.05 if DISCOUNT_TIER_1_CENTS <= base_subtotal_cents < DISCOUNT_TIER_2_CENTS
                     0.10 if base_subtotal_cents >= DISCOUNT_TIER_2_CENTS

      # STEP 3 — discount, rounded once
      discount_cents = round_half_up(base_subtotal_cents * discount_pct)

      # STEP 4 — security surcharge, also keyed on STEP 1's output
      surcharge_pct  = IMMOBILIZER_SURCHARGE_PCT if any(j.job_type == IMMOBILIZER_KEY for j in jobs)
                       else STANDARD_SURCHARGE_PCT
      surcharge_cents = round_half_up(base_subtotal_cents * surcharge_pct)

      # STEP 5 — total
      total_access_fee_cents = base_subtotal_cents - discount_cents + surcharge_cents
    input_set: |
      Job rows are read at the instant the session leaves ACTIVE and BEFORE that exit's own job
      cascade is applied, so the billable set is exactly {IN_PROGRESS, COMPLETED,
      REVALIDATION_REQUIRED}: a job the exit is about to abort out of IN_PROGRESS IS billed, a job
      that is still QUEUED at the read point is NOT billed even though the same exit aborts it, and
      a job already ABORTED by an earlier cascade is NOT billed. Sessions that never reached ACTIVE
      are never priced and keep all four money fields at 0.
    constants:
      SESSION_BASE_CENTS: 2500
      VIN_CREDENTIAL_CENTS: 300
      JOB_CENTS: { IMMOBILIZER_KEY: 4000, MODULE_FLASH: 3000, ADAS_CALIBRATION: 6000 }
      DISCOUNT_TIER_1_CENTS: 5000
      DISCOUNT_TIER_2_CENTS: 10000
      IMMOBILIZER_SURCHARGE_PCT: 0.12
      STANDARD_SURCHARGE_PCT: 0.04
    precision: "whole cents, round_half_up on discount and surcharge independently; the total is exact integer arithmetic over the two rounded parts"
    worked_example: |
      Session with one IMMOBILIZER_KEY job and one MODULE_FLASH job, both billable:
        STEP 1 base_subtotal_cents = 2500 + 300 + 4000 + 3000 = 9800
        STEP 2 9800 is in [5000, 10000) -> discount_pct = 0.05
        STEP 3 discount_cents  = round_half_up(9800 * 0.05) = 490
        STEP 4 surcharge_cents = round_half_up(9800 * 0.12) = 1176
        STEP 5 total_access_fee_cents = 9800 - 490 + 1176 = 10486
      The rejected circular reading (tier keyed on base + surcharge = 9800 + 1176 = 10976, which
      crosses DISCOUNT_TIER_2_CENTS and so earns 10% = 980) would yield 9800 - 980 + 1176 = 9996 —
      a different, wrong answer.

  - name: seat_ledger
    trigger: "on POST /seat-assignments (create or re-seat), POST /seat-assignments/{id}/revoke, and every cascade that revokes a seat"
    algorithm: aggregation
    formula: |
      seats_assigned  = count(SeatAssignment where entitlement_id == e.id AND status == ACTIVE)
      seats_available = e.seats_total - seats_assigned
      # CONSERVED QUANTITY (seat conservation), asserted after every seat mutation:
      #   e.seats_total == seats_assigned + seats_available
      # and, across a forward assign followed by its compensating revoke,
      #   seats_assigned returns to its pre-assign value and seats_available to its pre-assign value.
      # A re-seat (ACTIVE -> SUPERSEDED on the prior row, new ACTIVE row) leaves both unchanged.
    input_set: "SeatAssignment rows on the entitlement in status ACTIVE only; REVOKED and SUPERSEDED rows are excluded"
    constants: {}
    precision: "exact integers"

  - name: credit_ledger
    trigger: "on POST /shops/{id}/credit-funding, POST /entitlements, and every settlement (cancel or lapse)"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY (data-credit conservation), asserted after every one of the
      # three triggers above:
      #   Shop.data_credit_balance_cents
      # + sum(e.charged_cents for e in entitlements(shop) where e.settlement_status == UNSETTLED)
      # + sum(e.settled_cents  for e in entitlements(shop) where e.settlement_status == SETTLED)
      # == Shop.funded_credit_total_cents
      #
      # Mutations that maintain it:
      #   funding        : funded_credit_total_cents += amount; data_credit_balance_cents += amount
      #   entitlement    : data_credit_balance_cents -= charged_cents        (UNSETTLED)
      #   settlement     : data_credit_balance_cents += (charged_cents - settled_cents); SETTLED
      # Shop.gateway_fee_accrued_cents is an accrual OUTSIDE this identity and never nets against it.
    input_set: "Every ShopEntitlement of the shop in any status; PENDING and ACTIVE rows are always UNSETTLED, LAPSED and CANCELLED rows are always SETTLED"
    constants: {}
    precision: "exact integer cents"
    worked_example: |
      fund 200000 -> balance 200000, funded 200000 (200000 + 0 == 200000)
      create SUBSCRIPTION entitlement charged 84999 -> balance 115001 (115001 + 84999 == 200000)
      cancel at elapsed_days 10 of 31 -> settled 27419, refund 57580,
        balance 172581 (172581 + 27419 == 200000)

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "ShopManager scope — X-User-ID must equal the Shop.id addressed by the request: the {id} of the ShopManager-readable /shops/{id}/* reads, request.shop_id for POST /technicians, POST /entitlements and POST /diagnostic-tools, and ShopEntitlement.shop_id for POST /seat-assignments, /entitlements/{id}/*, /seat-assignments/{id}/revoke"
    error_id: ERR_CROSS_SHOP_ACCESS
    http_status: 403
    applies_to: "POST /technicians, POST /entitlements, POST /entitlements/{id}/activate, POST /entitlements/{id}/cancel, POST /seat-assignments, POST /seat-assignments/{id}/revoke, POST /diagnostic-tools, GET /shops/{id}, GET /shops/{id}/technicians, GET /shops/{id}/diagnostic-tools, GET /shops/{id}/coverage-map"

  - priority: 4
    category: auth
    check: "Technician scope — X-User-ID must equal SeatAssignment(seat_assignment_id).technician_id for POST /gateway-sessions, and GatewaySession -> SeatAssignment.technician_id for every /gateway-sessions/{id}/* and /programming-jobs* call"
    error_id: ERR_NOT_SEAT_HOLDER
    http_status: 403
    applies_to: "POST /gateway-sessions, POST /gateway-sessions/{id}/activate, POST /gateway-sessions/{id}/complete, POST /programming-jobs, POST /programming-jobs/{id}/start, POST /programming-jobs/{id}/complete, POST /programming-jobs/{id}/repin"

  - priority: 5
    category: auth
    check: "segregation of duties — on publish, if PublicationVersion.validated_by_user_id is non-null it must differ from X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /publication-versions/{id}/publish"

  - priority: 6
    category: existence
    check: "request body parses, no unknown fields, every required field present, enums in range, integers within declared bounds, datetimes ISO 8601 UTC, VIN exactly 17 chars, pagination limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 10
    category: existence
    check: "Manufacturer in path or in request.manufacturer_id exists"
    error_id: ERR_MANUFACTURER_NOT_FOUND
    http_status: 404
    applies_to: "GET /manufacturers/{id}, GET /manufacturers/{id}/licenses, GET /manufacturers/{id}/vehicle-models, GET /manufacturers/{id}/parity-report, PATCH /manufacturers/{id}/pricing, POST /vehicle-models, POST /licenses"

  - priority: 11
    category: existence
    check: "Shop in path or in request.shop_id exists"
    error_id: ERR_SHOP_NOT_FOUND
    http_status: 404
    applies_to: "GET /shops/{id}, GET /shops/{id}/technicians, GET /shops/{id}/diagnostic-tools, GET /shops/{id}/coverage-map, POST /shops/{id}/credit-funding, POST /technicians, POST /entitlements, POST /diagnostic-tools"

  - priority: 12
    category: existence
    check: "License in path or in request.license_id exists"
    error_id: ERR_LICENSE_NOT_FOUND
    http_status: 404
    applies_to: "POST /licenses/{id}/activate, POST /licenses/{id}/suspend, POST /licenses/{id}/terminate, POST /entitlements"

  - priority: 13
    category: existence
    check: "Technician in path or in request.technician_id exists"
    error_id: ERR_TECHNICIAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /technicians/{id}/verify, POST /technicians/{id}/suspend, POST /technicians/{id}/revoke, POST /seat-assignments"

  - priority: 14
    category: existence
    check: "ShopEntitlement in path or in request.entitlement_id exists"
    error_id: ERR_ENTITLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /entitlements/{id}, POST /entitlements/{id}/activate, POST /entitlements/{id}/cancel, POST /seat-assignments"

  - priority: 15
    category: existence
    check: "SeatAssignment in path or in request.seat_assignment_id exists"
    error_id: ERR_SEAT_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /seat-assignments/{id}, POST /seat-assignments/{id}/revoke, POST /gateway-sessions"

  - priority: 16
    category: existence
    check: "Publication in path exists"
    error_id: ERR_PUBLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /publications/{id}, GET /publications/{id}/versions, POST /publications/{id}/versions"

  - priority: 17
    category: existence
    check: "PublicationVersion in path or in request.pinned_publication_version_id exists"
    error_id: ERR_PUBLICATION_VERSION_NOT_FOUND
    http_status: 404
    applies_to: "POST /publication-versions/{id}/validate, POST /publication-versions/{id}/publish, POST /publication-versions/{id}/recall, POST /programming-jobs, POST /programming-jobs/{id}/repin"

  - priority: 18
    category: existence
    check: "GatewaySession in path or in request.session_id exists"
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /gateway-sessions/{id}, POST /gateway-sessions/{id}/activate, POST /gateway-sessions/{id}/complete, POST /programming-jobs"

  - priority: 19
    category: existence
    check: "ModuleProgrammingJob in path exists"
    error_id: ERR_JOB_NOT_FOUND
    http_status: 404
    applies_to: "GET /programming-jobs/{id}, POST /programming-jobs/{id}/start, POST /programming-jobs/{id}/complete, POST /programming-jobs/{id}/repin"

  - priority: 20
    category: existence
    check: "secondary references resolve — every id in request.covered_system_area_ids, request.system_area_id, request.vehicle_model_id, request.diagnostic_tool_id, and (on repin) a replacement version under the same Publication"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /licenses, POST /licenses/{id}/activate, POST /vehicle-models, POST /publications, POST /gateway-sessions, POST /programming-jobs/{id}/repin"

  - priority: 25
    category: state
    check: "expected_entitlement_version equals ShopEntitlement.version"
    error_id: ERR_STALE_ENTITLEMENT_VERSION
    http_status: 412
    applies_to: "POST /seat-assignments"

  - priority: 26
    category: state
    check: "expected_publication_version equals Publication.version"
    error_id: ERR_STALE_PUBLICATION_PARENT_VERSION
    http_status: 412
    applies_to: "POST /publications/{id}/versions"

  - priority: 30
    category: state
    check: "the target row is in a state from which this transition is declared in §1.2 (includes SeatAssignment not ACTIVE, session not REQUESTED/ACTIVE, job not in the required state, PublicationVersion axis already advanced, license/entitlement already terminal)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 31
    category: state
    check: "job-specific state refinement — completing a job that sits in REVALIDATION_REQUIRED reports the revalidation debt rather than a generic state error"
    error_id: ERR_JOB_REVALIDATION_REQUIRED
    http_status: 409
    applies_to: "POST /programming-jobs/{id}/complete"

  - priority: 35
    category: state
    check: "Manufacturer.parity_status == COMPLIANT when activating a license (initial activation and reinstatement alike)"
    error_id: ERR_PARITY_NON_COMPLIANT
    http_status: 409
    applies_to: "POST /licenses/{id}/activate"

  - priority: 36
    category: state
    check: "License(entitlement.license_id).status == ACTIVE"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /entitlements, POST /entitlements/{id}/activate"

  - priority: 37
    category: state
    check: "the ShopEntitlement behind the seat is ACTIVE"
    error_id: ERR_ENTITLEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /gateway-sessions, POST /gateway-sessions/{id}/activate"

  - priority: 38
    category: state
    check: "Technician(seat.technician_id).identity_status == VERIFIED"
    error_id: ERR_TECHNICIAN_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /gateway-sessions/{id}/activate"

  - priority: 40
    category: state
    check: "the pinned PublicationVersion.distribution_status is not WITHHELD (a version that never left WITHHELD was never available; SUPERSEDED and RECALLED pins are left to priority 55 so the two failures stay distinguishable)"
    error_id: ERR_VERSION_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /programming-jobs, POST /programming-jobs/{id}/start, POST /programming-jobs/{id}/repin"

  - priority: 50
    category: business_safety
    check: "the acting technician's credential_expires_at > current_utc"
    error_id: ERR_SECURITY_CREDENTIAL_EXPIRED
    http_status: 409
    applies_to: "POST /technicians/{id}/verify, POST /gateway-sessions/{id}/activate, POST /programming-jobs/{id}/start"

  - priority: 51
    category: business_safety
    check: "DiagnosticTool.oem_attestation_expires_at > current_utc"
    error_id: ERR_TOOL_ATTESTATION_EXPIRED
    http_status: 409
    applies_to: "POST /gateway-sessions/{id}/activate"

  - priority: 52
    category: business_safety
    check: "an ADAS_CALIBRATION job's cell has a VALIDATED+PUBLISHED CALIBRATION_DOC version"
    error_id: ERR_CALIBRATION_DOC_REQUIRED
    http_status: 422
    applies_to: "POST /programming-jobs/{id}/start"

  - priority: 55
    category: business_referential
    check: "the pinned PublicationVersion is not SUPERSEDED and not RECALLED"
    error_id: ERR_STALE_PUBLICATION_VERSION
    http_status: 409
    applies_to: "POST /programming-jobs, POST /programming-jobs/{id}/start"

  - priority: 60
    category: business_constraint
    check: "DiagnosticTool.shop_id equals the shop_id of the entitlement behind the seat"
    error_id: ERR_TOOL_SHOP_MISMATCH
    http_status: 422
    applies_to: "POST /gateway-sessions"

  - priority: 61
    category: business_constraint
    check: "request.seats_total <= License.seat_cap, and request.entitlement_model is in the permitted set of License.license_model where permitted(SUBSCRIPTION) = {SUBSCRIPTION}, permitted(PER_VEHICLE) = {PER_VEHICLE} and permitted(EITHER) = {SUBSCRIPTION, PER_VEHICLE}, and vin_quota >= 1 exactly when entitlement_model == PER_VEHICLE"
    error_id: ERR_SEAT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /entitlements"

  - priority: 62
    category: business_constraint
    check: "ShopEntitlement.seats_available >= 1 when seating a technician who has no ACTIVE seat on this entitlement (a re-seat of the same technician is exempt)"
    error_id: ERR_NO_SEATS_AVAILABLE
    http_status: 409
    applies_to: "POST /seat-assignments"

  - priority: 70
    category: business_temporal
    check: "closed-interval-plus-buffer check — no sibling ShopEntitlement on the same (shop_id, license_id) with status IN {PENDING, ACTIVE} satisfies new.window_start <= sib.window_end + COOLDOWN_HOURS AND sib.window_start <= new.window_end + COOLDOWN_HOURS, with COOLDOWN_HOURS = 24. Touching windows and a gap of exactly 24h are both rejected; a gap strictly greater than 24h is accepted"
    error_id: ERR_ENTITLEMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /entitlements"

  - priority: 71
    category: business_temporal
    check: "half-open-interval check — no sibling GatewaySession on the same diagnostic_tool_id with status == ACTIVE satisfies new.window_start < sib.window_end AND sib.window_start < new.window_end. Back-to-back windows (new.window_start == sib.window_end) are accepted; there is no buffer"
    error_id: ERR_TOOL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /gateway-sessions/{id}/activate"

  - priority: 72
    category: business_temporal
    check: "the session window sits inside the entitlement window: window_start >= entitlement.window_start AND window_end <= entitlement.window_end; also window_end > window_start"
    error_id: ERR_SESSION_WINDOW_OUTSIDE_ENTITLEMENT
    http_status: 422
    applies_to: "POST /gateway-sessions"

  - priority: 80
    category: business_fiscal
    check: "Shop.data_credit_balance_cents >= the PROVISIONAL charged_cents this entitlement would incur"
    error_id: ERR_INSUFFICIENT_DATA_CREDIT
    http_status: 402
    applies_to: "POST /entitlements"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- system areas & manufacturers ----
  - method: POST
    path: "/system-areas"
    description: "Register a vehicle system area used as the system axis of coverage cells and as a charge line of a license"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, "requires_calibration_doc?", "requires_security_credential?"]
    output: SystemArea
    side_effects: []

  - method: POST
    path: "/manufacturers"
    description: "Register an OEM together with the two pricing offers that its right-to-repair parity is judged on; stamps parity_index and parity_status under LIST_BASIS"
    roles: [PlatformAdmin]
    code: 201
    input: [name, oem_code, region, independent_list_monthly_cents, independent_covered_system_count, oem_dealer_monthly_cents, oem_dealer_covered_system_count]
    output: Manufacturer
    side_effects: ["runs calculations.parity_index variant LIST_BASIS and stamps parity_index + parity_status"]

  - method: GET
    path: "/manufacturers/{id}"
    description: "Read one OEM including its stored parity verdict"
    roles: [PlatformAdmin, ContentPublisher, ComplianceOfficer, ShopManager]
    code: 200
    input: []
    output: Manufacturer
    side_effects: []

  - method: PATCH
    path: "/manufacturers/{id}/pricing"
    description: "Restate one or more of the four parity pricing inputs; recomputes the stored LIST_BASIS verdict"
    roles: [PlatformAdmin]
    code: 200
    input: ["independent_list_monthly_cents?", "independent_covered_system_count?", "oem_dealer_monthly_cents?", "oem_dealer_covered_system_count?"]
    output: Manufacturer
    side_effects:
      - "re-runs calculations.parity_index variant LIST_BASIS; parity_index and parity_status restamped"
      - "increments Manufacturer.version by 1"
      - "no cascade to existing ACTIVE licenses — the parity gate only fires on activation"

  - method: GET
    path: "/manufacturers/{id}/parity-report"
    description: "Computed pricing-parity report for either basis; basis defaults to LIST_BASIS"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager]
    code: 200
    input: ["basis?"]
    output: "{ manufacturer_id: string, basis: string, parity_index: number, parity_status: string, independent_effective_cents_per_system_day: number, oem_effective_cents_per_system_day: number, threshold: number }"
    side_effects: []

  - method: GET
    path: "/manufacturers/{id}/licenses"
    description: "List the licenses granted by one OEM"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: POST
    path: "/vehicle-models"
    description: "Register a vehicle model under an OEM; models are the model axis of coverage cells"
    roles: [PlatformAdmin]
    code: 201
    input: [manufacturer_id, model_code, model_year]
    output: VehicleModel
    side_effects: []

  - method: GET
    path: "/manufacturers/{id}/vehicle-models"
    description: "List the vehicle models of one OEM"
    roles: [PlatformAdmin, ContentPublisher, ComplianceOfficer, ShopManager]
    code: 200
    input: ["model_year?", "limit?", "offset?"]
    output: VehicleModel[]
    side_effects: []

  # ---- licenses ----
  - method: POST
    path: "/licenses"
    description: "Draft a manufacturer service-information license with its commercial terms and covered system areas"
    roles: [PlatformAdmin]
    code: 201
    input: [manufacturer_id, license_model, monthly_fee_cents, per_vehicle_fee_cents, seat_cap, covered_system_area_ids, effective_start, effective_end]
    output: License
    side_effects: ["License.status = DRAFT"]

  - method: POST
    path: "/licenses/{id}/activate"
    description: "Activate a DRAFT license or reinstate a SUSPENDED one; re-runs the right-to-repair parity gate every time"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: License
    side_effects:
      - "License.status = ACTIVE"
      - "increments License.version by 1"

  - method: POST
    path: "/licenses/{id}/suspend"
    description: "Suspend an ACTIVE license; existing entitlements survive but no new ones may be created or activated"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: License
    side_effects:
      - "License.status = SUSPENDED; suspension_reason stamped"
      - "increments License.version by 1"

  - method: POST
    path: "/licenses/{id}/terminate"
    description: "Terminate a license and run the three-hop entitlement -> seat -> session cascade"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: License
    side_effects:
      - "License.status = TERMINATED"
      - "CASCADE HOP 1: ACTIVE ShopEntitlement rows -> LAPSED with calculations.entitlement_charge variant FINAL and refund credited"
      - "CASCADE HOP 2: their ACTIVE SeatAssignment rows -> REVOKED, seats_assigned decremented"
      - "CASCADE HOP 3: those seats' ACTIVE GatewaySession rows -> TERMINATED, calculations.gateway_access_fee stamped, tools released, jobs aborted"
      - "AuditEvent LICENSE_TERMINATED plus one ENTITLEMENT_SETTLED / SEAT_REVOKED / SESSION_TERMINATED per affected row"
      - "increments License.version by 1"

  # ---- shops, credit, coverage ----
  - method: POST
    path: "/shops"
    description: "Register an independent repair shop at a subscription tier"
    roles: [PlatformAdmin]
    code: 201
    input: [name, tier]
    output: Shop
    side_effects: ["funded_credit_total_cents = 0, data_credit_balance_cents = 0, gateway_fee_accrued_cents = 0, coverage_completeness_pct = 0.00"]

  - method: GET
    path: "/shops/{id}"
    description: "Read one shop including its credit ledger fields and stored coverage completeness"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager]
    code: 200
    input: []
    output: Shop
    side_effects: []

  - method: POST
    path: "/shops/{id}/credit-funding"
    description: "Fund a shop's data credit; the only operation that raises funded_credit_total_cents"
    roles: [PlatformAdmin]
    code: 200
    input: [amount_cents, funding_ref]
    output: Shop
    side_effects:
      - "funded_credit_total_cents += amount_cents; data_credit_balance_cents += amount_cents"
      - "increments Shop.version by 1"

  - method: GET
    path: "/shops/{id}/coverage-map"
    description: "Computed coverage map across makes, models and systems with gap identification; basis defaults to EFFECTIVE"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager]
    code: 200
    input: ["basis?"]
    output: "{ shop_id: string, basis: string, total_cells: integer, covered_cells: integer, degraded_cells: integer, gap_cells: integer, completeness_pct: number, gaps: array }"
    side_effects: []

  # ---- technicians ----
  - method: POST
    path: "/technicians"
    description: "Enrol a technician at a shop; identity_status starts UNVERIFIED"
    roles: [ShopManager]
    code: 201
    input: [shop_id, full_name, credential_expires_at]
    output: Technician
    side_effects: ["Technician.identity_status = UNVERIFIED"]

  - method: GET
    path: "/shops/{id}/technicians"
    description: "List a shop's technicians"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager]
    code: 200
    input: ["identity_status?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  - method: POST
    path: "/technicians/{id}/verify"
    description: "Record an accepted identity document and (re-)stamp the secure-gateway credential expiry"
    roles: [ComplianceOfficer]
    code: 200
    input: [identity_document_ref, credential_expires_at]
    output: Technician
    side_effects:
      - "identity_status = VERIFIED; identity_document_ref, credential_expires_at and verified_by_user_id stamped"
      - "AuditEvent TECHNICIAN_VERIFIED appended"
      - "increments Technician.version by 1"

  - method: POST
    path: "/technicians/{id}/suspend"
    description: "Suspend a technician's identity and run the four-hop seat -> session -> job -> pin-count cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Technician
    side_effects:
      - "identity_status = SUSPENDED"
      - "CASCADE HOP 1: ACTIVE SeatAssignment rows of this technician -> REVOKED"
      - "CASCADE HOP 2: those seats' ACTIVE GatewaySession rows -> TERMINATED with calculations.gateway_access_fee stamped and tools released"
      - "CASCADE HOP 3: those sessions' QUEUED/IN_PROGRESS ModuleProgrammingJob rows -> ABORTED"
      - "CASCADE HOP 4: each aborted job's pinned PublicationVersion.active_pin_count -= 1"
      - "AuditEvent TECHNICIAN_SUSPENDED plus one SEAT_REVOKED / SESSION_TERMINATED / JOB_ABORTED per affected row"
      - "increments Technician.version by 1"

  - method: POST
    path: "/technicians/{id}/revoke"
    description: "Permanently revoke a SUSPENDED technician's identity (terminal)"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Technician
    side_effects:
      - "identity_status = REVOKED"
      - "increments Technician.version by 1"

  # ---- entitlements & seats ----
  - method: POST
    path: "/entitlements"
    description: "Buy a shop-level entitlement under a license; stamps the PROVISIONAL charge and debits data credit"
    roles: [ShopManager]
    code: 201
    input: [shop_id, license_id, entitlement_model, seats_total, "vin_quota?", window_start, window_end]
    output: ShopEntitlement
    side_effects:
      - "runs calculations.entitlement_charge variant PROVISIONAL and stamps charged_cents"
      - "Shop.data_credit_balance_cents -= charged_cents; increments Shop.version by 1"
      - "status = PENDING, settlement_status = UNSETTLED, seats_assigned = 0, seats_available = seats_total"

  - method: GET
    path: "/entitlements/{id}"
    description: "Read one entitlement including its charge, settlement and seat ledger fields"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager]
    code: 200
    input: []
    output: ShopEntitlement
    side_effects: []

  - method: GET
    path: "/entitlements"
    description: "List entitlements filtered by shop, license and/or status"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager]
    code: 200
    input: ["shop_id?", "license_id?", "status?", "limit?", "offset?"]
    output: ShopEntitlement[]
    side_effects: []

  - method: POST
    path: "/entitlements/{id}/activate"
    description: "Activate a PENDING entitlement; requires its license to be ACTIVE"
    roles: [ShopManager]
    code: 200
    input: []
    output: ShopEntitlement
    side_effects:
      - "status = ACTIVE"
      - "Shop.coverage_completeness_pct recomputed"
      - "increments ShopEntitlement.version by 1"

  - method: POST
    path: "/entitlements/{id}/cancel"
    description: "Cancel an entitlement, settle it with the FINAL variant and refund the difference"
    roles: [ShopManager]
    code: 200
    input: [reason]
    output: ShopEntitlement
    side_effects:
      - "status = CANCELLED; runs calculations.entitlement_charge variant FINAL; settled_cents stamped; settlement_status = SETTLED"
      - "Shop.data_credit_balance_cents += (charged_cents - settled_cents)"
      - "ACTIVE seats revoked, their ACTIVE sessions terminated and those sessions' jobs aborted"
      - "Shop.coverage_completeness_pct recomputed; AuditEvent ENTITLEMENT_SETTLED appended"
      - "increments ShopEntitlement.version by 1"

  - method: POST
    path: "/seat-assignments"
    description: "Seat a technician on an entitlement, or re-seat one (superseding the prior ACTIVE row); OCC-guarded on the entitlement's version"
    roles: [ShopManager]
    code: 201
    input: [entitlement_id, technician_id, expected_entitlement_version]
    output: SeatAssignment
    side_effects:
      - "new SeatAssignment.status = ACTIVE; any prior ACTIVE row for the same (entitlement_id, technician_id) -> SUPERSEDED"
      - "ShopEntitlement.seats_assigned / seats_available recomputed by calculations.seat_ledger"
      - "increments ShopEntitlement.version by 1"
      - "AuditEvent SEAT_ASSIGNED appended"

  - method: GET
    path: "/seat-assignments/{id}"
    description: "Read one seat assignment"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager, Technician]
    code: 200
    input: []
    output: SeatAssignment
    side_effects: []

  - method: GET
    path: "/seat-assignments"
    description: "List seat assignments filtered by entitlement, technician and/or status"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager, Technician]
    code: 200
    input: ["entitlement_id?", "technician_id?", "status?", "limit?", "offset?"]
    output: SeatAssignment[]
    side_effects: []

  - method: POST
    path: "/seat-assignments/{id}/revoke"
    description: "Revoke a seat; terminates that seat's ACTIVE session and aborts its jobs"
    roles: [ShopManager]
    code: 200
    input: [reason]
    output: SeatAssignment
    side_effects:
      - "status = REVOKED; revocation_reason stamped"
      - "ShopEntitlement.seats_assigned -= 1; increments ShopEntitlement.version by 1"
      - "ACTIVE GatewaySession on this seat -> TERMINATED with calculations.gateway_access_fee stamped, tool released, jobs aborted, pin counts decremented"
      - "AuditEvent SEAT_REVOKED appended"

  # ---- diagnostic tools ----
  - method: POST
    path: "/diagnostic-tools"
    description: "Register a scan tool at a shop with its OEM security attestation expiry"
    roles: [ShopManager]
    code: 201
    input: [shop_id, serial_no, oem_attestation_expires_at]
    output: DiagnosticTool
    side_effects: ["status = IDLE"]

  - method: GET
    path: "/shops/{id}/diagnostic-tools"
    description: "List a shop's scan tools"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DiagnosticTool[]
    side_effects: []

  # ---- publications & versions ----
  - method: POST
    path: "/publications"
    description: "Open a publication for one (vehicle model, system area, publication type) cell"
    roles: [ContentPublisher]
    code: 201
    input: [vehicle_model_id, system_area_id, publication_type]
    output: Publication
    side_effects: ["current_version_no = 0, published_version_id = null"]

  - method: GET
    path: "/publications/{id}"
    description: "Read one publication including its current and published version pointers"
    roles: [PlatformAdmin, ContentPublisher, ComplianceOfficer, ShopManager]
    code: 200
    input: []
    output: Publication
    side_effects: []

  - method: GET
    path: "/publications"
    description: "List publications filtered by model, system area and/or type"
    roles: [PlatformAdmin, ContentPublisher, ComplianceOfficer, ShopManager]
    code: 200
    input: ["vehicle_model_id?", "system_area_id?", "publication_type?", "limit?", "offset?"]
    output: Publication[]
    side_effects: []

  - method: POST
    path: "/publications/{id}/versions"
    description: "Ingest a TSB as a new version of a publication; OCC-guarded on the publication's version"
    roles: [ContentPublisher]
    code: 201
    input: [source_tsb_ref, "calibration_procedure_ref?", expected_publication_version]
    output: PublicationVersion
    side_effects:
      - "version_no = Publication.current_version_no + 1; review_status = DRAFT; distribution_status = WITHHELD"
      - "Publication.current_version_no = version_no; increments Publication.version by 1"

  - method: GET
    path: "/publications/{id}/versions"
    description: "List the versions of one publication, ordered by version_no ASC"
    roles: [PlatformAdmin, ContentPublisher, ComplianceOfficer, ShopManager]
    code: 200
    input: ["review_status?", "distribution_status?", "limit?", "offset?"]
    output: PublicationVersion[]
    side_effects: []

  - method: POST
    path: "/publication-versions/{id}/validate"
    description: "Move a version's editorial axis DRAFT -> VALIDATED"
    roles: [ContentPublisher]
    code: 200
    input: [reviewer_notes]
    output: PublicationVersion
    side_effects:
      - "review_status = VALIDATED; validated_by_user_id = X-User-ID"
      - "Shop.coverage_completeness_pct recomputed for every affected shop"
      - "increments PublicationVersion.version by 1"

  - method: POST
    path: "/publication-versions/{id}/publish"
    description: "Move a version's availability axis WITHHELD -> PUBLISHED, superseding the prior published sibling; refused when the acting publisher is the one who validated it"
    roles: [ContentPublisher]
    code: 200
    input: []
    output: PublicationVersion
    side_effects:
      - "distribution_status = PUBLISHED; published_by_user_id = X-User-ID; Publication.published_version_id updated"
      - "prior PUBLISHED sibling -> SUPERSEDED; its IN_PROGRESS jobs -> REVALIDATION_REQUIRED; its QUEUED jobs -> ABORTED; its active_pin_count decremented per departing job"
      - "Shop.coverage_completeness_pct recomputed; AuditEvent VERSION_PUBLISHED appended"
      - "increments PublicationVersion.version by 1"

  - method: POST
    path: "/publication-versions/{id}/recall"
    description: "Recall a PUBLISHED version; forces revalidation on every job pinned to it"
    roles: [ContentPublisher]
    code: 200
    input: [reason]
    output: PublicationVersion
    side_effects:
      - "distribution_status = RECALLED; Publication.published_version_id = null"
      - "IN_PROGRESS jobs pinned to it -> REVALIDATION_REQUIRED; QUEUED jobs -> ABORTED; active_pin_count decremented per departing job"
      - "Shop.coverage_completeness_pct recomputed; AuditEvent VERSION_RECALLED appended"
      - "increments PublicationVersion.version by 1"

  # ---- gateway sessions ----
  - method: POST
    path: "/gateway-sessions"
    description: "Request a secure-gateway session on a tool for one VIN inside the entitlement window; no credential is issued yet"
    roles: [Technician]
    code: 201
    input: [seat_assignment_id, diagnostic_tool_id, vin, window_start, window_end]
    output: GatewaySession
    side_effects: ["status = REQUESTED; credential_token = null; all four money fields = 0"]

  - method: GET
    path: "/gateway-sessions/{id}"
    description: "Read one session including its credential token and stamped access fee"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager, Technician]
    code: 200
    input: []
    output: GatewaySession
    side_effects: []

  - method: GET
    path: "/gateway-sessions"
    description: "List sessions filtered by seat, tool and/or status"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager, Technician]
    code: 200
    input: ["seat_assignment_id?", "diagnostic_tool_id?", "status?", "limit?", "offset?"]
    output: GatewaySession[]
    side_effects: []

  - method: POST
    path: "/gateway-sessions/{id}/activate"
    description: "Issue the secure-gateway credential and occupy the tool; runs the identity, credential-expiry, attestation and half-open tool-overlap gates"
    roles: [Technician]
    code: 200
    input: []
    output: GatewaySession
    side_effects:
      - "status = ACTIVE; credential_token minted"
      - "DiagnosticTool.status = OCCUPIED; occupied_by_session_id set; increments DiagnosticTool.version by 1"
      - "AuditEvent SESSION_CREDENTIAL_ISSUED appended"
      - "increments GatewaySession.version by 1"

  - method: POST
    path: "/gateway-sessions/{id}/complete"
    description: "Close an ACTIVE session; branches to COMPLETED before window_end and to EXPIRED at or after it, pricing the session either way"
    roles: [Technician]
    code: 200
    input: []
    output: GatewaySession
    side_effects:
      - "status = COMPLETED or EXPIRED per the window_end branch"
      - "runs calculations.gateway_access_fee; Shop.gateway_fee_accrued_cents += total_access_fee_cents"
      - "DiagnosticTool released to IDLE; residual jobs aborted with pin counts decremented"
      - "AuditEvent SESSION_COMPLETED (COMPLETED branch) or SESSION_TERMINATED (EXPIRED branch) appended"
      - "increments GatewaySession.version by 1"

  # ---- programming jobs ----
  - method: POST
    path: "/programming-jobs"
    description: "Queue an immobilizer, module-flash or ADAS calibration job pinned to a published procedure version"
    roles: [Technician]
    code: 201
    input: [session_id, job_type, pinned_publication_version_id]
    output: ModuleProgrammingJob
    side_effects:
      - "status = QUEUED; repin_count = 0"
      - "pinned PublicationVersion.active_pin_count += 1"

  - method: GET
    path: "/programming-jobs/{id}"
    description: "Read one programming job"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager, Technician]
    code: 200
    input: []
    output: ModuleProgrammingJob
    side_effects: []

  - method: GET
    path: "/programming-jobs"
    description: "List programming jobs filtered by session, pinned version and/or status"
    roles: [PlatformAdmin, ComplianceOfficer, ShopManager, Technician]
    code: 200
    input: ["session_id?", "pinned_publication_version_id?", "status?", "limit?", "offset?"]
    output: ModuleProgrammingJob[]
    side_effects: []

  - method: POST
    path: "/programming-jobs/{id}/start"
    description: "Start a QUEUED job; runs the credential-expiry, pinned-version and ADAS calibration-doc gates"
    roles: [Technician]
    code: 200
    input: []
    output: ModuleProgrammingJob
    side_effects:
      - "status = IN_PROGRESS; AuditEvent JOB_STARTED appended"
      - "increments ModuleProgrammingJob.version by 1"

  - method: POST
    path: "/programming-jobs/{id}/complete"
    description: "Complete an IN_PROGRESS job"
    roles: [Technician]
    code: 200
    input: []
    output: ModuleProgrammingJob
    side_effects:
      - "status = COMPLETED; pinned PublicationVersion.active_pin_count -= 1"
      - "AuditEvent JOB_COMPLETED appended"
      - "increments ModuleProgrammingJob.version by 1"

  - method: POST
    path: "/programming-jobs/{id}/repin"
    description: "Re-pin a REVALIDATION_REQUIRED job to a currently PUBLISHED version of the same publication and resume it"
    roles: [Technician]
    code: 200
    input: [pinned_publication_version_id]
    output: ModuleProgrammingJob
    side_effects:
      - "pinned_publication_version_id replaced; repin_count += 1; status = IN_PROGRESS"
      - "new pinned PublicationVersion.active_pin_count += 1"
      - "increments ModuleProgrammingJob.version by 1"

  # ---- audit & clock ----
  - method: GET
    path: "/audit-events"
    description: "Append-only audit trail required for secure-gateway access, filterable by subject and actor; ordered by occurred_at ASC then created_at ASC"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["subject_entity?", "subject_id?", "actor_user_id?", "event_type?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock moved; no entity is mutated and no auto-transition fires on the clock move itself"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_CROSS_SHOP_ACCESS
    http: 403
    condition: "a ShopManager addresses a Shop, entitlement, technician, tool or seat that does not belong to its own X-User-ID"
  - id: ERR_NOT_SEAT_HOLDER
    http: 403
    condition: "a Technician acts on a seat, session or job whose SeatAssignment.technician_id is not its own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ContentPublisher publishing a version is the same X-User-ID that validated it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, unknown field, missing required field, out-of-range enum or integer, bad datetime, VIN not 17 chars, or pagination outside limit 1..100 / offset >= 0"
  - id: ERR_MANUFACTURER_NOT_FOUND
    http: 404
    condition: "manufacturer id in path or body does not exist"
  - id: ERR_SHOP_NOT_FOUND
    http: 404
    condition: "shop id in path or body does not exist"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "license id in path or body does not exist"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "technician id in path or body does not exist"
  - id: ERR_ENTITLEMENT_NOT_FOUND
    http: 404
    condition: "entitlement id in path or body does not exist"
  - id: ERR_SEAT_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "seat assignment id in path or body does not exist"
  - id: ERR_PUBLICATION_NOT_FOUND
    http: 404
    condition: "publication id in path does not exist"
  - id: ERR_PUBLICATION_VERSION_NOT_FOUND
    http: 404
    condition: "publication version id in path or body does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "gateway session id in path or body does not exist"
  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "programming job id in path does not exist"
  - id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 404
    condition: "a secondary reference does not resolve: a SystemArea id in covered_system_area_ids, request.system_area_id, request.vehicle_model_id, request.diagnostic_tool_id, or a repin target that belongs to a different publication"
  - id: ERR_STALE_ENTITLEMENT_VERSION
    http: 412
    condition: "expected_entitlement_version does not equal the entitlement's current version"
  - id: ERR_STALE_PUBLICATION_PARENT_VERSION
    http: 412
    condition: "expected_publication_version does not equal the publication's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the row's current state"
  - id: ERR_JOB_REVALIDATION_REQUIRED
    http: 409
    condition: "a job in REVALIDATION_REQUIRED is asked to complete instead of being re-pinned"
  - id: ERR_PARITY_NON_COMPLIANT
    http: 409
    condition: "a license activation is attempted while its OEM's stored LIST_BASIS parity_status is NON_COMPLIANT"
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 409
    condition: "an entitlement is created or activated while its license is DRAFT, SUSPENDED or TERMINATED"
  - id: ERR_ENTITLEMENT_NOT_ACTIVE
    http: 409
    condition: "a session is requested or activated while the entitlement behind its seat is not ACTIVE"
  - id: ERR_TECHNICIAN_NOT_VERIFIED
    http: 409
    condition: "session activation is attempted while the seated technician's identity_status is not VERIFIED"
  - id: ERR_VERSION_NOT_PUBLISHED
    http: 409
    condition: "a job is pinned to, started on, or re-pinned to a version whose distribution_status is WITHHELD"
  - id: ERR_SECURITY_CREDENTIAL_EXPIRED
    http: 409
    condition: "the technician's credential_expires_at is at or before current_utc, or a verify call supplies an already-lapsed credential_expires_at"
  - id: ERR_TOOL_ATTESTATION_EXPIRED
    http: 409
    condition: "session activation is attempted at or after the tool's oem_attestation_expires_at"
  - id: ERR_CALIBRATION_DOC_REQUIRED
    http: 422
    condition: "an ADAS_CALIBRATION job is started while its cell has no VALIDATED+PUBLISHED CALIBRATION_DOC version"
  - id: ERR_STALE_PUBLICATION_VERSION
    http: 409
    condition: "a job is pinned to or started on a version whose distribution_status is SUPERSEDED or RECALLED"
  - id: ERR_TOOL_SHOP_MISMATCH
    http: 422
    condition: "the requested diagnostic tool belongs to a different shop than the entitlement behind the seat"
  - id: ERR_SEAT_CAP_EXCEEDED
    http: 422
    condition: "seats_total exceeds License.seat_cap, entitlement_model is not permitted by License.license_model, or vin_quota does not match the chosen model"
  - id: ERR_NO_SEATS_AVAILABLE
    http: 409
    condition: "a new technician is seated while the entitlement's seats_available is 0"
  - id: ERR_ENTITLEMENT_WINDOW_CONFLICT
    http: 409
    condition: "a new entitlement window touches, overlaps, or sits within 24 hours of a PENDING/ACTIVE sibling window on the same (shop, license)"
  - id: ERR_TOOL_WINDOW_CONFLICT
    http: 409
    condition: "activating a session would overlap, under half-open arithmetic, an ACTIVE session on the same tool"
  - id: ERR_SESSION_WINDOW_OUTSIDE_ENTITLEMENT
    http: 422
    condition: "the requested session window is not fully inside the entitlement window, or window_end is not after window_start"
  - id: ERR_INSUFFICIENT_DATA_CREDIT
    http: 402
    condition: "the shop's data_credit_balance_cents is below the PROVISIONAL charge of the requested entitlement"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Platform operator that curates OEMs, system areas, vehicle models, licenses, shops, shop credit and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /system-areas"
      - "POST /manufacturers"
      - "PATCH /manufacturers/{id}/pricing"
      - "POST /vehicle-models"
      - "POST /licenses"
      - "POST /licenses/{id}/activate"
      - "POST /licenses/{id}/suspend"
      - "POST /licenses/{id}/terminate"
      - "POST /shops"
      - "POST /shops/{id}/credit-funding"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /manufacturers/{id}"
      - "GET /manufacturers/{id}/parity-report"
      - "GET /manufacturers/{id}/licenses"
      - "GET /manufacturers/{id}/vehicle-models"
      - "GET /shops/{id}"
      - "GET /shops/{id}/coverage-map"
      - "GET /shops/{id}/technicians"
      - "GET /shops/{id}/diagnostic-tools"
      - "GET /entitlements/{id}"
      - "GET /entitlements"
      - "GET /seat-assignments/{id}"
      - "GET /seat-assignments"
      - "GET /publications/{id}"
      - "GET /publications"
      - "GET /publications/{id}/versions"
      - "GET /gateway-sessions/{id}"
      - "GET /gateway-sessions"
      - "GET /programming-jobs/{id}"
      - "GET /programming-jobs"
      - "GET /audit-events"

  - name: ContentPublisher
    description: "Editorial operator that ingests technical service bulletins, validates procedure versions and controls their distribution"
    identity: opaque
    exclusive_operations:
      - "POST /publications"
      - "POST /publications/{id}/versions"
      - "POST /publication-versions/{id}/validate"
      - "POST /publication-versions/{id}/publish"
      - "POST /publication-versions/{id}/recall"
    shared_operations:
      - "GET /manufacturers/{id}"
      - "GET /manufacturers/{id}/vehicle-models"
      - "GET /publications/{id}"
      - "GET /publications"
      - "GET /publications/{id}/versions"
    segregation_note: "A ContentPublisher whose X-User-ID equals a version's validated_by_user_id cannot publish that version (ERR_SEGREGATION_OF_DUTIES); two distinct ContentPublisher operator ids are therefore required to move a version through validate + publish."

  - name: ComplianceOfficer
    description: "Right-to-repair compliance operator that verifies, suspends and revokes technician identities and reads the audit trail"
    identity: opaque
    exclusive_operations:
      - "POST /technicians/{id}/verify"
      - "POST /technicians/{id}/suspend"
      - "POST /technicians/{id}/revoke"
    shared_operations:
      - "GET /manufacturers/{id}"
      - "GET /manufacturers/{id}/parity-report"
      - "GET /manufacturers/{id}/licenses"
      - "GET /manufacturers/{id}/vehicle-models"
      - "GET /shops/{id}"
      - "GET /shops/{id}/coverage-map"
      - "GET /shops/{id}/technicians"
      - "GET /shops/{id}/diagnostic-tools"
      - "GET /entitlements/{id}"
      - "GET /entitlements"
      - "GET /seat-assignments/{id}"
      - "GET /seat-assignments"
      - "GET /publications/{id}"
      - "GET /publications"
      - "GET /publications/{id}/versions"
      - "GET /gateway-sessions/{id}"
      - "GET /gateway-sessions"
      - "GET /programming-jobs/{id}"
      - "GET /programming-jobs"
      - "GET /audit-events"

  - name: ShopManager
    description: "Independent repair shop operator; X-User-ID is the Shop.id it manages"
    identity: "entity_backed:Shop"
    exclusive_operations:
      - "POST /technicians"
      - "POST /entitlements"
      - "POST /entitlements/{id}/activate"
      - "POST /entitlements/{id}/cancel"
      - "POST /seat-assignments"
      - "POST /seat-assignments/{id}/revoke"
      - "POST /diagnostic-tools"
    shared_operations:
      - "GET /manufacturers/{id}"
      - "GET /manufacturers/{id}/parity-report"
      - "GET /manufacturers/{id}/licenses"
      - "GET /manufacturers/{id}/vehicle-models"
      - "GET /shops/{id}"
      - "GET /shops/{id}/coverage-map"
      - "GET /shops/{id}/technicians"
      - "GET /shops/{id}/diagnostic-tools"
      - "GET /entitlements/{id}"
      - "GET /entitlements"
      - "GET /seat-assignments/{id}"
      - "GET /seat-assignments"
      - "GET /publications/{id}"
      - "GET /publications"
      - "GET /publications/{id}/versions"
      - "GET /gateway-sessions/{id}"
      - "GET /gateway-sessions"
      - "GET /programming-jobs/{id}"
      - "GET /programming-jobs"

  - name: Technician
    description: "Seated technician acting at the secure gateway; X-User-ID is the Technician.id"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /gateway-sessions"
      - "POST /gateway-sessions/{id}/activate"
      - "POST /gateway-sessions/{id}/complete"
      - "POST /programming-jobs"
      - "POST /programming-jobs/{id}/start"
      - "POST /programming-jobs/{id}/complete"
      - "POST /programming-jobs/{id}/repin"
    shared_operations:
      - "GET /seat-assignments/{id}"
      - "GET /seat-assignments"
      - "GET /gateway-sessions/{id}"
      - "GET /gateway-sessions"
      - "GET /programming-jobs/{id}"
      - "GET /programming-jobs"
