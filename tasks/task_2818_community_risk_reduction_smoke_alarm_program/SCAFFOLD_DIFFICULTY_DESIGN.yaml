          A different metric on a different endpoint: the retention percentage on the zone
          outcome-summary read. The zone has one served household whose only follow-up outcome is
          NO_ANSWER, so the eligible set is empty and retention_rate_pct must be null - never 0.00,
          which would read as a total retention failure. rate_delta_pct is null on the same read for
          the analogous reason (a zero baseline rate is not a denominator).
