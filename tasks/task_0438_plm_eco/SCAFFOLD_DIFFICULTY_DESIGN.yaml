  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: deviation_inclusive_window_overlap
        grounds:
          - validations[priority=12]
          - state_machines.Deviation.SUBMITTED_to_GRANTED
          - entities.Deviation.fields.effective_from
          - entities.Deviation.fields.effective_to
        distinguishing_aspect: |
          Two GRANTED deviations on the same part_id+defect_code with INCLUSIVE [from,to]
          windows that touch at a shared endpoint (dev1 ..2026-06-30, dev2 2026-06-30..)
          collide -> ERR_DEVIATION_WINDOW_OVERLAP, because the shared boundary day counts
          as overlap (closed-interval semantics) on the Deviation resource.
        test_recipe:
          setup:
            - "Part with one GRANTED DIMENSIONAL deviation [2026-01-01, 2026-06-30]."
            - "A second SUBMITTED DIMENSIONAL deviation [2026-06-30, 2026-12-31] (touches at 2026-06-30)."
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "OV-P1", name: "OvP1", part_type: "MAKE", base_cost_cents: 100 }
              as: Designer
              captures: { ov1_id: $.data.id }
            - call: "POST /plm/deviations"
              payload: { part_id: "${ov1_id}", defect_code: "DIMENSIONAL", max_units: 5, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z" }
              as: Designer
              captures: { ov1_d1: $.data.id }
            - call: "POST /plm/deviations/${ov1_d1}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/deviations/${ov1_d1}/grant"
              payload: {}
              as: QualityEngineer
            - call: "POST /plm/deviations"
              payload: { part_id: "${ov1_id}", defect_code: "DIMENSIONAL", max_units: 5, effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Designer
              captures: { ov1_d2: $.data.id }
            - call: "POST /plm/deviations/${ov1_d2}/submit"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /plm/deviations/${ov1_d2}/grant"
              payload: {}
              as: QualityEngineer
              captures: { eid: $.data.error_id }
          assert:
            - "grant returns 409 with data.error_id == ERR_DEVIATION_WINDOW_OVERLAP (shared boundary day overlaps)"

      - name: revision_exclusive_occupancy_by_eco
        grounds:
          - validations[priority=12.5]
          - entities.PartRevision.fields.governing_change_order_id
          - entities.ChangeAffectedItem.fields.change_order_id
        distinguishing_aspect: |
          A PartRevision is an exclusively-occupiable resource: it may be governed by at
          most one non-terminal ECO. Attaching the SAME revision as an affected item to a
          second DRAFT ECO collides with its existing occupancy and is rejected with
          ERR_REVISION_ALREADY_GOVERNED — point/exclusive-occupancy interval semantics
          (vs the deviation's two-sided closed-interval overlap) on a different resource
          (PartRevision/ECO vs Deviation/Part).
        test_recipe:
          setup:
            - "A WORKING revision already attached as an affected item to one DRAFT ECO (eco1)."
            - "A second DRAFT ECO (eco2) from a different APPROVED ECR exists."
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "OCC-EXC", name: "OccExc", part_type: "PHANTOM" }
              as: Designer
              captures: { ov2_id: $.data.id, ov2_v0: $.data.version }
            - call: "POST /plm/parts/${ov2_id}/revisions"
              payload: { expected_part_version: "${ov2_v0}" }
              as: Designer
              captures: { ov2r_id: $.data.id }
            # ECR1 + ECO1 (eco1) — attach the revision here first
            - call: "POST /plm/change-requests"
              payload: { title: "occ1", affected_part_id: "${ov2_id}", reason_code: "DESIGN_DEFECT" }
              as: Designer
              captures: { ecr1: $.data.id }
            - call: "POST /plm/change-requests/${ecr1}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${ecr1}/approve"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/change-orders"
              payload: { change_request_id: "${ecr1}", effectivity_date: "2026-03-01T00:00:00Z", required_approvals: 1 }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { eco1: $.data.id }
            - call: "POST /plm/change-orders/${eco1}/affected-items"
              payload: { part_revision_id: "${ov2r_id}" }
              as: ChangeAdmin
              as_user_id: "ca1"
            # ECR2 + ECO2 (eco2) — second order targeting the same revision
            - call: "POST /plm/change-requests"
              payload: { title: "occ2", affected_part_id: "${ov2_id}", reason_code: "COST_REDUCTION" }
              as: Designer
              captures: { ecr2: $.data.id }
            - call: "POST /plm/change-requests/${ecr2}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${ecr2}/approve"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/change-orders"
              payload: { change_request_id: "${ecr2}", effectivity_date: "2026-04-01T00:00:00Z", required_approvals: 1 }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { eco2: $.data.id }
          trigger:
            - call: "POST /plm/change-orders/${eco2}/affected-items"
              payload: { part_revision_id: "${ov2r_id}" }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { eid: $.data.error_id }
          assert:
            - "second affected-items attach returns 409 with data.error_id == ERR_REVISION_ALREADY_GOVERNED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: eco_cancel_conserves_released_count
        grounds:
          - state_machines.EngineeringChangeOrder.IN_APPROVAL_to_CANCELLED
          - entities.ChangeAffectedItem.fields.pinned
          - entities.PartRevision.fields.governing_change_order_id
        distinguishing_aspect: |
          Conserved quantity = count of RELEASED PartRevisions for the affected part (=0
          before and after). Cancelling an IN_APPROVAL ECO detaches its affected items
          (governing_change_order_id cleared, pinned=false) and releases NOTHING — the
          released-revision count is unchanged by the submit+cancel round-trip.
        test_recipe:
          setup:
            - "ECO IN_APPROVAL with one affected revision (WORKING), part has zero RELEASED revisions."
          setup_api_calls:
