# =============================================================================
# PRD Benchmark Scaffold — task_2331
# League Merchandise Licensing & Royalty Administration
# Difficulty band: beyond Expert (§0.4) — 15 entities, 57 endpoints, 36 errors,
# 6 calculation rules (4 of them dual-variant), 10 state machines, 3 OCC races.
# =============================================================================

scenario: |
  2331. League Merchandise Licensing & Royalty Administration (professional league consumer products): licensee selection by product category with exclusivity terms, minimum guarantees and territory rights, product approval workflow with design submission, sample review and mark usage compliance, royalty rate structure by category with tiered rates and advance recoupment, quarterly royalty reporting with sales data audit rights and underreporting recovery, retailer authorization, distribution channel restrictions and closeout policies, player and team mark rights allocation with group licensing and individual player rights, counterfeit enforcement at events and online with seizure coordination, revenue sharing among clubs from centrally licensed products

domain_name: league-merch-licensing
api_prefix: /licensing

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # flat: all 15 entities are peers addressed as sibling collections under the
  # /licensing namespace and linked by explicit FK fields. The only two nested
  # URLs (`/agreements/{id}/territory-grants`, `/product-submissions/{id}/sample-reviews`)
  # exist for FK reverse-reachability, not for ownership nesting: every entity is
  # readable at its own top-level collection path and no entity's identity depends
  # on a URL ancestor.

  state_machine_shape: parallel
  # LicenseAgreement carries TWO independent state dimensions on one row:
  # contract_status (DRAFT→PENDING_SIGNATURE→ACTIVE⇄SUSPENDED→EXPIRED/TERMINATED)
  # and compliance_posture (CLEAR⇄WATCH⇄PROBATION⇄FROZEN, derived from the
  # licensee's risk index). ProductSubmission and RoyaltyReport and
  # AuditEngagement are cyclic (revision / re-file / re-issue loops);
  # ProductSubmission also branches on sample verdict with divergent side effects.

  relationship_patterns:
    - one_to_many        # Licensee→LicenseAgreement→RoyaltyReport, DistributionRun→ClubDistribution
    - many_to_many       # ProductSubmission.mark_ids ↔ MarkRight (by-value junction)
    - cross_aggregate    # MarkRight→Club/Player, RoyaltyReport.channel_lines→RetailerAuthorization
    - polymorphic        # MarkRight.owner_type selects which of club_id / player_id is required

  role_model: segregation_of_duties
  # The FinanceController user id that accepted a RoyaltyReport may not open the
  # AuditEngagement covering it, and the RoyaltyAuditor user id that issued
  # findings may not settle them. Peer ownership on top: Licensee acts only on
  # its own agreements, PlayerAgent only on its own player, ClubRepresentative
  # only on its own club's marks.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# Money is ALWAYS integer cents. Rates are ALWAYS integer basis points (bps,
# 1 bps = 0.01%). Fiscal quarter labels are strings "YYYYQn" (e.g. "2026Q2").
# Calendar helpers used across the scaffold (pinned once, referenced everywhere):
#   QUARTER_OF(instant)      -> "YYYYQn" of the UTC calendar date of `instant`
#   QUARTER_END_DATE(q)      -> 03-31 / 06-30 / 09-30 / 12-31 of that year
#   FILING_DEADLINE_DATE(q)  -> QUARTER_END_DATE(q) + 45 calendar days
#   ELAPSED_QUARTERS(a, b)   -> (year(b)-year(a))*4 + (qnum(b)-qnum(a))
# =============================================================================

entities:
  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered corporate name of the licensee company
        constraints: "1..200 chars; unique (case-insensitive) across Licensee"
      - name: contact_email
        type: string
        source: input
        description: royalty-correspondence mailbox
        constraints: "must contain '@'"
      - name: home_country_code
        type: string
        source: input
        description: ISO-3166-1 alpha-2 country of incorporation
        constraints: "exactly 2 uppercase letters"
      - name: status
        type: enum
        source: system
        description: licensee lifecycle state (see §1.2 SM1)
        default: PROSPECT
        constraints: "PROSPECT | ACTIVE | SUSPENDED | TERMINATED"
      - name: vendor_compliance_certified
        type: boolean
        source: system
        description: set true by the ACTIVATE action; social-compliance audit on file
        default: false
      - name: compliance_risk_index
        type: integer
        source: computed
        description: "latest ROLLING_MONITOR value of calculations.compliance_risk_index (0..100)"
        default: 0
        constraints: "0..100"
      - name: risk_index_as_of_quarter
        type: string
        source: computed
        description: "fiscal quarter the stored compliance_risk_index was computed for; null until first recompute"
        default: null
      - name: outstanding_recovery_cents
        type: integer
        source: computed
        description: "sum of AuditEngagement.recovery_assessed_cents over engagements whose agreement.licensee_id == this.id and status IN {FINDINGS_ISSUED, DISPUTED, SETTLED}"
        default: 0
      - name: agreement_count
        type: integer
        source: computed
        description: "count of LicenseAgreement rows with licensee_id == this.id and contract_status NOT IN {TERMINATED}"
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: reason text captured on the ACTIVE->SUSPENDED transition; cleared on REINSTATE
        default: null

  - name: ProductCategory
    parent: null
    common_fields: true
    fields:
      - name: category_code
        type: string
        source: input
        description: stable code for the consumer-product category
        constraints: "^[A-Z][A-Z0-9_]{2,39}$; unique across ProductCategory"
      - name: display_name
        type: string
        source: input
        description: human-readable category name
      - name: base_royalty_rate_bps
        type: integer
        source: input
        description: headline royalty rate advertised for the category; used only when tier_schedule is a single tier
        constraints: "100..3000"
      - name: tier_schedule
        type: array
        source: input
        description: "ordered tiers [{from_cents, to_cents, rate_bps}]; each interval is half-open [from_cents, to_cents), to_cents null means unbounded"
        constraints: "1..5 tiers; tiers[0].from_cents == 0; contiguous (tiers[i].to_cents == tiers[i+1].from_cents); only the last tier may have to_cents null; rate_bps 100..3000"
      - name: closeout_rate_bps
        type: integer
        source: input
        description: reduced royalty rate applied to closeout sales inside the closeout cap
        constraints: "50..3000"
      - name: closeout_cap_pct_bps
        type: integer
        source: input
        description: share of a channel line's gross sales that may be royalty-rated at closeout_rate_bps
        default: 1500
        constraints: "0..5000"
      - name: closeout_hard_limit_bps
        type: integer
        source: input
        description: share of a channel line's gross sales above which closeout sales are rejected outright
        default: 4000
        constraints: "closeout_cap_pct_bps..10000"
      - name: deduction_cap_pct_bps
        type: integer
        source: input
        description: share of a channel line's gross sales admissible as deductions when computing net regular sales
        default: 500
        constraints: "0..5000"
      - name: deduction_hard_limit_bps
        type: integer
        source: input
        description: share of a channel line's gross sales above which reported deductions are rejected outright
        default: 2000
        constraints: "deduction_cap_pct_bps..10000"
      - name: exclusivity_allowed
        type: boolean
        source: input
        description: whether agreements in this category may be EXCLUSIVE
        default: true
      - name: minimum_guarantee_floor_cents
        type: integer
        source: input
        description: smallest minimum guarantee the league will accept for this category
        constraints: ">= 0"
      - name: advance_floor_bps_of_mg
        type: integer
        source: input
        description: minimum advance expressed in bps of the agreement's minimum guarantee
        default: 2500
        constraints: "0..10000"
      - name: mark_usage_class
        type: enum
        source: input
        description: which MarkRight.owner_type values may appear on submissions in this category
        constraints: "LEAGUE_ONLY (LEAGUE only) | LEAGUE_AND_CLUB (LEAGUE, CLUB) | LEAGUE_CLUB_AND_PLAYER (LEAGUE, CLUB, PLAYER_GROUP, PLAYER_INDIVIDUAL)"
      - name: central_licensing_default
        type: boolean
        source: input
        description: default value for LicenseAgreement.central_licensing_flag in this category
        default: true

  - name: Club
    parent: null
    common_fields: true
    fields:
      - name: club_code
        type: string
        source: input
        description: three-letter club code; also the deterministic tie-break key for distribution remainders
        constraints: "^[A-Z]{3}$; unique across Club"
      - name: market_name
        type: string
        source: input
        description: club market/city name
      - name: revenue_share_units
        type: integer
        source: input
        description: weighting units used by the weighted component of central-pool revenue sharing
        constraints: "1..100"
      - name: status
        type: enum
        source: input
        description: whether the club participates in the current distribution cycle
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"
      - name: lifetime_distributed_cents
        type: integer
        source: computed
        description: "sum of ClubDistribution.amount_cents over rows with club_id == this.id"
        default: 0

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: player name as licensed
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; club the player is rostered with
      - name: group_licensing_opt_in
        type: boolean
        source: input
        description: whether the player participates in the league group-licensing program (gates PLAYER_GROUP marks)
        default: true
      - name: individual_grant_category_ids
        type: array
        source: input
        description: "ProductCategory.id values for which this player has granted individual (non-group) rights; gates PLAYER_INDIVIDUAL marks"
        default: []
      - name: status
        type: enum
        source: input
        description: roster status
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: MarkRight
    parent: null
    common_fields: true
    fields:
      - name: mark_code
        type: string
        source: input
        description: registered mark identifier (wordmark, logo, uniform, name/likeness)
        constraints: "^[A-Z0-9_]{3,40}$; unique across MarkRight"
      - name: owner_type
        type: enum
        source: input
        description: rights holder class of the mark
        constraints: "LEAGUE | CLUB | PLAYER_GROUP | PLAYER_INDIVIDUAL"
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; REQUIRED when owner_type == CLUB, MUST be null otherwise"
        default: null
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; REQUIRED when owner_type IN {PLAYER_GROUP, PLAYER_INDIVIDUAL}, MUST be null otherwise"
        default: null
      - name: usage_class
        type: enum
        source: input
        description: permitted prominence of the mark on product
        default: PRIMARY
        constraints: "PRIMARY | SECONDARY | HERITAGE"
      - name: royalty_share_bps
        type: integer
        source: input
        description: informational share of the player group pool attributed to this mark
        default: 0
        constraints: "0..10000"
      - name: status
        type: enum
        source: system
        description: availability of the mark for new and existing approvals (see §1.2 SM10)
        default: ACTIVE
        constraints: "ACTIVE | RESTRICTED | WITHDRAWN"
      - name: status_reason
        type: string
        source: system
        description: reason captured on the last WITHDRAW / RESTRICT / REINSTATE action
        default: null
      - name: withdrawn_at
        type: datetime
        source: system
        description: logical-clock instant of the last transition into WITHDRAWN; null while never withdrawn
        default: null

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; the licensed company
      - name: category_id
        type: string
        source: input
        description: FK -> ProductCategory.id; the licensed product category
      - name: exclusivity_mode
        type: enum
        source: input
        description: whether the licensee holds the category exclusively in its granted territories
        constraints: "EXCLUSIVE | NON_EXCLUSIVE; EXCLUSIVE requires category.exclusivity_allowed == true"
      - name: minimum_guarantee_cents
        type: integer
        source: input
        description: contractual minimum guarantee for the whole term
        constraints: ">= category.minimum_guarantee_floor_cents"
      - name: required_advance_cents
        type: integer
        source: computed
        description: "round_half_up(minimum_guarantee_cents * category.advance_floor_bps_of_mg / 10000); recomputed only at agreement creation"
      - name: advance_paid_cents
        type: integer
        source: computed
        description: "cumulative advance cash received (sum of accepted advance-payment postings)"
        default: 0
      - name: unrecouped_advance_cents
        type: integer
        source: computed
        description: "advance still available to offset royalties; conserved identity: advance_paid_cents == unrecouped_advance_cents + recouped_advance_cents"
        default: 0
      - name: recouped_advance_cents
        type: integer
        source: computed
        description: "advance already consumed by accepted royalty; other half of the conserved advance identity"
        default: 0
      - name: term_start_date
        type: string
        source: input
        description: first day of the license term (UTC calendar date, YYYY-MM-DD, inclusive)
      - name: term_end_date
        type: string
        source: input
        description: last day of the license term (UTC calendar date, YYYY-MM-DD, inclusive)
        constraints: "> term_start_date; term must span 1..20 whole quarters"
      - name: central_licensing_flag
        type: boolean
        source: input
        description: whether royalties from this agreement feed the central club revenue-sharing pool
        default: true
      - name: contract_status
        type: enum
        source: system
        description: contractual lifecycle dimension (see §1.2 SM2)
        default: DRAFT
        constraints: "DRAFT | PENDING_SIGNATURE | ACTIVE | SUSPENDED | EXPIRED | TERMINATED"
      - name: compliance_posture
        type: enum
        source: system
        description: compliance dimension, independent of contract_status (see §1.2 SM3); derived from licensee.compliance_risk_index bands
        default: CLEAR
        constraints: "CLEAR | WATCH | PROBATION | FROZEN"
      - name: posture_as_of_quarter
        type: string
        source: computed
        description: fiscal quarter the current compliance_posture was derived for; null until first posture recompute
        default: null
      - name: cumulative_royalty_cents
        type: integer
        source: computed
        description: "sum of effective royalty over this agreement's reports with status IN {ACCEPTED, ADJUSTED, CLOSED}: adjusted_royalty_due_cents when non-null else royalty_due_cents"
        default: 0
      - name: contract_year_start_quarter
        type: string
        source: computed
        description: "QUARTER_OF(term_start_date); first quarter of contract year 1"
      - name: mg_accrued_shortfall_cents
        type: integer
        source: computed
        description: "interim minimum-guarantee shortfall from calculations.mg_shortfall_assessment variant INTERIM_PRO_RATA; refreshed by quarter-close"
        default: 0
      - name: mg_final_shortfall_cents
        type: integer
        source: computed
        description: "final minimum-guarantee shortfall from variant FINAL_AT_EXPIRY; null until the agreement reaches EXPIRED or TERMINATED"
        default: null
      - name: approved_sku_count
        type: integer
        source: computed
        description: "count of ProductSubmission rows with agreement_id == this.id and status == APPROVED"
        default: 0
      - name: authorized_channel_count
        type: integer
        source: computed
        description: "count of DISTINCT RetailerAuthorization.channel_class over rows with licensee_id == this.licensee_id, status == AUTHORIZED, and at least one sku_classes element present on an APPROVED submission of this agreement"
        default: 0
      - name: distribution_ready
        type: boolean
        source: computed
        description: "central_licensing_flag == true AND contract_status IN {ACTIVE, SUSPENDED, EXPIRED} AND approved_sku_count > 0 AND authorized_channel_count > 0"
        default: false
      - name: countersigned_by
        type: string
        source: system
        description: name captured on the PENDING_SIGNATURE->ACTIVE transition
        default: null
      - name: suspension_reason
        type: string
        source: system
        description: reason captured on ACTIVE->SUSPENDED; cleared on REINSTATE
        default: null
      - name: termination_reason
        type: string
        source: system
        description: reason captured on the transition into TERMINATED
        default: null

  - name: TerritoryGrant
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> LicenseAgreement.id; agreement the territory right belongs to
      - name: territory_code
        type: string
        source: input
        description: ISO-3166-1 alpha-2 country code or league region code granted
        constraints: "^[A-Z]{2,6}$"
      - name: channel_class
        type: enum
        source: input
        description: distribution channel the grant covers
        constraints: "DEPARTMENT | SPECIALTY | MASS | ECOMMERCE | OFF_PRICE | ALL"
      - name: effective_from
        type: string
        source: input
        description: first day the grant is in force (UTC date, INCLUSIVE)
      - name: effective_to
        type: string
        source: input
        description: first day the grant is no longer in force (UTC date, EXCLUSIVE — half-open interval)
        constraints: "> effective_from"
      - name: status
        type: enum
        source: system
        description: grant availability; REVOKED grants are ignored by exclusivity checks
        default: GRANTED
        constraints: "GRANTED | REVOKED"
      - name: exclusivity_mode_snapshot
        type: enum
        source: computed
        description: copy of agreement.exclusivity_mode at grant creation; the value exclusivity conflict detection reads
        constraints: "EXCLUSIVE | NON_EXCLUSIVE"

  - name: ProductSubmission
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> LicenseAgreement.id; agreement the product is submitted under
      - name: product_name
        type: string
        source: input
        description: product/design name as submitted
      - name: sku_class
        type: enum
        source: input
        description: SKU family of the product; retailer authorizations are scoped by these values
        constraints: "HEADWEAR | JERSEY | NOVELTY | CONSOLE_GAME | TRADING_CARD"
      - name: mark_ids
        type: array
        source: input
        description: "MarkRight.id values used on the design (by-value junction); 1..8 entries, no duplicates"
      - name: retail_price_cents
        type: integer
        source: input
        description: intended suggested retail price
        constraints: "> 0"
      - name: sample_required
        type: boolean
        source: input
        description: whether a physical sample review is required before approval
        default: true
      - name: status
        type: enum
        source: system
        description: design-approval workflow state (see §1.2 SM4)
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | IN_REVIEW | REVISION_REQUESTED | SAMPLE_REQUESTED | SAMPLE_PASSED | APPROVED | REJECTED | REVOKED"
      - name: revision_round
        type: integer
        source: computed
        description: number of REQUEST_REVISION decisions applied so far; increments on each entry into REVISION_REQUESTED
        default: 0
      - name: review_hold
        type: boolean
        source: computed
        description: "true while the agreement's compliance_posture IN {PROBATION, FROZEN}; blocks every review decision"
        default: false
      - name: defect_codes
        type: array
        source: computed
        description: defect codes from the most recent revision request or failed sample review
        default: []
      - name: approved_mark_snapshot
        type: array
        source: computed
        description: "pinned at APPROVE: [{mark_id, mark_version, usage_class}] for every mark in mark_ids"
        default: []
      - name: mark_snapshot_stale
        type: boolean
        source: computed
        description: "true when any snapshot entry's mark_version differs from the MarkRight's current version while status == APPROVED"
        default: false
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the LeagueLicensingManager who approved
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of approval
        default: null
      - name: revocation_reason
        type: string
        source: system
        description: "MARK_WITHDRAWN | LICENSEE_TERMINATED | COMPLIANCE_ORDER; set on APPROVED->REVOKED"
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: note captured on the REJECT decision
        default: null

  - name: SampleReview
    parent: null
    common_fields: false
    fields:
      - name: submission_id
        type: string
        source: input
        description: FK -> ProductSubmission.id; submission whose physical sample was inspected
      - name: verdict
        type: enum
        source: input
        description: outcome of the sample inspection
        constraints: "PASS | CONDITIONAL_PASS | FAIL"
      - name: sample_round
        type: integer
        source: computed
        description: "submission.revision_round + 1 at the instant the review is recorded"
      - name: defect_codes
        type: array
        source: input
        description: mark-usage / construction defect codes observed
        default: []
      - name: conditions
        type: string
        source: input
        description: conditions the licensee must honour when verdict == CONDITIONAL_PASS
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the MarkComplianceOfficer who recorded the verdict
      - name: occurrence_quarter
        type: string
        source: computed
        description: "QUARTER_OF(logical clock at creation); the quarter this record is dated for risk-index decay"

  - name: RetailerAuthorization
    parent: null
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; licensee that may ship to this retailer
      - name: retailer_name
        type: string
        source: input
        description: authorized retail account name
        constraints: "1..120 chars"
      - name: channel_class
        type: enum
        source: input
        description: distribution channel of the retailer
        constraints: "DEPARTMENT | SPECIALTY | MASS | ECOMMERCE | OFF_PRICE"
      - name: sku_classes
        type: array
        source: input
        description: "ProductSubmission.sku_class values the retailer may carry; 1..5 entries, no duplicates"
      - name: authorized_from
        type: string
        source: input
        description: first day of authorization (UTC date, INCLUSIVE)
      - name: authorized_to
        type: string
        source: input
        description: last day of authorization (UTC date, INCLUSIVE — closed interval)
        constraints: ">= authorized_from"
      - name: closeout_allowed
        type: boolean
        source: input
        description: whether closeout sales may be reported against this authorization
        default: false
      - name: status
        type: enum
        source: system
        description: authorization lifecycle (see §1.2 SM7)
        default: PENDING
        constraints: "PENDING | AUTHORIZED | SUSPENDED | REVOKED"
      - name: suspension_reason
        type: string
        source: system
        description: "NO_APPROVED_SKUS | COMPLIANCE_ORDER; set on AUTHORIZED->SUSPENDED"
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the LeagueLicensingManager who approved the authorization
        default: null

  - name: RoyaltyReport
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> LicenseAgreement.id; agreement the period is reported for
      - name: period_quarter
        type: string
        source: input
        description: reported fiscal quarter "YYYYQn"
        constraints: "^(20[0-9]{2})Q[1-4]$; unique per (agreement_id, period_quarter) among reports with status != RETURNED-superseded"
      - name: channel_lines
        type: array
        source: input
        description: "[{channel_class, retailer_authorization_id, gross_sales_cents, units, closeout_sales_cents, deductions_cents}]; 1..6 lines, one per channel_class (no duplicate channel_class)"
      - name: status
        type: enum
        source: system
        description: reporting/settlement state (see §1.2 SM5)
        default: DRAFT
        constraints: "DRAFT | FILED | RETURNED | ACCEPTED | UNDER_AUDIT | ADJUSTED | CLOSED"
      - name: net_regular_total_cents
        type: integer
        source: computed
        description: "sum over channel_lines of (gross_sales_cents - closeout_eligible_cents - allowed_deduction_cents); the tier-selection basis"
        default: 0
      - name: closeout_eligible_total_cents
        type: integer
        source: computed
        description: "sum over channel_lines of min(closeout_sales_cents, floor(gross_sales_cents * category.closeout_cap_pct_bps / 10000))"
        default: 0
      - name: applied_tier_rate_bps
        type: integer
        source: computed
        description: single tier rate selected for every line of this report by the active variant of calculations.royalty_due_computation
        default: 0
      - name: royalty_due_cents
        type: integer
        source: computed
        description: "royalty earned for the period; per-line rounding then summation (see calculations.royalty_due_computation)"
        default: 0
      - name: recoupment_applied_cents
        type: integer
        source: computed
        description: portion of royalty_due_cents offset against the agreement's unrecouped advance at ACCEPT
        default: 0
      - name: cash_due_pre_fee_cents
        type: integer
        source: computed
        description: "royalty_due_cents - recoupment_applied_cents; the base for the admin-fee waiver test and late interest"
        default: 0
      - name: late_days
        type: integer
        source: computed
        description: "max(0, calendar days from FILING_DEADLINE_DATE(period_quarter) to the UTC date of the FILE transition)"
        default: 0
      - name: late_filing_interest_cents
        type: integer
        source: computed
        description: "round_half_up(cash_due_pre_fee_cents * LATE_INTEREST_BPS_PER_DAY * late_days / 10000)"
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: small-payment handling fee; waiver evaluated on cash_due_pre_fee_cents (NOT on the post-fee total)
        default: 0
      - name: total_payable_cents
        type: integer
        source: computed
        description: "cash_due_pre_fee_cents + late_filing_interest_cents + admin_fee_cents"
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent FILE transition
        default: null
      - name: return_count
        type: integer
        source: computed
        description: number of RETURN decisions applied so far; feeds the REPORT_RETURN risk factor
        default: 0
      - name: return_reason
        type: string
        source: system
        description: reason captured on the most recent RETURN decision
        default: null
      - name: accepted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceController who accepted; barred from opening an audit over this report
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant of acceptance
        default: null
      - name: adjusted_royalty_due_cents
        type: integer
        source: computed
        description: restated royalty from an audit settlement; null until the report reaches ADJUSTED
        default: null
      - name: audit_engagement_id
        type: string
        source: computed
        description: FK -> AuditEngagement.id; engagement that pulled this report into UNDER_AUDIT; null otherwise
        default: null
      - name: distribution_run_id
        type: string
        source: computed
        description: FK -> DistributionRun.id; OPEN run this report's royalty was pooled into at ACCEPT; null otherwise
        default: null

  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> LicenseAgreement.id; agreement whose sales data is audited
      - name: scope_quarters
        type: array
        source: input
        description: "fiscal quarter labels in scope; 1..8 entries, no duplicates; each must have a report in status IN {ACCEPTED, CLOSED} on this agreement"
      - name: status
        type: enum
        source: system
        description: audit lifecycle (see §1.2 SM6)
        default: OPENED
        constraints: "OPENED | FIELDWORK | FINDINGS_ISSUED | DISPUTED | SETTLED | CLOSED"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the RoyaltyAuditor who opened the engagement
      - name: opened_quarter
        type: string
        source: computed
        description: "QUARTER_OF(logical clock at creation); interest accrual target quarter"
      - name: audited_quarters
        type: array
        source: computed
        description: "restated inputs as supplied to ISSUE_FINDINGS: the client sends [{period_quarter, audited_gross_sales_cents, audited_closeout_cents, audited_deductions_cents}] and the server echoes each entry back enriched with {recomputed_royalty_cents, reported_royalty_cents, underreported_cents}"
        default: []
      - name: recomputed_royalty_cents
        type: integer
        source: computed
        description: sum of recomputed royalty over audited_quarters
        default: 0
      - name: reported_royalty_cents
        type: integer
        source: computed
        description: sum of the previously effective royalty over audited_quarters
        default: 0
      - name: underreported_royalty_cents
        type: integer
        source: computed
        description: "sum over audited quarters of max(0, recomputed - reported)"
        default: 0
      - name: underreport_rate_bps
        type: integer
        source: computed
        description: "0 when reported_royalty_cents == 0 else floor(underreported_royalty_cents * 10000 / reported_royalty_cents)"
        default: 0
      - name: cost_shift_applied
        type: boolean
        source: computed
        description: "true when underreport_rate_bps >= COST_SHIFT_THRESHOLD_BPS (inclusive boundary)"
        default: false
      - name: audit_cost_recovery_cents
        type: integer
        source: computed
        description: flat audit-cost recovery charged to the licensee when cost_shift_applied
        default: 0
      - name: interest_cents
        type: integer
        source: computed
        description: per-quarter simple interest on each quarter's underreporting up to opened_quarter
        default: 0
      - name: recovery_assessed_cents
        type: integer
        source: computed
        description: "underreported_royalty_cents + interest_cents + audit_cost_recovery_cents"
        default: 0
      - name: findings_issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the RoyaltyAuditor who issued the current findings; barred from settling them
        default: null
      - name: findings_quarter
        type: string
        source: computed
        description: "QUARTER_OF(logical clock at the most recent findings issuance); the quarter the AUDIT_UNDERREPORT risk factor is dated for"
        default: null
      - name: findings_round
        type: integer
        source: computed
        description: number of findings issuances so far (initial issuance plus re-issuances after a dispute)
        default: 0
      - name: dispute_note
        type: string
        source: system
        description: licensee's dispute text captured on FINDINGS_ISSUED->DISPUTED
        default: null
      - name: settlement_basis
        type: enum
        source: system
        description: "FINDINGS | NEGOTIATED; recorded on SETTLED"
        default: null
      - name: settled_amount_cents
        type: integer
        source: computed
        description: "recovery_assessed_cents when settlement_basis == FINDINGS, else the negotiated amount"
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceController who settled
        default: null

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - name: venue_type
        type: enum
        source: input
        description: where the counterfeit activity was observed
        constraints: "EVENT | ONLINE"
      - name: venue_reference
        type: string
        source: input
        description: event name (EVENT) or marketplace/store URL (ONLINE)
      - name: target_name
        type: string
        source: input
        description: seller / vendor / storefront being enforced against
      - name: suspected_licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; licensee suspected of unauthorized overrun supply, null when the target is unaffiliated
        default: null
      - name: estimated_units
        type: integer
        source: input
        description: units estimated on hand at report time
        constraints: ">= 0"
      - name: estimated_retail_cents
        type: integer
        source: input
        description: estimated retail value of the infringing goods
        constraints: ">= 0"
      - name: seized_units
        type: integer
        source: computed
        description: units actually seized, recorded on ORDER_SEIZURE
        default: 0
      - name: seizure_authority
        type: string
        source: system
        description: authority coordinating the seizure (marshal, platform takedown desk)
        default: null
      - name: status
        type: enum
        source: system
        description: enforcement lifecycle (see §1.2 SM8)
        default: REPORTED
        constraints: "REPORTED | INVESTIGATING | SEIZURE_ORDERED | RESOLVED | DISMISSED"
      - name: occurrence_quarter
        type: string
        source: computed
        description: "QUARTER_OF(logical clock at ORDER_SEIZURE); the quarter the ENFORCEMENT_SEIZURE risk factor is dated for; null before seizure"
        default: null
      - name: disposition
        type: enum
        source: system
        description: "DESTROYED | SETTLED_WITH_TARGET | RELEASED; recorded on RESOLVE"
        default: null
      - name: recovered_cents
        type: integer
        source: computed
        description: cash recovered from the target on RESOLVE
        default: 0
      - name: dismissal_reason
        type: string
        source: system
        description: reason captured on DISMISS
        default: null

  - name: DistributionRun
    parent: null
    common_fields: true
    fields:
      - name: period_quarter
        type: string
        source: input
        description: fiscal quarter whose centrally licensed royalties are shared
        constraints: "^(20[0-9]{2})Q[1-4]$; unique across DistributionRun"
      - name: league_admin_rate_bps
        type: integer
        source: input
        description: league administration retention applied to the gross pool
        default: 800
        constraints: "0..3000"
      - name: status
        type: enum
        source: system
        description: distribution lifecycle (see §1.2 SM9)
        default: OPEN
        constraints: "OPEN | LOCKED | DISTRIBUTED"
      - name: projected_pool_cents
        type: integer
        source: computed
        description: running sum of effective royalty pooled by report acceptances while the run is OPEN
        default: 0
      - name: pool_gross_cents
        type: integer
        source: computed
        description: gross pool frozen at DISTRIBUTE (recomputed from eligible reports, not copied from projected_pool_cents)
        default: 0
      - name: league_admin_cents
        type: integer
        source: computed
        description: league retention withheld at DISTRIBUTE
        default: 0
      - name: player_pool_cents
        type: integer
        source: computed
        description: group-licensing player pool withheld at DISTRIBUTE
        default: 0
      - name: club_pool_cents
        type: integer
        source: computed
        description: "pool_gross_cents - league_admin_cents - player_pool_cents; fully allocated to ClubDistribution rows"
        default: 0
      - name: report_count
        type: integer
        source: computed
        description: number of eligible reports that formed pool_gross_cents
        default: 0
      - name: locked_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent OPEN->LOCKED transition
        default: null
      - name: distributed_at
        type: datetime
        source: system
        description: logical-clock instant of the LOCKED->DISTRIBUTED transition
        default: null

  - name: ClubDistribution
    parent: null
    common_fields: false
    fields:
      - name: run_id
        type: string
        source: computed
        description: FK -> DistributionRun.id; run that produced this allocation
      - name: club_id
        type: string
        source: computed
        description: FK -> Club.id; club receiving the allocation
      - name: club_code
        type: string
        source: computed
        description: snapshot of club.club_code; the deterministic tie-break key for remainder cents
      - name: revenue_share_units_snapshot
        type: integer
        source: computed
        description: snapshot of club.revenue_share_units used by the weighted component
      - name: equal_component_cents
        type: integer
        source: computed
        description: "floor(equal_component_total / club_count) portion attributed to this club before remainder allocation"
      - name: weighted_component_cents
        type: integer
        source: computed
        description: "floor of weighted_component_total * units / total_units portion attributed to this club before remainder allocation"
      - name: remainder_cent_applied
        type: integer
        source: computed
        description: "1 when this club received a largest-remainder cent, else 0"
        default: 0
      - name: amount_cents
        type: integer
        source: computed
        description: "floor(equal_share_exact + weighted_share_exact) + remainder_cent_applied; club allocations sum exactly to run.club_pool_cents"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
# Ten machines. LicenseAgreement carries TWO independent dimensions
# (contract_status, compliance_posture) on the same row — a transition on one
# dimension never implies a transition on the other.
# =============================================================================

state_machines:
  # ---------------------------------------------------------------- SM1
  - entity: Licensee
    dimension: status
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /licensing/licensees/{licenseeId}/status  {action: ACTIVATE}"
        actor: LeagueLicensingManager
        preconditions:
          - "licensee.status == PROSPECT"
          - "payload.vendor_compliance_certified == true"
        side_effects:
          - "sets vendor_compliance_certified = true"
          - "increments Licensee.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licensing/licensees/{licenseeId}/status  {action: SUSPEND, reason}"
        actor: MarkComplianceOfficer
        preconditions:
          - "licensee.status == ACTIVE"
          - "payload.reason is a non-empty string"
        side_effects:
          - "sets suspension_reason = payload.reason"
          - "CASCADE DOWN: every LicenseAgreement with licensee_id == this.id and contract_status == ACTIVE moves to SUSPENDED with suspension_reason = 'LICENSEE_SUSPENDED'"
          - "for each agreement suspended by the previous effect, every ProductSubmission of that agreement with status IN {SUBMITTED, IN_REVIEW, SAMPLE_REQUESTED} gets review_hold = true"
          - "increments Licensee.version by 1 and the version of every mutated LicenseAgreement / ProductSubmission by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensing/licensees/{licenseeId}/status  {action: REINSTATE}"
        actor: LeagueLicensingManager
        preconditions:
          - "licensee.status == SUSPENDED"
        side_effects:
          - "clears suspension_reason to null"
          - "CASCADE DOWN: every LicenseAgreement with licensee_id == this.id, contract_status == SUSPENDED and suspension_reason == 'LICENSEE_SUSPENDED' returns to ACTIVE with suspension_reason = null"
          - "for each agreement reinstated by the previous effect whose compliance_posture NOT IN {PROBATION, FROZEN}, every ProductSubmission of that agreement with review_hold == true gets review_hold = false"
          - "increments Licensee.version by 1 and the version of every mutated child by 1"
        note: "Cycle ACTIVE→SUSPENDED→ACTIVE; agreements suspended for their own reason are NOT reinstated."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licensing/licensees/{licenseeId}/status  {action: TERMINATE, reason}"
        actor: LeagueLicensingManager
        preconditions:
          - "licensee.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "CASCADE DOWN: every LicenseAgreement with licensee_id == this.id and contract_status NOT IN {EXPIRED, TERMINATED} moves to TERMINATED with termination_reason = 'LICENSEE_TERMINATED'"
          - "for each agreement terminated by the previous effect, every ProductSubmission with status == APPROVED moves to REVOKED with revocation_reason = 'LICENSEE_TERMINATED'"
          - "every RetailerAuthorization with licensee_id == this.id and status IN {PENDING, AUTHORIZED, SUSPENDED} moves to REVOKED"
          - "increments Licensee.version by 1 and the version of every mutated child by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /licensing/licensees/{licenseeId}/status  {action: TERMINATE, reason}"
        actor: LeagueLicensingManager
        preconditions:
          - "licensee.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "identical cascade to the ACTIVE->TERMINATED transition"

  # ---------------------------------------------------------------- SM2
  - entity: LicenseAgreement
    dimension: contract_status
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /licensing/agreements/{agreementId}/contract-status  {action: SUBMIT_FOR_SIGNATURE}"
        actor: LeagueLicensingManager
        preconditions:
          - "agreement.contract_status == DRAFT"
          - "agreement.minimum_guarantee_cents >= category.minimum_guarantee_floor_cents"
          - "agreement.advance_paid_cents >= agreement.required_advance_cents"
          - "at least one TerritoryGrant with agreement_id == this.id and status == GRANTED exists"
        side_effects:
          - "increments LicenseAgreement.version by 1"
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /licensing/agreements/{agreementId}/contract-status  {action: ACTIVATE, countersigned_by}"
        actor: LeagueLicensingManager
        preconditions:
          - "agreement.contract_status == PENDING_SIGNATURE"
          - "licensee.status == ACTIVE  (cross-entity guard)"
          - "payload.countersigned_by is a non-empty string"
        side_effects:
          - "sets countersigned_by = payload.countersigned_by"
          - "recomputes licensee.agreement_count"
          - "increments LicenseAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licensing/agreements/{agreementId}/contract-status  {action: SUSPEND, reason}"
        actor: MarkComplianceOfficer
        preconditions:
          - "agreement.contract_status == ACTIVE"
        side_effects:
          - "sets suspension_reason = payload.reason"
          - "every ProductSubmission of this agreement with status IN {SUBMITTED, IN_REVIEW, SAMPLE_REQUESTED} gets review_hold = true"
          - "recomputes distribution_ready"
          - "increments LicenseAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensing/agreements/{agreementId}/contract-status  {action: REINSTATE}"
        actor: LeagueLicensingManager
        preconditions:
          - "agreement.contract_status == SUSPENDED"
          - "licensee.status == ACTIVE  (cross-entity guard)"
        side_effects:
          - "clears suspension_reason to null"
          - "every ProductSubmission of this agreement gets review_hold = (agreement.compliance_posture IN {PROBATION, FROZEN})"
          - "recomputes distribution_ready"
          - "increments LicenseAgreement.version by 1"
        note: "Cycle ACTIVE⇄SUSPENDED on the contract dimension only; compliance_posture is untouched."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, during POST /licensing/ops/quarter-close when term_end_date < QUARTER_END_DATE(as_of_quarter)"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "agreement.term_end_date < QUARTER_END_DATE(payload.as_of_quarter)"
        side_effects:
          - "sets mg_final_shortfall_cents from calculations.mg_shortfall_assessment variant FINAL_AT_EXPIRY"
          - "sets mg_accrued_shortfall_cents = mg_final_shortfall_cents"
          - "every ProductSubmission of this agreement with status IN {DRAFT, SUBMITTED, IN_REVIEW, REVISION_REQUESTED, SAMPLE_REQUESTED, SAMPLE_PASSED} moves to REJECTED with rejection_reason = 'AGREEMENT_EXPIRED'"
          - "recomputes distribution_ready"
          - "increments LicenseAgreement.version by 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system, during POST /licensing/ops/quarter-close when term_end_date < QUARTER_END_DATE(as_of_quarter)"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "agreement.term_end_date < QUARTER_END_DATE(payload.as_of_quarter)"
        side_effects:
          - "identical to the ACTIVE->EXPIRED effects"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /licensing/agreements/{agreementId}/contract-status  {action: TERMINATE, reason}"
        actor: LeagueLicensingManager
        preconditions:
          - "agreement.contract_status IN {DRAFT, PENDING_SIGNATURE, ACTIVE, SUSPENDED}"
        side_effects:
          - "sets termination_reason = payload.reason"
          - "every TerritoryGrant of this agreement with status == GRANTED moves to REVOKED"
          - "sets mg_final_shortfall_cents from variant FINAL_AT_EXPIRY"
          - "increments LicenseAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licensing/agreements/{agreementId}/contract-status  {action: TERMINATE, reason}"
        actor: LeagueLicensingManager
        preconditions:
          - "agreement.contract_status IN {DRAFT, PENDING_SIGNATURE, ACTIVE, SUSPENDED}"
        side_effects:
          - "sets termination_reason = payload.reason"
          - "every TerritoryGrant of this agreement with status == GRANTED moves to REVOKED"
          - "every ProductSubmission of this agreement with status == APPROVED moves to REVOKED with revocation_reason = 'COMPLIANCE_ORDER'"
          - "sets mg_final_shortfall_cents from variant FINAL_AT_EXPIRY"
          - "recomputes distribution_ready"
          - "increments LicenseAgreement.version by 1"

  # ---------------------------------------------------------------- SM3
  - entity: LicenseAgreement
    dimension: compliance_posture
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: WATCH
        trigger: "system, posture recompute during POST /licensing/ops/quarter-close or during the AuditEngagement FINDINGS_ISSUED->SETTLED cascade"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "POSTURE_BAND(licensee.compliance_risk_index) == WATCH"
        side_effects:
          - "sets posture_as_of_quarter = the recompute quarter"
          - "increments LicenseAgreement.version by 1"
      - from: WATCH
        to: PROBATION
        trigger: "system, posture recompute during POST /licensing/ops/quarter-close or during the AuditEngagement FINDINGS_ISSUED->SETTLED cascade"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "POSTURE_BAND(licensee.compliance_risk_index) == PROBATION"
        side_effects:
          - "every ProductSubmission of this agreement with status IN {SUBMITTED, IN_REVIEW, SAMPLE_REQUESTED} gets review_hold = true"
          - "sets posture_as_of_quarter = the recompute quarter"
          - "increments LicenseAgreement.version by 1"
        note: "PROBATION also halves advance recoupment (RECOUP_CAP_BPS 5000) for reports accepted while in this posture."
      - from: PROBATION
        to: FROZEN
        trigger: "system, posture recompute during POST /licensing/ops/quarter-close or during the AuditEngagement FINDINGS_ISSUED->SETTLED cascade"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "POSTURE_BAND(licensee.compliance_risk_index) == FROZEN"
        side_effects:
          - "every ProductSubmission of this agreement with status IN {SUBMITTED, IN_REVIEW, SAMPLE_REQUESTED} gets review_hold = true"
          - "sets posture_as_of_quarter = the recompute quarter"
          - "increments LicenseAgreement.version by 1"
        note: "FROZEN additionally blocks submission creation, territory grants, retailer-authorization approval and report acceptance (§1.4)."
      - from: CLEAR
        to: PROBATION
        trigger: "system, posture recompute (band may jump more than one step in a single recompute)"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "POSTURE_BAND(licensee.compliance_risk_index) == PROBATION"
        side_effects:
          - "identical to the WATCH->PROBATION effects"
      - from: CLEAR
        to: FROZEN
        trigger: "system, posture recompute (band may jump more than one step in a single recompute)"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "POSTURE_BAND(licensee.compliance_risk_index) == FROZEN"
        side_effects:
          - "identical to the PROBATION->FROZEN effects"
      - from: FROZEN
        to: PROBATION
        trigger: "system, posture recompute during POST /licensing/ops/quarter-close (risk decayed below the FROZEN band)"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "POSTURE_BAND(licensee.compliance_risk_index) == PROBATION"
        side_effects:
          - "sets posture_as_of_quarter = the recompute quarter"
          - "increments LicenseAgreement.version by 1"
      - from: PROBATION
        to: WATCH
        trigger: "system, posture recompute during POST /licensing/ops/quarter-close (risk decayed below the PROBATION band)"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "POSTURE_BAND(licensee.compliance_risk_index) == WATCH"
        side_effects:
          - "every ProductSubmission of this agreement with review_hold == true gets review_hold = false"
          - "sets posture_as_of_quarter = the recompute quarter"
          - "increments LicenseAgreement.version by 1"
      - from: WATCH
        to: CLEAR
        trigger: "system, posture recompute during POST /licensing/ops/quarter-close (risk decayed below the WATCH band)"
        actor: system
        preconditions:
          - "agreement.contract_status IN {ACTIVE, SUSPENDED}"
          - "POSTURE_BAND(licensee.compliance_risk_index) == CLEAR"
        side_effects:
          - "sets posture_as_of_quarter = the recompute quarter"
          - "increments LicenseAgreement.version by 1"
        note: "Recovery path is a genuine cycle: CLEAR→WATCH→PROBATION→FROZEN→PROBATION→WATCH→CLEAR."

  # ---------------------------------------------------------------- SM4
  - entity: ProductSubmission
    dimension: status
    initial_state: DRAFT
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licensing/product-submissions/{submissionId}/submit"
        actor: Licensee
        preconditions:
          - "submission.status IN {DRAFT, REVISION_REQUESTED}"
          - "agreement.contract_status == ACTIVE"
          - "agreement.compliance_posture != FROZEN"
          - "every MarkRight in mark_ids has status == ACTIVE"
        side_effects:
          - "increments ProductSubmission.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /licensing/product-submissions/{submissionId}/submit"
        actor: Licensee
        preconditions:
          - "submission.status IN {DRAFT, REVISION_REQUESTED}"
          - "submission.review_hold == false"
          - "agreement.contract_status == ACTIVE"
        side_effects:
          - "clears defect_codes to []"
          - "increments ProductSubmission.version by 1"
        note: "Revision cycle: SUBMITTED→IN_REVIEW→REVISION_REQUESTED→SUBMITTED, unbounded rounds."
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /licensing/product-submissions/{submissionId}/review-decisions  {decision: BEGIN_REVIEW}"
        actor: LeagueLicensingManager
        preconditions:
          - "submission.status == SUBMITTED"
          - "submission.review_hold == false"
        side_effects:
          - "increments ProductSubmission.version by 1"
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /licensing/product-submissions/{submissionId}/review-decisions  {decision: REQUEST_REVISION, defect_codes}"
        actor: LeagueLicensingManager
        preconditions:
          - "submission.status IN {IN_REVIEW, SAMPLE_REQUESTED}"
          - "submission.review_hold == false"
          - "payload.defect_codes has >= 1 entry"
        side_effects:
          - "increments revision_round by 1"
          - "sets defect_codes = payload.defect_codes"
          - "increments ProductSubmission.version by 1"
      - from: IN_REVIEW
        to: SAMPLE_REQUESTED
        trigger: "POST /licensing/product-submissions/{submissionId}/review-decisions  {decision: REQUEST_SAMPLE}"
        actor: LeagueLicensingManager
        preconditions:
          - "submission.status == IN_REVIEW"
          - "submission.sample_required == true"
          - "submission.review_hold == false"
        side_effects:
          - "increments ProductSubmission.version by 1"
      - from: SAMPLE_REQUESTED
        to: SAMPLE_PASSED
        trigger: "POST /licensing/product-submissions/{submissionId}/sample-reviews  {verdict: PASS | CONDITIONAL_PASS}"
        actor: MarkComplianceOfficer
        preconditions:
          - "submission.status == SAMPLE_REQUESTED"
          - "submission.review_hold == false"
        side_effects:
          - "creates SampleReview with sample_round = submission.revision_round + 1 and occurrence_quarter = QUARTER_OF(clock)"
          - "clears defect_codes to [] when verdict == PASS; sets defect_codes = payload.defect_codes when verdict == CONDITIONAL_PASS"
          - "increments ProductSubmission.version by 1"
        note: "Branch A of the sample fork: divergent side-effect set from the FAIL branch."
      - from: SAMPLE_REQUESTED
        to: REVISION_REQUESTED
        trigger: "POST /licensing/product-submissions/{submissionId}/sample-reviews  {verdict: FAIL}"
        actor: MarkComplianceOfficer
        preconditions:
          - "submission.status == SAMPLE_REQUESTED"
          - "submission.review_hold == false"
        side_effects:
          - "creates SampleReview with verdict FAIL, sample_round = submission.revision_round + 1 and occurrence_quarter = QUARTER_OF(clock)"
          - "increments revision_round by 1"
          - "sets defect_codes = payload.defect_codes"
          - "recomputes licensee.compliance_risk_index (ROLLING_MONITOR, as_of_quarter = QUARTER_OF(clock)) because a SAMPLE_FAIL factor was added"
          - "increments ProductSubmission.version by 1"
        note: "Branch B of the sample fork: adds a risk factor and a revision round; Branch A adds neither."
      - from: SAMPLE_PASSED
        to: APPROVED
        trigger: "POST /licensing/product-submissions/{submissionId}/review-decisions  {decision: APPROVE}"
        actor: LeagueLicensingManager
        preconditions:
          - "submission.status == SAMPLE_PASSED  (or IN_REVIEW when sample_required == false)"
          - "submission.review_hold == false"
          - "agreement.contract_status == ACTIVE and agreement.compliance_posture != FROZEN"
          - "every MarkRight in mark_ids has status == ACTIVE and is permitted by category.mark_usage_class and passes the player-rights checks (§1.4 priorities 22-24)"
        side_effects:
          - "pins approved_mark_snapshot = [{mark_id, mark_version, usage_class}] for every mark in mark_ids"
          - "sets approved_by_user_id = X-User-ID, approved_at = clock, mark_snapshot_stale = false"
          - "increments agreement.approved_sku_count by 1 and recomputes agreement.authorized_channel_count and agreement.distribution_ready"
          - "increments ProductSubmission.version by 1 and LicenseAgreement.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /licensing/product-submissions/{submissionId}/review-decisions  {decision: APPROVE}"
        actor: LeagueLicensingManager
        preconditions:
          - "submission.status == IN_REVIEW and submission.sample_required == false"
          - "submission.review_hold == false"
          - "same mark-rights checks as the SAMPLE_PASSED->APPROVED transition"
        side_effects:
          - "identical to the SAMPLE_PASSED->APPROVED effects"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /licensing/product-submissions/{submissionId}/review-decisions  {decision: REJECT, note}"
        actor: LeagueLicensingManager
        preconditions:
          - "submission.status IN {IN_REVIEW, SAMPLE_REQUESTED, SAMPLE_PASSED}"
          - "submission.review_hold == false"
        side_effects:
          - "sets rejection_reason = payload.note"
          - "recomputes licensee.compliance_risk_index (ROLLING_MONITOR) because a SUBMISSION_REJECTED factor was added"
          - "increments ProductSubmission.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "system, cascade from MarkRight ACTIVE->WITHDRAWN, Licensee ACTIVE->TERMINATED or LicenseAgreement ->TERMINATED"
        actor: system
        preconditions:
          - "submission.status == APPROVED"
          - "the triggering cascade names this submission (a snapshot mark was withdrawn, or its licensee/agreement terminated)"
        side_effects:
          - "sets revocation_reason to MARK_WITHDRAWN / LICENSEE_TERMINATED / COMPLIANCE_ORDER per the cascade source"
          - "decrements agreement.approved_sku_count by 1 and recomputes agreement.authorized_channel_count and agreement.distribution_ready"
          - "any RetailerAuthorization with licensee_id == agreement.licensee_id, status == AUTHORIZED and sku_classes ⊆ SKU_CLASSES_WITHOUT_APPROVED_SUBMISSION(licensee) moves to SUSPENDED with suspension_reason = 'NO_APPROVED_SKUS'"
          - "increments ProductSubmission.version by 1, LicenseAgreement.version by 1 and the version of every suspended RetailerAuthorization by 1"

  # ---------------------------------------------------------------- SM5
  - entity: RoyaltyReport
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /licensing/royalty-reports/{reportId}/file"
        actor: Licensee
        preconditions:
          - "report.status IN {DRAFT, RETURNED}"
          - "agreement.contract_status IN {ACTIVE, SUSPENDED, EXPIRED}"
          - "every channel_line references a RetailerAuthorization that is AUTHORIZED (or SUSPENDED after the period) and whose window covers QUARTER_END_DATE(period_quarter) (§1.4 priority 26)"
        side_effects:
          - "runs calculations.royalty_due_computation variant PROVISIONAL_QUARTERLY -> net_regular_total_cents, closeout_eligible_total_cents, applied_tier_rate_bps, royalty_due_cents"
          - "runs calculations.advance_recoupment_and_payable -> recoupment_applied_cents (projection only, ledger untouched), cash_due_pre_fee_cents, late_days, late_filing_interest_cents, admin_fee_cents, total_payable_cents"
          - "sets filed_at = clock"
          - "increments RoyaltyReport.version by 1"
      - from: RETURNED
        to: FILED
        trigger: "POST /licensing/royalty-reports/{reportId}/file"
        actor: Licensee
        preconditions:
          - "report.status IN {DRAFT, RETURNED}"
          - "same channel-line authorization checks as DRAFT->FILED"
        side_effects:
          - "identical recomputation to DRAFT->FILED using the current channel_lines"
          - "clears return_reason to null (return_count is NOT reset)"
          - "increments RoyaltyReport.version by 1"
        note: "Cycle FILED→RETURNED→FILED; each RETURN leaves a permanent return_count increment."
      - from: FILED
        to: RETURNED
        trigger: "POST /licensing/royalty-reports/{reportId}/review-decisions  {decision: RETURN, reason}"
        actor: FinanceController
        preconditions:
          - "report.status == FILED"
          - "payload.reason is a non-empty string"
        side_effects:
          - "increments return_count by 1 and sets return_reason = payload.reason"
          - "recomputes licensee.compliance_risk_index (ROLLING_MONITOR) because a REPORT_RETURN factor was added"
          - "increments RoyaltyReport.version by 1"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /licensing/royalty-reports/{reportId}/review-decisions  {decision: ACCEPT}"
        actor: FinanceController
        preconditions:
          - "report.status == FILED"
          - "agreement.contract_status IN {ACTIVE, SUSPENDED, EXPIRED}  (cross-entity guard)"
          - "agreement.compliance_posture != FROZEN  (cross-entity guard)"
        side_effects:
          - "LEDGER SYNC: applies calculations.advance_recoupment_and_payable to the agreement — unrecouped_advance_cents -= recoupment_applied_cents, recouped_advance_cents += recoupment_applied_cents, cumulative_royalty_cents += royalty_due_cents"
          - "sets accepted_by_user_id = X-User-ID, accepted_at = clock"
          - "when agreement.central_licensing_flag == true and a DistributionRun with period_quarter == report.period_quarter and status == OPEN exists: sets report.distribution_run_id, run.projected_pool_cents += royalty_due_cents, run.report_count += 1 and increments DistributionRun.version by 1"
          - "increments RoyaltyReport.version by 1 and LicenseAgreement.version by 1"
      - from: ACCEPTED
        to: UNDER_AUDIT
        trigger: "POST /licensing/audit-engagements/{engagementId}/begin-fieldwork"
        actor: RoyaltyAuditor
        preconditions:
          - "report.status == ACCEPTED"
          - "report.period_quarter ∈ engagement.scope_quarters and report.agreement_id == engagement.agreement_id"
        side_effects:
          - "sets audit_engagement_id = engagement.id"
          - "increments RoyaltyReport.version by 1"
      - from: UNDER_AUDIT
        to: ADJUSTED
        trigger: "system, cascade from AuditEngagement FINDINGS_ISSUED->SETTLED when underreported_royalty_cents > 0"
        actor: system
        preconditions:
          - "report.status == UNDER_AUDIT"
          - "engagement.underreported_royalty_cents > 0 and this report's quarter appears in engagement.audited_quarters"
        side_effects:
          - "sets adjusted_royalty_due_cents = the recomputed royalty for this quarter from engagement.audited_quarters"
          - "LEDGER REVERSAL then RE-APPLY on the agreement (see calculations.advance_recoupment_and_payable, COMPENSATION section) — recoupment_applied_cents, cash_due_pre_fee_cents, admin_fee_cents and total_payable_cents are recomputed from the adjusted royalty using the compliance_posture in force at the START of the settle transition"
          - "increments RoyaltyReport.version by 1 and LicenseAgreement.version by 1"
      - from: UNDER_AUDIT
        to: CLOSED
        trigger: "POST /licensing/audit-engagements/{engagementId}/close"
        actor: RoyaltyAuditor
        preconditions:
          - "report.status IN {UNDER_AUDIT, ADJUSTED}"
          - "engagement.status IN {OPENED, FIELDWORK, SETTLED}"
        side_effects:
          - "increments RoyaltyReport.version by 1"
      - from: ADJUSTED
        to: CLOSED
        trigger: "POST /licensing/audit-engagements/{engagementId}/close"
        actor: RoyaltyAuditor
        preconditions:
          - "report.status IN {UNDER_AUDIT, ADJUSTED}"
        side_effects:
          - "increments RoyaltyReport.version by 1"

  # ---------------------------------------------------------------- SM6
  - entity: AuditEngagement
    dimension: status
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: FIELDWORK
        trigger: "POST /licensing/audit-engagements/{engagementId}/begin-fieldwork"
        actor: RoyaltyAuditor
        preconditions:
          - "engagement.status == OPENED"
          - "every quarter in scope_quarters has a report with status == ACCEPTED on the agreement"
        side_effects:
          - "every in-scope RoyaltyReport moves ACCEPTED->UNDER_AUDIT (SM5)"
          - "increments AuditEngagement.version by 1"
      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /licensing/audit-engagements/{engagementId}/issue-findings"
        actor: RoyaltyAuditor
        preconditions:
          - "engagement.status IN {FIELDWORK, DISPUTED}"
          - "payload.audited_quarters covers exactly the engagement's scope_quarters"
        side_effects:
          - "runs calculations.underreporting_recovery_assessment -> audited_quarters, recomputed_royalty_cents, reported_royalty_cents, underreported_royalty_cents, underreport_rate_bps, cost_shift_applied, audit_cost_recovery_cents, interest_cents, recovery_assessed_cents"
          - "sets findings_issued_by_user_id = X-User-ID, findings_quarter = QUARTER_OF(clock), findings_round += 1"
          - "recomputes licensee.outstanding_recovery_cents"
          - "increments AuditEngagement.version by 1"
      - from: FINDINGS_ISSUED
        to: DISPUTED
        trigger: "POST /licensing/audit-engagements/{engagementId}/dispute"
        actor: Licensee
        preconditions:
          - "engagement.status == FINDINGS_ISSUED"
          - "acting Licensee owns engagement.agreement_id"
        side_effects:
          - "sets dispute_note = payload.dispute_note"
          - "increments AuditEngagement.version by 1"
      - from: DISPUTED
        to: FINDINGS_ISSUED
        trigger: "POST /licensing/audit-engagements/{engagementId}/issue-findings  (re-issue with revised restatement)"
        actor: RoyaltyAuditor
        preconditions:
          - "engagement.status IN {FIELDWORK, DISPUTED}"
        side_effects:
          - "recomputes the whole findings block from the new audited_quarters, overwriting the previous values"
          - "sets findings_issued_by_user_id = X-User-ID, findings_quarter = QUARTER_OF(clock), findings_round += 1"
          - "increments AuditEngagement.version by 1"
        note: "Negotiation cycle FINDINGS_ISSUED⇄DISPUTED, unbounded rounds."
      - from: FINDINGS_ISSUED
        to: SETTLED
        trigger: "POST /licensing/audit-engagements/{engagementId}/settle"
        actor: FinanceController
        preconditions:
          - "engagement.status == FINDINGS_ISSUED"
          - "X-User-ID != engagement.findings_issued_by_user_id  (segregation of duties)"
          - "settlement_basis == NEGOTIATED requires negotiated_cents present and 0 <= negotiated_cents <= recovery_assessed_cents; settlement_basis == FINDINGS requires negotiated_cents absent"
        side_effects:
          - "sets settlement_basis, settled_amount_cents, settled_by_user_id"
          - "CASCADE HOP 1: when underreported_royalty_cents > 0, every in-scope RoyaltyReport moves UNDER_AUDIT->ADJUSTED (SM5)"
          - "CASCADE HOP 2: because those reports became ADJUSTED, the agreement's ledger is reversed and re-applied (advance identity preserved) and cumulative_royalty_cents / mg_accrued_shortfall_cents are recomputed"
          - "CASCADE HOP 3: because the agreement ledger changed and the engagement now carries an AUDIT_UNDERREPORT factor, licensee.compliance_risk_index is recomputed (ROLLING_MONITOR, as_of_quarter = QUARTER_OF(clock)) and licensee.outstanding_recovery_cents refreshed"
          - "CASCADE HOP 4: because the risk index moved band, every LicenseAgreement of that licensee with contract_status IN {ACTIVE, SUSPENDED} takes the SM3 posture transition for the new band"
          - "CASCADE HOP 5: because any agreement entering PROBATION/FROZEN holds reviews, every ProductSubmission of those agreements with status IN {SUBMITTED, IN_REVIEW, SAMPLE_REQUESTED} gets review_hold = true"
          - "increments AuditEngagement.version by 1 plus the version of every entity mutated by hops 1-5"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /licensing/audit-engagements/{engagementId}/close"
        actor: RoyaltyAuditor
        preconditions:
          - "engagement.status IN {OPENED, FIELDWORK, SETTLED}"
        side_effects:
          - "every in-scope RoyaltyReport with status IN {UNDER_AUDIT, ADJUSTED} moves to CLOSED (SM5)"
          - "increments AuditEngagement.version by 1"
      - from: OPENED
        to: CLOSED
        trigger: "POST /licensing/audit-engagements/{engagementId}/close  (withdrawn before fieldwork)"
        actor: RoyaltyAuditor
        preconditions:
          - "engagement.status IN {OPENED, FIELDWORK, SETTLED}"
        side_effects:
          - "every in-scope RoyaltyReport with status == UNDER_AUDIT returns to CLOSED"
          - "increments AuditEngagement.version by 1"
      - from: FIELDWORK
        to: CLOSED
        trigger: "POST /licensing/audit-engagements/{engagementId}/close  (no findings)"
        actor: RoyaltyAuditor
        preconditions:
          - "engagement.status IN {OPENED, FIELDWORK, SETTLED}"
        side_effects:
          - "every in-scope RoyaltyReport with status == UNDER_AUDIT moves to CLOSED"
          - "increments AuditEngagement.version by 1"

  # ---------------------------------------------------------------- SM7
  - entity: RetailerAuthorization
    dimension: status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /licensing/retailer-authorizations/{authorizationId}/status  {action: APPROVE}"
        actor: LeagueLicensingManager
        preconditions:
          - "authorization.status == PENDING"
          - "licensee.status == ACTIVE"
          - "no LicenseAgreement of this licensee with contract_status IN {ACTIVE, SUSPENDED} has compliance_posture == FROZEN"
          - "window/buffer rule (§1.4 priority 30) and OFF_PRICE capacity rule (§1.4 priority 31) both pass"
        side_effects:
          - "sets approved_by_user_id = X-User-ID"
          - "recomputes authorized_channel_count and distribution_ready on every LicenseAgreement of this licensee"
          - "increments RetailerAuthorization.version by 1"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /licensing/retailer-authorizations/{authorizationId}/status  {action: SUSPEND, reason} OR system cascade from ProductSubmission APPROVED->REVOKED"
        actor: MarkComplianceOfficer
        preconditions:
          - "authorization.status == AUTHORIZED"
        side_effects:
          - "sets suspension_reason = payload.reason (manual) or 'NO_APPROVED_SKUS' (cascade)"
          - "recomputes authorized_channel_count and distribution_ready on every LicenseAgreement of this licensee"
          - "increments RetailerAuthorization.version by 1"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /licensing/retailer-authorizations/{authorizationId}/status  {action: REINSTATE}"
        actor: LeagueLicensingManager
        preconditions:
          - "authorization.status == SUSPENDED"
          - "at least one APPROVED ProductSubmission of this licensee has a sku_class ∈ authorization.sku_classes"
        side_effects:
          - "clears suspension_reason to null"
          - "recomputes authorized_channel_count and distribution_ready on every LicenseAgreement of this licensee"
          - "increments RetailerAuthorization.version by 1"
      - from: AUTHORIZED
        to: REVOKED
        trigger: "POST /licensing/retailer-authorizations/{authorizationId}/status  {action: REVOKE, reason} OR system cascade from Licensee ->TERMINATED"
        actor: MarkComplianceOfficer
        preconditions:
          - "authorization.status IN {PENDING, AUTHORIZED, SUSPENDED}"
        side_effects:
          - "recomputes authorized_channel_count and distribution_ready on every LicenseAgreement of this licensee"
          - "increments RetailerAuthorization.version by 1"
      - from: PENDING
        to: REVOKED
        trigger: "POST /licensing/retailer-authorizations/{authorizationId}/status  {action: REVOKE, reason}"
        actor: MarkComplianceOfficer
        preconditions:
          - "authorization.status IN {PENDING, AUTHORIZED, SUSPENDED}"
        side_effects:
          - "increments RetailerAuthorization.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /licensing/retailer-authorizations/{authorizationId}/status  {action: REVOKE, reason}"
        actor: MarkComplianceOfficer
        preconditions:
          - "authorization.status IN {PENDING, AUTHORIZED, SUSPENDED}"
        side_effects:
          - "increments RetailerAuthorization.version by 1"

  # ---------------------------------------------------------------- SM8
  - entity: EnforcementAction
    dimension: status
    initial_state: REPORTED
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /licensing/enforcement-actions/{actionId}/status  {action: INVESTIGATE}"
        actor: MarkComplianceOfficer
        preconditions:
          - "action.status == REPORTED"
        side_effects:
          - "increments EnforcementAction.version by 1"
      - from: INVESTIGATING
        to: SEIZURE_ORDERED
        trigger: "POST /licensing/enforcement-actions/{actionId}/status  {action: ORDER_SEIZURE, seized_units, seizure_authority}"
        actor: MarkComplianceOfficer
        preconditions:
          - "action.status == INVESTIGATING"
          - "payload.seized_units >= 1 and payload.seized_units <= action.estimated_units"
        side_effects:
          - "sets seized_units, seizure_authority, occurrence_quarter = QUARTER_OF(clock)"
          - "when suspected_licensee_id is non-null: recomputes that licensee's compliance_risk_index (ROLLING_MONITOR, as_of_quarter = QUARTER_OF(clock)) because an ENFORCEMENT_SEIZURE factor was added"
          - "increments EnforcementAction.version by 1 (and Licensee.version by 1 when a licensee was named)"
      - from: SEIZURE_ORDERED
        to: RESOLVED
        trigger: "POST /licensing/enforcement-actions/{actionId}/status  {action: RESOLVE, disposition, recovered_cents}"
        actor: MarkComplianceOfficer
        preconditions:
          - "action.status == SEIZURE_ORDERED"
        side_effects:
          - "sets disposition and recovered_cents"
          - "increments EnforcementAction.version by 1"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /licensing/enforcement-actions/{actionId}/status  {action: DISMISS, reason}"
        actor: MarkComplianceOfficer
        preconditions:
          - "action.status IN {REPORTED, INVESTIGATING}"
        side_effects:
          - "sets dismissal_reason"
          - "increments EnforcementAction.version by 1"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /licensing/enforcement-actions/{actionId}/status  {action: DISMISS, reason}"
        actor: MarkComplianceOfficer
        preconditions:
          - "action.status IN {REPORTED, INVESTIGATING}"
        side_effects:
          - "sets dismissal_reason"
          - "when suspected_licensee_id is non-null: recomputes that licensee's compliance_risk_index (a DISMISSED action contributes 0 in both variants)"
          - "increments EnforcementAction.version by 1"

  # ---------------------------------------------------------------- SM9
  - entity: DistributionRun
    dimension: status
    initial_state: OPEN
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /licensing/distribution-runs/{runId}/lock"
        actor: FinanceController
        preconditions:
          - "run.status == OPEN"
          - "payload.expected_run_version == run.version  (OCC, §1.2.1)"
        side_effects:
          - "sets locked_at = clock"
          - "increments DistributionRun.version by 1"
      - from: LOCKED
        to: OPEN
        trigger: "POST /licensing/distribution-runs/{runId}/unlock"
        actor: FinanceController
        preconditions:
          - "run.status == LOCKED"
        side_effects:
          - "clears locked_at to null"
          - "increments DistributionRun.version by 1"
        note: "Cycle OPEN⇄LOCKED so late acceptances can be pooled before distribution."
      - from: LOCKED
        to: DISTRIBUTED
        trigger: "POST /licensing/distribution-runs/{runId}/distribute"
        actor: FinanceController
        preconditions:
          - "run.status == LOCKED"
          - "payload.expected_run_version == run.version  (OCC, §1.2.1)"
          - "no RoyaltyReport with status IN {FILED, RETURNED} exists for run.period_quarter on an agreement with central_licensing_flag == true"
          - "the eligible report set is non-empty (§1.4 priority 34)"
        side_effects:
          - "runs calculations.central_pool_distribution -> pool_gross_cents, league_admin_cents, player_pool_cents, club_pool_cents, report_count"
          - "creates one ClubDistribution per Club with status == ACTIVE (ordered club_code ASC) whose amount_cents sum exactly to club_pool_cents"
          - "recomputes lifetime_distributed_cents on every Club that received an allocation"
          - "sets distributed_at = clock"
          - "increments DistributionRun.version by 1 and the version of every mutated Club by 1"

  # ---------------------------------------------------------------- SM10
  - entity: MarkRight
    dimension: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /licensing/mark-rights/{markId}/status  {action: RESTRICT, reason}"
        actor: MarkComplianceOfficer
        preconditions:
          - "mark.status == ACTIVE"
        side_effects:
          - "sets status_reason = payload.reason"
          - "every APPROVED ProductSubmission whose approved_mark_snapshot contains this mark_id gets mark_snapshot_stale = true (the pinned mark_version no longer matches)"
          - "increments MarkRight.version by 1 and the version of every flagged ProductSubmission by 1"
        note: "RESTRICT does NOT revoke approvals — it only invalidates the pinned snapshot."
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /licensing/mark-rights/{markId}/status  {action: REINSTATE}"
        actor: MarkComplianceOfficer
        preconditions:
          - "mark.status IN {RESTRICTED, WITHDRAWN}"
        side_effects:
          - "clears status_reason to null"
          - "increments MarkRight.version by 1"
        note: "Cycle ACTIVE⇄RESTRICTED and ACTIVE→WITHDRAWN→ACTIVE; REVOKED submissions are NOT resurrected."
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /licensing/mark-rights/{markId}/status  {action: WITHDRAW, reason} OR system cascade from POST /licensing/players/{playerId}/group-licensing {opt_in: false}"
        actor: MarkComplianceOfficer
        preconditions:
          - "mark.status IN {ACTIVE, RESTRICTED}"
          - "manual withdraw by ClubRepresentative additionally requires mark.owner_type == CLUB and mark.club_id == X-User-ID"
        side_effects:
          - "sets withdrawn_at = clock and status_reason"
          - "CASCADE HOP: every APPROVED ProductSubmission whose approved_mark_snapshot contains this mark_id moves to REVOKED with revocation_reason = 'MARK_WITHDRAWN' (SM4), which in turn decrements approved_sku_count and can suspend RetailerAuthorizations"
          - "increments MarkRight.version by 1 plus the version of every entity mutated by the cascade"
      - from: RESTRICTED
        to: WITHDRAWN
        trigger: "POST /licensing/mark-rights/{markId}/status  {action: WITHDRAW, reason}"
        actor: MarkComplianceOfficer
        preconditions:
          - "mark.status IN {ACTIVE, RESTRICTED}"
        side_effects:
          - "identical to the ACTIVE->WITHDRAWN effects"
      - from: WITHDRAWN
        to: ACTIVE
        trigger: "POST /licensing/mark-rights/{markId}/status  {action: REINSTATE} OR system cascade from POST /licensing/players/{playerId}/group-licensing {opt_in: true}"
        actor: MarkComplianceOfficer
        preconditions:
          - "mark.status IN {RESTRICTED, WITHDRAWN}"
        side_effects:
          - "clears status_reason and withdrawn_at to null"
          - "already-REVOKED ProductSubmissions stay REVOKED (no resurrection); approved_sku_count is NOT restored"
          - "increments MarkRight.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: report-create-stale-agreement
    parent_entity: LicenseAgreement
    write_endpoint: "POST /licensing/royalty-reports"
    occ_field: "expected_agreement_version"
    description: |
      Creating a RoyaltyReport against a LicenseAgreement whose version has
      advanced since the client last read it is rejected. A second DRAFT report
      for the same period legitimately supersedes an earlier DRAFT (the earlier
      DRAFT is discarded by the licensee), so the create itself is a valid
      operation from identical observable state — only the stale version reveals
      that the agreement's ledger, posture or grant set moved underneath the
      writer.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: authorization-create-stale-licensee
    parent_entity: Licensee
    write_endpoint: "POST /licensing/licensees/{licenseeId}/retailer-authorizations"
    occ_field: "expected_licensee_version"
    description: |
      Creating a RetailerAuthorization against a Licensee whose version has
      advanced since the client last read it is rejected. A new authorization for
      the same retailer and channel legitimately supersedes a prior PENDING one,
      so the create is valid from identical observable state; the stale version
      reveals that another authorization, suspension or risk recompute has
      already changed the licensee's authorization landscape.
    error_id: ERR_STALE_LICENSEE_VERSION
    http_status: 412

  - rule_id: distribution-lock-stale-run
    parent_entity: DistributionRun
    write_endpoint: "POST /licensing/distribution-runs/{runId}/lock"
    occ_field: "expected_run_version"
    description: |
      Locking a DistributionRun whose version has advanced since the client last
      read it is rejected. Locking an OPEN run is always a legitimate operation,
      so no state precondition catches this; the stale version reveals that a
      report acceptance has pooled additional royalty into the run (bumping
      projected_pool_cents and the run version) after the operator computed the
      figure they intended to freeze.
    error_id: ERR_STALE_DISTRIBUTION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Global money/rate conventions:
#   * every monetary field is an integer number of cents
#   * every rate is integer bps; a rate application is `amount * rate_bps / 10000`
#   * `round_half_up(x)` rounds a rational to the nearest integer cent, .5 away
#     from zero; `floor(x)` truncates toward zero (all bases are non-negative)
# =============================================================================

calculations:
  - name: royalty_due_computation
    trigger: "RoyaltyReport DRAFT->FILED and RETURNED->FILED (variant PROVISIONAL_QUARTERLY); POST /licensing/agreements/{agreementId}/annual-true-up (variant FINAL_ANNUAL_TRUE_UP); AuditEngagement issue-findings reuses the PROVISIONAL per-line body on restated inputs"
    algorithm: tiered_pricing
    formula: |
      # ---- per channel line (line-level intermediate values) ----
      for each line L in report.channel_lines:
        closeout_eligible(L) = min(L.closeout_sales_cents,
                                   floor(L.gross_sales_cents * category.closeout_cap_pct_bps / 10000))
        closeout_excess(L)   = L.closeout_sales_cents - closeout_eligible(L)
        allowed_deduction(L) = min(L.deductions_cents,
                                   floor(L.gross_sales_cents * category.deduction_cap_pct_bps / 10000))
        # gross_sales_cents already INCLUDES closeout_sales_cents; the excess above
        # the closeout cap is re-rated at the regular tier rate, not the closeout rate
        net_regular(L)       = L.gross_sales_cents - closeout_eligible(L) - allowed_deduction(L)

      report.net_regular_total_cents       = sum over lines of net_regular(L)
      report.closeout_eligible_total_cents = sum over lines of closeout_eligible(L)

      # ---- tier selection (PROVISIONAL_QUARTERLY) ----
      # ONE rate for the whole report, looked up from THIS report's basis.
      basis = report.net_regular_total_cents
      tier  = the unique category.tier_schedule entry with
              tier.from_cents <= basis AND (tier.to_cents is null OR basis < tier.to_cents)
      report.applied_tier_rate_bps = tier.rate_bps

      # ---- ROUNDING ORDER IS PINNED: round PER LINE, then sum ----
      # (sum-then-round is explicitly WRONG and can differ by 1 cent per line)
      for each line L, iterated in ascending channel_class order
          (DEPARTMENT < SPECIALTY < MASS < ECOMMERCE < OFF_PRICE, then ALL):
        line_royalty(L) = round_half_up(net_regular(L) * report.applied_tier_rate_bps / 10000)
                        + round_half_up(closeout_eligible(L) * category.closeout_rate_bps / 10000)
      report.royalty_due_cents = sum over lines of line_royalty(L)
    input_set: |
      Variant PROVISIONAL_QUARTERLY: exactly the channel_lines of the report being
      filed; no other report participates. Variant FINAL_ANNUAL_TRUE_UP: every
      RoyaltyReport of the agreement whose period_quarter lies in the requested
      contract year (contract year N = the 4 consecutive quarters starting at
      agreement.contract_year_start_quarter + 4*(N-1)) AND whose status IN
      {ACCEPTED, ADJUSTED, CLOSED}; reports in DRAFT, FILED, RETURNED or
      UNDER_AUDIT are excluded.
    constants:
      CHANNEL_CLASS_ORDER: ["DEPARTMENT", "SPECIALTY", "MASS", "ECOMMERCE", "OFF_PRICE", "ALL"]
    precision: "integer cents; round_half_up applied per line (regular part and closeout part rounded separately), never on the report total"
    variants:
      - name: PROVISIONAL_QUARTERLY
        when: "every FILE transition, and every audit restatement"
        difference: "One tier rate for the whole report, selected by that single quarter's net_regular_total_cents. Written to report.royalty_due_cents."
      - name: FINAL_ANNUAL_TRUE_UP
        when: "POST /licensing/agreements/{agreementId}/annual-true-up (read-only projection; never written to a report)"
        difference: |
          Tiers are applied MARGINALLY to the contract year's cumulative basis
          instead of by single-rate lookup:
            cum_net = sum of net_regular_total_cents over the included reports
            marginal = sum over tiers of round_half_up(
                         clamp(cum_net - tier.from_cents, 0,
                               (tier.to_cents is null ? cum_net : tier.to_cents - tier.from_cents))
                         * tier.rate_bps / 10000)
            closeout_part = sum over included reports of that report's closeout royalty
                            component (sum over its lines of
                            round_half_up(closeout_eligible(L) * closeout_rate_bps / 10000))
            true_up_royalty_cents = marginal + closeout_part
            delta_cents = true_up_royalty_cents
                        - sum over included reports of effective royalty
                          (adjusted_royalty_due_cents when non-null else royalty_due_cents)
          Identical sales data therefore yields a different royalty than the sum of
          the provisional quarters whenever the cumulative basis crosses a tier
          boundary; delta_cents may be negative (licensee credit).

  - name: advance_recoupment_and_payable
    trigger: "RoyaltyReport DRAFT->FILED / RETURNED->FILED (projection), FILED->ACCEPTED (ledger application), UNDER_AUDIT->ADJUSTED (compensating reversal then re-application)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED — steps run exactly 1..6, no fixed-point loop.
      # 1. royalty_due_cents comes from calculations.royalty_due_computation
      #    (adjusted_royalty_due_cents on the ADJUSTED path).
      # 2. recoupment cap depends on the posture IN FORCE AT THE START of the
      #    triggering transition (a posture change cascaded by the same request
      #    does NOT retroactively change the cap):
      RECOUP_CAP_BPS = 5000 when agreement.compliance_posture IN {PROBATION, FROZEN}
                       else 10000
      recoupment_applied_cents = min(agreement.unrecouped_advance_cents,
                                     floor(royalty_due_cents * RECOUP_CAP_BPS / 10000))
      # 3. pre-fee cash
      cash_due_pre_fee_cents = royalty_due_cents - recoupment_applied_cents
      # 4. lateness (calendar dates in UTC, not instants)
      late_days = max(0, (UTC date of the FILE transition)
                        - FILING_DEADLINE_DATE(report.period_quarter)) in whole days
      late_filing_interest_cents = round_half_up(cash_due_pre_fee_cents
                                   * LATE_INTEREST_BPS_PER_DAY * late_days / 10000)
      # 5. small-payment handling fee — CIRCULAR-LOOKING, ORDER PINNED:
      #    the waiver test reads cash_due_pre_fee_cents (the PRE-FEE base), NEVER
      #    total_payable_cents. Evaluating the waiver on the post-fee total would
      #    be self-referential (fee -> total -> waiver -> fee) and is WRONG.
      admin_fee_cents = 0 when cash_due_pre_fee_cents >= ADMIN_FEE_WAIVER_FLOOR_CENTS
                        else round_half_up(cash_due_pre_fee_cents * ADMIN_FEE_BPS / 10000)
      # 6. total
      total_payable_cents = cash_due_pre_fee_cents + late_filing_interest_cents + admin_fee_cents

      # ---- LEDGER APPLICATION (only on FILED->ACCEPTED) ----
      agreement.unrecouped_advance_cents -= recoupment_applied_cents
      agreement.recouped_advance_cents   += recoupment_applied_cents
      agreement.cumulative_royalty_cents += royalty_due_cents

      # ---- COMPENSATION (only on UNDER_AUDIT->ADJUSTED) ----
      # reverse the accepted posting first, then re-apply with the adjusted royalty
      agreement.unrecouped_advance_cents += old_recoupment_applied_cents
      agreement.recouped_advance_cents   -= old_recoupment_applied_cents
      agreement.cumulative_royalty_cents -= old_royalty_due_cents
      ... then steps 2..6 and the ledger application re-run with
      royalty_due_cents = report.adjusted_royalty_due_cents
      # CONSERVED INVARIANT (must hold before AND after, with zero drift):
      #   agreement.advance_paid_cents
      #     == agreement.unrecouped_advance_cents + agreement.recouped_advance_cents
    input_set: "The single report being filed / accepted / adjusted, plus its agreement's advance ledger fields. Reports in RETURNED never touch the ledger."
    constants:
      LATE_INTEREST_BPS_PER_DAY: 5
      ADMIN_FEE_BPS: 150
      ADMIN_FEE_WAIVER_FLOOR_CENTS: 100000
    precision: "integer cents; round_half_up on the interest and fee terms independently, never on total_payable_cents"
    variants:
      - name: PROJECTION_AT_FILE
        when: "DRAFT->FILED and RETURNED->FILED"
        difference: "Computes and stores all six values on the report but leaves agreement.unrecouped_advance_cents / recouped_advance_cents / cumulative_royalty_cents untouched."
      - name: LEDGER_AT_ACCEPT
        when: "FILED->ACCEPTED"
        difference: "Same six values, plus the ledger application; the recoupment cap is re-read from the agreement's posture at accept time, which may differ from the value projected at file time."

  - name: compliance_risk_index
    trigger: "GET /licensing/licensees/{licenseeId}/risk-index (either variant on demand); ROLLING_MONITOR is also recomputed as a side effect of SampleReview FAIL, submission REJECT, report RETURN, EnforcementAction ORDER_SEIZURE / DISMISS, AuditEngagement settle, and for every ACTIVE licensee during POST /licensing/ops/quarter-close"
    algorithm: weighted_scoring
    formula: |
      # Factor records are DERIVED from existing rows — there is no strike table.
      # Every factor row carries an occurrence quarter; ordering never matters
      # because contributions are summed, but the window filter and the decay do.
      factors(licensee L, as_of_quarter Q) =
        SAMPLE_FAIL          weight 8 : each SampleReview with verdict == FAIL whose
                                        submission.agreement.licensee_id == L.id,
                                        dated at SampleReview.occurrence_quarter
        SUBMISSION_REJECTED  weight 5 : each ProductSubmission with status == REJECTED
                                        and rejection_reason != 'AGREEMENT_EXPIRED' whose
                                        agreement.licensee_id == L.id, dated at
                                        QUARTER_OF(ProductSubmission.updated_at)
        REPORT_RETURN        weight 6 : each RoyaltyReport of L's agreements counted
                                        return_count times, dated at report.period_quarter
        AUDIT_UNDERREPORT    weight 20: each AuditEngagement on L's agreements with
                                        status IN {FINDINGS_ISSUED, DISPUTED, SETTLED, CLOSED}
                                        and underreported_royalty_cents > 0, dated at
                                        engagement.findings_quarter
        ENFORCEMENT_SEIZURE  weight 15: each EnforcementAction with
                                        suspected_licensee_id == L.id and status IN
                                        {SEIZURE_ORDERED, RESOLVED}, dated at
                                        EnforcementAction.occurrence_quarter
      # window: keep only rows with 0 <= ELAPSED_QUARTERS(row_quarter, Q) <= 7
      #         (rows dated after Q, i.e. negative elapsed, are excluded)
      elapsed(row) = ELAPSED_QUARTERS(row_quarter, Q)
      contribution(row) = weight(row) * decay(elapsed(row))     # variant-specific
      # ROUNDING ORDER IS PINNED: sum the unrounded contributions, round ONCE:
      raw = sum over kept rows of contribution(row)
      index = min(100, round_half_up(raw))
      POSTURE_BAND(index) = FROZEN    when index >= 60
                            PROBATION when index >= 35
                            WATCH     when index >= 15
                            CLEAR     otherwise
    input_set: "Derived rows as listed; DISMISSED EnforcementActions and submissions rejected with reason AGREEMENT_EXPIRED are excluded from both variants; rows older than 8 quarters (elapsed > 7) are excluded from both variants."
    constants:
      WEIGHT_SAMPLE_FAIL: 8
      WEIGHT_SUBMISSION_REJECTED: 5
      WEIGHT_REPORT_RETURN: 6
      WEIGHT_AUDIT_UNDERREPORT: 20
      WEIGHT_ENFORCEMENT_SEIZURE: 15
      WINDOW_QUARTERS: 8
      INDEX_CEILING: 100
      BAND_FROZEN_MIN: 60
      BAND_PROBATION_MIN: 35
      BAND_WATCH_MIN: 15
    precision: "index is an integer 0..100; contributions are summed unrounded and round_half_up is applied exactly once to the total"
    variants:
      - name: ROLLING_MONITOR
        when: "stored on Licensee.compliance_risk_index; drives POSTURE_BAND for every SM3 posture transition"
        difference: "decay(elapsed) = 0.5 ** min(elapsed, 4) — a factor loses half its weight per elapsed quarter, floored at 1/16 from the 4th quarter on."
      - name: STRICT_ASSESSMENT
        when: "GET /licensing/licensees/{licenseeId}/risk-index?variant=STRICT_ASSESSMENT — the renewal/underwriting view; never stored"
        difference: "decay(elapsed) = 1.0 for every kept row — nothing decays inside the 8-quarter window, so the same data yields a strictly larger index whenever any factor is older than the as-of quarter."

  - name: mg_shortfall_assessment
    trigger: "POST /licensing/ops/quarter-close for every agreement with contract_status IN {ACTIVE, SUSPENDED} (variant INTERIM_PRO_RATA); LicenseAgreement ->EXPIRED and ->TERMINATED (variant FINAL_AT_EXPIRY)"
    algorithm: threshold
    formula: |
      total_quarters   = ELAPSED_QUARTERS(QUARTER_OF(term_start_date),
                                         QUARTER_OF(term_end_date)) + 1
      elapsed_quarters = clamp(ELAPSED_QUARTERS(QUARTER_OF(term_start_date), as_of_quarter) + 1,
                              0, total_quarters)
      earned = agreement.cumulative_royalty_cents      # ACCEPTED/ADJUSTED/CLOSED only
      # INTERIM_PRO_RATA
      pro_rata_mg_cents = round_half_up(minimum_guarantee_cents * elapsed_quarters / total_quarters)
      mg_accrued_shortfall_cents = max(0, pro_rata_mg_cents - earned)
      # FINAL_AT_EXPIRY
      mg_final_shortfall_cents = max(0, minimum_guarantee_cents - earned)
    input_set: "Only the agreement's own cumulative_royalty_cents (reports in ACCEPTED, ADJUSTED or CLOSED); FILED and RETURNED reports never reduce a shortfall."
    constants: {}
    precision: "integer cents; round_half_up on the pro-rata term only"
    variants:
      - name: INTERIM_PRO_RATA
        when: "quarter-close while the term is running"
        difference: "Compares earned royalty against the time-pro-rated slice of the guarantee, so a licensee that is behind pace accrues a shortfall mid-term; the value can shrink again next quarter."
      - name: FINAL_AT_EXPIRY
        when: "the agreement reaches EXPIRED or TERMINATED"
        difference: "Compares earned royalty against the FULL guarantee regardless of elapsed time, so the same data produces a strictly larger (never smaller) shortfall than the interim variant at any quarter before the last."

  - name: underreporting_recovery_assessment
    trigger: "AuditEngagement FIELDWORK->FINDINGS_ISSUED and DISPUTED->FINDINGS_ISSUED"
    algorithm: threshold
    formula: |
      for each entry E in payload.audited_quarters (one per engagement.scope_quarters):
        # single restated line, rated with the SAME per-line body as
        # calculations.royalty_due_computation variant PROVISIONAL_QUARTERLY
        closeout_eligible = min(E.audited_closeout_cents,
                                floor(E.audited_gross_sales_cents * closeout_cap_pct_bps / 10000))
        allowed_deduction = min(E.audited_deductions_cents,
                                floor(E.audited_gross_sales_cents * deduction_cap_pct_bps / 10000))
        net_regular = E.audited_gross_sales_cents - closeout_eligible - allowed_deduction
        tier_rate   = lookup_tier(net_regular).rate_bps
        recomputed(E) = round_half_up(net_regular * tier_rate / 10000)
                      + round_half_up(closeout_eligible * closeout_rate_bps / 10000)
        reported(E)   = effective royalty of the in-scope report for E.period_quarter
                        (adjusted_royalty_due_cents when non-null else royalty_due_cents)
        underreported(E) = max(0, recomputed(E) - reported(E))
        interest(E)      = round_half_up(underreported(E) * AUDIT_INTEREST_BPS_PER_QUARTER
                             * ELAPSED_QUARTERS(E.period_quarter, engagement.opened_quarter) / 10000)

      underreported_royalty_cents = sum of underreported(E)
      reported_royalty_cents      = sum of reported(E)
      recomputed_royalty_cents    = sum of recomputed(E)
      interest_cents              = sum of interest(E)
      underreport_rate_bps = 0 when reported_royalty_cents == 0
                             else floor(underreported_royalty_cents * 10000 / reported_royalty_cents)
      # INCLUSIVE boundary: exactly COST_SHIFT_THRESHOLD_BPS shifts the cost
      cost_shift_applied      = (underreport_rate_bps >= COST_SHIFT_THRESHOLD_BPS)
      audit_cost_recovery_cents = AUDIT_COST_FLAT_CENTS when cost_shift_applied else 0
      recovery_assessed_cents = underreported_royalty_cents + interest_cents
                              + audit_cost_recovery_cents
    input_set: "Exactly the reports whose period_quarter ∈ engagement.scope_quarters and whose status IN {UNDER_AUDIT, ADJUSTED}; a quarter whose report is not UNDER_AUDIT makes the whole issuance invalid (§1.4 priority 33)."
    constants:
      AUDIT_INTEREST_BPS_PER_QUARTER: 150
      COST_SHIFT_THRESHOLD_BPS: 500
      AUDIT_COST_FLAT_CENTS: 750000
    precision: "integer cents; round_half_up per audited quarter on the royalty and interest terms; underreport_rate_bps uses floor"
    variants: []

  - name: central_pool_distribution
    trigger: "DistributionRun LOCKED->DISTRIBUTED"
    algorithm: waterfall_allocation
    formula: |
      # ---- eligible report set (explicit status filter, no adjectives) ----
      eligible = every RoyaltyReport R with
                   R.period_quarter == run.period_quarter
                   AND R.status IN {ACCEPTED, ADJUSTED, CLOSED}
                   AND R.agreement.central_licensing_flag == true
      effective(R) = R.adjusted_royalty_due_cents when non-null else R.royalty_due_cents
      pool_gross_cents = sum over eligible of effective(R)     # recomputed, NOT copied
      report_count     = count(eligible)
      # empty pool is an error, not a zero distribution (§1.4 priority 34)

      # ---- waterfall, in this exact order ----
      league_admin_cents = round_half_up(pool_gross_cents * run.league_admin_rate_bps / 10000)
      player_basis_cents = sum over eligible whose agreement.category.mark_usage_class
                             == 'LEAGUE_CLUB_AND_PLAYER' of effective(R)
      player_pool_cents  = round_half_up(player_basis_cents * GROUP_LICENSING_SHARE_BPS / 10000)
      club_pool_cents    = pool_gross_cents - league_admin_cents - player_pool_cents

      # ---- club split: 75% equal, 25% weighted by revenue_share_units ----
      clubs = every Club with status == ACTIVE, iterated in club_code ASC order
      club_count  = count(clubs)                      # 0 clubs -> ERR_EMPTY_DISTRIBUTION_POOL
      total_units = sum over clubs of revenue_share_units
      equal_component_total    = floor(club_pool_cents * EQUAL_SPLIT_BPS / 10000)
      weighted_component_total = club_pool_cents - equal_component_total
      for each club C:
        equal_share_exact(C)    = equal_component_total / club_count            # exact rational
        weighted_share_exact(C) = weighted_component_total * C.revenue_share_units / total_units
        raw_exact(C)            = equal_share_exact(C) + weighted_share_exact(C)
        amount_before_remainder(C) = floor(raw_exact(C))
        equal_component_cents(C)    = floor(equal_share_exact(C))
        weighted_component_cents(C) = floor(weighted_share_exact(C))
      remainder = club_pool_cents - sum over clubs of amount_before_remainder(C)
      # largest-remainder method; ties broken by club_code ASC (never by id)
      ranking = clubs sorted by (raw_exact(C) - floor(raw_exact(C))) DESC, club_code ASC
      the first `remainder` clubs in `ranking` each get remainder_cent_applied = 1
      amount_cents(C) = amount_before_remainder(C) + remainder_cent_applied(C)

      # CONSERVED INVARIANT (exact, zero drift):
      #   sum over ClubDistribution of amount_cents
      #     + player_pool_cents + league_admin_cents == pool_gross_cents
    input_set: "Reports in status ACCEPTED, ADJUSTED or CLOSED for the run's quarter on central agreements; FILED/RETURNED/UNDER_AUDIT/DRAFT reports are excluded (and any FILED or RETURNED one blocks the transition entirely). Clubs with status == INACTIVE receive no ClubDistribution row and are excluded from club_count and total_units."
    constants:
      GROUP_LICENSING_SHARE_BPS: 2500
      EQUAL_SPLIT_BPS: 7500
    precision: "integer cents; round_half_up on league_admin_cents and player_pool_cents, floor on every per-club component, remainder distributed one cent at a time by largest fractional part with club_code ASC tie-break"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table — ONE global sequential order
# =============================================================================
# Priorities are unique and total. Every request evaluates rules in ascending
# priority and returns the FIRST violated rule's error_id. Bands:
#   1-4   auth            5-6   existence      7-10  input
#   11    concurrency     12    state          13-17 business_safety
#   18-25 business_referential                 26-31 business_fiscal
#   32-37 business_constraint                  38-42 business_temporal
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-Role header is present and names one of the seven roles in §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "A missing or unrecognized X-Role is rejected before any lookup."

  - priority: 2
    category: auth
    check: "the acting X-Role appears in the target endpoint's `roles` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Role/endpoint matrix from §1.7 and §1.5. Checked before the resource is loaded, so an unauthorized role never learns whether an id exists."

  - priority: 3
    category: auth
    check: "X-User-ID header is present and non-empty on every non-GET endpoint"
    error_id: ERR_MISSING_USER_ID
    http_status: 400
    applies_to: "every POST and PATCH endpoint"
    description: "Segregation-of-duties bookkeeping (§1.7) requires an actor identity on every mutation."

  - priority: 4
    category: auth
    check: |
      entity-backed role scope: X-Role == Licensee requires X-User-ID to equal the
      Licensee.id that owns the target (directly, or via agreement.licensee_id for
      agreements, submissions, reports, engagements and authorizations);
      X-Role == ClubRepresentative requires X-User-ID == the target Club.id (or
      MarkRight.club_id / ClubDistribution.club_id);
      X-Role == PlayerAgent requires X-User-ID == the target Player.id (or
      MarkRight.player_id)
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "every endpoint whose `roles` include Licensee, ClubRepresentative or PlayerAgent"
    description: "Cross-tenant reads and writes are refused even when the role itself is authorized for the endpoint."

  - priority: 5
    category: existence
    check: "every id in the path resolves to an existing row"
    error_id: "ERR_LICENSEE_NOT_FOUND | ERR_CATEGORY_NOT_FOUND | ERR_CLUB_NOT_FOUND | ERR_PLAYER_NOT_FOUND | ERR_MARK_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_ENFORCEMENT_NOT_FOUND | ERR_RUN_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
    description: "Leftmost path segment is resolved first, so a bad parent id wins over a bad child id."

  - priority: 6
    category: existence
    check: "every foreign-key id in the request body resolves to an existing row (licensee_id, category_id, club_id, player_id, agreement_id, submission_id, mark_ids[], retailer_authorization_id, run_id)"
    error_id: "the matching ERR_*_NOT_FOUND from priority 5"
    http_status: 404
    applies_to: "every POST/PATCH whose body carries a foreign key"
    description: "Body FKs are resolved in the field order declared by the endpoint's `input`."

  - priority: 7
    category: input
    check: "every field marked required in the endpoint's `input` is present and has the declared JSON type"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
    description: "Unknown extra fields are ignored; fields with source computed/system in the body are ignored, never echoed."

  - priority: 8
    category: input
    check: "every enum-typed field carries a value from its declared enum set"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
    description: "Enum sets are exactly those written in §1.1 and §1.5; casing is significant."

  - priority: 9
    category: input
    check: |
      scalar shape rules: every *_cents field is an integer >= 0; every *_bps field
      is an integer in 0..10000; every *_units field is an integer >= 1; every
      quarter field matches `^20\\d{2}Q[1-4]$` (e.g. `2026Q2`, no dash); every date field is `YYYY-MM-DD`;
      every datetime field is RFC3339 with a `Z` offset; `scope_quarters` and
      `audited_quarters` are non-empty arrays of distinct consecutive quarters in
      ascending order; `channel_lines` is a non-empty array with distinct
      channel_class values
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
    description: "Shape is validated before any cross-row arithmetic so that a malformed quarter never reaches the calendar helpers."

  - priority: 10
    category: input
    check: "pagination: limit is an integer in 1..100 (default 10) and offset is an integer >= 0 (default 0); `sort` when present is one of the endpoint's documented keys"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "every list endpoint"
    description: "limit == 0, limit == 101 and offset == -1 are all rejected."

  - priority: 11
    category: concurrency
    check: "the OCC field declared in §1.2.1 equals the parent's current `version` (expected_agreement_version, expected_licensee_version, expected_run_version)"
    error_id: "ERR_STALE_AGREEMENT_VERSION | ERR_STALE_LICENSEE_VERSION | ERR_STALE_DISTRIBUTION_VERSION"
    http_status: 412
    applies_to: "POST /licensing/royalty-reports; POST /licensing/licensees/{licenseeId}/retailer-authorizations; POST /licensing/distribution-runs/{runId}/lock; POST /licensing/distribution-runs/{runId}/distribute"
    description: "Evaluated after existence and shape but BEFORE state and every business rule, so a stale version is reported even when the operation would also have failed a business check."

  - priority: 12
    category: state
    check: "the target entity's current state (or state pair, for LicenseAgreement) permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every transition endpoint"
    description: "Terminal states admit no transition at all. Repeating a transition that already happened yields this error on the second call."

  - priority: 13
    category: business_safety
    check: "settling an AuditEngagement requires X-User-ID != engagement.findings_issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /licensing/audit-engagements/{engagementId}/settle"
    description: "The auditor who issued the findings cannot also settle them."

  - priority: 14
    category: business_safety
    check: "opening an AuditEngagement requires X-User-ID to differ from accepted_by_user_id of every RoyaltyReport whose period_quarter ∈ scope_quarters"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /licensing/audit-engagements"
    description: "The controller who accepted a report cannot open the audit that reviews it."

  - priority: 15
    category: business_safety
    check: "submission.review_hold == false"
    error_id: ERR_REVIEW_ON_HOLD
    http_status: 409
    applies_to: "POST /licensing/product-submissions/{submissionId}/submit; POST /licensing/product-submissions/{submissionId}/review-decisions; POST /licensing/product-submissions/{submissionId}/sample-reviews"
    description: "A hold placed by a suspension or a PROBATION/FROZEN posture freezes the whole review pipeline for that submission."

  - priority: 16
    category: business_safety
    check: "the governing LicenseAgreement's compliance_posture != FROZEN"
    error_id: ERR_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /licensing/agreements/{agreementId}/product-submissions; POST /licensing/product-submissions/{submissionId}/submit; POST /licensing/product-submissions/{submissionId}/review-decisions; POST /licensing/agreements/{agreementId}/territory-grants; POST /licensing/retailer-authorizations/{authorizationId}/status; POST /licensing/royalty-reports/{reportId}/review-decisions"
    description: "For retailer-authorization APPROVE the check is over every ACTIVE/SUSPENDED agreement of the licensee: one FROZEN agreement blocks the approval."

  - priority: 17
    category: business_safety
    check: "the governing Licensee.status == ACTIVE"
    error_id: ERR_LICENSEE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /licensing/agreements; POST /licensing/agreements/{agreementId}/contract-status (ACTIVATE, REINSTATE); POST /licensing/licensees/{licenseeId}/retailer-authorizations; POST /licensing/retailer-authorizations/{authorizationId}/status (APPROVE, REINSTATE)"
    description: "A SUSPENDED or TERMINATED licensee cannot gain new commercial rights, though it can still file and be audited."

  - priority: 18
    category: business_referential
    check: "when agreement.exclusivity_mode != NON_EXCLUSIVE the referenced ProductCategory.exclusivity_allowed must be true"
    error_id: ERR_EXCLUSIVITY_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /licensing/agreements; PATCH /licensing/agreements/{agreementId}"
    description: "Categories flagged as open-license can only carry NON_EXCLUSIVE agreements."

  - priority: 19
    category: business_referential
    check: |
      mark set consistency, sub-checks in this order:
        (a) every MarkRight in mark_ids is compatible with category.mark_usage_class:
              LEAGUE_ONLY            -> owner_type ∈ {LEAGUE}
              LEAGUE_AND_CLUB        -> owner_type ∈ {LEAGUE, CLUB}
              LEAGUE_CLUB_AND_PLAYER -> owner_type ∈ {LEAGUE, CLUB, PLAYER_GROUP, PLAYER_INDIVIDUAL}
            -> ERR_MARK_CLASS_NOT_PERMITTED
        (b) mark_ids must not contain both a PLAYER_GROUP mark and a
            PLAYER_INDIVIDUAL mark for the SAME player_id
            -> ERR_MARK_RIGHTS_CONFLICT
    error_id: "ERR_MARK_CLASS_NOT_PERMITTED | ERR_MARK_RIGHTS_CONFLICT"
    http_status: "422 | 409"
    applies_to: "POST /licensing/agreements/{agreementId}/product-submissions; PATCH /licensing/product-submissions/{submissionId}"
    description: "Category usage class is the outer envelope for any mark a submission may carry; group and individual rights for one player are mutually exclusive on a single SKU."

  - priority: 20
    category: business_referential
    check: "every MarkRight in mark_ids has status == ACTIVE"
    error_id: ERR_MARK_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /licensing/agreements/{agreementId}/product-submissions; POST /licensing/product-submissions/{submissionId}/submit; POST /licensing/product-submissions/{submissionId}/review-decisions (APPROVE)"
    description: "RESTRICTED and WITHDRAWN marks cannot enter or advance a submission; already-APPROVED submissions are handled by the SM10 cascade instead."

  - priority: 21
    category: business_referential
    check: "every MarkRight with owner_type == PLAYER_GROUP in mark_ids has its Player.group_licensing_opt_in == true"
    error_id: ERR_PLAYER_GROUP_OPT_OUT
    http_status: 409
    applies_to: "POST /licensing/agreements/{agreementId}/product-submissions; POST /licensing/product-submissions/{submissionId}/submit; POST /licensing/product-submissions/{submissionId}/review-decisions (APPROVE)"
    description: "Group licensing is opt-in per player and is re-checked at approval, not only at creation."

  - priority: 22
    category: business_referential
    check: "every MarkRight with owner_type == PLAYER_INDIVIDUAL in mark_ids has agreement.category_id ∈ its Player.individual_grant_category_ids"
    error_id: ERR_PLAYER_INDIVIDUAL_GRANT_MISSING
    http_status: 409
    applies_to: "POST /licensing/agreements/{agreementId}/product-submissions; POST /licensing/product-submissions/{submissionId}/submit; POST /licensing/product-submissions/{submissionId}/review-decisions (APPROVE)"
    description: "An individual player grant is per product category; a grant for HEADWEAR does not cover JERSEY."

  - priority: 23
    category: business_referential
    check: "channel lines: every channel_line.retailer_authorization_id belongs to a RetailerAuthorization whose licensee_id == agreement.licensee_id and whose channel_class equals the line's channel_class"
    error_id: ERR_CHANNEL_LINE_RETAILER_MISMATCH
    http_status: 422
    applies_to: "POST /licensing/royalty-reports; PATCH /licensing/royalty-reports/{reportId}"
    description: "A licensee cannot report sales through another licensee's retailer authorization, and a line must be booked against an authorization for that same channel class."

  - priority: 24
    category: business_referential
    check: |
      every channel_line's RetailerAuthorization satisfies BOTH:
        (a) status == AUTHORIZED, or status == SUSPENDED with suspension_reason ==
            'NO_APPROVED_SKUS' and suspended_at > QUARTER_END_DATE(period_quarter)
        (b) its CLOSED window authorized_from..authorized_to contains
            QUARTER_END_DATE(report.period_quarter)
    error_id: ERR_CHANNEL_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /licensing/royalty-reports; POST /licensing/royalty-reports/{reportId}/file"
    description: "Sales through an unauthorized or out-of-window channel cannot be reported at all; the licensee must first obtain the authorization."

  - priority: 25
    category: business_referential
    check: "report.period_quarter satisfies QUARTER_OF(agreement.term_start_date) <= period_quarter <= QUARTER_OF(agreement.term_end_date)"
    error_id: ERR_PERIOD_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /licensing/royalty-reports"
    description: "Reporting a quarter the agreement never covered is a referential error, and it outranks every fiscal line check on the same request."

  - priority: 26
    category: business_fiscal
    check: "agreement.minimum_guarantee_cents >= category.minimum_guarantee_floor_cents"
    error_id: ERR_MG_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /licensing/agreements; PATCH /licensing/agreements/{agreementId}; POST /licensing/agreements/{agreementId}/contract-status (SUBMIT_FOR_SIGNATURE)"
    description: "Exactly the floor is acceptable; one cent below is not."

  - priority: 27
    category: business_fiscal
    check: "agreement.required_advance_cents >= floor(minimum_guarantee_cents * category.advance_floor_bps_of_mg / 10000)"
    error_id: ERR_ADVANCE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /licensing/agreements; PATCH /licensing/agreements/{agreementId}"
    description: "The advance floor is a derived bound, so the boundary case is the exact floor computed with truncation."

  - priority: 28
    category: business_fiscal
    check: "advance_paid_cents after the payment must not exceed required_advance_cents"
    error_id: ERR_ADVANCE_OVERPAYMENT
    http_status: 422
    applies_to: "POST /licensing/agreements/{agreementId}/advance-payments"
    description: "Advances are capped at the contracted amount; exactly reaching the cap is allowed."

  - priority: 29
    category: business_fiscal
    check: "for every channel line: deductions_cents <= floor(gross_sales_cents * category.deduction_hard_limit_bps / 10000)"
    error_id: ERR_DEDUCTION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /licensing/royalty-reports; PATCH /licensing/royalty-reports/{reportId}"
    description: "The HARD limit rejects the request; the softer deduction_cap_pct_bps merely truncates the allowed deduction inside the calculation."

  - priority: 30
    category: business_fiscal
    check: "for every channel line: closeout_sales_cents <= gross_sales_cents AND closeout_sales_cents <= floor(gross_sales_cents * category.closeout_hard_limit_bps / 10000)"
    error_id: ERR_CLOSEOUT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /licensing/royalty-reports; PATCH /licensing/royalty-reports/{reportId}"
    description: "Lines are checked in ascending CHANNEL_CLASS_ORDER; the first offending line's error is returned."

  - priority: 31
    category: business_fiscal
    check: "a channel line with closeout_sales_cents > 0 requires its RetailerAuthorization.closeout_allowed == true; a line with channel_class == OFF_PRICE requires closeout_sales_cents > 0"
    error_id: ERR_CLOSEOUT_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /licensing/royalty-reports; PATCH /licensing/royalty-reports/{reportId}"
    description: "Closeout policy is per authorization; the OFF_PRICE channel exists only for closeout volume."

  - priority: 32
    category: business_constraint
    check: |
      audit engagement integrity, sub-checks in this order:
        (a) begin-fieldwork: every quarter in scope_quarters has a RoyaltyReport on
            the agreement with status == ACCEPTED
            -> ERR_AUDIT_SCOPE_NOT_ACCEPTED
        (b) issue-findings: payload.audited_quarters period_quarter values equal
            engagement.scope_quarters exactly (same set, same order) and each
            corresponding report has status IN {UNDER_AUDIT, ADJUSTED}
            -> ERR_AUDIT_SCOPE_NOT_ACCEPTED
        (c) settle: settlement_basis == NEGOTIATED requires negotiated_cents present
            with 0 <= negotiated_cents <= engagement.recovery_assessed_cents;
            settlement_basis == FINDINGS requires negotiated_cents absent
            -> ERR_SETTLEMENT_OUT_OF_RANGE
    error_id: "ERR_AUDIT_SCOPE_NOT_ACCEPTED | ERR_SETTLEMENT_OUT_OF_RANGE"
    http_status: "409 | 422"
    applies_to: "POST /licensing/audit-engagements/{engagementId}/begin-fieldwork; POST /licensing/audit-engagements/{engagementId}/issue-findings; POST /licensing/audit-engagements/{engagementId}/settle"
    description: "A negotiated settlement can be zero but never exceeds the assessment; a scope quarter whose report never reached the required status blocks the whole engagement step."

  - priority: 33
    category: business_constraint
    check: "at most one RoyaltyReport per (agreement_id, period_quarter) may exist in a status other than RETURNED"
    error_id: ERR_DUPLICATE_REPORT_PERIOD
    http_status: 409
    applies_to: "POST /licensing/royalty-reports"
    description: "A RETURNED report is re-filed on the same row; it does not permit a second row."

  - priority: 34
    category: business_constraint
    check: "no other LicenseAgreement exists for the same (licensee_id, category_id) whose term half-open interval [term_start_date, term_end_date + 1 day) overlaps the requested term and whose contract_status ∉ {EXPIRED, TERMINATED}"
    error_id: ERR_DUPLICATE_AGREEMENT
    http_status: 409
    applies_to: "POST /licensing/agreements"
    description: "One live agreement per licensee per category per period; back-to-back terms that merely touch are allowed."

  - priority: 35
    category: business_constraint
    check: |
      exclusivity: when the grant's agreement has exclusivity_mode ==
      EXCLUSIVE, no other TerritoryGrant with
      status == GRANTED on a DIFFERENT agreement of the same category_id, the same
      territory_code and an intersecting channel_class scope may overlap the
      HALF-OPEN interval [effective_from, effective_to). Touching endpoints
      (a.effective_to == b.effective_from) do NOT overlap.
    error_id: ERR_TERRITORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /licensing/agreements/{agreementId}/territory-grants"
    description: "channel_class == ALL intersects every channel class; two distinct specific classes never intersect."

  - priority: 36
    category: business_constraint
    check: |
      OFF_PRICE aggregate capacity: counting only RetailerAuthorization rows of the
      same licensee with channel_class == OFF_PRICE and status ∈ {PENDING,
      AUTHORIZED} whose CLOSED windows overlap the requested CLOSED window, the
      total including the row being approved must be <= MAX_CONCURRENT_OFF_PRICE (2)
    error_id: ERR_OFF_PRICE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /licensing/licensees/{licenseeId}/retailer-authorizations; POST /licensing/retailer-authorizations/{authorizationId}/status (APPROVE)"
    description: "Each authorization is individually legal; only the collective count breaches. No 30-day buffer applies to this aggregate test — plain closed-interval overlap."

  - priority: 37
    category: business_constraint
    check: "accepting a RoyaltyReport requires that no DistributionRun with the same period_quarter has status == DISTRIBUTED; locking/distributing requires no RoyaltyReport with status ∈ {FILED, RETURNED} for the run's quarter on a central agreement; distributing requires a non-empty eligible report set AND at least one Club with status == ACTIVE"
    error_id: "ERR_DISTRIBUTION_ALREADY_CLOSED | ERR_PENDING_REPORTS_BLOCK_DISTRIBUTION | ERR_EMPTY_DISTRIBUTION_POOL"
    http_status: 409
    applies_to: "POST /licensing/royalty-reports/{reportId}/review-decisions; POST /licensing/distribution-runs/{runId}/lock; POST /licensing/distribution-runs/{runId}/distribute"
    description: "Three sub-conditions of one constraint, evaluated in the written order; the pool-empty case is an error rather than a zero-cent distribution."

  - priority: 38
    category: business_temporal
    check: |
      RetailerAuthorization windows: authorized_from <= authorized_to (CLOSED
      interval), and no other authorization for the same (licensee_id,
      retailer_name, channel_class) with status ∈ {PENDING, AUTHORIZED} may lie
      within RETAILER_WINDOW_BUFFER_DAYS (30) of the requested window — i.e. the
      request is rejected when
      requested_from <= other_to + 30 days AND other_from <= requested_to + 30 days
    error_id: ERR_RETAILER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /licensing/licensees/{licenseeId}/retailer-authorizations; POST /licensing/retailer-authorizations/{authorizationId}/status (APPROVE)"
    description: "Buffered closed-interval semantics: a gap of exactly 30 days still conflicts, a gap of 31 days does not. Different retailer_name or channel_class never conflicts."

  - priority: 39
    category: business_temporal
    check: "TerritoryGrant windows: effective_from < effective_to (HALF-OPEN, so a zero-length window is invalid) and QUARTER_OF(effective_from) >= QUARTER_OF(agreement.term_start_date) and effective_to <= (agreement.term_end_date + 1 day)"
    error_id: ERR_GRANT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /licensing/agreements/{agreementId}/territory-grants"
    description: "Grant windows are half-open and must sit inside the agreement term expressed as a half-open interval."

  - priority: 40
    category: business_temporal
    check: "filing requires the reporting period to be over: the clock's UTC date >= QUARTER_END_DATE(report.period_quarter)"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /licensing/royalty-reports/{reportId}/file"
    description: "The quarter-end date itself is acceptable (inclusive lower bound); the day before is not."

  - priority: 41
    category: business_temporal
    check: "every quarter in scope_quarters satisfies 0 <= ELAPSED_QUARTERS(quarter, QUARTER_OF(clock)) <= AUDIT_LOOKBACK_QUARTERS (8)"
    error_id: ERR_AUDIT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /licensing/audit-engagements"
    description: "Audit rights run out after 8 elapsed quarters; exactly 8 is still auditable, 9 is not. Future quarters (negative elapsed) are also rejected."

  - priority: 42
    category: business_temporal
    check: "the operations clock only moves forward: POST /licensing/_clock/set_current_utc requires payload.current_utc >= the current clock value; POST /licensing/ops/quarter-close requires as_of_quarter == QUARTER_OF(clock) and that this quarter has not already been closed"
    error_id: "ERR_CLOCK_BACKWARD | ERR_QUARTER_ALREADY_CLOSED"
    http_status: "422 | 409"
    applies_to: "POST /licensing/_clock/set_current_utc; POST /licensing/ops/quarter-close"
    description: "Equal timestamps are accepted by the clock (idempotent set); a re-run of quarter-close for an already closed quarter is rejected."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Conventions
#   * every path is namespaced under api_prefix `/licensing`
#   * `roles` is the closed set of X-Role values accepted (§1.4 priority 2)
#   * `input` lists body fields for POST/PATCH and query parameters for GET;
#     a trailing `?` marks the field optional
#   * every list endpoint accepts `limit?` / `offset?` and returns the paginated
#     envelope described in `response_envelope.pagination_fields`
#   * fields with source computed/system are silently ignored when posted
# =============================================================================

endpoints:
  # ------------------------------------------------------- ProductCategory
  - method: POST
    path: /licensing/product-categories
    description: Register a licensable product category with its tier schedule and policy caps.
    roles: [LeagueLicensingManager]
    code: 201
    input: ["category_code", "display_name", "base_royalty_rate_bps", "tier_schedule", "closeout_rate_bps", "exclusivity_allowed", "minimum_guarantee_floor_cents", "mark_usage_class", "closeout_cap_pct_bps?", "closeout_hard_limit_bps?", "deduction_cap_pct_bps?", "deduction_hard_limit_bps?", "advance_floor_bps_of_mg?", "central_licensing_default?"]
    output: ProductCategory
    side_effects:
      - "validates that tier_schedule is a contiguous ascending half-open cover starting at 0 with exactly one open-ended top tier"

  - method: GET
    path: /licensing/product-categories
    description: List product categories.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee, ClubRepresentative, PlayerAgent]
    code: 200
    input: ["mark_usage_class?", "exclusivity_allowed?", "limit?", "offset?"]
    output: ProductCategory[]
    side_effects: []

  - method: GET
    path: /licensing/product-categories/{categoryId}
    description: Retrieve one product category.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee, ClubRepresentative, PlayerAgent]
    code: 200
    input: []
    output: ProductCategory
    side_effects: []

  - method: PATCH
    path: /licensing/product-categories/{categoryId}
    description: Adjust a category's tier schedule or policy caps.
    roles: [LeagueLicensingManager]
    code: 200
    input: ["tier_schedule?", "base_royalty_rate_bps?", "closeout_rate_bps?", "closeout_cap_pct_bps?", "closeout_hard_limit_bps?", "deduction_cap_pct_bps?", "deduction_hard_limit_bps?", "minimum_guarantee_floor_cents?", "advance_floor_bps_of_mg?", "exclusivity_allowed?", "central_licensing_default?"]
    output: ProductCategory
    side_effects:
      - "increments ProductCategory.version by 1"
      - "already-FILED reports keep their applied_tier_rate_bps; the new schedule applies only to future filings and audit restatements"

  # ------------------------------------------------------- Club / Player
  - method: POST
    path: /licensing/clubs
    description: Register a member club and its revenue-sharing units.
    roles: [LeagueLicensingManager]
    code: 201
    input: ["club_code", "market_name", "revenue_share_units", "status?"]
    output: Club
    side_effects: []

  - method: GET
    path: /licensing/clubs
    description: List clubs.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee, ClubRepresentative, PlayerAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Club[]
    side_effects: []

  - method: GET
    path: /licensing/clubs/{clubId}
    description: Retrieve one club.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, ClubRepresentative]
    code: 200
    input: []
    output: Club
    side_effects: []

  - method: PATCH
    path: /licensing/clubs/{clubId}
    description: Update a club's revenue-share units or active status.
    roles: [LeagueLicensingManager]
    code: 200
    input: ["revenue_share_units?", "status?", "market_name?"]
    output: Club
    side_effects:
      - "increments Club.version by 1"
      - "already-DISTRIBUTED runs are untouched; their ClubDistribution rows keep revenue_share_units_snapshot"

  - method: POST
    path: /licensing/clubs/{clubId}/players
    description: Add a player to a club roster.
    roles: [LeagueLicensingManager]
    code: 201
    input: ["full_name", "group_licensing_opt_in?", "status?"]
    output: Player
    side_effects: []

  - method: GET
    path: /licensing/players
    description: List players, optionally filtered by club.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, ClubRepresentative, PlayerAgent]
    code: 200
    input: ["club_id?", "group_licensing_opt_in?", "status?", "limit?", "offset?"]
    output: Player[]
    side_effects: []

  - method: GET
    path: /licensing/players/{playerId}
    description: Retrieve one player.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, ClubRepresentative, PlayerAgent]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: POST
    path: /licensing/players/{playerId}/group-licensing
    description: Set a player's group-licensing opt-in flag.
    roles: [PlayerAgent, LeagueLicensingManager]
    code: 200
    input: ["opt_in"]
    output: Player
    side_effects:
      - "opt_in == false: every MarkRight with player_id == this player and owner_type == PLAYER_GROUP and status IN {ACTIVE, RESTRICTED} moves to WITHDRAWN (SM10), which cascades APPROVED ProductSubmissions to REVOKED and can suspend RetailerAuthorizations"
      - "opt_in == true: every MarkRight with player_id == this player, owner_type == PLAYER_GROUP and status == WITHDRAWN returns to ACTIVE; previously REVOKED submissions stay REVOKED"
      - "increments Player.version by 1 plus the version of every entity mutated by the cascade"

  - method: POST
    path: /licensing/players/{playerId}/individual-grants
    description: Grant or withdraw an individual player right for one product category.
    roles: [PlayerAgent, LeagueLicensingManager]
    code: 200
    input: ["category_id", "granted"]
    output: Player
    side_effects:
      - "granted == true: adds category_id to individual_grant_category_ids (idempotent set semantics)"
      - "granted == false: removes category_id from individual_grant_category_ids; APPROVED submissions already pinned keep their approval, but their PLAYER_INDIVIDUAL marks fail §1.4 priority 22 on any later re-approval"
      - "increments Player.version by 1"

