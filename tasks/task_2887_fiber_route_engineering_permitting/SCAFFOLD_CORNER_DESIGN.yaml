              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
            - call: "POST /design-packages"
              payload: { route_id: "${route_id}", fiber_count_allocated: 288, express_fiber_count: 48, expected_route_version: "${rv1}" }
              as: RouteEngineer
              captures: { dp_id: $.data.id }
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 0, enclosure_type: "HANDHOLE", fiber_count_dropped: 24 }
              as: RouteEngineer
              captures: { sp1_id: $.data.id }
            - call: "POST /splice-points/${sp1_id}/void"
              payload: {}
              as: RouteEngineer
          trigger:
            - call: "POST /design-packages/${dp_id}/submit-for-review"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { err: $.data.error_id }
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 0, enclosure_type: "VAULT", fiber_count_dropped: 12 }
              as: RouteEngineer
              captures: { sp2_id: $.data.id }
            - call: "POST /design-packages/${dp_id}/submit-for-review"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_DESIGN_HAS_NO_SPLICE_POINTS with HTTP 422 and DesignPackage.${dp_id}.status stays DRAFT"
            - "SplicePoint.${sp1_id}.status == VOIDED with voided_at set, and DesignPackage.${dp_id}.splice_point_count == 0 before the second trigger"
            - "the station-0 slot is free again after the void, so creating ${sp2_id} at station 0 is not a spacing violation"
            - "the third call returns HTTP 200 with ${st} == IN_REVIEW and submitted_by_user_id == eng-alice"
            - "DesignPackage.${dp_id}.splice_point_count == 1, handhole_count == 0, assigned_drop_fiber_count == 12 and reserve_fiber_count == 228"

      - name: make_ready_required_error_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_MAKE_READY_REQUIRED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / make_ready_safety_gate_precedes_budget_gate
          rationale: "That §1.8 instance triggers the grade-D pole-replacement gate directly and then relieves it, which is the only way this id can fire."

      - name: moratorium_window_conflict_error_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_MORATORIUM_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / permit_work_window_touching_moratorium_endpoint_conflicts
          rationale: "The touching-endpoint permit submit in that §1.8 instance is the canonical trigger for this id."

      - name: splice_spacing_violation_error_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_SPLICE_SPACING_VIOLATION
        excluded_because:
          difficulty_instance: resource_temporal_overlap / splice_point_station_buffer_equality_allowed_and_inside_rejected
          rationale: "That §1.8 instance already places a splice inside the 250-foot buffer and asserts this id, alongside the exactly-250 acceptance."

      - name: route_has_no_segments_error_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_ROUTE_HAS_NO_SEGMENTS
        excluded_because:
          difficulty_instance: boundary_precision_check / lock_scope_with_zero_segments_hits_empty_collection_boundary
          rationale: "Locking scope on an empty route is the sole trigger and is covered there, including the division-by-zero avoidance on the complexity index."

      - name: permit_not_cleared_error_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_PERMIT_NOT_CLEARED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / design_stamp_requires_every_segment_permit_cleared
          rationale: "That §1.8 instance stamps against a route with one uncleared segment and asserts this id, then clears it and re-stamps."

      - name: spare_ratio_below_minimum_error_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_SPARE_RATIO_BELOW_MINIMUM
        excluded_because:
          difficulty_instance: boundary_precision_check / spare_fiber_ratio_exactly_at_minimum_passes_stamp
          rationale: "The named §1.8 instance asserts both sides of the 2000-basis-point line, so the failing side is already pinned."

      - name: invalid_route_state_error_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_INVALID_ROUTE_STATE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / permit_application_create_requires_route_scope_locked
          rationale: "Creating a permit application while the route is still PLANNING is the trigger that instance asserts."

  # ===========================================================================
  # 7 — rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: route_create_by_a_field_surveyor_returns_unauthorized
        claim_type: RBAC Deny
        grounds:
          - roles.RouteEngineer.exclusive_operations
          - roles.FieldSurveyor
          - validations[priority=2]
        distinguishing_aspect: "POST /routes is exclusive to RouteEngineer, so a fully valid body from FieldSurveyor is refused with 403 and no Route is created — the deny is about the role, not the payload."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "no Route named 'Harbor Loop' exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
          trigger:
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: FieldSurveyor
              as_user_id: "survey-dana"
              captures: { err: $.data.error_id }
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { route_id: $.data.id }
          assert:
            - "${err} == ERR_UNAUTHORIZED with HTTP 403"
            - "the identical body sent by RouteEngineer returns HTTP 201 and Route.${route_id}.status == PLANNING"
            - "GET /routes returns exactly 1 row after both triggers"
            - "the 403 body carries error_id and message, and the role is carried only in the X-User-Role header — no role field appears in any payload"

      - name: permit_review_by_a_permit_coordinator_returns_unauthorized
        claim_type: RBAC Deny
        grounds:
          - roles.AuthorityReviewer.exclusive_operations
          - roles.PermitCoordinator.exclusive_operations
          - complexity_profile.role_model
        distinguishing_aspect: "The coordinator files and can even deem a lapsed permit, but the review decision itself belongs to AuthorityReviewer, so a coordinator-issued APPROVED is a 403 while the same body from the reviewer lands."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Inland Spur' (SPUR) SCOPE_LOCKED with one walked RouteSegment (400 feet, URBAN_PAVED)"
            - "one MUNICIPAL_ROW PermitApplication in UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Inland Spur", topology_objective: "SPUR", target_in_service_date: "2027-06-01", budget_authorized_cents: 90000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
            - call: "POST /permit-applications"
              payload: { segment_id: "${seg_id}", authority_type: "MUNICIPAL_ROW", authority_name: "City of Ridgefield DPW", work_window_start_on: "2026-09-15", work_window_end_on: "2026-09-20" }
              as: PermitCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /permit-applications/${p1_id}/submit"
              payload: {}
              as: PermitCoordinator
          trigger:
            - call: "POST /permit-applications/${p1_id}/review"
              payload: { decision: "APPROVED", decision_note: "self-approved" }
              as: PermitCoordinator
              as_user_id: "coord-erin"
              captures: { err: $.data.error_id }
            - call: "POST /permit-applications/${p1_id}/review"
              payload: { decision: "APPROVED", decision_note: "approved as filed" }
              as: AuthorityReviewer
              as_user_id: "city-reviewer-1"
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_UNAUTHORIZED with HTTP 403"
            - "after the first trigger PermitApplication.${p1_id}.status == UNDER_REVIEW with decided_at == null and decided_by_user_id == null"
            - "the second trigger returns HTTP 200 with ${st} == APPROVED, decided_by_user_id == city-reviewer-1 and deemed == false"
            - "RouteSegment.${seg_id}.permit_status == CLEARED only after the authorised review"

      - name: records_admin_exclusive_writes_reject_every_other_role
        claim_type: RBAC Deny
        grounds:
          - roles.NetworkRecordsAdmin.exclusive_operations
          - endpoints[POST /routes/{id}/budget-adjustments]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Both of the admin's fiscal and temporal levers are closed to engineering roles: a RouteEngineer budget adjustment and a PermitCoordinator clock move are each 403, and neither the authorization nor the logical clock shifts."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' in PLANNING with budget_authorized_cents 1000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 1000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /routes/${route_id}/budget-adjustments"
              payload: { delta_cents: 500000, reason: "engineer self-service" }
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PermitCoordinator
              as_user_id: "coord-erin"
              captures: { err2: $.data.error_id }
            - call: "POST /routes/${route_id}/budget-adjustments"
              payload: { delta_cents: 500000, reason: "supplemental authorization" }
              as: NetworkRecordsAdmin
              as_user_id: "records-frank"
              captures: { auth: $.data.budget_authorized_cents, v1: $.data.version }
          assert:
            - "${err} == ERR_UNAUTHORIZED with HTTP 403 and Route.${route_id}.budget_authorized_cents == 1000000 immediately after it"
            - "${err2} == ERR_UNAUTHORIZED with HTTP 403 and the logical clock still reads 2026-08-10T00:00:00Z"
            - "${auth} == 1500000 and ${v1} is ${v0} plus 1, so only the admin's call took effect"
            - "Route.${route_id}.budget_available_cents == 1500000 and budget_committed_cents == 0"

      - name: every_declared_role_can_read_a_route_detail
        claim_type: RBAC Allow
        grounds:
          - roles
          - endpoints[GET /routes/{id}]
        distinguishing_aspect: "All six declared roles appear in the read endpoint's roles list, so the same GET returns 200 for each of them — read access is shared even though every write is partitioned."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' in PLANNING with budget_authorized_cents 250000000"
            - "six distinct X-User-ID values, one per declared role"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
          trigger:
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { s_eng: $.data.status }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: FieldSurveyor
              as_user_id: "survey-dana"
              captures: { s_survey: $.data.status }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: PermitCoordinator
              as_user_id: "coord-erin"
              captures: { s_coord: $.data.status }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: AuthorityReviewer
              as_user_id: "city-reviewer-1"
              captures: { s_review: $.data.status }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: PoleOwner
              as_user_id: "telco-1"
              captures: { s_owner: $.data.status }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: NetworkRecordsAdmin
              as_user_id: "records-frank"
              captures: { s_admin: $.data.status }
          assert:
            - "all six triggers return HTTP 200 and ${s_eng} == ${s_survey} == ${s_coord} == ${s_review} == ${s_owner} == ${s_admin} == PLANNING"
            - "every response returns the same id ${route_id} with identical budget figures, so no role sees a filtered projection"
            - "each identity is opaque: no role requires a pre-registered user record, only a non-blank X-User-ID"

      - name: design_stamp_by_the_submitting_engineer_returns_segregation_of_duties
        claim_type: Segregation of duties
        grounds:
          - validations[priority=12]
          - roles.RouteEngineer.exclusive_operations
          - entities.DesignPackage.fields.submitted_by_user_id
        distinguishing_aspect: "Both actions belong to RouteEngineer, so the block is on the X-User-ID rather than the role: eng-alice cannot stamp what eng-alice submitted, while eng-bob in the same role can."
