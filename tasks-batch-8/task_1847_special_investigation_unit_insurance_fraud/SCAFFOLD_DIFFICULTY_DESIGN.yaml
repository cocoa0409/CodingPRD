              payload: { closed_reason: "SUBSTANTIATED" }
              as: SIUManager
            - call: "GET /siu/cases/${k}/restitution-ledgers"
              payload: {}
              as: SIUManager
              captures: { l_id: "$.data[0].id", l_v: "$.data[0].version" }
            - call: "POST /siu/ledgers/${l_id}/payments"
              payload: { amount_cents: 20000000, received_at: "2026-08-12T00:00:00Z", method: "ACH" }
              as: SIUManager
