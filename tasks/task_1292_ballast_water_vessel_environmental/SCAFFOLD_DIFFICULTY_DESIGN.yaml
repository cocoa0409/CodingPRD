            - call: "POST /vessels/${v}/voyages/${vyB}/ballast-events"
              payload: { event_kind: EXCHANGE_COMPLETE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T1", volume_m3: 400, latitude: 30.0, longitude: -150.0, distance_from_shore_nm: 199.999, expected_voyage_version: "${wb2}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vyB}"
              as: VesselMaster
              captures: { wb3: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vyB}/ballast-events"
