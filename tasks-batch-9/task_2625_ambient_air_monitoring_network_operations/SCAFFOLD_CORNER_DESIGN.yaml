            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
          trigger:
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "MonitoringSite.${site_a_id}.status == SITING_APPROVED and version == 2 - unchanged by the replay"
            - "MonitoringNetwork.${net_id}.approved_site_count == 1 and proposed_site_count == 0"

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.ReferenceMethod
          - state_machines.MonitoringSite
          - state_machines.Monitor
          - state_machines.DataBatch
          - state_machines.DataInvalidation
          - state_machines.ExceptionalEventDemonstration
          - state_machines.NetworkAssessment
          - state_machines.SiteChangeRequest
          - state_machines.CertificationPackage
        distinguishing_aspect: "Each machine's initial_state is what creation writes: ReferenceMethod DESIGNATED, MonitoringSite PROPOSED, Monitor PENDING_APPROVAL, DataBatch RAW plus UNSUBMITTED on its second dimension, DataInvalidation APPLIED, demonstration DRAFT, assessment DRAFT, change request DRAFT and package DRAFT."
        test_recipe:
          setup:
            - "logical clock at 2026-01-05T00:00:00Z and one row of each entity created by the shortest legal path"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
