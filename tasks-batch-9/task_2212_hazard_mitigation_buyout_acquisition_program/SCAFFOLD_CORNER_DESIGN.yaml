      - name: offer_creation_cross_checks_the_source_appraisal_type_basis_and_the_deduction_total
        claim_type: cross_reference_link
        grounds:
          - validations.priority_52
          - validations.priority_62
          - validations.priority_54
          - endpoints.POST_parcels_parcel_id_purchase_offers
        distinguishing_aspect: |
          source_appraisal_id must satisfy three independent cross-references at once: the row must be
          a REVIEW appraisal in ACCEPTED (an ACCEPTED INITIAL is refused with
          ERR_REVIEW_APPRAISAL_REQUIRED), its valuation_basis must agree with the requested offer_basis
          (ERR_VALUATION_BASIS_MISMATCH), and the parcel's accumulated deduction total must not exceed
          that appraisal's indicated value (ERR_DOB_EXCEEDS_BASE_VALUE). The same REVIEW appraisal is
          therefore accepted or refused depending on state carried by two other entities, and the
          parcel version must be re-read after the DOB record because that write bumps it.
        test_recipe:
          setup:
            - "The golden path through an ACCEPTED INITIAL appraisal (PRE_EVENT, 20000000) and an ACCEPTED REVIEW appraisal on a VOLUNTARY_CONFIRMED parcel, with no offer yet."
          setup_api_calls:
