              as_user_id: "${t2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TENANT_NOT_LINKED"

      - name: buyout_complete_before_cooling_off_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=13]", "errors[ERR_COOLING_OFF_NOT_ELAPSED]"]
        distinguishing_aspect: "Completing a buyout while logical now (default 2026-05-01) < rescind_deadline returns ERR_COOLING_OFF_NOT_ELAPSED."
        test_recipe:
          setup: ["A buyout is FILED at the default clock; no clock advance."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Cool Co", email: "cool@x.com", business_license_no: "BL-3400" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Uma Roy", email: "uma@x.com", phone: "555-1400" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "16 Cool St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-04-01" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/buyouts"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", tenant_id: "${t_id}", offer_amount_cents: 5000000, relocation_amount_cents: 900000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { b_id: $.data.id }
            - call: "POST /rent-board/buyouts/${b_id}/file"
              payload: { disclosure_acknowledged: true }
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /rent-board/buyouts/${b_id}/complete"
              payload: {}
              as: RentBoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COOLING_OFF_NOT_ELAPSED"

      - name: buyout_complete_after_cooling_off_ends_tenancy
        claim_type: Side Effect Execution
        grounds: [state_machines.Buyout.FILED_to_COMPLETED, state_machines.Tenancy.ACTIVE_to_ENDED]
        distinguishing_aspect: "Completing after the deadline (clock 2026-06-05) sets Buyout COMPLETED, releases escrow to 0, and ENDS the tenant's active tenancy (COMPLETE branch side effects)."
        test_recipe:
          setup: ["A buyout (relocation 900000) is FILED at default clock; clock advanced past the 30-day deadline."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Comp Co", email: "comp@x.com", business_license_no: "BL-3500" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Ivy Lin", email: "ivy@x.com", phone: "555-1500" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "17 Comp St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-04-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ten_id: $.data.id }
            - call: "POST /rent-board/buyouts"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", tenant_id: "${t_id}", offer_amount_cents: 5000000, relocation_amount_cents: 900000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { b_id: $.data.id }
            - call: "POST /rent-board/buyouts/${b_id}/file"
              payload: { disclosure_acknowledged: true }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: RentBoardClerk
          trigger:
            - call: "POST /rent-board/buyouts/${b_id}/complete"
              payload: {}
              as: RentBoardClerk
          assert:
            - "Buyout.${b_id}.status == COMPLETED"
            - "Landlord.${l_id}.escrow_committed_cents == 0"
            - "Tenancy.${ten_id}.status == ENDED"

  # ---------------------------------------------------------------
  - section: endpoints
    instances:
      - name: registration_supersedes_prior_active
        claim_type: Standard CRUD
        grounds: [state_machines.Registration.ACTIVE_to_SUPERSEDED, endpoints]
        distinguishing_aspect: "Filing a second registration for a unit sets the first ACTIVE registration to SUPERSEDED and bumps Unit.version."
        test_recipe:
          setup: ["A unit has one ACTIVE registration (2025)."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Reg Co", email: "reg@x.com", business_license_no: "BL-3600" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "18 Reg St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id, u_v1: $.data.version }
            - call: "POST /rent-board/units/${u_id}/registrations"
              payload: { registration_year: 2025, declared_rent_cents: 300000, expected_unit_version: "${u_v1}" }
              as: RentBoardClerk
              captures: { reg1: $.data.id, u_v2: $.data.version }
          trigger:
            - call: "POST /rent-board/units/${u_id}/registrations"
              payload: { registration_year: 2026, declared_rent_cents: 309000, expected_unit_version: "${u_v2}" }
              as: RentBoardClerk
              captures: { reg2: $.data.id }
          assert:
            - "Registration.${reg1}.status == SUPERSEDED"
            - "Registration.${reg2}.status == ACTIVE"

      - name: rent_adjustment_by_non_owner_landlord_rejected
        claim_type: Conditional action
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Landlord whose X-User-ID != unit.landlord_id calling rent-adjustments returns ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["A unit owned by landlord L1; landlord L2 attempts a rent-adjustment."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Owner1", email: "own1@x.com", business_license_no: "BL-3700" }
              as: RentBoardClerk
              captures: { l1: $.data.id }
            - call: "POST /rent-board/landlords"
              payload: { name: "Owner2", email: "own2@x.com", business_license_no: "BL-3701" }
              as: RentBoardClerk
              captures: { l2: $.data.id }
            - call: "POST /rent-board/aga-determinations"
              payload: { effective_year: 2026, cpi_pct: 0.032, aga_pct: 0.03, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RentBoardClerk
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l1}", address: "19 Own St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l1}"
              captures: { u_id: $.data.id, u_v1: $.data.version }
          trigger:
            - call: "POST /rent-board/units/${u_id}/rent-adjustments"
              payload: { effective_date: "2026-06-01", proposed_new_rent_cents: 309000, apply_banked: false, expected_unit_version: "${u_v1}" }
              as: Landlord
              as_user_id: "${l2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER"

      - name: registrations_subresource_lists_children
        claim_type: Computed read
        grounds: [entities.Registration.fields.unit_id, endpoints]
        distinguishing_aspect: "GET /rent-board/units/{id}/registrations returns the unit's Registration[] (FK reverse-reachability)."
        test_recipe:
          setup: ["A unit with one registration exists."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Sub Co", email: "sub@x.com", business_license_no: "BL-3800" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "20 Sub St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id, u_v1: $.data.version }
            - call: "POST /rent-board/units/${u_id}/registrations"
              payload: { registration_year: 2026, declared_rent_cents: 300000, expected_unit_version: "${u_v1}" }
              as: RentBoardClerk
          trigger:
            - call: "GET /rent-board/units/${u_id}/registrations"
              payload: {}
              as: RentBoardClerk
          assert:
            - "response data is a Registration[] of length 1 with unit_id == ${u_id}"

  # ---------------------------------------------------------------
  - section: rbac
    instances:
      - name: missing_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without valid X-User-Role/X-User-ID returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["A landlord exists but the caller supplies no auth headers."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Auth Co", email: "auth@x.com", business_license_no: "BL-3900" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
          trigger:
            - call: "GET /rent-board/landlords/${l_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"

      - name: clerk_cannot_decide_hearing
        claim_type: role_denied
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A RentBoardClerk calling POST /hearings/{id}/decide (HearingOfficer-exclusive) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A hearing is SCHEDULED for a CAPITAL petition."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Rb Co", email: "rb@x.com", business_license_no: "BL-4000" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Amir", email: "amir@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "21 Rb St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 1200000, amortization_months: 120 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/petitions/${pet_id}/review"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
            - call: "POST /rent-board/petitions/${pet_id}/hearings"
              payload: { officer_id: "${o_id}", scheduled_start: "2026-06-15T09:00:00Z", scheduled_end: "2026-06-15T10:00:00Z" }
              as: RentBoardClerk
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /rent-board/hearings/${h_id}/decide"
              payload: { decision: "GRANT" }
              as: RentBoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: penalty_confirm_same_officer_sod_violation
        claim_type: segregation_of_duties
        grounds: ["validations[priority=10]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The ComplianceOfficer who assessed a penalty cannot confirm it: same X-User-ID -> ERR_SOD_VIOLATION."
        test_recipe:
          setup: ["A LATE_REGISTRATION penalty is ASSESSED by officer co-x."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Sod Co", email: "sod@x.com", business_license_no: "BL-4100" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "22 Sod St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/penalties"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", penalty_type: "LATE_REGISTRATION" }
              as: ComplianceOfficer
              as_user_id: "co-x"
              captures: { pen_id: $.data.id }
          trigger:
            - call: "POST /rent-board/penalties/${pen_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-x"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SOD_VIOLATION"

  # ---------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_registration_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[registration-supersede-stale-unit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Filing a registration with a stale expected_unit_version (the version before a prior registration bumped it) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A unit has one registration already filed (version advanced to 2)."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Occ2 Co", email: "occ2@x.com", business_license_no: "BL-4200" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "23 Occ St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id, u_v1: $.data.version }
            - call: "POST /rent-board/units/${u_id}/registrations"
              payload: { registration_year: 2025, declared_rent_cents: 300000, expected_unit_version: "${u_v1}" }
              as: RentBoardClerk
          trigger:
            - call: "POST /rent-board/units/${u_id}/registrations"
              payload: { registration_year: 2026, declared_rent_cents: 309000, expected_unit_version: "${u_v1}" }
              as: RentBoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (412); ${u_v1} is stale after the first registration bumped the version."

      - name: occ_rent_adjustment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rent-adjustment-supersede-stale-unit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A rent-adjustment carrying the pre-adjustment version after one adjustment already advanced Unit.version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A unit had one rent-adjustment applied (version advanced), AGA 2026=0.03 published."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Occ3 Co", email: "occ3@x.com", business_license_no: "BL-4300" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/aga-determinations"
              payload: { effective_year: 2026, cpi_pct: 0.032, aga_pct: 0.03, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RentBoardClerk
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "24 Occ St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id, u_v1: $.data.version }
            - call: "POST /rent-board/units/${u_id}/rent-adjustments"
              payload: { effective_date: "2026-06-01", proposed_new_rent_cents: 306000, apply_banked: false, expected_unit_version: "${u_v1}" }
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /rent-board/units/${u_id}/rent-adjustments"
              payload: { effective_date: "2026-07-01", proposed_new_rent_cents: 309000, apply_banked: false, expected_unit_version: "${u_v1}" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (412)"

      - name: rent_adjustment_bumps_unit_version
        claim_type: optimistic_concurrency
        grounds: [entities.Unit.fields.current_lawful_rent_cents, "concurrency_rules[rent-adjustment-supersede-stale-unit]"]
        distinguishing_aspect: "A successful rent-adjustment increments Unit.version by 1 (fresh version usable by the next writer)."
        test_recipe:
          setup: ["A unit exists; AGA 2026=0.03 published."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Ver Co", email: "ver@x.com", business_license_no: "BL-4400" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/aga-determinations"
              payload: { effective_year: 2026, cpi_pct: 0.032, aga_pct: 0.03, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RentBoardClerk
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "25 Ver St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id, u_v1: $.data.version }
