              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-VA2", name: "Thing", category: "HARDGOOD", retail_price_cents: 100 }
              as: BranchManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "WHOLESALE", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION (HTTP 400)"

      - name: price_book_inverted_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", entities.PriceBook.fields.effective_to]
        distinguishing_aspect: "effective_from >= effective_to is a shape error (ERR_VALIDATION), caught before any overlap logic."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /price-books"
              payload: { name: "Backwards", scope: "RETAIL", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z", default_discount_pct: 0.05 }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: rental_item_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_RENTAL_ITEM_MISMATCH]"]
        distinguishing_aspect: "item_type=MACHINE carrying cylinder_asset_id (and no machine_id) violates the polymorphic pairing: ERR_RENTAL_ITEM_MISMATCH."
        test_recipe:
          setup: ["CASH customer; one cylinder"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-VA3", name: "Mix Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-VA3", gas_grade: "ARGON", size: "SMALL" }
              as: BranchManager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cid}", item_type: "MACHINE", cylinder_asset_id: "${aid}", rate_plan: "DAILY", start_date: "2026-08-01" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RENTAL_ITEM_MISMATCH (HTTP 400)"

      - name: cash_fulfill_requires_prior_payment
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_PAYMENT_REQUIRED]"]
