              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { adj2_id: "$.data.id" }
          assert:
            - "AUTO_ACCEPT means each created adjustment lands accepted, so the first adjustment bumps Order.${oa_id}.version and the replayed token ${oa_v1} is now stale"
            - "The replay returns 412 with data.error_id == ERR_STALE_ORDER_VERSION, creates no Adjustment row, and leaves refunded_total_cents at 100"
            - "After re-reading the order, the same 200-cent request with the fresh token succeeds: Adjustment.${adj2_id} exists and refunded_total_cents == 300"
            - "GET /adjustments filtered by order_id ${oa_id} returns total_count 2, proving the 412 attempt persisted nothing"

