              captures: { fin1_total: $.data.total_payment_cents }
            - call: "GET /ltch/cost-reporting-periods/${period_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ledger_after_final: $.data.total_payment_cents, count_after_final: $.data.final_determination_count }
            - call: "POST /ltch/payment-determinations/${det1_id}/void"
              payload: { void_reason: "AUDIT_CORRECTION" }
              as: RevenueIntegrityAnalyst
              as_user_id: analyst-c
            - call: "GET /ltch/cost-reporting-periods/${period_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ledger_after_void: $.data.total_payment_cents, count_after_void: $.data.final_determination_count }
            - call: "GET /ltch/stays/${stay150_id}"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { stay150_v2: $.data.version, stay150_status_after_void: $.data.payment_review_status }
            - call: "POST /ltch/stays/${stay150_id}/payment-determinations"
              payload: { expected_stay_version: "${stay150_v2}", recalculation_reason: "Re-price after audit correction" }
              as: RevenueIntegrityAnalyst
              as_user_id: analyst-a
              captures: { det2_id: $.data.id, det2_total: $.data.total_payment_cents }
            - call: "POST /ltch/payment-determinations/${det2_id}/finalize"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: analyst-b
            - call: "GET /ltch/cost-reporting-periods/${period_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ledger_final: $.data.total_payment_cents, count_final: $.data.final_determination_count }
            - call: "POST /ltch/cost-reporting-periods/${period_id}/close"
              payload: {}
              as: ComplianceOfficer
              captures: { period_status: $.data.status, period_closed_at: $.data.closed_at }
          assert:
            - "stay150_los == 14, det1_total == 1512000 and rev150_band == MODERATE"
            - "fin1_total == 1512000, ledger_after_final == 1512000 and count_after_final == 1"
            - "ledger_after_void == 0 and count_after_void == 0 - the void subtracts exactly what the finalize added"
            - "stay150_status_after_void == PENDING and Stay.${stay150_id}.discharge_payment_pct == null"
            - "PaymentDetermination.${det1_id}.status == VOIDED with void_reason AUDIT_CORRECTION"
            - "det2_total == 1512000 and det2_id != det1_id - the re-price reproduces the same figure from the same inputs"
            - "ledger_final == 1512000 and count_final == 1 - NOT 3024000 and NOT 2"
            - "DenialRiskReview.${rev150_id}.status == CLEARED throughout - the void does not reopen the review, so the second finalize passes priority 22"
            - "period_status == CLOSED and period_closed_at == 2026-08-15T00:00:00.000Z - the close proves the incremental ledger equals the full recompute (priority 28 did not fire)"
            - "A void attempted as analyst-b instead of analyst-c returns HTTP 422 ERR_SEGREGATION_OF_DUTIES and leaves ledger_after_final untouched"

      - name: recombination_restores_the_admission_count_and_referral_share_invariant
        grounds:
          - endpoints.POST_ltch_stays_id_recombine.side_effects
          - calculations.referral_source_share
          - endpoints.POST_ltch_cost_reporting_periods_id_recompute_referral_shares.side_effects
          - entities.ReferringHospital.fields.admissions_in_period
          - entities.CostReportingPeriod.fields.total_admissions
        distinguishing_aspect: |
          A different invariant on a different pair of counters: sum(ReferringHospital.admissions_in_period)
          must always equal CostReportingPeriod.total_admissions, and recombination is the only operation
          that DECREMENTS both. The compensation is verified against a full recompute of the 25-percent
          shares, and because the count falls from 4 back to 3 it also un-crosses the
          MIN_ADMISSIONS_FOR_MONITORING guard - a BREACHED hospital must revert to COMPLIANT, not stay
          latched.
        test_recipe:
          setup:
            - "OPEN period AUG2026 (2026-08-01..2026-08-31), ACTIVE criteria set CS-2026A, DRG 207 loaded."
            - "Two referral sources: Metro General and Suburban Health. Three patients are admitted at the default clock 2026-08-01T00:00:00Z - Quinn via Metro, Rex and Sara via Suburban - so total_admissions is 3 and, being below MIN_ADMISSIONS_FOR_MONITORING (4), every hospital is COMPLIANT even though Suburban already holds 66.67 percent."
          setup_api_calls:
