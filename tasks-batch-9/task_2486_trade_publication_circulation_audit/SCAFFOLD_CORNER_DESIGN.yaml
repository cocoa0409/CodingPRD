scaffold_corner_design:

  # =====================================================================
  # Section 1 — Entities (§1.1): creation, retrieval, listing, not-found,
  # required fields, defaults, computed/system fields, type constraints,
  # immutability, parent relationships. Topology is `flat`, so FK body
  # fields carry the integrity claims (see the validations section).
  # =====================================================================
  - section: entities
    instances:
      - name: create_publication_with_explicit_thresholds_returns_all_fields
        claim_type: creation
        grounds:
          - entities.Publication
          - endpoints[POST /circulation/publications]
        distinguishing_aspect: "Every supplied threshold is echoed verbatim and every derived ledger field starts at zero with audit_posture OPEN — no field silently defaults over a supplied value."
        test_recipe:
          setup:
            - "empty database, logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /circulation/publications"
              payload: { name: "Precision Metals Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING", qualification_validity_months: 24, renewal_grace_days: 60, source_doc_retention_months: 48, undeliverable_restrict_pct: 7.50, materiality_pct: 3.00, controlled_cap_pct: 20.00 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id, pub_ver: $.data.version }
          assert:
            - "HTTP 201 and ${pub_ver} == 1"
            - "Publication.${pub_id}.qualification_validity_months == 24, renewal_grace_days == 60, source_doc_retention_months == 48"
            - "Publication.${pub_id}.undeliverable_restrict_pct == 7.50, materiality_pct == 3.00, controlled_cap_pct == 20.00"
            - "Publication.${pub_id}.audit_posture == OPEN"
            - "Publication.${pub_id}.copies_on_file_total == 0, paid_copies_on_file == 0, qualified_non_paid_copies_on_file == 0, controlled_copies_on_file == 0"
            - "Publication.${pub_id}.deliverable_copies == 0, undeliverable_copies == 0, removed_copies == 0, undeliverable_pct == 0.00"
            - "Publication.${pub_id}.open_material_findings_count == 0 and open_critical_findings_count == 0"
            - "the response body carries meta.api_request_id, meta.api_request_timestamp, response_type == object and data"

      - name: publication_defaults_applied_when_optional_thresholds_omitted
        claim_type: defaults
        grounds:
          - entities.Publication.fields.qualification_validity_months
          - entities.Publication.fields.undeliverable_restrict_pct
          - entities.Publication.fields.controlled_cap_pct
        distinguishing_aspect: "Omitting all six optional threshold inputs yields the declared defaults 36 / 90 / 36 / 5.00 / 2.00 / 25.00 — the same fields the previous instance overrode, so a hardcoded default cannot satisfy both."
        test_recipe:
          setup:
            - "empty database, logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /circulation/publications"
              payload: { name: "Default Config Weekly", frequency: "WEEKLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id, validity: $.data.qualification_validity_months, restrict: $.data.undeliverable_restrict_pct }
          assert:
            - "${validity} == 36 and ${restrict} == 5.00"
            - "Publication.${pub_id}.renewal_grace_days == 90 and source_doc_retention_months == 36"
            - "Publication.${pub_id}.materiality_pct == 2.00 and controlled_cap_pct == 25.00"

      - name: get_publication_returns_stored_threshold_configuration
        claim_type: retrieval
        grounds:
          - endpoints[GET /circulation/publications/{id}]
          - entities.Publication
        distinguishing_aspect: "A read-back after a mutating write (one subscriber added) returns the stored row including the recomputed ledger, proving the GET is not serving the create-time snapshot."
        test_recipe:
          setup:
            - "one publication with default thresholds and one 400-copy PAID recipient"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Readback Review", frequency: "MONTHLY", industry_code: "UTILITIES" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Kilo Utilities", contact_email: "k@kilo.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "APPROVES", subscription_class: "PAID", copies: 400, paid_amount_cents: 8000 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_k_id: $.data.id }
          trigger:
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { total: $.data.copies_on_file_total, paid: $.data.paid_copies_on_file, ver: $.data.version }
          assert:
            - "HTTP 200 with ${total} == 400 and ${paid} == 400"
            - "${ver} == 2 — the publication row was bumped once by the subscriber-driven ledger sync"
            - "Publication.${pub_id}.deliverable_copies == 400 and undeliverable_pct == 0.00"
            - "Subscriber.${sub_k_id}.delivery_status == DELIVERABLE"

      - name: list_subscribers_filtered_by_publication_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /circulation/subscribers]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The filter must scope by publication_id AND the envelope must report total_count over the filtered set (2), not the global set (3), with has_more true at limit=1."
        test_recipe:
          setup:
            - "publication PA with two recipients and publication PB with one recipient"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Filter Target Journal", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pa_id: $.data.id }
            - call: "POST /circulation/publications"
              payload: { name: "Other Journal", frequency: "MONTHLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pb_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pa_id}", company_name: "Lima Fabrication", contact_email: "l@lima.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "PAID", copies: 100, paid_amount_cents: 2000 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_l_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pa_id}", company_name: "Mike Tooling", contact_email: "m@mike.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "SPECIFIES", subscription_class: "CONTROLLED", copies: 50 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_m_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pb_id}", company_name: "November Freight", contact_email: "n@nov.test", job_function_code: "FLEET_MGMT", industry_code: "LOGISTICS", purchasing_authority_level: "RECOMMENDS", subscription_class: "CONTROLLED", copies: 25 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_n_id: $.data.id }
          trigger:
            - call: "GET /circulation/subscribers?publication_id=${pa_id}&limit=1&offset=0"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { first_id: "$.data[0].id" }
            - call: "GET /circulation/subscribers?publication_id=${pa_id}&subscription_class=CONTROLLED&limit=10&offset=0"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { controlled_id: "$.data[0].id" }
          assert:
            - "the first response has response_type == array, exactly 1 element, total_count == 2 and has_more == true"
            - "${first_id} is one of ${sub_l_id} or ${sub_m_id} and is never ${sub_n_id} — publication PB is excluded by the filter"
            - "the second response has exactly 1 element with ${controlled_id} == ${sub_m_id}, total_count == 1 and has_more == false"
            - "an omitted limit yields the declared default page size 10 and offset 0"

      - name: get_subscriber_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=11]
          - errors[ERR_SUBSCRIBER_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid UUID that matches no row yields the entity-scoped 404 ERR_SUBSCRIBER_NOT_FOUND, not a generic 404 and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /circulation/subscribers/2f8c1a44-6d0e-4c3a-9b77-5a1e0c9d3e21"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ${err} == ERR_SUBSCRIBER_NOT_FOUND"
            - "the body is the error envelope: response_type == error with data.error_id and data.message"

      - name: create_subscriber_missing_copies_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=21]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "`copies` has no default, so omitting it is a 400 ERR_INVALID_REQUEST at priority 21 — it must not be silently coerced to 0, which would corrupt the publication copies ledger."
        test_recipe:
          setup:
            - "one publication with default thresholds"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Required Field Journal", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Oscar Machining", contact_email: "o@oscar.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with ${err} == ERR_INVALID_REQUEST"
            - "no Subscriber row was created and Publication.${pub_id}.copies_on_file_total is still 0"
            - "the same call with copies: 0 is also rejected — the declared minimum is copies >= 1"

      - name: create_subscriber_with_unknown_subscription_class_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=22]
          - errors[ERR_INVALID_ENUM_VALUE]
          - entities.Subscriber.fields.subscription_class
        distinguishing_aspect: "An out-of-set enum yields 422 ERR_INVALID_ENUM_VALUE at priority 22, distinct from the missing-field 400 at priority 21 — enum membership is checked even though the key is present."
        test_recipe:
          setup:
            - "one publication with default thresholds"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Enum Guard Journal", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Papa Castings", contact_email: "p@papa.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "COMPLIMENTARY", copies: 60 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with ${err} == ERR_INVALID_ENUM_VALUE"
            - "no Subscriber row was created"
            - "purchasing_authority_level: SOMETIMES and subscription_class: paid (wrong case) are rejected identically"

      - name: subscriber_system_fields_minted_on_create
        claim_type: system_fields
        grounds:
          - entities.Subscriber
          - complexity_profile.complexity_layers
        distinguishing_aspect: "id / created_at / updated_at / version are server-minted: id is a bare UUID with no type prefix, version starts at 1, and updated_at advances on the next mutation while created_at does not."
        test_recipe:
          setup:
            - "one publication and one 80-copy CONTROLLED recipient"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "System Field Journal", frequency: "MONTHLY", industry_code: "UTILITIES" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Quebec Power", contact_email: "q@quebec.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "SPECIFIES", subscription_class: "CONTROLLED", copies: 80 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_q_id: $.data.id, created: $.data.created_at, ver_1: $.data.version }
          trigger:
            - call: "POST /circulation/subscribers/${sub_q_id}/undeliverable-events"
              payload: { reason_code: "ADDRESS_UNKNOWN" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { ver_2: $.data.version, updated: $.data.updated_at }
          assert:
            - "${ver_1} == 1 and ${ver_2} == 2"
            - "${sub_q_id} is a bare 36-character UUID with no `sub_` or other type prefix"
            - "${created} is ISO-8601 UTC with three fractional digits and is unchanged after the trigger"
            - "${updated} is at or after ${created} and changed as a result of the trigger"

      - name: source_document_immutability_has_no_update_endpoint_or_version
        claim_type: immutability
        grounds:
          - entities.SourceDocument
          - endpoints[POST /circulation/subscribers/{id}/source-documents]
        distinguishing_aspect: "SourceDocument is the audit evidence record: it carries only id and created_at (no version), §1.5 exposes no update path for it, and the only post-creation mutation permitted is the purge status flip."
        test_recipe:
          setup:
            - "one publication with source_doc_retention_months 36, one recipient and one source document captured 2026-07-15"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Evidence Retention Journal", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Romeo Welding", contact_email: "r@romeo.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 40 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_r_id: $.data.id }
            - call: "POST /circulation/subscribers/${sub_r_id}/source-documents"
              payload: { doc_type: "WEB_FORM_CAPTURE", captured_at: "2026-07-15T00:00:00Z", storage_ref: "s3://circ/r-web" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_r_id: $.data.id, retention: $.data.retention_expires_at }
          trigger:
            - call: "GET /circulation/subscribers/${sub_r_id}/source-documents?purge_status=RETAINED&limit=10&offset=0"
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "${listed_id} == ${doc_r_id} with purge_status RETAINED"
            - "${retention} == 2029-07-15T00:00:00Z (captured_at plus source_doc_retention_months 36)"
            - "the returned object has id and created_at but no version and no updated_at field"
            - "§1.5 declares no PUT/PATCH/DELETE for source documents — only POST /circulation/source-documents/{id}/purge"

      - name: create_qualification_rule_under_unknown_publication_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=10]
          - errors[ERR_PUBLICATION_NOT_FOUND]
          - entities.QualificationRule.parent
        distinguishing_aspect: "QualificationRule is reachable only through its owner's nested path, so a bad parent id in the path is a 404 on the PARENT entity (priority 10) — it never surfaces as a rule-level error."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /circulation/publications/9c1f6b02-8e4d-4a17-b0c5-77aa31e4d908/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ${err} == ERR_PUBLICATION_NOT_FOUND"
            - "no QualificationRule row was created"

      - name: publication_ledger_computed_fields_after_reclassify_and_undeliverable_event
        claim_type: computed_fields
        grounds:
          - calculations.publication_copies_ledger
          - entities.Publication.fields.undeliverable_pct
          - entities.Subscriber.fields.qualification_score
        distinguishing_aspect: "Both derived axes are recomputed by the server from the recipient population; a client-supplied value is impossible because none of these fields appear in any §1.5 `input:` list."
        test_recipe:
          setup:
            - "one publication with two recipients: 300 copies QUALIFIED_NON_PAID and 100 copies CONTROLLED"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Derived Field Journal", frequency: "MONTHLY", industry_code: "UTILITIES" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Sierra Turbines", contact_email: "s@sierra.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "APPROVES", subscription_class: "QUALIFIED_NON_PAID", copies: 300 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_s_id: $.data.id, s_score: $.data.qualification_score }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Tango Boilers", contact_email: "t@tango.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "RECOMMENDS", subscription_class: "CONTROLLED", copies: 100 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_t_id: $.data.id }
          trigger:
            - call: "POST /circulation/subscribers/${sub_t_id}/undeliverable-events"
              payload: { reason_code: "RETURNED_MAIL" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { t_delivery: $.data.delivery_status, t_count: $.data.undeliverable_count }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { total: $.data.copies_on_file_total, qnp: $.data.qualified_non_paid_copies_on_file, deliverable: $.data.deliverable_copies, undeliverable: $.data.undeliverable_copies, pct: $.data.undeliverable_pct }
          assert:
            - "${s_score} == 0 on creation — qualification_score is only written by request verification, never by subscriber create"
            - "${t_delivery} == UNDELIVERABLE and ${t_count} == 1"
            - "${total} == 400, ${qnp} == 300 and controlled_copies_on_file == 100"
            - "${deliverable} == 300, ${undeliverable} == 100 and ${pct} == 25.00 (100 of 400, two decimals, half-up)"
            - "Publication.${pub_id}.audit_posture == RESTRICTED because 25.00 >= undeliverable_restrict_pct 5.00"

  # =====================================================================
  # Section 2 — State Machines (§1.2). Shape is `cyclic` with one entity
  # (Subscriber) carrying two independent dimensions; the side-effect
  # patterns (cascade down, ledger sync, compensation, conditional
  # cascade) are the §1.8 depth probes and are stubbed here.
  # =====================================================================
  - section: state_machines
    instances:
      - name: new_statement_starts_in_draft_with_null_certification_fields
        claim_type: initial_state
        grounds:
          - state_machines.CirculationStatement
          - entities.CirculationStatement.fields.status
        distinguishing_aspect: "A freshly created statement is DRAFT with filed_at and certified_by_user_id null and prepared_by_user_id set to the creating X-User-ID — the breakdown is computed at creation but the statement is not yet a published claim."
        test_recipe:
          setup:
            - "one publication with a single 500-copy CONTROLLED recipient, clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Initial State Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id, pub_ver: $.data.version }
          trigger:
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_id: $.data.id, st_status: $.data.status, st_basis: $.data.basis, st_type: $.data.statement_type }
          assert:
            - "HTTP 201 with ${st_status} == DRAFT"
            - "${st_basis} == AS_OF_PERIOD_END — the declared default when basis is omitted"
            - "${st_type} == PUBLISHER_STATEMENT — statement_type is computed from basis, never supplied"
            - "CirculationStatement.${st_id}.filed_at is null, certified_by_user_id is null and guarantees_settled_at is null"
            - "CirculationStatement.${st_id}.prepared_by_user_id == mgr-01 and breakdown_stale == false"
            - "CirculationStatement.${st_id}.total_qualified_copies == 0 — the publication has no qualified recipients yet"

      - name: verify_request_from_submitted_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=31]
          - state_machines.QualificationRequest.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_REQUEST_NOT_UNDER_REVIEW]
        distinguishing_aspect: "verify is declared only from UNDER_REVIEW, so a SUBMITTED request is rejected at priority 31 — before the rule-completeness (68) and score (70) checks, which would also have failed here."
        test_recipe:
          setup:
            - "publication with NO qualification rules defined, one recipient and one SUBMITTED qualification request"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Review Gate Journal", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Uniform Presses", contact_email: "u@uniform.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 70 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_u_id: $.data.id, sub_u_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_u_id}/source-documents"
              payload: { doc_type: "SIGNED_REQUEST_CARD", captured_at: "2026-07-10T00:00:00Z", storage_ref: "s3://circ/u-card" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_u_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_u_id}", source_document_id: "${doc_u_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-01T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_u_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_u_id: $.data.id, req_u_status: $.data.status }
          trigger:
            - call: "POST /circulation/qualification-requests/${req_u_id}/verify"
              payload: { decision_reason: "skipping review" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { err: $.data.error_id }
          assert:
            - "${req_u_status} == SUBMITTED on creation"
            - "HTTP 409 with ${err} == ERR_REQUEST_NOT_UNDER_REVIEW (priority 31 beats ERR_QUALIFICATION_RULES_INCOMPLETE at 68)"
            - "QualificationRequest.${req_u_id}.status is still SUBMITTED with decided_at null and computed_score 0"
            - "Subscriber.${sub_u_id}.qualification_status is still PENDING_QUALIFICATION"

      - name: resubmit_rejected_request_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - validations[priority=33]
          - state_machines.QualificationRequest.terminal_states
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "REJECTED is terminal for QualificationRequest: the cyclic INFO_REQUESTED -> SUBMITTED loop is unavailable once a decision is recorded, so resubmit is refused at priority 33 rather than reopening the request."
        test_recipe:
          setup:
            - "publication with one recipient whose qualification request has been reviewed and then rejected outright"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Terminal Lock Journal", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Victor Grinding", contact_email: "v@victor.test", job_function_code: "SALES", industry_code: "RETAIL", purchasing_authority_level: "NONE", subscription_class: "CONTROLLED", copies: 20 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_v_id: $.data.id, sub_v_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_v_id}/source-documents"
              payload: { doc_type: "TELEPHONE_SCRIPT_LOG", captured_at: "2026-07-05T00:00:00Z", storage_ref: "s3://circ/v-log" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_v_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_v_id}", source_document_id: "${doc_v_id}", request_channel: "TELEPHONE", signed_at: "2026-07-05T00:00:00Z", attested_job_function_code: "SALES", attested_industry_code: "RETAIL", attested_purchasing_authority: "NONE", expected_subscriber_version: "${sub_v_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_v_id: $.data.id }
            - call: "POST /circulation/qualification-requests/${req_v_id}/review"
              payload: { review_note: "out of franchise" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/qualification-requests/${req_v_id}/reject"
              payload: { decision_reason: "job function and industry both outside the qualified definition" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { v_status: $.data.status, v_decided: $.data.decided_at }
          trigger:
            - call: "POST /circulation/qualification-requests/${req_v_id}/resubmit"
              payload: { attested_purchasing_authority: "APPROVES" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { err: $.data.error_id }
          assert:
            - "${v_status} == REJECTED and ${v_decided} == 2026-08-01T00:00:00Z (the default logical clock)"
            - "HTTP 409 with ${err} == ERR_ALREADY_TERMINAL"
            - "QualificationRequest.${req_v_id}.attested_purchasing_authority is still NONE — the rejected payload is not partially applied"
            - "Subscriber.${sub_v_id}.qualification_status == UNQUALIFIED"

      - name: finding_response_rejection_reopens_then_resolves_on_second_response
        claim_type: cyclic
        grounds:
          - state_machines.AuditFinding.RESPONSE_SUBMITTED_to_REJECTED_REOPENED
          - state_machines.AuditFinding.REJECTED_REOPENED_to_RESPONSE_SUBMITTED
          - state_machines.CirculationStatement.FINDINGS_OPEN_to_UNDER_AUDIT
          - entities.AuditFinding.fields.response_count
        distinguishing_aspect: "The finding loop is traversed twice and the parent statement follows it: FILED -> UNDER_AUDIT on engagement creation, -> FINDINGS_OPEN on finding creation, and back to UNDER_AUDIT only when the last live finding reaches ACCEPTED_RESOLVED, with response_count 2 recording the loop."
        test_recipe:
          setup:
            - "publication with one 500-copy CONTROLLED recipient and a FILED statement for [2026-05-01, 2026-08-01)"
            - "an audit engagement with sample_size 2 (so it stays in fieldwork) and one MATERIAL finding for 100 copies raised by aud-01"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Finding Loop Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Whiskey Alloys", contact_email: "w@whiskey.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 500 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_w_id: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_id: $.data.id }
            - call: "POST /circulation/statements/${st_id}/certify"
              payload: { certification_note: "filed for audit" }
              as: PublisherExecutive
              as_user_id: "exec-01"
            - call: "POST /circulation/audit-engagements"
              payload: { statement_id: "${st_id}", auditor_org: "Verified Audit Bureau", fieldwork_start: "2026-08-05T00:00:00Z", fieldwork_end: "2026-08-09T00:00:00Z", sample_size: 2 }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { eng_id: $.data.id, eng_status: $.data.status }
            - call: "GET /circulation/statements/${st_id}"
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { st_status_under_audit: $.data.status }
            - call: "POST /circulation/audit-findings"
              payload: { engagement_id: "${eng_id}", subscriber_id: "${sub_w_id}", finding_type: "MISSING_SOURCE_DOCUMENT", severity: "MATERIAL", affected_copies: 100 }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { find_id: $.data.id, find_status: $.data.status }
            - call: "POST /circulation/audit-findings/${find_id}/respond"
              payload: { response_note: "card located in the archive, scan attached" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { resp1_status: $.data.status, resp1_count: $.data.response_count }
          trigger:
            - call: "POST /circulation/audit-findings/${find_id}/reject-response"
              payload: { rejection_note: "scan is undated and unsigned" }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { reopened: $.data.status }
            - call: "POST /circulation/audit-findings/${find_id}/respond"
              payload: { response_note: "signed and dated card re-scanned" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { resp2_status: $.data.status, resp2_count: $.data.response_count }
            - call: "POST /circulation/audit-findings/${find_id}/accept-resolution"
              payload: { resolution_note: "evidence accepted" }
              as: CirculationAuditor
              as_user_id: "aud-02"
              captures: { final_status: $.data.status, resolved: $.data.resolved_at }
          assert:
            - "${eng_status} == SCHEDULED and ${st_status_under_audit} == UNDER_AUDIT"
            - "${find_status} == OPEN and the statement moved to FINDINGS_OPEN as a side effect of the finding creation"
            - "${resp1_status} == RESPONSE_SUBMITTED with ${resp1_count} == 1"
            - "${reopened} == REJECTED_REOPENED — the second lap of the cycle"
            - "${resp2_status} == RESPONSE_SUBMITTED with ${resp2_count} == 2"
            - "${final_status} == ACCEPTED_RESOLVED and ${resolved} == 2026-08-01T00:00:00Z"
            - "CirculationStatement.${st_id}.status == UNDER_AUDIT again — no live findings remain"
            - "Publication.${pub_id}.open_material_findings_count == 0 and audit_posture == OPEN"
            - "AuditEngagement.${eng_id}.status is still SCHEDULED with open_findings_count 0"

      - name: create_engagement_on_draft_statement_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=32]
          - state_machines.CirculationStatement.FILED_to_UNDER_AUDIT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An audit engagement may only attach to a statement the publisher has actually filed; a DRAFT statement is refused at priority 32 with ERR_INVALID_STATE, and no statement side effect fires."
        test_recipe:
          setup:
            - "one publication and one DRAFT statement for [2026-05-01, 2026-08-01)"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Draft Guard Monthly", frequency: "MONTHLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id, pub_ver: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /circulation/audit-engagements"
              payload: { statement_id: "${st_id}", auditor_org: "Verified Audit Bureau", fieldwork_start: "2026-08-05T00:00:00Z", fieldwork_end: "2026-08-09T00:00:00Z", sample_size: 1 }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with ${err} == ERR_INVALID_STATE"
            - "no AuditEngagement row was created and CirculationStatement.${st_id}.status is still DRAFT"

      - name: reject_uncertified_digital_snapshot_moves_to_rejected
        claim_type: valid_transition
        grounds:
          - state_machines.DigitalAudienceSnapshot.RECORDED_to_REJECTED
          - entities.DigitalAudienceSnapshot.fields.validated_by_user_id
        distinguishing_aspect: "REJECT is reachable from RECORDED for ANY source, unlike VALIDATE which is guarded on THIRD_PARTY_CERTIFIED — so an internal-analytics snapshot can be closed out but never promoted."
        test_recipe:
          setup:
            - "one publication and one RECORDED snapshot from INTERNAL_ANALYTICS over [2026-06-01, 2026-07-01)"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Digital Audience Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/digital-snapshots"
              payload: { window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", website_unique_visitors: 20000, newsletter_sends: 30000, newsletter_unique_opens: 9000, overlap_pct: 10.00, source: "INTERNAL_ANALYTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { snap_id: $.data.id, snap_status: $.data.status, gross: $.data.combined_reach_gross, dedup: $.data.combined_reach_deduplicated }
          trigger:
            - call: "POST /circulation/digital-snapshots/${snap_id}/validate"
              payload: { decision: "REJECT" }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { final_status: $.data.status, validator: $.data.validated_by_user_id }
          assert:
            - "${snap_status} == RECORDED on creation"
            - "${gross} == 29000 and ${dedup} == 28100 (20000 + round_half_up(9000 * 90 / 100) == 20000 + 8100)"
            - "HTTP 200 with ${final_status} == REJECTED and ${validator} == aud-01"
            - "no CirculationStatement.digital_reach_verified is set from a REJECTED snapshot"

      - name: subscriber_delivery_and_qualification_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Subscriber.delivery_status
          - state_machines.Subscriber.qualification_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / subscriber_parallel_delivery_and_qualification_dimensions
          rationale: "The named §1.8 instance drives both dimensions on one row through two hygiene sweeps and asserts each independently."

      - name: issue_report_cascade_down_to_contract_and_obligation
        claim_type: cascade_down
        grounds:
          - state_machines.CirculationStatement.UNDER_AUDIT_to_RESTATEMENT_REQUIRED
          - state_machines.MakeGoodObligation.OFFERED_to_VOID
        excluded_because:
          difficulty_instance: transitive_cascade / issue_report_five_hop_restatement_cascade
          rationale: "The named §1.8 instance verifies all five hops of that cascade end-to-end, including the obligation's closed_reason."

      - name: hygiene_run_conditional_cascade_on_posture_and_staleness
        claim_type: conditional_cascade
        grounds:
          - state_machines.Subscriber.DELIVERABLE_to_REMOVED
          - calculations.publication_audit_posture
        excluded_because:
          difficulty_instance: transitive_cascade / hygiene_sweep_three_hop_posture_staleness_cascade
          rationale: "The named §1.8 instance asserts the posture hop and the statement-invalidation hop that only fire when the sweep actually removes copies."

      - name: makegood_waiver_compensation_leaves_no_ledger_drift
        claim_type: compensation
        grounds:
          - state_machines.MakeGoodObligation.OFFERED_to_WAIVED
          - calculations.contract_makegood_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / makegood_waiver_preserves_credit_pool_conservation
          rationale: "The named §1.8 instance asserts the three buckets and the pool identity before and after the waiver."

      - name: qualification_request_info_loop_returns_request_to_under_review
        claim_type: idempotency
        grounds:
          - state_machines.QualificationRequest.INFO_REQUESTED_to_SUBMITTED
          - entities.QualificationRequest.fields.info_request_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / request_info_cycle_third_round_rejected
          rationale: "The named §1.8 instance walks two full info laps and asserts the third is refused, which subsumes the single-lap traversal and the repeat-trigger rejection."

  # =====================================================================
  # Section 3 — Calculations (§1.3). Nine rules; the dual-variant, tiered
  # make-good, waterfall cap and digital-dedup probes are §1.8 depth
  # instances and are stubbed. What remains here is component-level
  # scoring, input-set filtering, threshold constants and clause order.
  # =====================================================================
  - section: calculations
    instances:
      - name: qualification_score_channel_bonus_with_partial_criteria_match
        claim_type: weighted_scoring
        grounds:
          - calculations.qualification_score
          - entities.QualificationRequest.fields.computed_score
          - entities.QualificationRule.fields.points
        distinguishing_aspect: "A partial criteria match isolates the channel bonus: base 45 + 0 + 25 == 70 plus the WEB bonus 5 == 75, so the score is neither the 100 of a full match nor the bare 70 base, and the non-matching INDUSTRY dimension contributes exactly zero rather than being skipped."
        test_recipe:
          setup:
            - "publication with all three rules: JOB_FUNCTION 45 mandatory [ENGINEERING_MGMT], INDUSTRY 30 [MANUFACTURING], PURCHASING_AUTHORITY 25 [APPROVES]"
            - "a recipient in RETAIL (outside the INDUSTRY rule) who attests ENGINEERING_MGMT and APPROVES, signed 2026-07-20 through the WEB channel"
            - "clock at the default 2026-08-01T00:00:00Z, so the signature is 0 months old"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Scoring Component Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING"], points: 30, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "PURCHASING_AUTHORITY", allowed_values: ["APPROVES"], points: 25, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Xray Retail Group", contact_email: "x@xray.test", job_function_code: "ENGINEERING_MGMT", industry_code: "RETAIL", purchasing_authority_level: "APPROVES", subscription_class: "QUALIFIED_NON_PAID", copies: 150 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_x_id: $.data.id, sub_x_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_x_id}/source-documents"
              payload: { doc_type: "WEB_FORM_CAPTURE", captured_at: "2026-07-20T00:00:00Z", storage_ref: "s3://circ/x-web" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_x_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_x_id}", source_document_id: "${doc_x_id}", request_channel: "WEB", signed_at: "2026-07-20T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "RETAIL", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_x_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_x_id: $.data.id }
            - call: "POST /circulation/qualification-requests/${req_x_id}/review"
              payload: { review_note: "partial criteria match" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { score_at_review: $.data.computed_score }
          trigger:
            - call: "POST /circulation/qualification-requests/${req_x_id}/verify"
              payload: { decision_reason: "qualifies on job function and purchasing authority" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_status: $.data.status, final_score: $.data.computed_score }
          assert:
            - "${score_at_review} == 75 and ${final_score} == 75 (45 + 0 + 25 base, WEB bonus 5, staleness penalty 0)"
            - "${req_status} == VERIFIED — 75 clears the threshold 70 and the mandatory JOB_FUNCTION value is allowed"
            - "Subscriber.${sub_x_id}.qualification_score == 75 and qualification_status == QUALIFIED"
            - "Subscriber.${sub_x_id}.qualified_at == 2026-08-01T00:00:00Z and qualification_expires_at == 2029-08-01T00:00:00Z"
            - "a DIRECT_MAIL request with the identical attestations would score 80 — the bonus is channel-specific, not a flat constant"

      - name: breakdown_counts_only_qualified_recipients_inside_the_period
        claim_type: input_set_filtering
        grounds:
          - calculations.statement_circulation_breakdown
          - entities.Subscriber.fields.qualification_status
