            - call: "POST /warranty/policies/${p1}/premium-invoice"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/policies/${p1}/premium-payments"
              payload: {}
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/policies/${p1}/activation"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/claims"
              payload: { policy_id: "${p1}", coverage_type: "WORKMANSHIP", defect_category: "STRUCTURAL_CRACKING", damage_description: "Hairline cracking at the garage return wall", claimed_amount_cents: 400000 }
              as: Homeowner
              as_user_id: "${h1}"
