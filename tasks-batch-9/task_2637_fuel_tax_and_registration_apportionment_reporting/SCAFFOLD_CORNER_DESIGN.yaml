  # SECTION 6 — ERRORS (claim-extraction-guide Table 6: every catalogued
  # error must be reachable by at least one test)
  # =====================================================================
  - section: errors
    instances:

      - name: the_error_envelope_carries_the_same_meta_block_as_a_success
        claim_type: error_envelope
        grounds:
          - response_envelope.error
          - errors[ERR_VEHICLE_NOT_FOUND]
          - validations[4].ERR_VEHICLE_NOT_FOUND
        distinguishing_aspect: "An error response is the standard envelope with response_type 'error' and a data object holding error_id plus a human message, and it still carries meta.api_request_id and meta.api_request_timestamp — it is not a bare {detail: ...} body."
        test_recipe:
          setup:
            - "One carrier exists; no vehicle with the probed id exists."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "GET /apportionment/vehicles/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { err_id: "$.data.error_id", err_msg: "$.data.message" }
          assert:
            - "HTTP 404; body.response_type == 'error'; body.data.error_id == 'ERR_VEHICLE_NOT_FOUND'"
            - "body.data.message is a non-empty string and the response contains no stack trace or framework detail key"
            - "body.meta.api_request_id and body.meta.api_request_timestamp are both present"
            - "GET /apportionment/carriers/${c1_id} still returns 200 — the failed read had no side effect"

