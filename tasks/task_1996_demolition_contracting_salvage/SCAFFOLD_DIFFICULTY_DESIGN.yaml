  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_state_beats_safety
        grounds:
          - "validations[priority=5]"
          - "validations[priority=8]"
        distinguishing_aspect: |
          Pair (state, business_safety): release attempted while project is
          SURVEY_PHASE (state violation) AND an abatement order is IDENTIFIED
          (safety violation) — priority 5 ERR_INVALID_STATE must win over
          priority 8 ERR_HAZMAT_UNRESOLVED.
        test_recipe:
          setup:
            - "Project SURVEY_PHASE: one survey IN_PROGRESS with one IDENTIFIED abatement order."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Prio 1", address: "31 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/abatements", payload: { material_type: "ASBESTOS", description: "pipe wrap", containment_method: "wet removal" }, as: Surveyor }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (state priority 5 beats business_safety priority 8, even though hazmat is unresolved)"

      - name: release_safety_beats_temporal
        grounds:
          - "validations[priority=8]"
          - "validations[priority=9]"
        distinguishing_aspect: |
          Pair (business_safety, business_temporal): project correctly in
          PRECONDITIONS_PENDING, but an abatement is still IDENTIFIED (safety)
          AND zero notifications exist (temporal) — priority 8
          ERR_HAZMAT_UNRESOLVED must win over priority 9
          ERR_NOTIFICATIONS_INCOMPLETE. Different category pair than
          release_state_beats_safety.
        test_recipe:
          setup:
            - "Project PRECONDITIONS_PENDING: survey COMPLETE with hazmat_found=true; abatement IDENTIFIED (never started); no notifications, utilities, permit, or engineering survey."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Prio 2", address: "33 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: true, findings_summary: "asbestos found" }, as: Surveyor }
            - { call: "POST /demolition/structure-surveys/${sv_id}/abatements", payload: { material_type: "ASBESTOS", description: "pipe wrap", containment_method: "wet removal" }, as: Surveyor }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_HAZMAT_UNRESOLVED (business_safety priority 8 beats business_temporal priority 9)"
            - "Project.${p_id}.status remains PRECONDITIONS_PENDING"

      - name: final_pass_referential_beats_fiscal
        grounds:
          - "validations[priority=10]"
          - "validations[priority=12]"
        distinguishing_aspect: |
          Pair (business_referential, business_fiscal): inspection PASS while
          the backfill plan is only APPROVED (referential violation) AND
          diversion_rate 0.4000 < required 0.5000 (fiscal/compliance violation)
          — priority 10 ERR_BACKFILL_INCOMPLETE must win over priority 12
          ERR_DIVERSION_BELOW_REQUIREMENT. Different pair than both release
          conflicts.
        test_recipe:
          setup:
            - "Project FINAL_REVIEW; backfill plan APPROVED but not COMPLETE; one ticket (10.000g / 4.000d) gives diversion_rate 0.4000 < 0.5000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Prio 3", address: "35 Elm St", lot_area_sqft: 30000, required_diversion_rate: 0.5 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-02T08:00:00Z", disconnect_window_end: "2026-08-02T12:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "p3-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "p3-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "p3-c-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "MECHANICAL", structural_stability_rating: "STABLE", max_structure_height_ft: 30, adjacent_structure_distance_ft: 40 }, as: StructuralEngineer, as_user_id: "p3-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "p3-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "p3-p-1" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es_id}", expected_project_version: "${p_v}" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "37 Elm St", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nn_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${nn_id}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "START_DEMOLITION" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/debris-tickets", payload: { ticket_number: "T-1", facility_type: "LANDFILL", material_class: "MIXED_CD", gross_tons: 10.0 }, as: HaulingDispatcher, captures: { tk1: $.data.id } }
            - { call: "POST /demolition/debris-tickets/${tk1}/transition", payload: { action: "RECEIVE", diverted_tons: 4.0 }, as: HaulingDispatcher }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "COMPLETE_STRUCTURE_REMOVAL" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/backfill-plans", payload: { design_disturbed_area_sqft: 10000, planned_protected_area_sqft: 9500, fill_volume_cu_yd: 500, required_compaction_pct: 95.0 }, as: SiteSupervisor, captures: { bp_id: $.data.id } }
            - { call: "POST /demolition/backfill-plans/${bp_id}/transition", payload: { action: "APPROVE" }, as: StructuralEngineer, as_user_id: "p3-be-1" }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "START_BACKFILL" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "SUBMIT_FINAL_REVIEW" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/final-inspections", payload: { inspection_type: "FINAL_LOT", scheduled_date: "2026-08-20" }, as: MunicipalInspector, captures: { fi_id: $.data.id } }
          trigger:
            - { call: "POST /demolition/final-inspections/${fi_id}/transition", payload: { action: "PASS" }, as: MunicipalInspector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BACKFILL_INCOMPLETE (business_referential priority 10 beats business_fiscal priority 12)"
            - "Project.${p_id}.diversion_rate == 0.4 (also below 0.5000 — the fiscal violation loses)"
            - "Project.${p_id}.status remains FINAL_REVIEW (not CLOSED)"

