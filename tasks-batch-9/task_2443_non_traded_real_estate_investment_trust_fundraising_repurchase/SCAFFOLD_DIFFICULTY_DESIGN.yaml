            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_i_id}", investor_id: "${inv_a_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 10000000 }
              as: SponsorOperator
