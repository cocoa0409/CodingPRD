scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: projected_vs_confirmed_hers_index_diverge_on_same_home
        grounds:
          - calculations.hers_index
          - entities.Rating.fields.projected_index
          - entities.Rating.fields.confirmed_index
          - state_machines.Rating.PROJECTED_to_CONFIRMED
        distinguishing_aspect: |
          Dual-variant logic on the ENERGY-RATING domain (Rating/PlanModel physics): the PROJECTED
          variant reads the plan's design_ach50/design_duct values and yields 43, while the CONFIRMED
          variant reads the measured normalized values from the governing FINAL tests and yields 46
          on the identical home and plan.
        test_recipe:
          setup:
            - "Builder Cardinal Homes (PRODUCTION), subdivision Larkspur Phase 1 (IECC_2021, CZ4, ERI_PATH, sampling disabled)"
            - "PlanModel STD-2400 with design_ach50 3.00 and design duct 3.00 -> projected_index 43"
            - "Home L-101 on that plan with one PROJECTED Rating by an ACTIVE RATER"
            - "A FINAL inspection recorded blower door 1080 CFM50 (normalized 3.00, PASS) and duct 96 CFM25 (normalized 4.00, PASS) and was completed PASSED"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Cardinal Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 500000 }
              as: RatingProviderAdmin
              captures: { b1: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${b1}", name: "Larkspur Phase 1", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { sd1: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { r1: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Ines Pike", cert_level: "RATING_FIELD_INSPECTOR", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { fi1: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${sd1}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${r1}"
              captures: { pm_std: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${sd1}", plan_model_id: "${pm_std}", lot_number: "L-101", permit_date: "2026-08-03" }
              as: BuilderRep
              as_user_id: "${b1}"
              captures: { h1: $.data.id }
            - call: "POST /ratings"
              payload: { home_id: "${h1}", rater_id: "${r1}" }
              as: CertifiedRater
              as_user_id: "${r1}"
              captures: { rt1: $.data.id }
            - call: "POST /inspections"
              payload: { rating_id: "${rt1}", inspector_id: "${fi1}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-12T09:00:00Z", scheduled_end_utc: "2026-08-12T11:00:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${fi1}"
              captures: { in1: $.data.id }
            - call: "POST /inspections/${in1}/tests"
              payload: { test_type: "BLOWER_DOOR", measured_value: 1080 }
              as: FieldInspector
              as_user_id: "${fi1}"
            - call: "POST /inspections/${in1}/tests"
              payload: { test_type: "DUCT_LEAKAGE_TOTAL", measured_value: 96 }
              as: FieldInspector
              as_user_id: "${fi1}"
            - call: "POST /inspections/${in1}/complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${fi1}"
          trigger:
            - call: "POST /ratings/${rt1}/confirm"
              payload: {}
              as: CertifiedRater
              as_user_id: "${r1}"
          assert:
            - "Rating.${rt1}.projected_index == 43"
            - "Rating.${rt1}.confirmed_index == 46"
            - "Rating.${rt1}.confirmed_ach50 == 3.00"
            - "Rating.${rt1}.confirmed_duct_leakage_cfm25_per_100sqft == 4.00"
            - "Rating.${rt1}.eri_target == 55"
            - "Rating.${rt1}.compliance_path == ERI"
            - "Rating.${rt1}.compliance_status == PASSING"
            - "Rating.${rt1}.stage == CONFIRMED"

      - name: provisional_vs_certified_tax_credit_amount_diverge
        grounds:
          - calculations.incentive_amount
          - entities.DocumentPackage.fields.provisional_amount_cents
          - entities.DocumentPackage.fields.certified_amount_cents
          - state_machines.DocumentPackage.DRAFT_to_ISSUED
          - calculations.builder_incentive_ledger
        distinguishing_aspect: |
          Dual-variant logic on the MONEY domain (DocumentPackage/Builder ledger), a different entity
          domain from the index instance: PROVISIONAL reads projected_index 43 and lands in tax tier 1
          (250000 cents), CERTIFIED reads confirmed_index 46 and lands in tier 2 (100000 cents), and
          only the certified amount moves Builder.certified_incentive_cents.
        test_recipe:
          setup:
            - "Same builder/subdivision/plan/home/rating as the projected-vs-confirmed instance"
            - "The rating is CONFIRMED and PASSING with projected_index 43 and confirmed_index 46"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Cardinal Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 500000 }
              as: RatingProviderAdmin
              captures: { b2: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${b2}", name: "Larkspur Phase 1", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { sd2: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { r2: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Ines Pike", cert_level: "RATING_FIELD_INSPECTOR", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { fi2: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${sd2}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${r2}"
              captures: { pm2: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${sd2}", plan_model_id: "${pm2}", lot_number: "L-101", permit_date: "2026-08-03" }
              as: BuilderRep
              as_user_id: "${b2}"
              captures: { h2: $.data.id }
            - call: "POST /ratings"
              payload: { home_id: "${h2}", rater_id: "${r2}" }
              as: CertifiedRater
              as_user_id: "${r2}"
              captures: { rt2: $.data.id }
            - call: "POST /inspections"
              payload: { rating_id: "${rt2}", inspector_id: "${fi2}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-12T09:00:00Z", scheduled_end_utc: "2026-08-12T11:00:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${fi2}"
              captures: { in2: $.data.id }
            - call: "POST /inspections/${in2}/tests"
              payload: { test_type: "BLOWER_DOOR", measured_value: 1080 }
              as: FieldInspector
              as_user_id: "${fi2}"
            - call: "POST /inspections/${in2}/tests"
              payload: { test_type: "DUCT_LEAKAGE_TOTAL", measured_value: 96 }
              as: FieldInspector
              as_user_id: "${fi2}"
            - call: "POST /inspections/${in2}/complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${fi2}"
            - call: "POST /ratings/${rt2}/confirm"
              payload: {}
              as: CertifiedRater
              as_user_id: "${r2}"
              captures: { rt2_v: $.data.version }
          trigger:
            - call: "POST /document-packages"
              payload: { rating_id: "${rt2}", package_type: "TAX_CREDIT_45L", expected_rating_version: "${rt2_v}" }
              as: BuilderRep
              as_user_id: "${b2}"
              captures: { dp2: $.data.id, dp2_prov: $.data.provisional_amount_cents }
            - call: "POST /document-packages/${dp2}/issue"
              payload: {}
              as: RatingProviderAdmin
          assert:
            - "DocumentPackage.${dp2}.provisional_amount_cents == 250000"
            - "DocumentPackage.${dp2}.certified_amount_cents == 100000"
            - "DocumentPackage.${dp2}.line_items == []"
            - "DocumentPackage.${dp2}.status == ISSUED"
            - "Builder.${b2}.certified_incentive_cents == 100000"

  - rule_id: combinatorial_formula
    instances:
      - name: hers_index_nonlinear_clamp_and_pv_cap
        grounds:
          - calculations.hers_index
          - entities.PlanModel.fields.hvac_efficiency_index
          - entities.PlanModel.fields.pv_capacity_kw_dc
          - entities.Subdivision.fields.code_edition
        distinguishing_aspect: |
          Mode (a): a five-input formula with two nested clamps interacting — max(0.62, min(1.05, ...))
          on the equipment multiplier plus min(PV_INDEX_CAP[code_edition], 4.0 * pv_kw) on the solar
          credit — so the SAME plan inputs yield 26 under IECC_2021 (PV credit clipped to 5 points)
          and 19 under IECC_2015 (full 12 points), while hvac_efficiency_index 16 is clipped by the
          0.62 floor rather than driving the multiplier to 0.55.
        test_recipe:
          setup:
            - "Builder Solstice Builders (PRODUCTION)"
            - "Two subdivisions in CZ4 differing only in code_edition: one IECC_2021, one IECC_2015"
            - "An ACTIVE RATER to register plan models"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Solstice Builders", builder_type: "PRODUCTION", utility_program_budget_cents: 500000 }
              as: RatingProviderAdmin
              captures: { b3: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${b3}", name: "Sunfield 2021", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { sd_2021: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${b3}", name: "Sunfield 2015", code_edition: "IECC_2015", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { sd_2015: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { r3: $.data.id }
          trigger:
            - call: "POST /plan-models"
              payload: { subdivision_id: "${sd_2021}", plan_code: "SOLAR-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 340, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 16, pv_capacity_kw_dc: 3.0 }
              as: CertifiedRater
              as_user_id: "${r3}"
              captures: { pm_2021: $.data.id, pm_2021_idx: $.data.projected_index }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${sd_2015}", plan_code: "SOLAR-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 340, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 16, pv_capacity_kw_dc: 3.0 }
              as: CertifiedRater
              as_user_id: "${r3}"
              captures: { pm_2015: $.data.id, pm_2015_idx: $.data.projected_index }
          assert:
            - "PlanModel.${pm_2021}.projected_index == 26"
            - "PlanModel.${pm_2015}.projected_index == 19"
            - "PlanModel.${pm_2021}.projected_index - PlanModel.${pm_2015}.projected_index == 7"
            - "PlanModel.${pm_2021}.status == ACTIVE"

      - name: utility_package_line_item_rounding_order
        grounds:
          - calculations.incentive_amount
          - entities.DocumentPackage.fields.line_items
          - entities.DocumentPackage.fields.certified_amount_cents
          - state_machines.DocumentPackage.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (b): nested rounding whose ORDER changes the cents. On CFA 2135 with measured duct 3.33
          the pinned round-each-line-then-sum order gives ENVELOPE 80063 + DUCTS 838 + AIR 3330 +
          INDEX 29250 = 113481, whereas sum-then-round gives 113480 — a one-cent divergence that only
          the pinned order produces.
        test_recipe:
          setup:
            - "Builder Halcyon Homes (PRODUCTION) with utility_program_budget_cents 500000"
            - "Subdivision Odd Acres (IECC_2021, CZ4, ERI_PATH)"
            - "PlanModel ODD-2135 (CFA 2135, volume 19215, 3 bedrooms, UA 300, design ach 3.00, design duct 3.00, hvac 9) -> projected_index 46"
            - "Home L-207 confirmed from a FINAL inspection with blower door 890 CFM50 (normalized 2.78) and duct 71 CFM25 (normalized 3.33) -> confirmed_index 47, PASSING via ERI"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Halcyon Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 500000 }
              as: RatingProviderAdmin
              captures: { b4: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${b4}", name: "Odd Acres", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { sd4: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { r4: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Ines Pike", cert_level: "RATING_FIELD_INSPECTOR", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { fi4: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${sd4}", plan_code: "ODD-2135", conditioned_floor_area_sqft: 2135, conditioned_volume_cuft: 19215, bedrooms: 3, envelope_ua_btu_per_hr_f: 300, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${r4}"
              captures: { pm4: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${sd4}", plan_model_id: "${pm4}", lot_number: "L-207", permit_date: "2026-08-03" }
              as: BuilderRep
              as_user_id: "${b4}"
              captures: { h4: $.data.id }
            - call: "POST /ratings"
              payload: { home_id: "${h4}", rater_id: "${r4}" }
              as: CertifiedRater
              as_user_id: "${r4}"
              captures: { rt4: $.data.id }
            - call: "POST /inspections"
              payload: { rating_id: "${rt4}", inspector_id: "${fi4}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-12T09:00:00Z", scheduled_end_utc: "2026-08-12T11:00:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${fi4}"
              captures: { in4: $.data.id }
            - call: "POST /inspections/${in4}/tests"
              payload: { test_type: "BLOWER_DOOR", measured_value: 890 }
              as: FieldInspector
              as_user_id: "${fi4}"
            - call: "POST /inspections/${in4}/tests"
              payload: { test_type: "DUCT_LEAKAGE_TOTAL", measured_value: 71 }
              as: FieldInspector
              as_user_id: "${fi4}"
            - call: "POST /inspections/${in4}/complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${fi4}"
            - call: "POST /ratings/${rt4}/confirm"
              payload: {}
              as: CertifiedRater
              as_user_id: "${r4}"
              captures: { rt4_v: $.data.version }
          trigger:
            - call: "POST /document-packages"
              payload: { rating_id: "${rt4}", package_type: "UTILITY_PROGRAM", expected_rating_version: "${rt4_v}" }
              as: BuilderRep
              as_user_id: "${b4}"
              captures: { dp4: $.data.id }
            - call: "POST /document-packages/${dp4}/issue"
              payload: {}
              as: RatingProviderAdmin
          assert:
            - "Rating.${rt4}.confirmed_index == 47"
            - "Rating.${rt4}.confirmed_ach50 == 2.78"
            - "Rating.${rt4}.confirmed_duct_leakage_cfm25_per_100sqft == 3.33"
            - "DocumentPackage.${dp4}.provisional_amount_cents == 115813"
            - "DocumentPackage.${dp4}.certified_amount_cents == 113481"
            - "DocumentPackage.${dp4}.line_items[0].amount_cents == 80063"
            - "DocumentPackage.${dp4}.line_items[1].amount_cents == 838"
            - "DocumentPackage.${dp4}.line_items[2].amount_cents == 3330"
            - "DocumentPackage.${dp4}.line_items[3].amount_cents == 29250"
            - "Builder.${b4}.certified_incentive_cents == 113481"

      - name: sample_set_representative_index_evaluation_order
        grounds:
          - calculations.sample_set_representative_index
          - calculations.sample_tested_home_selection
          - state_machines.SampleSet.TESTED_to_CLOSED_PASS
          - entities.SampleSet.fields.representative_index
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned by evaluation order — step 2 takes the max
          over TESTED confirmed indices only (54), and step 3 writes that value onto REPRESENTED homes;
          because step-3 outputs never re-enter step 1, the answer is 54 and not the 55 an
          implementation that folded the represented homes' own indices into the max would produce.
        test_recipe:
          setup:
            - "Builder Meridian Homes (PRODUCTION), subdivision Cedar Run (IECC_2021, CZ4, ERI_PATH, sampling_enabled true)"
            - "Three plan models: BIG-3000 (projected 60), PERF-2400 (projected 55), LOW-2200 (projected 40)"
            - "Three homes L-1/L-2/L-3 on those plans, each with a PROJECTED rating, all three members of one FORMING sample set with window 2026-08-01..2026-08-31"
            - "Selection picked L-1 (worst projected index 60) as the tested home; its FINAL inspection measured blower door 810 CFM50 (1.80) and duct 90 CFM25 (3.00), and confirmation produced confirmed_index 54 PASSING, moving the set to TESTED"
