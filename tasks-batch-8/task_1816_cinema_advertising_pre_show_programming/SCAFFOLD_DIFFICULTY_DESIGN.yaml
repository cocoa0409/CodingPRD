          showtime's latest report is SUBMITTED, and unblocked once that report
          is ACCEPTED.
        test_recipe:
          setup:
            - "aired chain: slot PLAYED (VERIFIED); attendance report submitted (175) but left SUBMITTED; invoice ISSUED"
          setup_api_calls:
