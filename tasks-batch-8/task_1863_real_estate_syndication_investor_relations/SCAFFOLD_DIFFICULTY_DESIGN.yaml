          Metric: committed_cents against offering.min_subscription_cents.
          Boundary is INCLUSIVE — a subscription whose committed_cents EQUALS
          min_subscription_cents must be accepted; one cent below must be
          rejected with ERR_BELOW_MIN_SUBSCRIPTION. Distinct endpoint:
          POST /subscriptions/{id}/submit.
