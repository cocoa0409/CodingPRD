            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
          trigger:
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 500, expected_shopper_version: "${shop_v}" }, as: MarketManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"

      - name: c_rbac_shopper_is_read_only
        claim_type: role_permission_denied
        grounds: ["roles[Shopper]"]
        distinguishing_aspect: "Shopper (entity_backed) can read its own record but cannot enroll shoppers: POST /shoppers as Shopper -> 403; GET /shoppers/{own id} as Shopper -> 200."
        test_recipe:
          setup: ["program + one shopper exist"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
          trigger:
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-2", benefit_type: "WIC" }, as: Shopper, as_user_id: "${shop}", captures: { err: $.data.error_id } }
            - { call: "GET /shoppers/${shop}", payload: {}, as: Shopper, as_user_id: "${shop}", captures: { got: $.data.id } }
          assert:
            - "write denied: error_id == ERR_FORBIDDEN (403)"
            - "self-read allowed: 200 with id == ${shop}"

      - name: c_rbac_market_manager_override_reconcile_forbidden
        claim_type: role_permission_denied
        grounds: ["validations[priority=2]", state_machines.MarketDay.VARIANCE_FLAGGED_to_RECONCILED]
        distinguishing_aspect: "Payload-scoped RBAC: reconcile is shared, but override_variance: true flips it into a ProgramAdmin-only operation — MarketManager sending the override flag gets 403."
        test_recipe:
          setup: ["day VARIANCE_FLAGGED (charge 1000, redeem 1400 -> variance 600, plain reconcile soft-flags)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /vendors", payload: { market_id: "${mkt}", legal_name: "V", stall_number: "S1" }, as: ProgramAdmin, captures: { vend: $.data.id } }
            - { call: "POST /vendors/${vend}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 1000, expected_shopper_version: "${shop_v}" }, as: BoothOperator }
            - { call: "POST /tokens/redeem", payload: { serial_number: 100001 }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: 100002 }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: 300001 }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: 300002 }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: 300003 }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: 300004 }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /market-days/${day}/close", payload: {}, as: MarketManager }
            - { call: "POST /market-days/${day}/reconcile", payload: {}, as: MarketManager }
          trigger:
            - { call: "POST /market-days/${day}/reconcile", payload: { override_variance: true }, as: MarketManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (403); day stays VARIANCE_FLAGGED"

      - name: c_rbac_vendor_reads_own_resources
        claim_type: role_permission_allowed
        grounds: ["roles[Vendor]", "endpoints[GET /vendors/{id}]", "endpoints[GET /redemption-submissions]"]
        distinguishing_aspect: "Positive RBAC: the entity_backed Vendor role reads its own vendor row (payable_cents) and its filtered submission list."
        test_recipe:
          setup: ["program + market + APPROVED vendor exist"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /vendors", payload: { market_id: "${mkt}", legal_name: "V", stall_number: "S1" }, as: ProgramAdmin, captures: { vend: $.data.id } }
            - { call: "POST /vendors/${vend}/approve", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /vendors/${vend}", payload: {}, as: Vendor, as_user_id: "${vend}", captures: { st: $.data.status, pay: $.data.payable_cents } }
            - { call: "GET /redemption-submissions", payload: { vendor_id: "${vend}" }, as: Vendor, as_user_id: "${vend}" }
          assert:
            - "GET /vendors/{self} as Vendor -> 200, status == ACTIVE, payable_cents == 0"
            - "GET /redemption-submissions?vendor_id=self as Vendor -> 200, empty list, total_count == 0"

  # ==================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: c_layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / fraud_confirm_vendor_cascade_depth4
          rationale: "The 4-hop confirm -> suspend -> reject -> flag -> recompute chain is asserted hop-by-hop in the named §1.8 instance."
      - name: c_layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: dual_variant_calc / reimbursement_rounding_order_variants_diverge
          rationale: "Both reimbursement variants and both program-liability variants are exercised with literal expectations in §1.8."
      - name: c_layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: boundary_precision_check / daily_match_cap_exact_boundary_then_exhaustion
          rationale: "Cumulative day-cap threshold (at-cap allowed, next-cent clamped) and instantaneous pool-exhaustion threshold are covered by §1.8 boundary instances."

  # ==================================================================
  - section: consistency_model
    instances:
      - name: c_consistency_immediate_pool_debit_visible_on_next_read
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.Program.fields.match_pool_remaining_cents]
        distinguishing_aspect: "Immediate consistency: the very next GET after an issuance observes the debited pool (98800 after a 1200 match) — no asynchronous lag, no read-your-writes gap."
        test_recipe:
          setup: ["base setup; shopper ACTIVE; day OPEN"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
          trigger:
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 1200, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
            - { call: "GET /programs/${prog}", payload: {}, as: ProgramAdmin, captures: { pool: $.data.match_pool_remaining_cents, fwd: $.data.liability_forward_cents } }
            - { call: "GET /market-days/${day}", payload: {}, as: MarketManager, captures: { issued: $.data.issued_value_cents } }
          assert:
            - "immediately after the 201: pool == 98800, liability_forward == 2400, day issued_value == 2400 — all reads reflect the write in-request"
