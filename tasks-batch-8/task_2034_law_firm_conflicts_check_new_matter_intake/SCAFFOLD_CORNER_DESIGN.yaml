        claim_type: rbac_denial
        grounds: ["roles[ResponsibleAttorney]", "validations[priority=5]", "errors[ERR_NOT_RESPONSIBLE_ATTORNEY]"]
        distinguishing_aspect: "An ACTIVE attorney who holds the ResponsibleAttorney role but is NOT the check-matter's responsible attorney cannot review its hits: ERR_NOT_RESPONSIBLE_ATTORNEY (ownership, not role, is what fails)."
        test_recipe:
          setup: ["Matter M1 (responsible RA) has PENDING hit H; attorney OTHER is ACTIVE but not responsible on M1"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Ownership X Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { px: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Ownership Y Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { py: $.data.id } }
