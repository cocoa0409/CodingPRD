  - rule_id: non_linear_state_machine
    instances:
      - name: case_escalation_cycle
        grounds:
          - state_machines.Case.IN_PROGRESS_to_PENDING_FOLLOW_UP
          - state_machines.Case.PENDING_FOLLOW_UP_to_IN_PROGRESS
          - state_machines.Case.IN_PROGRESS_to_ESCALATED
          - state_machines.Case.ESCALATED_to_IN_PROGRESS
          - state_machines.FollowUp.DUE_to_COMPLETED
        distinguishing_aspect: |
          Case is cyclic: IN_PROGRESS -> PENDING_FOLLOW_UP (on follow-up
          creation) -> IN_PROGRESS (bubble-up on completion) -> ESCALATED ->
          IN_PROGRESS (supervisor de-escalation with compensation: the
          auto-created follow-up is CANCELLED). Distinct entity from the
          CallSession parallel-dimensions instance.
