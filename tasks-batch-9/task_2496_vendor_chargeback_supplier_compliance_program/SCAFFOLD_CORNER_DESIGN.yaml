      - name: corner_corrective_action_plan_lifecycle_codes_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CAP_NOT_CLOSABLE
          - errors.ERR_CAP_NOT_DECIDABLE
          - errors.ERR_CAP_COMMITMENT_PAST_DUE
          - errors.ERR_CAP_NOT_AWAITING_SUBMISSION
          - errors.ERR_CAP_NOT_ESCALATABLE
          - errors.ERR_CAP_SUBMISSION_LIMIT_EXCEEDED
          - state_machines.CorrectiveActionPlan
        distinguishing_aspect: "All four plan verbs are state-gated on disjoint sets, and the two submit-time guards are distinguishable: an over-committed date is 422 ERR_CAP_COMMITMENT_PAST_DUE while a submit from the wrong state is 409 ERR_CAP_NOT_AWAITING_SUBMISSION, and only after two rejected rounds does submit switch to 422 ERR_CAP_SUBMISSION_LIMIT_EXCEEDED - the round counter, not the state, is what finally closes the loop."
