          trigger:
            - { call: "POST /spirit-store/seasonal-drops/${drop}/transition", payload: { to_state: OPEN }, as: StoreManager, captures: { st: $.data.status } }
          assert:
            - "st == OPEN with no clock-set call ever issued — proves the fixed default 2026-08-01T00:00:00Z"

      - name: valuation_computed_read_covered
        claim_type: computed_read
        grounds: [endpoints: "GET /spirit-store/programs/{programId}/valuation"]
        excluded_because:
          difficulty_instance: inventory_valuation_fifo_vs_weighted_avg
          rationale: "Response shape and both method outputs are asserted there."

  # ============================================================ 6. Errors
  - section: errors
    instances:
      - name: receive_unknown_po_returns_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_PO_NOT_FOUND]"]
        distinguishing_aspect: "A receive against a random UUID hits existence (priority 3) with ERR_PO_NOT_FOUND, not a state error."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector }
          trigger:
            - { call: "POST /spirit-store/purchase-orders/00000000-0000-0000-0000-000000000000/receive", payload: { qty: 1 }, as: StoreManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PO_NOT_FOUND"

      - name: preorder_cancel_after_lock_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PREORDER_NOT_CANCELLABLE]", state_machines.PreOrder]
        distinguishing_aspect: "Customer cancel of a PAID preorder is allowed only while the campaign is OPEN; once locked into IN_PRODUCTION it rejects."
