              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { site_id: $.data.id }
            - call: "PATCH /collection-sites/${site_id}/operational-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "SORTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /donation-batches"
