# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_0705_podcast_production_editing — EXPERT tier
# Breadth probe: enumerative coverage of testable §1.1–§1.7 claims not already
# covered by the nine depth rules in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Sections / claim_types are drawn verbatim from references/claim-extraction-guide.md.
#
# Identity conventions (§1.7):
#   ShowOwner  = entity_backed:Show     -> X-User-ID == owning Show.id
#   ProducerEng= entity_backed:Engineer -> X-User-ID == Engineer.id on its sessions
#   PlatformAdmin / AdOps = opaque
# Clock default (§1.5): 2026-03-01T00:00:00Z before any /_clock/set_current_utc.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_show_returns_201_with_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Show.fields.production_posture
          - entities.Show.fields.lifetime_billed_cents
          - entities.Show.fields.open_episode_count
          - endpoints."POST /shows"
        distinguishing_aspect: "POST /shows with required fields returns 201 and the new Show with production_posture=SUSPENDED, lifetime_billed_cents=0, open_episode_count=0 and a server-minted id."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /shows"
              payload: { title: "Brand New", format: "INTERVIEW", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id, posture: $.data.production_posture }
          assert:
            - "Response status == 201; Show.${show_id}.production_posture == 'SUSPENDED'."
            - "Show.${show_id}.lifetime_billed_cents == 0 and open_episode_count == 0."
            - "Show.${show_id}.id is a non-empty server-minted UUID and version == 1."

      - name: create_show_missing_billing_model_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Show.fields.billing_model
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "billing_model is source:input with no default; omitting it returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /shows"
              payload: { title: "No Billing", format: "SOLO" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400 and data.error_id == 'ERR_INVALID_REQUEST'."

      - name: create_show_default_target_loudness_applied
        claim_type: Defaults
        grounds:
          - entities.Show.fields.target_loudness_lufs
          - endpoints."POST /shows"
        distinguishing_aspect: "Omitting target_loudness_lufs applies the declared default -16.0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /shows"
              payload: { title: "Default Loud", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { lufs: $.data.target_loudness_lufs }
          assert:
            - "Show.target_loudness_lufs == -16.0 (declared default applied when omitted)."

      - name: create_show_invalid_format_enum_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - entities.Show.fields.format
          - validations[priority=6]
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "format outside {INTERVIEW,SOLO,PANEL,NARRATIVE} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /shows"
              payload: { title: "Bad Fmt", format: "VLOG", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422 and data.error_id == 'ERR_INVALID_ENUM'."

      - name: get_show_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints."GET /shows/{id}"
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /shows/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /shows/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404 and data.error_id == 'ERR_NOT_FOUND'."

      - name: get_show_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints."GET /shows/{id}"
          - entities.Show.fields.title
        distinguishing_aspect: "GET /shows/{id} returns the previously created Show with matching title and id."
        test_recipe:
          setup:
            - "One Show created."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Readable", format: "PANEL", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
          trigger:
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { t: $.data.title }
          assert:
            - "GET /shows/${show_id} returns status 200 with data.title == 'Readable' and data.id == ${show_id}."

      - name: list_shows_pagination_envelope_fields
        claim_type: Listing
        grounds:
          - endpoints."GET /shows"
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /shows returns a paginated array envelope exposing total_count and has_more; limit/offset honored."
        test_recipe:
          setup:
            - "Two Shows created."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "S1", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
            - call: "POST /shows"
              payload: { title: "S2", format: "SOLO", billing_model: "RETAINER" }
              as: PlatformAdmin
          trigger:
            - call: "GET /shows"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "Response response_type == 'array'; meta.total_count == 2 and meta.has_more == true with limit=1."
            - "data array length == 1."

      - name: list_shows_invalid_pagination_limit_returns_error
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_PAGINATION]
          - endpoints."GET /shows"
        distinguishing_aspect: "limit above 100 (or offset < 0) on GET /shows returns ERR_INVALID_PAGINATION (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /shows"
              payload: { limit: 101 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400 and data.error_id == 'ERR_INVALID_PAGINATION'."

      - name: episode_open_count_computed_field_tracks_open_episodes
        claim_type: Computed Fields
        grounds:
          - entities.Show.fields.open_episode_count
          - state_machines.Episode.INTAKE_to_CANCELLED
          - endpoints."POST /episodes"
        distinguishing_aspect: "Show.open_episode_count counts Episodes whose status NOT IN {PUBLISHED,ARCHIVED,CANCELLED}; it is 1 after one INTAKE episode and 0 after that episode is CANCELLED."
        test_recipe:
          setup:
            - "Show S with ACTIVE STANDARD/PER_EPISODE contract (posture ACTIVE); one INTAKE episode created."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Cnt S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Open Ep", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep_id: $.data.id }
          trigger:
            - call: "GET /shows/${show_id}"
              payload: {}
              as: PlatformAdmin
              captures: { open_before: $.data.open_episode_count }
            - call: "POST /episodes/${ep_id}/cancel"
              payload: {}
              as: ShowOwner
              as_user_id: "${show_id}"
            - call: "GET /shows/${show_id}"
              payload: {}
              as: PlatformAdmin
              captures: { open_after: $.data.open_episode_count }
          assert:
            - "Show.${show_id}.open_episode_count == 1 while the episode is INTAKE."
            - "Show.${show_id}.open_episode_count == 0 after the episode is CANCELLED."

      - name: asset_version_supersede_invalid_target_returns_invalid_supersede
        claim_type: Parent Relationships
        grounds:
          - entities.AssetVersion.fields.supersedes_version_id
          - validations[priority=21]
          - errors[ERR_INVALID_SUPERSEDE]
        distinguishing_aspect: "Flat-topology FK integrity: supersedes_version_id pointing at a SUBMITTED (not ACCEPTED) version of the same deliverable returns ERR_INVALID_SUPERSEDE (409)."
        test_recipe:
          setup:
            - "Episode E EDITING with a MASTER_AUDIO Deliverable that has one SUBMITTED (not yet accepted) AssetVersion v1."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Sup S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /engineers"
              payload: { name: "Eng Sup" }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep Sup", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep_id: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep_id}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-02T08:00:00Z", scheduled_end_utc: "2026-03-02T09:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/start"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /deliverables"
              payload: { episode_id: "${ep_id}", kind: "MASTER_AUDIO" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { d_id: $.data.id }
            - call: "POST /asset-versions"
              payload: { deliverable_id: "${d_id}", integrated_loudness_lufs: -16.0 }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /asset-versions"
              payload: { deliverable_id: "${d_id}", supersedes_version_id: "${v1}", integrated_loudness_lufs: -16.0 }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == 'ERR_INVALID_SUPERSEDE' (v1 is SUBMITTED, not ACCEPTED)."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_session_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Session.LIVE_to_COMPLETED
          - state_machines.Session.BOOKED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "session/cancel is only valid from BOOKED; cancelling a COMPLETED session returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup:
            - "A Session that has been started and completed (COMPLETED)."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "SC S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /engineers"
              payload: { name: "Eng SC" }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep SC", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep_id: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep_id}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-02T08:00:00Z", scheduled_end_utc: "2026-03-02T09:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/start"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
          trigger:
            - call: "POST /sessions/${sess_id}/cancel"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == 'ERR_INVALID_STATE' (cancel valid only from BOOKED)."

      - name: activate_contract_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.EngagementContract.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Re-activating an already-ACTIVE contract returns ERR_INVALID_STATE (409); activate is valid only from DRAFT."
        test_recipe:
          setup:
            - "One ACTIVE EngagementContract."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Act S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == 'ERR_INVALID_STATE'."

      - name: terminate_terminated_contract_locked_down
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.EngagementContract.ACTIVE_to_TERMINATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "TERMINATED is terminal: a second terminate from TERMINATED returns ERR_INVALID_STATE (409), no version bump."
        test_recipe:
          setup:
            - "An ACTIVE contract that is then TERMINATED."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Term S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cv: $.data.version }
            - call: "POST /contracts/${contract_id}/terminate"
              payload: { expected_engagementcontract_version: "${cv}" }
              as: PlatformAdmin
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/terminate"
              payload: { expected_engagementcontract_version: "${cv2}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == 'ERR_INVALID_STATE' (TERMINATED is terminal)."

      - name: episode_initial_state_is_intake
        claim_type: Initial State
        grounds:
          - state_machines.Episode.initial_state
          - endpoints."POST /episodes"
        distinguishing_aspect: "A newly created Episode starts in INTAKE with revision_count=0 and turnaround_due_utc=null."
        test_recipe:
          setup:
            - "Show S with ACTIVE contract (posture ACTIVE)."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Init S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Fresh", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { status: $.data.status, rev: $.data.revision_count }
          assert:
            - "New Episode.status == 'INTAKE' and revision_count == 0 and turnaround_due_utc == null."

      - name: cancel_episode_cascades_booked_session_to_cancelled
        claim_type: Cascade down
        grounds:
          - state_machines.Episode.INTAKE_to_CANCELLED
          - state_machines.Session.BOOKED_to_CANCELLED
          - entities.Session.fields.status
        distinguishing_aspect: "Cancelling an episode with a BOOKED session cascades that non-terminal Session to CANCELLED (cascade-down side effect)."
        test_recipe:
          setup:
            - "Episode E (INTAKE) with one BOOKED session."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Casc S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /engineers"
              payload: { name: "Eng Cd" }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep Cd", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep_id: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep_id}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-05T10:00:00Z", scheduled_end_utc: "2026-03-05T11:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /episodes/${ep_id}/cancel"
              payload: {}
              as: ShowOwner
              as_user_id: "${show_id}"
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { sess_status: $.data.status }
          assert:
            - "Episode.${ep_id}.status == 'CANCELLED'."
            - "Session.${sess_id}.status == 'CANCELLED' (cascaded from the episode cancel)."

      - name: episode_review_to_editing_revision_loop
        claim_type: Valid Transition
        grounds:
          - state_machines.Episode.REVIEW_to_EDITING
        excluded_because:
          difficulty_instance: non_linear_state_machine / episode_review_editing_revision_cycle
          rationale: "The REVIEW->EDITING revision loop and revision_count increment are asserted by the named §1.8 cyclic-state-machine instance."

      - name: session_complete_bubble_up_to_editing
        claim_type: Bubble up
        grounds:
          - state_machines.Session.LIVE_to_COMPLETED
          - state_machines.Episode.RECORDING_to_EDITING
        excluded_because:
          difficulty_instance: transitive_cascade / session_complete_bubbles_episode_to_editing_depth2
          rationale: "Session complete bubbling the episode RECORDING->EDITING is the depth-2 cascade asserted by the named §1.8 instance."

      - name: invoice_void_compensation_reverses_lifetime
        claim_type: Compensation
        grounds:
          - state_machines.Invoice.DISPUTED_to_VOID
          - entities.Show.fields.lifetime_billed_cents
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_void_conserves_show_lifetime_billed
          rationale: "Void reversing lifetime_billed_cents with zero drift is the conserved-quantity invariant asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: invoice_total_input_set_no_extra_track_below_floor
        claim_type: Input Set Filtering
        grounds:
          - calculations.invoice_total
          - state_machines.Episode.SCHEDULED_to_PUBLISHED
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: "extra_track_cents uses max(0, raw_track_count - EXTRA_TRACK_FLOOR=2): at raw_track_count=2 the extra-track term is 0, so a STANDARD on-time episode invoice subtotal == base 15000 exactly."
        test_recipe:
          setup:
            - "Show S, ACTIVE STANDARD/PER_EPISODE contract; one episode published on time with raw_track_count=2, no transcript."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Floor S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /engineers"
              payload: { name: "Eng Fl" }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep Fl", planned_track_count: 2 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep_id: $.data.id }
            - call: "POST /sessions"
