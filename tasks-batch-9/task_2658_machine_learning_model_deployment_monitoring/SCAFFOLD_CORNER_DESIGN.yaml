              captures: { v2_task_due: "$.data[0].due_at", v2_task_swept: "$.data[0].swept_at", v2_task_status: "$.data[0].status" }
            - call: "GET /retraining-triggers/${trig_id}"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { trig_final: $.data.status }
            - call: "GET /models/${m_id}"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { open_count: $.data.open_retraining_trigger_count }
          assert:
            - "the two versions carry different due dates from the APPROVAL_ANCHOR variant: 1.0.0 -> 2026-10-30T00:00:00Z, 1.0.1 -> 2026-10-31T00:00:00Z"
            - "the trigger raised at clock 2026-08-02 has stale_after == 2026-10-31T00:00:00Z (raise instant + STALE_AFTER_DAYS 90)"
            - "SWEEP 1 at 2026-10-30: evaluated_count 2, created_count 1 (only 1.0.0 is due), skipped_existing_count 0, staled_trigger_count 0 (stale_after is still in the future)"
            - "SWEEP 2 at the same clock is idempotent: evaluated_count 2, created_count 0, skipped_existing_count 1 (1.0.0 already has a DUE task), staled_trigger_count 0"
            - "SWEEP 3 at 2026-10-31: created_count 1 (1.0.1 is now due), skipped_existing_count 1 (1.0.0's DUE task still blocks it), staled_trigger_count 1"
            - "the task created for 1.0.1 has status 'DUE', due_at '2026-10-31T00:00:00Z' copied from the version and swept_at '2026-10-31T00:00:00Z' from the clock — the two fields are distinct sources"
            - "the ACKNOWLEDGED trigger became 'STALE' and Model.open_retraining_trigger_count fell from 1 to 0"
