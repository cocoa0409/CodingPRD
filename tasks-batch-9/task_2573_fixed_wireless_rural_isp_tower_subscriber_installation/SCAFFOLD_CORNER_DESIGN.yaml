      - name: interference_coordination_links_two_sectors_on_different_towers
        claim_type: parent_relationships
        grounds:
          - entities.InterferenceCoordination
          - entities.InterferenceCoordination.fields.neighbor_sector_id
          - endpoints.POST /interference-coordinations
          - endpoints.GET /sectors/{id}/interference-coordinations
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          InterferenceCoordination declares parent null and two Sector FKs, making the topology a
          graph rather than a tree: one record created from sector A on tower 1 to sector B on tower 2
          is visible through GET /sectors/{A}/interference-coordinations AND through
          GET /sectors/{B}/interference-coordinations - the same row reached from both endpoints.
        test_recipe:
          setup:
            - "Two Towers RB-TWR-001 and RB-TWR-002, each PLANNED, and one shared SpectrumLicense CBRS-PAL-4412 spanning 3550.0-3650.0 MHz."
            - "Sector A on tower 1 at azimuth 90.0 channel 3555.0/10.0; Sector B on tower 2 at azimuth 100.0 channel 3567.0/10.0."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower1_id: $.data.id }
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-002", latitude: 41.2700, longitude: -104.7300, ground_elevation_m: 1190.0, antenna_agl_m: 40.0, lease_landowner_name: "Bell Mesa Trust", lease_monthly_base_rent_cents: 38000, lease_escalator_pct: 0.0300, lease_start_date: "2024-02-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower2_id: $.data.id }
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower1_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_a: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower2_id}", spectrum_license_id: "${license_id}", azimuth_deg: 100.0, beamwidth_deg: 65.0, channel_center_mhz: 3567.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_b: $.data.id }
          trigger:
            - call: "POST /interference-coordinations"
              payload: { requesting_sector_id: "${sector_a}", neighbor_sector_id: "${sector_b}", proposed_channel_center_mhz: 3555.0, proposed_channel_width_mhz: 10.0, proposed_eirp_dbm: 44.0, guard_band_mhz: 2.0, effective_from: "2026-08-05T00:00:00Z" }
              as: NetworkEngineer
              captures: { coord_id: $.data.id }
            - call: "GET /sectors/${sector_a}/interference-coordinations"
              payload: { limit: 50, offset: 0 }
              as: NetworkEngineer
            - call: "GET /sectors/${sector_b}/interference-coordinations"
              payload: { limit: 50, offset: 0 }
              as: NetworkEngineer
          assert:
            - "HTTP status is 201"
            - "InterferenceCoordination.requesting_sector_id == ${sector_a} and neighbor_sector_id == ${sector_b}"
            - "InterferenceCoordination.status == \"REQUESTED\", round_number == 1, version == 1"
            - "InterferenceCoordination.decision_note is null, decided_by_user_id is null, last_response_at is null"
            - "GET /sectors/${sector_a}/interference-coordinations: total_count == 1 and the row's id == ${coord_id}"
            - "GET /sectors/${sector_b}/interference-coordinations: total_count == 1 and the row's id == ${coord_id} - the junction is reachable from the neighbour side too"

  - section: state_machines
    instances:
      - name: tower_planned_to_active_recomputes_backhaul_rate_and_bumps_only_the_tower_version
        claim_type: valid_transition
        grounds:
          - state_machines.Tower.PLANNED_to_ACTIVE
          - entities.Tower.fields.backhaul_accepted_mbps
          - endpoints.POST /towers/{id}/status-changes
        distinguishing_aspect: |
          The declared PLANNED -> ACTIVE transition succeeds once one circuit is ACCEPTED and leaves
          Tower.version at exactly 2: accepting the circuit recomputed the tower's derived
          backhaul_accepted_mbps to 500 but only the circuit's own version was incremented, so the
          activation is the first and only write that bumps the Tower.
        test_recipe:
          setup:
            - "One Tower RB-TWR-001 in status PLANNED with one BackhaulCircuit driven ORDERED -> INSTALLED -> ACCEPTED at measured_mbps 505.0."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id, tower_v1: $.data.version }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
              captures: { circuit_v3: $.data.version }
          trigger:
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE", reason: "acceptance testing complete" }
              as: NetworkEngineer
              captures: { tower_v2: $.data.version }
          assert:
            - "HTTP status is 200"
            - "Tower.status == \"ACTIVE\""
            - "Tower.backhaul_accepted_mbps == 500 (the ACCEPTED circuit's committed_mbps, not its measured 505.0)"
            - "${tower_v2} == 2 and ${tower_v1} == 1"
            - "${circuit_v3} == 3 - the circuit absorbed its own two state changes"
            - "Tower.active_sector_count == 0"

      - name: tower_activation_without_an_accepted_circuit_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Tower.PLANNED_to_ACTIVE
          - validations[priority=15]
          - errors[ERR_BACKHAUL_NOT_ACCEPTED]
        distinguishing_aspect: |
          With the only circuit still in state INSTALLED the activation is refused with 409
          ERR_BACKHAUL_NOT_ACCEPTED and the tower stays PLANNED at version 1 - the transition is
          gated on state ACCEPTED specifically, not on the mere existence of a circuit.
        test_recipe:
          setup:
            - "One Tower RB-TWR-001 in status PLANNED with one BackhaulCircuit in state INSTALLED (never accepted)."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
          trigger:
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE", reason: "premature activation" }
              as: NetworkEngineer
              captures: { err_no_backhaul: $.data.error_id }
            - call: "GET /towers/${tower_id}"
              payload: {}
              as: NetworkEngineer
          assert:
            - "Trigger call 1: HTTP 409 and ${err_no_backhaul} == \"ERR_BACKHAUL_NOT_ACCEPTED\""
            - "GET: Tower.status == \"PLANNED\", Tower.version == 1, Tower.backhaul_accepted_mbps == 0"

      - name: tower_decommission_disables_sectors_releases_holds_and_expires_requests
        claim_type: side_effect_execution
        grounds:
          - state_machines.Tower.ACTIVE_to_DECOMMISSIONED
          - state_machines.Sector.ACTIVE_to_DISABLED
          - state_machines.CapacityHold.HELD_to_RELEASED
          - state_machines.ServiceabilityRequest.QUALIFIED_to_EXPIRED
          - calculations.sector_capacity_posture
        distinguishing_aspect: |
          Decommissioning a tower that has a HELD hold but no live subscriber runs the whole
          three-level chain in one request: the Sector becomes DISABLED with capacity_posture FROZEN
          and capacity_policy_note "sector disabled with the tower", the hold becomes RELEASED with
          release_reason SECTOR_DISABLED (not BACKHAUL_DEGRADED and not LAPSED), the request behind
          it becomes EXPIRED with qualified_sector_id cleared, and Tower.active_sector_count drops to 0.
        test_recipe:
          setup:
            - "ACTIVE Tower RB-TWR-001 with an ACTIVE Sector, a QUALIFIED ServiceabilityRequest SR1 and its HELD CapacityHold of 50 Mbps; no Subscriber exists yet."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
