      - name: sample_on_non_pcr_ingredient_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INGREDIENT_NOT_TESTABLE]"]
        distinguishing_aspect: "A LOW_RISK ingredient (requires_pcr == false) cannot receive PCR samples: ERR_INGREDIENT_NOT_TESTABLE even though the plan is ACTIVE and the ingredient belongs to the plan's product."
        test_recipe:
