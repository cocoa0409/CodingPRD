            - "${e_not_prev} == ERR_CRASH_NOT_PREVENTABLE with HTTP 409 — Crash B is still REPORTED, and no DisciplinaryAction row exists for Driver B"
            - "${e_mismatch} == ERR_DRIVER_CRASH_MISMATCH with HTTP 409 — both rows exist and Crash A IS preventable, so the only defect is that Crash A belongs to Driver A; priority 50 reports before the tier check"
            - "${e_tier} == ERR_ACTION_TIER_INSUFFICIENT with HTTP 422 — ordinal(COACHING) < ordinal(SUSPENSION), the tier the driver's 8.0 points earned"
            - "${e_sep} == ERR_SEPARATION_NOT_SUPPORTED with HTTP 422 — SEPARATE requires required_action_tier == TERMINATION_REVIEW, and GET /drivers/${d_a} still reports status ACTIVE with continued_employment_decision PENDING"
            - "${e_no_tp} == ERR_NO_THIRD_PARTY_AT_FAULT with HTTP 422 — the flag lives on Crash B, two hops from the SubrogationDemand being created"
            - "${e_foreign_ev} == ERR_APPEAL_EVIDENCE_INVALID with HTTP 422 — ${ev_b_photo} is PRESERVED but belongs to Crash B, not to this case's crash"
