      - name: registration_determine_then_activate_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Registration.DRAFT_to_DETERMINED
          - state_machines.Registration.DETERMINED_to_ACTIVE
          - calculations.reporter_threshold_determination
          - entities.Registration.fields.registration_number
        distinguishing_aspect: |
          The two happy-path Registration hops with their full side-effect sets:
          determine stamps measured_head 126000 / threshold_head 125000 /
          MANDATORY, and activate mints registration_number MPR-2026-0001 and
          stamps effective_from from the logical clock (2026-08-01T00:00:00Z),
          which no other instance asserts as a literal.
        test_recipe:
          setup:
            - "Alpha Packing with one ACTIVE CATTLE plant whose five-year history is 120000/124000/126000/128000/132000; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_a: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_a}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_a}/activate"
              payload: {}
              as: ProgramAdmin
          assert:
            - "After determine: Registration.${reg_a}.status == DETERMINED, measured_head == 126000, threshold_head == 125000, determination_outcome == MANDATORY"
            - "After determine: registration_number is still null and effective_from is still null"
            - "After activate: Registration.${reg_a}.status == ACTIVE"
            - "After activate: Registration.${reg_a}.registration_number == 'MPR-2026-0001'"
            - "After activate: Registration.${reg_a}.effective_from == 2026-08-01T00:00:00Z (logical clock)"
            - "Registration.${reg_a}.version increments on each of the two writes"

      - name: review_reject_records_note_and_leaves_window_ledger_untouched
