            - "touching load [12:00,16:00) created successfully (captured l2 is a uuid; half-open adjacency is NOT a conflict)"
            - "captured err1 == 'ERR_LOAD_WINDOW_CONFLICT' (true overlap with both existing windows)"

      - name: route_window_closed_adjacency_conflicts
        grounds:
          - validations[priority=18]
          - entities.Route.fields.effective_from
        distinguishing_aspect: |
          Resource Route with closed-interval semantics (different semantics than
          the half-open vehicle windows): a second window for the same route_code
          starting exactly at the existing window's end CONFLICTS, because both
          bounds are inclusive.
        test_recipe:
          setup:
            - "Route R-2018 exists with closed window [2026-01-01T00:00:00Z, 2026-06-30T00:00:00Z]"
          setup_api_calls:
            - call: "POST /hazmat/routes"
              payload: { route_code: "R-2018", allowed_hazard_classes: ["CLASS_3"], is_restricted_corridor: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z" }
              as: Regulator
              captures: { r1: "$.data.id" }
          trigger:
            - call: "POST /hazmat/routes"
              payload: { route_code: "R-2018", allowed_hazard_classes: ["CLASS_3"], is_restricted_corridor: false, effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Regulator
              captures: { err1: "$.data.error_id" }
            - call: "POST /hazmat/routes"
              payload: { route_code: "R-2018", allowed_hazard_classes: ["CLASS_8"], is_restricted_corridor: true, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Regulator
              captures: { r2: "$.data.id" }
            - call: "POST /hazmat/routes"
              payload: { route_code: "R-OTHER", allowed_hazard_classes: ["CLASS_3"], is_restricted_corridor: false, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z" }
              as: Regulator
              captures: { r3: "$.data.id" }
          assert:
            - "captured err1 == 'ERR_ROUTE_WINDOW_CONFLICT' (touching closed endpoints conflict)"
            - "captured r2 is a uuid (gap-starting window accepted)"
            - "captured r3 is a uuid (different route_code never conflicts)"

  # ---------------------------------------------------------------- rule 9
  - rule_id: compensating_invariant
    instances:
      - name: load_item_add_remove_restores_weight
        grounds:
          - calculations.total_table2_weight
          - calculations.load_handling_fee
        distinguishing_aspect: |
          Conserved quantity: VehicleLoad.total_table2_weight_kg (a mass). The
          forward action (add item Y) paired with its compensating action
          (remove item Y) must leave the load's weight and its sealed outputs
          bit-identical to the baseline.
        test_recipe:
          setup:
            - "Carrier APPROVED_ACTIVE, fees paid; load with one item X (254.0 kg TABLE_2, declared_value 1000) already SEALED once (baseline fee 63 = round_half_up(1000*0.0625) + 0 placards since 254.0 < 454.0); item Y is a DOCUMENTED shipment (200.0 kg, declared_value 500)"
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-2019", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN1993", proper_shipping_name: "FLAMMABLE LIQUID, N.O.S.", hazard_class: "CLASS_3", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "FLAMMABLE_LIQUID", reportable_quantity_lbs: 100, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "128" }
              as: Regulator
              captures: { m_id: "$.data.id" }
            - call: "POST /hazmat/packaging-specs"
              payload: { spec_code: "UN4G", authorized_hazard_classes: ["CLASS_3"], max_packing_group: "PG_II", max_net_quantity_kg: 500.0 }
              as: Regulator
              captures: { s_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/vehicles"
              payload: { plate_number: "PLT-2019", vehicle_class: "VAN" }
              as: CarrierAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /hazmat/routes"
              payload: { route_code: "R-2019", allowed_hazard_classes: ["CLASS_3"], is_restricted_corridor: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: Regulator
              captures: { r_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 254.0, declared_value_cents: 1000 }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { shx: "$.data.id" }
            - call: "POST /hazmat/shipments/${shx}/classify"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/shipments/${shx}/shipping-papers"
              payload: { emergency_contact_phone: "+1-800-555-0100", emergency_response_summary: "Isolate 25m", shipper_certification_signed: true }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { px: "$.data.id" }
            - call: "POST /hazmat/shipping-papers/${px}/certify"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /hazmat/shipments/${shx}/verify-packaging"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/shipments/${shx}/document"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 200.0, declared_value_cents: 500 }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { shy: "$.data.id" }
            - call: "POST /hazmat/shipments/${shy}/classify"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/shipments/${shy}/shipping-papers"
              payload: { emergency_contact_phone: "+1-800-555-0100", emergency_response_summary: "Isolate 25m", shipper_certification_signed: true }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { py: "$.data.id" }
            - call: "POST /hazmat/shipping-papers/${py}/certify"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /hazmat/shipments/${shy}/verify-packaging"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/shipments/${shy}/document"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/vehicles/${v_id}/loads"
              payload: { route_id: "${r_id}", planned_departure_at: "2026-05-10T08:00:00Z", planned_arrival_at: "2026-05-10T12:00:00Z" }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { l_id: "$.data.id" }
            - call: "POST /hazmat/vehicle-loads/${l_id}/items"
              payload: { shipment_id: "${shx}", position_code: "A1" }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/vehicle-loads/${l_id}/seal"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { base_w: "$.data.total_table2_weight_kg", base_fee: "$.data.handling_fee_cents", base_pl: "$.data.required_placards" }
            - call: "POST /hazmat/vehicle-loads/${l_id}/unseal"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
          trigger:
            - call: "POST /hazmat/vehicle-loads/${l_id}/items"
              payload: { shipment_id: "${shy}", position_code: "A2" }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "GET /hazmat/vehicle-loads/${l_id}"
              as: Regulator
              captures: { w_with_y: "$.data.total_table2_weight_kg" }
            - call: "DELETE /hazmat/vehicle-loads/${l_id}/items/${shy}"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "GET /hazmat/vehicle-loads/${l_id}"
              as: Regulator
              captures: { w_after: "$.data.total_table2_weight_kg" }
            - call: "POST /hazmat/vehicle-loads/${l_id}/seal"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { fee_after: "$.data.handling_fee_cents", pl_after: "$.data.required_placards" }
          assert:
            - "captured base_w == 254.0 and base_fee == 63 and base_pl == [] (baseline seal)"
            - "captured w_with_y == 454.0 (forward action)"
            - "captured w_after == base_w (compensating remove restores the conserved mass exactly)"
            - "captured fee_after == base_fee and pl_after == base_pl (no drift in derived outputs after the add/remove round-trip)"

      - name: invoice_void_restores_outstanding
        grounds:
          - calculations.outstanding_balance
          - state_machines.RegistrationInvoice.OPEN_to_VOID
        distinguishing_aspect: |
          Conserved quantity: money — Carrier.outstanding_balance_cents must
          equal the pinned equation sum over non-VOID invoices of
          (total_due_cents - paid_cents); assessing a REINSTATEMENT invoice
          (forward) then voiding it (compensating) returns the balance to its
          pre-action value.
        test_recipe:
          setup:
            - "Carrier APPROVED_ACTIVE with INITIAL invoice PAID (outstanding 0); carrier suspended then reinstated, creating an OPEN REINSTATEMENT invoice of 75000"
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-2020", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
              captures: { out0: "$.data.outstanding_balance_cents" }
            - call: "POST /hazmat/carriers/${c_id}/suspend"
              payload: {}
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/reinstate"
              payload: {}
              as: Regulator
              captures: { c_st: "$.data.registration_status" }
            - call: "GET /hazmat/carriers/${c_id}/registration-invoices"
              as: Regulator
              captures: { inv2_id: "$.data[1].id", inv2_kind: "$.data[1].kind", inv2_due: "$.data[1].total_due_cents" }
            - call: "GET /hazmat/carriers/${c_id}"
              as: Regulator
              captures: { out1: "$.data.outstanding_balance_cents" }
          trigger:
            - call: "POST /hazmat/registration-invoices/${inv2_id}/void"
              payload: {}
              as: Regulator
              captures: { inv2_st: "$.data.status" }
            - call: "GET /hazmat/carriers/${c_id}"
              as: Regulator
              captures: { out2: "$.data.outstanding_balance_cents" }
          assert:
            - "captured out0 == 0 (baseline after paying INITIAL 26250)"
            - "captured inv2_kind == 'REINSTATEMENT' and inv2_due == 75000 and out1 == 75000 (forward action)"
            - "captured inv2_st == 'VOID' and out2 == 0 (compensating void restores the conserved equation sum(non-VOID (total_due - paid)) == 0)"
