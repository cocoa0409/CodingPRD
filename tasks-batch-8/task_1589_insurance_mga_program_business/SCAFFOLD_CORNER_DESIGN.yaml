  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails 401 ERR_UNAUTHENTICATED before any other check (priority 1 beats all)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mga/programs", payload: {}, as: "", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401 (no headers presented)"

      - name: forbidden_beats_state_priority_ordering
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=7]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Carrier B's underwriter terminating carrier A's PROPOSED program violates authorization (p2) and transition validity (p7): ERR_FORBIDDEN (403) wins over ERR_INVALID_STATE."
        test_recipe:
          setup: ["carrier A with a PROPOSED program; carrier B exists"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier PA", naic_code: "NAIC-PA", contact_email: "a@pa.com" }, as: PlatformAdmin, captures: { caA: $.data.id } }
            - { call: "POST /mga/carriers", payload: { name: "Carrier PB", naic_code: "NAIC-PB", contact_email: "b@pb.com" }, as: PlatformAdmin, captures: { caB: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${caA}", name: "PA Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /mga/programs/${prog}/terminate", payload: { termination_reason: "hostile" }, as: CarrierUnderwriter, as_user_id: "${caB}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (403) — authorization (p2) precedes state validation (p7); program stays PROPOSED"

      - name: not_found_beats_business_priority_ordering
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Binding a non-existent policy id returns 404 ERR_NOT_FOUND (existence p3) rather than any state/fiscal error (which would all also fail)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mga/policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/bind", payload: {}, as: MGAUnderwriter, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: claim_occurrence_outside_coverage_period
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_OUTSIDE_COVERAGE_PERIOD]"]
        distinguishing_aspect: "Occurrence 2027-08-05 after policy expiry 2027-08-01 (half-open term) -> ERR_OUTSIDE_COVERAGE_PERIOD even though the policy is ISSUED."
        test_recipe:
          setup: ["ACTIVE program; issued policy term [2026-08-01, 2027-08-01); ACTIVE LIABILITY appointment window to 2027-12-31; clock 2027-08-06"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier OC", naic_code: "NAIC-OC", contact_email: "a@oc.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
