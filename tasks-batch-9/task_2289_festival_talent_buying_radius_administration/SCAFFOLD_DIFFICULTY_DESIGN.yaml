  - rule_id: non_linear_state_machine
    instances:

      - name: offer_negotiation_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.Offer.ISSUED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_ISSUED
          - entities.Offer.fields.round_number
          - validations[priority=66]
        distinguishing_aspect: |
          A true cycle on Offer: the ISSUED -> COUNTERED -> ISSUED loop is traversed twice and
          terminates on the loop counter, not on a state. Only the promoter-side edge increments
          round_number, so three counters produce round_number 3 and the fourth promoter
          issuance is refused while the row stays parked in COUNTERED.
        test_recipe:
          setup:
            - "Single-tier Harbor Lights fixture (HEADLINER at allocation_pct 1.00, allocation_cents 9500000) with one flagship stage."
            - "One ELECTRONIC act with draw_score 72, so the guarantee ceiling is min(9500000, 9500000, floor(1800000 * 1.00)) == 1800000 for every round."
            - "One DRAFT offer at guarantee 1500000 expiring 2026-09-15T00:00:00Z, clock at 2026-08-01."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest_id: $.data.id, fest_v: $.data.version }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.00, max_slots: 2, genre_focus: "ELECTRONIC" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
            - call: "POST /festival-ops/festivals/${fest_id}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_main_id: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 150 }
              as: TalentBuyer
              captures: { artist_a1: $.data.id }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_a1}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 1500000, production_fee_cents: 0, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { offer_o1: $.data.id }
            - call: "POST /festival-ops/offers/${offer_o1}/issue"
              payload: {}
              as: TalentBuyer
          trigger:
            - call: "POST /festival-ops/offers/${offer_o1}/counter"
              payload: { counter_guarantee_cents: 1750000, counter_note: "Agency asks for 17.5k" }
              as: ArtistRep
              as_user_id: "${artist_a1}"
            - call: "POST /festival-ops/offers/${offer_o1}/revise"
              payload: { guarantee_cents: 1600000 }
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_o1}/counter"
              payload: { counter_guarantee_cents: 1750000, counter_note: "Still short" }
              as: ArtistRep
              as_user_id: "${artist_a1}"
            - call: "POST /festival-ops/offers/${offer_o1}/revise"
              payload: { guarantee_cents: 1700000 }
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_o1}/counter"
              payload: { counter_guarantee_cents: 1800000, counter_note: "Last ask" }
              as: ArtistRep
              as_user_id: "${artist_a1}"
            - call: "POST /festival-ops/offers/${offer_o1}/revise"
              payload: { guarantee_cents: 1750000 }
              as: TalentBuyer
          assert:
            - "after the first issue Offer.${offer_o1}.status == ISSUED and round_number == 1"
            - "each counter leaves round_number unchanged and sets status COUNTERED with counter_guarantee_cents recorded — only promoter-side edges consume rounds"
            - "the first revise returns status ISSUED, round_number == 2, guarantee_cents == 1600000, and counter_guarantee_cents / counter_billing_position / counter_set_length_minutes / counter_note all reset to null"
            - "the second revise returns status ISSUED, round_number == 3, guarantee_cents == 1700000"
            - "the third revise is rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED (409) because round_number is already MAX_NEGOTIATION_ROUNDS (3)"
            - "after the rejection Offer.${offer_o1}.status == COUNTERED, round_number == 3 and guarantee_cents is still 1700000 — the loop terminates without leaving the cycle"
            - "guarantee_ceiling_cents is re-stamped as 1800000 on every successful revise, so the rejection is the round counter and not the fiscal gate"

      - name: booking_parallel_contract_and_settlement_dimensions
        grounds:
          - state_machines.Booking.contract_status
          - state_machines.Booking.settlement_status
          - state_machines.Booking.settlement_status.BALANCE_DUE_to_SETTLED
          - state_machines.Booking.contract_status.COUNTERSIGNED_to_CLOSED_OUT
        distinguishing_aspect: |
          Parallel dimensions on Booking, a different entity from the Offer cycle: the deposit is
          paid while the contract dimension is still PENDING_RIDER, so settlement reaches
          DEPOSIT_PAID before the rider is settled, and the two dimensions then advance
