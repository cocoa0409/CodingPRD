      - name: corner_advance_batch_before_window_start_returns_409
        claim_type: precondition_enforcement
        grounds: [state_machines.LabelPrintBatch.transitions.SCHEDULED_to_PRINTING, validations.priority_40_ERR_INVALID_STATE]
        distinguishing_aspect: "The SCHEDULED -> PRINTING precondition 'logical clock now >= batch.window_start' is a timing guard, not a state guard: the same call on the same SCHEDULED batch is refused at 00:00 and accepted once the clock reaches the window_start instant exactly."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; store STORE-101 with capacity 5."
