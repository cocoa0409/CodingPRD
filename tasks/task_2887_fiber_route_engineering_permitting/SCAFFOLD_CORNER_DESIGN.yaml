          assert:
            - "${v_after_segment} is ${v_create} plus 1"
            - "${v_after_budget} is ${v_after_segment} plus 1"
            - "${v_after_lock} is ${v_after_budget} plus 1"
            - "the method selection accepted ${v_after_lock} as current, and the RouteSegment response's Route rollups reflect the write"
            - "GET /routes/${route_id} after the last trigger reports version ${v_after_lock} plus 1 with total_preliminary_cost_cents 630870"
            - "${v_after_method} is the RouteSegment.version, a counter on its own row and independent of the Route counter"

