            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { a1: "$.data[0].id", a2: "$.data[1].id", a3: "$.data[2].id" } }
          trigger:
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b1}" }, as: ContractorOps, captures: { s1: $.data.status } }
            - { call: "POST /busops/assignments/${a2}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b2}" }, as: ContractorOps, captures: { s2: $.data.status } }
            - { call: "POST /busops/assignments/${a3}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b3}" }, as: ContractorOps, captures: { err3: $.data.error_id } }
          assert:
            - "${s1} == CONFIRMED"
            - "${s2} == CONFIRMED (adjacent at minute 480: half-open [420,480) vs [480,540) do not intersect)"
            - "${err3} == ERR_DRIVER_OVERLAP_CONFLICT ([470,540) intersects [420,480))"
            - "Assignment.${a3}.status == PLANNED and driver_id still null"
      - name: charter_bus_buffered_window_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_CHARTER_BUS_UNAVAILABLE]
          - state_machines.CharterTrip.APPROVED_to_SCHEDULED
        distinguishing_aspect: |
          Resource Bus, BUFFERED CLOSED-interval semantics: each charter occupies
          [pickup-30, return+30] inclusive on its trip_date — a second charter
          at pickup 740 intersects the first's buffer ending 750, while pickup
          800 (buffered start 770 > 750) is free. Different entity (Bus) and
          different interval arithmetic from the half-open driver rule.
        test_recipe:
          setup:
            - "Contract ACTIVE; bus capacity 48; charters A (pickup 600 return 720, trip 2026-06-05), B (pickup 740 return 800), C (pickup 800 return 900) — each QUOTED and APPROVED with deposit 0"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-OV2", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-O2", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BOV2", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/charter-trips", payload: { contract_id: "${c_id}", purpose: "Museum A", trip_date: "2026-06-05", pickup_minute: 600, return_minute: 720, estimated_hours_x10: 20, estimated_miles: 40, passenger_count: 20 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { cha: $.data.id } }
            - { call: "POST /busops/charter-trips/${cha}/quote", payload: {}, as: ContractorOps, captures: { cha_v: $.data.version } }
            - { call: "POST /busops/charter-trips/${cha}/approve", payload: { expected_charter_trip_version: "${cha_v}", deposit_cents: 0 }, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/charter-trips", payload: { contract_id: "${c_id}", purpose: "Museum B", trip_date: "2026-06-05", pickup_minute: 740, return_minute: 800, estimated_hours_x10: 10, estimated_miles: 20, passenger_count: 20 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { chb: $.data.id } }
            - { call: "POST /busops/charter-trips/${chb}/quote", payload: {}, as: ContractorOps, captures: { chb_v: $.data.version } }
            - { call: "POST /busops/charter-trips/${chb}/approve", payload: { expected_charter_trip_version: "${chb_v}", deposit_cents: 0 }, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/charter-trips", payload: { contract_id: "${c_id}", purpose: "Museum C", trip_date: "2026-06-05", pickup_minute: 800, return_minute: 900, estimated_hours_x10: 17, estimated_miles: 30, passenger_count: 20 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { chc: $.data.id } }
            - { call: "POST /busops/charter-trips/${chc}/quote", payload: {}, as: ContractorOps, captures: { chc_v: $.data.version } }
            - { call: "POST /busops/charter-trips/${chc}/approve", payload: { expected_charter_trip_version: "${chc_v}", deposit_cents: 0 }, as: DistrictAdmin, as_user_id: "${d_id}" }
          trigger:
            - { call: "POST /busops/charter-trips/${cha}/schedule", payload: { assigned_bus_id: "${b_id}" }, as: ContractorOps, captures: { sta: $.data.status } }
            - { call: "POST /busops/charter-trips/${chb}/schedule", payload: { assigned_bus_id: "${b_id}" }, as: ContractorOps, captures: { errb: $.data.error_id } }
            - { call: "POST /busops/charter-trips/${chc}/schedule", payload: { assigned_bus_id: "${b_id}" }, as: ContractorOps, captures: { stc: $.data.status } }
          assert:
            - "${sta} == SCHEDULED (first claim on the bus wins the window)"
            - "${errb} == ERR_CHARTER_BUS_UNAVAILABLE (B buffered [710,830] intersects A buffered [570,750] — closed intervals)"
            - "${stc} == SCHEDULED (C buffered [770,930] is clear of A's 750 buffer end)"
            - "CharterTrip.${chb}.status == APPROVED (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: doubling_conserves_route_coverage
        grounds:
          - state_machines.Assignment.PLANNED_to_CONFIRMED
          - entities.ServiceDay.fields.required_routes
          - entities.ServiceDay.fields.covered_routes
          - entities.ServiceDay.fields.uncovered_routes
        distinguishing_aspect: |
          Conserved quantity: route coverage count. The doubling decision moves
          one route from uncovered to covered without changing the total:
          required_routes == covered_routes + uncovered_routes holds before
          (2 == 1+1) and after (2 == 2+0). No route is created or destroyed.
