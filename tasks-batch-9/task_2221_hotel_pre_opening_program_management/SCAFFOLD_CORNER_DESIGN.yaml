  - section: endpoints
    instances:
      - name: readiness_read_model_matches_the_recomputed_components_after_baselining
        claim_type: computed_read
        grounds:
          - "§1.5 GET /pre-opening/programs/{id}/readiness declares an inline output carrying readiness_posture, readiness_score, systems_ratio, staffing_ratio, permit_ratio, schedule_term, schedule_slip_days, both projected dates, variant_gap_days, the two cost_at_completion variants, payroll_accrual_cents, contingency_liability_cents and committed_room_nights; §1.3 readiness_posture substitutes 0.0 for both empty denominators."
        distinguishing_aspect: "The read model must be recomputed, not stored: with no system, no plan and no permit the three ratios are 0.0 while schedule_term is 1.0, so readiness_score reads exactly 0.2 and posture MOBILIZING."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' baselined by pd-baseline-1 over a single 30-day CONSTRUCTION_COMPLETE milestone, which was started and then completed at clock 2026-10-01: schedule_state CONSTRUCTION_COMPLETE, projected_opening_date_committed 2026-10-15, schedule_slip_days 0, version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 30, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_cc: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-baseline-1"
            - call: "POST /pre-opening/milestones/${ms_cc}/start"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/milestones/${ms_cc}/complete"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-1"
          trigger:
            - call: "GET /pre-opening/programs/${prog_id}/readiness"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-1"
          assert:
            - "response status is 200"
            - "data.systems_ratio == 0.0 (required_system_count is 0, so the ratio is substituted with 0.0 rather than 1.0)"
            - "data.staffing_ratio == 0.0 (hiring_plan_count is 0)"
            - "data.permit_ratio == 0.0 (no mandatory permit is ISSUED)"
            - "data.schedule_slip_days == 0"
            - "data.schedule_term == 1.0"
            - "data.readiness_score == 0.2 (0.30*0.0 + 0.25*0.0 + 0.25*0.0 + 0.20*1.0)"
            - "data.readiness_posture == 'MOBILIZING'"
            - "data.projected_opening_date_optimistic == '2026-10-15'"
            - "data.projected_opening_date_committed == '2026-10-15'"
            - "data.variant_gap_days == 0"
            - "data.cost_at_completion_commitment_cents == 0"
            - "data.cost_at_completion_accrual_cents == 0"
            - "data.payroll_accrual_cents == 0"
            - "data.contingency_liability_cents == 0"
            - "data.committed_room_nights == 0"

      - name: budget_line_create_then_list_filtered_by_category
        claim_type: standard_crud
        grounds:
          - "§1.5 declares POST /pre-opening/budget-lines and GET /pre-opening/programs/{id}/budget-lines with a category filter; §1.1 BudgetLine derives available_cents from authorized_cents minus committed_cents and category is unique per (program_id, category)."
        distinguishing_aspect: "Three lines are created, one per category, and the category filter narrows the list to exactly one row while total_count reports the filtered set rather than all three."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_id}", category: "PAYROLL", authorized_cents: 3000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { bl_payroll: "$.data.id" }
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_id}", category: "MARKETING", authorized_cents: 500000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { bl_marketing: "$.data.id" }
            - call: "GET /pre-opening/programs/${prog_id}/budget-lines?category=MARKETING"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
          assert:
            - "first trigger response status is 201"
            - "first trigger response data.authorized_cents == 3000000 and data.available_cents == 3000000 and data.committed_cents == 0 and data.spent_cents == 0"
            - "second trigger response status is 201"
            - "second trigger response data.available_cents == 500000"
            - "third trigger response status is 200"
            - "third trigger response total_count == 1"
            - "third trigger response returns only the MARKETING row, whose id == ${bl_marketing}"

      - name: assign_orientation_links_hire_to_session_and_bumps_enrolled_count
        claim_type: cross_reference_link
        grounds:
          - "§1.5 POST /pre-opening/hires/{id}/assign-orientation takes orientation_session_id and links the two entities; §1.1 TrainingSession.enrolled_count is computed from the hires pointing at the session, and §1.6 ERR_TRAINING_DEPARTMENT_MISMATCH shows the link is validated against the plan's department."
        distinguishing_aspect: "One call must write both ends of the association: the hire gains orientation_session_id and the session's enrolled_count rises from 0 to 1, and both ends are observable from their own read endpoints."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One ROOMS plan (headcount_target 4, wave_start_date 2026-09-10) with one OFFERED hire that has no orientation_session_id, and one SCHEDULED ROOMS session in TR-1 on 2026-09-14 09:00-12:00 with capacity 5 and enrolled_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_id}", department: "ROOMS", headcount_target: 4, wave_start_date: "2026-09-10" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { plan_rooms: "$.data.id" }
            - call: "POST /pre-opening/training-sessions"
              payload: { program_id: "${prog_id}", title: "Rooms orientation", training_room_code: "TR-1", starts_at: "2026-09-14T09:00:00Z", ends_at: "2026-09-14T12:00:00Z", capacity: 5, department: "ROOMS" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { sess_orient: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_rooms}", full_name: "A. Keeper", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-15" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { hire_1: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/hires/${hire_1}/assign-orientation"
              payload: { orientation_session_id: "${sess_orient}" }
              as: TalentManager
              as_user_id: "tm-1"
          assert:
            - "the hire's orientation_session_id was null before the trigger"
            - "response status is 200"
            - "data.orientation_session_id == ${sess_orient}"
            - "GET /pre-opening/programs/${prog_id}/training-sessions returns the session with enrolled_count == 1"
            - "GET /pre-opening/hires?orientation_session_id=${sess_orient} returns exactly the hire ${hire_1}"

      - name: recompute_schedule_reproduces_the_same_dates_without_changing_schedule_state
        claim_type: action_endpoint
        grounds:
          - "§1.5 POST /pre-opening/programs/{id}/recompute-schedule reruns calculations.critical_path_schedule and is allowed to ProgramDirector and ConstructionManager; §1.3 makes the forward pass a pure function of the stored rows, so replaying it on unchanged rows is idempotent in its outputs while §1.0 still increments version on the write."
        distinguishing_aspect: "Recomputing over unchanged inputs must be arithmetically stable — the same projected dates and the same schedule_slip_days 0 — while still counting as a program write that advances version to 3 and leaves schedule_state CONSTRUCTION_COMPLETE."
