  # ---------------------------------------------------------------------------
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_submit_gated_by_campaign_state
        grounds:
          - validations[priority=6]
          - errors[ERR_CAMPAIGN_NOT_OPEN]
          - state_machines.ApplicationCampaign
        distinguishing_aspect: |
          Entity pair (Application -> ApplicationCampaign): submission is rejected while the
