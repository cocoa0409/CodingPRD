          funded ratio to 0 bps, flipping the posture to FROZEN in the same
          response - so the guard protects against negative balances, not
          against emptiness.
        test_recipe:
          setup:
            - "The conference is OPERATING with reserve_target_cents 18000000 and a 12000000 reserve balance at RESERVE_RESTRICTED-free OPEN posture."
          setup_api_calls:
