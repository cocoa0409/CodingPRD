              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_id}", wave_code: "W1", cutoff_at: "2026-08-05T08:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { wave_id: $.data.id }
            - call: "POST /delivery-waves/${wave_id}/slot-orders"
