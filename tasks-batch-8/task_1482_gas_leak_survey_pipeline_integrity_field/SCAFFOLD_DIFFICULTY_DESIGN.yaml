          - state_machines.Leak
        distinguishing_aspect: |
          Depth-3 cascade: system clock advance -> ExcavationPermit GRANTED->EXPIRED
          triggers RepairOrder dispatch_status revert (DISPATCHED -> PENDING_DISPATCH)
          which itself triggers Leak status revert (UNDER_REPAIR -> REPAIR_SCHEDULED)
          which triggers PipeSegment counter shift (open_gradeX_count incremented
          again, posture recomputed). Each link caused by the previous link, not
          the original clock event. Originating trigger = system (clock advance).
