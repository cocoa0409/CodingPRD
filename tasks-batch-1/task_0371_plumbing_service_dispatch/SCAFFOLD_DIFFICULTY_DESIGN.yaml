              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "DRAIN", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_a_id: $.data.id, job_a_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_a_id}", technician_id: "${tech_id}", window_start: "2026-05-25T11:00:00.000Z", window_end: "2026-05-25T13:00:00.000Z", eta: "2026-05-25T11:15:00.000Z", expected_job_version: "${job_a_v0}" }
              as: Dispatcher
              captures: { asg_a_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_a_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "REPIPE", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_b_id: $.data.id, job_b_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_b_id}", technician_id: "${tech_id}", window_start: "2026-05-25T12:00:00.000Z", window_end: "2026-05-25T14:00:00.000Z", eta: "2026-05-25T12:15:00.000Z", expected_job_version: "${job_b_v0}" }
              as: Dispatcher
