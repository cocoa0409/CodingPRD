# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, taxonomy from references/claim-extraction-guide.md.
# excluded_because: stubs cite a §1.8 instance by name; full recipes are empty-DB reachable.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_station_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Station, "endpoints.POST /stations"]
        distinguishing_aspect: "POST /stations with all required fields returns 201; response carries server-minted id, created_at, version=1, and next_certificate_seq=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stations"
              payload: { name: "Acme Inspections", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 2 }
              as: StationManager
              captures: { st_id: $.data.id, seq: $.data.next_certificate_seq, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Station.${st_id}.next_certificate_seq == 1"
            - "Station.${st_id}.version == 1"
            - "Station.${st_id}.state_code == CA"

      - name: get_station_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Station, "errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET /stations/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_station_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Station.fields.repair_cost_limit_cents, "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /stations omitting repair_cost_limit_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stations"
              payload: { name: "NoLimit", state_code: "CA", certificate_serial_prefix: "CA-" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_appointment_bad_vin_length_returns_422
        claim_type: Type Constraints
        grounds: [entities.Appointment.fields.vehicle_vin, "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /appointments with a VIN that is not exactly 17 chars returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A station with a PASSENGER profile and one lane."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "VinStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "SHORTVIN", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_appointment_invalid_enum_kind_returns_422
        claim_type: Type Constraints
        grounds: [entities.Appointment.fields.kind, "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /appointments with kind not in {APPOINTMENT, WALK_IN} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A station with a PASSENGER profile and one lane."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "EnumStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "DROP_OFF", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: appointment_default_status_is_booked
        claim_type: Defaults
        grounds: [entities.Appointment.fields.status]
        distinguishing_aspect: "A newly created Appointment defaults to status=BOOKED."
        test_recipe:
          setup: ["A station with a PASSENGER profile and one lane."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "DefStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id, status: $.data.status }
          assert:
            - "Appointment.${appt_id}.status == BOOKED"

      - name: vehicle_class_profile_reinspection_window_default_30
        claim_type: Defaults
        grounds: [entities.VehicleClassProfile.fields.reinspection_window_days, "endpoints.POST /vehicle-class-profiles"]
        distinguishing_aspect: "POST /vehicle-class-profiles omitting reinspection_window_days applies the default 30."
        test_recipe:
          setup: ["A station exists."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "WinStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_TRUCK", base_fee_cents: 3000, obd_required: true, checklist_item_count: 3 }
              as: StationManager
              captures: { prof_id: $.data.id, window: $.data.reinspection_window_days }
          assert:
            - "VehicleClassProfile.${prof_id}.reinspection_window_days == 30"

      - name: inspection_record_copies_vin_and_class_from_appointment
        claim_type: Computed Fields
        grounds: [entities.InspectionRecord.fields.vehicle_vin, entities.InspectionRecord.fields.vehicle_class, entities.InspectionRecord.fields.station_id]
        distinguishing_aspect: "POST /inspection-records copies station_id, vehicle_vin, vehicle_class from the consumed appointment/lane; reinspection_index defaults 0, status IN_PROGRESS."
        test_recipe:
          setup: ["A CHECKED_IN PASSENGER appointment for VIN 1HGCM82633A004352."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "CpStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
          trigger:
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { rec_id: $.data.id, vin: $.data.vehicle_vin, cls: $.data.vehicle_class, idx: $.data.reinspection_index, status: $.data.status }
          assert:
            - "InspectionRecord.${rec_id}.vehicle_vin == 1HGCM82633A004352"
            - "InspectionRecord.${rec_id}.vehicle_class == PASSENGER"
            - "InspectionRecord.${rec_id}.station_id == ${st_id}"
            - "InspectionRecord.${rec_id}.reinspection_index == 0"
            - "InspectionRecord.${rec_id}.status == IN_PROGRESS"

      - name: list_vehicle_class_profiles_pagination_envelope
        claim_type: Listing
        grounds: [entities.VehicleClassProfile, "endpoints.GET /vehicle-class-profiles"]
        distinguishing_aspect: "GET /vehicle-class-profiles returns response_type=array with pagination meta total_count and has_more."
        test_recipe:
          setup: ["A station with two profiles."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "PgStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "MOTORCYCLE", base_fee_cents: 1500, obd_required: false, checklist_item_count: 1, reinspection_window_days: 30 }
              as: StationManager
          trigger:
            - call: "GET /vehicle-class-profiles"
              payload: { station_id: "${st_id}" }
              as: StationManager
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"

      - name: immutable_state_report_line_has_no_version_field
        claim_type: Immutability
        grounds: [entities.StateReportLine]
        distinguishing_aspect: "StateReportLine has common_fields:false — it carries only id and created_at, no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["A batch with one attached line for a terminal record."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "ImStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { rec_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "BRAKES", outcome: "FAIL", severity: "MAJOR" }
              as: Inspector
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
            - call: "POST /inspection-records/${rec_id}/decide"
              payload: {}
              as: Inspector
            - call: "POST /state-report-batches"
              payload: { station_id: "${st_id}", period_label: "2026-06" }
              as: StationManager
              captures: { batch_id: $.data.id }
            - call: "POST /state-report-batches/${batch_id}/lines"
              payload: { record_id: "${rec_id}" }
              as: StationManager
              captures: { line_result: $.data.reported_result, line_fee: $.data.fee_cents }
          trigger:
            - call: "GET /state-report-lines"
              payload: { record_id: "${rec_id}" }
              as: StationManager
          assert:
            - "state-report-lines[0].reported_result == FAIL"
            - "state-report-lines[0].fee_cents == 3700"

  # =========================================================================
  - section: state_machines
    instances:
      - name: check_in_already_checked_in_appointment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Appointment.BOOKED_to_CHECKED_IN, "errors[ERR_INVALID_STATE]", "validations[priority=5]"]
        distinguishing_aspect: "Checking in an Appointment already in CHECKED_IN returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A CHECKED_IN appointment."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "CkStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
          trigger:
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: abort_terminal_aborted_record_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.InspectionRecord.IN_PROGRESS_to_ABORTED, "errors[ERR_INVALID_STATE]", "validations[priority=5]"]
        distinguishing_aspect: "Aborting an already-ABORTED record (terminal) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ABORTED inspection record."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "AbStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { rec_id: $.data.id }
            - call: "POST /inspection-records/${rec_id}/abort"
              payload: {}
              as: StationManager
          trigger:
            - call: "POST /inspection-records/${rec_id}/abort"
              payload: {}
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: no_show_before_scheduled_end_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Appointment.BOOKED_to_NO_SHOW, "errors[ERR_INVALID_STATE]", "endpoints.POST /_clock/set_current_utc"]
        distinguishing_aspect: "Marking no-show before current_clock >= scheduled_end is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A BOOKED appointment [09:00,09:30) with clock set to 09:10 (before end)."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "NsStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "APPOINTMENT", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:10:00Z" }
              as: StationManager
          trigger:
            - call: "POST /appointments/${appt_id}/no-show"
              payload: {}
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: open_record_from_booked_not_checked_in_returns_invalid_state
        claim_type: guarded transitions
        grounds: [state_machines.Appointment.CHECKED_IN_to_CONSUMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /inspection-records on a BOOKED (not CHECKED_IN) appointment returns ERR_INVALID_STATE (409); cross-entity guard on the appointment's state."
        test_recipe:
          setup: ["A BOOKED (not checked-in) appointment."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "GdStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_appointment_releases_slot_allows_reuse
        claim_type: Side Effect Execution
        grounds: [state_machines.Appointment.BOOKED_to_CANCELLED, "validations[priority=8]"]
        distinguishing_aspect: "Cancelling a BOOKED appointment releases its lane slot so a new appointment in the same window succeeds (201)."
        test_recipe:
          setup: ["A BOOKED appointment [09:00,09:30) on a lane with 0 buffer, then cancelled."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "RlStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /appointments"
