            - "Level BASIC; premium MUG, lot of 10 (available 10); donor D; membership M; drive DRV ON_AIR"
            - "Pledge P: ONE_TIME 12000 with MUG, auto-reserved (lot available 9, reserved 1), still PLEDGED"
