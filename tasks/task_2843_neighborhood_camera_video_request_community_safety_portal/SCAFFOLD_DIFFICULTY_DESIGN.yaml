            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r2_id}", label: "D2", grid_x_m: 0, grid_y_m: 20, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r2_id}"
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r3_id}", label: "D3", grid_x_m: 0, grid_y_m: 30, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r3_id}"
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-08T00:00:00Z", window_end_utc: "2026-08-08T06:00:00Z", area_label: "400 Block" }
              as: Officer
              as_user_id: "${off_req_id}"
