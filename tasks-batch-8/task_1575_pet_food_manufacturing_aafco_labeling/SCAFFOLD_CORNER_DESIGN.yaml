# =============================================================================
# §1.9 Scaffold Corner Design — Pet Food Manufacturing & AAFCO Labeling
# Coverage Index for Non-Difficulty Tests (breadth probe; complements §1.8).
# Sections/claim_types follow references/claim-extraction-guide.md.
# Every setup chain replays cleanly against SCAFFOLD.yaml §1.5 from empty DB.
# Negative trigger calls always capture $.data.error_id (lint negative marker).
# OCC expected_*_version payloads always reference a captured ${var}.
#
# Shared chains (written out in full per instance):
#   DRAFT formula:        brand -> formula
#   NUTRIENT_REVIEW:      + ingredient -> line(s) -> submit-nutrient-review
#   SUBSTANTIATED:        + supplier(+approve) -> pairing(+approve)
#                         -> COMPLIANT profile (26/9/3/10 + Ca 1.0 / P 0.8)
#                         -> submit -> substantiate
#   LOCKED / batch:       + lock -> GET formula (version) -> create batch (OCC)
#   IN_PROCESS/COMPLETED: + release -> start-run -> complete
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section 1: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: brand_owner_creation_succeeds_with_declared_fields
        claim_type: creation
        grounds:
          - entities.BrandOwner
          - entities.BrandOwner.fields.status
        distinguishing_aspect: |
          POST /petfood/brand-owners with all required input fields returns 201
          and echoes legal_name, fein, contact_email; the system assigns status
          ACTIVE (declared default) and a server-minted id.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Corner Brands LLC", fein: "551000010", contact_email: "ops@corner.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
          assert:
            - "http status == 201"
            - "response.data.legal_name == 'Corner Brands LLC' and response.data.fein == '551000010'"
            - "BrandOwner.${bo_id}.status == ACTIVE"
            - "response.data.id is a server-minted UUID (no type prefix)"

      - name: create_calls_missing_required_fields_fail
        claim_type: required_fields
        grounds:
          - entities.BrandOwner.fields.fein
          - entities.Ingredient.fields.nutrient_matrix
          - entities.Formula.fields.species
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Each create endpoint rejects a body missing a declared required input
          (fein on brand-owners, nutrient_matrix on ingredients, species on
          formulas) with ERR_INVALID_REQUEST (400) and creates nothing.
        test_recipe:
          setup:
            - "One BrandOwner exists so the nested formula create has a valid parent"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Req Fields Co", fein: "551000020", contact_email: "ra@reqf.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
          trigger:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "No Fein Co", contact_email: "x@nofein.example" }
              as: PlatformAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Corn Gluten Meal", ingredient_code: "CGML0001", allergen_class: "GRAIN" }
              as: FormulationScientist
              captures: { err2: $.data.error_id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "RF-001", product_name: "No Species", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_REQUEST (missing fein), http 400"
            - "err2 == ERR_INVALID_REQUEST (missing nutrient_matrix), http 400"
            - "err3 == ERR_INVALID_REQUEST (missing species), http 400"

      - name: ingredient_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Ingredient.fields.requires_coa
          - entities.Ingredient.fields.status
        distinguishing_aspect: |
          Omitting requires_coa applies the declared default true, and status
          starts at ACTIVE; neither value is supplied by the client.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Chicken By-Product Meal", ingredient_code: "CBPM0001", nutrient_matrix: { CRUDE_PROTEIN: 0.60, CRUDE_FAT: 0.12, MOISTURE: 0.08 }, allergen_class: "POULTRY" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
          assert:
            - "Ingredient.${ing_id}.requires_coa == true (default applied)"
            - "Ingredient.${ing_id}.status == ACTIVE (default applied)"

      - name: formula_creation_assigns_system_and_computed_fields
        claim_type: system_fields
        grounds:
          - entities.Formula.fields.revision_number
          - entities.Formula.fields.total_batch_count
          - entities.Formula.fields.open_recall_flag
        distinguishing_aspect: |
          A newly created formula carries server-assigned fields: version == 1,
          revision_number == 1, status DRAFT, and the computed counters
          total_batch_count == 0 and open_recall_flag == false.
        test_recipe:
          setup:
            - "One BrandOwner exists"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Sys Fields Co", fein: "551000030", contact_email: "ra@sysf.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
          trigger:
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "SF-001", product_name: "Sys Fields Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
          assert:
            - "Formula.${f_id}.version == 1 and revision_number == 1"
            - "Formula.${f_id}.status == DRAFT"
            - "Formula.${f_id}.total_batch_count == 0 and open_recall_flag == false"
            - "created_at and updated_at are ISO-8601 UTC timestamps assigned by the server"

      - name: brand_owner_computed_counters_start_at_zero
        claim_type: computed_fields
        grounds:
          - entities.BrandOwner.fields.complaint_score
          - entities.BrandOwner.fields.open_recall_count
        distinguishing_aspect: |
          The computed brand-level aggregates complaint_score and
          open_recall_count are server-maintained and initialize to 0 on
          creation, before any complaint or recall exists.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Computed Co", fein: "551000040", contact_email: "ra@computed.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
          assert:
            - "BrandOwner.${bo_id}.complaint_score == 0"
            - "BrandOwner.${bo_id}.open_recall_count == 0"

      - name: get_with_unknown_id_fails_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET on a well-formed but non-existent UUID returns 404
          ERR_NOT_FOUND for formula, recall-action, and pairing resources.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /petfood/formulas/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err1: $.data.error_id }
            - call: "GET /petfood/recall-actions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QAApprover
              captures: { err2: $.data.error_id }
            - call: "GET /petfood/supplier-ingredient-approvals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QualityAnalyst
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_NOT_FOUND, http 404"
            - "err2 == ERR_NOT_FOUND, http 404"
            - "err3 == ERR_NOT_FOUND, http 404"

      - name: child_create_with_unresolvable_fk_fails
        claim_type: parent_relationships
        grounds:
          - entities.Formula.fields.brand_owner_id
          - entities.FormulaIngredient.fields.ingredient_id
          - entities.ComplaintCase.fields.formula_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Creating a child row whose path parent or FK body field does not
          resolve fails with 404 ERR_NOT_FOUND: formula under a bogus brand id,
          formula-ingredient referencing a bogus ingredient, complaint
          referencing a bogus formula.
        test_recipe:
          setup:
            - "One BrandOwner and one Formula (DRAFT) exist"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "FK Co", fein: "551000050", contact_email: "ra@fk.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "FK-001", product_name: "FK Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /petfood/brand-owners/00000000-0000-0000-0000-000000000000/formulas"
              payload: { formula_code: "FK-002", product_name: "Orphan", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { err1: $.data.error_id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "00000000-0000-0000-0000-000000000000", inclusion_pct: 50.0 }
              as: FormulationScientist
              captures: { err2: $.data.error_id }
            - call: "POST /petfood/complaint-cases"
              payload: { brand_owner_id: "${bo_id}", formula_id: "00000000-0000-0000-0000-000000000000", severity: "MINOR", category: "PALATABILITY" }
              as: QualityAnalyst
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_NOT_FOUND (path parent unresolved), http 404"
            - "err2 == ERR_NOT_FOUND (ingredient FK unresolved), http 404"
            - "err3 == ERR_NOT_FOUND (formula FK unresolved), http 404"

      - name: enum_values_outside_declared_sets_fail
        claim_type: type_constraints
        grounds:
          - entities.Ingredient.fields.allergen_class
          - entities.Formula.fields.species
          - entities.ComplaintCase.fields.severity
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Enum fields reject values outside the declared constraint set:
          allergen_class 'MEAT', species 'FISH', severity 'CATASTROPHIC' each
          fail with ERR_INVALID_REQUEST (400).
        test_recipe:
          setup:
            - "One BrandOwner and one DRAFT Formula exist (for the complaint call)"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Enum Co", fein: "551000060", contact_email: "ra@enum.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "EN-001", product_name: "Enum Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Mystery Meal", ingredient_code: "MYML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.5, CRUDE_FAT: 0.1, MOISTURE: 0.1 }, allergen_class: "MEAT" }
              as: FormulationScientist
              captures: { err1: $.data.error_id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "EN-002", product_name: "Fish Food?", species: "FISH", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { err2: $.data.error_id }
            - call: "POST /petfood/complaint-cases"
              payload: { brand_owner_id: "${bo_id}", formula_id: "${f_id}", severity: "CATASTROPHIC", category: "ILLNESS" }
              as: QualityAnalyst
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_REQUEST (allergen_class outside set)"
            - "err2 == ERR_INVALID_REQUEST (species outside {DOG, CAT})"
            - "err3 == ERR_INVALID_REQUEST (severity outside declared set)"

      - name: numeric_and_parameter_bounds_fail
        claim_type: type_constraints
        grounds:
          - entities.FormulaIngredient.fields.inclusion_pct
          - entities.FeedingTrialProtocol.fields.animal_count
          - entities.FeedingTrialProtocol.fields.duration_days
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Numeric range constraints are enforced: inclusion_pct 0.0 violates
          0 < pct <= 100; animal_count 7 violates >= 8; duration_days 20
          violates >= 26 — all ERR_INVALID_REQUEST (400).
        test_recipe:
          setup:
            - "BrandOwner, Ingredient, and a FEEDING_TRIAL-basis DRAFT formula exist"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Bounds Co", fein: "551000070", contact_email: "ra@bounds.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Oat Groats", ingredient_code: "OTGR0001", nutrient_matrix: { CRUDE_PROTEIN: 0.12, CRUDE_FAT: 0.05, MOISTURE: 0.10 }, allergen_class: "GRAIN" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "BD-001", product_name: "Bounds Trial Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FEEDING_TRIAL" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 0.0 }
              as: FormulationScientist
              captures: { err1: $.data.error_id }
            - call: "POST /petfood/formulas/${f_id}/feeding-trial-protocols"
              payload: { protocol_code: "AAFCO-BD-001", animal_count: 7, duration_days: 26 }
              as: TrialCoordinator
              captures: { err2: $.data.error_id }
            - call: "POST /petfood/formulas/${f_id}/feeding-trial-protocols"
              payload: { protocol_code: "AAFCO-BD-002", animal_count: 8, duration_days: 20 }
              as: TrialCoordinator
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_REQUEST (inclusion_pct 0.0 out of (0, 100])"
            - "err2 == ERR_INVALID_REQUEST (animal_count 7 < 8)"
            - "err3 == ERR_INVALID_REQUEST (duration_days 20 < 26)"

      - name: brand_owner_listing_paginates_and_filters
        claim_type: listing
        grounds:
          - entities.BrandOwner
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /petfood/brand-owners paginates with limit/offset: 3 rows with
          limit=2 return 2 rows, total_count 3, has_more true; offset=2 returns
          the tail row with has_more false; status=SUSPENDED filter yields an
          empty page when no suspended brands exist.
        test_recipe:
          setup:
            - "Three BrandOwner rows exist, all ACTIVE"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Page Co One", fein: "551000080", contact_email: "a@page.example" }
              as: PlatformAdmin
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Page Co Two", fein: "551000081", contact_email: "b@page.example" }
              as: PlatformAdmin
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Page Co Three", fein: "551000082", contact_email: "c@page.example" }
              as: PlatformAdmin
          trigger:
            - call: "GET /petfood/brand-owners"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /petfood/brand-owners"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /petfood/brand-owners"
              payload: { status: "SUSPENDED" }
              as: PlatformAdmin
          assert:
            - "Page 1: data length == 2, total_count == 3, has_more == true"
            - "Page 2 (offset=2): data length == 1, total_count == 3, has_more == false"
            - "status=SUSPENDED filter: data length == 0, total_count == 0 (default state ACTIVE excluded)"

  # ===========================================================================
  # Section 2: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: formula_created_in_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.Formula
        distinguishing_aspect: |
          A formula row enters the machine at DRAFT exactly as declared by
          initial_state, with no transition having fired.
        test_recipe:
          setup:
            - "One BrandOwner exists"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Init Co", fein: "551100010", contact_email: "ra@init.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
          trigger:
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "IN-001", product_name: "Init Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id, f_status: $.data.status }
          assert:
            - "Formula.${f_id}.status == DRAFT (initial_state)"

      - name: formula_lock_from_draft_fails_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Formula.SUBSTANTIATED_to_LOCKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /lock exists only from SUBSTANTIATED; from DRAFT the transition
          set does not contain lock, so the call fails with ERR_INVALID_STATE
          (409) and the formula stays DRAFT.
        test_recipe:
          setup:
            - "One formula in DRAFT"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "BadTrans Co", fein: "551100020", contact_email: "ra@bt.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "BT-001", product_name: "BadTrans Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /petfood/formulas/${f_id}/lock"
              payload: {}
              as: QAApprover
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "Formula.${f_id}.status remains DRAFT"

      - name: formula_line_add_after_submit_fails_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Formula.DRAFT_to_NUTRIENT_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /formulas/{id}/ingredients is defined for a DRAFT formula only;
          once the formula is in NUTRIENT_REVIEW the line-add is a state
          violation and fails with ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "Formula in NUTRIENT_REVIEW with one 100% line; a second ingredient master exists"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "LineAdd Co", fein: "551100030", contact_email: "ra@lineadd.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Chicken Meal", ingredient_code: "CHML0010", nutrient_matrix: { CRUDE_PROTEIN: 0.65, CRUDE_FAT: 0.12, MOISTURE: 0.08 }, allergen_class: "POULTRY" }
              as: FormulationScientist
              captures: { ing1_id: $.data.id }
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Barley", ingredient_code: "BRLY0001", nutrient_matrix: { CRUDE_PROTEIN: 0.10, CRUDE_FAT: 0.02, MOISTURE: 0.11 }, allergen_class: "GRAIN" }
              as: FormulationScientist
              captures: { ing2_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "LA-001", product_name: "LineAdd Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing1_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
          trigger:
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing2_id}", inclusion_pct: 10.0 }
              as: FormulationScientist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409 (line editing closed outside DRAFT)"

      - name: formula_second_lock_fails_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Formula.SUBSTANTIATED_to_LOCKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Repeating the lock trigger on an already-LOCKED formula is not a
          no-op success: the second call fails with ERR_INVALID_STATE because
          LOCKED has no outgoing lock transition.
        test_recipe:
          setup:
            - "Formula in LOCKED (full substantiation chain executed)"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Idem Co", fein: "551100040", contact_email: "ra@idem.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "Idem Supply", fsma_facility_id: "FSMA-I100", country_code: "US", risk_tier: "LOW" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Turkey Meal", ingredient_code: "TKML0010", nutrient_matrix: { CRUDE_PROTEIN: 0.63, CRUDE_FAT: 0.11, MOISTURE: 0.08 }, allergen_class: "POULTRY" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-I100" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "ID-001", product_name: "Idem Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 26.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0, calcium_min_pct: 1.0, phosphorus_min_pct: 0.8 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/substantiate"
              payload: {}
