            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2020-01-01T00:00:00Z", content_uri: "uri://def8-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-DEF8", name: "DEF8 Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
