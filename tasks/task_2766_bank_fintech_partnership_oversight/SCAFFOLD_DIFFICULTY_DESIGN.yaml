      - name: approved_disclosure_windows_need_a_gap_strictly_greater_than_three_days
        grounds:
          - validations[priority=63]
          - entities.MarketingReview.fields.effective_from
          - entities.MarketingReview.fields.effective_until
          - state_machines.MarketingReview.SUBMITTED_to_APPROVED
          - state_machines.MarketingReview.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.MarketingReview.CHANGES_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          The contended resource is the (partner, material_type=DISCLOSURE,
          placement_channel) advertising slot and the interval semantics are
          CLOSED [effective_from, effective_until] widened by
          DISCLOSURE_COOLING_BUFFER_DAYS = 3, so abutment is illegal here where
          it was legal for settlement windows: a candidate ending
          2026-08-29T00:00:00Z is refused because +3 days lands exactly on the
          incumbent's start, and only after the end is pulled back to
          2026-08-28T23:59:59.999Z (a gap strictly greater than 3 days) does
          APPROVE succeed; the same instant range is then accepted on a different
          placement_channel, proving channel scoping.
        test_recipe:
          setup:
            - "Partner 'Verity Card' LIVE, business_model CARD_ISSUING; every review below uses material_type DISCLOSURE with disclosure_elements [BANK_NAME, FEE_SCHEDULE, DISPUTE_RIGHTS], apr_disclosed false and fdic_signage_correct true, so calculation marketing_risk_flags returns [] (CARD_ISSUING triggers neither the APR nor the FDIC branch, and DISPUTE_RIGHTS is present) and no disclosure-completeness rule can pre-empt priority 63."
            - "§1.5 has no marketing-review submit endpoint: POST /oversight/marketing-reviews lands the row in SUBMITTED directly, and the only way back into SUBMITTED after CHANGES_REQUESTED is POST /oversight/marketing-reviews/{id}/resubmit, which is FintechPartner-only and requires X-User-ID == review.partner_id."
            - "Incumbent review R1 on placement_channel PARTNER_SITE over the closed window [2026-09-01T00:00:00Z, 2026-09-10T00:00:00Z] is APPROVED first."
