  - rule_id: boundary_precision_check
    instances:
      - name: severity_classification_exact_50mm_boundary
        grounds:
          - calculations.clash_severity_classification
          - entities.ClashIssue.fields.severity
        distinguishing_aspect: |
          Metric overlap_mm at the exact 50.0 boundary classifies MAJOR (CRITICAL requires
          strictly greater); 50.1 tips to CRITICAL and 0.0 means MINOR (clearance-only).
          Reached through the clash-import endpoint.
        test_recipe:
          setup:
            - "Project P, partner P1, M1 ACCEPTED, F1 FROZEN, R1 RUNNING (tolerance 5.0)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "BP1" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/clash-runs", payload: { tolerance_mm: 5.0 }, as: BIMCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator }
          trigger:
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "B/exact", overlap_mm: 50.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c50: $.data.id, sev50: $.data.severity } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "B/over", overlap_mm: 50.1, spans_disciplines: false }, as: BIMCoordinator, captures: { c501: $.data.id, sev501: $.data.severity } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "B/zero", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c0: $.data.id, sev0: $.data.severity } }
          assert:
            - "ClashIssue.${c50}.severity == MAJOR  (overlap == 50.0 is NOT critical)"
            - "ClashIssue.${c501}.severity == CRITICAL  (overlap > 50.0)"
            - "ClashIssue.${c0}.severity == MINOR  (overlap == 0.0, clearance-only)"
            - "ClashDetectionRun.${r1}.total_clash_count == 3"

