# =============================================================================
# §1.9 Scaffold Corner Design — Missing Participant Search & Plan Termination
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Sections follow the claim-extraction guide taxonomy.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: case_creation_applies_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.TerminationCase.fields.restoration_policy, entities.TerminationCase.fields.status]
        distinguishing_aspect: "Omitting restoration_policy stores NOMINAL; a new case starts DRAFT with version 1 and all counters zero."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Defaults Co 401k", sponsor_ein: "123456789", plan_number: "100", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_df: "$.data.id" } }
          trigger:
            - { call: "GET /termination-cases/${c_df}", payload: {}, as: PlanAdministrator }
          assert:
            - "TerminationCase.${c_df}.restoration_policy == NOMINAL (default applied)"
            - "status == DRAFT, version == 1, total_participant_count == 0, resolved_participant_count == 0, missing_participant_count == 0, all_participants_resolved == false, blackout_active == false"
            - "id is a server-minted UUID; created_at and updated_at are ISO8601 UTC with three fractional digits; default_treatment_date == null"

      - name: participant_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Participant.fields.ssn, "errors[ERR_INVALID_REQUEST]", "validations[priority=2.5]"]
        distinguishing_aspect: "POST /participants without ssn fails with 400 ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["A case in DRAFT."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Req Co 401k", sponsor_ein: "123456789", plan_number: "101", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_rq: "$.data.id" } }
          trigger:
            - { call: "POST /participants", payload: { termination_case_id: "${c_rq}", full_name: "No Ssn", mailing_address: "1 N St", account_balance_cents: 1000, vested_pct: 100 }, as: PlanAdministrator, captures: { err_rq: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400; no Participant row created"

      - name: participant_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Participant.fields.vested_balance_cents, "validations[priority=2.5]"]
        distinguishing_aspect: "Sending the computed field vested_balance_cents in a create body is rejected as an undeclared field (400), never stored."
        test_recipe:
          setup: ["A case in DRAFT."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Computed Co 401k", sponsor_ein: "123456789", plan_number: "102", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ci: "$.data.id" } }
          trigger:
            - { call: "POST /participants", payload: { termination_case_id: "${c_ci}", full_name: "Sneaky Field", ssn: "111110000", mailing_address: "2 S St", account_balance_cents: 1000, vested_pct: 100, vested_balance_cents: 1 }, as: PlanAdministrator, captures: { err_ci: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400 (undeclared body field rejected; computed fields are server-owned)"

      - name: participant_vested_balance_computed_rounds_half_up
        claim_type: computed_fields
        grounds: [calculations.vested_balance, entities.Participant.fields.vested_balance_cents]
        distinguishing_aspect: "333335 cents at 60% vesting computes vested_balance_cents == 200001 (round_half_up at whole-cent precision)."
        test_recipe:
          setup: ["A case in DRAFT."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Round Co 401k", sponsor_ein: "123456789", plan_number: "103", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_rb: "$.data.id" } }
          trigger:
            - { call: "POST /participants", payload: { termination_case_id: "${c_rb}", full_name: "Vest Math", ssn: "111110001", mailing_address: "3 V St", account_balance_cents: 333335, vested_pct: 60 }, as: PlanAdministrator, captures: { p_rb: "$.data.id" } }
          assert:
            - "Participant.${p_rb}.vested_balance_cents == 200001 and net_distributable_cents == 200001"

      - name: participant_created_after_effectuate_is_fully_vested
        claim_type: computed_fields
        grounds: [entities.Participant.fields.vested_pct, state_machines.TerminationCase.NOTICE_OF_INTENT_ISSUED_to_TERMINATION_EFFECTIVE]
        distinguishing_aspect: "A participant created with vested_pct 60 while the case is already TERMINATION_EFFECTIVE is stored with vested_pct == 100 (termination forces full vesting), regardless of input."
        test_recipe:
          setup: ["Case effectuated (NOIT issued at the default clock; clock advanced to the termination date)."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Late Vest Co 401k", sponsor_ein: "123456789", plan_number: "104", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_lv: "$.data.id", c_lv_v: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_lv}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_lv_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_lv}/effectuate-termination", payload: {}, as: PlanAdministrator }
          trigger:
            - { call: "POST /participants", payload: { termination_case_id: "${c_lv}", full_name: "Late Joiner", ssn: "111110002", mailing_address: "4 L St", account_balance_cents: 500000, vested_pct: 60 }, as: PlanAdministrator, captures: { p_lv: "$.data.id" } }
          assert:
            - "Participant.${p_lv}.vested_pct == 100 (forced), vested_balance_cents == 500000, net_distributable_cents == 500000"

      - name: get_participant_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Nf Co 401k", sponsor_ein: "123456789", plan_number: "105", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
          trigger:
            - { call: "GET /participants/00000000-0000-0000-0000-000000000000", payload: {}, as: PlanAdministrator, captures: { err_nf: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: participant_list_pagination_and_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /participants]"]
        distinguishing_aspect: "Filtered list with limit=2&offset=1 over 3 rows returns exactly 2 rows with total_count 3 and has_more false; envelope exposes meta.api_request_id and the four pagination fields."
        test_recipe:
          setup: ["A case with three participants."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Page Co 401k", sponsor_ein: "123456789", plan_number: "106", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_pg: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_pg}", full_name: "Pg One", ssn: "111110010", mailing_address: "1 P St", account_balance_cents: 1000, vested_pct: 100 }, as: PlanAdministrator }
            - { call: "POST /participants", payload: { termination_case_id: "${c_pg}", full_name: "Pg Two", ssn: "111110011", mailing_address: "2 P St", account_balance_cents: 2000, vested_pct: 100 }, as: PlanAdministrator }
            - { call: "POST /participants", payload: { termination_case_id: "${c_pg}", full_name: "Pg Three", ssn: "111110012", mailing_address: "3 P St", account_balance_cents: 3000, vested_pct: 100 }, as: PlanAdministrator }
          trigger:
            - { call: "GET /participants", payload: { termination_case_id: "${c_pg}", limit: 2, offset: 1 }, as: PlanAdministrator }
          assert:
            - "response_type == 'array'; exactly 2 data rows returned"
            - "total_count == 3 and has_more == false (offset 1 + 2 rows covers the full filtered set)"
            - "meta.api_request_id present; pagination fields limit/offset/total_count/has_more present"

      - name: append_only_events_have_no_version
        claim_type: immutability
        grounds: [entities.SearchAttempt, entities.FiduciaryLogEntry]
        distinguishing_aspect: "SearchAttempt and FiduciaryLogEntry carry id and created_at only — no version or updated_at — and no update/delete endpoint exists for them."
        test_recipe:
          setup: ["Case with one participant flagged and declared missing (search case open at STEP1)."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Immutable Co 401k", sponsor_ein: "123456789", plan_number: "107", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_im: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_im}", full_name: "Im Mut", ssn: "111110020", mailing_address: "1 I St", account_balance_cents: 1000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_im: "$.data.id" } }
            - { call: "POST /participants/${p_im}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
            - { call: "POST /participants/${p_im}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_im: "$.data.active_search_case_id" } }
          trigger:
            - { call: "POST /search-cases/${sc_im}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-08-01T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1", captures: { at_im: "$.data.id" } }
            - { call: "POST /fiduciary-log-entries", payload: { termination_case_id: "${c_im}", entry_type: NOTICE_DECISION, narrative: "Documenting the decision to run the full four-step missing-participant search protocol." }, as: PlanAdministrator, as_user_id: "admin-1", captures: { lg_im: "$.data.id" } }
          assert:
            - "SearchAttempt.${at_im} response data contains id, created_at, search_case_id, method, outcome — and neither version nor updated_at"
            - "FiduciaryLogEntry.${lg_im} response data contains id, created_at, author_user_id == 'admin-1', author_role == 'PlanAdministrator' — and neither version nor updated_at"

      - name: notice_supersede_self_reference_links
        claim_type: parent_relationships
        grounds: [entities.ParticipantNotice.fields.superseded_by_id, "endpoints[GET /notices]"]
        distinguishing_aspect: "Reissuing the NOIT supersedes the prior notice via the self-referential superseded_by_id, and the filtered list GET /notices?superseded_by_id=<new> returns exactly the old notice."
        test_recipe:
          setup: ["Case in DRAFT; NOIT #1 issued at the default clock (case version 1 -> 2)."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Supersede Co 401k", sponsor_ein: "123456789", plan_number: "108", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ss: "$.data.id", c_ss_v: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_ss}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_ss_v}" }, as: PlanAdministrator, captures: { n_ss1: "$.data.id" } }
            - { call: "GET /termination-cases/${c_ss}", payload: {}, as: PlanAdministrator, captures: { c_ss_v2: "$.data.version" } }
          trigger:
            - { call: "POST /notices", payload: { termination_case_id: "${c_ss}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_ss_v2}" }, as: PlanAdministrator, captures: { n_ss2: "$.data.id" } }
            - { call: "GET /notices", payload: { superseded_by_id: "${n_ss2}" }, as: PlanAdministrator }
          assert:
            - "ParticipantNotice.${n_ss1}.superseded_by_id == ${n_ss2} and ParticipantNotice.${n_ss2}.superseded_by_id == null"
            - "GET /notices?superseded_by_id=${n_ss2} returns exactly [${n_ss1}]"
            - "TerminationCase.${c_ss}.status == NOTICE_OF_INTENT_ISSUED (reissue keeps status)"

  - section: state_machines
    instances:
      - name: effectuate_state_and_timing_gates
        claim_type: precondition_enforcement
        grounds: [state_machines.TerminationCase.NOTICE_OF_INTENT_ISSUED_to_TERMINATION_EFFECTIVE, "errors[ERR_CASE_INVALID_STATE]", "errors[ERR_TERMINATION_DATE_NOT_REACHED]"]
        distinguishing_aspect: "Effectuation is rejected from DRAFT (no NOIT) with ERR_CASE_INVALID_STATE, and after a valid NOIT but before the termination date with ERR_TERMINATION_DATE_NOT_REACHED — two distinct gates on one transition."
        test_recipe:
          setup: ["Case A in DRAFT (no NOIT). Case B with NOIT issued at the default clock; clock then set to 2026-10-14 (one day before the termination date)."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Gate A Co 401k", sponsor_ein: "123456789", plan_number: "110", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ga: "$.data.id" } }
            - { call: "POST /termination-cases", payload: { plan_name: "Gate B Co 401k", sponsor_ein: "123456789", plan_number: "111", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_gb: "$.data.id", c_gb_v: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_gb}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_gb_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-14T00:00:00Z" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /termination-cases/${c_ga}/effectuate-termination", payload: {}, as: PlanAdministrator, captures: { err_ga: "$.data.error_id" } }
            - { call: "POST /termination-cases/${c_gb}/effectuate-termination", payload: {}, as: PlanAdministrator, captures: { err_gb: "$.data.error_id" } }
          assert:
            - "Case A: error_id == ERR_CASE_INVALID_STATE, http 409, status stays DRAFT"
            - "Case B: error_id == ERR_TERMINATION_DATE_NOT_REACHED, http 409, status stays NOTICE_OF_INTENT_ISSUED"

      - name: declare_missing_twice_flag_and_state_gates
        claim_type: invalid_transition
        grounds: ["errors[ERR_INVALID_FLAG_TRANSITION]", "errors[ERR_PARTICIPANT_NOT_FLAGGED]", state_machines.Participant]
        distinguishing_aspect: "Once MISSING, a participant can be neither re-flagged (ERR_INVALID_FLAG_TRANSITION) nor re-declared (ERR_PARTICIPANT_NOT_FLAGGED); and clearing a flag whose flag_type does not match the current flag is the same ERR_INVALID_FLAG_TRANSITION."
        test_recipe:
          setup: ["Case with one participant flagged UNDELIVERABLE_MAIL."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Twice Co 401k", sponsor_ein: "123456789", plan_number: "112", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_tw: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_tw}", full_name: "Tw Ice", ssn: "111110030", mailing_address: "1 T St", account_balance_cents: 1000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_tw: "$.data.id" } }
            - { call: "POST /participants/${p_tw}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
          trigger:
            - { call: "POST /participants/${p_tw}/clear-contact-flag", payload: { flag_type: UNCASHED_CHECK }, as: Recordkeeper, captures: { err_tw1: "$.data.error_id" } }
            - { call: "POST /participants/${p_tw}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /participants/${p_tw}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper, captures: { err_tw2: "$.data.error_id" } }
            - { call: "POST /participants/${p_tw}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { err_tw3: "$.data.error_id" } }
          assert:
            - "Arm 1 (clear mismatched flag_type while FLAGGED_UNDELIVERABLE): error_id == ERR_INVALID_FLAG_TRANSITION, http 409"
            - "Arm 2 (first declare-missing) succeeds: Participant.${p_tw}.locate_status == MISSING"
            - "Arm 3 (flag while MISSING): error_id == ERR_INVALID_FLAG_TRANSITION, http 409"
            - "Arm 4 (declare while MISSING): error_id == ERR_PARTICIPANT_NOT_FLAGGED, http 409 — the locate-state gate fires before any search-case check"

      - name: declare_missing_after_exhaustion_returns_error
        claim_type: terminal_state_lockdown
        grounds: ["errors[ERR_SEARCH_CASE_EXHAUSTED_REDECLARE]", state_machines.MissingSearchCase]
        distinguishing_aspect: "EXHAUSTED is terminal: a participant whose search case was exhausted, who later resurfaces (LOCATED) and is re-flagged, cannot be declared missing again — ERR_SEARCH_CASE_EXHAUSTED_REDECLARE."
        test_recipe:
          setup: ["Case with one participant; full four-step search exhaustion completed (attempts at 2026-11-01..04, exhaustion at 2026-11-19); participant then located at 2026-11-20 and flagged UNDELIVERABLE_MAIL again."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Exhausted Co 401k", sponsor_ein: "123456789", plan_number: "113", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ex: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_ex}", full_name: "Ex Haust", ssn: "111110031", mailing_address: "1 E St", account_balance_cents: 1000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_ex: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /participants/${p_ex}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
            - { call: "POST /participants/${p_ex}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_ex: "$.data.active_search_case_id" } }
            - { call: "POST /search-cases/${sc_ex}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-11-01T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_ex}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_ex}/attempts", payload: { method: PUBLIC_RECORDS, vendor_name: "PubRec", attempted_at: "2026-11-02T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_ex}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_ex}/attempts", payload: { method: CREDIT_BUREAU, vendor_name: "CBX", attempted_at: "2026-11-03T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_ex}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_ex}/attempts", payload: { method: CERTIFIED_MAIL, vendor_name: "USPS", attempted_at: "2026-11-04T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-19T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /search-cases/${sc_ex}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-20T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /participants/${p_ex}/locate", payload: { verified_address: "8 Back Blvd" }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /participants/${p_ex}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
          trigger:
            - { call: "POST /participants/${p_ex}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { err_ex: "$.data.error_id" } }
          assert:
            - "MissingSearchCase.${sc_ex}.status == EXHAUSTED and exhausted_by_user_id == 'admin-1' at trigger time"
            - "error_id == ERR_SEARCH_CASE_EXHAUSTED_REDECLARE, http 409; no new search case is created"

      - name: escalate_without_attempt_returns_no_attempt_error
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_NO_ATTEMPT_ON_CURRENT_STEP]", state_machines.MissingSearchCase.STEP1_COMMERCIAL_LOCATOR_to_STEP2_PUBLIC_RECORDS]
        distinguishing_aspect: "Escalation from STEP1 with zero attempts on the current step is rejected; the case stays at STEP1_COMMERCIAL_LOCATOR."
        test_recipe:
          setup: ["Case with one participant declared missing (search case at STEP1_COMMERCIAL_LOCATOR, no attempts)."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "NoAttempt Co 401k", sponsor_ein: "123456789", plan_number: "114", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_na: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_na}", full_name: "No Attempt", ssn: "111110032", mailing_address: "1 N St", account_balance_cents: 1000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_na: "$.data.id" } }
            - { call: "POST /participants/${p_na}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
            - { call: "POST /participants/${p_na}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_na: "$.data.active_search_case_id" } }
          trigger:
            - { call: "POST /search-cases/${sc_na}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { err_na: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NO_ATTEMPT_ON_CURRENT_STEP, http 409; MissingSearchCase.${sc_na}.status stays STEP1_COMMERCIAL_LOCATOR"

      - name: escalate_before_certified_window_closes_returns_error
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_CERTIFIED_MAIL_RESPONSE_WINDOW_OPEN]", state_machines.MissingSearchCase.STEP4_CERTIFIED_MAIL_to_EXHAUSTED]
        distinguishing_aspect: "STEP4 -> EXHAUSTED only 15 days after the latest certified-mail attempt: at day +10 the escalate is rejected; at exactly day +15 it succeeds (inclusive bound)."
        test_recipe:
          setup: ["Case with one participant; search case escalated to STEP4_CERTIFIED_MAIL; CERTIFIED_MAIL NO_RESULT attempt at 2026-11-04T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Window Co 401k", sponsor_ein: "123456789", plan_number: "115", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_wn: "$.data.id" } }
