      - name: open_claims_block_period_close_until_every_claim_is_terminal
        claim_type: cascading_validation
        grounds:
          - validations.priority_33
          - state_machines.AccountingPeriod.DISTRIBUTED_to_CLOSED
          - errors.ERR_UNRESOLVED_REGISTRATIONS
        distinguishing_aspect: |
          Priority 33 blocks the close while ANY registration touching this period's usage sits in
          SUBMITTED, UNDER_REVIEW, NEEDS_EVIDENCE or DISPUTED — so moving the offender from
          SUBMITTED to UNDER_REVIEW does not help, and only a terminal REJECTED (or APPROVED)
          unblocks it. The holding account is already 0, so this is the priority-33 error and not
          the priority-32 one, and the temporal precondition is satisfied because the clock has
          passed the claim window.
        test_recipe:
          setup:
            - "The single-line fixture through to a DISTRIBUTED period with holding_cents 0: GB/INDIVIDUAL schedule EFFECTIVE (7000 / 500 / 100 / 4000 / 6000, 2026-01-01..2026-12-31); period 2026-06 whose one sealed batch carries a single 450000-play line matched by exact ISRC; the label's MASTER WORLD 10000 DIRECT registration APPROVED; pool 1000 subscribers / 1428570 cents calculated and finalized."
            - "While the claim window is still open (clock 2026-08-01, window closes 2026-08-29), a rival DISTRIBUTOR files a second MASTER claim and leaves it SUBMITTED."
            - "The clock is then advanced to 2026-08-30T00:00:00Z, past the claim window."
