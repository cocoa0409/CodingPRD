      - name: offer_unverified_request_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=4]', errors.ERR_REFERRAL_NOT_VERIFIED]
        distinguishing_aspect: "A request whose referral is still PENDING (verification_status UNVERIFIED) cannot be offered a room even when rooms are free."
