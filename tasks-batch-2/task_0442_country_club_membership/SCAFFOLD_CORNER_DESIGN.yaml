  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds: ["entities.Resource.fields.id", "concurrency_rules[reservation-create-stale-resource]"]
        distinguishing_aspect: "Resource.version increments by exactly 1 on each successful reservation create: version is 1 at create, 2 after one booking, 3 after a second non-conflicting booking."
        test_recipe:
          setup: ["Club; GOLF allows_golf; Members M1,M2 activated; COURT resource turnaround 0; two non-overlapping bookings."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "X1 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M1" }
              as: ClubManager
              captures: { m1_id: $.data.id }
            - call: "POST /memberships/${m1_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M2" }
              as: ClubManager
              captures: { m2_id: $.data.id }
            - call: "POST /memberships/${m2_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "COURT", label: "Court 1", turnaround_minutes: 0 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m1_id}", starts_at: "2026-02-01T08:00:00Z", ends_at: "2026-02-01T09:00:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "GET /resources/${res_id}"
              payload: {}
              as: ClubManager
              captures: { res_v1: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m2_id}", starts_at: "2026-02-01T10:00:00Z", ends_at: "2026-02-01T11:00:00Z", expected_resource_version: "${res_v1}" }
              as: Member
              as_user_id: "${m2_id}"
          assert:
            - "res_v0 == 1 (resource version at create)"
            - "res_v1 == 2 (after first booking)"
            - "GET /resources/${res_id} now returns version == 3 (after second booking)"

      - name: guest_checkin_cascades_fee_chit_to_sponsor_balance
        claim_type: cascading_side_effects
        grounds: ["state_machines.GuestPass.REGISTERED_to_CHECKED_IN", "entities.GuestPass.fields.fee_chit_id", "entities.Membership.fields.charge_balance_cents"]
        distinguishing_aspect: "Checking in a guest creates a GUEST_FEE chit (amount = sponsor category guest_fee_cents 5000), links fee_chit_id, and debits sponsor charge_balance_cents by 5000."
        test_recipe:
          setup: ["Club guest cap default 4; SOCIAL guest_fee 5000 initiation 0; Member S activated (balance 0); one REGISTERED guest pass G sponsored by S."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "X2 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "S" }
              as: ClubManager
              captures: { s_id: $.data.id }
            - call: "POST /memberships/${s_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /guest-passes"
              payload: { club_id: "${club_id}", sponsor_membership_id: "${s_id}", guest_name: "G", visit_date: "2026-01-05T12:00:00Z" }
              as: Member
              as_user_id: "${s_id}"
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /guest-passes/${g_id}/check-in"
              payload: {}
              as: ClubManager
              captures: { fee_chit: $.data.fee_chit_id }
          assert:
            - "GuestPass.${g_id}.status == CHECKED_IN"
            - "GuestPass.${g_id}.fee_chit_id is non-null"
            - "Membership.${s_id}.charge_balance_cents == 5000"
            - "Membership.${s_id}.guest_visits_used_period == 1"
            - "GET /chits?membership_id=${s_id} returns a Chit kind == GUEST_FEE amount_cents == 5000"

      - name: dues_threshold_billing_status_advance
        claim_type: rate_threshold_triggers
        grounds: ["state_machines.Membership.CURRENT_to_PAST_DUE", "entities.Membership.fields.billing_status"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / membership_parallel_account_x_billing_axes
          rationale: "Billing-status advance to PAST_DUE on an unpaid finalized statement is asserted by the named §1.8 parallel-axis instance."

      - name: fb_carryover_credit_set_for_next_period
        claim_type: derived_field_reconciliation
        grounds: ["calculations.fb_shortfall", "entities.Membership.fields.fb_credit_carried_cents"]
        excluded_because:
          difficulty_instance: dual_variant_calc / fb_shortfall_no_vs_forward_carryover
          rationale: "Setting fb_credit_carried_cents from surplus and applying it to the next-period effective minimum is exercised by the named §1.8 dual-variant instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: chit_post_immediately_visible_in_balance
        claim_type: immediate
        grounds: ["endpoints", "entities.Membership.fields.charge_balance_cents"]
        distinguishing_aspect: "Posting a chit (POST /chits amount 4000 PRO_SHOP) immediately reflects in the member's charge_balance_cents on the very next GET /memberships/{id} (== 4000); no lag."
        test_recipe:
          setup: ["Club; SOCIAL initiation 0; Member M activated (balance 0)."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "CM1 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /chits"
              payload: { club_id: "${club_id}", membership_id: "${m_id}", amount_cents: 4000, kind: "PRO_SHOP" }
