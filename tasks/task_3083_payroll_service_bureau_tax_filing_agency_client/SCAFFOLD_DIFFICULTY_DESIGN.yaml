              captures: { cl_sh: $.data.id }
            - call: "POST /clients/${cl_sh}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_sh}/registrations"
              payload: { jurisdiction_id: "${j_ca}", agency_account_number: "EDD-9001", poa_document_ref: "POA-SH" }
              as: BureauOnboarder
              captures: { reg_sh: $.data.id }
            - call: "POST /registrations/${reg_sh}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_sh}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /payroll-runs"
              payload: { client_id: "${cl_sh}", pay_date: "2026-07-15T00:00:00Z", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-14T00:00:00Z", gross_pay_cents: 1500000, total_tax_cents: 300000 }
              as: ClientPayrollAdmin
              as_user_id: "${cl_sh}"
              captures: { run_a: $.data.id }
            - call: "POST /payroll-runs/${run_a}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${cl_sh}"
            - call: "GET /clients/${cl_sh}"
              payload: {}
              as: BureauCompliance
              captures: { cl_sh_v1: $.data.version }
            - call: "POST /payroll-runs/${run_a}/initiate-impound"
              payload: { expected_client_version: "${cl_sh_v1}" }
              as: ClientPayrollAdmin
              as_user_id: "${cl_sh}"
              captures: { imp_a: $.data.id }
            - call: "POST /impounds/${imp_a}/settle"
              payload: {}
              as: BureauTreasury
            - call: "GET /payroll-runs/${run_a}"
              payload: {}
              as: BureauTaxFiler
              captures: { run_a_v: $.data.version }
            - call: "POST /payroll-runs/${run_a}/deposits"
              payload: { jurisdiction_id: "${j_ca}", amount_cents: 300000, expected_payroll_run_version: "${run_a_v}" }
              as: BureauTaxFiler
              captures: { dep_a: $.data.id }
            - call: "POST /deposits/${dep_a}/submit"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /deposits/${dep_a}/confirm"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /payroll-runs"
              payload: { client_id: "${cl_sh}", pay_date: "2026-08-17T00:00:00Z", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", gross_pay_cents: 1500000, total_tax_cents: 300000 }
              as: ClientPayrollAdmin
              as_user_id: "${cl_sh}"
              captures: { run_b: $.data.id }
            - call: "POST /payroll-runs/${run_b}/submit"
              payload: {}
