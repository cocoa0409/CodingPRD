            - "Club.${club_a_id}.escrow_balance_cents == 485500"
            - "Club.${club_a_id}.total_funded_cents == 500000"
      - name: training_lapse_at_exactly_the_expiry_instant
        grounds:
          - calculations.contact_eligibility_derivation
