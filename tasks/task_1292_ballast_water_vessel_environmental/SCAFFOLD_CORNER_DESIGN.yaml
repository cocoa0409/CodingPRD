  # ============================================================
  # Section: cross_cutting_layers (complexity layers from complexity_profile)
  # ============================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_plan_create_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[plan-create-stale-vessel]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Vessel.version: client observes version 1, creates plan rev1 (vessel.version advances to 2), then a second create carrying expected_vessel_version 1 is stale -> ERR_STALE_VERSION (412) even though plan_revision 2 is otherwise legal."
        test_recipe:
          setup: ["Vessel MV Osprey-II registered (version 1 observed)"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100064", vessel_name: "MV Osprey-II", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 2, approval_authority: USCG, approved_at: "2026-07-01T00:00:00Z", exchange_distance_nm: 220, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_STALE_VERSION (vessel.version advanced past the observed ${v_ver})"
            - "HTTP 412; GET plans returns total_count == 1 (stale create not persisted)"

      - name: occ_plan_create_current_version_increments_vessel
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[plan-create-stale-vessel]"]
        distinguishing_aspect: "Happy path of the same rule: expected_vessel_version equal to the live version succeeds, and Vessel.version increments by exactly 1 (1 -> 2) as declared in the endpoint's side effects."
        test_recipe:
          setup: ["Vessel MV Phalarope registered (version 1)"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100065", vessel_name: "MV Phalarope", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
          trigger:
            - call: "POST /vessels/${v}/plans"
