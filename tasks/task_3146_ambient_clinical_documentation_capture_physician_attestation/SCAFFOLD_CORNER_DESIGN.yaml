      - name: corner_list_pagination_envelope_fields
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints[GET /ambient-clinical-documentation/patients/{id}/encounters]
        distinguishing_aspect: "List endpoints honor limit/offset and report total_count and has_more per the fixed envelope defaults."
        test_recipe:
          setup: ["One patient with 3 encounters"]
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-EP1-1", full_name: "Pat Ep1" }
