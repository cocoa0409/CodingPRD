        excluded_because:
          difficulty_instance: resource_temporal_overlap / housing_unit_bed_pool_aggregate_capacity_not_interval
          rationale: "Aggregate-count semantics and freed-bed admission asserted in the §1.8 instance."

  - section: state_machines
    instances:
      - name: report_return_resubmit_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.GrossReceiptsReport
        excluded_because:
          difficulty_instance: non_linear_state_machine / gross_receipts_report_submit_return_resubmit_cycle
          rationale: "RETURNED -> SUBMITTED rework loop asserted with the re-supplied amount in the §1.8 instance."

      - name: filing_revision_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.RateFiling
        excluded_because:
          difficulty_instance: non_linear_state_machine / rate_filing_rejection_revision_cycle
          rationale: "REJECTED -> revision SUBMITTED -> APPROVED asserted in the §1.8 instance."

  - section: validations
    instances:
      - name: environmental_gate_precedes_fiscal_gate_on_transition
        claim_type: Priority Ordering
        grounds:
