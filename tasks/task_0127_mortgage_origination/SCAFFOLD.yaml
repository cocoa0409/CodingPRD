scenario: |
  Mortgage Origination: pre-qualification, income and asset verification, appraisal,
  Title search, UDAAP compliance, Loan Estimate/Closing Disclosure, TRID timelines,
  rate lock and extension.
domain_name: mortgage-origination
api_prefix: /loan-applications

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - scheduled_deferred_actions
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - version_pinning_on_approval
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =========================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =========================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =========================================================================
# §1.1 Entity-Relationship Table
# =========================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Borrower legal name
      - name: ssn_last4
        type: string
        source: input
        description: Last four digits of SSN, exactly 4 numeric chars
        constraints: "regex: ^[0-9]{4}$"
      - name: annual_income_cents
        type: integer
        source: input
        description: Stated annual income at application, in cents
        constraints: ">= 0"
      - name: credit_score
        type: integer
        source: input
        description: Tri-merge FICO at intake
        constraints: "300 <= credit_score <= 850"
      - name: state_code
        type: string
        source: input
        description: 2-letter US state for property location
        constraints: "regex: ^[A-Z]{2}$"

  - name: LoanApplication
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: FK -> Borrower.id
      - name: property_address
        type: string
        source: input
        description: Subject property full address
      - name: sale_price_cents
        type: integer
        source: input
        description: Purchase price of property in cents
        constraints: "> 0"
      - name: requested_loan_amount_cents
        type: integer
        source: input
        description: Requested principal in cents
        constraints: "> 0 AND <= sale_price_cents"
      - name: loan_term_months
        type: integer
        source: input
        description: Term in months (typically 180 or 360)
        constraints: "enum {120, 180, 240, 360}"
      - name: loan_purpose
        type: enum
        source: input
        description: PURCHASE or REFINANCE
        constraints: "enum {PURCHASE, REFINANCE}"
      - name: status
        type: enum
        source: computed
        description: Application lifecycle state
        default: INTAKE
        constraints: "enum {INTAKE, PRE_QUALIFIED, UNDERWRITING, CONDITIONAL_APPROVAL, CLEAR_TO_CLOSE, CLOSED, DENIED, WITHDRAWN}"
      - name: counter_offered_amount_cents
        type: integer
        source: computed
        description: System-set when a counter-offer is issued from underwriting
        default: null
      - name: dti_ratio
        type: number
        source: computed
        description: Debt-to-income ratio derived from VerifiedIncome and requested principal
        default: null
      - name: ltv_ratio
        type: number
        source: computed
        description: Loan-to-value ratio (requested_loan_amount_cents / appraised_value_cents)
        default: null
      - name: pmi_required
        type: boolean
        source: computed
        description: True if final LTV > 0.80 at clear-to-close
        default: false
      - name: assigned_loan_officer_id
        type: string
        source: input
        description: Opaque LoanOfficer user id (owner of intake/disclosures)
      - name: compliance_reviewer_id
        type: string
        source: system
        description: Opaque ComplianceOfficer user id assigned when entering UNDERWRITING
        default: null
      - name: trid_clock_started_at
        type: datetime
        source: system
        description: Timestamp the initial Loan Estimate was issued
        default: null
      - name: closing_eligible_at
        type: datetime
        source: computed
        description: Earliest UTC instant closing may occur per TRID (CD delivery + 3 business days)
        default: null

  - name: IncomeVerification
    parent: LoanApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> LoanApplication.id
      - name: source_type
        type: enum
        source: input
        description: Income source category
        constraints: "enum {W2, SELF_EMPLOYED, OTHER}"
      - name: documented_annual_cents
        type: integer
        source: input
        description: Verified annual income in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Verification state
        default: PENDING
        constraints: "enum {PENDING, VERIFIED, REJECTED}"
      - name: verifier_user_id
        type: string
        source: system
        description: Opaque user id of the verifier (set on VERIFIED/REJECTED)
        default: null

  - name: AssetVerification
    parent: LoanApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> LoanApplication.id
      - name: asset_type
        type: enum
        source: input
        description: Asset category
        constraints: "enum {CHECKING, SAVINGS, INVESTMENT, GIFT}"
      - name: balance_cents
        type: integer
        source: input
        description: Verified asset balance in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Verification state
        default: PENDING
        constraints: "enum {PENDING, VERIFIED, REJECTED}"
      - name: verifier_user_id
        type: string
        source: system
        description: Opaque user id of the verifier
        default: null

  - name: Appraisal
    parent: LoanApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> LoanApplication.id
      - name: appraised_value_cents
        type: integer
        source: input
        description: Reported appraised value in cents
        constraints: "> 0"
      - name: report_date
        type: datetime
        source: input
        description: Date appraisal report was finalized (UTC)
      - name: valid_until
        type: datetime
        source: computed
        description: report_date + 120 calendar days (appraisal validity window)
      - name: status
        type: enum
        source: computed
        description: Appraisal state
        default: ORDERED
        constraints: "enum {ORDERED, COMPLETED, REJECTED, EXPIRED}"

  - name: TitleSearch
    parent: LoanApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> LoanApplication.id
      - name: status
        type: enum
        source: computed
        description: Title search lifecycle state
        default: ORDERED
        constraints: "enum {ORDERED, CLEAR, ISSUES_FOUND, RESOLVED}"
      - name: defects_found
        type: array
        source: input
        description: List of title defect descriptions; empty if clear
        default: []
      - name: resolved_at
        type: datetime
        source: system
        description: Set when state moves ISSUES_FOUND -> RESOLVED
        default: null

  - name: RateLock
    parent: LoanApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> LoanApplication.id
      - name: locked_rate_bps
        type: integer
        source: input
        description: Interest rate in basis points (e.g., 6.5% -> 650)
        constraints: "> 0 AND <= 2000"
      - name: locked_at
        type: datetime
        source: system
        description: Timestamp the lock was placed
      - name: lock_expires_at
        type: datetime
        source: computed
        description: Lock expiry (locked_at + 45 days, extendable)
      - name: lock_fee_cents
        type: integer
        source: computed
        description: Initial lock fee = 25 bps of requested_loan_amount_cents, ROUND_HALF_UP to cent
      - name: extension_fee_paid_cents
        type: integer
        source: computed
        description: Cumulative fees from all granted extensions
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: Refund issued on CANCELLED state (0 unless within free-look window)
        default: 0
      - name: status
        type: enum
        source: computed
        description: Lock lifecycle state
        default: LOCKED
        constraints: "enum {LOCKED, EXTENDED, EXPIRED, CONSUMED, CANCELLED}"

  - name: RateLockExtension
    parent: RateLock
    common_fields: false
    fields:
      - name: rate_lock_id
        type: string
        source: input
        description: FK -> RateLock.id
      - name: extra_days
        type: integer
        source: input
        description: Additional days requested (7, 15, or 30)
        constraints: "enum {7, 15, 30}"
      - name: fee_cents
        type: integer
        source: computed
        description: Extension fee per tier (see Calculation rate_lock_extension_fee)
      - name: granted_at
        type: datetime
        source: system
        description: Time the extension was granted

  - name: Disclosure
    parent: LoanApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> LoanApplication.id
      - name: kind
        type: enum
        source: input
        description: Disclosure kind
        constraints: "enum {LOAN_ESTIMATE, CLOSING_DISCLOSURE}"
      - name: version
        type: integer
        source: computed
        description: Monotonically increasing per-application per-kind version (1-indexed)
      - name: issued_at
        type: datetime
        source: system
        description: Issuance timestamp (UTC)
      - name: apr_bps
        type: integer
        source: input
        description: Annual percentage rate in basis points (includes finance charges)
        constraints: "> 0 AND <= 2500"
      - name: total_loan_costs_cents
        type: integer
        source: input
        description: Sum of origination + services-borrower-cannot-shop-for + services-borrower-can-shop-for
      - name: total_other_costs_cents
        type: integer
        source: input
        description: Taxes, prepaids, escrow
      - name: cash_to_close_cents
        type: integer
        source: computed
        description: total_loan_costs_cents + total_other_costs_cents + down_payment - loan_amount adjustments (see calculation)
      - name: waiting_period_started_at
        type: datetime
        source: system
        description: TRID waiting clock origin for this disclosure version
      - name: eligible_to_consummate_at
        type: datetime
        source: computed
        description: "For CLOSING_DISCLOSURE, issued_at + 3 business days; for LOAN_ESTIMATE, null"
        default: null
      - name: status
        type: enum
        source: computed
        description: Disclosure lifecycle
        default: ISSUED
        constraints: "enum {ISSUED, SUPERSEDED, ACKNOWLEDGED, VOIDED}"
      - name: acknowledged_at
        type: datetime
        source: system
        description: When borrower acknowledged receipt
        default: null

  - name: UDAAPReview
    parent: LoanApplication
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> LoanApplication.id
      - name: reviewer_user_id
        type: string
        source: input
        description: Opaque ComplianceOfficer user id
      - name: outcome
        type: enum
        source: input
        description: Compliance verdict
        constraints: "enum {PASS, FLAG, BLOCK}"
      - name: notes
        type: string
        source: input
        description: Reviewer notes; required for FLAG/BLOCK
        default: null

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - name: now
        type: datetime
        source: system
        description: Singleton current UTC time used by all time-gated logic
        default: "2026-01-01T00:00:00.000Z"

# =========================================================================
# §1.2 State Machine Table
# =========================================================================
state_machines:
  - entity: LoanApplication
    initial_state: INTAKE
    terminal_states: [CLOSED, DENIED, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: PRE_QUALIFIED
        trigger: "POST /loan-applications/{id}/pre-qualify"
        actor: LoanOfficer
        preconditions:
          - "Borrower.credit_score >= 620"
          - "Borrower.annual_income_cents > 0"
          - "requested_loan_amount_cents <= 4 * Borrower.annual_income_cents (pre-qual DTI proxy)"
        side_effects:
          - "Set LoanApplication.status = PRE_QUALIFIED"

      - from: PRE_QUALIFIED
        to: UNDERWRITING
        trigger: "POST /loan-applications/{id}/submit-underwriting"
        actor: LoanOfficer
        preconditions:
          - "At least one IncomeVerification with status=VERIFIED exists for this application"
          - "At least one AssetVerification with status=VERIFIED exists for this application"
          - "Appraisal exists with status=COMPLETED"
          - "TitleSearch exists with status IN {CLEAR, RESOLVED}"
          - "An initial LOAN_ESTIMATE Disclosure has been issued (status IN {ISSUED, ACKNOWLEDGED})"
        side_effects:
          - "Set LoanApplication.status = UNDERWRITING"
          - "Assign LoanApplication.compliance_reviewer_id from a ComplianceOfficer who is NOT the assigned_loan_officer_id (segregation of duties)"
          - "Recompute LoanApplication.dti_ratio (see calc dti_calculation)"
          - "Recompute LoanApplication.ltv_ratio (see calc ltv_calculation)"

      - from: UNDERWRITING
        to: CONDITIONAL_APPROVAL
        trigger: "POST /loan-applications/{id}/underwrite-decision with body decision=APPROVE"
        actor: LoanOfficer
        preconditions:
          - "LoanApplication.dti_ratio <= 0.43"
          - "LoanApplication.ltv_ratio <= 0.97"
          - "UDAAPReview exists with outcome=PASS for the latest LOAN_ESTIMATE version"
        side_effects:
          - "Set LoanApplication.status = CONDITIONAL_APPROVAL"
          - "Recompute LoanApplication.pmi_required = (ltv_ratio > 0.80)"

      - from: UNDERWRITING
        to: PRE_QUALIFIED
        trigger: "POST /loan-applications/{id}/underwrite-decision with body decision=COUNTER_OFFER and counter_offered_amount_cents"
        actor: LoanOfficer
        preconditions:
          - "counter_offered_amount_cents > 0 AND < requested_loan_amount_cents"
        side_effects:
          - "Set LoanApplication.status = PRE_QUALIFIED"
          - "Set LoanApplication.counter_offered_amount_cents"
          - "Mark latest LOAN_ESTIMATE Disclosure as SUPERSEDED"

      - from: UNDERWRITING
        to: DENIED
        trigger: "POST /loan-applications/{id}/underwrite-decision with body decision=DENY"
        actor: LoanOfficer
        preconditions:
          - "UDAAPReview latest outcome IN {PASS, FLAG, BLOCK}"
        side_effects:
          - "Set LoanApplication.status = DENIED"
          - "Mark all non-terminal Disclosures as VOIDED"
          - "If RateLock exists with status IN {LOCKED, EXTENDED}, cascade to RateLock CANCELLED with refund_cents=lock_fee_cents+extension_fee_paid_cents"

      - from: CONDITIONAL_APPROVAL
        to: CLEAR_TO_CLOSE
        trigger: "POST /loan-applications/{id}/clear-to-close"
        actor: LoanOfficer
        preconditions:
          - "A CLOSING_DISCLOSURE with status IN {ISSUED, ACKNOWLEDGED} exists"
          - "SystemClock.now >= latest CLOSING_DISCLOSURE.eligible_to_consummate_at (TRID 3 business day wait elapsed)"
          - "RateLock exists with status IN {LOCKED, EXTENDED} AND lock_expires_at > SystemClock.now"
          - "TitleSearch.status IN {CLEAR, RESOLVED}"
          - "UDAAPReview latest outcome=PASS for the latest CLOSING_DISCLOSURE version"
        side_effects:
          - "Set LoanApplication.status = CLEAR_TO_CLOSE"
          - "Set LoanApplication.closing_eligible_at = SystemClock.now"

      - from: CLEAR_TO_CLOSE
        to: CLOSED
        trigger: "POST /loan-applications/{id}/close"
        actor: LoanOfficer
        preconditions:
          - "SystemClock.now <= RateLock.lock_expires_at"
        side_effects:
          - "Set LoanApplication.status = CLOSED"
          - "Set RateLock.status = CONSUMED"
          - "Mark latest CLOSING_DISCLOSURE.status = ACKNOWLEDGED if not already"

      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /loan-applications/{id}/withdraw"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Set LoanApplication.status = WITHDRAWN"
      - from: PRE_QUALIFIED
        to: WITHDRAWN
        trigger: "POST /loan-applications/{id}/withdraw"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Set LoanApplication.status = WITHDRAWN"
          - "If RateLock exists with status IN {LOCKED, EXTENDED}, cascade to RateLock CANCELLED with refund_cents=lock_fee_cents+extension_fee_paid_cents"
      - from: UNDERWRITING
        to: WITHDRAWN
        trigger: "POST /loan-applications/{id}/withdraw"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Set LoanApplication.status = WITHDRAWN"
          - "If RateLock exists with status IN {LOCKED, EXTENDED}, cascade to RateLock CANCELLED with refund_cents=lock_fee_cents+extension_fee_paid_cents"

  - entity: IncomeVerification
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /loan-applications/{appId}/income-verifications/{id}/verify"
        actor: LoanOfficer
        preconditions:
          - "documented_annual_cents >= 0.80 * Borrower.annual_income_cents (within 20% of stated)"
        side_effects:
          - "Set status=VERIFIED, verifier_user_id=actor"
      - from: PENDING
        to: REJECTED
        trigger: "POST /loan-applications/{appId}/income-verifications/{id}/reject"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Set status=REJECTED"

  - entity: AssetVerification
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /loan-applications/{appId}/asset-verifications/{id}/verify"
        actor: LoanOfficer
        preconditions:
          - "balance_cents >= 1000 (must be material)"
        side_effects:
          - "Set status=VERIFIED, verifier_user_id=actor"
      - from: PENDING
        to: REJECTED
        trigger: "POST /loan-applications/{appId}/asset-verifications/{id}/reject"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Set status=REJECTED"

  - entity: Appraisal
    initial_state: ORDERED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: ORDERED
        to: COMPLETED
        trigger: "POST /loan-applications/{appId}/appraisal/complete"
        actor: LoanOfficer
        preconditions:
          - "appraised_value_cents > 0"
        side_effects:
          - "Set status=COMPLETED"
          - "Set valid_until = report_date + 120 calendar days"
          - "If appraised_value_cents < LoanApplication.sale_price_cents, recompute ltv_ratio using appraised_value_cents and bubble update LoanApplication.ltv_ratio; if new ltv_ratio > 0.80, set LoanApplication.pmi_required=true (transitive: appraisal completion -> LTV recompute -> PMI flag)"
      - from: ORDERED
        to: REJECTED
        trigger: "POST /loan-applications/{appId}/appraisal/reject"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Set status=REJECTED"
      - from: COMPLETED
        to: EXPIRED
        trigger: "system: SystemClock.now > Appraisal.valid_until (checked at submit-underwriting and clear-to-close)"
        actor: system
        preconditions:
          - "SystemClock.now > valid_until"
        side_effects:
          - "Set status=EXPIRED (lazy detection during state-advancing operations)"

  - entity: TitleSearch
    initial_state: ORDERED
    terminal_states: []
    transitions:
      - from: ORDERED
        to: CLEAR
        trigger: "POST /loan-applications/{appId}/title-search/complete with body defects_found=[]"
        actor: LoanOfficer
        preconditions:
          - "defects_found is empty array"
        side_effects:
          - "Set status=CLEAR"
      - from: ORDERED
        to: ISSUES_FOUND
        trigger: "POST /loan-applications/{appId}/title-search/complete with body defects_found=[...]"
        actor: LoanOfficer
        preconditions:
          - "defects_found is non-empty"
        side_effects:
          - "Set status=ISSUES_FOUND"
      - from: ISSUES_FOUND
        to: RESOLVED
        trigger: "POST /loan-applications/{appId}/title-search/resolve"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Set status=RESOLVED, resolved_at=SystemClock.now"

  - entity: RateLock
    initial_state: LOCKED
    terminal_states: [EXPIRED, CONSUMED, CANCELLED]
    transitions:
      - from: LOCKED
        to: EXTENDED
        trigger: "POST /loan-applications/{appId}/rate-lock/extend with extra_days in {7,15,30}"
        actor: LoanOfficer
        preconditions:
          - "SystemClock.now <= lock_expires_at (not yet expired at time of request)"
          - "LoanApplication.status NOT IN {DENIED, WITHDRAWN, CLOSED}"
          - "No other in-flight extension for this RateLock (sequential)"
        side_effects:
          - "Create RateLockExtension"
          - "Set lock_expires_at = lock_expires_at + extra_days days"
          - "Increment extension_fee_paid_cents by computed fee (see calc rate_lock_extension_fee)"
          - "Set status=EXTENDED"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /loan-applications/{appId}/rate-lock/extend (subsequent extension on already-extended lock — self loop to model cyclic re-extension)"
        actor: LoanOfficer
        preconditions:
          - "SystemClock.now <= lock_expires_at"
          - "Total cumulative extra_days across all extensions <= 60"
          - "LoanApplication.status NOT IN {DENIED, WITHDRAWN, CLOSED}"
        side_effects:
          - "Create RateLockExtension"
          - "Set lock_expires_at = lock_expires_at + extra_days days"
          - "Increment extension_fee_paid_cents by computed fee"
      - from: LOCKED
        to: EXPIRED
        trigger: "system: SystemClock.now > lock_expires_at (checked at clear-to-close and close)"
        actor: system
        preconditions:
          - "SystemClock.now > lock_expires_at"
        side_effects:
          - "Set status=EXPIRED (lazy detection)"
      - from: EXTENDED
        to: EXPIRED
        trigger: "system: SystemClock.now > lock_expires_at"
        actor: system
        preconditions:
          - "SystemClock.now > lock_expires_at"
        side_effects:
          - "Set status=EXPIRED (lazy detection)"
      - from: LOCKED
        to: CANCELLED
        trigger: "cascade from LoanApplication transition to DENIED/WITHDRAWN; or POST /loan-applications/{appId}/rate-lock/cancel"
        actor: LoanOfficer | system
        preconditions: []
        side_effects:
          - "Set status=CANCELLED"
          - "Set refund_cents = lock_fee_cents + extension_fee_paid_cents IF (SystemClock.now - locked_at) <= 48 hours (free-look refund), ELSE refund_cents=0"
      - from: EXTENDED
        to: CANCELLED
        trigger: "cascade from LoanApplication transition to DENIED/WITHDRAWN; or POST /loan-applications/{appId}/rate-lock/cancel"
        actor: LoanOfficer | system
        preconditions: []
        side_effects:
          - "Set status=CANCELLED"
          - "Set refund_cents = lock_fee_cents + extension_fee_paid_cents IF (SystemClock.now - locked_at) <= 48 hours, ELSE refund_cents=0"
      - from: LOCKED
        to: CONSUMED
        trigger: "cascade from LoanApplication.close"
        actor: system
        preconditions:
          - "LoanApplication.status transitions to CLOSED"
        side_effects:
          - "Set status=CONSUMED"
      - from: EXTENDED
        to: CONSUMED
        trigger: "cascade from LoanApplication.close"
        actor: system
        preconditions:
          - "LoanApplication.status transitions to CLOSED"
        side_effects:
          - "Set status=CONSUMED"

  - entity: Disclosure
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /loan-applications/{appId}/disclosures/{id}/acknowledge"
        actor: Borrower
        preconditions:
          - "actor is the Borrower of this application (Borrower.id == LoanApplication.borrower_id)"
        side_effects:
          - "Set status=ACKNOWLEDGED, acknowledged_at=SystemClock.now"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: new Disclosure of same kind issued for the application"
        actor: system
        preconditions: []
        side_effects:
          - "Set status=SUPERSEDED"
      - from: ACKNOWLEDGED
        to: SUPERSEDED
        trigger: "system: new Disclosure of same kind issued (e.g., APR change > 0.125% triggers re-disclosure). TRANSITIVE CASCADE: issuance of new LOAN_ESTIMATE -> supersedes previous AND resets trid_clock_started_at on LoanApplication AND if a CLOSING_DISCLOSURE existed, re-issuance forces a new CD with new eligible_to_consummate_at, pushing closing eligibility forward."
        actor: system
        preconditions: []
        side_effects:
          - "Set previous Disclosure.status=SUPERSEDED"
          - "If kind=LOAN_ESTIMATE and the new disclosure's apr_bps differs from latest CLOSING_DISCLOSURE by > 12.5 bps, mark any ACKNOWLEDGED CLOSING_DISCLOSURE as SUPERSEDED and require new CD (cascading re-disclosure)"
      - from: ISSUED
        to: VOIDED
        trigger: "cascade from LoanApplication transition to DENIED"
        actor: system
        preconditions: []
        side_effects:
          - "Set status=VOIDED"
      - from: ACKNOWLEDGED
        to: VOIDED
        trigger: "cascade from LoanApplication transition to DENIED"
        actor: system
        preconditions: []
        side_effects:
          - "Set status=VOIDED"

# =========================================================================
# §1.2.1 Concurrency Rules
# =========================================================================
concurrency_rules:
  - scenario: "Two simultaneous rate-lock-extend requests on the same RateLock"
    guarantee: "Exactly one extension granted; the second is rejected before fee_cents is computed"
    error_id: ERR_EXTENSION_IN_FLIGHT
    http_status: 409
    serialization: "First-writer-wins on RateLockExtension creation per rate_lock_id; second concurrent request rejected"

  - scenario: "Concurrent issuance of two LOAN_ESTIMATE disclosures for the same application"
    guarantee: "Exactly one new version persists; second is rejected"
    error_id: ERR_DISCLOSURE_VERSION_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on (application_id, kind, version) uniqueness"

  - scenario: "Clear-to-close and a re-disclosure POST race"
    guarantee: "If a new LOAN_ESTIMATE is issued while CTC is being computed, CTC must fail because closing_eligible window has been reset"
    error_id: ERR_TRID_WAITING_PERIOD
    http_status: 409
    serialization: "Strict read of latest CLOSING_DISCLOSURE.eligible_to_consummate_at at CTC time"

  - scenario: "Two loan officers attempt to assign themselves as compliance_reviewer on submit-underwriting"
    guarantee: "Exactly one compliance_reviewer assignment succeeds; the second is rejected"
    error_id: ERR_COMPLIANCE_REVIEWER_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on LoanApplication.compliance_reviewer_id"

# =========================================================================
# §1.3 Calculation Rules Table
# =========================================================================
calculations:
  - name: dti_calculation
    trigger: "On LoanApplication transition INTAKE->PRE_QUALIFIED and PRE_QUALIFIED->UNDERWRITING; output stored on LoanApplication.dti_ratio"
    algorithm: aggregation
    formula: |
      effective_income_cents = sum(IncomeVerification.documented_annual_cents
                                   WHERE status=VERIFIED AND application_id=app.id)
      IF effective_income_cents == 0:
        effective_income_cents = Borrower.annual_income_cents  # pre-qual fallback
      monthly_income_cents = effective_income_cents / 12
      # Simplified monthly debt: 28% of requested principal divided by term years
      approx_monthly_payment_cents = (requested_loan_amount_cents * 0.0065)  # placeholder rate-agnostic proxy
      dti_ratio = approx_monthly_payment_cents / monthly_income_cents
      ROUND_HALF_UP to 4 decimal places
    input_set: "IncomeVerification rows for the application with status=VERIFIED; Borrower fallback only at pre-qual"
    constants:
      ESTIMATION_RATE_FACTOR: 0.0065
      DTI_PRECISION: 4
    precision: "4 decimal places, ROUND_HALF_UP"
    variants:
      - name: pre_qualification_dti
        when: "Used at INTAKE->PRE_QUALIFIED when no VERIFIED IncomeVerification exists yet; falls back to Borrower.annual_income_cents"
        difference: "Income source is stated (Borrower.annual_income_cents) rather than verified aggregate"
      - name: underwriting_dti
        when: "Used at PRE_QUALIFIED->UNDERWRITING and CONDITIONAL_APPROVAL gating; uses only VERIFIED IncomeVerification rows"
        difference: "Excludes Borrower.annual_income_cents fallback; if no VERIFIED rows the calc fails and the transition is blocked"

  - name: ltv_calculation
    trigger: "On Appraisal completion AND on LoanApplication transition to UNDERWRITING; output stored on LoanApplication.ltv_ratio"
    algorithm: aggregation
    formula: |
      value_basis_cents = MIN(LoanApplication.sale_price_cents, Appraisal.appraised_value_cents)
      principal_cents = COALESCE(LoanApplication.counter_offered_amount_cents,
                                 LoanApplication.requested_loan_amount_cents)
      ltv_ratio = principal_cents / value_basis_cents
      ROUND_HALF_UP to 4 decimal places
    input_set: "Latest COMPLETED Appraisal; counter_offered_amount_cents if present, else requested_loan_amount_cents"
    constants:
      LTV_PRECISION: 4
      PMI_THRESHOLD: 0.80
    precision: "4 decimal places, ROUND_HALF_UP"

  - name: apr_tolerance_check
    trigger: "On POST /loan-applications/{id}/disclosures (issuance of new CLOSING_DISCLOSURE), compared to the most recent ACKNOWLEDGED LOAN_ESTIMATE"
    algorithm: threshold
    formula: |
      latest_le = latest LOAN_ESTIMATE Disclosure for application with status IN {ISSUED, ACKNOWLEDGED, SUPERSEDED}
                  ordered by version DESC LIMIT 1
      apr_delta_bps = abs(new_cd.apr_bps - latest_le.apr_bps)
      IF apr_delta_bps > 12.5 (i.e., > 0.125%):
        REQUIRE re-disclosure: issue a new LOAN_ESTIMATE BEFORE the CD, then re-issue CD;
        else accept the CD as-is.
      The boundary is strict ">": apr_delta_bps == 12 -> ACCEPT, apr_delta_bps == 13 -> RE-DISCLOSE.
    input_set: "Latest LOAN_ESTIMATE (any non-VOIDED status); incoming CLOSING_DISCLOSURE candidate"
    constants:
      APR_TOLERANCE_BPS: 12.5
    precision: "0.5 bps resolution (integer bps); the constant is 12.5, comparisons use 'apr_delta_bps > 12'"

  - name: closing_cost_total
    trigger: "On POST /loan-applications/{id}/disclosures issuance; output stored on Disclosure.cash_to_close_cents"
    algorithm: tiered_pricing
    formula: |
      # Per-line rounding order is PINNED:
      # (1) Apply state-tax rate to total_other_costs_cents PER LINE FIRST (round each line to cent),
      # (2) THEN sum, (3) THEN apply origination fee tier, (4) THEN add total_loan_costs_cents.
      # The two interpretations (sum-then-round vs round-then-sum) differ by up to N cents where N is the number of cost lines.
      # We PIN: round each tax line individually using ROUND_HALF_UP, sum the rounded results, then proceed.

      tax_lines = compute per-line taxes:
        state_tax_lines = [ROUND_HALF_UP(line.cents * STATE_TAX_RATE[state_code], 0)  FOR line IN cost_lines]
      taxed_other_costs_cents = SUM(state_tax_lines) + total_other_costs_cents

      # Tiered origination fee (boundary uses '>')
      principal = LoanApplication.requested_loan_amount_cents
      IF principal <= 41700000 (i.e., $417,000):
        origination_fee_cents = ROUND_HALF_UP(principal * 0.01, 0)         # 1.00%
      ELSE IF principal <= 76600000 (i.e., $766,000):
        origination_fee_cents = ROUND_HALF_UP(principal * 0.0075, 0)       # 0.75%
      ELSE:
        origination_fee_cents = ROUND_HALF_UP(principal * 0.005, 0)        # 0.50%

      cash_to_close_cents = total_loan_costs_cents + taxed_other_costs_cents + origination_fee_cents - principal
      cash_to_close_cents = ROUND_HALF_UP(cash_to_close_cents, 0)
    input_set: "Disclosure input fields total_loan_costs_cents and total_other_costs_cents; LoanApplication.requested_loan_amount_cents; STATE_TAX_RATE keyed by Borrower.state_code"
    constants:
      STATE_TAX_RATE:
        CA: 0.0050
        NY: 0.0125
        TX: 0.0075
        DEFAULT: 0.0100
      TIER_LOW_CENTS: 41700000
      TIER_MID_CENTS: 76600000
    precision: "Whole cents, ROUND_HALF_UP. Rounding order is PINNED: per-line tax round, then sum, then origination tier, then total."

  - name: trid_waiting_period
    trigger: "On Disclosure issuance with kind=CLOSING_DISCLOSURE; output stored on Disclosure.eligible_to_consummate_at and LoanApplication.closing_eligible_at projection"
    algorithm: interval_merge
    formula: |
      # TRID requires CD delivered at least 3 business days before consummation.
      # Business days: Mon-Fri excluding federal holidays (we use ONLY a static list:
      # 2026-01-01 New Year's, 2026-07-04 Independence (observed Mon Jul-6), 2026-12-25 Christmas).
      eligible = issued_at
      added = 0
      WHILE added < 3:
        eligible = eligible + 1 calendar day
        IF eligible.weekday IN {SAT, SUN}: CONTINUE
        IF eligible.date IN HOLIDAYS: CONTINUE
        added += 1
      # Eligibility is the START of that business day in UTC (00:00:00 UTC).
      eligible_to_consummate_at = eligible at 00:00:00 UTC
      # Boundary semantics: closing is allowed when SystemClock.now >= eligible_to_consummate_at (strict '>=').
    input_set: "issued_at and the static holiday list"
    constants:
      HOLIDAYS_2026:
        - "2026-01-01"
        - "2026-07-06"   # Independence observed
        - "2026-12-25"
      BUSINESS_DAYS_REQUIRED: 3
    precision: "Whole UTC days, anchored at 00:00:00.000 UTC"

  - name: rate_lock_extension_fee
    trigger: "On RateLockExtension creation; output stored on RateLockExtension.fee_cents and incremented onto RateLock.extension_fee_paid_cents"
    algorithm: tiered_pricing
    formula: |
      # Fee tier on extra_days; computed as bps of requested_loan_amount_cents.
      IF extra_days == 7:  bps = 5    # 0.05%
      ELIF extra_days == 15: bps = 10  # 0.10%
      ELIF extra_days == 30: bps = 25  # 0.25%
      raw_cents = requested_loan_amount_cents * (bps / 10000)
      fee_cents = ROUND_HALF_UP(raw_cents, 0)
    input_set: "RateLockExtension.extra_days; LoanApplication.requested_loan_amount_cents"
    constants:
      FEE_BPS_TIER:
        7: 5
        15: 10
        30: 25
    precision: "Whole cents, ROUND_HALF_UP"

  - name: appraisal_validity_window
    trigger: "On Appraisal.complete; output stored on Appraisal.valid_until"
    algorithm: interval_merge
    formula: |
      valid_until = report_date + 120 calendar days at 23:59:59.999 UTC
      # Boundary semantics: appraisal is valid when SystemClock.now <= valid_until (strict '<=').
    input_set: "Appraisal.report_date"
    constants:
      APPRAISAL_VALIDITY_DAYS: 120
    precision: "Millisecond-precise UTC instant"

# =========================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role in {LoanOfficer, ComplianceOfficer, Borrower, Admin}"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Referenced LoanApplication.id exists (validated left-to-right in path before nested resources)"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "all nested under /loan-applications/{id}"

  - priority: 4
    category: existence
    check: "Referenced nested resource (IncomeVerification/AssetVerification/Appraisal/TitleSearch/RateLock/Disclosure/UDAAPReview) exists under the given application"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all nested resource endpoints"

  - priority: 5
    category: state
    check: "Source state matches the transition's 'from' (e.g., underwrite-decision requires LoanApplication.status=UNDERWRITING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "UDAAP segregation of duties: actor on underwrite-decision and clear-to-close MUST NOT equal LoanApplication.compliance_reviewer_id"
    error_id: ERR_UDAAP_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /loan-applications/{id}/underwrite-decision, POST /loan-applications/{id}/clear-to-close"

  - priority: 7
    category: business_safety
    check: "UDAAP review required: clear-to-close requires UDAAPReview with outcome=PASS on the latest CLOSING_DISCLOSURE version"
    error_id: ERR_UDAAP_REVIEW_REQUIRED
    http_status: 409
    applies_to: "POST /loan-applications/{id}/clear-to-close"

  - priority: 8
    category: business_temporal
    check: "TRID 3-business-day waiting period elapsed: SystemClock.now >= latest CLOSING_DISCLOSURE.eligible_to_consummate_at"
    error_id: ERR_TRID_WAITING_PERIOD
    http_status: 409
    applies_to: "POST /loan-applications/{id}/clear-to-close, POST /loan-applications/{id}/close"

  - priority: 9
    category: business_temporal
    check: "Appraisal not expired: SystemClock.now <= latest COMPLETED Appraisal.valid_until at submit-underwriting and clear-to-close"
    error_id: ERR_APPRAISAL_EXPIRED
    http_status: 409
    applies_to: "POST /loan-applications/{id}/submit-underwriting, POST /loan-applications/{id}/clear-to-close"

  - priority: 10
    category: business_temporal
    check: "Rate lock not expired at close-time: SystemClock.now <= RateLock.lock_expires_at"
    error_id: ERR_RATE_LOCK_EXPIRED
    http_status: 409
    applies_to: "POST /loan-applications/{id}/clear-to-close, POST /loan-applications/{id}/close"

  - priority: 11
    category: business_referential
    check: "Required dependencies present at submit-underwriting: VERIFIED IncomeVerification, VERIFIED AssetVerification, COMPLETED Appraisal, CLEAR or RESOLVED TitleSearch, issued LOAN_ESTIMATE"
    error_id: ERR_MISSING_DEPENDENCIES
    http_status: 409
    applies_to: "POST /loan-applications/{id}/submit-underwriting"

  - priority: 12
    category: business_constraint
    check: "APR tolerance: a CLOSING_DISCLOSURE whose apr_bps differs from latest LOAN_ESTIMATE.apr_bps by > 12 bps requires a new LOAN_ESTIMATE first"
    error_id: ERR_APR_TOLERANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /loan-applications/{id}/disclosures (when kind=CLOSING_DISCLOSURE)"

  - priority: 13
    category: business_constraint
    check: "Rate lock extension cumulative cap: total extra_days across all RateLockExtension rows for this lock <= 60"
    error_id: ERR_EXTENSION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /loan-applications/{id}/rate-lock/extend"

  - priority: 14
    category: business_constraint
    check: "RateLock overlap: at most ONE active (status IN {LOCKED, EXTENDED}) RateLock per LoanApplication at any time; a new POST while one is active is rejected"
    error_id: ERR_RATE_LOCK_OVERLAP
    http_status: 409
    applies_to: "POST /loan-applications/{id}/rate-lock"

  - priority: 15
    category: business_constraint
    check: "Appraisal validity overlap: at most ONE COMPLETED Appraisal whose valid_until > SystemClock.now exists per LoanApplication"
    error_id: ERR_APPRAISAL_OVERLAP
    http_status: 409
    applies_to: "POST /loan-applications/{id}/appraisal"

  - priority: 16
    category: business_fiscal
    check: "DTI ceiling: LoanApplication.dti_ratio <= 0.43 at CONDITIONAL_APPROVAL"
    error_id: ERR_DTI_EXCEEDED
    http_status: 422
    applies_to: "POST /loan-applications/{id}/underwrite-decision"

  - priority: 17
    category: business_fiscal
    check: "LTV ceiling: LoanApplication.ltv_ratio <= 0.97 at CONDITIONAL_APPROVAL"
    error_id: ERR_LTV_EXCEEDED
    http_status: 422
    applies_to: "POST /loan-applications/{id}/underwrite-decision"

  - priority: 18
    category: business_constraint
    check: "Counter-offer must be strictly less than requested_loan_amount_cents and > 0"
    error_id: ERR_INVALID_COUNTER_OFFER
    http_status: 422
    applies_to: "POST /loan-applications/{id}/underwrite-decision (when decision=COUNTER_OFFER)"

  - priority: 19
    category: business_constraint
    check: "Disclosure version monotonicity: requesting a Disclosure with a non-monotonic version field is rejected (server mints version automatically)"
    error_id: ERR_DISCLOSURE_VERSION_CONFLICT
    http_status: 409
    applies_to: "POST /loan-applications/{id}/disclosures"

  - priority: 20
    category: business_constraint
    check: "OCC version check: PATCH/PUT requests with `version` field that does not match server's current version are rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH and PUT endpoints"

  - priority: 21
    category: business_constraint
    check: "Body schema: required fields present, types valid, enum values valid, integers non-negative where required"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

# =========================================================================
# §1.5 API Endpoint Table
# =========================================================================
endpoints:
  # ---- Borrower management ----
  - method: POST
    path: "/borrowers"
    description: "Create a Borrower"
    roles: [LoanOfficer, Admin]
    code: 201
    input: [full_name, ssn_last4, annual_income_cents, credit_score, state_code]
    output: Borrower
    side_effects: []

  - method: GET
    path: "/borrowers/{id}"
    description: "Read a Borrower"
    roles: [LoanOfficer, ComplianceOfficer, Admin, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  # ---- Loan applications ----
  - method: POST
    path: "/loan-applications"
    description: "Create a LoanApplication in INTAKE"
    roles: [LoanOfficer, Admin]
    code: 201
    input: [borrower_id, property_address, sale_price_cents, requested_loan_amount_cents, loan_term_months, loan_purpose, assigned_loan_officer_id]
    output: LoanApplication
    side_effects: []

  - method: GET
    path: "/loan-applications/{id}"
    description: "Read a LoanApplication"
    roles: [LoanOfficer, ComplianceOfficer, Admin, Borrower]
    code: 200
    input: []
    output: LoanApplication
    side_effects: []

  - method: GET
    path: "/loan-applications"
    description: "List LoanApplications (paginated, filter by status, borrower_id)"
    roles: [LoanOfficer, ComplianceOfficer, Admin]
    code: 200
    input: ["status?", "borrower_id?", "limit?", "offset?"]
    output: "LoanApplication[]"
    side_effects: []

  - method: POST
    path: "/loan-applications/{id}/pre-qualify"
    description: "Transition INTAKE -> PRE_QUALIFIED"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["compute pre_qualification_dti variant"]

  - method: POST
    path: "/loan-applications/{id}/submit-underwriting"
    description: "Transition PRE_QUALIFIED -> UNDERWRITING"
    roles: [LoanOfficer]
    code: 200
    input: [compliance_reviewer_id]
    output: LoanApplication
    side_effects: ["assign compliance_reviewer_id (SoD enforcement)", "compute underwriting_dti and ltv_calculation"]

  - method: POST
    path: "/loan-applications/{id}/underwrite-decision"
    description: "Branching transition from UNDERWRITING to {CONDITIONAL_APPROVAL, PRE_QUALIFIED (counter), DENIED}"
    roles: [LoanOfficer]
    code: 200
    input: [decision, "counter_offered_amount_cents?"]
    output: LoanApplication
    side_effects: ["cascade Disclosures to SUPERSEDED on counter; cascade RateLock to CANCELLED on DENY"]

  - method: POST
    path: "/loan-applications/{id}/clear-to-close"
    description: "Transition CONDITIONAL_APPROVAL -> CLEAR_TO_CLOSE"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["validate TRID waiting period, RateLock unexpired, UDAAP PASS"]

  - method: POST
    path: "/loan-applications/{id}/close"
    description: "Transition CLEAR_TO_CLOSE -> CLOSED"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["cascade RateLock CONSUMED; cascade latest CD to ACKNOWLEDGED"]

  - method: POST
    path: "/loan-applications/{id}/withdraw"
    description: "Voluntary withdrawal from INTAKE, PRE_QUALIFIED, or UNDERWRITING"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["cascade RateLock CANCELLED with refund computation"]

  # ---- Income / Asset verification ----
  - method: POST
    path: "/loan-applications/{id}/income-verifications"
    description: "Create an IncomeVerification (PENDING)"
    roles: [LoanOfficer]
    code: 201
    input: [source_type, documented_annual_cents]
    output: IncomeVerification
    side_effects: []

  - method: POST
    path: "/loan-applications/{appId}/income-verifications/{id}/verify"
    description: "Transition PENDING -> VERIFIED"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: IncomeVerification
    side_effects: []

  - method: POST
    path: "/loan-applications/{appId}/income-verifications/{id}/reject"
    description: "Transition PENDING -> REJECTED"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: IncomeVerification
    side_effects: []

  - method: POST
    path: "/loan-applications/{id}/asset-verifications"
    description: "Create an AssetVerification (PENDING)"
    roles: [LoanOfficer]
    code: 201
    input: [asset_type, balance_cents]
    output: AssetVerification
    side_effects: []

  - method: POST
    path: "/loan-applications/{appId}/asset-verifications/{id}/verify"
    description: "Transition PENDING -> VERIFIED"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: AssetVerification
    side_effects: []

  - method: POST
    path: "/loan-applications/{appId}/asset-verifications/{id}/reject"
    description: "Transition PENDING -> REJECTED"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: AssetVerification
    side_effects: []

  # ---- Appraisal ----
  - method: POST
    path: "/loan-applications/{id}/appraisal"
    description: "Order an Appraisal (status ORDERED)"
    roles: [LoanOfficer]
    code: 201
    input: [report_date]
    output: Appraisal
    side_effects: []

  - method: POST
    path: "/loan-applications/{id}/appraisal/complete"
    description: "Transition ORDERED -> COMPLETED with appraised_value_cents"
    roles: [LoanOfficer]
    code: 200
    input: [appraised_value_cents]
    output: Appraisal
    side_effects: ["compute valid_until via appraisal_validity_window; bubble ltv_calculation; if ltv>0.80 set LoanApplication.pmi_required=true"]

  - method: POST
    path: "/loan-applications/{id}/appraisal/reject"
    description: "Transition ORDERED -> REJECTED"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Appraisal
    side_effects: []

  # ---- Title search ----
  - method: POST
    path: "/loan-applications/{id}/title-search"
    description: "Order a TitleSearch (status ORDERED)"
    roles: [LoanOfficer]
    code: 201
    input: []
    output: TitleSearch
    side_effects: []

  - method: POST
    path: "/loan-applications/{id}/title-search/complete"
    description: "Transition ORDERED -> CLEAR or ISSUES_FOUND based on defects_found"
    roles: [LoanOfficer]
    code: 200
    input: [defects_found]
    output: TitleSearch
    side_effects: []

  - method: POST
    path: "/loan-applications/{id}/title-search/resolve"
    description: "Transition ISSUES_FOUND -> RESOLVED"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: TitleSearch
    side_effects: []

  # ---- Rate lock ----
  - method: POST
    path: "/loan-applications/{id}/rate-lock"
    description: "Place a new RateLock (status LOCKED)"
    roles: [LoanOfficer]
    code: 201
    input: [locked_rate_bps]
    output: RateLock
    side_effects: ["compute lock_fee_cents = 25 bps of requested_loan_amount_cents"]

  - method: POST
    path: "/loan-applications/{id}/rate-lock/extend"
    description: "Extend an active RateLock by 7/15/30 days"
    roles: [LoanOfficer]
    code: 200
    input: [extra_days]
    output: RateLock
    side_effects: ["create RateLockExtension; recompute lock_expires_at and extension_fee_paid_cents via rate_lock_extension_fee"]

  - method: POST
    path: "/loan-applications/{id}/rate-lock/cancel"
    description: "Cancel an active RateLock; refund per 48h free-look rule"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: RateLock
    side_effects: ["compute refund_cents per cancel cascade rule"]

  - method: GET
    path: "/loan-applications/{id}/rate-lock"
    description: "Read the current (latest) RateLock for the application"
    roles: [LoanOfficer, ComplianceOfficer, Admin, Borrower]
    code: 200
    input: []
    output: RateLock
    side_effects: []

  # ---- Disclosures ----
  - method: POST
    path: "/loan-applications/{id}/disclosures"
    description: "Issue a Disclosure (LOAN_ESTIMATE or CLOSING_DISCLOSURE)"
    roles: [LoanOfficer]
    code: 201
    input: [kind, apr_bps, total_loan_costs_cents, total_other_costs_cents]
    output: Disclosure
    side_effects: ["compute closing_cost_total; if kind=CLOSING_DISCLOSURE run apr_tolerance_check and compute trid_waiting_period; set previous-same-kind status=SUPERSEDED"]

  - method: POST
    path: "/loan-applications/{appId}/disclosures/{id}/acknowledge"
    description: "Borrower acknowledges receipt"
    roles: [Borrower]
    code: 200
    input: []
    output: Disclosure
    side_effects: ["set acknowledged_at"]

  - method: GET
    path: "/loan-applications/{id}/disclosures"
    description: "List Disclosures for an application"
    roles: [LoanOfficer, ComplianceOfficer, Admin, Borrower]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "Disclosure[]"
    side_effects: []

  # ---- UDAAP ----
  - method: POST
    path: "/loan-applications/{id}/udaap-reviews"
    description: "ComplianceOfficer submits a UDAAP review"
    roles: [ComplianceOfficer]
    code: 201
    input: [outcome, "notes?"]
    output: UDAAPReview
    side_effects: ["actor MUST equal LoanApplication.compliance_reviewer_id"]

  - method: GET
    path: "/loan-applications/{id}/udaap-reviews"
    description: "List UDAAP reviews"
    roles: [ComplianceOfficer, Admin]
    code: 200
    input: []
    output: "UDAAPReview[]"
    side_effects: []

  # ---- Test-driving endpoints (clock) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance SystemClock.now to a given ISO8601 timestamp (test-driving endpoint required for time-gated transitions)"
    roles: [Admin]
    code: 200
    input: [to]
    output: SystemClock
    side_effects: []

  - method: GET
    path: "/_clock"
    description: "Read SystemClock.now"
    roles: [Admin, LoanOfficer, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: SystemClock
    side_effects: []

# =========================================================================
# §1.6 Error Code Catalog
# =========================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for the endpoint per §1.7 RBAC"
  - id: ERR_UDAAP_SOD_VIOLATION
    http: 403
    condition: "Same user attempts both LoanOfficer action and ComplianceOfficer action on same application"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "LoanApplication id in path does not exist"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Nested resource id does not exist under the given application"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Source state does not match the transition's 'from'"
  - id: ERR_UDAAP_REVIEW_REQUIRED
    http: 409
    condition: "Clear-to-close attempted without UDAAPReview outcome=PASS on latest CLOSING_DISCLOSURE"
  - id: ERR_TRID_WAITING_PERIOD
    http: 409
    condition: "Clear-to-close or close before the TRID 3-business-day waiting period elapsed"
  - id: ERR_APPRAISAL_EXPIRED
    http: 409
    condition: "Appraisal.valid_until < SystemClock.now at a state-advancing step"
  - id: ERR_RATE_LOCK_EXPIRED
    http: 409
    condition: "RateLock.lock_expires_at < SystemClock.now at clear-to-close or close"
  - id: ERR_MISSING_DEPENDENCIES
    http: 409
    condition: "submit-underwriting attempted without all required verified dependencies"
  - id: ERR_APR_TOLERANCE_EXCEEDED
    http: 409
    condition: "CLOSING_DISCLOSURE.apr_bps differs from latest LOAN_ESTIMATE.apr_bps by > 12 bps without prior re-disclosure"
  - id: ERR_EXTENSION_CAP_EXCEEDED
    http: 409
    condition: "Cumulative RateLock extension days would exceed 60"
  - id: ERR_EXTENSION_IN_FLIGHT
    http: 409
    condition: "Concurrent rate-lock extension on the same RateLock"
  - id: ERR_RATE_LOCK_OVERLAP
    http: 409
    condition: "An active RateLock already exists for this LoanApplication"
  - id: ERR_APPRAISAL_OVERLAP
    http: 409
    condition: "An unexpired COMPLETED Appraisal already exists for this LoanApplication"
  - id: ERR_DISCLOSURE_VERSION_CONFLICT
    http: 409
    condition: "Concurrent Disclosure issuance of same (application_id, kind) version"
  - id: ERR_COMPLIANCE_REVIEWER_CONFLICT
    http: 409
    condition: "compliance_reviewer_id already assigned on submit-underwriting race"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH/PUT"
  - id: ERR_DTI_EXCEEDED
    http: 422
    condition: "dti_ratio > 0.43 at underwrite-decision=APPROVE"
  - id: ERR_LTV_EXCEEDED
    http: 422
    condition: "ltv_ratio > 0.97 at underwrite-decision=APPROVE"
  - id: ERR_INVALID_COUNTER_OFFER
    http: 422
    condition: "Counter-offer is not strictly between 0 and requested_loan_amount_cents"
  - id: ERR_VALIDATION
    http: 422
    condition: "Body schema invalid (missing fields, wrong type, invalid enum)"

# =========================================================================
# §1.7 RBAC Matrix
# =========================================================================
roles:
  - name: LoanOfficer
    description: "Originates and shepherds LoanApplications through to closing; cannot perform UDAAP reviews for applications they originate (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /loan-applications/{id}/pre-qualify"
      - "POST /loan-applications/{id}/submit-underwriting"
      - "POST /loan-applications/{id}/underwrite-decision"
      - "POST /loan-applications/{id}/clear-to-close"
      - "POST /loan-applications/{id}/close"
      - "POST /loan-applications/{id}/withdraw"
      - "POST /loan-applications/{id}/income-verifications, /verify, /reject"
      - "POST /loan-applications/{id}/asset-verifications, /verify, /reject"
      - "POST /loan-applications/{id}/appraisal, /complete, /reject"
      - "POST /loan-applications/{id}/title-search, /complete, /resolve"
      - "POST /loan-applications/{id}/rate-lock, /extend, /cancel"
      - "POST /loan-applications/{id}/disclosures"
    shared_operations:
      - "POST /loan-applications, /borrowers (with Admin)"
      - "GET endpoints"

  - name: ComplianceOfficer
    description: "Performs UDAAP reviews; MUST NOT be the loan officer of the application; assigned at submit-underwriting"
    identity: opaque
    exclusive_operations:
      - "POST /loan-applications/{id}/udaap-reviews"
    shared_operations:
      - "GET endpoints on loan applications, disclosures, udaap-reviews"

  - name: Borrower
    description: "End consumer; may acknowledge disclosures and view their own application"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /loan-applications/{appId}/disclosures/{id}/acknowledge"
    shared_operations:
      - "GET /loan-applications/{id} (only when LoanApplication.borrower_id == X-User-ID)"
      - "GET /loan-applications/{id}/disclosures"
      - "GET /borrowers/{id} (only own id)"

  - name: Admin
    description: "Operational admin; can advance the system clock and create base resources"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/advance"
    shared_operations:
      - "POST /borrowers"
      - "POST /loan-applications"
      - "GET endpoints"
