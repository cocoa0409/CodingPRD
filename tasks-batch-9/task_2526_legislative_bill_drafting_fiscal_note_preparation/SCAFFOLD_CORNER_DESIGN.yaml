            - "The convene call returns HTTP 200 and Session.${s_id}.status == CONVENED"
            - "Session.${s_id}.convened_utc == 2026-09-01T00:00:00Z and adjourned_utc == null"
            - "Session.${s_id}.version == 2"
            - "The follow-up POST /drafting-requests returns 201 and DraftingRequest.${dr_id}.status == SUBMITTED"

