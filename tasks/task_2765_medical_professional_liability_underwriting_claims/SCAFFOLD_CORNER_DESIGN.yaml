            - "PolicyTerm.${term_b}.status == EXPIRED"
            - "Policy.${pol_a}.status == EXPIRED"
            - "Policy.${pol_a}.current_term_id == null"
            - "Insured.${ins_a}.credentialing_status == LAPSED"
            - "Insured.${ins_a}.status == SUSPENDED"
            - "Claim.${clm_a}.claim_status == CLOSED"
            - "Claim.${clm_a}.closed_on == 2028-09-01"
            - "Insured.${ins_a}.open_claim_count == 0"

      - name: four_hop_cascade_end_to_end_is_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: approved_rate_filing_cascades_base_rate_through_draft_term_to_policy_total
          rationale: "That instance verifies the deepest chain in the model, RateFiling -> SpecialtyClass -> PolicyTerm -> Policy, including the admin-fee tier crossing the re-rating causes."
      - name: divergent_branch_cascade_is_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: flat_cancellation_unwinds_the_premium_ledger_and_voids_dependent_coverage
          rationale: "That instance drives the cascade that is conditional on the branch taken - claims DENIED, negotiations ABANDONED, tails VOIDed and the aggregate surrendered on FLAT only - which is the partial-application case this row asks for."
      - name: risk_classification_variants_are_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.insured_risk_classification
        excluded_because:
          difficulty_instance: risk_classification_snapshot_versus_renewal_prospective_band_divergence
          rationale: "That instance runs the same insured through both variants and asserts they land in different risk bands, plus which variant applies in which context."
      - name: incurred_variants_are_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: claim_incurred_case_versus_actuarial_delta_after_expense_payment
          rationale: "That instance asserts both incurred figures on the same claim and the exact delta that opens once paid_expense is non-zero."

      - name: insured_and_firm_derived_counters_reconcile_after_create_and_after_resolution
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Insured.fields.open_claim_count
          - entities.Insured.fields.closed_paid_claim_count
          - entities.DefenseCounselFirm.fields.open_assignment_count
          - entities.DefenseCounselFirm.fields.billed_expense_total
        distinguishing_aspect: "The counters are recomputed on each hop rather than only at creation: two intakes raise open_claim_count to 2, an expense payment moves the firm ledger, and a dismissal drops the count back to 1 while leaving closed_paid_claim_count at 0 because nothing was PAID."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured CREDENTIALED to 2028-01-01, IN_FORCE claims-made term."
            - "One COOK_IL panel firm admitted for OBSTETRIC_INJURY and SURGICAL_ERROR with capacity 5."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
