              payload: { property_id: "${p}", name: "July 2026", application_open_at: "2026-06-30T00:00:00Z", application_close_at: "2026-07-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "SOCIAL_MEDIA"], marketing_plan_summary: "plan two", target_ami_tier: "AMI_50" }
