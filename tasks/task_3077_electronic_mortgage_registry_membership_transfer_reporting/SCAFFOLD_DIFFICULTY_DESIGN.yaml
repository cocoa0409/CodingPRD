              as: RegistryAdmin
            - call: "POST /registry/members/${m_g}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_g}"
              captures: { g_loan: $.data.id }
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_g}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev: $.data.id }
            - call: "POST /registry/qa-reviews/${rev}/findings"
              payload: { loan_id: "${g_loan}", field_name: "CLOSING_DATE", expected_value: "2026-01-05", actual_value: "2026-01-06", severity: "MINOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
          trigger:
            - call: "POST /registry/qa-reviews/${rev}/reopen"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
          assert:
            - "reopen returns QAReview.${rev}.status == DRAFT"
            - "second issue returns status == FINDINGS_ISSUED with discrepancy_score == 0.2000 (1 MINOR x 0.2 / sample 1)"
            - "a settle after the second issue by a different auditor succeeds (the cycle preserved terminal reachability)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: termination_cascade_member_loan_sorexception_run
        grounds:
          - state_machines.Member.ACTIVE_to_TERMINATION_PENDING
          - state_machines.RegisteredLoan.ACTIVE_to_INACTIVE_TERMINATED
          - state_machines.SORReconciliationRun.OPEN_to_COMPLETED
        distinguishing_aspect: |
          Depth-3 chain from the terminate trigger: Member ->
          TERMINATION_PENDING (hop 0) causes its still-ACTIVE registered loans
          to flip INACTIVE_TERMINATED (hop 1); each flipped loan generates a
          REGISTRY_ONLY SORException on the member's OPEN reconciliation run
          (hop 2); the run's derived counts change (hop 3). Each hop is caused
          by the previous hop's mutation, not by the terminate call directly.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Member E (org 1000003) ACTIVE with signer; registers 2 TX loans."
            - "E submits an SOR run whose records omit both loans: run OPEN with 2 REGISTRY_ONLY exceptions."
            - "The 2 exceptions are resolved, run COMPLETES. E submits a second run again omitting loan2 only after loan1 was satisfied: setup leaves second run OPEN with 1 exception."
            - "Simpler pinned state at terminate time: run2 OPEN with exactly 1 OPEN REGISTRY_ONLY exception (for loan2); loan1 INACTIVE_SATISFIED; loan2 ACTIVE."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Epsilon Lending", org_id: "1000003", org_id_type: "TAX_ID", member_type: "ORIGINATOR" }
              as: RegistryAdmin
              captures: { m_e: $.data.id }
            - call: "POST /registry/members/${m_e}/signers"
              payload: { full_name: "Eve Signer", email: "eve@epsilon.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_e}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 60000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_e}"
              captures: { e_loan1: $.data.id }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 60000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_e}"
              captures: { e_loan2: $.data.id }
            - call: "POST /registry/loans/${e_loan1}/satisfy"
              payload: {}
              as: MemberRep
              as_user_id: "${m_e}"
            - call: "POST /registry/sor-reconciliation-runs"
              payload: { "records": [] }
              as: MemberRep
              as_user_id: "${m_e}"
              captures: { run: $.data.id }
            - call: "GET /registry/members/${m_e}"
              payload: {}
              as: RegistryAdmin
              captures: { m_e_v: $.data.version }
          trigger:
            - call: "POST /registry/members/${m_e}/terminate"
              payload: { effective_date: "2026-01-05T00:00:00Z", expected_member_version: "${m_e_v}" }
              as: RegistryAdmin
          assert:
            - "Member.${m_e}.status == TERMINATED (effective_date == clock, immediate)"
            - "RegisteredLoan.${e_loan2}.status == INACTIVE_TERMINATED (hop 1: the member's own ACTIVE portfolio deactivates)"
            - "RegisteredLoan.${e_loan1}.status is unchanged (INACTIVE_SATISFIED — cascade touches only ACTIVE loans)"
            - "a new SORException of type REGISTRY_ONLY for ${e_loan2} exists on run ${run} (hop 2)"
            - "SORReconciliationRun.${run}.registry_only_count and exception counts reflect the added exception (hop 3: run's derived counts changed), and the run stays OPEN with 2 unresolved exceptions"

      - name: reject_match_cascade_transfer_match_qafinding
        grounds:
          - state_machines.Transfer.CONFIRMED_to_REJECTED
          - state_machines.TransferMatch.PENDING_to_EXPIRED
          - entities.QAFinding
        distinguishing_aspect: |
          Depth-2 chain from a different trigger than termination: the
          reject-match call by the from-side member flips the Transfer to
          REJECTED (hop 1 — the rights move is NOT rolled back), which expires
          the TransferMatch (hop 2), which adds an auto MAJOR QAFinding to the
          from-side member's DRAFT review (hop 3 of the observed surface, each
          hop caused by the previous one).
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Members A (org 1000000) and B (org 1000001) ACTIVE with signers. A registers one TX loan; A -> B SERVICING transfer CONFIRMED on time (loan version was 1)."
            - "A DRAFT QAReview exists for A (created by qa-creator)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Beta Investors", org_id: "1000001", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { m_b: $.data.id }
            - call: "POST /registry/members/${m_b}/signers"
              payload: { full_name: "Bob Signer", email: "bob@beta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_b}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 90000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id, loan_v: $.data.version }
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "k-rej-1", expected_loan_version: "${loan_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { tr: $.data.id }
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev: $.data.id }
          trigger:
            - call: "POST /registry/transfers/${tr}/reject-match"
              payload: {}
              as: MemberRep
              as_user_id: "${m_a}"
          assert:
            - "Transfer.${tr}.status == REJECTED"
            - "RegisteredLoan.${loan}.current_servicer_id == ${m_b} still (rights move NOT rolled back — the cascade flags QA instead of compensating)"
            - "the TransferMatch for transfer ${tr} has status EXPIRED"
            - "GET /registry/qa-reviews/${rev}/findings returns exactly 1 finding with severity MAJOR and field_name CURRENT_SERVICER (hop 3)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_member_inactive_vs_referential_stale_version
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - errors.ERR_MEMBER_NOT_ACTIVE
          - errors.ERR_STALE_LOAN_VERSION
        distinguishing_aspect: |
          Category pair state vs business_referential: a transfer filed by a
          SUSPENDED member carrying a deliberately stale expected_loan_version
          must fail with 409 ERR_MEMBER_NOT_ACTIVE, not 412
          ERR_STALE_LOAN_VERSION — state preconditions outrank OCC.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Members A (org 1000000) and B (org 1000001) ACTIVE with signers. A registers one TX loan (version 1)."
            - "RegistryAdmin suspends A."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Beta Investors", org_id: "1000001", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { m_b: $.data.id }
            - call: "POST /registry/members/${m_b}/signers"
              payload: { full_name: "Bob Signer", email: "bob@beta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_b}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 80000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id, loan_v: $.data.version }
            - call: "POST /registry/members/${m_a}/suspend"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "k-prio-1", expected_loan_version: "${loan_v} + 5" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_MEMBER_NOT_ACTIVE"
            - "err != ERR_STALE_LOAN_VERSION (priority 5 state beats priority 15 OCC)"
            - "RegisteredLoan.${loan}.version is still ${loan_v} (no partial write)"

      - name: safety_signer_vs_temporal_closing_date
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors.ERR_SIGNER_NOT_AUTHORIZED
          - errors.ERR_APPEAL_WINDOW_EXPIRED
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal on the sanction
          track: an adjudication attempted by the very auditor who settled the
          parent review while ALSO carrying an invalid reduced_total_cents
          (>= total) must fail with 403 ERR_SOD_SAME_ACTOR, not 422
          ERR_REDUCTION_NOT_LOWER — safety outranks fiscal/temporal economics.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Member D (org 1000002) ACTIVE with signer; one loan registered."
            - "Review by qa-creator with 1 MAJOR finding; issued; settled by qa-settler (sanction 100000); D appeals (status APPEALED)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Delta Funding", org_id: "1000002", org_id_type: "TAX_ID", member_type: "ORIGINATOR" }
              as: RegistryAdmin
              captures: { m_d: $.data.id }
            - call: "POST /registry/members/${m_d}/signers"
              payload: { full_name: "Dan Signer", email: "dan@delta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_d}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 40000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_d}"
              captures: { d_loan: $.data.id }
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_d}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev: $.data.id }
            - call: "POST /registry/qa-reviews/${rev}/findings"
              payload: { loan_id: "${d_loan}", field_name: "PROPERTY_STATE", expected_value: "TX", actual_value: "TN", severity: "MAJOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/settle"
              payload: { abatement_factor: 1.0 }
              as: QAAuditor
              as_user_id: "qa-settler"
            - call: "GET /registry/sanctions"
              payload: { review_id: "${rev}" }
              as: QAAuditor
              as_user_id: "qa-settler"
              captures: { sanc: "$.data[0].id" }
            - call: "POST /registry/sanctions/${sanc}/appeal"
              payload: {}
              as: MemberRep
              as_user_id: "${m_d}"
          trigger:
            - call: "POST /registry/sanctions/${sanc}/adjudicate"
              payload: { decision: "REDUCED", reduced_total_cents: 200000 }
              as: QAAuditor
              as_user_id: "qa-settler"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_SOD_SAME_ACTOR (qa-settler settled the review and may not adjudicate its sanction)"
            - "err != ERR_REDUCTION_NOT_LOWER even though reduced_total_cents 200000 >= total 100000 also violates priority 14"
            - "Sanction.${sanc}.status remains APPEALED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: transfer_deadline_day_ten_is_ontime_day_eleven_is_late
        grounds:
          - calculations.transfer_late_fee
          - entities.Transfer.fields.days_late
          - endpoints.POST_/registry/transfers
        distinguishing_aspect: |
          Metric: days_late on the transfer endpoint. The 10-day window is
          inclusive: reporting on effective_date + 10 days stores days_late == 0
          and fee 0, while effective_date + 11 days stores days_late == 1 and
          fee 2500 — a single day flips the fee from 0 to the tier-1 rate.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Members A (org 1000000) and B (org 1000001) ACTIVE with signers. A registers two TX loans (version 1 each)."
            - "Clock advanced to 2026-01-15 (exactly 10 days after the 2026-01-05 effective date) for the first transfer, then to 2026-01-16 for the second."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
