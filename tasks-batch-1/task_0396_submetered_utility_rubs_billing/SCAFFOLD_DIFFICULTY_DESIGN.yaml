            - call: "POST /payments/${prvpay_id}/reverse"
              payload: {}
              as: PropertyManager
          assert:
            - "Payment ${prvpay_id}.status == REVERSED"
            - "TenantStatement ${prvst_id}.amount_paid_cents == 0  # hop 1: 6000 - 6000"
            - "TenantStatement ${prvst_id}.balance_due_cents == 6000 and payment_status == UNPAID  # hop 2 recompute"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # --- instance 1: state (p6) vs business_fiscal (p13)
      - name: invalid_state_beats_credit_exceeds_due_on_resolve
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED
        distinguishing_aspect: |
          A resolve call on a Dispute still in OPEN (never started review) carrying
          credit_amount_cents far above the statement total triggers BOTH the state
          precondition (p6, ERR_INVALID_STATE) and the fiscal cap (p13,
          ERR_CREDIT_EXCEEDS_DUE); the lower-priority state check wins ->
          ERR_INVALID_STATE. Category pair state vs business_fiscal, distinct from
          instance 2's business_referential vs state pair.
        test_recipe:
          setup:
            - "An OPEN Dispute (start-review NOT called) on a statement with total_due_cents=6000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
