              captures: { pos_n_id: $.data.id }
            - call: "GET /regional-news-ops/region-hubs/${hub_id}"
              payload: {}
              as: NewsroomOperationsManager
              captures: { hub_v1: $.data.version }
            - call: "POST /regional-news-ops/newsroom-changes"
              payload: { newsroom_position_id: "${pos_n_id}", to_region_id: "${reg_n_id}", from_region_id: "${reg_n_id}", effective_date: "2026-09-11", layoff_order_index: 1, requested_slots: 40, expected_hub_version: "${hub_v1}" }
              as: NewsroomOperationsManager
              captures: { change_id: $.data.id }
          trigger:
            - call: "POST /regional-news-ops/newsroom-changes/${change_id}/approve"
              payload: {}
              as: NewsroomOperationsManager
              captures: { ch_status1: $.data.status }
            - call: "POST /regional-news-ops/newsroom-changes/${change_id}/reopen"
              payload: {}
              as: NewsroomOperationsManager
              captures: { ch_status2: $.data.status }
            - call: "POST /regional-news-ops/newsroom-changes/${change_id}/approve"
              payload: {}
              as: NewsroomOperationsManager
              captures: { ch_status3: $.data.status }
            - call: "POST /regional-news-ops/newsroom-changes/${change_id}/reopen"
              payload: {}
              as: NewsroomOperationsManager
              captures: { ch_status4: $.data.status }
          assert:
            - "NewsroomChange status == approved after the first approval"
            - "NewsroomChange status == proposed again after reopen, proving the machine is cyclic"
            - "NewsroomChange status == approved after the second approval, so approval is reachable more than once on the same row"
            - "NewsroomChange status == proposed after the second reopen and RegionHub.version has advanced twice from the reopen edges"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: market_withdrawal_cascade_stop_to_hub_ratio
        grounds:
          - state_machines.PrintMarket.transitions.transfer_in_progress_to_withdrawn
          - state_machines.DeliveryRoute.transitions.contract_active_to_terminated
          - state_machines.SubscriberContract.transitions.active_to_churned_pending_retention
          - calculations.is_legal_notice_ratio_compliant
          - entities.RegionHub.fields.legal_notice_block
