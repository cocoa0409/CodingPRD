        distinguishing_aspect: "The nested collection route is scoped to its parent AND filterable: with three TitleCurativeItem rows on parcel A and one on parcel B, GET /parcels/{A}/title-items returns exactly 3 rows all carrying parcel_id == A, while adding status=OPEN narrows the same route to the single unresolved row - the parcel B item never appears under either call."
