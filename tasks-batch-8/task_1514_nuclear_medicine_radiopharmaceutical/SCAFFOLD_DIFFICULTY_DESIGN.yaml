            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-1", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord1: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T12:00:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord2: $.data.id } }
            - { call: "POST /nuclear-medicine/procedure-appointments", payload: { order_id: "${ord1}", room_id: "${room}", start_at: "2026-08-01T09:00:00Z", end_at: "2026-08-01T09:30:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { appt1: $.data.id } }
          trigger:
            - { call: "POST /nuclear-medicine/procedure-appointments", payload: { order_id: "${ord2}", room_id: "${room}", start_at: "2026-08-01T09:44:00Z", end_at: "2026-08-01T10:00:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { err: $.data.error_id } }
            - { call: "POST /nuclear-medicine/procedure-appointments", payload: { order_id: "${ord2}", room_id: "${room}", start_at: "2026-08-01T09:45:00Z", end_at: "2026-08-01T10:15:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { appt2: $.data.id } }
          assert:
            - "First trigger rejected with error_id == ERR_APPOINTMENT_OVERLAP (09:44 < 09:30 + 15min buffer)"
            - "Second trigger succeeds: ProcedureAppointment.${appt2}.status == BOOKED (start 09:45 == occupation end, half-open touch allowed)"

      - name: delivery_aggregate_capacity_overlap
        grounds:
          - calculations.hot_lab_delivery_capacity
          - validations[priority=21]
          - errors[ERR_HOT_LAB_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity, not exclusion. Overlapping
          arrival windows are allowed; the decayed sum at t_star = 12:10 (18778.618
          + 20000.000 = 38778.618 MBq) exceeds 37000 and rejects the second
          delivery. Different resource (delivery schedule vs imaging room) and
          different semantics from the sibling instance.
        test_recipe:
          setup:
            - "F-18 isotope + license; delivery A scheduled 12:00 with reference 20000 MBq; clock 08:00"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
