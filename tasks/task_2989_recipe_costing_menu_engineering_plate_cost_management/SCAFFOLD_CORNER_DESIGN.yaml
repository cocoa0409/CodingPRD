              as: RecipeDeveloper
              captures: { p2_eff: $.data.effective_from }
            - call: "POST /culinary/price-change-proposals/${p2}/submit"
              as: RecipeDeveloper
              as_user_id: "user-dev-1"
              captures: { p2_st: $.data.status, p2_pdb: $.data.price_delta_bps, p2_udb: $.data.projected_unit_delta_bps, p2_pu: $.data.projected_units, p2_pfc: $.data.projected_food_cost_bps, p2_ecap: $.data.effective_cap_price_cents, p2_pcd: $.data.projected_contribution_delta_cents }
          assert:
            - "${plate} == 100 and ${mi_lpc0} == null — activation does not stamp a price change"
            - "${p1_st} == DRAFT with ${p1_base0} == 0: creation computes no projection at all"
            - "the first submit succeeds with NO cooling-off check because last_price_change_at is null: ${p1_base} == 1000 == DEFAULT_BASELINE_UNITS, ${p1_pdb} == 500, ${p1_udb} == -600, ${p1_pu} == 940, ${p1_pfc} == 2381 == round_half_up(1000000/420)"
            - "${p1_mcap} == 448 == min(round_half_up(1500*11000/10000) 1650, round_half_up(400*11200/10000) 448) — the MAX_SINGLE_INCREASE_BPS arm binds, not the competitor index"
            - "${p1_ecap} == 448: relief is 0 because ${p1_pfc} 2381 is NOT above target_food_cost_bps 3000, so a cheap item gets no help from CAP_RELIEF_BPS"
            - "${p1_pcd} == 800 == 940*(420-100) - 1000*(400-100)"
            - "${p1_final} == EFFECTIVE, ${p1_applied} == 2026-08-02T00:00:00.000Z, ${mi_price} == 420, ${mi_fcb} == 2381, ${mi_cm} == 320, ${mi_class} == UNCLASSIFIED and ${mi_lpc} == 2026-08-02T00:00:00.000Z"
            - "${e_cool} == ERR_PRICE_CHANGE_COOLING_OFF (409) — 2026-08-10 is only 8 days after the change and COOLING_OFF_DAYS is 14"
            - "${p2_st_after} == DRAFT, ${p2_base_after} == 0, ${p2_pdb_after} == 0 and ${p2_sub_after} == null — a failed submit writes no projection and does not record the submitter"
            - "${e_open} == ERR_PROPOSAL_ALREADY_OPEN (409): the proposal that just failed its submit is still DRAFT and therefore still live, so the failure blocks the workaround"
            - "${p2_eff} == 2026-08-16T00:00:00.000Z and the resubmit succeeds with ${p2_st} == SUBMITTED — exactly 14 whole days after 2026-08-02 satisfies an at-or-after boundary"
            - "the resubmission reprojects off the NEW price: ${p2_pdb} == 476 == round_half_up(200000/420), ${p2_udb} == -571, ${p2_pu} == 943, ${p2_pfc} == 2273, ${p2_ecap} == 470 == round_half_up(420*11200/10000) and ${p2_pcd} == 620 == 943*340 - 1000*320"

