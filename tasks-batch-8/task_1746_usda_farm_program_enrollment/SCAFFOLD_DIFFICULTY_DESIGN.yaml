      - name: enrollment_submit_requires_certified_acreage_report
        grounds:
          - state_machines.Enrollment.DRAFT_to_SUBMITTED
          - validations[priority=11]
        distinguishing_aspect: |
          Pair (Enrollment -> AcreageReport): Enrollment.submit is only valid when
          the linked AcreageReport for the same (farm, year) is CERTIFIED; a DRAFT
          report blocks submission with ERR_ACREAGE_NOT_CERTIFIED.
        test_recipe:
          setup:
            - "Enrollment DRAFT; AcreageReport exists but is only FILED (not CERTIFIED)"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
