        distinguishing_aspect: "The IMMEDIATE_THREAT block is hospital-wide, not unit-scoped: the target unit MED-11 is still OPEN (so priority 23 passes) yet scheduling is refused with ERR_IMMEDIATE_THREAT_ACTIVE because an ESCALATED LIFE_SAFETY ticket exists on a different unit."
