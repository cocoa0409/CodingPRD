              payload: { resolution_code: "RES-RET-003", kind: "APPROVE_RETIREMENT", subject_ref_id: "${req3}", quorum_required: 1, voting_opens_at: "2031-09-01T00:00:00Z", voting_closes_at: "2031-09-02T00:00:00Z" }
              as: BoardSecretary
