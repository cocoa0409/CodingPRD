            - { call: "POST /rescue-ops/entry-permits/${per2}/roster-entries", payload: { personnel_id: "${att_id}", assignment_role: "ATTENDANT", scheduled_start_at: "2026-08-04T06:00:00Z", scheduled_end_at: "2026-08-04T12:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro2: "$.data.id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/roster-entries/${ro1}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
