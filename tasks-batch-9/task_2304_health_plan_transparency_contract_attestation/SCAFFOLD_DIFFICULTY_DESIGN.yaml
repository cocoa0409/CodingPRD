  - rule_id: boundary_precision_check
    instances:
      - name: tool_uptime_boundary_432_versus_435_downtime_minutes
        grounds:
          - calculations.tool_monthly_uptime
          - entities.PriceComparisonTool.fields.sla_target_uptime_pct
          - entities.PriceComparisonTool.fields.sla_breach_open
          - calculations.penalty_accrual_posting
        distinguishing_aspect: |
          June 2027 has 43200 minutes, so 432 minutes of downtime is exactly 99.00% (compliant under
          the strict `<` comparison) while 435 minutes is 98.9930...% -> 98.99 (breach). The pair is
          3 minutes apart and straddles the rounding shelf: any implementation that rounds to fewer
          than 2 decimals, rounds half-down, or uses `<=` against the target flips one of the two
          tools. Only the breaching tool posts a TOOL_SLA accrual.
        test_recipe:
          setup:
            - "Logical clock at 2027-07-02T00:00:00Z."
            - "ACTIVE PlanYear PY2027 with covered_lives 6000 (multiplier 2.0) and one TPA contract."
            - "Two LIVE PriceComparisonTools, both with sla_target_uptime_pct 99.00, launched 2027-01-05T09:00:00Z."
            - "Tool A carries one outage window of exactly 432 minutes (2027-06-10T00:00:00Z -> 2027-06-10T07:12:00Z); tool B carries one of exactly 435 minutes (2027-06-10T00:00:00Z -> 2027-06-10T07:15:00Z)."
