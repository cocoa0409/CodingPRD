  - rule_id: non_linear_state_machine
    instances:
      - name: draft_order_deficiency_revision_cycle_preserves_review_memory
        grounds:
          - state_machines.DraftOrder
          - entities.DraftOrder.fields.reviewed_by_user_id
          - entities.DraftOrder.fields.revision_number
          - entities.DeficiencyNotice.fields.status
          - validations[priority=38]
          - validations[priority=40]
        distinguishing_aspect: |
          DraftOrder is not a ladder: UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW returns the row to a
          state it already occupied, yet the row is NOT reset. revision_number has advanced to 2,
          deficiency_codes has emptied, the notice has moved to CURED, and — decisively —
          reviewed_by_user_id still names the analyst who issued the notice, so the segregation-of-duties
          check at priority 38 still fires for that user AFTER the cycle has closed. An implementation
          that treats the return to UNDER_REVIEW as "back to the initial state" clears
          reviewed_by_user_id and wrongly lets the same human both reject and qualify the same order.
          Re-entering the loop from the terminal QUALIFIED state is refused in two different ways
          depending on which trigger is used.
        test_recipe:
          setup:
            - "A PUBLISHED plan requiring model language, max_revisions 3, resubmission_window_days 60."
            - "A participant not in pay status with a single assignable PRE_TAX_DEFERRAL source of 1000000 cents and one valuation snapshot on 2026-06-30 at 1000000."
            - "A first draft order received at clock 2026-09-01 with uses_model_language false, so deficiency_codes == [MISSING_MODEL_LANGUAGE] and the draft sits UNDER_REVIEW with a HELD hold of 400000."
            - "Analyst X-User-ID u-9001 issues the deficiency notice; administrator X-User-ID u-7777 is a distinct human."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Cycle Memory Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, review_period_days: 45, segregation_period_days: 548, resubmission_window_days: 60, max_revisions: 3, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Teodor Ilves", ssn_last4: "6602", date_of_birth: "1977-10-10", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Kaja Ilves", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1979-06-06", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-C1", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
          trigger:
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "order omits the plan's model language" }
              as: QdroAnalyst
              as_user_id: "u-9001"
              captures: { notice_id: $.data.id }
            - call: "POST /draft-orders/${draft_id}/resubmit"
              payload: { document_reference: "DRO-2663-C1-rev2", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: PlanAdministrator
              captures: { rev: $.data.revision_number, keeper: $.data.reviewed_by_user_id }
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "u-9001"
              captures: { sod_err: $.data.error_id }
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "u-7777"
              captures: { final_status: $.data.status }
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "too late" }
              as: QdroAnalyst
              as_user_id: "u-9001"
              captures: { relock_err: $.data.error_id }
            - call: "POST /draft-orders/${draft_id}/resubmit"
              payload: { document_reference: "DRO-2663-C1-rev3", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: PlanAdministrator
              captures: { relock_err2: $.data.error_id }
          assert:
            - "After the notice, GET /draft-orders/${draft_id} reports status == \"DEFICIENT\", deficiency_codes == [\"MISSING_MODEL_LANGUAGE\"], revision_number == 1, reviewed_by_user_id == \"u-9001\"; GET /qdro-cases/${case_id} reports review_status == \"DEFICIENT\" and segregation_status == \"HELD\"."
            - "${rev} == 2 and ${keeper} == \"u-9001\" — the resubmission advances the revision counter and returns status to UNDER_REVIEW with deficiency_codes == [] while retaining the reviewer marker."
            - "GET /draft-orders/${draft_id}/deficiency-notices returns 1 row with id ${notice_id}, notice_sequence == 1, status == \"CURED\", deficiency_codes == [\"MISSING_MODEL_LANGUAGE\"], resubmission_deadline_at == \"2026-10-31T00:00:00Z\"."
            - "${sod_err} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403 — the priority-38 check survives the UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW cycle even though the draft is once again in the state it started in."
            - "${final_status} == \"QUALIFIED\" for u-7777, and GET /draft-orders/${draft_id} still reports reviewed_by_user_id == \"u-9001\" after qualification — the memory is never cleared."
            - "${relock_err} == \"ERR_DRAFT_ORDER_NOT_UNDER_REVIEW\" and ${relock_err2} == \"ERR_DRAFT_ORDER_NOT_DEFICIENT\", both HTTP 409 — the same terminal state refuses the two loop-entry triggers with two different errors."
            - "GET /qdro-cases/${case_id} reports review_status == \"QUALIFIED\" and segregation_status == \"CONVERTED\"; GET /segregation-holds with qdro_case_id=${case_id} reports status == \"CONVERTED\", earnings_growth_bps == 0 and earnings_adjustment_cents == 0 (only one snapshot exists, so the post-segregation set is empty)."

      - name: qdro_case_parallel_review_and_segregation_dimensions
        grounds:
          - state_machines.QdroCase[dimension=review_status]
          - state_machines.QdroCase[dimension=segregation_status]
          - state_machines.SegregationHold
          - endpoints[POST /segregation-holds/{id}/release]
          - validations[priority=62]
          - validations[priority=40]
          - calculations.plan_account_derived_balances
        distinguishing_aspect: |
          One QdroCase row carries two independent state dimensions that advance on different
          triggers, and the pair is not derivable from either half. POST /draft-orders moves BOTH at
          once (INTAKE -> UNDER_REVIEW and NONE -> HELD in a single call). A deficiency notice moves
          review_status only, leaving segregation_status frozen at HELD. Denial moves review_status to
          the terminal DENIED and deliberately leaves the money still segregated — so the case is
          simultaneously "finished" and "holding the participant's cash". Only the explicit second act
          POST /segregation-holds/{id}/release advances the segregation dimension, and it is guarded
          the other way round: attempted before the review dimension reaches DENIED it fails with
          ERR_CASE_NOT_DENIED. A single-status implementation cannot express the (DENIED, HELD) pair
          at all.
        test_recipe:
          setup:
            - "A PUBLISHED plan requiring model language with resubmission_window_days 60 and segregation_period_days 548."
            - "A participant not in pay status with a single assignable PRE_TAX_DEFERRAL source of 1000000 and one snapshot on 2026-06-30 at 1000000."
            - "A first draft order with uses_model_language false received at clock 2026-09-01, so the hold is 400000 and the deficiency is real."
            - "The clock is later pushed to 2026-11-01, one day past the notice's 2026-10-31 resubmission deadline, so RESUBMISSION_WINDOW_CLOSED is an observable fact."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Two Dimensions Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, review_period_days: 45, segregation_period_days: 548, resubmission_window_days: 60, max_revisions: 3, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Halvard Sund", ssn_last4: "7719", date_of_birth: "1975-01-20", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Ingrid Sund", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1978-02-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-D1", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id" }
            - call: "POST /segregation-holds/${hold_id}/release"
              payload: {}
              as: PlanAdministrator
              captures: { early_release_err: $.data.error_id }
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "model language missing" }
              as: QdroAnalyst
              as_user_id: "u-9001"
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/deny"
              payload: { denial_reason: "RESUBMISSION_WINDOW_CLOSED" }
              as: PlanAdministrator
              captures: { denied_status: $.data.status }
            - call: "POST /segregation-holds/${hold_id}/release"
              payload: {}
              as: PlanAdministrator
              captures: { released_status: $.data.status }
            - call: "POST /segregation-holds/${hold_id}/release"
              payload: {}
              as: PlanAdministrator
              captures: { double_release_err: $.data.error_id }
          assert:
            - "Immediately after the receipt, GET /qdro-cases/${case_id} reports review_status == \"UNDER_REVIEW\" AND segregation_status == \"HELD\" — one call advanced both dimensions."
            - "GET /plan-accounts/${acct_id} then reports vested_balance_cents == 1000000, held_amount_cents == 400000 and available_balance_cents == 600000."
            - "${early_release_err} == \"ERR_CASE_NOT_DENIED\" with HTTP 409 — the segregation dimension cannot advance while the review dimension is only UNDER_REVIEW, even though the hold itself is validly HELD."
            - "After the notice, GET /qdro-cases/${case_id} reports review_status == \"DEFICIENT\" and segregation_status still exactly \"HELD\"; GET /segregation-holds/${hold_id} still reports status == \"HELD\" and hold_amount_cents == 400000."
            - "${denied_status} == \"DENIED\"; GET /qdro-cases/${case_id} reports review_status == \"DENIED\" while segregation_status is STILL \"HELD\", and GET /plan-accounts/${acct_id} still reports held_amount_cents == 400000 with available_balance_cents == 600000 — denial does not free the money."
            - "GET /draft-orders/${draft_id}/deficiency-notices reports the notice ${notice_id} in status \"EXPIRED\" (the denial expired it; it was never cured)."
            - "${released_status} == \"RELEASED\"; GET /qdro-cases/${case_id} now reports segregation_status == \"RELEASED_TO_PARTICIPANT\" with review_status unchanged at \"DENIED\", and GET /plan-accounts/${acct_id} reports held_amount_cents == 0 with available_balance_cents == 1000000 restored."
            - "${double_release_err} == \"ERR_HOLD_NOT_HELD\" with HTTP 409 — the hold's own terminal state locks down independently of either case dimension."
            - "GET /qdro-cases/${case_id} reports version == 5 — one increment each for the receipt, the notice, the denial and the release, on top of the version 1 the case was created with."
            - "GET /qdro-cases/${case_id}/alternate-payee-accounts returns an empty list — a denied case never establishes a payee account, even though its segregation dimension reached a terminal state."

  - rule_id: transitive_cascade
    instances:
      - name: qualification_six_level_segregation_to_payee_cascade
        grounds:
          - endpoints[POST /draft-orders/{id}/qualify]
          - state_machines.DraftOrder
          - state_machines.QdroCase[dimension=review_status]
          - state_machines.QdroCase[dimension=segregation_status]
          - state_machines.SegregationHold
          - entities.AlternatePayeeAccount
          - entities.MoneySource.fields.balance_cents
          - entities.Communication
          - calculations.plan_account_derived_balances
        distinguishing_aspect: |
          A single POST /draft-orders/{id}/qualify propagates through seven declared links that touch
          six different entity types: L1 DraftOrder -> QUALIFIED, L2 QdroCase.review_status ->
          QUALIFIED, L3 SegregationHold HELD -> CONVERTED with segregation_date /
          earnings_growth_bps / earnings_adjustment_cents stamped, L4 an AlternatePayeeAccount created
          and sized from the projection, L5 each assignable MoneySource debited by allocation plus its
          own rounded earnings share and the PlanAccount's five derived balances re-run, L6
          QdroCase.segregation_status -> CONVERTED plus two Communication rows appended in a pinned
          order, L7 QdroCase.version incremented. The chain is not idempotent-by-accident and it is not
          observable from the qualify response alone — L3 through L6 must be read back from four
          different endpoints. Truncating the chain at L4 leaves the participant's money sources
          holding cash that has already been credited to the payee.
        test_recipe:
          setup:
            - "Fixture A: a PUBLISHED PERIOD_END plan (max_assignable_pct_bps 5000, max_assignable_amount_cents 2000000, segregation_period_days 548) and a participant not in pay status."
            - "A plan account with assignable sources AFTER_TAX 100000/basis 60000, EMPLOYER_MATCH 1490125, PRE_TAX_DEFERRAL 2409875 and non-assignable LOAN_RECEIVABLE 300000."
            - "Snapshots 2026-06-30 at 4000000 and 2026-12-31 at 4120000."
            - "A faultless SEPARATE_INTEREST 4000 bps draft received at clock 2026-09-01, hold 1600000 HELD; the clock is then moved to 2026-09-15 so segregation_date is distinct from both valuation dates."
