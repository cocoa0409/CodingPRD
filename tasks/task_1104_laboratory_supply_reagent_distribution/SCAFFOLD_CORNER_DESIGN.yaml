            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-1000", name: "Assay Vial", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Tiny", credit_limit_cents: 100 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 1, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_CREDIT_LIMIT_EXCEEDED and HTTP status == 402"
            - "Order.${order_id}.status remains DRAFT and no reservations exist"

      - name: kit_duplicate_component_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_KIT_DUPLICATE_COMPONENT]"]
        distinguishing_aspect: "A components array repeating one product_id is rejected at kit creation with 422 ERR_KIT_DUPLICATE_COMPONENT."
        test_recipe:
          setup: ["customer and product exist"]
          setup_api_calls:
            - { call: "POST /lab/customers", payload: { name: "Lab Delta", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "KA-01", name: "Kit Part A", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 10000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_a: "$.data.id" } }
          trigger:
            - { call: "POST /lab/kits", payload: { customer_id: "${cust_id}", name: "Dup Kit", components: [ { product_id: "${prod_a}", quantity_per_kit: 1 }, { product_id: "${prod_a}", quantity_per_kit: 2 } ] }, as: CatalogManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_KIT_DUPLICATE_COMPONENT and HTTP status == 422"

      - name: kit_storage_mixed_rejected_at_activate
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_KIT_STORAGE_MIXED]", state_machines.KitDefinition.DRAFT_to_ACTIVE]
        distinguishing_aspect: "Components with storage_requirement AMBIENT and REFRIGERATED_2_8 cannot share one kit: activation fails 422 ERR_KIT_STORAGE_MIXED."
        test_recipe:
          setup: ["customer; product A AMBIENT; product B REFRIGERATED_2_8; DRAFT kit with both"]
          setup_api_calls:
            - { call: "POST /lab/customers", payload: { name: "Lab Delta", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "KA-01", name: "Kit Part A", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 10000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_a: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "KB-02", name: "Kit Part B", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 5000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_b: "$.data.id" } }
            - { call: "POST /lab/kits", payload: { customer_id: "${cust_id}", name: "Mixed Kit", components: [ { product_id: "${prod_a}", quantity_per_kit: 1 }, { product_id: "${prod_b}", quantity_per_kit: 1 } ] }, as: CatalogManager, captures: { kit_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/kits/${kit_id}/activate", payload: {}, as: CatalogManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_KIT_STORAGE_MIXED and HTTP status == 422"
            - "KitDefinition.${kit_id}.status remains DRAFT"

      - name: lot_receipt_zone_warehouse_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_ZONE_WAREHOUSE_MISMATCH]"]
        distinguishing_aspect: "A zone belonging to warehouse 1 cited with warehouse 2 in the receipt body fails 409 ERR_ZONE_WAREHOUSE_MISMATCH."
        test_recipe:
          setup: ["warehouses W1 and W2; zone belongs to W1; product exists"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-1", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh1: "$.data.id" } }
            - { call: "POST /lab/warehouses", payload: { name: "WH-2", region_code: "US-W", hazmat_certified: true }, as: OpsAdmin, captures: { wh2: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh1}", zone_class: "AMBIENT", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh2}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_ZONE_WAREHOUSE_MISMATCH and HTTP status == 409"

      - name: storage_zone_warmer_than_requirement_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_STORAGE_ZONE_INCOMPATIBLE]"]
        distinguishing_aspect: "An ULTRACOLD_MINUS_80 product rejected from an AMBIENT zone with ERR_STORAGE_ZONE_INCOMPATIBLE (zone must be at-or-colder than the requirement)."
        test_recipe:
          setup: ["warehouse with AMBIENT zone; ULTRACOLD_MINUS_80 product"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "UC-80", name: "Ultra Freezer Enzyme", storage_requirement: "ULTRACOLD_MINUS_80", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 50000, requires_cold_chain: true, shelf_life_days: 90, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-04-01" }, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_STORAGE_ZONE_INCOMPATIBLE and HTTP status == 409"

  - section: endpoints
    instances:
      - name: products_list_pagination_limit_offset_has_more
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Three products listed with limit=2 return exactly 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["three products P1, P2, P3 exist"]
          setup_api_calls:
            - { call: "POST /lab/products", payload: { sku: "P-1", name: "P1", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 100, requires_cold_chain: false, shelf_life_days: 30 }, as: CatalogManager }
            - { call: "POST /lab/products", payload: { sku: "P-2", name: "P2", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 100, requires_cold_chain: false, shelf_life_days: 30 }, as: CatalogManager }
            - { call: "POST /lab/products", payload: { sku: "P-3", name: "P3", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 100, requires_cold_chain: false, shelf_life_days: 30 }, as: CatalogManager }
          trigger:
            - { call: "GET /lab/products", payload: { limit: 2, offset: 0 }, as: OpsAdmin }
            - { call: "GET /lab/products", payload: { limit: 2, offset: 2 }, as: OpsAdmin }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2: data length == 1, total_count == 3, has_more == false"

      - name: lot_list_filters_by_status
        claim_type: listing
        grounds: [entities.ReagentLot.fields.status]
        distinguishing_aspect: "GET /lab/lots?status=QUARANTINED returns only the quarantined lot (1 row), excluding the AVAILABLE one."
        test_recipe:
          setup: ["warehouse, zone, product; lot A AVAILABLE, lot B quarantined"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-02-15" }, as: InventoryClerk, captures: { lot_b: "$.data.id" } }
            - { call: "POST /lab/lots/${lot_b}/quarantine", payload: {}, as: QualityManager }
          trigger:
            - { call: "GET /lab/lots", payload: { status: "QUARANTINED" }, as: OpsAdmin, captures: { only_id: "$.data[0].id" } }
          assert:
            - "captured only_id == ${lot_b} and the list's total_count == 1"

      - name: cost_summary_computed_read
        claim_type: computed_read
        grounds: [calculations.freight_cost, calculations.customer_outstanding_and_credit]
        distinguishing_aspect: "After dispatch at actual 7500 g, cost-summary reports product_total 40000, final freight 2660, ratio 0.0665, and projected outstanding 42660."
        test_recipe:
          setup: ["cold-chain chain to IN_TRANSIT with declared 3000 g and actual 7500 g"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id" } }
            - { call: "POST /lab/shipments/${ship_id}/pack", payload: {}, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/dispatch", payload: { actual_weight_grams: 7500 }, as: InventoryClerk }
          trigger:
            - { call: "GET /lab/orders/${order_id}/cost-summary", payload: {}, as: AccountManager, captures: { pt: "$.data.product_total_cents", pf: "$.data.provisional_freight_cents", ff: "$.data.final_freight_cents", ratio: "$.data.freight_to_product_ratio", proj: "$.data.projected_outstanding_cents" } }
          assert:
            - "captured pt == 40000 and pf == 2300 and ff == 2660"
            - "captured ratio == 0.0665 (2660 / 40000, 4 decimal places)"
            - "captured proj == 42660 (outstanding 0 + 40000 + 2660 post-dispatch)"

      - name: get_single_lot_returns_stored_entity
        claim_type: retrieval
        grounds: [entities.ReagentLot]
        distinguishing_aspect: "GET /lab/lots/{lotId} returns exactly the persisted lot with all computed fields populated."
        test_recipe:
          setup: ["warehouse, zone, product; lot of 7"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 7, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "GET /lab/lots/${lot_id}", payload: {}, as: QualityManager, captures: { qoh: "$.data.quantity_on_hand", seq: "$.data.lot_sequence_number" } }
          assert:
            - "captured qoh == 7 and seq == 1 and response_type == \"object\""

