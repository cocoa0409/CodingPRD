      - name: design_review_segregation_of_duties_tracks_the_current_submitter
        claim_type: Segregation of duties
        grounds:
          - state_machines[CellDesign.UNDER_REVIEW -> APPROVED]
          - state_machines[CellDesign.UNDER_REVIEW -> CHANGES_REQUESTED]
          - validations[priority 13 ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 6 ERR_ACTOR_JOB_CLASS_MISMATCH]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_ACTOR_JOB_CLASS_MISMATCH]
        distinguishing_aspect: "Segregation of duties on the design axis is not 'the author may not approve' - it is 'the CURRENT submitter may not close the review', and submitted_by_worker_id is rewritten by every SUBMIT. After one revision loop the two engineers swap places: the engineer who was refused at the start becomes the only legal approver, and the engineer who approved a moment earlier is now refused. It also guards BOTH verdicts, APPROVE and REQUEST_CHANGES, and it sits BELOW the job-class gate, so a PRODUCTION worker acting through the DesignEngineer role answers ERR_ACTOR_JOB_CLASS_MISMATCH rather than ERR_SEGREGATION_OF_DUTIES even when that worker is also the submitter."
        test_recipe:
          setup:
            - "Plant PLT-RIV; workers Ada and Ben (ENGINEER) and Cara (PRODUCTION); design CD-SOD drafted by Ada and SUBMITted by Ada, so approval_state is UNDER_REVIEW, revision 1 and submitted_by_worker_id is Ada."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-SOD", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
          trigger:
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: APPROVE }
              captures: { err_approve_self: "$.data.error_id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: REQUEST_CHANGES, review_comment: "my own second thoughts" }
              captures: { err_reject_self: "$.data.error_id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${sup_a_id}"
              payload: { action: APPROVE }
              captures: { err_job_class: "$.data.error_id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: REQUEST_CHANGES, review_comment: "raise the rated cycles" }
            - call: PATCH /cell-designs/${design_id}
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { nominal_capacity_ah: 470.0 }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
              captures: { err_approve_new_submitter: "$.data.error_id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: APPROVE }
            - call: POST /workers/${sup_a_id}/exposure-samples
              as: SafetyOfficer
              as_user_id: "${eng_a_id}"
              payload: { sample_type: AIR, sampled_at: "2026-08-31T16:00:00Z", air_lead_ug_per_m3: 12.0, sample_duration_minutes: 480 }
              captures: { err_sample_job_class: "$.data.error_id" }
          assert:
            - "Ada's APPROVE answers 409 with error_id \"ERR_SEGREGATION_OF_DUTIES\" - she is the submitter, and being the author is irrelevant to the check."
            - "Ada's REQUEST_CHANGES answers 409 with the SAME error_id \"ERR_SEGREGATION_OF_DUTIES\" - the guard is on closing the review, not on approving it, so an implementation that only guards APPROVE lets this one through."
            - "Cara's APPROVE answers 409 with error_id \"ERR_ACTOR_JOB_CLASS_MISMATCH\", not ERR_SEGREGATION_OF_DUTIES: she is not the submitter at all, and the job-class gate (§1.4 priority 6) is evaluated before the segregation gate (priority 13) regardless."
            - "Ben's REQUEST_CHANGES answers 200 with approval_state \"CHANGES_REQUESTED\", revision still 1 and submitted_by_worker_id still Ada."
            - "Ada's PATCH answers 200 with revision 2 and approval_state back to \"DRAFT\" - the edit is the CHANGES_REQUESTED -> DRAFT edge, and it does not clear submitted_by_worker_id."
            - "Ben's SUBMIT answers 200 with approval_state \"UNDER_REVIEW\" and submitted_by_worker_id now Ben - the field is overwritten, not appended to."
            - "Ben's APPROVE now answers 409 with error_id \"ERR_SEGREGATION_OF_DUTIES\" even though Ben legally closed the previous round: the roles have swapped."
            - "Ada's APPROVE now answers 200 with approval_state \"APPROVED\", approved_by_worker_id Ada and approved_revision 2 (the edited revision, not the revision 1 she originally submitted)."
            - "The exposure sample attempted with Ada as the acting worker answers 409 with error_id \"ERR_ACTOR_JOB_CLASS_MISMATCH\" - the SAFETY class gate is a second, independent instance of the same priority-6 rule, and the subject worker Cara is never consulted."

      - name: lot_release_is_refused_to_the_inspector_who_recorded_the_last_test
        claim_type: Segregation of duties
        grounds:
          - endpoints[POST /production-lots/{id}/disposition]
          - endpoints[GET /production-lots/{id}/quality-summary]
          - validations[priority 13 ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 6 ERR_ACTOR_JOB_CLASS_MISMATCH]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The release axis keys segregation of duties on lot.last_test_recorded_by_worker_id - a field written by a DIFFERENT endpoint (capacity-test record-result) than the one enforcing the rule. The blocked identity is therefore not the lot's creator, not the assembly's verifier and not the inspector who drew the sampling plan; it is whoever happened to record the most recent result. quality-summary reports release_blocked_by \"NONE\" at exactly this moment, because the remaining obstacle is actor-dependent and the summary is actor-independent - an implementation that drives RELEASE off release_blocked_by alone releases the lot to the wrong inspector."
