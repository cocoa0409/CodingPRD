          assert:
            - "error_id == ERR_MARKET_DAY_NOT_CLOSED; submission stays SUBMITTED"

      - name: redeem_gated_by_vendor_active
        grounds:
          - state_machines.Token.ISSUED_to_REDEEMED
          - validations[priority=13]
          - state_machines.Vendor.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair Token x Vendor (third distinct pair): redemption requires the acting VENDOR's state, not
          the token's — a suspended vendor's redeem attempt on a perfectly valid ISSUED token is rejected.
        test_recipe:
          setup:
            - "Base setup; charge 300; vendor SUSPENDED before any redemption"
