            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${planA}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c1}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1 }
