          The dual variant lives on the TalentPayment entity domain (money owed to talent), not on ScriptAdaptation: identical COMPLETED-session data yields usage_fee_cents 126000 under BUYOUT (flat 1.75x, territory_scope ignored) and 31620 under RESIDUAL (banded 0.45+0.30+0.18 over the ordered scope).
