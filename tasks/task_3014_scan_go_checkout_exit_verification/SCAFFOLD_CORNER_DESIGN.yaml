              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /clubs/${club_id}/connectivity"
              payload: { posture: "OFFLINE_FALLBACK" }
              as: ClubManager
            - call: "PATCH /catalog-items/${item_id}"
              payload: { unit_price_cents: 1300 }
              as: PlatformAdmin
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
            - call: "PATCH /clubs/${club_id}"
              payload: { expected_club_version: "${club_v}", allow_offline_payment: true }
              as: ClubManager
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { final: $.data.final_total_cents, status: $.data.status }
          assert:
            - "err == ERR_SESSION_NOT_OPEN (flag off)"
            - "final == 1000 (provisional used offline; reprice to 1300 skipped)"
            - "status == PAID"

      - name: verification_method_not_enabled_by_club_mode
        claim_type: conditional_feature_flag
        grounds: [entities.Club.fields.exit_verification_mode, "errors[ERR_VERIFICATION_METHOD_NOT_ENABLED]"]
        distinguishing_aspect: "A RECEIPT_CODE-only club rejects exit-scan with method CV_ARCH (ERR_VERIFICATION_METHOD_NOT_ENABLED); the default (omitted method) uses the club mode and succeeds."
        test_recipe:
          setup: ["Club RECEIPT_CODE; paid session"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club FF4", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 500 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /scan-sessions/${session_id}/exit-scan"
              payload: { method: "CV_ARCH" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
            - call: "POST /scan-sessions/${session_id}/exit-scan"
              as: Member
              as_user_id: "${member_id}"
              captures: { ev_method: $.data.method, ev_status: $.data.status }
          assert:
            - "err == ERR_VERIFICATION_METHOD_NOT_ENABLED"
            - "ev_method == RECEIPT_CODE and ev_status == PENDING"

      - name: sod_flagging_associate_cannot_resolve_own_case
        claim_type: segregation_of_duties
        grounds: [state_machines.LossPreventionCase.OPEN_to_RESOLVED, "errors[ERR_SO_DUTY_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties: the LP officer whose X-User-ID equals the case's flagging_associate_id is rejected with 403 ERR_SO_DUTY_VIOLATION; a different officer resolves successfully."
        test_recipe:
          setup: ["CV_ARCH club; FLAGGED session; LP case flagged by assoc-1 (opaque id)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club SOD", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "CV_ARCH" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 300 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/exit-scan"
              as: Member
              as_user_id: "${member_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /exit-verifications/${ev_id}/cv-report"
              payload: { observed_item_count: 4 }
              as: Associate
              as_user_id: "assoc-1"
            - call: "GET /loss-prevention-cases"
              as: LossPreventionOfficer
              captures: { case_id: "$.data[0].id", flagger: "$.data[0].flagging_associate_id" }
          trigger:
            - call: "POST /loss-prevention-cases/${case_id}/resolve"
              payload: { outcome: "CONFIRMED" }
              as: LossPreventionOfficer
              as_user_id: "assoc-1"
              captures: { err: $.data.error_id }
            - call: "POST /loss-prevention-cases/${case_id}/resolve"
              payload: { outcome: "CONFIRMED" }
              as: LossPreventionOfficer
              as_user_id: "lpo-9"
              captures: { resolved: $.data.status }
          assert:
            - "flagger == assoc-1"
            - "err == ERR_SO_DUTY_VIOLATION"
            - "resolved == RESOLVED"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: pay_effects_visible_immediately_on_reread
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the totals and member ledger deltas produced by pay are observable on a plain GET in the next request — no settle delay for cart fields."
        test_recipe:
          setup: ["Club, UNIT item 800c, PLUS member, clock 12:00, session with qty 2"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club IM", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 800 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 2 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /scan-sessions/${session_id}"
              as: Member
              as_user_id: "${member_id}"
              captures: { status: $.data.status, final: $.data.final_total_cents, code: $.data.receipt_code }
            - call: "GET /members/${member_id}"
              as: Member
              as_user_id: "${member_id}"
              captures: { charged: $.data.lifetime_charged_cents, pend: $.data.cash_rewards_pending_cents }
          assert:
            - "status == PAID and final == 1600 and code is not null"
            - "charged == 1600 and pend == 32"

  # ===========================================================================
  # Section: entities (not-found sweep for remaining resource types)
  # ===========================================================================
  - section: entities
    instances:
      - name: unknown_ids_return_resource_specific_404s
        claim_type: not_found
        grounds: ["errors[ERR_OFFER_NOT_FOUND]", "errors[ERR_SCAN_LINE_NOT_FOUND]", "errors[ERR_INTERCEPT_NOT_FOUND]", "errors[ERR_EXIT_VERIFICATION_NOT_FOUND]", "errors[ERR_LP_CASE_NOT_FOUND]", "errors[ERR_CURBSIDE_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "Each remaining resource type maps unknown ids to its own 404 error id — one sweep covers offer, scan line, intercept, exit verification, LP case, and curbside order lookups."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /instant-savings-offers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /scan-lines/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /intercepts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /exit-verifications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /loss-prevention-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /curbside-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { e6: $.data.error_id }
          assert:
            - "e1 == ERR_OFFER_NOT_FOUND"
            - "e2 == ERR_SCAN_LINE_NOT_FOUND"
            - "e3 == ERR_INTERCEPT_NOT_FOUND"
            - "e4 == ERR_EXIT_VERIFICATION_NOT_FOUND"
            - "e5 == ERR_LP_CASE_NOT_FOUND"
            - "e6 == ERR_CURBSIDE_ORDER_NOT_FOUND"
