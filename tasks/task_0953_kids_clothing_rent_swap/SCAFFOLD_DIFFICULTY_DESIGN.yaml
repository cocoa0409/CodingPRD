          ENTITY PAIR = (BoxItem, Capsule) — a different pair from (PauseRequest, Shipment).
          The BoxItem's own money axis is OPEN and its unit is grade A, yet the buy-out is
          refused because the Capsule row that stamped BoxItem.embargo_until has not reached
