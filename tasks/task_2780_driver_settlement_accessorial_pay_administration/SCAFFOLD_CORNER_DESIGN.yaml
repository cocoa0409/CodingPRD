  - section: rbac
    instances:
      - name: an_undeclared_role_header_is_unauthenticated_before_anything_else
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: |
          Priority 1 rejects an X-User-Role that is not one of the five declared roles - Dispatcher is a
          plausible trucking role that this domain does not grant - and it does so before the endpoint role list
          at priority 2 and before the not-found checks, so the answer is 401 ERR_UNAUTHENTICATED rather than 403
          ERR_FORBIDDEN_ROLE or 404. The same holds on a read and on a write, so authentication is not something
          only the mutating handlers perform.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "GET /driver-pay/drivers"
              payload: {}
              as: Dispatcher
              as_user_id: "dispatch-01"
              captures: { err_auth_a: $.data.error_id }
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "No Auth", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: Dispatcher
              as_user_id: "dispatch-01"
              captures: { err_auth_b: $.data.error_id }
          assert:
            - "the listing returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the create returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "neither response is 403 ERR_FORBIDDEN_ROLE"
            - "no PayPackage row is created"
      - name: each_role_is_refused_on_another_roles_exclusive_operation_before_existence
        claim_type: forbidden_operation
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles
          - endpoints[POST /driver-pay/settlements/{id}/pay]
          - endpoints[POST /driver-pay/loads]
        distinguishing_aspect: |
          Priority 2 is evaluated against the endpoint roles list before any lookup, so all five probes answer
          403 ERR_FORBIDDEN_ROLE even though three of them address a settlement id that does not exist and would
          otherwise be a 404: ComplianceAuditor cannot configure pay packages, Driver cannot book loads,
          SettlementApprover cannot open a settlement, SettlementClerk can never pay one, and ComplianceAuditor
          cannot disburse escrow. Answering 404 on any of them leaks existence to an unauthorised caller.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database - deliberately, so that a handler which checks existence first would answer 404"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Auditor Overreach", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: ComplianceAuditor
              as_user_id: "audit-01"
              captures: { err_rb_a: $.data.error_id }
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "00000000-0000-4000-8000-000000000021", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742 }
              as: Driver
              as_user_id: "00000000-0000-4000-8000-000000000021"
              captures: { err_rb_b: $.data.error_id }
            - call: "POST /driver-pay/settlements"
              payload: { driver_id: "00000000-0000-4000-8000-000000000021", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: SettlementApprover
              as_user_id: "approver-01"
              captures: { err_rb_c: $.data.error_id }
            - call: "POST /driver-pay/settlements/00000000-0000-4000-8000-000000000022/pay"
              payload: { payment_reference: "ACH-NOPE" }
              as: SettlementClerk
              as_user_id: "clerk-01"
              captures: { err_rb_d: $.data.error_id }
            - call: "POST /driver-pay/drivers/00000000-0000-4000-8000-000000000021/escrow/return"
              payload: { payment_reference: "ACH-NOPE-2" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
              captures: { err_rb_e: $.data.error_id }
          assert:
            - "all five calls return HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "none of them returns ERR_DRIVER_NOT_FOUND or ERR_SETTLEMENT_NOT_FOUND despite the unknown ids"
            - "none of them returns ERR_SEGREGATION_OF_DUTIES or ERR_SETTLEMENT_STATE_INVALID"
            - "the database is still empty: no PayPackage, Load or Settlement row exists"
      - name: a_driver_identity_is_confined_to_its_own_rows_on_reads_and_writes
        claim_type: peer_roles
        grounds:
          - validations[priority=3]
          - errors[ERR_DRIVER_SCOPE_VIOLATION]
          - roles
          - endpoints[GET /driver-pay/loads/{id}]
          - endpoints[POST /driver-pay/accessorial-claims]
          - endpoints[POST /driver-pay/disputes]
