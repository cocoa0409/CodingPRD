            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${dg_us}", quarter_index: 4, beginning_mv_cents: 5000000, ending_mv_cents: 6000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
