        claim_type: violation_to_error
        grounds:
          - validations.priority_7
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "limit must be inside [1,100]; limit == 0 is a structural violation returning 400 ERR_INVALID_REQUEST, not a silent fallback to the default limit of 10."
        test_recipe:
          setup: ["an ACTIVE program with one deal so a successful listing would be non-empty"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /programs/${p_id}/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /deals
              payload: { program_id: "${p_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00.000Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77" }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { d1_id: $.data.id }
          trigger:
            - call: GET /deals
              payload: { program_id: "${p_id}", limit: 0 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /deals with program_id=${p_id} and limit=1 returns total_count == 1 and has_more == false"

      - name: interview_response_rating_above_five_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_8
          - errors.ERR_VALUE_OUT_OF_RANGE
        distinguishing_aspect: "rating 6 is a well-typed integer, so the failure is the range rule at priority 8 (422 ERR_VALUE_OUT_OF_RANGE) rather than the type rule at priority 7 (400 ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["an ACTIVE program with a SCHEDULED interview"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
