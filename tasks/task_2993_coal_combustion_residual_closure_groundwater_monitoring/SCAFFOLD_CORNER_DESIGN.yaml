      - name: base_closure_months_differ_by_unit_type_and_clamp_the_day_of_month
        claim_type: constants_applied
        grounds:
          - calculations.closure_deadline_date
          - entities.DisposalUnit.fields.closure_deadline_date
          - entities.DisposalUnit.fields.unit_type
        distinguishing_aspect: |
          BASE_CLOSURE_MONTHS is keyed on unit_type — 60 months for a SURFACE_IMPOUNDMENT and 30 for a
          LANDFILL — and the arithmetic is calendar-month with day clamping, not a 30-day multiple. The
          same cessation_date of 2025-12-31 must therefore produce 2028-06-30 for the landfill (day 31
          clamped to June's 30th) and 2030-12-31 for the impoundment. An implementation that adds
          base_months * 30 days returns 2028-05-27 and 2030-11-21 instead.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its default 2026-08-01"
          setup_api_calls: []
          trigger:
            - call: "POST /ccr/units"
              payload: { unit_code: "LFL-0126", unit_name: "Ash Landfill 126", unit_type: "LANDFILL", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "LOW", original_ash_in_place_tons: 200000, cessation_date: "2025-12-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { landfill_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0126", unit_name: "Ash Pond 126", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2025-12-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { impoundment_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "LFL-0127", unit_name: "Ash Landfill 127", unit_type: "LANDFILL", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "LOW", original_ash_in_place_tons: 200000, cessation_date: "2026-02-28", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { landfill_b_id: $.data.id }
          assert:
            - "DisposalUnit.${landfill_id}.closure_deadline_date == 2028-06-30 (30 months, day 31 clamped)"
            - "DisposalUnit.${impoundment_id}.closure_deadline_date == 2030-12-31 (60 months, no clamping needed)"
            - "DisposalUnit.${landfill_b_id}.closure_deadline_date == 2028-08-28 (30 months from a short-month date, no clamping needed)"
            - "all three units report granted_extension_months == 0 and closure_timeliness == PENDING"
            - "all three units report compliance_posture == COMPLIANT: the clock is 2026-08-01, well before every deadline"

      - name: governing_stability_verdict_follows_assessed_on_then_created_at
        claim_type: chronological
        grounds:
          - calculations.governing_stability_verdict
          - entities.StabilityAssessment.fields.superseded
          - entities.DisposalUnit.fields.governing_stability_verdict
          - entities.DisposalUnit.fields.stability_posting_due_date
        distinguishing_aspect: |
          Three assessments are filed out of chronological order. The second is back-dated to 2026-06-01
          and DEFICIENT, and must NOT govern — an implementation that takes the most recently created row
          flips the unit to FROZEN one call early and moves stability_posting_due_date back to 2026-07-01.
          The third is filed on the same assessed_on as the first, so only created_at can break the tie,
          and it does govern.
        test_recipe:
          setup:
            - "One clean unit and one GEOTECHNICAL engineer with an ACTIVE license"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0128", unit_name: "Ash Pond 128", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-20", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { newest_id: $.data.id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-06-01", factor_of_safety_static: 1.00, factor_of_safety_seismic: 0.50, factor_of_safety_liquefaction: 0.60 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { backdated_id: $.data.id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-20", factor_of_safety_static: 1.40, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { tiebreak_id: $.data.id }
          assert:
            - "after trigger call 1: StabilityAssessment.${newest_id}.verdict == ADEQUATE with deficient_criteria == [] and superseded == false"
            - "after trigger call 1: DisposalUnit.${unit_id}.governing_stability_verdict == ADEQUATE and stability_posting_due_date == 2026-08-19"
            - "StabilityAssessment.${backdated_id}.verdict == DEFICIENT with deficient_criteria == [STATIC, SEISMIC, LIQUEFACTION] in that fixed order"
            - "after trigger call 2: StabilityAssessment.${backdated_id}.superseded == true while StabilityAssessment.${newest_id}.superseded == false"
            - "after trigger call 2: DisposalUnit.${unit_id}.governing_stability_verdict is still ADEQUATE, stability_posting_due_date is still 2026-08-19, and compliance_posture is WATCH — not FROZEN"
            - "StabilityAssessment.${tiebreak_id}.verdict == DEFICIENT with deficient_criteria == [STATIC]"
            - "after trigger call 3: StabilityAssessment.${tiebreak_id}.superseded == false and StabilityAssessment.${newest_id}.superseded == true (same assessed_on, later created_at wins)"
            - "after trigger call 3: DisposalUnit.${unit_id}.governing_stability_verdict == DEFICIENT and compliance_posture == FROZEN"
            - "StabilityAssessment rows carry no version field and expose no update endpoint"

      - name: capital_is_a_year_zero_bucket_and_only_the_care_stream_is_discounted
        claim_type: waterfall_allocation
        grounds:
          - calculations.closure_cost_present_value
          - entities.ClosurePlan.fields.in_place_pv_usd_cents
          - entities.ClosurePlan.fields.removal_pv_usd_cents
          - entities.ClosurePlan.fields.in_place_nominal_usd_cents
          - entities.ClosurePlan.fields.cost_variance_pct
        distinguishing_aspect: |
          The two buckets are filled in a pinned order: the capital outlay is a year-0 payment that is
          never discounted, and only the 30 annual care payments run through the discount factor. With a
          1,000,000-cent care stream the discounted care bucket is exactly 19,600,444 cents; discounting
          the capital as well returns 41,199,206 for the in-place total instead of 119,600,444, and
          summing the exact fractions before rounding returns 119,600,441 — three distinct wrong answers.
        test_recipe:
          setup:
            - "One clean unit with an ADEQUATE stability assessment (so the plan can later be certified)"
          setup_api_calls:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0129", unit_name: "Ash Pond 129", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0129", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP 201 and ClosurePlan.${plan_id}.status == DRAFT with return_count == 0"
            - "ClosurePlan.${plan_id}.in_place_nominal_usd_cents == 130000000 and removal_nominal_usd_cents == 930000000"
            - "ClosurePlan.${plan_id}.in_place_pv_usd_cents == 119600444 (100000000 capital + 19600444 discounted care)"
            - "ClosurePlan.${plan_id}.removal_pv_usd_cents == 919600444 (the identical care stream produces the identical care bucket)"
            - "removal_pv_usd_cents - in_place_pv_usd_cents == 800000000 exactly, the undiscounted capital difference"
            - "ClosurePlan.${plan_id}.cost_variance_pct == 86.99 (computed from the discounted pair, rounded half-up to 2 decimals)"
            - "ClosurePlan.${plan_id}.recommended_method == CLOSURE_IN_PLACE and selection_justification is not required because selected == recommended"

      - name: haul_penalty_band_and_product_bonus_move_the_reuse_score
        claim_type: weighted_scoring
        grounds:
          - calculations.ash_quality_and_reuse_score
          - entities.BeneficialReuseAgreement.fields.qualification_score
          - entities.BeneficialReuseAgreement.fields.meets_astm_c618_class_f
          - state_machines.BeneficialReuseAgreement.DRAFT_to_QUALIFIED
        distinguishing_aspect: |
          Four agreements share identical ash chemistry so that only the two additive terms move: the haul
          penalty band is strict, so exactly 75 miles scores 70.30 and 76 miles scores 65.30, and the
          product bonus is a table lookup, so STRUCTURAL_FILL scores 62.30. The market component is capped
          at 100, so a 6000-cent price scores 75.70 rather than 78.10. Components are carried unrounded
          into the weighted sum and only the final score is rounded, so a per-component rounding
          implementation drifts off every one of the four values.
        test_recipe:
          setup:
            - "One clean unit and one CIVIL engineer with an ACTIVE license"
            - "The four agreements hold disjoint commitment windows so no overlap rule can fire"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL" }
              as: UtilityAdmin
              captures: { pe_civil_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0130", unit_name: "Ash Pond 130", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/reuse-agreements"
