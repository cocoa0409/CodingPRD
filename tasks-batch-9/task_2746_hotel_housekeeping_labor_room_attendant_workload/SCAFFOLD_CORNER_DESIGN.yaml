      - name: v_waiver_request_above_the_ordinance_ceiling_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors[ERR_WAIVER_EXCEEDS_ORDINANCE_MAX]
          - state_machines.ShiftRoster[NONE->REQUESTED].preconditions
        distinguishing_aspect: "With max_daily_credits 4.00 and ordinance_profile NONE the ceiling is 4.00 * 1.25 = 5.00, so a request for 5.20 is refused with ERR_WAIVER_EXCEEDS_ORDINANCE_MAX (422) while 5.00 exactly would be admitted, and waiver_state stays NONE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with ordinance_profile NONE and max_daily_credits 4.00."
            - "One KING room type and room 101; attendant E-101 (not restricted), supervisor E-900."
            - "PUBLISHED ForecastDay 2026-08-03 and a PLANNED roster with waiver_state NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Lakeside Inn", ordinance_profile: "NONE", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 4.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-101", full_name: "Rosa Diaz", seniority_date: "2019-04-01", hourly_rate_cents: 3000 }
              as: HousekeepingDirector
              captures: { ra1_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-900", full_name: "Ivan Petrov", seniority_date: "2014-02-01", hourly_rate_cents: 4200, can_inspect: true }
              as: HousekeepingDirector
              captures: { sup_id: $.data.id }
            - call: "POST /housekeeping/forecast-days"
              payload: { property_id: "${prop_id}", business_date: "2026-08-03", forecast_occupied_rooms: 1, forecast_arrivals: 0, forecast_departures: 1, planned_deep_clean_rooms: 0 }
              as: HousekeepingDirector
              captures: { fd_id: $.data.id }
            - call: "POST /housekeeping/forecast-days/${fd_id}/publish"
              payload: {}
              as: HousekeepingDirector
            - call: "POST /housekeeping/shift-rosters"
              payload: { forecast_day_id: "${fd_id}", attendant_id: "${ra1_id}", planned_start_at: "2026-08-03T08:00:00.000Z" }
              as: HousekeepingDirector
              captures: { roster_id: $.data.id, r_v1: $.data.version }
          trigger:
            - call: "POST /housekeeping/shift-rosters/${roster_id}/waiver-request"
              payload: { waiver_requested_credits: 5.20 }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { ceiling_error: $.data.error_id }
          assert:
            - "ShiftRoster.${roster_id}.effective_credit_cap == 4.00, so the ordinance ceiling is 5.00"
            - "HTTP 422 with error_id == ERR_WAIVER_EXCEEDS_ORDINANCE_MAX"
            - "ShiftRoster.${roster_id}.waiver_state == NONE, waiver_requested_credits == null, waiver_requested_by_user_id == null and version == ${r_v1}"
            - "A request of 5.00 on the same fixture is accepted and leaves waiver_state == REQUESTED"

      - name: v_second_active_enrollment_on_the_same_room_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - errors[ERR_ENROLLMENT_ACTIVE_EXISTS]
          - entities.ServiceEnrollment.fields.status
        distinguishing_aspect: "The room already carries one ACTIVE enrollment, so a second one is refused with ERR_ENROLLMENT_ACTIVE_EXISTS (409) and the room's service_program is not rewritten by the losing request; voiding the first one makes the same request succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with a KING room type and room 101; one ACTIVE OPT_OUT enrollment on room 101 for reservation R-1001 over 2 nights."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "STAYOVER" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/service-enrollments"
              payload: { room_id: "${room101_id}", reservation_code: "R-1001", program: "OPT_OUT", nights: 2 }
              as: FrontDeskAgent
              captures: { enr1_id: $.data.id }
          trigger:
            - call: "POST /housekeeping/service-enrollments"
              payload: { room_id: "${room101_id}", reservation_code: "R-1002", program: "EVERY_OTHER_DAY", nights: 3 }
              as: FrontDeskAgent
              captures: { dup_error: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_ENROLLMENT_ACTIVE_EXISTS"
            - "Room.${room101_id}.service_program == OPT_OUT, unchanged by the refused request"
            - "GET /housekeeping/service-enrollments?room_id=${room101_id} returns exactly 1 row, ${enr1_id}"
            - "After POST /housekeeping/service-enrollments/${enr1_id}/void the same R-1002 request succeeds and sets Room.${room101_id}.service_program == EVERY_OTHER_DAY"

      - name: v_every_other_day_enrollment_exhausts_its_skip_budget
        claim_type: conditional validation
        grounds:
          - validations[priority=39]
          - errors[ERR_ENROLLMENT_SKIPS_EXHAUSTED]
          - entities.ServiceEnrollment.fields.nights
        distinguishing_aspect: "The skip budget is programme-conditional: an EVERY_OTHER_DAY enrollment over 3 nights may only skip ceil(3 / 2) = 2 services, so the third accrual is refused with ERR_ENROLLMENT_SKIPS_EXHAUSTED (422) while the row is still ACTIVE - an OPT_OUT enrollment over 3 nights would instead reach COMPLETED on its third accrual."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with a KING room type and room 101 in STAYOVER."
            - "One EVERY_OTHER_DAY enrollment on room 101 for reservation R-2001 over 3 nights, already accrued twice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "STAYOVER" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/service-enrollments"
              payload: { room_id: "${room101_id}", reservation_code: "R-2001", program: "EVERY_OTHER_DAY", nights: 3 }
              as: FrontDeskAgent
              captures: { enr_id: $.data.id }
            - call: "POST /housekeeping/service-enrollments/${enr_id}/accrue"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /housekeeping/service-enrollments/${enr_id}/accrue"
              payload: {}
              as: FrontDeskAgent
              captures: { e_v3: $.data.version }
          trigger:
            - call: "POST /housekeeping/service-enrollments/${enr_id}/accrue"
              payload: {}
              as: FrontDeskAgent
              captures: { budget_error: $.data.error_id }
          assert:
            - "ServiceEnrollment.${enr_id}.points_per_skip == 250 for the EVERY_OTHER_DAY programme"
            - "After the two accepted accruals ServiceEnrollment.${enr_id}.skips_accrued == 2, points_accrued == 500 and status == ACTIVE"
            - "HTTP 422 with error_id == ERR_ENROLLMENT_SKIPS_EXHAUSTED on the third accrual"
            - "ServiceEnrollment.${enr_id}.skips_accrued is still 2, points_accrued is still 500 and version == ${e_v3}"
            - "Property.${prop_id}.outstanding_incentive_points == 500, so the refused accrual credited nothing"

      - name: v_property_scope_outranks_the_occupancy_pairing
        claim_type: priority conflict
        grounds:
          - validations[priority=8]
          - validations[priority=23]
        distinguishing_aspect: "Covered by the difficulty design, which files the same request against a foreign-property room whose occupancy also mismatches and pins the answer to the lower-numbered scope rule."
        excluded_because:
          difficulty_instance: property_scope_mismatch_outranks_occupancy_mismatch
          rationale: "The §1.8 instance already violates the property-scope rule and the occupancy-coherence rule with one request and asserts the scope error wins, which is exactly the priority-conflict claim for this pair."

      - name: v_roster_lifecycle_outranks_the_workload_ceiling
        claim_type: priority conflict
        grounds:
          - validations[priority=10]
          - validations[priority=16]
        distinguishing_aspect: "Covered by the difficulty design, which posts an over-cap assignment onto a CLOSED roster and pins the lifecycle error."
        excluded_because:
          difficulty_instance: closed_roster_state_outranks_workload_breach_on_assignment_create
          rationale: "That instance is the priority-conflict test for the state gate against the credit ceiling on POST /housekeeping/room-assignments."

      - name: v_roster_lifecycle_outranks_the_worked_minutes_band
        claim_type: priority conflict
        grounds:
          - validations[priority=10]
          - validations[priority=36]
        distinguishing_aspect: "Covered by the difficulty design, which closes an already CLOSED roster with an implausible worked_minutes figure and pins the lifecycle error."
        excluded_because:
          difficulty_instance: closed_roster_state_outranks_worked_minutes_implausible
          rationale: "That instance is the priority-conflict test for the state gate against the fiscal plausibility band on the close endpoint."

      - name: v_room_service_window_boundary_is_half_open
        claim_type: temporal validation
        grounds:
          - validations[priority=25]
          - errors[ERR_ROOM_WINDOW_OVERLAP]
        distinguishing_aspect: "Covered by the difficulty design, which admits a touching window and refuses a one-minute overlap on the same room."
        excluded_because:
          difficulty_instance: room_window_half_open_touching_endpoints_allowed_but_one_minute_overlap_refused
          rationale: "The boundary pair for the half-open room window is already asserted there with both outcomes in one recipe."

      - name: v_attendant_rest_buffer_boundary_is_closed
        claim_type: temporal validation
        grounds:
          - validations[priority=26]
          - errors[ERR_REST_BUFFER_VIOLATION]
        distinguishing_aspect: "Covered by the difficulty design, which admits a gap of exactly the buffer and refuses a zero gap for the same attendant."
        excluded_because:
          difficulty_instance: attendant_rest_buffer_closed_interval_admits_exact_gap_and_refuses_zero_gap
          rationale: "That instance already pins both sides of the inclusive rest-buffer comparison."

      - name: v_laundry_plant_capacity_is_an_aggregate_of_open_batches
        claim_type: aggregate validation
        grounds:
          - validations[priority=27]
          - errors[ERR_LAUNDRY_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Covered by the difficulty design, where each batch is individually under capacity but their overlap is not."
        excluded_because:
          difficulty_instance: laundry_plant_capacity_breached_only_by_the_aggregate_of_overlapping_batches
          rationale: "The aggregate claim for laundry capacity is asserted there with the per-batch figures and the overlapping total."

      - name: v_credit_ceiling_equality_is_permitted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=16]
          - entities.ShiftRoster.fields.compliance_state
        distinguishing_aspect: "Covered by the difficulty design, which lands assigned_credits exactly on the cap and asserts acceptance with AT_LIMIT."
        excluded_because:
          difficulty_instance: assigned_credits_exactly_equal_to_cap_lands_at_limit_and_is_accepted
          rationale: "The inclusive boundary of the credit ceiling, including the AT_LIMIT label and the refusal one step beyond, is asserted there."

      - name: v_linen_shortage_blocks_deep_cleans_only
        claim_type: conditional validation
        grounds:
          - validations[priority=19]
          - errors[ERR_LINEN_SHORTAGE_BLOCK]
        distinguishing_aspect: "Covered by the difficulty design, which shows the same shortage refusing a DEEP_CLEAN while a CHECKOUT on the same roster is accepted."
        excluded_because:
          difficulty_instance: deep_clean_creation_gated_on_property_linen_shortage_status
          rationale: "That instance is the with-and-without pair for the shortage gate, including the service types it does not affect."

      - name: v_roster_creation_requires_a_published_day
        claim_type: cross-entity validation
        grounds:
          - validations[priority=11]
          - errors[ERR_FORECAST_NOT_PUBLISHED]
        distinguishing_aspect: "Covered by the difficulty design, which refuses a roster against a DRAFT day and accepts it after publish with nothing else changed."
        excluded_because:
          difficulty_instance: roster_creation_gated_on_forecast_day_being_published
          rationale: "The cross-entity gate on roster creation is asserted there in both directions."

      - name: v_assignment_start_requires_a_clocked_in_roster
        claim_type: cross-entity validation
        grounds:
          - validations[priority=10]
          - errors[ERR_ROSTER_NOT_CLOCKED_IN]
        distinguishing_aspect: "Covered by the difficulty design, which starts the same assignment before and after clock-in."
        excluded_because:
          difficulty_instance: assignment_start_gated_on_parent_roster_being_clocked_in
          rationale: "That instance pins the parent-state gate on the start endpoint with the same assignment id on both sides."

  - section: endpoints
    instances:
      - name: ep_room_patch_updates_only_the_supplied_fields
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /housekeeping/rooms/{id}]
          - entities.Room.fields.occupancy_state
        distinguishing_aspect: "A PATCH carrying only occupancy_state moves that one field, bumps version by exactly 1 and leaves service_program, cleanliness_status and floor untouched, so the endpoint is a partial update rather than a replace."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with a KING room type and room 101 created in STAYOVER with default service_program DAILY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
