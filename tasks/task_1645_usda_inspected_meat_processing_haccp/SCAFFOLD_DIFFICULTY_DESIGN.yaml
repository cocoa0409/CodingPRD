  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: day_open_requires_inspector_shift_on_premise
        grounds:
          - state_machines.ProductionDay.PLANNED_to_OPEN
          - validations[priority=18]
          - errors[ERR_INSPECTOR_NOT_PRESENT]
        distinguishing_aspect: |
          Entity pair ProductionDay x InspectorShift: opening a day is rejected while no
          shift of the plant is ON_PREMISE and succeeds immediately after the inspector
          checks in; the second rule-7 instance crosses a different pair
          (CarcassLot x ProductionDay).
        test_recipe:
          setup:
            - "Plant with EFFECTIVE plan; shift SCHEDULED for insp-01 but NOT checked in; clock at 2026-08-01T07:00:00Z; PLANNED day for 2026-08-01"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-M", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
          trigger:
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager, captures: { err: $.data.error_id } }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager, captures: { day_status: $.data.status } }
          assert:
            - "first open rejected with error_id == ERR_INSPECTOR_NOT_PRESENT (shift still SCHEDULED)"
            - "after check-in (shift ON_PREMISE), open succeeds and ProductionDay.${day_id}.status == OPEN"

      - name: lot_fabricate_requires_day_open
        grounds:
          - state_machines.CarcassLot.CHILLED_to_FABRICATING
          - validations[priority=8]
          - errors[ERR_DAY_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair CarcassLot x ProductionDay (different pair than the
          ProductionDay x InspectorShift instance): fabricate is rejected while the
          owning day is SUSPENDED and succeeds after the day is resumed.
        test_recipe:
          setup:
            - "Plant with EFFECTIVE plan, inspector ON_PREMISE, day OPEN; lot advanced to CHILLED; day then SUSPENDED"
          setup_api_calls:
