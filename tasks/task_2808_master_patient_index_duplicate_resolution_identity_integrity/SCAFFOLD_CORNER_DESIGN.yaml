              captures: { rec_cd1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_cd_id}", mrn: "CD-2000", last_name: "Eriksen", first_name: "Mads", dob: "1968-04-23", sex: "M", ssn_last4: "0707", postal_code: "84101", phone: "8015550101", clinical_element_count: 2 }
