  - section: calculations
    instances:
      - name: required_photo_points_floor_and_ceiling
        claim_type: constants_applied
        grounds: [entities.BaselineReport.fields.required_photo_points]
        distinguishing_aspect: "required_photo_points = max(4, ceil(acreage/100)): 250 acres -> max(4, 3) = 4 (floor binds); 500 acres -> 5 (ceiling active)."
        test_recipe:
          setup: ["two DRAFT easements of 250 and 500 acres"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-RP1", grantor_name: "G", parcel_acreage: 250, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e250: $.data.id } }
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-RP2", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e500: $.data.id } }
          trigger:
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e250}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 3 }, as: StewardshipCoordinator, captures: { b250: $.data.id, req250: $.data.required_photo_points } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e500}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { b500: $.data.id, req500: $.data.required_photo_points } }
            - { call: "POST /stewardship/baseline-reports/${b250}/submit", payload: {}, as: StewardshipCoordinator, captures: { err250: $.data.error_id } }
            - { call: "POST /stewardship/baseline-reports/${b500}/submit", payload: {}, as: StewardshipCoordinator, captures: { err500: $.data.error_id } }
          assert:
            - "req250 == 4 (floor) and submit with 3 photo points is rejected: err250 == ERR_INCOMPLETE_BASELINE"
            - "req500 == 5 and submit with 4 photo points is rejected: err500 == ERR_INCOMPLETE_BASELINE"

      - name: cure_deadline_escalation_strictly_after_deadline
        claim_type: boundary
        grounds: [calculations.cure_deadline, state_machines.Violation.NOTICE_SENT_to_ESCALATED]
        distinguishing_aspect: "MINOR notice served 2026-08-10 -> deadline 2026-11-08; at clock 2026-11-08 the violation is still NOTICE_SENT (boundary inclusive), at 2026-11-09 the sweep escalates it."
        test_recipe:
          setup: ["RECORDED easement; MINOR violation with notice served at clock 2026-08-10"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-CD", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TrustAdmin }
            - { call: "POST /stewardship/violations", payload: { easement_id: "${e_id}", detected_by_user_id: "coord-9", violation_type: SUBDIVISION, severity: MINOR, detected_on: "2026-08-09" }, as: StewardshipCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /stewardship/violations/${v_id}/send-notice", payload: {}, as: StewardshipCoordinator, captures: { dl: $.data.cure_deadline_on } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-08T00:00:00Z" }, as: TrustAdmin }
            - { call: "GET /stewardship/violations/${v_id}", payload: {}, as: TrustAdmin, captures: { st_on: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrustAdmin }
            - { call: "GET /stewardship/violations/${v_id}", payload: {}, as: TrustAdmin, captures: { st_after: $.data.status, by: $.data.escalated_by } }
          assert:
            - "dl == 2026-11-08 (served 2026-08-10 + 90 MINOR days)"
            - "at clock == deadline (2026-11-08): st_on == NOTICE_SENT (not escalated)"
            - "at clock == deadline + 1 (2026-11-09): st_after == ESCALATED and by == CLOCK_SWEEP"

      - name: monitoring_due_posture_boundary
        claim_type: boundary
        grounds: [calculations.monitoring_schedule, entities.Easement.fields.posture]
        distinguishing_aspect: "Posture flips to MONITORING_DUE only when the clock date is strictly greater than next_monitoring_due_on: on 2027-08-01 (the due date) posture is GOOD_STANDING; on 2027-08-02 it is MONITORING_DUE."
        test_recipe:
          setup: ["RECORDED easement (recorded 2026-08-01, interval 12, due 2027-08-01), no visits completed"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-MD", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED }, monitoring_interval_months: 12 }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { due: $.data.next_monitoring_due_on } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: TrustAdmin }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { p_on: $.data.posture } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: TrustAdmin }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { p_after: $.data.posture } }
          assert:
            - "due == 2027-08-01"
            - "on the due date: p_on == GOOD_STANDING"
            - "one day past: p_after == MONITORING_DUE"

      - name: contribution_at_par_keeps_unit_value
        claim_type: correct_result
        grounds: [calculations.unit_value_unitization]
        distinguishing_aspect: "A contribution issued at the current rounded unit value leaves unit_value_cents unchanged (par issuance): two contributions at anchor keep UV exactly 100.0000."
        test_recipe:
          setup: ["fund with one 100000-cent contribution"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-UV", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 1000 }, as: TrustAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 100000 }, as: TrustAdmin }
          trigger:
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 50000 }, as: TrustAdmin, captures: { u2: $.data.units } }
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { uv: $.data.unit_value_cents, uo: $.data.units_outstanding, mv: $.data.market_value_cents } }
          assert:
            - "u2 == 500.0000 units issued at par"
            - "uv == 100.0000 (unchanged by par issuance), uo == 1500.0000, mv == 150000"

  - section: validations
    instances:
      - name: missing_user_context_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers fails before any role check with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /stewardship/easements", payload: {}, as: TrustAdmin }
          assert:
            - "when the request is sent with neither X-User-ID nor X-User-Role header, the response is 400 with error_id ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (header omission is expressed by the test harness, the role binding above only satisfies the lint contract)"

      - name: landowner_cannot_record_easement
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]", roles]
        distinguishing_aspect: "Role-based denial: the Landowner role is not in the record endpoint's roles, yielding ERR_INSUFFICIENT_PERMISSIONS 403."
        test_recipe:
          setup: ["DRAFT easement with landowner"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-RB", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
          trigger:
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: Landowner, as_user_id: "${lo_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (403); easement remains DRAFT"

      - name: occ_stale_easement_version_on_amendment_create
        claim_type: violation_to_error
        grounds: ["concurrency_rules[amendment-create-stale-easement]", "errors[ERR_STALE_EASEMENT_VERSION]"]
        distinguishing_aspect: "After amendment A bumps Easement.version and is withdrawn (leaving nothing in flight), amendment B created with the pre-A version is rejected 412 — the stale-matrix basis is caught by OCC, not by the in-flight uniqueness rule."
        test_recipe:
          setup: ["RECORDED easement; amendment A created against version ev (bumping it), then withdrawn"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-OC1", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { ev: $.data.version } }
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: SUBDIVISION, new_level: DISCRETIONARY } ], affected_acreage: 10 }, as: StewardshipCoordinator, captures: { am_a: $.data.id } }
            - { call: "POST /stewardship/amendment-requests/${am_a}/withdraw", payload: {}, as: StewardshipCoordinator }
          trigger:
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: SUBDIVISION, new_level: DISCRETIONARY } ], affected_acreage: 20 }, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_EASEMENT_VERSION (412): A's create advanced Easement.version from ev to ev+1, so B's expected ev is stale even though no amendment is in flight"

      - name: occ_stale_fund_version_on_draw
        claim_type: violation_to_error
        grounds: ["concurrency_rules[fund-draw-stale-version]", "errors[ERR_STALE_FUND_VERSION]"]
        distinguishing_aspect: "A draw priced against fund version 1 is rejected 412 after a contribution advanced the fund to version 2, even though the amount is within every balance ceiling."
        test_recipe:
          setup: ["ACTIVE fund: created (version 1), then a 500000 contribution (version 2); year-1 policy allowance is 0 so the 5000 draw would land entirely in the excess bucket"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-OC2", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 100000 }, as: TrustAdmin, captures: { f_id: $.data.id, fv1: $.data.version } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 500000 }, as: TrustAdmin }
          trigger:
            - { call: "POST /stewardship/endowment-funds/${f_id}/draws", payload: { amount_cents: 5000, purpose: MONITORING, expected_fund_version: "${fv1}" }, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_FUND_VERSION (412)"

      - name: occ_stale_easement_version_on_succession_record
        claim_type: violation_to_error
        grounds: ["concurrency_rules[succession-record-stale-easement]", "errors[ERR_STALE_EASEMENT_VERSION]"]
        distinguishing_aspect: "An ACKNOWLEDGED succession notice recorded against a pre-amendment easement version is rejected 412; the notice itself is still legitimately recordable, so only OCC can reject it."
        test_recipe:
          setup: ["RECORDED easement at version ev; succession notice created and acknowledged; then an amendment create advances the easement version"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-OC3", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { ev: $.data.version } }
            - { call: "POST /stewardship/succession-notices", payload: { easement_id: "${e_id}", successor_owner_name: "B", successor_contact_email: "b@x.com", transfer_on: "2026-09-15" }, as: Landowner, as_user_id: "${lo_id}", captures: { sn_id: $.data.id } }
            - { call: "POST /stewardship/succession-notices/${sn_id}/acknowledge", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: SUBDIVISION, new_level: DISCRETIONARY } ], affected_acreage: 10 }, as: StewardshipCoordinator, captures: { am_id: $.data.id } }
          trigger:
            - { call: "POST /stewardship/succession-notices/${sn_id}/record", payload: { expected_easement_version: "${ev}" }, as: TrustAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_EASEMENT_VERSION (412): the amendment create bumped Easement.version, so the notice's expected ev is stale"
            - "SuccessionNotice.${sn_id}.status remains ACKNOWLEDGED"

      - name: succession_notice_minimum_30_day_window
        claim_type: boundary
        grounds: ["validations[priority=10]", "errors[ERR_NOTICE_WINDOW_VIOLATION]"]
        distinguishing_aspect: "transfer_on exactly 30 days after the notice date is accepted; 29 days is rejected with ERR_NOTICE_WINDOW_VIOLATION."
        test_recipe:
          setup: ["RECORDED easement with ACTIVE landowner at default clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-NW", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
