  # ------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_requires_completed_tce
        grounds:
          - validations[priority=10]
          - state_machines.TransferCreditEvaluation.IN_REVIEW_to_COMPLETED
          - errors[ERR_EVALUATION_INCOMPLETE]
        distinguishing_aspect: |
          Pair Enrollment -> TransferCreditEvaluation: POST /api/enrollments is
          rejected ERR_EVALUATION_INCOMPLETE while the application's latest
          non-VOID TCE is IN_REVIEW, and succeeds after the same TCE reaches
          COMPLETED — no other input changes.
        test_recipe:
          setup:
            - "Full pipeline to ADMITTED application; TCE in IN_REVIEW"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "AUTHORIZED", effective_from: "2026-01-01" }
              as: ComplianceOfficer
            - call: "POST /api/terms"
              payload: { name: "2026 Fall A", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ann Advisor", email: "adv@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /api/staff"
              payload: { full_name: "Cal Counselor", email: "c@x.com", staff_type: "COUNSELOR", caseload_cap: 5, compensation_plan: "NON_INCENTIVE" }
              as: SystemAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "Pat Prospect", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap_id}"
              captures: { appl_id: "$.data.id" }
            - call: "POST /api/applications/${appl_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { appl_v: "$.data.version" }
            - call: "POST /api/applications/${appl_id}/transfer-credit-evaluations"
              payload: { accepted_credits: 10, in_progress_credits: 0 }
