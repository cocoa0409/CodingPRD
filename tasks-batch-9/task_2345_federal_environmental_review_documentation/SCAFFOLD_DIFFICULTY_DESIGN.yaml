            - "First publish returns HTTP 409 with error.error_id == ERR_INSUFFICIENT_ALTERNATIVES"
            - "After the first publish: NepaDocument.${doc_id}.publication_status == DRAFT and comment_status == NOT_OPEN"
            - "After screening Alternative B in: Alternative.${altB_id}.feasibility_score == 76.75 and ProposedAction.${act_id}.alternatives_screened_in_count == 1"
            - "Second publish returns HTTP 200 with NepaDocument.${doc_id}.publication_status == PUBLISHED, comment_status == OPEN and comment_period_days == 30"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: issue_creation_blocked_by_closed_scoping_period
        grounds:
          - endpoints.POST_proposed_actions_id_issues
          - state_machines.ScopingPeriod.OPEN_to_CLOSED
          - validations.priority_8_state
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Entity pair Issue -> ScopingPeriod: whether an Issue may be created depends on the state of a
          different entity, the named ScopingPeriod. The identical payload succeeds while the period is
          OPEN and fails with ERR_INVALID_STATE once the period is CLOSED, even though the Issue itself
          has no prior state and the ProposedAction is perfectly willing to accept issues.
        test_recipe:
          setup:
            - "The ERO-1 / Ridgeline action is CLASSIFIED as ENVIRONMENTAL_ASSESSMENT with an ADOPTED purpose and need statement."
            - "A PUBLIC ScopingPeriod covering [2026-08-03, 2026-09-02) is OPEN with duration_days 30."
            - "One BIOLOGICAL SIGNIFICANT issue was already recorded against that period while it was OPEN."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_issue_bio
            - *c_close_scope1
          trigger:
            - call: "POST /proposed-actions/${act_id}/issues"
              payload: { scoping_period_id: "${sp1_id}", resource_area: "WATER", origin: "AGENCY", significance: "SIGNIFICANT", summary: "Downstream turbidity during culvert work" }
              as: NepaCoordinator
          assert:
            - "HTTP status is 409 and error.error_id == ERR_INVALID_STATE"
            - "ScopingPeriod.${sp1_id}.status == CLOSED"
            - "No Issue row was created: GET /issues?action_id=${act_id} returns exactly 1 row, the BIOLOGICAL issue"
            - "ProposedAction.${act_id}.significant_issue_count == 1 and unaddressed_issue_count == 1"
            - "The same payload submitted before the close (setup) returned 201, proving the parent state is the only difference"

      - name: comment_creation_blocked_by_closed_document_comment_axis
        grounds:
          - endpoints.POST_comments
          - state_machines.NepaDocument.comment_status_OPEN_to_CLOSED
          - entities.NepaDocument.fields.comment_status
          - errors.ERR_COMMENT_PERIOD_NOT_OPEN
        distinguishing_aspect: |
          A different entity pair, PublicComment -> NepaDocument, keyed on a different parent field:
          the document's comment_status axis rather than a period's lifecycle status. The document is
          still PUBLISHED and the action still exists, yet a comment is refused with
          ERR_COMMENT_PERIOD_NOT_OPEN purely because the parent's comment axis reached CLOSED.
        test_recipe:
          setup:
            - "The ERO-1 / Ridgeline environmental assessment was published on 2026-09-05T00:00:00Z with a comment period ending 2026-10-05T00:00:00Z."
            - "One substantive comment was accepted while the period was OPEN."
            - "The logical clock has advanced to 2026-10-05T00:00:00Z and the comment period has been closed."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_issue_bio
            - *c_alt_a
            - *c_alt_b
            - *c_screen_alt_a
            - *c_screen_alt_b
            - *c_agency_fws
            - *c_con_esa
            - *c_con_esa_concur
            - *c_close_scope1
            - *c_cum1
            - *c_cum2
            - *c_cum3
            - *c_cum4
            - *c_ra_bio
            - *c_final_unmit
            - *c_doc_ea
            - *c_clk_sep5
            - *c_publish_ea
            - *c_comment1
            - *c_clk_oct5
            - *c_close_comments
          trigger:
            - call: "POST /comments"
              payload: { document_id: "${doc_id}", commenter_name: "K. Osei", resource_area: "WATER", is_substantive: true, body: "Turbidity monitoring frequency is not specified" }
              as: PublicCommenter
          assert:
            - "HTTP status is 409 and error.error_id == ERR_COMMENT_PERIOD_NOT_OPEN"
            - "NepaDocument.${doc_id}.publication_status == PUBLISHED and comment_status == CLOSED"
            - "NepaDocument.${doc_id}.substantive_comment_count == 1 and unresolved_substantive_count == 1"
            - "GET /comments?document_id=${doc_id} returns exactly 1 row"
            - "The identical shape of payload was accepted with 201 while comment_status was OPEN (setup)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: scoping_period_half_open_intervals_allow_adjacency_per_kind
        grounds:
          - entities.ScopingPeriod.fields.start_at
          - entities.ScopingPeriod.fields.end_at
          - calculations.interval_duration_days
          - validations.priority_13_business_temporal
          - errors.ERR_SCOPING_PERIOD_OVERLAP
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start_at, end_at) scoped to the ProposedAction resource and
          partitioned by scoping_kind. Touching endpoints are legal (a period starting exactly at the
          predecessor's end_at is accepted) and a same-kind period sharing a single interior instant is
          rejected, while an AGENCY period may fully coincide with a PUBLIC one because the kinds
          partition the resource.
        test_recipe:
          setup:
            - "ReviewOffice ERO-1 has min_scoping_days 30."
            - "The Ridgeline action is CLASSIFIED as ENVIRONMENTAL_ASSESSMENT."
            - "A PUBLIC ScopingPeriod covers the half-open interval [2026-08-03T00:00:00Z, 2026-09-02T00:00:00Z)."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_scope1
          trigger:
            - call: "POST /proposed-actions/${act_id}/scoping-periods"
              payload: { scoping_kind: "PUBLIC", start_at: "2026-09-02T00:00:00Z", end_at: "2026-10-02T00:00:00Z" }
              as: NepaCoordinator
              captures: { sp_adjacent_id: $.data.id }
            - call: "POST /proposed-actions/${act_id}/scoping-periods"
              payload: { scoping_kind: "PUBLIC", start_at: "2026-09-01T00:00:00Z", end_at: "2026-10-01T00:00:00Z" }
              as: NepaCoordinator
            - call: "POST /proposed-actions/${act_id}/scoping-periods"
              payload: { scoping_kind: "AGENCY", start_at: "2026-08-03T00:00:00Z", end_at: "2026-09-02T00:00:00Z" }
              as: NepaCoordinator
              captures: { sp_agency_id: $.data.id }
          assert:
            - "ScopingPeriod.${sp1_id}.duration_days == 30 and status == OPEN"
            - "The adjacent PUBLIC period returns 201 with ScopingPeriod.${sp_adjacent_id}.duration_days == 30, proving end_at is exclusive"
            - "The PUBLIC period starting 2026-09-01T00:00:00Z returns HTTP 409 with error.error_id == ERR_SCOPING_PERIOD_OVERLAP"
            - "The AGENCY period coinciding exactly with the first PUBLIC period returns 201, proving the overlap test is partitioned by scoping_kind"
            - "GET /proposed-actions/${act_id}/scoping-periods returns exactly 3 rows"
            - "ProposedAction.${act_id}.review_stage == SCOPING after all three calls"

      - name: consultation_closed_intervals_with_handoff_buffer_and_agency_capacity
        grounds:
          - entities.ConsultationRequest.fields.requested_start_at
          - entities.ConsultationRequest.fields.statutory_due_at
          - entities.Agency.fields.handoff_buffer_days
          - entities.Agency.fields.max_concurrent_consultations
          - errors.ERR_AGENCY_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: the occupied interval is
          CLOSED on both ends and extended by handoff_buffer_days, and the resource is the Agency
          rather than the ProposedAction, with rejection driven by an aggregate count reaching
          max_concurrent_consultations rather than by any pairwise collision. A request starting
          exactly on a predecessor's buffered end instant collides here, the opposite of the
          half-open scoping rule.
        test_recipe:
          setup:
            - "Agency NOAA has agency_role BOTH, statutory_response_days 135, handoff_buffer_days 3 and max_concurrent_consultations 2."
            - "Agency SHPO has agency_role CONSULTING, statutory_response_days 30, handoff_buffer_days 3 and max_concurrent_consultations 1."
            - "The Ridgeline action is CLASSIFIED as ENVIRONMENTAL_ASSESSMENT."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - call: "POST /agencies"
              payload: { agency_code: "NOAA", name: "National Marine Fisheries Service", agency_role: "BOTH", max_concurrent_consultations: 2, handoff_buffer_days: 3, statutory_response_days: 135, status: "ACTIVE" }
              as: PolicyAdmin
              captures: { noaa_id: $.data.id }
            - call: "POST /agencies"
              payload: { agency_code: "SHPO", name: "State Historic Preservation Office", agency_role: "CONSULTING", max_concurrent_consultations: 1, handoff_buffer_days: 3, statutory_response_days: 30, status: "ACTIVE" }
              as: PolicyAdmin
              captures: { shpo_id: $.data.id }
            - call: "POST /consultations"
              payload: { action_id: "${act_id}", agency_id: "${noaa_id}", consultation_type: "ESA_SECTION_7", requested_start_at: "2026-08-05T00:00:00Z" }
              as: NepaCoordinator
              captures: { n1_id: $.data.id }
            - call: "POST /consultations"
              payload: { action_id: "${act_id}", agency_id: "${shpo_id}", consultation_type: "NHPA_SECTION_106", requested_start_at: "2026-08-05T00:00:00Z" }
              as: NepaCoordinator
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /consultations"
              payload: { action_id: "${act_id}", agency_id: "${noaa_id}", consultation_type: "CWA_SECTION_404", requested_start_at: "2026-09-01T00:00:00Z" }
              as: NepaCoordinator
              captures: { n2_id: $.data.id }
            - call: "POST /consultations"
              payload: { action_id: "${act_id}", agency_id: "${noaa_id}", consultation_type: "COOPERATING_AGENCY", requested_start_at: "2026-10-01T00:00:00Z" }
              as: NepaCoordinator
            - call: "POST /consultations"
              payload: { action_id: "${act_id}", agency_id: "${shpo_id}", consultation_type: "NHPA_SECTION_106", requested_start_at: "2026-09-07T00:00:00Z" }
              as: NepaCoordinator
            - call: "POST /consultations"
              payload: { action_id: "${act_id}", agency_id: "${shpo_id}", consultation_type: "NHPA_SECTION_106", requested_start_at: "2026-09-08T00:00:00Z" }
              as: NepaCoordinator
              captures: { s3_id: $.data.id }
          assert:
            - "ConsultationRequest.${n1_id}.statutory_due_at == 2026-12-18T00:00:00Z, so its occupied interval is the closed span [2026-08-05T00:00:00Z, 2026-12-21T00:00:00Z]"
            - "ConsultationRequest.${s1_id}.statutory_due_at == 2026-09-04T00:00:00Z, so its occupied interval is [2026-08-05T00:00:00Z, 2026-09-07T00:00:00Z]"
            - "The NOAA request starting 2026-09-01T00:00:00Z returns 201 with statutory_due_at == 2027-01-14T00:00:00Z (1 colliding interval < capacity 2)"
            - "The NOAA request starting 2026-10-01T00:00:00Z returns HTTP 409 with error.error_id == ERR_AGENCY_CAPACITY_EXCEEDED (2 colliding intervals reach capacity 2)"
            - "The SHPO request starting exactly on the buffered end instant 2026-09-07T00:00:00Z returns HTTP 409 with error.error_id == ERR_AGENCY_CAPACITY_EXCEEDED, proving both ends are inclusive"
            - "The SHPO request starting 2026-09-08T00:00:00Z returns 201, proving handoff_buffer_days extends the occupied interval by exactly 3 days"
            - "Agency.${noaa_id}.active_consultation_count == 2 and Agency.${shpo_id}.active_consultation_count == 2"

  - rule_id: compensating_invariant
    instances:
      - name: office_obligation_ledger_restored_exactly_after_sign_then_remand
        grounds:
          - calculations.office_binding_obligation_ledger
          - state_machines.DecisionDocument.DRAFT_to_SIGNED
          - state_machines.DecisionDocument.SIGNED_to_VACATED
          - entities.ReviewOffice.fields.binding_obligation_cents
          - entities.ProposedAction.fields.record_entry_count
        distinguishing_aspect: |
          Conserved quantity: the office's monetary obligation ledger in cents. Signing credits
          3487823 and the remand debits exactly the same figure, returning binding_obligation_cents
          to 0 while the administrative record only grows (record_entry_count 9 -> 12), so the ledger
          is restored without any history being rewritten.
        test_recipe:
          setup:
            - "The full ERO-1 / Ridgeline chain is complete with a DRAFT MITIGATED_FONSI decision and two PROPOSED commitments; ReviewOffice.binding_obligation_cents is 0."
            - "The logical clock reads 2026-11-01T12:00:00Z."
            - "Signer official-9 differs from preparer coord-1; resolver review-officer-3 differs from official-9."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_issue_bio
            - *c_alt_a
            - *c_alt_b
            - *c_screen_alt_a
            - *c_screen_alt_b
            - *c_agency_fws
            - *c_con_esa
            - *c_con_esa_concur
            - *c_close_scope1
            - *c_cum1
            - *c_cum2
            - *c_cum3
            - *c_cum4
            - *c_ra_bio
            - *c_final_unmit
            - *c_doc_ea
            - *c_clk_sep5
            - *c_publish_ea
            - *c_comment1
            - *c_clk_oct5
            - *c_close_comments
            - *c_respond_comment1
            - *c_finalize_doc
            - *c_decision
            - *c_mit1
            - *c_get_dec_v2
            - *c_mit2
            - *c_clk_nov1
          trigger:
            - *c_sign
            - *c_objection
            - *c_resolve_remand
          assert:
            - "Before the signature: ReviewOffice.${off_id}.binding_obligation_cents == 0 and ProposedAction.${act_id}.record_entry_count == 8"
            - "After the signature: ReviewOffice.${off_id}.binding_obligation_cents == 3487823 and ProposedAction.${act_id}.record_entry_count == 9"
            - "After the remand: ReviewOffice.${off_id}.binding_obligation_cents == 0, exactly the pre-signature value"
            - "After the remand: ProposedAction.${act_id}.record_entry_count == 12, strictly greater than 9"
            - "DecisionDocument.${dec_id}.binding_obligation_cents remains 3487823 on the VACATED row as the historical record"
            - "No AdminRecordEntry row was deleted or renumbered: sequence_no values are 1..12 with no gaps"

      - name: unaddressed_issue_coverage_restored_exactly_after_finalize_then_reopen
        grounds:
          - calculations.unaddressed_issue_count
          - state_machines.ResourceAnalysis.DRAFT_to_FINAL
          - state_machines.ResourceAnalysis.FINAL_to_DRAFT
          - state_machines.Issue.OPEN_to_ANALYZED
          - entities.ProposedAction.fields.record_entry_count
        distinguishing_aspect: |
          A different conserved quantity in a different unit — the coverage count of unaddressed
          significant issues, not money. Finalizing the BIOLOGICAL analysis drives
          unaddressed_issue_count from 1 to 0 and reopening restores it to exactly 1 with the Issue
          back in OPEN, while record_entry_count advances 4 -> 5 -> 6 and never decreases.
        test_recipe:
          setup:
            - "The ERO-1 / Ridgeline action is at review_stage ANALYSIS with an ADOPTED purpose and need statement and a CLOSED PUBLIC scoping period."
            - "One BIOLOGICAL SIGNIFICANT Issue is OPEN and no ResourceAnalysis is FINAL, so unaddressed_issue_count is 1."
            - "A DRAFT BIOLOGICAL ResourceAnalysis exists over the four INCLUDED cumulative entries."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_issue_bio
            - *c_close_scope1
            - *c_cum1
            - *c_cum2
            - *c_cum3
            - *c_cum4
            - *c_ra_bio
          trigger:
            - *c_final_unmit
            - *c_reopen_bio
          assert:
            - "Before the finalize: ProposedAction.${act_id}.unaddressed_issue_count == 1, significant_issue_count == 1, finalized_analysis_count == 0, record_entry_count == 4"
            - "After the finalize: ProposedAction.${act_id}.unaddressed_issue_count == 0, finalized_analysis_count == 1, max_unmitigated_score == 70.21, cumulative_intensity_index == 60.04, record_entry_count == 5"
            - "After the finalize: Issue.${iss_bio_id}.status == ANALYZED"
            - "After the reopen: ProposedAction.${act_id}.unaddressed_issue_count == 1, exactly the pre-finalize value"
            - "After the reopen: ProposedAction.${act_id}.finalized_analysis_count == 0, max_unmitigated_score == 0.00, cumulative_intensity_index == 0.00"
            - "After the reopen: Issue.${iss_bio_id}.status == OPEN and significant_issue_count is still 1"
            - "After the reopen: ProposedAction.${act_id}.record_entry_count == 6, strictly greater than 5"
