            - call: "POST /pentest/tester-assignments/${asg1_id}/access"
              payload: { action: "REVOKE" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg1_state: $.data.access_state, asg1_settled: $.data.settled_hours }
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { ev5: $.data.version, reserved_3: $.data.hours_reserved, consumed_3: $.data.hours_consumed, available_3: $.data.hours_available }
            - call: "POST /pentest/tester-assignments"
              payload: { engagement_id: "${eng_id}", tester_id: "${t3_id}", assignment_role: "MEMBER", interval_start: "2026-09-05T00:00:00Z", interval_end: "2026-09-20T00:00:00Z", requested_hours: 40, granted_asset_ids: ["${asset_a_id}"], expected_engagement_version: "${ev5}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg3_id: $.data.id, asg3_state: $.data.access_state }
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
