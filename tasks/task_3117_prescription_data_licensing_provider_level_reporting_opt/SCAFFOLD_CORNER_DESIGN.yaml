              payload: { name: "Client A", entitlement_cells_total: 10 }
              as: PlatformAdmin
              captures: { cla_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Client B", entitlement_cells_total: 20 }
              as: PlatformAdmin
              captures: { clb_id: $.data.id }
          trigger:
            - call: "GET /clients/${clb_id}"
              payload: {}
              as: ManufacturerClient
              as_user_id: "${cla_id}"
              captures: { err: $.data.error_id }
            - call: "GET /clients/${cla_id}"
              payload: {}
              as: ManufacturerClient
              as_user_id: "${cla_id}"
              captures: { nm: $.data.name }
          assert:
