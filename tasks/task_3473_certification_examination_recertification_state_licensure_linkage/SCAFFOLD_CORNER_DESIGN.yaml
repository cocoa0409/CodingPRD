        excluded_because:
          difficulty_instance: resource_temporal_overlap / psychomotor_validity_window_containment
          rationale: "Asserted as trigger 1 of the named §1.8 instance (inside-window rejection and exact-end acceptance both tested)."

      - name: error_att_not_issuable_trigger
