              payload: { reported_outcome: "OFFICE_VISIT", outcome_source: "EHR_CLAIM", outcome_observed_at: "2026-08-03T14:45:00Z" }
              as: ComplianceAuditor
              captures: { audit_id: $.data.id, vclass: $.data.variance_class, vpoints: $.data.variance_severity_points }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T15:01:00Z" }
              as: PlatformAdmin
            - call: "GET /practices/${practice_id}/compliance-summary"
              as: ComplianceAuditor
              captures: { audited: $.data.audited_count, strict_rate: $.data.concordance_rate_strict_pct, band_rate: $.data.concordance_rate_band_tolerant_pct, over_count: $.data.overtriage_count, under_count: $.data.undertriage_count, points_total: $.data.variance_severity_points_total, posture: $.data.compliance_posture }
          assert:
