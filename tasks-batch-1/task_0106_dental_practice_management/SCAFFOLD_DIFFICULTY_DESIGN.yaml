              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2740", category: "MAJOR", fee_cents: 120000, phase_number: 1, tooth_number: 8 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2027-04-01T09:00:00Z", end_at: "2027-04-01T10:00:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/attachments"
              payload: { attachment_type: "PHOTO", document_ref: "ref://p2" }
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { claim_v: $.data.version, patient_due: $.data.patient_responsibility_cents }
            - call: "POST /payment-plans"
              payload: { patient_id: "${p_id}", claim_id: "${claim_id}", installment_count: 7, expected_claim_version: "${claim_v}" }
              as: BillingSpecialist
              captures: { pp_id: $.data.id }
            - call: "POST /payment-plans/${pp_id}/post-installment"
              payload: { amount_cents: 62500 }
              as: BillingSpecialist
              captures: { st_after_post: $.data.status }
          trigger:
            - call: "POST /payment-plans/${pp_id}/reverse-installment"
              payload: { amount_cents: 62500 }
              as: BillingSpecialist
              captures: { st_after_rev: $.data.status, remaining_after: $.data.remaining_balance_cents, posted_after: $.data.amount_posted_cents }
          assert:
            - "PaymentPlan.${pp_id}.amount_posted_cents == 0 after reversal"
            - "PaymentPlan.${pp_id}.remaining_balance_cents == 62500 (restored to principal)"
            - "PaymentPlan.${pp_id}.status == ACTIVE (flipped back from PAID_OFF)"
