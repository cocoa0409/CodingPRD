  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: assignment_capacity_accept_withdraw_restores
        grounds:
          - entities.Subcontractor.fields.active_assignment_count
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - state_machines.Assignment.ACCEPTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = crew commitment slots: active_assignment_count = count of
          own assignments in {ACCEPTED, ARRIVED}. Forward accept (+1) paired with the
          compensating dispatcher withdraw (-1) MUST return the counter to its prior value
          (0 -> 1 -> 0) with no drift.
        test_recipe:
          setup:
            - "Subcontractor sf (coverage max 2) with zero active assignments; job P3 dispatched with an OFFER to sf"
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
