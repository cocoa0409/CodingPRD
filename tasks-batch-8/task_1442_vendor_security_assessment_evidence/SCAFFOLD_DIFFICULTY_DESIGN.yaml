            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/score"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence"
              payload: { kind: "SOC2_TYPE2", period_start: "2025-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", issued_by: "AuditCo" }
              as: VendorContact
              captures: { e_id: $.data.id }
