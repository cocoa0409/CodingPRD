          assert:
            - "after trigger call 2: Season.marketing_allocated_cents == 500000, marketing_unallocated_cents == 39500000 and the two sum to 40000000"
            - "trigger call 5 shows TourStop.${stop_atl}.marketing_spend_committed_cents == 750000 after both allocations"
            - "trigger call 7 shows the release reconciled on the parent: marketing_allocated_cents back to 500000, marketing_unallocated_cents back to 39500000, sum still 40000000"
            - "trigger call 8 shows the child counter reconciled too: TourStop.marketing_spend_committed_cents back to 500000, and GET /tour-stops/${stop_atl}/marketing-allocations still returns both rows with states COMMITTED and RELEASED — the release is a state change, not a physical delete"
            - "trigger call 12, taken after the order was created but before payment, shows tickets_sold_count == 0, gross_ticket_revenue_cents == 0 and pit_party_sold_count == 0: a PENDING order holds seats but contributes nothing to the revenue counters"
            - "trigger call 14 shows the paid counters: tickets_sold_count == 25, gross_ticket_revenue_cents == 80000, facility_fee_collected_cents == 8750, addon_revenue_cents == 12000 and pit_party_sold_count == 5"
            - "trigger call 16 shows every one of those counters reversed to 0 after the refund, and trigger call 17 shows the tier at sold_seat_count 0, reserved_seat_count 0 and available_seat_count 500 — exactly the pre-order ledger"
            - "trigger call 19 shows run_order_end_offset_minutes == 55 after the second segment (40 + 15 with no floor-reset gap, because the reset gap only applies between two consecutive COMPETITION segments), where it was 40 with ${seg1} alone"

  - section: consistency_model
    instances:
      - name: corner_consistency_every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - consistency_model
          - calculations.required_safety_provisioning
          - calculations.stop_readiness_posture
          - calculations.run_order_timeline
          - calculations.logistics_readiness_score
        distinguishing_aspect: "Consistency is immediate, so no derived value may lag behind the write that caused it: the response body of the writing call itself must already carry the recomputed requirement, posture, timeline and score, and a follow-up read must agree exactly. There is no queue, no eventual convergence and no 202 anywhere in the design — a test that only checks the follow-up read cannot distinguish immediate from deferred recomputation, so both are asserted on every write."
        test_recipe:
          setup:
            - "An accepted ATL stop with show timing, a CERTIFIED safety plan, tier GA and one marketing allocation, so the stop is ready to open"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
            - call: "POST /competitors"
              payload: { team_name: "Alpha Racing", driver_name: "K. Sato", home_market_code: "CLT", vehicle_class: "HEAVY" }
              as: SeriesPromoter
              captures: { comp_a: "$.data.id" }
          trigger:
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp_a}", tour_stop_id: "${stop_atl}", vehicle_number: "7", vehicle_weight_lbs: 9500, haul_distance_miles: 600, scheduled_arrival_utc: "2026-11-14T16:00:00Z" }
              as: SeriesPromoter
              captures: { entry_a7: "$.data.id" }
            - call: "GET /vehicle-entries/${entry_a7}"
              payload: {}
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Heat Races", run_order_position: 1, duration_minutes: 40 }
              as: SeriesPromoter
              captures: { seg1: "$.data.id" }
            - call: "GET /tour-stops/${stop_atl}"
              payload: {}
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/safety-plan"
              payload: { barrier_linear_feet: 1200, catch_fence_height_ft: 8, medical_als_staff_count: 1, medical_bls_staff_count: 2, ambulance_count: 1, emergency_access_lanes: 1 }
              as: SafetyOfficial
              as_user_id: "so-a"
              captures: { plan_atl: "$.data.id" }
            - call: "GET /safety-plans/${plan_atl}"
              payload: {}
              as: SafetyOfficial
              as_user_id: "so-a"
            - call: "GET /tour-stops/${stop_atl}"
              payload: {}
              as: SafetyOfficial
              as_user_id: "so-a"
          assert:
            - "trigger call 1 returns HTTP 201 whose own body already carries logistics_readiness_score == 95 == SCORE_BASE - FLOOR(600 / HAUL_RISK_BLOCK_MILES) * HAUL_RISK_PER_BLOCK under variant PRE_STAGING, and trigger call 2 returns byte-identical derived values"
            - "trigger call 3 returns HTTP 201 whose own body carries start_offset_minutes 0 and end_offset_minutes 40, and trigger call 4 shows TourStop.competition_segment_count == 1 and run_order_end_offset_minutes == 40 with no second call needed to trigger recomputation"
            - "trigger call 5 returns HTTP 201 whose own body already carries required_catch_fence_height_ft == 8 — computed from the HEAVY 9500 lb entry created two calls earlier in a different aggregate — plus required_als_staff_count 1, required_bls_staff_count 2, required_ambulance_count 1 and required_barrier_linear_feet 1200"
            - "trigger call 6 agrees with trigger call 5 field for field, so nothing was recomputed lazily on read"
            - "trigger call 7 shows readiness_posture == RESTRICTED in the stop aggregate the instant the plan was filed (safety_state SAFETY_DRAFT and marketing_spend_committed_cents 0 both hold it back), with no intermediate stale value ever observable"
            - "no endpoint in the design returns 202 and no field is documented as eventually consistent"
