  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: complaint_resolve_gated_by_qualityreview_outcome
        grounds:
          - state_machines.Complaint.RESPONSE_QA_to_RESOLVED
          - state_machines.QualityReview.OPEN_to_COMPLETED
          - errors[ERR_QA_PASS_REQUIRED]
        distinguishing_aspect: |
          Pair Complaint -> QualityReview: resolve is legal only when a
          sibling COMPLETED review with outcome == PASS exists; a complaint
          whose only review completed FAIL (via qa_fail, bouncing it back to
          INVESTIGATING) cannot resolve until a subsequent PASS review
          exists. Distinct entity pair from instance 2.
