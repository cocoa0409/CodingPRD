# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; default logical clock 2026-08-01T00:00:00Z) ---
  - { method: POST, path: "/vbc/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads that default and never falls back to wall-clock time.", roles: [PayerAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["All date-stamping and window checks use this clock"] }

  # --- Program ---
  - { method: POST, path: "/vbc/programs", description: "Create program (DRAFT)", roles: [PayerAdmin], code: 201, input: [program_name, line_of_business], output: Program, side_effects: [] }
  - { method: GET, path: "/vbc/programs", description: "List programs", roles: &all_roles [PayerAdmin, ContractManager, AttributionAnalyst, ActuaryAnalyst, QualityAnalyst, ClaimsProcessor, SettlementOfficer, DisputeAdjudicator, PaymentOps, Auditor, PracticeGroupRep], code: 200, input: ["limit?", "offset?"], output: "Program[]", side_effects: [] }
  - { method: GET, path: "/vbc/programs/{id}", description: "Get program", roles: *all_roles, code: 200, input: [], output: Program, side_effects: [] }
  - { method: POST, path: "/vbc/programs/{id}/activate", description: "Activate program", roles: [PayerAdmin], code: 200, input: [], output: Program, side_effects: ["program_status -> ACTIVE"] }
  - { method: POST, path: "/vbc/programs/{id}/archive", description: "Archive program", roles: [PayerAdmin], code: 200, input: [], output: Program, side_effects: ["program_status -> ARCHIVED"] }

  # --- PracticeGroup ---
  - { method: POST, path: "/vbc/practice-groups", description: "Create practice group (ACTIVE)", roles: [PayerAdmin], code: 201, input: [group_name, tin], output: PracticeGroup, side_effects: [] }
  - { method: GET, path: "/vbc/practice-groups", description: "List practice groups", roles: *all_roles, code: 200, input: ["group_status?", "limit?", "offset?"], output: "PracticeGroup[]", side_effects: [] }
  - { method: GET, path: "/vbc/practice-groups/{id}", description: "Get practice group", roles: *all_roles, code: 200, input: [], output: PracticeGroup, side_effects: [] }
  - { method: POST, path: "/vbc/practice-groups/{id}/suspend", description: "Suspend group", roles: [PayerAdmin], code: 200, input: [reason], output: PracticeGroup, side_effects: ["group_status -> SUSPENDED; suspension_reason := reason"] }
  - { method: POST, path: "/vbc/practice-groups/{id}/reinstate", description: "Reinstate group", roles: [PayerAdmin], code: 200, input: [], output: PracticeGroup, side_effects: ["group_status -> ACTIVE; suspension_reason := null"] }
  - { method: POST, path: "/vbc/practice-groups/{id}/terminate", description: "Terminate group", roles: [PayerAdmin], code: 200, input: [], output: PracticeGroup, side_effects: ["group_status -> TERMINATED"] }

  # --- Practice ---
  - { method: POST, path: "/vbc/practices", description: "Create practice (ACTIVE)", roles: [PayerAdmin], code: 201, input: [practice_group_id, practice_name, npi], output: Practice, side_effects: [] }
  - { method: GET, path: "/vbc/practices", description: "List practices", roles: *all_roles, code: 200, input: ["practice_group_id?", "practice_status?", "limit?", "offset?"], output: "Practice[]", side_effects: [] }
  - { method: GET, path: "/vbc/practices/{id}", description: "Get practice", roles: *all_roles, code: 200, input: [], output: Practice, side_effects: [] }
  - { method: POST, path: "/vbc/practices/{id}/deactivate", description: "Deactivate practice", roles: [PayerAdmin], code: 200, input: [], output: Practice, side_effects: ["practice_status -> INACTIVE"] }

  # --- Member ---
  - { method: POST, path: "/vbc/members", description: "Create member (ELIGIBLE)", roles: [PayerAdmin], code: 201, input: [program_id, member_ref, birth_year], output: Member, side_effects: [] }
  - { method: GET, path: "/vbc/members", description: "List members", roles: *all_roles, code: 200, input: ["program_id?", "member_status?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: GET, path: "/vbc/members/{id}", description: "Get member", roles: *all_roles, code: 200, input: [], output: Member, side_effects: [] }
  - { method: POST, path: "/vbc/members/{id}/disenroll", description: "Disenroll member", roles: [PayerAdmin], code: 200, input: [], output: Member, side_effects: ["member_status -> DISENROLLED"] }

  # --- EligibilitySpan ---
  - { method: POST, path: "/vbc/eligibility-spans", description: "Create eligibility span (closed interval; no date shared with another span of the same member)", roles: [PayerAdmin], code: 201, input: [member_id, start_date, end_date], output: EligibilitySpan, side_effects: [] }
  - { method: GET, path: "/vbc/eligibility-spans", description: "List eligibility spans", roles: *all_roles, code: 200, input: ["member_id?", "span_status?", "limit?", "offset?"], output: "EligibilitySpan[]", side_effects: [] }
  - { method: GET, path: "/vbc/eligibility-spans/{id}", description: "Get eligibility span", roles: *all_roles, code: 200, input: [], output: EligibilitySpan, side_effects: [] }
  - { method: POST, path: "/vbc/eligibility-spans/{id}/close", description: "Close span", roles: [PayerAdmin], code: 200, input: [], output: EligibilitySpan, side_effects: ["span_status -> CLOSED"] }

  # --- Contract ---
  - { method: POST, path: "/vbc/contracts", description: "Create contract (DRAFT)", roles: [ContractManager], code: 201, input: [program_id, practice_group_id, contract_ref, effective_start, effective_end, risk_track, risk_model, benchmark_pmpm_cents, shared_savings_rate_bp, "shared_loss_rate_bp?", min_savings_rate_bp, "min_loss_rate_bp?", savings_cap_bp, "loss_cap_bp?", stop_loss_cents, withhold_rate_bp, quality_gate_floor_points, quality_gate_excellence_points, estimate_method, quality_measures], output: Contract, side_effects: [] }
  - { method: GET, path: "/vbc/contracts", description: "List contracts", roles: *all_roles, code: 200, input: ["program_id?", "practice_group_id?", "renewed_from_contract_id?", "contract_status?", "limit?", "offset?"], output: "Contract[]", side_effects: [] }
  - { method: GET, path: "/vbc/contracts/{id}", description: "Get contract", roles: *all_roles, code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/vbc/contracts/{id}/activate", description: "Activate contract; pins risk_model", roles: [ContractManager], code: 200, input: [], output: Contract, side_effects: ["contract_status -> ACTIVE; risk_model pinned"] }
  - { method: POST, path: "/vbc/contracts/{id}/expire", description: "Expire contract after term end with all years CLOSED", roles: [ContractManager], code: 200, input: [], output: Contract, side_effects: ["contract_status -> EXPIRED"] }
  - { method: POST, path: "/vbc/contracts/{id}/terminate", description: "Terminate contract with no in-flight years", roles: [ContractManager], code: 200, input: [], output: Contract, side_effects: ["contract_status -> TERMINATED"] }
  - { method: POST, path: "/vbc/contracts/{id}/renew", description: "Renew expired contract per a COMPLETE non-DO_NOT_RENEW analysis; returns the new DRAFT successor", roles: [ContractManager], code: 201, input: [], output: Contract, side_effects: ["This contract -> RENEWED; successor created with renewed_from_contract_id"] }

  # --- PerformanceYear ---
  - { method: POST, path: "/vbc/performance-years", description: "Create performance year (SETUP); half-open windows of one contract must not overlap", roles: [PayerAdmin], code: 201, input: [contract_id, year_label, period_start, period_end], output: PerformanceYear, side_effects: [] }
  - { method: GET, path: "/vbc/performance-years", description: "List performance years", roles: *all_roles, code: 200, input: ["contract_id?", "locked_run_id?", "year_status?", "limit?", "offset?"], output: "PerformanceYear[]", side_effects: [] }
  - { method: GET, path: "/vbc/performance-years/{id}", description: "Get performance year", roles: *all_roles, code: 200, input: [], output: PerformanceYear, side_effects: [] }
  - { method: POST, path: "/vbc/performance-years/{id}/open-attribution", description: "SETUP -> ATTRIBUTION_OPEN", roles: [PayerAdmin], code: 200, input: [], output: PerformanceYear, side_effects: [] }
  - { method: POST, path: "/vbc/performance-years/{id}/lock-attribution", description: "ATTRIBUTION_OPEN -> ATTRIBUTION_LOCKED; pins locked run and computes rollups", roles: [PayerAdmin], code: 200, input: [], output: PerformanceYear, side_effects: ["locked_run_id set", "attribution_rollup computed", "increments PerformanceYear.version by 1"] }
  - { method: POST, path: "/vbc/performance-years/{id}/begin-measurement", description: "ATTRIBUTION_LOCKED -> MEASURING; computes cost and withhold pool", roles: [PayerAdmin], code: 200, input: [], output: PerformanceYear, side_effects: ["cost_measurement and withhold_pool computed", "increments PerformanceYear.version by 1"] }
  - { method: POST, path: "/vbc/performance-years/{id}/begin-reconciliation", description: "MEASURING -> RECONCILING after period end with quality locked and non-empty population", roles: [PayerAdmin], code: 200, input: [], output: PerformanceYear, side_effects: ["increments PerformanceYear.version by 1"] }
  - { method: POST, path: "/vbc/performance-years/{id}/reopen-attribution", description: "RECONCILING -> ATTRIBUTION_OPEN; supersedes locked run, voids PROVISIONAL settlement, resets rollups", roles: [PayerAdmin], code: 200, input: [], output: PerformanceYear, side_effects: ["run SUPERSEDED; settlement VOID; rollups reset", "increments PerformanceYear.version by 1"] }
  - { method: POST, path: "/vbc/performance-years/{id}/mark-settled", description: "RECONCILING -> SETTLED after dispute window closes; releases reserve", roles: [SettlementOfficer], code: 200, input: [], output: PerformanceYear, side_effects: ["accrued_reserve_cents := 0", "increments PerformanceYear.version by 1"] }
  - { method: POST, path: "/vbc/performance-years/{id}/close", description: "SETTLED -> CLOSED once settlement DISTRIBUTED", roles: [Auditor], code: 200, input: [], output: PerformanceYear, side_effects: [] }

  # --- AttributionRun ---
  - { method: POST, path: "/vbc/performance-years/{id}/attribution-runs", description: "Create attribution run (DRAFT) for a year in ATTRIBUTION_OPEN (else ERR_YEAR_NOT_OPEN); supersedes existing DRAFT/COMPUTED runs of the year; OCC-guarded", roles: [AttributionAnalyst], code: 201, input: [run_label, expected_performance_year_version], output: AttributionRun, side_effects: ["run_seq := max+1 for the year", "prior DRAFT/COMPUTED runs -> SUPERSEDED", "increments PerformanceYear.version by 1"] }
  - { method: GET, path: "/vbc/attribution-runs", description: "List attribution runs", roles: *all_roles, code: 200, input: ["performance_year_id?", "run_status?", "limit?", "offset?"], output: "AttributionRun[]", side_effects: [] }
  - { method: GET, path: "/vbc/attribution-runs/{id}", description: "Get attribution run", roles: *all_roles, code: 200, input: [], output: AttributionRun, side_effects: [] }
  - { method: POST, path: "/vbc/attribution-runs/{id}/compute", description: "DRAFT -> COMPUTED; computes member_months and confirms records", roles: [AttributionAnalyst], code: 200, input: [], output: AttributionRun, side_effects: ["member_months computed", "records PROVISIONAL -> CONFIRMED", "attributed_member_count updated"] }
  - { method: POST, path: "/vbc/attribution-runs/{id}/lock", description: "COMPUTED -> LOCKED (year must be ATTRIBUTION_OPEN; one LOCKED run per year)", roles: [AttributionAnalyst], code: 200, input: [], output: AttributionRun, side_effects: [] }

  # --- AttributionRecord ---
  - { method: POST, path: "/vbc/attribution-runs/{id}/records", description: "Add member attribution record (PROVISIONAL) to a DRAFT run", roles: [AttributionAnalyst], code: 201, input: [member_id, practice_id], output: AttributionRecord, side_effects: [] }
  - { method: GET, path: "/vbc/attribution-records", description: "List attribution records", roles: *all_roles, code: 200, input: ["attribution_run_id?", "member_id?", "practice_id?", "record_status?", "limit?", "offset?"], output: "AttributionRecord[]", side_effects: [] }
  - { method: GET, path: "/vbc/attribution-records/{id}", description: "Get attribution record", roles: *all_roles, code: 200, input: [], output: AttributionRecord, side_effects: [] }
  - { method: POST, path: "/vbc/attribution-records/{id}/exclude", description: "CONFIRMED -> EXCLUDED; rollups recomputed; settlement flagged", roles: [AttributionAnalyst], code: 200, input: [], output: AttributionRecord, side_effects: ["year.total_member_months/benchmark recomputed", "Settlement needs_recompute := true when PROVISIONAL/FINALIZED"] }
  - { method: POST, path: "/vbc/attribution-records/{id}/reinstate", description: "EXCLUDED -> CONFIRMED; rollups recomputed (member-months conserved)", roles: [AttributionAnalyst], code: 200, input: [], output: AttributionRecord, side_effects: ["year rollups recomputed with record restored"] }

  # --- RiskScore ---
  - { method: POST, path: "/vbc/risk-scores", description: "Create risk score (PRELIMINARY); model_used must equal the year's contract risk_model pin", roles: [ActuaryAnalyst], code: 201, input: [member_id, performance_year_id, model_used, score_milli], output: RiskScore, side_effects: [] }
  - { method: GET, path: "/vbc/risk-scores", description: "List risk scores", roles: *all_roles, code: 200, input: ["member_id?", "performance_year_id?", "model_used?", "score_status?", "limit?", "offset?"], output: "RiskScore[]", side_effects: [] }
  - { method: GET, path: "/vbc/risk-scores/{id}", description: "Get risk score", roles: *all_roles, code: 200, input: [], output: RiskScore, side_effects: [] }
  - { method: POST, path: "/vbc/risk-scores/{id}/finalize", description: "PRELIMINARY -> FINAL; recomputes year rollups when locked", roles: [ActuaryAnalyst], code: 200, input: [], output: RiskScore, side_effects: ["benchmark_cost_cents/RAF recomputed when year locked", "Settlement needs_recompute := true when PROVISIONAL/FINALIZED"] }
  - { method: POST, path: "/vbc/risk-scores/{id}/supersede", description: "PRELIMINARY/FINAL -> SUPERSEDED; recomputes rollups", roles: [ActuaryAnalyst], code: 200, input: [], output: RiskScore, side_effects: ["rollups recomputed without this score", "Settlement needs_recompute := true when PROVISIONAL/FINALIZED"] }

  # --- ClaimRecord ---
  - { method: POST, path: "/vbc/claims", description: "Create claim (RECEIVED); service_date must satisfy period_start <= service_date < period_end", roles: [ClaimsProcessor], code: 201, input: [performance_year_id, member_id, claim_ref, service_date, paid_amount_cents], output: ClaimRecord, side_effects: [] }
  - { method: GET, path: "/vbc/claims", description: "List claims", roles: *all_roles, code: 200, input: ["performance_year_id?", "member_id?", "claim_status?", "limit?", "offset?"], output: "ClaimRecord[]", side_effects: [] }
  - { method: GET, path: "/vbc/claims/{id}", description: "Get claim", roles: *all_roles, code: 200, input: [], output: ClaimRecord, side_effects: [] }
  - { method: POST, path: "/vbc/claims/{id}/mark-paid", description: "RECEIVED -> PAID; stamps paid_on from logical clock; rollups recomputed when measuring", roles: [ClaimsProcessor], code: 200, input: [], output: ClaimRecord, side_effects: ["paid_on := clock date", "year actual_cost/withhold_pool recomputed when year past MEASURING", "PUBLISHED interim reports -> STALE", "Settlement needs_recompute := true when PROVISIONAL/FINALIZED"] }
  - { method: POST, path: "/vbc/claims/{id}/deny", description: "RECEIVED -> DENIED", roles: [ClaimsProcessor], code: 200, input: [], output: ClaimRecord, side_effects: [] }
  - { method: POST, path: "/vbc/claims/{id}/void", description: "PAID -> VOIDED; cascades to year totals, interim staleness, settlement recompute flag", roles: [ClaimsProcessor], code: 200, input: [], output: ClaimRecord, side_effects: ["year actual_cost_cents/withhold_pool_cents recomputed", "PUBLISHED InterimReports -> STALE", "Settlement needs_recompute := true when PROVISIONAL/FINALIZED"] }

  # --- QualityMeasureResult ---
  - { method: POST, path: "/vbc/quality-measure-results", description: "Report a measure result (REPORTED); measure_code must be in contract catalog", roles: [QualityAnalyst], code: 201, input: [performance_year_id, measure_code, numerator_count, denominator_count], output: QualityMeasureResult, side_effects: [] }
  - { method: GET, path: "/vbc/quality-measure-results", description: "List quality measure results", roles: *all_roles, code: 200, input: ["performance_year_id?", "measure_code?", "result_status?", "limit?", "offset?"], output: "QualityMeasureResult[]", side_effects: [] }
  - { method: GET, path: "/vbc/quality-measure-results/{id}", description: "Get quality measure result", roles: *all_roles, code: 200, input: [], output: QualityMeasureResult, side_effects: [] }
  - { method: POST, path: "/vbc/quality-measure-results/{id}/validate", description: "REPORTED -> VALIDATED; computes rate_bp and achievement_points", roles: [QualityAnalyst], code: 200, input: [], output: QualityMeasureResult, side_effects: ["rate_bp/achievement_points computed"] }
  - { method: POST, path: "/vbc/quality-measure-results/{id}/return-for-correction", description: "VALIDATED -> REPORTED; clears computed scoring", roles: [QualityAnalyst], code: 200, input: [], output: QualityMeasureResult, side_effects: ["rate_bp := null; achievement_points := null"] }
  - { method: POST, path: "/vbc/quality-measure-results/{id}/lock", description: "VALIDATED -> LOCKED (year must be pre-reconciliation)", roles: [QualityAnalyst], code: 200, input: [], output: QualityMeasureResult, side_effects: [] }
  - { method: POST, path: "/vbc/quality-measure-results/{id}/exclude", description: "REPORTED/VALIDATED/LOCKED -> EXCLUDED while year not settled", roles: [QualityAnalyst], code: 200, input: [], output: QualityMeasureResult, side_effects: ["Settlement needs_recompute := true when PROVISIONAL/FINALIZED"] }

  # --- InterimReport ---
  - { method: POST, path: "/vbc/interim-reports", description: "Create interim report (DRAFT); supersedes existing DRAFT of the year; OCC-guarded; computes both estimate variants and reserve accrual", roles: [ActuaryAnalyst], code: 201, input: [performance_year_id, months_elapsed, expected_performance_year_version], output: InterimReport, side_effects: ["prior DRAFT reports of the year -> SUPERSEDED", "increments PerformanceYear.version by 1"] }
  - { method: GET, path: "/vbc/interim-reports", description: "List interim reports", roles: *all_roles, code: 200, input: ["performance_year_id?", "report_status?", "limit?", "offset?"], output: "InterimReport[]", side_effects: [] }
  - { method: GET, path: "/vbc/interim-reports/{id}", description: "Get interim report", roles: *all_roles, code: 200, input: [], output: InterimReport, side_effects: [] }
  - { method: POST, path: "/vbc/interim-reports/{id}/publish", description: "DRAFT -> PUBLISHED; supersedes prior PUBLISHED; posts reserve accrual to the year", roles: [ActuaryAnalyst], code: 200, input: [], output: InterimReport, side_effects: ["prior PUBLISHED report -> SUPERSEDED", "year.accrued_reserve_cents := reserve_accrual_cents"] }

  # --- Settlement ---
  - { method: POST, path: "/vbc/settlements", description: "Create settlement (PROVISIONAL) for a RECONCILING year; computes full settlement chain", roles: [SettlementOfficer], code: 201, input: [performance_year_id], output: Settlement, side_effects: ["settlement_seq := 1 for the first non-VOID settlement of the year", "settlement_net computed"] }
  - { method: GET, path: "/vbc/settlements", description: "List settlements", roles: *all_roles, code: 200, input: ["performance_year_id?", "settlement_status?", "limit?", "offset?"], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/vbc/settlements/{id}", description: "Get settlement", roles: *all_roles, code: 200, input: [], output: Settlement, side_effects: ["PracticeGroupRep caller scoped to own group's settlements"] }
  - { method: POST, path: "/vbc/settlements/{id}/finalize", description: "PROVISIONAL -> FINALIZED after runout; recomputes from current data; stamps finalized_on and finalized_by_user_id", roles: [SettlementOfficer], code: 200, input: [], output: Settlement, side_effects: ["full recompute (final variant)", "finalized_on/finalized_by_user_id stamped", "increments Settlement.version by 1"] }
  - { method: POST, path: "/vbc/settlements/{id}/recalculate", description: "PROVISIONAL with needs_recompute -> recomputed PROVISIONAL; clears the flag", roles: [SettlementOfficer], code: 200, input: [], output: Settlement, side_effects: ["full recompute", "needs_recompute := false", "increments Settlement.version by 1"] }
  - { method: POST, path: "/vbc/settlements/{id}/authorize-distribution", description: "FINALIZED -> AUTHORIZED after the dispute window; creates remittances by largest-remainder waterfall; net <= 0 goes straight to DISTRIBUTED", roles: [SettlementOfficer], code: 200, input: [], output: Settlement, side_effects: ["distribution_allocation creates remittances", "increments Settlement.version by 1"] }

  # --- SettlementDispute ---
  - { method: POST, path: "/vbc/settlements/{id}/disputes", description: "File dispute (FILED) on a FINALIZED settlement within the dispute window; settlement -> DISPUTED", roles: [PracticeGroupRep], code: 201, input: [dispute_ref, reason_code, claimed_adjustment_cents], output: SettlementDispute, side_effects: ["Settlement FINALIZED -> DISPUTED", "filed_on := clock date"] }
  - { method: GET, path: "/vbc/settlement-disputes", description: "List disputes", roles: *all_roles, code: 200, input: ["settlement_id?", "dispute_status?", "limit?", "offset?"], output: "SettlementDispute[]", side_effects: [] }
  - { method: GET, path: "/vbc/settlement-disputes/{id}", description: "Get dispute", roles: *all_roles, code: 200, input: [], output: SettlementDispute, side_effects: [] }
  - { method: POST, path: "/vbc/settlement-disputes/{id}/begin-review", description: "FILED -> UNDER_REVIEW", roles: [DisputeAdjudicator], code: 200, input: [], output: SettlementDispute, side_effects: ["review_started_on := clock date"] }
  - { method: POST, path: "/vbc/settlement-disputes/{id}/resolve", description: "UNDER_REVIEW -> UPHELD or OVERRULED within resolution window; segregation of duties vs finalized_by_user_id; UPHELD cascades settlement recalculation", roles: [DisputeAdjudicator], code: 200, input: [outcome], output: SettlementDispute, side_effects: ["UPHELD: Settlement DISPUTED -> RECALCULATING -> PROVISIONAL (auto-recalc)", "OVERRULED: Settlement DISPUTED -> FINALIZED"] }
  - { method: POST, path: "/vbc/settlement-disputes/{id}/withdraw", description: "FILED/UNDER_REVIEW -> WITHDRAWN by owning group", roles: [PracticeGroupRep], code: 200, input: [], output: SettlementDispute, side_effects: ["Settlement DISPUTED -> FINALIZED"] }
  - { method: POST, path: "/vbc/settlement-disputes/{id}/expire", description: "FILED/UNDER_REVIEW -> EXPIRED after resolution window", roles: [DisputeAdjudicator], code: 200, input: [], output: SettlementDispute, side_effects: ["Settlement DISPUTED -> FINALIZED"] }

  # --- DistributionRemittance ---
  - { method: GET, path: "/vbc/distribution-remittances", description: "List remittances", roles: *all_roles, code: 200, input: ["settlement_id?", "practice_id?", "remittance_status?", "limit?", "offset?"], output: "DistributionRemittance[]", side_effects: [] }
  - { method: GET, path: "/vbc/distribution-remittances/{id}", description: "Get remittance", roles: *all_roles, code: 200, input: [], output: DistributionRemittance, side_effects: [] }
  - { method: POST, path: "/vbc/distribution-remittances/{id}/approve", description: "SCHEDULED -> APPROVED; group must be ACTIVE", roles: [PaymentOps], code: 200, input: [], output: DistributionRemittance, side_effects: [] }
  - { method: POST, path: "/vbc/distribution-remittances/{id}/mark-paid", description: "APPROVED -> PAID; bubbles settlement to DISTRIBUTED when all PAID", roles: [PaymentOps], code: 200, input: [], output: DistributionRemittance, side_effects: ["paid_on := clock date", "settlement DISTRIBUTED when all remittances PAID"] }
  - { method: POST, path: "/vbc/distribution-remittances/{id}/return", description: "APPROVED -> RETURNED; amount released back to undistributed balance", roles: [PaymentOps], code: 200, input: [], output: DistributionRemittance, side_effects: ["undistributed_balance_cents recomputed"] }
  - { method: POST, path: "/vbc/distribution-remittances/{id}/requeue", description: "RETURNED -> SCHEDULED", roles: [PaymentOps], code: 200, input: [], output: DistributionRemittance, side_effects: ["undistributed_balance_cents recomputed"] }

  # --- RenewalAnalysis ---
  - { method: POST, path: "/vbc/contracts/{id}/renewal-analyses", description: "Create renewal analysis (DRAFT); requires contract EXPIRED (ERR_INVALID_STATE_TRANSITION) and >= 1 CLOSED year (ERR_YEARS_NOT_CLOSED); supersedes existing DRAFT; OCC-guarded", roles: [ContractManager], code: 201, input: [expected_contract_version], output: RenewalAnalysis, side_effects: ["analysis_seq := max+1 for the contract", "prior DRAFT analyses -> SUPERSEDED", "increments Contract.version by 1"] }
  - { method: GET, path: "/vbc/renewal-analyses", description: "List renewal analyses", roles: *all_roles, code: 200, input: ["contract_id?", "analysis_status?", "limit?", "offset?"], output: "RenewalAnalysis[]", side_effects: [] }
  - { method: GET, path: "/vbc/renewal-analyses/{id}", description: "Get renewal analysis", roles: *all_roles, code: 200, input: [], output: RenewalAnalysis, side_effects: [] }
  - { method: POST, path: "/vbc/renewal-analyses/{id}/complete", description: "DRAFT -> COMPLETE; computes recommendation", roles: [ContractManager], code: 200, input: [], output: RenewalAnalysis, side_effects: ["recommendation computed"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in the endpoint's roles" }
  - { id: ERR_FORBIDDEN_GROUP_SCOPE, http: 403, condition: "PracticeGroupRep X-User-ID does not equal the PracticeGroup owning the targeted settlement/dispute" }
  # --- existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, wrong type, invalid enum value, or scalar out of range (birth_year, score_milli, months_elapsed)" }
  # --- state family (409) ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource not in a from-state of the invoked transition (generic)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Contract activate requires program ACTIVE" }
  - { id: ERR_PROGRAM_HAS_OPEN_CONTRACTS, http: 409, condition: "Program archive blocked by DRAFT/ACTIVE contracts" }
  - { id: ERR_GROUP_NOT_ACTIVE, http: 409, condition: "Group must be ACTIVE (contract activate, remittance approve)" }
  - { id: ERR_GROUP_HAS_OPEN_CONTRACTS, http: 409, condition: "Group terminate blocked by DRAFT/ACTIVE contracts" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Year open-attribution requires contract ACTIVE" }
  - { id: ERR_CONTRACT_TERM_NOT_ENDED, http: 409, condition: "Contract expire before effective_end on the logical clock" }
  - { id: ERR_YEARS_NOT_CLOSED, http: 409, condition: "Contract expire requires every performance year CLOSED" }
  - { id: ERR_YEARS_IN_FLIGHT, http: 409, condition: "Contract terminate blocked by years between ATTRIBUTION_OPEN and SETTLED" }
  - { id: ERR_RENEWAL_NOT_RECOMMENDED, http: 409, condition: "Renew requires a COMPLETE analysis with recommendation != DO_NOT_RENEW" }
  - { id: ERR_YEAR_NOT_OPEN, http: 409, condition: "Attribution run lock requires year ATTRIBUTION_OPEN" }
  - { id: ERR_YEAR_LOCKED, http: 409, condition: "Data mutation blocked once year is SETTLED/CLOSED (claim void, risk supersede, quality exclude, attribution exclude/reinstate) or year past allowed stage (quality lock/return-for-correction)" }
  - { id: ERR_YEAR_NOT_MEASURING, http: 409, condition: "Interim publish requires year MEASURING or RECONCILING" }
  - { id: ERR_YEAR_NOT_RECONCILING, http: 409, condition: "Settlement create requires year RECONCILING" }
  - { id: ERR_NO_LOCKED_ATTRIBUTION_RUN, http: 409, condition: "lock-attribution with no LOCKED run for the year" }
  - { id: ERR_RUN_NOT_DRAFT, http: 409, condition: "Attribution record add requires run DRAFT" }
  - { id: ERR_RUN_NOT_LOCKED, http: 409, condition: "Record exclude/reinstate requires run LOCKED" }
  - { id: ERR_RUN_ALREADY_LOCKED, http: 409, condition: "A different run of the year is already LOCKED" }
  - { id: ERR_SETTLEMENT_EXISTS, http: 409, condition: "A non-VOID settlement already exists for the year" }
  - { id: ERR_SETTLEMENT_NOT_FINAL, http: 409, condition: "Dispute file or mark-settled requires settlement FINALIZED (mark-settled also accepts AUTHORIZED/DISTRIBUTED)" }
  - { id: ERR_SETTLEMENT_STALE, http: 409, condition: "Finalize blocked while needs_recompute is true; call recalculate first" }
  - { id: ERR_SETTLEMENT_BEYOND_PROVISIONAL, http: 409, condition: "reopen-attribution blocked once settlement is FINALIZED or later" }
  - { id: ERR_SETTLEMENT_NOT_AUTHORIZED, http: 409, condition: "Remittance approve/requeue requires settlement AUTHORIZED" }
  - { id: ERR_SETTLEMENT_NOT_DISTRIBUTED, http: 409, condition: "Year close requires settlement DISTRIBUTED" }
  # --- segregation / pinning (409) ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Dispute resolver X-User-ID equals settlement.finalized_by_user_id" }
  - { id: ERR_RISK_MODEL_MISMATCH, http: 409, condition: "RiskScore.model_used differs from the contract's pinned risk_model" }
  # --- temporal family (409) ---
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "Dispute filed after finalized_on + DISPUTE_WINDOW_DAYS" }
  - { id: ERR_DISPUTE_WINDOW_OPEN, http: 409, condition: "mark-settled/authorize-distribution before the dispute window closes" }
  - { id: ERR_DISPUTE_RESOLUTION_WINDOW_ELAPSED, http: 409, condition: "Resolve after filed_on + DISPUTE_RESOLUTION_DAYS" }
  - { id: ERR_DISPUTE_NOT_EXPIRABLE, http: 409, condition: "Expire before the resolution window has elapsed" }
  - { id: ERR_MEASUREMENT_PERIOD_NOT_ENDED, http: 409, condition: "begin-reconciliation before period_end on the logical clock" }
  - { id: ERR_QUALITY_RESULTS_UNLOCKED, http: 409, condition: "begin-reconciliation blocked: a quality result of the year is neither LOCKED nor EXCLUDED" }
  - { id: ERR_RECONCILIATION_RUNOUT_INCOMPLETE, http: 409, condition: "Finalize before period_end + RECONCILIATION_RUNOUT_DAYS" }
  - { id: ERR_YEAR_OUTSIDE_TERM, http: 409, condition: "Year window not contained in the contract term" }
  - { id: ERR_CLAIM_OUTSIDE_PERIOD, http: 409, condition: "Claim service_date outside [period_start, period_end)" }
  # --- constraint / uniqueness family (409) ---
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "New year half-open window intersects an existing year of the same contract (adjacency allowed)" }
  - { id: ERR_SPAN_OVERLAP, http: 409, condition: "New eligibility span shares at least one date with another span of the same member (closed intervals)" }
  - { id: ERR_DUPLICATE_TIN, http: 409, condition: "PracticeGroup tin already exists" }
  - { id: ERR_DUPLICATE_NPI, http: 409, condition: "Practice npi already exists" }
  - { id: ERR_DUPLICATE_MEMBER_REF, http: 409, condition: "member_ref already exists in the program" }
  - { id: ERR_DUPLICATE_CONTRACT_REF, http: 409, condition: "contract_ref already exists in the program" }
  - { id: ERR_DUPLICATE_YEAR_LABEL, http: 409, condition: "year_label already exists on the contract" }
  - { id: ERR_DUPLICATE_CLAIM_REF, http: 409, condition: "claim_ref already exists in the year" }
  - { id: ERR_DUPLICATE_RISK_SCORE, http: 409, condition: "Non-SUPERSEDED score already exists for (member, year, model_used)" }
  - { id: ERR_DUPLICATE_MEASURE_RESULT, http: 409, condition: "Non-EXCLUDED result already exists for (year, measure_code)" }
  - { id: ERR_UNKNOWN_MEASURE_CODE, http: 409, condition: "measure_code not in the contract's quality_measures catalog" }
  # --- referential family (409) ---
  - { id: ERR_PRACTICE_GROUP_MISMATCH, http: 409, condition: "Attribution record practice does not belong to the contract's group" }
  - { id: ERR_PRACTICE_INACTIVE, http: 409, condition: "Attribution record practice is INACTIVE" }
  - { id: ERR_MEMBER_PROGRAM_MISMATCH, http: 409, condition: "Attribution record member not in the contract's program" }
  - { id: ERR_MEMBER_DISENROLLED, http: 409, condition: "Attribution record member is DISENROLLED" }
  - { id: ERR_MEMBER_NO_ELIGIBLE_MONTHS, http: 409, condition: "Member has zero mid-month-eligible months in the year window" }
  # --- fiscal / math family (422) ---
  - { id: ERR_INVALID_RATE_CONFIG, http: 422, condition: "Non-positive benchmark, rates outside 0..10000, TWO_SIDED missing loss fields, floor >= excellence, malformed measure catalog" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "paid_amount_cents or claimed_adjustment_cents <= 0" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "start >= end on span/contract/year creation" }
  - { id: ERR_NUMERATOR_EXCEEDS_DENOMINATOR, http: 422, condition: "numerator_count > denominator_count" }
  - { id: ERR_EMPTY_DENOMINATOR, http: 422, condition: "Validate with denominator_count == 0" }
  - { id: ERR_EMPTY_POPULATION, http: 422, condition: "begin-reconciliation with total_member_months == 0" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PayerAdmin
    description: "Payer platform administrator: programs, groups, practices, members, eligibility spans, performance-year lifecycle, logical clock"
    identity: opaque
    exclusive_operations: ["program create/activate/archive", "practice-group create/suspend/reinstate/terminate", "practice create/deactivate", "member create/disenroll", "eligibility-span create/close", "performance-year create/open-attribution/lock-attribution/begin-measurement/begin-reconciliation/reopen-attribution", "POST /vbc/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: ContractManager
    description: "Owns contract lifecycle and renewal analyses"
    identity: opaque
    exclusive_operations: ["contract create/activate/expire/terminate/renew", "renewal-analysis create/complete"]
    shared_operations: ["all GET endpoints"]
  - name: AttributionAnalyst
    description: "Runs attribution: runs, records, exclusions"
    identity: opaque
    exclusive_operations: ["attribution-run create/compute/lock", "attribution-record create/exclude/reinstate"]
    shared_operations: ["all GET endpoints"]
  - name: ActuaryAnalyst
    description: "Owns risk scores and interim reporting with reserve accrual"
    identity: opaque
    exclusive_operations: ["risk-score create/finalize/supersede", "interim-report create/publish"]
    shared_operations: ["all GET endpoints"]
  - name: QualityAnalyst
    description: "Reports, validates, locks, and excludes quality measure results"
    identity: opaque
    exclusive_operations: ["quality-measure-result create/validate/return-for-correction/lock/exclude"]
    shared_operations: ["all GET endpoints"]
  - name: ClaimsProcessor
    description: "Ingests and maintains claim records"
    identity: opaque
    exclusive_operations: ["claim create/mark-paid/deny/void"]
    shared_operations: ["all GET endpoints"]
  - name: SettlementOfficer
    description: "Computes, finalizes, recalculates settlements; marks years settled; authorizes distribution"
    identity: opaque
    exclusive_operations: ["settlement create/finalize/recalculate/authorize-distribution", "performance-year mark-settled"]
    shared_operations: ["all GET endpoints"]
  - name: DisputeAdjudicator
    description: "Reviews and resolves settlement disputes; segregation of duties vs the settlement finalizer"
    identity: opaque
    exclusive_operations: ["dispute begin-review/resolve/expire"]
    shared_operations: ["all GET endpoints"]
  - name: PaymentOps
    description: "Executes distribution remittances"
    identity: opaque
    exclusive_operations: ["remittance approve/mark-paid/return/requeue"]
    shared_operations: ["all GET endpoints"]
  - name: Auditor
    description: "Independent read access; closes settled years"
    identity: opaque
    exclusive_operations: ["performance-year close"]
    shared_operations: ["all GET endpoints"]
  - name: PracticeGroupRep
    description: "Representative of a contracted PracticeGroup; X-User-ID equals the PracticeGroup id; files and withdraws disputes; reads only own group's resources"
    identity: entity_backed:PracticeGroup
    exclusive_operations: ["dispute create", "dispute withdraw"]
    shared_operations: ["all GET endpoints (scoped to own group)"]

