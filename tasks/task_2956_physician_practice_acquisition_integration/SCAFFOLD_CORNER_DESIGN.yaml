      - name: physician_with_unknown_acquisition_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - entities.Physician.fields.acquisition_id
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          Physician declares `parent: Acquisition` with acquisition_id as an
          FK -> Acquisition.id body field, so a create naming an unstored parent is
          refused with ERR_RESOURCE_NOT_FOUND (404) rather than an orphan row — the
          flat topology validates the reference in the body, not in the path.
        test_recipe:
          setup:
