            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - *c_h1
            - *c_clock_h1b
            - *c_h1_recv
            - *c_h1_grade
            - *c_h1_cert
            - *c_p1_get3
            - *c_clock_oct11
            - *c_hy
            - *c_clock_oct12
            - *c_hy_recv
            - *c_hy_grade
            - *c_hy_cert
            - *c_poolx
          trigger:
            - *c_closex
            - call: "GET /licensing/settlement-statements"
              payload: { pool_period_id: "${cx_pool}" }
              as: SettlementOfficer
            - call: "GET /licensing/harvest-lots/${h1_id}"
              payload: {}
              as: SettlementOfficer
          assert:
            - "close response PoolPeriod.${cx_pool}: status CLOSED, total_net_kg == 1150, total_weighted_kg == 1322.5, gross_pool_revenue_cents == 575000, marketing_fee_cents == 34500, net_pool_revenue_cents == 540500, provisional_pool_rate == 408.6957, pool_distributable_cents == 540500"
            - "GET /licensing/settlement-statements?pool_period_id returns exactly 1 row: G1's statement, status PROVISIONAL, provisional_net_cents == 540500, gross_cents/net_cents still null"
            - "HarvestLot.${h1_id}.pool_period_id == ${cx_pool} and lot_gross_provisional_cents == 540500; HarvestLot.${hy_id} untouched (null pool fields)"

      - name: harvest_lots_list_filters_combine
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/licensing/harvest-lots
        distinguishing_aspect: "The list endpoint combines filters: planting_id returns both lots of P1, grade=PREMIUM returns only H1, grade_status=SUBMITTED returns only the freshly graded second lot, lot_status=IN_TRANSIT returns none once both are received."
        test_recipe:
          setup: ["Canonical chain: H1 certified PREMIUM; second lot HX received and graded STANDARD but not certified."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - *c_h1
            - *c_clock_h1b
            - *c_h1_recv
            - *c_h1_grade
            - *c_h1_cert
            - *c_p1_get3
            - *c_clock_oct11
            - *c_hy
            - *c_clock_oct12
            - *c_hy_recv
            - *c_hy_grade
          trigger:
            - call: "GET /licensing/harvest-lots"
              payload: { planting_id: "${p1_id}" }
              as: QualityGrader
            - call: "GET /licensing/harvest-lots"
              payload: { grade: "PREMIUM" }
              as: QualityGrader
            - call: "GET /licensing/harvest-lots"
              payload: { grade_status: "SUBMITTED" }
              as: QualityGrader
            - call: "GET /licensing/harvest-lots"
              payload: { lot_status: "IN_TRANSIT" }
              as: QualityGrader
          assert:
            - "planting_id filter: 2 rows (${h1_id} and ${hy_id})"
            - "grade=PREMIUM: exactly 1 row (${h1_id}); grade=STANDARD would return ${hy_id}"
            - "grade_status=SUBMITTED: exactly 1 row (${hy_id}); grade_status=CERTIFIED would return ${h1_id}"
            - "lot_status=IN_TRANSIT: 0 rows, total_count 0"

  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_sweep_all_entities
        claim_type: Violation -> Error
        grounds:
          - validations[priority=4]
          - errors.ERR_VARIETY_NOT_FOUND
          - errors.ERR_GROWER_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_PLANT_LOT_NOT_FOUND
          - errors.ERR_PLANTING_NOT_FOUND
          - errors.ERR_HARVEST_LOT_NOT_FOUND
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Every path-id resource 404s with its entity-specific code (six specific codes), while harvest windows, pool periods, statements, and recall orders share the generic ERR_NOT_FOUND."
        test_recipe:
          setup: ["Logical clock pinned; empty database."]
          setup_api_calls:
