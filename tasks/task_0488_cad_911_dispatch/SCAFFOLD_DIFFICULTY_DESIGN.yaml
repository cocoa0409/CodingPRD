            - call: "PATCH /assignments/${asgA_id}/status"
              payload: { status: "ENROUTE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
            - call: "POST /incidents"
              payload: { ani: "5125550121", ali_grid_x: 36, ali_grid_y: 35, incident_type: "ASSAULT_IN_PROGRESS" }
