          Triggered by POST /collection-sweeps — a different triggering transition from instance
          one's arbitration award — the chain is four links deep and each link causes the next:
          installments 1 and 2 become DELINQUENT -> because two installments are delinquent the
          schedule's consecutive_delinquent_count reaches 2 and it becomes DEFAULT_ELIGIBLE ->
          because the schedule became DEFAULT_ELIGIBLE the assessment's collection_status becomes
