  - rule_id: resource_temporal_overlap
    instances:
      - name: notice_window_half_open_adjacency
        grounds:
          - validations[priority=11]
          - state_machines.Notice.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Resource Notice(scope) with HALF-OPEN interval semantics: windows sharing a
          boundary instant ([.., 2027-01-01) and [2027-01-01, ..)) do NOT overlap and
          both publish; a strictly overlapping window without a declared supersede
          target is rejected.
        test_recipe:
          setup: ["empty notice table"]
          setup_api_calls:
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "n1", body: "b", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n1: $.data.id }
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "n2", body: "b", effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n2: $.data.id }
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "n3", body: "b", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n3: $.data.id }
          trigger:
            - call: "POST /privacy/notices/${n1}/publish"
              payload: {}
              as: PrivacyAdmin
              captures: { n1_st: $.data.status }
            - call: "POST /privacy/notices/${n2}/publish"
              payload: {}
              as: PrivacyAdmin
              captures: { n2_st: $.data.status }
            - call: "POST /privacy/notices/${n3}/publish"
              payload: {}
              as: PrivacyAdmin
              captures: { err: $.data.error_id }
            - call: "GET /privacy/notices/${n3}"
              payload: {}
              as: PrivacyAdmin
              captures: { n3_st: $.data.status }
          assert:
            - "n1 publish -> PUBLISHED"
            - "n2 publish -> PUBLISHED (adjacency at 2027-01-01T00:00:00Z is not overlap under half-open semantics)"
            - "n3 publish -> error_id ERR_NOTICE_WINDOW_OVERLAP (overlaps n1: [2026-06-01, 2026-09-01) inside [2026-01-01, 2027-01-01))"
            - "n3 remains DRAFT"

