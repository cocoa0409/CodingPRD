            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T06:00:00Z", shift_end_utc: "2026-02-01T22:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Stat Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY", priority: "STAT" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt1: $.data.id }
            - call: "POST /appointments/${appt1}/kit"
              payload: { kit_lot_number: "LOT1", tube_count: 3 }
              as: Dispatcher
            - call: "POST /appointments/${appt1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt1}/arrive"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /appointments/${appt1}/specimens"
              payload: { tube_label: "T1" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { a1s1: $.data.id }
            - call: "POST /appointments/${appt1}/specimens"
              payload: { tube_label: "T2" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { a1s2: $.data.id }
            - call: "POST /appointments/${appt1}/specimens"
              payload: { tube_label: "T3" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { a1s3: $.data.id }
            - call: "POST /appointments/${appt1}/complete-draw"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests"
              payload: { lab_partner_id: "${partner_id}", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { man1: $.data.id }
            - call: "POST /courier-manifests/${man1}/add-specimen"
              payload: { specimen_id: "${a1s1}" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests/${man1}/pickup"
              payload: {}
              as: Dispatcher
            - call: "POST /specimens/${a1s1}/reject-qns"
              payload: {}
              as: LabOps
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: Dispatcher
              captures: { rd_v_after: $.data.version }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T11:00:00Z", window_end_utc: "2026-02-01T11:30:00Z", expected_route_day_version: "${rd_v_after}" }
              as: Dispatcher
              captures: { appt2: $.data.id }
            - call: "POST /appointments/${appt2}/kit"
              payload: { kit_lot_number: "LOT2", tube_count: 3 }
              as: Dispatcher
            - call: "POST /appointments/${appt2}/dispatch"
