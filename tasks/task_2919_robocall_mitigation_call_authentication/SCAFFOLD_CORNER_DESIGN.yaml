  - section: complexity_layers
    instances:
      - name: plan_filing_on_a_stale_provider_version_is_rejected_then_accepted
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-file-stale-provider]"
          - "validations[priority=10]"
          - "errors[ERR_STALE_PROVIDER_VERSION]"
        distinguishing_aspect: "The guard is on the Provider's version, not on the plan: a sweep that only touched provider counters is enough to invalidate a filing built on the earlier view, and the identical body carrying the refreshed version is accepted - so the 412 cannot be reduced to any plan-state precondition."
        test_recipe:
          setup:
            - "One provider whose version has advanced once through a compliance sweep after the client read it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Stale Filing Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id, prov_v0: $.data.version }
            - call: "POST /rmd/compliance-sweeps"
              payload: { provider_id: "${prov_id}" }
              as: Regulator
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v1: $.data.version }
          trigger:
            - call: "POST /rmd/mitigation-plans"
              payload: { provider_id: "${prov_id}", prevention_practices: ["KYC_ONBOARDING", "TRACEBACK_COOPERATION", "TRAFFIC_PATTERN_MONITORING"], expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              expect: { status: 412, error_id: ERR_STALE_PROVIDER_VERSION }
            - call: "POST /rmd/mitigation-plans"
              payload: { provider_id: "${prov_id}", prevention_practices: ["KYC_ONBOARDING", "TRACEBACK_COOPERATION", "TRAFFIC_PATTERN_MONITORING"], expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }
          assert:
            - "The sweep raised Provider.${prov_id}.sweep_index to 1, so ${prov_v1} is strictly greater than ${prov_v0}"
            - "The first filing is 412 with data.error_id == ERR_STALE_PROVIDER_VERSION and GET /rmd/mitigation-plans?provider_id=${prov_id} returns total_count == 0"
            - "The retry with the refreshed version is 201 with data.filing_state == DRAFT, data.revision_count == 0 and data.deficiency_count == 0"
            - "Provider.${prov_id}.rmd_filing_status is still UNFILED (a DRAFT plan is not a filing) and auth_posture == SIGNING_SUSPENDED"

      - name: report_generation_on_a_stale_provider_version_is_rejected_then_accepted
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[report-generate-stale-provider]"
          - "validations[priority=10]"
          - "errors[ERR_STALE_PROVIDER_VERSION]"
        distinguishing_aspect: "Report generation carries the same provider-version guard as plan filing but on a different endpoint, and the guard is checked at priority 10 - before the period-elapsed rule at priority 30 - so a request that is both stale and premature reports the 412 first."
        test_recipe:
          setup:
            - "One provider whose version has advanced once through a compliance sweep after the client read it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Stale Report Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id, prov_v0: $.data.version }
            - call: "POST /rmd/compliance-sweeps"
              payload: { provider_id: "${prov_id}" }
              as: Regulator
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v1: $.data.version }
          trigger:
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", variant: "PROVISIONAL", expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              expect: { status: 412, error_id: ERR_STALE_PROVIDER_VERSION }
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", variant: "PROVISIONAL", expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { report_id: $.data.id }
          assert:
            - "The first generation is 412 with data.error_id == ERR_STALE_PROVIDER_VERSION even though its period_end 2026-12-01T00:00:00Z is also in the future - priority 10 beats priority 30"
            - "GET /rmd/effectiveness-reports?provider_id=${prov_id} returns total_count == 0 after the refusal"
            - "The retry with the refreshed version and an elapsed period is 201 with data.state == GENERATED and data.variant == PROVISIONAL"
            - "EffectivenessReport.${report_id}.signed_off_at == null and filed_at == null"

      - name: mitigation_by_termination_cascades_from_notice_to_provider_counters
        claim_type: cascading_side_effects
        grounds:
          - state_machines.IllegalTrafficNotice.UNDER_INVESTIGATION_to_MITIGATED
          - state_machines.Customer.origination_state.ENABLED_to_TERMINATED
          - state_machines.NumberAssignment.ACTIVE_to_REVOKED
          - calculations.provider_assignment_and_blocking_metrics
        distinguishing_aspect: "A single mitigate call with mitigation_action CUSTOMER_TERMINATED walks four hops in one request - notice to MITIGATED, customer to TERMINATED, both assignments to REVOKED, provider counters recomputed - and unlike the expiry path it assesses no penalty points, so the chain is observable independently of enforcement."
        test_recipe:
          setup:
