  - rule_id: cross_entity_state_dependency
    instances:
      - name: housing_assignment_requires_signed_spring_training_agreement
        grounds:
          - validations.priority_18_ERR_AGREEMENT_NOT_SIGNED
          - state_machines.FacilityAgreement
          - entities.FacilityAgreement.fields.usage_type
          - calculations.housing_bed_night_capacity
        distinguishing_aspect: |
          The legality of writing a HousingAssignment depends on TWO attributes of a
          different entity at once — the FacilityAgreement's state (must be SIGNED,
          so DRAFT and SUBMITTED both fail) and its usage_type (must be
          SPRING_TRAINING, so a perfectly SIGNED TOUR_REHEARSAL agreement still
          fails). The candidate member and payload are identical in all four
          attempts, so nothing about the child explains the outcome.
        test_recipe:
          setup:
            - "A 2027 season with one CONTRACTED member holding an EXECUTED contract."
            - "One host school carries three agreements: A is a DRAFT SPRING_TRAINING agreement, B is a SIGNED TOUR_REHEARSAL agreement, C is a SIGNED SPRING_TRAINING agreement at 450 cents/bed-night with a 0-bed minimum, all covering 2027-05-10 to 2027-06-05."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 91.5 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_id}", tuition_amount_cents: 399900, payment_plan_type: "STANDARD_3" }
              as: MembershipCoordinator
              captures: { contract_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "POST /host-schools"
              payload: { name: "Rockford High School", city: "Rockford", state_code: "IL", sleeping_space_count: 30, capacity_per_space: 12, rehearsal_field_count: 2, has_air_conditioning: true }
              as: TourManager
              captures: { school_id: "$.data.id" }
            - call: "POST /facility-agreements"
              payload: { host_school_id: "${school_id}", season_id: "${season_id}", usage_type: "SPRING_TRAINING", start_date: "2027-05-10", end_date: "2027-06-05", nightly_rate_cents: 450, minimum_billable_beds: 0 }
              as: TourManager
              captures: { agreement_draft_id: "$.data.id", agreement_draft_version: "$.data.version" }
            - call: "POST /facility-agreements"
              payload: { host_school_id: "${school_id}", season_id: "${season_id}", usage_type: "TOUR_REHEARSAL", start_date: "2027-05-10", end_date: "2027-06-05", nightly_rate_cents: 400, minimum_billable_beds: 0 }
              as: TourManager
              captures: { agreement_rehearsal_id: "$.data.id" }
            - call: "POST /facility-agreements/${agreement_rehearsal_id}/submit"
              payload: {}
              as: TourManager
            - call: "POST /facility-agreements/${agreement_rehearsal_id}/sign"
              payload: {}
              as: CorpsDirector
            - call: "GET /facility-agreements/${agreement_rehearsal_id}"
              as: MembershipCoordinator
              captures: { agreement_rehearsal_version: "$.data.version" }
            - call: "POST /facility-agreements"
              payload: { host_school_id: "${school_id}", season_id: "${season_id}", usage_type: "SPRING_TRAINING", start_date: "2027-05-10", end_date: "2027-06-05", nightly_rate_cents: 450, minimum_billable_beds: 0 }
              as: TourManager
              captures: { agreement_signed_id: "$.data.id" }
            - call: "POST /facility-agreements/${agreement_signed_id}/submit"
              payload: {}
              as: TourManager
            - call: "POST /facility-agreements/${agreement_signed_id}/sign"
              payload: {}
              as: CorpsDirector
            - call: "GET /facility-agreements/${agreement_signed_id}"
              as: MembershipCoordinator
              captures: { agreement_signed_version: "$.data.version" }
          trigger:
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_draft_id}", member_id: "${member_id}", space_index: 1, check_in_date: "2027-05-10", check_out_date: "2027-05-20", expected_facility_agreement_version: "${agreement_draft_version}" }
              as: MembershipCoordinator
            - call: "POST /facility-agreements/${agreement_draft_id}/submit"
              payload: {}
              as: TourManager
            - call: "GET /facility-agreements/${agreement_draft_id}"
              as: MembershipCoordinator
              captures: { agreement_submitted_version: "$.data.version" }
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_draft_id}", member_id: "${member_id}", space_index: 1, check_in_date: "2027-05-10", check_out_date: "2027-05-20", expected_facility_agreement_version: "${agreement_submitted_version}" }
              as: MembershipCoordinator
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_rehearsal_id}", member_id: "${member_id}", space_index: 1, check_in_date: "2027-05-10", check_out_date: "2027-05-20", expected_facility_agreement_version: "${agreement_rehearsal_version}" }
              as: MembershipCoordinator
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_signed_id}", member_id: "${member_id}", space_index: 1, check_in_date: "2027-05-10", check_out_date: "2027-05-20", expected_facility_agreement_version: "${agreement_signed_version}" }
              as: MembershipCoordinator
              captures: { housing_id: "$.data.id" }
          assert:
            - "the assignment against the DRAFT agreement returns 409 ERR_AGREEMENT_NOT_SIGNED"
            - "the assignment against the same agreement once it is SUBMITTED still returns 409 ERR_AGREEMENT_NOT_SIGNED — submission is not signature"
            - "the assignment against the SIGNED TOUR_REHEARSAL agreement returns 409 ERR_AGREEMENT_NOT_SIGNED because usage_type must be SPRING_TRAINING, even though the state is right"
            - "the assignment against the SIGNED SPRING_TRAINING agreement returns 201: HousingAssignment.${housing_id}.status == ACTIVE, nights == 10, occupant_is_minor == false"
            - "FacilityAgreement.${agreement_signed_id}.occupied_bed_nights == 10 and billable_bed_nights == 10 and billable_cents == 4500"
            - "FacilityAgreement.${agreement_rehearsal_id}.occupied_bed_nights == 0 and billable_cents == 0 (the refused attempt left it untouched)"
            - "HostSchool.${school_id}.reserved_bed_nights == 10 and Season.${season_id}.housing_cost_cents == 4500 (the SIGNED TOUR_REHEARSAL agreement bills 0 bed-nights on a 0-bed minimum)"

      - name: stop_confirmation_depends_on_member_volunteer_and_assignment_states
        grounds:
          - validations.priority_32_ERR_CHAPERONE_COVERAGE_INSUFFICIENT
          - validations.priority_36_ERR_SCREENING_NOT_CLEARED
          - state_machines.StaffAssignment
          - entities.TourStop.fields.required_chaperone_count
          - calculations.stop_meal_cost
        distinguishing_aspect: |
          A three-entity dependency chain rather than the two-attribute agreement
          gate: whether a TourStop may confirm depends on Member states (only
          ON_TOUR members with is_minor true raise required_chaperone_count), on
          Volunteer screening state (an ACCEPTED shift cannot be APPROVED while
          screening is PENDING) and on StaffAssignment state (ACCEPTED is not
          APPROVED). Each blocking entity is a different type, and fixing the
          Volunteer's state is what finally unblocks the stop.
