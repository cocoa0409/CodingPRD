              as: CourtRegistrar
              captures: { e_revoke_twice: $.data.error_id }
          assert:
            - "${grant_status_before} == ACTIVE and ${grant_basis} == STATUTORY_DEFAULT"
            - "${disclosed_before} == 1 and ${phase_before} == DISCLOSURE"
            - "${grant_status_after} == REVOKED and ${grant_reason} == REGISTRAR_ORDER"
            - "${a1_access_after} == ACCESS_REVOKED and ${a1_clamp_after} == NONE"
            - "${disclosed_after} == 0 and ${phase_after} == AUTHORIZED"
            - "Estate.${est_id}.inventory_total_count == 1 and assets_pending_disposition_count == 1 and assets_disposed_count == 0"
            - "DigitalAsset.${a1_id}.disclosed_at is NOT cleared by the revocation (only access_status changes)"
            - "${e_revoke_twice} == ERR_INVALID_GRANT_STATE with HTTP 409"
            - "PlatformRequest.${req_id}.status is still APPROVED (revoking the grant does not rewind the request)"

      - name: grant_expiry_sweep_fires_at_the_inclusive_boundary_and_repeats_as_zero
        claim_type: Idempotency
        grounds:
          - state_machines.AuthorityGrant.transitions[ACTIVE->EXPIRED]
          - entities.AuthorityGrant.fields.expires_at
          - entities.SubscriptionTerm.fields.state
        distinguishing_aspect: |
          A grant approved at 2026-08-01T00:00:00Z expires_at 2026-10-30T00:00:00Z: a sweep at
          2026-10-29 reports expired_grant_count 0 while already lapsing the out-of-term
          non-renewing subscription term, the sweep at exactly 2026-10-30 reports 1 grant and 2
          revoked assets because the boundary is inclusive, and an immediately repeated sweep
          reports every count as 0.
