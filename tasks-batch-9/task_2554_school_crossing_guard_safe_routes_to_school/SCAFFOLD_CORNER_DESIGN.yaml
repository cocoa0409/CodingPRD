            - "AbsenceReport.${abs_id}.dispatch_attempt_count == 1 and dispatch_offers has length 1 with offer_status OPEN"
            - "AbsenceReport.${abs_id}.current_offer_expires_at == 2026-09-16T01:45:00Z"
            - "Guard.${g_nia_id}.reliability_score_season_to_date == 100.00 and Guard.${g_sam_id}.reliability_score_season_to_date == 100.00 — the tie on key 1 is real, so key 2 decided the offer"

      - name: corner_route_hazard_precision_stub
        claim_type: precision
        grounds:
          - calculations.route_hazard_score.precision
        excluded_because:
          difficulty_instance: route_hazard_rounds_per_segment_before_summing
          rationale: |
            Per-segment rounding before summation (7.08 rather than the sum-then-round
            7.09) is the entire subject of the §1.8 combinatorial formula instance, which
            asserts the two-decimal contribution of every segment individually.

      - name: corner_warrant_variant_divergence_stub
        claim_type: variant_divergence
        grounds:
          - calculations.warrant_score.variants
        excluded_because:
          difficulty_instance: warrant_score_gap_adequacy_vs_exposure_index_divergence
          rationale: |
            The §1.8 dual-variant instance already runs the identical count and crash
            fixture through both GAP_ADEQUACY and EXPOSURE_INDEX, asserts the two distinct
            scores and their delta, and asserts that scoring_variant is pinned from
            intersection.control_type at analyze time.

      - name: corner_warrant_threshold_boundary_stub
        claim_type: threshold
        grounds:
          - calculations.warrant_determination.constants.WARRANT_THRESHOLD
        excluded_because:
          difficulty_instance: warrant_score_exactly_at_threshold_is_warranted
          rationale: |
            Threshold-1 / threshold / threshold+1 behaviour at 60.00 is asserted by the
            §1.8 boundary instance, which pairs a 60.00 score against a 59.00 score with
            zero pedestrian crashes to separate WARRANTED from NOT_WARRANTED.

      - name: corner_substitute_cost_tier_boundary_stub
        claim_type: tiered_pricing
        grounds:
          - calculations.substitute_cost.constants.FEE_TIER_THRESHOLD_CENTS
        excluded_because:
          difficulty_instance: substitute_cost_fee_tier_keyed_on_subtotal_not_total
          rationale: |
            The §1.8 combinatorial instance asserts the pinned nine-step order and proves
            the fee tier is keyed on the step-6 subtotal rather than the attempt-penalized
            total, which is the only tier-boundary claim this calculation supports.

      - name: corner_grant_waterfall_stub
        claim_type: waterfall_allocation
        grounds:
          - calculations.grant_funding_selector
        excluded_because:
          difficulty_instance: fund_award_fans_out_to_grant_balance_sibling_deferral_and_complaint_resolution
          rationale: |
            First-bucket-fills-before-second, the exact-zero remainder and the resulting
            sibling deferral are asserted end-to-end by the §1.8 transitive cascade
            instance.

      - name: corner_project_weighted_scoring_stub
        claim_type: weighted_scoring
        grounds:
          - calculations.project_benefit_cost_score
        excluded_because:
          difficulty_instance: project_score_nested_caps_and_cost_factor_floor
          rationale: |
            Weight application, the three nested caps and the cost_factor floor at 1.00
            are asserted by the §1.8 combinatorial formula instance with pre-computed
            literals for every term.

      - name: corner_coverage_constraint_propagation_stub
        claim_type: constraint_propagation
        grounds:
          - calculations.school_coverage_posture
        excluded_because:
          difficulty_instance: post_coverage_partition_conserved_across_absence_and_rescind
          rationale: |
            Propagation of a single coverage change through post, school counters and route
            status until it reaches a fixed point is asserted by the §1.8 compensating
            invariant instance, which checks the partition identity at every step.

      - name: corner_reliability_decay_stub
        claim_type: decay_function
        grounds:
          - calculations.guard_reliability_score
        excluded_because:
          difficulty_instance: guard_reliability_rolling_vs_season_divergence
          rationale: |
            The rolling-window decay, its differing per-absence weights and the reset
            effect of the clock aging absences out of the 90-day window are asserted by
            the §1.8 dual-variant instance.

  - section: validations
    instances:
      - name: corner_absence_on_declared_non_school_day_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_58.ERR_ABSENCE_ON_NON_SCHOOL_DAY
          - entities.School.fields.no_school_dates
        distinguishing_aspect: |
          The no_school_dates array is consulted through assignment -> post ->
          intersection -> school, not from the request. An absence filed for the
          Thanksgiving holiday 2026-11-26 — a date squarely INSIDE the assignment's
          2026-11-23 -> 2026-11-27 window — is rejected with
          ERR_ABSENCE_ON_NON_SCHOOL_DAY (422) and opens no coverage gap, while the
          adjacent 2026-11-25 duty day is accepted. Neither the post nor the school
          counters may move on the rejected call.
        test_recipe:
          setup:
            - "School with no_school_dates [\"2026-11-26\"]; WARRANTED intersection with one ACTIVE AM post; Rita assigned 2026-11-23 -> 2026-11-27 (SCHEDULED at the default clock)."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50, no_school_dates: ["2026-11-26"] }
