      - name: invalid_audit_period_end_before_start_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_INVALID_AUDIT_PERIOD]"
        distinguishing_aspect: "audit_period_end < audit_period_start returns ERR_INVALID_AUDIT_PERIOD."
