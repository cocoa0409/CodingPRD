  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: emergency_access_grade_five_input_boundary_interaction
        grounds:
          - "calculations.emergency_access_grade_evaluation"
          - "entities.RoadSegment.fields.required_turnouts"
          - "entities.RoadSegment.fields.emergency_access_grade"
          - "endpoints[POST /road-segments/{segment_id}/access-inspections]"
        distinguishing_aspect: >
          Mode (a): five measured inputs — width, grade, turnaround, turnout
          count and bridge rating — must be combined, and four of the five are
          inclusive boundaries that flip the grade on their own. A 2400-ft
          segment needs max(0, ceil(2400 / 800) - 1) = 2 turnouts, so an
          inspection of exactly 20.0 ft wide, exactly 12.0% grade, turnaround
          present and 2 turnouts is COMPLIANT; changing any single measurement
          by the smallest step (19.9 ft, 12.1%, 1 turnout, turnaround absent)
          makes it DEFICIENT. The ceil() term is itself non-linear: 2401 ft
          demands 3 turnouts, so the same 2 turnouts that pass on 2400 ft fail
          on 2401 ft. The bridge clause is a conditional that disappears
          entirely when bridge_present is false, so a 39-ton rating only matters
          on the bridged segment.
        test_recipe:
          setup: |
            Register one association and three segments that differ only where
            the formula is non-linear: SEG_A 2400 ft with no bridge (2 turnouts
            required), SEG_B 1600 ft with a bridge posted at 39 tons (1 turnout
            required), SEG_C 2401 ft with no bridge (3 turnouts required). All
            three start at emergency_access_grade UNKNOWN with
            last_inspection_at null.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RoadCommissioner
            - call: "POST /associations"
              payload: { name: "Three Grades Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Segment A 2400", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_a: "$.data.id", seg_a_required: "$.data.required_turnouts" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Segment B 1600 bridged", length_feet: 1600, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: true, bridge_load_rating_tons: 39, culvert_count: 1 }
              as: RoadCommissioner
              captures: { seg_b: "$.data.id", seg_b_required: "$.data.required_turnouts" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Segment C 2401", length_feet: 2401, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              captures: { seg_c: "$.data.id", seg_c_required: "$.data.required_turnouts" }
          trigger:
            - call: "POST /road-segments/${seg_a}/access-inspections"
              payload: { inspected_at: "2026-10-02T00:00:00Z", measured_width_feet: 20, measured_max_grade_pct: 12, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /road-segments/${seg_a}/access-inspections"
              payload: { inspected_at: "2026-10-03T00:00:00Z", measured_width_feet: 19.9, measured_max_grade_pct: 12, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /road-segments/${seg_a}/access-inspections"
              payload: { inspected_at: "2026-10-04T00:00:00Z", measured_width_feet: 20, measured_max_grade_pct: 12.1, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /road-segments/${seg_a}/access-inspections"
              payload: { inspected_at: "2026-10-05T00:00:00Z", measured_width_feet: 20, measured_max_grade_pct: 12, measured_turnout_count: 1, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /road-segments/${seg_a}/access-inspections"
              payload: { inspected_at: "2026-10-06T00:00:00Z", measured_width_feet: 20, measured_max_grade_pct: 12, measured_turnout_count: 2, turnaround_present: false }
              as: RoadCommissioner
            - call: "POST /road-segments/${seg_b}/access-inspections"
              payload: { inspected_at: "2026-10-07T00:00:00Z", measured_width_feet: 20, measured_max_grade_pct: 12, measured_turnout_count: 1, turnaround_present: true, measured_bridge_load_rating_tons: 39 }
              as: RoadCommissioner
            - call: "POST /road-segments/${seg_b}/access-inspections"
              payload: { inspected_at: "2026-10-08T00:00:00Z", measured_width_feet: 20, measured_max_grade_pct: 12, measured_turnout_count: 1, turnaround_present: true, measured_bridge_load_rating_tons: 40 }
              as: RoadCommissioner
            - call: "POST /road-segments/${seg_c}/access-inspections"
              payload: { inspected_at: "2026-10-09T00:00:00Z", measured_width_feet: 20, measured_max_grade_pct: 12, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
          assert:
            - "on creation required_turnouts is 2 for SEG_A (2400 ft), 1 for SEG_B (1600 ft) and 3 for SEG_C (2401 ft), and all three read emergency_access_grade UNKNOWN"
            - "SEG_A inspection 1 (20.0 ft, 12.0%, 2 turnouts, turnaround) returns emergency_access_grade == COMPLIANT: both boundaries are inclusive"
            - "SEG_A inspection 2 (19.9 ft) returns DEFICIENT — width is the only changed input"
            - "SEG_A inspection 3 (12.1%) returns DEFICIENT — grade is the only changed input"
            - "SEG_A inspection 4 (1 turnout) returns DEFICIENT even though width and grade still sit on their passing boundaries"
            - "SEG_A inspection 5 (turnaround absent) returns DEFICIENT with width, grade and turnouts all passing"
            - "each SEG_A inspection overwrites width_feet, max_grade_pct, turnout_count and turnaround_present and stamps last_inspection_at with the payload's inspected_at, and required_turnouts stays 2 throughout"
            - "SEG_B at 39 tons returns DEFICIENT and at 40 tons returns COMPLIANT with every other measurement identical, so the bridge clause is inclusive at MIN_BRIDGE_RATING_TONS"
            - "SEG_C returns DEFICIENT on the same 20.0 ft / 12.0% / 2-turnout measurements that made SEG_A COMPLIANT, because one extra foot of length raises ceil(2401 / 800) - 1 from 2 to 3"

      - name: connection_fee_round_per_component_versus_sum_then_round
        grounds:
          - "calculations.connection_fee"
          - "entities.ConnectionRequest.fields.connection_fee_cents"
          - "entities.ConnectionRequest.fields.reserve_buyin_cents"
          - "state_machines.ConnectionRequest.SUBMITTED_to_APPROVED"
        distinguishing_aspect: >
          Mode (b): the fee is the sum of four components, two of which land on
          an exact half cent, so the pinned order (round each component with
          round_half_up, then add) gives 250000 + 257813 + 146066 + 39286 =
          693165, whereas summing the exact components first
          (250000 + 257812.5 + 146065.5 + 39285.714…) and rounding once gives
          693164. The one-cent gap is the whole test. The reserve component is
          also a nested proportion: 0.35 * (1000000 - 600000) * 137.5 / 490,
          where 490 is the association's remaining ACTIVE covenant-recorded
          frontage units after the parent parcel left the assessable set — an
          implementation that leaves the SUBDIVIDED parent (240 units) or the
          connecting lot itself in the denominator computes a different fee.
        test_recipe:
          setup: |
            Build FULL_3 and levy the FY2027 roll (reserve 600000, deficit
            400000 against the 1000000 target). Pay P2's annual charge of
            1315068 in full so the parcel carries no OPEN charge, then subdivide
            P2's 400 ft into two lots of 137.5 ft and 262.5 ft; the response's
            children array is in request order, so the 137.5-ft lot is
            children[0]. File a connection request on that lot for
            RESIDENTIAL_YEAR_ROUND use at 3.5 trips per day with the easement
            recorded. At this point the only ACTIVE covenant-recorded parcels
            are P1 (290 units) and P3 (200 units), so U_now is 490.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /road-segments/${seg_id}/access-inspections"
              payload: { inspected_at: "2026-10-01T00:00:00Z", measured_width_feet: 22, measured_max_grade_pct: 9, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P42", frontage_feet: 400, usage_class: "SEASONAL", trips_per_day: 3, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p2_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P43", frontage_feet: 250, usage_class: "AGRICULTURAL", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p3_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${p2_id}", owner_name: "Boone Falk", deed_book_page: "DB120-P42", deed_recorded_date: "2020-06-30" }
              as: AssociationSecretary
              captures: { m2_id: "$.data.id" }
            - call: "POST /members/${m2_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P42" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${p3_id}", owner_name: "Cyra Nolde", deed_book_page: "DB120-P43", deed_recorded_date: "2018-02-08" }
              as: AssociationSecretary
              captures: { m3_id: "$.data.id" }
            - call: "POST /members/${m3_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P43" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "GET /assessment-charges?roll_id=${roll_id}&parcel_id=${p2_id}"
              payload: {}
              as: AssessmentClerk
              captures: { charge2_id: "$.data[0].id", charge2_amount: "$.data[0].amount_cents" }
            - call: "POST /assessment-charges/${charge2_id}/payments"
              payload: { amount_cents: 1315068 }
              as: MemberOwner
              as_user_id: "${m2_id}"
            - call: "POST /parcels/${p2_id}/subdivide"
              payload: { children: [ { deed_book_page: "DB120-P42A", frontage_feet: 137.5 }, { deed_book_page: "DB120-P42B", frontage_feet: 262.5 } ] }
              as: AssociationSecretary
              captures: { lot_a_id: "$.data.children[0].id", lot_b_id: "$.data.children[1].id" }
            - call: "POST /connection-requests"
              payload: { parcel_id: "${lot_a_id}", requested_usage_class: "RESIDENTIAL_YEAR_ROUND", requested_trips_per_day: 3.5, easement_grant_recorded: true }
              as: AssociationSecretary
              captures: { req_id: "$.data.id" }
          trigger:
            - call: "POST /connection-requests/${req_id}/decide"
              payload: { outcome: "APPROVED" }
              as: AssociationSecretary
            - call: "GET /parcels/${lot_a_id}"
              payload: {}
              as: AssociationSecretary
            - call: "GET /associations/${assoc_id}"
              payload: {}
              as: AssociationSecretary
            - call: "GET /assessment-charges?parcel_id=${lot_a_id}"
              payload: {}
              as: AssessmentClerk
          assert:
            - "the approved request has connection_fee_cents == 693165, which is the round-each-component-then-add answer"
            - "connection_fee_cents is NOT 693164, the value produced by adding 250000 + 257812.5 + 146065.5 + 39285.714… and rounding once"
            - "reserve_buyin_cents == 39286 == round_half_up(0.35 * 400000 * 137.5 / 490), so the denominator is the post-subdivision 490 units, not 730 and not 627.5"
            - "the frontage component is 257813 == round_half_up(137.5 * 1875) and the trip component is 146066 == round_half_up(3.5 * 41733); both were exact half cents rounded up"
            - "the lot's parcel is now ACTIVE with covenant_recorded == true, usage_class RESIDENTIAL_YEAR_ROUND, trips_per_day 3.5, frontage_share_units 137.5 and trip_share_units 115 (3.5 * 25 + 137.5 * 0.20)"
            - "the association reads reserve_balance_cents == 639286 and reserve_posture == ADEQUATE"
            - "a CONNECTION_FEE charge exists with amount_cents == 693165, status OPEN, due_date 2026-11-15, roll_id equal to the levied FY2027 roll and member_id equal to the parent parcel's member"

      - name: assessment_cap_clamp_bounds_single_redistribution_pass
        grounds:
          - "calculations.annual_assessment_allocation"
          - "entities.AssessmentRoll.fields.total_share_units"
          - "entities.AssessmentRoll.fields.unallocated_residual_cents"
          - "state_machines.AssessmentRoll.DRAFT_to_CERTIFIED"
        distinguishing_aspect: >
          Mode (c): operation order decides the answer. With units
          2000 / 900 / 50 / 50 (U = 3000) against a 1000000-cent budget, the cap
          floor(0.40 * 1000000) = 400000 clamps Q1 down from 666666.67 and the
          50000 floor clamps Q3 and Q4 up from 16666.67, leaving Q2 as the only
          unclamped parcel with a residual of 200000 to absorb. Q2's want is the
          whole 200000, but the redistribution is itself bounded by
          min(want, CAP - cl) = min(200000, 100000), so Q2 lands on exactly
          400000 and 100000 of the budget stays unallocated. Three wrong orders
          are distinguishable: an unbounded redistribution gives Q2 500000 and
          residual 0; a second clamping round would try to re-spread the
          leftover 100000 (there is exactly ONE pass, so it does not); and
          spreading the residual over all four parcels instead of the unclamped
          set breaks both clamps at once.
        test_recipe:
          setup: |
            Register one association and one segment, then enroll four parcels
            whose FRONTAGE_WEIGHTED share units are 2000 (2000 ft
            RESIDENTIAL_YEAR_ROUND), 900 (900 ft RESIDENTIAL_YEAR_ROUND) and
            50 each (200 ft UNDEVELOPED, multiplier 0.25). Verify a member on
            each parcel so the roll can certify, and open an FY2027 roll for
            1000000 cents under FRONTAGE_WEIGHTED.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Clamp Creek Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Clamp Creek Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB410-P01", frontage_feet: 2000, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 8, covenant_recorded: true }
              as: AssociationSecretary
              captures: { q1_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB410-P02", frontage_feet: 900, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 4, covenant_recorded: true }
              as: AssociationSecretary
              captures: { q2_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB410-P03", frontage_feet: 200, usage_class: "UNDEVELOPED", trips_per_day: 0, covenant_recorded: true }
              as: AssociationSecretary
              captures: { q3_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB410-P04", frontage_feet: 200, usage_class: "UNDEVELOPED", trips_per_day: 0, covenant_recorded: true }
              as: AssociationSecretary
              captures: { q4_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${q1_id}", owner_name: "Faye Oduya", deed_book_page: "DB410-P01", deed_recorded_date: "2017-05-05" }
              as: AssociationSecretary
              captures: { n1_id: "$.data.id" }
            - call: "POST /members/${n1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB410-P01" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${q2_id}", owner_name: "Gil Marsden", deed_book_page: "DB410-P02", deed_recorded_date: "2017-05-06" }
              as: AssociationSecretary
              captures: { n2_id: "$.data.id" }
            - call: "POST /members/${n2_id}/verify-deed"
              payload: { verified_deed_book_page: "DB410-P02" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${q3_id}", owner_name: "Hana Pilar", deed_book_page: "DB410-P03", deed_recorded_date: "2017-05-07" }
              as: AssociationSecretary
              captures: { n3_id: "$.data.id" }
            - call: "POST /members/${n3_id}/verify-deed"
              payload: { verified_deed_book_page: "DB410-P03" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${q4_id}", owner_name: "Ines Quill", deed_book_page: "DB410-P04", deed_recorded_date: "2017-05-08" }
              as: AssociationSecretary
              captures: { n4_id: "$.data.id" }
            - call: "POST /members/${n4_id}/verify-deed"
              payload: { verified_deed_book_page: "DB410-P04" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 1000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
          trigger:
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "GET /assessment-charges?roll_id=${roll_id}"
              payload: {}
              as: AssessmentClerk
          assert:
            - "the roll certifies with total_share_units == 3000 and status CERTIFIED"
            - "Q1's charge is amount_cents == 400000: the cap floor(0.40 * 1000000) clamped its 666666.67 raw share down"
            - "Q3's and Q4's charges are amount_cents == 50000 each: the MIN_CHARGE_CENTS floor lifted their 16666.67 raw shares up"
            - "Q2's charge is amount_cents == 400000, not 500000: its raw 300000 could only absorb min(200000, 400000 - 300000) = 100000 of the residual"
            - "total_levied_cents == 900000 and unallocated_residual_cents == 100000, so the leftover is recorded rather than spread"
            - "charges are created in created_at ASC order matching the parcels' enrollment order, and each share_units_snapshot equals 2000, 900, 50, 50 respectively"
            - "no charge exceeds 400000, so the single redistribution pass never re-breaches the cap it was bounded by"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: member_standing_and_access_dimensions_advance_independently
        grounds:
          - "state_machines.Member.access_status_UNRESTRICTED_to_WARNED"
          - "state_machines.Member.standing_status_DELINQUENT_to_LIEN_FILED"
          - "calculations.member_standing_reconciliation"
          - "calculations.member_access_reconciliation"
          - "entities.Member.fields.restricted_days_used"
        distinguishing_aspect: >
          One Member row carries two state dimensions that move on different
          triggers, and each hop moves exactly one of them. Effectuating a
          NOTICE drives access_status UNRESTRICTED -> WARNED while
          standing_status stays DELINQUENT (a NOTICE never encumbers the
          charge). Effectuating a LIEN_FILING on the same charge then drives
          standing_status DELINQUENT -> LIEN_FILED while access_status stays
          WARNED — it does not become RESTRICTED, and restricted_days_used stays
          0 because only ACCESS_RESTRICTION consumes days. A single-enum
          implementation cannot represent LIEN_FILED-and-WARNED, and one that
          treats every effectuation as an access escalation would report
          RESTRICTED with restricted_days_used still 0, an impossible pair.
        test_recipe:
          setup: |
            Build SINGLE_4M: association (reserve target 1000000, STATUTORY),
            one COMPLIANT segment, one 290-ft RESIDENTIAL_YEAR_ROUND parcel, one
            verified member, an FY2027 roll for 4000000 certified (the lone
            parcel clamps to the 1600000 cap) and levied on 2026-10-01, so the
            charge is OPEN with due_date 2026-11-15. Advance the clock to
            2026-12-15, exactly due_date plus the 30 grace days, and read the
            charge id off the roll.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /road-segments/${seg_id}/access-inspections"
              payload: { inspected_at: "2026-10-01T00:00:00Z", measured_width_feet: 22, measured_max_grade_pct: 9, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "GET /assessment-charges?roll_id=${roll_id}"
              payload: {}
              as: AssessmentClerk
              captures: { charge_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: BoardTreasurer
          trigger:
            - call: "POST /assessment-charges/${charge_id}/delinquency-actions"
              payload: { action_type: "NOTICE" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
              captures: { notice_id: "$.data.id" }
            - call: "GET /members/${m1_id}"
              payload: {}
              as: AssociationSecretary
            - call: "POST /delinquency-actions/${notice_id}/effectuate"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-user-2"
            - call: "GET /members/${m1_id}"
              payload: {}
              as: AssociationSecretary
            - call: "POST /assessment-charges/${charge_id}/delinquency-actions"
              payload: { action_type: "LIEN_FILING" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
              captures: { lien_id: "$.data.id" }
            - call: "POST /delinquency-actions/${lien_id}/effectuate"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-user-2"
            - call: "GET /members/${m1_id}"
              payload: {}
              as: AssociationSecretary
            - call: "POST /assessment-charges/${charge_id}/payments"
              payload: { amount_cents: 1600000 }
              as: MemberOwner
              as_user_id: "${m1_id}"
            - call: "GET /members/${m1_id}"
              payload: {}
              as: AssociationSecretary
          assert:
            - "after the NOTICE is initiated the member reads standing_status DELINQUENT and access_status UNRESTRICTED, and the charge reads DELINQUENT with delinquent_since 2026-12-15"
            - "after the NOTICE is effectuated the member reads standing_status DELINQUENT (unchanged) and access_status WARNED, and the charge is still DELINQUENT, not LIEN_ENCUMBERED"
            - "after the LIEN_FILING is effectuated the member reads standing_status LIEN_FILED and access_status WARNED (unchanged), with restricted_days_used == 0 and encumbered_principal_cents == 1600000"
            - "the LIEN_FILING action carries lien_amount_cents == 1600000 and payoff_amount_cents == 1615781 (1600000 + round_half_up(1600000 * 0.12 * 30 / 365))"
            - "the charge is LIEN_ENCUMBERED at that point while the NOTICE action remains EFFECTIVE with lien_amount_cents == 0"
            - "the full payment of 1600000 takes the charge to PAID, both actions to RELEASED, and the member to standing_status GOOD_STANDING with access_status UNRESTRICTED and encumbered_principal_cents == 0"
            - "restricted_days_used is still 0 after every hop: no ACCESS_RESTRICTION was ever effectuated"

      - name: project_returns_to_solicitation_when_awarded_bid_withdraws
        grounds:
          - "state_machines.MaintenanceProject.BID_SOLICITATION_to_AWARDED"
          - "state_machines.MaintenanceProject.AWARDED_to_BID_SOLICITATION"
          - "state_machines.ContractorBid.AWARDED_to_WITHDRAWN"
          - "concurrency_rules[bid-submit-stale-project]"
          - "calculations.lowest_responsive_bid"
        distinguishing_aspect: >
          The project traverses BID_SOLICITATION -> AWARDED ->
          BID_SOLICITATION -> AWARDED, so AWARDED is reachable twice and the
          second visit must clear the first award's fields rather than merge
          with them: awarded_bid_id, awarded_amount_cents and awarded_by_user_id
          all return to null/0 on the withdrawal and are then re-set from the
          replacement bid. A linear implementation that treats AWARDED as
          terminal cannot accept the second bid at all (the OCC check on the
          project version is the only way the replacement bid can be admitted),
          and one that leaves the withdrawn bid in the responsive candidate set
          would refuse the 850000 award as not-lowest against the withdrawn
          800000 bid.
        test_recipe:
          setup: |
            Register an association and a segment, then have RoadCommissioner
            rc-user-1 open a GRADING project for the half-open window
            2026-11-01 to 2026-11-10. GRADING draws nothing from the reserve, so
            no roll or levy is needed. Read the project version, let contractor
            firm-alpha submit a bonded 800000 bid against that version, and have
            rc-user-2 award it (segregation of duties: the awarding user is not
            the creator).
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RoadCommissioner
            - call: "POST /associations"
              payload: { name: "Switchback Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Switchback Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "GRADING", window_start_date: "2026-11-01", window_end_date: "2026-11-10" }
              as: RoadCommissioner
              as_user_id: "rc-user-1"
              captures: { proj_id: "$.data.id", proj_v0: "$.data.version" }
            - call: "GET /maintenance-projects/${proj_id}"
              payload: {}
              as: Contractor
              as_user_id: "firm-alpha"
              captures: { proj_v1: "$.data.version" }
            - call: "POST /maintenance-projects/${proj_id}/contractor-bids"
              payload: { contractor_name: "Alpha Grading LLC", amount_cents: 800000, bond_on_file: true, expected_project_version: "${proj_v1}" }
              as: Contractor
              as_user_id: "firm-alpha"
              captures: { bid_a: "$.data.id" }
            - call: "POST /maintenance-projects/${proj_id}/award"
              payload: { bid_id: "${bid_a}" }
              as: RoadCommissioner
              as_user_id: "rc-user-2"
          trigger:
            - call: "POST /contractor-bids/${bid_a}/withdraw"
              payload: { withdrawal_reason: "crew reassigned to a county job" }
              as: Contractor
              as_user_id: "firm-alpha"
            - call: "GET /maintenance-projects/${proj_id}"
              payload: {}
              as: Contractor
              as_user_id: "firm-beta"
              captures: { proj_v2: "$.data.version" }
            - call: "POST /maintenance-projects/${proj_id}/contractor-bids"
              payload: { contractor_name: "Beta Roadworks", amount_cents: 850000, bond_on_file: true, expected_project_version: "${proj_v2}" }
              as: Contractor
              as_user_id: "firm-beta"
              captures: { bid_b: "$.data.id" }
            - call: "POST /maintenance-projects/${proj_id}/award"
              payload: { bid_id: "${bid_b}" }
              as: RoadCommissioner
              as_user_id: "rc-user-2"
            - call: "GET /maintenance-projects/${proj_id}/contractor-bids"
              payload: {}
              as: RoadCommissioner
              as_user_id: "rc-user-2"
          assert:
            - "the first award leaves the project AWARDED with awarded_bid_id equal to firm-alpha's bid, awarded_amount_cents == 800000, awarded_by_user_id rc-user-2 and reserve_draw_cents == 0 (GRADING is operating work)"
            - "the withdrawal returns the project to status BID_SOLICITATION with awarded_bid_id null, awarded_amount_cents == 0 and awarded_by_user_id null"
            - "firm-alpha's bid reads status WITHDRAWN and is excluded from the responsive candidate set"
            - "the project version read after the withdrawal is strictly greater than the version firm-alpha bid against, so the replacement bid must carry the newer value"
            - "firm-beta's 850000 bid is accepted with status SUBMITTED even though a lower 800000 bid exists on the project, because the lower bid is WITHDRAWN"
            - "the second award succeeds with status AWARDED, awarded_bid_id equal to firm-beta's bid and awarded_amount_cents == 850000"
            - "the bid list contains exactly two bids ordered created_at ASC: firm-alpha WITHDRAWN then firm-beta AWARDED"
            - "the association's reserve_balance_cents stays 0 across both awards and the withdrawal: GRADING never touches the reserve"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: deficient_inspection_cancels_paving_reverses_reserve_and_retunes_threshold
        grounds:
          - "endpoints[POST /road-segments/{segment_id}/access-inspections]"
          - "state_machines.MaintenanceProject.BID_SOLICITATION_to_CANCELLED"
          - "calculations.reserve_balance_reconciliation"
          - "calculations.vote_threshold_resolution"
          - "entities.SpecialAssessmentProposal.fields.required_threshold_bps"
        distinguishing_aspect: >
          One inspection payload sets off a four-hop chain that ends on an
          entity the inspector never named: the segment grade becomes DEFICIENT
          (hop 1), which cancels the AWARDED PAVING project on that segment
          (hop 2), which rejects the awarded bid and returns its 250000-cent
          reserve draw so the balance climbs 350000 -> 600000 (hop 3), which
          flips reserve_posture UNDERFUNDED -> ADEQUATE and therefore drops an
          unrelated DRAFT GRADING proposal's required_threshold_bps from 5500
          back to 5000 (hop 4). Ordering is observable in both directions: the
          award had already pushed the same threshold 5000 -> 5500 on the way
          down. An implementation that cancels the project but forgets the
          reserve, or reverses the reserve but leaves the proposal's frozen
          threshold, differs at hop 3 or hop 4 while hops 1-2 look correct.
        test_recipe:
          setup: |
            Build SINGLE_4M (reserve 600000, ADEQUATE, exactly the 60% boundary)
            and draft a GRADING proposal for 1500000 cents, which resolves to
            required_threshold_bps 5000 (base 5000, no cost bump under
            ESCALATION_COST_CENTS, no posture bump while ADEQUATE). Then open a
            PAVING project on the segment for 2026-11-01 to 2026-11-10 as
            rc-user-1, take a bonded 250000 bid from firm-alpha against the
            project's current version, and award it as rc-user-2. The award
            draws 250000 from the reserve, leaving 350000, which is UNDERFUNDED
            and lifts the DRAFT proposal's threshold to 5500.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /road-segments/${seg_id}/access-inspections"
              payload: { inspected_at: "2026-10-01T00:00:00Z", measured_width_feet: 22, measured_max_grade_pct: 9, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "POST /special-assessment-proposals"
              payload: { road_segment_id: "${seg_id}", project_type: "GRADING", title: "Spring regrade", estimated_cost_cents: 1500000, cost_allocation_method: "FRONTAGE_WEIGHTED" }
              as: BoardTreasurer
              captures: { prop_id: "$.data.id", prop_bps_adequate: "$.data.required_threshold_bps" }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "PAVING", window_start_date: "2026-11-01", window_end_date: "2026-11-10" }
              as: RoadCommissioner
              as_user_id: "rc-user-1"
              captures: { proj_id: "$.data.id" }
            - call: "GET /maintenance-projects/${proj_id}"
              payload: {}
              as: Contractor
              as_user_id: "firm-alpha"
              captures: { proj_v1: "$.data.version" }
            - call: "POST /maintenance-projects/${proj_id}/contractor-bids"
              payload: { contractor_name: "Alpha Paving LLC", amount_cents: 250000, bond_on_file: true, expected_project_version: "${proj_v1}" }
              as: Contractor
              as_user_id: "firm-alpha"
              captures: { bid_a: "$.data.id" }
            - call: "POST /maintenance-projects/${proj_id}/award"
              payload: { bid_id: "${bid_a}" }
              as: RoadCommissioner
              as_user_id: "rc-user-2"
            - call: "GET /associations/${assoc_id}"
              payload: {}
              as: BoardTreasurer
            - call: "GET /special-assessment-proposals/${prop_id}"
              payload: {}
              as: BoardTreasurer
              captures: { prop_bps_underfunded: "$.data.required_threshold_bps" }
          trigger:
            - call: "POST /road-segments/${seg_id}/access-inspections"
              payload: { inspected_at: "2026-10-20T00:00:00Z", measured_width_feet: 22, measured_max_grade_pct: 14, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "GET /maintenance-projects/${proj_id}"
              payload: {}
              as: RoadCommissioner
              as_user_id: "rc-user-2"
            - call: "GET /contractor-bids/${bid_a}"
              payload: {}
              as: RoadCommissioner
              as_user_id: "rc-user-2"
            - call: "GET /associations/${assoc_id}"
              payload: {}
              as: BoardTreasurer
            - call: "GET /special-assessment-proposals/${prop_id}"
              payload: {}
              as: BoardTreasurer
          assert:
            - "before the award the proposal reads required_threshold_bps == 5000 and the association reads reserve_balance_cents == 600000 with reserve_posture ADEQUATE"
            - "the award leaves the association at reserve_balance_cents == 350000 and reserve_posture UNDERFUNDED, and the DRAFT proposal's required_threshold_bps rises to 5500"
            - "hop 1: the DEFICIENT inspection response reads emergency_access_grade == DEFICIENT with max_grade_pct 14 and last_inspection_at 2026-10-20T00:00:00Z"
            - "hop 2: the PAVING project reads status CANCELLED with reserve_draw_cents == 0 and awarded_amount_cents unchanged at 250000 as the historical record"
            - "hop 3: firm-alpha's bid reads status REJECTED, and the association reads reserve_balance_cents == 600000 again with reserve_funding_ratio 0.6"
            - "hop 4: the association reads reserve_posture ADEQUATE and the still-DRAFT proposal reads required_threshold_bps == 5000 again"
            - "the proposal was never opened for balloting, so eligible_weight_total stays 0 and status stays DRAFT through the whole cascade"
            - "the reserve balance returns to exactly its pre-award value: 600000, not 599999 or 600001"

      - name: lien_effectuation_cascades_to_a_balloting_proposal_tally
        grounds:
          - "state_machines.DelinquencyAction.INITIATED_to_EFFECTIVE"
          - "state_machines.AssessmentCharge.DELINQUENT_to_LIEN_ENCUMBERED"
          - "state_machines.Ballot.CAST_to_VOIDED"
          - "entities.SpecialAssessmentProposal.fields.counted_weight_total"
          - "entities.SpecialAssessmentProposal.fields.quorum_met"
        distinguishing_aspect: >
          A single POST to effectuate walks four entities in order: the action
          becomes EFFECTIVE (hop 1), the charge DELINQUENT -> LIEN_ENCUMBERED
          (hop 2), the member's standing_status -> LIEN_FILED with
          encumbered_principal_cents 1600000 (hop 3), and only because the
          member became LIEN_FILED does the member's CAST ballot on an open
          proposal become VOIDED, dropping counted_weight_total 1 -> 0, flipping
          quorum_met true -> false and bumping the proposal's version (hop 4).
          The ballot is three hops removed from the request path and is never
          named in the payload; an implementation that stops at the member — or
          that voids the ballot without recomputing the proposal totals and
          version — passes hops 1-3 and fails hop 4.
        test_recipe:
          setup: |
            Build SINGLE_4M, then draft a GRADING proposal for 1500000 cents and
            open balloting with balloting_closes_at 2027-01-05T00:00:00Z so the
            round is still open in December. With the clock at 2026-10-01 the
            lone GOOD_STANDING member casts YES against the proposal's current
            version, giving eligible_weight_total 1, counted_weight_total 1 and
            quorum_met true at the 5000-bps quorum. Advance the clock to
            2026-12-15 (due_date 2026-11-15 plus the 30 grace days) and have
            bt-user-1 initiate a LIEN_FILING on the member's charge.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "GET /assessment-charges?roll_id=${roll_id}"
              payload: {}
              as: AssessmentClerk
              captures: { charge_id: "$.data[0].id" }
            - call: "POST /special-assessment-proposals"
              payload: { road_segment_id: "${seg_id}", project_type: "GRADING", title: "Winter regrade", estimated_cost_cents: 1500000, cost_allocation_method: "EQUAL_SHARE", voting_basis: "PER_PARCEL" }
              as: BoardTreasurer
              captures: { prop_id: "$.data.id" }
            - call: "POST /special-assessment-proposals/${prop_id}/open-balloting"
              payload: { balloting_closes_at: "2027-01-05T00:00:00Z" }
              as: BoardTreasurer
            - call: "GET /special-assessment-proposals/${prop_id}"
              payload: {}
              as: BoardTreasurer
              captures: { prop_v1: "$.data.version" }
            - call: "POST /ballots"
              payload: { proposal_id: "${prop_id}", member_id: "${m1_id}", choice: "YES", expected_proposal_version: "${prop_v1}" }
              as: MemberOwner
              as_user_id: "${m1_id}"
              captures: { ballot_id: "$.data.id" }
            - call: "GET /special-assessment-proposals/${prop_id}"
              payload: {}
