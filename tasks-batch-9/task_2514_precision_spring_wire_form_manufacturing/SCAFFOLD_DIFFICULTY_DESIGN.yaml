            - call: "POST /wire-lots"
              payload: { material_spec_id: "${ms_id}", heat_number: "HT-800", received_kg: 800.0 }
              as: QualityInspector
              captures: { wl_id: $.data.id }
            - call: "POST /wire-lots/${wl_id}/certify"
