            - "The terrain area moved CLOSED -> PREP as a side effect of the session create, so opening_state is PREP and version is 2."

      - name: inspection_pass_stamps_the_mechanical_dimension_without_moving_the_service_dimension
        claim_type: valid_transition
        grounds:
          - state_machines.Lift.INSPECTION_DUE_to_INSPECTION_PASSED
          - state_machines.Lift.CLOSED_to_STANDBY
          - entities.Lift.fields.inspection_valid_until
        distinguishing_aspect: |
          The two Lift dimensions are declared parallel. A passing inspection is the trigger that moves
          only the mechanical dimension, so immediately after it the lift must be CLOSED /
          INSPECTION_PASSED - a combined state that a naive single-dimension implementation cannot
          represent. inspection_valid_until must be stamped at clock + 24h, because the READY -> OPEN
          terrain gate (priority 32) reads it hours later.
        test_recipe:
          setup:
            - "A season with one uninspected lift exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
