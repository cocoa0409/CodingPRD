  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: irrigation_offseason_discount_applied
        claim_type: correct_result
        grounds:
          - "calculations.tiered_energy_charge"
        distinguishing_aspect: "IRRIGATION location billed in a month outside the Apr-Sep season gets the offseason discount on energy charges; a month inside does not."
        test_recipe:
          setup: ["IRRIGATION member/location; schedule IR-2 with single tier 10 c/kwh and offseason discount 20%; billing period January (off-season)"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "Farm", member_type: "IRRIGATION", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "Pivot 1", rate_class: "IRRIGATION", irrigation_connected_load_kw: 20 }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/rate-schedules"
              payload: { code: "IR-2", rate_class: "IRRIGATION", effective_from: "2025-01-01T00:00:00Z", customer_charge_cents: 5000, tiers: [{up_to_kwh: null, cents_per_kwh: 10}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0.20, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_id: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_id}/publish"
              payload: {}
              as: RateAnalyst
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_id}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 0, demand_kw: 2.0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_id}", reading_at: "2026-02-01T00:00:00Z", kwh_register: 1000, demand_kw: 3.0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_id}", billing_period_start: "2026-01-01T00:00:00Z", billing_period_end: "2026-02-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /coop/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
              captures: { energy: $.data.energy_charge_cents, total: $.data.total_due_cents, demand_billed: $.data.demand_kw_billed }
          assert:
            - "energy_charge_cents == 8000 (1000 kwh * 10 = 10000, off-season January discount 20% -> 8000)"
            - "demand_kw_billed == 5.0 (irrigation minimum billing kW floor overrides peak 3.0)"
            - "total_due_cents == 13000 (customer 5000 + energy 8000 + demand 0)"

      - name: irrigation_inseason_no_discount
        claim_type: correct_result
