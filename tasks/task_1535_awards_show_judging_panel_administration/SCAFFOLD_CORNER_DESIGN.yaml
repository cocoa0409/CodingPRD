- section: consistency
  instances:
  - name: immediate_read_after_write
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: A mutation's effects are visible in the very next read of the same request sequence — no eventual-consistency lag.
    test_recipe:
      setup:
      - Season created.
      setup_api_calls:
      - call: POST /awards/seasons
        as: ProgramAdmin
        payload:
          code: GALA-IMM
          title: GALA-IMM
          submission_opens_at: '2026-08-10T00:00:00Z'
          early_fee_ends_at: '2026-08-20T00:00:00Z'
          submission_closes_at: '2026-09-01T00:00:00Z'
          eligibility_window_start: '2026-01-01T00:00:00Z'
          eligibility_window_end: '2026-08-01T00:00:00Z'
          ceremony_scheduled_at: '2026-10-01T19:00:00Z'
          refund_policy: FLAT_FEE
        captures:
          season_id: $.data.id
          season_id_v: $.data.version
      trigger:
      - call: GET /awards/seasons/${season_id}
        as: ProgramAdmin
      assert:
      - GET returns the just-created season with identical field values (code == 'GALA-IMM')
