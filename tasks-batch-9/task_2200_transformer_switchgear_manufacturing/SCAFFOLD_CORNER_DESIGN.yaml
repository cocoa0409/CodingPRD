  - section: validations
    instances:
      - name: list_engineered_orders_with_limit_zero_returns_invalid_pagination
        claim_type: violation_to_error
        grounds:
          - validations[P31]
          - errors[ERR_INVALID_PAGINATION]
          - endpoints[list_engineered_orders]
        distinguishing_aspect: "limit must be an integer in 1..100; limit=0 is below the floor and must yield ERR_INVALID_PAGINATION (400) - note the 400 status, unlike every other body-shape failure which is 422."
        test_recipe:
          setup:
            - "One order exists so the list is non-empty and the failure cannot be confused with an empty page."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-V1"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
          trigger:
            - call: GET /engineered-orders?limit=0
              payload: {}
              as: PlantAdmin
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_PAGINATION\"."
            - "response_type == \"error\"; no data array and no total_count are returned."

      - name: list_engineered_orders_accepts_limit_one_hundred_and_rejects_one_hundred_one
        claim_type: violation_to_error
        grounds:
          - validations[P31]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The pagination ceiling is inclusive at 100: limit=100 must succeed while limit=101 must fail, pinning the boundary rather than merely 'a large limit is rejected'."
        test_recipe:
          setup:
            - "One order exists."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-V2"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
            - call: GET /engineered-orders?limit=100&offset=0
              payload: {}
              as: PlantAdmin
          trigger:
            - call: GET /engineered-orders?limit=101
              payload: {}
              as: PlantAdmin
          assert:
            - "The setup call with limit=100 returned HTTP 200 with limit == 100, total_count == 1, has_more == false."
            - "The trigger returns HTTP 400 with data.error_id == \"ERR_INVALID_PAGINATION\"."

      - name: duplicate_order_number_on_second_create_returns_duplicate_order_number
        claim_type: violation_to_error
        grounds:
          - validations[P54]
          - errors[ERR_DUPLICATE_ORDER_NUMBER]
          - endpoints[create_engineered_order]
        distinguishing_aspect: "order_number uniqueness is global across all orders (not per customer), so a second create reusing it fails with ERR_DUPLICATE_ORDER_NUMBER (409) even though every other field differs."
        test_recipe:
          setup:
            - "One order already exists with order_number ORD-CORNER-V3."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-V3"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
          trigger:
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-V3"
                customer_name: "Northgate Cooperative"
                product_family: "POWER_TRANSFORMER"
                rated_kv: 69
                contract_value_cents: 9000000
                sold_at: "2026-02-01T00:00:00Z"
                promised_ship_at: "2027-01-01T00:00:00Z"
                owning_sales_user_id: "u-sales-2"
              as: PlantAdmin
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DUPLICATE_ORDER_NUMBER\"."
            - "GET /engineered-orders as PlantAdmin returns total_count == 1 and data[0].customer_name == \"Riverbend Utility\"."

      - name: duplicate_part_number_within_same_supplier_returns_duplicate_code
        claim_type: conditional_validation
        grounds:
          - validations[P55]
          - errors[ERR_DUPLICATE_CODE]
          - endpoints[create_long_lead_component]
        distinguishing_aspect: "part_number is unique WITHIN a supplier, not globally: the same part_number under a second supplier must succeed while the repeat under the first supplier fails with ERR_DUPLICATE_CODE."
        test_recipe:
          setup:
            - "Two APPROVED suppliers; supplier A already owns part_number PN-SHARED-01."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /suppliers
              payload: { supplier_code: "SUP-V4-A", legal_name: "Copperline Windings AG", region: "NA" }
              as: PlantAdmin
              captures: { supplier_a_id: "$.data.id" }
            - call: POST /suppliers
              payload: { supplier_code: "SUP-V4-B", legal_name: "Meridian Interrupters SA", region: "EU" }
              as: PlantAdmin
              captures: { supplier_b_id: "$.data.id" }
            - call: POST /suppliers/${supplier_a_id}/long-lead-components
              payload: { part_number: "PN-SHARED-01", category: "CT_VT", lead_time_days: 45, quantity_on_hand: 6, allocation_policy: "PREEMPTIBLE" }
              as: MaterialsPlanner
            - call: POST /suppliers/${supplier_b_id}/long-lead-components
              payload: { part_number: "PN-SHARED-01", category: "CT_VT", lead_time_days: 45, quantity_on_hand: 6, allocation_policy: "PREEMPTIBLE" }
              as: MaterialsPlanner
          trigger:
            - call: POST /suppliers/${supplier_a_id}/long-lead-components
              payload: { part_number: "PN-SHARED-01", category: "BREAKER_FRAME", lead_time_days: 300, quantity_on_hand: 2, allocation_policy: "PROTECTED" }
              as: MaterialsPlanner
          assert:
            - "The fourth setup call (same part_number under supplier B) returned HTTP 201."
            - "The trigger returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_CODE\"."
            - "GET /suppliers/${supplier_a_id}/long-lead-components as MaterialsPlanner returns total_count == 1."

      - name: second_escalation_clause_on_same_order_returns_clause_already_exists
        claim_type: aggregate_validation
        grounds:
          - validations[P57]
          - errors[ERR_CLAUSE_ALREADY_EXISTS]
          - endpoints[create_escalation_clause]
        distinguishing_aspect: "At most one EscalationClause may exist per order; the second create must fail with ERR_CLAUSE_ALREADY_EXISTS (409) even with entirely different weights and window months."
        test_recipe:
          setup:
            - "One order carrying exactly one EscalationClause."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-V5"
                customer_name: "Riverbend Utility"
                product_family: "POWER_TRANSFORMER"
                rated_kv: 69
                contract_value_cents: 9000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2027-01-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
            - call: POST /engineered-orders/${order_id}/escalation-clauses
              payload: { copper_weight_bp: 6000, aluminum_weight_bp: 2000, core_steel_weight_bp: 2000, escalatable_base_cents: 3000000, base_index_month: "2026-01", cap_bp: 1000, collar_bp: 200, de_escalation_enabled: false, final_window_end_month: "2026-06" }
              as: ContractAdmin
          trigger:
            - call: POST /engineered-orders/${order_id}/escalation-clauses
              payload: { copper_weight_bp: 4000, aluminum_weight_bp: 4000, core_steel_weight_bp: 2000, escalatable_base_cents: 1000000, base_index_month: "2026-02", cap_bp: 500, collar_bp: 100, de_escalation_enabled: true, final_window_end_month: "2026-08" }
              as: ContractAdmin
          assert:
            - "HTTP 409 with data.error_id == \"ERR_CLAUSE_ALREADY_EXISTS\"."
            - "GET /engineered-orders/${order_id}/escalation-clauses as ContractAdmin returns total_count == 1 and data[0].copper_weight_bp == 6000."

      - name: escalation_clause_with_base_month_after_final_month_returns_index_window_invalid
        claim_type: temporal_validation
        grounds:
          - validations[P67]
          - errors[ERR_INDEX_WINDOW_INVALID]
          - endpoints[create_escalation_clause]
        distinguishing_aspect: "base_index_month must be STRICTLY earlier than final_window_end_month, so an inverted pair is rejected with ERR_INDEX_WINDOW_INVALID (422) before any index data is consulted - no CommodityIndexPoint rows are needed to provoke it."
        test_recipe:
          setup:
            - "One order with no escalation clause and no CommodityIndexPoint rows in the database."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-V6"
                customer_name: "Riverbend Utility"
                product_family: "POWER_TRANSFORMER"
                rated_kv: 69
                contract_value_cents: 9000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2027-01-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
          trigger:
            - call: POST /engineered-orders/${order_id}/escalation-clauses
              payload: { copper_weight_bp: 6000, aluminum_weight_bp: 2000, core_steel_weight_bp: 2000, escalatable_base_cents: 3000000, base_index_month: "2026-06", cap_bp: 1000, collar_bp: 200, de_escalation_enabled: false, final_window_end_month: "2026-01" }
              as: ContractAdmin
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INDEX_WINDOW_INVALID\"."
            - "GET /engineered-orders/${order_id}/escalation-clauses as ContractAdmin returns data == [] and total_count == 0."

      - name: invalid_disposition_enum_beats_wrong_drawing_state_in_priority_ladder
        claim_type: priority_conflict
        grounds:
          - validations[P29]
          - validations[P35]
          - errors[ERR_ENUM_VALUE_INVALID]
        distinguishing_aspect: "Two rules are violated at once - the enum domain (P29) and the drawing's source state (P35, DRAFT is not UNDER_REVIEW). The lower-numbered rule wins, so the answer is ERR_ENUM_VALUE_INVALID (422), never ERR_INVALID_STATE_TRANSITION (409)."
        test_recipe:
          setup:
            - "One order with a DRAFT revision-1 drawing that has never been submitted."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-V7"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
