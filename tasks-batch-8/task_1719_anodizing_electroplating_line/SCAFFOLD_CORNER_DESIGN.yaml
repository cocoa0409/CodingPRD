scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: customer_defaults_applied
        claim_type: defaults
        grounds: [entities.Customer.fields.priority_tier, entities.Customer.fields.credit_hold, entities.Customer.fields.status]
        distinguishing_aspect: "Creating a customer with only company_name applies defaults priority_tier == STANDARD, credit_hold == false, status == ACTIVE, version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Default Co" }, as: ShopManager, captures: { cd: $.data.id, cd_tier: $.data.priority_tier, cd_hold: $.data.credit_hold, cd_status: $.data.status, cd_v: $.data.version } }
          trigger: []
          assert:
            - "customer ${cd}: priority_tier == STANDARD, credit_hold == false, status == ACTIVE, version == 1"

      - name: fixture_amortization_computed_at_creation
        claim_type: computed_field
        grounds: [entities.Fixture.fields.amortization_cents_per_use]
        distinguishing_aspect: "amortization_cents_per_use == ceil(purchase_cost_cents / rated_uses): 120000/50 -> 2400 exactly; 100000/40 -> 2500; ceil edge 100001/40 -> 2501 (2500.025 rounds up)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /fixtures", payload: { fixture_code: "RACK-A", routing_mode: "RACK", capacity_dm2: 500, purchase_cost_cents: 120000, rated_uses: 50 }, as: ShopManager, captures: { fa: $.data.id, fa_amort: $.data.amortization_cents_per_use } }
            - { call: "POST /fixtures", payload: { fixture_code: "RACK-B", routing_mode: "RACK", capacity_dm2: 500, purchase_cost_cents: 100001, rated_uses: 40 }, as: ShopManager, captures: { fb_amort: $.data.amortization_cents_per_use } }
          trigger: []
          assert:
            - "fixture A amortization_cents_per_use == 2400"
            - "fixture B amortization_cents_per_use == 2501 (ceil of 2500.025)"

      - name: bath_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random, never-created UUID returns 404 ERR_NOT_FOUND for both baths and work orders."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /baths/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: LabChemist, captures: { err1: $.data.error_id } }
            - { call: "GET /work-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: LineOperator, captures: { err2: $.data.error_id } }
          assert:
            - "both calls return error_id == ERR_NOT_FOUND with http 404"

      - name: workorder_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "POST /work-orders without thickness_spec_max_um is rejected ERR_INVALID_REQUEST before any state or business check runs."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Req Co" }, as: ShopManager, captures: { cr: $.data.id } }
          trigger:
            - { call: "POST /work-orders", payload: { customer_id: "${cr}", part_number: "PN-X", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0 }, as: Customer, as_user_id: "${cr}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); no work order created (GET /work-orders?customer_id shows 0 rows)"

      - name: workorder_spec_inverted_returns_400
        claim_type: type_constraint
        grounds: [entities.WorkOrder.fields.thickness_spec_min_um, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "thickness_spec_min_um > thickness_spec_max_um violates the range constraint and is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Range Co" }, as: ShopManager, captures: { crr: $.data.id } }
          trigger:
            - { call: "POST /work-orders", payload: { customer_id: "${crr}", part_number: "PN-INV", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 18.0, thickness_spec_max_um: 12.0 }, as: Customer, as_user_id: "${crr}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: untitrated_or_out_of_band_bath_blocks_routing
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_BATH_CONCENTRATION_OUT_OF_BAND]", state_machines.WorkOrder.READY_FOR_ROUTING_to_ROUTED]
        distinguishing_aspect: "Routing fails with ERR_BATH_CONCENTRATION_OUT_OF_BAND both when the bath has never been titrated (current null) and when the latest titration is below the low limit (3.0 < 4.0)."
        test_recipe:
          setup:
            - "customer CU; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; bath BU never titrated; bath BO titrated to 3.0 (tv 3, n 0.1, sv 4.9 -> 3.0)"
            - "two prepared BARREL work orders WU and WO2, one per bath"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Band Co" }, as: ShopManager, captures: { cu: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-U", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bu: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-O", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bo: $.data.id } }
            - { call: "POST /baths/${bo}/titrations", payload: { titrant_volume_ml: 3.0, titrant_normality: 0.1, sample_volume_ml: 4.9 }, as: LabChemist, captures: { bo_conc: $.data.measured_concentration_g_l } }
            - { call: "POST /work-orders", payload: { customer_id: "${cu}", part_number: "PN-U", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cu}", captures: { wu: $.data.id } }
            - { call: "POST /work-orders/${wu}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders", payload: { customer_id: "${cu}", part_number: "PN-O", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cu}", captures: { wo2: $.data.id } }
            - { call: "POST /work-orders/${wo2}/prepare", payload: {}, as: LineOperator }
          trigger:
            - { call: "POST /work-orders/${wu}/route", payload: { bath_id: "${bu}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_u: $.data.error_id } }
            - { call: "POST /work-orders/${wo2}/route", payload: { bath_id: "${bo}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_o: $.data.error_id } }
          assert:
            - "bath BO titrated to exactly 3.0 (below low 4.0)"
            - "route to untitrated bath: error_id == ERR_BATH_CONCENTRATION_OUT_OF_BAND"
            - "route to out-of-band bath: error_id == ERR_BATH_CONCENTRATION_OUT_OF_BAND"

      - name: alloy_rule_duplicate_rejected
        claim_type: type_constraint
        grounds: ["errors[ERR_DUPLICATE_COMPATIBILITY_RULE]", entities.AlloyCompatibilityRule.fields.uniqueness]
        distinguishing_aspect: "Second rule with identical (alloy_code, process_type, chemistry_family) is rejected ERR_DUPLICATE_COMPATIBILITY_RULE; same alloy in a different chemistry_family is accepted."
        test_recipe:
          setup: ["one rule AL6061/ANODIZE/SULFURIC COMPATIBLE exists"]
          setup_api_calls:
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "INCOMPATIBLE" }, as: LabChemist, captures: { err_dup: $.data.error_id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "CHROMIC", compatibility: "CONDITIONAL" }, as: LabChemist, captures: { r2: $.data.id } }
          assert:
            - "duplicate triple rejected: error_id == ERR_DUPLICATE_COMPATIBILITY_RULE (409)"
            - "different chemistry_family accepted: 201"

      - name: alloy_rule_delete_restores_fail_closed
        claim_type: conditional_validation
        grounds: ["errors[ERR_ALLOY_BATH_INCOMPATIBLE]"]
        distinguishing_aspect: "After the only matching rule is DELETED, routing fails closed with ERR_ALLOY_BATH_INCOMPATIBLE even though it succeeded before the delete."
        test_recipe:
          setup: ["customer CD; rule AL5052/ANODIZE/SULFURIC COMPATIBLE; bath BD titrated 5.0; prepared BARREL order WD"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Del Co" }, as: ShopManager, captures: { cd2: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL5052", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist, captures: { rd: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-D", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bd: $.data.id } }
            - { call: "POST /baths/${bd}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${cd2}", part_number: "PN-D", alloy_code: "AL5052", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cd2}", captures: { wd: $.data.id } }
            - { call: "POST /work-orders/${wd}/prepare", payload: {}, as: LineOperator }
            - { call: "DELETE /alloy-compatibility-rules/${rd}", as: LabChemist }
          trigger:
            - { call: "POST /work-orders/${wd}/route", payload: { bath_id: "${bd}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_fc: $.data.error_id } }
          assert:
            - "after rule deletion, route fails closed: error_id == ERR_ALLOY_BATH_INCOMPATIBLE (422)"

      - name: inspection_with_two_readings_rejected
        claim_type: required_fields
        grounds: [entities.InspectionReport.fields.thickness_readings_um, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "thickness_readings_um with fewer than 3 readings is a schema violation (ERR_INVALID_REQUEST) evaluated before the state check would matter — here the order IS awaiting inspection, isolating the schema failure."
        test_recipe:
          setup: ["order WI driven to AWAITING_INSPECTION on bath BI (see chain)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Read Co" }, as: ShopManager, captures: { ci: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-I", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bi: $.data.id } }
            - { call: "POST /baths/${bi}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${ci}", part_number: "PN-I", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${ci}", captures: { wi: $.data.id } }
            - { call: "POST /work-orders/${wi}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wi}/route", payload: { bath_id: "${bi}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${bi}", as: LabChemist, captures: { bi_v: $.data.version } }
            - { call: "POST /work-orders/${wi}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bi_v}" }, as: LineOperator, captures: { lri: $.data.id } }
            - { call: "POST /load-runs/${lri}/complete", as: LineOperator }
          trigger:
            - { call: "POST /work-orders/${wi}/inspections", payload: { thickness_readings_um: [13.0, 14.0], defect_type: "NONE" }, as: QCInspector, captures: { err_2r: $.data.error_id } }
          assert:
            - "two readings rejected: error_id == ERR_INVALID_REQUEST (400); work order remains AWAITING_INSPECTION"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: load_run_abort_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LoadRun.RUNNING_to_ABORTED, "errors[ERR_LOAD_RUN_NOT_RUNNING]"]
        distinguishing_aspect: "Aborting an already-ABORTED load run is rejected ERR_LOAD_RUN_NOT_RUNNING and does not double-release the reservation (reserved stays 0)."
        test_recipe:
          setup: ["order WA with a load started on bath BA (reserved 25.0), then aborted once"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Abort Co" }, as: ShopManager, captures: { ca: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-A", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { ba: $.data.id } }
            - { call: "POST /baths/${ba}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${ca}", part_number: "PN-A", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${ca}", captures: { wa: $.data.id } }
            - { call: "POST /work-orders/${wa}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wa}/route", payload: { bath_id: "${ba}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${ba}", as: LabChemist, captures: { ba_v: $.data.version } }
            - { call: "POST /work-orders/${wa}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${ba_v}" }, as: LineOperator, captures: { lra: $.data.id } }
            - { call: "POST /load-runs/${lra}/abort", as: LineOperator }
          trigger:
            - { call: "POST /load-runs/${lra}/abort", as: LineOperator, captures: { err_a2: $.data.error_id } }
            - { call: "GET /baths/${ba}", as: LabChemist, captures: { ba_res: $.data.amp_hour_reserved } }
          assert:
            - "second abort rejected: error_id == ERR_LOAD_RUN_NOT_RUNNING (409)"
            - "bath amp_hour_reserved == 0 (released exactly once — no double-release drift)"

      - name: bath_quarantine_state_gates
        claim_type: invalid_transition
        grounds: [state_machines.PlatingBath.ACTIVE_to_QUARANTINED, state_machines.PlatingBath.QUARANTINED_to_ACTIVE, "errors[ERR_BATH_NOT_QUARANTINED]", "errors[ERR_BATH_NOT_ACTIVE]"]
        distinguishing_aspect: "release-quarantine on an ACTIVE bath -> ERR_BATH_NOT_QUARANTINED; quarantine on an already-QUARANTINED bath -> ERR_BATH_NOT_ACTIVE."
        test_recipe:
          setup: ["bath BQ titrated to 5.0, ACTIVE"]
          setup_api_calls:
            - { call: "POST /baths", payload: { bath_code: "ANO-Q", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bq: $.data.id } }
            - { call: "POST /baths/${bq}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
          trigger:
            - { call: "POST /baths/${bq}/release-quarantine", as: EHSOfficer, captures: { err_rel: $.data.error_id } }
            - { call: "POST /baths/${bq}/quarantine", as: EHSOfficer, captures: { bq_st: $.data.status } }
            - { call: "POST /baths/${bq}/quarantine", as: EHSOfficer, captures: { err_q2: $.data.error_id } }
          assert:
            - "release from ACTIVE: error_id == ERR_BATH_NOT_QUARANTINED (409)"
            - "first quarantine succeeds: status == QUARANTINED"
            - "second quarantine: error_id == ERR_BATH_NOT_ACTIVE (409)"

      - name: bath_dump_renew_state_gates
        claim_type: invalid_transition
        grounds: [state_machines.PlatingBath.DUMPED_to_ACTIVE, "errors[ERR_BATH_NOT_DUMPED]", "errors[ERR_BATH_NOT_DUMPABLE]", "errors[ERR_BATH_NOT_DOSABLE]"]
        distinguishing_aspect: "renew on ACTIVE -> ERR_BATH_NOT_DUMPED; dump on DUMPED -> ERR_BATH_NOT_DUMPABLE; titration on DUMPED -> ERR_BATH_NOT_DOSABLE; renew after dump succeeds."
        test_recipe:
          setup: ["bath BR ACTIVE titrated 5.0; DRAFT manifest MR"]
          setup_api_calls:
            - { call: "POST /baths", payload: { bath_code: "ANO-R", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { br: $.data.id } }
            - { call: "POST /baths/${br}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /waste-manifests", payload: { generator_epa_id: "EPA-GEN-R" }, as: EHSOfficer, as_user_id: "ehs-r", captures: { mr: $.data.id } }
          trigger:
            - { call: "POST /baths/${br}/renew", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: ShopManager, captures: { err_ren: $.data.error_id } }
            - { call: "POST /baths/${br}/dump", payload: { manifest_id: "${mr}" }, as: ShopManager, captures: { br_dump: $.data.status } }
            - { call: "POST /baths/${br}/dump", payload: { manifest_id: "${mr}" }, as: ShopManager, captures: { err_d2: $.data.error_id } }
            - { call: "POST /baths/${br}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist, captures: { err_tit: $.data.error_id } }
            - { call: "POST /baths/${br}/renew", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: ShopManager, captures: { br_renew: $.data.status } }
          assert:
            - "renew on ACTIVE: error_id == ERR_BATH_NOT_DUMPED"
            - "first dump succeeds: status == DUMPED"
            - "second dump: error_id == ERR_BATH_NOT_DUMPABLE"
            - "titration on DUMPED: error_id == ERR_BATH_NOT_DOSABLE"
            - "renew after dump: status == ACTIVE"

      - name: bath_dose_exhausted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PlatingBath.ACTIVE_to_EXHAUSTED, "errors[ERR_BATH_NOT_DOSABLE]"]
        distinguishing_aspect: "Dosing an EXHAUSTED bath is rejected ERR_BATH_NOT_DOSABLE — chemistry corrections are meaningless once bath-life is spent; only dump/renew remains."
        test_recipe:
          setup: ["bath BE capacity 25 Ah titrated 5.0; one 25 Ah load completed -> EXHAUSTED"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Dose Co" }, as: ShopManager, captures: { ce: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-E", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 25 }, as: ShopManager, captures: { be: $.data.id } }
            - { call: "POST /baths/${be}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${ce}", part_number: "PN-E", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${ce}", captures: { we: $.data.id } }
            - { call: "POST /work-orders/${we}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${we}/route", payload: { bath_id: "${be}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${be}", as: LabChemist, captures: { be_v: $.data.version } }
            - { call: "POST /work-orders/${we}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${be_v}" }, as: LineOperator, captures: { lre: $.data.id } }
