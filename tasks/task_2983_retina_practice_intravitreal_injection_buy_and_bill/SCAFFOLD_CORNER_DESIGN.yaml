      - name: corner_attest_wastage_twice_is_rejected_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines.InjectionEncounter.DOCUMENTED_to_ATTESTED
          - errors[ERR_ENCOUNTER_STATE_INVALID]
        distinguishing_aspect: "The attestation edge fires once: after the encounter reaches ATTESTED, a second attest-wastage by a third clinician returns ERR_ENCOUNTER_STATE_INVALID (409) and attested_by_clinician_id keeps the first attester."
        test_recipe:
