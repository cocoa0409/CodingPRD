    side_effects:
      - "DRAFT -> COSTED"
      - "runs calculations.formula_bench_cost, calculations.formula_cost_in_use and calculations.formula_claim_profile"
      - "sets cost_stale false and increments Formula.version"

  - method: POST
    path: "/formulas/{formula_id}/submit"
    description: "Submit a costed formula for technical approval"
    roles: [Flavorist]
    code: 200
    input: []
