        grounds:
          - "validations.priority_140 (ERR_HOLD_EXCEEDS_AVAILABLE)"
          - "calculations.reserve_requirement_cents.formula (no implicit clamp)"
        distinguishing_aspect: |
          Each hold is individually affordable — 54000 cents of claim exposure against a 100000-cent
          balance — but the second one is measured against the REMAINING available balance of 46000,
          so the collective exposure is what trips priority 140. The refusal is not a silent
          reduction: no second hold row appears and the ledger is untouched. The coverage intervals
          are 48 hours apart, so HOLD_BUFFER_HOURS is satisfied and cannot be the cause.
