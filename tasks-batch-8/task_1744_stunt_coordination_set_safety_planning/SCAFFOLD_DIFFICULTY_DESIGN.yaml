              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Prio Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Guy", last_name: "Sev", base_day_rate_cents: 100000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/stop"
              payload: { reason: "weather" }
              as: SafetyOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-04T10:00:00Z", scheduled_end: "2026-08-04T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRODUCTION_STOPPED, http 409 — priority-5 state beats priority-7 safety (uncertified performer)"

      - name: pp_referential_vs_fiscal_on_pay_create
        grounds:
          - validations[priority=11]
          - validations[priority=13]
        distinguishing_aspect: |
          Pair business_referential vs business_fiscal (different categories than pp_state_vs_safety): a pay
          adjustment create whose performer belongs to ANOTHER production AND whose requested_pct 9.99 is far
          outside the MEDIUM cap must return ERR_CROSS_PRODUCTION_REFERENCE — referential wins over fiscal.
        test_recipe:
          setup:
            - "Productions P1 (with MEDIUM/FIGHT DRAFT sequence) and P2 (with QUALIFIED FIGHT performer)"
          setup_api_calls:
            - call: "POST /api/productions"
