            - { call: "POST /endowment/policies/${pf_pol}/adopt", payload: { expected_pool_version: "${pf_pv}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/managers", payload: { pool_id: "${pf_pool}", manager_name: "M PC2", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { pf_mgr: $.data.id } }
