          (120 days for GTE 120, 10.0% for LTE 10.0, 80.0% for GTE 80.0, 400 stems for GTE 400) and must
          all count as met, giving attainment_score 1.0000 and PASS; an implementation using strict
          > / < would fail all four and return FAIL. The control report is one unit off on two
          standards (119 and 10.1) and shows the discontinuity: the score barely moves (0.9950) but
          compliance drops to PARTIAL because failed_standard_codes is no longer empty.
