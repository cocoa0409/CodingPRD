            - call: "POST /flights"
              payload: { flight_number: "LX1602", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id, f1_v0: $.data.version }
          trigger:
            - call: "GET /flights/${f1}"
              payload: {}
              as: Captain
            - call: "PATCH /flights/${f1}/conditions"
              payload: { headwind_component_kt: 10 }
              as: LoadController
              captures: { f1_v1: $.data.version }
            - call: "POST /load-plans"
              payload: { flight_id: "${f1}", expected_flight_version: "${f1_v1}" }
              as: LoadController
              captures: { lp1: $.data.id, lp1_v0: $.data.version }
            - call: "GET /load-plans/${lp1}"
              payload: {}
              as: Captain
            - call: "POST /pax-lines"
              payload: { load_plan_id: "${lp1}", compartment_id: "${oc}", male_count: 25, female_count: 35 }
              as: LoadController
            - call: "POST /bag-allocations"
              payload: { load_plan_id: "${lp1}", compartment_id: "${h1}", bag_count: 112, bag_weight_kg: 1450 }
              as: LoadController
            - call: "POST /load-plans/${lp1}/compute"
              payload: {}
              as: LoadController
              captures: { lp1_v1: $.data.version }
            - call: "GET /load-plans/${lp1}"
              payload: {}
              as: Captain
          assert:
            - "the first read returns Flight.${f1}.version == ${f1_v0}"
            - "${f1_v1} > ${f1_v0}"
            - "the plan creation is HTTP 201 and does not change the flight's version"
            - "the read at position four returns LoadPlan.${lp1}.version == ${lp1_v0} and does not advance it"
            - "each of the passenger line, the bag allocation and the compute advances LoadPlan.${lp1}.version, so ${lp1_v1} > ${lp1_v0} + 1"
            - "the compute also advances Flight.${f1}.version beyond ${f1_v1} because the flight's load posture is written"
            - "the final read returns LoadPlan.${lp1}.version == ${lp1_v1}"
            - "Flight.${f1}.performance_limited_takeoff_weight_kg == 74170.00"
            - "LoadPlan.${lp1}.status == \"COMPUTED\""

      - name: stale_plan_version_rejected_on_sheet_issuance
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[load-sheet-issue-stale-plan]
          - endpoints[POST /load-plans/{id}/gate-bags]
          - errors[ERR_STALE_LOAD_PLAN_VERSION]
        distinguishing_aspect: |
          Issuance must quote the plan revision it actually read, and a
          gate-checked bag absorbed into the underload moves the plan on
          without leaving its COMPUTED state - so the plan-state rule at
          priority 10 cannot mask the concurrency rule at priority 15. The
          issuance quoting the pre-gate-bag version is 412
          ERR_STALE_LOAD_PLAN_VERSION with no sheet created, and re-quoting the
          current version issues a sheet carrying the post-gate-bag figures
          (58300.00 kg, index 86.48, payload 6200.00).
