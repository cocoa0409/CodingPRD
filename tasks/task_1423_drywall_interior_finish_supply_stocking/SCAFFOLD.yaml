    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/supply/products"
    description: "List products"
    roles: [CreditManager, EstimatorUser, DispatcherUser, Foreman, AccountsReceivableUser, WarehouseManager]
    code: 200
    input: ["limit?", "offset?", "board_kind?", "active?"]
    output: "Product[]"
    side_effects: []

  - method: PATCH
    path: "/supply/products/{id}"
    description: "Update product price / lead_time / active flag"
    roles: [WarehouseManager]
    code: 200
    input: ["unit_price_cents_per_sheet?", "lead_time_days?", "active?"]
    output: Product
    side_effects: []

  # --- BoomTruck ---
  - method: POST
    path: "/supply/boom-trucks"
    description: "Register a boom truck"
    roles: [DispatcherUser]
    code: 201
    input: [truck_code, max_bundle_capacity, max_weight_lbs]
    output: BoomTruck
    side_effects: ["active=true"]

  - method: GET
    path: "/supply/boom-trucks/{id}"
    description: "Fetch a boom truck"
    roles: [DispatcherUser, Foreman, WarehouseManager]
    code: 200
    input: []
    output: BoomTruck
    side_effects: []

  - method: GET
    path: "/supply/boom-trucks"
    description: "List boom trucks"
    roles: [DispatcherUser, Foreman, WarehouseManager]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: "BoomTruck[]"
    side_effects: []

  - method: PATCH
    path: "/supply/boom-trucks/{id}"
    description: "Update boom-truck capacity / active flag"
    roles: [DispatcherUser]
    code: 200
    input: ["max_bundle_capacity?", "max_weight_lbs?", "active?"]
    output: BoomTruck
    side_effects: []

  # --- Project ---
  - method: POST
    path: "/supply/projects"
    description: "Create a jobsite project under an account"
    roles: [EstimatorUser, ContractorAdmin]
    code: 201
    input: [account_id, jobsite_name, distance_miles, framing_pct_complete]
    output: Project
    side_effects: ["status=PLANNING"]

  - method: GET
    path: "/supply/projects/{id}"
    description: "Fetch a project"
    roles: [CreditManager, EstimatorUser, DispatcherUser, Foreman, ContractorAdmin]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/supply/projects"
    description: "List projects (filterable by account)"
    roles: [CreditManager, EstimatorUser, DispatcherUser, Foreman, ContractorAdmin]
    code: 200
    input: ["limit?", "offset?", "account_id?", "status?"]
    output: "Project[]"
    side_effects: []

  - method: PATCH
    path: "/supply/projects/{id}"
    description: "Update framing_pct_complete or distance_miles"
    roles: [Foreman, ContractorAdmin]
    code: 200
    input: ["framing_pct_complete?", "distance_miles?"]
    output: Project
    side_effects: []

  - method: POST
    path: "/supply/projects/{id}/open-stocking"
    description: "Move project PLANNING → STOCKING_OPEN"
    roles: [Foreman]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/supply/projects/{id}/close-stocking"
    description: "Move project STOCKING_OPEN → STOCKING_CLOSED"
    roles: [Foreman]
    code: 200
    input: []
    output: Project
    side_effects: ["DRAFT StockingOrders on this project → CANCELLED"]

  - method: POST
    path: "/supply/projects/{id}/cancel"
    description: "Cancel a project"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["Cascades to takeoffs and non-dispatched stocking orders"]

  # --- Takeoff ---
  - method: POST
    path: "/supply/takeoffs"
    description: "Create a draft takeoff under a project"
    roles: [EstimatorUser]
    code: 201
