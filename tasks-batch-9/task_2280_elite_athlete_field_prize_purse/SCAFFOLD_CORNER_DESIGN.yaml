              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { pr_id: "$.data.id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
          trigger:
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath_id}", agent_id: "00000000-0000-4000-8000-000000000001", qualifying_performance_id: "${pr_id}", division: ELITE }
              as: ElitesDirector
              captures: { err1: "$.data.error_id" }
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "00000000-0000-4000-8000-000000000002", agent_id: "${agt_id}", qualifying_performance_id: "${pr_id}", division: ELITE }
