              as: PatientNavigator
              captures: { c_st: $.data.clinical_status, c_rsn: $.data.closure_reason, c_nav: $.data.navigation_status }
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: PracticeAdmin
              captures: { oc1: $.data.open_episode_count, np1: $.data.navigation_priority }
            - call: "POST /screening-episodes/${ep_2}/close"
              payload: { reason: "PATIENT_DECLINED" }
              as: ReferralCoordinator
              captures: { eid: $.data.error_id }
            - call: "GET /screening-episodes/${ep_2}"
              payload: {}
              as: PracticeAdmin
              captures: { c_st2: $.data.clinical_status, c_rsn2: $.data.closure_reason }
          assert:
            - "${oc0} == 2 and ${np0} == HIGH"
            - "the close returns HTTP 200 with ${c_st} == CLOSED_SUPERSEDED, ${c_rsn} == SUPERSEDED_BY_OTHER_PATHWAY and ${c_nav} == NOT_STARTED - only the clinical dimension moved"
            - "${oc1} == 1 and ${np1} == ROUTINE"
            - "the second close returns HTTP 409 with ${eid} == ERR_INVALID_EPISODE_STATE"
            - "${c_st2} == CLOSED_SUPERSEDED and ${c_rsn2} == SUPERSEDED_BY_OTHER_PATHWAY - the reason was not overwritten"
            - "ScreeningEpisode.${ep_1}.clinical_status is still OPEN"
