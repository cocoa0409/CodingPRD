          A DIFFERENT metric on a DIFFERENT endpoint: the boundary here is a CUMULATIVE
          MINUTES ceiling (booked_minutes + candidate_minutes <= 480 inside one UTC
          calendar day), not a datetime instant, and it is exercised on POST
          /procurement/protests/{id}/hearings. Two 240-minute hearings sum to exactly 480,
