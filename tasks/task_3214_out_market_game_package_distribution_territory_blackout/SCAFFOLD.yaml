      - { name: game_id, type: string, source: input, description: "FK -> Game.id; specific game unlocked" }
      - { name: reason_code, type: enum, source: input, description: "constraints: GOODWILL | SERVICE_OUTAGE | REGULATORY", constraints: "enum: GOODWILL | SERVICE_OUTAGE | REGULATORY" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the SupportAgent who granted the override" }
      - { name: status, type: enum, source: system, description: "constraints: ACTIVE | RESCINDED", constraints: "enum: ACTIVE | RESCINDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: RightsGrant
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /rights-grants/{id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "rights_grant.status == ACTIVE"
        side_effects:
          - "Every Season of this grant transitions phase → POST (if not already POST)"
          - "Every Subscription whose season belongs to this grant and whose status == ACTIVE transitions status → CANCELLED (cancelled_at stamped) with entitlement_state → REVOKED"
          - "Every GameEntitlement under those subscriptions transitions → WITHDRAWN with withdrawn_reason ENTITLEMENT_REVOKED"
          - "Every VenueLicense under accounts of this distributor transitions → REVOKED"
        note: "Depth-4 cascade root: grant → season → subscription → entitlement"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock advance past effective_until"
        actor: system
        preconditions:
          - "logical clock >= effective_until"
        side_effects:
          - "Same cascade shape as TERMINATED (seasons → POST, subscriptions → CANCELLED, entitlements → WITHDRAWN/ENTITLEMENT_REVOKED, venue licenses → REVOKED)"
        note: "Auto-transition evaluated on every clock set"

  - entity: Season
    initial_state: PRE_SALE
    terminal_states: [POST]
    transitions:
      - from: PRE_SALE
        to: REGULAR
        trigger: "POST /seasons/{id}/advance-phase"
        actor: LeagueOps
        preconditions:
          - "season.phase == PRE_SALE"
          - "at least one WeekSlate exists for the season"
        side_effects:
          - "increments Season.version by 1"
        note: "Purchases remain allowed in REGULAR (in-season proration applies)"

      - from: REGULAR
        to: POST
        trigger: "POST /seasons/{id}/advance-phase"
        actor: LeagueOps
        preconditions:
          - "season.phase == REGULAR"
        side_effects:
          - "Every Subscription of this season with status == ACTIVE transitions status → EXPIRED (entitlement_state unchanged unless already REVOKED)"
          - "Every GameEntitlement under those subscriptions with status == GRANTED transitions → WITHDRAWN with withdrawn_reason ENTITLEMENT_REVOKED"
          - "increments Season.version by 1"
        note: "POST is terminal for sales and refunds; new purchases rejected with ERR_SEASON_CLOSED; EXPIRED (not CANCELLED) marks season-end termination for refund math"

  - entity: WeekSlate
    initial_state: PRELIMINARY
    terminal_states: [LOCKED]
    transitions:
      - from: PRELIMINARY
        to: FINALIZED
        trigger: "POST /week-slates/{id}/finalize"
        actor: LeagueOps
        preconditions:
          - "slate_status == PRELIMINARY"
          - "expected_slate_version matches current version (OCC)"
        side_effects:
          - "finalized_game_ids := package-eligible games computed by game_availability at finalize time (week games minus national selections, per-subscriber blackout irrelevant at slate level)"
          - "finalized_at := logical clock now"
          - "increments WeekSlate.version by 1"
        note: "FINALIZED freezes the national-selection picture subscribers see; corrections still possible"

      - from: FINALIZED
        to: PRELIMINARY
        trigger: "POST /week-slates/{id}/reopen"
        actor: LeagueOps
        preconditions:
          - "slate_status == FINALIZED"
        side_effects:
          - "finalized_game_ids := [] (cleared)"
          - "package_game_count recomputed (back to live count)"
          - "increments WeekSlate.version by 1"
        note: "Correction loop: FINALIZED → PRELIMINARY → FINALIZED (cyclic)"

      - from: FINALIZED
        to: LOCKED
        trigger: "POST /week-slates/{id}/lock"
        actor: LeagueOps
        preconditions:
          - "slate_status == FINALIZED"
          - "logical clock >= kickoff of the earliest game in the week"
        side_effects:
          - "national_game_ids frozen; further add/remove moves rejected"
          - "increments WeekSlate.version by 1"
        note: "LOCKED is terminal; slate corrections impossible after first kickoff"

      - from: PRELIMINARY
        to: PRELIMINARY
        trigger: "POST /week-slates/{id}/selections (add or remove national game)"
        actor: LeagueOps
        preconditions:
          - "slate_status == PRELIMINARY"
          - "expected_slate_version matches current version (OCC)"
          - "target game exists, belongs to this season, and has week_index == slate.week_index"
        side_effects:
          - "national_game_ids updated (game added in created_at order of the Game, or removed)"
          - "package_game_count recomputed"
          - "GameEntitlement sweep: entitlements for the moved game under ACTIVE subscriptions of this season transition GRANTED→WITHDRAWN (reason NATIONAL_SELECTION) on add, WITHDRAWN→GRANTED (withdrawn_reason cleared to null) on remove when reason was NATIONAL_SELECTION"
          - "increments WeekSlate.version by 1"
        note: "Self-transition; availability recomputation cascades into per-subscriber entitlements"

      - from: FINALIZED
        to: FINALIZED
        trigger: "POST /week-slates/{id}/selections (late national-selection move)"
        actor: LeagueOps
        preconditions:
          - "slate_status == FINALIZED"
          - "expected_slate_version matches current version (OCC)"
          - "target game exists, belongs to this season, and has week_index == slate.week_index"
        side_effects:
          - "national_game_ids updated"
          - "finalized_game_ids recomputed (still excludes new national games)"
          - "package_game_count recomputed"
          - "GameEntitlement sweep as in the PRELIMINARY self-transition"
          - "increments WeekSlate.version by 1"
        note: "Second non-linear cycle edge; LOCKED rejects all selection moves"

  - entity: Subscription
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED, EXPIRED]
    note: "Parallel dimensions: status (lifecycle) x entitlement_state (access posture) evolve independently on the same row"
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "system on successful initial CHARGE via POST /_payments/simulate"
        actor: system
        preconditions:
          - "subscription.status == PENDING_PAYMENT"
          - "simulated payment outcome == SUCCEEDED"
        side_effects:
          - "paid_amount_cents += price_charged_cents; Payment row (kind CHARGE) appended"
          - "entitlement_state := ENABLED"
          - "GameEntitlement rows created for every package-eligible game of every WeekSlate in the season (status GRANTED), skipping games national-selected at creation time"
        note: "Payment success activates; entitlement fan-out happens here"

      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "system on failed initial CHARGE via POST /_payments/simulate (outcome FAILED)"
        actor: system
        preconditions:
          - "subscription.status == PENDING_PAYMENT"
        side_effects:
          - "entitlement_state := REVOKED"
          - "cancelled_at := logical clock now"
        note: "No Payment row appended on failure"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Subscriber
        preconditions:
          - "subscription.status == ACTIVE"
          - "acting Subscriber owns the subscription (account_id == X-User-ID)"
        side_effects:
          - "cancelled_at := logical clock now"
          - "entitlement_state := REVOKED"
          - "Every GameEntitlement under this subscription with status == GRANTED transitions → WITHDRAWN with withdrawn_reason SUBSCRIPTION_CANCELLED"
        note: "Cancel is immediate; refund (if any) flows through ComplaintCase, not cancel"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system on Season REGULAR→POST advance or RightsGrant expiry/termination"
        actor: system
        preconditions:
          - "season.phase becomes POST or grant leaves ACTIVE"
        side_effects:
          - "GameEntitlements WITHDRAWN (reason ENTITLEMENT_REVOKED) per season/grant cascade"
        note: "EXPIRED differs from CANCELLED for refund math (cancel vs season-end)"

      - from: ACTIVE
        to: ACTIVE
        trigger: "entitlement_state ENABLED → SUSPENDED via POST /subscriptions/{id}/suspend-entitlement"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == ACTIVE"
          - "entitlement_state == ENABLED"
        side_effects:
          - "Streaming checks return NO_ENTITLEMENT while suspended; entitlements rows unchanged"
        note: "Parallel-dimension transition: lifecycle unchanged, access gated"

      - from: ACTIVE
        to: ACTIVE
        trigger: "entitlement_state SUSPENDED → ENABLED via POST /subscriptions/{id}/restore-entitlement"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == ACTIVE"
          - "entitlement_state == SUSPENDED"
        side_effects: []
        note: "Restore does not re-create WITHDRAWN entitlements"

  - entity: VenueLicense
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /venue-licenses/{id}/certify"
        actor: ComplianceAuditor
        preconditions:
          - "status == PENDING"
          - "fire_code_occupancy <= owning grant's max_commercial_occupancy_cap"
        side_effects:
          - "occupancy_tier derived by venue_fee tier boundaries"
          - "annual_fee_cents computed by venue_fee"
        note: "Certification snapshots tier + fee"

      - from: CERTIFIED
        to: CERTIFIED
        trigger: "POST /venue-licenses/{id}/recertify with new fire_code_occupancy"
        actor: ComplianceAuditor
        preconditions:
          - "status == CERTIFIED"
          - "new fire_code_occupancy > 0 and <= grant cap"
        side_effects:
          - "occupancy_tier recomputed; annual_fee_cents recomputed (fee may move tiers)"
        note: "Self-transition crossing tier boundaries"

      - from: [PENDING, CERTIFIED]
        to: SUSPENDED
        trigger: "POST /venue-licenses/{id}/suspend"
        actor: ComplianceAuditor
        preconditions:
          - "status in {PENDING, CERTIFIED}"
        side_effects: []

      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /venue-licenses/{id}/reinstate"
        actor: ComplianceAuditor
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "annual_fee_cents recomputed by venue_fee (current occupancy)"
        note: "Reinstate always lands CERTIFIED, even if suspension happened from PENDING (certifies on the way back)"

      - from: [PENDING, CERTIFIED, SUSPENDED]
        to: REVOKED
        trigger: "POST /venue-licenses/{id}/revoke or RightsGrant cascade"
        actor: ComplianceAuditor
        preconditions:
          - "status != REVOKED"
        side_effects: []
        note: "Terminal"

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{id}/flag-commercial-misuse"
        actor: ComplianceAuditor
        preconditions:
          - "account.status == ACTIVE"
          - "account.account_kind == RESIDENTIAL"
        side_effects:
          - "commercial_flag_reason := request reason"
          - "Every ACTIVE Subscription of the account: entitlement_state → SUSPENDED (lifecycle status unchanged)"
        note: "Enforcement against residential misuse gates streaming without cancelling billing"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{id}/clear-commercial-flag"
        actor: ComplianceAuditor
        preconditions:
          - "account.status == SUSPENDED"
        side_effects:
          - "commercial_flag_reason := null"
          - "Every ACTIVE Subscription of the account with entitlement_state == SUSPENDED: entitlement_state → ENABLED"
        note: "Reinstatement restores access; does not touch WITHDRAWN entitlements"

      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "account.status != CLOSED"
        side_effects:
          - "Every ACTIVE Subscription → CANCELLED with entitlement_state → REVOKED; entitlements WITHDRAWN (reason SUBSCRIPTION_CANCELLED)"
        note: "Terminal"

  - entity: ComplaintCase
    initial_state: OPEN
    terminal_states: [APPROVED_REFUND, DENIED]
    transitions:
      - from: OPEN
        to: APPROVED_REFUND
        trigger: "POST /complaint-cases/{id}/resolve with decision APPROVE"
        actor: SupportAgent
        preconditions:
          - "status == OPEN"
          - "category == BLACKOUT_DISPUTE"
          - "complaint filed within season.grace_days of subscription purchase (logical clock)"
        side_effects:
          - "refund_amount_cents := blackout_refund_amount(subscription)"
          - "Payment row (kind REFUND, amount refund_amount_cents) appended to the subscription"
          - "Subscription.paid_amount_cents -= refund_amount_cents"
          - "resolution_note := request note"
        note: "Refund computation depends on whether subscription is ACTIVE vs CANCELLED"

      - from: OPEN
        to: DENIED
        trigger: "POST /complaint-cases/{id}/resolve with decision DENY"
        actor: SupportAgent
        preconditions:
          - "status == OPEN"
        side_effects:
          - "resolution_note := request note"
          - "refund_amount_cents stays 0"
        note: "Denial available for any category"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /complaint-cases/{id}/escalate"
        actor: SupportAgent
        preconditions:
          - "status == OPEN"
        side_effects: []
        note: "Escalation is a holding state; only ESCALATED→OPEN returns it to resolvable"

      - from: ESCALATED
        to: OPEN
        trigger: "POST /complaint-cases/{id}/deescalate"
        actor: SupportAgent
        preconditions:
          - "status == ESCALATED"
        side_effects: []
        note: "Cyclic loop OPEN ⇄ ESCALATED"

  - entity: StudentVerification
    initial_state: VERIFIED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: VERIFIED
        to: EXPIRED
        trigger: "system clock advance past valid_through"
        actor: system
        preconditions:
          - "logical clock >= valid_through"
        side_effects:
          - "Future STUDENT purchases for the account rejected with ERR_STUDENT_NOT_VERIFIED"
        note: "Auto-transition on every clock set; existing subscriptions unaffected"

      - from: VERIFIED
        to: REVOKED
        trigger: "POST /student-verifications/{id}/revoke"
        actor: ComplianceAuditor
        preconditions:
          - "status == VERIFIED"
        side_effects: []
        note: "Terminal"

  - entity: EntitlementOverride
    initial_state: ACTIVE
    terminal_states: [RESCINDED]
    transitions:
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /entitlement-overrides/{id}/rescind"
        actor: SupportAgent
        preconditions:
          - "status == ACTIVE"
          - "acting SupportAgent is the same X-User-ID recorded in created_by (segregation of duties inverse: only the granting agent may rescind)"
        side_effects: []
        note: "ACTIVE overrides force verdict AVAILABLE in territory checks for (account, game)"

  - entity: Offer
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /offers/{id}/withdraw"
        actor: PlatformAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects: []
        note: "Withdrawn offers reject new purchases; existing subscriptions keep their tier snapshot"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: slate-selection-stale-version
    parent_entity: WeekSlate
    write_endpoint: "POST /week-slates/{id}/selections"
    occ_field: "expected_slate_version"
    description: |
      A national-selection move against a WeekSlate whose version has advanced
      since the client last observed it is rejected. Because a selection move
      legitimately recomputes package availability (and may be followed by
      another operator's corrective move), the writer's view of the slate is
      stale and must be refreshed before retrying.
    error_id: ERR_STALE_SLATE_VERSION
    http_status: 412

  - rule_id: slate-finalize-stale-version
    parent_entity: WeekSlate
    write_endpoint: "POST /week-slates/{id}/finalize"
    occ_field: "expected_slate_version"
    description: |
      Finalizing a WeekSlate whose version has advanced since the client last
      observed it is rejected; the finalized_game_ids snapshot must be computed
      against the current national-selection set, not a stale one.
    error_id: ERR_STALE_SLATE_VERSION
    http_status: 412

  - rule_id: season-advance-stale-version
    parent_entity: Season
    write_endpoint: "POST /seasons/{id}/advance-phase"
    occ_field: "expected_season_version"
    description: |
      Advancing a Season's phase against a stale observed version is rejected;
      phase advance cascades into every subscription of the season, so the
      operator must re-read the season (and its version) before re-issuing.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: territory_determination
    trigger: "POST /accounts/register (billing) and POST /territory-checks (device)"
    algorithm: lookup
    formula: |
      market_for_zip(zip):
        prefix = first 3 characters of zip
        candidates = Markets M where prefix IN M.zip_prefixes
        if exactly one candidate: return candidate.code
        if zero candidates: return null
        (overlap is impossible by Market uniqueness validation)
    input_set: "All Market rows regardless of creator"
    precision: "exact string match on 3-digit prefix"

  - name: effective_market
    trigger: "POST /territory-checks"
    algorithm: dual_variant
    formula: |
      Base rule (variant A — device-preferred):
        effective_market = device_market_code if device_market_code is not null
                           else billing_market_code
      Fallback rule (variant B — billing-authoritative):
        effective_market = billing_market_code
      Selection: variant B applies when account.status == SUSPENDED
      (commercial-misuse-flagged accounts lose device-location deference);
      variant A applies otherwise.
    input_set: "Account.billing_market_code, device_market_code resolved from request device_zip"
    variants:
      - name: device_preferred
        when: "account.status == ACTIVE"
        difference: "device market wins; only falls back to billing when device ZIP unmapped"
      - name: billing_authoritative
        when: "account.status == SUSPENDED"
        difference: "billing market always wins even when device ZIP maps to a different market"
    precision: "n/a (discrete market selection)"

  - name: game_availability
    trigger: "WeekSlate selection move / finalize / reopen; POST /territory-checks; subscription activation entitlement fan-out"
    algorithm: set_difference
    formula: |
      week_games(slate) = Games G where G.season_id == slate.season_id AND G.week_index == slate.week_index
      package_games(slate) = week_games(slate) - slate.national_game_ids
      package_game_count = len(package_games(slate))

      slate_posture(slate):
        PRELIMINARY → provisional view: package_games computed live (finalized_game_ids empty)
        FINALIZED   → official view: finalized_game_ids snapshot
        LOCKED      → official frozen view: finalized_game_ids immutable

      per_subscriber_availability(subscription, game):
        if subscription.entitlement_state != ENABLED → NO_ENTITLEMENT
        elif slate_posture in {FINALIZED, LOCKED} and game not in slate.finalized_game_ids → NOT_IN_PACKAGE
        elif slate_posture == PRELIMINARY and game in slate.national_game_ids → NOT_IN_PACKAGE
        elif game.home_market_code == effective_market(subscription.account, device_zip) → BLACKED_OUT
        else → AVAILABLE
      EntitlementOverride (status ACTIVE) for (account, game) forces AVAILABLE
      as the final step regardless of the chain above.
    input_set: "Games filtered by season_id and week_index; WeekSlate.national_game_ids / finalized_game_ids; Account markets"
    precision: "set semantics; ordering by Game.kickoff_at then Game.created_at for list output"

  - name: proration_factor
    trigger: "subscription purchase (charged_price); refund (blackout_refund_amount)"
    algorithm: dual_variant
    formula: |
      Let W = season.regular_season_weeks, p = subscription.purchase_week_index (1-based).

      Variant A — remaining-weeks (charge direction):
        factor_charge = (W - p + 1) / W
        Rationale: a subscriber buying in week p receives weeks p..W inclusive.

      Variant B — elapsed-weeks (refund direction):
        factor_refund = (p - 1) / W
        Rationale: refund of the consumed portion measures weeks already played
        before the purchase week.
    input_set: "Season.regular_season_weeks; Subscription.purchase_week_index"
    variants:
      - name: remaining_weeks
        when: "computing charged price at purchase"
        difference: "counts the purchase week itself as delivered value"
      - name: elapsed_weeks
        when: "computing consumed portion inside blackout refunds"
        difference: "excludes the purchase week; charges and refunds therefore use different week-count anchors by design"
    precision: "exact rational arithmetic; rounding only at the final cents step"

  - name: charged_price
    trigger: "POST /subscriptions"
    algorithm: tiered_pricing
    formula: |
      Evaluation order (pinned; circular-looking dependency resolved left-to-right):
        step 1: tier_base =
                  if offer.plan_tier == STUDENT:
                    round_half_up(offer.base_price_cents * (100 - season.student_discount_pct) / 100)
                  else:
                    offer.base_price_cents
        step 2: prorated = round_half_up(tier_base * (W - purchase_week_index + 1) / W)
                  where W = season.regular_season_weeks,
                        purchase_week_index = week containing logical-clock now
                        (clamped to [1, W]; purchases before week 1 → 1)
        step 3: price_charged_cents = prorated
      Note: the student discount applies to the FULL-season base BEFORE proration
      (step 1 before step 2); reversing the order changes the result when the
      discount percent produces a fractional cent.
    input_set: "Offer (must be status ACTIVE, within [valid_from, valid_until)); Season; logical clock"
    constants:
      PURCHASE_WEEK_CLAMP_MIN: 1
    precision: "integer cents, round_half_up at each labelled step"

  - name: blackout_refund_amount
    trigger: "ComplaintCase OPEN → APPROVED_REFUND"
    algorithm: waterfall_allocation
    formula: |
      Weekly value basis:
        weekly_value_cents = round_half_up(subscription.price_charged_cents / weeks_received)
        where weeks_received = (W - purchase_week_index + 1)  [remaining-weeks anchor]
      Refund waterfall:
        if subscription.status == CANCELLED:
          refund = 0            # cancelled subscriptions are not refund-eligible via complaint
        elif complaint filed after season.grace_days since purchase:
          rejected at validation (ERR_COMPLAINT_WINDOW_EXPIRED); never reaches here
        else:
          refund = min(weekly_value_cents, subscription.paid_amount_cents)
      The consumed portion (elapsed-weeks factor from proration_factor variant B)
      is NEVER refunded; only one weekly_value unit is refundable per complaint.
    input_set: "Subscription (price_charged_cents, paid_amount_cents, purchase_week_index, status); Season (regular_season_weeks, grace_days)"
    precision: "integer cents, round_half_up"

  - name: venue_fee
    trigger: "VenueLicense certify / recertify / reinstate"
    algorithm: tiered_pricing
    formula: |
      Tier boundaries on fire_code_occupancy (inclusive lower, inclusive upper of tier):
        T1: 1 <= occupancy <= 100       → fee =  500000 cents
        T2: 101 <= occupancy <= 500     → fee = 2000000 cents
        T3: occupancy >= 501            → fee = 6000000 cents
      Boundary rule: occupancy == 100 is T1; occupancy == 101 is T2;
      occupancy == 500 is T2; occupancy == 501 is T3.
      occupancy_tier and annual_fee_cents are derived together.
    input_set: "VenueLicense.fire_code_occupancy"
    constants:
      T1_MAX_OCCUPANCY: 100
      T2_MAX_OCCUPANCY: 500
      T1_FEE_CENTS: 500000
      T2_FEE_CENTS: 2000000
      T3_FEE_CENTS: 6000000
    precision: "exact integer cents"

  - name: multiview_entitlement
    trigger: "POST /multiview-sessions (start a multiview stream set)"
    algorithm: threshold
    formula: |
      eligible(subscription) =
        subscription.status == ACTIVE
        AND subscription.entitlement_state == ENABLED
        AND offer_snapshot(subscription).includes_multiview == true
      Concurrent-stream cap: an account may hold at most MAX_MULTIVIEW_SESSIONS
      active multiview sessions; starting one when active_count >= cap is rejected
      (boundary: active_count == cap - 1 succeeds; active_count == cap fails).
      Session ordering for cap enforcement is by created_at ASC of active sessions;
      the oldest session is never auto-evicted — the new request is rejected instead.
    input_set: "Subscription + its Offer snapshot; active MultiviewSession rows for the account"
    constants:
      MAX_MULTIVIEW_SESSIONS: 2
    precision: "integer count comparison, >= semantics"

  - name: companion_entitlement
    trigger: "GET /subscriptions/{id}/features"
    algorithm: aggregation
    formula: |
      features(subscription) = {
        multiview:  offer.includes_multiview  AND entitlement_state == ENABLED,
        companion:  offer.includes_companion  AND entitlement_state == ENABLED,
        package_games_available_this_week:
          count of GameEntitlement rows for this subscription
          with status == GRANTED and week_index == current week (from logical clock),
          minus rows whose game.home_market_code == account.billing_market_code
      }
      Derived read-only aggregation; recomputed on every call (no caching).
    input_set: "Subscription, Offer snapshot, GameEntitlement rows status == GRANTED, Account.billing_market_code"
    precision: "integer count"

  - name: complaint_window_check
    trigger: "POST /complaint-cases and resolve APPROVE"
    algorithm: threshold
    formula: |
      eligible = (logical_clock_now - subscription_purchase_time) <= season.grace_days * 86400 seconds
      Boundary: exactly grace_days after purchase is still eligible (<=);
      one second beyond is not.
    input_set: "Subscription.created_at; Season.grace_days; logical clock"
    precision: "second granularity, <= inclusive boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value must be one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /accounts/register"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (grant → season → week-slate / offer; account → subscription / venue-license / complaint-case / student-verification)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: state
    check: "Target resource in a valid source state for the requested transition (per §1.2); non-terminal wrong-state calls return ERR_INVALID_STATE while calls against terminal states return ERR_ALREADY_TERMINAL"
    error_id: ERR_INVALID_STATE | ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "Season phase gate: purchases require season.phase in {PRE_SALE, REGULAR}; POST phase rejects purchase with ERR_SEASON_CLOSED"
    error_id: ERR_SEASON_CLOSED
    http_status: 409
    applies_to: "POST /subscriptions"

  - priority: 6
    category: state
    check: "OCC: expected_*_version payload field equals the parent's current version"
    error_id: "ERR_STALE_SLATE_VERSION | ERR_STALE_SEASON_VERSION"
    http_status: 412
    applies_to: "POST /week-slates/{id}/selections, POST /week-slates/{id}/finalize, POST /seasons/{id}/advance-phase"

  - priority: 7
    category: business_temporal
    check: "Offer window: offer.status == ACTIVE and logical clock within [valid_from, valid_until)"
    error_id: ERR_OFFER_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /subscriptions"

  - priority: 8
    category: business_referential
    check: "Student tier gate: STUDENT offers require an Account StudentVerification with status == VERIFIED and valid_through > logical clock"
    error_id: ERR_STUDENT_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /subscriptions"

  - priority: 9
    category: business_referential
    check: "Account-kind gate: COMMERCIAL accounts may not purchase retail offers (BASE/PREMIUM/STUDENT); RESIDENTIAL accounts may not hold VenueLicenses"
    error_id: ERR_ACCOUNT_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /subscriptions, POST /venue-licenses"

  - priority: 10
    category: business_temporal
    check: "Game week consistency: a selection move's game_id must belong to the slate's season and have week_index == slate.week_index; kickoff_at must fall inside the week window"
    error_id: ERR_GAME_WEEK_MISMATCH
    http_status: 422
    applies_to: "POST /week-slates/{id}/selections, POST /games"

  - priority: 11
    category: business_constraint
    check: "National-selection membership: removing a game not present in national_game_ids rejected; adding a game already present rejected (no duplicates)"
    error_id: ERR_NATIONAL_SELECTION_CONFLICT
    http_status: 409
    applies_to: "POST /week-slates/{id}/selections"

  - priority: 12
    category: business_constraint
    check: "Slate not locked: selection moves and reopen rejected when slate_status == LOCKED"
    error_id: ERR_SLATE_LOCKED
    http_status: 409
    applies_to: "POST /week-slates/{id}/selections, POST /week-slates/{id}/reopen"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: Market.code, Season label within grant, and Account email (case-insensitive) collisions return ERR_DUPLICATE_RESOURCE; a 3-digit ZIP prefix may appear in at most one Market across the whole system (ERR_MARKET_PREFIX_OVERLAP)"
    error_id: ERR_MARKET_PREFIX_OVERLAP | ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /markets, PUT /markets/{id}"

  - priority: 14
    category: business_constraint
    check: "Season structural bounds: week_index within [1, season.regular_season_weeks]; one WeekSlate per (season, week_index); Game.away_team_code != Game.home_team_code; Game.home_market_code references an existing Market"
    error_id: ERR_SEASON_STRUCTURE
    http_status: 422
    applies_to: "POST /week-slates, POST /games"

  - priority: 15
    category: business_safety
    check: "Venue occupancy cap: fire_code_occupancy <= parent grant's max_commercial_occupancy_cap and > 0"
    error_id: ERR_OCCUPANCY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /venue-licenses, POST /venue-licenses/{id}/certify, POST /venue-licenses/{id}/recertify"

  - priority: 16
    category: business_temporal
    check: "Complaint window: BLACKOUT_DISPUTE approval requires the complaint to have been filed within season.grace_days of subscription purchase (inclusive boundary)"
    error_id: ERR_COMPLAINT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /complaint-cases/{id}/resolve"

  - priority: 17
    category: business_constraint
    check: "Complaint category gate: APPROVE decisions only valid for category == BLACKOUT_DISPUTE; BILLING/QUALITY complaints may only be DENIED or ESCALATED"
    error_id: ERR_COMPLAINT_NOT_REFUNDABLE
    http_status: 422
    applies_to: "POST /complaint-cases/{id}/resolve"

  - priority: 18
    category: business_fiscal
    check: "Refund floor: approved refund must be > 0 and <= subscription.paid_amount_cents; refunds against CANCELLED subscriptions compute to 0 and are rejected"
    error_id: ERR_REFUND_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /complaint-cases/{id}/resolve"

  - priority: 19
    category: business_constraint
    check: "Multiview cap: starting a multiview session when the account already holds MAX_MULTIVIEW_SESSIONS active sessions is rejected"
    error_id: ERR_MULTIVIEW_CAP_REACHED
    http_status: 409
    applies_to: "POST /multiview-sessions"

  - priority: 20
    category: business_constraint
    check: "Multiview entitlement: subscription's offer snapshot must include multiview and entitlement_state == ENABLED"
    error_id: ERR_FEATURE_NOT_ENTITLED
    http_status: 403
    applies_to: "POST /multiview-sessions"

  - priority: 21
    category: business_constraint
    check: "Ownership: Subscriber acting on a subscription/complaint/territory-check must own the parent account (X-User-ID == account_id); SupportAgent rescinding an override must be its created_by"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "subscriber-scoped endpoints, POST /entitlement-overrides/{id}/rescind"

  - priority: 22
    category: business_referential
    check: "Input shape: required fields present, enum members valid, ZIPs 5-digit numeric, datetimes ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["Re-evaluates time-based auto-transitions: RightsGrant ACTIVE→EXPIRED past effective_until; StudentVerification VERIFIED→EXPIRED past valid_through"]

  # --- Payment simulation (test-driving) ---
  - method: POST
    path: "/_payments/simulate"
    description: "Simulate the payment-gateway outcome for a PENDING_PAYMENT subscription's initial charge"
    roles: [PlatformAdmin]
    code: 200
    input: [subscription_id, outcome]
    output: Subscription
    side_effects: ["outcome SUCCEEDED: Subscription PENDING_PAYMENT→ACTIVE + entitlement fan-out per §1.2; outcome FAILED: PENDING_PAYMENT→CANCELLED"]

  # --- Rights grants ---
  - method: POST
    path: "/rights-grants"
    description: "Create a league rights grant to a distribution partner"
    roles: [PlatformAdmin]
    code: 201
    input: [distributor_name, scope, exclusivity, effective_from, effective_until, max_commercial_occupancy_cap]
    output: RightsGrant
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/rights-grants"
    description: "List rights grants"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RightsGrant[]"
    side_effects: []

  - method: GET
    path: "/rights-grants/{id}"
    description: "Get a rights grant"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor]
    code: 200
    input: []
    output: RightsGrant
    side_effects: []

  - method: POST
    path: "/rights-grants/{id}/terminate"
    description: "Terminate a grant (cascades to seasons, subscriptions, entitlements, venue licenses)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RightsGrant
    side_effects: ["§1.2 RightsGrant ACTIVE→TERMINATED cascade"]

  # --- Seasons ---
  - method: POST
    path: "/seasons"
    description: "Create a season under a rights grant"
    roles: [LeagueOps, PlatformAdmin]
    code: 201
    input: [rights_grant_id, label, regular_season_weeks, season_start_date, season_end_date, "grace_days?", "student_discount_pct?"]
    output: Season
    side_effects: ["phase=PRE_SALE"]

  - method: GET
    path: "/seasons"
    description: "List seasons (filtered)"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor, SupportAgent]
    code: 200
    input: ["rights_grant_id?", "phase?", "limit?", "offset?"]
    output: "Season[]"
    side_effects: []

  - method: GET
    path: "/seasons/{id}"
    description: "Get a season"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor, SupportAgent]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: POST
    path: "/seasons/{id}/advance-phase"
    description: "Advance season phase PRE_SALE→REGULAR→POST (OCC on Season.version)"
    roles: [LeagueOps]
    code: 200
    input: [expected_season_version]
    output: Season
    side_effects: ["§1.2 Season transitions; increments Season.version by 1"]

  # --- Markets ---
  - method: POST
    path: "/markets"
    description: "Create a broadcast market with ZIP prefixes and home teams"
    roles: [LeagueOps, PlatformAdmin]
    code: 201
    input: [code, name, zip_prefixes, home_team_codes]
    output: Market
    side_effects: []

  - method: GET
    path: "/markets"
    description: "List markets"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor, SupportAgent]
    code: 200
    input: ["limit?", "offset?", "code?"]
    output: "Market[]"
    side_effects: []

  - method: GET
    path: "/markets/{id}"
    description: "Get a market"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor, SupportAgent]
    code: 200
    input: []
    output: Market
    side_effects: []

  # --- Games ---
  - method: POST
    path: "/games"
    description: "Schedule a game into a season week"
    roles: [LeagueOps, PlatformAdmin]
    code: 201
    input: [season_id, week_index, away_team_code, home_team_code, kickoff_at, home_market_code]
    output: Game
    side_effects: ["Owning WeekSlate (if one exists for (season, week_index)) package_game_count recomputed"]

  - method: GET
    path: "/games"
    description: "List games (filtered)"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor, SupportAgent, Subscriber, VenueManager]
    code: 200
    input: ["season_id?", "week_index?", "home_market_code?", "limit?", "offset?"]
    output: "Game[]"
    side_effects: []

  - method: GET
    path: "/games/{id}"
    description: "Get a game"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor, SupportAgent, Subscriber, VenueManager]
    code: 200
    input: []
    output: Game
    side_effects: []

  # --- Week slates ---
  - method: POST
    path: "/week-slates"
    description: "Create the weekly slate for (season, week_index)"
    roles: [LeagueOps, PlatformAdmin]
    code: 201
    input: [season_id, week_index]
    output: WeekSlate
    side_effects: ["slate_status=PRELIMINARY, national_game_ids=[], finalized_game_ids=[], package_game_count computed"]

  - method: GET
    path: "/week-slates"
    description: "List week slates (filtered)"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor, SupportAgent]
    code: 200
    input: ["season_id?", "slate_status?", "limit?", "offset?"]
    output: "WeekSlate[]"
    side_effects: []

  - method: GET
    path: "/week-slates/{id}"
    description: "Get a week slate"
    roles: [PlatformAdmin, LeagueOps, ComplianceAuditor, SupportAgent]
    code: 200
    input: []
    output: WeekSlate
    side_effects: []

  - method: POST
    path: "/week-slates/{id}/selections"
    description: "Add or remove a national broadcast selection (OCC on WeekSlate.version)"
    roles: [LeagueOps]
    code: 200
    input: [game_id, action, expected_slate_version]
    output: WeekSlate
    side_effects: ["§1.2 WeekSlate self-transition: national_game_ids updated, package_game_count recomputed, GameEntitlement sweep; increments WeekSlate.version by 1"]

  - method: POST
    path: "/week-slates/{id}/finalize"
    description: "Finalize the slate (snapshot finalized_game_ids; OCC on WeekSlate.version)"
    roles: [LeagueOps]
    code: 200
    input: [expected_slate_version]
    output: WeekSlate
    side_effects: ["§1.2 PRELIMINARY→FINALIZED; increments WeekSlate.version by 1"]

  - method: POST
    path: "/week-slates/{id}/reopen"
    description: "Reopen a finalized slate for corrections (clears finalized snapshot)"
    roles: [LeagueOps]
    code: 200
    input: []
    output: WeekSlate
    side_effects: ["§1.2 FINALIZED→PRELIMINARY; increments WeekSlate.version by 1"]

  - method: POST
    path: "/week-slates/{id}/lock"
    description: "Lock the slate at/after the week's first kickoff"
    roles: [LeagueOps]
    code: 200
    input: []
    output: WeekSlate
    side_effects: ["§1.2 FINALIZED→LOCKED; increments WeekSlate.version by 1"]

  # --- Offers ---
  - method: POST
    path: "/offers"
    description: "Create a purchasable offer for a season"
    roles: [PlatformAdmin]
    code: 201
    input: [season_id, plan_tier, base_price_cents, includes_multiview, includes_companion, valid_from, valid_until]
    output: Offer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/offers"
    description: "List offers (filtered)"
    roles: [PlatformAdmin, LeagueOps, SupportAgent, Subscriber]
    code: 200
    input: ["season_id?", "plan_tier?", "status?", "limit?", "offset?"]
    output: "Offer[]"
    side_effects: []

  - method: GET
    path: "/offers/{id}"
    description: "Get an offer"
    roles: [PlatformAdmin, LeagueOps, SupportAgent, Subscriber]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: POST
    path: "/offers/{id}/withdraw"
    description: "Withdraw an offer (existing subscriptions keep their snapshots)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: ["status → WITHDRAWN"]

  # --- Accounts ---
  - method: POST
    path: "/accounts/register"
    description: "Register an account (residential or commercial); resolves billing_market_code from billing_zip"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, account_kind, billing_zip]
    output: Account
    side_effects: ["status=ACTIVE; billing_market_code computed by territory_determination"]

  - method: GET
    path: "/accounts"
    description: "List accounts (filtered)"
    roles: [PlatformAdmin, ComplianceAuditor, SupportAgent]
    code: 200
    input: ["status?", "account_kind?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []

  - method: GET
    path: "/accounts/{id}"
    description: "Get an account"
    roles: [PlatformAdmin, ComplianceAuditor, SupportAgent]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: PUT
    path: "/accounts/{id}"
    description: "Update account mutable fields (billing ZIP re-resolves billing_market_code)"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["full_name?", "billing_zip?"]
    output: Account
    side_effects: ["billing_market_code recomputed when billing_zip changes"]

  - method: POST
    path: "/accounts/{id}/flag-commercial-misuse"
    description: "Flag a RESIDENTIAL account for commercial misuse (suspends entitlements)"
    roles: [ComplianceAuditor]
    code: 200
    input: [reason]
    output: Account
    side_effects: ["§1.2 Account ACTIVE→SUSPENDED cascade"]

  - method: POST
    path: "/accounts/{id}/clear-commercial-flag"
    description: "Clear the misuse flag (restores suspended entitlements)"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: Account
    side_effects: ["§1.2 Account SUSPENDED→ACTIVE cascade"]

  - method: POST
    path: "/accounts/{id}/close"
    description: "Close an account (cancels active subscriptions)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["§1.2 Account → CLOSED cascade"]

  # --- Student verifications ---
  - method: POST
    path: "/student-verifications"
    description: "Create a student verification for an account"
    roles: [ComplianceAuditor, PlatformAdmin]
    code: 201
    input: [account_id, institution_name, verification_method, valid_through]
    output: StudentVerification
    side_effects: ["status=VERIFIED"]

  - method: GET
    path: "/student-verifications"
    description: "List student verifications (filtered)"
    roles: [ComplianceAuditor, PlatformAdmin, SupportAgent]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "StudentVerification[]"
    side_effects: []

  - method: GET
    path: "/student-verifications/{id}"
    description: "Get a student verification"
    roles: [ComplianceAuditor, PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: StudentVerification
    side_effects: []

  - method: POST
    path: "/student-verifications/{id}/revoke"
    description: "Revoke a verification"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: StudentVerification
    side_effects: ["status → REVOKED"]

  # --- Venue licenses ---
  - method: POST
    path: "/venue-licenses"
    description: "Apply for a commercial venue license (COMMERCIAL accounts only)"
    roles: [VenueManager]
    code: 201
    input: [account_id, venue_name, venue_zip, fire_code_occupancy]
    output: VenueLicense
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/venue-licenses"
    description: "List venue licenses (filtered)"
    roles: [ComplianceAuditor, PlatformAdmin, SupportAgent, VenueManager]
    code: 200
    input: ["account_id?", "status?", "occupancy_tier?", "limit?", "offset?"]
    output: "VenueLicense[]"
    side_effects: []

  - method: GET
    path: "/venue-licenses/{id}"
    description: "Get a venue license"
    roles: [ComplianceAuditor, PlatformAdmin, SupportAgent, VenueManager]
    code: 200
    input: []
    output: VenueLicense
    side_effects: []

  - method: POST
    path: "/venue-licenses/{id}/certify"
    description: "Certify a pending license (derives tier and fee)"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: VenueLicense
    side_effects: ["§1.2 PENDING→CERTIFIED; venue_fee computed"]

  - method: POST
    path: "/venue-licenses/{id}/recertify"
    description: "Update certified occupancy (re-derives tier and fee)"
    roles: [ComplianceAuditor]
    code: 200
    input: [fire_code_occupancy]
    output: VenueLicense
    side_effects: ["§1.2 CERTIFIED self-transition; venue_fee recomputed"]

  - method: POST
    path: "/venue-licenses/{id}/suspend"
    description: "Suspend a license"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: VenueLicense
    side_effects: ["§1.2 → SUSPENDED"]

  - method: POST
    path: "/venue-licenses/{id}/reinstate"
    description: "Reinstate a suspended license (recomputes fee)"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: VenueLicense
    side_effects: ["§1.2 SUSPENDED→CERTIFIED; venue_fee recomputed"]

  - method: POST
    path: "/venue-licenses/{id}/revoke"
    description: "Revoke a license (terminal)"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: VenueLicense
    side_effects: ["§1.2 → REVOKED"]

  # --- Subscriptions ---
  - method: POST
    path: "/subscriptions"
    description: "Purchase an offer (creates PENDING_PAYMENT subscription; price computed by charged_price)"
    roles: [Subscriber, VenueManager]
    code: 201
    input: [account_id, offer_id]
    output: Subscription
    side_effects: ["status=PENDING_PAYMENT, entitlement_state=ENABLED, purchase_week_index and price_charged_cents computed by charged_price; plan_tier + season_id snapshotted from offer"]

  - method: GET
    path: "/subscriptions"
    description: "List subscriptions (filtered)"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor]
    code: 200
    input: ["account_id?", "season_id?", "status?", "entitlement_state?", "limit?", "offset?", "offer_id?"]
    output: "Subscription[]"
    side_effects: []

  - method: GET
    path: "/subscriptions/{id}"
    description: "Get a subscription"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor, Subscriber, VenueManager]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel an active subscription (owner only)"
    roles: [Subscriber, VenueManager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["§1.2 ACTIVE→CANCELLED cascade; entitlements WITHDRAWN (SUBSCRIPTION_CANCELLED)"]

  - method: POST
    path: "/subscriptions/{id}/suspend-entitlement"
    description: "Suspend the entitlement dimension (parallel state)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["entitlement_state ENABLED→SUSPENDED"]

  - method: POST
    path: "/subscriptions/{id}/restore-entitlement"
    description: "Restore a suspended entitlement dimension"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["entitlement_state SUSPENDED→ENABLED"]

  - method: GET
    path: "/subscriptions/{id}/features"
    description: "Computed read: multiview/companion entitlements and available package game count (companion_entitlement)"
    roles: [PlatformAdmin, SupportAgent, Subscriber, VenueManager]
    code: 200
    input: []
    output: { multiview: boolean, companion: boolean, package_games_available_this_week: integer }
    side_effects: []

  - method: GET
    path: "/subscriptions/{id}/payments"
    description: "List the payment ledger rows of a subscription"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  # --- Territory checks ---
  - method: POST
    path: "/territory-checks"
    description: "Run a device-location territory check for (subscription, game); appends an immutable TerritoryCheck evidence row"
    roles: [Subscriber, VenueManager, SupportAgent]
    code: 201
    input: [account_id, subscription_id, game_id, device_zip]
    output: TerritoryCheck
    side_effects: ["verdict computed by game_availability.per_subscriber_availability with effective_market variant selection"]

  - method: GET
    path: "/territory-checks"
    description: "List territory checks (filtered)"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor]
    code: 200
    input: ["account_id?", "subscription_id?", "game_id?", "verdict?", "limit?", "offset?"]
    output: "TerritoryCheck[]"
    side_effects: []

  - method: GET
    path: "/territory-checks/{id}"
    description: "Get a territory check"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor]
    code: 200
    input: []
    output: TerritoryCheck
    side_effects: []

  # --- Game entitlements ---
  - method: GET
    path: "/game-entitlements"
    description: "List game entitlements (filtered)"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor]
    code: 200
    input: ["subscription_id?", "game_id?", "week_index?", "status?", "limit?", "offset?"]
    output: "GameEntitlement[]"
    side_effects: []

  - method: GET
    path: "/game-entitlements/{id}"
    description: "Get a game entitlement"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor]
    code: 200
    input: []
    output: GameEntitlement
    side_effects: []

  # --- Complaint cases ---
  - method: POST
    path: "/complaint-cases"
    description: "File a complaint (blackout dispute, billing, or quality)"
    roles: [Subscriber, VenueManager]
    code: 201
    input: [account_id, subscription_id, game_id, category, detail]
    output: ComplaintCase
    side_effects: ["status=OPEN; refund_amount_cents=0"]

  - method: GET
    path: "/complaint-cases"
    description: "List complaint cases (filtered)"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor]
    code: 200
    input: ["account_id?", "subscription_id?", "game_id?", "status?", "category?", "limit?", "offset?"]
    output: "ComplaintCase[]"
    side_effects: []

  - method: GET
    path: "/complaint-cases/{id}"
    description: "Get a complaint case"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor, Subscriber]
    code: 200
    input: []
    output: ComplaintCase
    side_effects: []

  - method: POST
    path: "/complaint-cases/{id}/resolve"
    description: "Resolve an open complaint (APPROVE refunds BLACKOUT_DISPUTE only; DENY always available)"
    roles: [SupportAgent]
    code: 200
    input: [decision, note]
    output: ComplaintCase
    side_effects: ["§1.2 OPEN→APPROVED_REFUND cascade (Payment REFUND row + paid_amount_cents decrement) or OPEN→DENIED"]

  - method: POST
    path: "/complaint-cases/{id}/escalate"
    description: "Escalate an open complaint"
    roles: [SupportAgent]
    code: 200
    input: []
    output: ComplaintCase
    side_effects: ["status OPEN→ESCALATED"]

  - method: POST
    path: "/complaint-cases/{id}/deescalate"
    description: "Return an escalated complaint to open"
    roles: [SupportAgent]
    code: 200
    input: []
    output: ComplaintCase
    side_effects: ["status ESCALATED→OPEN"]

  # --- Entitlement overrides ---
  - method: POST
    path: "/entitlement-overrides"
    description: "Grant a per-game entitlement override to an account (goodwill / outage / regulatory)"
    roles: [SupportAgent]
    code: 201
    input: [account_id, game_id, reason_code]
    output: EntitlementOverride
    side_effects: ["status=ACTIVE; created_by := X-User-ID"]

  - method: GET
    path: "/entitlement-overrides"
    description: "List entitlement overrides (filtered)"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor]
    code: 200
    input: ["account_id?", "game_id?", "status?", "limit?", "offset?"]
    output: "EntitlementOverride[]"
    side_effects: []

  - method: GET
    path: "/entitlement-overrides/{id}"
    description: "Get an entitlement override"
    roles: [PlatformAdmin, SupportAgent, ComplianceAuditor]
    code: 200
    input: []
    output: EntitlementOverride
    side_effects: []

  - method: POST
    path: "/entitlement-overrides/{id}/rescind"
    description: "Rescind an override (only the granting agent may rescind)"
    roles: [SupportAgent]
    code: 200
    input: []
    output: EntitlementOverride
    side_effects: ["status ACTIVE→RESCINDED"]

  # --- Multiview sessions ---
  - method: POST
    path: "/multiview-sessions"
    description: "Start a multiview session (cap MAX_MULTIVIEW_SESSIONS active per account)"
    roles: [Subscriber, VenueManager]
    code: 201
    input: [subscription_id]
    output: { multiview_session_id: string, active_count: integer }
    side_effects: ["multiview_entitlement eligibility + cap enforced; session tracked in-memory per account"]

  - method: POST
    path: "/multiview-sessions/{id}/end"
    description: "End a multiview session (frees a slot)"
    roles: [Subscriber, VenueManager]
    code: 200
    input: []
    output: { multiview_session_id: string, active_count: integer }
    side_effects: ["session removed from the account's active set"]


# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource (left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, invalid enum member, bad ZIP, bad datetime" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid source state for the requested transition" }
  - { id: ERR_STALE_SLATE_VERSION, http: 412, condition: "expected_slate_version does not match the WeekSlate's current version" }
  - { id: ERR_STALE_SEASON_VERSION, http: 412, condition: "expected_season_version does not match the Season's current version" }
  - { id: ERR_SEASON_CLOSED, http: 409, condition: "Purchase attempted against a season in phase POST" }
  - { id: ERR_OFFER_NOT_AVAILABLE, http: 409, condition: "Offer WITHDRAWN or logical clock outside [valid_from, valid_until)" }
  - { id: ERR_STUDENT_NOT_VERIFIED, http: 422, condition: "STUDENT offer purchase without a VERIFIED, unexpired StudentVerification" }
  - { id: ERR_ACCOUNT_KIND_MISMATCH, http: 422, condition: "COMMERCIAL account buying a retail offer, or RESIDENTIAL account applying for a venue license" }
  - { id: ERR_GAME_WEEK_MISMATCH, http: 422, condition: "Game's (season, week_index) inconsistent with the target slate, or kickoff outside the week window" }
  - { id: ERR_NATIONAL_SELECTION_CONFLICT, http: 409, condition: "Adding an already-selected game or removing a game not in national_game_ids" }
  - { id: ERR_SLATE_LOCKED, http: 409, condition: "Selection move or reopen against a LOCKED slate" }
  - { id: ERR_MARKET_PREFIX_OVERLAP, http: 409, condition: "ZIP prefix already claimed by another Market" }
  - { id: ERR_SEASON_STRUCTURE, http: 422, condition: "week_index out of season bounds, duplicate slate for (season, week), away == home team, or unknown home_market_code" }
  - { id: ERR_OCCUPANCY_CAP_EXCEEDED, http: 422, condition: "fire_code_occupancy <= 0 or above the parent grant's max_commercial_occupancy_cap" }
  - { id: ERR_COMPLAINT_WINDOW_EXPIRED, http: 422, condition: "BLACKOUT_DISPUTE approval attempted for a complaint filed beyond season.grace_days after purchase" }
  - { id: ERR_COMPLAINT_NOT_REFUNDABLE, http: 422, condition: "APPROVE decision on a non-BLACKOUT_DISPUTE complaint" }
  - { id: ERR_REFUND_NOT_AVAILABLE, http: 422, condition: "Computed refund is 0 (cancelled subscription) or exceeds paid_amount_cents" }
  - { id: ERR_MULTIVIEW_CAP_REACHED, http: 409, condition: "Account already holds MAX_MULTIVIEW_SESSIONS active multiview sessions" }
  - { id: ERR_FEATURE_NOT_ENTITLED, http: 403, condition: "Subscription's offer snapshot lacks the feature or entitlement_state != ENABLED" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting user does not own the account-scoped resource (or rescinding agent is not the override's created_by)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Unique-field collision (market code, season label within grant, account email)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; only account registration"
    identity: opaque
    exclusive_operations: ["POST /accounts/register"]
    shared_operations: []

  - name: PlatformAdmin
    description: "Distribution-partner platform operator; owns grants, offers, accounts lifecycle, payment simulation, clock"
    identity: opaque
    exclusive_operations: ["rights-grant create/terminate", "offer create/withdraw", "account close", "subscription entitlement suspend/restore", "clock set", "payment simulation"]
    shared_operations: ["read-most list/get endpoints", "season create", "market create", "game create", "week-slate create", "account update", "student verification create"]

  - name: LeagueOps
    description: "League operations; owns seasons, markets, games, weekly slates and national selections"
    identity: opaque
    exclusive_operations: ["season advance-phase", "week-slate selections/finalize/reopen/lock"]
    shared_operations: ["season create", "market create", "game create", "week-slate create", "read endpoints"]

  - name: Subscriber
    description: "Residential account holder; purchases offers, cancels own subscription, runs territory checks, files complaints, uses multiview"
    identity: "entity_backed:Account"
    exclusive_operations: ["subscriber-scoped cancel/territory-check/complaint filing"]
    shared_operations: ["offer/game reads", "multiview sessions", "subscription create"]

  - name: VenueManager
    description: "Commercial establishment operator; applies for venue licenses, purchases subscriptions for the venue, uses multiview"
    identity: "entity_backed:Account"
    exclusive_operations: ["venue-license apply"]
    shared_operations: ["subscription create/cancel", "territory checks", "multiview sessions", "game reads"]

  - name: SupportAgent
    description: "Customer service; handles complaints and entitlement overrides"
    identity: opaque
    exclusive_operations: ["complaint resolve/escalate/deescalate", "entitlement-override grant/rescind"]
    shared_operations: ["read endpoints", "account update", "territory checks"]

  - name: ComplianceAuditor
    description: "Enforcement; venue certification, commercial-misuse flags, student verification revocation"
    identity: opaque
    exclusive_operations: ["venue-license certify/recertify/suspend/reinstate/revoke", "account commercial-misuse flag/clear", "student verification revoke"]
    shared_operations: ["read endpoints", "student verification create"]

