  - section: calculations
    instances:
      - name: provisional_final_divergence_covered
        claim_type: variant_divergence
        grounds: ["calculations.load_final_charge"]
        excluded_because:
          difficulty_instance: provisional_vs_final_load_pricing
          rationale: "Variant divergence with exact literals asserted in the named §1.8 instance."

      - name: admixture_rounding_covered
        claim_type: precision
        grounds: ["calculations.batch_weights_and_dosing"]
        excluded_because:
          difficulty_instance: admixture_round_per_line_then_sum
          rationale: "Round-per-line-then-sum pinned with literal 142.2 in the named §1.8 instance."

      - name: wc_ratio_rounded_equality_not_over_watered
        claim_type: constants_applied
        grounds: ["calculations.actual_wc_ratio", "entities.Load.fields.over_watered"]
        distinguishing_aspect: "over_watered compares the ROUNDED 3-decimal ratio with strict >: 27 gal on the 8.0 yd3 load yields wc 0.500 == max 0.50 -> false; one more gallon (28 total) yields 0.502 -> true."
        test_recipe:
          setup: ["standard catalog; one 8.0 yd3 load POURING (batch water 2030 lb, cement 4512 lb)"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /v1/loads/${l_id}/water-additions", payload: { gallons: 27, customer_authorized: true }, as: Driver, as_user_id: "drv-1" }
            - { call: "GET /v1/loads/${l_id}", payload: {}, as: Dispatcher, captures: { wc1: "$.data.actual_wc_ratio", over1: "$.data.over_watered" } }
            - { call: "POST /v1/loads/${l_id}/water-additions", payload: { gallons: 1, customer_authorized: true }, as: Driver, as_user_id: "drv-1" }
            - { call: "GET /v1/loads/${l_id}", payload: {}, as: Dispatcher, captures: { wc2: "$.data.actual_wc_ratio", over2: "$.data.over_watered" } }
          assert:
            - "After 27 gal: actual_wc_ratio == 0.5 and over_watered == false (rounded equality is not over)"
            - "After 28 gal total: actual_wc_ratio == 0.502 and over_watered == true"
            - "strength_liability == CUSTOMER after the flip (addition was customer_authorized)"

      - name: credit_exposure_input_set_filtering
        claim_type: input_set_filtering
        grounds: ["calculations.credit_exposure"]
        distinguishing_aspect: "Exposure includes only CONFIRMED..IN_PROGRESS provisionals plus DRAFT/ISSUED/DISPUTED invoices: a PAID invoice and a PLACED (unpriced) order both contribute 0, so a 1-cent-limit customer reviews back to exposure 0 / GOOD."
