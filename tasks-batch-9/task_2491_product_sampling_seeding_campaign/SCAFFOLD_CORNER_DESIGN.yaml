          rationale: "The named §1.8 instance exercises every weighted term of both score variants on one shared-address panelist."

      - name: review_word_count_threshold_is_inclusive
        claim_type: threshold
        grounds:
          - calculations.review_disclosure_gate
        excluded_because:
          difficulty_instance: boundary_precision_check / review_word_count_inclusive_at_min_review_word_count
          rationale: "The named §1.8 instance submits at exactly min_review_word_count and one word below it."

  # ===========================================================================
  # Section 4 of 9 — validations (§1.4)
  # ===========================================================================
  - section: validations
    instances:
      - name: campaign_window_end_equal_to_start_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 5]
          - errors[ERR_CAMPAIGN_WINDOW_INVALID]
        distinguishing_aspect: "The rule demands strictly after, so equal endpoints — the exact boundary a >= reading would accept — must fail with 400 and leave no Campaign row behind."
        test_recipe:
          setup:
            - "Logical clock pinned; no other data required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns"
              payload: { name: "Zero Width Window", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-07-01T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_CAMPAIGN_WINDOW_INVALID"
            - "GET /campaigns returns total_count == 0"

      - name: wave_window_end_before_start_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 6]
          - errors[ERR_WAVE_WINDOW_INVALID]
        distinguishing_aspect: "The wave window has its own rule, distinct from the campaign window rule, and it fires on the reversed-order case before any capacity arithmetic is attempted."
        test_recipe:
          setup:
            - "One fulfillment center."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fulfillment-centers"
              payload: { name: "FC Window", zone_code: "EAST", daily_pick_capacity_units: 100, freight_cents_per_kit: 300 }
              as: FulfillmentOps
              captures: { fc_id: $.data.id }
          trigger:
            - call: "POST /fulfillment-waves"
              payload: { fulfillment_center_id: "${fc_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-02T00:00:00Z", planned_capacity_units: 50 }
              as: FulfillmentOps
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_WAVE_WINDOW_INVALID"
            - "GET /fulfillment-waves?fulfillment_center_id=${fc_id} returns total_count == 0"

      - name: unknown_campaign_id_beats_the_state_check_on_close
        claim_type: priority_ordering
        grounds:
          - validations[priority 7]
          - validations[priority 10]
          - errors[ERR_CAMPAIGN_NOT_FOUND]
        distinguishing_aspect: "Existence (priority 7) is evaluated before transition legality (priority 10): closing a campaign that does not exist must return 404, not the 409 that a real DRAFT campaign would earn from the same endpoint."
        test_recipe:
          setup:
            - "One real campaign in DRAFT exists, so the endpoint is otherwise reachable; the call targets an unrelated UUID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Real Draft", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /campaigns/99999999-9999-4999-8999-999999999999/close"
              payload: {}
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_CAMPAIGN_NOT_FOUND"
            - "Campaign.${camp_id}.status == DRAFT (the real campaign is untouched)"

      - name: wrong_role_beats_existence_on_an_unknown_campaign
        claim_type: priority_conflict
        grounds:
          - validations[priority 3]
          - validations[priority 7]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Two rules are violated at once — the caller is not in the endpoint's roles list AND the path id does not exist. Priority 3 wins, so the answer is 403 and the 404 is never reached; an implementation that resolves ids before checking the role would leak existence."
        test_recipe:
          setup:
            - "No rows are needed; the target id is deliberately unknown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns/99999999-9999-4999-8999-999999999999/close"
              payload: {}
              as: FulfillmentOps
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err_id} == ERR_FORBIDDEN_ROLE"

      - name: write_off_of_more_units_than_available_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 31]
          - errors[ERR_WRITE_OFF_EXCEEDS_AVAILABLE]
          - entities.KitLine.fields.units_written_off
        distinguishing_aspect: "The ceiling is units_available, not units_received: with 3 units received and none reserved, a 4-unit write-off is one over the line and must leave units_written_off at 0 and the campaign's write_off_cost_cents at 0."
        test_recipe:
          setup:
            - "One DRAFT campaign with one kit line that has received 3 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Write Off Ceiling", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 3 }
              as: FulfillmentOps
          trigger:
            - call: "POST /kit-lines/${kl1_id}/write-offs"
              payload: { units: 4, reason: "DAMAGED_IN_TRANSIT" }
              as: FulfillmentOps
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err_id} == ERR_WRITE_OFF_EXCEEDS_AVAILABLE"
            - "KitLine.${kl1_id}.units_written_off == 0"
            - "KitLine.${kl1_id}.units_available == 3"
            - "KitLine.${kl1_id}.units_received == 3"
            - "Campaign.${camp_id}.write_off_cost_cents == 0"

      - name: purchase_one_second_past_the_conversion_tail_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority 32]
          - errors[ERR_PURCHASE_MATCH_OUT_OF_WINDOW]
          - calculations.campaign_lift_and_diversion_penalty.constants
        distinguishing_aspect: "The conversion window closes at sampling_window_end + CONVERSION_TAIL_DAYS 30 == 2026-10-30T00:00:00Z inclusive; one second later is outside, so this pins the closed upper end that the companion §1.9 threshold instance accepts."
