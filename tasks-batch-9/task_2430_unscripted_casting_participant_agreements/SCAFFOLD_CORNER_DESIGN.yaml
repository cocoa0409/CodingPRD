  # ===========================================================================
  - section: state_machines
    instances:

      - name: casting_call_initial_state_is_draft_with_null_publish_fields
        claim_type: initial_state
        grounds:
          - state_machines.CastingCall.initial_state
          - entities.CastingCall.fields.status
          - entities.CastingCall.fields.published_at
          - entities.CastingCall.fields.closed_reason
          - entities.CastingCall.fields.screened_pass_count
        distinguishing_aspect: |
          Initial-state claim: a freshly created call is DRAFT — not PUBLISHED —
          with published_at and closed_reason null and screened_pass_count 0, so no
          applicant intake is possible until the publish transition fires.
        test_recipe:
          setup:
            - "One production; no casting call yet."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id, c_status: $.data.status, c_pub: $.data.published_at, c_reason: $.data.closed_reason, c_passes: $.data.screened_pass_count, c_ver: $.data.version }
          assert:
            - "the trigger call returns HTTP 201"
            - "${c_status} == DRAFT"
            - "${c_pub} == null"
            - "${c_reason} == null"
            - "${c_passes} == 0"
            - "${c_ver} == 1"
            - "CastingCall.${call_id}.venue_location_id == null"
            - "CastingCall.${call_id}.expected_attendance == 0"

      - name: casting_call_close_from_draft_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.CastingCall.PUBLISHED_to_CLOSED
          - validations[priority=13]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Invalid-from claim: close is declared only from PUBLISHED, so closing a
          DRAFT call is rejected with ERR_INVALID_STATE_TRANSITION 409 and leaves
          status DRAFT with closed_reason null; after a legitimate publish the same
          call closes with closed_reason DIRECTOR_CLOSED.
        test_recipe:
          setup:
            - "One production with one DRAFT casting call."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /casting/casting-calls/${call_id}/close"
              payload: {}
              as: CastingDirector
              captures: { err_close: $.data.error_id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
              captures: { pub_status: $.data.status, pub_at: $.data.published_at }
            - call: "POST /casting/casting-calls/${call_id}/close"
              payload: {}
              as: CastingDirector
              captures: { closed_status: $.data.status, closed_reason: $.data.closed_reason }
          assert:
            - "the first trigger call returns HTTP 409"
            - "${err_close} == ERR_INVALID_STATE_TRANSITION"
            - "${pub_status} == PUBLISHED"
            - "${pub_at} == 2026-08-01T00:00:00Z"
            - "${closed_status} == CLOSED"
            - "${closed_reason} == DIRECTOR_CLOSED"

      - name: casting_call_publish_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.CastingCall.DRAFT_to_PUBLISHED
          - validations[priority=13]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - entities.CastingCall.fields.published_at
        distinguishing_aspect: |
          Idempotency claim: publish is not idempotent-by-retry — a second publish on
          an already PUBLISHED call is rejected 409 rather than silently re-stamping
          published_at, and neither published_at nor version changes.
        test_recipe:
          setup:
            - "One production with one PUBLISHED casting call."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
              captures: { first_pub_at: $.data.published_at, first_ver: $.data.version }
          trigger:
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
              captures: { err_pub: $.data.error_id }
            - call: "GET /casting/casting-calls/${call_id}"
              payload: {}
              as: CastingDirector
              captures: { still_pub_at: $.data.published_at, still_ver: $.data.version, still_status: $.data.status }
          assert:
            - "the first trigger call returns HTTP 409"
            - "${err_pub} == ERR_INVALID_STATE_TRANSITION"
            - "${still_status} == PUBLISHED"
            - "${still_pub_at} == ${first_pub_at}"
            - "${still_ver} == ${first_ver}"

      - name: complaint_resolve_from_terminal_resolved_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Complaint.terminal_states
          - state_machines.Complaint.TRIAGED_to_AFTERCARE_ACTIVE
          - calculations.aftercare_session_authorization
          - validations[priority=13]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Terminal-lockdown claim: RESOLVED is terminal, so neither resolve nor
          triage is accepted afterwards (both 409). The AFTERCARE branch is also
