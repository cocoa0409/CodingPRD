        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SCORE_BELOW_PASSING]"
        excluded_because:
          difficulty_instance: score_exactly_at_passing_boundary
          rationale: "Asserted as the 79.99 failure path of the named difficulty instance."

