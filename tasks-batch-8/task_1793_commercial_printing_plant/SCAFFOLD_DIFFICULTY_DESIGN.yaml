  - rule_id: compensating_invariant
    instances:
      - name: paper_sheet_conservation_across_reserve_and_cancel
        grounds:
          - calculations.paper_lot_allocation
          - entities.PaperLot.fields.remaining_sheets
          - state_machines.PressRun.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: SHEETS per lot — remaining == received - reserved
          - consumed - damaged at every checkpoint: receive 5000 (remaining
          5000), schedule reserves 1051 (remaining 3949), and the compensating
          cancel restores remaining to exactly 5000 with zero drift.
        test_recipe:
          setup:
            - "Stock (threshold 0), PO 5000 fully received -> lot with received_sheets 5000"
            - "Job Q=1000 single signature up=1 spoilage 3%/2% (planned sheets 1051) PLATED; press available"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "PC Cust", credit_limit_cents: 100000000, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${stock}", ordered_sheets: 5000, cost_per_sheet_cents: 5 }, as: PurchasingManager, captures: { po: $.data.id } }
            - { call: "POST /paper-purchase-orders/${po}/receive", payload: { sheets_received: 5000 }, as: PurchasingManager }
            - { call: "GET /paper-lots", payload: { paper_purchase_order_id: "${po}" }, as: PurchasingManager, captures: { lot: "$.data[0].id" } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "PJ", quantity_ordered: 1000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 50000, rate_per_thousand_cents: 30000 } ], press_spoilage_pct: 3, bindery_spoilage_pct: 2, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://p.pdf" }, as: PrepressOperator, captures: { proof: $.data.id } }
            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /presses", payload: { name: "W1", press_type: "WEB", rated_impressions_per_hour: 10000, make_ready_minutes_base: 45, washup_buffer_minutes: 30 }, as: PlantManager, captures: { press: $.data.id, pv: $.data.version } }
            - { call: "GET /paper-lots/${lot}", payload: {}, as: PurchasingManager, captures: { rem0: $.data.remaining_sheets } }
          trigger:
            - { call: "POST /press-runs", payload: { press_id: "${press}", job_id: "${job}", run_quantity: 1000, scheduled_start: "2026-08-10T08:00:00Z", expected_press_version: "${pv}" }, as: PressScheduler, captures: { run: $.data.id, planned: $.data.planned_sheets } }
            - { call: "GET /paper-lots/${lot}", payload: {}, as: PurchasingManager, captures: { rem1: $.data.remaining_sheets, res1: $.data.reserved_sheets } }
            - { call: "POST /press-runs/${run}/cancel", payload: {}, as: PressScheduler }
            - { call: "GET /paper-lots/${lot}", payload: {}, as: PurchasingManager, captures: { rem2: $.data.remaining_sheets } }
          assert:
            - "After receive: remaining_sheets == 5000 == received(5000) - reserved(0) - consumed(0) - damaged(0)"
            - "PressRun.${run}.planned_sheets == 1051 (ceil(ceil(1000x1.03)x1.02))"
            - "After schedule: reserved_sheets == 1051 and remaining_sheets == 3949 == 5000 - 1051"
            - "After cancel: reserved_sheets == 0 and remaining_sheets == 5000 (compensating action restores the conserved quantity exactly)"

