      - name: entity_backed_roles_must_resolve_and_own_the_deal
        claim_type: exclusive_operations
        grounds:
          - validations[auth-identity-resolves] (priority 3) and validations[actor-owns-resource] (priority 8)
          - errors[ERR_ROLE_IDENTITY_MISMATCH]
        distinguishing_aspect: |
          Both the identity rule and the ownership rule report the same
          ERR_ROLE_IDENTITY_MISMATCH but they fire at different rungs, and the discriminator is
          the firm_type: an X-User-Id naming a real UNDERWRITER firm fails the MunicipalAdvisor
          identity check at priority 3 (the role's firm_type set does not admit it), whereas an
          X-User-Id naming a real MUNICIPAL_ADVISOR firm that simply does not advise THIS deal
          fails the ownership check at priority 8. A completely unknown X-User-Id fails identity
          too rather than 404-ing.
        test_recipe:
          setup:
            - "Deal D is advised by MA0001; MA0002 is a second, unrelated MUNICIPAL_ADVISOR firm; AU0001 is an UNDERWRITER firm."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Rival Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0002" }
              as: ComplianceOfficer
              captures: { ma2_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${uw_firm_id}"
              captures: { identity_error: $.data.error_id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { unknown_identity_error: $.data.error_id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma2_firm_id}"
              captures: { ownership_error: $.data.error_id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
          assert:
            - "first three calls: HTTP 403 with data.error_id == 'ERR_ROLE_IDENTITY_MISMATCH'"
            - "none of the three refusals is a 404, even the one naming an id that matches no Firm at all"
            - "fourth call: HTTP 201 and GET /bond-offerings/deals/${deal_id}/maturity-tranches returns exactly 1 row"

      - name: an_unseated_underwriter_may_add_only_its_own_firm_to_the_syndicate
        claim_type: exclusive_operations
        grounds:
          - validations[actor-owns-resource] (priority 8) carve-out for POST syndicate-members
          - errors[ERR_ROLE_IDENTITY_MISMATCH]
        distinguishing_aspect: |
          The ownership rule normally demands an ACTIVE seat, but this endpoint carries a
          bootstrap carve-out: an unseated Underwriter may add itself (firm_id == X-User-Id) and
          nothing else. So AU0001 adding AU0001 succeeds while AU0002 adding AU0001 - a body that
          is otherwise identical - is refused, and once AU0002 is seated it may add further
          members freely.
        test_recipe:
          setup:
            - "A DRAFT NEGOTIATED-bound deal advised by MA0001 with an empty syndicate; AU0001 and AU0002 are both unseated UNDERWRITER firms."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw1_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Gamma Securities", firm_type: "UNDERWRITER", msrb_registration_id: "AU0002" }
