scenario: |
  University Application Platform (Common App style): applicant profile, multi-school joint
  application, essay customization, recommendation letter chain, Early/Regular/Rolling admission,
  financial aid (FAFSA/CSS Profile), waitlist, yield management.

domain_name: university-application-platform
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - ops_run_checkpoint
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entities
# ===========================================================================
entities:

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email; globally unique", constraints: "unique; lowercase normalized" }
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: gpa, type: number, source: input, description: "Self-reported GPA on 4.0 scale", constraints: ">=0.0 and <=4.0" }
      - { name: sat_total, type: integer, source: input, description: "Total SAT score (400-1600), null if not submitted", default: null, constraints: "null OR (>=400 and <=1600)" }
      - { name: profile_status, type: enum, source: computed, description: "DRAFT until all required fields present + at least one Recommender invited, then READY", constraints: "enum: {DRAFT, READY}; starts DRAFT; flips to READY when full_name, gpa present AND >=1 Recommender row exists for this applicant" }

  - name: Recommender
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "Applicant who invited this recommender (FK)" }
      - { name: email, type: string, source: input, description: "Recommender contact email", constraints: "(applicant_id, email) is unique" }
      - { name: full_name, type: string, source: input, description: "Recommender full name" }
      - { name: relationship, type: enum, source: input, description: "Relationship to applicant", constraints: "enum: {TEACHER, COUNSELOR, OTHER}" }
      - { name: invite_status, type: enum, source: computed, description: "Invitation lifecycle", constraints: "enum: {INVITED, ACCEPTED, DECLINED}; starts INVITED; transitions per §1.2 Recommender machine" }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institution name", constraints: "unique" }
      - { name: target_class_size, type: integer, source: input, description: "Enrollment target for this admission cycle", constraints: ">=1" }
      - { name: ed_deadline_iso, type: datetime, source: input, description: "Early Decision deadline (ISO8601 UTC)" }
      - { name: ea_deadline_iso, type: datetime, source: input, description: "Early Action deadline (ISO8601 UTC)" }
      - { name: rd_deadline_iso, type: datetime, source: input, description: "Regular Decision deadline (ISO8601 UTC)" }
      - { name: rolling_open, type: boolean, source: input, description: "Whether the school accepts ROLLING applications", default: false }
      - { name: requires_css_profile, type: boolean, source: input, description: "Whether CSS Profile is required for institutional aid", default: false }
      - { name: confirmed_enrollment_count, type: integer, source: computed, description: "Count of Applications in this school with status ENROLLED (after applicant accepts offer)", default: 0, constraints: "recomputed on Application ENROLLED transitions and waitlist promotions" }
      - { name: posture, type: enum, source: computed, description: "OPEN while confirmed_enrollment_count < target_class_size; AT_TARGET when equal; OVER_TARGET when greater. Posture gates waitlist promotions (§1.2 Application).", constraints: "enum: {OPEN, AT_TARGET, OVER_TARGET}; starts OPEN; recomputed whenever confirmed_enrollment_count changes" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "Owning Applicant (FK)" }
      - { name: school_id, type: string, source: input, description: "Target School (FK); (applicant_id, school_id) unique" }
      - { name: plan, type: enum, source: input, description: "Admission plan chosen at submission", constraints: "enum: {EARLY_DECISION, EARLY_ACTION, REGULAR, ROLLING}; ROLLING permitted only when target school's rolling_open=true" }
      - { name: status, type: enum, source: computed, description: "Application lifecycle status; see §1.2 Application state machine", constraints: "enum: {DRAFT, SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, DENIED, DEFERRED, WITHDRAWN, ENROLLED, DECLINED_OFFER}; starts DRAFT" }
      - { name: submitted_at, type: datetime, source: system, description: "Server clock at submission; null until SUBMITTED transition" }
      - { name: decision_at, type: datetime, source: system, description: "Server clock when admissions render a decision; null until decided" }
      - { name: waitlist_rank, type: integer, source: computed, description: "1-based rank within the school's WAITLISTED Applications, ordered by ASC waitlist_added_at then ASC created_at as fallback (id is never used). Recomputed on any WAITLISTED add/remove.", default: null }
      - { name: waitlist_added_at, type: datetime, source: system, description: "Server clock when Application became WAITLISTED; null otherwise" }
      - { name: admission_probability_score, type: integer, source: computed, description: "0..100; derived per §1.3 applicant_admission_probability_score. Surfaced on GET /applications/{id}; variant selected by ?score_variant=PROVISIONAL|FINAL (default depends on status)." }

  - name: EssaySubmission
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "Owning Application (FK); (application_id) unique — exactly one essay per application" }
      - { name: prompt_code, type: string, source: input, description: "Prompt identifier chosen for this school" }
      - { name: body, type: string, source: input, description: "Essay text", constraints: "1..650 words inclusive (whitespace-separated tokens)" }
      - { name: word_count, type: integer, source: computed, description: "Whitespace-separated token count of body" }
      - { name: locked, type: boolean, source: computed, description: "true once owning Application status is SUBMITTED or beyond; locked essays are read-only", default: false }

  - name: RecommendationLetter
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "Owning Application (FK)" }
      - { name: recommender_id, type: string, source: input, description: "Recommender (FK); (application_id, recommender_id) unique" }
      - { name: status, type: enum, source: computed, description: "Letter lifecycle; see §1.2 RecommendationLetter machine", constraints: "enum: {REQUESTED, IN_PROGRESS, SUBMITTED, WAIVED}; starts REQUESTED" }
      - { name: body, type: string, source: input, description: "Letter text; null until SUBMITTED", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Server clock when letter was SUBMITTED; null otherwise" }

  - name: FinancialAidProfile
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "Owning Applicant (FK); unique per applicant" }
      - { name: fafsa_efc_cents, type: integer, source: input, description: "FAFSA-derived Expected Family Contribution in cents", constraints: ">=0" }
      - { name: css_efc_cents, type: integer, source: input, description: "CSS Profile institutional EFC in cents; null when applicant has not filed CSS Profile", default: null, constraints: "null OR >=0" }
      - { name: family_income_cents, type: integer, source: input, description: "Annual household income in cents", constraints: ">=0" }
      - { name: status, type: enum, source: computed, description: "DRAFT until fafsa_efc_cents and family_income_cents present, then SUBMITTED", constraints: "enum: {DRAFT, SUBMITTED}; starts DRAFT" }

  - name: AidOffer
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "Owning Application (FK); unique per application (at most one AidOffer per Application)" }
      - { name: cost_of_attendance_cents, type: integer, source: input, description: "Published COA for the school in cents", constraints: ">=0" }
      - { name: variant, type: enum, source: input, description: "Algorithm used to compute the offer; FEDERAL uses FAFSA EFC, INSTITUTIONAL uses CSS EFC.", constraints: "enum: {FEDERAL, INSTITUTIONAL}; INSTITUTIONAL allowed only when School.requires_css_profile=true AND FinancialAidProfile.css_efc_cents is not null" }
      - { name: demonstrated_need_cents, type: integer, source: computed, description: "max(0, cost_of_attendance_cents - applicable_efc_cents); FEDERAL uses fafsa_efc_cents, INSTITUTIONAL uses css_efc_cents. See §1.3 calc demonstrated_need_calc." }
      - { name: grant_cents, type: integer, source: input, description: "Institutional grant awarded in cents", constraints: ">=0 and <= demonstrated_need_cents" }
      - { name: loan_cents, type: integer, source: input, description: "Federal loan offered in cents", constraints: ">=0" }
      - { name: work_study_cents, type: integer, source: input, description: "Work-study award in cents", constraints: ">=0" }
      - { name: net_price_cents, type: integer, source: computed, description: "cost_of_attendance_cents - grant_cents - loan_cents - work_study_cents (floor at 0)" }

  - name: AdmissionCycle
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "Owning School (FK); unique per school" }
      - { name: clock_iso, type: datetime, source: system, description: "Current server time as exposed for tests (ISO8601 UTC). Initialized to school creation time; advanced via POST /_clock/advance." }
      - { name: last_yield_run_at, type: datetime, source: system, description: "Server clock of the most recent yield-management run; null if never run", default: null }
      - { name: yield_run_count, type: integer, source: computed, description: "Number of yield runs executed against this cycle", default: 0 }
      - { name: cooldown_ms, type: integer, source: input, description: "Minimum milliseconds between successive yield runs on this cycle. Boundary is INCLUSIVE on the lower bound: a run is permitted when server_clock - last_yield_run_at >= cooldown_ms.", default: 86400000, constraints: ">=0" }

# ===========================================================================
# §1.2 State Machines
# ===========================================================================
state_machines:

  - entity: Application
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, DENIED, DECLINED_OFFER]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Applicant.profile_status == READY"
          - "Exactly one EssaySubmission exists for this Application"
          - "EssaySubmission.word_count between 1 and 650 inclusive"
          - "All RecommendationLetter rows for this Application are in SUBMITTED status (zero letters allowed only when plan != EARLY_DECISION)"
          - "If plan == EARLY_DECISION: server clock <= School.ed_deadline_iso AND no other Application by this applicant has plan == EARLY_DECISION (binding single-ED rule)"
          - "If plan == EARLY_ACTION: server clock <= School.ea_deadline_iso"
          - "If plan == REGULAR: server clock <= School.rd_deadline_iso"
          - "If plan == ROLLING: School.rolling_open == true"
        side_effects:
          - "Set submitted_at = server clock"
          - "EssaySubmission.locked := true"
          - "Application.version += 1"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/start-review"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.status == SUBMITTED"
        side_effects:
          - "Application.version += 1"

      - from: UNDER_REVIEW
        to: ADMITTED
        trigger: "POST /applications/{id}/decide with decision=ADMIT"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.status == UNDER_REVIEW"
        side_effects:
          - "decision_at := server clock"
          - "Application.version += 1"

      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "POST /applications/{id}/decide with decision=WAITLIST"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.status == UNDER_REVIEW"
        side_effects:
          - "decision_at := server clock"
          - "waitlist_added_at := server clock"
          - "Recompute waitlist_rank for all WAITLISTED Applications of this school (ordering by waitlist_added_at ASC, created_at ASC as tie-break)"
          - "Application.version += 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{id}/decide with decision=DENY"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.status == UNDER_REVIEW"
        side_effects:
          - "decision_at := server clock"
          - "Application.version += 1"

      - from: UNDER_REVIEW
        to: DEFERRED
        trigger: "POST /applications/{id}/decide with decision=DEFER"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "Application.plan IN {EARLY_DECISION, EARLY_ACTION} (defer is meaningful only for early plans rolled into regular pool)"
        side_effects:
          - "decision_at := server clock"
          - "plan := REGULAR (rolls into regular pool)"
          - "Application.version += 1"

      - from: DEFERRED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/start-review (second pass after defer)"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.status == DEFERRED"
          - "server clock > School.ed_deadline_iso (deferred apps re-enter only in regular pool window)"
        side_effects:
          - "Application.version += 1"

      - from: ADMITTED
        to: ENROLLED
        trigger: "POST /applications/{id}/accept-offer"
        actor: Applicant
        preconditions:
          - "Application.status == ADMITTED"
          - "Applicant owns Application"
          - "No other Application by this Applicant is in ENROLLED status (single-enrollment rule)"
        side_effects:
          - "School.confirmed_enrollment_count += 1; School.posture recomputed (cascade depth 1)"
          - "If Application.plan == EARLY_DECISION: every other Application by this Applicant whose status IN {DRAFT, SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, DEFERRED} auto-transitions to WITHDRAWN (cascade depth 2). Each WITHDRAWN cascade itself triggers waitlist_rank recompute on the freed schools (cascade depth 3)."
          - "Application.version += 1"

      - from: ADMITTED
        to: DECLINED_OFFER
        trigger: "POST /applications/{id}/decline-offer"
        actor: Applicant
        preconditions:
          - "Application.status == ADMITTED"
          - "Applicant owns Application"
        side_effects:
          - "Application.version += 1"

      - from: ENROLLED
        to: DECLINED_OFFER
        trigger: "POST /applications/{id}/revoke-enrollment"
        actor: Applicant
        preconditions:
          - "Application.status == ENROLLED"
          - "Applicant owns Application"
        side_effects:
          - "School.confirmed_enrollment_count -= 1; School.posture recomputed (compensating action that reverses the accept-offer side effect, restoring the invariant School.confirmed_enrollment_count == count(Application WHERE school_id==School.id AND status==ENROLLED))"
          - "Application.version += 1"
        note: "Compensating action for accept-offer. Does NOT auto-undo ED cascade withdrawals on sibling Applications — those remain WITHDRAWN (the applicant has already missed their reply windows)."

      - from: WAITLISTED
        to: ADMITTED
        trigger: "POST /admission-cycles/{id}/run-yield (system, during yield-management run)"
        actor: system
        preconditions:
          - "Application.status == WAITLISTED"
          - "School.posture == OPEN (confirmed_enrollment_count < target_class_size)"
          - "Application has lowest waitlist_rank among WAITLISTED rows for this school"
        side_effects:
          - "decision_at := server clock"
          - "waitlist_rank := null"
          - "AdmissionCycle.yield_run_count += 1; last_yield_run_at := server clock"
          - "Remaining WAITLISTED applications for this school have waitlist_rank recomputed"
          - "Application.version += 1"

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status IN {DRAFT, SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, DEFERRED}"
        side_effects:
          - "If Application.status == WAITLISTED: recompute waitlist_rank for remaining WAITLISTED applications of this school"
          - "Application.version += 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status IN {DRAFT, SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, DEFERRED}"
        side_effects:
          - "Application.version += 1"
        note: "Same trigger as WAITLISTED→WITHDRAWN; the rank recompute step is conditional on the from-state."

  - entity: RecommendationLetter
    initial_state: REQUESTED
    terminal_states: [SUBMITTED, WAIVED]
    transitions:
      - from: REQUESTED
        to: IN_PROGRESS
        trigger: "POST /recommendation-letters/{id}/start"
        actor: Recommender
        preconditions:
          - "RecommendationLetter.status == REQUESTED"
          - "Recommender.invite_status == ACCEPTED"
          - "Application.status == DRAFT (letter cannot be drafted once application is locked)"
        side_effects:
          - "RecommendationLetter.version += 1"

      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /recommendation-letters/{id}/submit"
        actor: Recommender
        preconditions:
          - "RecommendationLetter.status == IN_PROGRESS"
          - "body is not null and len(body) >= 200 characters"
          - "Application.status == DRAFT (otherwise application has already been finalized)"
        side_effects:
          - "submitted_at := server clock"
          - "RecommendationLetter.version += 1"

      - from: REQUESTED
        to: WAIVED
        trigger: "POST /recommendation-letters/{id}/waive"
        actor: Applicant
        preconditions:
          - "RecommendationLetter.status == REQUESTED"
          - "Application.plan != EARLY_DECISION (ED requires at least one SUBMITTED letter)"
        side_effects:
          - "RecommendationLetter.version += 1"

      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /recommendation-letters/{id}/waive"
        actor: Applicant
        preconditions:
          - "RecommendationLetter.status == IN_PROGRESS"
          - "Application.plan != EARLY_DECISION"
        side_effects:
          - "RecommendationLetter.version += 1"

  - entity: Recommender
    initial_state: INVITED
    terminal_states: [DECLINED]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /recommenders/{id}/accept"
        actor: Recommender
        preconditions:
          - "Recommender.invite_status == INVITED"
        side_effects:
          - "Recommender.version += 1"

      - from: INVITED
        to: DECLINED
        trigger: "POST /recommenders/{id}/decline"
        actor: Recommender
        preconditions:
          - "Recommender.invite_status == INVITED"
        side_effects:
          - "All RecommendationLetter rows pointing at this Recommender whose status == REQUESTED are deleted (cascade depth 1). For each owning Application, if it was the last REQUESTED letter and Applicant.profile_status was READY, profile_status is re-evaluated (cascade depth 2)."
          - "Recommender.version += 1"

  - entity: FinancialAidProfile
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /financial-aid-profiles/{id}/submit"
        actor: Applicant
        preconditions:
          - "FinancialAidProfile.status == DRAFT"
          - "fafsa_efc_cents is not null"
          - "family_income_cents is not null"
        side_effects:
          - "FinancialAidProfile.version += 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: aid-offer-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /aid-offers"
    occ_field: "expected_application_version"
    description: |
      Creating an AidOffer against an Application whose version has advanced since the client
      last observed it is rejected. The canonical case: a FinancialAidOfficer reads
      Application v=5 (status=ADMITTED), then between the read and the create the Applicant
      ACCEPTS the offer (which advances Application.version to 6 and transitions to ENROLLED).
      A subsequent create still carrying expected_application_version=5 is stale — the new
      AidOffer would supersede a prior view of the Application and is rejected with 412 so the
      officer can re-read and decide whether to proceed.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: decision-render-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/decide"
    occ_field: "expected_application_version"
    description: |
      Rendering a decision on an Application whose version has advanced since the
      AdmissionsOfficer last observed it is rejected. The canonical case: two AdmissionsOfficers
      both pull Application v=2 (status=UNDER_REVIEW); the first writes decision=ADMIT
      (Application advances to v=3, status=ADMITTED); the second sends decision=WAITLIST
      still carrying expected_application_version=2. Under the natural product semantics the
      second decision would legitimately supersede the first, so the system rejects it with 412
      so the officer can re-read the now-decided application before overriding.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculations
# ===========================================================================
calculations:

  - name: demonstrated_need_calc
    trigger: "Computed on POST /aid-offers (AidOffer creation) and on every PATCH /aid-offers/{id}"
    algorithm: threshold
    formula: |
      applicable_efc_cents = (variant == FEDERAL) ? FinancialAidProfile.fafsa_efc_cents
                                                  : FinancialAidProfile.css_efc_cents
      demonstrated_need_cents = max(0, cost_of_attendance_cents - applicable_efc_cents)
      net_price_cents         = max(0, cost_of_attendance_cents
                                       - grant_cents - loan_cents - work_study_cents)
    input_set: |
      AidOffer.cost_of_attendance_cents (input);
      FinancialAidProfile by AidOffer.application_id -> Application.applicant_id,
        with FinancialAidProfile.status == SUBMITTED (DRAFT profiles are excluded).
    constants:
      FLOOR_CENTS: 0
    precision: "Integer cents; no rounding required (all inputs are integer cents)"
    variants:
      - name: FEDERAL
        when: "AidOffer.variant == FEDERAL"
        difference: "Uses fafsa_efc_cents from FinancialAidProfile. Always permitted when FAFSA is on file."
      - name: INSTITUTIONAL
        when: "AidOffer.variant == INSTITUTIONAL"
        difference: "Uses css_efc_cents from FinancialAidProfile. Permitted only when School.requires_css_profile=true AND FinancialAidProfile.css_efc_cents is not null. Typically yields a LOWER demonstrated_need (CSS Profile counts more assets, so EFC is higher) so the same applicant gets a smaller need number under INSTITUTIONAL than under FEDERAL."

  - name: applicant_admission_probability_score
    trigger: "Recomputed and exposed on GET /applications/{id} (variant chosen by query param ?score_variant=PROVISIONAL|FINAL, default depends on Application.status)"
    algorithm: weighted_scoring
    formula: |
      # MODE (b) — nested rounding where ORDER MATTERS. Two interpretations exist:
      #   (i)  round each component independently, then sum                       (PINNED)
      #   (ii) compute components as reals, sum, then round at the end             (REJECTED)
      # The scaffold pins interpretation (i): round_half_up is applied at the
      # per-component step INSIDE the min(...) calls, and the final sum is taken
      # over already-integer components. Implementations that defer rounding to a
      # single final round produce a DIFFERENT integer when any per-component
      # value lands on a .5 boundary (e.g., gpa=3.85 → gpa_real=38.5 →
      # interpretation (i) rounds to 39 then sums; interpretation (ii) keeps 38.5
      # in the sum and depends on whatever other halves accumulate).
      gpa_component   = min(40, round_half_up(Applicant.gpa * 10))        # 0..40 INT
      sat_component   = (Applicant.sat_total is null) ? 0
                                                      : min(30, floor((Applicant.sat_total - 400) / 40))   # 0..30 INT
      plan_bonus      = (Application.plan == EARLY_DECISION) ? 15
                        : (Application.plan == EARLY_ACTION)  ? 8
                        : (Application.plan == ROLLING)       ? 5
                                                              :  0
      letters_factor  = min(15, 5 * count(RecommendationLetter
                                          WHERE application_id == Application.id
                                            AND status IN letters_include_set))
      score           = gpa_component + sat_component + plan_bonus + letters_factor    # 0..100 INT (sum of ints)
    input_set: |
      Applicant.gpa, Applicant.sat_total (null treated as 0 weight);
      Application.plan;
      RecommendationLetter rows with application_id == Application.id; status filter depends
      on variant (see below).
    constants:
      MAX_SCORE: 100
      LETTERS_CAP_COUNT: 3
    precision: "Integer score 0..100; round_half_up applied PER-COMPONENT (interpretation i above), not after the sum"
    variants:
      - name: PROVISIONAL
        when: "score_variant=PROVISIONAL (default while Application.status IN {DRAFT, SUBMITTED})"
        difference: "letters_include_set := {REQUESTED, IN_PROGRESS, SUBMITTED} — counts in-progress letters optimistically because admissions has not yet started review. Yields a HIGHER or equal score than FINAL whenever pending letters exist."
      - name: FINAL
        when: "score_variant=FINAL (default while Application.status IN {UNDER_REVIEW, ADMITTED, WAITLISTED, DENIED, DEFERRED})"
        difference: "letters_include_set := {SUBMITTED} only — pending letters do not count once admissions has begun review. Yields a LOWER score than PROVISIONAL whenever REQUESTED or IN_PROGRESS letters exist on the application."

  - name: school_yield_quota
    trigger: "Computed on each POST /admission-cycles/{id}/run-yield"
    algorithm: waterfall_allocation
    formula: |
      # Pinned evaluation order to avoid circular look:
      #   1. open_seats  = max(0, School.target_class_size - School.confirmed_enrollment_count)
      #   2. eligible    = WAITLISTED Applications for this school ORDERED BY waitlist_rank ASC
      #                    (waitlist_rank is itself derived from waitlist_added_at ASC, created_at ASC).
      #   3. Promote eligible[0..min(open_seats, len(eligible)) - 1] to ADMITTED.
      #   4. Each promotion does NOT itself fill a seat — confirmed_enrollment_count only changes
      #      when the applicant subsequently ACCEPTS. So a single yield run can promote up to
      #      open_seats applicants, no more (waterfall: pour into open seats, stop when dry).
      promoted_count = min(open_seats, len(eligible))
    input_set: |
      School.target_class_size, School.confirmed_enrollment_count;
      Application rows WHERE school_id == School.id AND status == WAITLISTED, sorted by
      (waitlist_rank ASC).
    constants:
      MIN_OPEN_SEATS_TO_RUN: 1
    precision: "Integer counts; no fractional seats"

  - name: school_yield_rate
    trigger: "Read on GET /schools/{id}/yield-report; recomputed eagerly on Application ENROLLED transitions"
    algorithm: aggregation
    formula: |
      admitted_count = count(Application WHERE school_id == School.id
                                          AND status IN {ADMITTED, ENROLLED, DECLINED_OFFER})
      enrolled_count = count(Application WHERE school_id == School.id AND status == ENROLLED)
      yield_rate     = (admitted_count == 0) ? 0.0
                                              : round_half_up_to_4dp(enrolled_count / admitted_count)
    input_set: |
      Application rows for this school. WAITLISTED applications are EXCLUDED until they
      promote out of WAITLISTED. WITHDRAWN applications are EXCLUDED.
    constants:
      ROUND_DECIMALS: 4
    precision: "4 decimal places, round_half_up; yield_rate is null when admitted_count==0"

# ===========================================================================
# §1.4 Validations (ordered by priority, lower number wins)
# ===========================================================================
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers present"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all (except POST /applicants/register and POST /recommenders/{id}/accept and POST /recommenders/{id}/decline)"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Applicant, Recommender, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin}"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all (when auth headers present)"

  - priority: 3
    category: auth
    check: "Role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "All path-parameter resources exist, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-templated endpoints"

  - priority: 5
    category: business_referential
    check: "FK fields in request body resolve to existing resources"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PATCH endpoints with FK fields"

  - priority: 6
    category: business_referential
    check: "Actor owns the resource where ownership is required (Applicant must equal Application.applicant_id, Recommender must equal RecommendationLetter.recommender_id, etc.)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose RBAC requires ownership"

  - priority: 7
    category: business_referential
    check: "Required input fields present; types valid; enum members valid; constraint ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH endpoints"

  - priority: 8
    category: business_referential
    check: "Uniqueness keys not violated (Applicant.email, (Applicant, School) Application pair, (Application) EssaySubmission pair, (Application, Recommender) RecommendationLetter pair, FinancialAidProfile.applicant_id, AidOffer.application_id)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "all POST endpoints whose entities declare uniqueness in §1.1"

  - priority: 9
    category: state
    check: "OCC: when endpoint requires expected_<parent>_version, the provided value matches the parent's current version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "endpoints listed in §1.2.1 concurrency_rules"

  - priority: 10
    category: state
    check: "Target resource in valid from-state for the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 11
    category: business_safety
    check: "ED binding rule: an Applicant may have at most one Application with plan=EARLY_DECISION in any non-terminal status."
    error_id: ERR_ED_BINDING_VIOLATION
    http_status: 409
    applies_to: "POST /applications and POST /applications/{id}/submit"

  - priority: 12
    category: business_temporal
    check: "Submission falls within the chosen plan's deadline (server clock <= the applicable School.*_deadline_iso for ED/EA/RD; rolling open=true for ROLLING)."
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 13
    category: business_safety
    check: "Single-enrollment rule: an Applicant may have at most one Application in ENROLLED status across all schools."
    error_id: ERR_ALREADY_ENROLLED
    http_status: 409
    applies_to: "POST /applications/{id}/accept-offer"

  - priority: 14
    category: business_constraint
    check: "Essay word_count within 1..650 inclusive; tokens counted by whitespace split"
    error_id: ERR_ESSAY_WORD_COUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST/PATCH /essay-submissions"

  - priority: 15
    category: business_constraint
    check: "ED submission requires at least one RecommendationLetter in SUBMITTED status (waivers are not allowed for ED)"
    error_id: ERR_ED_REQUIRES_LETTER
    http_status: 409
    applies_to: "POST /applications/{id}/submit when plan==EARLY_DECISION"

  - priority: 16
    category: business_constraint
    check: "AidOffer.variant=INSTITUTIONAL requires School.requires_css_profile=true AND FinancialAidProfile.css_efc_cents is not null"
    error_id: ERR_INSTITUTIONAL_VARIANT_INELIGIBLE
    http_status: 409
    applies_to: "POST /aid-offers and PATCH /aid-offers/{id}"

  - priority: 17
    category: business_fiscal
    check: "AidOffer.grant_cents <= demonstrated_need_cents (no over-granting beyond demonstrated need)"
    error_id: ERR_GRANT_EXCEEDS_NEED
    http_status: 409
    applies_to: "POST /aid-offers and PATCH /aid-offers/{id}"

  - priority: 18
    category: business_fiscal
    check: "Yield run requires School.posture == OPEN (confirmed_enrollment_count < target_class_size) AND at least one WAITLISTED Application; otherwise no-op error."
    error_id: ERR_NO_OPEN_SEATS
    http_status: 409
    applies_to: "POST /admission-cycles/{id}/run-yield"

  - priority: 19
    category: business_temporal
    check: "Yield run cooldown: server_clock must satisfy server_clock >= last_yield_run_at + 86_400_000 ms (24h, CLOSED lower boundary). If last_yield_run_at is null the rule is vacuously satisfied."
    error_id: ERR_YIELD_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /admission-cycles/{id}/run-yield"

  - priority: 20
    category: business_temporal
    check: "Recommender aggregate-capacity: count of RecommendationLetter rows WHERE recommender_id == this AND status == IN_PROGRESS must remain <= 5 after the transition. The boundary is INCLUSIVE — 5 active drafts is permitted; the 6th transition to IN_PROGRESS is rejected."
    error_id: ERR_RECOMMENDER_OVER_CAPACITY
    http_status: 409
    applies_to: "POST /recommendation-letters/{id}/start"

  - priority: 21
    category: business_temporal
    check: "School deadline ordering at creation: ed_deadline_iso < ea_deadline_iso < rd_deadline_iso (strict, half-open intervals where each plan's submission window ends EXCLUSIVELY at its deadline). A school whose ED ends at the same instant EA opens is rejected (no zero-width overlap)."
    error_id: ERR_SCHOOL_DEADLINE_ORDER
    http_status: 422
    applies_to: "POST /schools"

# ===========================================================================
# §1.5 API Endpoints
# ===========================================================================
endpoints:

  # ---------------- Applicants ----------------
  - method: POST
    path: "/applicants/register"
    description: "Public registration of a new Applicant (no auth required)."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, gpa, sat_total?]
    output: Applicant
    side_effects: ["Creates Applicant with profile_status=DRAFT"]

  - method: GET
    path: "/applicants/{id}"
    description: "Fetch own Applicant profile."
    roles: [Applicant, PlatformAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: PATCH
    path: "/applicants/{id}"
    description: "Update mutable Applicant fields. Owner only."
    roles: [Applicant]
    code: 200
    input: [full_name?, gpa?, sat_total?]
    output: Applicant
    side_effects: ["Applicant.version += 1", "If profile became fully populated AND >=1 Recommender row exists, profile_status flips DRAFT→READY"]

  # ---------------- Recommenders ----------------
  - method: POST
    path: "/recommenders"
    description: "Applicant invites a Recommender."
    roles: [Applicant]
    code: 201
    input: [applicant_id, email, full_name, relationship]
    output: Recommender
    side_effects: ["Creates Recommender with invite_status=INVITED", "If Applicant fields are complete, Applicant.profile_status flips DRAFT→READY"]

  - method: GET
    path: "/recommenders/{id}"
    description: "Fetch Recommender record."
    roles: [Applicant, Recommender, PlatformAdmin]
    code: 200
    input: []
    output: Recommender
    side_effects: []

  - method: POST
    path: "/recommenders/{id}/accept"
    description: "Recommender accepts invitation. Public-link style (no auth required, but body must carry email-matching token equivalent — modeled as no auth here)."
    roles: [Anonymous]
    code: 200
    input: []
    output: Recommender
    side_effects: ["invite_status := ACCEPTED", "Recommender.version += 1"]

  - method: POST
    path: "/recommenders/{id}/decline"
    description: "Recommender declines invitation; deletes all REQUESTED letters for this recommender; may flip owning Applicant.profile_status back to DRAFT."
    roles: [Anonymous]
    code: 200
    input: []
    output: Recommender
    side_effects:
      - "invite_status := DECLINED"
      - "All RecommendationLetter rows where recommender_id == this and status == REQUESTED are deleted (cascade depth 1)"
      - "For each affected Application's owning Applicant whose profile_status was READY: re-evaluate; if no Recommender rows remain, flip to DRAFT (cascade depth 2)"
      - "Recommender.version += 1"

  # ---------------- Schools ----------------
  - method: POST
    path: "/schools"
    description: "Create a School with admission cycle parameters."
    roles: [PlatformAdmin]
    code: 201
    input: [name, target_class_size, ed_deadline_iso, ea_deadline_iso, rd_deadline_iso, rolling_open?, requires_css_profile?, cooldown_ms?]
    output: School
    side_effects: ["Creates School and a sibling AdmissionCycle with school_id=this and cooldown_ms (default 86400000)"]

  - method: GET
    path: "/schools/{id}"
    description: "Fetch School record (with computed posture and confirmed_enrollment_count)."
    roles: [Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/schools"
    description: "List schools with pagination."
    roles: [Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: [limit?, offset?]
    output: School[]
    side_effects: []

  - method: GET
    path: "/schools/{id}/yield-report"
    description: "Computed read returning yield_rate, confirmed_enrollment_count, waitlist depth."
    roles: [AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: ["Triggers school_yield_rate calculation"]

  # ---------------- Applications ----------------
  - method: POST
    path: "/applications"
    description: "Create a draft Application linking an Applicant to a School with a chosen plan."
    roles: [Applicant]
    code: 201
    input: [applicant_id, school_id, plan]
    output: Application
    side_effects: ["Creates Application with status=DRAFT; ED binding rule enforced (priority 11)"]

  - method: GET
    path: "/applications/{id}"
    description: "Fetch Application. Response includes computed admission_probability_score; the variant is selected by ?score_variant=PROVISIONAL|FINAL. Default variant is PROVISIONAL while status IN {DRAFT, SUBMITTED}, FINAL once status IN {UNDER_REVIEW, ADMITTED, WAITLISTED, DENIED, DEFERRED, ENROLLED, WITHDRAWN, DECLINED_OFFER}."
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: [score_variant?]
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications. Applicants see their own; AdmissionsOfficer can filter by school_id."
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: [school_id?, status?, plan?, limit?, offset?]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Applicant submits a DRAFT application."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["DRAFT→SUBMITTED transition; locks EssaySubmission; enforces deadline and ED binding rules"]

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Applicant withdraws an application from any non-terminal state."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["Transitions to WITHDRAWN; if was WAITLISTED, recompute remaining waitlist_rank values"]

  - method: POST
    path: "/applications/{id}/start-review"
    description: "Admissions starts reviewing a SUBMITTED application, or re-opens a DEFERRED app post-ED-deadline."
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["SUBMITTED→UNDER_REVIEW or DEFERRED→UNDER_REVIEW"]

  - method: POST
    path: "/applications/{id}/decide"
    description: "Admissions renders a decision."
    roles: [AdmissionsOfficer]
    code: 200
    input: [decision, expected_application_version]
    output: Application
    side_effects: ["UNDER_REVIEW→{ADMITTED, WAITLISTED, DENIED, DEFERRED}; sets decision_at; increments Application.version by 1; WAITLIST also recomputes waitlist_rank for the school"]

  - method: POST
    path: "/applications/{id}/accept-offer"
    description: "Applicant accepts an admission offer. Triggers ED auto-withdraw cascade if plan==EARLY_DECISION."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "ADMITTED→ENROLLED"
      - "School.confirmed_enrollment_count += 1; School.posture recomputed"
      - "If Application.plan == EARLY_DECISION: cascade-withdraws all sibling non-terminal Applications (depth 2), then those withdrawals' WAITLISTED removals recompute waitlist_rank on freed schools (depth 3)"

  - method: POST
    path: "/applications/{id}/decline-offer"
    description: "Applicant declines an admission offer."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["ADMITTED→DECLINED_OFFER"]

  - method: POST
    path: "/applications/{id}/revoke-enrollment"
    description: "Applicant revokes a previous acceptance (ENROLLED→DECLINED_OFFER). Compensating action for accept-offer: decrements School.confirmed_enrollment_count by 1 to restore the enrollment-ledger invariant."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["ENROLLED→DECLINED_OFFER", "School.confirmed_enrollment_count -= 1; School.posture recomputed"]

  # ---------------- Essays ----------------
  - method: POST
    path: "/essay-submissions"
    description: "Create essay for a DRAFT Application."
    roles: [Applicant]
    code: 201
    input: [application_id, prompt_code, body]
    output: EssaySubmission
    side_effects: ["Creates EssaySubmission with locked=false; word_count auto-computed"]

  - method: PATCH
    path: "/essay-submissions/{id}"
    description: "Edit essay text/prompt. Allowed only while locked==false (Application still in DRAFT)."
    roles: [Applicant]
    code: 200
    input: [prompt_code?, body?]
    output: EssaySubmission
    side_effects: ["Recomputes word_count; EssaySubmission.version += 1"]

  # ---------------- Recommendation Letters ----------------
  - method: POST
    path: "/recommendation-letters"
    description: "Applicant requests a letter from a Recommender for a specific Application."
    roles: [Applicant]
    code: 201
    input: [application_id, recommender_id]
    output: RecommendationLetter
    side_effects: ["Creates RecommendationLetter with status=REQUESTED"]

  - method: POST
    path: "/recommendation-letters/{id}/start"
    description: "Recommender begins drafting a letter (REQUESTED→IN_PROGRESS)."
    roles: [Recommender]
    code: 200
    input: []
    output: RecommendationLetter
    side_effects: ["Status REQUESTED→IN_PROGRESS"]

  - method: POST
    path: "/recommendation-letters/{id}/submit"
    description: "Recommender submits the letter (IN_PROGRESS→SUBMITTED)."
    roles: [Recommender]
    code: 200
    input: [body]
    output: RecommendationLetter
    side_effects: ["Sets body, submitted_at; status IN_PROGRESS→SUBMITTED"]

  - method: POST
    path: "/recommendation-letters/{id}/waive"
    description: "Applicant waives the letter requirement (REQUESTED|IN_PROGRESS → WAIVED). Disallowed when plan==EARLY_DECISION."
    roles: [Applicant]
    code: 200
    input: []
    output: RecommendationLetter
    side_effects: ["Status to WAIVED"]

  # ---------------- Financial Aid ----------------
  - method: POST
    path: "/financial-aid-profiles"
    description: "Applicant creates a financial aid profile."
    roles: [Applicant]
    code: 201
    input: [applicant_id, fafsa_efc_cents, css_efc_cents?, family_income_cents]
    output: FinancialAidProfile
    side_effects: ["Creates FinancialAidProfile with status=DRAFT"]

  - method: POST
    path: "/financial-aid-profiles/{id}/submit"
    description: "Submit the financial aid profile (DRAFT→SUBMITTED)."
    roles: [Applicant]
    code: 200
    input: []
    output: FinancialAidProfile
    side_effects: ["Status DRAFT→SUBMITTED"]

  - method: GET
    path: "/financial-aid-profiles/{id}"
    description: "Read FA profile (owner or FAOfficer)."
    roles: [Applicant, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: FinancialAidProfile
    side_effects: []

  - method: POST
    path: "/aid-offers"
    description: "FinancialAidOfficer issues an AidOffer for an ADMITTED Application."
    roles: [FinancialAidOfficer]
    code: 201
    input: [application_id, cost_of_attendance_cents, variant, grant_cents, loan_cents, work_study_cents, expected_application_version]
    output: AidOffer
    side_effects: ["Creates AidOffer; runs demonstrated_need_calc; Application.version += 1 (the OCC parent)"]

  - method: PATCH
    path: "/aid-offers/{id}"
    description: "Adjust grant/loan/work_study; re-runs net_price computation."
    roles: [FinancialAidOfficer]
    code: 200
    input: [grant_cents?, loan_cents?, work_study_cents?]
    output: AidOffer
    side_effects: ["Recomputes net_price_cents; AidOffer.version += 1"]

  - method: GET
    path: "/aid-offers/{id}"
    description: "Read AidOffer."
    roles: [Applicant, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AidOffer
    side_effects: []

  # ---------------- Yield Management ----------------
  - method: POST
    path: "/admission-cycles/{id}/run-yield"
    description: "Run the yield-management ops checkpoint: promote top-ranked WAITLISTED applicants into ADMITTED until open_seats is exhausted."
    roles: [AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects:
      - "Promotes up to open_seats WAITLISTED Applications to ADMITTED in waitlist_rank order"
      - "Recomputes waitlist_rank for remaining WAITLISTED applications"
      - "AdmissionCycle.yield_run_count += 1; last_yield_run_at := server clock"

  - method: GET
    path: "/admission-cycles/{id}"
    description: "Read admission cycle metadata."
    roles: [AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AdmissionCycle
    side_effects: []

  # ---------------- Test-driving (under /_) ----------------
  - method: POST
    path: "/_clock/advance"
    description: "Test-driving endpoint: advance the global server clock to the supplied ISO8601 timestamp. Required because plan deadlines and ED rules are clock-sensitive."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: object
    side_effects: ["Mutates the global server clock used by all timestamp comparisons"]

# ===========================================================================
# §1.6 Errors
# ===========================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADERS,         http: 401, condition: "Required auth headers missing on a non-public endpoint" }
  - { id: ERR_UNKNOWN_ROLE,                 http: 401, condition: "X-User-Role is not a known role" }
  - { id: ERR_FORBIDDEN_ROLE,               http: 403, condition: "Role is not permitted to call this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER,           http: 403, condition: "Actor is authenticated but does not own the targeted resource" }
  - { id: ERR_RESOURCE_NOT_FOUND,           http: 404, condition: "A path-templated id does not resolve to an existing resource" }
  - { id: ERR_FK_NOT_FOUND,                 http: 404, condition: "A foreign-key field in the request body does not resolve" }
  - { id: ERR_INVALID_REQUEST,              http: 422, condition: "Required field missing, type wrong, enum value invalid, or numeric constraint violated" }
  - { id: ERR_ESSAY_WORD_COUNT_OUT_OF_RANGE, http: 422, condition: "Essay word_count is outside 1..650 inclusive" }
  - { id: ERR_DUPLICATE_RESOURCE,           http: 409, condition: "Uniqueness constraint violated" }
  - { id: ERR_INVALID_STATE,                http: 409, condition: "Target resource is not in the required from-state for the transition" }
  - { id: ERR_ED_BINDING_VIOLATION,         http: 409, condition: "Applicant already has an Application with plan=EARLY_DECISION in a non-terminal status" }
  - { id: ERR_ED_REQUIRES_LETTER,           http: 409, condition: "Submitting an ED application without at least one SUBMITTED RecommendationLetter" }
  - { id: ERR_DEADLINE_PASSED,              http: 409, condition: "Server clock is past the plan's deadline at submission time" }
  - { id: ERR_ALREADY_ENROLLED,             http: 409, condition: "Applicant already has another Application in ENROLLED status" }
  - { id: ERR_INSTITUTIONAL_VARIANT_INELIGIBLE, http: 409, condition: "INSTITUTIONAL aid variant requested but school does not require CSS or CSS EFC missing" }
  - { id: ERR_GRANT_EXCEEDS_NEED,           http: 409, condition: "Grant amount exceeds demonstrated_need_cents" }
  - { id: ERR_NO_OPEN_SEATS,                http: 409, condition: "Yield run requested but School.posture != OPEN or no WAITLISTED applicants" }
  - { id: ERR_YIELD_COOLDOWN_ACTIVE,        http: 409, condition: "Yield run requested before 24h have elapsed since last_yield_run_at" }
  - { id: ERR_RECOMMENDER_OVER_CAPACITY,    http: 409, condition: "Recommender already has 5 IN_PROGRESS letters; cannot start a 6th" }
  - { id: ERR_SCHOOL_DEADLINE_ORDER,        http: 422, condition: "School deadlines violate strict ED < EA < RD ordering" }
  - { id: ERR_STALE_APPLICATION_VERSION,    http: 412, condition: "OCC mismatch on Application.version for endpoints listed in §1.2.1" }

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Applicant
    description: "Person applying to schools. Owns Applicant, Application, EssaySubmission, FinancialAidProfile, RecommendationLetter (as requester), and AidOffer (as recipient)."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications"
      - "PATCH /applicants/{id}"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
