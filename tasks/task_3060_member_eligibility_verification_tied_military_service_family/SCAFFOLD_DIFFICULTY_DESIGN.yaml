              as: EligibilityApplicant
              captures: { sr_o: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_o}/evidence"
              payload: { doc_type: "LEAVE_EARNINGS_STATEMENT", issuing_authority: "DFAS", issued_on: "2026-12-01", covers_service_record_id: "${sr_o}", content_hash: "o14" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_o}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_o}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_o}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { mo: $.data.member_id }
            - call: "GET /membership/members/${mo}"
              payload: {}
              as: VerificationOfficer
