  # ==========================================================================
  # Section: cross-cutting complexity layers
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: routing_policy_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[routing-policy-create-stale-hospital]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ClientHospital.version: a second policy create carrying the pre-supersede version is rejected 412; the same create with the fresh version succeeds and retires the same-key predecessor."
        test_recipe:
          setup: ["ACTIVE hospital; policy P1 created (CT/NEURO/ROUTINE), which bumped hospital.version"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp OCC", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin, captures: { pol1: $.data.id } }
          trigger:
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "BODY", prelim_required: true, expected_hospital_version: "${hv}" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /telerad/hospitals/${hosp}", payload: {}, as: PlatformAdmin, captures: { hv2: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "BODY", prelim_required: true, expected_hospital_version: "${hv2}" }, as: PlatformAdmin, captures: { pol2: $.data.id } }
            - { call: "GET /telerad/routing-policies/${pol1}", payload: {}, as: PlatformAdmin, captures: { p1st: $.data.status } }
            - { call: "GET /telerad/routing-policies/${pol2}", payload: {}, as: PlatformAdmin, captures: { p2st: $.data.status } }
            - { call: "GET /telerad/hospitals/${hosp}", payload: {}, as: PlatformAdmin, captures: { hv3: $.data.version } }
          assert:
            - "stale create: error_id == ERR_STALE_VERSION; http 412"
            - "fresh create succeeds; RoutingPolicy.${pol1}.status == RETIRED (superseded) and ${pol2}.status == ACTIVE"
            - "hospital version == 4 (create 1, activate 2, P1 create 3, P2 create 4); stale attempt did not increment"

      - name: invoice_generate_stale_version_rejected_and_regenerate_supersedes
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[invoice-generate-stale-period]", "errors[ERR_STALE_VERSION]", state_machines.Invoice.CURRENT_to_VOID]
        distinguishing_aspect: "OCC on BillingPeriod.version: regenerating an invoice with the pre-first-generate version is rejected 412; with the fresh version it succeeds, voids the prior CURRENT invoice, and produces identical totals when the input set is unchanged."
        test_recipe:
          setup: ["MARGINAL hospital; 1 seeded study; period CLOSED; invoice I1 generated"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp OI", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hosp}", count: 1, received_at: "2026-05-04T10:00:00Z", final_signed_at: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${hosp}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: PlatformAdmin, captures: { per: $.data.id } }
            - { call: "POST /telerad/billing-periods/${per}/close", payload: {}, as: PlatformAdmin, captures: { pv: $.data.version } }
            - { call: "POST /telerad/billing-periods/${per}/generate-invoice", payload: { expected_billing_period_version: "${pv}" }, as: PlatformAdmin, captures: { inv1: $.data.id } }
          trigger:
            - { call: "POST /telerad/billing-periods/${per}/generate-invoice", payload: { expected_billing_period_version: "${pv}" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /telerad/billing-periods/${per}", payload: {}, as: PlatformAdmin, captures: { pv2: $.data.version, pst: $.data.status } }
            - { call: "POST /telerad/billing-periods/${per}/generate-invoice", payload: { expected_billing_period_version: "${pv2}" }, as: PlatformAdmin, captures: { inv2: $.data.id, g2: $.data.gross_cents } }
            - { call: "GET /telerad/invoices/${inv1}", payload: {}, as: PlatformAdmin, captures: { i1st: $.data.status } }
          assert:
            - "stale regenerate: error_id == ERR_STALE_VERSION; http 412 (period.version had advanced past the observed value)"
            - "fresh regenerate succeeds from INVOICED (supersede self-loop); Invoice.${inv1}.status == VOID"
            - "new Invoice.${inv2}.gross_cents == 901 (unchanged input set -> identical totals)"

      - name: completed_rvu_24h_window_rolls_with_clock
        claim_type: derived_field_reconciliation
        grounds: [calculations.fatigue_utilization, entities.Radiologist.fields.completed_rvu_24h]
        distinguishing_aspect: "completed_rvu_24h is re-derived against the logical clock with a strict lower bound: a report signed at T counts at T+23:59:59 (1.5) and drops out at exactly T+24:00:00 (0.0)."
        test_recipe:
          setup: ["full fixture; FINAL report signed at 2026-05-10T10:00:00Z crediting 1.5 RVU"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp WR", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "WR Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-WR", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "WR" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "POST /telerad/assignments/${asg}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg}", report_type: "FINAL", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad}", captures: { rep: $.data.id } }
            - { call: "POST /telerad/reports/${rep}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}" }
          trigger:
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T09:59:59Z" }, as: PlatformAdmin }
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { c1: $.data.completed_rvu_24h } }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T10:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { c2: $.data.completed_rvu_24h } }
          assert:
            - "at T+23:59:59: completed_rvu_24h == 1.5 (still inside the window)"
            - "at exactly T+24:00:00: completed_rvu_24h == 0.0 (strict lower bound signed_at > now-24h excludes the boundary)"

      - name: cascade_coverage_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Study.IN_PROGRESS_to_FINAL_SIGNED, state_machines.Study.ASSIGNED_to_QUEUED]
        excluded_because:
          difficulty_instance: final_sign_critical_cascade
          rationale: "The N-level cascade chains (sign -> report/study -> notice/case -> radiologist counters; release -> assignment -> study -> radiologist) are asserted hop-by-hop in the named difficulty instance and in release_requeue_cascade."

      - name: dual_variant_coverage_stub
        claim_type: variant_divergence
        grounds: [calculations.report_rvu_credit, calculations.invoice_volume_pricing]
        excluded_because:
          difficulty_instance: report_credit_provisional_vs_final_variant
          rationale: "Variant divergence and variant selection for both dual-variant calculations are asserted in report_credit_provisional_vs_final_variant and invoice_pricing_marginal_vs_flat_tier."

  # ==========================================================================
  # Section: consistency model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_assignment
        claim_type: immediate
        grounds: [complexity_profile, entities.Study.fields.assigned_radiologist_id]
        distinguishing_aspect: "Immediate consistency: the assignment POST response already shows status ACTIVE with reserved_rvu 1.5, and an immediate GET on the study shows ASSIGNED with assigned_radiologist_id set — no eventual lag."
        test_recipe:
          setup: ["full fixture; one QUEUED CT study"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp IM", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "IM Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-IM", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "IM" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { ast: $.data.status, arvu: $.data.reserved_rvu } }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { sst: $.data.status, srad: $.data.assigned_radiologist_id } }
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { rres: $.data.reserved_rvu } }
          assert:
            - "assignment response: status == ACTIVE, reserved_rvu == 1.5 (mutation visible in the same response)"
            - "immediate GET study: status == ASSIGNED, assigned_radiologist_id == ${rad}"
            - "immediate GET radiologist: reserved_rvu == 1.5 (derived field reconciled synchronously)"
