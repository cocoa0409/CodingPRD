scaffold_corner_design:

  # =====================================================================================
  # SECTION ENTITIES
  # =====================================================================================
  - section: Entities
    instances:
      - name: state_law_rule_creation_returns_201_and_echoes_every_declared_field
        claim_type: Creation
        grounds:
          - entities.StateLawRule
          - endpoints.POST_/coop/state-law-rules
          - endpoints.GET_/coop/state-law-rules/{id}
          - response_envelope.success
        distinguishing_aspect: >-
          A single POST with every declared input field returns 201 inside the fixed success envelope and the subsequent read-back returns the identical stored row, so no input field is silently dropped.
        test_recipe:
          setup:
            - "Empty database."
            - "The logical clock reads 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
          trigger:
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "TX", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 14, requires_lead_agency_in_state: false, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { rule_tx_id: $.data.id }
            - call: "GET /coop/state-law-rules/${rule_tx_id}"
              payload: {}
              as: MemberAuditor
              as_user_id: "aud-member-01"
          assert:
            - "the create response status == 201"
            - "the create response response_type == object"
            - "the create response meta.api_request_id is present and non-empty"
            - "StateLawRule.${rule_tx_id}.state_code == TX"
            - "StateLawRule.${rule_tx_id}.piggyback_doctrine == STATUTORY_STRICT"
            - "StateLawRule.${rule_tx_id}.min_notice_days == 14"
            - "StateLawRule.${rule_tx_id}.requires_lead_agency_in_state == false"
            - "StateLawRule.${rule_tx_id}.allows_nonprofit_participation == true"
            - "StateLawRule.${rule_tx_id}.max_contract_term_months == 60"
            - "StateLawRule.${rule_tx_id}.requires_local_solicitation_waiver == false"
            - "StateLawRule.${rule_tx_id}.reciprocity_state_codes == []"
            - "the read-back response status == 200 and its data.state_code == TX"
      - name: master_contract_read_back_returns_the_stored_award_terms
        claim_type: Retrieval
        grounds:
          - entities.MasterContract
          - endpoints.GET_/coop/master-contracts/{id}
          - state_machines.MasterContract.status.PENDING_EXECUTION_to_ACTIVE
        distinguishing_aspect: >-
          GET /coop/master-contracts/{id} returns the awarded terms exactly as stored, including current_term_end 2027-09-01T00:00:00Z written by EXECUTE and the zeroed usage and fee ledger, and a read-only MemberAuditor is allowed to perform it.
        test_recipe:
          setup:
            - "StateLawRule rows exist for TX and CA."
            - "Solicitation COOP-2026-001 is AWARDED to Acme Facility Supply LLC."
            - "MasterContract COOP-MC-2026-001 is ACTIVE with one ACTIVE line JAN-DISP-500 and no usage yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "TX", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 14, requires_lead_agency_in_state: false, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "CA", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 21, requires_lead_agency_in_state: true, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
            - call: "POST /coop/suppliers"
              payload: { legal_name: "Acme Facility Supply LLC", home_state_code: "TX" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { sup_a_id: $.data.id }
            - call: "POST /coop/suppliers/${sup_a_id}/qualification"
              payload: { action: "QUALIFY" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
            - call: "POST /coop/suppliers"
              payload: { legal_name: "Bright Path Janitorial Inc", home_state_code: "CA" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { sup_b_id: $.data.id }
            - call: "POST /coop/suppliers/${sup_b_id}/qualification"
              payload: { action: "QUALIFY" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
            - call: "POST /coop/solicitations"
              payload: { title: "Janitorial Supplies and Equipment", solicitation_number: "COOP-2026-001", lead_agency_name: "Travis County Purchasing", lead_agency_state_code: "TX", response_due_at: "2026-06-22T00:00:00Z", technical_weight_pct: 60.00, price_weight_pct: 40.00, specification_document_ref: "SPEC-COOP-2026-001", method_justification_ref: "METH-COOP-2026-001" }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
              captures: { sol_id: $.data.id }
            - call: "POST /coop/solicitations/${sol_id}/lifecycle"
              payload: { action: "POST_NOTICE" }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
            - call: "POST /coop/solicitation-responses"
              payload: { solicitation_id: "${sol_id}", supplier_id: "${sup_a_id}", proposed_annual_value_cents: 1000000 }
              as: SupplierRepresentative
              as_user_id: "${sup_a_id}"
              captures: { resp_a_id: $.data.id }
            - call: "POST /coop/solicitation-responses"
              payload: { solicitation_id: "${sol_id}", supplier_id: "${sup_b_id}", proposed_annual_value_cents: 1250000 }
              as: SupplierRepresentative
              as_user_id: "${sup_b_id}"
              captures: { resp_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-23T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN_EVALUATION" }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
            - call: "POST /coop/solicitation-responses/${resp_a_id}/review"
              payload: { action: "MARK_RESPONSIVE", technical_score: 88.00 }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
            - call: "POST /coop/solicitation-responses/${resp_b_id}/review"
              payload: { action: "MARK_RESPONSIVE", technical_score: 95.00 }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
            - call: "POST /coop/solicitations/${sol_id}/lifecycle"
              payload: { action: "RECOMMEND_AWARD" }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
            - call: "POST /coop/solicitations/${sol_id}/lifecycle"
              payload: { action: "AWARD" }
              as: LeadAgencyOfficer
              as_user_id: "lao-awarder-02"
            - call: "POST /coop/master-contracts"
              payload: { solicitation_id: "${sol_id}", supplier_id: "${sup_a_id}", contract_number: "COOP-MC-2026-001", admin_fee_rate_bps: 200, base_term_start: "2026-09-01T00:00:00Z", base_term_end: "2027-09-01T00:00:00Z", max_renewals: 2, price_escalation_cap_pct: 0.0500, discount_tiers: [{ tier_index: 0, min_annual_spend_cents: 0, discount_pct: 0.0000 }, { tier_index: 1, min_annual_spend_cents: 5000000, discount_pct: 0.0500 }, { tier_index: 2, min_annual_spend_cents: 20000000, discount_pct: 0.1800 }], permitted_add_ons: [{ code: "FREIGHT", rate_pct: 0.0600, cap_cents: 50000 }, { code: "INSIDE_DELIVERY", rate_pct: 0.0400, cap_cents: 15000 }, { code: "TRAINING", rate_pct: 0.1000, cap_cents: 100000 }], nationwide_pricing_flag: true }
              as: LeadAgencyOfficer
              as_user_id: "lao-awarder-02"
              captures: { mc_id: $.data.id }
            - call: "POST /coop/master-contracts/${mc_id}/line-items"
              payload: { sku: "JAN-DISP-500", item_description: "Wall dispenser, 500 sheet", unit_of_measure: "EACH", base_unit_price_cents: 12500, price_floor_cents: 9000 }
              as: LeadAgencyOfficer
              as_user_id: "lao-awarder-02"
              captures: { li_disp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/master-contracts/${mc_id}/award-status"
              payload: { action: "EXECUTE" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
          trigger:
            - call: "GET /coop/master-contracts/${mc_id}"
              payload: {}
              as: MemberAuditor
              as_user_id: "aud-member-01"
          assert:
            - "response status == 200 and response_type == object"
            - "MasterContract.${mc_id}.contract_number == COOP-MC-2026-001"
            - "MasterContract.${mc_id}.status == ACTIVE"
            - "MasterContract.${mc_id}.compliance_posture == COMPLIANT"
            - "MasterContract.${mc_id}.admin_fee_rate_bps == 200"
            - "MasterContract.${mc_id}.base_term_start == 2026-09-01T00:00:00Z"
            - "MasterContract.${mc_id}.base_term_end == 2027-09-01T00:00:00Z"
            - "MasterContract.${mc_id}.current_term_end == 2027-09-01T00:00:00Z"
            - "MasterContract.${mc_id}.max_renewals == 2"
            - "MasterContract.${mc_id}.renewals_used == 0"
            - "MasterContract.${mc_id}.nationwide_pricing_flag == true"
            - "MasterContract.${mc_id}.usage_chargeable_cents_total == 0"
            - "MasterContract.${mc_id}.fee_assessed_cents_total == 0"
            - "MasterContract.${mc_id}.fee_remitted_cents_total == 0"
            - "MasterContract.${mc_id}.fee_outstanding_cents == 0"
            - "MasterContract.${mc_id}.delinquent_report_count == 0"
            - "MasterContract.${mc_id}.discount_tiers has exactly 3 entries"
            - "MasterContract.${mc_id}.permitted_add_ons has exactly 3 entries"
      - name: member_agency_listing_paginates_filters_and_orders_by_created_at
        claim_type: Listing
        grounds:
          - endpoints.GET_/coop/member-agencies
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          With exactly three members the first page of limit 2 reports total_count 3 and has_more true while offset 2 reports has_more false with one item, the default page reports limit 10 and has_more false, and the state_code filter narrows total_count to 2.
        test_recipe:
          setup:
            - "StateLawRule rows exist for TX and CA."
            - "Three MemberAgency rows are created in this order: City of Austin (TX, CITY), Travis County (TX, COUNTY), Riverside Unified School District (CA, K12_DISTRICT)."
            - "None of them has been verified, so all three are PENDING_VERIFICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "TX", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 14, requires_lead_agency_in_state: false, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "CA", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 21, requires_lead_agency_in_state: true, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
            - call: "POST /coop/member-agencies"
              payload: { legal_name: "City of Austin", state_code: "TX", member_category: "CITY", annual_spend_ceiling_cents: 5000000, governing_body_resolution_number: "RES-2026-208" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { mem_a1_id: $.data.id, mem_a1_v1: $.data.version }
            - call: "POST /coop/member-agencies"
              payload: { legal_name: "Travis County", state_code: "TX", member_category: "COUNTY", annual_spend_ceiling_cents: 7000000, governing_body_resolution_number: "RES-2026-209" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { mem_a2_id: $.data.id, mem_a2_v1: $.data.version }
            - call: "POST /coop/member-agencies"
              payload: { legal_name: "Riverside Unified School District", state_code: "CA", member_category: "K12_DISTRICT", annual_spend_ceiling_cents: 10000000, governing_body_resolution_number: "RES-2026-114" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { mem_a3_id: $.data.id, mem_a3_v1: $.data.version }
          trigger:
            - call: "GET /coop/member-agencies"
              payload: { limit: 2, offset: 0 }
              as: MemberAuditor
              as_user_id: "aud-member-01"
            - call: "GET /coop/member-agencies"
              payload: { limit: 2, offset: 2 }
              as: MemberAuditor
              as_user_id: "aud-member-01"
            - call: "GET /coop/member-agencies"
              payload: {}
              as: MemberAuditor
              as_user_id: "aud-member-01"
            - call: "GET /coop/member-agencies"
              payload: { state_code: "TX" }
              as: MemberAuditor
              as_user_id: "aud-member-01"
            - call: "GET /coop/member-agencies"
              payload: { registration_status: "ACTIVE" }
              as: MemberAuditor
              as_user_id: "aud-member-01"
          assert:
            - "every list response has response_type == array"
            - "page one: total_count == 3, limit == 2, offset == 0, has_more == true, 2 items returned"
            - "page one items are ordered created_at ASC, so item 0 is City of Austin and item 1 is Travis County"
            - "page two: total_count == 3, limit == 2, offset == 2, has_more == false, 1 item returned"
            - "page two item 0 is Riverside Unified School District"
            - "the unparameterised page reports limit == 10, offset == 0, total_count == 3, has_more == false"
            - "the state_code TX filter reports total_count == 2 and returns no CA member"
            - "the registration_status ACTIVE filter reports total_count == 0, has_more == false and returns 0 items"
      - name: every_path_id_family_reports_its_own_not_found_error
        claim_type: Not Found
        grounds:
          - validations.priority_4
          - errors.ERR_SOLICITATION_NOT_FOUND
          - errors.ERR_SUPPLIER_NOT_FOUND
          - errors.ERR_RESPONSE_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_LINE_ITEM_NOT_FOUND
          - errors.ERR_MEMBER_NOT_FOUND
          - errors.ERR_ANALYSIS_NOT_FOUND
          - errors.ERR_USAGE_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - errors.ERR_AMENDMENT_NOT_FOUND
          - errors.ERR_COMPLAINT_NOT_FOUND
          - errors.ERR_STATE_LAW_RULE_NOT_FOUND
          - response_envelope.error
        distinguishing_aspect: >-
          Priority 4 resolves the path id against the entity that owns the route, so each of the twelve read routes answers with its OWN entity-specific 404 error_id rather than a shared generic not-found code.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
          trigger:
            - call: "GET /coop/solicitations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_sol: $.data.error_id }
            - call: "GET /coop/suppliers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_sup: $.data.error_id }
            - call: "GET /coop/solicitation-responses/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_resp: $.data.error_id }
            - call: "GET /coop/master-contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_mc: $.data.error_id }
            - call: "GET /coop/contract-line-items/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_li: $.data.error_id }
            - call: "GET /coop/member-agencies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_mem: $.data.error_id }
            - call: "GET /coop/piggyback-analyses/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_pb: $.data.error_id }
            - call: "GET /coop/contract-usages/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_use: $.data.error_id }
            - call: "GET /coop/usage-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_rpt: $.data.error_id }
            - call: "GET /coop/contract-amendments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_amd: $.data.error_id }
            - call: "GET /coop/complaints/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_cmp: $.data.error_id }
            - call: "GET /coop/state-law-rules/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_rule: $.data.error_id }
          assert:
            - "every one of the twelve responses has http_status == 404 and response_type == error"
            - "every one of the twelve responses carries a non-empty data.message"
            - "the solicitation route returns error_id == ERR_SOLICITATION_NOT_FOUND"
            - "the supplier route returns error_id == ERR_SUPPLIER_NOT_FOUND"
            - "the solicitation-response route returns error_id == ERR_RESPONSE_NOT_FOUND"
            - "the master-contract route returns error_id == ERR_CONTRACT_NOT_FOUND"
            - "the contract-line-item route returns error_id == ERR_LINE_ITEM_NOT_FOUND"
            - "the member-agency route returns error_id == ERR_MEMBER_NOT_FOUND"
            - "the piggyback-analysis route returns error_id == ERR_ANALYSIS_NOT_FOUND"
            - "the contract-usage route returns error_id == ERR_USAGE_NOT_FOUND"
            - "the usage-report route returns error_id == ERR_REPORT_NOT_FOUND"
            - "the contract-amendment route returns error_id == ERR_AMENDMENT_NOT_FOUND"
            - "the complaint route returns error_id == ERR_COMPLAINT_NOT_FOUND"
            - "the state-law-rule route returns error_id == ERR_STATE_LAW_RULE_NOT_FOUND"
      - name: omitting_a_required_input_field_is_refused_before_any_row_is_written
        claim_type: Required Fields
        grounds:
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
          - entities.Solicitation.fields.price_weight_pct
          - entities.Supplier.fields.home_state_code
          - entities.MemberAgency.fields.annual_spend_ceiling_cents
          - entities.StateLawRule.fields.requires_local_solicitation_waiver
        distinguishing_aspect: >-
          Each probe omits exactly one field whose source is input and whose default is absent, so priority 3 answers ERR_INVALID_REQUEST with http_status 400 and the collection stays empty - no partially populated row is persisted.
        test_recipe:
          setup:
            - "A StateLawRule row exists for TX."
            - "No Solicitation, Supplier or MemberAgency row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "TX", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 14, requires_lead_agency_in_state: false, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
          trigger:
            - call: "POST /coop/solicitations"
              payload: { title: "Janitorial Supplies and Equipment", solicitation_number: "COOP-2026-001", lead_agency_name: "Travis County Purchasing", lead_agency_state_code: "TX", response_due_at: "2026-06-22T00:00:00Z", technical_weight_pct: 60.00 }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
              captures: { e_sol: $.data.error_id }
            - call: "POST /coop/suppliers"
              payload: { legal_name: "Acme Facility Supply LLC" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { e_sup: $.data.error_id }
            - call: "POST /coop/member-agencies"
              payload: { legal_name: "City of Austin", state_code: "TX", member_category: "CITY", governing_body_resolution_number: "RES-2026-208" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { e_mem: $.data.error_id }
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "NV", piggyback_doctrine: "RECIPROCITY_LIBERAL", min_notice_days: 30, requires_lead_agency_in_state: false, allows_nonprofit_participation: false, max_contract_term_months: 60 }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { e_rule: $.data.error_id }
            - call: "GET /coop/solicitations"
              payload: {}
              as: MemberAuditor
              as_user_id: "aud-member-01"
          assert:
            - "all four probes return error_id == ERR_INVALID_REQUEST with http_status == 400"
            - "the missing price_weight_pct probe is rejected even though technical_weight_pct is present"
            - "GET /coop/solicitations reports total_count == 0, so no partial Solicitation was written"
            - "no Supplier, MemberAgency or StateLawRule row was created for NV"
      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.StateLawRule.fields.reciprocity_state_codes
          - entities.Solicitation.fields.specification_document_ref
          - entities.Solicitation.fields.addenda_count
          - entities.MemberAgency.fields.irs_determination_letter_number
          - entities.MemberAgency.fields.committed_spend_cents
        distinguishing_aspect: >-
          Every omitted optional input lands on its declared default - [] for reciprocity_state_codes, null for the two document refs and for irs_determination_letter_number, 0 for the counters - and null is distinguishable from the empty array.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
          trigger:
