# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >= 2 instances = 18 instances. Every grounds[] resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls / trigger chain is executable
# from empty-DB using only §1.5 endpoints. Money in integer cents; weights in
# milli-units (1000 milli = 1 lb). Clock is set via POST /_clock/advance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- (a) FEFO cogs (SaleLineItem/InventoryLot domain) vs book-value rollup (Product domain) ----
      - name: fefo_cogs_vs_book_value_rollup_diverge
        grounds:
          - calculations.fefo_depletion
          - calculations.product_inventory_rollup
          - entities.SalesTransaction.fields.cogs_cents
          - entities.Product.fields.on_hand_value_cents
          - state_machines.SalesTransaction.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Two algorithms read the SAME lot rows yet measure different entity domains: fefo_depletion
          yields SalesTransaction.cogs_cents over the DEPLETED units (ACTIVE non-expired lots, FEFO order),
          while product_inventory_rollup yields Product.on_hand_value_cents over the SURVIVING ACTIVE+QUARANTINED
          lots; for the same sale they produce different numbers (130 vs 450).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Department PRODUCE; weighed Product (PLU, perishable) everyday 100 c/lb, reorder_point 0."
            - "Lot1 received_qty 1000 milli @ cost 80 c/lb, expires 2026-06-10 (soonest); Lot2 received_qty 5000 milli @ cost 100 c/lb, expires 2026-06-20."
            - "An OPEN sale with one weighed line of 1500 milli."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "PRODUCE", name: "Produce" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Bananas", plu: "4011", sell_by_weight: true, unit_price_cents: 100, is_perishable: true, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "Acme", reference_code: "REF-A1", expected_total_cents: 580 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 1000, accepted_qty: 1000, unit_cost_cents: 80, expiration_date: "2026-06-10T00:00:00Z" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            # received_total = rhu(1000*80/1000)=80; expected 580 -> way over tolerance; use StoreManager override
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "GET /products/${prod_id}"
              payload: {}
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_v3: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "Acme", reference_code: "REF-A2", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship2_id: $.data.id }
            - call: "POST /shipments/${ship2_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 5000, accepted_qty: 5000, unit_cost_cents: 100, expiration_date: "2026-06-20T00:00:00Z" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship2_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            # received_total = rhu(5000*100/1000)=500 == expected 500 -> within tolerance, no override needed
            - call: "POST /shipments/${ship2_id}/receive"
              payload: { expected_product_version: "${prod_v3}" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", weight_milli: 1500 }
              as: Cashier
              as_user_id: "csh-1"
          trigger:
            - call: "POST /sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { cogs: $.data.cogs_cents }
          assert:
            - "SalesTransaction.${sale_id}.cogs_cents == 130"
            - "Product.${prod_id}.on_hand_value_cents == 450"
            - "Product.${prod_id}.on_hand_qty == 4500"
            - "SalesTransaction.${sale_id}.cogs_cents != Product.${prod_id}.on_hand_value_cents"

      # ---- (b) line_extended_price stacked-vs-promo-only (SaleLineItem/Promotion domain) ----
      - name: promo_discount_base_stacked_vs_everyday
        grounds:
          - calculations.line_extended_price
          - calculations.effective_unit_price
          - entities.SaleLineItem.fields.extended_price_cents
          - entities.Promotion.fields.stackable
        distinguishing_aspect: |
          The SAME 20%-off promotion produces different SaleLineItem.extended_price_cents (480 vs 640)
          depending on its discount base: the stackable variant discounts off the applied ad price (150),
          the non-stackable variant (no ad covering the line) discounts off the everyday price (200).
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z."
            - "Product P1 each-sold everyday 200 c, with ACTIVE ad price 150 c and stackable 20%-off promo; on-hand 10."
            - "Product P2 each-sold everyday 200 c, NO ad, non-stackable 20%-off promo; on-hand 10."
            - "Two sales, each one line quantity 4 of the respective product."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Chips A", sku: "SKU-A", sell_by_weight: false, unit_price_cents: 200, is_perishable: false, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Chips B", sku: "SKU-B", sell_by_weight: false, unit_price_cents: 200, is_perishable: false, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { p2_id: $.data.id, p2_v: $.data.version }
            - call: "POST /price-plans"
              payload: { product_id: "${p1_id}", ad_price_cents: 150, effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-30T00:00:00Z", expected_product_version: "${p1_v}" }
              as: PriceManager
              as_user_id: "pm-1"
            - call: "POST /promotions"
              payload: { product_id: "${p1_id}", promo_type: "PERCENT_OFF", percent_off_bps: 2000, min_qty: 1, stackable: true, effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-30T00:00:00Z" }
              as: PriceManager
              as_user_id: "pm-1"
            - call: "POST /promotions"
              payload: { product_id: "${p2_id}", promo_type: "PERCENT_OFF", percent_off_bps: 2000, min_qty: 1, stackable: false, effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-30T00:00:00Z" }
              as: PriceManager
              as_user_id: "pm-1"
            # stock both products
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-B1", expected_total_cents: 1000 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { s1_id: $.data.id }
            - call: "POST /shipments/${s1_id}/lines"
              payload: { product_id: "${p1_id}", ordered_qty: 10, accepted_qty: 10, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${s1_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "GET /products/${p1_id}"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { p1_v_now: $.data.version }
            - call: "POST /shipments/${s1_id}/receive"
              payload: { expected_product_version: "${p1_v_now}" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-B2", expected_total_cents: 1000 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { s2_id: $.data.id }
            - call: "POST /shipments/${s2_id}/lines"
              payload: { product_id: "${p2_id}", ordered_qty: 10, accepted_qty: 10, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${s2_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "GET /products/${p2_id}"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { p2_v_now: $.data.version }
            - call: "POST /shipments/${s2_id}/receive"
              payload: { expected_product_version: "${p2_v_now}" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale1_id: $.data.id }
            - call: "POST /sales/${sale1_id}/line-items"
              payload: { product_id: "${p1_id}", quantity: 4 }
              as: Cashier
              as_user_id: "csh-1"
              captures: { line1_id: $.data.id }
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale2_id: $.data.id }
            - call: "POST /sales/${sale2_id}/line-items"
              payload: { product_id: "${p2_id}", quantity: 4 }
              as: Cashier
              as_user_id: "csh-1"
              captures: { line2_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale1_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
            - call: "POST /sales/${sale2_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
          assert:
            - "SaleLineItem.${line1_id}.extended_price_cents == 480"
            - "SaleLineItem.${line2_id}.extended_price_cents == 640"
            - "SaleLineItem.${line1_id}.unit_price_applied_cents == 150"
            - "SaleLineItem.${line2_id}.unit_price_applied_cents == 200"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- mode (b): nested rounding order (per-line-then-sum), divergence pinned ----
      - name: per_line_then_sum_rounding_order
        grounds:
          - calculations.line_extended_price
          - calculations.transaction_total
          - entities.SalesTransaction.fields.subtotal_cents
        distinguishing_aspect: |
          Two weighed lines of the same product at 33 c/lb x 1015 milli each: per-line rounding then
          summation gives subtotal 66 (rhu(33.495)=33, twice); sum-then-round would give 67
          (rhu(66.99)). The scaffold pins per-line-then-sum, so subtotal_cents == 66.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. Weighed product 33 c/lb, perishable, on-hand 5000 milli."
            - "OPEN sale with two weighed lines, each weight_milli 1015."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "PRODUCE", name: "Produce" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Loose Carrots", plu: "4562", sell_by_weight: true, unit_price_cents: 33, is_perishable: true, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-C1", expected_total_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 5000, accepted_qty: 5000, unit_cost_cents: 20, expiration_date: "2026-06-30T00:00:00Z" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", weight_milli: 1015 }
              as: Cashier
              as_user_id: "csh-1"
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", weight_milli: 1015 }
              as: Cashier
              as_user_id: "csh-1"
          trigger:
            - call: "POST /sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sub: $.data.subtotal_cents }
          assert:
            - "SalesTransaction.${sale_id}.subtotal_cents == 66"
            - "SalesTransaction.${sale_id}.total_cents == 66"

      # ---- mode (c): circular-looking total<->coupon, evaluation order pinned ----
      - name: coupon_gate_keyed_on_subtotal_not_total
        grounds:
          - calculations.transaction_total
          - entities.DigitalCoupon.fields.min_spend_cents
          - entities.SalesTransaction.fields.coupon_discount_cents
          - validations[priority=10]
        distinguishing_aspect: |
          subtotal 1000, coupon discount 150 with min_spend 1000: the gate is evaluated against
          subtotal_cents (1000 >= 1000 passes) BEFORE the discount reduces the total; computing the
          gate against total (850) would be circular. Result: coupon_discount_cents 150, total 850.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. ACTIVE member; each-sold product 250 c, on-hand 10."
            - "Coupon CODE10 for the product: discount 150, min_spend 1000, stackable false; clip CLIPPED for the member."
            - "OPEN sale on the member with one line quantity 4 (extended 1000, no promo)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Cereal", sku: "SKU-CER", sell_by_weight: false, unit_price_cents: 250, is_perishable: false, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /coupons"
              payload: { code: "CODE10", product_id: "${prod_id}", discount_cents: 150, min_spend_cents: 1000, stackable: false, effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-30T00:00:00Z" }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { coupon_id: $.data.id }
            - call: "POST /members"
              payload: { email: "a@x.com", full_name: "A Shopper" }
              as: Cashier
              as_user_id: "csh-1"
              captures: { member_id: $.data.id }
            - call: "POST /members/${member_id}/clip"
              payload: { coupon_id: "${coupon_id}" }
              as: Cashier
              as_user_id: "csh-1"
              captures: { clip_id: $.data.id }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-D1", expected_total_cents: 1000 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 10, accepted_qty: 10, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "GET /products/${prod_id}"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { prod_v_now: $.data.version }
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v_now}" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /sales"
              payload: { member_id: "${member_id}" }
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", quantity: 4 }
              as: Cashier
              as_user_id: "csh-1"
          trigger:
            - call: "POST /sales/${sale_id}/finalize"
              payload: { clipped_coupon_id: "${clip_id}" }
              as: Cashier
              as_user_id: "csh-1"
          assert:
            - "SalesTransaction.${sale_id}.subtotal_cents == 1000"
            - "SalesTransaction.${sale_id}.coupon_discount_cents == 150"
            - "SalesTransaction.${sale_id}.total_cents == 850"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- parallel dimensions on SalesTransaction (tender x fulfillment) ----
      - name: sale_parallel_tender_and_fulfillment_axes
        grounds:
          - state_machines.SalesTransaction.OPEN_to_FINALIZED
          - state_machines.SalesTransaction.UNPAID_to_PAID
          - entities.SalesTransaction.fields.tender_status
          - entities.SalesTransaction.fields.fulfillment_status
        distinguishing_aspect: |
          On one SalesTransaction row, fulfillment_status (OPEN->FINALIZED) and tender_status
          (UNPAID->PAID) advance on independent axes: after finalize, fulfillment_status==FINALIZED
          while tender_status is still UNPAID; pay then advances only tender_status to PAID.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. Each-sold product 250 c, on-hand 10. OPEN sale with one line quantity 2."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Soup", sku: "SKU-SOUP", sell_by_weight: false, unit_price_cents: 250, is_perishable: false, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-E1", expected_total_cents: 1000 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 10, accepted_qty: 10, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", quantity: 2 }
              as: Cashier
              as_user_id: "csh-1"
          trigger:
            - call: "POST /sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { ful_after_fin: $.data.fulfillment_status, ten_after_fin: $.data.tender_status }
            - call: "POST /sales/${sale_id}/pay"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { ful_after_pay: $.data.fulfillment_status, ten_after_pay: $.data.tender_status }
          assert:
            - "After finalize: SalesTransaction.${sale_id}.fulfillment_status == FINALIZED and tender_status == UNPAID"
            - "After pay: SalesTransaction.${sale_id}.tender_status == PAID and fulfillment_status == FINALIZED"

      # ---- cyclic on InventoryLot (ACTIVE <-> QUARANTINED) ----
      - name: lot_quarantine_release_cycle
        grounds:
          - state_machines.InventoryLot.ACTIVE_to_QUARANTINED
          - state_machines.InventoryLot.QUARANTINED_to_ACTIVE
          - entities.InventoryLot.fields.status
        distinguishing_aspect: |
          A single InventoryLot loops ACTIVE -> QUARANTINED -> ACTIVE via quarantine then release;
          on_hand_qty is unchanged across the cycle (quarantine keeps the lot counted), proving a
          non-linear (cyclic) shape distinct from the parallel SalesTransaction machine.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. Each-sold product, on-hand 10 via one ACTIVE lot."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
