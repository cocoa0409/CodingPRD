            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/supply-inventories", payload: { event_id: "${ev}", item_code: "SAFETY_VEST", description: "Vest", quantity_total: 5 }, as: VolunteerCoordinator, captures: { inv: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /volunteer-ops/distribution-records", payload: { signup_id: "${sg1}", kind: SUPPLY_ITEM, inventory_id: "${inv}" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /volunteer-ops/supply-inventories/${inv}", as: VolunteerCoordinator, captures: { issued: $.data.quantity_issued } }
          assert:
            - "issue rejected with ERR_SIGNUP_NOT_CHECKED_IN (${err}) — signup is CONFIRMED, not CHECKED_IN"
            - "SupplyInventory.${inv}.quantity_issued == 0 (${issued}) — no partial write leaked through"

  - rule_id: resource_temporal_overlap
    instances:
      - name: segment_mile_half_open_adjacency
        grounds:
          - calculations.segment_mile_overlap_rule
          - entities.CourseSegment.fields.mile_start
        distinguishing_aspect: |
          Interval semantics #1 on the CourseSegment resource: half-open mile ranges
          [start, end) where exact adjacency (end == start) is LEGAL on both sides,
          but a 0.5-mile interior intersection is rejected ERR_SEGMENT_MILE_OVERLAP.
        test_recipe:
          setup:
            - "Event DRAFT; existing segment SEG-A covering [5, 10)"
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { segA: $.data.id } }
          trigger:
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-B", mile_start: 10, mile_end: 14, terrain_type: TRAIL }, as: VolunteerCoordinator, captures: { segB: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-C", mile_start: 3, mile_end: 5, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { segC: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-D", mile_start: 9.5, mile_end: 11, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "adjacency at 10 (SEG-A.end == SEG-B.start) succeeds 201 (${segB} present)"
            - "adjacency at 5 (SEG-C.end == SEG-A.start) succeeds 201 (${segC} present)"
            - "interior overlap [9.5, 11) with [5, 10) rejected ERR_SEGMENT_MILE_OVERLAP (${err})"
            - "half-open semantics proven: equality at the shared boundary is NOT an overlap in either direction"

      - name: volunteer_shift_buffer_overlap
        grounds:
          - calculations.volunteer_overlap_rule
          - entities.Shift.fields.segment_id
        distinguishing_aspect: |
          Interval semantics #2 on the Volunteer-availability resource — different
          geometry than half-open miles: cross-segment intervals are inflated by a
          30-minute buffer (a 15-minute gap collides; exactly 30 minutes passes),
          while same-segment intervals use buffer 0 with legal end == start
          adjacency.
        test_recipe:
          setup:
            - "V1 APPROVED on S1 07:00-11:00 (segA) and S2 11:00-13:00 (segA, adjacent same-segment — legal)"
            - "S3 12:45-14:00 on segB (15-min gap after S2 -> inside buffer); S4 13:30-15:00 on segB (exactly 30-min gap)"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
