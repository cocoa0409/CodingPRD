              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
              captures: { seg_hiv: $.data.id }
            - call: "POST /roi/record-segments/${seg_gen}/disposition"
              payload: { disposition: "RETRIEVED", page_count: 40 }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/record-segments/${seg_bh}/disposition"
              payload: { disposition: "RETRIEVED", page_count: 22 }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/record-segments/${seg_hiv}/disposition"
              payload: { disposition: "RETRIEVED", page_count: 18 }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/requests/${rq}/complete-compilation"
              payload: {}
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/requests/${rq}/sensitive-review"
              payload: { segment_decisions: [{ record_segment_id: "${seg_bh}", decision: "INCLUDE", redaction_required: true }, { record_segment_id: "${seg_hiv}", decision: "WITHHOLD" }] }
              as: ReleaseReviewer
              as_user_id: "u-review-1"
          trigger:
            - call: "GET /roi/requests/${rq}"
              payload: {}
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/record-segments/${seg_bh}/redaction"
              payload: { redacted_page_count: 9, redaction_note: "co-mingled third-party identifiers" }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /roi/requests/${rq}"
              payload: {}
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/record-segments/${seg_hiv}/disposition"
              payload: { disposition: "WITHDRAWN" }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /roi/requests/${rq}"
              payload: {}
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/record-segments/${seg_bh}/redaction-decision"
              payload: { decision: "APPROVE", note: "sufficient" }
              as: ReleaseReviewer
              as_user_id: "u-review-1"
            - call: "GET /roi/requests/${rq}"
              payload: {}
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "checkpoint 1 (REDACTION, redaction OPEN): page_count_total == 80, billable_page_count == 62, withheld_page_count == 18, redacted_page_count_total == 0 -> 62 + 18 + 0 == 80"
            - "checkpoint 2 (redaction APPLIED, not yet approved): page_count_total == 80, billable_page_count == 62, withheld_page_count == 18, redacted_page_count_total == 0 -> partition still closes at 80, because redacted pages count only once APPROVED"
            - "checkpoint 3 (HIV segment WITHDRAWN): page_count_total == 62, billable_page_count == 62, withheld_page_count == 0, redacted_page_count_total == 0 -> 62 + 0 + 0 == 62"
            - "the withdrawal resets RecordSegment.${seg_hiv}: retrieval_status == WITHDRAWN, sensitivity_status == UNCLASSIFIED, redaction_status == NOT_REQUIRED, redacted_page_count == 0"
            - "the withdrawal leaves RecordSegment.${seg_bh}.redaction_status == APPLIED untouched, so Request.${rq}.fulfillment_status is still REDACTION and the bubble-up does not fire"
            - "checkpoint 4 (redaction APPROVED, bubbled to RELEASE_READY): page_count_total == 62, billable_page_count == 53, withheld_page_count == 0, redacted_page_count_total == 9 -> 53 + 0 + 9 == 62"
            - "Request.${rq}.billing_status == PENDING_INVOICE at checkpoint 4 — the prospective subtotal on 53 billable pages is not 0, so the NOT_BILLABLE entry rule does not fire"
            - "withdrawing the HIV segment while the request was in REDACTION is legal; the same call after the request reaches RELEASE_READY would violate the transition's precondition"
