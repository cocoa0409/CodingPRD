        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_REGISTRATION_NOT_COMPLETE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lock_factors_gated_by_registration_status
          rationale: "The registration-status gate on lock-factors is asserted end to end by that difficulty instance."

