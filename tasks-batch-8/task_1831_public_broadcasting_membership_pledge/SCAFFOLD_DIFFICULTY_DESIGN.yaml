scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: nffs_provisional_vs_final_revenue
        grounds:
          - calculations.nffs_membership_revenue
          - state_machines.NFFSReport.DRAFT_to_FINALIZED
          - entities.NFFSReport.fields.membership_revenue_cents
        distinguishing_aspect: |
          Same pledge data yields different membership_revenue_cents under the
          PROVISIONAL variant (uncollected PLEDGED pledges counted at face
          minus FMV) versus the FINAL variant (only PAID/PARTIAL count) —
          a dual-variant calculation on the NFFSReport entity domain.
        test_recipe:
          setup:
            - "Level BASIC exists (min_annual 6000, sustainer monthly 500)"
            - "Premium MUG with FMV 2500 cents, level BASIC, with stock lot"
            - "Donor D with membership M (ACTIVE) at BASIC"
            - "Drive DRV in ON_AIR status covering 2026-08-01"
            - "Pledge P1: ONE_TIME 12000, premium MUG reserved, payment_status PLEDGED (no payment posted)"
            - "Pledge P2: ONE_TIME 20000, no premium, payment_status PAID in full"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500, premium_eligible: true }
              as: StationAdmin
              captures: { lvl_basic_v: $.data.version }
            - call: "POST /station/premiums"
              payload: { sku: "MUG", title: "Station Mug", fair_market_value_cents: 2500, membership_level_code: "BASIC" }
              as: StationAdmin
              captures: { prem_mug_id: $.data.id }
            - call: "POST /station/premiums/${prem_mug_id}/lots"
              payload: { received_at: "2026-07-15T00:00:00Z", unit_cost_cents: 800, total_qty: 25 }
              as: MembershipCoordinator
            - call: "POST /station/donors"
              payload: { email: "d1@x.com", full_name: "Donor One", postal_code: "97201" }
              as: MembershipCoordinator
              captures: { donor1_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor1_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem1_id: $.data.id }
            - call: "POST /station/donors"
              payload: { email: "d2@x.com", full_name: "Donor Two", postal_code: "97202" }
              as: MembershipCoordinator
              captures: { donor2_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor2_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem2_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor1_id}", membership_id: "${mem1_id}", drive_id: "${drv_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 12000, premium_id: "${prem_mug_id}" }
              as: PhoneVolunteer
              captures: { plg1_id: $.data.id }
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor2_id}", membership_id: "${mem2_id}", drive_id: "${drv_id}", channel: "WEB", kind: "ONE_TIME", amount_cents: 20000 }
              as: PhoneVolunteer
              captures: { plg2_id: $.data.id, plg2_v: $.data.version }
            - call: "POST /station/pledges/${plg2_id}/payments"
              payload: { amount_cents: 20000, expected_pledge_version: "${plg2_v}" }
              as: PhoneVolunteer
            - call: "POST /station/nffs-reports"
              payload: { fiscal_year: 2026 }
              as: MembershipCoordinator
              as_user_id: "coord-1001"
              captures: { rpt_id: $.data.id, rpt_prov_rev: $.data.membership_revenue_cents }
          trigger:
            - call: "POST /station/nffs-reports/${rpt_id}/finalize"
              payload: {}
              as: StationAdmin
              as_user_id: "admin-9001"
              captures: { rpt_final_rev: $.data.membership_revenue_cents }
          assert:
            - "NFFSReport.${rpt_id}.membership_revenue_cents at PROVISIONAL == 29500 (P1 face 12000 - FMV 2500 + P2 net 20000)"
            - "NFFSReport.${rpt_id}.membership_revenue_cents at FINAL == 20000 (P1 PLEDGED contributes 0)"
            - "captured ${rpt_prov_rev} == 29500 and ${rpt_final_rev} == 20000 and ${rpt_prov_rev} > ${rpt_final_rev}"

      - name: premium_inventory_fifo_vs_weighted_average
        grounds:
          - calculations.premium_inventory_valuation
          - entities.PremiumInventoryLot.fields.unit_cost_cents
        distinguishing_aspect: |
          Valuing the same 15-unit write-off under FIFO (earliest received_at
          first) versus weighted-average produces different cent values
          whenever lot unit costs differ — a dual-variant calculation on the
          PremiumInventoryLot entity domain, distinct from the NFFS domain.
        test_recipe:
          setup:
            - "Premium TOTE exists (level BASIC)"
            - "Lot L1: 10 units @ 300 cents, received 2026-07-01"
            - "Lot L2: 10 units @ 500 cents, received 2026-07-10"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/premiums"
              payload: { sku: "TOTE", title: "Canvas Tote", fair_market_value_cents: 1500, membership_level_code: "BASIC" }
              as: StationAdmin
              captures: { prem_tote_id: $.data.id }
            - call: "POST /station/premiums/${prem_tote_id}/lots"
              payload: { received_at: "2026-07-01T00:00:00Z", unit_cost_cents: 300, total_qty: 10 }
              as: MembershipCoordinator
              captures: { lot1_id: $.data.id }
            - call: "POST /station/premiums/${prem_tote_id}/lots"
              payload: { received_at: "2026-07-10T00:00:00Z", unit_cost_cents: 500, total_qty: 10 }
              as: MembershipCoordinator
              captures: { lot2_id: $.data.id }
          trigger:
            - call: "GET /station/premiums/${prem_tote_id}/lots"
              payload: {}
              as: MembershipCoordinator
          assert:
            - "FIFO value of 15 units == 5500 (10*300 + 5*500)"
            - "weighted-average value of 15 units == 6000 (round(15 * (10*300+10*500)/20) = 15*400)"
            - "fifo_value != weighted_avg_value for identical lot state (5500 != 6000)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: level_qualification_three_input_tiering
        grounds:
          - calculations.membership_level_for_amount
        distinguishing_aspect: |
          Mode (a): the qualification formula takes >= 3 inputs (amount_cents,
          kind, min_annual_cents, min_monthly_sustainer_cents, premium level
          rank) with non-linear interaction — a 600-cent SUSTAINER pledge
          (annualized 7200) qualifies for BASIC via the monthly threshold
          while a 600-cent ONE_TIME pledge fails the annual threshold.
        test_recipe:
          setup:
            - "Level BASIC: min_annual 6000, min_monthly_sustainer 500"
            - "Donor D, membership M at BASIC; drive DRV ON_AIR"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "d3@x.com", full_name: "Donor Three", postal_code: "97203" }
              as: MembershipCoordinator
              captures: { donor3_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor3_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem3_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv3_id: $.data.id, drv3_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv3_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv3_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv3_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv3_id}/go-live"
              payload: {}
              as: StationAdmin
          trigger:
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor3_id}", membership_id: "${mem3_id}", drive_id: "${drv3_id}", channel: "WEB", kind: "SUSTAINER", amount_cents: 600 }
              as: PhoneVolunteer
              captures: { plg_sust_id: $.data.id }
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor3_id}", membership_id: "${mem3_id}", drive_id: "${drv3_id}", channel: "WEB", kind: "ONE_TIME", amount_cents: 600 }
              as: PhoneVolunteer
              captures: { err_code: $.data.error_id }
          assert:
            - "SUSTAINER pledge of 600/month accepted (600 >= min_monthly_sustainer_cents 500)"
            - "ONE_TIME pledge of 600 rejected with ERR_LEVEL_OR_PREMIUM_INELIGIBLE (600 < min_annual_cents 6000)"
            - "${err_code} == ERR_LEVEL_OR_PREMIUM_INELIGIBLE"

      - name: nffs_per_pledge_rounding_order
        grounds:
          - calculations.nffs_membership_revenue
          - calculations.pledge_net_collected
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — per-pledge net is
          computed (amount minus FMV, integer cents) per pledge and THEN
          summed; the scaffold explicitly forbids sum-of-gross then
          subtract-sum-of-FMV because the per-pledge max(0, ...) floor makes
          the two orders diverge when a small pledge's FMV exceeds its amount.
        test_recipe:
          setup:
            - "Level BASIC (min_annual 1000 so a small pledge qualifies)"
            - "Premium BOOK FMV 1500 (FMV exceeds the small pledge amount)"
            - "Drive DRV ON_AIR; pledge P_SMALL 1000 with BOOK reserved, PAID; pledge P_BIG 5000 no premium, PAID"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 1000, min_monthly_sustainer_cents: 100 }
              as: StationAdmin
            - call: "POST /station/premiums"
              payload: { sku: "BOOK", title: "Signed Book", fair_market_value_cents: 1500, membership_level_code: "BASIC" }
              as: StationAdmin
              captures: { prem_book_id: $.data.id }
            - call: "POST /station/premiums/${prem_book_id}/lots"
              payload: { received_at: "2026-07-15T00:00:00Z", unit_cost_cents: 700, total_qty: 10 }
              as: MembershipCoordinator
            - call: "POST /station/donors"
              payload: { email: "d4@x.com", full_name: "Donor Four", postal_code: "97204" }
              as: MembershipCoordinator
              captures: { donor4_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor4_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem4_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv4_id: $.data.id, drv4_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv4_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv4_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv4_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv4_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor4_id}", membership_id: "${mem4_id}", drive_id: "${drv4_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 1000, premium_id: "${prem_book_id}" }
              as: PhoneVolunteer
              captures: { plg_small_id: $.data.id, plg_small_v: $.data.version }
            - call: "POST /station/pledges/${plg_small_id}/payments"
              payload: { amount_cents: 1000, expected_pledge_version: "${plg_small_v}" }
              as: PhoneVolunteer
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor4_id}", membership_id: "${mem4_id}", drive_id: "${drv4_id}", channel: "WEB", kind: "ONE_TIME", amount_cents: 5000 }
              as: PhoneVolunteer
              captures: { plg_big_id: $.data.id, plg_big_v: $.data.version }
            - call: "POST /station/pledges/${plg_big_id}/payments"
              payload: { amount_cents: 5000, expected_pledge_version: "${plg_big_v}" }
              as: PhoneVolunteer
          trigger:
            - call: "POST /station/nffs-reports"
              payload: { fiscal_year: 2026 }
              as: MembershipCoordinator
              captures: { rpt2_rev: $.data.membership_revenue_cents }
          assert:
            - "Pledge.${plg_small_id}.net_collected_cents == 0 (max(0, 1000 - 1500) floors at 0)"
            - "NFFSReport.membership_revenue_cents == 5000 (per-pledge floor then sum: 0 + 5000)"
            - "sum-then-floor order would give (1000+5000) - 1500 == 4500 — the pinned per-pledge order differs and is the asserted one"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_lapse_reinstate_cycle
        grounds:
          - state_machines.Membership
        distinguishing_aspect: |
          Membership is cyclic: ACTIVE -> GRACE -> LAPSED -> REINSTATED_PENDING
          -> ACTIVE, with the win-back loop driven by clock advance plus a
          reinstatement payment — a cycle on the Membership entity.
        test_recipe:
          setup:
            - "Level BASIC; donor D; membership M ACTIVE with period ending 2026-09-01 (via paid pledge)"
            - "Clock advanced past period end + 30 days so M is LAPSED"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "d5@x.com", full_name: "Donor Five", postal_code: "97205" }
              as: MembershipCoordinator
              captures: { donor5_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor5_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem5_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv5_id: $.data.id, drv5_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv5_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv5_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv5_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv5_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor5_id}", membership_id: "${mem5_id}", drive_id: "${drv5_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 6000 }
              as: PhoneVolunteer
              captures: { plg5_id: $.data.id, plg5_v: $.data.version }
            - call: "POST /station/pledges/${plg5_id}/payments"
              payload: { amount_cents: 6000, expected_pledge_version: "${plg5_v}" }
              as: PhoneVolunteer
            - call: "POST /station/_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-15T00:00:00Z" }
              as: StationAdmin
          trigger:
            - call: "POST /station/memberships/${mem5_id}/reinstate"
              payload: {}
              as: MembershipCoordinator
              captures: { mem5_status: $.data.status }
          assert:
            - "Membership.${mem5_id}.status was LAPSED before reinstate (clock 2027-10-15 > period_end 2027-08-01 + 30d grace)"
            - "Donor.${donor5_id}.lapse_count == 1 after the LAPSED transition"
            - "after reinstate trigger, Membership.${mem5_id}.status == REINSTATED_PENDING"
            - "${mem5_status} == REINSTATED_PENDING"

      - name: pledge_parallel_payment_fulfillment_dimensions
        grounds:
          - state_machines.Pledge
        distinguishing_aspect: |
          Pledge carries two independent parallel state dimensions —
          payment_status and fulfillment_status evolve separately (a pledge
          can be PARTIAL while RESERVED, or PAID while still
          AWAITING_RESERVATION) — parallel dimensions on the Pledge entity,
          a different non-linear shape than Membership's cycle.
        test_recipe:
          setup:
            - "Level BASIC; premium MUG in stock; donor D; membership M; drive DRV ON_AIR"
            - "Pledge P: ONE_TIME 12000 with premium MUG (auto-reserved -> fulfillment RESERVED)"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/premiums"
              payload: { sku: "MUG", title: "Station Mug", fair_market_value_cents: 2500, membership_level_code: "BASIC" }
              as: StationAdmin
              captures: { prem_mug2_id: $.data.id }
            - call: "POST /station/premiums/${prem_mug2_id}/lots"
              payload: { received_at: "2026-07-15T00:00:00Z", unit_cost_cents: 800, total_qty: 25 }
              as: MembershipCoordinator
            - call: "POST /station/donors"
              payload: { email: "d6@x.com", full_name: "Donor Six", postal_code: "97206" }
              as: MembershipCoordinator
              captures: { donor6_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor6_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem6_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv6_id: $.data.id, drv6_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv6_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv6_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv6_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv6_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor6_id}", membership_id: "${mem6_id}", drive_id: "${drv6_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 12000, premium_id: "${prem_mug2_id}" }
              as: PhoneVolunteer
              captures: { plg6_id: $.data.id, plg6_v: $.data.version, plg6_ful: $.data.fulfillment_status }
          trigger:
            - call: "POST /station/pledges/${plg6_id}/payments"
              payload: { amount_cents: 5000, expected_pledge_version: "${plg6_v}" }
              as: PhoneVolunteer
              captures: { plg6_pay: $.data.payment_status, plg6_ful_after: $.data.fulfillment_status }
          assert:
            - "Pledge.${plg6_id}.fulfillment_status == RESERVED immediately after capture (${plg6_ful} == RESERVED)"
            - "after partial payment, payment_status == PARTIAL while fulfillment_status remains RESERVED (dimensions independent)"
            - "${plg6_pay} == PARTIAL and ${plg6_ful_after} == RESERVED"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: lapsed_payment_reactivates_membership_resets_donor
        grounds:
          - state_machines.Pledge.PLEDGED_to_PAID
          - state_machines.Membership.REINSTATED_PENDING_to_ACTIVE
          - entities.Donor.fields.lapse_count
        distinguishing_aspect: |
          Depth-3 cascade: pledge payment (link 1) mutates Membership
          REINSTATED_PENDING -> ACTIVE (link 2), and that membership
          transition itself resets Donor.lapse_count to 0 (link 3) — each
          link caused by the previous, not by the original payment.
        test_recipe:
          setup:
            - "Level BASIC; donor D with membership M now LAPSED (period ended, grace elapsed, lapse_count == 1)"
            - "M reinstated to REINSTATED_PENDING; drive DRV2 ON_AIR; pledge P2 against M captured"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "d7@x.com", full_name: "Donor Seven", postal_code: "97207" }
              as: MembershipCoordinator
              captures: { donor7_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor7_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem7_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv7_id: $.data.id, drv7_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv7_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv7_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv7_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv7_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
