      - name: abstract_submitted_after_the_call_deadline_is_rejected
        claim_type: temporal
        grounds:
          - validations.p15.ERR_CFA_DEADLINE_PASSED
          - entities.Conference.fields.abstract_deadline_utc
        distinguishing_aspect: |
          The deadline is compared against the logical clock, not against the
          conference status: with the conference still CFA_OPEN, a submission at
          2026-03-01T23:59:00Z (the deadline instant itself) is accepted while
          one at 2026-03-02T00:00:00Z returns 422 ERR_CFA_DEADLINE_PASSED. An
          implementation that only checks Conference.status lets the late
          submission through.
        test_recipe:
          setup:
            - "Conference GOS26 at CFA_OPEN with abstract_deadline_utc 2026-03-01T23:59:00Z, category GEN, author Ada."
            - "The logical clock starts at 2026-01-05T00:00:00Z."
