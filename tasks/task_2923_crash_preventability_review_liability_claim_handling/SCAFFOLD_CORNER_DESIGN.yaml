              as: SafetyManager
              as_user_id: "sm-002"
              captures: { e_appeal_missing: $.data.error_id }
          assert:
            - "${e_abstain_scored} == ERR_INVALID_REQUEST with HTTP 400 — criterion_scores MUST be absent on an ABSTAIN"
            - "${e_scores_missing} == ERR_INVALID_REQUEST — criterion_scores is required on any non-ABSTAIN vote"
            - "${e_scores_short} == ERR_INVALID_REQUEST — four of the five keys is not the required shape, so a partial map is not silently zero-filled"
            - "The ABSTAIN with no scores succeeds with HTTP 200: ${active} == 0, ${abst} == 1 and ${score} == null — an abstention is recorded but contributes nothing to quorum"
            - "${e_susp_window} == ERR_INVALID_REQUEST — suspension_start_at and suspension_end_at are required iff action_type == SUSPENSION"
            - "${e_retrain_window} == ERR_INVALID_REQUEST — the same two fields are FORBIDDEN on a RETRAINING"
            - "${e_coach_course} == ERR_INVALID_REQUEST — retraining_course_code is forbidden on a COACHING"
            - "${e_retrain_course} == ERR_INVALID_REQUEST — and required on a RETRAINING; the field is required iff action_type is RETRAINING or SUSPENSION"
