            - "link 1: StaffingPlan.${plan_a}.status == SUPERSEDED"
            - "link 2: PositionSlot.${slot_a}.status == CLOSED"
            - "link 3: StaffAssignment.${asg_1}.attendance_status == CANCELLED with payout_status == VOIDED"
