        test_recipe:
          setup: ["member M exists"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id" } }
