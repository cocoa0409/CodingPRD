  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cooler_full_at_capacity_boundary
        grounds:
          - validations[priority=30]
          - state_machines.Body.INTAKE_to_STORED
          - entities.CoolerUnit.fields.slot_capacity
          - entities.CoolerUnit.fields.occupied_slots
          - errors[ERR_COOLER_FULL]
        distinguishing_aspect: |
          Numeric threshold on occupied_slots: with slot_capacity 1, storing the first body succeeds
          (occupied_slots 0 < 1) and the second body's store fails ERR_COOLER_FULL (occupied_slots 1
          is NOT < 1); the >= boundary is exact via POST /bodies/{id}/store.
        test_recipe:
          setup:
            - "Cooler slot_capacity 1; two NATURAL cases each with a body in INTAKE; first body STORED (occupied_slots=1)."
          setup_api_calls:
            - call: "POST /investigators"
