          - concurrency_rules
          - validations[priority 15]
          - errors[ERR_STALE_FESTIVAL_VERSION]
          - errors[ERR_STALE_BOOKING_VERSION]
          - errors[ERR_STALE_WAVE_VERSION]
        distinguishing_aspect: |
          All three optimistic-concurrency rules are probed with a version that was
          genuinely current when it was read and has since advanced, and in every case
          the 412 outranks a second, independent failure of the same request: the
          stale allocate would also be ERR_ALLOCATION_LOCKED (priority 71), and the
          stale re-assignment would also be ERR_BOOKING_ALREADY_ASSIGNED (priority
          64). Replaying each call with the fresh version exposes the rule underneath.
