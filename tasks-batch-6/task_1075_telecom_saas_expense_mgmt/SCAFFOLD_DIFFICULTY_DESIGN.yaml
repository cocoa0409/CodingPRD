  - rule_id: boundary_precision_check
    instances:
      - name: utilization_threshold_inclusive_boundary
        grounds:
          - calculations.service_utilization
          - entities.Service.fields.utilization_pct
          - errors[ERR_UTILIZATION_ABOVE_THRESHOLD]
        distinguishing_aspect: |
          A DOWNGRADE_SEATS recommendation is accepted at utilization exactly 70.00 (active 42 / contracted 60), proving the
          gate is <= (inclusive); at 70.01 it would be rejected. Metric = utilization ratio; endpoint = recommendations create.
        test_recipe:
          setup:
            - "ACTIVE contract; service unit_rate_cents=2000 contracted_quantity=60 active_quantity=42 -> utilization 70.00."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id, s_ver: $.data.version, util: $.data.utilization_pct }
          trigger:
            - call: "POST /services/${s_id}/recommendations"
              payload: { rec_type: "DOWNGRADE_SEATS", target_quantity: 45, expected_service_version: "${s_ver}" }
              as: Analyst
              captures: { r_status: $.data.status, r_projected: $.data.projected_savings_cents }
          assert:
            - "util == 70.00"
            - "r_status == PROPOSED"
            - "r_projected == 360000"

      - name: renewal_window_open_inclusive_boundary
        grounds:
          - state_machines.Contract.ACTIVE_to_ACTIVE
          - validations[priority=7]
          - entities.Contract.fields.renewal_count
        distinguishing_aspect: |
          Renew succeeds when current_utc == term_end - renewal_notice_days exactly (2026-11-01), proving the window opens
          inclusively (>=). Metric = calendar date; endpoint = renew. term_end advances by 12 months to 2027-12-31.
        test_recipe:
          setup:
            - "ACTIVE contract term_end 2026-12-31 notice 60 renewal_term_months 12; clock set to exactly 2026-11-01 (window-open boundary)."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60, renewal_term_months: 12 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /contracts/${c_id}/renew"
              payload: {}
              as: Sourcing
              captures: { c_status: $.data.status, c_renew: $.data.renewal_count, c_term_end: $.data.term_end }
          assert:
            - "c_status == ACTIVE"
            - "c_renew == 1"
            - "c_term_end == 2027-12-31T00:00:00Z"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: invoice_review_requires_contract_active
        grounds:
          - state_machines.Invoice.RECEIVED_to_UNDER_REVIEW
          - validations[priority=6]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Invoice review is rejected with ERR_CONTRACT_NOT_ACTIVE while the parent Contract is still DRAFT, even though the
          invoice itself is validly RECEIVED. Entity pair = Invoice depends on Contract.
        test_recipe:
          setup:
            - "Contract left in DRAFT (never activated); an invoice RECEIVED under it."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
