            - { call: "POST /pilot-training/records-requests/${rr1}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-02-10T00:00:00Z", pilot_age_at_issue: 45 }, as: CrewScheduler, captures: { mc1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/qualifications", payload: { applicant_id: "${ap1}", equipment_id: "${eq_id}" }, as: CrewScheduler, captures: { q1: $.data.id } }
            # 3 landings inside the scan-time window (2026-06-03, 2026-09-01] so the
            # scan's currency refresh keeps currency_state == QUALIFIED
            - { call: "POST /pilot-training/flight-activities", payload: { qualification_id: "${q1}", activity_date: "2026-07-20T12:00:00Z", landings: 1, hours: 2.0, activity_type: "REVENUE" }, as: CrewScheduler }
            - { call: "POST /pilot-training/flight-activities", payload: { qualification_id: "${q1}", activity_date: "2026-07-25T12:00:00Z", landings: 1, hours: 2.0, activity_type: "REVENUE" }, as: CrewScheduler }
            - { call: "POST /pilot-training/flight-activities", payload: { qualification_id: "${q1}", activity_date: "2026-07-30T12:00:00Z", landings: 1, hours: 2.0, activity_type: "REVENUE" }, as: CrewScheduler }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq_id}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cv: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap1}", training_class_id: "${cls}", expected_training_class_version: "${cv}" }, as: TrainingCoordinator, captures: { en1: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en1}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-classes/${cls}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en1}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Mel Gnd", instructor_type: "GROUND", daily_max_sessions: 6 }, as: TrainingCoordinator, captures: { ins_g: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_g}", phase: "GROUND_SCHOOL", event_type: "SESSION", scheduled_start: "2026-09-02T10:00:00Z", scheduled_end: "2026-09-02T12:00:00Z" }, as: TrainingCoordinator, captures: { ev1: $.data.id } }
