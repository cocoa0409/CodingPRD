scaffold_corner_design:

  # ---------------- Entities ----------------
  - section: entities
    instances:
      - name: nofo_create_missing_required_returns_validation
        claim_type: required_fields
        grounds: [entities.NOFO.fields.total_pool_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /nofos without total_pool_cents returns ERR_VALIDATION (422); no NOFO is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nofos"
              payload: { title: "X", cfda_number: "00.000", max_award_cents: 1000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_VALIDATION"]

      - name: get_subaward_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Subaward, "errors[ERR_SUBAWARD_NOT_FOUND]"]
        distinguishing_aspect: "GET /subawards/{unknown-uuid} returns ERR_SUBAWARD_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /subawards/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramOfficer
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_SUBAWARD_NOT_FOUND"]

      - name: nonprofit_system_fields_generated
        claim_type: system_fields
        grounds: [entities.Nonprofit.fields.cumulative_federal_expenditures_cents]
        distinguishing_aspect: "POST /nonprofits returns server id/created_at/version and cumulative_federal_expenditures_cents==0 regardless of input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nonprofits"
              payload: { legal_name: "Sys Org", uei: "UEI-SYS", ein: "01-0000001" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
          assert:
            - "Nonprofit.${np_id}.cumulative_federal_expenditures_cents == 0"
            - "Nonprofit.${np_id}.version == 1"

  # ---------------- State machines ----------------
  - section: state_machines
    instances:
      - name: approve_already_approved_drawdown_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Drawdown.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_DRAWDOWN_STATE]"]
        distinguishing_aspect: "Approving a drawdown already in APPROVED returns ERR_INVALID_DRAWDOWN_STATE; no double obligation adjustment."
        test_recipe:
          setup: ["An ACTIVE subaward with one APPROVED drawdown."]
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "SM Org", uei: "UEI-SM", ein: "02-0000002" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "SM", cfda_number: "11.111", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 11000000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_id}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_id}" }
              as: ProgramOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/activate"
              payload: {}
              as: ProgramOfficer
              captures: { sub_v0: $.data.version }
            - call: "POST /subawards/${sub_id}/drawdowns"
              payload: { requested_amount_cents: 5000000, period_covered_start: "2026-06-01T00:00:00Z", period_covered_end: "2026-06-30T00:00:00Z", expected_subaward_version: "${sub_v0}" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { dd_id: $.data.id }
            - call: "POST /drawdowns/${dd_id}/approve"
              payload: {}
              as: GrantsManager
              as_user_id: "gm-1"
          trigger:
            - call: "POST /drawdowns/${dd_id}/approve"
              payload: {}
              as: GrantsManager
              as_user_id: "gm-1"
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_INVALID_DRAWDOWN_STATE"]

      - name: finding_reject_cap_returns_to_open_cycle
        claim_type: valid_transition
        grounds: [state_machines.Finding.CAP_SUBMITTED_to_OPEN]
        distinguishing_aspect: "Rejecting a submitted CAP moves the Finding CAP_SUBMITTED -> OPEN and clears corrective_action_plan, enabling re-submission."
        test_recipe:
          setup: ["A subaward with one Finding whose CAP was submitted (CAP_SUBMITTED)."]
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Fnd Org", uei: "UEI-FN", ein: "03-0000003" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Fnd", cfda_number: "12.113", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 11000000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_id}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_id}" }
              as: ProgramOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/activate"
              payload: {}
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/monitoring-visits"
              payload: { scheduled_start: "2026-07-10T09:00:00Z", scheduled_end: "2026-07-10T12:00:00Z" }
              as: GrantsManager
              as_user_id: "gm-1"
              captures: { visit_id: $.data.id }
            - call: "POST /monitoring-visits/${visit_id}/conduct"
              payload: { outcome: "DEFICIENT", finding_severity: "MODERATE" }
              as: GrantsManager
              as_user_id: "gm-1"
            - call: "GET /subawards/${sub_id}/findings"
              payload: {}
              as: GrantsManager
              as_user_id: "gm-1"
              captures: { finding_id: "$.data[0].id" }
            - call: "POST /findings/${finding_id}/submit-cap"
              payload: { corrective_action_plan: "we will fix X" }
              as: Subrecipient
              as_user_id: "${np_id}"
          trigger:
            - call: "POST /findings/${finding_id}/reject-cap"
              payload: { reason: "insufficient" }
              as: GrantsManager
              as_user_id: "gm-1"
              captures: { st: $.data.status }
          assert: ["Finding.${finding_id}.status == OPEN"]

      - name: cancel_intake_then_new_application_returns_intake_closed
        claim_type: guarded_transition
        grounds: [state_machines.Application.DRAFT_to_SUBMITTED, "errors[ERR_INTAKE_CLOSED]"]
        distinguishing_aspect: "Submitting a fresh DRAFT application after the NOFO intake is CLOSED returns ERR_INTAKE_CLOSED."
        test_recipe:
          setup: ["A NOFO whose intake has been closed, with a DRAFT application under it."]
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Intake Org", uei: "UEI-IN", ein: "04-0000004" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Intake", cfda_number: "13.131", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 11000000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/close-intake"
              payload: {}
              as: ProgramOfficer
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_INTAKE_CLOSED"]

  # ---------------- Calculations ----------------
  - section: calculations
    instances:
      - name: risk_score_low_tier_computed
        claim_type: correct_result
        grounds: [calculations.risk_score, entities.RiskAssessment.fields.risk_score, entities.RiskAssessment.fields.risk_tier]
        distinguishing_aspect: "For an ACTIVE subaward (total 11000000, no findings, no single audit, cumulative 0, paid_ratio 0): findings 0 + audit 10 + velocity 0 + size 5 = 15 -> risk_tier LOW."
        test_recipe:
          setup: ["An ACTIVE subaward, no findings, no drawdowns, no single audit."]
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Risk Org", uei: "UEI-RK", ein: "05-0000005" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Risk", cfda_number: "14.141", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 11000000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_id}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_id}" }
              as: ProgramOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/activate"
              payload: {}
              as: ProgramOfficer
          trigger:
            - call: "POST /subawards/${sub_id}/risk-assessments"
              payload: {}
              as: GrantsManager
              as_user_id: "gm-1"
              captures: { score: $.data.risk_score, tier: $.data.risk_tier }
          assert:
            - "RiskAssessment.risk_score == 15"
            - "RiskAssessment.risk_tier == LOW"

      - name: application_average_score_after_three_reviews
        claim_type: correct_result
        grounds: [entities.Application.fields.average_score, entities.Application.fields.review_count]
        distinguishing_aspect: "Three reviews (80, 85, 90) give review_count==3 and average_score==85.0, and the application auto-transitions to SCORED."
        test_recipe:
          setup: ["An application in UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Avg Org", uei: "UEI-AV", ein: "06-0000006" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Avg", cfda_number: "15.151", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 11000000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
          trigger:
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
              captures: { st: $.data.score }
          assert:
            - "Application.${app_id}.review_count == 3"
            - "Application.${app_id}.average_score == 85.0"
            - "Application.${app_id}.status == SCORED"

