  # ===========================================================================
  - section: validations
    instances:
      - name: dealers_create_missing_auth_headers_returns_400
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_CONTEXT_HEADER
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role is rejected 400 ERR_MISSING_OR_INVALID_CONTEXT_HEADER before any role or existence logic runs — the response uses the error envelope with data.error_id and data.message."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /drinkware/dealers"
              payload: { legal_name: "No Headers Co", storefront_address: "0 Nowhere", region_code: "TX-N", sell_through_pct: 50, tenure_years: 1 }
              captures: { err_no_headers: $.data.error_id }
          assert:
            - "the response status is 400 and err_no_headers == ERR_MISSING_OR_INVALID_CONTEXT_HEADER"
            - "response_type == error and data carries both error_id and message"
            - "GET /drinkware/dealers returns 0 rows"

      - name: decide_sod_violation_same_docs_reviewer
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_SOD_VIOLATION
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation of duties: the ChannelManager who verified the documents (cm-sod) cannot also decide the application — 403 ERR_SOD_VIOLATION — while a different ChannelManager (cm-1) decides the same application successfully."
        test_recipe:
          setup:
            - "Clock set; dealer PENDING; application with inspection PASSED (fi-1) and docs VERIFIED by cm-sod."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_app
            - *c_sched
            - *c_clock2
            - *c_record
            - call: "POST /drinkware/dealer-applications/${c_app}/verify-documents"
              payload: { outcome: "VERIFIED" }
              as: ChannelManager
              as_user_id: "cm-sod"
          trigger:
            - call: "POST /drinkware/dealer-applications/${c_app}/decide"
              payload: { decision: "APPROVE", decision_reason: "self-review" }
              as: ChannelManager
              as_user_id: "cm-sod"
              captures: { err_sod: $.data.error_id }
            - call: "POST /drinkware/dealer-applications/${c_app}/decide"
              payload: { decision: "APPROVE", decision_reason: "independent review" }
              as: ChannelManager
              as_user_id: "cm-1"
          assert:
            - "err_sod == ERR_SOD_VIOLATION (403) — decider == docs_reviewed_by"
            - "the failed decide left the application VETTING (no partial transition)"
            - "second decide: 200, DealerApplication.${c_app}.status == APPROVED, Dealer.${c_dealer}.status == AUTHORIZED"

      - name: approve_without_storefront_returns_storefront_required
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_STOREFRONT_REQUIRED
        distinguishing_aspect: "has_physical_storefront = false cannot be waived by strong legs: with inspection PASSED at 95 and docs VERIFIED, APPROVE still fails 422 ERR_STOREFRONT_REQUIRED — dealer authorization physically requires a storefront."
        test_recipe:
          setup:
            - "Clock set; dealer PENDING; application declared WITHOUT a physical storefront; both legs passed."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - call: "POST /drinkware/dealer-applications"
              payload: { dealer_id: "${c_dealer}", has_physical_storefront: false, storefront_sqft: 1, document_refs: ["doc-online-only"] }
              as: ChannelManager
              as_user_id: "cm-admin"
              captures: { app_nsf: $.data.id }
            - call: "POST /drinkware/dealer-applications/${app_nsf}/schedule-inspection"
