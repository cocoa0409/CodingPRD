    side_effects: []
  - method: GET
    path: /service-partners/{id}
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: []
    output: ServicePartner
    success_status: 200
    side_effects: []
  - method: POST
    path: /service-partners/{id}/parts-receipt
    roles: [ServiceOpsAdmin]
    input: [units]
    output: ServicePartner
    success_status: 200
    side_effects: ["parts distribution: increments spare_stock_received_units and spare_stock_on_hand_units (calculations.spare_stock_ledger)"]

  # ---- Delivery and installation -------------------------------------------
  - method: POST
    path: /install-jobs
    roles: [OrderPlanner]
    input: [order_id, service_partner_id, window_start, window_end, estimated_labor_hours]
    output: InstallJob
    success_status: 201
    side_effects: ["books the partner's calendar under the HALF-OPEN travel-buffered geometry of validations[priority=32]; adds estimated_labor_hours to the partner's committed_hours"]
  - method: GET
    path: /install-jobs
    roles: [OrderPlanner, ServicePartnerTech, ServiceOpsAdmin, FacilityManager]
    input: ["order_id?", "service_partner_id?", "status?", "limit?", "offset?"]
    output: InstallJob[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /install-jobs/{id}
    roles: [OrderPlanner, ServicePartnerTech, ServiceOpsAdmin, FacilityManager]
    input: []
    output: InstallJob
    success_status: 200
    side_effects: []
  - method: POST
    path: /install-jobs/{id}/arrive
    roles: [ServicePartnerTech]
    input: []
    output: InstallJob
    success_status: 200
    side_effects: ["SCHEDULED -> ON_SITE; order fulfillment STAGED -> INSTALLING"]
  - method: POST
    path: /install-jobs/{id}/complete
    roles: [ServicePartnerTech]
    input: [actual_labor_hours, punch_list_open_count]
    output: InstallJob
    success_status: 200
    side_effects: ["branches on punch_list_open_count: 0 -> COMPLETED with the full five-level cascade (order INSTALLED + INVOICED at the FINAL price, assets IN_SERVICE, PM rollups, partner rollups); >= 1 -> PUNCH_LIST with no cascade"]
  - method: POST
    path: /install-jobs/{id}/resolve-punch-list
    roles: [ServicePartnerTech]
    input: [resolution_note]
    output: InstallJob
    success_status: 200
    side_effects: ["PUNCH_LIST -> COMPLETED; runs the deferred cascade and prices punch_list_credit_cents into the FINAL total"]
  - method: POST
    path: /install-jobs/{id}/abort
    roles: [OrderPlanner, ServicePartnerTech]
    input: [abort_reason]
    output: InstallJob
    success_status: 200
    side_effects: ["-> ABORTED; releases the calendar window and the committed hours; reverts fulfillment INSTALLING -> STAGED"]

  # ---- Serialized assets ----------------------------------------------------
  - method: GET
    path: /serialized-assets
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: ["facility_id?", "model_revision_id?", "order_line_id?", "installed_firmware_release_id?", "status?", "connectivity_support_status?", "limit?", "offset?"]
    output: SerializedAsset[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /serialized-assets/{id}
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: []
    output: SerializedAsset
    success_status: 200
    side_effects: []
  - method: POST
    path: /serialized-assets/{id}/load-firmware
    roles: [ProductEngineer, ServicePartnerTech]
    input: [firmware_release_id]
    output: SerializedAsset
    success_status: 200
    side_effects: ["sets installed_firmware_release_id and recomputes the support window"]
  - method: POST
    path: /serialized-assets/{id}/usage-report
    roles: [ServicePartnerTech]
    input: [annual_usage_hours]
    output: SerializedAsset
    success_status: 200
    side_effects: ["updates annual_usage_hours and recomputes every ACTIVE PMProgram at the facility plus the partner's committed_hours and coverage_status"]
  - method: POST
    path: /serialized-assets/{id}/trade-in
    roles: [OrderPlanner]
    input: [declared_condition_grade]
    output: SerializedAsset
    success_status: 200
    side_effects: ["IN_SERVICE -> TRADE_IN_RETURNED; values the asset, grants facility credit, cancels its scheduled visits and recomputes the PM and partner rollups"]
  - method: POST
    path: /serialized-assets/{id}/trade-in/reverse
    roles: [OrderPlanner]
    input: [reverse_reason]
    output: SerializedAsset
    success_status: 200
    side_effects: ["compensating transition TRADE_IN_RETURNED -> IN_SERVICE; withdraws the granted credit and clears the valuation"]
  - method: POST
    path: /serialized-assets/{id}/refurb/intake
    roles: [ServiceOpsAdmin]
    input: []
    output: SerializedAsset
    success_status: 200
    side_effects: ["TRADE_IN_RETURNED -> REFURB_INTAKE"]
  - method: POST
    path: /serialized-assets/{id}/refurb/certify
    roles: [ServiceOpsAdmin]
    input: [refurb_grade]
    output: SerializedAsset
    success_status: 200
    side_effects: ["REFURB_INTAKE -> REFURB_CERTIFIED; refused when a connected console has already lost firmware support"]
  - method: POST
    path: /serialized-assets/{id}/resell
    roles: [OrderPlanner]
    input: [buyer_facility_id]
    output: SerializedAsset
    success_status: 200
    side_effects: ["REFURB_CERTIFIED -> RESOLD; rewrites facility_id and clears the warranty window"]
  - method: POST
    path: /serialized-assets/{id}/scrap
    roles: [ServiceOpsAdmin]
    input: [scrap_reason]
    output: SerializedAsset
    success_status: 200
    side_effects: ["REFURB_INTAKE or REFURB_CERTIFIED -> SCRAPPED (terminal)"]

  # ---- Preventive maintenance ----------------------------------------------
  - method: POST
    path: /pm-programs
    roles: [ServiceOpsAdmin, FacilityManager]
    input: [facility_id, service_partner_id, tier, visit_interval_days]
    output: PMProgram
    success_status: 201
    side_effects: ["created in DRAFT; hours are not committed until activation"]
  - method: GET
    path: /pm-programs
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: ["facility_id?", "service_partner_id?", "status?", "limit?", "offset?"]
    output: PMProgram[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /pm-programs/{id}
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: []
    output: PMProgram
    success_status: 200
    side_effects: []
  - method: POST
    path: /pm-programs/{id}/activate
    roles: [ServiceOpsAdmin]
    input: []
    output: PMProgram
    success_status: 200
    side_effects: ["DRAFT -> ACTIVE; computes covered_asset_count and annual_labor_hours_committed and books them against the partner"]
  - method: POST
    path: /pm-programs/{id}/revise
