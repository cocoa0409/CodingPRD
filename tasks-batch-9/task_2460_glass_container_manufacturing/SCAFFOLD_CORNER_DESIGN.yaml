      - name: campaign_schedule_rebuild_aborts_only_colour_changes_inside_rebuild_window
        claim_type: conditional_cascade
        grounds:
          - state_machines.Campaign.WIND_DOWN_to_REBUILD_SCHEDULED
          - state_machines.ColorChange.SCHEDULED_to_ABORTED
          - calculations.furnace_posture_derivation
        distinguishing_aspect: |
          The abort cascade is conditional on window_start_at: CC-S8A starting 2026-08-02 (before the
          rebuild window) stays SCHEDULED while CC-S8B starting 2026-08-13 (on or after
          rebuild_window_start_at 2026-08-12) becomes ABORTED, and the furnace posture flips to COLD.
        test_recipe:
          setup:
            - "Furnace FUR-S8 with ACTIVE Campaign CMP-S8, window 2026-08-01 to 2026-08-11, then wound down (no jobs exist)"
            - "ColorChange CC-S8A SCHEDULED FLINT to AMBER over 2026-08-02..2026-08-03"
            - "ColorChange CC-S8B SCHEDULED FLINT to GREEN over 2026-08-13..2026-08-14"
            - "Logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-S8", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-S8", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${f}", to_color: "AMBER", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z", transition_loss_tons: 10.00 }
              as: BatchHouseTech
              captures: { cca: "$.data.id" }
            - call: "POST /glass-plant/color-changes"
