  - name: refurb_certify_is_guarded_by_the_console_support_horizon
    claim_type: guarded_transition
    grounds:
    - state_machines.SerializedAsset.REFURB_INTAKE_to_REFURB_CERTIFIED
    - validations[priority=19]
    - errors[ERR_FIRMWARE_SUPPORT_EXPIRED]
    - calculations.asset_trade_in_valuation
    distinguishing_aspect: 'REFURB_INTAKE -> REFURB_CERTIFIED is guarded by a cross-entity clock condition, not by the asset''s own status: the connected asset''s firmware_support_expires_at (2031-07-31)
      is not strictly after the logical clock (2031-08-01), so refurb/certify returns 409 ERR_FIRMWARE_SUPPORT_EXPIRED while the asset stays REFURB_INTAKE.'
