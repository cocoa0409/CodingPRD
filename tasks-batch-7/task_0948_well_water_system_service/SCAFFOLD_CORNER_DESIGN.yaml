              as: PlatformAdmin
              captures: { well2_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Treatment Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/water-tests"
              payload: { well_profile_id: "${well1_id}", collected_by_technician_id: "${tech_id}", panel_type: "CHEMICAL", sample_datetime: "2026-06-01T00:00:00Z" }
