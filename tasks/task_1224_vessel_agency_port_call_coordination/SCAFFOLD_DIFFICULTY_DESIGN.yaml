  - rule_id: compensating_invariant
    instances:
      - name: advance_create_refund_cash_invariant
        grounds:
          - state_machines.FundingAdvance.RECEIVED_to_REFUNDED
          - calculations.da_totals_calc
          - entities.DisbursementAccount.fields.funding_available_cents
        distinguishing_aspect: |
          Conserved quantity = unencumbered cash on the DA: create(50000) then refund of the same advance leaves
          funding_available_cents == its pre-create value 0 and received == refunded == 50000; the formula
          received - applied - refunded is invariant-restoring under the compensate pair.
