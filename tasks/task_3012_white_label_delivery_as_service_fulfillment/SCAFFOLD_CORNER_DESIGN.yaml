            - call: "POST /delivery-batches"
              payload: { store_id: "${s_id}", courier_id: "${c_id}", order_ids: ["${o1}"], dispatch_window_start: "2026-09-01T00:30:00Z", dispatch_window_end: "2026-09-01T01:00:00Z", expected_courier_version: "${c_v0}" }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /delivery-batches/${b1}/dispatch"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
