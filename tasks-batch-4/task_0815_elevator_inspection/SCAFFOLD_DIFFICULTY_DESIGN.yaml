            - call: "POST /inspections/${insB}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${insB}/complete"
              payload: { result: "PASS" }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /devices/${devA}"
