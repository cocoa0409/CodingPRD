            - "the screen action on an unknown project returns 404 ERR_PROJECT_NOT_FOUND, not 409 ERR_INVALID_PROJECT_STATE — priority 5 precedes priority 9"

      - name: unit_creation_requires_an_agreement_of_its_own_project
        claim_type: parent_relationships
        grounds:
          - validations.priority_38
          - errors[ERR_UNIT_PROJECT_MISMATCH]
          - entities.AffordableUnit.fields.agreement_id
        distinguishing_aspect: |
          AffordableUnit carries two foreign keys that must agree with each other:
          agreement_id must belong to the same project as project_id. Both ids resolve, so
          the priority-5 and priority-6 existence checks pass and the failure is the
          priority-38 referential rule ERR_UNIT_PROJECT_MISMATCH (422), not a 404. Swapping
          the agreement for the project's own agreement makes the identical payload succeed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
