      - name: go_to_market_without_an_open_layer_or_with_a_suspended_cedent_is_refused
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Program.transitions[SUBMISSION_READY->IN_MARKET].preconditions
          - validations[priority=21]
          - validations[priority=39]
          - errors.ERR_PROGRAM_STATE_INVALID
          - errors.ERR_CEDENT_SUSPENDED
        distinguishing_aspect: |
          The transition has three preconditions and two of them are independently observable: a
          SUBMISSION_READY program with no layer at all is 409 ERR_PROGRAM_STATE_INVALID, and the
          same program once its layer exists but its cedent has been suspended is 409
          ERR_CEDENT_SUSPENDED — the cedent-posture check is a separate rule at priority 39, not
          folded into the state check.
        test_recipe:
          setup:
            - "A SUBMISSION_READY program created with NO layer: the exposure package is signed off first, then the layer is added afterwards so the two failures can be observed in order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
