              payload: { disposition: "DISPUTE" }
              as: CustomerContact
              as_user_id: "${acct_id}"
              captures: { err_reason: "$.data.error_id" }
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "DISPUTE", dispute_reason: "Our roast blend was not affected by the index move" }
              as: CustomerContact
              as_user_id: "${acct_id}"
          assert:
            - "the AWAITING_PARTS advance without parts_eta is HTTP 422 with data.error_id == ERR_MISSING_TRANSITION_FIELD, and wo_status stays IN_PROGRESS with awaiting_parts_cycles == 0"
            - "the same advance WITH parts_eta is 2xx: wo_status == AWAITING_PARTS, parts_eta == 2026-08-06T00:00:00Z, awaiting_parts_cycles == 1"
            - "the IN_PROGRESS hop back needs no extra field at all and is 2xx"
            - "the RESOLVED advance without resolution_note is HTTP 422 with data.error_id == ERR_MISSING_TRANSITION_FIELD and wo_status stays IN_PROGRESS"
            - "the RESOLVED advance WITH resolution_note is 2xx: wo_status == RESOLVED and resolution_note == 'Brew head reseated'"
            - "the DISPUTE response without dispute_reason is HTTP 422 with data.error_id == ERR_MISSING_TRANSITION_FIELD, and PriceAdjustment.${adj_id}.adj_status stays PROPOSED with dispute_reason null"
            - "the DISPUTE response WITH dispute_reason is 2xx: adj_status == DISPUTED and dispute_reason is stored verbatim"

      - name: corner_two_violated_rules_return_the_higher_priority_error
        claim_type: priority_ordering
        grounds:
          - validations[priority=15]
          - validations[priority=42]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / visit_state_conflict_beats_delivered_units_overflow
          rationale: "That §1.8 instance sends an over-delivery to an already COMPLETED visit and asserts the priority-15 state error wins over the priority-42 quantity error."

      - name: corner_sanitation_hold_outranks_the_loaner_window_rule
        claim_type: priority_conflict
        grounds:
          - validations[priority=21]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sanitation_hold_beats_loaner_window_conflict
          rationale: "That §1.8 instance violates both rules with one swap and asserts the priority-21 hold error rather than the priority-26 availability error."

      - name: corner_credit_target_ownership_outranks_the_credit_amount_ceiling
        claim_type: priority_ordering
        grounds:
          - validations[priority=34]
          - validations[priority=46]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / credit_target_mismatch_beats_credit_amount_overflow
          rationale: "That §1.8 instance credits a foreign line for more than the invoice total and asserts the priority-34 target error rather than the priority-46 ceiling error."

