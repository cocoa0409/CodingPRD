            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/slideshow-2" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_clear_id: $.data.id, page_clear_ver: $.data.version }
          trigger:
