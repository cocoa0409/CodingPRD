            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 10, scanned_at: "2026-08-01T10:00:00Z", client_event_id: "os-1" }, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { stmt: "$.data.id", st_v1: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: JobberAdmin }
