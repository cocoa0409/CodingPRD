            - "Call 3 is refused on state, so the timing rule at priority 35 (which would also bar cancelling at/after lease_end_date) is never reached."
            - "The account still reads deposited 70.00, committed 0.00, leased_out 0.00, available 70.00 with an unchanged version — no double debit, no phantom credit."
            - "The lease still reads used_af 20.00, settlement_credit_af 0.00 and its post-completion version."

      - name: sm_adjudication_claim_dimensions_advance_on_independent_axes
        claim_type: valid_transition
        grounds:
          - state_machines.AdjudicationClaim.verification_status
          - state_machines.AdjudicationClaim.FILED_to_EXAMINED
          - state_machines.DecreeDocket.OPEN_FOR_CLAIMS_to_EXAMINATION
        distinguishing_aspect: >-
          One row, two machines: the evidentiary axis cycles UNVERIFIED ->
          DISPUTED -> FIELD_VERIFIED in any docket phase and never touches
          filing_status, while the procedural axis needs the docket in EXAMINATION
          and never touches verification_status.
        test_recipe:
          setup:
            - "ACTIVE right for claimant A with a 2024 METER record (so field verification has admissible evidence); docket DKT-2198-A with claim_filing_deadline 2026-06-01; one claim filed at clock 2026-03-01 for 100.00 AF."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: BasinAdjudicator}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: BasinAdjudicator, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: BasinAdjudicator, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: BasinAdjudicator}
            - {call: "POST /water-rights/${wr}/activate", as: BasinAdjudicator}
            - {call: "POST /decree-dockets", payload: {basin_code: "BASIN-01", docket_number: "DKT-2198-A", claim_filing_deadline: "2026-06-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dkt: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dkt}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {clm: "$.data.id"}}
          trigger:
            - {call: "POST /adjudication-claims/${clm}/verify", payload: {verification_outcome: DISPUTED, field_note: "headgate measurement contested by the watermaster"}, as: WaterRightsAnalyst}
            - {call: "POST /adjudication-claims/${clm}/verify", payload: {verification_outcome: FIELD_VERIFIED, field_note: "re-survey matches the metered record"}, as: WaterRightsAnalyst}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-06-01T00:00:00Z"}, as: BasinAdjudicator}
            - {call: "POST /decree-dockets/${dkt}/advance-phase", payload: {target_phase: EXAMINATION}, as: BasinAdjudicator}
            - {call: "POST /adjudication-claims/${clm}/examine", payload: {examiner_recommended_af: 90.00, examination_note: "recommend 90 AF on the metered history"}, as: BasinAdjudicator}
          assert:
            - "Call 1: verification_status DISPUTED while filing_status is STILL FILED, and DecreeDocket.claim_count is unchanged at 1 — no docket counter moves on the evidentiary axis."
            - "Call 2: verification_status FIELD_VERIFIED — DISPUTED -> FIELD_VERIFIED is the declared cycle on this axis, and it fired while the docket was still OPEN_FOR_CLAIMS (verification is not docket-phase gated)."
            - "Call 4: the advance to EXAMINATION succeeds at exactly claim_filing_deadline (`clock >= deadline`) with claim_count 1."
            - "Call 5: filing_status EXAMINED with examiner_recommended_af 90.00, and verification_status is STILL FIELD_VERIFIED — the procedural transition leaves the other axis alone."

