              payload: { name: "Rogue Mills", code: "RGUE", lead_time_days: 30, weekly_unit_capacity: 5000, min_order_units: 50, cancel_cutoff_days: 7 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { e_planner_vendor: $.data.error_id }
            - call: "GET /otb/category-plans/${plan_id}"
