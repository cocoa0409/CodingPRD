# Section 1.8: Scaffold Difficulty Design (Test Targeting Index)
# 21 instances across the nine Difficulty Rules of SKILL.md section 0.5.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: two_midnight_provisional_vs_final
        grounds:
          - calculations.two_midnight_benchmark
          - entities.UtilizationCase.fields.two_midnight_benchmark_met
          - entities.UtilizationCase.fields.benchmark_basis
        distinguishing_aspect: |
          Same case data, two variants on the UtilizationCase domain: PROVISIONAL (expected dates) evaluates to MET at intake while FINAL (actual discharge one day early) evaluates to NOT_MET — the variant switch flips the observable benchmark.
        test_recipe:
          setup:
            - "Medicare payer; attending physician; case admitted 2026-08-01T08:00:00Z with expected discharge 2026-08-03T10:00:00Z (2 calendar-date boundaries)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-DV1", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /api/utilization-cases/${case_id}/discharge"
              payload: { discharge_at: "2026-08-02T09:00:00Z" }
              as: URNurse
          assert:
            - "Before discharge: UtilizationCase.${case_id}.expected_midnight_count == 2 and two_midnight_benchmark_met == MET and benchmark_basis == PROVISIONAL (asserted on the create response)"
            - "After discharge: UtilizationCase.${case_id}.actual_midnight_count == 1"
            - "After discharge: UtilizationCase.${case_id}.two_midnight_benchmark_met == NOT_MET and benchmark_basis == FINAL"
            - "After discharge: UtilizationCase.${case_id}.review_status == CLOSED"

      - name: avoidable_attribution_first_cause_vs_dominant
        grounds:
          - calculations.avoidable_day_attribution
          - entities.Payer.fields.avoidable_attribution_method
          - entities.AvoidableDay.fields.is_attributed
        distinguishing_aspect: |
          Same two barrier records on the same day, different entity domain than the midnight benchmark: payer FIRST_CAUSE attributes the day to the earlier-created TRANSPORT_DELAY record, payer DOMINANT_CAUSE attributes it to the heavier PLACEMENT_DELAY record — identical inputs, divergent owners.
        test_recipe:
          setup:
            - "Two payers identical except avoidable_attribution_method (FIRST_CAUSE vs DOMINANT_CAUSE); one case each; each case records TRANSPORT_DELAY (weight 2) first and PLACEMENT_DELAY (weight 5) second for day 2026-08-04"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer FC", plan_class: "COMMERCIAL", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_fc: $.data.id }
            - call: "POST /api/payers"
              payload: { name: "Payer DC", plan_class: "COMMERCIAL", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "DOMINANT_CAUSE" }
              as: URDirector
              captures: { pay_dc: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-FC", payer_id: "${pay_fc}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_fc: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-DC", payer_id: "${pay_dc}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_dc: $.data.id }
            - call: "POST /api/utilization-cases/${case_fc}/avoidable-days"
              payload: { day_date: "2026-08-04", barrier_code: "TRANSPORT_DELAY", barrier_weight: 2 }
              as: CaseManager
            - call: "POST /api/utilization-cases/${case_fc}/avoidable-days"
              payload: { day_date: "2026-08-04", barrier_code: "PLACEMENT_DELAY", barrier_weight: 5 }
              as: CaseManager
            - call: "POST /api/utilization-cases/${case_dc}/avoidable-days"
              payload: { day_date: "2026-08-04", barrier_code: "TRANSPORT_DELAY", barrier_weight: 2 }
              as: CaseManager
            - call: "POST /api/utilization-cases/${case_dc}/avoidable-days"
              payload: { day_date: "2026-08-04", barrier_code: "PLACEMENT_DELAY", barrier_weight: 5 }
              as: CaseManager
          trigger:
            - call: "GET /api/utilization-cases/${case_fc}/avoidable-days"
              as: URNurse
            - call: "GET /api/utilization-cases/${case_dc}/avoidable-days"
              as: URNurse
          assert:
            - "FIRST_CAUSE case: list ordered by day_date ASC then created_at ASC — data[0] (TRANSPORT_DELAY).is_attributed == true and data[1] (PLACEMENT_DELAY).is_attributed == false"
            - "DOMINANT_CAUSE case: data[0] (TRANSPORT_DELAY).is_attributed == false and data[1] (PLACEMENT_DELAY).is_attributed == true"
            - "Both cases: open_avoidable_day_count == 1 (one distinct day) and no EscalationCase exists (tier 0)"

  - rule_id: combinatorial_formula
    instances:
      - name: necessity_score_caps_branch_threshold
        grounds:
          - calculations.medical_necessity_score
          - entities.AdmissionReview.fields.necessity_score
        distinguishing_aspect: |
          Mode (a): a 4-input formula with nested min caps and a plan_class conditional branch — the four pinned fixtures exercise the severity cap (20->12), the comorbidity cap (5->3), the Medicare-family branch (weight 4 vs 2), and the exact >= 60 threshold.
        test_recipe:
          setup:
            - "Medicare payer and Commercial payer; four cases (A/B/C on Medicare, D on Commercial); each case gets one AdmissionReview with pinned point inputs"
            - "Case A inputs sev=10 int=8 comorb=2: 50 + 40 + 8 = 98"
            - "Case B inputs sev=20 int=0 comorb=5: min(20,12)*5 + 0 + min(5,3)*4 = 60 + 0 + 12 = 72"
            - "Case C inputs sev=7 int=5 comorb=0: 35 + 25 + 0 = 60, exactly the threshold"
            - "Case D inputs sev=5 int=5 comorb=1 on COMMERCIAL: 25 + 25 + min(1,3)*2 = 52"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/payers"
              payload: { name: "Commercial PPO", plan_class: "COMMERCIAL", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_com: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-A", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_a: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-B", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_b: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-C", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_c: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-D", payer_id: "${pay_com}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_d: $.data.id }
            - call: "POST /api/utilization-cases/${case_a}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 10, intensity_of_service_points: 8, comorbidity_count: 2, two_midnight_attestation: true }
              as: URNurse
              captures: { rev_a: $.data.id }
            - call: "POST /api/utilization-cases/${case_b}/admission-reviews"
              payload: { criteria_set: "MCG", severity_of_illness_points: 20, intensity_of_service_points: 0, comorbidity_count: 5, two_midnight_attestation: true }
              as: URNurse
              captures: { rev_b: $.data.id }
            - call: "POST /api/utilization-cases/${case_c}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 7, intensity_of_service_points: 5, comorbidity_count: 0, two_midnight_attestation: true }
              as: URNurse
              captures: { rev_c: $.data.id }
            - call: "POST /api/utilization-cases/${case_d}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 5, intensity_of_service_points: 5, comorbidity_count: 1, two_midnight_attestation: false }
              as: URNurse
              captures: { rev_d: $.data.id }
          trigger:
            - call: "POST /api/admission-reviews/${rev_a}/submit"
              payload: {}
              as: URNurse
            - call: "POST /api/admission-reviews/${rev_b}/submit"
              payload: {}
              as: URNurse
            - call: "POST /api/admission-reviews/${rev_c}/submit"
              payload: {}
              as: URNurse
            - call: "POST /api/admission-reviews/${rev_d}/submit"
              payload: {}
              as: URNurse
          assert:
            - "AdmissionReview.${rev_a}.necessity_score == 98 and determination == CRITERIA_MET and recommended_status == INPATIENT"
            - "AdmissionReview.${rev_b}.necessity_score == 72 (severity capped at 12, comorbidity capped at 3) and determination == CRITERIA_MET"
            - "AdmissionReview.${rev_c}.necessity_score == 60 and determination == CRITERIA_MET (>= boundary is inclusive)"
            - "AdmissionReview.${rev_d}.necessity_score == 52 (COMMERCIAL comorbidity weight 2) and determination == CRITERIA_NOT_MET and recommended_status == OBSERVATION"

      - name: cc44_rebill_per_line_round_then_sum
        grounds:
          - calculations.cc44_rebill_estimate
          - entities.ConditionCode44Request.fields.rebill_estimate_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — two lines of 100001 cents at rate_milli 385 round per-line to 38500 each (sum 77000), while the rejected sum-then-round order yields 77001; the one-cent delta proves the pinned order.
        test_recipe:
          setup:
            - "Medicare payer; INPATIENT case whose latest submitted review is CRITERIA_NOT_MET (sev=2 int=2 comorb=0 -> score 20)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-RB", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 2, intensity_of_service_points: 2, comorbidity_count: 0, two_midnight_attestation: false }
              as: URNurse
              captures: { rev_id: $.data.id }
            - call: "POST /api/admission-reviews/${rev_id}/submit"
              payload: {}
              as: URNurse
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /api/utilization-cases/${case_id}/condition-code-44-requests"
              payload: { rationale: "Inpatient criteria not met; reclassify to observation.", service_lines: [{ description: "Room and board", charge_cents: 100001, rate_milli: 385 }, { description: "Lab panel", charge_cents: 100001, rate_milli: 385 }], expected_case_version: "${case_v2}" }
              as: URNurse
              captures: { cc44_id: $.data.id }
          assert:
            - "ConditionCode44Request.${cc44_id}.rebill_estimate_cents == 77000 (per-line round_half_up(38500.385)=38500 twice, then sum)"
            - "The rejected sum-then-round order would yield 77001; the pinned value is 77000"
            - "ConditionCode44Request.${cc44_id}.status == CONCURRENCE_PENDING"

      - name: escalation_credit_evaluation_order
        grounds:
          - calculations.escalation_tier_resolution
          - entities.EscalationCase.fields.director_credit_days
          - entities.EscalationCase.fields.effective_tier
        distinguishing_aspect: |
          Mode (c): credit eligibility depends on the tier while the tier depends on credited net count — the scaffold pins evaluation order (eligibility checked against the raw pre-credit tier), so a second credit remains eligible even though the effective tier has already dropped to 2.
        test_recipe:
          setup:
            - "Commercial case with six OPEN avoidable days (2026-08-02 .. 2026-08-07) -> open_avoidable_day_count 6, raw tier 3, one EscalationCase OPEN with tier 3"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Commercial PPO", plan_class: "COMMERCIAL", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_com: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-ESC", payer_id: "${pay_com}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
            - call: "POST /api/utilization-cases/${case_id}/avoidable-days"
              payload: { day_date: "2026-08-02", barrier_code: "PLACEMENT_DELAY", barrier_weight: 3 }
              as: CaseManager
            - call: "POST /api/utilization-cases/${case_id}/avoidable-days"
              payload: { day_date: "2026-08-03", barrier_code: "PAYER_AUTH_DELAY", barrier_weight: 3 }
              as: CaseManager
            - call: "POST /api/utilization-cases/${case_id}/avoidable-days"
              payload: { day_date: "2026-08-04", barrier_code: "TRANSPORT_DELAY", barrier_weight: 2 }
              as: CaseManager
            - call: "POST /api/utilization-cases/${case_id}/avoidable-days"
              payload: { day_date: "2026-08-05", barrier_code: "FAMILY_DECISION", barrier_weight: 2 }
              as: CaseManager
            - call: "POST /api/utilization-cases/${case_id}/avoidable-days"
              payload: { day_date: "2026-08-06", barrier_code: "PHYSICIAN_DELAY", barrier_weight: 2 }
              as: CaseManager
            - call: "POST /api/utilization-cases/${case_id}/avoidable-days"
              payload: { day_date: "2026-08-07", barrier_code: "PLACEMENT_DELAY", barrier_weight: 4 }
              as: CaseManager
            - call: "GET /api/utilization-cases/${case_id}/escalation-cases"
              as: URNurse
              captures: { esc_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/escalation-cases/${esc_id}/apply-credit"
              payload: { credit_days: 2 }
              as: URDirector
            - call: "POST /api/escalation-cases/${esc_id}/apply-credit"
              payload: { credit_days: 2 }
              as: URDirector
          assert:
            - "After first credit: EscalationCase.${esc_id}.tier == 3 (raw tier is sticky) and director_credit_days == 2 and effective_tier == 2 (net count 6-2=4)"
            - "Second apply-credit SUCCEEDS even though effective_tier was already 2 — eligibility was evaluated against the pre-credit raw tier 3"
            - "After second credit: director_credit_days == 4 and effective_tier == 1 (net count 6-4=2)"
            - "UtilizationCase.${case_id}.open_avoidable_day_count == 6 (credits do not rewrite day records)"

  - rule_id: non_linear_state_machine
    instances:
      - name: authorization_request_pend_resubmit_cycle
        grounds:
          - state_machines.AuthorizationRequest.SUBMITTED_to_PENDED
          - state_machines.AuthorizationRequest.PENDED_to_SUBMITTED
          - entities.AuthorizationRequest.fields.submission_round
        distinguishing_aspect: |
          Cyclic machine on AuthorizationRequest: SUBMITTED -> PENDED -> SUBMITTED twice, observable via submission_round incrementing 1 -> 2 -> 3 before a terminal APPROVED; a linear pipeline could never re-enter SUBMITTED.
        test_recipe:
          setup:
            - "Medicare payer; attending; INPATIENT case (version 1 at creation)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-CYC", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "PEND", pend_reason: "Need updated cardiology notes" }
              as: PayerReviewer
            - call: "POST /api/authorization-requests/${auth_id}/resubmit"
              payload: { clinical_summary: "Updated packet with cardiology consult and echo findings attached." }
              as: URNurse
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "PEND", pend_reason: "Need discharge disposition plan" }
              as: PayerReviewer
            - call: "POST /api/authorization-requests/${auth_id}/resubmit"
              payload: { clinical_summary: "Final packet with disposition plan, pharmacy reconciliation, and consults." }
              as: URNurse
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "APPROVE", certified_day_start: 1, certified_day_count: 3 }
              as: PayerReviewer
          assert:
            - "AuthorizationRequest.${auth_id}.submission_round == 3 (two PENDED -> SUBMITTED cycles)"
            - "AuthorizationRequest.${auth_id}.status == APPROVED with certified_day_start == 1 and certified_day_end == 4"
            - "UtilizationCase.${case_id}.auth_status == AUTHORIZED and review_status == MONITORING"

      - name: utilization_case_parallel_state_axes
        grounds:
          - state_machines.UtilizationCase
          - entities.UtilizationCase.fields.review_status
          - entities.UtilizationCase.fields.auth_status
        distinguishing_aspect: |
          Two independent state dimensions on ONE entity (UtilizationCase): the review axis (INTAKE -> ADMISSION_REVIEWED -> MONITORING) and the auth axis (AUTH_PENDING -> AUTH_IN_PROGRESS -> AUTHORIZED) advance on different triggers, and every intermediate combination is observable.
        test_recipe:
          setup:
            - "Medicare payer; attending; case; one admission review; one authorization request approved"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-AX", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 10, intensity_of_service_points: 8, comorbidity_count: 2, two_midnight_attestation: true }
              as: URNurse
              captures: { rev_id: $.data.id }
            - call: "POST /api/admission-reviews/${rev_id}/submit"
              payload: {}
              as: URNurse
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
              captures: { case_v2: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v2}" }
              as: URNurse
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "APPROVE", certified_day_start: 1, certified_day_count: 3 }
              as: PayerReviewer
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
          assert:
            - "At creation: review_status == INTAKE and auth_status == AUTH_PENDING"
            - "After review submit (captured via the submit-driven GET): review_status == ADMISSION_REVIEWED while auth_status still == AUTH_PENDING (auth create later moves only the auth axis)"
            - "After auth create: auth_status == AUTH_IN_PROGRESS while review_status == ADMISSION_REVIEWED"
            - "After approval: review_status == MONITORING and auth_status == AUTHORIZED and certified_day_count == 3"

      - name: cc44_fork_join_with_rescind_revert
        grounds:
          - state_machines.ConditionCode44Request.CONCURRENCE_PENDING_to_DECLINED_CLOSED
          - state_machines.ConditionCode44Request.COMMITTEE_PENDING_to_APPROVED
          - state_machines.ConditionCode44Request.APPROVED_to_RESCINDED
        distinguishing_aspect: |
          Branching fork-join with a revert on ConditionCode44Request: the DECLINE fork closes the request with zero case mutation, while the CONCUR -> APPROVE fork flips case status, and RESCIND reverts it — the two forks carry observably different side-effect sets.
