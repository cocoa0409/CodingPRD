              as_user_id: "amgr-001"
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "RECOMMENDED", selected_alternative_id: "${alt_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/consultations"
              payload: { trust_id: "${trust_id}", subject_type: "WORKOUT_PLAN", workout_plan_id: "${plan_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { consult_id: "$.data.id" }
            - call: "POST /special-servicing/consultations/${consult_id}/response"
              payload: { response: "CONSENTED" }
              as: ControllingClassRepresentative
              as_user_id: "${trust_id}"
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "APPROVED" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "EXECUTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "CORRECTED" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { corrected_status: "$.data.servicing_status", timely_at_correction: "$.data.consecutive_timely_payments" }
          trigger:
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "CURRENT", as_of_date: "2026-08-01T00:00:00Z", timely_payment_recorded: true }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { timely_1: "$.data.consecutive_timely_payments" }
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "CURRENT", as_of_date: "2026-09-01T00:00:00Z", timely_payment_recorded: true }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { timely_2: "$.data.consecutive_timely_payments" }
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "DELINQUENT_30", as_of_date: "2026-10-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { timely_after_miss: "$.data.consecutive_timely_payments", payment_status_miss: "$.data.payment_status" }
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "CURRENT", as_of_date: "2026-11-01T00:00:00Z", timely_payment_recorded: true }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { timely_3: "$.data.consecutive_timely_payments" }
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "CURRENT", as_of_date: "2026-12-01T00:00:00Z", timely_payment_recorded: true }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { timely_4: "$.data.consecutive_timely_payments" }
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "MASTER_SERVICING" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { below_threshold_error: "$.data.error_id" }
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "CURRENT", as_of_date: "2027-01-01T00:00:00Z", timely_payment_recorded: true }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { timely_5: "$.data.consecutive_timely_payments" }
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "MASTER_SERVICING" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { at_threshold_status: "$.data.servicing_status" }
          assert:
            - "consecutive_timely_payments is 0 when the loan reaches CORRECTED, then 1 and 2 after the first two timely payments"
            - "The DELINQUENT_30 transition resets consecutive_timely_payments to 0 — a total-payments counter would have stayed at 2"
            - "The two payments after the reset bring the counter to 1 then 2, so four timely payments have now been recorded in total but only two consecutively"
            - "MASTER_SERVICING at counter 2 returns HTTP 422 with error_id ERR_INSUFFICIENT_TIMELY_PAYMENTS and the loan stays CORRECTED"
            - "The fifth timely payment brings the counter to exactly 3, the threshold value, and the identical MASTER_SERVICING call now returns 200 with servicing_status MASTER_SERVICING — the comparison is >= 3, inclusive at the boundary"
            - "The DELINQUENT_30 transition recorded no ServicingTransferEvent: only DELINQUENT_60 and MATURED_UNPAID auto-record one, so the reset does not drag the loan back into special servicing"
            - "timely_payment_recorded is consulted only on CURRENT; the DELINQUENT_30 call omitted it entirely and was still accepted"

  - section: consistency_model
    instances:
      - name: every_cascade_target_is_readable_in_the_same_request_sequence
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.AppraisalReduction.PROVISIONAL_to_EFFECTIVE
        distinguishing_aspect: "No convergence, no retry, no re-read loop: the single EFFECTIVE transition's four denormalized targets — the loan's reduction amount, the loan's ARA-adjusted advance obligation, the trust's total reduction and the trust's controlling class notional — are all correct on the very first read that follows, and a second identical read returns byte-identical values, so nothing is being reconciled in the background."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; trust with original controlling class balance 40,000,000.00, one loan with principal 10,000,000.00 and monthly debt service 65,000.00 in SPECIAL_SERVICING."
            - "An UPDATE appraisal RECEIVED at 6,000,000.00 and ACCEPTED by a second asset manager, leaving one PROVISIONAL reduction."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V48", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V48", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-06-20T00:00:00Z", appraiser_firm: "Meridian Valuation" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 6000000, as_of_date: "2026-07-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_id}", status: "PROVISIONAL" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { ara_id: "$.data[0].id", ara_amount_provisional: "$.data[0].ara_amount_usd", ara_basis: "$.data[0].calculation_basis" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_ara_before: "$.data.ara_amount_usd", loan_pi_before: "$.data.required_monthly_pi_advance_usd" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: Trustee
              as_user_id: "trustee-001"
              captures: { trust_ara_before: "$.data.total_ara_usd", trust_notional_before: "$.data.controlling_class_notional_usd", trust_control_before: "$.data.control_status" }
          trigger:
            - call: "POST /special-servicing/appraisal-reductions/${ara_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { ara_status: "$.data.status", ara_effective_on: "$.data.effective_on", ara_amount: "$.data.ara_amount_usd" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_ara_after: "$.data.ara_amount_usd", loan_pi_after: "$.data.required_monthly_pi_advance_usd" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: Trustee
              as_user_id: "trustee-001"
              captures: { trust_ara_after: "$.data.total_ara_usd", trust_notional_after: "$.data.controlling_class_notional_usd", trust_control_after: "$.data.control_status" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_ara_reread: "$.data.ara_amount_usd", loan_pi_reread: "$.data.required_monthly_pi_advance_usd" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: Trustee
              as_user_id: "trustee-001"
              captures: { trust_ara_reread: "$.data.total_ara_usd", trust_notional_reread: "$.data.controlling_class_notional_usd" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PI_ADVANCE", amount_usd: 35100, advanced_on: "2026-08-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_id: "$.data.id", advance_amount: "$.data.amount_usd" }
          assert:
            - "Before the transition the reduction is PROVISIONAL at 4600000.00 on the GROSS_APPRAISED_BASIS (10,000,000.00 - 0.90 * 6,000,000.00), while loan.ara_amount_usd is 0.00, loan.required_monthly_pi_advance_usd is 65000.00, trust.total_ara_usd is 0.00 and trust.controlling_class_notional_usd is 40000000.00"
            - "The EFFECTIVE response itself already carries status EFFECTIVE, effective_on 2026-08-01T00:00:00Z and ara_amount_usd 4600000.00"
            - "The FIRST read after the transition already shows loan.ara_amount_usd 4600000.00 and loan.required_monthly_pi_advance_usd 35100.00 = round(65,000.00 * (10,000,000.00 - 4,600,000.00) / 10,000,000.00, 2)"
            - "The FIRST read of the trust already shows total_ara_usd 4600000.00 and controlling_class_notional_usd 35400000.00 = 40,000,000.00 - 4,600,000.00 - 0.00, with control_status still CONTROLLING"
            - "The immediate re-reads return exactly the same four values: nothing converged between the two reads and no denormalized field lagged"
            - "The advance funded at exactly the new 35100.00 ceiling is accepted, proving the reduced obligation was in force for the very next write and not only for reads"
