scaffold_corner_design:

  # =========================================================================
  # Entities — creation, required fields, not-found, computed/system fields
  # =========================================================================
  - section: entities
    instances:
      - name: create_referral_returns_201_with_received_status
        claim_type: Creation
        grounds:
          - entities.Referral
          - endpoints[POST /referrals]
        distinguishing_aspect: "POST /referrals with all required fields returns 201 and status RECEIVED, version 1."
        test_recipe:
          setup:
            - "One SCREENER caseworker exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara1@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child N", alleged_maltreatment: "NEGLECT", priority_factors: [] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_n: $.data.id }
          assert:
            - "response.status == 201"
            - "Referral.${ref_n}.status == RECEIVED"
            - "Referral.${ref_n}.version == 1"

      - name: create_referral_missing_required_alleged_maltreatment_rejected
        claim_type: Required Fields
        grounds:
          - entities.Referral.fields.alleged_maltreatment
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /referrals omitting alleged_maltreatment returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One SCREENER caseworker exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara2@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child N" }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_referral_invalid_enum_reporter_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Referral.fields.reporter_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /referrals with reporter_type not in the enum returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One SCREENER caseworker exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara3@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { reporter_type: "GHOST", child_name: "Child N", alleged_maltreatment: "NEGLECT" }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_referral_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Referral
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /referrals/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "One SCREENER caseworker exists; no referral with the probed id exists."
          setup_api_calls:
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara4@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
          trigger:
            - call: "GET /referrals/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: foster_home_capacity_below_one_rejected
        claim_type: Type Constraints
        grounds:
          - entities.FosterHome.fields.bed_capacity
          - errors[ERR_VALIDATION_LIMIT]
        distinguishing_aspect: "POST /foster-homes with bed_capacity 0 violates the >=1 range and returns ERR_VALIDATION_LIMIT (422)."
        test_recipe:
          setup:
            - "One LICENSING caseworker exists."
          setup_api_calls:
            - call: "POST /caseworkers"
              payload: { full_name: "Lara", role_type: "LICENSING", email: "c_lara1@x.gov" }
              as: Admin
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /foster-homes"
              payload: { licensing_worker_id: "${lic_id}", home_name: "Bad Home", bed_capacity: 0, max_age_years: 18, accepts_maltreatment: ["NEGLECT"] }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION_LIMIT"

      - name: child_age_years_computed_from_dob_and_clock
        claim_type: Computed Fields
        grounds:
          - entities.Child.fields.age_years
          - entities.Child.fields.date_of_birth
        distinguishing_aspect: "GET /children/{id} returns age_years computed from date_of_birth vs the clock (born 2016-01-01, clock 2026-06-01 -> 10)."
        test_recipe:
          setup:
            - "A child born 2016-01-01 on an open case; clock at 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara5@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "c_ivan5@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "c_cara5@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child Y", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_y: $.data.id }
            - call: "POST /referrals/${ref_y}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_y}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_y: $.data.id }
            - call: "POST /investigations/${invn_y}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /investigations/${invn_y}/decision"
              payload: { safety_factors: ["NO_FOOD", "MEDICAL_NEGLECT", "DRUG_ENV", "UNSAFE_SLEEP"], protective_capacity: 0 }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases"
              payload: { investigation_id: "${invn_y}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { case_y: $.data.id }
            - call: "POST /children"
              payload: { case_id: "${case_y}", full_name: "Child Y", date_of_birth: "2016-01-01T00:00:00Z" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { child_y: $.data.id }
          trigger:
            - call: "GET /children/${child_y}"
              payload: {}
              as: Caseworker
              as_user_id: "${cw_id}"
          assert:
            - "Child.${child_y}.age_years == 10"

      - name: system_fields_ignored_on_referral_create
        claim_type: System Fields
        grounds:
          - entities.Referral.fields.status
        distinguishing_aspect: "Client-supplied status on POST /referrals is ignored; server forces RECEIVED."
        test_recipe:
          setup:
            - "One SCREENER caseworker exists."
          setup_api_calls:
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara6@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { reporter_type: "RELATIVE", child_name: "Child Q", alleged_maltreatment: "NEGLECT" }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_q: $.data.id }
          assert:
            - "response.status == 201"
            - "Referral.${ref_q}.status == RECEIVED"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, initial state
  # =========================================================================
  - section: state_machines
    instances:
      - name: screen_already_screened_out_referral_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Referral.RECEIVED_to_SCREENED_OUT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Re-screening a referral already SCREENED_OUT (terminal) returns ERR_INVALID_STATE (409); no recompute."
        test_recipe:
          setup:
            - "A referral has been SCREENED_OUT (low score)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara7@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "ANONYMOUS", child_name: "Child B", alleged_maltreatment: "EMOTIONAL_ABUSE", priority_factors: [] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_o2: $.data.id }
            - call: "POST /referrals/${ref_o2}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
          trigger:
            - call: "POST /referrals/${ref_o2}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: open_case_from_safe_investigation_rejected
        claim_type: guarded transitions
        grounds:
          - state_machines.Investigation.IN_PROGRESS_to_SAFE
          - errors[ERR_INVESTIGATION_NOT_REMOVAL]
        distinguishing_aspect: "POST /cases from a SAFE investigation (neither UNSAFE nor CONDITIONALLY_SAFE) returns ERR_INVESTIGATION_NOT_REMOVAL (409)."
        test_recipe:
          setup:
            - "An investigation decided SAFE (score 0)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara8@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "c_ivan8@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "c_cara8@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child S", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_s2: $.data.id }
            - call: "POST /referrals/${ref_s2}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_s2}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_s2: $.data.id }
            - call: "POST /investigations/${invn_s2}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /investigations/${invn_s2}/decision"
              payload: { safety_factors: ["NO_FOOD"], protective_capacity: 5 }
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /cases"
              payload: { investigation_id: "${invn_s2}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVESTIGATION_NOT_REMOVAL"

      - name: investigation_on_not_screened_in_referral_rejected
        claim_type: guarded transitions
        grounds:
          - state_machines.Referral.RECEIVED_to_SCREENED_IN
          - errors[ERR_REFERRAL_NOT_SCREENED_IN]
        distinguishing_aspect: "POST /investigations referencing a RECEIVED (not yet screened-in) referral returns ERR_REFERRAL_NOT_SCREENED_IN (409)."
        test_recipe:
          setup:
            - "A RECEIVED referral that has not been screened; an INVESTIGATOR and CASEWORKER exist."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara9@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "c_ivan9@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "c_cara9@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child U", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_u2: $.data.id }
          trigger:
            - call: "POST /investigations"
              payload: { referral_id: "${ref_u2}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REFERRAL_NOT_SCREENED_IN"

      - name: hold_hearing_before_scheduled_time_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Hearing.SCHEDULED_to_HELD
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Holding a hearing while the clock is before scheduled_at violates the precondition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A case has a SCHEDULED hearing at 2026-02-10T10:00:00Z; clock is at 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara10@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "c_ivan10@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "c_cara10@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child F", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_f: $.data.id }
            - call: "POST /referrals/${ref_f}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_f}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_f: $.data.id }
            - call: "POST /investigations/${invn_f}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /investigations/${invn_f}/decision"
              payload: { safety_factors: ["NO_FOOD", "MEDICAL_NEGLECT", "DRUG_ENV", "UNSAFE_SLEEP"], protective_capacity: 0 }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases"
              payload: { investigation_id: "${invn_f}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { case_f: $.data.id }
            - call: "POST /hearings"
              payload: { case_id: "${case_f}", hearing_type: "SHELTER", scheduled_at: "2026-02-10T10:00:00Z" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { hr_f: $.data.id }
          trigger:
            - call: "POST /hearings/${hr_f}/hold"
              payload: { ruling: "CONTINUE_PLACEMENT" }
              as: Judge
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: investigation_initial_state_is_assigned
        claim_type: Initial State
        grounds:
          - state_machines.Investigation.initial_state
        distinguishing_aspect: "A newly created investigation starts in ASSIGNED."
        test_recipe:
          setup:
            - "A screened-in referral; an INVESTIGATOR and CASEWORKER exist."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara11@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "c_ivan11@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "c_cara11@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child I", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_i: $.data.id }
            - call: "POST /referrals/${ref_i}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
          trigger:
            - call: "POST /investigations"
              payload: { referral_id: "${ref_i}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_i: $.data.id }
          assert:
            - "response.status == 201"
            - "Investigation.${invn_i}.status == ASSIGNED"

      - name: cancel_visit_after_window_open_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Visitation.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a visit when the clock is already at/after window_start violates the precondition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A SCHEDULED visit [10:00,11:00) for a child; clock advanced to 10:30 (window already open)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "c_sara12@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "c_ivan12@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "c_cara12@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child J", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_j: $.data.id }
            - call: "POST /referrals/${ref_j}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_j}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_j: $.data.id }
            - call: "POST /investigations/${invn_j}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /investigations/${invn_j}/decision"
              payload: { safety_factors: ["NO_FOOD", "MEDICAL_NEGLECT", "DRUG_ENV", "UNSAFE_SLEEP"], protective_capacity: 0 }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases"
              payload: { investigation_id: "${invn_j}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { case_j: $.data.id }
            - call: "POST /children"
              payload: { case_id: "${case_j}", full_name: "Child J", date_of_birth: "2016-01-01T00:00:00Z" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { child_j: $.data.id }
            - call: "POST /case-plans"
              payload: { case_id: "${case_j}", required_visits_per_month: 4, objectives_total: 5 }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { plan_j: $.data.id }
            - call: "POST /visitations"
              payload: { case_plan_id: "${plan_j}", child_id: "${child_j}", supervision: "SUPERVISED", window_start: "2026-02-05T10:00:00Z", window_end: "2026-02-05T11:00:00Z" }
              as: Caseworker
