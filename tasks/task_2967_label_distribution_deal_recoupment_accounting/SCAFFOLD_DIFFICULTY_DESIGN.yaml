            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /physical-runs"
              payload: { release_id: "${rel1_id}", distributor_id: "${dist_id}", units_planned: 1050, unit_manufacturing_cost_cents: 250, window_start: "2026-04-01", window_end: "2026-06-30" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { run_pass_id: $.data.id }
            - call: "POST /physical-runs/${run_pass_id}/manufacture"
              payload: { units_manufactured: 1050 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
