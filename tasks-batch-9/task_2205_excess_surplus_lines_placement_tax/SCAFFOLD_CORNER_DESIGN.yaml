              as: PlatformAdmin
              captures: { c_t2_id: $.data.id }
            - call: "POST /carriers"
              payload: { naic_number: "50004", legal_name: "Tier Two Minus One Insurance Company", domicile_type: "US_STATE", capital_surplus_cents: 1499999999, am_best_rating: "A", trust_fund_cents: 0, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { c_t2m_id: $.data.id }
            - call: "POST /carriers"
              payload: { naic_number: "50005", legal_name: "Tier Three Minus One Insurance Company", domicile_type: "US_STATE", capital_surplus_cents: 499999999, am_best_rating: "A", trust_fund_cents: 0, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { c_t3m_id: $.data.id }
          trigger:
            - call: "POST /carriers/${c_t1_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { r_t1_id: $.data.id }
            - call: "POST /market-security-reviews/${r_t1_id}/start"
