# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over SCAFFOLD.yaml §1.1-§1.7 per references/claim-extraction-guide.
# Difficulty-rule coverage lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; overlapping
# corners are emitted as excluded_because stubs.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: event_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Event, state_machines.Event]
        distinguishing_aspect: "Create with required inputs returns 201 with system-stamped defaults: posture BIDDING, version 1, server UUID id, created_at from the logical clock default."
        test_recipe:
          setup: ["empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version, ev_p: $.data.posture, ev_ca: $.data.created_at } }
          assert:
            - "HTTP 201; Event.${ev_id}.posture == BIDDING"
            - "Event.${ev_id}.version == 1 and id is a server-minted UUID"
            - "Event.${ev_id}.created_at == 2026-08-01T00:00:00.000Z (stamped from logical clock, not wall clock)"
            - "Event.${ev_id}.registered_team_count == 0 and finalized_match_count == 0"

      - name: event_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Event.fields.host_city, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required input host_city yields 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400; error_id == ERR_VALIDATION"
            - "GET /api/v1/events returns total_count == 0"

      - name: event_get_missing_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent event UUID returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/v1/events/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND; response_type == error"

      - name: booking_computed_money_fields
        claim_type: computed_fields
        grounds: [entities.RoomBooking.fields.room_nights, entities.RoomBooking.fields.rate_cents, entities.RoomBooking.fields.total_charge_cents]
        distinguishing_aspect: "room_nights = rooms_count x nights (3 x 4 = 12), rate_cents pinned 15000 from the block, total_charge_cents == 180000."
        test_recipe:
          setup: ["Event E; block H CONTRACTED (rate 15000, nights 10-08..10-12, cutoff 2026-10-01)"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb_id: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/contract", payload: {}, as: CommissionAdmin }
          trigger:
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A", rooms_count: 3, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk1: $.data.id, rn: $.data.room_nights, rate: $.data.rate_cents, tot: $.data.total_charge_cents } }
          assert:
            - "RoomBooking.${bk1}.room_nights == 12"
            - "RoomBooking.${bk1}.rate_cents == 15000 (pinned from block at creation)"
            - "RoomBooking.${bk1}.total_charge_cents == 180000"
            - "RoomBooking.${bk1}.status == RESERVED"

      - name: booking_room_nights_input_ignored
        claim_type: computed_fields
        grounds: [entities.RoomBooking.fields.room_nights]
        distinguishing_aspect: "Client-supplied room_nights in the create payload is ignored; the server-computed value 12 is returned."
        test_recipe:
          setup: ["Event E; block H CONTRACTED"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb_id: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/contract", payload: {}, as: CommissionAdmin }
          trigger:
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A", rooms_count: 3, check_in_date: "2026-10-08", check_out_date: "2026-10-12", room_nights: 999 }, as: CommissionAdmin, captures: { rn: $.data.room_nights } }
          assert:
            - "response room_nights == 12 (server-computed), not the supplied 999"

      - name: official_defaults_applied
        claim_type: defaults
        grounds: [entities.Official.fields.needs_housing, entities.Official.fields.game_limit_per_day]
        distinguishing_aspect: "Omitting optional inputs applies documented defaults: needs_housing false, game_limit_per_day 4, status REGISTERED."
        test_recipe:
          setup: ["Event E"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /api/v1/events/${ev_id}/officials", payload: { name: "Ora One", certification_level: REGIONAL }, as: CommissionAdmin, captures: { o1: $.data.id, nh: $.data.needs_housing, gl: $.data.game_limit_per_day, st: $.data.status } }
          assert:
            - "Official.${o1}.needs_housing == false"
            - "Official.${o1}.game_limit_per_day == 4"
            - "Official.${o1}.status == REGISTERED and assigned_game_count == 0"

      - name: venue_create_under_missing_event_not_found
        claim_type: parent_relationships
        grounds: [entities.Venue.fields.event_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Child creation under a nonexistent parent id fails with 404 ERR_NOT_FOUND (existence validated left-to-right)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/v1/events/00000000-0000-0000-0000-000000000000/venues", payload: { name: "Ghost Park", address: "0 Nowhere", rental_fee_cents: 1000, revenue_share_pct: 0.10 }, as: CommissionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: bid_initial_state_and_cycle
        claim_type: initial_state
        grounds: [state_machines.Bid, entities.Bid.fields.cycle_number]
        distinguishing_aspect: "A freshly created bid starts DRAFT with cycle_number 1, revision_count 0, and the event's active_bid_id pointing at it."
        test_recipe:
          setup: ["Event E (version 1)"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
          trigger:
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}", notes: "initial" }, as: CommissionAdmin, captures: { bid_id: $.data.id, st: $.data.status, cyc: $.data.cycle_number, rc: $.data.revision_count } }
          assert:
            - "Bid.${bid_id}.status == DRAFT, cycle_number == 1, revision_count == 0"
            - "Event.${ev_id}.active_bid_id == ${bid_id} and Event.version == 2"

      - name: bid_terminal_lockdown_decide_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Bid, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "AWARDED is terminal: a second decide returns 409 ERR_ALREADY_TERMINAL and changes nothing."
        test_recipe:
          setup: ["Event E; bid awarded (requirement verified, score 100)"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/bids/${bid_id}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: AWARDED }, as: SanctioningReviewer, as_user_id: "rev-9" }
          trigger:
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: REJECTED }, as: SanctioningReviewer, as_user_id: "rev-9", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; error_id == ERR_ALREADY_TERMINAL"
            - "Bid.${bid_id}.status remains AWARDED; Event.${ev_id}.posture remains AWARDED"

      - name: booking_double_cancel_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RoomBooking, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is terminal for bookings; a second CANCEL is rejected with ERR_ALREADY_TERMINAL and pickup stays 0."
        test_recipe:
          setup: ["Event E; block CONTRACTED; booking B1 (rooms 1, 4 nights) RESERVED, then CANCELLED"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb_id: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/contract", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A", rooms_count: 1, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk1: $.data.id } }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CANCEL }, as: CommissionAdmin }
          trigger:
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CANCEL }, as: CommissionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; error_id == ERR_ALREADY_TERMINAL"
            - "HotelBlock.${hb_id}.picked_up_room_nights == 0"

      - name: finalize_advances_winner_to_final_slot
        claim_type: side_effect_execution
        grounds: [state_machines.Match.IN_PROGRESS_to_FINAL, calculations.bracket_topology, entities.Match.fields.winner_advances_to_match_id]
        distinguishing_aspect: "Winning R1 slot 1 (odd) writes the winner into the final's home slot; the loser (seed 4) becomes ELIMINATED."
        test_recipe:
          setup:
            - "Event LIVE; division U16 with 4 ELIGIBLE teams (ratings 90, 85, 70, 65 -> seeds t1=1, t3=2, t2=3, t4=4); bracket published: R1M1 (t1 vs t4), R1M2 (t3 vs t2), FINAL"
            - "R1M1 scheduled and started"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/bids/${bid_id}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: AWARDED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/events/${ev_id}/venues", payload: { name: "River Park", address: "1 Park Way", rental_fee_cents: 200000, revenue_share_pct: 0.10 }, as: CommissionAdmin, captures: { v1: $.data.id } }
            - { call: "POST /api/v1/venues/${v1}/contract", payload: { contract_uri: "s3://contracts/v1.pdf" }, as: CommissionAdmin }
            - { call: "POST /api/v1/venues/${v1}/fields", payload: { name: "Field 1", surface_type: TURF, has_lights: true, slot_minutes: 90 }, as: CommissionAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb1: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb1}/contract", payload: {}, as: CommissionAdmin }
            - { call: "GET /api/v1/events/${ev_id}", as: Any, captures: { ev_v3: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: PLANNING, expected_event_version: "${ev_v3}" }, as: CommissionAdmin, captures: { ev_v4: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/divisions", payload: { name: "U16", team_cap: 4, min_teams: 2, registration_fee_cents: 10000 }, as: CommissionAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: REGISTRATION_OPEN, expected_event_version: "${ev_v4}" }, as: CommissionAdmin, captures: { ev_v5: $.data.version } }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Tigers", contact_email: "t@x.com", strength_rating: 90 }, as: CommissionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Sharks", contact_email: "s@x.com", strength_rating: 70 }, as: CommissionAdmin, captures: { t2: $.data.id } }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Wolves", contact_email: "w@x.com", strength_rating: 85 }, as: CommissionAdmin, captures: { t3: $.data.id } }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Bears", contact_email: "b@x.com", strength_rating: 65 }, as: CommissionAdmin, captures: { t4: $.data.id } }
            - { call: "POST /api/v1/teams/${t1}/roster", payload: { roster_player_count: 12 }, as: TeamRep, as_user_id: "${t1}" }
            - { call: "POST /api/v1/teams/${t2}/roster", payload: { roster_player_count: 12 }, as: TeamRep, as_user_id: "${t2}" }
            - { call: "POST /api/v1/teams/${t3}/roster", payload: { roster_player_count: 12 }, as: TeamRep, as_user_id: "${t3}" }
            - { call: "POST /api/v1/teams/${t4}/roster", payload: { roster_player_count: 12 }, as: TeamRep, as_user_id: "${t4}" }
            - { call: "POST /api/v1/teams/${t1}/verify-eligibility", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/teams/${t2}/verify-eligibility", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/teams/${t3}/verify-eligibility", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/teams/${t4}/verify-eligibility", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/divisions/${d1}/lock-seeding", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: COMPETITION_SETUP, expected_event_version: "${ev_v5}" }, as: CommissionAdmin, captures: { ev_v6: $.data.version } }
            - { call: "POST /api/v1/divisions/${d1}/publish-bracket", payload: {}, as: CommissionAdmin }
            - { call: "GET /api/v1/divisions/${d1}/matches", as: Any, captures: { m1: "$.data[0].id", fin: "$.data[2].id" } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: LIVE, expected_event_version: "${ev_v6}" }, as: CommissionAdmin }
            - { call: "POST /api/v1/matches/${m1}/schedule", payload: { field_id: "${f1}", scheduled_start: "2026-10-10T14:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/matches/${m1}/start", payload: {}, as: CommissionAdmin }
          trigger:
            - { call: "POST /api/v1/matches/${m1}/finalize", payload: { home_score: 2, away_score: 0 }, as: CommissionAdmin, captures: { win: $.data.winner_team_id } }
            - { call: "GET /api/v1/matches/${fin}", as: Any, captures: { fin_home: $.data.home_team_id } }
            - { call: "GET /api/v1/teams/${t4}", as: Any, captures: { t4_st: $.data.status } }
          assert:
            - "Match.${m1}.winner_team_id == ${t1} (seed 1 beat seed 4, score 2-0)"
            - "Match.${fin}.home_team_id == ${t1} (odd bracket_slot advances into the home slot)"
            - "Team.${t4}.status == ELIMINATED"

      - name: division_completes_when_all_matches_terminal
        claim_type: side_effect_execution
        grounds: [state_machines.Division.BRACKET_PUBLISHED_to_COMPLETED, state_machines.Match.IN_PROGRESS_to_FINAL]
        distinguishing_aspect: "Bubble-up: finalizing the division's last non-terminal match moves Division BRACKET_PUBLISHED -> COMPLETED without a separate call."
        test_recipe:
          setup: ["Event LIVE; 2-team division; only match scheduled + started"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/bids/${bid_id}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: AWARDED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/events/${ev_id}/venues", payload: { name: "River Park", address: "1 Park Way", rental_fee_cents: 200000, revenue_share_pct: 0.10 }, as: CommissionAdmin, captures: { v1: $.data.id } }
            - { call: "POST /api/v1/venues/${v1}/contract", payload: { contract_uri: "s3://contracts/v1.pdf" }, as: CommissionAdmin }
            - { call: "POST /api/v1/venues/${v1}/fields", payload: { name: "Field 1", surface_type: TURF, has_lights: true, slot_minutes: 90 }, as: CommissionAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb1: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb1}/contract", payload: {}, as: CommissionAdmin }
            - { call: "GET /api/v1/events/${ev_id}", as: Any, captures: { ev_v3: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: PLANNING, expected_event_version: "${ev_v3}" }, as: CommissionAdmin, captures: { ev_v4: $.data.version } }
