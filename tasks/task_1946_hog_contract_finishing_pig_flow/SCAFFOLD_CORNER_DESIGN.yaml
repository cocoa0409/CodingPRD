  # ============================================================ rbac
  - section: rbac
    instances:
      - name: feedmill_cannot_dispatch_load
        claim_type: role_denial
        grounds: [ "roles[FeedMill]", "roles[TransportCoordinator]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Peer-role isolation: FeedMill may schedule/deliver feed but dispatch is TransportCoordinator-exclusive -> 403."
        test_recipe:
          setup: ["group PLACED 500 head; load SCHEDULED for 2026-07-13"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
