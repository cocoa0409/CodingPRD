endpoints:
  - method: POST
    path: "/wbl/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; the server never falls back to real wall-clock time). Setting the clock also runs the deferred-expiry sweep."
    roles: [WblCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, permits_expired_count: integer, agreements_expired_count: integer, outcomes_late_unverifiable_count: integer }
    side_effects:
      - "sets the logical clock used by every date/timestamp field"
      - "sweep 1: WorkPermit rows with status == ISSUED and expires_on < new clock date move to EXPIRED, flagging their student's PROPOSED/ACTIVE placements"
      - "sweep 2: PartnershipAgreement rows with status == EXECUTED and expires_on < new clock date move to EXPIRED, flagging their ACTIVE placements"
      - "sweep 3: PlacementOutcome rows with status == RECORDED whose placement completed_on is more than 180 days before the new clock date move to LATE_UNVERIFIABLE"

  - method: POST
    path: "/wbl/employer-partners"
    description: "Recruit an employer partner"
    roles: [WblCoordinator]
    code: 201
    input: [legal_name, naics_code, industry_sector, workers_comp_carrier, workers_comp_policy_no, workers_comp_expires_on]
    output: EmployerPartner
    side_effects:
      - "initialises safety_score = 100 and posture = PROSPECT via calculations.employer_safety_score_posture"
  - method: GET
    path: "/wbl/employer-partners/{employerId}"
    description: "Read an employer partner with its computed safety score and posture"
    roles: [WblCoordinator, SafetyReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: EmployerPartner
    side_effects: []
  - method: GET
    path: "/wbl/employer-partners"
    description: "List employer partners, optionally filtered by posture"
    roles: [WblCoordinator, SafetyReviewer, ComplianceOfficer]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: EmployerPartner[]
    side_effects: []
  - method: PATCH
    path: "/wbl/employer-partners/{employerId}/insurance"
    description: "Update the partner's workers compensation policy facts"
    roles: [WblCoordinator]
    code: 200
    input: [workers_comp_carrier, workers_comp_policy_no, workers_comp_expires_on]
    output: EmployerPartner
    side_effects:
      - "increments EmployerPartner.version by 1"

  - method: POST
    path: "/wbl/worksites"
    description: "Register a worksite under an employer partner"
    roles: [WblCoordinator]
    code: 201
    input: [employer_partner_id, site_name, address_line, hazard_class, has_power_machinery, displaces_paid_employee, max_concurrent_students]
    output: Worksite
    side_effects:
      - "initialises safety_status = UNREVIEWED and slots_committed = 0"
  - method: GET
    path: "/wbl/worksites/{worksiteId}"
    description: "Read a worksite with its derived safety status, expiry and committed slots"
    roles: [WblCoordinator, SafetyReviewer, ComplianceOfficer, EmployerSupervisor]
    code: 200
    input: []
    output: Worksite
    side_effects: []
  - method: GET
    path: "/wbl/employer-partners/{id}/worksites"
    description: "List the worksites of an employer partner"
    roles: [WblCoordinator, SafetyReviewer, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Worksite[]
    side_effects: []

  - method: POST
    path: "/wbl/safety-reviews"
    description: "File a worksite safety review; supersedes the worksite's prior decided review"
    roles: [SafetyReviewer]
    code: 201
    input: [worksite_id, machinery_guarding_ok, hazard_findings_count, orientation_documented, emergency_plan_on_file, expected_worksite_version]
    output: WorksiteSafetyReview
    side_effects:
      - "stores reviewer_user_id from X-User-ID"
      - "moves any earlier APPROVED/CONDITIONAL review on the worksite to SUPERSEDED and resets Worksite.safety_status to UNREVIEWED"
      - "increments Worksite.version by 1"
  - method: POST
    path: "/wbl/safety-reviews/{reviewId}/decision"
    description: "Record the review decision (APPROVED, CONDITIONAL or FAILED) and cascade to the worksite, its employer partner, placements and evaluation cycles"
    roles: [SafetyReviewer]
    code: 200
    input: [decision]
    output: WorksiteSafetyReview
    side_effects:
      - "sets decision_on, expires_on and corrective_actions_due_on per branch"
      - "updates Worksite.safety_status, Worksite.safety_review_expires_on and Worksite.corrective_actions_due_on; increments Worksite.version by 1"
      - "recomputes EmployerPartner.safety_score and EmployerPartner.posture"
      - "on FAILED: BLOCKS the worksite's PROPOSED/ACTIVE placements and SUSPENDS their OPEN/PARTIAL evaluation cycles"
  - method: GET
    path: "/wbl/worksites/{id}/safety-reviews"
    description: "List the safety reviews filed against a worksite, newest created_at first"
    roles: [WblCoordinator, SafetyReviewer, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: WorksiteSafetyReview[]
    side_effects: []

  - method: POST
    path: "/wbl/supervisors"
    description: "Register a worksite supervisor who can act as EmployerSupervisor"
    roles: [WblCoordinator]
    code: 201
    input: [worksite_id, full_name, email, training_completed_on, max_student_load]
    output: Supervisor
    side_effects:
      - "initialises active_student_load = 0"
  - method: GET
    path: "/wbl/worksites/{id}/supervisors"
    description: "List the supervisors of a worksite with their current student load"
    roles: [WblCoordinator, ComplianceOfficer, EmployerSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: Supervisor[]
    side_effects: []

  - method: POST
    path: "/wbl/agreements"
    description: "Draft a partnership agreement for a worksite"
    roles: [WblCoordinator]
    code: 201
    input: [employer_partner_id, worksite_id, employer_signer_supervisor_id, effective_on, expires_on, insurance_rider]
    output: PartnershipAgreement
    side_effects:
      - "stores created_by_user_id from X-User-ID and sets status = PENDING_EMPLOYER, revision_round = 0"
  - method: POST
    path: "/wbl/agreements/{agreementId}/employer-sign"
    description: "Employer signer countersigns, moving the agreement to PENDING_DISTRICT"
    roles: [EmployerSupervisor]
    code: 200
    input: []
    output: PartnershipAgreement
    side_effects:
      - "clears change_request_note"
  - method: POST
    path: "/wbl/agreements/{agreementId}/request-changes"
    description: "District returns the agreement to the employer for revision (negotiation cycle, max 3 rounds)"
    roles: [WblCoordinator]
    code: 200
    input: [change_request_note]
    output: PartnershipAgreement
    side_effects:
      - "increments revision_round by 1 and stores change_request_note"
  - method: POST
    path: "/wbl/agreements/{agreementId}/execute"
    description: "District countersigns the agreement; the executing user must differ from the drafting user"
    roles: [WblCoordinator]
    code: 200
    input: []
    output: PartnershipAgreement
    side_effects:
      - "sets executed_by_user_id from X-User-ID and executed_on = clock date"
  - method: POST
    path: "/wbl/agreements/{agreementId}/terminate"
    description: "Terminate an executed agreement and cascade to its placements and their evaluation cycles"
    roles: [WblCoordinator]
    code: 200
    input: [termination_reason]
    output: PartnershipAgreement
    side_effects:
      - "TERMINATES the agreement's PROPOSED/ACTIVE placements, decrementing Worksite.slots_committed, Supervisor.active_student_load and Student.active_placement_count"
      - "CANCELS those placements' OPEN/PARTIAL evaluation cycles"
  - method: GET
    path: "/wbl/agreements/{agreementId}"
    description: "Read a partnership agreement"
    roles: [WblCoordinator, ComplianceOfficer, EmployerSupervisor]
    code: 200
    input: []
    output: PartnershipAgreement
    side_effects: []
  - method: GET
    path: "/wbl/agreements"
    description: "List partnership agreements filtered by employer partner, worksite, employer signer or status"
    roles: [WblCoordinator, ComplianceOfficer, EmployerSupervisor]
    code: 200
    input: ["employer_partner_id?", "worksite_id?", "employer_signer_supervisor_id?", "status?", "limit?", "offset?"]
    output: PartnershipAgreement[]
    side_effects: []
  - method: POST
    path: "/wbl/students"
    description: "Enrol a student in the work-based learning program"
    roles: [WblCoordinator]
    code: 201
    input: [full_name, birth_date, grade_level, gpa, attendance_rate, student_learner_certificate, guardian_consent_on_file]
    output: Student
    side_effects:
      - "derives eligibility_status via calculations.student_eligibility_status"
  - method: PATCH
    path: "/wbl/students/{studentId}/academics"
    description: "Update a student's academic standing, re-deriving eligibility"
    roles: [WblCoordinator]
    code: 200
    input: [grade_level, gpa, attendance_rate]
    output: Student
    side_effects:
      - "re-derives eligibility_status via calculations.student_eligibility_status"
      - "increments Student.version by 1"
  - method: GET
    path: "/wbl/students/{studentId}"
    description: "Read a student with computed eligibility, year-to-date hours, credits and active placement count"
    roles: [WblCoordinator, ComplianceOfficer, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: POST
    path: "/wbl/work-permits"
    description: "Request a work permit for a student"
    roles: [WblCoordinator, ComplianceOfficer]
    code: 201
    input: [student_id, permit_class, hazardous_endorsement]
    output: WorkPermit
    side_effects:
      - "sets status = REQUESTED"
  - method: POST
    path: "/wbl/work-permits/{permitId}/issue"
    description: "Issue a requested work permit"
    roles: [ComplianceOfficer]
    code: 200
    input: [expires_on]
    output: WorkPermit
    side_effects:
      - "sets issued_on = clock date, expires_on and issued_by_user_id from X-User-ID"
  - method: POST
    path: "/wbl/work-permits/{permitId}/revoke"
    description: "Revoke an issued permit; flags the student's open placements"
    roles: [ComplianceOfficer]
    code: 200
    input: [revoked_reason]
    output: WorkPermit
    side_effects:
      - "sets compliance_status = FLAGGED on the student's PROPOSED/ACTIVE placements whose compliance_status IN {PENDING_REVIEW, CLEARED}"
  - method: GET
    path: "/wbl/students/{id}/work-permits"
    description: "List a student's work permits"
    roles: [WblCoordinator, ComplianceOfficer, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: WorkPermit[]
    side_effects: []

  - method: POST
    path: "/wbl/placements"
    description: "Create a placement for a student at a worksite under an executed agreement"
    roles: [WblCoordinator]
    code: 201
    input: [student_id, worksite_id, agreement_id, supervisor_id, "supersedes_placement_id?", pay_classification, "hourly_wage_cents?", "stipend_total_cents?", scheduled_weekly_hours, start_on, end_on, credit_target_credits, credit_award_mode, "required_evaluation_cycles?", transportation_mode, "commute_round_trip_miles?", expected_worksite_version]
    output: Placement
    side_effects:
      - "derives student_age_at_start and permit_class_at_start from Student.birth_date and start_on"
      - "sets lifecycle_status = PROPOSED and compliance_status = PENDING_REVIEW"
      - "increments Worksite.slots_committed by 1, Supervisor.active_student_load by 1 and Student.active_placement_count by 1"
      - "increments Worksite.version by 1"
  - method: POST
    path: "/wbl/placements/{placementId}/activate"
    description: "Activate a proposed placement whose compliance clearance arrived after plan approval"
    roles: [WblCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "creates EvaluationCycle cycle_index 1 when the placement has none"
  - method: POST
    path: "/wbl/placements/{placementId}/terminate"
    description: "Terminate a proposed or active placement and release its committed capacity"
    roles: [WblCoordinator]
    code: 200
    input: [termination_reason]
    output: Placement
    side_effects:
      - "decrements Worksite.slots_committed by 1, Supervisor.active_student_load by 1 and Student.active_placement_count by 1"
      - "CANCELS the placement's OPEN/PARTIAL/SUSPENDED evaluation cycles"
  - method: POST
    path: "/wbl/placements/{placementId}/complete"
    description: "Complete an active placement once its required evaluation cycles are closed"
    roles: [WblCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "sets completed_on = clock date"
      - "decrements Worksite.slots_committed by 1, Supervisor.active_student_load by 1 and Student.active_placement_count by 1"
      - "CANCELS remaining OPEN/PARTIAL evaluation cycles"
  - method: POST
    path: "/wbl/placements/{placementId}/compliance-decision"
    description: "Compliance officer moves the placement's compliance dimension: CLEAR (FLAGGED -> CLEARED), FLAG (CLEARED -> FLAGGED) or UNBLOCK (BLOCKED -> FLAGGED)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, note]
    output: Placement
    side_effects:
      - "on UNBLOCK: re-derives the placement's SUSPENDED evaluation cycles back to OPEN or PARTIAL from their two dimensions"
  - method: POST
    path: "/wbl/placements/{placementId}/settle-wages"
    description: "Freeze the placement's wage figure using the PROVISIONAL or FINAL variant of calculations.wage_settlement"
    roles: [WblCoordinator]
    code: 200
    input: [mode]
    output: Placement
    side_effects:
      - "sets settled_wage_cents and wage_settlement_mode"
      - "on mode == FINAL: adds settled_wage_cents to EmployerPartner.wage_liability_cents"
  - method: POST
    path: "/wbl/placements/{placementId}/award-credit"
    description: "Award academic credit per calculations.academic_credit_award; the acting user must differ from the training plan approver"
    roles: [WblCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "sets credits_awarded and credit_awarded_by_user_id from X-User-ID"
      - "adds credits_awarded to Student.credits_earned_wbl"
  - method: GET
    path: "/wbl/placements/{placementId}"
    description: "Read a placement with both state dimensions, the hour ledger and both wage variants"
    roles: [WblCoordinator, ComplianceOfficer, EmployerSupervisor, Student]
    code: 200
    input: []
    output: Placement
    side_effects: []
  - method: GET
    path: "/wbl/placements"
    description: "List placements filtered by student, worksite, agreement, supervisor, superseded predecessor, lifecycle or compliance state"
    roles: [WblCoordinator, ComplianceOfficer, EmployerSupervisor]
    code: 200
    input: ["student_id?", "worksite_id?", "agreement_id?", "supervisor_id?", "supersedes_placement_id?", "lifecycle_status?", "compliance_status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []
  - method: GET
    path: "/wbl/placements/{placementId}/wage-preview"
    description: "Computed read: both variants of calculations.wage_settlement and their divergence, where variance_cents = provisional_wage_cents - final_wage_cents"
    roles: [WblCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: { provisional_wage_cents: integer, final_wage_cents: integer, variance_cents: integer, total_verified_hours: number, logged_entry_count: integer }
    side_effects: []
  - method: GET
    path: "/wbl/placements/{placementId}/credit-preview"
    description: "Computed read: the credit figure both variants of calculations.academic_credit_award would award"
    roles: [WblCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: { hours_based_credits: number, competency_based_credits: number, mean_competency_score: number, closed_cycle_count: integer, credit_eligible: boolean }
    side_effects: []
  - method: GET
    path: "/wbl/placements/{placementId}/reimbursement"
    description: "Computed read: transportation and supervisor-stipend reimbursement with the tiered admin fee from calculations.reimbursement_admin_fee"
    roles: [WblCoordinator]
    code: 200
    input: []
    output: { transport_cents: integer, stipend_cents: integer, subtotal_cents: integer, tier: string, admin_fee_cents: integer, total_cents: integer, logged_days: integer }
    side_effects: []
  - method: POST
    path: "/wbl/training-plans"
    description: "Draft a training plan for a placement; supersedes any earlier plan on the same placement"
    roles: [WblCoordinator]
    code: 201
    input: [placement_id, course_code, credit_hours_target, expected_placement_version]
    output: TrainingPlan
    side_effects:
      - "sets status = DRAFT, revision_round = 0, objective_count = 0"
      - "moves any earlier plan on the placement to SUPERSEDED"
      - "increments Placement.version by 1"
  - method: POST
    path: "/wbl/training-plans/{planId}/submit"
    description: "Submit the plan for district review; requires at least three aligned learning objectives"
    roles: [WblCoordinator]
    code: 200
    input: []
    output: TrainingPlan
    side_effects:
      - "sets submitted_at = clock timestamp"
  - method: POST
    path: "/wbl/training-plans/{planId}/request-changes"
    description: "Return the plan for revision (revision cycle, max 3 rounds)"
    roles: [ComplianceOfficer]
    code: 200
    input: [change_request_note]
    output: TrainingPlan
    side_effects:
      - "increments revision_round by 1 and stores change_request_note"
  - method: POST
    path: "/wbl/training-plans/{planId}/approve"
    description: "Approve the plan; cascades to the placement's compliance dimension, auto-activation and first evaluation cycle"
    roles: [WblCoordinator]
    code: 200
    input: []
    output: TrainingPlan
    side_effects:
      - "sets approved_by_user_id from X-User-ID and approved_at = clock timestamp"
      - "hop 2: Placement.compliance_status PENDING_REVIEW -> CLEARED"
      - "hop 3: Placement.lifecycle_status PROPOSED -> ACTIVE, which creates EvaluationCycle cycle_index 1"
      - "increments Placement.version by 1"
  - method: GET
    path: "/wbl/training-plans/{planId}"
    description: "Read a training plan with its objective counts and revision round"
    roles: [WblCoordinator, ComplianceOfficer, EmployerSupervisor]
    code: 200
    input: []
    output: TrainingPlan
    side_effects: []
  - method: GET
    path: "/wbl/placements/{id}/training-plans"
    description: "List the training plans of a placement, newest created_at first"
    roles: [WblCoordinator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: TrainingPlan[]
    side_effects: []

  - method: POST
    path: "/wbl/learning-objectives"
    description: "Add a learning objective to a DRAFT or CHANGES_REQUESTED training plan"
    roles: [WblCoordinator]
    code: 201
    input: [training_plan_id, competency_code, description, aligned_course_code, assessment_method]
    output: LearningObjective
    side_effects:
      - "increments TrainingPlan.objective_count, and aligned_objective_count when aligned_course_code == TrainingPlan.course_code"
      - "increments TrainingPlan.version by 1"
  - method: GET
    path: "/wbl/training-plans/{id}/objectives"
    description: "List the learning objectives of a training plan"
    roles: [WblCoordinator, ComplianceOfficer, EmployerSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: LearningObjective[]
    side_effects: []

  - method: POST
    path: "/wbl/timesheet-entries"
    description: "Supervisor logs a shift against an active placement; gated by calculations.child_labor_hour_ledger"
    roles: [EmployerSupervisor]
    code: 201
    input: [placement_id, work_date, start_time, end_time, break_minutes, is_school_day]
    output: TimesheetEntry
    side_effects:
      - "computes hours_worked and sets status = LOGGED"
      - "recomputes Placement.total_verified_hours, Placement.provisional_wage_cents, Placement.final_wage_cents and Student.ytd_wbl_hours"
  - method: POST
    path: "/wbl/timesheet-entries/{entryId}/void"
    description: "Void a logged shift; the compensating action must restore every hour-derived ledger"
    roles: [WblCoordinator]
    code: 200
    input: [voided_reason]
    output: TimesheetEntry
    side_effects:
      - "sets status = VOIDED and voided_by_user_id from X-User-ID"
      - "recomputes Placement.total_verified_hours, Placement.provisional_wage_cents, Placement.final_wage_cents and Student.ytd_wbl_hours"
  - method: GET
    path: "/wbl/placements/{id}/timesheet-entries"
    description: "List a placement's timesheet entries, work_date ASC then created_at ASC"
    roles: [WblCoordinator, ComplianceOfficer, EmployerSupervisor, Student]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TimesheetEntry[]
    side_effects: []

  - method: POST
    path: "/wbl/evaluation-cycles/{cycleId}/evaluation"
    description: "Supervisor submits the cycle's five ratings (parallel dimension 1)"
    roles: [EmployerSupervisor]
    code: 200
    input: [rating_technical, rating_communication, rating_reliability, rating_safety, rating_initiative]
    output: EvaluationCycle
    side_effects:
      - "sets supervisor_eval_status = SUBMITTED and computes competency_score"
      - "re-derives cycle_status; closes the cycle when the reflection is already ACCEPTED"
  - method: POST
    path: "/wbl/evaluation-cycles/{cycleId}/reflection"
    description: "Student submits or resubmits the cycle reflection (parallel dimension 2)"
    roles: [Student]
    code: 200
    input: [reflection_text]
    output: EvaluationCycle
    side_effects:
      - "sets reflection_status = SUBMITTED and stores reflection_text"
      - "re-derives cycle_status"
  - method: POST
    path: "/wbl/evaluation-cycles/{cycleId}/reflection-decision"
    description: "Coordinator accepts or returns the reflection; acceptance can close the cycle and spawn the next one"
    roles: [WblCoordinator]
    code: 200
    input: [decision, feedback_note]
    output: EvaluationCycle
    side_effects:
      - "on RETURN: sets reflection_status = RETURNED and increments reflection_returned_count"
      - "on ACCEPT with supervisor_eval_status == SUBMITTED: sets cycle_status = CLOSED, closed_on = clock date, increments Placement.closed_cycle_count and creates the next cycle when more are required"
  - method: GET
    path: "/wbl/placements/{id}/evaluation-cycles"
    description: "List a placement's evaluation cycles, cycle_index ASC — the only discovery channel for cascade-created cycles"
    roles: [WblCoordinator, ComplianceOfficer, EmployerSupervisor, Student]
    code: 200
    input: ["cycle_status?", "limit?", "offset?"]
    output: EvaluationCycle[]
    side_effects: []

  - method: POST
    path: "/wbl/incident-reports"
    description: "Report a worksite incident against an active placement"
    roles: [WblCoordinator, EmployerSupervisor, Student]
    code: 201
    input: [placement_id, worksite_id, occurred_at, severity, description, injury_type]
    output: IncidentReport
    side_effects:
      - "stores reported_by_user_id from X-User-ID and sets status = REPORTED, coverage_determination = PENDING"
  - method: POST
    path: "/wbl/incident-reports/{incidentId}/finding"
    description: "Record the investigation finding; SUBSTANTIATED cascades to the employer score, worksite, placements and evaluation cycles"
    roles: [ComplianceOfficer]
    code: 200
    input: [finding]
    output: IncidentReport
    side_effects:
      - "on SUBSTANTIATED: increments the partner's substantiated_<severity>_count and recomputes safety_score / posture"
      - "on SUBSTANTIATED with severity == CRITICAL: Worksite.safety_status -> FAILED, EmployerPartner.posture -> SUSPENDED, the worksite's PROPOSED/ACTIVE placements -> BLOCKED, their OPEN/PARTIAL cycles -> SUSPENDED"
      - "on SUBSTANTIATED with severity IN {MINOR, MODERATE}: the worksite's PROPOSED/ACTIVE placements with compliance_status IN {PENDING_REVIEW, CLEARED} -> FLAGGED"
      - "on UNSUBSTANTIATED: sets coverage_determination = NOT_COVERED and closed_on = clock date with no score or placement change"
  - method: POST
    path: "/wbl/incident-reports/{incidentId}/coverage"
    description: "Record the insurance coverage determination per calculations.insurance_coverage_determination and close the incident"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "sets coverage_determination, determined_by_user_id from X-User-ID and closed_on = clock date"
  - method: GET
    path: "/wbl/incident-reports/{incidentId}"
    description: "Read an incident report with its finding, coverage determination and OSHA recordability"
    roles: [WblCoordinator, ComplianceOfficer, SafetyReviewer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/wbl/incident-reports"
    description: "List incident reports filtered by placement, worksite, status or severity"
    roles: [WblCoordinator, ComplianceOfficer, SafetyReviewer]
    code: 200
    input: ["placement_id?", "worksite_id?", "status?", "severity?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []

  - method: POST
    path: "/wbl/placement-outcomes"
    description: "Record the post-placement destination of a completed placement"
    roles: [WblCoordinator]
    code: 201
    input: [placement_id, outcome_type, "employer_name?", "institution_name?", verification_source]
    output: PlacementOutcome
    side_effects:
      - "sets recorded_on = clock date, status = RECORDED and computes days_since_completion"
  - method: POST
    path: "/wbl/placement-outcomes/{outcomeId}/verify"
    description: "Verify a recorded outcome against documentary evidence"
    roles: [WblCoordinator]
    code: 200
    input: []
    output: PlacementOutcome
    side_effects:
      - "sets verified_on = clock date and re-derives counts_positive"
  - method: GET
    path: "/wbl/placements/{id}/outcomes"
    description: "List the outcomes recorded for a placement"
    roles: [WblCoordinator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PlacementOutcome[]
    side_effects: []

  - method: GET
    path: "/wbl/reports/outcome-rate"
    description: "Computed read: positive outcome rate for placements completed inside an inclusive date window, per calculations.outcome_rate"
    roles: [WblCoordinator, ComplianceOfficer]
    code: 200
    input: [from_date, to_date]
    output: { numerator: integer, denominator: integer, positive_rate: number }
    side_effects: []
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the called endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own (supervisor id or student id mismatch)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the user awarding credit is the same user who approved the training plan"
  - id: ERR_SELF_EXECUTION_PROHIBITED
    http: 403
    condition: "the user executing an agreement is the same user who drafted it"
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "employer_partner_id / {employerId} does not resolve"
  - id: ERR_WORKSITE_NOT_FOUND
    http: 404
    condition: "worksite_id / {worksiteId} does not resolve"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "{reviewId} does not resolve"
  - id: ERR_SUPERVISOR_NOT_FOUND
    http: 404
    condition: "supervisor_id / employer_signer_supervisor_id does not resolve"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id / {agreementId} does not resolve"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id / {studentId} does not resolve"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "{permitId} does not resolve"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placement_id / {placementId} / supersedes_placement_id does not resolve"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "training_plan_id / {planId} does not resolve"
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "{entryId} does not resolve"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "{cycleId} does not resolve"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "{incidentId} does not resolve"
  - id: ERR_OUTCOME_NOT_FOUND
    http: 404
    condition: "{outcomeId} does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, unknown enum member, out-of-range number, bad date/time format, end before start, pagination limit outside 1..100"
  - id: ERR_STALE_WORKSITE_VERSION
    http: 412
    condition: "expected_worksite_version does not match the current Worksite.version"
  - id: ERR_STALE_PLACEMENT_VERSION
    http: 412
    condition: "expected_placement_version does not match the current Placement.version"
  - id: ERR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "the agreement is not in the from-state the requested transition needs"
  - id: ERR_REVIEW_ALREADY_DECIDED
    http: 409
    condition: "a decision was already recorded on this safety review"
  - id: ERR_PERMIT_INVALID_STATE
    http: 409
    condition: "issue requires REQUESTED, revoke requires ISSUED"
  - id: ERR_PLAN_INVALID_STATE
    http: 409
    condition: "the training plan is not in the from-state the requested transition needs, or objectives are added to a plan past CHANGES_REQUESTED"
  - id: ERR_PLACEMENT_NOT_ACTIVATABLE
    http: 409
    condition: "activate called on a placement whose lifecycle_status != PROPOSED"
  - id: ERR_PLACEMENT_NOT_ACTIVE
    http: 409
    condition: "timesheet, incident or completion operation on a placement whose lifecycle_status != ACTIVE"
  - id: ERR_PLACEMENT_NOT_COMPLETED
    http: 409
    condition: "wage settlement, credit award or outcome recording on a placement whose lifecycle_status != COMPLETED"
  - id: ERR_PLACEMENT_COMPLIANCE_BLOCKED
    http: 409
    condition: "the placement's compliance dimension is BLOCKED, barring hour logging, evaluation, completion, settlement and credit award"
  - id: ERR_CYCLE_INVALID_STATE
    http: 409
    condition: "the addressed evaluation-cycle dimension is not writable in the cycle's current compound state"
  - id: ERR_INCIDENT_INVALID_STATE
    http: 409
    condition: "finding requires REPORTED, coverage requires SUBSTANTIATED"
  - id: ERR_OUTCOME_INVALID_STATE
    http: 409
    condition: "verify called on an outcome whose status != RECORDED"
  - id: ERR_WAGES_ALREADY_SETTLED
    http: 409
    condition: "settle-wages called twice on the same placement"
  - id: ERR_CREDIT_ALREADY_AWARDED
    http: 409
    condition: "award-credit called twice on the same placement"
  - id: ERR_AGREEMENT_NOT_EXECUTED
    http: 409
    condition: "the referenced partnership agreement has not reached EXECUTED"
  - id: ERR_WORKSITE_SAFETY_NOT_CURRENT
    http: 422
    condition: "the worksite has no current APPROVED/CONDITIONAL safety review, or its clearance has expired"
  - id: ERR_EMPLOYER_POSTURE_SUSPENDED
    http: 422
    condition: "the employer partner's posture is SUSPENDED"
  - id: ERR_GUARDIAN_CONSENT_MISSING
    http: 422
    condition: "the student has no guardian consent on file"
  - id: ERR_WORK_PERMIT_INVALID
    http: 422
    condition: "no ISSUED, unexpired work permit matching the placement's permit band exists for the student"
  - id: ERR_HAZARDOUS_OCCUPATION_PROHIBITED
    http: 422
    condition: "a minor is placed at a worksite whose hazard_class is PROHIBITED_HAZARD"
  - id: ERR_HAZARDOUS_ENDORSEMENT_MISSING
    http: 422
    condition: "a minor is placed at a LIMITED_HAZARD or power-machinery worksite without a hazardous_endorsement permit"
  - id: ERR_SUPERVISOR_TRAINING_EXPIRED
    http: 422
    condition: "the supervisor's mentor training is more than 365 days old"
  - id: ERR_NIGHT_WORK_PROHIBITED
    http: 422
    condition: "the shift starts before the band's earliest hour or ends after its night cutoff"
  - id: ERR_DAILY_HOUR_CAP_EXCEEDED
    http: 422
    condition: "the candidate shift pushes the student's same-day LOGGED hours above the band's daily cap"
  - id: ERR_WEEKLY_HOUR_CAP_EXCEEDED
    http: 422
    condition: "the candidate shift pushes the student's Sunday-start-week LOGGED hours above the band's weekly cap"
  - id: ERR_WORKERS_COMP_LAPSED
    http: 422
    condition: "the employer partner's workers compensation policy expired before the clock date"
  - id: ERR_WORK_DATE_OUTSIDE_PLACEMENT
    http: 422
    condition: "work_date falls outside the placement's [start_on, end_on] window"
  - id: ERR_WORK_DATE_IN_FUTURE
    http: 422
    condition: "work_date is after the logical clock date"
  - id: ERR_STUDENT_SCHEDULE_OVERLAP
    http: 422
    condition: "the candidate shift collides with another LOGGED shift of the same student, including the 30-minute cross-worksite travel buffer"
  - id: ERR_PLACEMENT_WINDOW_INVALID
    http: 422
    condition: "the placement window is inverted or falls outside the agreement's effective window"
  - id: ERR_WORKSITE_CAPACITY_EXCEEDED
    http: 422
    condition: "overlapping PROPOSED/ACTIVE placements at the worksite would exceed max_concurrent_students"
  - id: ERR_OUTCOME_WINDOW_CLOSED
    http: 422
    condition: "the outcome is recorded more than 180 days after the placement's completed_on"
  - id: ERR_SUPERVISOR_WORKSITE_MISMATCH
    http: 422
    condition: "the supervisor does not belong to the worksite named by the placement or agreement"
  - id: ERR_AGREEMENT_WORKSITE_MISMATCH
    http: 422
    condition: "the agreement's worksite differs from the placement's worksite, or the incident's worksite differs from the placement's worksite"
  - id: ERR_SUPERVISOR_LOAD_EXCEEDED
    http: 422
    condition: "the supervisor already holds max_student_load PROPOSED/ACTIVE placements"
  - id: ERR_STUDENT_INELIGIBLE
    http: 422
    condition: "the student's eligibility_status is not ELIGIBLE"
  - id: ERR_LEARNING_OBJECTIVES_INSUFFICIENT
    http: 422
    condition: "the training plan carries fewer than three learning objectives at submit time"
  - id: ERR_CREDIT_ALIGNMENT_MISSING
    http: 422
    condition: "fewer than three of the plan's objectives align to the plan's course_code"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 422
    condition: "a revision loop has consumed its cap: agreement or plan revision_round == 3, or reflection_returned_count == 2"
  - id: ERR_EVALUATION_CYCLES_INCOMPLETE
    http: 422
    condition: "fewer CLOSED evaluation cycles than required_evaluation_cycles at completion time"
  - id: ERR_WAGE_BELOW_MINIMUM
    http: 422
    condition: "a PAID placement pays below 1500 cents, or below 1275 cents with a student-learner certificate"
  - id: ERR_UNPAID_CLASSIFICATION_INVALID
    http: 422
    condition: "UNPAID placement at a worksite that displaces a paid employee or with a non-zero wage, or STIPEND placement without a stipend"
  - id: ERR_WAGE_SETTLEMENT_NOT_READY
    http: 422
    condition: "settle-wages called on a PAID placement with no LOGGED timesheet entries"

