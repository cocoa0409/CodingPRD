    side_effects: []

  - method: POST
    path: "/packaway-holds/{id}/aging-review"
    description: "Run an aging review on an eligible hold; decision variants keep/release/liquidate. trigger_reason enum: AGING_THRESHOLD (STORED -> AGING_REVIEW), DECISION_KEEP (AGING_REVIEW -> STORED), DECISION_RELEASE (AGING_REVIEW -> RELEASED), DECISION_LIQUIDATE (AGING_REVIEW -> LIQUIDATED)"
    roles: [InventoryPlanner]
    code: 200
    input: [trigger_reason]
    output: PackawayHold
    side_effects: ["calculation holding_cost_accrual", "review_count += 1", "PackawayHold.version += 1", "DECISION_LIQUIDATE creates a DRAFT LiquidationOrder"]

  - method: POST
    path: "/packaway-holds/{id}/liquidate"
    description: "Directly liquidate a STALE hold (STORED with age_bucket == STALE) without an intervening aging review"
    roles: [InventoryPlanner]
    code: 200
    input: []
    output: PackawayHold
    side_effects: ["calculation holding_cost_accrual (final)", "creates a DRAFT LiquidationOrder (reason PACKAWAY_STALE)", "PackawayHold.version += 1"]

  - method: POST
    path: "/packaway-holds/{id}/release"
    description: "Release a hold within its window; OCC on the hold"
    roles: [InventoryPlanner]
    code: 200
    input: [expected_hold_version]
    output: PackawayHold
    side_effects: ["calculation holding_cost_accrual (final)", "release_date = today", "PackawayHold.version += 1"]

