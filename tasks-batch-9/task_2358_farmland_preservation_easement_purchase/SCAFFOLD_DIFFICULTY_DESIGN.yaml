            - "Application.${app_a_id}.negotiation_round_count == 3"
            - "Application.${app_a_id}.status == COUNTERED"
            - "Application.${app_a_id}.current_offer_cents == 170000000"
            - "Application.${app_a_id}.last_counter_cents == 175000000"
            - "GET /applications/${app_a_id}/negotiation-rounds returns total_count == 6"
            - "the negotiation-round kinds in round_index order 1..6 are OFFER, COUNTER, OFFER, COUNTER, OFFER, COUNTER"
            - "GET /applications/${app_a_id}/negotiation-rounds?kind=OFFER returns total_count == 3 with amount_cents 150000000, 162000000, 170000000"
            - "the state OFFER_ISSUED was occupied three separate times and COUNTERED three separate times, so the COUNTERED -> OFFER_ISSUED edge was traversed twice"
