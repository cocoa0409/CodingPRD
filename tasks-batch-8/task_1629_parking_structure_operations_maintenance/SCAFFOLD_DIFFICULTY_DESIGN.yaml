      - Auto-created incident for ${rec1} has severity MEDIUM (ABS 2000 < 10000) and auto_created == true
      - 'ReconciliationRecord.${rec2}: variance_cents == -1999 (counted 8501 - expected 10500) and reconciliation_status == SUBMITTED (inside threshold; -1999 > -2000)'
      - 'After approve: reconciliation ${rec2} APPROVED and AttendantShift.${sh2}.shift_status == RECONCILED'
  - name: monthly_pool_activation_at_capacity_rejected
    grounds:
    - calculations.monthly_pool_availability
    - validations[priority=30]
    - errors[ERR_MONTHLY_POOL_EXHAUSTED]
    distinguishing_aspect: 'Metric agreement count on the activate endpoint: with monthly_capacity 2 and

      exactly 2 ACTIVE, activating a third APPROVED agreement fails with

