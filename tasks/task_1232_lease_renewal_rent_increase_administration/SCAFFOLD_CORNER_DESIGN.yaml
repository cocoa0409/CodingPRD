      - name: approve_denied_concession_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ConcessionApproval, "errors[ERR_CONCESSION_NOT_SUBMITTED]"]
        distinguishing_aspect: "DENIED is terminal: approving a denied concession fails with ERR_CONCESSION_NOT_SUBMITTED even though the offer is still COUNTERED (the offer-side gate passes, the concession-side gate fires)."
        test_recipe:
          setup: ["offer BALANCED 210800 issued, countered 205000; concession SUBMITTED then DENIED by user_pm_1"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
