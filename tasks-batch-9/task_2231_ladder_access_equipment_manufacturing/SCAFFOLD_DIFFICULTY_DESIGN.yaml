      - 'after quarantine: ProductionLot.${l1}.status == QUARANTINED'
      - 'after quarantine: ProductionLot.${l1}.units_quarantined == 400 and units_released == 0 and units_wip == 0 and units_scrapped == 0'
      - 'after quarantine: units_wip + units_quarantined + units_released + units_scrapped == 400'
      - 'after quarantine: ProductionLot.${l1}.quarantine_reason_code == LABEL_DEFECT'
      - 'after disposition: ProductionLot.${l1}.status == RELEASED'
      - 'after disposition: ProductionLot.${l1}.units_released == 400 and units_quarantined == 0 and units_wip == 0 and units_scrapped == 0'
      - 'after disposition: units_wip + units_quarantined + units_released + units_scrapped == 400'
      - 'after disposition: ProductionLot.${l1}.disposition == RELEASE'
      - ProductionLot.${l1}.released_at == 2026-08-01T00:00:00Z (unchanged by the compensating move)
      - ProductionLot.${l1}.produced_units == 400 throughout
  - name: bench_minutes_conserved_across_consume_and_cancel
    grounds:
    - entities.TestBench.fields.reserved_minutes_total
    - entities.BenchReservation.fields.duration_minutes
    - state_machines.BenchReservation.HELD_to_CONSUMED
    - state_machines.BenchReservation.HELD_to_CANCELLED
    - endpoints[POST /ladder-ops/bench-reservations/{id}/cancel]
    distinguishing_aspect: 'Conserved quantity 2 — BENCH MINUTES, a different ledger from the lot unit count: reserved_minutes_total must always equal the sum of duration_minutes over reservations with
      status IN {HELD, CONSUMED}, so consuming res1 leaves 360 unchanged while cancelling res2 compensates back to 240.'
    test_recipe:
      setup:
      - TestBench BENCH-1 has cooldown_minutes 60 and reserved_minutes_total 360.
      - Reservation res1 (240 minutes, 2026-08-03T08:00:00Z .. 12:00:00Z) is HELD for the DESIGN_QUALIFICATION campaign.
      - Reservation res2 (120 minutes, 2026-08-04T08:00:00Z .. 10:00:00Z) is HELD for the INCIDENT_INVESTIGATION campaign.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/test-benches
        payload:
          bench_code: BENCH-1
          max_load_capacity_lb: 5000
          cooldown_minutes: 60
        as: TestLabTechnician
        captures:
          b1: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: DESIGN_QUALIFICATION
        as: TestLabTechnician
        captures:
          c1: $.data.id
      - call: POST /ladder-ops/bench-reservations
        payload:
          test_bench_id: ${b1}
          test_campaign_id: ${c1}
          start_at: '2026-08-03T08:00:00Z'
          end_at: '2026-08-03T12:00:00Z'
        as: TestLabTechnician
        captures:
          res1: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: INCIDENT_INVESTIGATION
        as: TestLabTechnician
        captures:
          c2: $.data.id
      - call: POST /ladder-ops/bench-reservations
        payload:
          test_bench_id: ${b1}
          test_campaign_id: ${c2}
          start_at: '2026-08-04T08:00:00Z'
          end_at: '2026-08-04T10:00:00Z'
        as: TestLabTechnician
        captures:
          res2: $.data.id
      trigger:
      - call: POST /ladder-ops/test-campaigns/${c1}/start
        payload:
          bench_reservation_id: ${res1}
        as: TestLabTechnician
      - call: POST /ladder-ops/bench-reservations/${res2}/cancel
        payload: {}
        as: TestLabTechnician
      assert:
      - 'before the trigger: TestBench.${b1}.reserved_minutes_total == 360'
      - 'after start: BenchReservation.${res1}.status == CONSUMED'
      - 'after start: TestBench.${b1}.reserved_minutes_total == 360 (HELD -> CONSUMED conserves the ledger)'
      - 'after cancel: BenchReservation.${res2}.status == CANCELLED'
      - 'after cancel: TestBench.${b1}.reserved_minutes_total == 240'
      - 'after cancel: TestBench.${b1}.reserved_minutes_total == BenchReservation.${res1}.duration_minutes == 240'
      - TestCampaign.${c1}.status == IN_PROGRESS and started_at == 2026-08-01T00:00:00Z
