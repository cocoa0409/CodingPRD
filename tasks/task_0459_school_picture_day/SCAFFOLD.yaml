# =============================================================================
# Scaffold: School Picture Day & Photography (Lifetouch style)
# task_0459_school_picture_day
# =============================================================================

scenario: |
  459. School Picture Day & Photography (Lifetouch style): school/session
  scheduling & roster, photo capture & student match (ID), package/print catalog
  & order, retouch & retake day, online gallery & access code,
  fundraising/commission to school, yearbook image export, shipping/distribution

domain_name: school-picture-day
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation        # provisional vs final school commission
    - cascading_side_effects          # retake cascade across RetouchOrder / Photo
    - derived_field_reconciliation    # session ledgers (commission, retouch budget) vs source orders
    - optimistic_concurrency          # settle reconciliation race on PictureDaySession.version

  entity_topology: flat
  # All entities are peer collections under /api with foreign-key references in
  # request bodies and list filters; no entity nesting in URL paths.

  state_machine_shape: branching
  # PhotoOrder branches SUBMITTED -> {PAID, REJECTED}; Photo cycles
  # MATCHED -> RETAKE_REQUESTED -> MATCHED (revert) / -> RETAKEN; PictureDaySession
  # is a compound posture gating child operations.

  relationship_patterns:
    - one_to_many        # session -> students/photos/backdrops; order -> lines
    - cross_aggregate    # PhotoOrder -> Student; RetouchOrder -> Photo; Shipment -> PhotoOrder
    - self_referential   # Photo.retake_of_photo_id -> Photo.id (retake lineage)

  role_model: peer_roles
  # SchoolCoordinator owns session/roster/catalog/scheduling/approval/settle;
  # StudioPhotographer owns capture/match/retouch/retake; FulfillmentClerk owns
  # payment/shipping; Guardian (entity_backed Student) orders & views gallery.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PictureDaySession
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: school_name, type: string, source: input, description: "Name of the school" }
      - { name: scheduled_date, type: datetime, source: input, description: "ISO 8601 UTC date the picture day is scheduled for" }
      - { name: gallery_access_code, type: string, source: system, description: "Opaque code guardians use to open the online gallery; minted on transition to GALLERY_OPEN, null before" }
      - { name: gallery_opens_at, type: datetime, source: system, description: "ISO 8601 UTC instant the gallery became viewable; set on transition to GALLERY_OPEN" }
      - { name: gallery_closes_at, type: datetime, source: input, description: "ISO 8601 UTC instant after which the access code no longer grants gallery access" }
      - { name: retouch_budget_cents, type: integer, source: input, description: "Total studio retouch credit allocated for this session, in cents", constraints: ">= 0" }
      - { name: retouch_credit_balance_cents, type: integer, source: computed, description: "Remaining retouch credit = retouch_budget_cents minus sum of net_cost_cents over RetouchOrder rows in {APPROVED, DONE}; recomputed on every retouch mutation" }
      - { name: school_commission_balance_cents, type: integer, source: computed, description: "Provisional commission accrued to the school from PAID PhotoOrders; reconciled to the final value on SETTLED. See calculations.provisional_school_commission / final_school_commission" }
      - { name: total_merchandise_cents, type: integer, source: computed, description: "Sum of merchandise_cents over all PhotoOrder rows in {PAID, FULFILLED}; the commission gross" }
      - { name: status, type: enum, source: system, description: "Lifecycle posture gating child ops", constraints: "DRAFT | ROSTER_LOCKED | CAPTURE_OPEN | GALLERY_OPEN | ORDERING_CLOSED | SETTLED | CANCELLED" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: picture_day_session_id, type: string, source: input, description: "FK -> PictureDaySession.id; the session this roster entry belongs to" }
      - { name: guardian_user_id, type: string, source: input, description: "Opaque guardian identifier; the X-User-ID a Guardian presents to order for / view this student" }
      - { name: full_name, type: string, source: input, description: "Student full name; used by the match scorer" }
      - { name: grade, type: string, source: input, description: "Grade label, e.g. '5'; used by the match scorer" }
      - { name: homeroom, type: string, source: input, description: "Homeroom label, e.g. 'R-204'; used by the match scorer" }
      - { name: status, type: enum, source: system, description: "Roster row state", constraints: "ENROLLED | PHOTOGRAPHED | ABSENT" }

  - name: Photo
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: picture_day_session_id, type: string, source: input, description: "FK -> PictureDaySession.id; the session this photo was captured in" }
      - { name: matched_student_id, type: string, source: system, description: "FK -> Student.id; the student this photo is matched to, null until matched" }
      - { name: retake_of_photo_id, type: string, source: system, description: "FK -> Photo.id; set when this photo supersedes an earlier RETAKE_REQUESTED photo, else null" }
      - { name: candidate_grade, type: string, source: input, description: "Grade label captured off the slate at shoot time; fed to the match scorer" }
      - { name: candidate_homeroom, type: string, source: input, description: "Homeroom label captured off the slate at shoot time; fed to the match scorer" }
      - { name: candidate_name, type: string, source: input, description: "Name captured off the slate at shoot time; fed to the match scorer" }
      - { name: match_confidence_score, type: integer, source: computed, description: "0..100 weighted score against the chosen Student candidate; see calculations.match_confidence_score", default: 0 }
      - { name: yearbook_exported, type: boolean, source: computed, description: "True once this photo has been included in a yearbook export batch", default: false }
      - { name: status, type: enum, source: system, description: "Photo lifecycle", constraints: "UNMATCHED | MATCHED | RETAKE_REQUESTED | RETAKEN | APPROVED" }

  - name: PackageItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: picture_day_session_id, type: string, source: input, description: "FK -> PictureDaySession.id; the session whose catalog this item belongs to" }
      - { name: sku, type: string, source: input, description: "Catalog SKU, unique within a session" }
      - { name: name, type: string, source: input, description: "Display name, e.g. 'Deluxe Package'" }
      - { name: tier, type: enum, source: input, description: "Catalog tier", constraints: "BASIC | DELUXE | PREMIUM" }
      - { name: base_price_cents, type: integer, source: input, description: "Unit price in cents", constraints: "> 0" }
      - { name: active, type: boolean, source: input, description: "Whether the item may be added to new orders", default: true }

  - name: PhotoOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: picture_day_session_id, type: string, source: input, description: "FK -> PictureDaySession.id; the session this order is placed against" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student the order is for" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of OrderLine.line_total_cents before discount; see calculations.order_total", default: 0 }
      - { name: discount_pct, type: number, source: computed, description: "Volume discount fraction selected by subtotal tier; see calculations.order_total", default: 0 }
      - { name: discount_cents, type: integer, source: computed, description: "Discount applied, round_half_up; see calculations.order_total", default: 0 }
      - { name: merchandise_cents, type: integer, source: computed, description: "subtotal_cents minus discount_cents; the commission base, excludes shipping", default: 0 }
      - { name: shipping_cents, type: integer, source: computed, description: "Flat shipping unless merchandise_cents reaches the free-ship threshold; see calculations.order_total", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "merchandise_cents plus shipping_cents; amount due", default: 0 }
      - { name: has_premium_line, type: boolean, source: computed, description: "True if any OrderLine references a PREMIUM-tier PackageItem; gates complimentary retouch", default: false }
      - { name: status, type: enum, source: system, description: "Order lifecycle", constraints: "CART | SUBMITTED | PAID | FULFILLED | REJECTED | CANCELLED" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: photo_order_id, type: string, source: input, description: "FK -> PhotoOrder.id; the order this line belongs to" }
      - { name: package_item_id, type: string, source: input, description: "FK -> PackageItem.id; the catalog item purchased" }
      - { name: quantity, type: integer, source: input, description: "Units of this package", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Snapshot of PackageItem.base_price_cents at add time" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }

  - name: RetouchOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: photo_id, type: string, source: input, description: "FK -> Photo.id; the photo to retouch or retake" }
      - { name: kind, type: enum, source: input, description: "Retouch vs retake-day request", constraints: "RETOUCH | RETAKE" }
      - { name: adjustment_count, type: integer, source: input, description: "Number of retouch adjustments requested", default: 0, constraints: ">= 0" }
      - { name: premium_linked, type: boolean, source: computed, description: "True if the matched student has a PAID PhotoOrder with has_premium_line=true; grants complimentary discount", default: false }
      - { name: gross_cost_cents, type: integer, source: computed, description: "BASE_RETOUCH_FEE + PER_ADJUSTMENT_FEE * adjustment_count; see calculations.retouch_cost" }
      - { name: comp_discount_cents, type: integer, source: computed, description: "Complimentary discount when premium_linked; see calculations.retouch_cost", default: 0 }
      - { name: net_cost_cents, type: integer, source: computed, description: "gross_cost_cents minus comp_discount_cents; debited from session retouch credit on approve" }
      - { name: replacement_photo_id, type: string, source: system, description: "FK -> Photo.id; the new Photo created when a RETAKE completes, else null", default: null }
      - { name: status, type: enum, source: system, description: "Retouch lifecycle", constraints: "REQUESTED | APPROVED | DONE | REJECTED | CANCELLED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: photo_order_id, type: string, source: input, description: "FK -> PhotoOrder.id; the paid order being distributed" }
      - { name: carrier, type: string, source: input, description: "Carrier name" }
      - { name: distribution_method, type: enum, source: input, description: "How prints reach the family", constraints: "SCHOOL_PICKUP | HOME_DELIVERY" }
      - { name: tracking_code, type: string, source: input, description: "Carrier tracking code", default: null }
      - { name: status, type: enum, source: system, description: "Shipment lifecycle", constraints: "PENDING | DISPATCHED | DELIVERED | VOIDED" }

  - name: Backdrop
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: picture_day_session_id, type: string, source: input, description: "FK -> PictureDaySession.id; the session this backdrop belongs to" }
      - { name: label, type: string, source: input, description: "Backdrop label, e.g. 'Blue Marble'" }
      - { name: active, type: boolean, source: input, description: "Whether the backdrop may be booked", default: true }

  - name: Photographer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: picture_day_session_id, type: string, source: input, description: "FK -> PictureDaySession.id; the session this photographer is staffed for" }
      - { name: full_name, type: string, source: input, description: "Photographer name" }

  - name: CaptureSlot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: picture_day_session_id, type: string, source: input, description: "FK -> PictureDaySession.id; the session this slot is scheduled in" }
      - { name: backdrop_id, type: string, source: input, description: "FK -> Backdrop.id; the backdrop resource this slot occupies" }
      - { name: photographer_id, type: string, source: input, description: "FK -> Photographer.id; the photographer resource this slot occupies" }
      - { name: homeroom, type: string, source: input, description: "Homeroom group scheduled into this window" }
      - { name: start_minute, type: integer, source: input, description: "Window start as minutes-since-midnight on scheduled_date", constraints: ">= 0" }
      - { name: end_minute, type: integer, source: input, description: "Window end as minutes-since-midnight; must be > start_minute" }
      - { name: status, type: enum, source: system, description: "Slot lifecycle", constraints: "SCHEDULED | COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PictureDaySession
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ROSTER_LOCKED
        trigger: "POST /api/picture-day-sessions/{id}/lock-roster"
        actor: SchoolCoordinator
        preconditions:
          - "At least one Student exists on the session (else ERR_EMPTY_ROSTER)"
        side_effects:
          - "Roster becomes immutable: no further Student creation against this session"
          - "increments PictureDaySession.version by 1"

      - from: ROSTER_LOCKED
        to: CAPTURE_OPEN
        trigger: "POST /api/picture-day-sessions/{id}/open-capture"
        actor: StudioPhotographer
        preconditions:
          - "At least one PackageItem exists with active=true (else ERR_EMPTY_CATALOG)"
        side_effects:
          - "Photo capture and matching enabled"
          - "increments PictureDaySession.version by 1"

      - from: CAPTURE_OPEN
        to: GALLERY_OPEN
        trigger: "POST /api/picture-day-sessions/{id}/open-gallery"
        actor: SchoolCoordinator
        preconditions:
          - "No Student is in ENROLLED (every roster row is PHOTOGRAPHED or ABSENT) (else ERR_CAPTURE_INCOMPLETE)"
          - "No Photo is in RETAKE_REQUESTED (else ERR_RETAKE_PENDING)"
        side_effects:
          - "gallery_access_code minted"
          - "gallery_opens_at set to current clock"
          - "Ordering enabled for guardians"
          - "increments PictureDaySession.version by 1"

      - from: GALLERY_OPEN
        to: ORDERING_CLOSED
        trigger: "POST /api/picture-day-sessions/{id}/close-ordering"
        actor: SchoolCoordinator
        preconditions:
          - "No PhotoOrder for this session is in SUBMITTED (every submitted order must be PAID or REJECTED) (else ERR_OPEN_ORDERS_EXIST)"
        side_effects:
          - "No new PhotoOrder may be created or submitted"
          - "increments PictureDaySession.version by 1"

      - from: ORDERING_CLOSED
        to: SETTLED
        trigger: "POST /api/picture-day-sessions/{id}/settle"
        actor: SchoolCoordinator
        preconditions:
          - "expected_picture_day_session_version equals PictureDaySession.version (else ERR_STALE_SESSION_VERSION)"
          - "Every PhotoOrder in {PAID} for this session has a Shipment not in VOIDED (else ERR_UNSHIPPED_ORDERS)"
        side_effects:
          - "final_school_commission computed over all {PAID, FULFILLED} orders"
          - "school_commission_balance_cents reconciled from provisional to final (delta applied)"
          - "increments PictureDaySession.version by 1"

      - from: [DRAFT, ROSTER_LOCKED, CAPTURE_OPEN]
        to: CANCELLED
        trigger: "POST /api/picture-day-sessions/{id}/cancel"
        actor: SchoolCoordinator
        preconditions:
          - "No PhotoOrder for this session is in {PAID, FULFILLED} (else ERR_PAID_ORDERS_EXIST)"
        side_effects:
          - "Every RetouchOrder for this session's photos in {REQUESTED, APPROVED} -> CANCELLED; APPROVED ones release their reserved net_cost_cents back to retouch_credit_balance_cents"
          - "Every CaptureSlot in SCHEDULED -> CANCELLED"
          - "increments PictureDaySession.version by 1"

  - entity: Student
    field: status
    initial_state: ENROLLED
    terminal_states: [ABSENT]
    transitions:
      - from: ENROLLED
        to: PHOTOGRAPHED
        trigger: "system (a Photo is matched to this Student via POST /api/photos/{id}/match)"
        actor: system
        preconditions:
          - "Parent session in CAPTURE_OPEN"
        side_effects: []

      - from: ENROLLED
        to: ABSENT
        trigger: "POST /api/students/{id}/mark-absent"
        actor: StudioPhotographer
        preconditions:
          - "Parent session in CAPTURE_OPEN (else ERR_SESSION_NOT_CAPTURING)"
          - "Student is ENROLLED (no photo matched yet) (else ERR_STUDENT_ALREADY_PHOTOGRAPHED)"
        side_effects: []

  - entity: Photo
    field: status
    initial_state: UNMATCHED
    terminal_states: [APPROVED]
    transitions:
      - from: UNMATCHED
        to: MATCHED
        trigger: "POST /api/photos/{id}/match"
        actor: StudioPhotographer
        preconditions:
          - "Parent session in CAPTURE_OPEN (else ERR_SESSION_NOT_CAPTURING)"
          - "A candidate Student scores >= MATCH_AUTO_THRESHOLD, else ERR_NO_MATCH_CANDIDATE"
        side_effects:
          - "matched_student_id set to the winning candidate"
          - "match_confidence_score set"
          - "matched Student ENROLLED -> PHOTOGRAPHED"

      - from: MATCHED
        to: RETAKE_REQUESTED
        trigger: "system (POST /api/retouch-orders with kind=RETAKE referencing this photo)"
        actor: StudioPhotographer
        preconditions:
          - "Parent session in {CAPTURE_OPEN, GALLERY_OPEN} (else ERR_SESSION_NOT_RETAKEABLE)"
          - "Photo is MATCHED (else ERR_PHOTO_NOT_RETAKEABLE)"
        side_effects:
          - "A RetouchOrder of kind RETAKE is created in REQUESTED"

      - from: RETAKE_REQUESTED
        to: RETAKEN
        trigger: "system (POST /api/retouch-orders/{id}/complete on the RETAKE order)"
        actor: StudioPhotographer
        preconditions:
          - "The RETAKE RetouchOrder is APPROVED (else ERR_RETOUCH_NOT_APPROVED)"
        side_effects:
          - "A new replacement Photo is created MATCHED to the same Student with retake_of_photo_id = this photo"
          - "RetouchOrder.replacement_photo_id set to the new Photo"
          - "net_cost_cents finalized against retouch_credit_balance_cents (already reserved at approve)"

      - from: RETAKE_REQUESTED
        to: MATCHED
        trigger: "system (the RETAKE RetouchOrder is rejected or cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Photo reverts to MATCHED (retake abandoned)"

      - from: [MATCHED, RETAKEN]
        to: APPROVED
        trigger: "POST /api/photos/{id}/approve"
        actor: SchoolCoordinator
        preconditions:
          - "Parent session in GALLERY_OPEN (else ERR_SESSION_NOT_GALLERY)"
          - "Photo is MATCHED or RETAKEN (else ERR_PHOTO_NOT_APPROVABLE)"
        side_effects:
          - "Photo eligible for yearbook export"

  - entity: PhotoOrder
    field: status
    initial_state: CART
    terminal_states: [FULFILLED, REJECTED, CANCELLED]
    transitions:
      - from: CART
        to: SUBMITTED
        trigger: "POST /api/photo-orders/{id}/submit"
        actor: Guardian
        preconditions:
          - "Parent session in GALLERY_OPEN (else ERR_SESSION_NOT_ORDERING)"
          - "Order has at least one OrderLine (else ERR_EMPTY_ORDER)"
        side_effects:
          - "order_total computed: subtotal_cents, discount_pct, discount_cents, merchandise_cents, shipping_cents, total_cents finalized"

      - from: SUBMITTED
        to: PAID
        trigger: "POST /api/photo-orders/{id}/pay"
        actor: FulfillmentClerk
        preconditions:
          - "Order is SUBMITTED (else ERR_ORDER_NOT_SUBMITTED)"
        side_effects:
          - "session total_merchandise_cents increased by this order's merchandise_cents"
          - "provisional_school_commission line accrued and added to session school_commission_balance_cents"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/photo-orders/{id}/reject"
        actor: FulfillmentClerk
        preconditions:
          - "Order is SUBMITTED (else ERR_ORDER_NOT_SUBMITTED)"
        side_effects:
          - "Order frozen; no commission accrued"

      - from: PAID
        to: FULFILLED
        trigger: "system (POST /api/shipments/{id}/dispatch on a shipment for this order)"
        actor: FulfillmentClerk
        preconditions:
          - "A Shipment for this order transitions to DISPATCHED (else order stays PAID)"
        side_effects:
          - "Order marked FULFILLED"

      - from: [CART, SUBMITTED]
        to: CANCELLED
        trigger: "POST /api/photo-orders/{id}/cancel"
        actor: Guardian
        preconditions:
          - "Order is CART or SUBMITTED (else ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Order frozen"

  - entity: RetouchOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [DONE, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/retouch-orders/{id}/approve"
        actor: StudioPhotographer
        preconditions:
          - "net_cost_cents <= the photo's session retouch_credit_balance_cents (else ERR_INSUFFICIENT_RETOUCH_CREDIT)"
        side_effects:
          - "net_cost_cents reserved: retouch_credit_balance_cents decreased by net_cost_cents"

      - from: APPROVED
        to: DONE
        trigger: "POST /api/retouch-orders/{id}/complete"
        actor: StudioPhotographer
        preconditions:
          - "RetouchOrder is APPROVED (else ERR_RETOUCH_NOT_APPROVED)"
        side_effects:
          - "For kind=RETAKE: linked Photo RETAKE_REQUESTED -> RETAKEN; replacement Photo created; replacement_photo_id set"
          - "net_cost_cents finalized (remains debited)"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/retouch-orders/{id}/reject"
        actor: StudioPhotographer
        preconditions:
          - "RetouchOrder is REQUESTED (else ERR_RETOUCH_NOT_REQUESTED)"
        side_effects:
          - "For kind=RETAKE: linked Photo RETAKE_REQUESTED -> MATCHED (revert)"

      - from: [REQUESTED, APPROVED]
        to: CANCELLED
        trigger: "POST /api/retouch-orders/{id}/cancel"
        actor: StudioPhotographer
        preconditions:
          - "RetouchOrder is REQUESTED or APPROVED (else ERR_RETOUCH_NOT_CANCELLABLE)"
        side_effects:
          - "If APPROVED: reserved net_cost_cents released back to retouch_credit_balance_cents"
          - "For kind=RETAKE: linked Photo RETAKE_REQUESTED -> MATCHED (revert)"

  - entity: Shipment
    field: status
    initial_state: PENDING
    terminal_states: [DELIVERED, VOIDED]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /api/shipments/{id}/dispatch"
        actor: FulfillmentClerk
        preconditions:
          - "Linked PhotoOrder is PAID (else ERR_ORDER_NOT_PAID)"
          - "tracking_code is present on the shipment (else ERR_TRACKING_REQUIRED)"
        side_effects:
          - "Linked PhotoOrder PAID -> FULFILLED"

      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /api/shipments/{id}/deliver"
        actor: FulfillmentClerk
        preconditions:
          - "Shipment is DISPATCHED (else ERR_SHIPMENT_NOT_DISPATCHED)"
        side_effects: []

      - from: PENDING
        to: VOIDED
        trigger: "POST /api/shipments/{id}/void"
        actor: FulfillmentClerk
        preconditions:
          - "Shipment is PENDING (else ERR_SHIPMENT_NOT_VOIDABLE)"
        side_effects: []

  - entity: CaptureSlot
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/capture-slots/{id}/complete"
        actor: StudioPhotographer
        preconditions:
          - "Parent session in CAPTURE_OPEN (else ERR_SESSION_NOT_CAPTURING)"
          - "CaptureSlot is SCHEDULED (else ERR_SLOT_NOT_SCHEDULED)"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/capture-slots/{id}/cancel"
        actor: StudioPhotographer
        preconditions:
          - "CaptureSlot is SCHEDULED (else ERR_SLOT_NOT_CANCELLABLE)"
        side_effects:
          - "Window freed: backdrop and photographer no longer occupied for this interval"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: session-settle-stale-version
    parent_entity: PictureDaySession
    write_endpoint: "POST /api/picture-day-sessions/{id}/settle"
    occ_field: "expected_picture_day_session_version"
    description: |
      Settling a PictureDaySession whose version has advanced since the client last
      observed it is rejected. A settle reconciles provisional commission to the final
      value; if another writer has paid or rejected an order in the meantime
      (legitimately advancing the session's version and changing the commission gross),
      the settling client's view is stale and the settle is rejected so the reconciliation
      is computed against current data.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_total
    trigger: "PhotoOrder submit (POST /api/photo-orders/{id}/submit)"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = sum(line.unit_price_cents * line.quantity for line in order.lines)
      # volume discount tier on subtotal (inclusive boundaries):
      if   subtotal_cents >= TIER2_THRESHOLD: discount_pct = TIER2_PCT
      elif subtotal_cents >= TIER1_THRESHOLD: discount_pct = TIER1_PCT
      else:                                   discount_pct = 0.0
      # rounding pinned: round the single subtotal-level discount, NOT per line.
      discount_cents    = round_half_up(subtotal_cents * discount_pct)
      merchandise_cents = subtotal_cents - discount_cents
      # free shipping when merchandise reaches threshold; otherwise flat fee
      shipping_cents = 0 if merchandise_cents >= FREE_SHIP_THRESHOLD else FLAT_SHIP_CENTS
      total_cents = merchandise_cents + shipping_cents
    input_set: "All OrderLine rows on the order at submit time"
    constants:
      TIER1_THRESHOLD: 5000
      TIER1_PCT: 0.05
      TIER2_THRESHOLD: 15000
      TIER2_PCT: 0.10
      FREE_SHIP_THRESHOLD: 10000
      FLAT_SHIP_CENTS: 599
    precision: "integer cents, round_half_up"
    note: "Discount tier selected by subtotal; boundary inclusive (>=). At subtotal_cents == 5000 the 5% tier applies; at 4999 no discount."

  - name: provisional_school_commission
    trigger: "PhotoOrder pay (POST /api/photo-orders/{id}/pay)"
    algorithm: chronological
    formula: |
      # Per-order, evaluated in payment chronological order.
      # running_gross = total_merchandise_cents BEFORE adding this order
      #               (sum of merchandise_cents over already-{PAID,FULFILLED} orders)
      new_gross = running_gross + this_order.merchandise_cents
      rate = commission_rate(new_gross)        # tier of cumulative gross AFTER this order
      line_commission_cents = round_half_up(this_order.merchandise_cents * rate)
      # ROUND-PER-ORDER-THEN-SUM: each paid order's commission is rounded then added.
      school_commission_balance_cents += line_commission_cents
    input_set: "PhotoOrders that reach PAID, accrued one at a time in pay() order"
    constants:
      COMM_TIER1_THRESHOLD: 50000
      COMM_TIER1_PCT: 0.20
      COMM_TIER2_THRESHOLD: 150000
      COMM_TIER2_PCT: 0.25
      COMM_BASE_PCT: 0.15
    precision: "integer cents, round_half_up per order line then summed"
    note: |
      commission_rate(g): g >= 150000 -> 0.25; 50000 <= g < 150000 -> 0.20; else 0.15.
      PROVISIONAL variant: rate is taken at the running cumulative gross at the moment
      each order is paid, and each order's commission is rounded then summed.
    variants:
      - name: provisional
        when: "Accrued incrementally on each PhotoOrder pay"
        difference: "Rate keyed to running cumulative gross at pay time; round-per-order then sum"
      - name: final
        when: "Recomputed at session settle (see final_school_commission)"
        difference: "Single rate keyed to final total gross; sum-then-round once"

  - name: final_school_commission
    trigger: "PictureDaySession settle (POST /api/picture-day-sessions/{id}/settle)"
    algorithm: aggregation
    formula: |
      total_gross = sum(o.merchandise_cents for o in orders if o.status in {PAID, FULFILLED})
      final_rate = commission_rate(total_gross)     # same tier function as provisional
      # SUM-THEN-ROUND: one rounding over the whole gross.
      final_commission_cents = round_half_up(total_gross * final_rate)
      reconciliation_delta = final_commission_cents - school_commission_balance_cents
      school_commission_balance_cents = final_commission_cents
    input_set: "PhotoOrder rows in {PAID, FULFILLED} at settle time"
    constants:
      COMM_TIER1_THRESHOLD: 50000
      COMM_TIER1_PCT: 0.20
      COMM_TIER2_THRESHOLD: 150000
      COMM_TIER2_PCT: 0.25
      COMM_BASE_PCT: 0.15
    precision: "integer cents, round_half_up once over the total"
    note: |
      FINAL variant of school commission. Differs from provisional because (1) a single final
      rate replaces the chronological per-order rates, and (2) one rounding over the total replaces
      round-per-order-then-sum. After settle the conserved-quantity invariant holds:
      school_commission_balance_cents == round_half_up(total_gross * final_rate) exactly.

  - name: retouch_cost
    trigger: "RetouchOrder creation (POST /api/retouch-orders)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned so the complimentary discount never depends on the
      # running credit balance it will later reduce.
      # 1. gross_cost_cents = BASE_RETOUCH_FEE + PER_ADJUSTMENT_FEE * adjustment_count
      # 2. premium_linked = exists PhotoOrder o where o.student_id == photo.matched_student_id
      #                     and o.status == PAID and o.has_premium_line == true
      # 3. comp_discount_cents = round_half_up(gross_cost_cents * COMP_PCT) if premium_linked else 0
      # 4. net_cost_cents = gross_cost_cents - comp_discount_cents
      # The balance debit happens later (at APPROVE), AFTER net_cost_cents is fixed here.
      gross_cost_cents = BASE_RETOUCH_FEE + PER_ADJUSTMENT_FEE * adjustment_count
      comp_discount_cents = round_half_up(gross_cost_cents * COMP_PCT) if premium_linked else 0
      net_cost_cents = gross_cost_cents - comp_discount_cents
    input_set: "The single RetouchOrder being created plus the matched student's PAID orders"
    constants:
      BASE_RETOUCH_FEE: 1500
      PER_ADJUSTMENT_FEE: 500
      COMP_PCT: 0.5
    precision: "integer cents, round_half_up on the discount"
    note: "For kind=RETAKE the same fee schedule applies; RETAKE typically uses adjustment_count=0 (gross 1500)."

  - name: match_confidence_score
    trigger: "Photo match (POST /api/photos/{id}/match)"
    algorithm: weighted_scoring
    formula: |
      # For each candidate Student whose status is ENROLLED in the photo's session:
      #   name_match     = 1 if normalize(student.full_name) == normalize(photo.candidate_name) else 0
      #   grade_match    = 1 if student.grade == photo.candidate_grade else 0
      #   homeroom_match = 1 if student.homeroom == photo.candidate_homeroom else 0
      #   score(s) = round_half_up(100 * (W_NAME*name_match + W_GRADE*grade_match + W_HOMEROOM*homeroom_match))
      # Selector: candidate set = Students with status == ENROLLED in this session.
      #   ranking = score DESC; tie-break = created_at ASC (never id);
      #   if candidate set empty OR best score < MATCH_AUTO_THRESHOLD -> ERR_NO_MATCH_CANDIDATE.
      best = max(candidates, key=lambda s: (score(s), -epoch(s.created_at)))
      if best is None or score(best) < MATCH_AUTO_THRESHOLD: reject ERR_NO_MATCH_CANDIDATE
    input_set: "Students with status == ENROLLED in the photo's session"
    constants:
      W_NAME: 0.5
      W_GRADE: 0.2
      W_HOMEROOM: 0.3
      MATCH_AUTO_THRESHOLD: 80
    precision: "integer 0..100, round_half_up"
    note: |
      Boundary inclusive: a score of exactly 80 (name + homeroom match, grade miss: 100*(0.5+0.3)=80)
      auto-matches; 79 or below does not (name only = 50, name + grade = 70). Tie-break created_at ASC.

  - name: capture_slot_overlap
    trigger: "CaptureSlot creation (POST /api/capture-slots)"
    algorithm: interval_merge
    formula: |
      # The candidate slot occupies TWO independent resources with DIFFERENT interval semantics.
      # Only CaptureSlots in status SCHEDULED on the same session count as occupying.
      #
      # Resource A = Backdrop (geometry: HALF-OPEN [start_minute, end_minute), adjacency allowed).
      #   For every SCHEDULED slot s with s.backdrop_id == new.backdrop_id:
      #     conflict_A = (new.start_minute < s.end_minute) AND (s.start_minute < new.end_minute)
      #   Adjacency (new.start_minute == s.end_minute) is NOT a conflict (gap = 0 permitted).
      #   Any conflict_A -> reject ERR_BACKDROP_DOUBLE_BOOKED.
      #
      # Resource B = Photographer (geometry: BUFFERED, adjacency DISALLOWED — a mandatory
      #   PHOTOGRAPHER_BUFFER_MIN gap between consecutive slots for set changes).
      #   For every SCHEDULED slot s with s.photographer_id == new.photographer_id:
      #     conflict_B = (new.start_minute < s.end_minute + PHOTOGRAPHER_BUFFER_MIN)
      #                  AND (s.start_minute < new.end_minute + PHOTOGRAPHER_BUFFER_MIN)
      #   Two photographer slots must be separated by >= PHOTOGRAPHER_BUFFER_MIN minutes;
      #   adjacency (gap = 0) IS a conflict. Any conflict_B -> reject ERR_PHOTOGRAPHER_DOUBLE_BOOKED.
    input_set: "CaptureSlot rows in status SCHEDULED on the same session, partitioned by backdrop_id then by photographer_id"
    constants:
      PHOTOGRAPHER_BUFFER_MIN: 10
    precision: "integer minutes"
    note: |
      Backdrop check is strict half-open overlap (adjacency OK); photographer check inflates each
      existing interval by the buffer on BOTH sides, so equal/adjacent endpoints collide. Backdrop is
      evaluated before photographer; the first conflict found returns its error_id.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Guardian acting on a Student or its PhotoOrder must own it: X-User-ID == Student.guardian_user_id"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "Guardian-scoped order endpoints (create/submit/cancel/get own orders)"

  - priority: 4
    category: existence
    check: "Path resource id exists (session/student/photo/package/order/line/retouch/shipment/backdrop/photographer/slot)"
    error_id: "ERR_SESSION_NOT_FOUND / ERR_STUDENT_NOT_FOUND / ERR_PHOTO_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_LINE_NOT_FOUND / ERR_RETOUCH_NOT_FOUND / ERR_SHIPMENT_NOT_FOUND / ERR_BACKDROP_NOT_FOUND / ERR_PHOTOGRAPHER_NOT_FOUND / ERR_SLOT_NOT_FOUND"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 5
    category: existence
    check: "Foreign keys in the request body reference existing rows (picture_day_session_id, student_id, photo_id, photo_order_id, package_item_id, backdrop_id, photographer_id)"
    error_id: "ERR_SESSION_NOT_FOUND / ERR_STUDENT_NOT_FOUND / ERR_PHOTO_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_BACKDROP_NOT_FOUND / ERR_PHOTOGRAPHER_NOT_FOUND"
    http_status: 404
    applies_to: "POST create endpoints carrying FK bodies"

  - priority: 6
    category: business_constraint
    check: "Required body fields present and typed; enums in declared set; quantity >= 1; adjustment_count >= 0; base_price_cents > 0; end_minute > start_minute; sku unique within session"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/update endpoints

  - priority: 7
    category: state
    check: "Parent PictureDaySession in the posture required by the operation (CAPTURE_OPEN for match/mark-absent/slot-complete; GALLERY_OPEN for order submit and photo approve; CAPTURE_OPEN/GALLERY_OPEN for retake creation)"
    error_id: "ERR_SESSION_NOT_CAPTURING / ERR_SESSION_NOT_ORDERING / ERR_SESSION_NOT_GALLERY / ERR_SESSION_NOT_RETAKEABLE"
    http_status: 409
    applies_to: "match, mark-absent, slot complete, order submit, photo approve, retake creation"

  - priority: 8
    category: state
    check: "Target resource in the correct state for the requested transition"
    error_id: "ERR_PHOTO_NOT_RETAKEABLE / ERR_PHOTO_NOT_APPROVABLE / ERR_ORDER_NOT_SUBMITTED / ERR_ORDER_NOT_PAID / ERR_ORDER_NOT_CANCELLABLE / ERR_RETOUCH_NOT_APPROVED / ERR_RETOUCH_NOT_REQUESTED / ERR_RETOUCH_NOT_CANCELLABLE / ERR_SHIPMENT_NOT_DISPATCHED / ERR_SHIPMENT_NOT_VOIDABLE / ERR_STUDENT_ALREADY_PHOTOGRAPHED / ERR_SLOT_NOT_SCHEDULED / ERR_SLOT_NOT_CANCELLABLE / ERR_ORDER_NOT_CART"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8a
    category: business_temporal
    check: "Backdrop double-booking: candidate CaptureSlot half-open interval [start_minute,end_minute) overlaps a SCHEDULED slot on the same backdrop_id (adjacency allowed)"
    error_id: ERR_BACKDROP_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /api/capture-slots"

  - priority: 8b
    category: business_temporal
    check: "Photographer double-booking: candidate CaptureSlot is within PHOTOGRAPHER_BUFFER_MIN of a SCHEDULED slot on the same photographer_id (adjacency disallowed; buffer-inflated overlap)"
    error_id: ERR_PHOTOGRAPHER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /api/capture-slots"

  - priority: 9
    category: business_referential
    check: "Gallery access requires a valid, non-expired code: access_code matches session.gallery_access_code AND current clock < gallery_closes_at"
    error_id: ERR_GALLERY_ACCESS_DENIED
    http_status: 403
    applies_to: "GET /api/picture-day-sessions/{id}/gallery"

  - priority: 10
    category: business_safety
    check: "No ENROLLED candidate Student scores >= MATCH_AUTO_THRESHOLD for the photo"
    error_id: ERR_NO_MATCH_CANDIDATE
    http_status: 422
    applies_to: "POST /api/photos/{id}/match"

  - priority: 11
    category: business_temporal
    check: "Shipment dispatch requires its order PAID; settle requires every PAID order to have a non-VOIDED shipment"
    error_id: "ERR_ORDER_NOT_PAID / ERR_UNSHIPPED_ORDERS"
    http_status: 409
    applies_to: "POST /api/shipments/{id}/dispatch, POST /api/picture-day-sessions/{id}/settle"

  - priority: 12
    category: business_fiscal
    check: "RetouchOrder approval requires net_cost_cents <= session.retouch_credit_balance_cents"
    error_id: ERR_INSUFFICIENT_RETOUCH_CREDIT
    http_status: 402
    applies_to: "POST /api/retouch-orders/{id}/approve"

  - priority: 13
    category: business_constraint
    check: "OCC: expected_picture_day_session_version must equal current PictureDaySession.version"
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /api/picture-day-sessions/{id}/settle"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- PictureDaySession ----
  - method: POST
    path: "/api/picture-day-sessions"
    description: "Create a picture day session"
    roles: [SchoolCoordinator]
    code: 201
    input: [school_name, scheduled_date, gallery_closes_at, retouch_budget_cents]
    output: PictureDaySession
    side_effects: ["status=DRAFT; retouch_credit_balance_cents=retouch_budget_cents; school_commission_balance_cents=0; total_merchandise_cents=0"]

  - method: GET
    path: "/api/picture-day-sessions"
    description: "List sessions"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PictureDaySession[]"
    side_effects: []

  - method: GET
    path: "/api/picture-day-sessions/{id}"
    description: "Get a session (includes computed ledgers)"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: []
    output: PictureDaySession
    side_effects: []

  - method: POST
    path: "/api/picture-day-sessions/{id}/lock-roster"
    description: "Lock the roster"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: PictureDaySession
    side_effects: ["status DRAFT -> ROSTER_LOCKED; version+1"]

  - method: POST
    path: "/api/picture-day-sessions/{id}/open-capture"
    description: "Open photo capture"
    roles: [StudioPhotographer]
    code: 200
    input: []
    output: PictureDaySession
    side_effects: ["status ROSTER_LOCKED -> CAPTURE_OPEN; version+1"]

  - method: POST
    path: "/api/picture-day-sessions/{id}/open-gallery"
    description: "Open the online gallery and mint the access code"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: PictureDaySession
    side_effects: ["status CAPTURE_OPEN -> GALLERY_OPEN; gallery_access_code minted; gallery_opens_at set; version+1"]

  - method: POST
    path: "/api/picture-day-sessions/{id}/close-ordering"
    description: "Close ordering"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: PictureDaySession
    side_effects: ["status GALLERY_OPEN -> ORDERING_CLOSED; version+1"]

  - method: POST
    path: "/api/picture-day-sessions/{id}/settle"
    description: "Settle the session and reconcile commission (OCC-guarded)"
    roles: [SchoolCoordinator]
    code: 200
    input: [expected_picture_day_session_version]
    output: PictureDaySession
    side_effects: ["status ORDERING_CLOSED -> SETTLED; final_school_commission computed; school_commission_balance_cents reconciled; version+1"]

  - method: POST
    path: "/api/picture-day-sessions/{id}/cancel"
    description: "Cancel the session"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: PictureDaySession
    side_effects: ["status -> CANCELLED; REQUESTED/APPROVED RetouchOrders cancelled and credit released; SCHEDULED CaptureSlots cancelled; version+1"]

  - method: GET
    path: "/api/picture-day-sessions/{id}/gallery"
    description: "View the gallery of APPROVED photos using the access code"
    roles: [Guardian, SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: ["access_code", "limit?", "offset?"]
    output: "Photo[]"
    side_effects: []

  - method: GET
    path: "/api/picture-day-sessions/{id}/yearbook-export"
    description: "Export APPROVED photos as a yearbook batch; marks them exported"
    roles: [SchoolCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Photo[]"
    side_effects: ["each returned APPROVED Photo.yearbook_exported set true"]

  # ---- Student / roster ----
  - method: POST
    path: "/api/students"
    description: "Add a student to a session roster"
    roles: [SchoolCoordinator]
    code: 201
    input: [picture_day_session_id, full_name, grade, homeroom, guardian_user_id]
    output: Student
    side_effects: ["status=ENROLLED"]

  - method: GET
    path: "/api/students"
    description: "List students (filter by session)"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: ["limit?", "offset?", "picture_day_session_id?", "status?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/api/students/{id}"
    description: "Get a student"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk, Guardian]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: POST
    path: "/api/students/{id}/mark-absent"
    description: "Mark a student absent"
    roles: [StudioPhotographer]
    code: 200
    input: []
    output: Student
    side_effects: ["Student ENROLLED -> ABSENT"]

  # ---- PackageItem / catalog ----
  - method: POST
    path: "/api/packages"
    description: "Add a package/print catalog item"
    roles: [SchoolCoordinator]
    code: 201
    input: [picture_day_session_id, sku, name, tier, base_price_cents, "active?"]
    output: PackageItem
    side_effects: []

  - method: GET
    path: "/api/packages"
    description: "List catalog items (filter by session/active)"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk, Guardian]
    code: 200
    input: ["limit?", "offset?", "picture_day_session_id?", "active?"]
    output: "PackageItem[]"
    side_effects: []

  - method: GET
    path: "/api/packages/{id}"
    description: "Get a catalog item"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk, Guardian]
    code: 200
    input: []
    output: PackageItem
    side_effects: []

  # ---- Backdrop / Photographer / CaptureSlot (scheduling) ----
  - method: POST
    path: "/api/backdrops"
    description: "Add a backdrop resource"
    roles: [SchoolCoordinator]
    code: 201
    input: [picture_day_session_id, label, "active?"]
    output: Backdrop
    side_effects: []

  - method: GET
    path: "/api/backdrops"
    description: "List backdrops (filter by session)"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: ["limit?", "offset?", "picture_day_session_id?"]
    output: "Backdrop[]"
    side_effects: []

  - method: GET
    path: "/api/backdrops/{id}"
    description: "Get a backdrop"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: []
    output: Backdrop
    side_effects: []

  - method: POST
    path: "/api/photographers"
    description: "Add a photographer resource"
    roles: [SchoolCoordinator]
    code: 201
    input: [picture_day_session_id, full_name]
    output: Photographer
    side_effects: []

  - method: GET
    path: "/api/photographers"
    description: "List photographers (filter by session)"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: ["limit?", "offset?", "picture_day_session_id?"]
    output: "Photographer[]"
    side_effects: []

  - method: GET
    path: "/api/photographers/{id}"
    description: "Get a photographer"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: []
    output: Photographer
    side_effects: []

  - method: POST
    path: "/api/capture-slots"
    description: "Schedule a capture slot (overlap-checked on backdrop then photographer)"
    roles: [SchoolCoordinator]
    code: 201
    input: [picture_day_session_id, backdrop_id, photographer_id, homeroom, start_minute, end_minute]
    output: CaptureSlot
    side_effects: ["status=SCHEDULED after backdrop and photographer overlap checks pass"]

  - method: GET
    path: "/api/capture-slots"
    description: "List capture slots (filter by session/backdrop/photographer)"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: ["limit?", "offset?", "picture_day_session_id?", "backdrop_id?", "photographer_id?", "status?"]
    output: "CaptureSlot[]"
    side_effects: []

  - method: GET
    path: "/api/capture-slots/{id}"
    description: "Get a capture slot"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: []
    output: CaptureSlot
    side_effects: []

  - method: POST
    path: "/api/capture-slots/{id}/complete"
    description: "Mark a capture slot completed"
    roles: [StudioPhotographer]
    code: 200
    input: []
