  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /petting-zoo/animals", payload: {}, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "request is sent with auth headers stripped; ${err} == ERR_UNAUTHENTICATED with http 401"

      - name: booking_create_event_too_soon_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_EVENT_TOO_SOON]"]
        distinguishing_aspect: "Start 36h after the logical clock (>= now but < now+48h) fails with ERR_EVENT_TOO_SOON, not ERR_EVENT_IN_PAST."
        test_recipe:
          setup: ["Clock 2026-05-10T00:00:00Z; customer; venue"]
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "va1@x.com", full_name: "Va One", customer_type: "PRIVATE" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c1}", captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v1}", start_time: "2026-05-11T12:00:00Z", end_time: "2026-05-11T14:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_EVENT_TOO_SOON (36h < 48h lead)"

      - name: booking_create_event_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_EVENT_IN_PAST]"]
        distinguishing_aspect: "Start before the logical clock fails with ERR_EVENT_IN_PAST (priority 21), which is checked before the 48h rule."
        test_recipe:
          setup: ["Clock 2026-05-10T00:00:00Z; customer; venue"]
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "va2@x.com", full_name: "Va Two", customer_type: "PRIVATE" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c2}", captures: { v2: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v2}", start_time: "2026-05-09T12:00:00Z", end_time: "2026-05-09T14:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c2}", captures: { err: $.data.error_id } }
