scenario: |
  2865. Bone Density & Osteoporosis Program (bone densitometry program): scan scheduling with prior-scan
  retrieval for serial comparison on the same device, densitometer quality control, phantom scanning and
  cross-calibration on equipment change, technologist positioning quality review and repeat criteria,
  fracture risk calculation with clinical risk factor inputs, screening interval determination by baseline
  result and payer frequency limits, treatment initiation and adherence follow-up loops, vertebral fracture
  assessment add-on rules, reporting standards and least significant change interpretation

domain_name: bone-density-osteoporosis-program
api_prefix: "/bone-density"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Densitometer, Patient, PayerPolicy and ScanSession form a many-to-many reference web rather than a
  # single ownership tree: ScanSession carries three inbound FKs (appointment, densitometer, patient) plus a
  # self-referential prior_session_id edge; DiagnosticReport carries a self-referential amends_report_id edge;
  # FraxAssessment joins Patient x RiskFactorProfile x ScanSession. Serial-comparison chains make the
  # ScanSession set a DAG whose traversal (prior of prior of prior) is load-bearing for the LSC rules.

  state_machine_shape: cyclic
  # Densitometer cycles ACTIVE <-> QC_HOLD and ACTIVE -> CROSS_CAL_PENDING -> ACTIVE; ScanSession carries two
  # independent dimensions (acquisition_status x review_status) that also cycle through REPEAT_REQUIRED ->
  # IN_PROGRESS; TreatmentPlan cycles ON_THERAPY <-> ADHERENCE_HOLD and ON_THERAPY <-> DRUG_HOLIDAY;
  # CalibrationEvent branches PHANTOM_SET_COMPLETE -> {APPROVED, REJECTED} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # Densitometer -> QcRun, ScanSession -> SiteMeasurement, TreatmentPlan -> AdherenceRefill
    - self_referential   # ScanSession.prior_session_id, DiagnosticReport.amends_report_id
    - cross_aggregate    # DiagnosticReport (report aggregate) writes Patient (patient aggregate) counters
    - polymorphic        # QcRun.purpose switches the run between device-QC and calibration-event semantics

  role_model: segregation_of_duties
  # The technologist who acquired a ScanSession may never be the user who posts its PositioningReview, and the
  # interpreting physician who finalizes a DiagnosticReport is the only role that may initiate treatment from it.

  consistency_model: immediate

  difficulty_level: expert
  # 15 entities / 54 endpoints / 65 ordered validations / 64 errors / 12 calculations / 8 state-machine dimensions across 7 entities.

entities:
  - name: PayerPolicy
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID with no type prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with exactly three fractional digits, stamped from the logical clock."
      - name: payer_code
        type: string
        source: input
        description: "Short payer identifier."
        constraints: "1..16 chars, unique across all PayerPolicy rows (ERR_PAYER_CODE_TAKEN)"
      - name: name
        type: string
        source: input
        description: "Human-readable payer name."
        constraints: "1..120 chars"
      - name: baseline_screening_min_interval_months
        type: integer
        source: input
        description: "Payer floor, in months, between covered scans for indication BASELINE_SCREENING or SERIAL_MONITORING."
        default: 24
        constraints: ">= 1 and <= 120"
      - name: high_risk_min_interval_months
        type: integer
        source: input
        description: "Payer floor, in months, between covered scans for indication HIGH_RISK_CASE_FINDING."
        default: 12
        constraints: ">= 1 and <= 120"
      - name: treatment_monitoring_min_interval_months
        type: integer
        source: input
        description: "Payer floor, in months, between covered scans for indication TREATMENT_MONITORING."
        default: 12
        constraints: ">= 1 and <= 120"
      - name: vfa_covered
        type: boolean
        source: input
        description: "When false the payer never covers the vertebral fracture assessment add-on."
        default: true
      - name: vfa_requires_height_loss_cm
        type: number
        source: input
        description: "Historical height loss in cm that alone establishes VFA clinical eligibility."
        default: 4.0
        constraints: ">= 0.0 and <= 20.0, at most 1 decimal place"
      - name: repeat_scan_grace_days
        type: integer
        source: input
        description: "Number of days before Patient.next_eligible_scan_date inside which a scan is still covered, downgraded to ELIGIBLE_WITH_GRACE."
        default: 30
        constraints: ">= 0 and <= 180"
      - name: max_lifetime_screening_scans
        type: integer
        source: input
        description: "Hard lifetime cap on FINALIZED DiagnosticReport rows the payer will fund for one Patient."
        default: 6
        constraints: ">= 1 and <= 40"
      - name: appeal_allowed
        type: boolean
        source: input
        description: "Conditional feature flag. When true a frequency-limited or lifetime-capped ScanOrder is created in status DENIED (appealable) instead of the request being rejected."
        default: false

  - name: Densitometer
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial number printed on the gantry."
        constraints: "1..32 chars, unique across all Densitometer rows (ERR_SERIAL_NUMBER_TAKEN)"
      - name: manufacturer
        type: enum
        source: input
        description: "Densitometer vendor; cross-vendor priors are never comparable."
        constraints: "HOLOGIC | GE_LUNAR | NORLAND"
      - name: model
        type: string
        source: input
        description: "Vendor model designation."
        constraints: "1..64 chars"
      - name: site_code
        type: string
        source: input
        description: "Imaging site the device physically lives at."
        constraints: "1..16 chars"
      - name: status
        type: enum
        source: system
        description: "Device posture that gates every acquisition on this device."
        default: ACTIVE
        constraints: "ACTIVE | QC_HOLD | CROSS_CAL_PENDING | RETIRED"
      - name: phantom_baseline_bmd_g_cm2
        type: number
        source: input
        description: "Established phantom mean BMD used as the QC centre line."
        constraints: "> 0.0 and <= 2.0, exactly 4 decimal places"
      - name: phantom_baseline_sd_g_cm2
        type: number
        source: input
        description: "Established phantom SD used as the QC control-limit unit."
        constraints: "> 0.0 and <= 0.2, exactly 4 decimal places"
      - name: appointment_buffer_minutes
        type: integer
        source: input
        description: "Turnaround buffer applied on BOTH sides of every occupied interval when testing device slot collisions."
        default: 15
        constraints: ">= 0 and <= 120"
      - name: daily_scan_capacity
        type: integer
        source: input
        description: "Maximum number of non-cancelled ScanAppointment rows allowed on this device per UTC calendar day."
        default: 12
        constraints: ">= 1 and <= 60"
      - name: last_qc_result
        type: enum
        source: computed
        description: "Result of the most recent QcRun with purpose DAILY_QC on this device, ordered by performed_at_utc DESC then created_at DESC. Null before the first daily QC run."
        default: null
        constraints: "PASS | WARN | FAIL | null"
      - name: last_qc_run_at
        type: datetime
        source: computed
        description: "performed_at_utc of the QcRun that supplied last_qc_result. Null before the first daily QC run."
        default: null
      - name: consecutive_qc_pass_count
        type: integer
        source: computed
        description: "Count of consecutive DAILY_QC runs with result PASS immediately preceding and including the latest one; reset to 0 by any WARN or FAIL and by entering QC_HOLD."
        default: 0
      - name: qc_hold_started_at
        type: datetime
        source: computed
        description: "performed_at_utc of the QcRun that drove this device into QC_HOLD. Cleared to null on release back to ACTIVE."
        default: null
      - name: qc_hold_reason_code
        type: enum
        source: computed
        description: "Why the device is on QC hold. Cleared to null on release."
        default: null
        constraints: "OUT_OF_CONTROL_FAIL | SUSTAINED_SHIFT | null"
      - name: rms_sd_g_cm2
        type: number
        source: computed
        description: "Root-mean-square SD accepted from the most recent precision assessment on this device."
        default: null
      - name: precision_degrees_of_freedom
        type: integer
        source: computed
        description: "patient_count * (scans_per_patient - 1) from the accepted precision assessment; must be at least 30 for the study to be accepted."
        default: null
      - name: lsc_g_cm2
        type: number
        source: computed
        description: "Least significant change in absolute g/cm2 for this device, = round(2.77 * rms_sd_g_cm2, 4). Null until a precision assessment is accepted; a null value blocks every acquisition on the device."
        default: null
      - name: precision_technologist_user_id
        type: string
        source: computed
        description: "Opaque X-User-ID of the technologist whose duplicate-scan study produced rms_sd_g_cm2."
        default: null
      - name: precision_certified_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the current precision assessment was accepted."
        default: null
      - name: cross_cal_factor
        type: number
        source: computed
        description: "Multiplicative correction applied to a prior ScanSession's BMD when that prior was acquired at a lower calibration_generation than the current session."
        default: 1.0
      - name: calibration_generation
        type: integer
        source: computed
        description: "Monotonic counter incremented by one on each APPROVED CalibrationEvent. Every ScanSession snapshots this value at creation."
        default: 1

  - name: QcRun
    parent: Densitometer
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID with no type prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with exactly three fractional digits, stamped from the logical clock. Used as the tie-break key wherever QC runs are ordered."
      - name: densitometer_id
        type: string
        source: system
        description: "FK -> Densitometer.id; taken from the path, never from the body."
      - name: calibration_event_id
        type: string
        source: input
        description: "FK -> CalibrationEvent.id; required when purpose is CROSS_CAL_BASELINE or CROSS_CAL_NEW, and MUST be absent when purpose is DAILY_QC."
        default: null
      - name: purpose
        type: enum
        source: input
        description: "Which control chart this phantom scan feeds."
        constraints: "DAILY_QC | CROSS_CAL_BASELINE | CROSS_CAL_NEW"
      - name: scan_mode
        type: enum
        source: input
        description: "Acquisition mode the phantom was scanned in."
        constraints: "ARRAY | FAST_ARRAY | HIGH_DEFINITION"
      - name: phantom_bmd_g_cm2
        type: number
        source: input
        description: "Measured phantom BMD for this run."
        constraints: "> 0.0 and <= 2.0, exactly 4 decimal places"
      - name: performed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the acquiring technologist."
      - name: performed_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the run; primary sort key for every QC ordering."
      - name: deviation_g_cm2
        type: number
        source: computed
        description: "round(phantom_bmd_g_cm2 - Densitometer.phantom_baseline_bmd_g_cm2, 4)."
      - name: deviation_sd_units
        type: number
        source: computed
        description: "round(deviation_g_cm2 / Densitometer.phantom_baseline_sd_g_cm2, 3); signed."
      - name: result
        type: enum
        source: computed
        description: "PASS when abs(deviation_sd_units) <= 1.000; WARN when 1.000 < abs(deviation_sd_units) <= 1.500; FAIL when abs(deviation_sd_units) > 1.500."
        constraints: "PASS | WARN | FAIL"
      - name: shift_detected
        type: boolean
        source: computed
        description: "True only for purpose DAILY_QC when this run plus the two immediately preceding DAILY_QC runs on the same device all have abs(deviation_sd_units) >= 1.000 and all three share the same sign of deviation_sd_units."
        default: false

  - name: CalibrationEvent
    parent: Densitometer
    common_fields: true
    fields:
      - name: densitometer_id
        type: string
        source: system
        description: "FK -> Densitometer.id; taken from the path, never from the body."
      - name: change_type
        type: enum
        source: input
        description: "Hardware or software change that invalidates the device's prior calibration."
        constraints: "DETECTOR_REPLACEMENT | SOFTWARE_UPGRADE | XRAY_TUBE_REPLACEMENT | DEVICE_REPLACEMENT"
      - name: change_note
        type: string
        source: input
        description: "Free-text service record reference."
        default: null
        constraints: "0..240 chars"
      - name: status
        type: enum
        source: system
        description: "Cross-calibration workflow state."
        default: OPEN
        constraints: "OPEN | PHANTOM_SET_COMPLETE | APPROVED | REJECTED"
      - name: required_phantom_runs
        type: integer
        source: computed
        description: "Runs required on EACH side of the change, keyed by change_type: SOFTWARE_UPGRADE 3, DETECTOR_REPLACEMENT 5, XRAY_TUBE_REPLACEMENT 5, DEVICE_REPLACEMENT 10."
      - name: baseline_run_count
        type: integer
        source: computed
        description: "Count of QcRun rows with calibration_event_id == this.id and purpose == CROSS_CAL_BASELINE."
        default: 0
      - name: new_run_count
        type: integer
        source: computed
        description: "Count of QcRun rows with calibration_event_id == this.id and purpose == CROSS_CAL_NEW."
        default: 0
      - name: baseline_mean_bmd_g_cm2
        type: number
        source: computed
        description: "round(mean of phantom_bmd_g_cm2 over all CROSS_CAL_BASELINE runs on this event, 4). Null until close."
        default: null
      - name: new_mean_bmd_g_cm2
        type: number
        source: computed
        description: "round(mean of phantom_bmd_g_cm2 over all CROSS_CAL_NEW runs on this event, 4). Null until close."
        default: null
      - name: percent_difference
        type: number
        source: computed
        description: "round(100 * (new_mean_bmd_g_cm2 - baseline_mean_bmd_g_cm2) / baseline_mean_bmd_g_cm2, 2). Null until close."
        default: null
      - name: proposed_cross_cal_factor
        type: number
        source: computed
        description: "round(baseline_mean_bmd_g_cm2 / new_mean_bmd_g_cm2, 4), computed at close. Null until close."
        default: null
      - name: outcome_code
        type: enum
        source: computed
        description: "Adjudication outcome. WITHIN_TOLERANCE_NO_FACTOR when abs(percent_difference) < 1.00; FACTOR_APPLIED when 1.00 <= abs(percent_difference) <= 5.00; REJECTED_EXCESSIVE_DRIFT when abs(percent_difference) > 5.00."
        default: null
        constraints: "WITHIN_TOLERANCE_NO_FACTOR | FACTOR_APPLIED | REJECTED_EXCESSIVE_DRIFT | null"
      - name: closed_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the OPEN -> PHANTOM_SET_COMPLETE transition."
        default: null
      - name: adjudicated_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the PHANTOM_SET_COMPLETE -> APPROVED/REJECTED transition."
        default: null

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number."
        constraints: "1..24 chars, unique across all Patient rows (ERR_MRN_TAKEN)"
      - name: primary_payer_policy_id
        type: string
        source: input
        description: "FK -> PayerPolicy.id; supplies every frequency, grace and lifetime-cap limit applied to this patient."
      - name: birth_date
        type: string
        source: input
        description: "Date of birth, YYYY-MM-DD. Age is always completed whole years at the logical-clock date."
        constraints: "valid calendar date, strictly before the logical clock date"
      - name: sex
        type: enum
        source: input
        description: "Sex used for WHO T-score applicability and the FRAX sex term."
        constraints: "FEMALE | MALE"
      - name: postmenopausal
        type: boolean
        source: input
        description: "Whether the patient is postmenopausal; selects the T-score classification path for FEMALE patients."
        default: false
      - name: baseline_height_cm
        type: number
        source: input
        description: "Historical maximum recorded height, the reference for the VFA height-loss rule."
        constraints: "> 80.0 and <= 230.0, at most 1 decimal place"
      - name: open_scheduled_order_count
        type: integer
        source: computed
        description: "Conserved counter. Invariant: open_scheduled_order_count == count of ScanOrder where patient_id == this.id and status == SCHEDULED."
        default: 0
      - name: lifetime_screening_scan_count
        type: integer
        source: computed
        description: "Conserved counter. Invariant: lifetime_screening_scan_count == count of DiagnosticReport R where the ScanSession at R.scan_session_id has patient_id == this.id and R.status == FINALIZED."
        default: 0
      - name: baseline_report_id
        type: string
        source: computed
        description: "FK -> DiagnosticReport.id; the first DiagnosticReport ever FINALIZED for this patient, ordered by finalized_at_utc ASC then created_at ASC. Never overwritten once set."
        default: null
      - name: last_finalized_report_id
        type: string
        source: computed
        description: "FK -> DiagnosticReport.id; the most recently FINALIZED DiagnosticReport for this patient, ordered by finalized_at_utc DESC then created_at DESC."
        default: null
      - name: current_screening_interval_months
        type: integer
        source: computed
        description: "recommended_interval_months copied from last_finalized_report_id. Null until the first report is finalized."
        default: null
      - name: next_eligible_scan_date
        type: string
        source: computed
        description: "YYYY-MM-DD; the scan date of the session behind last_finalized_report_id advanced by current_screening_interval_months calendar months (day-of-month clamped to the last day of the target month). Null until the first report is finalized."
        default: null

  - name: RiskFactorProfile
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: system
        description: "FK -> Patient.id; taken from the path, never from the body."
      - name: status
        type: enum
        source: system
        description: "Exactly one profile per patient is ACTIVE; creating a new one supersedes the incumbent."
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"
      - name: recorded_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant at which the profile was recorded."
      - name: height_cm
        type: number
        source: input
        description: "Current standing height."
        constraints: "> 80.0 and <= 230.0, at most 1 decimal place"
      - name: weight_kg
        type: number
        source: input
        description: "Current weight."
        constraints: "> 20.0 and <= 300.0, at most 1 decimal place"
      - name: bmi
        type: number
        source: computed
        description: "round(weight_kg / (height_cm / 100)^2, 2)."
      - name: height_loss_cm
        type: number
        source: computed
        description: "round(Patient.baseline_height_cm - height_cm, 1); may be negative."
      - name: prior_fragility_fracture
        type: boolean
        source: input
        description: "Previous low-trauma fracture after age 40."
        default: false
      - name: parental_hip_fracture
        type: boolean
        source: input
        description: "Parental history of hip fracture."
        default: false
      - name: current_smoker
        type: boolean
        source: input
        description: "Current tobacco smoker."
        default: false
      - name: glucocorticoid_use
        type: boolean
        source: input
        description: "Current or past systemic glucocorticoid exposure; also an independent VFA eligibility trigger."
        default: false
      - name: rheumatoid_arthritis
        type: boolean
        source: input
        description: "Confirmed rheumatoid arthritis."
        default: false
      - name: secondary_osteoporosis
        type: boolean
        source: input
        description: "A disorder strongly associated with osteoporosis."
        default: false
      - name: alcohol_units_per_day
        type: number
        source: input
        description: "Average alcohol units per day; scores a risk point at >= 3.0."
        default: 0
        constraints: ">= 0.0 and <= 40.0, at most 1 decimal place"
      - name: clinical_risk_factor_count
        type: integer
        source: computed
        description: "Count of true values among the six boolean risk factors plus one when alcohol_units_per_day >= 3.0."
        default: 0

  - name: ScanOrder
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the subject of the ordered study."
      - name: indication
        type: enum
        source: input
        description: "Clinical indication; selects which PayerPolicy interval floor applies."
        constraints: "BASELINE_SCREENING | SERIAL_MONITORING | TREATMENT_MONITORING | HIGH_RISK_CASE_FINDING"
      - name: requested_sites
        type: array
        source: input
        description: "Skeletal sites the ordering clinician wants measured; every listed site must be measured before the session can be submitted."
        constraints: "non-empty array, unique members drawn from LUMBAR_SPINE | FEMORAL_NECK | TOTAL_HIP | FOREARM_33"
      - name: requested_scan_date
        type: string
        source: input
        description: "YYYY-MM-DD target scan date; the date the payer frequency test is evaluated against."
        constraints: "valid calendar date, on or after the logical clock date"
      - name: vfa_requested
        type: boolean
        source: input
        description: "Whether the vertebral fracture assessment add-on was ordered; POST .../vfa is rejected when false."
        default: false
      - name: ordered_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ordering user."
      - name: ordered_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of order creation."
      - name: status
        type: enum
        source: system
        description: "Order lifecycle."
        default: REQUESTED
        constraints: "REQUESTED | SCHEDULED | COMPLETED | DENIED"
      - name: required_densitometer_id
        type: string
        source: computed
        description: "FK -> Densitometer.id; for indication SERIAL_MONITORING or TREATMENT_MONITORING this is the densitometer_id of the ScanSession behind Patient.baseline_report_id, and every appointment for this order must be booked on it. Null for BASELINE_SCREENING and HIGH_RISK_CASE_FINDING, and null when Patient.baseline_report_id is null."
        default: null
      - name: frequency_eligibility
        type: enum
        source: computed
        description: "Payer frequency verdict, recomputed at creation and on every report-finalize cascade that moves Patient.next_eligible_scan_date."
        default: ELIGIBLE
        constraints: "ELIGIBLE | ELIGIBLE_WITH_GRACE | INELIGIBLE_TOO_SOON | INELIGIBLE_LIFETIME_CAP"
      - name: earliest_allowed_date
        type: string
        source: computed
        description: "YYYY-MM-DD copy of Patient.next_eligible_scan_date taken at the last frequency evaluation. Null when the patient has no finalized report."
        default: null
      - name: payer_floor_months
        type: integer
        source: computed
        description: "PayerPolicy interval floor selected by indication at the last frequency evaluation."
      - name: reschedule_required
        type: boolean
        source: computed
        description: "Set true when a cascade reverted this order from SCHEDULED to REQUESTED because its appointment was cancelled by the system."
        default: false
      - name: denial_reason_code
        type: enum
        source: computed
        description: "Populated exactly when status == DENIED."
        default: null
        constraints: "PAYER_FREQUENCY_LIMIT | LIFETIME_CAP_EXCEEDED | INTERVAL_REVISED_BY_REPORT | null"

  - name: ScanAppointment
    parent: ScanOrder
    common_fields: true
    fields:
      - name: scan_order_id
        type: string
        source: input
        description: "FK -> ScanOrder.id; the order this slot fulfils."
      - name: densitometer_id
        type: string
        source: input
        description: "FK -> Densitometer.id; the device the slot occupies."
      - name: start_utc
        type: datetime
        source: input
        description: "Inclusive start of the occupied interval."
        constraints: "ISO 8601 UTC, on or after the logical clock instant"
      - name: end_utc
        type: datetime
        source: input
        description: "Exclusive end of the occupied interval."
        constraints: "ISO 8601 UTC, strictly after start_utc, at most 240 minutes after start_utc"
      - name: scheduled_duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between start_utc and end_utc."
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle."
        default: BOOKED
        constraints: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED"
      - name: cancellation_reason_code
        type: enum
        source: computed
        description: "Populated exactly when status == CANCELLED."
        default: null
        constraints: "PATIENT_REQUEST | DEVICE_QC_HOLD | ORDER_DENIED | null"
      - name: slot_index
        type: integer
        source: computed
        description: "1-based position of this appointment among all ScanAppointment rows on the same densitometer_id whose start_utc falls on the same UTC calendar date and whose status is in {BOOKED, CHECKED_IN, COMPLETED}, ordered by start_utc ASC then created_at ASC. Recomputed for every affected sibling whenever that day's set changes, so booking a slot earlier in the day shifts the later ones up and cancelling one shifts them down."
      - name: cancelled_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the transition into CANCELLED."
        default: null

  - name: ScanSession
    parent: ScanAppointment
    common_fields: true
    fields:
      - name: scan_appointment_id
        type: string
        source: system
        description: "FK -> ScanAppointment.id; taken from the path, never from the body."
      - name: densitometer_id
        type: string
        source: computed
        description: "FK -> Densitometer.id; denormalized from ScanAppointment.densitometer_id at creation and never changed."
      - name: patient_id
        type: string
        source: computed
        description: "FK -> Patient.id; denormalized from ScanOrder.patient_id at creation and never changed."
      - name: prior_session_id
        type: string
        source: computed
        description: "FK -> ScanSession.id; the serial-comparison prior chosen by the prior_session_selection waterfall at creation. Null when the waterfall finds no candidate."
        default: null
      - name: prior_comparison_status
        type: enum
        source: computed
        description: "Comparability verdict emitted by prior_session_selection at creation."
        default: BASELINE_NO_PRIOR
        constraints: "BASELINE_NO_PRIOR | COMPARABLE_SAME_DEVICE | PRIOR_CROSS_CAL_ADJUSTED | NOT_COMPARABLE_DEVICE_MISMATCH"
      - name: technologist_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the acquiring technologist; the only user allowed to post measurements, VFA, submit or repeat this session, and the one user forbidden from reviewing it."
      - name: scan_mode
        type: enum
        source: input
        description: "Acquisition mode; a mandatory reporting element."
        constraints: "ARRAY | FAST_ARRAY | HIGH_DEFINITION"
      - name: calibration_generation
        type: integer
        source: computed
        description: "Densitometer.calibration_generation snapshotted at creation; drives cross-calibration adjustment of priors."
      - name: applied_lsc_g_cm2
        type: number
        source: computed
        description: "Densitometer.lsc_g_cm2 snapshotted at creation, so a later precision assessment cannot retroactively change this session's LSC interpretation."
      - name: applied_cross_cal_factor
        type: number
        source: computed
        description: "Densitometer.cross_cal_factor snapshotted at creation. Applied to the prior session's BMD only when prior_comparison_status is PRIOR_CROSS_CAL_ADJUSTED; otherwise the report uses 1.0000."
        default: 1.0
      - name: acquisition_status
        type: enum
        source: system
        description: "First independent state dimension: acquisition progress."
        default: IN_PROGRESS
        constraints: "IN_PROGRESS | SUBMITTED | ARCHIVED"
      - name: review_status
        type: enum
        source: system
        description: "Second independent state dimension: positioning quality review outcome. Evolves independently of acquisition_status except that REPEAT_REQUIRED drags acquisition_status back to IN_PROGRESS."
        default: NOT_REVIEWED
        constraints: "NOT_REVIEWED | ACCEPTED | ACCEPTED_WITH_LIMITATION | REPEAT_REQUIRED"
      - name: repeat_count
        type: integer
        source: computed
        description: "Number of completed repeat-acquisition cycles on this session; capped by MAX_POSITIONING_REPEATS."
        default: 0
      - name: submitted_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent IN_PROGRESS -> SUBMITTED transition; its calendar date is the scan date used by interval arithmetic."
        default: null
      - name: vfa_performed
        type: boolean
        source: computed
        description: "True once POST /scan-sessions/{id}/vfa has succeeded."
        default: false
      - name: vfa_eligibility_code
        type: enum
        source: computed
        description: "Clinical VFA eligibility evaluated at the moment of the VFA call."
        default: null
        constraints: "ELIGIBLE_HEIGHT_LOSS | ELIGIBLE_GLUCOCORTICOID | ELIGIBLE_AGE_THRESHOLD | NOT_ELIGIBLE | null"
      - name: vfa_max_genant_grade
        type: integer
        source: computed
        description: "Maximum value in the submitted genant_grades array; 0..3."
        default: null
      - name: vfa_fracture_count
        type: integer
        source: computed
        description: "Count of entries in genant_grades that are >= 1."
        default: null
      - name: measured_site_count
        type: integer
        source: computed
        description: "Count of SiteMeasurement rows on this session with superseded == false."
        default: 0
      - name: lowest_t_score
        type: number
        source: computed
        description: "Minimum t_score over the diagnosis-eligible SiteMeasurement rows selected by lowest_t_score_selection. Null until submission."
        default: null
      - name: lowest_t_score_site
        type: enum
        source: computed
        description: "site_code of the measurement that supplied lowest_t_score, tie-broken by the fixed site precedence LUMBAR_SPINE, FEMORAL_NECK, TOTAL_HIP, FOREARM_33."
        default: null
        constraints: "LUMBAR_SPINE | FEMORAL_NECK | TOTAL_HIP | FOREARM_33 | null"
      - name: lowest_z_score
        type: number
        source: computed
        description: "Minimum z_score over the same measurement set that produced lowest_t_score."
        default: null

  - name: SiteMeasurement
    parent: ScanSession
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID with no type prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with exactly three fractional digits, stamped from the logical clock."
      - name: scan_session_id
        type: string
        source: system
        description: "FK -> ScanSession.id; taken from the path, never from the body."
      - name: site_code
        type: enum
        source: input
        description: "Skeletal site measured; at most one non-superseded row per session per site."
        constraints: "LUMBAR_SPINE | FEMORAL_NECK | TOTAL_HIP | FOREARM_33"
      - name: bmd_g_cm2
        type: number
        source: input
        description: "Areal bone mineral density; the raw, unrounded quantity every serial comparison is computed from."
        constraints: "> 0.0 and <= 2.5, exactly 4 decimal places"
      - name: area_cm2
        type: number
        source: input
        description: "Projected bone area of the region of interest."
        constraints: "> 0.0 and <= 200.0, at most 2 decimal places"
      - name: bmc_g
        type: number
        source: input
        description: "Bone mineral content of the region of interest."
        constraints: "> 0.0 and <= 400.0, at most 2 decimal places"
      - name: reference_mean_bmd_g_cm2
        type: number
        source: input
        description: "Young-adult reference mean for this site, from the vendor reference database."
        constraints: "> 0.0 and <= 2.5, exactly 4 decimal places"
      - name: reference_sd_g_cm2
        type: number
        source: input
        description: "Young-adult reference SD for this site."
        constraints: "> 0.0 and <= 0.5, exactly 4 decimal places"
      - name: age_matched_mean_bmd_g_cm2
        type: number
        source: input
        description: "Age-matched reference mean for this site."
        constraints: "> 0.0 and <= 2.5, exactly 4 decimal places"
      - name: age_matched_sd_g_cm2
        type: number
        source: input
        description: "Age-matched reference SD for this site."
        constraints: "> 0.0 and <= 0.5, exactly 4 decimal places"
      - name: included_vertebrae
        type: array
        source: input
        description: "Vertebral levels retained in the lumbar ROI. Required when site_code == LUMBAR_SPINE and MUST be absent otherwise."
        default: null
        constraints: "unique members drawn from L1 | L2 | L3 | L4"
      - name: valid_vertebral_count
        type: integer
        source: computed
        description: "Length of included_vertebrae for LUMBAR_SPINE; 0 for every other site."
        default: 0
      - name: t_score
        type: number
        source: computed
        description: "round((bmd_g_cm2 - reference_mean_bmd_g_cm2) / reference_sd_g_cm2, 1). This 1-decimal value, not the unrounded quotient, is what diagnosis and FRAX consume."
      - name: z_score
        type: number
        source: computed
        description: "round((bmd_g_cm2 - age_matched_mean_bmd_g_cm2) / age_matched_sd_g_cm2, 1)."
      - name: site_usable_for_diagnosis
        type: boolean
        source: computed
        description: "False for LUMBAR_SPINE when valid_vertebral_count < 2; true for every other site."
        default: true
      - name: superseded
        type: boolean
        source: computed
        description: "Set true for every existing measurement on the session when repeat-acquisition runs; superseded rows are excluded from every aggregate and from the duplicate-site check."
        default: false

  - name: PositioningReview
    parent: ScanSession
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID with no type prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with exactly three fractional digits, stamped from the logical clock."
      - name: scan_session_id
        type: string
        source: system
        description: "FK -> ScanSession.id; taken from the path, never from the body."
      - name: reviewer_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the reviewer; MUST differ from ScanSession.technologist_user_id."
      - name: reviewed_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the review."
      - name: defect_codes
        type: array
        source: input
        description: "Positioning defects observed; may be empty."
        constraints: "unique members drawn from ROTATION_FEMUR | ABDUCTION_FEMUR | SPINE_NOT_STRAIGHT | ARTIFACT_IN_FIELD | INCORRECT_ROI | MOTION_ARTIFACT | INADEQUATE_SCAN_LENGTH"
      - name: reviewer_note
        type: string
        source: input
        description: "Free-text reviewer comment."
        default: null
        constraints: "0..240 chars"
      - name: severity_score
        type: integer
        source: computed
        description: "Weighted sum over defect_codes: ROTATION_FEMUR, INCORRECT_ROI and INADEQUATE_SCAN_LENGTH weigh 3; ABDUCTION_FEMUR, SPINE_NOT_STRAIGHT and MOTION_ARTIFACT weigh 2; ARTIFACT_IN_FIELD weighs 1."
        default: 0
      - name: repeat_criterion_met
        type: boolean
        source: computed
        description: "True when severity_score >= POSITIONING_REPEAT_THRESHOLD."
        default: false
      - name: outcome
        type: enum
        source: computed
        description: "ACCEPTED when repeat_criterion_met is false; REPEAT_REQUIRED when it is true and ScanSession.repeat_count < MAX_POSITIONING_REPEATS; ACCEPTED_WITH_LIMITATION when it is true and ScanSession.repeat_count >= MAX_POSITIONING_REPEATS."
        constraints: "ACCEPTED | ACCEPTED_WITH_LIMITATION | REPEAT_REQUIRED"

  - name: FraxAssessment
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the subject whose 10-year fracture probability is being estimated."
      - name: risk_factor_profile_id
        type: string
        source: input
        description: "FK -> RiskFactorProfile.id; MUST belong to patient_id and MUST be in status ACTIVE."
      - name: scan_session_id
        type: string
        source: input
        description: "FK -> ScanSession.id; supplied only for the WITH_BMD variant. Omit for the WITHOUT_BMD variant."
        default: null
      - name: variant
        type: enum
        source: computed
        description: "WITH_BMD when scan_session_id is present, WITHOUT_BMD when it is absent."
        constraints: "WITHOUT_BMD | WITH_BMD"
      - name: age_years
        type: integer
        source: computed
        description: "Completed whole years between Patient.birth_date and the logical clock date at assessment time."
      - name: bmi_used
        type: number
        source: computed
        description: "RiskFactorProfile.bmi copied verbatim from the referenced profile."
      - name: age_points
        type: number
        source: computed
        description: "round(AGE_POINT_PER_YEAR * (age_years - AGE_REFERENCE_YEARS), 4); may be negative."
      - name: sex_points
        type: number
        source: computed
        description: "SEX_POINTS_FEMALE when Patient.sex == FEMALE, otherwise SEX_POINTS_MALE."
      - name: bmi_points
        type: number
        source: computed
        description: "BMI_POINTS_UNDER_20 when bmi_used < 20.00; BMI_POINTS_20_TO_30 when 20.00 <= bmi_used <= 30.00; BMI_POINTS_OVER_30 when bmi_used > 30.00."
      - name: clinical_risk_points
        type: number
        source: computed
        description: "round(sum of the CRF_WEIGHTS entries whose risk factor is true on the referenced profile, 4). alcohol_units_per_day contributes its weight when the value is >= 3.0."
      - name: bmd_points
        type: number
        source: computed
        description: "0.0 for WITHOUT_BMD. For WITH_BMD, round(BMD_POINTS_PER_T_UNIT * (t_score of the non-superseded FEMORAL_NECK SiteMeasurement on scan_session_id), 4)."
      - name: raw_score
        type: number
        source: computed
        description: "round(age_points + sex_points + bmi_points + clinical_risk_points + bmd_points, 4). Each term is rounded to 4 decimals before this sum."
      - name: major_osteoporotic_10yr_pct
        type: number
        source: computed
        description: "round(min(MAJOR_CAP, max(MAJOR_FLOOR, MAJOR_BASE + MAJOR_SLOPE * raw_score)), 1)."
      - name: hip_fracture_10yr_pct
        type: number
        source: computed
        description: "round(min(HIP_CAP, max(HIP_FLOOR, HIP_BASE + HIP_SLOPE * raw_score)), 1)."
      - name: treatment_threshold_met
        type: boolean
        source: computed
        description: "True when major_osteoporotic_10yr_pct >= TREAT_MAJOR_THRESHOLD or hip_fracture_10yr_pct >= TREAT_HIP_THRESHOLD."
        default: false
      - name: threshold_basis
        type: enum
        source: computed
        description: "BOTH when both thresholds are met; MAJOR_OSTEOPOROTIC when only the major threshold is met; HIP when only the hip threshold is met; NONE when neither is."
        constraints: "BOTH | MAJOR_OSTEOPOROTIC | HIP | NONE"
      - name: assessed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the interpreting physician who ran the assessment."
      - name: assessed_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the assessment."

  - name: DiagnosticReport
    parent: ScanSession
    common_fields: true
    fields:
      - name: scan_session_id
        type: string
        source: input
        description: "FK -> ScanSession.id; the study being reported. At most one DiagnosticReport per session may be in status DRAFT or FINALIZED at a time."
      - name: frax_assessment_id
        type: string
        source: input
        description: "FK -> FraxAssessment.id; MUST reference an assessment whose patient_id equals the session's patient_id."
        default: null
      - name: amends_report_id
        type: string
        source: computed
        description: "FK -> DiagnosticReport.id; on a successor report created by the amend action, the id of the report it replaces. Null on an original report."
        default: null
      - name: status
        type: enum
        source: system
        description: "Report lifecycle."
        default: DRAFT
        constraints: "DRAFT | FINALIZED | AMENDED"
      - name: patient_age_years
        type: integer
        source: computed
        description: "Completed whole years between Patient.birth_date and the logical clock date at report creation."
      - name: classification_basis
        type: enum
        source: computed
        description: "T_SCORE_WHO when the patient is a postmenopausal FEMALE or a MALE with patient_age_years >= WHO_MALE_MIN_AGE; Z_SCORE_AGE_MATCHED otherwise."
        constraints: "T_SCORE_WHO | Z_SCORE_AGE_MATCHED"
      - name: diagnostic_category
        type: enum
        source: computed
        description: "On the T_SCORE_WHO path: NORMAL when lowest_t_score >= -1.0, OSTEOPOROSIS when lowest_t_score <= -2.5, OSTEOPENIA otherwise. On the Z_SCORE_AGE_MATCHED path: BELOW_EXPECTED_RANGE_FOR_AGE when lowest_z_score <= -2.0, WITHIN_EXPECTED_RANGE_FOR_AGE otherwise."
        constraints: "NORMAL | OSTEOPENIA | OSTEOPOROSIS | BELOW_EXPECTED_RANGE_FOR_AGE | WITHIN_EXPECTED_RANGE_FOR_AGE"
      - name: lsc_site_code
        type: enum
        source: computed
        description: "The comparison site chosen by lsc_interpretation: the first site in the fixed precedence TOTAL_HIP, LUMBAR_SPINE, FEMORAL_NECK that has a non-superseded, diagnosis-usable measurement on BOTH the current and the prior session. Null when there is no prior or no common site."
        default: null
        constraints: "TOTAL_HIP | LUMBAR_SPINE | FEMORAL_NECK | null"
      - name: prior_bmd_used_g_cm2
        type: number
        source: computed
        description: "The prior session's BMD at lsc_site_code after cross-calibration adjustment, rounded to 4 decimals before any differencing."
        default: null
      - name: current_bmd_used_g_cm2
        type: number
        source: computed
        description: "The current session's raw bmd_g_cm2 at lsc_site_code."
        default: null
      - name: bmd_change_g_cm2
        type: number
        source: computed
        description: "round(current_bmd_used_g_cm2 - prior_bmd_used_g_cm2, 4); signed."
        default: null
      - name: bmd_change_pct
        type: number
        source: computed
        description: "round(100 * (current_bmd_used_g_cm2 - prior_bmd_used_g_cm2) / prior_bmd_used_g_cm2, 2). Computed from the two 4-decimal BMD values in one step; the intermediate difference is NOT rounded to 2 decimals first."
        default: null
      - name: applied_lsc_g_cm2
        type: number
        source: computed
        description: "ScanSession.applied_lsc_g_cm2 of the current session, copied for the report narrative."
        default: null
      - name: lsc_interpretation
        type: enum
        source: computed
        description: "Serial-comparison verdict; see calculation lsc_interpretation."
        constraints: "NO_PRIOR | NOT_COMPARABLE_DEVICE | NO_COMMON_SITE | NO_SIGNIFICANT_CHANGE | SIGNIFICANT_LOSS | SIGNIFICANT_GAIN"
      - name: clinical_interval_months
        type: integer
        source: computed
        description: "Purely clinical rescan interval before the payer floor is applied; step 3 of screening_interval_determination."
      - name: payer_floor_months
        type: integer
        source: computed
        description: "PayerPolicy floor selected by the order's indication; step 4 of screening_interval_determination."
      - name: recommended_interval_months
        type: integer
        source: computed
        description: "max(clinical_interval_months, payer_floor_months); step 5 of screening_interval_determination."
      - name: recommended_action
        type: enum
        source: computed
        description: "Step 6 of screening_interval_determination; evaluated strictly after recommended_interval_months exists."
        constraints: "ROUTINE_INTERVAL | PAYER_LIMITED_INTERVAL | INITIATE_TREATMENT | CONTINUE_TREATMENT | REFER_SECONDARY_WORKUP"
      - name: non_comparability_note
        type: string
        source: input
        description: "Mandatory reporting element whenever the session's prior_comparison_status is NOT_COMPARABLE_DEVICE_MISMATCH."
        default: null
        constraints: "0..240 chars"
      - name: vfa_narrative
        type: string
        source: input
        description: "Mandatory reporting element whenever the session's vfa_performed is true."
        default: null
        constraints: "0..240 chars"
      - name: missing_element_codes
        type: array
        source: computed
        description: "Subset of LSC_NON_COMPARABILITY_NOTE (required when lsc_interpretation is NOT_COMPARABLE_DEVICE or NO_COMMON_SITE and non_comparability_note is null) and VFA_FINDINGS (required when the ScanSession vfa_performed is true and vfa_narrative is null) that the report still lacks; recomputed at creation, on PATCH and at finalize."
        default: []
      - name: required_elements_complete
        type: boolean
        source: computed
        description: "True exactly when missing_element_codes is empty."
        default: false
      - name: amendment_reason
        type: string
        source: input
        description: "Reason the predecessor report was amended; recorded on the successor report only."
        default: null
        constraints: "1..240 chars when present"
      - name: finalized_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the DRAFT -> FINALIZED transition."
        default: null
      - name: finalized_by_user_id
        type: string
        source: computed
        description: "Opaque X-User-ID of the physician who finalized the report."
        default: null

  - name: TreatmentPlan
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the treated subject."
      - name: initiating_report_id
        type: string
        source: input
        description: "FK -> DiagnosticReport.id; MUST be FINALIZED, MUST belong to a session whose patient_id equals patient_id, and MUST carry recommended_action == INITIATE_TREATMENT."
      - name: drug_class
        type: enum
        source: input
        description: "Therapy class; selects followup_interval_months and the drug-holiday and rebound rules."
        constraints: "BISPHOSPHONATE_ORAL | BISPHOSPHONATE_IV | DENOSUMAB | ANABOLIC_PTH | SERM"
      - name: start_date
        type: string
        source: input
        description: "YYYY-MM-DD therapy start; the left edge of every adherence window."
        constraints: "valid calendar date, on or after the calendar date of DiagnosticReport.finalized_at_utc"
      - name: adherence_source_policy
        type: enum
        source: input
        description: "Selects which medication_possession_ratio variant this plan is scored with."
        default: CLAIMS_ONLY
        constraints: "CLAIMS_ONLY | ALL_SOURCES_WEIGHTED"
      - name: status
        type: enum
        source: system
        description: "Therapy lifecycle; cycles between ON_THERAPY and ADHERENCE_HOLD and between ON_THERAPY and DRUG_HOLIDAY."
        default: INITIATED
        constraints: "INITIATED | ON_THERAPY | ADHERENCE_HOLD | DRUG_HOLIDAY | DISCONTINUED"
      - name: followup_interval_months
        type: integer
        source: computed
        description: "Keyed by drug_class: BISPHOSPHONATE_ORAL 3, ANABOLIC_PTH 3, DENOSUMAB 6, SERM 6, BISPHOSPHONATE_IV 12."
      - name: next_followup_due_date
        type: string
        source: computed
        description: "YYYY-MM-DD. At creation, start_date advanced by followup_interval_months calendar months; after each adherence review, the review date advanced by followup_interval_months."
      - name: last_review_date
        type: string
        source: computed
        description: "YYYY-MM-DD logical-clock date of the most recent adherence review. Null before the first review."
        default: null
      - name: adherence_window_days
        type: integer
        source: computed
        description: "Day count of the window used by the most recent adherence review: (last_review_date - start_date) in whole days."
        default: null
      - name: covered_days_supplied
        type: number
        source: computed
        description: "Weighted supplied-day total the most recent review summed over eligible AdherenceRefill rows; refills are NOT de-overlapped."
        default: null
      - name: medication_possession_ratio
        type: number
        source: computed
        description: "round(min(MPR_CAP, covered_days_supplied / adherence_window_days), 3). Null before the first review."
        default: null
      - name: adherence_status
        type: enum
        source: computed
        description: "ADHERENT when medication_possession_ratio >= 0.800; PARTIAL when 0.500 <= ratio < 0.800; NON_ADHERENT when ratio < 0.500."
        default: NOT_ASSESSED
        constraints: "NOT_ASSESSED | ADHERENT | PARTIAL | NON_ADHERENT"
      - name: adherence_review_count
        type: integer
        source: computed
        description: "Number of adherence reviews performed on this plan."
        default: 0
      - name: consecutive_nonadherent_reviews
        type: integer
        source: computed
        description: "Consecutive reviews ending in NON_ADHERENT; reset to 0 by any ADHERENT or PARTIAL review."
        default: 0
      - name: denosumab_gap_days
        type: integer
        source: computed
        description: "For drug_class DENOSUMAB only: whole days between the coverage end of the latest eligible refill (dispensed_date + days_supplied) and the review date; negative when coverage is still live. Null for every other drug class."
        default: null
      - name: cumulative_therapy_months
        type: integer
        source: computed
        description: "Completed whole calendar months between start_date and last_review_date."
        default: 0
      - name: holiday_eligible
        type: boolean
        source: computed
        description: "True when drug_class is BISPHOSPHONATE_ORAL or BISPHOSPHONATE_IV, cumulative_therapy_months >= HOLIDAY_MIN_THERAPY_MONTHS, and the ScanSession behind Patient.last_finalized_report_id has lowest_t_score > -2.5."
        default: false
      - name: discontinuation_reason_code
        type: enum
        source: computed
        description: "Populated exactly when status == DISCONTINUED."
        default: null
        constraints: "ADHERENCE_FAILURE | ADVERSE_EVENT | GOAL_MET | PATIENT_REQUEST | null"

  - name: AdherenceRefill
    parent: TreatmentPlan
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID with no type prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with exactly three fractional digits, stamped from the logical clock."
      - name: treatment_plan_id
        type: string
        source: system
        description: "FK -> TreatmentPlan.id; taken from the path, never from the body."
      - name: dispensed_date
        type: string
        source: input
        description: "YYYY-MM-DD date the supply was dispensed."
        constraints: "valid calendar date, on or after TreatmentPlan.start_date and strictly before the logical clock date"
      - name: days_supplied
        type: integer
        source: input
        description: "Days of therapy this dispensing covers."
        constraints: ">= 1 and <= 400"
      - name: source
        type: enum
        source: input
        description: "Evidence source; PATIENT_REPORT rows are down-weighted and are ignored entirely under CLAIMS_ONLY."
        constraints: "PHARMACY_CLAIM | PATIENT_REPORT"
      - name: source_weight
        type: number
        source: computed
        description: "1.0 for PHARMACY_CLAIM, REFILL_PATIENT_REPORT_WEIGHT for PATIENT_REPORT."
      - name: coverage_end_date
        type: string
        source: computed
        description: "YYYY-MM-DD, dispensed_date advanced by days_supplied days."
      - name: recorded_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the recorder, or the Patient.id when the recorder is a PatientPortalUser."

state_machines:
  - entity: Densitometer
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: QC_HOLD
        trigger: "POST /bone-density/densitometers/{id}/qc-runs with purpose DAILY_QC whose computed result is FAIL"
        actor: Technologist
        preconditions:
          - "Densitometer.status == ACTIVE"
          - "QcRun.purpose == DAILY_QC"
          - "computed QcRun.result == FAIL (abs(deviation_sd_units) > 1.500)"
        side_effects:
          - "Densitometer.qc_hold_reason_code := OUT_OF_CONTROL_FAIL; qc_hold_started_at := QcRun.performed_at_utc; consecutive_qc_pass_count := 0; last_qc_result := FAIL; last_qc_run_at := QcRun.performed_at_utc"
          - "CASCADE B link 2 (caused by the device entering QC_HOLD, not by the QC run itself): every ScanAppointment with densitometer_id == this device, status == BOOKED and start_utc < qc_hold_started_at + QC_HOLD_CANCEL_HORIZON_HOURS transitions BOOKED -> CANCELLED with cancellation_reason_code := DEVICE_QC_HOLD, ordered by start_utc ASC then created_at ASC"
          - "CASCADE B link 3 (caused by each appointment cancellation in link 2): that appointment's ScanOrder transitions SCHEDULED -> REQUESTED with reschedule_required := true, and Patient.open_scheduled_order_count decrements by one for each such order"
          - "slot_index recomputed for every remaining non-cancelled appointment on the same densitometer and UTC calendar date"
      - from: ACTIVE
        to: QC_HOLD
        trigger: "POST /bone-density/densitometers/{id}/qc-runs with purpose DAILY_QC whose computed shift_detected is true"
        actor: Technologist
        preconditions:
          - "Densitometer.status == ACTIVE"
          - "QcRun.purpose == DAILY_QC"
          - "computed QcRun.result != FAIL"
          - "computed QcRun.shift_detected == true"
        side_effects:
          - "Densitometer.qc_hold_reason_code := SUSTAINED_SHIFT; qc_hold_started_at := QcRun.performed_at_utc; consecutive_qc_pass_count := 0"
          - "The same CASCADE B link 2 and link 3 chain as the FAIL transition fires, with cancellation_reason_code := DEVICE_QC_HOLD"
        note: "Fires even when this run's own result is PASS, because three consecutive same-side runs at abs(deviation_sd_units) >= 1.000 constitute an out-of-control shift."
      - from: QC_HOLD
        to: ACTIVE
        trigger: "POST /bone-density/densitometers/{id}/qc-runs with purpose DAILY_QC, result PASS, shift_detected false, bringing consecutive_qc_pass_count to QC_RELEASE_PASS_STREAK"
        actor: Technologist
        preconditions:
          - "Densitometer.status == QC_HOLD"
          - "computed QcRun.result == PASS and shift_detected == false"
          - "Densitometer.consecutive_qc_pass_count + 1 >= QC_RELEASE_PASS_STREAK"
        side_effects:
          - "Densitometer.consecutive_qc_pass_count := previous value + 1; qc_hold_started_at := null; qc_hold_reason_code := null"
        note: "A single passing run is not enough; QC_RELEASE_PASS_STREAK is 2, so the first PASS in QC_HOLD only advances the counter and leaves the device in QC_HOLD. Appointments cancelled by the hold are NOT restored."
      - from: ACTIVE
        to: CROSS_CAL_PENDING
        trigger: "POST /bone-density/densitometers/{id}/calibration-events"
        actor: ProgramAdmin
        preconditions:
          - "Densitometer.status IN {ACTIVE, QC_HOLD}"
          - "no CalibrationEvent on this device is in status OPEN or PHANTOM_SET_COMPLETE"
        side_effects:
          - "A CalibrationEvent is created in status OPEN with required_phantom_runs derived from change_type"
          - "Densitometer.consecutive_qc_pass_count := 0"
        note: "Existing BOOKED appointments are deliberately NOT cancelled here; they are blocked at acquisition time by ERR_DENSITOMETER_NOT_ACTIVE instead."
      - from: QC_HOLD
        to: CROSS_CAL_PENDING
        trigger: "POST /bone-density/densitometers/{id}/calibration-events"
        actor: ProgramAdmin
        preconditions:
          - "Densitometer.status == QC_HOLD"
          - "no CalibrationEvent on this device is in status OPEN or PHANTOM_SET_COMPLETE"
        side_effects:
          - "A CalibrationEvent is created in status OPEN"
          - "Densitometer.qc_hold_started_at and qc_hold_reason_code are preserved so the hold reason survives the calibration detour"
      - from: CROSS_CAL_PENDING
        to: ACTIVE
        trigger: "POST /bone-density/calibration-events/{id}/adjudicate resolving to APPROVED"
        actor: ProgramAdmin
        preconditions:
          - "Densitometer.status == CROSS_CAL_PENDING"
          - "CalibrationEvent.status == PHANTOM_SET_COMPLETE"
          - "abs(CalibrationEvent.percent_difference) <= CROSS_CAL_MAX_DRIFT_PCT"
        side_effects:
          - "CASCADE C link 1: CalibrationEvent PHANTOM_SET_COMPLETE -> APPROVED"
          - "CASCADE C link 2 (caused by the approval): Densitometer.calibration_generation increments by one, and cross_cal_factor := 1.0 when outcome_code == WITHIN_TOLERANCE_NO_FACTOR else CalibrationEvent.proposed_cross_cal_factor"
          - "CASCADE C link 3 (caused by the generation bump): every ScanSession created afterwards on this device snapshots the new calibration_generation, so any prior at a lower generation is scored PRIOR_CROSS_CAL_ADJUSTED and has its BMD multiplied by the new cross_cal_factor"
          - "Densitometer.qc_hold_started_at := null; qc_hold_reason_code := null; consecutive_qc_pass_count := 0"
      - from: CROSS_CAL_PENDING
        to: CROSS_CAL_PENDING
        trigger: "POST /bone-density/calibration-events/{id}/adjudicate resolving to REJECTED"
        actor: ProgramAdmin
        preconditions:
          - "Densitometer.status == CROSS_CAL_PENDING"
          - "CalibrationEvent.status == PHANTOM_SET_COMPLETE"
          - "abs(CalibrationEvent.percent_difference) > CROSS_CAL_MAX_DRIFT_PCT"
        side_effects:
          - "CalibrationEvent PHANTOM_SET_COMPLETE -> REJECTED with outcome_code := REJECTED_EXCESSIVE_DRIFT"
          - "Densitometer.cross_cal_factor and calibration_generation are left untouched, so the device remains unusable until a fresh CalibrationEvent is opened and approved"
        note: "Divergent side-effect set versus the APPROVED branch: no generation bump, no factor change, no return to ACTIVE."
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /bone-density/densitometers/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "Densitometer.status IN {ACTIVE, QC_HOLD, CROSS_CAL_PENDING}"
          - "no ScanSession on this device has acquisition_status == IN_PROGRESS"
        side_effects:
          - "Every ScanAppointment on this device with status IN {BOOKED, CHECKED_IN} transitions to CANCELLED with cancellation_reason_code := DEVICE_QC_HOLD, and each affected ScanOrder reverts SCHEDULED -> REQUESTED with reschedule_required := true and Patient.open_scheduled_order_count decremented"
      - from: QC_HOLD
        to: RETIRED
        trigger: "POST /bone-density/densitometers/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "Densitometer.status == QC_HOLD"
          - "no ScanSession on this device has acquisition_status == IN_PROGRESS"
        side_effects:
          - "Same appointment and order unwinding as the ACTIVE -> RETIRED transition"
      - from: CROSS_CAL_PENDING
        to: RETIRED
        trigger: "POST /bone-density/densitometers/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "Densitometer.status == CROSS_CAL_PENDING"
          - "no ScanSession on this device has acquisition_status == IN_PROGRESS"
        side_effects:
          - "Any CalibrationEvent on this device in status OPEN or PHANTOM_SET_COMPLETE transitions to REJECTED with outcome_code := REJECTED_EXCESSIVE_DRIFT"
          - "Same appointment and order unwinding as the ACTIVE -> RETIRED transition"

  - entity: CalibrationEvent
    state_field: status
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: PHANTOM_SET_COMPLETE
        trigger: "POST /bone-density/calibration-events/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "CalibrationEvent.status == OPEN"
          - "baseline_run_count >= required_phantom_runs"
          - "new_run_count >= required_phantom_runs"
        side_effects:
          - "baseline_mean_bmd_g_cm2, new_mean_bmd_g_cm2, percent_difference and proposed_cross_cal_factor computed by cross_calibration_factor"
          - "outcome_code precomputed from percent_difference: WITHIN_TOLERANCE_NO_FACTOR, FACTOR_APPLIED or REJECTED_EXCESSIVE_DRIFT"
          - "closed_at_utc := logical clock"
      - from: PHANTOM_SET_COMPLETE
        to: APPROVED
        trigger: "POST /bone-density/calibration-events/{id}/adjudicate when abs(percent_difference) <= CROSS_CAL_MAX_DRIFT_PCT"
        actor: ProgramAdmin
        preconditions:
          - "CalibrationEvent.status == PHANTOM_SET_COMPLETE"
          - "abs(percent_difference) <= CROSS_CAL_MAX_DRIFT_PCT"
        side_effects:
          - "adjudicated_at_utc := logical clock"
          - "Densitometer.cross_cal_factor := 1.0 when outcome_code == WITHIN_TOLERANCE_NO_FACTOR else proposed_cross_cal_factor; Densitometer.calibration_generation += 1; Densitometer.status CROSS_CAL_PENDING -> ACTIVE"
      - from: PHANTOM_SET_COMPLETE
        to: REJECTED
        trigger: "POST /bone-density/calibration-events/{id}/adjudicate when abs(percent_difference) > CROSS_CAL_MAX_DRIFT_PCT"
        actor: ProgramAdmin
        preconditions:
          - "CalibrationEvent.status == PHANTOM_SET_COMPLETE"
          - "abs(percent_difference) > CROSS_CAL_MAX_DRIFT_PCT"
        side_effects:
          - "adjudicated_at_utc := logical clock; outcome_code := REJECTED_EXCESSIVE_DRIFT"
          - "Densitometer keeps status CROSS_CAL_PENDING, cross_cal_factor and calibration_generation unchanged"
      - from: OPEN
        to: REJECTED
        trigger: "POST /bone-density/densitometers/{id}/retire while this event is OPEN"
        actor: ProgramAdmin
        preconditions:
          - "CalibrationEvent.status == OPEN"
          - "the parent Densitometer is being retired"
        side_effects:
          - "outcome_code := REJECTED_EXCESSIVE_DRIFT; adjudicated_at_utc := logical clock"

  - entity: ScanOrder
    state_field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /bone-density/scan-appointments referencing this order"
        actor: Scheduler
        preconditions:
          - "ScanOrder.status == REQUESTED"
          - "ScanOrder.frequency_eligibility IN {ELIGIBLE, ELIGIBLE_WITH_GRACE}"
          - "ScanOrder.required_densitometer_id is null or equals the requested densitometer_id"
        side_effects:
          - "Patient.open_scheduled_order_count increments by one"
          - "ScanOrder.reschedule_required := false"
      - from: SCHEDULED
        to: REQUESTED
        trigger: "POST /bone-density/scan-appointments/{id}/cancel, or a system cancellation from a device QC hold or retirement"
        actor: Scheduler
        preconditions:
          - "ScanOrder.status == SCHEDULED"
          - "the cancelled ScanAppointment is the order's only appointment in status BOOKED or CHECKED_IN"
        side_effects:
          - "Patient.open_scheduled_order_count decrements by one"
          - "ScanOrder.reschedule_required := true when the cancellation was system-initiated (cancellation_reason_code DEVICE_QC_HOLD or ORDER_DENIED); left false for PATIENT_REQUEST"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /bone-density/scan-sessions/{id}/submit-acquisition (first submission of the order's session)"
        actor: Technologist
        preconditions:
          - "ScanOrder.status == SCHEDULED"
          - "the session's ScanAppointment is transitioning CHECKED_IN -> COMPLETED"
        side_effects:
          - "Patient.open_scheduled_order_count decrements by one"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /bone-density/diagnostic-reports/{id}/finalize cascade re-evaluating this patient's open orders"
        actor: system
        preconditions:
          - "ScanOrder.status == REQUESTED"
          - "recomputed frequency_eligibility IN {INELIGIBLE_TOO_SOON, INELIGIBLE_LIFETIME_CAP}"
        side_effects:
          - "denial_reason_code := INTERVAL_REVISED_BY_REPORT when the recomputed verdict is INELIGIBLE_TOO_SOON, else LIFETIME_CAP_EXCEEDED"
      - from: SCHEDULED
        to: DENIED
        trigger: "POST /bone-density/diagnostic-reports/{id}/finalize cascade re-evaluating this patient's open orders"
        actor: system
        preconditions:
          - "ScanOrder.status == SCHEDULED"
          - "recomputed frequency_eligibility IN {INELIGIBLE_TOO_SOON, INELIGIBLE_LIFETIME_CAP}"
        side_effects:
          - "CASCADE A link 3: denial_reason_code := INTERVAL_REVISED_BY_REPORT or LIFETIME_CAP_EXCEEDED"
          - "CASCADE A link 4 (caused by this denial): every ScanAppointment of this order with status == BOOKED transitions to CANCELLED with cancellation_reason_code := ORDER_DENIED, and Patient.open_scheduled_order_count decrements by one per such order"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /bone-density/scan-orders when the payer verdict is ineligible and PayerPolicy.appeal_allowed == true"
        actor: Scheduler
        preconditions:
          - "computed frequency_eligibility IN {INELIGIBLE_TOO_SOON, INELIGIBLE_LIFETIME_CAP}"
          - "PayerPolicy.appeal_allowed == true"
        side_effects:
          - "The order is persisted directly in status DENIED with denial_reason_code := PAYER_FREQUENCY_LIMIT or LIFETIME_CAP_EXCEEDED instead of the request being rejected"
        note: "When appeal_allowed is false the same condition rejects the request with ERR_PAYER_FREQUENCY_LIMIT or ERR_LIFETIME_SCAN_CAP_EXCEEDED and no row is created."

  - entity: ScanAppointment
    state_field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /bone-density/scan-appointments/{id}/scan-sessions"
        actor: Technologist
        preconditions:
          - "ScanAppointment.status == BOOKED"
          - "Densitometer.status == ACTIVE"
          - "Densitometer.lsc_g_cm2 is not null"
          - "no other ScanSession on this appointment has acquisition_status == IN_PROGRESS"
        side_effects:
          - "A ScanSession is created in acquisition_status IN_PROGRESS and review_status NOT_REVIEWED, snapshotting densitometer_id, patient_id, calibration_generation and applied_lsc_g_cm2"
          - "prior_session_selection runs and fixes prior_session_id and prior_comparison_status"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /bone-density/scan-sessions/{id}/submit-acquisition"
        actor: Technologist
        preconditions:
          - "ScanAppointment.status == CHECKED_IN"
          - "ScanSession.acquisition_status == IN_PROGRESS"
        side_effects:
          - "ScanOrder SCHEDULED -> COMPLETED and Patient.open_scheduled_order_count decrements by one"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /bone-density/scan-appointments/{id}/cancel"
        actor: Scheduler
        preconditions:
          - "ScanAppointment.status == BOOKED"
        side_effects:
          - "cancellation_reason_code := PATIENT_REQUEST; cancelled_at_utc := logical clock"
          - "ScanOrder SCHEDULED -> REQUESTED and Patient.open_scheduled_order_count decrements by one, restoring the counter to its pre-booking value"
          - "slot_index recomputed for every remaining non-cancelled appointment on the same densitometer and UTC calendar date"
      - from: BOOKED
        to: CANCELLED
        trigger: "System cancellation from Densitometer entering QC_HOLD, from device retirement, or from the owning ScanOrder being DENIED by a report-finalize cascade"
        actor: system
        preconditions:
          - "ScanAppointment.status == BOOKED"
          - "for the QC-hold case, start_utc < Densitometer.qc_hold_started_at + QC_HOLD_CANCEL_HORIZON_HOURS"
        side_effects:
          - "cancellation_reason_code := DEVICE_QC_HOLD or ORDER_DENIED depending on the originating link"
          - "ScanOrder SCHEDULED -> REQUESTED with reschedule_required := true (QC hold, retirement) or the order is already DENIED (cascade A), and Patient.open_scheduled_order_count decrements by one"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /bone-density/densitometers/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "ScanAppointment.status == CHECKED_IN"
          - "no ScanSession on this appointment has acquisition_status == IN_PROGRESS"
        side_effects:
          - "cancellation_reason_code := DEVICE_QC_HOLD; the owning ScanOrder reverts SCHEDULED -> REQUESTED with reschedule_required := true"

  - entity: ScanSession
    state_field: acquisition_status
    initial_state: IN_PROGRESS
    terminal_states: [ARCHIVED]
    transitions:
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /bone-density/scan-sessions/{id}/submit-acquisition"
        actor: Technologist
        preconditions:
          - "ScanSession.acquisition_status == IN_PROGRESS"
          - "X-User-ID == ScanSession.technologist_user_id"
          - "measured_site_count >= 1"
          - "every site_code in the owning ScanOrder.requested_sites has a non-superseded SiteMeasurement on this session"
          - "ScanOrder.vfa_requested == false or ScanSession.vfa_performed == true"
        side_effects:
          - "submitted_at_utc := logical clock; lowest_t_score, lowest_t_score_site and lowest_z_score computed by lowest_t_score_selection"
          - "ScanAppointment CHECKED_IN -> COMPLETED, which drives ScanOrder SCHEDULED -> COMPLETED and decrements Patient.open_scheduled_order_count"
      - from: SUBMITTED
        to: IN_PROGRESS
        trigger: "POST /bone-density/scan-sessions/{id}/repeat-acquisition"
        actor: Technologist
        preconditions:
          - "ScanSession.acquisition_status == SUBMITTED"
          - "ScanSession.review_status == REPEAT_REQUIRED"
          - "X-User-ID == ScanSession.technologist_user_id"
          - "ScanSession.repeat_count < MAX_POSITIONING_REPEATS"
        side_effects:
          - "repeat_count += 1; submitted_at_utc := null; lowest_t_score, lowest_t_score_site and lowest_z_score reset to null"
          - "every SiteMeasurement on this session gets superseded := true, so measured_site_count returns to 0"
          - "review_status REPEAT_REQUIRED -> NOT_REVIEWED on the other dimension"
          - "ScanAppointment stays COMPLETED and ScanOrder stays COMPLETED; the repeat does not re-open the slot"
        note: "This is the cycle in the acquisition dimension: IN_PROGRESS -> SUBMITTED -> IN_PROGRESS, bounded by MAX_POSITIONING_REPEATS."
      - from: SUBMITTED
        to: ARCHIVED
        trigger: "POST /bone-density/diagnostic-reports/{id}/finalize for a report on this session"
        actor: InterpretingPhysician
        preconditions:
          - "ScanSession.acquisition_status == SUBMITTED"
          - "ScanSession.review_status IN {ACCEPTED, ACCEPTED_WITH_LIMITATION}"
        side_effects:
          - "The session is locked: no further SiteMeasurement, VFA, positioning review or repeat is accepted"

  - entity: ScanSession
    state_field: review_status
    initial_state: NOT_REVIEWED
    terminal_states: []
    transitions:
      - from: NOT_REVIEWED
        to: ACCEPTED
        trigger: "POST /bone-density/scan-sessions/{id}/positioning-reviews whose computed outcome is ACCEPTED"
        actor: QualityReviewer
        preconditions:
          - "ScanSession.review_status == NOT_REVIEWED"
          - "ScanSession.acquisition_status == SUBMITTED"
          - "X-User-ID != ScanSession.technologist_user_id"
          - "computed PositioningReview.severity_score < POSITIONING_REPEAT_THRESHOLD"
        side_effects:
          - "The session becomes eligible for report finalization"
      - from: NOT_REVIEWED
        to: REPEAT_REQUIRED
        trigger: "POST /bone-density/scan-sessions/{id}/positioning-reviews whose computed outcome is REPEAT_REQUIRED"
        actor: QualityReviewer
        preconditions:
          - "ScanSession.review_status == NOT_REVIEWED"
          - "ScanSession.acquisition_status == SUBMITTED"
          - "X-User-ID != ScanSession.technologist_user_id"
          - "computed PositioningReview.severity_score >= POSITIONING_REPEAT_THRESHOLD"
          - "ScanSession.repeat_count < MAX_POSITIONING_REPEATS"
        side_effects:
          - "Report finalization is blocked with ERR_POSITIONING_NOT_ACCEPTED until a repeat cycle completes"
      - from: NOT_REVIEWED
        to: ACCEPTED_WITH_LIMITATION
        trigger: "POST /bone-density/scan-sessions/{id}/positioning-reviews whose computed outcome is ACCEPTED_WITH_LIMITATION"
        actor: QualityReviewer
        preconditions:
          - "ScanSession.review_status == NOT_REVIEWED"
          - "ScanSession.acquisition_status == SUBMITTED"
          - "X-User-ID != ScanSession.technologist_user_id"
          - "computed PositioningReview.severity_score >= POSITIONING_REPEAT_THRESHOLD"
          - "ScanSession.repeat_count >= MAX_POSITIONING_REPEATS"
        side_effects:
          - "The repeat loop terminates; the session becomes eligible for report finalization despite unresolved defects"
        note: "This is the loop-termination branch: the same defect set that produced REPEAT_REQUIRED at repeat_count 0 or 1 produces ACCEPTED_WITH_LIMITATION at repeat_count 2."
      - from: REPEAT_REQUIRED
        to: NOT_REVIEWED
        trigger: "POST /bone-density/scan-sessions/{id}/repeat-acquisition"
        actor: Technologist
        preconditions:
          - "ScanSession.review_status == REPEAT_REQUIRED"
          - "ScanSession.repeat_count < MAX_POSITIONING_REPEATS"
        side_effects:
          - "acquisition_status SUBMITTED -> IN_PROGRESS on the other dimension; repeat_count += 1"
        note: "This is the cycle in the review dimension: NOT_REVIEWED -> REPEAT_REQUIRED -> NOT_REVIEWED."

  - entity: DiagnosticReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [AMENDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /bone-density/diagnostic-reports/{id}/finalize"
        actor: InterpretingPhysician
        preconditions:
          - "DiagnosticReport.status == DRAFT"
          - "ScanSession.acquisition_status == SUBMITTED"
          - "ScanSession.review_status IN {ACCEPTED, ACCEPTED_WITH_LIMITATION}"
          - "DiagnosticReport.required_elements_complete == true"
        side_effects:
          - "finalized_at_utc := logical clock; finalized_by_user_id := X-User-ID"
          - "ScanSession SUBMITTED -> ARCHIVED"
          - "CASCADE A link 2 (caused by the finalization): Patient.lifetime_screening_scan_count += 1; Patient.last_finalized_report_id := this report; Patient.baseline_report_id := this report when it was null; Patient.current_screening_interval_months := recommended_interval_months; Patient.next_eligible_scan_date := date(ScanSession.submitted_at_utc) advanced by recommended_interval_months calendar months"
          - "CASCADE A link 3 (caused by Patient.next_eligible_scan_date moving): every ScanOrder of this patient in status REQUESTED or SCHEDULED, ordered by created_at ASC, has order_frequency_eligibility recomputed; those whose verdict becomes INELIGIBLE_TOO_SOON or INELIGIBLE_LIFETIME_CAP transition to DENIED"
          - "CASCADE A link 4 (caused by each order denial): that order's BOOKED ScanAppointment rows transition to CANCELLED with cancellation_reason_code := ORDER_DENIED and Patient.open_scheduled_order_count decrements by one per denied SCHEDULED order"
      - from: FINALIZED
        to: AMENDED
        trigger: "POST /bone-density/diagnostic-reports/{id}/amend"
        actor: InterpretingPhysician
        preconditions:
          - "DiagnosticReport.status == FINALIZED"
          - "no other DiagnosticReport on the same scan_session_id is in status DRAFT"
        side_effects:
          - "A successor DiagnosticReport is created in status DRAFT with amends_report_id := this report, amendment_reason := the supplied reason, and every computed field re-derived from the current session state"
          - "COMPENSATING ACTION for the lifetime tally: Patient.lifetime_screening_scan_count decrements by one; Patient.last_finalized_report_id and Patient.baseline_report_id are re-derived from the remaining FINALIZED reports (both may become null); Patient.current_screening_interval_months and next_eligible_scan_date are re-derived from the new last_finalized_report_id, or reset to null when none remains"
          - "ScanSession ARCHIVED -> SUBMITTED so the successor report can be finalized"
        note: "Finalize followed by amend leaves Patient.lifetime_screening_scan_count exactly as it was before the finalize; finalizing the successor restores it."

  - entity: TreatmentPlan
    state_field: status
    initial_state: INITIATED
    terminal_states: [DISCONTINUED]
    transitions:
      - from: INITIATED
        to: ON_THERAPY
        trigger: "POST /bone-density/treatment-plans/{id}/adherence-review with requested_action AUTO resolving to ADHERENT or PARTIAL"
        actor: InterpretingPhysician
        preconditions:
          - "TreatmentPlan.status == INITIATED"
          - "logical clock date >= next_followup_due_date - FOLLOWUP_EARLY_WINDOW_DAYS"
          - "computed adherence_status IN {ADHERENT, PARTIAL}"
          - "drug_class != DENOSUMAB or denosumab_gap_days <= DENOSUMAB_MAX_GAP_DAYS"
        side_effects:
          - "adherence_review_count += 1; consecutive_nonadherent_reviews := 0; last_review_date := logical clock date; next_followup_due_date := last_review_date advanced by followup_interval_months calendar months"
      - from: INITIATED
        to: ADHERENCE_HOLD
        trigger: "POST /bone-density/treatment-plans/{id}/adherence-review resolving to NON_ADHERENT, or a DENOSUMAB coverage gap beyond DENOSUMAB_MAX_GAP_DAYS"
        actor: InterpretingPhysician
        preconditions:
          - "TreatmentPlan.status == INITIATED"
          - "computed adherence_status == NON_ADHERENT, or drug_class == DENOSUMAB and denosumab_gap_days > DENOSUMAB_MAX_GAP_DAYS"
        side_effects:
          - "adherence_review_count += 1; consecutive_nonadherent_reviews += 1 when adherence_status == NON_ADHERENT"
      - from: ON_THERAPY
        to: ADHERENCE_HOLD
        trigger: "POST /bone-density/treatment-plans/{id}/adherence-review resolving to NON_ADHERENT, or a DENOSUMAB coverage gap beyond DENOSUMAB_MAX_GAP_DAYS"
        actor: InterpretingPhysician
        preconditions:
          - "TreatmentPlan.status == ON_THERAPY"
          - "computed adherence_status == NON_ADHERENT, or drug_class == DENOSUMAB and denosumab_gap_days > DENOSUMAB_MAX_GAP_DAYS"
          - "consecutive_nonadherent_reviews + 1 < MAX_CONSECUTIVE_NONADHERENT_REVIEWS"
        side_effects:
          - "adherence_review_count += 1; consecutive_nonadherent_reviews += 1"
      - from: ADHERENCE_HOLD
        to: ON_THERAPY
        trigger: "POST /bone-density/treatment-plans/{id}/adherence-review resolving to ADHERENT or PARTIAL"
        actor: InterpretingPhysician
        preconditions:
          - "TreatmentPlan.status == ADHERENCE_HOLD"
          - "computed adherence_status IN {ADHERENT, PARTIAL}"
        side_effects:
          - "adherence_review_count += 1; consecutive_nonadherent_reviews := 0"
        note: "This closes the adherence follow-up loop ON_THERAPY -> ADHERENCE_HOLD -> ON_THERAPY."
      - from: ADHERENCE_HOLD
        to: DISCONTINUED
        trigger: "POST /bone-density/treatment-plans/{id}/adherence-review whose NON_ADHERENT verdict brings consecutive_nonadherent_reviews to MAX_CONSECUTIVE_NONADHERENT_REVIEWS"
        actor: InterpretingPhysician
        preconditions:
          - "TreatmentPlan.status == ADHERENCE_HOLD"
          - "computed adherence_status == NON_ADHERENT"
          - "consecutive_nonadherent_reviews + 1 >= MAX_CONSECUTIVE_NONADHERENT_REVIEWS"
        side_effects:
          - "discontinuation_reason_code := ADHERENCE_FAILURE; adherence_review_count += 1; consecutive_nonadherent_reviews += 1"
      - from: ON_THERAPY
        to: DRUG_HOLIDAY
        trigger: "POST /bone-density/treatment-plans/{id}/adherence-review with requested_action START_DRUG_HOLIDAY"
        actor: InterpretingPhysician
        preconditions:
          - "TreatmentPlan.status == ON_THERAPY"
          - "TreatmentPlan.holiday_eligible == true"
          - "computed adherence_status == ADHERENT"
        side_effects:
          - "adherence_review_count += 1; next_followup_due_date := last_review_date advanced by HOLIDAY_REVIEW_INTERVAL_MONTHS calendar months"
      - from: DRUG_HOLIDAY
        to: ON_THERAPY
        trigger: "POST /bone-density/treatment-plans/{id}/adherence-review with requested_action RESUME_THERAPY"
        actor: InterpretingPhysician
        preconditions:
          - "TreatmentPlan.status == DRUG_HOLIDAY"
        side_effects:
          - "adherence_review_count += 1; next_followup_due_date := last_review_date advanced by followup_interval_months calendar months"
        note: "Second cycle on this entity: ON_THERAPY -> DRUG_HOLIDAY -> ON_THERAPY."
      - from: ON_THERAPY
        to: DISCONTINUED
        trigger: "POST /bone-density/treatment-plans/{id}/adherence-review with requested_action DISCONTINUE"
        actor: InterpretingPhysician
        preconditions:
          - "TreatmentPlan.status IN {INITIATED, ON_THERAPY, ADHERENCE_HOLD, DRUG_HOLIDAY}"
          - "discontinuation_reason_code supplied in the request body"
        side_effects:
          - "discontinuation_reason_code := the supplied code; adherence_review_count += 1"

concurrency_rules:
  - rule_id: risk-profile-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /bone-density/patients/{id}/risk-factor-profiles"
    occ_field: "expected_patient_version"
    description: |
      Recording a RiskFactorProfile against a Patient whose version has advanced since the client last
      observed it is rejected. A new profile legitimately supersedes the incumbent ACTIVE profile, so a
      writer holding a stale view of the patient would silently discard clinical risk factors another
      writer has already recorded, and would silently change the inputs of any FRAX assessment keyed on
      the ACTIVE profile.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
  - rule_id: precision-assessment-stale-densitometer
    parent_entity: Densitometer
    write_endpoint: "POST /bone-density/densitometers/{id}/precision-assessment"
    occ_field: "expected_densitometer_version"
    description: |
      Accepting a precision assessment against a Densitometer whose version has advanced since the client
      last observed it is rejected. A new assessment legitimately supersedes the device's rms_sd_g_cm2 and
      lsc_g_cm2, so a writer holding a stale view would overwrite a least-significant-change value that has
      already moved, silently changing the LSC every later ScanSession snapshots.
    error_id: ERR_STALE_DENSITOMETER_VERSION
    http_status: 412

calculations:
  - name: qc_deviation_and_result
    entity: QcRun
    output_fields: [deviation_g_cm2, deviation_sd_units, result, shift_detected]
    algorithm_type: threshold
    trigger_endpoints:
      - "POST /bone-density/densitometers/{id}/qc-runs"
    inputs:
      - "QcRun.phantom_bmd_g_cm2 (input)"
      - "Densitometer.phantom_baseline_bmd_g_cm2 and Densitometer.phantom_baseline_sd_g_cm2, read live from the parent device"
      - "the two QcRun rows on the same densitometer with purpose == DAILY_QC that immediately precede this one, ordered performed_at_utc DESC then created_at DESC"
    constants:
      QC_WARN_SD_LIMIT: 1.000
      QC_FAIL_SD_LIMIT: 1.500
      QC_SHIFT_RUN_COUNT: 3
      QC_SHIFT_MIN_SD: 1.000
      QC_RELEASE_PASS_STREAK: 2
      QC_HOLD_CANCEL_HORIZON_HOURS: 48
    formula: |
      deviation_g_cm2   = round(phantom_bmd_g_cm2 - Densitometer.phantom_baseline_bmd_g_cm2, 4)
      deviation_sd_units = round(deviation_g_cm2 / Densitometer.phantom_baseline_sd_g_cm2, 3)
      result:
        abs(deviation_sd_units) <= QC_WARN_SD_LIMIT                      -> PASS
        QC_WARN_SD_LIMIT < abs(deviation_sd_units) <= QC_FAIL_SD_LIMIT   -> WARN
        abs(deviation_sd_units) > QC_FAIL_SD_LIMIT                       -> FAIL
      shift_detected = true when this run and the QC_SHIFT_RUN_COUNT - 1 immediately preceding
        DAILY_QC runs on the same device all satisfy abs(deviation_sd_units) >= QC_SHIFT_MIN_SD
        AND all share the same sign of deviation_sd_units (a zero deviation breaks the sign chain);
        false when fewer than QC_SHIFT_RUN_COUNT - 1 preceding DAILY_QC runs exist.
      Device effect, applied in exactly this order:
        1. result == FAIL          -> status := QC_HOLD, qc_hold_reason_code := OUT_OF_CONTROL_FAIL, consecutive_qc_pass_count := 0
        2. shift_detected == true  -> status := QC_HOLD, qc_hold_reason_code := SUSTAINED_SHIFT,     consecutive_qc_pass_count := 0
        3. result == WARN          -> status unchanged, consecutive_qc_pass_count := 0
        4. result == PASS          -> consecutive_qc_pass_count += 1; if status == QC_HOLD and the new
                                      count >= QC_RELEASE_PASS_STREAK then status := ACTIVE and the
                                      hold fields are cleared
      Runs with purpose IN {CROSS_CAL_BASELINE, CROSS_CAL_NEW} are scored identically but never
      change Densitometer.status or consecutive_qc_pass_count, and never participate in shift_detected.
    rounding: "deviation_g_cm2 to 4 decimal places, deviation_sd_units to 3 decimal places, both ROUND_HALF_UP; the classification reads the already-rounded deviation_sd_units, never the unrounded quotient"
    edge_cases:
      - "abs(deviation_sd_units) exactly 1.000 -> PASS, but it also counts toward shift_detected because the shift test is >= QC_SHIFT_MIN_SD, so a passing run can put the device in QC_HOLD"
      - "abs(deviation_sd_units) exactly 1.500 -> WARN, not FAIL"
      - "deviation_sd_units 1.100 preceded by -1.200 and -1.050 does not trip the shift rule: magnitudes qualify but the signs differ"
      - "a device with only two DAILY_QC runs in total can never have shift_detected true"

  - name: precision_lsc
    entity: Densitometer
    output_fields: [precision_degrees_of_freedom, lsc_g_cm2, rms_sd_g_cm2, precision_certified_at]
    algorithm_type: threshold
    trigger_endpoints:
      - "POST /bone-density/densitometers/{id}/precision-assessment"
    inputs:
      - "patient_count, scans_per_patient, rms_sd_g_cm2 (all input)"
    constants:
      LSC_MULTIPLIER: 2.77
      MIN_PRECISION_DOF: 30
    formula: |
      precision_degrees_of_freedom = patient_count * (scans_per_patient - 1)
      if precision_degrees_of_freedom < MIN_PRECISION_DOF:
          reject with ERR_PRECISION_STUDY_UNDERPOWERED and persist nothing
      lsc_g_cm2 = round(LSC_MULTIPLIER * rms_sd_g_cm2, 4)
      precision_certified_at = logical clock
      Densitometer.version increments; the new lsc_g_cm2 is snapshotted by every ScanSession created
      afterwards as applied_lsc_g_cm2, while sessions already created keep the older value.
    rounding: "lsc_g_cm2 to 4 decimal places, ROUND_HALF_UP"
    edge_cases:
      - "30 patients x 2 scans -> dof 30, exactly at MIN_PRECISION_DOF, accepted"
      - "29 patients x 2 scans -> dof 29 -> ERR_PRECISION_STUDY_UNDERPOWERED"
      - "15 patients x 3 scans -> dof 30, accepted: the product, not patient_count, is what matters"
      - "rms_sd_g_cm2 0.0100 -> lsc_g_cm2 0.0277"

  - name: cross_calibration_factor
    entity: CalibrationEvent
    output_fields: [baseline_mean_bmd_g_cm2, new_mean_bmd_g_cm2, percent_difference, proposed_cross_cal_factor, outcome_code]
    algorithm_type: threshold
    trigger_endpoints:
      - "POST /bone-density/calibration-events/{id}/close"
    inputs:
      - "every QcRun on this calibration_event_id with purpose == CROSS_CAL_BASELINE (baseline set)"
      - "every QcRun on this calibration_event_id with purpose == CROSS_CAL_NEW (new-configuration set)"
      - "CalibrationEvent.required_phantom_runs, derived from change_type"
    constants:
      CROSS_CAL_NO_FACTOR_PCT: 1.00
      CROSS_CAL_MAX_DRIFT_PCT: 5.00
      REQUIRED_PHANTOM_RUNS_SOFTWARE_UPGRADE: 3
      REQUIRED_PHANTOM_RUNS_DETECTOR_REPLACEMENT: 5
      REQUIRED_PHANTOM_RUNS_XRAY_TUBE_REPLACEMENT: 5
      REQUIRED_PHANTOM_RUNS_DEVICE_REPLACEMENT: 10
    formula: |
      baseline_mean_bmd_g_cm2 = round(mean of phantom_bmd_g_cm2 over the baseline set, 4)
      new_mean_bmd_g_cm2      = round(mean of phantom_bmd_g_cm2 over the new-configuration set, 4)
      percent_difference = round(100 * (new_mean_bmd_g_cm2 - baseline_mean_bmd_g_cm2) / baseline_mean_bmd_g_cm2, 2)
      outcome_code / proposed_cross_cal_factor:
        abs(percent_difference) <  CROSS_CAL_NO_FACTOR_PCT  -> WITHIN_TOLERANCE_NO_FACTOR, proposed_cross_cal_factor := 1.0000
        CROSS_CAL_NO_FACTOR_PCT <= abs(percent_difference) <= CROSS_CAL_MAX_DRIFT_PCT
                                                            -> FACTOR_APPLIED, proposed_cross_cal_factor := round(baseline_mean_bmd_g_cm2 / new_mean_bmd_g_cm2, 4)
        abs(percent_difference) >  CROSS_CAL_MAX_DRIFT_PCT   -> REJECTED_EXCESSIVE_DRIFT, proposed_cross_cal_factor := null
      Both means are rounded to 4 decimal places BEFORE percent_difference and the factor are derived
      from them; deriving either from unrounded means is wrong.
    rounding: "means to 4 decimal places, percent_difference to 2 decimal places, proposed_cross_cal_factor to 4 decimal places, all ROUND_HALF_UP"
    edge_cases:
      - "baseline mean 1.0000, new mean 1.0200 -> percent_difference 2.00 -> FACTOR_APPLIED with factor 0.9804"
      - "percent_difference exactly 1.00 -> FACTOR_APPLIED, not WITHIN_TOLERANCE_NO_FACTOR"
      - "percent_difference exactly 5.00 -> FACTOR_APPLIED and adjudication may APPROVE; 5.01 -> REJECTED_EXCESSIVE_DRIFT"
      - "WITHIN_TOLERANCE_NO_FACTOR forces the device factor to exactly 1.0 on approval even though the raw ratio is not 1"

  - name: prior_session_selection
    entity: ScanSession
    output_fields: [prior_session_id, prior_comparison_status]
    algorithm_type: waterfall_allocation
    trigger_endpoints:
      - "POST /bone-density/scan-appointments/{id}/scan-sessions"
    inputs:
      - "the new session's patient_id, densitometer_id and calibration_generation"
      - "every other ScanSession of the same patient_id"
      - "the DiagnosticReport rows on those sessions"
    constants: {}
    formula: |
      Comparable pool P = ScanSession rows where patient_id matches, id != the new session,
        acquisition_status == SUBMITTED or ARCHIVED, review_status IN {ACCEPTED, ACCEPTED_WITH_LIMITATION},
        and at least one DiagnosticReport on that session has status == FINALIZED.
      Stage 1 - same device: candidates = P filtered to densitometer_id == new.densitometer_id.
        If non-empty, take the highest submitted_at_utc, tie-break highest created_at.
        prior_comparison_status := PRIOR_CROSS_CAL_ADJUSTED when the chosen prior's
        calibration_generation < the new session's calibration_generation, else COMPARABLE_SAME_DEVICE.
      Stage 2 - any device: only reached when stage 1 is empty. candidates = P unfiltered.
        Same ranking. prior_comparison_status := NOT_COMPARABLE_DEVICE_MISMATCH.
      Stage 3 - no prior: P is empty. prior_session_id := null,
        prior_comparison_status := BASELINE_NO_PRIOR.
      The selection is frozen on the session at creation time; a later session on the original device
      does not retroactively change an already-created session's prior.
    rounding: "not applicable"
    edge_cases:
      - "a candidate on the same device whose only report is still DRAFT is invisible to every stage, so a different-device prior with a FINALIZED report wins stage 2 and yields NOT_COMPARABLE_DEVICE_MISMATCH"
      - "a same-device candidate always beats a more recent different-device candidate: the stages are strictly ordered, not merged by recency"
      - "a candidate with review_status REPEAT_REQUIRED is excluded from the pool entirely"
      - "two same-device candidates sharing submitted_at_utc are broken by created_at DESC, never by id"

  - name: site_scores
    entity: SiteMeasurement
    output_fields: [t_score, z_score, valid_vertebral_count, site_usable_for_diagnosis]
    algorithm_type: threshold
    trigger_endpoints:
      - "POST /bone-density/scan-sessions/{id}/site-measurements"
    inputs:
      - "bmd_g_cm2, reference_mean_bmd_g_cm2, reference_sd_g_cm2, age_matched_mean_bmd_g_cm2, age_matched_sd_g_cm2, included_vertebrae (all input)"
    constants:
      MIN_VALID_VERTEBRAE: 2
    formula: |
      t_score = round((bmd_g_cm2 - reference_mean_bmd_g_cm2) / reference_sd_g_cm2, 1)
      z_score = round((bmd_g_cm2 - age_matched_mean_bmd_g_cm2) / age_matched_sd_g_cm2, 1)
      valid_vertebral_count = length(included_vertebrae) for site_code == LUMBAR_SPINE, else null
      site_usable_for_diagnosis:
        site_code == LUMBAR_SPINE -> valid_vertebral_count >= MIN_VALID_VERTEBRAE
        any other site_code       -> true
      A LUMBAR_SPINE measurement with fewer than MIN_VALID_VERTEBRAE entries is rejected outright
      with ERR_INSUFFICIENT_VALID_VERTEBRAE rather than stored as unusable.
    rounding: "t_score and z_score to 1 decimal place, ROUND_HALF_UP; every downstream consumer (diagnostic category, FRAX BMD term, lowest-score selection) reads the 1-decimal value, never the unrounded quotient"
    edge_cases:
      - "bmd 0.6500, ref_mean 0.8500, ref_sd 0.1000 -> t_score -2.0 exactly"
      - "bmd 0.7000, ref_mean 0.9420, ref_sd 0.1200 -> raw -2.0166..., rounds to -2.0, which is NOT the osteoporosis threshold"
      - "a raw t_score of -2.45 rounds to -2.5 and therefore does classify as OSTEOPOROSIS: rounding happens before classification"
      - "included_vertebrae of exactly two entries is accepted; one entry is rejected"

  - name: lowest_t_score_selection
    entity: ScanSession
    output_fields: [lowest_t_score, lowest_t_score_site, lowest_z_score]
    algorithm_type: aggregation
    trigger_endpoints:
      - "POST /bone-density/scan-sessions/{id}/submit-acquisition"
    inputs:
      - "every SiteMeasurement on this session with superseded == false"
    constants:
      DIAGNOSTIC_SITES: "[LUMBAR_SPINE, FEMORAL_NECK, TOTAL_HIP]"
      SITE_PRECEDENCE: "[LUMBAR_SPINE, FEMORAL_NECK, TOTAL_HIP, FOREARM_33]"
    formula: |
      Candidate set = non-superseded SiteMeasurement rows with site_usable_for_diagnosis == true whose site_code is
        in DIAGNOSTIC_SITES. If that set is empty, and only then, FOREARM_33 becomes eligible and the
        candidate set is the non-superseded FOREARM_33 rows.
      lowest_t_score      = min(t_score) over the candidate set
      lowest_t_score_site = the site_code attaining that minimum; ties are broken by the fixed
        SITE_PRECEDENCE order, never by created_at and never by id
      lowest_z_score      = min(z_score) over the same candidate set
      If no non-superseded measurement exists at all, submission is rejected with ERR_NO_SITE_MEASUREMENTS.
    rounding: "no further rounding; the already-1-decimal t_score and z_score values are compared and one of them is copied verbatim"
    edge_cases:
      - "FEMORAL_NECK -2.0 and TOTAL_HIP -2.0 -> lowest_t_score_site FEMORAL_NECK by precedence"
      - "FOREARM_33 -3.0 alongside a usable FEMORAL_NECK -1.5 -> lowest_t_score is -1.5; the forearm is ignored entirely"
      - "lowest_t_score and lowest_z_score may come from different sites, because each dimension is minimised independently"
      - "measurements superseded by a repeat-acquisition cycle are excluded, so the recomputed values reflect only the newest pass"

  - name: frax_probability
    entity: FraxAssessment
    output_fields: [variant, age_years, bmi_used, age_points, sex_points, bmi_points, clinical_risk_points, bmd_points, raw_score, major_osteoporotic_10yr_pct, hip_fracture_10yr_pct, treatment_threshold_met, threshold_basis]
    algorithm_type: weighted_scoring
    trigger_endpoints:
      - "POST /bone-density/frax-assessments"
    variants:
      - name: WITH_BMD
        selected_when: "scan_session_id is supplied and that session has a non-superseded usable FEMORAL_NECK SiteMeasurement"
        difference: "the bmd_points term is included, using the FEMORAL_NECK t_score"
      - name: WITHOUT_BMD
        selected_when: "scan_session_id is omitted"
        difference: "bmd_points is 0.00 and femoral_neck_t_score is null"
    inputs:
      - "Patient.birth_date and Patient.sex"
      - "the referenced RiskFactorProfile (must be status ACTIVE and belong to the same patient): height_cm, weight_kg, prior_fragility_fracture, parental_hip_fracture, current_smoker, glucocorticoid_use, rheumatoid_arthritis, secondary_osteoporosis, alcohol_units_per_day"
      - "for WITH_BMD only: the FEMORAL_NECK SiteMeasurement.t_score of the referenced ScanSession"
    constants:
      AGE_REFERENCE_YEARS: 50
      AGE_POINTS_PER_YEAR: 0.10
      SEX_POINTS_FEMALE: 0.60
      SEX_POINTS_MALE: 0.00
      BMI_POINTS_UNDER_20: 0.80
      BMI_POINTS_20_TO_30: 0.00
      BMI_POINTS_OVER_30: -0.40
      CRF_PRIOR_FRAGILITY_FRACTURE: 1.90
      CRF_PARENTAL_HIP_FRACTURE: 1.30
      CRF_CURRENT_SMOKER: 0.90
      CRF_GLUCOCORTICOID_USE: 1.60
      CRF_RHEUMATOID_ARTHRITIS: 1.20
      CRF_SECONDARY_OSTEOPOROSIS: 0.80
      CRF_ALCOHOL: 1.00
      ALCOHOL_UNITS_THRESHOLD: 3.0
      BMD_POINTS_PER_T_UNIT: -1.20
      MAJOR_BASE_PCT: 3.0
      MAJOR_SLOPE_PCT: 6.0
      MAJOR_FLOOR_PCT: 0.5
      MAJOR_CAP_PCT: 60.0
      HIP_BASE_PCT: 0.4
      HIP_SLOPE_PCT: 1.6
      HIP_FLOOR_PCT: 0.1
      HIP_CAP_PCT: 30.0
      TREAT_MAJOR_THRESHOLD_PCT: 20.0
      TREAT_HIP_THRESHOLD_PCT: 3.0
    formula: |
      age_years = whole completed years from Patient.birth_date to the logical clock date
      bmi_used = round(weight_kg / (height_cm / 100)^2, 2)
      age_points = round(max(0, age_years - AGE_REFERENCE_YEARS) * AGE_POINTS_PER_YEAR, 2)
      sex_points = SEX_POINTS_FEMALE when Patient.sex == FEMALE else SEX_POINTS_MALE
      bmi_points:
        bmi_used < 20.00              -> BMI_POINTS_UNDER_20
        20.00 <= bmi_used <= 30.00    -> BMI_POINTS_20_TO_30
        bmi_used > 30.00              -> BMI_POINTS_OVER_30
      clinical_risk_points = round(sum over the six booleans that are true of their CRF_* weight
        + (CRF_ALCOHOL when alcohol_units_per_day >= ALCOHOL_UNITS_THRESHOLD else 0), 2)
      bmd_points = round(BMD_POINTS_PER_T_UNIT * femoral_neck_t_score, 2) for WITH_BMD, else 0.00
      raw_score = round(age_points + sex_points + bmi_points + clinical_risk_points + bmd_points, 2)
      major_osteoporotic_10yr_pct =
        round(min(MAJOR_CAP_PCT, max(MAJOR_FLOOR_PCT, MAJOR_BASE_PCT + MAJOR_SLOPE_PCT * raw_score)), 1)
      hip_fracture_10yr_pct =
        round(min(HIP_CAP_PCT, max(HIP_FLOOR_PCT, HIP_BASE_PCT + HIP_SLOPE_PCT * raw_score)), 1)
      treatment_threshold_met = major_osteoporotic_10yr_pct >= TREAT_MAJOR_THRESHOLD_PCT
                                or hip_fracture_10yr_pct >= TREAT_HIP_THRESHOLD_PCT
      threshold_basis:
        both thresholds met -> BOTH
        only major met      -> MAJOR
        only hip met        -> HIP
        neither             -> NONE
      Note the sign: a negative t_score multiplied by the negative BMD_POINTS_PER_T_UNIT increases risk,
      so omitting the BMD term for an osteopenic patient lowers the probability rather than raising it.
    rounding: "bmi_used, every points term and raw_score to 2 decimal places; the two probabilities to 1 decimal place; all ROUND_HALF_UP. Each points term is rounded before summation and the clamps are applied before the final 1-decimal rounding."
    edge_cases:
      - "age_years 67, FEMALE, bmi_used 20.31, no clinical risk factors, femoral neck t_score -2.0: age_points 1.70, sex_points 0.60, bmi_points 0.00, clinical_risk_points 0.00, bmd_points 2.40, raw_score 4.70 -> major 31.2, hip 7.9, threshold_basis BOTH"
      - "the same patient WITHOUT_BMD: raw_score 2.30 -> major 16.8, hip 4.1, treatment_threshold_met still true but threshold_basis HIP only"
      - "bmi_used exactly 20.00 lands in the middle tier (0.00 points), 19.99 in the under-20 tier (0.80)"
      - "alcohol_units_per_day exactly 3.0 adds CRF_ALCOHOL; 2.9 does not"
      - "age_years below AGE_REFERENCE_YEARS clamps age_points to 0.00 rather than going negative"

  - name: interval_and_action_determination
    entity: DiagnosticReport
    output_fields: [patient_age_years, classification_basis, diagnostic_category, lsc_site_code, prior_bmd_used_g_cm2, current_bmd_used_g_cm2, bmd_change_g_cm2, bmd_change_pct, applied_lsc_g_cm2, lsc_interpretation, clinical_interval_months, payer_floor_months, recommended_interval_months, recommended_action, missing_element_codes, required_elements_complete]
    algorithm_type: constraint_propagation
    trigger_endpoints:
      - "POST /bone-density/diagnostic-reports"
      - "PATCH /bone-density/diagnostic-reports/{id}"
      - "POST /bone-density/diagnostic-reports/{id}/amend"
    inputs:
      - "the ScanSession: lowest_t_score, lowest_t_score_site, lowest_z_score, prior_session_id, prior_comparison_status, applied_lsc_g_cm2, applied_cross_cal_factor"
      - "the prior ScanSession's SiteMeasurement for lowest_t_score_site, when a prior exists"
      - "Patient.birth_date, Patient.sex, Patient.postmenopausal"
      - "the referenced FraxAssessment, when supplied"
      - "the ScanOrder.indication and the Patient's PayerPolicy interval floors"
      - "the Patient's TreatmentPlan rows"
    constants:
      T_OSTEOPOROSIS_MAX: -2.5
      T_OSTEOPENIA_MAX: -1.0
      Z_BELOW_EXPECTED_MAX: -2.0
      WHO_MALE_MIN_AGE: 50
      INTERVAL_OSTEOPOROSIS_MONTHS: 12
      INTERVAL_OSTEOPENIA_HIGH_MONTHS: 12
      INTERVAL_OSTEOPENIA_LOW_MONTHS: 24
      OSTEOPENIA_HIGH_T_CUTOFF: -2.0
      INTERVAL_NORMAL_MONTHS: 60
      INTERVAL_BELOW_EXPECTED_MONTHS: 24
      INTERVAL_WITHIN_EXPECTED_MONTHS: 60
      SIGNIFICANT_LOSS_INTERVAL_CAP_MONTHS: 12
      NOT_COMPARABLE_INTERVAL_CAP_MONTHS: 24
    formula: |
      The six steps run in exactly this order; each later step reads the earlier steps' outputs.

      STEP 1 - diagnostic_category. The WHO T-score path applies when Patient.sex == FEMALE and
        Patient.postmenopausal == true, or Patient.sex == MALE and age_years >= WHO_MALE_MIN_AGE;
        classification_basis := T_SCORE_WHO.
          lowest_t_score <= T_OSTEOPOROSIS_MAX                      -> OSTEOPOROSIS
          T_OSTEOPOROSIS_MAX < lowest_t_score <= T_OSTEOPENIA_MAX   -> OSTEOPENIA
          lowest_t_score > T_OSTEOPENIA_MAX                         -> NORMAL
        Otherwise the Z-score path applies; classification_basis := Z_SCORE_AGE_MATCHED.
          lowest_z_score <= Z_BELOW_EXPECTED_MAX -> BELOW_EXPECTED_RANGE_FOR_AGE
          else                                   -> WITHIN_EXPECTED_RANGE_FOR_AGE

      STEP 2 - lsc_interpretation. When ScanSession.prior_session_id is null:
        lsc_interpretation := NO_PRIOR and the three change fields are null.
        When prior_comparison_status == NOT_COMPARABLE_DEVICE_MISMATCH:
        lsc_interpretation := NOT_COMPARABLE_DEVICE, change fields null.
        When a comparable prior exists but it has no non-superseded SiteMeasurement for the current
        lowest_t_score_site: lsc_interpretation := NO_COMMON_SITE, change fields null.
        Otherwise, reading the prior session's SiteMeasurement for the current lowest_t_score_site:
          prior_bmd_used_g_cm2 = round(prior_bmd_g_cm2 * applied_cross_cal_factor, 4)
            where applied_cross_cal_factor is 1.0000 unless prior_comparison_status ==
            PRIOR_CROSS_CAL_ADJUSTED, in which case it is the session's snapshotted factor
          bmd_change_g_cm2 = round(current_bmd_used_g_cm2 - prior_bmd_used_g_cm2, 4)
          bmd_change_pct   = round(100 * (current_bmd_used_g_cm2 - prior_bmd_used_g_cm2) / prior_bmd_used_g_cm2, 2)
          abs(bmd_change_g_cm2) <  applied_lsc_g_cm2 -> NO_SIGNIFICANT_CHANGE
          bmd_change_g_cm2      <= -applied_lsc_g_cm2 -> SIGNIFICANT_LOSS
          bmd_change_g_cm2      >=  applied_lsc_g_cm2 -> SIGNIFICANT_GAIN
        The prior BMD is adjusted and rounded to 4 places BEFORE the difference is taken, and
        bmd_change_pct is derived in one step from the unrounded difference over the cross-cal-adjusted prior,
        not from the already-rounded bmd_change_g_cm2.

      STEP 3 - clinical_interval_months, from step 1 then capped by step 2:
          OSTEOPOROSIS                    -> INTERVAL_OSTEOPOROSIS_MONTHS
          OSTEOPENIA and lowest_t_score <= OSTEOPENIA_HIGH_T_CUTOFF -> INTERVAL_OSTEOPENIA_HIGH_MONTHS
          OSTEOPENIA otherwise            -> INTERVAL_OSTEOPENIA_LOW_MONTHS
          NORMAL                          -> INTERVAL_NORMAL_MONTHS
          BELOW_EXPECTED_RANGE_FOR_AGE    -> INTERVAL_BELOW_EXPECTED_MONTHS
          WITHIN_EXPECTED_RANGE_FOR_AGE   -> INTERVAL_WITHIN_EXPECTED_MONTHS
        then if lsc_interpretation == SIGNIFICANT_LOSS:
          clinical_interval_months := min(clinical_interval_months, SIGNIFICANT_LOSS_INTERVAL_CAP_MONTHS)
        then if lsc_interpretation IN {NOT_COMPARABLE_DEVICE, NO_COMMON_SITE}:
          clinical_interval_months := min(clinical_interval_months, NOT_COMPARABLE_INTERVAL_CAP_MONTHS)

      STEP 4 - payer_floor_months, from the ScanOrder.indication and the Patient's PayerPolicy:
          BASELINE_SCREENING, SERIAL_MONITORING -> baseline_screening_min_interval_months
          HIGH_RISK_CASE_FINDING                -> high_risk_min_interval_months
          TREATMENT_MONITORING                  -> treatment_monitoring_min_interval_months

      STEP 5 - recommended_interval_months = max(clinical_interval_months, payer_floor_months)

      STEP 6 - recommended_action, first matching branch wins:
          diagnostic_category == OSTEOPOROSIS or (a FraxAssessment is attached and its
            treatment_threshold_met == true)
              -> CONTINUE_TREATMENT when the patient already has a TreatmentPlan in
                 {ON_THERAPY, ADHERENCE_HOLD, DRUG_HOLIDAY}, else INITIATE_TREATMENT
          lsc_interpretation == SIGNIFICANT_LOSS            -> REFER_SECONDARY_WORKUP
          recommended_interval_months > clinical_interval_months -> PAYER_LIMITED_INTERVAL
          otherwise                                        -> ROUTINE_INTERVAL

      STEP 7 - missing_element_codes, in this fixed order:
          LSC_NON_COMPARABILITY_NOTE when lsc_interpretation IN {NOT_COMPARABLE_DEVICE, NO_COMMON_SITE}
            and non_comparability_note is null
          VFA_FINDINGS when ScanSession.vfa_performed is true and vfa_narrative is null
        required_elements_complete := missing_element_codes is empty.
    rounding: "prior_bmd_used_g_cm2 and bmd_change_g_cm2 to 4 decimal places, bmd_change_pct to 2 decimal places, all ROUND_HALF_UP; interval months are whole numbers with no rounding"
    edge_cases:
      - "lowest_t_score exactly -2.5 -> OSTEOPOROSIS, because the boundary is inclusive on the osteoporosis side; -2.4 -> OSTEOPENIA"
      - "lowest_t_score exactly -1.0 -> OSTEOPENIA, not NORMAL"
      - "OSTEOPENIA at exactly -2.0 takes the 12-month branch"
      - "prior TOTAL_HIP 0.7000 with cross-cal factor 0.9804 gives cross-cal-adjusted prior 0.6863; a current 0.6700 is a change of -0.0163 against an LSC of 0.0277 -> NO_SIGNIFICANT_CHANGE, whereas differencing against the unadjusted 0.7000 would wrongly report -0.0300 SIGNIFICANT_LOSS"
      - "a change of exactly -0.0277 against an LSC of 0.0277 -> SIGNIFICANT_LOSS; -0.0276 -> NO_SIGNIFICANT_CHANGE"
      - "OSTEOPOROSIS with a 24-month payer floor gives recommended_interval_months 24 but recommended_action INITIATE_TREATMENT, not PAYER_LIMITED_INTERVAL, because step 6 stops at the first matching branch"
      - "an osteopenic patient whose FRAX crosses only the hip threshold still yields INITIATE_TREATMENT"

  - name: order_frequency_eligibility
    entity: ScanOrder
    output_fields: [frequency_eligibility, earliest_allowed_date, payer_floor_months, denial_reason_code]
    algorithm_type: forward_looking
    trigger_endpoints:
      - "POST /bone-density/scan-orders"
      - "POST /bone-density/diagnostic-reports/{id}/finalize"
    inputs:
      - "requested_scan_date (input)"
      - "Patient.next_eligible_scan_date and Patient.lifetime_screening_scan_count"
      - "the Patient's PayerPolicy: repeat_scan_grace_days, max_lifetime_screening_scans, appeal_allowed"
    constants: {}
    formula: |
      if Patient.lifetime_screening_scan_count >= PayerPolicy.max_lifetime_screening_scans:
          frequency_eligibility := INELIGIBLE_LIFETIME_CAP; earliest_allowed_date := Patient.next_eligible_scan_date
      elif Patient.next_eligible_scan_date is null:
          frequency_eligibility := ELIGIBLE; earliest_allowed_date := null
      else:
          earliest_allowed_date := Patient.next_eligible_scan_date
          requested_scan_date >= earliest_allowed_date                                              -> ELIGIBLE
          requested_scan_date >= earliest_allowed_date - PayerPolicy.repeat_scan_grace_days (days)   -> ELIGIBLE_WITH_GRACE
          otherwise                                                                                  -> INELIGIBLE_TOO_SOON
      On POST /bone-density/scan-orders, an ineligible verdict rejects the request with
      ERR_PAYER_FREQUENCY_LIMIT or ERR_LIFETIME_SCAN_CAP_EXCEEDED when PayerPolicy.appeal_allowed
      is false; when it is true the order is created in status DENIED with denial_reason_code
      PAYER_FREQUENCY_LIMIT or LIFETIME_CAP_EXCEEDED.
      During a report-finalize cascade the same function is re-evaluated for every REQUESTED or
      SCHEDULED order of the patient against the newly written next_eligible_scan_date, and
      appeal_allowed is irrelevant: an ineligible verdict always denies the existing order with
      denial_reason_code INTERVAL_REVISED_BY_REPORT (too soon) or LIFETIME_CAP_EXCEEDED.
    rounding: "date arithmetic only; the grace window is counted in whole days and both comparisons are inclusive"
    edge_cases:
      - "requested_scan_date exactly equal to earliest_allowed_date -> ELIGIBLE"
      - "requested_scan_date exactly grace_days before earliest_allowed_date -> ELIGIBLE_WITH_GRACE; one day earlier -> INELIGIBLE_TOO_SOON"
      - "the lifetime cap is checked first, so a patient at the cap is INELIGIBLE_LIFETIME_CAP even when the requested date is years past earliest_allowed_date"
      - "an order created ELIGIBLE can later be DENIED without any further request, because finalizing a report moves next_eligible_scan_date forward under it"

  - name: medication_possession_ratio
    entity: TreatmentPlan
    output_fields: [medication_possession_ratio, adherence_status, adherence_window_days, covered_days_supplied, denosumab_gap_days, holiday_eligible]
    algorithm_type: aggregation
    trigger_endpoints:
      - "POST /bone-density/treatment-plans/{id}/adherence-review"
    variants:
      - name: CLAIMS_ONLY
        selected_when: "TreatmentPlan.adherence_source_policy == CLAIMS_ONLY (the default)"
        difference: "AdherenceRefill rows with source == PATIENT_REPORT are excluded from covered_days_supplied entirely"
      - name: ALL_SOURCES_WEIGHTED
        selected_when: "TreatmentPlan.adherence_source_policy == ALL_SOURCES_WEIGHTED"
        difference: "PATIENT_REPORT rows contribute days_supplied * REFILL_PATIENT_REPORT_WEIGHT"
    inputs:
      - "every AdherenceRefill on this plan"
      - "TreatmentPlan.start_date, drug_class, adherence_source_policy, cumulative_therapy_months, consecutive_nonadherent_reviews"
      - "the logical clock date as the window end"
    constants:
      REFILL_PHARMACY_CLAIM_WEIGHT: 1.0
      REFILL_PATIENT_REPORT_WEIGHT: 0.5
      MPR_CAP: 1.5
      MPR_ADHERENT_MIN: 0.800
      MPR_PARTIAL_MIN: 0.500
      DENOSUMAB_MAX_GAP_DAYS: 210
      HOLIDAY_MIN_THERAPY_MONTHS: 60
      HOLIDAY_REVIEW_INTERVAL_MONTHS: 24
      MAX_CONSECUTIVE_NONADHERENT_REVIEWS: 2
      FOLLOWUP_EARLY_WINDOW_DAYS: 7
    formula: |
      window_start = TreatmentPlan.start_date
      window_end   = the logical clock date at review time
      adherence_window_days  = whole days from window_start to window_end
      Eligible refills: dispensed_date >= window_start and dispensed_date < window_end; the entity
        already forbids a dispensed_date at or after the clock date, so the half-open end is never contested
        (half-open, so a refill dispensed on the review date itself is excluded)
      covered_days_supplied = sum over eligible refills of days_supplied * weight, where the weight is
        REFILL_PHARMACY_CLAIM_WEIGHT for PHARMACY_CLAIM and REFILL_PATIENT_REPORT_WEIGHT for
        PATIENT_REPORT under ALL_SOURCES_WEIGHTED; PATIENT_REPORT rows are dropped under CLAIMS_ONLY.
        Overlapping coverage is deliberately NOT de-duplicated; two refills covering the same days
        both count, which is what MPR_CAP exists to bound.
      medication_possession_ratio = round(min(MPR_CAP, covered_days_supplied / adherence_window_days), 3)
      adherence_status:
        medication_possession_ratio >= MPR_ADHERENT_MIN                      -> ADHERENT
        MPR_PARTIAL_MIN <= medication_possession_ratio < MPR_ADHERENT_MIN    -> PARTIAL
        medication_possession_ratio < MPR_PARTIAL_MIN                        -> NON_ADHERENT
      denosumab_gap_days = whole days from the latest eligible refill's
        (dispensed_date + days_supplied) to window_end, floored at 0; null when drug_class is not
        DENOSUMAB or no eligible refill exists. When drug_class == DENOSUMAB and
        denosumab_gap_days > DENOSUMAB_MAX_GAP_DAYS the plan is forced to ADHERENCE_HOLD with
        adherence_status overridden to NON_ADHERENT regardless of the computed medication_possession_ratio.
      holiday_eligible = drug_class IN {BISPHOSPHONATE_ORAL, BISPHOSPHONATE_IV}
        and TreatmentPlan.cumulative_therapy_months >= HOLIDAY_MIN_THERAPY_MONTHS
        and the ScanSession behind Patient.last_finalized_report_id has lowest_t_score > -2.5
      A review is only accepted when the clock date is at or after
      next_followup_due_date - FOLLOWUP_EARLY_WINDOW_DAYS, otherwise ERR_FOLLOWUP_NOT_DUE.
    rounding: "medication_possession_ratio to 3 decimal places, ROUND_HALF_UP, after the MPR_CAP clamp; covered_days_supplied keeps one decimal place because of the 0.5 weight; adherence_window_days and denosumab_gap_days are whole days"
    edge_cases:
      - "medication_possession_ratio exactly 0.800 -> ADHERENT; 0.799 -> PARTIAL"
      - "medication_possession_ratio exactly 0.500 -> PARTIAL; 0.499 -> NON_ADHERENT"
      - "a 91-day window with two 30-day PHARMACY_CLAIM refills and one 30-day PATIENT_REPORT refill gives CLAIMS_ONLY 0.659 (PARTIAL) and ALL_SOURCES_WEIGHTED 0.824 (ADHERENT) from identical stored rows"
      - "a 90-day window with 42 + 30 claim days gives exactly 0.800"
      - "days_supplied totalling more than the window is clamped at MPR_CAP 1.5, so 200 supplied days over a 91-day window yields 1.500, not 2.198"
      - "a DENOSUMAB plan can be forced to ADHERENCE_HOLD at medication_possession_ratio 1.000 when the last injection lapsed more than 210 days ago"

  - name: positioning_severity_and_outcome
    entity: PositioningReview
    output_fields: [severity_score, repeat_criterion_met, outcome]
    algorithm_type: weighted_scoring
    trigger_endpoints:
      - "POST /bone-density/scan-sessions/{id}/positioning-reviews"
    inputs:
      - "defect_codes (input)"
      - "ScanSession.repeat_count"
    constants:
      DEFECT_WEIGHT_ROTATION_FEMUR: 3
      DEFECT_WEIGHT_INCORRECT_ROI: 3
      DEFECT_WEIGHT_INADEQUATE_SCAN_LENGTH: 3
      DEFECT_WEIGHT_ABDUCTION_FEMUR: 2
      DEFECT_WEIGHT_SPINE_NOT_STRAIGHT: 2
      DEFECT_WEIGHT_MOTION_ARTIFACT: 2
      DEFECT_WEIGHT_ARTIFACT_IN_FIELD: 1
      POSITIONING_REPEAT_THRESHOLD: 3
      MAX_POSITIONING_REPEATS: 2
    formula: |
      severity_score = sum of DEFECT_WEIGHT_<code> over the distinct codes in defect_codes; 0 for an empty array
      repeat_criterion_met = severity_score >= POSITIONING_REPEAT_THRESHOLD
      outcome:
        repeat_criterion_met == false                                            -> ACCEPTED
        repeat_criterion_met and ScanSession.repeat_count <  MAX_POSITIONING_REPEATS -> REPEAT_REQUIRED
        repeat_criterion_met and ScanSession.repeat_count >= MAX_POSITIONING_REPEATS -> ACCEPTED_WITH_LIMITATION
      The outcome is copied onto ScanSession.review_status, so the identical defect set yields a
      different session state depending on how many repeats have already been consumed.
    rounding: "integer arithmetic only; no rounding"
    edge_cases:
      - "a single ARTIFACT_IN_FIELD scores 1 -> ACCEPTED"
      - "ARTIFACT_IN_FIELD plus MOTION_ARTIFACT scores exactly 3 -> REPEAT_REQUIRED at the threshold"
      - "a single ROTATION_FEMUR scores exactly 3 -> REPEAT_REQUIRED"
      - "the same three-point defect set at repeat_count 2 yields ACCEPTED_WITH_LIMITATION, terminating the repeat loop instead of extending it"
      - "an empty defect_codes array scores 0 and is a valid ACCEPTED review, not an ERR_INVALID_REQUEST"

  - name: vfa_eligibility_and_grading
    entity: ScanSession
    output_fields: [vfa_performed, vfa_eligibility_code, vfa_max_genant_grade, vfa_fracture_count]
    algorithm_type: threshold
    trigger_endpoints:
      - "POST /bone-density/scan-sessions/{id}/vfa"
    inputs:
      - "genant_grades (input array of integers 0..3, one per assessed vertebral level)"
      - "Patient.baseline_height_cm, Patient.birth_date"
      - "the patient's ACTIVE RiskFactorProfile: height_cm, glucocorticoid_use, prior_fragility_fracture"
      - "the patient's PayerPolicy: vfa_covered, vfa_requires_height_loss_cm"
      - "the owning ScanOrder.vfa_requested"
    constants:
      VFA_AGE_THRESHOLD_YEARS: 70
      GENANT_FRACTURE_MIN_GRADE: 1
    formula: |
      Checks run in this order, and the first failure wins:
        ScanOrder.vfa_requested == false                     -> ERR_VFA_NOT_ORDERED (409)
        no eligibility branch matches                        -> ERR_VFA_NOT_ELIGIBLE (409)
        PayerPolicy.vfa_covered == false                     -> ERR_VFA_NOT_COVERED (402)
      height_loss_cm = round(Patient.baseline_height_cm - ACTIVE RiskFactorProfile.height_cm, 1)
      vfa_eligibility_code, first matching branch:
        height_loss_cm >= PayerPolicy.vfa_requires_height_loss_cm -> ELIGIBLE_HEIGHT_LOSS
        ACTIVE RiskFactorProfile.glucocorticoid_use == true       -> ELIGIBLE_GLUCOCORTICOID
        age_years >= VFA_AGE_THRESHOLD_YEARS                      -> ELIGIBLE_AGE_THRESHOLD
        otherwise                                                -> NOT_ELIGIBLE, and the call is rejected
      vfa_max_genant_grade = max(genant_grades)
      vfa_fracture_count   = count of entries >= GENANT_FRACTURE_MIN_GRADE
      vfa_performed := true
      Setting vfa_performed to true makes the report's vfa_narrative a mandatory element at
      finalization via required_elements_complete, whatever the grades are, and a
      prior_fragility_fracture recorded on the ACTIVE profile is what a grade >= 2 clinically
      implies, but the profile is never mutated by this call.
    rounding: "height_loss_cm to 1 decimal place, ROUND_HALF_UP; grades and counts are integers"
    edge_cases:
      - "height_loss_cm exactly equal to vfa_requires_height_loss_cm -> ELIGIBLE_HEIGHT_LOSS"
      - "height_loss_cm 3.9 against a 4.0 requirement falls through to the glucocorticoid and age branches"
      - "age_years exactly 70 -> ELIGIBLE_AGE_THRESHOLD; 69 with no other qualifier -> ERR_VFA_NOT_ELIGIBLE"
      - "an all-zero genant_grades array is valid: vfa_max_genant_grade 0 and vfa_fracture_count 0"
      - "an ineligible patient on a policy that does not cover VFA gets ERR_VFA_NOT_ELIGIBLE (priority 46), not ERR_VFA_NOT_COVERED (priority 65): the fiscal check runs last"
validations:
  - priority: 1
    category: auth
    applies_to: "every endpoint"
    condition: "X-User-ID or X-User-Role header is missing or empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
  - priority: 2
    category: rbac
    applies_to: "every endpoint"
    condition: "X-User-Role is not a recognised role, or is not listed in the endpoint's roles column"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
  - priority: 3
    category: business_constraint
    applies_to: "every write endpoint"
    condition: "a required body field is absent, a field has the wrong JSON type, an enum value is outside its declared set, a numeric field is outside its declared range, or a date/instant string is not valid ISO-8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
  - priority: 4
    category: existence
    applies_to: "every endpoint whose path contains a densitometer id"
    condition: "no Densitometer with that id exists"
    error_id: ERR_DENSITOMETER_NOT_FOUND
    http_status: 404
  - priority: 5
    category: existence
    applies_to: "GET /bone-density/qc-runs/{id}"
    condition: "no QcRun with that id exists"
    error_id: ERR_QC_RUN_NOT_FOUND
    http_status: 404
  - priority: 6
    category: existence
    applies_to: "GET /bone-density/calibration-events/{id}, POST /bone-density/calibration-events/{id}/close, POST /bone-density/calibration-events/{id}/adjudicate"
    condition: "no CalibrationEvent with that id exists"
    error_id: ERR_CALIBRATION_EVENT_NOT_FOUND
    http_status: 404
  - priority: 7
    category: existence
    applies_to: "every endpoint whose path contains a patient id"
    condition: "no Patient with that id exists"
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
  - priority: 8
    category: existence
    applies_to: "GET /bone-density/scan-orders/{id}"
    condition: "no ScanOrder with that id exists"
    error_id: ERR_SCAN_ORDER_NOT_FOUND
    http_status: 404
  - priority: 9
    category: existence
    applies_to: "every endpoint whose path contains a scan appointment id"
    condition: "no ScanAppointment with that id exists"
    error_id: ERR_SCAN_APPOINTMENT_NOT_FOUND
    http_status: 404
  - priority: 10
    category: existence
    applies_to: "every endpoint whose path contains a scan session id"
    condition: "no ScanSession with that id exists"
    error_id: ERR_SCAN_SESSION_NOT_FOUND
    http_status: 404
  - priority: 11
    category: existence
    applies_to: "GET /bone-density/frax-assessments/{id}"
    condition: "no FraxAssessment with that id exists"
    error_id: ERR_FRAX_ASSESSMENT_NOT_FOUND
    http_status: 404
  - priority: 12
    category: existence
    applies_to: "every endpoint whose path contains a diagnostic report id"
    condition: "no DiagnosticReport with that id exists"
    error_id: ERR_DIAGNOSTIC_REPORT_NOT_FOUND
    http_status: 404
  - priority: 13
    category: existence
    applies_to: "every endpoint whose path contains a treatment plan id"
    condition: "no TreatmentPlan with that id exists"
    error_id: ERR_TREATMENT_PLAN_NOT_FOUND
    http_status: 404
  - priority: 14
    category: existence
    applies_to: "POST /bone-density/patients"
    condition: "primary_payer_policy_id does not reference an existing PayerPolicy"
    error_id: ERR_PAYER_POLICY_NOT_FOUND
    http_status: 404
  - priority: 15
    category: existence
    applies_to: "POST /bone-density/frax-assessments"
    condition: "risk_factor_profile_id does not reference an existing RiskFactorProfile"
    error_id: ERR_RISK_FACTOR_PROFILE_NOT_FOUND
    http_status: 404
  - priority: 16
    category: existence
    applies_to: "POST /bone-density/scan-orders, POST /bone-density/scan-appointments, POST /bone-density/frax-assessments, POST /bone-density/diagnostic-reports, PATCH /bone-density/diagnostic-reports/{id}, POST /bone-density/treatment-plans, POST /bone-density/densitometers/{id}/qc-runs"
    condition: "a body foreign key (patient_id, scan_order_id, densitometer_id, scan_session_id, frax_assessment_id, initiating_report_id, calibration_event_id) does not reference an existing row; the error is the NOT_FOUND code of the referenced entity"
    error_id: ERR_SCAN_SESSION_NOT_FOUND
    http_status: 404
    note: "Body-FK misses reuse the same per-entity NOT_FOUND codes declared at priorities 4-15; body FKs are checked after every path parameter, in the field order given in the endpoint's input column."
  - priority: 17
    category: ownership
    applies_to: "GET /bone-density/patients/{id}, GET /bone-density/patients/{id}/risk-factor-profiles, GET /bone-density/scan-orders, GET /bone-density/diagnostic-reports, GET /bone-density/treatment-plans/{id}, GET /bone-density/treatment-plans/{id}/adherence-refills, POST /bone-density/treatment-plans/{id}/adherence-refills"
    condition: "X-User-Role is PatientPortalUser and X-User-ID is not the Patient.id that owns the addressed resource"
    error_id: ERR_PATIENT_SCOPE_VIOLATION
    http_status: 403
  - priority: 18
    category: concurrency
    applies_to: "POST /bone-density/patients/{id}/risk-factor-profiles"
    condition: "expected_patient_version does not equal the Patient's current version"
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
  - priority: 19
    category: concurrency
    applies_to: "POST /bone-density/densitometers/{id}/precision-assessment"
    condition: "expected_densitometer_version does not equal the Densitometer's current version"
    error_id: ERR_STALE_DENSITOMETER_VERSION
    http_status: 412
  - priority: 20
    category: state
    applies_to: "POST /bone-density/densitometers/{id}/qc-runs, POST /bone-density/densitometers/{id}/calibration-events, POST /bone-density/densitometers/{id}/precision-assessment, POST /bone-density/densitometers/{id}/retire, POST /bone-density/scan-appointments, POST /bone-density/scan-appointments/{id}/scan-sessions"
    condition: "the addressed Densitometer has status RETIRED"
    error_id: ERR_DENSITOMETER_RETIRED
    http_status: 409
  - priority: 21
    category: state
    applies_to: "POST /bone-density/scan-appointments/{id}/scan-sessions"
    condition: "the appointment's Densitometer has status QC_HOLD or CROSS_CAL_PENDING"
    error_id: ERR_DENSITOMETER_NOT_ACTIVE
    http_status: 409
  - priority: 22
    category: state
    applies_to: "POST /bone-density/calibration-events/{id}/close"
    condition: "the CalibrationEvent status is not OPEN"
    error_id: ERR_CALIBRATION_EVENT_NOT_OPEN
    http_status: 409
  - priority: 23
    category: state
    applies_to: "POST /bone-density/calibration-events/{id}/adjudicate"
    condition: "the CalibrationEvent status is not PHANTOM_SET_COMPLETE"
    error_id: ERR_CALIBRATION_EVENT_NOT_CLOSED
    http_status: 409
  - priority: 24
    category: state
    applies_to: "POST /bone-density/scan-appointments"
    condition: "the referenced ScanOrder status is not REQUESTED"
    error_id: ERR_ORDER_NOT_SCHEDULABLE
    http_status: 409
  - priority: 25
    category: state
    applies_to: "POST /bone-density/scan-appointments/{id}/cancel, POST /bone-density/scan-appointments/{id}/scan-sessions"
    condition: "the ScanAppointment status is not BOOKED"
    error_id: ERR_APPOINTMENT_NOT_BOOKED
    http_status: 409
  - priority: 26
    category: state
    applies_to: "POST /bone-density/scan-sessions/{id}/site-measurements, POST /bone-density/scan-sessions/{id}/vfa, POST /bone-density/scan-sessions/{id}/submit-acquisition"
    condition: "the ScanSession acquisition_status is neither IN_PROGRESS nor ARCHIVED (the ARCHIVED case falls through to the priority 30 archived check)"
    error_id: ERR_SESSION_NOT_IN_PROGRESS
    http_status: 409
  - priority: 27
    category: state
    applies_to: "POST /bone-density/scan-sessions/{id}/positioning-reviews, POST /bone-density/diagnostic-reports"
    condition: "the ScanSession acquisition_status is neither SUBMITTED nor ARCHIVED (the ARCHIVED case falls through to the priority 30 archived check)"
    error_id: ERR_SESSION_NOT_SUBMITTED
    http_status: 409
  - priority: 28
    category: state
    applies_to: "POST /bone-density/scan-sessions/{id}/positioning-reviews"
    condition: "the ScanSession review_status is not NOT_REVIEWED"
    error_id: ERR_SESSION_ALREADY_REVIEWED
    http_status: 409
  - priority: 29
    category: state
    applies_to: "POST /bone-density/scan-sessions/{id}/repeat-acquisition"
    condition: "the ScanSession review_status is neither REPEAT_REQUIRED nor ACCEPTED_WITH_LIMITATION (the ACCEPTED_WITH_LIMITATION case falls through to the priority 40 repeat-limit check)"
    error_id: ERR_SESSION_REPEAT_NOT_REQUIRED
    http_status: 409
  - priority: 30
    category: state
    applies_to: "POST /bone-density/scan-sessions/{id}/site-measurements, POST /bone-density/scan-sessions/{id}/vfa, POST /bone-density/scan-sessions/{id}/positioning-reviews, POST /bone-density/scan-sessions/{id}/repeat-acquisition, POST /bone-density/diagnostic-reports"
    condition: "the ScanSession acquisition_status is ARCHIVED"
    error_id: ERR_SESSION_ARCHIVED
    http_status: 409
  - priority: 31
    category: state
    applies_to: "PATCH /bone-density/diagnostic-reports/{id}, POST /bone-density/diagnostic-reports/{id}/finalize"
    condition: "the DiagnosticReport status is not DRAFT"
    error_id: ERR_REPORT_NOT_DRAFT
    http_status: 409
  - priority: 32
    category: state
    applies_to: "POST /bone-density/diagnostic-reports/{id}/amend, POST /bone-density/treatment-plans"
    condition: "the DiagnosticReport status is not FINALIZED"
    error_id: ERR_REPORT_NOT_FINALIZED
    http_status: 409
  - priority: 33
    category: state
    applies_to: "POST /bone-density/diagnostic-reports, POST /bone-density/diagnostic-reports/{id}/amend"
    condition: "another DiagnosticReport on the same scan_session_id is already in status DRAFT"
    error_id: ERR_REPORT_ALREADY_EXISTS
    http_status: 409
  - priority: 34
    category: state
    applies_to: "POST /bone-density/treatment-plans/{id}/adherence-refills, POST /bone-density/treatment-plans/{id}/adherence-review"
    condition: "the TreatmentPlan status is DISCONTINUED"
    error_id: ERR_TREATMENT_PLAN_TERMINAL
    http_status: 409
  - priority: 35
    category: business_safety
    applies_to: "POST /bone-density/scan-sessions/{id}/positioning-reviews"
    condition: "X-User-ID equals the ScanSession.technologist_user_id who acquired the images"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
  - priority: 36
    category: business_safety
    applies_to: "POST /bone-density/scan-sessions/{id}/site-measurements, POST /bone-density/scan-sessions/{id}/vfa, POST /bone-density/scan-sessions/{id}/submit-acquisition, POST /bone-density/scan-sessions/{id}/repeat-acquisition"
    condition: "X-User-Role is Technologist and X-User-ID is not the ScanSession.technologist_user_id"
    error_id: ERR_NOT_SESSION_TECHNOLOGIST
    http_status: 403
  - priority: 37
    category: business_safety
    applies_to: "POST /bone-density/scan-appointments/{id}/scan-sessions"
    condition: "the appointment's Densitometer has lsc_g_cm2 null, i.e. no precision assessment has ever been accepted for it"
    error_id: ERR_DEVICE_PRECISION_NOT_CERTIFIED
    http_status: 409
  - priority: 38
    category: business_safety
    applies_to: "POST /bone-density/scan-appointments"
    condition: "the ScanOrder has a non-null required_densitometer_id that differs from the requested densitometer_id"
    error_id: ERR_SERIAL_DEVICE_MISMATCH
    http_status: 409
  - priority: 39
    category: business_safety
    applies_to: "POST /bone-density/diagnostic-reports/{id}/finalize"
    condition: "the ScanSession review_status is not ACCEPTED and not ACCEPTED_WITH_LIMITATION"
    error_id: ERR_POSITIONING_NOT_ACCEPTED
    http_status: 409
  - priority: 40
    category: business_safety
    applies_to: "POST /bone-density/scan-sessions/{id}/repeat-acquisition"
    condition: "the ScanSession repeat_count is already at MAX_POSITIONING_REPEATS"
    error_id: ERR_REPEAT_LIMIT_EXCEEDED
    http_status: 409
  - priority: 41
    category: business_safety
    applies_to: "POST /bone-density/densitometers/{id}/precision-assessment"
    condition: "patient_count * (scans_per_patient - 1) is below MIN_PRECISION_DOF"
    error_id: ERR_PRECISION_STUDY_UNDERPOWERED
    http_status: 422
  - priority: 42
    category: business_referential
    applies_to: "POST /bone-density/scan-sessions/{id}/vfa"
    condition: "the owning ScanOrder has vfa_requested false"
    error_id: ERR_VFA_NOT_ORDERED
    http_status: 409
  - priority: 43
    category: business_referential
    applies_to: "POST /bone-density/frax-assessments"
    condition: "the referenced RiskFactorProfile.patient_id, or the referenced ScanSession.patient_id, differs from the supplied patient_id"
    error_id: ERR_FRAX_PATIENT_MISMATCH
    http_status: 409
  - priority: 44
    category: business_referential
    applies_to: "POST /bone-density/frax-assessments"
    condition: "the referenced RiskFactorProfile has status SUPERSEDED"
    error_id: ERR_RISK_PROFILE_NOT_ACTIVE
    http_status: 409
  - priority: 45
    category: business_referential
    applies_to: "POST /bone-density/frax-assessments"
    condition: "scan_session_id is supplied but that session has no non-superseded usable FEMORAL_NECK SiteMeasurement, so the WITH_BMD variant cannot be computed"
    error_id: ERR_FEMORAL_NECK_REQUIRED
    http_status: 422
  - priority: 46
    category: business_constraint
    applies_to: "POST /bone-density/scan-sessions/{id}/vfa"
    condition: "the patient's height loss (Patient.baseline_height_cm minus the ACTIVE RiskFactorProfile.height_cm) is below PayerPolicy.vfa_requires_height_loss_cm, the ACTIVE profile has glucocorticoid_use false, and the patient's age_years is below VFA_AGE_THRESHOLD_YEARS, so no vfa_eligibility_code branch matches"
    error_id: ERR_VFA_NOT_ELIGIBLE
    http_status: 409
  - priority: 47
    category: business_constraint
    applies_to: "POST /bone-density/scan-sessions/{id}/site-measurements"
    condition: "site_code is LUMBAR_SPINE and included_vertebrae has fewer than MIN_VALID_VERTEBRAE entries, or contains a duplicate vertebra label"
    error_id: ERR_INSUFFICIENT_VALID_VERTEBRAE
    http_status: 422
  - priority: 48
    category: business_constraint
    applies_to: "POST /bone-density/scan-sessions/{id}/site-measurements"
    condition: "a non-superseded SiteMeasurement with the same site_code already exists on this session"
    error_id: ERR_DUPLICATE_SITE_MEASUREMENT
    http_status: 409
  - priority: 49
    category: business_constraint
    applies_to: "POST /bone-density/scan-sessions/{id}/submit-acquisition"
    condition: "the session has zero non-superseded SiteMeasurement rows"
    error_id: ERR_NO_SITE_MEASUREMENTS
    http_status: 422
  - priority: 50
    category: business_constraint
    applies_to: "POST /bone-density/scan-sessions/{id}/submit-acquisition"
    condition: "at least one site_code in the owning ScanOrder.requested_sites has no non-superseded SiteMeasurement on this session"
    error_id: ERR_REQUESTED_SITES_INCOMPLETE
    http_status: 422
  - priority: 51
    category: business_constraint
    applies_to: "POST /bone-density/calibration-events/{id}/close"
    condition: "the event has fewer than required_phantom_runs QcRun rows with purpose CROSS_CAL_BASELINE, or fewer than required_phantom_runs with purpose CROSS_CAL_NEW"
    error_id: ERR_PHANTOM_SET_INCOMPLETE
    http_status: 409
  - priority: 52
    category: business_constraint
    applies_to: "POST /bone-density/densitometers"
    condition: "serial_number is already used by another Densitometer"
    error_id: ERR_SERIAL_NUMBER_TAKEN
    http_status: 409
  - priority: 53
    category: business_constraint
    applies_to: "POST /bone-density/patients"
    condition: "mrn is already used by another Patient"
    error_id: ERR_MRN_TAKEN
    http_status: 409
  - priority: 54
    category: business_constraint
    applies_to: "POST /bone-density/payer-policies"
    condition: "payer_code is already used by another PayerPolicy"
    error_id: ERR_PAYER_CODE_TAKEN
    http_status: 409
  - priority: 55
    category: business_constraint
    applies_to: "POST /bone-density/diagnostic-reports/{id}/finalize"
    condition: "required_elements_complete is false: the report's lsc_interpretation is NOT_COMPARABLE_DEVICE or NO_COMMON_SITE and non_comparability_note is null, or ScanSession.vfa_performed is true and vfa_narrative is null"
    error_id: ERR_REPORT_ELEMENTS_INCOMPLETE
    http_status: 422
  - priority: 56
    category: business_temporal
    applies_to: "POST /bone-density/scan-appointments"
    condition: "end_utc is not strictly after start_utc"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
  - priority: 57
    category: business_temporal
    applies_to: "POST /bone-density/scan-appointments"
    condition: "start_utc is at or before the logical clock"
    error_id: ERR_APPOINTMENT_IN_PAST
    http_status: 422
  - priority: 58
    category: business_temporal
    applies_to: "POST /bone-density/scan-appointments"
    condition: "an existing ScanAppointment on the same densitometer_id with status BOOKED or CHECKED_IN overlaps the requested window once the device's appointment_buffer_minutes is applied on both sides: new.start_utc < existing.end_utc + buffer AND existing.start_utc < new.end_utc + buffer"
    error_id: ERR_DEVICE_SLOT_CONFLICT
    http_status: 409
  - priority: 59
    category: business_temporal
    applies_to: "POST /bone-density/scan-appointments"
    condition: "the patient already has a ScanAppointment with status BOOKED or CHECKED_IN whose start_utc falls on the same UTC calendar date as the requested start_utc"
    error_id: ERR_PATIENT_DOUBLE_BOOKED
    http_status: 409
  - priority: 60
    category: business_temporal
    applies_to: "POST /bone-density/scan-appointments"
    condition: "the densitometer already has daily_scan_capacity appointments with status BOOKED, CHECKED_IN or COMPLETED whose start_utc falls on the requested UTC calendar date"
    error_id: ERR_DEVICE_DAILY_CAPACITY_FULL
    http_status: 409
  - priority: 61
    category: business_temporal
    applies_to: "POST /bone-density/treatment-plans/{id}/adherence-refills"
    condition: "dispensed_date is before TreatmentPlan.start_date or after the logical clock date"
    error_id: ERR_REFILL_DATE_OUT_OF_WINDOW
    http_status: 422
  - priority: 62
    category: business_temporal
    applies_to: "POST /bone-density/treatment-plans/{id}/adherence-review"
    condition: "the logical clock date is earlier than next_followup_due_date minus FOLLOWUP_EARLY_WINDOW_DAYS"
    error_id: ERR_FOLLOWUP_NOT_DUE
    http_status: 409
  - priority: 63
    category: business_fiscal
    applies_to: "POST /bone-density/scan-orders"
    condition: "order_frequency_eligibility returns INELIGIBLE_TOO_SOON and PayerPolicy.appeal_allowed is false"
    error_id: ERR_PAYER_FREQUENCY_LIMIT
    http_status: 402
  - priority: 64
    category: business_fiscal
    applies_to: "POST /bone-density/scan-orders"
    condition: "order_frequency_eligibility returns INELIGIBLE_LIFETIME_CAP and PayerPolicy.appeal_allowed is false"
    error_id: ERR_LIFETIME_SCAN_CAP_EXCEEDED
    http_status: 402
  - priority: 65
    category: business_fiscal
    applies_to: "POST /bone-density/scan-sessions/{id}/vfa"
    condition: "the patient's PayerPolicy has vfa_covered false"
    error_id: ERR_VFA_NOT_COVERED
    http_status: 402

endpoints:
  - method: GET
    path: "/bone-density/densitometers/{id}"
    roles: [ProgramAdmin, Scheduler, Technologist, QualityReviewer, InterpretingPhysician]
    input: []
    output: Densitometer
    side_effects: []
    description: "Single densitometer with its live QC, precision and calibration state."
  - method: GET
    path: "/bone-density/densitometers"
    roles: [ProgramAdmin, Scheduler, Technologist, QualityReviewer, InterpretingPhysician]
    input: ["status?", "site_code?", "limit?", "offset?"]
    output: "Densitometer[]"
    side_effects: []
    description: "Paginated device inventory, ordered created_at ASC then id ASC."
  - method: GET
    path: "/bone-density/qc-runs/{id}"
    roles: [ProgramAdmin, Technologist, QualityReviewer]
    input: []
    output: QcRun
    side_effects: []
    description: "Single phantom QC run with its deviation, result and shift verdict."
  - method: GET
    path: "/bone-density/qc-runs"
    roles: [ProgramAdmin, Technologist, QualityReviewer]
    input: ["densitometer_id?", "calibration_event_id?", "purpose?", "result?", "limit?", "offset?"]
    output: "QcRun[]"
    side_effects: []
    description: "QC control chart. Ordered performed_at_utc DESC then created_at DESC. Covers reverse lookup for QcRun.densitometer_id and QcRun.calibration_event_id."
  - method: GET
    path: "/bone-density/calibration-events/{id}"
    roles: [ProgramAdmin, Technologist, QualityReviewer, InterpretingPhysician]
    input: []
    output: CalibrationEvent
    side_effects: []
    description: "Single cross-calibration event with its phantom means, percent difference and outcome."
  - method: GET
    path: "/bone-density/densitometers/{id}/calibration-events"
    roles: [ProgramAdmin, Technologist, QualityReviewer, InterpretingPhysician]
    input: ["status?", "limit?", "offset?"]
    output: "CalibrationEvent[]"
    side_effects: []
    description: "Calibration history of one device, ordered created_at DESC. Covers reverse lookup for CalibrationEvent.densitometer_id."
  - method: GET
    path: "/bone-density/patients/{id}"
    roles: [ProgramAdmin, Scheduler, Technologist, QualityReviewer, InterpretingPhysician, PatientPortalUser]
    input: []
    output: Patient
    side_effects: []
    description: "Single patient with the derived screening counters. PatientPortalUser may read only its own record."
  - method: GET
    path: "/bone-density/patients"
    roles: [ProgramAdmin, Scheduler, InterpretingPhysician]
    input: ["primary_payer_policy_id?", "baseline_report_id?", "last_finalized_report_id?", "mrn?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []
    description: "Paginated patient roster, ordered created_at ASC then id ASC. Covers reverse lookup for Patient.primary_payer_policy_id, Patient.baseline_report_id and Patient.last_finalized_report_id."
  - method: GET
    path: "/bone-density/patients/{id}/risk-factor-profiles"
    roles: [ProgramAdmin, Scheduler, InterpretingPhysician, PatientPortalUser]
    input: ["status?", "limit?", "offset?"]
    output: "RiskFactorProfile[]"
    side_effects: []
    description: "Clinical risk factor history of one patient, ordered recorded_at_utc DESC then created_at DESC. Covers reverse lookup for RiskFactorProfile.patient_id."
  - method: GET
    path: "/bone-density/payer-policies/{id}"
    roles: [ProgramAdmin, Scheduler, InterpretingPhysician]
    input: []
    output: PayerPolicy
    side_effects: []
    description: "Single payer policy with its frequency limits and lifetime cap."
  - method: GET
    path: "/bone-density/payer-policies"
    roles: [ProgramAdmin, Scheduler, InterpretingPhysician]
    input: ["payer_code?", "limit?", "offset?"]
    output: "PayerPolicy[]"
    side_effects: []
    description: "Paginated policy catalogue, ordered created_at ASC then id ASC."
  - method: GET
    path: "/bone-density/scan-orders/{id}"
    roles: [ProgramAdmin, Scheduler, Technologist, InterpretingPhysician, PatientPortalUser]
    input: []
    output: ScanOrder
    side_effects: []
    description: "Single order with its payer eligibility verdict and denial reason."
  - method: GET
    path: "/bone-density/scan-orders"
    roles: [ProgramAdmin, Scheduler, Technologist, InterpretingPhysician, PatientPortalUser]
    input: ["patient_id?", "required_densitometer_id?", "status?", "indication?", "limit?", "offset?"]
    output: "ScanOrder[]"
    side_effects: []
    description: "Order worklist, ordered created_at ASC then id ASC. Covers reverse lookup for ScanOrder.patient_id and ScanOrder.required_densitometer_id."
  - method: GET
    path: "/bone-density/scan-appointments/{id}"
    roles: [ProgramAdmin, Scheduler, Technologist, InterpretingPhysician]
    input: []
    output: ScanAppointment
    side_effects: []
    description: "Single slot with its status, slot_index and cancellation reason."
  - method: GET
    path: "/bone-density/scan-appointments"
    roles: [ProgramAdmin, Scheduler, Technologist, InterpretingPhysician]
    input: ["scan_order_id?", "densitometer_id?", "status?", "from_utc?", "to_utc?", "limit?", "offset?"]
    output: "ScanAppointment[]"
    side_effects: []
    description: "Device schedule, ordered start_utc ASC then created_at ASC. Covers reverse lookup for ScanAppointment.scan_order_id and ScanAppointment.densitometer_id."
  - method: GET
    path: "/bone-density/scan-sessions/{id}"
    roles: [ProgramAdmin, Technologist, QualityReviewer, InterpretingPhysician]
    input: []
    output: ScanSession
    side_effects: []
    description: "Single acquisition with both state dimensions, the selected prior, the snapshotted LSC and the aggregate scores."
  - method: GET
    path: "/bone-density/scan-sessions"
    roles: [ProgramAdmin, Technologist, QualityReviewer, InterpretingPhysician]
    input: ["scan_appointment_id?", "prior_session_id?", "densitometer_id?", "patient_id?", "acquisition_status?", "review_status?", "limit?", "offset?"]
    output: "ScanSession[]"
    side_effects: []
    description: "Session worklist, ordered created_at ASC then id ASC. Covers reverse lookup for ScanSession.scan_appointment_id, ScanSession.prior_session_id, ScanSession.densitometer_id and ScanSession.patient_id."
  - method: GET
    path: "/bone-density/scan-sessions/{id}/site-measurements"
    roles: [ProgramAdmin, Technologist, QualityReviewer, InterpretingPhysician]
    input: ["site_code?", "include_superseded?", "limit?", "offset?"]
    output: "SiteMeasurement[]"
    side_effects: []
    description: "Skeletal site results of one session, ordered created_at ASC. Superseded rows are hidden unless include_superseded is true. Covers reverse lookup for SiteMeasurement.scan_session_id."
  - method: GET
    path: "/bone-density/scan-sessions/{id}/positioning-reviews"
    roles: [ProgramAdmin, Technologist, QualityReviewer, InterpretingPhysician]
    input: ["limit?", "offset?"]
    output: "PositioningReview[]"
    side_effects: []
    description: "Positioning quality reviews of one session, ordered reviewed_at_utc ASC then created_at ASC. Covers reverse lookup for PositioningReview.scan_session_id."
  - method: GET
    path: "/bone-density/frax-assessments/{id}"
    roles: [ProgramAdmin, InterpretingPhysician]
    input: []
    output: FraxAssessment
    side_effects: []
    description: "Single fracture risk assessment with every points term and both probabilities."
  - method: GET
    path: "/bone-density/frax-assessments"
    roles: [ProgramAdmin, InterpretingPhysician]
    input: ["patient_id?", "risk_factor_profile_id?", "scan_session_id?", "variant?", "limit?", "offset?"]
    output: "FraxAssessment[]"
    side_effects: []
    description: "Assessment history, ordered assessed_at_utc DESC then created_at DESC. Covers reverse lookup for FraxAssessment.patient_id, FraxAssessment.risk_factor_profile_id and FraxAssessment.scan_session_id."
  - method: GET
    path: "/bone-density/diagnostic-reports/{id}"
    roles: [ProgramAdmin, Technologist, QualityReviewer, InterpretingPhysician, PatientPortalUser]
    input: []
    output: DiagnosticReport
    side_effects: []
    description: "Single report with its diagnostic category, LSC interpretation, interval determination and recommended action."
  - method: GET
    path: "/bone-density/diagnostic-reports"
    roles: [ProgramAdmin, Technologist, QualityReviewer, InterpretingPhysician, PatientPortalUser]
    input: ["scan_session_id?", "frax_assessment_id?", "amends_report_id?", "status?", "limit?", "offset?"]
    output: "DiagnosticReport[]"
    side_effects: []
    description: "Report list, ordered created_at ASC then id ASC. Covers reverse lookup for DiagnosticReport.scan_session_id, DiagnosticReport.frax_assessment_id and DiagnosticReport.amends_report_id."
  - method: GET
    path: "/bone-density/treatment-plans/{id}"
    roles: [ProgramAdmin, InterpretingPhysician, PatientPortalUser]
    input: []
    output: TreatmentPlan
    side_effects: []
    description: "Single treatment plan with its adherence ratio, status and follow-up due date."
  - method: GET
    path: "/bone-density/treatment-plans"
    roles: [ProgramAdmin, InterpretingPhysician, PatientPortalUser]
    input: ["patient_id?", "initiating_report_id?", "status?", "limit?", "offset?"]
    output: "TreatmentPlan[]"
    side_effects: []
    description: "Plan list, ordered created_at ASC then id ASC. Covers reverse lookup for TreatmentPlan.patient_id and TreatmentPlan.initiating_report_id."
  - method: GET
    path: "/bone-density/treatment-plans/{id}/adherence-refills"
    roles: [ProgramAdmin, InterpretingPhysician, PatientPortalUser]
    input: ["source?", "limit?", "offset?"]
    output: "AdherenceRefill[]"
    side_effects: []
    description: "Refill ledger of one plan, ordered dispensed_date ASC then created_at ASC. Covers reverse lookup for AdherenceRefill.treatment_plan_id."
  - method: POST
    path: "/bone-density/payer-policies"
    roles: [ProgramAdmin]
    input: [payer_code, name, baseline_screening_min_interval_months, high_risk_min_interval_months, treatment_monitoring_min_interval_months, vfa_covered, vfa_requires_height_loss_cm, repeat_scan_grace_days, max_lifetime_screening_scans, appeal_allowed]
    output: PayerPolicy
    side_effects: []
    description: "Registers an immutable payer policy. 201 on success; ERR_PAYER_CODE_TAKEN when payer_code already exists."
  - method: POST
    path: "/bone-density/densitometers"
    roles: [ProgramAdmin]
    input: [serial_number, manufacturer, model, site_code, phantom_baseline_bmd_g_cm2, phantom_baseline_sd_g_cm2, appointment_buffer_minutes, daily_scan_capacity]
    output: Densitometer
    side_effects:
      - "The device starts in status ACTIVE with calibration_generation 1, cross_cal_factor 1.0, consecutive_qc_pass_count 0, and rms_sd_g_cm2 and lsc_g_cm2 null, so it cannot yet acquire a session."
  - method: POST
    path: "/bone-density/densitometers/{id}/precision-assessment"
    roles: [ProgramAdmin]
    input: [expected_densitometer_version, technologist_user_id, patient_count, scans_per_patient, rms_sd_g_cm2]
    output: Densitometer
    side_effects:
      - "precision_lsc computes precision degrees of freedom and lsc_g_cm2 = round(2.77 * rms_sd_g_cm2, 4); rms_sd_g_cm2, precision_technologist_user_id and precision_certified_at are written and version increments."
      - "Sessions created after this call snapshot the new applied_lsc_g_cm2; sessions already created keep the old one."
      - "ERR_STALE_DENSITOMETER_VERSION (412) when expected_densitometer_version is stale; ERR_PRECISION_STUDY_UNDERPOWERED (422) when the degrees of freedom are below 30."
  - method: POST
    path: "/bone-density/densitometers/{id}/qc-runs"
    roles: [Technologist, ProgramAdmin]
    input: ["purpose", "phantom_bmd_g_cm2", "scan_mode", "calibration_event_id?"]
    output: QcRun
    side_effects:
      - "qc_deviation_and_result computes deviation_g_cm2, deviation_sd_units, result and shift_detected; Densitometer.last_qc_result and last_qc_run_at are updated."
      - "CASCADE B: a DAILY_QC run whose result is FAIL, or whose shift_detected is true, drives Densitometer ACTIVE -> QC_HOLD, which cancels every BOOKED appointment on that device starting within QC_HOLD_CANCEL_HORIZON_HOURS, which reverts each affected ScanOrder SCHEDULED -> REQUESTED with reschedule_required true and decrements Patient.open_scheduled_order_count."
      - "A DAILY_QC PASS run on a device in QC_HOLD increments consecutive_qc_pass_count and releases the device to ACTIVE once the count reaches QC_RELEASE_PASS_STREAK; cancelled appointments are never restored."
      - "CROSS_CAL_BASELINE and CROSS_CAL_NEW runs increment the referenced CalibrationEvent's baseline_run_count or new_run_count and never touch device status."
  - method: POST
    path: "/bone-density/densitometers/{id}/calibration-events"
    roles: [ProgramAdmin]
    input: ["change_type", "change_note?"]
    output: CalibrationEvent
    side_effects:
      - "The event is created in status OPEN with required_phantom_runs derived from change_type."
      - "Densitometer transitions ACTIVE or QC_HOLD -> CROSS_CAL_PENDING and consecutive_qc_pass_count resets to 0, so no new session can be started on the device."
      - "ERR_CALIBRATION_EVENT_NOT_OPEN is not used here; a second open event on the same device is rejected with ERR_DENSITOMETER_NOT_ACTIVE because the device is already CROSS_CAL_PENDING."
  - method: POST
    path: "/bone-density/calibration-events/{id}/close"
    roles: [ProgramAdmin]
    input: []
    output: CalibrationEvent
    side_effects:
      - "cross_calibration_factor computes baseline_mean_bmd_g_cm2, new_mean_bmd_g_cm2, percent_difference, proposed_cross_cal_factor and outcome_code; status OPEN -> PHANTOM_SET_COMPLETE and closed_at_utc is stamped."
      - "ERR_PHANTOM_SET_INCOMPLETE (409) when either phantom set has fewer than required_phantom_runs runs."
  - method: POST
    path: "/bone-density/calibration-events/{id}/adjudicate"
    roles: [ProgramAdmin]
    input: []
    output: CalibrationEvent
    side_effects:
      - "CASCADE C: when abs(percent_difference) <= CROSS_CAL_MAX_DRIFT_PCT the event goes PHANTOM_SET_COMPLETE -> APPROVED, which bumps Densitometer.calibration_generation and writes cross_cal_factor, which in turn makes every later session score a lower-generation prior as PRIOR_CROSS_CAL_ADJUSTED; the device returns CROSS_CAL_PENDING -> ACTIVE."
      - "When abs(percent_difference) > CROSS_CAL_MAX_DRIFT_PCT the event goes PHANTOM_SET_COMPLETE -> REJECTED with outcome_code REJECTED_EXCESSIVE_DRIFT, the device stays CROSS_CAL_PENDING, and neither calibration_generation nor cross_cal_factor changes."
      - "The verdict is derived entirely from the stored percent_difference; there is no request body to influence it."
  - method: POST
    path: "/bone-density/densitometers/{id}/retire"
    roles: [ProgramAdmin]
    input: []
    output: Densitometer
    side_effects:
      - "status -> RETIRED. Every BOOKED or CHECKED_IN appointment on the device is cancelled with cancellation_reason_code DEVICE_QC_HOLD and each affected ScanOrder reverts SCHEDULED -> REQUESTED with reschedule_required true, decrementing Patient.open_scheduled_order_count."
      - "Any OPEN or PHANTOM_SET_COMPLETE CalibrationEvent on the device is moved to REJECTED."
  - method: POST
    path: "/bone-density/patients"
    roles: [Scheduler, ProgramAdmin]
    input: ["mrn", "primary_payer_policy_id", "birth_date", "sex", "postmenopausal?", "baseline_height_cm"]
    output: Patient
    side_effects:
      - "The patient starts with open_scheduled_order_count 0, lifetime_screening_scan_count 0, and baseline_report_id, last_finalized_report_id, current_screening_interval_months and next_eligible_scan_date all null, so the first order is unconditionally ELIGIBLE."
  - method: POST
    path: "/bone-density/patients/{id}/risk-factor-profiles"
    roles: [Scheduler, InterpretingPhysician]
    input: ["expected_patient_version", "height_cm", "weight_kg", "prior_fragility_fracture?", "parental_hip_fracture?", "current_smoker?", "glucocorticoid_use?", "rheumatoid_arthritis?", "secondary_osteoporosis?", "alcohol_units_per_day?"]
    output: RiskFactorProfile
    side_effects:
      - "bmi, height_loss_cm and clinical_risk_factor_count are computed; the new profile is ACTIVE and any previously ACTIVE profile for the patient becomes SUPERSEDED."
      - "Patient.version increments, so a caller holding the pre-call version must re-read the patient before its next optimistic write."
      - "ERR_STALE_PATIENT_VERSION (412) when expected_patient_version does not match the patient's current version."
  - method: POST
    path: "/bone-density/scan-orders"
    roles: [Scheduler, InterpretingPhysician]
    input: ["patient_id", "indication", "requested_sites", "requested_scan_date", "vfa_requested?"]
    output: ScanOrder
    side_effects:
      - "order_frequency_eligibility computes frequency_eligibility, earliest_allowed_date and payer_floor_months against Patient.next_eligible_scan_date, Patient.lifetime_screening_scan_count and the patient's PayerPolicy."
      - "required_densitometer_id is set to the densitometer of the session behind Patient.baseline_report_id for indication SERIAL_MONITORING or TREATMENT_MONITORING, and left null otherwise."
      - "An ineligible verdict rejects the request with ERR_PAYER_FREQUENCY_LIMIT or ERR_LIFETIME_SCAN_CAP_EXCEEDED (402) when PayerPolicy.appeal_allowed is false, and creates the order in status DENIED with the matching denial_reason_code when it is true."
  - method: POST
    path: "/bone-density/scan-appointments"
    roles: [Scheduler]
    input: [scan_order_id, densitometer_id, start_utc, end_utc]
    output: ScanAppointment
    side_effects:
      - "The slot is created BOOKED with scheduled_duration_minutes and slot_index derived from the device's UTC calendar day; slot_index is recomputed for every non-cancelled sibling on that device and date, so inserting an earlier slot shifts the later ones up."
      - "ScanOrder REQUESTED -> SCHEDULED and Patient.open_scheduled_order_count increments, which is the forward half of the open-order invariant."
      - "Overlap is rejected with ERR_DEVICE_SLOT_CONFLICT using the device's symmetric appointment_buffer_minutes on half-open [start_utc, end_utc) windows; a second same-day slot for the patient is rejected with ERR_PATIENT_DOUBLE_BOOKED; exceeding daily_scan_capacity is rejected with ERR_DEVICE_DAILY_CAPACITY_FULL."
  - method: POST
    path: "/bone-density/scan-appointments/{id}/cancel"
    roles: [Scheduler]
    input: []
    output: ScanAppointment
    side_effects:
      - "status BOOKED -> CANCELLED with cancellation_reason_code PATIENT_REQUEST and cancelled_at_utc stamped."
      - "ScanOrder SCHEDULED -> REQUESTED and Patient.open_scheduled_order_count decrements, which is the compensating half of the open-order invariant: after book-then-cancel the counter equals its pre-booking value."
      - "slot_index is recomputed for the remaining non-cancelled appointments on the same device and UTC calendar date."
  - method: POST
    path: "/bone-density/scan-appointments/{id}/scan-sessions"
    roles: [Technologist]
    input: [scan_mode]
    output: ScanSession
    side_effects:
      - "The session is created with acquisition_status IN_PROGRESS, review_status NOT_REVIEWED, repeat_count 0, and densitometer_id, patient_id, calibration_generation, applied_lsc_g_cm2 and applied_cross_cal_factor snapshotted from the device."
      - "prior_session_selection fixes prior_session_id and prior_comparison_status permanently at creation."
      - "ScanAppointment BOOKED -> CHECKED_IN."
      - "ERR_DENSITOMETER_NOT_ACTIVE (409) when the device is in QC_HOLD or CROSS_CAL_PENDING; ERR_DEVICE_PRECISION_NOT_CERTIFIED (409) when the device has no lsc_g_cm2."
  - method: POST
    path: "/bone-density/scan-sessions/{id}/site-measurements"
    roles: [Technologist]
    input: ["site_code", "bmd_g_cm2", "area_cm2", "bmc_g", "reference_mean_bmd_g_cm2", "reference_sd_g_cm2", "age_matched_mean_bmd_g_cm2", "age_matched_sd_g_cm2", "included_vertebrae?"]
    output: SiteMeasurement
    side_effects:
      - "site_scores computes t_score, z_score, valid_vertebral_count and site_usable_for_diagnosis; ScanSession.measured_site_count increments."
      - "ERR_DUPLICATE_SITE_MEASUREMENT (409) when a non-superseded row for the same site_code already exists; ERR_INSUFFICIENT_VALID_VERTEBRAE (422) for a LUMBAR_SPINE row with fewer than two distinct vertebrae."
  - method: POST
    path: "/bone-density/scan-sessions/{id}/vfa"
    roles: [Technologist]
    input: [genant_grades]
    output: ScanSession
    side_effects:
      - "vfa_eligibility_and_grading writes vfa_performed, vfa_eligibility_code, vfa_max_genant_grade and vfa_fracture_count."
      - "Once vfa_performed is true the report's vfa_narrative becomes a mandatory element at finalization, whatever the grades."
      - "Rejections in fixed priority order: ERR_VFA_NOT_ORDERED (409, priority 42), ERR_VFA_NOT_ELIGIBLE (409, priority 46), ERR_VFA_NOT_COVERED (402, priority 65)."
  - method: POST
    path: "/bone-density/scan-sessions/{id}/submit-acquisition"
    roles: [Technologist]
    input: []
    output: ScanSession
    side_effects:
      - "lowest_t_score_selection writes lowest_t_score, lowest_t_score_site and lowest_z_score; acquisition_status IN_PROGRESS -> SUBMITTED and submitted_at_utc is stamped."
      - "ScanAppointment CHECKED_IN -> COMPLETED, ScanOrder SCHEDULED -> COMPLETED, Patient.open_scheduled_order_count decrements."
      - "ERR_NO_SITE_MEASUREMENTS (422) with zero non-superseded rows; ERR_REQUESTED_SITES_INCOMPLETE (422) when a requested site is missing; ERR_NOT_SESSION_TECHNOLOGIST (403) when a different technologist submits."
  - method: POST
    path: "/bone-density/scan-sessions/{id}/positioning-reviews"
    roles: [QualityReviewer, Technologist]
    input: ["defect_codes", "reviewer_note?"]
    output: PositioningReview
    side_effects:
      - "positioning_severity_and_outcome computes severity_score, repeat_criterion_met and outcome; ScanSession.review_status is set to that outcome."
      - "ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID equals ScanSession.technologist_user_id, which is why the Technologist role is allowed here only for a colleague's session."
  - method: POST
    path: "/bone-density/scan-sessions/{id}/repeat-acquisition"
    roles: [Technologist]
    input: []
    output: ScanSession
    side_effects:
      - "acquisition_status SUBMITTED -> IN_PROGRESS, review_status REPEAT_REQUIRED -> NOT_REVIEWED, repeat_count increments, submitted_at_utc and the three lowest-score fields reset to null."
      - "Every SiteMeasurement on the session is marked superseded and measured_site_count returns to 0, so the whole site set must be re-acquired."
      - "ERR_SESSION_REPEAT_NOT_REQUIRED (409) when review_status is neither REPEAT_REQUIRED nor ACCEPTED_WITH_LIMITATION; ERR_REPEAT_LIMIT_EXCEEDED (409) when review_status is ACCEPTED_WITH_LIMITATION because repeat_count is already at MAX_POSITIONING_REPEATS."
  - method: POST
    path: "/bone-density/frax-assessments"
    roles: [InterpretingPhysician]
    input: ["patient_id", "risk_factor_profile_id", "scan_session_id?"]
    output: FraxAssessment
    side_effects:
      - "frax_probability selects the WITH_BMD variant when scan_session_id is supplied and the WITHOUT_BMD variant otherwise, and writes every points term, raw_score, major_osteoporotic_10yr_pct, hip_fracture_10yr_pct, treatment_threshold_met and threshold_basis."
      - "ERR_RISK_PROFILE_NOT_ACTIVE (409) for a SUPERSEDED profile; ERR_FRAX_PATIENT_MISMATCH (409) when the profile or session belongs to another patient; ERR_FEMORAL_NECK_REQUIRED (422) when a session is supplied but has no usable FEMORAL_NECK measurement."
  - method: POST
    path: "/bone-density/diagnostic-reports"
    roles: [InterpretingPhysician]
    input: ["scan_session_id", "frax_assessment_id?", "non_comparability_note?", "vfa_narrative?"]
    output: DiagnosticReport
    side_effects:
      - "The report is created in status DRAFT and interval_and_action_determination writes classification_basis, diagnostic_category, lsc_site_code, prior_bmd_used_g_cm2, current_bmd_used_g_cm2, bmd_change_g_cm2, bmd_change_pct, applied_lsc_g_cm2, lsc_interpretation, clinical_interval_months, payer_floor_months, recommended_interval_months, recommended_action, missing_element_codes and required_elements_complete."
      - "ERR_SESSION_NOT_SUBMITTED (409) for a session still IN_PROGRESS; ERR_REPORT_ALREADY_EXISTS (409) when another DRAFT report exists on the session."
  - method: PATCH
    path: "/bone-density/diagnostic-reports/{id}"
    roles: [InterpretingPhysician]
    input: ["frax_assessment_id?", "non_comparability_note?", "vfa_narrative?"]
    output: DiagnosticReport
    side_effects:
      - "Only the three narrative and linkage fields are writable; every computed field is fully re-derived by interval_and_action_determination, so attaching a FRAX assessment can flip recommended_action from ROUTINE_INTERVAL to INITIATE_TREATMENT."
      - "missing_element_codes and required_elements_complete are recomputed; ERR_REPORT_NOT_DRAFT (409) once the report is FINALIZED."
  - method: POST
    path: "/bone-density/diagnostic-reports/{id}/finalize"
    roles: [InterpretingPhysician]
    input: []
    output: DiagnosticReport
    side_effects:
      - "CASCADE A link 1: status DRAFT -> FINALIZED with finalized_at_utc and finalized_by_user_id stamped, and ScanSession SUBMITTED -> ARCHIVED."
      - "CASCADE A link 2: Patient.lifetime_screening_scan_count increments, last_finalized_report_id is set, baseline_report_id is set when it was null, current_screening_interval_months := recommended_interval_months and next_eligible_scan_date := the session's scan date advanced by that many calendar months."
      - "CASCADE A link 3: every REQUESTED or SCHEDULED ScanOrder of the patient is re-evaluated by order_frequency_eligibility, in created_at ASC order, and newly ineligible orders move to DENIED with denial_reason_code INTERVAL_REVISED_BY_REPORT or LIFETIME_CAP_EXCEEDED."
      - "CASCADE A link 4: each order denied from SCHEDULED has its BOOKED appointments cancelled with cancellation_reason_code ORDER_DENIED and decrements Patient.open_scheduled_order_count."
      - "ERR_POSITIONING_NOT_ACCEPTED (409) when review_status is NOT_REVIEWED or REPEAT_REQUIRED; ERR_REPORT_ELEMENTS_INCOMPLETE (422) when required_elements_complete is false."
  - method: POST
    path: "/bone-density/diagnostic-reports/{id}/amend"
    roles: [InterpretingPhysician]
    input: [amendment_reason]
    output: DiagnosticReport
    side_effects:
      - "The addressed report goes FINALIZED -> AMENDED and a successor DiagnosticReport is created in status DRAFT with amends_report_id pointing at it; the successor is the response body."
      - "COMPENSATION: Patient.lifetime_screening_scan_count decrements, last_finalized_report_id and baseline_report_id are re-derived from the remaining FINALIZED reports, and current_screening_interval_months and next_eligible_scan_date are re-derived or reset to null, so finalize-then-amend leaves the patient's counters exactly as they were."
      - "ScanSession ARCHIVED -> SUBMITTED so the successor can be finalized."
  - method: POST
    path: "/bone-density/treatment-plans"
    roles: [InterpretingPhysician]
    input: ["patient_id", "initiating_report_id", "drug_class", "start_date", "adherence_source_policy?"]
    output: TreatmentPlan
    side_effects:
      - "The plan starts in status INITIATED with followup_interval_months, next_followup_due_date := start_date advanced by that many calendar months, adherence_review_count 0 and consecutive_nonadherent_reviews 0."
      - "ERR_REPORT_NOT_FINALIZED (409) when initiating_report_id is not FINALIZED, and the report must carry recommended_action INITIATE_TREATMENT and belong to a session of the same patient."
  - method: POST
    path: "/bone-density/treatment-plans/{id}/adherence-refills"
    roles: [PatientPortalUser, InterpretingPhysician]
    input: [dispensed_date, days_supplied, source]
    output: AdherenceRefill
    side_effects:
      - "source_weight is set from the source (1.0 for PHARMACY_CLAIM, 0.5 for PATIENT_REPORT) and coverage_end_date := dispensed_date + days_supplied; the plan's ratio is NOT recomputed here."
      - "ERR_PATIENT_SCOPE_VIOLATION (403) when a PatientPortalUser posts to another patient's plan; ERR_REFILL_DATE_OUT_OF_WINDOW (422) outside [start_date, clock date]."
  - method: POST
    path: "/bone-density/treatment-plans/{id}/adherence-review"
    roles: [InterpretingPhysician]
    input: ["requested_action?", "note?", "discontinuation_reason_code?"]
    output: TreatmentPlan
    side_effects:
      - "medication_possession_ratio recomputes adherence_window_days, covered_days_supplied, medication_possession_ratio, adherence_status, denosumab_gap_days and holiday_eligible under the plan's adherence_source_policy variant."
      - "status advances per the TreatmentPlan machine: ADHERENT or PARTIAL -> ON_THERAPY, NON_ADHERENT -> ADHERENCE_HOLD, a second consecutive NON_ADHERENT verdict from ADHERENCE_HOLD -> DISCONTINUED with ADHERENCE_FAILURE, requested_action START_DRUG_HOLIDAY / RESUME_THERAPY / DISCONTINUE taking the explicit branches."
      - "adherence_review_count increments, last_review_date := the clock date and next_followup_due_date advances; ERR_FOLLOWUP_NOT_DUE (409) more than FOLLOWUP_EARLY_WINDOW_DAYS before the due date."
  - method: POST
    path: "/bone-density/_clock/set_current_utc"
    roles: [ProgramAdmin, Scheduler, Technologist, QualityReviewer, InterpretingPhysician, PatientPortalUser]
    input: [to_iso8601]
    output: "null"
    side_effects:
      - "Sets the logical clock that every created_at, *_at_utc, date comparison and interval computation reads. The clock starts at 2026-08-01T00:00:00Z on a fresh server and moves only through this endpoint; it never advances on its own."
    description: "Test-driving endpoint for deterministic time. 204 with an empty data payload."

errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    message: "Authentication headers are required."
    triggered_by: "every endpoint \u2014 X-User-ID or X-User-Role header is missing or empty"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    category: rbac
    message: "Role {role} may not perform this operation."
    triggered_by: "every endpoint \u2014 X-User-Role is not a recognised role, or is not listed in the endpoint's roles column"
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    category: business_constraint
    message: "Request body is invalid: {details}."
    triggered_by: "every write endpoint \u2014 a required body field is absent, a field has the wrong JSON type, an enum value is outside its declared set, a numeric field is outside its declared range, or a date/instant string is not valid ISO-8601"
  - error_id: ERR_DENSITOMETER_NOT_FOUND
    http_status: 404
    category: existence
    message: "Densitometer {densitometer_id} was not found."
    triggered_by: "every endpoint whose path contains a densitometer id \u2014 no Densitometer with that id exists"
  - error_id: ERR_QC_RUN_NOT_FOUND
    http_status: 404
    category: existence
    message: "QC run {qc_run_id} was not found."
    triggered_by: "GET /bone-density/qc-runs/{id} \u2014 no QcRun with that id exists"
  - error_id: ERR_CALIBRATION_EVENT_NOT_FOUND
    http_status: 404
    category: existence
    message: "Calibration event {calibration_event_id} was not found."
    triggered_by: "GET /bone-density/calibration-events/{id}, POST /bone-density/calibration-events/{id}/close, POST /bone-density/calibration-events/{id}/adjudicate \u2014 no CalibrationEvent with that id exists"
  - error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    category: existence
    message: "Patient {patient_id} was not found."
    triggered_by: "every endpoint whose path contains a patient id \u2014 no Patient with that id exists"
  - error_id: ERR_SCAN_ORDER_NOT_FOUND
    http_status: 404
    category: existence
    message: "Scan order {scan_order_id} was not found."
    triggered_by: "GET /bone-density/scan-orders/{id} \u2014 no ScanOrder with that id exists"
  - error_id: ERR_SCAN_APPOINTMENT_NOT_FOUND
    http_status: 404
    category: existence
    message: "Scan appointment {scan_appointment_id} was not found."
    triggered_by: "every endpoint whose path contains a scan appointment id \u2014 no ScanAppointment with that id exists"
  - error_id: ERR_SCAN_SESSION_NOT_FOUND
    http_status: 404
    category: existence
    message: "Scan session {scan_session_id} was not found."
    triggered_by: "every endpoint whose path contains a scan session id \u2014 no ScanSession with that id exists"
  - error_id: ERR_FRAX_ASSESSMENT_NOT_FOUND
    http_status: 404
    category: existence
    message: "Fracture risk assessment {frax_assessment_id} was not found."
    triggered_by: "GET /bone-density/frax-assessments/{id} \u2014 no FraxAssessment with that id exists"
  - error_id: ERR_DIAGNOSTIC_REPORT_NOT_FOUND
    http_status: 404
    category: existence
    message: "Diagnostic report {diagnostic_report_id} was not found."
    triggered_by: "every endpoint whose path contains a diagnostic report id \u2014 no DiagnosticReport with that id exists"
  - error_id: ERR_TREATMENT_PLAN_NOT_FOUND
    http_status: 404
    category: existence
    message: "Treatment plan {treatment_plan_id} was not found."
    triggered_by: "every endpoint whose path contains a treatment plan id \u2014 no TreatmentPlan with that id exists"
  - error_id: ERR_PAYER_POLICY_NOT_FOUND
    http_status: 404
    category: existence
    message: "Payer policy {payer_policy_id} was not found."
    triggered_by: "POST /bone-density/patients \u2014 primary_payer_policy_id does not reference an existing PayerPolicy"
  - error_id: ERR_RISK_FACTOR_PROFILE_NOT_FOUND
    http_status: 404
    category: existence
    message: "Risk factor profile {risk_factor_profile_id} was not found."
    triggered_by: "POST /bone-density/frax-assessments \u2014 risk_factor_profile_id does not reference an existing RiskFactorProfile"
  - error_id: ERR_PATIENT_SCOPE_VIOLATION
    http_status: 403
    category: ownership
    message: "Patient portal users may only access their own records."
    triggered_by: "GET /bone-density/patients/{id}, GET /bone-density/patients/{id}/risk-factor-profiles, GET /bone-density/scan-orders, GET /bone-density/diagnostic-reports, GET /bone-density/treatment-plans/{id}, GET /bone-density/treatment-plans/{id}/adherence-refills, POST /bone-density/treatment-plans/{id}/adherence-refills \u2014 X-User-Role is PatientPortalUser and X-User-ID is not the Patient.id that owns the addressed resource"
  - error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    category: concurrency
    message: "Patient version {expected} does not match current version {actual}."
    triggered_by: "POST /bone-density/patients/{id}/risk-factor-profiles \u2014 expected_patient_version does not equal the Patient's current version"
  - error_id: ERR_STALE_DENSITOMETER_VERSION
    http_status: 412
    category: concurrency
    message: "Densitometer version {expected} does not match current version {actual}."
    triggered_by: "POST /bone-density/densitometers/{id}/precision-assessment \u2014 expected_densitometer_version does not equal the Densitometer's current version"
  - error_id: ERR_DENSITOMETER_RETIRED
    http_status: 409
    category: state
    message: "Densitometer {densitometer_id} is retired."
    triggered_by: "POST /bone-density/densitometers/{id}/qc-runs, POST /bone-density/densitometers/{id}/calibration-events, POST /bone-density/densitometers/{id}/precision-assessment, POST /bone-density/densitometers/{id}/retire, POST /bone-density/scan-appointments, POST /bone-density/scan-appointments/{id}/scan-sessions \u2014 the addressed Densitometer has status RETIRED"
  - error_id: ERR_DENSITOMETER_NOT_ACTIVE
    http_status: 409
    category: state
    message: "Densitometer {densitometer_id} is in status {status} and cannot acquire scans."
    triggered_by: "POST /bone-density/scan-appointments/{id}/scan-sessions \u2014 the appointment's Densitometer has status QC_HOLD or CROSS_CAL_PENDING"
  - error_id: ERR_CALIBRATION_EVENT_NOT_OPEN
    http_status: 409
    category: state
    message: "Calibration event {calibration_event_id} is in status {status}, not OPEN."
    triggered_by: "POST /bone-density/calibration-events/{id}/close \u2014 the CalibrationEvent status is not OPEN"
  - error_id: ERR_CALIBRATION_EVENT_NOT_CLOSED
    http_status: 409
    category: state
    message: "Calibration event {calibration_event_id} is in status {status}, not PHANTOM_SET_COMPLETE."
    triggered_by: "POST /bone-density/calibration-events/{id}/adjudicate \u2014 the CalibrationEvent status is not PHANTOM_SET_COMPLETE"
  - error_id: ERR_ORDER_NOT_SCHEDULABLE
    http_status: 409
    category: state
    message: "Scan order {scan_order_id} is in status {status} and cannot be scheduled."
    triggered_by: "POST /bone-density/scan-appointments \u2014 the referenced ScanOrder status is not REQUESTED"
  - error_id: ERR_APPOINTMENT_NOT_BOOKED
    http_status: 409
    category: state
    message: "Scan appointment {scan_appointment_id} is in status {status}, not BOOKED."
    triggered_by: "POST /bone-density/scan-appointments/{id}/cancel, POST /bone-density/scan-appointments/{id}/scan-sessions \u2014 the ScanAppointment status is not BOOKED"
  - error_id: ERR_SESSION_NOT_IN_PROGRESS
    http_status: 409
    category: state
    message: "Scan session {scan_session_id} has acquisition_status {status}, not IN_PROGRESS."
    triggered_by: "POST /bone-density/scan-sessions/{id}/site-measurements, POST /bone-density/scan-sessions/{id}/vfa, POST /bone-density/scan-sessions/{id}/submit-acquisition \u2014 the ScanSession acquisition_status is neither IN_PROGRESS nor ARCHIVED, because the archived lock is checked at a later priority"
  - error_id: ERR_SESSION_NOT_SUBMITTED
    http_status: 409
    category: state
    message: "Scan session {scan_session_id} has acquisition_status {status}, not SUBMITTED."
    triggered_by: "POST /bone-density/scan-sessions/{id}/positioning-reviews, POST /bone-density/diagnostic-reports \u2014 the ScanSession acquisition_status is neither SUBMITTED nor ARCHIVED, because the archived lock is checked at a later priority"
  - error_id: ERR_SESSION_ALREADY_REVIEWED
    http_status: 409
    category: state
    message: "Scan session {scan_session_id} already has review_status {status}."
    triggered_by: "POST /bone-density/scan-sessions/{id}/positioning-reviews \u2014 the ScanSession review_status is not NOT_REVIEWED"
  - error_id: ERR_SESSION_REPEAT_NOT_REQUIRED
    http_status: 409
    category: state
    message: "Scan session {scan_session_id} has review_status {status}; no repeat was requested."
    triggered_by: "POST /bone-density/scan-sessions/{id}/repeat-acquisition \u2014 the ScanSession review_status is neither REPEAT_REQUIRED nor ACCEPTED_WITH_LIMITATION"
  - error_id: ERR_SESSION_ARCHIVED
    http_status: 409
    category: state
    message: "Scan session {scan_session_id} is archived and locked for editing."
    triggered_by: "POST /bone-density/scan-sessions/{id}/site-measurements, POST /bone-density/scan-sessions/{id}/vfa, POST /bone-density/scan-sessions/{id}/positioning-reviews, POST /bone-density/scan-sessions/{id}/repeat-acquisition, POST /bone-density/diagnostic-reports \u2014 the ScanSession acquisition_status is ARCHIVED"
  - error_id: ERR_REPORT_NOT_DRAFT
    http_status: 409
    category: state
    message: "Diagnostic report {diagnostic_report_id} is in status {status}, not DRAFT."
    triggered_by: "PATCH /bone-density/diagnostic-reports/{id}, POST /bone-density/diagnostic-reports/{id}/finalize \u2014 the DiagnosticReport status is not DRAFT"
  - error_id: ERR_REPORT_NOT_FINALIZED
    http_status: 409
    category: state
    message: "Diagnostic report {diagnostic_report_id} is in status {status}, not FINALIZED."
    triggered_by: "POST /bone-density/diagnostic-reports/{id}/amend, POST /bone-density/treatment-plans \u2014 the DiagnosticReport status is not FINALIZED"
  - error_id: ERR_REPORT_ALREADY_EXISTS
    http_status: 409
    category: state
    message: "Scan session {scan_session_id} already has a draft diagnostic report."
    triggered_by: "POST /bone-density/diagnostic-reports, POST /bone-density/diagnostic-reports/{id}/amend \u2014 another DiagnosticReport on the same scan_session_id is already in status DRAFT"
  - error_id: ERR_TREATMENT_PLAN_TERMINAL
    http_status: 409
    category: state
    message: "Treatment plan {treatment_plan_id} is discontinued."
    triggered_by: "POST /bone-density/treatment-plans/{id}/adherence-refills, POST /bone-density/treatment-plans/{id}/adherence-review \u2014 the TreatmentPlan status is DISCONTINUED"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: business_safety
    message: "The acquiring technologist may not review their own positioning."
    triggered_by: "POST /bone-density/scan-sessions/{id}/positioning-reviews \u2014 X-User-ID equals the ScanSession.technologist_user_id who acquired the images"
  - error_id: ERR_NOT_SESSION_TECHNOLOGIST
    http_status: 403
    category: business_safety
    message: "User {user_id} is not the technologist assigned to scan session {scan_session_id}."
    triggered_by: "POST /bone-density/scan-sessions/{id}/site-measurements, POST /bone-density/scan-sessions/{id}/vfa, POST /bone-density/scan-sessions/{id}/submit-acquisition, POST /bone-density/scan-sessions/{id}/repeat-acquisition \u2014 X-User-Role is Technologist and X-User-ID is not the ScanSession.technologist_user_id"
  - error_id: ERR_DEVICE_PRECISION_NOT_CERTIFIED
    http_status: 409
    category: business_safety
    message: "Densitometer {densitometer_id} has no accepted precision assessment."
    triggered_by: "POST /bone-density/scan-appointments/{id}/scan-sessions \u2014 the appointment's Densitometer has lsc_g_cm2 null, i.e. no precision assessment has ever been accepted for it"
  - error_id: ERR_SERIAL_DEVICE_MISMATCH
    http_status: 409
    category: business_safety
    message: "Scan order {scan_order_id} requires densitometer {required_densitometer_id} for serial comparison."
    triggered_by: "POST /bone-density/scan-appointments \u2014 the ScanOrder has a non-null required_densitometer_id that differs from the requested densitometer_id"
  - error_id: ERR_POSITIONING_NOT_ACCEPTED
    http_status: 409
    category: business_safety
    message: "Scan session {scan_session_id} has review_status {status}; positioning must be accepted first."
    triggered_by: "POST /bone-density/diagnostic-reports/{id}/finalize \u2014 the ScanSession review_status is not ACCEPTED and not ACCEPTED_WITH_LIMITATION"
  - error_id: ERR_REPEAT_LIMIT_EXCEEDED
    http_status: 409
    category: business_safety
    message: "Scan session {scan_session_id} has already used its {max} permitted repeats."
    triggered_by: "POST /bone-density/scan-sessions/{id}/repeat-acquisition \u2014 the ScanSession repeat_count is already at MAX_POSITIONING_REPEATS"
  - error_id: ERR_PRECISION_STUDY_UNDERPOWERED
    http_status: 422
    category: business_safety
    message: "Precision study has {dof} degrees of freedom; at least {min} are required."
    triggered_by: "POST /bone-density/densitometers/{id}/precision-assessment \u2014 patient_count * (scans_per_patient - 1) is below MIN_PRECISION_DOF"
  - error_id: ERR_VFA_NOT_ORDERED
    http_status: 409
    category: business_referential
    message: "Vertebral fracture assessment was not requested on scan order {scan_order_id}."
    triggered_by: "POST /bone-density/scan-sessions/{id}/vfa \u2014 the owning ScanOrder has vfa_requested false"
  - error_id: ERR_FRAX_PATIENT_MISMATCH
    http_status: 409
    category: business_referential
    message: "Referenced record belongs to a different patient than {patient_id}."
    triggered_by: "POST /bone-density/frax-assessments \u2014 the referenced RiskFactorProfile.patient_id, or the referenced ScanSession.patient_id, differs from the supplied patient_id"
  - error_id: ERR_RISK_PROFILE_NOT_ACTIVE
    http_status: 409
    category: business_referential
    message: "Risk factor profile {risk_factor_profile_id} is superseded."
    triggered_by: "POST /bone-density/frax-assessments \u2014 the referenced RiskFactorProfile has status SUPERSEDED"
  - error_id: ERR_FEMORAL_NECK_REQUIRED
    http_status: 422
    category: business_referential
    message: "Scan session {scan_session_id} has no usable femoral neck measurement for a BMD-based assessment."
    triggered_by: "POST /bone-density/frax-assessments \u2014 scan_session_id is supplied but that session has no non-superseded usable FEMORAL_NECK SiteMeasurement, so the WITH_BMD variant cannot be computed"
  - error_id: ERR_VFA_NOT_ELIGIBLE
    http_status: 409
    category: business_constraint
    message: "Patient {patient_id} does not meet any vertebral fracture assessment criterion."
    triggered_by: "POST /bone-density/scan-sessions/{id}/vfa \u2014 the patient's height loss (Patient.baseline_height_cm minus the ACTIVE RiskFactorProfile.height_cm) is below PayerPolicy.vfa_requires_height_loss_cm, the ACTIVE profile has glucocorticoid_use false, and the patient's age_years is below VFA_AGE_THRESHOLD_YEARS, so no vfa_eligibility_code branch matches"
  - error_id: ERR_INSUFFICIENT_VALID_VERTEBRAE
    http_status: 422
    category: business_constraint
    message: "Lumbar spine measurement requires at least {min} distinct evaluable vertebrae."
    triggered_by: "POST /bone-density/scan-sessions/{id}/site-measurements \u2014 site_code is LUMBAR_SPINE and included_vertebrae has fewer than MIN_VALID_VERTEBRAE entries, or contains a duplicate vertebra label"
  - error_id: ERR_DUPLICATE_SITE_MEASUREMENT
    http_status: 409
    category: business_constraint
    message: "Site {site_code} already has an active measurement on scan session {scan_session_id}."
    triggered_by: "POST /bone-density/scan-sessions/{id}/site-measurements \u2014 a non-superseded SiteMeasurement with the same site_code already exists on this session"
  - error_id: ERR_NO_SITE_MEASUREMENTS
    http_status: 422
    category: business_constraint
    message: "Scan session {scan_session_id} has no site measurements to submit."
    triggered_by: "POST /bone-density/scan-sessions/{id}/submit-acquisition \u2014 the session has zero non-superseded SiteMeasurement rows"
  - error_id: ERR_REQUESTED_SITES_INCOMPLETE
    http_status: 422
    category: business_constraint
    message: "Requested sites {missing_sites} have no measurement on scan session {scan_session_id}."
    triggered_by: "POST /bone-density/scan-sessions/{id}/submit-acquisition \u2014 at least one site_code in the owning ScanOrder.requested_sites has no non-superseded SiteMeasurement on this session"
  - error_id: ERR_PHANTOM_SET_INCOMPLETE
    http_status: 409
    category: business_constraint
    message: "Calibration event {calibration_event_id} requires {required} phantom runs on each side; found {baseline} and {new}."
    triggered_by: "POST /bone-density/calibration-events/{id}/close \u2014 the event has fewer than required_phantom_runs QcRun rows with purpose CROSS_CAL_BASELINE, or fewer than required_phantom_runs with purpose CROSS_CAL_NEW"
  - error_id: ERR_SERIAL_NUMBER_TAKEN
    http_status: 409
    category: business_constraint
    message: "Serial number {serial_number} is already registered."
    triggered_by: "POST /bone-density/densitometers \u2014 serial_number is already used by another Densitometer"
  - error_id: ERR_MRN_TAKEN
    http_status: 409
    category: business_constraint
    message: "MRN {mrn} is already registered."
    triggered_by: "POST /bone-density/patients \u2014 mrn is already used by another Patient"
  - error_id: ERR_PAYER_CODE_TAKEN
    http_status: 409
    category: business_constraint
    message: "Payer code {payer_code} is already registered."
    triggered_by: "POST /bone-density/payer-policies \u2014 payer_code is already used by another PayerPolicy"
  - error_id: ERR_REPORT_ELEMENTS_INCOMPLETE
    http_status: 422
    category: business_constraint
    message: "Diagnostic report {diagnostic_report_id} is missing required elements {missing_element_codes}."
    triggered_by: "POST /bone-density/diagnostic-reports/{id}/finalize \u2014 required_elements_complete is false: the report's lsc_interpretation is NOT_COMPARABLE_DEVICE or NO_COMMON_SITE and non_comparability_note is null, or ScanSession.vfa_performed is true and vfa_narrative is null"
  - error_id: ERR_INVALID_INTERVAL
    http_status: 422
    category: business_temporal
    message: "end_utc must be strictly after start_utc."
    triggered_by: "POST /bone-density/scan-appointments \u2014 end_utc is not strictly after start_utc"
  - error_id: ERR_APPOINTMENT_IN_PAST
    http_status: 422
    category: business_temporal
    message: "start_utc {start_utc} is not in the future."
    triggered_by: "POST /bone-density/scan-appointments \u2014 start_utc is at or before the logical clock"
  - error_id: ERR_DEVICE_SLOT_CONFLICT
    http_status: 409
    category: business_temporal
    message: "Densitometer {densitometer_id} already has an appointment overlapping {start_utc}-{end_utc} once its {buffer} minute buffer is applied."
    triggered_by: "POST /bone-density/scan-appointments \u2014 an existing ScanAppointment on the same densitometer_id with status BOOKED or CHECKED_IN overlaps the requested window once the device's appointment_buffer_minutes is applied on both sides: new.start_utc < existing.end_utc + buffer AND existing.start_utc < new.end_utc + buffer"
  - error_id: ERR_PATIENT_DOUBLE_BOOKED
    http_status: 409
    category: business_temporal
    message: "Patient {patient_id} already has an appointment on {scan_date}."
    triggered_by: "POST /bone-density/scan-appointments \u2014 the patient already has a ScanAppointment with status BOOKED or CHECKED_IN whose start_utc falls on the same UTC calendar date as the requested start_utc"
  - error_id: ERR_DEVICE_DAILY_CAPACITY_FULL
    http_status: 409
    category: business_temporal
    message: "Densitometer {densitometer_id} has reached its daily capacity of {capacity} scans on {scan_date}."
    triggered_by: "POST /bone-density/scan-appointments \u2014 the densitometer already has daily_scan_capacity appointments with status BOOKED, CHECKED_IN or COMPLETED whose start_utc falls on the requested UTC calendar date"
  - error_id: ERR_REFILL_DATE_OUT_OF_WINDOW
    http_status: 422
    category: business_temporal
    message: "dispensed_date {dispensed_date} is outside the plan's reporting window."
    triggered_by: "POST /bone-density/treatment-plans/{id}/adherence-refills \u2014 dispensed_date is before TreatmentPlan.start_date or after the logical clock date"
  - error_id: ERR_FOLLOWUP_NOT_DUE
    http_status: 409
    category: business_temporal
    message: "Adherence review for treatment plan {treatment_plan_id} is not due until {next_followup_due_date}."
    triggered_by: "POST /bone-density/treatment-plans/{id}/adherence-review \u2014 the logical clock date is earlier than next_followup_due_date minus FOLLOWUP_EARLY_WINDOW_DAYS"
  - error_id: ERR_PAYER_FREQUENCY_LIMIT
    http_status: 402
    category: business_fiscal
    message: "Patient {patient_id} is not eligible for a scan before {earliest_allowed_date}."
    triggered_by: "POST /bone-density/scan-orders \u2014 order_frequency_eligibility returns INELIGIBLE_TOO_SOON and PayerPolicy.appeal_allowed is false"
  - error_id: ERR_LIFETIME_SCAN_CAP_EXCEEDED
    http_status: 402
    category: business_fiscal
    message: "Patient {patient_id} has reached the payer lifetime cap of {max} screening scans."
    triggered_by: "POST /bone-density/scan-orders \u2014 order_frequency_eligibility returns INELIGIBLE_LIFETIME_CAP and PayerPolicy.appeal_allowed is false"
  - error_id: ERR_VFA_NOT_COVERED
    http_status: 402
    category: business_fiscal
    message: "Payer policy {payer_policy_id} does not cover vertebral fracture assessment."
    triggered_by: "POST /bone-density/scan-sessions/{id}/vfa \u2014 the patient's PayerPolicy has vfa_covered false"

roles:
  - name: ProgramAdmin
    identity: opaque
    description: "Program and equipment administration: payer policies, device registry, precision certification, cross-calibration adjudication and retirement. Holds the logical clock."
    exclusive_operations:
      - "POST /bone-density/payer-policies"
      - "POST /bone-density/densitometers"
      - "POST /bone-density/densitometers/{id}/precision-assessment"
      - "POST /bone-density/densitometers/{id}/calibration-events"
      - "POST /bone-density/calibration-events/{id}/close"
      - "POST /bone-density/calibration-events/{id}/adjudicate"
      - "POST /bone-density/densitometers/{id}/retire"
    shared_operations:
      - "POST /bone-density/densitometers/{id}/qc-runs (with Technologist)"
      - "POST /bone-density/patients (with Scheduler)"
      - "POST /bone-density/_clock/set_current_utc (with every role)"
      - "every GET endpoint except the patient-scoped portal reads"
    forbidden_operations:
      - "POST /bone-density/scan-appointments and its cancel action (Scheduler only)"
      - "POST /bone-density/scan-appointments/{id}/scan-sessions and every acquisition action (Technologist only)"
      - "POST /bone-density/scan-sessions/{id}/positioning-reviews (QualityReviewer or a non-acquiring Technologist)"
      - "every interpretation, report and treatment action (InterpretingPhysician only)"
  - name: Scheduler
    identity: opaque
    description: "Front-office scheduling: patient registration, risk factor intake, order entry, slot booking and cancellation."
    exclusive_operations:
      - "POST /bone-density/scan-appointments"
      - "POST /bone-density/scan-appointments/{id}/cancel"
    shared_operations:
      - "POST /bone-density/patients (with ProgramAdmin)"
      - "POST /bone-density/patients/{id}/risk-factor-profiles (with InterpretingPhysician)"
      - "POST /bone-density/scan-orders (with InterpretingPhysician)"
      - "POST /bone-density/_clock/set_current_utc (with every role)"
      - "GET on densitometers, patients, payer policies, scan orders and scan appointments"
    forbidden_operations:
      - "every device QC, precision and calibration write (ProgramAdmin, and QC runs also Technologist)"
      - "every acquisition action on a scan session (Technologist only)"
      - "POST /bone-density/scan-sessions/{id}/positioning-reviews"
      - "every FRAX, report and treatment-plan write (InterpretingPhysician only)"
  - name: Technologist
    identity: opaque
    description: "Acquires phantom QC runs and patient scans, records skeletal sites and vertebral fracture assessment, submits and repeats acquisitions. May review a colleague's positioning but never their own."
    exclusive_operations:
      - "POST /bone-density/scan-appointments/{id}/scan-sessions"
      - "POST /bone-density/scan-sessions/{id}/site-measurements"
      - "POST /bone-density/scan-sessions/{id}/vfa"
      - "POST /bone-density/scan-sessions/{id}/submit-acquisition"
      - "POST /bone-density/scan-sessions/{id}/repeat-acquisition"
    shared_operations:
      - "POST /bone-density/densitometers/{id}/qc-runs (with ProgramAdmin)"
      - "POST /bone-density/scan-sessions/{id}/positioning-reviews (with QualityReviewer, and only for a session acquired by someone else)"
      - "POST /bone-density/_clock/set_current_utc (with every role)"
      - "GET on densitometers, qc runs, calibration events, scan orders, scan appointments, scan sessions, site measurements, positioning reviews and diagnostic reports"
    forbidden_operations:
      - "POST /bone-density/scan-appointments and its cancel action"
      - "every device registry, precision and calibration write"
      - "every FRAX, report and treatment-plan write"
      - "reviewing the positioning of a session whose technologist_user_id equals their own X-User-ID, which is ERR_SEGREGATION_OF_DUTIES rather than ERR_FORBIDDEN_ROLE"
  - name: QualityReviewer
    identity: opaque
    description: "Independent positioning quality reviewer. Decides accept, accept-with-limitation or repeat from the recorded defect set."
    exclusive_operations: []
    shared_operations:
      - "POST /bone-density/scan-sessions/{id}/positioning-reviews (with Technologist)"
      - "POST /bone-density/_clock/set_current_utc (with every role)"
      - "GET on densitometers, qc runs, calibration events, scan sessions, site measurements, positioning reviews and diagnostic reports"
    forbidden_operations:
      - "every acquisition action on a scan session, including submit and repeat"
      - "every scheduling, device registry, calibration, FRAX, report and treatment-plan write"
  - name: InterpretingPhysician
    identity: opaque
    description: "Interpreting physician: fracture risk assessment, diagnostic reporting, finalization and amendment, treatment initiation and adherence follow-up."
    exclusive_operations:
      - "POST /bone-density/frax-assessments"
      - "POST /bone-density/diagnostic-reports"
      - "PATCH /bone-density/diagnostic-reports/{id}"
      - "POST /bone-density/diagnostic-reports/{id}/finalize"
      - "POST /bone-density/diagnostic-reports/{id}/amend"
      - "POST /bone-density/treatment-plans"
      - "POST /bone-density/treatment-plans/{id}/adherence-review"
    shared_operations:
      - "POST /bone-density/scan-orders (with Scheduler)"
      - "POST /bone-density/patients/{id}/risk-factor-profiles (with Scheduler)"
      - "POST /bone-density/treatment-plans/{id}/adherence-refills (with PatientPortalUser)"
      - "POST /bone-density/_clock/set_current_utc (with every role)"
      - "every GET endpoint except the device-only inventory reads"
    forbidden_operations:
      - "POST /bone-density/scan-appointments and its cancel action"
      - "every acquisition action on a scan session"
      - "POST /bone-density/scan-sessions/{id}/positioning-reviews"
      - "every device registry, precision, QC and calibration write"
  - name: PatientPortalUser
    identity: "entity_backed:Patient"
    description: "The patient themselves. X-User-ID is the Patient.id. Reads only their own record, orders, reports, plans and refills, and self-reports medication refills."
    exclusive_operations: []
    shared_operations:
      - "POST /bone-density/treatment-plans/{id}/adherence-refills (with InterpretingPhysician; source PATIENT_REPORT is the realistic use)"
      - "GET /bone-density/patients/{id}, GET /bone-density/patients/{id}/risk-factor-profiles, GET /bone-density/scan-orders, GET /bone-density/scan-orders/{id}, GET /bone-density/diagnostic-reports, GET /bone-density/diagnostic-reports/{id}, GET /bone-density/treatment-plans, GET /bone-density/treatment-plans/{id}, GET /bone-density/treatment-plans/{id}/adherence-refills"
      - "POST /bone-density/_clock/set_current_utc (with every role)"
    forbidden_operations:
      - "every write except self-reported adherence refills"
      - "reading any resource belonging to another Patient, which is ERR_PATIENT_SCOPE_VIOLATION (403) rather than ERR_FORBIDDEN_ROLE"
      - "GET on densitometers, qc runs, calibration events, scan appointments, scan sessions, site measurements, positioning reviews and frax assessments, which is ERR_FORBIDDEN_ROLE"
