            - "The clock and the transfer effective_date are both 2026-08-25: August has 31 days and remaining_days == 31 - (25 - 1) == 7."
            - "Pinned order: credit = round_half_up(3546 * 7 / 31) = round_half_up(800.7097) = 801; charge = round_half_up(3173 * 7 / 31) = round_half_up(716.4839) = 716; net = 716 - 801 = -85."
