          - entities.AircraftSubstitution.fields.selection_basis
          - concurrency_rules.substitution-request-stale-lease
          - endpoints[POST /wetlease/substitutions]
        distinguishing_aspect: |
          MAX_HOURS_SINCE_CHECK_FOR_SUB 400.00 is an inclusive ceiling. With the only same-family
          spare sitting at 400.01 hours since check the candidate pool is empty and the request
          must be rejected with ERR_NO_SUBSTITUTE_AIRCRAFT_AVAILABLE (409); introducing a spare
