          setup:
            - "Harbor Lights with a single HEADLINER tier at allocation_pct 1.00 (allocation_cents 9500000) and max_slots 1."
            - "Two ELECTRONIC acts of draw_score 72, each with an ISSUED offer at guarantee 1800000 in that same tier: offer A on 2026-12-04 and offer B on 2026-12-05, both billing_position 1 on the flagship stage."
