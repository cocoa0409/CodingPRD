        distinguishing_aspect: |
          The provider is squarely inside the accepting set
          {TRAINING_IN_PROGRESS, AUTHORIZED}, so priority 62 cannot mask the
          shortfall: the only blocker left is a balance of 0 against the fixed cost
          of 2 credits per certification.
        test_recipe:
          setup:
            - "Profile US-CA; provider with technician_count 8 (required_cert_count 2) granted exactly 2 training credits, still TRAINING_IN_PROGRESS after one certification consumed both."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/repair-providers"
              payload: { legal_name: "Harbor Point Device Repair", region_code: "US-CA", requested_access_tier: "TIER_3_STANDARD", technician_count: 8 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { provider_id: $.data.id, required_certs: $.data.required_cert_count }
            - call: "POST /repair-program/repair-providers/${provider_id}/begin-training"
              payload: { training_credit_grant: 2 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { balance_0: $.data.training_credit_balance }
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_1", course_code: "CRS_GENERAL_REPAIR", valid_from: "2026-08-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z", exam_score: 82 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { cert_1: $.data.id }
            - call: "GET /repair-program/repair-providers/${provider_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { balance_1: $.data.training_credit_balance, active_1: $.data.active_cert_count, status_1: $.data.authorization_status }
          trigger:
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_2", course_code: "CRS_GENERAL_REPAIR", valid_from: "2026-08-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z", exam_score: 90 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { e1: $.data.error_id }
            - call: "GET /repair-program/repair-providers/${provider_id}/training-certifications"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { n_certs: $.total_count }
            - call: "POST /repair-program/repair-providers/${provider_id}/authorization-decision"
              payload: { decision: "AUTHORIZE", decision_reason: "premature" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { e2: $.data.error_id }
          assert:
            - "${required_certs} == 2 — ceil(8 / 4) — and ${balance_0} == 2"
            - "${balance_1} == 0, ${active_1} == 1 and ${status_1} == TRAINING_IN_PROGRESS"
            - "${e1} == ERR_TRAINING_CREDIT_INSUFFICIENT with HTTP 409 — priority 62 does not apply to a TRAINING_IN_PROGRESS provider"
            - "${n_certs} == 1 — the rejected certification created no row and ${cert_1} is untouched"
            - "${e2} == ERR_TRAINING_COVERAGE_INSUFFICIENT with HTTP 409 — 1 active certification is short of the 2 required"
            - "training_credit_granted_total 2 == balance 0 + forfeited 0 + consumed 2"

