      - name: industrial_shutdown_extension_reason_does_not_apply_to_a_commercial_system
        claim_type: conditional_validation
        grounds:
          - validations[priority=26]
          - errors[ERR_EXTENSION_REASON_NOT_APPLICABLE]
        distinguishing_aspect: "The same request body is admissible or not purely as a function of the parent system's category: INDUSTRIAL_PROCESS_SHUTDOWN_REQUIRED on a COMMERCIAL_REFRIGERATION system is 422 ERR_EXTENSION_REASON_NOT_APPLICABLE, whereas PARTS_UNAVAILABLE on the identical event is accepted and leaves the event's deadline untouched while PENDING."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (COMMERCIAL_REFRIGERATION, full 60.0, initial 0.0), one manually declared OPEN LeakEvent with repair_deadline 2026-08-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${sys1_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { event_id: $.data.id, event_deadline: $.data.repair_deadline }
          trigger:
            - call: "POST /extension-requests"
              payload: { leak_event_id: "${event_id}", reason_code: "INDUSTRIAL_PROCESS_SHUTDOWN_REQUIRED", requested_days: 10, justification: "Process line cannot be shut down before the holiday season." }
              as: ComplianceManager
              captures: { err_id: $.data.error_id }
            - call: "POST /extension-requests"
              payload: { leak_event_id: "${event_id}", reason_code: "PARTS_UNAVAILABLE", requested_days: 10, justification: "Compressor gasket kit on national backorder." }
              as: ComplianceManager
              captures: { req_id: $.data.id, req_status: $.data.status }
          assert:
            - "the industrial-reason request is HTTP 422 with error_id == ERR_EXTENSION_REASON_NOT_APPLICABLE"
            - "the PARTS_UNAVAILABLE request is HTTP 201 with status == PENDING, granted_days == null, requested_at == 2026-08-01T00:00:00Z, expires_at == 2026-08-16T00:00:00Z"
            - "ExtensionRequest.${req_id}.deadline_before == 2026-08-31T00:00:00Z and deadline_after == null"
            - "LeakEvent.${event_id}.repair_deadline == 2026-08-31T00:00:00Z and extension_days_remaining == 30 (a PENDING request moves nothing)"
            - "GET /extension-requests?leak_event_id=${event_id} returns total_count 1"

