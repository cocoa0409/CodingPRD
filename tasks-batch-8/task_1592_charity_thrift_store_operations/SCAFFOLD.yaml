    code: 201
    input: [target_route_id, window_start, window_end]
    output: PickupStop
    side_effects: ["new stop created with same donor_id and estimated_volume_cuft", "target route stop_count/total_volume_cuft recompute", "target PickupRoute.version += 1"]

