      - name: confirming_a_high_turnover_risk_booking_needs_an_approved_waiver
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_TURNOVER_RISK_BLOCK]
          - calculations.burnout_risk_score
          - entities.StaffMember.fields.turnover_risk_band
          - state_machines.WorkloadWaiver.status.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Four consecutive 49.00-hour weeks each sit 9.00 over the 40.00 base cap, and because
          the decay weights 1.00 + 0.75 + 0.50 + 0.25 divide by 2.50 the committed score is
          exactly 9.00 — HIGH. The booking is legal to create (49.00 <= the 50.00 effective
          cap) but cannot be CONFIRMED until an APPROVED waiver exists for the ISO week of its
          start_date, and the waiver unblocks that week only.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z (ISO week 2026-08-03 is the current week); MERIDIAN client, DOMESTIC partner P1, DOMESTIC senior S1 (base cap 40.00 -> effective 50.00, daily capacity 10.00)."
            - "Engagement E1 with phase PH1 FIELDWORK expecting 200.00 hours in 2026-08-03..2026-08-31."
            - "Four 49.00-hour bookings for S1, one per ISO week: [2026-08-03, 2026-08-10), [2026-08-10, 2026-08-17), [2026-08-17, 2026-08-24) and [2026-08-24, 2026-08-31); each is 7 days x 7.00 daily hours, so committed(week) == 49.00 and overage == 9.00 in all four weeks."
