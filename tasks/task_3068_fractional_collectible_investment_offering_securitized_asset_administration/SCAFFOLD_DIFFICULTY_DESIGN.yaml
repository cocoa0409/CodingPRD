  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: subscription_withdrawal_restores_the_offering_cash_ledger_exactly
        grounds:
          - state_machines.Subscription.SUBSCRIBED_to_WITHDRAWN
          - calculations.platform_cash_invariant
          - entities.Offering.fields.cash_ledger_cents
          - entities.PlatformAccount.fields.investor_funds_held_cents
          - endpoints.POST_/api/subscriptions/{id}/withdraw
        distinguishing_aspect: "A conserved cash quantity with two named invariants: cash_ledger_cents == sum(collected_subscription_cents) - sum(refunded_cents) and balance_cents == investor_funds_held_cents + unsegregated cash must both return unchanged by a forward-withdraw pair — the conserved quantity is cash across the Subscription/Offering/PlatformAccount triple."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z, inside the three-day rescission window. A filed offering with two screened subscriptions holding 30000000 and 15000000 cents of collected funds."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/platform-accounts"
              payload: { account_name: "Segregated Investor Funds" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/artists"
              payload: { legal_name: "Hollis Vandermeer", attribution_status: "CONFIRMED", nationality_country_code: "US", birth_year: 1948 }
              as: IssuerOps
              captures: { artist_id: $.data.id }
