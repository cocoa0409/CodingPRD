              as: CertifyingEngineer
              as_user_id: "eng-1"
              captures: { e_sod_approve: $.data.error_id }
            - call: "POST /signal-ops/priority-configs/${cfg_id}/approve"
              payload: { decision: "APPROVE" }
              as: CertifyingEngineer
              as_user_id: "cert-1"
