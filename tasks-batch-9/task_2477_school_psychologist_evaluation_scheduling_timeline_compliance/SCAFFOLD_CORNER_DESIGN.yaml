            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { verfresh: $.data.version }
          trigger:
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${verstale}", psychologist_id: "${pb}" }
              as: PsychServicesSupervisor
          assert:
            - "HTTP 412 with data.error_id == \"ERR_STALE_EVALUATION_VERSION\""
            - "${verfresh} == ${verstale} + 1 — every successful write increments version"
            - "Evaluation.${eval1}.psychologist_id is still ${pa}, reassignment_count == 0, and Psychologist.${pb}.open_case_points == 0"
            - "Repeating the trigger with expected_evaluation_version ${verfresh} returns HTTP 200 with psychologist_id == ${pb} and reassignment_count == 1"

      - name: meeting_creation_with_stale_evaluation_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rule_id=meeting-create-stale-evaluation]
          - errors.ERR_STALE_EVALUATION_VERSION
          - endpoints["POST /psych-services/eligibility-meetings"]
        distinguishing_aspect: "The SECOND declared OCC rule guards a different endpoint and a different entity's creation: the scheduler's snapshot goes stale because someone else ASSIGNED the evaluation, and the 412 leaves no EligibilityMeeting row behind at all."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School (capacity 2); one ACTIVE SSP psychologist."
            - "One INITIAL 1-domain referral consented; the scheduler captures the Evaluation version, then the supervisor assigns the psychologist (version advances)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Brookvale Middle", building_code: "BV70", grade_band: "MIDDLE", concurrent_meeting_capacity: 2, enrollment_count: 490 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Dot Ellery", employee_number: "E-2043", credential_type: "SSP", assigned_school_ids: ["${s1}"] }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-54", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-54" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: IntakeCoordinator
              captures: { verstale2: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${verstale2}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: IntakeCoordinator
              captures: { verfresh2: $.data.version }
          trigger:
            - call: "POST /psych-services/eligibility-meetings"
              payload: { evaluation_id: "${eval1}", school_id: "${s1}", scheduled_start_at: "2026-09-20T15:00:00Z", scheduled_end_at: "2026-09-20T16:00:00Z", expected_evaluation_version: "${verstale2}" }
              as: IntakeCoordinator
          assert:
            - "HTTP 412 with data.error_id == \"ERR_STALE_EVALUATION_VERSION\""
            - "GET /psych-services/eligibility-meetings?evaluation_id=${eval1} returns total_count == 0 — no meeting row was created"
            - "${verfresh2} == ${verstale2} + 1"
            - "Repeating the trigger with expected_evaluation_version ${verfresh2} returns HTTP 201 with status == PROPOSED, notice_lead_days == null and reschedule_count == 0"

      - name: cascading_side_effects_layer_stub
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.TimelineExclusion.CLAIMED_to_APPROVED
        excluded_because:
          difficulty_instance: transitive_cascade / exclusion_approval_cascade_depth_five_vacates_remedy
          rationale: "The deepest declared chain (exclusion credit -> due date -> posture -> breach VACATED -> remedy zeroed -> pressure re-derived) is asserted level by level in that §1.8 instance."

      - name: dual_variant_calculation_layer_stub
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.compensatory_minutes.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / compensatory_minutes_basis_divergence_on_breach
          rationale: "Both compensatory bases and the delta between them on one breach are asserted there; the pressure-index pair is covered by the other dual_variant_calc instance."

  - section: consistency_model
    instances:
      - name: assignment_cascade_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.psychologist_open_case_points
          - endpoints["POST /psych-services/evaluations/{evaluation_id}/assign"]
        distinguishing_aspect: "consistency_model is immediate, so no read-after-write lag is tolerated anywhere: the assign RESPONSE already carries the new state, and a read of the OTHER entity touched by the same request (the psychologist's four derived caseload fields) is already updated with no intervening call."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School; one ACTIVE SSP psychologist (capacity 20, zero load)."
            - "One INITIAL 2-domain referral (6 caseload points) consented at 2026-08-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Cliffside High", building_code: "CS71", grade_band: "HIGH", concurrent_meeting_capacity: 2, enrollment_count: 700 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Eve Larkin", employee_number: "E-2044", credential_type: "SSP", assigned_school_ids: ["${s1}"] }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-55", referral_type: "INITIAL", requested_domains: ["COGNITIVE", "ACADEMIC"] }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-55" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
          trigger:
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
          assert:
            - "The trigger's own response body already shows assessment_status == ASSIGNED, psychologist_id == ${pa} and version == ${ver1} + 1"
            - "The very next call, GET /psych-services/psychologists/${pa}, already shows open_case_points == 6, caseload_status == BALANCED, pressure_index_assigned_basis == 0.30 and pressure_index_clock_weighted == 0.30"
            - "GET /psych-services/evaluations?psychologist_id=${pa} already returns the evaluation — no lag on the reverse index either"
