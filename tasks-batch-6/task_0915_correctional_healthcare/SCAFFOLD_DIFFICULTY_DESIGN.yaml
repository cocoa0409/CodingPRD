      - name: terminal_transport_state_preempts_cancel_cutoff
        grounds:
          - "validations[priority=13]"
          - "validations[priority=28]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_CANCEL_CUTOFF_PASSED]"
        distinguishing_aspect: |
          A THIRD category pair: `state` (priority 13, ERR_INVALID_STATE) versus
          `business_temporal` (priority 28, ERR_CANCEL_CUTOFF_PASSED). Cancelling an already
          CANCELLED trip after its cutoff violates both; the state check wins, while a
          still-DRAFT trip past its cutoff surfaces the temporal error.
        test_recipe:
          setup:
            - "A MEDIUM-custody inmate with a ROUTINE referral AUTHORIZED at 2026-05-01T00:00:00Z."
            - "Trip 1 booked for 2026-05-03T00:00:00Z and cancelled while still inside its cutoff."
            - "Trip 2 booked for 2026-05-05T00:00:00Z at clock 2026-05-02T23:00:00Z and left in DRAFT."
            - "Clock finally advanced to 2026-05-04T23:00:00Z, which is past trip 2's cutoff of 2026-05-04T22:00:00Z and past trip 1's cutoff of 2026-05-02T22:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1130", full_name: "Pat Quill", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /specialty-referrals"
              payload: { inmate_id: "${inm}", specialty: "DIALYSIS", urgency: "ROUTINE" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ref: $.data.id }
            - call: "POST /specialty-referrals/${ref}/submit-for-review"
              payload: { retrospective: false }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ur: $.data.id }
            - call: "POST /utilization-reviews/${ur}/decide"
              payload: { decision: "APPROVE" }
              as: UtilizationReviewer
              as_user_id: "u-ur-1"
            - call: "GET /specialty-referrals/${ref}"
              payload: {}
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { ref_v1: $.data.version }
            - call: "POST /transport-orders"
              payload: { referral_id: "${ref}", appointment_at: "2026-05-03T00:00:00Z", expected_referral_version: "${ref_v1}" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { trip1: $.data.id }
            - call: "POST /transport-orders/${trip1}/cancel"
              payload: { cancel_reason: "VENDOR_CANCELLED" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T23:00:00Z" }
              as: HealthServicesAdmin
            - call: "GET /specialty-referrals/${ref}"
              payload: {}
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { ref_v2: $.data.version }
            - call: "POST /transport-orders"
              payload: { referral_id: "${ref}", appointment_at: "2026-05-05T00:00:00Z", expected_referral_version: "${ref_v2}" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { trip2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T23:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /transport-orders/${trip1}/cancel"
              payload: { cancel_reason: "FACILITY_LOCKDOWN" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
            - call: "POST /transport-orders/${trip2}/cancel"
              payload: { cancel_reason: "FACILITY_LOCKDOWN" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
          assert:
            - "The first trigger call returns 409 with error_id ERR_INVALID_STATE, not ERR_CANCEL_CUTOFF_PASSED"
            - "The second trigger call returns 422 with error_id ERR_CANCEL_CUTOFF_PASSED"
            - "TransportOrder.${trip1}.status == CANCELLED and TransportOrder.${trip1}.cancel_reason == VENDOR_CANCELLED"
            - "TransportOrder.${trip2}.status == DRAFT"

  - rule_id: boundary_precision_check
