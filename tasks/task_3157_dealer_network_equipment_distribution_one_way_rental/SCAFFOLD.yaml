    side_effects: ["EquipmentUnit AVAILABLE <-> MAINTENANCE"]
  - method: POST
    path: "/rental-network/equipment-units/{id}/retire"
    description: "Retire a unit (terminal)"
    roles: [NetworkAdmin]
    code: 200
    input: []
