          assert:
            - "Tap.${t2}.transfer_discount_cents == 300 and Tap.${t2}.charge_cents == 0 (exactly 120 min is inside the window, inclusive)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
