            - "Subscriptions sn1 (sub1) and sn2 (sub2) are both ACTIVE + AUTHORIZED_FIXED on CELL-001, so weighted_sold_mbps is 400 and the ratio is 2.0."
            - "A capacity-policy write then lowered oversubscription_limit to 1.5, so the beam is SATURATED and CELL-001 reads CLOSED."
