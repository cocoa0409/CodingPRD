            - "EditCheck.${ec1}.status == ACCEPTED and explanation_round == 1 (unchanged by the refused re-explanation)"
            - "SurveyComponent.${comp}.edit_status == CLEARED"

      - name: corner_sm_restatement_rejection_returns_the_publication_to_its_prior_state
        claim_type: Valid Transition
        grounds:
          - state_machines.DashboardPublication.RESTATEMENT_PENDING_to_PUBLISHED
