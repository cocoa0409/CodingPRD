      - name: only_legal_escalated_cases_enter_the_posture_input_set
        claim_type: input_set_filtering
        grounds: [calculations.talent_rights_posture.input_set, state_machines.InfringementCase]
        distinguishing_aspect: >-
          The posture's case input set is exactly {LEGAL_ESCALATED}. One case is walked through
          DETECTED -> TAKEDOWN_ISSUED -> LEGAL_ESCALATED -> CLOSED_SETTLED with the talent re-read at
          every step: a high-severity case that is not yet escalated must leave the posture CLEAR, and
          a terminal escalated case must stop contributing again.
        test_recipe:
          setup:
            - "CA profile and one CA talent with no grants and no assets, so the removal-obligation and suspension clauses stay silent"
            - "One case opened at match_confidence 1.000 over 10,000,000 views while the talent is CLEAR"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/clip", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 10000000, match_confidence: 1.000 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
            - call: "POST /infringement-cases/${c_id}/triage"
              payload: { decision: "ISSUE_TAKEDOWN" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
            - call: "POST /infringement-cases/${c_id}/escalate"
              payload: { escalation_note: "vendor ignored the notice" }
              as: RightsAdministrator
              as_user_id: "ra-002"
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
            - call: "POST /infringement-cases/${c_id}/close"
              payload: { outcome: "SETTLED" }
              as: RightsAdministrator
              as_user_id: "ra-002"
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
          assert:
            - "the case was created with severity_score == 0.8950 (0.60*1.000 + 0.25*min(1, 10000000/10000000) + 0.15*0.30 for a CLEAR talent) and status \"DETECTED\""
            - "trigger call 1: rights_posture == \"CLEAR\" — a DETECTED case is outside the input set no matter how severe"
            - "trigger call 2 -> 200 with status \"TAKEDOWN_ISSUED\", takedown_issued_at == \"2026-08-01T00:00:00Z\" and triaged_by_user_id == \"co-001\""
            - "trigger call 3: rights_posture is STILL \"CLEAR\" — TAKEDOWN_ISSUED is not LEGAL_ESCALATED"
            - "trigger call 4 -> 200 with status \"LEGAL_ESCALATED\", escalated_by_user_id == \"ra-002\" and legal_hold_applied_count == 0 (the talent owns no assets, so the cascade hops are all empty)"
            - "trigger call 5: rights_posture == \"FROZEN\", while legal_hold_asset_count == 0 and open_removal_obligation_count == 0 — the freeze comes from the case state alone"
            - "trigger call 6 -> 200 with status \"CLOSED_SETTLED\" and closure_outcome == \"SETTLED\""
            - "trigger call 7: rights_posture == \"CLEAR\" again — CLOSED_SETTLED is terminal and contributes nothing, yet GET /infringement-cases?talent_id=${t_id} still returns the row with its stored severity_score 0.8950"

