  - id: ERR_NO_SEASONAL_OPEN_VISIT
    http: 409
    condition: "a spring open is completed with no qualifying COMPLETED SEASONAL_OPEN visit"
  - id: ERR_PROPERTY_HAS_OPEN_STORM_HOLD
    http: 409
    condition: "a seasonal transition is attempted while Property.storm_hold_flag is true"
  # --- G7 occupancy ---
  - id: ERR_OCCUPANCY_FORBIDS_VISIT
    http: 409
    condition: "the visit type is illegal in the property's current occupancy_state"
