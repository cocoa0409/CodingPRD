# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3340_mortgage_insurance_endorsement_approved_lender_oversight
# Nine Difficulty Rules x 2 instances each = 18 instances.
# All times are logical-clock times (default 2026-09-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: annual_mip_rate_diverges_by_vintage_for_identical_loan_amounts
        grounds:
          - calculations.annual_mip_and_cancellation
          - entities.LoanCase.fields.mip_vintage
          - entities.MipLedgerEntry.fields.amount_cents
        distinguishing_aspect: "Two LoanCases with identical base_loan_amount_cents, appraised_value_cents and current_balance_cents receive different ANNUAL premium amounts solely because one was endorsed before 2024-01-01 (PRE_CUTOFF flat 55 bps) and the other after (POST_CUTOFF LTV-tiered 50 bps at LTV 7500) — vintage, a LoanCase-domain dual variant, drives the divergence."
        test_recipe:
          setup:
            - "Logical clock will move: endorsement A at 2023-06-01 (PRE_CUTOFF), endorsement B at 2024-06-01 (POST_CUTOFF)."
            - "Lender APPROVED (net worth floor 100000000; filing net worth 120000000, liquid 20000000, FYE within 15 months, qc_plan_on_file true)."
            - "Case A and Case B both base_loan_amount_cents=30000000, appraised_value_cents=40000000 (ltv_bps 7500), each with an ACCEPTED appraisal unexpired at its endorsement date."
            - "Both cases ENDORSED at their respective clocks; each billed ANNUAL with current_balance_cents=30000000."
          setup_api_calls:
            - &d1_clock_2023
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2023-06-01T00:00:00Z" }
              as: PlatformAdmin
            - &d1_lender
              call: "POST /mi/lenders"
              payload: { legal_name: "Meridian Home Lending", institution_type: "MORTGAGEE_SUPERVISED", home_state: "TX", qc_plan_on_file: true }
              as: PlatformAdmin
              captures: { d1_lender_id: $.data.id, d1_lender_v: $.data.version }
            - &d1_filing
              call: "POST /mi/lenders/${d1_lender_id}/financial-filings"
              payload: { fiscal_year_end: "2022-12-31", total_assets_cents: 140000000, total_liabilities_cents: 20000000, liquid_assets_cents: 20000000, expected_lender_version: "${d1_lender_v}" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d1_filing_id: $.data.id }
            - &d1_filing_accept
              call: "POST /mi/financial-filings/${d1_filing_id}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d1_lender_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - &d1_advance
              call: "POST /mi/lenders/${d1_lender_id}/status-change"
              payload: { action: "ADVANCE_TO_FIELD_REVIEW" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - &d1_approve
              call: "POST /mi/lenders/${d1_lender_id}/status-change"
              payload: { action: "APPROVE" }
              as: FhaApprover
              as_user_id: "appr-beta"
            - &d1_case_a
              call: "POST /mi/loan-cases"
              payload: { lender_id: "${d1_lender_id}", borrower_reference: "BOR-A", base_loan_amount_cents: 30000000, appraised_value_cents: 40000000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 199591 }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d1_case_a: $.data.id }
            - &d1_appraisal_a
              call: "POST /mi/loan-cases/${d1_case_a}/appraisals"
              payload: { appraised_value_cents: 40000000, effective_date: "2023-05-15" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d1_appraisal_a: $.data.id }
            - &d1_appraisal_a_accept
              call: "POST /mi/appraisals/${d1_appraisal_a}/decide"
              payload: { decision: "ACCEPT" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - &d1_submit_a
              call: "POST /mi/loan-cases/${d1_case_a}/submit-underwriting"
              payload: {}
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
            - &d1_endorse_a
              call: "POST /mi/loan-cases/${d1_case_a}/endorsement-review"
              payload: { decision: "ENDORSE" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - &d1_bill_a
              call: "POST /mi/loan-cases/${d1_case_a}/mip-events"
              payload: { event_type: "ANNUAL_BILL", current_balance_cents: 30000000 }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mi/loan-cases"
              payload: { lender_id: "${d1_lender_id}", borrower_reference: "BOR-B", base_loan_amount_cents: 30000000, appraised_value_cents: 40000000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 199591 }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d1_case_b: $.data.id }
            - call: "POST /mi/loan-cases/${d1_case_b}/appraisals"
              payload: { appraised_value_cents: 40000000, effective_date: "2024-05-15" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d1_appraisal_b: $.data.id }
            - call: "POST /mi/appraisals/${d1_appraisal_b}/decide"
              payload: { decision: "ACCEPT" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /mi/loan-cases/${d1_case_b}/submit-underwriting"
              payload: {}
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
            - call: "POST /mi/loan-cases/${d1_case_b}/endorsement-review"
              payload: { decision: "ENDORSE" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
          trigger:
            - call: "POST /mi/loan-cases/${d1_case_b}/mip-events"
              payload: { event_type: "ANNUAL_BILL", current_balance_cents: 30000000 }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d1_bill_b_amount: $.data.amount_cents, d1_bill_b_rate: $.data.rate_bps }
          assert:
            - "LoanCase.${d1_case_a}.mip_vintage == PRE_CUTOFF"
            - "LoanCase.${d1_case_b}.mip_vintage == POST_CUTOFF"
            - "case A ANNUAL entry amount_cents == 165000 (30000000 * 55bps)"
            - "MipLedgerEntry amount captured ${d1_bill_b_amount} == 150000 (30000000 * 50bps)"
            - "captured rate ${d1_bill_b_rate} == 50"
            - "identical loan amounts, different vintage -> 165000 != 150000"

      - name: net_worth_floor_diverges_by_variant_for_identical_financials
        grounds:
          - calculations.required_net_worth
          - entities.Lender.fields.net_worth_variant
          - entities.Lender.fields.required_net_worth_cents
        distinguishing_aspect: "Two lenders filing identical financials (net worth 75000000) get different required_net_worth_cents purely from the variant selector — MORTGAGEE_SUPERVISED uses STANDARD (floor 100000000) while MORTGAGEE_NONSUPERVISED with zero endorsed volume uses SMALL_LENDER (floor 50000000) — a Lender-domain dual variant, distinct from the LoanCase vintage variant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01 (default). Lender S is MORTGAGEE_SUPERVISED; lender N is MORTGAGEE_NONSUPERVISED."
            - "Both file FYE 2026-06-30 with adjusted net worth 75000000 and liquid assets 11000000 (liquidity passes both floors: 55000000 >= 50000000 and... 55000000 < 100000000 — liquidity checked only after net worth)."
            - "Both advanced to FIELD_REVIEW."
          setup_api_calls:
            - &d2_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *d2_clock
            - call: "POST /mi/lenders"
              payload: { legal_name: "Supervised Bank Mortgage Co", institution_type: "MORTGAGEE_SUPERVISED", home_state: "VA", qc_plan_on_file: true }
              as: PlatformAdmin
              captures: { d2_lender_s: $.data.id, d2_lender_s_v: $.data.version }
            - call: "POST /mi/lenders"
              payload: { legal_name: "Independent Mortgage Bankers", institution_type: "MORTGAGEE_NONSUPERVISED", home_state: "VA", qc_plan_on_file: true }
              as: PlatformAdmin
              captures: { d2_lender_n: $.data.id, d2_lender_n_v: $.data.version }
            - call: "POST /mi/lenders/${d2_lender_s}/financial-filings"
              payload: { fiscal_year_end: "2026-06-30", total_assets_cents: 95000000, total_liabilities_cents: 20000000, liquid_assets_cents: 11000000, expected_lender_version: "${d2_lender_s_v}" }
              as: LenderOfficer
              as_user_id: "${d2_lender_s}"
              captures: { d2_filing_s: $.data.id }
            - call: "POST /mi/lenders/${d2_lender_n}/financial-filings"
              payload: { fiscal_year_end: "2026-06-30", total_assets_cents: 95000000, total_liabilities_cents: 20000000, liquid_assets_cents: 11000000, expected_lender_version: "${d2_lender_n_v}" }
              as: LenderOfficer
              as_user_id: "${d2_lender_n}"
              captures: { d2_filing_n: $.data.id }
            - call: "POST /mi/financial-filings/${d2_filing_s}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d2_lender_s_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /mi/financial-filings/${d2_filing_n}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d2_lender_n_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /mi/lenders/${d2_lender_s}/status-change"
              payload: { action: "ADVANCE_TO_FIELD_REVIEW" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /mi/lenders/${d2_lender_n}/status-change"
              payload: { action: "ADVANCE_TO_FIELD_REVIEW" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
          trigger:
            - call: "POST /mi/lenders/${d2_lender_n}/status-change"
              payload: { action: "APPROVE" }
              as: FhaApprover
              as_user_id: "appr-beta"
              captures: { d2_n_status: $.data.status }
            - call: "POST /mi/lenders/${d2_lender_s}/status-change"
              payload: { action: "APPROVE" }
              as: FhaApprover
              as_user_id: "appr-beta"
              captures: { d2_s_error: $.data.error_id }
          assert:
            - "Lender.${d2_lender_n}.net_worth_variant == SMALL_LENDER and required_net_worth_cents == 50000000"
            - "Lender.${d2_lender_s}.net_worth_variant == STANDARD and required_net_worth_cents == 100000000"
            - "captured ${d2_n_status} == APPROVED (75000000 net worth clears the 50000000 floor)"
            - "captured ${d2_s_error} == ERR_NET_WORTH_DEFICIENT (identical 75000000 net worth fails the 100000000 floor)"
            - "Lender.${d2_lender_s}.status remains FIELD_REVIEW"

  - rule_id: combinatorial_formula
    instances:
      - name: ufmip_refund_credit_tiered_on_elapsed_months
        grounds:
          - calculations.ufmip_with_refinance_credit
          - entities.MipLedgerEntry.fields.credit_cents
          - state_machines.LoanCase.UNDERWRITE_SUBMITTED_to_ENDORSED
        distinguishing_aspect: "Mode (a) combinatorial: 3+ inputs (prior UFMIP, complete months elapsed, refinance flag) with a tiered rate (8000 - 200*(months-1), floored at 1000 bps) gated by a 36-month window — prior endorsed 2023-06-01, refinance endorsed 2024-01-15 gives months_elapsed 7 and credit exactly 68% of the prior gross UFMIP."
        test_recipe:
          setup:
            - "Lender APPROVED (as in annual_mip_rate_diverges_by_vintage_for_identical_loan_amounts)."
            - "Case A: base 2000000, appraised 2200000, endorsed 2023-06-01 -> UPFRONT gross 35000 cents, no credit."
            - "Case B: refinance_of_case_id = case A, base 3000000, appraised 3300000; endorsed at 2024-01-15 -> months_elapsed 7 -> refund_pct_bps = 8000 - 200*6 = 6800."
          setup_api_calls:
            - *d1_clock_2023
            - *d1_lender
            - *d1_filing
            - *d1_filing_accept
            - *d1_advance
            - *d1_approve
            - call: "POST /mi/loan-cases"
              payload: { lender_id: "${d1_lender_id}", borrower_reference: "BOR-REFI-A", base_loan_amount_cents: 2000000, appraised_value_cents: 2200000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 13306 }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d3_case_a: $.data.id }
            - call: "POST /mi/loan-cases/${d3_case_a}/appraisals"
              payload: { appraised_value_cents: 2200000, effective_date: "2023-05-15" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d3_app_a: $.data.id }
            - call: "POST /mi/appraisals/${d3_app_a}/decide"
              payload: { decision: "ACCEPT" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /mi/loan-cases/${d3_case_a}/submit-underwriting"
              payload: {}
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
            - call: "POST /mi/loan-cases/${d3_case_a}/endorsement-review"
              payload: { decision: "ENDORSE" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mi/loan-cases"
              payload: { lender_id: "${d1_lender_id}", borrower_reference: "BOR-REFI-B", base_loan_amount_cents: 3000000, appraised_value_cents: 3300000, term_months: 360, note_rate_bps: 650, current_monthly_payment_cents: 18962, refinance_of_case_id: "${d3_case_a}" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d3_case_b: $.data.id }
            - call: "POST /mi/loan-cases/${d3_case_b}/appraisals"
              payload: { appraised_value_cents: 3300000, effective_date: "2024-01-02" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d3_app_b: $.data.id }
            - call: "POST /mi/appraisals/${d3_app_b}/decide"
              payload: { decision: "ACCEPT" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /mi/loan-cases/${d3_case_b}/submit-underwriting"
              payload: {}
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
          trigger:
            - call: "POST /mi/loan-cases/${d3_case_b}/endorsement-review"
              payload: { decision: "ENDORSE" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "GET /mi/loan-cases/${d3_case_b}/mip-ledger-entries"
              payload: {}
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d3_b_upfront_amount: "$.data[0].amount_cents", d3_b_upfront_credit: "$.data[0].credit_cents", d3_b_upfront_type: "$.data[0].entry_type" }
          assert:
            - "captured ${d3_b_upfront_type} == UPFRONT"
            - "captured ${d3_b_upfront_credit} == 23800 (round_half_up(35000 * 6800 / 10000))"
            - "captured ${d3_b_upfront_amount} == 28700 (gross 52500 - credit 23800)"
            - "LoanCase.${d3_case_a} UPFRONT entry amount_cents == 35000 with credit_cents == 0 (outside refinance: no credit)"
            - "months_elapsed 7 -> 68% tier; a 36+ month gap would have produced credit 0 for the same amounts"

      - name: claim_expense_rounding_per_line_then_sum
        grounds:
          - calculations.claim_payment
          - entities.InsuranceClaim.fields.expense_component_cents
          - entities.InsuranceClaim.fields.total_claim_cents
        distinguishing_aspect: "Mode (b) nested rounding: two expense lines of 21 cents at 5000 bps each produce 10.5 cents per line; the pinned order rounds each line first (11 + 11 = 22), while the rejected sum-then-round order gives 21 — a one-cent observable divergence on claim expense_component_cents, a different axis than the tiered-months mode (a) instance."
        test_recipe:
          setup:
            - "Lender APPROVED; case endorsed at 2026-09-01 (base 20000000, appraised 24000000, ltv 8333 -> POST_CUTOFF), defaulted 2026-10-01 (default_date)."
            - "Waterfall exhausted: all six tiers INFEASIBLE."
            - "Clock at 2026-10-02 when the claim is filed (within default + 180 days)."
          setup_api_calls:
            - *d2_clock
            - *d1_lender
            - call: "POST /mi/lenders/${d1_lender_id}/financial-filings"
              payload: { fiscal_year_end: "2026-06-30", total_assets_cents: 140000000, total_liabilities_cents: 20000000, liquid_assets_cents: 20000000, expected_lender_version: "${d1_lender_v}" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d4_filing_id: $.data.id }
            - call: "POST /mi/financial-filings/${d4_filing_id}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d1_lender_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - *d1_advance
            - *d1_approve
            - &c_case
              call: "POST /mi/loan-cases"
              payload: { lender_id: "${d1_lender_id}", borrower_reference: "BOR-C", base_loan_amount_cents: 20000000, appraised_value_cents: 24000000, term_months: 360, note_rate_bps: 750, current_monthly_payment_cents: 120000 }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_case_id: $.data.id }
            - &c_appraisal
              call: "POST /mi/loan-cases/${c_case_id}/appraisals"
              payload: { appraised_value_cents: 24000000, effective_date: "2026-08-15" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_app_id: $.data.id }
            - &c_appraisal_accept
              call: "POST /mi/appraisals/${c_app_id}/decide"
              payload: { decision: "ACCEPT" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - &c_submit
              call: "POST /mi/loan-cases/${c_case_id}/submit-underwriting"
              payload: {}
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
            - &c_endorse
              call: "POST /mi/loan-cases/${c_case_id}/endorsement-review"
              payload: { decision: "ENDORSE" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_default
              call: "POST /mi/loan-cases/${c_case_id}/declare-default"
              payload: {}
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
            - &c_lm1
              call: "POST /mi/loan-cases/${c_case_id}/loss-mitigation-actions"
              payload: { action_type: "REPAYMENT_PLAN" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_lm1: $.data.id }
            - &c_lm1_eval
              call: "POST /mi/loss-mitigation-actions/${c_lm1}/evaluate"
              payload: { decision: "INFEASIBLE" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
            - &c_lm2
              call: "POST /mi/loan-cases/${c_case_id}/loss-mitigation-actions"
              payload: { action_type: "SPECIAL_FORBEARANCE" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_lm2: $.data.id }
            - &c_lm2_eval
              call: "POST /mi/loss-mitigation-actions/${c_lm2}/evaluate"
              payload: { decision: "INFEASIBLE" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
            - &c_lm3
              call: "POST /mi/loan-cases/${c_case_id}/loss-mitigation-actions"
              payload: { action_type: "LOAN_MODIFICATION" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_lm3: $.data.id }
            - &c_lm3_eval
              call: "POST /mi/loss-mitigation-actions/${c_lm3}/evaluate"
              payload: { decision: "INFEASIBLE" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
            - &c_lm4
              call: "POST /mi/loan-cases/${c_case_id}/loss-mitigation-actions"
              payload: { action_type: "PARTIAL_CLAIM" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_lm4: $.data.id }
            - &c_lm4_eval
              call: "POST /mi/loss-mitigation-actions/${c_lm4}/evaluate"
              payload: { decision: "INFEASIBLE" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
            - &c_lm5
              call: "POST /mi/loan-cases/${c_case_id}/loss-mitigation-actions"
              payload: { action_type: "PRE_FORECLOSURE_SALE" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_lm5: $.data.id }
            - &c_lm5_eval
              call: "POST /mi/loss-mitigation-actions/${c_lm5}/evaluate"
              payload: { decision: "INFEASIBLE" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
            - &c_lm6
              call: "POST /mi/loan-cases/${c_case_id}/loss-mitigation-actions"
              payload: { action_type: "DEED_IN_LIEU" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_lm6: $.data.id }
            - &c_lm6_eval
              call: "POST /mi/loss-mitigation-actions/${c_lm6}/evaluate"
              payload: { decision: "INFEASIBLE" }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mi/loan-cases/${c_case_id}/claims"
              payload: { claim_type: "CONVEYANCE", unpaid_principal_balance_cents: 20000000, expense_items: [{ amount_cents: 21, allowable_pct_bps: 5000 }, { amount_cents: 21, allowable_pct_bps: 5000 }] }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_claim_principal: $.data.principal_component_cents, c_claim_expense: $.data.expense_component_cents, c_claim_total: $.data.total_claim_cents }
          assert:
            - "captured ${c_claim_principal} == 17000000 (round_half_up(20000000 * 0.85))"
            - "captured ${c_claim_expense} == 22 (per-line rounding: round_half_up(10.5) + round_half_up(10.5) = 11 + 11)"
            - "captured ${c_claim_total} == 17000022"
            - "sum-then-round would have produced expense 21 and total 17000021 — the pinned order is observable"

      - name: modification_restructure_pinned_evaluation_order
        grounds:
          - calculations.modification_restructure
          - entities.LossMitigationAction.fields.new_upb_cents
          - entities.LossMitigationAction.fields.reduction_bps
        distinguishing_aspect: "Mode (c) circular-looking dependency: late fees derive from the frozen old payment, arrears feed new UPB, new UPB feeds the new payment, and the reduction test compares new against old — only the pinned (1)-(8) order yields new_payment_cents == 94092 and reduction_bps == 2159 for the fixed inputs; any other evaluation order shifts the result."
        test_recipe:
          setup:
            - "Lender APPROVED; case endorsed 2026-09-01 (base 20000000, appraised 24000000, note_rate 750 bps, current_monthly_payment_cents 120000), defaulted 2026-10-01."
            - "Tiers 1-2 evaluated INFEASIBLE; tier 3 LOAN_MODIFICATION action PENDING."
          setup_api_calls:
            - *d2_clock
            - *d1_lender
            - call: "POST /mi/lenders/${d1_lender_id}/financial-filings"
              payload: { fiscal_year_end: "2026-06-30", total_assets_cents: 140000000, total_liabilities_cents: 20000000, liquid_assets_cents: 20000000, expected_lender_version: "${d1_lender_v}" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d5_filing_id: $.data.id }
            - call: "POST /mi/financial-filings/${d5_filing_id}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d1_lender_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - *d1_advance
            - *d1_approve
            - *c_case
            - *c_appraisal
            - *c_appraisal_accept
            - *c_submit
            - *c_endorse
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_default
            - *c_lm1
            - *c_lm1_eval
            - *c_lm2
            - *c_lm2_eval
            - *c_lm3
          trigger:
            - call: "POST /mi/loss-mitigation-actions/${c_lm3}/evaluate"
              payload: { decision: "APPROVE", months_late: 4, escrow_advances_cents: 30000 }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { c_lm3_status: $.data.status, c_lm3_new_upb: $.data.new_upb_cents, c_lm3_new_pay: $.data.new_payment_cents, c_lm3_red: $.data.reduction_bps }
          assert:
            - "captured ${c_lm3_status} == APPROVED"
            - "captured ${c_lm3_new_upb} == 20529200 (20000000 + 4*120000 + round_half_up(120000*0.04)*4 + 30000)"
            - "captured ${c_lm3_new_pay} == 94092 (round_half_up(20529200 * 550 / 120000); modified rate = max(750-200, 300) = 550)"
            - "captured ${c_lm3_red} == 2159 (round_half_up((120000 - 94092) / 120000 * 10000)) >= 1000"

  - rule_id: non_linear_state_machine
    instances:
      - name: lender_return_resubmission_cycle
        grounds:
          - state_machines.Lender.RETURNED_to_DESK_REVIEW
          - state_machines.Lender.DESK_REVIEW_to_RETURNED
          - state_machines.Lender.FIELD_REVIEW_to_APPROVED
        distinguishing_aspect: "The Lender machine cycles DESK_REVIEW -> RETURNED -> DESK_REVIEW (resubmission loop) before any approval — a cycle on the Lender entity, distinct from the LoanCase deficiency cycle."
        test_recipe:
          setup:
            - "Lender created (DESK_REVIEW), advanced by rev-alpha, returned to RETURNED, resubmitted by the owning LenderOfficer back to DESK_REVIEW, advanced again."
            - "ACCEPTED filing with net worth 120000000 / liquid 20000000, FYE 2026-06-30; qc_plan_on_file true."
          setup_api_calls:
            - *d2_clock
            - *d1_lender
            - call: "POST /mi/lenders/${d1_lender_id}/financial-filings"
              payload: { fiscal_year_end: "2026-06-30", total_assets_cents: 140000000, total_liabilities_cents: 20000000, liquid_assets_cents: 20000000, expected_lender_version: "${d1_lender_v}" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d6_filing_id: $.data.id }
            - call: "POST /mi/financial-filings/${d6_filing_id}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d1_lender_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - *d1_advance
            - call: "POST /mi/lenders/${d1_lender_id}/status-change"
              payload: { action: "RETURN", note: "missing exhibits" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
              captures: { d6_after_return: $.data.status }
            - call: "POST /mi/lenders/${d1_lender_id}/status-change"
              payload: { action: "RESUBMIT" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d6_after_resubmit: $.data.status }
            - call: "POST /mi/lenders/${d1_lender_id}/status-change"
              payload: { action: "ADVANCE_TO_FIELD_REVIEW" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
          trigger:
            - call: "POST /mi/lenders/${d1_lender_id}/status-change"
              payload: { action: "APPROVE" }
              as: FhaApprover
              as_user_id: "appr-beta"
              captures: { d6_final: $.data.status }
          assert:
            - "captured ${d6_after_return} == RETURNED"
            - "captured ${d6_after_resubmit} == DESK_REVIEW (cycle completed)"
            - "captured ${d6_final} == APPROVED (approval reachable after the loop)"
            - "Lender.${d1_lender_id}.approved_by_user_id == appr-beta"

      - name: loan_case_deficiency_cure_cycle
        grounds:
          - state_machines.LoanCase.UNDERWRITE_SUBMITTED_to_DEFICIENT
          - state_machines.LoanCase.DEFICIENT_to_UNDERWRITE_SUBMITTED
          - state_machines.LoanCase.UNDERWRITE_SUBMITTED_to_ENDORSED
        distinguishing_aspect: "The LoanCase machine cycles UNDERWRITE_SUBMITTED -> DEFICIENT -> UNDERWRITE_SUBMITTED (endorsement deficiency cure) — a cycle on a different entity than the Lender loop, with endorsement reachable after the cycle."
        test_recipe:
          setup:
            - "Lender APPROVED; case with ACCEPTED appraisal (effective 2026-08-15) submitted, flagged DEFICIENT with codes [INCOME_MISCALC], resubmitted."
          setup_api_calls:
