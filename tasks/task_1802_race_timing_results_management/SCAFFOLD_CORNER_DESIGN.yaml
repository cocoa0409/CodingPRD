  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails ERR_UNAUTHENTICATED (401) before any role, existence, or business check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /race-timing/races/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED and HTTP status 401 (not 404 — auth precedes existence)"
      - name: spectator_cannot_create_race
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "roles[Spectator]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Spectator (read-only role) attempting POST /races fails ERR_UNAUTHORIZED_ROLE (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /race-timing/races", payload: { name: "Nope", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }, as: Spectator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE and HTTP status 403"
      - name: auth_beats_business_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=28]"]
        distinguishing_aspect: "A request that is both unauthenticated and semantically invalid returns ERR_UNAUTHENTICATED — priority 1 dominates every later category."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /race-timing/registrations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/confirm", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (401), not ERR_NOT_FOUND or any business error"
