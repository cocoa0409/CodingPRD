  - rule_id: compensating_invariant
    instances:
      - name: lot_mass_balance_invariant
        grounds:
          - entities.Lot.fields.received_qty
          - entities.Lot.fields.qty_on_hand
          - entities.Lot.fields.qty_reserved
          - entities.Lot.fields.qty_dispensed
          - state_machines.CompoundOrder.ALLOCATED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: physical inventory units. For every lot,
          received_qty == qty_on_hand + qty_reserved + qty_dispensed + qty_wasted at every
          step of reserve -> consume -> release: a 50-unit lot shows (20,30,0,0) after
          reserve, (20,0,30,0) after QA consumption, and returns to (20,0,30,0) after a
          second order's 10-unit reserve is released by cancellation — zero drift.
        test_recipe:
          setup:
            - "One lot of 50 units @100; two verified prescriptions qty 30 and qty 10 (same drug)"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen I1", email: "i1@x.com", phone: "555-81", ship_to_address: "17 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Lot", species: "DOG", weight_kg: 3, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr I1", license_number: "LIC-I1", dea_registration_number: "DEA-I1", practice_state: "AZ" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiI1", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 100, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspI1", dosage_form: "SUSPENSION", strength_mg_per_ml: 25, beyond_use_days: 14, base_compounding_minutes: 45 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 30, days_supply: 30, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx1: $.data.id } }
            - { call: "POST /prescriptions/${rx1}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx1}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv1: $.data.version } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 10, days_supply: 10, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx2: $.data.id } }
            - { call: "POST /prescriptions/${rx2}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx2}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv2: $.data.version } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-I1", received_qty: 50, unit_cost_cents: 100, expiration_date: "2027-01-01" }, as: PharmacyTech, captures: { lot: $.data.id } }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-I1", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
          trigger:
            - { call: "POST /prescriptions/${rx1}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxv1}" }, as: PharmacyTech, captures: { ord1: $.data.id } }
            - { call: "POST /compound-orders/${ord1}/allocate", payload: {}, as: PharmacyTech }
            - { call: "GET /lots/${lot}", payload: {}, as: PharmacyTech, captures: { oh1: $.data.qty_on_hand, rs1: $.data.qty_reserved } }
            - { call: "POST /compound-orders/${ord1}/start-compounding", payload: { bench_id: "${bench}", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z" }, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord1}/complete-compounding", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord1}/qa-pass", payload: {}, as: Pharmacist, as_user_id: "pharm-b" }
            - { call: "GET /lots/${lot}", payload: {}, as: PharmacyTech, captures: { oh2: $.data.qty_on_hand, rs2: $.data.qty_reserved, dp2: $.data.qty_dispensed, ws2: $.data.qty_wasted } }
            - { call: "POST /prescriptions/${rx2}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxv2}" }, as: PharmacyTech, captures: { ord2: $.data.id } }
            - { call: "POST /compound-orders/${ord2}/allocate", payload: {}, as: PharmacyTech }
            - { call: "POST /compound-orders/${ord2}/cancel", payload: {}, as: PharmacyTech }
            - { call: "GET /lots/${lot}", payload: {}, as: PharmacyTech, captures: { oh3: $.data.qty_on_hand, rs3: $.data.qty_reserved, dp3: $.data.qty_dispensed, ws3: $.data.qty_wasted } }
          assert:
            - "after reserve: qty_on_hand == 20 AND qty_reserved == 30 AND 50 == 20 + 30 + 0 + 0"
            - "after QA consumption: (on_hand, reserved, dispensed, wasted) == (20, 0, 30, 0) AND 50 == 20 + 0 + 30 + 0"
            - "after release-by-cancel: (on_hand, reserved, dispensed, wasted) == (20, 0, 30, 0) — the reserve/release pair leaves the conserved total unchanged"
            - "CompoundOrder.${ord2}.status == CANCELLED and its allocations are RELEASED"

      - name: wellness_credit_ledger_invariant
        grounds:
          - calculations.wellness_credit_application
          - entities.WellnessEnrollment.fields.credits_remaining
          - entities.WellnessEnrollment.fields.credits_consumed
          - state_machines.CompoundOrder.CREATED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: wellness plan credits (a fiscal ledger, different in type
          from physical inventory units). included_refill_credits == credits_remaining +
          credits_consumed across the pay/refund pair: 5 == 4 + 1 after credit payment,
          and 5 == 5 + 0 after the refund restores the consumed credit.
        test_recipe:
          setup:
            - "Plan with 5 credits x 2000c, discount 0, covers controlled; enrollment ACTIVE; order qty 30 flavored with final price 4433c (credit cap round(0.5*4433)=2217 -> exactly 1 credit usable)"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen I2", email: "i2@x.com", phone: "555-82", ship_to_address: "18 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id, ownv: $.data.version } }
