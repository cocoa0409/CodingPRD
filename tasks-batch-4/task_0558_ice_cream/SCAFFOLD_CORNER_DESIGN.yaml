          trigger:
            - call: "POST /pre-orders"
              payload: { flavor_id: "${van}", decorating_station_id: "${st}", customer_name: "Rey", decorate_start_utc: "2026-05-03T12:00:00Z", decorate_end_utc: "2026-05-03T10:00:00Z", pickup_utc: "2026-05-04T09:00:00Z", quoted_price_cents: 4000 }
              as: Scooper
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_INVALID_TIME_WINDOW"]

  # ===========================================================================
  - section: state_machines
    instances:
      - name: batch_initial_state_is_prep
        claim_type: Initial State
        grounds: [state_machines.Batch, entities.Batch.fields.status]
        distinguishing_aspect: "A freshly produced batch has status PREP with remaining_volume_ml == initial_volume_ml and reserved/committed/wasted == 0."
        test_recipe:
          setup: ["Vanilla flavor"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
          trigger:
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
          assert:
            - "Batch.${b}.status == PREP"
            - "Batch.${b}.remaining_volume_ml == 500"
            - "Batch.${b}.reserved_volume_ml == 0"

      - name: release_available_batch_returns_not_prep
        claim_type: Invalid Transitions
        grounds: ["state_machines.Batch.PREP_to_AVAILABLE", "errors[ERR_BATCH_NOT_PREP]"]
        distinguishing_aspect: "Releasing an already-AVAILABLE batch -> 409 ERR_BATCH_NOT_PREP."
        test_recipe:
          setup: ["Vanilla flavor; batch released to AVAILABLE"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
          trigger:
            - call: "POST /batches/${b}/release"
              payload: {}
