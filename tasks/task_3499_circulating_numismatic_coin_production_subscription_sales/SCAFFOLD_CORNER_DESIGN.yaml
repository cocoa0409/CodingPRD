              as: Collector
              as_user_id: "${c1}"
          trigger:
            - call: "POST /mint/orders/${o_id}/pay"
              payload: { amount_cents: 2000 }
              as: Collector
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
