            - "Level 2 — Panelist pl1 status RECUSED with app1 in recused_application_ids; panel.seated_count is still 5"
            - "Level 3 — Review rv1 status INVALIDATED with invalidation_reason BLOCKING_CONFLICT; rv2..rv5 remain SUBMITTED"
            - "Level 4 — Application valid_review_count 4, provisional_composite_score 7.10 (28.40/4), score_spread 2.50 recomputed over the four survivors"
            - "Level 4b — final_composite_score stays 7.30 and status stays SCORED: FINAL is only rewritten by close-round, never by a conflict cascade"
            - "Level 5 — Panel blocking_conflict_count 1, readiness_score 92.00 (100 x 1.0 x 1.0 x 0.92), quorum_met true (4 >= 3), reopen_required true, status still SLATE_SUBMITTED"
            - "Level 6 — RecommendationSlot slot1 status VOIDED with awarded_amount_cents 0"
            - "Level 6b — cycle.blocking_conflict_count 1 and cycle.posture RESTRICTED even though available_cents is still 5700000 >= base_award_cents"
            - "Board approval of the voided slot returns 409 ERR_SLOT_STATE_INVALID — the priority-65 slot-state check outranks the priority-70 RESTRICTED posture check"

