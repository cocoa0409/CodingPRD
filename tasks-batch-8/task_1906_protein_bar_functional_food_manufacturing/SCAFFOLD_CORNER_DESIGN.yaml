          rationale: "Existence-vs-state ordering asserted in the named §1.8 instance; safety-vs-fiscal ordering asserted in safety_beats_fiscal_gluten_free_moq; state-vs-safety ordering is the active corner c_state_beats_safety_on_verify_pre_run."

  - section: endpoints
    instances:
      - name: c_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id + response_type object/array with data; every error carries response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["one customer created (success envelope), then a 404 (error envelope)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cid: "$.data.id" } }
            - { call: "GET /mfg/customers/99999999-9999-9999-9999-999999999999", payload: {}, as: PlantAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "success: response_type == object, meta.api_request_id present, meta.api_request_timestamp present, data.id present"
            - "error: response_type == error, data.error_id == ERR_CUSTOMER_NOT_FOUND, data.message present, HTTP 404"

      - name: c_fk_reverse_reachability_reads
        claim_type: retrieval
        grounds: ["endpoints"]
        distinguishing_aspect: "Child collections are reachable from parents: GET /mfg/formulas/{id}/revisions lists 2 revisions; GET /mfg/ingredient-lots?ingredient_id filters to the 1 matching lot; GET /mfg/revisions/{id}/claim-reviews returns [] when none exist."
        test_recipe:
          setup: ["supplier; ingredient WHEY with one lot; customer; formula F with revisions R1, R2"]
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED" }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-1", received_qty_kg: 50, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.8 }, as: PlantAdmin, captures: { wl: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "F", bar_weight_g: 60 }, as: FormulationScientist, captures: { f: "$.data.id" } }
            - { call: "POST /mfg/formulas/${f}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 15 }, as: FormulationScientist, captures: { r1: "$.data.id" } }
            - { call: "POST /mfg/formulas/${f}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 45, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 17 }, as: FormulationScientist, captures: { r2: "$.data.id" } }
          trigger:
            - { call: "GET /mfg/formulas/${f}/revisions", payload: {}, as: FormulationScientist, captures: { rev0: "$.data[0].id" } }
            - { call: "GET /mfg/ingredient-lots", payload: { ingredient_id: "${whey}" }, as: PlantAdmin, captures: { lot0: "$.data[0].id" } }
            - { call: "GET /mfg/revisions/${r1}/claim-reviews", payload: {}, as: QualityManager }
          assert:
            - "sub-resource list returns both revisions (data length 2, total_count 2)"
            - "filtered lot list returns exactly the one lot (${wl})"
            - "claim-reviews of a review-less revision returns empty array with total_count 0"

      - name: c_quote_computed_read_stub
        claim_type: computed_read
        grounds: ["endpoints"]
        excluded_because:
          difficulty_instance: marginal_vs_average_tier_pricing
          rationale: "Quote endpoint totals and per-case values asserted in the named §1.8 instance."

      - name: c_day_availability_stub
        claim_type: computed_read
        grounds: [calculations.line_day_availability]
        excluded_because:
          difficulty_instance: line_free_minutes_restored_after_cancel
          rationale: "Day-availability occupied/buffered/free values asserted in the named §1.8 instance."

