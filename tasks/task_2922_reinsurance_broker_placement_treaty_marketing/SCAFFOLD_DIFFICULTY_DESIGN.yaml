              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
          assert:
            - "${holding_after_receipt} == 97125000"
            - "${holding_after_remittance} == 2428125  # exactly the brokerage retained"
            - "FiduciaryTransaction.${rem_id}.status == REVERSED and FiduciaryTransaction.${rem_id}.amount_minor == 94696875"
            - "GET /fiduciary-transactions?program_id=${prog_id}&txn_type=REMITTANCE_REVERSAL returns exactly one row"
            - "that row has amount_minor == 94696875, status == SETTLED and reverses_transaction_id == ${rem_id}"
            - "Program.${prog_id}.fiduciary_holding_minor == 97125000  # restored exactly"
            - "Program.${prog_id}.fiduciary_holding_minor - ${holding_after_remittance} == 94696875"
            - "Cedent.${ced_id}.settled_receipts_minor == 97125000  # untouched by the reversal"
            - "a second reverse of ${rem_id} returns HTTP 422 with ERR_ALREADY_REVERSED"

      - name: releasing_a_provisional_line_hands_the_markets_capacity_back_in_full
        grounds:
          - calculations.reinsurer_aggregate_capacity
          - state_machines.SigningLine.transitions.PROVISIONAL_to_RELEASED
          - state_machines.Layer.transitions.OVERSUBSCRIBED_to_PARTIALLY_PLACED
          - state_machines.Program.transitions.FIRM_ORDER_to_IN_MARKET
          - state_machines.Quote.transitions.FIRM_ORDER_to_LAPSED
          - entities.SigningLine.fields.release_reason
        distinguishing_aspect: |
          Conserved quantity: UNDERWRITING CAPACITY — Reinsurer.committed_capacity_minor. Releasing
          Juliet Re's 20.0000 line hands back exactly the 200000000 it reserved, restoring
          committed to 0 and available to the full 300000000, and simultaneously unwinds the
          derived chain it caused (written total 110.0000 -> 90.0000, layer OVERSUBSCRIBED ->
          PARTIALLY_PLACED, program FIRM_ORDER -> IN_MARKET, quote FIRM_ORDER -> LAPSED) without
          disturbing Kilo Re's 900000000. Instance 1 conserves money instead.
        test_recipe:
          setup:
            - "One cedent and two markets: Kilo Re (capacity_limit_minor 900000000, max_line_pct 90.0000, lead_authorised) and Juliet Re (capacity_limit_minor 300000000, max_line_pct 20.0000)."
            - "One PROPERTY program with a CATASTROPHE layer of limit_minor 1000000000; Kilo Re is firm-ordered at 90.0000 first, leaving the layer PARTIALLY_PLACED and the program IN_MARKET."
            - "Juliet Re is then firm-ordered at 20.0000, pushing written_line_total_pct to 110.0000, the layer to OVERSUBSCRIBED and the program to FIRM_ORDER; Juliet Re's committed_capacity_minor is 200000000 with 100000000 left."
            - "No sign-down is run, so Juliet Re's line is still PROVISIONAL and the layer is not BOUND — validations[priority=27] and the Layer.status != BOUND precondition are both satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Kilo Re", security_rating: "AA", capacity_limit_minor: 900000000, max_line_pct: 90.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { kilo_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Juliet Re", security_rating: "A", capacity_limit_minor: 300000000, max_line_pct: 20.0000, lead_authorised: false }
              as: PlatformAdmin
              captures: { juliet_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000, signdown_method: "PRO_RATA" }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "NW-CAT-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "PROP CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_id: $.data.id }
            - call: "POST /exposure-submissions/${sub_id}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_id}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
            - call: "POST /programs/${prog_id}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_id}/market-submissions"
              payload: { reinsurer_id: "${kilo_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_k: $.data.id }
            - call: "POST /layers/${layer_id}/market-submissions"
              payload: { reinsurer_id: "${juliet_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_j: $.data.id }
            - call: "POST /market-submissions/${ms_k}/quotes"
              payload: { offered_line_pct: 90.0000, quoted_rate_pct: 8.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${kilo_id}"
              captures: { q_k: $.data.id }
            - call: "POST /market-submissions/${ms_j}/quotes"
              payload: { offered_line_pct: 20.0000, quoted_rate_pct: 8.2500, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: false }
              as: ReinsurerUnderwriter
              as_user_id: "${juliet_id}"
              captures: { q_j: $.data.id }
            - call: "GET /layers/${layer_id}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lv1: $.data.version }
            - call: "POST /quotes/${q_k}/firm-order"
              payload: { accepted_line_pct: 90.0000, expected_layer_version: "${lv1}" }
              as: BrokerPlacementLead
              captures: { sl_k: $.data.id }
            - call: "GET /layers/${layer_id}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lv2: $.data.version }
            - call: "POST /quotes/${q_j}/firm-order"
              payload: { accepted_line_pct: 20.0000, expected_layer_version: "${lv2}" }
              as: BrokerPlacementLead
              captures: { sl_j: $.data.id }
            - call: "GET /reinsurers/${juliet_id}"
              payload: {}
              as: BrokerPlacementLead
              captures: { j_committed_before: $.data.committed_capacity_minor, j_available_before: $.data.available_capacity_minor }
          trigger:
            - call: "POST /signing-lines/${sl_j}/release"
              payload: {}
              as: BrokerPlacementLead
          assert:
            - "${j_committed_before} == 200000000 and ${j_available_before} == 100000000"
            - "SigningLine.${sl_j}.status == RELEASED and SigningLine.${sl_j}.release_reason == WITHDRAWN_BY_BROKER"
            - "Reinsurer.${juliet_id}.committed_capacity_minor == 0  # handed back in full"
            - "Reinsurer.${juliet_id}.available_capacity_minor == 300000000"
            - "Reinsurer.${kilo_id}.committed_capacity_minor == 900000000 and Reinsurer.${kilo_id}.available_capacity_minor == 0"
            - "Quote.${q_j}.status == LAPSED"
            - "Layer.${layer_id}.written_line_total_pct == 90.0000"
            - "Layer.${layer_id}.status == PARTIALLY_PLACED"
            - "Program.${prog_id}.placement_status == IN_MARKET"
            - "SigningLine.${sl_k}.status == PROVISIONAL and SigningLine.${sl_k}.committed_capacity_minor == 900000000"
