  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_submit
        grounds:
          - validations[priority=5]
          - validations[priority=17]
        distinguishing_aspect: |
          Priority pair (state, business_fiscal): a submit against a booking already in PENDING_DEPOSIT violates BOTH priority-5 (state) and priority-17 (OCC version staleness would also mismatch because versions advanced). Higher-priority state rule wins → ERR_INVALID_STATE, not ERR_STALE_VERSION.
