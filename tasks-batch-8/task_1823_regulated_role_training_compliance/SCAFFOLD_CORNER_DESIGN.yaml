        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-XD; curriculum CUR-XD ACTIVE; roles R-XDM (manager M) and R-XD (SOFT req due 30); employee E-XD reports to M and holds A"]
