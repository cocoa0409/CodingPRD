              captures: { dv_bp_first: "$.data.control_total_variance_bp" }
            - call: "POST /bureau/data-files/${dv_file_id}/amend-control-totals"
              payload: { declared_control_total_cents: 300500 }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${dv_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
