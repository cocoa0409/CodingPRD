            - "the same unknown id on POST /renovation-projects/{id}/solicit-bids, /rescope, /award, /phases, /substantial-completion and GET /renovation-projects/{id}/phases returns the same 404 - the id is resolved before the role check for /award and before any state precondition"
            - "GET /renovation-projects (the list) returns 200 with an empty page rather than a 404"

