            - "after a newer XRAY PASS: release succeeds, release_status == RELEASED"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: freezer_cycle_sanitation_buffer
        grounds:
          - entities.BlastFreezerCell.fields.sanitation_minutes
          - "errors[ERR_CELL_WINDOW_CONFLICT]"
        distinguishing_aspect: |
          Fixed-buffer interval semantics on BlastFreezerCell: the next cycle must
          start at or after prior planned_end + sanitation_minutes (30). Start at
          05:29 conflicts; start at exactly 05:30 is accepted (inclusive boundary).
        test_recipe:
          setup:
            - "two COOKED batches B1/B2 (separate orders); cell FC-1 (capacity 2500, min 200, rate 400, sanitation 30)"
            - "cycle C1 on B1: planned 2026-08-02T00:00, load 1600 entry 5 -> required 5 h -> planned_end 05:00, RESERVED"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Win1", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }
              as: PlantManager
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/freezer-cells"
              payload: { cell_code: "FC-1", capacity_kg: 2500, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }
              as: PlantManager
              captures: { c_id: $.data.id }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /plant/production-orders/${o1_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o1_v}" }
              as: ProductionPlanner
              captures: { b1_id: $.data.id }
            - { call: "POST /plant/production-batches/${b1_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b1_id}/cook", payload: { cooked_mass_kg: 1550 }, as: LineOperator }
            - call: "GET /plant/production-batches/${b1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b1_v: $.data.version }
            - call: "POST /plant/production-batches/${b1_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${b1_v}" }
              as: ProductionPlanner
              captures: { cy1_id: $.data.id }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /plant/production-orders/${o2_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o2_v}" }
              as: ProductionPlanner
              captures: { b2_id: $.data.id }
            - { call: "POST /plant/production-batches/${b2_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b2_id}/cook", payload: { cooked_mass_kg: 1550 }, as: LineOperator }
            - call: "GET /plant/production-batches/${b2_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b2_v: $.data.version }
          trigger:
            - call: "POST /plant/production-batches/${b2_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T05:29:00Z", expected_batch_version: "${b2_v}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "GET /plant/production-batches/${b2_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b2_v2: $.data.version }
            - call: "POST /plant/production-batches/${b2_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T05:30:00Z", expected_batch_version: "${b2_v2}" }
              as: ProductionPlanner
              captures: { cy2_id: $.data.id, cy2_end: $.data.planned_end }
          assert:
            - "planned_start 05:29 (< 05:00 + 30 min buffer): ERR_CELL_WINDOW_CONFLICT, http 409, batch version unchanged"
            - "planned_start 05:30 (== planned_end + sanitation): cycle created, planned_end == 2026-08-02T10:30:00Z"

      - name: line_run_conditional_changeover
        grounds:
          - entities.CoPackCustomer.fields.base_changeover_minutes
          - "errors[ERR_LINE_WINDOW_CONFLICT]"
        distinguishing_aspect: |
          Attribute-dependent buffer semantics on PackagingLine (different resource
          and different interval rule than the fixed freezer buffer): the required gap
          is computed from the two runs' customers — 15 min same-customer, 45 min
          cross-customer (base_changeover_minutes), 120 min allergen changeover. A
          cross-customer run at gap 44 is rejected; exactly 45 is accepted.
        test_recipe:
          setup:
            - "customers A and B (base_changeover_minutes 45 each, no allergen flags)"
            - "order A + batch BA KITTED; order B + batch BB KITTED; TRAY line; film lot"
            - "run R1 for BA: 2026-08-03T08:00, 600 units -> duration 6 min -> end 08:06"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Win2", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }
              as: PlantManager
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/copack-customers"
              payload: { name: "Cust A", billing_method: "PER_CASE", case_rate_cents: 1500, base_changeover_minutes: 45 }
              as: PlantManager
              captures: { cust_a: $.data.id }
            - call: "POST /plant/copack-customers"
              payload: { name: "Cust B", billing_method: "PER_CASE", case_rate_cents: 1500, base_changeover_minutes: 45 }
              as: PlantManager
              captures: { cust_b: $.data.id }
            - call: "POST /plant/packaging-lines"
              payload: { line_code: "L-1", line_type: "TRAY", rate_units_per_minute: 100, supported_film_type: "TRAY_FILM" }
              as: PlantManager
              captures: { l_id: $.data.id }
            - call: "POST /plant/film-lots"
              payload: { film_type: "TRAY_FILM", rolls_received: 10, meters_per_roll: 1000 }
              as: PlantManager
              captures: { f_id: $.data.id }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 600, copack_customer_id: "${cust_a}" }
              as: ProductionPlanner
              captures: { oa_id: $.data.id, oa_v: $.data.version }
            - call: "POST /plant/production-orders/${oa_id}/batches"
              payload: { units_planned: 600, expected_order_version: "${oa_v}" }
              as: ProductionPlanner
              captures: { ba_id: $.data.id }
            - { call: "POST /plant/production-batches/${ba_id}/kit", payload: {}, as: LineOperator }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 600, copack_customer_id: "${cust_b}" }
              as: ProductionPlanner
              captures: { ob_id: $.data.id, ob_v: $.data.version }
            - call: "POST /plant/production-orders/${ob_id}/batches"
              payload: { units_planned: 600, expected_order_version: "${ob_v}" }
              as: ProductionPlanner
              captures: { bb_id: $.data.id }
            - { call: "POST /plant/production-batches/${bb_id}/kit", payload: {}, as: LineOperator }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${ba_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:00:00Z", units_planned: 600 }
              as: ProductionPlanner
              captures: { run1_id: $.data.id, run1_end: $.data.planned_end }
          trigger:
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${bb_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:50:00Z", units_planned: 600 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${bb_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:51:00Z", units_planned: 600 }
              as: ProductionPlanner
              captures: { run2_id: $.data.id, run2_end: $.data.planned_end }
          assert:
            - "run R1 planned_end == 2026-08-03T08:06:00Z (ceil(600/100) = 6 min)"
            - "cross-customer run at 08:50 (gap 44 < 45): ERR_LINE_WINDOW_CONFLICT, http 409"
            - "cross-customer run at 08:51 (gap exactly 45): created, planned_end == 2026-08-03T08:57:00Z"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: film_reserve_cancel_invariant
        grounds:
          - calculations.film_reservation
          - state_machines.LineRun.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = film meters: for every FilmSupplyLot,
          meters_available + meters_reserved + meters_consumed == meters_received
          (10000). Schedule (reserve 2671) followed by its compensating cancel
          restores available to exactly 10000 with zero drift.
        test_recipe:
          setup:
            - "batch B KITTED; TRAY line; film lot F (10 rolls x 1000 m = 10000)"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Inv1", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }
              as: PlantManager
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - call: "POST /plant/packaging-lines"
              payload: { line_code: "L-1", line_type: "TRAY", rate_units_per_minute: 100, supported_film_type: "TRAY_FILM" }
              as: PlantManager
              captures: { l_id: $.data.id }
            - call: "POST /plant/film-lots"
              payload: { film_type: "TRAY_FILM", rolls_received: 10, meters_per_roll: 1000 }
              as: PlantManager
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${b_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:00:00Z", units_planned: 6000 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "GET /plant/film-lots/${f_id}"
              payload: {}
              as: ProductionPlanner
              captures: { res_mid: $.data.meters_reserved, avail_mid: $.data.meters_available }
            - { call: "POST /plant/line-runs/${run_id}/cancel", payload: {}, as: ProductionPlanner }
            - call: "GET /plant/film-lots/${f_id}"
              payload: {}
              as: ProductionPlanner
              captures: { res_end: $.data.meters_reserved, avail_end: $.data.meters_available, cons_end: $.data.meters_consumed }
          assert:
            - "after schedule: meters_reserved == 2671 and meters_available == 7329 (invariant 7329 + 2671 + 0 == 10000)"
            - "after cancel (compensating action): meters_reserved == 0, meters_consumed == 0, meters_available == 10000 (invariant restored exactly)"

      - name: storage_putaway_withdraw_invariant
        grounds:
          - calculations.storage_occupancy
          - state_machines.FinishedGoodsLot.RELEASED_to_DEPLETED
        distinguishing_aspect: |
          Conserved quantity = storage cases (a different quantity than film meters):
          slot.occupied_cases + slot free space == capacity_cases (600). Put-away of
          exactly 600 fills the slot (inclusive <=), and the compensating withdrawal
          of all 600 returns occupied_cases to exactly 0 while the lot auto-depletes.
        test_recipe:
          setup:
            - "lot L RELEASED with 600 cases (7200 packed units); slot S capacity 600 STANDARD"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Inv2", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }
              as: PlantManager
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/freezer-cells"
              payload: { cell_code: "FC-1", capacity_kg: 2500, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }
              as: PlantManager
              captures: { c_id: $.data.id }
            - call: "POST /plant/packaging-lines"
              payload: { line_code: "L-1", line_type: "TRAY", rate_units_per_minute: 100, supported_film_type: "TRAY_FILM" }
              as: PlantManager
              captures: { l_id: $.data.id }
            - call: "POST /plant/film-lots"
              payload: { film_type: "TRAY_FILM", rolls_received: 10, meters_per_roll: 1000 }
              as: PlantManager
              captures: { f_id: $.data.id }
            - call: "POST /plant/storage-slots"
              payload: { slot_code: "S-1", zone: "FREEZER_A", temperature_class: "STANDARD", capacity_cases: 600 }
              as: PlantManager
              captures: { slot_id: $.data.id }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 7200 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 7200, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b_id}/cook", payload: { cooked_mass_kg: 1900 }, as: LineOperator }
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b_v: $.data.version }
            - call: "POST /plant/production-batches/${b_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1900, entry_temp_c: 5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${b_v}" }
              as: ProductionPlanner
              captures: { cy_id: $.data.id }
            - { call: "POST /plant/freezing-cycles/${cy_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/freezing-cycles/${cy_id}/complete", payload: { actual_end: "2026-08-02T05:00:00Z", final_core_temp_c: -20 }, as: LineOperator }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${b_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:00:00Z", units_planned: 7200 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - { call: "POST /plant/line-runs/${run_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/line-runs/${run_id}/complete", payload: { units_packed: 7200, film_meters_consumed: 3205 }, as: LineOperator }
            - call: "GET /plant/lots?batch_id=${b_id}"
              payload: {}
              as: QAManager
              captures: { lot_id: "$.data[0].id" }
            - { call: "POST /plant/production-batches/${b_id}/ccp-checks", payload: { check_type: "METAL_DETECTOR", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - { call: "POST /plant/production-batches/${b_id}/ccp-checks", payload: { check_type: "XRAY", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - { call: "POST /plant/production-batches/${b_id}/complete", payload: {}, as: LineOperator }
            - { call: "POST /plant/lots/${lot_id}/release", payload: {}, as: QAManager, as_user_id: "qa-mgr-1" }
          trigger:
            - { call: "POST /plant/lots/${lot_id}/put-away", payload: { slot_id: "${slot_id}", cases: 600 }, as: WarehouseLead }
            - call: "GET /plant/storage-slots/${slot_id}"
              payload: {}
              as: WarehouseLead
              captures: { occ_mid: $.data.occupied_cases }
            - { call: "POST /plant/lots/${lot_id}/withdraw", payload: { cases: 600, purpose: "SHIPMENT" }, as: WarehouseLead }
            - call: "GET /plant/storage-slots/${slot_id}"
              payload: {}
              as: WarehouseLead
              captures: { occ_end: $.data.occupied_cases }
            - call: "GET /plant/lots/${lot_id}"
              payload: {}
              as: WarehouseLead
              captures: { lot_end: $.data.release_status, lot_hand: $.data.cases_on_hand }
          assert:
            - "after put-away of exactly 600 into capacity 600: occupied_cases == 600 (exact fill accepted, invariant 600 + 0 == 600)"
            - "after compensating withdraw of 600: occupied_cases == 0 (no drift)"
            - "FinishedGoodsLot.cases_on_hand == 0 and release_status == DEPLETED (auto-transition)"
