          - "validations[priority=32]"
          - "errors[ERR_OFFER_WINDOW_CLOSED]"
        distinguishing_aspect: |
          Entity pair Claim -> Offer: whether a Claim may leave DRAFT depends entirely on the Offer's
          status and closed_at. On grace day 15 the submit succeeds; on grace day 16 the identical
          submit fails with ERR_OFFER_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
            - "ACTIVE Program and a DEALER Offer that is PUBLISHED, then CLOSED at 2026-07-10T00:00:00Z."
            - "Two DRAFT claims for the same claimant, each with a receipt purchased 2026-06-15, created while the offer was still PUBLISHED."
