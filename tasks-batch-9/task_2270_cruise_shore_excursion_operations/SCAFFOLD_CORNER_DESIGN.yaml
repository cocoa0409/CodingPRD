      - name: an_all_aboard_instant_after_the_departure_instant_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[9].ERR_INVALID_TIME_WINDOW
          - errors[ERR_INVALID_TIME_WINDOW]
          - endpoints[POST /shore-excursions/port-calls]
        distinguishing_aspect: |
          The declared ordering is arrival < all_aboard <= departure, so an all-aboard deadline 30
          minutes after the ship sails is a cross-field violation rather than a per-field range
          error.
        test_recipe:
          setup:
            - "One port COZ exists and no port call has been created yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
          trigger:
            - call: "POST /shore-excursions/port-calls"
              payload: { port_id: "${port_id}", voyage_code: "V2609", ship_code: "MS-AURORA", arrival_utc: "2026-09-15T08:00:00Z", all_aboard_utc: "2026-09-15T17:30:00Z", departure_utc: "2026-09-15T17:00:00Z" }
              as: PortAgent
              as_user_id: "u_agent_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the create call returns HTTP 422"
            - "data.error_id == ERR_INVALID_TIME_WINDOW"
            - "the port-call list filtered by port_id == ${port_id} returns total_count == 0"

      - name: a_max_age_below_min_age_is_a_window_error_not_a_field_error
        claim_type: violation_to_error
        grounds:
          - validations[9].ERR_INVALID_TIME_WINDOW
          - entities.Excursion.fields.max_age
          - validations[6].ERR_VALIDATION
        distinguishing_aspect: |
          Both bounds are inside their declared [0, 120] and [0, 21] ranges, so priority 6 passes
          and the ordering objection surfaces at priority 9 as ERR_INVALID_TIME_WINDOW with HTTP
          422, never as a 400.
        test_recipe:
          setup:
            - "One port and one APPROVED operator exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
