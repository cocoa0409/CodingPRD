# =============================================================================
# Moving-Labor & Loading Marketplace — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: "Moving-Labor & Loading Marketplace (HireAHelper/Dolly style): job (load/unload/move) & hours/crew, helper vetting & assignment, instant quote & booking window, truck/equipment (optional) & add-on, damage/claim & insurance, tip & rating, reschedule/cancellation, payout"

domain_name: moving-labor-marketplace
api_prefix: ""   # flat topology: peer top-level collections (/jobs, /helpers, /assignments, ...)

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic          # Job re-quote/reschedule self-loops; Helper suspend/reinstate loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles               # Customer owns Jobs, Helper owns Assignments; Dispatcher/Admin operational
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Customer display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Sum of insurance_covered_cents over the customer's APPROVED Claims (see calculations.wallet_credit); credited when a Claim is approved" }

  - name: Helper
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Helper display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: base_hourly_rate_cents, type: integer, source: input, description: "Per-hour pay rate to this helper (payout basis), in cents" }
      - { name: skill_tier, type: enum, source: input, default: STANDARD, constraints: "one of {STANDARD, PRO}", description: "Skill tier" }
      - { name: vetting_status, type: enum, source: system, constraints: "one of {PENDING_REVIEW, APPROVED, REJECTED, SUSPENDED}", description: "Vetting lifecycle state; initial PENDING_REVIEW (see state_machines.Helper)" }
      - { name: rating_avg, type: number, source: computed, default: 0, description: "Mean of stars over the helper's Ratings, round_half_up to 2 dp (see calculations.helper_rating_avg)" }
      - { name: rating_count, type: integer, source: computed, default: 0, description: "Count of Ratings referencing this helper" }
      - { name: no_show_count, type: integer, source: computed, default: 0, description: "Count of this helper's Assignments in status NO_SHOW" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "COUNT(Assignment WHERE helper_id=this AND status IN {ASSIGNED, CHECKED_IN, CHECKED_OUT}) (see calculations.helper_active_assignment_count)" }
      - { name: lifetime_payout_cents, type: integer, source: computed, default: 0, description: "SUM(total_payout_cents WHERE helper_id=this AND status=RELEASED) (see calculations.helper_lifetime_payout)" }

  - name: RateCard
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Rate card label" }
      - { name: job_type, type: enum, source: input, constraints: "one of {LOAD, UNLOAD, MOVE}", description: "Job type this card prices; a Job's job_type must equal its rate card's job_type" }
      - { name: base_hourly_rate_cents, type: integer, source: input, description: "Customer-facing labor rate per helper per hour, in cents" }
      - { name: min_billable_hours, type: number, source: input, description: "Floor for billable hours; billable_hours = max(hours, min_billable_hours)" }
      - { name: crew_surcharge_pct, type: number, source: input, description: "Fractional surcharge applied to base labor when crew_size >= 3 (e.g. 0.10)" }
      - { name: peak_surge_multiplier, type: number, source: input, description: "Multiplier applied to pre-fee subtotal when window_start falls on Sat/Sun UTC (e.g. 1.25)" }
      - { name: truck_fee_cents, type: integer, source: input, description: "Flat fee added when truck_required is true, in cents" }

  - name: InsurancePolicy
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Policy label" }
      - { name: tier, type: enum, source: input, constraints: "one of {BASIC, FULL}", description: "Coverage tier; selects the claim settlement variant (see calculations.claim_settlement)" }
      - { name: coverage_cap_cents, type: integer, source: input, description: "Maximum approved amount, in cents" }
      - { name: deductible_cents, type: integer, source: input, description: "Deductible subtracted under the BASIC variant, in cents" }
      - { name: coverage_pct, type: number, source: input, description: "Fraction of approved amount covered under the FULL variant (e.g. 0.9)" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Truck label" }
      - { name: capacity_cuft, type: integer, source: input, description: "Cargo capacity in cubic feet" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Internal daily rate, in cents" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; the booking customer, taken from X-User-ID of the creating Customer" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; pricing card, its job_type must equal this job's job_type" }
      - { name: insurance_policy_id, type: string, source: input, description: "FK -> InsurancePolicy.id; coverage selected at creation" }
      - { name: truck_id, type: string, source: system, default: null, description: "FK -> Truck.id; assigned truck, null until POST /jobs/{id}/assign-truck" }
      - { name: job_type, type: enum, source: input, constraints: "one of {LOAD, UNLOAD, MOVE}", description: "Job kind" }
      - { name: crew_size, type: integer, source: input, constraints: ">= 1", description: "Number of helpers required" }
      - { name: estimated_hours, type: number, source: input, constraints: "> 0", description: "Customer-estimated labor hours" }
      - { name: actual_hours, type: number, source: system, default: null, description: "Actual hours, set at POST /jobs/{id}/complete" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled service window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled service window end (ISO 8601 UTC); must be > window_start" }
      - { name: truck_required, type: boolean, source: input, default: false, description: "Whether a truck is needed" }
      - { name: status, type: enum, source: system, constraints: "one of {DRAFT, QUOTED, BOOKED, IN_PROGRESS, COMPLETED, SETTLED, CANCELLED}", description: "Lifecycle state; initial DRAFT (see state_machines.Job)" }
      - { name: estimated_total_cents, type: integer, source: computed, default: null, description: "Accepted quote's total_cents, copied onto the Job at booking (estimate variant of calculations.job_charge)" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Final customer charge: at COMPLETED the final variant of calculations.job_charge; at CANCELLED equals cancellation_fee_cents" }
      - { name: cancellation_fee_cents, type: integer, source: computed, default: 0, description: "Fee charged on cancellation (see calculations.cancellation_fee)" }

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; the job this add-on line belongs to, taken from the path" }
      - { name: addon_type, type: enum, source: input, constraints: "one of {PACKING_MATERIALS, HEAVY_ITEM, STAIRS, LONG_CARRY, ASSEMBLY}", description: "Add-on kind" }
      - { name: quantity, type: integer, source: input, constraints: ">= 1", description: "Number of units" }
      - { name: unit_fee_cents, type: integer, source: input, description: "Pre-tax fee per unit, in cents" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(unit_fee_cents * quantity * (1 + ADDON_TAX_PCT)); per-line rounding (see calculations.addons_taxed_total)" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; the quoted job, taken from the path" }
      - { name: base_labor_cents, type: integer, source: computed, description: "Crew-adjusted base labor (post crew surcharge), in cents" }
      - { name: truck_fee_cents, type: integer, source: computed, description: "Truck fee component, in cents" }
      - { name: addons_total_cents, type: integer, source: computed, description: "Sum of AddOn.line_total_cents for the job, in cents" }
      - { name: surge_multiplier, type: number, source: computed, description: "1.0 on weekdays, RateCard.peak_surge_multiplier on Sat/Sun window_start" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Pre-surge subtotal: base_labor_cents + truck_fee_cents + addons_total_cents" }
      - { name: service_fee_cents, type: integer, source: computed, description: "round_half_up(surged * SERVICE_FEE_PCT), in cents" }
      - { name: total_cents, type: integer, source: computed, description: "Estimate variant of calculations.job_charge: surged + service_fee_cents" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + BOOKING_WINDOW_HOURS; booking must occur before this instant (booking window)" }
      - { name: status, type: enum, source: system, constraints: "one of {ACTIVE, ACCEPTED, SUPERSEDED}", description: "Quote state; initial ACTIVE (see state_machines.Quote)" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job being crewed" }
      - { name: helper_id, type: string, source: input, description: "FK -> Helper.id; the assigned helper" }
      - { name: role, type: enum, source: input, default: CREW, constraints: "one of {LEAD, CREW}", description: "Crew role on this job" }
      - { name: status, type: enum, source: system, constraints: "one of {ASSIGNED, CHECKED_IN, CHECKED_OUT, RELEASED, NO_SHOW}", description: "Assignment state; initial ASSIGNED (see state_machines.Assignment)" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job the damage occurred on" }
      - { name: responsible_helper_id, type: string, source: input, default: null, description: "FK -> Helper.id; optional helper blamed for the damage; if set and the claim is approved, that helper's RELEASED Payout for this job is reversed" }
      - { name: damage_description, type: string, source: input, description: "Free-text damage description" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the customer claims, in cents" }
      - { name: status, type: enum, source: system, constraints: "one of {FILED, UNDER_REVIEW, APPROVED, DENIED}", description: "Claim state; initial FILED (see state_machines.Claim)" }
      - { name: approved_amount_cents, type: integer, source: computed, default: null, description: "min(claimed_amount_cents, policy.coverage_cap_cents), set at approval" }
      - { name: insurance_covered_cents, type: integer, source: computed, default: null, description: "Covered payout under the policy tier variant (see calculations.claim_settlement); credited to Customer.wallet_credit_cents at approval" }

  - name: Rating
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the completed job being rated" }
      - { name: helper_id, type: string, source: input, description: "FK -> Helper.id; the helper being rated" }
      - { name: stars, type: integer, source: input, constraints: "1..5", description: "Star rating" }
      - { name: tip_cents, type: integer, source: input, default: 0, description: "Tip for the helper, in cents; folded into the helper's Payout at settlement" }
      - { name: comment, type: string, source: input, default: null, description: "Optional free-text comment" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; the settled job" }
      - { name: helper_id, type: string, source: system, description: "FK -> Helper.id; the paid helper" }
      - { name: base_pay_cents, type: integer, source: computed, description: "round_half_up(Helper.base_hourly_rate_cents * Job.actual_hours), in cents" }
      - { name: tip_cents, type: integer, source: computed, description: "Sum of tip_cents from this (job, helper)'s Ratings, in cents" }
      - { name: bonus_cents, type: integer, source: computed, description: "On-time bonus (see calculations.payout_amount), in cents" }
      - { name: total_payout_cents, type: integer, source: computed, description: "base_pay_cents + tip_cents + bonus_cents" }
      - { name: status, type: enum, source: system, constraints: "one of {RELEASED, REVERSED}", description: "Payout state; created RELEASED at settlement (see state_machines.Payout)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Helper
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /helpers/{id}/vet {decision: APPROVE}"
        actor: Admin
        preconditions: ["Helper is PENDING_REVIEW"]
        side_effects: ["Helper becomes eligible for Assignment creation"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /helpers/{id}/vet {decision: REJECT}"
        actor: Admin
        preconditions: ["Helper is PENDING_REVIEW"]
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /helpers/{id}/vet {decision: SUSPEND}; OR system when helper_rating_avg < RATING_SUSPEND_THRESHOLD after a new Rating"
        actor: Admin | system
        preconditions: ["Helper is APPROVED"]
        side_effects:
          - "Every Assignment of this helper in status ASSIGNED transitions ASSIGNED -> RELEASED (this in turn decrements Helper.active_assignment_count for each, per calculations.helper_active_assignment_count)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /helpers/{id}/vet {decision: REINSTATE}"
        actor: Admin
        preconditions: ["Helper is SUSPENDED"]
        side_effects: []

  - entity: Job
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /jobs/{id}/quote"
        actor: Customer
        preconditions: ["Job is DRAFT"]
        side_effects:
          - "A new Quote is created with status ACTIVE and its computed price breakdown (calculations.job_charge estimate variant)"
          - "increments Job.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /jobs/{id}/quote"
        actor: Customer
        preconditions: ["Job is QUOTED"]
        side_effects:
          - "The job's current ACTIVE Quote transitions ACTIVE -> SUPERSEDED"
          - "A new Quote is created with status ACTIVE"
          - "increments Job.version by 1"
        note: "Re-quote self-loop (cyclic); a booking that still carries the pre-supersede Job.version is rejected by OCC (concurrency_rules.book-stale-job)"
      - from: QUOTED
        to: BOOKED
        trigger: "POST /jobs/{id}/book"
        actor: Customer
        preconditions:
          - "Job is QUOTED"
          - "The referenced quote_id is the job's ACTIVE Quote"
          - "current_utc < Quote.expires_at (booking window still open)"
          - "expected_job_version equals Job.version (OCC)"
        side_effects:
          - "The accepted Quote transitions ACTIVE -> ACCEPTED"
          - "Job.estimated_total_cents = Quote.total_cents"
          - "increments Job.version by 1"
      - from: BOOKED
        to: BOOKED
        trigger: "POST /jobs/{id}/reschedule"
        actor: Customer
        preconditions:
          - "Job is BOOKED"
          - "new window_end > new window_start"
          - "new window_start > current_utc"
        side_effects: ["Job.window_start and Job.window_end updated", "increments Job.version by 1"]
        note: "Reschedule self-loop (cyclic)"
      - from: BOOKED
        to: IN_PROGRESS
        trigger: "POST /jobs/{id}/start"
        actor: Dispatcher
        preconditions:
          - "Job is BOOKED"
          - "At least one Assignment for this job is in status CHECKED_IN (cross-entity: Job depends on Assignment state)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /jobs/{id}/complete {actual_hours}"
        actor: Dispatcher
        preconditions: ["Job is IN_PROGRESS", "actual_hours > 0"]
        side_effects:
          - "Job.actual_hours set"
          - "Job.final_total_cents = calculations.job_charge final variant"
      - from: COMPLETED
        to: SETTLED
        trigger: "POST /jobs/{id}/settle"
        actor: Admin
        preconditions: ["Job is COMPLETED"]
        side_effects:
          - "For each Assignment of this job in status CHECKED_OUT, a Payout is created with status RELEASED and amounts per calculations.payout_amount"
          - "For each created Payout, Helper.lifetime_payout_cents is recomputed (calculations.helper_lifetime_payout)"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: Customer
        preconditions: ["Job is QUOTED"]
        side_effects:
          - "Job.cancellation_fee_cents = 0; Job.final_total_cents = 0"
          - "The job's ACTIVE Quote transitions ACTIVE -> SUPERSEDED"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: Customer
        preconditions: ["Job is BOOKED"]
        side_effects:
          - "Job.cancellation_fee_cents = calculations.cancellation_fee; Job.final_total_cents = cancellation_fee_cents"
          - "Every Assignment of this job in status ASSIGNED or CHECKED_IN transitions to RELEASED (this decrements each helper's Helper.active_assignment_count, per calculations.helper_active_assignment_count)"
          - "Job.truck_id is cleared (truck released)"

  - entity: Quote
    initial_state: ACTIVE
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: ACCEPTED
        trigger: "POST /jobs/{id}/book (system side-effect)"
        actor: system
        preconditions: ["Quote is ACTIVE", "Quote is the job's current active quote"]
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /jobs/{id}/quote (re-quote) or POST /jobs/{id}/cancel from QUOTED (system side-effect)"
        actor: system
        preconditions: ["Quote is ACTIVE"]
        side_effects: []

  - entity: Assignment
    initial_state: ASSIGNED
    terminal_states: [CHECKED_OUT, RELEASED, NO_SHOW]
    transitions:
      - from: ASSIGNED
        to: CHECKED_IN
        trigger: "POST /assignments/{id}/check-in"
        actor: Helper
        preconditions: ["Assignment is ASSIGNED", "acting Helper owns this Assignment (X-User-ID == Assignment.helper_id)"]
        side_effects: []
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /assignments/{id}/check-out"
        actor: Helper
        preconditions: ["Assignment is CHECKED_IN", "acting Helper owns this Assignment"]
        side_effects: []
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /assignments/{id}/no-show"
        actor: Dispatcher
        preconditions: ["Assignment is ASSIGNED"]
        side_effects:
          - "Helper.no_show_count recomputed (incremented)"
          - "Helper.active_assignment_count recomputed (decremented)"
      - from: ASSIGNED
        to: RELEASED
        trigger: "system side-effect of Helper suspension or Job cancellation"
        actor: system
        preconditions: []
        side_effects: ["Helper.active_assignment_count recomputed (decremented)"]
      - from: CHECKED_IN
        to: RELEASED
        trigger: "system side-effect of Job cancellation"
        actor: system
        preconditions: []
        side_effects: ["Helper.active_assignment_count recomputed (decremented)"]

  - entity: Claim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/review"
        actor: Admin
        preconditions: ["Claim is FILED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: Admin
        preconditions:
          - "Claim is UNDER_REVIEW"
          - "claimed_amount_cents <= policy.coverage_cap_cents (business_fiscal)"
        side_effects:
          - "Claim.approved_amount_cents and Claim.insurance_covered_cents set (calculations.claim_settlement)"
          - "Customer.wallet_credit_cents recomputed (calculations.wallet_credit): += insurance_covered_cents"
          - "If responsible_helper_id is set and that helper has a RELEASED Payout for this job, that Payout transitions RELEASED -> REVERSED; that reversal in turn recomputes Helper.lifetime_payout_cents (calculations.helper_lifetime_payout)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: Admin
        preconditions: ["Claim is UNDER_REVIEW"]
        side_effects: []

  - entity: Payout
    initial_state: RELEASED
    terminal_states: [REVERSED]
    transitions:
      - from: RELEASED
        to: REVERSED
        trigger: "POST /payouts/{id}/reverse OR system side-effect of Claim approval with responsible_helper_id"
        actor: Admin | system
        preconditions: ["Payout is RELEASED"]
        side_effects: ["Helper.lifetime_payout_cents recomputed (calculations.helper_lifetime_payout): -= total_payout_cents"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: book-stale-job
    parent_entity: Job
    write_endpoint: "POST /jobs/{id}/book"
    occ_field: "expected_job_version"
    description: |
      Booking a Job whose version has advanced since the client last observed
      it is rejected. This captures the case where another writer has re-quoted
      the job (POST /jobs/{id}/quote), which legitimately supersedes the prior
      ACTIVE quote and bumps Job.version, so the current writer's accepted quote
      and observed version are stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: addons_taxed_total
    trigger: "AddOn creation (line_total_cents) and quote generation (sum)"
    algorithm: aggregation
    formula: |
      # PER-LINE rounding, THEN sum (this order is pinned; sum-then-round differs by cents).
      line_total_cents(a) = round_half_up(a.unit_fee_cents * a.quantity * (1 + ADDON_TAX_PCT))
      addons_total_cents  = sum( line_total_cents(a) for a in AddOns where a.job_id == job.id )
      # Example: [(4500,1),(999,3)] -> round(4882.5)=4883 + round(3251.745)=3252 => 8135
      #          sum-then-round would be round((4500+2997)*1.085)=8134 (rejected order)
    input_set: "All AddOns whose job_id == job.id (add-ons may only be created while the Job is DRAFT)"
    constants: { ADDON_TAX_PCT: 0.085 }
    precision: "cents, round_half_up, per-line then sum"

  - name: job_charge
    trigger: "estimate variant on POST /jobs/{id}/quote; final variant on POST /jobs/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      # >= 3 inputs with non-linear interaction: hours-floor via max(), tiered crew
      # surcharge branch, conditional truck fee, conditional weekend surge. Evaluation
      # order is pinned top-to-bottom.
      billable_hours   = max(hours_source, rate_card.min_billable_hours)
      base_labor_raw   = round_half_up(rate_card.base_hourly_rate_cents * job.crew_size * billable_hours)
      if job.crew_size >= CREW_SURCHARGE_THRESHOLD:
          base_labor_cents = round_half_up(base_labor_raw * (1 + rate_card.crew_surcharge_pct))
      else:
          base_labor_cents = base_labor_raw
      truck_fee_cents  = rate_card.truck_fee_cents if job.truck_required else 0
      addons_total_cents = addons_taxed_total(job)
      subtotal_cents   = base_labor_cents + truck_fee_cents + addons_total_cents
      surge_multiplier = rate_card.peak_surge_multiplier if is_weekend(job.window_start) else 1.0
      surged_cents     = round_half_up(subtotal_cents * surge_multiplier)
      service_fee_cents = round_half_up(surged_cents * SERVICE_FEE_PCT)
      total_cents      = surged_cents + service_fee_cents
    input_set: "The Job, its RateCard, and its AddOns"
    constants: { SERVICE_FEE_PCT: 0.15, CREW_SURCHARGE_THRESHOLD: 3 }
    precision: "cents, round_half_up at each pinned step; is_weekend = window_start weekday in {Sat, Sun} UTC"
    variants:
      - name: estimate
        when: "POST /jobs/{id}/quote — stored on the Quote and copied to Job.estimated_total_cents at booking"
        difference: "hours_source = job.estimated_hours"
      - name: final
        when: "POST /jobs/{id}/complete — stored on Job.final_total_cents"
        difference: "hours_source = job.actual_hours"

  - name: claim_settlement
    trigger: "POST /claims/{id}/approve"
    algorithm: threshold
    formula: |
      approved_amount_cents = min(claim.claimed_amount_cents, policy.coverage_cap_cents)
      # variant selected by policy.tier
      if policy.tier == BASIC:
          insurance_covered_cents = max(0, approved_amount_cents - policy.deductible_cents)
      elif policy.tier == FULL:
          insurance_covered_cents = round_half_up(approved_amount_cents * policy.coverage_pct)
    input_set: "The Claim and the Job's InsurancePolicy"
    constants: {}
    precision: "cents, round_half_up"
    variants:
      - name: basic_tier
        when: "policy.tier == BASIC"
        difference: "Deductible subtracted, no percentage haircut"
      - name: full_tier
        when: "policy.tier == FULL"
        difference: "Percentage of approved amount, no deductible"

  - name: cancellation_fee
    trigger: "POST /jobs/{id}/cancel from BOOKED"
    algorithm: threshold
    formula: |
      hours_before = (job.window_start - current_utc) / 3600 seconds
      if hours_before >= CANCELLATION_FREE_WINDOW_HOURS:   # >= is inclusive (free at exactly the window)
          cancellation_fee_cents = 0
      else:
          cancellation_fee_cents = round_half_up(job.estimated_total_cents * CANCEL_FEE_PCT)
    input_set: "The Job and the current logical clock"
    constants: { CANCELLATION_FREE_WINDOW_HOURS: 24, CANCEL_FEE_PCT: 0.20 }
    precision: "cents, round_half_up; boundary at exactly 24h before window_start is FREE (>=)"

  - name: payout_amount
    trigger: "POST /jobs/{id}/settle, per CHECKED_OUT Assignment"
    algorithm: weighted_scoring
    formula: |
      base_pay_cents = round_half_up(helper.base_hourly_rate_cents * job.actual_hours)
      tip_cents      = sum( r.tip_cents for r in Ratings where r.job_id == job.id and r.helper_id == helper.id )
      if job.actual_hours <= job.estimated_hours:      # on-time bonus (<= inclusive)
          bonus_cents = round_half_up(base_pay_cents * ON_TIME_BONUS_PCT)
      else:
          bonus_cents = 0
      total_payout_cents = base_pay_cents + tip_cents + bonus_cents
    input_set: "The Helper, the Job, and this (job, helper)'s Ratings"
    constants: { ON_TIME_BONUS_PCT: 0.05 }
    precision: "cents, round_half_up"

  - name: helper_rating_avg
    trigger: "POST /ratings"
    algorithm: aggregation
    formula: |
      rating_count = count( Ratings where helper_id == helper.id )
      rating_avg   = round_half_up_2dp( sum(r.stars) / rating_count )   # 0 when rating_count == 0
      # Side effect: if rating_avg < RATING_SUSPEND_THRESHOLD and helper is APPROVED,
      # the helper transitions APPROVED -> SUSPENDED (see state_machines.Helper).
    input_set: "All Ratings referencing the helper"
    constants: { RATING_SUSPEND_THRESHOLD: 2.0 }
    precision: "2 decimal places, round_half_up"

  - name: wallet_credit
    trigger: "POST /claims/{id}/approve"
    algorithm: aggregation
    formula: |
      wallet_credit_cents = sum( c.insurance_covered_cents
                                 for c in Claims
                                 where c.status == APPROVED and Job(c.job_id).customer_id == customer.id )
    input_set: "All APPROVED Claims on the customer's Jobs"
    constants: {}
    precision: "cents"

  - name: helper_active_assignment_count
    trigger: "Assignment creation and any Assignment status change"
    algorithm: aggregation
    formula: |
      active_assignment_count = count( Assignment
                                       where helper_id == helper.id
                                       and status in {ASSIGNED, CHECKED_IN, CHECKED_OUT} )
    input_set: "The helper's Assignments in non-terminal-for-count states (RELEASED and NO_SHOW excluded)"
    constants: {}
    precision: "integer count"

  - name: helper_lifetime_payout
    trigger: "Payout creation (settlement) and Payout reversal"
    algorithm: aggregation
    formula: |
      lifetime_payout_cents = sum( p.total_payout_cents
                                   for p in Payouts where p.helper_id == helper.id and p.status == RELEASED )
    input_set: "The helper's RELEASED Payouts (REVERSED excluded)"
    constants: {}
    precision: "cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7; for entity_backed roles acting on an owned resource, X-User-ID matches the resource owner FK"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path params or FK body fields"
  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Helper being assigned must have vetting_status == APPROVED"
    error_id: ERR_HELPER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /assignments"
  - priority: 5
    category: business_constraint
    check: "Job.job_type must equal RateCard.job_type; crew_size >= 1; estimated_hours > 0; window_end > window_start; stars in 1..5"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /jobs, POST /ratings"
  - priority: 6
    category: business_constraint
    check: "Number of non-terminal-for-count Assignments for a job may not exceed job.crew_size (crew slots)"
    error_id: ERR_CREW_FULL
    http_status: 409
    applies_to: "POST /assignments"
  - priority: 6
    category: business_constraint
    check: "Starting a job requires at least one Assignment for the job in status CHECKED_IN (cross-entity: Job depends on Assignment)"
    error_id: ERR_NO_CREW_CHECKED_IN
    http_status: 409
    applies_to: "POST /jobs/{id}/start"
  - priority: 7
    category: business_temporal
    check: "Booking window still open: current_utc < Quote.expires_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /jobs/{id}/book"
  - priority: 7
    category: business_temporal
    check: "Helper has no other non-released Assignment whose Job window overlaps the target Job window within TRAVEL_BUFFER_MINUTES (half-open [start,end) + 60-min buffer)"
    error_id: ERR_HELPER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /assignments"
  - priority: 7
    category: business_temporal
    check: "Truck has no other Job (BOOKED/IN_PROGRESS) whose window [start,end] (closed, no buffer) collides with the target Job window"
    error_id: ERR_TRUCK_UNAVAILABLE
    http_status: 409
    applies_to: "POST /jobs/{id}/assign-truck"
  - priority: 8
    category: business_fiscal
    check: "Claim.claimed_amount_cents must not exceed the Job's InsurancePolicy.coverage_cap_cents"
    error_id: ERR_CLAIM_EXCEEDS_COVERAGE
    http_status: 409
    applies_to: "POST /claims/{id}/approve"
  - priority: 9
    category: state
    check: "Optimistic concurrency: expected_job_version must equal Job.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /jobs/{id}/book"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customers ----
  - { method: POST, path: "/customers", description: "Create a customer", roles: [Admin], code: 201, input: [display_name, email], output: Customer, side_effects: ["wallet_credit_cents initialized to 0"] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: Customer, side_effects: [] }

  # ---- Helpers ----
  - { method: POST, path: "/helpers", description: "Create a helper profile (PENDING_REVIEW)", roles: [Admin], code: 201, input: [display_name, email, base_hourly_rate_cents, "skill_tier?"], output: Helper, side_effects: ["vetting_status set to PENDING_REVIEW"] }
  - { method: GET, path: "/helpers/{id}", description: "Get a helper", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: Helper, side_effects: [] }
  - { method: POST, path: "/helpers/{id}/vet", description: "Vet a helper (APPROVE/REJECT/SUSPEND/REINSTATE)", roles: [Admin], code: 200, input: [decision], output: Helper, side_effects: ["vetting_status transition (see state_machines.Helper)", "SUSPEND releases the helper's ASSIGNED assignments"] }

  # ---- Config: rate cards / insurance / trucks ----
  - { method: POST, path: "/rate-cards", description: "Create a rate card", roles: [Admin], code: 201, input: [name, job_type, base_hourly_rate_cents, min_billable_hours, crew_surcharge_pct, peak_surge_multiplier, truck_fee_cents], output: RateCard, side_effects: [] }
  - { method: POST, path: "/insurance-policies", description: "Create an insurance policy", roles: [Admin], code: 201, input: [name, tier, coverage_cap_cents, deductible_cents, coverage_pct], output: InsurancePolicy, side_effects: [] }
  - { method: POST, path: "/trucks", description: "Create a truck", roles: [Admin], code: 201, input: [name, capacity_cuft, daily_rate_cents], output: Truck, side_effects: [] }
  - { method: GET, path: "/trucks/{id}", description: "Get a truck", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: Truck, side_effects: [] }

  # ---- Jobs ----
  - { method: POST, path: "/jobs", description: "Create a job (DRAFT)", roles: [Customer], code: 201, input: [rate_card_id, insurance_policy_id, job_type, crew_size, estimated_hours, window_start, window_end, "truck_required?"], output: Job, side_effects: ["status set to DRAFT; customer_id set from X-User-ID"] }
  - { method: GET, path: "/jobs/{id}", description: "Get a job", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: Job, side_effects: [] }
  - { method: GET, path: "/jobs", description: "List/filter jobs", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: ["customer_id?", "rate_card_id?", "insurance_policy_id?", "truck_id?", "status?", "limit?", "offset?"], output: "Job[]", side_effects: [] }
  - { method: POST, path: "/jobs/{id}/add-ons", description: "Add an add-on line to a DRAFT job", roles: [Customer], code: 201, input: [addon_type, quantity, unit_fee_cents], output: AddOn, side_effects: ["line_total_cents computed (calculations.addons_taxed_total)"] }
  - { method: POST, path: "/jobs/{id}/quote", description: "Generate an instant quote (DRAFT->QUOTED or QUOTED re-quote)", roles: [Customer], code: 201, input: [], output: Quote, side_effects: ["creates ACTIVE Quote", "supersedes prior ACTIVE quote on re-quote", "increments Job.version by 1"] }
  - { method: POST, path: "/jobs/{id}/book", description: "Accept the active quote and book the job (OCC-guarded)", roles: [Customer], code: 200, input: [quote_id, expected_job_version], output: Job, side_effects: ["Quote ACTIVE->ACCEPTED", "Job.estimated_total_cents set", "increments Job.version by 1"] }
  - { method: POST, path: "/jobs/{id}/reschedule", description: "Reschedule a booked job's window", roles: [Customer], code: 200, input: [window_start, window_end], output: Job, side_effects: ["window updated", "increments Job.version by 1"] }
  - { method: POST, path: "/jobs/{id}/cancel", description: "Cancel a QUOTED or BOOKED job", roles: [Customer], code: 200, input: [], output: Job, side_effects: ["cancellation_fee computed (calculations.cancellation_fee)", "releases assignments and truck on BOOKED cancel"] }
  - { method: POST, path: "/jobs/{id}/assign-truck", description: "Assign a truck to a job (truck overlap check)", roles: [Dispatcher], code: 200, input: [truck_id], output: Job, side_effects: ["Job.truck_id set"] }
  - { method: POST, path: "/jobs/{id}/start", description: "Start the job (BOOKED->IN_PROGRESS)", roles: [Dispatcher], code: 200, input: [], output: Job, side_effects: [] }
  - { method: POST, path: "/jobs/{id}/complete", description: "Complete the job (IN_PROGRESS->COMPLETED)", roles: [Dispatcher], code: 200, input: [actual_hours], output: Job, side_effects: ["actual_hours set", "final_total_cents computed (calculations.job_charge final variant)"] }
  - { method: POST, path: "/jobs/{id}/settle", description: "Settle a completed job and release payouts", roles: [Admin], code: 200, input: [], output: Job, side_effects: ["creates RELEASED Payout per CHECKED_OUT assignment", "recomputes Helper.lifetime_payout_cents"] }

  # ---- Add-ons / quotes read ----
  - { method: GET, path: "/add-ons/{id}", description: "Get an add-on", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: AddOn, side_effects: [] }
  - { method: GET, path: "/add-ons", description: "List/filter add-ons", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: ["job_id?", "limit?", "offset?"], output: "AddOn[]", side_effects: [] }
  - { method: GET, path: "/quotes/{id}", description: "Get a quote", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: Quote, side_effects: [] }
  - { method: GET, path: "/quotes", description: "List/filter quotes", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: ["job_id?", "status?", "limit?", "offset?"], output: "Quote[]", side_effects: [] }

  # ---- Assignments ----
  - { method: POST, path: "/assignments", description: "Assign an approved helper to a job", roles: [Dispatcher], code: 201, input: [job_id, helper_id, "role?"], output: Assignment, side_effects: ["status set to ASSIGNED", "Helper.active_assignment_count recomputed"] }
  - { method: GET, path: "/assignments/{id}", description: "Get an assignment", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: GET, path: "/assignments", description: "List/filter assignments", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: ["job_id?", "helper_id?", "status?", "limit?", "offset?"], output: "Assignment[]", side_effects: [] }
  - { method: POST, path: "/assignments/{id}/check-in", description: "Helper checks in (ASSIGNED->CHECKED_IN)", roles: [Helper], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/assignments/{id}/check-out", description: "Helper checks out (CHECKED_IN->CHECKED_OUT)", roles: [Helper], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/assignments/{id}/no-show", description: "Mark a helper no-show (ASSIGNED->NO_SHOW)", roles: [Dispatcher], code: 200, input: [], output: Assignment, side_effects: ["Helper.no_show_count and active_assignment_count recomputed"] }

  # ---- Claims ----
  - { method: POST, path: "/claims", description: "File a damage claim on a job", roles: [Customer], code: 201, input: [job_id, damage_description, claimed_amount_cents, "responsible_helper_id?"], output: Claim, side_effects: ["status set to FILED"] }
  - { method: GET, path: "/claims/{id}", description: "Get a claim", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/claims", description: "List/filter claims", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: ["job_id?", "responsible_helper_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/claims/{id}/review", description: "Move a claim to review (FILED->UNDER_REVIEW)", roles: [Admin], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/claims/{id}/approve", description: "Approve a claim (UNDER_REVIEW->APPROVED)", roles: [Admin], code: 200, input: [], output: Claim, side_effects: ["settlement computed (calculations.claim_settlement)", "customer wallet credited", "responsible helper payout reversed if applicable"] }
  - { method: POST, path: "/claims/{id}/deny", description: "Deny a claim (UNDER_REVIEW->DENIED)", roles: [Admin], code: 200, input: [], output: Claim, side_effects: [] }

  # ---- Ratings ----
  - { method: POST, path: "/ratings", description: "Rate and tip a helper on a completed job", roles: [Customer], code: 201, input: [job_id, helper_id, stars, "tip_cents?", "comment?"], output: Rating, side_effects: ["Helper.rating_avg and rating_count recomputed", "may auto-suspend the helper if rating_avg < 2.0"] }
  - { method: GET, path: "/ratings/{id}", description: "Get a rating", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: Rating, side_effects: [] }
  - { method: GET, path: "/ratings", description: "List/filter ratings", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: ["job_id?", "helper_id?", "limit?", "offset?"], output: "Rating[]", side_effects: [] }

  # ---- Payouts ----
  - { method: GET, path: "/payouts/{id}", description: "Get a payout", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: [], output: Payout, side_effects: [] }
  - { method: GET, path: "/payouts", description: "List/filter payouts", roles: [Customer, Helper, Dispatcher, Admin], code: 200, input: ["job_id?", "helper_id?", "status?", "limit?", "offset?"], output: "Payout[]", side_effects: [] }
  - { method: POST, path: "/payouts/{id}/reverse", description: "Reverse a released payout (RELEASED->REVERSED)", roles: [Admin], code: 200, input: [], output: Payout, side_effects: ["Helper.lifetime_payout_cents recomputed"] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default (never real wall-clock).", roles: [Admin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced to to_iso8601"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or entity_backed owner mismatch" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource (path id or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum/type, crew_size<1, estimated_hours<=0, window_end<=window_start, stars out of 1..5, or job_type != rate_card.job_type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_HELPER_NOT_APPROVED, http: 409, condition: "Helper being assigned is not APPROVED" }
  - { id: ERR_CREW_FULL, http: 409, condition: "Job already has crew_size non-terminal-for-count assignments" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Booking attempted at/after the quote's expires_at (booking window closed)" }
  - { id: ERR_HELPER_UNAVAILABLE, http: 409, condition: "Helper has an overlapping assignment within the travel buffer (half-open + 60 min)" }
  - { id: ERR_TRUCK_UNAVAILABLE, http: 409, condition: "Truck is occupied by a colliding job window (closed interval, no buffer)" }
  - { id: ERR_CLAIM_EXCEEDS_COVERAGE, http: 409, condition: "Claim claimed_amount_cents exceeds the policy coverage cap on approval" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_job_version does not match Job.version (OCC on booking)" }
  - { id: ERR_QUOTE_NOT_ACTIVE, http: 409, condition: "Referenced quote is not the job's current ACTIVE quote on booking" }
  - { id: ERR_NO_CREW_CHECKED_IN, http: 409, condition: "Starting a job with no Assignment in CHECKED_IN state" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Books and manages jobs; requests quotes, books, reschedules, cancels, files claims, rates/tips."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /jobs"
      - "POST /jobs/{id}/add-ons"
      - "POST /jobs/{id}/quote"
      - "POST /jobs/{id}/book"
      - "POST /jobs/{id}/reschedule"
      - "POST /jobs/{id}/cancel"
      - "POST /claims"
      - "POST /ratings"
    shared_operations:
      - "GET (reads) on jobs, quotes, add-ons, assignments, claims, ratings, payouts, helpers, customers, trucks"
  - name: Helper
    description: "Works assignments; checks in and out."
    identity: "entity_backed:Helper"
    exclusive_operations:
      - "POST /assignments/{id}/check-in"
      - "POST /assignments/{id}/check-out"
    shared_operations:
      - "GET (reads) on assignments, jobs, payouts, helpers, ratings"
  - name: Dispatcher
    description: "Operational crewing and job execution; assigns helpers/trucks, starts, completes, marks no-shows."
    identity: "opaque"
    exclusive_operations:
      - "POST /assignments"
      - "POST /assignments/{id}/no-show"
      - "POST /jobs/{id}/assign-truck"
      - "POST /jobs/{id}/start"
      - "POST /jobs/{id}/complete"
    shared_operations:
      - "GET (reads) across resources"
  - name: Admin
    description: "Platform operator; vets helpers, manages config, reviews/approves/denies claims, settles jobs, reverses payouts, sets the clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /helpers"
      - "POST /helpers/{id}/vet"
      - "POST /rate-cards"
      - "POST /insurance-policies"
      - "POST /trucks"
      - "POST /jobs/{id}/settle"
      - "POST /claims/{id}/review"
      - "POST /claims/{id}/approve"
      - "POST /claims/{id}/deny"
      - "POST /payouts/{id}/reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (reads) across resources"
