              payload: { enrollment_id: "${enr2}", attendance_date: "2026-03-06", status: "ABSENT_EXCUSED", instructional_day: true }
              as: FamilyServicesWorker
          trigger:
            - call: "POST /pir-reports"
              payload: { program_id: "${prog_id}", reporting_period: "2025-2026" }
              as: ProgramAdmin
