              payload: { action: "CLOSE_BOOKS", expected_outing_version: "${o_v}" }
              as: TournamentDirector
              captures: { e_td_finance: $.data.error_id }
            - call: "POST /outing-ops/receipts"
              payload: { outing_id: "${o_id}", receipt_kind: "REGISTRATION" }
              as: SponsorshipManager
              captures: { e_sm_receipt: $.data.error_id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "LOCK_FIELD" }
              as: CourseOperations
              captures: { e_co_play: $.data.error_id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "BENEF", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 0, inventory_cap: 4 }
              as: Beneficiary
              captures: { e_ben_write: $.data.error_id }
            - call: "GET /outing-ops/outings/${o_id}/proceeds-report"
              as: CourseOperations
              captures: { e_co_report: $.data.error_id }
            - call: "POST /outing-ops/outings/00000000-0000-4000-8000-0000000000ff/finance-transition"
              payload: { action: "CLOSE_BOOKS", expected_outing_version: "${o_v}" }
              as: TournamentDirector
              captures: { e_forbidden_and_missing: $.data.error_id }
            - call: "GET /outing-ops/outings/${o_id}"
              as: Beneficiary
              captures: { ben_read_id: $.data.id }
            - call: "GET /outing-ops/outings/${o_id}/proceeds-report"
              as: Beneficiary
              captures: { ben_net: $.data.net_proceeds_cents }
          assert:
            - "${e_ct_outing}, ${e_td_contract}, ${e_ct_asset}, ${e_td_finance}, ${e_sm_receipt}, ${e_co_play} and ${e_ben_write} are all 'ERR_UNAUTHORIZED' with HTTP 403 - each names an operation exclusive to a different role"
            - "${e_co_report} == 'ERR_UNAUTHORIZED' (403): the proceeds report is readable only by CharityTreasurer, TournamentDirector and Beneficiary, and a read-only role fence is enforced just as strictly as a write fence"
            - "${e_forbidden_and_missing} == 'ERR_UNAUTHORIZED', NOT ERR_OUTING_NOT_FOUND - priority 2 outranks priority 4, so a forbidden role learns nothing about which ids exist"
            - "${ben_read_id} == ${o_id} and ${ben_net} is present: the Beneficiary's two declared reads succeed, proving the 403s above came from the roles list and not from a blanket denial"
            - "GET /outing-ops/outings/${o_id} as TournamentDirector still reads play_status == 'OPEN', finance_status == 'COLLECTING' and version == ${o_v} - not one rejected call left a trace"

      - name: a_participant_cannot_touch_another_golfers_row
