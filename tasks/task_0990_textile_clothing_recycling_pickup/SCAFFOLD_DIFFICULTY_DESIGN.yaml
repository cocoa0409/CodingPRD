          Category pair state (p5) vs business_fiscal (p11): re-finalizing a
          SETTLED credit violates both — wrong state AND fund available (350) <
          material cost (1500) — and the state error ERR_INVALID_STATE must win
          over ERR_FUND_INSUFFICIENT.
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; pickup collected, certified 12.5 kg RESALE"
            - "Fund F initial 2000; credit C finalized (gross 1650, hold) then settled — fund available is now 350 (< 1500 material cost), so the fiscal check would also fail if reached"
