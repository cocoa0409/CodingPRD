  # ===========================================================================
  # RULE 9 — compensating invariants (two different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tonnage_conservation_across_over_delivery_and_dispute
        conserved_quantity: "TONS: for every graded load, contract_slice_tons + over_slice_tons + over_rejected_tons + excess_rejected_tons == net_tons; and at contract level delivered_contract_tons + delivered_over_tons + rejected_tons equals the summed net_tons of all actively graded loads"
        grounds:
          - calculations.tonnage_waterfall_allocation
          - entities.WeighTag.fields.contract_slice_tons
          - entities.WeighTag.fields.excess_rejected_tons
          - entities.GrapeContract.fields.delivered_over_tons
          - entities.GrapeContract.fields.rejected_tons
          - state_machines.WeighTag.PENDING_to_PARTIALLY_ACCEPTED
        distinguishing_aspect: |
          Conserved quantity: TONNAGE. Three loads totalling 65.000 net tons are pushed through a
          40.000 soft cap and a 44.000 hard cap, so the third load splits 0.000 / 4.000 / 0.000 /
          21.000 across the four slices - a three-way split that still sums to its own 25.000 net
          tons. The contract's three tonnage counters then sum to exactly 65.000. Disputing the
          third load must return the ledger to exactly 40.000 with no residue in delivered_over_tons
          or rejected_tons: the compensation is exact, not approximate.
        test_recipe:
          setup:
            - "Producer, block, reference QualitySpec, crew, lane L1 with daily_capacity_tons 80.000 and max_load_tons 40.0."
            - "ACTIVE contract GC-CONSERVE with base 450000, committed_tons 40.000, over_delivery_tolerance_pct 10.0 (hard cap 44.000), over_delivery_policy ACCEPT_AT_SPOT and spot_price_pct 70.0."
            - "Acknowledged pick call with estimated_tons 65.000 so the FULFILLED edge never pre-empts SUSPENDED_CAP."
            - "Three appointments on 2026-08-25: 14:00-16:00 planned 22.000, 17:00-19:00 planned 18.000, 20:00-22:00 planned 25.000."
            - "All THREE trucks are grossed in first (so every appointment is already ARRIVED and none can be cancelled by the cap cascade), then tared and graded in load order."
