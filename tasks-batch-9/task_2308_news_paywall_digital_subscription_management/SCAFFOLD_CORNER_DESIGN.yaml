      - name: save_offer_accepted_applies_retention_discount
        claim_type: valid_transition
        grounds:
          - state_machines.CancellationRequest.SAVE_OFFER_PRESENTED_to_SAVE_OFFER_ACCEPTED
          - endpoints[POST /paywall/save-offers/{id}/decision]
        distinguishing_aspect: "Accepting the presented offer must retain the subscription: request status SAVE_OFFER_ACCEPTED with retained true, and the subscription carries retention_discount_pct 0.25 for 3 cycles while lifecycle stays ACTIVE."
        test_recipe:
          setup:
            - "ACTIVE DIGITAL_ONLY subscription (cycle-1 invoice of 499 PAID) with a cancellation request in SAVE_OFFER_PRESENTED carrying a PRESENTED RETENTION_DISCOUNT offer of 0.25 for 3 cycles, at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
