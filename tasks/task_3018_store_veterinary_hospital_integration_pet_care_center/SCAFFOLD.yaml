      - "POST /stores/{storeId}/vaccination-visits — register a walk-in"
      - "POST /stores/{storeId}/vaccination-visits/{visitId}/issue-certificate — issue a rabies certificate"
    shared_operations: []
  - name: ComplianceOfficer
    description: "State reporting officer who submits rabies reports and reads the reporting queue"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{storeId}/vaccination-visits/{visitId}/submit-state-report — submit a state rabies report"
