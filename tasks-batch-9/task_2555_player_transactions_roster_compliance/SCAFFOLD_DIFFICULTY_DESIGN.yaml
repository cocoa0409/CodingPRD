# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2555 — Player Transactions & Roster Compliance
#
# Every instance grounds in elements declared by SCAFFOLD.yaml §1.1–§1.7.
# All monetary / temporal literals in `assert:` were computed by executing the
# §1.3 formulas against their declared `constants:`.
#
# Shared world constants used by the chains below (all from §1.3):
#   MAX_PRORATION_YEARS 5 | CURRENT_SEASON_YEAR 2026
#   PROCESSING_WINDOW [13:00:00, 21:00:00) UTC | FILING_DEADLINE_HOURS 48
#   WAIVER_CLEARANCE_HOURS {REVOCABLE: 24, IRREVOCABLE: 48}
#   WAIVER_IRREVOCABLE_CUTOFF 2026-08-25T16:00:00Z
#   ACCELERATION_CUTOFF 2026-09-01T00:00:00Z | PHYSICAL_VALIDITY_DAYS 14
#   MEDICAL_REVIEW_WINDOW_HOURS 72 | MAX_CONCURRENT_MEDICAL_REVIEWS 1
#   MINIMUM_STAY_DAYS {INJURED_RESERVE 21, ...} | RETURN_WINDOW_LENGTH_DAYS 21
#   GRACE_PERIOD_HOURS 24 | FREEZE_AFTER_CONSECUTIVE_CHECKS 3
#   MAX_TRADE_ROUNDS 3 | MAX_TRANSACTION_REVISIONS 2
#   SERVICE_DAYS_PER_SEASON 170 | IR_ROSTER_CREDIT_FACTOR 0.5
#   PRACTICE_SQUAD_MAX_SERVICE_DAYS 340
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # R1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: team_cap_provisional_and_final_diverge_on_identical_roster
        grounds:
          - calculations.team_cap_commitment
          - calculations.contract_current_season_cap_charge
          - entities.Team.fields.provisional_cap_committed_cents
          - entities.Team.fields.final_cap_committed_cents
          - entities.Team.fields.cap_space_cents
          - entities.BonusAllocation.fields.counts_against_provisional
          - entities.BonusAllocation.fields.allocation_status
          - state_machines.Transaction.FILED_to_APPROVED
        distinguishing_aspect: |
          This instance's two variants live in the Team/Contract money domain: PROVISIONAL
          admits PENDING_APPROVAL contracts and SCHEDULED likely-to-be-earned bonuses while
          FINAL admits only ACTIVE contracts and EARNED non-proration bonuses, so one club
          reports 128333333 and 90333333 from exactly the same roster rows.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z (inside the processing window)."
            - "One club 'Harbor Kings' with salary_cap_limit_cents 500000000 and default limits."
            - "Player Ray Alder signed to an APPROVED 3-year filing: base 80000000, signing bonus 10000000, PERFORMANCE_LTBE 5000000, PERFORMANCE_NLTBE 7000000; Contract ACTIVE with current_season_cap_charge_cents 83333333."
            - "The PERFORMANCE_NLTBE allocation row has been marked EARNED; the PERFORMANCE_LTBE row is still SCHEDULED."
            - "Player Milo Vance carries a second, still PENDING_APPROVAL 1-year contract at base 40000000 with no bonus money."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id, team_a_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB", accrued_active_days: 500, accrued_reserve_days: 100, accrued_ir_days: 80, accrued_practice_days: 200 }
              as: LeagueOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "SIGNING", expected_team_version: "${team_a_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026, performance_ltbe_cents: 5000000, performance_nltbe_cents: 7000000 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn1_id: $.data.id, c1_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${txn1_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { ex1_id: $.data.id }
            - call: "POST /physical-exams/${ex1_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn1_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn1_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "GET /contracts/${c1_id}/bonus-allocations"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { nltbe_id: "$.data[4].id", nltbe_type: "$.data[4].bonus_type" }
            - call: "POST /bonus-allocations/${nltbe_id}/earn"
              payload: {}
              as: LeagueOfficer
            - call: "POST /players"
              payload: { full_name: "Milo Vance", position: "WR" }
              as: LeagueOfficer
              captures: { p2_id: $.data.id }
            - call: "GET /teams/${team_a_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { team_a_v_now: $.data.version }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p2_id}", transaction_type: "SIGNING", expected_team_version: "${team_a_v_now}", years: 1, base_salary_cents: 40000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn2_id: $.data.id, c2_id: $.data.contract_id }
          trigger:
            - call: "GET /teams/${team_a_id}/cap-ledger"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
          assert:
            - "Team.${team_a_id}.provisional_cap_committed_cents == 128333333"
            - "Team.${team_a_id}.final_cap_committed_cents == 90333333"
            - "Team.${team_a_id}.provisional_cap_committed_cents - Team.${team_a_id}.final_cap_committed_cents == 38000000"
            - "Team.${team_a_id}.cap_space_cents == 371666667"
            - "Team.${team_a_id}.dead_money_cents == 0"
            - "Contract.${c1_id}.current_season_cap_charge_cents == 83333333 and Contract.${c1_id}.status == ACTIVE"
            - "Contract.${c2_id}.current_season_cap_charge_cents == 40000000 and Contract.${c2_id}.status == PENDING_APPROVAL"
            - "BonusAllocation.${nltbe_id}.bonus_type == PERFORMANCE_NLTBE, allocation_status == EARNED, counts_against_provisional == false"
            - "the captured ${nltbe_type} == PERFORMANCE_NLTBE — index 4 of the bonus-allocation list is the PERFORMANCE_NLTBE row (3 SIGNING_PRORATION rows ascending by season_year, then PERFORMANCE_LTBE, then PERFORMANCE_NLTBE)"

      - name: player_pension_credit_and_roster_service_diverge_on_ir_days
        grounds:
          - calculations.player_service_time
          - entities.Player.fields.pension_credit_days
          - entities.Player.fields.roster_service_days
          - entities.Player.fields.service_years
          - entities.Player.fields.contract_rights_class
          - entities.Player.fields.practice_squad_eligible
        distinguishing_aspect: |
          This instance's two variants live in the Player eligibility domain, not the money
          domain of the first instance: PENSION_CREDIT weights injured-reserve days at full
          value (680 days, 4 service years, UNRESTRICTED) while ROSTER_SERVICE halves them
          (640 days), and practice-squad days are excluded from both.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "A single seeded player with accrued_active_days 500, accrued_reserve_days 100, accrued_ir_days 80, accrued_practice_days 200 and practice_squad_seasons_used 0; no club and no contract are needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB", accrued_active_days: 500, accrued_reserve_days: 100, accrued_ir_days: 80, accrued_practice_days: 200, practice_squad_seasons_used: 0 }
              as: LeagueOfficer
              captures: { p_dual_id: $.data.id }
          assert:
            - "Player.${p_dual_id}.pension_credit_days == 680"
            - "Player.${p_dual_id}.roster_service_days == 640"
            - "Player.${p_dual_id}.pension_credit_days - Player.${p_dual_id}.roster_service_days == 40"
            - "Player.${p_dual_id}.service_years == 4"
            - "Player.${p_dual_id}.contract_rights_class == UNRESTRICTED"
            - "Player.${p_dual_id}.practice_squad_eligible == false"
            - "the 200 accrued_practice_days appear in neither total"

  # ===========================================================================
  # R2 — combinatorial_formula  (mode a: branch selection, mode b: same formula
  # different parameters, mode c: ordered multi-stage pipeline)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: qualifying_offer_branch_selection_over_nested_floor_max
        grounds:
          - calculations.qualifying_offer_amount
          - calculations.tender_deadline
          - entities.QualifyingOffer.fields.amount_cents
          - entities.QualifyingOffer.fields.deadline_at
          - entities.Player.fields.contract_rights_class
          - validations[priority=35]
          - state_machines.QualifyingOffer.__CREATE___to_ISSUED
        distinguishing_aspect: |
          Mode (a) branch selection: offer_type picks a different multiplier over a nested
          three-way max floor, so RESTRICTED_TENDER yields 66000000 while QUALIFYING_OFFER
          and ARBITRATION_TENDER both yield 60000000 by two different floors (60000000x1.00
          versus 50000000x1.20) — the amount alone cannot reveal which branch ran, the floor
          composition must be checked too.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "One club with salary_cap_limit_cents 500000000 and no contracts (provisional_cap_committed_cents 0)."
            - "Three UNROSTERED players: Nate Orr and Cy Boone with accrued_active_days 340 (service_years 2, RESTRICTED) and Vic Lund with accrued_active_days 520 (service_years 3, ARBITRATION_ELIGIBLE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Nate Orr", position: "WR", accrued_active_days: 340 }
              as: LeagueOfficer
              captures: { pa_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Cy Boone", position: "DB", accrued_active_days: 340 }
              as: LeagueOfficer
              captures: { pb_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Vic Lund", position: "LB", accrued_active_days: 520 }
              as: LeagueOfficer
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /qualifying-offers"
              payload: { player_id: "${pa_id}", team_id: "${team_a_id}", offer_type: "RESTRICTED_TENDER", tender_level: "FIRST_ROUND", prior_base_salary_cents: 50000000 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { qo_a_id: $.data.id }
            - call: "POST /qualifying-offers"
              payload: { player_id: "${pb_id}", team_id: "${team_a_id}", offer_type: "QUALIFYING_OFFER", tender_level: "FIRST_ROUND", prior_base_salary_cents: 50000000 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { qo_b_id: $.data.id }
            - call: "POST /qualifying-offers"
              payload: { player_id: "${pc_id}", team_id: "${team_a_id}", offer_type: "ARBITRATION_TENDER", tender_level: "ORIGINAL_ROUND", prior_base_salary_cents: 50000000 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { qo_c_id: $.data.id }
          assert:
            - "QualifyingOffer.${qo_a_id}.amount_cents == 66000000"
            - "QualifyingOffer.${qo_b_id}.amount_cents == 60000000"
            - "QualifyingOffer.${qo_c_id}.amount_cents == 60000000"
            - "QualifyingOffer.${qo_a_id}.amount_cents != QualifyingOffer.${qo_b_id}.amount_cents (same floor 60000000, different multiplier)"
            - "QualifyingOffer.${qo_b_id}.amount_cents == QualifyingOffer.${qo_c_id}.amount_cents while their floors differ (60000000 versus 50000000)"
            - "QualifyingOffer.${qo_a_id}.deadline_at == 2026-08-13T14:00:00Z"
            - "QualifyingOffer.${qo_a_id}.status == ISSUED and QualifyingOffer.${qo_c_id}.status == ISSUED"
            - "Player.${pa_id}.contract_rights_class == RESTRICTED and Player.${pc_id}.contract_rights_class == ARBITRATION_ELIGIBLE"
            - "Team.${team_a_id}.provisional_cap_committed_cents == 0 (an ISSUED tender commits no cap)"

      - name: signing_bonus_proration_remainder_placement_across_year_counts
        grounds:
          - calculations.signing_bonus_proration
          - calculations.contract_current_season_cap_charge
          - entities.Contract.fields.proration_years
          - entities.Contract.fields.annual_proration_cents
          - entities.Contract.fields.final_season_proration_cents
          - entities.Contract.fields.total_value_cents
          - state_machines.Transaction.__CREATE___to_DRAFT
        distinguishing_aspect: |
          Mode (b) same formula under different parameters: the identical proration formula
          run over years 3 and years 7 produces proration_years 3 versus 5 (MAX_PRORATION_YEARS
          clamp), annual 3333333 versus 2000000, and a remainder that lands as 3333334 in one
          contract but as an exact 2000000 in the other — the divisor and the remainder move
          together, so a hardcoded "years" divisor fails one of the two.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "One club with salary_cap_limit_cents 500000000."
            - "Two UNROSTERED players, each with one PENDING_APPROVAL SIGNING filing: Ray Alder at years 3 / base 80000000 / signing bonus 10000000, and Dane Cole at years 7 / base 30000000 / signing bonus 10000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id, team_a_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Dane Cole", position: "OL" }
              as: LeagueOfficer
              captures: { p3_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "SIGNING", expected_team_version: "${team_a_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn1_id: $.data.id, c1_id: $.data.contract_id }
            - call: "GET /teams/${team_a_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { team_a_v2: $.data.version }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p3_id}", transaction_type: "SIGNING", expected_team_version: "${team_a_v2}", years: 7, base_salary_cents: 30000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn3_id: $.data.id, c3_id: $.data.contract_id }
          trigger:
            - call: "GET /contracts/${c1_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "GET /contracts/${c3_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
          assert:
            - "Contract.${c1_id}.proration_years == 3"
            - "Contract.${c1_id}.annual_proration_cents == 3333333"
            - "Contract.${c1_id}.final_season_proration_cents == 3333334"
            - "Contract.${c1_id}.current_season_cap_charge_cents == 83333333"
            - "Contract.${c1_id}.total_value_cents == 250000000"
            - "Contract.${c3_id}.proration_years == 5"
            - "Contract.${c3_id}.annual_proration_cents == 2000000"
            - "Contract.${c3_id}.final_season_proration_cents == 2000000"
            - "Contract.${c3_id}.current_season_cap_charge_cents == 32000000"
            - "Contract.${c3_id}.total_value_cents == 220000000"
            - "3333333 * 2 + 3333334 == 10000000 and 2000000 * 4 + 2000000 == 10000000 (both remainders reconcile exactly)"
            - "Team.${team_a_id}.provisional_cap_committed_cents == 115333333"

      - name: waiver_award_pipeline_cap_stage_precedes_priority_ranking
        grounds:
          - calculations.waiver_award_cap_resolution
          - calculations.waiver_clearance_deadline
          - calculations.dead_money_on_release
          - entities.WaiverClaim.fields.priority_rank_snapshot
          - entities.WaiverClaim.fields.required_cap_charge_cents
          - entities.WaiverRequest.fields.awarded_to_team_id
          - state_machines.WaiverRequest.PENDING_to_CLAIMED
          - state_machines.WaiverClaim.SUBMITTED_to_INVALIDATED
        distinguishing_aspect: |
          Mode (c) ordered pipeline: the cap stage runs before the ranking stage, so the
          waiver_priority_rank 1 claimant is eliminated for cap space and the rank 2 claimant
          wins the player — running the same three filters after the ranking step would have
          awarded rank 1 and then rejected the award, a different observable end state.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Releasing club Harbor Kings (waiver_priority_rank 5, cap 500000000) with Ray Alder signed to an ACTIVE 3-year contract: base 80000000, signing bonus 10000000, current_season_cap_charge_cents 83333333."
            - "Claiming club Basin Otters (waiver_priority_rank 1) with salary_cap_limit_cents 50000000 and no contracts, so its live cap_space_cents 50000000 is below the 80000000 base salary it would assume."
            - "Claiming club Cedar Ridge (waiver_priority_rank 2) with salary_cap_limit_cents 500000000 and no contracts."
            - "Ray Alder's RELEASE filing is APPROVED (Player WAIVED_PENDING) and a REVOCABLE WaiverRequest is PENDING with clearance_deadline_at 2026-08-11T14:00:00Z; both clubs have claims SUBMITTED."
            - "Logical clock advanced to 2026-08-11T14:00:00Z — exactly the clearance deadline, inside the processing window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 5 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id, team_a_v1: $.data.version }
            - call: "POST /teams"
              payload: { name: "Basin Otters", market_code: "BSN", salary_cap_limit_cents: 50000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_b_id: $.data.id }
            - call: "POST /teams"
              payload: { name: "Cedar Ridge", market_code: "CDR", salary_cap_limit_cents: 500000000, waiver_priority_rank: 2 }
              as: LeagueOfficer
              captures: { team_c_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "SIGNING", expected_team_version: "${team_a_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn1_id: $.data.id, c1_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${txn1_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { ex1_id: $.data.id }
            - call: "POST /physical-exams/${ex1_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn1_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn1_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "GET /teams/${team_a_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { team_a_v3: $.data.version }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "RELEASE", expected_team_version: "${team_a_v3}" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn_rel_id: $.data.id }
            - call: "POST /transactions/${txn_rel_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn_rel_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /waiver-requests"
              payload: { player_id: "${p1_id}", from_team_id: "${team_a_id}", transaction_id: "${txn_rel_id}" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { w1_id: $.data.id }
            - call: "GET /teams/${team_b_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_b_id}"
              captures: { team_b_v: $.data.version }
            - call: "POST /waiver-requests/${w1_id}/claims"
              payload: { claiming_team_id: "${team_b_id}", expected_team_version: "${team_b_v}" }
              as: TeamCapAnalyst
              as_user_id: "${team_b_id}"
              captures: { claim_b_id: $.data.id }
            - call: "GET /teams/${team_c_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_c_id}"
              captures: { team_c_v: $.data.version }
