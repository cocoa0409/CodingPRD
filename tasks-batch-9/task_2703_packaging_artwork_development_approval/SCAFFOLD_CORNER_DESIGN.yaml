      - name: cyclic_revision_loop_terminates_at_the_third_cycle
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - validations[priority=41]
          - errors[ERR_REVISION_CYCLE_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / version_revision_cycle_loops_to_draft_until_cap_blocks_revise
          rationale: "The named instance drives the DRAFT -> ELEMENTS_VERIFIED -> IN_REVIEW -> REVISION_REQUESTED -> DRAFT loop three times and asserts the cap refusal on the fourth, which is exactly this row."

      - name: parallel_proof_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - entities.PrinterProof.fields.color_status
          - entities.PrinterProof.fields.substrate_status
          - entities.PrinterProof.fields.press_check_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / proof_three_dimensions_resolve_independently_into_derived_state
          rationale: "The named instance writes the three dimensions in isolation and asserts that each write leaves the others untouched."

      - name: compound_proof_state_is_re_derived_from_its_three_dimensions
        claim_type: compound
        grounds:
          - complexity_profile.state_machine_shape
          - entities.PrinterProof.fields.proof_state
          - state_machines.PrinterProof.PROOF_IN_REVIEW_to_PROOF_APPROVED
        excluded_because:
          difficulty_instance: non_linear_state_machine / proof_three_dimensions_resolve_independently_into_derived_state
          rationale: "The named instance asserts proof_state after each dimension write, including the write that flips it to PROOF_APPROVED."

      - name: guarded_submit_depends_on_an_ancestor_entity_state
        claim_type: guarded_transitions
        grounds:
          - validations[priority=35]
          - errors[ERR_BRIEF_NOT_APPROVED]
          - state_machines.ArtworkVersion.ELEMENTS_VERIFIED_to_IN_REVIEW
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / submit_gated_on_grandparent_brief_status_not_on_version_state
          rationale: "The named instance is precisely this guard: the version is legally ELEMENTS_VERIFIED but its grandparent Brief is DRAFT, so submit must fail."

      - name: cross_entity_settlement_adjusts_the_printer_row
        claim_type: cross_entity
        grounds:
          - entities.Printer.fields.performance_score
          - entities.Printer.fields.certification_status
          - state_machines.ErrorEscape.RECOVERY_CLAIMED_to_SETTLED
        excluded_because:
          difficulty_instance: transitive_cascade / settlement_cascade_drives_printer_probation_and_conditional_proof_recheck
          rationale: "The named instance settles an escape and asserts the printer's score, escape_count, recovery_balance and certification_status afterwards."

      - name: ledger_sync_on_plate_order_cancellation
        claim_type: ledger_sync
        grounds:
          - entities.ArtworkAsset.fields.committed_plate_cost_cents
          - state_machines.PlateOrder.ORDERED_to_CANCELLED
        excluded_because:
          difficulty_instance: compensating_invariant / plate_order_cancellation_debits_the_committed_ledger_without_rewriting_cost
          rationale: "The named instance reconciles the asset's committed-cost ledger before and after a cancellation and asserts the order's own cost fields are not rewritten."

      - name: compensation_reverses_every_disposition_side_effect
        claim_type: compensation
        grounds:
          - state_machines.InventoryRunout.SCRAPPED_to_MONITORING
          - entities.InventoryRunout.fields.reversal_count
          - entities.ArtworkAsset.fields.changeover_cost_committed_cents
        excluded_because:
          difficulty_instance: compensating_invariant / runout_disposition_reversal_debits_both_ledgers_and_rewinds_the_cascade
          rationale: "The named instance asserts both asset ledgers, every zeroed changeover field and the rewound version/asset states after a disposition reversal."

      - name: conditional_cascade_skips_already_cancelled_plate_orders
        claim_type: conditional_cascade
        grounds:
          - state_machines.ArtworkVersion.APPROVED_to_OBSOLETE_PENDING
          - entities.PlateOrder.fields.auto_cancelled
        excluded_because:
          difficulty_instance: transitive_cascade / approval_cascade_supersedes_prior_version_and_autocancels_plate_orders
          rationale: "The named instance carries one ORDERED and one already-CANCELLED plate order into the cascade and asserts only the ORDERED one is auto-cancelled and debited."

  # ==========================================================================
  # SECTION 3 - calculations (§1.3 surface)
  # Walks Table-3's four generic rows (correct result, input-set filtering,
  # constants applied, precision), then the algorithm-type rows for the
  # algorithms this scaffold actually declares - weighted_scoring, threshold,
  # constraint_propagation, aggregation, tiered_pricing, chronological - and
  # finally the three dual-variant rows. §1.8 rules 1, 2, 3 and 6 already own
  # the weighted-scoring composition, the two dual-variant divergences, the
  # proof constraint propagation and the delta-E threshold boundary, so those
  # rows appear as stubs.
  # ==========================================================================
  - section: calculations
    instances:

      - name: plate_cost_sums_three_marginal_bands_a_step_setup_fee_and_a_surcharge_on_both
        claim_type: correct_result
        grounds:
          - calculations.plate_order_cost
          - calculations.plate_order_cost.constants.PLATE_RATE_1_CENTS
          - calculations.plate_order_cost.constants.PLATE_RATE_2_CENTS
          - calculations.plate_order_cost.constants.PLATE_RATE_3_CENTS
          - calculations.plate_order_cost.constants.EXPEDITE_PCT
          - entities.PlateOrder.fields.plate_subtotal_cents
          - entities.PlateOrder.fields.cost_cents
          - endpoints[POST /plate-orders]
        distinguishing_aspect: |
          Two orders pin every branch of the ladder. Six plates straddle bands 1 and 2
          only (4x18000 + 2x15500 = 103000); ten plates reach band 3 as well
          (72000 + 62000 + 26000 = 160000) and carry the large setup fee, and its
          surcharge is keyed on plates PLUS setup (250000 x 0.25 = 62500), not on the
          plate subtotal alone - which would give 40000 and a total of 290000. An
          average-rate implementation reports 6x18000 + 60000 = 168000 for the first
          order.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z throughout."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en]); ArtworkAsset (CARTON / COATED_PAPER / US) with brand_critical_color false and plate_budget_cents 500000."
            - "ArtworkVersion v1 is APPROVED (all seven elements PASS, compliance_score 100.0, route approved through all three stages with no CONDITIONAL decision)."
            - "Printer Cascade Print Co: color_standard G7_MASTER, certified_substrates [COATED_PAPER, FILM]."
            - "PrinterProof proof_no 1 on COATED_PAPER is PROOF_APPROVED - effective_tolerance 2.0, measured_delta_e_max 1.20 -> COLOR_PASS, substrate SUBSTRATE_APPROVED, press_check_status NOT_REQUIRED (asset is not brand-critical and the substrate is not FILM)."
            - "ArtworkAsset.committed_plate_cost_cents is 0 - no PlateOrder exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial launch artwork."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: true }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
              payload: {verification_note: "Mandatory element verification run."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /artwork-versions/${v1_id}/submit"
              payload: {submit_note: "Route through brand, regulatory, legal and quality."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-routes"
              payload: {artwork_version_id: "${v1_id}", status: "IN_PROGRESS"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { r_1: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "BRAND"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_brand: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "REGULATORY"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_reg: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "LEGAL"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_legal: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "QUALITY"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_qa: "$.data[0].id" }
            - call: "POST /review-tasks/${t_1_brand}/decision"
              payload: {decision: "APPROVED", comment: "Brand identity approved."}
              as: BrandReviewer
              as_user_id: "u_brand"
            - call: "POST /review-tasks/${t_1_reg}/decision"
              payload: {decision: "APPROVED", comment: "Regulatory copy approved."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /review-tasks/${t_1_legal}/decision"
              payload: {decision: "APPROVED", comment: "No legal exposure."}
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "POST /review-tasks/${t_1_qa}/decision"
              payload: {decision: "APPROVED", comment: "Quality sign-off."}
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "POST /printers"
              payload:
                name: "Cascade Print Co"
                color_standard: "G7_MASTER"
                certified_substrates: ["COATED_PAPER", "FILM"]
                recovery_liability_cap_cents: 5000000
              as: PlatformAdmin
              as_user_id: "u_admin"
              captures: { printer_id: "$.data.id" }
            - call: "POST /printer-proofs"
              payload: {artwork_version_id: "${v1_id}", printer_id: "${printer_id}", substrate_code: "COATED_PAPER", proof_note: "Contract proof."}
              as: PrinterRep
