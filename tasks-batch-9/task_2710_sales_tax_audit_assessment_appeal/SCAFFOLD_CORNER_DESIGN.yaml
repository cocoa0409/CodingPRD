        claim_type: Violation → Error
        grounds: [validations.priority_13, errors.ERR_OFFER_BELOW_MINIMUM, errors.ERR_HARDSHIP_NOT_DOCUMENTED, "endpoints.POST /payment-arrangements/{id}/approve"]
        distinguishing_aspect: |
          The balance is 4762 and MIN_OIC_BP is 2000, so the test is the
          cross-multiplied integer comparison offer*10000 >= 2000*4762 = 9524000:
          952 gives 9520000 and must be refused with ERR_OFFER_BELOW_MINIMUM (422),
          953 gives 9530000 and clears it. Rounding the minimum to
          round_half_up(4762*2000/10000) = 952 first would wrongly approve the 952
          offer. A 953 offer with hardship_documented false must still be refused,
          with ERR_HARDSHIP_NOT_DOCUMENTED, so the two gates are independent.
        test_recipe:
          setup:
            - "MINI carried to an ISSUED small-balance notice (permit P-2710-V1): one CONSUMABLE purchase of 76192 cents with the clock parked on 2026-06-30, so tax 4762, provisional 5000, penalty waived, total_due_cents and balance_due_cents both 4762."
