  # ===========================================================================
  # RULE 4 — transitive cascades (one depth-4, one depth-3, different triggers)
  #   instance 1 : POST /quotes/{id}/firm-order      — depth 4
  #   instance 2 : POST /claim-advocacies/{id}/collections — depth 3(+1)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: firm_order_cascades_line_to_layer_to_program_to_rival_quote_lapse
        grounds:
          - state_machines.SigningLine.initial_state.PROVISIONAL
          - state_machines.Layer.transitions.PARTIALLY_PLACED_to_OVERSUBSCRIBED
          - state_machines.Program.transitions.IN_MARKET_to_FIRM_ORDER
          - state_machines.Quote.transitions.QUOTED_to_LAPSED
          - state_machines.MarketSubmission.transitions.QUOTED_to_CLOSED
          - calculations.reinsurer_aggregate_capacity
        distinguishing_aspect: |
          Trigger is a firm-order, and the chain is four links deep with every link CAUSED by
          the previous one: (1) a PROVISIONAL SigningLine is created, which (2) pushes
          Layer.written_line_total_pct to 110.0000 so the layer becomes OVERSUBSCRIBED, which
          (3) drives Program.placement_status IN_MARKET -> FIRM_ORDER, which (4) lapses every
          still-open Quote on the program's layers and closes their MarketSubmissions —
          Echo Re's untouched 40.0000 quote dies without ever being addressed. Nothing in the
          chain is triggered directly by the caller except link 1. Instance 2 starts from a
          money movement instead.
        test_recipe:
          setup:
            - "Three markets: Alpha Re (max_line 60.0000, capacity 2000000000, lead_authorised), Bravo Re (50.0000, 2000000000), Echo Re (40.0000, 1000000000)."
            - "One PROPERTY program in placement_status IN_MARKET with one CATASTROPHE layer of limit_minor 1000000000; all three markets hold SENT->QUOTED submissions on it."
            - "Alpha Re's 60.0000 line is already firm-ordered, so the layer is PARTIALLY_PLACED at written_line_total_pct 60.0000 and the program is still IN_MARKET; Echo Re's quote is untouched in status QUOTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Alpha Re", security_rating: "AA", capacity_limit_minor: 2000000000, max_line_pct: 60.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { alpha_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Bravo Re", security_rating: "A", capacity_limit_minor: 2000000000, max_line_pct: 50.0000, lead_authorised: false }
              as: PlatformAdmin
              captures: { bravo_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Echo Re", security_rating: "A", capacity_limit_minor: 1000000000, max_line_pct: 40.0000, lead_authorised: false }
              as: PlatformAdmin
              captures: { echo_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000, signdown_method: "PRO_RATA" }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "NW-CAT-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "PROP CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_id: $.data.id }
            - call: "POST /exposure-submissions/${sub_id}/submit-for-review"
              payload: {}
