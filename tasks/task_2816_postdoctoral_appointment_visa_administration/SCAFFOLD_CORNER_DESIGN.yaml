        distinguishing_aspect: "The role gate at priority 2 runs before path-id existence at priority 3, so every one of these six attempts returns ERR_FORBIDDEN_ROLE at 403 even though the ids in the paths belong to nothing - a server that looked the resource up first would leak ERR_APPOINTMENT_NOT_FOUND or ERR_VISA_CASE_NOT_FOUND instead. The matrix walks one exclusive operation of each of the six roles attempted by a role that does not hold it."
