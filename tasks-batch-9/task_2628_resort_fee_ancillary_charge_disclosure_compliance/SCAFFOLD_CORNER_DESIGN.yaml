        grounds:
          - validations[priority=41]
          - errors[ERR_FEE_PROGRAM_EMPTY]
          - state_machines.FeeProgram.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: "The DRAFT -> UNDER_REVIEW precondition is fee_count >= 1; an empty program is ERR_FEE_PROGRAM_EMPTY (409) and not ERR_INVALID_STATE, because the status itself is legal."
