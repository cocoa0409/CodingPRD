              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { ota1_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${ota1_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "BRAND", channel_kind: "DIRECT_BRAND", commission_bp: 0, allows_member_rate: true }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /distribution/channels/${brand_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://brand.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { brand_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${brand_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_ota1_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_ota1_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${brand_id}", room_type_id: "${king_id}", external_rate_code: "BAR-BRAND-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_brand_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_brand_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/rate-plans/${bar_id}/promotions"
              payload: { code: "MEMBER10", promo_kind: "MEMBER_RATE", discount_kind: "PERCENT", discount_bp: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: RevenueManager
              captures: { promo_id: $.data.id }
            - call: "POST /distribution/promotions/${promo_id}/load"
              payload: {}
              as: ChannelOpsEngineer
            - call: "GET /distribution/distribution-batches"
              payload: { property_id: "${prop_id}", payload_kind: "PROMOTION" }
              as: ChannelOpsEngineer
              captures: { batch_id: "$.data[0].id" }
            - call: "PATCH /distribution/channel-mappings/${map_brand_id}/content"
              payload: { content_image_count: 4 }
              as: ChannelOpsEngineer
          trigger:
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
            - call: "GET /distribution/distribution-jobs"
              payload: { batch_id: "${batch_id}", job_state: "REJECTED" }
              as: ChannelOpsEngineer
              captures: { rejected_job_id: "$.data[0].id" }
            - call: "PATCH /distribution/channel-mappings/${map_brand_id}/content"
              payload: { content_image_count: 5 }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-mappings/${map_brand_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/distribution-jobs/${rejected_job_id}/retry"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
          assert:
            - "At fan-out: DistributionBatch.${batch_id}.total_jobs == 2, batch_state == QUEUED, and the two jobs carry sequence_index 0 (OTA1 mapping) and 1 (BRAND mapping)"
            - "After the first dispatch: the OTA1 job is APPLIED, the BRAND job is REJECTED with failure_reason == PARITY_BLOCKED and attempt_count == 1"
            - "After the first dispatch: DistributionBatch.${batch_id}.batch_state == PARTIALLY_APPLIED, applied_jobs == 1, rejected_jobs == 1, abandoned_jobs == 0 - the join point does NOT report APPLIED"
            - "After the first dispatch: ChannelMapping.${map_brand_id}.mapping_state == ERRORED and ChannelConnection.${brand_conn_id}.connection_state == DEGRADED with consecutive_failures == 1"
            - "After the first dispatch: Promotion.${promo_id}.distribution_status == LOAD_FAILED"
            - "After the content fix and re-verify: ChannelMapping.${map_brand_id}.parity_state == IN_PARITY and mapping_state == VERIFIED"
            - "After the retry: RateDistributionJob.${rejected_job_id}.job_state == QUEUED with failure_reason == null and attempt_count == 1 (never reset), DistributionBatch.${batch_id}.rejected_jobs == 0 and batch_state still PARTIALLY_APPLIED"
            - "After the retry: Promotion.${promo_id}.distribution_status == LOADING (pulled back by the retry, with no second load call and no second batch)"
            - "After the second dispatch: RateDistributionJob.${rejected_job_id}.job_state == APPLIED with attempt_count == 2, DistributionBatch.${batch_id}.batch_state == APPLIED, applied_jobs == 2, rejected_jobs == 0"
            - "After the second dispatch: Promotion.${promo_id}.distribution_status == LOADED and the total DistributionBatch count for the property is still 1"

  # =====================================================================================
  - rule_id: transitive_cascade
    instances:

      - name: job_rejection_suspends_connection_recalls_allotment_and_recomputes_inventory
        grounds:
          - state_machines.RateDistributionJob.DISPATCHED_to_REJECTED
          - state_machines.ChannelConnection.DEGRADED_to_SUSPENDED
          - state_machines.ChannelAllocation.OPEN_to_RECALLED
          - state_machines.ChannelMapping.VERIFIED_to_ERRORED
          - calculations.inventory_pool_state
          - calculations.batch_state_rollup
          - concurrency_rules[rate-plan-update-stale-version]
        distinguishing_aspect: |
          Depth 5 from a single dispatch call: job REJECTED (1) -> connection consecutive_failures 3
          and SUSPENDED (2) -> its OPEN allotment RECALLED (3) -> the covered InventoryDay recomputed
          from allocated 4 / shared 7 to allocated 0 / shared 11 (4) -> the batch rollup settles to
          FAILED (5), touching six entities from one HTTP call.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING (capacity 10, ceiling 11), channel OTA1 whose connection was activated and then took two ERROR heartbeats, so it sits in DEGRADED with consecutive_failures 2 - one failure short of CONNECTION_FAILURE_SUSPEND_THRESHOLD."
            - "Rate plan BAR ACTIVE at 25000 (version 2 after activation); one VERIFIED mapping BAR x OTA1 x KING."
            - "Inventory day 2026-09-10 open, with an OPEN OTA1 allotment of 4 units covering it, so allocated_units 4, committed_units 0, shared_pool_units 7."
            - "The mapping's image count is then dropped to 4, making it OUT_OF_PARITY, and BAR is patched so a RATE batch with exactly one job exists in QUEUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
              captures: { bar_v: $.data.version }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "GET /distribution/room-types/${king_id}"
              payload: {}
              as: RevenueManager
              captures: { king_v: $.data.version }
            - call: "POST /distribution/room-types/${king_id}/allocations"
              payload: { channel_id: "${ota1_id}", allocated_units: 4, start_date: "2026-09-10", end_date: "2026-09-10", expected_room_type_version: "${king_v}" }
              as: RevenueManager
              captures: { alloc_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "PATCH /distribution/channel-mappings/${map_id}/content"
              payload: { content_image_count: 4 }
              as: ChannelOpsEngineer
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${bar_v}", ceiling_amount_cents: 41000 }
              as: RevenueManager
            - call: "GET /distribution/distribution-batches"
              payload: { property_id: "${prop_id}", payload_kind: "RATE" }
              as: ChannelOpsEngineer
              captures: { batch_id: "$.data[0].id" }
          trigger:
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
          assert:
            - "Hop 1 - the single child job is REJECTED with failure_reason == PARITY_BLOCKED and attempt_count == 1"
            - "Hop 1b - ChannelMapping.${map_id}.mapping_state == ERRORED (VERIFIED -> ERRORED on a PARITY_BLOCKED rejection)"
            - "Hop 2 - ChannelConnection.${conn_id}.consecutive_failures == 3, connection_state == SUSPENDED, suspended_at == 2026-08-25T00:00:00.000Z, last_failure_code == MAPPING_REJECTED"
            - "Hop 3 - ChannelAllocation.${alloc_id}.allocation_state == RECALLED with recalled_at == 2026-08-25T00:00:00.000Z (never RELEASED, never SUPERSEDED)"
            - "Hop 4 - InventoryDay.${inv_id}.allocated_units == 0, committed_units == 0, shared_pool_units == 11, overbooking_ceiling_units == 11, pooled_state == OPEN"
            - "Hop 4 invariant - InventoryDay.${inv_id}.overbooking_ceiling_units == allocated_units + committed_units + shared_pool_units (11 == 0 + 0 + 11)"
            - "Hop 5 - DistributionBatch.${batch_id}.batch_state == FAILED with total_jobs 1, applied_jobs 0, rejected_jobs 1, abandoned_jobs 0"
            - "No Restriction row exists: the recalled day was never OVERSOLD, so the conditional AUTO_OVERBOOK_GUARD lift hop does not fire"

      - name: oversold_day_creates_guard_stop_sell_batch_then_cancellation_lifts_it
        grounds:
          - state_machines.InventoryDay.EXHAUSTED_to_OVERSOLD
          - state_machines.InventoryDay.OVERSOLD_to_TIGHT
          - state_machines.Restriction.ACTIVE_to_LIFTED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - calculations.inventory_pool_state
        distinguishing_aspect: |
          Depth 5 through a different entity chain than the job cascade: reservation ->
          InventoryDay OVERSOLD -> AUTO_OVERBOOK_GUARD STOP_SELL Restriction -> RESTRICTION
          DistributionBatch -> child job; the cancellation then runs the same chain in reverse
          (OVERSOLD -> TIGHT -> restriction LIFTED with lift_reason AUTO_GUARD_CLEARED -> a SECOND
          RESTRICTION batch), so two batches exist at the end and none was requested by a caller.
        test_recipe:
          setup:
            - "Property HTL-SFO with room type TWIN (physical_capacity_units 2, overbooking_pct_bp override 5000 -> overbooking_ceiling_units 3, master hash twinv1, 5 images)."
            - "Channel OTA1 with a HEALTHY connection; rate plan BAR ACTIVE at 25000 (the only ACTIVE plan on the property)."
            - "One VERIFIED, IN_PARITY mapping BAR x OTA1 x TWIN, so every RESTRICTION batch fans out exactly one job."
            - "Inventory day 2026-09-10 open with no allotments; two CONFIRMED 1-night reservations already booked without override, leaving committed_units 2, shared_pool_units 1, pooled_state TIGHT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "TWIN", name: "Twin Room", physical_capacity_units: 2, master_description_hash: "twinv1", master_image_count: 5, overbooking_pct_bp: 5000 }
              as: RevenueManager
              captures: { twin_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${twin_id}", external_rate_code: "BAR-OTA1-TWIN", content_description_hash: "twinv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/room-types/${twin_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${twin_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
              captures: { res_1_id: $.data.id }
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${twin_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
              captures: { res_2_id: $.data.id }
          trigger:
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${twin_id}", arrival_date: "2026-09-10", nights: 1, override_overbooking: true }
              as: RevenueManager
              captures: { res_3_id: $.data.id }
            - call: "GET /distribution/restrictions"
              payload: { room_type_id: "${twin_id}", restriction_type: "STOP_SELL" }
              as: RevenueManager
              captures: { guard_id: "$.data[0].id" }
            - call: "POST /distribution/reservations/${res_3_id}/cancel"
              payload: {}
              as: RevenueManager
          assert:
            - "Hop 1 - Reservation.${res_3_id}.reservation_state == CONFIRMED with overbooking_overridden == true (the override was actually consumed)"
            - "Hop 2 - InventoryDay.${inv_id}.committed_units == 3, allocated_units == 0, shared_pool_units == 0, pooled_state == OVERSOLD (committed 3 > physical_capacity_units 2)"
            - "Hop 3 - exactly one Restriction exists: restriction_type == STOP_SELL, origin == AUTO_OVERBOOK_GUARD, restriction_state == ACTIVE, room_type_id == ${twin_id}, rate_plan_id == ${bar_id}, start_date == 2026-09-10, end_date == 2026-09-10, value_nights == null"
            - "Hop 4 - one DistributionBatch exists with payload_kind == RESTRICTION, source_ref_kind == RESTRICTION, source_ref_id == ${guard_id}, batch_state == QUEUED"
            - "Hop 5 - that batch has total_jobs == 1 and its single child job is QUEUED with channel_mapping_id == ${map_id}"
            - "After the cancel: Reservation.${res_3_id}.reservation_state == CANCELLED and InventoryDay.${inv_id}.committed_units == 2, shared_pool_units == 1, pooled_state == TIGHT"
            - "After the cancel: Restriction.${guard_id}.restriction_state == LIFTED with lift_reason == AUTO_GUARD_CLEARED and lifted_at == 2026-08-25T00:00:00.000Z"
            - "After the cancel: exactly two RESTRICTION DistributionBatch rows exist for the property (one from the guard creation, one from the automatic lift), each with total_jobs == 1"
            - "Reservation.${res_1_id} and Reservation.${res_2_id} both have overbooking_overridden == false - they never entered the overbooking band"

      - name: root_plan_patch_rederives_grandchild_and_fans_out_only_mapped_descendants
        grounds:
          - calculations.resolved_base_amount
          - concurrency_rules[rate-plan-update-stale-version]
          - entities.RatePlan.fields.derivation_depth
          - entities.RateDistributionJob.fields.payload_rate_cents
        distinguishing_aspect: |
          Depth 3 along the self-referential RatePlan edge: one PATCH on the root re-derives the child
          (25500) and the grandchild (26000) parent-before-child, then fans out exactly ONE job - for
          the grandchild's VERIFIED mapping - because the root and the child carry no mappings, so the
          job count is decided by the descendants' mapping set rather than by the patched plan.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING, channel OTA1 with a HEALTHY connection."
            - "Rate plan chain BAR (PUBLIC 25000, depth 0) -> CORP (NEGOTIATED ACME, PERCENT -1500, depth 1) -> CORP2 (NEGOTIATED ACME, AMOUNT +500, depth 2), all ACTIVE; resolved bases 25000 / 21250 / 21750."
            - "Exactly one VERIFIED mapping exists, on CORP2 x OTA1 x KING; BAR and CORP carry no mappings."
            - "BAR.version == 2 after activation, captured for the OCC echo."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
              captures: { bar_v: $.data.version }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "CORP", rate_class: "NEGOTIATED", parent_rate_plan_id: "${bar_id}", offset_kind: "PERCENT", offset_bp: -1500, negotiated_account_code: "ACME", floor_amount_cents: 15000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { corp_id: $.data.id }
            - call: "POST /distribution/rate-plans/${corp_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "CORP2", rate_class: "NEGOTIATED", parent_rate_plan_id: "${corp_id}", offset_kind: "AMOUNT", offset_amount_cents: 500, negotiated_account_code: "ACME", floor_amount_cents: 15000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { corp2_id: $.data.id }
            - call: "POST /distribution/rate-plans/${corp2_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${corp2_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "CORP2-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_corp2_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_corp2_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
          trigger:
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${bar_v}", base_amount_cents: 30000 }
              as: RevenueManager
          assert:
            - "Before the patch: RatePlan.${bar_id}.resolved_base_amount_cents == 25000, RatePlan.${corp_id}.resolved_base_amount_cents == 21250, RatePlan.${corp2_id}.resolved_base_amount_cents == 21750"
            - "Depths are computed, never supplied: derivation_depth == 0 / 1 / 2 for BAR / CORP / CORP2"
            - "Hop 1 - RatePlan.${bar_id}.resolved_base_amount_cents == 30000 and RatePlan.${bar_id}.version == 3"
            - "Hop 2 - RatePlan.${corp_id}.resolved_base_amount_cents == 25500 (round_half_up(30000 * 8500 / 10000))"
            - "Hop 2 - RatePlan.${corp2_id}.resolved_base_amount_cents == 26000 (25500 + 500, so the grandchild consumed the ALREADY re-derived child value, not the stale 21250)"
            - "Hop 3 - exactly one DistributionBatch exists: payload_kind == RATE, source_ref_kind == RATE_PLAN, source_ref_id == ${bar_id}, batch_state == QUEUED, total_jobs == 1"
            - "Hop 3 - the batch's single child job has channel_mapping_id == ${map_corp2_id}, sequence_index == 0 and payload_rate_cents == 26000"
            - "RatePlan.${corp_id}.version and RatePlan.${corp2_id}.version are unchanged by the re-derivation - only the patched plan's version is bumped, so a concurrent echo on a descendant is not invalidated"

  # =====================================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: unsellable_connection_beats_overbooking_ceiling_on_booking
        grounds:
          - validations[priority=12]
          - validations[priority=20]
          - calculations.inventory_pool_state
          - state_machines.ChannelConnection.DEGRADED_to_SUSPENDED
        distinguishing_aspect: |
          Category pair state (P12 ERR_CONNECTION_NOT_SELLABLE) vs business_fiscal (P20
          ERR_OVERBOOKING_CEILING_EXCEEDED): both are violated by one booking, the API returns the
          P12 error, and revalidating the connection - changing nothing about inventory - flips the
          same request to the P20 error, proving the order rather than merely asserting one code.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING (capacity 10, ceiling 11), inventory day 2026-09-10 open."
            - "Channel BRAND holds an OPEN allotment of 11 units covering 2026-09-10, so allocated_units 11, committed_units 0, shared_pool_units 0, pooled_state EXHAUSTED - and the day is NOT oversold, so no AUTO_OVERBOOK_GUARD restriction exists."
            - "Channel OTA1 holds NO allotment, so any OTA1 booking is a POOL draw against shared_pool_units 0."
            - "OTA1's connection was activated and then took three ERROR heartbeats, so it is SUSPENDED."
            - "Rate plan BAR ACTIVE at 25000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
