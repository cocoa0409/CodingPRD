    purpose: "List incidents, filterable by every polymorphic target as well as category and adjudication state."
    roles: [ProgramDirector, ComplianceOfficer]
    input: ["program_id?", "episode_id?", "underwriting_spot_id?", "respondent_volunteer_id?", "category?", "status?", "limit?", "offset?"]
