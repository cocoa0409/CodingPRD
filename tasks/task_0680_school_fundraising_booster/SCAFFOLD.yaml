# =============================================================================
# PRD Benchmark Scaffold — School Fundraising & Booster Programs
# Difficulty: Expert
# =============================================================================

scenario: |
  School Fundraising & Booster Programs (Booster/PTO/PTA style): campaign & goal
  (catalog sale/pledge/event), student/seller roster & sharing links, order &
  product fulfillment, pledge collection & prize-tier incentive, profit split &
  vendor reconciliation, parent/volunteer coordination, tax/receipt, reporting
  to school

domain_name: school-fundraising-booster
api_prefix: /fundraising

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation        # provisional (forecast) vs final (settled) raised totals
    - cascading_side_effects          # campaign close / seller block cascades down to orders, pledges, prizes
    - optimistic_concurrency          # OCC on Campaign.version for reconciliation/disbursement
    - rate_threshold_triggers         # prize-tier crossings at >= seller_credited_cents breakpoints

  entity_topology: flat
  # Every entity is a top-level collection under /fundraising carrying its
  # parent/cross FKs in the body. Campaign is the aggregate root; Order carries
  # parallel state dimensions; Pledge is cyclic; Seller is cross-referenced by
  # both Order and Pledge.

  state_machine_shape: parallel
  # Order carries TWO independent dimensions (payment_status x fulfillment_status);
  # Campaign posture is posture-driven over children; Pledge is cyclic (revision
  # loop RECORDED <-> PROMISED).

  relationship_patterns:
    - one_to_many        # Campaign -> Seller, Order, Pledge, PrizeTier, Volunteer, Product, Shift
    - cross_aggregate    # Order.seller_id -> Seller; Pledge.seller_id -> Seller; Shift.volunteer_id -> Volunteer

  role_model: peer_roles
  # CampaignAdmin (booster/PTO officer) runs the program; Seller (student/parent)
  # owns own orders/pledges via share link; Treasurer reconciles & disburses;
  # SchoolOfficial reads reports only. Distinct resource ownership per role.

  consistency_model: immediate
  # All mutations and their cascades are atomic within the triggering request;
  # computed roll-ups recomputed on read where declared.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Campaign
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: campaign_type, type: enum, source: input, description: "CATALOG | PLEDGE | EVENT — drives which child workflow is active", constraints: "one of {CATALOG, PLEDGE, EVENT}" }
      - { name: goal_cents, type: integer, source: input, description: "Fundraising goal in cents", constraints: ">= 1" }
      - { name: profit_split_pct, type: number, source: input, description: "Fraction of the split base retained by the school as profit (vendor keeps the residual)", constraints: "0 < profit_split_pct <= 1, two decimal places" }
      - { name: vendor_name, type: string, source: input, description: "Catalog/event vendor of record for reconciliation" }
      - { name: starts_at, type: datetime, source: input, description: "Campaign window open (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Campaign window close (exclusive)", constraints: "must be strictly after starts_at" }
      - { name: posture, type: enum, source: system, description: "DRAFT -> ACTIVE -> CLOSED -> RECONCILED -> DISBURSED; FROZEN reachable from ACTIVE", default: "DRAFT", constraints: "one of {DRAFT, ACTIVE, FROZEN, CLOSED, RECONCILED, DISBURSED}" }
      - { name: gross_collected_cents, type: integer, source: computed, description: "Sum of settled order + pledge money attributed to this campaign (final variant)" }
      - { name: forecast_gross_cents, type: integer, source: computed, description: "Forecast gross including not-yet-settled commitments (provisional variant)" }
      - { name: school_profit_cents, type: integer, source: computed, description: "School profit at RECONCILED snapshot; 0 until reconciled" }
      - { name: vendor_payable_cents, type: integer, source: computed, description: "Vendor amount owed at RECONCILED snapshot; 0 until reconciled" }
      - { name: reconciled_at, type: datetime, source: system, description: "Timestamp posture entered RECONCILED; null before", default: null }

  - name: PrizeTier
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: label, type: string, source: input, description: "Prize tier label (e.g. T-SHIRT, PIZZA_PARTY)" }
      - { name: threshold_cents, type: integer, source: input, description: "Seller credited amount (inclusive >=) at which this tier is earned", constraints: ">= 1, unique within campaign" }
      - { name: prize_description, type: string, source: input, description: "Human-readable prize" }

  - name: Seller
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: display_name, type: string, source: input, description: "Student/seller display name" }
      - { name: guardian_email, type: string, source: input, description: "Parent/guardian contact email" }
      - { name: share_slug, type: string, source: system, description: "Server-minted opaque sharing-link slug, unique across all sellers" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> BLOCKED (or back to ACTIVE)", default: "ACTIVE", constraints: "one of {ACTIVE, BLOCKED}" }
      - { name: credited_cents, type: integer, source: computed, description: "Settled money credited to this seller (final variant): settled orders + collected pledges attributed to seller" }
      - { name: earned_prize_tier_id, type: string, source: computed, description: "id of the highest PrizeTier whose threshold_cents <= credited_cents; null if none earned" }

  - name: Product
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: sku, type: string, source: input, description: "Catalog product SKU, unique within campaign" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Sale price per unit charged to buyer", constraints: ">= 1" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Vendor cost per unit (used in vendor reconciliation)", constraints: ">= 0 and <= unit_price_cents" }
      - { name: stock_qty, type: integer, source: input, description: "Units available to sell across all orders", constraints: ">= 0" }
      - { name: reserved_qty, type: integer, source: computed, description: "Units reserved by non-terminal orders (fulfillment_status in {PLACED, CONFIRMED})" }

  - name: Order
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; the seller credited for this catalog order" }
      - { name: buyer_name, type: string, source: input, description: "Purchasing customer name" }
      - { name: buyer_email, type: string, source: input, description: "Purchasing customer email for receipt" }
      - { name: lines, type: array, source: input, description: "Array of {product_id, quantity}; quantity >= 1 each", constraints: "non-empty" }
      - { name: payment_status, type: enum, source: system, description: "PENDING -> PAID -> REFUNDED (parallel dimension A)", default: "PENDING", constraints: "one of {PENDING, PAID, REFUNDED}" }
      - { name: fulfillment_status, type: enum, source: system, description: "PLACED -> CONFIRMED -> DELIVERED; CANCELLED reachable (parallel dimension B)", default: "PLACED", constraints: "one of {PLACED, CONFIRMED, DELIVERED, CANCELLED}" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum over lines of product.unit_price_cents * quantity (sum-then-store)" }
      - { name: tax_cents, type: integer, source: computed, description: "Sales tax on gross_cents at campaign TAX_RATE, rounded once on the order total" }
      - { name: total_charged_cents, type: integer, source: computed, description: "gross_cents + tax_cents" }
      - { name: receipt_number, type: string, source: system, description: "Server-minted sequential receipt number, assigned when payment_status enters PAID; null before", default: null }

  - name: Pledge
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; the seller credited for this pledge" }
      - { name: donor_name, type: string, source: input, description: "Pledging donor name" }
      - { name: donor_email, type: string, source: input, description: "Donor email for tax receipt" }
      - { name: per_unit_cents, type: integer, source: input, description: "Pledge amount per counted unit (e.g. per lap)", constraints: ">= 0" }
      - { name: flat_cents, type: integer, source: input, description: "Flat pledge amount independent of units", constraints: ">= 0", default: 0 }
      - { name: cap_cents, type: integer, source: input, description: "Maximum collectible amount (0 means uncapped)", constraints: ">= 0", default: 0 }
      - { name: units_recorded, type: integer, source: system, description: "Units performed, set when results recorded", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PROMISED -> RECORDED -> COLLECTED; RECORDED -> PROMISED revision loop; any non-terminal -> CANCELLED", default: "PROMISED", constraints: "one of {PROMISED, RECORDED, COLLECTED, CANCELLED}" }
      - { name: pledged_amount_cents, type: integer, source: computed, description: "Forecast amount via pledge_amount_due: min(cap or +inf, flat_cents + per_unit_cents * units_recorded)" }
      - { name: collected_cents, type: integer, source: system, description: "Amount actually collected when status enters COLLECTED; equals pledged_amount_cents at collection", default: 0 }
      - { name: receipt_number, type: string, source: system, description: "Server-minted sequential receipt number, assigned when status enters COLLECTED; null before", default: null }

  - name: Volunteer
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: full_name, type: string, source: input, description: "Parent/volunteer name" }
      - { name: email, type: string, source: input, description: "Volunteer contact email" }
      - { name: committed_minutes, type: integer, source: computed, description: "Total minutes across this volunteer's BOOKED shifts" }

  - name: VolunteerShift
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; volunteer assigned to this shift; null while OPEN", default: null }
      - { name: role_label, type: string, source: input, description: "Shift role (e.g. CHECK_IN, GRILL)" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end (exclusive)", constraints: "must be strictly after starts_at" }
      - { name: setup_buffer_minutes, type: integer, source: input, description: "Required gap before this shift's start during which the same volunteer must be free", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN -> BOOKED -> RELEASED; OPEN/BOOKED -> CANCELLED", default: "OPEN", constraints: "one of {OPEN, BOOKED, RELEASED, CANCELLED}" }

  - name: Disbursement
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; the reconciled campaign being paid out" }
      - { name: school_amount_cents, type: integer, source: system, description: "School profit paid out; copied from campaign.school_profit_cents at RECONCILED snapshot" }
      - { name: vendor_amount_cents, type: integer, source: system, description: "Vendor payable paid out; copied from campaign.vendor_payable_cents at RECONCILED snapshot" }
      - { name: memo, type: string, source: input, description: "Treasurer memo on the disbursement", default: null }
      - { name: status, type: enum, source: system, description: "RECORDED (terminal once created)", default: "RECORDED", constraints: "one of {RECORDED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Campaign posture: posture-driven gate over all children ----
  - entity: Campaign
    field: posture
    initial_state: DRAFT
    terminal_states: [DISBURSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fundraising/campaigns/{id}/activate"
        actor: CampaignAdmin
        preconditions:
          - "campaign has >= 1 PrizeTier OR campaign_type == EVENT (events need no prize tiers)"
          - "campaign has >= 1 Seller"
        side_effects:
          - "Sellers, Orders, Pledges, Volunteers, Products may now be created/transitioned"

      - from: ACTIVE
        to: FROZEN
        trigger: "POST /fundraising/campaigns/{id}/freeze"
        actor: CampaignAdmin
        preconditions: []
        side_effects:
          - "All forward-progress child transitions (order pay/confirm/deliver, pledge record/collect, shift book) are blocked while FROZEN"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /fundraising/campaigns/{id}/unfreeze"
        actor: CampaignAdmin
        preconditions: []
        side_effects:
          - "Child operations resume"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /fundraising/campaigns/{id}/close"
        actor: CampaignAdmin
        preconditions: []
        side_effects:
          - "Cascade depth>=3: campaign CLOSED => every Order with payment_status==PENDING and fulfillment_status in {PLACED, CONFIRMED} transitions fulfillment_status -> CANCELLED; that Order cancellation itself releases the order's line reservations so product_reserved_qty recomputes downward; the reduced reserved_qty in turn restores each product's available headroom (stock_qty - reserved_qty)"
          - "Every Pledge with status==PROMISED -> CANCELLED (uncollected promises lapse at close)"
          - "Every VolunteerShift with status==OPEN -> CANCELLED"
        note: "Pledges already RECORDED and Orders already PAID survive close for later reconciliation."

      - from: CLOSED
        to: RECONCILED
        trigger: "POST /fundraising/campaigns/{id}/reconcile"
        actor: Treasurer
        preconditions:
          - "campaign.posture == CLOSED"
          - "expected_campaign_version matches campaign.version (OCC)"
        side_effects:
          - "Snapshot final: school_profit_cents and vendor_payable_cents computed via profit_split_reconciliation and frozen onto the campaign"
          - "reconciled_at set to current clock"
          - "increments Campaign.version by 1"

      - from: RECONCILED
        to: DISBURSED
        trigger: "POST /fundraising/campaigns/{id}/disburse"
        actor: Treasurer
        preconditions:
          - "campaign.posture == RECONCILED"
          - "expected_campaign_version matches campaign.version (OCC)"
        side_effects:
          - "Creates a Disbursement copying school_profit_cents and vendor_payable_cents"
          - "increments Campaign.version by 1"

  # ---- Order: PARALLEL dimension A — payment_status ----
  - entity: Order
    field: payment_status
    initial_state: PENDING
    terminal_states: [REFUNDED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /fundraising/orders/{order_id}/pay"
        actor: CampaignAdmin
        preconditions:
          - "campaign.posture == ACTIVE"
          - "order.fulfillment_status != CANCELLED"
          - "the order's crediting Seller has status == ACTIVE"
        side_effects:
          - "receipt_number assigned (sequential)"
          - "order now counts toward seller.credited_cents and campaign.gross_collected_cents (final variant); seller.earned_prize_tier_id recomputed via prize_tier_earned (may cross a tier)"
      - from: PAID
        to: REFUNDED
        trigger: "POST /fundraising/orders/{order_id}/refund"
        actor: CampaignAdmin
        preconditions:
          - "order.payment_status == PAID"
        side_effects:
          - "Compensation: order no longer counts toward seller.credited_cents or campaign.gross_collected_cents; seller.earned_prize_tier_id recomputed (may drop a tier)"
          - "If fulfillment_status not already CANCELLED/DELIVERED, fulfillment_status -> CANCELLED, releasing the order's product reservations (product_reserved_qty recomputed)"

  # ---- Order: PARALLEL dimension B — fulfillment_status ----
  - entity: Order
    field: fulfillment_status
    initial_state: PLACED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /fundraising/orders/{order_id}/confirm"
        actor: CampaignAdmin
        preconditions:
          - "campaign.posture == ACTIVE"
          - "order.payment_status == PAID"
        side_effects:
          - "Reservation retained (still counts toward product.reserved_qty)"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /fundraising/orders/{order_id}/deliver"
        actor: CampaignAdmin
        preconditions:
          - "campaign.posture == ACTIVE OR campaign.posture == CLOSED"
          - "order.payment_status == PAID"
        side_effects:
          - "Reservation released into delivery (product_reserved_qty recomputed; delivered units leave reserved pool)"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /fundraising/orders/{order_id}/cancel OR system (campaign close / seller block cascade)"
        actor: "CampaignAdmin or system"
        preconditions:
          - "order.fulfillment_status == PLACED"
          - "order.payment_status != PAID (cannot cancel a paid order; refund it instead)"
        side_effects:
          - "Product reservations released (product_reserved_qty recomputed)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /fundraising/orders/{order_id}/cancel"
        actor: CampaignAdmin
        preconditions:
          - "order.fulfillment_status == CONFIRMED"
          - "order.payment_status != PAID (cannot cancel a paid confirmed order; refund it instead)"
        side_effects:
          - "Product reservations released (product_reserved_qty recomputed)"

  # ---- Pledge: CYCLIC revision loop RECORDED <-> PROMISED ----
  - entity: Pledge
    field: status
    initial_state: PROMISED
    terminal_states: [COLLECTED, CANCELLED]
    transitions:
      - from: PROMISED
        to: RECORDED
        trigger: "POST /fundraising/pledges/{pledge_id}/record"
        actor: CampaignAdmin
        preconditions:
          - "campaign.posture == ACTIVE"
          - "the pledge's crediting Seller has status == ACTIVE"
        side_effects:
          - "units_recorded set from request; pledged_amount_cents recomputed via pledge_amount_due"
      - from: RECORDED
        to: PROMISED
        trigger: "POST /fundraising/pledges/{pledge_id}/revise"
        actor: CampaignAdmin
        preconditions:
          - "campaign.posture == ACTIVE"
        side_effects:
          - "units_recorded reset to 0; pledged_amount_cents recomputed (revision loop, may repeat)"
      - from: RECORDED
        to: COLLECTED
        trigger: "POST /fundraising/pledges/{pledge_id}/collect"
        actor: CampaignAdmin
        preconditions:
          - "campaign.posture == ACTIVE OR campaign.posture == CLOSED"
          - "the pledge's crediting Seller has status == ACTIVE"
        side_effects:
          - "collected_cents set to pledged_amount_cents; receipt_number assigned (sequential)"
          - "pledge now counts toward seller.credited_cents and campaign.gross_collected_cents (final variant); seller.earned_prize_tier_id recomputed via prize_tier_earned (may cross a tier)"
      - from: PROMISED
        to: CANCELLED
        trigger: "POST /fundraising/pledges/{pledge_id}/cancel OR system (campaign close / seller block cascade)"
        actor: "CampaignAdmin or system"
        preconditions: []
        side_effects: []
      - from: RECORDED
        to: CANCELLED
        trigger: "POST /fundraising/pledges/{pledge_id}/cancel"
        actor: CampaignAdmin
        preconditions: []
        side_effects: []

  # ---- Seller: status with cascading block ----
  - entity: Seller
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: BLOCKED
        trigger: "POST /fundraising/sellers/{seller_id}/block"
        actor: CampaignAdmin
        preconditions: []
        side_effects:
          - "Cascade depth>=2: blocking the Seller => every Order crediting this seller with payment_status==PENDING and fulfillment_status in {PLACED, CONFIRMED} transitions fulfillment_status -> CANCELLED; each such Order cancellation in turn releases that order's product reservations so product_reserved_qty recomputes downward"
          - "Every Pledge crediting this seller with status==PROMISED -> CANCELLED"
          - "seller.credited_cents unaffected (already-settled money stays credited); earned_prize_tier_id unchanged"
      - from: BLOCKED
        to: ACTIVE
        trigger: "POST /fundraising/sellers/{seller_id}/unblock"
        actor: CampaignAdmin
        preconditions: []
        side_effects: []

  # ---- VolunteerShift: booking with temporal-overlap guard ----
  - entity: VolunteerShift
    field: status
    initial_state: OPEN
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /fundraising/shifts/{shift_id}/book"
        actor: CampaignAdmin
        preconditions:
          - "campaign.posture == ACTIVE"
          - "volunteer_id refers to a Volunteer in the same campaign"
          - "shift_overlap_guard passes: requested shift's buffer-extended interval [starts_at - setup_buffer_minutes, ends_at) must not overlap any other BOOKED shift of the same volunteer"
        side_effects:
          - "volunteer_id set; volunteer.committed_minutes recomputed via volunteer_committed_minutes"
      - from: BOOKED
        to: RELEASED
        trigger: "POST /fundraising/shifts/{shift_id}/release"
        actor: CampaignAdmin
        preconditions: []
        side_effects:
          - "volunteer.committed_minutes recomputed (this shift no longer counts)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /fundraising/shifts/{shift_id}/cancel OR system (campaign close cascade)"
        actor: "CampaignAdmin or system"
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /fundraising/shifts/{shift_id}/cancel"
        actor: CampaignAdmin
        preconditions: []
        side_effects:
          - "volunteer.committed_minutes recomputed"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reconcile-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /fundraising/campaigns/{id}/reconcile"
    occ_field: "expected_campaign_version"
    description: |
      Reconciling a Campaign whose version has advanced since the client last
      observed it is rejected. A CLOSED campaign can legitimately accept a
      late refund or pledge collection that bumps the campaign version and
      shifts the gross totals; a reconcile carrying a stale expected version
      observed before that mutation would snapshot the wrong profit split, so
      it is rejected on the stale-version check.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

  - rule_id: disburse-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /fundraising/campaigns/{id}/disburse"
    occ_field: "expected_campaign_version"
    description: |
      Disbursing a RECONCILED Campaign whose version has advanced since the
      client last observed it is rejected. The reconcile step that produced the
      snapshot increments the campaign version; a disburse carrying a stale
      expected version observed before reconcile completed would pay out an
      unfrozen view, so it is rejected on the stale-version check.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL-VARIANT #1 (Campaign domain): forecast vs final campaign gross ----
  - name: campaign_gross
    trigger: "read of Campaign (GET /fundraising/campaigns/{id}); refreshed on order pay/refund, pledge collect, campaign close, reconcile"
    algorithm: aggregation
    formula: |
      # FINAL variant (gross_collected_cents): only money that has actually settled.
      gross_collected_cents =
          sum(order.total_charged_cents for orders WHERE payment_status == PAID)
        + sum(pledge.collected_cents     for pledges WHERE status == COLLECTED)
      # Refunded orders (payment_status == REFUNDED) are excluded.
    input_set: "FINAL: Orders with payment_status==PAID; Pledges with status==COLLECTED. PROVISIONAL adds PENDING orders and RECORDED pledges (see variant)."
    constants: {}
    precision: "integer cents, exact (no rounding — all inputs already in cents)"
    variants:
      - name: provisional_forecast
        when: "campaign.forecast_gross_cents, read at any posture before reconcile"
        difference: |
          FORECAST variant (forecast_gross_cents) is forward-looking — it adds
          not-yet-settled commitments to the final figure:
            forecast_gross_cents =
                sum(order.total_charged_cents for orders WHERE payment_status IN {PENDING, PAID})
              + sum(pledge.pledged_amount_cents for pledges WHERE status IN {RECORDED, COLLECTED})
          For COLLECTED pledges, pledged_amount_cents == collected_cents. The two
          variants diverge whenever any order is PENDING or any pledge is
          RECORDED-but-not-COLLECTED: forecast > final.

  # ---- DUAL-VARIANT #2 (Seller domain): credited (final) vs ----
  # ----                                  forecast-credited (forward-looking) ----
  - name: seller_credited
    trigger: "read of Seller (GET /fundraising/sellers/{seller_id}); refreshed on order pay/refund, pledge collect, seller block/unblock"
    algorithm: chronological
    formula: |
      # FINAL/CREDITED variant (Seller.credited_cents): processed in settlement
      # order (created_at ASC; ties broken by receipt_number ASC) over settled
      # events crediting this seller:
      credited_cents =
          sum(order.total_charged_cents for orders WHERE seller_id == seller.id AND payment_status == PAID)
        + sum(pledge.collected_cents     for pledges WHERE seller_id == seller.id AND status == COLLECTED)
    input_set: "Orders with payment_status==PAID and pledges with status==COLLECTED naming this seller_id. Processed created_at ASC (then receipt_number ASC) for prize-tier crossing detection."
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: forecast_credited
        when: "leaderboard / projection read GET /fundraising/sellers/{seller_id}/credit-forecast"
        difference: |
          FORWARD-LOOKING variant projects what the seller WOULD be credited if
          all currently non-terminal commitments settle:
            forecast_credited_cents =
                sum(order.total_charged_cents for orders WHERE seller_id==seller.id AND payment_status IN {PENDING, PAID})
              + sum(pledge.pledged_amount_cents for pledges WHERE seller_id==seller.id AND status IN {RECORDED, COLLECTED})
          Same inputs, different inclusion set: the final variant counts only
          settled money; the forecast counts pending/recorded too. They diverge
          for any seller holding a PENDING order or RECORDED pledge.

  # ---- COMBINATORIAL mode (b): nested rounding order pinned (SUM-THEN-ROUND) ----
  - name: order_totals
    trigger: "Order creation (POST /fundraising/orders): gross/tax/total computed and stored"
    algorithm: aggregation
    formula: |
      # gross is the exact sum of per-line products (no rounding at line level —
      # unit_price_cents and quantity are integers, so per-line products are exact):
      gross_cents = sum over lines of ( product.unit_price_cents * line.quantity )
      # tax is rounded ONCE on the order-level gross, NOT per line:
      tax_cents   = round_half_up( gross_cents * TAX_RATE )      # SUM-THEN-ROUND
      total_charged_cents = gross_cents + tax_cents
      # The pinned order is SUM-THEN-ROUND. Rounding each line's tax first then
      # summing (ROUND-THEN-SUM) is explicitly NOT used and can differ by 1 cent.
    input_set: "All lines on the order; each line.product_id resolves to a Product in the same campaign."
    constants:
      TAX_RATE: 0.0825
    precision: "tax_cents rounded once, round_half_up, to whole cents"

  # ---- COMBINATORIAL mode (c): circular-looking dependency, evaluation order pinned ----
  - name: profit_split_reconciliation
    trigger: "POST /fundraising/campaigns/{id}/reconcile (CLOSED -> RECONCILED)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED to break the apparent circularity between
      # "gross", "vendor cost recovery", and "school profit":
      # STEP 1 — settled product revenue (final variant), tax tracked separately:
      product_revenue_cents =
          sum(order.gross_cents for orders WHERE payment_status == PAID)   # excludes tax
      pledge_revenue_cents =
          sum(pledge.collected_cents for pledges WHERE status == COLLECTED)
      tax_collected_cents =
          sum(order.tax_cents for orders WHERE payment_status == PAID)
      # STEP 2 — vendor cost of goods on PAID orders (NOT forecast / not pending):
      vendor_cogs_cents =
          sum over PAID orders, over their lines, of ( product.unit_cost_cents * line.quantity )
      # STEP 3 — the base subject to the split is PRODUCT revenue net of vendor
      # COGS, PLUS all pledge revenue (pledges carry no vendor cost):
      split_base_cents = (product_revenue_cents - vendor_cogs_cents) + pledge_revenue_cents
      if split_base_cents < 0: split_base_cents = 0     # floor at zero
      # STEP 4 — waterfall: school takes its profit_split_pct of the split base
      # FIRST (rounded once); vendor receives its COGS PLUS the exact residual:
      school_profit_cents  = round_half_up( split_base_cents * profit_split_pct )
      vendor_payable_cents = vendor_cogs_cents + ( split_base_cents - school_profit_cents )
      # tax_collected_cents is remitted separately and belongs to NEITHER payout
      # bucket (see compensating invariant on reconciliation conservation).
    input_set: "PAID orders and COLLECTED pledges as of the reconcile call; REFUNDED orders and CANCELLED pledges excluded."
    constants: {}
    precision: "school_profit_cents rounded once round_half_up; vendor_payable_cents takes the exact residual so school_profit_cents + (vendor_payable_cents - vendor_cogs_cents) == split_base_cents exactly"

  # ---- Product reservation aggregate ----
  - name: product_reserved_qty
    trigger: "order create, order cancel, order deliver, order refund, campaign close cascade, seller block cascade"
    algorithm: aggregation
    formula: |
      reserved_qty = sum over all Orders of this campaign, over their lines,
                     of line.quantity
                     WHERE order.fulfillment_status IN {PLACED, CONFIRMED}
                       AND line.product_id == product.id
      # DELIVERED units have left the reserved pool (delivered, not reserved);
      # CANCELLED orders hold no reservation. payment_status does not matter
      # here — fulfillment_status alone governs reservation.
    input_set: "Orders with fulfillment_status IN {PLACED, CONFIRMED}; DELIVERED and CANCELLED excluded."
    constants: {}
    precision: "integer units, exact"

  # ---- Volunteer committed minutes aggregate ----
  - name: volunteer_committed_minutes
    trigger: "shift book, shift release, shift cancel"
    algorithm: aggregation
    formula: |
      committed_minutes = sum over VolunteerShifts WHERE volunteer_id == volunteer.id
                          AND status == BOOKED
                          of floor( (ends_at - starts_at) in whole minutes )
      # setup_buffer_minutes does NOT count toward committed_minutes; it only
      # extends the overlap-guard interval at booking time.
    input_set: "VolunteerShifts of this volunteer with status == BOOKED only."
    constants: {}
    precision: "integer minutes, exact"

  # ---- Pledge amount (cap interacts with flat + per-unit) ----
  - name: pledge_amount_due
    trigger: "Pledge creation; pledge record; pledge revise; referenced at collect"
    algorithm: aggregation
    formula: |
      raw_cents = flat_cents + per_unit_cents * units_recorded
      if cap_cents == 0:        # 0 sentinel means uncapped
          pledged_amount_cents = raw_cents
      else:
          pledged_amount_cents = min(raw_cents, cap_cents)
      # At collect, collected_cents := pledged_amount_cents (the value at the
      # moment of collection, after any record/revise loop has settled).
    input_set: "The single pledge's own fields (flat_cents, per_unit_cents, units_recorded, cap_cents)."
    constants: {}
    precision: "integer cents, exact; min applied after the flat+per-unit sum"

  # ---- THRESHOLD: prize-tier earned (>= boundary) ----
  - name: prize_tier_earned
    trigger: "order pay, order refund, pledge collect (anything moving seller.credited_cents)"
    algorithm: threshold
    formula: |
      # Among the campaign's PrizeTiers, the seller earns the HIGHEST tier whose
      # threshold_cents <= credited_cents (inclusive >=).
      eligible = [ t for t in campaign.prize_tiers if t.threshold_cents <= seller.credited_cents ]
      if eligible is empty:
          earned_prize_tier_id = null
      else:
          earned_prize_tier_id = ( tier with max threshold_cents ).id
          # threshold_cents is unique within a campaign, so max is unambiguous.
      # Boundary: credited_cents == threshold_cents EARNS the tier (>=, not >).
      # credited_cents == threshold_cents - 1 does NOT.
    input_set: "campaign.prize_tiers (all), evaluated against the seller's FINAL credited_cents."
    constants: {}
    precision: "integer cents comparison, inclusive >="

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "Role permitted for this operation per §1.7 (includes Seller ownership: X-User-ID == body seller_id on order/pledge create)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,            check: "Path resources exist (campaign / order / pledge / seller / product / shift / volunteer id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all with path ids" }
  - { priority: 4,  category: existence,            check: "Referenced foreign keys in body exist within the named campaign (campaign_id, seller_id, product_id, volunteer_id)", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "order/pledge/shift/seller/product/prize-tier/volunteer create, shift book" }
  - { priority: 5,  category: business_constraint,  check: "Request body shape valid (required fields present, enum values legal, ends_at strictly after starts_at, profit_split_pct in (0,1], lines non-empty, quantities >= 1, non-negative cents)", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "all create/update" }
  - { priority: 6,  category: state,                check: "OCC: expected_campaign_version matches campaign.version", error_id: ERR_STALE_CAMPAIGN_VERSION, http_status: 412, applies_to: "reconcile, disburse" }
  - { priority: 7,  category: state,                check: "Target resource in a state from which this transition is legal (per §1.2); includes reconcile-before-CLOSED, disburse-before-RECONCILED, double-disburse", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 8,  category: state,                check: "Campaign posture permits this child operation (gate): DRAFT blocks all child create/transition; FROZEN blocks forward-progress transitions", error_id: ERR_CAMPAIGN_NOT_ACTIVE, http_status: 409, applies_to: "child create + forward transitions" }
  - { priority: 9,  category: business_referential, check: "Crediting Seller is not BLOCKED for revenue-affecting transitions (order pay, pledge record, pledge collect)", error_id: ERR_SELLER_BLOCKED, http_status: 409, applies_to: "order pay, pledge record, pledge collect" }
  - { priority: 10, category: business_safety,      check: "Order lines must not reserve more units than a product has available: requested qty for a product <= product.stock_qty - product.reserved_qty (boundary inclusive: equality OK)", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "order create" }
  - { priority: 11, category: business_temporal,    check: "shift_overlap_guard: booking a shift for a volunteer must not overlap (buffer-extended) another BOOKED shift of the same volunteer", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "shift book" }
  - { priority: 12, category: business_constraint,  check: "PrizeTier threshold_cents unique within campaign; Product sku unique within campaign", error_id: ERR_DUPLICATE_KEY, http_status: 409, applies_to: "prize-tier create, product create" }
  - { priority: 13, category: business_fiscal,      check: "Cannot cancel an order whose payment_status == PAID via the cancel endpoint (must refund instead)", error_id: ERR_PAID_ORDER_NOT_CANCELLABLE, http_status: 409, applies_to: "order cancel" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Campaign lifecycle ----
  - { method: POST, path: "/fundraising/campaigns", description: "Create a campaign (DRAFT)", roles: [CampaignAdmin], code: 201,
      input: [name, campaign_type, goal_cents, profit_split_pct, vendor_name, starts_at, ends_at],
      output: Campaign, side_effects: ["posture=DRAFT, version=1, computed gross fields = 0"] }
  - { method: GET,  path: "/fundraising/campaigns/{id}", description: "Get a campaign with computed gross/forecast/profit fields", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: [], output: Campaign, side_effects: ["recompute gross_collected_cents, forecast_gross_cents on read"] }
  - { method: GET,  path: "/fundraising/campaigns", description: "List campaigns (paginated, filter by posture/campaign_type)", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: ["posture?", "campaign_type?", "limit?", "offset?"], output: "Campaign[]", side_effects: [] }
  - { method: POST, path: "/fundraising/campaigns/{id}/activate", description: "DRAFT -> ACTIVE", roles: [CampaignAdmin], code: 200,
      input: [], output: Campaign, side_effects: ["posture=ACTIVE"] }
  - { method: POST, path: "/fundraising/campaigns/{id}/freeze", description: "ACTIVE -> FROZEN", roles: [CampaignAdmin], code: 200,
      input: [], output: Campaign, side_effects: ["posture=FROZEN; forward child ops blocked"] }
  - { method: POST, path: "/fundraising/campaigns/{id}/unfreeze", description: "FROZEN -> ACTIVE", roles: [CampaignAdmin], code: 200,
      input: [], output: Campaign, side_effects: ["posture=ACTIVE"] }
  - { method: POST, path: "/fundraising/campaigns/{id}/close", description: "ACTIVE -> CLOSED with cascade", roles: [CampaignAdmin], code: 200,
      input: [], output: Campaign, side_effects: ["Cascade: PENDING non-terminal orders cancelled + reservations released; PROMISED pledges cancelled; OPEN shifts cancelled"] }
  - { method: POST, path: "/fundraising/campaigns/{id}/reconcile", description: "CLOSED -> RECONCILED; snapshot profit split (OCC)", roles: [Treasurer], code: 200,
      input: [expected_campaign_version], output: Campaign,
      side_effects: ["school_profit_cents & vendor_payable_cents frozen via profit_split_reconciliation", "reconciled_at set", "increments Campaign.version by 1"] }
  - { method: POST, path: "/fundraising/campaigns/{id}/disburse", description: "RECONCILED -> DISBURSED; create Disbursement (OCC)", roles: [Treasurer], code: 200,
      input: [expected_campaign_version, "memo?"], output: Campaign,
      side_effects: ["Creates Disbursement copying snapshot amounts", "increments Campaign.version by 1"] }
  - { method: GET,  path: "/fundraising/campaigns/{id}/report", description: "Computed report for school: gross, forecast, profit split, reconciled amounts", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: [], output: Campaign, side_effects: ["recompute roll-ups"] }

  # ---- PrizeTier ----
  - { method: POST, path: "/fundraising/prize-tiers", description: "Create a prize tier on a campaign", roles: [CampaignAdmin], code: 201,
      input: [campaign_id, label, threshold_cents, prize_description], output: PrizeTier, side_effects: [] }
  - { method: GET,  path: "/fundraising/prize-tiers", description: "List prize tiers, filterable by campaign_id", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: ["campaign_id?", "limit?", "offset?"], output: "PrizeTier[]", side_effects: [] }
  - { method: GET,  path: "/fundraising/prize-tiers/{prize_tier_id}", description: "Get a prize tier", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: [], output: PrizeTier, side_effects: [] }

  # ---- Seller ----
  - { method: POST, path: "/fundraising/sellers", description: "Add a seller to a campaign roster (mints share_slug)", roles: [CampaignAdmin], code: 201,
      input: [campaign_id, display_name, guardian_email], output: Seller, side_effects: ["share_slug minted; status=ACTIVE"] }
  - { method: GET,  path: "/fundraising/sellers", description: "List sellers, filterable by campaign_id / status (paginated)", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: ["campaign_id?", "status?", "limit?", "offset?"], output: "Seller[]", side_effects: [] }
  - { method: GET,  path: "/fundraising/sellers/{seller_id}", description: "Get a seller with computed credited_cents & earned_prize_tier_id", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: [], output: Seller, side_effects: ["recompute credited_cents, earned_prize_tier_id"] }
  - { method: GET,  path: "/fundraising/sellers/{seller_id}/credit-forecast", description: "Forward-looking credited projection for a seller (does not persist)", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: [], output: Seller, side_effects: ["compute forecast_credited variant"] }
  - { method: POST, path: "/fundraising/sellers/{seller_id}/block", description: "ACTIVE -> BLOCKED with cascade", roles: [CampaignAdmin], code: 200,
      input: [], output: Seller, side_effects: ["Cascade: seller's PENDING non-terminal orders cancelled + reservations released; PROMISED pledges cancelled"] }
  - { method: POST, path: "/fundraising/sellers/{seller_id}/unblock", description: "BLOCKED -> ACTIVE", roles: [CampaignAdmin], code: 200,
      input: [], output: Seller, side_effects: ["status=ACTIVE"] }

  # ---- Product ----
  - { method: POST, path: "/fundraising/products", description: "Create a catalog product on a campaign", roles: [CampaignAdmin], code: 201,
      input: [campaign_id, sku, name, unit_price_cents, unit_cost_cents, stock_qty], output: Product, side_effects: ["reserved_qty=0"] }
  - { method: GET,  path: "/fundraising/products", description: "List products, filterable by campaign_id (paginated)", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: ["campaign_id?", "limit?", "offset?"], output: "Product[]", side_effects: ["recompute reserved_qty"] }
  - { method: GET,  path: "/fundraising/products/{product_id}", description: "Get a product with computed reserved_qty", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: [], output: Product, side_effects: ["recompute reserved_qty"] }

  # ---- Order (parallel-dimension lifecycle) ----
  - { method: POST, path: "/fundraising/orders", description: "Place a catalog order crediting a seller", roles: [CampaignAdmin, Seller], code: 201,
      input: [campaign_id, seller_id, buyer_name, buyer_email, lines], output: Order,
      side_effects: ["compute gross/tax/total via order_totals; payment_status=PENDING; fulfillment_status=PLACED; product reservations taken (product_reserved_qty recomputed)"] }
  - { method: GET,  path: "/fundraising/orders", description: "List orders, filterable by campaign_id / seller_id / payment_status / fulfillment_status", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: ["campaign_id?", "seller_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: GET,  path: "/fundraising/orders/{order_id}", description: "Get an order", roles: [CampaignAdmin, Treasurer, SchoolOfficial, Seller], code: 200,
      input: [], output: Order, side_effects: [] }
  - { method: POST, path: "/fundraising/orders/{order_id}/pay", description: "payment PENDING -> PAID", roles: [CampaignAdmin], code: 200,
      input: [], output: Order, side_effects: ["receipt_number assigned; counts toward seller.credited_cents & campaign.gross_collected_cents; prize tier recomputed"] }
  - { method: POST, path: "/fundraising/orders/{order_id}/confirm", description: "fulfillment PLACED -> CONFIRMED", roles: [CampaignAdmin], code: 200,
      input: [], output: Order, side_effects: ["reservation retained"] }
  - { method: POST, path: "/fundraising/orders/{order_id}/deliver", description: "fulfillment CONFIRMED -> DELIVERED", roles: [CampaignAdmin], code: 200,
      input: [], output: Order, side_effects: ["reservation released into delivery (product_reserved_qty recomputed)"] }
  - { method: POST, path: "/fundraising/orders/{order_id}/cancel", description: "fulfillment PLACED/CONFIRMED -> CANCELLED (unpaid only)", roles: [CampaignAdmin], code: 200,
      input: [], output: Order, side_effects: ["product reservations released (product_reserved_qty recomputed)"] }
  - { method: POST, path: "/fundraising/orders/{order_id}/refund", description: "payment PAID -> REFUNDED (compensation)", roles: [CampaignAdmin], code: 200,
      input: [], output: Order, side_effects: ["order removed from seller.credited_cents & campaign.gross_collected_cents; prize tier recomputed (may drop); fulfillment -> CANCELLED if not DELIVERED/CANCELLED, releasing reservations"] }

  # ---- Pledge (cyclic lifecycle) ----
  - { method: POST, path: "/fundraising/pledges", description: "Create a pledge crediting a seller", roles: [CampaignAdmin, Seller], code: 201,
      input: [campaign_id, seller_id, donor_name, donor_email, per_unit_cents, "flat_cents?", "cap_cents?"], output: Pledge,
      side_effects: ["status=PROMISED; pledged_amount_cents computed via pledge_amount_due with units_recorded=0"] }
  - { method: GET,  path: "/fundraising/pledges", description: "List pledges, filterable by campaign_id / seller_id / status", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: ["campaign_id?", "seller_id?", "status?", "limit?", "offset?"], output: "Pledge[]", side_effects: [] }
  - { method: GET,  path: "/fundraising/pledges/{pledge_id}", description: "Get a pledge", roles: [CampaignAdmin, Treasurer, SchoolOfficial, Seller], code: 200,
      input: [], output: Pledge, side_effects: [] }
  - { method: POST, path: "/fundraising/pledges/{pledge_id}/record", description: "PROMISED -> RECORDED; record performed units", roles: [CampaignAdmin], code: 200,
      input: [units_recorded], output: Pledge, side_effects: ["units_recorded set; pledged_amount_cents recomputed via pledge_amount_due"] }
  - { method: POST, path: "/fundraising/pledges/{pledge_id}/revise", description: "RECORDED -> PROMISED (revision loop)", roles: [CampaignAdmin], code: 200,
      input: [], output: Pledge, side_effects: ["units_recorded reset to 0; pledged_amount_cents recomputed"] }
  - { method: POST, path: "/fundraising/pledges/{pledge_id}/collect", description: "RECORDED -> COLLECTED", roles: [CampaignAdmin], code: 200,
      input: [], output: Pledge, side_effects: ["collected_cents set to pledged_amount_cents; receipt_number assigned; counts toward seller.credited_cents & campaign.gross_collected_cents; prize tier recomputed"] }
  - { method: POST, path: "/fundraising/pledges/{pledge_id}/cancel", description: "PROMISED/RECORDED -> CANCELLED", roles: [CampaignAdmin], code: 200,
      input: [], output: Pledge, side_effects: [] }

  # ---- Volunteer & Shift ----
  - { method: POST, path: "/fundraising/volunteers", description: "Add a volunteer to a campaign", roles: [CampaignAdmin], code: 201,
      input: [campaign_id, full_name, email], output: Volunteer, side_effects: ["committed_minutes=0"] }
  - { method: GET,  path: "/fundraising/volunteers", description: "List volunteers, filterable by campaign_id (paginated)", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: ["campaign_id?", "limit?", "offset?"], output: "Volunteer[]", side_effects: ["recompute committed_minutes"] }
  - { method: GET,  path: "/fundraising/volunteers/{volunteer_id}", description: "Get a volunteer with committed_minutes", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: [], output: Volunteer, side_effects: ["recompute committed_minutes"] }
  - { method: POST, path: "/fundraising/shifts", description: "Create an OPEN volunteer shift on a campaign", roles: [CampaignAdmin], code: 201,
      input: [campaign_id, role_label, starts_at, ends_at, "setup_buffer_minutes?"], output: VolunteerShift, side_effects: ["status=OPEN; volunteer_id=null"] }
  - { method: GET,  path: "/fundraising/shifts", description: "List shifts, filterable by campaign_id / status / volunteer_id", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: ["campaign_id?", "status?", "volunteer_id?", "limit?", "offset?"], output: "VolunteerShift[]", side_effects: [] }
  - { method: GET,  path: "/fundraising/shifts/{shift_id}", description: "Get a shift", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: [], output: VolunteerShift, side_effects: [] }
  - { method: POST, path: "/fundraising/shifts/{shift_id}/book", description: "OPEN -> BOOKED for a volunteer (overlap-guarded)", roles: [CampaignAdmin], code: 200,
      input: [volunteer_id], output: VolunteerShift, side_effects: ["volunteer_id set; volunteer.committed_minutes recomputed"] }
  - { method: POST, path: "/fundraising/shifts/{shift_id}/release", description: "BOOKED -> RELEASED", roles: [CampaignAdmin], code: 200,
      input: [], output: VolunteerShift, side_effects: ["volunteer.committed_minutes recomputed"] }
  - { method: POST, path: "/fundraising/shifts/{shift_id}/cancel", description: "OPEN/BOOKED -> CANCELLED", roles: [CampaignAdmin], code: 200,
      input: [], output: VolunteerShift, side_effects: ["volunteer.committed_minutes recomputed if was BOOKED"] }

  # ---- Disbursement (read-back) ----
  - { method: GET,  path: "/fundraising/disbursements", description: "List disbursements, filterable by campaign_id (0 or 1 per campaign)", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: ["campaign_id?", "limit?", "offset?"], output: "Disbursement[]", side_effects: [] }
  - { method: GET,  path: "/fundraising/disbursements/{disbursement_id}", description: "Get a disbursement", roles: [CampaignAdmin, Treasurer, SchoolOfficial], code: 200,
      input: [], output: Disbursement, side_effects: [] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-04-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock.", roles: [CampaignAdmin, Treasurer], code: 200,
      input: [to_iso8601], output: null, side_effects: ["logical clock set to to_iso8601"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,           http: 401, condition: "X-User-Role / X-User-ID header missing or malformed" }
  - { id: ERR_FORBIDDEN,                 http: 403, condition: "Authenticated role not permitted for this operation (incl. Seller acting on another seller's order/pledge)" }
  - { id: ERR_NOT_FOUND,                 http: 404, condition: "Path resource (campaign / order / pledge / seller / product / shift / volunteer / prize-tier / disbursement) does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND,       http: 404, condition: "Body foreign key (campaign_id / seller_id / product_id / volunteer_id) not found or not in the named campaign" }
  - { id: ERR_INVALID_REQUEST,           http: 422, condition: "Malformed body: missing required field, illegal enum, ends_at<=starts_at, profit_split_pct out of (0,1], empty lines, qty<1, negative cents" }
  - { id: ERR_STALE_CAMPAIGN_VERSION,    http: 412, condition: "expected_campaign_version does not match current Campaign.version (OCC) on reconcile/disburse" }
  - { id: ERR_INVALID_STATE,             http: 409, condition: "Resource not in a legal state for the requested transition (also: reconcile before CLOSED, disburse before RECONCILED, double disburse)" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE,       http: 409, condition: "Campaign posture forbids this child operation (DRAFT blocks all child create/transition; FROZEN blocks forward progress)" }
  - { id: ERR_SELLER_BLOCKED,            http: 409, condition: "Crediting seller is BLOCKED on a revenue-affecting transition (order pay, pledge record, pledge collect)" }
  - { id: ERR_INSUFFICIENT_STOCK,        http: 409, condition: "Order line requests more units than product stock_qty - reserved_qty allows" }
  - { id: ERR_SHIFT_OVERLAP,             http: 409, condition: "Booking a shift overlaps (buffer-extended) another BOOKED shift of the same volunteer" }
  - { id: ERR_DUPLICATE_KEY,             http: 409, condition: "PrizeTier threshold_cents or Product sku not unique within campaign" }
  - { id: ERR_PAID_ORDER_NOT_CANCELLABLE,http: 409, condition: "Attempt to cancel an order whose payment_status == PAID (refund required instead)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CampaignAdmin
    description: "Booster/PTO/PTA officer who builds and runs the campaign: sellers, products, prize tiers, orders, pledges, volunteers, shifts, and posture lifecycle up to CLOSED. Segregated from the Treasurer's reconcile/disburse duties."
    identity: "opaque"
    exclusive_operations:
      - "POST /fundraising/campaigns — create campaign"
      - "POST /fundraising/campaigns/{id}/activate|freeze|unfreeze|close — posture lifecycle (NOT reconcile/disburse)"
      - "POST /fundraising/prize-tiers — create prize tier"
      - "POST /fundraising/sellers — add seller; POST .../sellers/{id}/block|unblock"
      - "POST /fundraising/products — create product"
      - "order pay/confirm/deliver/cancel/refund"
      - "pledge record/revise/collect/cancel"
      - "POST /fundraising/volunteers — add volunteer; shift create/book/release/cancel"
    shared_operations:
      - "POST /fundraising/orders — place order (shared with Seller)"
      - "POST /fundraising/pledges — create pledge (shared with Seller)"
      - "all GET reads"
      - "POST /_clock/set_current_utc (shared with Treasurer)"

  - name: Seller
    description: "Student/parent seller acting through their share link; may place orders and create pledges crediting themselves and read their own order/pledge."
    identity: "entity_backed:Seller"
    exclusive_operations: []
    shared_operations:
      - "POST /fundraising/orders — place order (X-User-ID must equal the body seller_id)"
      - "POST /fundraising/pledges — create pledge (X-User-ID must equal the body seller_id)"
      - "GET /fundraising/orders/{order_id} — read own order"
      - "GET /fundraising/pledges/{pledge_id} — read own pledge"

  - name: Treasurer
    description: "School/booster treasurer who reconciles settled money and records disbursements (profit split & vendor reconciliation). Segregated from CampaignAdmin lifecycle ops."
    identity: "opaque"
    exclusive_operations:
      - "POST /fundraising/campaigns/{id}/reconcile — snapshot profit split"
      - "POST /fundraising/campaigns/{id}/disburse — record disbursement"
    shared_operations:
      - "all GET reads"
      - "POST /_clock/set_current_utc (shared with CampaignAdmin)"

  - name: SchoolOfficial
    description: "School administrator who only reads campaign reports, seller credit, prize tiers, and disbursements for oversight."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "all GET reads (campaigns, sellers, products, orders, pledges, prize-tiers, volunteers, shifts, report, disbursements)"
