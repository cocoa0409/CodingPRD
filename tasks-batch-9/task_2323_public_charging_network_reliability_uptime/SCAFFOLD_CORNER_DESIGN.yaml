            - "call 3: HTTP status == 422 and data.error_id == \"ERR_REPORTING_PERIOD_NOT_ELAPSED\" (16 days long, but 2026-08-05 is beyond the clock)"
            - "call 4: HTTP status == 201 — exactly 10080 minutes, ending exactly at the logical clock"
            - "UptimeReport.${rp_id}.state == DRAFT, methodology == null, uptime_pct == null, returned_count == 0, claim_count == 0"
            - "GET /stations/${st_id}/uptime-reports has total_count 1"

      - name: restricted_access_window_must_open_before_it_closes
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_INVALID_ACCESS_WINDOW]
          - entities.HostSite.fields.access_close_minute
        distinguishing_aspect: "The window check runs on both create and PATCH and rejects equal endpoints, not just inverted ones: 600/600 is a zero-length access window and must fail. A PATCH that would invert an already valid window must be refused with the stored values left intact, so a later dispatch deadline cannot be computed against a half-applied window."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, access_hours_mode: "RESTRICTED", access_open_minute: 600, access_close_minute: 600 }
              as: NetworkOperator
              captures: { err1: $.data.error_id }
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, access_hours_mode: "RESTRICTED", access_open_minute: 360, access_close_minute: 1320 }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "PATCH /host-sites/${site_id}"
              payload: { access_open_minute: 1320, access_close_minute: 360 }
              as: NetworkOperator
              captures: { err2: $.data.error_id }
          assert:
            - "call 1: HTTP status == 422 and data.error_id == \"ERR_INVALID_ACCESS_WINDOW\" and no HostSite row was created (GET /host-sites total_count 0 at that point)"
            - "call 2: HTTP status == 201 with access_open_minute 360 and access_close_minute 1320"
            - "call 3: HTTP status == 422 and data.error_id == \"ERR_INVALID_ACCESS_WINDOW\""
            - "HostSite.${site_id}.access_open_minute == 360 and access_close_minute == 1320 after the rejected PATCH, and version is unchanged"

      - name: exclusion_request_without_an_eligible_cause_is_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=20]
          - errors[ERR_EXCLUSION_CAUSE_NOT_ELIGIBLE]
          - endpoints[POST /outage-events/{outage_event_id}/exclusion-actions]
        distinguishing_aspect: "NONE is a member of the excluded_cause_claim enum, so it passes schema validation and must be caught by the business rule instead: an exclusion REQUEST carrying NONE is refused with 422 while the identical request carrying VANDALISM succeeds. The refused call must not have moved the outage into EXCLUSION_REVIEW."
