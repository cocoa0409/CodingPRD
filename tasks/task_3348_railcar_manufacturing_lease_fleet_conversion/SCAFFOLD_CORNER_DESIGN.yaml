      - oldest_basis_cents == committed_capital_cents 142000 - disposal_proceeds_net 30000 == 112000,
        so ${oldest} == 112000
      - newest_basis_cents == ceil(1 * max(0, 71000 - 20 * 2500)) == 21000, so ${newest} == 21000
      - drift_cents == 112000 - 21000 == 91000, so ${drift} == 91000
      - 'The divergence is structural: the oldest basis charges the full 30000 proceeds and applies no
