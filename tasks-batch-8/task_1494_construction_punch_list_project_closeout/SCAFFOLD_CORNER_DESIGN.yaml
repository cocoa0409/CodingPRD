  - section: calculations
    instances:
      - name: final_release_amount_equals_held_minus_paid
        claim_type: correct_result
        grounds: [calculations.final_release_amount, calculations.retainage_held_cents]
        distinguishing_aspect: "FINAL amount = retainage_held_cents minus the sum of PAID releases only: with a 500000 REDUCTION already PAID, the FINAL computes to exactly 500000."
        test_recipe:
          setup:
            - "Project with held 1000000; REDUCTION release created while SUBSTANTIALLY_COMPLETE and approved (PAID 500000); project then driven to FINAL_RELEASE_PENDING"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD" }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
