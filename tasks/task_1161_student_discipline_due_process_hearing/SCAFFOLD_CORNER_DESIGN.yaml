            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 2, min_days: 2, max_days: 4 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Occ", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "go1" }
              as: SchoolAdministrator
