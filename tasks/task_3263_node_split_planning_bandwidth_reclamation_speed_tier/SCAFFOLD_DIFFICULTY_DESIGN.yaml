  - rule_id: resource_temporal_overlap
    instances:

      - name: construction_window_half_open_adjacency_vs_overlap
        grounds:
          - state_machines.NodeSplitProject.PERMIT_GRANTED_to_SCHEDULED
          - errors[ERR_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on the franchise-area construction calendar:
          project B's window starting exactly at project A's window_end is accepted
          ([start, end) touch without overlap), while starting one day earlier is
          rejected — adjacency allowed, true overlap rejected, on NodeSplitProject.
