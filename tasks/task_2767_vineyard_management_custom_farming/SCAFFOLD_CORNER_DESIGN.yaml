# SCAFFOLD_CORNER_DESIGN.yaml — task 2767 Vineyard Management & Custom Farming
# §1.9 breadth probe. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented here.
# Logical clock: the server default is exactly 2026-08-01T00:00:00Z and every recipe
# re-asserts it through POST /_clock/set_current_utc so no chain depends on wall time.
# Recurring audit identities (opaque roles): u-vm-1 VineyardManager, u-vm-2 a second
# VineyardManager, u-ag-1 Agronomist, u-app-1 Applicator, u-co-1 ComplianceOfficer,
# u-ctl-1 Controller. Entity-backed roles carry the owning entity id:
# ClientOwner -> Vineyard.id, CrewSupervisor -> LaborCrew.id.
# Instances whose corner is already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# excluded_because: stub and deliberately no test_recipe.
scaffold_corner_design:

  - section: entities
    instances:
      - name: vineyard_create_returns_object_envelope_with_system_fields
        claim_type: creation
        grounds:
          - entities.Vineyard
          - endpoints[POST /vineyards]
          - response_envelope
        distinguishing_aspect: "POST /vineyards with all four required inputs returns HTTP 201, response_type object, and a data body carrying server-minted id/created_at/updated_at plus version 1, block_count 0 and managed_acres 0.0."
        test_recipe:
          setup:
            - "Empty database; the logical clock is set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
          trigger:
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "Vineyard.${v1_id}.name == Ridgecrest Ranch"
            - "Vineyard.${v1_id}.owner_legal_name == Ridgecrest Vineyards LLC"
            - "Vineyard.${v1_id}.ava_region == Paso Robles"
            - "Vineyard.${v1_id}.client_contact_email == ops@ridgecrest.example"
            - "Vineyard.${v1_id}.version == 1"
            - "Vineyard.${v1_id}.block_count == 0"
            - "Vineyard.${v1_id}.managed_acres == 0.0"
            - "data.id, data.created_at and data.updated_at are all non-null"

      - name: vineyard_get_returns_stored_representation_with_recomputed_aggregates
        claim_type: retrieval
        grounds:
          - endpoints[GET /vineyards/{id}]
          - entities.Vineyard.fields.block_count
          - entities.Vineyard.fields.managed_acres
        distinguishing_aspect: "GET /vineyards/{id} after two block creations returns block_count 2 and managed_acres 16.5 (12.5 + 4.0), proving the read surface reflects the create-time cascade rather than the create-time snapshot."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with blocks B-12 (12.5 acres) and B-14 (4.0 acres)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-14", variety: "CHARDONNAY", clone: "FPS-04", rootstock: "ROOTSTOCK_110R", trellis_system: "SPRAWL", planting_year: 2020, vine_spacing_ft: 6.0, row_spacing_ft: 10.0, acres: 4.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
          trigger:
            - call: "GET /vineyards/${v1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { v1_blocks: $.data.block_count, v1_acres: $.data.managed_acres }
          assert:
            - "HTTP status is 200"
            - "Vineyard.${v1_id}.block_count == 2"
            - "Vineyard.${v1_id}.managed_acres == 16.5"
            - "Vineyard.${v1_id}.name == Ridgecrest Ranch"

      - name: block_list_filters_by_vineyard_and_reports_pagination_fields
        claim_type: listing
        grounds:
          - endpoints[GET /blocks]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /blocks?vineyard_id=<v2>&limit=1&offset=0 returns response_type array with exactly one Block element, total_count 2 and has_more true, while the same query with offset 2 returns zero elements and has_more false."
        test_recipe:
          setup:
            - "Vineyard V_A Ridgecrest Ranch with one block B-12; vineyard V_B Salinas Bench with two blocks S-01 and S-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { va_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${va_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Salinas Bench", owner_legal_name: "Salinas Bench Farms LLC", ava_region: "Monterey", client_contact_email: "ops@salinas.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { vb_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${vb_id}", block_code: "S-01", variety: "PINOT_NOIR", clone: "FPS-23", rootstock: "ROOTSTOCK_SO4", trellis_system: "VSP", planting_year: 2016, vine_spacing_ft: 4.0, row_spacing_ft: 8.0, acres: 6.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /blocks"
              payload: { vineyard_id: "${vb_id}", block_code: "S-02", variety: "CHARDONNAY", clone: "FPS-04", rootstock: "ROOTSTOCK_SO4", trellis_system: "VSP", planting_year: 2017, vine_spacing_ft: 4.0, row_spacing_ft: 8.0, acres: 3.0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
          trigger:
            - call: "GET /blocks"
              payload: { vineyard_id: "${vb_id}", limit: 1, offset: 0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "GET /blocks"
              payload: { vineyard_id: "${vb_id}", limit: 1, offset: 2 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "GET /blocks"
              payload: { vineyard_id: "${va_id}" }
              as: VineyardManager
              as_user_id: "u-vm-1"
          assert:
            - "the first list call returns response_type == array with exactly 1 element, total_count == 2, limit == 1, offset == 0, has_more == true"
            - "the second list call returns 0 elements, total_count == 2, offset == 2, has_more == false"
            - "the third list call returns exactly 1 element whose block_code == B-12 (the other vineyard's blocks are excluded)"
            - "no element returned for vineyard_id ${vb_id} has block_code == B-12"

      - name: block_get_with_unknown_id_returns_block_not_found
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors[ERR_BLOCK_NOT_FOUND]
          - endpoints[GET /blocks/{id}]
        distinguishing_aspect: "GET /blocks/{id} for an id that was never minted returns ERR_BLOCK_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch exists with no blocks at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "GET /blocks/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { nf_error: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "error_id == ERR_BLOCK_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: block_create_missing_variety_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
          - entities.Block.fields.variety
        distinguishing_aspect: "POST /blocks omitting the required input field variety returns ERR_INVALID_REQUEST with HTTP 400 and creates no Block, leaving Vineyard.block_count at 0."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch exists with block_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { req_error: $.data.error_id }
            - call: "GET /vineyards/${v1_id}"
              payload: {}
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_blocks: $.data.block_count }
          assert:
            - "HTTP status is 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "Vineyard.${v1_id}.block_count == 0"
            - "Vineyard.${v1_id}.managed_acres == 0.0"

      - name: crew_create_omitting_crew_status_defaults_to_active
        claim_type: defaults
        grounds:
          - entities.LaborCrew.fields.crew_status
          - endpoints[POST /crews]
        distinguishing_aspect: "POST /crews without the optional crew_status field stores crew_status ACTIVE (the declared default) and scheduled_work_order_count 0, so the crew is immediately bookable."
        test_recipe:
          setup:
            - "Empty database; the logical clock is set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
          trigger:
            - call: "POST /crews"
              payload: { crew_name: "Cuadrilla Norte", pay_structure: "PIECE_RATE", crew_size: 12, base_hourly_rate: 19.50, piece_rate_per_vine: 0.65, vines_per_hour_standard: 45, task_capabilities: ["PRUNING", "SUCKERING", "LEAFING", "HARVEST"], pest_certified: false }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { cr1_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "LaborCrew.${cr1_id}.crew_status == ACTIVE"
            - "LaborCrew.${cr1_id}.scheduled_work_order_count == 0"
            - "LaborCrew.${cr1_id}.pest_certified == false"
            - "LaborCrew.${cr1_id}.version == 1"

      - name: block_vine_geometry_is_computed_and_floored_from_spacing
        claim_type: computed_fields
        grounds:
          - calculations.block_vine_geometry
          - entities.Block.fields.vines_per_acre
          - entities.Block.fields.vine_count
        distinguishing_aspect: "A 7.0 x 9.0 ft block on 3.6 acres stores vines_per_acre 691 = floor(43560 / 63) and vine_count 2487 = floor(691 * 3.6), so both floors are taken separately rather than once on the product."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-16", variety: "SYRAH", clone: "FPS-07", rootstock: "RIPARIA_GLOIRE", trellis_system: "QUADRILATERAL_CORDON", planting_year: 2019, vine_spacing_ft: 7.0, row_spacing_ft: 9.0, acres: 3.6 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b3_id: $.data.id, b3_vpa: $.data.vines_per_acre, b3_count: $.data.vine_count }
          assert:
            - "Block.${b3_id}.vines_per_acre == 691"
            - "Block.${b3_id}.vine_count == 2487"
            - "Block.${b3_id}.farming_status == ESTABLISHING"
            - "Block.${b3_id}.contract_id is null"
            - "Block.${b3_id}.contracted_acres is null"
            - "Block.${b3_id}.version == 1"

      - name: block_create_extra_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Block.fields.farming_status
          - entities.Block.fields.contract_id
          - validations[priority=30]
        distinguishing_aspect: "A POST /blocks body that also carries id, version, farming_status and contract_id is refused with ERR_INVALID_REQUEST (no unknown fields are accepted), so client-supplied system fields can never seed a block into BEARING or pre-enrolled."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch exists with block_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5, farming_status: "BEARING", version: 9 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { extra_error: $.data.error_id }
            - call: "GET /vineyards/${v1_id}"
              payload: {}
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_blocks: $.data.block_count }
          assert:
            - "HTTP status is 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "Vineyard.${v1_id}.block_count == 0"

      - name: block_create_invalid_enum_variety_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=30]
          - entities.Block.fields.variety
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "variety MERLOT is outside the declared enum {CABERNET_SAUVIGNON, CHARDONNAY, PINOT_NOIR, ZINFANDEL, SYRAH} and is refused with ERR_INVALID_REQUEST at HTTP 400 before any geometry is computed."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch exists with block_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "MERLOT", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { enum_error: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "Vineyard.${v1_id}.block_count == 0"

      - name: pest_observation_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.PestObservation
          - endpoints[POST /blocks/{id}/pest-observations]
          - endpoints[GET /blocks/{id}/pest-observations]
        distinguishing_aspect: "PestObservation is declared common_fields: false — the create response and the sub-resource listing both expose observed_at, scout_user_id, action_threshold_pct and exceeds_threshold but no version field, and §1.5 declares no update endpoint for it."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 (12.5 acres)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /blocks/${b1_id}/pest-observations"
              payload: { pest_code: "VINE_MEALYBUG", incidence_pct: 3.0, severity_index: 2, scouting_note: "Crawlers under bark on rows 4-9" }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { po_id: $.data.id }
            - call: "GET /blocks/${b1_id}/pest-observations"
              payload: { limit: 10, offset: 0 }
              as: Agronomist
              as_user_id: "u-ag-1"
          assert:
            - "HTTP status is 201 on create"
            - "PestObservation.${po_id}.observed_at == 2026-08-01T00:00:00Z"
            - "PestObservation.${po_id}.scout_user_id == u-ag-1"
            - "PestObservation.${po_id}.action_threshold_pct == 2.0"
            - "PestObservation.${po_id}.exceeds_threshold == true"
            - "neither the create response nor the listed element contains a version key"
            - "the listing returns exactly 1 element with total_count == 1 and has_more == false"

      - name: yield_estimate_under_unknown_block_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=40]
          - errors[ERR_BLOCK_NOT_FOUND]
          - endpoints[POST /blocks/{id}/yield-estimates]
        distinguishing_aspect: "The sub-resource create resolves its path parent first: POST /blocks/{id}/yield-estimates under an id that was never minted returns ERR_BLOCK_NOT_FOUND at HTTP 404, ahead of the method-conditional field check at priority 32."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12; the id used in the trigger belongs to no Block."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /blocks/22222222-2222-4222-8222-222222222222/yield-estimates"
              payload: { method: "CLUSTER_COUNT", sample_date: "2026-08-25", avg_clusters_per_vine: 32, avg_cluster_weight_lb: 0.42 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { parent_error: $.data.error_id }
            - call: "GET /blocks/${b1_id}/yield-estimates"
              payload: { limit: 10, offset: 0 }
              as: Agronomist
              as_user_id: "u-ag-1"
          assert:
            - "HTTP status is 404"
            - "error_id == ERR_BLOCK_NOT_FOUND"
            - "GET /blocks/${b1_id}/yield-estimates returns 0 elements with total_count == 0"
            - "Block.${b1_id}.governing_estimate_tons == 0.0"
            - "Block.${b1_id}.harvest_posture == NOT_ESTIMATED"

      - name: enrolled_block_is_reverse_reachable_from_its_contract
        claim_type: graph
        grounds:
          - entities.Block.fields.contract_id
          - endpoints[POST /contracts/{id}/enroll-block]
          - endpoints[GET /blocks]
