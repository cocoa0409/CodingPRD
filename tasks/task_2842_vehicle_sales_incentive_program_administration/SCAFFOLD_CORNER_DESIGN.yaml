            - "${err_stale} == ERR_STALE_OBJECTIVE_VERSION (412) — the guarded field is the objective's version, even though the addressed resource is the protest"
            - "${prot_status_mid} == OPEN and ${prot_units_mid} is null — the refused resolution left the protest untouched, so the manager can retry"
            - "${ov2} == ${ov1} + 1 and ${achieved2} == 2 with ${att2} == 5000 (floor(2 * 10000 / 4)) — the objective moved exactly once, and its objective_units ${units2} is still 4"
