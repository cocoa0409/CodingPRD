            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234643", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00143", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DAMAGED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/assess-damage", payload: { repairable: true, contents_damage_cents: 0 }, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /baggage/repair-orders", payload: { report_id: "${rpt}", vendor_id: "${vnd}", intake_date: "2026-08-05", promised_date: "2026-08-05", purchase_price_cents: 100000, purchase_date: "2024-08-01", repair_estimate_cents: 40000 }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPAIR_WINDOW_INVALID"
            - "HTTP status == 422"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: station_summary_computed_read
        claim_type: computed_read
        grounds: ['calculations.station_irregularity_summary', 'endpoints["GET /baggage/stations/{id}/irregularity-summary"]']
        distinguishing_aspect: "After a full lifecycle closure attributed to JFK with root_cause MISCONNECT, the summary returns open_report_count 0, mishandled_report_count 1, by_root_cause {MISCONNECT: 1}, recovered_bag_count 0, and rate 1000 x 1 / 100000 = 10.0."
        test_recipe:
          setup:
            - "station JFK with bags_handled_total 100000; carrier AA; passenger; international bag"
            - "DELAYED report closed end-to-end (lost -> assess 100000 -> offer MISCONNECT@JFK -> accept -> payment -> mark-paid)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 100000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234651", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00151", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/reports/${rpt}/assess-loss", payload: { contents_loss_cents: 100000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "MISCONNECT", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/accept-settlement", payload: {}, as: Passenger, as_user_id: "${pax}", captures: { rpt_v: $.data.version } }
            - { call: "POST /baggage/reports/${rpt}/settlement-payments", payload: { expected_report_version: "${rpt_v}" }, as: ClaimsAdjuster, captures: { pay: $.data.id } }
            - { call: "POST /baggage/settlement-payments/${pay}/mark-paid", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "GET /baggage/stations/${stn}/irregularity-summary", as: ClaimsAdjuster }
          assert:
            - "summary.open_report_count == 0"
            - "summary.mishandled_report_count == 1"
            - "summary.by_root_cause == { MISCONNECT: 1 }"
            - "summary.recovered_bag_count == 0"
            - "summary.mishandled_rate_per_1000 == 10.0"
            - "IrregularityReport.${rpt}.status == CLOSED"

      - name: tracing_events_reverse_reachable_by_report
        claim_type: action_endpoint
        grounds: ['endpoints["GET /baggage/tracing-events"]', 'entities.TracingEvent.fields.report_id']
        distinguishing_aspect: "The FK reverse-reachability list returns exactly the events of one report: after FORWARDED + LOCATED on report A and one FORWARDED on report B, filtering by report A yields 2 events."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; two bags/reports; report A has FORWARDED and LOCATED events; report B has one FORWARDED event"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234652", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_a: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234653", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_b: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00152", passenger_id: "${pax}", bag_tag_id: "${bag_a}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_a: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00153", passenger_id: "${pax}", bag_tag_id: "${bag_b}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_b: $.data.id } }
            - { call: "POST /baggage/reports/${rpt_a}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "FORWARDED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/reports/${rpt_a}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "LOCATED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/reports/${rpt_b}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "FORWARDED" }, as: BaggageServiceAgent }
          trigger:
            - { call: "GET /baggage/tracing-events", payload: { report_id: "${rpt_a}" }, as: BaggageServiceAgent }
          assert:
            - "Response data is an array of exactly 2 TracingEvents, both with report_id == ${rpt_a}"
            - "Events are ordered FORWARDED then LOCATED by created_at ascending"

      - name: response_envelope_shape_success_and_error
        claim_type: response_envelope
        grounds: ['response_envelope']
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id, meta.api_request_timestamp, response_type 'object', and data; an error has response_type 'error' and data.error_id/data.message."
        test_recipe:
          setup: ["clock set"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "GET /baggage/stations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Success body: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data.id == ${stn}"
            - "Error body: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"

