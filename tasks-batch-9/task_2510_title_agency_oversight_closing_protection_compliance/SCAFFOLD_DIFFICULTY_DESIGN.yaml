              payload: { to_state: "ISSUED", rationale: "Standard settlement" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { cpl_status_final: "$.data.status", cpl_approved: "$.data.approved_coverage_cents" }
          assert:
            - "${cpl_status_initial} == \"REQUESTED\" and ${ap_status_lapsed} == \"LAPSED\""
            - "trigger[0] returns HTTP 422 with data.error_id == \"ERR_NO_ACTIVE_APPOINTMENT_IN_STATE\" and the letter stays REQUESTED"
            - "${ap_status_restored} == \"ACTIVE\""
            - "trigger[2] returns HTTP 200 with ${cpl_status_final} == \"ISSUED\" and ${cpl_approved} == 30000000"
