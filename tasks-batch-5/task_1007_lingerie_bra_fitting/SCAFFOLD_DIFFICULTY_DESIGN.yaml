        grounds:
          - validations[priority=11]
          - state_machines.Exchange.REQUESTED_to_APPROVED
          - errors[ERR_EXCHANGE_WINDOW_EXPIRED]
        distinguishing_aspect: "Numeric threshold on days-since-fulfillment: at exactly EXCHANGE_WINDOW_DAYS (30, clock 2026-07-31 vs fulfilled 2026-07-01) the approve is allowed (<=), not rejected; endpoint is exchange approve."
        test_recipe:
          setup:
            - "A fulfilled SEALED EVERYDAY_BRA line (fulfilled_at 2026-07-01); clock advanced to 2026-07-31 (exactly 30 days)."
