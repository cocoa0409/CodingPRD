  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # ---- Stock boundary: usage == quantity_on_hand succeeds; +1 rejected
      - name: boundary_stock_exact_quantity_succeeds_plus_one_rejected
        grounds:
          - calculations.truck_stock_balance
          - validations[priority=13]
          - errors[ERR_INSUFFICIENT_STOCK]
          - entities.TruckStockItem.fields.quantity_on_hand
        distinguishing_aspect: |
          A material usage of EXACTLY quantity_on_hand (5) leaves the truck at 0 and succeeds,
          while a usage of quantity_on_hand+1 (6) is rejected with ERR_INSUFFICIENT_STOCK — an
          integer-count boundary on the truck_stock_balance metric, reached via POST /v1/material-usages.
        test_recipe:
          setup:
            - "MASTER tech zone '700' with a truck-stock item of quantity_on_hand=5 for a SKU."
            - "An IN_PROGRESS OUTLET job owned by a zone-700 customer, tech arrived on site."
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "BP1 Cust", email: "bp1@x.com", service_zip: "70001", phone: "555" }
