# =============================================================================
# SCAFFOLD — task_2424_high_pressure_processing_tolling_service
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================
scenario: |
  Generate task harder than expert level!

  2424. High-Pressure Processing Tolling Service (HPP tolling facility): customer product qualification with pressure/hold-time validation and package suitability, scheduling of vessel cycles by product family to avoid cross-contamination, incoming pallet receipt, cold storage and lot segregation, cycle log capture as a critical control point record with deviation handling, package failure and leaker rate monitoring with customer chargeback rules, tolling fee by cycle time and vessel utilization, outbound cold-chain release and hold-for-test protocols, capacity allocation contracts and seasonal peaks

domain_name: hpp-tolling-service
api_prefix: "/"          # flat top-level collections; no shared path prefix

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Lot <-> VesselCycle is many-to-many through the CycleLoad junction;
  # ProductQualification.supersedes_qualification_id is self-referential;
  # ChargebackLine points at three different aggregates.

  state_machine_shape: parallel
  # Lot carries two independent dimensions (custody_state x release_state);
  # ProductQualification is cyclic (CHANGES_REQUESTED -> SUBMITTED revision
  # rounds); CapacityContract is cyclic (ACTIVE <-> EXHAUSTED); VesselCycle is
  # branching fork-join (RUNNING -> {COMPLETED_CLEAN, COMPLETED_DEVIATED} ->
  # DISPOSITIONED with divergent side-effect sets); ColdRoom.capacity_state is
  # a derived posture that gates receipt.

  relationship_patterns:
    - one_to_many
    - many_to_many          # CycleLoad junction (Lot x VesselCycle)
    - self_referential      # ProductQualification.supersedes_qualification_id
    - cross_aggregate       # ChargebackLine -> Customer / CycleLoad / CapacityContract / Deviation

  role_model: segregation_of_duties
  # The QualityManager who adjudicates a deviation may not be the operator who
  # signed the CCP cycle log, and the QualityManager who releases a lot may not
  # be the one who adjudicated that lot's deviation (four-eyes).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 48 endpoints (20 of them read paths mandated by FK
  # reverse-reachability) / 67 error codes / 12 calculations / 8 state machines /
  # 3 OCC rules / 75 ordered validation rows / 5 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Customer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the tolling customer (brand owner)
        constraints: "1..120 chars"
      - name: code
        type: string
        source: input
        description: short customer code used on pallet paperwork
        constraints: "unique across Customer; ^[A-Z0-9_]{3,12}$"
      - name: billing_email
        type: string
        source: input
        description: invoice / chargeback notification address
        constraints: "must contain '@'"
      - name: trailing_leaker_ppm
        type: integer
        source: computed
        description: trailing 90-day package-leaker rate in parts per million, recomputed only by POST /operations/day-close per calculations.customer_package_failure_risk variant TRAILING_90D_CUSTOMER
        default: 0
      - name: chargeback_balance_cents
        type: integer
        source: computed
        description: sum of ChargebackLine.amount_cents for this customer with status == PENDING (calculations.customer_chargeback_balance)
        default: 0

  - name: ProductFamily
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: family_code
        type: string
        source: input
        description: family identifier, e.g. RTE_GUAC
        constraints: "unique across ProductFamily"
      - name: cross_contamination_group
        type: enum
        source: input
        description: sanitation group used for vessel cycle segregation
        constraints: "one of {RTE_PRODUCE, RAW_PROTEIN, DAIRY, JUICE, PET_FOOD}"
      - name: cleanout_minutes
        type: integer
        source: input
        description: vessel cleanout time required when the neighbouring cycle belongs to a different cross_contamination_group
        constraints: ">= 0"
      - name: max_receipt_temp_c
        type: number
        source: input
        description: highest accepted inbound carrier/pulp temperature in Celsius
      - name: max_outbound_temp_c
        type: number
        source: input
        description: highest accepted outbound truck temperature in Celsius
      - name: requires_dedicated_cycle
        type: boolean
        source: input
        description: when true, every CycleLoad on a cycle of this family must belong to the same Customer
        default: false

  - name: Vessel
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: vessel_code
        type: string
        source: input
        description: vessel identifier, e.g. HPP-1
        constraints: "unique across Vessel"
      - name: chamber_volume_liters
        type: integer
        source: input
        description: chamber working volume
        constraints: "> 0"
      - name: max_pressure_mpa
        type: number
        source: input
        description: mechanical pressure ceiling in MPa
      - name: pump_ramp_rate_mpa_per_sec
        type: number
        source: input
        description: intensifier ramp rate used to derive come-up time
        constraints: "> 0"
      - name: decompression_seconds
        type: integer
        source: input
        description: fixed decompression time per cycle
        constraints: ">= 0"
      - name: basket_count
        type: integer
        source: input
        description: number of carrier baskets the chamber holds; denominator of utilization_pct
        constraints: "> 0"
      - name: hourly_operating_cost_cents
        type: integer
        source: input
        description: internal operating cost, reported only
      - name: status
        type: enum
        source: system
        description: "AVAILABLE on create; IN_USE while a cycle runs; MAINTENANCE/DOWN set by PATCH /vessels/{id}"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, IN_USE, MAINTENANCE, DOWN}"
      - name: cycles_run_count
        type: integer
        source: computed
        description: count of VesselCycle rows on this vessel that have reached COMPLETED_CLEAN or COMPLETED_DEVIATED
        default: 0

  - name: ColdRoom
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: room_code
        type: string
        source: input
        description: cold room identifier
        constraints: "unique across ColdRoom"
      - name: capacity_pallets
        type: integer
        source: input
        description: pallet positions in the room
        constraints: "> 0"
      - name: setpoint_c
        type: number
        source: input
        description: room setpoint in Celsius
      - name: allowed_family_groups
        type: array
        source: input
        description: cross_contamination_group values this room may store (lot segregation)
        constraints: "non-empty array of {RTE_PRODUCE, RAW_PROTEIN, DAIRY, JUICE, PET_FOOD}"
      - name: occupied_pallets
        type: integer
        source: computed
        description: count of Lot rows in this room with custody_state IN {IN_COLD_STORAGE, IN_VESSEL, TREATED}
        default: 0
      - name: capacity_state
        type: enum
        source: computed
        description: "derived posture: AT_CAPACITY when occupied_pallets >= capacity_pallets, else NORMAL; gates POST /lots"
        default: NORMAL
        constraints: "one of {NORMAL, AT_CAPACITY}"

  - name: ProductQualification
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; owner of the SKU
      - name: product_family_id
        type: string
        source: input
        description: FK -> ProductFamily.id; drives sanitation group and cold-chain limits
      - name: supersedes_qualification_id
        type: string
        source: input
        description: FK -> ProductQualification.id; optional self-reference, the QUALIFIED record this revision replaces
        default: null
      - name: sku_code
        type: string
        source: input
        description: customer SKU identifier
        constraints: "unique per (customer_id, sku_code, version_label)"
      - name: version_label
        type: string
        source: input
        description: customer-supplied revision label, e.g. REV-A
      - name: pressure_mpa
        type: number
        source: input
        description: qualified process pressure in MPa
        constraints: "> 0 and <= 600"
      - name: hold_time_seconds
        type: integer
        source: input
        description: qualified hold time at pressure
        constraints: "> 0"
      - name: max_water_temp_c
        type: number
        source: input
        description: highest permitted chamber water temperature during the cycle
      - name: package_format
        type: enum
        source: input
        description: primary package format
        constraints: "one of {POUCH, TRAY_SEALED, RIGID_BOTTLE, GLASS}"
      - name: package_burst_pressure_mpa
        type: number
        source: input
        description: measured package burst pressure
      - name: film_thickness_micron
        type: integer
        source: input
        description: film/lidding thickness
        constraints: "> 0"
      - name: target_log_reduction
        type: number
        source: input
        description: required log reduction of the target organism
      - name: package_suitability_score
        type: number
        source: computed
        description: weighted package suitability score, 2 decimals (calculations.qualification_package_suitability_score)
      - name: validation_run_acceptable_count
        type: integer
        source: computed
        description: count of child ValidationRun rows with run_verdict == ACCEPTABLE
        default: 0
      - name: revision_round
        type: integer
        source: system
        description: number of completed CHANGES_REQUESTED -> SUBMITTED loops
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle state, see state_machines.ProductQualification
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_VALIDATION, CHANGES_REQUESTED, QUALIFIED, EXPIRED, SUPERSEDED}"
      - name: qualified_at
        type: datetime
        source: system
        description: logical-clock instant of the QUALIFY decision
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: qualified_at + QUALIFICATION_VALID_DAYS (365 days)
        default: null

  - name: ValidationRun
    parent: ProductQualification
    common_fields: false
    entity_kind: event
    fields:
      - name: qualification_id
        type: string
        source: system
        description: FK -> ProductQualification.id; taken from the path
      - name: measured_pressure_mpa
        type: number
        source: input
        description: pressure achieved during the validation run
      - name: measured_hold_time_seconds
        type: integer
        source: input
        description: hold time achieved during the validation run
      - name: achieved_log_reduction
        type: number
        source: input
        description: log reduction measured by the lab
      - name: package_integrity_result
        type: enum
        source: input
        description: package integrity outcome for the run
        constraints: "one of {PASS, MARGINAL, FAIL}"
      - name: units_tested
        type: integer
        source: input
        description: units in the validation sample
        constraints: "> 0"
      - name: leaker_count
        type: integer
        source: input
        description: leaking units found in the sample
        constraints: ">= 0 and <= units_tested"
      - name: run_verdict
        type: enum
        source: computed
        description: ACCEPTABLE when package_integrity_result == PASS and measured_pressure_mpa >= qualification.pressure_mpa and measured_hold_time_seconds >= qualification.hold_time_seconds and achieved_log_reduction >= qualification.target_log_reduction; otherwise UNACCEPTABLE
        constraints: "one of {ACCEPTABLE, UNACCEPTABLE}"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityManager who logged the run

  - name: CapacityContract
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; the committing customer
      - name: season_code
        type: string
        source: input
        description: season label, e.g. FY26
        constraints: "unique per (customer_id, season_code)"
      - name: window_start
        type: datetime
        source: input
        description: first instant of the contract window (inclusive)
      - name: window_end
        type: datetime
        source: input
        description: last instant of the contract window (inclusive)
        constraints: "must be > window_start"
      - name: committed_slots
        type: integer
        source: input
        description: number of cycle slots the customer commits to; one CycleLoad consumes exactly one slot
        constraints: "> 0"
      - name: slot_take_or_pay_cents
        type: integer
        source: input
        description: price charged per unused slot below the minimum take at close
        constraints: ">= 0"
      - name: priority_rank
        type: integer
        source: input
        description: 1 is highest; tie-break for capacity disputes is priority_rank ASC then created_at ASC
        constraints: ">= 1"
      - name: peak_window_start
        type: datetime
        source: input
        description: first instant of the seasonal peak sub-window (inclusive)
      - name: peak_window_end
        type: datetime
        source: input
        description: last instant of the seasonal peak sub-window (inclusive)
      - name: peak_multiplier
        type: number
        source: input
        description: multiplier applied to a load's allocated fee when the cycle's scheduled_start falls inside the peak sub-window
        constraints: ">= 1.0"
      - name: reserved_slots
        type: integer
        source: computed
        description: count of CycleLoad rows with contract_id == this and parent VesselCycle.state IN {SCHEDULED, LOADED, RUNNING} and CycleLoad.disposition_state == PENDING
        default: 0
      - name: consumed_slots
        type: integer
        source: computed
        description: count of CycleLoad rows with contract_id == this and CycleLoad.disposition_state IN {ALLOCATED, REPROCESSED}
        default: 0
      - name: available_slots
        type: integer
        source: computed
        description: committed_slots - reserved_slots - consumed_slots (calculations.contract_slot_ledger)
      - name: shortfall_slots
        type: integer
        source: computed
        description: unused slots below the minimum take, computed once at close (calculations.contract_take_or_pay_shortfall)
        default: 0
      - name: take_or_pay_cents
        type: integer
        source: computed
        description: shortfall_slots * slot_take_or_pay_cents, computed once at close
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle state, see state_machines.CapacityContract
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, EXHAUSTED, CLOSED}"

  - name: Lot
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; owner of the pallet
      - name: qualification_id
        type: string
        source: input
        description: FK -> ProductQualification.id; the process recipe this pallet must be treated under
      - name: cold_room_id
        type: string
        source: input
        description: FK -> ColdRoom.id; storage room requested at receipt
      - name: pallet_ref
        type: string
        source: input
        description: carrier pallet reference on the receiving paperwork
        constraints: "unique per customer_id"
      - name: unit_count
        type: integer
        source: input
        description: saleable units on the pallet
        constraints: "> 0"
      - name: gross_weight_kg
        type: number
        source: input
        description: pallet gross weight
      - name: carrier_temp_c
        type: number
        source: input
        description: temperature recorded on the carrier's trailer at the door
      - name: ship_by
        type: datetime
        source: input
        description: customer-declared latest outbound date; end of the cold-room occupancy interval
      - name: pulp_temp_c
        type: number
        source: system
        description: product pulp temperature recorded at inspection
        default: null
      - name: segregation_group
        type: enum
        source: computed
        description: cross_contamination_group of the ProductFamily behind qualification_id, snapshotted at receipt
        constraints: "one of {RTE_PRODUCE, RAW_PROTEIN, DAIRY, JUICE, PET_FOOD}"
      - name: custody_state
        type: enum
        source: system
        description: physical custody dimension, see state_machines.Lot.custody_state
        default: AT_DOCK
        constraints: "one of {AT_DOCK, IN_COLD_STORAGE, IN_VESSEL, TREATED, SHIPPED, REJECTED_AT_DOCK, DISPOSED}"
      - name: release_state
        type: enum
        source: system
        description: quality release dimension, evolves independently of custody_state, see state_machines.Lot.release_state
        default: NOT_RELEASED
        constraints: "one of {NOT_RELEASED, ON_HOLD_FOR_TEST, RELEASED, REJECTED}"
      - name: hold_reason
        type: string
        source: system
        description: reason recorded when release_state becomes ON_HOLD_FOR_TEST
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityManager who set release_state to RELEASED
        default: null
      - name: units_untreated
        type: integer
        source: computed
        description: units still awaiting treatment; set to unit_count at receipt (POST /lots) so the unit ledger balances from the first instant
        default: 0
      - name: units_in_vessel
        type: integer
        source: computed
        description: units currently committed to a RUNNING cycle
        default: 0
      - name: units_treated
        type: integer
        source: computed
        description: units that completed a cycle
        default: 0
      - name: units_disposed
        type: integer
        source: computed
        description: units written off by a rejected deviation or a REJECT release decision
        default: 0

  - name: VesselCycle
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: vessel_id
        type: string
        source: input
        description: FK -> Vessel.id; the machine that will run the cycle
      - name: product_family_id
        type: string
        source: input
        description: FK -> ProductFamily.id; the only family whose lots may load onto this cycle
      - name: scheduled_start
        type: datetime
        source: input
        description: planned first instant of vessel occupancy (inclusive)
      - name: scheduled_end
        type: datetime
        source: computed
        description: scheduled_start + estimated_cycle_seconds; occupancy interval is half-open [scheduled_start, scheduled_end)
      - name: target_pressure_mpa
        type: number
        source: input
        description: pressure the cycle will be run at
        constraints: "> 0 and <= vessel.max_pressure_mpa"
      - name: target_hold_seconds
        type: integer
        source: input
        description: hold time the cycle will be run at
        constraints: "> 0"
      - name: baskets_used_total
        type: integer
        source: computed
        description: sum of CycleLoad.baskets_used over loads with disposition_state != VOIDED
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: round_half_up(100 * baskets_used_total / vessel.basket_count, 2)
        default: 0.0
      - name: estimated_cycle_seconds
        type: integer
        source: computed
        description: ESTIMATED variant of calculations.cycle_time_and_tolling_fee
      - name: estimated_tolling_fee_cents
        type: integer
        source: computed
        description: net tolling fee under the ESTIMATED variant; recomputed on create and on every load create
      - name: actual_cycle_seconds
        type: integer
        source: computed
        description: ACTUAL variant cycle time, derived from the CycleLog
        default: null
      - name: actual_tolling_fee_cents
        type: integer
        source: computed
        description: net tolling fee under the ACTUAL variant, frozen when the cycle reaches DISPOSITIONED
        default: null
      - name: state
        type: enum
        source: system
        description: lifecycle state, see state_machines.VesselCycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, LOADED, RUNNING, COMPLETED_CLEAN, COMPLETED_DEVIATED, DISPOSITIONED, ABORTED, CANCELLED}"
      - name: started_at
        type: datetime
        source: system
        description: logical-clock instant of POST /vessel-cycles/{id}/start
        default: null
      - name: dispositioned_at
        type: datetime
        source: system
        description: logical-clock instant the cycle reached DISPOSITIONED; window key for the trailing leaker rate
        default: null

  - name: CycleLoad
    parent: VesselCycle
    common_fields: true
    entity_kind: resource
    fields:
      - name: cycle_id
        type: string
        source: system
        description: FK -> VesselCycle.id; taken from the path
      - name: lot_id
        type: string
        source: input
        description: FK -> Lot.id; the pallet contributing units to this cycle
      - name: contract_id
        type: string
        source: input
        description: FK -> CapacityContract.id; the contract whose slot this load consumes
      - name: baskets_used
        type: integer
        source: input
        description: carrier baskets this load occupies; allocation weight for the cycle fee
        constraints: "> 0"
      - name: units_loaded
        type: integer
        source: input
        description: units moved from the lot into the chamber
        constraints: "> 0 and <= lot.units_untreated"
      - name: allocated_fee_cents
        type: integer
        source: computed
        description: this load's share of the cycle's net tolling fee (calculations.cycle_fee_allocation_across_loads)
        default: null
      - name: units_inspected
        type: integer
        source: input
        description: units examined during post-cycle package inspection
        default: null
      - name: leaker_units
        type: integer
        source: input
        description: leaking units found during post-cycle package inspection
        default: null
      - name: leaker_ppm
        type: integer
        source: computed
        description: INSTANTANEOUS_LOAD variant of calculations.customer_package_failure_risk
        default: null
      - name: chargeback_party
        type: enum
        source: computed
        description: party bearing the package failure cost, decided at inspection
        default: null
        constraints: "one of {CUSTOMER, FACILITY}"
      - name: chargeback_cents
        type: integer
        source: computed
        description: amount charged back for this load's package failures (calculations.load_package_chargeback_amount); 0 when chargeback_party == FACILITY
        default: 0
      - name: inspection_state
        type: enum
        source: system
        description: PENDING_INSPECTION until POST /cycle-loads/{id}/inspection records counts
        default: PENDING_INSPECTION
        constraints: "one of {PENDING_INSPECTION, INSPECTED}"
      - name: disposition_state
        type: enum
        source: system
        description: PENDING on create; ALLOCATED at cycle disposition; VOIDED when the cycle is cancelled or aborted; REJECTED / REPROCESSED by deviation adjudication
        default: PENDING
        constraints: "one of {PENDING, ALLOCATED, VOIDED, REJECTED, REPROCESSED}"

  - name: CycleLog
    parent: VesselCycle
    common_fields: false
    entity_kind: event
    fields:
      - name: cycle_id
        type: string
        source: system
        description: FK -> VesselCycle.id; taken from the path
      - name: actual_pressure_mpa
        type: number
        source: input
        description: pressure held, from the chart recorder — critical control point value
      - name: actual_hold_seconds
        type: integer
        source: input
        description: seconds held at pressure — critical control point value
        constraints: "> 0"
      - name: come_up_seconds
        type: integer
        source: input
        description: measured come-up time to target pressure
        constraints: "> 0"
      - name: water_temp_c
        type: number
        source: input
        description: chamber water temperature during the hold
      - name: actual_cycle_seconds
        type: integer
        source: computed
        description: LOAD_UNLOAD_SECONDS + come_up_seconds + actual_hold_seconds + vessel.decompression_seconds
      - name: ccp_verdict
        type: enum
        source: computed
        description: WITHIN_LIMITS or DEVIATION per calculations.ccp_verdict_and_deviation_severity
        constraints: "one of {WITHIN_LIMITS, DEVIATION}"
      - name: deviation_flags
        type: array
        source: computed
        description: subset of {UNDER_PRESSURE, SHORT_HOLD, TEMP_EXCURSION} that failed, ordered UNDER_PRESSURE, SHORT_HOLD, TEMP_EXCURSION
        default: []
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlantOperator who signed the CCP record; segregation-of-duties key
      - name: logged_at
        type: datetime
        source: system
        description: logical-clock instant the record was captured

  - name: Deviation
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: cycle_id
        type: string
        source: system
        description: FK -> VesselCycle.id; the cycle whose control points or packages failed
      - name: cycle_log_id
        type: string
        source: system
        description: FK -> CycleLog.id; the CCP record that raised the deviation, null for package-failure deviations
        default: null
      - name: cycle_load_id
        type: string
        source: system
        description: FK -> CycleLoad.id; set only for PACKAGE_FAILURE_RATE deviations
        default: null
      - name: deviation_type
        type: enum
        source: computed
        description: category derived from the raising event
        constraints: "one of {UNDER_PRESSURE, SHORT_HOLD, TEMP_EXCURSION, PACKAGE_FAILURE_RATE}"
      - name: severity
        type: enum
        source: computed
        description: CRITICAL when the worst shortfall percentage >= CRITICAL_SHORTFALL_PCT, else MAJOR (calculations.ccp_verdict_and_deviation_severity)
        constraints: "one of {MAJOR, CRITICAL}"
      - name: worst_shortfall_pct
        type: number
        source: computed
        description: max of pressure_shortfall_pct and hold_shortfall_pct, 2 decimals; 0.00 for PACKAGE_FAILURE_RATE
        default: 0.0
      - name: status
        type: enum
        source: system
        description: lifecycle state, see state_machines.Deviation
        default: OPEN
        constraints: "one of {OPEN, ADJUDICATED_ACCEPT, ADJUDICATED_REPROCESS, ADJUDICATED_REJECT}"
      - name: root_cause_code
        type: string
        source: input
        description: root cause recorded at adjudication; prefix EQUIP_ means facility fault, PKG_ means customer package fault
        default: null
        constraints: "^(EQUIP|PKG|OPS)_[A-Z0-9_]{2,20}$"
      - name: chargeback_party
        type: enum
        source: computed
        description: CUSTOMER when root_cause_code starts with PKG_, otherwise FACILITY
        default: null
        constraints: "one of {CUSTOMER, FACILITY}"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the adjudicating QualityManager; four-eyes key for lot release
        default: null
      - name: adjudicated_at
        type: datetime
        source: system
        description: logical-clock instant of adjudication
        default: null

  - name: ChargebackLine
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: customer_id
        type: string
        source: system
        description: FK -> Customer.id; the charged customer
      - name: cycle_load_id
        type: string
        source: system
        description: FK -> CycleLoad.id; set for PACKAGE_LEAKER and REPROCESS lines, null for TAKE_OR_PAY_SHORTFALL
        default: null
      - name: contract_id
        type: string
        source: system
        description: FK -> CapacityContract.id; set only for TAKE_OR_PAY_SHORTFALL lines
        default: null
      - name: deviation_id
        type: string
        source: system
        description: FK -> Deviation.id; set only for REPROCESS lines
        default: null
      - name: basis
        type: enum
        source: computed
        description: what produced the line
        constraints: "one of {PACKAGE_LEAKER, REPROCESS, TAKE_OR_PAY_SHORTFALL}"
      - name: amount_cents
        type: integer
        source: computed
        description: charged amount in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: PENDING on create, WAIVED after POST /chargeback-lines/{id}/waive
        default: PENDING
        constraints: "one of {PENDING, WAIVED}"
      - name: waived_by_user_id
        type: string
        source: system
        description: X-User-ID of the FacilityAdmin who waived the line
        default: null
      - name: waive_reason
        type: string
        source: input
        description: free-text justification recorded at waive time
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- cyclic: revision rounds ------------------------------------------------
  - entity: ProductQualification
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /product-qualifications/{id}/submit"
        actor: Customer
        preconditions:
          - "status == DRAFT"
          - "acting X-User-ID == qualification.customer_id"
        side_effects:
          - "version += 1"
      - from: SUBMITTED
        to: UNDER_VALIDATION
        trigger: "POST /product-qualifications/{id}/validation-runs (first run)"
        actor: QualityManager
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "append immutable ValidationRun; run_verdict computed per entities.ValidationRun.fields.run_verdict"
          - "validation_run_acceptable_count recomputed"
          - "version += 1"
      - from: UNDER_VALIDATION
        to: UNDER_VALIDATION
        trigger: "POST /product-qualifications/{id}/validation-runs (subsequent runs)"
        actor: QualityManager
        preconditions:
          - "status == UNDER_VALIDATION"
        side_effects:
          - "append immutable ValidationRun; validation_run_acceptable_count recomputed"
          - "version += 1"
        note: "self-loop; any number of runs may be appended before a decision"
      - from: UNDER_VALIDATION
        to: QUALIFIED
        trigger: "POST /product-qualifications/{id}/decision with outcome == QUALIFY"
        actor: QualityManager
        preconditions:
          - "status == UNDER_VALIDATION"
          - "validation_run_acceptable_count >= MIN_ACCEPTABLE_VALIDATION_RUNS (2)"
          - "package_suitability_score >= MIN_PACKAGE_SUITABILITY_SCORE (70.00)"
          - "package_format != GLASS"
          - "package_burst_pressure_mpa > pressure_mpa"
        side_effects:
          - "qualified_at = logical clock now"
          - "expires_at = qualified_at + QUALIFICATION_VALID_DAYS (365 days)"
          - "version += 1"
      - from: UNDER_VALIDATION
        to: CHANGES_REQUESTED
        trigger: "POST /product-qualifications/{id}/decision with outcome == REQUEST_CHANGES"
        actor: QualityManager
        preconditions:
          - "status == UNDER_VALIDATION"
        side_effects:
          - "revision_round += 1"
          - "version += 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /product-qualifications/{id}/submit (revision loop)"
        actor: Customer
        preconditions:
          - "status == CHANGES_REQUESTED"
          - "revision_round <= MAX_REVISION_ROUNDS (3)"
          - "acting X-User-ID == qualification.customer_id"
        side_effects:
          - "version += 1"
        note: "closes the cycle CHANGES_REQUESTED -> SUBMITTED -> UNDER_VALIDATION -> CHANGES_REQUESTED"
      - from: QUALIFIED
        to: SUPERSEDED
        trigger: "POST /product-qualifications/{id}/supersede (system side effect on the source record)"
        actor: system
        preconditions:
          - "status == QUALIFIED"
          - "expected_qualification_version == version (concurrency_rules.qualification-supersede-stale)"
        side_effects:
          - "a new ProductQualification row is created in DRAFT with supersedes_qualification_id = this.id, inheriting customer_id / product_family_id / sku_code"
          - "version += 1"
      - from: QUALIFIED
        to: EXPIRED
        trigger: "POST /operations/day-close (system sweep)"
        actor: system
        preconditions:
          - "status == QUALIFIED"
          - "expires_at <= logical clock now"
        side_effects:
          - "version += 1"

  # --- parallel dimension 1 of 2 on Lot: physical custody ---------------------
  - entity: Lot
    state_field: custody_state
    shape: parallel
    initial_state: AT_DOCK
    terminal_states: [SHIPPED, REJECTED_AT_DOCK, DISPOSED]
    note: "custody_state and release_state advance independently; neither is a function of the other"
    transitions:
      - from: AT_DOCK
        to: IN_COLD_STORAGE
        trigger: "POST /lots/{id}/inspect with outcome == ACCEPT"
        actor: PlantOperator
        preconditions:
          - "custody_state == AT_DOCK"
          - "pulp_temp_c <= product_family.max_receipt_temp_c (family reached through qualification_id)"
          - "cold_room.capacity_state == NORMAL"
        side_effects:
          - "pulp_temp_c stored; no unit movement (units_untreated was already set to unit_count at receipt)"
          - "cascade L1->L2: ColdRoom.occupied_pallets += 1"
          - "cascade L2->L3: ColdRoom.capacity_state NORMAL -> AT_CAPACITY when occupied_pallets >= capacity_pallets"
          - "version += 1"
      - from: AT_DOCK
        to: REJECTED_AT_DOCK
        trigger: "POST /lots/{id}/inspect with outcome == REJECT"
        actor: PlantOperator
        preconditions:
          - "custody_state == AT_DOCK"
        side_effects:
          - "pulp_temp_c stored; units_untreated -> units_disposed (the pallet is refused at the door); no cold-room occupancy change"
          - "version += 1"
      - from: IN_COLD_STORAGE
        to: IN_VESSEL
        trigger: "POST /vessel-cycles/{id}/start (per loaded lot)"
        actor: PlantOperator
        preconditions:
          - "custody_state == IN_COLD_STORAGE"
          - "a CycleLoad with disposition_state == PENDING references this lot"
        side_effects:
          - "units_untreated -= load.units_loaded; units_in_vessel += load.units_loaded"
          - "version += 1"
      - from: IN_VESSEL
        to: TREATED
        trigger: "POST /vessel-cycles/{id}/cycle-logs (both verdict branches)"
        actor: PlantOperator
        preconditions:
          - "custody_state == IN_VESSEL"
        side_effects:
          - "units_treated += units_in_vessel; units_in_vessel = 0"
          - "version += 1"
      - from: IN_VESSEL
        to: IN_COLD_STORAGE
        trigger: "POST /vessel-cycles/{id}/terminate on a RUNNING cycle (abort compensation)"
        actor: PlantOperator
        preconditions:
          - "custody_state == IN_VESSEL"
        side_effects:
          - "units_untreated += units_in_vessel; units_in_vessel = 0 (restores calculations.lot_unit_ledger exactly)"
          - "version += 1"
      - from: TREATED
        to: IN_COLD_STORAGE
        trigger: "POST /deviations/{id}/adjudicate with disposition == REPROCESS"
        actor: system
        preconditions:
          - "custody_state == TREATED"
        side_effects:
          - "units_untreated += units_treated; units_treated = 0"
          - "version += 1"
      - from: TREATED
        to: SHIPPED
        trigger: "POST /lots/{id}/ship"
        actor: PlantOperator
        preconditions:
          - "custody_state == TREATED"
          - "release_state == RELEASED"
          - "outbound_temp_c <= product_family.max_outbound_temp_c"
        side_effects:
          - "cascade L1->L2: ColdRoom.occupied_pallets -= 1"
          - "cascade L2->L3: ColdRoom.capacity_state AT_CAPACITY -> NORMAL when occupied_pallets < capacity_pallets"
          - "version += 1"
      - from: TREATED
        to: DISPOSED
        trigger: "POST /deviations/{id}/adjudicate with disposition == REJECT, or POST /lots/{id}/release-decision with outcome == REJECT"
        actor: system
        preconditions:
          - "custody_state == TREATED"
        side_effects:
          - "units_disposed += units_treated; units_treated = 0"
          - "cascade: ColdRoom.occupied_pallets -= 1, then ColdRoom.capacity_state recomputed"
          - "version += 1"

  # --- parallel dimension 2 of 2 on Lot: quality release ----------------------
  - entity: Lot
    state_field: release_state
    shape: parallel
    initial_state: NOT_RELEASED
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: NOT_RELEASED
        to: ON_HOLD_FOR_TEST
        trigger: "POST /vessel-cycles/{id}/cycle-logs with ccp_verdict == DEVIATION (system), or POST /lots/{id}/release-decision with outcome == HOLD_FOR_TEST"
        actor: system | QualityManager
        preconditions:
          - "release_state == NOT_RELEASED"
          - "for the operator-driven form: custody_state == TREATED and expected_lot_version == version"
        side_effects:
          - "hold_reason recorded"
          - "version += 1"
      - from: NOT_RELEASED
        to: RELEASED
        trigger: "POST /lots/{id}/release-decision with outcome == RELEASE"
        actor: QualityManager
        preconditions:
          - "release_state == NOT_RELEASED"
          - "custody_state == TREATED"
          - "the lot's cycle (through its non-VOIDED CycleLoad) is in state DISPOSITIONED"
          - "no Deviation with cycle_id == that cycle has status == OPEN"
          - "expected_lot_version == version (concurrency_rules.release-decision-stale-lot)"
        side_effects:
          - "released_by_user_id = X-User-ID"
          - "version += 1"
      - from: ON_HOLD_FOR_TEST
        to: RELEASED
        trigger: "POST /lots/{id}/release-decision with outcome == RELEASE"
        actor: QualityManager
        preconditions:
          - "release_state == ON_HOLD_FOR_TEST"
          - "custody_state == TREATED"
          - "the lot's cycle is in state DISPOSITIONED"
          - "no Deviation with cycle_id == that cycle has status == OPEN"
          - "for every Deviation on that cycle: X-User-ID != deviation.adjudicated_by_user_id (four-eyes)"
          - "expected_lot_version == version"
        side_effects:
          - "released_by_user_id = X-User-ID; hold_reason cleared to null"
          - "version += 1"
      - from: ON_HOLD_FOR_TEST
        to: NOT_RELEASED
        trigger: "POST /deviations/{id}/adjudicate with disposition == REPROCESS (system)"
        actor: system
        preconditions:
          - "release_state == ON_HOLD_FOR_TEST"
        side_effects:
          - "hold_reason cleared to null; the lot re-enters the untreated pool"
          - "version += 1"
      - from: NOT_RELEASED
        to: REJECTED
        trigger: "POST /lots/{id}/release-decision with outcome == REJECT"
        actor: QualityManager
        preconditions:
          - "release_state == NOT_RELEASED"
          - "custody_state == TREATED"
          - "expected_lot_version == version"
        side_effects:
          - "custody_state TREATED -> DISPOSED with the cold-room cascade"
          - "version += 1"
      - from: ON_HOLD_FOR_TEST
        to: REJECTED
        trigger: "POST /deviations/{id}/adjudicate with disposition == REJECT (system), or POST /lots/{id}/release-decision with outcome == REJECT"
        actor: system | QualityManager
        preconditions:
          - "release_state == ON_HOLD_FOR_TEST"
        side_effects:
          - "custody_state TREATED -> DISPOSED with the cold-room cascade"
          - "version += 1"

  # --- branching fork-join ----------------------------------------------------
  - entity: VesselCycle
    state_field: state
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [DISPOSITIONED, ABORTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LOADED
        trigger: "POST /vessel-cycles/{id}/loads (first load)"
        actor: PlantScheduler
        preconditions:
          - "state == SCHEDULED"
          - "expected_cycle_version == version (concurrency_rules.load-create-stale-cycle)"
          - "lot.custody_state == IN_COLD_STORAGE"
          - "lot's qualification.status == QUALIFIED and expires_at > now"
          - "lot's qualification.product_family_id == cycle.product_family_id"
          - "units_loaded <= lot.units_untreated"
          - "baskets_used_total + baskets_used <= vessel.basket_count"
          - "contract.status == ACTIVE and contract.available_slots >= 1"
          - "contract.customer_id == lot.customer_id"
          - "cycle.scheduled_start within [contract.window_start, contract.window_end]"
          - "when product_family.requires_dedicated_cycle: every existing non-VOIDED load on the cycle has the same lot.customer_id"
        side_effects:
          - "create CycleLoad (disposition_state PENDING, inspection_state PENDING_INSPECTION, allocated_fee_cents null)"
          - "baskets_used_total, utilization_pct, estimated_cycle_seconds, estimated_tolling_fee_cents and scheduled_end recomputed (ESTIMATED variant)"
          - "cascade L1->L2: CapacityContract.reserved_slots += 1, which drops available_slots by 1"
          - "cascade L2->L3: CapacityContract ACTIVE -> EXHAUSTED when the recomputed available_slots == 0"
          - "version += 1"
      - from: LOADED
        to: LOADED
        trigger: "POST /vessel-cycles/{id}/loads (subsequent loads)"
        actor: PlantScheduler
        preconditions:
          - "state == LOADED"
          - "same precondition set as SCHEDULED -> LOADED"
        side_effects:
          - "same side-effect set as SCHEDULED -> LOADED"
        note: "self-loop; a cycle co-mingles loads from several customers unless the family requires a dedicated cycle"
      - from: LOADED
        to: RUNNING
        trigger: "POST /vessel-cycles/{id}/start"
        actor: PlantOperator
        preconditions:
          - "state == LOADED; a start on a still-SCHEDULED cycle passes the state gate and is refused by the next precondition instead (ERR_EMPTY_CYCLE)"
          - "at least one CycleLoad with disposition_state == PENDING exists (empty cycle rejected)"
          - "vessel.status == AVAILABLE"
          - "target_pressure_mpa >= max(qualification.pressure_mpa) over loaded lots"
          - "target_hold_seconds >= max(qualification.hold_time_seconds) over loaded lots"
          - "every loaded lot has custody_state == IN_COLD_STORAGE"
        side_effects:
          - "Vessel.status AVAILABLE -> IN_USE"
          - "each loaded Lot: custody_state IN_COLD_STORAGE -> IN_VESSEL, units_untreated -> units_in_vessel"
          - "started_at = now; version += 1"
      - from: RUNNING
        to: COMPLETED_CLEAN
        trigger: "POST /vessel-cycles/{id}/cycle-logs whose computed ccp_verdict == WITHIN_LIMITS"
        actor: PlantOperator
        preconditions:
          - "state == RUNNING"
          - "no CycleLog already exists for this cycle"
        side_effects:
          - "append immutable CycleLog with logged_by_user_id = X-User-ID"
          - "actual_cycle_seconds set from the log; Vessel.status IN_USE -> AVAILABLE; Vessel.cycles_run_count += 1"
          - "each loaded Lot: custody_state IN_VESSEL -> TREATED, units_in_vessel -> units_treated; release_state stays NOT_RELEASED"
          - "version += 1"
        note: "clean branch of the fork"
      - from: RUNNING
        to: COMPLETED_DEVIATED
        trigger: "POST /vessel-cycles/{id}/cycle-logs whose computed ccp_verdict == DEVIATION"
        actor: PlantOperator
        preconditions:
          - "state == RUNNING"
          - "no CycleLog already exists for this cycle"
        side_effects:
          - "append immutable CycleLog with logged_by_user_id = X-User-ID"
          - "actual_cycle_seconds set from the log; Vessel.status IN_USE -> AVAILABLE; Vessel.cycles_run_count += 1"
          - "each loaded Lot: custody_state IN_VESSEL -> TREATED, units_in_vessel -> units_treated"
          - "create Deviation (status OPEN, deviation_type = first entry of deviation_flags, severity and worst_shortfall_pct per calculations.ccp_verdict_and_deviation_severity, cycle_log_id set)"
          - "each loaded Lot: release_state NOT_RELEASED -> ON_HOLD_FOR_TEST with hold_reason 'CCP deviation'"
          - "version += 1"
        note: "deviated branch of the fork; adds a Deviation and a release hold the clean branch never creates"
      - from: COMPLETED_CLEAN
        to: DISPOSITIONED
        trigger: "POST /vessel-cycles/{id}/disposition"
        actor: QualityManager
        preconditions:
          - "state == COMPLETED_CLEAN"
          - "no Deviation with cycle_id == this cycle has status == OPEN"
        side_effects:
          - "actual_tolling_fee_cents = ACTUAL variant of calculations.cycle_time_and_tolling_fee"
          - "calculations.cycle_fee_allocation_across_loads writes CycleLoad.allocated_fee_cents for every non-VOIDED load"
          - "each load: disposition_state PENDING -> ALLOCATED, which moves one contract slot from reserved_slots to consumed_slots"
          - "dispositioned_at = now; version += 1"
      - from: COMPLETED_DEVIATED
        to: DISPOSITIONED
        trigger: "POST /vessel-cycles/{id}/disposition"
        actor: QualityManager
        preconditions:
          - "state == COMPLETED_DEVIATED"
          - "every Deviation with cycle_id == this cycle has status == ADJUDICATED_ACCEPT"
        side_effects:
          - "same fee, allocation and slot side effects as the COMPLETED_CLEAN join"
          - "lots keep release_state == ON_HOLD_FOR_TEST until a release decision is taken"
          - "dispositioned_at = now; version += 1"
        note: "join point of the fork, reached with a different precondition and a different lot release posture"
      - from: COMPLETED_DEVIATED
        to: DISPOSITIONED
        trigger: "POST /deviations/{id}/adjudicate with disposition IN {REPROCESS, REJECT} (system)"
        actor: system
        preconditions:
          - "state == COMPLETED_DEVIATED"
        side_effects:
          - "REPROCESS: actual_tolling_fee_cents computed and allocated, loads -> REPROCESSED, lots returned to the untreated pool"
          - "REJECT: actual_tolling_fee_cents = 0, every load's allocated_fee_cents = 0, loads -> REJECTED, lots -> DISPOSED"
          - "dispositioned_at = now; version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vessel-cycles/{id}/terminate"
        actor: PlantScheduler
        preconditions:
          - "state == SCHEDULED"
        side_effects:
          - "version += 1"
      - from: LOADED
        to: CANCELLED
        trigger: "POST /vessel-cycles/{id}/terminate"
        actor: PlantScheduler
        preconditions:
          - "state == LOADED"
        side_effects:
          - "cascade L1->L2: every CycleLoad disposition_state PENDING -> VOIDED"
          - "cascade L2->L3: CapacityContract.reserved_slots recomputed downward, so available_slots rises by one per voided load"
          - "cascade L3->L4: CapacityContract EXHAUSTED -> ACTIVE when the recomputed available_slots >= 1"
          - "version += 1"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /vessel-cycles/{id}/terminate"
        actor: PlantOperator
        preconditions:
          - "state == RUNNING"
        side_effects:
          - "Vessel.status IN_USE -> AVAILABLE"
          - "cascade L1->L2: every CycleLoad disposition_state PENDING -> VOIDED"
          - "cascade L2->L3: each referenced Lot: units_in_vessel -> units_untreated and custody_state IN_VESSEL -> IN_COLD_STORAGE"
          - "cascade L3->L4: CapacityContract.reserved_slots recomputed downward, available_slots rises"
          - "cascade L4->L5: CapacityContract EXHAUSTED -> ACTIVE when available_slots >= 1"
          - "no CycleLog is written, so actual_cycle_seconds stays null and no fee is billable"
          - "version += 1"

  # --- branching with divergent cascades -------------------------------------
  - entity: Deviation
    state_field: status
    shape: branching
    initial_state: OPEN
    terminal_states: [ADJUDICATED_ACCEPT, ADJUDICATED_REPROCESS, ADJUDICATED_REJECT]
    transitions:
      - from: OPEN
        to: ADJUDICATED_ACCEPT
        trigger: "POST /deviations/{id}/adjudicate with disposition == ACCEPT"
        actor: QualityManager
        preconditions:
          - "status == OPEN"
          - "severity != CRITICAL"
          - "X-User-ID != cycle_log.logged_by_user_id when cycle_log_id is not null (segregation of duties)"
        side_effects:
          - "adjudicated_by_user_id = X-User-ID; adjudicated_at = now; chargeback_party computed from root_cause_code"
          - "no lot or fee cascade; the cycle still needs POST /vessel-cycles/{id}/disposition"
          - "version += 1"
      - from: OPEN
        to: ADJUDICATED_REPROCESS
        trigger: "POST /deviations/{id}/adjudicate with disposition == REPROCESS"
        actor: QualityManager
        preconditions:
          - "status == OPEN"
          - "cycle_load_id is null (a PACKAGE_FAILURE_RATE deviation cannot be reprocessed)"
          - "X-User-ID != cycle_log.logged_by_user_id"
        side_effects:
          - "cascade L1->L2: VesselCycle COMPLETED_DEVIATED -> DISPOSITIONED with actual_tolling_fee_cents computed and allocated"
          - "cascade L2->L3: every CycleLoad disposition_state PENDING -> REPROCESSED; when chargeback_party == CUSTOMER a ChargebackLine (basis REPROCESS, amount_cents = round_half_up(allocated_fee_cents * REPROCESS_FEE_SHARE)) is created"
          - "cascade L3->L4: Customer.chargeback_balance_cents recomputed upward by those line amounts"
          - "cascade L3->L5: each referenced Lot: units_treated -> units_untreated, custody_state TREATED -> IN_COLD_STORAGE, release_state ON_HOLD_FOR_TEST -> NOT_RELEASED"
          - "version += 1"
      - from: OPEN
        to: ADJUDICATED_REJECT
        trigger: "POST /deviations/{id}/adjudicate with disposition == REJECT"
        actor: QualityManager
        preconditions:
          - "status == OPEN"
          - "cycle_load_id is null"
          - "X-User-ID != cycle_log.logged_by_user_id"
        side_effects:
          - "cascade L1->L2: VesselCycle COMPLETED_DEVIATED -> DISPOSITIONED with actual_tolling_fee_cents = 0"
          - "cascade L2->L3: every CycleLoad disposition_state PENDING -> REJECTED with allocated_fee_cents = 0"
          - "cascade L3->L4: each referenced Lot: units_treated -> units_disposed, custody_state TREATED -> DISPOSED, release_state ON_HOLD_FOR_TEST -> REJECTED"
          - "cascade L4->L5: ColdRoom.occupied_pallets -= 1 for each disposed lot"
          - "cascade L5->L6: ColdRoom.capacity_state AT_CAPACITY -> NORMAL when occupied_pallets < capacity_pallets"
          - "version += 1"

  # --- cyclic ledger posture --------------------------------------------------
  - entity: CapacityContract
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /capacity-contracts/{id}/activate"
        actor: FacilityAdmin
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "reserved_slots = 0, consumed_slots = 0, available_slots = committed_slots"
          - "version += 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system recompute of the slot ledger after POST /vessel-cycles/{id}/loads"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "recomputed available_slots == 0"
        side_effects:
          - "version += 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system recompute of the slot ledger after POST /vessel-cycles/{id}/terminate or POST /deviations/{id}/adjudicate with disposition == REJECT"
        actor: system
        preconditions:
          - "status == EXHAUSTED"
          - "recomputed available_slots >= 1"
        side_effects:
          - "version += 1"
        note: "closes the ACTIVE <-> EXHAUSTED cycle"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /capacity-contracts/{id}/close"
        actor: FacilityAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "shortfall_slots and take_or_pay_cents frozen per calculations.contract_take_or_pay_shortfall"
          - "when take_or_pay_cents > 0: create ChargebackLine (basis TAKE_OR_PAY_SHORTFALL, contract_id set, status PENDING) and raise Customer.chargeback_balance_cents by that amount"
          - "version += 1"
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /capacity-contracts/{id}/close"
        actor: FacilityAdmin
        preconditions:
          - "status == EXHAUSTED"
        side_effects:
          - "same close side effects as ACTIVE -> CLOSED"
          - "version += 1"

  # --- derived posture, cyclic -----------------------------------------------
  - entity: ColdRoom
    state_field: capacity_state
    shape: cyclic
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: AT_CAPACITY
        trigger: "system recompute after POST /lots/{id}/inspect with outcome == ACCEPT"
        actor: system
        preconditions:
          - "recomputed occupied_pallets >= capacity_pallets"
        side_effects:
          - "further POST /lots into this room are rejected with ERR_COLD_ROOM_AT_CAPACITY"
          - "version += 1"
      - from: AT_CAPACITY
        to: NORMAL
        trigger: "system recompute after POST /lots/{id}/ship, after a REJECT release decision, or after a rejected deviation disposes lots"
        actor: system
        preconditions:
          - "recomputed occupied_pallets < capacity_pallets"
        side_effects:
          - "version += 1"

  # --- money line -------------------------------------------------------------
  - entity: ChargebackLine
    state_field: status
    shape: linear
    initial_state: PENDING
    terminal_states: [WAIVED]
    transitions:
      - from: PENDING
        to: WAIVED
        trigger: "POST /chargeback-lines/{id}/waive"
        actor: FacilityAdmin
        preconditions:
          - "status == PENDING"
        side_effects:
          - "waived_by_user_id = X-User-ID; waive_reason stored"
          - "Customer.chargeback_balance_cents drops by exactly amount_cents (calculations.customer_chargeback_balance)"
          - "version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: load-create-stale-cycle
    parent_entity: VesselCycle
    write_endpoint: "POST /vessel-cycles/{id}/loads"
    occ_field: "expected_cycle_version"
    description: |
      Creating a CycleLoad against a VesselCycle whose version has advanced
      since the scheduler last read it is rejected. Adding a second load to a
      cycle that is still SCHEDULED or LOADED is legitimate product behaviour,
      so no state precondition covers this write: the guard is the stale
      version, which encodes a scheduler acting on an outdated view of the
      cycle's basket occupancy and estimated fee.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

  - rule_id: release-decision-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /lots/{id}/release-decision"
    occ_field: "expected_lot_version"
    description: |
      Recording a release decision on a Lot whose version has advanced since
      the QualityManager last read it is rejected. NOT_RELEASED ->
      ON_HOLD_FOR_TEST -> RELEASED is a legitimate sequence, so a second
      decision is not blocked by any release_state precondition; the stale
      version is what stops a RELEASE that was authored against a view of the
      lot taken before another QualityManager placed it on microbiological hold.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: qualification-supersede-stale
    parent_entity: ProductQualification
    write_endpoint: "POST /product-qualifications/{id}/supersede"
    occ_field: "expected_qualification_version"
    description: |
      Superseding a QUALIFIED ProductQualification whose version has advanced
      since the customer last read it is rejected. A revision legitimately
      supersedes the record it points at, so the write is not covered by a
      state precondition alone; the stale version encodes a customer building
      a revision on top of a record that has since been changed.
    error_id: ERR_STALE_QUALIFICATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: qualification_package_suitability_score
    trigger: "POST /product-qualifications and POST /product-qualifications/{id}/supersede, at row creation; the inputs are immutable afterwards so the score is never recomputed"
    algorithm: weighted_scoring
    formula: |
      pressure_margin = min(1.0, max(0.0, (package_burst_pressure_mpa - pressure_mpa) / BURST_MARGIN_FULL_CREDIT_MPA))
      film_margin     = min(1.0, film_thickness_micron / FILM_FULL_CREDIT_MICRON)
      format_factor   = FORMAT_FACTOR[package_format]

      # components are kept at full precision; there is exactly ONE rounding
      # step, applied to the sum. Rounding each component to 2 dp first and then
      # summing is explicitly NOT the pinned order.
      package_suitability_score = round_half_up(
            W_PRESSURE * pressure_margin * 100
          + W_FILM     * film_margin     * 100
          + W_FORMAT   * format_factor   * 100, 2)
    input_set: "only fields of the ProductQualification row itself; no child ValidationRun influences the score"
    constants:
      W_PRESSURE: 0.50
      W_FILM: 0.30
      W_FORMAT: 0.20
      BURST_MARGIN_FULL_CREDIT_MPA: 50.0
      FILM_FULL_CREDIT_MICRON: 80.0
      FORMAT_FACTOR: { POUCH: 1.0, TRAY_SEALED: 0.85, RIGID_BOTTLE: 0.60, GLASS: 0.0 }
      MIN_PACKAGE_SUITABILITY_SCORE: 70.00
    precision: "2 decimal places, round_half_up, single rounding on the summed score"

  - name: cycle_time_and_tolling_fee
    trigger: "ESTIMATED variant on POST /vessel-cycles and on every POST /vessel-cycles/{id}/loads (writes estimated_cycle_seconds, scheduled_end, utilization_pct, estimated_tolling_fee_cents); ACTUAL variant when the cycle reaches DISPOSITIONED (writes actual_cycle_seconds, actual_tolling_fee_cents)"
    algorithm: tiered_pricing
    formula: |
      # ---- step 1: cycle seconds (this is the variant-dependent input) -------
      # ESTIMATED: come_up = ceil(target_pressure_mpa / vessel.pump_ramp_rate_mpa_per_sec)
      #            hold    = cycle.target_hold_seconds
      # ACTUAL   : come_up = cycle_log.come_up_seconds
      #            hold    = cycle_log.actual_hold_seconds
      cycle_seconds = LOAD_UNLOAD_SECONDS + come_up + hold + vessel.decompression_seconds

      # ---- step 2: billable minutes always round UP -------------------------
      billable_minutes = ceil(cycle_seconds / 60)
      base_cents       = billable_minutes * RATE_PER_MINUTE_CENTS

      # ---- step 3: utilization surcharge, evaluated BEFORE any credit -------
      utilization_pct = round_half_up(100 * cycle.baskets_used_total / vessel.basket_count, 2)
      surcharge_rate  = UNDERUTIL_TIER_1_RATE if utilization_pct <  UNDERUTIL_TIER_1_PCT
                   else UNDERUTIL_TIER_2_RATE if utilization_pct <  UNDERUTIL_TIER_2_PCT
                   else 0.00
      surcharge_cents = round_half_up(base_cents * surcharge_rate)

      # ---- step 4: gross ----------------------------------------------------
      gross_cents = base_cents + surcharge_cents

      # ---- step 5: loyalty credit -------------------------------------------
      # PINNED EVALUATION ORDER: the credit tier is keyed on gross_cents, i.e. on
      # base PLUS surcharge, so an underutilised cycle can be pushed into a
      # richer credit tier by its own surcharge. Keying the tier on base_cents is
      # the tempting alternative reading and is WRONG. The credit itself never
      # re-enters the tier test.
      credit_rate  = CREDIT_TIER_HIGH_RATE if gross_cents >= CREDIT_TIER_HIGH_CENTS
                else CREDIT_TIER_LOW_RATE  if gross_cents >= CREDIT_TIER_LOW_CENTS
                else 0.00
      credit_cents = round_half_up(gross_cents * credit_rate)

      # ---- step 6: net ------------------------------------------------------
      net_tolling_fee_cents = gross_cents - credit_cents
    input_set: "baskets_used_total counts CycleLoad rows with disposition_state != VOIDED; a VOIDED load lowers utilization_pct on the next recompute"
    constants:
      LOAD_UNLOAD_SECONDS: 180
      RATE_PER_MINUTE_CENTS: 1250
      UNDERUTIL_TIER_1_PCT: 60.00
      UNDERUTIL_TIER_1_RATE: 0.20
      UNDERUTIL_TIER_2_PCT: 85.00
      UNDERUTIL_TIER_2_RATE: 0.08
      CREDIT_TIER_HIGH_CENTS: 12000
      CREDIT_TIER_HIGH_RATE: 0.05
      CREDIT_TIER_LOW_CENTS: 8000
      CREDIT_TIER_LOW_RATE: 0.03
    precision: "whole cents, round_half_up at each of steps 3 and 5; utilization_pct 2 decimals"
    variants:
      - name: ESTIMATED
        when: "at scheduling time and after every load create, from cycle.target_pressure_mpa / cycle.target_hold_seconds and the vessel's nominal ramp rate"
        difference: "come_up is derived arithmetically from the ramp rate and hold is the target; written to estimated_cycle_seconds / estimated_tolling_fee_cents; also fixes scheduled_end and therefore the vessel occupancy interval"
      - name: ACTUAL
        when: "when the cycle reaches DISPOSITIONED, from the immutable CycleLog"
        difference: "come_up and hold are the measured values, so a longer hold or a slower pump can cross a whole-minute boundary and change billable_minutes, the surcharge base and the credit tier; written to actual_cycle_seconds / actual_tolling_fee_cents. The two variants routinely disagree for identical scheduling inputs."

  - name: cycle_fee_allocation_across_loads
    trigger: "when a VesselCycle reaches DISPOSITIONED (via POST /vessel-cycles/{id}/disposition or via a REPROCESS adjudication); writes CycleLoad.allocated_fee_cents"
    algorithm: waterfall_allocation
    formula: |
      N     = cycle.actual_tolling_fee_cents
      loads = CycleLoad rows of the cycle with disposition_state == PENDING, ordered created_at ASC
      T     = sum(load.baskets_used) over loads

      # PINNED ROUNDING ORDER: truncate every per-load share, then hand the
      # leftover cents out one at a time. "round_half_up each share then sum" is
      # the tempting alternative and produces a total that differs from N.
      for each load i: base_share_i = floor(N * load_i.baskets_used / T)
      remainder = N - sum(base_share_i)                  # 0 <= remainder < count(loads)
      queue = loads ordered by (baskets_used DESC, created_at ASC)
      give +1 cent to each of the first `remainder` loads in queue
      # invariant at this point: sum(allocated_fee_cents) == N exactly

      # seasonal peak uplift is applied per load AFTER the remainder pass, so the
      # sum of allocated fees exceeds N by exactly the uplift
      for each load i:
        if load_i.contract.peak_window_start <= cycle.scheduled_start <= load_i.contract.peak_window_end:
            allocated_fee_cents_i = round_half_up(base_allocation_i * load_i.contract.peak_multiplier)
    input_set: "only loads still in disposition_state == PENDING at disposition time; VOIDED loads are excluded and receive allocated_fee_cents = null; a REJECT adjudication overrides every allocation to 0"
    constants: {}
    precision: "whole cents; floor per share, round_half_up on the peak uplift"

  - name: customer_package_failure_risk
    trigger: "INSTANTANEOUS_LOAD variant on POST /cycle-loads/{id}/inspection; TRAILING_90D_CUSTOMER variant on POST /operations/day-close"
    algorithm: threshold
    formula: |
      # ---- INSTANTANEOUS_LOAD (subject: CycleLoad) --------------------------
      leaker_ppm = round_half_up(1000000 * leaker_units / units_inspected)
      chargeback_party =
          CUSTOMER if leaker_ppm >= LEAKER_CHARGEBACK_PPM
          else CUSTOMER if (leaker_ppm >= LEAKER_WATCH_PPM
                            and customer.trailing_leaker_ppm >= TRAILING_WATCH_PPM)
          else FACILITY
      # customer.trailing_leaker_ppm is read AS STORED (value left by the last
      # day-close). It is never recomputed inline by the inspection endpoint.

      # ---- TRAILING_90D_CUSTOMER (subject: Customer) ------------------------
      window     = [now - TRAILING_WINDOW_DAYS days, now]        # both ends inclusive
      population = CycleLoad rows where lot.customer_id == customer.id
                   AND inspection_state == INSPECTED
                   AND parent VesselCycle.dispositioned_at is inside window
      trailing_leaker_ppm = 0 if population is empty
                       else round_half_up(1000000 * sum(leaker_units) / sum(units_inspected))
    input_set: "the instantaneous variant sees exactly one load; the trailing variant sees every INSPECTED load of the customer whose cycle was dispositioned inside the 90-day window, and 0 when that set is empty"
    constants:
      LEAKER_CHARGEBACK_PPM: 3000
      LEAKER_WATCH_PPM: 1500
      TRAILING_WATCH_PPM: 2000
      TRAILING_WINDOW_DAYS: 90
    precision: "integer ppm, round_half_up"
    variants:
      - name: INSTANTANEOUS_LOAD
        when: "at the moment a load's package inspection is recorded"
        difference: "uses this load's own leaker_units / units_inspected only; a single bad pallet immediately makes the customer liable once it reaches LEAKER_CHARGEBACK_PPM"
      - name: TRAILING_90D_CUSTOMER
        when: "at day-close, over the customer's whole recent history"
        difference: "pools leaker_units and units_inspected across cycles dispositioned inside the window and drops anything older, so the very load that produced a 3000 ppm instantaneous reading contributes 0 to the customer's trailing rate once its cycle ages out of the window"

  - name: load_package_chargeback_amount
    trigger: "POST /cycle-loads/{id}/inspection, immediately after customer_package_failure_risk decides chargeback_party"
    algorithm: threshold
    formula: |
      if chargeback_party == FACILITY:
          chargeback_cents = 0
          no ChargebackLine is created and Customer.chargeback_balance_cents is unchanged
      else:
          handling_cents = leaker_units * PER_LEAKER_HANDLING_CENTS
          rework_cents   = round_half_up(load.allocated_fee_cents * LEAKER_FEE_SHARE)
                             if leaker_ppm >= LEAKER_CHARGEBACK_PPM else 0
          chargeback_cents = handling_cents + rework_cents
          create ChargebackLine(basis = PACKAGE_LEAKER, amount_cents = chargeback_cents,
                                customer_id = lot.customer_id, cycle_load_id = load.id,
                                status = PENDING)
      # a load at or above LEAKER_CHARGEBACK_PPM additionally raises a Deviation
      # (deviation_type PACKAGE_FAILURE_RATE, severity MAJOR, cycle_load_id set,
      #  status OPEN) which blocks release of every lot on that cycle until it is
      #  adjudicated.
    input_set: "one CycleLoad, whose allocated_fee_cents is already frozen because inspection is only permitted after the cycle reached DISPOSITIONED"
    constants:
      PER_LEAKER_HANDLING_CENTS: 125
      LEAKER_FEE_SHARE: 0.50
      LEAKER_CHARGEBACK_PPM: 3000
    precision: "whole cents, round_half_up on the rework share"

  - name: vessel_schedule_window_and_cleanout_gap
    trigger: "POST /vessel-cycles, before the row is created"
    algorithm: interval_merge
    formula: |
      new_window = [scheduled_start, scheduled_start + estimated_cycle_seconds)   # HALF-OPEN
      occupants  = VesselCycle rows with the same vessel_id and
                   state IN {SCHEDULED, LOADED, RUNNING, COMPLETED_CLEAN,
                             COMPLETED_DEVIATED, DISPOSITIONED}
                   # ABORTED and CANCELLED cycles free the vessel entirely

      # (1) pairwise overlap, half-open: touching endpoints do NOT collide
      for each occupant o:
        if new_window.start < o.scheduled_end and o.scheduled_start < new_window.end:
            reject ERR_VESSEL_WINDOW_CONFLICT

      # (2) cleanout buffer against the nearest occupant on EACH side
      for side in {predecessor = the occupant with the greatest scheduled_end <= new_window.start,
                   successor   = the occupant with the smallest scheduled_start >= new_window.end}:
        if side exists and side.product_family.cross_contamination_group
                        != new.product_family.cross_contamination_group:
            required_gap_seconds = max(side.product_family.cleanout_minutes,
                                       new.product_family.cleanout_minutes) * 60
            gap_seconds = whole seconds between the earlier window's end and the later window's start
            if gap_seconds < required_gap_seconds: reject ERR_CLEANOUT_GAP_REQUIRED
            # gap_seconds == required_gap_seconds passes
        # same group: any gap >= 0 is acceptable, including a zero gap
    input_set: "one vessel's non-terminal and completed cycles; the candidate's own estimated_cycle_seconds comes from the ESTIMATED variant of cycle_time_and_tolling_fee"
    constants: {}
    precision: "whole seconds; overlap uses strict inequalities, the cleanout gap uses >="

  - name: cold_room_interval_occupancy
    trigger: "POST /lots, before the row is created"
    algorithm: aggregation
    formula: |
      candidate  = [now, lot.ship_by]                            # CLOSED at both ends
      population = Lot rows with cold_room_id == this room and
                   custody_state IN {AT_DOCK, IN_COLD_STORAGE, IN_VESSEL, TREATED}
      # the occupancy step function only rises at an interval start, so it is
      # sufficient to evaluate the candidate's own start plus every population
      # start that falls inside the candidate interval
      points = {candidate.start} UNION {p.created_at : p in population,
                                        candidate.start <= p.created_at <= candidate.end}
      for t in points ordered ascending:
          occupancy_t = count(p in population where p.created_at <= t <= p.ship_by) + 1
          if occupancy_t > room.capacity_pallets: reject ERR_COLD_ROOM_CAPACITY_EXCEEDED
    input_set: "declared occupancy, so pallets still AT_DOCK count; SHIPPED, REJECTED_AT_DOCK and DISPOSED lots never count"
    constants: {}
    precision: "integer pallet counts; interval containment is inclusive on both ends"

  - name: contract_slot_ledger
    trigger: "recomputed after every CycleLoad create, cycle terminate, cycle disposition and deviation adjudication"
    algorithm: aggregation
    formula: |
      reserved_slots  = count(CycleLoad where contract_id == this
                              and disposition_state == PENDING
                              and parent cycle.state IN {SCHEDULED, LOADED, RUNNING})
      consumed_slots  = count(CycleLoad where contract_id == this
                              and disposition_state IN {ALLOCATED, REPROCESSED})
      available_slots = committed_slots - reserved_slots - consumed_slots
      # CONSERVED QUANTITY (checked by every compensating action):
      #   committed_slots == reserved_slots + consumed_slots + available_slots
      # VOIDED and REJECTED loads belong to no bucket, so a cancel, an abort or a
      # rejected deviation returns the slot to available_slots with zero drift.
    input_set: "all CycleLoad rows pointing at this contract, whatever the cycle's vessel or family; ties in capacity disputes are broken by priority_rank ASC then CapacityContract.created_at ASC"
    constants: {}
    precision: "integer slots"

  - name: contract_take_or_pay_shortfall
    trigger: "POST /capacity-contracts/{id}/close, once; the result is frozen on the row"
    algorithm: threshold
    formula: |
      min_take_slots    = ceil(committed_slots * MIN_TAKE_FRACTION)
      shortfall_slots   = max(0, min_take_slots - consumed_slots)
      take_or_pay_cents = shortfall_slots * slot_take_or_pay_cents
      if take_or_pay_cents > 0:
          create ChargebackLine(basis = TAKE_OR_PAY_SHORTFALL, contract_id = this.id,
                                customer_id = this.customer_id, amount_cents = take_or_pay_cents,
                                status = PENDING)
      # consumed_slots == min_take_slots exactly produces shortfall_slots == 0 and
      # NO ChargebackLine at all.
    input_set: "consumed_slots as of the close call; reserved slots do not count as taken"
    constants:
      MIN_TAKE_FRACTION: 0.80
    precision: "integer slots, whole cents"

  - name: ccp_verdict_and_deviation_severity
    trigger: "POST /vessel-cycles/{id}/cycle-logs, before the cycle branches"
    algorithm: threshold
    formula: |
      lots_on_cycle     = Lot rows referenced by CycleLoad rows with disposition_state == PENDING
      required_pressure = max(qualification.pressure_mpa)      over lots_on_cycle
      required_hold     = max(qualification.hold_time_seconds) over lots_on_cycle
      water_temp_limit  = min(qualification.max_water_temp_c)  over lots_on_cycle

      flags = []                                  # fixed order, never sorted differently
      if log.actual_pressure_mpa  < required_pressure: flags += [UNDER_PRESSURE]
      if log.actual_hold_seconds  < required_hold:     flags += [SHORT_HOLD]
      if log.water_temp_c         > water_temp_limit:  flags += [TEMP_EXCURSION]
      ccp_verdict = WITHIN_LIMITS if flags is empty else DEVIATION
      # equality is compliant on all three: actual == required passes.

      pressure_shortfall_pct = 0.00 if log.actual_pressure_mpa >= required_pressure
                          else round_half_up(100 * (required_pressure - log.actual_pressure_mpa) / required_pressure, 2)
      hold_shortfall_pct     = 0.00 if log.actual_hold_seconds >= required_hold
                          else round_half_up(100 * (required_hold - log.actual_hold_seconds) / required_hold, 2)
      temp_excursion_pct     = 0.00 if log.water_temp_c <= water_temp_limit
                          else round_half_up(100 * (log.water_temp_c - water_temp_limit) / water_temp_limit, 2)

      worst_shortfall_pct = max(pressure_shortfall_pct, hold_shortfall_pct, temp_excursion_pct)
      severity            = CRITICAL if worst_shortfall_pct >= CRITICAL_SHORTFALL_PCT else MAJOR
      deviation_type      = first entry of flags in the order [UNDER_PRESSURE, SHORT_HOLD, TEMP_EXCURSION]
      # PACKAGE_FAILURE_RATE deviations are raised by inspection instead and carry
      # worst_shortfall_pct 0.00 and severity MAJOR.
    input_set: "the strictest requirement across every lot in the chamber, so one demanding SKU raises the bar for the whole cycle"
    constants:
      CRITICAL_SHORTFALL_PCT: 5.00
    precision: "percentages 2 decimals, round_half_up"

  - name: lot_unit_ledger
    trigger: "every transition that moves units: receipt, inspect, cycle start, cycle-log completion, abort, reprocess adjudication, reject adjudication, REJECT release decision"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY, holds after every request that touches the lot:
      #   unit_count == units_untreated + units_in_vessel + units_treated + units_disposed
      POST /lots                      : units_untreated = unit_count, others 0
      inspect ACCEPT                  : no unit movement
      inspect REJECT                  : units_untreated -> units_disposed
      cycle start                     : units_loaded moves untreated -> in_vessel
      cycle-log (either branch)       : in_vessel -> treated
      terminate on RUNNING (abort)    : in_vessel -> untreated        (exact compensation)
      adjudicate REPROCESS            : treated   -> untreated        (exact compensation)
      adjudicate REJECT / release REJECT : treated -> disposed
    input_set: "one Lot row"
    constants: {}
    precision: "integer units; no partial units exist"

  - name: customer_chargeback_balance
    trigger: "recomputed whenever a ChargebackLine is created or waived"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY:
      #   Customer.chargeback_balance_cents
      #     == sum(ChargebackLine.amount_cents where customer_id == customer.id
      #                                          and status == PENDING)
      # A waive is the compensating action of a line's creation: it lowers the
      # balance by exactly amount_cents and leaves the line's amount_cents intact
      # for audit.

      # The three line bases are minted as follows:
      #   PACKAGE_LEAKER        : calculations.load_package_chargeback_amount
      #   TAKE_OR_PAY_SHORTFALL : calculations.contract_take_or_pay_shortfall
      #   REPROCESS             : one line per reprocessed load when a Deviation is
      #                           adjudicated REPROCESS and its chargeback_party is
      #                           CUSTOMER (root_cause_code starts with PKG_):
      #     amount_cents = round_half_up(load.allocated_fee_cents * REPROCESS_FEE_SHARE)
    input_set: "every ChargebackLine of the customer with status == PENDING, whatever its basis; WAIVED lines are excluded but never deleted"
    constants:
      REPROCESS_FEE_SHARE: 0.50
    precision: "whole cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# Rows that share a priority are evaluated in the order listed here, so a
# request violating two rows of the same priority always reports the earlier row.
# =============================================================================
validations:

  # ---- 1-2: authentication and authorization --------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role is one of the roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # ---- 3: request schema ----------------------------------------------------
  - priority: 3
    category: business_constraint
    check: "request body and query schema: required fields present, types correct, enums inside their declared domain, numeric bounds (unit_count > 0, baskets_used > 0, units_inspected > 0, leaker_units >= 0, committed_slots > 0, peak_multiplier >= 1.0), regex fields (Customer.code, Deviation.root_cause_code), window_end > window_start, and pagination limit in 1..100 with offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # ---- 4: path existence, resolved left to right ----------------------------
  - priority: 4
    category: existence
    check: "path {id} resolves to a Customer"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "GET /customers/{id}"
  - priority: 4
    category: existence
    check: "path {id} resolves to a ProductFamily"
    error_id: ERR_PRODUCT_FAMILY_NOT_FOUND
    http_status: 404
    applies_to: "GET /product-families/{id}"
  - priority: 4
    category: existence
    check: "path {id} resolves to a Vessel"
    error_id: ERR_VESSEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /vessels/{id}, PATCH /vessels/{id}"
  - priority: 4
    category: existence
    check: "path {id} resolves to a ColdRoom"
    error_id: ERR_COLD_ROOM_NOT_FOUND
    http_status: 404
    applies_to: "GET /cold-rooms/{id}"
  - priority: 4
    category: existence
    check: "path {id} resolves to a ProductQualification"
    error_id: ERR_QUALIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /product-qualifications/{id}, GET /product-qualifications/{id}/validation-runs, POST /product-qualifications/{id}/submit, POST /product-qualifications/{id}/supersede, POST /product-qualifications/{id}/validation-runs, POST /product-qualifications/{id}/decision"
  - priority: 4
    category: existence
    check: "path {id} resolves to a CapacityContract"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /capacity-contracts/{id}, POST /capacity-contracts/{id}/activate, POST /capacity-contracts/{id}/close"
  - priority: 4
    category: existence
    check: "path {id} resolves to a Lot"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /lots/{id}, POST /lots/{id}/inspect, POST /lots/{id}/release-decision, POST /lots/{id}/ship"
  - priority: 4
    category: existence
    check: "path {id} resolves to a VesselCycle"
    error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /vessel-cycles/{id}, GET /vessel-cycles/{id}/cycle-logs, POST /vessel-cycles/{id}/loads, POST /vessel-cycles/{id}/start, POST /vessel-cycles/{id}/cycle-logs, POST /vessel-cycles/{id}/terminate, POST /vessel-cycles/{id}/disposition"
  - priority: 4
    category: existence
    check: "path {id} resolves to a CycleLoad"
    error_id: ERR_CYCLE_LOAD_NOT_FOUND
    http_status: 404
    applies_to: "GET /cycle-loads/{id}, POST /cycle-loads/{id}/inspection"
  - priority: 4
    category: existence
    check: "path {id} resolves to a Deviation"
    error_id: ERR_DEVIATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /deviations/{id}, POST /deviations/{id}/adjudicate"
  - priority: 4
    category: existence
    check: "path {id} resolves to a ChargebackLine"
    error_id: ERR_CHARGEBACK_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /chargeback-lines/{id}, POST /chargeback-lines/{id}/waive"

  # ---- 5: body foreign keys ------------------------------------------------
  - priority: 5
    category: business_referential
    check: "body customer_id resolves to a Customer"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "POST /product-qualifications, POST /capacity-contracts, POST /lots"
  - priority: 5
    category: business_referential
    check: "body product_family_id resolves to a ProductFamily"
    error_id: ERR_PRODUCT_FAMILY_NOT_FOUND
    http_status: 404
    applies_to: "POST /product-qualifications, POST /vessel-cycles"
  - priority: 5
    category: business_referential
    check: "body supersedes_qualification_id / qualification_id resolves to a ProductQualification"
    error_id: ERR_QUALIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /product-qualifications, POST /lots"
  - priority: 5
    category: business_referential
    check: "body cold_room_id resolves to a ColdRoom"
    error_id: ERR_COLD_ROOM_NOT_FOUND
    http_status: 404
    applies_to: "POST /lots"
  - priority: 5
    category: business_referential
    check: "body vessel_id resolves to a Vessel"
    error_id: ERR_VESSEL_NOT_FOUND
    http_status: 404
    applies_to: "POST /vessel-cycles"
  - priority: 5
    category: business_referential
    check: "body lot_id resolves to a Lot"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "POST /vessel-cycles/{id}/loads"
  - priority: 5
    category: business_referential
    check: "body contract_id resolves to a CapacityContract"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "POST /vessel-cycles/{id}/loads"

  # ---- 6: ownership ---------------------------------------------------------
  - priority: 6
    category: auth
    check: "when X-User-Role == Customer, X-User-ID must equal the customer_id of the target resource (directly, or through qualification_id / lot_id / cycle_load_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /product-qualifications, POST /product-qualifications/{id}/submit, POST /product-qualifications/{id}/supersede, GET /product-qualifications/{id}, GET /lots/{id}, GET /cycle-loads/{id}, GET /chargeback-lines/{id}"

  # ---- 7: optimistic concurrency (before any state check) -------------------
  - priority: 7
    category: state
    check: "expected_cycle_version equals VesselCycle.version (concurrency_rules.load-create-stale-cycle)"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /vessel-cycles/{id}/loads"
  - priority: 7
    category: state
    check: "expected_lot_version equals Lot.version (concurrency_rules.release-decision-stale-lot)"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /lots/{id}/release-decision"
  - priority: 7
    category: state
    check: "expected_qualification_version equals ProductQualification.version (concurrency_rules.qualification-supersede-stale)"
    error_id: ERR_STALE_QUALIFICATION_VERSION
    http_status: 412
    applies_to: "POST /product-qualifications/{id}/supersede"

  # ---- 8: state preconditions ----------------------------------------------
  - priority: 8
    category: state
    check: "ProductQualification.status permits the requested transition per state_machines.ProductQualification"
    error_id: ERR_INVALID_QUALIFICATION_STATE
    http_status: 409
    applies_to: "POST /product-qualifications/{id}/submit, POST /product-qualifications/{id}/validation-runs, POST /product-qualifications/{id}/decision, POST /product-qualifications/{id}/supersede"
  - priority: 8
    category: state
    check: "Lot.custody_state permits the requested transition (inspect needs AT_DOCK; ship needs TREATED; a load needs IN_COLD_STORAGE; a release decision needs TREATED)"
    error_id: ERR_INVALID_LOT_CUSTODY_STATE
    http_status: 409
    applies_to: "POST /lots/{id}/inspect, POST /lots/{id}/ship, POST /lots/{id}/release-decision, POST /vessel-cycles/{id}/loads"
  - priority: 8
    category: state
    check: "Lot.release_state permits the requested decision: RELEASE and REJECT accept NOT_RELEASED or ON_HOLD_FOR_TEST, HOLD_FOR_TEST accepts only NOT_RELEASED, and a lot already RELEASED or REJECTED accepts nothing"
    error_id: ERR_INVALID_LOT_RELEASE_STATE
    http_status: 409
    applies_to: "POST /lots/{id}/release-decision"
  - priority: 8
    category: state
    check: "VesselCycle.state permits the requested transition (loads need SCHEDULED or LOADED; start needs SCHEDULED or LOADED, a SCHEDULED cycle always having zero loads and therefore falling to priority 11's ERR_EMPTY_CYCLE; a cycle log needs RUNNING; terminate needs SCHEDULED, LOADED or RUNNING; disposition needs COMPLETED_CLEAN or COMPLETED_DEVIATED)"
    error_id: ERR_INVALID_CYCLE_STATE
    http_status: 409
    applies_to: "POST /vessel-cycles/{id}/loads, POST /vessel-cycles/{id}/start, POST /vessel-cycles/{id}/cycle-logs, POST /vessel-cycles/{id}/terminate, POST /vessel-cycles/{id}/disposition"
  - priority: 8
    category: state
    check: "CapacityContract.status permits the operation: activate needs DRAFT, close needs ACTIVE or EXHAUSTED, and a load's contract must not be DRAFT or CLOSED"
    error_id: ERR_INVALID_CONTRACT_STATE
    http_status: 409
    applies_to: "POST /capacity-contracts/{id}/activate, POST /capacity-contracts/{id}/close, POST /vessel-cycles/{id}/loads"
  - priority: 8
    category: state
    check: "Deviation.status == OPEN"
    error_id: ERR_INVALID_DEVIATION_STATE
    http_status: 409
    applies_to: "POST /deviations/{id}/adjudicate"
  - priority: 8
    category: state
    check: "ChargebackLine.status == PENDING"
    error_id: ERR_INVALID_CHARGEBACK_STATE
    http_status: 409
    applies_to: "POST /chargeback-lines/{id}/waive"
  - priority: 8
    category: state
    check: "no CycleLog exists for this cycle yet; the CCP record is written exactly once per cycle"
    error_id: ERR_DUPLICATE_CYCLE_LOG
    http_status: 409
    applies_to: "POST /vessel-cycles/{id}/cycle-logs"
  - priority: 8
    category: state
    check: "no CycleLoad with disposition_state != VOIDED already references this lot_id on this cycle"
    error_id: ERR_DUPLICATE_CYCLE_LOAD
    http_status: 409
    applies_to: "POST /vessel-cycles/{id}/loads"
  - priority: 8
    category: state
    check: "the parent VesselCycle has reached DISPOSITIONED, so allocated_fee_cents is frozen before any leaker chargeback is computed"
    error_id: ERR_CYCLE_NOT_DISPOSITIONED
    http_status: 409
    applies_to: "POST /cycle-loads/{id}/inspection"
  - priority: 8
    category: state
    check: "CycleLoad.inspection_state == PENDING_INSPECTION"
    error_id: ERR_LOAD_ALREADY_INSPECTED
    http_status: 409
    applies_to: "POST /cycle-loads/{id}/inspection"
  - priority: 8
    category: state
    check: "no Deviation on the relevant cycle still has status == OPEN"
    error_id: ERR_DEVIATION_UNRESOLVED
    http_status: 409
    applies_to: "POST /vessel-cycles/{id}/disposition, POST /lots/{id}/release-decision"
  - priority: 8
    category: state
    check: "the pallet's most recent non-VOIDED CycleLoad belongs to a VesselCycle that has reached DISPOSITIONED, so the fee and the load outcome are frozen before quality releases the pallet; evaluated AFTER the ERR_DEVIATION_UNRESOLVED row above, so an open deviation is reported first"
    error_id: ERR_CYCLE_NOT_DISPOSITIONED
    http_status: 409
    applies_to: "POST /lots/{id}/release-decision"
  - priority: 8
    category: state
    check: "Lot.release_state == RELEASED before the pallet may leave the site"
    error_id: ERR_LOT_NOT_RELEASED
    http_status: 409
    applies_to: "POST /lots/{id}/ship"

  # ---- 9: food-safety and compliance rules (outrank every constraint) ------
  - priority: 9
    category: business_safety
    check: "revision_round <= MAX_REVISION_ROUNDS (3) when re-submitting from CHANGES_REQUESTED"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /product-qualifications/{id}/submit"
  - priority: 9
    category: business_safety
    check: "validation_run_acceptable_count >= MIN_ACCEPTABLE_VALIDATION_RUNS (2) before QUALIFY"
    error_id: ERR_INSUFFICIENT_VALIDATION_RUNS
    http_status: 422
    applies_to: "POST /product-qualifications/{id}/decision"
  - priority: 9
    category: business_safety
    check: "package_format != GLASS before QUALIFY; glass is never HPP-suitable"
    error_id: ERR_PACKAGE_FORMAT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /product-qualifications/{id}/decision"
  - priority: 9
    category: business_safety
    check: "package_burst_pressure_mpa > pressure_mpa before QUALIFY"
    error_id: ERR_BURST_PRESSURE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /product-qualifications/{id}/decision"
  - priority: 9
    category: business_safety
    check: "package_suitability_score >= MIN_PACKAGE_SUITABILITY_SCORE (70.00) before QUALIFY; listed AFTER the GLASS and burst-margin rows above because a disqualifying format or a zero burst margin necessarily drags the composite score under 70, so the specific defect must be reported first"
    error_id: ERR_PACKAGE_NOT_SUITABLE
    http_status: 422
    applies_to: "POST /product-qualifications/{id}/decision"
  - priority: 9
    category: business_safety
    check: "the lot's ProductQualification.status == QUALIFIED"
    error_id: ERR_QUALIFICATION_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/loads"
  - priority: 9
    category: business_safety
    check: "the lot's ProductQualification.expires_at > logical clock now"
    error_id: ERR_QUALIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/loads"
  - priority: 9
    category: business_safety
    check: "the lot's qualification.product_family_id == cycle.product_family_id; a cycle runs one family only, to avoid cross-contamination"
    error_id: ERR_FAMILY_MISMATCH
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/loads"
  - priority: 9
    category: business_safety
    check: "inbound cold chain intact: carrier_temp_c at receipt and pulp_temp_c at inspection are both <= product_family.max_receipt_temp_c"
    error_id: ERR_COLD_CHAIN_BREACH
    http_status: 422
    applies_to: "POST /lots, POST /lots/{id}/inspect"
  - priority: 9
    category: business_safety
    check: "outbound_temp_c <= product_family.max_outbound_temp_c"
    error_id: ERR_OUTBOUND_TEMP_BREACH
    http_status: 422
    applies_to: "POST /lots/{id}/ship"
  - priority: 9
    category: business_safety
    check: "the lot's segregation_group is listed in cold_room.allowed_family_groups"
    error_id: ERR_SEGREGATION_ZONE_VIOLATION
    http_status: 422
    applies_to: "POST /lots"
  - priority: 9
    category: business_safety
    check: "when product_family.requires_dedicated_cycle, every non-VOIDED load already on the cycle belongs to the same Customer as this lot"
    error_id: ERR_DEDICATED_CYCLE_REQUIRED
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/loads"
  - priority: 9
    category: business_safety
    check: "cycle.target_pressure_mpa >= max(qualification.pressure_mpa) and cycle.target_hold_seconds >= max(qualification.hold_time_seconds) over the loaded lots"
    error_id: ERR_CYCLE_TARGET_BELOW_QUALIFIED
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/start"
  - priority: 9
    category: business_safety
    check: "vessel.status == AVAILABLE"
    error_id: ERR_VESSEL_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/start"
  - priority: 9
    category: business_safety
    check: "the adjudicating X-User-ID differs from cycle_log.logged_by_user_id (segregation of duties: the operator who signed the CCP record may not judge it)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /deviations/{id}/adjudicate"
  - priority: 9
    category: business_safety
    check: "when release_state == ON_HOLD_FOR_TEST, the releasing X-User-ID differs from every adjudicated_by_user_id on that cycle's deviations (four-eyes)"
    error_id: ERR_FOUR_EYES_REQUIRED
    http_status: 403
    applies_to: "POST /lots/{id}/release-decision"
  - priority: 9
    category: business_safety
    check: "disposition == ACCEPT is refused when severity == CRITICAL"
    error_id: ERR_DEVIATION_ACCEPT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /deviations/{id}/adjudicate"
  - priority: 9
    category: business_safety
    check: "disposition IN {REPROCESS, REJECT} is refused when cycle_load_id is not null; a PACKAGE_FAILURE_RATE deviation is raised after the fee is already allocated and can only be accepted"
    error_id: ERR_DEVIATION_DISPOSITION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /deviations/{id}/adjudicate"

  # ---- 10: uniqueness ------------------------------------------------------
  - priority: 10
    category: business_constraint
    check: "Customer.code is unique"
    error_id: ERR_DUPLICATE_CUSTOMER_CODE
    http_status: 409
    applies_to: "POST /customers"
  - priority: 10
    category: business_constraint
    check: "ProductFamily.family_code is unique"
    error_id: ERR_DUPLICATE_FAMILY_CODE
    http_status: 409
    applies_to: "POST /product-families"
  - priority: 10
    category: business_constraint
    check: "Vessel.vessel_code is unique"
    error_id: ERR_DUPLICATE_VESSEL_CODE
    http_status: 409
    applies_to: "POST /vessels"
  - priority: 10
    category: business_constraint
    check: "ColdRoom.room_code is unique"
    error_id: ERR_DUPLICATE_ROOM_CODE
    http_status: 409
    applies_to: "POST /cold-rooms"
  - priority: 10
    category: business_constraint
    check: "(customer_id, sku_code, version_label) is unique across ProductQualification"
    error_id: ERR_DUPLICATE_QUALIFICATION_VERSION
    http_status: 409
    applies_to: "POST /product-qualifications, POST /product-qualifications/{id}/supersede"
  - priority: 10
    category: business_constraint
    check: "(customer_id, season_code) is unique across CapacityContract"
    error_id: ERR_DUPLICATE_CONTRACT_SEASON
    http_status: 409
    applies_to: "POST /capacity-contracts"
  - priority: 10
    category: business_constraint
    check: "(customer_id, pallet_ref) is unique across Lot"
    error_id: ERR_DUPLICATE_PALLET_REF
    http_status: 409
    applies_to: "POST /lots"

  # ---- 11: instantaneous capacity and quantity constraints -----------------
  - priority: 11
    category: business_constraint
    check: "target_pressure_mpa <= vessel.max_pressure_mpa"
    error_id: ERR_PRESSURE_ABOVE_VESSEL_MAX
    http_status: 422
    applies_to: "POST /vessel-cycles"
  - priority: 11
    category: business_constraint
    check: "baskets_used_total + baskets_used <= vessel.basket_count"
    error_id: ERR_BASKET_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/loads"
  - priority: 11
    category: business_constraint
    check: "units_loaded <= lot.units_untreated"
    error_id: ERR_INSUFFICIENT_UNTREATED_UNITS
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/loads"
  - priority: 11
    category: business_constraint
    check: "at least one CycleLoad with disposition_state == PENDING exists; an empty chamber is never pressurised"
    error_id: ERR_EMPTY_CYCLE
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/start"
  - priority: 11
    category: business_constraint
    check: "leaker_units <= units_inspected"
    error_id: ERR_LEAKERS_EXCEED_INSPECTED
    http_status: 422
    applies_to: "POST /cycle-loads/{id}/inspection"
  - priority: 11
    category: business_constraint
    check: "cold_room.capacity_state == NORMAL at this instant (derived posture gate)"
    error_id: ERR_COLD_ROOM_AT_CAPACITY
    http_status: 409
    applies_to: "POST /lots, POST /lots/{id}/inspect"

  # ---- 12: aggregate interval capacity ------------------------------------
  - priority: 12
    category: business_constraint
    check: "declared occupancy over the closed interval [now, ship_by] never exceeds cold_room.capacity_pallets at any interval start point (calculations.cold_room_interval_occupancy)"
    error_id: ERR_COLD_ROOM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /lots"

  # ---- 13: temporal conflicts ---------------------------------------------
  - priority: 13
    category: business_temporal
    check: "the half-open window [scheduled_start, scheduled_end) does not overlap another non-terminated cycle on the same vessel"
    error_id: ERR_VESSEL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /vessel-cycles"
  - priority: 13
    category: business_temporal
    check: "the gap to the nearest neighbouring cycle on each side is >= max(cleanout_minutes of both families) * 60 seconds when their cross_contamination_group values differ"
    error_id: ERR_CLEANOUT_GAP_REQUIRED
    http_status: 409
    applies_to: "POST /vessel-cycles"
  - priority: 13
    category: business_temporal
    check: "cycle.scheduled_start falls inside the contract's inclusive [window_start, window_end]"
    error_id: ERR_CONTRACT_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /vessel-cycles/{id}/loads"

  # ---- 14: fiscal capacity (always last) ----------------------------------
  - priority: 14
    category: business_fiscal
    check: "contract.available_slots >= 1 (calculations.contract_slot_ledger)"
    error_id: ERR_CONTRACT_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /vessel-cycles/{id}/loads"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- reference data -------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "register a tolling customer (brand owner)"
    roles: [FacilityAdmin]
    code: 201
    input: [name, code, billing_email]
    output: Customer
    side_effects: ["trailing_leaker_ppm = 0", "chargeback_balance_cents = 0"]
  - method: GET
    path: "/customers/{id}"
    description: "read a customer with its trailing leaker rate and chargeback balance"
    roles: [FacilityAdmin, QualityManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/product-families"
    description: "define a product family with its sanitation group and cold-chain limits"
    roles: [FacilityAdmin]
    code: 201
    input: [family_code, cross_contamination_group, cleanout_minutes, max_receipt_temp_c, max_outbound_temp_c, "requires_dedicated_cycle?"]
    output: ProductFamily
    side_effects: []
  - method: GET
    path: "/product-families/{id}"
    description: "read a product family"
    roles: [FacilityAdmin, PlantScheduler, QualityManager, PlantOperator]
    code: 200
    input: []
    output: ProductFamily
    side_effects: []

  - method: POST
    path: "/vessels"
    description: "commission an HPP vessel"
    roles: [FacilityAdmin]
    code: 201
    input: [vessel_code, chamber_volume_liters, max_pressure_mpa, pump_ramp_rate_mpa_per_sec, decompression_seconds, basket_count, hourly_operating_cost_cents]
    output: Vessel
    side_effects: ["status = AVAILABLE", "cycles_run_count = 0"]
  - method: PATCH
    path: "/vessels/{id}"
    description: "take a vessel out of service or return it to service; status accepts only AVAILABLE, MAINTENANCE or DOWN (IN_USE is set by the system when a cycle starts)"
    roles: [FacilityAdmin]
    code: 200
    input: [status]
    output: Vessel
    side_effects: ["version += 1"]
  - method: GET
    path: "/vessels/{id}"
    description: "read a vessel with its live status and cycle counter"
    roles: [FacilityAdmin, PlantScheduler, PlantOperator, QualityManager]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  - method: POST
    path: "/cold-rooms"
    description: "define a cold room with its pallet capacity and permitted segregation groups"
    roles: [FacilityAdmin]
    code: 201
    input: [room_code, capacity_pallets, setpoint_c, allowed_family_groups]
    output: ColdRoom
    side_effects: ["occupied_pallets = 0", "capacity_state = NORMAL"]
  - method: GET
    path: "/cold-rooms/{id}"
    description: "read a cold room with its occupancy and derived capacity posture"
    roles: [FacilityAdmin, PlantOperator, QualityManager]
    code: 200
    input: []
    output: ColdRoom
    side_effects: []

  # ---- product qualification ------------------------------------------------
  - method: POST
    path: "/product-qualifications"
    description: "open a DRAFT qualification for a customer SKU"
    roles: [Customer]
    code: 201
    input: [customer_id, product_family_id, sku_code, version_label, pressure_mpa, hold_time_seconds, max_water_temp_c, package_format, package_burst_pressure_mpa, film_thickness_micron, target_log_reduction, "supersedes_qualification_id?"]
    output: ProductQualification
    side_effects: ["package_suitability_score computed (calculations.qualification_package_suitability_score)", "status = DRAFT", "revision_round = 0"]
  - method: POST
    path: "/product-qualifications/{id}/supersede"
    description: "open a revision of a QUALIFIED qualification; the response is the NEW DRAFT row and the source row moves to SUPERSEDED"
    roles: [Customer]
    code: 201
    input: [expected_qualification_version, sku_code, version_label, pressure_mpa, hold_time_seconds, max_water_temp_c, package_format, package_burst_pressure_mpa, film_thickness_micron, target_log_reduction]
    output: ProductQualification
    side_effects: ["create a DRAFT ProductQualification with supersedes_qualification_id = path id, inheriting customer_id and product_family_id", "source row status QUALIFIED -> SUPERSEDED", "increments ProductQualification.version by 1 on the source row"]
  - method: POST
    path: "/product-qualifications/{id}/submit"
    description: "submit a DRAFT or CHANGES_REQUESTED qualification for validation"
    roles: [Customer]
    code: 200
    input: []
    output: ProductQualification
    side_effects: ["status -> SUBMITTED", "version += 1"]
  - method: POST
    path: "/product-qualifications/{id}/validation-runs"
    description: "append an immutable lab validation run; the first run moves the qualification to UNDER_VALIDATION"
    roles: [QualityManager]
    code: 201
    input: [measured_pressure_mpa, measured_hold_time_seconds, achieved_log_reduction, package_integrity_result, units_tested, leaker_count]
    output: ValidationRun
    side_effects: ["run_verdict computed", "ProductQualification.validation_run_acceptable_count recomputed", "status SUBMITTED -> UNDER_VALIDATION on the first run", "ProductQualification.version += 1"]
  - method: GET
    path: "/product-qualifications/{id}/validation-runs"
    description: "list the validation runs of a qualification"
    roles: [QualityManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: ValidationRun[]
    side_effects: []
  - method: POST
    path: "/product-qualifications/{id}/decision"
    description: "record the qualification decision; outcome is QUALIFY or REQUEST_CHANGES"
    roles: [QualityManager]
    code: 200
    input: [outcome, "decision_note?"]
    output: ProductQualification
    side_effects: ["QUALIFY: status -> QUALIFIED, qualified_at = now, expires_at = qualified_at + 365 days", "REQUEST_CHANGES: status -> CHANGES_REQUESTED, revision_round += 1", "version += 1"]
  - method: GET
    path: "/product-qualifications/{id}"
    description: "read a qualification with its suitability score and acceptable-run count"
    roles: [Customer, QualityManager, PlantScheduler]
    code: 200
    input: []
    output: ProductQualification
    side_effects: []
  - method: GET
    path: "/product-qualifications"
    description: "list qualifications, filterable by customer, family, superseded predecessor and status"
    roles: [Customer, QualityManager, PlantScheduler, FacilityAdmin]
    code: 200
    input: ["customer_id?", "product_family_id?", "supersedes_qualification_id?", "status?", "limit?", "offset?"]
    output: ProductQualification[]
    side_effects: []

  # ---- capacity contracts ---------------------------------------------------
  - method: POST
    path: "/capacity-contracts"
    description: "create a DRAFT seasonal capacity allocation contract"
    roles: [FacilityAdmin]
    code: 201
    input: [customer_id, season_code, window_start, window_end, committed_slots, slot_take_or_pay_cents, priority_rank, peak_window_start, peak_window_end, peak_multiplier]
    output: CapacityContract
    side_effects: ["status = DRAFT", "reserved_slots = 0", "consumed_slots = 0", "available_slots = committed_slots"]
  - method: POST
    path: "/capacity-contracts/{id}/activate"
    description: "activate a DRAFT contract so its slots become bookable"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: CapacityContract
    side_effects: ["status DRAFT -> ACTIVE", "version += 1"]
  - method: POST
    path: "/capacity-contracts/{id}/close"
    description: "close a contract and settle take-or-pay"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: CapacityContract
    side_effects: ["shortfall_slots and take_or_pay_cents frozen (calculations.contract_take_or_pay_shortfall)", "ChargebackLine (basis TAKE_OR_PAY_SHORTFALL) created when take_or_pay_cents > 0", "Customer.chargeback_balance_cents recomputed", "status -> CLOSED", "version += 1"]
  - method: GET
    path: "/capacity-contracts/{id}"
    description: "read a contract with its live slot ledger"
    roles: [FacilityAdmin, Customer, PlantScheduler]
    code: 200
    input: []
    output: CapacityContract
    side_effects: []
  - method: GET
    path: "/capacity-contracts"
    description: "list contracts, filterable by customer, season and status"
    roles: [FacilityAdmin, Customer, PlantScheduler]
    code: 200
    input: ["customer_id?", "season_code?", "status?", "limit?", "offset?"]
    output: CapacityContract[]
    side_effects: []

  # ---- receipt, storage, release, shipping ---------------------------------
  - method: POST
    path: "/lots"
    description: "receive an incoming pallet at the dock and reserve a cold-room position for it"
    roles: [PlantOperator]
    code: 201
    input: [customer_id, qualification_id, cold_room_id, pallet_ref, unit_count, gross_weight_kg, carrier_temp_c, ship_by]
    output: Lot
    side_effects: ["segregation_group snapshotted from the family behind qualification_id", "units_untreated = unit_count", "custody_state = AT_DOCK", "release_state = NOT_RELEASED", "cold-room interval occupancy checked (calculations.cold_room_interval_occupancy)"]
  - method: POST
    path: "/lots/{id}/inspect"
    description: "record the dock inspection; outcome is ACCEPT (into cold storage) or REJECT (refused at the door)"
    roles: [PlantOperator]
    code: 200
    input: [outcome, pulp_temp_c]
    output: Lot
    side_effects: ["ACCEPT: custody_state -> IN_COLD_STORAGE, ColdRoom.occupied_pallets += 1, ColdRoom.capacity_state recomputed", "REJECT: custody_state -> REJECTED_AT_DOCK, units_untreated -> units_disposed", "version += 1"]
  - method: POST
    path: "/lots/{id}/release-decision"
    description: "record the quality release decision; outcome is RELEASE, HOLD_FOR_TEST or REJECT"
    roles: [QualityManager]
    code: 200
    input: [outcome, expected_lot_version, "hold_reason?"]
    output: Lot
    side_effects: ["RELEASE: release_state -> RELEASED, released_by_user_id = X-User-ID", "HOLD_FOR_TEST: release_state -> ON_HOLD_FOR_TEST, hold_reason stored", "REJECT: release_state -> REJECTED and custody_state TREATED -> DISPOSED with the cold-room cascade", "increments Lot.version by 1"]
  - method: POST
    path: "/lots/{id}/ship"
    description: "release the pallet to an outbound truck under cold chain"
    roles: [PlantOperator]
    code: 200
    input: [outbound_temp_c, "carrier_name?"]
    output: Lot
    side_effects: ["custody_state TREATED -> SHIPPED", "ColdRoom.occupied_pallets -= 1 and capacity_state recomputed", "version += 1"]
  - method: GET
    path: "/lots/{id}"
    description: "read a pallet with both state dimensions and its unit ledger"
    roles: [PlantOperator, QualityManager, Customer, PlantScheduler]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/lots"
    description: "list pallets, filterable by customer, qualification, cold room and either state dimension"
    roles: [PlantOperator, QualityManager, Customer, PlantScheduler]
    code: 200
    input: ["customer_id?", "qualification_id?", "cold_room_id?", "custody_state?", "release_state?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  # ---- vessel cycles --------------------------------------------------------
  - method: POST
    path: "/vessel-cycles"
    description: "schedule a vessel cycle for one product family, respecting vessel occupancy and cleanout buffers"
    roles: [PlantScheduler]
    code: 201
    input: [vessel_id, product_family_id, scheduled_start, target_pressure_mpa, target_hold_seconds]
    output: VesselCycle
    side_effects: ["estimated_cycle_seconds, scheduled_end, utilization_pct and estimated_tolling_fee_cents computed (ESTIMATED variant)", "window overlap and cleanout gap validated (calculations.vessel_schedule_window_and_cleanout_gap)", "state = SCHEDULED"]
  - method: POST
    path: "/vessel-cycles/{id}/loads"
    description: "book a pallet's units onto a scheduled cycle against a capacity contract slot"
    roles: [PlantScheduler]
    code: 201
    input: [lot_id, contract_id, baskets_used, units_loaded, expected_cycle_version]
    output: CycleLoad
    side_effects: ["create CycleLoad (disposition_state PENDING, inspection_state PENDING_INSPECTION)", "cycle state SCHEDULED -> LOADED, baskets_used_total / utilization_pct / estimated_cycle_seconds / estimated_tolling_fee_cents / scheduled_end recomputed", "CapacityContract.reserved_slots += 1 and available_slots recomputed; status ACTIVE -> EXHAUSTED when available_slots reaches 0", "increments VesselCycle.version by 1"]
  - method: POST
    path: "/vessel-cycles/{id}/start"
    description: "pressurise the chamber and move the cycle to RUNNING"
    roles: [PlantOperator]
    code: 200
    input: []
    output: VesselCycle
    side_effects: ["state LOADED -> RUNNING, started_at = now", "Vessel.status AVAILABLE -> IN_USE", "each loaded Lot: custody_state IN_COLD_STORAGE -> IN_VESSEL, units_untreated -> units_in_vessel", "version += 1"]
  - method: POST
    path: "/vessel-cycles/{id}/cycle-logs"
    description: "capture the critical control point record for the cycle exactly once; the computed ccp_verdict decides which branch the cycle takes"
    roles: [PlantOperator]
    code: 201
    input: [actual_pressure_mpa, actual_hold_seconds, come_up_seconds, water_temp_c]
    output: CycleLog
    side_effects: ["append immutable CycleLog with ccp_verdict, deviation_flags and logged_by_user_id (calculations.ccp_verdict_and_deviation_severity)", "cycle state RUNNING -> COMPLETED_CLEAN or COMPLETED_DEVIATED; VesselCycle.actual_cycle_seconds set", "Vessel.status IN_USE -> AVAILABLE, Vessel.cycles_run_count += 1", "each loaded Lot: custody_state IN_VESSEL -> TREATED, units_in_vessel -> units_treated", "DEVIATION branch only: create Deviation (status OPEN) and move every loaded Lot to release_state ON_HOLD_FOR_TEST", "VesselCycle.version += 1"]
  - method: GET
    path: "/vessel-cycles/{id}/cycle-logs"
    description: "list the CCP records of a cycle (0 or 1 rows)"
    roles: [PlantOperator, QualityManager, FacilityAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CycleLog[]
    side_effects: []
  - method: POST
    path: "/vessel-cycles/{id}/terminate"
    description: "cancel a cycle that has not started, or abort a RUNNING cycle; both compensate every reservation made so far"
    roles: [PlantScheduler, PlantOperator]
    code: 200
    input: [reason]
    output: VesselCycle
    side_effects: ["SCHEDULED -> CANCELLED, LOADED -> CANCELLED, RUNNING -> ABORTED", "every CycleLoad disposition_state PENDING -> VOIDED", "RUNNING only: each Lot units_in_vessel -> units_untreated and custody_state IN_VESSEL -> IN_COLD_STORAGE; Vessel.status IN_USE -> AVAILABLE", "CapacityContract slot ledger recomputed; status EXHAUSTED -> ACTIVE when available_slots >= 1", "version += 1"]
  - method: POST
    path: "/vessel-cycles/{id}/disposition"
    description: "close out a completed cycle, freeze the actual tolling fee and allocate it across the loads"
    roles: [QualityManager]
    code: 200
    input: []
    output: VesselCycle
    side_effects: ["actual_tolling_fee_cents computed (ACTUAL variant of calculations.cycle_time_and_tolling_fee)", "CycleLoad.allocated_fee_cents written (calculations.cycle_fee_allocation_across_loads)", "each load disposition_state PENDING -> ALLOCATED, moving one contract slot from reserved_slots to consumed_slots", "state -> DISPOSITIONED, dispositioned_at = now", "version += 1"]
  - method: GET
    path: "/vessel-cycles/{id}"
    description: "read a cycle with both fee variants and its utilization"
    roles: [PlantScheduler, PlantOperator, QualityManager, FacilityAdmin, Customer]
    code: 200
    input: []
    output: VesselCycle
    side_effects: []
  - method: GET
    path: "/vessel-cycles"
    description: "list cycles, filterable by vessel, family and state"
    roles: [PlantScheduler, PlantOperator, QualityManager, FacilityAdmin]
    code: 200
    input: ["vessel_id?", "product_family_id?", "state?", "scheduled_from?", "scheduled_to?", "limit?", "offset?"]
    output: VesselCycle[]
    side_effects: []

  # ---- package inspection, deviations, money ------------------------------
  - method: POST
    path: "/cycle-loads/{id}/inspection"
    description: "record post-cycle package inspection counts for one load and apply the leaker chargeback rules"
    roles: [QualityManager]
    code: 200
    input: [units_inspected, leaker_units]
    output: CycleLoad
    side_effects: ["leaker_ppm and chargeback_party computed (INSTANTANEOUS_LOAD variant of calculations.customer_package_failure_risk)", "chargeback_cents computed and a ChargebackLine (basis PACKAGE_LEAKER) created when chargeback_party == CUSTOMER (calculations.load_package_chargeback_amount)", "Customer.chargeback_balance_cents recomputed", "a Deviation (deviation_type PACKAGE_FAILURE_RATE, severity MAJOR, status OPEN) is raised when leaker_ppm >= 3000", "inspection_state -> INSPECTED", "version += 1"]
  - method: GET
    path: "/cycle-loads/{id}"
    description: "read a load with its allocated fee, leaker rate and chargeback outcome"
    roles: [QualityManager, PlantScheduler, FacilityAdmin, Customer]
    code: 200
    input: []
    output: CycleLoad
    side_effects: []
  - method: GET
    path: "/cycle-loads"
    description: "list loads, filterable by cycle, lot, contract and either load state"
    roles: [QualityManager, PlantScheduler, FacilityAdmin, Customer]
    code: 200
    input: ["cycle_id?", "lot_id?", "contract_id?", "inspection_state?", "disposition_state?", "limit?", "offset?"]
    output: CycleLoad[]
    side_effects: []

  - method: POST
    path: "/deviations/{id}/adjudicate"
    description: "adjudicate an open deviation; disposition is ACCEPT, REPROCESS or REJECT"
    roles: [QualityManager]
    code: 200
    input: [disposition, root_cause_code]
    output: Deviation
    side_effects: ["status -> ADJUDICATED_ACCEPT | ADJUDICATED_REPROCESS | ADJUDICATED_REJECT; adjudicated_by_user_id and adjudicated_at stamped; chargeback_party derived from root_cause_code", "REPROCESS: cycle -> DISPOSITIONED, loads -> REPROCESSED, lots returned to the untreated pool, ChargebackLine (basis REPROCESS) created when chargeback_party == CUSTOMER", "REJECT: cycle -> DISPOSITIONED with actual_tolling_fee_cents = 0, loads -> REJECTED with allocated_fee_cents = 0, lots -> DISPOSED and release_state REJECTED, cold-room occupancy and posture recomputed", "version += 1"]
  - method: GET
    path: "/deviations/{id}"
    description: "read a deviation with its severity and adjudication trail"
    roles: [QualityManager, FacilityAdmin, PlantOperator, Customer]
    code: 200
    input: []
    output: Deviation
    side_effects: []
  - method: GET
    path: "/deviations"
    description: "list deviations, filterable by cycle, CCP record, load, severity and status"
    roles: [QualityManager, FacilityAdmin, PlantOperator, Customer]
    code: 200
    input: ["cycle_id?", "cycle_log_id?", "cycle_load_id?", "deviation_type?", "severity?", "status?", "limit?", "offset?"]
    output: Deviation[]
    side_effects: []

  - method: POST
    path: "/chargeback-lines/{id}/waive"
    description: "waive a pending chargeback line as a commercial gesture"
    roles: [FacilityAdmin]
    code: 200
    input: [waive_reason]
    output: ChargebackLine
    side_effects: ["status PENDING -> WAIVED, waived_by_user_id stamped", "Customer.chargeback_balance_cents drops by exactly amount_cents", "version += 1"]
  - method: GET
    path: "/chargeback-lines/{id}"
    description: "read a chargeback line"
    roles: [FacilityAdmin, QualityManager, Customer]
    code: 200
    input: []
    output: ChargebackLine
    side_effects: []
  - method: GET
    path: "/chargeback-lines"
    description: "list chargeback lines, filterable by customer, load, contract, deviation, basis and status"
    roles: [FacilityAdmin, QualityManager, Customer]
    code: 200
    input: ["customer_id?", "cycle_load_id?", "contract_id?", "deviation_id?", "basis?", "status?", "limit?", "offset?"]
    output: ChargebackLine[]
    side_effects: []

  # ---- operational sweeps and test-driving surface -------------------------
  - method: POST
    path: "/operations/day-close"
    description: "run the end-of-day sweep: expire QUALIFIED qualifications whose expires_at has passed and recompute every Customer.trailing_leaker_ppm over the 90-day window"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: { expired_qualification_count: integer, customers_rescored: integer, closed_at: datetime }
    side_effects: ["ProductQualification QUALIFIED -> EXPIRED when expires_at <= now", "Customer.trailing_leaker_ppm recomputed (TRAILING_90D_CUSTOMER variant of calculations.customer_package_failure_risk)"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [FacilityAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["every subsequent now-dependent rule (expiry sweeps, trailing windows, cold-room intervals, cycle timestamps) reads the new instant"]

# =============================================================================
# §1.6 Error Code Catalog (67 codes)
# =============================================================================
errors:

  # ---- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role that is not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Customer acts on a qualification, contract, lot, load or chargeback line belonging to a different customer_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body or query: missing required field, wrong type, enum outside its domain, numeric bound violated, regex mismatch, window_end <= window_start, or pagination outside limit 1..100 / offset >= 0"

  # ---- existence -----------------------------------------------------------
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "path or body customer_id does not resolve to a Customer"
  - id: ERR_PRODUCT_FAMILY_NOT_FOUND
    http: 404
    condition: "path or body product_family_id does not resolve to a ProductFamily"
  - id: ERR_VESSEL_NOT_FOUND
    http: 404
    condition: "path or body vessel_id does not resolve to a Vessel"
  - id: ERR_COLD_ROOM_NOT_FOUND
    http: 404
    condition: "path or body cold_room_id does not resolve to a ColdRoom"
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "path id, qualification_id or supersedes_qualification_id does not resolve to a ProductQualification"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "path id or body contract_id does not resolve to a CapacityContract"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "path id or body lot_id does not resolve to a Lot"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a VesselCycle"
  - id: ERR_CYCLE_LOAD_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a CycleLoad"
  - id: ERR_DEVIATION_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a Deviation"
  - id: ERR_CHARGEBACK_LINE_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a ChargebackLine"

  # ---- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal the VesselCycle's current version on POST /vessel-cycles/{id}/loads"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not equal the Lot's current version on POST /lots/{id}/release-decision"
  - id: ERR_STALE_QUALIFICATION_VERSION
    http: 412
    condition: "expected_qualification_version does not equal the ProductQualification's current version on POST /product-qualifications/{id}/supersede"

  # ---- state preconditions -------------------------------------------------
  - id: ERR_INVALID_QUALIFICATION_STATE
    http: 409
    condition: "the qualification's status does not permit the requested submit, validation run, decision or supersede"
  - id: ERR_INVALID_LOT_CUSTODY_STATE
    http: 409
    condition: "the lot's custody_state does not permit the requested inspect, load, release decision or ship"
  - id: ERR_INVALID_LOT_RELEASE_STATE
    http: 409
    condition: "the lot's release_state does not permit the requested release decision (already RELEASED or REJECTED, or HOLD_FOR_TEST requested on a lot already on hold)"
  - id: ERR_INVALID_CYCLE_STATE
    http: 409
    condition: "the cycle's state does not permit the requested load, start, cycle log, terminate or disposition"
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "activate on a non-DRAFT contract, close on a DRAFT or CLOSED contract, or a load booked against a DRAFT or CLOSED contract"
  - id: ERR_INVALID_DEVIATION_STATE
    http: 409
    condition: "adjudicating a deviation that is not OPEN"
  - id: ERR_INVALID_CHARGEBACK_STATE
    http: 409
    condition: "waiving a chargeback line that is already WAIVED"
  - id: ERR_DUPLICATE_CYCLE_LOG
    http: 409
    condition: "a CycleLog already exists for this cycle; the CCP record is written exactly once"
  - id: ERR_DUPLICATE_CYCLE_LOAD
    http: 409
    condition: "a non-VOIDED CycleLoad on this cycle already references the same lot_id"
  - id: ERR_CYCLE_NOT_DISPOSITIONED
    http: 409
    condition: "package inspection, or a lot release decision, attempted before the parent cycle reached DISPOSITIONED, so allocated_fee_cents is not yet frozen"
  - id: ERR_LOAD_ALREADY_INSPECTED
    http: 409
    condition: "the load's inspection_state is already INSPECTED"
  - id: ERR_DEVIATION_UNRESOLVED
    http: 409
    condition: "a Deviation on the relevant cycle is still OPEN when disposition or release is attempted"
  - id: ERR_LOT_NOT_RELEASED
    http: 409
    condition: "shipping a lot whose release_state is not RELEASED"

  # ---- food-safety and compliance -----------------------------------------
  - id: ERR_REVISION_LIMIT_REACHED
    http: 422
    condition: "re-submitting from CHANGES_REQUESTED when revision_round already exceeds MAX_REVISION_ROUNDS (3)"
  - id: ERR_INSUFFICIENT_VALIDATION_RUNS
    http: 422
    condition: "QUALIFY with validation_run_acceptable_count < 2"
  - id: ERR_PACKAGE_NOT_SUITABLE
    http: 422
    condition: "QUALIFY with package_suitability_score < 70.00"
  - id: ERR_PACKAGE_FORMAT_NOT_PERMITTED
    http: 422
    condition: "QUALIFY with package_format == GLASS"
  - id: ERR_BURST_PRESSURE_INSUFFICIENT
    http: 422
    condition: "QUALIFY with package_burst_pressure_mpa <= pressure_mpa"
  - id: ERR_QUALIFICATION_NOT_QUALIFIED
    http: 422
    condition: "loading a pallet whose ProductQualification.status is not QUALIFIED"
  - id: ERR_QUALIFICATION_EXPIRED
    http: 422
    condition: "loading a pallet whose ProductQualification.expires_at is at or before the logical clock"
  - id: ERR_FAMILY_MISMATCH
    http: 422
    condition: "the pallet's qualification belongs to a different product family than the cycle"
  - id: ERR_COLD_CHAIN_BREACH
    http: 422
    condition: "carrier_temp_c at receipt or pulp_temp_c at inspection exceeds product_family.max_receipt_temp_c"
  - id: ERR_OUTBOUND_TEMP_BREACH
    http: 422
    condition: "outbound_temp_c exceeds product_family.max_outbound_temp_c at shipping"
  - id: ERR_SEGREGATION_ZONE_VIOLATION
    http: 422
    condition: "the pallet's segregation_group is not in the cold room's allowed_family_groups"
  - id: ERR_DEDICATED_CYCLE_REQUIRED
    http: 422
    condition: "co-mingling customers on a cycle whose product family has requires_dedicated_cycle true"
  - id: ERR_CYCLE_TARGET_BELOW_QUALIFIED
    http: 422
    condition: "start attempted with target_pressure_mpa or target_hold_seconds below the strictest loaded qualification"
  - id: ERR_VESSEL_NOT_AVAILABLE
    http: 422
    condition: "start attempted while the vessel is IN_USE, MAINTENANCE or DOWN"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the adjudicating user is the same operator who signed the cycle's CCP record"
  - id: ERR_FOUR_EYES_REQUIRED
    http: 403
    condition: "releasing a lot from ON_HOLD_FOR_TEST as the same user who adjudicated a deviation on that cycle"
  - id: ERR_DEVIATION_ACCEPT_NOT_PERMITTED
    http: 422
    condition: "ACCEPT requested on a CRITICAL deviation"
  - id: ERR_DEVIATION_DISPOSITION_NOT_PERMITTED
    http: 422
    condition: "REPROCESS or REJECT requested on a PACKAGE_FAILURE_RATE deviation, whose load fee is already allocated"

  # ---- uniqueness ----------------------------------------------------------
  - id: ERR_DUPLICATE_CUSTOMER_CODE
    http: 409
    condition: "Customer.code already exists"
  - id: ERR_DUPLICATE_FAMILY_CODE
    http: 409
    condition: "ProductFamily.family_code already exists"
  - id: ERR_DUPLICATE_VESSEL_CODE
    http: 409
    condition: "Vessel.vessel_code already exists"
  - id: ERR_DUPLICATE_ROOM_CODE
    http: 409
    condition: "ColdRoom.room_code already exists"
  - id: ERR_DUPLICATE_QUALIFICATION_VERSION
    http: 409
    condition: "(customer_id, sku_code, version_label) already exists on a ProductQualification"
  - id: ERR_DUPLICATE_CONTRACT_SEASON
    http: 409
    condition: "(customer_id, season_code) already exists on a CapacityContract"
  - id: ERR_DUPLICATE_PALLET_REF
    http: 409
    condition: "(customer_id, pallet_ref) already exists on a Lot"

  # ---- capacity and quantity constraints ----------------------------------
  - id: ERR_PRESSURE_ABOVE_VESSEL_MAX
    http: 422
    condition: "target_pressure_mpa exceeds vessel.max_pressure_mpa"
  - id: ERR_BASKET_CAPACITY_EXCEEDED
    http: 422
    condition: "baskets_used_total + baskets_used would exceed vessel.basket_count"
  - id: ERR_INSUFFICIENT_UNTREATED_UNITS
    http: 422
    condition: "units_loaded exceeds lot.units_untreated"
  - id: ERR_EMPTY_CYCLE
    http: 422
    condition: "start attempted on a cycle with no PENDING load"
  - id: ERR_LEAKERS_EXCEED_INSPECTED
    http: 422
    condition: "leaker_units exceeds units_inspected"
  - id: ERR_COLD_ROOM_AT_CAPACITY
    http: 409
    condition: "the cold room's derived capacity_state is AT_CAPACITY at the instant of receipt or dock acceptance"
  - id: ERR_COLD_ROOM_CAPACITY_EXCEEDED
    http: 409
    condition: "declared occupancy over the closed interval [now, ship_by] would exceed capacity_pallets at some interval start point"

  # ---- temporal conflicts --------------------------------------------------
  - id: ERR_VESSEL_WINDOW_CONFLICT
    http: 409
    condition: "the half-open cycle window overlaps another non-terminated cycle on the same vessel"
  - id: ERR_CLEANOUT_GAP_REQUIRED
    http: 409
    condition: "the gap to a neighbouring cycle of a different cross_contamination_group is shorter than max(cleanout_minutes) * 60 seconds"
  - id: ERR_CONTRACT_WINDOW_MISMATCH
    http: 422
    condition: "the cycle's scheduled_start falls outside the contract's inclusive window"

  # ---- fiscal --------------------------------------------------------------
  - id: ERR_CONTRACT_CAPACITY_EXHAUSTED
    http: 409
    condition: "the contract has no available_slots left"

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: Customer
    description: "brand owner who qualifies SKUs, holds capacity contracts and reads its own pallets, loads and chargeback lines"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /product-qualifications"
      - "POST /product-qualifications/{id}/supersede"
      - "POST /product-qualifications/{id}/submit"
    shared_operations:
      - "GET /product-qualifications/{id} and GET /product-qualifications (own rows only)"
      - "GET /product-qualifications/{id}/validation-runs"
      - "GET /capacity-contracts/{id}, GET /capacity-contracts"
      - "GET /lots/{id}, GET /lots"
      - "GET /vessel-cycles/{id}"
      - "GET /cycle-loads/{id}, GET /cycle-loads"
      - "GET /deviations/{id}, GET /deviations"
      - "GET /chargeback-lines/{id}, GET /chargeback-lines"
      - "GET /customers/{id}"
  - name: PlantScheduler
    description: "plans vessel cycles by product family and books contract slots onto them"
    identity: opaque
    exclusive_operations:
      - "POST /vessel-cycles"
      - "POST /vessel-cycles/{id}/loads"
    shared_operations:
      - "POST /vessel-cycles/{id}/terminate (shared with PlantOperator)"
      - "GET /vessels/{id}, GET /product-families/{id}, GET /product-qualifications, GET /capacity-contracts, GET /lots, GET /vessel-cycles, GET /cycle-loads"
  - name: PlantOperator
    description: "receives pallets, inspects at the dock, runs the vessel and signs the CCP cycle log, then ships released pallets"
    identity: opaque
    exclusive_operations:
      - "POST /lots"
      - "POST /lots/{id}/inspect"
      - "POST /lots/{id}/ship"
      - "POST /vessel-cycles/{id}/start"
      - "POST /vessel-cycles/{id}/cycle-logs"
    shared_operations:
      - "POST /vessel-cycles/{id}/terminate (shared with PlantScheduler)"
      - "GET /lots/{id}, GET /lots, GET /cold-rooms/{id}, GET /vessels/{id}, GET /vessel-cycles/{id}, GET /vessel-cycles/{id}/cycle-logs, GET /deviations"
    note: "the operator who signs a CCP record may never adjudicate the deviation it raises; that separation is enforced by ERR_SEGREGATION_OF_DUTIES"
  - name: QualityManager
    description: "owns validation runs, qualification decisions, cycle disposition, package inspection, deviation adjudication and lot release"
    identity: opaque
    exclusive_operations:
      - "POST /product-qualifications/{id}/validation-runs"
      - "POST /product-qualifications/{id}/decision"
      - "POST /vessel-cycles/{id}/disposition"
      - "POST /cycle-loads/{id}/inspection"
      - "POST /deviations/{id}/adjudicate"
      - "POST /lots/{id}/release-decision"
    shared_operations:
      - "GET /product-qualifications/{id}, GET /product-qualifications, GET /product-qualifications/{id}/validation-runs, GET /lots/{id}, GET /lots, GET /vessel-cycles/{id}, GET /vessel-cycles/{id}/cycle-logs, GET /cycle-loads/{id}, GET /cycle-loads, GET /deviations/{id}, GET /deviations, GET /chargeback-lines/{id}, GET /chargeback-lines, GET /customers/{id}, GET /cold-rooms/{id}, GET /vessels/{id}, GET /product-families/{id}"
    note: "two distinct QualityManager X-User-IDs are required to adjudicate a deviation and then release the affected lot (ERR_FOUR_EYES_REQUIRED)"
  - name: FacilityAdmin
    description: "sets up reference data and capacity contracts, waives chargeback lines, runs the day-close sweep and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /product-families"
      - "POST /vessels"
      - "PATCH /vessels/{id}"
      - "POST /cold-rooms"
      - "POST /capacity-contracts"
      - "POST /capacity-contracts/{id}/activate"
      - "POST /capacity-contracts/{id}/close"
      - "POST /chargeback-lines/{id}/waive"
      - "POST /operations/day-close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /customers/{id}, GET /product-families/{id}, GET /vessels/{id}, GET /cold-rooms/{id}, GET /product-qualifications, GET /capacity-contracts/{id}, GET /capacity-contracts, GET /vessel-cycles/{id}, GET /vessel-cycles, GET /vessel-cycles/{id}/cycle-logs, GET /cycle-loads/{id}, GET /cycle-loads, GET /deviations/{id}, GET /deviations, GET /chargeback-lines/{id}, GET /chargeback-lines"
