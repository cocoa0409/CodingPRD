      - name: tower_planned_to_maintenance_is_not_a_declared_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.Tower
          - errors[ERR_INVALID_TOWER_STATE]
        distinguishing_aspect: |
          MAINTENANCE is reachable only from ACTIVE, so asking a PLANNED tower to enter MAINTENANCE
          returns 409 ERR_INVALID_TOWER_STATE - and not ERR_BACKHAUL_NOT_ACCEPTED, even though this
          tower also has no ACCEPTED circuit, because the transition itself is undeclared.
        test_recipe:
          setup:
            - "One Tower RB-TWR-001 in status PLANNED with no BackhaulCircuit."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
          trigger:
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "MAINTENANCE", reason: "undeclared jump" }
              as: NetworkEngineer
              captures: { err_tower_state: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_tower_state} == \"ERR_INVALID_TOWER_STATE\""
            - "The response error_id is NOT \"ERR_BACKHAUL_NOT_ACCEPTED\""

      - name: backhaul_circuit_ordered_to_accepted_skips_a_state_and_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.BackhaulCircuit.INSTALLED_to_ACCEPTED
          - errors[ERR_INVALID_CIRCUIT_STATE]
        distinguishing_aspect: |
          ACCEPTED is reachable only from INSTALLED or DEGRADED, so an ORDERED -> ACCEPTED jump is
          refused with 409 ERR_INVALID_CIRCUIT_STATE even when measured_mbps is supplied - the state
          guard is checked before the measured_mbps body requirement.
        test_recipe:
          setup:
            - "One Tower RB-TWR-001 and one BackhaulCircuit still in its initial state ORDERED."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
          trigger:
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
              captures: { err_circuit_state: $.data.error_id }
            - call: "GET /backhaul-circuits/${circuit_id}"
              payload: {}
              as: NetworkEngineer
          assert:
            - "Trigger call 1: HTTP 409 and ${err_circuit_state} == \"ERR_INVALID_CIRCUIT_STATE\""
            - "GET: BackhaulCircuit.state == \"ORDERED\", measured_mbps is null, accepted_at is null, version == 1"
            - "Tower.backhaul_accepted_mbps is still 0"

      - name: new_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.BackhaulCircuit.initial_state
          - state_machines.InstallWorkOrder.initial_state
          - state_machines.OutageEvent.initial_state
          - state_machines.InterferenceCoordination.initial_state
        distinguishing_aspect: |
          Four machines are entered without any explicit state input: a fresh BackhaulCircuit reads
          ORDERED, a fresh OutageEvent reads OPEN with ended_at, duration_minutes and sla_excluded
          all still unresolved, and a fresh InterferenceCoordination reads REQUESTED at round_number
          1 - none of them accepts a caller-supplied starting state.
        test_recipe:
          setup:
            - "One Tower RB-TWR-001 in status PLANNED and one SpectrumLicense; two Sectors on two different Towers for the coordination."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
