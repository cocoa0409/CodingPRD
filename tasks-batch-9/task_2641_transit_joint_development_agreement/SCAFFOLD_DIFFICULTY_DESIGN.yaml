              payload: { solicitation_type: "RFQ", response_deadline: "2026-09-20T00:00:00Z", benchmark_value_cents: 48500000, affordable_housing_min_pct: 15, min_proposals_required: 1, joint_use_required: false }
              as: RealEstateOfficer
