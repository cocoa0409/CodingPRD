  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_version_beats_bath_occupied
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - concurrency_rules[load-start-stale-bath-version]
          - errors[ERR_STALE_VERSION]
          - errors[ERR_BATH_OCCUPIED]
        distinguishing_aspect: |
          Category pair (concurrency vs state): a load start carrying a stale expected_bath_version
          against a bath that is ALSO occupied by a RUNNING load must yield ERR_STALE_VERSION (412,
          priority 6), not ERR_BATH_OCCUPIED (409, priority 7). Pair distinct from the safety-vs-fiscal
          instance.
        test_recipe:
          setup:
            - "Customer C9; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; bath B9 titrated to 5.000 (version advances to 2)"
            - "WO9a routed to B9; bath version read (v2); WO9a load started (bath -> v3, occupied); WO9b routed to B9"
