    path: "/properties/{id}/inspections/{inspection_id}/complete"
    description: "Close an inspection's findings; required before quoting."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status DRAFT->COMPLETED; detected_individual_count refreshed."]
  - method: POST
    path: "/properties/{id}/inspections/{inspection_id}/cancel"
    description: "Cancel a draft inspection."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status DRAFT->CANCELLED."]

  # ---- EntryPoint (nested under Inspection) ----
  - method: POST
    path: "/inspections/{id}/entry-points"
    description: "Record an entry point (species, severity, estimated individuals)."
    roles: [Dispatcher, FieldTechnician]
    code: 201
    input: [species_id, location_label, "severity?", estimated_individuals]
    output: EntryPoint
    side_effects: ["Inspection.detected_individual_count += estimated_individuals; seal_status=OPEN."]
  - method: GET
    path: "/inspections/{id}/entry-points"
    description: "List an inspection's entry points (FK reverse-reachability for EntryPoint.inspection_id)."
    roles: [Dispatcher, PropertyOwner, ComplianceOfficer, FieldTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: EntryPoint[]
    side_effects: []
  - method: GET
    path: "/entry-points/{id}"
    description: "Fetch an entry point including seal_status."
    roles: [Dispatcher, PropertyOwner, ComplianceOfficer, FieldTechnician]
    code: 200
    input: []
    output: EntryPoint
    side_effects: []
  - method: GET
    path: "/entry-points"
    description: "List entry points; optional species_id filter (FK reverse-reachability for EntryPoint.species_id)."
    roles: [Dispatcher, ComplianceOfficer, FieldTechnician]
    code: 200
    input: ["species_id?", "limit?", "offset?"]
    output: EntryPoint[]
    side_effects: []

  # ---- Quote (created from a COMPLETED inspection; OCC parent = Inspection) ----
  - method: POST
    path: "/quotes"
    description: "Create a quote against a COMPLETED inspection. A new quote SUPERSEDES any prior non-terminal quote on the same inspection (CREATE-with-supersede; OCC on Inspection.version)."
    roles: [Dispatcher]
    code: 201
    input: [inspection_id, expected_inspection_version]
    output: Quote
    side_effects: ["status=DRAFT; emergency_flag copied from Inspection.is_emergency; any prior DRAFT/SENT/REVISION_REQUESTED quote on the inspection -> SUPERSEDED; increments Inspection.version by 1."]
  - method: GET
    path: "/quotes/{id}"
    description: "Fetch a quote with provisional/final totals."
    roles: [Dispatcher, PropertyOwner, ComplianceOfficer]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: GET
    path: "/quotes"
    description: "List quotes; optional inspection_id filter (FK reverse-reachability for Quote.inspection_id)."
    roles: [Dispatcher, PropertyOwner, ComplianceOfficer]
    code: 200
    input: ["inspection_id?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: POST
    path: "/quotes/{id}/line-items"
    description: "Add a line item to a DRAFT quote."
    roles: [Dispatcher]
    code: 201
    input: [species_id, line_type, quantity, unit_price_cents]
    output: QuoteLineItem
    side_effects: ["performed=false."]
  - method: GET
    path: "/quotes/{id}/line-items"
    description: "List a quote's line items (FK reverse-reachability for QuoteLineItem.quote_id)."
    roles: [Dispatcher, PropertyOwner, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: QuoteLineItem[]
    side_effects: []
  - method: GET
    path: "/line-items/{id}"
    description: "Fetch a single line item (lets the QuoteLineItem collection segment be resolved)."
    roles: [Dispatcher, ComplianceOfficer, PropertyOwner]
    code: 200
    input: []
    output: QuoteLineItem
    side_effects: []
  - method: GET
    path: "/line-items"
    description: "List line items; optional species_id filter (FK reverse-reachability for QuoteLineItem.species_id)."
    roles: [Dispatcher, ComplianceOfficer]
    code: 200
    input: ["species_id?", "limit?", "offset?"]
    output: QuoteLineItem[]
    side_effects: []
  - method: POST
    path: "/quotes/{id}/send"
    description: "Send a DRAFT quote to the owner; computes provisional_total_cents."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Quote
