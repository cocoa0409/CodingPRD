            - "a further POST /fleet/backhaul-offers/${offer_b1_id}/submit-review succeeds (PROPOSED -> UNDER_REVIEW) but the following revise is still refused with ERR_REVIEW_ROUND_LIMIT: the reversal did not reset the counter"

      - name: route_posting_award_trigger_forks_to_awarded_or_vacant_then_locks_down
        grounds:
          - state_machines.RoutePosting
          - state_machines.RouteBid
          - calculations.route_award_selection
          - endpoints[POST /fleet/route-postings/{posting_id}/award]
          - errors.ERR_BID_WINDOW_OPEN
        distinguishing_aspect: |
          BRANCHING FORK on the RoutePosting entity - a third entity, and a
          different non-linearity from the Trip parallelism and the BackhaulOffer
          loop. ONE trigger, POST .../award, resolves to two different target
          states purely from data: OPEN -> AWARDED when the eligible pool is
          non-empty, OPEN -> VACANT when it is empty, both with HTTP 200. The
          non-winning bid forks too: PASSED_OVER on award, but WITHDRAWN when the
          posting is cancelled instead. Both target states are terminal, so a
          second award on the same posting is refused.
        test_recipe:
          setup:
            - "Domicile DOM-CHI with pay plan MILE-A and two ACTIVE drivers, both safety_score 100: D-77 with seniority_date 2019-03-04 and D-64 with seniority_date 2017-06-01 (more senior)."
            - "Posting RT-100 (bid_close_at 2026-08-10T00:00:00Z) created by user-tm-1 receives a bid from D-77 first, then from D-64."
            - "Posting RT-101 (bid_close_at 2026-08-10T00:00:00Z) receives no bids at all."
            - "The logical clock is then advanced to 2026-08-11T00:00:00Z so both boards are closed and ERR_BID_WINDOW_OPEN no longer applies; a second operator, user-tm-2, runs both awards."
            - "Expected winner on RT-100: D-64 on seniority alone, even though D-77 bid first."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-CHI", region_code: "MIDWEST", tractor_capacity: 40, driver_headcount_target: 20, fixed_ownership_cents_per_day: 12000, overhead_cents_per_day: 4000, dedicated_rate_cents_per_mile: 285, dedicated_rate_cents_per_case: 210 }
              as: FleetPlanner
              captures: { dom_chi_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_a_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-77", domicile_id: "${dom_chi_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2019-03-04" }
              as: TransportManager
              captures: { drv_77_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-64", domicile_id: "${dom_chi_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2017-06-01" }
              as: TransportManager
              captures: { drv_64_id: $.data.id }
            - call: "POST /fleet/route-postings"
              payload: { route_code: "RT-100", domicile_id: "${dom_chi_id}", weekly_miles: 2200, weekly_stops: 18, start_effective_date: "2026-09-01", bid_close_at: "2026-08-10T00:00:00Z" }
              as: TransportManager
              as_user_id: "user-tm-1"
              captures: { posting_100_id: $.data.id, posting_100_v1: $.data.version }
            - call: "POST /fleet/route-postings"
              payload: { route_code: "RT-101", domicile_id: "${dom_chi_id}", weekly_miles: 1800, weekly_stops: 12, start_effective_date: "2026-09-01", bid_close_at: "2026-08-10T00:00:00Z" }
              as: TransportManager
              as_user_id: "user-tm-1"
              captures: { posting_101_id: $.data.id }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_100_id}", expected_posting_version: "${posting_100_v1}" }
              as: Driver
              as_user_id: "${drv_77_id}"
              captures: { bid_77_id: $.data.id }
            - call: "GET /fleet/route-postings/${posting_100_id}"
              payload: {}
              as: TransportManager
              captures: { posting_100_v2: $.data.version, posting_100_bidcount: $.data.bid_count }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_100_id}", expected_posting_version: "${posting_100_v2}" }
              as: Driver
              as_user_id: "${drv_64_id}"
              captures: { bid_64_id: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: TransportManager
          trigger:
            - call: "POST /fleet/route-postings/${posting_100_id}/award"
              payload: {}
              as: TransportManager
              as_user_id: "user-tm-2"
              captures: { p100_status: $.data.status, p100_winner: $.data.awarded_driver_id, p100_bidcount: $.data.bid_count }
            - call: "POST /fleet/route-postings/${posting_101_id}/award"
              payload: {}
              as: TransportManager
              as_user_id: "user-tm-2"
              captures: { p101_status: $.data.status, p101_winner: $.data.awarded_driver_id }
            - call: "POST /fleet/route-postings/${posting_100_id}/award"
              payload: {}
              as: TransportManager
              as_user_id: "user-tm-2"
              captures: { second_award_error: $.data.error_id }
          assert:
            - "${posting_100_bidcount} == 1 and ${posting_100_v2} != ${posting_100_v1} (every bid bumps the posting version)"
            - "${p100_status} == AWARDED with HTTP 200"
            - "${p100_winner} == ${drv_64_id} (seniority 2017-06-01 beats 2019-03-04; bid order is irrelevant)"
            - "${p100_bidcount} == 0"
            - "RouteBid ${bid_64_id} status == AWARDED and RouteBid ${bid_77_id} status == PASSED_OVER"
            - "${p101_status} == VACANT with HTTP 200 - the empty pool is a business outcome, not an error"
            - "${p101_winner} == null"
            - "${second_award_error} == ERR_INVALID_STATE_TRANSITION with HTTP 409: AWARDED is terminal"
            - "RouteBid ${bid_64_id} is still AWARDED after the refused second award"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: trip_completion_cascades_odometer_to_auto_pm_order_to_pm_hold_to_refused_assignment
        grounds:
          - calculations.pm_due_projection
          - entities.Tractor.fields.miles_since_pm
          - entities.Tractor.fields.pm_hold
          - entities.MaintenanceWorkOrder.fields.auto_generated
          - errors.ERR_TRACTOR_PM_HOLD
        distinguishing_aspect: |
          DEPTH 4, triggered by POST /fleet/trips/{trip_id}/complete. Link 1:
          the completion advances Tractor.odometer_miles by the trip's 273
          miles. Link 2: BECAUSE the odometer moved, miles_since_pm reaches
          25073 and crosses the 25000 interval, so pm_due_projection creates an
          auto_generated PM_A MaintenanceWorkOrder. Link 3: BECAUSE that order
          was created, Tractor.pm_hold flips to true. Link 4: BECAUSE pm_hold is
          true, a later assignment of the same tractor to a different trip is
          refused with ERR_TRACTOR_PM_HOLD. Each link is caused only by the
          previous one - none of them is a direct effect of the trigger except
          the first.
        test_recipe:
          setup:
            - "Fixture F1 with pay plan MILE-A, built through the last stop completion; the tractor starts at odometer 124800 with pm_interval 25000 and pm_last_service_odometer 100000, i.e. 24800 miles since its last PM."
            - "The logical clock is moved to 2026-08-03T16:00:00Z just before completion so the projected PM window is deterministic: next UTC midnight 2026-08-04T00:00:00Z plus 480 minutes."
            - "A second driver D-88 and a second trip TRIP-2 in the same domicile are pre-built with one 300-case DELIVERY stop, so the only reason its assignment can fail is the tractor's PM hold."
            - "Expected: 124800 + 273 = 125073 odometer, 25073 miles_since_pm, service_type PM_A (25073 < 2 * 25000, so NOT PM_B)."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1001", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 240, dock_close_minute: 1320 }
              as: FleetPlanner
              captures: { store_s1_id: $.data.id }
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-CHI", region_code: "MIDWEST", tractor_capacity: 40, driver_headcount_target: 20, fixed_ownership_cents_per_day: 12000, overhead_cents_per_day: 4000, dedicated_rate_cents_per_mile: 285, dedicated_rate_cents_per_case: 210 }
              as: FleetPlanner
              captures: { dom_chi_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_a_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-77", domicile_id: "${dom_chi_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2019-03-04" }
              as: TransportManager
              captures: { drv_77_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-88", domicile_id: "${dom_chi_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2021-02-01" }
              as: TransportManager
              captures: { drv_88_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-501", domicile_id: "${dom_chi_id}", odometer_miles: 124800, pm_interval_miles: 25000, pm_last_service_odometer: 100000 }
              as: MaintenanceCoordinator
              captures: { trc_501_id: $.data.id, pre_since_pm: $.data.miles_since_pm, pre_hold: $.data.pm_hold }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-900", domicile_id: "${dom_chi_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
