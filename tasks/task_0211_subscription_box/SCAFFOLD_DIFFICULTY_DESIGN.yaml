              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "to2@x.com", full_name: "TO2 S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { box_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave1_id: $.data.id, wave1_ver: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave1_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave1_ver}" }
              as: CurationAdmin
              captures: { alloc1_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-18T00:00:00Z", ship_date: "2026-06-20T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave2_id: $.data.id, wave2_ver: $.data.version }
          trigger:
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave2_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave2_ver}" }
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BOX_ALREADY_FINALIZED (422)"
            - "ShippingWave.${wave2_id}.reserved_count == 0"
            - "BoxSelection.${box_id}.allocation_id == ${alloc1_id} (still bound to first wave's allocation)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_conserved_across_reserve_then_release
        grounds:
          - state_machines.Allocation.RESERVED_to_RELEASED
          - calculations.allocation_fill
          - entities.Product.fields.on_hand_qty
          - entities.Product.fields.allocated_qty
        distinguishing_aspect: |
          Conserved quantity = physical inventory: the invariant on_hand_qty unchanged AND allocated_qty
          returns to its pre-reserve value holds after reserve (forward) + release (compensating). Pinned
          formula: post_release(on_hand_qty) == pre(on_hand_qty) AND post_release(allocated_qty) == pre(allocated_qty).
        test_recipe:
          setup:
            - "Product P on_hand=7, allocated=0. Box [P] reserved into wave (allocated becomes 1), then the allocation is released."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
