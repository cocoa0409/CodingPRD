      - "ERR_CLASS_CAPACITY_EXCEEDED when the ON_DEMAND window is closed or the session is not publishable"
      - "ERR_CONTENT_LOCKED when the device content_access_allowed is false"
      - "ERR_DEVICE_NOT_ON_MEMBERSHIP when the device does not belong to the enroller's membership"
