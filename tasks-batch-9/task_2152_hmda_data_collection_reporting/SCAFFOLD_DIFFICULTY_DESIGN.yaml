  - rule_id: priority_pair_validation_conflict
    instances:
      - name: attach_edit_run_state_error_outranks_institution_mismatch
        grounds:
          - validations[priority=80]
          - validations[priority=108]
          - errors[ERR_INVALID_SUBMISSION_STATE]
          - errors[ERR_EDIT_RUN_INSTITUTION_MISMATCH]
          - state_machines.FilingSubmission.DRAFT_to_EDITS_ATTACHED
        distinguishing_aspect: |
          Pair (state, business_referential): the request violates priority 80
          (the submission is already EDITS_ATTACHED, not DRAFT) and priority 108
          (the named run belongs to a different Institution). The response is
          ERR_INVALID_SUBMISSION_STATE with HTTP 409, never
          ERR_EDIT_RUN_INSTITUTION_MISMATCH with 422.
        test_recipe:
          setup:
            - "Two Institutions, each with one exception-free EditRun that lands CLEARED_ALL over an empty snapshot."
            - "A FilingSubmission on institution one, already moved to EDITS_ATTACHED by attaching institution one's run."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst1_id: $.data.id }
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R99", name: "Second Harbor Savings", activity_year: 2026, asset_size_usd_cents: 180000000000, prior_year_closed_end_originations: 610, prior_year_open_end_originations: 20 }
              as: SystemAdmin
              captures: { inst2_id: $.data.id }
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst1_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run1_id: $.data.id }
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst2_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run2_id: $.data.id }
            - call: "GET /hmda/institutions/${inst1_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { inst1_v: $.data.version }
            - call: "POST /hmda/submissions"
              payload: { institution_id: "${inst1_id}", expected_institution_version: "${inst1_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { sub_id: $.data.id }
            - call: "POST /hmda/submissions/${sub_id}/attach-edit-run"
              payload: { edit_run_id: "${run1_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /hmda/submissions/${sub_id}/attach-edit-run"
              payload: { edit_run_id: "${run2_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_SUBMISSION_STATE"
            - "response.data.error_id != ERR_EDIT_RUN_INSTITUTION_MISMATCH"
            - "FilingSubmission.${sub_id}.status == EDITS_ATTACHED"
            - "FilingSubmission.${sub_id}.edit_run_id == ${run1_id}"

      - name: visual_observation_safety_error_outranks_too_many_race_codes
        grounds:
          - validations[priority=92]
          - validations[priority=140]
          - errors[ERR_VISUAL_OBSERVATION_NOT_PERMITTED]
          - errors[ERR_TOO_MANY_RACE_CODES]
          - entities.Application.fields.application_channel
        distinguishing_aspect: |
          Pair (business_safety, business_constraint): the request violates
          priority 92 (visual observation on an INTERNET application) and
          priority 140 (six race codes where five is the ceiling). The response
          is ERR_VISUAL_OBSERVATION_NOT_PERMITTED, never ERR_TOO_MANY_RACE_CODES.
          A different category pair from the state/referential conflict above.
        test_recipe:
          setup:
            - "One non partial-exempt Institution."
            - "One Application taken over the INTERNET, still at INTAKE with no DemographicEntry yet."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000081", application_date: "2026-02-10T00:00:00Z", application_channel: "INTERNET", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "VISUAL_OBSERVATION_OR_SURNAME", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE", "ASIAN", "BLACK", "AMERICAN_INDIAN", "PACIFIC_ISLANDER", "OTHER_ASIAN"], sex_code: "MALE", observation_basis: "VISUAL" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_VISUAL_OBSERVATION_NOT_PERMITTED"
            - "response.data.error_id != ERR_TOO_MANY_RACE_CODES"
            - "response.data.error_id != ERR_DISAGGREGATED_CODE_NOT_PERMITTED"
            - "GET /hmda/applications/${app_id}/demographic-entries returns 0 rows"

      - name: denial_reason_referential_error_outranks_action_date_temporal_error
        grounds:
          - validations[priority=100]
          - validations[priority=120]
          - errors[ERR_DENIAL_REASON_REQUIRED]
          - errors[ERR_ACTION_DATE_BEFORE_APPLICATION]
          - state_machines.Application.stage.UNDERWRITING_to_DECISIONED
        distinguishing_aspect: |
          Pair (business_referential, business_temporal): the request violates
          priority 100 (DENIED with an empty denial_reason_codes array) and
          priority 120 (action_taken_date 2026-03-01 precedes application_date
          2026-03-20). The response is ERR_DENIAL_REASON_REQUIRED, never
          ERR_ACTION_DATE_BEFORE_APPLICATION. A third distinct category pair.
        test_recipe:
          setup:
            - "One non partial-exempt Institution."
            - "One Application received 2026-03-20 over the phone, carrying an APPLICANT DemographicEntry and advanced to DECISIONED."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000091", application_date: "2026-03-20T00:00:00Z", application_channel: "TELEPHONE", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "NOT_PROVIDED_BY_APPLICANT", ethnicity_codes: ["INFO_NOT_PROVIDED"], race_codes: ["INFO_NOT_PROVIDED"], sex_code: "INFO_NOT_PROVIDED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
          trigger:
            - call: "POST /hmda/applications/${app_id}/action-taken"
              payload: { action_taken: "DENIED", action_taken_date: "2026-03-01T00:00:00Z", denial_reason_codes: [] }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_DENIAL_REASON_REQUIRED"
            - "response.data.error_id != ERR_ACTION_DATE_BEFORE_APPLICATION"
            - "Application.${app_id}.action_taken == null"
            - "Application.${app_id}.stage == DECISIONED"

  - rule_id: boundary_precision_check
    instances:
      - name: filing_deadline_inclusive_instant_versus_one_second_late
        grounds:
          - calculations.filing_deadline_and_lateness
          - entities.FilingSubmission.fields.is_late
          - entities.FilingSubmission.fields.late_by_days
          - state_machines.FilingSubmission.CERTIFIED_to_FILED
        distinguishing_aspect: |
          Metric: the annual filing deadline instant, reached through
          POST /hmda/submissions/{id}/file. Filing at exactly
          2027-03-01T23:59:59.000Z yields is_late false and late_by_days 0
          because the comparison is a strict >; filing one second later at
          2027-03-02T00:00:00Z yields is_late true and late_by_days 1.
        test_recipe:
          setup:
            - "Two Institutions for activity year 2026, each with filing_deadline_at 2027-03-01T23:59:59.000Z."
            - "Each has one exception-free EditRun over an empty snapshot and one FilingSubmission attached to it and certified, so both institutions sit at LOCKED_FOR_FILING."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst1_id: $.data.id }
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R99", name: "Second Harbor Savings", activity_year: 2026, asset_size_usd_cents: 180000000000, prior_year_closed_end_originations: 610, prior_year_open_end_originations: 20 }
              as: SystemAdmin
              captures: { inst2_id: $.data.id }
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst1_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run1_id: $.data.id }
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst2_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run2_id: $.data.id }
            - call: "GET /hmda/institutions/${inst1_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { inst1_v: $.data.version }
            - call: "POST /hmda/submissions"
              payload: { institution_id: "${inst1_id}", expected_institution_version: "${inst1_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { sub1_id: $.data.id }
            - call: "POST /hmda/submissions/${sub1_id}/attach-edit-run"
              payload: { edit_run_id: "${run1_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /hmda/submissions/${sub1_id}/certify"
              payload: { attestation_text: "On-time filing attestation." }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "GET /hmda/institutions/${inst2_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { inst2_v: $.data.version }
            - call: "POST /hmda/submissions"
              payload: { institution_id: "${inst2_id}", expected_institution_version: "${inst2_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-beta"
              captures: { sub2_id: $.data.id }
            - call: "POST /hmda/submissions/${sub2_id}/attach-edit-run"
              payload: { edit_run_id: "${run2_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-beta"
            - call: "POST /hmda/submissions/${sub2_id}/certify"
              payload: { attestation_text: "Late filing attestation." }
              as: ComplianceOfficer
              as_user_id: "officer-beta"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T23:59:59Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /hmda/submissions/${sub1_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { late1: $.data.is_late }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /hmda/submissions/${sub2_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-beta"
              captures: { late2: $.data.is_late }
          assert:
            - "FilingSubmission.${sub1_id}.deadline_at == 2027-03-01T23:59:59.000Z"
            - "FilingSubmission.${sub1_id}.is_late == false"
            - "FilingSubmission.${sub1_id}.late_by_days == 0"
            - "FilingSubmission.${sub2_id}.is_late == true"
            - "FilingSubmission.${sub2_id}.late_by_days == 1"
            - "FilingSubmission.${sub1_id}.status == FILED"
            - "FilingSubmission.${sub2_id}.status == FILED"

      - name: audit_sample_over_empty_candidate_set_is_rejected
        grounds:
          - calculations.audit_sample_sizing_and_selection
          - validations[priority=154]
          - errors[ERR_EMPTY_SAMPLE_POPULATION]
          - entities.AuditSample.fields.population_size
        distinguishing_aspect: |
          Metric: an EMPTY COLLECTION rather than a numeric threshold, reached
          through a different endpoint (POST /hmda/audit-samples). Zero
          candidates in the sampling period must return
          ERR_EMPTY_SAMPLE_POPULATION with 422 and persist no AuditSample row,
          rather than an AuditSample with population_size 0 and sample_size 0.
        test_recipe:
          setup:
            - "One non partial-exempt Institution with a single Application that is still at INTAKE and therefore has no action_taken_date."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000101", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /hmda/audit-samples"
              payload: { institution_id: "${inst_id}", method: "SYSTEMATIC_INTERVAL", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", fields_reviewed_per_record: 4 }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_EMPTY_SAMPLE_POPULATION"
            - "GET /hmda/institutions/${inst_id}/audit-samples returns 0 rows"

      - name: partial_exemption_threshold_499_versus_500_originations
        grounds:
          - calculations.filing_profile_resolution
          - entities.Institution.fields.partial_exemption_eligible
          - entities.Institution.fields.required_field_count
        distinguishing_aspect: |
          Metric: the closed-end origination count threshold, reached through a
          third endpoint (PATCH /hmda/institutions/{id}). 499 keeps the partial
          exemption (required_field_count 26) because step 1 uses a strict <;
          exactly 500 removes it (required_field_count 48). The boundary sits on
          a count metric, not on a timestamp or an empty set.
        test_recipe:
          setup:
            - "One Institution created with prior_year_closed_end_originations 700, so it starts non-exempt with required_field_count 48."
            - "The acting InstitutionAdmin's X-User-ID is that Institution's id."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "PATCH /hmda/institutions/${inst_id}"
              payload: { prior_year_closed_end_originations: 499 }
              as: InstitutionAdmin
              as_user_id: "${inst_id}"
              captures: { exempt_at_499: $.data.partial_exemption_eligible, fields_at_499: $.data.required_field_count }
            - call: "PATCH /hmda/institutions/${inst_id}"
              payload: { prior_year_closed_end_originations: 500 }
              as: InstitutionAdmin
              as_user_id: "${inst_id}"
              captures: { exempt_at_500: $.data.partial_exemption_eligible, fields_at_500: $.data.required_field_count }
          assert:
            - "after the first PATCH: Institution.${inst_id}.partial_exemption_eligible == true"
            - "after the first PATCH: Institution.${inst_id}.required_field_count == 26"
            - "after the second PATCH: Institution.${inst_id}.partial_exemption_eligible == false"
            - "after the second PATCH: Institution.${inst_id}.required_field_count == 48"
            - "Institution.${inst_id}.quarterly_filer == false"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: attach_edit_run_blocked_when_run_was_invalidated_by_a_newer_run
        grounds:
          - state_machines.FilingSubmission.DRAFT_to_EDITS_ATTACHED
          - state_machines.EditRun.CLEARED_ALL_to_INVALIDATED
          - errors[ERR_EDIT_RUN_INVALIDATED]
          - entities.EditRun.fields.status
        distinguishing_aspect: |
          Entity pair (FilingSubmission, EditRun): the submission's DRAFT ->
          EDITS_ATTACHED transition is legal on the submission itself and is
          rejected only because the referenced EditRun sits in INVALIDATED after
          a newer run superseded it. Distinct from the (Application,
          GeocodeAssignment) and (DemographicEntry, Application) pairs below.
        test_recipe:
          setup:
            - "One non partial-exempt Institution with no register records."
            - "Edit run 1 over the half-open window 2026-08-01..2026-08-02 lands CLEARED_ALL."
            - "Edit run 2 over the adjacent window 2026-08-02..2026-08-03 supersedes it, moving run 1 to INVALIDATED."
            - "A FilingSubmission in DRAFT."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run1_id: $.data.id }
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run2_id: $.data.id }
            - call: "GET /hmda/institutions/${inst_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { inst_v: $.data.version }
            - call: "POST /hmda/submissions"
              payload: { institution_id: "${inst_id}", expected_institution_version: "${inst_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /hmda/submissions/${sub_id}/attach-edit-run"
              payload: { edit_run_id: "${run1_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_EDIT_RUN_INVALIDATED"
            - "EditRun.${run1_id}.status == INVALIDATED"
            - "EditRun.${run2_id}.status == CLEARED_ALL"
            - "FilingSubmission.${sub_id}.status == DRAFT"
            - "FilingSubmission.${sub_id}.edit_run_id == null"

      - name: register_lock_blocked_while_geocode_is_ambiguous
        grounds:
          - state_machines.Application.stage.DECISIONED_to_REGISTER_LOCKED
          - state_machines.GeocodeAssignment.PENDING_to_AMBIGUOUS
          - errors[ERR_GEOCODE_UNRESOLVED]
          - calculations.geocode_match_resolution
        distinguishing_aspect: |
          Entity pair (Application, GeocodeAssignment): the Application satisfies
          every one of its own preconditions for DECISIONED -> REGISTER_LOCKED
          (action_taken recorded, lar_status COMPLETE) and is rejected solely
          because its is_current GeocodeAssignment resolved to two candidate
          tracts and therefore sits in AMBIGUOUS.
        test_recipe:
          setup:
            - "One non partial-exempt Institution and TWO CensusTracts in the same county 06075 / CA, so a county-only geocode has two candidates."
            - "One Application geocoded WITHOUT a submitted_tract_code, giving candidate_count 2 and status AMBIGUOUS."
            - "The record is advanced to DECISIONED and its action taken is recorded, so lar_status is COMPLETE."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
              captures: { tract_a_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010200", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 51.2, tract_to_msa_income_pct: 74.9, owner_occupied_units: 430, median_family_income_cents: 8100000 }
              as: SystemAdmin
              captures: { tract_b_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000111", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id, app_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", street_address: "17 Folsom St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075" }
              as: LoanOfficer
              captures: { geo_id: $.data.id, geo_status: $.data.status }
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "PROVIDED_BY_APPLICANT", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "MALE" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-03-15T00:00:00Z", rate_spread: 1.75, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
          trigger:
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "REGISTER_LOCKED" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_GEOCODE_UNRESOLVED"
            - "GeocodeAssignment.${geo_id}.status == AMBIGUOUS"
            - "GeocodeAssignment.${geo_id}.candidate_count == 2"
            - "GeocodeAssignment.${geo_id}.census_tract_id == null"
            - "Application.${app_id}.stage == DECISIONED"
            - "Application.${app_id}.lar_status == COMPLETE"

      - name: not_provided_demographics_rejected_for_face_to_face_application
        grounds:
          - validations[priority=96]
          - errors[ERR_OBSERVATION_REQUIRED_FOR_IN_PERSON]
          - entities.Application.fields.application_channel
          - entities.DemographicEntry.fields.collection_method
        distinguishing_aspect: |
          Entity pair (DemographicEntry, Application): the demographic row is
          internally consistent and would be accepted on a MAIL, INTERNET or
          TELEPHONE application; it is rejected only because the parent
          Application.application_channel is FACE_TO_FACE, which obliges the
          officer to record ethnicity, race and sex by visual observation or
          surname. A third distinct entity pair.
        test_recipe:
          setup:
            - "One non partial-exempt Institution."
            - "One Application taken FACE_TO_FACE, still at INTAKE with no DemographicEntry."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000121", application_date: "2026-02-10T00:00:00Z", application_channel: "FACE_TO_FACE", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "NOT_PROVIDED_BY_APPLICANT", ethnicity_codes: ["INFO_NOT_PROVIDED"], race_codes: ["INFO_NOT_PROVIDED"], sex_code: "INFO_NOT_PROVIDED", is_natural_person: true }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_OBSERVATION_REQUIRED_FOR_IN_PERSON"
            - "GET /hmda/applications/${app_id}/demographic-entries returns 0 rows"
            - "Application.${app_id}.stage == INTAKE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: edit_run_half_open_windows_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=130]
          - errors[ERR_EDIT_RUN_WINDOW_OVERLAP]
          - entities.EditRun.fields.window_start
          - entities.EditRun.fields.window_end
        distinguishing_aspect: |
          Resource entity: Institution. Interval semantics: HALF-OPEN
          [window_start, window_end) with collision test
          new_start < existing_end AND existing_start < new_end. A run starting
          exactly at an existing run's end instant is ACCEPTED; a run that
          straddles the interior is rejected. The other overlap instance uses
          closed intervals on a different resource entity.
        test_recipe:
          setup:
            - "One non partial-exempt Institution with no register records."
            - "Edit run 1 occupies the half-open window 2026-08-01T00:00:00Z .. 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "INCREMENTAL", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "INCREMENTAL", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run3_id: $.data.id }
          assert:
            - "first trigger call: HTTP status == 409 and response.data.error_id == ERR_EDIT_RUN_WINDOW_OVERLAP"
            - "second trigger call: HTTP status == 201"
            - "EditRun.${run3_id}.window_start == 2026-08-03T00:00:00.000Z"
            - "EditRun.${run3_id}.status == CLEARED_ALL"
            - "EditRun.${run1_id}.status == INVALIDATED"
            - "GET /hmda/institutions/${inst_id}/edit-runs returns exactly 2 rows"

      - name: remediation_closed_windows_touching_endpoints_rejected
        grounds:
          - validations[priority=132]
          - errors[ERR_REMEDIATION_WINDOW_OVERLAP]
          - entities.AuditFinding.fields.remediation_start
          - entities.AuditFinding.fields.remediation_end
        distinguishing_aspect: |
          Resource entity: Application. Interval semantics: CLOSED
          [remediation_start, remediation_end] with collision test
          new_start <= existing_end AND existing_start <= new_end, so a window
          that begins on the exact end instant of an OPEN finding COLLIDES —
          the opposite treatment of adjacency from the half-open edit-run
          windows, and scoped per Application rather than per Institution.
        test_recipe:
          setup:
            - "One non partial-exempt Institution and two Applications originated 2026-03-15 and 2026-04-20, both lar_status COMPLETE."
            - "One AuditSample over 2026-01-01..2026-06-30 with population_size 2 and sample_size 2, so both records are selectable."
            - "Finding one on record A occupies the closed window 2026-09-01..2026-09-05 with resolution OPEN."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000131", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
