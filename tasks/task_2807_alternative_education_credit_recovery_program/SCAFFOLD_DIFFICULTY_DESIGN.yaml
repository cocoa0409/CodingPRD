              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/resubmit"
              payload: { deficiency_credits: 6.00, narrative: "transcript attached; deficiency corrected to 6.00" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
          trigger:
            - call: "POST /referrals/${ref_id}/request-info"
              payload: { missing_items: "signed parent consent" }
