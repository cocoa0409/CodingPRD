              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 100, average_weight_lbs: 1000, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-OCV", label_name: "Med OCV", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 50, feed_duration_days: 7, expiration_date: "2026-10-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_id: $.data.id, vfd_v: $.data.version }
            - call: "POST /vfd/feed-mills"
              payload: { name: "M-OCV", fda_registration: "FDA-OCV", state_code: "IA" }
              as: Inspector
              captures: { mill_id: $.data.id }
            - call: "POST /vfd/feed-mills/${mill_id}/distributor-acknowledgments"
              payload: { distributor_name: "Dist OCV", covers_drug_id: "${drug_id}", statement_text: "ack" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
            - call: "POST /vfd/feed-mills/${mill_id}/feed-orders"
              payload: { vfd_authorization_id: "${vfd_id}", producer_id: "${producer_id}", animal_count: 10, tons_of_feed: 1, intended_use_label: "label use" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { order1: $.data.id }
            - call: "POST /vfd/feed-mills/${mill_id}/feed-orders"
              payload: { vfd_authorization_id: "${vfd_id}", producer_id: "${producer_id}", animal_count: 10, tons_of_feed: 1, intended_use_label: "label use" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { order2: $.data.id }
            - call: "POST /vfd/feed-orders/${order1}/validate"
              payload: { expected_vfd_authorization_version: "${vfd_v}" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
          trigger:
            - call: "POST /vfd/feed-orders/${order2}/validate"
              payload: { expected_vfd_authorization_version: "${vfd_v}" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"
            - "FeedOrder.${order2}.status == SUBMITTED (unchanged)"
