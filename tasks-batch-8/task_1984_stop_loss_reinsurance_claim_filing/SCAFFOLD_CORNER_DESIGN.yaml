scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_plan_with_required_fields_returns_201
        claim_type: creation
        grounds: ["entities.Plan", "endpoints.POST_/stop-loss/plans"]
        distinguishing_aspect: "POST /stop-loss/plans with plan_name + sponsor_tax_id returns 201 and the response carries system-generated id, created_at, updated_at, version=1, status=ACTIVE."
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "Acme", sponsor_tax_id: "12-3456789" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id, plan_status: $.data.status, plan_version: $.data.version }
          assert:
            - "HTTP 201; Plan.status == 'ACTIVE'; Plan.version == 1; Plan.id is a UUID without prefix"

      - name: create_plan_missing_sponsor_tax_id_returns_400
        claim_type: required_fields
        grounds: ["entities.Plan.fields.sponsor_tax_id", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input sponsor_tax_id yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "Incomplete" }
              as: PlanAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: get_nonexistent_plan_returns_404
        claim_type: not_found
        grounds: ["entities.Plan", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /stop-loss/plans/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /stop-loss/plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlanAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: claim_computed_status_field_ignores_client_input
        claim_type: computed_fields
        grounds: ["entities.Claim.fields.status", "entities.Claim.fields.paid_date"]
        distinguishing_aspect: "Client-supplied status or paid_date on POST /stop-loss/claims is ignored; server sets status=SUBMITTED and paid_date=null."
        test_recipe:
          setup: ["Plan + member exist"]
          setup_api_calls:
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "22-2222222" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 1000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl_id: $.data.id, cl_status: $.data.status }
          assert:
            - "Claim.status == 'SUBMITTED'; Claim.paid_date == null"

      - name: member_default_notice_status_is_none
        claim_type: defaults
        grounds: ["entities.Member.fields.notice_status"]
        distinguishing_aspect: "A newly created member has notice_status == NONE without any claim activity."
        test_recipe:
          setup: ["Plan exists"]
          setup_api_calls:
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "33-3333333" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { notice: $.data.notice_status }
          assert:
            - "Member.notice_status == 'NONE'"

      - name: laser_invalid_effective_range_returns_422
        claim_type: type_constraints
        grounds: ["entities.LaseredMemberTerm.fields.effective_from", "validations[priority=6]"]
        distinguishing_aspect: "effective_from >= effective_to rejected with ERR_INVALID_DATE_RANGE (422)."
        test_recipe:
          setup: ["Plan, contract IN_FORCE, member"]
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "44-4444444" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /stop-loss/contracts/${c_id}/activate"
              payload: {}
              as: PlanAdministrator
          trigger:
            - call: "POST /stop-loss/lasered-terms"
              payload:
                contract_id: "${c_id}"
                member_id: "${m_id}"
                lasered_specific_deductible_cents: 15000000
                effective_from: "2026-07-01T00:00:00Z"
                effective_to: "2026-07-01T00:00:00Z"
                expected_contract_version: "${c_v}"
              as: PlanAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_DATE_RANGE (effective_from == effective_to is a zero-length interval)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: claim_invalid_transition_submitted_to_paid
        claim_type: invalid_transition
        grounds: ["state_machines.Claim", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Claim in SUBMITTED cannot be paid directly; POST pay on SUBMITTED fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plan, member, claim SUBMITTED"]
          setup_api_calls:
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "55-5555555" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 1000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /stop-loss/claims/${cl_id}/pay"
              payload: { paid_amount_cents: 1000000, paid_date: "2026-02-02T00:00:00Z" }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: contract_terminal_renewed_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.StopLossContract"]
        distinguishing_aspect: "A RENEWED contract cannot be activated; POST /activate on RENEWED fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Contract expired and renewed"]
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "66-6666666" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2026-06-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 30
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /stop-loss/contracts/${c_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/contracts/${c_id}/renew"
              payload:
                new_policy_year_start: "2026-06-01T00:00:00Z"
                new_policy_year_end: "2027-06-01T00:00:00Z"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 30
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
          trigger:
            - call: "POST /stop-loss/contracts/${c_id}/activate"
              payload: {}
              as: PlanAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (RENEWED is terminal)"

      - name: filing_initial_state_is_draft
        claim_type: initial_state
        grounds: ["state_machines.StopLossFiling"]
        distinguishing_aspect: "Newly created filing has status == DRAFT and submitted_at == null."
        test_recipe:
          setup: ["Plan, contract IN_FORCE, member with paid claim 150000_00, notice filed"]
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "77-7777777" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /stop-loss/contracts/${c_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 15000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl_id: $.data.id }
            - call: "POST /stop-loss/claims/${cl_id}/adjudicate"
              payload: { allowed_amount_cents: 15000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl_id}/pay"
              payload: { paid_amount_cents: 15000000, paid_date: "2026-02-02T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/members/${m_id}/file-notice"
              payload: {}
              as: PlanAdministrator
          trigger:
            - call: "POST /stop-loss/filings"
              payload:
                contract_id: "${c_id}"
                filing_scope: "SPECIFIC"
                member_id: "${m_id}"
                claim_ids: ["${cl_id}"]
                expected_contract_version: "${c_v}"
              as: StopLossAnalyst
              captures: { f_id: $.data.id, f_status: $.data.status, f_sub: $.data.submitted_at }
          assert:
            - "Filing.status == 'DRAFT'; Filing.submitted_at == null"

      - name: claim_pay_to_reverse_side_effect_recomputes_accumulation
        claim_type: side_effect_execution
        grounds: ["state_machines.Claim.PAID_to_REVERSED"]
        excluded_because:
          difficulty_instance: compensating_invariant / claim_pay_reverse_preserves_accumulation
          rationale: "Asserted as the forward+reverse invariant in the named §1.8 instance."

      - name: filing_dispute_cycle_transitions
        claim_type: valid_transition
        grounds: ["state_machines.StopLossFiling.UNDER_REVIEW_to_DISPUTED", "state_machines.StopLossFiling.DISPUTED_to_UNDER_REVIEW"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / filing_dispute_cycle
          rationale: "Cycle traversal asserted in the named §1.8 instance."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: filing_requested_amount_chronological_position
        claim_type: correct_result
        grounds: ["calculations.filing_requested_amount"]
        distinguishing_aspect: |
          With specific_ded=100000_00 and two claims of 80000_00 and 50000_00
          (service dates 2026-02-01 and 2026-03-01), the chronological sweep
          pins eligible_excess_cents to [0, 30000_00]: the first claim sits
          entirely below the deductible, the second claim's excess is
          (80000_00+50000_00) - 100000_00 = 30000_00. requested_amount ==
          30000_00.
        test_recipe:
          setup:
            - "Plan, contract (specific_ded=100000_00), member with two paid claims"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "88-8888888" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /stop-loss/contracts/${c_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 8000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl1: $.data.id }
            - call: "POST /stop-loss/claims/${cl1}/adjudicate"
              payload: { allowed_amount_cents: 8000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl1}/pay"
              payload: { paid_amount_cents: 8000000, paid_date: "2026-02-02T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m_id}", service_date: "2026-03-01T00:00:00Z", billed_amount_cents: 5000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl2: $.data.id }
            - call: "POST /stop-loss/claims/${cl2}/adjudicate"
              payload: { allowed_amount_cents: 5000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl2}/pay"
              payload: { paid_amount_cents: 5000000, paid_date: "2026-03-02T00:00:00Z" }
              as: ClaimsExaminer
          trigger:
            - call: "POST /stop-loss/filings"
              payload:
                contract_id: "${c_id}"
                filing_scope: "SPECIFIC"
                member_id: "${m_id}"
                claim_ids: ["${cl1}", "${cl2}"]
                expected_contract_version: "${c_v}"
              as: StopLossAnalyst
              captures: { f_id: $.data.id, req_amt: $.data.requested_amount_cents }
            - call: "GET /stop-loss/filings/${f_id}/line-items"
              payload: {}
              as: StopLossAnalyst
          assert:
            - "Filing.requested_amount_cents == 3000000 (80000_00+50000_00 - 100000_00)"
            - "Line item for ${cl1}.eligible_excess_cents == 0 (below deductible)"
            - "Line item for ${cl2}.eligible_excess_cents == 3000000 (chronological position above deductible)"

      - name: notice_threshold_exact_boundary
        claim_type: correct_result
        grounds: ["calculations.notice_threshold_check"]
        excluded_because:
          difficulty_instance: boundary_precision_check / notice_threshold_exact_equality_triggers
          rationale: "Boundary >= asserted in the named §1.8 instance."

      - name: aggregate_policy_year_vs_paid_basis_divergence
        claim_type: variant_divergence
        grounds: ["calculations.specific_accumulation_policy_year_basis"]
        excluded_because:
          difficulty_instance: dual_variant_calc / specific_accumulation_policy_year_vs_paid_basis
          rationale: "Variant divergence asserted in the named §1.8 instance."

      - name: forecast_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.high_cost_claimant_forecast"]
        excluded_because:
          difficulty_instance: dual_variant_calc / forecast_pure_experience_vs_credibility_weighted
          rationale: "Variant divergence asserted in the named §1.8 instance."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: filing_deadline_passed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_FILING_DEADLINE_PASSED]"]
        distinguishing_aspect: "Submission after policy_year_end + filing_deadline_days fails with ERR_FILING_DEADLINE_PASSED."
        test_recipe:
          setup: ["Contract with filing_deadline_days=30, policy year ends 2027-01-01; deadline = 2027-01-31; clock at 2027-02-15"]
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "99-0000000" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 30
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /stop-loss/contracts/${c_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 15000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl_id: $.data.id }
            - call: "POST /stop-loss/claims/${cl_id}/adjudicate"
              payload: { allowed_amount_cents: 15000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl_id}/pay"
              payload: { paid_amount_cents: 15000000, paid_date: "2026-02-02T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/members/${m_id}/file-notice"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/filings"
              payload:
                contract_id: "${c_id}"
                filing_scope: "SPECIFIC"
                member_id: "${m_id}"
                claim_ids: ["${cl_id}"]
                expected_contract_version: "${c_v}"
              as: StopLossAnalyst
              captures: { f_id: $.data.id }
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-15T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /stop-loss/filings/${f_id}/submit"
              payload: {}
              as: StopLossAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_FILING_DEADLINE_PASSED"

      - name: reimbursement_amount_mismatch_at_post
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_REIMBURSEMENT_MISMATCH]"]
        distinguishing_aspect: "Posting a reimbursement whose received_amount_cents != approved_amount_cents fails with ERR_REIMBURSEMENT_MISMATCH."
        test_recipe:
          setup: ["Filing APPROVED at 50000_00; reimbursement recorded at 49000_00"]
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "99-1111111" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
