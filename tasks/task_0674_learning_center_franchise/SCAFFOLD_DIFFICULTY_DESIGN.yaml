# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Learning-Center Franchise & Skill Assessment — Expert
# 9 rule_ids x 2 instances = 18 instances
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: placement_strict_vs_supportive_diverge_on_same_diagnostic
        grounds:
          - calculations.diagnostic_placement
          - entities.Enrollment.fields.placement_level_id
          - entities.Enrollment.fields.current_level_id
          - state_machines.Enrollment.PLACEMENT_PENDING_to_ACTIVE
        distinguishing_aspect: |
          On the Enrollment domain: identical diagnostic_raw_score=50 over a 4-level
          subject (band width 25) places STRICT at rank-3 level (index 2) but
          SUPPORTIVE at rank-2 level (index 1) — two valid algorithms, different level.
        test_recipe:
          setup:
            - "Center OPERATING with an ACTIVE FranchiseAgreement."
            - "Subject MATH with exactly 4 ACTIVE CurriculumLevels ranks 1..4 (entry has no prereq)."
            - "Two enrollments of two distinct students, both diagnostic_raw_score=50; one placed STRICT, one SUPPORTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "C1", territory_code: "TER-A", instructor_ratio_cap: 6, enrollment_fee_cents: 5000, monthly_tuition_cents: 15000 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_rate_bps: 1000, marketing_fee_bps: 200, minimum_monthly_royalty_cents: 50000, royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv1: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 2, label: "L2", prereq_level_id: "${lv1}", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv2: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 3, label: "L3", prereq_level_id: "${lv2}", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv3: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 4, label: "L4", prereq_level_id: "${lv3}", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv4: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "f1@x.com", contact_name: "F One" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "Kid Strict", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_strict: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "Kid Supp", birthdate: "2017-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_supp: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_strict}", subject_id: "${subj_id}", diagnostic_raw_score: 50 }
              as: CenterDirector
              captures: { en_strict: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_supp}", subject_id: "${subj_id}", diagnostic_raw_score: 50 }
              as: CenterDirector
              captures: { en_supp: $.data.id }
          trigger:
            - call: "POST /enrollments/${en_strict}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
              captures: { strict_level: $.data.current_level_id }
            - call: "POST /enrollments/${en_supp}/place"
              payload: { placement_policy: "SUPPORTIVE" }
              as: CenterDirector
              captures: { supp_level: $.data.current_level_id }
          assert:
            - "Enrollment.${en_strict}.current_level_id == ${lv3}"
            - "Enrollment.${en_supp}.current_level_id == ${lv2}"
            - "Enrollment.${en_strict}.current_level_id != Enrollment.${en_supp}.current_level_id"

      - name: royalty_floor_on_royalty_only_vs_combined_diverge_same_tuition
        grounds:
          - calculations.royalty_owed
          - entities.Invoice.fields.royalty_owed_cents
          - entities.FranchiseAgreement.fields.royalty_basis
          - state_machines.Invoice.ISSUED_to_PAID
        distinguishing_aspect: |
          On the Invoice/FranchiseAgreement domain (distinct from placement's Enrollment
          domain): for identical tuition_component_cents=15000, ROYALTY_FLOOR yields
          royalty_owed_cents=50300 while COMBINED_FLOOR yields 50000.
        test_recipe:
          setup:
            - "Two centers each OPERATING; center A agreement royalty_basis=ROYALTY_FLOOR, center B agreement royalty_basis=COMBINED_FLOOR (both rate 1000 bps, marketing 200 bps, min 50000)."
            - "Each center has one family with one student, one ACTIVE solo enrollment (monthly_rate 15000), invoice issued then paid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            # ---- Center A (ROYALTY_FLOOR) ----
            - call: "POST /centers"
              payload: { name: "CA", territory_code: "TER-RA", monthly_tuition_cents: 15000, enrollment_fee_cents: 5000 }
              as: FranchiseAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${ca_id}", royalty_rate_bps: 1000, marketing_fee_bps: 200, minimum_monthly_royalty_cents: 50000, royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ca_ag: $.data.id }
            - call: "POST /franchise-agreements/${ca_ag}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${ca_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${ca_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { ca_subj: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${ca_subj}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { ca_lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${ca_id}", contact_email: "fa@x.com", contact_name: "FA" }
              as: CenterDirector
              captures: { ca_fam: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${ca_fam}", full_name: "KA", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { ca_st: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${ca_id}", student_id: "${ca_st}", subject_id: "${ca_subj}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { ca_en: $.data.id }
            - call: "POST /enrollments/${ca_en}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "GET /families/${ca_fam}"
              payload: {}
              as: CenterDirector
              captures: { ca_fam_v: $.data.version }
            - call: "POST /invoices"
              payload: { family_id: "${ca_fam}", center_id: "${ca_id}", period_month: "2026-05", expected_family_version: "${ca_fam_v}" }
              as: CenterDirector
              captures: { ca_inv: $.data.id }
            - call: "POST /invoices/${ca_inv}/issue"
              payload: {}
              as: CenterDirector
            # ---- Center B (COMBINED_FLOOR) ----
            - call: "POST /centers"
              payload: { name: "CB", territory_code: "TER-RB", monthly_tuition_cents: 15000, enrollment_fee_cents: 5000 }
              as: FranchiseAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${cb_id}", royalty_rate_bps: 1000, marketing_fee_bps: 200, minimum_monthly_royalty_cents: 50000, royalty_basis: "COMBINED_FLOOR" }
              as: FranchiseAdmin
              captures: { cb_ag: $.data.id }
            - call: "POST /franchise-agreements/${cb_ag}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${cb_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${cb_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { cb_subj: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${cb_subj}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { cb_lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${cb_id}", contact_email: "fb@x.com", contact_name: "FB" }
              as: CenterDirector
              captures: { cb_fam: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${cb_fam}", full_name: "KB", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { cb_st: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${cb_id}", student_id: "${cb_st}", subject_id: "${cb_subj}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { cb_en: $.data.id }
            - call: "POST /enrollments/${cb_en}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "GET /families/${cb_fam}"
              payload: {}
              as: CenterDirector
              captures: { cb_fam_v: $.data.version }
            - call: "POST /invoices"
              payload: { family_id: "${cb_fam}", center_id: "${cb_id}", period_month: "2026-05", expected_family_version: "${cb_fam_v}" }
              as: CenterDirector
              captures: { cb_inv: $.data.id }
            - call: "POST /invoices/${cb_inv}/issue"
              payload: {}
              as: CenterDirector
          trigger:
            - call: "POST /invoices/${ca_inv}/pay"
              payload: { amount_cents: 20000 }
              as: CenterDirector
              captures: { ca_royalty: $.data.royalty_owed_cents }
            - call: "POST /invoices/${cb_inv}/pay"
              payload: { amount_cents: 20000 }
              as: CenterDirector
              captures: { cb_royalty: $.data.royalty_owed_cents }
          assert:
            - "Invoice.${ca_inv}.royalty_owed_cents == 50300"
            - "Invoice.${cb_inv}.royalty_owed_cents == 50000"
            - "Invoice.${ca_inv}.royalty_owed_cents != Invoice.${cb_inv}.royalty_owed_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tuition_rate_multi_subject_then_sibling_nested_discount
        grounds:
          - calculations.tuition_rate
          - entities.Enrollment.fields.monthly_rate_cents
          - entities.Family.fields.sibling_count
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base 15000, multi_subject_pct, sibling_pct) with
          non-linear tiered selection; the 2nd subject of a student in a 2-sibling
          family yields floor(floor(15000*0.90)*0.95)=12825, distinct from the 1st
          subject's floor(15000*0.95)=14250.
        test_recipe:
          setup:
            - "Center OPERATING. Two subjects MATH, READING each with one level."
            - "Family with two students A and B. Student A has ACTIVE enrollments in MATH (first) and READING (second). Student B has one ACTIVE enrollment in MATH. sibling_count=2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CT", territory_code: "TER-T", monthly_tuition_cents: 15000, enrollment_fee_cents: 5000 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_m: $.data.id }
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "READING", code: "READ" }
              as: FranchiseAdmin
              captures: { subj_r: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_m}", rank: 1, label: "M1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { m_lv1: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_r}", rank: 1, label: "R1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { r_lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "ft@x.com", contact_name: "FT" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "A", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_a: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "B", birthdate: "2017-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_b: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_a}", subject_id: "${subj_m}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_a_math: $.data.id }
            - call: "POST /enrollments/${en_a_math}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_a}", subject_id: "${subj_r}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_a_read: $.data.id }
            - call: "POST /enrollments/${en_a_read}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_b}", subject_id: "${subj_m}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_b_math: $.data.id }
          trigger:
            - call: "POST /enrollments/${en_b_math}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
          assert:
            - "Enrollment.${en_a_math}.monthly_rate_cents == 14250"
            - "Enrollment.${en_a_read}.monthly_rate_cents == 12825"
            - "Enrollment.${en_b_math}.monthly_rate_cents == 14250"
            - "Family.${fam_id}.sibling_count == 2"

      - name: invoice_total_sum_lines_then_apply_wallet_order_pinned
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.tuition_component_cents
          - entities.Invoice.fields.wallet_applied_cents
          - entities.Invoice.fields.total_due_cents
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (b): rounding/order pinned — per-enrollment integer monthly_rate_cents
          (14250 + 12825 + 14250) are summed FIRST (=41325), enrollment fees added
          (=51325 gross), THEN wallet (3000) subtracted -> total_due 48325. Summing
          before wallet, not interleaving wallet per line.
        test_recipe:
          setup:
            - "Family from tuition_rate scenario (3 ACTIVE enrollments: 14250+12825+14250, two students each charged a 5000 enrollment fee) with wallet_credit_cents=3000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CW", territory_code: "TER-W", monthly_tuition_cents: 15000, enrollment_fee_cents: 5000 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_m: $.data.id }
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "READING", code: "READ" }
              as: FranchiseAdmin
              captures: { subj_r: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_m}", rank: 1, label: "M1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { m_lv1: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_r}", rank: 1, label: "R1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { r_lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "fw@x.com", contact_name: "FW" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "A", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_a: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "B", birthdate: "2017-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_b: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_a}", subject_id: "${subj_m}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_a_math: $.data.id }
            - call: "POST /enrollments/${en_a_math}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_a}", subject_id: "${subj_r}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_a_read: $.data.id }
            - call: "POST /enrollments/${en_a_read}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_b}", subject_id: "${subj_m}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_b_math: $.data.id }
            - call: "POST /enrollments/${en_b_math}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            # seed wallet_credit_cents=3000 by issuing then voiding a prior 3000-credit-producing invoice is complex;
            # instead create a small invoice, void after issue to bank wallet credit is not the mechanism.
            # Wallet credit arises from voiding an ISSUED invoice that had wallet applied — circular. Use the
            # dedicated wallet adjustment business endpoint.
            - call: "POST /families/${fam_id}/wallet-adjustments"
              payload: { amount_cents: 3000, reason: "GOODWILL_CREDIT" }
              as: CenterDirector
            - call: "GET /families/${fam_id}"
              payload: {}
              as: CenterDirector
              captures: { fam_v: $.data.version }
            - call: "POST /invoices"
              payload: { family_id: "${fam_id}", center_id: "${c_id}", period_month: "2026-05", expected_family_version: "${fam_v}" }
              as: CenterDirector
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: CenterDirector
              captures: { tot: $.data.total_due_cents }
          assert:
            - "Invoice.${inv_id}.tuition_component_cents == 41325"
            - "Invoice.${inv_id}.enrollment_fee_component_cents == 10000"
            - "Invoice.${inv_id}.wallet_applied_cents == 3000"
            - "Invoice.${inv_id}.total_due_cents == 48325"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: worksheet_retry_cycle_graded_back_to_assigned
        grounds:
          - state_machines.Worksheet.GRADED_to_RETRY
          - state_machines.Worksheet.RETRY_to_ASSIGNED
          - state_machines.Worksheet.ASSIGNED_to_GRADED
          - entities.Worksheet.fields.attempt_count
        distinguishing_aspect: |
          Cyclic machine on Worksheet: a failing grade (score 70 < threshold 80) goes
          GRADED->RETRY, reassign returns RETRY->ASSIGNED, and a second grade increments
          attempt_count to 2 — the same set_number is revisited (a true A->B->A loop).
        test_recipe:
          setup:
            - "Center OPERATING; subject with one level (threshold 80, worksheets_to_master 2); one ACTIVE enrollment; one ASSIGNED worksheet set #1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /centers"
              payload: { name: "CWS", territory_code: "TER-WS", monthly_tuition_cents: 15000 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "fws@x.com", contact_name: "FWS" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
