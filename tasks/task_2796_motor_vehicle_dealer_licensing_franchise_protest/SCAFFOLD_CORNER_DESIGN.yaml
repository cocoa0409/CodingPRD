      - name: protest_against_an_effective_filing_state_check_first
        claim_type: priority_conflict
        grounds:
          - validations.priority_9_ERR_INVALID_FILING_STATE
          - validations.priority_41_ERR_PROTEST_WINDOW_CLOSED
        excluded_because:
          difficulty_instance: protest_on_effective_filing_state_beats_window_closed_temporal
          rationale: "That §1.8 priority_pair_validation_conflict instance already violates both rules in one request and asserts the state-category error wins over the temporal one."

      - name: lapsed_franchisor_answer_outranks_the_rate_check
        claim_type: priority_conflict
        grounds:
          - validations.priority_20_ERR_MANUFACTURER_REGISTRATION_LAPSED
          - validations.priority_81_ERR_RATE_NOT_ABOVE_POSTED
        excluded_because:
          difficulty_instance: warranty_dispute_lapsed_manufacturer_safety_beats_rate_fiscal
          rationale: "The business_safety versus business_fiscal ordering on a warranty rate dispute is exactly what that §1.8 priority_pair_validation_conflict instance asserts."

      - name: room_day_capacity_ceiling_enforced
        claim_type: aggregate_validation
        grounds:
          - validations.priority_61_ERR_ROOM_DAY_CAPACITY_EXCEEDED
          - calculations.hearing_room_slot_ledger
        excluded_because:
          difficulty_instance: hearing_room_buffered_overlap_rejects_adjacent_session
          rationale: "Individually valid intervals that collectively exceed max_hearings_per_day are covered in that §1.8 resource_temporal_overlap instance alongside the buffered-collision case."

      - name: twelfth_disciplinary_point_triggers_suspension
