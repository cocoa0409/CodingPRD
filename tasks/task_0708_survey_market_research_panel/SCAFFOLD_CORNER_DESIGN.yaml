            - "data.status == ACTIVE"

  # ===========================================================================
  - section: errors
    instances:
      # --- ERR_DELIVERY_NOT_READY already covered above; here cover ERR_STALE_FOCUS_GROUP_VERSION negative is in OCC section ---
      - name: payout_request_nonexistent_panelist_returns_not_found
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
          - entities.PayoutRequest.fields.panelist_id
        distinguishing_aspect: "POST /payout-requests referencing a non-existent panelist_id returns ERR_NOT_FOUND (404), before any OCC/fiscal check."
        test_recipe:
          setup: ["A real panelist exists (so a real version can be observed), but the payout request targets a DIFFERENT, non-existent panelist_id; existence (priority 3) fails before the OCC check at priority 16."]
          setup_api_calls:
            - call: "POST /panelists"
              payload: { email: "nf@x.com", full_name: "NF", age: 30, segment_key: "SEG_NF" }
              as: PanelOps
              captures: { real_pid: $.data.id }
            - call: "GET /panelists/${real_pid}"
              payload: {}
              as: PanelOps
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /payout-requests"
              payload: { panelist_id: "00000000-0000-4000-8000-000000000000", payout_method: "CASH", points_requested: 100, expected_panelist_version: "${v0}" }
              as: PanelOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_NOT_FOUND (the body panelist_id does not resolve; existence (priority 3) precedes the OCC state check at priority 16, so the version value is never consulted)"

  # ===========================================================================
  - section: rbac
    instances:
      # --- unauthenticated ---
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no/unknown X-User-Role returns ERR_UNAUTHENTICATED (401) before any other check. (Negative test: omits valid auth headers.)"
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /studies"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401"
            - "data.error_id == ERR_UNAUTHENTICATED (no valid X-User-Role)"

      # --- forbidden role: Panelist cannot create a study ---
      - name: panelist_cannot_create_study_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - roles
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "POST /studies as Panelist (not in §1.5 roles=[ResearchManager]) returns ERR_FORBIDDEN_ROLE (403). (Negative test bypasses role-allowed lint.)"
        test_recipe:
          setup: ["A registered panelist to act as."]
          setup_api_calls:
            - call: "POST /panelists"
              payload: { email: "fr@x.com", full_name: "FR", age: 30, segment_key: "SEG_FR" }
              as: PanelOps
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /studies"
              payload: { title: "Nope", irb_protocol_number: "IRB-FR", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: Panelist
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      # --- peer-role denial: FieldCoordinator cannot approve payouts ---
      - name: field_coordinator_cannot_approve_payout_forbidden
        claim_type: violation_to_error
        grounds:
          - roles
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
          - state_machines.PayoutRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: "POST /payout-requests/{id}/approve as FieldCoordinator returns ERR_FORBIDDEN_ROLE (403); approve is PanelOps-exclusive. (Negative test: role intentionally not in endpoint roles.)"
        test_recipe:
          setup: ["A panelist with a REQUESTED payout request."]
          setup_api_calls:
            - call: "POST /panelists"
              payload: { email: "fc@x.com", full_name: "FC", age: 30, segment_key: "SEG_FC" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "GET /panelists/${pid}"
              payload: {}
              as: PanelOps
              captures: { v0: $.data.version }
            - call: "POST /payout-requests"
              payload: { panelist_id: "${pid}", payout_method: "CASH", points_requested: 100, expected_panelist_version: "${v0}" }
              as: PanelOps
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /payout-requests/${rid}/approve"
              payload: {}
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      # --- ownership denial: Panelist cannot start another panelist's participation ---
      - name: panelist_cannot_start_other_participation_not_owner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - roles
        distinguishing_aspect: "POST /participations/{id}/start as a Panelist whose X-User-ID != the participation's panelist_id returns ERR_NOT_RESOURCE_OWNER (403). (Negative test: deliberate non-owner.)"
        test_recipe:
          setup: ["A SCREENED_IN participation owned by panelist A; panelist B (different id) acts on it."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "OW", irb_protocol_number: "IRB-OW", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_OW", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "owa@x.com", full_name: "OW A", age: 30, segment_key: "SEG_OW" }
              as: PanelOps
              captures: { pidA: $.data.id }
            - call: "POST /panelists"
              payload: { email: "owb@x.com", full_name: "OW B", age: 30, segment_key: "SEG_OW" }
              as: PanelOps
              captures: { pidB: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pidA}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pidA}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
          trigger:
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pidB}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER (panelist B is not the owner; panelist_id != X-User-ID)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      # --- OCC happy path + version increment (payout) ---
      - name: payout_correct_version_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[payout-request-stale-panelist]"
          - entities.Panelist.fields.version
          - entities.PayoutRequest.fields.expected_panelist_version
        distinguishing_aspect: "POST /payout-requests with expected_panelist_version equal to the panelist's current version succeeds (201); approving it later increments Panelist.version by 1 (per the approve side_effect)."
        test_recipe:
          setup: ["A panelist with points_balance 150 (one QUALIFIED participation), version read fresh."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "OCC1", irb_protocol_number: "IRB-OCC1", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_OCC1", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "occ1@x.com", full_name: "OCC1", age: 30, segment_key: "SEG_OCC1" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pid}"
            - call: "GET /panelists/${pid}"
              payload: {}
              as: PanelOps
              captures: { v_fresh: $.data.version }
          trigger:
            - call: "POST /payout-requests"
              payload: { panelist_id: "${pid}", payout_method: "GIFT_CARD", points_requested: 100, expected_panelist_version: "${v_fresh}" }
              as: Panelist
              as_user_id: "${pid}"
              captures: { rid: $.data.id, st: $.data.status }
          assert:
            - "HTTP 201; PayoutRequest.${rid}.status == REQUESTED (expected_panelist_version matched current version)"

      # --- OCC stale payout (negative, name-based bypass) ---
      - name: payout_stale_version_rejected_returns_stale_panelist_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[payout-request-stale-panelist]"
          - "errors[ERR_STALE_PANELIST_VERSION]"
          - entities.Panelist.fields.version
        distinguishing_aspect: "POST /payout-requests carrying expected_panelist_version one below the panelist's current version (after a finalize/approve bumped it) is rejected with ERR_STALE_PANELIST_VERSION (412). (Negative test: deliberate stale version via ${v_fresh} - 1.)"
        test_recipe:
          setup: ["A panelist with points_balance 150; a version captured fresh, then deliberately decremented to simulate a stale client view."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "OCC2", irb_protocol_number: "IRB-OCC2", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_OCC2", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "occ2@x.com", full_name: "OCC2", age: 30, segment_key: "SEG_OCC2" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pid}"
            - call: "GET /panelists/${pid}"
              payload: {}
              as: PanelOps
              captures: { v_fresh: $.data.version }
          trigger:
            - call: "POST /payout-requests"
              payload: { panelist_id: "${pid}", payout_method: "CASH", points_requested: 100, expected_panelist_version: "${v_fresh} - 1" }
              as: Panelist
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "data.error_id == ERR_STALE_PANELIST_VERSION (${v_fresh} - 1 != current version)"

      # --- OCC stale focus-group booking (negative) ---
      - name: booking_stale_focus_group_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[focus-group-booking-stale-seat]"
          - "errors[ERR_STALE_FOCUS_GROUP_VERSION]"
          - entities.FocusGroup.fields.version
        distinguishing_aspect: "POST /focus-group-bookings carrying expected_focus_group_version one below the session's current version (after a prior booking bumped it) is rejected with ERR_STALE_FOCUS_GROUP_VERSION (412). (Negative test: deliberate stale version.)"
        test_recipe:
          setup: ["A SCHEDULED focus group whose version has advanced from one prior CONFIRMED booking; a fresh version captured, then decremented."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "OCC3", irb_protocol_number: "IRB-OCC3", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /facilities"
              payload: { name: "OCC3 Room", capacity: 10 }
              as: FieldCoordinator
              captures: { fac: $.data.id }
            - call: "POST /focus-groups"
              payload: { study_id: "${sid}", facility_id: "${fac}", starts_at: "2026-05-04T10:00:00Z", ends_at: "2026-05-04T11:00:00Z", seats: 5 }
              as: FieldCoordinator
              captures: { fg: $.data.id, fgv0: $.data.version }
            - call: "POST /panelists"
              payload: { email: "occ3a@x.com", full_name: "OCC3A", age: 30, segment_key: "SEG_OCC3" }
              as: PanelOps
              captures: { pidA: $.data.id }
            - call: "POST /panelists"
              payload: { email: "occ3b@x.com", full_name: "OCC3B", age: 30, segment_key: "SEG_OCC3" }
              as: PanelOps
              captures: { pidB: $.data.id }
            - call: "POST /focus-group-bookings"
              payload: { focus_group_id: "${fg}", panelist_id: "${pidA}", expected_focus_group_version: "${fgv0}" }
              as: FieldCoordinator
              captures: { bkA: $.data.id }
            - call: "GET /focus-groups/${fg}"
              payload: {}
              as: FieldCoordinator
              captures: { fgv_fresh: $.data.version }
          trigger:
            - call: "POST /focus-group-bookings"
              payload: { focus_group_id: "${fg}", panelist_id: "${pidB}", expected_focus_group_version: "${fgv_fresh} - 1" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "data.error_id == ERR_STALE_FOCUS_GROUP_VERSION (${fgv_fresh} - 1 != current version)"

      # --- rate_threshold: churn floor mark_churned ---
      - name: mark_churned_requires_health_below_floor
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Panelist.AT_RISK_to_CHURNED
          - calculations.panel_health_score
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /panelists/{id}/mark_churned requires health_score < CHURN_FLOOR(30) AND status AT_RISK; a panelist at health 40 (AT_RISK but above floor) is rejected with ERR_INVALID_STATE (409) because the from-state/precondition for CHURNED is not met."
        test_recipe:
          setup: ["A panelist driven to AT_RISK with rolling health 40 (2 of 5 recent completed), which is above CHURN_FLOOR 30."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "CHN", irb_protocol_number: "IRB-CHN", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_CHN", target_n: 10 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "chn@x.com", full_name: "CHN", age: 30, segment_key: "SEG_CHN" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { pA: $.data.id }
            - call: "POST /participations/${pA}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${pA}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
            - call: "POST /participations/${pA}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pid}"
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { pB: $.data.id }
            - call: "POST /participations/${pB}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${pB}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pid}"
            - call: "POST /participations/${pB}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pid}"
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
          trigger:
            - call: "POST /panelists/${pid}/mark_churned"
              payload: {}
              as: PanelOps
              captures: { err: $.data.error_id }
          assert:
            - "Panelist.${pid}.health_score == 40 and status == AT_RISK (2/5 recent completed)"
            - "HTTP 409; data.error_id == ERR_INVALID_STATE (health 40 >= CHURN_FLOOR 30, so AT_RISK->CHURNED precondition fails)"

      # --- excluded: cascading side effects covered by §1.8 ---
      - name: cascade_chain_close_endtoend
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Study.FIELDING_to_CLOSED
        excluded_because:
          difficulty_instance: study_close_cascade_void_release_voidaccrual
          rationale: "The end-to-end N-level cascade is the depth-3 transitive_cascade §1.8 instance."

      # --- excluded: dual variant calculation covered by §1.8 ---
      - name: dual_variant_health_rolling_lifetime
        claim_type: dual_variant_calculation
        grounds:
          - calculations.panel_health_score
        excluded_because:
          difficulty_instance: health_rolling_vs_lifetime_diverge_on_window
          rationale: "Both health variants and their divergence are the dual_variant_calc §1.8 instance 2."

  # ===========================================================================
  - section: consistency_model
    instances:
      # --- immediate: screen-in reflects provisional points in same response ---
      - name: screen_in_provisional_visible_immediately
        claim_type: immediate
        grounds:
          - calculations.incentive_accrual
          - entities.Participation.fields.provisional_points
          - state_machines.Participation.SCREENING_to_SCREENED_IN
        distinguishing_aspect: "Under the immediate consistency model, POST /participations/{id}/screen outcome=IN returns provisional_points==120 in the same response (base 100 + length_bonus 20), no read-after-write delay."
        test_recipe:
          setup: ["A FIELDING study (base=100, estimated_minutes=10) with a free quota cell and a panelist with ACCEPTED consent and a SCREENING participation."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "IMM", irb_protocol_number: "IRB-IMM", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_IMM", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "imm@x.com", full_name: "IMM", age: 30, segment_key: "SEG_IMM" }
              as: PanelOps
              captures: { pid: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pid}", study_id: "${sid}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${sid}", panelist_id: "${pid}", quota_cell_id: "${cid}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
          trigger:
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
              captures: { pp: $.data.provisional_points, ss: $.data.screening_status }
          assert:
            - "HTTP 200"
            - "data.screening_status == SCREENED_IN"
            - "data.provisional_points == 120 (visible in the same response; immediate consistency)"
