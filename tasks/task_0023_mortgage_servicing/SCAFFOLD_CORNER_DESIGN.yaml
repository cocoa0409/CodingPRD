scaffold_corner_design:

  # ==========================================================================
  # Section: Entities
  # ==========================================================================
  - section: entities
    instances:
      - name: entity_loan_creation_returns_201_with_computed_fields
        claim_type: creation
        grounds:
          - entities.Loan
          - endpoints.POST_/loans
          - calculations.amortization_schedule
        distinguishing_aspect: "POST /loans with full required input returns 201 + Loan body with computed scheduled_monthly_pi_cents, principal_balance_cents=original_principal_cents, status=CURRENT, version=1."
        test_recipe:
          setup:
            - "Borrower exists"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "c1@x.com", full_name: "C One", ssn_last4: "1001" }
              as: LoanServicer
              captures: { c1_b_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { borrower_id: "${c1_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 20000000, original_property_value_cents: 25000000, interest_rate_bps: 500, term_months: 360, pmi_monthly_cents: 9000 }
              as: LoanServicer
              captures: { c1_loan_id: $.data.id, c1_pi: $.data.scheduled_monthly_pi_cents, c1_status: $.data.status, c1_version: $.data.version }
          assert:
            - "Loan.${c1_loan_id}.scheduled_monthly_pi_cents == 107364"
            - "Loan.${c1_loan_id}.principal_balance_cents == 20000000"
            - "Loan.${c1_loan_id}.status == CURRENT"
            - "Loan.${c1_loan_id}.version == 1"

      - name: entity_loan_get_returns_stored_data
        claim_type: retrieval
        grounds:
          - entities.Loan
          - endpoints.GET_/loans/{id}
        distinguishing_aspect: "GET /loans/{id} returns the same Loan row created earlier."
        test_recipe:
          setup:
            - "Loan created"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "c2@x.com", full_name: "C Two", ssn_last4: "1002" }
              as: LoanServicer
              captures: { c2_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c2_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 20000000, original_property_value_cents: 25000000, interest_rate_bps: 500, term_months: 360, pmi_monthly_cents: 9000 }
              as: LoanServicer
              captures: { c2_loan_id: $.data.id }
          trigger:
            - call: "GET /loans/${c2_loan_id}"
              payload: {}
              as: LoanServicer
              captures: { c2_get_status: $.data.status }
          assert:
            - "Loan.${c2_loan_id}.status == CURRENT"
            - "Loan.${c2_loan_id}.original_principal_cents == 20000000"

      - name: entity_loan_list_pagination
        claim_type: listing
        grounds:
          - entities.Loan
          - endpoints.GET_/loans
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /loans returns paginated response with total_count and has_more in meta."
        test_recipe:
          setup:
            - "At least 2 loans for the same borrower exist"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "c3@x.com", full_name: "C Three", ssn_last4: "1003" }
              as: LoanServicer
              captures: { c3_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c3_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 20000000, original_property_value_cents: 25000000, interest_rate_bps: 500, term_months: 360, pmi_monthly_cents: 9000 }
              as: LoanServicer
            - call: "POST /loans"
              payload: { borrower_id: "${c3_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
          trigger:
            - call: "GET /loans"
              payload: { borrower_id: "${c3_b_id}", limit: 1, offset: 0 }
              as: LoanServicer
              captures: { c3_total: $.data }
          assert:
            - "meta.total_count == 2"
            - "meta.has_more == true"
            - "len(data) == 1"

      - name: entity_loan_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "GET /loans/{nonexistent-uuid} returns 404 with ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup:
            - "No loan with the chosen synthetic uuid exists"
          setup_api_calls: []
          trigger:
            - call: "GET /loans/00000000-0000-0000-0000-deadbeef0001"
              payload: {}
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: entity_loan_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=15]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /loans missing original_principal_cents returns ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Borrower exists"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "c5@x.com", full_name: "C Five", ssn_last4: "1005" }
              as: LoanServicer
              captures: { c5_b_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { borrower_id: "${c5_b_id}", origination_date: "2026-01-01T00:00:00Z", original_property_value_cents: 25000000, interest_rate_bps: 500, term_months: 360, pmi_monthly_cents: 9000 }
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: entity_escrow_cushion_default_applied
        claim_type: defaults
        grounds:
          - entities.EscrowAccount.fields.cushion_months
        distinguishing_aspect: "Omitting cushion_months in POST /escrow-accounts applies default 2."
        test_recipe:
          setup:
            - "Loan exists"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "c6@x.com", full_name: "C Six", ssn_last4: "1006" }
              as: LoanServicer
              captures: { c6_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c6_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 20000000, original_property_value_cents: 25000000, interest_rate_bps: 500, term_months: 360, pmi_monthly_cents: 9000 }
              as: LoanServicer
              captures: { c6_loan_id: $.data.id }
          trigger:
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${c6_loan_id}", annual_tax_cents: 480000, annual_insurance_cents: 120000 }
              as: LoanServicer
              captures: { c6_esc_id: $.data.id, c6_cushion: $.data.cushion_months }
          assert:
            - "EscrowAccount.${c6_esc_id}.cushion_months == 2"

      - name: entity_payment_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.Payment
        distinguishing_aspect: "Payment has common_fields:false (no version); §1.5 declares no PUT/PATCH/DELETE for /loans/{id}/payments/{id} -- only POST and GET."
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_payment_posting_standard_vs_curtailment
          rationale: "Payment immutability after posting is observed in the dual-variant payment_posting instance which verifies the allocation breakdown post-create without any update endpoint declared."

      - name: entity_escrow_invalid_cushion_returns_overlimit
        claim_type: type_constraints
        grounds:
          - validations[priority=11]
          - errors.ERR_CUSHION_OVERLIMIT
        distinguishing_aspect: "POST /escrow-accounts with cushion_months=3 returns ERR_CUSHION_OVERLIMIT (RESPA cap is 2)."
        test_recipe:
          setup:
            - "Loan exists"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "c8@x.com", full_name: "C Eight", ssn_last4: "1008" }
              as: LoanServicer
              captures: { c8_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c8_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 20000000, original_property_value_cents: 25000000, interest_rate_bps: 500, term_months: 360, pmi_monthly_cents: 9000 }
              as: LoanServicer
              captures: { c8_loan_id: $.data.id }
          trigger:
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${c8_loan_id}", annual_tax_cents: 480000, annual_insurance_cents: 120000, cushion_months: 3 }
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_CUSHION_OVERLIMIT"

      - name: entity_loan_fk_borrower_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors.ERR_FK_NOT_FOUND
        distinguishing_aspect: "POST /loans with borrower_id that does not exist returns ERR_FK_NOT_FOUND."
        test_recipe:
          setup:
            - "No borrower with the synthetic uuid exists"
          setup_api_calls: []
          trigger:
            - call: "POST /loans"
              payload: { borrower_id: "00000000-0000-0000-0000-deadbeef0002", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 20000000, original_property_value_cents: 25000000, interest_rate_bps: 500, term_months: 360, pmi_monthly_cents: 9000 }
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_FK_NOT_FOUND"

  # ==========================================================================
  # Section: State Machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: sm_loan_initial_state_current
        claim_type: initial_state
        grounds:
          - state_machines.Loan.initial_state
        distinguishing_aspect: "A freshly created Loan starts with status=CURRENT."
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_amortization_three_inputs_nonlinear
          rationale: "Asserted explicitly in that instance: Loan.${loan3_id}.status == CURRENT."

      - name: sm_loan_terminal_paid_off_locked
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Loan.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Once a Loan is PAID_OFF, further payment attempts return ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Loan paid off via a single full-payoff payment"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "c11@x.com", full_name: "C Eleven", ssn_last4: "1011" }
              as: LoanServicer
              captures: { c11_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c11_b_id}", origination_date: "2025-12-01T00:00:00Z", original_principal_cents: 12000000, original_property_value_cents: 30000000, interest_rate_bps: 0, term_months: 120, pmi_monthly_cents: 0 }
              as: LoanServicer
              captures: { c11_loan_id: $.data.id }
            - call: "POST /loans/${c11_loan_id}/payments"
              payload: { amount_cents: 12000000, received_at: "2025-12-15T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /loans/${c11_loan_id}/payments"
              payload: { amount_cents: 100000, received_at: "2025-12-16T00:00:00Z" }
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE   # PAID_OFF is terminal"

      - name: sm_forbearance_invalid_from_completed_to_terminate
        claim_type: invalid_transition
        grounds:
          - state_machines.ForbearancePlan.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A COMPLETED ForbearancePlan cannot be terminated; returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Loan with a ForbearancePlan that ran to COMPLETED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "c12@x.com", full_name: "C Twelve", ssn_last4: "1012" }
              as: LoanServicer
              captures: { c12_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c12_b_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { c12_loan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-25T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${c12_loan_id}/forbearance-plans"
              payload: { start_date: "2025-08-01T00:00:00Z", end_date: "2025-08-31T00:00:00Z", reduced_payment_cents: 50000 }
              as: LoanServicer
              captures: { c12_fb_id: $.data.id }
            - call: "POST /forbearance-plans/${c12_fb_id}/activate"
              payload: {}
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /forbearance-plans/${c12_fb_id}/complete"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /forbearance-plans/${c12_fb_id}/terminate"
              payload: {}
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "ForbearancePlan.${c12_fb_id}.status == COMPLETED"
            - "response.error_id == ERR_INVALID_STATE"

      - name: sm_clock_drives_current_to_delinquent_after_grace
        claim_type: side_effect_execution
        grounds:
          - state_machines.Loan.transitions.CURRENT_to_DELINQUENT
        distinguishing_aspect: "Advancing the clock past next_due_date + GRACE_DAYS=15 auto-transitions a CURRENT loan to DELINQUENT."
        test_recipe:
          setup:
            - "Loan originated 2026-01-01 (next_due_date=2026-01-31); clock advanced to 2026-02-16 (past grace)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "c13@x.com", full_name: "C Thirteen", ssn_last4: "1013" }
              as: LoanServicer
              captures: { c13_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c13_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { c13_loan_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-16T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loans/${c13_loan_id}"
              payload: {}
              as: LoanServicer
              captures: { c13_status: $.data.status }
          assert:
            - "Loan.${c13_loan_id}.status == DELINQUENT"

      - name: sm_foreclosure_filed_auto_to_mediation_required
        claim_type: auto_transition
        grounds:
          - state_machines.ForeclosureCase.transitions.FILED_to_MEDIATION_REQUIRED
        distinguishing_aspect: "ForeclosureCase auto-transitions FILED -> MEDIATION_REQUIRED in same request as creation (HAMP-style mandatory mediation)."
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_cure_amount_nested_rounding_order
          rationale: "Already asserted: ForeclosureCase.${fc4_id}.status == MEDIATION_REQUIRED right after POST /loans/{id}/foreclosure."

      - name: sm_loan_cure_returns_delinquent_to_current
        claim_type: valid_transition
        grounds:
          - state_machines.Loan.transitions.DELINQUENT_to_CURRENT
        distinguishing_aspect: "Posting a full curing payment on a DELINQUENT loan returns it to CURRENT."
        test_recipe:
          setup:
            - "Loan originated, advanced to DELINQUENT via clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "c15@x.com", full_name: "C Fifteen", ssn_last4: "1015" }
              as: LoanServicer
              captures: { c15_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c15_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { c15_loan_id: $.data.id }
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${c15_loan_id}", annual_tax_cents: 480000, annual_insurance_cents: 120000, cushion_months: 2 }
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /loans/${c15_loan_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-02-20T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loans/${c15_loan_id}"
              payload: {}
              as: LoanServicer
              captures: { c15_status_after_cure: $.data.status }
          assert:
            - "Loan.${c15_loan_id}.status == CURRENT   # cured back from DELINQUENT"
            - "Loan.${c15_loan_id}.days_past_due == 0"

  # ==========================================================================
  # Section: Calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: calc_amortization_zero_rate_edge
        claim_type: correct_result
        grounds:
          - calculations.amortization_schedule
          - calculations.amortization_schedule.formula
        distinguishing_aspect: "Zero-rate edge: scheduled_monthly_pi_cents = round_half_up(P/n). P=120000_00, n=120 -> 100000."
        test_recipe:
          setup:
            - "Borrower exists"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "c16@x.com", full_name: "C Sixteen", ssn_last4: "1016" }
              as: LoanServicer
              captures: { c16_b_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { borrower_id: "${c16_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 12000000, original_property_value_cents: 30000000, interest_rate_bps: 0, term_months: 120, pmi_monthly_cents: 0 }
              as: LoanServicer
              captures: { c16_loan_id: $.data.id, c16_pi: $.data.scheduled_monthly_pi_cents }
          assert:
            - "Loan.${c16_loan_id}.scheduled_monthly_pi_cents == 100000"

      - name: calc_forbearance_deferral_total
        claim_type: correct_result
        grounds:
          - calculations.forbearance_deferral_calc
          - entities.ForbearancePlan.fields.deferred_total_cents
        distinguishing_aspect: "deferred_total_cents = (total_monthly_payment_cents - reduced_payment_cents) * number_of_months; with total=242365 and reduced=50000 over Feb..Apr 2026 (3 months) yields 577095."
        test_recipe:
          setup:
            - "Loan originated 2026-01-01; advanced to DELINQUENT; ForbearancePlan proposed covering 2026-02-01..2026-04-30 with reduced=50000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "c17@x.com", full_name: "C Seventeen", ssn_last4: "1017" }
              as: LoanServicer
              captures: { c17_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c17_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { c17_loan_id: $.data.id }
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${c17_loan_id}", annual_tax_cents: 480000, annual_insurance_cents: 120000, cushion_months: 2 }
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${c17_loan_id}/forbearance-plans"
              payload: { start_date: "2026-02-01T00:00:00Z", end_date: "2026-04-30T00:00:00Z", reduced_payment_cents: 50000 }
              as: LoanServicer
              captures: { c17_fb_id: $.data.id }
          trigger:
            - call: "POST /forbearance-plans/${c17_fb_id}/activate"
              payload: {}
              as: LoanServicer
              captures: { c17_fb_def: $.data.deferred_total_cents }
          assert:
            - "ForbearancePlan.${c17_fb_id}.deferred_total_cents == 577095"
            - "ForbearancePlan.${c17_fb_id}.status == ACTIVE"

      - name: calc_pmi_eligibility_auto_termination_path
        claim_type: variant_selection
        grounds:
          - calculations.pmi_eligibility
        distinguishing_aspect: "LTV at exactly 7800 bps is on the auto-termination boundary; the rule uses < 7800 unconditionally so LTV=7800 still requires clean history. This corner exercises LTV=7799 (below 7800): approved unconditionally."
        test_recipe:
          setup:
            - "Loan with principal_balance/value ratio == 7799 bps (rounded), status=CURRENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "c18@x.com", full_name: "C Eighteen", ssn_last4: "1018" }
              as: LoanServicer
              captures: { c18_b_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${c18_b_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 31196000, original_property_value_cents: 40000000, interest_rate_bps: 500, term_months: 360, pmi_monthly_cents: 13000 }
              as: LoanServicer
              captures: { c18_loan_id: $.data.id }
            - call: "POST /pmi-removal-requests"
              payload: { loan_id: "${c18_loan_id}" }
              as: LoanServicer
              captures: { c18_pmi_id: $.data.id, c18_ltv: $.data.computed_ltv_bps }
          trigger:
            - call: "POST /pmi-removal-requests/${c18_pmi_id}/decide"
              payload: {}
              as: ComplianceOfficer
              captures: { c18_pmi_status: $.data.status }
          assert:
            - "PMIRemovalRequest.${c18_pmi_id}.computed_ltv_bps == 7799"
