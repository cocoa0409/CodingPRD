      - name: credential_rejection_cascades_four_hops_to_released_assignment
        grounds:
          - state_machines.InstallerCredential.VERIFIED_to_REJECTED
          - state_machines.Installer.ACTIVE_to_SUSPENDED
          - state_machines.InstallerAssignment.CONFIRMED_to_RELEASED
          - state_machines.Project.fulfillment_status.SCHEDULED_to_MEASURED
          - entities.Installer.fields.verified_credential_count
          - entities.Installer.fields.committed_minutes
          - entities.InstallerAssignment.fields.release_reason
        distinguishing_aspect: |
          A DIFFERENT triggering transition — InstallerCredential VERIFIED ->
          REJECTED, not a punch escalation — walks four caused hops: hop 1 rejects
          the credential, hop 2 (because of hop 1) drops
          verified_credential_count to 0 and suspends the Installer, hop 3
          (because of hop 2) releases the CONFIRMED assignment with
          release_reason INSTALLER_SUSPENDED, and hop 4 (because of hop 3) drops
          committed_minutes from 480 to 0 and reverts Project.fulfillment_status
          SCHEDULED -> MEASURED.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z throughout."
            - "ServiceCategory FLOOR-DIRECT with measurement_required false and permit_policy NEVER."
            - "Jurisdiction METRO-01 with license_required true."
            - "One Installer ACTIVE holding exactly ONE VERIFIED credential, so verified_credential_count is 1."
            - "One Project with estimated_units 420.00, deposit 59002 paid (financial_status DEPOSIT_HELD), permit_status NOT_REQUIRED."
            - "One MaterialDelivery PLANNED with promised_window_end 2026-08-24T08:00:00.000Z."
            - "One InstallerAssignment CONFIRMED for [2026-08-25T08:00:00.000Z, 2026-08-25T16:00:00.000Z), so Installer.committed_minutes is 480 and Project.fulfillment_status is SCHEDULED."
