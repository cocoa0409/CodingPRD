          trigger:
            - call: "POST /part-applications/${pa3_id}/submit"
              payload: { shpo_reviewer_id: "${shpo_id}" }
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "PartApplication.${pa1_id}.review_window_end == 2026-10-01T00:00:00Z"
            - "PartApplication.${pa1_id}.status == SHPO_REVIEW"
            - "PartApplication.${pa2_id}.review_window_end == 2026-10-31T00:00:00Z"
            - "PartApplication.${pa2_id}.status == SHPO_REVIEW (accepted with exactly one touching window already held)"
            - "response HTTP status == 409"
            - "response data.error_id == ERR_REVIEWER_WINDOW_CAPACITY"
            - "PartApplication.${pa3_id}.status == DRAFT (unchanged)"
            - "PartApplication.${pa3_id}.submitted_at == null"
            - "PartApplication.${pa3_id}.shpo_reviewer_id == null"

  - rule_id: compensating_invariant
    instances:
      - name: qre_reclassification_round_trip_conserves_classified_cost_total
        grounds:
          - calculations.qre_totals
          - state_machines.CostLineItem.QRE_to_NON_QRE
          - state_machines.CostLineItem.NON_QRE_to_QRE
          - entities.Project.fields.classified_cost_total_cents
          - entities.CostLineItem.fields.reclassification_count
        distinguishing_aspect: |
          Conserved quantity: classified rehabilitation cost. The forward action
          (classify a hard-construction cost NON_QRE) and its compensating action
          (classify it back to QRE) each rewrite qre_total_final_cents and
          nonqualified_total_cents, but classified_cost_total_cents must read exactly
          210000000 at all three checkpoints and the identity
          qre_total_final_cents + nonqualified_total_cents == classified_cost_total_cents
          must hold at every one of them. The round trip must leave no drift in the
          conserved total even though reclassification_count is not itself reset.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; project with adjusted_basis_cents == 60000000 and the half-open measuring period [2026-09-01, 2028-09-01)."
            - "Two in-period costs both classified QRE at creation: 200000000 hard construction and 10000000 architectural/engineering."
            - "Checkpoint 1 (before the trigger): qre_total_final_cents == 210000000, nonqualified_total_cents == 0, classified_cost_total_cents == 210000000, substantial_test_status == MET, annual_credit_cents == 8400000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Keystone Masonry", category: "HARD_CONSTRUCTION", amount_cents: 200000000, incurred_date: "2027-05-10", classification: "QRE" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Rowe Architects", category: "ARCHITECTURAL_ENGINEERING", amount_cents: 10000000, incurred_date: "2027-06-15", classification: "QRE" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { c2_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { cp1_classified: $.data.classified_cost_total_cents, cp1_qre: $.data.qre_total_final_cents, cp1_nonqual: $.data.nonqualified_total_cents }
          trigger:
            - call: "POST /cost-line-items/${c1_id}/classify"
              payload: { classification: "NON_QRE", exclusion_reason: "REVIEWER_DISALLOWED" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { cp2_classified: $.data.classified_cost_total_cents, cp2_qre: $.data.qre_total_final_cents, cp2_nonqual: $.data.nonqualified_total_cents }
            - call: "POST /cost-line-items/${c1_id}/classify"
              payload: { classification: "QRE" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { cp3_classified: $.data.classified_cost_total_cents, cp3_qre: $.data.qre_total_final_cents, cp3_nonqual: $.data.nonqualified_total_cents }
          assert:
            - "checkpoint 1: classified_cost_total_cents == 210000000, qre_total_final_cents == 210000000, nonqualified_total_cents == 0"
            - "checkpoint 1: substantial_test_status == MET and annual_credit_cents == 8400000"
            - "checkpoint 2: classified_cost_total_cents == 210000000 (conserved), qre_total_final_cents == 10000000, nonqualified_total_cents == 200000000"
            - "checkpoint 2: substantial_test_status == NOT_MET and annual_credit_cents == 0"
            - "checkpoint 3: classified_cost_total_cents == 210000000 (conserved), qre_total_final_cents == 210000000, nonqualified_total_cents == 0"
            - "checkpoint 3: substantial_test_status == MET, annual_credit_cents == 8400000 and total_claimable_credit_cents == 42000000"
            - "the identity qre_total_final_cents + nonqualified_total_cents == classified_cost_total_cents holds at checkpoints 1, 2 and 3"
            - "CostLineItem.${c1_id}.classification == QRE and exclusion_reason == NONE after the round trip"
            - "CostLineItem.${c1_id}.reclassification_count == 2"
            - "CostLineItem.${c2_id}.classification == QRE and reclassification_count == 0 (untouched)"

      - name: recapture_offset_round_trip_conserves_total_claimable_credit
        grounds:
          - calculations.claim_settlement
          - calculations.recapture_assessment
          - entities.Project.fields.credit_unclaimed_cents
          - entities.Project.fields.credit_recaptured_cents
          - entities.Project.fields.recapture_balance_cents
          - state_machines.RecaptureEvent.ASSESSED_to_SETTLED
        distinguishing_aspect: |
          A different conserved quantity — the credit ledger, not classified cost.
          The forward action is the recapture assessment that raises
          recapture_balance_cents; the compensating action is the next claim filing,
          which consumes that balance as an offset and settles the event. Across all
          three checkpoints the three-way identity
          credit_claimed_to_date_cents + credit_recaptured_cents + credit_unclaimed_cents
          == total_claimable_credit_cents == 12500005 must hold exactly, and the
          off-ledger obligation recapture_balance_cents must return to 0 without
          double-counting the 2000001 in both credit_recaptured_cents and the balance.
        test_recipe:
          setup:
            - "Project certified through Part 3 with qre_total_final_cents == 62500013, annual_credit_cents == 2500001 frozen and total_claimable_credit_cents == 12500005; placed in service 2029-01-15."
            - "Master-lease lessee admitted with the pass-through election made."
            - "Tax-year 2029 claim filed for its full gross of 2500001."
            - "Checkpoint 1 (after that filing): credit_claimed_to_date_cents == 2500001, credit_recaptured_cents == 0, credit_unclaimed_cents == 10000004, recapture_balance_cents == 0."
