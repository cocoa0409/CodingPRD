  - rule_id: resource_temporal_overlap
    instances:

      - name: warn_aggregation_window_on_site_is_closed_for_state_notices
        grounds:
          - validations[priority=22]
          - errors[ERR_WARN_WINDOW_COLLISION]
          - entities.WarnNotice.fields.window_end_date
          - state_machines.WarnNotice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Interval occupation on the Site resource with rolling-aggregate, closed-interval
          semantics and no buffer: an ISSUED STATE notice freezes [2026-12-01, 2026-12-31]
          inclusive, so a new selection dated exactly 2026-12-31 collides while
          2027-01-01 does not. No cooldown is added on either side.
