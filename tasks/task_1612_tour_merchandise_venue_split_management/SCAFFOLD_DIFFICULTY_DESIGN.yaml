# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Tour Merchandise & Venue Split Management
# Nine Difficulty Rules x 2 instances each. Every test_recipe is replayable
# from empty-DB against SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: venue_commission_provisional_vs_final
        grounds:
          - calculations.venue_commission
          - entities.Settlement.fields.venue_commission_provisional_cents
          - entities.Settlement.fields.venue_commission_final_cents
        distinguishing_aspect: |
          Same show, same sales: the provisional variant (drawer cash + card
          register) yields commission 119550 while the final variant (register
          only) yields 120000 — a 450-cent divergence driven purely by the
          -3000 cash variance; entity domain is Settlement money.
        test_recipe:
          setup:
            - "ACTIVE tour (std 1000 bps, threshold 500000, bonus 500, licensed flat 500, licensed 2000 bps, tolerance 1000)"
            - "FLAT 1500 bps show opened; OS product priced 4000 with 300 allocated; session float 5000"
            - "Sales: 100 units CASH (400000) + 100 units CARD (400000); counted drawer 402000 (variance -3000, override-verified)"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "DV1 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Austin", venue_name: "DV1 Hall", show_date: "2026-08-10T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "DV1-TEE", name: "DV1 Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 1000 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 4000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 300 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "DV1-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_id: $.data.id }
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_id}", allocation_id: "${a_id}", quantity: 100, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_id}", allocation_id: "${a_id}", quantity: 100, tender: "CARD" }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_id}/count-out"
              payload: { counted_cash_cents: 402000 }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_id}/verify"
              payload: { decision: "APPROVE", variance_override: true }
              as: TourManager
              as_user_id: "tm-2"
            - call: "POST /merch/shows/${s_id}/begin-reconciliation"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { st_id: $.data.settlement_id }
          trigger:
            - call: "POST /merch/settlements/${st_id}/reconcile"
              payload: {}
              as: Accountant
              as_user_id: "acct-1"
              captures: { st: $.data }
          assert:
            - "Settlement.${st_id}.provisional_gross_cents == 797000 (drawer net 402000-5000 plus card 400000)"
            - "Settlement.${st_id}.venue_commission_provisional_cents == 119550"
            - "Settlement.${st_id}.final_gross_cents == 800000"
            - "Settlement.${st_id}.venue_commission_final_cents == 120000"
            - "Settlement.${st_id}.net_to_tour_cents == 680000"
            - "provisional and final commission differ by exactly 450 (the -3000 cash variance x 1500 bps)"

      - name: online_royalty_provisional_vs_final_after_config_change
        grounds:
          - calculations.online_royalty
          - entities.OnlineOrder.fields.artist_royalty_provisional_cents
          - entities.OnlineOrder.fields.artist_royalty_final_cents
        distinguishing_aspect: |
          Same order, same quantity: the provisional variant snapshots the tour
          config at creation (1000 bps -> 10000) while the final variant
          recomputes at fulfill after a royalty-config PATCH (2000 bps -> 20000);
          entity domain is OnlineOrder, disjoint from the Settlement commission pair.
        test_recipe:
          setup:
            - "ACTIVE tour with standard_rate_bps 1000 (threshold 500000, bonus 500, licensed flat 500, licensed 2000)"
            - "OS STANDARD product base_price 5000, warehouse OS stock 100"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "DV2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_v: $.data.version }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "DV2-POSTER", name: "Poster", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 5000, initial_stock_by_size: { OS: 100 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/online-orders"
              payload: { tour_id: "${t_id}", product_id: "${p_id}", quantity: 20 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { o_id: $.data.id }
            - call: "PATCH /merch/tours/${t_id}/royalty-config"
              payload: { standard_rate_bps: 2000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000, expected_tour_version: "${t_v}" }
              as: TourManager
              as_user_id: "tm-1"
          trigger:
            - call: "POST /merch/online-orders/${o_id}/fulfill"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
          assert:
            - "OnlineOrder.${o_id}.gross_cents == 100000"
            - "OnlineOrder.${o_id}.artist_royalty_provisional_cents == 10000 (snapshot at creation, 1000 bps)"
            - "OnlineOrder.${o_id}.artist_royalty_final_cents == 20000 (recomputed at fulfill, 2000 bps)"
            - "OnlineOrder.${o_id}.licensing_provisional_cents == 0 and licensing_final_cents == 0 (STANDARD product)"
            - "OnlineOrder.${o_id}.status == FULFILLED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_commission_straddling_boundary
        grounds:
          - calculations.venue_commission
          - entities.Show.fields.commission_tiers
        distinguishing_aspect: |
          Mode (a): commission on 800000 straddles two marginal tiers —
          500000 x 1000 bps + 300000 x 2000 bps = 110000 — requiring the
          conditional mode branch plus per-tier floor/rate selection; rounding
          is per-tier-then-sum as pinned.
        test_recipe:
          setup:
            - "ACTIVE tour (royalty config std 1000 / threshold 500000 / bonus 500 / licensed 500 flat / 2000 bps; tolerance 1000)"
            - "TIERED show with tiers [(500000,1000),(null,2000)] opened; OS product priced 4000, 300 allocated"
            - "One session (float 5000): single CASH sale of 200 units = 800000; counted 805000 (variance 0), verified by a second seller"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CF1 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Denver", venue_name: "CF1 Arena", show_date: "2026-08-12T20:00:00Z", commission_mode: "TIERED", commission_tiers: [ { up_to_cents: 500000, rate_bps: 1000 }, { up_to_cents: null, rate_bps: 2000 } ] }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CF1-TEE", name: "CF1 Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 1000 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 4000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 300 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "CF1-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller B", seller_code: "CF1-B" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_b: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_id: $.data.id }
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_id}", allocation_id: "${a_id}", quantity: 200, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_id}/count-out"
              payload: { counted_cash_cents: 805000 }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_id}/verify"
              payload: { decision: "APPROVE" }
              as: Seller
              as_user_id: "${sl_b}"
            - call: "POST /merch/shows/${s_id}/begin-reconciliation"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { st_id: $.data.settlement_id }
          trigger:
            - call: "POST /merch/settlements/${st_id}/reconcile"
              payload: {}
              as: Accountant
              as_user_id: "acct-1"
          assert:
            - "Settlement.${st_id}.final_gross_cents == 800000"
            - "Settlement.${st_id}.venue_commission_final_cents == 110000 (50000 tier-1 + 60000 tier-2 marginal)"
            - "Settlement.${st_id}.venue_commission_provisional_cents == 110000 (zero variance: variants agree here)"
            - "Settlement.${st_id}.net_to_tour_cents == 690000"
            - "Settlement.${st_id}.artist_royalty_cents == 78500 (50000 on first 500000 + 28500 marginal on 190000 at 1500 bps)"
            - "Settlement.${st_id}.company_share_cents == 611500"

      - name: size_curve_largest_remainder_tie_order
        grounds:
          - calculations.size_curve_split
          - entities.Allocation.fields.quantity_allocated
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — 101 units over an equal
          1:1:1:1 curve floors to 25 each and the single remainder unit goes to
          S by the ascending-size tie rule (26/25/25/25); naive per-size
          round-half-up would sum to 100, so the pinned algorithm is observable.
        test_recipe:
          setup:
            - "Tour with default curve; show overrides size_curve to {S:1,M:1,L:1,XL:1}"
            - "Sized REGULAR product; allocation generation for 101 units while show is SCHEDULED"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CF2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Boise", venue_name: "CF2 Dome", show_date: "2026-08-15T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500, size_curve: { S: 1, M: 1, L: 1, XL: 1 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CF2-HOODIE", name: "Hoodie", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: true, base_price_cents: 8000, initial_stock_by_size: { S: 100, M: 100, L: 100, XL: 100 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 101 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { row_s: "$.data[0].id", row_m: "$.data[1].id", row_l: "$.data[2].id", row_xl: "$.data[3].id" }
          assert:
            - "generate returns exactly 4 Allocation rows in ascending size order S, M, L, XL"
            - "Allocation.${row_s}: size == S, quantity_allocated == 26 (largest-remainder tie broken toward S)"
            - "Allocation.${row_m}: size == M, quantity_allocated == 25"
            - "Allocation.${row_l}: size == L, quantity_allocated == 25"
            - "Allocation.${row_xl}: size == XL, quantity_allocated == 25"
            - "sum of quantity_allocated over the 4 rows == 101 (exact conservation, no rounding loss)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: settlement_dispute_reconcile_cycle_recomputes
        grounds:
          - state_machines.Settlement.RECONCILED_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_RECONCILED
          - state_machines.SaleRecord.ACTIVE_to_VOIDED
        distinguishing_aspect: |
          Settlement loops RECONCILED -> DISPUTED -> RECONCILED; an audit void
          recorded during DISPUTED changes the register, so the second reconcile
          (resolve) recomputes final_gross_cents from 400000 down to 0 — a cycle
          whose second pass observes different data.
        test_recipe:
          setup:
            - "ACTIVE tour; FLAT 1500 show; OS product price 4000, 300 allocated; session float 5000"
            - "One CASH sale of 100 units (400000); counted 405000 (variance 0), verified by seller B"
            - "Settlement created and reconciled by acct-1: final_gross 400000, commission 60000"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "NL1 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Fresno", venue_name: "NL1 Hall", show_date: "2026-08-16T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "NL1-TEE", name: "NL1 Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 1000 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 4000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 300 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "NL1-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller B", seller_code: "NL1-B" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_b: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_id: $.data.id }
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_id}", allocation_id: "${a_id}", quantity: 100, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_a}"
              captures: { sr_id: $.data.id }
            - call: "POST /merch/seller-sessions/${ss_id}/count-out"
              payload: { counted_cash_cents: 405000 }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_id}/verify"
              payload: { decision: "APPROVE" }
              as: Seller
              as_user_id: "${sl_b}"
            - call: "POST /merch/shows/${s_id}/begin-reconciliation"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { st_id: $.data.settlement_id }
            - call: "POST /merch/settlements/${st_id}/reconcile"
              payload: {}
              as: Accountant
              as_user_id: "acct-1"
          trigger:
            - call: "POST /merch/settlements/${st_id}/dispute"
              payload: { reason: "Venue contests a misrecorded cash drop" }
              as: VenueRep
              as_user_id: "venue-1"
            - call: "POST /merch/sale-records/${sr_id}/void"
              payload: { void_reason: "audit: duplicate register entry" }
              as: Accountant
              as_user_id: "acct-1"
            - call: "POST /merch/settlements/${st_id}/resolve"
              payload: {}
              as: Accountant
              as_user_id: "acct-1"
          assert:
            - "after dispute: Settlement.${st_id}.status == DISPUTED and dispute_reason == 'Venue contests a misrecorded cash drop'"
            - "audit void succeeds during DISPUTED: SaleRecord.${sr_id}.status == VOIDED"
            - "after resolve: Settlement.${st_id}.status == RECONCILED (cycle closed)"
            - "recomputed Settlement.${st_id}.final_gross_cents == 0 (voided sale excluded from register)"
            - "recomputed Settlement.${st_id}.venue_commission_final_cents == 0 and artist_royalty_cents == 0 and company_share_cents == 0"
            - "Settlement.${st_id}.provisional_gross_cents still == 400000 (provisional snapshot is never recomputed)"

      - name: seller_session_recount_loop
        grounds:
          - state_machines.SellerSession.COUNTED_OUT_to_OPEN
          - state_machines.SellerSession.COUNTED_OUT_to_VERIFIED
        distinguishing_aspect: |
          SellerSession branches at COUNTED_OUT: REJECT reverts to OPEN with
          recount_count incremented and count fields cleared, then a fresh
          count-out and APPROVE reaches VERIFIED — a revert loop on a different
          entity than the Settlement cycle.
        test_recipe:
          setup:
            - "ACTIVE tour; FLAT 1500 show opened; OS product price 2000, 100 allocated; sellers A and B rostered"
            - "Session for seller A (float 5000) with one CASH sale of 5 units = 10000 (expected cash 15000)"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "NL2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Tulsa", venue_name: "NL2 Pavilion", show_date: "2026-08-17T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "NL2-CAP", name: "Cap", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 2000, initial_stock_by_size: { OS: 500 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 2000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 100 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "NL2-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
