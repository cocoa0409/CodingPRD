            - "Deal.${deal_id}.version is greater than ${deal_v1}, because the cascade wrote to the deal as well as to the offtaker"

      - name: deal_termination_from_executed_cascades_cps_and_releases_security
        claim_type: cascade_down
        grounds:
          - state_machines.Deal.EXECUTED_to_TERMINATED
          - state_machines.ConditionPrecedent.PENDING_to_FAILED
          - state_machines.CreditSupportInstrument.POSTED_to_RELEASED
          - calculations.cp_completion_pct
          - endpoints.POST_/ppa/deals/{id}/terminate
        distinguishing_aspect: |
          One terminate call fans out down three different child collections in one
          request: the two still-PENDING conditions precedent fail, the POSTED cash
          instrument is RELEASED (and specifically NOT DRAWN, because the reason is
          CP_FAILURE and not BUYER_DEFAULT), and the parent Project's reserved capacity
          is handed back. The already-FAILED condition that vested the right must not be
          touched a second time, and cp_completion_pct must be recomputed to 0.00 rather
          than left at its pre-termination value.
        test_recipe:
          setup:
            - "CHAIN B on a PRE_DEVELOPMENT project, plus a 500000.00 CASH_COLLATERAL DEVELOPMENT_SECURITY instrument that is POSTED before execution, so eligible_credit_usd is 500000.00 at a 0.00 haircut."
            - "The deal executes into EXECUTED with three conditions precedent (PERMITTING, INTERCONNECTION, NOTICE_TO_PROCEED) and cp_completion_pct 0.00."
            - "u_orig_1 FAILs the PERMITTING condition at clock 2026-08-01T00:00:00Z, which sets its cure_deadline to 2026-08-16T00:00:00Z, then the clock moves to 2026-09-01T00:00:00Z so the cure window has lapsed and the CP_FAILURE right is vested."
