      - name: zone_migration_closed_interval_aggregate_capacity_ceiling
        grounds:
          - calculations.zone_migration_capacity
          - validations[priority=46]
          - errors.ERR_ZONE_MIGRATION_CAPACITY_EXCEEDED
          - entities.StorageZone.fields.max_overlapping_migration_jobs
        distinguishing_aspect: |
          Resource: the StorageZone. Interval semantics: CLOSED
          [window_start, window_end] on BOTH ends with no buffer, and rejection is
          AGGREGATE — overlap is perfectly legal until the count of jobs covering one
          instant would EXCEED the ceiling. Two jobs that merely touch at
          2026-09-30 DO overlap under closed semantics, and a peak of exactly 2 against a
          ceiling of 2 is allowed (strict >); only the third job, which straddles both,
          pushes the peak to 3 and is refused. Opposite interval convention, opposite
          rejection rule and a different resource entity from the ExhibitLoan instance.
        test_recipe:
          setup:
            - "A COMPLIANT StorageZone with max_overlapping_migration_jobs == 2 holding three ACCESSIONED MAGNETIC_TAPE items of unit_count 10 in GOOD condition (each job therefore costs 4200*10 = 42000 -> no discount -> handling 4000 -> 46000)."
            - "An ACTIVE PreservationPlan on the zone with budget_cents 500000, so priority 50 never fires."
            - "Job J1 on item-1 with window [2026-09-01T00:00:00Z, 2026-09-30T00:00:00Z] APPROVED."
            - "Job J2 on item-2 with window [2026-09-30T00:00:00Z, 2026-10-31T00:00:00Z] APPROVED — it touches J1 at exactly 2026-09-30, which under CLOSED semantics is an overlap, so the peak is exactly 2 == the ceiling and approval is permitted."
            - "Job J3 on item-3 with window [2026-09-25T00:00:00Z, 2026-10-05T00:00:00Z] created but still PENDING_APPROVAL; it straddles both J1 and J2."
