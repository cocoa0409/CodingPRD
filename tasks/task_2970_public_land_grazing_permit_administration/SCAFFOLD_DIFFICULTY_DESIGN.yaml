          - state_machines.GrazingPermit.ISSUED_to_EXPIRED
        distinguishing_aspect: |
          A third entity pair (GrazingPermit depends on Permittee): the renewal is refused
          because of a live aggregate held on the PERMITTEE — outstanding_balance_cents 54100
          raised by an unpaid bill belonging to a different entity again (GrazingBill of an AOI).
          The permit itself is ISSUED, its term chains correctly and its base property qualifies,
