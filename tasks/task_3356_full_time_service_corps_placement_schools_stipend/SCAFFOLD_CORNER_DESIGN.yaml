        claim_type: role_denial
        grounds:
          - roles.ProgramManager
          - roles.StipendAdministrator
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Segregation of duties across roles: the ProgramManager who verifies hours is locked out of stipend approval entirely (403), whatever the payment state."
        test_recipe:
          setup:
            - "Site ACTIVE, member ACTIVE. Payment SCHEDULED (created by sa-1)."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - call: "POST /corps/members/${member_id}/stipend-payments"
              payload: { period_start: "2026-09-01", period_end: "2026-09-14" }
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /corps/stipend-payments/${pay_id}/state"
              payload: { to_status: "APPROVED", deduction_cents: 0 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { role_err: $.data.error_id }
          assert:
            - "the response status is 403 and ${role_err} == ERR_UNAUTHORIZED_ROLE"

      - name: stipend_admin_cannot_verify_hours
        claim_type: role_denial
        grounds:
          - roles.StipendAdministrator
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "The mirror segregation: a StipendAdministrator cannot VERIFY service hours — the review endpoint is ProgramManager-only."
        test_recipe:
          setup:
            - "Site ACTIVE, member ACTIVE. One PENDING hour entry."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 4.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he_id: $.data.id }
          trigger:
            - call: "POST /corps/hour-entries/${he_id}/review"
              payload: { decision: "VERIFY" }
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { role_err: $.data.error_id }
          assert:
            - "the response status is 403 and ${role_err} == ERR_UNAUTHORIZED_ROLE"
            - "ServiceHourEntry.${he_id} remains PENDING"

      - name: applicant_cannot_screen_application
        claim_type: role_denial
        grounds:
          - roles.Applicant
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "The Applicant role is limited to submitting and answering offers: driving the SCREEN transition is ProgramManager-only."
        test_recipe:
          setup:
            - "Site exists. Application SUBMITTED."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_app
          trigger:
            - call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "SCREEN" }
              as: Applicant
              as_user_id: "app-jordan"
              captures: { role_err: $.data.error_id }
          assert:
            - "the response status is 403 and ${role_err} == ERR_UNAUTHORIZED_ROLE"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: role_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID fails authentication (401) before any role or resource check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /corps/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
          assert:
            - "the response status is 401 and data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: stipend_create_records_creator_and_provisional_fields
        claim_type: side_effect
        grounds:
          - endpoints.POST_/corps/members/{id}/stipend-payments
          - entities.StipendPayment.fields.created_by
          - calculations.stipend_amounts
        distinguishing_aspect: "Creation stamps created_by from X-User-ID, computes the provisional base 50000 and period_days 14, and leaves the final-variant fields null until approval."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE, member ACTIVE with stipend ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
          trigger:
            - call: "POST /corps/members/${member_id}/stipend-payments"
              payload: { period_start: "2026-09-01", period_end: "2026-09-14" }
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { p_id: $.data.id, p_base: $.data.base_amount_cents, p_days: $.data.period_days, p_by: $.data.created_by, p_appr: $.data.approved_by, p_fg: $.data.final_gross_cents, p_st: $.data.status }
          assert:
            - "${p_st} == SCHEDULED and ${p_by} == sa-1 and ${p_appr} is null"
            - "${p_base} == 50000 and ${p_days} == 14 and ${p_fg} is null (final variant not yet computed)"

      - name: evaluation_report_metrics_snapshot_at_create
        claim_type: side_effect
        grounds:
          - endpoints.POST_/corps/evaluation-reports
          - calculations.evaluation_metrics
        distinguishing_aspect: "The report is a snapshot: metrics are computed once at creation; posting a worse attendance figure afterwards does NOT mutate the DRAFT report's frozen numbers."
        test_recipe:
          setup:
            - "Full world: Team Alpha DEPLOYED with the member. Student SA (baseline 80.0, current 85.0) ASSIGNED on 2026-09-01."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
            - *c_agr_active
            - *c_team
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - *c_assign
            - *c_deploy
            - call: "POST /corps/students"
              payload: { school_id: "${school_id}", external_student_ref: "SA", grade_level: 4, focus_list_type: "ATTENDANCE", baseline_attendance_pct: 80.0 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { stu_a: $.data.id }
            - call: "POST /corps/students/${stu_a}/caseload"
              payload: { action: "ASSIGN", corps_member_id: "${member_id}" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/students/${stu_a}/metrics"
              payload: { current_attendance_pct: 85.0 }
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /corps/evaluation-reports"
              payload: { school_id: "${school_id}", period_start: "2026-09-01", period_end: "2026-10-31" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { rep_id: $.data.id, rep_pct1: $.data.pct_improved }
            - call: "POST /corps/students/${stu_a}/metrics"
              payload: { current_attendance_pct: 70.0 }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "GET /corps/schools/${school_id}/evaluation-reports"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { rep_pct2: "$.data[0].pct_improved" }
          assert:
            - "${rep_pct1} == 100.0 (1 eligible, 1 improved at creation)"
            - "${rep_pct2} == 100.0 after the metrics post (snapshot semantics — no recompute on a DRAFT report)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_school_amend_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[school-amend-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Amending with expected_school_version one behind the current version is a deterministic 412; replaying with the current version succeeds."
        test_recipe:
          setup:
            - "Site ACTIVE. School carried to ACTIVE (version 4)."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
            - *c_agr_active
          trigger:
            - call: "POST /corps/schools/${school_id}/amend"
              payload: { expected_school_version: "${school_v} - 1", team_size: 5 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { stale_err: $.data.error_id }
            - call: "POST /corps/schools/${school_id}/amend"
              payload: { expected_school_version: "${school_v}", team_size: 5 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { ok_st: $.data.agreement_status, ok_ts: $.data.team_size }
          assert:
            - "the first response status is 412 and ${stale_err} == ERR_STALE_VERSION"
            - "${ok_st} == AMENDMENT_REVIEW and ${ok_ts} == 5 (fresh version amends cleanly)"

      - name: occ_member_exit_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[member-exit-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Exiting with expected_member_version one behind is a deterministic 412; the member stays ACTIVE and the award uncertified."
        test_recipe:
          setup:
            - "Site ACTIVE. Member ACTIVE (version read fresh)."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /corps/members/${member_id}/exit"
              payload: { expected_member_version: "${m_v} - 1", exit_type: "NON_COMPELLING" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { stale_err: $.data.error_id }
          assert:
            - "the response status is 412 and ${stale_err} == ERR_STALE_VERSION"
            - "Member.${member_id}.service_status remains ACTIVE and award_status remains NOT_EARNED"

      - name: occ_team_assignment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[team-assign-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Assigning with expected_team_version one behind is a deterministic 412; no assignment is created and the roster count is unchanged."
        test_recipe:
          setup:
            - "Site ACTIVE, school ACTIVE. Team Alpha FORMING (version 1). Member ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
            - *c_agr_active
            - *c_team
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - *c_activate
          trigger:
            - call: "POST /corps/teams/${team_id}/assignments"
              payload: { corps_member_id: "${member_id}", start_date: "2026-09-01", expected_team_version: "${team_v} - 1" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { stale_err: $.data.error_id }
            - call: "GET /corps/teams/${team_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { team_cnt: $.data.active_assignment_count, team_still_v: $.data.version }
          assert:
            - "the response status is 412 and ${stale_err} == ERR_STALE_VERSION (${team_v} - 1 == 0 != 1)"
            - "${team_cnt} == 0 and ${team_still_v} == ${team_v} (rejection mutated nothing)"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.School
        distinguishing_aspect: "The School's version walks 1 -> 2 -> 3 -> 4 across create, data-sharing sign, agreement sign, and activation — one increment per mutation, including dimension-only changes."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
          trigger:
            - call: "GET /corps/schools/${school_id}"
              payload: {}
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { v1: $.data.version }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "SIGNED", dimension: "DATA_SHARING" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { v2: $.data.version }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "SIGNED", dimension: "AGREEMENT" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { v3: $.data.version }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "ACTIVE", dimension: "AGREEMENT" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { v4: $.data.version }
          assert:
            - "${v1} == 1 and ${v2} == 2 and ${v3} == 3 and ${v4} == 4"

      - name: derived_cost_share_reconciles_after_amendment
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.district_cost_share_installments
          - entities.Site.fields.cost_share_total_cents
          - concurrency_rules[school-amend-stale-version]
        distinguishing_aspect: "The site's cost-share totals are re-derived on the amend call itself (AMENDMENT_REVIEW stays in the input set with the NEW values): 400000 -> 450000 moves installment_1 from 200000 to 225000 before the liaison confirms."
        test_recipe:
          setup:
            - "Site ACTIVE. School ACTIVE with annual_cost_share_cents 400000 (installments 200000 / 200000)."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
            - *c_agr_active
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { cs1_pre: $.data.cost_share_installment_1_cents, cst_pre: $.data.cost_share_total_cents }
          trigger:
            - call: "POST /corps/schools/${school_id}/amend"
              payload: { expected_school_version: "${school_v}", annual_cost_share_cents: 450000 }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { cs1_mid: $.data.cost_share_installment_1_cents, cst_mid: $.data.cost_share_total_cents }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "ACTIVE", dimension: "AGREEMENT" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { cs1_post: $.data.cost_share_installment_1_cents, cst_post: $.data.cost_share_total_cents }
          assert:
            - "${cs1_pre} == 200000 and ${cst_pre} == 400000"
            - "${cs1_mid} == 225000 and ${cst_mid} == 450000 (reconciled immediately on amend, while still AMENDMENT_REVIEW)"
            - "${cs1_post} == 225000 and ${cst_post} == 450000 (confirmation does not double-apply)"

      - name: posture_reconciles_on_member_activation
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.site_funding_posture
          - entities.Site.fields.projected_obligations_cents
        distinguishing_aspect: "Projected obligations track the member's stipend dimension: activation moves the unfunded site TIGHT -> DEFICIT (0 -> -1300000 headroom), and a service suspension (which force-suspends stipend) returns it to TIGHT."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE with no funding and no members (headroom 0, TIGHT). Member ENROLLED."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_app
            - *c_screen
            - *c_interview
            - *c_offer
            - *c_accept
            - *c_enroll
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { post_pre: $.data.funding_posture, head_pre: $.data.funding_headroom_cents }
          trigger:
            - call: "POST /corps/members/${member_id}/state"
              payload: { to_status: "ACTIVE", dimension: "SERVICE" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { post_mid: $.data.funding_posture, head_mid: $.data.funding_headroom_cents }
            - call: "POST /corps/members/${member_id}/state"
              payload: { to_status: "SUSPENDED", dimension: "SERVICE" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { post_post: $.data.funding_posture, head_post: $.data.funding_headroom_cents }
          assert:
            - "${post_pre} == TIGHT and ${head_pre} == 0 (no members yet -> obligations 0)"
            - "${post_mid} == DEFICIT and ${head_mid} == -1300000 (stipend ACTIVE -> obligations 1300000)"
            - "${post_post} == TIGHT and ${head_post} == 0 (service suspension cascaded stipend to SUSPENDED -> obligations 0 again)"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: school_termination_depth3_cascade
          rationale: "The depth-3 and depth-2 cascade chains are exercised end-to-end by the two transitive_cascade difficulty instances."

