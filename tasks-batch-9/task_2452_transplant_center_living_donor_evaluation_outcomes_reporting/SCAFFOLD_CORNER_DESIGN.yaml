          full_name: Reviewer Med
          staff_role: EVALUATION_REVIEWER
          npi: '1000000003'
        as: ProgramAdmin
        captures:
          revmed_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Psy
          staff_role: EVALUATION_REVIEWER
          npi: '1000000004'
        as: ProgramAdmin
        captures:
          revpsy_id: $.data.id
      trigger:
        call: POST /donor-candidates
        payload:
          program_id: ${prog_id}
          mrn: D-901
          abo_blood_type: O
          age_years: 41
          id: 00000000-0000-4000-8000-000000000000
          version: 42
          created_at: '2020-01-01T00:00:00Z'
          overall_status: APPROVED
          referred_by_staff_id: ${adv_id}
          advocate_staff_id: ${adv_id}
          advocacy_status: ATTESTED
        as: TransplantCoordinator
        as_user_id: ${coord_id}
      assert:
      - HTTP 201
      - the returned id is a server-generated identifier different from 00000000-0000-4000-8000-000000000000
      - version == 1 and created_at == 2026-08-01T00:00:00Z (not 2020-01-01T00:00:00Z)
      - referred_by_staff_id == ${coord_id} (the X-User-ID), not ${adv_id}
      - advocate_staff_id is null and advocacy_status == UNASSIGNED (not ATTESTED)
      - overall_status == REFERRED (not APPROVED)
      - medical_status == PENDING, psychosocial_status == PENDING, disclosure_sequence == 0, deferral_count
        == 0
      - screening_risk_index == 0 and final_risk_index is null
  - name: waitlist_status_event_rows_are_immutable_and_append_only
    claim_type: immutability
    grounds:
    - entities.WaitlistStatusEvent
    - state_machines.RecipientCandidate.WORKUP_to_APPROVED_NOT_LISTED
    - state_machines.RecipientCandidate.APPROVED_NOT_LISTED_to_ACTIVE
    - endpoints[GET /recipient-candidates/{id}/waitlist-events]
    distinguishing_aspect: 'WaitlistStatusEvent is the scaffold''s only common_fields: false entity: two
      status updates produce TWO rows rather than one mutated row, and the rows carry no version field
      because §1.5 declares no write endpoint that could bump one.'
    test_recipe:
      setup:
      - Recipient R-001 has been approved (WORKUP -> APPROVED_NOT_LISTED) and then registered (APPROVED_NOT_LISTED
        -> ACTIVE), both with effective_at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Coordinator One
          staff_role: TRANSPLANT_COORDINATOR
          npi: '1000000001'
        as: ProgramAdmin
        captures:
          coord_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Advocate One
          staff_role: LIVING_DONOR_ADVOCATE
          npi: '1000000002'
        as: ProgramAdmin
        captures:
          adv_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Med
          staff_role: EVALUATION_REVIEWER
          npi: '1000000003'
        as: ProgramAdmin
        captures:
          revmed_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Psy
          staff_role: EVALUATION_REVIEWER
          npi: '1000000004'
        as: ProgramAdmin
        captures:
          revpsy_id: $.data.id
      - call: POST /recipient-candidates
        payload:
          program_id: ${prog_id}
          mrn: R-001
          abo_blood_type: A
          age_years: 44
          cpra: 0.85
          dialysis_years: 2.0
          medical_urgency_points: 7
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          rec1_id: $.data.id
      - call: POST /recipient-candidates/${rec1_id}/status-updates
        payload:
          to_status: APPROVED_NOT_LISTED
          reason_code: WORKUP_COMPLETE
          effective_at: '2026-08-01T00:00:00Z'
        as: TransplantCoordinator
        as_user_id: ${coord_id}
      - call: POST /recipient-candidates/${rec1_id}/status-updates
        payload:
          to_status: ACTIVE
          reason_code: LISTED
          effective_at: '2026-08-01T00:00:00Z'
        as: TransplantCoordinator
        as_user_id: ${coord_id}
      trigger:
        call: GET /recipient-candidates/${rec1_id}/waitlist-events
        payload:
          limit: 10
          offset: 0
        as: TransplantCoordinator
        as_user_id: ${coord_id}
      assert:
      - HTTP 200 with total_count == 2 and has_more == false
      - data[0].from_status == WORKUP and data[0].to_status == APPROVED_NOT_LISTED and data[0].reason_code
        == WORKUP_COMPLETE
      - data[1].from_status == APPROVED_NOT_LISTED and data[1].to_status == ACTIVE and data[1].reason_code
        == LISTED
      - both rows carry actor_user_id == ${coord_id} and effective_at == 2026-08-01T00:00:00Z
      - neither row exposes a version field or an updated_at field, and §1.5 declares no PATCH, PUT or
        DELETE for waitlist events
      - RecipientCandidate.${rec1_id}.registered_at == 2026-08-01T00:00:00Z and candidacy_approved_by_staff_id
        == ${coord_id}
  - name: staff_member_listing_paginates_and_filters_by_role
    claim_type: listing
    grounds:
    - entities.StaffMember.fields.staff_role
    - endpoints[GET /programs/{id}/staff-members]
    - response_envelope.pagination_fields
    distinguishing_aspect: 'The filter is applied BEFORE pagination: total_count reports the 2 matching
      EVALUATION_REVIEWER rows out of 5 staff, not 5, while limit 1 still returns a single element with
      has_more true.'
    test_recipe:
      setup:
      - 'Program NLT-01 employs 5 staff members: one TRANSPLANT_COORDINATOR, one LIVING_DONOR_ADVOCATE,
        two EVALUATION_REVIEWER and one QUALITY_OFFICER.'
