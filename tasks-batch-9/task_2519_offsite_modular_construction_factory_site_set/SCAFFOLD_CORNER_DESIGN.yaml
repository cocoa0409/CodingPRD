  # ===========================================================================
  - section: state_machines
    instances:
      - name: module_create_starts_all_three_dimensions_in_their_initial_states
        claim_type: Initial State
        grounds:
          - state_machines[ModuleUnit.production_status]
          - state_machines[ModuleUnit.qc_status]
          - state_machines[ModuleUnit.site_status]
          - endpoints[POST /modular/modules]
        distinguishing_aspect: |
          ModuleUnit carries three independent state dimensions. A newly created module must sit at
          the initial state of each one at the same time — PLANNED / PENDING / AT_FACTORY — with
          station_index 0 and no slot, pick, shipment or set timestamps.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Factory, Project and a DRAFT design package exist"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, forecast_wind_gust_mph: 0, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
          trigger:
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { p: "$.data.production_status", q: "$.data.qc_status", s: "$.data.site_status", st: "$.data.station_index", cls: "$.data.envelope_class" }
          assert:
            - "HTTP 201 with ${p} == 'PLANNED', ${q} == 'PENDING', ${s} == 'AT_FACTORY'"
            - "${st} == 0, ${cls} == 'STANDARD', line_slot_start == null, pick_window_start == null, shipment_id == null, set_at == null"
            - "wip_earned_cents == 0 and exposure_open_hours == 0.00 on the fresh row"
            - "pair_role == 'SINGLE' and connection_scope_owner == 'FIELD' (declared defaults)"

      - name: shipment_survey_dispatch_deliver_walk_the_declared_transitions
        claim_type: Valid Transition
        grounds:
          - state_machines[Shipment.status]
          - state_machines[Shipment.route_survey_state]
          - state_machines[ModuleUnit.site_status]
          - endpoints[POST /modular/shipments/{shipmentId}/dispatch]
          - endpoints[POST /modular/shipments/{shipmentId}/deliver]
        distinguishing_aspect: |
          A STANDARD load walks DRAFT -> PERMITTED -> DISPATCHED -> DELIVERED, and each shipment
          transition drags the loaded module's own site_status along: LOADED -> IN_TRANSIT ->
          DELIVERED. The survey dimension ends at COMPLETED without ever visiting REQUIRED.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; FROZEN R1 pinned by an APPROVED plan review"
            - "module M-01 LINE_COMPLETE, qc RELEASED, loaded on a STANDARD single-state shipment"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
