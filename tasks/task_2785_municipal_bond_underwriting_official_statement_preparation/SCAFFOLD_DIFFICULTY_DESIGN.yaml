              captures: { t2_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/syndicate-members"
              payload: { firm_id: "${uw_firm_id}", member_role: "SENIOR_MANAGER", liability_pct: 100.0000, takedown_share_pct: 100.0000, priority_rank: 1 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/submit-structure"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/designate-sale-method"
              payload: { sale_method: "NEGOTIATED" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/order-periods"
              payload: { period_type: "INSTITUTIONAL", opens_at: "2026-08-05T13:00:00.000Z", closes_at: "2026-08-05T17:00:00.000Z", priority_policy: "STANDARD_PRIORITY" }
              as: Underwriter
