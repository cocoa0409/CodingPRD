  # ---- Logical clock -------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: Set the server's logical UTC clock, which every deadline, expiry, cooling-off and overlap check reads. The clock defaults to 2026-08-01T00:00:00Z on a fresh server and only ever moves when this endpoint is called.
    roles: [PlatformAdmin]
    success_code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "recompute proof-of-funds expiry effects on every CashBuyer's verified_funds_cents and buyer_tier"

# =============================================================================
# §1.6 Error Code Catalog
# Every code below is reachable from at least one §1.8 or §1.9 instance.
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: X-User-Role header missing, empty or not one of the six declared roles, or X-User-ID missing where actor identity matters
    applies_to: [all endpoints]
  - id: ERR_FORBIDDEN_ROLE
    http_status: 403
    condition: the caller's role is not in the endpoint's roles list
    applies_to: [all endpoints]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: schema, type, enum, range or interval-ordering violation in the request body
    applies_to: [all endpoints]
  - id: ERR_PAGINATION_OUT_OF_RANGE
    http_status: 400
    condition: limit outside 1..100 or offset below 0
    applies_to: [all list endpoints]

  - id: ERR_WHOLESALER_NOT_FOUND
    http_status: 404
    condition: wholesaler_id in the path or body resolves to no row
    applies_to: ["GET /wholesalers/{wholesaler_id}", "POST /marketing-campaigns", "POST /seller-leads", "POST /cash-buyers", "POST /compliance-reviews"]
  - id: ERR_MARKETING_CAMPAIGN_NOT_FOUND
    http_status: 404
    condition: marketing_campaign_id in the path or body resolves to no row
    applies_to: ["GET /marketing-campaigns/{marketing_campaign_id}", "POST /marketing-campaigns/{marketing_campaign_id}/publish", "POST /marketing-campaigns/{marketing_campaign_id}/archive", "POST /seller-leads"]
  - id: ERR_SELLER_LEAD_NOT_FOUND
    http_status: 404
    condition: seller_lead_id or subject_seller_lead_id resolves to no row
    applies_to: ["GET /seller-leads/{seller_lead_id}", "POST /seller-leads/{seller_lead_id}/protection-screen", "POST /deal-analyses", "POST /purchase-contracts", "POST /compliance-reviews"]
  - id: ERR_DEAL_ANALYSIS_NOT_FOUND
    http_status: 404
    condition: deal_analysis_id in the path or body resolves to no row
    applies_to: ["GET /deal-analyses/{deal_analysis_id}", "POST /deal-analyses/{deal_analysis_id}/finalize", "POST /purchase-contracts"]
  - id: ERR_PURCHASE_CONTRACT_NOT_FOUND
    http_status: 404
    condition: purchase_contract_id in the path or body resolves to no row
    applies_to: ["GET /purchase-contracts/{purchase_contract_id}", "POST /purchase-contracts/{purchase_contract_id}/sign", "POST /purchase-contracts/{purchase_contract_id}/elect-structure", "POST /purchase-contracts/{purchase_contract_id}/cancel", "POST /disclosure-acknowledgements", "POST /assignment-offers", "POST /title-orders", "POST /dispute-cases"]
  - id: ERR_DISCLOSURE_ACKNOWLEDGEMENT_NOT_FOUND
    http_status: 404
    condition: disclosure_acknowledgement_id resolves to no row
    applies_to: ["GET /disclosure-acknowledgements/{disclosure_acknowledgement_id}"]
  - id: ERR_EARNEST_MONEY_DEPOSIT_NOT_FOUND
    http_status: 404
    condition: earnest_money_deposit_id resolves to no row
    applies_to: ["GET /earnest-money-deposits/{earnest_money_deposit_id}", "POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit"]
  - id: ERR_CASH_BUYER_NOT_FOUND
    http_status: 404
    condition: cash_buyer_id in the path or body resolves to no row
    applies_to: ["GET /cash-buyers/{cash_buyer_id}", "POST /proof-of-funds", "POST /assignment-offers"]
  - id: ERR_PROOF_OF_FUNDS_NOT_FOUND
    http_status: 404
    condition: proof_of_funds_id resolves to no row
    applies_to: ["GET /proof-of-funds/{proof_of_funds_id}", "POST /proof-of-funds/{proof_of_funds_id}/verify"]
  - id: ERR_ASSIGNMENT_OFFER_NOT_FOUND
    http_status: 404
    condition: assignment_offer_id or supersedes_offer_id resolves to no row
    applies_to: ["GET /assignment-offers/{assignment_offer_id}", "POST /assignment-offers", "POST /assignment-offers/{assignment_offer_id}/counter", "POST /assignment-offers/{assignment_offer_id}/revise", "POST /assignment-offers/{assignment_offer_id}/accept", "POST /assignment-agreements"]
  - id: ERR_ASSIGNMENT_AGREEMENT_NOT_FOUND
    http_status: 404
    condition: assignment_agreement_id resolves to no row
    applies_to: ["GET /assignment-agreements/{assignment_agreement_id}", "POST /assignment-agreements/{assignment_agreement_id}/settle"]
  - id: ERR_TITLE_ORDER_NOT_FOUND
    http_status: 404
    condition: title_order_id resolves to no row
    applies_to: ["GET /title-orders/{title_order_id}", "POST /title-orders/{title_order_id}/clear-to-fund", "POST /title-orders/{title_order_id}/fund-and-close"]
  - id: ERR_COMPLIANCE_REVIEW_NOT_FOUND
    http_status: 404
    condition: compliance_review_id resolves to no row
    applies_to: ["GET /compliance-reviews/{compliance_review_id}", "POST /compliance-reviews/{compliance_review_id}/adjudicate"]
  - id: ERR_DISPUTE_CASE_NOT_FOUND
    http_status: 404
    condition: dispute_case_id resolves to no row
    applies_to: ["GET /dispute-cases/{dispute_case_id}", "POST /dispute-cases/{dispute_case_id}/submit-evidence", "POST /dispute-cases/{dispute_case_id}/adjudicate"]

  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: the acting principal does not own the target aggregate
    applies_to: [all mutating endpoints with an owning principal]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: the adjudicating officer is the officer who opened the review
    applies_to: ["POST /compliance-reviews/{compliance_review_id}/adjudicate"]
  - id: ERR_DUAL_CONTROL_REQUIRED
    http_status: 403
    condition: the funding title agent is the agent who cleared the order to fund
    applies_to: ["POST /title-orders/{title_order_id}/fund-and-close"]

  - id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    condition: expected_purchase_contract_version does not match PurchaseContract.version
    applies_to: ["POST /assignment-offers"]
  - id: ERR_STALE_LEAD_VERSION
    http_status: 412
    condition: expected_seller_lead_version does not match SellerLead.version
    applies_to: ["POST /deal-analyses"]

  - id: ERR_INVALID_STATE
    http_status: 409
    condition: the requested trigger has no outgoing transition from the entity's current state
    applies_to: [all action endpoints]
  - id: ERR_CONTRACT_TERMINAL
    http_status: 409
    condition: the governing contract is CLOSED or CANCELLED
    applies_to: [contract, offer, agreement and title action endpoints only]
  - id: ERR_CAMPAIGN_NOT_PUBLISHED
    http_status: 409
    condition: the referenced marketing campaign is not PUBLISHED
    applies_to: ["POST /seller-leads"]
  - id: ERR_LEAD_NOT_SCREENED
    http_status: 409
    condition: the referenced lead is still PROSPECT or already CLOSED
    applies_to: ["POST /purchase-contracts"]
  - id: ERR_DEAL_ANALYSIS_NOT_FINALIZED
    http_status: 409
    condition: the referenced analysis is not FINALIZED or belongs to a different lead
    applies_to: ["POST /purchase-contracts"]
  - id: ERR_CONTRACT_NOT_SIGNED
    http_status: 409
    condition: the governing contract has never been signed
    applies_to: ["POST /assignment-offers", "POST /title-orders", "POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit"]
  - id: ERR_POF_NOT_VERIFIED
    http_status: 409
    condition: the bidding buyer has no VERIFIED proof of funds at all
    applies_to: ["POST /assignment-offers/{assignment_offer_id}/accept"]
  - id: ERR_OFFER_NOT_ACCEPTED
    http_status: 409
    condition: the referenced offer is not in status ACCEPTED
    applies_to: ["POST /assignment-agreements"]
  - id: ERR_CONTRACT_NOT_ASSIGNED
    http_status: 409
    condition: an ASSIGNMENT-structured title order is cleared before the assignment was executed
    applies_to: ["POST /title-orders/{title_order_id}/clear-to-fund"]
  - id: ERR_DEPOSIT_NOT_HELD
    http_status: 409
    condition: the earnest money deposit is not in the status the requested disposition needs
    applies_to: ["POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit", "POST /dispute-cases/{dispute_case_id}/adjudicate"]
  - id: ERR_EVIDENCE_INCOMPLETE
    http_status: 409
    condition: one of the two parties has not filed evidence
    applies_to: ["POST /dispute-cases/{dispute_case_id}/adjudicate"]

  - id: ERR_WHOLESALER_COMPLIANCE_HOLD
    http_status: 403
    condition: the governing wholesaler is on a compliance hold
    applies_to: [origination and assignment-execution endpoints]
  - id: ERR_INTENT_TO_ASSIGN_NOT_DISCLOSED
    http_status: 422
    condition: publishing a campaign that does not disclose the intent to assign
    applies_to: ["POST /marketing-campaigns/{marketing_campaign_id}/publish"]
  - id: ERR_LICENSURE_DISCLOSURE_MISSING
    http_status: 422
    condition: an unlicensed wholesaler publishes a campaign without disclosing unlicensed status
    applies_to: ["POST /marketing-campaigns/{marketing_campaign_id}/publish"]
  - id: ERR_DNC_SCRUB_REQUIRED
    http_status: 422
    condition: publishing an SMS or COLD_CALL campaign whose list was not do-not-call scrubbed
    applies_to: ["POST /marketing-campaigns/{marketing_campaign_id}/publish"]
  - id: ERR_DISCLOSURE_ACKNOWLEDGEMENT_MISSING
    http_status: 422
    condition: signing without a matching seller acknowledgement of the current disclosure packet
    applies_to: ["POST /purchase-contracts/{purchase_contract_id}/sign"]
  - id: ERR_EQUITY_SKIMMING_PROHIBITED
    http_status: 422
    condition: contracting an ELEVATED or PROTECTED lead below the statutory equity floor
    applies_to: ["POST /purchase-contracts"]
  - id: ERR_COOLING_OFF_NOT_ELAPSED
    http_status: 422
    condition: monetising a PROTECTED lead's contract inside the 72-hour cooling-off window
    applies_to: ["POST /assignment-offers/{assignment_offer_id}/accept", "POST /assignment-agreements"]
  - id: ERR_UNLICENSED_BROKERAGE_ACTIVITY
    http_status: 422
    condition: an unlicensed wholesaler brokers a resale on a contract that grants no assignment rights
    applies_to: ["POST /assignment-offers/{assignment_offer_id}/counter", "POST /assignment-agreements"]

  - id: ERR_INSPECTION_PERIOD_EXPIRED
    http_status: 409
    condition: wholesaler cancellation at or after the inspection deadline, or forfeiture before it
    applies_to: ["POST /purchase-contracts/{purchase_contract_id}/cancel", "POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit"]
  - id: ERR_ASSIGNMENT_DEADLINE_PASSED
    http_status: 409
    condition: accepting or papering an assignment at or after the 48-hour pre-closing cutoff
    applies_to: ["POST /assignment-offers/{assignment_offer_id}/accept", "POST /assignment-agreements"]
  - id: ERR_PROOF_OF_FUNDS_EXPIRED
    http_status: 422
    condition: the buyer's only verified proof of funds has expired, or a verify targets an already-expired proof
    applies_to: ["POST /assignment-offers/{assignment_offer_id}/accept", "POST /proof-of-funds/{proof_of_funds_id}/verify"]
  - id: ERR_PROPERTY_OCCUPANCY_CONFLICT
    http_status: 409
    condition: the candidate option-to-closing interval collides with a live contract on the same property
    applies_to: ["POST /purchase-contracts"]
  - id: ERR_FUNDING_WINDOW_CONFLICT
    http_status: 409
    condition: the candidate double-close funding window collides with the wholesaler's buffered capacity
    applies_to: ["POST /title-orders"]

  - id: ERR_STRUCTURE_MISMATCH
    http_status: 409
    condition: the agreement's structure does not match the contract's elected structure
    applies_to: ["POST /assignment-agreements"]
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    condition: countering or revising an offer that has exhausted its four negotiation rounds
    applies_to: ["POST /assignment-offers/{assignment_offer_id}/counter", "POST /assignment-offers/{assignment_offer_id}/revise"]
  - id: ERR_INSUFFICIENT_QUALIFYING_COMPS
    http_status: 422
    condition: finalizing an analysis with fewer than three qualifying comparables
    applies_to: ["POST /deal-analyses/{deal_analysis_id}/finalize"]
  - id: ERR_DUPLICATE_ACTIVE_OFFER
    http_status: 409
    condition: a buyer stacks a second live offer on the same contract without superseding the first
    applies_to: ["POST /assignment-offers"]

  - id: ERR_MAO_EXCEEDED
    http_status: 422
    condition: the purchase price exceeds the finalized analysis ceiling
    applies_to: ["POST /purchase-contracts"]
  - id: ERR_OFFER_BELOW_CONTRACT_PRICE
    http_status: 422
    condition: the buyer price is below what the wholesaler owes the seller
    applies_to: ["POST /assignment-offers", "POST /assignment-offers/{assignment_offer_id}/revise"]
  - id: ERR_INSUFFICIENT_VERIFIED_FUNDS
    http_status: 422
    condition: the buyer's deposit exceeds available funds or the buyer price exceeds verified funds
    applies_to: ["POST /assignment-offers", "POST /assignment-offers/{assignment_offer_id}/revise"]
  - id: ERR_ASSIGNMENT_FEE_CAP_EXCEEDED
    http_status: 422
    condition: the implied assignment fee exceeds the seller's protection-tier cap
    applies_to: ["POST /assignment-offers/{assignment_offer_id}/accept", "POST /assignment-agreements"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# role_model: segregation_of_duties
# The X-User-Role header selects the role; the X-User-ID header selects the principal.
# =============================================================================
roles:
  - name: Wholesaler
    description: The wholesaling entity itself. Originates campaigns and leads, underwrites deals, contracts with sellers, curates the buyer list, negotiates and accepts assignment fees, and coordinates title.
    identity: "entity_backed:Wholesaler"
    exclusive_operations:
      - POST /marketing-campaigns
      - POST /marketing-campaigns/{marketing_campaign_id}/publish
      - POST /marketing-campaigns/{marketing_campaign_id}/archive
      - POST /seller-leads
      - POST /deal-analyses
      - POST /deal-analyses/{deal_analysis_id}/finalize
      - POST /purchase-contracts
      - POST /purchase-contracts/{purchase_contract_id}/elect-structure
      - POST /cash-buyers
      - POST /proof-of-funds/{proof_of_funds_id}/verify
      - POST /assignment-offers/{assignment_offer_id}/counter
      - POST /assignment-offers/{assignment_offer_id}/accept
      - POST /assignment-agreements
      - POST /title-orders
    shared_operations:
      - POST /seller-leads/{seller_lead_id}/protection-screen
      - POST /purchase-contracts/{purchase_contract_id}/cancel
      - POST /dispute-cases/{dispute_case_id}/submit-evidence
      - all read endpoints except GET /wholesalers

  - name: Seller
    description: The distressed property owner behind a SellerLead. Signs the contract, records disclosure acknowledgements, may cancel without a time box, and opens and prosecutes disputes.
    identity: "entity_backed:SellerLead"
    exclusive_operations:
      - POST /disclosure-acknowledgements
      - POST /purchase-contracts/{purchase_contract_id}/sign
      - POST /dispute-cases
    shared_operations:
      - POST /purchase-contracts/{purchase_contract_id}/cancel
      - POST /dispute-cases/{dispute_case_id}/submit-evidence
      - read endpoints for the deal they are party to

  - name: CashBuyer
    description: An end buyer on a wholesaler's buyer list. Uploads proof of funds, bids on contracts and revises after counters.
    identity: "entity_backed:CashBuyer"
    exclusive_operations:
      - POST /proof-of-funds
      - POST /assignment-offers
      - POST /assignment-offers/{assignment_offer_id}/revise
    shared_operations:
      - read endpoints for contracts and offers they are party to

  - name: TitleAgent
    description: Escrow and title staff. Clears files to fund, wires and closes under dual control, settles assignment fees and forfeits earnest money. Two distinct TitleAgent principals are required to clear and then fund the same order.
    identity: opaque
    exclusive_operations:
      - POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit
      - POST /assignment-agreements/{assignment_agreement_id}/settle
      - POST /title-orders/{title_order_id}/clear-to-fund
      - POST /title-orders/{title_order_id}/fund-and-close
    shared_operations:
      - read endpoints for the files they handle

  - name: ComplianceOfficer
    description: Regulator-facing reviewer. Opens and adjudicates compliance reviews under segregation of duties, adjudicates seller disputes, may re-screen a lead and may cancel a contract at any time.
    identity: opaque
    exclusive_operations:
      - POST /compliance-reviews
      - POST /compliance-reviews/{compliance_review_id}/adjudicate
      - POST /dispute-cases/{dispute_case_id}/adjudicate
    shared_operations:
      - POST /seller-leads/{seller_lead_id}/protection-screen
      - POST /purchase-contracts/{purchase_contract_id}/cancel
      - GET /wholesalers
      - all other read endpoints

  - name: PlatformAdmin
    description: Operator of the platform. Registers wholesalers, reads the wholesaler roster and drives the logical clock. Holds no deal-level authority whatsoever.
    identity: opaque
    exclusive_operations:
      - POST /wholesalers
      - POST /_clock/set_current_utc
    shared_operations:
      - GET /wholesalers
      - read endpoints across all aggregates
