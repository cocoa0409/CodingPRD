      - name: quota_exhausted_when_the_last_slot_is_already_counted
        claim_type: aggregate_validation
        grounds:
          - validations[priority 60]
          - calculations.county_quota_position
          - errors.ERR_COUNTY_QUOTA_EXHAUSTED
        distinguishing_aspect: "With quota_licenses_total 1 the first licence is accepted and the second is refused at priority 60 with ERR_COUNTY_QUOTA_EXHAUSTED, while a licence created with counts_against_quota false is still accepted afterwards because it never consumes a slot."
        test_recipe:
          setup:
            - "County MAR with quota_licenses_total 1 and one seller profile."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "MAR", name: "Marin", state_code: "CA", quota_licenses_total: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "MAR-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 40000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
          trigger:
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "MAR-2", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 40000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              expect_error: true
              captures: { eid: $.data.error_id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "MAR-3", license_class: "CLASS_41_ONSALE_BEER_WINE", annual_gross_receipts_cents: 40000000, last_active_date: "2026-07-01", counts_against_quota: false }
              as: PlatformAdmin
          assert:
            - "HTTP 409 and ${eid} == ERR_COUNTY_QUOTA_EXHAUSTED on the second quota-counted create"
            - "County.${c_id}.quota_licenses_counted == 1, quota_available == 0, quota_utilization_bps == 10000"
            - "The counts_against_quota false licence is created with HTTP 201"
            - "County.${c_id}.quota_licenses_counted is still 1 after it (a non-counted licence never consumes a slot)"
            - "GET /licenses?county_id=${c_id} returns total_count == 2"

      - name: protest_filed_one_day_after_protest_deadline_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority 70]
          - entities.TransferApplication.fields.protest_deadline_at
          - errors.ERR_PROTEST_WINDOW_CLOSED
        distinguishing_aspect: "protest_deadline_at is derived from min(posting_period_days 30, protest_window_days 15), so on a posting opened 2026-08-01 the protest window shuts at 2026-08-16 even though the posting itself runs to 2026-08-31; a protest offered on 2026-08-17 is refused with ERR_PROTEST_WINDOW_CLOSED while the application stays POSTED."
