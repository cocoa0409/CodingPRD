  # ===========================================================================
  # §1.5 breadth. One instance per endpoint pattern of the extraction guide, and
  # every declared side_effect of the sweep, override, link and computed-read
  # endpoints exercised at least once.
  - section: endpoints
    instances:

      - name: standard_crud_on_representatives_including_patch_recompute_and_pagination
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /representatives]
          - endpoints[GET /representatives]
          - endpoints[GET /representatives/{representative_id}]
          - endpoints[PATCH /representatives/{representative_id}]
          - calculations.representative_authorization_status
        distinguishing_aspect: "The full CRUD surface on the one entity that has a PATCH: create returns 201 with derived fields already populated, the single read echoes them, the list read honours limit/offset with total_count and has_more in meta, and PATCH both stores the new value AND re-derives authorization_status in the same response. There is no DELETE anywhere in §1.5, so retirement is modelled as a status PATCH; and the derived field must move on PATCH rather than only on the next read."
        test_recipe:
          setup:
            - "Empty database, clock 2026-08-03T09:00:00.000Z. Three representatives are created so pagination has something to slice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /representatives"
              payload: { full_name: "Ada Ortiz", rep_type: "STAFF_ATTORNEY", languages: ["en", "es"], max_case_load: 25, max_supervisees: 10, weekly_capacity_hours: 40, bar_number: "BAR-1001" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Vic Lang", rep_type: "PRO_BONO_VOLUNTEER", languages: ["en"], max_case_load: 5, max_supervisees: 0, weekly_capacity_hours: 10 }
              as: ProgramDirector
              captures: { vol_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Gus Reed", rep_type: "LAW_GRADUATE", languages: ["en"], max_case_load: 5, max_supervisees: 0, weekly_capacity_hours: 20 }
              as: ProgramDirector
              captures: { grad_id: "$.data.id" }
            - call: "GET /representatives/${atty_a_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /representatives"
              payload: { limit: 2, offset: 0 }
              as: ProgramDirector
            - call: "GET /representatives"
              payload: { limit: 2, offset: 2 }
              as: ProgramDirector
            - call: "GET /representatives"
              payload: { rep_type: "STAFF_ATTORNEY" }
              as: ProgramDirector
            - call: "PATCH /representatives/${atty_a_id}"
              payload: { max_case_load: 30, languages: ["en", "es", "pt"] }
              as: ProgramDirector
            - call: "PATCH /representatives/${vol_id}"
              payload: { status: "SEPARATED" }
              as: ProgramDirector
          assert:
            - "trigger 1: HTTP status == 201; data echoes full_name 'Ada Ortiz', rep_type 'STAFF_ATTORNEY', languages ['en','es'], max_case_load 25, max_supervisees 10, weekly_capacity_hours 40, bar_number 'BAR-1001'"
            - "trigger 1: data also carries the system and computed fields — id present, version == 1, status == 'ACTIVE', authorization_status == 'AUTHORIZED_ATTORNEY', active_case_load == 0, supervisee_count == 0, created_at present"
            - "trigger 4: HTTP status == 200 and every field of trigger 1's response is reproduced byte-for-byte"
            - "trigger 5: HTTP status == 200, exactly 2 rows, meta.total_count == 3 and meta.has_more == true"
            - "trigger 6: exactly 1 row, meta.total_count == 3 and meta.has_more == false"
            - "trigger 7: exactly 1 row (Ada Ortiz), meta.total_count == 1 — the filter narrows total_count, not just the page"
            - "trigger 8: HTTP status == 200, max_case_load == 30, languages == ['en','es','pt'], version == 2, and authorization_status is still 'AUTHORIZED_ATTORNEY' because nothing the ladder reads changed"
            - "trigger 9: HTTP status == 200, status == 'SEPARATED' and authorization_status == 'UNAUTHORIZED' in the SAME response body — the derived field is recomputed inside the write, not lazily on the next read"
            - "no DELETE endpoint exists for this or any entity in §1.5"

      - name: checkpoint_phase_order_is_normative_and_the_sweep_is_idempotent_at_a_fixed_clock
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /capacity-cycles/{cycle_id}/checkpoint]
          - calculations.capacity_slot_waterfall
          - state_machines.IntakeScreening
        distinguishing_aspect: "Two WAITLISTED rows, one already expired and one live, plus exactly one free slot. Because PHASE 1 (expiry) runs strictly before PHASE 2 (promotion), the expired row must be moved to WAITLIST_EXPIRED and must NEVER be promoted, so the live row takes the slot even though the expired row holds the lower waitlist_rank. Re-running the sweep at the same logical clock changes nothing except checkpoint_epoch, which still increments — so idempotency here means state-idempotent, not response-identical. The endpoint has no cycle-window precondition, so it runs even when the clock is far outside the cycle period."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Cycle FY26-H2 (2026-07-01..2026-12-31) with total_case_slots 2 and reserved_detained_slots 0."
            - "Two non-detained U_VISA matters are accepted, filling both slots. Two further intakes are then screened and decided, so with no free pool they are WAITLISTED: W1 first (waitlist_rank 1, waitlist_expires_at_utc 2026-09-02T09:00:00.000Z) and W2 second (waitlist_rank 2, expiry 2026-09-02T09:00:00.000Z)."
            - "The clock is moved to 2026-09-02T09:00:00.001Z so W1 is expired, and W2's own intake is re-created later — instead, to keep exactly one expired row, W2 is created after a second clock move so its expiry is 2026-10-04T09:00:00.000Z."
            - "One of the two consuming matters is then withdrawn through its intake, freeing exactly one general slot."
          setup_api_calls:
            - call: "TEMPLATE A, with total_case_slots 2 and reserved_detained_slots 0"
              payload: {}
              as: ProgramDirector
            - call: "POST /clients then ACCEPT_INTAKE(client=<new Bea Rios>, case_type=U_VISA, detained=false) — this consumes the second and last general slot"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { bea_intake_id: "$.data.id", bea_matter_id: "$.data[0].id" }
            - call: "POST /clients then POST /intake-screenings then /screen then /decide with decision ACCEPT for <new Cyd Mora> — no slot is free, so the row is WAITLISTED at rank 1 with waitlist_expires_at_utc 2026-09-02T09:00:00.000Z"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { w1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /clients then POST /intake-screenings then /screen then /decide with decision ACCEPT for <new Dov Sarr> — still no slot, so this row is WAITLISTED at rank 2 with waitlist_expires_at_utc 2026-10-04T09:00:00.000Z"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { w2_id: "$.data.id" }
            - call: "POST /intake-screenings/${bea_intake_id}/withdraw"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /capacity-cycles/${cycle_id}/checkpoint"
              payload: {}
              as: ProgramDirector
            - call: "POST /capacity-cycles/${cycle_id}/checkpoint"
              payload: {}
              as: ProgramDirector
          assert:
            - "setup: IntakeScreening.${w1_id}.status == 'WAITLISTED' with waitlist_rank 1 and waitlist_expires_at_utc '2026-09-02T09:00:00.000Z'; IntakeScreening.${w2_id}.status == 'WAITLISTED' with waitlist_rank 2 and waitlist_expires_at_utc '2026-10-04T09:00:00.000Z'"
            - "setup: after the withdraw, ProgramCapacityCycle.${cycle_id}.general_slots_consumed == 1 and available_slot_count == 1 — the CASCADE-B hop-4 auto-promotion did not fire here because at that instant W1 was already past its expiry and W2 was created after the withdraw target was chosen; the sweep is what resolves the free slot"
            - "trigger 1: HTTP status == 200"
            - "trigger 1: IntakeScreening.${w1_id}.status == 'WAITLIST_EXPIRED' with waitlist_rank null — PHASE 1 caught it because 2026-09-02T09:00:00.000Z is at or before the clock"
            - "trigger 1: IntakeScreening.${w2_id}.status == 'ACCEPTED' and a CaseMatter now exists with intake_id == ${w2_id} — the lower-ranked LIVE row was promoted, and the expired row was NEVER promoted despite holding rank 1"
            - "trigger 1: ProgramCapacityCycle.${cycle_id}.general_slots_consumed == 2, available_slot_count == 0, waitlisted_count == 0, utilization_ratio == 1.0000, capacity_posture == 'FROZEN', checkpoint_epoch == 1, last_checkpoint_utc == '2026-09-04T09:00:00.000Z'"
            - "trigger 2: HTTP status == 200 and every entity state is byte-identical to trigger 1 except checkpoint_epoch == 2, last_checkpoint_utc unchanged at the same clock instant, and ProgramCapacityCycle.version incremented — no intake, matter or accreditation moved a second time"
            - "the endpoint succeeded at a clock instant (2026-09-04) that is inside the cycle window, and would equally succeed outside it, because no cycle-window precondition is declared"

      - name: cross_reference_link_relink_supervision_moves_the_counter_between_two_supervisors
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /case-assignments/{assignment_id}/relink-supervision]
          - calculations.supervisor_auto_selection
          - validations[priority 23 ERR_SUPERVISION_LINK_INELIGIBLE]
        distinguishing_aspect: "Relinking is a link-only write that must move supervisee_count off one representative and onto another in the same transaction, flip supervision_source from AUTO_SELECTED to EXPLICIT_LINK, and hold the explicit target to exactly the same eligibility predicate the auto-selector uses — including the client-language clause, which is what makes a monolingual English supervisor ineligible for a Spanish-speaking client. It also refuses to run on a non-ACTIVE assignment with a different id, so the two guards are separable."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Rosa Mena (es) has an accepted U_VISA matter. Ada Ortiz (en, es) and Cleo Park (en, es) each hold an ACTIVE SUPERVISOR assignment on it; Dov Adler (en only) holds a third ACTIVE SUPERVISOR assignment. Vic Lang is a PRO_BONO_VOLUNTEER LEAD, auto-linked at ACTIVATE time. A second volunteer Wes Duro is proposed but left PROPOSED."
            - "Ada's max_supervisees is 10 and Cleo's is 10, so headroom cannot decide the auto-selection; Ada wins on created_at ASC."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /representatives for Cleo Park (STAFF_ATTORNEY, ['en','es'], max_case_load 25, max_supervisees 10, 40 hrs, BAR-4004) and Dov Adler (STAFF_ATTORNEY, ['en'], max_case_load 25, max_supervisees 10, 40 hrs, BAR-5005) and Vic Lang and Wes Duro (both PRO_BONO_VOLUNTEER, ['en','es'], max_case_load 5, max_supervisees 0, 10 hrs)"
              payload: {}
              as: ProgramDirector
              captures: { cleo_id: "$.data.id", dov_id: "$.data.id", vic_id: "$.data.id", wes_id: "$.data.id" }
            - call: "three rounds of: GET /case-matters/${matter_id} for the fresh version, POST /case-assignments with role_on_case SUPERVISOR for Ada Ortiz then Cleo Park then Dov Adler, each followed by ACTIVATE"
              payload: {}
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { ada_sup_id: "$.data.id", cleo_sup_id: "$.data.id", dov_sup_id: "$.data.id" }
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { mv_a: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${vic_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${mv_a}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { vic_cc_id: "$.data.id" }
            - call: "POST /case-assignments/${vic_cc_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { mv_b: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${wes_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${mv_b}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { wes_cc_id: "$.data.id" }
          trigger:
            - call: "POST /case-assignments/${vic_cc_id}/relink-supervision"
              payload: { supervision_link_id: "${dov_sup_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${wes_cc_id}/relink-supervision"
              payload: { supervision_link_id: "${cleo_sup_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${vic_cc_id}/relink-supervision"
              payload: { supervision_link_id: "${cleo_sup_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${vic_cc_id}/relink-supervision"
              payload: { supervision_link_id: "00000000-0000-4000-8000-000000000111" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "setup: CaseAssignment.${vic_cc_id}.supervision_link_id == '${ada_sup_id}' and supervision_source == 'AUTO_SELECTED'; Representative.${atty_a_id}.supervisee_count == 1, Cleo 0, Dov 0"
            - "trigger 1: HTTP status == 422 and error_id == 'ERR_SUPERVISION_LINK_INELIGIBLE' — Dov Adler's languages ['en'] do not contain the client's 'es', and an explicitly named supervisor is held to the same client-language clause as an auto-selected one; every counter is unchanged"
            - "trigger 2: HTTP status == 409 and error_id == 'ERR_ASSIGNMENT_NOT_ACTIVE' — Wes's assignment is still PROPOSED, a different id from trigger 1, so the two guards are separable"
            - "trigger 3: HTTP status == 200, CaseAssignment.${vic_cc_id}.supervision_link_id == '${cleo_sup_id}' and supervision_source == 'EXPLICIT_LINK'"
            - "trigger 3: Representative.${atty_a_id}.supervisee_count == 0 and Representative.${cleo_id}.supervisee_count == 1 in the same write — the sum over all supervisors is conserved at 1"
            - "trigger 3: CaseAssignment.${vic_cc_id}.version incremented by 1 and both Ada's and Cleo's Representative.version incremented by 1"
            - "trigger 4: HTTP status == 404 and error_id == 'ERR_SUPERVISION_LINK_NOT_FOUND'; the link still points at ${cleo_sup_id}"

      - name: computed_read_case_matter_exposes_both_dimensions_readiness_money_and_the_occ_token
        claim_type: Computed read
        grounds:
          - endpoints[GET /case-matters/{matter_id}]
          - calculations.matter_readiness_index
          - calculations.interpretation_cost_rollup
          - calculations.case_hours_rollup
        distinguishing_aspect: "One read must expose everything derived about a matter and it must already be up to date: both parallel status dimensions, the four readiness figures, the rolled-up hours from two different assignments, the interpretation money, and the version that is the OCC token other endpoints demand. The corner is that the read performs no computation of its own — every figure was fixed by an earlier write — so a stale denormalisation shows up here as a mismatch against the same numbers recomputed from the child collections."
        test_recipe:
          setup:
            - "TEMPLATE B gives a STAFFED matter with Ada Ortiz as ACTIVE LEAD, Ben Cole as ACTIVE CO_COUNSEL, a CERTIFIED 'es' declaration and one COMPLETED 45-minute CONTRACT session worth 7125 cents."
            - "Evidence: one VERIFIED REQUIRED item of 20 points and one REJECTED SUPPORTING item of 5 points. Hours: 3.50 DIRECT on the lead and 1.25 DIRECT on the co-counsel."
          setup_api_calls:
            - call: "TEMPLATE B"
              payload: {}
              as: ProgramDirector
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 20, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { ev_ok_id: "$.data.id" }
            - call: "POST /evidence-items/${ev_ok_id}/transition"
              payload: { action: "RECEIVE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items/${ev_ok_id}/transition"
              payload: { action: "VERIFY" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "MEDICAL_RECORD", tier: "SUPPORTING", weight_points: 5, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { ev_bad_id: "$.data.id" }
            - call: "POST /evidence-items/${ev_bad_id}/transition"
              payload: { action: "RECEIVE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items/${ev_bad_id}/transition"
              payload: { action: "REJECT", disposition_reason_code: "ILLEGIBLE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 3.5, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${cocounsel_id}/log-hours"
              payload: { hours: 1.25, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          trigger:
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { occ_token: "$.data.version" }
            - call: "GET /evidence-items"
              payload: { matter_id: "${matter_id}" }
              as: ProgramDirector
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${lead_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: ["DENIAL_RISK"], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "es", expected_matter_version: "${occ_token}" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          assert:
            - "trigger 1: HTTP status == 200 with representation_status == 'STAFFED' and filing_status == 'PRE_FILING' — both parallel dimensions in one payload"
            - "trigger 1: readiness_index_weighted == 0.8000 (20 verified over 25 counted), readiness_ready_strict == true (required_total 1, required_open 0), evidence_blocking_count == 1 (the REJECTED row counts even though it is SUPPORTING), readiness_gate_applied reflects the last gate evaluation"
            - "trigger 1: direct_hours_logged == 4.75 — the sum of 3.50 on the LEAD and 1.25 on the CO_COUNSEL, rounded once at the matter level — and supervision_hours_logged == 0.00"
            - "trigger 1: interpretation_cost_cents == 7125, forum == 'USCIS', detained == false, facility_id == null"
            - "trigger 2: exactly 2 rows, whose weight_points and statuses reproduce the readiness figures of trigger 1 with no drift"
            - "trigger 3: HTTP status == 201 — the version returned by the computed read is accepted verbatim as expected_matter_version, so it really is the OCC token"
            - "trigger 3: InformedDecision.status == 'PENDING', language_match_verified == true (counseling 'es' equals the client's preferred language), superseded_by_decision_id == null, and CaseMatter.version is now occ_token + 1"

      - name: conditional_action_posture_override_only_downgrades_and_only_while_it_lasts
        claim_type: Conditional action
        grounds:
          - endpoints[POST /capacity-cycles/{cycle_id}/posture-override]
          - calculations.cycle_capacity_posture
        distinguishing_aspect: "The override is conditional in three independent ways and every one is observable on the same cycle: an instant at or before the clock leaves the posture untouched; an instant after the clock downgrades FROZEN to RESTRICTED but never RESTRICTED to OPEN; and the downgrade evaporates the moment the logical clock passes the stored instant, with no further call. The override always increments version even when it changes nothing."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Cycle FY26-H2 with total_case_slots 10 and reserved_detained_slots 0."
            - "Eight non-detained U_VISA matters are accepted, giving utilization_ratio 0.8000 and posture RESTRICTED; two more take it to 1.0000 and FROZEN."
          setup_api_calls:
            - call: "TEMPLATE A, with total_case_slots 10 and reserved_detained_slots 0"
              payload: {}
              as: ProgramDirector
            - call: "7 further repetitions of: POST /clients then ACCEPT_INTAKE(client=<new>, case_type=U_VISA, detained=false) — reaching 8 of 10 slots"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /capacity-cycles/${cycle_id}/posture-override"
              payload: { posture_override_until_utc: "2026-08-10T00:00:00.000Z", override_reason_code: "DIRECTOR_DISCRETION" }
              as: ProgramDirector
            - call: "2 further repetitions of: POST /clients then ACCEPT_INTAKE(client=<new>, case_type=U_VISA, detained=false) — reaching 10 of 10 slots"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /capacity-cycles/${cycle_id}/posture-override"
              payload: { posture_override_until_utc: "2026-08-03T09:00:00.000Z", override_reason_code: "DIRECTOR_DISCRETION" }
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.001Z" }
              as: ProgramDirector
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "setup: ProgramCapacityCycle.${cycle_id}.utilization_ratio == 0.8000 and capacity_posture == 'RESTRICTED' — 0.8000 is the inclusive RESTRICTED step"
            - "trigger 1: HTTP status == 200, capacity_posture is STILL 'RESTRICTED' — the override never downgrades RESTRICTED to OPEN — and version incremented by 1"
            - "trigger 3: utilization_ratio == 1.0000 and capacity_posture == 'RESTRICTED', not 'FROZEN' — the live override from trigger 1 downgrades the freeze by exactly one step"
            - "trigger 4: HTTP status == 200 and capacity_posture becomes 'FROZEN' — an override instant equal to the logical clock is NOT strictly after it, so it grants nothing; version still incremented by 1"
            - "trigger 6: capacity_posture == 'FROZEN' and posture_override_until_utc == '2026-08-03T09:00:00.000Z' — moving the clock past a stored instant expires the grant with no further call, so the posture is a function of the clock and not a latched flag"
            - "utilization_ratio stayed 1.0000 through triggers 4 to 6 — the override changes only the posture label, never the arithmetic"

      - name: no_bulk_endpoint_exists_so_multi_row_effects_arrive_only_through_cascades
        claim_type: Bulk action
        grounds:
          - endpoints[POST /organization-recognitions/{recognition_id}/transition]
          - endpoints[POST /capacity-cycles/{cycle_id}/checkpoint]
          - state_machines.OrganizationRecognition
        distinguishing_aspect: "§1.5 declares no bulk-write endpoint and no request body anywhere accepts an array of ids, so the guide's Bulk action row is satisfied only by the two endpoints that mutate many rows from a single-row request: a recognition LAPSE and a cycle checkpoint. Both are all-or-nothing rather than partial-success — there is no per-item status array in either response, and a post-write invariant failure rolls the whole sweep back — which is the opposite of the partial-success semantics a real bulk endpoint would need."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Recognition REC-2026-001 (all four forums). Two ACCREDITED_REPs, Nadia Rey and Omar Vale, each with an APPROVED FULL accreditation, each holding an ACTIVE LEAD assignment on a different accepted matter under Ada Ortiz's ACTIVE SUPERVISOR assignment on each matter."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "REC-2026-001", effective_date: "2026-01-01", expiry_date: "2030-01-01", authorized_forums: ["USCIS", "ASYLUM_OFFICE", "EOIR_IMMIGRATION_COURT", "BIA"] }
              as: ProgramDirector
              captures: { rec_id: "$.data.id" }
            - call: "POST /representatives for Nadia Rey and Omar Vale (both ACCREDITED_REP, ['en','es'], max_case_load 15, max_supervisees 0, 40 hrs), then POST /accreditations FULL over ['USCIS'] for each, then APPROVE each as SupervisingAttorney ${atty_b_id}"
              payload: {}
              as: ProgramDirector
              captures: { nadia_id: "$.data.id", omar_id: "$.data.id", nadia_acc_id: "$.data.id", omar_acc_id: "$.data.id" }
            - call: "POST /clients then ACCEPT_INTAKE(client=<new Bea Rios>, case_type=U_VISA, detained=false) giving matter M2"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { m2_id: "$.data[0].id" }
            - call: "on ${matter_id} and ${m2_id}: create and ACTIVATE a SUPERVISOR assignment for Ada Ortiz, then create and ACTIVATE a LEAD assignment for Nadia Rey on ${matter_id} and for Omar Vale on ${m2_id}, refreshing expected_matter_version before each create"
              payload: {}
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { nadia_lead_id: "$.data.id", omar_lead_id: "$.data.id" }
          trigger:
            - call: "POST /organization-recognitions/${rec_id}/transition"
              payload: { action: "LAPSE" }
              as: ProgramDirector
          assert:
            - "HTTP status == 200 with a SINGLE OrganizationRecognition object in data — no per-item status array, no partial-success envelope, even though the write touched two accreditations, two representatives, two assignments and two matters"
            - "OrganizationRecognition.${rec_id}.status == 'LAPSED', lapsed_at_utc == '2026-08-03T09:00:00.000Z', suspended_accreditation_count == 2"
            - "both Accreditation.${nadia_acc_id} and Accreditation.${omar_acc_id}.status == 'SUSPENDED_BY_RECOGNITION' with suspension_reason_code == 'RECOGNITION_LAPSE'"
            - "both Representative.${nadia_id} and Representative.${omar_id}.authorization_status == 'AUTHORIZATION_SUSPENDED'"
            - "both CaseAssignment.${nadia_lead_id} and CaseAssignment.${omar_lead_id}.status == 'SUSPENDED' with suspension_reason_code == 'RECOGNITION_LAPSE'"
            - "both CaseMatter.${matter_id} and CaseMatter.${m2_id}.representation_status == 'COVERAGE_GAP'"
            - "no §1.5 endpoint accepts an array of entity ids in its input, so this cascade is the only multi-row write shape available"

      - name: clock_startup_default_is_2026_08_01t00_00_00z_and_a_clock_write_fires_no_cascade
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[POST /capacity-cycles/{cycle_id}/checkpoint]
          - state_machines.Accreditation
        distinguishing_aspect: "Two claims that are easy to get wrong together. First, before any call to the clock endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and must not fall back to host wall-clock time — observable as the created_at of the very first entity written to an empty database. Second, setting the clock mutates no entity and fires no cascade: jumping years past an accreditation's expiry leaves it APPROVED until a checkpoint or a transition actually runs, so time-driven state is pulled by writes and never pushed by the clock."
        test_recipe:
          setup:
            - "Empty database. NOTHING is sent to POST /_clock/set_current_utc before the first assertion."
          setup_api_calls:
            - call: "POST /representatives"
              payload: { full_name: "Ada Ortiz", rep_type: "STAFF_ATTORNEY", languages: ["en", "es"], max_case_load: 25, max_supervisees: 10, weekly_capacity_hours: 40, bar_number: "BAR-1001" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "REC-2026-001", effective_date: "2026-01-01", expiry_date: "2030-01-01", authorized_forums: ["USCIS", "ASYLUM_OFFICE", "EOIR_IMMIGRATION_COURT", "BIA"] }
              as: ProgramDirector
              captures: { rec_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Rey", rep_type: "ACCREDITED_REP", languages: ["en", "es"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 40 }
              as: ProgramDirector
              captures: { nadia_id: "$.data.id" }
            - call: "POST /accreditations"
              payload: { representative_id: "${nadia_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["USCIS"] }
              as: ProgramDirector
              captures: { acc_id: "$.data.id" }
            - call: "POST /accreditations/${acc_id}/transition"
              payload: { action: "APPROVE" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "POST /capacity-cycles"
              payload: { cycle_code: "FY26-H2", period_start_date: "2026-07-01", period_end_date: "2026-12-31", total_case_slots: 10, reserved_detained_slots: 0 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
          trigger:
            - call: "GET /representatives/${atty_a_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2032-01-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "GET /accreditations/${acc_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /representatives/${nadia_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /capacity-cycles/${cycle_id}/checkpoint"
              payload: {}
              as: ProgramDirector
            - call: "GET /accreditations/${acc_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "trigger 1: created_at == '2026-08-01T00:00:00.000Z' — the startup default, reached without ever calling the clock endpoint, and independent of the machine's real date"
            - "setup call 5: Accreditation.${acc_id}.status == 'APPROVED' with approved_by_representative_id == '${atty_a_id}', granted_forums == ['USCIS'], and an expiry_date derived from ACCREDITATION_TERM_DAYS 1095 measured from the 2026-08-01 logical clock, NOT from the host date"
            - "trigger 2: HTTP status == 200 and the response body carries no entity — the endpoint's output is null"
            - "trigger 3: Accreditation.${acc_id}.status is STILL 'APPROVED' and version is unchanged from setup call 5, even though the clock is now years past its expiry_date — the clock write fired no cascade"
            - "trigger 4: Representative.${nadia_id}.authorization_status is still 'AUTHORIZED_ACCREDITED' as stored, because no write has re-derived it"
            - "trigger 5: HTTP status == 200 and checkpoint_epoch == 1"
            - "trigger 6: Accreditation.${acc_id}.status == 'EXPIRED' — PHASE 3 credential aging is what moves it, so time-driven state is pulled by an explicit write and never pushed by the clock"

      - name: set_facility_recompute_flips_both_the_deadline_and_the_readiness_gate_error_id
        claim_type: Conditional action
        grounds:
          - endpoints[POST /case-matters/{matter_id}/set-facility]
          - calculations.matter_forum_and_deadlines
          - calculations.matter_readiness_index
          - errors[ERR_FACILITY_CHANGE_AFTER_FILING]
          - errors[ERR_FACILITY_REQUIRED_FOR_DETAINED]
        distinguishing_aspect: "One endpoint with three conditional behaviours on one matter. Releasing a client from detention must recompute expedited_deadline_date to null and re-derive effective_filing_deadline_date from the remaining statutory candidate, and must ALSO swap which readiness gate applies — so identical evidence that failed with ERR_MATTER_NOT_READY while detained now fails with ERR_BLOCKING_EVIDENCE_OUTSTANDING. Setting detained true with a null facility_id is rejected outright, and any change at all is refused once filing_status is FILED. The endpoint takes no expected_matter_version, so it is not an OCC write even though it bumps version."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Facility EL-PASO-SPC in jurisdiction 'TX-ELP' with expedited_filing_days 21, max_daily_visit_slots 4."
            - "A DETAINED ASYLUM_DEFENSIVE matter for Rosa Mena (es) is accepted with facility_id EL-PASO-SPC and statutory_deadline_date 2026-09-30. It has Ada Ortiz as ACTIVE LEAD, a CERTIFIED declaration, and is at filing_status EVIDENCE_GATHERING."
            - "Evidence on the matter: two VERIFIED REQUIRED items of 20 points each and one RECEIVED REQUIRED item of 15 points. Weighted index = 40/55 = 0.7273, below READY_TO_FILE_WEIGHTED_MIN 0.7500; required_open == 1 so readiness_ready_strict == false."
          setup_api_calls:
            - call: "TEMPLATE B, but with ACCEPT_INTAKE(client=Rosa Mena, case_type=ASYLUM_DEFENSIVE, detained=true) against facility EL-PASO-SPC and statutory_deadline_date 2026-09-30"
              payload: {}
              as: ProgramDirector
            - call: "POST /evidence-items x3 (REQUIRED 20, REQUIRED 20, REQUIRED 15) then RECEIVE all three then VERIFY only the first two"
              payload: {}
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "EVIDENCE_GATHERING" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "READY_TO_FILE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-matters/${matter_id}/set-facility"
              payload: { detained: true }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-matters/${matter_id}/set-facility"
              payload: { detained: false }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "READY_TO_FILE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          assert:
            - "setup call 4: detained == true, facility_id == the EL-PASO-SPC id, forum == 'EOIR_IMMIGRATION_COURT', expedited_deadline_date == '2026-08-24' (the accepted intake's decided date 2026-08-03 plus 21 days) and effective_filing_deadline_date == '2026-08-24' (the min of 2026-09-30 and 2026-08-24)"
            - "setup call 4: readiness_index_weighted == 0.7273, readiness_ready_strict == false, evidence_blocking_count == 1"
            - "trigger 1: HTTP status == 422 and error_id == 'ERR_MATTER_NOT_READY' — the detained EVIDENCE_WEIGHTED_GATE ran and 0.7273 is short of 0.7500; readiness_gate_applied == 'EVIDENCE_WEIGHTED_GATE'"
            - "trigger 2: HTTP status == 422 and error_id == 'ERR_FACILITY_REQUIRED_FOR_DETAINED' — detained true with facility_id omitted is rejected, and the matter's existing facility is NOT reused to satisfy the requirement; version unchanged"
            - "trigger 3: HTTP status == 200, detained == false, facility_id == null, expedited_deadline_date == null and effective_filing_deadline_date == '2026-09-30' — the min collapses onto the one remaining non-null candidate; forum stays 'EOIR_IMMIGRATION_COURT' because it keys on case_type only"
            - "trigger 3: readiness_index_weighted is still 0.7273 and evidence_blocking_count still 1 — releasing detention changes which gate runs, not the arithmetic — and readiness_gate_applied is now 'CHECKLIST_STRICT_GATE'; CaseMatter.version incremented by 1 with no expected_matter_version supplied anywhere in the request"
            - "trigger 4: HTTP status == 422 and error_id == 'ERR_BLOCKING_EVIDENCE_OUTSTANDING' — a DIFFERENT error id for byte-identical evidence, purely because detained flipped"

      - name: advance_filing_mints_a_filing_deadline_event_discoverable_only_through_the_list_endpoint
        claim_type: Conditional action
        grounds:
          - endpoints[POST /case-matters/{matter_id}/advance-filing]
          - endpoints[GET /calendar-events]
          - state_machines.CalendarEvent
        distinguishing_aspect: "The same target_filing_status value means different things from different origins, and one of those edges is the only way a FILING_DEADLINE CalendarEvent ever comes into existence — POST /calendar-events is not used. Because §1.5 declares no singular GET for calendar events, the minted row is reachable only by listing with matter_id, and the transition response returns the matter, not the event. The subsequent RFE_PENDING to FILED edge then re-reads evidence_blocking_count, and the FILED/RFE_PENDING cycle may repeat without bound."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. A non-detained U_VISA matter for Rosa Mena at filing_status READY_TO_FILE with a DOCUMENTED FILE_AFFIRMATIVE InformedDecision, one VERIFIED REQUIRED evidence item of 20 points, statutory_deadline_date 2026-12-01, and Ada Ortiz as ACTIVE LEAD."
          setup_api_calls:
            - call: "TEMPLATE B, then evidence (one REQUIRED 20 RECEIVE + VERIFY), then POST /informed-decisions FILE_AFFIRMATIVE and ACKNOWLEDGE it as the ClientPortalUser ${client_id} so it is DOCUMENTED, then advance-filing to EVIDENCE_GATHERING then READY_TO_FILE"
              payload: {}
              as: ProgramDirector
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "FILED" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          trigger:
            - call: "GET /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "FILING_DEADLINE" }
              as: ProgramDirector
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "RFE_PENDING", rfe_response_due_date: "2026-10-15" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "GET /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "FILING_DEADLINE" }
              as: ProgramDirector
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "COUNTRY_CONDITIONS_REPORT", tier: "REQUIRED", weight_points: 10, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { ev_new_id: "$.data.id" }
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "FILED" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items/${ev_new_id}/transition"
              payload: { action: "WAIVE", disposition_reason_code: "NOT_APPLICABLE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "FILED" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-matters/${matter_id}/set-facility"
              payload: { detained: false }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "setup call 2: HTTP status == 200 and filing_status == 'FILED'; the response body is a CaseMatter"
            - "trigger 1: exactly 0 rows — the initial filing minted no deadline event"
            - "trigger 2: HTTP status == 200, filing_status == 'RFE_PENDING', statutory_deadline_date == '2026-10-15' and effective_filing_deadline_date == '2026-10-15'; the response body is again a CaseMatter and contains no event object"
            - "trigger 3: exactly 1 row, with event_type 'FILING_DEADLINE', starts_at_utc == '2026-10-15T00:00:00.000Z', location_code == 'MAIL', status 'SCHEDULED', travel_buffer_minutes == 0 (BUFFER_BY_EVENT_TYPE FILING_DEADLINE) and version == 1 — the only channel through which this row is observable, since no GET /calendar-events/{id} exists"
            - "trigger 5: HTTP status == 422 and error_id == 'ERR_BLOCKING_EVIDENCE_OUTSTANDING' — RFE_PENDING to FILED re-reads evidence_blocking_count, which the fresh PENDING REQUIRED item pushed to 1"
            - "trigger 7: HTTP status == 200 and filing_status == 'FILED' — WAIVE removes the row from required_open, so the same request now succeeds; the FILED to RFE_PENDING to FILED cycle is unbounded"
            - "trigger 7: the FILING_DEADLINE event minted at trigger 2 now has status 'COMPLETED' — the FILED edge completes every SCHEDULED or CONFIRMED FILING_DEADLINE event of the matter"
            - "trigger 8: HTTP status == 422 and error_id == 'ERR_FACILITY_CHANGE_AFTER_FILING' — the guard keys on filing_status IN {FILED, RFE_PENDING}, so it fires even for a no-op detained false on an already non-detained matter"

  # ===========================================================================
  # §1.6 breadth. Every catalog id not already asserted by an earlier section of
  # this file gets a trigger here. Earlier sections already fire: the four auth
  # ids, ERR_NOT_FOUND, ERR_CLIENT_NOT_FOUND, ERR_MATTER_NOT_FOUND,
  # ERR_CYCLE_NOT_FOUND, ERR_FACILITY_NOT_FOUND, ERR_SUPERVISION_LINK_NOT_FOUND,
  # ERR_VALIDATION, ERR_INVALID_STATE_TRANSITION, ERR_MATTER_CLOSED,
  # ERR_ASSIGNMENT_NOT_ACTIVE, ERR_MATTER_NOT_READY,
  # ERR_BLOCKING_EVIDENCE_OUTSTANDING, ERR_RECOGNITION_NOT_ACTIVE,
  # ERR_SUPERVISION_LINK_INELIGIBLE, ERR_FORUM_NOT_AUTHORIZED,
  # ERR_SUPERVISEE_CAP_EXCEEDED, ERR_CASELOAD_CAP_EXCEEDED,
  # ERR_SEGREGATION_OF_DUTIES, ERR_READBACK_NOT_COMPLETED,
  # ERR_REPRESENTATIVE_CALENDAR_CONFLICT, ERR_CLIENT_CALENDAR_CONFLICT,
  # ERR_FACILITY_VISIT_SLOTS_EXHAUSTED, ERR_FACILITY_LEAD_TIME_NOT_MET,
  # ERR_CONSENT_SCOPE_INSUFFICIENT, ERR_NO_SLOT_AVAILABLE,
  # ERR_CYCLE_CAPACITY_FROZEN, ERR_INDIGENCY_CEILING_EXCEEDED,
  # ERR_HOURS_OUT_OF_RANGE, ERR_STALE_MATTER_VERSION, ERR_LEAD_NOT_ASSIGNED,
  # ERR_RESCHEDULE_LIMIT_REACHED, ERR_FORUM_GRANT_EMPTY,
  # ERR_ACCREDITATION_NOT_APPLICABLE, ERR_RECOGNITION_ALREADY_EXISTS,
  # ERR_FACILITY_REQUIRED_FOR_DETAINED and ERR_FACILITY_CHANGE_AFTER_FILING.
  - section: errors
    instances:

      - name: err_recognition_not_found_and_err_representative_not_found_from_path_and_body_ids
        claim_type: Error triggerable
        grounds:
          - errors[ERR_RECOGNITION_NOT_FOUND]
          - errors[ERR_REPRESENTATIVE_NOT_FOUND]
          - validations[priority 8]
          - validations[priority 12]
        distinguishing_aspect: "Both ids are reachable from a path segment AND from three different body fields, and the body-field route is the one an implementation typically forgets: representative_id on POST /accreditations, interpreter_representative_id on POST /interpretation-sessions, and assigned_representative_id on POST /calendar-events must each resolve to ERR_REPRESENTATIVE_NOT_FOUND rather than the generic 404 or a validation error, while a bogus recognition_id in an accreditation body resolves to ERR_RECOGNITION_NOT_FOUND. Priority 8 outranks priority 12, so a request carrying BOTH bogus ids reports the representative id."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives a STAFFED U_VISA matter for Rosa Mena (es) with Ada Ortiz as ACTIVE LEAD, plus a real recognition REC-2026-001 and a real ACCREDITED_REP Nadia Rey."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "REC-2026-001", effective_date: "2026-01-01", expiry_date: "2030-01-01", authorized_forums: ["USCIS", "ASYLUM_OFFICE", "EOIR_IMMIGRATION_COURT", "BIA"] }
              as: ProgramDirector
              captures: { rec_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Rey", rep_type: "ACCREDITED_REP", languages: ["en", "es"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 40 }
              as: ProgramDirector
              captures: { nadia_id: "$.data.id" }
          trigger:
            - call: "GET /organization-recognitions/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ProgramDirector
            - call: "GET /representatives/00000000-0000-4000-8000-0000000000bb"
              payload: {}
              as: ProgramDirector
            - call: "POST /accreditations"
              payload: { representative_id: "${nadia_id}", recognition_id: "00000000-0000-4000-8000-0000000000aa", accreditation_type: "PARTIAL", requested_forums: ["USCIS"] }
              as: ProgramDirector
            - call: "POST /accreditations"
              payload: { representative_id: "00000000-0000-4000-8000-0000000000bb", recognition_id: "00000000-0000-4000-8000-0000000000aa", accreditation_type: "PARTIAL", requested_forums: ["USCIS"] }
              as: ProgramDirector
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", purpose: "INTAKE", interpreter_source: "STAFF", interpreter_representative_id: "00000000-0000-4000-8000-0000000000bb", language_code: "es", scheduled_start_utc: "2026-08-05T14:00:00.000Z", scheduled_end_utc: "2026-08-05T15:00:00.000Z" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-08-20T14:00:00.000Z", ends_at_utc: "2026-08-20T15:00:00.000Z", location_code: "ELP-ASC", assigned_representative_id: "00000000-0000-4000-8000-0000000000bb" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          assert:
            - "trigger 1: HTTP status == 404 and error_id == 'ERR_RECOGNITION_NOT_FOUND', not 'ERR_NOT_FOUND'"
            - "trigger 2: HTTP status == 404 and error_id == 'ERR_REPRESENTATIVE_NOT_FOUND'"
            - "trigger 3: HTTP status == 404 and error_id == 'ERR_RECOGNITION_NOT_FOUND' — a bogus FK in the BODY produces the same specific id as a bogus path segment"
            - "trigger 4: HTTP status == 404 and error_id == 'ERR_REPRESENTATIVE_NOT_FOUND' — with both FKs bogus, priority 8 beats priority 12"
            - "trigger 5: HTTP status == 404 and error_id == 'ERR_REPRESENTATIVE_NOT_FOUND' — existence of the interpreter is checked before ERR_INTERPRETER_SOURCE_MISMATCH or ERR_INTERPRETER_LANGUAGE_MISMATCH, both of which need a resolved row to evaluate"
            - "trigger 6: HTTP status == 404 and error_id == 'ERR_REPRESENTATIVE_NOT_FOUND' — assigned_representative_id is the third body route to the same id"
            - "no Accreditation, InterpretationSession or CalendarEvent row was created by any trigger"

      - name: err_intake_not_accepted_outranks_err_derivative_client_mismatch_on_the_accept_branch
        claim_type: Error triggerable
        grounds:
          - errors[ERR_INTAKE_NOT_ACCEPTED]
          - errors[ERR_DERIVATIVE_CLIENT_MISMATCH]
          - validations[priority 16]
          - endpoints[POST /intake-screenings/{intake_id}/decide]
        distinguishing_aspect: "The ACCEPT branch runs its state gate before its derivative-link gate, so a DECLINED intake carrying a cross-client principal_matter_id reports ERR_INTAKE_NOT_ACCEPTED (409) and NOT ERR_DERIVATIVE_CLIENT_MISMATCH (422) — the same payload against a properly SCREENED intake then reveals the second error. A same-client principal link on the same payload succeeds and stores principal_matter_id, which is only discoverable through GET /case-matters filtered by principal_matter_id."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives Rosa Mena with an ACCEPTED U_VISA intake and matter ${matter_id}."
            - "A second client Bea Rios (unrelated household) is registered, and a third intake for Rosa Mena herself is created and SCREENED."
            - "A fourth intake for Bea Rios is created, SCREENED and then DECLINED so it is in a non-ACCEPTED state."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Bea Rios", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1988-02-19", household_size: 1, annual_household_income_cents: 1000000, confidentiality_consent_scope: "PROGRAM_ONLY" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { bea_id: "$.data.id" }
            - call: "POST /intake-screenings"
              payload: { client_id: "${bea_id}", cycle_id: "${cycle_id}", case_type: "U_VISA", detained: false, prior_removal_order: false, one_year_bar_applies: false, statutory_deadline_date: "2026-12-01" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { bea_intake_id: "$.data.id" }
            - call: "POST /intake-screenings/${bea_intake_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${bea_intake_id}/decide"
              payload: { decision: "DECLINE", decision_reason_code: "OUT_OF_SCOPE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ASYLUM_AFFIRMATIVE", detained: false, prior_removal_order: false, one_year_bar_applies: false, statutory_deadline_date: "2026-12-01" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { rosa_intake2_id: "$.data.id" }
            - call: "POST /intake-screenings/${rosa_intake2_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings"
              payload: { client_id: "${bea_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false, prior_removal_order: false, one_year_bar_applies: false, statutory_deadline_date: "2026-12-01" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { bea_intake2_id: "$.data.id" }
            - call: "POST /intake-screenings/${bea_intake2_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
          trigger:
            - call: "POST /intake-screenings/${bea_intake_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ELIGIBLE_IN_SCOPE", principal_matter_id: "${matter_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /intake-screenings/${bea_intake2_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ELIGIBLE_IN_SCOPE", principal_matter_id: "${matter_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /intake-screenings/${rosa_intake2_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ELIGIBLE_IN_SCOPE", principal_matter_id: "${matter_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters"
              payload: { principal_matter_id: "${matter_id}" }
              as: ProgramDirector
          assert:
            - "trigger 1: HTTP status == 409 and error_id == 'ERR_INTAKE_NOT_ACCEPTED' — the DECLINED state gate at priority 16 pre-empts the cross-client link check, so the 422 is NOT what surfaces"
            - "trigger 1: IntakeScreening.${bea_intake_id}.status is still 'DECLINED' and no CaseMatter exists with intake_id == ${bea_intake_id}"
            - "trigger 2: HTTP status == 422 and error_id == 'ERR_DERIVATIVE_CLIENT_MISMATCH' — the identical principal_matter_id now reaches the second gate because the intake is SCREENED; ${matter_id} belongs to Rosa Mena, not Bea Rios"
            - "trigger 2: IntakeScreening.${bea_intake2_id}.status is still 'SCREENED' and ProgramCapacityCycle.${cycle_id}.general_slots_consumed is unchanged — a rejected ACCEPT consumes no slot"
            - "trigger 3: HTTP status == 200, status == 'ACCEPTED', and a CaseMatter now exists whose principal_matter_id == '${matter_id}' — a same-client derivative link is accepted"
            - "trigger 4: exactly 1 row, the matter minted by trigger 3 — the self-referential filter is the only channel for reading the derivative link"

      - name: err_lead_already_assigned_counts_suspended_leads_and_err_assignment_matter_mismatch
        claim_type: Error triggerable
        grounds:
          - errors[ERR_LEAD_ALREADY_ASSIGNED]
          - errors[ERR_ASSIGNMENT_MATTER_MISMATCH]
          - validations[priority 27]
          - endpoints[POST /declarations]
        distinguishing_aspect: "The LEAD uniqueness set is {PROPOSED, ACTIVE, SUSPENDED} — so a SUSPENDED lead still blocks a replacement, which is exactly the trap a coverage-gap matter creates, while a RELEASED lead does not block. Separately, a preparer_assignment_id belonging to a different matter must produce ERR_ASSIGNMENT_MATTER_MISMATCH (409) and not the assignment-not-found or not-active ids, because the row exists and is ACTIVE — it simply belongs elsewhere."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives matter M1 for Rosa Mena (es) with Ada Ortiz as ACTIVE LEAD."
            - "A second matter M2 is accepted for Bea Rios (es) with Ben Cole as its own ACTIVE LEAD."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /clients then ACCEPT_INTAKE(client=Bea Rios, case_type=U_VISA, detained=false) giving matter M2"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { m2_id: "$.data[0].id" }
            - call: "GET /case-matters/${m2_id}"
              payload: {}
              as: ProgramDirector
              captures: { m2v: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${m2_id}", representative_id: "${atty_b_id}", role_on_case: "LEAD", expected_matter_version: "${m2v}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { m2_lead_id: "$.data.id" }
            - call: "POST /case-assignments/${m2_lead_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { m1v: "$.data.version" }
          trigger:
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${atty_b_id}", role_on_case: "LEAD", expected_matter_version: "${m1v}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${lead_id}/transition"
              payload: { action: "SUSPEND", suspension_reason_code: "REPRESENTATIVE_LEAVE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${atty_b_id}", role_on_case: "LEAD", expected_matter_version: "${m1v}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /declarations"
              payload: { matter_id: "${matter_id}", preparer_assignment_id: "${m2_lead_id}", language_code: "es", word_count: 1200 }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "trigger 1: HTTP status == 409 and error_id == 'ERR_LEAD_ALREADY_ASSIGNED' — Ada Ortiz's ACTIVE lead blocks the second; CaseMatter.${matter_id}.version is unchanged, so a rejected create does not consume the OCC token"
            - "trigger 2: HTTP status == 200 and CaseAssignment.${lead_id}.status == 'SUSPENDED'"
            - "trigger 3: HTTP status == 409 and error_id == 'ERR_LEAD_ALREADY_ASSIGNED' — SUSPENDED is inside the uniqueness set, so suspending the incumbent does NOT open the slot; the matter is now leadless for transition purposes yet still refuses a new lead"
            - "trigger 3: the error is ERR_LEAD_ALREADY_ASSIGNED and not ERR_STALE_MATTER_VERSION, confirming ${m1v} is still current and priority 27 is reached"
            - "trigger 4: HTTP status == 409 and error_id == 'ERR_ASSIGNMENT_MATTER_MISMATCH' — ${m2_lead_id} exists and is ACTIVE, so neither a 404 nor ERR_ASSIGNMENT_NOT_ACTIVE is correct; only its matter_id is wrong"
            - "trigger 4: no Declaration row exists on either matter"

      - name: err_interpreter_source_mismatch_and_language_mismatch_are_two_distinct_rejections
        claim_type: Error triggerable
        grounds:
          - errors[ERR_INTERPRETER_SOURCE_MISMATCH]
          - errors[ERR_INTERPRETER_LANGUAGE_MISMATCH]
          - endpoints[POST /interpretation-sessions]
          - calculations.interpretation_cost_rollup
        distinguishing_aspect: "interpreter_representative_id is required for STAFF and VOLUNTEER and forbidden for CONTRACT and TELEPHONIC, so the SAME field triggers the same error id from two opposite directions — supplied when it must be null, and omitted when it must be present. The language check is separate and only reachable once the source check passes, so a STAFF session naming a monolingual English interpreter for an 'es' session reports ERR_INTERPRETER_LANGUAGE_MISMATCH while a CONTRACT session naming the very same interpreter reports ERR_INTERPRETER_SOURCE_MISMATCH."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives a STAFFED U_VISA matter for Rosa Mena (preferred_language_code 'es') with Ada Ortiz (['en','es']) as ACTIVE LEAD."
            - "Dov Adler is created as a STAFF_ATTORNEY whose languages are ['en'] only."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /representatives"
              payload: { full_name: "Dov Adler", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 10, weekly_capacity_hours: 40, bar_number: "BAR-5005" }
              as: ProgramDirector
              captures: { dov_id: "$.data.id" }
          trigger:
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "es", interpreter_source: "STAFF", purpose: "INTAKE", scheduled_start_utc: "2026-08-05T14:00:00.000Z", scheduled_end_utc: "2026-08-05T15:00:00.000Z" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "es", interpreter_source: "CONTRACT", purpose: "INTAKE", interpreter_representative_id: "${dov_id}", scheduled_start_utc: "2026-08-05T14:00:00.000Z", scheduled_end_utc: "2026-08-05T15:00:00.000Z" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "es", interpreter_source: "STAFF", purpose: "INTAKE", interpreter_representative_id: "${dov_id}", scheduled_start_utc: "2026-08-05T14:00:00.000Z", scheduled_end_utc: "2026-08-05T15:00:00.000Z" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "es", interpreter_source: "STAFF", purpose: "INTAKE", interpreter_representative_id: "${atty_a_id}", scheduled_start_utc: "2026-08-05T15:00:00.000Z", scheduled_end_utc: "2026-08-05T15:00:00.000Z" }
              as: CaseRepresentative
