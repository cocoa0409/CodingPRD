              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { first_dem_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Rosa Idowu", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { second_dem_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
