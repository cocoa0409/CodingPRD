# =============================================================================
# SCAFFOLD.yaml — task_3299_mobile_wallet_card_provisioning_token_lifecycle_device
# §1.0–§1.7 (difficulty & corner designs live in sibling files)
# =============================================================================

scenario: |
  Mobile Wallet Card Provisioning, Token Lifecycle & Device Binding (Apple Pay):
  card addition with issuer verification through a provisioning request and
  identity checks including one-time codes or issuer application confirmation,
  token issuance bound to a specific device and account with a device account
  number distinct from the card number, transaction authorization carrying
  cryptograms with issuer validation and decline reason handling, card
  suspension, deletion and reprovisioning when a device is lost or a card is
  reissued, default card selection, express transit and merchant-specific
  behaviors, issuer participation agreements with fee arrangements and branding
  requirements, dispute handling where a wallet transaction must be traced back
  to the underlying card account, device passcode and biometric requirements
  gating payment authorization.

domain_name: mobile-wallet-provisioning
api_prefix: ""

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: compliance / audit
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - conditional_feature_flags
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Cardholder
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Cardholder legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across cardholders" }
      - { name: phone, type: string, source: input, description: "Contact phone in E.164" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | BLOCKED" }

  - name: Device
    parent: Cardholder
    common_fields: true
    fields:
      - { name: cardholder_id, type: string, source: input, description: "FK -> Cardholder.id; owning cardholder" }
      - { name: device_serial, type: string, source: input, description: "Hardware serial; unique across devices" }
      - { name: device_model, type: string, source: input, description: "Device model string" }
      - { name: os_version, type: string, source: input, description: "Operating system version" }
      - { name: passcode_enabled, type: boolean, source: system, default: false, description: "Whether a device passcode is configured" }
      - { name: biometric_enabled, type: boolean, source: system, default: false, description: "Whether biometric unlock is configured" }
      - { name: is_lost, type: boolean, source: system, default: false, description: "Device currently reported lost; cleared by report_found" }
      - { name: reported_lost_at, type: datetime, source: system, default: null, description: "When the device was last reported lost" }
      - { name: found_at, type: datetime, source: system, default: null, description: "When the device was reported found again" }
      - { name: security_posture, type: enum, source: computed, description: "LOST | DEGRADED | HEALTHY — computed from is_lost / passcode_enabled" }
      - { name: active_token_count, type: integer, source: computed, default: 0, description: "Count of PaymentTokens in ACTIVE state on this device" }
      - { name: default_card_id, type: string, source: system, default: null, description: "id of the PaymentToken currently set as the device default card (nullable); cleared when that token leaves ACTIVE" }

  - name: Issuer
    parent: null
    common_fields: true
    fields:
      - { name: issuer_name, type: string, source: input, description: "Issuer legal name" }
      - { name: country_code, type: string, source: input, description: "Two-letter ISO country" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | OFFBOARDED" }

  - name: IssuerAgreement
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; governing issuer" }
      - { name: branding_color, type: string, source: input, description: "Hex color required by branding rules" }
      - { name: branding_logo_ref, type: string, source: input, description: "Logo asset reference" }
      - { name: terms_version, type: string, source: input, description: "Agreement terms version label" }
      - { name: fee_bps, type: integer, source: input, description: "Participation fee in basis points of settled amount" }
      - { name: fee_cap_cents, type: integer, source: input, description: "Per-transaction fee cap in cents (nullable semantics: must be positive integer)" }
      - { name: fee_floor_cents, type: integer, source: input, default: 0, description: "Per-transaction fee floor in cents" }
      - { name: express_transit_supported, type: boolean, source: input, description: "Whether tokens under this agreement may be express-enabled" }
      - { name: effective_at, type: datetime, source: input, description: "When the agreement becomes usable" }
      - { name: expires_at, type: datetime, source: input, description: "When the agreement expires" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACTIVE | SUPERSEDED | TERMINATED" }

  - name: MerchantProgram
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; sponsoring issuer" }
      - { name: program_code, type: string, source: input, description: "Program code; unique per issuer among non-retired programs" }
      - { name: merchant_name, type: string, source: input, description: "Merchant display name" }
      - { name: required_pan_last4, type: string, source: input, description: "Card artifact pan_last4 required for enrollment (empty string means no constraint)" }
      - { name: max_auth_amount_cents, type: integer, source: input, description: "Maximum authorization amount under this program" }
      - { name: active_sessions_required, type: boolean, source: input, default: true, description: "If true, enrollment requires card ACTIVE; if false, SUSPENDED is also eligible" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: CardAccount
    parent: Cardholder
    common_fields: true
    fields:
      - { name: cardholder_id, type: string, source: input, description: "FK -> Cardholder.id; owning cardholder" }
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; issuing bank" }
      - { name: fpan_last4, type: string, source: input, description: "Last 4 digits of the funding primary account number" }
      - { name: card_product, type: enum, source: input, description: "CREDIT | DEBIT | PREPAID | TRANSIT" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RESTRICTED | REISSUED | CLOSED" }
      - { name: reissue_of_account_id, type: string, source: system, default: null, description: "Self-reference: id of the predecessor CardAccount when created by reissue" }

  - name: CardArtifact
    parent: CardAccount
    common_fields: true
    fields:
      - { name: card_account_id, type: string, source: input, description: "FK -> CardAccount.id; owning account" }
      - { name: pan_last4, type: string, source: input, description: "Last 4 of the artifact PAN" }
      - { name: expiry, type: string, source: input, description: "Expiry in MMYY" }
      - { name: embossing_name, type: string, source: input, description: "Name as embossed" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | DEACTIVATED" }

  - name: ProvisioningSession
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; path parent device" }
      - { name: card_artifact_id, type: string, source: input, description: "FK -> CardArtifact.id; artifact being provisioned" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied dedup key; unique per device" }
      - { name: verification_method, type: enum, source: system, default: null, description: "OTP_TEXT | OTP_EMAIL | ISSUER_APP" }
      - { name: verification_attempt_count, type: integer, source: system, default: 0, description: "Successful challenge completions; gates tokenization (required >= 2)" }
      - { name: expires_at, type: datetime, source: computed, description: "session_ttl_hours after created_at" }
      - { name: device_account_number, type: string, source: system, default: null, description: "DPAN assigned at tokenization; distinct from card PAN" }
      - { name: status, type: enum, source: system, default: INITIATED, description: "INITIATED | VERIFICATION_REQUIRED | VERIFIED | TOKENIZED | EXPIRED | FAILED" }

  - name: PaymentToken
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; device this token is bound to" }
      - { name: card_account_id, type: string, source: system, description: "FK -> CardAccount.id; funding account" }
      - { name: card_artifact_id, type: string, source: system, description: "FK -> CardArtifact.id; provisioned artifact" }
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; denormalized for issuer scoping" }
      - { name: device_account_number, type: string, source: system, description: "DPAN bound to this token; unique among non-terminated tokens" }
      - { name: express_transit_enabled, type: boolean, source: input, default: false, description: "Express transit flag (requires card_product TRANSIT and agreement support)" }
      - { name: auth_attempt_count, type: integer, source: system, default: 0, description: "Count of attempted authorizations against this token" }
      - { name: approved_auth_count, type: integer, source: system, default: 0, description: "Count of authorizations that ended APPROVED" }
      - { name: decline_count, type: integer, source: system, default: 0, description: "Cumulative decline counter" }
      - { name: consecutive_decline_count, type: integer, source: system, default: 0, description: "Declines since last approval" }
      - { name: suspension_count, type: integer, source: system, default: 0, description: "Times this token has been suspended (includes auto-suspensions)" }
      - { name: last_decline_reason, type: enum, source: system, default: null, description: "Most recent decline reason from the decline catalog" }
      - { name: deactivated_reason, type: string, source: system, default: null, description: "Reason recorded on deactivation (LOST_DEVICE | ISSUER_REVOKE | CARD_REISSUE | DEVICE_UNSECURED | USER_REMOVE)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACTIVE | SUSPENDED | DEACTIVATED" }

  - name: Authorization
    parent: PaymentToken
    common_fields: true
    fields:
      - { name: payment_token_id, type: string, source: input, description: "FK -> PaymentToken.id; token being charged" }
      - { name: cryptogram, type: string, source: input, description: "Transaction cryptogram (payload)" }
      - { name: amount_cents, type: integer, source: input, description: "Authorization amount" }
      - { name: currency, type: string, source: input, description: "ISO currency code" }
      - { name: merchant_id, type: string, source: input, description: "Merchant identifier" }
      - { name: merchant_category, type: enum, source: input, description: "GENERAL | TRANSIT" }
      - { name: biometric_verified, type: boolean, source: input, default: false, description: "Device attests biometric verification" }
      - { name: express_mode, type: boolean, source: input, default: false, description: "Authorization attempted under express transit" }
      - { name: declined_reason, type: enum, source: system, default: null, description: "Final decline reason when DECLINED: ISSUER_DECLINED | FRAUD_SUSPECTED" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | DECLINED" }

  - name: Dispute
    parent: PaymentToken
    common_fields: true
    fields:
      - { name: payment_token_id, type: string, source: system, description: "FK -> PaymentToken.id; token that carried the disputed auth" }
      - { name: authorization_id, type: string, source: system, description: "FK -> Authorization.id; disputed authorization (path parent)" }
      - { name: card_account_id, type: string, source: computed, description: "FK -> CardAccount.id; underlying account traced from the token" }
      - { name: amount_cents, type: integer, source: input, description: "Disputed amount (must equal the authorization amount)" }
      - { name: reason, type: enum, source: input, description: "UNRECOGNIZED | DUPLICATE | FRAUD | GOODS_NOT_RECEIVED" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | WON | LOST" }

  - name: TransitOperator
    parent: null
    common_fields: true
    fields:
      - { name: operator_code, type: string, source: input, description: "Unique operator code" }
      - { name: name, type: string, source: input, description: "Operator display name" }
      - { name: flat_fare_cents, type: integer, source: input, description: "Flat fare charged per tap" }
      - { name: express_cap_cents, type: integer, source: input, description: "Maximum authorization amount under express mode at this operator" }
      - { name: allowlist_active, type: boolean, source: input, default: false, description: "When true, only allowlisted cards may tap" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: MerchantCardProgram
    parent: MerchantProgram
    common_fields: true
    fields:
      - { name: merchant_program_id, type: string, source: input, description: "FK -> MerchantProgram.id; program joined" }
      - { name: card_account_id, type: string, source: input, description: "FK -> CardAccount.id; enrolled card account" }
      - { name: enrolled_at, type: datetime, source: system, description: "Enrollment timestamp" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REVOKED" }

  - name: TransitAllowlist
    parent: TransitOperator
    common_fields: false
    fields:
      - { name: transit_operator_id, type: string, source: input, description: "FK -> TransitOperator.id; owning operator" }
      - { name: card_account_id, type: string, source: input, description: "FK -> CardAccount.id; allowlisted card" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REMOVED" }

  - name: TokenEvent
    parent: PaymentToken
    common_fields: false
    fields:
      - { name: payment_token_id, type: string, source: system, description: "FK -> PaymentToken.id; subject token" }
      - { name: event_type, type: enum, source: system, description: "PROVISIONING | ACTIVATION | AUTHORIZATION_APPROVED | AUTHORIZATION_DECLINED | SUSPENSION | RESUMPTION | DEACTIVATION | DEVICE_BINDING_LOST" }
      - { name: payload, type: object, source: system, default: "{}", description: "Structured event payload" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Issuer
    initial_state: DRAFT
    terminal_states: [OFFBOARDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /issuers/{issuerId}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Issuer has at least one IssuerAgreement with status ACTIVE (else ERR_AGREEMENT_REQUIRED)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /issuers/{issuerId}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Cascade: every PaymentToken with issuer_id == this issuer and status ACTIVE -> SUSPENDED (reason issuer), suspension_count += 1 per token"
          - "Each cascaded token suspension appends a TokenEvent (SUSPENSION) to that token"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /issuers/{issuerId}/activate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
        note: "Reactivation does NOT auto-resume tokens; tokens resume only via explicit /resume."
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "POST /issuers/{issuerId}/offboard"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "All CardAccounts with issuer_id == this issuer and status OPEN|RESTRICTED -> CLOSED"
          - "Each closed account cascades: its PaymentTokens ACTIVE|SUSPENDED -> DEACTIVATED (deactivated_reason ISSUER_REVOKE), each with a TokenEvent"
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /issuers/{issuerId}/offboard"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "All CardAccounts with issuer_id == this issuer and status OPEN|RESTRICTED -> CLOSED"
          - "Each closed account cascades: its PaymentTokens ACTIVE|SUSPENDED -> DEACTIVATED (deactivated_reason ISSUER_REVOKE), each with a TokenEvent"

  - entity: IssuerAgreement
    initial_state: PENDING
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /issuer-agreements/{agreementId}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Parent Issuer status != OFFBOARDED (else ERR_ISSUER_NOT_ACTIVE)"
          - "No other IssuerAgreement of the same issuer is ACTIVE (else ERR_AGREEMENT_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /issuer-agreements/{agreementId}/supersede"
        actor: PlatformAdmin
        preconditions:
          - "new terms payload must be valid (fees, branding) else ERR_TERMS_VALIDATION_FAILED"
        side_effects:
          - "A new IssuerAgreement for the same issuer is created in status ACTIVE"
          - "Every ACTIVE PaymentToken whose issuer matches is re-fee'd: no token state change, but future auths use the new agreement's fee schedule"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /issuer-agreements/{agreementId}/terminate"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "If this was the issuer's last ACTIVE agreement, the parent Issuer status -> SUSPENDED (cascading token suspensions per Issuer machine)"

  - entity: CardAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: automatically when a FRAUD dispute is opened on any token of this account (priority-19)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESTRICTED
        to: OPEN
        trigger: "system: when that FRAUD dispute is resolved (resolve-dispute WON or LOST)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: REISSUED
        trigger: "POST /card-accounts/{cardAccountId}/reissue"
        actor: IssuerOperator
        preconditions:
          - "Account must be OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "A successor CardAccount is created with status OPEN and reissue_of_account_id = this account"
          - "This account's CardArtifacts -> DEACTIVATED"
          - "This account's PaymentTokens ACTIVE|SUSPENDED -> DEACTIVATED with deactivated_reason CARD_REISSUE; each appends a TokenEvent (DEACTIVATION)"
      - from: RESTRICTED
        to: REISSUED
        trigger: "POST /card-accounts/{cardAccountId}/reissue"
        actor: IssuerOperator
        preconditions: []
        side_effects:
          - "Successor account created OPEN with reissue_of_account_id set"
          - "Artifacts and tokens deactivated as in OPEN->REISSUED"
      - from: OPEN
        to: CLOSED
        trigger: "POST /card-accounts/{cardAccountId}/close"
        actor: IssuerOperator
        preconditions:
          - "No OPEN disputes exist on tokens of this account (else ERR_CARD_HAS_OPEN_DISPUTES)"
        side_effects:
          - "PaymentTokens ACTIVE|SUSPENDED -> DEACTIVATED (deactivated_reason USER_REMOVE via issuer), TokenEvents appended"
      - from: REISSUED
        to: CLOSED
        trigger: "POST /card-accounts/{cardAccountId}/close"
        actor: IssuerOperator
        preconditions: []
        side_effects: []

  - entity: CardArtifact
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /card-artifacts/{cardArtifactId}/suspend"
        actor: IssuerOperator
        preconditions:
          - "Parent CardAccount must be OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "PaymentTokens bound to this artifact with status ACTIVE -> SUSPENDED (reason artifact); suspension_count += 1; TokenEvent per token"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /card-artifacts/{cardArtifactId}/resume"
        actor: IssuerOperator
        preconditions:
          - "Parent CardAccount must be OPEN (else ERR_INVALID_STATE)"
        side_effects: []
        note: "Does not resume tokens; tokens resume only via their own /resume."
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /card-artifacts/{cardArtifactId}/deactivate (also system cascade on reissue)"
        actor: IssuerOperator | system
        preconditions: []
        side_effects:
          - "PaymentTokens bound to this artifact with status ACTIVE|SUSPENDED -> DEACTIVATED (deactivated_reason CARD_REISSUE when via reissue, else ISSUER_REVOKE); TokenEvent per token"
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /card-artifacts/{cardArtifactId}/deactivate"
        actor: IssuerOperator
        preconditions: []
        side_effects:
          - "Tokens SUSPENDED on this artifact -> DEACTIVATED; TokenEvent per token"

  - entity: ProvisioningSession
    initial_state: INITIATED
    terminal_states: [TOKENIZED, EXPIRED, FAILED]
    transitions:
      - from: INITIATED
        to: VERIFICATION_REQUIRED
        trigger: "system: automatic immediately on creation"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFICATION_REQUIRED
        to: VERIFIED
        trigger: "POST /devices/{deviceId}/provisioning-sessions/{sessionId}/verify (second successful challenge)"
        actor: Cardholder
        preconditions:
          - "logical clock < expires_at (else session auto-EXPIRED first)"
          - "verification_attempt_count == 1 after this challenge completes (second successful challenge)"
          - "provided code matches the method's challenge code (else ERR_OTP_MISMATCH)"
        side_effects: []
        note: "First successful challenge: stays VERIFICATION_REQUIRED with verification_attempt_count 1. Any mismatch: ERR_OTP_MISMATCH; the third consecutive mismatch transitions the session to FAILED."
      - from: VERIFIED
        to: TOKENIZED
        trigger: "POST /devices/{deviceId}/provisioning-sessions/{sessionId}/tokenize"
        actor: Cardholder
        preconditions:
          - "Device.security_posture == HEALTHY (passcode_enabled AND NOT is_lost; else ERR_DEVICE_UNSECURED or ERR_DEVICE_LOST)"
          - "Card account OPEN and issuer ACTIVE with an ACTIVE agreement (priorities 11-12)"
          - "express_transit_enabled true requires card_product TRANSIT and agreement.express_transit_supported (else ERR_EXPRESS_TRANSIT_NOT_SUPPORTED)"
          - "logical clock < expires_at"
        side_effects:
          - "device_account_number (DPAN) minted and stored; distinct from card PAN"
          - "A PaymentToken is created: status ACTIVE, bound to this device + card account + artifact; active_token_count on device increments"
          - "TokenEvent (ACTIVATION) appended to the new token"
      - from: VERIFICATION_REQUIRED
        to: EXPIRED
        trigger: "system: when logical clock reaches expires_at (evaluated on next access)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: when logical clock reaches expires_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFICATION_REQUIRED
        to: FAILED
        trigger: "system: third consecutive OTP mismatch on this session (verify returns ERR_OTP_MISMATCH; session -> FAILED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PaymentToken
    initial_state: PENDING
    terminal_states: [DEACTIVATED]
    note: "Tokens are created directly in ACTIVE via tokenize; the PENDING->ACTIVE path is for completeness. Parallel behavior: status is the single lifecycle axis while counters (decline_count, approved_auth_count, active flags) evolve independently on the same row."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /devices/{deviceId}/tokens/{tokenId}/suspend"
        actor: Cardholder
        preconditions:
          - "Token status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "suspension_count += 1; TokenEvent (SUSPENSION) appended"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /devices/{deviceId}/tokens/{tokenId}/resume"
        actor: Cardholder
        preconditions:
          - "Device.security_posture == HEALTHY (else ERR_DEVICE_UNSECURED)"
          - "Funding CardAccount status == OPEN (else ERR_CARD_ACCOUNT_RESTRICTED)"
          - "Token status == SUSPENDED"
        side_effects:
          - "TokenEvent (RESUMPTION) appended"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /devices/{deviceId}/tokens/{tokenId}/deactivate"
        actor: Cardholder
        preconditions: []
        side_effects:
          - "deactivated_reason recorded; Device.active_token_count recomputed"
          - "TokenEvent (DEACTIVATION) appended"
          - "If the deactivated token was the device default, default_card_id on the device is cleared"
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /devices/{deviceId}/tokens/{tokenId}/deactivate (also system cascades: device report_lost, artifact deactivate, card reissue/close, issuer offboard)"
        actor: Cardholder | system
        preconditions: []
        side_effects:
          - "Device.active_token_count recomputed; default_card_id cleared if it pointed here"
          - "TokenEvent (DEACTIVATION) appended"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: auto-suspend when consecutive_decline_count reaches 3 (decline_streak_suspend_threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "suspension_count += 1; TokenEvent (SUSPENSION) appended"
          - "If the token was the device default, default_card_id is cleared"

  - entity: Authorization
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /payment-tokens/{tokenId}/authorizations when all priority 8-17 gates pass and the cryptogram is not the literal \"DECLINE\""
        actor: IssuerOperator
        preconditions:
          - "Token ACTIVE; device HEALTHY; biometric/passcode gate satisfied; caps not exceeded"
        side_effects:
          - "Token.approved_auth_count += 1; consecutive_decline_count reset to 0"
          - "TokenEvent (AUTHORIZATION_APPROVED) appended"
      - from: PENDING
        to: DECLINED
        trigger: "cryptogram == \"DECLINE\" (ISSUER_DECLINED) or a priority 9-17 gate failure that records a decline reason"
        actor: IssuerOperator | system
        preconditions: []
        side_effects:
          - "Token.decline_count += 1; consecutive_decline_count += 1; last_decline_reason set"
          - "TokenEvent (AUTHORIZATION_DECLINED) appended"
          - "If consecutive_decline_count reaches 3: token auto-suspends (see PaymentToken machine)"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [WON, LOST]
    transitions:
      - from: OPEN
        to: WON
        trigger: "POST /disputes/{disputeId}/resolve-dispute with outcome WON"
        actor: IssuerOperator
        preconditions:
          - "Dispute OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "If reason == FRAUD: CardAccount RESTRICTED -> OPEN"
      - from: OPEN
        to: LOST
        trigger: "POST /disputes/{disputeId}/resolve-dispute with outcome LOST"
        actor: IssuerOperator
        preconditions:
          - "Dispute OPEN"
        side_effects:
          - "If reason == FRAUD: CardAccount RESTRICTED -> OPEN"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: tokenize-stale-session-version
    parent_entity: ProvisioningSession
    write_endpoint: "POST /devices/{deviceId}/provisioning-sessions/{sessionId}/tokenize"
    occ_field: "expected_session_version"
    description: |
      Tokenizing a ProvisioningSession whose version has advanced since the
      client last read it is rejected, because an earlier tokenize or verify
      may have legitimately advanced the session. The stale caller's view no
      longer reflects the session it claims to finalize.
    error_id: ERR_VERSION_CONFLICT
    http_status: 412
  - rule_id: device-default-stale-version
    parent_entity: Device
    write_endpoint: "POST /devices/{deviceId}/default-card"
    occ_field: "expected_device_version"
    description: |
      Setting the default card on a Device whose version has advanced since
      the client last read it is rejected: an intervening token deactivation
      (which also mutates default_card_id) may have invalidated the caller's
      choice set.
    error_id: ERR_VERSION_CONFLICT
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: security_posture
    trigger: "recomputed on every read of Device and on every device-security change (report_lost, report_found, set_security)"
    algorithm: constraint_propagation
    formula: |
      if device.is_lost:
        posture = LOST
      elif device.passcode_enabled == false:
        posture = DEGRADED
      else:
        posture = HEALTHY
    input_set: "the single Device row"
    constants: {}

  - name: provisioning_window
    trigger: "session access (verify, tokenize, read)"
    algorithm: threshold
    formula: |
      expires_at = session.created_at + SESSION_TTL_HOURS
      A session whose logical clock has reached expires_at transitions to EXPIRED before any other logic runs (lazy expiry).
      Boundary: clock == expires_at means EXPIRED (>= comparison, inclusive).
    input_set: "the single ProvisioningSession row"
    constants:
      SESSION_TTL_HOURS: 24

  - name: decline_reason_resolution
    trigger: "authorization attempt"
    algorithm: constraint_propagation
    formula: |
      Request-level gates (§1.4 priorities 8-17) run FIRST; a failure rejects
      the request with the gate's 4xx error and NO Authorization row is
      persisted (decline counters unchanged). Only a request passing every
      gate creates a PENDING Authorization, which is then decided by the
      cryptogram payload:
        cryptogram == "DECLINE"       -> DECLINED, declined_reason ISSUER_DECLINED
        cryptogram == "DECLINE_FRAUD" -> DECLINED, declined_reason FRAUD_SUSPECTED
        any other value               -> APPROVED
      On DECLINED: token.decline_count += 1, consecutive_decline_count += 1,
      last_decline_reason set; reaching 3 consecutive declines auto-suspends
      the token. On APPROVED: consecutive_decline_count resets to 0.
    input_set: "token, device, card account, agreement, optional merchant program / transit operator"
    constants:
      per_auth_cap_cents: 100000
      decline_streak_suspend_threshold: 3

  - name: issuer_fee_accrual
    trigger: "authorization APPROVED and on issuer_fee_projection read"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (circular-looking: cap depends on computed fee, fee depends on agreement selected by auth):
        raw_fee = floor(amount_cents * agreement.fee_bps / 10000)
        capped  = min(raw_fee, agreement.fee_cap_cents)
        fee_cents = max(capped, agreement.fee_floor_cents)
      Dual variants on the same input set:
        - ledger variant (accrual): only APPROVED authorizations contribute; fees accumulate on the Issuer agreement's running fee ledger at auth time.
        - projection variant (projection): APPROVED authorizations PLUS PENDING authorizations contribute; computed at read time, never persisted.
      The two variants MUST produce different totals whenever at least one PENDING authorization exists.
    input_set: "authorizations of tokens whose issuer matches; ledger counts status APPROVED, projection counts status APPROVED + PENDING"
    constants: {}
    precision: "integer cents, floor division, round_half_up never used"
    variants:
      - name: accrual
        when: "at authorization approval (persisted)"
        difference: "counts only APPROVED authorizations"
      - name: projection
        when: "GET /issuers/{id}/fee-projection"
        difference: "counts APPROVED + PENDING authorizations"

  - name: aggregate_risk_score
    trigger: "computed on GET /card-accounts/{id}/risk"
    algorithm: weighted_scoring
    formula: |
      score = 4 * decline_count_of_open_dispute_tokens(account)
            + 1 * decline_count_of_other_tokens(account)
            + RISK_OPEN_DISPUTE_BONUS * (count of OPEN disputes on account)
            + RISK_DEVICE_LOST_BONUS if any bound device is_lost
      Cap: score = min(score, RISK_CAP)
      Floor: score >= 0
    input_set: "tokens of the account, their devices, OPEN disputes"
    constants:
      RISK_OPEN_DISPUTE_BONUS: 15
      RISK_DEVICE_LOST_BONUS: 25
      RISK_CAP: 100

  - name: express_tap_amount
    trigger: "authorization with merchant_category TRANSIT and express_mode true"
    algorithm: waterfall_allocation
    formula: |
      Effective express ceiling = min(operator.express_cap_cents, global per_auth_cap_cents)
      Charged amount = min(requested amount_cents, effective ceiling)
      The cap applies BEFORE decline-reason evaluation; an amount above the ceiling is declined CAP_EXCEEDED, never partially approved.
    input_set: "TransitOperator row + global cap"
    constants:
      per_auth_cap_cents: 100000

  - name: disputed_amount_reconciliation
    trigger: "dispute create/resolve"
    algorithm: aggregation
    formula: |
      Per CardAccount: total_disputed_cents = sum(Dispute.amount_cents for disputes with status OPEN traced to this account)
      On resolve (WON or LOST): the dispute's amount leaves the open-disputed set.
      Invariant: sum over accounts of open disputed amounts is conserved across create+resolve pairs of the same dispute.
    input_set: "disputes with status OPEN whose card_account_id matches"
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; endpoints whose role list is exactly [Any] skip this check (cardholder registration, clock set, all GETs)"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints whose role list is not exactly [Any]"

  - priority: 2
    category: auth
    check: "Role must be permitted on the endpoint; entity_backed roles must also own the target resource where the endpoint is ownership-scoped (e.g., a Cardholder may only act on devices of cardholder_id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request payload schema: required fields present, enum members valid, integers non-negative where required"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all POST endpoints

  - priority: 4
    category: existence
    check: "Path parameters resolve left-to-right: issuer, agreement, device, session, token, authorization, dispute; body FKs after path"
    error_id: "ERR_NOT_FOUND (entity-specific: ERR_ISSUER_NOT_FOUND, ERR_DEVICE_NOT_FOUND, ERR_TOKEN_NOT_FOUND, ERR_CARD_ACCOUNT_NOT_FOUND, ERR_AUTHORIZATION_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_OPERATOR_NOT_FOUND)"
    http_status: 404
    applies_to: all parameterized endpoints

  - priority: 5
    category: business_temporal
    check: "Provisioning session expiry: logical clock >= session.expires_at auto-EXPIRES the session before other checks"
    error_id: ERR_PROVISIONING_SESSION_EXPIRED
    http_status: 409
    applies_to: "POST .../provisioning-sessions/{id}/verify, POST .../provisioning-sessions/{id}/tokenize"

  - priority: 6
    category: state
    check: "Target resource must be in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (activate/suspend/resume/verify/tokenize/resolve/close/reissue/etc.)"

  - priority: 7
    category: business_constraint
    check: "Idempotency: same idempotency_key on the same device replays the original session; different payload with same key is a conflict"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /devices/{deviceId}/provisioning-sessions"

  - priority: 7.5
    category: business_constraint
    check: "One active provisioning window per device: a device with a non-terminal ProvisioningSession (INITIATED/VERIFICATION_REQUIRED/VERIFIED, not yet EXPIRED) rejects a second session create"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /devices/{deviceId}/provisioning-sessions"

  - priority: 8
    category: state
    check: "Token must be ACTIVE to attempt an authorization"
    error_id: ERR_TOKEN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /payment-tokens/{tokenId}/authorizations"

  - priority: 9
    category: business_safety
    check: "Device security posture: tokenize, token resume, and non-express authorization require passcode_enabled (posture not DEGRADED)"
    error_id: ERR_DEVICE_UNSECURED
    http_status: 409
    applies_to: "tokenize, token resume, non-express authorization"

  - priority: 10
    category: business_safety
    check: "Device lost: a lost device (posture LOST) blocks tokenize/resume/authorize entirely"
    error_id: ERR_DEVICE_LOST
    http_status: 409
    applies_to: "tokenize, token resume, authorization (any mode)"

  - priority: 11
    category: business_referential
    check: "Issuer participation: card account's issuer must be ACTIVE and hold an ACTIVE agreement at provisioning and authorization time"
    error_id: ERR_ISSUER_NOT_ACTIVE
    http_status: 409
    applies_to: "provisioning-session create, tokenize, authorization"

  - priority: 12
    category: business_referential
    check: "Card account must be OPEN for provisioning-session create, tokenize, authorization, and program enrollment"
    error_id: ERR_CARD_ACCOUNT_RESTRICTED
    http_status: 409
    applies_to: "provisioning-session create, tokenize, authorization, merchant program enrollment"

  - priority: 13
    category: business_safety
    check: "Authentication gate: on a device with biometric_enabled true, a non-express authorization with biometric_verified false fails AUTHENTICATION_REQUIRED; express-mode authorizations skip this gate"
    error_id: ERR_AUTHENTICATION_REQUIRED
    http_status: 422
    applies_to: "POST /payment-tokens/{tokenId}/authorizations"

  - priority: 14
    category: business_fiscal
    check: "Per-authorization amount cap: amount_cents <= 100000 (per_auth_cap_cents)"
    error_id: ERR_AUTH_AMOUNT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /payment-tokens/{tokenId}/authorizations"

  - priority: 15
    category: business_fiscal
    check: "Merchant-program cap: enrolled-program authorizations must not exceed program max_auth_amount_cents"
    error_id: ERR_PROGRAM_AMOUNT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /payment-tokens/{tokenId}/authorizations with merchant matching an enrolled program"

  - priority: 16
    category: business_constraint
    check: "Express transit eligibility: express_mode requires token.express_transit_enabled, card_product TRANSIT, agreement.express_transit_supported, and an ACTIVE operator whose express_cap_cents >= amount"
    error_id: ERR_EXPRESS_TRANSIT_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /payment-tokens/{tokenId}/authorizations with express_mode true"

  - priority: 17
    category: business_constraint
    check: "Transit allowlist: when operator.allowlist_active, the card account must be on the operator's ACTIVE allowlist"
    error_id: ERR_TRANSIT_NOT_ALLOWED
    http_status: 422
    applies_to: "authorization at allowlisted operators"

  - priority: 18
    category: business_referential
    check: "Merchant program enrollment: program ACTIVE, card account OPEN (or SUSPENDED card only when active_sessions_required false), the card's earliest-created artifact's pan_last4 matches required_pan_last4 (constraint skipped when required_pan_last4 is the empty string)"
    error_id: "ERR_PROGRAM_NOT_ACTIVE / ERR_PROGRAM_INELIGIBLE"
    http_status: 409
    applies_to: "POST /merchant-card-programs"

  - priority: 19
    category: business_referential
    check: "Dispute traceability: disputed amount must equal the authorization amount; authorization must be APPROVED; FRAUD disputes additionally restrict the account to RESTRICTED"
    error_id: "ERR_DISPUTE_AMOUNT_MISMATCH / ERR_INVALID_STATE"
    http_status: 409
    applies_to: "POST /authorizations/{authorizationId}/disputes"

  - priority: 20
    category: business_referential
    check: "Agreement lifecycle: activating an agreement requires the parent issuer not OFFBOARDED and no other ACTIVE agreement on the same issuer"
    error_id: "ERR_ISSUER_NOT_ACTIVE / ERR_AGREEMENT_OVERLAP"
    http_status: 409
    applies_to: "POST /issuer-agreements/{id}/activate"

  - priority: 21
    category: business_referential
    check: "Default card: candidate token must be ACTIVE and bound to the target device; exactly one default per device; setting a new default replaces the old"
    error_id: ERR_TOKEN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /devices/{deviceId}/default-card"

  - priority: 22
    category: business_constraint
    check: "DPAN uniqueness: minted device_account_number must not collide with an existing non-terminated token (retry-with-new-DPAN is server-internal)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "tokenize"

  - priority: 23
    category: business_temporal
    check: "Transit tap window: an authorization with merchant_category TRANSIT must be authorized within the same service day as operator definition (no cross-midnight auth batching)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "authorization with merchant_category TRANSIT"

# =============================================================================
# §1.5 API Endpoint Table (41 endpoints)
# =============================================================================
endpoints:
  # --- Cardholder / Device ---
  - method: POST
    path: "/cardholders"
    description: "Register a cardholder"
    roles: [Any]
    code: 201
    input: [legal_name, email, phone]
    output: Cardholder
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/cardholders/{cardholderId}"
    description: "Get a cardholder"
    roles: [Any]
    code: 200
    input: []
    output: Cardholder
    side_effects: []

  - method: POST
    path: "/devices"
    description: "Register a device for a cardholder"
    roles: [Cardholder]
    code: 201
    input: [cardholder_id, device_serial, device_model, os_version]
    output: Device
    side_effects: ["passcode_enabled=false, biometric_enabled=false, is_lost=false, security_posture=DEGRADED"]

  - method: GET
    path: "/devices/{deviceId}"
    description: "Get a device (security_posture computed at read)"
    roles: [Any]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: GET
    path: "/cardholders/{id}/devices"
    description: "List devices of a cardholder"
    roles: [Any]
    code: 200
    input: []
    output: "Device[]"
    side_effects: []

  - method: POST
    path: "/devices/{deviceId}/set-security"
    description: "Set passcode/biometric flags"
    roles: [Cardholder]
    code: 200
    input: [passcode_enabled, biometric_enabled]
    output: Device
    side_effects: ["security_posture recomputed"]

  - method: POST
    path: "/devices/{deviceId}/report_lost"
    description: "Mark the device lost"
    roles: [Cardholder, IssuerOperator, CustomerService]
    code: 200
    input: []
    output: Device
    side_effects:
      - "is_lost=true, reported_lost_at set, security_posture -> LOST"
      - "All ACTIVE PaymentTokens on this device -> SUSPENDED (reason lost_device), suspension_count += 1, TokenEvent per token; default_card_id cleared"

  - method: POST
    path: "/devices/{deviceId}/report_found"
    description: "Mark the device found"
    roles: [Cardholder, CustomerService]
    code: 200
    input: []
    output: Device
    side_effects: ["found_at set; is_lost=false; security_posture recomputed as DEGRADED or HEALTHY per passcode_enabled"]

  # --- Issuer / Agreement ---
  - method: POST
    path: "/issuers"
    description: "Create an issuer"
    roles: [PlatformAdmin]
    code: 201
    input: [issuer_name, country_code]
    output: Issuer
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/issuers/{issuerId}"
    description: "Get an issuer"
    roles: [Any]
    code: 200
    input: []
    output: Issuer
    side_effects: []

  - method: POST
    path: "/issuers/{issuerId}/activate"
    description: "Activate an issuer (requires an ACTIVE agreement)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Issuer
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/issuers/{issuerId}/suspend"
    description: "Suspend an issuer (cascades token suspension)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Issuer
    side_effects: ["status -> SUSPENDED; token cascade per Issuer machine"]

  - method: POST
    path: "/issuers/{issuerId}/offboard"
    description: "Offboard an issuer (closes accounts, deactivates tokens)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Issuer
    side_effects: ["status -> OFFBOARDED; account closure cascade per Issuer machine"]

  - method: GET
    path: "/issuers/{issuerId}/fee-projection"
    description: "Projection variant of issuer fees (APPROVED + PENDING auths)"
    roles: [IssuerOperator, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: "{ projected_fee_cents: integer, approved_fee_cents: integer, authorization_count: integer }"
    side_effects: []

  - method: POST
    path: "/issuer-agreements"
    description: "Create an issuer agreement"
    roles: [PlatformAdmin]
    code: 201
    input: ["issuer_id", "branding_color", "branding_logo_ref", "terms_version", "fee_bps", "fee_cap_cents", "fee_floor_cents?", "express_transit_supported", "effective_at", "expires_at"]
    output: IssuerAgreement
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/issuer-agreements/{agreementId}"
    description: "Get an issuer agreement"
    roles: [Any]
    code: 200
    input: []
    output: IssuerAgreement
    side_effects: []

  - method: GET
    path: "/issuers/{id}/agreements"
    description: "List agreements of an issuer"
    roles: [Any]
    code: 200
    input: []
    output: "IssuerAgreement[]"
    side_effects: []

  - method: POST
    path: "/issuer-agreements/{agreementId}/activate"
    description: "Activate an agreement"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: IssuerAgreement
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/issuer-agreements/{agreementId}/supersede"
    description: "Supersede this agreement with new terms"
    roles: [PlatformAdmin]
    code: 200
    input: ["branding_color", "branding_logo_ref", "terms_version", "fee_bps", "fee_cap_cents", "fee_floor_cents?", "express_transit_supported", "effective_at", "expires_at"]
    output: IssuerAgreement
    side_effects: ["old agreement -> SUPERSEDED; new agreement created ACTIVE"]

  - method: POST
    path: "/issuer-agreements/{agreementId}/terminate"
    description: "Terminate an agreement"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: IssuerAgreement
    side_effects: ["status -> TERMINATED; issuer may suspend"]

  # --- Card account / artifact ---
  - method: POST
    path: "/card-accounts"
    description: "Open a card account"
    roles: [IssuerOperator, PlatformAdmin]
    code: 201
    input: [cardholder_id, issuer_id, fpan_last4, card_product]
    output: CardAccount
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/card-accounts/{cardAccountId}"
    description: "Get a card account"
    roles: [Any]
    code: 200
    input: []
    output: CardAccount
    side_effects: []

  - method: GET
    path: "/card-accounts"
    description: "List card accounts (filterable)"
    roles: [Any]
    code: 200
    input: ["issuer_id?", "cardholder_id?", "status?"]
    output: "CardAccount[]"
    side_effects: []

  - method: POST
    path: "/card-accounts/{cardAccountId}/reissue"
    description: "Reissue the account (successor created; artifacts/tokens deactivated)"
    roles: [IssuerOperator]
    code: 201
    input: []
    output: CardAccount
    side_effects: ["successor CardAccount created OPEN with reissue_of_account_id set"]

  - method: POST
    path: "/card-accounts/{cardAccountId}/close"
    description: "Close the account"
    roles: [IssuerOperator]
    code: 200
    input: []
    output: CardAccount
    side_effects: ["status -> CLOSED; tokens deactivated"]

  - method: GET
    path: "/card-accounts/{cardAccountId}/risk"
    description: "Aggregate risk score of the account"
    roles: [IssuerOperator, PlatformAdmin, CustomerService]
    code: 200
    input: []
    output: "{ risk_score: integer, open_dispute_count: integer, open_disputed_cents: integer }"
    side_effects: []

  - method: POST
    path: "/card-artifacts"
    description: "Create a card artifact on an account"
    roles: [IssuerOperator]
    code: 201
    input: [card_account_id, pan_last4, expiry, embossing_name]
    output: CardArtifact
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/card-artifacts/{cardArtifactId}"
    description: "Get a card artifact"
    roles: [Any]
    code: 200
    input: []
    output: CardArtifact
    side_effects: []

  - method: GET
    path: "/card-accounts/{id}/artifacts"
    description: "List artifacts of an account"
    roles: [Any]
    code: 200
    input: []
    output: "CardArtifact[]"
    side_effects: []

  - method: POST
    path: "/card-artifacts/{cardArtifactId}/suspend"
    description: "Suspend an artifact (token cascade)"
    roles: [IssuerOperator]
    code: 200
    input: []
    output: CardArtifact
    side_effects: ["status -> SUSPENDED; ACTIVE tokens -> SUSPENDED"]

  - method: POST
    path: "/card-artifacts/{cardArtifactId}/resume"
    description: "Resume an artifact"
    roles: [IssuerOperator]
    code: 200
    input: []
    output: CardArtifact
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/card-artifacts/{cardArtifactId}/deactivate"
    description: "Deactivate an artifact (token cascade to DEACTIVATED)"
    roles: [IssuerOperator]
    code: 200
    input: []
    output: CardArtifact
    side_effects: ["status -> DEACTIVATED; tokens -> DEACTIVATED"]

  # --- Provisioning ---
  - method: POST
    path: "/devices/{deviceId}/provisioning-sessions"
    description: "Start card provisioning for a device"
    roles: [Cardholder]
    code: 201
    input: [card_artifact_id, idempotency_key]
    output: ProvisioningSession
    side_effects: ["status INITIATED -> VERIFICATION_REQUIRED; expires_at = created_at + 24h"]

  - method: GET
    path: "/devices/{id}/provisioning-sessions"
    description: "List provisioning sessions of a device"
    roles: [Any]
    code: 200
    input: []
    output: "ProvisioningSession[]"
    side_effects: []

  - method: GET
    path: "/provisioning-sessions/{sessionId}"
    description: "Get a provisioning session"
    roles: [Any]
    code: 200
    input: []
    output: ProvisioningSession
    side_effects: []

  - method: POST
    path: "/devices/{deviceId}/provisioning-sessions/{sessionId}/verify"
    description: "Complete one identity challenge (OTP or issuer-app)"
    roles: [Cardholder]
    code: 200
    input: [method, code]
    output: ProvisioningSession
    side_effects: ["verification_attempt_count += 1; when count reaches 2, status -> VERIFIED"]

  - method: POST
    path: "/devices/{deviceId}/provisioning-sessions/{sessionId}/tokenize"
    description: "Mint the DPAN and create the bound PaymentToken (OCC on session version)"
    roles: [Cardholder]
    code: 201
    input: ["express_transit_enabled?", "expected_session_version"]
    output: PaymentToken
    side_effects:
      - "session.status -> TOKENIZED; device_account_number minted"
      - "increments ProvisioningSession.version by 1"
      - "PaymentToken created ACTIVE; Device.active_token_count += 1"

  # --- Tokens / authorization ---
  - method: GET
    path: "/devices/{id}/tokens"
    description: "List tokens on a device"
    roles: [Any]
    code: 200
    input: []
    output: "PaymentToken[]"
    side_effects: []

  - method: GET
    path: "/payment-tokens/{tokenId}"
    description: "Get a payment token"
    roles: [Any]
    code: 200
    input: []
    output: PaymentToken
    side_effects: []

  - method: POST
    path: "/devices/{deviceId}/tokens/{tokenId}/suspend"
    description: "Suspend a token"
    roles: [Cardholder]
    code: 200
    input: []
    output: PaymentToken
    side_effects: ["status -> SUSPENDED; suspension_count += 1"]

  - method: POST
    path: "/devices/{deviceId}/tokens/{tokenId}/resume"
    description: "Resume a suspended token"
    roles: [Cardholder]
    code: 200
    input: []
    output: PaymentToken
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/devices/{deviceId}/tokens/{tokenId}/deactivate"
    description: "Deactivate (delete) a token"
    roles: [Cardholder]
    code: 200
    input: []
    output: PaymentToken
    side_effects: ["status -> DEACTIVATED; device default cleared if needed"]

  - method: POST
    path: "/devices/{deviceId}/default-card"
    description: "Set the device default card (OCC on device version)"
    roles: [Cardholder]
    code: 200
    input: [token_id, expected_device_version]
    output: Device
    side_effects:
      - "default_card_id = token_id; replaces previous default"
      - "increments Device.version by 1"

  - method: POST
    path: "/payment-tokens/{tokenId}/authorizations"
    description: "Attempt an authorization carrying a cryptogram"
    roles: [IssuerOperator]
    code: 201
    input: ["cryptogram", "amount_cents", "currency", "merchant_id", "merchant_category", "biometric_verified?", "express_mode?", "transit_operator_id?"]
    output: Authorization
    side_effects:
      - "Token.auth_attempt_count += 1"
      - "On APPROVED: approved_auth_count += 1, consecutive_decline_count = 0, issuer fee accrual"
      - "On DECLINED: decline_count += 1, consecutive_decline_count += 1, last_decline_reason set; at 3 consecutive declines the token auto-suspends"
      - "increments PaymentToken.version by 1"

  - method: GET
    path: "/payment-tokens/{id}/authorizations"
    description: "List authorizations of a token"
    roles: [Any]
    code: 200
    input: []
    output: "Authorization[]"
    side_effects: []

  # --- Disputes ---
  - method: POST
    path: "/authorizations/{authorizationId}/disputes"
    description: "Open a dispute traced from a wallet transaction to the card account"
    roles: [Cardholder, CustomerService]
    code: 201
    input: [amount_cents, reason]
    output: Dispute
    side_effects:
      - "card_account_id computed from the authorization's token"
      - "FRAUD: CardAccount OPEN -> RESTRICTED"

  - method: GET
    path: "/disputes/{disputeId}"
    description: "Get a dispute"
    roles: [Any]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/payment-tokens/{id}/disputes"
    description: "List disputes of a token"
    roles: [Any]
    code: 200
    input: []
    output: "Dispute[]"
    side_effects: []

  - method: POST
    path: "/disputes/{disputeId}/resolve-dispute"
    description: "Resolve a dispute WON or LOST"
    roles: [IssuerOperator]
    code: 200
    input: [outcome]
    output: Dispute
    side_effects: ["FRAUD resolution reopens the card account"]

  # --- Merchant programs / transit ---
  - method: POST
    path: "/merchant-programs"
    description: "Create a merchant program under an issuer"
    roles: [IssuerOperator, PlatformAdmin]
    code: 201
    input: ["issuer_id", "program_code", "merchant_name", "required_pan_last4", "max_auth_amount_cents", "active_sessions_required?"]
    output: MerchantProgram
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/merchant-programs/{programId}"
    description: "Get a merchant program"
    roles: [Any]
    code: 200
    input: []
    output: MerchantProgram
    side_effects: []

  - method: POST
    path: "/merchant-card-programs"
    description: "Enroll a card account in a merchant program"
    roles: [Cardholder, IssuerOperator]
    code: 201
    input: [merchant_program_id, card_account_id]
    output: MerchantCardProgram
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/card-accounts/{id}/merchant-enrollments"
    description: "List merchant program enrollments of a card"
    roles: [Any]
    code: 200
    input: []
    output: "MerchantCardProgram[]"
    side_effects: []

  - method: POST
    path: "/transit-operators"
    description: "Register a transit operator"
    roles: [PlatformAdmin]
    code: 201
    input: ["operator_code", "name", "flat_fare_cents", "express_cap_cents", "allowlist_active?"]
    output: TransitOperator
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/transit-operators/{operatorId}"
    description: "Get a transit operator"
    roles: [Any]
    code: 200
    input: []
    output: TransitOperator
    side_effects: []

  - method: POST
    path: "/transit-allowlist"
    description: "Add a card account to an operator's allowlist"
    roles: [IssuerOperator, PlatformAdmin]
    code: 201
    input: [transit_operator_id, card_account_id]
    output: TransitAllowlist
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/transit-operators/{id}/allowlist"
    description: "List allowlist entries of an operator"
    roles: [Any]
    code: 200
    input: []
    output: "TransitAllowlist[]"
    side_effects: []

  - method: GET
    path: "/payment-tokens/{id}/events"
    description: "List the token's audit events"
    roles: [Any]
    code: 200
    input: []
    output: "TokenEvent[]"
    side_effects: []


  # --- Filtered-list GETs for FK reverse-reachability ---
  - method: GET
    path: "/merchant-programs"
    description: "List merchant programs (filterable by issuer)"
    roles: [Any]
    code: 200
    input: ["issuer_id?", "status?"]
    output: "MerchantProgram[]"
    side_effects: []

  - method: GET
    path: "/merchant-card-programs"
    description: "List merchant program enrollments (filterable)"
    roles: [Any]
    code: 200
    input: ["merchant_program_id?", "card_account_id?", "status?"]
    output: "MerchantCardProgram[]"
    side_effects: []

  - method: GET
    path: "/provisioning-sessions"
    description: "List provisioning sessions (filterable)"
    roles: [Any]
    code: 200
    input: ["device_id?", "card_artifact_id?", "status?"]
    output: "ProvisioningSession[]"
    side_effects: []

  - method: GET
    path: "/payment-tokens"
    description: "List payment tokens (filterable)"
    roles: [Any]
    code: 200
    input: ["device_id?", "card_account_id?", "card_artifact_id?", "issuer_id?", "status?"]
    output: "PaymentToken[]"
    side_effects: []

  - method: GET
    path: "/authorizations"
    description: "List authorizations (filterable)"
    roles: [Any]
    code: 200
    input: ["payment_token_id?", "status?", "merchant_id?"]
    output: "Authorization[]"
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List disputes (filterable)"
    roles: [Any]
    code: 200
    input: ["payment_token_id?", "authorization_id?", "card_account_id?", "status?"]
    output: "Dispute[]"
    side_effects: []

  - method: GET
    path: "/transit-allowlist"
    description: "List transit allowlist entries (filterable)"
    roles: [Any]
    code: 200
    input: ["transit_operator_id?", "card_account_id?", "status?"]
    output: "TransitAllowlist[]"
    side_effects: []

  - method: GET
    path: "/token-events"
    description: "List token audit events (filterable)"
    roles: [Any]
    code: 200
    input: ["payment_token_id?", "event_type?"]
    output: "TokenEvent[]"
    side_effects: []

  - method: GET
    path: "/card-artifacts"
    description: "List card artifacts (filterable)"
    roles: [Any]
    code: 200
    input: ["card_account_id?", "status?"]
    output: "CardArtifact[]"
    side_effects: []


  - method: GET
    path: "/merchant-programs/{id}"
    description: "Get a merchant program (id-keyed, supports reverse lookup)"
    roles: [Any]
    code: 200
    input: []
    output: MerchantProgram
    side_effects: []

  - method: GET
    path: "/merchant-card-programs/{id}"
    description: "Get one merchant card enrollment"
    roles: [Any]
    code: 200
    input: []
    output: MerchantCardProgram
    side_effects: []

  - method: GET
    path: "/merchant-programs/{id}/enrollments"
    description: "List enrollments under a merchant program"
    roles: [Any]
    code: 200
    input: []
    output: "MerchantCardProgram[]"
    side_effects: []

  - method: GET
    path: "/transit-allowlist/{id}"
    description: "Get one allowlist entry"
    roles: [Any]
    code: 200
    input: []
    output: TransitAllowlist
    side_effects: []

  - method: GET
    path: "/card-accounts/{id}/transit-allowlist"
    description: "List allowlist entries for a card account"
    roles: [Any]
    code: 200
    input: []
    output: "TransitAllowlist[]"
    side_effects: []

  # --- Test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock; an unset clock is the fixed earliest instant."
    roles: [Any]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Payload schema violation: missing required field, invalid enum, negative integer" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource lookup failure" }
  - { id: ERR_ISSUER_NOT_FOUND, http: 404, condition: "Issuer id does not exist" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "Device id does not exist" }
  - { id: ERR_TOKEN_NOT_FOUND, http: 404, condition: "PaymentToken id does not exist" }
  - { id: ERR_CARD_ACCOUNT_NOT_FOUND, http: 404, condition: "CardAccount id does not exist" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "Authorization id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "IssuerAgreement id does not exist" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "MerchantProgram id does not exist" }
  - { id: ERR_OPERATOR_NOT_FOUND, http: 404, condition: "TransitOperator id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in a state that forbids the requested transition" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Transition not defined from the current state (state machine rejection)" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "Idempotency key reused with a different payload" }
  - { id: ERR_VERSION_CONFLICT, http: 412, condition: "OCC stale expected_*_version" }
  - { id: ERR_DEVICE_UNSECURED, http: 409, condition: "Device passcode disabled where required" }
  - { id: ERR_DEVICE_LOST, http: 409, condition: "Device reported lost blocks the operation" }
  - { id: ERR_TOKEN_NOT_ACTIVE, http: 409, condition: "Token not ACTIVE for authorization/default" }
  - { id: ERR_CARD_ACCOUNT_RESTRICTED, http: 409, condition: "Card account not OPEN (RESTRICTED/REISSUED/CLOSED) for the operation" }
  - { id: ERR_CARD_HAS_OPEN_DISPUTES, http: 409, condition: "Close blocked while OPEN disputes exist on the account" }
  - { id: ERR_PROVISIONING_SESSION_EXPIRED, http: 409, condition: "Logical clock reached session expires_at" }
  - { id: ERR_OTP_MISMATCH, http: 409, condition: "Verification code does not match the issued challenge; third consecutive mismatch fails the session" }
  - { id: ERR_ISSUER_NOT_ACTIVE, http: 409, condition: "Issuer not ACTIVE (or OFFBOARDED) where ACTIVE participation is required" }
  - { id: ERR_AGREEMENT_REQUIRED, http: 409, condition: "Issuer activation requires at least one ACTIVE agreement" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "An ACTIVE agreement already exists for this issuer" }
  - { id: ERR_TERMS_VALIDATION_FAILED, http: 422, condition: "Agreement terms invalid (fees negative, cap < floor, branding missing)" }
  - { id: ERR_AUTHENTICATION_REQUIRED, http: 422, condition: "Biometric/passcode gate failed on authorization" }
  - { id: ERR_AUTH_AMOUNT_EXCEEDS_CAP, http: 422, condition: "amount_cents > per_auth_cap_cents (100000)" }
  - { id: ERR_PROGRAM_AMOUNT_EXCEEDS_CAP, http: 422, condition: "Authorization exceeds enrolled merchant program cap" }
  - { id: ERR_EXPRESS_TRANSIT_NOT_SUPPORTED, http: 422, condition: "Express mode requested but not permitted" }
  - { id: ERR_TRANSIT_NOT_ALLOWED, http: 422, condition: "Card not on the operator's allowlist (or operator SUSPENDED)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Merchant program not ACTIVE for enrollment" }
  - { id: ERR_PROGRAM_INELIGIBLE, http: 409, condition: "Card fails program eligibility (artifact prefix or session state rule)" }
  - { id: ERR_DISPUTE_AMOUNT_MISMATCH, http: 409, condition: "Disputed amount differs from the authorization amount" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Wallet platform operator: manages issuers, agreements, transit operators"
    identity: opaque
    exclusive_operations:
      - "POST /issuers, POST /issuers/{id}/activate|suspend|offboard"
      - "POST /issuer-agreements, activate, supersede, terminate"
      - "POST /transit-operators"
    shared_operations:
      - "POST /card-accounts, POST /merchant-programs, POST /transit-allowlist"
      - "GET fee-projection, GET risk"
  - name: IssuerOperator
    description: "Issuer-side operator: manages card accounts, artifacts, reissues, authorizations, dispute resolution"
    identity: opaque
    exclusive_operations:
      - "POST /card-artifacts and artifact suspend/resume/deactivate"
      - "POST /card-accounts/{id}/reissue, close"
      - "POST /payment-tokens/{id}/authorizations"
      - "POST /disputes/{id}/resolve-dispute"
    shared_operations:
      - "POST /card-accounts, POST /merchant-programs, POST /transit-allowlist, POST /merchant-card-programs"
      - "POST /devices/{id}/report_lost"
      - "GET fee-projection, GET risk"
  - name: Cardholder
    description: "End user: owns devices, provisions cards, suspends/resumes/deactivates tokens, opens disputes"
    identity: entity_backed:Cardholder
    exclusive_operations:
      - "POST /devices, POST /devices/{id}/set-security"
      - "POST /devices/{id}/provisioning-sessions, verify, tokenize"
      - "POST /devices/{id}/tokens/{tokenId}/suspend|resume|deactivate"
      - "POST /devices/{id}/default-card"
    shared_operations:
      - "POST /devices/{id}/report_lost, report_found"
      - "POST /authorizations/{id}/disputes, POST /merchant-card-programs"
  - name: CustomerService
    description: "Support desk: read-only plus device-lost reporting and dispute intake"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /devices/{id}/report_lost, report_found"
      - "POST /authorizations/{id}/disputes"
      - "GET fee-projection, GET risk"
  - name: Any
    description: "Any authenticated caller (or unauthenticated for cardholder registration and clock set)"
    identity: opaque
    shared_operations:
      - "All GET endpoints"
      - "POST /cardholders"
      - "POST /_clock/set_current_utc"
