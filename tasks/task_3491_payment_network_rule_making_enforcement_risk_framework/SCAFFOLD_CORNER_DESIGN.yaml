          - state_machines.ComplianceAttestation.OVERDUE_to_SUBMITTED
        distinguishing_aspect: "OVERDUE is derived lazily: the attestation for period_year 2025 (due 2026-03-01) still reads PENDING while the clock is 2026-01-15, flips to OVERDUE on a read at 2026-03-02, and a submission from OVERDUE succeeds with late_submission == true."
        test_recipe:
          setup: ["P1 ACTIVE; attestation for period_year 2025 created 2026-01-15 (due_date 2026-03-01)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T09:00:00Z" }
