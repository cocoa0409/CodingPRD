          - state_machines.DemandOpportunity.staffing_status.INTERNAL_STAFFING_to_PARTIALLY_COVERED
          - state_machines.DemandOpportunity.staffing_status.PARTIALLY_COVERED_to_COVERED
          - calculations.opportunity_coverage
          - entities.DemandOpportunity.fields.pipeline_status
          - entities.DemandOpportunity.fields.staffing_status
        distinguishing_aspect: |
          The non-linearity here is PARALLEL dimensions on DemandOpportunity: three writes move
          staffing_status UNSTAFFED -> INTERNAL_STAFFING -> PARTIALLY_COVERED -> COVERED while
