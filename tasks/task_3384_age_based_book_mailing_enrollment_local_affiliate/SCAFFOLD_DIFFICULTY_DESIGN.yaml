              payload: { mailing_month: "2026-12", age_band: "TODDLER", title_id: "${t_tod}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_id: $.data.id }
            - call: "POST /library/selections/${sel_id}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
          trigger:
            - call: "POST /library/selections/${sel_id}/reopen"
              payload: { reason: "committee wants a different title" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - call: "POST /library/selections/${sel_id}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-cid"
          assert:
            - "after reopen: AgeBandSelection.${sel_id}.status == PROPOSED and approved_by is null"
            - "after second approve: status == APPROVED and approved_by == \"acm-cid\""
            - "proposed_by == \"acm-ada\" is unchanged across the cycle"

  # ===========================================================================
  - rule_id: transitive_cascade
