            - "UtilityConflict.${cb}.status stays RESOLUTION_SELECTED and its version is unchanged"
            - "Project.${p1}.open_conflict_count stays 2"
            - "after POST /uro/conflicts/${ca}/certify-cleared succeeds, the identical call on ${cb} returns 200 with status CLEARED and open_conflict_count 0"
            - "GET /uro/conflicts filtered by depends_on_conflict_id ${ca} returns exactly the one row ${cb}"

      - name: a_new_plan_cannot_supersede_a_plan_whose_agreement_is_already_executed
