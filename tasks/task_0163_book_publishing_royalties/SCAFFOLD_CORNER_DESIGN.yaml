  # ===================================================================
  # RBAC — peer-role denial and ownership scoping
  # ===================================================================
  - section: rbac
    instances:
      - name: author_cannot_create_contract
        claim_type: unauthorized_operation
        grounds: ["roles.Author", "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "An Author role calling POST /contracts (a Publisher-exclusive op) is denied 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["An author A exists (acts as Author role with X-User-ID = A.id)."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "Self Author", email: "selfauthor@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Author
              as_user_id: "${author_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_UNAUTHORIZED"

      - name: agent_cannot_read_unrepresented_contract
        claim_type: ownership_scoping
        grounds: ["roles.Agent", "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "An Agent whose id is not the contract's agent_id is denied 403 ERR_UNAUTHORIZED on GET /contracts/{id} (entity_backed ownership scope)."
        test_recipe:
          setup: ["A contract represented by agent G1; a second agent G2 not on this contract."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "Own Auth", email: "ownauth@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /agents"
              payload: { agency_name: "G One", email: "gone@x.com" }
              as: Publisher
              captures: { g1_id: $.data.id }
            - call: "POST /agents"
              payload: { agency_name: "G Two", email: "gtwo@x.com" }
              as: Publisher
              captures: { g2_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", agent_id: "${g1_id}", advance_cents: 0, agent_commission_pct: 0.10 }
              as: Publisher
              captures: { contract_id: $.data.id }
          trigger:
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Agent
              as_user_id: "${g2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_UNAUTHORIZED"

      - name: missing_headers_unauthenticated
        claim_type: unauthorized_operation
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown X-User-Role is rejected 401 ERR_UNAUTHENTICATED before any business logic."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /contracts"
              payload: {}
              as: Stranger
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

