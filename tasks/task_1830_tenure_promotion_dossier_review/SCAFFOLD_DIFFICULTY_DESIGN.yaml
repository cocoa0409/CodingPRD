            - { call: "POST /api/cases", payload: { candidate_id: "${cand_b}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY", waiver_signed: true }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_b: $.data.id, case_b_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_b}", category: "TEACHING", title: "T1", page_count: 10, expected_case_version: "${case_b_v}" }, as: Candidate, as_user_id: "${cand_b}", captures: { b_t1: $.data.id } }
