      - name: license_amendment_round_trips_executed_to_amendment_pending_and_back_twice
        grounds:
          - state_machines.LicenseAgreement.EXECUTED_to_AMENDMENT_PENDING
          - state_machines.LicenseAgreement.AMENDMENT_PENDING_to_EXECUTED
          - entities.LicenseAgreement.fields.amendment_round
          - validations[priority=88]
        distinguishing_aspect: |
          The LicenseAgreement graph is cyclic: EXECUTED -> AMENDMENT_PENDING -> EXECUTED is
          traversed twice, so the terminal status is the same EXECUTED it started from while
          amendment_round has advanced 0 -> 1 -> 2 and the row version has advanced four
          times. A DAG reading of the machine would forbid the second entry into
          AMENDMENT_PENDING.
