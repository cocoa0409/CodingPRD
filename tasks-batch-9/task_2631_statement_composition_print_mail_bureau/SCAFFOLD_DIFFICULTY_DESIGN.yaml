            - call: "POST /bureau/clients/${sl_client_id}/postage-deposits"
              payload: { amount_cents: 100000, reference: "WIRE-SL-01" }
              as: PostageController
              captures: { sl_client_v: "$.data.version" }
            - call: "POST /bureau/presort-batches/${sl_batch_id}/seal"
              payload: { expected_client_version: "${sl_client_v}" }
              as: PostageController
              as_user_id: "postage-1"
            - call: "POST /bureau/presort-batches/${sl_batch_id}/manifest"
              payload: { entry_facility_id: "${sl_facility_id}", induction_window_start: "2026-08-06T13:00:00Z", induction_window_end: "2026-08-06T13:30:00Z" }
              as: PostageController
              as_user_id: "postage-2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T14:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "GET /bureau/composition-jobs/${sl_job_id}"
              payload: {}
              as: ProductionScheduler
              captures: { sl_projected: "$.data.projected_penalty_cents", sl_hold: "$.data.sla_hold_minutes" }
            - call: "POST /bureau/composition-jobs/${sl_job_id}/close"
              payload: {}
              as: BureauAdmin
              as_user_id: "admin-1"
              captures: { sl_assessed: "$.data.assessed_penalty_cents" }
          assert:
            - "CompositionJob.${sl_job_id}.sla_due_at == 2026-08-05T08:00:00Z (DataFile.accepted_at 2026-08-01T08:00:00Z + 96 hours)"
            - "CompositionJob.${sl_job_id}.projected_completion_at == 2026-08-06T12:00:00Z (run.window_end 2026-08-06T10:00:00Z + FULFILMENT_LAG_MINUTES 120)"
            - "CompositionJob.${sl_job_id}.projected_penalty_cents == 70000 (1680 late minutes -> 28 whole hours * 2500 * 10000/10000)"
            - "CompositionJob.${sl_job_id}.sla_hold_minutes == 60 (integrity_held_since 2026-08-06T11:00:00Z to the reprint at 2026-08-06T12:00:00Z)"
            - "CompositionJob.${sl_job_id}.sla_completed_at == 2026-08-06T14:00:00Z"
            - "CompositionJob.${sl_job_id}.assessed_penalty_cents == 72500 (1800 elapsed minutes - 60 hold = 1740 -> 29 whole hours * 2500)"
            - "assessed_penalty_cents != projected_penalty_cents (72500 != 70000): the two variants diverge on the same job"
            - "An assessed figure that ignored sla_hold_minutes would read 75000, so the hold credit is observable"
            - "CompositionJob.${sl_job_id}.total_sheet_count == 2 and billing_total_cents == 18: the VOID original stays billable and the replacement is not, so the invoice is unchanged by the reprint"
            - "CompositionJob.${sl_job_id}.status == CLOSED and accountable_piece_count == 2 and void_piece_count == 1 and reprint_piece_count == 1"

  - rule_id: combinatorial_formula
    instances:

      - name: manifested_postage_rounds_per_piece_before_summing
        grounds:
          - calculations.postage_cost
          - entities.EntryFacility.fields.discount_bp_first_class
          - entities.MailPiece.fields.sheet_count
          - state_machines.PresortBatch.SEALED_to_MANIFESTED
        distinguishing_aspect: |
          Mode (b) — nested rounding order: gross(piece) is itself a three-input composite
          (base_rate table lookup on mail_class x presort_bucket, plus max(0, sheet_count - 3)
          x 3 surcharge) and round_half_up must be applied once PER PIECE after the 850 bp discount
          and only then summed, yielding 114; rounding the summed batch gross once yields 113, an
          error in the opposite direction from any per-piece truncation.
        test_recipe:
          setup:
            - "Client CL-MB with dr_readiness_required false; ACTIVE template T-MB: FIRST_CLASS, sheets_per_document 3, no inserts."
            - "Two records with postal_code 10001 and 94105 — both fully hygienic, so neither is screened out, but no five-digit, three-digit or first-digit group reaches its minimum, so both land in MIXED_AADC."
            - "One batch (FIRST_CLASS, MIXED_AADC), piece_count 2, tray_count 1, each piece sheet_count 3 so the sheet surcharge is exactly 0."
            - "EntryFacility EF-MB with discount_bp_first_class 850. Escrow funded with 100000 cents."
            - "Job driven to VERIFIED and both pieces INDUCTED before the seal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-MB", name: "Midbrook Card Services", dr_readiness_required: false }
              as: BureauAdmin
              captures: { mb_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
