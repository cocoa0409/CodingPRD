# =============================================================================
# Task 1140: eConsult & Specialist Curbside Program — §1.9 Corner Design
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Sections follow references/claim-extraction-guide.md. Error-expecting
# triggers capture $.data.error_id (negative-test convention).
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_specialty_track_persists_config
        claim_type: creation
        grounds: [entities.SpecialtyTrack]
        distinguishing_aspect: "POST with all required config fields returns 201 and every field echoes back; version starts at 1 and created_at equals the logical clock."
        test_recipe:
          setup: ["clock at 2026-06-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { t_id: $.data.id, t_ver: $.data.version, t_created: $.data.created_at } }
          assert:
            - "SpecialtyTrack.${t_id}.version == 1 and created_at == 2026-06-01T00:00:00Z (logical clock, not wall clock)"
            - "base_response_fee_cents == 10000 and specialty_code == CARDIOLOGY echoed in response"

      - name: create_consult_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ConsultRequest.fields.question_text, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting question_text (a source:input field with no default) yields 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup: ["track CARDIOLOGY exists; provider registered"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000001001" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-E1", specialty_track_id: "${track_id}", icd10_primary: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"
            - "no ConsultRequest row is persisted for patient_ref PAT-E1 (GET /econsult/consult-requests?referring_provider_id returns empty array)"

      - name: membership_created_with_computed_defaults
        claim_type: defaults
        grounds: [entities.PanelMembership.fields.quality_score_bps, entities.PanelMembership.fields.standing]
        distinguishing_aspect: "A new membership starts GOOD_STANDING with quality_score_bps 8500, all counters 0, balances 0, is_accepting true — no input may preset them."
        test_recipe:
          setup: ["track + specialist registered"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000001001" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { m_standing: $.data.standing, m_score: $.data.quality_score_bps, m_open: $.data.open_consult_count, m_prov: $.data.provisional_balance_cents, m_posted: $.data.posted_balance_cents, m_rebukes: $.data.rebuke_count, m_accepting: $.data.is_accepting } }
          assert:
            - "standing == GOOD_STANDING, quality_score_bps == 8500"
            - "open_consult_count == 0, provisional_balance_cents == 0, posted_balance_cents == 0, rebuke_count == 0"
            - "is_accepting == true (default)"

      - name: clarification_message_is_append_only_without_version
        claim_type: immutability
        grounds: [entities.ClarificationMessage]
        distinguishing_aspect: "ClarificationMessage declares common_fields: false — its representation carries id and created_at but no version and no updated_at; there is no update endpoint."
        test_recipe:
          setup: ["assigned consult"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000001002" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000001002" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-E2", specialty_track_id: "${track_id}", question_text: "Beta blocker choice in patient with reactive airway disease and new hypertension diagnosis.", icd10_primary: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/clarifications", payload: { body: "Which comorbidities should I assume beyond the listed asthma?" }, as: Specialist, as_user_id: "${spec_id}", captures: { msg_id: $.data.id, msg_seq: $.data.sequence_no, msg_author: $.data.author_role } }
          assert:
            - "ClarificationMessage.${msg_id} has keys id, created_at, consult_id, author_role, body, sequence_no — and NO version / updated_at keys"
            - "sequence_no == 1 and author_role == SPECIALIST"

      - name: consult_on_empty_pool_initial_state_queued
        claim_type: creation
        grounds: [state_machines.ConsultRequest.SUBMITTED_to_QUEUED, calculations.routing_selection, entities.RoutingDecision.fields.outcome]
        distinguishing_aspect: "When the selector's eligible pool is empty, the created consult lands in QUEUED (not ASSIGNED), both assigned_* fields stay null, and a RoutingDecision(outcome QUEUED, candidate_count 0) is appended — the empty-pool fallback is observable."
        test_recipe:
          setup: ["track with NO panel memberships"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: NEUROLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000001003" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-E3", specialty_track_id: "${track_id}", question_text: "New absence seizures in teenager; asks about ethosuximide start and EEG urgency.", icd10_primary: "G40", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id, c_status: $.data.status, c_spec: $.data.assigned_specialist_id, c_memb: $.data.assigned_membership_id, c_billing: $.data.billing_status } }
            - { call: "GET /econsult/consult-requests/${cons_id}/routing-decisions", as: ProgramCoordinator, captures: { rd_outcome: "$.data[0].outcome", rd_candidates: "$.data[0].candidate_count", rd_selected: "$.data[0].selected_membership_id" } }
          assert:
            - "consult status == QUEUED; assigned_specialist_id == null; assigned_membership_id == null; billing_status == UNBILLABLE"
            - "exactly one RoutingDecision exists for the consult with outcome == QUEUED, candidate_count == 0, selected_membership_id == null"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: close_from_assigned_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ConsultRequest.ANSWERED_to_CLOSED, "errors[ERR_CONSULT_NOT_ANSWERED]"]
        distinguishing_aspect: "close is only declared from ANSWERED; from ASSIGNED it MUST fail with ERR_CONSULT_NOT_ANSWERED and leave status untouched."
        test_recipe:
          setup: ["assigned consult, no response"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000002001" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000002001" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-S1", specialty_track_id: "${track_id}", question_text: "Stable chest pain on therapy; asks whether any medication adjustment is warranted now.", icd10_primary: "I20", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/close", as: ReferringProvider, as_user_id: "${prov_id}", captures: { err_id: $.data.error_id } }
            - { call: "GET /econsult/consult-requests/${cons_id}", as: ProgramCoordinator, captures: { st: $.data.status } }
          assert:
            - "error_id == ERR_CONSULT_NOT_ANSWERED (409)"
            - "consult status remains ASSIGNED after the failed close"

      - name: respond_after_cancel_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.ConsultRequest, "errors[ERR_CONSULT_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is terminal: a response submission against a cancelled consult MUST fail with ERR_CONSULT_ALREADY_TERMINAL and create no ConsultResponse."
        test_recipe:
          setup: ["consult created then cancelled by its provider"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000002002" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000002002" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-S2", specialty_track_id: "${track_id}", question_text: "Palpitations, holter pending; asks if caffeine restriction alone is reasonable interim.", icd10_primary: "R00", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/cancel", as: ReferringProvider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_IN_PRIMARY_CARE", recommendation_text: "Caffeine restriction and electrolytes are reasonable; await holter before further changes." }, as: Specialist, as_user_id: "${spec_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_CONSULT_ALREADY_TERMINAL (409)"
            - "GET /econsult/consult-requests/${cons_id}/responses returns an empty array"

      - name: cancel_after_answer_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ConsultRequest, "errors[ERR_CONSULT_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Cancel is declared only pre-answer; from ANSWERED it MUST fail with ERR_CONSULT_ALREADY_TERMINAL and the response stays SUBMITTED."
        test_recipe:
          setup: ["consult answered on time"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000002003" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000002003" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-S3", specialty_track_id: "${track_id}", question_text: "Hypertension with ankle swelling on amlodipine; asks about switching class versus dose split.", icd10_primary: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_IN_PRIMARY_CARE", recommendation_text: "Switch to losartan 50mg daily; expect swelling resolution over 2 to 4 weeks." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/cancel", as: ReferringProvider, as_user_id: "${prov_id}", captures: { err_id: $.data.error_id } }
            - { call: "GET /econsult/consult-responses/${resp_id}", as: ProgramCoordinator, captures: { r_status: $.data.status } }
          assert:
            - "error_id == ERR_CONSULT_ALREADY_TERMINAL (409)"
            - "response status remains SUBMITTED; consult status remains ANSWERED"

      - name: clarification_cycle_sequences_messages
        claim_type: valid_transition
        grounds: [state_machines.ConsultRequest.ASSIGNED_to_CLARIFICATION_REQUESTED, state_machines.ConsultRequest.CLARIFICATION_REQUESTED_to_ASSIGNED, entities.ClarificationMessage.fields.sequence_no]
        distinguishing_aspect: "The ASSIGNED -> CLARIFICATION_REQUESTED -> ASSIGNED cycle stamps sequence_no 1 then 2 with author roles SPECIALIST then REFERRING_PROVIDER, increments clarification_rounds once, and posts a provisional CLARIFICATION_FEE of 2500 cents on the provider reply."
        test_recipe:
          setup: ["assigned consult"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000002004" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000002004" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-S4", specialty_track_id: "${track_id}", question_text: "Statin intolerance with CK elevation history; asks about ezetimibe monotherapy for LDL goal.", icd10_primary: "E78", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/clarifications", payload: { body: "What was the peak CK and which statin at what dose?" }, as: Specialist, as_user_id: "${spec_id}", captures: { m1_seq: $.data.sequence_no, m1_author: $.data.author_role } }
            - { call: "GET /econsult/consult-requests/${cons_id}", as: ProgramCoordinator, captures: { st_mid: $.data.status, rounds_mid: $.data.clarification_rounds } }
            - { call: "POST /econsult/consult-requests/${cons_id}/clarifications", payload: { body: "Peak CK 1200 on atorvastatin 40mg, resolved on discontinuation." }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { m2_seq: $.data.sequence_no, m2_author: $.data.author_role } }
            - { call: "GET /econsult/consult-requests/${cons_id}", as: ProgramCoordinator, captures: { st_end: $.data.status } }
            - { call: "GET /econsult/panel-memberships/${memb_id}/compensation-summary", as: ProgramCoordinator, captures: { prov_now: $.data.provisional_balance_cents } }
          assert:
            - "first message: sequence_no == 1, author_role == SPECIALIST; consult status becomes CLARIFICATION_REQUESTED with clarification_rounds == 1"
            - "second message: sequence_no == 2, author_role == REFERRING_PROVIDER; consult status returns to ASSIGNED (cycle)"
            - "membership provisional_balance_cents == 2500 (one provisional CLARIFICATION_FEE entry for the answered round)"

      - name: third_clarification_request_returns_max_rounds
        claim_type: precondition_enforcement
        grounds: [state_machines.ConsultRequest.ASSIGNED_to_CLARIFICATION_REQUESTED, "errors[ERR_MAX_CLARIFICATION_ROUNDS_REACHED]"]
        distinguishing_aspect: "Boundary at MAX_CLARIFICATION_ROUNDS == 2: after two full clarification cycles the third specialist request MUST fail with ERR_MAX_CLARIFICATION_ROUNDS_REACHED and clarification_rounds stays 2."
        test_recipe:
          setup: ["assigned consult with two completed clarification cycles"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000002005" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000002005" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-S5", specialty_track_id: "${track_id}", question_text: "Resistant hypertension on three agents; asks about spironolactone addition and potassium monitoring.", icd10_primary: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/clarifications", payload: { body: "Current doses and latest potassium and creatinine?" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests/${cons_id}/clarifications", payload: { body: "Amlodipine 10, lisinopril 40, HCTZ 25; K 4.1, Cr 1.0 last week." }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-requests/${cons_id}/clarifications", payload: { body: "Any history of hyperkalemia or eGFR below 45?" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests/${cons_id}/clarifications", payload: { body: "No hyperkalemia; eGFR 78. Home BP log attached to chart." }, as: ReferringProvider, as_user_id: "${prov_id}" }
          trigger:
