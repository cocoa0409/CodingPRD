  - section: complexity_layers
    instances:
      - name: result_report_optimistic_concurrency_rejects_every_stale_expected_match_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[result-report-stale-match]
          - endpoints[POST /matches/{matchId}/result-reports]
          - validations[priority=11]
          - errors[ERR_STALE_VERSION]
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          The §1.2.1 rule on Match, exercised across the whole life of one match: the
          version a reporter holds goes stale because of a write they did not make
          (server-config), because of their own accepted report, and because of the
          opponent's report. Every stale attempt is 412 and writes nothing; every correct
          version is accepted and bumps Match.version by exactly one. The last probe puts
          the match in a state that would independently refuse the report and shows 412
          still wins, which is the declared priority-11-before-priority-17 ordering.
        test_recipe:
          setup:
            - "One district, one school, one CERTIFIED coach, an APPROVED title approval and one season advanced to REGULAR_SEASON with two COMPETING teams (the same coach owns both)"
            - "One match is created and given a server configuration, so Match.version has already moved twice before any report"
          setup_api_calls:
