            - call: "POST /cpa/brand-audits"
              payload: { base_id: "${base}", audit_scope: "UNIFORM", findings_count: 2, severity: "MINOR" }
              as: BrandAuditor
              captures: { a1: $.data.id }
            - call: "POST /cpa/brand-audits/${a1}/remediation"
              payload: { to_remediation_status: "IN_PROGRESS" }
              as: RegionalOpsController
          trigger:
            - call: "POST /cpa/brand-audits/${a1}/remediation"
              payload: { to_remediation_status: "VERIFIED" }
              as: RegionalOpsController
            - call: "POST /cpa/brand-audits/${a1}/remediation"
              payload: { to_remediation_status: "VERIFIED", evidence_ref: "EV-4501" }
              as: RegionalOpsController
          assert:
            - "The evidence-less call returns HTTP 422 with data.error_id == \"ERR_EVIDENCE_REQUIRED\"; BrandAudit.${a1}.remediation_status is still \"IN_PROGRESS\" and evidence_ref is still null"
            - "The second call returns HTTP 200 with data.remediation_status == \"VERIFIED\" and data.evidence_ref == \"EV-4501\""
            - "BrandAudit.${a1}.finding_status == \"OPEN\" throughout — the remediation dimension moved alone"

      - name: role_check_precedes_not_found_on_invoice_void
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_INVOICE_NOT_FOUND]
        distinguishing_aspect: "Both a role violation and a missing path id are present; the 403 at priority 2 must win over the 404 at priority 3, so the response leaks nothing about whether the invoice exists."
        test_recipe:
          setup:
            - "An ACTIVE agreement exists; no invoice with the probed id exists."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
          trigger:
            - call: "POST /cpa/invoices/00000000-0000-4000-8000-0000000004ff/void"
              payload: {}
              as: MainlineScheduler
          assert:
            - "HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\" — not ERR_INVOICE_NOT_FOUND"
            - "The same request as CPAAdministrator returns HTTP 404 with data.error_id == \"ERR_INVOICE_NOT_FOUND\", proving the id really is unknown"
            - "GET /cpa/invoices returns data == [] and total_count == 0"

      - name: state_error_outranks_fiscal_error_on_final_invoice
        claim_type: priority_conflict
        grounds:
          - validations[priority=20]
          - validations[priority=74]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / final_invoice_on_open_cycle_state_beats_fiscal
          rationale: "That §1.8 instance violates both rules in one request and then repairs only the state violation to expose the fiscal error underneath."

      - name: safety_error_outranks_referential_error_on_leg_creation
        claim_type: priority_conflict
        grounds:
          - validations[priority=30]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / grounded_cross_agreement_tail_safety_beats_referential
          rationale: "That §1.8 instance uses a different error-category pair (business_safety over business_referential) on a single leg request and then repairs the safety violation."

      - name: turn_buffer_creates_future_conflict
        claim_type: temporal_validation
        grounds:
          - validations[priority=52]
          - errors[ERR_AIRCRAFT_TURN_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / aircraft_turn_buffer_pairwise_thirty_five_minutes
          rationale: "That §1.8 instance asserts the inclusive 35-minute buffer at exactly 35 and 34 minutes on both sides of an existing leg."

      - name: rolling_duty_cap_is_an_aggregate_check
        claim_type: aggregate_validation
        grounds:
          - validations[priority=54]
          - errors[ERR_PILOT_DUTY_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pilot_rolling_duty_cap_aggregate_sixteen_hours
          rationale: "That §1.8 instance builds a legal 16.000-hour window and then exceeds it by 0.001 with non-adjacent legs, which no single-leg check would catch."

      - name: passthrough_terminality_check_runs_after_state_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=74]
          - errors[ERR_PASSTHROUGH_UNRECONCILED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / invoice_issue_gated_on_passthrough_claim_terminality
          rationale: "That §1.8 instance shows issue-final blocked while a pass-through is non-terminal and then succeeding once it is reconciled."

  # ===========================================================================
  # Guide section 5 — Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_advance_past_term_end_expires_agreement
        claim_type: conditional action
        grounds:
          - endpoints[POST /cpa/_clock/set_current_utc]
          - state_machines.Agreement.ACTIVE_to_EXPIRED
          - entities.Agreement.fields.term_end_date
        distinguishing_aspect: "The sweep is conditional on both status and date: an ACTIVE agreement whose term_end_date is passed expires, while a DRAFT agreement with the same term_end_date is left alone, and a clock move that stops short of the date changes nothing."
        test_recipe:
          setup:
            - "One ACTIVE agreement with term_end_date 2026-09-30 and one DRAFT agreement with the same term_end_date."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2026-09-30" }
              as: CPAAdministrator
              captures: { ag1: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag1}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base1: $.data.id }
            - call: "POST /cpa/agreements/${ag1}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Beacon Airways", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 180000.00, block_hour_rate_usd: 1310.00, departure_rate_usd: 295.00, aircraft_ownership_fee_usd: 54000.00, incentive_pool_cap_usd: 60000.00, penalty_cap_usd: 80000.00, term_end_date: "2026-09-30" }
              as: CPAAdministrator
              captures: { ag2: $.data.id }
          trigger:
            - call: "POST /cpa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T23:59:00Z" }
              as: CPAAdministrator
            - call: "POST /cpa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CPAAdministrator
          assert:
            - "Both clock calls return HTTP 200"
            - "After the 2026-09-30 move: Agreement.${ag1}.status == \"ACTIVE\" — the date must be strictly greater than term_end_date"
            - "After the 2026-10-01 move: Agreement.${ag1}.status == \"EXPIRED\" and CrewBase.${base1}.lifecycle_status == \"ACTIVE\" — expiry is not the termination cascade"
            - "Agreement.${ag2}.status == \"DRAFT\" — only ACTIVE agreements are swept"
            - "A later POST /cpa/schedule-cycles for ${ag1} returns HTTP 409 with data.error_id == \"ERR_AGREEMENT_NOT_ACTIVE\""

      - name: scorecard_recompute_refreshes_metrics_and_counter
        claim_type: computed_read
        grounds:
          - endpoints[POST /cpa/scorecards/{scorecardId}/recompute]
          - calculations.completion_factor
          - entities.Scorecard.fields.recompute_count
        distinguishing_aspect: "Recompute reads the live cycle ledger rather than replaying the close: after one cancellation is finalized as UNCONTROLLABLE the same scorecard flips from a capped penalty to a capped incentive, and recompute_count is the only system field that moves."
        test_recipe:
          setup:
            - "ACTIVE agreement, one base, one LINE_QUALIFIED captain, one REGIONAL_OWNED IN_SERVICE tail."
            - "CLOSED cycle 2026-09 with published_departures 4: three COMPLETED legs (1.000 actual each, on time, 100 bags each, 0 mishandled) and one CANCELLED leg."
            - "The close produced a PUBLISHED scorecard with completion_factor_pct 75.00."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
