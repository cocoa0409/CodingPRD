  - rule_id: boundary_precision_check
    instances:

      - name: seminar_credit_ratio_exact_threshold
        grounds:
          - calculations.seminar_attendance_credit
          - entities.SeminarAttendance.fields.credit_ratio
          - entities.SeminarAttendance.fields.credited
          - entities.SeminarSession.fields.credited_attendance_count
        distinguishing_aspect: |
          METRIC credit_ratio at the CREDIT_RATIO_THRESHOLD 0.75 boundary, probed through
          the endpoint POST /seminar-attendances: a LATE attendance of 100 minutes on a 120
          minute session yields exactly 0.7500 after the 10 minute late penalty and IS
          credited (>= not >), while 99 minutes yields 0.7417 after rounding to 4 decimal
          places and is NOT credited - a one minute input difference flips the outcome.
        test_recipe:
          setup:
            - "One open Site and one Cohort in region NORTH."
            - "Two NoviceTeachers, A and B, enrolled in that cohort."
            - "One seminar session 2026-08-03T14:00Z-16:00Z with scheduled_minutes 120, marked HELD after the clock is moved to 2026-08-03T18:00:00Z."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_a_id: $.data.id }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Eli Navarro", subject_area: "SCIENCE", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_b_id: $.data.id }
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 1, topic: "Classroom routines seminar", scheduled_start: "2026-08-03T14:00:00Z", scheduled_end: "2026-08-03T16:00:00Z" }
              as: ProgramAdmin
              captures: { ss1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T18:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seminar-sessions/${ss1_id}/status"
              payload: { status: "HELD" }
              as: ProgramAdmin
          trigger:
            - call: "POST /seminar-attendances"
              payload: { session_id: "${ss1_id}", novice_id: "${novice_a_id}", attendance_status: "LATE", minutes_attended: 100 }
              as: SiteInductionLead
              as_user_id: "${site_id}"
              captures: { att_a_id: $.data.id }
            - call: "POST /seminar-attendances"
              payload: { session_id: "${ss1_id}", novice_id: "${novice_b_id}", attendance_status: "LATE", minutes_attended: 99 }
              as: SiteInductionLead
              as_user_id: "${site_id}"
              captures: { att_b_id: $.data.id }
          assert:
            - "SeminarAttendance.${att_a_id}.credit_ratio == 0.7500"
            - "SeminarAttendance.${att_a_id}.credited == true"
            - "SeminarAttendance.${att_b_id}.credit_ratio == 0.7417"
            - "SeminarAttendance.${att_b_id}.credited == false"
            - "NoviceTeacher.${novice_a_id}.credited_seminar_sessions == 1"
            - "NoviceTeacher.${novice_b_id}.credited_seminar_sessions == 0"
            - "SeminarSession.${ss1_id}.credited_attendance_count == 1"
            - "NoviceTeacher.${novice_a_id}.readiness_index_live == 25.00"
            - "NoviceTeacher.${novice_b_id}.readiness_index_live == 0.00"

