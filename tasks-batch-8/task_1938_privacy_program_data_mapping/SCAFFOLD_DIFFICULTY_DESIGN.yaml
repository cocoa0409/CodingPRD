              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
