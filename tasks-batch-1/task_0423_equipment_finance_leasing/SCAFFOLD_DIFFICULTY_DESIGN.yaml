  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: ucc_half_open_coverage_overlap_rejected
        grounds:
          - calculations.ucc_coverage_window
          - state_machines.UccFiling.transitions.PENDING_to_FILED
          - validations[priority=23]
          - entities.UccFiling.fields.coverage_end_clock_utc
        distinguishing_aspect: |
          HALF-OPEN interval semantics on UccFiling: funding auto-files a UCC covering
          [2026-01-01, 2031-01-01); a manual continuation filed at 2027-06-01 (inside the half-open
          window) is rejected ERR_UCC_OVERLAP — distinct from the closed-buffer serial window below.
        test_recipe:
          setup:
            - "Funded lease whose auto UCC covers [2026-01-01, 2031-01-01); clock at 2027-06-01 (inside window)"
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Oscar Leasing", home_state_code: "NY", sales_tax_rate_bps: 825, property_tax_rate_bps: 120 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 500000, term_months: 60, monthly_rate_factor_bps: 200, advance_payment_count: 0, security_deposit_cents: 0 }
              as: FundingOfficer
              captures: { lease_id: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/equipment"
              payload: { serial_number: "SN-1100", description: "Press", original_cost_cents: 500000 }
