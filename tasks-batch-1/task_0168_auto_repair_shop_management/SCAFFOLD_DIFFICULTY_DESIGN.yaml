  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_window_half_open_overlap_rejected
        grounds:
          - validations[priority=8]
          - entities.RepairOrder.fields.scheduled_start
          - entities.RepairOrder.fields.scheduled_end
          - errors[ERR_BAY_DOUBLE_BOOKED]
        distinguishing_aspect: |
          ServiceBay resource, HALF-OPEN [start,end) interval semantics: a second
          RO window [10:00,12:00) on the same bay overlaps an existing [09:00,11:00)
          and is rejected, but an adjacent [11:00,12:00) touching at 11:00 is allowed.
        test_recipe:
          setup:
            - "One bay; RO-A scheduled [09:00,11:00) on it"
            - "RO-B exists, ESTIMATE, awaiting a schedule on the same bay"
          setup_api_calls:
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-OV1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Na Owner", phone: "555-14", email: "na@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINOV01", make: "Tesla", model: "M3", model_year: 2023, odometer_miles: 2000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ShopManager
              captures: { ro_a: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ShopManager
              captures: { ro_b: $.data.id }
            - call: "POST /repair-orders/${ro_a}/schedule"
              payload: { bay_id: "${bay_id}", scheduled_start: "2026-06-07T09:00:00Z", scheduled_end: "2026-06-07T11:00:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /repair-orders/${ro_b}/schedule"
              payload: { bay_id: "${bay_id}", scheduled_start: "2026-06-07T10:00:00Z", scheduled_end: "2026-06-07T12:00:00Z" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BAY_DOUBLE_BOOKED ([10:00,12:00) overlaps [09:00,11:00))"
            - "RepairOrder.${ro_b}.bay_id == null (schedule rejected)"

      - name: technician_clock_in_within_cleanup_buffer_rejected
        grounds:
          - validations[priority=9]
          - entities.Technician.fields.last_clock_out_at
          - calculations.warranty_comeback_window
          - errors[ERR_TECH_DOUBLE_CLOCKED]
        distinguishing_aspect: |
          Technician resource, CLOSED-interval-plus-BUFFER semantics: after a
