              as_user_id: "qa-1"
          assert:
            - "after trigger call 1: BurnInChamber.${ch}.reserved_slot_total == 3 and BurnInChamber.${ch}.scheduled_run_count == 1 and Cabinet.${cab}.cabinet_state == BURN_IN"
            - "after trigger call 2: BurnInRun.${run1}.run_state == ABORTED and BurnInRun.${run1}.abort_reason == 'Chamber humidity sensor out of calibration'"
            - "after trigger call 2: BurnInChamber.${ch}.reserved_slot_total == 0 and BurnInChamber.${ch}.scheduled_run_count == 0   # exactly the pre-schedule values"
            - "after trigger call 2: Cabinet.${cab}.cabinet_state == POPULATED and Cabinet.${cab}.installed_module_count == 1 and Cabinet.${cab}.occupied_slot_indexes == [1]"
            - "trigger call 3 -> 201   # the identical window is bookable again, proving the released slots really came back"
            - "after trigger call 3: BurnInChamber.${ch}.reserved_slot_total == 3 and BurnInChamber.${ch}.scheduled_run_count == 1 and BurnInRun.${run2}.run_state == SCHEDULED"
            - "trigger call 4 -> 409 ERR_INVALID_RUN_STATE   # compensation is not repeatable; a second abort must not release slots twice"
            - "after trigger call 4: BurnInChamber.${ch}.reserved_slot_total == 3   # no double refund"
            - "Module.${m1}.module_state == INSTALLED throughout"
