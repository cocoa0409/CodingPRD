# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Travel & Expense Reimbursement (T&E)
# 9 rules x 2 instances = 18 instances. Every grounds[] resolves into SCAFFOLD.yaml.
# All formula-derived asserts are literals computed against the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: meal_per_diem_vs_itemized_diverge
        grounds:
          - calculations.meal_reimbursement
          - calculations.per_diem_total
          - entities.ExpenseReport.fields.per_diem_method
          - entities.ExpenseReport.fields.meal_reimbursable_cents
        distinguishing_aspect: >
          On ExpenseReport, identical MEAL spend (sum 25000) yields meal_reimbursable_cents=20000
          under PER_DIEM (flat GSA per diem, actuals ignored) but ITEMIZED also caps to 20000; with
          sum 15000 PER_DIEM=20000 while ITEMIZED=15000 — same inputs, two results on the same entity field.
        test_recipe:
          setup:
            - "ACTIVE policy; CA per-diem lodging 20000, M&IE 8000."
            - "Traveler with approved in-policy CA trip 2026-06-01..2026-06-03 (3 trip days)."
            - "Two identical reports on that trip: one PER_DIEM, one ITEMIZED, each with MEAL lines summing to 15000."
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "mgr1@x.com", full_name: "Mgr One", approval_limit_cents: 1000000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t1@x.com", full_name: "Trav One", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 50000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Per Diem Rpt", per_diem_method: "PER_DIEM" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_pd_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_pd_id}", line_type: "MEAL", claimed_amount_cents: 15000 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Itemized Rpt", per_diem_method: "ITEMIZED" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_it_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_it_id}", line_type: "MEAL", claimed_amount_cents: 15000 }
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /expense-reports/${rpt_pd_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pd_meal: $.data.meal_reimbursable_cents }
            - call: "POST /expense-reports/${rpt_it_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { it_meal: $.data.meal_reimbursable_cents }
          assert:
            - "ExpenseReport.${rpt_pd_id}.meal_reimbursable_cents == 20000"
            - "ExpenseReport.${rpt_it_id}.meal_reimbursable_cents == 15000"

      - name: card_authorization_hold_vs_final_capture
        grounds:
          - calculations.card_settlement
          - entities.VirtualCard.fields.authorized_holds_cents
          - entities.VirtualCard.fields.captured_total_cents
          - state_machines.ExpenseReport.SUBMITTED_to_APPROVED
        distinguishing_aspect: >
          On VirtualCard (different entity domain from meal_reimbursement), the SAME 30000 line amount
          sits in authorized_holds_cents while PENDING then moves into captured_total_cents on report
          APPROVED — provisional vs final ledger buckets on the same conserved amount.
        test_recipe:
          setup:
            - "Approved CA trip; ACTIVE card load_limit 100000."
            - "DRAFT report with one in-policy ECONOMY FLIGHT line 30000 charged to the card (PENDING hold)."
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "mgr2@x.com", full_name: "Mgr Two", approval_limit_cents: 1000000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t2@x.com", full_name: "Trav Two", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 50000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_v2: $.data.version }
            - call: "POST /trip-requests/${trip_id}/virtual-cards"
              payload: { load_limit_cents: 100000, expected_trip_request_version: "${trip_v2}" }
              as: FinanceAdmin
              captures: { card_id: $.data.id }
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Card Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "FLIGHT", claimed_amount_cents: 30000, virtual_card_id: "${card_id}", cabin_class: "ECONOMY", scheduled_hours: 4, advance_days: 20 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { line_id: $.data.id }
            - call: "POST /expense-reports/${rpt_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /expense-reports/${rpt_id}/decision"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "${mgr_id}"
          assert:
            - "Before approval VirtualCard.${card_id}.authorized_holds_cents == 30000 and captured_total_cents == 0"
            - "After approval VirtualCard.${card_id}.authorized_holds_cents == 0 and captured_total_cents == 30000"
            - "VirtualCard.${card_id}.available_balance_cents == 70000 both before and after"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: flight_tiered_cap_three_inputs_nonlinear
        grounds:
          - calculations.flight_line_reimbursable
          - entities.ExpenseLine.fields.cabin_class
          - entities.ExpenseLine.fields.advance_days
          - entities.TravelPolicy.fields.max_economy_fare_cents
        distinguishing_aspect: >
          Mode (a): flight reimbursable selects among tiered caps from 3+ inputs (cabin_class,
          scheduled_hours, advance_days) with nested branches — late-booked ECONOMY claimed 50000
          is reimbursed at floor(50000*0.80)=40000, not full economy cap.
        test_recipe:
          setup:
            - "ACTIVE policy max_economy_fare 50000, advance_purchase_days 14; approved CA trip."
            - "DRAFT report with one late-booked (advance_days 5) ECONOMY FLIGHT line claimed 50000, out-of-pocket."
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "mgr3@x.com", full_name: "Mgr Three", approval_limit_cents: 1000000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t3@x.com", full_name: "Trav Three", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 50000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Flight Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
          trigger:
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "FLIGHT", claimed_amount_cents: 50000, cabin_class: "ECONOMY", scheduled_hours: 4, advance_days: 5 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { line_id: $.data.id }
          assert:
            - "ExpenseLine.${line_id}.reimbursable_amount_cents == 40000"
            - "ExpenseLine.${line_id}.in_policy == false"

      - name: per_diem_round_per_day_then_sum
        grounds:
          - calculations.per_diem_total
          - calculations.meal_reimbursement
          - entities.PerDiemRate.fields.mie_cents
        distinguishing_aspect: >
          Mode (b): rounding ORDER matters. With M&IE 8002 over 3 trip days, round-per-day-then-sum
          gives 6002+6002+8002=20006 whereas sum-then-round gives 20005; the scaffold pins per-day.
        test_recipe:
          setup:
            - "CA per-diem M&IE 8002 (odd cents to force a half-cent on 0.75 proration)."
            - "Approved CA trip 2026-06-01..2026-06-03 (3 trip days); PER_DIEM report with one MEAL line."
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "mgr4@x.com", full_name: "Mgr Four", approval_limit_cents: 1000000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t4@x.com", full_name: "Trav Four", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8002 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 50000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Rounding Rpt", per_diem_method: "PER_DIEM" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "MEAL", claimed_amount_cents: 1000 }
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /expense-reports/${rpt_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { meal: $.data.meal_reimbursable_cents }
          assert:
            - "ExpenseReport.${rpt_id}.meal_reimbursable_cents == 20006"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_revision_cycle_returned_to_draft
        grounds:
          - state_machines.ExpenseReport.SUBMITTED_to_RETURNED
          - state_machines.ExpenseReport.RETURNED_to_DRAFT
          - entities.ExpenseReport.fields.return_reason
        distinguishing_aspect: >
          ExpenseReport is cyclic: DRAFT->SUBMITTED->RETURNED->DRAFT, re-editable after a return —
          a non-linear loop (distinct entity from the TripRequest fork-join below).
        test_recipe:
          setup:
            - "Approved CA trip; SUBMITTED report with one in-policy out-of-pocket MILEAGE line."
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "mgr5@x.com", full_name: "Mgr Five", approval_limit_cents: 1000000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t5@x.com", full_name: "Trav Five", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 50000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Cycle Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "MILEAGE", claimed_amount_cents: 0, miles: 100 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports/${rpt_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /expense-reports/${rpt_id}/decision"
              payload: { decision: "RETURN", return_reason: "Need itemization" }
              as: Approver
              as_user_id: "${mgr_id}"
            - call: "POST /expense-reports/${rpt_id}/reopen"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { final_status: $.data.status }
          assert:
            - "After RETURN ExpenseReport.${rpt_id}.status == RETURNED and return_reason == 'Need itemization'"
            - "After reopen ExpenseReport.${rpt_id}.status == DRAFT and return_reason cleared"

      - name: trip_submit_fork_join_oop_vs_auto
        grounds:
          - state_machines.TripRequest.PENDING_to_PENDING_OOP_APPROVAL
          - state_machines.TripRequest.PENDING_to_AUTO_APPROVED
          - calculations.trip_requires_oop
        distinguishing_aspect: >
          TripRequest submit is a branching fork-join: requires_oop=true forks to PENDING_OOP_APPROVAL
          (manual join), requires_oop=false forks to AUTO_APPROVED then joins to APPROVED — divergent
          side-effect sets per branch on a different entity from ExpenseReport.
        test_recipe:
          setup:
            - "ACTIVE policy; CA per-diem lodging 20000 M&IE 8000."
            - "Two PENDING CA trips for two travelers: one budget 300000 (OOP), one budget 200000 (in-policy), each 2026-06-01..2026-06-05 (4 nights)."
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "mgr6@x.com", full_name: "Mgr Six", approval_limit_cents: 1000000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t6a@x.com", full_name: "Trav Six A", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_a: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t6b@x.com", full_name: "Trav Six B", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_b: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_a}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-05", budget_total_cents: 300000 }
              as: Traveler
              as_user_id: "${trav_a}"
              captures: { trip_oop: $.data.id }
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_b}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-05", budget_total_cents: 200000 }
              as: Traveler
              as_user_id: "${trav_b}"
              captures: { trip_auto: $.data.id }
          trigger:
            - call: "POST /trip-requests/${trip_oop}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_a}"
              captures: { oop_status: $.data.status }
            - call: "POST /trip-requests/${trip_auto}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_b}"
              captures: { auto_status: $.data.status }
          assert:
            - "TripRequest.${trip_oop}.status == PENDING_OOP_APPROVAL and requires_oop == true"
            - "TripRequest.${trip_auto}.status == APPROVED and requires_oop == false"
            - "TripRequest.${trip_auto}.remaining_budget_cents == 200000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: report_approve_lines_card_trip_chain
        grounds:
          - state_machines.ExpenseReport.SUBMITTED_to_APPROVED
          - entities.ExpenseLine.fields.settlement_status
          - entities.VirtualCard.fields.captured_total_cents
          - entities.TripRequest.fields.committed_amount_cents
        distinguishing_aspect: >
          Depth-4 cascade from report APPROVE: report->line.status APPROVED (hop1)->line.settlement_status
          SETTLED (hop2)->VirtualCard captured_total recomputed (hop3)->TripRequest.committed_amount_cents
          increased (hop4), each hop caused by the prior.
        test_recipe:
          setup:
            - "Approved CA trip; ACTIVE card load 100000."
            - "SUBMITTED report with one in-policy ECONOMY FLIGHT line 30000 charged to card (PENDING hold)."
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "mgr7@x.com", full_name: "Mgr Seven", approval_limit_cents: 1000000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t7@x.com", full_name: "Trav Seven", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 100000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_v2: $.data.version }
            - call: "POST /trip-requests/${trip_id}/virtual-cards"
              payload: { load_limit_cents: 100000, expected_trip_request_version: "${trip_v2}" }
              as: FinanceAdmin
              captures: { card_id: $.data.id }
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Cascade Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "FLIGHT", claimed_amount_cents: 30000, virtual_card_id: "${card_id}", cabin_class: "ECONOMY", scheduled_hours: 4, advance_days: 20 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { line_id: $.data.id }
