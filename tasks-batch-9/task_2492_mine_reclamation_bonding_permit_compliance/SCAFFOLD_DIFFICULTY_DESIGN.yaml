          trigger:
            - call: "POST /mining/_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /mining/bond-release-applications/${app16b_id}/publish-notice"
              as: BondSpecialist
              as_user_id: "bs-002"
              captures: { rt2_err: $.data.error_id }
            - call: "POST /mining/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /mining/bond-release-applications/${app16b_id}/publish-notice"
              as: BondSpecialist
