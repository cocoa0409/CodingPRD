  - section: endpoints
    instances:
      - name: list_cards_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints.GET_/game-cards"]
        distinguishing_aspect: "GET /game-cards?limit=2&offset=0 returns an array of 2 with pagination fields total_count and has_more=true when more than 2 cards exist."
        test_recipe:
          setup: ["A member owning 3 cards."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "pg@x.com", full_name: "PG" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
          trigger:
            - call: "GET /game-cards"
              payload: { owner_member_id: "${m_id}", limit: 2, offset: 0 }
              as: Cashier
          assert:
            - "response data array length == 2"
            - "response meta/pagination total_count == 3 and has_more == true"

      - name: reload_appends_ledger_entry_side_effect
        claim_type: Computed read
        grounds: ["endpoints.GET_/game-cards/{id}/ledger", "entities.CardLedgerEntry.entry_type"]
        distinguishing_aspect: "After a reload of 6000 on a SILVER member, GET /game-cards/{id}/ledger contains a RELOAD entry (chip_delta 6000) and a BONUS_GRANT entry (bonus_delta 300)."
        test_recipe:
          setup: ["A member at lifetime 60000 (SILVER) with an ACTIVE card, then reloaded 6000."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "ledg@x.com", full_name: "Ledg" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 60000 }
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 6000 }
              as: Cashier
          trigger:
            - call: "GET /game-cards/${c_id}/ledger"
              payload: {}
              as: Cashier
          assert:
            - "GameCard.${c_id}.bonus_chip_balance_cents == 300 (SILVER 5% of the second reload)"
            - "ledger contains a BONUS_GRANT entry with bonus_delta_cents == 300 for the second reload"
            - "ledger contains RELOAD entries with chip_delta_cents 60000 and 6000"

