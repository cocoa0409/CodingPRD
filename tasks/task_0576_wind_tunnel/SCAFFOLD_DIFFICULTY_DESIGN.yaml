              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
          assert:
            - "Flight.${f_id}.status == CHECKED_IN (120 == 120 passes; a >= gate would wrongly reject)"

      - name: session_capacity_full_count_boundary
        grounds:
          - validations[priority=8]
          - errors[ERR_SESSION_FULL]
          - entities.Session.fields.seats_available
          - calculations.session_seats
        distinguishing_aspect: |
          A capacity-1 session accepts its first flight (seats_available 1->0) and rejects
          the second with ERR_SESSION_FULL at seats_taken == capacity (1==1). Count edge,
          distinct metric and endpoint (POST /flights) from the weight threshold.
        test_recipe:
          setup:
            - "Capacity-1 staffed session; two members each with their own party-1 booking; first flight already created."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "M1", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { name: "M2", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m2_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m1_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b1_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m2_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b2_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 1 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b1_id}", session_id: "${s_id}", member_id: "${m1_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { booking_id: "${b2_id}", session_id: "${s_id}", member_id: "${m2_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_SESSION_FULL (seats_taken 1 == capacity 1)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: flight_create_requires_staffed_session
        grounds:
          - validations[priority=5]
          - errors[ERR_SESSION_NOT_STAFFED]
          - entities.Session.fields.staffing_status
        distinguishing_aspect: |
          Flight creation's validity depends on the Session entity's staffing_status:
          on an UNSTAFFED session POST /flights is rejected with ERR_SESSION_NOT_STAFFED.
          Entity pair Flight -> Session.
        test_recipe:
          setup:
            - "An OPEN but UNSTAFFED session and a party-1 booking with 2 minutes."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_SESSION_NOT_STAFFED"

      - name: session_start_requires_operational_tunnel
        grounds:
          - validations[priority=5]
          - errors[ERR_TUNNEL_NOT_OPERATIONAL]
          - entities.Tunnel.fields.status
          - state_machines.Session.OPEN_to_RUNNING
        distinguishing_aspect: |
          Session start's validity depends on the Tunnel entity's status: with the tunnel
          in MAINTENANCE, POST /sessions/{id}/start is rejected with
          ERR_TUNNEL_NOT_OPERATIONAL. Entity pair Session -> Tunnel (different from Flight->Session).
        test_recipe:
          setup:
            - "A STAFFED session on a tunnel that is then put into MAINTENANCE."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /tunnels/${t_id}/maintenance"
              payload: { mode: "MAINTENANCE" }
              as: Manager
          trigger:
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_TUNNEL_NOT_OPERATIONAL"

  - rule_id: resource_temporal_overlap
    instances:
      - name: tunnel_turnaround_buffer_conflict
        grounds:
          - validations[priority=7]
          - errors[ERR_SESSION_TIME_CONFLICT]
          - entities.Tunnel.fields.turnaround_minutes
          - entities.Session.fields.start_utc
        distinguishing_aspect: |
          On the SAME tunnel (turnaround 15), a second session at 10:40-11:00 leaves only a
          10-minute gap after a 10:00-10:30 session and is rejected with ERR_SESSION_TIME_CONFLICT
          — buffer semantics (gap < turnaround), not mere overlap.
        test_recipe:
          setup:
            - "One tunnel (turnaround 15) with a session 10:00-10:30 already scheduled."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:40:00Z", end_utc: "2026-05-10T11:00:00Z", capacity: 4 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_SESSION_TIME_CONFLICT (10-min gap < 15-min turnaround)"

      - name: instructor_overlap_conflict_adjacency_allowed
        grounds:
          - state_machines.Session.UNSTAFFED_to_STAFFED
          - errors[ERR_INSTRUCTOR_TIME_CONFLICT]
          - validations[priority=7]
          - concurrency_rules[session-assign-supersede]
        distinguishing_aspect: |
          The SAME instructor already assigned to a 10:00-10:30 session on tunnel T1 cannot
          be assigned to a 10:15-10:45 session on tunnel T2 (overlap) -> ERR_INSTRUCTOR_TIME_CONFLICT;
          unlike the tunnel rule there is no buffer, so back-to-back (gap 0) would be allowed.
        test_recipe:
          setup:
            - "Two tunnels; instructor assigned to sessA (T1, 10:00-10:30); sessB (T2, 10:15-10:45) is UNSTAFFED."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t1_id: $.data.id }
            - call: "POST /tunnels"
              payload: { name: "T2", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t2_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t1_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { sA_id: $.data.id, sA_v: $.data.version }
            - call: "POST /sessions/${sA_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${sA_v}" }
              as: FrontDesk
            - call: "POST /sessions"
              payload: { tunnel_id: "${t2_id}", start_utc: "2026-05-10T10:15:00Z", end_utc: "2026-05-10T10:45:00Z", capacity: 4 }
              as: FrontDesk
              captures: { sB_id: $.data.id, sB_v: $.data.version }
          trigger:
            - call: "POST /sessions/${sB_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${sB_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INSTRUCTOR_TIME_CONFLICT"

  - rule_id: compensating_invariant
    instances:
      - name: booking_minutes_conserved_on_flight_cancel
        grounds:
          - calculations.booking_minutes
          - state_machines.Flight.SCHEDULED_to_CANCELLED
          - entities.Booking.fields.minutes_remaining
          - entities.Booking.fields.minutes_included
        distinguishing_aspect: |
          Conserved quantity = booking flight-minutes. Create-flight (consume 2) then
          cancel-flight (refund 2) leaves minutes_remaining == minutes_included == 4 for a
          party-2 booking; zero drift.
        test_recipe:
          setup:
            - "Party-2 booking (4 min pool) on a staffed session; one flight created consuming 2 min."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 2 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /flights/${f_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Booking.${b_id}.minutes_remaining == 4"
            - "Booking.${b_id}.minutes_included == 4"

      - name: session_seats_conserved_on_flight_cancel
        grounds:
          - calculations.session_seats
          - state_machines.Flight.SCHEDULED_to_CANCELLED
          - entities.Session.fields.seats_taken
          - entities.Session.fields.seats_available
        distinguishing_aspect: |
          Conserved quantity = session seat count (different type than booking minutes).
          Create-flight (seat taken) then cancel-flight (seat released) leaves
          seats_taken == 0 and seats_available == capacity == 4; zero drift.
        test_recipe:
          setup:
            - "Capacity-4 staffed session; one flight created (seat taken)."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
