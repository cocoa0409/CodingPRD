scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  #
  # Instance 1: gross_damages_model on Case+DamagesItem aggregation domain.
  # Instance 2: contingency_fee on Disbursement / settlement-money domain.
  # Different entity domains: DamagesItem aggregation vs Disbursement allocation.
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: gross_damages_model_economic_only_vs_full_diverges
        grounds:
          - calculations.gross_damages_model
          - entities.DamagesItem.fields.category
          - entities.Case.fields.included_damages_total_cents
          - endpoints[GET /cases/{id}/damages-summary]
        distinguishing_aspect: |
          Same INCLUDED damages set on a single Case yields two different gross totals:
          gross_economic_only_cents (excludes PAIN_SUFFERING) and gross_full_model_cents
          (includes PAIN_SUFFERING). For a case with PAIN_SUFFERING=2_000_000 cents in
          its INCLUDED set, the two variants must differ by exactly 2_000_000 cents — this
          dual-variant divergence lives on the Case+DamagesItem aggregation domain.
        test_recipe:
          setup:
            - "SystemClock set to 2026-01-01T00:00:00Z."
            - "One Client (retainer signed), one CA-jurisdiction Case with accident_date 2024-01-15, status ACTIVE."
            - "One MedicalProvider; one MedicalRecordsRequest on the case in REVIEWED status."
            - "Five DamagesItems on the case in INCLUDED status: MEDICAL_BILLS=1000000, LOST_WAGES=500000, FUTURE_MEDICAL=600000, PROPERTY=300000, PAIN_SUFFERING=2000000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Jane Claimant", email: "jane@example.com", phone: "555-0100" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-01-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "General Hospital", contact: "records@gh.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 1000000 }
              as: Paralegal
              captures: { di_med_id: $.data.id }
            - call: "POST /damages-items/${di_med_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "LOST_WAGES", amount_cents: 500000 }
              as: Paralegal
              captures: { di_wages_id: $.data.id }
            - call: "POST /damages-items/${di_wages_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "FUTURE_MEDICAL", amount_cents: 600000 }
              as: Paralegal
              captures: { di_fut_id: $.data.id }
            - call: "POST /damages-items/${di_fut_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "PROPERTY", amount_cents: 300000 }
              as: Paralegal
              captures: { di_prop_id: $.data.id }
            - call: "POST /damages-items/${di_prop_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "PAIN_SUFFERING", amount_cents: 2000000 }
              as: Paralegal
              captures: { di_pain_id: $.data.id }
            - call: "POST /damages-items/${di_pain_id}/include"
              payload: {}
              as: Attorney
          trigger:
            - call: "GET /cases/${case_id}/damages-summary"
              payload: {}
              as: Attorney
          assert:
            - "response.data.included_damages_total_cents == 4400000"
            - "response.data.gross_economic_only_cents == 2400000"
            - "response.data.gross_full_model_cents == 4400000"
            - "response.data.gross_full_model_cents - response.data.gross_economic_only_cents == 2000000"

      - name: contingency_fee_pre_suit_vs_post_suit_diverges
        grounds:
          - calculations.contingency_fee
          - entities.Case.fields.filed_in_court
          - entities.Disbursement.fields.contingency_fee_cents
          - state_machines.Case.IN_NEGOTIATION_to_SETTLED
          - state_machines.Case.LITIGATION_to_SETTLED
        distinguishing_aspect: |
          The same gross_settlement_cents (6_000_000) yields contingency_fee_cents = 1_999_800
          when accepted in IN_NEGOTIATION (filed_in_court=false → 33.33%) versus
          contingency_fee_cents = 2_400_000 when accepted in LITIGATION (filed_in_court=true
          → 40.00%). The two variants operate on the Disbursement / settlement-money
          domain, distinct from instance 1's DamagesItem aggregation domain.
        test_recipe:
          setup:
            - "TWO Cases in parallel with identical damages set; Case A reaches IN_NEGOTIATION; Case B reaches LITIGATION (file-suit fired) before accepting an identical 6_000_000 settlement."
            - "SystemClock at 2026-01-01T00:00:00Z; CA jurisdiction; SOL = 2026-01-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            # ---- Client + provider (shared) ----
            - call: "POST /clients/register"
              payload: { full_name: "Case A Claimant", email: "case_a@example.com", phone: "555-0101" }
              as: Anonymous
              captures: { client_a_id: $.data.id }
            - call: "POST /clients/${client_a_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /clients/register"
              payload: { full_name: "Case B Claimant", email: "case_b@example.com", phone: "555-0102" }
              as: Anonymous
              captures: { client_b_id: $.data.id }
            - call: "POST /clients/${client_b_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /medical-providers"
              payload: { name: "Shared Hospital", contact: "rec@sh.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            # ---- Case A (pre-suit) ----
            - call: "POST /cases"
              payload: { client_id: "${client_a_id}", accident_date: "2024-01-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_a_id: $.data.id }
            - call: "POST /cases/${case_a_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_a_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_a_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_a_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_a_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_a_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_a"
              captures: { dl_a_id: $.data.id }
            - call: "POST /demand-letters/${dl_a_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_a"
            # First CARRIER offer on Case A — moves DEMAND_SENT -> IN_NEGOTIATION
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_a_id}", offer_amount_cents: 6000000, by_party: "CARRIER" }
              as: Attorney
              captures: { offer_a_id: $.data.id }
            # capture Case.version freshly via GET so we can pass it as expected_case_version
            - call: "GET /cases/${case_a_id}"
              payload: {}
              as: Attorney
              captures: { case_a_v: $.data.version }
            # ---- Case B (post-suit) ----
            - call: "POST /cases"
              payload: { client_id: "${client_b_id}", accident_date: "2024-01-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_b_id: $.data.id }
            - call: "POST /cases/${case_b_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_b_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_b_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_b_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_b_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_b_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_b"
              captures: { dl_b_id: $.data.id }
            - call: "POST /demand-letters/${dl_b_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_b"
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_b_id}", offer_amount_cents: 6000000, by_party: "CARRIER" }
              as: Attorney
              captures: { offer_b_id: $.data.id }
            - call: "POST /cases/${case_b_id}/file-suit"
              payload: {}
              as: ManagingPartner
            - call: "GET /cases/${case_b_id}"
              payload: {}
              as: Attorney
              captures: { case_b_v: $.data.version }
          trigger:
            - call: "POST /settlement-offers/${offer_a_id}/accept"
              payload: { expected_case_version: "${case_a_v}" }
              as: ManagingPartner
              captures: { offer_a_after: $.data.id }
            - call: "POST /settlement-offers/${offer_b_id}/accept"
              payload: { expected_case_version: "${case_b_v}" }
              as: ManagingPartner
          assert:
            - "Disbursement for case_a.contingency_fee_cents == 1999800"
            - "Disbursement for case_b.contingency_fee_cents == 2400000"
            - "Disbursement for case_b.contingency_fee_cents - Disbursement for case_a.contingency_fee_cents == 400200"
            - "Case A.filed_in_court == false"
            - "Case B.filed_in_court == true"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  #
  # Instance 1 — mode (b): demand_letter_amount nested rounding; round per-line
  #              first, then sum subtotal, then round buffer — pinned order.
  # Instance 2 — mode (c): net_to_client circular-looking dependency on
  #              filed_in_court tier, with strict evaluation order.
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: demand_letter_amount_per_line_rounding_pinned
        grounds:
          - calculations.demand_letter_amount
          - entities.DemandLetter.fields.demand_amount_cents
          - entities.DamagesItem.fields.amount_cents
          - endpoints[POST /demand-letters]
        distinguishing_aspect: |
          demand_letter_amount mandates ROUND-PER-LINE before summing the subtotal, AND a
          second rounding step at the negotiation-buffer stage. With pain_multiplier=3.0
          on INCLUDED damages {MEDICAL_BILLS=1_000_000, LOST_WAGES=500_000, FUTURE_MEDICAL=
          600_000, PROPERTY=300_000} (no PAIN_SUFFERING line items — pain_line is derived
          from the per-line economic lines), the pinned order yields demand_amount_cents
          == 9_174_000. Summing raw amounts and rounding ONCE at the end yields a
          different cent total, which the test asserts the API does NOT produce — Rule 2
          mode (b).
        test_recipe:
          setup:
            - "Active CA-jurisdiction Case at clock 2026-01-01; one REVIEWED MedicalRecordsRequest; four INCLUDED DamagesItems (MEDICAL_BILLS 1_000_000, LOST_WAGES 500_000, FUTURE_MEDICAL 600_000, PROPERTY 300_000) — no PAIN_SUFFERING line. Case.included_damages_total_cents == 2_400_000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Round Test", email: "round@example.com", phone: "555-0200" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Round Provider", contact: "r@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 1000000 }
              as: Paralegal
              captures: { di_med: $.data.id }
            - call: "POST /damages-items/${di_med}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "LOST_WAGES", amount_cents: 500000 }
              as: Paralegal
              captures: { di_wages: $.data.id }
            - call: "POST /damages-items/${di_wages}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "FUTURE_MEDICAL", amount_cents: 600000 }
              as: Paralegal
              captures: { di_fut: $.data.id }
            - call: "POST /damages-items/${di_fut}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "PROPERTY", amount_cents: 300000 }
              as: Paralegal
              captures: { di_prop: $.data.id }
            - call: "POST /damages-items/${di_prop}/include"
              payload: {}
              as: Attorney
          trigger:
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 3.0 }
              as: Attorney
              as_user_id: "drafter"
              captures: { dl_id: $.data.id, demand_amt: $.data.demand_amount_cents }
          assert:
            - "DemandLetter.${dl_id}.demand_amount_cents == 9174000"
            - "DemandLetter.${dl_id}.status == 'DRAFT'"
            - "DemandLetter.${dl_id}.pain_multiplier == 3.0"

      - name: net_to_client_evaluation_order_pinned
        grounds:
          - calculations.net_to_client
          - calculations.contingency_fee
          - calculations.lien_proportional_cap
          - entities.Disbursement.fields.net_to_client_cents
          - entities.Disbursement.fields.contingency_fee_cents
          - entities.Disbursement.fields.total_lien_payout_cents
          - entities.Case.fields.filed_in_court
        distinguishing_aspect: |
          net_to_client_cents has a circular-looking dependency: contingency_fee_cents
          depends on filed_in_court (a tier flag) AND on gross_settlement_cents;
          total_lien_payout_cents depends on (gross - fee) via lien_proportional_cap;
          net depends on both. The scaffold pins evaluation order (fee first, then liens
          from gross-fee). With gross 6_000_000, pre-suit fee 1_999_800, and a single
          lien asserted at 1_500_000 (well below distributable=4_000_200, so full
          payout), the pinned order produces net = 6_000_000 - 1_999_800 - 1_500_000 =
          2_500_200. Evaluating in reverse (deducting liens off gross before fee)
          yields fee = round(0.3333 * 4_500_000) = 1_499_850 and a different net.
          Rule 2 mode (c).
        test_recipe:
          setup:
            - "Active CA Case, clock 2026-01-01, INCLUDED damages 4_400_000 (see Rule 1 instance 1 numbers), one CARRIER offer of 6_000_000 PENDING, one MedicalLien asserted at 1_500_000 in status ASSERTED (auto-promoted to AGREED at settlement cascade)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Net Test", email: "net@example.com", phone: "555-0300" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Net Hospital", contact: "n@h.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 1000000 }
              as: Paralegal
              captures: { di_med: $.data.id }
            - call: "POST /damages-items/${di_med}/include"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_net"
              captures: { dl_id: $.data.id }
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_net"
            - call: "POST /medical-liens"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}", asserted_amount_cents: 1500000 }
              as: Paralegal
              captures: { lien_id: $.data.id }
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 6000000, by_party: "CARRIER" }
              as: Attorney
              captures: { offer_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Attorney
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /settlement-offers/${offer_id}/accept"
              payload: { expected_case_version: "${case_v}" }
              as: ManagingPartner
          assert:
            - "SettlementOffer.${offer_id}.status == 'ACCEPTED'"
            - "Case.${case_id}.status == 'SETTLED'"
            - "Case.${case_id}.gross_settlement_cents == 6000000"
            - "MedicalLien.${lien_id}.status == 'AGREED'"
            - "MedicalLien.${lien_id}.negotiated_amount_cents == 1500000"
            - "Disbursement for case ${case_id}.contingency_fee_cents == 1999800"
            - "Disbursement for case ${case_id}.total_lien_payout_cents == 1500000"
            - "Disbursement for case ${case_id}.net_to_client_cents == 2500200"

  # =========================================================================
  # Rule 3 — Non-linear state machines on different entities
  #
  # Instance 1: SettlementOffer cyclic PENDING -> COUNTERED -> (new) PENDING.
  # Instance 2: MedicalLien DISPUTED <-> NEGOTIATING re-entry cycle.
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: settlement_offer_counter_round_chain
        grounds:
          - state_machines.SettlementOffer.PENDING_to_COUNTERED
          - entities.SettlementOffer.fields.round_number
          - entities.SettlementOffer.fields.counter_to_offer_id
          - endpoints[POST /settlement-offers]
        distinguishing_aspect: |
          SettlementOffer ping-pongs: a CARRIER PENDING offer is COUNTERED by a FIRM
          offer (round_number 2, status PENDING); the FIRM offer is in turn COUNTERED
          by another CARRIER offer (round_number 3, status PENDING). The state machine
          revisits PENDING after each counter — a true cycle on the round chain, not a
          linear A→B→C pipeline. round_number must reach exactly 3 and each prior
          offer's status must transition to COUNTERED with responded_at stamped.
        test_recipe:
          setup:
            - "Active CA Case at clock 2026-01-01, DEMAND_SENT, ready for the first settlement offer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Cycle Client", email: "cycle@example.com", phone: "555-0400" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Cycle Hospital", contact: "c@h.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_cyc"
              captures: { dl_id: $.data.id }
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_cyc"
          trigger:
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 4000000, by_party: "CARRIER" }
              as: Attorney
              captures: { offer1_id: $.data.id }
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 8000000, by_party: "FIRM", counter_to_offer_id: "${offer1_id}" }
              as: Attorney
              captures: { offer2_id: $.data.id }
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 6000000, by_party: "CARRIER", counter_to_offer_id: "${offer2_id}" }
              as: Attorney
              captures: { offer3_id: $.data.id }
          assert:
            - "SettlementOffer.${offer1_id}.status == 'COUNTERED'"
            - "SettlementOffer.${offer1_id}.round_number == 1"
            - "SettlementOffer.${offer1_id}.responded_at is not null"
            - "SettlementOffer.${offer2_id}.status == 'COUNTERED'"
            - "SettlementOffer.${offer2_id}.round_number == 2"
            - "SettlementOffer.${offer2_id}.counter_to_offer_id == '${offer1_id}'"
            - "SettlementOffer.${offer3_id}.status == 'PENDING'"
            - "SettlementOffer.${offer3_id}.round_number == 3"
            - "SettlementOffer.${offer3_id}.counter_to_offer_id == '${offer2_id}'"
            - "Case.${case_id}.status == 'IN_NEGOTIATION'"

      - name: medical_lien_dispute_resume_cycle
        grounds:
          - state_machines.MedicalLien.NEGOTIATING_to_DISPUTED
          - state_machines.MedicalLien.DISPUTED_to_NEGOTIATING
          - entities.MedicalLien.fields.status
        distinguishing_aspect: |
          MedicalLien on a single case can move NEGOTIATING -> DISPUTED -> NEGOTIATING
          -> DISPUTED again, revisiting the same state in a closed loop. After two
          dispute/resume rounds the final status is NEGOTIATING (not a forward-only
          chain), differentiating it from a linear ASSERTED→PAID pipeline on the same
          entity. This non-linear shape lives on MedicalLien, a different entity from
          instance 1's SettlementOffer.
        test_recipe:
          setup:
