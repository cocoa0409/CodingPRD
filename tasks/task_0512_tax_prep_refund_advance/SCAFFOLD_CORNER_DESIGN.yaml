  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_refund_transfer_disburse
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rt-disburse-stale-transfer]", "errors[ERR_STALE_VERSION]", entities.RefundTransfer.fields.version]
        distinguishing_aspect: "OCC supersede on a PENDING_FUNDING transfer: the client captures rt_v at create, an /adjust then bumps version (transfer stays PENDING_FUNDING so all state preconditions still pass), and a disburse carrying the now-stale ${rt_v} → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Bank office; SIMPLE return accepted; RefundTransfer pending; an /adjust supersedes it after rt_v is captured, advancing version while keeping it PENDING_FUNDING."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Occ Office", efin: "100034", state_code: "TX", bank_product_enabled: true }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P25252525", holder_name: "Oc Ola", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Oc Ola" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Oc Cli", ssn_last4: "6161", risk_band: "LOW" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, complexity_band: "SIMPLE", expected_refund_cents: 500000 }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /documents/${doc_id}/status"
              payload: { status: "RECEIVED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "PREPARED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /refund-transfers"
              payload: { tax_return_id: "${ret_id}" }
              as: BankProductOfficer
              captures: { rt_id: $.data.id, rt_v: $.data.version }
            - call: "POST /returns/${ret_id}/efile"
              payload: {}
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/efile-ack"
              payload: { ack_status: "ACCEPTED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /refund-transfers/${rt_id}/adjust"
              payload: { estimated_refund_cents: 510000 }
              as: BankProductOfficer
          trigger:
            - call: "POST /refund-transfers/${rt_id}/disburse"
              payload: { disbursed_refund_cents: 500000, expected_refundtransfer_version: "${rt_v}" }
              as: BankProductOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response 412; error_id == ERR_STALE_VERSION (disburse presents the pre-adjust ${rt_v}; the /adjust already bumped version, so the captured value is stale while the transfer is still PENDING_FUNDING)"
            - "RefundTransfer.${rt_id}.status == PENDING_FUNDING (disburse rejected, not applied)"

