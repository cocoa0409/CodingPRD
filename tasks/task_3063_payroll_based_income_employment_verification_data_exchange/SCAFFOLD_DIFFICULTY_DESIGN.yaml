  - rule_id: resource_temporal_overlap
    instances:
      - name: authorization_half_open_interval_admits_regrant_on_expiry_instant
        grounds:
          - validations[priority=13]
          - errors[ERR_AUTHORIZATION_OVERLAP]
          - entities.ConsumerAuthorization.fields.expires_at
        distinguishing_aspect: |
          Half-open interval semantics on the ConsumerAuthorization resource: the occupied
          interval is [granted_at, expires_at), so a regrant landing exactly on the prior
          authorization's expiry instant is admitted while one landing a second earlier
          is rejected.
        test_recipe:
          setup:
            - "an authorization for the worker and the requesting party granted on 2026-01-01, expiring 2027-01-01"
            - "logical clock advanced to 2027-01-01T00:00:00Z"
            - "the null-regression is exercised by a second grant attempted at 2026-12-31T23:59:59Z"
          setup_api_calls:
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id, wk_v: $.data.version }
            - call: "POST /work-number/verifiers"
              payload: { legal_name: "Meridian Home Lending", verifier_class: "MORTGAGE_LENDER", permitted_purpose: "MORTGAGE_CREDIT_DECISION", escrow_balance_cents: 6000 }
              as: PlatformAdmin
              captures: { vfr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /work-number/consumer-authorizations"
              payload: { covered_worker_id: "${wk_id}", verifier_id: "${vfr_id}", permitted_purpose: "MORTGAGE_CREDIT_DECISION", expected_covered_worker_version: "${wk_v}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { aut_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /work-number/consumer-authorizations"
              payload: { covered_worker_id: "${wk_id}", verifier_id: "${vfr_id}", permitted_purpose: "MORTGAGE_CREDIT_DECISION", expected_covered_worker_version: "${wk_v}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /work-number/consumer-authorizations"
              payload: { covered_worker_id: "${wk_id}", verifier_id: "${vfr_id}", permitted_purpose: "MORTGAGE_CREDIT_DECISION", expected_covered_worker_version: "${wk_v}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { aut_2: $.data.id }
          assert:
            - "the grant at 2026-12-31T23:59:59Z fails with ERR_AUTHORIZATION_OVERLAP at HTTP 409, since the incumbent interval still covers that instant"
            - "the grant at 2027-01-01T00:00:00Z succeeds, because the half-open interval [2026-01-01, 2027-01-01) does not cover its own expiry instant"
            - "ConsumerAuthorization.${aut_2}.expires_at == 2028-01-01T00:00:00Z"
      - name: review_window_buffer_rejects_zero_day_gap_but_admits_exact_buffer
        grounds:
          - validations[priority=14]
          - errors[ERR_REVIEW_WINDOW_OVERLAP]
          - entities.DataCurrencyReview.fields.review_period_end
        distinguishing_aspect: |
          Buffer interval semantics on the DataCurrencyReview resource, the geometric
          opposite of the half-open rule: the window is closed and a separation of
          REVIEW_WINDOW_BUFFER_DAYS 3 days is required, so an exactly-adjacent window
          with a zero-day gap is rejected while a 3-day gap is admitted.
        test_recipe:
          setup:
            - "a review scored for the employer whose window closed on 2026-06-30 with window_days 30"
            - "logical clock at 2026-07-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/data-currency-reviews"
              payload: { employer_id: "${emp_id}", review_period_end: "2026-06-30T00:00:00Z", window_days: 30, last_feed_date_in_window: "2026-06-29T00:00:00Z", distinct_pay_periods_in_window: 4, expected_periods: 4 }
              as: PlatformAdmin
              captures: { rev_1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /work-number/data-currency-reviews"
              payload: { employer_id: "${emp_id}", review_period_end: "2026-07-31T00:00:00Z", window_days: 30, last_feed_date_in_window: "2026-07-31T00:00:00Z", distinct_pay_periods_in_window: 4, expected_periods: 4 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /work-number/data-currency-reviews"
              payload: { employer_id: "${emp_id}", review_period_end: "2026-08-03T00:00:00Z", window_days: 30, last_feed_date_in_window: "2026-08-03T00:00:00Z", distinct_pay_periods_in_window: 4, expected_periods: 4 }
              as: PlatformAdmin
              captures: { rev_2: $.data.id }
          assert:
            - "the window closing 2026-07-31 is rejected with ERR_REVIEW_WINDOW_OVERLAP at HTTP 409, because the incumbent window closes 2026-06-30 and the gap is one day, below the 3-day buffer"
            - "the window closing 2026-08-03 is admitted, because the gap from 2026-06-30 is exactly REVIEW_WINDOW_BUFFER_DAYS 3 days"
            - "DataCurrencyReview.${rev_2}.review_state == SCORED"
  - rule_id: compensating_invariant
    instances:
      - name: worker_opt_out_releases_exactly_the_counted_verification_records
        grounds:
          - calculations.employer_feed_counters_adjustment
          - state_machines.VerificationRequest.RESPONDED_to_REVERSED_RECONSENT_REQUIRED
          - entities.Employer.fields.counted_verification_records
        distinguishing_aspect: |
          The conserved quantity is a counted record tally rather than a monetary figure:
          the response's records_matched_count is added on materialization and released on
          the worker's compensating opt-out, so the employer's counter returns to exactly
          its pre-verification value with zero drift.
        test_recipe:
          setup:
            - "worker Dana Reyes holds one VERIFIED span at a MONTHLY employer"
            - "a verification response has already been materialized, so counted_verification_records is 1"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id, wk_v: $.data.version }
            - call: "POST /work-number/verification-products"
              payload: { product_code: "MORTGAGE-I12", tier: "EMPLOYMENT_INCOME", requesting_class: "MORTGAGE", base_fee_cents: 1500, history_months_included: 12, includes_employment_status: true }
              as: PlatformAdmin
              captures: { prd_id: $.data.id }
            - call: "POST /work-number/verifiers"
              payload: { legal_name: "Meridian Home Lending", verifier_class: "MORTGAGE_LENDER", permitted_purpose: "MORTGAGE_CREDIT_DECISION", escrow_balance_cents: 6000 }
              as: PlatformAdmin
              captures: { vfr_id: $.data.id }
            - call: "POST /work-number/verifiers/${vfr_id}/accredit"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/verifiers/${vfr_id}/authorize"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-08-31T00:00:00Z", record_count: 900 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/employment-records"
              payload: { employer_id: "${emp_id}", covered_worker_id: "${wk_id}", payroll_feed_batch_id: "${bat_id}", employment_status: "ACTIVE", hire_date: "2023-01-15T00:00:00Z", separation_date: null, pay_rate_cents: 520000, pay_rate_basis: "MONTHLY", standard_hours_per_week: 40, final_pay_period_income_cents: 0 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/consumer-authorizations"
              payload: { covered_worker_id: "${wk_id}", verifier_id: "${vfr_id}", permitted_purpose: "MORTGAGE_CREDIT_DECISION", expected_covered_worker_version: "${wk_v}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { aut_id: $.data.id }
            - call: "POST /work-number/verification-requests"
              payload: { verifier_id: "${vfr_id}", covered_worker_id: "${wk_id}", product_id: "${prd_id}", permissible_purpose_asserted: "MORTGAGE_CREDIT_DECISION" }
              as: Verifier
              as_user_id: "${vfr_id}"
              captures: { req_id: $.data.id }
            - call: "POST /work-number/verification-requests/${req_id}/permit"
              payload: { consumer_authorization_id: "${aut_id}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
            - call: "POST /work-number/verification-responses"
              payload: { verification_request_id: "${req_id}" }
              as: Verifier
              as_user_id: "${vfr_id}"
              captures: { resp_id: $.data.id }
            - call: "GET /work-number/employers/${emp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { counted_before: $.data.counted_verification_records }
          trigger:
            - call: "POST /work-number/covered-workers/${wk_id}/opt-out"
              payload: {}
              as: CoveredWorker
              as_user_id: "${wk_id}"
            - call: "GET /work-number/employers/${emp_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Employer.${emp_id}.counted_verification_records == 1 before the opt-out and == 0 after it"
            - "the invariant holds exactly: counted_verification_records_after_reversal - counted_verification_records_before_verification == 0, with COUNTER_FLOOR 0 never reached"
            - "VerificationRequest.${req_id}.request_state == REVERSED_RECONSENT_REQUIRED and its records_matched_count is no longer in scope"
            - "Employer.${emp_id}.total_records_contributed is unchanged by the reversal, because it counts contributed records rather than verifications"
      - name: settlement_void_restores_employer_compensation_earned_cents_exactly
        grounds:
          - calculations.employer_compensation_balance
          - state_machines.CompensationAccrual.PAID_to_ACCRUED
          - entities.Employer.fields.compensation_earned_cents
        distinguishing_aspect: |
          The conserved quantity is settled cents rather than a record tally, and the
          compensating action is the settlement void: the employer's earned-cents figure
          is restored to its pre-settlement value exactly, with the void releasing
          precisely the paid_cents the posting had added.
        test_recipe:
          setup:
            - "MONTHLY employer with one ACCRUED accrual of 1200 records at the CONTRIBUTOR_TIER2_RATE, so gross_accrued_cents is 12000"
            - "Employer.compensation_earned_cents starts at 0"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-05-31T00:00:00Z", record_count: 1200 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /work-number/employers/${emp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { earned_before: $.data.compensation_earned_cents }
          trigger:
            - call: "POST /work-number/compensation-settlements"
              payload: { employer_id: "${emp_id}", settlement_period_end: "2026-06-30T00:00:00Z", settlement_budget_cents: 12000, waiver_budget_cents: 0, apply_blended_rate: false }
              as: PlatformAdmin
              captures: { set_id: $.data.settlement_id, settled_net: $.data.settled_net_cents }
            - call: "GET /work-number/contributor-compensations"
              payload: { employer_id: "${emp_id}" }
              as: PlatformAdmin
              captures: { acc_id: "$.data[0].id" }
            - call: "POST /work-number/compensation-settlements/${set_id}/void"
              payload: {}
              as: PlatformAdmin
              captures: { reverted: $.data.reverted_cents }
            - call: "GET /work-number/employers/${emp_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Employer.${emp_id}.compensation_earned_cents == 12000 after the settlement posts and == 0 after the void"
            - "the invariant holds exactly: compensation_earned_cents_after_void - compensation_earned_cents_before_post == 0, matching EQUITY_EPSILON_CENTS 0"
            - "the settlement reports settled_gross_cents == 12000 and settled_net_cents == 12000, and the void reports reverted_cents == 12000"
            - "the accrual is back in cycle_state ACCRUED with paid_cents 0 and waived_cents 0"
            - "a settlement carrying settlement_budget_cents 11000 against the same 12000-cent accrual would settle nothing, because compensation_settlement_totals is all-or-nothing"
