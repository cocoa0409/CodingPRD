# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every grounds: ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every assert numeric literal was computed against the
# §1.3 formulas + constants (see worklog). All setup_api_calls / trigger chains
# are structured calls against §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: contract_total_estimate_vs_final_diverge_on_project
        grounds:
          - calculations.contract_total
          - calculations.contract_total.variants.estimate
          - calculations.contract_total.variants.final
          - entities.Project.fields.estimate_total_cents
          - entities.Project.fields.contract_total_cents
          - state_machines.Project.QUOTED_to_CONTRACTED
        distinguishing_aspect: |
          Same CabinetSpec set yields estimate_total_cents (no rush, finish RAW at
          measure) different from contract_total_cents (rush surcharge + PAINT
          finish at contract) — a cost-accounting dual variant on the Project domain.
        test_recipe:
          setup:
            - "Shop tax_rate_bps=800, rush_surcharge_bps=1500, deposit_pct_bps=3000."
            - "Customer exists, not on credit hold."
            - "Project is_rush=true, margin_policy=STANDARD, one spec base_unit_price_cents=100000 qty=4 (MED tier)."
            - "estimate captured at MEASURE (finish RAW, no rush) = 561600; final at CONTRACT (PAINT + rush) = 723341."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Mill A", tax_rate_bps: 800, rush_surcharge_bps: 1500, deposit_pct_bps: 3000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "MDF-18", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "Cust A", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "Kitchen", is_rush: true, margin_policy: "STANDARD" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "Base", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 4, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/measure"
              payload: {}
              as: Designer
              captures: { est_after_measure: $.data.estimate_total_cents }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/finish-selections"
              payload: { finish_code: "PAINT", sheen: "SATIN" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/quote"
              payload: {}
              as: Designer
              captures: { proj_v: $.data.version }
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/contract"
              payload: { expected_project_version: "${proj_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { final_total: $.data.contract_total_cents }
          assert:
            - "Project.${proj_id}.estimate_total_cents == 561600"
            - "Project.${proj_id}.contract_total_cents == 723341"
            - "Project.${proj_id}.contract_total_cents != Project.${proj_id}.estimate_total_cents"

      - name: material_consumption_provisional_vs_actual_diverge_on_material
        grounds:
          - calculations.material_consumption
          - calculations.material_consumption.variants.provisional
          - calculations.material_consumption.variants.actual
          - entities.Material.fields.reserved_sheets
          - entities.Material.fields.on_hand_sheets
          - state_machines.MaterialReservation.COMMITTED_to_CONSUMED
        distinguishing_aspect: |
          On the Material domain, provisional reserve (reserved_sheets += held+committed)
          over-counts versus actual consume (on_hand decremented only by COMMITTED sheets
          at BuildJob COMPLETE) — an inventory dual variant distinct from the Project cost variant.
        test_recipe:
          setup:
            - "Material on_hand=10. Project reaches IN_PRODUCTION (deposit paid)."
            - "Reservation R1=4 sheets HELD then COMMITTED; reservation R2=3 sheets HELD (never committed)."
            - "After commit R1: reserved_sheets=7 (provisional: 4+3). BuildJob completes -> only R1's 4 consumed."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Mill B", tax_rate_bps: 0, deposit_pct_bps: 3000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "PLY-18", sheet_area_mm2: 5796000, sheet_price_cents: 5000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials/${mat_id}/restock"
              payload: { sheets: 10 }
              as: ShopManager
            - call: "POST /shops/${shop_id}/machines"
              payload: { name: "CNC-1", changeover_buffer_min: 0 }
              as: ShopManager
              captures: { mach_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "Cust B", email: "b@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "Vanity", is_rush: false, margin_policy: "STANDARD" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "Base", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 2, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/finish-selections"
              payload: { finish_code: "STAIN" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/measure"
              payload: {}
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/quote"
              payload: {}
              as: Designer
              captures: { proj_v: $.data.version }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/contract"
              payload: { expected_project_version: "${proj_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dep_required: $.data.deposit_required_cents }
            - call: "GET /shops/${shop_id}/projects/${proj_id}/draws"
              payload: {}
              as: ShopManager
              captures: { dep_draw_id: $.data.0.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/projects/${proj_id}/material-reservations"
              payload: { material_id: "${mat_id}", sheets: 4 }
              as: ShopManager
              captures: { r1_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/material-reservations"
              payload: { material_id: "${mat_id}", sheets: 3 }
              as: ShopManager
              captures: { r2_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/material-reservations/${r1_id}/commit"
              payload: {}
              as: ShopManager
            - call: "POST /shops/${shop_id}/projects/${proj_id}/build-jobs"
              payload: { machine_id: "${mach_id}", start_utc: "2026-07-01T09:00:00Z", end_utc: "2026-07-01T12:00:00Z" }
              as: ShopManager
              captures: { bj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/build-jobs/${bj_id}/start"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/build-jobs/${bj_id}/complete"
              payload: {}
              as: ShopManager
          assert:
            - "Material.${mat_id}.on_hand_sheets == 6"
            - "Material.${mat_id}.reserved_sheets == 3"
            - "MaterialReservation.${r1_id}.status == CONSUMED"
            - "MaterialReservation.${r2_id}.status == HELD"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: contract_total_tiered_margin_nonlinear_mode_a
        grounds:
          - calculations.contract_total
          - entities.Project.fields.margin_policy
          - entities.CabinetSpec.fields.quantity
          - entities.CabinetSpec.fields.base_unit_price_cents
        distinguishing_aspect: |
          Mode (a): contract_total combines >=3 inputs (base_unit_price, quantity-driven
          margin tier, finish bps) with non-linear min/max line clamp; qty 2 (SMALL=13500bps)
          vs qty 7 (BULK=12500bps) selects different per-unit margins for identical base.
        test_recipe:
          setup:
            - "Shop tax_rate_bps=0. One project, margin_policy=STANDARD, finish RAW."
            - "Two specs same base 100000: spec1 qty2 (SMALL), spec2 qty7 (BULK). estimate = 270000 + 875000 = 1145000."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Mill C", tax_rate_bps: 0 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "MEL-18", sheet_area_mm2: 5796000, sheet_price_cents: 3000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "Cust C", email: "c@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "Closets", margin_policy: "STANDARD" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "S1", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 2, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "S2", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 7, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/measure"
              payload: {}
              as: Designer
              captures: { est: $.data.estimate_total_cents }
          assert:
            - "Project.${proj_id}.estimate_total_cents == 1145000"

      - name: cut_list_sheets_round_per_spec_then_sum_mode_b
        grounds:
          - calculations.cut_list_sheets
          - entities.CabinetSpec.fields.panel_area_mm2
          - entities.Material.fields.sheet_area_mm2
          - endpoints  # GET /shops/{shopId}/projects/{projectId}/cut-list
        distinguishing_aspect: |
          Mode (b): cut_list_sheets PINS ceil-per-spec then sum (=4 sheets) which differs
          from ceil(sum-of-areas) (=3 sheets); the rounding order is decisive.
        test_recipe:
          setup:
            - "Material sheet_area_mm2=5796000. Two specs same material:"
            - "spec1 600x720x560 qty3 -> per_spec_sheets=2; spec2 900x720x600 qty2 -> per_spec_sheets=2. ceil-per-spec-then-sum=4."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Mill D", tax_rate_bps: 0 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "MDF-D", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "Cust D", email: "d@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "Pantry", margin_policy: "STANDARD" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "S1", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 3, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "S2", width_mm: 900, height_mm: 720, depth_mm: 600, quantity: 2, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
          trigger:
            - call: "GET /shops/${shop_id}/projects/${proj_id}/cut-list"
              payload: {}
              as: Designer
              captures: { total: $.data.total_sheets }
          assert:
            - "cut-list response data.total_sheets == 4"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: project_change_order_cyclic_loop
        grounds:
          - state_machines.Project.IN_PRODUCTION_to_CHANGE_PENDING
          - state_machines.Project.CHANGE_PENDING_to_IN_PRODUCTION
          - state_machines.Project
        distinguishing_aspect: |
          Project is cyclic: IN_PRODUCTION -> CHANGE_PENDING -> IN_PRODUCTION via a
          change-order submit then approve, returning to the same state — not a linear pipeline.
        test_recipe:
          setup:
            - "Project IN_PRODUCTION (contracted, deposit paid, one build job scheduled)."
            - "A ChangeOrder is submitted (project -> CHANGE_PENDING) then approved (project back to IN_PRODUCTION)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Mill E", tax_rate_bps: 0, deposit_pct_bps: 3000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "MDF-E", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/machines"
              payload: { name: "CNC-E", changeover_buffer_min: 0 }
              as: ShopManager
              captures: { mach_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "Cust E", email: "e@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "Library", margin_policy: "STANDARD" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "B", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 4, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/finish-selections"
              payload: { finish_code: "PAINT" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/measure"
              payload: {}
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/quote"
              payload: {}
              as: Designer
              captures: { proj_v0: $.data.version }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/contract"
              payload: { expected_project_version: "${proj_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /shops/${shop_id}/projects/${proj_id}/draws"
              payload: {}
              as: ShopManager
              captures: { dep_draw_id: $.data.0.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/projects/${proj_id}/build-jobs"
              payload: { machine_id: "${mach_id}", start_utc: "2026-07-02T09:00:00Z", end_utc: "2026-07-02T12:00:00Z" }
              as: ShopManager
            - call: "POST /shops/${shop_id}/projects/${proj_id}/change-orders"
              payload: { description: "add drawer", spec_price_delta_cents: 50000 }
              as: ShopManager
              captures: { co_id: $.data.id }
            - call: "GET /shops/${shop_id}/projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { proj_v1: $.data.version }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/change-orders/${co_id}/submit"
              payload: { expected_project_version: "${proj_v1}" }
              as: ShopManager
              captures: { proj_v2: $.data.version }
          trigger:
            - call: "GET /shops/${shop_id}/projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { st_pending: $.data.status, proj_v_pending: $.data.version }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/change-orders/${co_id}/approve"
              payload: { expected_project_version: "${proj_v_pending}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /shops/${shop_id}/projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { st_after: $.data.status }
          assert:
            - "Project.${proj_id}.status observed == CHANGE_PENDING after submit"
            - "Project.${proj_id}.status == IN_PRODUCTION after approve"

      - name: change_order_submitted_revising_cycle
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_REVISING
          - state_machines.ChangeOrder.REVISING_to_SUBMITTED
          - entities.ChangeOrder.fields.revision_round
        distinguishing_aspect: |
          ChangeOrder cycles SUBMITTED -> REVISING -> SUBMITTED, incrementing revision_round
          to 2 — a distinct cyclic entity from Project.
        test_recipe:
          setup:
            - "Project IN_PRODUCTION; a ChangeOrder submitted (revision_round=1)."
            - "Customer requests revision (-> REVISING); ShopManager resubmits (-> SUBMITTED, revision_round=2)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Mill F", tax_rate_bps: 0, deposit_pct_bps: 3000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "MDF-F", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/machines"
              payload: { name: "CNC-F", changeover_buffer_min: 0 }
              as: ShopManager
              captures: { mach_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "Cust F", email: "f@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "Office", margin_policy: "STANDARD" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "B", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 4, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/finish-selections"
              payload: { finish_code: "PAINT" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/measure"
              payload: {}
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/quote"
              payload: {}
              as: Designer
              captures: { proj_v0: $.data.version }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/contract"
              payload: { expected_project_version: "${proj_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /shops/${shop_id}/projects/${proj_id}/draws"
              payload: {}
              as: ShopManager
              captures: { dep_draw_id: $.data.0.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/projects/${proj_id}/build-jobs"
              payload: { machine_id: "${mach_id}", start_utc: "2026-07-03T09:00:00Z", end_utc: "2026-07-03T12:00:00Z" }
              as: ShopManager
            - call: "POST /shops/${shop_id}/projects/${proj_id}/change-orders"
              payload: { description: "swap hinges", spec_price_delta_cents: 30000 }
              as: ShopManager
              captures: { co_id: $.data.id }
            - call: "GET /shops/${shop_id}/projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { proj_v1: $.data.version }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/change-orders/${co_id}/submit"
              payload: { expected_project_version: "${proj_v1}" }
              as: ShopManager
            - call: "POST /shops/${shop_id}/projects/${proj_id}/change-orders/${co_id}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/change-orders/${co_id}/resubmit"
              payload: {}
              as: ShopManager
              captures: { co_round: $.data.revision_round, co_status: $.data.status }
          assert:
            - "ChangeOrder.${co_id}.status == SUBMITTED"
            - "ChangeOrder.${co_id}.revision_round == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_approve_folds_ledger_creates_progress_draw_depth3
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - state_machines.Project.CHANGE_PENDING_to_IN_PRODUCTION
          - calculations.change_order_delta
          - calculations.draw_amount
          - entities.Project.fields.contract_total_cents
          - entities.Draw.fields.amount_cents
        distinguishing_aspect: |
          Depth-3 cascade from ChangeOrder approve: (A) approve freezes delta_cents=75600 ->
          (B) Project.contract_total_cents increases by that delta -> (C) a PROGRESS Draw is
          created in PENDING for max(0,delta)=75600. Each hop is caused by the previous.
        test_recipe:
          setup:
            - "Project IN_PRODUCTION, contract_total_cents=628992 (STANDARD,qty4,PAINT,tax800,no rush)."
            - "ChangeOrder spec_price_delta_cents=50000 submitted; delta_cents=75600 (BULK margin 12500 + PAINT 800 + tax 800)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Mill G", tax_rate_bps: 800, deposit_pct_bps: 3000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "MDF-G", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/machines"
              payload: { name: "CNC-G", changeover_buffer_min: 0 }
              as: ShopManager
