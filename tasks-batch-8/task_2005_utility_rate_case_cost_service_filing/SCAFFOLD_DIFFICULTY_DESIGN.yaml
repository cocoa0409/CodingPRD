            - { call: "POST /api/v1/rate-cases/${rc1}/open-discovery", payload: {}, as: CommissionStaff }
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-999", utility_name: "Other State Gas", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 800, proposed_revenue_requirement_cents: 100000000, allocation_method: "ENERGY_AVERAGE" }, as: UtilityFiler, captures: { rc2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc2}", account_code: "900", category: "O_AND_M", booked_amount_cents: 50000000 }, as: UtilityFiler, captures: { e_other: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc2}", test_year_entry_id: "${e_other}", amount_cents: -5000000, reason: "Remove one-time merger cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a_other: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-30T00:00:00Z" }, as: CommissionStaff }
          trigger:
