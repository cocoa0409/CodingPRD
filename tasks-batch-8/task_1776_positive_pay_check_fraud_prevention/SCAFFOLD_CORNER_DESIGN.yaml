        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment; item paid clean; claim filed (FILED)"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "SkipCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
