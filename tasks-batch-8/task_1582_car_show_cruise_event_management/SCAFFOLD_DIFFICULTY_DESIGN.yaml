            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer, captures: { zn: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "B1", email: "b1@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${p1}", signature_name: "B1" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /registrants", payload: { full_name: "B2", email: "b2@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p2: $.data.id } }
            - { call: "POST /registrants/${p2}/vehicles", payload: { year: 1971, make: "Chevrolet", model: "Chevelle" }, as: Organizer, captures: { v2: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${p2}", signature_name: "B2" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p2}", vehicle_id: "${v2}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r2: $.data.id } }
            - { call: "POST /registrations/${r2}/payments", payload: { amount_cents: 3000, method: "CARD" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:30:00Z" }, as: Organizer }
            - { call: "POST /registrations/${r1}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk }
            - { call: "POST /registrations/${r2}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk }
            - { call: "POST /events/${ev}/judges", payload: { name: "J1", email: "j1@example.com", assigned_class_ids: ["${cl}"] }, as: Organizer, captures: { j1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:30:00Z" }, as: Organizer }
            - { call: "POST /events/${ev}/lock-registration", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/start-judging", payload: {}, as: Organizer }
            - { call: "POST /score-sheets", payload: { registration_id: "${r1}", criteria_scores: [{ criterion: "EXTERIOR", points: 9 }, { criterion: "INTERIOR", points: 8 }, { criterion: "ENGINE", points: 8 }, { criterion: "AUTHENTICITY", points: 9 }, { criterion: "CONDITION", points: 8 }] }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
            - { call: "POST /score-sheets", payload: { registration_id: "${r2}", criteria_scores: [{ criterion: "EXTERIOR", points: 7 }, { criterion: "INTERIOR", points: 7 }, { criterion: "ENGINE", points: 7 }, { criterion: "AUTHENTICITY", points: 7 }, { criterion: "CONDITION", points: 7 }] }, as: Judge, as_user_id: "${j1}", captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /score-sheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "GET /events/${ev}", payload: {}, as: Organizer, captures: { life_mid: $.data.lifecycle_status } }
            - { call: "POST /score-sheets/${s2}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "GET /events/${ev}", payload: {}, as: Organizer, captures: { life_end: $.data.lifecycle_status } }
            - { call: "GET /score-sheets/${s1}", payload: {}, as: Organizer, captures: { s1_st: $.data.status } }
            - { call: "GET /score-sheets/${s2}", payload: {}, as: Organizer, captures: { s2_st: $.data.status } }
          assert:
            - "after first submit: lifecycle_status == JUDGING (R2 pair still outstanding; L2 must not fire)"
            - "after second submit: lifecycle_status == TABULATING (L1 class completion -> L2 event transition)"
            - "ScoreSheet.${s1}.status == LOCKED and ScoreSheet.${s2}.status == LOCKED (L3 caused by L2)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkin_state_beats_waiver_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Registration.CONFIRMED_to_CHECKED_IN
        distinguishing_aspect: |
          Error-category pair state vs business_safety: check-in on a WITHDRAWN registration
          with NO waiver on file fails both rule 6 (ERR_INVALID_REGISTRATION_STATE) and rule 7
          (ERR_WAIVER_NOT_SIGNED); the state error must win because priority 6 precedes 7.
        test_recipe:
          setup:
            - "Registration CONFIRMED (paid 3000), then withdrawn at 0.5h before gates (0% tier -> straight WITHDRAWN); no waiver ever signed; clock inside the arrival window"
