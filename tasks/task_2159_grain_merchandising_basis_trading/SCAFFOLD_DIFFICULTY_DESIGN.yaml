            - "after the first apply, DeliveryTicket.${tkt_id}.status == GRADED"
            - "after the first apply, PurchaseContract.${c1_id}.delivered_bushels == 0.00"
            - "FreightBooking.${bk1_id}.occupancy_end_at == 2026-11-09T00:00:00.000Z"
