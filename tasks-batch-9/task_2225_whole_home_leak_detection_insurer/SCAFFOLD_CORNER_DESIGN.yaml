          - state_machines.Device.monitor_mode.NORMAL_to_VACATION
        excluded_because:
          difficulty_instance: non_linear_state_machine / device_parallel_dimensions_independent
          rationale: "The named §1.8 instance already drives all three Device state dimensions and asserts that each moves without disturbing the other two."

      - name: burst_ingest_cascade_down_to_irrigation_windows
        claim_type: Cascade down
        grounds:
          - state_machines.Device.valve_state.OPEN_to_CLOSED
          - state_machines.AnomalyEvent.event_state.DETECTED_to_ALERTED
        excluded_because:
          difficulty_instance: transitive_cascade / telemetry_burst_three_hop_cascade
          rationale: "The named §1.8 instance asserts every hop of the burst cascade end-to-end, including the irrigation-window suspension."

