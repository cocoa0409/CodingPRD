              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 2000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j1: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 2000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j2: $.data.id }
            - call: "POST /label-jobs/jobs/${j1}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j1}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
            - call: "POST /label-jobs/jobs/${j2}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j2}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
          trigger:
            - call: "POST /label-jobs/jobs/${j1}/start-press"
              as: PressOperator
            - call: "POST /label-jobs/jobs/${j1}/color-measurements"
              payload: { station_no: 1, delta_e: 1.2 }
              as: PressOperator
              captures: { m1: $.data.id }
            - call: "POST /label-jobs/jobs/${j1}/color-measurements/${m1}/judge"
              payload: { verdict: "PASS" }
              as: QualityManager
            - call: "POST /label-jobs/jobs/${j1}/complete-press"
              payload: { good_quantity_produced: 2000 }
              as: PressOperator
            - call: "POST /label-jobs/jobs/${j2}/start-press"
              as: PressOperator
              captures: { j2_status: $.data.status }
          assert:
            - "start→complete cycle on J1 leaves the press free: start-press(${j2}) succeeds"
            - "LabelJob.${j2}.status == ON_PRESS (occupancy invariant 0-or-1 held throughout)"
