            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 4, size_on_hand: [{ size_code: "M", units: 3 }, { size_code: "L", units: 1 }], min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 20, size_on_hand: [{ size_code: "S", units: 5 }, { size_code: "M", units: 7 }, { size_code: "L", units: 6 }, { size_code: "XL", units: 2 }], min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /allocation/_run-assortment-detection"
              payload: { program_id: "${prog_id}" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/assortment-actions"
              payload: { store_id: "${s1_id}", status: "PENDING" }
              as: AllocationManager
              captures: { a1_id: "$.data[0].id" }
            - call: "POST /allocation/assortment-actions/${a1_id}/execute"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/transfer-recommendations"
              payload: { assortment_action_id: "${a1_id}" }
              as: AllocationManager
              captures: { t1_id: "$.data[0].id" }
            - call: "POST /allocation/transfer-recommendations/${t1_id}/approve"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/store-positions/${p2_id}"
              payload: {}
              as: Allocator
              captures: { p2_v2: $.data.version }
            - call: "POST /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}", from_store_id: "${s2_id}", to_store_id: "${s1_id}", item_id: "${item_id}", units: 6, expected_from_position_version: "${p2_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { t2_id: $.data.id }
            - call: "POST /allocation/transfer-recommendations/${t2_id}/approve"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
              captures: { ex1: $.data.error_id }
            - call: "GET /allocation/transfer-recommendations/${t2_id}"
              payload: {}
              as: AllocationManager
          assert:
            - "The sweep raises one CONSOLIDATION action at 0101 with consolidation_target_store_id = 0102 and units_at_detection 4, and execute creates a TransferRecommendation with source_reason == CONSOLIDATION and proposed_by_user_id == 'system'"
            - "That consolidation carries size_split == [{M:3},{L:1}] (weights are the donor units, not the size curve), landed_cost_usd == 50.40 (freight max(45.00, 41.00 + 4 x 0.85 = 44.40) = 45.00 at 1200bp -> 5.40) and benefit_usd == 46.57"
            - "Its benefit_ratio_bp == 9240, which is 10760bp BELOW the program bar of 20000, and the approve still returns 200 with status APPROVED - the gate is skipped entirely for CONSOLIDATION"
            - "The rebalance 0102 -> 0101 for 6 units is created with size_split == [{S:4},{XL:2}]: only the receiver 0101 core sizes that are out (S 2000bp and XL 1500bp) are candidates, and the single remainder unit goes to S by weight DESC"
            - "Its landed_cost_usd is also 50.40 (freight max(45.00, 38.00 + 5.10 = 43.10) = 45.00) and benefit_usd == 78.30, giving benefit_ratio_bp == 15536"
            - "Approving that rebalance returns 409 ERR_BENEFIT_RATIO_BELOW_THRESHOLD even though its ratio beats the approved consolidation by 6296bp - source_reason, not economics, decides whether the rule runs"
            - "TransferRecommendation.${t2_id}.status is still PROPOSED after the refusal, with benefit_ratio_bp, landed_cost_usd and size_split unchanged - the frozen economics are not recomputed by a failed approve"
            - "No units moved on the failed approve: StorePosition.${p2_id}.reserved_out_units is unchanged and 0101 gained no in_transit from ${t2_id}"
            - "Segregation of duties does not fire on either approve: u-mgr-1 differs from 'system' and from u-alloc-1"
            - "The consolidation approve also passed the receiver capacity check at its exact boundary: 20 available + 0 in_transit + 4 units == capacity 24"
      - name: exact_fill_receipt_satisfies_every_rung_from_propose_to_scorecard
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority:13]
          - validations[priority:14]
          - validations[priority:25]
          - validations[priority:30]
