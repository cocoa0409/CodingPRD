  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: chef_rotation_cyclic_clearing_return_to_on_station
        grounds:
          - state_machines.ChefAssignment.CLEARING_to_ON_STATION
          - state_machines.ChefAssignment.ON_STATION_to_CLEARING
          - calculations.chef_rotation
          - entities.ChefAssignment.fields.sequence_index
        distinguishing_aspect: "A cycle, not a pipeline: ChefAssignment.CLEARING → ON_STATION is the same edge a fresh clock-in uses, so a chef who has already run one show can re-enter the rotation and be selected for a second table. The distinguishing evidence is that sequence_index is reassigned by max-over-ON_STATION + 1 rather than resumed, so the cycle does not restore the old position."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. Venue with tiers, tables and two chefs."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: Chef
              captures: { v_venue_ev6: $.data.version }
            - call: "POST /service-floor/chefs/${chef1_id}/events"
              payload: { event_type: "CLOCK_IN", expected_venue_version: "${v_venue_ev6}" }
              as: Chef
              as_user_id: "${chef1_id}"
            - call: "POST /service-floor/chefs/${chef2_id}/events"
              payload: { event_type: "CLOCK_IN", expected_venue_version: "${v_venue}" }
              as: Chef
              as_user_id: "${chef2_id}"
          trigger:
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: Chef
              captures: { v_venue_ev7: $.data.version }
            - call: "POST /service-floor/chefs/${chef1_id}/events"
