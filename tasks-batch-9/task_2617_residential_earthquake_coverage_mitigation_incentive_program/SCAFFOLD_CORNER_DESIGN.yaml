              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { gr_id: $.data.id }
          trigger:
            - call: "POST /eqp/retrofit-grants/${gr_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "rev-1"
              captures: { gr_status_1: $.data.status, gr_round: $.data.review_round }
            - call: "POST /eqp/retrofit-grants/${gr_id}/review"
              payload: { decision: "APPROVE" }
