              as: AffiliateOperator
              as_user_id: "${sv_b}"
              captures: { sv_e2: $.data.error_id }
            - call: "POST /affiliates/${sv_a}/agreements"
              payload: { term_start_date: "2027-01-01", term_end_date: "2027-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: AffiliateOperator
              as_user_id: "${sv_b}"
              captures: { sv_e3: $.data.error_id }
            - call: "POST /agreements/00000000-0000-4000-8000-000000000000/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${sv_b}"
              captures: { sv_e4: $.data.error_id }
            - call: "POST /agreements/${sv_agr_a}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${sv_a}"
