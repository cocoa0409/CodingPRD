            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-09T14:00:00.000Z", scheduled_end_at: "2026-08-09T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k1}", consultation_id: "${c1}", hold_start_at: "2026-08-03T09:00:00.000Z", hold_end_at: "2026-08-07T17:00:00.000Z" }
              as: Designer
