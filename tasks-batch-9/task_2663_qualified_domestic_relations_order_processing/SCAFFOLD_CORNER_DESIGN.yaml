              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0 }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Terminal Payee", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1975-05-05", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-LOCK", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
