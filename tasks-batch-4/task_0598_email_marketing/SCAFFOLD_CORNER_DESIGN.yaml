              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { av: $.data.version }
          trigger:
            - call: "POST /campaigns/${c1}/schedule"
              payload: { scheduled_at: "2026-05-02T10:00:00Z", send_window_minutes: 60, expected_account_version: "${av}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { rc: $.data.recipient_count, res: $.data.reserved_credit_count, charge: $.data.send_charge_cents, st: $.data.status }
          assert:
            - "${st} == \"SCHEDULED\""
            - "${rc} == 2"
            - "${res} == 2"
            - "${charge} == 6   # subtotal_raw = 2 * 2.8 = 5.6 -> discount tier <20 -> 0; surcharge 0 (score 100); round_half_up(5.6) = 6"
            - "Account.${acct}.send_credit_balance == 98"
            - "Account.${acct}.reserved_send_credits == 2"
            - "Account.${acct}.consumed_send_credits == 0"
