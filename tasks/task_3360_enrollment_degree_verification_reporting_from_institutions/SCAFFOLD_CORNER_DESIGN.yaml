        distinguishing_aspect: "Period transitions use strict > against due/grace: at now == submission_due_at the period is still OPEN, GRACE begins the day after, at now == grace_ends_at it is still GRACE, and one day later it CLOSES with outcome DELINQUENT when no file was ever certified."
