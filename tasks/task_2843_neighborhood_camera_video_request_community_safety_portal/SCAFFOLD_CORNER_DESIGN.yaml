            - "${dca1_devices} == 0 and ${dca1_sols} == 0"
            - "${dca2_type} == OPT_IN_TO_REQUESTS"
            - "${dca1_id} != ${dca2_id}"
            - "${dca_total} == 2"
            - "${dca_first_type} == OPT_OUT_OF_REQUESTS"
            - "neither DataControlAction response body contains a version field, and §1.5 declares no PATCH, PUT or DELETE endpoint under /neighborhood-safety/residents/{id}/data-control-actions"
            - "Resident.${r1_id}.data_sharing_opt_out == false after the OPT_IN_TO_REQUESTS action"

