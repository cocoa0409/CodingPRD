scenario: |
  529 College Savings Account Management: donor/beneficiary, state tax
  incentive matching, recurring/lump-sum contributions, qualified education
  expenses (K-12 annual cap), beneficiary change, excess withdrawal penalty,
  Form 1099-Q

domain_name: college-savings-529
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================
# §1.1 Entity-Relationship Table
# ============================================================
entities:
  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the account owner / contributor."
      - name: state_code
        type: enum
        source: input
        description: "Donor's tax-residence U.S. state. Determines which StateTaxIncentiveSchedule applies."
        constraints: "ISO subdivision code; one of {CA, NY, IL, TX, FL, OH}."
      - name: federal_tax_id_last4
        type: string
        source: input
        description: "Last four digits of SSN/ITIN; used on Form 1099-Q output."
        constraints: "exactly 4 digits."
      - name: email
        type: string
        source: input
        description: "Contact email; uniqueness enforced."
        constraints: "globally unique, case-insensitive."

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the designated beneficiary."
      - name: date_of_birth
        type: datetime
        source: input
        description: "ISO 8601 date; used to determine K-12 vs higher-ed eligibility."
      - name: relationship_class
        type: enum
        source: input
        description: "Family relationship class to the original beneficiary's lineage. Used by beneficiary-change rules."
        constraints: "one of {SELF, CHILD, SIBLING, FIRST_COUSIN, OTHER}."
      - name: federal_tax_id_last4
        type: string
        source: input
        description: "Last four digits of beneficiary's SSN/ITIN; used on Form 1099-Q output when recipient is the beneficiary."

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the account owner."
      - name: beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; currently designated beneficiary (mutable through APPROVED BeneficiaryChange)."
      - name: status
        type: enum
        source: computed
        description: "Aggregate posture of the account."
        constraints: "one of {OPEN, RESTRICTED, CLOSED}; initial OPEN."
      - name: total_basis_cents
        type: integer
        source: computed
        description: "Sum of all POSTED Contribution.amount_cents minus the basis portion of all DISBURSED Withdrawal entries. Used by earnings ratio."
        default: 0
      - name: total_earnings_cents
        type: integer
        source: computed
        description: "account_balance_cents - total_basis_cents. Conceptually the appreciation portion."
        default: 0
      - name: account_balance_cents
        type: integer
        source: computed
        description: "Sum of POSTED Contribution.amount_cents minus sum of DISBURSED Withdrawal.amount_cents."
        default: 0
      - name: ytd_qualified_k12_cents
        type: integer
        source: computed
        description: "Running calendar-year total of DISBURSED Withdrawal entries whose expense_class == K_12_TUITION."
        default: 0
      - name: tax_year
        type: integer
        source: computed
        description: "Current tax year used for YTD aggregations; advanced by /_clock when the calendar year rolls."

  - name: ScheduledContribution
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the target account."
      - name: amount_cents
        type: integer
        source: input
        description: "Per-period amount, in cents."
        constraints: "> 0; <= 5000000."
      - name: cadence
        type: enum
        source: input
        description: "Recurrence cadence."
        constraints: "one of {WEEKLY, MONTHLY, QUARTERLY}."
      - name: next_run_utc
        type: datetime
        source: computed
        description: "Next scheduled UTC execution time; advanced after each successful POSTED contribution."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status."
        constraints: "one of {ACTIVE, PAUSED, CANCELLED}; initial ACTIVE."
      - name: posted_runs
        type: integer
        source: computed
        description: "Count of POSTED contributions this schedule has produced."
        default: 0

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id."
      - name: amount_cents
        type: integer
        source: input
        description: "Contribution amount in cents."
        constraints: "> 0; <= 5000000."
      - name: contribution_kind
        type: enum
        source: input
        description: "LUMP_SUM (direct deposit) or RECURRING (auto-generated by ScheduledContribution)."
        constraints: "one of {LUMP_SUM, RECURRING}."
      - name: scheduled_contribution_id
        type: string
        source: input
        description: "FK -> ScheduledContribution.id; null for LUMP_SUM; set for RECURRING."
      - name: status
        type: enum
        source: computed
        description: "Posting status."
        constraints: "one of {DRAFT, POSTED, REVERSED}; initial DRAFT."
      - name: posted_at_utc
        type: datetime
        source: computed
        description: "ISO 8601 UTC timestamp when the contribution moved DRAFT->POSTED."
      - name: tax_year
        type: integer
        source: computed
        description: "Calendar year of posted_at_utc; pinned at POSTED transition."

  - name: Withdrawal
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id."
      - name: amount_cents
        type: integer
        source: input
        description: "Total requested withdrawal in cents."
        constraints: "> 0."
      - name: expense_class
        type: enum
        source: input
        description: "Stated qualified-expense category."
        constraints: "one of {HIGHER_ED_TUITION, ROOM_BOARD, BOOKS_SUPPLIES, K_12_TUITION, APPRENTICESHIP, NON_QUALIFIED}."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status."
        constraints: "one of {DRAFT, SUBMITTED, REJECTED, APPROVED, DISBURSED}; initial DRAFT."
      - name: basis_portion_cents
        type: integer
        source: computed
        description: "Computed via earnings-ratio at APPROVED transition; basis_portion + earnings_portion == amount_cents."
      - name: earnings_portion_cents
        type: integer
        source: computed
        description: "Computed via earnings-ratio at APPROVED transition."
      - name: penalty_cents
        type: integer
        source: computed
        description: "10% federal penalty on earnings_portion when expense_class == NON_QUALIFIED OR when K-12 cap excess; zero otherwise. Pinned at APPROVED transition."
        default: 0
      - name: k12_excess_cents
        type: integer
        source: computed
        description: "Portion of this withdrawal that pushes account.ytd_qualified_k12_cents above the K-12 cap; zero unless expense_class == K_12_TUITION."
        default: 0
      - name: tax_year
        type: integer
        source: computed
        description: "Calendar year of approved_at_utc; pinned at APPROVED transition."
      - name: approved_at_utc
        type: datetime
        source: computed
        description: "ISO 8601 UTC timestamp of APPROVED transition."
      - name: disbursed_at_utc
        type: datetime
        source: computed
        description: "ISO 8601 UTC timestamp of DISBURSED transition."
      - name: rejection_count
        type: integer
        source: computed
        description: "Number of times this withdrawal has cycled SUBMITTED->REJECTED->DRAFT->SUBMITTED."
        default: 0

  - name: BeneficiaryChange
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id."
      - name: from_beneficiary_id
        type: string
        source: computed
        description: "FK -> Beneficiary.id; snapshot of account.beneficiary_id at request time."
      - name: to_beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; proposed new beneficiary."
      - name: from_relationship_class
        type: enum
        source: computed
        description: "Snapshot of Beneficiary.relationship_class for from_beneficiary_id at request time."
        constraints: "one of {SELF, CHILD, SIBLING, FIRST_COUSIN, OTHER}."
      - name: to_relationship_class
        type: enum
        source: computed
        description: "Snapshot of Beneficiary.relationship_class for to_beneficiary_id at request time."
        constraints: "one of {SELF, CHILD, SIBLING, FIRST_COUSIN, OTHER}."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status."
        constraints: "one of {PENDING, APPROVED, REJECTED}; initial PENDING."
      - name: decided_at_utc
        type: datetime
        source: computed
        description: "ISO 8601 UTC of APPROVED or REJECTED transition."

  - name: StateTaxIncentive
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the contributing donor."
      - name: tax_year
        type: integer
        source: input
        description: "Calendar tax year this incentive applies to."
      - name: contributions_eligible_cents
        type: integer
        source: computed
        description: "Sum of POSTED Contribution.amount_cents across donor's accounts where contribution.tax_year == this.tax_year."
        default: 0
      - name: match_cents
        type: integer
        source: computed
        description: "State match in cents; computed via state_tax_incentive_match formula. Pinned when status moves CALCULATED."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status."
        constraints: "one of {DRAFT, CALCULATED, FINALIZED}; initial DRAFT."

  - name: Form1099Q
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id."
      - name: tax_year
        type: integer
        source: input
        description: "Calendar tax year covered by the form."
      - name: gross_distribution_cents
        type: integer
        source: computed
        description: "Sum of Withdrawal.amount_cents (DISBURSED) for the account where withdrawal.tax_year == this.tax_year."
        default: 0
      - name: earnings_cents
        type: integer
        source: computed
        description: "Sum of Withdrawal.earnings_portion_cents (DISBURSED) for the account where withdrawal.tax_year == this.tax_year."
        default: 0
      - name: basis_cents
        type: integer
        source: computed
        description: "Sum of Withdrawal.basis_portion_cents (DISBURSED) for the account where withdrawal.tax_year == this.tax_year."
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: "Sum of Withdrawal.penalty_cents (DISBURSED) for the account where withdrawal.tax_year == this.tax_year."
        default: 0
      - name: recipient_kind
        type: enum
        source: computed
        description: "Determines whose tax_id_last4 prints. ACCOUNT_OWNER when any DISBURSED withdrawal had expense_class == NON_QUALIFIED for this tax_year; BENEFICIARY otherwise."
        constraints: "one of {ACCOUNT_OWNER, BENEFICIARY}."
      - name: recipient_tax_id_last4
        type: string
        source: computed
        description: "Snapshot of Donor.federal_tax_id_last4 or Beneficiary.federal_tax_id_last4 per recipient_kind, pinned at ISSUED."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status."
        constraints: "one of {DRAFT, ISSUED, CORRECTED, REISSUED}; initial DRAFT."
      - name: issued_at_utc
        type: datetime
        source: computed
        description: "ISO 8601 UTC of ISSUED transition."
      - name: supersedes_form_id
        type: string
        source: computed
        description: "FK -> Form1099Q.id; for REISSUED, points to the CORRECTED form being replaced; null otherwise."

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: input
        description: "Test-driving system clock; ISO 8601 UTC with millisecond precision."

# ============================================================
# §1.2 State Machine Table
# ============================================================
state_machines:
  - entity: Account
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /accounts/{id}/restrict (ComplianceOfficer)"
        actor: ComplianceOfficer
        preconditions:
          - "account.status == OPEN"
        side_effects:
          - "Account.status = RESTRICTED"
          - "Account.version += 1"
        note: "Compliance hold; blocks new Withdrawals and new ScheduledContributions but allows existing recurring contributions to continue posting."
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /accounts/{id}/release (ComplianceOfficer)"
        actor: ComplianceOfficer
        preconditions:
          - "account.status == RESTRICTED"
        side_effects:
          - "Account.status = OPEN"
          - "Account.version += 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /accounts/{id}/close (AccountOwner)"
        actor: AccountOwner
        preconditions:
          - "account.status == OPEN"
          - "account.account_balance_cents == 0"
          - "no ScheduledContribution where account_id == account.id and status == ACTIVE"
          - "no Withdrawal where account_id == account.id and status IN {SUBMITTED, APPROVED}"
          - "no BeneficiaryChange where account_id == account.id and status == PENDING"
        side_effects:
          - "Account.status = CLOSED"
          - "Account.version += 1"

  - entity: ScheduledContribution
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /scheduled-contributions/{id}/pause (AccountOwner)"
        actor: AccountOwner
        preconditions:
          - "schedule.status == ACTIVE"
          - "Account.status IN {OPEN, RESTRICTED}"
        side_effects:
          - "ScheduledContribution.status = PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /scheduled-contributions/{id}/resume (AccountOwner)"
        actor: AccountOwner
        preconditions:
          - "schedule.status == PAUSED"
          - "Account.status == OPEN"
        side_effects:
          - "ScheduledContribution.status = ACTIVE"
          - "ScheduledContribution.next_run_utc = ClockState.current_utc + cadence interval"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /scheduled-contributions/{id}/cancel (AccountOwner)"
        actor: AccountOwner
        preconditions:
          - "schedule.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "ScheduledContribution.status = CANCELLED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /scheduled-contributions/{id}/cancel (AccountOwner)"
        actor: AccountOwner
        preconditions:
          - "schedule.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "ScheduledContribution.status = CANCELLED"

  - entity: Contribution
    initial_state: DRAFT
    terminal_states: [POSTED, REVERSED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /contributions/{id}/post (CustodianAgent) OR POST /_scheduler/tick (system) for RECURRING"
        actor: CustodianAgent
        preconditions:
          - "Account.status IN {OPEN, RESTRICTED}"
          - "(contribution.contribution_kind == LUMP_SUM) OR (contribution.scheduled_contribution_id is not null AND ScheduledContribution.status == ACTIVE)"
        side_effects:
          - "Contribution.status = POSTED"
          - "Contribution.posted_at_utc = ClockState.current_utc"
          - "Contribution.tax_year = year(ClockState.current_utc)"
          - "Account.account_balance_cents += contribution.amount_cents (recomputed)"
          - "Account.total_basis_cents += contribution.amount_cents (recomputed)"
          - "Account.total_earnings_cents = account_balance_cents - total_basis_cents (recomputed)"
          - "Account.version += 1"
          - "If contribution.scheduled_contribution_id is not null: ScheduledContribution.posted_runs += 1; ScheduledContribution.next_run_utc = posted_at_utc + cadence interval"
          - "StateTaxIncentive where donor_id == Account.donor_id AND tax_year == Contribution.tax_year: contributions_eligible_cents recomputed (full re-aggregation)"
      - from: POSTED
        to: REVERSED
        trigger: "POST /contributions/{id}/reverse (CustodianAgent)"
        actor: CustodianAgent
        preconditions:
          - "contribution.status == POSTED"
          - "Account.status IN {OPEN, RESTRICTED}"
          - "ClockState.current_utc - contribution.posted_at_utc < 72 hours"
          - "(account.account_balance_cents - contribution.amount_cents) >= sum of Withdrawal.amount_cents for APPROVED-but-not-DISBURSED withdrawals on this account"
        side_effects:
          - "Contribution.status = REVERSED"
          - "Account recomputed: account_balance_cents, total_basis_cents, total_earnings_cents"
          - "Account.version += 1"
          - "StateTaxIncentive recomputed for (donor_id, contribution.tax_year)"

  - entity: Withdrawal
    initial_state: DRAFT
    terminal_states: [DISBURSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /withdrawals/{id}/submit (AccountOwner)"
        actor: AccountOwner
        preconditions:
          - "Account.status == OPEN"
          - "no BeneficiaryChange where account_id == account.id and status == PENDING"
          - "withdrawal.amount_cents <= Account.account_balance_cents"
        side_effects:
          - "Withdrawal.status = SUBMITTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /withdrawals/{id}/reject (ComplianceOfficer)"
        actor: ComplianceOfficer
        preconditions:
          - "withdrawal.status == SUBMITTED"
        side_effects:
          - "Withdrawal.status = REJECTED"
          - "Withdrawal.rejection_count += 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /withdrawals/{id}/revise (AccountOwner)"
        actor: AccountOwner
        preconditions:
          - "withdrawal.status == REJECTED"
          - "withdrawal.rejection_count < 3"
        side_effects:
          - "Withdrawal.status = DRAFT"
          - "Account.status remains unchanged"
        note: "Branching-with-revert: rejected withdrawals loop back to DRAFT up to 3 times."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /withdrawals/{id}/approve (ComplianceOfficer)"
        actor: ComplianceOfficer
        preconditions:
          - "withdrawal.status == SUBMITTED"
          - "Account.status == OPEN"
          - "withdrawal.amount_cents <= Account.account_balance_cents"
          - "request.expected_account_version == Account.version"
        side_effects:
          - "Withdrawal.status = APPROVED"
          - "Withdrawal.approved_at_utc = ClockState.current_utc"
          - "Withdrawal.tax_year = year(approved_at_utc)"
          - "Withdrawal.basis_portion_cents, .earnings_portion_cents computed via earnings_ratio (see §1.3)"
          - "Withdrawal.k12_excess_cents computed via k12_excess_calc (see §1.3)"
          - "Withdrawal.penalty_cents computed via excess_withdrawal_penalty (see §1.3)"
          - "Account.version += 1"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /withdrawals/{id}/disburse (CustodianAgent)"
        actor: CustodianAgent
        preconditions:
          - "withdrawal.status == APPROVED"
          - "Account.status == OPEN"
        side_effects:
          - "Withdrawal.status = DISBURSED"
          - "Withdrawal.disbursed_at_utc = ClockState.current_utc"
          - "Account.account_balance_cents -= withdrawal.amount_cents (recomputed)"
          - "Account.total_basis_cents -= withdrawal.basis_portion_cents (recomputed)"
          - "Account.total_earnings_cents = account_balance_cents - total_basis_cents (recomputed)"
          - "If withdrawal.expense_class == K_12_TUITION: Account.ytd_qualified_k12_cents += (withdrawal.amount_cents - withdrawal.k12_excess_cents)"
          - "Account.version += 1"
          - "Form1099Q where account_id == account.id AND tax_year == withdrawal.tax_year AND status == DRAFT: aggregates recomputed (gross_distribution_cents, earnings_cents, basis_cents, penalty_cents, recipient_kind)"

  - entity: BeneficiaryChange
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /beneficiary-changes/{id}/approve (ComplianceOfficer)"
        actor: ComplianceOfficer
        preconditions:
          - "change.status == PENDING"
          - "Account.status == OPEN"
          - "Beneficiary[to_beneficiary_id] exists"
          - "to_relationship_class IN {SELF, CHILD, SIBLING, FIRST_COUSIN}"
          - "request.expected_account_version == Account.version"
        side_effects:
          - "BeneficiaryChange.status = APPROVED"
          - "BeneficiaryChange.decided_at_utc = ClockState.current_utc"
          - "Account.beneficiary_id = change.to_beneficiary_id"
          - "Account.version += 1"
        note: "Branching: PENDING → {APPROVED, REJECTED}. The APPROVED branch mutates Account.beneficiary_id; the REJECTED branch leaves it untouched."
      - from: PENDING
        to: REJECTED
        trigger: "POST /beneficiary-changes/{id}/reject (ComplianceOfficer)"
        actor: ComplianceOfficer
        preconditions:
          - "change.status == PENDING"
        side_effects:
          - "BeneficiaryChange.status = REJECTED"
          - "BeneficiaryChange.decided_at_utc = ClockState.current_utc"

  - entity: Form1099Q
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /forms-1099q/{id}/issue (SystemTaxAuthority)"
        actor: SystemTaxAuthority
        preconditions:
          - "form.status == DRAFT"
          - "ClockState.current_utc >= ISO8601(form.tax_year + 1, 01, 01)"
          - "Account.status IN {OPEN, RESTRICTED, CLOSED}"
        side_effects:
          - "Form1099Q.status = ISSUED"
          - "Form1099Q.issued_at_utc = ClockState.current_utc"
          - "Form1099Q aggregates re-snapshotted (gross_distribution_cents, earnings_cents, basis_cents, penalty_cents, recipient_kind, recipient_tax_id_last4) and FROZEN"
      - from: ISSUED
        to: CORRECTED
        trigger: "POST /forms-1099q/{id}/correct (SystemTaxAuthority)"
        actor: SystemTaxAuthority
        preconditions:
          - "form.status == ISSUED"
          - "form.tax_year >= ClockState.current_utc.year - 3"
        side_effects:
          - "Form1099Q.status = CORRECTED"
        note: "Marks the issued form as superseded; a successor REISSUED form will be created in the same call."
      - from: DRAFT
        to: REISSUED
        trigger: "POST /forms-1099q (auto-created by the /correct call above)"
        actor: SystemTaxAuthority
        preconditions:
          - "form.status == DRAFT (a freshly-minted Form1099Q)"
          - "supersedes_form_id refers to a CORRECTED Form1099Q"
        side_effects:
          - "Form1099Q.status = REISSUED"
          - "Form1099Q.issued_at_utc = ClockState.current_utc"
          - "All aggregate fields recomputed from current DISBURSED Withdrawal data"
        note: "Cyclic shape: ISSUED -> CORRECTED, then a new form spawned and immediately REISSUED. Same form_id can never re-enter DRAFT, but the tuple (account_id, tax_year) cycles DRAFT -> ISSUED -> CORRECTED + new DRAFT -> REISSUED."

# §1.2.1 Concurrency Rules
concurrency_rules:
  - rule_id: withdrawal-approve-stale-account
    parent_entity: Account
    write_endpoint: "POST /withdrawals/{id}/approve"
    occ_field: "expected_account_version"
    description: |
      Approving a Withdrawal against an Account whose version has advanced since
      the ComplianceOfficer last observed it is rejected. A second contribution
      or an unrelated approval may have legitimately changed the balance/basis
      between the officer's read and the approve call; approving on a stale
      view would pin earnings_ratio against outdated totals.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: beneficiary-change-approve-stale-account
    parent_entity: Account
    write_endpoint: "POST /beneficiary-changes/{id}/approve"
    occ_field: "expected_account_version"
    description: |
      Approving a BeneficiaryChange against an Account whose version has advanced
      since the ComplianceOfficer last observed it is rejected. Another approved
      change (or a posture transition) may have legitimately superseded the
      account's beneficiary in the interim.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# ============================================================
# §1.3 Calculation Rules Table
# ============================================================
calculations:
  - name: earnings_ratio
    trigger: "Withdrawal SUBMITTED -> APPROVED transition"
    algorithm: weighted_scoring
    formula: |
      # Split a withdrawal into basis and earnings portions using the account's
      # pre-withdrawal ratio. Order of evaluation is FIXED:
      #   1. earnings_portion_cents = round_half_up(
      #          amount_cents * total_earnings_cents / account_balance_cents
      #      )    # per-withdrawal rounding, NOT sum-then-round
      #   2. basis_portion_cents = amount_cents - earnings_portion_cents
      # When account_balance_cents == 0 the withdrawal would already have been
      # rejected by the precondition; this calc is not invoked.
      # When total_earnings_cents <= 0, earnings_portion_cents := 0 and
      # basis_portion_cents := amount_cents.
    input_set: |
      Account.account_balance_cents and Account.total_earnings_cents
      observed immediately before the transition (i.e., after all prior
      POSTED contributions and all prior DISBURSED withdrawals).
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up per-withdrawal"
    variants:
      - name: pre_disbursal
        when: "computed at SUBMITTED -> APPROVED transition"
        difference: "uses Account balances at the APPROVED instant"
      - name: post_disbursal_audit
        when: "GET /withdrawals/{id}/audit recomputes against current Account balances"
        difference: |
          Recomputes basis/earnings split against CURRENT account totals
          (after this and any subsequent withdrawals have already updated the
          ledger). Produces a DIFFERENT split from the pinned values when a
          later DISBURSED withdrawal or new Contribution has shifted the
          basis/earnings mix. The pinned fields on the Withdrawal row are
          NOT mutated.

  - name: excess_withdrawal_penalty
    trigger: "Withdrawal SUBMITTED -> APPROVED transition"
    algorithm: threshold
    formula: |
      # The 10% federal excess-withdrawal penalty applies to the earnings
      # portion of any non-qualified distribution AND to the earnings portion
      # of the K-12 excess. Order of evaluation is FIXED:
      #
      #   penalty_base_cents :=
      #       (expense_class == NON_QUALIFIED) ?
      #           earnings_portion_cents :
      #       (expense_class == K_12_TUITION AND k12_excess_cents > 0) ?
      #           round_half_up(earnings_portion_cents * k12_excess_cents / amount_cents) :
      #           0
      #
      #   penalty_cents := round_half_up(penalty_base_cents * 0.10)
      #
      # Both rounding steps are round_half_up on integer cents.
    input_set: "Withdrawal.amount_cents, earnings_portion_cents, expense_class, k12_excess_cents"
    constants:
      FEDERAL_PENALTY_RATE: 0.10
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up per step"

  - name: k12_excess_calc
    trigger: "Withdrawal SUBMITTED -> APPROVED transition (only when expense_class == K_12_TUITION)"
    algorithm: threshold
    formula: |
      # K-12 tuition has an annual cap of $10,000 (1,000,000 cents) per
      # beneficiary per calendar year. The cap is enforced against
      # Account.ytd_qualified_k12_cents which only counts the qualified
      # portion of previously DISBURSED K-12 withdrawals.
      #
      #   projected := Account.ytd_qualified_k12_cents + amount_cents
      #   k12_excess_cents :=
      #       max(0, projected - K12_ANNUAL_CAP_CENTS)
      #
      # When expense_class != K_12_TUITION, k12_excess_cents := 0.
      #
      # Boundary: projected == K12_ANNUAL_CAP_CENTS (exactly 1,000,000)
      # yields k12_excess_cents == 0 (cap is inclusive of equality).
    input_set: "Account.ytd_qualified_k12_cents (current), Withdrawal.amount_cents, Withdrawal.expense_class"
    constants:
      K12_ANNUAL_CAP_CENTS: 1000000

  - name: state_tax_incentive_match
    trigger: "POST /state-tax-incentives/{id}/calculate (CustodianAgent)"
    algorithm: tiered_pricing
    formula: |
      # State match is computed against contributions_eligible_cents using
      # a per-state tiered schedule. The two states pinned in the seed scaffold:
      #
      # CA (tier-cap-then-rate):
      #   eligible := min(contributions_eligible_cents, CA_CAP_CENTS)
      #   match := round_half_up(eligible * CA_RATE)
      #   CA_CAP_CENTS = 600000   # $6,000
      #   CA_RATE      = 0.10     # 10%
      #
      # NY (tiered marginal):
      #   tier1 := min(contributions_eligible_cents, NY_TIER1_CENTS)
      #   tier2 := max(0,
      #               min(contributions_eligible_cents, NY_TIER2_CENTS)
      #               - NY_TIER1_CENTS)
      #   match := round_half_up(tier1 * NY_TIER1_RATE) +
      #            round_half_up(tier2 * NY_TIER2_RATE)
      #   NY_TIER1_CENTS = 500000   # $5,000
      #   NY_TIER2_CENTS = 1000000  # $10,000 absolute upper bound
      #   NY_TIER1_RATE  = 0.05
      #   NY_TIER2_RATE  = 0.02
      #
      # All other states pinned by validation: ZERO match
      # (CA and NY are the only schedules in scope for this scaffold).
      #
      # Per-tier rounding (round each tier then sum), NOT sum-then-round.
      # Pinned order: tier1 first, then tier2. Tie-break: none needed because
      # rates and tiers are pre-pinned.
    input_set: "StateTaxIncentive.contributions_eligible_cents and Donor.state_code"
    constants:
      CA_CAP_CENTS: 600000
      CA_RATE: 0.10
      NY_TIER1_CENTS: 500000
      NY_TIER1_RATE: 0.05
      NY_TIER2_CENTS: 1000000
      NY_TIER2_RATE: 0.02
      ROUNDING: round_half_up

# ============================================================
# §1.4 Validation Rules Table
# ============================================================
validations:
  # ---- 1. Authentication ----
  - priority: 1
    category: auth
    check: "X-User-Role header present and recognized."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # ---- 2. Authorization ----
  - priority: 2
    category: auth
    check: "Caller's role is listed in endpoint.roles."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: |
      Segregation-of-duties: the same X-User-ID MUST NOT both submit
      (DRAFT->SUBMITTED) and approve (SUBMITTED->APPROVED) the same
      Withdrawal. Likewise the same X-User-ID MUST NOT both create
      (PENDING) and approve (PENDING->APPROVED) the same BeneficiaryChange.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /withdrawals/{id}/approve, POST /beneficiary-changes/{id}/approve"

  # ---- 3. Existence ----
  - priority: 4
    category: existence
    check: "Path-templated resources resolve, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Referenced FK ids in body resolve."
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: all

  # ---- 4. State preconditions ----
  - priority: 6
    category: state
    check: "Target entity's current state allows the requested transition (per §1.2 from-state list)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transitioning endpoints"

  - priority: 7
    category: state
    check: |
      OCC: every write whose endpoint declares expected_account_version
      MUST match Account.version.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /withdrawals/{id}/approve, POST /beneficiary-changes/{id}/approve"

  # ---- 5. Business — safety / regulatory ----
  - priority: 8
    category: business_safety
    check: |
      Beneficiary-change relationship_class: to_relationship_class MUST be in
      {SELF, CHILD, SIBLING, FIRST_COUSIN}. OTHER is rejected (IRS family
      member rule).
    error_id: ERR_BENEFICIARY_NOT_FAMILY_MEMBER
    http_status: 422
    applies_to: "POST /beneficiary-changes, POST /beneficiary-changes/{id}/approve"

  - priority: 9
    category: business_safety
    check: |
      Form1099Q can only be ISSUED on or after Jan 1 of (tax_year + 1).
      Pre-year-end issuance is forbidden.
    error_id: ERR_FORM_PREMATURE_ISSUANCE
    http_status: 422
    applies_to: "POST /forms-1099q/{id}/issue"

  - priority: 10
    category: business_safety
    check: |
      Form1099Q corrections are bounded: form.tax_year MUST be within the
      last 3 calendar years inclusive of the current clock year.
    error_id: ERR_FORM_CORRECTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /forms-1099q/{id}/correct"

  # ---- 6. Business — referential / configuration ----
  - priority: 11
    category: business_referential
    check: |
      Donor.state_code MUST be one of {CA, NY, IL, TX, FL, OH}. IL/TX/FL/OH
      have no matching schedule (match = 0); CA/NY use the schedules in §1.3.
    error_id: ERR_UNSUPPORTED_STATE_CODE
    http_status: 422
    applies_to: "POST /donors"

  - priority: 12
    category: business_referential
    check: |
      Donor.email is globally unique (case-insensitive). Duplicate creates
      are rejected.
    error_id: ERR_EMAIL_TAKEN
    http_status: 409
    applies_to: "POST /donors"

  - priority: 13
    category: business_referential
    check: |
      Form1099Q (account_id, tax_year, status IN {DRAFT, ISSUED, REISSUED})
      is uniquely keyed. A second DRAFT for the same (account_id, tax_year)
      is rejected unless the previous one has been CORRECTED.
    error_id: ERR_FORM_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /forms-1099q"

  - priority: 14
    category: business_referential
    check: |
      StateTaxIncentive (donor_id, tax_year) is uniquely keyed.
    error_id: ERR_INCENTIVE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /state-tax-incentives"

  # ---- 7. Business — fiscal ----
  - priority: 15
    category: business_fiscal
    check: |
      Withdrawal.amount_cents MUST be <= Account.account_balance_cents at
      both SUBMITTED and APPROVED time.
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /withdrawals/{id}/submit, POST /withdrawals/{id}/approve"

  - priority: 16
    category: business_fiscal
    check: |
      Withdrawal.rejection_count MUST be < 3 to revise. A fourth revision
      attempt is rejected.
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /withdrawals/{id}/revise"

  - priority: 17
    category: business_fiscal
    check: |
      Contribution reverse window: ClockState.current_utc - posted_at_utc
      MUST be < 72 hours.
    error_id: ERR_REVERSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /contributions/{id}/reverse"

  # ---- 8. Business — request shape ----
  - priority: 18
    category: business_constraint
    check: "All required input fields per endpoint.input present and well-typed."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# ============================================================
# §1.5 API Endpoint Table
# ============================================================
endpoints:
  # --- Donors ---
  - method: POST
    path: "/donors"
    description: "Create a Donor (account-owning contributor)."
    roles: [CustodianAgent]
    code: 201
    input: [full_name, state_code, federal_tax_id_last4, email]
    output: Donor
    side_effects: []

  - method: GET
    path: "/donors/{id}"
    description: "Fetch a Donor by id."
    roles: [CustodianAgent, AccountOwner, ComplianceOfficer]
    code: 200
    input: []
    output: Donor
    side_effects: []

  - method: GET
    path: "/donors"
    description: "List Donors with pagination."
    roles: [CustodianAgent, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Donor[]
    side_effects: []

  # --- Beneficiaries ---
  - method: POST
    path: "/beneficiaries"
    description: "Create a Beneficiary."
    roles: [CustodianAgent]
    code: 201
    input: [full_name, date_of_birth, relationship_class, federal_tax_id_last4]
    output: Beneficiary
    side_effects: []

  - method: GET
    path: "/beneficiaries/{id}"
    description: "Fetch a Beneficiary by id."
    roles: [CustodianAgent, AccountOwner, ComplianceOfficer]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: GET
    path: "/beneficiaries"
    description: "List Beneficiaries with pagination."
    roles: [CustodianAgent, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Beneficiary[]
    side_effects: []

  # --- Accounts ---
  - method: POST
    path: "/accounts"
    description: "Open a 529 Account. Initial status OPEN."
    roles: [CustodianAgent]
    code: 201
    input: [donor_id, beneficiary_id]
    output: Account
    side_effects:
      - "Account.status = OPEN"
      - "All computed cents fields initialised to 0"

  - method: GET
    path: "/accounts/{id}"
    description: "Fetch an Account."
    roles: [CustodianAgent, AccountOwner, ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List Accounts; supports filtering by donor_id and beneficiary_id."
    roles: [CustodianAgent, ComplianceOfficer]
    code: 200
    input: ["donor_id?", "beneficiary_id?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/restrict"
    description: "Place account on compliance hold."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Account.status: OPEN -> RESTRICTED"
      - "Account.version += 1"

  - method: POST
    path: "/accounts/{id}/release"
    description: "Release compliance hold."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Account.status: RESTRICTED -> OPEN"
      - "Account.version += 1"

  - method: POST
    path: "/accounts/{id}/close"
    description: "Close a fully drained account."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Account.status: OPEN -> CLOSED"
      - "Account.version += 1"

  # --- Scheduled Contributions ---
  - method: POST
    path: "/scheduled-contributions"
    description: "Create a recurring contribution schedule."
    roles: [AccountOwner]
    code: 201
    input: [account_id, amount_cents, cadence]
    output: ScheduledContribution
    side_effects:
      - "ScheduledContribution.status = ACTIVE"
      - "ScheduledContribution.next_run_utc = ClockState.current_utc + cadence interval"

  - method: GET
    path: "/scheduled-contributions/{id}"
    description: "Fetch a schedule."
    roles: [AccountOwner, CustodianAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ScheduledContribution
    side_effects: []

  - method: GET
    path: "/scheduled-contributions"
    description: "List schedules; filter by account_id."
    roles: [AccountOwner, CustodianAgent, ComplianceOfficer]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: ScheduledContribution[]
    side_effects: []

  - method: POST
    path: "/scheduled-contributions/{id}/pause"
    description: "Pause an ACTIVE schedule."
    roles: [AccountOwner]
    code: 200
    input: []
    output: ScheduledContribution
    side_effects:
      - "ScheduledContribution.status: ACTIVE -> PAUSED"

  - method: POST
    path: "/scheduled-contributions/{id}/resume"
    description: "Resume a PAUSED schedule."
    roles: [AccountOwner]
    code: 200
    input: []
    output: ScheduledContribution
    side_effects:
      - "ScheduledContribution.status: PAUSED -> ACTIVE"
      - "ScheduledContribution.next_run_utc reset"

  - method: POST
    path: "/scheduled-contributions/{id}/cancel"
    description: "Cancel a schedule."
    roles: [AccountOwner]
    code: 200
    input: []
    output: ScheduledContribution
    side_effects:
      - "ScheduledContribution.status: {ACTIVE,PAUSED} -> CANCELLED"

  # --- Contributions ---
  - method: POST
    path: "/contributions"
    description: "Create a DRAFT Contribution (LUMP_SUM or RECURRING)."
    roles: [CustodianAgent]
    code: 201
    input: [account_id, amount_cents, contribution_kind, "scheduled_contribution_id?"]
    output: Contribution
    side_effects:
      - "Contribution.status = DRAFT"

  - method: POST
    path: "/contributions/{id}/post"
    description: "Post a contribution; advances Account ledger."
    roles: [CustodianAgent]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "Contribution.status: DRAFT -> POSTED"
      - "Account ledger fields recomputed"
      - "Account.version += 1"
      - "StateTaxIncentive aggregate recomputed"

  - method: POST
    path: "/contributions/{id}/reverse"
    description: "Reverse a contribution within 72h."
    roles: [CustodianAgent]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "Contribution.status: POSTED -> REVERSED"
      - "Account ledger fields recomputed"
      - "Account.version += 1"
      - "StateTaxIncentive aggregate recomputed"

  - method: GET
    path: "/contributions/{id}"
    description: "Fetch a contribution."
    roles: [CustodianAgent, AccountOwner, ComplianceOfficer]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: GET
    path: "/contributions"
    description: "List contributions; filter by account_id, scheduled_contribution_id."
    roles: [CustodianAgent, AccountOwner, ComplianceOfficer]
    code: 200
    input: ["account_id?", "scheduled_contribution_id?", "limit?", "offset?"]
    output: Contribution[]
    side_effects: []

  # --- Withdrawals ---
  - method: POST
    path: "/withdrawals"
    description: "Create a DRAFT Withdrawal."
    roles: [AccountOwner]
    code: 201
    input: [account_id, amount_cents, expense_class]
    output: Withdrawal
    side_effects:
      - "Withdrawal.status = DRAFT"

  - method: POST
    path: "/withdrawals/{id}/submit"
    description: "Submit a DRAFT withdrawal for review."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Withdrawal
    side_effects:
      - "Withdrawal.status: DRAFT -> SUBMITTED"

  - method: POST
    path: "/withdrawals/{id}/reject"
    description: "Reject a SUBMITTED withdrawal."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Withdrawal
    side_effects:
      - "Withdrawal.status: SUBMITTED -> REJECTED"
      - "Withdrawal.rejection_count += 1"

  - method: POST
    path: "/withdrawals/{id}/revise"
    description: "Return a REJECTED withdrawal to DRAFT for editing (max 3 cycles)."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Withdrawal
    side_effects:
      - "Withdrawal.status: REJECTED -> DRAFT"

  - method: POST
    path: "/withdrawals/{id}/approve"
    description: "Approve a SUBMITTED withdrawal; pins basis/earnings/penalty."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_account_version]
    output: Withdrawal
    side_effects:
      - "Withdrawal.status: SUBMITTED -> APPROVED"
      - "Withdrawal.basis_portion_cents, earnings_portion_cents pinned (earnings_ratio)"
      - "Withdrawal.k12_excess_cents pinned (k12_excess_calc)"
      - "Withdrawal.penalty_cents pinned (excess_withdrawal_penalty)"
      - "Account.version += 1"

  - method: POST
    path: "/withdrawals/{id}/disburse"
    description: "Disburse an APPROVED withdrawal; updates ledger and Form1099Q DRAFT."
    roles: [CustodianAgent]
    code: 200
    input: []
    output: Withdrawal
    side_effects:
      - "Withdrawal.status: APPROVED -> DISBURSED"
      - "Account ledger updated"
      - "Account.ytd_qualified_k12_cents incremented when expense_class == K_12_TUITION"
      - "Account.version += 1"
      - "Form1099Q DRAFT aggregates recomputed for matching (account_id, tax_year)"

  - method: GET
    path: "/withdrawals/{id}"
    description: "Fetch a withdrawal."
    roles: [AccountOwner, CustodianAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Withdrawal
    side_effects: []

  - method: GET
    path: "/withdrawals/{id}/audit"
    description: "Recompute the basis/earnings split against CURRENT Account totals; returns the post_disbursal_audit variant of earnings_ratio. The pinned Withdrawal fields are NOT mutated."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Withdrawal
    side_effects: []

  - method: GET
    path: "/withdrawals"
    description: "List withdrawals; filter by account_id."
    roles: [AccountOwner, CustodianAgent, ComplianceOfficer]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Withdrawal[]
    side_effects: []

  # --- Beneficiary changes ---
  - method: POST
    path: "/beneficiary-changes"
    description: "Create a PENDING BeneficiaryChange."
    roles: [AccountOwner]
    code: 201
    input: [account_id, to_beneficiary_id]
    output: BeneficiaryChange
    side_effects:
      - "BeneficiaryChange.status = PENDING"
      - "from_beneficiary_id, from_relationship_class, to_relationship_class snapshotted"

  - method: POST
    path: "/beneficiary-changes/{id}/approve"
    description: "Approve a PENDING BeneficiaryChange; mutates Account.beneficiary_id."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_account_version]
    output: BeneficiaryChange
    side_effects:
      - "BeneficiaryChange.status: PENDING -> APPROVED"
      - "Account.beneficiary_id = to_beneficiary_id"
      - "Account.version += 1"

  - method: POST
    path: "/beneficiary-changes/{id}/reject"
    description: "Reject a PENDING BeneficiaryChange."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BeneficiaryChange
    side_effects:
      - "BeneficiaryChange.status: PENDING -> REJECTED"

  - method: GET
    path: "/beneficiary-changes/{id}"
    description: "Fetch a beneficiary change."
    roles: [AccountOwner, ComplianceOfficer]
    code: 200
    input: []
    output: BeneficiaryChange
    side_effects: []

  - method: GET
    path: "/beneficiary-changes"
    description: "List beneficiary changes; filter by account_id, to_beneficiary_id, from_beneficiary_id."
    roles: [AccountOwner, ComplianceOfficer]
    code: 200
    input: ["account_id?", "to_beneficiary_id?", "from_beneficiary_id?", "limit?", "offset?"]
    output: BeneficiaryChange[]
    side_effects: []

  # --- State tax incentives ---
  - method: POST
    path: "/state-tax-incentives"
    description: "Create a DRAFT StateTaxIncentive for (donor_id, tax_year)."
    roles: [CustodianAgent]
    code: 201
    input: [donor_id, tax_year]
    output: StateTaxIncentive
    side_effects:
      - "StateTaxIncentive.status = DRAFT"
      - "contributions_eligible_cents aggregated"

  - method: POST
    path: "/state-tax-incentives/{id}/calculate"
    description: "Run state_tax_incentive_match; transitions DRAFT -> CALCULATED."
    roles: [CustodianAgent]
    code: 200
    input: []
    output: StateTaxIncentive
    side_effects:
      - "StateTaxIncentive.match_cents pinned"
      - "StateTaxIncentive.status: DRAFT -> CALCULATED"

  - method: POST
    path: "/state-tax-incentives/{id}/finalize"
    description: "Lock a CALCULATED incentive; transitions CALCULATED -> FINALIZED."
    roles: [CustodianAgent]
    code: 200
    input: []
    output: StateTaxIncentive
    side_effects:
      - "StateTaxIncentive.status: CALCULATED -> FINALIZED"

  - method: GET
    path: "/state-tax-incentives/{id}"
    description: "Fetch a state tax incentive."
    roles: [CustodianAgent, AccountOwner]
    code: 200
    input: []
    output: StateTaxIncentive
    side_effects: []

  - method: GET
    path: "/state-tax-incentives"
    description: "List incentives; filter by donor_id and/or tax_year."
    roles: [CustodianAgent, ComplianceOfficer]
    code: 200
    input: ["donor_id?", "tax_year?", "limit?", "offset?"]
    output: StateTaxIncentive[]
    side_effects: []

  # --- Form 1099-Q ---
  - method: POST
    path: "/forms-1099q"
    description: "Create a DRAFT Form1099Q for (account_id, tax_year); aggregates auto-populated."
    roles: [SystemTaxAuthority]
    code: 201
    input: [account_id, tax_year, "supersedes_form_id?"]
    output: Form1099Q
    side_effects:
      - "Form1099Q.status = DRAFT"
      - "Aggregates computed from current DISBURSED Withdrawal data"

  - method: POST
    path: "/forms-1099q/{id}/issue"
    description: "Issue (freeze) a DRAFT Form1099Q on or after Jan 1 of (tax_year + 1)."
    roles: [SystemTaxAuthority]
    code: 200
    input: []
    output: Form1099Q
    side_effects:
      - "Form1099Q.status: DRAFT -> ISSUED"
      - "All aggregate fields and recipient_tax_id_last4 frozen"

  - method: POST
    path: "/forms-1099q/{id}/correct"
    description: "Mark an ISSUED form as CORRECTED; spawns a successor REISSUED form with current data."
    roles: [SystemTaxAuthority]
    code: 200
    input: []
    output: Form1099Q
    side_effects:
      - "Form1099Q.status: ISSUED -> CORRECTED"
      - "A new Form1099Q row is created with status = REISSUED, supersedes_form_id = this.id, aggregates recomputed"

  - method: GET
    path: "/forms-1099q/{id}"
    description: "Fetch a Form 1099-Q."
    roles: [SystemTaxAuthority, AccountOwner, ComplianceOfficer]
    code: 200
    input: []
    output: Form1099Q
    side_effects: []

  - method: GET
    path: "/forms-1099q"
    description: "List Forms 1099-Q; filter by account_id, tax_year, supersedes_form_id."
    roles: [SystemTaxAuthority, ComplianceOfficer]
    code: 200
    input: ["account_id?", "tax_year?", "supersedes_form_id?", "limit?", "offset?"]
    output: Form1099Q[]
    side_effects: []

  # --- Test-driving endpoints ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the system clock."
    roles: [CustodianAgent, SystemTaxAuthority, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects:
      - "ClockState.current_utc = to_iso8601"
      - "Account.tax_year recomputed for all accounts when year(current_utc) changes (ytd_qualified_k12_cents NOT auto-reset; tax_year field updated only)"

  - method: GET
    path: "/_clock"
    description: "Test-driving: read the current system clock."
    roles: [CustodianAgent, SystemTaxAuthority, ComplianceOfficer, AccountOwner]
    code: 200
    input: []
    output: ClockState
    side_effects: []

  - method: POST
    path: "/_market/credit_earnings"
    description: "Test-driving: credit a market-appreciation delta to an Account. Increases account_balance_cents by delta_cents WITHOUT changing total_basis_cents. total_earnings_cents recomputed (balance - basis). Required to test the earnings_ratio dual-variant calculation, which has no business endpoint that produces unrealized appreciation."
    roles: [CustodianAgent]
    code: 200
    input: [account_id, delta_cents]
    output: Account
    side_effects:
      - "Account.account_balance_cents += delta_cents"
      - "Account.total_earnings_cents recomputed (= balance - basis)"
      - "Account.version += 1"

  - method: POST
    path: "/_scheduler/tick"
    description: "Test-driving: advance the scheduler. Any ACTIVE ScheduledContribution whose next_run_utc <= ClockState.current_utc produces a new RECURRING Contribution (status DRAFT) and then auto-POSTs it. Schedules in PAUSED or CANCELLED status are skipped."
    roles: [CustodianAgent]
    code: 200
    input: []
    output: ScheduledContribution[]
    side_effects:
      - "For each due ScheduledContribution: a new Contribution row created with kind=RECURRING, immediately POSTED"
      - "Account ledger and StateTaxIncentive aggregates recomputed per posted contribution"
      - "ScheduledContribution.next_run_utc and posted_runs advanced"

# ============================================================
# §1.6 Error Code Catalog
# ============================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint."

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID attempts both submit/approve on a Withdrawal or both create/approve on a BeneficiaryChange."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource does not exist."

  - id: ERR_REFERENCED_NOT_FOUND
    http: 404
    condition: "Body FK references a resource that does not exist."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing, malformed, or out of declared range."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which this transition is allowed."

  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version does not match current Account.version."

  - id: ERR_BENEFICIARY_NOT_FAMILY_MEMBER
    http: 422
    condition: "to_relationship_class == OTHER on a BeneficiaryChange."

  - id: ERR_INSUFFICIENT_BALANCE
    http: 422
    condition: "Withdrawal.amount_cents > Account.account_balance_cents at submit or approve."

  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "rejection_count >= 3 when /revise is called."

  - id: ERR_REVERSE_WINDOW_CLOSED
    http: 409
    condition: "Contribution.posted_at_utc more than 72h before current_utc on /reverse."

  - id: ERR_UNSUPPORTED_STATE_CODE
    http: 422
    condition: "Donor.state_code not in {CA, NY, IL, TX, FL, OH}."

  - id: ERR_EMAIL_TAKEN
    http: 409
    condition: "Donor.email is already used (case-insensitive)."

  - id: ERR_FORM_ALREADY_EXISTS
    http: 409
    condition: "A DRAFT/ISSUED/REISSUED Form1099Q already exists for the same (account_id, tax_year)."

  - id: ERR_INCENTIVE_ALREADY_EXISTS
    http: 409
    condition: "A StateTaxIncentive already exists for (donor_id, tax_year)."

  - id: ERR_FORM_PREMATURE_ISSUANCE
    http: 422
    condition: "Form1099Q.tax_year + 1 not yet reached on /issue."

  - id: ERR_FORM_CORRECTION_WINDOW_CLOSED
    http: 422
    condition: "Form1099Q.tax_year < current year - 3 on /correct."

# ============================================================
# §1.7 RBAC Matrix
# ============================================================
roles:
  - name: AccountOwner
    description: "The Donor acting on their own account: creates withdrawals, manages schedules, requests beneficiary changes, closes the account."
    identity: "entity_backed:Donor"
    exclusive_operations:
      - "POST /accounts/{id}/close"
      - "POST /scheduled-contributions"
      - "POST /scheduled-contributions/{id}/pause"
      - "POST /scheduled-contributions/{id}/resume"
      - "POST /scheduled-contributions/{id}/cancel"
      - "POST /withdrawals"
      - "POST /withdrawals/{id}/submit"
      - "POST /withdrawals/{id}/revise"
      - "POST /beneficiary-changes"
    shared_operations:
      - "GET /accounts/{id}"
      - "GET /scheduled-contributions/{id}"
      - "GET /withdrawals/{id}"
      - "GET /contributions"
      - "GET /donors/{id}"
      - "GET /beneficiaries/{id}"
      - "GET /beneficiary-changes/{id}"
      - "GET /forms-1099q/{id}"
      - "GET /_clock"

  - name: CustodianAgent
    description: "Back-office operations: creates Donors/Beneficiaries/Accounts, posts contributions, calculates state incentives."
    identity: "opaque"
    exclusive_operations:
      - "POST /donors"
      - "POST /beneficiaries"
      - "POST /accounts"
      - "POST /contributions"
      - "POST /contributions/{id}/post"
      - "POST /contributions/{id}/reverse"
      - "POST /withdrawals/{id}/disburse"
      - "POST /state-tax-incentives"
      - "POST /state-tax-incentives/{id}/calculate"
      - "POST /state-tax-incentives/{id}/finalize"
      - "POST /_scheduler/tick"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /_clock"
      - "GET /donors"
      - "GET /donors/{id}"
      - "GET /beneficiaries"
      - "GET /beneficiaries/{id}"
      - "GET /accounts"
      - "GET /accounts/{id}"
      - "GET /scheduled-contributions"
      - "GET /scheduled-contributions/{id}"
      - "GET /contributions"
      - "GET /contributions/{id}"
      - "GET /withdrawals"
      - "GET /withdrawals/{id}"
      - "GET /state-tax-incentives"
      - "GET /state-tax-incentives/{id}"

  - name: ComplianceOfficer
    description: "Approves/rejects withdrawals and beneficiary changes, places/releases compliance holds, audits earnings splits."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/{id}/restrict"
      - "POST /accounts/{id}/release"
      - "POST /withdrawals/{id}/approve"
      - "POST /withdrawals/{id}/reject"
      - "POST /beneficiary-changes/{id}/approve"
      - "POST /beneficiary-changes/{id}/reject"
      - "GET /withdrawals/{id}/audit"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /_clock"
      - "GET /donors"
      - "GET /donors/{id}"
      - "GET /beneficiaries"
      - "GET /beneficiaries/{id}"
      - "GET /accounts"
      - "GET /accounts/{id}"
      - "GET /scheduled-contributions"
      - "GET /scheduled-contributions/{id}"
      - "GET /contributions"
      - "GET /contributions/{id}"
      - "GET /withdrawals"
      - "GET /withdrawals/{id}"
      - "GET /beneficiary-changes"
      - "GET /beneficiary-changes/{id}"
      - "GET /state-tax-incentives"
      - "GET /forms-1099q"
      - "GET /forms-1099q/{id}"

  - name: SystemTaxAuthority
    description: "IRS-side operator: issues, corrects, and reissues Forms 1099-Q."
    identity: "opaque"
    exclusive_operations:
      - "POST /forms-1099q"
      - "POST /forms-1099q/{id}/issue"
      - "POST /forms-1099q/{id}/correct"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /_clock"
      - "GET /forms-1099q"
      - "GET /forms-1099q/{id}"
