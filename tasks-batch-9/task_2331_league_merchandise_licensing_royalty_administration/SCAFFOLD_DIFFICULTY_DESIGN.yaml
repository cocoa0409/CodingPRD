            - "response status is 409 with data.error_id == ERR_INVALID_STATE (NOT ERR_REVIEW_ON_HOLD)"
            - "ProductSubmission.${sub_l}.status is still SUBMITTED and revision_round is still 0"

      - name: period_outside_term_outranks_closeout_limit
        grounds:
