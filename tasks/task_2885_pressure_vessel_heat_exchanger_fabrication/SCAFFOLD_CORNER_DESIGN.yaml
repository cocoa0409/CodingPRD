  - section: rbac
    instances:

      - name: rbac_exclusive_operations_are_forbidden_to_every_other_role
        claim_type: Exclusive Operations Denied To Other Roles
        grounds:
          - roles.ShopAdmin.exclusive_operations
          - roles.DesignEngineer.exclusive_operations
          - roles.WeldingEngineer.exclusive_operations
          - roles.QCInspector.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=20]
        distinguishing_aspect: "Each of the five roles is pointed at another role's exclusive operation and refused with ERR_ROLE_NOT_PERMITTED (403), and the last two attempts carry a deliberately malformed body to prove the priority-20 role gate outranks the priority-25 shape gate rather than the other way round."
        test_recipe:
          setup:
            - "One Personnel row exists for each entity-backed role: Dana Reyes (DESIGN_ENGINEER), Wes Iyer (WELDING_ENGINEER), Quinn Park (QC_INSPECTOR) and Alma Nowak (AUTHORIZED_INSPECTOR)."
            - "Certificate CA-U-8935 is ACTIVE and job J-2885-C53 is open under it at DRAFT, so every refusal below is a pure authorisation refusal on an otherwise satisfiable request."
            - "Every trigger below sends a well-formed X-User-ID for its declared role, so the priority-15 identity check passes and priority 20 is the first gate that can fire."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Wes Iyer", role_code: "WELDING_ENGINEER", stamp_initials: "WI" }
              as: ShopAdmin
              captures: { we1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Alma Nowak", role_code: "AUTHORIZED_INSPECTOR", stamp_initials: "AN", ai_agency: "Hartford Steam Boiler" }
              as: ShopAdmin
              captures: { ai1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8935", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C53", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
          trigger:
            - call: "POST /personnel"
              payload: { full_name: "Intruder One", role_code: "QC_INSPECTOR", stamp_initials: "X1" }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { e_admin_personnel: $.data.error_id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C54", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30 }
              as: AuthorizedInspector
              as_user_id: "${ai1_id}"
              captures: { e_admin_job: $.data.error_id }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 0.8750 }
              as: ShopAdmin
              captures: { e_design_sheet: $.data.error_id }
            - call: "POST /material-heats"
              payload: { heat_number: "H-7200", spec: "SA-516-70", form: "PLATE", mtr_received: true, mtr_certified_yield_ksi: 41.0, mtr_certified_tensile_ksi: 75.0, quantity_received_lb: 1000.00 }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { e_qc_receive: $.data.error_id }
            - call: "POST /vessel-jobs/${job_id}/parts"
              payload: { heat_id: "${cert_id}", part_mark: "SH-X1", component_type: "SHELL", issued_quantity_lb: 100.00 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { e_we_parts: $.data.error_id }
            - call: "POST /wps"
              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { e_we_wps: $.data.error_id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8935", scope_codes: [] }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { e_admin_cert: $.data.error_id }
          assert:
            - "${e_admin_personnel} == ERR_ROLE_NOT_PERMITTED with HTTP 403: registering people is exclusive to ShopAdmin"
            - "${e_admin_job} == ERR_ROLE_NOT_PERMITTED and ${e_admin_cert} == ERR_ROLE_NOT_PERMITTED: opening jobs and issuing certificates are exclusive to ShopAdmin"
            - "${e_design_sheet} == ERR_ROLE_NOT_PERMITTED: preparing a calculation sheet is exclusive to DesignEngineer, and ShopAdmin's ownership of the parent job does not confer it"
            - "${e_qc_receive} == ERR_ROLE_NOT_PERMITTED: receiving material is exclusive to QCInspector"
            - "${e_we_parts} == ERR_ROLE_NOT_PERMITTED: issuing material is exclusive to WeldingEngineer, and the refusal fires before the priority-35 heat-reference check that the deliberately wrong heat_id would otherwise trip"
            - "${e_we_wps} == ERR_ROLE_NOT_PERMITTED, not ERR_INVALID_REQUEST, even though the body is empty: priority 20 outranks priority 25"
            - "${e_admin_cert} is ERR_ROLE_NOT_PERMITTED rather than ERR_DUPLICATE_CERT_NUMBER or ERR_INVALID_REQUEST, although the body both duplicates CA-U-8935 and omits two required fields"
            - "Nothing was written: GET /personnel with limit 20 still returns total_count == 4, GET /material-heats returns total_count == 0, GET /wps returns total_count == 0, GET /certificates returns total_count == 1, GET /vessel-jobs returns total_count == 1, GET /parts?job_id=${job_id} returns total_count == 0, GET /design-calculations?job_id=${job_id} returns total_count == 0"
            - "VesselJob.${job_id}.version is still ${jv1}: a refused OCC-guarded create does not consume the parent version"

      - name: rbac_shared_read_surface_is_open_to_all_five_declared_roles
        claim_type: Shared Operations
        grounds:
          - roles.ShopAdmin.shared_operations
          - roles.DesignEngineer.shared_operations
          - roles.WeldingEngineer.shared_operations
          - roles.QCInspector.shared_operations
          - roles.AuthorizedInspector.shared_operations
          - endpoints[GET /vessel-jobs/{job_id}]
          - endpoints[GET /certificates]
        distinguishing_aspect: "Every role declares `every GET endpoint` as a shared operation, so the same read must succeed for all five identities and return byte-identical business content — including the opaque ShopAdmin, who sends no X-User-ID at all, and the two engineer roles who have no write authority anywhere near this aggregate."
        test_recipe:
          setup:
            - "One Personnel row per entity-backed role, certificate CA-U-8936 ACTIVE, and job J-2885-C55 open under it at DRAFT."
            - "No writes occur between the five reads, so any difference in the returned payloads is a role-leakage defect rather than a race."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Wes Iyer", role_code: "WELDING_ENGINEER", stamp_initials: "WI" }
              as: ShopAdmin
              captures: { we1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Alma Nowak", role_code: "AUTHORIZED_INSPECTOR", stamp_initials: "AN", ai_agency: "Hartford Steam Boiler" }
              as: ShopAdmin
              captures: { ai1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8936", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C55", customer_name: "Northline Energy", vessel_type: "HEAT_EXCHANGER", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id }
          trigger:
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { read_admin: $.data }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { read_de: $.data }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { read_we: $.data }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { read_qc: $.data }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: AuthorizedInspector
              as_user_id: "${ai1_id}"
              captures: { read_ai: $.data }
            - call: "GET /certificates"
              payload: { status: "ACTIVE", limit: 10, offset: 0 }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
            - call: "GET /personnel"
              payload: { role_code: "AUTHORIZED_INSPECTOR", limit: 10, offset: 0 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
          assert:
            - "All five reads return HTTP 200 and ${read_admin} == ${read_de} == ${read_we} == ${read_qc} == ${read_ai} field for field, including status DRAFT, required_components [SHELL, HEAD, TUBESHEET], required_test_sides [SHELL_SIDE, TUBE_SIDE] and version 1"
            - "The opaque role needs no identity: the ShopAdmin read carries no X-User-ID and still returns 200"
            - "GET /certificates?status=ACTIVE as WeldingEngineer returns 200 with total_count == 1, so list reads are shared too and are not scoped to the role that created the row"
            - "GET /personnel?role_code=AUTHORIZED_INSPECTOR as DesignEngineer returns 200 with total_count == 1 and ai_agency == Hartford Steam Boiler, even though only ShopAdmin may create Personnel"
            - "No read mutated anything: VesselJob.${job_id}.version is still 1 and updated_at is unchanged across all five reads"

      - name: rbac_unauthenticated_requests_are_refused_before_every_other_gate
        claim_type: Unauthenticated
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=10]
          - roles.DesignEngineer.identity
          - roles.ShopAdmin.identity
        distinguishing_aspect: "Priority 10 is the outermost gate, so it must fire for three distinct header defects — no X-User-Role at all, an X-User-Role that is not one of the five declared names, and an entity-backed role with no X-User-ID — and it must win even when the same request also cites a non-existent path id and an empty body."
        test_recipe:
          setup:
            - "Certificate CA-U-8937 is ACTIVE, job J-2885-C56 is open under it at DRAFT, and Dana Reyes is a registered DESIGN_ENGINEER."
            - "Header shaping for the triggers below: `as: NONE` means the request omits the X-User-Role header entirely; the second trigger sends the literal string SHOP_FOREMAN, which is not one of the five declared roles; the third and fourth send a legitimate entity-backed role name with no X-User-ID header."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8937", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C56", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
          trigger:
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: NONE
              captures: { e_no_header: $.data.error_id }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: SHOP_FOREMAN
              captures: { e_bad_role: $.data.error_id }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 0.8750 }
              as: DesignEngineer
              captures: { e_no_user_id: $.data.error_id }
            - call: "POST /material-heats"
              payload: {}
              as: QCInspector
              captures: { e_no_user_id_bad_body: $.data.error_id }
            - call: "GET /certificates/${cert_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "${e_no_header} == ERR_UNAUTHENTICATED with HTTP 401: a missing X-User-Role is refused even on a pure read of an existing row"
            - "${e_bad_role} == ERR_UNAUTHENTICATED, not ERR_ROLE_NOT_PERMITTED: an undeclared role name never reaches the priority-20 permitted-role list"
            - "${e_no_user_id} == ERR_UNAUTHENTICATED: DesignEngineer is entity_backed:Personnel, so the role header alone is not an identity"
            - "${e_no_user_id_bad_body} == ERR_UNAUTHENTICATED rather than ERR_INVALID_REQUEST, proving priority 10 outranks priority 25 on a request that is defective in both ways"
            - "The opaque role is exempt from the X-User-ID requirement: GET /certificates/${cert_id} as ShopAdmin with no X-User-ID returns 200"
            - "Nothing leaked and nothing was written: no 401 response body carries a data payload beyond the error envelope, GET /design-calculations?job_id=${job_id} returns total_count == 0, GET /material-heats returns total_count == 0, and VesselJob.${job_id}.version is still ${jv1}"

      - name: rbac_identity_role_mismatch_is_rejected_and_outranks_the_role_gate
        claim_type: Identity Role Mismatch
        grounds:
          - errors[ERR_IDENTITY_ROLE_MISMATCH]
          - validations[priority=15]
          - roles.QCInspector.identity
          - endpoints[POST /personnel]
        distinguishing_aspect: "Priority 15 resolves X-User-ID against Personnel.role_code, so a header pair that is individually valid but mutually inconsistent is refused — and because 15 precedes 20, the mismatch is reported even when the role in the header would have been forbidden anyway. The rule's two carve-outs, POST /personnel and the clock, must still accept a mismatched pair."
        test_recipe:
          setup:
            - "Four Personnel rows exist, one per entity-backed role: Dana Reyes (DESIGN_ENGINEER), Wes Iyer (WELDING_ENGINEER), Quinn Park (QC_INSPECTOR) and Alma Nowak (AUTHORIZED_INSPECTOR)."
            - "Certificate CA-U-8938 is ACTIVE and job J-2885-C57 is open under it at DRAFT."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Wes Iyer", role_code: "WELDING_ENGINEER", stamp_initials: "WI" }
              as: ShopAdmin
