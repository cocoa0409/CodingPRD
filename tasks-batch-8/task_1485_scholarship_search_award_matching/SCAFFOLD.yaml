# =============================================================================
# SCAFFOLD.yaml — Scholarship Search & Award Matching (§1.0–§1.7)
# =============================================================================
scenario: |
  Scholarship Search & Award Matching (school scholarship coordinator): student profile & eligibility criteria matching, application deadline tracking & reminder cadence, essay/recommendation component completion, local scholarship committee review & selection, award disbursement to institution & stacking rules, renewal criteria & GPA verification, duplicate/over-award adjustment, donor reporting & thank-you fulfillment

domain_name: scholarship-award-matching
api_prefix: /api

complexity_profile:
  primary_archetype: multi_party_negotiation   # committee review cycles with quorum, scoring, deliberation
  secondary_archetype: compliance_audit        # segregation of duties on adjustments/disbursements, donor reporting
  complexity_layers:
    - dual_variant_calculation    # STRICT vs HOLISTIC eligibility; ANNUAL vs PER_TERM stacking caps
    - cascading_side_effects      # disbursement confirm -> award -> thank-you -> donor report staleness
    - rate_threshold_triggers     # GPA renewal thresholds, deadline boundaries, reminder cadence
    - optimistic_concurrency      # OCC on Program/Fund/Award versions
    - scheduled_actions           # reminder cadence, ops-run daily epoch
    - derived_field_reconciliation # fund reserved/disbursed/available aggregates
  entity_topology: flat                        # peer entities joined by FK references; flat /api/<collection> URLs
  state_machine_shape: compound                # mix of cyclic (Application, ReviewCycle, ThankYouLetter, RenewalEvaluation),
                                               # parallel dimensions (Award offer_status x funding_status),
                                               # and guarded transitions (Application<-Program, Disbursement<-Award)
  relationship_patterns:
    - one_to_many                 # Program -> Application -> Component/Reminder; Award -> Disbursement/Adjustment/Renewal/ThankYou
    - cross_aggregate             # ReviewScore joins ReviewCycle x Application; Award joins Application x Student
  role_model: segregation_of_duties            # adjustment creator != approver; disbursement sender != confirmer
  consistency_model: immediate                 # all mutations atomic and visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities, flat topology)
# All money in integer cents. All GPAs in integer hundredths (300 == 3.00).
# All entities carry common_fields (id UUID no prefix, created_at, updated_at, version).
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: email, type: string, source: input, description: "Unique email", constraints: "unique across Students" }
      - { name: grade_level, type: integer, source: input, description: "School grade 9-12" }
      - { name: gpa_hundredths, type: integer, source: input, description: "Self-reported GPA x100 (e.g. 280 == 2.80)", constraints: "0..500" }
      - { name: verified_gpa_hundredths, type: integer, source: input, description: "Registrar-verified GPA x100; set only by ScholarshipCoordinator via PATCH; null until verified", constraints: "null | 0..500" }
      - { name: residency_state, type: string, source: input, description: "Two-letter state code" }
      - { name: intended_major, type: enum, source: input, description: "STEM | ARTS | BUSINESS | HEALTH | TRADES | UNDECIDED" }
      - { name: household_income_cents, type: integer, source: input, description: "Annual household income" }
      - { name: efc_cents, type: integer, source: input, description: "Expected family contribution" }
      - { name: cost_of_attendance_cents, type: integer, source: input, description: "COA at the student's institution" }
      - { name: institution_name, type: string, source: input, description: "Enrolled/committed institution name" }
      - { name: tags, type: array, source: input, default: [], description: "Profile tags matched against program required_tags (FIRST_GEN, VETERAN, ATHLETE, ...)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ARCHIVED" }
      - { name: total_accepted_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this student's Awards with offer_status == ACCEPTED" }
      - { name: total_disbursed_cents, type: integer, source: computed, default: 0, description: "Sum over this student's awards of (CONFIRMED disbursements minus returned-from-CONFIRMED amounts)" }
      - { name: aid_cap_cents, type: integer, source: computed, description: "= cost_of_attendance_cents - efc_cents (annual need cap)" }
      - { name: excess_cents, type: integer, source: computed, default: 0, description: "= max(0, total_accepted_cents - aid_cap_cents) recomputed on every award amount/status change" }

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Donor display name" }
      - { name: contact_email, type: string, source: input, description: "Donor contact email" }
      - { name: anonymous, type: boolean, source: input, default: false, description: "If true, thank-you letters are waived and reports omit recipient identity" }
      - { name: report_frequency, type: enum, source: input, default: ANNUAL, description: "QUARTERLY | ANNUAL" }

  - name: AwardFund
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fund name" }
      - { name: committed_cents, type: integer, source: input, default: 0, description: "Total committed to the fund; grows via POST commitments" }
      - { name: reserved_cents, type: integer, source: computed, default: 0, description: "Sum over awards (offer_status IN {OFFERED, ACCEPTED}) of max(0, amount_cents - net_confirmed_cents(award))" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Gross sum of CONFIRMED disbursement amounts over awards of programs drawing on this fund" }
      - { name: returned_cents, type: integer, source: computed, default: 0, description: "Sum of amounts of disbursements marked RETURNED from CONFIRMED" }
      - { name: available_cents, type: integer, source: computed, description: "= committed_cents - reserved_cents - disbursed_cents + returned_cents (invariant, see calculations.fund_availability)" }

  - name: ScholarshipProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; sponsoring donor" }
      - { name: fund_id, type: string, source: input, description: "FK -> AwardFund.id; fund the awards draw on" }
      - { name: program_type, type: enum, source: input, description: "MERIT | NEED | HYBRID — selects eligibility and ranking weight sets" }
      - { name: match_policy, type: enum, source: input, description: "STRICT (any hard-criterion miss zeroes the score) | HOLISTIC (partial credit)" }
      - { name: stacking_scope, type: enum, source: input, description: "ANNUAL (cap = COA - EFC) | PER_TERM (cap = floor((COA - EFC)/2)) — selects stacking_cap variant" }
      - { name: award_amount_cents, type: integer, source: input, description: "Maximum amount per recipient award" }
      - { name: max_recipients, type: integer, source: input, description: "Maximum awards this program may grant per cycle" }
      - { name: min_gpa_hundredths, type: integer, source: input, description: "Hard minimum GPA x100" }
      - { name: eligible_majors, type: array, source: input, default: [], description: "Empty = all majors eligible" }
      - { name: required_residency_state, type: string, source: input, description: "Two-letter state or null for no residency requirement" }
      - { name: max_household_income_cents, type: integer, source: input, description: "Income ceiling or null for no requirement" }
      - { name: required_tags, type: array, source: input, default: [], description: "Tags the student must hold (all of them)" }
      - { name: required_components, type: array, source: input, default: [], description: "Component types required at submit: subset of [ESSAY, RECOMMENDATION, TRANSCRIPT]" }
      - { name: application_open_at, type: datetime, source: input, description: "Publish allowed when now >= application_open_at" }
      - { name: application_close_at, type: datetime, source: input, description: "Submit allowed while now < application_close_at (strict); must be > application_open_at" }
      - { name: renewable, type: boolean, source: input, default: false, description: "Whether awards renew yearly" }
      - { name: renewal_min_gpa_hundredths, type: integer, source: input, description: "Renewal GPA threshold x100 (>= passes); null when not renewable" }
      - { name: renewal_min_credits, type: integer, source: input, description: "Renewal credits threshold (>= passes); null when not renewable" }
      - { name: max_renewals, type: integer, source: input, default: 0, description: "Maximum renewal count per award" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | CLOSED | ARCHIVED" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; applicant" }
      - { name: program_id, type: string, source: input, description: "FK -> ScholarshipProgram.id; target program" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | UNDER_REVIEW | SELECTED | WAITLISTED | NOT_SELECTED | AWARDED | WITHDRAWN | EXPIRED" }
      - { name: provisional_match_score, type: number, source: computed, description: "eligibility_match_score at create using self-reported gpa_hundredths; 2dp" }
      - { name: verified_match_score, type: number, source: computed, description: "eligibility_match_score recomputed at submit using verified_gpa_hundredths when set, else gpa_hundredths; null until first submit" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of latest DRAFT->SUBMITTED; null until submitted" }
      - { name: returned_count, type: integer, source: system, default: 0, description: "Number of SUBMITTED->DRAFT returns (correction loop count)" }
      - { name: cycle_score, type: number, source: computed, description: "Average of LOCKED ReviewScore.weighted_total at cycle finalize; 2dp half-up; null until finalized" }
      - { name: decision_rank, type: integer, source: computed, description: "1-based rank within its ReviewCycle at finalize; null until finalized" }

  - name: ApplicationComponent
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; parent application (path-bound)" }
      - { name: component_type, type: enum, source: input, description: "ESSAY | RECOMMENDATION | TRANSCRIPT" }
      - { name: required, type: boolean, source: input, default: true, description: "Whether submit gates on this component" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | RECEIVED | ACCEPTED | REJECTED | WAIVED" }
      - { name: content_ref, type: string, source: input, description: "Opaque reference to uploaded content; set at receive" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of latest PENDING->RECEIVED; null until received" }

  - name: Reminder
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; parent application" }
      - { name: offset_code, type: enum, source: system, description: "D14 | D7 | D1 — offset before program close" }
      - { name: send_at, type: datetime, source: computed, description: "= program.application_close_at - offset; computed at creation" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | SENT | SUPPRESSED" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp of dispatch; null until SENT" }

  - name: ReviewCycle
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ScholarshipProgram.id; program under review" }
      - { name: label, type: string, source: input, description: "Cycle label (e.g. '2026-FALL')" }
      - { name: starts_on, type: string, source: input, description: "Cycle window start date YYYY-MM-DD (half-open interval start, inclusive)" }
      - { name: ends_on, type: string, source: input, description: "Cycle window end date YYYY-MM-DD (half-open interval end, exclusive); must be > starts_on" }
      - { name: quorum_count, type: integer, source: input, description: "Minimum LOCKED scores per application before deliberation/finalize" }
      - { name: selection_quota, type: integer, source: input, description: "How many top-ranked applications become SELECTED at finalize" }
      - { name: waitlist_quota, type: integer, source: input, default: 0, description: "How many next-ranked become WAITLISTED" }
      - { name: status, type: enum, source: system, default: SETUP, description: "SETUP | SCORING | DELIBERATION | FINALIZED" }

  - name: ReviewScore
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ReviewCycle.id; cycle scored in" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application scored" }
      - { name: reviewer_user_id, type: string, source: system, description: "CommitteeReviewer's X-User-ID (opaque; not entity-backed)" }
      - { name: academic_score, type: integer, source: input, description: "0..100" }
      - { name: essay_score, type: integer, source: input, description: "0..100" }
      - { name: need_score, type: integer, source: input, description: "0..100" }
      - { name: conflict_of_interest, type: boolean, source: input, default: false, description: "Reviewer declaration; SUBMIT with true is rejected (ERR_CONFLICT_OF_INTEREST)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | LOCKED" }
      - { name: weighted_total, type: number, source: computed, description: "committee_ranking_score result computed at submit; 2dp half-up; null while DRAFT" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the SELECTED application this award offers on" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; recipient (must equal application's student)" }
      - { name: amount_cents, type: integer, source: input, description: "Offered amount; 0 < amount <= program.award_amount_cents; grows by program.award_amount_cents per renewal" }
      - { name: offer_status, type: enum, source: system, default: OFFERED, description: "OFFERED | ACCEPTED | DECLINED | REVOKED | EXPIRED (parallel dimension 1)" }
      - { name: funding_status, type: enum, source: system, default: NONE, description: "NONE | ENCUMBERED | DISBURSING | FULLY_DISBURSED | OVER_DISBURSED (parallel dimension 2)" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "= created_at + 14 days; run_daily expires OFFERED awards past this instant" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock timestamp of acceptance; null until ACCEPTED" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of completed renewals (<= program.max_renewals)" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; award drawn on" }
      - { name: term_seq, type: integer, source: input, description: "Term sequence number within the award (1-based)" }
      - { name: amount_cents, type: integer, source: input, description: "Disbursement amount; > 0" }
      - { name: scheduled_date, type: string, source: input, description: "Planned send date YYYY-MM-DD; send allowed when current date >= scheduled_date" }
      - { name: term_start_date, type: string, source: input, description: "Term window start YYYY-MM-DD (CLOSED interval start, inclusive)" }
      - { name: term_end_date, type: string, source: input, description: "Term window end YYYY-MM-DD (CLOSED interval end, inclusive); must be >= term_start_date" }
      - { name: institution_name, type: string, source: input, description: "Receiving institution (normally the student's)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | SENT | CONFIRMED | RETURNED | CANCELLED" }
      - { name: sent_by_user_id, type: string, source: system, description: "X-User-ID of sender; the confirmer must differ (segregation of duties)" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock send timestamp; null until SENT" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock confirm timestamp; null until CONFIRMED" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock return timestamp; null until RETURNED" }
      - { name: returned_reason, type: string, source: input, description: "Required when marking RETURNED" }

  - name: AwardAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; adjusted award" }
      - { name: reason, type: enum, source: input, description: "OVER_AWARD | DUPLICATE | DATA_ERROR | WITHDRAWAL" }
      - { name: delta_cents, type: integer, source: input, description: "Signed amount delta applied to Award.amount_cents (negative = clawback); != 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_APPROVAL | APPLIED | REJECTED" }
      - { name: auto_generated, type: boolean, source: system, default: false, description: "True when created by the stacking-cap cascade" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; null until APPLIED" }

  - name: RenewalEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; award under renewal review" }
      - { name: term_label, type: string, source: input, description: "Academic term evaluated (e.g. '2027-SPRING')" }
      - { name: reported_gpa_hundredths, type: integer, source: input, description: "Student self-reported GPA x100 for the term" }
      - { name: reported_credits, type: integer, source: input, description: "Student self-reported completed credits" }
      - { name: registrar_gpa_hundredths, type: integer, source: input, description: "Registrar-verified GPA x100 supplied at verify; null until verified" }
      - { name: registrar_credits, type: integer, source: input, description: "Registrar-verified credits supplied at verify; null until verified" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED_ELIGIBLE | VERIFIED_INELIGIBLE | APPEALED | RENEWED | LAPSED" }
      - { name: verified_by_user_id, type: string, source: system, description: "Coordinator X-User-ID of latest verify; null until verified" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of RENEWED/LAPSED; null until decided" }
      - { name: appeal_note, type: string, source: input, description: "Required at appeal" }

  - name: ThankYouLetter
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> Award.id; auto-created when the award reaches FULLY_DISBURSED" }
      - { name: status, type: enum, source: system, description: "REQUIRED | SUBMITTED | REVISION_REQUESTED | APPROVED | DELIVERED | WAIVED" }
      - { name: content_ref, type: string, source: input, description: "Opaque reference to letter content; required at submit" }
      - { name: auto_created, type: boolean, source: system, default: true, description: "Always true; letters are cascade-created only" }
      - { name: due_at, type: datetime, source: computed, description: "= full-disbursement timestamp + 30 days" }

  - name: DonorReport
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; report recipient" }
      - { name: period_start, type: string, source: input, description: "Reporting window start YYYY-MM-DD (half-open, inclusive)" }
      - { name: period_end, type: string, source: input, description: "Reporting window end YYYY-MM-DD (half-open, exclusive); must be > period_start" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | GENERATED | SENT | ACKNOWLEDGED" }
      - { name: total_awards_count, type: integer, source: computed, description: "Awards of this donor's programs with >=1 disbursement CONFIRMED with confirmed_at in [period_start, period_end); computed at generate" }
      - { name: total_disbursed_cents, type: integer, source: computed, description: "Sum of those CONFIRMED amounts in the half-open window; computed at generate" }
      - { name: thank_you_complete, type: boolean, source: computed, description: "True when every included award's ThankYouLetter is in {DELIVERED, WAIVED}; computed at generate and refreshed on view" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock send timestamp; null until SENT" }

# =============================================================================
# §1.2 State Machine Table (12 machines)
# =============================================================================
state_machines:
  - entity: Student
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /api/students/{id}/archive"
        actor: ScholarshipCoordinator
        preconditions:
          - "No Application of this student in {DRAFT, SUBMITTED, UNDER_REVIEW, SELECTED, WAITLISTED} (ERR_INVALID_STATE)"
          - "No Award of this student with offer_status IN {OFFERED, ACCEPTED} (ERR_INVALID_STATE)"
        side_effects: ["status=ARCHIVED (soft delete; record remains readable)"]

  - entity: ScholarshipProgram
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/scholarship-programs/{id}/publish"
        actor: ScholarshipCoordinator
        preconditions:
          - "now >= application_open_at (ERR_WINDOW_NOT_OPEN)"
        side_effects: ["status=OPEN"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/scholarship-programs/{id}/close OR system at run_daily when now >= application_close_at"
        actor: ScholarshipCoordinator | system
        preconditions: []
        side_effects:
          - "system path only: every DRAFT Application of this program -> EXPIRED, and their SCHEDULED Reminders -> SUPPRESSED"
      - from: CLOSED
        to: OPEN
        trigger: "POST /api/scholarship-programs/{id}/extend"
        actor: ScholarshipCoordinator
        preconditions:
          - "payload new_close_at > current application_close_at (ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "application_close_at = new_close_at"
          - "status=OPEN (cycle: deadline extension reopens the program)"
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /api/scholarship-programs/{id}/archive"
        actor: ScholarshipCoordinator
        preconditions:
          - "No Application of this program in {DRAFT, SUBMITTED, UNDER_REVIEW, SELECTED, WAITLISTED} (ERR_INVALID_STATE)"
        side_effects: ["status=ARCHIVED"]

  - entity: Application
    initial_state: DRAFT
    terminal_states: [NOT_SELECTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/applications/{id}/submit"
        actor: Student | ScholarshipCoordinator
        preconditions:
          - "Application.status == DRAFT (ERR_INVALID_STATE)"
          - "Program.status == OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "now < program.application_close_at (ERR_DEADLINE_PASSED)"
          - "Every required ApplicationComponent (required == true and component_type IN program.required_components) is ACCEPTED or WAIVED (ERR_COMPONENT_INCOMPLETE)"
          - "STRICT programs only: verified_match_score > 0 (hard criteria all pass) else ERR_INELIGIBLE_STUDENT"
        side_effects:
          - "verified_match_score recomputed (verified_gpa_hundredths if set else gpa_hundredths)"
          - "submitted_at = now"
          - "All SCHEDULED Reminders of this application -> SUPPRESSED"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/applications/{id}/return"
        actor: ScholarshipCoordinator
        preconditions:
          - "Application.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "returned_count += 1 (correction loop; cycle SUBMITTED->DRAFT->SUBMITTED)"
          - "Reminders re-scheduled per reminder_cadence_schedule against the program close (past offsets skipped)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/applications/{id}/withdraw"
        actor: Student | ScholarshipCoordinator
        preconditions: ["Application.status IN {DRAFT, SUBMITTED} (ERR_INVALID_STATE)"]
        side_effects: ["SCHEDULED Reminders -> SUPPRESSED"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/applications/{id}/withdraw"
        actor: Student | ScholarshipCoordinator
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: EXPIRED
        trigger: "system at run_daily when program.status == CLOSED and now >= program.application_close_at"
        actor: system
        preconditions: []
        side_effects: ["SCHEDULED Reminders -> SUPPRESSED"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system when a ReviewCycle of this program transitions SETUP->SCORING"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: SELECTED
        trigger: "system at ReviewCycle finalize (top selection_quota by committee_ranking order)"
        actor: system
        preconditions: []
        side_effects: ["decision_rank assigned; cycle_score frozen"]
      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "system at ReviewCycle finalize (next waitlist_quota after SELECTED)"
        actor: system
        preconditions: []
        side_effects: ["decision_rank assigned"]
      - from: UNDER_REVIEW
        to: NOT_SELECTED
        trigger: "system at ReviewCycle finalize (remainder)"
        actor: system
        preconditions: []
        side_effects: ["decision_rank assigned"]
      - from: WAITLISTED
        to: SELECTED
        trigger: "system when an Award whose application was SELECTED from the same FINALIZED cycle is DECLINED, EXPIRED, or REVOKED before any CONFIRMED disbursement"
        actor: system
        preconditions:
          - "A WAITLISTED application remains in that cycle"
        side_effects:
          - "Selector: among WAITLISTED applications of the same cycle, pick lowest decision_rank; tie-break submitted_at ASC, then created_at ASC; empty pool -> no-op"
      - from: SELECTED
        to: AWARDED
        trigger: "system when an Award is created for this application"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ApplicationComponent
    initial_state: PENDING
    terminal_states: [ACCEPTED, WAIVED]
    transitions:
      - from: PENDING
        to: RECEIVED
        trigger: "POST /api/components/{id}/receive"
        actor: Student | ScholarshipCoordinator
        preconditions: ["Component.status IN {PENDING, REJECTED} (ERR_INVALID_STATE)", "content_ref present (ERR_VALIDATION)"]
        side_effects: ["received_at = now"]
      - from: REJECTED
        to: RECEIVED
        trigger: "POST /api/components/{id}/receive (resubmission cycle)"
        actor: Student | ScholarshipCoordinator
        preconditions: []
        side_effects: ["received_at = now"]
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /api/components/{id}/accept"
        actor: ScholarshipCoordinator
        preconditions: ["Component.status == RECEIVED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /api/components/{id}/reject"
        actor: ScholarshipCoordinator
        preconditions: ["Component.status == RECEIVED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: PENDING
        to: WAIVED
        trigger: "POST /api/components/{id}/waive"
        actor: ScholarshipCoordinator
        preconditions: ["Component.status == PENDING (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Reminder
    initial_state: SCHEDULED
    terminal_states: [SENT, SUPPRESSED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "system at run_daily when send_at <= now (boundary: equality dispatches)"
        actor: system
        preconditions: []
        side_effects: ["sent_at = now"]
      - from: SCHEDULED
        to: SUPPRESSED
        trigger: "system when parent Application leaves DRAFT (submit, withdraw, expire) or program closes"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReviewCycle
    initial_state: SETUP
    terminal_states: [FINALIZED]
    transitions:
      - from: SETUP
        to: SCORING
        trigger: "POST /api/review-cycles/{id}/open-scoring"
        actor: ScholarshipCoordinator
        preconditions: ["Cycle.status == SETUP (ERR_INVALID_STATE)"]
        side_effects:
          - "Every SUBMITTED Application of cycle.program_id -> UNDER_REVIEW"
      - from: SCORING
        to: DELIBERATION
        trigger: "POST /api/review-cycles/{id}/open-deliberation"
        actor: ScholarshipCoordinator
        preconditions:
          - "Cycle.status == SCORING (ERR_INVALID_STATE)"
          - "Every UNDER_REVIEW application of the cycle's program has >= quorum_count SUBMITTED or LOCKED scores (ERR_QUORUM_NOT_MET)"
        side_effects:
          - "All SUBMITTED ReviewScores of this cycle -> LOCKED"
      - from: DELIBERATION
        to: SCORING
        trigger: "POST /api/review-cycles/{id}/reopen-scoring"
        actor: ScholarshipCoordinator
        preconditions: ["Cycle.status == DELIBERATION (ERR_INVALID_STATE)"]
        side_effects:
          - "LOCKED scores remain LOCKED (lock is monotone); new DRAFT scores may be created and submitted (cycle loop)"
      - from: DELIBERATION
        to: FINALIZED
        trigger: "POST /api/review-cycles/{id}/finalize"
        actor: ScholarshipCoordinator
        preconditions:
          - "Cycle.status == DELIBERATION (ERR_INVALID_STATE)"
          - "Every UNDER_REVIEW application has >= quorum_count LOCKED scores (ERR_QUORUM_NOT_MET)"
          - "selection_quota + waitlist_quota <= count of UNDER_REVIEW applications (ERR_VALIDATION)"
        side_effects:
          - "committee_ranking_score computed per application (average of LOCKED weighted_totals, 2dp half-up)"
          - "Top selection_quota -> SELECTED, next waitlist_quota -> WAITLISTED, rest -> NOT_SELECTED; decision_rank 1..N assigned (tie: need_score avg DESC, submitted_at ASC, created_at ASC)"
          - "Count invariant: SELECTED + WAITLISTED + NOT_SELECTED == prior UNDER_REVIEW count (see calculations.committee_ranking_score)"

  - entity: ReviewScore
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/review-scores/{id}/submit"
        actor: CommitteeReviewer
        preconditions:
          - "Score.status == DRAFT (ERR_INVALID_STATE)"
          - "Cycle.status == SCORING (ERR_INVALID_STATE)"
          - "conflict_of_interest == false (ERR_CONFLICT_OF_INTEREST)"
          - "reviewer_user_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["weighted_total computed via committee_ranking_score"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/review-scores/{id}/recall"
        actor: CommitteeReviewer
        preconditions:
          - "Score.status == SUBMITTED (ERR_INVALID_STATE)"
          - "Cycle.status == SCORING (ERR_INVALID_STATE) — recall impossible once DELIBERATION locked it"
        side_effects: ["weighted_total = null (recall cycle)"]
      - from: SUBMITTED
        to: LOCKED
        trigger: "system when the cycle transitions SCORING->DELIBERATION"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Award
    initial_state: "offer_status=OFFERED, funding_status=NONE"
    terminal_states: ["offer_status IN {DECLINED, REVOKED, EXPIRED}"]
    transitions:
      # --- dimension 1: offer_status ---
      - from: "offer_status=OFFERED"
        to: "offer_status=ACCEPTED"
        trigger: "POST /api/awards/{id}/accept"
        actor: Student
        preconditions:
          - "offer_status == OFFERED (ERR_INVALID_STATE)"
          - "X-User-ID == award.student_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "funding_status NONE -> ENCUMBERED; accepted_at = now"
          - "Student.total_accepted_cents += amount_cents; Student.excess_cents recomputed"
          - "Fund.reserved_cents recomputed (offer already reserved at create)"
          - "Cascade B: if Student.total_accepted_cents > applicable stacking cap -> over_award_recovery_order creates auto AwardAdjustment(s)"
      - from: "offer_status=OFFERED"
        to: "offer_status=DECLINED"
        trigger: "POST /api/awards/{id}/decline"
        actor: Student
        preconditions: ["offer_status == OFFERED (ERR_INVALID_STATE)", "X-User-ID == award.student_id (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects:
          - "Fund.reserved_cents -= amount_cents (compensating release)"
          - "Waitlist promotion selector fires on the source cycle (see Application WAITLISTED->SELECTED)"
      - from: "offer_status=OFFERED"
        to: "offer_status=REVOKED"
        trigger: "POST /api/awards/{id}/revoke"
        actor: ScholarshipCoordinator
        preconditions: ["offer_status IN {OFFERED, ACCEPTED} (ERR_INVALID_STATE)"]
        side_effects:
          - "Fund.reserved_cents -= max(0, amount_cents - net_confirmed(award))"
          - "If ACCEPTED and net_confirmed > 0: funding_status -> OVER_DISBURSED"
          - "Waitlist promotion selector fires when no CONFIRMED disbursement exists"
      - from: "offer_status=ACCEPTED"
        to: "offer_status=REVOKED"
        trigger: "POST /api/awards/{id}/revoke"
        actor: ScholarshipCoordinator
        preconditions: []
        side_effects: ["Same reservation release as OFFERED->REVOKED"]
      - from: "offer_status=OFFERED"
        to: "offer_status=EXPIRED"
        trigger: "system at run_daily when now > offer_expires_at"
        actor: system
        preconditions: []
        side_effects: ["Fund.reserved_cents -= amount_cents", "Waitlist promotion selector fires"]
      # --- dimension 2: funding_status (evolves only while offer_status == ACCEPTED) ---
      - from: "funding_status=NONE"
        to: "funding_status=ENCUMBERED"
        trigger: "system on accept (paired with offer OFFERED->ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "funding_status=ENCUMBERED"
        to: "funding_status=DISBURSING"
        trigger: "system when the first Disbursement of this award reaches CONFIRMED"
        actor: system
        preconditions: []
        side_effects: []
      - from: "funding_status=DISBURSING"
        to: "funding_status=FULLY_DISBURSED"
        trigger: "system when net_confirmed(award) == amount_cents after a Disbursement confirm"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade A link 2: auto-create ThankYouLetter if none exists for this award (status REQUIRED, or WAIVED when program.donor.anonymous == true); re-reaching FULLY_DISBURSED never duplicates the letter"
          - "Cascade A link 3: every DonorReport of that donor in GENERATED -> DRAFT (stale regeneration)"
      - from: "funding_status=FULLY_DISBURSED"
        to: "funding_status=OVER_DISBURSED"
        trigger: "system when an APPLIED AwardAdjustment reduces amount_cents below net_confirmed"
        actor: system
        preconditions: []
        side_effects: ["Recovery expected = net_confirmed - amount_cents"]
      - from: "funding_status=OVER_DISBURSED"
        to: "funding_status=FULLY_DISBURSED"
        trigger: "system when RETURNED-from-CONFIRMED disbursements bring net_confirmed back to amount_cents"
        actor: system
        preconditions: []
        side_effects: []
      - from: "funding_status=FULLY_DISBURSED"
        to: "funding_status=DISBURSING"
        trigger: "system when a CONFIRMED disbursement is marked RETURNED (net_confirmed < amount_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "funding_status=DISBURSING"
        to: "funding_status=ENCUMBERED"
        trigger: "system when all CONFIRMED disbursements are RETURNED (net_confirmed == 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Disbursement
    initial_state: SCHEDULED
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "POST /api/disbursements/{id}/send"
        actor: ScholarshipCoordinator
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_STATE)"
          - "Award.offer_status == ACCEPTED and funding_status IN {ENCUMBERED, DISBURSING} (ERR_AWARD_NOT_ACCEPTED)"
          - "current date >= scheduled_date (ERR_DISBURSEMENT_TOO_EARLY)"
        side_effects: ["sent_at = now", "sent_by_user_id = X-User-ID"]
      - from: SENT
        to: CONFIRMED
        trigger: "POST /api/disbursements/{id}/confirm"
        actor: FinancialAidOfficer
        preconditions:
          - "status == SENT (ERR_INVALID_STATE)"
          - "X-User-ID != sent_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "confirmed_at = now"
          - "Cascade A link 1: Fund.disbursed_cents += amount_cents; Fund.reserved_cents recomputed; Award.funding_status recomputed (ENCUMBERED->DISBURSING, then FULLY_DISBURSED at parity)"
          - "Student.total_disbursed_cents += amount_cents"
      - from: SENT
        to: RETURNED
        trigger: "POST /api/disbursements/{id}/mark-returned"
        actor: FinancialAidOfficer
        preconditions: ["status IN {SENT, CONFIRMED} (ERR_INVALID_STATE)", "returned_reason present (ERR_VALIDATION)"]
        side_effects: ["returned_at = now"]
      - from: CONFIRMED
        to: RETURNED
        trigger: "POST /api/disbursements/{id}/mark-returned"
        actor: FinancialAidOfficer
        preconditions: []
        side_effects:
          - "Fund.returned_cents += amount_cents; Fund.reserved_cents recomputed"
          - "Student.total_disbursed_cents -= amount_cents"
          - "Award.funding_status recomputed (may drop FULLY_DISBURSED -> DISBURSING)"
      - from: RETURNED
        to: SCHEDULED
        trigger: "POST /api/disbursements/{id}/reschedule"
        actor: ScholarshipCoordinator
        preconditions: ["status == RETURNED (ERR_INVALID_STATE)", "new scheduled_date present (ERR_VALIDATION)", "new term window must pass the closed-interval overlap check (ERR_DISBURSEMENT_WINDOW_OVERLAP)"]
        side_effects: ["scheduled_date/term window replaced; sent_at/confirmed_at/returned_at cleared (retry cycle)"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/disbursements/{id}/cancel"
        actor: ScholarshipCoordinator
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: ["Award funding arithmetic excludes CANCELLED disbursements"]

  - entity: AwardAdjustment
    initial_state: DRAFT
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /api/award-adjustments/{id}/submit"
        actor: ScholarshipCoordinator | FinancialAidOfficer
        preconditions: ["status == DRAFT (ERR_INVALID_STATE)"]
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPLIED
        trigger: "POST /api/award-adjustments/{id}/approve"
        actor: FinancialAidOfficer
        preconditions:
          - "status == PENDING_APPROVAL (ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Award.amount_cents + delta_cents > 0 (ERR_VALIDATION)"
          - "For reason IN {DUPLICATE, DATA_ERROR}: amount_cents + delta_cents >= net_confirmed(award) (ERR_ADJUSTMENT_EXCEEDS_DISBURSED). For reason IN {OVER_AWARD, WITHDRAWAL}: dipping below net_confirmed is allowed and flips the award to OVER_DISBURSED (recovery owed)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "Award.amount_cents += delta_cents"
          - "Fund.reserved_cents recomputed; Student totals and excess_cents recomputed"
          - "If net_confirmed > new amount_cents: Award.funding_status -> OVER_DISBURSED"
          - "Cascade B link 2: stacking recompute may create further auto adjustments (single pass, newest-accepted first)"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /api/award-adjustments/{id}/reject"
        actor: FinancialAidOfficer
        preconditions:
          - "status == PENDING_APPROVAL (ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

  - entity: RenewalEvaluation
    initial_state: PENDING
    terminal_states: [RENEWED, LAPSED]
    transitions:
      - from: PENDING
        to: VERIFIED_ELIGIBLE
        trigger: "POST /api/renewal-evaluations/{id}/verify"
        actor: ScholarshipCoordinator
        preconditions:
          - "status IN {PENDING, APPEALED} (ERR_INVALID_STATE)"
          - "registrar_gpa_hundredths and registrar_credits present (ERR_VALIDATION)"
          - "renewal_threshold_check passes: registrar_gpa_hundredths >= program.renewal_min_gpa_hundredths AND registrar_credits >= program.renewal_min_credits"
        side_effects: ["registrar values stored; verified_by_user_id = X-User-ID"]
      - from: PENDING
        to: VERIFIED_INELIGIBLE
        trigger: "POST /api/renewal-evaluations/{id}/verify (threshold miss)"
        actor: ScholarshipCoordinator
        preconditions: ["status IN {PENDING, APPEALED}", "registrar values present"]
        side_effects: ["registrar values stored"]
      - from: APPEALED
        to: VERIFIED_ELIGIBLE
        trigger: "POST /api/renewal-evaluations/{id}/verify"
        actor: ScholarshipCoordinator
        preconditions: ["threshold passes"]
        side_effects: ["registrar values overwritten (appeal cycle)"]
      - from: APPEALED
        to: VERIFIED_INELIGIBLE
        trigger: "POST /api/renewal-evaluations/{id}/verify"
        actor: ScholarshipCoordinator
        preconditions: ["threshold misses"]
        side_effects: []
      - from: VERIFIED_INELIGIBLE
        to: APPEALED
        trigger: "POST /api/renewal-evaluations/{id}/appeal"
        actor: Student | ScholarshipCoordinator
        preconditions: ["status == VERIFIED_INELIGIBLE (ERR_INVALID_STATE)", "appeal_note present (ERR_VALIDATION)"]
        side_effects: []
      - from: VERIFIED_ELIGIBLE
        to: RENEWED
        trigger: "POST /api/renewal-evaluations/{id}/finalize-renewal with decision=RENEW"
        actor: ScholarshipCoordinator
        preconditions:
          - "status == VERIFIED_ELIGIBLE (ERR_RENEWAL_NOT_ELIGIBLE)"
          - "Award.renewal_count < program.max_renewals (ERR_MAX_RENEWALS_REACHED)"
          - "decision == RENEW"
        side_effects:
          - "decided_at = now"
          - "Award.renewal_count += 1"
          - "Award.amount_cents += program.award_amount_cents (next-year tranche)"
          - "Fund.reserved_cents recomputed; stacking recompute runs (may auto-create adjustments)"
      - from: VERIFIED_INELIGIBLE
        to: LAPSED
        trigger: "POST /api/renewal-evaluations/{id}/finalize-renewal with decision=LAPSE"
        actor: ScholarshipCoordinator
        preconditions: ["status == VERIFIED_INELIGIBLE (ERR_RENEWAL_NOT_ELIGIBLE)", "decision == LAPSE"]
        side_effects: ["decided_at = now; Award not renewable further"]

  - entity: ThankYouLetter
    initial_state: REQUIRED
    terminal_states: [DELIVERED, WAIVED]
    transitions:
      - from: REQUIRED
        to: SUBMITTED
        trigger: "POST /api/thank-you-letters/{id}/submit"
        actor: Student
        preconditions: ["status IN {REQUIRED, REVISION_REQUESTED} (ERR_INVALID_STATE)", "content_ref present (ERR_VALIDATION)", "X-User-ID == award.student_id (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /api/thank-you-letters/{id}/submit (revision cycle)"
        actor: Student
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /api/thank-you-letters/{id}/request-revision"
        actor: ScholarshipCoordinator
        preconditions: ["status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/thank-you-letters/{id}/approve"
        actor: ScholarshipCoordinator
        preconditions: ["status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: DELIVERED
        trigger: "POST /api/thank-you-letters/{id}/deliver"
        actor: ScholarshipCoordinator
        preconditions: ["status == APPROVED (ERR_INVALID_STATE)"]
        side_effects: ["Covered DonorReports in GENERATED -> DRAFT (staleness recompute)"]
      - from: REQUIRED
        to: WAIVED
        trigger: "POST /api/thank-you-letters/{id}/waive"
        actor: ScholarshipCoordinator
        preconditions: ["status == REQUIRED (ERR_INVALID_STATE)", "program.donor.anonymous == true (ERR_TYL_NOT_WAIVABLE)"]
        side_effects: []

  - entity: DonorReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /api/donor-reports/{id}/generate"
        actor: ScholarshipCoordinator
        preconditions: ["status == DRAFT (ERR_INVALID_STATE)"]
        side_effects: ["total_awards_count, total_disbursed_cents, thank_you_complete computed per donor_report_aggregation"]
      - from: GENERATED
        to: DRAFT
        trigger: "system when a ThankYouLetter for this donor is created or leaves {DELIVERED, WAIVED}, or a covered disbursement confirms (staleness regeneration cycle)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GENERATED
        to: SENT
        trigger: "POST /api/donor-reports/{id}/send"
        actor: ScholarshipCoordinator
        preconditions: ["status == GENERATED (ERR_INVALID_STATE)", "thank_you_complete == true (ERR_REPORT_INCOMPLETE)"]
        side_effects: ["sent_at = now"]
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /api/donor-reports/{id}/acknowledge"
        actor: Donor
        preconditions: ["status == SENT (ERR_INVALID_STATE)", "X-User-ID == report.donor_id (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other write-write conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: program-edit-stale-version
    parent_entity: ScholarshipProgram
    write_endpoint: "PUT /api/scholarship-programs/{id}"
    occ_field: expected_program_version
    description: |
      Editing a ScholarshipProgram whose version has advanced since the client last
      observed it is rejected. Two sequential edits carrying the same observed version
      cannot both succeed: the first commits and bumps version, the second is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: fund-commitment-stale-version
    parent_entity: AwardFund
    write_endpoint: "POST /api/award-funds/{id}/commitments"
    occ_field: expected_fund_version
    description: |
      Adding a commitment against an AwardFund whose version has advanced since the
      client last read it is rejected; additive commitments are each independently
      valid, so the stale write would silently double-count without OCC.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: award-amount-stale-version
    parent_entity: Award
    write_endpoint: "PATCH /api/awards/{id}"
    occ_field: expected_award_version
    description: |
      Adjusting an OFFERED award's amount against a stale award version is rejected;
      amount edits each legitimately succeed in sequence, so OCC on Award.version is
      the arbitration mechanism.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_match_score
    trigger: "Application create (provisional, uses gpa_hundredths) and Application submit (verified, uses verified_gpa_hundredths when set else gpa_hundredths)"
    algorithm: weighted_scoring
    formula: |
      Components (each 0..100):
        gpa_component:  gpa >= program.min_gpa_hundredths ? 100
                        : (HOLISTIC and program.min_gpa_hundredths - gpa <= 20) ? 50 : 0
        income_component:  program.max_household_income_cents == null ? 100
                        : household_income_cents <= max ? 100 : 0
        residency_component: program.required_residency_state == null ? 100
                        : residency_state == required ? 100 : 0
        tags_component:   required_tags empty ? 100
                        : 100 * |required_tags ∩ student.tags| / |required_tags|
        major gate: eligible_majors non-empty and intended_major not in it -> treated as hard miss
      Weights by program_type:
        MERIT:  gpa .50, income .10, residency .15, tags .25
        NEED:   gpa .20, income .50, residency .10, tags .20
        HYBRID: gpa .35, income .30, residency .15, tags .20
      base = sum(weight_i * component_i), rounded half-up to 2dp.
    input_set: "The Student row and the ScholarshipProgram row referenced by the Application"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict
        when: "program.match_policy == STRICT"
        difference: "Any hard-criterion miss (gpa below min, income over max, residency mismatch, missing required tag, major gate miss) forces total = 0.00"
      - name: holistic
        when: "program.match_policy == HOLISTIC"
        difference: "Partial credit applies (gpa within 20 hundredths earns 50); no zero-gate. Same student data can yield e.g. 90.00 here vs 0.00 under strict"
    note: "Provisional vs verified is a data-axis variant: submit recomputes with verified_gpa_hundredths when present, so the same application can carry provisional 90.00 and verified 80.00"

  - name: stacking_cap
    trigger: "Award accept, award PATCH amount, adjustment apply, renewal RENEW, student COA/EFC change"
    algorithm: waterfall_allocation
    formula: |
      For a student S with cap basis from the program being accepted:
        ANNUAL:  cap = S.cost_of_attendance_cents - S.efc_cents
        PER_TERM: cap = floor((S.cost_of_attendance_cents - S.efc_cents) / 2)
      total = sum of amount_cents over S's awards with offer_status == ACCEPTED
      excess = max(0, total - cap)
      Allocation order for reduction: accepted_at DESC, tie-break created_at DESC
      (newest accepted award is reduced first).
    input_set: "Awards of the student with offer_status == ACCEPTED (OFFERED/DECLINED/REVOKED/EXPIRED excluded)"
    precision: "integer cents"
    variants:
      - name: annual_level
        when: "program.stacking_scope == ANNUAL"
        difference: "cap uses the full annual COA-EFC"
      - name: per_term_level
        when: "program.stacking_scope == PER_TERM"
        difference: "cap uses floor((COA-EFC)/2) — identical student data admits a smaller stack (e.g. 1000000 vs 2000000 cents)"

  - name: over_award_recovery_order
    trigger: "stacking_cap detects excess > 0"
    algorithm: constraint_propagation
    formula: |
      // Circular-looking: reducing an award changes `total`, which defines the excess.
      // Pinned evaluation order — ONE left-to-right pass, no re-iteration:
      remaining = excess
      for award in sort(student.accepted_awards, accepted_at DESC, created_at DESC):
          reduction = min(remaining, award.amount_cents - net_confirmed(award))
          if reduction > 0:
              create AwardAdjustment(auto_generated=true, reason=OVER_AWARD,
                                     delta_cents=-reduction, status=PENDING_APPROVAL)
              remaining -= reduction
      stop when remaining == 0 or the list is exhausted.
    input_set: "Student's ACCEPTED awards, newest accepted_at first (tie: created_at DESC)"
    precision: "integer cents"
    constants: {}

  - name: committee_ranking_score
    trigger: "ReviewScore submit (per-score weighted_total) and ReviewCycle finalize (per-application cycle_score + decision_rank)"
    algorithm: weighted_scoring
    formula: |
      Weights by program.program_type:
        MERIT:  academic .60, essay .25, need .15
        NEED:   academic .25, essay .25, need .50
        HYBRID: academic 1/3, essay 1/3, need 1/3
      deep_need = (2 * student.household_income_cents < program.max_household_income_cents)
      per-score weighted_total = min(100, academic*w_a + essay*w_e + need*w_n + (5 if deep_need else 0)), 2dp half-up
      cycle_score = average of the application's LOCKED weighted_totals, 2dp half-up
      Ranking: cycle_score DESC; tie -> average need_score DESC; -> submitted_at ASC; -> created_at ASC
      decision_rank = 1-based position. Top selection_quota -> SELECTED; next waitlist_quota -> WAITLISTED.
    input_set: "LOCKED ReviewScores of UNDER_REVIEW applications for the cycle's program"
    constants:
      DEEP_NEED_BONUS: 5
      SCORE_CAP: 100
    precision: "2 decimal places, round_half_up"

  - name: reminder_cadence_schedule
    trigger: "Application create (DRAFT) and Application return (SUBMITTED->DRAFT re-arms cadence)"
    algorithm: chronological
    formula: |
      For offset in [D14=14d, D7=7d, D1=1d]:
        send_at = program.application_close_at - offset
        if send_at < now: skip (past offsets are not scheduled)
        else create Reminder(status=SCHEDULED, offset_code=offset, send_at=send_at)
      Dispatch at run_daily: SCHEDULED reminders with send_at <= now -> SENT (equality dispatches).
      Ordered processing by send_at ASC, tie-break created_at ASC.
    input_set: "Applications in DRAFT with their program's application_close_at"
    precision: "logical-clock instants"

  - name: disbursement_split
    trigger: "POST /api/awards/{id}/schedule-split"
    algorithm: waterfall_allocation
    formula: |
      // PINNED ROUNDING ORDER: floor division first, remainder cents to the EARLIEST terms.
      // (The alternative 'round each term half-up, residual to last' yields a different split.)
      base = floor(amount_cents / term_count); r = amount_cents - base * term_count
      term i (1-based): amount_i = base + 1 if i <= r else base
      Dates: term i window = [accepted_date + (i-1)*180d, accepted_date + i*180d - 1d]  (CLOSED, adjacent-minus-one-day)
      scheduled_date_i = term_start_date_i
    input_set: "The accepted Award and its amount_cents"
    precision: "integer cents (no rounding beyond floor/mod)"
    variants:
      - name: earliest_remainder
        when: "always (pinned)"
        difference: "1000000 cents over 3 terms -> [333334, 333333, 333333]; the residual-last convention would give [333333, 333333, 333334]"

  - name: fund_availability
    trigger: "award create/accept/decline/revoke/expire, disbursement confirm/mark-returned, adjustment apply, renewal RENEW, commitment add"
    algorithm: aggregation
    formula: |
      net_confirmed(award) = sum(CONFIRMED amounts) - sum(RETURNED-from-CONFIRMED amounts)
      reserved_cents  = sum over awards of fund programs with offer_status IN {OFFERED, ACCEPTED}
                        of max(0, amount_cents - net_confirmed(award))
      disbursed_cents = gross sum of CONFIRMED amounts (all awards of the fund's programs)
      returned_cents  = sum of RETURNED-from-CONFIRMED amounts
      available_cents = committed_cents - reserved_cents - disbursed_cents + returned_cents
      INVARIANT: this identity holds after every mutation; offer+revoke leaves available unchanged.
    input_set: "Awards via application.program.fund_id; Disbursements via award_id"
    precision: "integer cents"

  - name: renewal_threshold_check
    trigger: "POST /api/renewal-evaluations/{id}/verify"
    algorithm: threshold
    formula: |
      eligible = (registrar_gpa_hundredths >= program.renewal_min_gpa_hundredths)
                 AND (registrar_credits >= program.renewal_min_credits)
      // Boundary: >= is inclusive. 250 passes a 250 minimum; 249 fails.
    input_set: "The RenewalEvaluation's registrar values and the program renewal thresholds"
    precision: "integer comparison (hundredths)"

  - name: donor_report_aggregation
    trigger: "POST /api/donor-reports/{id}/generate"
    algorithm: aggregation
    formula: |
      included awards = awards whose application's program.donor_id == report.donor_id
                        having >= 1 Disbursement CONFIRMED with confirmed_at in
                        [period_start, period_end)  // half-open: exactly period_end EXCLUDED
      total_awards_count = |included awards|
      total_disbursed_cents = sum of those in-window CONFIRMED amounts
      thank_you_complete = for every included award: its ThankYouLetter.status IN {DELIVERED, WAIVED}
    input_set: "Donor -> Programs -> Applications -> Awards -> Disbursements (CONFIRMED only), ThankYouLetters"
    precision: "integer cents; dates as YYYY-MM-DD half-open"

  - name: application_window_gate
    trigger: "Application submit; run_daily program close"
    algorithm: threshold
    formula: |
      submit gate: now < program.application_close_at (strict; equality rejects with ERR_DEADLINE_PASSED)
      publish gate: now >= program.application_open_at (inclusive; equality publishes)
      run_daily close: now >= application_close_at and status == OPEN -> CLOSED
    input_set: "Logical clock vs program window fields"
    precision: "ISO8601 instants"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; within state checks, the
# target resource's own state is validated before cross-entity state)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role known", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for the endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: Student X-User-ID == resource's student_id; Donor X-User-ID == report.donor_id; CommitteeReviewer X-User-ID == score.reviewer_user_id", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "student/donor/reviewer-scoped endpoints" }
  - { priority: 4, category: existence, check: "Path and body-referenced ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /api/scholarship-programs/{id}; POST /api/award-funds/{id}/commitments; PATCH /api/awards/{id}" }
  - { priority: 6, category: existence, check: "Request shape: required fields present, enums valid, date ranges ordered (close_at > open_at; ends_on > starts_on; term_end_date >= term_start_date)", error_id: "ERR_VALIDATION / ERR_INVALID_DATE_RANGE", http_status: 400, applies_to: "all POST/PUT/PATCH" }
  - { priority: 7, category: state, check: "Target resource's own state permits the transition (per §1.2), checked before cross-entity state", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Cross-entity state gates: program OPEN for application create/submit; award ACCEPTED for disbursement create/send; evaluation ELIGIBLE for RENEW", error_id: "ERR_PROGRAM_NOT_OPEN / ERR_AWARD_NOT_ACCEPTED / ERR_RENEWAL_NOT_ELIGIBLE", http_status: 409, applies_to: "submit, disbursement create/send, finalize-renewal, renewal create" }
  - { priority: 9, category: business_safety, check: "Segregation of duties and conflict-of-interest: adjustment approver != creator; disbursement confirmer != sender; COI score submit", error_id: "ERR_SEGREGATION_OF_DUTIES / ERR_CONFLICT_OF_INTEREST", http_status: 403, applies_to: "adjustment approve/reject, disbursement confirm, score submit" }
  - { priority: 10, category: business_constraint, check: "Uniqueness/completeness/overlap/quorum: duplicate application per (student, program) in non-terminal states; required components ACCEPTED/WAIVED; STRICT eligibility gate; cycle/disbursement window overlaps; quorum; duplicate reviewer score; duplicate open renewal evaluation; TYL waivable only for anonymous donors; report completeness", error_id: "ERR_DUPLICATE_APPLICATION / ERR_COMPONENT_INCOMPLETE / ERR_INELIGIBLE_STUDENT / ERR_CYCLE_WINDOW_OVERLAP / ERR_DISBURSEMENT_WINDOW_OVERLAP / ERR_QUORUM_NOT_MET / ERR_REVIEWER_DUPLICATE_SCORE / ERR_DUPLICATE_RENEWAL_EVALUATION / ERR_TYL_NOT_WAIVABLE / ERR_REPORT_INCOMPLETE", http_status: 409, applies_to: "respective create/action endpoints" }
  - { priority: 11, category: business_temporal, check: "Windows and deadlines: publish gate, submit deadline, disbursement send date", error_id: "ERR_WINDOW_NOT_OPEN / ERR_DEADLINE_PASSED / ERR_DISBURSEMENT_TOO_EARLY", http_status: 422, applies_to: "publish, submit, disbursement send" }
  - { priority: 12, category: business_fiscal, check: "Funds and amounts: fund available >= offer amount; disbursement sum <= award amount; DUPLICATE/DATA_ERROR adjustment keeps amount >= net_confirmed (OVER_AWARD/WITHDRAWAL may dip below into OVER_DISBURSED); renewal cap", error_id: "ERR_INSUFFICIENT_FUNDS / ERR_AMOUNT_EXCEEDS_REMAINING / ERR_ADJUSTMENT_EXCEEDS_DISBURSED / ERR_MAX_RENEWALS_REACHED", http_status: 422, applies_to: "award create, disbursement create, adjustment approve, renewal create/finalize" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- system / test-driving ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: string }
    side_effects: ["logical clock advanced"]
  - method: POST
    path: "/api/_ops/run_daily"
    description: "Ops-run daily checkpoint: dispatch due Reminders (send_at <= now -> SENT); close OPEN programs whose close_at passed; expire their DRAFT applications (reminders SUPPRESSED); expire OFFERED awards past offer_expires_at (reservation released, waitlist promotion fires)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { reminders_sent: integer, programs_closed: integer, applications_expired: integer, offers_expired: integer }
    side_effects: ["reminder_cadence_schedule dispatch", "application_window_gate close sweep", "offer expiry sweep"]

  # --- Student ---
