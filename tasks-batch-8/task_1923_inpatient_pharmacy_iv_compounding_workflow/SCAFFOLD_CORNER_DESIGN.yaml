      - name: role_mismatch_staff_role_header_conflict
        claim_type: rbac_denial
        grounds: ["validations[priority=3]", "errors[ERR_ROLE_MISMATCH]"]
        distinguishing_aspect: "Entity-backed identity: X-User-Role Pharmacist with X-User-ID of a TECHNICIAN staff row -> ERR_ROLE_MISMATCH (403)."
