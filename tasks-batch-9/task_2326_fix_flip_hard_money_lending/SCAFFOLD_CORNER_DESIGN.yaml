      - name: payoff_locks_the_loan_and_every_later_write_is_refused
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Loan.payment_status.terminal_states
          - state_machines.Loan.payment_status.transitions.CURRENT_to_PAID_OFF
          - state_machines.Property.transitions.BORROWER_OWNED_to_SOLD
          - validations[priority=30]
          - errors[ERR_PAYOFF_SHORT]
          - errors[ERR_LOAN_STATE_INVALID]
          - calculations.payoff_quote
        distinguishing_aspect: "PAID_OFF is terminal on all three axes at once: a payoff one cent short is rejected (ERR_PAYOFF_SHORT), the exact 16,560,001 quote settles the loan to PAID_OFF / EXITED with the property SOLD, and every later write — accrual, draw request, extension — answers ERR_LOAN_STATE_INVALID even when the OCC version supplied is fresh."
        test_recipe:
          setup:
            - "TIER_A sponsor b1; two APPROVED lines of 2,500,000 each (rehab 5,000,000); property 20,000,000 / ARV 32,000,000"
            - "sizing gives max_total 22,500,000 and committed 22,442,141 = initial 16,493,750 + reserve 948,391 before the decision pass"
            - "the decision pass recomputes reserve 1,002,923 and initial advance 16,439,218 with holdback 5,000,000"
            - "no accrual has been filed, so the per-diem anchor is closing_date - 1 = 2026-08-09"
            - "logical clock 2026-09-01T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lending/borrowers"
