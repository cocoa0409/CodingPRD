            - { call: "GET /sample-kits/${kb}", as: QualityLead, as_user_id: "${ql1}", payload: {}, captures: { kv4: "$.data.version" } }
            - { call: "POST /sample-kits/${kb}/custody-events", as: QualityLead, as_user_id: "${ql1}", payload: { event_type: LAB_OPENED, occurred_at: "2026-08-05T07:00:00Z", actor_label: "Analyst", seal_id_observed: "SEAL-E02", expected_sample_kit_version: "${kv4}" } }
            - { call: "POST /sample-kits/${kb}/lab-accept", as: QualityLead, as_user_id: "${ql1}", payload: { lab_note: "Usable." }, captures: { s3: "$.data.status", ci: "$.data.chain_integrity_status", dp: "$.data.disposition", th: "$.data.transit_hours" } }
            - { call: "GET /consumers/${c1}", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { n4: "$.data.open_kit_count" } }
          assert:
            - "open_kit_count starts at 0 and becomes 1 the moment the first kit is requested"
            - "a second kit on the consumer's OTHER triaged complaint is accepted with HTTP 201 in status \"REQUESTED\" and open_kit_count reaches 2 — the field is a live count, not a one-kit-per-consumer flag; the exclusivity in this domain bites at ship time (priority 34) and at remedy approval (priority 31), not at request time"
            - "cancelling the first kit sets it \"CANCELLED\" and brings open_kit_count back to 1, so the counter decrements on the abandonment exit as well"
            - "the cancelled kit's complaint moved \"AWAITING_SAMPLE\" to \"IN_RESOLUTION\" — the decrement and the sibling transition are one side-effect bundle"
            - "the surviving kit's full five-event chain gives transit_hours 96.00, chain_integrity_status \"INTACT\" and disposition \"USABLE\" at lab-accept, with status \"LAB_ACCEPTED\""
            - "open_kit_count is 0 after lab-accept: the counter tracks live kits only, and each of the four source events — two creates, one cancel, one completion — reconciled it exactly, with no drift back to 1"

      - name: corner_cascading_side_effects_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: recall_escalation_cascades_signal_to_complaints_to_remedies_to_plant_freeze
          rationale: "The four-level cascade from a recall escalation down through member complaints, their live remedies and the plant freeze is already asserted level by level in the difficulty instance, including the ordering-sensitive claim that remedies are voided only for complaints the cascade actually touched. A corner variant would restate the same chain with no new distinguishing aspect."

      - name: corner_dual_variant_calculation_delta_on_switch
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: severity_provisional_vs_adjudicated_band_divergence
          rationale: "The provisional-to-adjudicated switch, the numeric delta it produces and the band change it drives are the entire subject of that difficulty instance, which pins 57.00/S3 against 61.28/S2 on identical inputs. Duplicating it here would add no boundary or ordering nuance."

      - name: corner_rate_threshold_trigger_fires_at_the_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: ops_run_fires_at_exact_weighted_count_and_exact_threshold_ppm
          rationale: "That instance already sits both gates exactly on their inclusive boundaries — MIN_WEIGHTED_COUNT 3.0 and THRESHOLD_PPM.LOT 25.0 — and shows the sweep firing there while the one-notch-lower fixture does not. The cumulative-versus-instantaneous distinction does not apply, because this domain has a single windowed rate."

