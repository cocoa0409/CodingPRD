            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - &k_ingest648
              call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-cov", start_hour_iso: "2026-08-31T00:00:00Z", hour_count: 648, payload_mb: 100 }
              as: System
            - &k_claim
              call: "POST /agdata/warranty-claims"
              payload: { machine_id: "${machine_id}", claim_amount_cents: 500000, parts_amount_cents: 200000, description: "Alternator failure" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { claim_id: $.data.id }
            - &k_claim_submit
              call: "POST /agdata/warranty-claims/${claim_id}/submit"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
          trigger:
            - call: "POST /agdata/warranty-claims/${claim_id}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /agdata/warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /agdata/warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { error_id2: $.data.error_id }
          assert:
            - "the early settle returns 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "the second decide returns 409 and error_id2 == ERR_INVALID_STATE_TRANSITION"
            - "WarrantyClaim.${claim_id}.status == APPROVED with payout_cents == 450000 (floor(200000*0.9)=180000 parts + floor(min(300000,500000)*0.9)=270000 labor, age 12 months)"
            - "GET /agdata/dealers/${dealer_id} shows warranty_reserve_cents == 500000 (only settle releases it)"

