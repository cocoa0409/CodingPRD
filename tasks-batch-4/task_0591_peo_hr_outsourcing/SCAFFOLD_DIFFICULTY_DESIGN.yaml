scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: wc_premium_estimated_vs_audited
        grounds:
          - calculations.wc_premium
          - entities.PayrollLine.fields.wc_premium_estimated_cents
          - entities.InvoiceLine.fields.amount_cents
          - state_machines.PayrollRun.CALCULATED_to_APPROVED
        distinguishing_aspect: |
          Dual variant on the PAYROLL / WORKERS-COMP domain: the identical PayrollLine (gross
          120005 cents of which 20000 is overtime premium) is priced ESTIMATED at calculate time
          (full gross base -> 3000 cents) and AUDITED at invoice time (overtime premium stripped
          and payroll capped -> 2500 cents), so PayrollLine.wc_premium_estimated_cents and the
          PASS_THROUGH_WC_PREMIUM InvoiceLine disagree by 500 cents on the same data.
        test_recipe:
          setup:
            - "Master WC policy with payroll_cap_cents 15000000 and one class code 8810 at 250 cents per $100."
            - "ACTIVE client Acme (wc_experience_mod 1.0, credit_limit_cents 1000000000, delinquency_strikes 0)."
            - "One ACTIVE worksite employee (annual_salary_cents 2400120 -> semi-monthly base wages 100005) whose onboarding packet is APPROVED."
            - "One DRAFT payroll run for 2026-05-01..2026-05-15, check date 2026-05-20."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-2026-001", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321", payroll_cap_cents: 15000000 }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250, hazard_tier: "LOW" }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Acme Widgets", fein: "12-3456789", state_code: "CA", credit_limit_cents: 1000000000, wc_experience_mod: 1.0, service_agreement_signed: true }
              as: PeoAdmin
              captures: { client_a: $.data.id }
            - call: "POST /clients/${client_a}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${client_a}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Ann", last_name: "Lee", ssn_last4: "1234", birth_year: 1980, hire_date: "2026-05-01", annual_salary_cents: 2400120, employment_type: "FULL_TIME" }
              as: ClientAdmin
              as_user_id: "${client_a}"
              captures: { emp1: $.data.id, emp1_v: $.data.version }
            - call: "POST /worksite-employees/${emp1}/onboarding-packet"
              payload: { expected_employee_version: "${emp1_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${client_a}"
              captures: { pkt1: $.data.id }
            - call: "POST /onboarding-packets/${pkt1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_a}"
            - call: "POST /onboarding-packets/${pkt1}/review"
              payload: { decision: "APPROVE", reviewer_note: "I-9 verified" }
              as: PeoAdmin
              as_user_id: "admin-1"
            - call: "POST /clients/${client_a}/payroll-runs"
              payload: { period_start: "2026-05-01", period_end: "2026-05-15", check_date: "2026-05-20", pay_frequency: "SEMI_MONTHLY" }
              as: PayrollSpecialist
              as_user_id: "ps-1"
              captures: { run1: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${run1}/calculate"
              payload: { overtime_entries: [ { worksite_employee_id: "${emp1}", overtime_premium_cents: 20000 } ] }
              as: PayrollSpecialist
              as_user_id: "ps-1"
              captures: { run1_wc_est: $.data.total_wc_premium_estimated_cents }
            - call: "POST /payroll-runs/${run1}/approve"
              payload: {}
              as: PeoAdmin
              as_user_id: "admin-1"
            - call: "GET /client-invoices"
              payload: { payroll_run_id: "${run1}" }
              as: PeoAdmin
              captures: { inv1: "$.data[0].id", inv1_total: "$.data[0].total_cents" }
            - call: "GET /client-invoices/${inv1}/lines"
              payload: {}
              as: PeoAdmin
          assert:
            - "PayrollLine for ${emp1} in run ${run1}: gross_wages_cents == 120005 and overtime_premium_cents == 20000"
            - "PayrollLine.wc_premium_estimated_cents == 3000  (ESTIMATED variant: full gross base)"
            - "PayrollRun.${run1}.total_wc_premium_estimated_cents == 3000"
            - "InvoiceLine with line_type PASS_THROUGH_WC_PREMIUM on invoice ${inv1}: amount_cents == 2500  (AUDITED variant: overtime premium excluded)"
            - "InvoiceLine.PASS_THROUGH_WC_PREMIUM.amount_cents != PayrollRun.${run1}.total_wc_premium_estimated_cents"
            - "ClientInvoice.${inv1}.total_cents == 157405  (admin_fee 25000 + gross 120005 + employer_tax 9900 + benefits 0 + wc 2500)"

      - name: benefit_pool_composite_vs_age_banded
        grounds:
          - calculations.benefit_premium_rating
          - entities.BenefitPlan.fields.rating_method
          - entities.BenefitEnrollment.fields.monthly_premium_cents
          - entities.WorksiteEmployee.fields.birth_year
        distinguishing_aspect: |
          Dual variant on the BENEFITS-POOLING domain (a different entity domain from the payroll /
          workers-comp dual variant): the SAME two seated enrollees (ages 46 and 30 in plan year
          2026) are priced 90000 cents/month under COMPOSITE (flat 45000 x 2, headcount-only) and
          92000 cents/month under AGE_BANDED (40000 x 1.30 + 40000 x 1.00), with employer shares
          54000 vs 55200 — same population, two algorithms, different money.
        test_recipe:
          setup:
            - "ACTIVE client with two ACTIVE worksite employees (born 1980 and 1996), both onboarded and past the 30-day benefits waiting period."
            - "Pooled MEDICAL plan for 2026, rating_method COMPOSITE, composite_rate_cents 45000, age_band_base_rate_cents 40000, employer_contribution_pct 0.60, pool_capacity 5, participation_minimum_count 2."
            - "Open-enrollment window 2026-05-15..2026-06-30 for the client; logical clock at 2026-06-01 so the window is OPEN."
            - "Both employees enrolled (PENDING, seats occupied), so BenefitPlan.enrolled_count == 2."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-2026-002", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Borel Labs", fein: "22-3456789", state_code: "CA", credit_limit_cents: 1000000000, service_agreement_signed: true }
              as: PeoAdmin
              captures: { client_b: $.data.id }
            - call: "POST /clients/${client_b}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${client_b}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Ann", last_name: "Lee", ssn_last4: "1234", birth_year: 1980, hire_date: "2026-05-01", annual_salary_cents: 2400120, employment_type: "FULL_TIME" }
              as: ClientAdmin
              as_user_id: "${client_b}"
              captures: { emp1: $.data.id, emp1_v: $.data.version }
            - call: "POST /worksite-employees/${emp1}/onboarding-packet"
              payload: { expected_employee_version: "${emp1_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${client_b}"
              captures: { pkt1: $.data.id }
            - call: "POST /onboarding-packets/${pkt1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_b}"
            - call: "POST /onboarding-packets/${pkt1}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /clients/${client_b}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Bo", last_name: "Ng", ssn_last4: "5678", birth_year: 1996, hire_date: "2026-05-01", annual_salary_cents: 2400120, employment_type: "FULL_TIME" }
              as: ClientAdmin
              as_user_id: "${client_b}"
              captures: { emp2: $.data.id, emp2_v: $.data.version }
            - call: "POST /worksite-employees/${emp2}/onboarding-packet"
              payload: { expected_employee_version: "${emp2_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${client_b}"
              captures: { pkt2: $.data.id }
            - call: "POST /onboarding-packets/${pkt2}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_b}"
            - call: "POST /onboarding-packets/${pkt2}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /benefit-plans"
              payload: { carrier_name: "BlueRock", plan_type: "MEDICAL", plan_year: 2026, composite_rate_cents: 45000, age_band_base_rate_cents: 40000, pool_capacity: 5, participation_minimum_count: 2, rating_method: "COMPOSITE", employer_contribution_pct: 0.60 }
              as: PeoAdmin
              captures: { plan_med: $.data.id }
            - call: "POST /clients/${client_b}/enrollment-windows"
              payload: { plan_year: 2026, open_date: "2026-05-15", close_date: "2026-06-30" }
              as: PeoAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PeoAdmin
            - call: "POST /worksite-employees/${emp1}/benefit-enrollments"
              payload: { benefit_plan_id: "${plan_med}", coverage_start_date: "2026-07-01" }
              as: ClientAdmin
              as_user_id: "${client_b}"
              captures: { enr1: $.data.id, enr1_premium: $.data.monthly_premium_cents }
            - call: "POST /worksite-employees/${emp2}/benefit-enrollments"
              payload: { benefit_plan_id: "${plan_med}", coverage_start_date: "2026-07-01" }
              as: ClientAdmin
              as_user_id: "${client_b}"
              captures: { enr2: $.data.id }
          trigger:
            - call: "GET /benefit-plans/${plan_med}/premium-quote"
              payload: { rating_method: "COMPOSITE" }
              as: PeoAdmin
              captures: { q_comp: $.data.monthly_premium_cents }
            - call: "GET /benefit-plans/${plan_med}/premium-quote"
              payload: { rating_method: "AGE_BANDED" }
              as: PeoAdmin
              captures: { q_age: $.data.monthly_premium_cents }
          assert:
            - "COMPOSITE quote: enrollee_count == 2, monthly_premium_cents == 90000, employer_share_cents == 54000, employee_share_cents == 36000"
            - "AGE_BANDED quote: enrollee_count == 2, monthly_premium_cents == 92000, employer_share_cents == 55200, employee_share_cents == 36800"
            - "The two quotes over the identical seated population differ: 92000 != 90000"
            - "Stored BenefitEnrollment.${enr1}.monthly_premium_cents == 45000 (plan rating_method COMPOSITE), employer_share_cents == 27000, employee_share_cents == 18000"
            - "Neither quote call mutates state: BenefitPlan.${plan_med}.enrolled_count == 2 and pool_status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: admin_fee_tier_collar_surcharge_mode_a
        grounds:
          - calculations.admin_fee
          - entities.ClientCompany.fields.delinquency_strikes
          - entities.ClientInvoice.fields.admin_fee_cents
          - state_machines.PayrollRun.DEBIT_PENDING_to_FAILED
        distinguishing_aspect: |
          MODE (a) — a formula with four interacting inputs and non-linear interaction: the tier
          rate is selected by a branch on total_gross_wages_cents (8805000 -> 3.5%), the raw fee is
          then squeezed by a nested min(max(raw, 25000), 2500000) collar, and a conditional
          delinquency surcharge (x1.10, only when delinquency_strikes >= 1, applied AFTER the
          collar) lifts 308175 to 338993. Reordering surcharge and collar changes the answer.
        test_recipe:
          setup:
            - "ACTIVE client with credit_limit_cents 1000000000 and one ACTIVE employee whose annual_salary_cents is 211320000 (semi-monthly base wages 8805000)."
            - "Run 1 (2026-05-01..2026-05-15, check 2026-05-20) calculated, approved, funded, and then RETURNED by the bank -> ClientCompany.delinquency_strikes == 1 and the client is still ACTIVE (suspension needs 2 strikes)."
            - "Run 2 (2026-05-16..2026-05-31, check 2026-06-05) exists in DRAFT."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-2026-003", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321", payroll_cap_cents: 15000000 }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Cobalt Corp", fein: "33-3456789", state_code: "CA", credit_limit_cents: 1000000000, wc_experience_mod: 1.0, service_agreement_signed: true }
              as: PeoAdmin
              captures: { client_c: $.data.id }
            - call: "POST /clients/${client_c}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${client_c}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Cy", last_name: "Ko", ssn_last4: "9012", birth_year: 1980, hire_date: "2026-05-01", annual_salary_cents: 211320000, employment_type: "FULL_TIME" }
              as: ClientAdmin
              as_user_id: "${client_c}"
              captures: { emp1: $.data.id, emp1_v: $.data.version }
            - call: "POST /worksite-employees/${emp1}/onboarding-packet"
              payload: { expected_employee_version: "${emp1_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${client_c}"
              captures: { pkt1: $.data.id }
            - call: "POST /onboarding-packets/${pkt1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_c}"
            - call: "POST /onboarding-packets/${pkt1}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /clients/${client_c}/payroll-runs"
              payload: { period_start: "2026-05-01", period_end: "2026-05-15", check_date: "2026-05-20", pay_frequency: "SEMI_MONTHLY" }
              as: PayrollSpecialist
              as_user_id: "ps-1"
              captures: { run1: $.data.id }
            - call: "POST /payroll-runs/${run1}/calculate"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "ps-1"
            - call: "POST /payroll-runs/${run1}/approve"
              payload: {}
              as: PeoAdmin
              as_user_id: "admin-1"
            - call: "POST /payroll-runs/${run1}/fund"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "ps-1"
            - call: "POST /payroll-runs/${run1}/funding-events"
              payload: { outcome: "RETURNED" }
              as: PeoAdmin
              as_user_id: "admin-1"
            - call: "POST /clients/${client_c}/payroll-runs"
              payload: { period_start: "2026-05-16", period_end: "2026-05-31", check_date: "2026-06-05", pay_frequency: "SEMI_MONTHLY" }
              as: PayrollSpecialist
              as_user_id: "ps-1"
              captures: { run2: $.data.id }
            - call: "POST /payroll-runs/${run2}/calculate"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "ps-1"
          trigger:
            - call: "POST /payroll-runs/${run2}/approve"
              payload: {}
              as: PeoAdmin
              as_user_id: "admin-1"
            - call: "GET /client-invoices"
              payload: { payroll_run_id: "${run2}" }
              as: PeoAdmin
              captures: { inv2: "$.data[0].id", inv2_fee: "$.data[0].admin_fee_cents", inv2_total: "$.data[0].total_cents" }
          assert:
            - "ClientCompany.${client_c}.delinquency_strikes == 1 and status == ACTIVE"
            - "PayrollRun.${run2}.total_gross_wages_cents == 8805000 (tier 2 rate 0.035 selected)"
            - "ClientInvoice.${inv2}.admin_fee_cents == 338993  (raw 308175 -> collar leaves it unchanged -> x1.10 surcharge)"
            - "ClientInvoice.${inv2}.total_cents == 10037701  (338993 + 8805000 + 673583 employer tax + 0 benefits + 220125 wc)"
            - "The first invoice, issued while delinquency_strikes was 0, carries admin_fee_cents == 308175 — the surcharge is the only difference"

      - name: employer_tax_round_per_line_then_sum_mode_b
        grounds:
          - calculations.payroll_line_taxes
          - entities.PayrollLine.fields.employer_tax_total_cents
          - entities.PayrollRun.fields.total_employer_tax_cents
          - calculations.client_invoice_totals
        distinguishing_aspect: |
          MODE (b) — nested rounding where the ORDER decides the cents: two employees each grossing
          100005 give per-line employer tax 8250 (SS 6200 + Medicare 1450 + FUTA 600), summing to
          16500; recomputing the same taxes from the run's aggregate gross of 200010 would give
          16501 (SS 12401). The scaffold pins round-per-line-then-sum, so 16500 is the only correct
          value on both PayrollRun.total_employer_tax_cents and the PASS_THROUGH_EMPLOYER_TAX line.
        test_recipe:
          setup:
            - "ACTIVE client with two ACTIVE employees, each annual_salary_cents 2400120 (semi-monthly base wages 100005), no benefit enrollments (pre-tax deduction 0)."
            - "One DRAFT payroll run for 2026-05-01..2026-05-15, check date 2026-05-20."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-2026-004", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Delta Print", fein: "44-3456789", state_code: "CA", credit_limit_cents: 1000000000, wc_experience_mod: 1.0, service_agreement_signed: true }
              as: PeoAdmin
              captures: { client_d: $.data.id }
            - call: "POST /clients/${client_d}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${client_d}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Dee", last_name: "Ray", ssn_last4: "1111", birth_year: 1985, hire_date: "2026-05-01", annual_salary_cents: 2400120, employment_type: "FULL_TIME" }
              as: ClientAdmin
              as_user_id: "${client_d}"
              captures: { emp1: $.data.id, emp1_v: $.data.version }
            - call: "POST /worksite-employees/${emp1}/onboarding-packet"
              payload: { expected_employee_version: "${emp1_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${client_d}"
              captures: { pkt1: $.data.id }
            - call: "POST /onboarding-packets/${pkt1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_d}"
            - call: "POST /onboarding-packets/${pkt1}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /clients/${client_d}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Eli", last_name: "Sun", ssn_last4: "2222", birth_year: 1985, hire_date: "2026-05-01", annual_salary_cents: 2400120, employment_type: "FULL_TIME" }
              as: ClientAdmin
              as_user_id: "${client_d}"
              captures: { emp2: $.data.id, emp2_v: $.data.version }
            - call: "POST /worksite-employees/${emp2}/onboarding-packet"
              payload: { expected_employee_version: "${emp2_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${client_d}"
              captures: { pkt2: $.data.id }
            - call: "POST /onboarding-packets/${pkt2}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_d}"
            - call: "POST /onboarding-packets/${pkt2}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /clients/${client_d}/payroll-runs"
              payload: { period_start: "2026-05-01", period_end: "2026-05-15", check_date: "2026-05-20", pay_frequency: "SEMI_MONTHLY" }
              as: PayrollSpecialist
              as_user_id: "ps-1"
              captures: { run1: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${run1}/calculate"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "ps-1"
              captures: { er_total: $.data.total_employer_tax_cents }
            - call: "GET /payroll-runs/${run1}/lines"
              payload: {}
              as: PayrollSpecialist
            - call: "POST /payroll-runs/${run1}/approve"
              payload: {}
              as: PeoAdmin
              as_user_id: "admin-1"
            - call: "GET /client-invoices"
              payload: { payroll_run_id: "${run1}" }
              as: PeoAdmin
              captures: { inv1: "$.data[0].id" }
          assert:
            - "Each of the two PayrollLines: employer_ss_tax_cents == 6200, employer_medicare_tax_cents == 1450, employer_futa_tax_cents == 600, employer_tax_total_cents == 8250"
            - "PayrollRun.${run1}.total_employer_tax_cents == 16500  (NOT 16501, which sum-then-round on gross 200010 would produce)"
            - "PayrollRun.${run1}.total_gross_wages_cents == 200010 and total_employee_tax_cents == 35302"
            - "InvoiceLine PASS_THROUGH_EMPLOYER_TAX on invoice ${inv1}: amount_cents == 16500"
            - "ClientInvoice.${inv1}.total_cents == 246510  (admin_fee 25000 floor + 200010 + 16500 + 0 + 5000)"

  - rule_id: non_linear_state_machine
    instances:
      - name: payroll_run_parallel_processing_and_funding_dimensions
        grounds:
          - state_machines.PayrollRun.DEBIT_PENDING_to_FAILED
          - state_machines.PayrollRun.FAILED_to_DEBIT_PENDING
          - state_machines.PayrollRun.DEBIT_PENDING_to_FUNDED
          - state_machines.PayrollRun.APPROVED_to_PAID
          - entities.PayrollRun.fields.funding_status
        distinguishing_aspect: |
          PARALLEL state dimensions on ONE entity: PayrollRun.funding_status walks
          UNFUNDED -> DEBIT_PENDING -> FAILED -> DEBIT_PENDING -> FUNDED (a cycle through FAILED)
          while processing_status sits unchanged at APPROVED throughout, and only flips to PAID at
          the moment funding_status reaches FUNDED. The two axes evolve independently on the same row.
        test_recipe:
          setup:
            - "ACTIVE client with one ACTIVE employee (annual_salary_cents 2400120) and credit_limit_cents 1000000000."
            - "One payroll run 2026-05-01..2026-05-15 (check 2026-05-20) already CALCULATED and APPROVED, funding_status UNFUNDED."
          setup_api_calls:
            - call: "POST /wc-policies"
