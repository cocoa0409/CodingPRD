          On Session via the same badge's schedule: half-open [start,end) semantics — a badge holding
          a CONFIRMED 10:00-11:00 reservation CAN also reserve an adjacent 11:00-12:00 session (end==start,
          no conflict) but CANNOT reserve an overlapping 10:30-11:30 session (ERR_SESSION_TIME_CONFLICT).
        test_recipe:
          setup:
            - "Three sessions: A 10:00-11:00, B 11:00-12:00 (adjacent), C 10:30-11:30 (overlapping A)"
            - "One badge holds a CONFIRMED reservation on session A"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Sess Overlap Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 100 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /conventions/${conv_id}/sessions"
              payload: { title: "A", start_utc: "2026-09-01T10:00:00Z", end_utc: "2026-09-01T11:00:00Z", seat_capacity: 5 }
              as: ConventionAdmin
              captures: { sess_a: $.data.id }
            - call: "POST /conventions/${conv_id}/sessions"
              payload: { title: "B", start_utc: "2026-09-01T11:00:00Z", end_utc: "2026-09-01T12:00:00Z", seat_capacity: 5 }
              as: ConventionAdmin
              captures: { sess_b: $.data.id }
            - call: "POST /conventions/${conv_id}/sessions"
              payload: { title: "C", start_utc: "2026-09-01T10:30:00Z", end_utc: "2026-09-01T11:30:00Z", seat_capacity: 5 }
              as: ConventionAdmin
              captures: { sess_c: $.data.id }
            - call: "POST /attendees"
              payload: { email: "sessover@x.com", full_name: "Sess Over" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { conv_v: $.data.version }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_convention_version: "${conv_v}" }
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /badges?order_id=${order_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { badge_id: "$.data[0].id" }
            - call: "GET /sessions/${sess_a}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { sva: $.data.version }
            - call: "POST /session-reservations"
              payload: { session_id: "${sess_a}", badge_id: "${badge_id}", expected_session_version: "${sva}" }
              as: Attendee
              as_user_id: "${att_id}"
          trigger:
            - call: "GET /sessions/${sess_b}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { svb: $.data.version }
            - call: "POST /session-reservations"
              payload: { session_id: "${sess_b}", badge_id: "${badge_id}", expected_session_version: "${svb}" }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { resv_b: $.data.id, st_b: $.data.status }
            - call: "GET /sessions/${sess_c}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { svc: $.data.version }
            - call: "POST /session-reservations"
              payload: { session_id: "${sess_c}", badge_id: "${badge_id}", expected_session_version: "${svc}" }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "adjacent session B reservation succeeds: SessionReservation.${resv_b}.status == CONFIRMED"
            - "overlapping session C reservation returns http 409 with error_id == ERR_SESSION_TIME_CONFLICT"
      - name: booth_buffered_closed_interval_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.Booth.fields.setup_buffer_hours
          - entities.BoothBooking.fields.occupy_start_utc
          - entities.BoothBooking.fields.occupy_end_utc
          - errors[ERR_BOOTH_TIME_CONFLICT]
        distinguishing_aspect: |
          On Booth via buffer-expanded CLOSED intervals (different semantics than Session's half-open):
          with setup_buffer_hours=12, a booking [Sep1 00:00, Sep1 23:59] and a second booking
          [Sep2 12:00, Sep3 12:00] collide because their 12h-expanded closed intervals touch
          (ERR_BOOTH_TIME_CONFLICT), even though the raw intervals do not overlap.
        test_recipe:
          setup:
            - "One booth with setup_buffer_hours=12; an exhibitor with a RESERVED booking [Sep1 00:00, Sep1 23:59]"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Booth Overlap Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-05T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/booths"
              payload: { booth_code: "B1", zone: "STANDARD", setup_buffer_hours: 12 }
              as: ConventionAdmin
              captures: { booth_id: $.data.id }
            - call: "POST /exhibitors"
              payload: { convention_id: "${conv_id}", company_name: "Vendor1", contact_email: "vendor1@x.com" }
              as: Anonymous
              captures: { exh_id: $.data.id }
            - call: "POST /booth-bookings"
              payload: { booth_id: "${booth_id}", exhibitor_id: "${exh_id}", occupy_start_utc: "2026-09-01T00:00:00Z", occupy_end_utc: "2026-09-01T23:59:00Z", requested_days: 1 }
              as: Exhibitor
              as_user_id: "${exh_id}"
              captures: { bk1: $.data.id }
          trigger:
            - call: "POST /booth-bookings"
              payload: { booth_id: "${booth_id}", exhibitor_id: "${exh_id}", occupy_start_utc: "2026-09-02T12:00:00Z", occupy_end_utc: "2026-09-03T12:00:00Z", requested_days: 1 }
              as: Exhibitor
              as_user_id: "${exh_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "second booking returns http 409 with error_id == ERR_BOOTH_TIME_CONFLICT (buffer-expanded closed intervals touch)"
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: badge_count_conserved_across_pay_then_refund
        grounds:
          - state_machines.Order.PENDING_PAYMENT_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Convention.fields.badges_issued_count
          - calculations.capacity_counters
        distinguishing_aspect: |
          Conserved quantity = Convention.badges_issued_count (badge inventory): pay increments it by
          the issued count and refund decrements it by the voided count, so after pay-then-refund of
          the same order badges_issued_count returns exactly to its pre-pay value (0 here).
        test_recipe:
          setup:
            - "Convention capacity 100, badges_issued_count starts at 0; a submitted PENDING_PAYMENT order of 3 GENERAL"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Conserve Badge Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 100 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "consbadge@x.com", full_name: "Cons Badge" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 3 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { conv_v: $.data.version }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_convention_version: "${conv_v}" }
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { cnt_after_pay: $.data.badges_issued_count }
          trigger:
            - call: "POST /orders/${order_id}/refund"
              payload: {}
              as: RegistrationAgent
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { cnt_after_refund: $.data.badges_issued_count }
          assert:
            - "after pay: Convention.${conv_id}.badges_issued_count == 3"
            - "after refund: Convention.${conv_id}.badges_issued_count == 0 (conserved back to pre-pay value)"
      - name: estimated_booth_cents_conserved_across_book_then_release
        grounds:
          - state_machines.BoothBooking.RESERVED_to_RELEASED
          - entities.Exhibitor.fields.estimated_booth_cents
          - calculations.booth_charge
        distinguishing_aspect: |
          Conserved quantity = Exhibitor.estimated_booth_cents (forward-looking booth revenue, a
          DIFFERENT type than badge count): booking a PREMIUMx3 booth adds 360000 to the estimate, and
          releasing the same RESERVED booking removes 360000, so the estimate returns exactly to 0.
        test_recipe:
          setup:
            - "One PREMIUM booth; an exhibitor with estimated_booth_cents=0"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Conserve Booth Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-05T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/booths"
              payload: { booth_code: "P1", zone: "PREMIUM", setup_buffer_hours: 0 }
              as: ConventionAdmin
              captures: { booth_id: $.data.id }
            - call: "POST /exhibitors"
              payload: { convention_id: "${conv_id}", company_name: "Vendor2", contact_email: "vendor2@x.com" }
              as: Anonymous
              captures: { exh_id: $.data.id }
            - call: "POST /booth-bookings"
              payload: { booth_id: "${booth_id}", exhibitor_id: "${exh_id}", occupy_start_utc: "2026-09-01T00:00:00Z", occupy_end_utc: "2026-09-03T00:00:00Z", requested_days: 3 }
              as: Exhibitor
              as_user_id: "${exh_id}"
              captures: { bk_id: $.data.id }
            - call: "GET /exhibitors/${exh_id}"
              payload: {}
              as: Exhibitor
              as_user_id: "${exh_id}"
              captures: { est_after_book: $.data.estimated_booth_cents }
          trigger:
            - call: "POST /booth-bookings/${bk_id}/release"
              payload: {}
              as: Exhibitor
              as_user_id: "${exh_id}"
            - call: "GET /exhibitors/${exh_id}"
              payload: {}
              as: Exhibitor
              as_user_id: "${exh_id}"
              captures: { est_after_release: $.data.estimated_booth_cents }
          assert:
            - "after booking: Exhibitor.${exh_id}.estimated_booth_cents == 360000"
            - "after release: Exhibitor.${exh_id}.estimated_booth_cents == 0 (conserved back to pre-booking value)"
