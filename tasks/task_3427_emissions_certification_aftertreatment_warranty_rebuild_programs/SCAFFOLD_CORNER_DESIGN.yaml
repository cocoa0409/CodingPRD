        distinguishing_aspect: "in_service_date strictly after the logical clock fails 422 ERR_IN_SERVICE_DATE_IN_FUTURE; a date equal to the clock is accepted (inclusive)."
        test_recipe:
          setup:
            - "Logical clock 2026-11-01T00:00:00Z; family IN_PRODUCTION; fleet registered."
