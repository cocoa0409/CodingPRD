    input: [asset_id, requester_id, purpose, requested_delivery_by, "delivery_tier?"]
    output: RetrievalRequest
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/archive/retrieval-requests"
    description: "List retrieval requests"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["asset_id?", "requester_id?", "status?", "limit?", "offset?"]
    output: "RetrievalRequest[]"
    side_effects: []
  - method: GET
    path: "/archive/retrieval-requests/{id}"
    description: "Get a retrieval request"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: []
  - method: POST
    path: "/archive/retrieval-requests/{id}/start-review"
    description: "Begin review (SUBMITTED → UNDER_REVIEW)"
    roles: [AccessOfficer]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: []
  - method: POST
    path: "/archive/retrieval-requests/{id}/approve"
    description: "Approve: fork by storage tier → STAGED (non-DEEP, staged_at=now) or RECALLING (DEEP_ARCHIVE); quotes fee"
    roles: [AccessOfficer]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: ["quoted_fee_cents := delivery_fee_cents; STAGED fork sets staged_at := now"]
  - method: POST
    path: "/archive/retrieval-requests/{id}/return"
    description: "Return for more info (UNDER_REVIEW → SUBMITTED); return_count += 1"
    roles: [AccessOfficer]
    code: 200
    input: [note]
    output: RetrievalRequest
    side_effects: ["return_count += 1"]
  - method: POST
    path: "/archive/retrieval-requests/{id}/reject"
    description: "Reject (UNDER_REVIEW → REJECTED)"
    roles: [AccessOfficer]
    code: 200
    input: [note]
    output: RetrievalRequest
    side_effects: []
  - method: POST
    path: "/archive/retrieval-requests/{id}/stage-complete"
    description: "Complete a deep-archive recall (RECALLING → STAGED)"
    roles: [LabTechnician]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: ["staged_at := now"]
  - method: POST
    path: "/archive/retrieval-requests/{id}/deliver"
    description: "Deliver a staged request (STAGED → DELIVERED)"
    roles: [AccessOfficer]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: ["delivered_at := now"]
  - method: POST
    path: "/archive/retrieval-requests/{id}/cancel"
    description: "Cancel a non-terminal request; Requester may cancel only own requests"
    roles: [Requester, AccessOfficer]
    code: 200
    input: []
    output: RetrievalRequest
    side_effects: []

  # --- UsageEvent ---
  - method: POST
    path: "/archive/usage-events"
    description: "Report a usage event (REPORTED)"
    roles: [Requester]
    code: 201
    input: [asset_id, reported_by_id, usage_type, market_size, duration_seconds_used, aired_at]
    output: UsageEvent
    side_effects: ["status = REPORTED"]
  - method: GET
    path: "/archive/usage-events/{id}"
    description: "Get a usage event"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: UsageEvent
    side_effects: []

  - method: GET
    path: "/archive/usage-events"
    description: "List usage events"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["asset_id?", "reported_by_id?", "statement_id?", "status?", "limit?", "offset?"]
    output: "UsageEvent[]"
    side_effects: []
  - method: POST
    path: "/archive/usage-events/{id}/verify"
    description: "Verify an event (REPORTED → VERIFIED); computes provisional_accrual_cents"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: UsageEvent
    side_effects: ["provisional_accrual_cents := royalty_event_accrual(provisional)"]
  - method: POST
    path: "/archive/usage-events/{id}/dispute"
    description: "Dispute an event (REPORTED|VERIFIED → DISPUTED)"
    roles: [FinanceOfficer]
    code: 200
    input: [reason]
    output: UsageEvent
    side_effects: []
  - method: POST
    path: "/archive/usage-events/{id}/resubmit"
    description: "Resubmit a disputed event (DISPUTED → REPORTED); only the original reporter"
    roles: [Requester]
    code: 200
    input: []
    output: UsageEvent
    side_effects: ["provisional_accrual_cents := null"]

  # --- RoyaltyStatement ---
  - method: POST
    path: "/archive/royalty-statements"
    description: "Create a statement (OPEN); rejects overlapping non-terminal period for same rights_holder"
    roles: [FinanceOfficer]
    code: 201
    input: [rights_holder, period_start, period_end]
    output: RoyaltyStatement
    side_effects: ["status = OPEN"]
  - method: GET
    path: "/archive/royalty-statements"
    description: "List royalty statements"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["rights_holder?", "status?", "limit?", "offset?"]
    output: "RoyaltyStatement[]"
    side_effects: []
  - method: GET
    path: "/archive/royalty-statements/{id}"
    description: "Get a royalty statement"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []
  - method: POST
    path: "/archive/royalty-statements/{id}/close"
    description: "Close: sweep VERIFIED events in period, compute volume tier + per-event finals"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["event snapshot + totals per royalty_statement_totals"]
  - method: POST
    path: "/archive/royalty-statements/{id}/reopen"
    description: "Reopen a CLOSED statement; clears snapshot and resets swept events' statement_id"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["event_ids := []; events' statement_id := null; totals := null"]
  - method: POST
    path: "/archive/royalty-statements/{id}/post"
    description: "Post a CLOSED statement: period ended, payout >= minimum, snapshot still VERIFIED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["swept UsageEvents VERIFIED → ROYALTY_POSTED"]

  # --- MigrationJob ---
  - method: POST
    path: "/archive/migration-jobs"
    description: "Create a migration job (QUEUED); OCC via expected_asset_version; supersedes an existing QUEUED job for the asset"
    roles: [ArchivistLead]
    code: 201
    input: [asset_id, target_tier, expected_asset_version]
    output: MigrationJob
    side_effects:
      - "existing QUEUED MigrationJob for the asset → SUPERSEDED"
      - "increments Asset.version by 1"
  - method: GET
    path: "/archive/migration-jobs/{id}"
    description: "Get a migration job"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: MigrationJob
    side_effects: []

  - method: GET
    path: "/archive/migration-jobs"
    description: "List migration jobs"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["asset_id?", "status?", "limit?", "offset?"]
    output: "MigrationJob[]"
    side_effects: []
  - method: POST
    path: "/archive/migration-jobs/{id}/start"
    description: "Start a queued job (QUEUED → IN_PROGRESS)"
    roles: [LabTechnician]
    code: 200
    input: []
    output: MigrationJob
    side_effects: []
  - method: POST
    path: "/archive/migration-jobs/{id}/complete"
    description: "Complete a job: asset tier updated, RECALLING requests staged if tier != DEEP_ARCHIVE"
    roles: [LabTechnician]
    code: 200
    input: [checksum_sha256]
    output: MigrationJob
    side_effects: ["Asset.storage_tier := target_tier; Asset.version += 1; RECALLING requests → STAGED when target != DEEP_ARCHIVE"]
  - method: POST
    path: "/archive/migration-jobs/{id}/fail"
    description: "Fail an in-progress job (IN_PROGRESS → FAILED)"
    roles: [LabTechnician]
    code: 200
    input: [reason]
    output: MigrationJob
    side_effects: []
  - method: POST
    path: "/archive/migration-jobs/{id}/retry"
    description: "Retry a FAILED job (FAILED → QUEUED); cap MAX_MIGRATION_RETRIES = 2"
    roles: [LabTechnician]
    code: 200
    input: []
    output: MigrationJob
    side_effects: ["retry_count += 1"]
  - method: POST
    path: "/archive/migration-jobs/{id}/cancel"
    description: "Cancel a QUEUED or HOLD_PAUSED job"
    roles: [ArchivistLead]
    code: 200
    input: []
    output: MigrationJob
    side_effects: []

  # --- DigitizationTicket ---
  - method: POST
    path: "/archive/digitization-tickets"
    description: "Create a digitization ticket for an obsolete-format asset (QUEUED)"
    roles: [ArchivistLead]
    code: 201
    input: [asset_id, scheduled_start, scheduled_end, output_format]
    output: DigitizationTicket
    side_effects: ["status = QUEUED; priority_score computed"]
  - method: GET
    path: "/archive/digitization-tickets/{id}"
    description: "Get a digitization ticket"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: []

  - method: GET
    path: "/archive/digitization-tickets"
    description: "List digitization tickets"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["asset_id?", "workstation_id?", "status?", "limit?", "offset?"]
    output: "DigitizationTicket[]"
    side_effects: []
  - method: POST
    path: "/archive/digitization-tickets/{id}/assign"
    description: "Assign a queued ticket to a workstation with buffered schedule validation"
    roles: [LabTechnician]
    code: 200
    input: [workstation_id]
    output: DigitizationTicket
    side_effects: ["workstation_id set"]
  - method: POST
    path: "/archive/digitization-tickets/auto-assign"
    description: "Selector: pick the highest-priority QUEUED ticket whose asset format the workstation supports (priority_score DESC, tie created_at ASC); empty pool → ERR_NO_ELIGIBLE_TICKET; sets slot to now..now+4h"
    roles: [LabTechnician]
    code: 200
    input: [workstation_id]
    output: DigitizationTicket
    side_effects: ["chosen ticket → ASSIGNED with scheduled_start := now, scheduled_end := now + 4h"]
  - method: POST
    path: "/archive/digitization-tickets/{id}/start"
    description: "Start digitizing (ASSIGNED → DIGITIZING); requires now >= scheduled_start"
    roles: [LabTechnician]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: []
  - method: POST
    path: "/archive/digitization-tickets/{id}/submit-qc"
    description: "Submit for QC (DIGITIZING → QC_REVIEW)"
    roles: [LabTechnician]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: []
  - method: POST
    path: "/archive/digitization-tickets/{id}/qc-pass"
    description: "Pass QC (QC_REVIEW → COMPLETED); creates derivative Asset with source_asset_id"
    roles: [LabTechnician]
    code: 200
    input: ["qc_notes?"]
    output: DigitizationTicket
    side_effects: ["Derivative Asset created (source_asset_id, format_class := output_format, same ingest_batch_id, METADATA_DRAFT, ONLINE)"]
  - method: POST
    path: "/archive/digitization-tickets/{id}/qc-fail"
    description: "Fail QC: rework loop to QUEUED while rework_count < 2, else terminal QC_FAILED"
    roles: [LabTechnician]
    code: 200
    input: [qc_notes]
    output: DigitizationTicket
    side_effects: ["rework_count += 1; workstation_id := null"]
  - method: POST
    path: "/archive/digitization-tickets/{id}/cancel"
    description: "Cancel a QUEUED or ASSIGNED ticket"
    roles: [ArchivistLead]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: []

  # --- Workstation ---
  - method: POST
    path: "/archive/workstations"
    description: "Create a workstation (ACTIVE)"
    roles: [SystemAdmin]
    code: 201
    input: [name, supported_formats]
    output: Workstation
    side_effects: []
  - method: GET
    path: "/archive/workstations/{id}"
    description: "Get a workstation"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: Workstation
    side_effects: []

  - method: GET
    path: "/archive/workstations"
    description: "List workstations"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Workstation[]"
    side_effects: []
  - method: PATCH
    path: "/archive/workstations/{id}"
    description: "Toggle workstation status ACTIVE ↔ MAINTENANCE; blocked while tickets ASSIGNED/DIGITIZING"
    roles: [SystemAdmin]
    code: 200
    input: [status]
    output: Workstation
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation (incl. Requester cancelling another user's request or resubmitting another's event, and withdraw by non-creator)" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum value, non-positive duration/size/market_size, scheduled_end <= scheduled_start, window_start >= window_end, scheduled_execution_date <= now at create" }
  # --- not found (404) ---
  - { id: ERR_STAFF_MEMBER_NOT_FOUND, http: 404, condition: "StaffMember id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "IngestBatch id does not exist" }
  - { id: ERR_ASSET_NOT_FOUND, http: 404, condition: "Asset id does not exist" }
  - { id: ERR_PROXY_NOT_FOUND, http: 404, condition: "ProxyRendition id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "RightsGrant id does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "LegalHold id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "DisposalOrder id does not exist" }
  - { id: ERR_RETRIEVAL_REQUEST_NOT_FOUND, http: 404, condition: "RetrievalRequest id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "UsageEvent id does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "RoyaltyStatement id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "MigrationJob id does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "DigitizationTicket id does not exist" }
  - { id: ERR_WORKSTATION_NOT_FOUND, http: 404, condition: "Workstation id does not exist" }
  # --- state (409) ---
  - { id: ERR_BATCH_NOT_OPEN, http: 409, condition: "Asset create targets a batch not in OPEN" }
  - { id: ERR_EMPTY_BATCH, http: 409, condition: "Finalize on a batch with zero assets" }
  - { id: ERR_BATCH_ASSETS_UNRESOLVED, http: 409, condition: "Finalize while some asset still METADATA_DRAFT" }
  - { id: ERR_INVALID_CATALOG_TRANSITION, http: 409, condition: "Catalog transition attempted from a state where it is not defined" }
  - { id: ERR_ASSET_LOCKED, http: 409, condition: "PATCH metadata attempted outside METADATA_DRAFT/IN_REVIEW" }
  - { id: ERR_PROXY_NOT_READY, http: 409, condition: "archive requires >= 1 ProxyRendition in READY" }
  - { id: ERR_NO_RIGHTS_GRANT_ON_RECORD, http: 409, condition: "archive requires >= 1 RightsGrant row for the asset" }
  - { id: ERR_PROXY_NOT_QUEUED, http: 409, condition: "claim requires QUEUED" }
  - { id: ERR_PROXY_NOT_RENDERING, http: 409, condition: "complete/fail requires RENDERING" }
  - { id: ERR_PROXY_NOT_FAILED, http: 409, condition: "retry requires FAILED" }
  - { id: ERR_RETRY_BUDGET_EXHAUSTED, http: 409, condition: "retry attempted with retry_count at cap (proxy 3, migration 2)" }
  - { id: ERR_GRANT_ALREADY_REVOKED, http: 409, condition: "revoke on a REVOKED grant" }
  - { id: ERR_HOLD_ALREADY_RELEASED, http: 409, condition: "release on a RELEASED hold" }
  - { id: ERR_ACTIVE_DISPOSAL_ORDER_EXISTS, http: 409, condition: "create while another non-terminal DisposalOrder exists for the asset" }
  - { id: ERR_DISPOSAL_ORDER_NOT_DRAFT, http: 409, condition: "submit requires DRAFT" }
  - { id: ERR_DISPOSAL_ORDER_NOT_PENDING, http: 409, condition: "approve/reject requires PENDING_APPROVAL" }
  - { id: ERR_DISPOSAL_ORDER_NOT_APPROVED, http: 409, condition: "execute requires APPROVED" }
  - { id: ERR_DISPOSAL_ORDER_NOT_BLOCKED, http: 409, condition: "resubmit requires BLOCKED" }
  - { id: ERR_DISPOSAL_ORDER_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires DRAFT or APPROVED" }
  - { id: ERR_ASSET_DISPOSED, http: 409, condition: "Operation targets a DISPOSED asset (retrieval create, migration create, digitization create)" }
  - { id: ERR_ASSET_NOT_RETRIEVABLE, http: 409, condition: "Retrieval create requires asset catalog_status in {CATALOGED, ARCHIVED}" }
  - { id: ERR_ASSET_NOT_ARCHIVED, http: 409, condition: "Disposal-order create requires asset catalog_status == ARCHIVED" }
  - { id: ERR_REQUEST_NOT_SUBMITTED, http: 409, condition: "start-review requires SUBMITTED" }
  - { id: ERR_REQUEST_NOT_UNDER_REVIEW, http: 409, condition: "approve/return/reject requires UNDER_REVIEW" }
  - { id: ERR_REQUEST_NOT_RECALLING, http: 409, condition: "stage-complete requires RECALLING" }
  - { id: ERR_REQUEST_NOT_STAGED, http: 409, condition: "deliver requires STAGED" }
  - { id: ERR_REQUEST_TERMINAL, http: 409, condition: "cancel attempted on DELIVERED/REJECTED/CANCELLED/EXPIRED request" }
  - { id: ERR_EVENT_NOT_REPORTED, http: 409, condition: "verify requires REPORTED" }
  - { id: ERR_EVENT_NOT_DISPUTABLE, http: 409, condition: "dispute requires REPORTED or VERIFIED" }
  - { id: ERR_EVENT_NOT_DISPUTED, http: 409, condition: "resubmit requires DISPUTED" }
  - { id: ERR_STATEMENT_NOT_OPEN, http: 409, condition: "close requires OPEN" }
  - { id: ERR_STATEMENT_NOT_CLOSED, http: 409, condition: "post/reopen requires CLOSED" }
  - { id: ERR_STATEMENT_EMPTY, http: 409, condition: "close with zero matched VERIFIED events in period" }
  - { id: ERR_STATEMENT_EVENTS_DIRTY, http: 409, condition: "post when a snapshotted event is no longer VERIFIED (e.g., disputed after close)" }
  - { id: ERR_JOB_NOT_QUEUED, http: 409, condition: "start requires QUEUED" }
  - { id: ERR_JOB_NOT_IN_PROGRESS, http: 409, condition: "complete/fail requires IN_PROGRESS" }
  - { id: ERR_JOB_NOT_FAILED, http: 409, condition: "retry requires FAILED" }
  - { id: ERR_JOB_NOT_CANCELLABLE, http: 409, condition: "cancel requires QUEUED or HOLD_PAUSED" }
  - { id: ERR_JOB_IN_PROGRESS_EXISTS, http: 409, condition: "migration create while another job for the asset is IN_PROGRESS" }
  - { id: ERR_TICKET_NOT_QUEUED, http: 409, condition: "assign requires QUEUED" }
  - { id: ERR_TICKET_NOT_ASSIGNED, http: 409, condition: "start requires ASSIGNED" }
  - { id: ERR_TICKET_NOT_DIGITIZING, http: 409, condition: "submit-qc requires DIGITIZING" }
  - { id: ERR_TICKET_NOT_IN_QC, http: 409, condition: "qc-pass/qc-fail requires QC_REVIEW" }
  - { id: ERR_TICKET_NOT_CANCELLABLE, http: 409, condition: "ticket cancel requires QUEUED or ASSIGNED" }
  - { id: ERR_WORKSTATION_UNAVAILABLE, http: 409, condition: "assign/auto-assign to a MAINTENANCE workstation" }
  - { id: ERR_WORKSTATION_BUSY, http: 409, condition: "MAINTENANCE transition while tickets ASSIGNED or DIGITIZING" }
  # --- safety / compliance ---
  - { id: ERR_LEGAL_HOLD_ACTIVE, http: 409, condition: "Disposal approve/execute/resubmit or migration create while asset HELD" }
  - { id: ERR_ASSET_UNDER_LEGAL_HOLD, http: 409, condition: "Retrieval create/approve while asset HELD" }
  - { id: ERR_SOD_METADATA_SELF_APPROVE, http: 403, condition: "metadata-approve X-User-ID equals metadata_submitted_by_user_id" }
  - { id: ERR_SOD_DISPOSAL_SELF_APPROVE, http: 403, condition: "disposal approve X-User-ID equals created_by_user_id" }
  - { id: ERR_SOD_RETRIEVAL_SELF_APPROVE, http: 403, condition: "retrieval approve X-User-ID equals requester_id" }
  - { id: ERR_SOD_HOLD_SELF_RELEASE, http: 403, condition: "hold release X-User-ID equals placed_by_user_id" }
  - { id: ERR_ASSET_VERSION_DRIFT, http: 409, condition: "asset.version != pinned_asset_version at disposal approve/execute" }
  # --- temporal (422) ---
  - { id: ERR_RIGHTS_WINDOW_PAST, http: 422, condition: "RightsGrant create with window_end <= now" }
  - { id: ERR_EXCLUSIVE_GRANT_OVERLAP, http: 422, condition: "Exclusive grant window overlaps an ACTIVE exclusive grant with same (asset, grant_type, territory) under half-open semantics" }
  - { id: ERR_DELIVERY_DEADLINE_PAST, http: 422, condition: "requested_delivery_by <= now" }
  - { id: ERR_DELIVERY_BEYOND_RIGHTS_WINDOW, http: 422, condition: "BROADCAST request with requested_delivery_by >= window_end of any effective grant relied upon (end-exclusive boundary)" }
  - { id: ERR_RIGHTS_EXPIRED_FOR_PURPOSE, http: 422, condition: "Purpose gate fails against current rights_posture (EXPIRED rejects all purposes; RESTRICTED rejects BROADCAST)" }
  - { id: ERR_TICKET_NOT_DUE, http: 422, condition: "ticket start before scheduled_start" }
  - { id: ERR_DISPOSAL_NOT_YET_DUE, http: 422, condition: "execute before scheduled_execution_date" }
  - { id: ERR_PERIOD_NOT_ENDED, http: 422, condition: "statement post before period_end" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 422, condition: "statement create overlapping a non-terminal statement for same rights_holder (half-open)" }
  - { id: ERR_WORKSTATION_SCHEDULE_CONFLICT, http: 422, condition: "assign/auto-assign violating the 30-minute turnaround buffer on the workstation" }
  # --- constraint (422) ---
  - { id: ERR_METADATA_INCOMPLETE, http: 422, condition: "submit-metadata with empty description, empty keywords, or content_rating == NR" }
  - { id: ERR_FORMAT_NOT_OBSOLETE, http: 422, condition: "digitization ticket for asset whose format_class not in OBSOLETE_FORMATS {BETACAM_SP, UMATIC, VHS, FILM_16MM, AUDIO_REEL, AUDIO_DAT}" }
  - { id: ERR_WORKSTATION_FORMAT_UNSUPPORTED, http: 422, condition: "assign/auto-assign where asset.format_class not in workstation.supported_formats" }
  - { id: ERR_DUPLICATE_MEDIA_TYPE_POLICY, http: 422, condition: "RetentionPolicy with media_type already present" }
  - { id: ERR_DUPLICATE_WORKSTATION_NAME, http: 422, condition: "Workstation name already present" }
  - { id: ERR_DUPLICATE_STAFF_EMAIL, http: 422, condition: "StaffMember email already present" }
  - { id: ERR_RETENTION_NOT_ELAPSED, http: 422, condition: "Disposal create before created_at + retention years (365-day years) without retention_override" }
  - { id: ERR_NO_ELIGIBLE_TICKET, http: 409, condition: "auto-assign found no QUEUED ticket eligible for the workstation" }
  # --- fiscal (402) ---
  - { id: ERR_PAYOUT_BELOW_MINIMUM, http: 402, condition: "statement post with total_accrual_cents < MIN_PAYOUT_CENTS (1000)" }
  # --- OCC (412) ---
  - { id: ERR_STALE_ASSET_VERSION, http: 412, condition: "expected_asset_version != current asset.version on disposal-orders / migration-jobs create" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator: staff registry, retention policies, workstations, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /archive/staff-members"
      - "POST /archive/retention-policies"
      - "POST /archive/workstations"
      - "PATCH /archive/workstations/{id}"
      - "POST /archive/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: IngestCoordinator
    description: "Runs ingest batches and asset intake"
    identity: opaque
    exclusive_operations:
      - "POST /archive/ingest-batches"
      - "POST /archive/ingest-batches/{id}/finalize"
      - "POST /archive/assets"
    shared_operations: ["POST /archive/proxy-renditions (with LabTechnician)", "All GET endpoints"]
  - name: MetadataCataloger
    description: "Edits and submits standardized metadata"
    identity: opaque
    exclusive_operations:
      - "PATCH /archive/assets/{id}"
      - "POST /archive/assets/{id}/submit-metadata"
    shared_operations: ["All GET endpoints"]
  - name: MetadataLibrarian
    description: "Approves/rejects metadata submissions (segregated from submitter)"
    identity: opaque
    exclusive_operations:
      - "POST /archive/assets/{id}/metadata-approve"
      - "POST /archive/assets/{id}/metadata-reject"
    shared_operations: ["All GET endpoints"]
  - name: ArchivistLead
    description: "Archives assets, manages disposal orders, migrations, digitization tickets"
    identity: opaque
    exclusive_operations:
      - "POST /archive/assets/{id}/archive"
      - "POST /archive/assets/{id}/recatalog"
      - "POST /archive/disposal-orders (+ submit/approve/reject/resubmit/execute/withdraw)"
      - "POST /archive/migration-jobs (+ cancel)"
      - "POST /archive/digitization-tickets (+ cancel)"
    shared_operations: ["GET /archive/assets/{id}/storage-cost (with SystemAdmin, FinanceOfficer)", "All GET endpoints"]
  - name: RightsManager
    description: "Manages rights grants and revocations"
    identity: opaque
    exclusive_operations:
      - "POST /archive/rights-grants"
      - "POST /archive/rights-grants/{id}/revoke"
    shared_operations: ["All GET endpoints"]
  - name: LegalCounsel
    description: "Places and releases legal holds (release segregated from placer)"
    identity: opaque
    exclusive_operations:
      - "POST /archive/legal-holds"
      - "POST /archive/legal-holds/{id}/release"
    shared_operations: ["All GET endpoints"]
  - name: AccessOfficer
    description: "Reviews and fulfills retrieval requests"
    identity: opaque
    exclusive_operations:
      - "POST /archive/retrieval-requests/{id}/start-review"
      - "POST /archive/retrieval-requests/{id}/approve"
      - "POST /archive/retrieval-requests/{id}/return"
      - "POST /archive/retrieval-requests/{id}/reject"
      - "POST /archive/retrieval-requests/{id}/deliver"
    shared_operations: ["POST /archive/retrieval-requests/{id}/cancel (with Requester)", "All GET endpoints"]
  - name: Requester
    description: "Broadcast staff member requesting retrieval and reporting usage"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /archive/retrieval-requests"
      - "POST /archive/usage-events"
      - "POST /archive/usage-events/{id}/resubmit (own events only)"
    shared_operations: ["POST /archive/retrieval-requests/{id}/cancel (own requests only; AccessOfficer any)", "All GET endpoints"]
  - name: FinanceOfficer
    description: "Verifies usage, runs royalty statements"
    identity: opaque
    exclusive_operations:
      - "POST /archive/usage-events/{id}/verify"
      - "POST /archive/usage-events/{id}/dispute"
      - "POST /archive/royalty-statements (+ close/reopen/post)"
    shared_operations: ["GET /archive/assets/{id}/storage-cost (with SystemAdmin, ArchivistLead)", "All GET endpoints"]
  - name: LabTechnician
    description: "Runs proxy rendering, migrations, and the digitization lab"
    identity: opaque
    exclusive_operations:
      - "POST /archive/proxy-renditions/{id}/claim|complete|fail|retry"
      - "POST /archive/migration-jobs/{id}/start|complete|fail|retry"
      - "POST /archive/digitization-tickets/{id}/assign|start|submit-qc|qc-pass|qc-fail"
      - "POST /archive/digitization-tickets/auto-assign"
      - "POST /archive/retrieval-requests/{id}/stage-complete"
    shared_operations: ["POST /archive/proxy-renditions (with IngestCoordinator)", "All GET endpoints"]
