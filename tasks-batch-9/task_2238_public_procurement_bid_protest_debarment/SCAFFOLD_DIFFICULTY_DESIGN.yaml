scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bid_evaluated_price_as_read_versus_corrected_variant_divergence
        grounds:
          - calculations.bid_evaluated_price_cents
          - entities.Bid.fields.evaluated_price_cents
          - entities.Bid.fields.informality_loading_cents
          - state_machines.Solicitation.QUESTION_PERIOD_CLOSED_to_BIDS_OPENED
          - state_machines.Bid.UNREVIEWED_to_RESPONSIVE
        distinguishing_aspect: |
          This instance's dual variant lives on the Bid price domain: variant as_read
          (fired by open-bids) copies total_price_cents verbatim, while variant corrected
          (fired by the responsiveness determination) adds the unacknowledged-informality
          loading, so the SAME Bid row yields 12000000 then 12060000 — a delta of exactly
          60000 cents produced by two unacknowledged non-material addenda.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V1 with eligibility_status ELIGIBLE"
            - "one Solicitation S1 in status ISSUED with original_bid_due_utc 2026-08-27T00:00:00Z, original_question_deadline_utc 2026-08-20T00:00:00Z and one original MATERIAL requirement (introduced_by_addendum_sequence 0, so it needs no acknowledgment)"
            - "two Addendum rows on S1, sequence_number 1 and 2, each with extends_bid_due_by_days 0, acknowledgment_required true and new_requirement_codes empty, so each has adds_material_requirement false"
            - "one Bid B1 from V1 with total_price_cents 12000000 and acknowledged_addendum_sequences [] — neither addendum acknowledged, so unacked_informality_count is 2"
            - "S1 advanced to BIDS_OPENED with the clock at 2026-08-27T00:00:00Z, so B1.evaluated_price_cents already holds the as_read value 12000000 and B1.informality_loading_cents is 0"
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Ridgeline Paving LLC", tax_id: "100000001", contact_email: "v1@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { v1_id: $.data.id }
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-DV1"
                title: "Roadway Resurfacing District 4"
                issuing_agency_code: "DOT"
                estimated_value_cents: 100000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-BOND", description: "five percent bid bond", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { s1_id: $.data.id }
            - call: "POST /procurement/solicitations/${s1_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/solicitations/${s1_id}/addenda"
              payload: { summary: "clarifies striping color", extends_bid_due_by_days: 0, acknowledgment_required: true, new_requirement_codes: [] }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/solicitations/${s1_id}/addenda"
              payload: { summary: "clarifies traffic control hours", extends_bid_due_by_days: 0, acknowledgment_required: true, new_requirement_codes: [] }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "GET /procurement/solicitations/${s1_id}"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { s1_v_before_bid: $.data.version }
            - call: "POST /procurement/bids"
              payload: { solicitation_id: "${s1_id}", vendor_id: "${v1_id}", total_price_cents: 12000000, acknowledged_addendum_sequences: [], expected_solicitation_version: "${s1_v_before_bid}" }
              as: Vendor
              as_user_id: "${v1_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations/${s1_id}/close-question-period"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations/${s1_id}/open-bids"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
          trigger:
            - call: "POST /procurement/bids/${b1_id}/responsiveness"
              payload: { determination: "RESPONSIVE", reason_codes: [] }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
          assert:
            - "Bid.${b1_id}.evaluated_price_cents == 12000000 immediately after open-bids (variant as_read)"
            - "Bid.${b1_id}.informality_loading_cents == 0 immediately after open-bids"
            - "the trigger response returns Bid.${b1_id}.informality_loading_cents == 60000"
            - "the trigger response returns Bid.${b1_id}.evaluated_price_cents == 12060000 (variant corrected)"
            - "the variant delta is exactly 12060000 - 12000000 == 60000, i.e. ROUND_HALF_UP(12000000 * 0.0025 * 2)"
            - "Bid.${b1_id}.total_price_cents == 12000000 (unchanged by either variant)"
            - "Bid.${b1_id}.responsiveness_status == RESPONSIVE and Bid.${b1_id}.responsibility_status == NOT_REVIEWED"
            - "Solicitation.${s1_id}.status == EVALUATION and Solicitation.${s1_id}.apparent_low_bid_id == ${b1_id}"

      - name: debarment_severity_interim_versus_final_variant_divergence
        grounds:
          - calculations.debarment_severity_score
          - entities.DebarmentProceeding.fields.severity_score
          - entities.DebarmentProceeding.fields.mitigating_credit_points
          - entities.DebarmentProceeding.fields.debarment_period_months
          - state_machines.DebarmentProceeding.HEARING_HELD_to_DEBARRED
        distinguishing_aspect: |
          This instance's dual variant lives on the DebarmentProceeding sanction-risk
          domain, not on any price: variant interim_suspension_basis ignores mitigation
          entirely and scores 55.00, while variant final_debarment_basis subtracts the
          capped mitigation credit of 23.00 and scores 32.00 on the SAME factor codes,
          moving the tier read-off from the 40-tier to the 20-tier (12 months).
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V2 with eligibility_status ELIGIBLE and debarment_strike_count 0"
            - "one DebarmentProceeding D1 on V2 created with interim_suspension true, aggravating_factor_codes [FRAUD, SAFETY_VIOLATION] (40 + 15 = 55) and mitigating_factor_codes empty, so the interim variant scores 55.00, clears INTERIM_THRESHOLD 35, sets interim_status INTERIM_SUSPENDED and strikes_applied 1, and drives V2 to SUSPENDED"
            - "D1.response_deadline_utc is 2026-08-15T00:00:00Z (notice 2026-08-01 plus RESPONSE_WINDOW_DAYS 14)"
            - "V2 files its written response on 2026-08-02T00:00:00Z merging mitigating_factor_codes [SELF_DISCLOSURE, COOPERATION] (15 + 8 = 23), moving D1 to RESPONSE_RECEIVED"
            - "the DebarmentAuthority holds the contested hearing, moving D1 to HEARING_HELD"
            - "the clock is at 2026-08-20T00:00:00Z when the merits decision is issued"
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Cortland Structural Inc", tax_id: "100000002", contact_email: "v2@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { v2_id: $.data.id }
            - call: "POST /procurement/debarment-proceedings"
              payload: { vendor_id: "${v2_id}", cause_code: "FRAUD", aggravating_factor_codes: ["FRAUD", "SAFETY_VIOLATION"], mitigating_factor_codes: [], interim_suspension: true }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
              captures: { d1_id: $.data.id, d1_interim_severity: $.data.severity_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/debarment-proceedings/${d1_id}/response"
              payload: { response_narrative: "self-reported the invoice error and cooperated with the audit", mitigating_factor_codes: ["SELF_DISCLOSURE", "COOPERATION"] }
              as: Vendor
              as_user_id: "${v2_id}"
            - call: "POST /procurement/debarment-proceedings/${d1_id}/hearing"
              payload: { hearing_summary: "respondent appeared and was heard on the merits" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "POST /procurement/debarment-proceedings/${d1_id}/decision"
              payload: { outcome: "DEBARRED", rationale: "cause established by a preponderance; mitigation credited to the statutory cap" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
          assert:
            - "at creation DebarmentProceeding.${d1_id}.severity_score == 55.00 and mitigating_credit_points == 0 (variant interim_suspension_basis)"
            - "at creation DebarmentProceeding.${d1_id}.aggravating_total_points == 55.00"
            - "the trigger response returns DebarmentProceeding.${d1_id}.mitigating_credit_points == 23.00 (raw 23.00 is below the cap 0.5 * 55.00 == 27.50, so it is credited in full)"
            - "the trigger response returns DebarmentProceeding.${d1_id}.severity_score == 32.00 (variant final_debarment_basis: 55.00 - 23.00 + 10 * 0 prior strikes)"
            - "the variant delta is exactly 55.00 - 32.00 == 23.00"
            - "DebarmentProceeding.${d1_id}.debarment_period_months == 12 (the 20-tier), not 24, 36 or 60"
            - "DebarmentProceeding.${d1_id}.debarment_start_utc == 2026-08-20T00:00:00Z and debarment_end_utc == 2027-08-20T00:00:00Z"
            - "Vendor.${v2_id}.eligibility_status == DEBARRED and Vendor.${v2_id}.debarment_strike_count == 1 (unchanged: the interim strike converts rather than adding)"
            - "Vendor.${v2_id}.reinstatement_earliest_petition_utc == 2027-02-20T00:00:00Z (CEIL(12 * 0.5) == 6 calendar months after debarment_start_utc)"

  - rule_id: combinatorial_formula
    instances:
      - name: protest_filing_fee_per_component_rounding_order_pinned
        grounds:
          - calculations.protest_filing_fee_cents
          - entities.Protest.fields.filing_fee_cents
          - entities.Vendor.fields.protest_fee_balance_cents
          - entities.Solicitation.fields.protest_escrow_cents
          - validations[priority=48]
        distinguishing_aspect: |
          Mode (b) — pinned ROUNDING ORDER. Both the ad valorem component (100000.50)
          and the grounds surcharge (8337.50) carry a fractional part of exactly 0.5, so
          rounding each component with ROUND_HALF_UP and then summing yields 133339,
          whereas summing first and rounding once yields 133338; the scaffold pins the
          former, and the one-cent difference is the whole claim.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V3 with protest_fee_balance_cents 200000 after a single fee deposit"
            - "one Solicitation S2 with estimated_value_cents 400002000, which selects the third rate rung 0.00025 because the value exceeds 100000000"
            - "S2 driven to BIDS_OPENED and then to EVALUATION; V3's own Bid B2 has been determined NONRESPONSIVE at clock 2026-08-27T00:00:00Z, so V3 has standing_basis ACTUAL_BIDDER and a RESPONSIVENESS_DETERMINATION trigger event"
            - "the protest is filed at 2026-08-27T00:00:00Z, well inside the 7-day window that ends 2026-09-03T00:00:00Z"
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Harbison Bridge Co", tax_id: "100000003", contact_email: "v3@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { v3_id: $.data.id }
            - call: "POST /procurement/vendors/${v3_id}/fee-deposits"
              payload: { amount_cents: 200000 }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-CF1"
                title: "Bridge Deck Rehabilitation"
                issuing_agency_code: "DOT"
                estimated_value_cents: 400002000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-BOND", description: "five percent bid bond", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { s2_id: $.data.id }
            - call: "POST /procurement/solicitations/${s2_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "GET /procurement/solicitations/${s2_id}"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { s2_v_before_bid: $.data.version }
            - call: "POST /procurement/bids"
              payload: { solicitation_id: "${s2_id}", vendor_id: "${v3_id}", total_price_cents: 390000000, acknowledged_addendum_sequences: [], expected_solicitation_version: "${s2_v_before_bid}" }
              as: Vendor
              as_user_id: "${v3_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations/${s2_id}/close-question-period"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations/${s2_id}/open-bids"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/bids/${b2_id}/responsiveness"
              payload: { determination: "NONRESPONSIVE", reason_codes: ["OFFICER_DETERMINATION"] }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
          trigger:
            - call: "POST /procurement/protests"
              payload: { solicitation_id: "${s2_id}", protester_vendor_id: "${v3_id}", grounds_code: "RESPONSIVENESS_DETERMINATION", narrative: "the deviation cited was a waivable informality", challenged_bid_id: "${b2_id}" }
              as: Vendor
              as_user_id: "${v3_id}"
              captures: { p1_id: $.data.id }
          assert:
            - "Protest.${p1_id}.filing_fee_cents == 133339"
            - "Protest.${p1_id}.filing_fee_cents != 133338 (the sum-then-round-once ordering is NOT used)"
            - "Vendor.${v3_id}.protest_fee_balance_cents == 66661 (200000 - 133339)"
            - "Solicitation.${s2_id}.protest_escrow_cents == 133339"
            - "Protest.${p1_id}.standing_basis == ACTUAL_BIDDER"
            - "Protest.${p1_id}.timeliness_deadline_utc == 2026-09-03T00:00:00Z"
            - "Protest.${p1_id}.status == FILED and Protest.${p1_id}.stay_status == ACTIVE"

      - name: award_total_obligation_tier_selected_on_base_only
        grounds:
          - calculations.award_total_obligation_cents
          - entities.Award.fields.administrative_fee_rate
          - entities.Award.fields.administrative_fee_cents
          - entities.Award.fields.protest_risk_reserve_cents
          - entities.Award.fields.award_total_obligation_cents
        distinguishing_aspect: |
          Mode (c) — pinned EVALUATION ORDER between two mutually dependent quantities.
          base_obligation_cents is exactly 100000000, the inclusive top of the first
          administrative-fee tier, and the resulting total 102007500 sits in the SECOND
          tier; the scaffold pins tier selection to the base alone, so the rate stays
          0.0150 and the total is 102007500 rather than the 101605500 that re-selecting
          the rate on the final total would produce. The reserve is additionally taken on
          base plus the ALREADY-ROUNDED fee.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V4 with protest_fee_balance_cents 100000"
            - "one Solicitation S3 with estimated_value_cents 100000000 and NO addenda, so the corrected variant adds no informality loading"
            - "V4's Bid B3 has total_price_cents 100000000, so its evaluated_price_cents is exactly 100000000 under both variants"
            - "S3 driven to BIDS_OPENED at clock 2026-08-27T00:00:00Z; V4 files an EVALUATION_ERROR protest and immediately withdraws it, so exactly one Protest on S3 has status WITHDRAWN and stay_status LIFTED — has_resolved_protest is true and no ACTIVE stay blocks the award"
            - "B3 determined RESPONSIVE by U-OFFICER-1 and reviewed RESPONSIBLE by U-REVIEWER-1 with scores 80 / 85 / 90 (composite 85.00), so S3 is in AWARD_PENDING and apparent_low_bid_id is B3"
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Marchetti Earthworks", tax_id: "100000004", contact_email: "v4@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { v4_id: $.data.id }
            - call: "POST /procurement/vendors/${v4_id}/fee-deposits"
              payload: { amount_cents: 100000 }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-CF2"
                title: "Culvert Replacement Program"
                issuing_agency_code: "DOT"
                estimated_value_cents: 100000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-BOND", description: "five percent bid bond", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { s3_id: $.data.id }
            - call: "POST /procurement/solicitations/${s3_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "GET /procurement/solicitations/${s3_id}"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { s3_v_before_bid: $.data.version }
            - call: "POST /procurement/bids"
              payload: { solicitation_id: "${s3_id}", vendor_id: "${v4_id}", total_price_cents: 100000000, acknowledged_addendum_sequences: [], expected_solicitation_version: "${s3_v_before_bid}" }
              as: Vendor
              as_user_id: "${v4_id}"
              captures: { b3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations/${s3_id}/close-question-period"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations/${s3_id}/open-bids"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/protests"
              payload: { solicitation_id: "${s3_id}", protester_vendor_id: "${v4_id}", grounds_code: "EVALUATION_ERROR", narrative: "the bid abstract omitted an alternate line item" }
              as: Vendor
              as_user_id: "${v4_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /procurement/protests/${p2_id}/withdraw"
              payload: { withdrawal_reason: "resolved informally with the agency" }
              as: Vendor
              as_user_id: "${v4_id}"
            - call: "POST /procurement/bids/${b3_id}/responsiveness"
              payload: { determination: "RESPONSIVE", reason_codes: [] }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/bids/${b3_id}/responsibility-reviews"
              payload: { financial_capacity_score: 80, past_performance_score: 85, integrity_score: 90, determination: "RESPONSIBLE", notes: "audited statements and three comparable projects" }
              as: ResponsibilityReviewer
              as_user_id: "U-REVIEWER-1"
          trigger:
            - call: "POST /procurement/awards"
              payload: { solicitation_id: "${s3_id}", winning_bid_id: "${b3_id}" }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { a1_id: $.data.id }
          assert:
            - "Award.${a1_id}.base_obligation_cents == 100000000"
            - "Award.${a1_id}.administrative_fee_rate == 0.0150 (selected on base_obligation_cents alone, at the inclusive tier top)"
            - "Award.${a1_id}.administrative_fee_cents == 1500000"
            - "Award.${a1_id}.protest_risk_reserve_cents == 507500 (ROUND_HALF_UP((100000000 + 1500000) * 0.0050))"
            - "Award.${a1_id}.award_total_obligation_cents == 102007500"
            - "Award.${a1_id}.award_total_obligation_cents != 101605500 (the rate is NOT re-selected on the final total even though 102007500 falls in the 0.0110 tier)"
            - "Award.${a1_id}.status == PENDING_STAY and Award.${a1_id}.vendor_id == ${v4_id}"

  - rule_id: non_linear_state_machine
    instances:
      - name: hearing_convene_continue_reconvene_then_third_continuance_refused
        grounds:
          - state_machines.ProtestHearing.SCHEDULED_to_CONVENED
          - state_machines.ProtestHearing.CONVENED_to_SCHEDULED
          - state_machines.ProtestHearing.CONVENED_to_CONCLUDED
          - entities.ProtestHearing.fields.continuance_count
          - errors[ERR_CONTINUANCE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Non-linearity here is a genuine CYCLE on ProtestHearing: the row re-enters
          SCHEDULED twice from CONVENED, so it occupies SCHEDULED three separate times
          with continuance_count 0, 1 then 2, and the cycle is bounded — the third
          continuance attempt is refused with ERR_CONTINUANCE_LIMIT_EXCEEDED while the
          row stays CONVENED and continuance_count stays 2.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V5 with protest_fee_balance_cents 100000"
            - "one Solicitation S4 in status ISSUED, estimated_value_cents 10000000, issued by U-OFFICER-1, original_bid_due_utc 2026-08-27T00:00:00Z"
            - "V5 has one PENDING QuestionSubmission on S4, giving it standing_basis PROSPECTIVE_BIDDER for a SOLICITATION_IMPROPRIETY protest"
