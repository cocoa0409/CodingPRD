  # =====================================================================
  # Excluded stubs — corners already covered by SCAFFOLD_DIFFICULTY_DESIGN
  # =====================================================================
  - section: errors_covered_by_difficulty
    instances:
      - name: error_offer_expired_on_accept
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_EXPIRED]"]
        excluded_because:
          difficulty_instance: temporal_beats_referential_on_accept
          rationale: "Asserted as the failure path of the named Rule-5 instance (expired offer returns ERR_OFFER_EXPIRED and flips the agreement EXPIRED)."
      - name: error_junior_liens_on_certify_title
        claim_type: violation_to_error
        grounds: ["errors[ERR_JUNIOR_LIENS_OUTSTANDING]"]
        excluded_because:
          difficulty_instance: unreleased_lien_count_zero_gate
          rationale: "Asserted as the failure path of the named Rule-6 instance (count 1 blocks, 0 passes)."
      - name: error_marketing_period_not_met
        claim_type: violation_to_error
        grounds: ["errors[ERR_MARKETING_PERIOD_NOT_MET]"]
        excluded_because:
          difficulty_instance: marketing_days_89_vs_90
