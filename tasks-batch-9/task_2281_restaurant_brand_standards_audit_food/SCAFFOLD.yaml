  - method: GET
    path: "/franchisees/{id}"
    description: "Read a franchisee including default counters"
    roles: [BrandAdmin, Franchisee]
    code: 200
    input: []
    output: Franchisee
    side_effects: []
  - method: GET
    path: "/franchisees"
    description: "List franchisees, optionally filtered by brand"
