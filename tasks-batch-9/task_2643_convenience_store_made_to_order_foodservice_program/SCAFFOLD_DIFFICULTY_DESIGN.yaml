            - "${c_status} == PLANNED"
            - "${c_occ_end} == 2026-08-01T15:20:00Z"
            - "ProductionBatch.${batch_a}.status == PLANNED"
            - "ProductionBatch.${batch_a}.slot_index == 1"
            - "ProductionBatch.${batch_c}.slot_index == 1"
            - "GET /production-batches?holding_unit_id=${unit_id} -> total_count == 2"
            - "Store.${store_id}.hot_case_slots_used == 0"

      - name: half_open_pickup_capacity_counts_concurrent_windows_not_exclusive_slots
        grounds:
          - calculations.pickup_window_capacity
          - entities.Store.fields.pickup_slot_capacity
          - entities.Order.fields.pickup_window_start
          - entities.Order.fields.pickup_window_end
          - errors[ERR_PICKUP_WINDOW_FULL]
          - validations[priority=36]
          - state_machines.Order.DRAFT_to_PLACED
        distinguishing_aspect: |
          HALF-OPEN AGGREGATE geometry, deliberately the opposite of the slot rule: capacity 2 means two
          windows may be concurrent. 13:00-13:30 and 13:15-13:45 both place; 13:29-13:59 overlaps both and
          is refused with ERR_PICKUP_WINDOW_FULL; 13:30-14:00 places even though it touches the first
          window, because touching does not overlap when the comparison is strict. The refused order stays
          DRAFT and therefore does not consume capacity itself, so the fourth order sees a count of exactly
          one. An exclusive-occupancy or inclusive-bound implementation refuses the fourth order too.
        test_recipe:
