      - name: publishing_a_second_bundle_supersedes_only_the_prior_published_one
        claim_type: conditional_cascade
        grounds:
          - state_machines.ContentBundle.PUBLISHED_to_SUPERSEDED
          - entities.ContentBundle.fields.bundle_version
          - entities.Device.fields.cache_state
        distinguishing_aspect: "The supersede cascade is conditional on state: publishing bundle 2 moves the previously PUBLISHED bundle 1 to SUPERSEDED and turns the device caching it STALE, while a sibling DRAFT bundle of the same cluster is left untouched in DRAFT."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001, Item A; kiosk K001 attested, ONLINE and caching PUBLISHED bundle 1 (cache_state FRESH)."
            - "Bundle 3 also exists for CL_WEST but is still DRAFT with no slots."
            - "Bundle 2 for CL_WEST carries the same LUNCH slot and has passed the audit and VALIDATE."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
