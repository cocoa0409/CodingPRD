# =============================================================================
# §1.9 Scaffold Corner Design — Task 1852 Karting League & Race Series
# Breadth coverage of every §1.1-§1.7 claim not already probed by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: season_creation_defaults
        claim_type: creation
        grounds: [entities.LeagueSeason]
        distinguishing_aspect: "POST /karting/seasons returns 201 with status SCHEDULED, rounds_completed 0, collected_fees_cents 0, version 1; omitted drop_rounds and fastest_lap_bonus_points default to 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Defaults Cup", year: 2026, points_scheme: [25, 22, 20] }, as: LeagueAdmin, captures: { s_id: $.data.id } }
          trigger:
            - { call: "GET /karting/seasons/${s_id}", payload: {}, as: LeagueAdmin }
          assert:
            - "LeagueSeason.${s_id}.status == SCHEDULED, drop_rounds == 0, fastest_lap_bonus_points == 0"
            - "rounds_completed == 0 and collected_fees_cents == 0 (computed fields initialized)"
            - "version == 1; id is a server-minted UUID; created_at/updated_at present"

      - name: driver_system_fields_and_initial_state
        claim_type: system_fields
        grounds: [entities.Driver, state_machines.Driver]
        distinguishing_aspect: "Newly registered driver starts PENDING with system-stamped id/created_at/version 1; status is not an accepted input at creation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /karting/drivers", payload: { full_name: "Rookie", date_of_birth: "2000-05-05", body_weight_kg: 75.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_id: $.data.id } }
          trigger:
            - { call: "GET /karting/drivers/${d_id}", payload: {}, as: LeagueAdmin }
          assert:
            - "Driver.${d_id}.status == PENDING (initial state)"
            - "version == 1; created_at present in ISO 8601 UTC"

      - name: driver_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Driver, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent driver UUID yields ERR_NOT_FOUND (404) in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /karting/drivers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: entry_fee_snapshot_and_computed_fields
        claim_type: computed_fields
        grounds: [entities.EventEntry.fields.entry_fee_cents, entities.EventEntry.fields.event_points, entities.EventEntry.fields.tech_fail_count]
        distinguishing_aspect: "Entry creation snapshots entry_fee_cents from the class (5000) and initializes computed fields event_points 0, tech_fail_count 0, fee_status UNPAID."
        test_recipe:
          setup: ["Season ACTIVE with SENIOR class fee 5000; event REGISTRATION_OPEN; driver ACTIVE"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Fee Cup", year: 2026, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
          trigger:
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
          assert:
            - "EventEntry.${en_a}.entry_fee_cents == 5000 (snapshot of class fee), fee_status == UNPAID, status == ENTERED"
            - "event_points == 0 and tech_fail_count == 0"

      - name: entry_invalid_entry_type_enum_rejected
        claim_type: type_constraints
        grounds: [entities.EventEntry.fields.entry_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "entry_type outside {RENTAL, OWNER_DRIVER} is rejected with ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["Season ACTIVE, SENIOR class, event REGISTRATION_OPEN, driver ACTIVE"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Enum Cup", year: 2026, points_scheme: [25, 22, 20] }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
          trigger:
            - call: "POST /karting/events/${e_id}/entries"
              payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "BORROWED" }
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: tech_inspection_immutable_log
        claim_type: immutability
        grounds: [entities.TechInspection]
        distinguishing_aspect: "TechInspection has common_fields: false — only id and created_at; no update endpoint exists and the list is append-only ordered by creation."
        test_recipe:
          setup: ["Season ACTIVE, SENIOR class, event REGISTRATION_OPEN, one ENTERED entry"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Log Cup", year: 2026, points_scheme: [25, 22, 20] }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 169.9 }, as: RaceDirector, captures: { insp_1: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 170.5 }, as: RaceDirector, captures: { insp_2: $.data.id } }
          trigger:
            - { call: "GET /karting/entries/${en_a}/inspections", payload: {}, as: LeagueAdmin }
          assert:
            - "list contains exactly 2 inspections in creation order: ${insp_1} (FAIL) then ${insp_2} (PASS)"
            - "each inspection carries id and created_at but no version/updated_at (common_fields: false)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: withdraw_from_grid_locked_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EventEntry, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "GRID_LOCKED entries cannot withdraw — withdraw from GRID_LOCKED returns ERR_INVALID_STATE and fee_status stays PAID."
        test_recipe:
          setup: ["Event IN_PROGRESS; entry GRID_LOCKED and PAID"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Lock Cup", year: 2026, points_scheme: [25, 22, 20] }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 171.0 }, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/start", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/lock-grid", payload: {}, as: RaceDirector }
          trigger:
            - call: "POST /karting/entries/${en_a}/withdraw"
              payload: {}
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; EventEntry.${en_a}.status stays GRID_LOCKED and fee_status stays PAID"

      - name: event_finalize_before_complete_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RaceEvent, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "finalize is only valid from COMPLETED; from IN_PROGRESS it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Event IN_PROGRESS with one GRID_LOCKED entry"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Order Cup", year: 2026, points_scheme: [25, 22, 20] }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 171.0 }, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/start", payload: {}, as: RaceDirector }
          trigger:
            - call: "POST /karting/events/${e_id}/finalize"
              payload: {}
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; RaceEvent.${e_id}.status stays IN_PROGRESS"

      - name: appeal_from_reported_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Incident, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "appeal is valid only from UPHELD; appealing a REPORTED incident returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Event IN_PROGRESS with GRID_LOCKED entry, scored session, incident REPORTED"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Appeal Gate", year: 2026, points_scheme: [25, 22, 20] }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 171.0 }, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/start", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/lock-grid", payload: {}, as: RaceDirector, captures: { e_v4: $.data.version } }
            - { call: "POST /karting/events/${e_id}/sessions", payload: { session_type: "MAIN", sequence: 1, expected_event_version: "${e_v4}" }, as: RaceDirector, captures: { sess: $.data.id, se_v1: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "OPEN" }, as: RaceDirector, captures: { se_v2: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "CLOSED" }, as: RaceDirector, captures: { se_v3: $.data.version } }
            - { call: "POST /karting/sessions/${sess}/results", payload: { results: [ { entry_id: "${en_a}", finish_position: 1, best_lap_ms: 45000, total_time_ms: 600000 } ], expected_session_version: "${se_v3}" }, as: RaceDirector }
            - { call: "POST /karting/sessions/${sess}/score", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/incidents", payload: { entry_id: "${en_a}", session_id: "${sess}", description: "Late lunge" }, as: RaceDirector, as_user_id: "rd-1", captures: { inc: $.data.id } }
          trigger:
            - call: "POST /karting/incidents/${inc}/appeal"
              payload: {}
              as: Driver
              as_user_id: "${d_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; Incident.${inc}.status stays REPORTED, appeal_count == 0"

      - name: checkout_from_reserved_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PracticeBooking, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "check-out requires CHECKED_IN; from RESERVED it returns ERR_INVALID_STATE and fee_cents stays null."
        test_recipe:
          setup: ["Driver ACTIVE, kart AVAILABLE, booking RESERVED"]
          setup_api_calls:
            - { call: "POST /karting/drivers", payload: { full_name: "D", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_d: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_d}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/karts", payload: { fleet_number: "K-20", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_1: $.data.id } }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_d}", kart_id: "${k_1}", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_d}", captures: { bk: $.data.id } }
          trigger:
            - call: "POST /karting/practice-bookings/${bk}/check-out"
              payload: {}
              as: Driver
              as_user_id: "${d_d}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; PracticeBooking.${bk}.status stays RESERVED, fee_cents and minutes_used still null"

      - name: season_awards_concluded_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.LeagueSeason]
        distinguishing_aspect: "AWARDS_CONCLUDED is terminal: activate/finalize/conclude-awards all return ERR_INVALID_STATE afterwards."
        test_recipe:
          setup: ["Season driven SCHEDULED->ACTIVE->FINALIZED->AWARDS_CONCLUDED (one FINALIZED event required)"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Banquet Cup", year: 2026, points_scheme: [25, 22, 20] }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 171.0 }, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/start", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/lock-grid", payload: {}, as: RaceDirector, captures: { e_v4: $.data.version } }
            - { call: "POST /karting/events/${e_id}/sessions", payload: { session_type: "MAIN", sequence: 1, expected_event_version: "${e_v4}" }, as: RaceDirector, captures: { sess: $.data.id, se_v1: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "OPEN" }, as: RaceDirector, captures: { se_v2: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "CLOSED" }, as: RaceDirector, captures: { se_v3: $.data.version } }
            - { call: "POST /karting/sessions/${sess}/results", payload: { results: [ { entry_id: "${en_a}", finish_position: 1, best_lap_ms: 45000, total_time_ms: 600000 } ], expected_session_version: "${se_v3}" }, as: RaceDirector }
            - { call: "POST /karting/sessions/${sess}/score", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/complete", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/finalize", payload: {}, as: RaceDirector }
            - { call: "POST /karting/seasons/${s_id}/finalize", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/conclude-awards", payload: {}, as: LeagueAdmin }
          trigger:
            - call: "POST /karting/seasons/${s_id}/activate"
              payload: {}
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; LeagueSeason.${s_id}.status stays AWARDS_CONCLUDED"

      - name: driver_suspend_reinstate_cycle
        claim_type: valid_transition
        grounds: [state_machines.Driver]
        distinguishing_aspect: "Driver machine is cyclic: ACTIVE->SUSPENDED->ACTIVE via PATCH; version increments each hop."
        test_recipe:
          setup: ["Driver ACTIVE"]
          setup_api_calls:
            - { call: "POST /karting/drivers", payload: { full_name: "Cyc", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin, captures: { d_v2: $.data.version } }
          trigger:
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "SUSPENDED" }, as: LeagueAdmin, captures: { d_v3: $.data.version } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin, captures: { d_v4: $.data.version } }
          assert:
            - "status after suspend == SUSPENDED (version ${d_v3}); status after reinstate == ACTIVE (version ${d_v4} == ${d_v2} + 2)"

      - name: second_tech_fail_disqualifies_entry
        claim_type: side_effect_execution
        grounds: [state_machines.EventEntry.TECH_CHECK_to_TECH_FAILED, entities.EventEntry.fields.tech_fail_count]
        distinguishing_aspect: "Threshold trigger: the 2nd FAIL inspection (tech_fail_count reaches TECH_FAIL_DISQUALIFY_THRESHOLD 2) auto-transitions the entry to DISQUALIFIED."
        test_recipe:
          setup: ["Season ACTIVE, SENIOR class min 170.0; event REGISTRATION_OPEN; entry ENTERED"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Tech Cup", year: 2026, points_scheme: [25, 22, 20] }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 169.0 }, as: RaceDirector }
          trigger:
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 168.5 }, as: RaceDirector, captures: { insp_2: $.data.id } }
          assert:
            - "TechInspection.${insp_2}.outcome == FAIL; EventEntry.${en_a}.tech_fail_count == 2"
            - "EventEntry.${en_a}.status == DISQUALIFIED (auto-transition at threshold 2)"

      - name: post_race_fail_from_grid_locked_disqualifies
        claim_type: side_effect_execution
        grounds: [state_machines.EventEntry, entities.EventEntry.fields.status]
        distinguishing_aspect: "Conditional cascade: a FAIL inspection from GRID_LOCKED (post-race re-weigh) disqualifies immediately on the first failure, unlike the threshold path from TECH_CHECK."
        test_recipe:
          setup: ["Event IN_PROGRESS; entry GRID_LOCKED (one prior PASS, tech_fail_count 0)"]
