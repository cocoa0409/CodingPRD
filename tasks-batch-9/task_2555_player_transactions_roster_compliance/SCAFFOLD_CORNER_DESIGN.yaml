      - name: file_filing_outside_processing_window_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Transaction.DRAFT_to_FILED
          - validations[priority=22]
          - errors[ERR_OUTSIDE_PROCESSING_WINDOW]
          - calculations.processing_window_snap
        distinguishing_aspect: "At 2026-08-10T21:00:00Z — the exclusive close of the half-open window [13:00:00Z, 21:00:00Z) — filing is rejected with ERR_OUTSIDE_PROCESSING_WINDOW and the filing stays DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z while the DRAFT SIGNING filing is created for Harbor Kings and Ray Alder."
            - "Logical clock then advanced to exactly 2026-08-10T21:00:00Z, the excluded upper bound of the daily window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
