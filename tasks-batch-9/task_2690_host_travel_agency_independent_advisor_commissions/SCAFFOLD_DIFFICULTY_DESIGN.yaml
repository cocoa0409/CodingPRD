  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_submission_gated_on_credential_status_expired_by_clock
        grounds:
          - validations[priority=50]
          - state_machines.ComplianceCredential.status.VERIFIED_to_EXPIRED
          - endpoints["POST /host-agency/_clock/set_current_utc"]
          - errors[ERR_SELLER_OF_TRAVEL_INVALID]
        distinguishing_aspect: |
          Entity pair (Booking, ComplianceCredential). The advisor's own status never changes —
          it stays ACTIVE throughout — yet an operation on Booking flips from legal to illegal
          and back purely because a *different* entity's state field moved
          VERIFIED -> EXPIRED when the logical clock advanced past expires_on. Filing and
          verifying a fresh credential restores the capability, proving the gate reads the
          related entity's live state rather than a flag copied onto the advisor.
        test_recipe:
          setup:
            - "Meridian Air: STANDARD, no consortium, base 0.10, ceiling 0.20, cap 9000000."
            - "One advisor in NY, no consortium, ACTIVE, with a SELLER_OF_TRAVEL credential that expires 2026-08-31 while its E&O, training and accreditation credentials run to 2027-01-01."
            - "Logical clock at the 2026-08-01T00:00:00Z default, so the seller-of-travel credential is still in force."
            - "One client owned by that advisor."
