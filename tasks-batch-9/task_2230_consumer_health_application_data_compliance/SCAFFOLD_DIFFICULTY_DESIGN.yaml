scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: breach_deadline_mixed_scope_general_rule_governs_over_health_rule
        grounds:
          - calculations.breach_notification_deadline
          - state_machines.BreachIncident.DISCOVERED_to_REPORTABLE
          - entities.BreachIncident.fields.governing_deadline_at
          - entities.AppProduct.fields.exposure_cents
        distinguishing_aspect: |
          This dual-variant calculation lives on the BreachIncident entity domain: the same
          discovered_at instant yields a 60-day health-specific deadline and a 30-day general
          deadline, and for breach_scope MIXED the general variant governs, so
          governing_deadline_at is 2026-09-04T00:00:00Z rather than 2026-10-04T00:00:00Z.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one AppProduct with no elements, policies or consents"
            - "one BreachIncident in DISCOVERED with breach_scope MIXED, protection_state UNPROTECTED, affected_consumer_count 120 and affected_state_max_count 120"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/breach-incidents"
              payload: { app_product_id: "${prod_id}", incident_label: "Object store exposure", discovered_at: "2026-08-05T00:00:00Z", breach_scope: "MIXED", protection_state: "UNPROTECTED", affected_consumer_count: 120, affected_state_max_count: 120 }
              as: SecurityEngineer
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /health-data/breach-incidents/${inc_id}/assess"
              payload: {}
              as: SecurityEngineer
          assert:
            - "BreachIncident.${inc_id}.state == REPORTABLE"
            - "BreachIncident.${inc_id}.health_rule_deadline_at == 2026-10-04T00:00:00Z"
            - "BreachIncident.${inc_id}.general_rule_deadline_at == 2026-09-04T00:00:00Z"
            - "BreachIncident.${inc_id}.governing_deadline_at == 2026-09-04T00:00:00Z"
            - "BreachIncident.${inc_id}.media_notice_required == false"
            - "BreachIncident.${inc_id}.exposure_contribution_cents == 144000"
            - "AppProduct.${prod_id}.exposure_cents == 144000"

      - name: policy_completeness_element_versus_category_specificity_divergence
        grounds:
          - calculations.policy_completeness_score
          - state_machines.PrivacyPolicyVersion.DRAFT_to_IN_REVIEW
          - entities.PrivacyPolicyVersion.fields.specificity_mode
          - entities.PrivacyPolicyVersion.fields.completeness_score
        distinguishing_aspect: |
          This dual-variant calculation lives on the PrivacyPolicyVersion entity domain, a
          different subject from the BreachIncident deadline pair: two policy versions carrying
          identical disclosed_* inputs score 92.0 under element_level_specificity (denominator
          regulated_element_count 5) and 86.7 under category_level_specificity (denominator
          REQUIRED_CATEGORY_COUNT 6), a delta of 5.3 points that straddles the publish threshold.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one AppProduct with five ACTIVE DataElements all classified CHD or CHD_BY_INFERENCE, so regulated_element_count is 5"
            - "four ProcessingPurpose rows on that product"
            - "one APPROVED ApplicabilityAssessment with determination CHD_REGULATED"
            - "two DRAFT PrivacyPolicyVersions with disclosed_category_count 4, disclosed_purpose_count 4, disclosed_third_party_count 2, named_third_party_count 2, differing only in specificity_mode"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "cpap_use", display_name: "CPAP usage hours", source_kind: "DEVICE_SENSOR", health_signal_kind: "TREATMENT" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "spo2", display_name: "Blood oxygen saturation", source_kind: "DEVICE_SENSOR", health_signal_kind: "MEASUREMENT" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "hr_var", display_name: "Heart rate variability", source_kind: "DEVICE_SENSOR", health_signal_kind: "MEASUREMENT" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "clinic_geo", display_name: "Clinic visit location", source_kind: "DEVICE_SENSOR", health_signal_kind: "PRECISE_LOCATION" }
              as: DataSteward
            - call: "POST /health-data/processing-purposes"
              payload: { app_product_id: "${prod_id}", purpose_key: "core_service", description_text: "Deliver the sleep coaching service", purpose_kind: "PRIMARY_SERVICE", activity_kind: "COLLECT" }
              as: DataSteward
            - call: "POST /health-data/processing-purposes"
              payload: { app_product_id: "${prod_id}", purpose_key: "product_analytics", description_text: "Improve the product", purpose_kind: "ANALYTICS", activity_kind: "COLLECT" }
              as: DataSteward
            - call: "POST /health-data/processing-purposes"
              payload: { app_product_id: "${prod_id}", purpose_key: "ad_partner_share", description_text: "Share with advertising partners", purpose_kind: "ADVERTISING", activity_kind: "SHARE" }
              as: DataSteward
            - call: "POST /health-data/processing-purposes"
              payload: { app_product_id: "${prod_id}", purpose_key: "data_sale", description_text: "Sell de-identified panels", purpose_kind: "SALE", activity_kind: "SELL" }
              as: DataSteward
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "NOT_COVERED", analyst_note: "Consumer wellness app outside HIPAA" }
              as: PrivacyOfficer
              captures: { asmt_id: $.data.id }
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /health-data/applicability-assessments/${asmt_id}/approve"
              payload: {}
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "GET /health-data/app-products/${prod_id}"
              payload: {}
              as: PrivacyOfficer
              captures: { prod_v_a: $.data.version }
            - call: "POST /health-data/privacy-policy-versions"
              payload: { app_product_id: "${prod_id}", applicability_assessment_id: "${asmt_id}", version_label: "v1-element-level", specificity_mode: "ELEMENT_LEVEL", disclosed_category_count: 4, disclosed_purpose_count: 4, disclosed_third_party_count: 2, named_third_party_count: 2, effective_from: "2026-09-01", expected_app_product_version: "${prod_v_a}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol_elem_id: $.data.id }
            - call: "GET /health-data/app-products/${prod_id}"
              payload: {}
              as: PrivacyOfficer
              captures: { prod_v_b: $.data.version }
            - call: "POST /health-data/privacy-policy-versions"
              payload: { app_product_id: "${prod_id}", applicability_assessment_id: "${asmt_id}", version_label: "v1-category-level", specificity_mode: "CATEGORY_LEVEL", disclosed_category_count: 4, disclosed_purpose_count: 4, disclosed_third_party_count: 2, named_third_party_count: 2, effective_from: "2026-09-02", expected_app_product_version: "${prod_v_b}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol_cat_id: $.data.id }
          trigger:
            - call: "POST /health-data/privacy-policy-versions/${pol_elem_id}/submit-review"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /health-data/privacy-policy-versions/${pol_cat_id}/submit-review"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "AppProduct.${prod_id}.regulated_element_count == 5"
            - "PrivacyPolicyVersion.${pol_elem_id}.completeness_score == 92.0"
            - "PrivacyPolicyVersion.${pol_elem_id}.gap_count == 1"
            - "PrivacyPolicyVersion.${pol_cat_id}.completeness_score == 86.7"
            - "PrivacyPolicyVersion.${pol_cat_id}.gap_count == 1"
            - "PrivacyPolicyVersion.${pol_elem_id}.state == IN_REVIEW"
            - "PrivacyPolicyVersion.${pol_cat_id}.state == IN_REVIEW"

  - rule_id: combinatorial_formula
    instances:
      - name: residual_risk_rounding_order_pinned_to_weight_then_sum_then_round
        grounds:
          - calculations.residual_risk_score
          - entities.SecurityRiskAssessment.fields.residual_risk_score
          - entities.SecurityRiskAssessment.fields.risk_tier
        distinguishing_aspect: |
          Mode (b) instance: nested rounding where the order changes the cents. With scores
          60/60/70/75 and documented_gap_count 1 the pinned order (weight, sum unrounded, round
          once) yields 36.48, while rounding each weighted domain term to two decimals before
          summing yields 36.49; the scaffold pins the former.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one AppProduct with no other rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /health-data/security-risk-assessments"
              payload: { app_product_id: "${prod_id}", assessment_label: "FY26 program review", admin_control_score: 60, technical_control_score: 60, physical_control_score: 70, vendor_oversight_score: 75, documented_gap_count: 1, remediation_plan_present: false }
              as: SecurityEngineer
              captures: { sra_id: $.data.id }
          assert:
            - "SecurityRiskAssessment.${sra_id}.residual_risk_score == 36.48"
            - "SecurityRiskAssessment.${sra_id}.residual_risk_score != 36.49"
            - "SecurityRiskAssessment.${sra_id}.risk_tier == MODERATE"
            - "SecurityRiskAssessment.${sra_id}.state == DRAFT"
            - "AppProduct.${prod_id}.security_program_state == NONE"

      - name: applicability_determination_pinned_step_order_dual_track_partial_scope
        grounds:
          - calculations.applicability_determination
          - state_machines.ApplicabilityAssessment.DRAFT_to_SUBMITTED
          - entities.ApplicabilityAssessment.fields.regulated_scope
          - entities.AppProduct.fields.small_business_flag
        distinguishing_aspect: |
          Mode (c) instance: the determination and the regulated scope look mutually dependent,
          and the scaffold pins the evaluation order so STEP 1 reads only product inputs
          (ratio 0.60 with a COVERED_ENTITY claim yields DUAL_TRACK) and STEP 4 then derives
          PARTIAL from 1 regulated element out of 4 active ones, never the reverse.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one AppProduct with consumer_count 150000, annual_revenue_cents 3000000000 and hipaa_covered_transaction_ratio 0.60"
            - "four ACTIVE DataElements of which exactly one is a DIAGNOSIS signal"
            - "one DRAFT ApplicabilityAssessment with entity_status_claim COVERED_ENTITY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "CareBridge", company_legal_name: "CareBridge Health LLC", primary_state_code: "CA", consumer_count: 150000, annual_revenue_cents: 3000000000, hipaa_covered_transaction_ratio: 0.60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "dx_code", display_name: "Diagnosis code", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "display_name_pref", display_name: "Display name", source_kind: "USER_PROVIDED", health_signal_kind: "NON_HEALTH" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "locale", display_name: "Locale preference", source_kind: "USER_PROVIDED", health_signal_kind: "NON_HEALTH" }
              as: DataSteward
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "device_model", display_name: "Device model", source_kind: "DEVICE_SENSOR", health_signal_kind: "NON_HEALTH" }
              as: DataSteward
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "COVERED_ENTITY", analyst_note: "Mixed clinical and consumer flows" }
              as: PrivacyOfficer
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "ApplicabilityAssessment.${asmt_id}.state == SUBMITTED"
            - "ApplicabilityAssessment.${asmt_id}.determination == DUAL_TRACK"
            - "ApplicabilityAssessment.${asmt_id}.active_element_count_snapshot == 4"
            - "ApplicabilityAssessment.${asmt_id}.regulated_element_count_snapshot == 1"
            - "ApplicabilityAssessment.${asmt_id}.regulated_scope == PARTIAL"
            - "ApplicabilityAssessment.${asmt_id}.compliance_deadline_date == 2026-03-31"
            - "AppProduct.${prod_id}.small_business_flag == false"
            - "AppProduct.${prod_id}.applicability_status == UNDETERMINED"

      - name: request_response_deadline_nested_min_over_extension_and_verification
        grounds:
          - calculations.request_response_deadline
          - state_machines.ConsumerRequest.RECEIVED_to_VERIFIED
          - entities.ConsumerRequest.fields.response_deadline_at
          - entities.ConsumerRequest.fields.extension_granted
        distinguishing_aspect: |
          Mode (a) instance: a four-input formula whose branches nest a min() over the extended
          45+45-day deadline and the verification-anchored 30-day DELETE window, so the granted
          extension is observably overridden and response_deadline_at lands on 2026-09-14T00:00:00Z
          rather than 2026-11-08T00:00:00Z.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z when the request is filed, then advanced to 2026-08-15T00:00:00Z"
            - "one AppProduct with no ElementPurposeMapping rows, so the deletion fanout candidate set is empty"
            - "one ADULT Consumer"
            - "one DELETE ConsumerRequest in RECEIVED with extension_granted true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-8801", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_id: $.data.id, cons_token: $.data.verification_token }
            - call: "POST /health-data/consumer-requests"
              payload: { consumer_id: "${cons_id}", request_kind: "DELETE", submitted_channel: "IN_APP" }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { req_id: $.data.id }
            - call: "POST /health-data/consumer-requests/${req_id}/extend"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /health-data/consumer-requests/${req_id}/verify"
              payload: { verification_token: "${cons_token}" }
              as: PrivacyOfficer
          assert:
            - "ConsumerRequest.${req_id}.extension_granted == true"
            - "ConsumerRequest.${req_id}.verified_at == 2026-08-15T00:00:00Z"
            - "ConsumerRequest.${req_id}.response_deadline_at == 2026-09-14T00:00:00Z"
            - "ConsumerRequest.${req_id}.response_deadline_at != 2026-11-08T00:00:00Z"
            - "ConsumerRequest.${req_id}.outstanding_task_count == 0"
            - "ConsumerRequest.${req_id}.state == FULFILLED"

  - rule_id: non_linear_state_machine
    instances:
      - name: consumer_request_verification_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.ConsumerRequest.RECEIVED_to_VERIFICATION_PENDING
          - state_machines.ConsumerRequest.VERIFICATION_PENDING_to_RECEIVED
          - validations[priority=24]
          - entities.ConsumerRequest.fields.verification_rounds_used
        distinguishing_aspect: |
          Cycle shape on the ConsumerRequest entity: RECEIVED -> VERIFICATION_PENDING -> RECEIVED
          can be traversed exactly MAX_VERIFICATION_ROUNDS = 3 times, and the fourth
          request-more-info is rejected with ERR_VERIFICATION_ROUNDS_EXHAUSTED while the request
          stays in RECEIVED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z throughout, so every resubmit lands inside the 10-day verification window"
            - "one ACCESS ConsumerRequest that has completed three verification rounds and is back in RECEIVED with verification_rounds_used 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-9001", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /health-data/consumer-requests"
              payload: { consumer_id: "${cons_id}", request_kind: "ACCESS", submitted_channel: "WEB_FORM" }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { req_id: $.data.id }
            - call: "POST /health-data/consumer-requests/${req_id}/request-more-info"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /health-data/consumer-requests/${req_id}/resubmit-identity"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /health-data/consumer-requests/${req_id}/request-more-info"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /health-data/consumer-requests/${req_id}/resubmit-identity"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /health-data/consumer-requests/${req_id}/request-more-info"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /health-data/consumer-requests/${req_id}/resubmit-identity"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /health-data/consumer-requests/${req_id}/request-more-info"
              payload: {}
              as: PrivacyOfficer
          assert:
            - "error_id == ERR_VERIFICATION_ROUNDS_EXHAUSTED"
            - "http_status == 409"
            - "ConsumerRequest.${req_id}.verification_rounds_used == 3"
            - "ConsumerRequest.${req_id}.state == RECEIVED"
            - "ConsumerRequest.${req_id}.verification_window_ends_at == null"

      - name: consent_record_parallel_axes_sell_revocation_leaves_collect_and_share_intact
        grounds:
          - state_machines.ConsentRecord.ACTIVE_to_ACTIVE
          - entities.ConsentRecord.fields.collection_state
          - entities.ConsentRecord.fields.sharing_state
          - entities.ConsentRecord.fields.sale_state
          - entities.AppProduct.fields.active_share_consent_count
        distinguishing_aspect: |
          Parallel state dimensions on the ConsentRecord entity, a different entity from the
          cyclic ConsumerRequest instance: revoking the sale axis moves sale_state to REVOKED
          while collection_state stays GRANTED, sharing_state stays GRANTED and
          AppProduct.active_share_consent_count stays 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T00:00:00Z"
            - "one ADULT Consumer with an ACTIVE ConsentRecord whose three axes are GRANTED, GRANTED and AUTHORIZED"
            - "AppProduct.active_share_consent_count == 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-7100", residency_state_code: "NV", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /health-data/consent-records"
              payload: { consumer_id: "${cons_id}", expected_consumer_version: "${cons_v}" }
              as: PrivacyOfficer
              captures: { cr_id: $.data.id }
            - call: "POST /health-data/consent-records/${cr_id}/grants"
              payload: { axes: ["COLLECT"] }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /health-data/consent-records/${cr_id}/grants"
              payload: { axes: ["SHARE"] }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /health-data/consent-records/${cr_id}/grants"
              payload: { axes: ["SELL"] }
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /health-data/consent-records/${cr_id}/withdrawals"
              payload: { axis: "SELL" }
              as: Consumer
              as_user_id: "${cons_id}"
          assert:
            - "ConsentRecord.${cr_id}.sale_state == REVOKED"
            - "ConsentRecord.${cr_id}.collection_state == GRANTED"
            - "ConsentRecord.${cr_id}.sharing_state == GRANTED"
            - "ConsentRecord.${cr_id}.last_withdrawn_axis == SELL"
            - "ConsentRecord.${cr_id}.last_withdrawn_at == 2026-08-20T00:00:00Z"
            - "ConsentRecord.${cr_id}.processing_halt_deadline_at == 2026-09-04T00:00:00Z"
            - "ConsentRecord.${cr_id}.record_state == ACTIVE"
            - "AppProduct.${prod_id}.active_share_consent_count == 1"

