          Entity pair IncidentCase -> BiometricAsset (a different pair, a different direction and a
          different endpoint from the asset -> notice dependency): the incident has satisfied both of
          its own dimensions — containment CONTAINED and notification NOTIFIED — yet remediation is
          refused because a listed BiometricAsset is still ACTIVE. Gating that asset, with no change
          to the incident, unblocks the identical call.
