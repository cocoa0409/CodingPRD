# §1.9 Scaffold Corner Design — breadth probe over SCAFFOLD.yaml §1.1–§1.7.
# Taxonomy: references/claim-extraction-guide.md. Sections and claim_types are taken
# verbatim from that guide; §1.8-covered corners are emitted as excluded_because stubs.
scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_creation_returns_declared_fields_and_system_stamps
        claim_type: creation
        grounds:
          - entities.Customer
          - endpoints[POST /recommerce/customers]
          - response_envelope.success
        distinguishing_aspect: "POST /recommerce/customers with email, full_name and loyalty_tier returns 201 with every declared Customer field present, credit_balance_minor 0, diverted_grams_total 0, status ACTIVE and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id", cust_ver: "$.data.version", cust_created: "$.data.created_at", tier: "$.data.loyalty_tier", status: "$.data.status", bal: "$.data.credit_balance_minor", mass: "$.data.diverted_grams_total" }
          assert:
            - "HTTP 201 and the body is { meta: { api_request_id, api_request_timestamp }, response_type: \"object\", data: {...} }"
            - "${tier} == PLUS and ${status} == ACTIVE"
            - "${bal} == 0 and ${mass} == 0"
            - "${cust_ver} == 1 and ${cust_created} == 2026-08-01T00:00:00Z"
            - "Customer.${cust_id}.email == ava@example.com and Customer.${cust_id}.full_name == Ava Reyes"

      - name: customer_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /recommerce/customers/{id}]
          - entities.Customer
        distinguishing_aspect: "GET /recommerce/customers/{id} returns the same field values that the create call persisted, with no re-derivation and no version bump."
        test_recipe:
          setup:
            - "One customer created with loyalty_tier STANDARD."
          setup_api_calls:
            - call: "POST /recommerce/customers"
              payload: { email: "ben@example.com", full_name: "Ben Ortiz", loyalty_tier: "STANDARD" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id", ver_at_create: "$.data.version" }
          trigger:
            - call: "GET /recommerce/customers/${cust_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { got_email: "$.data.email", got_tier: "$.data.loyalty_tier", got_ver: "$.data.version" }
          assert:
            - "HTTP 200 and ${got_email} == ben@example.com"
            - "${got_tier} == STANDARD"
            - "${got_ver} == ${ver_at_create}  # a read never bumps version"

      - name: trade_in_listing_paginates_and_filters_by_customer_and_status
        claim_type: listing
        grounds:
          - endpoints[GET /recommerce/trade-ins]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /recommerce/trade-ins returns response_type array with limit, offset, total_count and has_more; limit=1 over three rows yields has_more true, and customer_id plus status filters narrow the set to exactly the matching rows."
        test_recipe:
          setup:
            - "One ACTIVE FOOTWEAR grade A GradePolicy and one ACTIVE CreditPolicy so quotes can be computed."
            - "Two customers; Ava submits two IN_STORE trade-ins and Ben submits one; one of Ava's is received."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "FOOTWEAR", condition_grade: "A", base_credit_pct_bp: 3500, resale_price_pct_bp: 6500, refurb_budget_cap_pct_bp: 2500, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ava_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ben@example.com", full_name: "Ben Ortiz", loyalty_tier: "STANDARD" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ben_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${ava_id}", store_location_id: "${store_id}", channel: "IN_STORE", product_category: "FOOTWEAR", declared_grade: "A", msrp_minor: 120000, item_mass_grams: 900 }
              as: Customer
              as_user_id: "${ava_id}"
              captures: { ti_a1: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${ava_id}", store_location_id: "${store_id}", channel: "IN_STORE", product_category: "FOOTWEAR", declared_grade: "A", msrp_minor: 120000, item_mass_grams: 950 }
              as: Customer
              as_user_id: "${ava_id}"
              captures: { ti_a2: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${ben_id}", store_location_id: "${store_id}", channel: "IN_STORE", product_category: "FOOTWEAR", declared_grade: "A", msrp_minor: 120000, item_mass_grams: 800 }
              as: Customer
              as_user_id: "${ben_id}"
              captures: { ti_b1: "$.data.id" }
            - call: "POST /recommerce/trade-ins/${ti_a1}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
          trigger:
            - call: "GET /recommerce/trade-ins?limit=1&offset=0"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /recommerce/trade-ins?customer_id=${ava_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ava_first: "$.data[0].id" }
            - call: "GET /recommerce/trade-ins?customer_id=${ava_id}&status=RECEIVED"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { received_first: "$.data[0].id", received_status: "$.data[0].status" }
          assert:
            - "response_type == \"array\" on every listing call"
            - "the unfiltered page returns limit 1, offset 0, total_count 3 and has_more true, and ${page1_first} == ${ti_a1} (created_at ASC)"
            - "the customer_id filter returns total_count 2 with has_more false and ${ava_first} == ${ti_a1}"
            - "the customer_id + status filter returns total_count 1, ${received_first} == ${ti_a1} and ${received_status} == RECEIVED"
            - "${ti_a2} and ${ti_b1} are absent from the status-filtered page"

      - name: not_found_on_unknown_configuration_entity_ids
        claim_type: not_found
        grounds:
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_GRADE_POLICY_NOT_FOUND]
          - errors[ERR_CREDIT_POLICY_NOT_FOUND]
          - errors[ERR_STORE_LOCATION_NOT_FOUND]
          - errors[ERR_CHANNEL_NOT_FOUND]
        distinguishing_aspect: "Each configuration-entity GET with a syntactically valid but unknown id returns 404 with its own entity-specific error_id in data.error_id — never a generic 404 and never ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database — no configuration rows of any kind exist."
          setup_api_calls: []
          trigger:
            - call: "GET /recommerce/customers/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_cust: "$.data.error_id" }
            - call: "GET /recommerce/grade-policies/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_grade: "$.data.error_id" }
            - call: "GET /recommerce/credit-policies/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_credit: "$.data.error_id" }
            - call: "GET /recommerce/store-locations/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_store: "$.data.error_id" }
            - call: "GET /recommerce/channels/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_chan: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404 with response_type \"error\" and a non-empty data.message"
            - "${e_cust} == ERR_CUSTOMER_NOT_FOUND"
            - "${e_grade} == ERR_GRADE_POLICY_NOT_FOUND"
            - "${e_credit} == ERR_CREDIT_POLICY_NOT_FOUND"
            - "${e_store} == ERR_STORE_LOCATION_NOT_FOUND"
            - "${e_chan} == ERR_CHANNEL_NOT_FOUND"

      - name: not_found_on_unknown_operational_entity_ids
        claim_type: not_found
        grounds:
          - errors[ERR_TRADE_IN_NOT_FOUND]
          - errors[ERR_RESALE_UNIT_NOT_FOUND]
          - errors[ERR_REFURB_ORDER_NOT_FOUND]
          - errors[ERR_REFURB_BAY_NOT_FOUND]
        distinguishing_aspect: "Unknown ids on the operational surface resolve to their own 404 error_ids, including ERR_REFURB_BAY_NOT_FOUND raised from a body field (refurb_bay_id) rather than a path segment."
        test_recipe:
          setup:
            - "One accepted OUTERWEAR grade B trade-in exists, so a real ResaleUnit id is available for the mixed-reference case."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "GET /recommerce/resale-units?trade_in_id=${ti_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { unit_id: "$.data[0].id", unit_ver: "$.data[0].version" }
          trigger:
            - call: "GET /recommerce/trade-ins/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_ti: "$.data.error_id" }
            - call: "GET /recommerce/resale-units/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_unit: "$.data.error_id" }
            - call: "GET /recommerce/refurb-orders/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_ro: "$.data.error_id" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${unit_id}", refurb_bay_id: "00000000-0000-0000-0000-0000000000ff", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_resale_unit_version: "${unit_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { e_bay: "$.data.error_id" }
          assert:
            - "${e_ti} == ERR_TRADE_IN_NOT_FOUND  # HTTP 404"
            - "${e_unit} == ERR_RESALE_UNIT_NOT_FOUND  # HTTP 404"
            - "${e_ro} == ERR_REFURB_ORDER_NOT_FOUND  # HTTP 404"
            - "${e_bay} == ERR_REFURB_BAY_NOT_FOUND  # HTTP 404, raised from the body FK, and it outranks nothing else because no other rule was violated"
            - "no RefurbOrder row was created and ResaleUnit.${unit_id}.version == ${unit_ver}"

      - name: not_found_on_unknown_ledger_and_report_entity_ids
        claim_type: not_found
        grounds:
          - errors[ERR_CREDIT_GRANT_NOT_FOUND]
          - errors[ERR_RESALE_ORDER_NOT_FOUND]
          - errors[ERR_MARKDOWN_CAMPAIGN_NOT_FOUND]
          - errors[ERR_DIVERSION_REPORT_NOT_FOUND]
        distinguishing_aspect: "The ledger, order, campaign and report reads each raise their own 404 error_id, and ERR_DIVERSION_REPORT_NOT_FOUND is also raised for an unknown supersedes_report_id supplied in a POST body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /recommerce/credit-grants/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_grant: "$.data.error_id" }
            - call: "GET /recommerce/resale-orders/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_ord: "$.data.error_id" }
            - call: "GET /recommerce/markdown-campaigns/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_camp: "$.data.error_id" }
            - call: "GET /recommerce/diversion-reports/00000000-0000-0000-0000-0000000000ff"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_rpt: "$.data.error_id" }
            - call: "POST /recommerce/diversion-reports"
              payload: { period_start_at: "2026-08-01T00:00:00Z", period_end_at: "2026-09-01T00:00:00Z", supersedes_report_id: "00000000-0000-0000-0000-0000000000ff" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_sup: "$.data.error_id" }
          assert:
            - "${e_grant} == ERR_CREDIT_GRANT_NOT_FOUND  # HTTP 404"
            - "${e_ord} == ERR_RESALE_ORDER_NOT_FOUND  # HTTP 404"
            - "${e_camp} == ERR_MARKDOWN_CAMPAIGN_NOT_FOUND  # HTTP 404"
            - "${e_rpt} == ERR_DIVERSION_REPORT_NOT_FOUND  # HTTP 404"
            - "${e_sup} == ERR_DIVERSION_REPORT_NOT_FOUND  # HTTP 404 from the body reference; no DiversionReport row is created"

      - name: grade_policy_creation_missing_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - entities.GradePolicy.fields.warranty_days
          - validations[priority=25]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting warranty_days — a source: input field with no default — returns ERR_INVALID_REQUEST (422) and persists no GradePolicy row, and the same call with the field present succeeds."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "FOOTWEAR", condition_grade: "A", base_credit_pct_bp: 3500, resale_price_pct_bp: 6500, refurb_budget_cap_pct_bp: 2500, restock_fee_pct_bp: 1200 }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { err: "$.data.error_id" }
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "FOOTWEAR", condition_grade: "A", base_credit_pct_bp: 3500, resale_price_pct_bp: 6500, refurb_budget_cap_pct_bp: 2500, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { gp_id: "$.data.id", gp_status: "$.data.status", gp_warranty: "$.data.warranty_days" }
          assert:
            - "${err} == ERR_INVALID_REQUEST  # HTTP 422"
            - "${gp_status} == ACTIVE and ${gp_warranty} == 30  # HTTP 201 once the field is supplied"
            - "exactly one GradePolicy row exists after both calls"

      - name: customer_loyalty_tier_defaults_to_standard_when_omitted
        claim_type: defaults
        grounds:
          - entities.Customer.fields.loyalty_tier
          - entities.Customer.fields.status
          - endpoints[POST /recommerce/customers]
        distinguishing_aspect: "Omitting the optional loyalty_tier yields STANDARD, not null and not PLUS, so the issuance_final tier bonus is 0 for that customer."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /recommerce/customers"
              payload: { email: "cleo@example.com", full_name: "Cleo Diaz" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id", tier: "$.data.loyalty_tier", status: "$.data.status" }
          assert:
            - "${tier} == STANDARD  # the declared default, applied by the server"
            - "${status} == ACTIVE"
            - "Customer.${cust_id}.credit_balance_minor == 0"

      - name: trade_in_computed_fields_are_server_derived_and_ignore_client_values
        claim_type: computed_fields
        grounds:
          - entities.TradeIn.fields.appraised_credit_minor
          - entities.TradeIn.fields.receive_deadline_at
          - calculations.trade_in_appraised_credit
          - global_constants.MAIL_IN_INTAKE_WINDOW_DAYS
          - global_constants.IN_STORE_INTAKE_WINDOW_DAYS
        distinguishing_aspect: "appraised_credit_minor and receive_deadline_at are not accepted from the request body: a MAIL_IN FOOTWEAR grade A trade-in of msrp 120000 is quoted 46200 with a deadline of 2026-08-22T00:00:00Z, and an IN_STORE one is quoted 42000 with a deadline of 2026-08-03T00:00:00Z."
        test_recipe:
          setup:
            - "ACTIVE FOOTWEAR grade A GradePolicy (base_credit_pct_bp 3500) and ACTIVE CreditPolicy (mail_in_bonus_pct_bp 1000)."
            - "One PLUS customer — the tier bonus must still be excluded from the quote variant."
            - "Logical clock at the 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "FOOTWEAR", condition_grade: "A", base_credit_pct_bp: 3500, resale_price_pct_bp: 6500, refurb_budget_cap_pct_bp: 2500, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "FOOTWEAR", declared_grade: "A", msrp_minor: 120000, item_mass_grams: 900 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mail_id: "$.data.id", mail_quote: "$.data.appraised_credit_minor", mail_deadline: "$.data.receive_deadline_at", mail_status: "$.data.status", mail_auth: "$.data.authenticity_result", mail_appeals: "$.data.appeal_count" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "IN_STORE", product_category: "FOOTWEAR", declared_grade: "A", msrp_minor: 120000, item_mass_grams: 900 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { store_ti_id: "$.data.id", store_quote: "$.data.appraised_credit_minor", store_deadline: "$.data.receive_deadline_at" }
          assert:
            - "${mail_quote} == 46200  # floor(120000*3500/10000)=42000 plus floor(42000*1000/10000)=4200; the PLUS tier bonus is excluded from quote_provisional"
            - "${store_quote} == 42000  # IN_STORE earns no channel bonus"
            - "${mail_deadline} == 2026-08-22T00:00:00Z  # created_at + MAIL_IN_INTAKE_WINDOW_DAYS 21"
            - "${store_deadline} == 2026-08-03T00:00:00Z  # created_at + IN_STORE_INTAKE_WINDOW_DAYS 2"
            - "${mail_status} == SUBMITTED and ${mail_auth} == PENDING and ${mail_appeals} == 0"
            - "TradeIn.${mail_id}.assessed_grade is null and TradeIn.${store_ti_id}.received_at is null"

      - name: refurb_order_system_fields_are_not_client_settable
        claim_type: system_fields
        grounds:
          - entities.RefurbOrder.fields.status
          - entities.RefurbOrder.fields.rework_count
          - entities.RefurbOrder.fields.performed_by_user_id
          - endpoints[POST /recommerce/refurb-orders]
        distinguishing_aspect: "POST /recommerce/refurb-orders accepts only the five declared input fields; id, created_at, updated_at, version, status, rework_count, logged_cost_minor, viability_ratio_bp, performed_by_user_id and qc_by_user_id are all server-assigned on creation."
        test_recipe:
          setup:
            - "One accepted OUTERWEAR grade B trade-in giving a unit in lifecycle_state INTAKE, and one CLEANING bay at the receiving store."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
