# =============================================================================
# SCAFFOLD.yaml — task_3330 Electric Arc Furnace Mini-Mill Production &
# Scrap-Based Pricing
#
# Sections §1.0–§1.7 (response envelope, entities, state machines,
# concurrency rules, calculations, validations, endpoints, errors, RBAC).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 lives in
# SCAFFOLD_CORNER_DESIGN.yaml. Neither key appears here.
# =============================================================================

scenario: |
  Electric Arc Furnace Mini-Mill Production & Scrap-Based Pricing (Nucor):
  scrap and direct reduced iron feedstock procurement with grade mixing to
  hit chemistry targets, melt shop scheduling with heat sequencing, ladle
  metallurgy and continuous casting into billets, blooms or slabs, rolling
  mill campaigns grouped by product size and grade to limit roll changes,
  product pricing indexed to scrap surcharges with contract and spot customer
  differences, production allocation across divisions serving construction,
  automotive and energy markets, energy consumption management with
  interruptible power arrangements during peak periods, quality certification
  and mill test reports for structural and certified applications,
  decentralized division management with profit sharing to employees.

domain_name: eaf-mini-mill
api_prefix: /mills

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hierarchical            # Mill → Heat / Campaign / CustomerAccount → children
  state_machine_shape: hybrid_non_linear   # linear core pipelines plus cyclic revision (MeltdownSheet),
                                           # parallel dimensions (CustomerAccount),
                                           # posture_derived (MillPosture = f(EnergyEvent state))
  relationship_patterns:
    - one_to_many                          # Mill→Heat, Campaign→Heat, CustomerAccount→Order
    - many_to_many                         # HeatChargeLine + CampaignLine junctions
    - cross_aggregate                      # HeatChargeLine.scrap_lot_id references ScrapLot (child of ProcurementContract)
    - polymorphic                          # PowerInterruptionWaiver.scope_id targets EnergyEvent or InterruptibleWindow

  role_model: hierarchical_override        # PlantManager superset over MillOperator/Scheduler/Metallurgist; ProcurementOfficer and AccountManager are peers; QualityEngineer exclusive MTR issuance

  consistency_model: immediate             # every mutation and every cascade is atomic inside the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Mill
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Mill display name" }
      - { name: division, type: enum, source: input, description: "CONSTRUCTION | AUTOMOTIVE | ENERGY — market the division primarily serves" }
      - { name: furnace_capacity_tons, type: number, source: input, description: "Maximum furnace tapped weight per heat; constraints: > 0" }
      - { name: caster_rate_tph, type: number, source: input, description: "Continuous caster throughput in tons per hour; constraints: > 0" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | INTERRUPTED — derived: INTERRUPTED iff the mill has an EnergyEvent in ACTIVE or a linked InterruptibleWindow whose window contains the logical clock; recomputed on event activate/release and on reads" }

  - name: SurchargeIndex
    parent: Mill
    common_fields: false   # immutable archive; no version / updated_at
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; owning mill" }
      - { name: grade_category, type: enum, source: input, description: "SHREDDED | BUSHLING | HMS | DRI | PIG_IRON" }
      - { name: effective_month, type: string, source: input, description: "Calendar month the price applies to, format YYYY-MM" }
      - { name: price_per_ton_cents, type: integer, source: input, description: "Index price for the grade in that month; constraints: >= 0" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | SUPERSEDED — the latest-created row per (mill, grade_category, effective_month) is PUBLISHED; superseding flips the prior row to SUPERSEDED" }

  - name: ProcurementContract
    parent: Mill
    common_fields: true
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; buying mill" }
      - { name: supplier_name, type: string, source: input, description: "Scrap or DRI supplier legal name" }
      - { name: grade_category, type: enum, source: input, description: "SHREDDED | BUSHLING | HMS | DRI | PIG_IRON — single-grade contract" }
      - { name: contract_type, type: enum, source: input, description: "FIXED | INDEXED — FIXED prices at contract_price_cents; INDEXED prices at the SurchargeIndex of the receipt month" }
      - { name: contract_price_cents, type: integer, source: input, description: "Required for FIXED; forbidden for INDEXED; constraints: >= 0" }
      - { name: committed_tons, type: number, source: input, description: "Total tonnage the supplier committed; constraints: > 0" }
      - { name: received_tons, type: number, source: computed, description: "Sum of ScrapLot.tons_received for lots under this contract in status RECEIVED or CONSUMED" }
      - { name: settlement_tons, type: number, source: computed, description: "Tonnage actually settled at CLOSED: min(received_tons, committed_tons)" }
      - { name: settlement_amount_cents, type: integer, source: computed, description: "Contract close-out amount per the settlement rule (forward-looking vs chronological variants)" }
      - { name: status, type: enum, source: system, description: "OPEN → CLOSED | DEFAULTED" }

  - name: ScrapLot
    parent: ProcurementContract
    common_fields: false   # immutable receipt record; terminal-state edits land on the contract
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> ProcurementContract.id; supplying contract" }
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; receiving mill (denormalized for lot-level queries)" }
      - { name: received_on, type: string, source: input, description: "Receipt date, format YYYY-MM-DD" }
      - { name: tons_received, type: number, source: input, description: "Scale weight received; constraints: > 0" }
      - { name: moisture_pct, type: number, source: input, default: 0.0, description: "Moisture fraction of gross weight; constraints: 0.0 <= moisture_pct <= 0.30" }
      - { name: dry_tons, type: number, source: computed, description: "tons_received * (1 - moisture_pct)" }
      - { name: cu_pct, type: number, source: input, description: "Copper fraction of melt; constraints: 0.0 <= cu_pct <= 0.005" }
      - { name: mn_pct, type: number, source: input, description: "Manganese fraction; constraints: 0.0 <= mn_pct <= 0.02" }
      - { name: remaining_tons, type: number, source: system, description: "Unallocated dry tonnage; initialized to dry_tons, decremented by HeatChargeLine consumption" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PARTIALLY_CONSUMED | CONSUMED" }

  - name: Grade
    parent: Mill
    common_fields: false   # catalog configuration; immutable
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; mill catalog scope" }
      - { name: grade_code, type: string, source: input, description: "Grade identifier, unique per mill" }
      - { name: product_form, type: enum, source: input, description: "BILLET | BLOOM | SLAB" }
      - { name: grade_group, type: enum, source: input, description: "GROUP_A | GROUP_B — roll-change family used by campaign sequencing" }
      - { name: certification_class, type: enum, source: input, description: "STANDARD | STRUCTURAL | CERTIFIED — CERTIFIED implies STRUCTURAL (validation narrows input to {STANDARD, CERTIFIED})" }
      - { name: cu_max_pct, type: number, source: input, description: "Maximum copper fraction in the tapped heat; constraints: > 0" }
      - { name: mn_min_pct, type: number, source: input, description: "Minimum manganese fraction; constraints: >= 0" }
      - { name: mn_max_pct, type: number, source: input, description: "Maximum manganese fraction; constraints: >= mn_min_pct" }
      - { name: requires_energy_certified, type: boolean, source: input, description: "When true, mill test reports must cite energy-interval compliance" }

  - name: Heat
    parent: Mill
    common_fields: true
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; producing mill" }
      - { name: heat_number, type: string, source: input, description: "Human heat number, unique per mill" }
      - { name: grade_id, type: string, source: input, description: "FK -> Grade.id; target grade" }
      - { name: target_tap_weight_tons, type: number, source: input, description: "Planned tap weight; constraints: 0 < target_tap_weight_tons <= Mill.furnace_capacity_tons" }
      - { name: planned_tap_at, type: datetime, source: input, description: "Planned tap timestamp (ISO 8601 UTC); scheduling grid anchor" }
      - { name: energy_kwh, type: number, source: computed, default: 0.0, description: "Accumulated furnace energy; incremented by energy-interval recording" }
      - { name: charge_cost_cents, type: integer, source: computed, description: "Material cost of the charge mix at tap, frozen at TAP_OUT" }
      - { name: scrap_surcharge_credit_cents, type: integer, source: computed, description: "Charged-mix value minus the blend benchmark, computed at MELTDOWN_LOCKED (may be negative)" }
      - { name: status, type: enum, source: system, description: "PLANNED → CHARGED → MELTDOWN_LOCKED → TAPPED → CAST | ABORTED" }

  - name: HeatChargeLine
    parent: Heat
    common_fields: false   # immutable allocation record
    fields:
      - { name: heat_id, type: string, source: system, description: "FK -> Heat.id; consuming heat" }
      - { name: scrap_lot_id, type: string, source: input, description: "FK -> ScrapLot.id; lot drawn from (cross-aggregate reference: ScrapLot is a child of ProcurementContract)" }
      - { name: tons, type: number, source: input, description: "Dry tons drawn from the lot; constraints: > 0 and <= ScrapLot.remaining_tons at apply time" }
      - { name: line_cost_cents, type: integer, source: computed, description: "Price of this draw at apply time: contract FIXED price or INDEXED SurchargeIndex price of the lot receipt month, times tons" }

  - name: MeltdownSheet
    parent: Heat
    common_fields: true
    fields:
      - { name: heat_id, type: string, source: system, description: "FK -> Heat.id; owning heat (exactly one sheet per heat)" }
      - { name: revision_no, type: integer, source: system, description: "Starts at 1, increments on every REVISED cycle" }
      - { name: cu_pct, type: number, source: input, description: "Measured copper fraction of the meltdown sample; constraints: 0.0 <= cu_pct <= 0.02" }
      - { name: mn_pct, type: number, source: input, description: "Measured manganese fraction; constraints: 0.0 <= mn_pct <= 0.05" }
      - { name: chem_ok, type: boolean, source: computed, description: "cu_pct <= Grade.cu_max_pct AND Grade.mn_min_pct <= mn_pct <= Grade.mn_max_pct" }
      - { name: status, type: enum, source: system, description: "RECORDED → REVISED (→ RECORDED) → CONFIRMED | REJECTED" }

  - name: Campaign
    parent: Mill
    common_fields: true
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; rolling mill" }
      - { name: name, type: string, source: input, description: "Campaign label" }
      - { name: product_family, type: enum, source: input, description: "REBAR | BEAM | PLATE | WIRE_ROD — roll-set family" }
      - { name: grade_group, type: enum, source: input, description: "GROUP_A | GROUP_B — roll-change rules key on grade group, not individual grade" }
      - { name: planned_start, type: datetime, source: input, description: "Planned campaign start (ISO 8601 UTC)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned campaign end; must be > planned_start" }
      - { name: roll_changes_used, type: integer, source: computed, default: 0, description: "Grade-group transitions between adjacent committed campaign lines, in campaign_created_at order" }
      - { name: roll_change_budget, type: integer, source: input, description: "Maximum roll changes the campaign may commit; constraints: >= 0" }
      - { name: status, type: enum, source: system, description: "OPEN → COMMITTED → CLOSED | CANCELLED" }

  - name: CampaignLine
    parent: Campaign
    common_fields: false   # junction rows; campaign fields are recomputed instead of updating lines
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; owning campaign" }
      - { name: heat_id, type: string, source: input, description: "FK -> Heat.id; heat entering the rolling campaign (must be CAST)" }
      - { name: campaign_grade_group, type: string, source: computed, description: "Snapshot of the campaign's grade_group at commit, used to recompute roll_changes_used" }

  - name: CustomerAccount
    parent: Mill
    common_fields: true
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; selling division" }
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: market, type: enum, source: input, description: "CONSTRUCTION | AUTOMOTIVE | ENERGY" }
      - { name: pricing_mode, type: enum, source: input, description: "CONTRACT | SPOT — primary pricing dimension" }
      - { name: credit_status, type: enum, source: system, description: "GOOD → WATCH → BLOCKED (parallel dimension A)" }
      - { name: allocation_priority, type: enum, source: system, default: "STANDARD", description: "STANDARD | STRATEGIC (parallel dimension B); STRATEGIC customers win division allocation ties" }

  - name: Order
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CustomerAccount.id; buying account" }
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; fulfilling division" }
      - { name: product_family, type: enum, source: input, description: "REBAR | BEAM | PLATE | WIRE_ROD" }
      - { name: grade_id, type: string, source: input, description: "FK -> Grade.id; ordered grade" }
      - { name: tons, type: number, source: input, description: "Ordered tonnage; constraints: > 0" }
      - { name: fulfillment_month, type: string, source: input, description: "Delivery month, format YYYY-MM; drives the index-month variant rule" }
      - { name: base_price_cents_per_ton, type: integer, source: input, description: "Mill list base price per ton; constraints: > 0" }
      - { name: allocated_tons, type: number, source: computed, default: 0.0, description: "Tons allocated by division allocation runs" }
      - { name: computed_price_cents, type: integer, source: computed, description: "Full order price at CONFIRMED (CONTRACT formula) and again at INVOICED (SPOT re-price); see product_price calculation" }
      - { name: price_basis, type: enum, source: computed, description: "CONTRACT_MONTH_INDEX | CURRENT_MONTH_INDEX — which variant produced the stored price" }
      - { name: status, type: enum, source: system, description: "QUOTED → CONFIRMED → ALLOCATED → INVOICED | CANCELLED" }

  - name: MillTestReport
    parent: Heat
    common_fields: false   # issued documents are immutable; supersession closes the prior heat's document trail
    fields:
      - { name: heat_id, type: string, source: system, description: "FK -> Heat.id; certified heat" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order the MTR certifies" }
      - { name: report_no, type: string, source: system, description: "Server-minted MTR number, format MTR-<sequence> per mill" }
      - { name: chemistry_snapshot, type: object, source: system, description: "Copy of the CONFIRMED MeltdownSheet chemistry at issue (cu_pct, mn_pct, revision_no)" }
      - { name: energy_certified, type: boolean, source: system, description: "True iff Grade.requires_energy_certified is false, or every recorded energy interval for the heat ran while Mill.posture == NORMAL" }

  - name: InterruptibleWindow
    parent: Mill
    common_fields: true
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; covered mill" }
      - { name: label, type: string, source: input, description: "Utility program label" }
      - { name: start_at, type: datetime, source: input, description: "Window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Window end; must be > start_at" }
      - { name: curtailment_credit_cents, type: integer, source: input, description: "Credit earned if the mill honors an interruption inside this window; constraints: >= 0" }
      - { name: linked_event_id, type: string, source: system, description: "FK -> EnergyEvent.id; null until an EnergyEvent is activated inside the window" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → HONORED | LAPSED" }

  - name: EnergyEvent
    parent: Mill
    common_fields: true
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; interrupted mill" }
      - { name: grid_operator, type: string, source: input, description: "ISO / utility issuing the curtailment call" }
      - { name: called_at, type: datetime, source: input, description: "Interruption start (ISO 8601 UTC)" }
      - { name: released_at, type: datetime, source: input, description: "Interruption end; must be > called_at" }
      - { name: waiver_count, type: integer, source: computed, default: 0, description: "Event-scoped PowerInterruptionWaiver count" }
      - { name: status, type: enum, source: system, description: "DECLARED → ACTIVE → RELEASED | EXPIRED" }

  - name: PowerInterruptionWaiver
    parent: Mill
    common_fields: false   # immutable grant record
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; granting mill" }
      - { name: scope, type: enum, source: input, description: "HEAT | EVENT — polymorphic target selector" }
      - { name: scope_id, type: string, source: input, description: "Polymorphic FK: scope HEAT -> Heat.id; scope EVENT -> EnergyEvent.id" }
      - { name: granted_by, type: string, source: system, description: "X-User-ID of the granting EnergyDispatcher" }
      - { name: reason, type: string, source: input, description: "Free-text justification" }

  - name: EnergyInterval
    parent: Heat
    common_fields: false   # append-only metering log
    fields:
      - { name: heat_id, type: string, source: system, description: "FK -> Heat.id; metered heat" }
      - { name: interval_start, type: datetime, source: input, description: "Interval start (ISO 8601 UTC)" }
      - { name: interval_end, type: datetime, source: input, description: "Interval end; must be > interval_start" }
      - { name: kwh, type: number, source: input, description: "Energy consumed in the interval; constraints: > 0" }
      - { name: posture_at_interval, type: enum, source: system, description: "Mill posture snapshot at record time: NORMAL | INTERRUPTED" }

  - name: DivisionScorecard
    parent: Mill
    common_fields: true
    fields:
      - { name: mill_id, type: string, source: system, description: "FK -> Mill.id; the division" }
      - { name: period, type: string, source: input, description: "Scorecard month, format YYYY-MM" }
      - { name: revenue_cents, type: integer, source: computed, default: 0, description: "Sum of Order.computed_price_cents for orders INVOICED with fulfillment_month == period" }
      - { name: material_cost_cents, type: integer, source: computed, default: 0, description: "Sum of Heat.charge_cost_cents for heats CAST whose linked campaign lines serve orders invoiced in period; simplified: heats tapped in period" }
      - { name: energy_cost_cents, type: integer, source: computed, default: 0, description: "Metered energy cost minus curtailment credits for the period" }
      - { name: curtailment_credits_cents, type: integer, source: computed, default: 0, description: "Sum of InterruptibleWindow.curtailment_credit_cents for windows HONORED in the period" }
      - { name: profit_cents, type: integer, source: computed, description: "revenue_cents - material_cost_cents - energy_cost_cents" }
      - { name: profit_pool_cents, type: integer, source: computed, description: "max(0, profit_cents) * PROFIT_SHARE_RATE" }
      - { name: headcount, type: integer, source: input, description: "Eligible employees at close; constraints: > 0" }
      - { name: distribution_per_employee_cents, type: integer, source: computed, description: "profit_pool_cents // headcount, floor to whole cents" }
      - { name: remainder_cents, type: integer, source: computed, description: "profit_pool_cents - distribution_per_employee_cents * headcount" }
      - { name: status, type: enum, source: system, description: "OPEN → CLOSED → DISTRIBUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: SurchargeIndex
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when a new SurchargeIndex is created for the same mill + grade_category + effective_month)"
        actor: system
        preconditions: []
        side_effects:
          - "Prior row status → SUPERSEDED (immutable archive row; the only mutation an index row ever undergoes)"
          - "New row status = PUBLISHED"

  - entity: ProcurementContract
    initial_state: OPEN
    terminal_states: [CLOSED, DEFAULTED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /mills/{millId}/procurement-contracts/{contractId}/close"
        actor: ProcurementOfficer
        preconditions:
          - "Contract is OPEN (ERR_INVALID_STATE otherwise)"
          - "received_tons >= SETTLEMENT_MIN_FILL_PCT * committed_tons (ERR_UNDER_DELIVERED otherwise; constant 0.80)"
        side_effects:
          - "settlement_tons := min(received_tons, committed_tons)"
          - "settlement_amount_cents computed per settlement_amount rule (INDEXED → chronological FIFO, FIXED → forward-looking flat)"
          - "increments ProcurementContract.version by 1"

      - from: OPEN
        to: DEFAULTED
        trigger: "POST /mills/{millId}/procurement-contracts/{contractId}/default"
        actor: ProcurementOfficer
        preconditions:
          - "Contract is OPEN (ERR_INVALID_STATE otherwise)"
          - "Logical clock day is at least 7 days after the last day of the most recent receipt month (settlement window elapsed)"
        side_effects:
          - "settlement_tons := received_tons"
          - "settlement_amount_cents computed over received lots only"
          - "All ScrapLots of the contract with remaining_tons > 0 stay RECEIVED/PARTIALLY_CONSUMED but become ineligible for new charge lines (frozen pool)"
          - "increments ProcurementContract.version by 1"

  - entity: ScrapLot
    initial_state: RECEIVED
    terminal_states: [CONSUMED]
    transitions:
      - from: RECEIVED
        to: PARTIALLY_CONSUMED
        trigger: "system (automatic when a HeatChargeLine draws less than remaining_tons)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_tons -= line tons"
      - from: RECEIVED
        to: CONSUMED
        trigger: "system (automatic when a HeatChargeLine draws exactly remaining_tons)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_tons := 0"
      - from: PARTIALLY_CONSUMED
        to: PARTIALLY_CONSUMED
        trigger: "system (automatic when a HeatChargeLine draws less than remaining_tons)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_tons -= line tons"
      - from: PARTIALLY_CONSUMED
        to: CONSUMED
        trigger: "system (automatic when a HeatChargeLine draws exactly remaining_tons)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_tons := 0"

  - entity: Heat
    initial_state: PLANNED
    terminal_states: [CAST, ABORTED]
    transitions:
      - from: PLANNED
        to: CHARGED
        trigger: "POST /mills/{millId}/heats/{heatId}/charges (first successful charge line; idempotent re-entry on later lines)"
        actor: MillOperator
        preconditions:
          - "Heat is PLANNED or CHARGED (ERR_INVALID_STATE otherwise)"
          - "Mill.posture == NORMAL, OR the heat is covered by a PowerInterruptionWaiver with scope HEAT targeting this heat, OR by a waiver with scope EVENT targeting the mill's ACTIVE EnergyEvent (ERR_MILL_INTERRUPTED otherwise)"
          - "Each referenced ScrapLot is RECEIVED or PARTIALLY_CONSUMED with remaining_tons >= requested tons, and its contract is OPEN (ERR_LOT_DEPLETED / ERR_CONTRACT_NOT_OPEN otherwise)"
          - "No other heat of this mill is in {CHARGED, MELTDOWN_LOCKED, TAPPED} with a planned_tap_at within +/- FURNACE_GRID_MINUTES (45) of this heat's planned_tap_at (ERR_HEAT_SEQUENCE_CONFLICT otherwise)"
        side_effects:
          - "For each charge line: ScrapLot remaining_tons decremented and status advanced (RECEIVED→PARTIALLY_CONSUMED/CONSUMED)"
          - "ScrapLot mutation bubbles up: ProcurementContract.received_tons unchanged, but contract.version NOT bumped (lots are the ledger of record)"
          - "Heat status → CHARGED on the first line; heat.version +1"

      - from: CHARGED
        to: MELTDOWN_LOCKED
        trigger: "POST /mills/{millId}/heats/{heatId}/meltdown-sheets (sheet reaches CONFIRMED — see MeltdownSheet machine)"
        actor: Metallurgist
        preconditions:
          - "Heat is CHARGED (ERR_INVALID_STATE otherwise)"
          - "The confirmed sheet has chem_ok == true (ERR_CHEMISTRY_OUT_OF_SPEC otherwise)"
        side_effects:
          - "scrap_surcharge_credit_cents computed (charged-mix value minus blend benchmark)"
          - "heat.version +1"

      - from: MELTDOWN_LOCKED
        to: TAPPED
        trigger: "POST /mills/{millId}/heats/{heatId}/tap"
        actor: MillOperator
        preconditions:
          - "Heat is MELTDOWN_LOCKED (ERR_INVALID_STATE otherwise)"
          - "Mill.posture == NORMAL or the heat is waiver-covered (ERR_MILL_INTERRUPTED otherwise)"
        side_effects:
          - "charge_cost_cents frozen as the sum of HeatChargeLine.line_cost_cents"
          - "heat.version +1"

      - from: TAPPED
        to: CAST
        trigger: "POST /mills/{millId}/heats/{heatId}/cast"
        actor: MillOperator
        preconditions:
          - "Heat is TAPPED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "DivisionScorecard (mill, month of planned_tap_at) material_cost_cents += charge_cost_cents if the scorecard exists and is OPEN"
          - "heat.version +1"

      - from: PLANNED
        to: ABORTED
        trigger: "POST /mills/{millId}/heats/{heatId}/abort"
        actor: MillOperator
        preconditions:
          - "Heat is PLANNED, CHARGED, or MELTDOWN_LOCKED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Compensating release: every HeatChargeLine's tons credited back to its ScrapLot.remaining_tons; lot status recomputed (CONSUMED→PARTIALLY_CONSUMED/RECEIVED, PARTIALLY_CONSUMED→RECEIVED when fully restored)"
          - "MeltdownSheet, if any and not CONFIRMED, → REJECTED"
          - "heat.version +1"

      - from: CHARGED
        to: ABORTED
        trigger: "POST /mills/{millId}/heats/{heatId}/abort"
        actor: MillOperator
        preconditions:
          - "Heat is PLANNED, CHARGED, or MELTDOWN_LOCKED"
        side_effects:
          - "Same compensating release as PLANNED → ABORTED"
      - from: MELTDOWN_LOCKED
        to: ABORTED
        trigger: "POST /mills/{millId}/heats/{heatId}/abort"
        actor: MillOperator
        preconditions:
          - "Heat is PLANNED, CHARGED, or MELTDOWN_LOCKED"
        side_effects:
          - "Same compensating release as PLANNED → ABORTED"

  - entity: MeltdownSheet
    initial_state: RECORDED
    terminal_states: [CONFIRMED, REJECTED]
    transitions:
      - from: RECORDED
        to: REVISED
        trigger: "POST /mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/revise"
        actor: Metallurgist
        preconditions:
          - "Sheet is RECORDED or REVISED (cyclic revision loop)"
          - "Heat is CHARGED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "revision_no += 1; cu_pct/mn_pct replaced; chem_ok recomputed; sheet.version +1"

      - from: REVISED
        to: RECORDED
        trigger: "POST /mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/revise"
        actor: Metallurgist
        preconditions:
          - "Sheet is RECORDED or REVISED"
          - "Heat is CHARGED"
        side_effects:
          - "revision_no += 1 (each revise call counts a revision regardless of the RECORDED↔REVISED ping-pong)"

      - from: RECORDED
        to: CONFIRMED
        trigger: "POST /mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/confirm"
        actor: Metallurgist
        preconditions:
          - "Sheet is RECORDED or REVISED (ERR_INVALID_STATE otherwise)"
          - "chem_ok == true (ERR_CHEMISTRY_OUT_OF_SPEC otherwise)"
          - "Heat is CHARGED"
        side_effects:
          - "Heat → MELTDOWN_LOCKED with its side effects (cascade up)"

      - from: REVISED
        to: CONFIRMED
        trigger: "POST /mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/confirm"
        actor: Metallurgist
        preconditions:
          - "Sheet is RECORDED or REVISED"
          - "chem_ok == true"
          - "Heat is CHARGED"
        side_effects:
          - "Heat → MELTDOWN_LOCKED"

      - from: RECORDED
        to: REJECTED
        trigger: "POST /mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/reject"
        actor: Metallurgist
        preconditions:
          - "Sheet is RECORDED or REVISED"
        side_effects:
          - "None on the heat (heat remains CHARGED; operator may abort or record a new sheet revision is impossible — a rejected sheet closes the sheet lifecycle for this heat)"

      - from: REVISED
        to: REJECTED
        trigger: "POST /mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/reject"
        actor: Metallurgist
        preconditions:
          - "Sheet is RECORDED or REVISED"
        side_effects: []

  - entity: Campaign
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: COMMITTED
        trigger: "POST /mills/{millId}/campaigns/{campaignId}/commit"
        actor: Scheduler
        preconditions:
          - "Campaign is OPEN (ERR_INVALID_STATE otherwise)"
          - "At least one CampaignLine (ERR_CAMPAIGN_EMPTY otherwise)"
          - "Every CampaignLine's heat is CAST (ERR_HEAT_NOT_CAST otherwise)"
          - "Every line heat's planned_tap_at falls inside [planned_start, planned_end] (ERR_CAMPAIGN_WINDOW_VIOLATION otherwise)"
          - "Recomputed roll_changes_used <= roll_change_budget (ERR_ROLL_CHANGE_BUDGET_EXCEEDED otherwise)"
          - "The interval [planned_start, planned_end] does not overlap any other COMMITTED campaign of this mill with the same product_family — half-open adjacency [start,end) vs [start,end) allows touching endpoints (ERR_CAMPAIGN_OVERLAP otherwise)"
        side_effects:
          - "roll_changes_used frozen from the committed line sequence"
          - "campaign.version +1"

      - from: COMMITTED
        to: CLOSED
        trigger: "POST /mills/{millId}/campaigns/{campaignId}/close"
        actor: Scheduler
        preconditions:
          - "Campaign is COMMITTED"
          - "All Order rows whose grade/product_family are served by this campaign and that were allocated against it are INVOICED or CANCELLED (ERR_UNRESOLVED_ORDERS otherwise)"
        side_effects:
          - "campaign.version +1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /mills/{millId}/campaigns/{campaignId}/cancel"
        actor: Scheduler
        preconditions:
          - "Campaign is OPEN"
        side_effects:
          - "CampaignLines deleted (junction rows removed); heats unaffected"

  - entity: CustomerAccount
    initial_state: GOOD
    terminal_states: []
    note: "Two parallel state dimensions on one entity: credit_status (GOOD ↔ WATCH → BLOCKED, WATCH reachable back from BLOCKED) and allocation_priority (STANDARD ↔ STRATEGIC). Dimensions evolve independently via the same PATCH endpoint."
    transitions:
      - from: GOOD
        to: WATCH
        trigger: "PATCH /mills/{millId}/customer-accounts/{accountId} with credit_status WATCH"
        actor: AccountManager
        preconditions: ["credit_status is GOOD or BLOCKED"]
        side_effects: ["account.version +1"]
      - from: WATCH
        to: GOOD
        trigger: "PATCH .../customer-accounts/{accountId} with credit_status GOOD"
        actor: AccountManager
        preconditions: ["credit_status is WATCH"]
        side_effects: ["account.version +1"]
      - from: WATCH
        to: BLOCKED
        trigger: "PATCH .../customer-accounts/{accountId} with credit_status BLOCKED"
        actor: AccountManager
        preconditions: ["credit_status is WATCH"]
        side_effects: ["account.version +1"]
      - from: BLOCKED
        to: WATCH
        trigger: "PATCH .../customer-accounts/{accountId} with credit_status WATCH"
        actor: AccountManager
        preconditions: ["credit_status is BLOCKED"]
        side_effects: ["account.version +1"]
      - from: STANDARD
        to: STRATEGIC
        trigger: "PATCH .../customer-accounts/{accountId} with allocation_priority STRATEGIC"
        actor: AccountManager
        preconditions: ["allocation_priority is STANDARD"]
        side_effects: ["account.version +1"]
      - from: STRATEGIC
        to: STANDARD
        trigger: "PATCH .../customer-accounts/{accountId} with allocation_priority STANDARD"
        actor: AccountManager
        preconditions: ["allocation_priority is STRATEGIC"]
        side_effects: ["account.version +1"]

  - entity: Order
    initial_state: QUOTED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/confirm"
        actor: AccountManager
        preconditions:
          - "Order is QUOTED (ERR_INVALID_STATE otherwise)"
          - "Account.credit_status != BLOCKED (ERR_ACCOUNT_BLOCKED otherwise)"
          - "Mill.posture == NORMAL (order books freeze while interrupted) (ERR_MILL_INTERRUPTED otherwise)"
        side_effects:
          - "computed_price_cents := product_price with the account's pricing_mode variant; price_basis stamped"
          - "order.version +1"

      - from: CONFIRMED
        to: ALLOCATED
        trigger: "POST /mills/{millId}/allocation-runs (selector assigns cast-heat tonnage to this order; partial runs leave it CONFIRMED)"
        actor: Scheduler
        preconditions:
          - "Order is CONFIRMED"
          - "allocated_tons after the run >= tons"
        side_effects:
          - "allocated_tons increased by the run's assignment"
          - "order.version +1 on any allocation increment"

      - from: ALLOCATED
        to: INVOICED
        trigger: "POST /mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/invoice"
        actor: AccountManager
        preconditions:
          - "Order is ALLOCATED (ERR_INVALID_STATE otherwise)"
          - "Account.credit_status != BLOCKED"
        side_effects:
          - "SPOT accounts: computed_price_cents recomputed with CURRENT_MONTH_INDEX at the invoice month; CONTRACT accounts keep the CONFIRMED price"
          - "DivisionScorecard (mill, fulfillment_month): revenue_cents += computed_price_cents, profit fields recomputed if scorecard is OPEN"
          - "order.version +1"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/cancel"
        actor: AccountManager
        preconditions:
          - "Order is QUOTED or CONFIRMED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "order.version +1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/cancel"
        actor: AccountManager
        preconditions:
          - "Order is QUOTED, CONFIRMED, or ALLOCATED"
        side_effects:
          - "Any allocated tonnage released (allocated_tons := 0) — compensating action against division allocation"

      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/cancel"
        actor: AccountManager
        preconditions:
          - "Order is QUOTED, CONFIRMED, or ALLOCATED"
        side_effects:
          - "Any allocated tonnage released (allocated_tons := 0) — compensating action against division allocation"

  - entity: InterruptibleWindow
    initial_state: SCHEDULED
    terminal_states: [HONORED, LAPSED]
    transitions:
      - from: SCHEDULED
        to: HONORED
        trigger: "POST /mills/{millId}/interruptible-windows/{windowId}/honor"
        actor: EnergyDispatcher
        preconditions:
          - "Window is SCHEDULED (ERR_INVALID_STATE otherwise)"
          - "linked_event_id is set and that EnergyEvent is RELEASED (the mill actually rode out an event inside the window)"
        side_effects:
          - "DivisionScorecard (mill, window month): curtailment_credits_cents += curtailment_credit_cents; energy_cost_cents -= curtailment_credit_cents (floor 0); profit fields recomputed if scorecard OPEN"
          - "window.version +1"

      - from: SCHEDULED
        to: LAPSED
        trigger: "system (automatic when the logical clock passes end_at with no linked ACTIVE/RELEASED event)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EnergyEvent
    initial_state: DECLARED
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: "POST /mills/{millId}/energy-events/{eventId}/activate"
        actor: EnergyDispatcher
        preconditions:
          - "Event is DECLARED (ERR_INVALID_STATE otherwise)"
          - "No other EnergyEvent of this mill is ACTIVE (single-event posture invariant) (ERR_EVENT_OVERLAP otherwise)"
        side_effects:
          - "Mill.posture recomputed → INTERRUPTED"
          - "Every InterruptibleWindow of this mill in SCHEDULED whose [start_at, end_at] contains called_at: linked_event_id := this event (window link cascade)"
          - "event.version +1"

      - from: ACTIVE
        to: RELEASED
        trigger: "POST /mills/{millId}/energy-events/{eventId}/release"
        actor: EnergyDispatcher
        preconditions:
          - "Event is ACTIVE"
        side_effects:
          - "Mill.posture recomputed (NORMAL unless another ACTIVE event or containing window)"
          - "Heats of this mill in CHARGED or MELTDOWN_LOCKED that are NOT waiver-covered → ABORTED, with the abort compensating release to scrap lots (interruption cascade depth 3: event release → heat abort → lot restore)"
          - "event.version +1"

      - from: DECLARED
        to: EXPIRED
        trigger: "system (automatic when the logical clock passes released_at without activation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DivisionScorecard
    initial_state: OPEN
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /mills/{millId}/division-scorecards/{scorecardId}/close"
        actor: PlantManager
        preconditions:
          - "Scorecard is OPEN (ERR_INVALID_STATE otherwise)"
          - "headcount is set (input captured at close payload) and > 0"
        side_effects:
          - "profit_cents, profit_pool_cents, distribution_per_employee_cents, remainder_cents frozen per profit_sharing calculation"
          - "scorecard.version +1"

      - from: CLOSED
        to: DISTRIBUTED
        trigger: "POST /mills/{millId}/division-scorecards/{scorecardId}/distribute"
        actor: PlantManager
        preconditions:
          - "Scorecard is CLOSED"
        side_effects:
          - "Distribution recorded; remainder_cents retained by the division (documented, not reallocated)"
          - "scorecard.version +1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:

  - rule_id: order-confirm-stale-order
    parent_entity: Order
    write_endpoint: "POST /mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/confirm"
    occ_field: "expected_order_version"
    description: |
      Confirming an Order whose version has advanced since the client last
      observed it is rejected. Under the order-book rules a confirm reprices
      the order; a second confirm issued against a stale view of the order
      would silently double-stamp price_basis, so the stale write is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: campaign-commit-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /mills/{millId}/campaigns/{campaignId}/commit"
    occ_field: "expected_campaign_version"
    description: |
      Committing a Campaign whose version has advanced since the client last
      observed it (e.g., because a CampaignLine was added after the client's
      last read, changing roll_changes_used) is rejected as a stale write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: blend_feasibility
    trigger: "on POST /heats/{heatId}/charges (each charge line apply) and on GET /heats/{heatId}/charge-preview"
    algorithm: weighted_scoring
    formula: |
      Let lines = all HeatChargeLines of the heat including the candidate line.
      T = sum(lines.tons)                                   # total charged dry tons
      cu_blend = sum(lines.tons * lot.cu_pct) / T
      mn_blend = sum(lines.tons * lot.mn_pct) / T
      feasible = (cu_blend <= Grade.cu_max_pct) AND (mn_blend >= Grade.mn_min_pct)
      If NOT feasible → reject the candidate line with ERR_BLEND_INFEASIBLE.
      Note: mn upper bound is enforced at the MeltdownSheet (lab measurement),
      not at blend time — blend feasibility is a floor check on Mn and a
      ceiling check on Cu only.
    input_set: "HeatChargeLines of this heat (any count >= 1), each joined to its ScrapLot chemistry"
    constants:
      CU_LOT_CAP: 0.005
      MN_LOT_CAP: 0.02
    precision: "6 decimal places internal, round_half_up"

  - name: charge_cost
    trigger: "on Heat TAPPED (freeze) — line_cost_cents computed per line at apply time"
    algorithm: aggregation
    formula: |
      Per line at apply time:
        If contract.contract_type == FIXED:
          unit = contract.contract_price_cents
        Else (INDEXED):
          month = lot.received_on[0:7]                        # receipt month, YYYY-MM
          idx = PUBLISHED SurchargeIndex for (mill, contract.grade_category, month)
          unit = idx.price_per_ton_cents                    # ERR_INDEX_MISSING if none
        line_cost_cents = round_half_up(unit * line.tons)   # round per line
      At TAPPED:
        charge_cost_cents = sum over lines of line_cost_cents
      Rounding order pinned: round each line first, then sum. The reverse
      order (sum exact values, then round) is the WRONG variant and produces
      different cents when line tonnages are fractional.
    input_set: "all HeatChargeLines of the heat"
    constants: {}
    precision: "integer cents per line (round_half_up), integer cents total"

  - name: product_price
    trigger: "Order confirm (both variants) and Order invoice (SPOT re-price)"
    algorithm: tiered_pricing
    formula: |
      surcharge(order) :=
        idx = PUBLISHED SurchargeIndex for (mill, grade_category of the order's
              ScrapLot pool is not used — pricing indexes on the ordered
              grade's dominant scrap category: Grade.product_form BILLET→SHREDDED,
              BLOOM→BUSHLING, SLAB→HMS), for the variant's index month
        RETURN idx.price_per_ton_cents                      # ERR_INDEX_MISSING if none

      CONTRACT variant (at CONFIRMED):
        index_month = order.fulfillment_month
        unit = base_price_cents_per_ton + surcharge(order, index_month)
        computed_price_cents = round_half_up(unit * order.tons)
        price_basis = CONTRACT_MONTH_INDEX

      SPOT variant (at CONFIRMED and re-priced at INVOICED):
        index_month = calendar month of the logical clock at the call
        unit = base_price_cents_per_ton + surcharge(order, index_month)
        computed_price_cents = round_half_up(unit * order.tons)
        price_basis = CURRENT_MONTH_INDEX
      Same order data, different month selection → different price whenever
      the index moved between fulfillment month and current month.
    input_set: "the order, its grade, the mill's PUBLISHED SurchargeIndex rows"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: contract_month_index
        when: "account.pricing_mode == CONTRACT, at CONFIRMED (locked forever after)"
        difference: "index month = order.fulfillment_month; invoice does NOT re-price"
      - name: current_month_index
        when: "account.pricing_mode == SPOT, at CONFIRMED and again at INVOICED"
        difference: "index month = logical-clock month of the call; the invoice value supersedes the confirm value"

  - name: scrap_surcharge_credit
    trigger: "Heat CHARGED → MELTDOWN_LOCKED (on MeltdownSheet confirm)"
    algorithm: threshold
    formula: |
      BENCH = BENCHMARK_CENTS_PER_TON                       # 40000
      T = sum(charge lines tons)
      bench_value = T * BENCH
      actual_value = sum over lines of (line unit price * line tons)  # exact, pre-rounding
      scrap_surcharge_credit_cents = round_half_up(actual_value - bench_value)
      Sign convention: positive = mix ran above benchmark (surcharge owed to
      the blend), negative = mix ran below benchmark (credit). Both signs are
      valid outputs.
    input_set: "HeatChargeLines of the heat at MELTDOWN_LOCKED"
    constants:
      BENCHMARK_CENTS_PER_TON: 40000
    precision: "integer cents, round_half_up"

  - name: roll_changes_used
    trigger: "Campaign commit (freeze) and CampaignLine add/remove (recompute)"
    algorithm: chronological
    formula: |
      Order the campaign's CampaignLines by (heat.planned_tap_at ASC,
      heat.created_at ASC) — never by any id.
      roll_changes_used = count of adjacent line pairs whose group differs,
      where g(line) = the heat's Grade.grade_group (retrieved via
      line.heat_id -> Heat.grade_id -> Grade). The campaign's own grade_group
      is the expected group; a line whose heat grade's group differs from the
      campaign's group is still allowed, and each group transition in the
      ordered sequence counts as one roll change.
      count = 0
      prev = group of first line
      for each subsequent line: if group(line) != prev: count += 1; prev = group(line)
    input_set: "CampaignLines of the campaign (junction rows), joined to heats and grades"
    constants: {}
    precision: "integer"

  - name: campaign_window_conflict
    trigger: "Campaign commit"
    algorithm: interval_merge
    formula: |
      For the candidate campaign C (same mill, same product_family):
        for each other COMMITTED campaign K:
          overlap iff C.planned_start < K.planned_end AND K.planned_start < C.planned_end
          (strict inequalities: half-open semantics, touching endpoints allowed)
      Any overlap → ERR_CAMPAIGN_OVERLAP.
      Distinct semantics vs EnergyEvent: events forbid ADJACENCY (gap >= 15 min
      required between released_at and the next called_at), campaigns ALLOW
      adjacency (end == start is fine).
    input_set: "COMMITTED campaigns of the same mill and product_family"
    constants:
      EVENT_MIN_GAP_MINUTES: 15
    precision: "minute granularity"

  - name: settlement_amount
    trigger: "ProcurementContract close or default"
    algorithm: waterfall_allocation
    formula: |
      FIXED variant (forward-looking flat):
        settlement_amount_cents = round_half_up(contract_price_cents * settlement_tons)
        (uses the contract price for every settled ton regardless of receipt month)
      INDEXED variant (chronological FIFO over lots):
        lots sorted by (received_on ASC, lot.created_at ASC) — never by id
        remaining = settlement_tons
        amount = 0
        for lot in lots:
          take = min(lot.dry_tons, remaining)
          month = lot.received_on[0:7]
          unit = PUBLISHED SurchargeIndex price for (mill, contract.grade_category, month)
          amount += round_half_up(unit * take)              # round per lot, then sum
          remaining -= take
          if remaining == 0: break
        settlement_amount_cents = amount
      Same received tonnage, two variants → different amounts whenever index
      prices differ across receipt months or from the fixed price.
    input_set: "ScrapLots of the contract in status RECEIVED, PARTIALLY_CONSUMED, or CONSUMED"
    constants: {}
    precision: "integer cents per lot (round_half_up), integer cents total"
    variants:
      - name: fixed_flat
        when: "contract.contract_type == FIXED"
        difference: "single flat price for all settled tons; ignores receipt-month indices"
      - name: indexed_fifo
        when: "contract.contract_type == INDEXED"
        difference: "per-lot index price of the receipt month, consumed oldest-first"

  - name: profit_sharing
    trigger: "DivisionScorecard close"
    algorithm: waterfall_allocation
    formula: |
      profit_cents = revenue_cents - material_cost_cents - energy_cost_cents
      profit_pool_cents = max(0, profit_cents) * PROFIT_SHARE_RATE   # 0.10
        — floor at zero: a loss-making month distributes nothing and the
        loss does NOT create a negative pool.
      distribution_per_employee_cents = floor(profit_pool_cents / headcount)
      remainder_cents = profit_pool_cents - distribution_per_employee_cents * headcount
      remainder_cents is retained by the division (never distributed).
    input_set: "the scorecard's accumulated fields at close"
    constants:
      PROFIT_SHARE_RATE: 0.10
    precision: "integer cents; floor division for per-employee share"

  - name: energy_compliance
    trigger: "MillTestReport issue (per heat with requires_energy_certified grade)"
    algorithm: threshold
    formula: |
      Let intervals = EnergyIntervals of the heat (append-only log).
      energy_certified = (count of intervals with posture_at_interval == INTERRUPTED) == 0
      Boundary pinned: exactly zero interrupted intervals is required; one or
      more fails certification. A heat with zero recorded intervals at all is
      energy_certified (vacuous truth), but MTR issue still requires at least
      one interval for CERTIFIED-grade heats (see validations).
    input_set: "EnergyIntervals of the heat"
    constants: {}
    precision: "boolean"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Request body is well-formed, required fields present, enum values in declared sets, numeric ranges respected (moisture_pct <= 0.30, tons > 0, dates ordered)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Path resources exist, validated left-to-right (mill → contract/lot/heat/campaign/account/order/...); body FKs (grade_id, heat_id, scrap_lot_id, scope_id) exist"
    error_id: "ERR_MILL_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_HEAT_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_GRADE_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_SCORECARD_NOT_FOUND | ERR_SHEET_NOT_FOUND | ERR_INDEX_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path or body references

  - priority: 5
    category: state
    check: "Target entity is in a valid source state for the transition (per §1.2 preconditions; terminal states reject all further transitions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version, when present on an OCC-guarded endpoint, equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../orders/{orderId}/confirm, POST .../campaigns/{campaignId}/commit"

  - priority: 7
    category: business_temporal
    check: "Mill.posture == NORMAL for posture-gated operations (charge apply, tap, order confirm), unless the heat carries a covering PowerInterruptionWaiver"
    error_id: ERR_MILL_INTERRUPTED
    http_status: 409
    applies_to: "POST .../heats/{heatId}/charges, POST .../heats/{heatId}/tap, POST .../orders/{orderId}/confirm"

  - priority: 8
    category: business_safety
    check: "Blend feasibility: candidate charge line keeps cu_blend <= Grade.cu_max_pct and mn_blend >= Grade.mn_min_pct"
    error_id: ERR_BLEND_INFEASIBLE
    http_status: 422
    applies_to: "POST .../heats/{heatId}/charges"

  - priority: 9
    category: business_safety
    check: "MeltdownSheet confirm requires chem_ok == true (lab chemistry inside grade band)"
    error_id: ERR_CHEMISTRY_OUT_OF_SPEC
    http_status: 422
    applies_to: "POST .../meltdown-sheets/{sheetId}/confirm"

  - priority: 10
    category: business_safety
    check: "MTR issue requires the heat's MeltdownSheet CONFIRMED, heat CAST, and for CERTIFIED grades at least one EnergyInterval with zero INTERRUPTED intervals"
    error_id: ERR_MTR_NOT_ISSUABLE
    http_status: 409
    applies_to: "POST .../heats/{heatId}/mill-test-reports"

  - priority: 11
    category: business_referential
    check: "INDEXED contracts forbid contract_price_cents; FIXED contracts require it"
    error_id: ERR_CONTRACT_PRICE_FORBIDDEN
    http_status: 422
    applies_to: "POST .../procurement-contracts"

  - priority: 12
    category: business_referential
    check: "Charge line lot belongs to an OPEN contract and lot has remaining_tons >= requested tons"
    error_id: "ERR_CONTRACT_NOT_OPEN | ERR_LOT_DEPLETED"
    http_status: 409
    applies_to: "POST .../heats/{heatId}/charges"

  - priority: 13
    category: business_temporal
    check: "Heat sequencing grid: no two non-terminal heats of a mill within +/- 45 minutes planned_tap_at"
    error_id: ERR_HEAT_SEQUENCE_CONFLICT
    http_status: 409
    applies_to: "POST /mills/{millId}/heats, POST .../heats/{heatId}/charges"

  - priority: 14
    category: business_temporal
    check: "Campaign commit window: half-open overlap against COMMITTED same-family campaigns; line heats' planned_tap_at inside [planned_start, planned_end]"
    error_id: "ERR_CAMPAIGN_OVERLAP | ERR_CAMPAIGN_WINDOW_VIOLATION"
    http_status: 409
    applies_to: "POST .../campaigns/{campaignId}/commit"

  - priority: 15
    category: business_temporal
    check: "EnergyEvent activation: no other ACTIVE event for the mill AND at least 15 minutes between the previous event's released_at and this event's called_at (adjacency forbidden)"
    error_id: ERR_EVENT_OVERLAP
    http_status: 409
    applies_to: "POST .../energy-events/{eventId}/activate"

  - priority: 16
    category: business_constraint
    check: "Campaign roll-change budget: recomputed roll_changes_used <= roll_change_budget"
    error_id: ERR_ROLL_CHANGE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST .../campaigns/{campaignId}/commit"

  - priority: 17
    category: business_fiscal
    check: "Order confirm/invoice requires account.credit_status != BLOCKED"
    error_id: ERR_ACCOUNT_BLOCKED
    http_status: 402
    applies_to: "POST .../orders/{orderId}/confirm, POST .../orders/{orderId}/invoice"

  - priority: 18
    category: business_fiscal
    check: "INDEXED pricing/settlement requires a PUBLISHED SurchargeIndex for the resolved (grade_category, month)"
    error_id: ERR_INDEX_MISSING
    http_status: 422
    applies_to: "POST .../heats/{heatId}/charges, POST .../procurement-contracts/{id}/close, POST .../orders/{id}/confirm, POST .../orders/{id}/invoice"

  - priority: 19
    category: business_fiscal
    check: "Contract close requires received_tons >= 0.80 * committed_tons"
    error_id: ERR_UNDER_DELIVERED
    http_status: 422
    applies_to: "POST .../procurement-contracts/{contractId}/close"

  - priority: 20
    category: business_constraint
    check: "Waiver uniqueness: at most one waiver per (scope, scope_id) — HEAT waivers: one per heat; EVENT waivers: one per event"
    error_id: ERR_WAIVER_DUPLICATE
    http_status: 409
    applies_to: "POST .../power-waivers"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (fixed startup default; never falls back to wall-clock). Time-gated behavior (window lapse, event expiry, index month resolution) reads this clock."
    roles: [PlantManager]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["InterruptibleWindows whose end_at passed with no linked event → LAPSED", "EnergyEvents DECLARED whose released_at passed → EXPIRED", "Mill.posture recomputed"]

  # --- Mill ---
  - method: POST
    path: "/mills"
    description: "Create a mill (division)"
    roles: [PlantManager]
    code: 201
    input: [name, division, furnace_capacity_tons, caster_rate_tph]
    output: Mill
    side_effects: ["posture = NORMAL"]

  - method: GET
    path: "/mills"
    description: "List mills"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: "Mill[]"
    side_effects: []

  - method: GET
    path: "/mills/{millId}"
    description: "Get a mill (posture computed on read)"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: Mill
    side_effects: []

  # --- SurchargeIndex ---
  - method: POST
    path: "/mills/{millId}/surcharge-indices"
    description: "Publish an index price for a grade category and month; supersedes any prior PUBLISHED row for the same key"
    roles: [PlantManager]
    code: 201
    input: [grade_category, effective_month, price_per_ton_cents]
    output: SurchargeIndex
    side_effects: ["prior PUBLISHED row for (mill, grade_category, effective_month) → SUPERSEDED"]

  - method: GET
    path: "/mills/{millId}/surcharge-indices"
    description: "List index rows (filterable)"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["grade_category?", "effective_month?", "status?", "limit?", "offset?", "mill_id?"]
    output: "SurchargeIndex[]"
    side_effects: []

  # --- ProcurementContract ---
  - method: POST
    path: "/mills/{millId}/procurement-contracts"
    description: "Create a scrap/DRI procurement contract"
    roles: [ProcurementOfficer]
    code: 201
    input: [supplier_name, grade_category, contract_type, "contract_price_cents?", committed_tons]
    output: ProcurementContract
    side_effects: ["status = OPEN", "received_tons = 0"]

  - method: GET
    path: "/mills/{millId}/procurement-contracts"
    description: "List contracts"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["status?", "grade_category?", "limit?", "offset?", "mill_id?"]
    output: "ProcurementContract[]"
    side_effects: []

  - method: GET
    path: "/mills/{millId}/procurement-contracts/{contractId}"
    description: "Get a contract"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: ProcurementContract
    side_effects: []

  - method: POST
    path: "/mills/{millId}/procurement-contracts/{contractId}/close"
    description: "Close a contract and settle tonnage (variant rule: FIXED flat vs INDEXED FIFO)"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: ProcurementContract
    side_effects: ["settlement fields computed per settlement_amount", "status → CLOSED", "increments ProcurementContract.version by 1"]

  - method: POST
    path: "/mills/{millId}/procurement-contracts/{contractId}/default"
    description: "Declare supplier default after the settlement window elapses"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: ProcurementContract
    side_effects: ["settlement over received lots only", "status → DEFAULTED", "lot pool frozen", "increments ProcurementContract.version by 1"]

  # --- ScrapLot ---
  - method: POST
    path: "/mills/{millId}/procurement-contracts/{contractId}/scrap-lots"
    description: "Record a scrap/DRI receipt against a contract"
    roles: [ProcurementOfficer]
    code: 201
    input: [received_on, tons_received, "moisture_pct?", cu_pct, mn_pct]
    output: ScrapLot
    side_effects: ["dry_tons computed", "remaining_tons := dry_tons", "contract.received_tons += tons_received"]

  - method: GET
    path: "/mills/{millId}/procurement-contracts/{contractId}/scrap-lots"
    description: "List lots of a contract"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["status?", "limit?", "offset?", "contract_id?"]
    output: "ScrapLot[]"
    side_effects: []

  - method: GET
    path: "/mills/{millId}/scrap-lots"
    description: "List all lots received at this mill across contracts"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["mill_id?", "status?", "limit?", "offset?"]
    output: "ScrapLot[]"
    side_effects: []

  - method: GET
    path: "/mills/{millId}/scrap-lots/by-id/{lotId}"
    description: "Get a lot (flat read by id)"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: ScrapLot
    side_effects: []

  # --- Grade ---
  - method: POST
    path: "/mills/{millId}/grades"
    description: "Create a grade in the mill catalog"
    roles: [Metallurgist, PlantManager]
    code: 201
    input: [grade_code, product_form, grade_group, certification_class, cu_max_pct, mn_min_pct, mn_max_pct, requires_energy_certified]
    output: Grade
    side_effects: []

  - method: GET
    path: "/mills/{millId}/grades/by-id/{gradeId}"
    description: "Get a grade"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: Grade
    side_effects: []

  - method: GET
    path: "/mills/{millId}/surcharge-indices/by-id/{indexId}"
    description: "Get an index row"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: SurchargeIndex
    side_effects: []

  - method: GET
    path: "/mills/{millId}/interruptible-windows/by-id/{windowId}"
    description: "Get an interruptible window"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: InterruptibleWindow
    side_effects: []

  - method: GET
    path: "/mills/{millId}/energy-events/by-id/{eventId}"
    description: "Get an energy event"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: EnergyEvent
    side_effects: []

  - method: GET
    path: "/mills/{millId}/power-waivers/by-id/{waiverId}"
    description: "Get a waiver"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: PowerInterruptionWaiver
    side_effects: []

  - method: GET
    path: "/mills/{millId}/grades"
    description: "List grades"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["product_form?", "certification_class?", "limit?", "offset?", "mill_id?"]
    output: "Grade[]"
    side_effects: []

  # --- Heat ---
  - method: POST
    path: "/mills/{millId}/heats"
    description: "Create a heat (PLANNED)"
    roles: [MillOperator]
    code: 201
    input: [heat_number, grade_id, target_tap_weight_tons, planned_tap_at]
    output: Heat
    side_effects: ["status = PLANNED", "furnace grid conflict check (priority 13)"]

  - method: GET
    path: "/mills/{millId}/heats"
    description: "List heats"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["status?", "grade_id?", "limit?", "offset?", "mill_id?"]
    output: "Heat[]"
    side_effects: []

  - method: GET
    path: "/mills/{millId}/heats/{heatId}"
    description: "Get a heat"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: Heat
    side_effects: []

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/charges"
    description: "Apply a scrap-lot draw to the heat's charge mix"
    roles: [MillOperator]
    code: 201
    input: [scrap_lot_id, tons]
    output: HeatChargeLine
    side_effects: ["line_cost_cents computed (per-line rounding)", "lot remaining_tons/status updated", "heat → CHARGED on first line", "blend feasibility checked"]

  - method: GET
    path: "/mills/{millId}/heats/{heatId}/charges"
    description: "List charge lines of a heat"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["limit?", "offset?", "heat_id?", "scrap_lot_id?"]
    output: "HeatChargeLine[]"
    side_effects: []

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/meltdown-sheets"
    description: "Create the heat's meltdown sheet (RECORDED)"
    roles: [Metallurgist]
    code: 201
    input: [cu_pct, mn_pct]
    output: MeltdownSheet
    side_effects: ["revision_no = 1", "chem_ok computed"]

  - method: GET
    path: "/mills/{millId}/heats/{heatId}/meltdown-sheets"
    description: "List meltdown sheets of a heat (0 or 1 rows)"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["heat_id?"]
    output: "MeltdownSheet[]"
    side_effects: []

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/revise"
    description: "Record a revised chemistry sample (cyclic RECORDED ↔ REVISED)"
    roles: [Metallurgist]
    code: 200
    input: [cu_pct, mn_pct]
    output: MeltdownSheet
    side_effects: ["revision_no += 1", "chem_ok recomputed", "increments MeltdownSheet.version by 1"]

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/confirm"
    description: "Confirm the sheet; cascades Heat → MELTDOWN_LOCKED"
    roles: [Metallurgist]
    code: 200
    input: []
    output: MeltdownSheet
    side_effects: ["Heat → MELTDOWN_LOCKED", "scrap_surcharge_credit_cents computed on the heat"]

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/reject"
    description: "Reject the sheet (terminal for the sheet; heat stays CHARGED)"
    roles: [Metallurgist]
    code: 200
    input: []
    output: MeltdownSheet
    side_effects: []

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/tap"
    description: "Tap the heat; freezes charge_cost_cents"
    roles: [MillOperator]
    code: 200
    input: []
    output: Heat
    side_effects: ["charge_cost_cents frozen", "posture/waiver gate enforced"]

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/cast"
    description: "Cast the heat into billets/blooms/slabs"
    roles: [MillOperator]
    code: 200
    input: []
    output: Heat
    side_effects: ["DivisionScorecard material_cost_cents += charge_cost_cents (month of planned_tap_at, if OPEN)"]

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/abort"
    description: "Abort a pre-cast heat; compensating release of charged tonnage to lots"
    roles: [MillOperator]
    code: 200
    input: []
    output: Heat
    side_effects: ["charge tons credited back to lots", "lot statuses recomputed", "non-confirmed sheet → REJECTED"]

  - method: GET
    path: "/mills/{millId}/heats/{heatId}/energy-intervals"
    description: "List recorded energy intervals of a heat"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["limit?", "offset?", "heat_id?"]
    output: "EnergyInterval[]"
    side_effects: []

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/energy-intervals"
    description: "Append a metering interval; snapshots mill posture"
    roles: [MillOperator, EnergyDispatcher]
    code: 201
    input: [interval_start, interval_end, kwh]
    output: EnergyInterval
    side_effects: ["posture_at_interval := mill posture at record time", "heat.energy_kwh += kwh"]

  - method: POST
    path: "/mills/{millId}/heats/{heatId}/mill-test-reports"
    description: "Issue a mill test report certifying the heat against an order"
    roles: [QualityEngineer]
    code: 201
    input: [order_id]
    output: MillTestReport
    side_effects: ["chemistry_snapshot copied from CONFIRMED sheet", "energy_certified computed", "report_no minted"]

  - method: GET
    path: "/mills/{millId}/heats/{heatId}/mill-test-reports"
    description: "List MTRs of a heat"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["limit?", "offset?", "heat_id?", "order_id?"]
    output: "MillTestReport[]"
    side_effects: []

  # --- Campaign ---
  - method: POST
    path: "/mills/{millId}/campaigns"
    description: "Create a rolling campaign (OPEN)"
    roles: [Scheduler]
    code: 201
    input: [name, product_family, grade_group, planned_start, planned_end, roll_change_budget]
    output: Campaign
    side_effects: ["status = OPEN", "roll_changes_used = 0"]

  - method: GET
    path: "/mills/{millId}/campaigns"
    description: "List campaigns"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["status?", "product_family?", "limit?", "offset?", "mill_id?"]
    output: "Campaign[]"
    side_effects: []

  - method: GET
    path: "/mills/{millId}/campaigns/{campaignId}"
    description: "Get a campaign"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: POST
    path: "/mills/{millId}/campaigns/{campaignId}/lines"
    description: "Add a CAST heat to the campaign"
    roles: [Scheduler]
    code: 201
    input: [heat_id]
    output: CampaignLine
    side_effects: ["campaign_grade_group snapshot", "campaign.roll_changes_used recomputed", "requires campaign OPEN"]

  - method: GET
    path: "/mills/{millId}/campaigns/{campaignId}/lines"
    description: "List campaign lines"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["limit?", "offset?", "campaign_id?", "heat_id?"]
    output: "CampaignLine[]"
    side_effects: []

  - method: POST
    path: "/mills/{millId}/campaigns/{campaignId}/commit"
    description: "Commit the campaign (OCC-guarded); freezes roll_changes_used"
    roles: [Scheduler]
    code: 200
    input: [expected_campaign_version]
    output: Campaign
    side_effects: ["window/overlap/budget checks", "status → COMMITTED", "increments Campaign.version by 1"]

  - method: POST
    path: "/mills/{millId}/campaigns/{campaignId}/close"
    description: "Close a committed campaign once served orders resolve"
    roles: [Scheduler]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status → CLOSED"]

  - method: POST
    path: "/mills/{millId}/campaigns/{campaignId}/cancel"
    description: "Cancel an OPEN campaign; junction lines deleted"
    roles: [Scheduler]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status → CANCELLED", "CampaignLines deleted"]

  # --- CustomerAccount ---
  - method: POST
    path: "/mills/{millId}/customer-accounts"
    description: "Open a customer account"
    roles: [AccountManager]
    code: 201
    input: [name, market, pricing_mode]
    output: CustomerAccount
    side_effects: ["credit_status = GOOD", "allocation_priority = STANDARD"]

  - method: GET
    path: "/mills/{millId}/customer-accounts"
    description: "List accounts"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["market?", "credit_status?", "limit?", "offset?", "mill_id?"]
    output: "CustomerAccount[]"
    side_effects: []

  - method: GET
    path: "/mills/{millId}/customer-accounts/{accountId}"
    description: "Get an account"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  - method: PATCH
    path: "/mills/{millId}/customer-accounts/{accountId}"
    description: "Update the parallel state dimensions (credit_status and/or allocation_priority)"
    roles: [AccountManager]
    code: 200
    input: ["credit_status?", "allocation_priority?"]
    output: CustomerAccount
    side_effects: ["per-dimension transition rules", "increments CustomerAccount.version by 1"]

  # --- Order ---
  - method: POST
    path: "/mills/{millId}/customer-accounts/{accountId}/orders"
    description: "Create an order (QUOTED)"
    roles: [AccountManager]
    code: 201
    input: [product_family, grade_id, tons, fulfillment_month, base_price_cents_per_ton]
    output: Order
    side_effects: ["status = QUOTED", "allocated_tons = 0"]

  - method: GET
    path: "/mills/{millId}/customer-accounts/{accountId}/orders"
    description: "List orders of an account"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["status?", "limit?", "offset?", "account_id?", "mill_id?", "grade_id?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/mills/{millId}/orders/{orderId}"
    description: "Get an order (flat read by id)"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/confirm"
    description: "Confirm an order (OCC-guarded); stamps price per account pricing_mode"
    roles: [AccountManager]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["computed_price_cents per product_price variant", "price_basis stamped", "increments Order.version by 1"]

  - method: POST
    path: "/mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/invoice"
    description: "Invoice an allocated order; SPOT orders re-price at the invoice month"
    roles: [AccountManager]
    code: 200
    input: []
    output: Order
    side_effects: ["SPOT: computed_price_cents recomputed (CURRENT_MONTH_INDEX)", "DivisionScorecard revenue_cents += computed_price_cents if OPEN", "status → INVOICED"]

  - method: POST
    path: "/mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/cancel"
    description: "Cancel a QUOTED, CONFIRMED, or ALLOCATED order; releases allocated tonnage"
    roles: [AccountManager]
    code: 200
    input: []
    output: Order
    side_effects: ["allocated_tons := 0 (compensating release)", "status → CANCELLED"]

  # --- Allocation ---
  - method: POST
    path: "/mills/{millId}/allocation-runs"
    description: "Run division allocation: assign CAST heat tonnage not yet committed to any campaign (heats in CAST with no CampaignLine) to CONFIRMED orders whose account.credit_status != BLOCKED. Selector: eligible orders are CONFIRMED with allocated_tons < tons and account not BLOCKED, ranked by (account allocation_priority STRATEGIC first, then order.created_at ASC); tonnage assigned from eligible heats ranked by (planned_tap_at ASC, created_at ASC). Empty pool → no-op run with zero assignments. Ties never break on id."
    roles: [Scheduler]
    code: 200
    input: []
    output: { assigned_orders: integer, assigned_tons: number }
    side_effects: ["orders reaching allocated_tons >= tons → ALLOCATED", "allocated_tons incremented on partial assignments"]

  # --- Energy ---
  - method: POST
    path: "/mills/{millId}/interruptible-windows"
    description: "Register an interruptible power window"
    roles: [EnergyDispatcher]
    code: 201
    input: [label, start_at, end_at, curtailment_credit_cents]
    output: InterruptibleWindow
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/mills/{millId}/interruptible-windows"
    description: "List interruptible windows"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["status?", "limit?", "offset?", "mill_id?", "linked_event_id?"]
    output: "InterruptibleWindow[]"
    side_effects: []

  - method: POST
    path: "/mills/{millId}/interruptible-windows/{windowId}/honor"
    description: "Honor a window after its linked event was released; books the curtailment credit"
    roles: [EnergyDispatcher]
    code: 200
    input: []
    output: InterruptibleWindow
    side_effects: ["DivisionScorecard credits/energy fields recomputed if OPEN", "status → HONORED"]

  - method: POST
    path: "/mills/{millId}/energy-events"
    description: "Declare a grid curtailment event"
    roles: [EnergyDispatcher]
    code: 201
    input: [grid_operator, called_at, released_at]
    output: EnergyEvent
    side_effects: ["status = DECLARED"]

  - method: GET
    path: "/mills/{millId}/energy-events"
    description: "List energy events"
    roles: [PlantManager, MillOperator, Scheduler, Metallurgist, ProcurementOfficer, AccountManager, QualityEngineer, EnergyDispatcher]
    code: 200
    input: ["status?", "limit?", "offset?", "mill_id?"]
    output: "EnergyEvent[]"
    side_effects: []

  - method: POST
    path: "/mills/{millId}/energy-events/{eventId}/activate"
    description: "Activate a declared event; mill posture becomes INTERRUPTED and containing windows link"
    roles: [EnergyDispatcher]
    code: 200
    input: []
    output: EnergyEvent
    side_effects: ["Mill.posture → INTERRUPTED", "containing SCHEDULED windows link linked_event_id", "adjacency gap check (15 min)"]

  - method: POST
    path: "/mills/{millId}/energy-events/{eventId}/release"
    description: "Release an active event; non-waivered in-flight heats abort (depth-3 cascade)"
    roles: [EnergyDispatcher]
    code: 200
    input: []
    output: EnergyEvent
    side_effects: ["Mill.posture recomputed", "non-waivered CHARGED/MELTDOWN_LOCKED heats → ABORTED with lot release", "status → RELEASED"]

  - method: POST
    path: "/mills/{millId}/power-waivers"
    description: "Grant a polymorphic interruption waiver (scope HEAT → heat id; scope EVENT → energy event id)"
    roles: [EnergyDispatcher]
    code: 201
    input: [scope, scope_id, reason]
    output: PowerInterruptionWaiver
    side_effects: ["EVENT scope: target event.waiver_count += 1"]

  - method: GET
