            - { call: "POST /api/sessions", payload: { event_id: "${ev}", name: "Sat AM", starts_at: "2026-09-05T08:00:00Z", ends_at: "2026-09-05T12:00:00Z", capacity: 50 }, as: EventDirector, captures: { se: $.data.id } }
            - { call: "POST /api/ticket-orders", payload: { session_id: "${se}", quantity: 2 }, as: Spectator, as_user_id: "spec-1", captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:15:01Z" }, as: EventDirector }
            - { call: "POST /api/ticket-orders/${o1}/pay", payload: {}, as: Spectator, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /api/events/${ev}/checkpoint", payload: {}, as: EventDirector, captures: { exp: "$.data.expired_order_count" } }
            - { call: "GET /api/sessions/${se}", payload: {}, as: EventDirector, captures: { held: "$.data.seats_held", avail: "$.data.seats_available" } }
          assert:
            - "pay at hold_expires_at + 1s -> ERR_ORDER_HOLD_EXPIRED 422; order remains HELD until swept"
            - "checkpoint returns expired_order_count == 1; order status becomes EXPIRED"
            - "session: seats_held == 0, seats_available == 50 (seats restored)"

