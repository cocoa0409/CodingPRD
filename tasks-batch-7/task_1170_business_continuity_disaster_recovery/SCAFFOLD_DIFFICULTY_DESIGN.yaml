        grounds:
          - state_machines.Exercise.IN_PROGRESS_to_COMPLETED
          - state_machines.RecoveryCapability.UNPROVEN_to_GAP_IDENTIFIED
          - calculations.validation_run_result
        distinguishing_aspect: |
          Depth-3 causal chain: exercise COMPLETE creates a ValidationRun
          (link 1); the run's computed GAP_IDENTIFIED result flips the
          RecoveryCapability to GAP_IDENTIFIED (link 2); that flip auto-
          creates a Gap row (link 3) — each link caused by the previous
          mutation, not by the original call, unlike the BIA supersede chain.
        test_recipe:
          setup:
            - "Contacts C1 (author), C2 (officer/committee) exist; clock 2026-06-01"
            - "Process P ACTIVE with APPROVED BIA rto 4 / rpo 1 and APPROVED Plan rto 4 / rpo 1"
