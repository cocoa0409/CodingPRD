        distinguishing_aspect: "PUBLISH executes every declared side effect: bundle_version 1, published_at_utc set to the clock, snapshot_item_ids holding only the slot's category items, price_snapshot pricing Item A at 559 for ZONE_A, matching checksums with stale_flag false, and StoreCluster.published_bundle_version raised to 1."
