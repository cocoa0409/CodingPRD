  # ============================================================ cross-cutting complexity layers
  - section: cross_cutting
    instances:
      - name: occ_publish_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[card-publish-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Line mutations bump card.version: a client holding version 2 publishes after a second line add (version 3) and is rejected with ERR_STALE_VERSION (412); re-reading and retrying with the fresh version succeeds."
        test_recipe:
          setup: ["surgeon S; items A, B; DRAFT card with one line (version now 2); client captured version 2"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Occ", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "SUTURE-KIT", name: "Suture kit", unit_cost_cents: 1000, substitute_group: "SUTURE", initial_on_hand: 50 }, as: SupplyChainAnalyst, captures: { item_b: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v_stale: "$.data.version" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_b}", quantity: 1, designation: "HOLD", pick_sequence: 2 }, as: SupplyChainAnalyst }
          trigger:
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v_stale}" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v_fresh: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v_fresh}" }, as: SupplyChainAnalyst, captures: { ok_status: "$.data.status" } }
          assert:
            - "${err} == ERR_STALE_VERSION (http 412) — captured version is behind by one line add"
            - "retry with the re-read version succeeds: ${ok_status} == ACTIVE"

      - name: occ_repin_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-repin-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a successful repin bumps the case version, a second repin carrying the previously observed version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["surgeon S; card v1 and v2 both published in sequence (v1 SUPERSEDED, v2 ACTIVE); case pinned to v1 (SCHEDULED, version observed)"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Occ2", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { c1: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${c1}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${c1}", as: Any, captures: { c1_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${c1}/publish", payload: { expected_card_version: "${c1_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${c1}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { c2: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${c2}", supply_item_id: "${item_a}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${c2}", as: Any, captures: { c2_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${c2}/publish", payload: { expected_card_version: "${c2_v}" }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/cases/${case_id}", as: Any, captures: { case_v: "$.data.version" } }
            - { call: "POST /perioperative/cases/${case_id}/repin-card", payload: { card_id: "${c2}", expected_case_version: "${case_v}" }, as: SupplyChainAnalyst, captures: { ok_pin: "$.data.pinned_card_version_number" } }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/repin-card", payload: { card_id: "${c2}", expected_case_version: "${case_v}" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "first repin succeeded: pinned_card_version_number == 2 (${ok_pin})"
            - "second repin with the stale observed version: ${err} == ERR_STALE_VERSION (http 412)"

      - name: version_pin_keeps_case_on_superseded_card_until_repin
        claim_type: version_pinning_on_approval
        grounds: [entities.SurgicalCase.fields.pinned_card_version_number, state_machines.PreferenceCard.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Version pinning: publishing v2 does NOT move the case's pin (stays 1); after an explicit repin the released pick list prices the v2 snapshot (standard_cost_cents 500 from 2x250), proving the pin — not the latest card — drives release."
        test_recipe:
          setup: ["surgeon S; card v1 (1x A) published; case pinned v1; card v2 (2x A) published (v1 SUPERSEDED)"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Pin2", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { c1: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${c1}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${c1}", as: Any, captures: { c1_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${c1}/publish", payload: { expected_card_version: "${c1_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${c1}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { c2: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${c2}", supply_item_id: "${item_a}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${c2}", as: Any, captures: { c2_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${c2}/publish", payload: { expected_card_version: "${c2_v}" }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/cases/${case_id}", as: Any, captures: { pin_before: "$.data.pinned_card_version_number", case_v: "$.data.version" } }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/repin-card", payload: { card_id: "${c2}", expected_case_version: "${case_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/cases/${case_id}", as: Any, captures: { pin_after: "$.data.pinned_card_version_number", std_after: "$.data.standard_cost_cents" } }
          assert:
            - "before repin: pinned_card_version_number == 1 (${pin_before}) even though v2 is ACTIVE"
            - "after repin + release: pinned_card_version_number == 2 (${pin_after}) and standard_cost_cents == 500 (${std_after}) — the v2 snapshot (2x250), not v1 (250)"

