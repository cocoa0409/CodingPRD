            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pmA_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Treated burn." }
              as: IntakeSpecialist
              captures: { a2_id: $.data.id }
            - call: "POST /product-safety/incidents/${a2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pmA_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Minor burn." }
              as: IntakeSpecialist
              captures: { a3_id: $.data.id }
            - call: "POST /product-safety/incidents/${a3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pmB_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Hospitalisation." }
              as: IntakeSpecialist
              captures: { b1_id: $.data.id }
            - call: "POST /product-safety/incidents/${b1_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pmB_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Treated burn." }
              as: IntakeSpecialist
              captures: { b2_id: $.data.id }
            - call: "POST /product-safety/incidents/${b2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pmB_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Minor burn." }
              as: IntakeSpecialist
              captures: { b3_id: $.data.id }
            - call: "POST /product-safety/incidents/${b3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
          trigger:
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pmA_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pmA_v1}" }
              as: ComplianceOfficer
