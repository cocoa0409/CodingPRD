  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_billing_hold_on_create
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_CLIENT_SUSPENDED]
          - errors[ERR_BILLING_HOLD]
        distinguishing_aspect: |
          Pair (state, business_fiscal) on POST /rides: the client is SUSPENDED
          (state, priority 7) AND over billing hold (fiscal, priority 13); the
          response MUST be ERR_CLIENT_SUSPENDED, proving the state check runs first.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; client with billing_hold_limit_cents 1000"
            - "Overdue AR 1251 >= 1000: late-cancelled May ride (fee 1251) invoiced [2026-05-01, 2026-05-08), issued, due 2026-05-22, clock now 2026-05-23"
            - "Client additionally PATCHed to SUSPENDED"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St", billing_hold_limit_cents: 1000 }, as: Coordinator, captures: { cli: $.data.id, cv: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-05-04T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride_may: $.data.id } }
            - { call: "POST /rides/${ride_may}/cancel", payload: { cancel_note: "changed mind" }, as: Client, as_user_id: "${cli}" }
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-05-01", period_end: "2026-05-08" }, as: BillingAdmin, captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/issue", as: BillingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-23T09:00:00Z" }, as: PlatformAdmin }
            - { call: "PATCH /clients/${cli}", payload: { status: "SUSPENDED", expected_client_version: "${cv}" }, as: Coordinator }
          trigger:
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-01T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLIENT_SUSPENDED (state, priority 7) — NOT ERR_BILLING_HOLD (fiscal, priority 13), though both conditions hold"

      - name: referential_error_beats_billing_hold_on_create
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_RETURN_LINK_MISMATCH]
          - errors[ERR_BILLING_HOLD]
        distinguishing_aspect: |
          Pair (business_referential, business_fiscal) on POST /rides: the request
          links a return ride owned by ANOTHER client (referential, priority 12)
          AND the booking client is over billing hold (fiscal, priority 13); the
          response MUST be ERR_RETURN_LINK_MISMATCH — a different category pair
          than the state-vs-fiscal instance.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; client A over billing hold (same May-fee construction, limit 1000); client B clean"
            - "Client B owns a SCHEDULED APPOINTMENT ride RB"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada A", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St", billing_hold_limit_cents: 1000 }, as: Coordinator, captures: { cli_a: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Bob B", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "2 Elm St" }, as: Coordinator, captures: { cli_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli_a}", kind: "GROCERY", scheduled_pickup_at: "2026-05-04T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli_a}", captures: { ride_may: $.data.id } }
            - { call: "POST /rides/${ride_may}/cancel", payload: { cancel_note: "changed mind" }, as: Client, as_user_id: "${cli_a}" }
            - { call: "POST /invoices/generate", payload: { client_id: "${cli_a}", period_start: "2026-05-01", period_end: "2026-05-08" }, as: BillingAdmin, captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/issue", as: BillingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-23T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli_b}", kind: "APPOINTMENT", scheduled_pickup_at: "2026-06-03T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli_b}", captures: { rb: $.data.id } }
          trigger:
            - { call: "POST /rides", payload: { client_id: "${cli_a}", kind: "GROCERY", scheduled_pickup_at: "2026-06-04T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north", linked_return_ride_id: "${rb}" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RETURN_LINK_MISMATCH (referential, priority 12) — NOT ERR_BILLING_HOLD (fiscal, priority 13), though both conditions hold"

  # ---------------------------------------------------------------------------
