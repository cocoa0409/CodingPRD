              as: PortalAdmin
            - call: "GET /open-data/metadata-records/8f2c1d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
              as: Anonymous
            - call: "GET /open-data/privacy-assessments/8f2c1d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
              as: PortalAdmin
