# =============================================================================
# §1.8 Scaffold Difficulty Design — Citrus Packinghouse & Grove Caretaking
# Test Targeting Index: 9 Difficulty Rules x >=2 instances (20 instances total).
# All recipes drive empty-DB -> target state using only SCAFFOLD.yaml §1.5 endpoints.
# Canonical clock default: 2026-08-01T00:00:00Z (Saturday). Pool week 2026-07-27
# covers 2026-07-27..2026-08-02 inclusive.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pool_price_provisional_vs_final
        grounds:
          - calculations.pool_provisional_price
          - calculations.pool_final_price
          - state_machines.Pool.INTAKE_CLOSED_to_PRICED
        distinguishing_aspect: |
          Dual variant on the POOL entity domain: the same posted data (proceeds
          49760, ge 96.8) yields provisional 514 (forward-looking, no packing
          charge) versus final 359 (actuals minus tiered packing charge) — two
          valid algorithms, two different prices for identical inputs.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; grower GR-DV1 with HAMLIN grove (POLK, 50 acres)"
            - "CURRENT PASS maturity test (ratio 9.00, expires 2026-08-05T10:00:00Z)"
            - "Pool HAMLIN week 2026-07-27 OPEN; channels: JP EXPORT JAPAN 25 boxes @900 rank 1 accepts [FANCY]; DOM DOMESTIC_FRESH 40 @500 rank 2 accepts [FANCY,CHOICE,STANDARD]; JUICE uncapped @220 rank 9"
            - "Crew CR-DV1 capacity 400; assignment window [2026-08-01T00:00,2026-08-01T12:00) planned 100, IN_PROGRESS"
            - "Delivery 100 net boxes; sort run 40F/30C/20S/8J/2Cu color 7 defect 10 POSTED (proceeds 49760, ge 96.8)"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-DV1", display_name: "Dual Variant Groves" }, as: PackinghouseAdmin, captures: { dv_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${dv_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK", caretaking_enrolled: false }, as: PackinghouseAdmin, captures: { dv_gr: "$.data.id", dv_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${dv_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${dv_gr_v}" }, as: QualityInspector, as_user_id: "qi_dv1", captures: { dv_mt: "$.data.id" } }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { dv_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JP-DV1", channel_type: EXPORT, destination_market: JAPAN, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 25, price_cents_per_box: 900, priority_rank: 1, accepts_grades: ["FANCY"] }, as: PackinghouseAdmin, captures: { dv_jp: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "DOM-DV1", channel_type: DOMESTIC_FRESH, destination_market: DOMESTIC, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 40, price_cents_per_box: 500, priority_rank: 2, accepts_grades: ["FANCY", "CHOICE", "STANDARD"] }, as: PackinghouseAdmin, captures: { dv_dom: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JU-DV1", channel_type: JUICE, destination_market: NONE, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 0, price_cents_per_box: 220, priority_rank: 9, accepts_grades: ["FANCY", "CHOICE", "STANDARD", "JUICE"] }, as: PackinghouseAdmin, captures: { dv_ju: "$.data.id" } }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-DV1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { dv_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${dv_c}", grove_id: "${dv_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { dv_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${dv_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${dv_gr}", assignment_id: "${dv_a}", gross_boxes: 100, tare_boxes: 0 }, as: FieldSupervisor, captures: { dv_d: "$.data.id", dv_d_v: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${dv_d}", fancy_boxes: 40, choice_boxes: 30, standard_boxes: 20, juice_boxes: 8, cull_boxes: 2, color_score: 7, defect_pct: 10, expected_delivery_version: "${dv_d_v}" }, as: LineOperator, as_user_id: "op_dv1", captures: { dv_sr: "$.data.id" } }
            - { call: "POST /packinghouse/sort-runs/${dv_sr}/verify", payload: {}, as: QualityInspector, as_user_id: "qi_dv1" }
            - { call: "POST /packinghouse/sort-runs/${dv_sr}/post", payload: {}, as: LineOperator, as_user_id: "op_dv1" }
          trigger:
            - { call: "POST /packinghouse/pools/${dv_p}/close-intake", payload: {}, as: PoolAccountant }
            - { call: "GET /packinghouse/pools/${dv_p}", payload: {}, as: PoolAccountant, captures: { dv_pv: "$.data.version" } }
            - { call: "POST /packinghouse/pools/${dv_p}/set-price", payload: { expected_pool_version: "${dv_pv}" }, as: PoolAccountant }
          assert:
            - "Before close-intake, Pool.${dv_p}.provisional_price_cents_per_ge_box == 514 (round_half_up(49760/96.8))"
            - "SortRun.${dv_sr}.proceeds_cents == 49760 and SortRun.${dv_sr}.ge_boxes == 96.8"
            - "After set-price, Pool.${dv_p}.final_price_cents_per_ge_box == 359 (round_half_up((49760 - 100*150)/96.8))"
            - "Pool.${dv_p}.status == PRICED and 514 != 359: identical posted data, different variant outputs"

      - name: advance_recoup_policy_thirds_vs_full
        grounds:
          - calculations.settlement_waterfall
          - state_machines.AdvancePayment.ISSUED_to_PARTIALLY_RECOUPED
          - state_machines.AdvancePayment.ISSUED_to_RECOUPED
          - state_machines.Pool.PRICED_to_SETTLED
        distinguishing_aspect: |
          Dual variant on the ADVANCEPAYMENT entity domain (distinct from the
          Pool price variant): two advances with identical amount (9000) and
          identical settlement residual diverge purely by recoup_policy —
          NEXT_SETTLEMENT_FULL recoups 9000, PRO_RATA_THIRDS recoups 3000.
        test_recipe:
          setup:
            - "One grower; pool HAMLIN wk 2026-07-27 with posted run 40F/30C/20S/8J/2Cu into DOM 100@500 + JUICE@220: proceeds 46760, ge 96.8, provisional 483"
            - "Advance A1 9000 NEXT_SETTLEMENT_FULL ISSUED; advance A2 9000 PRO_RATA_THIRDS ISSUED (cap 28053 admits 18000 total)"
            - "Pool PRICED (final 328); grower caretaking balance 0"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-AR1", display_name: "Recoup Variant Groves" }, as: PackinghouseAdmin, captures: { ar_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${ar_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { ar_gr: "$.data.id", ar_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${ar_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${ar_gr_v}" }, as: QualityInspector, as_user_id: "qi_ar1" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { ar_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "DOM-AR1", channel_type: DOMESTIC_FRESH, destination_market: DOMESTIC, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 100, price_cents_per_box: 500, priority_rank: 2, accepts_grades: ["FANCY", "CHOICE", "STANDARD"] }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JU-AR1", channel_type: JUICE, destination_market: NONE, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 0, price_cents_per_box: 220, priority_rank: 9, accepts_grades: ["FANCY", "CHOICE", "STANDARD", "JUICE"] }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-AR1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { ar_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${ar_c}", grove_id: "${ar_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { ar_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${ar_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${ar_gr}", assignment_id: "${ar_a}", gross_boxes: 100, tare_boxes: 0 }, as: FieldSupervisor, captures: { ar_d: "$.data.id", ar_d_v: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${ar_d}", fancy_boxes: 40, choice_boxes: 30, standard_boxes: 20, juice_boxes: 8, cull_boxes: 2, color_score: 7, defect_pct: 10, expected_delivery_version: "${ar_d_v}" }, as: LineOperator, as_user_id: "op_ar1", captures: { ar_sr: "$.data.id" } }
            - { call: "POST /packinghouse/sort-runs/${ar_sr}/verify", payload: {}, as: QualityInspector, as_user_id: "qi_ar1" }
            - { call: "POST /packinghouse/sort-runs/${ar_sr}/post", payload: {}, as: LineOperator, as_user_id: "op_ar1" }
            - { call: "POST /packinghouse/advances", payload: { grower_id: "${ar_g}", pool_id: "${ar_p}", amount_cents: 9000, recoup_policy: NEXT_SETTLEMENT_FULL }, as: PoolAccountant, captures: { ar_a1: "$.data.id" } }
            - { call: "POST /packinghouse/advances/${ar_a1}/approve", payload: {}, as: PoolAccountant }
            - { call: "POST /packinghouse/advances", payload: { grower_id: "${ar_g}", pool_id: "${ar_p}", amount_cents: 9000, recoup_policy: PRO_RATA_THIRDS }, as: PoolAccountant, captures: { ar_a2: "$.data.id" } }
            - { call: "POST /packinghouse/advances/${ar_a2}/approve", payload: {}, as: PoolAccountant }
            - { call: "POST /packinghouse/pools/${ar_p}/close-intake", payload: {}, as: PoolAccountant }
            - { call: "GET /packinghouse/pools/${ar_p}", payload: {}, as: PoolAccountant, captures: { ar_pv: "$.data.version" } }
            - { call: "POST /packinghouse/pools/${ar_p}/set-price", payload: { expected_pool_version: "${ar_pv}" }, as: PoolAccountant }
          trigger:
            - { call: "POST /packinghouse/pools/${ar_p}/settle", payload: {}, as: PoolAccountant }
          assert:
            - "AdvancePayment.${ar_a1}.status == RECOUPED and recouped_cents == 9000 and outstanding_cents == 0"
            - "AdvancePayment.${ar_a2}.status == PARTIALLY_RECOUPED and recouped_cents == 3000 and outstanding_cents == 6000 (round_half_up(9000/3) per-settlement cap)"
            - "Grower.${ar_g}.advance_outstanding_cents == 6000"
            - "GET /packinghouse/pools/${ar_p}/settlement-statements shows the grower statement: share 31750, offset 0, recouped 12000, paid 19750"
            - "Identical amount_cents (9000) and identical residual (31750): recoup differs only by recoup_policy variant"
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: packout_allocation_waterfall
        grounds:
          - calculations.packout_allocation
          - calculations.ge_box_conversion
          - state_machines.SortRun.VERIFIED_to_POSTED
        distinguishing_aspect: |
          Mode (a): nested min() across 3 grade classes x 3 channels with
          state-conditional fresh/juice gating; the waterfall order (priority_rank
          ASC, grade order FANCY->CHOICE->STANDARD) determines who gets fruit —
          JP fills 25 FANCY, DOM gets the 15 FANCY remainder plus 25 CHOICE, and
          33 boxes (5 CHOICE + 20 STANDARD + 8 measured juice) overflow to JUICE.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove with CURRENT PASS maturity (expires 2026-08-05T10:00:00Z)"
            - "Pool HAMLIN wk 2026-07-27 OPEN; channels JP EXPORT 25@900 rank1 [FANCY], DOM 40@500 rank2 [FANCY,CHOICE,STANDARD], JUICE uncapped @220 rank9"
            - "Crew 400/day; assignment IN_PROGRESS; delivery 100 net boxes"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-PA1", display_name: "Packout Groves" }, as: PackinghouseAdmin, captures: { pa_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${pa_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { pa_gr: "$.data.id", pa_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${pa_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${pa_gr_v}" }, as: QualityInspector, as_user_id: "qi_pa1" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { pa_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JP-PA1", channel_type: EXPORT, destination_market: JAPAN, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 25, price_cents_per_box: 900, priority_rank: 1, accepts_grades: ["FANCY"] }, as: PackinghouseAdmin, captures: { pa_jp: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "DOM-PA1", channel_type: DOMESTIC_FRESH, destination_market: DOMESTIC, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 40, price_cents_per_box: 500, priority_rank: 2, accepts_grades: ["FANCY", "CHOICE", "STANDARD"] }, as: PackinghouseAdmin, captures: { pa_dom: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JU-PA1", channel_type: JUICE, destination_market: NONE, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 0, price_cents_per_box: 220, priority_rank: 9, accepts_grades: ["FANCY", "CHOICE", "STANDARD", "JUICE"] }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-PA1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { pa_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${pa_c}", grove_id: "${pa_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { pa_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${pa_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${pa_gr}", assignment_id: "${pa_a}", gross_boxes: 100, tare_boxes: 0 }, as: FieldSupervisor, captures: { pa_d: "$.data.id", pa_d_v: "$.data.version" } }
          trigger:
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${pa_d}", fancy_boxes: 40, choice_boxes: 30, standard_boxes: 20, juice_boxes: 8, cull_boxes: 2, color_score: 7, defect_pct: 10, expected_delivery_version: "${pa_d_v}" }, as: LineOperator, as_user_id: "op_pa1", captures: { pa_sr: "$.data.id" } }
            - { call: "POST /packinghouse/sort-runs/${pa_sr}/verify", payload: {}, as: QualityInspector, as_user_id: "qi_pa1" }
            - { call: "POST /packinghouse/sort-runs/${pa_sr}/post", payload: {}, as: LineOperator, as_user_id: "op_pa1" }
          assert:
            - "SortRun.${pa_sr}.status == POSTED and fresh_eligible == true"
            - "SortRun.${pa_sr}.allocation == [{channel JP-PA1, FANCY, 25}, {channel DOM-PA1, FANCY, 15}, {channel DOM-PA1, CHOICE, 25}, {channel JU-PA1, overflow 5 CHOICE + 20 STANDARD + 8 JUICE = 33 boxes}]"
            - "SortRun.${pa_sr}.proceeds_cents == 49760 (25*900 + 15*500 + 25*500 + 33*220)"
            - "SortRun.${pa_sr}.ge_boxes == 96.8 (40*1.15 + 30*1.0 + 20*0.9 + 8*0.35)"
            - "AllocationChannel.${pa_jp}.remaining_boxes == 0 and AllocationChannel.${pa_dom}.remaining_boxes == 0"
            - "Delivery.${pa_d}.processing_status == SORTED; Pool.${pa_p}.posted_ge_boxes == 96.8 and posted_proceeds_cents == 49760 and sorted_field_boxes == 100"

      - name: caretaking_rollup_rounding_order
        grounds:
          - calculations.caretaking_billing_rollup
          - state_machines.CaretakingServiceOrder.SCHEDULED_to_COMPLETED
          - state_machines.CaretakingInvoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-line-then-sum: two PRUNE lines of 3.333 acres at 5500 cents
          round to 18332 each (total 36664); the alternate sum-then-round order
          would give round_half_up(36663.0) = 36663. The one-cent difference is
          the assertion.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower GR-CR1 with enrolled grove (30 acres, SMALL tier, POLK)"
            - "Two PRUNE orders of 3.333 acres each, service_date 2026-08-01, COMPLETED (line_amount 18332 each)"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-CR1", display_name: "Caretaking Rounding Groves" }, as: PackinghouseAdmin, captures: { cr_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${cr_g}", block_code: "B1", variety: HAMLIN, acreage: 30, county_code: "POLK", caretaking_enrolled: true }, as: PackinghouseAdmin, captures: { cr_gr: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders", payload: { grove_id: "${cr_gr}", service_type: PRUNE, service_date: "2026-08-01", acres_treated: 3.333 }, as: FieldSupervisor, captures: { cr_o1: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders/${cr_o1}/schedule", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-orders/${cr_o1}/complete", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-orders", payload: { grove_id: "${cr_gr}", service_type: PRUNE, service_date: "2026-08-01", acres_treated: 3.333 }, as: FieldSupervisor, captures: { cr_o2: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders/${cr_o2}/schedule", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-orders/${cr_o2}/complete", payload: {}, as: FieldSupervisor }
          trigger:
            - { call: "POST /packinghouse/caretaking-invoices", payload: { grower_id: "${cr_g}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PoolAccountant, captures: { cr_inv: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-invoices/${cr_inv}/issue", payload: {}, as: PoolAccountant }
          assert:
            - "CaretakingServiceOrder.${cr_o1}.line_amount_cents == 18332 and rate_tier == SMALL (round_half_up(3.333 * 5500))"
            - "CaretakingServiceOrder.${cr_o2}.line_amount_cents == 18332"
            - "CaretakingInvoice.${cr_inv}.total_cents == 36664 (per-line rounded then summed; NOT 36663)"
            - "After issue: both orders status == INVOICED with invoice_id == ${cr_inv}; Grower.${cr_g}.caretaking_balance_cents == 36664"

      - name: settlement_offset_recoup_evaluation_order
        grounds:
          - calculations.settlement_waterfall
          - calculations.pool_final_price
          - state_machines.Pool.PRICED_to_SETTLED
        distinguishing_aspect: |
          Mode (c): circular-looking mutual dependency with pinned evaluation
          order — offset is capped at 50% of share, recoupment draws only the
          post-offset residual, and paid is what remains: share 34751 -> offset
          min(20000, 17376) = 17376 -> recoup min(10000, 17375) = 10000 ->
          paid 7375. Any other evaluation order yields different cents.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower GR-SW1 with enrolled HAMLIN grove (30 acres, POLK), CURRENT PASS maturity"
            - "Pool HAMLIN wk 2026-07-27; channels JP 25@900 rank1 [FANCY], DOM 40@500 rank2 [FANCY,CHOICE,STANDARD], JUICE @220 rank9"
            - "Delivery 100 net; sort 40F/30C/20S/8J/2Cu POSTED (proceeds 49760, ge 96.8, provisional 514)"
            - "Caretaking: one MOW order 11.111 acres COMPLETED, invoiced and ISSUED (line 20000; grower balance 20000)"
            - "Advance 10000 NEXT_SETTLEMENT_FULL ISSUED (cap 29853)"
            - "Pool INTAKE_CLOSED then PRICED at final 359"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-SW1", display_name: "Settlement Waterfall Groves" }, as: PackinghouseAdmin, captures: { sw_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${sw_g}", block_code: "B1", variety: HAMLIN, acreage: 30, county_code: "POLK", caretaking_enrolled: true }, as: PackinghouseAdmin, captures: { sw_gr: "$.data.id", sw_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${sw_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${sw_gr_v}" }, as: QualityInspector, as_user_id: "qi_sw1" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { sw_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JP-SW1", channel_type: EXPORT, destination_market: JAPAN, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 25, price_cents_per_box: 900, priority_rank: 1, accepts_grades: ["FANCY"] }, as: PackinghouseAdmin }
