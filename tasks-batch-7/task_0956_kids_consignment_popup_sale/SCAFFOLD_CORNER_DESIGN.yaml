            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
            - { call: "POST /pos-transactions", payload: { sale_event_id: "${ev_id}" }, as: Cashier, captures: { tx_id: $.data.id } }
          trigger:
            - { call: "POST /pos-transactions/${tx_id}/lines", payload: { barcode: "C9999-0001" }, as: Cashier, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BARCODE_NOT_FOUND, http status 404"

      - name: duplicate_active_booking_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_ACTIVE_BOOKING]", "validations[priority=8]"]
        distinguishing_aspect: "One active booking per consignor: a second booking (different slot, both with free capacity) fails with ERR_DUPLICATE_ACTIVE_BOOKING until the first is cancelled."
        test_recipe:
          setup: ["Event in INTAKE_OPEN; two slots with capacity; consignor holds one BOOKED booking on slot 1."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Ann", email: "ann@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { s1: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T14:00:00Z", end_time: "2026-06-02T16:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { s2: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${s1}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk1: $.data.id } }
          trigger:
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${s2}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
            - { call: "POST /drop-off-bookings/${bk1}/cancel", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${s2}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk2: $.data.id } }
          assert:
            - "Second active booking: error_id == ERR_DUPLICATE_ACTIVE_BOOKING (409)"
            - "After cancelling the first: booking on slot 2 succeeds (DropOffBooking.${bk2}.status == BOOKED)"

      - name: no_show_before_shift_end_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_SHOW_TOO_EARLY]", state_machines.ShiftSignup.SIGNED_UP_to_NO_SHOW]
        distinguishing_aspect: "mark-no-show requires the logical clock past shift end; at the default clock (2026-05-01T00:00:00Z, before the shift) it fails with ERR_NO_SHOW_TOO_EARLY."
        test_recipe:
          setup: ["Event in DRAFT; volunteer SIGNED_UP for a 2026-05-28 shift; clock untouched at the 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
