          assert:
            - "st25 == SUBMITTED — qty exactly at min_order_qty passes (>= semantics)"
            - "err == ERR_MIN_ORDER_QTY — one unit below the minimum rejects"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pos_order_requires_event_open
        grounds:
          - state_machines.Order (creation precondition on EventSale status)
          - validations[priority=7]
          - errors[ERR_DRAWER_NOT_OPEN]
        distinguishing_aspect: |
          Order -> EventSale pair: a POS order is valid only while its parent EventSale is OPEN; on a
          SCHEDULED event the same request fails with ERR_DRAWER_NOT_OPEN, then succeeds after open-drawer.
          Entity pair differs from the sibling's PurchaseOrder -> Vendor.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED; variant M price 2500 stocked 25; event SCHEDULED on register GYM-C (2026-09-05 14:00-16:00)"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 25 }, as: StoreManager }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Game 1", register_location: "GYM-C", starts_at: "2026-09-05T14:00:00Z", ends_at: "2026-09-05T16:00:00Z" }, as: StoreManager, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: EVENT_POS, event_id: "${ev}", customer_user_id: "walkup", payment_method: CASH, lines: [ { variant_id: "${var}", qty: 1 } ] }, as: StudentCashier, as_user_id: "cashier-01", captures: { err: $.data.error_id } }
            - { call: "POST /spirit-store/event-sales/${ev}/open-drawer", payload: { opening_float_cents: 10000 }, as: StudentCashier, as_user_id: "cashier-01" }
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: EVENT_POS, event_id: "${ev}", customer_user_id: "walkup", payment_method: CASH, lines: [ { variant_id: "${var}", qty: 1 } ] }, as: StudentCashier, as_user_id: "cashier-01", captures: { ord_total: $.data.total_cents } }
          assert:
            - "err == ERR_DRAWER_NOT_OPEN while event SCHEDULED"
            - "After open-drawer, identical order succeeds with ord_total == 2500"
            - "EventSale.${ev}.cash_sales_cents == 2500"

      - name: po_submit_requires_vendor_approved
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_SUBMITTED
          - errors[ERR_VENDOR_NOT_APPROVED]
        distinguishing_aspect: |
          PurchaseOrder -> Vendor pair: submit is gated on vendor.status == APPROVED; fails while PENDING,
          succeeds after approval PATCH. Entity pair differs from the sibling's Order -> EventSale.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED; variant M; vendor created (PENDING) with ACTIVE quote min 25"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager, captures: { err: $.data.error_id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager, captures: { st: $.data.status } }
          assert:
            - "err == ERR_VENDOR_NOT_APPROVED while vendor PENDING"
            - "st == SUBMITTED after vendor approval — identical PO body, only the vendor's state changed"

      - name: allocation_post_requires_program_closed
        grounds:
          - validations[priority=6]
          - errors[ERR_PROGRAM_NOT_CLOSED]
          - state_machines.MerchProgram.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          AllocationRun -> MerchProgram pair: posting is gated on the program aggregate being CLOSED; fails
          while ACTIVE, succeeds after the lifecycle transition. Third distinct entity pair.
        test_recipe:
          setup:
            - "Program ACTIVE with undistributed profit 1000; account Band weight 1 uncapped; DRAFT run for 1000"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/programs/${prog}/profit-adjustments", payload: { amount_cents: 1000, reason: "donation" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/activity-accounts", payload: { program_id: "${prog}", name: "Band", allocation_weight: 1 }, as: ActivitiesDirector, captures: { acc: $.data.id } }
            - { call: "POST /spirit-store/allocation-runs", payload: { program_id: "${prog}", distributable_cents: 1000 }, as: Treasurer, captures: { run: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/allocation-runs/${run}/post", payload: {}, as: Treasurer, captures: { err: $.data.error_id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: CLOSED }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/allocation-runs/${run}/post", payload: {}, as: Treasurer, captures: { st: $.data.status } }
            - { call: "GET /spirit-store/activity-accounts/${acc}", payload: {}, as: Treasurer, captures: { bal: $.data.balance_cents } }
          assert:
            - "err == ERR_PROGRAM_NOT_CLOSED while program ACTIVE"
            - "st == POSTED after program CLOSED"
            - "bal == 1000"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: drop_windows_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_DROP_WINDOW_OVERLAP]
          - entities.SeasonalDrop.fields.opens_at
        distinguishing_aspect: |
          Half-open interval semantics on the drop-calendar resource: [opens_at, closes_at) allows exact
          adjacency (B.opens_at == A.closes_at passes) but rejects true overlap (C opens inside A). Interval
          semantics differ from the sibling's closed-interval-with-buffer on registers.
        test_recipe:
          setup:
            - "Program ACTIVE; program version captured after activation (drop create is OCC-guarded)"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector, captures: { pv1: $.data.version } }
          trigger:
            - { call: "POST /spirit-store/seasonal-drops", payload: { program_id: "${prog}", name: "Fall", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", expected_program_version: "${pv1}" }, as: StoreManager, captures: { drop_a: $.data.id } }
            - { call: "GET /spirit-store/programs/${prog}", payload: {}, as: StoreManager, captures: { pv2: $.data.version } }
            - { call: "POST /spirit-store/seasonal-drops", payload: { program_id: "${prog}", name: "Winter", opens_at: "2026-10-01T00:00:00Z", closes_at: "2026-11-01T00:00:00Z", expected_program_version: "${pv2}" }, as: StoreManager, captures: { drop_b: $.data.id } }
            - { call: "GET /spirit-store/programs/${prog}", payload: {}, as: StoreManager, captures: { pv3: $.data.version } }
            - { call: "POST /spirit-store/seasonal-drops", payload: { program_id: "${prog}", name: "Homecoming", opens_at: "2026-09-15T00:00:00Z", closes_at: "2026-10-15T00:00:00Z", expected_program_version: "${pv3}" }, as: StoreManager, captures: { err: $.data.error_id } }
          assert:
            - "Drop B created — B.opens_at == A.closes_at is adjacency, not overlap, under half-open semantics"
            - "err == ERR_DROP_WINDOW_OVERLAP for C (2026-09-15 lies inside A's [09-01, 10-01))"

      - name: register_booking_buffer_gap
        grounds:
          - validations[priority=9]
          - errors[ERR_EVENT_REGISTER_CONFLICT]
          - entities.MerchProgram.fields.register_buffer_minutes
        distinguishing_aspect: |
          Closed-interval-with-buffer semantics on the register resource: a follow-on event starting exactly
          ends_at + 30 min later is allowed (strict < comparison), 1 minute earlier conflicts, and the same
          window on a different register is unaffected. Semantics and resource both differ from the sibling's
          half-open drop windows.
        test_recipe:
          setup:
            - "Program ACTIVE with default register_buffer_minutes 30"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
          trigger:
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "JV Game", register_location: "GYM-A", starts_at: "2026-09-05T14:00:00Z", ends_at: "2026-09-05T16:00:00Z" }, as: StoreManager, captures: { ev_a: $.data.id } }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Varsity Game", register_location: "GYM-A", starts_at: "2026-09-05T16:30:00Z", ends_at: "2026-09-05T18:00:00Z" }, as: StoreManager, captures: { ev_b: $.data.id } }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Pep Rally", register_location: "GYM-A", starts_at: "2026-09-05T16:29:00Z", ends_at: "2026-09-05T18:00:00Z" }, as: StoreManager, captures: { err: $.data.error_id } }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Soccer", register_location: "FIELD-1", starts_at: "2026-09-05T15:00:00Z", ends_at: "2026-09-05T17:00:00Z" }, as: StoreManager, captures: { ev_d: $.data.id } }
          assert:
            - "Event B created — start 16:30 exactly equals A.end + 30min buffer (16:00+0:30); strict-< leaves it conflict-free"
            - "err == ERR_EVENT_REGISTER_CONFLICT for C (16:29 < 16:30 violates the buffer)"
            - "Event D created — buffer rule is per-register; FIELD-1 is unaffected by GYM-A bookings"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: online_reserve_refund_conserves_inventory
        grounds:
          - state_machines.Order.PAID_to_REFUNDED
          - entities.ProductVariant.fields.on_hand_qty
          - entities.ProductVariant.fields.reserved_online_qty
        distinguishing_aspect: |
          Conserved quantity: physical inventory split (on_hand_qty, reserved_online_qty) and recognized profit.
          An online order followed by a full refund returns on_hand 25 / reserved 0 / undistributed_profit 0 —
          exactly the pre-order values. Quantity type differs from the sibling's account-balance cents.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED (fee 0, royalty 0); variant M price 2500 stocked 25 (landed 500); reserved 0"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 25 }, as: StoreManager }
          trigger:
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: ONLINE, customer_user_id: "cust-30", payment_method: CARD, lines: [ { variant_id: "${var}", qty: 2 } ] }, as: Customer, as_user_id: "cust-30", captures: { ord: $.data.id } }
            - { call: "GET /spirit-store/product-variants/${var}", payload: {}, as: Treasurer, captures: { oh1: $.data.on_hand_qty, rs1: $.data.reserved_online_qty } }
            - { call: "POST /spirit-store/orders/${ord}/refund", payload: { amount_cents: 5000 }, as: Treasurer, captures: { pay: $.data.payment_status, ful: $.data.fulfillment_status } }
            - { call: "GET /spirit-store/product-variants/${var}", payload: {}, as: Treasurer, captures: { oh2: $.data.on_hand_qty, rs2: $.data.reserved_online_qty } }
            - { call: "GET /spirit-store/programs/${prog}", payload: {}, as: Treasurer, captures: { profit: $.data.undistributed_profit_cents } }
          assert:
            - "oh1 == 25 AND rs1 == 2 (reservation moved the split, not the physical count)"
            - "pay == REFUNDED AND ful == EXPIRED_RELEASED"
            - "oh2 == 25 AND rs2 == 0 — forward action + compensating refund leaves the inventory split invariant"
            - "profit == 0 — margin 4000 recognized then fully reversed (round(4000*5000/5000)=4000)"

      - name: allocation_post_reverse_conserves_balances
        grounds:
          - calculations.allocation_waterfall_calc
          - endpoints: "POST /spirit-store/allocation-runs/{runId}/post"
          - endpoints: "POST /spirit-store/allocation-runs/{runId}/reverse"
          - entities.ActivityAccount.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: activity-account balance cents and the program profit split. post credits
          30000/42000/28000 then reverse debits exactly the same amounts — balances return to 0 and
          undistributed_profit returns to 100000 with zero drift. Quantity type differs from the sibling's
          physical inventory units.
        test_recipe:
          setup:
            - "Program ACTIVE with undistributed 100000; accounts A w50 cap30000, B w30, C w20 (balances 0)"
            - "DRAFT run for 100000 created; program CLOSED"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/programs/${prog}/profit-adjustments", payload: { amount_cents: 100000, reason: "donation" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/activity-accounts", payload: { program_id: "${prog}", name: "Band", allocation_weight: 50, cap_cents: 30000 }, as: ActivitiesDirector, captures: { acc_a: $.data.id } }
            - { call: "POST /spirit-store/activity-accounts", payload: { program_id: "${prog}", name: "Drama", allocation_weight: 30 }, as: ActivitiesDirector, captures: { acc_b: $.data.id } }
            - { call: "POST /spirit-store/activity-accounts", payload: { program_id: "${prog}", name: "Robotics", allocation_weight: 20 }, as: ActivitiesDirector, captures: { acc_c: $.data.id } }
            - { call: "POST /spirit-store/allocation-runs", payload: { program_id: "${prog}", distributable_cents: 100000 }, as: Treasurer, captures: { run: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: CLOSED }, as: ActivitiesDirector }
          trigger:
            - { call: "POST /spirit-store/allocation-runs/${run}/post", payload: {}, as: Treasurer, captures: { st1: $.data.status } }
            - { call: "GET /spirit-store/activity-accounts/${acc_a}", payload: {}, as: Treasurer, captures: { a1: $.data.balance_cents } }
            - { call: "GET /spirit-store/activity-accounts/${acc_b}", payload: {}, as: Treasurer, captures: { b1: $.data.balance_cents } }
            - { call: "GET /spirit-store/activity-accounts/${acc_c}", payload: {}, as: Treasurer, captures: { c1: $.data.balance_cents } }
            - { call: "POST /spirit-store/allocation-runs/${run}/reverse", payload: {}, as: Treasurer, captures: { st2: $.data.status } }
            - { call: "GET /spirit-store/activity-accounts/${acc_a}", payload: {}, as: Treasurer, captures: { a2: $.data.balance_cents } }
            - { call: "GET /spirit-store/activity-accounts/${acc_b}", payload: {}, as: Treasurer, captures: { b2: $.data.balance_cents } }
            - { call: "GET /spirit-store/activity-accounts/${acc_c}", payload: {}, as: Treasurer, captures: { c2: $.data.balance_cents } }
            - { call: "GET /spirit-store/programs/${prog}", payload: {}, as: Treasurer, captures: { und: $.data.undistributed_profit_cents, dist: $.data.distributed_profit_cents } }
          assert:
            - "st1 == POSTED AND a1 == 30000 AND b1 == 42000 AND c1 == 28000"
            - "st2 == REVERSED AND a2 == 0 AND b2 == 0 AND c2 == 0 — compensating action restores every balance exactly"
            - "und == 100000 AND dist == 0 — program profit split conserved with zero drift"
