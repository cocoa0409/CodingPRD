  # ============================================================== cross_cutting_layers
  - section: cross_cutting_layers
    instances:
      - name: claim_update_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on DrawbackClaim.version: a PUT carrying the pre-update version succeeds and bumps to 2; replaying the same observed version is rejected 412 ERR_STALE_VERSION even though the claim is still DRAFT."
        test_recipe:
          setup: ["client ACTIVE; DRAFT claim at version 1"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id", claim_v: "$.data.version "} }
          trigger:
            - { call: "PUT /customs/claims/${claimA}", payload: { period_end: "2026-04-30T00:00:00Z", expected_claim_version: "${claim_v}" }, as: Analyst, as_user_id: "u_an1", captures: { v2: "$.data.version "} }
            - { call: "PUT /customs/claims/${claimA}", payload: { period_end: "2026-05-31T00:00:00Z", expected_claim_version: "${claim_v}" }, as: Analyst, as_user_id: "u_an1", captures: { err: "$.data.error_id "} }
          assert:
            - "first PUT: captured v2 == 2"
            - "replay with stale version: captured err == ERR_STALE_VERSION (HTTP 412); period_end remains 2026-04-30"

      - name: entry_correction_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[entry-correction-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ImportEntry.version: two sequential corrections carrying the same observed version — the second is rejected 412 ERR_STALE_VERSION with no field drift."
        test_recipe:
          setup: ["client ACTIVE; CERTIFIED classification; entry E100 at version 1"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id", en_v: "$.data.version "} }
          trigger:
            - { call: "POST /customs/import-entries/${enA}/correct", payload: { duty_paid_cents: 80000, expected_import_entry_version: "${en_v}" }, as: Analyst, as_user_id: "u_an1", captures: { v2: "$.data.version", el2: "$.data.drawback_eligible_duty_cents "} }
            - { call: "POST /customs/import-entries/${enA}/correct", payload: { duty_paid_cents: 70000, expected_import_entry_version: "${en_v}" }, as: Analyst, as_user_id: "u_an1", captures: { err: "$.data.error_id "} }
          assert:
            - "first correction: captured v2 == 2 and el2 == 80000"
            - "stale replay: captured err == ERR_STALE_VERSION (HTTP 412); GET /customs/import-entries/${enA} duty_paid_cents == 80000"

      - name: classification_supersede_occ_flow
        claim_type: optimistic_concurrency
        grounds: ["validations[priority=5]", state_machines.HTSClassification.CERTIFIED_to_SUPERSEDED, entities.HTSClassification.fields.supersedes_id]
        distinguishing_aspect: "Supersede is an OCC-guarded create-with-supersede: carrying the current version creates the DRAFT successor with supersedes_id set and flips the old one SUPERSEDED; the stale replay then fails — the old row is terminal."
        test_recipe:
          setup: ["client ACTIVE; classification CERTIFIED; version captured from a fresh GET"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "GET /customs/classifications/${cls}", payload: {}, as: Analyst, as_user_id: "u_an1", captures: { cls_v: "$.data.version "} }
          trigger:
            - { call: "POST /customs/classifications/${cls}/supersede", payload: { product_sku: "PANT-01", hts_code: "6203.42.4036", country_of_origin: "CN", duty_rate_bps: 1200, declared_unit_value_cents: 5000, expected_classification_version: "${cls_v}" }, as: Analyst, as_user_id: "u_an1", captures: { new_cls: "$.data.id", new_st: "$.data.status", new_sup: "$.data.supersedes_id "} }
          assert:
            - "captured new_st == DRAFT and new_sup == ${cls} (self-referential link)"
            - "GET /customs/classifications/${cls}: status == SUPERSEDED"
            - "GET /customs/classifications?supersedes_id=${cls} returns exactly the new classification"

      - name: cascading_side_effects_version_bumps
        claim_type: cascading_side_effects
        grounds: ["endpoints[POST /customs/claims/{id}/lines]", entities.DrawbackClaim]
        distinguishing_aspect: "One line-add mutates four aggregates: line created, entry version 1->2, export version 1->2, claim version 1->2 — a single write fans out with observable version increments on every touched entity."
        test_recipe:
          setup: ["client ACTIVE; CERTIFIED classification; entry E100 (v1); export X1 (v1); DRAFT claim (v1)"]
          setup_api_calls:
