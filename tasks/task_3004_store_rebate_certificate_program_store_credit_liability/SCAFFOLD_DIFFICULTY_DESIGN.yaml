              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Rita Retail", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-NL2", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
              as: GuestService
              captures: { r: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "REJECT", rejection_reason: "illegible receipt" }
              as: GuestService
            - call: "POST /stores/${s}/rebate-submissions/${sub}/resubmit"
              payload: {}
              as: Customer
              as_user_id: "${ac}"
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "REJECT", rejection_reason: "still illegible" }
              as: GuestService
            - call: "POST /stores/${s}/rebate-submissions/${sub}/resubmit"
              payload: {}
              as: Customer
              as_user_id: "${ac}"
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
