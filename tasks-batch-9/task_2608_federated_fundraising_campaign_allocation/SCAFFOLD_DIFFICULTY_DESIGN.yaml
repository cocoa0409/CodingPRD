  - rule_id: cross_entity_state_dependency
    instances:
      - name: campaign_open_gated_by_employer_partnership_status
        grounds:
          - state_machines.Campaign.PLANNED_to_OPEN
          - state_machines.Employer.PROSPECT_to_ACTIVE
          - validations.priority_10_ERR_EMPLOYER_NOT_ACTIVE
          - errors.ERR_EMPLOYER_NOT_ACTIVE
          - entities.Employer.fields.active_campaign_count
          - endpoints.POST_fundraising_campaigns_id_open
        distinguishing_aspect: |
          Entity pair Campaign x Employer. The Campaign is in the only state from which open is
          legal (PLANNED) and the payload is empty, so nothing about the campaign itself can be
          faulted - the transition is gated purely by the OTHER entity's state
          (Employer.status == PROSPECT). The identical call flips from 409 to 200 after the
          employer alone transitions, and the employer's derived active_campaign_count only then
          starts counting. Note the failure is NOT ERR_CAMPAIGN_INVALID_STATE (priority 12):
          the cross-entity rule sits at priority 10, ahead of the own-state rule.
        test_recipe:
          setup:
            - "One employer left in PROSPECT (created, never activated)."
            - "One campaign of that employer in PLANNED with window [2026-07-01, 2026-09-30]."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Silverpoint Credit Union", employee_count: 260, payroll_periods_per_year: 24, historical_shrinkage_rate_bps: 400 }
              as: UnitedFundAdmin
              captures: { emp_id: $.data.id, emp_status: $.data.status }
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp_id}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30", loss_reserve_amount: 0.00 }
              as: UnitedFundAdmin
              captures: { camp_id: $.data.id, camp_posture: $.data.posture }
          trigger:
            - call: "POST /fundraising/campaigns/${camp_id}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/employers/${emp_id}/activate"
              payload: {}
              as: UnitedFundAdmin
              captures: { emp_status_after: $.data.status }
            - call: "POST /fundraising/campaigns/${camp_id}/open"
              payload: {}
              as: UnitedFundAdmin
              captures: { camp_posture_after: $.data.posture }
          assert:
            - "Before the trigger: Employer.${emp_id}.status == PROSPECT and Campaign.${camp_id}.posture == PLANNED"
            - "First open attempt returns HTTP 409 with error_id == ERR_EMPLOYER_NOT_ACTIVE (priority 10), not ERR_CAMPAIGN_INVALID_STATE"
            - "The rejected attempt left no trace: Campaign.${camp_id}.posture is still PLANNED and Employer.${emp_id}.active_campaign_count == 0"
            - "After activate: Employer.${emp_id}.status == ACTIVE"
            - "The byte-identical second open attempt now returns 200 with Campaign.${camp_id}.posture == OPEN"
            - "Employer.${emp_id}.active_campaign_count == 1 only after the campaign actually opened"
            - "Pledge recording is now reachable: a subsequent POST /fundraising/campaigns/${camp_id}/pledges succeeds, whereas it would have failed priority 11 before"

      - name: award_gated_by_cycle_posture_restricted_by_another_agency
        grounds:
          - state_machines.AllocationCycle.OPEN_to_RESTRICTED
          - state_machines.AllocationCycle.RESTRICTED_to_OPEN
          - state_machines.AllocationRequest.PANEL_APPROVED_to_AWARDED
          - validations.priority_19_ERR_CYCLE_RESTRICTED
          - errors.ERR_CYCLE_RESTRICTED
          - calculations.community_impact_fund_allocation
          - endpoints.POST_fundraising_allocation_cycles_id_awards
        distinguishing_aspect: |
          A different entity pair - AllocationRequest x AllocationCycle - and a different flavour
          of dependency: the blocking state of the cycle is produced by a THIRD party (another
          agency's probation), so a perfectly approved request with ample pool is refused for
          reasons entirely outside its own aggregate. The reinstate reversal then drops
          suspended_request_ratio back under CYCLE_RESTRICT_RATIO, returns the cycle to OPEN, and
          the identical award payload (with a refreshed cycle version) succeeds with the pinned
          arithmetic. Only the cycle changed between the two attempts.
        test_recipe:
          setup:
            - "Agencies AG_X and AG_Y both driven to GOOD_STANDING by reviews certified at 100.00; neither holds any designation, so designated_passthrough_ytd == 0.00 on both."
            - "One OPEN cycle: focus_priority_area FINANCIAL_STABILITY, opening_undesignated_pool 300000.00, max_award_per_agency 200000.00, window [2026-07-01, 2026-12-31), three conflict-free panel seats."
            - "AG_X submits REQ_X (30000.00, BASIC_NEEDS) and leaves it SUBMITTED - never scored."
            - "AG_Y submits REQ_Y (60000.00, HEALTH), collects three (100,100,100) scores and is finalized to PANEL_APPROVED with composite_score 100.00."
            - "AG_X is then re-reviewed and certified at 69.50, which probates AG_X, suspends REQ_X, and drives suspended_request_ratio to 1/2 == 0.5000 >= CYCLE_RESTRICT_RATIO 0.34, so the cycle is RESTRICTED with awards_blocked == true."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
