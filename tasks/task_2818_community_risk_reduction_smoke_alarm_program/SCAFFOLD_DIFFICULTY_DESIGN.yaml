              payload: { install_outcome: "COMPLETE", occupant_signature_name: "A. Ibarra" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
            - call: "POST /crr/visits/${v2_id}/complete"
              payload: { install_outcome: "COMPLETE", occupant_signature_name: "B. Nwosu" }
