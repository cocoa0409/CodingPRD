          assert:
            - "The renewal Invoice (period_start 2026-07-01) has exactly one InvoiceLine kind=OVERAGE with amount_cents == 2"

      - name: dunning_max_attempts_boundary_two_stays_three_cancels
        grounds:
          - calculations.dunning_retry_schedule
          - state_machines.Subscription.billing_status.PAST_DUE_to_PAST_DUE
          - state_machines.Subscription.lifecycle_status.ACTIVE_to_CANCELED
          - entities.Subscription.fields.dunning_attempt
          - endpoints["POST /_billing/run-dunning"]
        distinguishing_aspect: |
          A different metric (integer attempt counter) on a different endpoint (run-dunning): after
          the 2nd failed attempt the subscription is still ACTIVE/PAST_DUE (dunning_attempt 2); only
          the 3rd failed attempt (== DUNNING_MAX_ATTEMPTS) cancels it.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; PRO plan trial_days 14; account converted ACTIVE, card then failing"
            - "Renewal at 2026-07-01; first dunning fails (attempt 1), second at 2026-07-04 fails (attempt 2)"
          setup_api_calls:
