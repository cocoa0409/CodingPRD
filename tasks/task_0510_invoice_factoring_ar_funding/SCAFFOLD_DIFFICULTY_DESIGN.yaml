# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >=2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every formula-derived assert is a pre-computed literal.
# Default logical clock = 2026-05-01T00:00:00Z. Funding occurs at the default
# clock, so funded_at = 2026-05-01T00:00:00Z unless the clock is advanced first.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_provisional_vs_final_fee_diverge_at_45_days
        grounds:
          - calculations.factoring_fee
          - entities.Invoice.fields.accrued_fee_cents
          - entities.Invoice.fields.final_fee_cents
          - state_machines.Invoice.FUNDED_to_SETTLED
        distinguishing_aspect: "PROVISIONAL flat per-diem (read of accrued_fee_cents) and FINAL tiered per-diem (pinned final_fee_cents at settlement) produce DIFFERENT cents on the same Invoice for the same 45-day span: 2250 vs 2625."
        test_recipe:
          setup:
            - "Program (fee_rate=0.0005, tier2=1.5, tier3=2.0), Client APPROVED (advance 0.85, credit_limit 100000000, conc 0.90), Debtor APPROVED (ceiling 100000000, verification_required=true), relationship NOTICED."
            - "Invoice INV-DVC face=100000 funded at default clock (funded_at=2026-05-01); accrued_fee read while FUNDED at clock=2026-06-15 (45 days) = 2250."
            - "A single collection received_at=2026-06-15 (45 days) for full 100000 settles the invoice; FINAL fee = 2625."
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "F1", default_fee_rate_per_day: 0.0005, tier2_multiplier: 1.5, tier3_multiplier: 2.0, recourse_grace_days: 90 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "Acme LLC", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.90 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "BigCo", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: true }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-DVC", face_amount_cents: 100000, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "PHONE", confirmed_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/purchase-batches"
              payload: { client_id: "${client_id}", batch_reference: "B-DVC", invoice_ids: ["${inv_id}"] }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { batch_id: $.data.id }
            - call: "POST /factoring/purchase-batches/${batch_id}/fund"
              payload: { expected_client_version: "${client_v}" }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /factoring/invoices/${inv_id}"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { client_v2: $.data.version }
            - call: "POST /factoring/invoices/${inv_id}/postings"
              payload: { amount_cents: 100000, received_at: "2026-06-15T00:00:00Z", payer: "DEBTOR", expected_client_version: "${client_v2}" }
              as: CollectionsOfficer
              as_user_id: "co_1"
          assert:
            - "Before settlement GET /factoring/invoices/${inv_id} returns accrued_fee_cents == 2250 (PROVISIONAL, flat 0.0005*100000*45)"
            - "After full posting, Invoice.${inv_id}.status == SETTLED"
            - "Settlement for ${inv_id} (GET /factoring/settlements?invoice_id=${inv_id}) has fee_applied_cents == 2625 and rebate_cents == 12375"
            - "Invoice.${inv_id}.final_fee_cents == 2625 (FINAL tiered) which differs from the 2250 PROVISIONAL reading"

      - name: dvc_advance_split_vs_concentration_ratio_diff_domains
        grounds:
          - calculations.advance_split
          - calculations.debtor_concentration
          - entities.Invoice.fields.advance_amount_cents
          - entities.Debtor.fields.outstanding_face_cents
        distinguishing_aspect: "Two valid computations on DIFFERENT entity domains: advance_split rounds a per-Invoice principal (round_half_up) while debtor_concentration is an exact cross-multiplied ratio test on Debtor/Client face aggregates — different subjects, different arithmetic."
        test_recipe:
          setup:
            - "Program/Client APPROVED (advance 0.85, credit_limit 100000000, default conc 0.50), one Debtor APPROVED ceiling 100000000, relationship NOTICED."
            - "Invoice INV-SPLIT face=12345; advance_split yields advance_amount_cents=10493 (round_half_up of 10493.25) and reserve_held_cents=1852."
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "F2", default_fee_rate_per_day: 0.0005 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "SplitCo", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.50 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "DebtCo", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-SPLIT", face_amount_cents: 12345, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 12345 }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/purchase-batches"
              payload: { client_id: "${client_id}", batch_reference: "B-SPLIT", invoice_ids: ["${inv_id}"] }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /factoring/purchase-batches/${batch_id}/fund"
              payload: { expected_client_version: "${client_v}" }
              as: FundingOfficer
              as_user_id: "fo_1"
          assert:
            - "Invoice.${inv_id}.advance_amount_cents == 10493 (round_half_up(12345*0.85)=round_half_up(10493.25))"
            - "Invoice.${inv_id}.reserve_held_cents == 1852 (12345-10493)"
            - "Debtor.${debtor_id}.outstanding_face_cents == 12345 after funding (face aggregate, distinct domain from the per-invoice advance rounding)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_final_fee_round_per_tier_then_sum
        grounds:
          - calculations.factoring_fee
          - entities.Invoice.fields.final_fee_cents
          - state_machines.Invoice.FUNDED_to_SETTLED
        distinguishing_aspect: "Mode (b) nested rounding order pinned: FINAL fee on face=33333 over 45 days rounds EACH tier then sums (500+375=875); summing-then-rounding the raw per-tier products (499.995+374.99625=874.99125 -> 875) is a coincidental match here but the pinned order is round-per-tier-then-sum and tier1 alone rounds 499.995 -> 500."
        test_recipe:
          setup:
            - "Program/Client/Debtor APPROVED as in dvc setup; relationship NOTICED; verification_required=false."
            - "Invoice INV-CF face=33333 funded at default clock; full collection received_at=2026-06-15 (45 days)."
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "F3", default_fee_rate_per_day: 0.0005, tier2_multiplier: 1.5, tier3_multiplier: 2.0 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "TierCo", requested_advance_rate_pct: 0.80 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.80, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.90 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "TierDebt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-CF", face_amount_cents: 33333, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 33333 }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/purchase-batches"
              payload: { client_id: "${client_id}", batch_reference: "B-CF", invoice_ids: ["${inv_id}"] }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { batch_id: $.data.id }
            - call: "POST /factoring/purchase-batches/${batch_id}/fund"
              payload: { expected_client_version: "${client_v}" }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "GET /factoring/clients/${client_id}"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { client_v2: $.data.version }
          trigger:
            - call: "POST /factoring/invoices/${inv_id}/postings"
              payload: { amount_cents: 33333, received_at: "2026-06-15T00:00:00Z", payer: "DEBTOR", expected_client_version: "${client_v2}" }
              as: CollectionsOfficer
              as_user_id: "co_1"
          assert:
            - "Invoice.${inv_id}.final_fee_cents == 875 (tier1 round_half_up(33333*0.0005*30)=round_half_up(499.995)=500; tier2 round_half_up(33333*0.0005*1.5*15)=round_half_up(374.99625)=375; sum 875)"
            - "Invoice.${inv_id}.status == SETTLED"

      - name: cf_settlement_waterfall_three_bucket_minmax
        grounds:
          - calculations.settlement_rebate
          - entities.Settlement.fields.principal_applied_cents
          - entities.Settlement.fields.fee_applied_cents
          - entities.Settlement.fields.rebate_cents
        distinguishing_aspect: "Mode (a) >=3-input non-linear interaction: waterfall over [collected, advance_amount, final_fee] via nested min/max in pinned order principal->fee->rebate; collected=90000, advance=85000, fee=2250 yields principal 85000, fee 2250, rebate 2750 (floored max(0, .) at the tail)."
        test_recipe:
          setup:
            - "Program/Client/Debtor APPROVED; relationship NOTICED; verification_required=false. Invoice INV-WF face=100000 advance 0.85 funded at default clock."
            - "Two postings: 50000 then 40000 (total 90000, < collectible face 100000 but settlement uses close-collection short-pay). Use OUTSTANDING short-pay path so collected 90000 < 100000 collectible."
            - "Clock advanced to 2026-06-10 (40 days) so OUTSTANDING auto-transition fires; received_at of last posting 2026-06-10 (40 days), FINAL fee = 2250."
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "F4", default_fee_rate_per_day: 0.0005, tier2_multiplier: 1.5, tier3_multiplier: 2.0 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "WfCo", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.90 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "WfDebt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-WF", face_amount_cents: 100000, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/purchase-batches"
              payload: { client_id: "${client_id}", batch_reference: "B-WF", invoice_ids: ["${inv_id}"] }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { batch_id: $.data.id }
            - call: "POST /factoring/purchase-batches/${batch_id}/fund"
              payload: { expected_client_version: "${client_v}" }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /factoring/clients/${client_id}"
              payload: {}
              as: CollectionsOfficer
              as_user_id: "co_1"
              captures: { client_v2: $.data.version }
            - call: "POST /factoring/invoices/${inv_id}/postings"
              payload: { amount_cents: 50000, received_at: "2026-06-09T00:00:00Z", payer: "DEBTOR", expected_client_version: "${client_v2}" }
              as: CollectionsOfficer
              as_user_id: "co_1"
            - call: "GET /factoring/clients/${client_id}"
              payload: {}
              as: CollectionsOfficer
              as_user_id: "co_1"
              captures: { client_v3: $.data.version }
            - call: "POST /factoring/invoices/${inv_id}/postings"
              payload: { amount_cents: 40000, received_at: "2026-06-10T00:00:00Z", payer: "DEBTOR", expected_client_version: "${client_v3}" }
              as: CollectionsOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /factoring/invoices/${inv_id}/close-collection"
              payload: {}
              as: CollectionsOfficer
              as_user_id: "co_1"
          assert:
            - "Invoice.${inv_id}.status == SHORT_PAID"
            - "Settlement for ${inv_id} has principal_applied_cents == 85000, fee_applied_cents == 2250, rebate_cents == 2750 (waterfall min/max chain; FINAL fee@40d=2250)"
            - "Invoice.${inv_id}.advance_outstanding_cents == 0 (85000 principal fully repaid by 90000 collected)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_invoice_branch_settled_vs_shortpaid_buyback
        grounds:
          - state_machines.Invoice.OUTSTANDING_to_SETTLED
          - state_machines.Invoice.OUTSTANDING_to_SHORT_PAID
          - state_machines.Invoice.SHORT_PAID_to_BOUGHT_BACK
        distinguishing_aspect: "Invoice is a branching fork-join: from OUTSTANDING the same collection workflow forks to SETTLED (full pay, rebate side-effects) vs SHORT_PAID->BOUGHT_BACK (partial pay, buyback side-effects); the two branches mutate disjoint side-effect sets (rebate vs buyback ledger entries)."
        test_recipe:
          setup:
            - "RECOURSE relationship NOTICED; Invoice INV-BR face=100000 funded, clock advanced past due so OUTSTANDING; one posting 80000 (received_at 2026-06-10, 40 days) then close-collection => SHORT_PAID with advance_outstanding 5000."
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "F5", default_fee_rate_per_day: 0.0005, tier2_multiplier: 1.5, tier3_multiplier: 2.0 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "BrCo", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.90 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "BrDebt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-BR", face_amount_cents: 100000, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/purchase-batches"
              payload: { client_id: "${client_id}", batch_reference: "B-BR", invoice_ids: ["${inv_id}"] }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { batch_id: $.data.id }
            - call: "POST /factoring/purchase-batches/${batch_id}/fund"
              payload: { expected_client_version: "${client_v}" }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /factoring/clients/${client_id}"
              payload: {}
              as: CollectionsOfficer
              as_user_id: "co_1"
              captures: { client_v2: $.data.version }
            - call: "POST /factoring/invoices/${inv_id}/postings"
              payload: { amount_cents: 80000, received_at: "2026-06-10T00:00:00Z", payer: "DEBTOR", expected_client_version: "${client_v2}" }
              as: CollectionsOfficer
              as_user_id: "co_1"
            - call: "POST /factoring/invoices/${inv_id}/close-collection"
              payload: {}
              as: CollectionsOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /factoring/invoices/${inv_id}/buyback"
              payload: { trigger_reason: "CLIENT_REQUEST" }
              as: CollectionsOfficer
              as_user_id: "co_1"
          assert:
            - "Invoice.${inv_id}.status == BOUGHT_BACK (SHORT_PAID branch terminal, NOT SETTLED)"
            - "Buyback for ${inv_id} has buyback_amount_cents == 7250 (advance_outstanding 5000 + uncovered FINAL fee 2250 at clock 2026-06-10 = 40 days; fee_already_covered 0)"
