          - validations.priority_15_uniqueness
          - state_machines.Disclosure.review_status.transitions.SUBMITTED_to_SUPERSEDED
          - errors.ERR_DUPLICATE_DISCLOSURE_CYCLE
        distinguishing_aspect: "The same second create is either a 409 or a 201 depending on the incumbent's review_status: DRAFT is not a supersede-able source state so uniqueness bites, while SUBMITTED is, so the incumbent moves to SUPERSEDED and the create succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; investigator INV with a DRAFT disclosure D1 for cycle 2026-ANNUAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
