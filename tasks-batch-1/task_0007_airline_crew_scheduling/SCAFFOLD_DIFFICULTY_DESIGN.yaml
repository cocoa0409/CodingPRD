  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: sick_call_acknowledge_to_reserve_accept_to_assignment_recovered_chain
        grounds:
          - state_machines.SickCall.transitions.REPORTED_to_ACKNOWLEDGED
          - state_machines.ReserveCallup.transitions.OFFERED_to_ACCEPTED
          - state_machines.Assignment.transitions.CONFIRMED_to_RECOVERED
          - state_machines.SickCall.transitions.ACKNOWLEDGED_to_CLOSED
        distinguishing_aspect: |
          Depth-3 cascade originating at POST /sick-calls/{id}/acknowledge:
          (link 1) SickCall REPORTED->ACKNOWLEDGED and creates ReserveCallup;
          (link 2, caused by link 1, NOT by the original action) when reserve
          accepts, ReserveCallup OFFERED->ACCEPTED triggers Assignment
          CONFIRMED->RECOVERED and creates a replacement Assignment;
          (link 3, caused by link 2) SickCall ACKNOWLEDGED->CLOSED. The
          triggering transition is sick-call acknowledge.
