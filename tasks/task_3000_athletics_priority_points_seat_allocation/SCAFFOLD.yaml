    path: "/athletics/relocation-requests"
    description: "List relocation and upgrade requests; the reverse-reachability channel for all five RelocationRequest FKs."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: ["donor_id?", "current_seat_assignment_id?", "target_section_id?", "selection_event_id?", "granted_seat_assignment_id?", "request_type?", "status?", "limit?", "offset?"]
    output: RelocationRequest[]
    side_effects: []
  - method: GET
    path: "/athletics/relocation-requests/{id}"
    description: "Fetch one relocation or upgrade request."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: []
    output: RelocationRequest
    side_effects: []

  # ---- donor and gift surface ---------------------------------------------
  - method: POST
    path: "/athletics/donors"
    description: "Register a donor. donor_status starts ACTIVE and every point field starts at zero."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 201
    input: [full_name, email, alumni_status, entity_type, "season_ticket_first_cycle_year?"]
    output: Donor
    side_effects: ["initialises every point and counter field to 0", "sets donor_status to ACTIVE and status_effective_date to the current logical clock instant"]
  - method: POST
    path: "/athletics/donors/{id}/status-change"
    description: "Move the donor along the donor_status machine; the alumni bonus and transfer preconditions both hinge on the resulting status."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: [new_status, effective_date, reason, expected_donor_version]
    output: Donor
    side_effects: ["applies the §1.2 Donor transition", "increments Donor.version by 1"]
  - method: POST
    path: "/athletics/donors/{id}/household-link"
    description: "Link two JOINT_HOUSEHOLD donors as partners, which is the factual precondition for a DIVORCE-basis transfer."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: [partner_donor_id, expected_donor_version]
    output: Donor
    side_effects: ["sets household_partner_donor_id on both donors", "increments Donor.version by 1 on both donors"]
  - method: POST
    path: "/athletics/donors/{id}/gifts"
    description: "Record a gift for the donor. cycle_year is derived from gift_date, never supplied."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 201
    input: [gift_date, amount_cents, designation, "gift_status?"]
    output: Gift
    side_effects: ["derives cycle_year from the calendar year of gift_date", "adds amount_cents to Donor.cumulative_giving_cents when gift_status is RECEIVED", "increments Donor.version by 1"]
  - method: POST
    path: "/athletics/gifts/{id}/settle"
    description: "Settle a pledged gift as RECEIVED or REFUNDED; the gift_status is what separates the PROVISIONAL and CERTIFIED point variants."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: [new_status]
    output: Gift
    side_effects: ["applies the §1.2 Gift transition", "adjusts Donor.cumulative_giving_cents", "increments Gift.version by 1 and Donor.version by 1"]
  - method: POST
    path: "/athletics/donors/{id}/season-ticket-renewals"
    description: "Record one season of season-ticket tenure for the donor, feeding the tenure component of the point formula."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: [cycle_year]
    output: Donor
    side_effects: ["increments season_ticket_seasons_purchased by 1 for a cycle_year not already recorded", "sets season_ticket_first_cycle_year when it was unset", "increments Donor.version by 1"]

  # ---- annual recalculation surface ---------------------------------------
  - method: POST
    path: "/athletics/point-recalculations"
    description: "Open the annual recalculation for a cycle_year in status DRAFT."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 201
    input: [cycle_year, cutoff_date, dispute_window_end]
    output: PointRecalculation
    side_effects: ["sets initiated_by_user_id to X-User-ID, which becomes the segregation-of-duties comparand at certify"]
  - method: POST
    path: "/athletics/point-recalculations/{id}/run"
    description: "Score every donor under both point variants and append the ledger generation."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PointRecalculation
    side_effects: ["runs priority_point_score per donor per variant", "appends PointLedgerEntry rows", "recomputes Donor.certified_points", "sets donors_processed_count", "increments PointRecalculation.version by 1 and every scored Donor.version by 1"]
  - method: POST
    path: "/athletics/point-recalculations/{id}/send-communications"
    description: "Notify donors of their recalculated points and open the dispute window."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PointRecalculation
    side_effects: ["sets communication_sent_count to donors_processed_count", "moves status to COMMUNICATED", "increments PointRecalculation.version by 1"]
  - method: POST
    path: "/athletics/point-recalculations/{id}/certify"
    description: "Freeze the cycle, assign ranks, and cascade staleness into published slots, events and relocation requests. Requires a certifier other than the initiator."
    roles: [PointsCertifier]
    code: 200
    input: [expected_recalculation_version]
    output: PointRecalculation
    side_effects: ["assigns Donor.rank_position over the ranked pool", "marks mismatched SCHEDULED slots STALE", "moves any event that just had a slot marked STALE and retains no SCHEDULED slot to SLOTS_STALE", "blocks AWAITING_SELECTION relocation requests on those events", "sets certified_points_sum, certified_by_user_id and certified_at", "increments PointRecalculation.version by 1"]

  # ---- dispute surface -----------------------------------------------------
  - method: POST
    path: "/athletics/point-disputes"
    description: "File a dispute against a communicated recalculation; only the owning donor may file."
    roles: [Donor, DevelopmentOfficer]
    code: 201
    input: [donor_id, recalculation_id, claimed_points_delta, basis_note]
    output: PointDispute
    side_effects: ["blocks certification of the parent recalculation until the dispute reaches a terminal state"]
  - method: POST
    path: "/athletics/point-disputes/{id}/review"
    description: "Take the dispute under review; the first reviewer becomes the segregation-of-duties comparand at decide."
    roles: [DisputeAnalyst]
    code: 200
    input: []
    output: PointDispute
    side_effects: ["sets reviewed_by_user_id on the first review only", "increments PointDispute.version by 1"]
  - method: POST
    path: "/athletics/point-disputes/{id}/request-info"
    description: "Ask the donor for supporting information, capped by INFO_REQUEST_ROUND_CAP."
    roles: [DisputeAnalyst]
    code: 200
    input: [info_note]
    output: PointDispute
    side_effects: ["moves status to INFO_REQUESTED", "increments PointDispute.version by 1"]
  - method: POST
    path: "/athletics/point-disputes/{id}/provide-info"
    description: "Donor answers the information request, returning the dispute to UNDER_REVIEW and closing one round."
    roles: [Donor]
    code: 200
    input: [response_note]
    output: PointDispute
    side_effects: ["increments info_request_rounds by 1", "moves status back to UNDER_REVIEW", "increments PointDispute.version by 1"]
  - method: POST
    path: "/athletics/point-disputes/{id}/decide"
    description: "Uphold or deny the dispute; upholding adjusts the donor's dispute_adjustment_points and certified_points."
    roles: [PolicyCommittee]
    code: 200
    input: [decision, "granted_points_delta?"]
    output: PointDispute
    side_effects: ["sets granted_points_delta and decided_by_user_id", "adds the granted delta to Donor.dispute_adjustment_points on UPHOLD", "recomputes Donor.certified_points", "increments PointDispute.version by 1 and Donor.version by 1"]

  # ---- point transfer surface ---------------------------------------------
  - method: POST
    path: "/athletics/point-transfers"
    description: "Request a point transfer between donors. The basis fixes the percentage cap; a basis whose factual precondition fails lands the transfer in EXCEPTION_PENDING."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 201
    input: [source_donor_id, recipient_donor_id, basis, points_amount, expected_source_donor_version]
    output: PointTransfer
    side_effects: ["computes transfer_pct_cap, max_transferable_points and exception_required", "increments Donor.version by 1 on the source donor"]
  - method: POST
    path: "/athletics/point-transfers/{id}/policy-decision"
    description: "Grant the policy exception an EXCEPTION_PENDING transfer needs, or refuse the transfer outright."
    roles: [PolicyCommittee]
    code: 200
    input: [decision, note]
    output: PointTransfer
    side_effects: ["sets exception_granted_by_user_id on GRANT and moves status to REQUESTED", "moves status to DENIED on REFUSE", "increments PointTransfer.version by 1"]
  - method: POST
    path: "/athletics/point-transfers/{id}/approve"
    description: "Move the points, recompute both donors' certified_points, and cascade the eligibility and posture changes."
    roles: [PointsCertifier]
    code: 200
    input: []
    output: PointTransfer
    side_effects: ["adjusts transferred_points_in and transferred_points_out", "recomputes certified_points for both donors", "flips newly-short SeatAssignment rows to UNDERWATER", "recomputes Section.underwater_seat_count and pricing_posture", "increments PointTransfer.version by 1 and both Donor.version values by 1"]
  - method: POST
    path: "/athletics/point-transfers/{id}/reverse"
    description: "Compensating action: undo an approved transfer so the donor pair's certified-points total returns to its pre-transfer value."
    roles: [PointsCertifier]
    code: 200
    input: [reason]
    output: PointTransfer
    side_effects: ["reverses both transferred-point counters", "recomputes certified_points for both donors", "restores ELIGIBLE on rows that again meet required_points", "recomputes Section.underwater_seat_count and pricing_posture", "increments PointTransfer.version by 1 and both Donor.version values by 1"]

  # ---- section, seat and renovation surface -------------------------------
  - method: POST
    path: "/athletics/sections"
    description: "Create a seating section with its capacity, per-seat donation requirement and points floor."
    roles: [PlatformAdmin]
    code: 201
    input: [section_code, venue_code, seat_capacity, per_seat_requirement_cents, required_points_per_seat]
    output: Section
    side_effects: ["appends the opening { cycle_year, per_seat_requirement_cents } entry to requirement_history, using the UTC calendar year of the current logical clock instant as cycle_year", "initialises every inventory counter to 0 and pricing_posture to NORMAL"]
  - method: POST
    path: "/athletics/sections/{id}/seats"
    description: "Add a physical seat to the section, bounded by seat_capacity."
    roles: [PlatformAdmin]
    code: 201
    input: [row_label, seat_number, "max_concurrent_holds?"]
    output: Seat
    side_effects: ["increments Section.seat_row_count and Section.seats_available", "increments Section.version by 1"]
  - method: POST
    path: "/athletics/sections/{id}/reprice"
    description: "Reset the section's market per-seat requirement for a cycle_year outside any renovation, appending to requirement_history so earlier occupants keep their grandfathered rate."
    roles: [PlatformAdmin]
    code: 200
    input: [per_seat_requirement_cents, cycle_year, expected_section_version]
    output: Section
    side_effects: ["replaces per_seat_requirement_cents", "appends { cycle_year, per_seat_requirement_cents } to requirement_history", "increments Section.version by 1"]
  - method: POST
    path: "/athletics/sections/{id}/renovation"
    description: "Drive the section's renovation pipeline: SURVEY, REPRICE, START_RESEATING, COMPLETE or ABANDON. START_RESEATING reprices and re-invoices the entire seated donor base of the section."
    roles: [PlatformAdmin]
    code: 200
    input: [renovation_action, "post_renovation_capacity?", "post_renovation_requirement_cents?", "reseating_recalculation_id?", expected_section_version]
    output: Section
    side_effects: ["applies the §1.2 Section renovation transition", "on START_RESEATING replaces capacity and requirement, decommissions surplus seats in created_at ASC order, reprices every seated assignment, sets reseating_invoice_total_cents by rounding per seat before summing, and moves those rows to INVOICED", "recomputes pricing_posture", "increments Section.version by 1"]

  # ---- selection event and slot surface -----------------------------------
  - method: POST
    path: "/athletics/point-recalculations/{id}/selection-events"
    description: "Create a seat-selection, postseason or away-game event on a recalculation, with its window and slot geometry."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 201
    input: [event_type, window_start, window_end, slot_minutes, "slot_buffer_minutes?", "eligible_donor_min_points?"]
    output: SelectionEvent
    side_effects: ["starts the event in DRAFT with zero slots"]
  - method: POST
    path: "/athletics/selection-events/{id}/publish-slots"
    description: "Rank the eligible donor pool and lay one slot per donor across the event window; also the recovery call that republishes a stale event."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SelectionEvent
    side_effects: ["ranks the pool by donor_rank_position", "creates one SelectionSlot per donor with slot_index, half-open window and rank_at_publish", "returns BLOCKED relocation requests on this event to AWAITING_SELECTION", "sets published_slot_count and scheduled_slot_count", "increments SelectionEvent.version by 1"]
  - method: POST
    path: "/athletics/selection-events/{id}/gate"
    description: "Open the event for picks or close it, forfeiting the remaining slots and denying the outstanding relocation requests."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: [to_status]
    output: SelectionEvent
    side_effects: ["on OPEN checks the half-open window against sibling events on the same recalculation", "on CLOSED forfeits remaining SCHEDULED slots and denies outstanding relocation requests", "increments SelectionEvent.version by 1"]
  - method: POST
    path: "/athletics/selection-slots/{id}/pick"
    description: "Donor consumes their slot to take a seat, creating the priced SeatAssignment. The seat is claimed under OCC on Seat.version."
    roles: [Donor]
    code: 201
    input: [seat_id, expected_seat_version]
    output: SeatAssignment
    side_effects: ["creates the SeatAssignment in HELD/UNBILLED with a closed [hold_start, hold_end] window of HOLD_MINUTES", "prices the row via seat_requirement_amount and postseason_allocation_charge", "moves the seat to HELD and shifts the section's inventory counters", "releases an expired prior hold with release_reason SUPERSEDED_BY_NEW_HOLD", "moves the slot to CONSUMED and decrements scheduled_slot_count", "increments Seat.version by 1, Section.version by 1 and SelectionSlot.version by 1"]
  - method: POST
    path: "/athletics/selection-slots/{id}/forfeit"
    description: "Donor gives up their slot without picking."
    roles: [Donor, DevelopmentOfficer]
    code: 200
    input: [reason]
    output: SelectionSlot
    side_effects: ["moves the slot to FORFEITED", "decrements SelectionEvent.scheduled_slot_count", "increments SelectionSlot.version by 1"]

  # ---- assignment lifecycle surface ---------------------------------------
  - method: POST
    path: "/athletics/seat-assignments/{id}/occupancy"
    description: "Advance the occupancy axis of a seat assignment: confirm the hold as ASSIGNED or release it back to the pool."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: [to_status, "release_reason?", expected_seat_assignment_version]
    output: SeatAssignment
    side_effects: ["applies the §1.2 occupancy transition", "restores or advances the seat and the section's inventory counters", "grants a matching relocation request on ASSIGNED", "walks the consuming slot from CONSUMED to FORFEITED on release", "increments SeatAssignment.version by 1"]
  - method: POST
    path: "/athletics/seat-assignments/{id}/billing"
    description: "Advance the payment axis of a seat assignment independently of its occupancy axis."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: [to_status, "amount_cents?"]
    output: SeatAssignment
    side_effects: ["applies the §1.2 payment transition", "sets amount_paid_cents on PAID", "increments SeatAssignment.version by 1"]

  # ---- relocation and upgrade surface -------------------------------------
  - method: POST
    path: "/athletics/relocation-requests"
    description: "Donor asks to relocate or upgrade into another section through a published event. A newer request from the same donor supersedes their prior outstanding one, so the create is guarded by OCC on Donor.version."
    roles: [Donor, DevelopmentOfficer]
    code: 201
    input: [donor_id, current_seat_assignment_id, target_section_id, selection_event_id, request_type, expected_donor_version]
    output: RelocationRequest
    side_effects: ["supersedes the donor's prior AWAITING_SELECTION request", "increments Donor.pending_request_count", "increments Donor.version by 1"]
  - method: POST
    path: "/athletics/relocation-requests/{id}/decide"
    description: "Grant the move onto a named target seat, or deny it."
    roles: [DevelopmentOfficer, PlatformAdmin]
    code: 200
    input: [decision, "target_seat_id?", "decision_note?"]
    output: RelocationRequest
    side_effects: ["on GRANT creates a MARKET-priced SeatAssignment on the target seat, sets granted_seat_assignment_id and releases the prior assignment", "decrements Donor.pending_request_count", "increments RelocationRequest.version by 1"]

  # ---- test-driving surface -----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time, so every window, cutoff and hold expiry is deterministic."
    roles: [PlatformAdmin, DevelopmentOfficer, PointsCertifier, DisputeAnalyst, PolicyCommittee, Donor]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["moves the logical clock, which changes which slot windows, dispute windows and hold windows are live"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Donor-role caller acts on a dispute, slot, assignment or relocation request whose donor_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the certifier equals the recalculation's initiator, or the dispute decider equals its first reviewer"
  - id: ERR_DONOR_NOT_FOUND
    http: 404
    condition: "the donor id in the path does not resolve"
  - id: ERR_GIFT_NOT_FOUND
    http: 404
    condition: "the gift id in the path does not resolve"
  - id: ERR_RECALCULATION_NOT_FOUND
    http: 404
    condition: "the point-recalculation id in the path does not resolve"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "the point-ledger-entry id in the path does not resolve"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "the point-dispute id in the path does not resolve"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "the point-transfer id in the path does not resolve"
  - id: ERR_SECTION_NOT_FOUND
    http: 404
    condition: "the section id in the path does not resolve"
  - id: ERR_SEAT_NOT_FOUND
    http: 404
    condition: "the seat id in the path does not resolve"
  - id: ERR_SEAT_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "the seat-assignment id in the path does not resolve"
  - id: ERR_SELECTION_EVENT_NOT_FOUND
    http: 404
    condition: "the selection-event id in the path does not resolve"
  - id: ERR_SELECTION_SLOT_NOT_FOUND
    http: 404
    condition: "the selection-slot id in the path does not resolve"
  - id: ERR_RELOCATION_REQUEST_NOT_FOUND
    http: 404
    condition: "the relocation-request id in the path does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, unrecognised enum value, constraint violation, or pagination parameter outside its range"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "an id supplied in the request body does not resolve to an existing row"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the supplied expected_<parent>_version does not equal the parent's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the resource's current state does not admit the requested transition"
  - id: ERR_RECALCULATION_NOT_CERTIFIED
    http: 409
    condition: "an operation that depends on a frozen ranking targets a recalculation that is not in status CERTIFIED"
  - id: ERR_SECTION_UNDER_RENOVATION
    http: 409
    condition: "a seat operation targets a section whose status is UNDER_RENOVATION or CLOSED"
  - id: ERR_EVENT_SLOTS_STALE
    http: 409
    condition: "a pick targets a slot on an event that has fallen to SLOTS_STALE"
  - id: ERR_EVENT_NOT_OPEN_FOR_REQUESTS
    http: 409
    condition: "a relocation request names an event that is not in SLOTS_PUBLISHED or OPEN"
  - id: ERR_TRANSFER_POLICY_EXCEPTION_REQUIRED
    http: 422
    condition: "approve is called on a transfer whose basis precondition fails and whose policy exception has not been granted"
  - id: ERR_OUTSIDE_SLOT_WINDOW
    http: 422
    condition: "the pick instant lies outside the slot's half-open [slot_start, slot_end) window"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "a dispute is filed or decided at or after the parent recalculation's dispute_window_end"
  - id: ERR_SELECTION_WINDOW_OVERLAP
    http: 409
    condition: "opening an event whose half-open window overlaps a sibling event's window on the same recalculation"
  - id: ERR_SEAT_NOT_AVAILABLE
    http: 409
    condition: "the target seat is already ASSIGNED or has been DECOMMISSIONED"
  - id: ERR_SEAT_HOLD_CONFLICT
    http: 409
    condition: "the pick instant falls inside as many closed [hold_start, hold_end] windows on the seat as max_concurrent_holds permits"
  - id: ERR_INFO_REQUEST_LIMIT_REACHED
    http: 422
    condition: "a third information request is attempted on a dispute that has already completed INFO_REQUEST_ROUND_CAP rounds"
  - id: ERR_NO_ELIGIBLE_DONORS
    http: 422
    condition: "publish-slots finds an empty eligible donor pool for the event"
  - id: ERR_SLOT_WINDOW_OVERFLOW
    http: 422
    condition: "the last computed slot's slot_end would fall after the event's window_end"
  - id: ERR_HOUSEHOLD_LINK_INVALID
    http: 409
    condition: "a household link targets the same donor, a donor whose entity_type is not JOINT_HOUSEHOLD, or a donor already linked elsewhere"
  - id: ERR_RELOCATION_TARGET_INVALID
    http: 422
    condition: "a granted relocation omits target_seat_id or names a seat outside target_section_id"
  - id: ERR_SEAT_POINTS_SHORTFALL
    http: 422
    condition: "the donor's certified_points is below the target section's required_points_per_seat"
  - id: ERR_SEAT_DONATION_SHORTFALL
    http: 402
    condition: "the amount tendered does not cover total_due_cents, or a relocation request is filed while the donor's current assignment still owes money"
  - id: ERR_TRANSFER_AMOUNT_EXCEEDS_BALANCE
    http: 422
    condition: "points_amount exceeds max_transferable_points or the source donor's current certified_points"
  - id: ERR_SECTION_CAPACITY_EXCEEDED
    http: 409
    condition: "adding a seat would push seat_row_count above the section's seat_capacity"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: DevelopmentOfficer
    description: "Development-office staff who maintain the donor book, record gifts and run the annual recalculation up to communication."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/donors"
      - "POST /athletics/donors/{id}/gifts"
      - "POST /athletics/gifts/{id}/settle"
      - "POST /athletics/donors/{id}/season-ticket-renewals"
      - "POST /athletics/point-recalculations"
      - "POST /athletics/point-recalculations/{id}/run"
      - "POST /athletics/point-recalculations/{id}/send-communications"
      - "POST /athletics/point-recalculations/{id}/selection-events"
      - "POST /athletics/selection-events/{id}/publish-slots"
      - "POST /athletics/selection-events/{id}/gate"
      - "POST /athletics/seat-assignments/{id}/occupancy"
      - "POST /athletics/seat-assignments/{id}/billing"
      - "POST /athletics/relocation-requests/{id}/decide"
    shared_operations:
      - "every GET"
      - "POST /athletics/donors/{id}/status-change"
      - "POST /athletics/donors/{id}/household-link"
      - "POST /athletics/point-transfers"
      - "POST /athletics/point-disputes"
      - "POST /athletics/selection-slots/{id}/forfeit"
      - "POST /athletics/relocation-requests"
      - "POST /_clock/set_current_utc"
  - name: PointsCertifier
    description: "Independent certifier who freezes an annual cycle and moves approved point transfers; may never certify a cycle they initiated."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/point-recalculations/{id}/certify"
      - "POST /athletics/point-transfers/{id}/approve"
      - "POST /athletics/point-transfers/{id}/reverse"
    shared_operations:
      - "every GET"
      - "POST /_clock/set_current_utc"
  - name: DisputeAnalyst
    description: "Analyst who works donor point disputes but never decides them."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/point-disputes/{id}/review"
      - "POST /athletics/point-disputes/{id}/request-info"
    shared_operations:
      - "GET /athletics/donors"
      - "GET /athletics/donors/{id}"
      - "GET /athletics/donors/{id}/gifts"
      - "GET /athletics/point-ledger-entries"
      - "GET /athletics/point-ledger-entries/{id}"
      - "GET /athletics/point-recalculations/{id}"
      - "GET /athletics/point-disputes"
