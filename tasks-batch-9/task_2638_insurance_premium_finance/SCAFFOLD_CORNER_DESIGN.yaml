      - name: error_triggerable_entity_state_conflicts_report_the_addressed_entity
        claim_type: error_triggerable
        grounds:
          - validations.priority_13_ERR_POLICY_STATE_INVALID
          - validations.priority_17_ERR_ENDORSEMENT_STATE_INVALID
          - validations.priority_21_ERR_VERIFICATION_ALREADY_RECORDED
        distinguishing_aspect: |
          The catalog carries a separate 409 per entity, and the code must name the entity whose state
          blocked the call — not the agreement that happens to own it. A fully attested policy refuses
          both a third attestation and a reopen, and the choice of code is itself ordered: priority 13
          (the policy's state) outranks priority 21 (the duplicate attestation), so a repeat carrier
          attestation on a VERIFIED policy reports ERR_POLICY_STATE_INVALID, while the same repeat on a
          policy still PENDING_VERIFICATION reports ERR_VERIFICATION_ALREADY_RECORDED. Endorsements
          give the same shape from both dead ends, DECLINED and FINANCED.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime has an effective License"
            - "note A has two policies: P1 is fully attested and VERIFIED, P2 is left PENDING_VERIFICATION with only the carrier's attestation on file"
            - "note A is therefore never activated, which keeps both policies addressable"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { sc_rule: "$.data.id" }
            - call: "POST /state-rate-rules/${sc_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { sc_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { sc_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { sc_insurer: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${sc_insured}", producer_agent_id: "${sc_agent}", state_rule_id: "${sc_rule}", down_payment_cents: 200000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sc_agr: "$.data.id" }
            - call: "POST /agreements/${sc_agr}/policies"
              payload: { insurer_id: "${sc_insurer}", policy_number: "MC-SC-1", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sc_p1: "$.data.id" }
            - call: "POST /agreements/${sc_agr}/policies"
              payload: { insurer_id: "${sc_insurer}", policy_number: "MC-SC-2", gross_premium_cents: 400000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sc_p2: "$.data.id" }
            - call: "POST /agreements/${sc_agr}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /policies/${sc_p1}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${sc_insurer}"
            - call: "POST /policies/${sc_p1}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${sc_agent}"
              captures: { sc_v2_id: "$.data.id" }
            - call: "POST /policies/${sc_p2}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${sc_insurer}"
