  - rule_id: boundary_precision_check
    instances:
      - name: eligibility_income_exactly_at_free_limit_inclusive
        grounds:
          - calculations.eligibility_tier_determination
          - state_machines.Member.APPLIED_to_ACTIVE
        distinguishing_aspect: |
          Boundary on the income metric via the decide endpoint: free_limit(4)
          = 1500000 + 3 x 500000 = 3000000; income == 3000000 takes FREE
          (inclusive <=), while income == 3000001 (one cent over) takes REDUCED.
        test_recipe:
          setup: ["two applicants, household_size 4, incomes exactly 3000000 and 3000001"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club K", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Edge Free", date_of_birth: "2012-01-01", grade: 7, household_size: 4, household_income_cents: 3000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m_free: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Edge Reduced", date_of_birth: "2012-01-01", grade: 7, household_size: 4, household_income_cents: 3000001 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m_red: $.data.id }
          trigger:
            - { call: "POST /members/${m_free}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m_red}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
          assert:
            - "Member.${m_free}.eligibility_tier == FREE (income == free_limit is inclusive)"
            - "Member.${m_red}.eligibility_tier == REDUCED (one cent over the free limit)"
            - "Member.${m_free}.weekly_fee_cents == 0 and Member.${m_red}.weekly_fee_cents == 2500 (round_half_up(5000 x 0.5))"

