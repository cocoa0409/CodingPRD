    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: company_name
        type: string
        source: input
        description: "Client organization name."
      - name: billing_email
        type: string
        source: input
        description: "Email used on invoices; must be unique across active Clients."
        constraints: "unique among Client rows whose status IN {ACTIVE}"
      - name: tax_exempt
        type: boolean
        source: input
        description: "When true, sales tax is not levied on this Client's orders."
        default: false
      - name: gratuity_policy
        type: enum
        source: input
        description: "Whether gratuity is auto-applied (INCLUDED) or left to the client (OPTIONAL)."
        default: "INCLUDED"
        constraints: "enum: INCLUDED | OPTIONAL"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the client account."
        default: "ACTIVE"
        constraints: "enum: ACTIVE | SUSPENDED"

  - name: EventPackage
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation. This is the package's catalog version, snapshotted onto an Order at confirmation."
