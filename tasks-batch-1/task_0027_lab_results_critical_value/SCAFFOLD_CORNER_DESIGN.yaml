scaffold_corner_design:

  # ===========================================================================
  # Entities — Creation, Required Fields, Defaults, Type Constraints, Not Found
  # ===========================================================================
  - section: entities
    instances:

      - name: patient_creation_with_all_required_fields_returns_201
        claim_type: Creation
        grounds:
          - entities.Patient
          - endpoints[POST /patients]
        distinguishing_aspect: |
          POST /patients with mrn, full_name, date_of_birth returns 201, response includes
          server-minted id, created_at, updated_at, version=1, and an age_band computed eagerly
          from the date_of_birth using the pinned clock.
        test_recipe:
          setup:
            - "Clock pinned to 2026-05-28T08:00:00Z; a LabDirector exists"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9900000001", full_name: "Director Base", role_type: "LAB_DIRECTOR", phone_e164: "+12025559001" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "9900000002", full_name: "Tech Base", role_type: "LAB_TECH", phone_e164: "+12025559002", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-CR001", full_name: "Created Patient", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_id: $.data.id, pat_age: $.data.age_band, pat_v: $.data.version }
          assert:
            - "trigger response status code == 201"
            - "Patient.${pat_id}.mrn == 'MRN-CR001'"
            - "Patient.${pat_id}.age_band == 'ADULT'"
            - "Patient.${pat_id}.version == 1"
            - "Patient.${pat_id}.results_release_count == 0"
            - "Patient.${pat_id}.critical_incidents_count == 0"

      - name: patient_creation_missing_mrn_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /patients]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients omitting mrn fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Clock pinned; LabTech exists"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9910000001", full_name: "Director Inv", role_type: "LAB_DIRECTOR", phone_e164: "+12025559101" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "9910000002", full_name: "Tech Inv", role_type: "LAB_TECH", phone_e164: "+12025559102", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Missing MRN", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_INVALID_REQUEST'"
            - "trigger response status code == 400"

      - name: patient_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /patients/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /patients/{uuid} with a never-used UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "LabTech exists"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9920000001", full_name: "Director Nf", role_type: "LAB_DIRECTOR", phone_e164: "+12025559201" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "9920000002", full_name: "Tech Nf", role_type: "LAB_TECH", phone_e164: "+12025559202", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_NOT_FOUND'"
            - "trigger response status code == 404"

      - name: patient_duplicate_mrn_returns_duplicate_identifier
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.mrn
          - errors[ERR_DUPLICATE_IDENTIFIER]
          - validations[priority=15]
        distinguishing_aspect: "Two POST /patients with identical mrn → second fails with ERR_DUPLICATE_IDENTIFIER (409)."
        test_recipe:
          setup:
            - "Clock pinned; LabTech and one Patient with mrn=MRN-DUP exist"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9930000001", full_name: "Director Dup", role_type: "LAB_DIRECTOR", phone_e164: "+12025559301" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "9930000002", full_name: "Tech Dup", role_type: "LAB_TECH", phone_e164: "+12025559302", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-DUP", full_name: "First", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-DUP", full_name: "Second", date_of_birth: "1985-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_DUPLICATE_IDENTIFIER'"
            - "trigger response status code == 409"

      - name: clinician_create_non_director_without_backup_returns_backup_required
        claim_type: Required Fields
        grounds:
          - errors[ERR_BACKUP_REQUIRED]
          - entities.Clinician.fields.backup_clinician_id
        distinguishing_aspect: "POST /clinicians with role_type != LAB_DIRECTOR but backup_clinician_id omitted returns ERR_BACKUP_REQUIRED."
        test_recipe:
          setup:
            - "Clock pinned; one LabDirector exists; no backup chain set up"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9940000001", full_name: "Director Bk", role_type: "LAB_DIRECTOR", phone_e164: "+12025559401" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
          trigger:
            - call: "POST /clinicians"
              payload: { npi: "9940000099", full_name: "Tech No Backup", role_type: "LAB_TECH", phone_e164: "+12025559499" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_BACKUP_REQUIRED'"
            - "trigger response status code == 422"

      - name: lab_order_creation_default_priority_routine
        claim_type: Defaults
        grounds:
          - entities.LabOrder.fields.priority
          - endpoints[POST /patients/{patient_id}/lab-orders]
        distinguishing_aspect: "POST /patients/{id}/lab-orders without `priority` defaults to ROUTINE."
        test_recipe:
          setup:
            - "Clock pinned; Patient and ORDERING_PROVIDER exist"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9950000001", full_name: "Director Df", role_type: "LAB_DIRECTOR", phone_e164: "+12025559501" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "9950000002", full_name: "Tech Df", role_type: "LAB_TECH", phone_e164: "+12025559502", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "9950000003", full_name: "Provider Df", role_type: "ORDERING_PROVIDER", phone_e164: "+12025559503", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { op_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-DF", full_name: "Df", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /patients/${pat_id}/lab-orders"
              payload: { ordering_clinician_id: "${op_id}", panel_code: "CMP" }
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { ord_id: $.data.id, ord_priority: $.data.priority }
          assert:
            - "LabOrder.${ord_id}.priority == 'ROUTINE'"
            - "LabOrder.${ord_id}.status == 'DRAFT'"

  # ===========================================================================
  # State Machines — Invalid Transitions, Terminal Lockdown, Initial State
  # ===========================================================================
  - section: state_machines
    instances:

      - name: cancel_order_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LabOrder.transitions.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already CANCELLED LabOrder fails with ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup:
            - "Clock pinned; a LabOrder already in CANCELLED state"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9960000001", full_name: "Director CC", role_type: "LAB_DIRECTOR", phone_e164: "+12025559601" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "9960000002", full_name: "Tech CC", role_type: "LAB_TECH", phone_e164: "+12025559602", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "9960000003", full_name: "Provider CC", role_type: "ORDERING_PROVIDER", phone_e164: "+12025559603", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { op_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-CC", full_name: "CC", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/lab-orders"
              payload: { ordering_clinician_id: "${op_id}", panel_code: "CMP", priority: "ROUTINE" }
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /lab-orders/${ord_id}/cancel"
              payload: {}
              as: OrderingProvider
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /lab-orders/${ord_id}/cancel"
              payload: {}
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_INVALID_STATE'"
            - "LabOrder.${ord_id}.status == 'CANCELLED' (unchanged)"

      - name: collect_specimen_from_in_transit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Specimen.transitions.DRAFT_to_COLLECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /specimens/{id}/collect on a Specimen already in IN_TRANSIT fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A Specimen in IN_TRANSIT"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9970000001", full_name: "Director CI", role_type: "LAB_DIRECTOR", phone_e164: "+12025559701" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "9970000002", full_name: "Tech CI", role_type: "LAB_TECH", phone_e164: "+12025559702", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "9970000003", full_name: "Phleb CI", role_type: "PHLEBOTOMIST", phone_e164: "+12025559703", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { phleb_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "9970000004", full_name: "Provider CI", role_type: "ORDERING_PROVIDER", phone_e164: "+12025559704", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { op_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-CI", full_name: "CI", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/lab-orders"
              payload: { ordering_clinician_id: "${op_id}", panel_code: "CMP", priority: "ROUTINE" }
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /lab-orders/${ord_id}/specimens"
              payload: { collector_clinician_id: "${phleb_id}", container_code: "GREEN" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /specimens/${sp_id}/collect"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /specimens/${sp_id}/transit"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
          trigger:
            - call: "POST /specimens/${sp_id}/collect"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_INVALID_STATE'"
            - "Specimen.${sp_id}.status == 'IN_TRANSIT' (unchanged)"

      - name: new_lab_order_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.LabOrder.initial_state
          - entities.LabOrder.fields.status
        distinguishing_aspect: "Newly POSTed LabOrder.status == 'DRAFT'; specimens_count == 0; accessioned_count == 0."
        test_recipe:
          setup: ["Patient and ORDERING_PROVIDER exist"]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9980000001", full_name: "Director IS", role_type: "LAB_DIRECTOR", phone_e164: "+12025559801" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "9980000002", full_name: "Tech IS", role_type: "LAB_TECH", phone_e164: "+12025559802", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "9980000003", full_name: "Provider IS", role_type: "ORDERING_PROVIDER", phone_e164: "+12025559803", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { op_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-IS", full_name: "IS", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /patients/${pat_id}/lab-orders"
              payload: { ordering_clinician_id: "${op_id}", panel_code: "CMP", priority: "STAT" }
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { ord_id: $.data.id, ord_status: $.data.status, ord_spec: $.data.specimens_count, ord_acc: $.data.accessioned_count, ord_v: $.data.version }
          assert:
            - "LabOrder.${ord_id}.status == 'DRAFT'"
            - "LabOrder.${ord_id}.specimens_count == 0"
            - "LabOrder.${ord_id}.accessioned_count == 0"
            - "LabOrder.${ord_id}.version == 1"

      - name: cancel_order_after_resulted_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.LabOrder.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a LabOrder in terminal state RESULTED fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A LabOrder in RESULTED state (one RELEASED Result)"]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "9990000001", full_name: "Director TL", role_type: "LAB_DIRECTOR", phone_e164: "+12025559901" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "9990000002", full_name: "Tech TL", role_type: "LAB_TECH", phone_e164: "+12025559902", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "9990000003", full_name: "Phleb TL", role_type: "PHLEBOTOMIST", phone_e164: "+12025559903", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { phleb_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "9990000004", full_name: "Provider TL", role_type: "ORDERING_PROVIDER", phone_e164: "+12025559904", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { op_id: $.data.id }
            - call: "POST /instruments"
              payload: { instrument_code: "BCM-TL", analyte_panels_supported: ["CMP"], qc_buffer_minutes: 5 }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { inst_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-TL", full_name: "TL", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/lab-orders"
              payload: { ordering_clinician_id: "${op_id}", panel_code: "CMP", priority: "ROUTINE" }
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /lab-orders/${ord_id}/specimens"
              payload: { collector_clinician_id: "${phleb_id}", container_code: "GREEN" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /specimens/${sp_id}/collect"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /specimens/${sp_id}/transit"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /specimens/${sp_id}/accession"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
            - call: "POST /instrument-runs"
              payload: { instrument_id: "${inst_id}", specimen_id: "${sp_id}", scheduled_start: "2026-05-28T08:30:00Z", scheduled_end: "2026-05-28T08:40:00Z" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { run_id: $.data.id }
            - call: "POST /instrument-runs/${run_id}/complete"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
            - call: "POST /results"
              payload: { lab_order_id: "${ord_id}", specimen_id: "${sp_id}", run_id: "${run_id}", analyte_code: "K", numeric_value: 4.20, unit: "mmol/L", reference_low: 3.50, reference_high: 5.10, critical_low: 2.50, critical_high: 6.00 }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { res_id: $.data.id }
            - call: "GET /lab-orders/${ord_id}"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /results/${res_id}/release"
              payload: { expected_lab_order_version: "${ord_v}" }
              as: LabTech
              as_user_id: "${lt_id}"
          trigger:
            - call: "POST /lab-orders/${ord_id}/cancel"
              payload: {}
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_INVALID_STATE'"
            - "LabOrder.${ord_id}.status == 'RESULTED' (unchanged — terminal)"

      - name: result_released_to_amended_already_covered_by_difficulty
        claim_type: Valid Transition
        grounds:
          - state_machines.Result.transitions.RELEASED_to_AMENDED
        excluded_because:
          difficulty_instance: result_amendment_cycle_released_amended_released_chain
