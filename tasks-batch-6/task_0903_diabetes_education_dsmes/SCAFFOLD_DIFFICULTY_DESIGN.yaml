# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >=2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls/trigger call resolves to §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_provisional_vs_final_benefit_hours
        grounds:
          - calculations.enrollment_hours_dual
          - entities.Enrollment.fields.provisional_hours_used
          - entities.Enrollment.fields.final_hours_used
          - state_machines.Session.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: "On the Enrollment domain, provisional_hours_used counts SCHEDULED+CHECKED_IN+COMPLETED sessions from planned_minutes (2.5) while final_hours_used counts only COMPLETED sessions from actual_minutes (0.5); same data, different numbers."
        test_recipe:
          setup:
            - "Accredited program, TYPE_2 curriculum (required_hours 10), TYPE_2 MEDICARE patient (baseline 8.0), dietitian, ASSESSED referral, ACTIVE enrollment"
            - "Session A planned 60min COMPLETED with actual 45min; Session B planned 90min still SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "DV1 DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { dv1_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 Core", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { dv1_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "DV1-001", full_name: "Dana V", date_of_birth: "1970-01-01", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { dv1_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD One", npi: "1000000001", credential: "RD" }, as: ProgramCoordinator, captures: { dv1_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${dv1_prog}", patient_id: "${dv1_pat}", referring_provider_npi: "2000000001", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { dv1_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${dv1_ref}/assess", payload: { assessed_a1c: 8.0 }, as: Dietitian, as_user_id: "${dv1_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${dv1_ref}", curriculum_id: "${dv1_cur}" }, as: ProgramCoordinator, captures: { dv1_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${dv1_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { dv1_v2: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${dv1_enr}", dietitian_id: "${dv1_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-10T09:00:00Z", scheduled_end: "2026-05-10T10:00:00Z", expected_enrollment_version: "${dv1_v2}" }, as: Dietitian, as_user_id: "${dv1_die}", captures: { dv1_sa: "$.data.id" } }
            - { call: "GET /dsmes/enrollments/${dv1_enr}", payload: {}, as: ProgramCoordinator, captures: { dv1_v3: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${dv1_enr}", dietitian_id: "${dv1_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-11T09:00:00Z", scheduled_end: "2026-05-11T10:30:00Z", expected_enrollment_version: "${dv1_v3}" }, as: Dietitian, as_user_id: "${dv1_die}", captures: { dv1_sb: "$.data.id" } }
            - { call: "POST /dsmes/sessions/${dv1_sa}/check-in", payload: {}, as: Dietitian, as_user_id: "${dv1_die}" }
            - { call: "POST /dsmes/sessions/${dv1_sa}/complete", payload: { actual_minutes: 45 }, as: Dietitian, as_user_id: "${dv1_die}" }
          trigger:
            - { call: "GET /dsmes/enrollments/${dv1_enr}", payload: {}, as: ProgramCoordinator, captures: { dv1_prov: "$.data.provisional_hours_used", dv1_final: "$.data.final_hours_used" } }
          assert:
            - "Enrollment.${dv1_enr}.provisional_hours_used == 2.5"
            - "Enrollment.${dv1_enr}.final_hours_used == 0.5"

      - name: dv_projected_vs_measured_a1c
        grounds:
          - calculations.a1c_outcome_dual
          - entities.CarePlan.fields.projected_a1c_delta
          - entities.CarePlan.fields.final_a1c_delta
          - state_machines.CarePlan.OPEN_to_MET
        distinguishing_aspect: "On the CarePlan domain, projected_a1c_delta is min(final_hours_used*0.1, baseline-6.5)=0.4 while final_a1c_delta is baseline-measured=0.8; different entity domain than the hours dual-variant."
        test_recipe:
          setup:
            - "ACTIVE enrollment with 4.0 final hours completed (one 240-min COMPLETED session); OPEN CarePlan created afterward"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "DV2 DSMES", accreditation_body: "ADCES" }, as: ProgramCoordinator, captures: { dv2_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 Full", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { dv2_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "DV2-001", full_name: "Pat Two", date_of_birth: "1965-03-03", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { dv2_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD Two", npi: "1000000002", credential: "CDCES" }, as: ProgramCoordinator, captures: { dv2_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${dv2_prog}", patient_id: "${dv2_pat}", referring_provider_npi: "2000000002", referral_reason: "NEWLY_DIAGNOSED" }, as: ProgramCoordinator, captures: { dv2_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${dv2_ref}/assess", payload: { assessed_a1c: 8.0 }, as: Dietitian, as_user_id: "${dv2_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${dv2_ref}", curriculum_id: "${dv2_cur}" }, as: ProgramCoordinator, captures: { dv2_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${dv2_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { dv2_v2: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${dv2_enr}", dietitian_id: "${dv2_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-06T09:00:00Z", scheduled_end: "2026-05-06T13:00:00Z", expected_enrollment_version: "${dv2_v2}" }, as: Dietitian, as_user_id: "${dv2_die}", captures: { dv2_sa: "$.data.id" } }
            - { call: "POST /dsmes/sessions/${dv2_sa}/check-in", payload: {}, as: Dietitian, as_user_id: "${dv2_die}" }
            - { call: "POST /dsmes/sessions/${dv2_sa}/complete", payload: { actual_minutes: 240 }, as: Dietitian, as_user_id: "${dv2_die}" }
            - { call: "POST /dsmes/care-plans", payload: { enrollment_id: "${dv2_enr}", goal_description: "Lower A1c below 7", target_a1c: 7.0 }, as: Dietitian, as_user_id: "${dv2_die}", captures: { dv2_cp: "$.data.id" } }
          trigger:
            - { call: "POST /dsmes/care-plans/${dv2_cp}/close", payload: { outcome: "MET", measured_a1c: 7.2 }, as: Dietitian, as_user_id: "${dv2_die}", captures: { dv2_final: "$.data.final_a1c_delta" } }
          assert:
            - "CarePlan.${dv2_cp}.projected_a1c_delta == 0.4"
            - "CarePlan.${dv2_cp}.final_a1c_delta == 0.8"
            - "CarePlan.${dv2_cp}.status == MET"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cb_billing_units_min_and_modality_rate
        grounds:
          - calculations.session_billing
          - entities.Session.fields.billable_units
          - entities.Session.fields.charge_cents
        distinguishing_aspect: "Mode (a): billable_units = min(floor(actual/30), remaining_units) and charge = units*rate branches on modality — >=3 inputs (actual_minutes=90, remaining=20 units, modality INDIVIDUAL) with nested min and a conditional rate yielding units 3, charge 15000."
        test_recipe:
          setup:
            - "ACTIVE enrollment, fresh benefit (10.0h = 20 units), one INDIVIDUAL session planned 90min"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "CBA DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { cba_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 A", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { cba_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "CBA-001", full_name: "Cara B", date_of_birth: "1972-02-02", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 7.5 }, as: ProgramCoordinator, captures: { cba_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD A", npi: "1000000003", credential: "RD" }, as: ProgramCoordinator, captures: { cba_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${cba_prog}", patient_id: "${cba_pat}", referring_provider_npi: "2000000003", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { cba_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${cba_ref}/assess", payload: { assessed_a1c: 7.5 }, as: Dietitian, as_user_id: "${cba_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${cba_ref}", curriculum_id: "${cba_cur}" }, as: ProgramCoordinator, captures: { cba_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${cba_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { cba_v2: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${cba_enr}", dietitian_id: "${cba_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-07T09:00:00Z", scheduled_end: "2026-05-07T10:30:00Z", expected_enrollment_version: "${cba_v2}" }, as: Dietitian, as_user_id: "${cba_die}", captures: { cba_sess: "$.data.id" } }
            - { call: "POST /dsmes/sessions/${cba_sess}/check-in", payload: {}, as: Dietitian, as_user_id: "${cba_die}" }
          trigger:
            - { call: "POST /dsmes/sessions/${cba_sess}/complete", payload: { actual_minutes: 90 }, as: Dietitian, as_user_id: "${cba_die}", captures: { cba_units: "$.data.billable_units", cba_charge: "$.data.charge_cents" } }
          assert:
            - "Session.${cba_sess}.billable_units == 3"
            - "Session.${cba_sess}.charge_cents == 15000"
            - "Session.${cba_sess}.billing_status == SUBMITTED"

      - name: cb_per_session_round_then_sum_hours
        grounds:
          - calculations.session_hours_rounding
          - calculations.enrollment_hours_dual
          - entities.Enrollment.fields.final_hours_used
        distinguishing_aspect: "Mode (b): rounding order is pinned as round-each-session-then-sum — two COMPLETED sessions of 50 and 40 actual minutes give floor(50/30)+floor(40/30)=2 units=1.0h, NOT sum-then-round floor(90/30)=3 units=1.5h."
        test_recipe:
          setup:
            - "ACTIVE enrollment (required 10h); two COMPLETED sessions with actual 50min and 40min"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "CBB DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { cbb_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 B", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { cbb_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "CBB-001", full_name: "Cliff B", date_of_birth: "1968-05-05", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 9.0 }, as: ProgramCoordinator, captures: { cbb_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD B", npi: "1000000004", credential: "RN" }, as: ProgramCoordinator, captures: { cbb_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${cbb_prog}", patient_id: "${cbb_pat}", referring_provider_npi: "2000000004", referral_reason: "MEDICATION_CHANGE" }, as: ProgramCoordinator, captures: { cbb_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${cbb_ref}/assess", payload: { assessed_a1c: 9.0 }, as: Dietitian, as_user_id: "${cbb_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${cbb_ref}", curriculum_id: "${cbb_cur}" }, as: ProgramCoordinator, captures: { cbb_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${cbb_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { cbb_v2: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${cbb_enr}", dietitian_id: "${cbb_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-08T09:00:00Z", scheduled_end: "2026-05-08T10:00:00Z", expected_enrollment_version: "${cbb_v2}" }, as: Dietitian, as_user_id: "${cbb_die}", captures: { cbb_s1: "$.data.id" } }
            - { call: "GET /dsmes/enrollments/${cbb_enr}", payload: {}, as: ProgramCoordinator, captures: { cbb_v3: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${cbb_enr}", dietitian_id: "${cbb_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-08T11:00:00Z", scheduled_end: "2026-05-08T12:00:00Z", expected_enrollment_version: "${cbb_v3}" }, as: Dietitian, as_user_id: "${cbb_die}", captures: { cbb_s2: "$.data.id" } }
            - { call: "POST /dsmes/sessions/${cbb_s1}/check-in", payload: {}, as: Dietitian, as_user_id: "${cbb_die}" }
            - { call: "POST /dsmes/sessions/${cbb_s1}/complete", payload: { actual_minutes: 50 }, as: Dietitian, as_user_id: "${cbb_die}" }
            - { call: "POST /dsmes/sessions/${cbb_s2}/check-in", payload: {}, as: Dietitian, as_user_id: "${cbb_die}" }
            - { call: "POST /dsmes/sessions/${cbb_s2}/complete", payload: { actual_minutes: 40 }, as: Dietitian, as_user_id: "${cbb_die}" }
          trigger:
            - { call: "GET /dsmes/enrollments/${cbb_enr}", payload: {}, as: ProgramCoordinator, captures: { cbb_final: "$.data.final_hours_used" } }
          assert:
            - "Enrollment.${cbb_enr}.final_hours_used == 1.0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nl_enrollment_suspend_reinstate_cycle
        grounds:
          - state_machines.Enrollment.ACTIVE_to_SUSPENDED
          - state_machines.Enrollment.SUSPENDED_to_ACTIVE
          - entities.Enrollment.fields.no_show_count
        distinguishing_aspect: "Enrollment exhibits a cycle ACTIVE->SUSPENDED->ACTIVE: three NO_SHOWs suspend it, reinstate returns it to ACTIVE, and no_show_count stays 3 (not reset) — a non-linear cyclic machine."
        test_recipe:
          setup:
            - "ACTIVE enrollment; three 30-min SCHEDULED sessions each marked NO_SHOW causing SUSPENSION"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "NLA DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { nla_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 NLA", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { nla_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "NLA-001", full_name: "Nel A", date_of_birth: "1980-08-08", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.2 }, as: ProgramCoordinator, captures: { nla_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD NLA", npi: "1000000005", credential: "RD" }, as: ProgramCoordinator, captures: { nla_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${nla_prog}", patient_id: "${nla_pat}", referring_provider_npi: "2000000005", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { nla_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${nla_ref}/assess", payload: { assessed_a1c: 8.2 }, as: Dietitian, as_user_id: "${nla_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${nla_ref}", curriculum_id: "${nla_cur}" }, as: ProgramCoordinator, captures: { nla_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${nla_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { nla_v2: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${nla_enr}", dietitian_id: "${nla_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-09T09:00:00Z", scheduled_end: "2026-05-09T09:30:00Z", expected_enrollment_version: "${nla_v2}" }, as: Dietitian, as_user_id: "${nla_die}", captures: { nla_s1: "$.data.id" } }
            - { call: "GET /dsmes/enrollments/${nla_enr}", payload: {}, as: ProgramCoordinator, captures: { nla_v3: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${nla_enr}", dietitian_id: "${nla_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-09T10:00:00Z", scheduled_end: "2026-05-09T10:30:00Z", expected_enrollment_version: "${nla_v3}" }, as: Dietitian, as_user_id: "${nla_die}", captures: { nla_s2: "$.data.id" } }
            - { call: "GET /dsmes/enrollments/${nla_enr}", payload: {}, as: ProgramCoordinator, captures: { nla_v4: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${nla_enr}", dietitian_id: "${nla_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-09T11:00:00Z", scheduled_end: "2026-05-09T11:30:00Z", expected_enrollment_version: "${nla_v4}" }, as: Dietitian, as_user_id: "${nla_die}", captures: { nla_s3: "$.data.id" } }
            - { call: "POST /dsmes/sessions/${nla_s1}/no-show", payload: {}, as: Dietitian, as_user_id: "${nla_die}" }
            - { call: "POST /dsmes/sessions/${nla_s2}/no-show", payload: {}, as: Dietitian, as_user_id: "${nla_die}" }
            - { call: "POST /dsmes/sessions/${nla_s3}/no-show", payload: {}, as: Dietitian, as_user_id: "${nla_die}" }
          trigger:
            - { call: "POST /dsmes/enrollments/${nla_enr}/reinstate", payload: {}, as: ProgramCoordinator, captures: { nla_status: "$.data.status", nla_ns: "$.data.no_show_count" } }
          assert:
            - "Enrollment.${nla_enr}.status == ACTIVE"
            - "Enrollment.${nla_enr}.no_show_count == 3"

      - name: nl_session_parallel_encounter_billing_axes
        grounds:
          - state_machines.Session.CHECKED_IN_to_COMPLETED
          - state_machines.Session.billing.SUBMITTED_to_PAID
          - entities.Session.fields.encounter_status
          - entities.Session.fields.billing_status
        distinguishing_aspect: "Session carries two independent axes: encounter_status stays terminal COMPLETED while billing_status advances SUBMITTED->PAID via adjudication — parallel state dimensions on one entity (different entity than the Enrollment cycle)."
        test_recipe:
          setup:
            - "ACTIVE enrollment; one session COMPLETED (billing SUBMITTED) then adjudicated PAID"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "NLB DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { nlb_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 NLB", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { nlb_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "NLB-001", full_name: "Ned B", date_of_birth: "1975-07-07", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 7.8 }, as: ProgramCoordinator, captures: { nlb_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD NLB", npi: "1000000006", credential: "RD" }, as: ProgramCoordinator, captures: { nlb_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${nlb_prog}", patient_id: "${nlb_pat}", referring_provider_npi: "2000000006", referral_reason: "ANNUAL_FOLLOWUP" }, as: ProgramCoordinator, captures: { nlb_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${nlb_ref}/assess", payload: { assessed_a1c: 7.8 }, as: Dietitian, as_user_id: "${nlb_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${nlb_ref}", curriculum_id: "${nlb_cur}" }, as: ProgramCoordinator, captures: { nlb_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${nlb_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { nlb_v2: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${nlb_enr}", dietitian_id: "${nlb_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-12T09:00:00Z", scheduled_end: "2026-05-12T10:00:00Z", expected_enrollment_version: "${nlb_v2}" }, as: Dietitian, as_user_id: "${nlb_die}", captures: { nlb_sess: "$.data.id" } }
            - { call: "POST /dsmes/sessions/${nlb_sess}/check-in", payload: {}, as: Dietitian, as_user_id: "${nlb_die}" }
            - { call: "POST /dsmes/sessions/${nlb_sess}/complete", payload: { actual_minutes: 60 }, as: Dietitian, as_user_id: "${nlb_die}" }
          trigger:
            - { call: "POST /dsmes/sessions/${nlb_sess}/adjudicate", payload: { billing_decision: "PAID" }, as: BillingSpecialist, captures: { nlb_enc: "$.data.encounter_status", nlb_bill: "$.data.billing_status" } }
