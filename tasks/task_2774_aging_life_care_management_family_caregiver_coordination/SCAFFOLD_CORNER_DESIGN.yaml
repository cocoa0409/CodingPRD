          assert:
            - "07:00 start: after_hours_factor == 1.20 and billable_amount_cents == 6750 (15 x 22500 x 1.0 x 1.20 / 60)"
            - "08:00 start: after_hours_factor == 1.00 and billable_amount_cents == 5625 — hour 8 is the inclusive end of the after-hours window"
            - "17:00 start: after_hours_factor == 1.00 and billable_amount_cents == 5625"
            - "18:00 start: after_hours_factor == 1.20 and billable_amount_cents == 6750 — hour 18 is the inclusive start of the after-hours window"
            - "All four rows have rounded_minutes == 15, rate_multiplier == 1.0 and service_date == \"2026-08-10\"; the day total of 60 rounded minutes stays under DAILY_BILLABLE_CAP_MINUTES"

