# =============================================================================
# task_2253 — Commercial Fitness Equipment Manufacturing
# Seed tables (§1.0–§1.7). Difficulty band: beyond Expert (§0.4).
# =============================================================================

scenario: |
  2253. Commercial Fitness Equipment Manufacturing (commercial fitness equipment manufacturer): product development across cardio, strength and connected equipment with durability testing to commercial cycle counts, frame welding, powder coating and upholstery fabrication with color and branding options, electronics and console assembly with firmware loading and connectivity certification, order configuration for gym facility layouts with delivery and installation coordination, serialized asset registration for service history and warranty tracking, service network training, parts distribution and preventive maintenance program design, obsolescence and firmware support commitments for connected consoles, trade-in, refurbishment and secondary market policy

domain_name: commercial-fitness-equipment-manufacturing

# Flat/graph topology: peer collections are mounted at the API root, so there is
# no single owning top-level resource path. Every endpoint path in §1.5 is
# therefore rooted at "" (e.g. "/equipment-models", "/orders/{id}/quote").
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: graph_constraint
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # graph: EquipmentModel is self-referential (supersession chain), FirmwareCertification
  # is a many-to-many junction between FirmwareRelease and ModelRevision, SerializedAsset
  # is a four-way cross-aggregate node (revision × facility × order line × firmware).

  state_machine_shape: parallel
  # Order carries THREE independent state dimensions (config_status × fulfillment_status
  # × billing_status). Additionally ModelRevision is cyclic (IN_TESTING/TEST_FAILED → DRAFT
  # rework loop, QUOTED→QUOTED style re-quote on Order), SerializedAsset is branching
  # (REFURB_INTAKE → {REFURB_CERTIFIED, SCRAPPED}) with a compensating back-edge
  # (TRADE_IN_RETURNED → IN_SERVICE), and InstallJob is fork-join
  # (ON_SITE → {PUNCH_LIST, COMPLETED} → COMPLETED) with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # EquipmentModel → ModelRevision, Order → OrderLine, PMProgram → MaintenanceVisit
    - many_to_many         # FirmwareRelease ↔ ModelRevision via FirmwareCertification
    - self_referential     # EquipmentModel.supersedes_model_id → EquipmentModel.id (acyclic, depth-capped)
    - cross_aggregate      # SerializedAsset links order aggregate to service aggregate

  role_model: segregation_of_duties
  # The ComplianceOfficer who certifies a firmware/console pairing may not be the user who
  # submitted it (X-User-ID compared), and pricing (OrderPlanner) is separated from field
  # sign-off (ServicePartnerTech) so no single actor can both price and close an order.

  consistency_model: immediate

difficulty_level: beyond_expert   # 14 entities, 11 state machines, 10 calculations, 38 validations, 77 endpoints, 46 error codes, 6 roles

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

list_conventions:
  default_order: "every list endpoint returns rows ordered by created_at ASC, then id ASC as the deterministic tie-break"
  serialized_asset_order: "GET /serialized-assets orders by created_at ASC, then sequence_no ASC, so the assets minted from an order's first line come first"

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: EquipmentModel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Commercial model name", constraints: "1..120 chars, unique" }
      - { name: category, type: enum, source: input, description: "CARDIO | STRENGTH | CONNECTED — drives install hours, PM base hours and partner certification checks", constraints: "one of CARDIO, STRENGTH, CONNECTED" }
      - { name: duty_class, type: enum, source: input, description: "LIGHT_COMMERCIAL | FULL_COMMERCIAL | INSTITUTIONAL — drives DUTY_MIN_CYCLES, DUTY_UPLIFT_PCT and WARRANTY_DAYS", constraints: "one of LIGHT_COMMERCIAL, FULL_COMMERCIAL, INSTITUTIONAL" }
      - { name: unit_list_price_cents, type: integer, source: input, description: "Base list price in cents before finish surcharges and duty uplift", constraints: "> 0" }
      - { name: shipping_weight_kg, type: number, source: input, description: "Per-unit chargeable shipping weight in kg (2 decimals)", constraints: "> 0" }
      - { name: allowed_finish_codes, type: array, source: input, description: "Permitted powder-coat / upholstery / branding finish codes for this model", constraints: "non-empty subset of {GRAPHITE, ARCTIC_WHITE, CLUB_RED, CUSTOM_BRAND_DECAL, PREMIUM_UPHOLSTERY}" }
      - { name: console_platform, type: enum, source: input, description: "CONSOLE_T1 | CONSOLE_T2 | CONSOLE_X | null — console family for connected equipment", constraints: "REQUIRED and non-null when category == CONNECTED; MUST be null otherwise" }
      - { name: connected, type: boolean, source: computed, description: "= (category == CONNECTED); gates firmware certification, firmware support commitments and the unsupported-console trade-in penalty" }
      - { name: supersedes_model_id, type: string, source: input, description: "FK -> EquipmentModel.id; nullable; the model this one replaces in the catalogue. The supersession chain MUST be acyclic and at most SUPERSEDE_CHAIN_MAX_DEPTH edges long" }
      - { name: lifecycle_status, type: enum, source: computed, description: "PRE_RELEASE | ACTIVE | SUNSET | OBSOLETE — see calculations.model_lifecycle_rollup", default: "PRE_RELEASE" }
      - { name: released_revision_count, type: integer, source: computed, default: 0, description: "Count of own ModelRevision rows with status IN {RELEASED, SUNSET_ANNOUNCED, OBSOLETE}" }

  - name: ModelRevision
    parent: EquipmentModel
    common_fields: true
    fields:
      - { name: equipment_model_id, type: string, source: input, description: "FK -> EquipmentModel.id; owning model" }
      - { name: revision_code, type: string, source: input, description: "Engineering revision code", constraints: "1..40 chars, unique per equipment_model_id across rows with status != SUPERSEDED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | IN_TESTING | TEST_FAILED | QUALIFIED | RELEASED | SUNSET_ANNOUNCED | OBSOLETE | SUPERSEDED — see state_machines.ModelRevision" }
      - { name: target_cycle_count, type: integer, source: input, description: "Cycle count this revision is being tested to (used by the PROJECTED_EXTRAPOLATION variant for still-RUNNING runs)", constraints: ">= 1000" }
      - { name: firmware_baseline_version, type: string, source: input, description: "Console firmware baseline string; nullable for non-connected models" }
      - { name: min_required_cycles, type: integer, source: computed, description: "= DUTY_MIN_CYCLES[owning model.duty_class]; the qualification gate" }
      - { name: verified_cycle_count, type: integer, source: computed, default: 0, description: "VERIFIED_CHRONOLOGICAL variant of calculations.revision_cycle_qualification" }
      - { name: projected_cycle_count, type: integer, source: computed, default: 0, description: "PROJECTED_EXTRAPOLATION variant of calculations.revision_cycle_qualification" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Number of completed rework loops back to DRAFT; capped by REWORK_LIMIT" }
      - { name: qualified_at, type: datetime, source: system, description: "Logical clock instant of the DRAFT/IN_TESTING → QUALIFIED transition; null before" }
      - { name: released_at, type: datetime, source: system, description: "Logical clock instant of QUALIFIED → RELEASED; null before" }
      - { name: sunset_announced_at, type: datetime, source: system, description: "Logical clock instant of RELEASED → SUNSET_ANNOUNCED; null before" }
      - { name: firmware_support_until, type: datetime, source: computed, description: "= sunset_announced_at + FIRMWARE_SUPPORT_COMMITMENT_DAYS; null until sunset is announced" }

  - name: DurabilityTestRig
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Test cell name", constraints: "1..80 chars, unique" }
      - { name: parallel_station_count, type: integer, source: input, description: "Number of specimens the rig can cycle at once; aggregate-capacity ceiling for overlapping reservations", constraints: ">= 1, <= 8" }
      - { name: supported_duty_classes, type: array, source: input, description: "Duty classes this rig may test", constraints: "non-empty subset of {LIGHT_COMMERCIAL, FULL_COMMERCIAL, INSTITUTIONAL}" }
      - { name: occupied_station_count, type: integer, source: computed, default: 0, description: "Count of own DurabilityTestRun rows with status IN {RESERVED, RUNNING}" }

  - name: DurabilityTestRun
    parent: null
    common_fields: true
    fields:
      - { name: model_revision_id, type: string, source: input, description: "FK -> ModelRevision.id; revision under test" }
      - { name: test_rig_id, type: string, source: input, description: "FK -> DurabilityTestRig.id; rig reserved for this run" }
      - { name: window_start, type: datetime, source: input, description: "Reservation window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Reservation window end (INCLUSIVE — touching endpoints count as occupation, see validations[priority=33])", constraints: "> window_start" }
      - { name: target_cycles, type: integer, source: input, description: "Cycles this run is scheduled to accumulate", constraints: ">= 1000" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | RUNNING | COMPLETED | ABORTED — see state_machines.DurabilityTestRun" }
      - { name: outcome, type: enum, source: system, default: "PENDING", description: "PENDING | PASSED | FAILED — set by the RUNNING → COMPLETED transition" }
      - { name: achieved_cycles, type: integer, source: system, default: 0, description: "Cycles accumulated when the run completed (PASSED runs)" }
      - { name: failure_cycle_count, type: integer, source: system, description: "Cycle index at which the specimen failed; null unless outcome == FAILED" }
      - { name: superseded_by_rework, type: boolean, source: system, default: false, description: "Set true when the revision is reworked; a superseded run is excluded from BOTH cycle-count variants forever, which is what lets a reworked revision re-accumulate evidence from zero" }

  - name: FirmwareRelease
    parent: null
    common_fields: true
    fields:
      - { name: version_string, type: string, source: input, description: "Firmware build identifier", constraints: "1..40 chars, unique" }
      - { name: console_platform, type: enum, source: input, description: "CONSOLE_T1 | CONSOLE_T2 | CONSOLE_X — platform this build targets" }
      - { name: mandatory_security, type: boolean, source: input, default: false, description: "Marks a security build that connected assets must accept" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | WITHDRAWN — WITHDRAWN is produced by POST /firmware-releases/{id}/withdraw" }
      - { name: certified_revision_count, type: integer, source: computed, default: 0, description: "Count of own FirmwareCertification rows with cert_status == CERTIFIED" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Logical clock instant of withdrawal; null while ACTIVE" }

  - name: FirmwareCertification
    parent: null
    common_fields: true
    fields:
      - { name: firmware_release_id, type: string, source: input, description: "FK -> FirmwareRelease.id; build being certified" }
      - { name: model_revision_id, type: string, source: input, description: "FK -> ModelRevision.id; revision the build is certified against" }
      - { name: test_report_ref, type: string, source: input, description: "Connectivity test report reference", constraints: "1..80 chars" }
      - { name: cert_status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | CERTIFIED | REJECTED | REVOKED — see state_machines.FirmwareCertification" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitter; segregation-of-duties counterparty" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who certified; null before certification" }
      - { name: certified_at, type: datetime, source: system, description: "Logical clock instant of certification; null before" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Gym facility / chain account name", constraints: "1..120 chars" }
      - { name: freight_zone, type: enum, source: input, description: "Z1 | Z2 | Z3 | Z4 — selects FREIGHT_RATE_CENTS_PER_KG" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum confirmed-but-unsettled exposure in cents", constraints: ">= 0" }
      - { name: install_blackout_weekdays, type: array, source: input, default: [], description: "Weekday codes on which no install job may touch this facility", constraints: "subset of {MON, TUE, WED, THU, FRI, SAT, SUN}" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED is produced by POST /facilities/{id}/suspend" }
      - { name: open_order_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of quoted_total_cents over own Orders with config_status == CONFIRMED AND billing_status IN {QUOTED, INVOICED}" }
      - { name: tradein_credit_granted_cents, type: integer, source: computed, default: 0, description: "Cumulative trade-in credit granted by non-reversed trade-ins at this facility" }
      - { name: tradein_credit_applied_cents, type: integer, source: computed, default: 0, description: "Cumulative trade-in credit consumed by POST /orders/{id}/apply-tradein-credit" }
      - { name: tradein_credit_balance_cents, type: integer, source: computed, default: 0, description: "= tradein_credit_granted_cents - tradein_credit_applied_cents; conserved quantity of calculations.tradein_credit_ledger" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; buying facility" }
      - { name: config_status, type: enum, source: system, default: "CONFIGURING", description: "Dimension 1: CONFIGURING | CONFIRMED" }
      - { name: fulfillment_status, type: enum, source: system, default: "PENDING", description: "Dimension 2: PENDING | IN_PRODUCTION | STAGED | INSTALLING | INSTALLED" }
      - { name: billing_status, type: enum, source: system, default: "UNQUOTED", description: "Dimension 3: UNQUOTED | QUOTED | INVOICED | SETTLED" }
      - { name: requested_install_window_start, type: datetime, source: input, description: "Facility-requested delivery/install window start" }
      - { name: requested_install_window_end, type: datetime, source: input, description: "Facility-requested delivery/install window end", constraints: "> requested_install_window_start" }
      - { name: line_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of extended_price_cents over own OrderLines with status == ACTIVE (round-per-line-then-sum, see calculations.order_line_extended_price)" }
      - { name: install_amount_cents, type: integer, source: computed, default: 0, description: "Installation labour charge; estimated in the PROVISIONAL variant, actual-hours based in the FINAL variant" }
      - { name: volume_discount_cents, type: integer, source: computed, default: 0, description: "Tiered volume discount on discount_base_cents" }
      - { name: freight_cents, type: integer, source: computed, default: 0, description: "Zone freight charge, waived when discounted base reaches FREE_FREIGHT_THRESHOLD_CENTS" }
      - { name: punch_list_credit_cents, type: integer, source: computed, default: 0, description: "PUNCH_LIST_CREDIT_CENTS x punch_list_open_count recorded on the install job; FINAL variant only" }
      - { name: chargeable_weight_kg, type: number, source: computed, default: 0, description: "Sum over ACTIVE lines of quantity x model.shipping_weight_kg" }
      - { name: quoted_total_cents, type: integer, source: computed, default: 0, description: "PROVISIONAL variant output of calculations.order_total_assembly; 0 while billing_status == UNQUOTED" }
      - { name: final_total_cents, type: integer, source: computed, description: "FINAL variant output of calculations.order_total_assembly; null until billing_status == INVOICED" }
      - { name: price_variant_applied, type: enum, source: system, default: "NONE", description: "NONE | PROVISIONAL | FINAL — which variant last wrote the totals" }
      - { name: tradein_credit_applied_cents, type: integer, source: computed, default: 0, description: "Trade-in credit applied to this order" }
      - { name: amount_due_cents, type: integer, source: computed, description: "= final_total_cents - tradein_credit_applied_cents; null until billing_status == INVOICED" }
      - { name: quoted_at, type: datetime, source: system, description: "Logical clock instant of the most recent successful quote; null before" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; owning order" }
      - { name: model_revision_id, type: string, source: input, description: "FK -> ModelRevision.id; configured revision (MUST be RELEASED at line creation)" }
      - { name: quantity, type: integer, source: input, description: "Units of this configuration", constraints: ">= 1, <= 500" }
      - { name: finish_codes, type: array, source: input, description: "Powder-coat / upholstery / branding selections priced by FINISH_SURCHARGE_CENTS", constraints: "subset of the model's allowed_finish_codes; may be empty; no duplicates" }
      - { name: layout_zone_label, type: string, source: input, description: "Gym floor layout zone this line is destined for", constraints: "1..40 chars" }
      - { name: unit_price_cents, type: integer, source: computed, description: "= model.unit_list_price_cents + sum(FINISH_SURCHARGE_CENTS[finish_codes])" }
      - { name: extended_price_cents, type: integer, source: computed, description: "Per-line rounded extended price, see calculations.order_line_extended_price" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | VOIDED — VOIDED is produced by POST /order-lines/{id}/void" }
      - { name: assets_minted_count, type: integer, source: computed, default: 0, description: "SerializedAsset rows minted from this line at production completion" }

  - name: ServicePartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Service network partner name", constraints: "1..120 chars, unique" }
      - { name: region, type: enum, source: input, description: "R_NORTH | R_SOUTH | R_EAST | R_WEST" }
      - { name: certified_categories, type: array, source: input, description: "Equipment categories this partner is trained to install and service", constraints: "non-empty subset of {CARDIO, STRENGTH, CONNECTED}" }
      - { name: certified_technician_count, type: integer, source: input, description: "Head count of certified technicians", constraints: ">= 1" }
      - { name: certified_hours_capacity, type: number, source: input, description: "Annual committed-hours ceiling (2 decimals)", constraints: "> 0" }
      - { name: training_current_until, type: datetime, source: input, description: "Service-network training currency expiry; jobs and visits require this to be strictly after the logical clock" }
      - { name: committed_hours, type: number, source: computed, default: 0, description: "See calculations.partner_capacity_rollup" }
      - { name: coverage_status, type: enum, source: computed, default: "ACTIVE", description: "ACTIVE | OVER_COMMITTED — = OVER_COMMITTED iff committed_hours > certified_hours_capacity" }
      - { name: spare_stock_received_units, type: integer, source: computed, default: 0, description: "Cumulative spare units distributed to this partner; conserved total of calculations.spare_stock_ledger" }
      - { name: spare_stock_on_hand_units, type: integer, source: computed, default: 0, description: "Unreserved spare units available to reserve" }
      - { name: spare_stock_reserved_units, type: integer, source: computed, default: 0, description: "Spare units held by SCHEDULED maintenance visits" }
      - { name: spare_stock_consumed_units, type: integer, source: computed, default: 0, description: "Spare units burned by COMPLETED maintenance visits" }

  - name: InstallJob
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being delivered and installed" }
      - { name: service_partner_id, type: string, source: input, description: "FK -> ServicePartner.id; crew owner whose calendar this job occupies" }
      - { name: window_start, type: datetime, source: input, description: "Install window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Install window end (EXCLUSIVE — half-open, see validations[priority=32])", constraints: "> window_start" }
      - { name: travel_buffer_minutes, type: integer, source: system, default: 120, description: "= INSTALL_TRAVEL_BUFFER_MINUTES; appended after window_end to form the effective occupation" }
      - { name: estimated_labor_hours, type: number, source: input, description: "Crew hours booked against partner capacity while the job is open", constraints: "> 0, <= 400" }
      - { name: actual_labor_hours, type: number, source: system, description: "Hours reported at completion; drives the FINAL price variant; null before" }
      - { name: punch_list_open_count, type: integer, source: system, default: 0, description: "Open remediation items reported at completion; drives punch_list_credit_cents" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | ON_SITE | PUNCH_LIST | COMPLETED | ABORTED — see state_machines.InstallJob" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock instant the job reached COMPLETED; null before" }

  - name: SerializedAsset
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: system, description: "= '<revision_code>-' + zero-padded sequence_no; deterministic, never random" }
      - { name: sequence_no, type: integer, source: system, description: "Monotone per-ModelRevision counter assigned in (order_line.created_at ASC, unit index ASC) order at production completion" }
      - { name: model_revision_id, type: string, source: system, description: "FK -> ModelRevision.id; as-built revision" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; current owning facility (rewritten by resale)" }
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; line this unit was built for" }
      - { name: installed_firmware_release_id, type: string, source: system, description: "FK -> FirmwareRelease.id; currently loaded console build; null for non-connected assets" }
      - { name: status, type: enum, source: system, default: "BUILT", description: "BUILT | IN_SERVICE | TRADE_IN_RETURNED | REFURB_INTAKE | REFURB_CERTIFIED | RESOLD | SCRAPPED — see state_machines.SerializedAsset" }
      - { name: connectivity_support_status, type: enum, source: computed, default: "NOT_APPLICABLE", description: "NOT_APPLICABLE | SUPPORTED | SUNSET_TRACKED | SUPPORT_GAP | FIRMWARE_REVOKED — see calculations.asset_support_window" }
      - { name: warranty_starts_at, type: datetime, source: system, description: "Logical clock instant of install completion; null while BUILT" }
      - { name: warranty_expires_at, type: datetime, source: computed, description: "= warranty_starts_at + WARRANTY_DAYS[model.duty_class]; null while BUILT" }
      - { name: firmware_support_expires_at, type: datetime, source: computed, description: "Console support horizon; null when open-ended (see calculations.asset_support_window)" }
      - { name: support_gap_days, type: integer, source: computed, default: 0, description: "= max(0, floor(days(warranty_expires_at - firmware_support_expires_at))); > 0 means the console loses support inside the warranty" }
      - { name: annual_usage_hours, type: number, source: system, default: 0, description: "Latest reported annual usage hours; input to the PM usage factor" }
      - { name: service_history_count, type: integer, source: computed, default: 0, description: "COMPLETED MaintenanceVisit count against this asset" }
      - { name: accrued_service_labor_hours, type: number, source: computed, default: 0, description: "Sum of labor_hours over COMPLETED MaintenanceVisit rows for this asset" }
      - { name: declared_condition_grade, type: enum, source: system, description: "A | B | C declared at trade-in; null before; input to the valuation" }
      - { name: refurb_grade, type: enum, source: system, description: "A | B | C assigned at refurbishment certification; null before" }
      - { name: trade_in_valuation_cents, type: integer, source: computed, description: "Output of calculations.asset_trade_in_valuation; null before trade-in" }

  - name: PMProgram
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; covered facility" }
      - { name: service_partner_id, type: string, source: input, description: "FK -> ServicePartner.id; partner delivering the program" }
      - { name: tier, type: enum, source: input, description: "BASIC | PRO | PLATINUM — selects TIER_MULTIPLIER" }
      - { name: visit_interval_days, type: integer, source: input, description: "Nominal days between preventive visits; drives visits_per_year", constraints: ">= 30, <= 365" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | NEEDS_REVISION | TERMINATED — see state_machines.PMProgram" }
      - { name: covered_asset_count, type: integer, source: computed, default: 0, description: "SerializedAsset rows with status == IN_SERVICE and facility_id == this facility" }
      - { name: annual_labor_hours_committed, type: number, source: computed, default: 0, description: "Output of calculations.pm_program_annual_labor_hours (2 decimals)" }
      - { name: needs_revision_reason, type: enum, source: system, description: "CONSOLE_SUPPORT_LOST | FIRMWARE_REVOKED | null — why the program was flagged" }
      - { name: last_revised_at, type: datetime, source: system, description: "Logical clock instant of the most recent revise; null before" }

  - name: MaintenanceVisit
    parent: PMProgram
    common_fields: true
    fields:
      - { name: pm_program_id, type: string, source: input, description: "FK -> PMProgram.id; owning program" }
      - { name: serialized_asset_id, type: string, source: input, description: "FK -> SerializedAsset.id; asset serviced" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned visit instant" }
      - { name: reserved_units, type: integer, source: input, default: 0, description: "Spare units held from the partner's stock for this visit", constraints: ">= 0, <= 50" }
      - { name: labor_hours, type: number, source: system, description: "Hours reported at completion; null before", constraints: "> 0 when completing" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | ON_HOLD | COMPLETED | CANCELLED — see state_machines.MaintenanceVisit" }
      - { name: held_reason, type: enum, source: system, description: "PROGRAM_NEEDS_REVISION | null — why the visit was placed ON_HOLD by a cascade" }

# =============================================================================
# §1.2 State Machine Table  (11 machines; Order carries 3 parallel dimensions)
# =============================================================================
state_machines:

  - entity: ModelRevision
    field: status
    initial_state: DRAFT
    terminal_states: [OBSOLETE, SUPERSEDED]
    states: [DRAFT, IN_TESTING, TEST_FAILED, QUALIFIED, RELEASED, SUNSET_ANNOUNCED, OBSOLETE, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_TESTING
        trigger: "POST /model-revisions/{id}/submit-for-testing"
        preconditions:
          - "owning EquipmentModel.status is not SUSPENDED-equivalent: EquipmentModel.lifecycle_status != OBSOLETE"
          - "if owning model.connected then model.console_platform is non-null"
        side_effects: []
      - from: IN_TESTING
        to: TEST_FAILED
        trigger: "(automatic) POST /test-runs/{id}/complete with outcome == FAILED, evaluated AFTER the cycle recount, and only when the recomputed verified_cycle_count < min_required_cycles"
        preconditions:
          - "revision.status == IN_TESTING"
        side_effects:
          - "recompute verified_cycle_count and projected_cycle_count (calculations.revision_cycle_qualification)"
      - from: IN_TESTING
        to: DRAFT
        trigger: "POST /model-revisions/{id}/rework"
        preconditions:
          - "rework_count < REWORK_LIMIT"
          - "no own DurabilityTestRun in status RESERVED or RUNNING"
        side_effects:
          - "increment rework_count by 1"
          - "set superseded_by_rework = true on every own DurabilityTestRun with status == COMPLETED, then recompute verified_cycle_count and projected_cycle_count (both fall to 0)"
      - from: TEST_FAILED
        to: DRAFT
        trigger: "POST /model-revisions/{id}/rework"
        preconditions:
          - "rework_count < REWORK_LIMIT"
          - "no own DurabilityTestRun in status RESERVED or RUNNING"
        side_effects:
          - "increment rework_count by 1"
          - "set superseded_by_rework = true on every own DurabilityTestRun with status == COMPLETED, then recompute verified_cycle_count and projected_cycle_count (both fall to 0)"
      - from: IN_TESTING
        to: QUALIFIED
        trigger: "POST /model-revisions/{id}/qualify"
        preconditions:
          - "verified_cycle_count >= min_required_cycles (the VERIFIED_CHRONOLOGICAL variant is the gate; PROJECTED_EXTRAPOLATION is advisory only)"
          - "no own DurabilityTestRun in status RESERVED or RUNNING"
        side_effects:
          - "set qualified_at = current logical clock"
      - from: QUALIFIED
        to: RELEASED
        trigger: "POST /model-revisions/{id}/release"
        preconditions:
          - "if owning model.connected then at least one own FirmwareCertification with cert_status == CERTIFIED exists"
        side_effects:
          - "set released_at = current logical clock"
          - "increment owning EquipmentModel.released_revision_count by 1 and re-derive EquipmentModel.lifecycle_status (calculations.model_lifecycle_rollup)"
          - "if owning model.supersedes_model_id is non-null: every ModelRevision of that superseded model with status == RELEASED moves to SUPERSEDED, then that model's lifecycle_status is re-derived to SUNSET"
      - from: RELEASED
        to: SUNSET_ANNOUNCED
        trigger: "POST /model-revisions/{id}/sunset"
        preconditions:
          - "revision.status == RELEASED"
        side_effects:
          - "set sunset_announced_at = current logical clock and firmware_support_until = sunset_announced_at + FIRMWARE_SUPPORT_COMMITMENT_DAYS"
          - "re-derive EquipmentModel.lifecycle_status"
          - "for every SerializedAsset of this revision with status == IN_SERVICE: recompute firmware_support_expires_at, support_gap_days and connectivity_support_status (SUNSET_TRACKED or SUPPORT_GAP)"
          - "for every ACTIVE PMProgram covering any such asset: move to NEEDS_REVISION with needs_revision_reason = CONSOLE_SUPPORT_LOST"
          - "for every SCHEDULED MaintenanceVisit of those programs: move to ON_HOLD with held_reason = PROGRAM_NEEDS_REVISION, releasing its reserved spare units"
      - from: RELEASED
        to: SUPERSEDED
        trigger: "(automatic) POST /model-revisions/{id}/release on a revision whose model supersedes this revision's model"
        preconditions:
          - "revision.status == RELEASED"
        side_effects:
          - "re-derive EquipmentModel.lifecycle_status of the superseded model to SUNSET"
      - from: SUNSET_ANNOUNCED
        to: OBSOLETE
        trigger: "POST /model-revisions/{id}/mark-obsolete"
        preconditions:
          - "firmware_support_until <= current logical clock (the support commitment must have run out)"
        side_effects:
          - "re-derive EquipmentModel.lifecycle_status"

  - entity: DurabilityTestRun
    field: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, ABORTED]
    states: [RESERVED, RUNNING, COMPLETED, ABORTED]
    transitions:
      - from: RESERVED
        to: RUNNING
        trigger: "POST /test-runs/{id}/start"
        preconditions:
          - "owning ModelRevision.status == IN_TESTING"
        side_effects:
          - "recompute the revision's projected_cycle_count (a RUNNING run projects target_cycles x RUNNING_PROJECTION_FACTOR)"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /test-runs/{id}/complete"
        preconditions:
          - "outcome == PASSED requires achieved_cycles >= 1 and failure_cycle_count omitted"
          - "outcome == FAILED requires failure_cycle_count >= 1 and failure_cycle_count <= target_cycles"
        side_effects:
          - "set outcome, achieved_cycles (PASSED) or failure_cycle_count (FAILED)"
          - "decrement DurabilityTestRig.occupied_station_count"
          - "recompute the revision's verified_cycle_count and projected_cycle_count"
          - "if outcome == FAILED and the recomputed verified_cycle_count < min_required_cycles and revision.status == IN_TESTING then move the revision to TEST_FAILED"
      - from: RESERVED
        to: ABORTED
        trigger: "POST /test-runs/{id}/abort"
        preconditions: []
        side_effects:
          - "decrement DurabilityTestRig.occupied_station_count (the reservation stops blocking overlapping windows)"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /test-runs/{id}/abort"
        preconditions: []
        side_effects:
          - "decrement DurabilityTestRig.occupied_station_count"
          - "recompute the revision's projected_cycle_count (an ABORTED run contributes nothing to either variant)"

  - entity: FirmwareRelease
    field: status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    states: [ACTIVE, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /firmware-releases/{id}/withdraw"
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "set withdrawn_at = current logical clock"
          - "every own FirmwareCertification with cert_status == CERTIFIED moves to REVOKED; SUBMITTED certifications move to REJECTED"
          - "every SerializedAsset with installed_firmware_release_id == this release moves connectivity_support_status to FIRMWARE_REVOKED with firmware_support_expires_at = withdrawn_at and recomputed support_gap_days"
          - "every ACTIVE PMProgram covering any such asset moves to NEEDS_REVISION with needs_revision_reason = FIRMWARE_REVOKED and its annual_labor_hours_committed is recomputed"
          - "every SCHEDULED MaintenanceVisit of those programs moves to ON_HOLD with held_reason = PROGRAM_NEEDS_REVISION, releasing its reserved spare units"
          - "each affected ServicePartner's committed_hours, coverage_status and spare-stock ledger are recomputed"

  - entity: FirmwareCertification
    field: cert_status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVOKED]
    states: [SUBMITTED, CERTIFIED, REJECTED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /firmware-certifications/{id}/certify"
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "FirmwareRelease.status == ACTIVE"
          - "ModelRevision.status IN {QUALIFIED, RELEASED}"
        side_effects:
          - "set certified_by_user_id = X-User-ID and certified_at = current logical clock"
          - "increment FirmwareRelease.certified_revision_count by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /firmware-certifications/{id}/reject"
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects: []
      - from: CERTIFIED
        to: REVOKED
        trigger: "(automatic) POST /firmware-releases/{id}/withdraw on the owning release"
        preconditions: []
        side_effects:
          - "decrement FirmwareRelease.certified_revision_count by 1"

  - entity: Order
    field: config_status
    initial_state: CONFIGURING
    terminal_states: [CONFIRMED]
    states: [CONFIGURING, CONFIRMED]
    transitions:
      - from: CONFIGURING
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        preconditions:
          - "billing_status == QUOTED"
          - "Facility.status == ACTIVE"
          - "at least one OrderLine with status == ACTIVE"
          - "Facility.open_order_exposure_cents + quoted_total_cents <= Facility.credit_limit_cents"
        side_effects:
          - "fulfillment_status moves PENDING -> IN_PRODUCTION in the same request"
          - "recompute Facility.open_order_exposure_cents"

  - entity: Order
    field: fulfillment_status
    initial_state: PENDING
    terminal_states: [INSTALLED]
    states: [PENDING, IN_PRODUCTION, STAGED, INSTALLING, INSTALLED]
    transitions:
      - from: PENDING
        to: IN_PRODUCTION
        trigger: "(automatic) POST /orders/{id}/confirm"
        preconditions:
          - "config_status transitions to CONFIRMED in the same request"
        side_effects: []
      - from: IN_PRODUCTION
        to: STAGED
        trigger: "POST /orders/{id}/production/complete"
        preconditions:
          - "fulfillment_status == IN_PRODUCTION"
        side_effects:
          - "mint quantity SerializedAsset rows per ACTIVE OrderLine in status BUILT, assigning sequence_no per ModelRevision in (OrderLine.created_at ASC, unit index ASC) order and serial_number = '<revision_code>-' + sequence_no zero-padded to 5 digits"
          - "set each asset's connectivity_support_status (NOT_APPLICABLE for non-connected, SUPPORTED for connected)"
          - "set OrderLine.assets_minted_count for each ACTIVE line"
      - from: STAGED
        to: INSTALLING
        trigger: "(automatic) POST /install-jobs/{id}/arrive"
        preconditions:
          - "fulfillment_status == STAGED"
        side_effects: []
      - from: INSTALLING
        to: INSTALLED
        trigger: "(automatic) POST /install-jobs/{id}/complete with punch_list_open_count == 0, or POST /install-jobs/{id}/resolve-punch-list"
        preconditions:
          - "the install job reaches COMPLETED in the same request"
        side_effects:
          - "billing_status moves QUOTED -> INVOICED in the same request, writing the FINAL price variant"
          - "every BUILT SerializedAsset of this order's ACTIVE lines moves to IN_SERVICE with warranty_starts_at = current logical clock"

  - entity: Order
    field: billing_status
    initial_state: UNQUOTED
    terminal_states: [SETTLED]
    states: [UNQUOTED, QUOTED, INVOICED, SETTLED]
    transitions:
      - from: UNQUOTED
        to: QUOTED
        trigger: "POST /orders/{id}/quote"
        preconditions:
          - "config_status == CONFIGURING"
          - "at least one OrderLine with status == ACTIVE"
          - "expected_order_version matches Order.version"
        side_effects:
          - "write the PROVISIONAL variant of calculations.order_total_assembly into line_subtotal_cents, install_amount_cents, volume_discount_cents, freight_cents, chargeable_weight_kg and quoted_total_cents"
          - "set price_variant_applied = PROVISIONAL and quoted_at = current logical clock"
          - "increment Order.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /orders/{id}/quote (re-quote after a configuration change)"
        preconditions:
          - "config_status == CONFIGURING"
          - "expected_order_version matches Order.version"
        side_effects:
          - "recompute and overwrite every PROVISIONAL pricing field"
          - "increment Order.version by 1"
      - from: QUOTED
        to: UNQUOTED
        trigger: "(automatic) POST /orders/{id}/lines or POST /order-lines/{id}/void while config_status == CONFIGURING"
        preconditions:
          - "config_status == CONFIGURING"
        side_effects:
          - "reset quoted_total_cents, install_amount_cents, volume_discount_cents, freight_cents and punch_list_credit_cents to 0, price_variant_applied to NONE and quoted_at to null (the quote is invalidated by the configuration change)"
      - from: QUOTED
        to: INVOICED
        trigger: "(automatic) fulfillment_status reaching INSTALLED"
        preconditions:
          - "fulfillment_status == INSTALLED in the same request"
        side_effects:
          - "write the FINAL variant of calculations.order_total_assembly into final_total_cents using InstallJob.actual_labor_hours and punch_list_credit_cents"
          - "set price_variant_applied = FINAL and amount_due_cents = final_total_cents - tradein_credit_applied_cents"
          - "recompute Facility.open_order_exposure_cents"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /orders/{id}/settle"
        preconditions:
          - "billing_status == INVOICED"
        side_effects:
          - "recompute Facility.open_order_exposure_cents (a SETTLED order no longer counts against the credit limit)"

  - entity: InstallJob
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    states: [SCHEDULED, ON_SITE, PUNCH_LIST, COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: ON_SITE
        trigger: "POST /install-jobs/{id}/arrive"
        preconditions:
          - "Order.fulfillment_status == STAGED"
          - "ServicePartner.training_current_until > current logical clock"
        side_effects:
          - "Order.fulfillment_status moves STAGED -> INSTALLING"
      - from: ON_SITE
        to: PUNCH_LIST
        trigger: "POST /install-jobs/{id}/complete with punch_list_open_count >= 1"
        preconditions:
          - "actual_labor_hours > 0"
        side_effects:
          - "record actual_labor_hours and punch_list_open_count"
          - "the order is NOT installed and NOT invoiced on this branch; assets stay BUILT"
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /install-jobs/{id}/complete with punch_list_open_count == 0"
        preconditions:
          - "actual_labor_hours > 0"
        side_effects:
          - "set completed_at = current logical clock"
          - "Order.fulfillment_status moves INSTALLING -> INSTALLED and billing_status moves QUOTED -> INVOICED (FINAL price variant)"
          - "every BUILT SerializedAsset of the order moves to IN_SERVICE with warranty_starts_at / warranty_expires_at / firmware_support_expires_at / support_gap_days set"
          - "recompute covered_asset_count and annual_labor_hours_committed of every ACTIVE PMProgram at the order's facility"
          - "recompute ServicePartner.committed_hours and coverage_status (the job stops consuming estimated hours)"
      - from: PUNCH_LIST
        to: COMPLETED
        trigger: "POST /install-jobs/{id}/resolve-punch-list"
        preconditions:
          - "status == PUNCH_LIST"
        side_effects:
          - "set completed_at = current logical clock; punch_list_open_count is retained and priced into punch_list_credit_cents"
          - "the same cascade as the direct ON_SITE -> COMPLETED branch runs (order INSTALLED + INVOICED, assets IN_SERVICE, PM programs and partner rollups recomputed)"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /install-jobs/{id}/abort"
        preconditions: []
        side_effects:
          - "recompute ServicePartner.committed_hours and coverage_status; the calendar window is released"
      - from: ON_SITE
        to: ABORTED
        trigger: "POST /install-jobs/{id}/abort"
        preconditions: []
        side_effects:
          - "Order.fulfillment_status reverts INSTALLING -> STAGED"
          - "recompute ServicePartner.committed_hours and coverage_status"

  - entity: SerializedAsset
    field: status
    initial_state: BUILT
    terminal_states: [RESOLD, SCRAPPED]
    states: [BUILT, IN_SERVICE, TRADE_IN_RETURNED, REFURB_INTAKE, REFURB_CERTIFIED, RESOLD, SCRAPPED]
    transitions:
      - from: BUILT
        to: IN_SERVICE
        trigger: "(automatic) an InstallJob for the owning order reaching COMPLETED"
        preconditions:
          - "the owning Order reaches fulfillment_status INSTALLED in the same request"
        side_effects:
          - "set warranty_starts_at = current logical clock and warranty_expires_at = warranty_starts_at + WARRANTY_DAYS[duty_class]"
          - "recompute firmware_support_expires_at, support_gap_days and connectivity_support_status"
      - from: IN_SERVICE
        to: TRADE_IN_RETURNED
        trigger: "POST /serialized-assets/{id}/trade-in"
        preconditions:
          - "status == IN_SERVICE"
        side_effects:
          - "set declared_condition_grade and trade_in_valuation_cents = calculations.asset_trade_in_valuation"
          - "increment Facility.tradein_credit_granted_cents by trade_in_valuation_cents and recompute tradein_credit_balance_cents"
          - "recompute covered_asset_count and annual_labor_hours_committed of every ACTIVE PMProgram at that facility, then the partner's committed_hours and coverage_status"
          - "every SCHEDULED MaintenanceVisit for this asset moves to CANCELLED, releasing its reserved spare units"
      - from: TRADE_IN_RETURNED
        to: IN_SERVICE
        trigger: "POST /serialized-assets/{id}/trade-in/reverse"
        preconditions:
          - "Facility.tradein_credit_balance_cents >= trade_in_valuation_cents (the granted credit must still be unspent)"
        side_effects:
          - "decrement Facility.tradein_credit_granted_cents by trade_in_valuation_cents and recompute tradein_credit_balance_cents"
          - "clear trade_in_valuation_cents and declared_condition_grade back to null"
          - "recompute the facility's PMProgram rollups and the partner's committed_hours and coverage_status"
      - from: TRADE_IN_RETURNED
        to: REFURB_INTAKE
        trigger: "POST /serialized-assets/{id}/refurb/intake"
        preconditions:
          - "status == TRADE_IN_RETURNED"
        side_effects: []
      - from: REFURB_INTAKE
        to: REFURB_CERTIFIED
        trigger: "POST /serialized-assets/{id}/refurb/certify"
        preconditions:
          - "if the model is connected then firmware_support_expires_at is null or firmware_support_expires_at > current logical clock"
        side_effects:
          - "set refurb_grade"
      - from: REFURB_INTAKE
        to: SCRAPPED
        trigger: "POST /serialized-assets/{id}/scrap"
        preconditions: []
        side_effects: []
      - from: REFURB_CERTIFIED
        to: RESOLD
        trigger: "POST /serialized-assets/{id}/resell"
        preconditions:
          - "buyer Facility.status == ACTIVE"
          - "if the model is connected then firmware_support_expires_at is null or firmware_support_expires_at > current logical clock"
        side_effects:
          - "rewrite facility_id to the buyer facility and reset warranty_starts_at / warranty_expires_at to null"
          - "recompute connectivity_support_status"
      - from: REFURB_CERTIFIED
        to: SCRAPPED
        trigger: "POST /serialized-assets/{id}/scrap"
        preconditions: []
        side_effects: []

  - entity: PMProgram
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    states: [DRAFT, ACTIVE, NEEDS_REVISION, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /pm-programs/{id}/activate"
        preconditions:
          - "Facility.status == ACTIVE"
          - "ServicePartner.training_current_until > current logical clock"
          - "ServicePartner.certified_categories covers every category present among the facility's IN_SERVICE assets"
          - "ServicePartner.committed_hours + this program's annual_labor_hours_committed <= ServicePartner.certified_hours_capacity"
        side_effects:
          - "compute covered_asset_count and annual_labor_hours_committed (calculations.pm_program_annual_labor_hours)"
          - "recompute ServicePartner.committed_hours and coverage_status"
      - from: ACTIVE
        to: NEEDS_REVISION
        trigger: "(automatic) a covering revision reaching SUNSET_ANNOUNCED, or a loaded FirmwareRelease being withdrawn"
        preconditions: []
        side_effects:
          - "set needs_revision_reason"
          - "every SCHEDULED MaintenanceVisit moves to ON_HOLD, releasing its reserved spare units"
      - from: NEEDS_REVISION
        to: ACTIVE
        trigger: "POST /pm-programs/{id}/revise"
        preconditions:
          - "ServicePartner.training_current_until > current logical clock"
          - "ServicePartner.committed_hours + the recomputed annual_labor_hours_committed <= ServicePartner.certified_hours_capacity"
        side_effects:
          - "clear needs_revision_reason, set last_revised_at, recompute covered_asset_count and annual_labor_hours_committed"
          - "every ON_HOLD MaintenanceVisit returns to SCHEDULED, re-reserving its spare units"
          - "recompute ServicePartner.committed_hours and coverage_status"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /pm-programs/{id}/terminate"
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /pm-programs/{id}/terminate"
        preconditions: []
        side_effects:
          - "every SCHEDULED or ON_HOLD MaintenanceVisit moves to CANCELLED, releasing its reserved spare units"
          - "recompute ServicePartner.committed_hours and coverage_status"
      - from: NEEDS_REVISION
        to: TERMINATED
        trigger: "POST /pm-programs/{id}/terminate"
        preconditions: []
        side_effects:
          - "every SCHEDULED or ON_HOLD MaintenanceVisit moves to CANCELLED, releasing its reserved spare units"
          - "recompute ServicePartner.committed_hours and coverage_status"

  - entity: MaintenanceVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    states: [SCHEDULED, ON_HOLD, COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /maintenance-visits/{id}/complete"
        preconditions:
          - "PMProgram.status == ACTIVE"
          - "ServicePartner.training_current_until > current logical clock"
        side_effects:
          - "record labor_hours; move reserved_units from ServicePartner.spare_stock_reserved_units to spare_stock_consumed_units"
          - "increment SerializedAsset.service_history_count and accrued_service_labor_hours (which lowers a later trade-in valuation)"
      - from: SCHEDULED
        to: ON_HOLD
        trigger: "(automatic) the owning PMProgram moving to NEEDS_REVISION"
        preconditions: []
        side_effects:
          - "set held_reason = PROGRAM_NEEDS_REVISION and release reserved_units back to ServicePartner.spare_stock_on_hand_units"
      - from: ON_HOLD
        to: SCHEDULED
        trigger: "(automatic) POST /pm-programs/{id}/revise on the owning program"
        preconditions:
          - "the partner has enough spare stock on hand to re-reserve reserved_units"
        side_effects:
          - "clear held_reason and re-reserve reserved_units"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /maintenance-visits/{id}/cancel, or (automatic) the asset being traded in or the program being terminated"
        preconditions: []
        side_effects:
          - "release reserved_units back to ServicePartner.spare_stock_on_hand_units"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /maintenance-visits/{id}/cancel, or (automatic) the program being terminated"
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# =============================================================================
concurrency_rules:
  - name: revision-create-against-stale-model
    write_endpoint: "POST /model-revisions"
    parent_entity: EquipmentModel
    occ_field: expected_equipment_model_version
    supersede_semantics: "A new engineering revision supersedes the model's revision set, so the caller must prove it read the current catalogue row: the request carries expected_equipment_model_version and the server compares it to EquipmentModel.version."
    on_stale: "reject with 412 ERR_STALE_VERSION and make no change"
    on_success_side_effect: "increments EquipmentModel.version by 1"

  - name: order-requote-against-stale-order
    write_endpoint: "POST /orders/{id}/quote"
    parent_entity: Order
    occ_field: expected_order_version
    supersede_semantics: "A quote supersedes the previous pricing snapshot of the order, so the caller must prove it priced the configuration it actually read: the request carries expected_order_version and the server compares it to Order.version."
    on_stale: "reject with 412 ERR_STALE_VERSION and leave the previous quote intact"
    on_success_side_effect: "increments Order.version by 1"

  - name: tradein-credit-apply-against-stale-facility
    write_endpoint: "POST /orders/{id}/apply-tradein-credit"
    parent_entity: Facility
    occ_field: expected_facility_version
    supersede_semantics: "Applying trade-in credit supersedes the facility's credit ledger snapshot, so the caller must prove it read the current balance: the request carries expected_facility_version and the server compares it to Facility.version."
    on_stale: "reject with 412 ERR_STALE_VERSION and leave the ledger untouched"
    on_success_side_effect: "increments Facility.version by 1"

# =============================================================================
# §1.3 Calculation Rules (10 rules; 3 carry named variants)
# =============================================================================
calculations:

  - name: model_lifecycle_rollup
    output_field: EquipmentModel.lifecycle_status
    algorithm_type: aggregation
    trigger: "any ModelRevision status change on the model"
    formula: |
      Let R = the model's ModelRevision rows with status != SUPERSEDED.
      if R is empty or no r in R has status IN {RELEASED, SUNSET_ANNOUNCED, OBSOLETE} -> PRE_RELEASE
      elif any r in R has status == RELEASED                                          -> ACTIVE
      elif any r in R has status == SUNSET_ANNOUNCED                                  -> SUNSET
      else (every r in R is OBSOLETE)                                                 -> OBSOLETE
      A model whose revisions were all SUPERSEDED by a successor model is also SUNSET.
    constants: {}
    precision: "n/a (enum)"

  - name: revision_cycle_qualification
    output_field: "ModelRevision.verified_cycle_count, ModelRevision.projected_cycle_count"
    algorithm_type: chronological
    trigger: "DurabilityTestRun start / complete / abort, and GET /model-revisions/{id}/qualification-report"
    formula: |
      Input set: the revision's DurabilityTestRun rows with status IN {COMPLETED, RUNNING} AND
      superseded_by_rework == false (RESERVED runs, ABORTED runs and runs superseded by a rework loop
      are excluded from BOTH variants).
      Processing order: window_end ASC, then created_at ASC as the deterministic tie-break.
      Both variants walk the same ordered list with an accumulator starting at 0.
    variants:
      - name: VERIFIED_CHRONOLOGICAL
        applies_when: "always; this variant is the qualification gate compared against min_required_cycles"
        formula: |
          for each run in chronological order:
            if status == RUNNING:                    contribute 0
            elif outcome == PASSED:                  contribute achieved_cycles
            elif outcome == FAILED:                  contribute failure_cycle_count, then STOP the walk
          verified_cycle_count = accumulator
          Evidence recorded after the first chronological failure is NOT verified: the walk halts, so
          later PASSED runs are ignored until a rework loop clears the history.
      - name: PROJECTED_EXTRAPOLATION
        applies_when: "always; advisory figure surfaced by GET /model-revisions/{id}/qualification-report, never a gate"
        formula: |
          for each run in chronological order (no early stop):
            if status == RUNNING:                    contribute floor(target_cycles * RUNNING_PROJECTION_FACTOR)
            elif outcome == PASSED:                  contribute achieved_cycles
            elif outcome == FAILED:                  contribute floor(failure_cycle_count * FAILURE_CREDIT_FACTOR)
          projected_cycle_count = accumulator
    constants:
      RUNNING_PROJECTION_FACTOR: 0.8
      FAILURE_CREDIT_FACTOR: 0.5
      DUTY_MIN_CYCLES: { LIGHT_COMMERCIAL: 250000, FULL_COMMERCIAL: 500000, INSTITUTIONAL: 900000 }
    precision: "integer cycles; floor() on both extrapolation factors"

  - name: order_line_extended_price
    output_field: "OrderLine.unit_price_cents, OrderLine.extended_price_cents"
    algorithm_type: threshold
    trigger: "POST /orders/{id}/lines, and any recompute of the owning order"
    formula: |
      unit_price_cents     = model.unit_list_price_cents + sum(FINISH_SURCHARGE_CENTS[c] for c in finish_codes)
      extended_price_cents = ROUND_HALF_UP(unit_price_cents * quantity * (1 + DUTY_UPLIFT_PCT[model.duty_class]))
      Order.line_subtotal_cents = sum(extended_price_cents of ACTIVE lines)   <-- round PER LINE, then sum.
      Rounding the per-line extended price before summing is normative and can differ by whole cents
      from rounding a single aggregate product; the per-line result is the one that is stored and billed.
    constants:
      FINISH_SURCHARGE_CENTS: { GRAPHITE: 0, ARCTIC_WHITE: 4500, CLUB_RED: 7500, CUSTOM_BRAND_DECAL: 12000, PREMIUM_UPHOLSTERY: 26000 }
      DUTY_UPLIFT_PCT: { LIGHT_COMMERCIAL: 0.00, FULL_COMMERCIAL: 0.06, INSTITUTIONAL: 0.11 }
    precision: "integer cents, exact decimal arithmetic, ROUND_HALF_UP at each per-line boundary"

  - name: order_total_assembly
    output_field: "Order.install_amount_cents, Order.volume_discount_cents, Order.freight_cents, Order.punch_list_credit_cents, Order.quoted_total_cents, Order.final_total_cents"
    algorithm_type: tiered_pricing
    trigger: "POST /orders/{id}/quote (PROVISIONAL) and the automatic QUOTED -> INVOICED transition (FINAL)"
    formula: |
      The eight steps run in exactly this pinned order; no step may be reordered because every step
      consumes the previous step's output.
        step 1  line_subtotal_cents  = sum of ACTIVE OrderLine.extended_price_cents
        step 2  install_hours        = variant-specific (see variants)
                install_amount_cents = ROUND_HALF_UP(install_hours * INSTALL_LABOR_RATE_CENTS)
        step 3  discount_base_cents  = line_subtotal_cents + install_amount_cents
        step 4  volume_discount_cents= ROUND_HALF_UP(discount_base_cents * VOLUME_DISCOUNT_PCT tier of discount_base_cents)
        step 5  discounted_base_cents= discount_base_cents - volume_discount_cents
        step 6  freight_cents        = 0 if discounted_base_cents >= FREE_FREIGHT_THRESHOLD_CENTS
                                      else ROUND_HALF_UP(chargeable_weight_kg * FREIGHT_RATE_CENTS_PER_KG[facility.freight_zone])
                where chargeable_weight_kg = sum over ACTIVE lines of quantity * model.shipping_weight_kg
        step 7  punch_list_credit_cents = variant-specific (see variants)
        step 8  total = discounted_base_cents + freight_cents - punch_list_credit_cents
      The discount tier is selected on discount_base_cents (which INCLUDES installation labour), so
      installation labour can push an order across a discount tier boundary.
    variants:
      - name: PROVISIONAL
        applies_when: "POST /orders/{id}/quote — writes Order.quoted_total_cents"
        formula: |
          step 2 install_hours = sum over ACTIVE lines of quantity * INSTALL_HOURS_PER_UNIT[model.category]
          step 7 punch_list_credit_cents = 0 (no install job has reported yet)
          total is stored in quoted_total_cents; final_total_cents stays null.
      - name: FINAL
        applies_when: "the automatic billing QUOTED -> INVOICED transition when the install job reaches COMPLETED"
        formula: |
          step 2 install_hours = InstallJob.actual_labor_hours of the COMPLETED job
          step 7 punch_list_credit_cents = PUNCH_LIST_CREDIT_CENTS * InstallJob.punch_list_open_count
          total is stored in final_total_cents; quoted_total_cents is retained unchanged so the
          provisional-to-final delta stays auditable, and amount_due_cents = final_total_cents -
          tradein_credit_applied_cents.
    constants:
      INSTALL_HOURS_PER_UNIT: { CARDIO: 1.5, STRENGTH: 2.5, CONNECTED: 3.0 }
      INSTALL_LABOR_RATE_CENTS: 8875
      VOLUME_DISCOUNT_PCT_TIERS: "discount_base_cents in [0, 5000000) -> 0.00 | [5000000, 15000000) -> 0.04 | [15000000, 40000000) -> 0.075 | >= 40000000 -> 0.11 (lower bound inclusive, upper bound exclusive)"
      FREE_FREIGHT_THRESHOLD_CENTS: 20000000
      FREIGHT_RATE_CENTS_PER_KG: { Z1: 180, Z2: 260, Z3: 340, Z4: 520 }
      PUNCH_LIST_CREDIT_CENTS: 25000
    precision: "integer cents; ROUND_HALF_UP at steps 2, 4 and 6 only; weights carry 2 decimals"

  - name: pm_program_annual_labor_hours
    output_field: "PMProgram.covered_asset_count, PMProgram.annual_labor_hours_committed"
    algorithm_type: weighted_scoring
    trigger: "PMProgram activate / revise, asset entering or leaving IN_SERVICE, usage report, firmware withdrawal"
    formula: |
      visits_per_year = ceil(365 / visit_interval_days)
      Covered set A = SerializedAsset rows with facility_id == program.facility_id AND status == IN_SERVICE.
      covered_asset_count = |A|
      for each asset a in A:
        usage_factor_a = min(2.0, max(1.0, a.annual_usage_hours / USAGE_NORM_HOURS))     <-- nested clamp
        hours_a        = PM_BASE_HOURS[model.category] * usage_factor_a * TIER_MULTIPLIER[program.tier] * visits_per_year
      annual_labor_hours_committed = ROUND_HALF_UP(sum(hours_a), 2)
      The inner max() floors light users at the nominal service burden and the outer min() caps heavy
      users, so usage below USAGE_NORM_HOURS and usage above 2 x USAGE_NORM_HOURS are both flat.
    constants:
      PM_BASE_HOURS: { CARDIO: 1.0, STRENGTH: 0.6, CONNECTED: 1.4 }
      USAGE_NORM_HOURS: 2000
      TIER_MULTIPLIER: { BASIC: 1.0, PRO: 1.25, PLATINUM: 1.6 }
    precision: "hours to 2 decimals, ROUND_HALF_UP on the sum only"

  - name: partner_capacity_rollup
    output_field: "ServicePartner.committed_hours, ServicePartner.coverage_status"
    algorithm_type: aggregation
    trigger: "install job create / complete / abort, PM program activate / revise / terminate, cascades"
    formula: |
      committed_hours = sum(InstallJob.estimated_labor_hours where status IN {SCHEDULED, ON_SITE, PUNCH_LIST})
                      + sum(PMProgram.annual_labor_hours_committed where status IN {ACTIVE, NEEDS_REVISION})
      coverage_status  = OVER_COMMITTED if committed_hours > certified_hours_capacity else ACTIVE
      Equality is NOT over-commitment: committed_hours == certified_hours_capacity stays ACTIVE.
      A NEEDS_REVISION program still consumes capacity; only TERMINATED releases it.
    constants: {}
    precision: "hours to 2 decimals; comparison is exact decimal, strictly greater-than"

  - name: asset_support_window
    output_field: "SerializedAsset.warranty_expires_at, SerializedAsset.firmware_support_expires_at, SerializedAsset.support_gap_days, SerializedAsset.connectivity_support_status"
    algorithm_type: forward_looking
    trigger: "asset entering IN_SERVICE, revision sunset, firmware withdrawal, resale"
    formula: |
      warranty_expires_at = warranty_starts_at + WARRANTY_DAYS[model.duty_class]   (null while BUILT)
      if NOT model.connected:
        firmware_support_expires_at = null; support_gap_days = 0; status = NOT_APPLICABLE
      elif installed FirmwareRelease.status == WITHDRAWN:
        firmware_support_expires_at = release.withdrawn_at;                status = FIRMWARE_REVOKED
      elif revision.firmware_support_until is null:
        firmware_support_expires_at = null; support_gap_days = 0;          status = SUPPORTED
      else:
        firmware_support_expires_at = revision.firmware_support_until
        status = SUNSET_TRACKED if firmware_support_expires_at >= warranty_expires_at else SUPPORT_GAP
      support_gap_days = 0 when either timestamp is null, else
                         max(0, floor((warranty_expires_at - firmware_support_expires_at) / 86400 seconds))
      support_gap_days > 0 is the contractual exposure: the console loses firmware support while the
      mechanical warranty is still running.
    constants:
      WARRANTY_DAYS: { LIGHT_COMMERCIAL: 365, FULL_COMMERCIAL: 1095, INSTITUTIONAL: 1825 }
      FIRMWARE_SUPPORT_COMMITMENT_DAYS: 1825
    precision: "whole days, floor(); all instants UTC"

  - name: asset_trade_in_valuation
    output_field: SerializedAsset.trade_in_valuation_cents
    algorithm_type: decay_function
    trigger: "POST /serialized-assets/{id}/trade-in"
    formula: |
      age_years = floor(days_between(warranty_starts_at, current_utc) / 365)
      residual  = max(RESIDUAL_FLOOR,
                      RESIDUAL_BASE - AGE_DECAY_PER_YEAR * age_years - SERVICE_PENALTY_PER_VISIT * service_history_count)
      console_multiplier = UNSUPPORTED_CONSOLE_MULT if (model.connected AND firmware_support_expires_at is not null
                            AND firmware_support_expires_at <= current_utc) else 1.0
      trade_in_valuation_cents = ROUND_HALF_UP(model.unit_list_price_cents * residual
                                               * CONDITION_MULT[declared_condition_grade] * console_multiplier)
      The floor is applied BEFORE the condition and console multipliers, so a floored asset can still
      be discounted further by grade or by an unsupported console.
    constants:
      RESIDUAL_BASE: 0.55
      AGE_DECAY_PER_YEAR: 0.08
      SERVICE_PENALTY_PER_VISIT: 0.015
      RESIDUAL_FLOOR: 0.10
      CONDITION_MULT: { A: 1.0, B: 0.85, C: 0.65 }
      UNSUPPORTED_CONSOLE_MULT: 0.75
    precision: "integer cents, exact decimal arithmetic, single ROUND_HALF_UP at the end"

  - name: tradein_credit_ledger
    output_field: "Facility.tradein_credit_granted_cents, Facility.tradein_credit_applied_cents, Facility.tradein_credit_balance_cents"
    algorithm_type: aggregation
    trigger: "trade-in, trade-in reverse, POST /orders/{id}/apply-tradein-credit"
    formula: |
      granted_cents = sum(trade_in_valuation_cents over the facility's SerializedAssets whose trade-in has
                          not been reversed, i.e. trade_in_valuation_cents is not null)
      applied_cents = sum(Order.tradein_credit_applied_cents over the facility's Orders)
      balance_cents = granted_cents - applied_cents
      Conservation invariant, checked after every mutation: balance_cents >= 0 AND
      granted_cents == applied_cents + balance_cents. A reverse that would drive the balance negative is
      refused rather than clamped.
    constants: {}
    precision: "integer cents; no rounding, the ledger is a pure sum of stored integers"

  - name: spare_stock_ledger
    output_field: "ServicePartner.spare_stock_received_units, ServicePartner.spare_stock_reserved_units, ServicePartner.spare_stock_consumed_units, ServicePartner.spare_stock_on_hand_units"
    algorithm_type: aggregation
    trigger: "POST /service-partners/{id}/parts-receipt, maintenance visit create / complete / cancel / hold / release"
    formula: |
      received_units = sum of units over all parts receipts posted to this partner
      reserved_units = sum(MaintenanceVisit.reserved_units where status == SCHEDULED)
      consumed_units = sum(MaintenanceVisit.reserved_units where status == COMPLETED)
      on_hand_units  = received_units - reserved_units - consumed_units
      ON_HOLD and CANCELLED visits hold nothing.
      Conservation invariant, checked after every mutation: on_hand_units >= 0 AND
      received_units == on_hand_units + reserved_units + consumed_units.
    constants: {}
    precision: "whole units; no rounding"

# =============================================================================
# Pinned domain constants that are not owned by a single calculation
# =============================================================================
domain_constants:
  REWORK_LIMIT: 3                       # completed rework loops allowed per revision
  SUPERSEDE_CHAIN_MAX_DEPTH: 5          # EquipmentModel.supersedes_model_id chain length cap
  INSTALL_TRAVEL_BUFFER_MINUTES: 120    # appended after every install job window
  DEFAULT_LOGICAL_CLOCK: "2026-08-01T00:00:00Z"

# =============================================================================
# §1.4 Validation Rules — evaluated in strict ascending priority order.
# The FIRST rule that fails aborts the request; no later rule is evaluated and
# no partial side effect is persisted.
# =============================================================================
validations:

  - priority: 1
    rule: "X-Role header present and names a known role; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    applies_to: "every endpoint"

  - priority: 2
    rule: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    category: auth
    applies_to: "every endpoint"

  - priority: 3
    rule: "every id in the path exists, checked left to right"
    error_id: "ERR_MODEL_NOT_FOUND | ERR_REVISION_NOT_FOUND | ERR_TEST_RESOURCE_NOT_FOUND | ERR_FIRMWARE_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_INSTALL_JOB_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_SERVICE_PLAN_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "every endpoint with a path id"

  - priority: 4
    rule: "a FacilityManager caller's X-User-ID equals the Facility.id in scope (facility path id, Order.facility_id, PMProgram.facility_id or InstallJob's order facility)"
    error_id: ERR_FACILITY_SCOPE_VIOLATION
    http_status: 403
    category: auth
    applies_to: "every endpoint whose roles include FacilityManager"

  - priority: 5
    rule: "a ServicePartnerTech caller's X-User-ID equals the ServicePartner.id in scope (InstallJob.service_partner_id, PMProgram.service_partner_id or the asset's servicing partner)"
    error_id: ERR_PARTNER_SCOPE_VIOLATION
    http_status: 403
    category: auth
    applies_to: "every endpoint whose roles include ServicePartnerTech"

  - priority: 6
    rule: "the certifying or rejecting ComplianceOfficer's X-User-ID differs from FirmwareCertification.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: auth
    applies_to: "POST /firmware-certifications/{id}/certify, POST /firmware-certifications/{id}/reject"

  - priority: 7
    rule: "request body matches the schema: required fields present, correct JSON types, enum values in range, quantity >= 1 and <= 500, reserved_units 0..50, parallel_station_count 1..8, visit_interval_days 30..365, non-empty arrays where required, no duplicate array members, limit 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: business_constraint
    applies_to: "every endpoint with a body or query parameters"

  - priority: 8
    rule: "window_end > window_start (test run windows, install job windows, requested install windows)"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    category: business_temporal
    applies_to: "POST /test-runs, POST /install-jobs, POST /orders"

  - priority: 9
    rule: "every foreign key in the body resolves to an existing row"
    error_id: "ERR_MODEL_NOT_FOUND | ERR_REVISION_NOT_FOUND | ERR_TEST_RESOURCE_NOT_FOUND | ERR_FIRMWARE_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_SERVICE_PLAN_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "every endpoint carrying a foreign key in its body"

  - priority: 10
    rule: "the supplied expected_<parent>_version equals the current parent version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    category: state
    applies_to: "POST /model-revisions, POST /orders/{id}/quote, POST /orders/{id}/apply-tradein-credit"

  - priority: 11
    rule: "the target entity is in a state from which the requested transition is declared in §1.2. Two creation endpoints carry the same class of gate: POST /test-runs requires the referenced ModelRevision.status == IN_TESTING, POST /install-jobs requires the referenced Order.config_status == CONFIRMED with fulfillment_status IN {IN_PRODUCTION, STAGED}, and POST /maintenance-visits requires the referenced PMProgram.status == ACTIVE"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    category: state
    applies_to: "every transition endpoint"

  - priority: 12
    rule: "an order being confirmed has billing_status == QUOTED (a configuration change since the last quote resets it to UNQUOTED)"
    error_id: ERR_ORDER_NOT_QUOTED
    http_status: 409
    category: state
    applies_to: "POST /orders/{id}/confirm"

  - priority: 13
    rule: "the ModelRevision referenced by a new order line has status == RELEASED"
    error_id: ERR_REVISION_NOT_RELEASED
    http_status: 409
    category: business_safety
    applies_to: "POST /orders/{id}/lines"

  - priority: 14
    rule: "releasing a revision of a connected model requires at least one CERTIFIED FirmwareCertification; loading firmware onto a connected asset requires a CERTIFIED, non-withdrawn build for that asset's revision"
    error_id: ERR_FIRMWARE_NOT_CERTIFIED
    http_status: 409
    category: business_safety
    applies_to: "POST /model-revisions/{id}/release, POST /serialized-assets/{id}/load-firmware"

  - priority: 15
    rule: "qualifying a revision requires verified_cycle_count >= min_required_cycles (the VERIFIED_CHRONOLOGICAL variant only) and no RESERVED or RUNNING run outstanding"
    error_id: ERR_CYCLE_TARGET_NOT_MET
    http_status: 422
    category: business_safety
    applies_to: "POST /model-revisions/{id}/qualify"

  - priority: 16
    rule: "rework_count < REWORK_LIMIT"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    category: business_safety
    applies_to: "POST /model-revisions/{id}/rework"

  - priority: 17
    rule: "the ServicePartner's training_current_until is strictly after the current logical clock"
    error_id: ERR_PARTNER_TRAINING_EXPIRED
    http_status: 409
    category: business_safety
    applies_to: "POST /install-jobs, POST /install-jobs/{id}/arrive, POST /pm-programs/{id}/activate, POST /pm-programs/{id}/revise, POST /maintenance-visits, POST /maintenance-visits/{id}/complete"

  - priority: 18
    rule: "ServicePartner.certified_categories covers every equipment category on the order (install job) or among the facility's IN_SERVICE assets (PM program)"
    error_id: ERR_PARTNER_NOT_CERTIFIED_FOR_CATEGORY
    http_status: 422
    category: business_safety
    applies_to: "POST /install-jobs, POST /pm-programs/{id}/activate, POST /pm-programs/{id}/revise"

  - priority: 19
    rule: "a connected asset may only be refurbishment-certified or resold while firmware_support_expires_at is null or strictly after the current logical clock"
    error_id: ERR_FIRMWARE_SUPPORT_EXPIRED
    http_status: 409
    category: business_safety
    applies_to: "POST /serialized-assets/{id}/refurb/certify, POST /serialized-assets/{id}/resell"

  - priority: 20
    rule: "a revision may only be marked obsolete once firmware_support_until <= the current logical clock"
    error_id: ERR_SUPPORT_WINDOW_ACTIVE
    http_status: 409
    category: business_safety
    applies_to: "POST /model-revisions/{id}/mark-obsolete"

  - priority: 21
    rule: "every requested finish_code is a member of the model's allowed_finish_codes"
    error_id: ERR_FINISH_NOT_ALLOWED
    http_status: 422
    category: business_referential
    applies_to: "POST /orders/{id}/lines"

  - priority: 22
    rule: "the FirmwareRelease.console_platform equals the revision's model.console_platform, and the model must be connected"
    error_id: ERR_PLATFORM_INCOMPATIBLE
    http_status: 422
    category: business_referential
    applies_to: "POST /firmware-certifications, POST /serialized-assets/{id}/load-firmware"

  - priority: 23
    rule: "no existing FirmwareCertification with cert_status IN {SUBMITTED, CERTIFIED} for the same (firmware_release_id, model_revision_id) pair"
    error_id: ERR_DUPLICATE_CERTIFICATION
    http_status: 409
    category: business_referential
    applies_to: "POST /firmware-certifications"

  - priority: 24
    rule: "revision_code is unique among the model's revisions with status != SUPERSEDED; EquipmentModel.name, DurabilityTestRig.name, ServicePartner.name and FirmwareRelease.version_string are globally unique"
    error_id: ERR_DUPLICATE_REVISION_CODE
    http_status: 409
    category: business_referential
    applies_to: "POST /model-revisions, POST /equipment-models, POST /test-rigs, POST /service-partners, POST /firmware-releases"

  - priority: 25
    rule: "supersedes_model_id must not point at the model itself, must not close a cycle in the supersession graph, and the resulting chain must be at most SUPERSEDE_CHAIN_MAX_DEPTH edges deep"
    error_id: ERR_SUPERSEDE_CYCLE
    http_status: 422
    category: business_referential
    applies_to: "POST /equipment-models"

  - priority: 26
    rule: "the rig's supported_duty_classes contains the revision's model.duty_class"
    error_id: ERR_RIG_DUTY_CLASS_UNSUPPORTED
    http_status: 422
    category: business_referential
    applies_to: "POST /test-runs"

  - priority: 27
    rule: "the serviced asset's facility_id equals the PM program's facility_id and the asset status == IN_SERVICE"
    error_id: ERR_ASSET_NOT_COVERED
    http_status: 422
    category: business_referential
    applies_to: "POST /maintenance-visits"

  - priority: 28
    rule: "the Facility in scope has status == ACTIVE"
    error_id: ERR_FACILITY_SUSPENDED
    http_status: 409
    category: business_constraint
    applies_to: "POST /orders, POST /orders/{id}/lines, POST /orders/{id}/quote, POST /orders/{id}/confirm, POST /pm-programs/{id}/activate, POST /serialized-assets/{id}/resell"

  - priority: 29
    rule: "the order has at least one OrderLine with status == ACTIVE"
    error_id: ERR_ORDER_HAS_NO_LINES
    http_status: 422
    category: business_constraint
    applies_to: "POST /orders/{id}/quote, POST /orders/{id}/confirm, POST /install-jobs"

  - priority: 30
    rule: "the order has no other InstallJob with status IN {SCHEDULED, ON_SITE, PUNCH_LIST}"
    error_id: ERR_INSTALL_JOB_ALREADY_OPEN
    http_status: 409
    category: business_constraint
    applies_to: "POST /install-jobs"

  - priority: 31
    rule: "neither the install window_start date nor the window_end date (UTC calendar dates, inclusive of both endpoints) falls on a weekday listed in the facility's install_blackout_weekdays"
    error_id: ERR_INSTALL_BLACKOUT_DAY
    http_status: 422
    category: business_constraint
    applies_to: "POST /install-jobs"

  - priority: 32
    rule: "HALF-OPEN, TRAVEL-BUFFERED, EXCLUSIVE: for the same ServicePartner, the new job's effective interval [window_start, window_end + INSTALL_TRAVEL_BUFFER_MINUTES) must not intersect the effective interval of any existing job in status IN {SCHEDULED, ON_SITE, PUNCH_LIST}. Intersection test: new_start < existing_effective_end AND existing_start < new_effective_end. A new job starting exactly at an existing job's effective end is ACCEPTED (touching endpoints do not collide)."
    error_id: ERR_INSTALL_WINDOW_CONFLICT
    http_status: 409
    category: business_temporal
    applies_to: "POST /install-jobs"

  - priority: 33
    rule: "CLOSED, INCLUSIVE, AGGREGATE-CAPACITY: for the same DurabilityTestRig, count existing runs in status IN {RESERVED, RUNNING} whose window intersects the new window under the INCLUSIVE test (new_start <= existing_end AND existing_start <= new_end — a new window starting exactly at an existing window's end DOES collide, the opposite of the install-job geometry). Reject when that count >= rig.parallel_station_count."
    error_id: ERR_RIG_CAPACITY_EXCEEDED
    http_status: 409
    category: business_temporal
    applies_to: "POST /test-runs"

  - priority: 34
    rule: "ServicePartner.committed_hours + the load being added <= ServicePartner.certified_hours_capacity (equality is allowed)"
    error_id: ERR_PARTNER_CAPACITY_EXCEEDED
    http_status: 409
    category: business_fiscal
    applies_to: "POST /install-jobs, POST /pm-programs/{id}/activate, POST /pm-programs/{id}/revise"

  - priority: 35
    rule: "ServicePartner.spare_stock_on_hand_units >= the visit's requested reserved_units"
    error_id: ERR_INSUFFICIENT_PART_STOCK
    http_status: 409
    category: business_fiscal
    applies_to: "POST /maintenance-visits"

  - priority: 36
    rule: "Facility.open_order_exposure_cents + Order.quoted_total_cents <= Facility.credit_limit_cents (equality is allowed)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    category: business_fiscal
    applies_to: "POST /orders/{id}/confirm"

  - priority: 37
    rule: "the requested amount_cents is >= 1 and <= Facility.tradein_credit_balance_cents, and <= the order's outstanding total"
    error_id: ERR_INSUFFICIENT_TRADEIN_CREDIT
    http_status: 402
    category: business_fiscal
    applies_to: "POST /orders/{id}/apply-tradein-credit"

  - priority: 38
    rule: "reversing a trade-in requires Facility.tradein_credit_balance_cents >= the asset's trade_in_valuation_cents; credit already spent on an order cannot be clawed back"
    error_id: ERR_TRADEIN_CREDIT_ALREADY_APPLIED
    http_status: 409
    category: business_fiscal
    applies_to: "POST /serialized-assets/{id}/trade-in/reverse"

# =============================================================================
# §1.5 API Endpoint Table (77 endpoints)
# =============================================================================
endpoints:

  # ---- EquipmentModel -------------------------------------------------------
