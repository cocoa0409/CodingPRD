      assert:
      - the trigger returns 422 with data.error_id == "ERR_METHOD_CHANNEL_MISMATCH"
      - no RevocationRequest row exists for the contact (GET /compliance/contacts/${c1_id}/revocation-requests returns total_count == 0)
      - ConsentRecord.${cons1_id}.status == ACTIVE
  - name: attempt_channel_must_equal_the_campaign_channel
    claim_type: Violation → Error
    grounds:
    - validations[priority=104]
    - errors[ERR_ATTEMPT_CHANNEL_MISMATCH]
    - entities.ContactAttempt.fields.channel
    distinguishing_aspect: With an ACTIVE EXPRESS_WRITTEN SMS consent on file the earlier consent rules all pass, so an SMS attempt on a VOICE campaign is stopped by ERR_ATTEMPT_CHANNEL_MISMATCH itself.
    test_recipe:
      setup:
      - ACTIVE VOICE MARKETING campaign targeting CA
      - contact holding ACTIVE EXPRESS_WRITTEN consents on both VOICE and SMS
      - clock at 2026-08-03T00:00:00Z (recipient local 17:00)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 08:00
          window_end_local: '21:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-07-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          pol_ca_id: $.data.id
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      - call: POST /compliance/agent-scripts
        payload:
          name: CA VOICE Script
          channel: VOICE
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/approve
        payload:
          approval_note: Disclosures cleared
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/agent-scripts
        payload:
          name: CA SMS Script
          channel: SMS
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_sms_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_sms_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_sms_id}/approve
        payload:
          approval_note: Disclosures cleared
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: VOICE
          consent_type: EXPRESS_WRITTEN
          capture_method: WEB_FORM
          disclosure_script_id: ${scr_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1
          expected_contact_version: ${c1_v}
        as: ComplianceOfficer
        captures:
          cons1_id: $.data.id
      - &id001
        call: GET /compliance/contacts/${c1_id}
        payload: {}
        as: ComplianceOfficer
        captures:
          c1_v2: $.data.version
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: SMS
          consent_type: EXPRESS_WRITTEN
          capture_method: SMS_DOUBLE_OPT_IN
          disclosure_script_id: ${scr_sms_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1-sms
          expected_contact_version: ${c1_v2}
        as: ComplianceOfficer
        captures:
          cons_sms_id: $.data.id
      - call: POST /compliance/contacts/${c1_id}/number-status-check
        payload:
          claimed_consent_date: '2026-07-15'
        as: DialerOperator
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550000'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
      - call: POST /compliance/dialer-profiles
        payload:
          mode: PREDICTIVE
          agents_available: 5
          abandonment_limit_pct: 50.0
          amd_enabled: true
          amd_abandon_on_machine: false
          abandon_message_seconds: 2
        as: DialerOperator
        captures:
          dp_id: $.data.id
      - call: POST /compliance/dialer-profiles/${dp_id}/approve
        payload:
          waiver_reference: WVR-2026-0142
        as: ComplianceOfficer
        as_user_id: officer-profile-approver
      - call: POST /compliance/campaigns
        payload:
          name: CA Aug Outreach
          channel: VOICE
          campaign_purpose: MARKETING
          target_state_codes:
          - CA
          dialer_profile_id: ${dp_id}
          agent_script_id: ${scr_id}
        as: CampaignManager
        captures:
          camp_id: $.data.id
          camp_v: $.data.version
      - call: POST /compliance/scrub-jobs
        payload:
