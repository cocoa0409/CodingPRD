        distinguishing_aspect: "The three site-intake payload rules are shown to be independently reachable from one APPROVED sponsor: an OPEN site with no area_eligibility_record_id gives ERR_AREA_RECORD_REQUIRED, a CLOSED_ENROLLED site with no enrolled_free_reduced_pct gives ERR_ENROLLED_PCT_REQUIRED, and five approved_meal_types gives ERR_MEAL_TYPE_COUNT_EXCEEDED, while the corrected payload is created."
