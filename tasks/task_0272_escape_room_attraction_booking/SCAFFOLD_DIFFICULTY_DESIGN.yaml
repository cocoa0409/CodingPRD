            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gmA: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM B" }
              as: VenueManager
              captures: { gmB: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T14:00:00Z" }
              as: VenueManager
              captures: { slotA: $.data.id, slotA_v: $.data.version }
            - call: "POST /time-slots"
