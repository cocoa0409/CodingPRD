        distinguishing_aspect: "DENIED is terminal: neither a second decide nor a rescind is accepted (both 409 ERR_INVALID_CLAIM_STATE), and reissue_amount_cents stays null so a denied claim can never be converted into a payout by replay."
        test_recipe:
          setup:
