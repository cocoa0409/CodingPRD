  # ===========================================================================
  # Cross-cutting complexity layers
  # Declared layers: dual_variant_calculation, cascading_side_effects,
  #                  rate_threshold_triggers, optimistic_concurrency.
  # One OCC instance per §1.2.1 concurrency rule (3), one real threshold-boundary
  # instance, and exclusions for the two layers §1.8 already walks end to end.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_listing_creation_rejects_a_stale_ticket_version_then_accepts_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[resale-listing-create-stale-ticket]
          - validations[priority=8]
          - errors.ERR_STALE_TICKET_VERSION
        distinguishing_aspect: |
          The version the client read at issuance is invalidated by an unrelated write on the
          same ticket — a device binding — so the listing attempt must fail with 412 even though
          nothing about the listing itself is wrong. Re-reading the ticket and resubmitting the
          identical body then succeeds, and the successful listing advances the version again,
          so a replay of the accepted request would itself be stale.
        test_recipe:
          setup:
            - "Event ON_SALE; AccessZone GA1; Ada verified holding a PAID ticket whose version was captured at issuance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 150, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_id: $.data.id, t_v1: $.data.version }
            - call: "POST /tickets/${t_id}/device-binding"
              payload: { device_fingerprint: "DEV-ADA" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { t_v2: $.data.version }
          trigger:
            - call: "POST /resale-listings"
              payload: { ticket_id: "${t_id}", ask_price_cents: 12000, marketplace: "VERIFIED_PARTNER", expected_ticket_version: "${t_v1}" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /tickets/${t_id}"
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { t_v3: $.data.version, life1: $.data.lifecycle_status }
            - call: "POST /resale-listings"
              payload: { ticket_id: "${t_id}", ask_price_cents: 12000, marketplace: "VERIFIED_PARTNER", expected_ticket_version: "${t_v3}" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { l_id: $.data.id, l_status: $.data.status, l_cap: $.data.cap_price_cents }
            - call: "GET /tickets/${t_id}"
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { t_v4: $.data.version, life2: $.data.lifecycle_status }
            - call: "POST /resale-listings"
              payload: { ticket_id: "${t_id}", ask_price_cents: 12000, marketplace: "VERIFIED_PARTNER", expected_ticket_version: "${t_v3}" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { e_replay: $.data.error_id }
          assert:
            - "${t_v1} == 1 and ${t_v2} == 2 — the binding was the write that invalidated the read"
            - "${e_stale} == ERR_STALE_TICKET_VERSION with HTTP 412, and GET /resale-listings has total_count == 0 at that point"
            - "${t_v3} == 2 and ${life1} == ISSUED"
            - "HTTP 201 on the retry with ${l_status} == LISTED and ${l_cap} == 14500 — cap is 12000 + min(round_half_up(12000 * 0.30), 2500) == 12000 + 2500"
            - "${t_v4} == 3 and ${life2} == LISTED — the accepted listing advanced the ticket version itself"
            - "${e_replay} == ERR_STALE_TICKET_VERSION with HTTP 412 — replaying the accepted body is now stale, and GET /resale-listings still has total_count == 1"

      - name: occ_session_open_rejects_a_stale_gate_version_after_the_previous_session_closed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[scan-session-open-stale-gate]
          - validations[priority=8]
          - errors.ERR_STALE_GATE_VERSION
          - endpoints[POST /scan-sessions/{id}/close].side_effects
        distinguishing_aspect: |
          A gate accumulates two version bumps across one session lifecycle — one on open, one
          on close — so an operator holding the version read at gate creation is two writes
          behind and must be refused 412 when opening the successor session. This is the layer's
          "version increments on every write" claim measured over a full cycle: 1 -> 2 -> 3.
        test_recipe:
          setup:
            - "Event DOORS_OPEN; AccessZone GA1; Gate G1 whose version was captured at creation; a first ONLINE session opened on G1 and then closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 150, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v1: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v1}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /gates/${g1_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { g1_v2: $.data.version, g1_st1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:20:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions/${s1_id}/close"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_status: $.data.status }
          trigger:
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-2", mode: "ONLINE", expected_gate_version: "${g1_v1}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { e_stale1: $.data.error_id }
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-2", mode: "ONLINE", expected_gate_version: "${g1_v2}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { e_stale2: $.data.error_id }
            - call: "GET /gates/${g1_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { g1_v3: $.data.version, g1_st2: $.data.status, g1_closed: $.data.last_session_closed_at }
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-2", mode: "OFFLINE_CAPABLE", expected_gate_version: "${g1_v3}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s2_id: $.data.id, s2_status: $.data.status, s2_mode: $.data.mode }
          assert:
            - "${g1_v1} == 1, ${g1_v2} == 2 with ${g1_st1} == SCANNING, and ${s1_status} == CLOSED"
            - "${e_stale1} == ERR_STALE_GATE_VERSION with HTTP 412 — two writes behind"
            - "${e_stale2} == ERR_STALE_GATE_VERSION with HTTP 412 — one write behind is still stale, so the check is equality and not a lower bound"
            - "${g1_v3} == 3, ${g1_st2} == IDLE and ${g1_closed} == 2026-09-12T18:20:00Z"
            - "HTTP 201 on the last call with ${s2_status} == OPEN and ${s2_mode} == OFFLINE_CAPABLE, and GET /scan-sessions?gate_id=${g1_id} has total_count == 2"
            - "Gate.${g1_id}.version == 4 after that open — every accepted write moves the version exactly once"

      - name: occ_reconciliation_report_rejects_a_stale_event_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reconciliation-create-stale-event]
          - validations[priority=8]
          - errors.ERR_STALE_EVENT_VERSION
          - endpoints[POST /events/{id}/reconciliation-reports].side_effects
        distinguishing_aspect: |
          Cutting a DRAFT report is itself an Event write, so the version a client used for the
          first report is stale for the second — a superseding report must be cut against a
          re-read version. Priority 8 sits above priority 17, so the stale version is reported
          even though the event is merely CLOSED and a second DRAFT report would be legal.
        test_recipe:
          setup:
            - "Event walked to CLOSED with no scans at all; version captured from the CLOSED response."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "IN_PROGRESS" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "CLOSED" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_v1: $.data.version }
          trigger:
            - call: "POST /events/${ev_id}/reconciliation-reports"
              payload: { reported_attendance: 0, expected_event_version: "${ev_v1}" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { rr1_id: $.data.id, rr1_derived: $.data.scan_derived_attendance, rr1_pct: $.data.variance_pct, rr1_status: $.data.status }
            - call: "POST /events/${ev_id}/reconciliation-reports"
              payload: { reported_attendance: 0, expected_event_version: "${ev_v1}" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { e_stale: $.data.error_id }
            - call: "GET /events/${ev_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_v2: $.data.version, ev_status: $.data.status }
            - call: "POST /events/${ev_id}/reconciliation-reports"
              payload: { reported_attendance: 0, expected_event_version: "${ev_v2}" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { rr2_id: $.data.id, rr2_status: $.data.status }
          assert:
            - "${rr1_status} == DRAFT, ${rr1_derived} == 0 and ${rr1_pct} == 0.00 — a zero derived attendance is defined as 0.00 variance, not a division error"
            - "${e_stale} == ERR_STALE_EVENT_VERSION with HTTP 412 — cutting the first report incremented Event.version, and priority 8 outranks priority 17"
            - "${ev_v2} == ${ev_v1} + 1 and ${ev_status} == CLOSED"
            - "HTTP 201 on the last call with ${rr2_status} == DRAFT and ${rr2_id} != ${rr1_id}"
            - "GET /reconciliation-reports?event_id=${ev_id} has total_count == 2 — two DRAFT reports coexist because neither is FINAL"

      - name: fraud_block_threshold_is_exclusive_at_thirty_nine_and_blocks_at_exactly_forty
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.patron_fraud_risk_score
          - validations[priority=28]
          - errors.ERR_PATRON_FRAUD_BLOCKED
          - entities.Patron.fields.fraud_risk_score
        distinguishing_aspect: |
          FRAUD_BLOCK_THRESHOLD is a strict "below" test, so the boundary must be probed from
          both sides with cumulative scores one point apart. Ada reaches 39 out of three
          different sources — a DUPLICATE incident (20), a ZONE_VIOLATION incident (15) and
          device churn (4 for two rebinds) — and may still list. Bob reaches exactly 40 from two
          DUPLICATE incidents alone and is blocked. An implementation that blocks at > 40, or
          that forgets churn in the sum, gets one of the two legs wrong.
        test_recipe:
          setup:
            - "Event DOORS_OPEN with zones GA1 (GA) and VIP1 (PREMIUM); Gate G1 serves GA1 and Gate G2 serves VIP1; Ada and Bob verified, each holding two GA1 tickets; Ada rebound her scanning ticket twice; clock 2026-09-12T18:10:00Z; ONLINE sessions S1 on G1 and S2 on G2."
