# =============================================================================
# Task 1884: Academic Advising Caseload Management — Seed Tables
# =============================================================================

scenario: |
  1884. Academic Advising Caseload Management (university advising center): advisor assignment by major/cohort & load balancing, appointment scheduling & drop-in queue, early-alert referral intake & outreach protocol, registration hold release & advising requirement, degree-plan creation & term-by-term mapping, at-risk indicator & intervention tracking, notes/confidentiality & shared-record access, retention outcome reporting

domain_name: academic-advising-caseload
api_prefix: /advising

complexity_profile:
  primary_archetype: temporal_windowing        # appointment slots, check-in windows, SLA windows
  secondary_archetype: compliance_audit        # note confidentiality, ownership-gated record access
  complexity_layers:
    - optimistic_concurrency                   # OCC on Student.version for advisor-assignment create-with-supersede
    - selector_policy                          # auto-assign advisor selection; drop-in call-next selection
    - cascading_side_effects                   # escalation -> intervention -> risk -> clearance chains
    - ops_run_checkpoint                       # POST /advising/ops/daily-close sweeps no-shows and stale queue entries
  entity_topology: flat                        # peer entities joined by foreign keys; no nested URL tree except student sub-resources
  state_machine_shape: branching               # linear pipelines plus revision cycles (DegreePlan, EarlyAlertReferral)
  relationship_patterns:
    - one_to_many                              # Student -> holds/plans/notes; Advisor -> assignments/appointments
    - cross_aggregate                          # Appointment references both Student and Advisor; Intervention references Referral
  role_model: hierarchical_override            # AdvisingDirector superset; Advisor ownership-gated; FrontDeskStaff / FacultyReferrer peer roles
  consistency_model: immediate                 # all mutations + recomputes visible in the same response
  difficulty_level: expert                     # 10 entities / 49 endpoints; 8 named workflows demand the breadth

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Advisor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Advisor full name" }
      - { name: email, type: string, source: input, description: "Advisor email" }
      - { name: major_codes, type: array, source: input, description: "Major codes this advisor serves (assignment eligibility)" }
      - { name: max_caseload, type: integer, source: input, description: "Maximum ACTIVE assignments allowed (>= 1)", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }
      - { name: assigned_active_count, type: integer, source: computed, description: "Count of AdvisorAssignment rows with advisor_id = this advisor and status = ACTIVE" }
      - { name: weighted_load, type: integer, source: computed, description: "Sum over ACTIVE assignments of student risk weight (LOW=1, MEDIUM=2, HIGH=3)" }
      - { name: scheduled_minutes, type: integer, source: computed, description: "Sum of duration_minutes over this advisor's appointments with status IN {SCHEDULED, CHECKED_IN}" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: email, type: string, source: input, description: "Student email" }
      - { name: major_code, type: string, source: input, description: "Declared major code (assignment eligibility key)" }
      - { name: cohort_year, type: integer, source: input, description: "Entry cohort year (retention reporting key)" }
      - { name: current_term_code, type: string, source: input, description: "Student's current academic term code, e.g. FA26" }
      - { name: gpa, type: number, source: input, description: "Cumulative GPA 0.0-4.0; drives at_risk_score base band", constraints: "0.0 <= gpa <= 4.0" }
      - { name: care_status, type: enum, source: system, description: "ENROLLED | ON_LEAVE | INACTIVE", default: ENROLLED }
      - { name: advising_required_flag, type: boolean, source: input, description: "Whether an advising session is required before registration", default: false }
      - { name: enrolled_term_codes, type: array, source: system, description: "Term codes in which the student was ENROLLED; seeded with current_term_code at creation, appended on PATCH term change while ENROLLED" }
      - { name: no_show_count, type: integer, source: computed, description: "Count of this student's appointments with status = NO_SHOW" }
      - { name: at_risk_score, type: integer, source: computed, description: "0-100 risk score per calculations.at_risk_score" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH per calculations.at_risk_score bands" }
      - { name: advising_requirement_status, type: enum, source: computed, description: "NOT_REQUIRED | REQUIRED | SATISFIED per calculations.advising_requirement" }
      - { name: registration_clearance, type: enum, source: computed, description: "BLOCKED | CLEARED per calculations.registration_clearance" }

  - name: AdvisorAssignment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; assigned student" }
      - { name: advisor_id, type: string, source: input, description: "FK -> Advisor.id; assigned advisor" }
      - { name: assignment_mode, type: enum, source: system, description: "MANUAL | AUTO — which creation endpoint produced it" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED", default: ACTIVE }
      - { name: ended_reason, type: enum, source: system, description: "null | SUPERSEDED | MANUAL_END", default: null }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; advisee" }
      - { name: advisor_id, type: string, source: input, description: "FK -> Advisor.id; host advisor (schedule resource)" }
      - { name: term_code, type: string, source: input, description: "Term this appointment counts toward" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Slot start (ISO 8601 UTC); half-open interval start" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Slot end (ISO 8601 UTC); half-open interval end" }
      - { name: duration_minutes, type: integer, source: computed, description: "(scheduled_end_at - scheduled_start_at) in whole minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW", default: SCHEDULED }
      - { name: checked_in_at, type: datetime, source: system, description: "Timestamp of check-in; null until CHECKED_IN", default: null }

  - name: DropInTicket
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; queuing student" }
      - { name: reason, type: string, source: input, description: "Free-text visit reason" }
      - { name: queue_date, type: string, source: system, description: "Logical-clock calendar date (YYYY-MM-DD) at creation; groups the daily queue" }
      - { name: position, type: integer, source: computed, description: "1 + count of pre-existing tickets with same queue_date; fixed at creation, never changes" }
      - { name: status, type: enum, source: system, description: "QUEUED | CALLED | SERVED | LEFT", default: QUEUED }
      - { name: called_by_advisor_id, type: string, source: system, description: "FK -> Advisor.id; nullable; set by call-next to the calling advisor", default: null }

  - name: EarlyAlertReferral
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; referred student" }
      - { name: source, type: enum, source: input, description: "FACULTY | STAFF" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH; drives SLA days and risk boost" }
      - { name: reason, type: string, source: input, description: "Free-text referral reason" }
      - { name: status, type: enum, source: system, description: "OPEN | OUTREACH_IN_PROGRESS | NO_RESPONSE | RESPONDED | ESCALATED | CLOSED", default: OPEN }
      - { name: attempt_count, type: integer, source: system, description: "Number of outreach calls logged", default: 0 }
      - { name: due_at, type: datetime, source: computed, description: "created_at + SLA_DAYS[severity] (HIGH=2d, MEDIUM=5d, LOW=10d)" }
      - { name: is_sla_breached, type: boolean, source: computed, description: "true iff current logical time > due_at (strict) AND status NOT IN {RESPONDED, CLOSED}" }

  - name: Intervention
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; student receiving the intervention" }
      - { name: referral_id, type: string, source: input, description: "FK -> EarlyAlertReferral.id; nullable; set when intervention originates from an escalation", default: null }
      - { name: intervention_type, type: enum, source: input, description: "ACADEMIC_COACHING | TUTORING_REFERRAL | COUNSELING_REFERRAL | FINANCIAL_AID_REFERRAL" }
      - { name: note, type: string, source: input, description: "Free-text plan note", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN }
      - { name: outcome, type: enum, source: system, description: "null | SUCCESSFUL | UNSUCCESSFUL; set on close", default: null }

  - name: RegistrationHold
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; path-scoped parent" }
      - { name: hold_type, type: enum, source: input, description: "ADVISING | FINANCIAL | ACADEMIC_STANDING | ADMINISTRATIVE" }
      - { name: requires_approved_plan, type: boolean, source: input, description: "When true, release requires a DegreePlan in APPROVED for the student", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", default: ACTIVE }

  - name: DegreePlan
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; path-scoped parent" }
      - { name: catalog_year, type: integer, source: input, description: "Catalog year governing requirements" }
      - { name: required_credits, type: integer, source: input, description: "Total credits the plan must map (submit gate)", constraints: ">= 1" }
      - { name: terms, type: array, source: input, description: "Term-by-term map: [{term_code, courses: [{course_code, credits}]}]; editable only in DRAFT" }
      - { name: mapped_credits_total, type: integer, source: computed, description: "Sum of per-term rounded credits per calculations.term_credit_mapping" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED", default: DRAFT }

  - name: AdvisingNote
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; path-scoped parent" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the creating caller (an Advisor.id when role=Advisor, opaque id when role=AdvisingDirector); not an FK" }
      - { name: visibility, type: enum, source: input, description: "SHARED | CONFIDENTIAL; CONFIDENTIAL readable only by author and AdvisingDirector" }
      - { name: body, type: string, source: input, description: "Note text; immutable after creation (no update endpoint exists)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: AdvisorAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /advising/advisor-assignments/{assignmentId}/end"
        actor: AdvisingDirector
        preconditions:
          - "Assignment exists (ERR_ASSIGNMENT_NOT_FOUND)"
          - "status == ACTIVE (ERR_ASSIGNMENT_ALREADY_ENDED)"
        side_effects:
          - "status -> ENDED, ended_reason -> MANUAL_END"
          - "Recompute advisor.assigned_active_count and advisor.weighted_load (calculation caseload_load)"
      - from: ACTIVE
        to: ENDED
        trigger: "system (supersede on POST /advising/advisor-assignments or /auto-assign for the same student)"
        actor: system
        preconditions:
          - "A new assignment is being created for the same student while this one is ACTIVE"
        side_effects:
          - "status -> ENDED, ended_reason -> SUPERSEDED"
          - "Recompute advisor.assigned_active_count and advisor.weighted_load (calculation caseload_load)"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /advising/appointments/{appointmentId}/check-in"
        actor: FrontDeskStaff
        preconditions:
          - "status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
          - "current logical time within [scheduled_start_at - 10min, scheduled_start_at + 10min] inclusive (ERR_OUTSIDE_CHECK_IN_WINDOW)"
        side_effects:
          - "checked_in_at = current logical time"
          - "Recompute advisor.scheduled_minutes (still counted: status IN {SCHEDULED, CHECKED_IN})"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /advising/appointments/{appointmentId}/complete"
        actor: "Advisor (must be the appointment's advisor) or AdvisingDirector"
        preconditions:
          - "status == CHECKED_IN (ERR_APPOINTMENT_INVALID_STATE)"
        side_effects:
          - "Recompute advisor.scheduled_minutes (COMPLETED excluded)"
          - "If appointment.term_code == student.current_term_code: recompute student.advising_requirement_status (calculation advising_requirement) and student.registration_clearance (calculation registration_clearance)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /advising/appointments/{appointmentId}/cancel"
        actor: "FrontDeskStaff, Advisor, or AdvisingDirector"
        preconditions:
          - "status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
        side_effects:
          - "Recompute advisor.scheduled_minutes (CANCELLED excluded)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (POST /advising/ops/daily-close sweep: current logical time > scheduled_start_at + 10min grace)"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "current logical time > scheduled_start_at + 10 minutes"
        side_effects:
          - "student.no_show_count += 1"
          - "Recompute student.at_risk_score and risk_tier (calculation at_risk_score); if risk_tier becomes HIGH set student.advising_required_flag = true and recompute advising_requirement_status and registration_clearance"
          - "Recompute advisor.scheduled_minutes (NO_SHOW excluded) and weighted_load of the student's assigned advisor if any"

  - entity: DropInTicket
    initial_state: QUEUED
    terminal_states: [SERVED, LEFT]
    transitions:
      - from: QUEUED
        to: CALLED
        trigger: "POST /advising/dropin-tickets/call-next"
        actor: Advisor
        preconditions:
          - "At least one ticket with queue_date == current logical date AND status == QUEUED (ERR_QUEUE_EMPTY)"
        side_effects:
          - "Selected ticket (lowest position among today's QUEUED): status -> CALLED, called_by_advisor_id = caller's Advisor.id"
      - from: CALLED
        to: SERVED
        trigger: "POST /advising/dropin-tickets/{ticketId}/complete"
        actor: "Advisor or AdvisingDirector"
        preconditions:
          - "status == CALLED (ERR_TICKET_INVALID_STATE)"
        side_effects: []
      - from: QUEUED
        to: LEFT
        trigger: "POST /advising/dropin-tickets/{ticketId}/leave"
        actor: "FrontDeskStaff, Advisor, or AdvisingDirector"
        preconditions:
          - "status IN {QUEUED, CALLED} (ERR_TICKET_INVALID_STATE)"
        side_effects: []
      - from: CALLED
        to: LEFT
        trigger: "POST /advising/dropin-tickets/{ticketId}/leave"
        actor: "FrontDeskStaff, Advisor, or AdvisingDirector"
        preconditions:
          - "status IN {QUEUED, CALLED} (ERR_TICKET_INVALID_STATE)"
        side_effects: []
      - from: QUEUED
        to: LEFT
        trigger: "system (POST /advising/ops/daily-close sweep: ticket.queue_date < current logical date)"
        actor: system
        preconditions:
          - "status == QUEUED"
          - "queue_date < current logical date"
        side_effects: []

  - entity: EarlyAlertReferral
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OUTREACH_IN_PROGRESS
        trigger: "POST /advising/referrals/{referralId}/outreach with outcome=NO_ANSWER"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE} (ERR_REFERRAL_INVALID_STATE)"
          - "attempt_count + 1 < MAX_ATTEMPTS (3), else auto-escalation path applies"
        side_effects:
          - "attempt_count += 1"
      - from: OUTREACH_IN_PROGRESS
        to: NO_RESPONSE
        trigger: "POST /advising/referrals/{referralId}/outreach with outcome=NO_ANSWER"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE} (ERR_REFERRAL_INVALID_STATE)"
          - "attempt_count + 1 < MAX_ATTEMPTS (3)"
        side_effects:
          - "attempt_count += 1"
      - from: NO_RESPONSE
        to: OUTREACH_IN_PROGRESS
        trigger: "POST /advising/referrals/{referralId}/outreach with outcome=NO_ANSWER"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE} (ERR_REFERRAL_INVALID_STATE)"
          - "attempt_count + 1 < MAX_ATTEMPTS (3)"
        side_effects:
          - "attempt_count += 1"
      - from: OPEN
        to: RESPONDED
        trigger: "POST /advising/referrals/{referralId}/outreach with outcome=REACHED"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE} (ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "attempt_count += 1"
      - from: OUTREACH_IN_PROGRESS
        to: RESPONDED
        trigger: "POST /advising/referrals/{referralId}/outreach with outcome=REACHED"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE} (ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "attempt_count += 1"
      - from: NO_RESPONSE
        to: RESPONDED
        trigger: "POST /advising/referrals/{referralId}/outreach with outcome=REACHED"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE} (ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "attempt_count += 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /advising/referrals/{referralId}/escalate"
        actor: AdvisingDirector
        preconditions:
          - "status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE} (ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: create Intervention (student_id = referral.student_id, referral_id = this referral, intervention_type = ACADEMIC_COACHING, status = OPEN)"
          - "Cascade link 2: that Intervention creation recomputes student.at_risk_score (+INTERVENTION_WEIGHT 10 for the new OPEN intervention) and may flip student.risk_tier"
          - "Cascade link 3: if risk_tier becomes HIGH, set student.advising_required_flag = true, recompute advising_requirement_status (-> REQUIRED absent a completed current-term appointment) and registration_clearance (-> BLOCKED)"
          - "Cascade link 3b: recompute weighted_load of the student's assigned advisor if any (student risk weight changed)"
      - from: OUTREACH_IN_PROGRESS
        to: ESCALATED
        trigger: "POST /advising/referrals/{referralId}/escalate OR system auto-escalation (outreach NO_ANSWER bringing attempt_count to MAX_ATTEMPTS 3)"
        actor: "AdvisingDirector or system"
        preconditions:
          - "status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE} (ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "Same 4-step escalation cascade as OPEN -> ESCALATED (Intervention creation -> at_risk_score recompute -> HIGH-tier flag/requirement/clearance flip -> advisor weighted_load recompute)"
          - "On auto-escalation, attempt_count is incremented to MAX_ATTEMPTS as part of the same outreach call"
      - from: NO_RESPONSE
        to: ESCALATED
        trigger: "POST /advising/referrals/{referralId}/escalate OR system auto-escalation (outreach NO_ANSWER bringing attempt_count to MAX_ATTEMPTS 3)"
        actor: "AdvisingDirector or system"
        preconditions:
          - "status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE} (ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "Same 4-step escalation cascade as OPEN -> ESCALATED"
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /advising/referrals/{referralId}/close"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status IN {RESPONDED, ESCALATED} (ERR_REFERRAL_INVALID_STATE)"
        side_effects: []
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /advising/referrals/{referralId}/close"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status IN {RESPONDED, ESCALATED} (ERR_REFERRAL_INVALID_STATE)"
        side_effects: []

  - entity: RegistrationHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /advising/students/{id}/holds/{holdId}/release"
        actor: "Advisor (must be the student's assigned advisor) or AdvisingDirector"
        preconditions:
          - "status == ACTIVE (ERR_HOLD_NOT_ACTIVE)"
          - "If requires_approved_plan == true: student has a DegreePlan with status == APPROVED (ERR_PLAN_NOT_APPROVED)"
        side_effects:
          - "Cascade link 1: hold -> RELEASED recomputes student.registration_clearance (calculation registration_clearance)"
          - "Cascade link 2: if no ACTIVE holds remain AND advising_requirement_status != REQUIRED, registration_clearance -> CLEARED; also recompute student.at_risk_score (HOLD_WEIGHT 8 removed)"

  - entity: DegreePlan
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /advising/students/{id}/degree-plans/{planId}/submit"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status == DRAFT (ERR_PLAN_INVALID_STATE)"
          - "mapped_credits_total >= required_credits (ERR_PLAN_CREDITS_INSUFFICIENT)"
          - "Every term's rounded credit total <= MAX_TERM_CREDITS (18) (ERR_PLAN_TERM_OVERLOAD)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /advising/students/{id}/degree-plans/{planId}/approve"
        actor: "Advisor (must be assigned advisor) or AdvisingDirector"
        preconditions:
          - "status == SUBMITTED (ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "Recompute student.registration_clearance (plan gate for holds with requires_approved_plan is now satisfiable)"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /advising/students/{id}/degree-plans/{planId}/return"
        actor: "Advisor (assigned) or AdvisingDirector"
        preconditions:
          - "status == SUBMITTED (ERR_PLAN_INVALID_STATE)"
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /advising/advisor-assignments"
    occ_field: expected_student_version
    description: |
      Creating a manual AdvisorAssignment against a Student whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created an assignment for the same
      student (which legitimately supersedes and ENDs the prior ACTIVE
      assignment) so the current writer's view of the student is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: caseload_load
    trigger: "advisor-assignment create / end / supersede; student risk_tier change (for weighted variant)"
    algorithm: aggregation
    formula: |
      assigned_active_count = count(AdvisorAssignment where advisor_id = A AND status = ACTIVE)
      weighted_load = sum over AdvisorAssignment where advisor_id = A AND status = ACTIVE of
                      RISK_WEIGHT[student.risk_tier], where LOW=1, MEDIUM=2, HIGH=3
      Both fields recompute eagerly on every trigger and are exposed on Advisor reads.
      Auto-assign ranks candidates by ONE of the two variants selected by ranking_mode.
    input_set: "AdvisorAssignment rows status = ACTIVE joined to their Student's current risk_tier"
    constants:
      RISK_WEIGHT_LOW: 1
      RISK_WEIGHT_MEDIUM: 2
      RISK_WEIGHT_HIGH: 3
    precision: "integer"
    variants:
      - name: headcount
        when: "auto-assign called with ranking_mode = HEADCOUNT"
        difference: "ranks by assigned_active_count ASC; tie-break weighted_load ASC, then advisor created_at ASC"
      - name: weighted
        when: "auto-assign called with ranking_mode = WEIGHTED (default)"
        difference: "ranks by weighted_load ASC; tie-break assigned_active_count ASC, then advisor created_at ASC"

  - name: retention_rate
    trigger: "GET /advising/reports/retention"
    algorithm: aggregation
    formula: |
      variant COHORT_PERSISTED (requires cohort_year):
        denominator = count(Student where cohort_year = cohort_year)
        numerator   = count(Student where cohort_year = cohort_year AND care_status = ENROLLED)
      variant TERM_OVER_TERM (requires from_term_code, to_term_code; optional cohort_year filter):
        pool        = Student where from_term_code IN enrolled_term_codes
                      (AND cohort_year = cohort_year when provided)
        denominator = count(pool)
        numerator   = count(pool where to_term_code IN enrolled_term_codes)
      rate = numerator / denominator; when denominator = 0, rate = 0 and numerator = 0
    input_set: "All Student rows (any care_status), filtered as above; enrolled_term_codes maintained by system on create/PATCH"
    constants: {}
    precision: "rate rendered to 4 decimal places, round_half_up"
    variants:
      - name: cohort_persisted
        when: "variant = COHORT_PERSISTED"
        difference: "snapshot persistence of the whole entry cohort at report time"
      - name: term_over_term
        when: "variant = TERM_OVER_TERM"
        difference: "sequential persistence between two named terms over the enrolled-term history"

  - name: at_risk_score
    trigger: "student create/PATCH (gpa), referral create, intervention create/close, hold create/release, appointment NO_SHOW"
    algorithm: weighted_scoring
    formula: |
      base = 40 if gpa < 2.0
             25 if 2.0 <= gpa < 2.5
             10 if gpa >= 2.5
      referral_boost = max over EarlyAlertReferral of student with
                       status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE, ESCALATED} of
                       SEVERITY_BOOST[severity]  (HIGH=20, MEDIUM=12, LOW=6; none -> 0)
      no_show_points = 10 * min(no_show_count, 3)
      intervention_points = 10 * count(Intervention of student with status = OPEN)
      hold_points = 8 * count(RegistrationHold of student with status = ACTIVE)
      at_risk_score = min(base + referral_boost + no_show_points + intervention_points + hold_points, 100)
      risk_tier = HIGH if at_risk_score >= 70
                  MEDIUM if 40 <= at_risk_score < 70
                  LOW if at_risk_score < 40
    input_set: "Referrals status IN {OPEN, OUTREACH_IN_PROGRESS, NO_RESPONSE, ESCALATED} (RESPONDED/CLOSED excluded); Interventions status = OPEN; RegistrationHold status = ACTIVE; no_show_count from Appointments status = NO_SHOW"
    constants:
      GPA_BAND_LOW_CUT: 2.0
      GPA_BAND_MID_CUT: 2.5
      SEVERITY_BOOST_HIGH: 20
      SEVERITY_BOOST_MEDIUM: 12
      SEVERITY_BOOST_LOW: 6
      NO_SHOW_CAP: 3
      INTERVENTION_WEIGHT: 10
      HOLD_WEIGHT: 8
      TIER_HIGH_MIN: 70
      TIER_MEDIUM_MIN: 40
      MAX_SCORE: 100
    precision: "integer score; no rounding"
    note: "Combinatorial mode (a): >= 3 inputs with conditional gpa band branch, max over severities, and nested min() caps"

  - name: term_credit_mapping
    trigger: "degree-plan create; PATCH of terms while DRAFT"
    algorithm: aggregation
    formula: |
      For each term t in terms:
        term_credits_rounded[t] = ROUND_HALF_UP_TO_INTEGER(sum of course.credits in t)
      mapped_credits_total = sum of term_credits_rounded over all terms
      PINNED ORDER: round each term first, then sum. (Sum-then-round is the
      rejected alternative: two terms of 10.5 each yield 11+11=22 under the
      pinned order but ROUND_HALF_UP(21.0)=21 under the alternative.)
      Submit gates: mapped_credits_total >= required_credits; each
      term_credits_rounded <= MAX_TERM_CREDITS (18).
    input_set: "terms array on the DegreePlan being written"
    constants:
      MAX_TERM_CREDITS: 18
    precision: "per-term ROUND_HALF_UP to integer; total is an integer sum of those integers"

  - name: outreach_sla_due_at
    trigger: "referral create; is_sla_breached recomputed on every read and on daily-close"
    algorithm: threshold
    formula: |
      due_at = created_at + SLA_DAYS[severity]   (HIGH=2 days, MEDIUM=5 days, LOW=10 days)
      is_sla_breached = (current_logical_time > due_at) AND (status NOT IN {RESPONDED, CLOSED})
      Boundary: at current_logical_time == due_at exactly, NOT breached (strict >).
    input_set: "the referral itself + logical clock"
    constants:
      SLA_DAYS_HIGH: 2
      SLA_DAYS_MEDIUM: 5
      SLA_DAYS_LOW: 10
    precision: "second-precision ISO 8601 timestamps"

  - name: queue_position
    trigger: "drop-in ticket create"
    algorithm: chronological
    formula: |
      position = 1 + count(DropInTicket where queue_date = new.queue_date)
      Assigned atomically at creation from the count, so ties are impossible;
      ordering equals creation order (created_at ASC is the observational
      equivalent; id is never consulted).
    input_set: "DropInTicket rows with the same queue_date (any status)"
    constants: {}
    precision: "integer, gap-free per queue_date"

  - name: advisor_scheduled_minutes
    trigger: "appointment create / cancel / complete / NO_SHOW sweep"
    algorithm: aggregation
    formula: |
      scheduled_minutes = sum(duration_minutes of Appointment where
                              advisor_id = A AND status IN {SCHEDULED, CHECKED_IN})
      duration_minutes = (scheduled_end_at - scheduled_start_at) in whole minutes
    input_set: "Appointments of advisor A with status IN {SCHEDULED, CHECKED_IN}; COMPLETED/CANCELLED/NO_SHOW excluded"
    constants: {}
    precision: "integer minutes"

  - name: advising_requirement
    trigger: "student create/PATCH (advising_required_flag, current_term_code), appointment COMPLETED, risk_tier -> HIGH auto-set"
    algorithm: threshold
    formula: |
      if advising_required_flag == false: advising_requirement_status = NOT_REQUIRED
      else if exists Appointment where student_id = S AND status = COMPLETED
           AND term_code = student.current_term_code: SATISFIED
      else: REQUIRED
    input_set: "Student.advising_required_flag; Appointments status = COMPLETED with matching term_code"
    constants: {}
    precision: "enum"

  - name: registration_clearance
    trigger: "hold create/release, advising_requirement_status recompute, degree-plan approve"
    algorithm: threshold
    formula: |
      if exists RegistrationHold of student with status = ACTIVE: BLOCKED
      else if advising_requirement_status == REQUIRED: BLOCKED
      else: CLEARED
    input_set: "RegistrationHold status = ACTIVE; computed advising_requirement_status"
    constants: {}
    precision: "enum"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: business_constraint
    check: "Request shape: required input fields present; enum values in domain; datetimes parseable; gpa within 0.0-4.0; max_caseload >= 1; appointment duration within [15, 60] minutes and end > start (else ERR_INVALID_APPOINTMENT_DURATION)"
    error_id: "ERR_VALIDATION / ERR_INVALID_APPOINTMENT_DURATION"
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 3
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids (student_id, advisor_id, referral_id) exist"
    error_id: "ERR_STUDENT_NOT_FOUND / ERR_ADVISOR_NOT_FOUND / ERR_ASSIGNMENT_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_TICKET_NOT_FOUND / ERR_REFERRAL_NOT_FOUND / ERR_INTERVENTION_NOT_FOUND / ERR_HOLD_NOT_FOUND / ERR_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids

  - priority: 4.5
    category: concurrency
    check: "On POST /advising/advisor-assignments only: expected_student_version == current Student.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /advising/advisor-assignments"

  - priority: 5
    category: state
    check: "Path-target state preconditions: state-machine from-state (appointment/ticket/referral/hold/plan/assignment/intervention); Student care_status != INACTIVE for note creation (ERR_STUDENT_INACTIVE); Student care_status == ENROLLED for advisor-assignment creation (ERR_STUDENT_NOT_ENROLLED)"
    error_id: "ERR_APPOINTMENT_INVALID_STATE / ERR_TICKET_INVALID_STATE / ERR_REFERRAL_INVALID_STATE / ERR_HOLD_NOT_ACTIVE / ERR_PLAN_INVALID_STATE / ERR_ASSIGNMENT_ALREADY_ENDED / ERR_INTERVENTION_ALREADY_CLOSED / ERR_STUDENT_INACTIVE / ERR_STUDENT_NOT_ENROLLED"
    http_status: 409
    applies_to: state transitions and creation gated on the path student's state

  - priority: 6
    category: business_safety
    check: "Ownership and confidentiality: Advisor-role callers must be the student's assigned advisor (ACTIVE assignment with advisor_id == X-User-ID) for hold release, plan approve, outreach, intervention create/close, and referral close; for appointment complete, ownership means X-User-ID == appointment.advisor_id; CONFIDENTIAL note creation only by assigned advisor or AdvisingDirector (ERR_NOTE_CONFIDENTIALITY_RESTRICTED)"
    error_id: "ERR_NOT_ASSIGNED_ADVISOR / ERR_NOTE_CONFIDENTIALITY_RESTRICTED"
    http_status: 403
    applies_to: ownership-gated endpoints and CONFIDENTIAL note creation

  - priority: 7
    category: business_constraint
    check: "Capacity/uniqueness/eligibility/overlap: advisor capacity (ERR_ADVISOR_AT_CAPACITY), major served (ERR_MAJOR_NOT_SERVED), advisor ACTIVE for manual assignment (ERR_ADVISOR_NOT_ACTIVE), empty auto-assign pool (ERR_NO_ELIGIBLE_ADVISOR), one active ticket per student per queue_date (ERR_STUDENT_ALREADY_HAS_ACTIVE_TICKET), queue-day capacity (ERR_QUEUE_CAPACITY_REACHED), empty queue on call-next (ERR_QUEUE_EMPTY), advisor schedule half-open overlap (ERR_APPOINTMENT_OVERLAP), one non-terminal plan per student (ERR_PLAN_ALREADY_ACTIVE), submit gates (ERR_PLAN_CREDITS_INSUFFICIENT, ERR_PLAN_TERM_OVERLOAD)"
    error_id: "ERR_ADVISOR_AT_CAPACITY / ERR_MAJOR_NOT_SERVED / ERR_ADVISOR_NOT_ACTIVE / ERR_NO_ELIGIBLE_ADVISOR / ERR_STUDENT_ALREADY_HAS_ACTIVE_TICKET / ERR_QUEUE_CAPACITY_REACHED / ERR_QUEUE_EMPTY / ERR_APPOINTMENT_OVERLAP / ERR_PLAN_ALREADY_ACTIVE / ERR_PLAN_CREDITS_INSUFFICIENT / ERR_PLAN_TERM_OVERLOAD"
    http_status: "409 (ERR_NO_ELIGIBLE_ADVISOR: 422)"
    applies_to: creation and gate endpoints

  - priority: 8
    category: business_temporal
    check: "Check-in allowed only within [start - 10min, start + 10min] inclusive of logical now"
    error_id: ERR_OUTSIDE_CHECK_IN_WINDOW
    http_status: 409
    applies_to: "POST /advising/appointments/{appointmentId}/check-in"

  - priority: 9
    category: business_referential
    check: "Cross-entity state: appointment creation requires Student care_status == ENROLLED (ERR_STUDENT_NOT_ENROLLED) and Advisor status == ACTIVE (ERR_ADVISOR_NOT_ACTIVE); hold release with requires_approved_plan requires an APPROVED DegreePlan (ERR_PLAN_NOT_APPROVED)"
    error_id: "ERR_STUDENT_NOT_ENROLLED / ERR_ADVISOR_NOT_ACTIVE / ERR_PLAN_NOT_APPROVED"
    http_status: 409
    applies_to: "POST /advising/appointments, POST /advising/students/{id}/holds/{holdId}/release"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (last-resort endpoint; time rules need a logical clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time."
    roles: [AdvisingDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock advanced; subsequent computed fields (is_sla_breached, sweeps) observe the new time"]

  # --- Advisors ---
  - method: POST
    path: "/advising/advisors"
    description: "Create advisor"
    roles: [AdvisingDirector]
    code: 201
    input: [full_name, email, major_codes, max_caseload]
    output: Advisor
    side_effects: ["status=ACTIVE, assigned_active_count=0, weighted_load=0, scheduled_minutes=0"]
  - method: GET
    path: "/advising/advisors"
    description: "List advisors"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Advisor[]"
    side_effects: []
  - method: GET
    path: "/advising/advisors/{advisorId}"
    description: "Get advisor (computed load fields)"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: []
    output: Advisor
    side_effects: []
  - method: PATCH
    path: "/advising/advisors/{advisorId}"
    description: "Update advisor status or capacity; setting status=INACTIVE blocks new assignments/appointments referencing this advisor (ERR_ADVISOR_NOT_ACTIVE)"
    roles: [AdvisingDirector]
    code: 200
    input: ["status?", "max_caseload?"]
    output: Advisor
    side_effects: ["max_caseload must be >= current assigned_active_count (ERR_VALIDATION)"]

  # --- Students ---
  - method: POST
    path: "/advising/students"
    description: "Create student"
    roles: [AdvisingDirector, FrontDeskStaff]
    code: 201
    input: [full_name, email, major_code, cohort_year, current_term_code, gpa, "advising_required_flag?"]
    output: Student
    side_effects: ["care_status=ENROLLED, enrolled_term_codes=[current_term_code], at_risk_score/risk_tier/requirement/clearance computed"]
  - method: GET
    path: "/advising/students"
    description: "List students"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff, FacultyReferrer]
    code: 200
    input: ["major_code?", "cohort_year?", "risk_tier?", "care_status?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []
  - method: GET
    path: "/advising/students/{id}"
    description: "Get student (computed risk/clearance fields)"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: PATCH
    path: "/advising/students/{id}"
    description: "Update student term/flag/status/gpa"
    roles: [AdvisingDirector]
    code: 200
    input: ["current_term_code?", "advising_required_flag?", "care_status?", "gpa?"]
    output: Student
    side_effects: ["If current_term_code changes and care_status == ENROLLED and new term not yet listed: append to enrolled_term_codes", "gpa change recomputes at_risk_score/risk_tier", "increments Student.version by 1"]

  # --- Advisor assignments ---
  - method: POST
    path: "/advising/advisor-assignments"
    description: "Manual assignment (create-with-supersede; OCC on Student.version)"
    roles: [AdvisingDirector]
    code: 201
    input: [student_id, advisor_id, expected_student_version]
    output: AdvisorAssignment
    side_effects: ["Any existing ACTIVE assignment for the student -> ENDED with ended_reason=SUPERSEDED", "assignment_mode=MANUAL, status=ACTIVE", "Recompute both affected advisors' assigned_active_count and weighted_load", "increments Student.version by 1"]
  - method: POST
    path: "/advising/advisor-assignments/auto-assign"
    description: "Selector-policy assignment: eligibility = advisor.status ACTIVE AND student.major_code IN advisor.major_codes AND assigned_active_count < max_caseload; rank by ranking_mode (WEIGHTED default: weighted_load ASC, tie assigned_active_count ASC, tie created_at ASC; HEADCOUNT: assigned_active_count ASC, tie weighted_load ASC, tie created_at ASC); empty pool -> ERR_NO_ELIGIBLE_ADVISOR"
    roles: [AdvisingDirector]
    code: 201
    input: [student_id, "ranking_mode?"]
    output: AdvisorAssignment
    side_effects: ["Any existing ACTIVE assignment for the student -> ENDED with ended_reason=SUPERSEDED", "assignment_mode=AUTO, status=ACTIVE", "Recompute affected advisors' assigned_active_count and weighted_load", "increments Student.version by 1"]
  - method: GET
    path: "/advising/advisor-assignments"
    description: "List assignments (filtered)"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: ["student_id?", "advisor_id?", "status?", "limit?", "offset?"]
    output: "AdvisorAssignment[]"
    side_effects: []
  - method: GET
    path: "/advising/advisor-assignments/{assignmentId}"
    description: "Get assignment"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: []
    output: AdvisorAssignment
    side_effects: []
  - method: POST
    path: "/advising/advisor-assignments/{assignmentId}/end"
    description: "End an ACTIVE assignment (compensating action)"
    roles: [AdvisingDirector]
    code: 200
    input: []
    output: AdvisorAssignment
    side_effects: ["status -> ENDED, ended_reason=MANUAL_END", "Recompute advisor assigned_active_count and weighted_load", "increments Student.version by 1"]

  # --- Appointments ---
  - method: POST
    path: "/advising/appointments"
    description: "Book appointment; [start,end) must not overlap the advisor's existing SCHEDULED/CHECKED_IN appointments (adjacent allowed, half-open); student must be ENROLLED; advisor ACTIVE; duration 15-60 min"
    roles: [FrontDeskStaff, Advisor, AdvisingDirector]
    code: 201
    input: [student_id, advisor_id, term_code, scheduled_start_at, scheduled_end_at]
    output: Appointment
    side_effects: ["status=SCHEDULED, duration_minutes computed", "Recompute advisor.scheduled_minutes"]
  - method: GET
    path: "/advising/appointments"
    description: "List appointments (filtered)"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: ["student_id?", "advisor_id?", "status?", "term_code?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: GET
    path: "/advising/appointments/{appointmentId}"
    description: "Get appointment"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/advising/appointments/{appointmentId}/check-in"
    description: "Check in within [start-10min, start+10min] inclusive"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CHECKED_IN, checked_in_at set"]
  - method: POST
    path: "/advising/appointments/{appointmentId}/cancel"
    description: "Cancel a SCHEDULED appointment"
    roles: [FrontDeskStaff, Advisor, AdvisingDirector]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CANCELLED", "Recompute advisor.scheduled_minutes"]
  - method: POST
    path: "/advising/appointments/{appointmentId}/complete"
    description: "Complete a CHECKED_IN appointment"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> COMPLETED", "Recompute advisor.scheduled_minutes", "If term_code == student.current_term_code: recompute advising_requirement_status and registration_clearance"]

  # --- Drop-in queue ---
  - method: POST
    path: "/advising/dropin-tickets"
    description: "Join today's drop-in queue; one active (QUEUED/CALLED) ticket per student per queue_date; day capacity DROPIN_MAX_ACTIVE_TICKETS (3) counts QUEUED+CALLED tickets of the queue_date"
    roles: [FrontDeskStaff]
    code: 201
    input: [student_id, reason]
    output: DropInTicket
    side_effects: ["queue_date = logical date, position assigned per calculations.queue_position", "status=QUEUED"]
  - method: GET
    path: "/advising/dropin-tickets"
    description: "List drop-in tickets (filtered)"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: ["student_id?", "called_by_advisor_id?", "status?", "queue_date?", "limit?", "offset?"]
    output: "DropInTicket[]"
    side_effects: []
  - method: GET
    path: "/advising/dropin-tickets/{ticketId}"
    description: "Get drop-in ticket"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: []
    output: DropInTicket
    side_effects: []
  - method: POST
    path: "/advising/dropin-tickets/call-next"
    description: "Call the lowest-position QUEUED ticket of the current logical date; empty queue -> ERR_QUEUE_EMPTY"
    roles: [Advisor]
    code: 200
    input: []
    output: DropInTicket
    side_effects: ["status -> CALLED", "called_by_advisor_id = caller's Advisor.id (X-User-ID)"]
  - method: POST
    path: "/advising/dropin-tickets/{ticketId}/complete"
    description: "Mark CALLED ticket served"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: []
    output: DropInTicket
    side_effects: ["status -> SERVED"]
  - method: POST
    path: "/advising/dropin-tickets/{ticketId}/leave"
    description: "Student leaves the queue (QUEUED or CALLED)"
    roles: [FrontDeskStaff, Advisor, AdvisingDirector]
    code: 200
    input: []
    output: DropInTicket
    side_effects: ["status -> LEFT"]

  # --- Early-alert referrals ---
  - method: POST
    path: "/advising/referrals"
    description: "Intake an early-alert referral; due_at = created_at + SLA_DAYS[severity]"
    roles: [FacultyReferrer, AdvisingDirector]
    code: 201
    input: [student_id, source, severity, reason]
    output: EarlyAlertReferral
    side_effects: ["status=OPEN, attempt_count=0, due_at computed", "Recompute student at_risk_score/risk_tier (severity boost)"]
  - method: GET
    path: "/advising/referrals"
    description: "List referrals (filtered)"
    roles: [AdvisingDirector, Advisor, FacultyReferrer]
    code: 200
    input: ["student_id?", "status?", "severity?", "is_sla_breached?", "limit?", "offset?"]
    output: "EarlyAlertReferral[]"
    side_effects: []
  - method: GET
    path: "/advising/referrals/{referralId}"
    description: "Get referral (is_sla_breached recomputed against logical clock on read)"
    roles: [AdvisingDirector, Advisor, FacultyReferrer]
    code: 200
    input: []
    output: EarlyAlertReferral
    side_effects: []
  - method: POST
    path: "/advising/referrals/{referralId}/outreach"
    description: "Log an outreach attempt; NO_ANSWER cycles OPEN->OUTREACH_IN_PROGRESS->NO_RESPONSE->OUTREACH_IN_PROGRESS; REACHED -> RESPONDED; NO_ANSWER bringing attempt_count to 3 auto-escalates"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: [outcome, "note?"]
    output: EarlyAlertReferral
    side_effects: ["attempt_count += 1", "status transition per EarlyAlertReferral state machine", "On auto-escalation: full escalation cascade (Intervention -> risk -> flag/requirement/clearance -> advisor weighted_load)"]
  - method: POST
    path: "/advising/referrals/{referralId}/escalate"
    description: "Manually escalate a non-terminal referral"
    roles: [AdvisingDirector]
    code: 200
    input: ["reason?"]
    output: EarlyAlertReferral
    side_effects: ["status -> ESCALATED", "Escalation cascade: create Intervention (OPEN, ACADEMIC_COACHING) -> student at_risk_score recompute -> HIGH-tier flag/requirement/clearance flip -> assigned advisor weighted_load recompute"]
  - method: POST
    path: "/advising/referrals/{referralId}/close"
    description: "Close a RESPONDED or ESCALATED referral"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: []
    output: EarlyAlertReferral
    side_effects: ["status -> CLOSED", "Recompute student at_risk_score (referral boost removed if it was the max open severity)"]

  # --- Interventions ---
  - method: POST
    path: "/advising/interventions"
    description: "Create an intervention manually"
    roles: [Advisor, AdvisingDirector]
    code: 201
    input: [student_id, "referral_id?", intervention_type, "note?"]
    output: Intervention
    side_effects: ["status=OPEN", "Recompute student at_risk_score/risk_tier (+10 per OPEN intervention); HIGH flip sets advising_required_flag=true and recomputes requirement/clearance; recompute assigned advisor weighted_load"]
  - method: GET
    path: "/advising/interventions"
    description: "List interventions (filtered)"
    roles: [AdvisingDirector, Advisor]
    code: 200
    input: ["student_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: "Intervention[]"
    side_effects: []
  - method: GET
    path: "/advising/interventions/{interventionId}"
    description: "Get intervention"
    roles: [AdvisingDirector, Advisor]
    code: 200
    input: []
    output: Intervention
    side_effects: []
  - method: POST
    path: "/advising/interventions/{interventionId}/close"
    description: "Close an OPEN intervention with an outcome"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: [outcome]
    output: Intervention
    side_effects: ["status -> CLOSED, outcome recorded", "Recompute student at_risk_score/risk_tier (OPEN-intervention weight removed); recompute assigned advisor weighted_load"]

  # --- Registration holds (student sub-resource) ---
  - method: POST
    path: "/advising/students/{id}/holds"
    description: "Place a registration hold"
    roles: [AdvisingDirector]
    code: 201
    input: [hold_type, "requires_approved_plan?"]
    output: RegistrationHold
    side_effects: ["status=ACTIVE", "Recompute student registration_clearance (-> BLOCKED) and at_risk_score (+8 per ACTIVE hold)"]
  - method: GET
    path: "/advising/students/{id}/holds"
    description: "List a student's holds"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RegistrationHold[]"
    side_effects: []
  - method: POST
    path: "/advising/students/{id}/holds/{holdId}/release"
    description: "Release an ACTIVE hold; requires APPROVED plan when requires_approved_plan"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: []
    output: RegistrationHold
    side_effects: ["status -> RELEASED", "Cascade: recompute registration_clearance (CLEARED when no ACTIVE holds and requirement != REQUIRED); recompute at_risk_score (hold weight removed)"]

  # --- Degree plans (student sub-resource) ---
  - method: POST
    path: "/advising/students/{id}/degree-plans"
    description: "Create a DRAFT degree plan with term-by-term course map; rejected when the student already has a DRAFT or SUBMITTED plan"
    roles: [Advisor, AdvisingDirector]
    code: 201
    input: [catalog_year, required_credits, terms]
    output: DegreePlan
    side_effects: ["status=DRAFT", "mapped_credits_total computed per calculations.term_credit_mapping"]
  - method: GET
    path: "/advising/students/{id}/degree-plans"
    description: "List a student's degree plans"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DegreePlan[]"
    side_effects: []
  - method: GET
    path: "/advising/students/{id}/degree-plans/{planId}"
    description: "Get a degree plan"
    roles: [AdvisingDirector, Advisor, FrontDeskStaff]
    code: 200
    input: []
    output: DegreePlan
    side_effects: []
  - method: PATCH
    path: "/advising/students/{id}/degree-plans/{planId}"
    description: "Edit terms/required_credits while DRAFT"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: ["terms?", "required_credits?"]
    output: DegreePlan
    side_effects: ["mapped_credits_total recomputed"]
  - method: POST
    path: "/advising/students/{id}/degree-plans/{planId}/submit"
    description: "Submit a DRAFT plan (credit and term-overload gates)"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: []
    output: DegreePlan
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/advising/students/{id}/degree-plans/{planId}/approve"
    description: "Approve a SUBMITTED plan (assigned advisor or director)"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: []
    output: DegreePlan
    side_effects: ["status -> APPROVED", "Recompute student registration_clearance"]
  - method: POST
    path: "/advising/students/{id}/degree-plans/{planId}/return"
    description: "Return a SUBMITTED plan to DRAFT for revision (revision cycle)"
    roles: [Advisor, AdvisingDirector]
    code: 200
    input: [reason]
    output: DegreePlan
    side_effects: ["status -> DRAFT"]

  # --- Advising notes (student sub-resource) ---
  - method: POST
    path: "/advising/students/{id}/notes"
    description: "Add a note; CONFIDENTIAL only by assigned advisor or AdvisingDirector; student must not be INACTIVE"
    roles: [Advisor, AdvisingDirector]
    code: 201
    input: [visibility, body]
    output: AdvisingNote
    side_effects: ["author_user_id = X-User-ID header value"]
  - method: GET
    path: "/advising/students/{id}/notes"
    description: "List notes; CONFIDENTIAL notes visible only to their author and to AdvisingDirector callers (filtered server-side)"
    roles: [AdvisingDirector, Advisor]
    code: 200
    input: ["visibility?", "limit?", "offset?"]
    output: "AdvisingNote[]"
    side_effects: []

  # --- Retention reporting ---
  - method: GET
    path: "/advising/reports/retention"
    description: "Retention report; variant COHORT_PERSISTED (requires cohort_year) or TERM_OVER_TERM (requires from_term_code, to_term_code; cohort_year optional filter); rate = numerator/denominator, 4dp round_half_up; denominator 0 -> rate 0"
    roles: [AdvisingDirector]
    code: 200
    input: [variant, "cohort_year?", "from_term_code?", "to_term_code?"]
    output: "{ variant: enum, cohort_year: integer, numerator: integer, denominator: integer, rate: number }"
    side_effects: []

  # --- Ops-run checkpoint ---
  - method: POST
    path: "/advising/ops/daily-close"
    description: "Close-of-day sweep: SCHEDULED appointments with now > start+10min -> NO_SHOW (student no_show_count + risk cascade); QUEUED drop-in tickets with queue_date < current logical date -> LEFT"
    roles: [AdvisingDirector]
    code: 200
    input: []
    output: "{ no_show_marked: integer, queue_expired: integer }"
    side_effects: ["Appointment NO_SHOW sweep with risk cascade per state machine", "Stale QUEUED tickets -> LEFT"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role missing or role value unknown" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum value, unparseable datetime, gpa outside 0.0-4.0, max_caseload < 1, or other request-shape violation" }
  - { id: ERR_INVALID_APPOINTMENT_DURATION, http: 400, condition: "Appointment end <= start, or duration outside [15, 60] minutes" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_NOT_ASSIGNED_ADVISOR, http: 403, condition: "Advisor-role caller is not the student's assigned advisor for an ownership-gated operation" }
  - { id: ERR_NOTE_CONFIDENTIALITY_RESTRICTED, http: 403, condition: "CONFIDENTIAL note creation attempted by an Advisor who is not the student's assigned advisor" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "student_id (path or body) does not exist" }
  - { id: ERR_ADVISOR_NOT_FOUND, http: 404, condition: "advisor_id (path or body) does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appointmentId does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "ticketId does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "referral_id (path or body) does not exist" }
  - { id: ERR_INTERVENTION_NOT_FOUND, http: 404, condition: "interventionId does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "holdId does not exist under the path student" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "planId does not exist under the path student" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_student_version does not match current Student.version on assignment create (OCC)" }
  - { id: ERR_STUDENT_NOT_ENROLLED, http: 409, condition: "Operation requires Student care_status == ENROLLED (assignment creation, appointment booking)" }
  - { id: ERR_STUDENT_INACTIVE, http: 409, condition: "Note creation blocked because Student care_status == INACTIVE" }
  - { id: ERR_ADVISOR_NOT_ACTIVE, http: 409, condition: "Referenced Advisor status != ACTIVE" }
  - { id: ERR_ADVISOR_AT_CAPACITY, http: 409, condition: "Manual assignment would violate assigned_active_count < max_caseload (at capacity means count == max_caseload)" }
  - { id: ERR_MAJOR_NOT_SERVED, http: 409, condition: "Manual assignment: student.major_code not in advisor.major_codes" }
  - { id: ERR_NO_ELIGIBLE_ADVISOR, http: 422, condition: "Auto-assign selector pool empty (no ACTIVE advisor serving the major with capacity headroom)" }
  - { id: ERR_ASSIGNMENT_ALREADY_ENDED, http: 409, condition: "End requested on an assignment not in ACTIVE" }
  - { id: ERR_APPOINTMENT_OVERLAP, http: 409, condition: "Requested [start,end) intersects an existing SCHEDULED/CHECKED_IN appointment of the same advisor (half-open: touching endpoints allowed)" }
  - { id: ERR_OUTSIDE_CHECK_IN_WINDOW, http: 409, condition: "Check-in outside [start-10min, start+10min] inclusive" }
  - { id: ERR_APPOINTMENT_INVALID_STATE, http: 409, condition: "Appointment transition attempted from a non-source state" }
  - { id: ERR_QUEUE_CAPACITY_REACHED, http: 409, condition: "queue_date already has DROPIN_MAX_ACTIVE_TICKETS (3) QUEUED+CALLED tickets" }
  - { id: ERR_STUDENT_ALREADY_HAS_ACTIVE_TICKET, http: 409, condition: "Student already has a QUEUED or CALLED ticket for the current queue_date" }
  - { id: ERR_QUEUE_EMPTY, http: 409, condition: "call-next with no QUEUED ticket for the current logical date" }
  - { id: ERR_TICKET_INVALID_STATE, http: 409, condition: "Ticket transition attempted from a non-source state (e.g., complete a QUEUED ticket, leave a SERVED ticket)" }
  - { id: ERR_REFERRAL_INVALID_STATE, http: 409, condition: "Referral transition attempted from a non-source state (e.g., outreach on CLOSED, close on OPEN)" }
  - { id: ERR_INTERVENTION_ALREADY_CLOSED, http: 409, condition: "Close requested on an intervention not OPEN" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "Release requested on a hold not in ACTIVE" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Hold release requires an APPROVED DegreePlan and none exists" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "Plan transition/PATCH attempted from a non-source state (e.g., submit an APPROVED plan, return a DRAFT)" }
  - { id: ERR_PLAN_ALREADY_ACTIVE, http: 409, condition: "Student already has a DRAFT or SUBMITTED degree plan" }
  - { id: ERR_PLAN_CREDITS_INSUFFICIENT, http: 409, condition: "Submit blocked: mapped_credits_total < required_credits" }
  - { id: ERR_PLAN_TERM_OVERLOAD, http: 409, condition: "Submit blocked: a term's rounded credits exceed MAX_TERM_CREDITS (18)" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: AdvisingDirector
    description: "Advising center director; superset operator — manages advisors, students, assignments, holds, escalations, ops sweep, clock, and retention reporting; may perform every Advisor-gated operation without ownership restriction"
    identity: opaque
    exclusive_operations:
      - "POST /advising/advisors — create advisor"
      - "PATCH /advising/advisors/{id} — update advisor status/capacity"
      - "PATCH /advising/students/{id} — term rollover / care status / flag / gpa"
      - "POST /advising/advisor-assignments — manual assignment (OCC)"
      - "POST /advising/advisor-assignments/auto-assign — selector assignment"
      - "POST /advising/advisor-assignments/{id}/end — end assignment"
      - "POST /advising/students/{id}/holds — place hold"
      - "POST /advising/referrals/{id}/escalate — escalate referral"
      - "GET /advising/reports/retention — retention report"
      - "POST /advising/ops/daily-close — ops sweep"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "All Advisor operations (appointments, outreach, interventions, plans, notes, hold release) without ownership restriction"
      - "All read endpoints"
  - name: Advisor
    description: "Staff advisor; acts on assigned students (ownership = ACTIVE AdvisorAssignment with advisor_id == X-User-ID) for outreach, interventions, plan approval, hold release, note authoring; runs the drop-in counter"
    identity: "entity_backed:Advisor"
    exclusive_operations:
      - "POST /advising/dropin-tickets/call-next — call next queued ticket (sets called_by_advisor_id to caller)"
    shared_operations:
      - "POST /advising/appointments, POST .../complete, POST .../cancel"
      - "POST /advising/referrals/{id}/outreach, POST .../close (assigned students)"
      - "POST /advising/interventions, POST /advising/interventions/{id}/close (assigned students)"
      - "POST /advising/students/{id}/holds/{holdId}/release (assigned students)"
      - "POST/PATCH/POST-submit/POST-approve/POST-return degree plans (assigned students)"
      - "POST /advising/students/{id}/notes (CONFIDENTIAL only when assigned)"
      - "GET endpoints listed per endpoint roles"
  - name: FrontDeskStaff
    description: "Front-desk operator; books/cancels/checks-in appointments, manages the drop-in queue intake and departures, registers students"
    identity: opaque
    exclusive_operations:
      - "POST /advising/appointments/{id}/check-in — check-in"
      - "POST /advising/dropin-tickets — queue intake"
    shared_operations:
      - "POST /advising/students — register student"
      - "POST /advising/appointments, POST .../cancel"
      - "POST /advising/dropin-tickets/{id}/leave"
      - "GET endpoints listed per endpoint roles"
  - name: FacultyReferrer
    description: "Faculty/staff referrer; files early-alert referrals and can read referral status"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /advising/referrals — file referral"
      - "GET /advising/referrals, GET /advising/referrals/{id}, GET /advising/students"
