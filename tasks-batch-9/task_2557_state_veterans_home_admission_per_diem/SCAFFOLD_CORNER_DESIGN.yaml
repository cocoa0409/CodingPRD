      - name: sm_resident_parallel_state_dimensions_move_independently
        claim_type: parallel_independent_dimensions
        grounds:
          - state_machines.Resident.ADMITTED_to_HOSPITALIZED
          - state_machines.Resident.PROVISIONAL_COST_SHARE_to_FINAL_COST_SHARE
        excluded_because:
          difficulty_instance: non_linear_state_machine / resident_parallel_occupancy_and_billing_dimensions
          rationale: "The named §1.8 instance advances the billing dimension while the occupancy dimension sits in HOSPITALIZED and asserts both dimensions independently."

      - name: sm_survey_decertification_cascades_across_three_entities
        claim_type: cascade_down_side_effect
        grounds:
          - state_machines.CareUnit.CERTIFIED_to_DECERTIFIED
          - state_machines.VeteransHome.RECOGNIZED_to_SUSPENDED
          - state_machines.PerDiemClaim.DRAFT_to_VOID
        excluded_because:
          difficulty_instance: transitive_cascade / survey_failure_cascade_unit_home_claims
          rationale: "The named §1.8 instance asserts all four cascade hops of the DECERTIFIED entry, including the home suspension and the claim voiding."

      - name: sm_waitlist_offer_decline_loop_terminates
        claim_type: cyclic_loop_back
        grounds:
          - state_machines.WaitlistEntry.ACTIVE_to_OFFERED
          - state_machines.WaitlistEntry.OFFERED_to_ACTIVE
          - state_machines.WaitlistEntry.ACTIVE_to_EXPIRED
        excluded_because:
          difficulty_instance: non_linear_state_machine / waitlist_offer_decline_cycle_terminates_at_max_declines
          rationale: "The named §1.8 instance runs three full offer/decline laps and asserts termination at MAX_DECLINED_OFFERS."

      - name: sm_applicant_ineligible_reentry_cycle
        claim_type: cyclic_loop_back
        grounds:
          - state_machines.Applicant.SUBMITTED_to_INELIGIBLE
          - state_machines.Applicant.INELIGIBLE_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / applicant_ineligible_redetermination_cycle
          rationale: "The named §1.8 instance loops INELIGIBLE -> SUBMITTED -> INELIGIBLE twice and closes the loop on MAX_REDETERMINATIONS."

      - name: sm_claim_rejection_compensates_census_attribution
        claim_type: compensation_side_effect
        grounds:
          - state_machines.PerDiemClaim.SUBMITTED_to_REJECTED
          - entities.CensusDay.fields.per_diem_claim_id
        excluded_because:
          difficulty_instance: compensating_invariant / claim_rejection_restores_unclaimed_census_days
          rationale: "The named §1.8 instance asserts that rejection releases every attributed census day and restores the unclaimed-day pool exactly."

  - section: calculations
    instances:
      - name: calc_priority_class_threshold_boundaries
        claim_type: threshold_boundary
        grounds:
          - calculations.applicant_priority_class
          - calculations.applicant_priority_score
          - entities.Applicant.fields.priority_class
        distinguishing_aspect: |
          The class ladder is first-match-wins with inclusive boundaries: disability exactly 70 is
          CLASS_1 (score 1240), 69 with residency exactly 5 is CLASS_2 (932), 69 with residency 4 is
          CLASS_3 (627), and a non-wartime applicant with residency 1 is CLASS_4 whose raw total 105
          survives the max(base, raw) floor.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome and one CERTIFIED NURSING CareUnit; the logical clock stands at 2026-08-01T00:00:00Z."
            - "Four SUBMITTED applicants, all HONORABLE with service_days 900, application_received_date 2026-08-01 (so tenure_pts is 0) and no clinical assessment."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Birchwood State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 4, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Class One Boundary", date_of_birth: "1950-01-01", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 70, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { a1_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Class Two Boundary", date_of_birth: "1950-01-02", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 69, nursing_care_for_service_connected: false, state_residency_years: 5, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { a2_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Class Three Boundary", date_of_birth: "1950-01-03", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 69, nursing_care_for_service_connected: false, state_residency_years: 4, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { a3_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Class Four Boundary", date_of_birth: "1950-01-04", service_days: 900, discharge_character: "HONORABLE", wartime_service: false, service_connected_disability_pct: 0, nursing_care_for_service_connected: false, state_residency_years: 1, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { a4_id: "$.data.id" }
          trigger:
            - call: "POST /svh/applicants/${a1_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
              captures: { c1: "$.data.priority_class", s1: "$.data.priority_score", r1: "$.data.eligibility_reason_code" }
            - call: "POST /svh/applicants/${a2_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
              captures: { c2: "$.data.priority_class", s2: "$.data.priority_score" }
            - call: "POST /svh/applicants/${a3_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
              captures: { c3: "$.data.priority_class", s3: "$.data.priority_score" }
            - call: "POST /svh/applicants/${a4_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
              captures: { c4: "$.data.priority_class", s4: "$.data.priority_score" }
          assert:
            - "r1 == ELIGIBLE"
            - "c1 == CLASS_1"
            - "s1 == 1240"
            - "c2 == CLASS_2"
            - "s2 == 932"
            - "c3 == CLASS_3"
            - "s3 == 627"
            - "c4 == CLASS_4"
            - "s4 == 105"
            - "Applicant.${a4_id}.status == ELIGIBLE"

      - name: calc_priority_score_selects_latest_submitted_assessment_with_caps
        claim_type: input_set_filtering
        grounds:
          - calculations.applicant_priority_score
          - entities.ClinicalAssessment.fields.acuity_points
        distinguishing_aspect: |
