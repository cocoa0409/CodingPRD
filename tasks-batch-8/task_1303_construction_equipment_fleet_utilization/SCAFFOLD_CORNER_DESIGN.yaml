              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409; project remains OPEN"

      - name: mechanic_off_duty_cycle_and_dispatch_block
        claim_type: valid_transition
        grounds: [state_machines.Mechanic.AVAILABLE_to_OFF_DUTY, state_machines.Mechanic.OFF_DUTY_to_AVAILABLE, "validations[priority=14]"]
        distinguishing_aspect: "off-duty flips AVAILABLE -> OFF_DUTY; while OFF_DUTY, dispatch is rejected ERR_MECHANIC_UNAVAILABLE (status != AVAILABLE); on-duty restores dispatchability."
        test_recipe:
          setup: ["Project P203, equipment E203, mechanic M203, OPEN work order W203"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
