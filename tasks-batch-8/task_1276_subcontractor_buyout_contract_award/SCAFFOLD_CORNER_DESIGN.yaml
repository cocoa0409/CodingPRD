              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /trade-packages/${tp_id}/publish"
              as: GCAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE and HTTP status == 403"

  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: layer_dual_variant_buyout_savings
        claim_type: dual_variant_calculation
        grounds: [calculations.buyout_savings_vs_estimate]
        excluded_because:
          difficulty_instance: buyout_savings_provisional_excludes_pending_vs_final_includes
          rationale: "Both variants asserted with literal divergent values in the named §1.8 instance."
      - name: layer_dual_variant_insurance
        claim_type: dual_variant_calculation
        grounds: [calculations.insurance_compliance_check]
        excluded_because:
          difficulty_instance: insurance_compliance_full_endorsements_vs_gap_analysis_waivers
          rationale: "Both variants asserted with literal divergent verdicts in the named §1.8 instance."
      - name: layer_cascading_side_effects_default
        claim_type: cascading_side_effects
        grounds: [state_machines.Subcontract.EXECUTED_to_DEFAULTED]
        excluded_because:
          difficulty_instance: default_cascade_subcontract_to_package_to_project_buyout_complete
          rationale: "Depth-3 cascade asserted hop-by-hop in the named §1.8 instance."
      - name: layer_cascading_side_effects_replacement
        claim_type: cascading_side_effects
        grounds: [state_machines.Subcontract.EXECUTED_to_REPLACED]
        excluded_because:
          difficulty_instance: replacement_cascade_spawns_draft_and_rearms_bond_and_insurance
          rationale: "Spawn-and-reset cascade asserted in the named §1.8 instance."
      - name: layer_rate_threshold_negotiation_cap
        claim_type: rate_threshold_triggers
        grounds: [state_machines.Subcontract.DRAFT_to_PENDING_AWARD]
        excluded_because:
          difficulty_instance: negotiation_cycle_pending_to_draft_loop_with_two_round_cap
          rationale: "Counter-capped threshold asserted in the named §1.8 instance."
      - name: layer_rate_threshold_co_authority
        claim_type: rate_threshold_triggers
        grounds: [calculations.change_authority_check]
        excluded_because:
          difficulty_instance: authority_cumulative_ratio_exactly_at_ten_percent_boundary
          rationale: "Cumulative-ratio threshold asserted at the inclusive boundary in the named §1.8 instance."
      - name: layer_derived_field_reconciliation_sov_status
        claim_type: derived_field_reconciliation
        grounds: [entities.Subcontract.fields.sov_status, state_machines.ScheduleOfValues.BALANCED_to_APPROVED]
        distinguishing_aspect: "Subcontract.sov_status mirrors the SOV lifecycle: DRAFT (none) -> BALANCED (submit) -> APPROVED (approve); each hop is visible on the subcontract read immediately."
        test_recipe:
          setup: ["subcontract EXECUTED (WAIVED bond, compliant insurance)"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-L1", project_number: "L1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "L1-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "BI", contact_email: "bi@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "BJ", contact_email: "bj@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "BI", source_bid_id: "${bid_1}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_id: $.data.id }
            - call: "POST /subcontracts/${sub_id}/recommend-award"
              payload: { contract_value_cents: 9000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_id}/award"
              as: OperationsManager
            - call: "POST /subcontracts/${sub_id}/insurance-certificates"
              payload: { certificate_number: "CERT-L1", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: true, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2027-06-01" }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_id}/issue"
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_id}/execute"
              as: BuyoutLead
            - call: "GET /subcontracts/${sub_id}"
              as: BuyoutLead
              captures: { sov_pre: $.data.sov_status }
          trigger:
            - call: "POST /subcontracts/${sub_id}/schedule-of-values"
              payload: { lines: [{ wbs_code: "01", description: "All", weight_numerator: 1 }] }
              as: BuyoutLead
              captures: { sov_id: $.data.id }
            - call: "GET /subcontracts/${sub_id}"
              as: BuyoutLead
              captures: { sov_mid: $.data.sov_status }
            - call: "POST /schedule-of-values/${sov_id}/approve"
              as: OperationsManager
            - call: "GET /subcontracts/${sub_id}"
              as: BuyoutLead
              captures: { sov_post: $.data.sov_status }
          assert:
            - "sov_pre == DRAFT (no SOV yet)"
            - "sov_mid == BALANCED (derived field updated by submit)"
            - "sov_post == APPROVED (derived field updated by approve)"

