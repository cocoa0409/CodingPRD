            - "trigger call 8 at 2027-08-31T23:59:59Z returns 201 — one second before period_end is still inside the window"
            - "trigger call 10 at exactly 2027-09-01T00:00:00Z returns 422 ERR_NOTICE_OUTSIDE_PERIOD: the upper bound is EXCLUSIVE, and this is the mirror image of trigger call 4"
