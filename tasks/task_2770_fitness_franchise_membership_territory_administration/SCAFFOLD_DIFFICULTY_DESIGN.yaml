              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { promo1_id: $.data.id }
            - call: "POST /franchise/promotions/${promo1_id}/review"
              payload: { decision: "APPROVE" }
              as: BrandAdministrator
              as_user_id: "brand-reviewer-1"
          trigger:
            - call: "POST /franchise/promotions"
              payload: { franchisee_id: "${f1_id}", plan_template_id: "${pt_id}", code: "AUG35", discount_pct: 0.35, starts_on: "2026-08-01", ends_on: "2026-08-31" }
