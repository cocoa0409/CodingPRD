              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/simulcast-grants"
              payload: { platform: "KICK", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { g_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/streams"
              payload: { title: "Sim", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", simulcast: true }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { s_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/streams/${s_id}/transition"
              payload: { action: "START" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/simulcast-grants/${g_id}/transition"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /api/streams/${s_id}/transition"
              payload: { action: "START" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { s_status: $.data.stream_status }
          assert:
            - "While grant REQUESTED: err == ERR_SIMULCAST_GRANT_MISSING; stream stays SCHEDULED"
            - "After APPROVE: START succeeds, stream_status == LIVE, actual_start == 2026-08-10T10:00:00Z, punctuality_minutes_late == 0"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: stream_schedule_half_open_adjacency
        grounds:
          - "validations[priority=12]"
          - "entities.StreamSession.fields.scheduled_start"
        distinguishing_aspect: |
          Half-open interval semantics on StreamSession: [10:00,11:00) and [11:00,12:00) touch
          but do NOT conflict (adjacency allowed), while [10:30,11:30) properly intersects and is
          rejected — adjacency-tolerant semantics on the stream resource.
        test_recipe:
          setup:
            - "Channel; stream S1 scheduled 2026-08-10 10:00-11:00; clock 2026-08-01"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "ov_strm", display_name: "OV Strm", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/streams"
              payload: { title: "S1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /api/channels/${ch_id}/streams"
              payload: { title: "S2", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { s2: $.data.id }
            - call: "POST /api/channels/${ch_id}/streams"
              payload: { title: "S3", scheduled_start: "2026-08-10T10:30:00Z", scheduled_end: "2026-08-10T11:30:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "S2 created (201): start == S1.end is adjacency, allowed under half-open semantics"
            - "S3 rejected: err3 == ERR_STREAM_WINDOW_CONFLICT (proper intersection with both S1 and S2)"

      - name: simulcast_approval_24h_buffer
        grounds:
          - "validations[priority=13]"
          - "state_machines.SimulcastGrant.REQUESTED_to_APPROVED"
        distinguishing_aspect: |
          Buffer interval semantics on SimulcastGrant (different resource AND different semantics
          than the stream half-open rule): two APPROVED KICK windows must be separated by >= 24h
          — a gap of exactly 24h is allowed (inclusive), a 12h gap is rejected even though the
          windows themselves do not overlap.
        test_recipe:
          setup:
            - "Channel STANDARD (W9 verified); grant A KICK [2026-08-10, 2026-08-12] APPROVED; grant B KICK [2026-08-13, 2026-08-14] REQUESTED (exactly 24h after A ends); grant C KICK [2026-08-13T12:00, 2026-08-15T12:00] REQUESTED (12h after B would end... conflicts with B once B approved)"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "ov_sim", display_name: "OV Sim", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "OV Sim LLC", tax_id_last4: "0007", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/simulcast-grants"
              payload: { platform: "KICK", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { g_a: $.data.id }
            - call: "POST /api/simulcast-grants/${g_a}/transition"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/simulcast-grants"
              payload: { platform: "KICK", window_start: "2026-08-13T00:00:00Z", window_end: "2026-08-14T00:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { g_b: $.data.id }
            - call: "POST /api/channels/${ch_id}/simulcast-grants"
              payload: { platform: "KICK", window_start: "2026-08-13T12:00:00Z", window_end: "2026-08-15T12:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { g_c: $.data.id }
          trigger:
            - call: "POST /api/simulcast-grants/${g_b}/transition"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
              captures: { gb_status: $.data.grant_status }
            - call: "POST /api/simulcast-grants/${g_c}/transition"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
              captures: { errc: $.data.error_id }
          assert:
            - "Grant B APPROVED: window_start 2026-08-13 >= A.window_end 2026-08-12 + 24h exactly (inclusive boundary)"
            - "Grant C rejected: errc == ERR_SIMULCAST_BUFFER_CONFLICT (C starts 2026-08-13T12:00, only 12h after B's end 2026-08-14T00:00 - 24h = 2026-08-13T00:00... precisely: C.start < B.end + 24h (2026-08-15T00:00) and B.start < C.end + 24h, so the 24h buffer fails)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: payout_open_cancel_money_conservation
        grounds: [calculations.payout_balance_ledger, state_machines.Payout.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: |
          Conserved quantity: cleared money. payable + in-flight payout amounts + lifetime_paid
          == 100000 at every step; the open (forward) then CANCEL (compensating) pair leaves
          Channel.balance_payable_cents exactly unchanged at 100000.
        test_recipe:
          setup:
            - "W9-verified channel; TIP 100000@0bps cleared -> payable 100000; no payouts"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "ci_pay", display_name: "CI Pay", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "CI Pay LLC", tax_id_last4: "0008", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 100000, platform_fee_bps: 0, occurred_at: "2026-08-03T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { payable_before: $.data.balance_payable_cents }
          trigger:
            - call: "POST /api/channels/${ch_id}/payouts"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { p_id: $.data.id, p_amount: $.data.amount_cents, p_fee: $.data.fee_cents }
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { payable_mid: $.data.balance_payable_cents }
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "CANCEL" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { payable_after: $.data.balance_payable_cents }
          assert:
            - "payable_before == 100000"
            - "After open: payable_mid == 0 and Payout.${p_id}.amount_cents == 100000 (100000 moved into in-flight; 0 + 100000 + 0 == 100000 conserved)"
            - "Payout.${p_id}.fee_cents == 500 (snapshot 100000 >= 100000 -> 50bps)"
            - "After CANCEL: payable_after == 100000 == payable_before (compensating restore exact, no drift) and payout CANCELLED"

      - name: perk_inventory_fulfill_void_conservation
        grounds: [calculations.perk_inventory, state_machines.PerkGrant.FULFILLED_to_VOIDED]
        distinguishing_aspect: |
          Conserved quantity: MERCH inventory units (different conserved quantity than money).
          remaining + count(FULFILLED) == perk_inventory_total (2) across the FULFILL (forward)
          and VOID (compensating) pair; FULFILLED->VOIDED restores exactly one unit.
        test_recipe:
          setup:
            - "Channel; tier TIER_1 price 5000 share 5000bps inventory_total 2; viewer registered; subscription created (cycle-1 revenue + one PENDING MERCH grant)"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "ci_perk", display_name: "CI Perk", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/tiers"
              payload: { tier_code: "TIER_1", monthly_price_cents: 5000, revenue_share_bps: 5000, perk_inventory_total: 2 }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/viewers"
              payload: { handle: "viewer_one" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/subscriptions"
              payload: { viewer_id: "${v_id}", tier_id: "${tier_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "GET /api/subscriptions/${sub_id}/perk-grants"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { pg_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/perk-grants/${pg_id}/transition"
              payload: { action: "FULFILL" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "GET /api/tiers/${tier_id}"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { inv_mid: $.data.perk_inventory_remaining }
            - call: "POST /api/perk-grants/${pg_id}/transition"
              payload: { action: "VOID" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "GET /api/tiers/${tier_id}"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { inv_after: $.data.perk_inventory_remaining }
          assert:
            - "After FULFILL: inv_mid == 1 (2 total - 1 FULFILLED; 1 + 1 == 2 conserved)"
            - "PerkGrant.${pg_id}.perk_status was FULFILLED with fulfilled_at set"
            - "After VOID: inv_after == 2 (2 total - 0 FULFILLED; 2 + 0 == 2 conserved) and grant VOIDED"
