              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "12 Oak St", latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_a_id: $.data.id }
            - call: "POST /store-ops/orders"
              payload: { store_id: "${store_id}", service_address_id: "${addr_a_id}", customer_name: "Ann", customer_phone: "555-0101", food_subtotal_cents: 2200, payment_method: "CARD", tip_cents: 500 }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /store-ops/orders/${ord_id}/production"
