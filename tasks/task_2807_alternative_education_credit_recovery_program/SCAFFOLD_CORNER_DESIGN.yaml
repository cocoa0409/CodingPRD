              captures: { stn_id: $.data.id }
            - call: "POST /support-providers"
              payload: { center_id: "${ctr_a}", role_type: "COUNSELOR", full_name: "Ana Prieto", max_concurrent_students: 2 }
              as: DistrictAdmin
              captures: { prv_a: $.data.id }
            - call: "POST /support-providers"
              payload: { center_id: "${ctr_b}", role_type: "COUNSELOR", full_name: "Bo Riis", max_concurrent_students: 2 }
              as: DistrictAdmin
              captures: { prv_b: $.data.id }
            - call: "POST /courses"
              payload: { code: "BIO1", title: "Biology I", subject_area: "SCIENCE", credit_value: 1.00, modality: "ONLINE", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: true, proctored_exam_weight: 0.40, ncaa_approved: true, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-5101", full_name: "Lia Marek", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_a}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 6.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_a}"
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_a_v1}" }
              as: PlacementCoordinator
