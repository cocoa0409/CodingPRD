  # ===========================================================================
  - section: errors
    instances:

      - name: occ_extract_create_with_stale_year_version_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[extract-create-stale-year]", "errors.ERR_STALE_SCHOOL_YEAR_VERSION"]
        distinguishing_aspect: "OCC on SchoolYear.version: after the first extract create bumps the year version, a second create replaying the pre-create expected_school_year_version is rejected 412 — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Clock default. TX district LIVE; spec PUBLISHED; year CLOSED_FOR_REPORTING with one full-year ACTIVE enrollment; first extract created with the post-close version (year version advances)."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - *k_y1_close
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { ex1: $.data.id }
          trigger:
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { err: $.data.error_id }
          assert:
            - "response status 412 with error_id == ERR_STALE_SCHOOL_YEAR_VERSION (${y1_v} is stale after the first create bumped the year version)"
            - "GET /sis/reporting-extracts?school_year_id=${y1} returns total_count == 1 (no supersede happened)"
            - "ReportingExtract.${ex1}.status remains DRAFT"

      - name: occ_rollover_create_with_stale_district_version_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[rollover-create-stale-district]", "errors.ERR_STALE_DISTRICT_VERSION"]
        distinguishing_aspect: "OCC on District.version: a rollover-run create replaying the activation-time district version after a first run was created is rejected 412; retrying with the fresh version succeeds and supersedes the PENDING first run."
        test_recipe:
          setup: ["Clock default. TX district LIVE; source year CLOSED_FOR_REPORTING; target year OPEN; first rollover run created with the district version captured at activation."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
            - *k_y1_open
            - &k_y2
              call: "POST /sis/school-years"
              payload: { district_id: "${d1}", label: "2027-2028", start_date: "2027-08-01T00:00:00Z", end_date: "2028-06-01T00:00:00Z", instructional_days: 180, count_date: "2027-10-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { y2: $.data.id }
            - &k_y2_open
              call: "POST /sis/school-years/${y2}/open"
              payload: {}
              as: DistrictAdmin
            - *k_y1_close
            - call: "POST /sis/rollover-runs"
              payload: { district_id: "${d1}", source_school_year_id: "${y1}", target_school_year_id: "${y2}", expected_district_version: "${d1_v}" }
              as: DistrictAdmin
              captures: { rr1: $.data.id }
          trigger:
            - call: "POST /sis/rollover-runs"
              payload: { district_id: "${d1}", source_school_year_id: "${y1}", target_school_year_id: "${y2}", expected_district_version: "${d1_v}" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
            - call: "GET /sis/districts/${d1}"
              payload: {}
              as: DistrictAdmin
              captures: { d1_v2: $.data.version }
            - call: "POST /sis/rollover-runs"
              payload: { district_id: "${d1}", source_school_year_id: "${y1}", target_school_year_id: "${y2}", expected_district_version: "${d1_v2}" }
              as: DistrictAdmin
              captures: { rr2: $.data.id }
          assert:
            - "stale create: 412 with error_id == ERR_STALE_DISTRICT_VERSION"
            - "fresh create succeeds 201 returning ${rr2}"
            - "RolloverRun.${rr1}.status == SUPERSEDED (superseded by the fresh create)"
            - "RolloverRun.${rr2}.status == PENDING"

  # ===========================================================================
  - section: rbac
    instances:

      - name: portal_user_reads_own_account_but_not_others
        claim_type: ownership_scope
        grounds: ["roles.PortalUser", "endpoints.GET_/sis/portal-accounts/{id}", "errors.ERR_FORBIDDEN"]
        distinguishing_aspect: "PortalUser is entity_backed by PortalAccount: X-User-ID equal to the account id reads it (200); the same role against another account's id is 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Clock default. TX district LIVE; two students each with a portal account (pa_a, pa_b)."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_st1
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S002", first_name: "Bo", last_name: "Reyes", birth_date: "2013-09-09T00:00:00Z", entry_grade_level: "KG" }
              as: Registrar
              captures: { st2: $.data.id }
            - call: "POST /sis/portal-accounts"
              payload: { student_id: "${st1}", account_type: "STUDENT", access_level: "FULL" }
              as: DistrictAdmin
              captures: { pa_a: $.data.id }
            - call: "POST /sis/portal-accounts"
              payload: { student_id: "${st2}", account_type: "STUDENT", access_level: "GRADES_ONLY" }
              as: DistrictAdmin
              captures: { pa_b: $.data.id }
          trigger:
            - call: "GET /sis/portal-accounts/${pa_a}"
              payload: {}
              as: PortalUser
              as_user_id: "${pa_a}"
              captures: { own_ok: $.data.id }
            - call: "GET /sis/portal-accounts/${pa_b}"
              payload: {}
              as: PortalUser
              as_user_id: "${pa_a}"
              captures: { err: $.data.error_id }
          assert:
            - "own-account read succeeds 200 (${own_ok} == ${pa_a})"
            - "other-account read rejected 403 with error_id == ERR_FORBIDDEN"

      - name: portal_user_cannot_create_students
        claim_type: role_denial
        grounds: ["roles.PortalUser", "roles.Registrar", "errors.ERR_FORBIDDEN"]
        distinguishing_aspect: "PortalUser holds no write surface at all: POST /sis/students as PortalUser is 403 ERR_FORBIDDEN even with a well-formed payload."
        test_recipe:
          setup: ["Clock default. TX district LIVE."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
          trigger:
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S900", first_name: "No", last_name: "Access", birth_date: "2011-01-01T00:00:00Z", entry_grade_level: "09" }
              as: PortalUser
              as_user_id: "00000000-0000-4000-8000-000000000002"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_FORBIDDEN"
            - "GET /sis/students?district_id=${d1} returns total_count == 0"

      - name: state_reporter_cannot_open_school_year
        claim_type: role_denial
        grounds: ["roles.StateReporter", "roles.DistrictAdmin", "errors.ERR_FORBIDDEN"]
        distinguishing_aspect: "Peer-role separation: year lifecycle operations are DistrictAdmin-exclusive; the StateReporter (who owns extracts) cannot open a year."
        test_recipe:
          setup: ["Clock default. TX district LIVE; year in PLANNING."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
          trigger:
            - call: "POST /sis/school-years/${y1}/open"
              payload: {}
              as: StateReporter
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_FORBIDDEN"
            - "SchoolYear.${y1}.status remains PLANNING"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: rollover_execute_twice_returns_not_pending
        claim_type: idempotent_action_rejection
        grounds: ["state_machines.RolloverRun.PENDING_to_COMMITTED", "errors.ERR_ROLLOVER_NOT_PENDING", "complexity_profile.complexity_layers[ops_run_checkpoint]"]
        distinguishing_aspect: "The rollover checkpoint is one-shot: after COMMITTED, a second execute is rejected 409 ERR_ROLLOVER_NOT_PENDING and the committed counters do not move."
        test_recipe:
          setup: ["Clock default. TX district LIVE; source year CLOSED_FOR_REPORTING with one grade-09 ACTIVE enrollment; target year OPEN; rollover run created and executed once."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - *k_y2
            - *k_y2_open
            - *k_y1_close
            - call: "POST /sis/rollover-runs"
              payload: { district_id: "${d1}", source_school_year_id: "${y1}", target_school_year_id: "${y2}", expected_district_version: "${d1_v}" }
              as: DistrictAdmin
              captures: { rr1: $.data.id }
            - call: "POST /sis/rollover-runs/${rr1}/execute"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /sis/rollover-runs/${rr1}/execute"
              payload: {}
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_ROLLOVER_NOT_PENDING"
            - "RolloverRun.${rr1}.promoted_count remains 1 and status remains COMMITTED"
            - "GET /sis/enrollments?school_year_id=${y2}&lifecycle=ACTIVE still returns total_count == 1"

      - name: archived_student_hidden_from_default_list
        claim_type: soft_delete_filtering
        grounds: ["endpoints.GET_/sis/students", "state_machines.Student.INACTIVE_to_ARCHIVED", "complexity_profile.complexity_layers"]
        distinguishing_aspect: "Archival is soft: a student archived by rollover disappears from the default list but remains retrievable via the explicit status=ARCHIVED filter."
        test_recipe:
          setup: ["Clock default. TX district LIVE; source year OPEN with one enrollment withdrawn (student INACTIVE); source CLOSED_FOR_REPORTING; target year OPEN; rollover executed (archives the INACTIVE student)."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - call: "POST /sis/enrollments/${en1}/withdraw"
              payload: { exit_date: "2026-11-09T00:00:00Z" }
              as: Registrar
            - *k_y2
            - *k_y2_open
            - *k_y1_close
            - call: "POST /sis/rollover-runs"
              payload: { district_id: "${d1}", source_school_year_id: "${y1}", target_school_year_id: "${y2}", expected_district_version: "${d1_v}" }
              as: DistrictAdmin
              captures: { rr1: $.data.id }
            - call: "POST /sis/rollover-runs/${rr1}/execute"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "GET /sis/students"
              payload: { district_id: "${d1}" }
              as: Registrar
          assert:
            - "RolloverRun.${rr1}.archived_student_count == 1"
            - "Student.${st1}.status == ARCHIVED"
            - "GET /sis/students?district_id=${d1} returns total_count == 0 (archived excluded by default)"
            - "GET /sis/students?district_id=${d1}&status=ARCHIVED returns total_count == 1"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascade_coverage
        grounds: ["complexity_profile.complexity_layers[cascading_side_effects]"]
        excluded_because:
          difficulty_instance: rollover_graduation_portal_cascade_depth3
          rationale: "The N-level cascade chain is asserted hop-by-hop there and in discipline_approve_absence_cascade_depth2."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_coverage
        grounds: ["complexity_profile.complexity_layers[dual_variant_calculation]"]
        excluded_because:
          difficulty_instance: fte_adm_vs_count_date_divergence_on_enrollment
          rationale: "Both variants' outputs and divergence are asserted there; severity variant divergence is asserted in severity_cap_variant_by_action_type."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: enrollment_create_response_carries_computed_fields
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "entities.Enrollment.fields.membership_days"]
        distinguishing_aspect: "Immediate consistency: the POST /sis/enrollments response itself carries the computed membership_days (304), fte_adm (1.0), fte_count_date (1.0), absence_posture (CLEAR) and the student's ENROLLED status — no re-fetch or settle delay."
        test_recipe:
          setup: ["Clock default. TX district LIVE; spec PUBLISHED; year OPEN; one student."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
          trigger:
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st1}", school_year_id: "${y1}", grade_level: "09", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { en1: $.data.id, en_days: $.data.membership_days, en_fte: $.data.fte_adm, en_posture: $.data.absence_posture }
          assert:
            - "create response itself has ${en_days} == 304, ${en_fte} == 1.0, ${en_posture} == CLEAR"
            - "GET /sis/students/${st1} immediately shows status == ENROLLED"
