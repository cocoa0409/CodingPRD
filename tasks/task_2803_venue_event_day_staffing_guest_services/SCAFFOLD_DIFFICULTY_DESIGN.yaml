              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z950", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /accessibility-resources"
              payload: { event_id: "${ev_id}", resource_type: "WHEELCHAIR_ESCORT", zone_code: "Z950", unit_count: 3 }
              as: GuestServicesSupervisor
              captures: { res_id: $.data.id }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_id}", guest_reference: "G-77120", window_start: "2026-09-12T18:00:00Z", window_end: "2026-09-12T20:00:00Z", units_requested: 2 }
              as: GuestServicesSupervisor
              captures: { req_id: $.data.id }
            - call: "PATCH /accessibility-resources/${res_id}"
              payload: { status: "MAINTENANCE" }
              as: GuestServicesSupervisor
          trigger:
            - call: "POST /accessibility-requests/${req_id}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
            - call: "PATCH /accessibility-resources/${res_id}"
              payload: { status: "AVAILABLE" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests/${req_id}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
          assert:
            - "the first transition returns 409 with data.error_id == ERR_RESOURCE_NOT_AVAILABLE (the resource is in MAINTENANCE)"
            - "after that refusal AccessibilityRequest.${req_id}.status == REQUESTED and confirmed_at == null"
            - "after that refusal AccessibilityResource.${res_id}.peak_committed_units == 0: the peak must not be recomputed on a refused confirmation"
            - "the second transition returns 200: AccessibilityRequest.${req_id}.status == CONFIRMED and confirmed_at == 2026-09-12T15:00:00.000Z"
            - "AccessibilityResource.${res_id}.peak_committed_units == 2 and unit_count == 3 after the successful confirmation"
            - "AccessibilityRequest.${req_id}.companion_seats_requested == 0 by default (it was omitted from the create payload)"
            - "attempting the same CONFIRMED transition a third time returns 409 ERR_ACCESS_REQUEST_STATE_INVALID, and peak_committed_units stays 2 (no double counting)"

  # =====================================================================================
  # Rule 8 - resource / temporal overlap on DIFFERENT resource entities with
  # DIFFERENT interval semantics (gap-buffer between closed windows vs half-open concurrency)
  # =====================================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: shift_rest_buffer_exact_30_minute_gap
        grounds:
          - validations[priority=14]
          - constants.REST_BUFFER_MINUTES
          - errors.ERR_SHIFT_REST_CONFLICT
          - endpoints.POST_/staff-assignments
          - entities.PositionSlot.fields.shift_start
        distinguishing_aspect: |
          Resource entity: StaffMember. Interval semantics: NON-overlap plus a mandatory rest GAP -
          two shift windows may not even touch, they must be separated by at least
          REST_BUFFER_MINUTES 30, and the boundary is inclusive (exactly 30 is allowed, 29 refused).
          Both sides of the existing shift are probed, so an implementation that only looks forward
          from shift_end passes the trailing case and fails the leading one.
        test_recipe:
