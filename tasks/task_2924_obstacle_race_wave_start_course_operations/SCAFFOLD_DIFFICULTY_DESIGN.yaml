  - rule_id: non_linear_state_machine
    instances:
      - name: permit_revision_loop_reenters_submitted_and_counts_unbounded_rounds
        grounds:
          - state_machines.LandUsePermit.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.LandUsePermit.REVISION_REQUESTED_to_SUBMITTED
          - entities.LandUsePermit.fields.revision_rounds
          - entities.LandUsePermit.fields.submitted_by_user_id
        distinguishing_aspect: |
          LandUsePermit.status is not a one-way pipeline: SUBMITTED -> REVISION_REQUESTED ->
          SUBMITTED is an unbounded loop whose only trace is revision_rounds, and each re-entry
          overwrites submitted_by_user_id, so after two revision decisions the permit is on its
          third pass through SUBMITTED with revision_rounds == 2 and can still be APPROVED.
        test_recipe:
          setup:
            - "One venue with site_posture OPEN."
            - "One permit application that has been submitted by designer-1, sent back for revision, resubmitted by designer-2, sent back a second time, and resubmitted again."
            - "The permit therefore sits in SUBMITTED with revision_rounds == 2 and submitted_by_user_id == designer-2."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Birch Hollow", terrain_type: "FOREST", water_access: "RIVER", land_use_zone: "CN-3", protected_acreage_sqm: 800, restoration_bond_cents: 400000 }
