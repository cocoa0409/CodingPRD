  # ---------------------------------------------------------------------------
  # Rule 4 - transitive cascade chains from different triggering transitions
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: incident_substantiation_cascade_depth_four
        grounds:
          - state_machines.ComplianceIncident.transitions.UNDER_INVESTIGATION_to_SUBSTANTIATED
          - state_machines.Tutor.transitions.TRAINED_to_SUSPENDED
          - state_machines.TutorAssignment.transitions.ACTIVE_to_TERMINATED
          - calculations.tutor_compliance_penalty
          - calculations.support_requirement_hours
        distinguishing_aspect: |
          Depth-4 chain triggered by ComplianceIncident UNDER_INVESTIGATION -> SUBSTANTIATED:
          the incident raises Tutor.penalty_points to 3, which (because of that) suspends the
          tutor, which (because of that) terminates assignment A1 with terminated_reason
          TUTOR_SUSPENDED, which (because of that) drops Tutor.assigned_weekly_hours to 0.00
          and re-runs support_requirement_hours, lifting required_study_hall_hours 6.0 -> 10.0.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) is OPEN; SOCI-150 meets ISO weekdays [1, 3, 5] at minute 600 UTC for 180 minutes."
            - "Student S9 has no declared_program_id and no COMPLETED enrollment (cumulative_gpa 0.00) and is ENROLLED in SOCI-150."
            - "S9 carries a 6.00-unit missed-class charge against a 9.00 allowance."
            - "Tutor T2 (subject_codes [\"SOCI\"], max_weekly_hours 20.00) is TRAINED, and TutorAssignment A2 (weekly_hours 8.00) is ACTIVE, so Tutor.assigned_weekly_hours == 8.00 and S9.required_study_hall_hours == 6.0."
            - "ComplianceIncident I1 (EXCESSIVE_TUTOR_HOURS, tutor T2, student S9) is SUBSTANTIATED at LEVEL_II, so Tutor.penalty_points == 2, S9.substantiated_penalty_points == 2.00 and S9.risk_score == 60.83 with risk_tier TIER_3."
            - "ComplianceIncident I2 (UNTRAINED_TUTOR_SESSION, tutor T2, student S9) is in status UNDER_INVESTIGATION."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 180 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Nine", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s9_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s9_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e9_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "TRACK", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-17T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev9_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev9_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev9_id}", enrollment_id: "${e9_id}" }
              as: AcademicAdvisor
              captures: { req9_id: $.data.id }
            - call: "POST /athletics/tutors"
              payload: { full_name: "Tom Tutor", subject_codes: ["SOCI"] }
              as: LearningSpecialist
              captures: { t2_id: $.data.id }
            - call: "POST /athletics/tutors/${t2_id}/status"
              payload: { action: "COMPLETE_TRAINING", term_id: "${term1_id}" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t2_id}", enrollment_id: "${e9_id}", weekly_hours: 8.00 }
              as: LearningSpecialist
              captures: { a2_id: $.data.id }
            - call: "POST /athletics/tutor-assignments/${a2_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
            - call: "POST /athletics/compliance-incidents"
              payload: { student_athlete_id: "${s9_id}", incident_type: "EXCESSIVE_TUTOR_HOURS", narrative: "Tutor logged hours beyond the approved weekly allotment.", tutor_id: "${t2_id}" }
              as: ComplianceOfficer
              captures: { i1_id: $.data.id }
            - call: "POST /athletics/compliance-incidents/${i1_id}/status"
              payload: { action: "OPEN_INVESTIGATION" }
              as: ComplianceOfficer
            - call: "POST /athletics/compliance-incidents/${i1_id}/status"
              payload: { action: "SUBSTANTIATE", severity: "LEVEL_II" }
              as: ComplianceOfficer
            - call: "POST /athletics/compliance-incidents"
              payload: { student_athlete_id: "${s9_id}", incident_type: "UNTRAINED_TUTOR_SESSION", narrative: "A second review found an unapproved session with the same tutor.", tutor_id: "${t2_id}" }
              as: ComplianceOfficer
              captures: { i2_id: $.data.id }
            - call: "POST /athletics/compliance-incidents/${i2_id}/status"
              payload: { action: "OPEN_INVESTIGATION" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /athletics/compliance-incidents/${i2_id}/status"
              payload: { action: "SUBSTANTIATE", severity: "LEVEL_I" }
              as: ComplianceOfficer
          assert:
            - "Hop 1: ComplianceIncident.${i2_id}.status == SUBSTANTIATED and ComplianceIncident.${i2_id}.penalty_points_assessed == 1.00"
            - "Hop 2: Tutor.${t2_id}.penalty_points == 3 and Tutor.${t2_id}.status == SUSPENDED"
            - "Hop 3: TutorAssignment.${a2_id}.status == TERMINATED and TutorAssignment.${a2_id}.terminated_reason == TUTOR_SUSPENDED"
            - "Hop 4: Tutor.${t2_id}.assigned_weekly_hours == 0.00 and StudentAthlete.${s9_id}.required_study_hall_hours == 10.0"
            - "StudentAthlete.${s9_id}.substantiated_penalty_points == 3.00"
            - "StudentAthlete.${s9_id}.risk_score == 64.58 and StudentAthlete.${s9_id}.risk_tier == TIER_3"
            - "StudentAthlete.${s9_id}.support_status == SUPPORT_MANDATED"
            - "StudentAthlete.${s9_id}.missed_class_units_charged == 6.00 (unchanged by the incident cascade)"

      - name: event_cancellation_cascade_refund_chain
        grounds:
          - state_machines.CompetitionEvent.transitions.TRAVEL_APPROVED_to_CANCELLED
          - state_machines.MissedClassRequest.transitions.ACKNOWLEDGED_to_VOIDED
          - state_machines.StudentAthlete.transitions.SUPPORT_MANDATED_to_SUPPORT_NORMAL
          - calculations.missed_class_units
        distinguishing_aspect: |
          Depth-3 chain triggered by CompetitionEvent TRAVEL_APPROVED -> CANCELLED, a
          different triggering transition from the incident-substantiation cascade:
          cancelling the event voids the ACKNOWLEDGED request, and because the request left
          the charged set the student's missed_class_units_charged falls 9.00 -> 0.00, which
          in turn re-scores risk 20.00 -> 0.00 and moves support_status back to SUPPORT_NORMAL.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) is OPEN; KINE-101 has 12 credit hours; SOCI-150 meets ISO weekdays [1, 3, 5] at minute 600 UTC for 180 minutes with instructor_user_id instr_soc_1."
            - "Student S10 completed KINE-101 with grade B (cumulative_gpa 3.00) and is ENROLLED in SOCI-150; S10 has no declared_program_id."
            - "CompetitionEvent EV10 (REGULAR_SEASON, multiplier 1.0) travels 2026-09-14T08:00:00Z to 2026-09-19T00:00:00Z and is TRAVEL_APPROVED."
            - "MissedClassRequest R10 charged 9.00 units (three 180-minute meetings), was notified at 2026-09-01T00:00:00Z (13 days before departure, above the 7-day lead) and acknowledged by instr_soc_1, so R10.status == ACKNOWLEDGED."
            - "Before the trigger S10.missed_class_units_charged == 9.00, missed_class_units_remaining == 0.00, risk_score == 20.00, risk_tier == TIER_2, support_status == SUPPORT_MANDATED and required_study_hall_hours == 7.0."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "101", title: "Foundations of Kinesiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 180 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Ten", sport_code: "MBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s10_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s10_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e10_kine_id: $.data.id }
            - call: "POST /athletics/enrollments/${e10_kine_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s10_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e10_soci_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "MBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-19T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev10_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev10_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev10_id}", enrollment_id: "${e10_soci_id}" }
              as: AcademicAdvisor
              captures: { r10_id: $.data.id }
            - call: "POST /athletics/missed-class-requests/${r10_id}/status"
              payload: { action: "NOTIFY_INSTRUCTOR" }
              as: AcademicAdvisor
            - call: "POST /athletics/missed-class-requests/${r10_id}/status"
              payload: { action: "ACKNOWLEDGE", instructor_response_note: "Attendance excused; make-up quiz scheduled." }
              as: Instructor
              as_user_id: "instr_soc_1"
          trigger:
            - call: "POST /athletics/competition-events/${ev10_id}/status"
              payload: { action: "CANCEL" }
              as: AthleticsOperations
          assert:
            - "Hop 1: CompetitionEvent.${ev10_id}.status == CANCELLED"
            - "Hop 2: MissedClassRequest.${r10_id}.status == VOIDED and MissedClassRequest.${r10_id}.missed_units == 9.00 is retained on the row"
            - "Hop 3: StudentAthlete.${s10_id}.missed_class_units_charged == 0.00 and StudentAthlete.${s10_id}.missed_class_units_remaining == 9.00"
            - "CompetitionEvent.${ev10_id}.charged_units_total == 0.00"
            - "StudentAthlete.${s10_id}.risk_score == 0.00 and StudentAthlete.${s10_id}.risk_tier == TIER_1"
            - "StudentAthlete.${s10_id}.support_status == SUPPORT_NORMAL"
            - "StudentAthlete.${s10_id}.required_study_hall_hours == 0.0"

  # ---------------------------------------------------------------------------
  # Rule 5 - validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_missed_class_request_create
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - errors[ERR_EVENT_NOT_TRAVEL_APPROVED]
          - errors[ERR_MISSED_CLASS_ALLOWANCE_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (priority 10) vs business_fiscal (priority 15): one request
          violates both ERR_EVENT_NOT_TRAVEL_APPROVED and ERR_MISSED_CLASS_ALLOWANCE_EXCEEDED
          and the response is the state error with HTTP 409, never the 422 fiscal error.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) is OPEN; SOCI-150 meets ISO weekdays [1, 3, 5] at minute 600 UTC for 180 minutes."
            - "Student S11 is ENROLLED in SOCI-150 and has already spent its whole allowance: missed_class_units_charged == 9.00 and missed_class_units_remaining == 0.00, via a 9.00-unit request against the TRAVEL_APPROVED event EV11."
            - "CompetitionEvent EV12 (REGULAR_SEASON) travels 2026-10-05T08:00:00Z to 2026-10-06T00:00:00Z, covering exactly the Monday 2026-10-05 meeting worth 3.00 units, and is still in status SCHEDULED."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 180 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Eleven", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s11_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s11_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e11_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "WBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-19T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev11_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev11_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev11_id}", enrollment_id: "${e11_id}" }
              as: AcademicAdvisor
              captures: { r11_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "WBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-10-05T08:00:00Z", return_at: "2026-10-06T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev12_id: $.data.id }
          trigger:
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev12_id}", enrollment_id: "${e11_id}" }
              as: AcademicAdvisor
          assert:
            - "The trigger response is HTTP 409 with data.error_id == ERR_EVENT_NOT_TRAVEL_APPROVED"
            - "data.error_id != ERR_MISSED_CLASS_ALLOWANCE_EXCEEDED even though the 3.00 requested units exceed the 0.00 remaining allowance"
            - "MissedClassRequest.${r11_id}.missed_units == 9.00 and StudentAthlete.${s11_id}.missed_class_units_charged == 9.00 (unchanged)"
            - "CompetitionEvent.${ev12_id}.charged_units_total == 0.00 and CompetitionEvent.${ev12_id}.status == SCHEDULED"
            - "GET /athletics/missed-class-requests with competition_event_id = ${ev12_id} returns total_count == 0"

      - name: safety_beats_referential_on_tutor_assignment_create
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_TUTOR_NOT_TRAINED]
          - errors[ERR_TUTOR_SUBJECT_MISMATCH]
        distinguishing_aspect: |
          Category pair business_safety (priority 11) vs business_referential (priority 12) -
          a different pair from the state/business_fiscal conflict: an UNTRAINED tutor whose
          subject_codes ["MATH"] also mismatch the SOCI enrollment returns
