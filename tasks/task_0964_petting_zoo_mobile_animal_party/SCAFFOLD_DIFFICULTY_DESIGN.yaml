            - "${err1} == ERR_HEALTH_CERT_EXPIRED (cert 2026-06-05 < booking end 2026-06-06T12:00)"
            - "After the new PASS record, Animal.${a_goat}.current_health_cert_expires_at == 2026-07-01T00:00:00Z and ${st2} == CONFIRMED"

      - name: reptile_addon_requires_certified_handler
        grounds:
          - state_machines.AddOnRequest.REQUESTED_to_APPROVED
          - validations[priority=18]
        distinguishing_aspect: |
          Entity pair AddOnRequest -> StaffAssignment/Handler: approving a
          REPTILE_SHOW add-on is gated on an ASSIGNED handler carrying
          REPTILE_CERTIFIED certification; it fails with ERR_NO_CERTIFIED_HANDLER
          until such a handler is assigned — a third distinct entity pair.
        test_recipe:
          setup:
            - "Clock 2026-05-10; PRIVATE customer; venue OUTDOOR; booking 2026-06-17 14:00-16:00 (DRAFT), REPTILE_SHOW add-on REQUESTED (30min)"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c16@x.com", full_name: "Cust Sixteen", customer_type: "PRIVATE" }, as: Anonymous, captures: { c16: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c16}", captures: { v16: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v16}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c16}", captures: { bk: $.data.id, bk_v: $.data.version } }
            - { call: "POST /petting-zoo/bookings/${bk}/add-ons", payload: { addon_type: "REPTILE_SHOW", duration_minutes: 30, expected_booking_version: "${bk_v}" }, as: Customer, as_user_id: "${c16}", captures: { ao: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/add-ons/${ao}/decide", payload: { decision: "APPROVED" }, as: Coordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /petting-zoo/handlers", payload: { name: "Rex", certifications: ["REPTILE_CERTIFIED"] }, as: Operator, captures: { h1: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/staff-assignments", payload: { handler_id: "${h1}", role: "LEAD" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/add-ons/${ao}/decide", payload: { decision: "APPROVED" }, as: Coordinator, captures: { st2: $.data.status } }
          assert:
            - "${err1} == ERR_NO_CERTIFIED_HANDLER while no REPTILE_CERTIFIED handler is ASSIGNED"
            - "After assigning Rex (REPTILE_CERTIFIED), ${st2} == APPROVED — same decide call, gated by the linked Handler's certifications"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: animal_buffered_window_conflict
        grounds:
          - calculations.animal_rest_window
          - validations[priority=15]
        distinguishing_aspect: |
          Interval semantics = buffered half-open intervals on the Animal
          resource: each confirmed booking occupies [start-4h, end+4h), so a
          10:00-12:00 confirmation blocks a 15:00 start (15:00 < 16:00 buffered
          end) with ERR_ANIMAL_SCHEDULE_CONFLICT — the sibling rule is an
          aggregate daily-minutes capacity on the Handler resource with
          adjacency allowed, a different geometric treatment.
        test_recipe:
          setup:
            - "Clock 2026-05-10; PRIVATE customer; venue; goat with PASS cert to 2026-07-01"
            - "Booking A 2026-06-06 10:00-12:00 with goat CONFIRMED (buffered occupation 06:00-16:00)"
            - "Booking B 2026-06-06 15:00-17:00 with goat attached PROPOSED"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c17@x.com", full_name: "Cust Seventeen", customer_type: "PRIVATE" }, as: Anonymous, captures: { c17: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c17}", captures: { v17: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v17}", start_time: "2026-06-06T10:00:00Z", end_time: "2026-06-06T12:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c17}", captures: { bk_a: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk_a}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba_a: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk_a}/animals/${ba_a}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v17}", start_time: "2026-06-06T15:00:00Z", end_time: "2026-06-06T17:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c17}", captures: { bk_b: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk_b}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba_b: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk_b}/animals/${ba_b}/confirm", payload: {}, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ANIMAL_SCHEDULE_CONFLICT: B's buffered start 11:00 < A's buffered end 16:00 and A's buffered start 06:00 < B's buffered end 21:00"
            - "BookingAnimal.${ba_b}.status remains PROPOSED"

      - name: handler_daily_aggregate_capacity
        grounds:
          - calculations.handler_daily_capacity
          - validations[priority=16]
        distinguishing_aspect: |
          Interval semantics = aggregate daily-minute capacity with
          adjacency-allowed strict overlap on the Handler resource: two 240-minute
          non-overlapping assignments on the same date reach exactly 480 minutes
          (allowed, <= boundary), and a third 60-minute assignment pushes the
          total to 481 > 480 producing ERR_HANDLER_OVERBOOKED — no rest buffer
          involved, unlike the sibling Animal rule.
        test_recipe:
          setup:
            - "Clock 2026-05-10; PRIVATE customer; venue; handler Hank"
            - "Bookings on 2026-06-20: A 09:00-13:00 (240min), B 14:00-18:00 (240min, adjacent-free), C 18:30-19:30 (60min) — none strictly overlap"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c18@x.com", full_name: "Cust Eighteen", customer_type: "PRIVATE" }, as: Anonymous, captures: { c18: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c18}", captures: { v18: $.data.id } }
            - { call: "POST /petting-zoo/handlers", payload: { name: "Hank", certifications: ["FIRST_AID"] }, as: Operator, captures: { h1: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v18}", start_time: "2026-06-20T09:00:00Z", end_time: "2026-06-20T13:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c18}", captures: { bk_a: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v18}", start_time: "2026-06-20T14:00:00Z", end_time: "2026-06-20T18:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c18}", captures: { bk_b: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v18}", start_time: "2026-06-20T18:30:00Z", end_time: "2026-06-20T19:30:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c18}", captures: { bk_c: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk_a}/staff-assignments", payload: { handler_id: "${h1}", role: "LEAD" }, as: Coordinator, captures: { sa_a: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk_b}/staff-assignments", payload: { handler_id: "${h1}", role: "LEAD" }, as: Coordinator, captures: { sa_b: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk_c}/staff-assignments", payload: { handler_id: "${h1}", role: "LEAD" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "Assignments A and B succeeded: exactly 480 aggregate minutes is allowed (<= boundary, adjacency not an overlap)"
            - "${err} == ERR_HANDLER_OVERBOOKED: 480 + 60 = 540 > 480 daily capacity"
            - "GET /petting-zoo/handlers/${h1} scheduled_minutes_total == 480"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: weather_cancel_money_conservation
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.WEATHER_HOLD_to_CANCELLED_WEATHER
        distinguishing_aspect: |
          Conserved quantity = customer money: forward PAYMENT (5181) paired with
          the compensating WEATHER-cancel entries leaves REFUND (2681) + FORFEIT
          (2500 non-recoverable permit fee) exactly equal to PAYMENT — a
          cents-exact fiscal invariant; the sibling conserves handler minutes, a
          different quantity.
        test_recipe:
          setup:
            - "Sheep fixture CONFIRMED on a venue with requires_animal_permit=true; ANIMAL_EXHIBITION permit ISSUED; quoted 17270, deposit 5181 paid, CONFIRMED"
            - "Clock advanced to 2026-06-16T10:00:00Z; fresh MANDATORY_HOLD assessment; booking on WEATHER_HOLD"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c19@x.com", full_name: "Cust Nineteen", customer_type: "PRIVATE" }, as: Anonymous, captures: { c19: $.data.id } }
            - { call: "POST /petting-zoo/customers/${c19}/insurance-certificates", payload: { provider: "Acme Mutual", policy_number: "POL-19", coverage_amount_cents: 500000, expires_at: "2027-01-01T00:00:00Z" }, as: Customer, as_user_id: "${c19}", captures: { cert19: $.data.id } }
            - { call: "POST /petting-zoo/insurance-certificates/${cert19}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /petting-zoo/venues", payload: { name: "County Fairground", address: "4 Fair Rd", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 15, max_guest_capacity: 300, requires_animal_permit: true, requires_handwash_stations: true }, as: Customer, as_user_id: "${c19}", captures: { v19: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Shelly", species: "SHEEP", weight_class: "MEDIUM", temperament_tier: 3, base_event_fee_cents: 9000 }, as: Operator, captures: { a_sheep: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_sheep}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v19}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 20, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c19}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_sheep}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/payments", payload: { amount_cents: 5181, method: "CARD" }, as: Customer, as_user_id: "${c19}" }
            - { call: "POST /petting-zoo/bookings/${bk}/permits", payload: { permit_type: "ANIMAL_EXHIBITION", jurisdiction: "County Fair Board" }, as: Coordinator, captures: { p1: $.data.id } }
            - { call: "POST /petting-zoo/permits/${p1}/submit", payload: {}, as: Coordinator, as_user_id: "coord-1" }
            - { call: "POST /petting-zoo/permits/${p1}/decide", payload: { decision: "ISSUED" }, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /petting-zoo/bookings/${bk}/confirm", payload: {}, as: Customer, as_user_id: "${c19}" }
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-06-16T10:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/bookings/${bk}/weather-assessments", payload: { assessed_at: "2026-06-16T09:30:00Z", forecast_temp_f: 38, forecast_precip_pct: 90, wind_mph: 35, verdict: "MANDATORY_HOLD" }, as: Coordinator, captures: { wa1: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/weather-hold", payload: { weather_assessment_id: "${wa1}" }, as: Coordinator }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/cancel", payload: { reason: "WEATHER" }, as: Coordinator }
          assert:
            - "Ledger for ${bk}: PAYMENT 5181; REFUND == 2681 (5181 - 2500 for the one ISSUED permit); FORFEIT == 2500"
            - "Invariant: sum(PAYMENT) == sum(REFUND) + sum(FORFEIT) -> 5181 == 2681 + 2500 exactly"
            - "Booking.${bk}.status == CANCELLED_WEATHER and payment_status == REFUND_PARTIAL"

      - name: assign_release_handler_minutes_conservation
        grounds:
          - state_machines.StaffAssignment.ASSIGNED_to_RELEASED
          - entities.Handler.fields.scheduled_minutes_total
        distinguishing_aspect: |
          Conserved quantity = handler scheduled minutes: the forward action
          (assign, +120) paired with its compensating cascade action (booking
          cancel releases the assignment, -120) leaves
          Handler.scheduled_minutes_total at its pre-assignment value 0 — a
          capacity-minutes invariant, distinct from the sibling's money
          invariant.
        test_recipe:
          setup:
            - "Clock 2026-05-10; PRIVATE customer; venue; DRAFT booking 2026-06-20 10:00-12:00 (120 minutes); handler Hank with scheduled_minutes_total == 0"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c20@x.com", full_name: "Cust Twenty", customer_type: "PRIVATE" }, as: Anonymous, captures: { c20: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c20}", captures: { v20: $.data.id } }
            - { call: "POST /petting-zoo/handlers", payload: { name: "Hank", certifications: ["FIRST_AID"] }, as: Operator, captures: { h1: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v20}", start_time: "2026-06-20T10:00:00Z", end_time: "2026-06-20T12:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c20}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/staff-assignments", payload: { handler_id: "${h1}", role: "LEAD" }, as: Coordinator, captures: { sa: $.data.id } }
            - { call: "GET /petting-zoo/handlers/${h1}", payload: {}, as: Operator, captures: { min_mid: $.data.scheduled_minutes_total } }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/cancel", payload: { reason: "CUSTOMER" }, as: Customer, as_user_id: "${c20}" }
            - { call: "GET /petting-zoo/handlers/${h1}", payload: {}, as: Operator, captures: { min_end: $.data.scheduled_minutes_total } }
          assert:
            - "${min_mid} == 120 (forward action added the 120-minute event)"
            - "${min_end} == 0 (compensating release restored the pre-assignment value — no drift)"
            - "StaffAssignment.${sa}.status == RELEASED with release_reason == BOOKING_CANCELLED"
            - "Booking.${bk}.status == CANCELLED_CUSTOMER; no ledger entries created (total_paid_cents == 0)"
