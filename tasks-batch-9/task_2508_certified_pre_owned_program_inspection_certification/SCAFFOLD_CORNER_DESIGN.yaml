            - "Certification.${c1}.status is still SUBMITTED after trigger call 1"
            - "trigger call 2 returns 409 ERR_VEHICLE_NOT_IN_INVENTORY, and Certification.${c1} keeps status SUBMITTED, activated_at null, fee_charged_cents 0"
            - "trigger call 3 returns 200 with Vehicle.${v1}.inventory_state == IN_INVENTORY and cpo_state still CERTIFICATION_PENDING"
            - "trigger call 4 returns 200 with Certification.${c1}.status == ACTIVE, activated_at == 2026-08-01T00:00:00Z, fee_charged_cents == 120400"
