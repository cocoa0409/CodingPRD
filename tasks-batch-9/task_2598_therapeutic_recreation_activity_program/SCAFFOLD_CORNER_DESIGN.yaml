              as: ActivityAide
              captures: { r3_id: $.data.id }
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: ActivityDirector
            - call: "POST /recreation/sessions/${s1_id}/status"
              payload: { action: "START" }
              as: ActivityAide
            - call: "POST /recreation/sessions/${s2_id}/status"
              payload: { action: "START" }
